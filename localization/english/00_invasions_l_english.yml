l_english:

 invasions_1_title: "The Xiongnu Horde"
 invasions_1_desc: "In the distant lands of the eastern steppes a tribal confederation known as the Xiongnu, under their leader Chanyu Modun, have subjugated the majority tribes beyond the Altai Mountains. Fear is growing that the Chanyu's gaze is set further south and west."
 invasions_1.a: "This can't be good..."

 invasions_2_title: "The Wusun Migration"
 invasions_2_desc: "There is terrible news from the border. Beneath standards bearing the signs of the #E Wusun#!, a great host of steppe nomads has descended into the northern valleys. Families, herds, and wagons follow close behind this mounted vanguard, and this fearsome horde shows no sign of turning around, but continues its inexorable march into our territory. This is no raid from which the horsemen will simply return home, but a full-scale invasion of [ROOT.GetCountry.GetName]!"
 invasions_2_warning_desc: "My [ROOT.GetCountry.GetRulerTitle], merchants arriving from the east tell of unfamiliar riders gathering beyond the mountain passes. They call themselves #E Wusun#!, and they travel not merely with warriors, but with children, wagons, and herds stretching farther than the eye can see.\n\nTheir scouts have already been sighted along the roads leading north. If the reports are true, they are not searching for plunder — they are searching for a new homeland, and they expect to find it on our side of the frontier."
 invasions_2.a: "Then every pass must be watched."
 invasions_2_invasion.a: "We will destroy these barbarians!"
 invasions_2.b: "We will destroy these [ROOT.GetCountry.GetAdjective]s!"
 invasions_2_switch_tt: "#T We will tag switch and play as the#! #G Wusun#! #T horde.#!"
 invasions_2_tooltip: "The tribe of #Y [wusun_country_scope.GetName]#! declares war on #Y [wusun_invasion_defender.GetName]#! with the #Y Horde Conquest#! war goal."

 invasions_3_title: "Arrival of the Yuezhi"
 invasions_3_desc: "Merchants visiting [ROOT.GetCountry.GetCapital.GetName] bring news of great wars in the far east. A powerful confederacy of steppe tribes have utterly crushed their rivals, the so-called #E Yuezhi#!, and are now driving them from their lands. With no place to go, the Yuezhi are fleeing westward, and many of them are expected to arrive in our general region within the days to come."
 invasions_3.a: "How many more could there be... "
 invasions_3_tooltip: "Many #Y Yuezhi#! cultured tribesmen will appear in the #G Tarim Basin#!."

 invasions_4_title: "The Yuezhi People"
 invasions_4_desc: "Over the last few months, large groups of #E Yuezhi#! tribesmen from the steppe have settled within [ROOT.GetCountry.GetName]. At first, the numbers were small, but they have been steadily increasing, and seemingly overnight, parts of our country have been occupied by these nomads.\n\nWhenever our people have tried to approach their encampments, they have been met with icy indifference, if not outright hostility. The Yuezhi are a proud people, and they will not be content to simply pass through our lands. They will eventually start to demand things from us, and if we refuse, they will take it by force."
 invasions_4.a: "Embrace Yuezhi Culture"
 invasions_4.b: "We are not Yuezhi, we are [ROOT.GetCountry.GetAdjective]!"
 invasions_4_tooltip: "Gain access to the #Y Horde Conquest#! War goal for 25 years \nUp to #Y 50#! pops will become Yuezhi culture."

 invasions_5_title: "Yuezhi Invasion"
 invasions_5_desc: "[ROOT.GetCountry.GetRuler.GetName], our worst fears are realized. The barbarian hordes of the #E Yuezhi#! have appeared in the north and are flooding across the frontier. Our scouts report that they have already crushed a foreign army sent to stop them, and without anyone standing in their way, they are pouring into the valleys. The Yuezhi are a proud people, and they will not be content to simply settle in our lands. They will demand tribute, and if we refuse, they will take it by force."
 invasions_5_warning_desc: "My [ROOT.GetCountry.GetRulerTitle], we are receiving concerning reports of vast tribal migrations on the steppe. Although this is impossible for us to verify, it is said that entire clans are slowly but surely marching in our direction, accompanied by retinues of warriors and gigantic herds that defy description.\n\nIf these stories are correct, these barbarians are expected to cross the frontier within the coming year - we should prepare for the worst."
 invasions_5_warning.a: "Don't bother me with unfounded rumors..."
 invasions_5.a: "They won't get far...gods, I hope they don't get far."
 invasions_5.b: "I will lead the Yuezhi to a new homeland."
 invasions_5_switch_tt: "We will leave our current country and continue playing as the invading #Y Yuezhi#! horde."
 invasions_5_tooltip: "The tribe of #Y [yuezhi_country_scope.GetName]#! declares war on #Y [yuezhi_invasion_defender.GetName]#! with the #Y Horde Conquest#! war goal."

 invasions_6_title: "The Sakan Horde"
 invasions_6_desc: "The northern horizon has vanished in a cloud of dust. Across the frontier ride the #E Saka#!, who have seized provinces in our hinterland and declared war against us. [ROOT.GetCountry.GetRuler.GetName] tried to send embassies asking for peace, but our diplomats were murdered by the savages in cold blood.\n\nDesperate men may be bargained with, but a desperate people cannot be turned aside with words - a painful lesson that the [ROOT.GetCountry.GetRulerTitle] will never forget again. The Saka have come to carve out a homeland by seizing our rich valleys and cities, and we must meet them with bow and blade."
 invasions_6_warning_desc: "My [ROOT.GetCountry.GetRulerTitle], watchfires have appeared among the northern hills — first a handful, then hundreds, then more than any man could ever hope to count. Refugees from the north swear that these tribes, the #E Saka#!, have abandoned their old grazing lands and are carrying their households and possessions southward.\n\nThe news from the border was already grim. Sakan horsemen have been seen searching every ford and mountain path leading into our lands. They do not ride like raiders seeking an easy prize - they ride like men who have nowhere else to go and are probing our defenses."
 invasions_6.a: "Desperation will not grant them our lands!"
 invasions_6_invasion.a: "We will crush them and send them back to the steppe!"
 invasions_6.b: "I will ride south with the Saka..."
 invasions_6_switch_tt: "#T We will tag switch and play as the#! #G Saka#! #T horde.#!"
 invasions_6_tooltip: "The tribe of #Y [sakia_country_scope.GetName]#! declares war on #Y [sakia_invasion_defender.GetName]#! with the #Y Horde Conquest#! war goal."

 #invasions_7_title:0 "The Rise of Parthia"
 #invasions_7_desc:0 ""
 #invasions_7.a:0 "We're Doomed!"

 invasions_8_title: "Yuezhi Invasion of Bactria"
 invasions_8_desc: "The stories brought to us by our scouts are all the same; the mountains passes can no longer contain them. Columns of #E Yuezhi#! warriors are pouring down from the north, seizing towns and villages as their families and herds follow in their wake.\n\nOur walls, temples, and rich farmlands must seem like treasures beyond imagining to a people who have been driven from one homeland after another. They mean to break the kingdoms of Bactria, claim our valleys for themselves, and place enough mountains between their children and the wrath of their enemies that they may never be driven out again."
 invasions_8_warning_desc: "My [ROOT.GetCountry.GetRulerTitle], messengers from the northern satrapies bring grave news. The #E Yuezhi#! have been forced from the Ili Valley, and their scattered bands are gathering once more — this time along the roads descending into #E Bactria#!.\n\nOur spies report seeing mounted patrols testing the high passes. These are not the preparations of refugees begging passage...quite the contrary. Within the year, the full weight of their migration may fall upon us."
 invasions_8.a: "Bactria will not become their refuge as long as I am [ROOT.GetCountry.GetRulerTitle]!"
 invasions_8_A_tooltip: "The tribe of #Y [yuezhi_country_scope_2.GetName]#! declares war on #Y [yuezhi_bactria_invasion_defender.GetName]#! with the #Y Horde Conquest#! war goal."
 invasions_8_B_tooltip: "The tribe of #Y [yuezhi_country_scope.GetName]#! declares war on #Y [yuezhi_bactria_invasion_defender.GetName]#! with the #Y Horde Conquest#! war goal."

