l_english:

 invasions_1_title:0 "The Xiongnu Horde"
 invasions_1_desc:0 "In the distant lands of the eastern steppes a tribal confederation known as the Xiongnu, under their leader Chanyu Modun, have subjugated the majority tribes beyond the Altai Mountains. Fear is growing that the Chanyu's gaze is set further south and west."
 invasions_1.a:0 "This can't be good..."

 invasions_2_title:0 "The Wusun Migration"
 invasions_2_desc:0 "The rumors were true. Beneath standards bearing the signs of the #E Wusun#!, a great host has descended into the Ili Valley. Families, herds, and wagons follow close behind its mounted vanguard; this is no raid from which the horsemen will simply return home.\n\nLong ago driven from Gansu by the Yuezhi, the Wusun found protection beneath the shadow of the Xiongnu Chanyu. Now they return as conquerors, eager to seize the pastures promised to them and avenge generations of humiliation. Whatever claims we hold upon this land mean nothing to a people who believe that history itself has granted it to them."
 invasions_2_warning_desc:0 "My [ROOT.GetCountry.GetRulerTitle], merchants arriving from the east tell of unfamiliar riders gathering beyond the mountain passes. They call themselves #E Wusun#!, and they travel not merely with warriors, but with children, wagons, and herds stretching farther than the eye can see.\n\nTheir scouts have already been sighted along the roads into the Ili Valley. If the reports are true, they are not searching for plunder—they are searching for a new homeland, and they expect to find it on our side of the frontier."
 invasions_2.a:0 "Then every pass must be watched."
 invasions_2_tooltip:0 "The tribe of #Y [wusun_country_scope.GetName]#! declares war on #Y [wusun_invasion_defender.GetName]#! with the #Y Horde Conquest#! war goal."

 invasions_3_title:0 "Arrival of the Yuezhi"
 invasions_3_desc:0 "Merchants visiting [ROOT.GetCountry.GetCapital.GetName] bring news of great wars in the far east. A powerful confederacy of steppe tribes have crushed their rivals, the so-called #E Yuezhi#!, and are now driving them from their lands. With no place to go, the Yuezhi are fleeing westward, and many of them are expected to arrive in our lands within the days to come."
 invasions_3.a:0 "How many more could there be... "
 invasions_3_tooltip:0 "Many #Y Yuezhi#! cultured tribesmen will appear in the #G Tarim Basin#!."

 invasions_4_title:0 "The Yuezhi People"
 invasions_4_desc:0 "The Yuezhi are moving into the area at such great numbers, we must either embrace their ways or fight to maintain our culture as we know it."
 invasions_4.a:0 "Embrace Yuezhi Culture"
 invasions_4.b:0 "Fight them off"
 invasions_4_tooltip:0 "Gain access to the #Y Horde Conquest#! War goal for 25 years \nUp to #Y 50#! pops will become Yuezhi culture."

 invasions_5_title:0 "Yuezhi Invasion"
 invasions_5_desc:0 "Our worst fears are realized. The barbarian hordes of the #E Yuezhi#! have appeared in the north and are flooding across the frontier. Our scouts report that they have already crushed a foreign army sent to stop them, and without anyone standing in their way, they are pouring into the valleys. The Yuezhi are a proud people, and they will not be content to simply settle in our lands. They will demand tribute, and if we refuse, they will take it by force."
 invasions_5_warning_desc:0 "My [ROOT.GetCountry.GetRulerTitle], we are receiving concerning reports of vast tribal migrations on the steppe. Although this is impossible for us to verify, it is said that entire clans are slowly but surely marching in our direction, accompanied by retinues of warriors and gigantic herds that defy description.\n\nIf these stories are correct, these barbarians are expected to cross the frontier within the coming year - we should prepare for the worst."
 invasions_5_warning.a:0 "Don't bother me with unfounded rumors..."
 invasions_5.a:0 "They won't get far...gods, I hope they don't get far."
 invasions_5_tooltip:0 "The tribe of #Y [yuezhi_country_scope.GetName]#! declares war on #Y [yuezhi_invasion_defender.GetName]#! with the #Y Horde Conquest#! war goal."

 invasions_6_title:0 "The Sakan Horde"
 invasions_6_desc:0 "The northern horizon has vanished behind dust. Across the frontier ride the #E Saka#!, their horsemen ranging ahead of a nation in flight: warriors and priests, laden wagons, terrified families, and countless animals driven south before the advancing Yuezhi.\n\nThey have already lost the Ili Valley. They have been driven from Sogdiana, and now from Bactria. There is nowhere left for them to retreat. Desperate men may be bargained with, but a desperate people cannot be turned aside so easily; the Saka have come to carve out a homeland among the rich valleys and cities of the south, and they will answer resistance with bow and blade."
 invasions_6_warning_desc:0 "My [ROOT.GetCountry.GetRulerTitle], watchfires have appeared among the northern hills—first a handful, then hundreds. Refugees claim that the #E Saka#! are abandoning their old grazing lands before the Yuezhi advance, carrying their households and sacred possessions southward.\n\nTheir horsemen are searching every ford and mountain track leading into our lands. They do not ride like raiders seeking an easy prize. They ride like men who have nowhere else to go."
 invasions_6.a:0 "Desperation will not grant them our lands."
 invasions_6_tooltip:0 "The tribe of #Y [sakia_country_scope.GetName]#! declares war on #Y [sakia_invasion_defender.GetName]#! with the #Y Horde Conquest#! war goal."

 #invasions_7_title:0 "The Rise of Parthia"
 #invasions_7_desc:0 ""
 #invasions_7.a:0 "We're Doomed!"

 invasions_8_title:0 "Yuezhi Invasion of Bactria"
 invasions_8_desc:0 "The passes can no longer contain them. Columns of #E Yuezhi#! warriors are pouring down from the north, seizing wells and villages as their families and herds follow in their wake. Behind them press the Wusun and the distant power of the Xiongnu; before them lie the wealthy cities of Bactria.\n\nOur walls, temples, and irrigated fields must seem like treasures beyond imagining to a people who have been driven from one homeland after another. They have not come to raid and withdraw. They mean to break the kingdoms of Bactria, claim our valleys for themselves, and place enough mountains between their children and the wrath of the Chanyu that they may never be driven out again."
 invasions_8_warning_desc:0 "My [ROOT.GetCountry.GetRulerTitle], messengers from the northern satrapies bring grave news. The #E Yuezhi#! have been forced from the Ili Valley, and their scattered bands are gathering once more—this time along the roads descending into Bactria.\n\nScouts report stockpiled grain, commandeered pack animals, and mounted patrols testing the high passes. These are not the preparations of refugees begging passage. Within the year, the full weight of their migration may fall upon us."
 invasions_8.a:0 "Bactria will not become their refuge."
 invasions_8_A_tooltip:0 "The tribe of #Y [yuezhi_country_scope_2.GetName]#! declares war on #Y [yuezhi_bactria_invasion_defender.GetName]#! with the #Y Horde Conquest#! war goal."
 invasions_8_B_tooltip:0 "The tribe of #Y [yuezhi_country_scope.GetName]#! declares war on #Y [yuezhi_bactria_invasion_defender.GetName]#! with the #Y Horde Conquest#! war goal."

