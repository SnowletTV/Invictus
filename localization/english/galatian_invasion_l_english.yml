l_english:
 galatian_invasion.1.t:0 "Migration"
 galatian_invasion.1.desc:0 "For several seasons the old women have counted the empty grain jars, and the old men have watched the young warriors leave their hearths with nothing but spears and hungry families behind them. Pannonia and Illyria, once generous to our fathers, can no longer carry the weight of so many mouths. Beyond the mountains lie the rich and quarrelsome kingdoms of the Greeks, whose kings still spend more time arguing over Alexandros' inheritance than guarding it.\n\nThe migration will not be one host under one banner. The Dindarii look south toward Pella, the Scordiscii toward Delphi, and the tribes that would found Tylis toward Mesembria. For the Volcae, the greater prize lies across the straits in Anatolia. There, if courage and the gods permit it, we may find not merely plunder, but a country to call our own."
 galatian_invasion.1.a:0 "The old roads are open before us"
 galatian_invasion.2.t:0 "Our Volcae Brethren"
 galatian_invasion.2.desc:0 "Messengers have come from the camps of the Trocmeri and Tolistobogii. Their chiefs speak warmly of shared blood, shared gods, and shared hunger; their warriors speak more plainly of the rich farms beyond the Bosporos. Alone, each tribe may seize a village or two. Together, the three Volcae peoples might make the princes of Anatolia listen when we demand a place beneath their sun.\n\nA common venture will not make us one people, nor will it spare us from rivalry once the spoils are counted. But it will ensure that, when the defenders finally gather their courage, they find more than one Gallic standard waiting for them."
 galatian_invasion.2.a:0 "Let the Volcae go as brothers"
 galatian_invasion.2.a.tt:0 "The Volcae will join the expedition. Our ruler gains #G 1 Martial#! and Tectosagia will make peace in any current war involving a Volcae tribe."
 galatian_invasion.2.b:0 "Give them modest gifts and shared counsel"
 galatian_invasion.2.b.tt:0 "The Volcae will join the expedition. Our ruler gains #G 1 Finesse#!, but Tectosagia's current wars will continue."
 galatian_invasion.2.c:0 "Promise them land won by our spears"
 galatian_invasion.2.c.tt:0 "The Volcae will join the expedition. Our ruler gains #G 1 Charisma#!, but Tectosagia gains #R 2#! Aggressive Expansion."
 galatian_invasion.3.t:0 "The Fields of Phrygia"
 galatian_invasion.3.desc:0 "The council has argued long into the night, but the matter is now settled. The coast is rich, yet it belongs to merchants and ships; the mountains are safe, yet they cannot feed a nation. In #E Phrygia#!, however, dark soil runs beside patient rivers, and broad fields promise that our children may inherit more than their fathers' spears.\n\nThe expedition will therefore claim its allotted lands in Phrygia. Tectosagia, Trocmeria, and Tolistobogia will each raise a horde at its chosen settlement and declare war upon those who deny it. We come not as guests seeking permission to pass, but as a people resolved to remain."
 galatian_invasion.3.a:0 "The coasts of Asia are filled with loot!"
 galatian_invasion.3.b:0 "Phrygia will feed our people."
 galatian_invasion.3.c:0 "The mountains of Cappadocia give refuge."
 galatian_invasion.4.t:0 "Pillage and Plunder"
 galatian_invasion.4.desc:0 "The bright cities of Asia lie before us; marble quays, crowded markets, and shrines heavy with offerings gathered from generations of merchants. Their people call our coming a raid, as though hunger were a passing storm and a tribe could simply turn home when its children have eaten. We have come for wealth, yes, but also to prove that the Volcae cannot be dismissed with a purse of silver and a guarded road.\n\nWhen our standards rise, each tribe will strike at the settlement chosen for it and compel its defenders to answer. Let the rich men of the coast discover what it costs to be noticed by a people with nowhere left to go."
 galatian_invasion.4.a:0 "Let the coast learn our names"
 galatian_invasion.5.t:0 "Sword and Plough"
 galatian_invasion.5.desc:0 "Phrygia is not a land of glittering harbours, but of dark soil, patient rivers, and fields broad enough for a new people to grow old in. Here a man may plant a spear in the earth and imagine that, one day, his grandson will use the same ground to mark a boundary rather than a grave. The people who hold these lands will call us invaders - they may call us what they like, so long as they make room.\n\nThe expedition has reached its appointed lands. Tectosagia, Trocmeria, and Tolistobogia has each raised a horde at its claim and declare war upon those who deny it. There will be no petition for passage and no gentle arrival - the migration begins when our banners are seen on Phrygian soil."
 galatian_invasion.5.a:0 "Plant our standards in the black earth!"
 galatian_invasion.6.t:0 "Hill Country Home"
 galatian_invasion.6.desc:0 "Cappadocia rises like a wall of stone above the surrounding plains. Its valleys are narrow, its roads uncertain, and its hill forts stubborn things; yet to a people accustomed to hard country, such land offers more than hardship. It offers refuge. From these heights we may watch the kings quarrel below, strike when they grow careless, and build homes where their tax collectors fear to travel.\n\nThe chosen settlements will be claimed by force. Our horde will gather at the appointed land, and the first answer the Cappadocians receive from us will be the sound of war horns in their valleys."
 galatian_invasion.6.a:0 "Let the mountains keep our people"
 galatian_invasion.10.t:0 "Pella under Siege"
 galatian_invasion.10.desc:0 "My King, [GetProvince('(int32)379').GetName|E] has come under siege by the migrating hordes of the Gauls. In the past, these hordes never remained long in Greek lands, only looting and sacking their goal. Now however, they are driven by a need for new lands to settle, for [GetProvince('(int32)4184').GetArea.GetRegion.GetName|E] and [GetProvince('(int32)4064').GetArea.GetRegion.GetName|E] are too small to support the descendants of the previous migration. We must assume that [GetProvince('(int32)379').GetName|E] would be sacked, but they would never settle there, since the Gauls know, that we'd evict them. Still, we cannot let the Palace of [GetCharacter('(int32)35').GetPraenomen] and [GetCharacter('(int32)39').GetPraenomen] fall into Barbarian hands! How would they judge, seeing their legacy dishonored so soon after they passed?"
 galatian_invasion.10.a:0 "We must relieve the City!"
 galatian_invasion.11.t:0 "Pella under Siege"
 galatian_invasion.11.desc:1 "The Dindarii are besieging [GetProvince('(int32)379').GetName|E], driven by the need for new lands to settle. The Macedonian King has called for assistance to purge this horde from Greek lands. We should aid him, for should the city fall, the path east would be free to threaten the our cities. Towards Thrace and Troas the hordes would march, plundering the weak cities in Asia Minor. The Gauls must be stopped immediately!"
 galatian_invasion.11.a:0 "We shall answer the King's call!"
 galatian_invasion.11.b:0 "He deserves his fate!"
 galatian_invasion.12.t:0 "Pella under Siege"
 galatian_invasion.12.desc:0 "Hordes of Gallic barbarians are besieging [GetProvince('(int32)379').GetName|E]. Should it fall, the path east and south would be free. The Tribes would invade [GetProvince('(int32)416').GetArea.GetRegion.GetName|E], [GetProvince('(int32)1453').GetArea.GetRegion.GetName|E] and [GetProvince('(int32)257').GetArea.GetRegion.GetName|E], an opportunity they would surely take.\n\nOriginating from [GetProvince('(int32)3666').GetArea.GetRegion.GetName|E], [GetProvince('(int32)2285').GetArea.GetRegion.GetName|E], and [GetProvince('(int32)152').GetArea.GetRegion.GetName|E], these tribes had settled in [GetProvince('(int32)4184').GetArea.GetRegion.GetName|E] and [GetProvince('(int32)4064').GetArea.GetRegion.GetName|E] a few generations ago. They are now again on the move, looking for new lands to settle on. Their numbers have grown, for the lands of [GetProvince('(int32)4184').GetArea.GetRegion.GetName|E] and [GetProvince('(int32)4064').GetArea.GetRegion.GetName|E] are fertile. Yet these lands are too small, driving them further south and east. We are too far to help, yet we should prepare for the worst."
 galatian_invasion.12.a:0 "Muster the Men!"
 galatian_invasion.13.t:0 "News from Pella"
 galatian_invasion.13.desc:0 "A rider has arrived, covered in mud and blood on his cloak, bringing news of the invasions that have already started. The #E Dindarii#! have descended upon [GetProvince('(int32)379').GetName|E], and their horde has raised its standards against [SCOPE.sCountry('pella_defender').GetName]. Whatever else comes of this great migration, the Greeks will not be able to say that the #E Volcae#! marched alone.\n\nThe first blow has fallen in #E Macedonia#!, and already the refugees are abandoning their farms for the safety of their city walls. Let the chiefs of [ROOT.GetCountry.GetName] remember it well; every victory won by our kin makes the road east seem shorter, but every defeat will bring Greek spears nearer to us."
 galatian_invasion.13.a:0 "The Dindarii have made their wager"
 galatian_invasion.20.t:0 "Galatians have attacked [GetProvince('(int32)424').GetName]"
 galatian_invasion.20.desc:0 "After battling their enemies to the north, the tribes have marched south. Sacking and plundering along their way, they have left a bloody trail through Thessaly. Now they stand before our Sanctuary to Apollo, their eyes filled with greed at all the plunder they dream of taking from our beloved city of [GetProvince('(int32)424').GetName]. Ares abhors the weak, so we will be strong. Athena guides the clever, with her blessing, our cunning will deceive the enemy. With Apollo's accuracy, our bows will find the hearts of our foes. With all the Gods on our side, how could we lose? We will not let these barbarians dishonor our holy shrine and city! We will defend it to the last, for the gods would not show mercy to the traitorous!"
 galatian_invasion.20.a:0 "Apollo is with us!"
 galatian_invasion.21.t:0 "Beleaguered [GetProvince('(int32)424').GetName]"
 galatian_invasion.21.desc:0 "The tribes have moved south after they clashed in the fields of Emathia with the Macedonians. Pillaging on their way through Thessaly, they have now reached [GetProvince('(int32)424').GetName], which they besiege. They wish to plunder its riches, enslave its inhabitants and desecrate its shrine in honor of their heathen Gods. We cannot allow our Gods to be disappointed and betrayed. We must help our Hellenic brethren defend the Sanctuary of Apollo. Overconfident, they do not see the Greek cities as a threat. The Gods will favor us!"
 galatian_invasion.21.a:0 "Pride comes before the Fall"
 galatian_invasion.22.t:0 "[GetProvince('(int32)424').GetName] besieged"
 galatian_invasion.22.desc:0 "[GetProvince('(int32)424').GetName] is threatened. The barbarian hordes have marched on [GetProvince('(int32)424').GetName], following their clashes with the Macedonians in the north, sacking the cities on their way south. Now, the Sanctuary of Apollo is beleaguered by the Scordiscii. The Pythia that made [GetProvince('(int32)424').GetName] rich, has now made it into a target, for the heathens want to sacrifice her to their Gods. The riches that lay beneath her have attracted them, addling the barbarian's mind, their greed overtaking their minds. It would be a bitter sign from Apollo, should [GetProvince('(int32)424').GetName] fall."
 galatian_invasion.22.a:0 "Sacrilege..."
 galatian_invasion.22.at:0 "#R The Scordiscii will attempt to sack Delphi#!"  
 galatian_invasion.22.b:0 "Delphi shall be defended at all costs."
 galatian_invasion.23.t:0 "News from Delphi"
 galatian_invasion.23.desc:0 "Word has reached our camp that the Scordiscii stand before the sacred heights of [GetProvince('(int32)424').GetName|E]. Their chiefs have chosen a prize that will make every Greek city take notice; a sanctuary rich in offerings, guarded by reputation as much as by stone. [SCOPE.sCountry('delphi_defender').GetName] has answered their demand with war - a foolish mistake on their end.\n\nSome among our warriors laugh that the Greeks have many gods but too few swords. Others make the sign against ill fortune; even a [ROOT.GetCountry.GetAdjective] chief knows that a people who fear for their holy places may fight with a dangerous courage."
 galatian_invasion.23.a:0 "Apollo's gold has drawn Gallic steel"
 galatian_invasion.30.t:0 "[GetProvince('(int32)4244').GetName] Taken"
 galatian_invasion.30.desc:0 "My [ROOT.GetCountry.GetRulerTitle], [GetProvince('(int32)4244').GetName] has been seized by the migrating hordes of Galatians which had previously settled in Pannonia and Illyria a few generations ago. They are now again on the move, looking for new lands to settle on. Their numbers have grown, for the lands of Pannonia and Illyria are fertile. Yet these lands appear to be too small for them.\n\nOur land's fertile soil and strategic location have evidently attracted their attention. It is our turn to keep what our ancestors have created. They seek to destroy our nation and fashion from its corpse a kingdom of their own. We mustn't falter in the defense of our cities, for our wives and children hide behind the walls. The Galatians are known for their brutal practices after battle, raping the women and torturing the men. We shall not surrender! It is our duty, in the name of the Gods, to not let them seize our home!"
 galatian_invasion.30.a:0 "Dark times are upon us."
 galatian_invasion.30.at:0 "The  @[tylis_attacker.GetFlag]! #Y [SCOPE.sCountry('tylis_attacker').GetAdjective]s#! will attempt to carve out an independent kingdom from our lands."

 galatian_invasion.32.t:0 "[GetProvince('(int32)480').GetName] Imperiled"
 galatian_invasion.32.desc:0 "The Thracian colonies are imperiled. A barbarian force has passed our lines and besieges [GetProvince('(int32)480').GetName]. The [SCOPE.sCountry('tylis_attacker').GetAdjective]s seek to end their migration and settle in [GetProvince('(int32)480').GetName].\n\n[GetProvince('(int32)480').GetName] is a bastion against the Getians. Should the city fall, more raiders could enter [GetProvince('(int32)1453').GetArea.GetRegion.GetName] from the north, the protective barrier broken by the [SCOPE.sCountry('tylis_attacker').GetAdjective]s. Our cities could be left vulnerable should we not find a solution soon. What does the future hold?"
 galatian_invasion.32.a:0 "Dark times are upon us."
 galatian_invasion.32.at:0 "The  @[tylis_attacker.GetFlag]! #Y [SCOPE.sCountry('tylis_attacker').GetAdjective]s#! will attempt to carve out an independent kingdom in Tylis."

 galatian_invasion.33.t:0 "News from Mesembria"
 galatian_invasion.33.desc:0 "The third report comes from the coast of Thrace. The tribes who dream of Tylis have crossed into the lands around [GetProvince('(int32)480').GetName|E], where they have raised their own horde and challenged [SCOPE.sCountry('tylis_defender').GetName] for a kingdom by the sea.\n\nThree roads now lead away from our old homes: one to Pella, one to Delphi, and one to Mesembria. We of Tectosagia have chosen Anatolia, but our fortunes remain bound to theirs. If the Greeks are forced to spend their strength on every frontier at once, perhaps there will be enough land for all of us."
 galatian_invasion.33.a:0 "The world is widening before our people"

 galatian_invasion.34.t:0 "Kingdom of Tylis"
 galatian_invasion.34.desc:0 "After hard fighting, we have finally consolidated our hold over [GetProvince('(int32)4244').GetName] and are ready to organized ourselves into a proper kingdom in these new lands. In the years to come, the Tylians will surely be known as a fierce people. The time for trade and travel is nearly upon us, for a new people offers new, exciting things to discover." 
 galatian_invasion.34.a:0 "A new people have risen" 
 galatian_invasion.34.at:0 "The Kingdom of  @[tylis_attacker.GetFlag]! #Y Tylis#! has been established."
# galatian_invasion.34.b:0 "Tylis does not belong in the hands of Gauls."  
 TYL: "Tylis"
 TYLIS_NAME:0 "Tylis"
 TYLIS_ADJ:0 "Tylian"
 tylis_must_not_exist:0 "Tylis must not exist."
 tylis_claims_tooltip:0 "Tylis will gain Claims on the Regions of #Y $thrace_region$#! and #Y $moesia_region$#!."
 form_tylis:0 "Form Tylis"
 form_tylis_desc:0 "Our lands in Pannonia and Illyria, although fertile, are too small to support us. Far to the west lies a region called Tylis, rumored to possesses great abundance. Its strategic location make it an ideal spot to establish a kingdom of our own, close enough to the Hellenes that we may raid them, but far enough removed to dissuade counterattacks."

 galatian_invasion.35.t:0 "Kingdom of Tylis"
 galatian_invasion.35.desc:0 "The Celto-Pannonian tribes which seized [GetProvince('(int32)4244').GetName] have now organized themselves into a kingdom around the settlement. In the years to come, these Tylians will surely be known as a fierce people. The time for trade and travel is nearly upon us, for a new people offers new, exciting things to discover. There is a rumor about a new kind of sword the Gauls have brought with them from their far-away homeland..."
 galatian_invasion.35.a:0 "A new people have arisen." 
 galatian_invasion.35.at:0 "The Kingdom of  @[tylis_attacker.GetFlag]! #Y Tylis#! has been established."

 galatian_invasion.40.t:0 "The Gauls in Anatolia"
 galatian_invasion.40.desc:0 "The Galatians have sneaked into Anatolia, raiding, pillaging and looting some smaller towns. Now they arrive at our city of [GetProvince('(int32)189').GetName] and want to settle here, on the lands of our forefathers. We will not suffer them here, we have to kick the barbarians out of [GetProvince('(int32)189').GetName]. \nHellenes of Anatolia unite, for you have nothing to lose but your land. The Gauls have invaded your farms, killed your sons and abducted your daughters. Hellenes of [GetProvince('(int32)189').GetName], join the defense of [GetProvince('(int32)189').GetName]. Victory will be assured, for the tribes are heathens and the Gods are on our side! We will not cede an inch. We will defend our homeland, and drive the brutish and barbaric Galatians home!\n \n - Excerpt from a rally speech in [GetProvince('(int32)189').GetName], orator unknown, around 50 years after [GetCharacter('(int32)39').GetPraenomen]'s death."
 galatian_invasion.40.a:0 "We will not cede an inch!"

 galatian_invasion.42.t:0 "The Gauls in Anatolia"
 galatian_invasion.42.desc:0 "Some tribes that besieged [GetProvince('(int32)379').GetName|E] have crossed over the Bosporus and the Dardanelles. They raided Asia Minor and sacked some smaller cities, yet they remained largely unnoticed. The Diadochi and Epigenoi are busy squabbling, and the smaller city states have to supply them. Thus, the Tribes meet no real resistance. The Gauls originally left Pannonia and Illyria to find a new homeland. Now, they have found the region they want to settle. Around [GetProvince('(int32)189').GetName], the land is fertile, the lands are hilly. The Galatians are accustomed to similar terrain, they know how to fight in it. Yet they will not be handed [GetProvince('(int32)189').GetName] on a silver tablet, for [GetProvince('(int32)189').GetName] will be fiercely defended."
 galatian_invasion.42.a:0 "So be it"
 
 galatian_invasion.43.t:0 "Settling the Barbarians"
 galatian_invasion.43.desc:0 "The Galatians have sent an emissary seeking peace. In exchange for land around [GetProvince('(int32)194').GetName], they would end the war and settle as a buffer against our rivals. Should we turn their offer down, they would fight to the last man, their women and children having joined this migration. The war would be bloody and force us to commit troops needed on other fronts. We should not forget that land ceded now could still be reconquered later..."
 galatian_invasion.43.a:0 "They shall have their land... for now"
 galatian_invasion.43.b:0 "This land is mine!"
 galatian_invasion.44.t:0 "A New Home"
 galatian_invasion.44.desc:0 "Having won the right to settle these fertile plains, our people have left their home in Pannonia to settle in here in Anatolia. The Phrygians formerly called this region their home, but the Hellenes surrounding us now call this land Galatia after our people."
 galatian_invasion.44.a:0 "Let our swords become ploughshares."
 galatian_invasion.44.b:0 "Our people shall remain." # stay (might not be used)
 galatian_invasion.53.t:0 "Settling the Barbarians"
 galatian_invasion.53.desc:0 "The Galatians have sent an emissary seeking peace. In exchange for land around [GetProvince('(int32)189').GetName], they would end the war and settle as a buffer against our rivals. Should we turn their offer down, they would fight to the last man, their women and children having joined this migration. The war would be bloody and force us to commit troops needed on other fronts. We should not forget that land ceded now could still be reconquered later..."
 galatian_invasion.53.a:0 "They shall have their land... for now"
 galatian_invasion.53.b:0 "This land is mine!"
 galatian_invasion.63.t:0 "Settling the Barbarians"
 galatian_invasion.63.desc:0 "The Galatians have sent an emissary seeking peace. In exchange for land around [GetProvince('(int32)1941').GetName], they would end the war and settle as a buffer against our rivals. Should we turn their offer down, they would fight to the last man, their women and children having joined this migration. The war would be bloody and force us to commit troops needed on other fronts. We should not forget that land ceded now could still be reconquered later..."
 galatian_invasion.63.a:0 "They shall have their land... for now"
 galatian_invasion.63.b:0 "This land is mine!"
 galatian_invasion.70.t:0 "Embracing New Lands"
 galatian_invasion.70.desc:0 "Our people, far removed from the Celtic lands of old, are beginning to take on new practices that are distinct from the old ways. Should we embrace this new ethos or keep to the old traditions?"
 galatian_invasion.70.a:0 "A new lands for a new people."
 galatian_invasion.70.b:0 "We will never forsake our ancestral customs!"
 galatian_invasion.71.t:0 "Galatia"
 galatian_invasion.71.desc:0 "Since the first Gauls invaded Macedon many years have passed. Many have fought the Galatians, some battles they have won, some they have lost, yet none managed to defeat them. The Trocmeri, Tectosagii and Tolistobogii have conquered and settled a place to call home, now sheathing their swords and exchanging them for ploughshares, ending their migration. \n Now, the tribes have united in what they call Galatia. In the years to come, they will surely be known as a fierce people, ready to fight if necessary, but accustomed to peace. In the heart of Anatolia their people live and die. \nThe time for trade and travel has come, for a new people offers new, exciting things to discover. There is a rumor about a new kind of sword the Gauls have brought with them from their far-away homeland..."
 galatian_invasion.71.a:0 "A new people have arisen"
 galatian_invasion.72.t:0 "Celtic Phrygia" # Notification to locals that Gauls in Anatolia have unified and formed Galatia
 galatian_invasion.72.desc:0 "The Celtic people have settled in [GetProvince('(int32)189').GetName], their journey coming to an end. They have fought Greeks and Macedonians, Hellenic and Anatolian. With the blood they have shed, they irrigate the fertile lands they conquered. They have proven themselves, and their Gods have favored their voyage. Their new homeland they call Galatia. \n\nThe Galatians are still barbarians, we should try to civilize them. War is not the only way to defeat a people; with coin and a smile, they would surely integrate themselves. If they became new Greeks, they would have nothing to fear. They have brought with them a new kind of sword, which they have shown to be masters of using. Maybe we can convince the Gauls to sell some to us. New people offer new benefits..."
 galatian_invasion.72.a:0 "Peace at last"
 galatian_invasion.75.t:0 "United Volcae"
 galatian_invasion.75.desc:0 "Our brethren have accepted our right to lead a confederation. They have broken their subject agreement with their former overlords and swear fealty to us."
 galatian_invasion.75.a:0 "A new era is upon us."
