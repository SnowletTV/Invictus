l_english:

 ####################
 # Title
 ####################

 achaean_mission_01:0 "The Dream of the Achaeans"
 achaean_mission_01_DESCRIPTION:0 "Achaea. Long has she stood as the archetype for all of Greece: proud, pious, free, yet deeply quarrelsome. There are some Hellenes who look on us as nothing more than backwards hill folk, and for a time they were right. But things are changing in Hellas. The sun has set on the hegemonies of Athens and Sparta. The Macedonians tear at the scraps left behind by the Conqueror, and the tyrants they forced on us are as vulnerable as they've ever been. Now is the time for Greeks to be free again. Now is the time for Achaea to rise."
 achaean_mission_01_CRITERIA_DESCRIPTION:0 "Unite Achaea and free the Peloponnese from Macedonian Tyranny"
 achaean_mission_01_BUTTON_TOOLTIP:0 ""
 achaean_mission_01_BUTTON_DETAILS: ""

 ####################
 # Mission Tasks
 ####################

 achaean_mission_01_task:0 "An Ultimatum for Pellene"
 achaean_mission_01_task_DESC:0 "The wayward Pellenoi were the only Achaeans to support the Spartan cause during the Peloponnesian War. It is time to welcome them back into the fold. They must overthrow the Alexandrine Tyrant Chaeron and join us, or pay for their treason.\n\n#R Warning: This may cause a war with Pellene!#!"
 achaean_mission_01_task_ultimatum_tt:0 "#Y Pellene#! receives an ultimatum to join the League. #G 40%#! base chance of success, with an additional #G 5%#! for every point of the ruler's #Y Charisma#!.\nIf successful: #Y Pellene#! is annexed into the League, and our ruler gains #G 20#! Popularity.\nIf refused: we declare war on #Y Pellene#! with a wargoal to conquer #Y Achaea#!."

 achaean_mission_02_task:0 "Achaean Developments"
 achaean_mission_02_task_DESC:0 "With Pellene back in the fold, control of the Achaean highlands is ours. However, our lands are sparse and underdeveloped. To survive, we must urbanize quickly. Levy an additional tax on the landed nobility and focus the proceeds on expanding the towns of Dyme, Patrai, Aigion and Pellene into proper cities."
 achaean_mission_02_task_pop_tt:0 "Our ruler must have at least #G 60#! Popularity."

 achaean_mission_03_task:0 "The Cities of Achaea"
 achaean_mission_03_task_DESC:0 "Finally, the towns of Achaea have grown into true Poleis. We see no need to continue taxing the nobles, as they have grown bitter. Many migrants from the countryside flock to the cities, seeking opportunities. We may draw upon these newcomers in a time of need."
 achaean_mission_03_task_cities_tt:0 "#Y Dyme#!, #Y Patrai#!, #Y Aigion#! and #Y Pellene#! must be #Y Cities#!."

 achaean_mission_04_task:0 "Gate to the West"
 achaean_mission_04_task_DESC:0 "Patrai, the \"Gate to the West\" is essential for controlling access to the Gulf of Corinth, and critical for the security of the Peloponnese. If we can fortify it and improve its harbor, it could serve both as a commercial hub and a bulwark against invasion."
 achaean_mission_04_task_infra_tt:0 "#Y Patrai#! must have a #Y Port#! and a #Y Fortress#!."

 achaean_mission_05_task:0 "Convince Ptolemy"
 achaean_mission_05_task_DESC:0 "The Ptolemaic Kingdom has largely left the Hellenes to their own devices, instead choosing to solidify their holdings in the east. The Pharaoh [GetCountry('EGY').GetRuler.GetName] is wise and reasonable. If we were to befriend [GetCountry('EGY').GetRuler.GetHerHim], we could surely appeal to [GetCountry('EGY').GetRuler.GetHerHis] benevolence to free our brothers in Sikyon."

 achaean_mission_06_task:0 "Sikyon Liberated"
 achaean_mission_06_task_DESC:0 "Sikyon has cast off its tyrant and agreed to join us. Achaea is now firmly within our grasp. All of Hellas has taken notice."

 achaean_mission_07_task:0 "Conspiracy in Sikyon"
 achaean_mission_07_task_DESC:0 "Sikyon is ripe for a revolution. The Alexandrine tyrant, [GetCountry('SIC').GetRuler.GetName] is unpopular and vulnerable. Elements in the opposition could be persuaded to overthrow him, pledging the city to the League. We will send some of our finest men to support their cause."

 achaean_mission_08_task:0 "Choosing Sides"
 achaean_mission_08_task_DESC:0 "The Macedonian War of Succession offers the League a rare chance to shape the balance of power in Hellas - or to stand proudly apart from it."
 achaean_mission_08_task_war_tt:0 "The #Y Antipatrids#! and the #Y Antigonids#! must be at war in the Diadochi conflict."
 achaean_mission_08_task_reward_tt:0 "We will be asked to declare for the #Y Antigonids#!, the #Y Antipatrids#!, or to stand neutral in the war."

 achaean_mission_09_task:0 "Renovate the Amarion"
 achaean_mission_09_task_DESC:0 "Since the mythic age, Achaeans have assembled in the sacred grove near the temple of Demeter Panachaia to engage in lively debate. We shall make this holy site, known as the Amarion, the seat and meeting place of our representative government, the Synodos. The renovated complexes will attract the powerful and well connected of Achaean society to Aigion."
 achaean_mission_09_task_religious_tt:0 "The state of #Y Aigion#! must have the #Y Religious Endowments#! investment."

 achaean_mission_10_task:0 "Ptolemaic Overtures"
 achaean_mission_10_task_DESC:0 "The Ptolemies of Egypt, unlike their brethren, have generally respected our independence. Perhaps we could improve our standing with them by negotiating a modest trade deal for grain. Their favor may prove handy later on..."
 achaean_mission_10_task_grain_tt:0 "The Achaean League must be importing #Y Grain#! from #Y Egypt#!."

 achaean_mission_11_task:0 "The Achaean Triobol"
 achaean_mission_11_task_DESC:0 "Every city of the League still strikes its own coin, to its own weight, stamped with its own gods. A merchant crossing from Aigion to Dyme must weigh his silver twice. Let the Synodos decree a single federal coinage so that Achaean silver is Achaean silver."
 achaean_mission_11_task_cities_tt:0 "The League must hold at least #G 3#! cities in #Y Achaea#!."
 achaean_mission_11_task_metals_tt:0 "The League must be importing #Y Precious Metals#! to #Y Achaea#!."

 achaean_mission_13_task:0 "Grain Storehouses"
 achaean_mission_13_task_DESC:0 "Egyptian grain fills our harbours in the good years, but a fleet delayed or a poor harvest and the cities go hungry. Let us raise proper storehouses across Achaea - filled in plenty, drawn down in want - so that no Achaean need ever fear the lean season again."
 achaean_mission_13_task_granary_tt:0 "The League must hold at least #G 3#! cities in #Y Achaea#! with a #Y Granary#!."

 achaean_mission_14_task:0 "Invite the Korinthoi"
 achaean_mission_14_task_DESC:0 "Korinthos has recently freed itself from Macedonian domination, but she remains isolated and vulnerable. A cord of many strands is not quickly broken. Send notice to the Korinthoi at once, and implore them to join us. Do not accept a refusal.\n\n#R Warning: This may cause a war with Corinth!#!"
 achaean_mission_14_task_ultimatum_tt:0 "#Y Corinth#! receives an ultimatum to join the League. #G 25%#! base chance of success, with an additional #G 5%#! for every point of the ruler's #Y Charisma#!.\nIf successful: #Y Corinth#! becomes a #Y feudatory#! of the League.\nIf refused: we may declare war on #Y Corinth#! with a wargoal to conquer #Y Achaea#!."

 achaean_mission_15_task:0 "Seize the Akrokorinthos"
 achaean_mission_15_task_DESC:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] has a cunning plan. It is said that the western slope of the plateau is less steep, and experienced climbers could scale it easily, gaining access to the fortress. [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] and 400 men, barefoot and under the cover of night, will scale the western walls with ladders and secure the Citadel, while another 300 men will capture the outer walls of the city. The garrison, sleepy and drunk from the night's revelries, will be caught completely by surprise. It is a risky endeavor, however, and we should be prepared to lose many men."

 achaean_mission_12_task:0 "Helike Remembered"
 achaean_mission_12_task_DESC:0 "Before Aigion, at the birth of the Old League, there was Helike. It was the greatest of the Achaean cities, seat of Poseidon Helikonios, where the twelve peoples of old Achaea kept their common rites. In a single night an age ago the earth shook and the sea rose and swallowed her whole. Let us raise a cenotaph at our sanctuary and take up again the rites the waves interrupted, so that what Helike carried is not lost."
 achaean_mission_12_task_temple_tt:0 "The state of #Y Aigion#! must have a #Y Temple#!."

 ####################
 # Events
 ####################

 me_achaean_1_title:0 "Achaean Aspirations"
 me_achaean_1_desc:0 "For too long, the free cities of Hellas have suffered under the yoke of tyrants. Be he Macedonian or Spartan, it matters not: the Greek people shall never be free while a king reigns. It is time for the Achaeans to take their place as the rightful liberators of Greece!"
 me_achaean_missions_1.a:0 "Hellas shall be free!"
 me_achaean_1_opinion_tt:0 "All non-oligarchic republics in #Y Greece#! gain #G 25#! Opinion of us"

 me_achaean_2_title:0 "Pellene Accepts!"
 me_achaean_2_desc:0 "All of Achaea rejoices today! The good people of Pellene, having seen the light, overthrew their Tyrant and pledged the city to the League."
 me_achaean_missions_2.a:0 "Welcome home, brothers."
 me_achaean_2_annex_tt:0 "#Y Pellene#! is annexed into the League.\nOur ruler gains #G 20#! Popularity."

 me_achaean_3_title:0 "War with Pellene!"
 me_achaean_3_desc:0 "The traitorous Pellenoi have rejected our gracious proposal, preferring to languish under their tyrant. They will accept democracy whether they like it or not!"
 me_achaean_missions_3.a:0 "Then it shall be war."
 me_achaean_3_war_tt:0 "We declare war on #Y Pellene#! with a wargoal to conquer #Y Achaea#!."

 me_achaean_5_title:0 "The Pharaoh Frees Sikyon"
 me_achaean_5_desc:0 "The Pharaoh, in [GetCountry('EGY').GetRuler.GetHerHis] ineffable wisdom, heeded our plea and has agreed to cede Sikyon to the Achaean League. All of Achaea rejoices!"
 me_achaean_missions_5.a:0 "The Pharaoh is a true friend of Hellas."
 me_achaean_5_annex_tt:0 "#Y Sikyon#! is annexed into the Achaean League.\n#G +20#! Political Influence."

 me_achaean_6_title:0 "Aratus of Sikyon"
 me_achaean_6_desc:0 "With the tyrant gone, Sikyon takes its place among the cities of the League - and one Sikyonian in particular refuses to be overlooked. [SCOPE.sCharacter('aratus_scope').GetName], barely past twenty and of the Kleinid house, speaks in the assembly of a Hellas swept clean of tyrants and kings, of every free city bound into one federation. Older men who came to scoff stay to listen. He will be a force in the League, whether we cultivate him or not."
 me_achaean_missions_6.b:0 "Let him earn his standing like any other."
 me_achaean_missions_6.c:0 "Aratus shall lead the League as Strategos."

 me_achaean_8_title:0 "A Coup in Sikyon"
 me_achaean_8_desc:0 "Our little operation has succeeded! With our support, the Sikyonoi have cast off their chains and joined us. Their former suzerain, furious, may try to enforce their claim on the city. We must be ready."
 me_achaean_missions_8.a:0 "We welcome them with open arms!"
 me_achaean_8_tt:0 "#Y Sikyon#! is annexed into the Achaean League.\nIts former suzerain gains the #R Sikyon Stolen#! opinion of us (#R -25#!, decaying over 25 years) and a claim on our #Y Achaea#! provinces.\nAratus of Sikyon steps onto the stage."

 me_achaean_4_title:0 "Choosing Sides"
 me_achaean_4_desc:0 "The vain and foolish Macedonians are again warring over the scraps of their empire. While we are content to watch them kill each other, this presents us with a unique opportunity. Joining the winning side may curry favor and secure our lands against future Macedonian incursion. On the other hand, making a public show of neutrality would boost morale at home."
 me_achaean_missions_4.a:0 "Support [GetCountry('PRY').GetRuler.GetName]"
 me_achaean_missions_4.b:0 "Support [GetCountry('MAC').GetRuler.GetName]"
 me_achaean_missions_4.c:0 "Declare Neutrality"
 me_achaean_4_antigonid_tt:0 "Join the war on the #Y Antigonid#! side.\n#G +20#! Political Influence.\n#Y Antigonid#! Opinion of us #G +20#!; #Y Antipatrid#! Opinion of us #R -20#!.\nThe #Y Antipatrids#! gain a claim on #Y Achaea#!.\nWe sign a #G 240-month#! peace treaty with the #Y Antigonids#!."
 me_achaean_4_antipatrid_tt:0 "Join the war on the #Y Antipatrid#! side.\n#G +20#! Political Influence.\n#Y Antipatrid#! Opinion of us #G +20#!; #Y Antigonid#! Opinion of us #R -20#!.\nThe #Y Antigonids#! gain a claim on #Y Achaea#!.\nWe sign a #G 240-month#! peace treaty with the #Y Antipatrids#!."

 me_achaean_10_title:0 "Ptolemaic Overtures"
 me_achaean_10_desc:0 "The great and benevolent Ptolemy has agreed to favor us in their grain trade. The Pharaoh will not forget this friendly overture."
 me_achaean_missions_10.a:0 "The Pharaoh has our gratitude."
 me_achaean_10_tt:0 "The Achaean League gains #Y Egyptian Grain#! for #G 10#! years.\n#Y Egypt#! Opinion of us #G +25#! (decaying over 25 years)."

 me_achaean_11_title:0 "The Achaean Triobol"
 me_achaean_11_desc:0 "The dies are cut and the first coins struck at Aigion: a slight silver triobol, Zeus laureate on the face, the League monogram on the reverse. The member cities will strike their own, to this weight and this stamp. A common coin for a common cause."
 me_achaean_missions_11.a:0 "Let Achaean silver be Achaean silver."
 me_achaean_11_tt:0 "The Achaean League gains the #Y Achaean Triobol#! (permanent): #G +10%#! Commerce, #G +5%#! Tax, #G +2#! capital trade routes."

 me_achaean_12_title:0 "Helike Remembered"
 me_achaean_12_desc:0 "At the water's edge below the sanctuary the priests set a stone with no body beneath it and pour the old libations to Poseidon Helikonios. A cenotaph for a whole city. The crowd is enormous and very quiet. When the bull is led down the older Achaeans weep openly. The rites Helike kept for the twelve peoples are the League's rites now. May this please the ornery Poseidon, so that we do not share Helike's fate."
 me_achaean_missions_12.a:0 "The sea took the city; it will not take the rite."

 me_achaean_13_title:0 "The Ruler's Purse"
 me_achaean_13_desc:0 "The wealth tax bites, and the great houses grumble loudly that the whole burden of the cities falls on them. [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] is himself a man of considerable fortune. The treasurers put it delicately: were our ruler to open his own coffers for the urbanisation, it would silence a great deal of the muttering - though it is not the sort of gesture the old families make, and some of them will not thank him for it."
 me_achaean_missions_13.a:0 "Let it come from my own purse."
 me_achaean_13.a.tt:0 "Donate #G 75#! gold from our ruler's personal coffers.\nThe treasury gains #G 75#! gold and #G 20#! Political Influence.\nOur ruler gains the #Y Benefactor#! trait and #R 10#! Corruption.\n#R The Oligarchs#! find the display beneath the office: their approval falls #R 20#!."
 me_achaean_missions_13.b:0 "A modest contribution, then."
 me_achaean_missions_13.c:0 "The treasury must manage on its own."

 me_achaean_15_title:0 "The Curse of Oebotas"
 me_achaean_15_desc:0 "Oebotas of Dyme, the first Achaean to win an Olympic victory, cursed the Achaeans to never win again after they failed to honour him. [SCOPE.sCharacter('olympic_victor_char').GetName] has done what many thought impossible - he has brought an olive wreath home to Achaea. It is time to honour his incredible accomplishment, and to make right at last what was owed to Oebotas!"
 me_achaean_missions_15.a:0 "Raise his statue - and Oebotas' beside it."
 me_achaean_15.a.tt:0 "#G +15#! Stability, #G +20#! Political Influence.\n[SCOPE.sCharacter('olympic_victor_char').GetName] gains the #Y Breaker of the Curse#! modifier (#G +1#! Charisma) and a surge of #G Popularity#!."

 me_achaean_16_title:0 "Korinthos Joins the League"
 me_achaean_16_desc:0 "The Korinthoi have wisely pledged themselves to our cause. The city requests a degree of political independence, and has decided to join the League not as a full member, but as a trusted friend and ally. Perhaps they can be persuaded to join in full at a later time."
 me_achaean_missions_16.a:0 "A friend and ally is worth more than a resentful subject."
 me_achaean_16_tt:0 "#Y Corinth#! becomes a #Y feudatory#! of the Achaean League.\n#G +30#! Political Influence."

 me_achaean_17_title:0 "Korinthos Refuses!"
 me_achaean_17_desc:0 "Negotiations with the Korinthoi have broken down. They accuse us of stripping our member-states of their rights to benefit an elite in Aigion. It is clear that Macedonian stooges seek to return the city to the yoke of Tyrants. We must act quickly. Do we declare war, or leave the fools to their fate?"
 me_achaean_missions_17.a:0 "War it is!"
 me_achaean_missions_17.b:0 "Leave it be."
 me_achaean_17_war_tt:0 "We declare war on #Y Corinth#! with a wargoal to conquer #Y Achaea#!."

 me_achaean_18_title:0 "Night Raid on Akrokorinthos"
 me_achaean_18_desc:0 "Success! Fortune has graced us with a swift victory over the Macedonians. As planned, our army stealthily infiltrated the Akrokorinthos. While the alarm was raised by the force assaulting the citadel, quick maneuvering by the brave 300 at the city walls saved the day. Diana herself must have looked on our efforts in favour. The light of the full moon made our arms appear more numerous to the enemy than they really were, owing to the length of our line of march, and the echoes of the night gave the impression that the shouts proceeded from many times the number there really were. By dawn, both the Citadel and the City were ours.\n\nThe Macedonians will have taken notice. The Akrokorinthos is critical for control of the Peloponnese, and they will not give it up lightly. Still, a celebration is in order!"
 me_achaean_missions_18.a:0 "Corinth is ours - let the wine flow!"
 me_achaean_18_tt:0 "The Achaean League annexes #Y Korinthos#!.\n#R +1#! Aggressive Expansion.\nOur ruler gains #G 10#! Popularity.\nThe grateful League adopts #Y Lifetime Elections#!.\n#Y Korinthos'#! former owner or suzerain gains the #R Achaean Aggression#! opinion of us (#R -50#!, decaying over 50 years) and a claim on our #Y Achaea#! provinces."
 me_achaean_12_tt:0 "#Y Aigion#! gains the permanent #Y Sanctuary of Poseidon Helikonios#! modifier.\nThe Achaean League gains #Y Rites of Helikonios#! for #G 120#! months (#G +15%#! Omen Power, #G +10%#! ruler popularity gain).\nOur ruler gains #G 1#! Zeal."

 ####################
 # Modifiers
 ####################

 achaean_aspirations:0 "Achaean Aspirations"
 desc_achaean_aspirations:0 "This character dreams of one day freeing Hellas from tyranny."
 achaean_aspirations_opinion:0 "Achaean Aspirations"

 rapid_urbanization:0 "Rapid Urbanization"
 desc_rapid_urbanization:0 "A wealth tax was levied to fund the development of our cities."

 migrant_boom:0 "Migrant Boom"
 desc_migrant_boom:0 "Migrants from the countryside and beyond flock to your cities for new opportunities."

 gate_to_the_west:0 "Gate to the West"
 desc_gate_to_the_west:0 "Known as the \"Gate to the West\", Patrai is critical for controlling both the crossing from Aetolia into Achaea and trade in the Gulf of Corinth."

 amarion:0 "Amarion"
 desc_amarion:0 "The sacred grove by the temple of Demeter Panachaia, rebuilt as the meeting place of the League's Synodos - and a magnet for Achaea's great families."
 synodos:0 "Synodos"
 desc_synodos:0 "The word synod comes from the Ancient Greek synodos, meaning 'assembly, meeting'. The Synodos of the Achaean League was its primary legislative body, which met four times a year in Aigion to handle major state affairs. While it was theoretically open to all free men of the League's member states, evidence suggests that in practice it functioned as a representative body of delegates rather than a direct assembly. As such, it was often dominated by the wealthy and powerful of Achaean society."

 egyptian_grain:0 "Egyptian Grain"
 desc_egyptian_grain:0 "The Pharaoh Ptolemy has cut us a favorable deal on grain."
 ptolemaic_overtures_opinion:0 "Ptolemaic Overtures"
 achaean_aggression_opinion:0 "Achaean Aggression"
 achaean_league_overture_opinion:0 "The League's Overture"
 pasture_appropriations_opinion:0 "Pasture Appropriations"

 achaean_triobol:0 "The Achaean Triobol"
 desc_achaean_triobol:0 "A single federal silver coinage, struck by the member cities to a common weight and stamp. Achaean silver is Achaean silver from Pellene to the sea."
 sanctuary_helikonios:0 "Sanctuary of Poseidon Helikonios"
 desc_sanctuary_helikonios:0 "A cenotaph for drowned Helike and the restored rites of Poseidon Helikonios, kept here for all the peoples of Achaea."
 rites_of_helikonios:0 "Rites of Helikonios"
 desc_rites_of_helikonios:0 "The old common rites of the twelve Achaean peoples, taken up again at the League's sanctuary."

 grain_storehouses:0 "Grain Storehouses"
 desc_grain_storehouses:0 "Storehouses across Achaea, filled in the good years and drawn down in the lean ones."

 curse_breaker:0 "Breaker of the Curse"
 desc_curse_breaker:0 "This character carried an Olympic olive wreath home to Achaea and broke the curse of Oebotas. His name will be remembered."

 protector_of_democracy:0 "Protector of Democracy"
 desc_protector_of_democracy:0 "The Achaean League stands as the guarantor of free government across the Peloponnese, and every tyrant knows the League is coming for him."

 sikyon_stolen_opinion:0 "Sikyon Stolen"

 achaean_chose_your_side_opinion:0 "Chose Our Side"
 achaean_spurned_you_opinion:0 "Spurned Us"

 ####################
 # The Fall of Akrokorinthos
 ####################

 achaean_mission_16_task:0 "The Fall of Akrokorinthos"
 achaean_mission_16_task_DESC:0 "The citadel that held the Peloponnese in chains is ours, and for the first time in living memory no Macedonian garrison looks down on the Isthmus. The tyrants of the southern cities have lost their patron and their nerve. Send envoys to every one of them. Send word to our Arcadian brothers, to Epidauros, Troizen, and Hermione, to Megara and the isle of Aigina, to proud Argos and to Megalopolis. Tell them the age of tyrants is ending, and that there is a place for them in the League if they will take it."

 achaean_mission_17_task:0 "For Democracy!"
 achaean_mission_17_task_DESC:0 "Korinthos' fall rippled through the Peloponnese. Those not already under the League's protection look on us in fear and envy. The Spartans have long fashioned themselves the masters of the Peloponnese, but their time in the sun has long gone. Achaea will rise in her place as the protector of the peninsula and all who live in it. All who dwell in these lands under the rule of tyrants must submit to the new order, or despair. Democracy is non-negotiable."

 achaean_mission_18_task:0 "Pasture Appropriations"
 achaean_mission_18_task_DESC:0 "Kleonai is ideal land for herding sheep. It would greatly benefit our League if we were to assume direct control of these pastures. While [GetProvince('(int32)7894').GetOwner.GetName] will undoubtedly protest such an appropriation, they are not in a position to refuse. A little coin is needed to grease the wheels of the Kleonoi."

 me_achaean_19_title:0 "The Fall of Akrokorinthos"
 me_achaean_19_desc:0 "Word of the Akrokorinthos has run ahead of our envoys. Throughout the Peloponnese, the same story is being told: the Macedonian shield is gone, the League rises, and a man must decide today whether he would live free or die hiding behind a toothless tyrant. Our terms are on the table. Now we wait to see who has the sense to take them."
 me_achaean_missions_19.a:0 "Let every free city hear the offer."
 me_achaean_19_tt:0 "#Y Epidauros#!, #Y Troizen#!, #Y Hermione#!, #Y Megara#! and #Y Aigina#! are offered full membership of the League.\n#Y Arcadia#! (and any of her breakaway successor states), #Y Argos#!, #Y Megalopolis#! and #Y Elis#! are offered a place as #Y feudatories#!.\nEach will accept or refuse in its own council.\nWe gain #G +20#! Political Influence for every offer accepted."

 me_achaean_20_title:0 "The Fall of Akrokorinthos"
 me_achaean_20_desc:0 "The envoys of the Achaean League stand in our assembly and do not soften their message. The Akrokorinthos has fallen, and the Macedonians have fled the Peloponnese. The League offers us a full and equal share in its councils, and asks only that we set aside the pretence of a sovereignty we can no longer defend alone. The alternative, they do not say aloud, but every man in the room can hear it."
 me_achaean_missions_20.a:0 "Accept terms"
 me_achaean_missions_20.b:0 "Reject terms"

 me_achaean_21_title:0 "[SCOPE.sCountry('achaean_joining_country').GetName] Joins the League"
 me_achaean_21_desc:0 "The council of [SCOPE.sCountry('achaean_joining_country').GetName] has voted to dissolve itself into the Achaean League. Their magistrates will sit in our Synodos, their levies will march under our standard, and their walls are our walls now. Another strand is woven into the cord."
 me_achaean_missions_21.a:0 "Welcome them as brothers."

 me_achaean_22_title:0 "The Tyrant of [SCOPE.sCountry('achaean_rejecting_country').GetName] Rejects Liberty!"
 me_achaean_22_desc:0 "The answer from [SCOPE.sCountry('achaean_rejecting_country').GetName] is a flat refusal, dressed up in fine words about ancient independence. We are not fooled. The man who rules there would rather be first in a servile little city than an equal in a free one, and he is betting that we will not trouble to remove him. It is a bet he may come to regret. Our claim to the city stands, and it will keep."
 me_achaean_missions_22.a:0 "Let the claim stand."

 me_achaean_23_title:0 "The Fall of Akrokorinthos"
 me_achaean_23_desc:0 "The Achaean envoys are careful with us. They know we are not a village to be swallowed whole, and they do not ask us to be. What they offer is a bond of alliance under the League's protection - our own laws, our own assembly, our own strategos - with the League's shield over us and a seat, in time, at its table. With the Akrokorinthos in their hands and the Macedonians gone, it is an offer that will not stay open forever."
 me_achaean_missions_23.a:0 "Accept terms"
 me_achaean_missions_23.b:0 "Reject terms"

 me_achaean_24_title:0 "[SCOPE.sCountry('achaean_joining_country').GetName] Binds Itself to the League"
 me_achaean_24_desc:0 "[SCOPE.sCountry('achaean_joining_country').GetName] has accepted the League's protection as a feudatory. It shall keep its own magistrates and its own pride, but march where we march and answer where we call. It is not the full union we would prefer, but it is a great deal better than a hostile neighbour, and the door is left open for more."
 me_achaean_missions_24.a:0 "A friend held close is a friend indeed."

 me_achaean_25_title:0 "[SCOPE.sCountry('achaean_rejecting_country').GetName] Stands Apart"
 me_achaean_25_desc:0 "[SCOPE.sCountry('achaean_rejecting_country').GetName] has declined even the loose bond of a feudatory, preferring their solitude to our company. So be it. We will not force the matter today, but a city that stands alone in the Peloponnese will not stand alone for long."
 me_achaean_missions_25.a:0 "Their choice. For now."

 ####################
 # Missing-event pass
 ####################

 me_achaean_26_title:0 "The Cities of Achaea"
 me_achaean_26_desc:0 "The miraculous time, the backwater villages of the Achaean highlands have grown into proper poleis. They are the envy of the northern Peloponnese, and many migrant workers have flocked from the countryside to seek better opportunities."
 me_achaean_missions_26.a:0 "Achaea's cities come into their own."
 me_achaean_26_tt:0 "#Y Rapid Urbanization#! ends.\n#Y Dyme#!, #Y Patrai#!, #Y Aigion#! and #Y Pellene#! each gain #G 2#! Freemen and the #Y Migrant Boom#! modifier for #G 240#! months.\nThe League gains #G 2#! Manpower and #G 2#! free province investments."

 me_achaean_27_title:0 "Gate to the West"
 me_achaean_27_desc:0 "The final capstone has been struck. A citadel has been erected atop Mount Panachaikon, surveying the sea. Trade ships may pass through the strait under our watchful eye, and the Aetolians on the other side now know that they cannot raid our lands without impunity. All of Achaea is safer this day."
 me_achaean_missions_27.a:0 "Patrai, sentinel of the gulf."
 me_achaean_27_tt:0 "#Y Patrai#! permanently gains the #Y Gate to the West#! modifier (#G +15%#! local Defensive, #G +50%#! local capital trade routes)."

 me_achaean_28_title:0 "Sikyon Liberated"
 me_achaean_28_desc:0 "Sikyon has cast off its tyrant and agreed to join us. Achaea is now firmly within our grasp. All of Hellas has taken notice. The fear of the remaining tyrants is palpable. The Macedonians' grip on the Peloponnese weakens. One by one, they will all fall."
 me_achaean_missions_28.a:0 "One League, one Achaea."
 me_achaean_28_tt:0 "#G +40#! Political Influence.\nThe League gains a claim on every unowned province in #Y Achaea#!."

 me_achaean_29_title:0 "Renovate the Amarion"
 me_achaean_29_desc:0 "By the sea at Aigion is a sanctuary of Zeus Homagyrios, the Assembler. Here we have expanded the council-house, now befitting a Koinon of many. The temple has been adorned with many new frescoes and ornamentation. Statues of Nike and Demeter, to bless us in war and in peace, are carved out of fine marble. The brightest minds and the most noble scions of our society will flourish here, and it will be the envy of envoys from the far reaches of Hellas. Truly this is a space worthy of Zeus Homagyrios, god of the assembly, he who unites."
 me_achaean_missions_29.a:0 "The Synodos has its home."
 me_achaean_29_tt:0 "#Y Aigion#! gains #G 1#! Noble and #G 1#! Citizen, and the permanent #Y Amarion#! modifier.\nThe Achaean League gains the #Y Synodos#! modifier (#G +3%#! Citizen output, #G +6%#! Nobles output, #G +20%#! Political Influence)."

 me_achaean_30_title:0 "Grain Storehouses"
 me_achaean_30_desc:0 "Our deal with Ptolemy has yielded us much grain, and finally we have a place to store it. These storehouses will be part of a wider network to feed the entire Achaean countryside."
 me_achaean_missions_30.a:0 "No Achaean shall go hungry."
 me_achaean_30_tt:0 "The Achaean League gains the #Y Grain Storehouses#! modifier for #G 10#! years (#G +0.1%#! monthly population growth)."

 me_achaean_31_title:0 "For Democracy!"
 me_achaean_31_desc:0 "Korinthos' fall rippled through the Peloponnese. Those not already under the League's protection look on us in fear and envy. The Spartans have long fashioned themselves the masters of the Peloponnese, but their time in the sun has long gone. Achaea will rise in her place as the protector of the peninsula and all who live in it. All who dwell in these lands under the rule of tyrants must submit to the new order, or despair. Democracy is non-negotiable."
 me_achaean_missions_31.a:0 "The Peloponnese answers to no tyrant."
 me_achaean_31_tt:0 "The Achaean League gains the permanent #Y Protector of Democracy#! modifier (#G +10%#! fabricate claim speed, #G +10#! subject opinions).\nThe League gains a claim on every free, non-subject country's provinces in #Y Achaea#!, #Y Arcadia#! and #Y South Peloponnese#!."

 me_achaean_32_title:0 "Pasture Appropriations"
 me_achaean_32_desc:0 "The survival of this league must come at some sacrifice. While we respect the autonomy of our members, we must accept that some unpopular actions must be taken to protect us as a whole. Kleonai's herdlands will support our armies, and we will not forget [SCOPE.sCountry('kleonai_subject').GetName]'s contribution, grumble as they may."
 me_achaean_missions_32.a:0 "The Kleonoi will manage."
 me_achaean_32_tt:0 "The League pays #R 50#! gold.\n#Y Kleonai#! is appropriated into #Y Achaea#!.\nIts former owner gains the #R Pasture Appropriations#! opinion of us (#R -20#!, decaying over 4 years)."
