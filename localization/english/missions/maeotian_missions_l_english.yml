 # Modifiers & Opinions
# ============================================================

 maeotian_fisheries:0 "Maeotian Fisheries"
 desc_maeotian_fisheries:0 "Robust improvements and expansion in the Maeotian fishing trade have led to a boon within the aquatic market."
 interior_steppe_trade:0 "Trade with the Steppe Interior"
 maeotian_options:0 "Options of the Lake"
 maeotian_swamp_militia:0 "Swamp Militia"
 mature_marshes:0 "Mature Marshes"
 marsh_warriors:0 "Marsh Warriors"
 caucasian_hegemon:0 "Caucasian Hegemon"
 desc_caucasian_hegemon:0 "As the de facto leader of the Caucasian region, our people command great respect, fear, fealty, and financial penalties."
 maeotians_sold_our_people:0 "They Sold Our People!"
 failed_slave_trade:0 "Failed Slave Trade"
 scythian_slave_takeover:0 "Scythian Slave Takeover"
 hyperborean_caravans:0 "Hyperborean Caravans"
 desc_hyperborean_caravans:0 "The new road networks leading to Gelon have allowed for strange, foreign goods to arrive in our local markets."
 sindian_royal_titulature:0 "King of the Sindoi and all the Maiotai"
 sindian_silver:0 "Sindian Silver"
 maeotian_earthworks:0 "Earthen Ramparts"
 ways_of_the_marsh:0 "Ways of the Marsh"
 tanais_grain_fleet:0 "Tanaitan Grain Fleet"
 grain_route_partners:0 "Partners on the Grain Route"
 tirgatao_memory:0 "Tirgatao's Memory"
 iaxamatan_horsewomen:0 "Riders All"
 desc_tirgatao_memory:0 "The tower where Tirgatao was once shut away stands renewed above the shore."
 labrytan_apollo_sanctuary:0 "Sanctuary of Apollo of the Labrytai"
 desc_labrytan_apollo_sanctuary:0 "The old Sindian sanctuary of Apollo draws worshipers from every shore of the lake, and the traders follow them."
 phanagorian_harbor_works:0 "Phanagorian Harbor Works"
 desc_phanagorian_harbor_works:0 "Dredged channels and new warehouses have doubled the traffic through Phanagoria's harbor."
 phanagorian_free_port:0 "Free Port of Phanagoria"
 bosporan_marriage_ties:0 "Marriage Ties"
 hellenizing_court:0 "Greek Ways at Court"
 steppe_marriage_pact:0 "Marriage Pact"

 

# ============================================================
 # Events
# ============================================================

 # Task 1: The Eastern Bosporans: Envoys
 me_maeotia_1_title:0 "$maeotian_missions_task_01$: Envoys"
 me_maeotia_1_desc:0 "In the last few centuries, the tyrants of the Bosporos have encroached evermore eastwards, taking the shores of the Maeotis one harbor at a time and shutting our people out of the lake our herds and boats have always depended upon. We must make a deal to return to those lands.\n\nEnvoys have been chosen and gifts loaded; the embassy rides for Pantikapaion."
 me_maeotia_1.a:0 "Off to [GetCountry('BPK').GetCapital.GetName], with gifts and our best manners!"

 # Task 1: The Eastern Bosporans: Haggling
 me_maeotia_2_title:0 "$maeotian_missions_task_01$: Haggling"
 me_maeotia_2_desc:0 "Our envoys stand before [GetCountry('BPK').GetRuler.GetName] in [GetCountry('BPK').GetCapital.GetName]. Above all else, it seems the Bosporans want quiet on their frontier. Naturally, we want dominion over the eastern shore of the lake. The gift carts we brought are still loaded, and a Greek court is not known for refusing gold."
 me_maeotia_2.a:0 "Open the gift carts before we open our mouths."
 me_maeotia_2.b:0 "We came to bargain, not to beg."

 # Task 1: The Eastern Bosporans: Homecoming
 me_maeotia_3_title:0 "$maeotian_missions_task_01$: Homecoming"
 me_maeotia_3_desc:0 "The Bosporans kept the shore. Their archons will not give up a harbor for words alone, and our envoys have come home with nothing but the road-dust on them. The chiefs have heard enough talking."
 me_maeotia_3_desc_ceded:0 "The terms are struck, and the garrisons are marching out. The first families are already driving their herds down to the eastern shore, back to the waters their fathers were shut out of. Our people are going home."
 me_maeotia_3.a:0 "Then we shall take what was not given."
 me_maeotia_3_tooltip:0 "The mission task '#Y $maeotian_missions_task_01$#!' has now been #G Completed#!!"

 # Task 1: The Eastern Bosporans: The Bosporan Answer
 me_maeotia_48_title:0 "Demands from the Lake"
 me_maeotia_48_desc:0 "Envoys of [maeotia_negotiator_scope.GetName] stand in our court and ask for the eastern shore of the Maeotis, harbors and tolls together. Their riders are many, and the kingdom has only lately finished bleeding itself over the succession."
 me_maeotia_48.a:0 "Give them the shore. Let them keep the marshes quiet for us."
 me_maeotia_48.a.tt:0 "#Y [GetProvince('(int32)4558').GetName]#! and #Y [GetProvince('(int32)4559').GetName]#! pass to #E #Y [maeotia_negotiator_scope.GetName]#!#!"
 me_maeotia_48.b:0 "Spartokos took that coast. We do not hand it back."

 # Task 2: Fish for the Future
 me_maeotia_4_title:0 "$maeotian_missions_task_02$"
 me_maeotia_4_desc:0 "The scaled critters of the Maeotis have become the staple of tribes both coastal and in the hinterlands. Let this prosperous change transform the food security of the future and encourage the bearing of more children!"
 me_maeotia_4.a:0 "The people shall eat their fill."
 me_maeotia_4_tooltip:0 "The mission task '#Y $maeotian_missions_task_02$#!' has now been #G Completed#!!"

 # Task 3: XXX Authority
 me_maeotia_5_title:0 "$maeotian_missions_task_03$"
 me_maeotia_5_desc:0 "More and more, the political and social structure of our tribes veers away from the decentralized bickering of village matters. It has begun reforming into something more secure and more powerful, and the lands of the Maeotis have felt the winds of change."
 me_maeotia_5.a:0 "For a stronger, more secure society."
 me_maeotia_5_tooltip:0 "The mission task '#Y $maeotian_missions_task_03$#!' has now been #G Completed#!!"

 # Task 4: Trade in Tanais: The Offer
 me_maeotia_6_title:0 "$maeotian_missions_task_04$: The Offer"
 me_maeotia_6_desc:0 "With the Scythian Royalty in shambles, the local tradesmen and outlaws of the lakeside villages whisper rumors of an untouched slave trade with Greek states far beyond our shores, such as the famed Athens, where, so the graybeards insist, Scythian slaves once kept the peace as a brutish police force. With Tanais' port up and running, we would have the capacity to ship people off. The only issue would be...'finding'...the right people."
 me_maeotia_6.a:0 "This seems like a profitable kind of business."
 me_maeotia_6.b:0 "Sell our distant kinsmen in these modern and sensible times?!?"
 me_maeotia_6_tooltip:0 "The mission task '#Y $maeotian_missions_task_04$#!' has now been #G Completed#!!"

 # Task 4: Trade in Tanais: The Storm
 me_maeotia_7_title:0 "$maeotian_missions_task_04$: The Storm"
 me_maeotia_7_desc:0 "As luck, or the heavens above, would have it, lightning and a thunderous storm struck the ship sailing with our slaves bound for Athens. Fortunately... or unfortunately...those same slaves were able to survive a wreck on the coast of the isle of Lemnos in the Aegean Sea. They were notably upset with quite a few aspects of this whole endeavor: the slavery itself, being packed onto ships, having to swim for their lives when they'd never previously been a people built for the water, and the list goes on.\n\nLong story short, they may...or may not...have gone on a murderous rampage and slaughtered a great number of the Greek inhabitants (in typical Lemnian fashion). They may...or may not...have also taken over the local government.\n\nWe certainly have some decisions to make here."
 me_maeotia_7.a:0 "Ok then. We will just have to, umm, go ahead and kill them all. Yep, that."
 me_maeotia_7.b:0 "We can still turn this around. Yes, a negotiator, send one of those."
 me_maeotia_7.c:0 "This is none of our concern."

 # Task 4: Trade in Tanais: No Dice
 me_maeotia_8_title:0 "$maeotian_missions_task_04$: No Dice"
 me_maeotia_8_desc:0 "Our envoys' ships have been turned away, and Athens has sent notes of its displeasure with the situation. If the Scythian tyrants of Lemnos are unwilling to negotiate, what can be done?"
 me_maeotia_8.a:0 "Bribe the local Lemnians to rise against them."
 me_maeotia_8.b:0 "We've waited long enough. Let us excise the problem once and for all."
 me_maeotia_8.c:0 "Ehh, they're fine over there. What can they really do?"
 me_maeotia_8.d:0 "Maybe the history of these Lemnian Scythians is one worth observing..."
 me_maeotia_8.d.t:0 "You switch to playing as #Y Lemnos#!."

 # Task 5: Baby Boom
 me_maeotia_9_title:0 "$maeotian_missions_task_05$"
 me_maeotia_9_desc:0 "With the many new cities finally open to the tribes, the gates of each have burst with the crowds attempting to become the first residents of each city. The people are now able to truly experience what the Greeks would consider a form of civilized life. Perhaps city living will teach our people to think on greater matters than the harvest."
 me_maeotia_9.a:0 "Let the gates open!"
 me_maeotia_9_tooltip:0 "The mission task '#Y $maeotian_missions_task_05$#!' has now been #G Completed#!!"

 # Task 6: XXX Diplomacy
 me_maeotia_10_title:0 "$maeotian_missions_task_06$"
 me_maeotia_10_desc:0 "With a stronger network of connections building among the tribes of the northern mountainsides, we can feel stronger in our regional position and in our potential to make waves. Let our diplomatic chiefs go forth and spread news of our grandeur to all who will listen."
 me_maeotia_10.a:0 "Hurray for friends!"
 me_maeotia_10_tooltip:0 "The mission task '#Y $maeotian_missions_task_06$#!' has now been #G Completed#!!"

 # Task 7: Swamp Training
 me_maeotia_11_title:0 "$maeotian_missions_task_07$"
 me_maeotia_11_desc:0 "Training in the wet, slow-to-move-in marshlands has transformed our band of rabble into a disciplined fighting force which can last in the harshest of conditions. Our war chief has created a grand army of the tribes to combat the changing political arena we find ourselves in."
 me_maeotia_11.a:0 "Swamp experience is best."
 me_maeotia_11_tooltip:0 "The mission task '#Y $maeotian_missions_task_07$#!' has now been #G Completed#!!"

 # Task 8: Trade Routes into Hyperborea: The Roads
 me_maeotia_12_title:0 "$maeotian_missions_task_08$: The Roads"
 me_maeotia_12_desc:0 "Representatives from Gelon's many Greco-Scythian workshops and trading groups have visited our villages and cities following the warming of relations between ourselves and the tri-citadel city. Many of these same individuals claim that wealth would more easily flow into our dominion if proper trade networks and roads were put down. What shall be done regarding this new prospect?"
 me_maeotia_12.a:0 "This new, exotic market is tantalizing!"
 me_maeotia_12.b:0 "We can afford a modest upgrade for our merchants' pathing."
 me_maeotia_12.c:0 "There is nothing interesting over there."
 me_maeotia_12_tooltip:0 "The mission task '#Y $maeotian_missions_task_08$#!' has now been #G Completed#!!"

 # Task 8: Trade Routes into Hyperborea: Craftsmen
 me_maeotia_13_title:0 "$maeotian_missions_task_08$: Craftsmen"
 me_maeotia_13_desc:0 "A wave of new merchants and craftsmen has come in from the northern steppelands, bringing with them new languages, histories, cultures, customs, goods, and ways of creating beautiful artwork. There is much to learn from these people."
 me_maeotia_13.a:0 "Hurrah for globalization."

 # Task 8: Trade Routes into Hyperborea: The Hand
 me_maeotia_14_title:0 "$maeotian_missions_task_08$: The Hand"
 me_maeotia_14_desc:0 "Out of all the treasures to possibly arrive from the northlands, none of our merchants, traders, or politicians expected to find a human hand presented at the chief court. Wearing a ragged black cloak, tunic, boots, and felt hood, the mysterious man presented it before [ROOT.GetCountry.GetRuler.GetName]: a dark-colored, hairy, still-rotting hand with long fingernails and a strange aura about it (it looks almost chewed off the arm it came from). The man claims that it was cut from the arm of a legendary leader of the Androphagi; this hand holds an ancient power. To each wielder, it grants three wishes; for each wish, an awful consequence of an otherworld awaits. Tender this warning as you consider its use."
 me_maeotia_14.a:0 "What disturbing power!"

 # Task 9: Developing the Maeotic Swamp: The Warming
 me_maeotia_15_title:0 "$maeotian_missions_task_09$: The Warming"
 me_maeotia_15_desc:0 "As the marshlands have been drained out and developed, much of the heat trapped in the swamps has been released into the air, creating a warmer and less humid environment for the tribesmen living along the coast and the inland rivers and streams. Villages are waiting to see if conditions for additional crop growth can occur."
 me_maeotia_15.a:0 "Hopefully a more comfortable environment awaits."

 # Task 9: Developing the Maeotic Swamp: Bog Bodies
 me_maeotia_16_title:0 "$maeotian_missions_task_09$: Bog Bodies"
 me_maeotia_16_desc:0 "The drained marshlands have begun giving up what they swallowed. Workers cutting the new channels have pulled ancient men from the peat, their faces so well kept they seem merely asleep. Half the village wants them reburied with honors, and the other half wants them burned."
 me_maeotia_16.a:0 "Give them back to the earth, with honors."

 # Task 9: Developing the Maeotic Swamp: The Statue
 me_maeotia_17_title:0 "$maeotian_missions_task_09$: The Statue"
 me_maeotia_17_desc:0 "Deeper in the workings, the diggers' spades rang against stone: a statue taller than any man, of no god our priests can name. Half the work gang has refused to return to the site."
 me_maeotia_17.a:0 "Haul it to the village square for all to see!"

 # Task 9: Developing the Maeotic Swamp: Giant Bones
 me_maeotia_18_title:0 "$maeotian_missions_task_09$: Giant Bones"
 me_maeotia_18_desc:0 "Then came the bones. Ribs like ship keels, and a skull with teeth the length of daggers. The diggers have named the beast a dragon of the old lake, and no one has volunteered to dig deeper."
 me_maeotia_18.a:0 "A dragon skull for the chief's hall!"
 me_maeotia_18_tooltip:0 "The mission task '#Y $maeotian_missions_task_09$#!' has now been #G Completed#!!"

 # Task 10: Might of Makhelonia
 me_maeotia_19_title:0 "$maeotian_missions_task_10$"
 me_maeotia_19_desc:0 "Among the highland tribes beyond the Kuban, the Makhli, there was talk of binding all the clans of mountain and plain into a single union under a single banner.\n\nAdirmakh, mightiest of the Makhli chieftains, has come down from the passes and sworn his clans to [ROOT.GetCountry.GetRuler.GetName]."
 me_maeotia_19.a:0 "Hail Adirmakh, King of Makhelonia!"
 me_maeotia_19.b:0 "His army will be a welcome addition to our collection."
 me_maeotia_19_tooltip:0 "The mission task '#Y $maeotian_missions_task_10$#!' has now been #G Completed#!!"

 # Task 11: Marsh Mercenaries
 me_maeotia_20_title:0 "$maeotian_missions_task_11$"
 me_maeotia_20_desc:0 "Among the many shady and dangerous characters we've dredged up from the swamps at the deepest parts of the marshlands, [maeotian_swamp_man.GetPraenomen] is the strangest. Once a farmer, this enigmatic character more commonly goes by the death-ringer #E 'Swamp Man'#! when he's been hired to take a life. While uncertain about his nature, our military advisors believe [maeotian_swamp_man.GetName] could be incredibly useful on the battlefield."
 me_maeotia_20.a:0 "Give #E Swamp Man#! a job!"
 me_maeotia_20.b:0 "We don't need his ilk."
 me_maeotia_20_tooltip:0 "The mission task '#Y $maeotian_missions_task_11$#!' has now been #G Completed#!!"

 # Task 12: A XXX Empire
 me_maeotia_21_title:0 "$maeotian_missions_task_12$"
 me_maeotia_21_desc:0 "With our borders bolstered, our people both protected and intelligent, and our ambitions (at least the early ones) satisfied, it feels as if a new kind of dawn has shed its light on the land about the lake. Looking forward, we should truly decide on our new identity. Shall we cast aside the old in favor of the new, or maintain our traditional aesthetics?"
 me_maeotia_21.a:0 "The old ways are best."
 me_maeotia_21.b:0 "Do we not possess a great empire?"
 me_maeotia_21.c:0 "NO ONE CAN STOP ME NOW!"
 me_maeotia_21.d:0 "We shall...benevolently...steward the Caucasus into a new age."
 me_maeotia_21.e:0 "We shall rebuke those Greeks who have sullied our lands for ages."
 me_maeotia_21_claims_tt:0 "We gain claims on #Y Scythia#!, #Y Asiatic Sarmatia#!, #Y Taurica#!, #Y Colchis#! and #Y Albania#!"
 me_maeotia_21_tooltip:0 "The mission task '#Y $maeotian_missions_task_12$#!' has now been #G Completed#!!"

 # Task 25: Restore the Sindian Throne
 me_maeotia_22_title:0 "$maeotian_missions_task_25$"
 me_maeotia_22_desc:0 "With Sinda regained and the [restored_king_scope.GetName] rescued from exile, there is no reason for the Sindian royal seat to sit empty.\n\nThere is of course, the small matteer of whom shall sit the throne. [restored_king_scope.GetPraenomen] agitates to be crowned a king, but surely none would begrudge [ROOT.GetCountry.GetRuler.GetPraenomen] being declared, King of the Sindoi and all the Maiotai?"
 me_maeotia_22.a:0 "May [restored_king_scope.GetPraenomen] reign long and peaceably."
 me_maeotia_22.b:0 "We shall wear that crown ourselves."
 me_maeotia_22.a.t:0 "#E #Y Sindica#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Feudatory#!\n#E [restored_king_scope.GetName]#! becomes the ruler of #E #Y Sindica#!"
 me_maeotia_22_tooltip:0 "The mission task '#Y $maeotian_missions_task_25$#!' has now been #G Completed#!!"

 # Task 26: Sindian Silver
 me_maeotia_23_title:0 "$maeotian_missions_task_26$"
 me_maeotia_23_desc:0 "Generations ago, silver bearing the legend of the Sindoi passed through every port on the strait, struck in the days before the Bosporans swallowed the coast. Now the mint fires are lit again, and the die-cutters await a name."
 me_maeotia_23.a:0 "The king's face on every coin!"
 me_maeotia_23.b:0 "The elders shall have their names in silver."
 me_maeotia_23.c:0 "The harbors shall stamp their own silver."
 me_maeotia_23_tooltip:0 "The mission task '#Y $maeotian_missions_task_26$#!' has now been #G Completed#!!"

 # Task 27: Fish of the Fathers
 me_maeotia_24_title:0 "$maeotian_missions_task_27$"
 me_maeotia_24_desc:0 "It is the custom of our people that when a warrior is laid in the earth, one fish is cast upon the grave for every enemy he slew in life. The rite is honored across the Maeotis once more, and the graves of the great men stink of it."
 me_maeotia_24.a:0 "One fish for every foe he slew!"
 me_maeotia_24_tooltip:0 "The mission task '#Y $maeotian_missions_task_27$#!' has now been #G Completed#!!"

 # Task 28: Ways of the Marsh
 me_maeotia_25_title:0 "$maeotian_missions_task_28$"
 me_maeotia_25_desc:0 "No stranger has ever taken the Maeotic marshes, because no stranger has ever found his way through them, only drowned roads and reed beds..."
 me_maeotia_25.a:0 "The marsh is known to us alone."
 me_maeotia_25_tooltip:0 "The mission task '#Y $maeotian_missions_task_28$#!' has now been #G Completed#!!"

 # Task 29: Tanaitan Grain Fleet
 me_maeotia_26_title:0 "$maeotian_missions_task_29$"
 me_maeotia_26_desc:0 "Flat-bottomed barges now work the river and stout hulls the lake, and the grain of the northern country passes through our hands, sold to hungry Greeks and taxed at every landing.\n\nUpstream, the Iaxamatae watch the barges pass, and demand their toll."
 me_maeotia_26.a:0 "Give them their share of the grain."
 me_maeotia_26.b:0 "Put spearmen on every barge."
 me_maeotia_26.c:0 "No riders are left on the banks."
 me_maeotia_26.d:0 "The river tolls are ours already."
 me_maeotia_26_desc_iaz:0 "Flat-bottomed barges now work the river and stout hulls the lake, and the grain of the northern country passes through our hands, sold to hungry Greeks and taxed at every landing.\n\nUpstream, our own riders keep the river, and every barge pays its due."
 me_maeotia_26_tooltip:0 "The mission task '#Y $maeotian_missions_task_29$#!' has now been #G Completed#!!"

 # Task 14: Heirs of Octamasades
 me_maeotia_27_title:0 "$maeotian_missions_task_14$"
 me_maeotia_27_desc:0 "Generations have passed since the usurper Octamasades of the Sindoi was cast out at Labryta and chased into the lands of the Scythians, where he vanished from the histories. In exile there still live his descendants, or men who claim to be.\n\nOne such man, Hekataios, has crossed into [ROOT.GetCountry.GetName] with his household, and his supporters line the road to cheer him on his way to [ROOT.GetCountry.GetCapital.GetName]."
 me_maeotia_27.a:0 "Sindian restoration lies close at hand."
 me_maeotia_27_tooltip:0 "The mission task '#Y $maeotian_missions_task_14$#!' has now been #G Completed#!!"

 # Task 15: Recapturing Sinda
 me_maeotia_28_title:0 "$maeotian_missions_task_15$"
 me_maeotia_28_desc:0 "Gorgippia, the harbor town the old tribes called Sinda, was long a sore spot for the Sindoi, whose kingdom was dissolved and whose kings gave way to Bosporan archons long ago. The city is ours at last, and it bears the name Sinda once more."
 me_maeotia_28.a:0 "It is Sinda once more!"
 me_maeotia_28_tooltip:0 "The mission task '#Y $maeotian_missions_task_15$#!' has now been #G Completed#!!"

 # Task 16: Bosporan Intermarriage
 me_maeotia_29_title:0 "$maeotian_missions_task_16$"
 me_maeotia_29_desc:0 "Hecataeus was wed into the house of Spartokos in the days of Satyrus I, and so shall the royal lines of the Sindoi and the Bosporans be joined once more.\n\nThe Spartokids have offered [spartokid_match_scope.GetName], and we have daughters of our own. The only question is which house sends and which receives."
 me_maeotia_29.a:0 "Send a daughter of our house to Pantikapaion."
 me_maeotia_29.a.tt:0 "A daughter of our ruling house is wed to the heir of #E #Y [GetCountry('BPK').GetName]#!#!"
 me_maeotia_29.b:0 "Bring the Spartokid girl to our hall."
 me_maeotia_29.b.tt:0 "#E [spartokid_match_scope.GetName]#! of the Spartokids joins our court and is wed to our heir"
 me_maeotia_29_tooltip:0 "The mission task '#Y $maeotian_missions_task_16$#!' has now been #G Completed#!!"

 # Task 17: The Siraces of the Kuban
 me_maeotia_30_title:0 "$maeotian_missions_task_17$"
 me_maeotia_30_desc:0 "A century ago the Siraces drove the last Scythian princes from the middle Kuban, and their horse-herds now graze where our kin once ruled. They raid whom they please, and it was Siracian riders who decided the war between the sons of Pairisades for the Bosporan throne.\n\nNow their envoys wait beneath the horse-tail standards."
 me_maeotia_30.a:0 "Horse-lords fall like anyone else. Loose the arrows."
 me_maeotia_30.b:0 "Gold and a wedding cost less than a war."
 me_maeotia_30.c:0 "It seems the horse-lords have left..."
 me_maeotia_30_tooltip:0 "The mission task '#Y $maeotian_missions_task_17$#!' has now been #G Completed#!!"

 # Task 18: A Helleno-XXX Kingdom: Two Worlds
 me_maeotia_31_title:0 "$maeotian_missions_task_18$: Two Worlds"
 me_maeotia_31_desc:0 "Embracing the Greek world, the Sindoi can maneuver to inherit the whole of the Bosporan Kingdom. Let the house of Hecataeus engage in a battle of political intrigue. How Greek the court should look is the first question."
 me_maeotia_31.a:0 "Marble and tutors for everyone!"
 me_maeotia_31.b:0 "Greek columns above a tribal hearth."

 # Task 18: A Helleno-XXX Kingdom: Proclamation
 me_maeotia_32_title:0 "$maeotian_missions_task_18$: Proclamation"
 me_maeotia_32_desc:0 "A Helleno-[ROOT.GetCountry.GetAdjective] kingdom stands astride the strait. The Spartokid inheritance and the Sindian one have come into the same hands."
 me_maeotia_32.a:0 "A new name for a new kingdom!"
 me_maeotia_32.b:0 "The old ways are best."
 me_maeotia_32_tooltip:0 "The mission task '#Y $maeotian_missions_task_18$#!' has now been #G Completed#!!"

 # Task 19: Break the Bosporan Grip: The Council
 me_maeotia_33_title:0 "$maeotian_missions_task_19$: The Council"
 me_maeotia_33_desc:0 "The Spartokids hold the eastern shore of the lake, their garrisons on the best harbors and their toll on every cargo that crosses. But the kingdom has just bled itself white in a war between brothers, and [GetCountry('BPK').GetRuler.GetName] is new to the throne.\n\nThe council has met, and the question before it is how the coast is to be taken."
 me_maeotia_33.a:0 "Name a price. Every court has one."
 me_maeotia_33.b:0 "Their own subjects can do the fighting."
 me_maeotia_33_tooltip:0 "The mission task '#Y $maeotian_missions_task_19$#!' has now been #G Completed#!!"

 # Task 19: Break the Bosporan Grip: Demands
 me_maeotia_34_title:0 "$maeotian_missions_task_19$: Demands"
 me_maeotia_34_desc:0 "Our envoys stand before [GetCountry('BPK').GetRuler.GetName] and name the price of quiet on the lake: the harbors of the eastern shore, and the tolls that come with them. In return the Spartokids may have our silence, and a weight of silver to soften the loss.\n\nThe answer will come from their council, not from us."
 me_maeotia_34.a:0 "Let them weigh the shore against the sum."

 # Task 19: Break the Bosporan Grip: The Price of the Shore
 me_maeotia_49_title:0 "The Price of the Shore"
 me_maeotia_49_desc:0 "The envoys of [maeotia_grip_scope.GetName] have named their terms: the eastern shore of the Maeotis, harbors and tolls together, and in exchange a weight of silver and quiet on that frontier. The treasury is thin after the war between brothers, and the eastern garrisons cost more than they gather."
 me_maeotia_49.a:0 "Sell them the shore. Silver spends; marshes do not."
 me_maeotia_49.a.tt:0 "Our provinces in #Y Maeotia#! and #Y Maeotia Minores#! pass to #E #Y [maeotia_grip_scope.GetName]#!#!"
 me_maeotia_49.b:0 "Spartokos won that coast. It is not for sale."

 # Task 19: Break the Bosporan Grip: Revolt
 me_maeotia_35_title:0 "$maeotian_missions_task_19$: Revolt"
 me_maeotia_35_desc:0 "Quiet men with heavy purses have been visiting the villages under Bosporan rule, and the villages have been listening. Now the eastern shore seethes with revolt."
 me_maeotia_35.a:0 "Send them more spears, quietly."

 # Task 19: Break the Bosporan Grip: The Strongholds
 me_maeotia_36_title:0 "$maeotian_missions_task_19$: The Strongholds"
 me_maeotia_36_desc:0 "The Bosporans will not sell and will not yield, so the shore must be taken the long way. Our riders know every ford and reed bed between the strongholds, and their garrisons are far from home."
 me_maeotia_36.a:0 "Then we take it one harbor at a time."

 # Task 19: Break the Bosporan Grip: The Shore
 me_maeotia_37_title:0 "$maeotian_missions_task_19$: The Shore"
 me_maeotia_37_desc:0 "The terms are struck. The Bosporan garrisons are marching back to the cities of the strait, and the eastern shore of the Maeotis answers to our chiefs. The tolls are ours to set now."
 me_maeotia_37.a:0 "The shore is ours."

 # Task 20: Walls of Earth
 me_maeotia_38_title:0 "$maeotian_missions_task_20$"
 me_maeotia_38_desc:0 "The old banks of earth and timber rise again, higher and longer, from the lake shore to the Kuban. Every village now sits behind its own rampart, and raiders out of the steppe will find no easy pickings."
 me_maeotia_38.a:0 "Good honest dirt, and plenty of it!"
 me_maeotia_38_tooltip:0 "The mission task '#Y $maeotian_missions_task_20$#!' has now been #G Completed#!!"

 # Task 21: Apollo and the Labrytai
 me_maeotia_39_title:0 "$maeotian_missions_task_21$"
 me_maeotia_39_desc:0 "Apollo has watched over Labryta since the days of the Sindian kings, and it was to the god of the city that Leucon dedicated a statue after casting down Octamasades at its walls. Now the Bosporans' claim on the god's favor is ended, and his priests wait to learn how generous the city's new masters intend to be."
 me_maeotia_39.a:0 "Gild the god properly!"
 me_maeotia_39.b:0 "A modest tithe will do."
 me_maeotia_39_tooltip:0 "The mission task '#Y $maeotian_missions_task_21$#!' has now been #G Completed#!!"

 # Task 22: Tower of Tirgatao
 me_maeotia_40_title:0 "$maeotian_missions_task_22$"
 me_maeotia_40_desc:0 "Tirgatao of the Iaxamatae was wife to Hecataeus of the Sindoi until he put her aside for a Bosporan bride and shut her in a tower. She escaped, but returned to wage war upon the Sindoi and their Bosporan patrons.\n\nThe tower where she was imprisoned has been renewed, and the story is told at its foot: they locked her in, and she got out."
 me_maeotia_40.a:0 "Let it stand tall!"
 me_maeotia_40_tooltip:0 "The mission task '#Y $maeotian_missions_task_22$#!' has now been #G Completed#!!"

 # Task 23: Promoting Phanagoria: The Harbor
 me_maeotia_41_title:0 "$maeotian_missions_task_23$: The Harbor"
 me_maeotia_41_desc:0 "Along the eastern shore of the Bosporus, Phanagoria stands out as the main center of trade, rivaling Panticapaeum. In our hands, the port city must become a means of controlling entry into the lake. The harbor-masters await only silver."
 me_maeotia_41.a:0 "Dredge deeper and build higher!"
 me_maeotia_41.b:0 "A sensible harbor will do."

 # Task 23: Promoting Phanagoria: The Fields
 me_maeotia_42_title:0 "$maeotian_missions_task_23$: The Fields"
 me_maeotia_42_desc:0 "The hinterland behind Phanagoria has been organized to feed the port. New fields are cut, and ox-carts queue at the land gate from dawn."
 me_maeotia_42.a:0 "Hurrah for grain! The port shall eat well."

 # Task 23: Promoting Phanagoria: The Gate
 me_maeotia_43_title:0 "$maeotian_missions_task_23$: The Gate"
 me_maeotia_43_desc:0 "With its harbor deepened and its hinterland feeding it, Phanagoria commands the water-road into the Maeotis."
 me_maeotia_43.a:0 "The gate of the lake needs a firm keeper."
 me_maeotia_43.b:0 "A little freedom keeps the merchants fat."
 me_maeotia_43.c:0 "Let Phanagoria govern itself."
 me_maeotia_43.c.tt:0 "#E #Y [GetProvince('(int32)4563').GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E League City#!"
 me_maeotia_43_tooltip:0 "The mission task '#Y $maeotian_missions_task_23$#!' has now been #G Completed#!!"

 # Task 24: XXX Kurgan Burial
 me_maeotia_44_title:0 "$maeotian_missions_task_24$"
 me_maeotia_44_desc:0 "For two centuries the Sindian princes and Scythian overlords who ruled above the tribes of the lake were honored with great burial mounds which tower over towns and cities, while the tribes laid their own dead in humble, flat graves. Now the first royal kurgan of [ROOT.GetCountry.GetName] is rising beside the lake."
 me_maeotia_44.a:0 "Raise the mounds high!"
 me_maeotia_44_tooltip:0 "The mission task '#Y $maeotian_missions_task_24$#!' has now been #G Completed#!!"


 # Task 30: Our Lake
 me_maeotia_45_title:0 "$maeotian_missions_task_30$"
 me_maeotia_45_desc:0 "The Greeks write that we are named for the lake. Fools. The lake is named for us.\n\nNow every shore of it answers to its namesake, and the Greeks may write what they like."
 me_maeotia_45.a:0 "Let the map settle it."
 me_maeotia_45_tooltip:0 "The mission task '#Y $maeotian_missions_task_30$#!' has now been #G Completed#!!"

 # Task 31: No Maiden Unblooded
 me_maeotia_46_title:0 "$maeotian_missions_task_31$"
 me_maeotia_46_desc:0 "The Greeks who sail past the Tanais write that we are ruled by our women, and they are not entirely wrong. Our girls ride, hunt and draw the bow beside their brothers, and none of them takes a husband until she has killed.\n\nThe muster is called on those terms now, and [unblooded_maiden_scope.GetName] rides at the head of it."
 me_maeotia_46.a:0 "Let the Greeks write what they like about it."
 me_maeotia_46_tooltip:0 "The mission task '#Y $maeotian_missions_task_31$#!' has now been #G Completed#!!"

 # Task 32: Masters of the Steppe
 me_maeotia_47_title:0 "$maeotian_missions_task_32$"
 me_maeotia_47_desc:0 "The Aorsi press upon our herds from the east, and the lesser clans are waiting to see which of us gives ground.\n\nThe herds are moving east, not west."
 me_maeotia_47.a:0 "The Aorsi shall learn who rules the grass."
 me_maeotia_47_tooltip:0 "The mission task '#Y $maeotian_missions_task_32$#!' has now been #G Completed#!!"




