l_english:

 maeotian_missions:0 "Drain the Swamp"
 maeotian_missions_DESCRIPTION:0 "For a century the tribes of the Maeotis have lived in the shadow of Greek kings and steppe lords, fishing their lake and paying other peoples' tolls. [ROOT.GetCountry.GetName] shall unite the tribes, take the eastern shore back, and raise a power of its own upon the great lake."
 maeotian_missions_CRITERIA_DESCRIPTION:0 "The mission will be complete when the tribes of the Maeotis have been united, and the eastern Maeotic swamps are under control."
 maeotian_missions_BUTTON_TOOLTIP:0 "To the Lake!"
 
# ============================================================
 # Missions
# ============================================================
 
 maeotian_missions_task_01:0 "The Eastern Bosporans"
 maeotian_missions_task_01_DESC:0 "Over the last century, the tyrants of the Bosporos have encroached evermore eastwards, taking the shores of the Maeotis one harbor at a time and shutting our people out of the lake our herds and boats have always depended upon. WSuch an affront cannot stand."
 maeotian_missions_task_01_tt:0 "A #Y negotiation#! will start with the #T Bosporan Kingdom#! to decide the fate of its #Y Eastern Maeotic#! territories."

 maeotian_missions_task_02:0 "Fish for the Future"
 maeotian_missions_task_02_DESC:0 "The tribes of the lake live off of its bounty, so a wealth of fishing is needed to sustain the kind of growth our people seek."

 maeotian_missions_task_03:0 "[ROOT.GetCountry.GetAdjective] Authority"
 maeotian_missions_task_03_DESC:0 "To maintain an independence from the Bosporans and prevent subjugation by hostile neighbors, [ROOT.GetCountry.GetName] must establish its own authority in the region. Traditions and structures must become organized practices between the tribes."

 maeotian_missions_task_04:0 "Trade in Tanais"
 maeotian_missions_task_04_DESC:0 "Set at the mouth of a river headed into the unknown north, the trading beach on the Tanais is one of the last points of connection between the Mediterranean Sea and the Scythian lands. To control the trade of grain, slaves, and exotic eastern goods, we should raise a true port city where the river merchants have long beached their boats."
 maeotian_missions_task_04_tt:0 "Have a fleet of at least #G 15#! ships on the River Tanais (the #T highlighted#! province near the port of Tanais)."

 maeotian_missions_task_05:0 "Baby Boom"
 maeotian_missions_task_05_DESC:0 "The increase in births within the tribes has overcrowded the villages; greater settlements are needed to accommodate the greater realm of [ROOT.GetCountry.GetName]."
 maeotian_missions_task_05_tt:0 "At least #G 3#! of the #T highlighted#! settlements must be #Y cities#! under our rule, with no ongoing construction."

 maeotian_missions_task_06:0 "[ROOT.GetCountry.GetAdjective] Diplomacy"
 maeotian_missions_task_06_DESC:0 "Warding off the expansionist Bosporans and the raiders of the steppe is going to require making some friends among the North Caucasian tribes."

 maeotian_missions_task_07:0 "Swamp Training"
 maeotian_missions_task_07_DESC:0 "Both a natural barrier and a rough terrain to conquer, the Maeotic Swamp presents the greatest of training fields a warrior of [ROOT.GetCountry.GetName] can hope to master. Let the men engage in mock combat there, and no stretch of the world shall ever challenge them again."

 maeotian_missions_task_08:0 "Trade Routes into Hyperborea"
 maeotian_missions_task_08_DESC:0 "The Greek traders and steppe nomads speak of the lands up north as a place of mystery and wonder. There lie some legendary cities far into the steppe lands, like Gelon, which is at times called Helon. Perhaps it would be beneficial to extend our connections up that way."

 maeotian_missions_task_09:0 "Developing the Maeotic Swamp"
 maeotian_missions_task_09_DESC:0 "While the swampy nature of the Maeotic Lake's shores provides natural defenses, it also prevents the tribes of the lake from developing magnificent ports. Draining portions of it and erecting great cities should change our fortunes."
 maeotian_missions_task_09_tt:0 "Developing the lands should lead to some #G positive#!...and #T interesting#!...changes."

 maeotian_missions_task_10:0 "Might of Makhelonia"
 maeotian_missions_task_10_DESC:0 "Among the highland tribes beyond the Kuban, the Makhli, there is talk of binding all the clans of mountain and plain into a single union under a single banner. [ROOT.GetCountry.GetRuler.GetName]'s strength warrants a crown..."

 maeotian_missions_task_11:0 "Marsh Mercenaries"
 maeotian_missions_task_11_DESC:0 "Many nomadic bands live among the marshes of the Maeotis. Among them are elite warriors whom the tribes have attempted to bribe to patrol the border regions with the wilder clans to the north. These dangerous individuals must be under our control."

 maeotian_missions_task_12:0 "A [ROOT.GetCountry.GetAdjective] Empire"
 maeotian_missions_task_12_DESC:0 "Control of the Maeotic coasts has made us masters of the lake, with the Pontos Euxinos awaiting as our next playground of conquest and influence. No longer a backwater tribal land, [ROOT.GetCountry.GetName] must become a historic power of the north!"

 maeotian_missions_task_14:0 "Heirs of Octamasades"
 maeotian_missions_task_14_DESC:0 "Generations have passed since the usurper Octamasades of the Sindoi was cast out at Labryta and chased into the lands of the Scythians, where he vanished from the histories. In exile there still live his descendants, or men who claim to be. Perhaps one could be brought home and raised upon the throne."

 maeotian_missions_task_15:0 "Recapturing Sinda"
 maeotian_missions_task_15_DESC:0 "Now Gorgippia, the harbor town the old tribes called Sinda, remains a sore spot for the Sindoi, whose kingdom was dissolved and whose kings gave way to Bosporan archons long ago. The city must be taken back and made Sindian once more!"

 maeotian_missions_task_16:0 "Bosporan Intermarriage"
 maeotian_missions_task_16_DESC:0 "Hecataeus was wed into the house of Spartokos in the days of Satyrus I, and so shall the royal lines of the Sindoi and the Bosporans be joined once more."

 maeotian_missions_task_17:0 "The Siraces of the Kuban"
 maeotian_missions_task_17_DESC:0 "A century ago the Siraces drove the last Scythian princes from the middle Kuban, and their horse-herds now graze where our kin once ruled. They raid whom they please, and it was Siracian riders who decided the war between the sons of Pairisades for the Bosporan throne. Neighbors of that sort want watching."

 maeotian_missions_task_18:0 "A Helleno-[ROOT.GetCountry.GetAdjective] Kingdom"
 maeotian_missions_task_18_DESC:0 "Embracing the Greek world, the Sindoi can maneuver to inherit the whole of the Bosporan Kingdom. Let the house of Hecataeus engage in a battle of political intrigue."

 maeotian_missions_task_19:0 "Break the Bosporan Grip"
 maeotian_missions_task_19_DESC:0 "The Spartokids hold the eastern shore of the lake, their garrisons on the best harbors and their toll on every cargo that crosses. But the kingdom has just bled itself white in a war between brothers, and [GetCountry('BPK').GetRuler.GetName] is new to the throne."

 maeotian_missions_task_20:0 "Walls of Earth"
 maeotian_missions_task_20_DESC:0 "Our fathers ringed their villages with banks of earth and timber against the riders of the steppe. Those old works should be raised again, higher and longer, from the lake shore to the Kuban, so that every village has a rampart of its own."

 maeotian_missions_task_21:0 "Apollo and the Labrytai"
 maeotian_missions_task_21_DESC:0 "Apollo has watched over Labryta since the days of the Sindian kings, and it was to the god of the city that Leucon dedicated a statue after casting down Octamasades at its walls. Now the Bosporans claim the god's favor as their own, and their influence has spread with it. The city must become our bastion instead."

 maeotian_missions_task_22:0 "Tower of Tirgatao"
 maeotian_missions_task_22_DESC:0 "Tirgatao of the Iaxamatae was wife to Hecataeus of the Sindoi until he put her aside for a Bosporan bride and shut her in a tower. She escaped, but returned to wage war upon the Sindoi and their Bosporan patrons. The tower where she was imprisoned still stands above the shore."

 maeotian_missions_task_23:0 "Promoting Phanagoria"
 maeotian_missions_task_23_DESC:0 "Along the eastern shore of the Bosporus, Phanagoria stands out as the main center of trade, rivaling Panticapaeum. In our hands, the port city must become a means of controlling entry into the lake."
 maeotian_missions_task_23_tt:0 "#E #Y [GetProvince('(int32)4563').GetName]#!#! can be released as a [THIS.GetCountry.GetAdjective] #E League City#!"

 maeotian_missions_task_25:0 "Restore the Sindian Throne"
 maeotian_missions_task_25_DESC:0 "With Sinda regained and the blood of Octamasades rescued from exile, there is no reason for the Sindian royal seat to sit empty."

 maeotian_missions_task_26:0 "Sindian Silver"
 maeotian_missions_task_26_DESC:0 "Generations ago, silver bearing the legend of the Sindoi passed through every port on the strait, struck in the days before the Bosporans swallowed the coast. The mint fires should be lit again."

 maeotian_missions_task_27:0 "Fish of the Fathers"
 maeotian_missions_task_27_DESC:0 "It is the custom of our people that when a warrior is laid in the earth, one fish is cast upon the grave for every enemy he slew in life. The rite has fallen out of use in the villages. Let it be honored across the Maeotis again."

 maeotian_missions_task_28:0 "Ways of the Marsh"
 maeotian_missions_task_28_DESC:0 "No stranger has ever taken the Maeotic marshes, because no stranger has ever found his way through them, only drowned roads and reed beds..."

 maeotian_missions_task_29:0 "Tanaitan Grain Fleet"
 maeotian_missions_task_29_DESC:0 "Tanais sits at the mouth of the Don, and the grain of the northern country passes by it. With flat-bottomed barges for the river and stout hulls for the lake, those harvests would pass through our hands instead, sold to hungry Greeks and taxed at every landing."

 maeotian_missions_task_30:0 "Our Lake"
 maeotian_missions_task_30_DESC:0 "The Greeks write that our peoples are named for Lake Maeotis. Fools. The lake is named for us."

 maeotian_missions_task_31:0 "No Maiden Unblooded"
 maeotian_missions_task_31_DESC:0 "The Greeks who sail past the Tanais write that we are ruled by our women, and they are not entirely wrong. Our girls ride, hunt and draw the bow beside their brothers, and none of them takes a husband until she has killed. Let the whole people be counted as riders, not half of it."
 maeotian_missions_task_31_tt:0 "A #Y woman#! of our people has a martial skill of #G 8#! or better"

 maeotian_missions_task_32:0 "Masters of the Steppe"
 maeotian_missions_task_32_DESC:0 "The Aorsi press upon our herds from the east, and the lesser clans are waiting to see which of us gives ground. The grass between the lake and the mountains must answer to the Siraces alone."

 maeotian_missions_task_24:0 "[ROOT.GetCountry.GetAdjective] Kurgan Burial"
 maeotian_missions_task_24_DESC:0 "For two centuries the Sindian princes and Scythian overlords who ruled above the tribes of the lake have been honored with great burial mounds which tower over towns and cities, while the tribes lay their own dead in humble, flat graves. If our dead are to be treated so well, the kurgan rite must now be claimed for royals of our own blood."
 
 
 
 

