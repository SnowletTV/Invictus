l_english:
 
 #startup stuff - heritage and deity
 parisii_heritage:0 "Heritage of the Parisii"
 parisii_heritage_desc:0 "Nestled along the vital waterways of the Sekuana, the Parisii have long conducted up and down the river, though their focus on commerce has left them less prepared for taking the field against their neighbors."

 omen_sekuana:0 "Sekuana"
 omen_sekuana_desc:0 "Sekuana is the healing mother-goddess of the eponymous river, particularly associated with the sacred healing springs at her headwaters near Alesia. Offerings are made at these springs in hope of healing. She is the source of health, cleansing, and prosperous river trade for the Gallic tribes.\n\n After the Roman conquest of Gaul, her worship was integrated and temple complex at the springs flourished until Theodosius I seized them for benefit of the Christians."

 deity_sekuana:0 "Sekuana"

 # === PHASE 1: MISSION TASKS & TOOLTIPS ===
 parisii_lutetia_mission_header:0 "The Sekuana Mandate"
 parisii_lutetia_mission:0 "The Sekuana Mandate"
 parisii_lutetia_mission_desc:0 "The lands of the Parisii along the banks of the Sekuana are ripe with opportunity. By bringing the river trade under central authority, unifying the surrounding tribes, and building up the confluences at Lutotetion as a grand metropolitan heartland, we shall forge a dominant river confederation to stand as a beacon of Keltic civilization."
 parisii_lutetia_mission_button:0 "Select Mission"
 parisii_lutetia_mission_BUTTON_TOOLTIP:0 "Achieve on the Sekuana Mandate."
 parisii_lutetia_mission_BUTTON_DETAILS:0 ""
 parisii_lutetia_mission_DESCRIPTION:0 "The lands of the Parisii along the banks of the Sekuana are ripe with opportunity. By bringing the river trade under central authority, unifying the surrounding tribes, and building up the confluences at Lutotetion as a grand metropolitan heartland, we shall forge a dominant river confederation to stand as a beacon of Keltic civilization."
 parisii_lutetia_mission_CRITERIA_DESCRIPTION:0 "This mission will be complete when the Parisii have secured the waterways, subdued the traditionalists, and declared the Sekuana Confederation."

 parisii_lutetia_task_1:0 "The River Guilds"
 parisii_lutetia_task_1_DESC:0 "The powerful Nautae Parisi - the boatmen of the Sekuana - control the flow of trade through our lands. By reaching an accord with these rivermen, we will secure our treasury and assert our rightful claim to the entire Sekuana basin."
 mastery_of_the_sekuana_tt:0 "We will negotiate terms with the rivermen of the Sekuana to secure our trade, gaining #G claims#! across the #Y Parisia Area#!."

 parisii_lutetia_task_2:0 "Sennonian Unification"
 parisii_lutetia_task_2_DESC:0 "We are but one branch of the proud Sennonian people. By demonstrating our strength along the Sekuana, we shall assert hegemony over our kin in Senonia and Catalaunia, uniting our cousins under one banner."
 me_parisii_sennonian_unification_tt:0 "Assert our leadership over our Sennonian cousins, gaining #G claims#! over the #Y Veliocassia Area#! and preparing for their integration."

 parisii_lutetia_task_3:0 "The Wharves of Lutotetion"
 parisii_lutetia_task_3_DESC:0 "Our island capital is ideally situated to control river commerce. By expanding our wharves and marketplaces along the Sekuana, we will draw the wealth of the river directly into our coffers."
 me_parisii_develop_lutetia_choice_tt:0 "We will have the opportunity to subsidize a new marketplace, tax office, or port facility."

 parisii_lutetia_task_3b:0 "The Island Citadel"
 parisii_lutetia_task_3b_DESC:0 "Commerce without defense invites plunder. We must raise formidable stone ramparts and towers across the island of Lutotetion, securing the capital against all who would seek to seize our wealth."

 parisii_lutetia_task_4:0 "Coinage and Commerce"
 parisii_lutetia_task_4_DESC:0 "Our centralization efforts require a unified economic policy. We must decide how wealth is measured and traded across the Confederation."

 parisii_lutetia_task_3c:0 "Civic Heartland"
 parisii_lutetia_task_3c_DESC:0 "With our wharves bustling and our citadel unassailable, Lutotetion must become the civic and judicial soul of the Sekuana. Establishing courts, administrative halls, and municipal institutions will consolidate our governance."

 parisii_lutetia_task_r1:0 "The Apiaries of Riobe"
 parisii_lutetia_task_r1_DESC:0 "The wildflower meadows and groves of Riobe hold untamed agricultural wealth. By mandating that Riobe remain a dedicated rural farming settlement and protecting its hives, we ensure an abundant surplus of golden honey for trade and sustenance."

 parisii_lutetia_task_r2:0 "The Woad Mills of Mellodunum"
 parisii_lutetia_task_r2_DESC:0 "The plains of Mellodunum are famed for the cultivation of woad. By establishing crushing mills and artisan workshops, we will supply our textile dyers and provide our warriors with sacred war paint."

 parisii_lutetia_task_r3:0 "The Sekuana Ferry Network"
 parisii_lutetia_task_r3_DESC:0 "The Sekuana is our natural highway. By linking our rural breadbaskets, dye mills, and fortresses through an organized network of river ferries and boatmasters, we accelerate trade and the swift movement of our armies across unbridged river reaches."

 parisii_lutetia_task_5:0 "Subdue the Old Guard"
 parisii_lutetia_task_5_DESC:0 "The traditionalists despise our growing centralization. The time for appeasement has passed. We must confront the rural chieftains and secure their submission once and for all."
 subdue_old_guard_task_tt:0 "Confront the conservative rural chieftains, choosing whether to appease their demands or break their power by force."
 subdue_old_guard_tt:0 "The Old Guard rebellion has been peacefully averted or completely crushed, and our authority is restored."

 parisii_lutetia_task_6:0 "Secure the Watersheds"
 parisii_lutetia_task_6_DESC:0 "The Sekuana is more than a river; it is a sprawling basin of interconnected tributaries. We must ensure that the major crossings of this watershed fall under our direct control or the control of our loyal subjects."

 parisii_lutetia_task_7:0 "The Springs of Sekuana"
 parisii_lutetia_task_7_DESC:0 "At the sacred springs near Alesia, the healing goddess Sekuana holds sway. We must construct her grand temple and bind the Druids directly to our royal administration."
 sekuana_pantheon_req_tt:0 "The river goddess Sekuana is part of our active Pantheon."

 parisii_lutetia_task_8:0 "The Belgae Ultimatum"
 parisii_lutetia_task_8_DESC:0 "The Belkai to our north pose a constant threat. We must secure their subservience to ensure the safety of our northern frontier and free passage through the river basin."

 parisii_lutetia_task_9:0 "The Sekuana Confederation"
 parisii_lutetia_task_9_DESC:0 "Our borders are secure, our rivals are subdued, and the river flows with gold. The time has come to declare a unified Confederation."
 me_parisii_confederation_tt:0 "Unite all the tribes of the Sekuana under a permanent federal council, forming the Sekuana Confederation."

 parisii_lutetia_task_10:0 "The Nautae Assembly"
 parisii_lutetia_task_10_DESC:0 "Our tribal assemblies are unable to properly govern our larger and more populous territory. We must adapt a more centralized form of government. We must convene the Nautae senate and enact state reforms."
 me_parisii_nautae_assembly_tt:0 "Convene the grand assembly to enact permanent government reforms, abandoning tribal rule."

 parisii_lutetia_task_11:0 "The Agedincon Bulwark"
 parisii_lutetia_task_11_DESC:0 "Agedincon stands as our shield against the southern tribes. We must heavily fortify this crossing to lock down the Icauna river valley."

 parisii_lutetia_task_12:0 "The Caracotinon Watch"
 parisii_lutetia_task_12_DESC:0 "Caracotinon guards the mouth where the Sekuana meets the great northern sea. A fortress here will monitor cross-channel raiders and secure shipping."

 parisii_lutetia_task_13:0 "The Eastern Approach"
 parisii_lutetia_task_13_DESC:0 "The eastern plains are vast and vulnerable. A sprawling military infrastructure in Condate will protect our heartland from Belkai incursions."

 fortified_crossing_built_tt:0 "Fortifies this crossing and establishes a protected trade hub, advancing our regional riverine defenses."

 # === PHASE 1: EVENT TEXT & CHOICES ===
 me_parisii.1.t:0 "The Sekuana Guilds Submit"
 me_parisii.1.desc:0 "The powerful Nautae Parisi, the ancient guild of rivermen and boatmasters along the Sekuana, have gathered at our capital to negotiate their status. By formalizing our relationship with them, we can ensure the orderly flow of river traffic and harness their vast trading network. Their assent will cement Lutotetion as the premier crossroads of northern Gaul, opening the way for our expansion throughout the river basin."
 me_parisii.1.a:0 "Grant them guaranteed privileges and we shall become their trade hub."
 me_parisii.1.a.tt:0 "Grant guaranteed privileges to the Nautae Parisi, securing heavy trade and immediate wealth at the expense of centralization."
 me_parisii.1.b:0 "Exert direct control of the tolls."
 me_parisii.1.b.tt:0 "Seize direct royal control over river tolls, funneling tax directly to the crown and increasing centralization."

 me_parisii.2.t:0 "Our Envoys Depart"
 me_parisii.2.desc:0 "Our diplomats have ridden out to our Sennonian neighbors with our demands of fealty."
 me_parisii.2.a:0 "We await their answer."
 me_parisii.2.a.tt:0 "We will favor a diplomatic approach."
 me_parisii.2.b:0 "They will kneel or bleed."
 me_parisii.2.b.tt:0 "We will favor a hostile approach."

 me_parisii.3.t:0 "Sovereignty over the Sekuana"
 me_parisii.3.desc:0 "Our envoys have reached the council of the Sennonian basin. They demand we declare our final intentions: peaceful integration or military subjugation."
 me_parisii.3.a:0 "Offer them equal partnership in Lutotetion."
 me_parisii.3.b:0 "Demand absolute submission. To arms!"

 me_parisii.3_snn.t:0 "Assurances to Agedincum"
 me_parisii.3_snn.desc:0 "The envoys of the Sennones have returned with their council's reply. While our shared blood is acknowledged, their elders demand lasting guarantees. They will not bend the knee to Lutetia unless the ancient lineage of the Sennonian kings is granted honored standing and dynastic assurances in our commonwealth."
 me_parisii.3_snn.a:0 "Pledge royal assurances from our treasury."
 me_parisii.3_snn.b:0 "Our ruler will guarantee their standing from personal wealth."
 me_parisii.3_snn.c:0 "Demand unconditional submission."

 me_parisii.4.t:0 "The Parisii Demand Fealty"
 me_parisii.4.desc:0 "The newly emergent power on the Sekuana demands our submission. If we refuse, they will take our lands by the sword."
 me_parisii.4.a:0 "We have no choice but to bend the knee."
 me_parisii.4.b:0 "We will fight!"

 me_parisii.5.t:0 "Ultimatum Delivered"
 me_parisii.5.desc:0 "Lutotetion's armies stand at our borders. Their standard-bearers have delivered a harsh demand: submit or face immediate eradication."
 me_parisii.5.a:0 "We will never surrender our ancestral hills!"

 me_parisii.6.t:0 "Sennonian Submission"
 me_parisii.6_snn.desc:0 "Our neighbors, the [GetCountry('SNN').GetName], have recognized our hegemony. Their envoys have arrived to pledge their warriors and wealth to our cause."
 me_parisii.6_ctl.desc:0 "Our neighbors, the [GetCountry('CTL').GetName], have recognized our hegemony. Their envoys have arrived to pledge their warriors and wealth to our cause."
 me_parisii.6.a:0 "A bloodless victory."
 concessions_sent_tt:0 "We will dispatch envoys carrying gold and trade privileges to bribe our neighbors, significantly increasing their likelihood of peaceful submission."

 me_parisii.7.t:0 "Sennonian Defiance"
 me_parisii.7_snn.desc:0 "Our envoys have returned from [GetCountry('SNN').GetName]. The chiefs laughed at our demands, asserting that they bow to no upstart river merchants. They are already raising shields; war is upon us."
 me_parisii.7_ctl.desc:0 "Our envoys have returned from [GetCountry('CTL').GetName]. The chiefs laughed at our demands, asserting that they bow to no upstart river merchants. They are already raising shields; war is upon us."
 me_parisii.7.a:0 "They will bend or bleed!"

 me_parisii.8.t:0 "Develop Lutotetion"
 me_parisii.8.desc:0 "The security of Lutotetion's river crossing has spurred a massive boom in urban development. Merchants, craftsmen, and nobles are flocking to our capital."
 me_parisii.8.a:0 "Subsidize a new market."
 me_parisii.8.b:0 "Fund a tax office."
 me_parisii.8.c:0 "Expand the port facilities."

 me_parisii.9.t:0 "The Old Guard Ultimatum"
 me_parisii.9.desc_clan_chief:0 "As our centralization efforts press forward, the traditionalists have found a powerful champion. A disgruntled clan chief of our own tribes, [traditionalist_spokesperson.GetName], has gathered rural warriors to deliver a stark ultimatum: halt Lutotetion's mercantile consolidation, or face an immediate secession war of the rural valleys."
 me_parisii.9.desc_minor_noble:0 "The rapid expansion of Lutotetion's river tolls has left many minor nobles out of the coin networks. An ambitious noble, [traditionalist_spokesperson.GetName], has successfully united the disgruntled elites under the banner of the old ways. They demand we pay off their ancestral claims on the riverbanks or face a civil war."
 me_parisii.9.desc_hometown_hero:0 "With our clan chiefs silent, a backwater hometown hero, [traditionalist_spokesperson.GetName], has risen from the depths of the Sennonian forests to claim power. Backed by zealous druids and angry peasants, they have issued a wild threat to tear down Lutotetion's palisades unless we restore the old, decentralized barter statutes."
 me_parisii.9.a:0 "Attempt to buy their loyalty."
 me_parisii.9.b:0 "Refuse to pay tribute. Prepare for war!"

 me_parisii.10.t:0 "The Final Price"
 me_parisii.10.desc:0 "The greedy warlords demand even more coin. If we pay this exorbitant sum, they may finally stand down. If we refuse, blood will flow."
 me_parisii.10.a:0 "Pay the final bribe."
 me_parisii.10.b:0 "The price is too high. War!"
 me_parisii.10_success.t:0 "Traditionalist Pacification"
 me_parisii.10_success.desc:0 "The final bribe has done its work. [traditionalist_spokesperson.GetName] has accepted our gold and ancestral land rights, dispersing the peasant levies back to their rural valleys. The old guard is satisfied, for now."
 me_parisii.10_success.a:0 "A costly peace, but our consolidation continues."
 appease_old_guard_success_tt:0 "The Old Guard rebellion has been peacefully averted."

 me_parisii.11.t:0 "The Old Guard Revolts!"
 me_parisii.11.desc:0 "Traditionalist chiefs from the rural hinterlands have raised their banners in open rebellion. They refuse to bow to our centralized authority and seek to shatter our new state."
 me_parisii.11.a:0 "To arms! Crush the traitors!"

 me_parisii.12.t:0 "The Sekuana Economy"
 me_parisii.12.desc:0 "Our centralization efforts have reached a tipping point. We must formally codify how wealth is handled across the Sekuana."
 me_parisii.12.a:0 "Mint the Gold Staters."
 me_parisii.12.a.tt:0 "We will adopt the #Y Coin Minting Initiative#! law. If we already have it, we gain wealth."
 me_parisii.12.b:0 "Standardize the Barter Networks."
 me_parisii.12.b.tt:0 "We will adopt the #Y Barter Economy Statutes#! law. If we already have it, we gain political capital."

 me_parisii.13.t:0 "The Sekuana Confederation"
 me_parisii.13.desc:0 "Through diplomacy, coin, and the sword, the Parisii have brought the disparate tribes and river guilds of the Sekuana into a unified whole. Today, we formalize our dominance."
 me_parisii.13.a:0 "Hail the Confederation!"

 me_parisii.14.t:0 "The Nautae Assembly"
 me_parisii.14.desc:0 "Our tribal confederacy has outgrown the council of chiefs. The elites have gathered in Lutotetion to draft a permanent constitution for the state."
 me_parisii.14.a:0 "Proclaim a Plutocratic Merchant Republic."
 me_parisii.14.a.tt:0 "Reform into a #Y Plutocratic Republic#! governed by the merchant senate of the Nautae Parisi."
 me_parisii.14.b:0 "Codify an Oligarchic Noble Senate."
 me_parisii.14.b.tt:0 "Reform into an #Y Oligarchic Republic#! governed by the hereditary council of elders."
 me_parisii.14.c:0 "Enact an Aristocratic Monarchy."
 me_parisii.14.c.tt:0 "Reform into an #Y Aristocratic Monarchy#! governed by the High King and noble chiefs."
 me_parisii.14.d:0 "Consolidate absolute power under the High King."
 me_parisii.14.d.tt:0 "Reform into an #Y Autocratic Monarchy#! consolidating absolute martial power under the High Warlord."

 me_parisii.15.t:0 "The Springs of Sekuana"
 me_parisii.15.desc:0 "At the sacred headwaters of Alesia, our priests have unearthed ancient offerings. The powerful presence of our goddess Sekuana herself can be felt in the waters here."
 me_parisii.15.a:0 "Build her Healer's Sanctuary."
 me_parisii.15.a.tt:0 "Dedicates her spring to growth and healing, constructing her temple sanctuary."

 me_parisii.16.t:0 "The Belgae Ultimatum"
 me_parisii.16.desc:0 "The northern tribes have proven to be a thorn in our side. We have dispatched envoys to the region north of the Sekuana demanding their submission."
 me_parisii.16.a:0 "We shall send our demands across the river."
 me_parisii.16.a.tt:0 "We demand the subjugation of the Belgic tribes along the river and our borders."

 # The Sending Phase (Player Choice)
 me_parisii.17.t:0 "The Sekuana Ultimatum"
 me_parisii.17.desc:0 "An envoy from the newly empowered Parisii has arrived at our tribal capital. They demand we lay down our arms and formally submit to their river confederation as feudatories. If we refuse, war is certain."
 me_parisii.17.a:0 "We must submit."
 me_parisii.17.b:0 "We bow to no one!"

 # AI Evaluation Phase (Fires on Lutetia Player)
 me_parisii.17_eval.desc:0 "Our envoys have crossed the Sekuana and entered the territory of the [belgic_target.GetName]. Chieftain [belgic_target.GetRuler.GetName] is currently holding council to deliberate our terms of fealty..."
 me_parisii_await.a:0 "We await their response."

 # Human Player Ultimatum (Fires on Belgic Human Player in Multiplayer)
 me_parisii.17_human.desc:0 "An envoy from the newly empowered [lutetia_overlord.GetName] has arrived at our tribal capital. They demand we lay down our arms and formally submit to their river confederation as feudatories. If we refuse, war is certain."

 # Notification Titles & Buttons (Fires on Lutetia Player)
 me_parisii.17_accept.t:0 "Belgic Submission"
 me_parisii.17_accept.desc:0 "Envoys from [submitting_belgic_tribe.GetName] have returned. Intimidated by our rising hegemony, their chiefs have bent the knee and pledged their spears as feudatories."
 me_parisii.17_accept.a:0 "They have made the wise choice."

 me_parisii.17_refuse.t:0 "Belgic Defiance"
 me_parisii.17_refuse.desc:0 "The chiefs of [defying_belgic_tribe.GetName] have spat upon our demands. They assert that they shall not bow to some upstart river merchants and have begun to prepare for war."
 me_parisii.17_refuse.a:0 "And war it shall be."

 me_parisii.18.t:0 "Crossing Secured"
 me_parisii.18.desc:0 "Our military engineers have successfully secured this vital crossing. By laying down permanent towers and palisades, we have established a protected hub for traveling merchants. With the funds sourced from local trade, these garrisons will stand as a shield for our heartland without draining our coffers."
 me_parisii.18.a:0 "We continue to bring safety and prosperity to our river!"

 me_parisii.19.t:0 "Secure the Watersheds"
 me_parisii.19.desc:0 "We have successfully secured the key crossings of the Sekuana basin. No longer can our enemies restrict our river trade; our dominance is assured."
 me_parisii.19.a:0 "Our influence continues to flow."

 me_parisii.20.t:0 "An End to the Rebellion"
 me_parisii.20.desc:0 "The embers of the rebellion have finally died out. The traditionalists have laid down their arms, and our authority over the hinterlands is restored."
 me_parisii.20.a:0 "Peace and unity."

 # === MODIFIERS ===
 lutetian_river_guilds:0 "The Nautae Parisi"
 desc_lutetian_river_guilds:0 "The powerful river guilds of the Parisii have been granted sweeping autonomy to manage the flow of goods along the Sekuana, bringing immense wealth and foreign trade to Lutotetion."
 seine_river_tolls:0 "Sekuana River Tolls"
 desc_seine_river_tolls:0 "The state maintains a tight grip on the vital river arteries of the Sekuana, extracting heavy tolls from passing merchants and funneling the wealth directly into the state treasury."
 parisii_stater_mint:0 "Gold Stater Mint"
 desc_parisii_stater_mint:0 "A centralized mint dedicated to pressing uniform gold staters, streamlining trade across the river valleys."
 parisii_barter_network:0 "Standardized Barter"
 desc_parisii_barter_network:0 "A codified network of traditional trade values keeps the rural populations deeply content with our rule."
 seine_confederation_capital:0 "Confederation Capital"
 desc_seine_confederation_capital:0 "The undisputed political and economic heart of the entire Sekuana river basin."
 crossing_construction_effort:0 "Crossing Construction"
 desc_crossing_construction_effort:0 "Local resources are being heavily taxed to fund a massive fortification project."
 seine_fortified_crossing:0 "Secured Basin"
 desc_seine_fortified_crossing:0 "The interlocking network of fortresses protects the basin from sudden raids."
 parisii_urban_crossing:0 "Urban River Crossing"
 desc_parisii_urban_crossing:0 "A massive hub of riverine commerce heavily defended by palisades, acting as an inland seaport for foreign merchants."
 parisii_protected_trade_hub:0 "Protected Trade Hub"
 desc_parisii_protected_trade_hub:0 "Fortifications protect our merchants, easing the establishment of future urban centers along the river."
 parisii_crossing_expansion_effort:0 "Crossing Expansion Effort"
 desc_parisii_crossing_expansion_effort:0 "State subsidies prioritize the rapid clearing and expansion of crossing sites, significantly easing the cost of city development and infrastructure construction."
 seine_engineering_tier_1:0 "Riverine Engineering I"
 seine_levies_tier_1:0 "Sekuana Levies I"
 seine_engineering_tier_2:0 "Riverine Engineering II"
 seine_levies_tier_2:0 "Sekuana Levies II"
 seine_engineering_tier_3:0 "Riverine Engineering III"
 seine_levies_tier_3:0 "Sekuana Levies III"
 seine_forts_req_tt:0 "Our nation has fortified at least one major river crossing."
 seine_council_harmony:0 "Council Harmony"
 desc_seine_council_harmony:0 "The Sekuana Confederation operates as a delicate balance of tribal chiefs, warlords, and merchant guilds. By maintaining our republican traditions, the great families remain fiercely loyal to the state apparatus."
 seine_autocratic_grip:0 "Autocratic Grip"
 desc_seine_autocratic_grip:0 "The Master of the Sekuana rules with unquestioned authority. The total centralization of power ensures the swift execution of the state's will, drawing the admiration of the masses and the absolute obedience of the elites."
 parisii_revolt_name:0 "Old Guard Revolt"
 sekuana_healing_springs:0 "The Springs of Sekuana"
 desc_sekuana_healing_springs:0 "The sacred healing springs of the river goddess Sekuana draw pilgrims from distant lands, bringing health, wealth, and divine favor to the region."
 parisii_revolt_name_adjective:0 "Traditionalist"
 SEINE_CONFEDERATION:0 "Sekuana Confederation"
 SEINE_CONFEDERATION_ADJ:0 "Sekuanan"
 NICKNAME_SEINE_FOUNDER:0 "the River-Master"
 me_parisii.21.t:0 "The Sennonian Dynasty Welcomed"
 me_parisii.21.desc:0 "With the peaceful incorporation of Senonia into our realm, we honor our sacred covenant. The royal lineage of the Sennones is welcomed with high honor into Lutetia, their noble house preserved and celebrated."
 me_parisii.21.a:0 "Honor our brothers of the Seine."
 sennonian_dynasty_honored_tt:0 "The royal family of the Sennones joins our realm with elevated prestige and prominence."
 sennonian_assurances_modifier:0 "Sennonian Dynastic Covenant"
 desc_sennonian_assurances_modifier:0 "Guarantees of honored standing and lineage have secured the unwavering fealty of our Sennonian kin."
 sennonian_refused_assurances:0 "Refused Dynastic Assurances"
 me_parisii.3_ctl_rider.t:0 "The Marne-Sekuana Accord"
 me_parisii.3_ctl_rider.desc:0 "Our diplomats have reached Durocatalaunum, but the chieftains of the Catalauni greet our proposal with cautious reservations. Their river barges must navigate the Sekuana past our toll-posts at Lutotetion, incurring steep duties. If we desire their peaceful submission, they demand trade concessions—either favored toll exemption along our waterways, or direct trade routes allocated to their capital. Should we refuse, they will take up arms."
 me_parisii.3_ctl_rider.a:0 "Grant them favored river toll status."
 me_parisii.3_ctl_rider.b:0 "Allocate trade routes directly to Durocatalaunum."
 me_parisii.3_ctl_rider.c:0 "Refuse! The Sekuana belongs to Parisia alone."
 me_parisii.22.t:0 "The Honey Harvest of Riobe"
 me_parisii.22.desc:0 "The apiaries across the sunny meadows of Riobe are overflowing. Pots of golden honey and beeswax are ferried downstream to Lutotetion, sweetening our feasts and drawing foreign traders eager for our produce."
 me_parisii.22.a:0 "Sweet wealth flows down the river."
 me_parisii.23.t:0 "The Blue Dye of Mellodunum"
 me_parisii.23.desc:0 "The woad mills along the riverbank are in full production. Great vats of deep blue dye produce rich textiles for our nobles and fierce war-paint for our warriors."
 me_parisii.23.a:0 "A mark of pride and terror."
 me_parisii.24.t:0 "The River Highway"
 me_parisii.24.desc:0 "From the shallow bends of Riobe to the wharves of Lutotetion and the crossing at Mellodunum, the Sekuana has become a bustling highway. Skilled boatmen ferry our folk, food, and warriors swiftly across the currents."
 me_parisii.24.a:0 "Mastery of the river is ours."
 catalaunian_trade_routes:0 "Catalaunian Trade Access"
 desc_catalaunian_trade_routes:0 "Direct commercial allocation to the Sekuana trade network supplies foreign commodities and spurs local markets."
 seine_tolls_concession:0 "Sekuana Tolls Concession"
 desc_seine_tolls_concession:0 "In order to appease neighboring tribes, we have reduced river tolls, slightly impacting national commerce revenue."
 catalaunian_river_privilege:0 "Sekuana River Trade Privilege"
 desc_catalaunian_river_privilege:0 "Special exemption from Parisii river duties allows our merchants to trade freely along the Sekuana and Marne."
 riobe_wild_apiaries:0 "Wild Honey Apiaries"
 desc_riobe_wild_apiaries:0 "Vast honey groves and wild hives produce prized honey and wax, enriching local farmers."
 mellodunum_woad_mills:0 "Mellodunum Woad Mills"
 desc_mellodunum_woad_mills:0 "River-powered crushing mills refine woad leaves into valuable blue dye, enriching local freemen and craftsmen."
 sekuana_ferry_network:0 "Sekuana Ferry Network"
 desc_sekuana_ferry_network:0 "A coordinated fleet of river ferries and flat-bottomed punts accelerates communication, logistics, and army transit across unbridged river reaches."
 parisii_lutetia_task_pillar:0 "The Pillar of the Nautae"
 parisii_lutetia_task_pillar_DESC:0 "The wealthy boatmasters and merchant-nobles of Lutotetion have amassed vast fortunes along the Sekuana. To honor the gods and sanctify our island capital, the Nautae Parisi seek to carve a grand monumental pillar of limestone on the Île de la Cité, establishing a sacred Holy Site to their divine patron."
 pillar_pantheon_req_tt:0 "Our active Pantheon includes a deity celebrated on the Pillar of the Boatmen (Cernunnos, Taranis, Lugus, Smertrios, or Esus)."
 me_parisii.22.desc_slave:0 "Vast slave estates established across the fertile meadows of Riobe yield massive harvests of wild honey and beeswax under strict supervision. Sweet wealth is loaded into river barges destined for the capital."
 me_parisii.22.desc_tribal:0 "The traditional clans of Riobe have expanded their ancient beekeeping enclaves, harvesting honey and honeycomb from hollowed trunks and meadows in sacred harmony with tribal law. The bounty flows freely to our tables."
 me_parisii.25.t:0 "The Pillar of the Boatmen"
 me_parisii.25.desc:0 "Upon the island of Lutotetion, where the currents of the Sekuana divide and embrace the land, the guild of the Nautae Parisi has erected a monumental stone column. Master masons have sculpted sacred reliefs into the stone, honoring the divine protectors of our river, our commerce, and our warriors. Today, the elders and priests consecrate this holy ground, proclaiming a permanent Holy Site to our divine patron."
 me_parisii.25.a:0 "Carve the likeness of Cernunnos, Master of Wealth and the Wild."
 me_parisii.25.b:0 "Carve the wheel of Taranis, Lord of the Sky and Thunder."
 me_parisii.25.c:0 "Carve the symbols of Lugus, Patron of Crafts and Wisdom."
 me_parisii.25.d:0 "Carve the sacred protector of our warriors."
 riobe_tribal_apiaries:0 "Tribal Beekeeping Enclaves"
 desc_riobe_tribal_apiaries:0 "Traditional clansmen tend thriving wild apiaries across the sunny meadows of Riobe, producing honey and wax for the tribe."
 parisii_diverted_trade_route:0 "Diverted River Trade Route"
 desc_parisii_diverted_trade_route:0 "A commercial shipping route has been diverted from Lutotetion to Durocatalaunum to fulfill river toll agreements."
 pillar_cernunnos_blessing:0 "Blessing of Cernunnos"
 desc_pillar_cernunnos_blessing:0 "Veneration of the horned lord on the island pillar bestows abundance upon the noble merchants of the Sekuana."
 pillar_taranis_blessing:0 "Blessing of Taranis"
 desc_pillar_taranis_blessing:0 "The thunderous wheel of Taranis carved upon our capital's pillar inspires martial fervor and obedience among our warrior aristocracy."
 pillar_lugus_blessing:0 "Blessing of Lugus"
 desc_pillar_lugus_blessing:0 "The multi-skilled god of oaths and craftsmanship guides our civic leaders and artisans towards greater ingenuity."
 me_parisii.9.desc_sennonian_exile:0 "Having annexed Senonia without honoring their royal covenant, the dispossessed noble [traditionalist_spokesperson.GetName] has rallied our disgruntled rural chiefs to take back their ancestral freedoms by the spear!"
 me_parisii.10.c:0 "Not one stater to these rustics! Prepare for battle."
 me_parisii.26.t:0 "The Catalaunian Trade Route"
 me_parisii.26.desc:0 "With the formal incorporation of Catalaunia into our direct realm, our merchants in Lutotetion petition to recover the vital river trade route that was granted to Durocatalaunum during the fealty negotiations. Reclaiming our route will restore trade capacity to our capital, but the Catalaunians will view it as a betrayal of their regional privileges. Alternatively, we may allow Durocatalaunum to keep the flourishing trade routes as an honored provincial hub."
 me_parisii.26.a:0 "Reclaim our capital trade route."
 me_parisii.26.b:0 "Honor Durocatalaunum's commercial privileges permanently."
 catalaunian_routes_revoked:0 "Revoked River Concession"
 desc_catalaunian_routes_revoked:0 "The revocation of Sekuana shipping rights has provoked bitter resentment and commercial dislocation across the region."
 catalaunian_trade_retained:0 "Preserved Commercial Rights"
 desc_catalaunian_trade_retained:0 "Local elites celebrate the permanent preservation of their flourishing river trade connections."
 belsa_cereal_heartland:0 "Belsa Cereal Heartland"
 desc_belsa_cereal_heartland:0 "The rich, open plains of the Beauce produce vast yields of grain and barley, sustaining cities across the watershed."
 parisian_market_gardens:0 "Alluvial Market Gardens"
 desc_parisian_market_gardens:0 "Intensive vegetable cultivation on the silt floodplains directly feeds the growing population of the capital."
 parisii_lutetia_task_r4:0 "Alluvial Market Gardens"
 parisii_lutetia_task_r4_DESC:0 "The silt floodplains of the Marne and Seine confluences at Cala and Catalacus are wonderfully fertile. Establishing intensive vegetable farming settlements will supply a continuous stream of fresh food directly to the capital's markets."
 parisii_lutetia_task_r5:0 "Granary of the Belsa"
 parisii_lutetia_task_r5_DESC:0 "The vast, sun-drenched plains of the Belsa at Avalocum represent one of the richest cereal basins in all of Gaul. By funding organized grain farming settlements, we will turn these fields into the undisputed breadbasket of our realm."
 parisii_lutetia_task_r6:0 "Cheesemakers of the Yonne"
 parisii_lutetia_task_r6_DESC:0 "The lush pastures along the Armançon and Aube valleys support healthy herds of dairy cattle. By investing in rural dairy settlements, our herdsmen will produce prized Gallic cheeses and butter, enriching local producers."
 parisii_lutetia_task_r7:0 "Towpaths and Cordage of the Marne"
 parisii_lutetia_task_r7_DESC:0 "The hemp fields and draft animals of the Catalauni along the Marne offer crucial industrial supplies. We must decide whether to use them for towpaths to pull heavy river barges upstream, or to supply our shipyards with heavy cordage, rigging, and sails."
 me_parisii.26.c:0 "Revoke the toll exemption and restore full river duties."
 me_parisii.26.d:0 "Honor the river toll exemption indefinitely."
 me_parisii.27.t:0 "The Market Gardens of the Seine"
 me_parisii.27.desc:0 "The fertile alluvial banks right outside Lutotetion have been transformed into thriving market gardens. Cartloads and flat-bottomed punts of fresh vegetables arrive daily at the capital's markets, ensuring our urban populace is well-fed."
 me_parisii.27.a:0 "A bountiful harvest."
 me_parisii.28.t:0 "The Granary of the Belsa"
 me_parisii.28.desc:0 "The golden wheat and barley fields across the Belsa stretch as far as the eye can see. Huge grain reserves are barged down the river, filling the storehouses of Lutotetion to the brim."
 me_parisii.28.a:0 "Our granaries overflow!"
 me_parisii.29.t:0 "Cheesemakers of the Yonne"
 me_parisii.29.desc:0 "In the river valleys of the upper Seine and Yonne, herdsmen have perfected the craft of aging firm and soft cheeses from cow and ewe milk. Traders from across Gaul eagerly purchase these delectable wheels."
 me_parisii.29.a:0 "A true Gallic delicacy."
 me_parisii.30.t:0 "Towpaths and Rigging of the Marne"
 me_parisii.30.desc:0 "The fibrous hemp of Catalaunia and the strong draft oxen of the Marne valley provide vital resources. Our council must choose how to deploy these valuable materials."
 me_parisii.30.a:0 "Build towpaths along the riverbanks to pull merchant barges upstream."
 me_parisii.30.b:0 "Twist the hemp into heavy naval rigging and cordage for our river fleets."
 gallic_cheesemakers:0 "Gallic Cheesemakers"
 desc_gallic_cheesemakers:0 "Rich pasturelands and skilled herdsmen produce prized Gallic cheeses, bolstering local food supply and trade."
 marne_towpaths:0 "Marne River Towpaths"
 desc_marne_towpaths:0 "Paved towpaths allow draft oxen to pull heavy cargo barges against river currents, unlocking superior trade connectivity."
 marne_naval_rigging:0 "Marne Naval Rigging"
 desc_marne_naval_rigging:0 "Abundant supplies of durable hemp cordage and sails accelerate ship construction and bolster our riverine war galleys."
 me_parisii.31.t:0 "The Broken Marne Accord"
 me_parisii.31.desc:0 "With Durocatalaunum falling from our grasp into hostile hands, the ancient river agreements forged along the Marne are shattered. The upriver chieftains can no longer hold up their end of our commercial covenant. Our boatmasters in Lutotetion have promptly reasserted total dominance over the Sekuana, terminating all trade concessions and restoring full river tolls."
 me_parisii.31.a:0 "The Sekuana flows for Parisia once more!"
 me_parisii.31.a.tt:0 "All river toll concessions and diverted shipping routes are terminated, restoring complete trade authority to our capital."

 # Herds of Diodurum
 parisii_lutetia_task_horses:0 "The Herds of Diodurum"
 parisii_lutetia_task_horses_desc:0 "Across the western plains of Diodurum, prized Gaulish warhorses graze in lush pastures. By investing in organized settlement infrastructure here, we can turn this crossroads into a specialized center for breeding, training, and equipping our chariot corps."
 me_parisii.32.t:0 "The Herds of Diodurum"
 me_parisii.32.desc:0 "The settlement at Diodurum has been developed according to our grand design. Charioteers and horse-breeders gather at the crossroads, awaiting word on how the realm shall employ their magnificent equine herds."
 me_parisii.32.a:0 "Erect the War Studs to drill our charioteers."
 me_parisii.32.b:0 "Expand the horse-breeding estates for export."
 me_parisii.32.c:0 "Establish a grand crossroads remount station."
 me_parisii.32.d:0 "Grant grazing rights to the herder clans."
 diodurum_war_studs:0 "War Studs of Diodurum"
 desc_diodurum_war_studs:0 "Elite warhorses drilled alongside trained charioteers provide terrifying battlefield coordination and rapid strategic movement."
 diodurum_breeding_estates:0 "Diodurum Breeding Estates"
 desc_diodurum_breeding_estates:0 "Thriving equine estates produce an abundance of stout draught horses and warhorses, bolstering local commerce and chariot durability."
 diodurum_crossroads_station:0 "Crossroads Remount Station"
 desc_diodurum_crossroads_station:0 "A centralized supply of fresh mounts streamlines trade and logistics, inspiring spirited chariot charges across the realm."
 diodurum_clan_herders:0 "Diodurum Herder Clans"
 desc_diodurum_clan_herders:0 "Traditional pastoral clans provide an unending supply of fearless tribesmen and sturdy ponies to the national warband."

 # Archives of the Nautae
 parisii_lutetia_task_archives:0 "Archives of the Nautae"
 parisii_lutetia_task_archives_desc:0 "As Lutotetion grows in wealth and renown, our boatmen, druids, and elders require permanent institutions of learning, law, and religious record. By establishing libraries and academies alongside the sacred sanctuaries of the island, we ensure our capital becomes the intellectual beacon of the Sekuana."
 me_parisii.33.t:0 "Archives of the Nautae"
 me_parisii.33.desc:0 "Upon the island of Lutotetion, alongside the monumental pillar of our pantheon, marble halls and parchment archives now stand. Scribes, druids, and navigators gather to record sacred genealogies, compile navigational river charts, and codify the legal customs of our people. The heart of Parisia now commands both the intellect and the soul of the river."
 me_parisii.33.a:0 "Let wisdom guide the oars of Parisia!"
 lutetia_archives_and_scholars:0 "Archives of the Nautae"
 desc_lutetia_archives_and_scholars:0 "Scholars, scribes, and river navigators gather in our capital to teach civic law, record river tolls, and advance national innovation."

 # Satellite Cities
 parisii_lutetia_task_agedincum_city:0 "Oppidum of Agedincum"
 parisii_lutetia_task_agedincum_city_desc:0 "Agedincum is the ancestral martial citadel of the Senones on the Yonne. By elevating this stronghold into a formal civitas with training grounds and a public assembly forum, we secure a southern warrior capital capable of fielding legions of fearless freemen."
 me_parisii.34.t:0 "The Oppidum of Agedincum"
 me_parisii.34.desc:0 "The ancient fortress of Agedincum stands commanding above the Yonne. Its warrior traditions run deep, and with the backing of our realm, its elders seek to formalize its civic charter and assemble thousands of stalwart Gaulish braves under our banner."
 me_parisii.34.a:0 "Hail the martial shield of the southern Sekuana!"
 me_parisii.34.b:0 "Subsidize the civic charter of the oppidum."
 me_parisii.34.c:0 "Let it remain a frontier garrison for now."
 agedincum_martial_oppidum:0 "Martial Oppidum of Agedincum"
 desc_agedincum_martial_oppidum:0 "A fortified civic center dedicated to training, martial assemblies, and the drill of stalwart Gaulish freemen."
 senonian_march_magistrate:0 "Honored Magistrate of Senonia"
 desc_senonian_march_magistrate:0 "Rewarded with regional prominence and judicial authority, this governor maintains unwavering loyalty to the Parisian crown."
 senonian_march_stability:0 "Senonian March Stability"
 desc_senonian_march_stability:0 "The elevation of Agedincum has earned the deep gratitude and loyalty of our southern provincial administrators."

 parisii_lutetia_task_melun_city:0 "Twin Isle of Melun"
 parisii_lutetia_task_melun_city_desc:0 "Mellodunum occupies a fortified island in the Sekuana upstream from our capital, blessed with rich woad plantations. By developing it into an industrial city equipped with dye-mills and tax offices, we create an unmatched manufacturing hub for vibrant Gallic textiles."
 me_parisii.35.t:0 "The Island City of Melun"
 me_parisii.35.desc:0 "Mellodunum's island position mirrors Lutotetion downstream. Its woad-vats steam day and night, turning out brilliantly dyed blue fabrics shipped across Gaul. By granting it full municipal status, we cement its place as the commercial and industrial workshop of the upper river."
 me_parisii.35.a:0 "The blue vats of Melun shall clothe the world!"
 me_parisii.35.b:0 "Subsidize the island city charter."
 me_parisii.35.c:0 "Let the workshops continue without a formal city charter."
 mellodunum_dyeing_capital:0 "Dyeing Capital of the Sekuana"
 desc_mellodunum_dyeing_capital:0 "Dense urban workshops, skilled dyers, and bustling tax halls make Mellodunum a powerhouse of textile manufacturing."

 parisii_lutetia_task_catalaunum_city:0 "Chariot Haven of Durocatalaunum"
 parisii_lutetia_task_catalaunum_city_desc:0 "Durocatalaunum guards the strategic crossings of the Marne, where fertile plains meet the northern Belgic frontier. Elevating this river haven into a thriving city with forums and bustling commerce creates an eastern bulwark and a training center for deadly chariot squadrons."
 me_parisii.36.t:0 "Chariot Haven of Durocatalaunum"
 me_parisii.36.desc:0 "At the crossroads of the Marne, the horse-masters of Durocatalaunum have assembled their war-wagons and opened their public squares. By establishing formal city status, we secure a prosperous trade nexus and an unyielding bastion against northern incursions."
 me_parisii.36.a:0 "The war-chariots of the Marne stand ready!"
 me_parisii.36.b:0 "Subsidize the city charter of Durocatalaunum."
 me_parisii.36.c:0 "Let it remain an outpost for now."
 durocatalaunum_marne_depot:0 "Marne Chariot & Reinforcement Depot"
 desc_durocatalaunum_marne_depot:0 "A formidable military staging depot on the Marne, famed for heavily shielded chariot squadrons and rapid field reinforcement."

 # Tooltips & Triggers
 melun_city_buildings_tt:0 "Melun possesses at least 3 combined Mills and/or Tax Offices."
 rural_development_threshold_tt:0 "Has completed at least 3 Rural Basin developments."
 satellite_oppidum_charter_req_tt:0 "Has chartered at least one satellite oppidum (Melun, Agedincum, or Durocatalaunum)."

 # Dortenco Limestone Quarry
 parisii_lutetia_task_quarry:0 "Quarries of Dortenco"
 parisii_lutetia_task_quarry_desc:0 "Along the bluffs of Dortenco at the confluence of the Marne and Sekuana, ancient beds of dense, creamy limestone lie waiting. By digging deep quarry pits and hoisting stone onto river barges, we provide our masons with the finest building blocks in all of Gaul."
 dortenco_limestone_quarries:0 "Lutetian Limestone Quarries"
 desc_dortenco_limestone_quarries:0 "Extensive open-pit quarries along the river bluffs yield abundant limestone, lowering the cost of chartering and founding new cities across our realm."

 # Massalia Viticulture & Burgundy Vineyards
 parisii_lutetia_task_massalia_wine:0 "Envoys to Massalia"
 parisii_lutetia_task_massalia_wine_desc:0 "With the Seine headwaters secure and direct routes down the Saône opened, we may dispatch trade emissaries to the Phocaean Greeks of Massalia. Offering captive northern thralls in exchange for Mediterranean vine cuttings and viticulture masters allows us to establish the first true vineyards of the Seine basin."
 me_parisii.37.t:0 "Vines of Massalia"
 me_parisii.37.desc:0 "Following our mastery over the Seine headwaters at Alesia, Phocaean merchants from Greek Massalia have travelled up the Rhône and Saône to our border. They bring fine Attic pottery, bronze flagons, and rootstocks of Mediterranean grapevines. In exchange for captured northern slaves to work their coastal vineyards and silver bullion, they offer to teach our farmers the art of viticulture on the sunny south-facing slopes of the Côte."
 me_parisii.37.a:0 "Trade the captives and plant the vineyards of Burgundy!"
 me_parisii.37.a.tt:0 "Vidubia (§Y2435§!) will convert its trade good to §YWine§!. Paris gains a free province investment to establish a direct wine import route."
 me_parisii.37.b:0 "We have no need of Greek wine; we drink the traditional mead and ale of our ancestors."

 parisii_lutetia_task_burgundy_vines:0 "Vineyards of the Côte"
 parisii_lutetia_task_burgundy_vines_desc:0 "On the limestone terraces above the river valley, Mediterranean grapevines thrive under our careful cultivation. By organizing a dedicated slave estate to tend the terraces and press the harvest, the slopes of the Côte become renowned for producing rich double vintages."
 me_parisii.38.t:0 "The Harvest of the Côte"
 me_parisii.38.desc:0 "The terraced vines of Vidubia are heavy with dark clusters. Slaves tread the grapes in stone vats, filling sealed amphorae with rich, fragrant wine destined for the banquets of Lutotetion and the chieftains of the Celtic world."
 me_parisii.38.a:0 "A vintage worthy of kings!"
 cote_dor_vineyards:0 "Vineyards of the Côte-d'Or"
 desc_cote_dor_vineyards:0 "Sun-drenched limestone terraces, skilled viticulturalists, and organized slave estates make this valley the premier wine-growing territory in northern Gaul, yielding rich surplus vintages."

 # Senonian Cavalcade
 parisii_lutetia_task_agedincum_horses:0 "Senonian Cavalcade"
 parisii_lutetia_task_agedincum_horses_desc:0 "While Agedincum prospers as a cloth manufacturing city, the broad floodplains of Eburobriga upstream are ideally suited for breeding war-mounts. By importing blooded mares and establishing permanent cavalry pastures, we supply the warrior legions of Sens with champion chargers and swift chariot teams."
 me_parisii.39.t:0 "The Herds of Eburobriga"
 me_parisii.39.desc:0 "Where herds of cattle once grazed along the Yonne, hundreds of powerful warhorses now run free in fenced meadows. The horse-masters of Senonia have established an expansive stud, supplying our noble chieftains with unbroken lines of chargers and war-chariot teams."
 me_parisii.39.a:0 "The thunder of Senonian hooves echoes across the river!"
 agedincum_cavalry_depot:0 "Senonian Cavalry Studs"
 desc_agedincum_cavalry_depot:0 "Expansive river pastures and imported bloodlines breed champion chargers and chariot teams for the southern march, reducing the cost of hiring mercenary retinues."

 # Upper Yonne Ironworks / Swords of Brennus
 parisii_lutetia_task_yonne_iron:0 "Swords of Brennus"
 parisii_lutetia_task_yonne_iron_desc:0 "Along the upper reaches of the Yonne at Vicus Massava lie rich mineral veins. Deepening these mines and erecting blast furnaces allows our smiths to forge the formidable, razor-sharp iron slashing swords that once struck terror into the hearts of the Mediterranean world."
 me_parisii.40.t:0 "The Forges of the Upper Yonne"
 me_parisii.40.desc:0 "Massive bloomery furnaces roar along the river bluffs, smelting ore into pure iron ingots. In the workshops below, Senonian master smiths temper long broadswords capable of severing a foe's shield in a single stroke, rekindling the terrifying martial prowess of Brennus's conquerors."
 me_parisii.40.a:0 "Woe to the vanquished!"
 sennonian_swordsmiths:0 "Senonian Swordsmiths"
 desc_sennonian_swordsmiths:0 "Famed for forging the heavy, double-edged iron broadswords of the Senones, our warriors strike with devastating force while drawing seasoned mercenaries from across the Celtic world."

 # New Events 41, 42, 43
 me_parisii.41.t:0 "The Island Citadel of Lutotetion"
 me_parisii.41.desc:0 "Deep within the river bows of the Sekuana, the fortified oppidum of Lutotetion rises anew. Its heightened palisades, granaries, and stone bastions turn the island into an impregnable citadel controlling the crossings of the river."
 me_parisii.41.a:0 "The island citadel commands the river!"
 me_parisii.42.t:0 "Civic Heartland of Lutotetion"
 me_parisii.42.desc:0 "With civil halls erected and town assemblies meeting regularly beneath the sacred oaks and tiled halls of Lutotetion, our capital has transformed into the undisputed civic heartland of the Seine basin."
 me_parisii.42.a:0 "The heart of the Seine beats strong."
 me_parisii.43.t:0 "The Quarries of Dortenco"
 me_parisii.43.desc:0 "The banks of the Sekuana yield fine, durable limestone at Dortenco. Our stonecutters and quarrymen extract prized masonry blocks that will fortify our strongholds and pave our roads for generations to come."
 me_parisii.43.a:0 "Quarry the stone of the Seine!"

 me_parisii.44.t:0 "Sennonian Hegemony"
 me_parisii.44.desc:0 "The branches of the Sennones along the Seine and the Marne are now firmly aligned under our guidance. With Senonia and Catalaunia secured, our envoys report that the river clans of the Lower Seine recognize our rightful authority. We can now assert our ancient claims over the Veliocassi to our west, opening the final path to the sea."
 me_parisii.44.a:0 "The river clans answer to Lutetia."

 me_parisii.45.t:0 "The Northern Marches Secured"
 me_parisii.45.desc:0 "Our envoys and war-bands have concluded their work along the northern frontier. The Belgic border tribes of the Somme and Oise have either accepted our suzerainty or been brought to heel, safeguarding the northern approaches to the Sekuana."
 me_parisii.45.a:0 "The northern borderlands stand firm."

 # Tooltip Previews & Bypasses
 subdue_old_guard_completion_tt:0 "The traditionalist nobility and old guard have been definitively subdued or reconciled."
 subdue_old_guard_bypass_tt:0 "The Sennonian traditionalists and old guard chiefs have already been dealt with."
 me_parisii.12.preview.tt:0 "Choose whether to mint prestigious gold staters into a centralized monetary economy or codify traditional river barter networks."
 me_parisii.13.preview.tt:0 "Unite the Seine valley under the Seine Confederation, reforming into a Tribal Federation and gaining extensive civil and military prestige."
 me_parisii.14.preview.tt:0 "Convene the Nautae Assembly to reform your tribal confederation into an advanced civilised government."
 me_parisii.25.preview.tt:0 "Consecrate the monumental Pillar of the Nautae on the Île de la Cité, dedicating a holy site and receiving a permanent blessing based on your pantheon."
 me_parisii.30.preview.tt:0 "Choose whether to invest in river towpaths (enhancing trade and transport) or naval rigging (bolstering river craft and fleet readiness)."
 melun_city_founding_preview_tt:0 "Charter the industrial dyeing oppidum of Mellodunum, establishing workshops and urban infrastructure."
 agedincum_city_founding_preview_tt:0 "Charter the martial border oppidum of Agedincum, establishing military forums and regional stability."
 catalaunum_city_founding_preview_tt:0 "Charter the chariot and commercial haven of Durocatalaunum along the Marne."
 me_parisii_belgae_bypass_tt:0 "All northern Belgic border tribes (Suessiones, Veliocasses, Remi, Bellovaci) are already subjects or no longer exist."


