l_english:
 
 #startup stuff - heritage and deity
 parisii_heritage:0 "Heritage of the Parisii"
 parisii_heritage_desc:0 "Nestled along the vital waterways of the Sekuana, the Parisii have long conducted up and down the river, though their focus on commerce has left them less prepared for taking the field against their neighbors."

 omen_sekuana:0 "Sekuana"
 omen_sekuana_desc:0 "Sekuana is the healing mother-goddess of the eponymous river, particularly associated with the sacred healing springs at her headwaters near Alesia. Offerings are made at these springs in hope of healing. She is the source of health, cleansing, and prosperous river trade for the Gallic tribes.\n\n After the Roman conquest of Gaul, her worship was integrated and temple complex at the springs flourished until Theodosius I seized them for benefit of the Christians."

 deity_sekuana:0 "Sekuana"

 # === PHASE 1: MISSION TASKS & TOOLTIPS ===
 parisii_lutetia_mission_header:0 "The Sekuana Mandate"
 parisii_lutetia_mission:0 "The Sekuana Mandate"
 parisii_lutetia_mission_desc:0 "The lands of the Parisii along the banks of the Sekuana are ripe with opportunity. By bringing the river trade under central authority, unifying the surrounding tribes, and building up the confluences at Lutotetion as a grand metropolitan heartland, we shall forge a dominant river confederation to stand as a beacon of Keltic civilization."
 parisii_lutetia_mission_button:0 "Select Mission"
 parisii_lutetia_mission_BUTTON_TOOLTIP:0 "Achieve on the Sekuana Mandate."
 parisii_lutetia_mission_BUTTON_DETAILS:0 ""
 parisii_lutetia_mission_DESCRIPTION:0 "The lands of the Parisii along the banks of the Sekuana are ripe with opportunity. By bringing the river trade under central authority, unifying the surrounding tribes, and building up the confluences at Lutotetion as a grand metropolitan heartland, we shall forge a dominant river confederation to stand as a beacon of Keltic civilization."
 parisii_lutetia_mission_CRITERIA_DESCRIPTION:0 "This mission will be complete when the Parisii have secured the waterways, subdued the traditionalists, and declared the Sekuana Confederation."

 parisii_lutetia_task_1:0 "The River Guilds"
 parisii_lutetia_task_1_DESC:0 "The powerful Nautae Parisi - the boatmen of the Sekuana - control the flow of trade through our lands. We must bring these independent ferrymen under state influence to secure our economic future."
 mastery_of_the_sekuana_tt:0 "Our coffers will be drained, but the rivermen will fall in line."

 parisii_lutetia_task_2:0 "Sennonian Unification"
 parisii_lutetia_task_2_DESC:0 "We are but one of the Sennonian tribes. It is only natural that we absorb the power of our cousins and together dominate all the lands that the Sekuana drains. We shall dispatch an ultimatum to our wayward neighbors. They will either submit to our hegemony, or we will unite our people by sword and spear."

 parisii_lutetia_task_3:0 "Develop Lutotetion"
 parisii_lutetia_task_3_DESC:0 "Our capital must become the undisputed heart of Keltia. By expanding our ports, markets, and administrative buildings, we will draw the wealth of the river directly into our coffers."

 parisii_lutetia_task_4:0 "Coinage and Commerce"
 parisii_lutetia_task_4_DESC:0 "Our centralization efforts require a unified economic policy. We must decide how wealth is measured and traded across the Confederation."

 parisii_lutetia_task_5:0 "Subdue the Old Guard"
 parisii_lutetia_task_5_DESC:0 "The traditionalists despise our growing centralization. The time for appeasement has passed. We must crush the rural warlords once and for all."
 subdue_old_guard_tt:0 "The Old Guard rebellion has been completely crushed, and their lands are secured."

 parisii_lutetia_task_6:0 "Secure the Watersheds"
 parisii_lutetia_task_6_DESC:0 "The Sekuana is more than a river; it is a sprawling basin of interconnected tributaries. We must ensure that the major crossings of this watershed fall under our direct control or the control of our loyal subjects."

 parisii_lutetia_task_7:0 "The Springs of Sekuana"
 parisii_lutetia_task_7_DESC:0 "At the sacred springs just north of Alesia, the healing goddess Sekuana holds sway. We must construct her grand temple and bind the Druids directly to our royal administration."
 sekuana_pantheon_req_tt:0 "The river goddess Sekuana is part of our active Pantheon."

 parisii_lutetia_task_8:0 "The Belgae Ultimatum"
 parisii_lutetia_task_8_DESC:0 "The Belkai to our north pose a constant threat. We must secure this flank. We shall issue an ultimatum to the tribes there: submit as our subjects willingly and be welcome as equal partners, or face our wrath."

 parisii_lutetia_task_9:0 "The Sekuana Confederation"
 parisii_lutetia_task_9_DESC:0 "Our borders are secure, our rivals are subdued, and the river flows with gold. The time has come to declare a unified Confederation."

 parisii_lutetia_task_10:0 "The Nautae Assembly"
 parisii_lutetia_task_10_DESC:0 "Our tribal assemblies are unable to properly govern our larger and more populous territory. We must adapt a more centralized form of government. We must convene the Nautae senate and enact state reforms."

 parisii_lutetia_task_11:0 "The Agedincon Bulwark"
 parisii_lutetia_task_11_DESC:0 "Agedincon stands as our shield against the southern tribes. We must heavily fortify this crossing to lock down the Icauna river valley."

 parisii_lutetia_task_12:0 "The Caracotinon Watch"
 parisii_lutetia_task_12_DESC:0 "Caracotinon guards the mouth where the Sekuana meets the great northern sea. A fortress here will monitor cross-channel raiders and secure shipping."

 parisii_lutetia_task_13:0 "The Eastern Approach"
 parisii_lutetia_task_13_DESC:0 "The eastern plains are vast and vulnerable. A sprawling military infrastructure in Condate will protect our heartland from Belkai incursions."

 # === PHASE 1: EVENT TEXT & CHOICES ===
 me_parisii.1.t:0 "The Sekuana Guilds Submit"
 me_parisii.1.desc:0 "The guilds of the Sekuana have agreed to recognize our authority over the river crossings."
 me_parisii.1.a:0 "Grant them guaranteed privileges and we shall become their trade hub."
 me_parisii.1.b:0 "Exert direct control of the tolls."

 me_parisii.2.t:0 "Our Envoys Depart"
 me_parisii.2.desc:0 "Our diplomats have ridden out to our Sennonian neighbors with our demands of fealty."
 me_parisii.2.a:0 "We await their answer."
 me_parisii.2.a.tt:0 "We will favor a diplomatic approach."
 me_parisii.2.b:0 "They will kneel or bleed."
 me_parisii.2.b.tt:0 "We will favor a hostile approach."

 me_parisii.3.t:0 "Sovereignty over the Sekuana"
 me_parisii.3.desc:0 "Our envoys have reached the council of the Sennonian basin. They demand we declare our final intentions: peaceful integration or military subjugation."
 me_parisii.3.a:0 "Offer them equal partnership in Lutotetion."
 me_parisii.3.b:0 "Demand absolute submission. To arms!"

 me_parisii.4.t:0 "The Parisii Demand Fealty"
 me_parisii.4.desc:0 "The newly emergent power on the Sekuana demands our submission. If we refuse, they will take our lands by the sword."
 me_parisii.4.a:0 "We have no choice but to bend the knee."
 me_parisii.4.b:0 "We will fight!"

 me_parisii.5.t:0 "Ultimatum Delivered"
 me_parisii.5.desc:0 "Lutotetion's armies stand at our borders. Their standard-bearers have delivered a harsh demand: submit or face immediate eradication."
 me_parisii.5.a:0 "We will never surrender our ancestral hills!"

 me_parisii.6.t:0 "Sennonian Submission"
 me_parisii.6_snn.desc:0 "Our neighbors, the [GetCountry('SNN').GetName], have recognized our hegemony. Their envoys have arrived to pledge their warriors and wealth to our cause."
 me_parisii.6_ctl.desc:0 "Our neighbors, the [GetCountry('CTL').GetName], have recognized our hegemony. Their envoys have arrived to pledge their warriors and wealth to our cause." 
 me_parisii.6.a:0 "A bloodless victory."

 me_parisii.7.t:0 "Sennonian Defiance"
 me_parisii.7_snn.desc:0 "Our envoys have returned from [GetCountry('SNN').GetName]. The chiefs laughed at our demands, asserting that they bow to no upstart river merchants. They are already raising shields; war is upon us."
 me_parisii.7_ctl.desc:0 "Our envoys have returned from [GetCountry('CTL').GetName]. The chiefs laughed at our demands, asserting that they bow to no upstart river merchants. They are already raising shields; war is upon us."
 me_parisii.7.a:0 "They will bend or bleed!"

 me_parisii.8.t:0 "Develop Lutotetion"
 me_parisii.8.desc:0 "The security of Lutotetion's river crossing has spurred a massive boom in urban development. Merchants, craftsmen, and nobles are flocking to our capital."
 me_parisii.8.a:0 "Subsidize a new market."
 me_parisii.8.b:0 "Fund a tax office."
 me_parisii.8.c:0 "Expand the port facilities."

 me_parisii.9.t:0 "The Old Guard Ultimatum"
 me_parisii.9.desc_clan_chief:0 "As our centralization efforts press forward, the traditionalists have found a powerful champion. A disgruntled clan chief of our own tribes, [traditionalist_spokesperson.GetName], has gathered rural warriors to deliver a stark ultimatum: halt Lutotetion's mercantile consolidation, or face an immediate secession war of the rural valleys."
 me_parisii.9.desc_minor_noble:0 "The rapid expansion of Lutotetion's river tolls has left many minor nobles out of the coin networks. An ambitious noble, [traditionalist_spokesperson.GetName], has successfully united the disgruntled elites under the banner of the old ways. They demand we pay off their ancestral claims on the riverbanks or face a civil war."
 me_parisii.9.desc_hometown_hero:0 "With our clan chiefs silent, a backwater hometown hero, [traditionalist_spokesperson.GetName], has risen from the depths of the Sennonian forests to claim power. Backed by zealous druids and angry peasants, they have issued a wild threat to tear down Lutotetion's palisades unless we restore the old, decentralized barter statutes."
 me_parisii.9.a:0 "Attempt to buy their loyalty."
 me_parisii.9.b:0 "Refuse to pay tribute. Prepare for war!"

 me_parisii.10.t:0 "The Final Price"
 me_parisii.10.desc:0 "The greedy warlords demand even more coin. If we pay this exorbitant sum, they may finally stand down. If we refuse, blood will flow."
 me_parisii.10.a:0 "Pay the final bribe."
 me_parisii.10.b:0 "The price is too high. War!"
 me_parisii.10_success.t:0 "Traditionalist Pacification"
 me_parisii.10_success.desc:0 "The final bribe has done its work. [traditionalist_spokesperson.GetName] has accepted our gold and ancestral land rights, dispersing the peasant levies back to their rural valleys. The old guard is satisfied, for now."
 me_parisii.10_success.a:0 "A costly peace, but our consolidation continues."
 appease_old_guard_success_tt:0 "The Old Guard rebellion has been peacefully averted."

 me_parisii.11.t:0 "The Old Guard Revolts!"
 me_parisii.11.desc:0 "Traditionalist chiefs from the rural hinterlands have raised their banners in open rebellion. They refuse to bow to our centralized authority and seek to shatter our new state."
 me_parisii.11.a:0 "To arms! Crush the traitors!"

 me_parisii.12.t:0 "The Sekuana Economy"
 me_parisii.12.desc:0 "Our centralization efforts have reached a tipping point. We must formally codify how wealth is handled across the Sekuana."
 me_parisii.12.a:0 "Mint the Gold Staters."
 me_parisii.12.a.tt:0 "We will adopt the #Y Coin Minting Initiative#! law. If we already have it, we gain wealth."
 me_parisii.12.b:0 "Standardize the Barter Networks."
 me_parisii.12.b.tt:0 "We will adopt the #Y Barter Economy Statutes#! law. If we already have it, we gain political capital."

 me_parisii.13.t:0 "The Sekuana Confederation"
 me_parisii.13.desc:0 "Through diplomacy, coin, and the sword, the Parisii have brought the disparate tribes and river guilds of the Sekuana into a unified whole. Today, we formalize our dominance."
 me_parisii.13.a:0 "Hail the Confederation!"

 me_parisii.14.t:0 "The Nautae Assembly"
 me_parisii.14.desc:0 "Our tribal confederacy has outgrown the council of chiefs. The elites have gathered in Lutotetion to draft a permanent constitution for the state."
 me_parisii.14.a:0 "Proclaim a Plutocratic Merchant Republic."
 me_parisii.14.b:0 "Codify an Oligarchic Noble Senate."
 me_parisii.14.c:0 "Enact an Aristocratic Constitutional Monarchy."
 me_parisii.14.d:0 "Consolidate absolute power under the High King."

 me_parisii.15.t:0 "The Springs of Sekuana"
 me_parisii.15.desc:0 "At the sacred headwaters of Alesia, our priests have unearthed ancient offerings. The powerful presence of our goddess Sekuana herself can be felt in the waters here."
 me_parisii.15.a:0 "Build her Healer's Sanctuary."
 me_parisii.15.a.tt:0 "Dedicates her spring to growth and healing, constructing her temple sanctuary."

 me_parisii.16.t:0 "The Belgae Ultimatum"
 me_parisii.16.desc:0 "The northern tribes have proven to be a thorn in our side. We have dispatched envoys to the region north of the Sekuana demanding their submission."
 me_parisii.16.a:0 "We shall send our demands across the river."
 me_parisii.16.a.tt:0 "We demand the subjugation of the Belgic tribes along the river and our borders."
 
 me_parisii.17.t:0 "The Sekuana Ultimatum"
 me_parisii.17.desc:0 "An envoy from the newly empowered Parisii has arrived at our tribal capital. They demand we lay down our arms and formally submit to their river confederation as feudatories. If we refuse, war is certain."
 me_parisii.17.a:0 "We must submit."
 me_parisii.17.b:0 "We bow to no one!"
 me_parisii.17_accept.t:0 "Belgic Submission"
 me_parisii.17_accept.a:0 "They have made the wise choice."
 me_parisii.17_refuse.t:0 "Belgic Defiance"
 me_parisii.17_refuse.a:0 "And war it shall be."

 # BELGIC ULTIMATUMS (Task 8 Split Tag Notifications)
 # SSS (Suessiones)
 me_parisii.17_accept_sss.desc:0 "Envoys from [GetCountry('SSS').GetName] have returned. Intimidated by our rising hegemony, their chiefs have bent the knee and pledged their spears as feudatories."
 me_parisii.17_refuse_sss.desc:0 "The chiefs of [GetCountry('SSS').GetName] have spat upon our demands. They assert that they shall not bow to some upstart river merchants and have begun to prepare for war."

 # VCL (Veliocassia)
 me_parisii.17_accept_vcl.desc:0 "Envoys from [GetCountry('VCL').GetName] have returned. Intimidated by our rising hegemony, their chiefs have bent the knee and pledged their spears as feudatories."
