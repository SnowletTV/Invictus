01_shan:0 "01 Shan"
01_shan_DESCRIPTION:0 "Mission description"
01_shan_CRITERIA_DESCRIPTION:0 "This mission will be completed when"
01_shan_BUTTON_TOOLTIP:0 ""

#Missions

01_shan_task_1: "Securing Shan"
01_shan_task_1_DESC: "The hills surrounding [GetProvince('(int32)8808').GetName|Y] separate us from our neighbors, but the time has come to attack the hostile #E Pyu#! tribes in the floodplains to the west. [ROOT.GetCountry.GetRuler.GetName|Y] desires their floodplains for [ROOT.GetCountry.GetName|T] and has ordered our soldiers to prepare for war in the days to come. \n\n\n\n\n\n\n\n\n\n@india_mil19!"

01_shan_task_2: "Iron Of #E Myitnge#!"
01_shan_task_2_DESC: "There is iron @iron! to be found in the hills of [GetProvince('(int32)8806').GetName|Y], and the tribesmen of [ROOT.GetCountry.GetName|T] have need for it all. Once we have our mining operations up and running, we will outfit our levies with better weapons.\n\n\n\n\n\n\n\n\n\n@india_mil8!"

01_shan_task_3: "Feeding The Army"
01_shan_task_3_DESC: "An aphorism repeated by [ROOT.GetCountry.GetAdjective] sages is always near the forefront of [ROOT.GetCountry.GetRuler.GetName|Y]'s mind; 'A fool cannot hear two sounds; the blast of the trumpet or the grumbling of the soldier's stomach'. With this ancient wisdom guiding [ROOT.GetCountry.GetName|Y], the time has come to plant and harvest, for our growing armies have need of supplies.\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

01_shan_task_4: "Stabbing Westward"
01_shan_task_4_DESC: "The gods of victory ride alongside [ROOT.GetCountry.GetRuler.GetName|Y], urging the [ROOT.GetCountry.GetAdjective|Y] [ROOT.GetCountry.GetRulerTitle|T] to conquer our foes in the west. The time has come to raise our levies and drive out the #Y Pyu#! tribes in the #G Irrawaddy Valley#! once and for all!\n\n\n\n\n\n\n\n\n\n@india_mil23!"

01_shan_task_5: "Pu Leatherworks"
01_shan_task_5_DESC: "[ROOT.GetCountry.GetCapital.GetName|Y] is quickly becoming known for the fine quality of the leather @leather! produced in its workshops.\n\n\n\n\n\n\n\n\n\n@india_mil6!"

01_shan_task_6: "Invading The Jungles"
01_shan_task_6_DESC: "With the #G Irrawaddy Valley#! firmly within our hands, the time has come to turn our attention outwards. The jungles to the north and the south shall be no impediment to our men, who have brought countless victories home to [ROOT.GetCountry.GetCapital.GetName|Y]. The time has come to launch our invasions!\n\n\n\n\n\n\n\n\n\n@india_mil12!"

01_shan_task_7: "The Northern Migration"
01_shan_task_7_DESC: "The lands to our north are valuable, but relatively isolated and uninhabited - but the time has come for this to change. [ROOT.GetCountry.GetRuler.GetName|Y] has sent word throughout [ROOT.GetCountry.GetName|Y] that our people have need of colonists willing to uproot their lives in search of something better, and luckily for [ROOT.GetCountry.GetRuler.GetHerHim], many has answered the call.\n\n\n\n\n\n\n\n\n\n@india_mil14!"

01_shan_task_8: "Jade Mines Of #E Myitkyina#! "
01_shan_task_8_DESC: "The rare trade good jade @jade! can be found in the province of [GetProvince('(int32)8813').GetName|Y], and [ROOT.GetCountry.GetRuler.GetName|Y] has demanded that we invest our resources into the region - we need to build a mine there immediately.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

01_shan_task_9: "Kuji'i Nat"
01_shan_task_9_DESC: "In the fetid waters of the [GetProvince('(int32)8770').GetName|G] marshlands, the deadly Upas tree serves as a stark reminder of the power of [GetDeityDefinition('omen_kujii').GetName|T], the #G Nat of War#! that protects those that seek his blessing. By making a proper home for the Nat within [ROOT.GetCountry.GetCapital.GetName|Y], [ROOT.GetCountry.GetRuler.GetName|Y] hopes that we can secure divine favor for our people.\n\n\n\n\n\n\n\n\n\n@greek_mil3!"

01_shan_task_10: "Nikam Nat"
01_shan_task_10_DESC: "[ROOT.GetCountry.GetRuler.GetName|Y] has [ROOT.GetCountry.GetRuler.GetHerHis] eye on establishing a permanent legacy within [ROOT.GetCountry.GetName|Y], and building a magnificent temple for [GetDeityDefinition('omen_kujii').GetName|T] in [ROOT.GetCountry.GetCapital.GetName|Y] has been suggested as a way to ensure [ROOT.GetCountry.GetRuler.GetHerHis] name remains unforgotten by our descendants.\n\n#R Converting to another faith will disable this task.#!\n\n\n\n\n\n\n\n\n\n@persia_mil7!"

01_shan_task_11: "Unstoppable Advance"
01_shan_task_11_DESC: "The undefeated armies of [ROOT.GetCountry.GetRuler.GetName|Y] have seized enough territory within the jungles of [GetProvince('(int32)7352').GetArea.GetName|Y] and [GetProvince('(int32)8768').GetArea.GetName|Y] that marching into [GetProvince('(int32)7401').GetArea.GetName|Y] seems a foregone conclusion at this point.\n\nA large force of #R War Elephants#! have been raised within [ROOT.GetCountry.GetCapital.GetName|Y] - the personal army of our majestic leader. While these beasts might be expensive to maintain, they will be an effective fighting force against our enemies.\n\n\n\n\n\n\n\n\n\n@india_mil16!"

01_shan_task_12: "Seizing Samatata"
01_shan_task_12_DESC: "Not only is [ROOT.GetCountry.GetRuler.GetName|Y] the undisputed authority of all [ROOT.GetCountry.GetName|Y], but the commands of our [ROOT.GetCountry.GetRulerTitle|T] are even obeyed in the cities of [GetProvince('(int32)7401').GetArea.GetName|Y].\n\n\n\n\n\n\n\n\n\n@india_mil22!"


#Tooltips
you_need_to_form_pong_tt: "We need to take the decision to #T Form Pong#!."
shan_leather_tt: "#Y We must have a surplus of at least#! #T 2 Leather @leather!#! #Y in our capital#!."
claims_pracya_tibet_tt: "We will receive claims on the regions of #Y Tibet#! and #Y Pracya#!."

