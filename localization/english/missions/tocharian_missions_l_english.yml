 # event descriptions
 TOC_Toad_Conquest_Choice.desc:0 "The people of the Pamir have survived for generations in a land that would challenge even the most seasoned traveler. The mountains that divide our realm are their home, and their knowledge of these harsh lands is something we cannot afford to overlook.\n\nThe so-called Mountain Toads have mastered a way of life suited to the highlands. Their knowledge may prove invaluable as we seek to make these formidable mountains part of our realm."
 TOC_Tayuan_Choice.desc:0 "The territory of Tayuan commands a vital passage through the mountains to our south-west. Leaving it in the hands of another power would leave our newly unified realm exposed and place a serious obstacle in the path of further expansion.\n\nYet the lands themselves are of limited importance to their current masters. A reasonable offer may persuade them to surrender what is of little value to them. If diplomacy fails, however, we may have little choice but to secure the pass ourselves."
 TOC_Tayuan_Buy.desc:0 "The Tocharians have offered us a substantial sum in exchange for the territory of Tayuan. The land is remote and of limited importance to us, but surrendering it would strengthen our neighbors and place a valuable mountain passage in their hands.\n\nWe must decide whether the price is worth the loss."

 TOC_Tayuan_Buy_Refusal.desc:0 "Our offer for Tayuan has been refused. The territory remains beyond our control, and the mountain pass remains a vulnerability to our realm.\n\nWe have made a reasonable attempt to acquire it peacefully. Now we must decide whether the matter is worth pursuing by force, or whether we should accept that it will remain outside our borders."

 TOC_Invasion.desc:0 "The Tocharians have seized Tayuan without declaring war. We now face a choice: accept the loss and avoid a costly conflict, or demand that they return what they have taken and prepare for war."

 TOC_Bactria_Choice.desc:0 "The Bactrian lands to our south-west hold a vital mountain passage. Without control of this route, our frontier remains exposed and our path beyond the Tarim Basin is constrained.\n\nBactria has little reason to value these distant lands as highly as we do. We may be able to persuade their rulers to surrender them for a suitable price, avoiding a confrontation with a power whose strength we cannot afford to underestimate. Should they refuse, we may have to take what we need and trust that the consequences will be limited."

 TOC_Bactria_Buy.desc:0 "The Tocharians have offered us payment in exchange for our lands to the east.\n\nThe offer deserves consideration."

 TOC_Bactria_Buy_Refusal.desc:0 "Bactria has rejected our offer. The mountain passage remains beyond our control, and with it a valuable route for further expansion.\n\nWe have exhausted the peaceful route. We can abandon the claim, or seize the territory and see whether Bactria is willing to fight over such a distant possession."

 TOC_Bactria_Invasion.desc:0 "The Tocharians have seized our territory without declaring war. We must decide how far we are prepared to go to recover it. We can accept the loss and avoid a costly conflict or challenge the Tocharians ourselves."

 TOC_Bactria_Overlord_Response.desc:0 "Our subject has appealed to us for protection after the Tocharians seized their territory. The dispute concerns a distant frontier, but allowing such an affront to pass unchallenged may encourage further aggression.\n\nWe must decide whether this matter is worth taking up."

 TOC_Tibet_Conquest_Choice.desc:0 "The lands of Tibet have now come under our control. Though rugged and difficult to traverse, they are not without opportunity. Their mountains hold valuable mineral wealth, while their position along the routes connecting our realm to the lands beyond offers opportunities for trade.\n\nWe must decide how best to make use of these newly acquired territories and turn their resources and position to the benefit of Tocharia."

 TOC_Tribe_Choice.desc:0 "The unification of Tocharia has brought together peoples who for generations lived under very different institutions. Some followed the old ways of the tribes, bound together by kinship and custom; others dwelt in the great cities of the Tarim Basin, where settled government, administration, and commerce had long flourished.\n\nNow these traditions have been brought beneath a single banner. The cities we have conquered stand as living examples of what a settled and ordered realm can become, and their influence has begun to reshape the very people who conquered them. If Tocharia is to endure as a great realm, we must give our new state institutions worthy of its cities and its growing population.\n\nThe old tribal order has served us well, but the realm we have created demands something greater. The time has come to decide what form that greater Tocharia will take."

 TOC_Saka_Choice.desc:0 "Since time immemorial, the Tocharians and the Saka have shared the Tarim Basin. Our cities and their camps have existed alongside one another, trading, raiding, settling disputes, and adapting to the presence of the other. The Saka are no strangers to these lands, even if their way of life differs greatly from that of our settled people.\n\nThe unification of the basin has changed this balance. The Saka now find themselves within a single Tocharian realm, and their place within it can no longer be left to custom or circumstance. If our new state is to endure, we must establish a coherent and comprehensive policy toward the nomads in our midst.\n\nThe decision we make will shape the character of Tocharia for generations to come."

 TOC_Language_Event.desc:0 "For generations, the peoples of the north and south have spoken different forms of the Tocharian tongue. The differences that grew from our long division were once a natural reflection of separate communities, but they have become increasingly out of place in a realm that now stretches across the entire basin.\n\nOur scholars and administrators have begun the work of establishing a common standard. By bringing the different tongues of our people together, we can ensure that the same words are understood from the courts of our cities to the furthest reaches of our realm. A common language will strengthen our unity and make the work of governing Tocharia easier."

 #  startup
 TOC_Startup.t:0 "Treasures of Tocharia"
 TOC_Startup.desc:0 "For generations, the peoples of Tocharia have prospered at the crossroads of the great civilizations. Our cities command the routes through the deserts, carrying goods and ideas between east and west, while the wealth of the Tarim Basin sustains those who can master its treacherous corridors.\n\nBut the world around us is changing. Alexander is dead, the Xiongnu rise in the northeast, and the lands of China are divided by war. The old balance that allowed our cities to prosper can no longer be taken for granted.\n\nWe must secure our future before others secure it for us. Unite the cities of the Tarim Basin, strengthen the routes that bind them together, and turn the wealth of the Silk Road toward the defense of our people. If we can command the crossroads, we can make Tocharia a power that cannot be ignored."
 TOC_Startup.a:0 "Time to make history"
 
 # new mission events
 TOC_Oasis_Cities_Event.t:0 "Oasis Cities"
 TOC_Oasis_Cities_Event.desc:0 "Our ruler walks through one of the new cities rising from the desert, where only an empty oasis stood before. The walls and foundations of new buildings are already taking shape, while workers expand the irrigation channels that will bring water to fields and gardens beyond the city.\n\nMerchants have begun to set up their stalls along the new streets, and craftsmen are already preparing their workshops. Families are settling here alongside them, turning what was once little more than a stopping place for travelers into a permanent Tocharian community.\n\nThese new cities will bring wealth to our realm, but their importance is greater than that. With every oasis brought under cultivation and every new settlement established, our people spread further across the basin, giving substance to the united Tocharia we have begun to build."
 TOC_Oasis_Cities_Event.a:0 "Let the oases flourish."
 
 TOC_Tocharia_Together_Event.t:0 "Tocharia Together"
 TOC_Tocharia_Together_Event.desc:0 "In the capital, the celebrations have begun. Banners fly, feasts are held, and people have gathered in the streets to celebrate the end of the divisions that kept Tocharia apart for so long. For the first time, the rulers of the basin's cities and tribes answer to a single authority.\n\nYet beyond the celebrations lies a quieter consequence of our achievement. For generations, many of the basin's oases have remained little more than stopping places for travelers. Though their waters could sustain thriving settlements, the uncertainty and violence of a divided land made it too dangerous to build there on any great scale.\n\nThat danger has now passed. There are places throughout our newly united realm where cities could rise, drawing farmers, merchants, and craftsmen to lands that have long stood largely empty. The security of a united Tocharia gives us the freedom to build where before we could only survive.\n\nBut a united realm is not yet a united people. The peoples of the basin have spent generations divided between cities, tribes, and local traditions. We have brought their lands under one government; now we must find what can bind their people together as Tocharian."
 TOC_Tocharia_Together_Event.a:0 "Let us build for a united Tocharia."
 
 TOC_Beyond_the_Basin_Event.t:0 "Beyond the Basin"
 TOC_Beyond_the_Basin_Event.desc:0 "Our envoys have begun to appear in the courts of distant Hellenistic kingdoms, carrying gifts, letters, and proposals from the ruler of Tocharia. They are no longer curiosities from some remote land beyond the deserts, but representatives of a realm whose influence is increasingly felt along the great trade routes.\n\nOur merchants have followed them. In the markets of faraway cities, Tocharian traders now bargain alongside merchants from lands that, only a generation ago, seemed impossibly distant. Silk, precious stones, horses, and other goods from the lands beyond the Tarim are changing hands under the watch of foreign magistrates.\n\nThe world is beginning to take notice of Tocharia. Our roads have carried our merchants outward, and our envoys have carried our name with them."
 TOC_Beyond_the_Basin_Event.a:0 "Let them know Tocharia."
 
 TOC_Realm_Realized_Event.t:0 "Realm Realized"
 TOC_Realm_Realized_Event.desc:0 "The signs of Tocharia's prosperity are no longer measured only in the treasury or the markets. The roads are crowded with travelers, the fields around our cities are cultivated more extensively each year, and children fill streets that once stood quiet.\n\nIn the oases, new households are taking root. In the cities, old quarters are expanding and new ones rising beyond their walls. Families who once struggled to survive now have the means to raise children and build lives of their own.\n\nOur realm has become more than a union of peoples and cities. It has become a land where people can prosper, where cities can flourish, and where their children can inherit something greater than what their parents knew."
 TOC_Realm_Realized_Event.a:0 "Tocharia prospers."
 
 # task_1's on_completion event.
 TOC_Muster_Our_Might_Event.t:0 "Muster Our Might"
 TOC_Muster_Our_Might_Event.desc:0 "There is a feeling in the air that even the wisest among us cannot explain. Across the basin, people speak of the same unease: that the peace we have known is drawing to an end, and that the lands beyond our borders will soon be drowned in blood and battle.\n\nOur ruler has felt it too. Whatever is coming, we will not meet it unprepared. The men are summoned, the banners raised, and our people called to arms."
 TOC_Muster_Our_Might_Event.a:0 "Death before subjugation."
 
 # task_6's on_completion event.
 TOC_Connecting_the_Cities_Event.t:0 "Connecting the Cities"
 TOC_Connecting_the_Cities_Event.desc:0 "For generations, the oases of the basin have been separated by long stretches of desert. Merchants, travelers, and messengers have had to follow uncertain routes between them, while each city has remained largely dependent on the traffic that happens to reach its own gates.\n\nNow a great road is being built across the basin, linking the oases into a single network. The desert is being crossed, and the distance between our cities is shrinking. Merchants will be able to travel farther and more safely, while goods, news, and people will move with a speed unknown to those who came before us.\n\nThe cities of Tocharia are no longer to stand as isolated communities. By connecting them with roads and encouraging the movement of our people between them, we are forging the ties that will bind the realm together and make its people one."
 TOC_Connecting_the_Cities_Event.a:0 "Let the roads bind us together."
 
 # task_7's on_completion event.
 TOC_Gems_of_Jade_Event.t:0 "Gems of Jade"
 TOC_Gems_of_Jade_Event.desc:0 "The jade mines are yielding more than ever, while our workshops turn out silk in quantities once thought impossible. Merchants carry these prized goods along the roads of Tocharia, and wealth follows in their wake.\n\nThe basin grows richer with every passing season."
 TOC_Gems_of_Jade_Event.a:0 "Prosperity flows."
 
 #task 13's on_completion event.
 TOC_fortresses.t:0 "Protecting the People"
 TOC_fortresses.desc:0 "Great fortresses now rise along the borders of Tocharia, guarding the roads and settlements within. Built to withstand the armies of our enemies, they will stand long after those who raised them are gone."
 TOC_fortresses.a:0 "Let them stand for all time."
 
 #task 9's on_completion event.
 TOC_Capital.t:0 "Heart of the Homeland"
 TOC_Capital.desc:0 "Our capital has grown into a city of true renown. Its markets and monuments now stand proudly alongside the storied cities of the Ferghana and the Oxus, a fitting heart for the realm we have built."
 TOC_Capital.a:0 "A city worthy of Tocharia."
 
 # task 2,3 and 4's completion events.
 TOC_Northern_Neighbors_Event.t:0 "Northern Neighbors"
 TOC_Northern_Neighbors_Event.desc:0 "To the north lies a land of contrasts. The great river sustains fertile lands and prosperous settlements, including Kucha, the greatest of our cities. Beyond them rise the mountains, vast and forbidding, guarding the northern reaches of the basin."
 TOC_Northern_Neighbors_Event.a:0 "The north shall be ours."
 
 TOC_Subjugating_Shule_Event.t:0 "Subjugating Shule"
 TOC_Subjugating_Shule_Event.desc:0 "The central basin is unlike the settled lands around its edges. Its cities and oases are interspersed with the camps of the Saka, whose people have made these lands their home for generations.\n\nWith Shule and the surrounding lands now under our authority, the heart of the Tarim Basin is within our grasp, and the peoples who inhabit it will now have to find their place within the realm we are building."
 TOC_Subjugating_Shule_Event.a:0 "The road beyond awaits."
 
 TOC_Conquest_of_Khotan_Event.t:0 "Conquest of Khotan"
 TOC_Conquest_of_Khotan_Event.desc:0 "The southern road is more isolated from the world we know than any other route through the basin. Yet caravans still arrive from beyond the horizon, carrying strange goods and stranger tales from distant lands.\n\nKhotan stands upon this meeting point between the familiar world of the Tarim Basin and the unknown lands beyond. Its markets and roads are now ours."
 TOC_Conquest_of_Khotan_Event.a:0 "Let us see what lies beyond."
 
 #task 8's on_completion event.
 TOC_Trade_Thoroughfares_Event.t:0 "Trade Thoroughfares"
 TOC_Trade_Thoroughfares_Event.desc:0 "The great roads of the basin have drawn merchants from far and wide. Even the most remote settlements are now tied into the flow of commerce, and our officials have learned to profit from every caravan that passes through our lands. The treasury has been enriched, and our mastery of trade has grown with it."
 TOC_Trade_Thoroughfares_Event.a:0 "Prosperity through Trade."
 
 #task 10's on_completion event.
 TOC_Taming_the_Toads_Event.t:0 "Taming the Toads"
 TOC_Taming_the_Toads_Event.desc:0 "With the conquest of the Pamir, Kezhen has taken on a new importance. Standing at the foot of the mountains, the city is ideally placed to gather the wealth and traffic of the highlands and direct it toward the basin. Our road builders have seized the opportunity, bringing Kezhen into the great network of Tocharian roads and turning it into a thriving regional hub and a gateway toward the lands of Tibet.."
 TOC_Taming_the_Toads_Event.a:0 "Kezhen opens the way."

#new tasks, from 21 to 24
 TOC_Mastering_the_Mountains_Event.t:0 "Mastering the Mountains"
 TOC_Mastering_the_Mountains_Event.desc:0 "The mines of the Pamir are yielding their wealth, while Khezen has grown into a worthy capital for the region. A new road now crosses the mountains, tying this remote land more closely to the rest of Tocharia and making us closer to the rest of the world"
 TOC_Mastering_the_Mountains_Event.a:0 "A path to the roof of the world."

 TOC_Valley_Vintages_Event.t:0 "Valley Vintages"
 TOC_Valley_Vintages_Event.desc:0 "The valleys of northern Tocharia have long been making their own grape wines, but their production remains scattered among many small communities. Much of the land beyond the established settlements is instead used by herders, leaving fertile ground underdeveloped.\n\nWe are changing this by establishing vineyards and presses upon these lands. The herding grounds are being transformed into productive estates, bringing winemakers and workers together and allowing the production of wine to be carried out on a greater scale."
 TOC_Valley_Vintages_Event.a:0 "Truly an ingenious idea."
 #reference to one of the loading screen quotes

 TOC_Carpets_of_Khotan_Event.t:0 "Carpets of Khotan"
 TOC_Carpets_of_Khotan_Event.desc:0 "In the south, the artisans of Khotan have begun producing fine rugs. Their work has proven remarkably popular, and the resources and space we have provided have allowed the craft to expand far beyond its former scale.\n\nWorkshops have sprung up across the former herding lands, while weavers and other craftsmen have flocked to them in growing numbers. What was once a small local craft is rapidly becoming a major industry, with the rugs of Khotan finding their way to markets throughout Tocharia and beyond."
 TOC_Carpets_of_Khotan_Event.a:0 "Fine Cloth is universally profitable."
 #Europa Universalis 5 reference, where fine cloth is a trade good that is usually very profitable

 TOC_Pishan_Prize_Event.t:0 "Pishan Prize"
 TOC_Pishan_Prize_Event.desc:0 "Pishan is no longer the small town it once was. New buildings fill its streets, its markets have grown busier, and the jade brought forth from the banks of the Yarkand River has become a valuable commodity. Traders passing through the southern routes now have every reason to stop here, bringing goods from Iran, India, and the distant lands of China.\n\nThe growth of Pishan has raised a question that would once have seemed absurd. Our capital was chosen in an age when the basin was divided between many rulers and the southern reaches stood far from the centers of power. Now that our realm has been united, a city at the meeting point of these great trade routes may serve us better.\n\nPishan has the wealth, position, and growing population to become more than a prosperous provincial city. Perhaps the seat of our government should follow its rise."
 TOC_Pishan_Prize_Event.a:0 "We will maintain our current capital."
 TOC_Pishan_Prize_Event.b:0 "We will move our capital to Pishan."

 TOC_Saka_Situation_Flavor_1_Event.t:0 "A Dusty Dispute"
 TOC_Saka_Situation_Flavor_1_Event.desc:0 "A dispute has broken out between Saka herders and the inhabitants of one of our oasis towns. What began as an argument over grazing rights quickly became a confrontation, with several men on both sides drawing weapons before the local authorities could intervene.\n\nThe incident was contained without serious bloodshed, but it has exposed a problem that cannot be ignored. The Sakas may now be a minority within our realm, yet their way of life remains difficult to reconcile with the settled order of our cities. Our officials demand clearer authority, while some of the Saka elders insist that the customs of their people cannot simply be discarded because the Tarim Basin now has a single ruler."
 TOC_Saka_Situation_Flavor_1_Event.a:0 "Such disputes cannot be allowed to fester."

 TOC_Saka_Situation_Flavor_2_Event.t:0 "An Uncertain Peace"
 TOC_Saka_Situation_Flavor_2_Event.desc:0 "Reports from the frontier are contradictory. Some Saka communities have begun trading regularly with our towns and seeking the protection of our officials. Others have withdrawn deeper into the desert, keeping their distance from our administrators and refusing to answer their summons.\n\nNone of this amounts to open rebellion, but neither does it resemble full acceptance of Tocharian rule. Our officials cannot agree on what it means. Some see signs that the Sakas are gradually becoming part of our realm. Others warn that their apparent quiet may only conceal resentment, waiting for the right moment to surface."
 TOC_Saka_Situation_Flavor_2_Event.a:0 "We cannot mistake uncertainty for security."

