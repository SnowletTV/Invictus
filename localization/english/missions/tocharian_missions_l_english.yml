l_english:
 tocharia_missions:0 "Treasures of Tocharia"
 tocharia_missions_DESCRIPTION:0 "For generations, the peoples of Tocharia have prospered at the crossroads of the great civilizations. Our cities command the routes through the deserts, carrying goods and ideas between east and west, while the wealth of the Tarim Basin sustains those who can master its treacherous corridors.\n\nBut the world around us is changing. Alexander is dead, the Xiongnu rise in the northeast, and the lands of China are divided by war. The old balance that allowed our cities to prosper can no longer be taken for granted.\n\nWe must secure our future before others secure it for us. Unite the cities of the Tarim Basin, strengthen the routes that bind them together, and turn the wealth of the Silk Road toward the defense of our people. If we can command the crossroads, we can make Tocharia a power that cannot be ignored."
 tocharia_missions_CRITERIA_DESCRIPTION:0 "This mission will be completed once the Tocharians have been united, the #Y $himalayan_region$#! brought under their control, and Tocharia has been established as a great commercial power."
 tocharia_missions_BUTTON_TOOLTIP:0 "Tocharia shall rise to power."
 tocharia_missions_BUTTON_DETAILS:0 "Unite the Tarim Basin, bind its cities together, and make Tocharia a power that cannot be ignored."
 
 tocharia_missions_task_1:0 "Muster our Might"
 tocharia_missions_task_1_DESC:0 "There is an unease among our people that the peace we have known is drawing to an end. Whatever is coming, we must be prepared. The leadership of [ROOT.GetCountry.GetName] has begun gathering the resources and men needed for the struggle ahead."
 
 tocharia_missions_task_2:0 "Northern Neighbors"
 tocharia_missions_task_2_DESC:0 "Bring the northern reaches of the Tarim Basin under our control."

 tocharia_missions_task_3:0 "Subjugating Shule"
 tocharia_missions_task_3_DESC:0 "The central basin is home to the cities of Shule and to numerous Saka communities who have long shared these lands with the Tocharians. Bringing this region under our control will place the heart of the basin within our dominion."

 tocharia_missions_task_4:0 "Conquest of Khotan"
 tocharia_missions_task_4_DESC:0 "The southern road is where the Tarim Basin reaches toward distant lands to the East. Securing its cities and roads will bring this corner of the basin into our realm and open the way beyond."
 
 tocharia_missions_task_17:0 "Tocharia Together"
 tocharia_missions_task_17_DESC:0 "The cities and peoples of Tocharia now stand united under a single state. This is a triumph worthy of celebration, but conquering the Tarim Basin has only given us the foundation of a nation. We must now begin the greater work of bringing the Tocharian people together as one."
 
 tocharia_missions_task_22:0 "Valley Vintages"
 tocharia_missions_task_22_DESC:0 "Wine production is widespread across the northern valleys, but remains scattered among many small communities. By establishing vineyards and presses on the northern herding lands, we can concentrate this industry, develop the region, and increase the quality and quantity of its vintages."
 
 tocharia_missions_task_23:0 "Carpets of Khotan"
 tocharia_missions_task_23_DESC:0 "The artisans of Khotan have been producing fine rugs, but the craft remains limited by the resources and space available to them. By encouraging this work and providing the materials and land it needs to grow, we can turn it into a large and profitable industry."
 
 tocharia_missions_task_24:0 "Pishan Prize"
 tocharia_missions_task_24_DESC:0 "Pishan may be a small town, but its position at the crossroads of the southern trade routes gives it importance far beyond its size. The Yarkand River also provides access to valuable nephrite jade. By developing Pishan and its jade industry, we can turn this strategic town into a major center of trade and wealth."
 
 tocharia_missions_task_5:0 "Oasis Opportunities"
 tocharia_missions_task_5_DESC:0 "The Tarim Basin is a harsh land of desert and mountains, but scattered throughout its wastes are fertile oases. With proper irrigation and investment, these pockets of life can sustain great cities and productive fields, giving our people new places to settle and strengthen the foundations of our united nation."
 oasis_city_tt:0 "Have at least #Y [SCOPE.ScriptValue('tocharian_oasis_city_target_svalue')|0]#! cities or metropolises on oasis territories within the #Y Tarim Basin#!. (#R [SCOPE.ScriptValue('tocharian_oasis_city_svalue')|0]#!/#Y [SCOPE.ScriptValue('tocharian_oasis_city_target_svalue')|0]#!)"
 toc_oasis_reward_tt:0 "Every oasis territory in the #Y Tarim Basin#! will gain:\n\n[GetModifier('TOC_OASIS').GetDesc]"
 
 tocharia_missions_task_6:0 "Connecting the Cities"
 tocharia_missions_task_6_DESC:0 "The oases of Tocharia brim with activity and life, yet each remains isolated from the others, separated by the vastness of the desert. If our realm is to become a unified, prosperous whole, we must bind our cities and people together with a proper network of roads."
 toc_road_network_tt:0 "A #Y road#! will be built connecting every oasis in the basin."
 
 tocharia_missions_task_7:0 "Gems of Jade, Strands of Silk"
 tocharia_missions_task_7_DESC:0 "Through our own industry and our trade with the distant lands of the East, Tocharia has become host of some of the rarest and most coveted goods in the world. Jade, silk and gems flow through our markets, bringing wealth to those who can command their production and trade. By investing in these industries we can turn these treasures into immense wealth for Tocharia."
 jade_silk_trade_tt:0 "Produce at least #Y [SCOPE.ScriptValue('tocharian_trade_target_svalue')|0]#! units of @jade! #Y Jade#!, @silk! #Y Silk#!, @precious_metals! #Y Precious Metals#! or @gems! #Y Gems#! in the #Y $himalayan_region$#!. (#R [SCOPE.ScriptValue('tocharian_trade_svalue')|0]#!/#Y [SCOPE.ScriptValue('tocharian_trade_target_svalue')|0]#!)"
 
 tocharia_missions_task_8:0 "Trade Thoroughfares"
 tocharia_missions_task_8_DESC:0 "The cities of the Tarim Basin are sustained by trade. By expanding our markets and investing in the administration of our lands, we can greatly increase the prosperity and wealth of the region."
 himalaya_commerce_tt:0 "Build at least #Y [SCOPE.ScriptValue('tocharian_himalaya_commerce_target_svalue')|0]#! [GetBuilding('commerce_building').GetName|Y] buildings in the #Y $himalayan_region$#!. (#R [SCOPE.ScriptValue('tocharian_himalaya_commerce_svalue')|0]#!/#Y [SCOPE.ScriptValue('tocharian_himalaya_commerce_target_svalue')|0]#!)"
 basin_investment_tt:0 "Have an #Y Oratory#! state investment in each of #Y $north_tarim_area$#!, #Y $south_tarim_area$#! and #Y $tarim_area$#!. (#R [SCOPE.ScriptValue('tocharian_basin_investment_svalue')|0]#!/#Y [SCOPE.ScriptValue('tocharian_basin_investment_target_svalue')|0]#!)"
 
 tocharia_missions_task_9:0 "Heart of the Homeland"
 tocharia_missions_task_9_DESC:0 "The unification has created a realm greater than any of the cities that once ruled the Tarim Basin alone. Our capital must reflect this new reality. We must create a worthy seat for the government of a united Tocharia."
 toc_capital_buildings_tt:0 "Our capital has at least #Y [SCOPE.ScriptValue('tocharian_capital_buildings_target_svalue')|0]#! used building slots. (#R [SCOPE.ScriptValue('tocharian_capital_buildings_svalue')|0]#!/#Y [SCOPE.ScriptValue('tocharian_capital_buildings_target_svalue')|0]#!)"
 toc_capital_population_tt:0 "Our capital has a population of at least #Y [SCOPE.ScriptValue('tocharian_capital_population_target_svalue')|0]#!. (#R [SCOPE.ScriptValue('tocharian_capital_population_svalue')|0]#!/#Y [SCOPE.ScriptValue('tocharian_capital_population_target_svalue')|0]#!)"
 toc_capital_no_construction_tt:0 "Our capital has #Y no construction#! underway."
 
 pamir_mines_tt:0 "At least #Y [SCOPE.ScriptValue('tocharian_pamir_mines_target_svalue')|0]#! mines have been established within the #Y Pamir#!. (#R [SCOPE.ScriptValue('tocharian_pamir_mines_svalue')|0]#!/#Y [SCOPE.ScriptValue('tocharian_pamir_mines_target_svalue')|0]#!)"
 khezen_buildings_tt:0 "Kezhen has at least #Y [SCOPE.ScriptValue('tocharian_khezen_buildings_target_svalue')|0]#! used building slots. (#R [SCOPE.ScriptValue('tocharian_khezen_buildings_svalue')|0]#!/#Y [SCOPE.ScriptValue('tocharian_khezen_buildings_target_svalue')|0]#!)"
 khezen_population_tt:0 "Kezhen has a population of at least #Y [SCOPE.ScriptValue('tocharian_khezen_population_target_svalue')|0]#!. (#R [SCOPE.ScriptValue('tocharian_khezen_population_svalue')|0]#!/#Y [SCOPE.ScriptValue('tocharian_khezen_population_target_svalue')|0]#!)"
 khezen_no_construction_tt:0 "Kezhen has #Y no construction#! underway."
 pamir_roads_tt:0 "#Y Roads#! will be built connecting Kezhen to the other settlements of the Pamir."
 
 tocharia_missions_task_20:0 "Farther than the Farthest"
 tocharia_missions_task_20_DESC:0 "The unification of the Tarim Basin has given us a secure foundation, but our prosperity cannot only depend upon what lies within our borders alone. The routes that pass through our lands connect us to distant peoples and powerful realms. We must cultivate these connections, opening new avenues for trade and establishing Tocharia as a power whose influence reaches beyond the basin."
 tocharia_farthest_tt:0 "At least #Y 1#! country of #Y $macedonian$#! culture that is not #Y $BAC$#! has an opinion of us of #Y 75#! or higher."
 
 tocharia_missions_task_10:0 "Taming the Toads"
 tocharia_missions_task_10_DESC:0 "The Pamir stands at the edge of our realm, a formidable land of mountains and narrow passes. Its conquest will secure our frontier and open the way toward the lands beyond, but possession alone is not enough. We must make these mountains a lasting part of Tocharia and establish a great settlement at their heart."

 tocharia_missions_task_19:0 "Learning from the Locals"
 tocharia_missions_task_19_DESC:0 "The people of the Pamir have lived among these mountains since time immemorial. If we are to make this harsh land truly part of Tocharia, we must first establish ourselves among those who know it best. Whether by granting them a place among our citizens or by settling our own people alongside them, we must lay the foundations for a lasting Tocharian presence in the highlands."
 
 tocharia_missions_task_21:0 "Mastering the Mountains"
 tocharia_missions_task_21_DESC:0 "The Pamir mountains are rich in mineral wealth, but their harsh terrain makes them difficult to exploit. By developing the mines and strengthening Khezen as the provincial capital, we can turn this remote region into a productive part of our realm."
 
 tocharia_missions_task_11:0 "A Taste of Tibet"
 tocharia_missions_task_11_DESC:0 "The western highlands of Tibet have closer economic and administrative ties to the Tarim Basin than to the distant lands to their east. By bringing these territories under our control, we can secure their mineral wealth and extend our reach southward, opening direct contact with the prosperous lands of India."
 tocharian_tibet_mountain_experts1:0 "Building on the knowledge we learned from the #Y $phryni$#!, we can improve the living conditions in the mountainous provinces of tibet, granting them the followign modifer:\n\n[GetModifier('TOC_mountain_life_small').GetDesc]"
 tocharian_tibet_mountain_experts2:0 "In particular, the city of Gilgit will be made in a regional hub:"
 
 tocharia_missions_task_18:0 "The Territory of Tayuan"
 tocharia_missions_task_18_DESC:0 "Tayuan, interlopers from the far west, hold many of the mountain passes to our south. They are strong and numerous, and it would be wise to attempt diplomacy, offering to purchase territories that are marginal to them but vital to us. Alternatively, we could strike swiftly and seize the nearby passes before they can react, but such an attack would almost certainly provoke them into war."
 tocharia_tayuan_mission_tt:0 "We will receive events allowing us to buy or seize the mountain passes of #Y $tarim_area$#!."
 
 tocharia_missions_task_12:0 "Bactrian Borderlands"
 tocharia_missions_task_12_DESC:0 "The satrapy of Bactria holds a critical mountain pass to our south-west. Without control of it, our security is compromised and our ability to expand ever more so.\n\n We cannot expect to prevail against the combined might of Bactria and the Seleukids in a prolonged confrontation. Yet these lands are of marginal importance to both powers. A generous offer may convince their governors that selling what they can scarcely defend is preferable to fighting for it. Should they refuse, a swift seizure may leave them with little choice but to accept the loss—or risk a costly war over a distant frontier."
 tocharia_bactria_mission_tt:0 "We will receive events allowing us to buy or seize the last mountain pass in #Y $tarim_area$#!."
 
 tocharia_missions_task_13:0 "Protecting the People"
 tocharia_missions_task_13_DESC:0 "Our new territories have left us exposed across a wide and difficult frontier. We must secure the passes and protect the people who now depend upon us. A chain of fortresses in the most vital positions will give our armies the strongpoints they need to hold the frontier."
 himalaya_forts_tt:0 "Build a [GetBuilding('fortress_building').GetName|Y] in at least #Y 3#! of the highlighted territories. Once this is done, the remaining fortresses will be constructed for us."
 tocharia_forts1_tt:0 "The remaining fortresses will be built automatically, and receive the following modifier:"
 tocharia_forts2_tt:0 "Additionally, our #Y expertise in fortifications#! will make them cheaper to maintain."
 
 tocharia_missions_task_14:0 "The Saka Situation"
 tocharia_missions_task_14_DESC:0 "The Tocharians have shared the Tarim Basin with the nomadic Saka since time immemorial. Now, with the ascendancy of the Tocharian people and the unification of the basin, we can no longer afford to leave the place of the nomads in our realm undefined.\n\nIt is imperative that we establish a coherent and comprehensive policy toward the Saka in our midst. The choice we make will shape our society and our country for generations to come."
 
 tocharia_missions_task_15:0 "Tongues Together"
 tocharia_missions_task_15_DESC:0 "During the long years of division, the Tocharian tongue diverged between the peoples of the northern and southern basin. Now that our lands are united, a standardized language will help bridge these differences and streamline administration across the realm."
 
 tocharia_missions_task_16:0 "Realm Realized"
 tocharia_missions_task_16_DESC:0 "Through wise administration and flourishing trade, Tocharia has grown wealthy and prosperous. Our realm has become a land where people can prosper, cities can flourish, and future generations can build their lives." 
