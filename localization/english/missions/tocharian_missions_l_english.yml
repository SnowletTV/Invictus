 TOC_Farthest:0 "A City at the Edge of the World"
 TOC_Farthest_desc:0 "This is the capital of Tocharia. A city at the edge of the known world, its position makes it an ideal place for trade and commerce."

 TOC_Edge_of_the_World:0 "A Country at the Edge of the World"
 TOC_Edge_of_the_World_desc:0 "Our envoys and merchants now travel farther than ever before, reaching even the great Hellenistic kingdoms of the west."

 TOC_Standardized_Language:0 "Standardized Tocharian"
 TOC_Standardized_Language_desc:0 "The standardization of the Tocharian language has made communication throughout the realm easier, strengthening both scholarship and social cohesion."
 
 TOC_Fertile_Basin:0 "A Fertile Basin"

 TOC_Fort_Maintenance:0 "Mountain Pass Expertise"
 desc_TOC_Fort_Maintenance:0 "Tocharian armies have mastered the art of defending the narrow passes and rugged terrain of the mountains."

 TOC_Silk_Jade_Wealth:0 "Tocharian Industry"

 TOC_Bastion:0 "Fortified Mountain Bastion"
 desc_TOC_Bastion:0 "This mountain stronghold has been developed into a formidable bastion."
 
 TOC_Trade_Boost:0 "Expanded Trade"
 desc_TOC_Trade_Boost:0 "Years of investment in trade infrastructure have taught our governors how to harness commerce more effectively, opening new opportunities for trade throughout the realm."
 
