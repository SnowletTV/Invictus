l_english:
 naval_events.1.t: "Sea Walls Fall By the Sea Shore"
 naval_events.1.desc: "[SCOPE.sCountry('naval_assault_attacker').GetAdjective] ships have attacked the fort in [SCOPE.sProvince('naval_assault_target').GetName]! The fortifications have collapsed, and the city defenses lie in ruin. One can only hope our men can hold the city until an army lifts the siege."
 naval_events.1.a: "Since when do they use ships to attack walls?"
`