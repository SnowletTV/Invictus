l_english:
 patch_notes: "What's New"
 patch_notes_text:0 "V1.12 - Hephaestus (breaks saves, use Nexusmods 1.11.0.3 version to continue old saves)\nNew content:\n- Added new tree for Shan\n- Added an Ahistorical Formables game rule unlocking several new formables\n- Reworked invasions: Reworked Galatian, Yuezhi, Saka and Wusun invasions\n\nGFX changes (most by Pureon):\n- New map model: the Megalithic Monuments of Alcalar\n- Tyre is now depicted as an island city\n- New city graphics for Thracian, Iberian and Anatolian cities\n- New unit models for Cyrenaica, Phoenicia, Corinth, Caledonia, Bithynia, Boeotia, Thebes, the Achaean League, Armenia, Heraclea Pontica, Numidia, Tyras and Crete\n- New levy and spearmen models for Epirus, Thrace, Athens and Syracuse\n- 20 new treasure icons, plus missing trait icons and icons for apotheosis scalings\n- New flags for Iapodia and the Venetic Empire\n- More variety in event pictures and several new event pictures\n- Many other 3D model, texture, and other gfx improvements\n\nMap changes:\n- Updated road visuals and locators around the world\n- Swapped some trade goods around\n- Fixed some wrong cultured barbarians\n- Added flavour modifiers to Iberia\n\nChanges:\n- Mercenaries can now be trained when using a merc law\n- Cities now always found through the timer rather than in some content being instant\n- Added decision for Massalian Wine\n- Added more names for the Aksumite culture\n- Horses now also boost light cavalry discipline and reduced the spearmen defensive bonus\n- Tweaked AI slightly\n- The Grand Tibetan Road now grants Founder instead of Crafty\n- Added informative icon for Apotheosis deity effect in its descriptions\n- Clarified tooltips for many generic triggers\n- Updated and improved Russian, French, German and Spanish translations\n\nBugfixes:\n- Fixed a crash caused by the Diadochi subject-switching event\n- Fixed Carthage's Aftermath of the Invasion tree not giving rewards or showing event popups\n- Fixed the League of Corinth not making you a feudatory\n- Fixed the Ionian tree not freeing you from your overlord\n- Fixed relics disappearing when annexing a subject\n- Fixed the Cyprus partition event being able to end a player's game\n- Fixed upgrading Grand Garrisons lowering your fort limit\n- Fixed several missions that could get stuck or bypass themselves, including Heraclea Pontica, Epirus, Legia and the Black Sea tree\n- Fixed several missions not giving their rewards, including Markets of Bharukaccha\n- Fixed republic events such as No Confidence firing for monarchies and empires\n- Fixed the Theban priest revolt firing for Egyptian nations\n- Fixed the Britannia triumph giving the Iberian dominance modifier\n- Fixed the encomienda mission affecting provinces outside your realm\n- Fixed Umbria's recruitment of Italic tribes pulling them out of unrelated wars\n- Traditionalists no longer demand destroying shrines after adopting Major Syncretism\n- Fixed the Germania tag switch\n- Fixed several Parthian bugs\n- Fixed Mithridates I Ctistes being set as the mother of Ariobarzanes\n- Removed duplicate localisation and fixed a lot of localisation\n- Made countless smaller bugfixes to mission trees"