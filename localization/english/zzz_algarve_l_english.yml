 # Modifiers
 alcalar_megaliths_modifier:0 "Megaliths of Alcalar"
 desc_alcalar_megaliths_modifier:0 "Erected by vanished ancestors millennia ago, these towering ancient stones serve as a profound spiritual anchor for the local tribes. While the old ways stubbornly resist the introduction of foreign gods, the sacred site acts as a beacon, drawing rural folk from across the frontier to settle in its shadow."
 
 cynetic_sea_caves_modifier:0 "Cynetic Sea Caves"
 desc_cynetic_sea_caves_modifier:0 "The dramatic limestone cliffs and deep sea caves along this coast provide unparalleled natural defenses and plentiful maritime sustenance. However, their labyrinthine nature makes enforcing central law nearly impossible. It is a wild, untamed frontier where locals can easily evade magistrates, actively resisting the march of civilization and cultural assimilation."