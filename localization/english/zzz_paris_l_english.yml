l_english:
 ### PHASE 1: MISSION TASKS & TOOLTIPS ###
 parisii_lutetia_mission_header:0 "The Lutotetion Ambition"
 
 mastery_of_the_seine_task:0 "The River Guilds"
 mastery_of_the_seine_task_DESC:0 "The powerful Nausoi Parisi—the boatmen of the Sekuana—control the flow of trade through our lands. We must bring these independent ferrymen under state influence to secure our economic future."
 mastery_of_the_seine_tt:0 "Our coffers will be drained, but the rivermen will fall in line."
 
 sennonian_unification_task:0 "Senonian Unification"
 sennonian_unification_task_DESC:0 "We are but one of the Senonian tribes. Initiating this task will send an ultimatum to our neighbors. We must wait for their response—they will either submit to our hegemony, or we will gain the claims necessary to unite our people by the sword."
 
 fortify_lutetia_crossing:0 "Develop Lutotetion"
 fortify_lutetia_crossing_DESC:0 "Our capital must become the undisputed heart of Galia. By expanding our ports, markets, and administrative buildings, we will draw the wealth of the river directly into our coffers."
 
 parisii_coinage_task:0 "Coinage and Commerce"
 parisii_coinage_task_DESC:0 "Our centralization efforts require a unified economic policy. We must decide how wealth is measured and traded across the Confederation."
 
 belgae_ultimatum_task:0 "The Belkai Ultimatum"
 belgae_ultimatum_task_DESC:0 "The Belkai to our north pose a constant threat. We must secure this flank. We shall issue an ultimatum to the tribes there: submit as our subjects willingly and be welcome as equal partners, or face our wrath."
 
 subdue_the_old_guard_task:0 "Subdue the Old Guard"
 subdue_the_old_guard_task_DESC:0 "The traditionalists despise our growing centralization. The time for appeasement has passed. We must crush the rural warlords once and for all."
 subdue_old_guard_tt:0 "The Old Guard rebellion has been completely crushed, and their lands are secured."
 
 fortify_agedincum_crossing:0 "The Agedincon Bulwark"
 fortify_agedincum_crossing_DESC:0 "Agedincon stands as our shield against the southern tribes. We must heavily fortify this crossing to lock down the Icauna river valley."
 
 fortify_caracotinum_crossing:0 "Gateway to the Sea"
 fortify_caracotinum_crossing_DESC:0 "He who controls the mouth of the Sekuana controls the wealth of Pretania. We will build a coastal fortress in [GetProvince('(int32)2468').GetName] to dominate the estuary."
 
 fortify_durocatalaunum_crossing:0 "The Eastern Marches"
 fortify_durocatalaunum_crossing_DESC:0 "The eastern plains are vast and vulnerable. A sprawling military infrastructure in [GetProvince('(int32)2450').GetName] will protect our heartland from Belkai incursions."
 
 secure_watersheds_task:0 "Secure the Watersheds"
 secure_watersheds_task_DESC:0 "The Sekuana is more than a river; it is a sprawling basin of interconnected tributaries. We must ensure that the major crossings of this watershed fall under our direct control or the control of our loyal subjects."
 
 seine_confederation_task:0 "The Sekuana Confederation"
 seine_confederation_task_DESC:0 "Our borders are secure, our rivals are subdued, and the river flows with gold. The time has come to declare a unified Confederation."
 seine_forts_req_tt:0 "At least one of the three optional crossings has been fortified."
 general_mission_cooldown_tt:0 "Aborting this mission will incur a 20-year cooldown."


 ### PHASE 1: EVENT TEXT & CHOICES ###
 paris_mission.1.t:0 "The Sekuana Guilds Submit"
 paris_mission.1.desc:0 "The guilds of the Sekuana have agreed to recognize our authority over the river crossings."
 paris_mission.1.a:0 "Grant them autonomy for a lump sum."
 paris_mission.1.b:0 "Seize direct control of the tolls."

 paris_mission.2.t:0 "The Old Guard Ultimatum"
 paris_mission.2.desc:0 "As we centralize our power, the traditionalist chiefs grow restless. We must deal with them before they become an existential threat."
 paris_mission.2.a:0 "Attempt to buy their loyalty."
 paris_mission.2.b:0 "Refuse to pay tribute. Prepare for war!"

 paris_mission.3.t:0 "Our Envoys Depart"
 paris_mission.3.desc:0 "Our diplomats have ridden out to our Senonian neighbors with our demands of fealty."
 paris_mission.3.a:0 "We await their answer."
 paris_mission.3.a.tt:0 "We will favor a diplomatic approach."
 paris_mission.3.b:0 "They will kneel or bleed."
 paris_mission.3.b.tt:0 "We will favor a hostile approach."

 paris_mission.5.t:0 "The Final Price"
 paris_mission.5.desc:0 "The greedy warlords demand even more coin. If we pay this exorbitant sum, they may finally stand down. If we refuse, blood will flow."
 paris_mission.5.a:0 "Pay the final bribe."
 paris_mission.5.b:0 "The price is too high. War!"

 paris_mission.6.t:0 "The Old Guard Revolts!"
 paris_mission.6.desc:0 "Traditionalist chiefs from the rural hinterlands have raised their banners in open rebellion. They refuse to bow to our centralized authority and seek to shatter our new state."
 paris_mission.6.a:0 "To arms! Crush the traitors!"

 paris_mission.7.t:0 "Urban Expansion"
 paris_mission.7.desc:0 "The security of our river crossings has spurred a boom in urban development."
 paris_mission.7.a:0 "Subsidize a new market."
 paris_mission.7.b:0 "Fund a tax office."
 paris_mission.7.c:0 "Expand the port facilities."

 paris_mission.8.t:0 "The Parisi Demand Fealty"
 paris_mission.8.desc:0 "The newly emergent power on the Sekuana demands our submission. If we refuse, they will take our lands by the sword."
 paris_mission.8.a:0 "We have no choice but to bend the knee."
 paris_mission.8.b:0 "We will fight!"

 paris_mission.9.t:0 "Senonian Submission"
 paris_mission.9.desc:0 "Our neighbors have wisely recognized our hegemony. Their envoys have arrived in Lutotetion to pledge their warriors and wealth to our cause."
 paris_mission.9.a:0 "A bloodless victory."

 paris_mission.10.t:0 "The Sekuana Confederation"
 paris_mission.10.desc:0 "Through diplomacy, coin, and the sword, the Parisi have brought the disparate tribes and river guilds of the Sekuana into a unified whole. Today, we formalize our dominance."
 paris_mission.10.a:0 "Hail the Confederation!"

 paris_mission.11.t:0 "The Belkai Ultimatum"
 paris_mission.11.desc:0 "The northern tribes have proven to be a thorn in our side. We have dispatched envoys to the Suaeuconia region demanding their unconditional submission."
 paris_mission.11.a:0 "Send the demands!"

 paris_mission.12.t:0 "The Sekuana Ultimatum"
 paris_mission.12.desc:0 "An envoy from the newly empowered Parisi has arrived at our tribal capital. They demand we lay down our arms and formally submit to their river confederation as feudatories. If we refuse, war is certain."
 paris_mission.12.a:0 "We must submit."
 paris_mission.12.b:0 "We bow to no one!"

 paris_mission.20.t:0 "The Sekuana Economy"
 paris_mission.20.desc:0 "Our centralization efforts have reached a tipping point. We must formally codify how wealth is handled across the Sekuana."
 paris_mission.20.a:0 "Mint the Gold Staters."
 paris_mission.20.a.tt:0 "We will adopt the #Y Coin Minting Initiative#! law. If we already have it, we gain wealth."
 paris_mission.20.b:0 "Standardize the Barter Networks."
 paris_mission.20.b.tt:0 "We will adopt the #Y Barter Economy Statutes#! law. If we already have it, we gain political capital."


 ### PHASE 1: MODIFIERS & CUSTOM TAGS ###
 lutetian_river_guilds:0 "The Nausoi Parisi"
 desc_lutetian_river_guilds:0 "The powerful river guilds of the Parisi have been granted sweeping autonomy to manage the flow of goods along the Sekuana, bringing immense wealth and foreign trade to the settlement."
 seine_river_tolls:0 "Sekuana River Tolls"
 desc_seine_river_tolls:0 "The state maintains a tight grip on the vital river arteries of the Sekuana, extracting heavy tolls from passing merchants and funneling the wealth directly into the state treasury."
 parisii_stater_mint:0 "Gold Stater Mint"
 desc_parisii_stater_mint:0 "A centralized mint dedicated to pressing uniform gold staters, streamlining trade across the river valleys."
 parisii_barter_network:0 "Standardized Barter"
 desc_parisii_barter_network:0 "A codified network of traditional trade values keeps the rural populations deeply content with our rule."
 parisii_confederation_capital:0 "Confederation Capital"
 desc_parisii_confederation_capital:0 "The undisputed political and economic heart of the entire Sekuana river basin."
 
 crossing_construction_effort:0 "Crossing Construction"
 desc_crossing_construction_effort:0 "Local resources are being heavily taxed to fund a massive fortification project."
 seine_fortified_crossing:0 "Secured Basin"
 desc_seine_fortified_crossing:0 "The interlocking network of fortresses protects the basin from sudden raids."
 parisii_urban_crossing:0 "Urban River Crossing"
 desc_parisii_urban_crossing:0 "A massive hub of riverine commerce heavily defended by palisades, acting as an inland seaport for foreign merchants."
 parisii_protected_trade_hub:0 "Protected Trade Hub"
 desc_parisii_protected_trade_hub:0 "Fortifications protect our merchants, easing the establishment of future urban centers along the river."
 
 seine_engineering_tier_1:0 "Riverine Engineering I"
 seine_levies_tier_1:0 "Sekuana Levies I"
 seine_engineering_tier_2:0 "Riverine Engineering II"
 seine_levies_tier_2:0 "Sekuana Levies II"
 seine_engineering_tier_3:0 "Riverine Engineering III"
 seine_levies_tier_3:0 "Sekuana Levies III"

 seine_council_harmony:0 "Council Harmony"
 desc_seine_council_harmony:0 "The Sekuana Confederation operates as a delicate balance of tribal chiefs, warlords, and merchant guilds. By maintaining our republican traditions, the great families remain fiercely loyal to the state apparatus."
 seine_autocratic_grip:0 "Autocratic Grip"
 desc_seine_autocratic_grip:0 "The Master of the Sekuana rules with unquestioned authority. The total centralization of power ensures the swift execution of the state's will, drawing the admiration of the masses and the absolute obedience of the elites."

 parisii_revolt_name:0 "Old Guard Revolt"
 parisii_revolt_name_adjective:0 "Traditionalist"
 SEINE_CONFEDERATION:0 "Sekuana Confederation"
 NICKNAME_SEINE_FOUNDER:0 "the Founder"


 ### PHASE 2: (PRESERVED CONTENT) ###
 diplomatic_reputation_boost:0 "Gallic Emissaries"
 central_gallic_hegemon:0 "Hegemon of Central Galia"
 desc_central_gallic_hegemon:0 "Our dominance over the neighboring tribes is unquestioned, binding them closely to our capital."
 channel_trade_dominance:0 "Channel Trade Dominance"
 centralization_effort:0 "Centralization Effort"
 seine_dominance:0 "Dominance of the Crossings"
 parisii_mercenary_guard:0 "Hired Guard of the Sekuana"
 parisii_gallic_allies_tt:0 "Have an alliance or defensive league with at least §Y2§! independent Gallic nations."
 parisii_hegemony_task:0 "Hegemony of Central Galia"
 parisii_hegemony_task_DESC:0 "Alliances are fragile. To truly secure our borders, we must bring our neighbors into our fold as formal client states and tribal vassals."
 parisii_gallic_hegemony_tt:0 "Have at least §Y2§! Gallic subjects."
 armorican_gateway_task:0 "The Aremorican Gateway"
 armorican_gateway_task_DESC:0 "To the west lies the Aremorican coast. We must either peacefully integrate our trade routes with their seafarers, or build our own fleet and take the coastline by force."
 armorican_gateway_peace_tt:0 "§YPeaceful Integration:§! Form an alliance with an Aremorican nation and maintain high relations."
 armorican_gateway_hostile_tt:0 "§YNaval Dominance:§! Control the Aremorican coast directly and field a fleet of at least 15 ships."
 gallic_trade_hub_task:0 "The Gallic Hub"
 gallic_trade_hub_task_DESC:0 "Let the Arverni and the Belkai slaughter each other in the mud. Lutotetion will remain a neutral sanctuary of commerce. With our treasury overflowing, we can simply hire their wayward warriors to defend our walls."
 channel_trade_ties_task:0 "Cross-Channel Ties"