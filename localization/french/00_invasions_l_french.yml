l_french:

 invasions_1_title:0 "La Horde des Xiongnu"
 invasions_1_desc:0 "Dans les terres lointaines des steppes orientales, une confédération tribale connue sous le nom de Xiongnu, sous leur chef Chanyu Modun, a subjugué les tribus majoritaires au-delà des montagnes de l'Altaï. On commence à craindre que le regard de Chanyu se fixe plus au sud et à l'ouest."
 invasions_1.a:0 "Cela augure mal'..."

 invasions_2_title:0 "La migration Wusun"
 invasions_2_desc:0 "Les Wusun, une tribu des steppes de langue iranienne avec des racines dans le Gansu, ont été pendant des siècles humiliés et vaincus par leurs cousins, les Yuezhi. Les Wusun ont été forcés de devenir des sujets du chef xiongnu Chanyu Modun pour se protéger, vivant sur les terres des Xiongnu et attendant leur heure pour se venger des Yuezhi. Maintenant que les Yuezhi ont été anéantis par la Confédération xiongnue et les Wusun, il est temps de réinstaller notre peuple dans les terres fertiles de la vallée d'Ili, la direction dans laquelle les Yuezhi restants ont fui. Le Grand Chanyu nous aidera dans notre conquête."
 invasions_2_warning_desc : "Mon [ROOT.GetCountry.GetRulerTitle], des marchands venus de l'est rapportent que des cavaliers inconnus se rassemblent au-delà des cols de montagne. Ils se font appeler #E Wusun#! et voyagent non seulement avec des guerriers, mais aussi avec des enfants, des chariots et des troupeaux s'étendant à perte de vue.\n\nLeurs éclaireurs ont déjà été aperçus le long des routes menant vers le nord. Si ces rapports sont exacts, ils ne sont pas à la recherche de butin — ils cherchent une nouvelle patrie, et ils s'attendent à la trouver de notre côté de la frontière."
 invasions_2.a: "Alors chaque col devra être surveillé."
 invasions_2_invasion.a: "Nous détruirons ces barbares !"
 invasions_2.b: "Nous détruirons ces [ROOT.GetCountry.GetAdjective]s!"
 invasions_2_switch_tt: "#T Nous changerons de patrie et jouerons la horde#! #G Wusun#!#!"
 invasions_2_tooltip: "La tribu de #Y [wusun_country_scope.GetName]#! déclare la guerre à #Y [wusun_invasion_defender.GetName]#! avec l'objectif de guerre #Y Conquête de la Horde# !."

 invasions_3_title:0 "Arrivée des Yuezhis"
 invasions_3_desc:0 "La guerre fait rage au-delà du bassin du Tarim entre les puissantes confédérations yuezhie et xiongnue. Les réfugiés de la steppe orientale arrivent en masse en Sogdiane et dans la vallée de l'Ili."
 invasions_3.a:0 "Combien peut-il encore y en avoir ?"
 invasions_3_tooltip:0 "Une importante population de culture #Y yuezhie# ! apparaîtra dans le bassin du Tarim"

 invasions_4_title:0 "Les Yuezhis"
 invasions_4_desc:0 "Au cours des derniers mois, de grandes groupes de tribus #E Yuezhi#! de la steppe se sont installés au sein de [ROOT.GetCountry.GetName]. Au début, les nombres étaient faibles, mais ils ont été en augmentation constante, et apparemment pendant une nuit, des parties de notre pays ont été occupées par ces nomades.\n\nChaque fois que notre peuple a essayé d'approcher leurs camps, ils ont été accueillis par une indifférence glaçante, voire par une hostilité ouverte. Les Yuezhi sont un peuple fier, et ils ne seront pas satisfaits de simplement traverser nos terres. Ils commenceront finalement à exiger des choses de nous, et si nous refusons, ils les prendront par la force."
 invasions_4.a:0 "Adopter la culture yuezhie"
 invasions_4.b:0 "Combattez-les"
 invasions_4_tooltip:0 "Accédez à l'objectif de guerre #Y Conquête de la Horde# ! pendant 25 ans \nJusqu'à #Y 50# ! pops adopteront la culture yuzehi."

 invasions_5_title:0 "Invasion yuezhie"
 invasions_5_desc:0 "La puissante confédération yuezhie, qui a dominé le sud de la Mongolie et le Gansu pendant des siècles, a été écrasée par le parvenu Chanyu Modun et sa confédération xiongnue en plein essor, avec l'aide de leur vieil ennemi le Wusun, en 176 avant notre ère. Le gros des Yuezhi a fui à l'ouest vers la vallée d'Ili et la Sogdiane pour échapper à la menace du puissant Chanyu, quitte à combattre pour cela les Saces, les Sogdiens et les Ioniens."
 invasions_5_warning_desc: "Nous recevons des rapports inquiétants sur de vastes migrations tribales sur la steppe. Bien que cela soit impossible à vérifier, on dit que des clans entiers avancent lentement mais sûrement vers notre direction, accompagnés de groupes de guerriers et de troupeaux géants qui défient toute description.\n\nSi ces histoires sont vraies, ces barbares devraient traverser la frontière dans l'année à venir - nous devrions nous préparer au pire."
 invasions_5_warning.a: "Ne me parlez pas de rumeurs infondées..."
 
 invasions_5.b: "Je vais mener les Yuezhis vers un nouveau foyer."
 invasions_5_switch_tt: "Nous allons quitter notre pays actuel et continuer à jouer comme la horde #Y yuezhi#! envahissante."
 invasions_5_tooltip: "La tribu de #Y [yuezhi_country_scope.GetName]#! déclare la guerre à #Y [yuezhi_invasion_defender.GetName]#! avec l'objectif de guerre #Y Conquête de la Horde# !."

 invasions_6_title:0 "La horde sace"
 invasions_6_desc:0 "L'horizon du nord a disparu dans un nuage de poussière. Au-delà de la frontière, les #E Saces#! arrivent, ayant pris des provinces dans notre arrière-pays et déclaré la guerre contre nous. [ROOT.GetCountry.GetRuler.GetName] a tenté d'envoyer des ambassades pour demander la paix, mais nos diplomates ont été assassinés par les sauvages à sang-froid.\n\nDes hommes désespérés peuvent être convaincus, mais un peuple désespéré ne peut pas être détourné par des mots - une leçon douloureuse que le [ROOT.GetCountry.GetRulerTitle] n'oubliera jamais. Les Sakas sont venus pour creuser un foyer en s'appropriant nos riches vallées et villes, et nous devons les affronter avec arc et épée."
invasions_6_warning_desc: "Mon roi, des feux sont apparus dans les collines au nord, d'abord quelques dizaines,  puis des centaines, puis plus que n'importe quel homme pourrait espérer compter. Les réfugiés du nord jurent que ces tribus, les #E Saces#!, ont abandonné leurs anciennes terres de pâturage et transportent leurs ménages et leurs biens vers le sud.\n\nLes nouvelles de la frontière étaient déjà sombres. Des cavaliers saces ont été vus en train de fouiller chaque gué et chemin de montagne menant à nos terres. Ils ne chevauchent pas comme des pillards à la recherche d'un prix facile - ils chevauchent comme des hommes qui n'ont nulle part où aller et qui sondent nos défenses."
 invasions_6.a:0 "Cela ne peut pas être bon..."
 invasions_6_invasion.a: "Nous allons les écraser et les renvoyer dans les steppes !"
 invasions_6.b: "Je vais chevaucher vers le sud avec les Sacess..."
 invasions_6_switch_tt: "#T Jouer en tant que horde ! #G Saka#! #T.#!"
 invasions_6_tooltip:0 "La tribu de #Y [sakia_country_scope.GetName]# ! déclare la guerre à #Y [sakia_invasion_defender.GetName]# ! avec le but de guerre #Y Conquête de la Horde# !."

 #invasions_7_title:0 "The Rise of Parthia"
 #invasions_7_desc:0 ""
 #invasions_7.a:0 "We're Doomed!"

 invasions_8_title:0 "Invasion yuezhie de la Bactriane"
 invasions_8_desc:0 "Alors que les Yuezhi pensaient avoir échappé aux Xiongnu, les Wusun, fidèles vassaux des Xiongnu (et notre ancien sujet), ont "reçu" des terres de la vallée d'Ili de la part du chef xiongnu Chanyu Modun. Les forces combinées de la Confédération des Xiongnu et des Wusun sont bien trop importantes pour que nous puissions espérer les vaincre, et nous devons fuir à nouveau ; cette fois vers le sud et les terres de Bactriane gouvernées par les Grecs. Coupée du reste du monde hellénique, cette région est mûre pour la conquête. Les Yuezhi subjugueront les villes de Bactriane, prendront leurs richesses et, surtout, ils resteront à l'abri de la menace xiongnue."
 invasions_8_warning_desc: "Les messagers des satrapies du nord apportent de graves nouvelles. Les #E Yuezhi#! ont été chassés de la vallée d'Ili, et leurs bandes dispersées se rassemblent à nouveau — cette fois le long des routes descendant vers la #E Bactriane#!.\n\nNos espions rapportent avoir vu des patrouilles montées tester les cols élevés. Ce ne sont pas les préparatifs de réfugiés demandant le passage... bien au contraire. Dans l'année, le poids total de leur migration pourrait s'abattre sur nous."
 invasions_8.a: "La Bactriane ne sera pas leur refuge tant que je serai [ROOT.GetCountry.GetRulerTitle]!"
 invasions_8_A_tooltip:0 "La tribu de #Y [yuezhi_country_scope_2.GetName]# ! déclare la guerre à #Y [yuezhi_bactria_invasion_defender.GetName]# ! avec le but de guerre #Y Conquête de la Horde# !."
 invasions_8_B_tooltip:0 "La tribu de #Y [yuezhi_country_scope.GetName]# ! déclare la guerre à #Y [yuezhi_bactria_invasion_defender.GetName]# ! avec le but de guerre #Y Conquête de la Horde# !."

