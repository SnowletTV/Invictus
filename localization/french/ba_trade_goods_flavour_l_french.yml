 cattle_escaped_tt:0 "Sans bétail, il faudra des années avant qu'il y ait de nouveaux bergers avec des troupeaux en [SCOPE.sP('cattle_farm_scope').GetName]."
 tyrian_purple_ownership_tt:0 "If we #G gain#! ownership over [GetProvince('(int32)3982').GetName], we will get following modifier for controlling the origin of the dye."
 tyrian_purple_ownership_loss_prevention_tt:0 "If we #R lose#! control over [GetProvince('(int32)3982').GetName], we will #R lose#! the following modifier."
 
 # Treasures
 bronze_helmet_treasure:0 "Casque de bronze" #since it can't be 100% the same as the bronze armour from lapis_trade.17
 bronze_helmet_treasure_desc:0 "Un casque entièrement réalisé en bronze, une pièce révolutionnaire."
 cypriot_dwarf_elephant_bones:0 "Gros os chypriotes"
 cypriot_dwarf_elephant_bones_desc:0 "Trouvés à Chypre, ces gros os peuvent sembler familiers à quelqu'un qui a vu un éléphant. Tout le monde pense cependant qu'ils sont les os d'un dieu mort...\nLes éléphants nains chypriotes se sont éteints il y a des milliers d'années, mais leurs os nous fascinent encore aujourd'hui." #there were also dwarf hippos. I didn't include them, too lazy.
 bronze_jewelry:0 "Bijoux en bronze"
 bronze_jewelry_desc:0 "Bijoux en bronze dédié à une déesse."
 censer_treasure:0 "Encensoir orné de bijoux"
 censer_treasure_desc:0 "Un encensoir fait pour l'Encens et la Myrrhe."
 obsidian_statue:0 "Statue d'obsidienne"
 obsidian_statue_desc:0 "Une statue taillée dans l'obsidienne représentant une divinité."
 ivory_carving:0 "Magnifique sculpture en ivoire"
 ivory_carving_desc:0 "Une défense d'éléphant sculptée par un maître, représentant la création du monde."
 ivory_throne:0 "Trône en ivoire"
 ivory_throne_desc:0 "Un trône en ivoire sculpté et en bois rare. Il va sûrement impressionner."
 elephant_hunt_reward:0 "Défense d'éléphant"
 elephant_hunt_reward_desc:0 "Un trophée d'une chasse à l'éléphant."
 stag_hunt_reward:0 "Bois de cerf"
 stag_hunt_reward_desc:0 "Des bois de cerf, trophée d'une chasse des années passées."
 boar_hunt_reward:0 "Peau de sanglier"
 boar_hunt_reward_desc:0 "La peau d'un sanglier tué lors d'une chasse."
 lion_hunt_reward:0 "Peau de lion"
 lion_hunt_reward_desc:0 "Voici la peau d’un lion qui a été chassé par un noble ou par quelqu’un d’autre."
 bear_hunt_reward:0 "Griffes d'ours"
 bear_hunt_reward_desc:0 "Ce sont les griffes d’un ours qui a été chassé par un noble quelconque."
 nemean_lion_pelt:0 "Peau du lion de Némée"
 nemean_lion_pelt_desc:0 "Cette peau de lion dorée est insensible aux armes mortelles ; il a été tué par Héraclès."
 erymanthian_boar_tusk:0 "Défense du sanglier d'Érymanthe"
 erymanthian_boar_tusk_desc:0 "Ce sanglier a terrorisé la ville d'Érymanthe jusqu'à ce qu'il soit tué par Héraclès."
 tar_pit_bones_3:0 "Os d'un dieu mort"
 tar_pit_bones_3_desc:0 "Trouvé dans une fosse à goudron, cet os géant doit être la jambe d'une divinité morte depuis longtemps, tuée par un rival."
 tar_pit_bones_2:0 "Dent de Tiamat"
 tar_pit_bones_2_desc:0 "Trouvée dans une fosse à goudron, ce doit être une dent de Tiamat, perdue lors de son combat avec Gilgamesh."
 tar_pit_bones_1:0 "Os de Géant"
 tar_pit_bones_1_desc:0 "Cet énorme os ne peut être celui d'aucun être du monde des mortels vivant aujourd'hui. Ça doit être celui d'un géant."
 tar_pit_bones_4:0 "Dent de Yam"
 tar_pit_bones_4_desc:0 "Une énorme dent, trouvée dans une fosse à goudron. Beaucoup pensent qu'il s'agit d'une dent de Yam qu'il a perdue en combattant Baal."
 
 # Events
 trade_goods_flavour.1.t: "Une affaire en étain"
 trade_goods_flavour.1.desc: "Nous avons d'heureuses nouvelles pour vous, [ROOT.GetCountry.GetRuler.GetName] - c'est assez rare ces derniers temps. Apparemment, nous avons mis la main sur une belle quantité d'étain. Devrions-nous le vendre pour un profit ou l'utiliser nos propres fonderies?" #extra tin - sell or use ourselves as bronze
 trade_goods_flavour.1.a: "Vendez-le."
 trade_goods_flavour.1.b: "Employons-le nous-mêmes."
 
 trade_goods_flavour.2.t: "Une cargaison supplémentaire d'étain"
 trade_goods_flavour.2.desc: "Nos marchands nous informent qu'il y a des réserves supplémentaires d'étain à vendre, nouvelle qui nous réjouit fort. Nous en acquerrons assurément autant que possible." #extra tin - sold by importer (on map owner); you can only use it
 trade_goods_flavour.2.a: "Nous en ferons bon usage."
 
 trade_goods_flavour.3.t: "Le maître artisan" #it's 95% the same event as lapis_trade.17 tbh, so I copied loc there
 trade_goods_flavour.3.desc: "Nous avons ouï dire qu'un maître forgeron, vieux sage de l'art du métal, voyage dans la région, et la rumeur veut qu'il séjourne quelques jours à [ROOT.GetCountry.GetCapital.GetName]. Une telle occasion ne saurait être négligée ! Nous pourrions voir ce que l'artisan propose à la vente, ou s'il consentirait à prodiguer quelque conseil à nos propres artisans. Peut-être souhaiterait-il même demeurer parmi nous ? Nous n'en saurons rien tant que nous ne l'aurons point interrogé."
 trade_goods_flavour.3.a: "Achetons le casque."
 trade_goods_flavour.3.b: "Invitons-le à notre cour."
 trade_goods_flavour.3.c: "Demandons conseil au maître."
 trade_goods_flavour.3.d: "Prenons le casque par la force." #cruel required
 
 trade_goods_flavour.4.t: "De grands ossements découverts"
 trade_goods_flavour.4.desc: "Nous avons une curieuse histoire à vous conter, [ROOT.GetCountry.GetRuler.GetName], qui se répand dans [ROOT.GetCountry.GetCapital.GetName] et chatouille l'oreille de quiconque s'arrête pour l'écouter.\n\nDes ouvriers extrayaient du cuivre et d'autres métaux dans les montagnes lorsqu'ils découvrirent de gigantesques ossements, plus grands que tout ce que nous ayons jamais vu. Bien qu'effrayés, les hommes poursuivirent leurs fouilles et trouvèrent un crâne colossal. À quelle bête terrifiante ces ossements appartenaient-ils ? Des monstres ou des dragons vivaient-ils jadis dans ce pays ?\n\nAussi divertissante que soit cette histoire, nous devrions probablement intervenir à un moment ou à un autre." #bones of capriot dwarf elephants found, local have no idea what they are
 trade_goods_flavour.4.a: "Il y en a peut-être d'autres ? Dites aux hommes de poursuivre les fouilles."
 trade_goods_flavour.4.b: "Vendez les ossements ! Nous en tirerons quelque chose."
 trade_goods_flavour.4.c: "C'est perdre son temps que d'en parler davantage."
 
 trade_goods_flavour.5.t: "Résultats des fouilles des grands ossements"
 trade_goods_flavour.5.desc: "Après quelques semaines d'un labeur éreintant sous le soleil impitoyable [ROOT.GetCountry.GetAdjective], nos ouvriers ont annoncé avoir découvert le squelette entier d'une bête magnifique, peut-être même les os d'un dieu défunt ? Nos esprits les plus avisés demeurent perplexes face à cette découverte et avouent penauds ignorer ce que nous avons sous les yeux.\n\nCe n'est certes pas aussi exaltant que de découvrir des métaux précieux, mais le moment n'en demeure pas moins intéressant." #still no idea. maybe they are bones of dead gods?
 trade_goods_flavour.5.a: "Intéressant..."
 trade_goods_flavour.5.b: "Quel gaspillage de temps et d'argent..."
 
 trade_goods_flavour.6.t: "Les cèdres de Chypre"
 trade_goods_flavour.6.desc: "Nos éclaireurs rapportent que les #E Phéniciens#! débarquent leurs navires marchands sur les côtes ; il semble qu'ils recherchent des sources de bois, et le cèdre qui pousse en abondance près de #E Chypre#! les attire comme des mouches vers le miel.\n\nNous pourrions bien sûr dépêcher quelques marchands afin de voir si les Phéniciens accepteraient de commercer avec nous. Nous pourrions prendre le bois et construire aussitôt des navires, ou bien le mettre en réserve pour les jours de pluie... le choix revient à [ROOT.GetCountry.GetRuler.GetName]." #phoenicians arriving in cyprus to find cedars. do we use them for new ships? or do we breed them for more ships in the future?
 trade_goods_flavour.6.a: "Construisez les navires dès maintenant !"
 trade_goods_flavour.6.b: "Assurons-nous un approvisionnement futur en bois."
 
 trade_goods_flavour.7.t: "Les cèdres de Chypre"
 trade_goods_flavour.7.desc: "Des marchands accourent de tout le Grand Vert jusqu'à notre île, dans l'espoir d'emporter une part du bois de cèdre qui pousse sur nos rivages ; mais nous pouvons difficilement les en blâmer. Le cèdre est un bois magnifique, résistant à la pourriture, et possède donc d'excellentes applications militaires, notamment pour la construction navale. Comprenant la valeur de cette denrée, nous devrions décider de son usage." #as Cyprus, you find the cedars of Lebanon; otherwise the same as event 6
 trade_goods_flavour.7.a: "Construisez les navires dès maintenant !"
 trade_goods_flavour.7.b: "Assurons-nous un approvisionnement futur en bois."
 
 trade_goods_flavour.8.t: "Armes de bronze expérimentales"
 trade_goods_flavour.8.desc: "Un forgeron de [ROOT.GetCountry.GetCapital.GetName] prétend avoir réalisé une percée dans l'art de concevoir des armes. Affirmant avoir expérimenté divers alliages, cet artisan croit avoir créé un bronze plus solide, capable de trancher l'armure ennemie sans ébrécher la lame ; une vantardise qui a rendu [ROOT.GetCountry.GetRuler.GetName] incrédule, mais intrigué.\n\nNous pourrions lui demander de fabriquer quelques-unes de ces armes pour notre armée, mais le prix en sera élevé." #Smith offers to create some experimental bronze weaponry for some of your troops
 trade_goods_flavour.8.a: "Équipez le corps principal de nos troupes."
 trade_goods_flavour.8.b: "Équipez les tirailleurs."
 trade_goods_flavour.8.c: "Rendez les chars plus meurtriers encore."
 trade_goods_flavour.8.d: "Hélas, nous ne pouvons nous offrir vos services."
 
 trade_goods_flavour.9.t: "Mieux vaut demander le pardon qu'une permission"
 trade_goods_flavour.9.desc: "Un jour, [ROOT.GetCountry.GetRuler.GetName] prend son déjeuner avec [ROOT.GetCountry.GetConsort.GetName] lorsqu'il remarque un collier de bronze ouvragé autour du cou de [ROOT.GetCountry.GetConsort.GetFirstName]. C'est véritablement un chef-d'œuvre ; serti de perles, de rubis et de lamelles de lapis-lazuli, le collier brille comme le feu sous le soleil matinal.\n\n« Voilà une bien jolie parure, [ROOT.GetCountry.GetConsort.GetFirstName], mais je ne l'avais jamais vue auparavant... d'où vient-elle ? »\n\nLe visage de [ROOT.GetCountry.GetConsort.GetFirstName] s'empourpre aussitôt et elle commence à balbutier. « Oh, cette p-petite chose ? Je l'ai f-fait faire... ce n'est qu'un b-bibelot. »\n\n« Un simple bibelot ? La quantité de pierres précieuses qu'il contient suffirait à nourrir une cité entière pendant un an. Combien a-t-il coûté ?! »\n\n[ROOT.GetCountry.GetConsort.GetFirstName] refuse de répondre et détourne la tête. « Laissez-moi le garder... je n'achèterai plus rien dans votre dos. »" #consort (i.e. wife) ordered some jewels... you didn't know about it
 trade_goods_flavour.9.a: "Laissez-la se faire plaisir."
 trade_goods_flavour.9.b: "Consacrez-le à une divinité."
 trade_goods_flavour.9.c: "Revendez-le."
 
 trade_goods_flavour.10.t: "Merveilleux silphium"
 trade_goods_flavour.10.desc: "Vraiment, le #E silphium#! est une plante merveilleuse. Il peut être utilisé pour stimuler l'appétit, comme épice, comme aphrodisiaque, comme abortif, comme médicament... Y a-t-il un seul usage pour lequel cette plante ne s'illustre pas ?\n\nNous avons trouvé du silphium sauvage en grandes quantités, mais nous devons encore décider qu'en faire." #read in script
 trade_goods_flavour.10.a: "Utilisons-le nous-mêmes."
 trade_goods_flavour.10.b: "Laissons les choses en état."
 trade_goods_flavour.10.c: "Vendez-en plus !"
 
 trade_goods_flavour.11.t: "Le bon silphium"
 trade_goods_flavour.11.desc: "En ce jour, nous célébrons nos récents succès. Notre maître cuisinier a préparé des plats merveilleux, tous sentant meilleur les uns que les autres. Juste avant le service, il s'approche de nous et nous demande quel plat doit être agrémenté du rare et précieux silphium. Doit-ce être le plat principal ? Ou peut-être faut-il préparer un dessert ? Ou une collation après les prières ?"
 trade_goods_flavour.11.a: "Un bon rôti !"
 trade_goods_flavour.11.b: "Une petite soupelette !"
 trade_goods_flavour.11.c: "Un goûter sucré."
 trade_goods_flavour.11.d: "Rapide et léger, je vais au temple ensuite."
 
 trade_goods_flavour.12.t: "Silphium thérapeutique"
 trade_goods_flavour.12.desc: "La consommation accrue de #E Silphium#! a rendu le couple royal plus résistant aux maladies. Les petites symptômes quotidiens dont ils souffraient parfois ne surviennent plus. Vraiment, le silphium est une plante merveilleuse."
 trade_goods_flavour.12.a: "Une plante fort utile."
 
 trade_goods_flavour.13.t: "Culture du sylphium"
 trade_goods_flavour.13.desc: "À [silphium_farm.GetName], certains agriculteurs ont commencé à exploiter le #E silphium#! de manière plus systématique. Jusqu'à présent, ils ont eu de bons résultats et la merveilleuse plante parvient à pousser dans la plupart des environnements qu'ils ont expérimenté. Il semble qu'elle se débrouille mieux loin tant des côtes que du désert.\nLa question suivante se pose : devrions-nous étendre les opérations de cette ferme ou créer plus de fermes sur ce modèle ?" #Silphium farming grows on a farm. silphium_farm is a province scope
 trade_goods_flavour.13.a: "Agrandissez l'exploitation."
 trade_goods_flavour.13.b: "Disséminez la plante."
 trade_goods_flavour.13.c: "Nous ne devrions pas surexploiter la zone."
 
 trade_goods_flavour.14.t: "Surexploitation du sylphium"
 trade_goods_flavour.14.desc: "À cause de la surexploitation du #E silphium#! à [silphium_farm.GetName], la plante est devenue plus rare dans la région. La récolte n'est plus possible, et c'est tout un secteur qui s'effondre.\nNous ne pouvons plus qu'espérer que, dans le futur, de nouvelles plantes sauvages viennent coloniser la région." #Silphium farming goes too far; single territory loses Silphium (above event can restore it though....) same province scope as above
 trade_goods_flavour.14.a: "Malheur !"
 
 trade_goods_flavour.15.t: "Planches de cèdre"
 trade_goods_flavour.15.desc: "Une abondance de #E cèdres#! a vu une nette amélioration de la qualité de nos navires. Ce bois est parfaitement adapté à la construction navale du fait de son étanchéité naturelle, de sa résistance au pourrissement et de sa facilité de traitement." #gain navy modifier from having enough cedar provinces
 trade_goods_flavour.15.a: "Bonne nouvelle !"
 
 trade_goods_flavour.16.t: "Navires de cèdre"
 trade_goods_flavour.16.desc: "La raréfaction des #E cèdres#! a rendu plus difficile la production de vaisseaux de qualité, notamment au sein de nos forces. Ce bois supérieur nous fait gravement défaut dans la construction ou la réparation de navires. Espérons que nous trouverons de nouvelles sources sous peu !" #lose the modifier bcs not enough cedar owned
 trade_goods_flavour.16.a: "Disaster!"
 
 trade_goods_flavour.17.t: "Exploitation du cèdre"
 trade_goods_flavour.17.desc: "Le bois de cèdre a de nombreux usages, mais le plus fameux est la construction navale. Depuis peu, un débat agite la cour sur la manière d'approcher l'exploitation et l'utilisation des forêts de cèdres. Certains proposent une augmentation des abattages pour construire une plus grande flotte aussitôt que possible, et nous donner ainsi un avantage sur nos rivaux. D'autres soutiennent cette idée, mais préviennent contre les risques de surexploiter la forêt. Enfin, certains défendent une attitude plus pacifiste à l'égard de nos voisins : soit ils craignent leur réaction si nous construisons une flotte trop puissante, soit ils ont des intérêts dans d'autres secteurs et ne souhaitent pas se faire écraser par ceux qui contrôlent le cèdre." #Exploit cedars for short-term gain. first option (not always available) kills a cedar forest, i.e. changes trade goods in a province
 trade_goods_flavour.17.a: "Prenez autant de bois que possible dès maintenant."
 trade_goods_flavour.17.b: "Préservez quelques zones pour le futur."
 trade_goods_flavour.17.c: "N'augmentez pas la production."
 
 trade_goods_flavour.18.t: "La repousse des cèdres"
 trade_goods_flavour.18.desc: "L'on a de nouveau aperçu quelques cèdres germer en [cedar_regrown.GetName]. Après que tous les arbres eurent été abattus voilà des années, nul ne s'attendait à revoir ces arbres vigoureux dans la contrée. Assurément, les dieux doivent nous être favorables."
 trade_goods_flavour.18.a: "C'est une heureuse nouvelle."
 
 trade_goods_flavour.19.t: "Un grand arsenal maritime"
 trade_goods_flavour.19.desc: "Voilà bien des années que nous construisons des navires. L'un de nos plus grands arsenaux se trouve en [main_shipyard_prov.GetName], où d'innombrables bâtiments ont été construits. Récemment, les arsenaux et le port ont été agrandis afin de satisfaire la demande toujours croissante de navires de nos marchands et de notre flotte. Un émissaire de [main_shipyard_prov.GetName] nous a rejoints, demandant si l'agrandissement du grand arsenal devait servir à produire autant de navires que possible, ou si chaque bâtiment devait être façonné avec soin."
 trade_goods_flavour.19.a: "Construisons autant de navires que possible."
 trade_goods_flavour.19.b: "Un meilleur navire mérite qu'on y consacre le temps requis."
 
 trade_goods_flavour.20.t: "Une abondance de bois"
 trade_goods_flavour.20.desc: "Notre grande flotte s'accroît chaque année grâce à l'abondance du bois dans notre royaume. Cet accroissement de notre savoir-faire et de nos ressources disponibles a rendu la construction des navires plus aisées que jamais. Tant que nous pourrons maintenir cette production de bois, nul ne pourra ignorer notre puissance sur les mers."
 trade_goods_flavour.20.a: "[ROOT.GetCountry.GetName] régnera sur les flots."
 
 trade_goods_flavour.21.t: "Une pénurie de bois"
 trade_goods_flavour.21.desc: "Les forêts et les bois ayant récemment été ravagés tant par l'homme que par la nature, nos anciennes méthodes rigoureuses pour maintenir notre flotte en parfait état ne sont plus possibles, faute de ressources. Si nous acquérions de nouvelles terres boisées, nous pourrions peut-être rétablir le programme à l'échelle du royaume."
 trade_goods_flavour.21.a: "Nous devons remédier à cette pénurie."
 
 trade_goods_flavour.22.t: "Une forêt abattue"
 trade_goods_flavour.22.desc: "L'accroissement constant du nombre d'habitants en [wood_city_scope.GetName] a rendu les arbres rares dans la contrée, ceux-ci ayant été employés pour la construction et l'exportation. Bien qu'il subsiste encore quelques arbres çà et là, la contrée n'est plus en mesure de subvenir à ses besoins par l'exportation de bois. Du moins, de nouvelles perspectives se sont ouvertes à la population locale."
 trade_goods_flavour.22.a: "Puissions-nous ne pas avoir à le regretter."
 
 trade_goods_flavour.23.t: "La culture de la bière"
 trade_goods_flavour.23.desc: "La boisson dorée fermentée à partir de grains s'est répandue et est devenue populaire en [beer_city_scope.GetName], chaque habitant y ayant goûté au moins une fois. Il est désormais courant que les ouvriers se réunissent le soir dans les tavernes, un verre de cette boisson fraîche devant eux, pour parler des événements du jour et de leur vie. La bière est devenue ici un mode de vie."
 trade_goods_flavour.23.a: "Nous honorerons Ninkasi."
 trade_goods_flavour.23.b: "Nous honorerons les dieux."
 trade_goods_flavour.23.c: "Nous la soutiendrons."
 trade_goods_flavour.23.d: "Cela finira par passer."
 
 trade_goods_flavour.24.t: "Une brasserie de bière ?"
 trade_goods_flavour.24.desc: "La bière devenant toujours plus commune, la demande a considérablement augmenté, et nombreux sont ceux qui, ayant goûté à la boisson divine, ne peuvent plus s'en passer ; certains pourraient même être qualifiés de dépendants, bien qu'ils soient minoritaires. Un riche tavernier de [beer_city_scope.GetName] nous a sollicités dans l'espoir d'ouvrir une brasserie, afin d'accroître ses revenus. Bien que la dépense ne soit point négligeable, nous devons maintenir notre population dans la joie de l'ivresse."
 trade_goods_flavour.24.a: "Au nom de Ninkasi, qu'il en soit ainsi."
 trade_goods_flavour.24.b: "Au nom des dieux."
 trade_goods_flavour.24.c: "Une brasserie nous sera utile."
 trade_goods_flavour.24.d: "Ce serait gaspiller notre argent."
 
 trade_goods_flavour.25.t: "Une culture nationale de la bière ?"
 trade_goods_flavour.25.desc: "La culture locale de la bière de [beer_city_scope.GetName] a commencé à se répandre dans les territoires voisins, chacun appréciant la boisson et les soirées paisibles à la taverne, un verre de bière fraîche à la main après une rude journée de labeur. Il faut toutefois considérer que beaucoup ont perdu le goût du combat, préférant se remémorer le passé ou s'adonner aux plaisirs de la chair.\nHélas, un nouveau phénomène s'est également de plus en plus répandu : les plus grands consommateurs de cette boisson céleste s'enivrent. Désirons-nous vraiment voir pareil comportement se répandre dans tout notre royaume ?"
 trade_goods_flavour.25.a: "Qu'elle se répande !"
 trade_goods_flavour.25.b: "Je ne puis tolérer que notre royaume devienne celui des ivrognes !"
 
 trade_goods_flavour.26.t: "La culture de la bière : nationale ou locale"
 trade_goods_flavour.26.desc: "Depuis que la bière est devenue un aspect central de la culture, une nouvelle question s'est posée : la manière de célébrer cette boisson divine doit-elle être réglementée par la famille royale et le sacerdoce, ou les villes et les bourgs doivent-ils pouvoir développer librement leur propre façon de vivre avec la bière ? La réponse influera sur l'avenir de notre nation, quoique peut-être à la marge, puisque cette boisson rend tous les hommes heureux !"
 trade_goods_flavour.26.a: "Tous suivront la norme royale !"
 trade_goods_flavour.26.b: "Que chaque cité ait sa propre culture de la bière."
 
 # 27 is hidden
 
 trade_goods_flavour.28.t: "La culture de la bière : crise"
 trade_goods_flavour.28.desc: "Mon [ROOT.GetCountry.GetRulerTitle], une tragédie s'est abattue sur notre nation : il n'y a pas assez de bière pour tous ! Notre culture ne peut être célébrée comme à l'accoutumée. Le seul moyen de remédier à cette pénurie serait de bâtir bien davantage de brasseries et de consacrer une grande part des récoltes excédentaires à la fabrication de bière, ce qui coûterait démesurément cher. \nCertains de nos conseillers suggèrent toutefois de concentrer l'approvisionnement sur les seuls centres urbains densément peuplés, en délaissant les vastes campagnes."
 trade_goods_flavour.28.a: "Bâtissons des brasseries. Il nous faut davantage de bière !"
 trade_goods_flavour.28.b: "Concentrons-nous sur les cités."
 
 trade_goods_flavour.29.t: "La culture du vin"
 trade_goods_flavour.29.desc: "La boisson divine fermentée à partir de raisins s'est répandue et est devenue populaire en [wine_city_scope.GetName], chaque habitant y ayant goûté au moins une fois. Il est désormais courant que les ouvriers se réunissent le soir dans les débits, un verre devant eux, pour parler des événements du jour et de leur vie. Le vin est devenu ici un mode de vie."
 trade_goods_flavour.29.a: "Nous le soutiendrons."
 trade_goods_flavour.29.b: "Cela finira par passer."
 
 trade_goods_flavour.30.t: "Innovation religieuse : les brûle-parfums"
 trade_goods_flavour.30.desc: "Depuis que la #E myrrhe#! et l'#E encens#! sont couramment employés dans nos temples et nos cérémonies, certains ont trouvé une nouvelle manière de répandre ces senteurs célestes. Grâce à un instrument appelé « brûle-parfum », les senteurs peuvent être diffusées bien plus aisément et rapidement qu'au moyen d'une coupelle."
 trade_goods_flavour.30.a: "Merveilleux."
 
 trade_goods_flavour.31.t: "Porteur honoraire du brûle-parfum"
 trade_goods_flavour.31.desc: "Avec l'essor du brûle-parfum, le grand prêtre [SCOPE.sChar('censer_bearer_scope').GetName] a affirmé que [SCOPE.sChar('censer_bearer_scope').GetSheHe] était le seul à devoir être autorisé à l'employer lors des cérémonies royales et des affaires d'État. Certains membres de la famille de [ROOT.GetCountry.GetRuler.GetName] s'en sont indignés, et [SCOPE.sChar('family_censer_bearer_scope').GetName] affirme notamment qu'en tant que parents de la maison royale, ils ont eux aussi le droit de porter le brûle-parfum. \nQuoi qu'il en soit, quelle que soit la personne choisie comme porteur honoraire du brûle-parfum, il ne peut y en avoir qu'une."
 trade_goods_flavour.31.a: "Le grand prêtre est le seul choix légitime."
 trade_goods_flavour.31.b: "Quelqu'un de la famille royale serait le choix le plus sensé."
 
 trade_goods_flavour.32.t: "La propagation des arbres à encens"
 trade_goods_flavour.32.desc: "De jeunes arbres à encens ont poussé dans certaines de nos possessions. L'un de nos conseillers a suggéré d'en planter quelques-uns en [incense_spread_scope.GetName], affirmant que l'accroissement de la production profiterait grandement à notre commerce. Nous pourrions aussi simplement vendre le surplus de jeunes plants ; quelqu'un d'autre pourrait leur trouver quelque utilité."
 trade_goods_flavour.32.a: "Qu'il en soit fait ainsi."
 trade_goods_flavour.32.b: "Vendons le surplus."
 
 trade_goods_flavour.33.t: "La propagation des buissons de myrrhe"
 trade_goods_flavour.33.desc: "De jeunes buissons de myrrhe ont poussé dans certaines de nos possessions. L'un de nos conseillers a suggéré d'en planter quelques-uns en [myrrh_spread_scope.GetName], affirmant que l'accroissement de la production profiterait grandement à notre commerce. Nous pourrions aussi simplement vendre le surplus de jeunes plants ; quelqu'un d'autre pourrait leur trouver quelque utilité."
 trade_goods_flavour.33.a: "Qu'il en soit ainsi."
 trade_goods_flavour.33.b: "Vendons le surplus."
 
 trade_goods_flavour.34.t: "Le choix des outils : le matériau privilégié"
 trade_goods_flavour.34.desc: "Depuis des millénaires, nos ancêtres utilisent des outils façonnés dans diverses pierres, au premier rang desquelles figure l'#E obsidienne#!. Ce matériau dur les a bien servis, et nous sert encore. Ces dernières années, toutefois, nous avons découvert un nouveau type de matériau employé par d'autres peuples : le métal. Le plus courant est ce qu'ils nomment le #E cuivre#!, mais il est tendre et peut être plié à la main lorsqu'il est suffisamment fin. Le cuivre possède néanmoins ses avantages : il se brise rarement et les outils qui en sont faits sont plus tranchants. \nBien qu'aucun de nos artisans ne sache actuellement façonner ce matériau en outils, nous pouvons apprendre de nos voisins. De contrées plus lointaines nous est parvenu le récit d'un métal plus extraordinaire encore, dont les peuples de toute sorte chantent les louanges : le #E bronze#!! \n\nNous devons désormais faire un choix : voulons-nous nous attacher aux traditions de nos ancêtres, en préservant leur sagesse et leur mode de vie, ou embrasser l'essor de ce nouveau matériau dont l'avenir demeure incertain ?"
 trade_goods_flavour.34.a: "L'obsidienne ne nous a jamais fait défaut."
 trade_goods_flavour.34.b: "Le cuivre et le bronze sont l'avenir."
 
 trade_goods_flavour.35.t: "Surplus d'obsidienne"
 trade_goods_flavour.35.desc: "L'extraction de l'obsidienne se déroule fort bien à présent. Si bien, en vérité, que nous pouvons nous permettre de prodiguer cette ressource à des objets dont la plupart des gens ne feront point usage au quotidien.\nDeux artisans nous ont approchés, chacun proposant de créer un objet utile. Le premier offre de fabriquer des lames acérées au tranchant remarquable, afin que nos combattants soient bien armés. L'autre propose de confectionner des miroirs pour réjouir ces dames."
 trade_goods_flavour.35.a: "Nos guerriers ont besoin de lames acérées."
 trade_goods_flavour.35.b: "Ce qu'il nous faut, ce sont des miroirs pour nos dames."
 
 trade_goods_flavour.36.t: "Flèches d'obsidienne"
 trade_goods_flavour.36.desc: "Aujourd'hui, un maître empennier est arrivé à la cour avec une offre intéressante. Il a fabriqué des flèches dont la pointe est faite d'obsidienne de la plus haute qualité, si acérée qu'elle fera saigner le doigt au simple contact, du moins à l'en croire. Une telle qualité commande un prix fort ; l'achat doit donc être mûrement réfléchi."
 trade_goods_flavour.36.a: "Un peu coûteuses, certes, mais c'est ce qu'il nous faut."
 trade_goods_flavour.36.b: "C'est en vérité bien trop cher !"
 
 trade_goods_flavour.37.t: "Statue d'obsidienne"
 trade_goods_flavour.37.desc: "Récemment, un sculpteur a été aperçu dans la région, créant de merveilleuses œuvres d'art. Certaines sont faites de la pierre la plus noire, l'obsidienne, et d'autres du calcaire le plus blanc, mais toutes ont un point commun : leurs propriétaires sont fort satisfaits et ont payé un prix considérable pour les services de l'artisan itinérant. \nAujourd'hui, il est parvenu jusqu'à notre cour et souhaite savoir si une statue nous intéresserait..."
 trade_goods_flavour.37.a: "Je désire un tel objet."
 trade_goods_flavour.37.b: "Hélas, nous ne pouvons nous le permettre."
 
 trade_goods_flavour.38.t: "The Choice of Tools"
 trade_goods_flavour.38.desc: "Decades ago we had embarked on the journey to compare our ancestral tools, made out of stone, with the tools made of newer materials, especially copper. Having experienced both types, we can now confidently march into the future, deciding to favor one material over the other. We need to keep in mind that we promised in the past one path, and leaving it will not make [ROOT.GetCountry.GetRuler.GetName] popular. \nWhile surely all tools will continue to exist in our society, we need standards, and there can only be one." #tools (event 34) final choice, after 50 years of having used both.
 trade_goods_flavour.38.a: "We shall keep using our traditional tools."
 trade_goods_flavour.38.b: "We have seen the power of the new materials."
 trade_goods_flavour.38.c: "We shall return to our traditional tools."
 trade_goods_flavour.38.d: "We have chosen well with the new metals."
 
 trade_goods_flavour.39.t: "Magnificent Carving" # Ivory
 trade_goods_flavour.39.desc: "An ivory carver, master of his craft, approached us and gifted the royal family a magnificent statuette carved from the purest ivory. The many details he carved show the care and love he has for his art and the divine. It is a most impressive piece, yet we have to decide what we should do with it; displaying it in the throne room would surely impress visitors, yet we could also gift it to a temple, for it is a representation of a deity. \nShould we have to, we could also sell it, although the carver will surely not appreciate this act..." #Carver makes top item; sell, impress dignitaries or gift to temple? (last option can only happen once in the game)
 trade_goods_flavour.39.a: "Sell the item."
 trade_goods_flavour.39.b: "Display it in the palace."
 trade_goods_flavour.39.c: "Gift it to a temple."

 trade_goods_flavour.40.t: "An Ivory Throne"
 trade_goods_flavour.40.desc: "A master carver has approached us, offering to make us a magnificent throne, every inch covered in carvings of our rule and kingdom. Instead of keeping the throne for ourselves, we could also offer it to our heir or the high priest... \nThe price the artisan requests is quite steep however, so we should think twice before accepting his offer." #you can commission an ivory throne
 trade_goods_flavour.40.a: "No one will question my authority."
 trade_goods_flavour.40.b: "The high priest will surely be grateful for it."
 trade_goods_flavour.40.c: "A smaller one cannot hurt..."
 trade_goods_flavour.40.d: "Sadly, we cannot afford this at this moment."
 
 trade_goods_flavour.41.t: "Elephant Hunt"
 trade_goods_flavour.41.desc: "An elephant bull has been seen within a few days of [ROOT.GetCountry.GetCapital.GetName], suitable for a grand elephant hunt. It would surely be a mighty display of royal grandeur and strength, bringing down such a magnificent giant. \nOnly the strongest and savviest hunters are able to survive such a hunt after one of the most dangerous of animals - is [ROOT.GetCountry.GetRuler.GetName] one of them?" #do you want to go hunting?; can be dangerous
 trade_goods_flavour.41.a: "After the animal!"
 trade_goods_flavour.41.b: "It is too dangerous."
 
 trade_goods_flavour.42.t: "Elephant Hunt" #result
 trade_goods_flavour.42.desc_1: "Disaster! [ROOT.GetCountry.GetRuler.GetName] has valiantly fought the animal, yet as soon as the animal had been tracked down, it was clear that it outclassed all our hunters had to give and barely anyone escaped with their life. Our [ROOT.GetCountry.GetRulerTitle] will be buried with all honors." #dead
 trade_goods_flavour.42.desc_2: "Tracking the hunted animal was easy, yet once it was found, it was not as easy prey as many thought and inflicted many wounds on the hunters. Thankfully, no one died and [ROOT.GetCountry.GetRuler.GetName] can claim victory over the beast, yet were the wounds worth the hunt?" #wounded
 trade_goods_flavour.42.desc_3: "Victory my [ROOT.GetCountry.GetRulerTitle]! From tracking the animal down to ending its life, the gods were on our side all of the time. The hunt had no accidents and only a few participants were wounded lightly. It was a great and exhilarating day!" #successful
 trade_goods_flavour.42.a: "This is all a part of [ROOT.GetCountry.GetAdjective] life..." #died or wounded
 trade_goods_flavour.42.b: "It was the right decision." #successful
 
 trade_goods_flavour.43.t: "Stag Hunt"
 trade_goods_flavour.43.desc: "A stag has been seen within a few days of [ROOT.GetCountry.GetCapital.GetName], suitable for a grand hunt. It would surely be a mighty display of royal grandeur and strength, bringing down such a magnificent animal. \nOnly the strongest and savviest hunters are able to hunt such an animal without earning a wound - is [ROOT.GetCountry.GetRuler.GetName] one of them?" #do you want to go hunting?; can be dangerous
 trade_goods_flavour.43.a: "After the animal!"
 trade_goods_flavour.43.b: "It is too dangerous."
 
 trade_goods_flavour.44.t: "Stag Hunt" #result
 trade_goods_flavour.44.desc_1: "Disaster! [ROOT.GetCountry.GetRuler.GetName] has valiantly fought the animal, yet as soon as the animal had been tracked down, it was clear that it outclassed all our hunters had to give and barely anyone escaped with their life. Our [ROOT.GetCountry.GetRulerTitle] will be buried with all honors." #dead
 trade_goods_flavour.44.desc_2: "Tracking the hunted animal was easy, yet once it was found, it was not as easy prey as many thought and inflicted many wounds on the hunters. Thankfully, no one died and [ROOT.GetCountry.GetRuler.GetName] can claim victory over the beast, yet were the wounds worth the hunt?" #wounded
 trade_goods_flavour.44.desc_3: "Victory my [ROOT.GetCountry.GetRulerTitle]! From tracking the animal down to ending its life, the gods were on our side all of the time. The hunt had no accidents and only a few participants were wounded lightly. It was a great and exhilarating day!" #successful
 trade_goods_flavour.44.a: "This is all a part of [ROOT.GetCountry.GetAdjective] life..." #died or wounded
 trade_goods_flavour.44.b: "It was the right decision." #successful
 
 trade_goods_flavour.45.t: "Boar Hunt"
 trade_goods_flavour.45.desc: "A boar has been seen within a few days of [ROOT.GetCountry.GetCapital.GetName], suitable for a grand hunt. It would surely be a mighty display of royal grandeur and strength, bringing down such a magnificent animal. \nOnly the strongest and savviest hunters are able to hunt such an animal without earning a wound - is [ROOT.GetCountry.GetRuler.GetName] one of them?" #do you want to go hunting?; can be dangerous
 trade_goods_flavour.45.a: "After the animal!"
 trade_goods_flavour.45.b: "It is too dangerous."
 
 trade_goods_flavour.46.t: "Boar Hunt" #result
 trade_goods_flavour.46.desc_1: "Disaster! [ROOT.GetCountry.GetRuler.GetName] has valiantly fought the animal, yet as soon as the animal had been tracked down, it was clear that it outclassed all our hunters had to give and barely anyone escaped with their life. Our [ROOT.GetCountry.GetRulerTitle] will be buried with all honors." #dead
 trade_goods_flavour.46.desc_2: "Tracking the hunted animal was easy, yet once it was found, it was not as easy prey as many thought and inflicted many wounds on the hunters. Thankfully, no one died and [ROOT.GetCountry.GetRuler.GetName] can claim victory over the beast, yet were the wounds worth the hunt?" #wounded
 trade_goods_flavour.46.desc_3: "Victory my [ROOT.GetCountry.GetRulerTitle]! From tracking the animal down to ending its life, the gods were on our side all of the time. The hunt had no accidents and only a few participants were wounded lightly. It was a great and exhilarating day!" #successful
 trade_goods_flavour.46.a: "This is all a part of [ROOT.GetCountry.GetAdjective] life..." #died or wounded
 trade_goods_flavour.46.b: "It was the right decision." #successful
 
 trade_goods_flavour.47.t: "Bear Hunt"
 trade_goods_flavour.47.desc: "A bear has been seen within a few days of [ROOT.GetCountry.GetCapital.GetName], suitable for a grand hunt. It would surely be a mighty display of royal grandeur and strength, bringing down such a magnificent animal. \nOnly the strongest and savviest hunters are able to hunt such an animal without earning a wound - is [ROOT.GetCountry.GetRuler.GetName] one of them?" #do you want to go hunting?; can be dangerous
 trade_goods_flavour.47.a: "After the animal!"
 trade_goods_flavour.47.b: "It is too dangerous."
 
