 silphium_sold:0 "Augmentation du commerce de silphium"
 silphium_sold_desc:0 "Le silphium est vendu plus qu'il n'est utilisé dans ce pays..."
 silphium_roast:0 "Rôti au silphium"
 silphium_roast_desc:0 "A mangé un dessert au silphium."
 silphium_soup:0 "Soupe au silphium"
 silphium_soup_desc:0 "A mangé une soupe au silphium."
 silphium_dessert:0 "Dessert au silphium"
 silphium_dessert_desc:0 "A mangé un dessert au silphium."
 silphium_snack:0 "En-cas au silphium"
 silphium_snack_desc:0 "A mangé un en-cas au silphium."
 silphium_farm_pmod:0 "Ferme de silphium"
 silphium_farm_pmod_desc:0 "Voici une ferme dédiée à la culture du silphium."
 beer_culture:0 "Culture de la bière"
 beer_culture_desc:0 "Les habitants préfèrent boire de la bière fraîche plutôt que de se battre dans une guerre."
 beer_brewery:0 "Brasserie de bière"
 beer_brewery_desc:0 "Cette ville a une brasserie de bière... que peut-il en résulter ?"
 beer_culture_national:0 "Culture nationale de la bière"
 beer_culture_national_desc:0 "Dans ce pays, la bière est devenue la boisson nationale."
 wine_culture:0 "Wine Culture"
 wine_culture_desc:0 "The locals prefer drinking some wine instead of going to war."
 censer_bearer_char_mod:0 "Porte-encensoir royal"
 obsidian_kept_main:0 "Outils en obsidienne préférés"
 obsidian_kept_main_desc:0 "On s'en tient à ce qu'on connaît..."
 obsidian_abandoned:0 "Outils en métal préférés"
 obsidian_abandoned_desc:0 "Il faut explorer les usages de ce nouveau matériau."
 obsidian_mirrors:0 "Miroirs d'obsidienne"
 obsidian_mirrors_desc:0 "Les miroirs en obsidienne font le bonheur de plus d'une épouse. Il faut juste pouvoir se le permettre."
 obsidian_blades:0 "Lames d'obsidienne"
 obsidian_blades_desc:0 "Des lames en obsidienne. Elles sont extrêmement coupantes et tirent facilement le sang."
 obsidian_arrow_tips:0 "Pointes de flèche en obsidienne"
 obsidian_arrow_tips_desc:0 "Les pointes de flèches en obsidienne feront pleuvoir la terreur sur nos ennemis."
 obsidian_tools:0 "Outils traditionnels en obsidienne"
 obsidian_tools_desc:0 "Après un certain temps où des outils en obsidienne et en métal étaient disponibles, nous avons décidé que nous préférions nos outils traditionnels."
 metal_tools:0 "Outils métalliques innovants"
 metal_tools_desc:0 "Après un certain temps où des outils en obsidienne et en métal étaient disponibles, nous avons décidé que nous préférions les nouveaux outils."
 magnificent_carving:0 "Sculpture magnifique"
 magnificent_carving_desc:0 "Une défense d'éléphant sculptée par un maître, impressionnant les dignitaires étrangers."
 ivory_throne_cmod:0 "Trône en ivoire"
 ivory_throne_cmod_desc:0 "Un trône en ivoire, impressionnant amis et ennemis. L'autorité dirigeante ne sera pas remise en question."
 ivory_throne_small_cmod:0 "Petit trône en ivoire"
 ivory_throne_small_cmod_desc:0 "Un petit trône en ivoire, parfait pour que l'héritier commence à apprendre..."
 horses_escaped:0 "Chevaux en fuite"
 horses_escaped_desc:0 "Des chevaux se sont échappés de fermes locales, réduisant considérablement leur productivité."
 cattle_escaped:0 "Bétail en fuite"
 cattle_escaped_desc:0 "Le bétail a échappé aux fermes locales, réduisant considérablement la productivité."
 successful_hunt:0 "Chasse réussie"
 successful_hunt_desc:0 "Vous avez mené une chasse avec succès."
 farm_horse_breed:0 "Chevaux de trait"
 farm_horse_breed_desc:0 "Un maître a dressé une nouvelle génération de chevaux idéaux pour les travaux agricoles."
 war_horse_breed:0 "War Horses"
 war_horse_breed_desc:0 "A master has trained a new generation of horses ideal for war."
 grove_desecrated:0 "Bosquet profané"
 grove_desecrated_desc:0 "Pour un simple gain économique, un bosquet sacré a été démoli."
 grove_preserved:0 "Bosquet préservé"
 grove_preserved_desc:0 "Un bosquet sacré a été épargné et laissé pousser, bien qu'il n'ait pas pu atteindre ses objectifs économiques et sociaux."
 nemean_lion_hunted:0 "Lion de Némée aperçu"
 nemean_lion_hunted_desc:0 "Le lion de Némée a été aperçu ici, attaquant le bétail et les voyageurs."
 healthy_pops_pmod:0 "Population en bonne santé"
 healthy_pops_pmod_desc:0 "La population locale mange une alimentation saine, aidant à leur reproduction."
 bitumen_temp_build:0 "Construction au bitume"
 bitumen_temp_build_desc:0 "Dans de nombreuses constructions, le bitume a été utilisé comme adhésif."
 bitumen_temp_ship:0 "Construction navale au bitume"
 bitumen_temp_ship_desc:0 "Le bitume sécurise les planches des navires, les rendant imperméables à l'eau et plus difficiles à pénétrer en général."
 bitumen_temp_tools:0 "Outils au bitume"
 bitumen_temp_tools_desc:0 "Les outils utilisaient souvent du bitume comme adhésif, même s'ils avaient un certain impact sur la santé des travailleurs."
 bitumen_trade_boom:0 "Explosion du commerce du bitume"
 bitumen_trade_boom_desc:0 "Le bitume était échangé sur toute la carte dans les temps anciens."
 tar_pit_rest_in_pieces:0 "A laissé les morts en paix"
 tar_pit_rest_in_pieces_desc:0 "Nous ne dérangeons pas les derniers lieux de repos des morts."
 pomegranates_spoiled:0 "Récolte de grenades gâtée"
 pomegranates_spoiled_desc:0 "La récolte de grenades a été gâchée, ce qui a rendu les nobles mécontents."
 pomegranates_surplus:0 "Surplus de grenades"
 pomegranates_surplus_desc:0 "Il y a beaucoup de grenades; les nobles peuvent se gaver à leur guise."
 onions_surplus:0 "Surplus d'oignons"
 onions_surplus_desc:0 "Il y a plus qu'assez d'oignons; aucun homme ordinaire n'a faim maintenant."
 onions_lack:0 "Petite récolte d'oignons"
 onions_lack_desc:0 "Il n'y a pas assez d'oignons dans le royaume pour nourrir tout le monde correctement..."
 tyrian_purple_trade:0 "Le commerce de la pourpre de Tyr"
 tyrian_purple_trade_desc:0 "Ce pays contrôle le commerce de la pourpre de Tyr, un colorant d’une grande valeur."
 tyrian_purple_dye:0 "Pourpre de Tyr"
 tyrian_purple_dye_desc:0 "C’est d’ici, à [GetProvince('(int32)3982').GetName], que provient la célèbre pourpre de Tyr."
 dye_shipwreck_pmod:0 "Transporteur de teinture coulé dans le port"
 dye_trade_well:0 "Explosion du commerce des teintures"
 dye_trade_well_desc:0 "Le commerce de la teinture se porte très bien."
 dye_accident_pmod:0 "Accident de teinture"
 dye_accident_pmod_desc:0 "Un accident de teinture ici a fait l'objet de publications peu recommandables."
 merchant_spices_rare:0 "Les épices sont rares"
 merchant_spices_rare_desc:0 "Les épices sont rares, augmentant leur prix et mécontentant les couches supérieures de la société."
 cannabis_accepted:0 "Consommation du cannabis"
 cannabis_accepted_desc:0 "Dans ce pays, le Qunabu est utilisé dans des cérémonies religieuses."
 cannabis_refused:0 "Consommation du cannabis abandonnée"
 cannabis_refused_desc:0 "Dans ce pays, Qunabu est mal vu."
 salt_rare_in_realm: "Sel rare dans le pays"
 desc_salt_rare_in_realm: "En raison de pénuries imprévues, le sel, un bien commercial essentiel, est devenu extrêmement rare dans notre pays."
 erymanthian_boar_hunted: "Sanglier d'Érymanthe chassé"
 
