 silphium_healing_tt:0 "L'utilisation du silphium a augmenté la résistance du corps aux maladies."
 beer_culture_spreading_tt:0 "La #Y Culture de la bière#! de [SCOPE.sP('beer_city_scope').GetName] va progressivement s'étendre à l'ensemblee de notre pays."
 beer_culture_spread_tt:0 "Chaque territoire a adopté la #Y Culture de la bière#!, qui est maintenant nationale."
 beer_culture_limited_tt:0 "Nous cesserons de promouvoir la #Y Culture de la bière#! de [SCOPE.sP('beer_city_scope').GetName]. Cette intervention rendra peu probable que d'autres événements se produisent."
 beer_culture_national_tt:0 "Le modificateur local #Y Culture de la bière#! deviendra un modificateur national #Y Country Modifier#!."
 beer_culture_local_tt:0 "Chaque territoire va recevoir #Y Culture de la bière#!."
 beer_culture_expand_production_tt:0 "Nous augmenterons notre production de bière en construisant autant de brasseries que possible."
 beer_culture_cities_only_tt:0 "Nous nous concentrerons sur les villes. Malheureusement, les fermes n'auront plus un accès aussi facile à la bière..."
 small_ivory_throne_tt:0 "Nous avons déjà un trône pour notre roi."
 hunt_help_tt:0 "Une compétente #Y martiale#! @military_icon! élevée sera un avantage. \nPlus elle est #R basse#!, plus le risque d'être #R blessé#! ou même #R tué#! augmente !"
