 # Modifiers
 extra_tin_mil:0 "Plus d'étain"
 extra_tin_mil_desc:0 "Il y a plus d'étain que d'habitude."
 bred_cedars_future:0 "Cèdres de Chypre"
 bred_cedars_future_desc:0 "Ces cèdres sont élevés pour la construction navale. Semblables à leurs parents les plus célèbres au Liban, ils font aussi de merveilleux arbres pour les navires."
 cedar_planks:0 "Planche de cèdre"
 cedar_planks_desc:0 "Des planches en cèdre, un bois très adapté à la construction navale."
 cedar_used_up:0 "Forêt de cèdres exploitée"
 cedar_used_up_desc:0 "Une forêt de cèdres est exploitée au-delà de sa capacité de régénération pour un gain à court terme."
 exploited_cedar:0 "Forêt de cèdres exploitée"
 exploited_cedar_desc:0 "Cette forêt de cèdres est exploitée au-delà de sa capacité de régénération. Peut-être qu'un jour la forêt repoussera..."
 quantity_shipyard:0 "Grand chantier naval"
 quantity_shipyard_desc:0 "Un grand chantier naval, dédié à la fabrication d'autant de navires que possible."
 quality_shipyard:0 "Grand chantier naval"
