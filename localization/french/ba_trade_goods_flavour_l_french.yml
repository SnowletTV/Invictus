 trade_goods_flavour.48.desc_3: "Victoire, mon [ROOT.GetCountry.GetRulerTitle] ! Du moment où nous avons suivi la trace de l'animal jusqu'à celui où nous lui avons ôté la vie, les dieux étaient constamment à nos côtés. La chasse s'est déroulée sans accident et seuls quelques participants ont été légèrement blessés. Quelle journée grandiose et exaltante !" #successful
 trade_goods_flavour.48.a: "Tout cela fait partie de la vie [ROOT.GetCountry.GetAdjective]..." #died or wounded
 trade_goods_flavour.48.b: "C'était la bonne décision." #successful
 
 trade_goods_flavour.49.t: "Chasse au lion"
 trade_goods_flavour.49.desc: "Un lion a été aperçu à quelques jours de [ROOT.GetCountry.GetCapital.GetName], ce qui en fait une cible idéale pour une grande chasse. Abattre un spécimen aussi magnifique, le roi des animaux, serait assurément une formidable démonstration de grandeur et de puissance royales. \nSeuls les chasseurs les plus forts et les plus avisés sont capables de survivre à une rencontre avec un tel animal. [ROOT.GetCountry.GetRuler.GetName] est-il l'un d'eux ?" #do you want to go hunting?; can be dangerous
 trade_goods_flavour.49.a: "À la poursuite de l'animal !"
 trade_goods_flavour.49.b: "C'est trop dangereux."
 
 trade_goods_flavour.50.t: "Chasse au lion" #result
 trade_goods_flavour.50.desc_1: "Quel désastre ! [ROOT.GetCountry.GetRuler.GetName] a vaillamment combattu l'animal, mais dès que celui-ci a été retrouvé, il est apparu qu'il surpassait tous nos chasseurs et presque personne n'a échappé à la mort. Notre [ROOT.GetCountry.GetRulerTitle] sera enterré avec tous les honneurs." #dead
 trade_goods_flavour.50.desc_2: "Il a été facile de suivre la trace de l'animal, mais une fois retrouvé, il s'est avéré être une proie bien moins facile que beaucoup ne le pensaient et a infligé de nombreuses blessures aux chasseurs. Heureusement, personne n'est mort et [ROOT.GetCountry.GetRuler.GetName] peut revendiquer la victoire sur la bête, mais ces blessures en valaient-elles la peine ?" #wounded
 trade_goods_flavour.50.desc_3: "Victoire, mon [ROOT.GetCountry.GetRulerTitle] ! Du moment où nous avons suivi la trace de l'animal jusqu'à celui où nous lui avons ôté la vie, les dieux étaient constamment à nos côtés. La chasse s'est déroulée sans accident et seuls quelques participants ont été légèrement blessés. Quelle journée grandiose et exaltante !" #successful
 trade_goods_flavour.50.a: "Tout cela fait partie de la vie [ROOT.GetCountry.GetAdjective]..." #died or wounded
 trade_goods_flavour.50.b: "C'était la bonne décision." #successful
 
 trade_goods_flavour.51.t: "Élevage de chevaux"
 trade_goods_flavour.51.desc: "Un éleveur de chevaux s'est présenté à notre cour, désireux de nous vendre quelques-uns de ses meilleurs spécimens. Il nous propose des chevaux pour nos chars de guerre, qu'il prétend « insensibles à la peur ». Il possède également de robustes chevaux capables d'aider les fermiers aux champs.\nVu la beauté et l'utilité de ses bêtes, il pourrait nous être utile à notre service..." #a master breeder has new horses
 trade_goods_flavour.51.a: "Les chevaux de guerre."
 trade_goods_flavour.51.b: "Les fermes ont toujours besoin d'aide."
 trade_goods_flavour.51.c: "Faites entrer le maître à notre cour."
 
 trade_goods_flavour.52.t: "Une affaire d'importance boisée" #groove xd # EXPANSION POSSIBLE
 trade_goods_flavour.52.desc: "Nous sommes face à un dilemme, et [ROOT.GetCountry.GetRuler.GetName] doit prendre une décision difficile.\n\nUn bosquet situé non loin de [ROOT.GetCountry.GetCapital.GetName] est un lieu sacré pour les animaux. Bien que chacun sache que les dieux visitent fréquemment cette forêt pour communier avec les créatures, certains souhaitent construire leurs maisons dans cette région.\n\nDevons-nous autoriser nos citoyens à y bâtir leurs demeures ? Le bosquet devrait être abattu." # fell the trees of a holy grove or not? economic gain or religious happiness?
 trade_goods_flavour.52.a: "Nous devons préserver le bosquet à tout prix !"
 trade_goods_flavour.52.b: "Notre peuple a besoin de maisons..."
 
 trade_goods_flavour.53.t: "Les chevaux s'échappent" # EXPANSION POSSIBLE
 trade_goods_flavour.53.desc: "Une terrible nouvelle nous parvient de [SCOPE.sP('horse_farm_scope').GetName] : il semblerait qu'un palefrenier ait oublié de fermer la porte avant de s'endormir. À son réveil, l'idiot a découvert que tous les chevaux de la ferme s'étaient échappés. Il ne fait aucun doute qu'ils ont déjà atteint les terres désolées. Une perte totale !" # SCOPE.sP('horse_farm_scope').GetName]: horses escaped, reducing productivity
 trade_goods_flavour.53.a: "Nous devons en rattraper au moins quelques-uns ! Allez-y !"
 trade_goods_flavour.53.b: "Maudits soient-ils ! Ce qui est perdu est perdu... nous ne pouvons rien faire."
 
 trade_goods_flavour.54.t: "Le lion de Némée aperçu" #
 trade_goods_flavour.54.desc: "Des nouvelles nous parviennent de [GetProvince('(int32)440').GetName] ! Le redoutable #E lion de Némée#!, une bête de taille imposante à l'appétit féroce, a de nouveau été aperçu. Il attaque le bétail et est même allé jusqu'à tuer les enfants d'un malheureux berger. Les habitants sont terrifiés et implorent l'aide des autorités [ROOT.GetCountry.GetAdjective]. Que devons-nous faire ?" # in p:210 (Nemea) the Nemean Lion was sighted again, killing some cattle etc
 trade_goods_flavour.54.a: "Nous devons nous débarrasser de cette nuisance."
 trade_goods_flavour.54.b: "Lui aussi doit se nourrir."
 
 trade_goods_flavour.55.t: "Le lion de Némée retrouvé" #hunted and killed
 trade_goods_flavour.55.desc: "[ROOT.GetCountry.GetRuler.GetName] a réussi à retrouver et à tuer le #E lion de Némée#! : incroyable ! La bête était en train d'attaquer des chèvres lorsque [ROOT.GetCountry.GetRuler.GetName] lui a décoché quelques flèches qui se sont profondément plantées dans son arrière-train. Lorsque l'animal a tenté de fuir, une flèche bien ajustée en plein cœur a mis fin à son règne de terreur pour toujours.\n\nLes habitants sont euphoriques, c'est peu dire : ils ont chanté toute la nuit et n'ont cessé de louer [ROOT.GetCountry.GetRuler.GetName]. Le vin coule à flots et tout le village proche de [GetProvince('(int32)440').GetName] se réjouit." # in p:210, the Nemean Lion was hunted and killed
 trade_goods_flavour.55.a: "Quelle chasse !"
 
 trade_goods_flavour.56.t: "Le lion de Némée nous échappe" #the lion wasn't found
 trade_goods_flavour.56.desc: "Bien que [ROOT.GetCountry.GetRuler.GetName] ait désespérément tenté de traquer le #E lion de Némée#!, allant même jusqu'à trouver la tanière de la créature, le lion lui-même est resté insaisissable et ne s'est jamais montré.\n\nTout le monde est déçu, mais nous ne pouvons pas continuer à perdre du temps à pourchasser le lion." # in p:210, the Nemean Lion was hunted and killed
 trade_goods_flavour.56.a: "Quel dommage. Nous l'aurons une autre fois."
 
 trade_goods_flavour.57.t: "Le sanglier d'Érymanthe aperçu" #
 trade_goods_flavour.57.desc: "Des rapports inquiétants nous sont parvenus : un sanglier gigantesque a été aperçu près de [GetProvince('(int32)7894').GetName]. Il attaque les troupeaux des habitants et éventre les chevaux avec ses défenses. Malgré tous leurs efforts, les habitants n'ont pas réussi à tuer le monstre et demandent l'aide de [ROOT.GetCountry.GetCapital.GetName]." # in p:71 (7894)(Erymanthos) the Erymanthian Boar was sighted again, killing some cattle etc
 trade_goods_flavour.57.a: "Nous mettrons fin à la menace d'Érymanthe."
 trade_goods_flavour.57.b: "Ce n'est pas à nous de détruire une créature divine."
 
 trade_goods_flavour.58.t: "Le sanglier d'Érymanthe retrouvé" #hunted and killed
 trade_goods_flavour.58.desc_1: "Quel désastre ! [ROOT.GetCountry.GetRuler.GetName] a vaillamment combattu l'animal, mais dès que celui-ci a été retrouvé, il est apparu qu'il surpassait tous nos chasseurs et presque personne n'a échappé à la mort. Notre [ROOT.GetCountry.GetRulerTitle] sera enterré avec tous les honneurs." #dead
 trade_goods_flavour.58.desc_2: "Il a été facile de suivre la trace de l'animal, mais une fois retrouvé, il s'est avéré être une proie bien moins facile que beaucoup ne le pensaient et a infligé de nombreuses blessures aux chasseurs. Heureusement, personne n'est mort et [ROOT.GetCountry.GetRuler.GetName] peut revendiquer la victoire sur la bête, mais ces blessures en valaient-elles la peine ?" #wounded
 trade_goods_flavour.58.desc_3: "Une histoire digne de rester dans les mémoires ! [ROOT.GetCountry.GetRuler.GetName] a réussi à traquer et à tuer le redoutable #E sanglier d'Érymanthe#! avec une facilité qui a fait honte aux habitants de [GetProvince('(int32)7894').GetName].\n\nÀ peine arrivé à proximité du sanglier, [ROOT.GetCountry.GetRuler.GetFirstName] a réussi à attirer la bête hors de la forêt et l'a rapidement abattue à coups de flèches.\n\nUn immense bûcher est maintenant construit près d'Érymanthe afin de faire rôtir le sanglier, et [ROOT.GetCountry.GetRuler.GetFirstName] a accepté de rester pour profiter des festivités." #successful
 trade_goods_flavour.58.a: "Je suis le plus grand chasseur de tous les temps !"
 
 trade_goods_flavour.59.t: "Le sanglier d'Érymanthe nous échappe" #the boar wasn't found
 trade_goods_flavour.59.desc: "Maudits soient-ils ! Le #E sanglier d'Érymanthe#! continue de semer le chaos autour de [GetProvince('(int32)7894').GetName], mais il est trop rapide pour que nos hommes puissent l'encercler. Nos chevaux sont naturellement terrifiés par cette bête gigantesque et refusent de s'en approcher suffisamment pour lui porter le coup fatal. Bien que tous les habitants d'Érymanthe soient déçus au-delà des mots, la chasse a dû être interrompue avant que la victoire ne soit remportée." # in p:71, the Erymanthian Boar was hunted and killed
 trade_goods_flavour.59.a: "Nous l'aurons une autre fois."
 
 trade_goods_flavour.60.t: "Une population en bonne santé" #fruit
 trade_goods_flavour.60.desc: "Nous pensions que vous seriez heureux d'apprendre cela, ô [ROOT.GetCountry.GetRuler.GetName] : bien que chacun sache que le peuple [ROOT.GetCountry.GetAdjective] apprécie sa bière et sa viande, nos citoyens s'efforcent depuis quelque temps de manger davantage de fruits et de légumes. Les produits frais sont non seulement délicieux et nourrissants, mais nous disposons également d'un tel surplus de fruits qu'il paraît logique que notre peuple consomme ce qu'il ne peut pas vendre au marché." #eating fruit is healthy; in fruits_scope (province)
 trade_goods_flavour.60.a: "Espérons que cela se poursuivra."
 
 trade_goods_flavour.61.t: "Une population en bonne santé" #vegetables
 trade_goods_flavour.61.desc: "Nous pensions que vous seriez heureux d'apprendre cela, ô [ROOT.GetCountry.GetRuler.GetName] : bien que chacun sache que le peuple [ROOT.GetCountry.GetAdjective] apprécie sa bière et sa viande, nos citoyens s'efforcent depuis quelque temps de manger davantage de fruits et de légumes. Les produits frais sont non seulement délicieux et nourrissants, mais nous disposons également d'un tel surplus de fruits qu'il paraît logique que notre peuple consomme ce qu'il ne peut pas vendre au marché." # eating vegetables is healthy; in fruits_scope (province)
 trade_goods_flavour.61.a: "Espérons que cela se poursuivra."
 
 trade_goods_flavour.62.t: "Surplus de bitume" # EXPANSION POSSIBLE
 trade_goods_flavour.62.desc: "Contre toute attente, notre gisement de bitume est plus profond et plus vaste que nous ne l'avions estimé, ce qui a accru notre capacité d'extraction. Pour l'instant du moins, nous pouvons augmenter notre production là où le bitume est facilement accessible. Reste à savoir s'il faut le vendre ou le conserver pour notre propre usage, peut-être pour nos navires ou nos outils ?" # Bitumen was used for tons of stuff; some bigger ones are building, ships and tools
 trade_goods_flavour.62.a: "Des navires, pour régner sur les mers."
 trade_goods_flavour.62.b: "Nous devons construire !"
 trade_goods_flavour.62.c: "Mais ces outils..."
 trade_goods_flavour.62.d: "Nous devrions le vendre."
 
 trade_goods_flavour.63.t: "Des ossements découverts"
 trade_goods_flavour.63.desc: "Alors que nous extrayions du bitume d'un gisement, de gros ossements ont été mis au jour. Il s'agit manifestement des restes d'un être gigantesque, peut-être de nature divine. Devons-nous continuer à exhumer ces ossements ou les laisser reposer dans leur dernière demeure ?" # find dino bones in a tar pit; excavate more or let it be (ppl think it's something else); only one of a-d is available at any one time
 trade_goods_flavour.63.a: "Nous devons les exhumer."
 trade_goods_flavour.63.b: "Nous devons les récupérer."
 trade_goods_flavour.63.c: "Nous devons les mettre au jour."
 trade_goods_flavour.63.d: "Nous devons les retrouver."
 trade_goods_flavour.63.e: "Laissons-les reposer en paix."
 
 trade_goods_flavour.64.t: "Récolte de grenades perdue" # EXPANSION POSSIBLE
 trade_goods_flavour.64.desc: "Quel désastre, mon [ROOT.GetCountry.GetRulerTitle] ! La récolte de grenades a été gâchée en raison d'un mauvais stockage et seuls quelques fruits restent comestibles. Les nobles et les prêtres ont déjà commencé à exprimer leur mécontentement, désirant ce fruit noble et exigeant que nous en importions davantage de l'étranger. Devons-nous céder à leurs exigences et payer un prix exorbitant ?" # pomegranate harvest spoiled; let it be (nobles unhappy) or buy from outside the realm
 trade_goods_flavour.64.a: "Nous devons nous approvisionner à l'étranger."
 trade_goods_flavour.64.b: "Il y a des affaires plus importantes."
 
 trade_goods_flavour.65.t: "Surplus durant la récolte de grenades"
 trade_goods_flavour.65.desc: "Mon [ROOT.GetCountry.GetRulerTitle], une nouvelle incroyable nous parvient de nos champs : la récolte de grenades dépasse largement les prévisions. Grâce à cet excédent, nous sommes certains de réaliser un joli profit, à moins que nous ne consommions nous-mêmes ces fruits." # pomegranate harvest surplus; keep it (happier nobles) or sell it
 trade_goods_flavour.65.a: "Mangeons-les tous."
 trade_goods_flavour.65.b: "Nous devrions les vendre."
 
 trade_goods_flavour.66.t: "Excédent de récolte d'oignons"
 trade_goods_flavour.66.desc: "Mon [ROOT.GetCountry.GetRulerTitle], une nouvelle incroyable nous parvient de nos champs : la récolte d'oignons dépasse largement les prévisions. Grâce à cet excédent, nous sommes certains de réaliser un joli profit, si toutefois nous ne consommons pas nous-mêmes ces fruits. En tout cas, personne ne mourra de faim cette année." # onion harvest surplus; keep it (common ppl happy) or sell it realm
 trade_goods_flavour.66.a: "Mangeons-les."
 trade_goods_flavour.66.b: "Vendons-les"
 
 trade_goods_flavour.67.t: "Petite récolte d'oignons" # EXPANSION POSSIBLE
 trade_goods_flavour.67.desc: "Quel désastre, mon [ROOT.GetCountry.GetRulerTitle] ! La récolte d'oignons s'est révélée bien plus maigre que prévu et les paysans ont commencé à grogner et à protester. Si nous ne trouvons pas de solution, nous pourrions perdre le soutien du peuple et voir la rébellion se renforcer." # onion harvest spoiled; let it be (common ppl unhappy) or buy from outside the realm
 trade_goods_flavour.67.a: "Nous devons nous approvisionner à l'étranger."
 trade_goods_flavour.67.b: "Il y a des affaires plus importantes."
 
 trade_goods_flavour.68.t: "Le bétail s'échappe" # EXPANSION POSSIBLE
 trade_goods_flavour.68.desc: "Une terrible nouvelle nous parvient de [SCOPE.sP('cattle_farm_scope').GetName] : il semblerait qu'un palefrenier ait oublié de fermer la porte avant de s'endormir. À son réveil, l'idiot a découvert que tout le bétail de la ferme s'était échappé. Il ne fait aucun doute que les animaux ont déjà atteint les terres désolées. Une perte totale !" # SCOPE.sP('cattle_farm_scope').GetName]: cattle escaped, reducing productivity
 trade_goods_flavour.68.a: "Nous devons en rattraper au moins quelques-uns."
 trade_goods_flavour.68.b: "Ce qui est perdu est perdu."
 
 trade_goods_flavour.69.t: "La pourpre de Tyr : une couleur exceptionnelle" # Tyrian purple gets "invented"
 trade_goods_flavour.69.desc: "Contemplez cette couleur divine, ô [ROOT.GetCountry.GetRuler.GetName]. Créée dans la cité de [GetProvince('(int32)3982').GetName], cette pourpre profonde porte le nom de la ville dont elle est originaire. \nLe processus nécessaire pour teindre ne serait-ce qu'une seule pièce de tissu est si complexe et chronophage que son coût éclipse celui de toute autre teinture ou pigment. À n'en pas douter, la vente de cette teinture hors de prix nous rendra immensément riches, tandis que posséder un vêtement de cette couleur sera le signe d'une fortune incalculable." # [GetProvince('(int32)3982').GetName] Tyre
 trade_goods_flavour.69.a: "Une couleur vraiment divine."
 
 trade_goods_flavour.70.t: "La pourpre de Tyr : une nouvelle couleur" # Ping to in diplo range - "invitation of conquest for juicy trade"
 trade_goods_flavour.70.desc: "Des nouvelles d'une nouvelle couleur nous sont parvenues de [GetProvince('(int32)3982').GetName]. Une pourpre plus profonde qu'aucune autre couleur, et si coûteuse que même les dieux pleurent en voyant son prix. Seuls les [GetProvince('(int32)3982').GetOwner.GetAdjective]s savent créer cette teinture, et arracher ce secret de leurs mains, voire de leurs tombes si nécessaire, en vaudrait mille fois la peine. Un jour, cette cité et sa couleur divine seront à nous." # [GetProvince('(int32)3982').GetName] Tyre
 trade_goods_flavour.70.a: "Une couleur merveilleuse. Elle sera mienne."
 
 trade_goods_flavour.71.t: "La pourpre de Tyr : un nouveau maître" # Tyrian purple gets new owner (conquered)
 trade_goods_flavour.71.desc: "Un nouveau maître de la pourpre s'est imposé à [GetProvince('(int32)3982').GetName]. Le secret de sa fabrication étant désormais solidement gardé par les [GetProvince('(int32)3982').GetOwner.GetAdjective]s, les anciens vendeurs tomberont sûrement dans l'oubli. Nous serons assurément les maîtres de cette teinture pour les siècles à venir !" # [GetProvince('(int32)3982').GetName] Tyre
 trade_goods_flavour.71.a: "Quel jour de célébration !"
 
 trade_goods_flavour.72.t: "La pourpre de Tyr : un nouveau maître" # ping of new owner
 trade_goods_flavour.72.desc: "Un nouveau maître de la pourpre s'est imposé à [GetProvince('(int32)3982').GetName]. Le secret de sa fabrication étant désormais solidement gardé par les [GetProvince('(int32)3982').GetOwner.GetAdjective]s, les anciens vendeurs tomberont sûrement dans l'oubli. \nSi la cité a déjà changé de mains, pourquoi pas une fois de plus ?" # [GetProvince('(int32)3982').GetName] Tyre
 trade_goods_flavour.72.a: "Un jour, elle sera à nous."
 
 trade_goods_flavour.73.t: "Le transport de teinture coule" # Ship with dye sinks in a port, spilling the dyes into the water
 trade_goods_flavour.73.desc: "Une terrible nouvelle nous parvient de [SCOPE.sP('dye_shipwreck').GetName] : après qu'une tempête a balayé la région, tous nos navires qui transportaient de la teinture ont sombré, emportant avec eux nos espoirs de réaliser un bénéfice cette saison." # dye_shipwreck is the prov scope
 trade_goods_flavour.73.a: "Quel gâchis de teinture... et de vies, j'imagine."
 
 trade_goods_flavour.74.t: "Essor du commerce des teintures" # Dye trade booming
 trade_goods_flavour.74.desc: "Nous ne vous importunerons pas avec trop de détails aujourd'hui, [ROOT.GetCountry.GetRuler.GetName], mais sachez simplement que le commerce des teintures se porte exceptionnellement bien. Des marchands viennent de partout pour visiter nos marchés, car notre produit est manifestement meilleur que tout ce qui est fabriqué à des centaines de lieues à la ronde." #
 trade_goods_flavour.74.a: "Tant mieux"
 
 trade_goods_flavour.75.t: "Accident de teinture" # Dyeing accident; the fur of some local noble got dyed the wrong colour
 trade_goods_flavour.75.desc: "Un noble vivant à [ROOT.GetCountry.GetCapital.GetName] fait grand cas d'une commande de vêtements qu'il avait demandé de teindre. Bien qu'il ait été très précis quant aux couleurs souhaitées, les teinturiers ont « gâché » des tuniques de lin en ne les teignant pas d'un violet profond.\n\nLe noble refuse de laisser tomber l'affaire et insiste sur le fait que, puisque l'État a financé l'initiative de production de teinture, le peuple de [ROOT.GetCountry.GetName] doit prendre en charge une nouvelle tunique." #
 trade_goods_flavour.75.a: "Quel dommage. Elle reste tout de même jolie."
 trade_goods_flavour.75.b: "Nous allons l'indemniser."
 
 trade_goods_flavour.76.t: "Exportation d'épices" # Try to plant some spices in another part of your realm
 trade_goods_flavour.76.desc: "Il a récemment été suggéré à [ROOT.GetCountry.GetCapital.GetName] que nous essayions de cultiver certaines épices localement au lieu de toujours payer le prix fort pour les importer. Qu'en pensez-vous, [ROOT.GetCountry.GetRuler.GetName] ? Cela pourrait coûter un peu au départ, mais si cela fonctionne, nous en tirerons profit !" #
 trade_goods_flavour.76.a: "Essayons."
 trade_goods_flavour.76.b: "C'est trop cher."
 
 trade_goods_flavour.77.t: "Exportation d'épices : croissance" # title unsure;
 trade_goods_flavour.77.desc_1: "Une nouvelle formidable ! Non seulement les épices que nous avons plantées dans l'une de nos provinces poussent, mais les premières récoltes sont arrivées et les habitants affirment que nos variétés sont plus parfumées et plus piquantes que celles que nous importons à grands frais.\n\nBientôt, les marchés de [ROOT.GetCountry.GetCapital.GetName] regorgeront d'épices [ROOT.GetCountry.GetAdjective] de qualité à vendre." # grew successfully
 trade_goods_flavour.77.desc_2: "Eh bien, nos efforts pour cultiver des épices dans notre propre pays ont échoué de façon spectaculaire, mais nous pouvons au moins nous consoler en sachant que nous avons essayé." # didn't grow
 trade_goods_flavour.77.a: "Ça a marché ! Je suis un génie !"
 trade_goods_flavour.77.b: "Cela valait la peine d'essayer."
 
 trade_goods_flavour.78.t: "Arbres à myrrhe" # Plant some myrrh trees in a neighboring territories
 trade_goods_flavour.78.desc: "Il a été proposé de planter des arbres à myrrhe localement afin de réduire les dépenses liées à l'importation de cet encens précieux. Nous avons déjà choisi l'emplacement et les ouvriers sont prêts à commencer les travaux si [ROOT.GetCountry.GetRuler.GetName] en donne l'ordre." #
 trade_goods_flavour.78.a: "Faisons-le."
 trade_goods_flavour.78.b: "C'est trop cher."
 
 trade_goods_flavour.79.t: "Arbustes à encens" # Plant some incense bushes in a neighboring territories
 trade_goods_flavour.79.desc: "Il a été suggéré à [ROOT.GetCountry.GetRuler.GetName] que [ROOT.GetCountry.GetName] pourrait gagner davantage d'argent en se lançant dans la vente d'encens, que tout le monde apprécie et dont chacun a besoin à des fins religieuses. Des arbustes locaux produisent une résine à l'odeur douce et, une fois leurs fleurs séchées et préparées en pot-pourri, leur parfum est particulièrement agréable. Devrions-nous commencer à cultiver ces arbustes à encens dans l'espoir de les vendre ?" #
 trade_goods_flavour.79.a: "Faisons-le."
 trade_goods_flavour.79.b: "C'est trop cher."
 
 trade_goods_flavour.80.t: "Les épices se raréfient" # spices are rare; nobles and merchants (citizen) are unhappy, prices increase
 trade_goods_flavour.80.desc: "Les saveurs auxquelles notre peuple s'est habitué se font de plus en plus rares, au grand dam de [ROOT.GetCountry.GetRuler.GetName], dont l'haleine est généralement parfumée aux épices des royaumes lointains.\n\nAlors que les gousses de cardamome et le poivre noir commencent à disparaître des marchés, tous implorent [ROOT.GetCountry.GetName] de faire quelque chose pour réapprovisionner les réserves, quel qu'en soit le prix." #
 trade_goods_flavour.80.a: "Laissons la nature suivre son cours."
 trade_goods_flavour.80.b: "Nous devons nous en procurer auprès de nos voisins."
 
 trade_goods_flavour.81.t: "Pénurie de sel" # salt shortage etc.
 trade_goods_flavour.81.desc: "Nous sommes confrontés à une crise qui évolue lentement et pourrait se transformer en catastrophe si nous ne faisons pas attention. Il semblerait que les réserves de sel soient inhabituellement faibles et, sans cette ressource essentielle, l'assaisonnement de nos aliments sera le cadet de nos soucis : nous ne pourrons plus conserver aucune viande !" #
 trade_goods_flavour.81.a: "Nous ne pouvons rien y changer."
 trade_goods_flavour.81.b: "Nous devons nous en procurer auprès de nos voisins."
 
 trade_goods_flavour.82.t: "Le qunabu assyrien" # copy the Assyrians (unless you are Assyrian) in using Qunabu (Cannabis) in temples for ceremonies and similar
 trade_goods_flavour.82.desc: "Nous avons entendu des rumeurs au sujet d'une mystérieuse substance appelée « qunabu », que les Assyriens utilisent lors de leurs cérémonies au temple. On dit que ceux qui respirent les volutes enivrantes produites par la combustion de ce chanvre communient avec les dieux, souvent en riant tout du long, avant d'être saisis d'un appétit féroce que seuls des mets sucrés comme des gâteaux au miel peuvent satisfaire.\n\nNous pourrions utiliser du qunabu dans nos propres cérémonies religieuses, mais nous devons obtenir l'approbation de [ROOT.GetCountry.GetRuler.GetName] avant toute chose." #
 trade_goods_flavour.82.a: "Je crois connaître quelqu'un qui pourrait nous en procurer."
 trade_goods_flavour.82.b: "Dites simplement non..."

 trade_goods_flavour.83.t: "Un nouveau filon" # precious, metals, base metals, copper, gems: one of the four; new seam discovered in mining_target.
 trade_goods_flavour.83.desc: "Nos ouvriers nous annoncent une heureuse découverte : un nouveau filon de précieuses ressources minérales attend d'être extrait du sol à [SCOPE.sP('mining_target').GetName]. Les premiers rapports manquent de détails, mais ce filon semble être le plus grand jamais découvert dans l'histoire [ROOT.GetCountry.GetAdjective]." #
 trade_goods_flavour.83.a: "Nous devons exploiter cette nouvelle richesse."
 trade_goods_flavour.83.b: "Cela n'en vaut tout simplement pas la peine."

 trade_goods_flavour.84.t: "Un filon épuisé" # precious, metals, base metals, copper: one of the three; seam depleted in mining_target. What should they focus on in the future?
 trade_goods_flavour.84.desc: "Nous apprenons que [SCOPE.sP('mining_target').GetName] a été dépouillée de ses précieuses ressources minérales, mais nous avons toujours un grand nombre d'esclaves et d'ouvriers dans la région. Au lieu de les disperser ou de les renvoyer chez eux, il a été suggéré de leur trouver une activité productive dans la région, une proposition que [ROOT.GetCountry.GetRuler.GetName] a approuvée." #
 trade_goods_flavour.84.a: "L'agriculture !" # Vegetables; needs to be a settlement
 trade_goods_flavour.84.b: "Les chevaux ont de la valeur." # Horses; needs to have horses in region or be hurrian; plus terrain
 trade_goods_flavour.84.c: "On a toujours besoin de bois." # Wood
 trade_goods_flavour.84.d: "Je vois beaucoup de tissage dans leur avenir." # Cloth; needs to be city
 trade_goods_flavour.84.e: "Les teintures rapportent de l'argent." # Dye; needs to be Phoenician
 trade_goods_flavour.84.f: "Nous devrons nous contenter de quelques pierres..." # Only option now to not break mission trees