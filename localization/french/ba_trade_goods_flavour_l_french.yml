 tin_smith_skirm:0 "Armement expérimental en bronze"
 tin_smith_skirm_desc:0 "Un maître forgeron a créé des armes expérimentales pour nos troupes."
 tin_smith_char:0 "Armement expérimental en bronze"
 tin_smith_char_desc:0 "Un maître forgeron a créé des armes expérimentales pour nos troupes."
 silphium_used:0 "Utilisation accrue de silphium"
