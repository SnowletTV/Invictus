 #Startup events
 startup_events.10.t:0 "Les Frisii"
 startup_events.10.desc:0 "Il y a environ trois siècles, nos ancêtres ont arraché à la mer le sol sur lequel nous vivons. Ils ont empilé couche après couche de boue jusqu'à ce que les soi-disant terps soient créés. \n \nNotre peuple se livre à l'élevage et au commerce d'animaux à travers la mer, dont la perspective a conduit de plus en plus d'immigrants à venir vivre ici et à construire littéralement leur propre fortune. \n \nCe que l'avenir nous réserve est difficile à dire, mais peut-être pourrions-nous lorgner sur la mystérieuse île d'Albion..."
 startup_events.10.a:0 "Nous, Frisii, sommes des hommes libres !"

 startup_events.11.t:0 "Les Suèves"
 startup_events.11.desc:0 "Les Suèves, également nommés Suebi ou Irminones, se sont développés à partir de la population locale de l'âge du bronze autour de la rivière Albis, l'Elbe moderne. L'avènement de l'âge du fer accompagna une mutation de la société ; désormais tous étaient égaux dans la mort, car chacun fut enterré dans une urne façonnée localement après l'incinération des restes.\n\nPourtant, les prouesses militaires commencèrent à tenir un rôle de plus en plus grand, et finirent par faire des Suebi le parangon même de la culture germanique. Les jeunes hommes d'autres tribus se coiffaient à la manière suève, dite nœud suebi.\n\nLeurs voisins guettent toujours leurs raids, dans la crainte ; mais peut-être qu'un chef populaire saura briser la tradition de l'égalité dans la mort."
 startup_events.11.a:0 "Laissez Irmin nous guider !"

 startup_events.12.t:0 "Les Vandales"
 startup_events.12.desc:0 "D'abord, le phénomène de l'usage des urnes faciales naquit en Poméranie moderne puis s'étendit vers le sud dans ce qui allait devenir la Pologne continentale. Ces urnes faciales portaient des couvercles en forme de chapeau et des visages supposés modelés d'après les dessins enterrés et incisés.\n\nLa divergence entre les peuples du nord de la côte baltique et ceux du continent s'accentua au fil du temps, et chacun prit ensuite des voies diverses.\n\nAinsi, le siècle dernier vit l'afflux de migrants suébes, qui vivent désormais dans des colonies séparées parmi notre peuple et ont gardé leurs traditions et leur mode de guerre. De cela dépendront les rapports entre notre culture et la leur."
 startup_events.12.a:0 "Laissez l'Alhiz nous guider !"

 startup_events.13.t:0 "Les Germains de la côte sud de la Baltique"
 startup_events.13.desc:0 "La culture, les croyances et aussi les habitants de la patrie d'origine de l'âge du bronze nordique, la péninsule scandinave, sont venus sur la terre qu'est la Poméranie à l'époque moderne, où elle a fusionné avec le substrat local. C'étaient les racines des Germains vivant dans cette région et potentiellement aussi des mythes et légendes enregistrés plus tard. \n \nPlus tard, le phénomène de l'utilisation des urnes faciales a commencé dans cette région et s'est répandu vers le sud dans ce qui est aujourd'hui la Pologne continentale. Ces urnes faciales avaient des couvercles en forme de chapeaux, des visages supposément modelés d'après les dessins enterrés et incisés. \n \nLa divergence entre les Vandales du sud et les peuples de la côte baltique s'est intensifiée au fil du temps et tous deux prendraient d'autres directions."
 startup_events.13.a:0 "Laissez Gautr nous guider !"

 startup_events.14.t:0 "Les Ingvaeonics"
 startup_events.14.desc:0 "Dans le cadre des routes commerciales actives s'étendant de Pritannia à Scandia, les Ingvaeonics ont eu un accès facile aux produits de base de l'un ou l'autre des deux et ont bénéficié en tant qu'intermédiaires, étant capables de parler à la fois celtique et germanique. \n \n Leur maison est la côte orientale de la mer du Nord, caractérisée principalement par des plages de sable, des estuaires fluviaux et la mer des Wadden. Ils sont les maîtres de cette mer agitée dans leurs navires robustes et pourraient bientôt tourner leurs yeux vers de nouvelles terres."
 startup_events.14.a:0 "La mer du Nord nous attend."

 startup_events.15.t:0 "Les Istvaoniques"
 startup_events.15.desc:0 "Au carrefour entre les Celtes et les Suèves germaniques, entre les fleuves Rhenus (Rhin) et Visurgis (Weser), vivent les Istvaoniques. Influencés par tous leurs voisins à des degrés divers, leur culture et leurs croyances sont un amalgame différent d'une tribu à l'autre, car une tribu est plus encline de ce côté et l'autre tribu de l'autre. \n \nPourtant, ériger des forts de colline pour une défense solide est une tradition partagée par tous les Istvaonics à ce jour; la quantité de coordination sociale et de travail impliquée dans cette tradition ne peut être sous-estimée. \n \nLe chemin que ces tribus emprunteront est une énigme. Vont-ils s'unir ou se retrouver absorbés par des puissances étrangères ? Seul le temps nous le dira."
 startup_events.15.a:0 "Laissez Istio nous guider !"

 #Gaulish events
 flavor_gaul.1.t:0 "Les Gallizenes"
 flavor_gaul.1.desc:0 "Vous avez voyagé loin, et pourtant les femmes ne vous laisseront pas aller plus loin. "Aucun avec un manche entre les jambes ne peut traverser l'eau", gloussa une vieille femme. "Roi, chef ou fermier, seule une femme peut visiter l'île sacrée". \n \nVous regardez à travers l'eau brumeuse, ne voyant que le faible contour de l'île bénie au-delà des vagues. Les neuf prêtresses des Gallizenae habitaient sur cette île, et si l'on en croyait les vieilles, elles pouvaient se transformer en bêtes et commander aux vents. Vous êtes venu ici parce que vous aviez besoin de leur aide. \n \n'Alors tu y vas, vieille femme', beuglez-vous à la vieille femme. "J'ai des affaires avec les Gallizenae, mais j'honorerai les dieux et n'irai pas plus loin". La vieille femme sourit largement, sans montrer une dent, et tendit sa paume ouverte dans l'attente. Ses yeux sombres roulaient d'avant en arrière d'une manière folle, regardant tout sauf vous. \n \nÀ contrecœur, vous placez une bourse de pièces, tintant doucement, dans sa main. « Pourquoi mon chef voudra-t-il les prêtresses sacrées ? demanda-t-elle d'un ton moqueur, les yeux soudain fixés sur toi, sans ciller."
 flavor_gaul.1.descf:0 "Vous regardez de l'autre côté du détroit, au-delà duquel règnent les mystiques Gallizenae. Une vieille femme courbée et bienveillante se tient à côté de vous, pointant faiblement vers un contour sombre à l'horizon. 'C'est là que ma dame doit aller, pour trouver les servantes oracle' dit-elle faiblement. \n \nL'île au-delà est voilée de brumes et seules les femmes y sont autorisées. "Je cherche le passage, et j'apporte de l'argent" dites-vous à la vieille femme à laquelle elle s'allume. 'Alors on y va maintenant' rayonna-t-elle et avec une énergie surnaturelle elle s'enfuit. \n \nVous savez bien suivre, et retrouvez bientôt la vieille femme faisant signe à quelques pêcheurs de descendre de leur bateau. Il est équipé d'une grande lanterne à sa proue et d'un ensemble de rames, mais la femme vous assure qu'elle vous emmènera seule sur l'île. "Nous n'avons pas besoin d'hommes, et d'ailleurs ils ne peuvent pas partir" marmonne-t-elle alors que les pêcheurs partent à contrecœur. \n \nVous vous retrouvez sur le petit bateau, et la faible femme ne semble plus aussi faible. Elle rame dur, et à mi-chemin à travers la ligne droite, elle demande "Quel est le but de la dame avec les prêtresses?". Ses yeux sont fixés sur vous, et ils semblent appartenir à une jeune femme, pas à une vieille."
 flavor_gaul.1.a:0 "Je suis tombé malade et je cherche la guérison de Mullo."
 flavor_gaul.1.b:0 "Je demande à leur oracle d'allumer une torche pour moi, car l'avenir est sombre."
 flavor_gaul.1.c:0 "Je souhaite la bonne fortune de Toutatis en mer."
 flavor_gaul.1.d:0 "Je dois gagner les faveurs de Smertrios dans les batailles à venir."
 flavor_gaul.1.e:0 "J'ai changé d'avis, vieille, rends-moi ma pièce !"
 flavor_gaul.2.t:0 "Les pouvoirs de guérison des Gallizenae"
 flavor_gaul.2.desc:0 "Les jours passent et vous campez impatiemment sur le rivage, mais un soir, alors que la lune est basse et que le brouillard s'élève sur la plage, une lumière apparaît au-dessus des eaux sombres. Vous distinguez une lanterne orange fixée à la proue d'un petit bateau et, une fois échouée, la vieille se précipite vers vous avec une jeune fille en remorque. \n \nLa servante est vêtue d'un manteau de lin fin fixé par une broche ornée au-dessus de sa poitrine. "La jeune prêtresse a conseillé les dieux" dit la vieille femme avec irrévérence et elle s'en alla dans les bois, laissant la jeune fille seule avec vous. La jeune femme devant vous est d'une beauté époustouflante, et vous ressentez un besoin interdit. \n \nElle s'approche de vous et parle doucement 'Mon chef, vous avez demandé conseil à Mullo ?' Vous regardez dans ses yeux sombres et les parfums de plusieurs herbes pèsent lourdement dans l'air. Son souffle devient plus lourd et la broche en métal se presse contre ta poitrine. "Le cadeau de Mullo est mieux donné en privé" murmure-t-elle et place sa main dans la tienne."
 flavor_gaul.2.descf:0 "Le lendemain vous êtes dans un bosquet au centre de l'île. La lune projette des ombres sombres sur le bosquet et en son cœur se trouve une grande pierre sculptée. Neuf silhouettes élancées et masquées l'entourent, chacune chuchotant à une entité invisible, mais chaque chuchotement semble porter la force de dix. \n \nEnsemble, les voix sont une cacophonie de murmures plutôt que les voix douces des neuf bonnes présentes. Une des servantes est alertée par votre présence, et s'approche de vous. « Ma dame souffre d'une maladie, prêtresse, et a besoin de la bénédiction de Mullo », dit faiblement la vieille femme, l'énergie soudainement déployée pendant le voyage ayant disparu. \n \n"Je vois" dit la prêtresse avec hésitation. 'Viens avec moi'. Vous vous retournez pour dire au revoir à la vieille femme, mais elle a disparu et vous décidez de rattraper la prêtresse à la place. Vous arrivez tous les deux à un ruisseau un peu plus tard où la prêtresse s'arrête. \n \n« Mullo est un dieu bienveillant, mais rien n'est donné gratuitement », murmure-t-elle presque, et de son manteau elle sort un petit pot qu'elle vous tend. « Boire » est tout ce qu'elle dit alors qu'elle s'éloigne de vous à cinq longs pas. \n \nVous buvez abondamment et bientôt le monde commence à tourner violemment. « Dors », vous entendez la voix étouffée de la prêtresse, mais le monde est devenu sombre et renversé, et tout ce que vous voyez est la lune basse au-dessus, hors de votre portée."
 flavor_gaul.2.da:0 "Vous vous réveillez le lendemain, seul. Vous ne vous souvenez pas de la nuit passée, mais un parfum particulier emplit votre tente."
 flavor_gaul.2.a:0 "Je ne me suis pas senti mieux depuis longtemps."
 flavor_gaul.2.db:0 "Quand vous reprenez vos esprits le matin, vous avez l'impression d'avoir bu dix fois à la gloire des dieux au cours de la nuit précédente. La prêtresse est introuvable."
 flavor_gaul.2.b:0 "Où est passée cette femme ?"
 flavor_gaul.2.dc:0 "Vous vous réveillez avec une démangeaison et sans aucun souvenir de la nuit qui s'est écoulée. Ce qui vous est arrivé?"
 flavor_gaul.2.c:0 "Ça gratte beaucoup, où est le sureau ?"
 flavor_gaul.2.daf:0 "Vous vous réveillez le lendemain avec le ruissellement du ruisseau, un pot fêlé à la main. Vous vous levez et vous sentez étourdi, mais d'une manière ou d'une autre, votre esprit est remonté."
 flavor_gaul.2.af:0 "Je me sens étrangement bien."
 flavor_gaul.2.dbf:0 "Vous vous réveillez avec seulement un vague souvenir de la veille. La vieille femme est assise près du ruisseau, baigne ses pieds et se retourne pour vous saluer avec un sourire édenté."
 flavor_gaul.2.bf:0 "Comment suis-je arrivé ici?"
 flavor_gaul.2.dcf:0 "Un fort hululement vous réveille le lendemain, et vous vous retrouvez sur une plage entourée de goélands. Vous ressentez immédiatement une douleur lancinante dans l'estomac et devez vous allonger à nouveau."
 flavor_gaul.2.cf:0 "Qu'y avait-il dans ce bol ?"
 flavor_gaul.3.t:0 "L'Oracle des Gallizenes"
 flavor_gaul.3.desc:0 "Les jours passent avec vous campé sur le rivage, attendant anxieusement le retour de la vieille vieille. Un soir, alors que la lune est basse et que le brouillard s'abat sur les plages, une lumière apparaît au-dessus des eaux sombres. \n \nBientôt vous apercevez une lanterne orange fixée à la proue d'un petit bateau, et une fois échouée la vieille se précipite vers vous avec une jeune fille en remorque. La servante est vêtue d'un manteau de lin fin fixé par une broche ornée au-dessus de sa poitrine. \n \n« Une prêtresse, comme mon chef l'a ordonné », déclara la vieille dame avec une révérence feinte. Tandis que la vieille femme en rassemblait d'autres brandissant des torches sur la plage, la prêtresse s'approche de vous. « Vous cherchez une audience avec les dieux », dit-elle d'un ton solennel. Vous essayez de parler, mais elle vous fait taire avec un seul doigt blanc sur vos lèvres. \n \n« Les dieux savent », dit-elle, et vous force à vous mettre à genoux alors que les torches commencent à danser autour de vous dans l'obscurité. La prêtresse commence à chanter d'un ton déchirant, une fois parlant clairement, ensuite en langues, tandis que les femmes et les hommes qui vous entourent murmurent et dansent, les feux tourbillonnant dans l'obscurité. La prêtresse se contracte maintenant, puis se tord et se retourne comme si une force d'un autre monde était au-dessus d'elle, et ses chants se transforment en cris de terreur et de révérence. \n \nSoudain, les incendies s'arrêtent silencieusement et la jeune fille s'effondre devant vous, trempée de sueur. Secouée, elle rampe lentement vers vous et la bonne parle."
 flavor_gaul.3.descf:0 "Le lendemain, vous vous allongez dans un bosquet au centre de l'île. La lune projette des ombres sombres sur le bosquet et en son cœur se trouve une grande pierre sculptée. Neuf silhouettes élancées et masquées l'entourent, chacune chuchotant à une entité invisible, mais chaque chuchotement semble porter la force de dix. \n \nEnsemble, les voix sont une cacophonie de murmures plutôt que les voix douces des neuf bonnes présentes. Une des servantes est alertée par votre présence, et s'approche de vous. "Ma dame demande aux dieux d'être guidés", dit la femme courbée en essayant de faire la révérence, mais elle est redevenue elle-même faible. \n \n"Je veux savoir ce que les dieux me réservent" précisez-vous, mais la prêtresse a déjà attrapé votre main et a commencé à se diriger vers la pierre. Les huit autres se dispersent dans les bois sombres à mesure que vous vous approchez, et celui qui reste vous invite à vous agenouiller devant la pierre. \n \nElle prend un bol en bois et le soulève vers la lune au-dessus et commence à chanter. Le chant change d'intensité, mais vous restez agenouillé, jusqu'à ce que la prêtresse s'arrête soudainement et que le contenu du bol soit versé sur vous. Vous sentez le fer et la bonne s'agenouille devant vous, met ses mains autour de votre oreille et parle doucement."
 flavor_gaul.3.a:0 "Vous avez honoré les dieux, ils éclaireront votre chemin."
 flavor_gaul.3.b:0 "Attendez-vous à l'inattendu, l'avenir est difficile à deviner."
 flavor_gaul.3.c:0 "Ayez peur, car les dieux voient la malchance sur votre chemin."
 flavor_gaul.4.desc:0 "Les jours passent avec vous campé sur le rivage, attendant anxieusement le retour de la vieille vieille. Un soir, alors que la lune était basse et que le brouillard s'élevait sur les plages, une lumière apparaît au-dessus des eaux sombres. \n \nBientôt vous apercevez une lanterne orange fixée à la proue d'un petit bateau, et une fois échouée la vieille se précipite vers vous avec une jeune fille en remorque. La servante est vêtue d'un manteau de lin fin fixé par une broche ornée au-dessus de sa poitrine. \n \nMalgré un éclat de rire hystérique, la vieille femme parvient à parler. "Les mers me semblent bien, mais qu'est-ce que la vieille femme sait!" En ricanant, elle vous laisse avec la jeune femme. « Vous cherchez les conseils de Toutatis ? demande-t-elle avant de se détourner de vous vers la mer sans attendre de réponse. \n \nElle vous tend la main et vous la saisissez avec hésitation. Elle vous entraîne dans l'eau froide, et son chant tremblant est tout ce que vous pouvez entendre par-dessus le fracas des vagues qui vous enveloppent. Vous tenez fermement la main de la prêtresse, craignant que la vague ne l'emporte dans la mer. \n \nLes vagues de froid submergent maintenant sa tête dorée, mais elle continue avec vous. La dernière chose que vous voyez, ce sont les eaux sombres de la mer froide, et la dernière chose que vous entendez, c'est un mugissement profond sous la mer."
 flavor_gaul.4.descf:0 "Le lendemain, vous vous allongez dans un bosquet au centre de l'île. La lune projette des ombres sombres sur le bosquet et en son cœur se trouve une grande pierre sculptée. Neuf silhouettes élancées et masquées l'entourent, chacune chuchotant à une entité invisible, mais chaque chuchotement semble porter la force de dix. \n \nEnsemble, les voix sont une cacophonie de murmures plutôt que les voix douces des neuf bonnes présentes. Une des servantes est alertée par votre présence, et s'approche de vous. \n \n« Ma dame demande conseil à… » commença la vieille femme, mais elle est interrompue par la prêtresse. 'Toutatis. Oui, nous savons. La vieille femme rit et vous lança un regard bizarre en quittant le bosquet. \n \nLa prêtresse vous presse de la suivre dans la forêt, et vous marchez en silence. Lorsque vous sortez sur le rivage, la lune est encore basse et le soleil n'est pas encore levé. « Toutatis exige sa preuve » dit-elle solennellement en vous saisissant la main. \n \nAvec vous en remorque, elle marche dans les vagues froides et noires et commence à chanter un hymne divin. Vous craignez d'être tous les deux emportés par la vague, de ne plus jamais être revus, mais la prêtresse continue sans relâche. \n \nAlors que les vagues engloutissaient vos têtes, vous raffermissez votre prise et vous ne pouviez entendre que faiblement le chant par-dessus la ruée vers l'océan. La dernière chose que vous voyez, ce sont les eaux sombres de la mer froide qui vous submergent, et la dernière chose que vous entendez, c'est un beuglement profond sous la mer."
 flavor_gaul.4.da:0 "Vous vous réveillez sur la plage ensoleillée, toussant violemment avec une douleur fulgurante dans la poitrine. Au-dessus de vous se dresse la vieille femme, qui vous a apparemment sauvé des profondeurs. Elle vous sourit sans dents."
 flavor_gaul.4.a:0 "Je déteste cette vieille."
 flavor_gaul.4.db:0 "La prêtresse vous réveille, souriant légèrement avec le soleil semblant enflammer ses cheveux dorés. 'Morideus Toutatis', dit-elle doucement en enlevant le sable de votre poitrine."
 flavor_gaul.4.b:0 "Le vent du dieu me favorise !"
 flavor_gaul.4.dc:0 "Soudain submergé par la peur la plus profonde, vous entraînez la prêtresse vers la terre ferme malgré ses protestations. Une fois de retour en toute sécurité sur la plage, elle vous regarde d'un air vide."
 flavor_gaul.4.c:0 "Que faisait-elle?!"
 flavor_gaul.5.desc:0 "Les jours passent avec vous campé sur le rivage, attendant anxieusement le retour de la vieille vieille. Un soir, alors que la lune est basse et que le brouillard s'abat sur les plages, une lumière apparaît au-dessus des eaux sombres. \n \nBientôt vous apercevez une lanterne orange fixée à la proue d'un petit bateau, et une fois échouée la vieille se précipite vers vous avec une jeune fille en remorque. La servante est vêtue d'un manteau de lin fin fixé par une broche ornée au-dessus de sa poitrine. « Voici celui qui a besoin d'une lance » dit joyeusement la vieille vieille et pointe vers vos régions inférieures, avec un sourire terrifiant divisant son visage ridé. \n \nFrissonnant, vous vous tournez vers la prêtresse qui s'approche lentement de vous. « Smertrios exige qu'un sacrifice soit fait », murmure-t-elle. « Vous savez ce qu'il demande », poursuit-elle, et vous le savez. Vous sortez votre lame et tendez sa poignée vers elle. Elle l'attrape et place le fer froid dans votre main, et commence à chanter en jouant avec la lame. \n \nLe chant est doux au début, mais gagne en intensité à mesure qu'elle vous coupe la main, le sang imbibant le sable en dessous. Vous vous sentez faible, et alors que la prêtresse se met à crier, vous tombez à genoux, les ténèbres vous enveloppant."
 flavor_gaul.5.descf:0 "Le lendemain, vous vous allongez dans un bosquet au centre de l'île. La lune projette des ombres sombres sur le bosquet et en son cœur se trouve une grande pierre sculptée. Neuf silhouettes élancées et masquées l'entourent, chacune chuchotant à une entité invisible, mais chaque chuchotement semble porter la force de dix. \n \nEnsemble, les voix étaient une cacophonie de murmures plutôt que les voix douces des neuf bonnes présentes. Une des servantes est alertée par votre présence, et s'approche de vous. 'Prêtresse, notre dame souhaite l'aide de Smertrios' croasse la vieille femme. \n \n'Et il exigera un sacrifice' répond la servante, avant de fixer la vieille femme. « Laissez-nous », dit-elle, non sans méchanceté, et la vieille femme se précipite. Vous rejoignez la prêtresse à la pierre dans le bosquet, et les huit autres sont maintenant parties. \n \nLa prêtresse détache un poignard de sa ceinture et place la lame dans votre main, tout en vous regardant dans les yeux. Elle commence à psalmodier, et peu à peu le poignard vous coupe la chair, faisant couler du sang dans l'herbe. \n \nLe chant de la prêtresse s'intensifie à mesure qu'elle coupe plus profondément, et à l'apogée, elle hurle d'exaltation apparente alors que la douleur dans votre main devient trop forte pour être supportée. Vos yeux s'assombrissent et vous vous effondrez à genoux avec des ombres qui vous enveloppent."
 flavor_gaul.5.da:0 "Vous résistez à la douleur et la prêtresse vous aide à vous relever. D'une voix rauque, elle dit "Smertrios est ravi de votre courage" et vous montre la lame rouge, scintillante au clair de lune."
 flavor_gaul.5.a:0 "Smertrios guidera ma main."
 flavor_gaul.5.db:0 "Vous vous réveillez des heures plus tard, alors que la lumière commence à l'est. La prêtresse se tient au-dessus de vous, sans expression. Alors que vous essayez de vous asseoir, elle s'éloigne."
 flavor_gaul.5.b:0 "Je ne me sens pas plus fort."
 flavor_gaul.5.dc:0 "Vous vous réveillez le lendemain, avec une douleur lancinante dans la main. Il est maculé de votre sang et vous vous sentez faible."
 flavor_gaul.5.c:0 "Cela ne semble pas bon du tout."
 flavor_gaul.6.t:0 "La Ligue lugienne - Une proposition amicale"
 flavor_gaul.6.desc:0 "Maintenant que nous nous sentons en sécurité dans nos possessions, il a été décidé que nous devrions rechercher des relations amicales avec les tribus voisines, afin de garantir la prospérité future de Boihemia. Il y a des tribus dans notre nord, les Vandales, qui feraient de bons alliés - peut-être pourrions-nous envoyer des émissaires et déterminer s'il y a un intérêt à former une ligue ? Le nombre fait la force."
 flavor_gaul.6.a:0 "Envoyez nos meilleurs diplomates et dites-leur d'être généreux."
 flavor_gaul.7.t:0 "La Ligue Lugienne - Une Offre Suggestive"
 flavor_gaul.7.desc:0 "Des ambassadeurs de Boihaemia sont venus nous voir avec une offre. Le dirigeant boihémien, [GetCountry('BOA').GetRuler.GetName], suggère que nous rejoignions une ligue sous sa protection, car le nombre fait la force. \n \nLa proposition est scandaleuse, mais nous n'aurons peut-être pas le choix. L'état perpétuel de conflit et d'incertitude causé par les combats sans fin entre les tribus vandales a considérablement appauvri Vandalia, de sorte que nous n'avons aucune chance contre la puissance boihémienne."
 flavor_gaul.7.a:0 "Rejoignez la Ligue."
 flavor_gaul.7.b:0 "Défendez notre souveraineté !"
 flavor_gaul.8.t:0 "La Ligue Lugienne - Réponses"
 flavor_gaul.8.desc:0 "Il n'y a pas longtemps, nous avons envoyé des émissaires à travers Vandalia. Ils ont été chargés de persuader autant de pouvoirs locaux que possible de rejoindre une ligue sous notre direction afin d'assurer leur sécurité en ces temps turbulents. Aujourd'hui, tous nos émissaires sont enfin revenus."
 flavor_gaul.8.a:0 "Très bien..."
 flavor_gaul.8.desc_1:0 "Un bon nombre d'États ont accepté! \n \n[GetCountry('BOA').GetRuler.GetPraenomen] est honoré et honoré par la confiance que les Vandales ont placée en [GetCountry('BOA').GetRuler.GetHerHim]. Notre souverain proclame la naissance de la Ligue Lugienne, chargée de défendre les commerçants de la Route de l'Ambre sous l'œil bienveillant et protecteur de [GetCountry('BOA').GetName]."
 flavor_gaul.8.desc_2:0 "Malheureusement, ils apportent de mauvaises nouvelles ; aucun pays n'a accepté notre offre. \n \nIl n'y a aucun moyen de les raisonner maintenant."
 flavor_gaul.8.tt:0 "La tâche de la mission est terminée."
 flavor_gaul.8.tt1:0 "Aucune tribu vandale n'accepte notre offre."
 flavor_gaul.8.at:0 "[THIS.GetCountry.MakeScope.GetVariable('bohemian_league_counter_var').GetValue|0Y] Les États vandales ont accepté et ont été combinés comme nouveau sujet le [lugian_league_head_scope .GetFlag][lugian_league_head_scope .GetName] !."
 flavor_gaul.9.t:0 "Une Fédération Boian"
 flavor_gaul.9.desc:0 "Depuis aussi longtemps que notre peuple s'en souvienne, nous avons erré à volonté ; bien que nous puissions temporairement nous enraciner, les Boii ont toujours migré vers de nouvelles terres quand cela nous convenait - c'est ainsi que les choses ont été faites. Cet état des choses a été satisfaisant mais une période de changement est à nos portes, et bien que certains résistent aux efforts de centralisation proposés par [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], ils vont bientôt acquiescer. En s'unissant dans une tribu fédérée, les avantages potentiels sont multiples - nous le verrons tous avec le temps."
 flavor_gaul.9.a:0 "Je n'oublierai pas la confiance que vous m'avez accordée"

 flavor_gaul.10.t:0 "La norme boihémienne"
 flavor_gaul.10.desc:0 "Un matin, vous rompez votre jeûne avec de la viande froide, restes du repas de la veille, lorsqu'un conseiller entre, traînant pratiquement un lourd sac en toile de jute derrière lui. En gesticulant avec un os de lapin à la main, vous demandez ce qu'ils transportent, et à votre grande surprise, une poignée de pièces d'or vous est offerte. 'Ah oui, maintenant je me souviens.' dis-tu entre deux bouchées. Oui, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], nous avons reçu le premier lot de pièces que vous avez commandé. Ce seront les nouvelles normes utilisées sur nos terres. \n \n Prenant un long coup de votre tasse, vous prenez l'une des pièces et la tenez à la lumière, où l'or scintille comme un feu, et vous êtes immédiatement frappé par le visage effrayant sur l'avers."
 flavor_gaul.10.a:0 "C'est à quoi je ressemble, hein ? Je n'ai pas vu une plus belle pièce de monnaie"
 flavor_gaul.10.tt:0 "The mission task '#Y The Boihaemian Standard#!' has now been #G Completed#!!"

 flavor_gaul.11.t:0 "Le Grand Temple de Baemia"
 flavor_gaul.11.desc:0 "Vous êtes assez vieux pour vous souvenir de l'époque où la Baemia n'était qu'un simple village, un endroit qui ne vaut pas la peine d'être mentionné dans l'arrière-pays de la capitale, mais les choses ont changé sous votre direction. Non seulement une véritable ville a remplacé les taudis délabrés et les appentis qui parsemaient autrefois le paysage boisé, mais une réalisation encore plus grande a été réalisée ; un Grand Temple, comme on n'en a jamais vu aussi loin au nord, a été construit au cœur de la nouvelle ville de Baemia."
 flavor_gaul.11.a:0 "Enfin, un véritable lieu de culte, digne des puissants Boihaemians."
 flavor_gaul.11.tt:0 "The mission task '#Y The Great Temple of Baemia#!' has now been #G Completed#!!"

 flavor_gaul.12.t:0 "Écraser les Allemands"
 flavor_gaul.12.desc:0 "Nous avons appris que nos anciens ennemis, les tribus méprisables des Quadi et des Marcomanni, ont été complètement détruits par nos hommes et sont dispersés comme des chiens dans les bois et les forêts de leurs anciennes patries. Ils ont été complètement ruinés et ne pourront plus jamais remettre en cause notre hégémonie ; c'est une réalisation remarquable, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]."
 flavor_gaul.12.a:0 "Nous n'avons pas fini, mais nous commençons seulement notre travail."
 flavor_gaul.12.tt:0 "The mission task '#Y Crushing the Germans#!' has now been #G Completed#!!"

 flavor_gaul.13.t:0 "Destruction dace"
 flavor_gaul.13.desc:0 "Autrefois, nous avions beaucoup à craindre des féroces Daces, certains membres de notre propre tribu osant dire que nous étions inférieurs à nos rivaux orientaux à tous égards, en particulier militairement. Alors que vous vous hérissiez de ces critiques, les considérant comme des attaques à peine voilées contre votre leadership, vous avez une fois de plus remporté la victoire contre vos ennemis, faisant taire les langues agitées de ceux qui remettent en question votre autorité. En fin de compte, le Dacian Falx n'était pas à la hauteur de la Boian Spear !"
 flavor_gaul.13.a:0 "Nous n'aurons plus à nous soucier des Daces."
 flavor_gaul.13.tt:0 "The mission task '#Y Dacian Destruction#!' has now been #G Completed#!!"

 flavor_gaul.14.t:0 "Migrations boihémiennes"
 flavor_gaul.14.desc:0 "Nous avons envoyé certains de nos meilleurs hommes dans le nord dans le but exprès de trouver des territoires propices à notre expansion, et leurs premiers rapports sont prometteurs. Nos éclaireurs ont avancé à travers de vastes étendues de terre, ne s'arrêtant qu'aux contreforts des montagnes, et sont revenus avec des histoires de forêts vierges, de champs herbeux qui seraient parfaits pour l'élevage, et même de grands gisements d'argile sont présents - nous pourrions commencer fabrication de vases en terre cuite. Il y aura des coûts associés à cet effort de colonisation, bien sûr, mais vous vous y êtes préparé à l'avance, n'est-ce pas ?"
 flavor_gaul.14.a:0 "Nous avons la pièce pour financer cela"
 flavor_gaul.14.b:0 "Nos cordons de bourse sont serrés, mais nous avons la main-d'œuvre"
 flavor_gaul.14.c:0 "À la réflexion, j'ai changé d'avis - dis-leur d'arrêter"
 flavor_gaul.14.tt:0 "The mission task '#Y Boihaemian Migrations#!' has now been #G Completed#!!"

 flavor_gaul.15.t:0 "Les terres entre les montagnes"
 flavor_gaul.15.desc:0 "Mon chef, notre peuple s'épanouit dans les provinces nouvellement colonisées où vous nous avez si sagement conduits, et les histoires des champs fertiles et des forêts vierges inspirent davantage de nos gens à quitter leurs maisons et à s'installer loin. Il y a des royaumes entre les montagnes que nous devons encore coloniser, mais nous devrions redoubler d'efforts et les sécuriser immédiatement - pourquoi, pourriez-vous demander ? On y trouve une bonne chasse, avec beaucoup d'animaux sauvages à piéger pour leur fourrure, et la pierre et le pastel se trouvent en abondance dans ces régions."
 flavor_gaul.15.a:0 "Les coûts sont négligeables - j'ordonne que ce soit fait"
 flavor_gaul.15.b:0 "Nous serons un peu éparpillés, mais ça vaut le coup d'arrêt temporaire"
 flavor_gaul.15.c:0 "La hâte fait du gaspillage - contentons-nous de ce que nous avons"

 flavor_gaul.16.t:0 "Bassin Boihémien"
 flavor_gaul.16.desc:0 "Maintenant que nous avons colonisé les terres au nord, un vieil adage me vient à l'esprit ; plus vous en avez, plus il semble y avoir de problèmes. Nous sommes confiants dans nos capacités à défendre notre patrie contre quiconque pourrait nous défier, pourtant, comparé à nos autres possessions, notre flanc oriental est honteusement exposé. Et il ne fait aucun doute que les tribus de notre sud, une fois qu'elles auront vent de notre croissance, pourraient essayer de se rapprocher de nous, dans l'espoir de nous empêcher de nous développer davantage. Cela étant dit, nous devrions envisager de pousser vers l'est - certaines des rivières locales constitueraient une bonne frontière naturelle. Qu'en penses-tu?"
 flavor_gaul.16.a:0 "Nous avons la volonté et la main-d'œuvre - ce sera comme vous le dites"
 flavor_gaul.16.b:0 "Envoyez des colons immédiatement, peu importe le coût"
 flavor_gaul.16.c:0 "Tout en temps voulu... le moment n'est pas maintenant"

 flavor_gaul.17.t:0 "Le Bassin Boihémien"
 flavor_gaul.17.desc:0 "Ô Chef, nous avons besoin de votre permission pour une nouvelle initiative. Il semble que nous ayons un petit problème de surpeuplement, mais heureusement, c'est quelque chose qui se règle facilement. Autrement dit, notre peuple réclame de nouvelles terres à habiter ; notre nombre augmente de jour en jour et les pâturages sur lesquels nous paissons actuellement ne suffiront pas à soutenir notre croissance future. Et pourtant nous sommes entourés de terres attrayantes, avec de bons champs et beaucoup de ressources naturelles à prendre, et si vous donnez seulement le mot, nous enverrons les équipes de reconnaissance. S'ils trouvent des territoires satisfaisants pour nos besoins, vous serez les premiers informés."
 flavor_gaul.17.a:0 "Cela me plaît - je donne ma bénédiction"

 flavor_gaul.18.t:0 "Passé les montagnes"
 flavor_gaul.18.desc:0 "Chef, quand je vous annoncerai cette nouvelle, vous serez sans aucun doute aussi excité que nous le sommes tous. Il est vrai que nous nous sommes dispersés sur toutes les terres que vous commandez maintenant, mais nous avons trouvé encore plus de territoires qui valent la peine d'être pris. Juste au nord des montagnes des Sudètes, les provinces regorgent d'animaux sauvages et les carrières de pierre de Gothinia ne demandent pratiquement qu'à être vidées. Honnêtement, nos gens sont déjà là... vous n'avez qu'à le rendre officiel."
 flavor_gaul.18.a:0 "C'est excellent - faites en sorte que cela se produise"
 flavor_gaul.18.b:0 "Pourquoi m'embêtez-vous avec ça ? N'en ai-je pas assez fait ?"

 flavor_gaul.19.t:0 "Le Commonwealth boiohémien"
 flavor_gaul.19.desc:0 "Enfin, l'heure de notre victoire complète et totale est arrivée ! Grâce à [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], qui a guidé notre chemin à chaque étape du chemin, nous avons accompli beaucoup de choses ; l'expansion de nos territoires, la croissance de nos revenus commerciaux. Jamais auparavant dans notre histoire les Boii n'ont eu autant de succès, jamais nous n'avons été aussi grands que nous le faisons maintenant ; que les dieux continuent de bénir nos efforts !"
 flavor_gaul.19.a:0 "De grands moments nous attendent !"

 flavor_gaul.199.t:0 "The Rise Of Boihaemia"
 flavor_gaul.199.desc:0 "Early this morning, a simple and unassuming ceremony took place at [ROOT.GetCountry.GetCapital.GetName], and although the sun had barely risen over the horizon, there were hundreds of attendants present for the momentous occasion. [ROOT.GetCountry.GetRuler.GetName] had called for all of the #E Tribal Elders#! to gather at the capital, for the [ROOT.GetCountry.GetRulerTitle] did not wish to draw any unnecessary attention to [ROOT.GetCountry.GetRuler.GetHerHim]self. The reason for this meeting was simple; now that we have grown into a mighty nation, the people are clamoring for a new form of governance.\n\nThanks to [ROOT.GetCountry.GetRuler.GetFirstName]'s preeminent status in our nation, the choice ultimately belongs to [ROOT.GetCountry.GetRuler.GetHerHim]."
 flavor_gaul.199.a:0 "I promise to wield my authority as Monarch responsibly"
 flavor_gaul.199.b:0 "All of the power in [ROOT.GetCountry.GetName] lies with the people"
 BOHEMIAN_REPUBLIC_FINAL_NAME:0 "Boihaemian Republic"


 flavor_gaul.20.t:0 "Les côtes de Cantabrie"
 flavor_gaul.20.desc:0 "Ce matin, nous avons appris que les premières importations de la province de Cantabrie, notre dernière conquête, ont atteint [SCOPE.GetRootScope.GetCountry.GetCapital.GetName], provoquant une grande agitation sur les marchés alors que chacun se bouscule pour acheter ce qu'il peut. Alors que les pierres précieuses de cette région ne sont vendues qu'aux plus riches, le cuir fin de Cantabrie est recherché par tous, riches et pauvres, sans doute en raison de sa finesse particulière. \n \nAlors que vous réfléchissez au brouhaha des rues, vous vous souvenez qu'il existe d'autres problèmes concernant la Cantabrie qui nécessitent votre attention. Que réserve l'avenir à cette province?"
 flavor_gaul.20.a:0 "Tenons les Cantabres en laisse"
 flavor_gaul.20.a.tt:0 "Nous libérerons la province en question comme État client."
 flavor_gaul.20.b:0 "Nos territoires principaux s'étendent et prospèrent sous notre domination"
 flavor_gaul.20.b.tt:0 "Nous garderons nos terres et accélérerons l'assimilation des nouveaux assujettis."
 flavor_gaul.21.t:0 "L'avenir de la Lusitanie"
 flavor_gaul.21.desc:0 "Lors d'une journée particulièrement chargée, remplie de réunions avec les propriétaires fonciers locaux et leurs préposés qui ont pris la majeure partie de la matinée, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] a été rappelé par un conseiller des questions loin de l'arrière-pays de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] ; la province de Lusitanie. Après avoir remis le dossier à plus tard, sans doute en raison de notre emploi du temps chargé, nous devons prendre une décision quant à la manière dont ce territoire va être administré."
 flavor_gaul.21.a:0 "Toutes les provinces ne sont pas dignes d'être considérées comme notre patrie"
 flavor_gaul.21.a.tt:0 "Nous libérerons la province en question comme État client."
 flavor_gaul.21.b:0 "Les Lusitaniens finiront par adopter nos voies"
 flavor_gaul.21.b.tt:0 "Nous garderons nos terres et accélérerons l'assimilation des nouveaux assujettis."
 flavor_gaul.22.t:0 "Mons Calpe"
 flavor_gaul.22.desc:0 "Nos armées victorieuses ont conquis partout, transformant ces villes assez folles pour résister en cendres et en misère. Non seulement nous avons dominé les tribus qui se chamaillent qui nous entourent, mais nous nous sommes opposés à de plus grandes puissances et avons tenu bon, prouvant que nous ne sommes pas des barbares mais l'égal de tous. Maintenant, dans ce bref moment de répit, alors que nous pouvons célébrer nos succès, décidons de l'avenir de certaines de nos plus récentes possessions."
 flavor_gaul.22.a:0 "La propriété pure et simple est tentante, mais c'est une question de réputation"
 flavor_gaul.22.a.tt:0 "Nous libérerons la province en question comme État client."
 flavor_gaul.22.b:0 "En absorbant ces villes antiques, notre légende grandit"
 flavor_gaul.22.b.tt:0 "Nous garderons nos terres et accélérerons l'assimilation des nouveaux assujettis."
 flavor_gaul.23.t:0 "Décisions frisonnes"
 flavor_gaul.23.desc:0 "Alors que les anciens se réunissaient pour un conseil aujourd'hui, l'un des points les plus urgents à l'ordre du jour était certainement la question de la Frise, et plus précisément ce que nous pensons être fait avec la région maintenant que nous avons pleinement établi le contrôle."
 flavor_gaul.23.a:0 "Avoir un autre État client sert nos intérêts"
 flavor_gaul.23.a.tt:0 "Nous libérerons la province en question comme État client."
 flavor_gaul.23.b:0 "Nous garderons ce territoire comme le nôtre"
 flavor_gaul.23.b.tt:0 "Nous garderons nos terres et accélérerons l'assimilation des nouveaux assujettis."
 flavor_gaul.24.t:0 "Les orcades lointaines"
 flavor_gaul.24.desc:0 "Lorsque nous réfléchissons à nos origines simples et que nous les comparons à nos circonstances actuelles, nous sommes humiliés par les vastes responsabilités que nous ont confiées les dieux ; qui aurait pu prévoir à quel point notre domination deviendrait expansive ? Même les terres lointaines des mythes marins sont devenues une réalité que nous embrassons avec impatience. Nous devons maintenant faire un choix; absorbons-nous ces îles lointaines ou créons-nous un autre État client ?"
 flavor_gaul.24.a:0 "Ils nous serviront mais garderont certains privilèges"
 flavor_gaul.24.a.tt:0 "Nous libérerons la province en question comme État client."
 flavor_gaul.24.b:0 "Les Orcades feront toujours partie de notre patrie"
 flavor_gaul.24.b.tt:0 "Nous garderons nos terres et accélérerons l'assimilation des nouveaux assujettis."
 flavor_gaul.25.t:0 "Les Maîtres de l'Atlantique"
 flavor_gaul.25.desc:0 "Il y a quelques semaines, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] a ordonné à ses conseillers de se réunir à [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] pour une réunion importante. Lorsque le jour fixé est arrivé, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] s'est solennellement tenu devant l'assemblée réunie et a parlé avec audace, rappelant notre histoire récente et les succès inimaginables dont notre peuple a été béni. Terminant ce discours par "Le jour est venu où le monde doit reconnaître que nous sommes les maîtres de l'Atlantique", la salle a éclaté en acclamations tumultueuses. \n \nLevant la main et exigeant le silence, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] s'est alors demandé à haute voix si nous devions changer notre système de gouvernance afin de refléter notre changement de circonstances."
 flavor_gaul.25.a:0 "Notre richesse nous a amenés à ces hauteurs élevées et reste notre priorité"
 flavor_gaul.25.b:0 "Proclamez au monde que notre ère est arrivée !"
 flavor_gaul.26.t:0 "Un triomphe romain"
 flavor_gaul.26.desc:0 "Nous avons humilié l'une des grandes puissances de l'Italie, les Romains belliqueux, en expulsant ces tyrans de leur propre capitale - certainement une ironie amère pour eux, car ce qu'ils ont impitoyablement fait à tant d'autres leur a été fait. Les histoires sur le siège de Rome se sont répandues dans votre armée, les prouesses de nos hommes atteignant un statut presque mythique. Même maintenant, dans des cours éloignées en dehors de nos sphères d'influence, des rois nerveux rassemblent leurs conseillers, demandant à bout de souffle la force de nos armées et de nos flottes ; sommes-nous un danger ? \n \nBien - qu'ils nous craignent tous."
 flavor_gaul.26.a:0 "Célébrez les soldats! C'est eux qui ont fait ça"
 flavor_gaul.27.t:0 "Le goût du luxe"
 flavor_gaul.27.desc:0 "Alors que nos enchevêtrements étrangers ont certainement été un avantage pour l'État, il y a d'autres changements, parfois imperceptibles, qui accompagnent tout ce qui est nouveau ; c'est ainsi qu'il en a été et qu'il en sera toujours. \n \nPour le dire franchement, notre peuple s'habitue aux bonnes choses de la vie, important des produits de luxe des rois de l'Est et dépensant une quantité stupéfiante de pièces pour payer ces articles. Jour après jour, nos ports sont remplis de marchands, colportant des cargaisons de soie et d'aromates provenant de déserts situés au bout du monde, et notre peuple ne peut tout simplement pas en avoir assez. Mais qui sont ces étrangers, au juste, qui nous apportent des choses étranges comme du « sucre » ? Personne n'a jamais entendu parler de telles choses. Espérant généralement mieux comprendre ces régions lointaines, et peut-être établir plus de relations commerciales dans le processus, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] a décidé d'envoyer un groupe d'aventuriers vers l'est, leur demandant de découvrir tout ce qu'ils peuvent."
 flavor_gaul.27.a:0 "Je me demande ce que ces aventuriers vont trouver..."
 flavor_gaul.28.t:0 "Influences cosmopolites"
 flavor_gaul.28.desc:0 "Il y a quelques semaines, il a été ordonné qu'un groupe d'aventuriers, de vaillants guerriers triés sur le volet parmi nos troupes, se dirige vers l'est pour une sorte de mission de reconnaissance, et ils sont enfin revenus ! Ordonnant que les hommes soient amenés immédiatement, s'exclamant qu'ils auront l'occasion de se reposer après avoir fait leurs rapports, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] se précipita à leur rencontre, impatient d'entendre ce qu'ils avaient appris. \n \nPermettant aux soldats épuisés de s'allonger, le vin est versé et les histoires commencent à couler à côté. Nos hommes ont navigué vers l'est, suivant les eaux de la Méditerranée jusqu'à leur fin, errant le long des côtes et s'arrêtant dans toutes les grandes villes en cours de route. Avec des voix s'élevant dans l'excitation, on dit qu'ils ont même visité l'ancienne terre de [GetProvince('(int32)7691').GetArea.GetRegion.GetName]. Nos hommes parlent des hospitalités qu'on leur a témoignées, disant qu'il y a beaucoup de merveilles à voir dans ces terres lointaines, pourtant de terribles guerres ont secoué la région pendant des siècles ; les querelles des rois alors qu'ils détruisent la paix pour leurs propres ambitions. \n \n[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] demande si les hommes sont revenus avec quelque chose, et sourit en apprenant qu'il y a un véritable trésor d'informations dans les soutes de nos navires ; non seulement nous possédons d'excellentes cartes de la région, mais nos aventuriers ont eu la prévoyance d'acheter autant de rouleaux et de textes qu'ils pouvaient trouver - textes philosophiques, traités médicaux, histoires et généalogies. Notre peuple apprécie la sagesse et nous apprendrons beaucoup des écrits des étrangers."
 flavor_gaul.28.a:0 "Un toast à votre mission réussie !"
 flavor_gaul.29.t:0 "Une Terre Agréable"
 flavor_gaul.29.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], maintenant que nous avons vaincu nos ennemis, nous devons prendre une décision. Comme vous le savez, c'est notre habitude de construire une ville dans les territoires nouvellement conquis, car nous trouvons que c'est ce qu'il y a de mieux en matière d'administration locale. Où allons-nous commencer la construction maintenant ? J'ai entendu dire qu'il y a plusieurs endroits à notre disposition, tous de bons candidats pour nos projets futurs."
 flavor_gaul.30.t:0 "Extension sud"
 flavor_gaul.30.desc:0 "Les montagnes et les collines au sud n'étaient pas un obstacle pour nos forces, habituées à traverser des terrains difficiles ; si nos ennemis pensaient pouvoir se cacher de nous dans les forêts et les contreforts, ils se trompaient lourdement. Maintenant que nous avons soumis la région, nous devons choisir un endroit pour construire une ville ; ayant combattu pour revendiquer ces terres pour nous-mêmes, nous ne les quitterons plus jamais."
 flavor_gaul.31.t:0 "Gains génois"
 flavor_gaul.31.desc:0 "Nous avons conquis le littoral de Gênes, étendant nos possessions jusqu'aux eaux du Sinus Genuensis, qui fait la fierté de [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. Autrefois, nos peuples vivaient sur les flancs des montagnes, mais maintenant, nous nous déversons comme une rivière dans la mer. Il y a beaucoup à célébrer dans [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] ce soir, mais nous devons d'abord prendre nos décisions quant à ce que nous ferons de nos nouvelles terres."
 flavor_gaul.32.t:0 "Victoire sur la Vénétie"
 flavor_gaul.32.desc:0 "Chevaux, olives, poisson, sel ; les terres sur lesquelles les Vénitiens vivaient autrefois sont vraiment bénies des dieux, remplies de ressources que nous prendrons avec plaisir. Il n'est pas étonnant qu'ils se soient battus avec autant d'acharnement, car qui voudrait renoncer à cette richesse naturelle ? Heureusement, ils n'ont pas pu nous empêcher de nous développer... maintenant, une nouvelle question se pose. Nous devrions choisir un endroit pour construire, afin d'ancrer notre pouvoir dans cette région."
 flavor_gaul.33.t:0 "Fin des Étrusques"
 flavor_gaul.33.desc:0 "Depuis de nombreuses années, nous connaissons les Étrusques ; leurs villes fortifiées, remplies de richesses comme nous n'en avons jamais vues, ont longtemps tenté nos soldats, qui ne désiraient rien de plus que d'escalader leurs redoutables murailles et de les prendre pour les nôtres. Jamais du genre à refuser à nos combattants ce qu'ils veulent, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] a donné l'ordre d'envoyer nos soldats au cœur de l'Étrurie. Tout ce qui leur a été demandé, ils l'ont réalisé, et maintenant toute notre nation le célèbre. Nous avons maintenant l'agréable corvée de déterminer l'avenir de cette région."
 flavor_gaul.34.t:0 "L'Avenir de la Corse"
 flavor_gaul.34.desc:0 "Aujourd'hui est un grand jour pour notre peuple, car nous nous sommes étendus à l'île de Corse et l'avons prise pour nous. Comme nos ancêtres seraient fiers de nous ! Voir leurs fiers descendants, prendre les vagues, conquérir des îles lointaines, les maîtres incontestés de la terre et de la mer... ils béniraient certainement nos efforts. Allons, décidons que faire de la Corse ; ce que vous dites, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]?"
 flavor_gaul.35.t:0 "Cendres romaines"
 flavor_gaul.35.desc:0 "Notre dernière guerre touche à sa fin, et la nouvelle de notre victoire s'est largement répandue, voyageant bien au-delà des côtes de [GetProvince('(int32)4').GetArea.GetRegion.GetName]. Certains ne peuvent pas croire que nous ayons vaincu les Romains, prétendant qu'une République aussi puissante ne tomberait jamais entre les mains de simples « barbares ». \n \nA tous les sceptiques, nous adressons une invitation ; venez à la ville sur les rives du Tibre et voyez qui contrôle les portes de la ville. Maintenant que nous avons réduit en cendres la République romaine, nous avons des décisions à prendre."
 flavor_gaul.35.a:0 "La ville de Romulus."
 flavor_gaul.35.b:0 "Capoue nous convient bien."
 flavor_gaul.35.c:0 "L'ancienne ville de Neapolis pourrait utiliser quelques nouveaux habitants."
 flavor_gaul.35.d:0 "Ostie est l'endroit."
 flavor_gaul.35.e:0 "Buca, hein ? J'aime ce nom."
 flavor_gaul.36.t:0 "La Magna Grecia soumet"
 flavor_gaul.36.desc:0 "Alors que nous avons conquis tout au long de [GetProvince('(int32)4').GetArea.GetRegion.GetName], nous avons rencontré de nombreux peuples étranges, mais maintenant que nous avons atteint l'extrémité de la péninsule, nous avons posé nos yeux sur des villes anciennes, érigées bien avant que notre peuple ne traverse les Alpes pour la première fois. \n \nMalgré leur supposée supériorité, nous avons massacré les citadins, détruisant leur pouvoir et le remplaçant par le nôtre. [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] a longtemps méprisé les douces villes de Magna Graecia, sachant qu'ils nous prennent pour de simples barbares - quelle journée amère cela doit être pour eux. Maintenant que nous contrôlons la région, décidons de son avenir."
 flavor_gaul.37.t:0 "Le médiolanum se lève"
 flavor_gaul.37.desc:0 "Bien que cela ait nécessité une quantité considérable de ressources, nous avons appris que notre travail dans la province de [GetProvince('(int32)3571').GetName] est enfin terminé - notre ville est terminée depuis un petit moment maintenant, et il y a un nombre respectable de personnes qui y vivent , avec, espérons-le, beaucoup d'autres à venir. [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] a longtemps souligné l'importance de cette région, prévoyant un temps où notre ville finira par dominer toutes les autres. Le temps nous dira si cette prophétie se réalise."
 flavor_gaul.37.a:0 "Nous sommes fiers de ce que nous avons accompli ici."
 flavor_gaul.38.t:0 "Culture italienne"
 flavor_gaul.38.desc:0 "Levant un rhyton à [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] lèvres, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] goûte une partie du vin offert. « Vous dites que ces raisins sont cultivés près du mont Falernus ? Je crois avoir déjà entendu parler de ce type de vin. \n \n'Oui, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]. Le mont Falernus n'est pas très loin d'ici... le trouvez-vous à votre goût ?' La préposée, une danseuse de vingt ans, baisse sagement les yeux en reculant. \n \nEn riant, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] draine [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] klaxon en un instant, faisant signe de le remplir. « Je me sens sensible au vin rhétique, qui est le meilleur que j'ai eu le plaisir de goûter, mais il y a des choses dans la culture ici qui grandissent en moi. » \n \n"Comme la boisson..." se murmure la préposée alors que [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] vide une autre tasse."
 flavor_gaul.38.a:0 "Nos manières sont meilleures, mais nous pourrions apprendre une chose ou deux des Italiens"
 flavor_gaul.39.t:0 "Une république aristocratique"
 flavor_gaul.39.desc:0 "« Et j'attire votre attention, [ROOT.GetCountry.GetRuler.GetFirstName], sur le fait que notre forme actuelle de gouvernance est intenable ; ce qui a autrefois fonctionné pour nos ancêtres ne peut pas fonctionner pour leurs petits-enfants, qui sont les maîtres de bien plus que les montagnes. Pourtant, aucune solution facile ne s'offre à nous. \n \nL'air est étouffant et chaud là où se réunit le Conseil ; une réalité désagréable à laquelle les nobles rassemblés à l'intérieur se sont habitués. Il y a un soulagement palpable dans la salle lorsque [ROOT.GetCountry.GetRuler.GetName] agite la main, signalant que le débat est terminé. \n \n"Peut-être que le moment est venu de changer." Se levant à [ROOT.GetCountry.GetRuler.GetHerHis] pieds, [ROOT.GetCountry.GetRuler.GetFirstName] dit tranquillement "Nous pourrions imiter les manières de ceux qui nous entourent ...""
 flavor_gaul.39.a:0 "La noblesse continuera formellement à nous conduire à la gloire"
 flavor_gaul.40.t:0 "La sécurité est une chose rare dans ce monde"
 flavor_gaul.40.desc:0 "Non seulement avons-nous conclu nos initiatives de construction dans les montagnes, renforçant nos fortifications ancestrales avec toute la puissance de notre puissant État derrière elles, mais nous avons également renforcé nos relations avec la véritable source de défense de notre nation - le peuple. Toutes les familles dirigeantes croient en la vision que [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] a définie pour notre pays, et personne ne remet en question [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] les plans futurs à ce stade. Tout est sécurisé; personne ne conteste notre règle."
 flavor_gaul.40.a:0 "Nous protégerons ceux qui croient en nous"
 flavor_gaul.41.t:0 "Tous les chemins mènent à Mediolanum"
 flavor_gaul.41.desc:0 "Lorsque nous avons vu [GetProvince('(int32)3571').GetName] pour la première fois, ce n'était qu'une fortification, une tour à moitié brisée au milieu d'une belle plaine. Au fil des ans, nos dirigeants ont beaucoup fait pour la ville, et aucune ville de [GetProvince('(int32)4').GetArea.GetRegion.GetName] ne peut rivaliser avec son élégance et son charme. Peu importe d'où l'on voyage - que ce soit Rome, Crotone, Neapolis ou n'importe quelle autre ville - ce qu'ils disent est vrai ; chaque route mène à [GetProvince('(int32)3571').GetName], car il n'y a pas d'autre raison de quitter la maison que de voir cette ville de rêve."
 flavor_gaul.41.a:0 "Nos yeux se larmes à la vue de Mediolanum, la maison de notre peuple"
 flavor_gaul.42.t:0 "Invités du Gaesati"
 flavor_gaul.42.desc:0 "Bien que le prix demandé soit élevé - certains diront qu'il est exorbitant -, qui peut accorder une valeur à l'expérience ? Ceux qui désirent les meilleures choses de la vie doivent souvent payer des primes, et cette affaire avec les Gaesati n'est pas différente des autres. \n \nAvec ces adages à l'esprit, [ROOT.GetCountry.GetRuler.GetName] a accepté de payer les quatre cents pièces nécessaires pour engager un conseiller des Gaesati, les féroces mercenaires gaulois des montagnes. Bien que le prix soit élevé, nous attendons beaucoup de notre nouvel invité, convaincus que la sagesse transmise à nos troupes en vaudra bien le coût."
 flavor_gaul.42.a:0 "Nous avons besoin de toute l'aide que nous pouvons obtenir... l'argent va et vient"
 flavor_gaul.43.t:0 "Les coûts associés"
 flavor_gaul.43.desc:0 "Comme vous le savez bien, [ROOT.GetCountry.GetRuler.GetName], votre dernière commande d'appeler des colons ne peut pas être effectuée gratuitement, et envoyer des voyageurs à travers le pays coûtera cher. Nous avons des chevaux à acheter pour nos émissaires, et les hommes et les chevaux devront être correctement équipés... il y a un grand nombre de coûts associés auxquels nous devons faire face, malheureusement."
 flavor_gaul.43.a:0 "Voici tout ce que nous pouvons nous permettre en ce moment"
 flavor_gaul.43.b:0 "Nous avons plus que nous pourrions donner"
 flavor_gaul.44.t:0 "Colons lépontiques"
 flavor_gaul.44.desc:0 "Il y a quelques semaines, [ROOT.GetCountry.GetRuler.GetName] a pris la décision d'appeler les colons à venir habiter nos territoires les moins peuplés, faisant savoir à travers nos terres que ceux qui seraient assez courageux pour commencer leur vie ailleurs auraient le soutien de l'État. Notre peuple est ambitieux et chaleureux, n'a peur d'aucun défi, et nous avons rapidement eu tous les hommes libres dont nous avions besoin - nous sommes chanceux au-delà de toute mesure, d'être bénis comme nous le sommes. Ces colons se rassemblent près des contreforts de l'[GetProvince('(int32)3617').GetArea.GetName], attendant de savoir où ils seront envoyés."
 flavor_gaul.44.a:0 "Dites à nos gens de voyager loin et loin, de s'installer là où leur cœur le désire"
 flavor_gaul.45.t:0 "Papyrus lépontique"
 flavor_gaul.45.desc:0 "Nous avons des nouvelles passionnantes à vous annoncer de la Bibliothèque royale, o [ROOT.GetCountry.GetRuler.GetName]. Reconnaissant que nos besoins étaient bien supérieurs à ce qui était disponible localement, nous avons commencé à importer du papyrus, dans l'espoir d'enrichir notre propre matériel d'écriture avec cette merveille égyptienne. Le flux constant de papyrus a permis à nos scribes de faire des copies des différents textes dont nous sommes entrés en possession, et notre connaissance a augmenté de façon exponentielle à cause de cela - nous verrons les résultats presque immédiatement, [ROOT.GetCountry.GetRuler.GetFirstName]."
 flavor_gaul.45.a:0 "C'est la meilleure chose que j'ai entendue de toute la journée"

 flavor_gaul.46.t:0 "Honorer nos ancêtres"
 flavor_gaul.46.desc:0 "Croyant fermement que le chef sage reconnaît leurs dettes, [ROOT.GetCountry.GetRuler.GetName] a fait savoir que [ROOT.GetCountry.GetRuler.GetSheHe] honorerait nos ancêtres avec les cérémonies religieuses appropriées, y compris l'une de nos pratiques les plus sacrées et les plus anciennes - l'inhumation en chariot - le moment venu. Bien qu'il soit difficile pour une petite tribu d'obtenir un revenu stable, [ROOT.GetCountry.GetRuler.GetFirstName] a déclaré qu'aucun compromis ne sera épargné et que chaque dépense sera payée sans poser de questions. \n \nAlors que certains déplorent les énormes sommes impliquées dans de telles affaires, la majorité de notre peuple loue la piété de [ROOT.GetCountry.GetRuler.GetFirstName] comme un exemple pour nos jeunes générations."
 flavor_gaul.46.a:0 "Nous ne sommes pas ici pour marchander avec les dieux, mais pour les honorer"
 flavor.gaul.46.tt:0 "The mission task '#Y Honoring The Ancestors#!' has now been #G Completed#!!" 

 flavor_gaul.47.t:0 "Préparatifs pour l'inhumation"
 flavor_gaul.47.desc:0 "Alors que commence la période de deuil de notre précédent chef, [ROOT.GetCountry.GetRuler.GetName] a été approché en privé par les Sages et les Anciens, qui insistent pour que nous honorions nos anciennes habitudes en offrant au défunt un [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName] Wagon Burial approprié. C'est un grand honneur, réservé uniquement à l'élite de notre société, mais que nous procédions ou non dépend entièrement de [ROOT.GetCountry.GetRuler.GetFirstName]. \n \nBien qu'il soit désagréable de discuter de questions financières lorsque toute notre nation est en deuil, il y a des coûts substantiels associés aux enterrements de wagons et [ROOT.GetCountry.GetRuler.GetFirstName] doit approuver les achats."
 flavor_gaul.47.a:0 "Oui, tout doit être préparé selon la tradition"
 flavor_gaul.47.b:0 "Nous ne pouvons tout simplement pas nous le permettre pour le moment - il n'y aura pas de wagon"

 flavor_gaul.48.t:0 "Enterrer le chariot"
 flavor_gaul.48.desc:0 "Une sombre procession se déroule à quelques heures de route à l'extérieur de [ROOT.GetCountry.GetCapital.GetName] alors que les derniers préparatifs sont en cours pour l'une de nos traditions les plus anciennes ; l'inhumation en wagon d'une élite culturelle. \n \nToutes sortes d'objets funéraires sont descendus dans le sol - de somptueux plats à manger en argent, des torcs d'or et des capes de fourrure de cérémonie, des cornes à boire et des plateaux de banquet incrustés de pierres précieuses - tandis que les animaux et les esclaves nécessaires sont sacrifiés à proximité. Tout a été fait selon des normes rigoureuses, et les présages montrent que les dieux sont très satisfaits de notre attention aux détails les plus fins. \n \nIl y a un silence respectueux alors que les derniers morceaux de terre tombent sur le chariot, et un par un, tout le monde se tourne vers [ROOT.GetCountry.GetRuler.GetName], qui offre quelques mots."
 flavor_gaul.48.a:0 "Alors que nous nous souvenons de nos obligations envers les morts, puissent-ils nous donner leurs bénédictions"

 flavor_gaul.49.t:0 "Soudoyer le Conseil"
 flavor_gaul.49.desc:0 "[ROOT.GetCountry.GetRuler.GetName] a la réputation de ne laisser rien entraver la réalisation des plans [ROOT.GetCountry.GetRuler.GetHerHis] ; chaque affaire militaire que [ROOT.GetCountry.GetRuler.GetFirstName] a rencontrée, par exemple, a été traitée rapidement et sans pitié, avec une efficacité qui pourrait être confondue avec de l'insensibilité. \n \nCela ne devrait pas surprendre ceux qui y prêtent attention que [ROOT.GetCountry.GetRuler.GetFirstName] recourrait à la corruption politique afin de faire bouger les engrenages de l'État. Chaque sac d'argent remis, chaque torc d'or, était livré avec une menace tacite de sceller l'affaire."
 flavor_gaul.49.a:0 "Si mes ennemis n'acceptent pas mes pièces, qu'ils reçoivent mes poignards..."
 flavor.gaul.49.tt:0 "The mission task '#Y Bribe The Council#!' has now been #G Completed#!!" 

 flavor_gaul.50.t:0 "Ambition monarchique"
 flavor_gaul.50.desc:0 "Bien que tout le monde ne soit pas heureux aujourd'hui - il y a ceux qui croient ridiculement être de meilleurs candidats au trône - une occasion capitale est sur nous ; sous l'œil vigilant de nos Anciens et du Sage, [ROOT.GetCountry.GetRuler.GetName] subit une purification rituelle pour la cérémonie de couronnement qui aura lieu plus tard aujourd'hui à [ROOT.GetCountry.GetCapital.GetName]. Quand le soleil se couchera dans quelques heures et que les sacrifices seront complets, nous aurons une nouvelle forme de gouvernement. \n \nBien que notre peuple n'ait jamais été gouverné par un véritable souverain auparavant, il a été reconnu que le moment est enfin venu. Puissent les dieux continuer à accorder à [ROOT.GetCountry.GetRuler.GetFirstName] la sagesse et l'intelligence pour faire avancer notre nation."
 flavor_gaul.50.a:0 "Je ne vous laisserai pas tomber, mais je ferai toujours tout pour Treveria !"
 flavor.gaul.50.tt:0 "The mission task '#Y Monarchic Ambition#!' has now been #G Completed#!!" 

 flavor_gaul.51.t:0 "Triomphe à Treveria"
 flavor_gaul.51.desc:0 "En fin de compte, notre peuple a de quoi être fier. Non seulement avons-nous détruit les tribus inférieures qui nous entouraient, absorbant leur force et leur pouvoir dans les nôtres, mais nous avons commencé à créer une civilisation vraiment digne d'être respectée. Nous avons également élevé une lignée de rois pour régner sur nous, et nos ingénieurs ont apprivoisé les forêts sauvages, construisant des villes et de magnifiques édifices qui éblouissent les yeux par leur intelligence. \n \nAlors que les gens ont fait beaucoup pour mériter eux-mêmes ces honneurs, beaucoup admettent que nous ne serions pas aussi loin que nous le sommes sans [ROOT.GetCountry.GetRuler.GetName] - même les détracteurs de [ROOT.GetCountry.GetRuler.GetFirstName] admettent que nous avons été bénis avec le leadership de [ROOT.GetCountry.GetRuler.GetHerHis]."
 flavor_gaul.51.a:0 "Saluez Treveria !"
 flavor.gaul.51.tt:0 "The mission task '#Y Triumph In Treveria#!' has now been #G Completed#!!" 

 flavor_gaul.52.t:0 "Trévéria"
 flavor_gaul.52.desc:0 "Bien que [ROOT.GetCountry.GetCapital.GetName] ait certainement bien servi notre peuple, ces derniers temps, il y a un chœur croissant exigeant que nous déplacions notre capital à [GetProvince('(int32)3690').GetName]. Non seulement la ville de Treveria a un accès fluvial, ce qui est vital pour son succès économique, mais elle est également située sur les plaines, ce qui donne à nos habitants la possibilité de se développer à l'avenir. Les forêts près de Caranusca s'avèrent être un frein au développement, car tout coûte plus cher. \n \n[ROOT.GetCountry.GetRuler.GetName] a une décision à prendre."
 flavor_gaul.52.a:0 "Déplaçons notre capitale - il n'y a aucune raison pour nous de rester sur un site inférieur"
 flavor_gaul.52.b:0 "Nous n'abandonnons pas nos terres ancestrales"
 flavor.gaul.52.tt:0 "The mission task '#Y Treveria#!' has now been #G Completed#!!" 

 flavor_gaul.53.t:0 "Treverian Belgique"
 flavor_gaul.53.desc:0 "Maintenant que nous avons subjugué les tribus qui habitent [GetProvince('(int32)3029').GetArea.GetRegion.GetName], [ROOT.GetCountry.GetRuler.GetName] a demandé à visiter la province afin de faire le point sur la région. Ayant traversé de telles difficultés pour sécuriser le territoire, tous peuvent comprendre la nécessité de vérifier personnellement nos réalisations. \n \nLes membres de la tribu Belgae semblent humbles, pour une fois - il n'y a pas de regards provocateurs offerts à notre peuple alors que le cortège royal se déplace dans les rues. Leur esprit de résistance semble avoir été brisé ; des nouvelles que nos conseillers militaires seront heureux d'entendre. \n \nAlors que le char de [ROOT.GetCountry.GetRuler.GetFirstName] tourne sur la route menant à la maison, un renard traverse l'autoroute et disparaît dans la forêt."
 flavor_gaul.53.a:0 "Nous prendrons cela comme un bon présage - revenons à [ROOT.GetCountry.GetCapital.GetName]"
 flavor.gaul.53.tt:0 "The mission task '#Y Treverian Belgium#!' has now been #G Completed#!!" 

 flavor_gaul.54.t:0 "Expansion occidentale"
 flavor_gaul.54.desc:0 "Enfin ! Nos généraux rapportent que la percée tant attendue est arrivée ; après des guerres dévastatrices, nous avons finalement amené les régions de [GetProvince('(int32)2418').GetArea.GetName], [GetProvince('(int32)2499').GetArea.GetName] et [GetProvince('(int32)2489').GetArea.GetName] sous notre domination.\n\nIl y a beaucoup de célébrations bruyantes à [ROOT.GetCountry.GetCapital.GetName] ce soir, alors que les chefs réunis rivalisent pour voir qui pourra enivrer [ROOT.GetCountry.GetRuler.GetName] plus vite."
 flavor_gaul.54.a:0 "Quiconque doutait de mes capacités est un sot... *hic*"
 flavor_gaul.54.b:0 "Eh bien, un ou deux ne seraient pas de trop."
 flavor.gaul.54.tt:0 "La tâche '#Y Expansion occidentale#!' est désormais #G achevée#!."

 flavor_gaul.55.t:0 "Mélange des cultures"
 flavor_gaul.55.desc:0 "Si certains chefs de tribu aiment isoler leur peuple des tribus voisines, [ROOT.GetCountry.GetRuler.GetName] a toujours pensé que seuls les fous se coupent du monde ; il y a bien des leçons à tirer des cultures étrangères.\n\nDans cette optique, [ROOT.GetCountry.GetRuler.GetFirstName] a décidé que [ROOT.GetCountry.GetName] accueillerait nos cousins au chaud et en sécurité, et les terres du clan [ROOT.GetCountry.GetRuler.GetFamily.GetName] sont connues pour ouvrir leur foyer à l'étranger ; notre générosité est louée par tous."
 flavor_gaul.55.a:0 "Chacun peut trouver une demeure dans [ROOT.GetCountry.GetName]."
 flavor.gaul.55.tt:0 "La tâche '#Y Mélange des cultures#!' est désormais #G achevée#!."

 flavor_gaul.56.t:0 "Mines de fer"
 flavor_gaul.56.desc:0 "Ce fut une heureuse surprise quand des rapports arrivés à [ROOT.GetCountry.GetCapital.GetName] signalèrent la découverte de puissantes veines de fer @iron! dans certaines de nos terres — une bénédiction venue du dieu [GetDeityDefinition('omen_gobannus').GetName] lui-même. Notre peuple maîtrise peu à peu l'art de la forge, et nous produisons déjà une bonne quantité de minerai, mais il semble que Gobannus voie nos efforts et veuille nous pousser à aller plus loin."
 flavor_gaul.56.a:0 "Nous devons avoir autant de fer que nos mains peuvent en porter."
 flavor.gaul.56.tt:0 "La tâche '#Y Mines de fer#!' est désormais #G achevée#!."
 flavor.gaul.56.tt2:0 "Deux établissements au hasard produisant #Y Base Metals#! @base_metals! et #Y Stone#! @stone! produiront désormais #Y Iron#! @iron! à la place."

 flavor_gaul.57.t:0 "Initiative des forts en hauteur"
 flavor_gaul.57.desc:0 "Grâce aux leçons tirées de la construction de [GetProvince('(int32)3687').GetArea.GetName] et des nombreux #E forts en hauteur#! qui protègent la campagne, nos artisans ont presque maîtrisé leur art et peuvent dresser des fortifications ou concevoir un oppidum avec un minimum d'effort. Avec de tels ingénieurs à nos côtés, nous pourrons bâtir de nouvelles cités bien plus vite que jamais."
 flavor_gaul.57.a:0 "Alors bâtissons partout où nous le pouvons dans [ROOT.GetCountry.GetName]."
 flavor.gaul.57.tt:0 "La tâche '#Y Initiative des forts en hauteur#!' est désormais #G achevée#!."

 flavor_gaul.58.t:0 "Tributaires belges"
 flavor_gaul.58.desc:0 "S'il est beaucoup de gens dans [ROOT.GetCountry.GetName] qui craignent les #E Belges#! et leur réputation redoutable, le victorieux [ROOT.GetCountry.GetRuler.GetName] a prouvé une fois pour toutes que ces sauvages se traitent aussi facilement que n'importe quelle autre tribu.\n\nLe [ROOT.GetCountry.GetRulerTitle] aime souvent répéter un vieil adage ; ceux qui ne se soumettent pas à la diplomatie [ROOT.GetCountry.GetAdjective] finiront par être châtiés par les armes [ROOT.GetCountry.GetAdjective]. Et maintenant que nos frontières englobent des terres qui furent un jour sous la domination des féroces Belges, [ROOT.GetCountry.GetRuler.GetFirstName] doit décider de leur statut ; les traiterons-nous comme nos frères ou comme nos serviteurs ?"
 flavor_gaul.58.a:0 "Que tout notre peuple vive en paix."
 flavor.gaul.58.tt:0 "La tâche '#Y Tributaires belges#!' est désormais #G achevée#!."

 flavor_gaul.59.t:0 "Sépulture en char"
 flavor_gaul.59.desc:0 "Depuis la récente #E Sépulture en char#!, l'esprit de [ROOT.GetCountry.GetRuler.GetName] est accaparé par les questions de vie et de mort, et il a passé de longues heures à méditer devant le feu de [ROOT.GetCountry.GetCapital.GetName].\n\nNotre nom même — #E '[ROOT.GetCountry.GetAdjective]'#! — évoque le franchissement des rivières, et le [ROOT.GetCountry.GetRulerTitle] se demande souvent si nos jours ne sont pas comptés comme le cours de l'eau. À quoi bon les dieux nous donner une vie si courte, alors qu'on nous demande de tant accomplir ? Et quelle est la nature des dieux eux-mêmes ? Restent-ils intacts face aux ravages du temps, ou succombent-ils aussi, comme tout le reste ? Et s'ils sont touchés par le passage des années, sont-ils encore des dieux ?\n\nIl va sans dire que [ROOT.GetCountry.GetRuler.GetFirstName] dort mal, car [ROOT.GetCountry.GetRuler.GetSheHe] ne peut s'empêcher d'y penser."
 flavor_gaul.59.a:0 "Je dois m'en remettre à la volonté des dieux."
 flavor_gaul.59.b:0 "Tout cela n'a pas de sens... pourquoi nous comportons-nous ainsi ?"
 flavor_gaul.59.c:0 "Je n'ai aucune raison de me tourmenter ainsi."
 flavor.gaul.59.tt:0 "La tâche '#Y Sépulture en char#!' est désormais #G achevée#!."
 treverian_ruler_contemplates_gods_tt:0 "Notre dirigeant méditera sur les graves questions de la vie et de la mort..."

 flavor_gaul.60.t:0 "Relations commerciales"
 flavor_gaul.60.desc:0 "Dans l'histoire de notre peuple, peu peuvent se comparer à [ROOT.GetCountry.GetRuler.GetName], qui a non seulement remporté de nombreuses victoires sur le champ de bataille pour [ROOT.GetCountry.GetName], mais a aussi amélioré le quotidien des tribus en important des marchandises de luxe sur ses marchés.\n\nSi certains #E anciens#! ont dénoncé les échanges exotiques comme un affaiblissement de nos coutumes, [ROOT.GetCountry.GetRuler.GetFirstName] a publiquement répliqué que l'on ne peut nous arrêter sans nous faire reculer."
 flavor_gaul.60.a:0 "Le commerce apporte beaucoup d'avantages."
 flavor_gaul.60.b:0 "Le sage place son argent pour en tirer plus."
 flavor.gaul.60.tt:0 "La tâche '#Y Relations commerciales#!' est désormais #G achevée#!."

 flavor_gaul.61.t:0 "Oppida trevériens"
 flavor_gaul.61.desc:0 "Nos architectes et ingénieurs ont maîtrisé l'art de la construction, forgeant leur savoir pendant de longues années de labeur. [ROOT.GetCountry.GetRuler.GetName] n'a pas tardé à louer leur travail, les présentant comme le sommet du génie [ROOT.GetCountry.GetAdjective], et a répété à maintes reprises qu'il nous faut de tels hommes.\n\nDes messagers sont partis dans tout [ROOT.GetCountry.GetName] pour appeler les manœuvres à [ROOT.GetCountry.GetCapital.GetName], où le travail ne manquait jamais, et il ne fallut pas longtemps avant que de nombreux affranchis n'arrivent dans la capitale."
 flavor_gaul.61.a:0 "Notre civilisation grandissante exige plus de cités — au travail !"
 flavor.gaul.61.tt:0 "La tâche '#Y Oppida trevériens#!' est désormais #G achevée#!."

 flavor_gaul.62.t:0 "Le Rhin"
 flavor_gaul.62.desc:0 "Depuis plusieurs heures, un #E conseil de guerre#! [ROOT.GetCountry.GetAdjective] a lieu à [ROOT.GetCountry.GetCapital.GetName], et les guerriers les plus expérimentés de [ROOT.GetCountry.GetName] — [ROOT.GetCountry.GetRuler.GetName], [SCOPE.sCharacter('clan_chief_one').GetName] et [SCOPE.sCharacter('clan_chief_two').GetName] — se sont réunis pour discuter de stratégie et de tactiques. Malheureusement, des désaccords subsistent sur la marche à suivre.\n\n[SCOPE.sCharacter('clan_chief_one').GetFirstName] croit que les forêts denses de [GetProvince('(int32)2428').GetArea.GetName] seraient la meilleure province à envahir, mais [SCOPE.sCharacter('clan_chief_two').GetFirstName] jure que c'est une folie et que le premier choix de nos armées doit être les collines rocailleuses de [GetProvince('(int32)3627').GetArea.GetName]. [ROOT.GetCountry.GetRuler.GetFirstName] est frustré par leurs comportements têtus et ne se réjouit guère de devoir trancher, sachant qu'un de ses meilleurs combattants s'offusquera fort."
 flavor_gaul.62.a:0 "Je suis d'accord avec [SCOPE.sCharacter('clan_chief_one').GetFirstName], et je n'entendrai aucune autre raison."
 flavor_gaul.62.b:0 "[SCOPE.sCharacter('clan_chief_two').GetName] a parlé vérité."
 flavor_gaul.62.c:0 "Vous deux, fous de discorde, taisez-vous !"
 flavor.gaul.62.tt:0 "La tâche '#Y Le Rhin#!' est désormais #G achevée#!."

 flavor_gaul.63.t:0 "Soumission des Éburons"
 flavor_gaul.63.desc:0 "Maintenant que les #E Éburons#! ont été soumis par l'impressionnant [ROOT.GetCountry.GetRuler.GetName], le célèbre [ROOT.GetCountry.GetRulerTitle] qui a mené les tribus de [ROOT.GetCountry.GetName] de victoire en victoire a promis à ses guerriers que de nouvelles gloires les attendaient."
 flavor_gaul.63.a:0 "Nos levées marcheront bientôt vers de nouvelles terres que j'affirme aujourd'hui !"
 flavor_gaul.63.b:0 "Je soumettrai vraiment l'Éburonie... j'asservirai les Belges !"
 flavor.gaul.63.tt:0 "La tâche '#Y Soumission des Éburons#!' est désormais #G achevée#!."

 flavor_gaul.64.t:0 "Fortifier le Rhin"
 flavor_gaul.64.desc:0 "Depuis les premiers jours de [ROOT.GetCountry.GetRuler.GetHerHis] règne en tant que [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName] a toujours redouté une invasion depuis l'autre rive du #E Rhin#!, mais n'a pu faire grand-chose ; les problèmes de [ROOT.GetCountry.GetName] étaient urgents et graves, et les raiders #E germaniques#! imaginaires seraient un souci pour plus tard.\n\nMais ce jour arriva enfin, et [ROOT.GetCountry.GetRuler.GetFirstName] fut prêt, que les dieux soient loués. Après avoir étudié nos fortifications et nos défenses, il fut décidé que des #E gardes du Rhin#! seraient placés à des points stratégiques le long du fleuve pour servir de sentinelles. Ces soldats seraient notre première ligne de défense, tenant les passages du Rhin et donnant au reste de nos levées assez de temps pour accourir à leur aide."
 flavor_gaul.64.a:0 "Gardes vaillants de Trévire, que les dieux combattent à vos côtés !"
 flavor.gaul.64.tt:0 "La tâche '#Y Fortifier le Rhin#!' est désormais #G achevée#!."

 flavor_gaul.65.t:0 "Monts du Jura"
 flavor_gaul.65.desc:0 "Maintenant que les levées de [ROOT.GetCountry.GetName] contrôlent les contreforts et les passages des #E monts du Jura#!, le [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] a annoncé à notre peuple que notre expansion n'était pas finie et qu'elle se poursuivrait tant que les dieux nous accorderaient la victoire."
 flavor_gaul.65.a:0 "Il viendra un temps de paix, mais ce jour n'est pas encore là."
 flavor.gaul.65.tt:0 "La tâche '#Y Monts du Jura#!' est désormais #G achevée#!."

 flavor_gaul.66.t:0 "Sécuriser notre côte"
 flavor_gaul.66.desc:0 "Pendant de nombreuses années, nos tribus se sont confinées aux plaines et aux forêts de la #E Gaule#!, mais les choses changent, et dans notre cas, elles ont changé vite ; nous ne restons plus à terre, car nos fils ont construit des navires qu'ils font naviguer sur les eaux lointaines.\n\nSi nous en sommes encore au début de la mer, notre peuple s'est attaqué à la tâche avec ardeur et a mis tout son cœur à bâtir de solides vaisseaux pour nos marins."
 flavor_gaul.66.a:0 "Nous devons protéger nos intérêts sur mer comme sur terre."
 flavor.gaul.66.tt:0 "La tâche '#Y Sécuriser notre côte#!' est désormais #G achevée#!."

 # NEW BOIHAEMIA
 flavor_gaul.67.t:0 "Coloniser la terre au-delà des Sudètes"
 flavor_gaul.67.desc:0 "Les Sudètes sont une terre semblable à la nôtre, sans doute avec plus de plaines que de forêts. Nous avons raison de la revendiquer ; il est devenu clair pour [ROOT.GetCountry.GetRuler.GetName] que les terres fertiles au-delà de notre patrie sont celles où nous trouverons vraie prospérité et richesse."
 flavor_gaul.67.a:0 "Notre maison loin de la maison."
 flavor.gaul.67.tt:0 "La tâche '#Y Coloniser la terre au-delà des Sudètes#!' est désormais #G achevée#!."

 flavor_gaul.68.t:0 "Développer nos terres transsudètes"
 flavor_gaul.68.desc:0 "Depuis que nous avons expanded vers les terres transsudètes, elles sont devenues une province fort active, pleine de villages et de fermes. Elles ressemblent désormais aux patries boïhaémoises, ce dont [ROOT.GetCountry.GetRuler.GetName] est fort fier.\n\nMaintenant que nous avons transformé un lieu naguère peu habité en terre vivante et civilisée, qui peut dire où nos conquêtes nous mèneront ensuite ?"
 flavor_gaul.68.a:0 "D'abord, nous devrions regarder vers nos propres terres..."
 flavor.gaul.68.tt:0 "La tâche '#Y Développer nos terres transsudètes#!' est désormais #G achevée#!."

 flavor_gaul.69.t:0 "Alliance tauriscienne"
 flavor_gaul.69.desc:0 "[ROOT.GetCountry.GetRuler.GetName] partit avec ses chefs de clan, pressé de conclure le pacte discuté entre [GetCountry('BOA').GetName] et [GetCountry('TSC').GetName]. À son arrivée à la capitale tauriscienne, [GetProvince('(int32)4029').GetName], [ROOT.GetCountry.GetRuler.GetName] fut accueilli par de la musique, un festin et des danseurs.\n\nTout s'était déroulé à merveille, et maintenant [GetCountry('BOA').GetName] a un allié sûr et peut commencer son expansion vers les terres situées à l'est."
 flavor_gaul.69.a:0 "J'ai des amis partout."
 flavor.gaul.69.tt:0 "La tâche '#Y Alliance tauriscienne#!' est désormais #G achevée#!."

 flavor_gaul.70.t:0 "Commerce tauriscien"
 flavor_gaul.70.desc:0 "Notre alliance avec [GetCountry('TSC').GetName] fut si bénéfique qu'il était logique d'ouvrir le commerce avec eux. Maintenant, non seulement des biens circulent dans nos terres, mais ils ont promis d'envoyer certains de leurs meilleurs soldats comme garde du corps de [ROOT.GetCountry.GetRuler.GetName] !"
 flavor_gaul.70.a:0 "Vraiment, ce fut une sage décision."
 flavor.gaul.70.tt:0 "La tâche '#Y Commerce tauriscien#!' est désormais #G achevée#!."

 flavor_gaul.71.t:0 "Vers la Haute Pannonie"
 flavor_gaul.71.desc:0 "Les terres de la #E Haute Pannonie#! sont peu habitées, mais elles restent stratégiquement importantes pour nous. Notre saisie et soumission des territoires autrefois contrôlés par les Cotiniens montagnards et les rusés Eravisciens nous a donné une zone depuis laquelle lancer de nouvelles invasions. Il semble que les Celtes du sud se soient remis en branle à la suite de nos conquêtes, et les Daces de l'est ne semblent pas dignes de confiance..."
 flavor_gaul.71.a:0 "Nous devons rester alertes."
 flavor.gaul.71.tt:0 "La tâche '#Y Vers la Pannonie#!' est désormais #G achevée#!."

 flavor_gaul.72.t:0 "Domination de la Pannonie"
 flavor_gaul.72.desc:0 "Après de nombreuses victoires arrachées au prix du sang, nous pouvons enfin dire que la #E Pannonie#! est désormais terre boïhaémienne ! Cette terre fertile deviendra un élément crucial de notre nouvelle fédération. Après tout, une armée ne combat pas le ventre vide."
 flavor_gaul.72.a:0 "Nos récoltes seront abondantes."
 flavor.gaul.72.tt:0 "La tâche '#Y Domination de la Pannonie#!' est désormais #G achevée#!."

 flavor_gaul.73.t:0 "Côte de l'ambre"
 flavor_gaul.73.desc:0 "Nos échanges répétés avec les Germains nous ont fait comprendre la richesse immense qu'ils possèdent. Non en or ou en argent, mais dans cette étrange substance rocheuse appelée ambre. Bien que nous ne sachions trop quoi en faire, les peuples riches du sud n'en ont jamais assez. C'est pour cette raison que [ROOT.GetCountry.GetRuler.GetName] organisa la conquête de cette région. Maintenant que cette précieuse ressource est entièrement sous notre contrôle, nous deviendrons riches au-delà de nos rêves les plus fous."
 flavor_gaul.73.a:0 "Il semble que l'ambre vaut plus que l'or."
 flavor.gaul.73.tt:0 "La tâche '#Y Côte de l'ambre#!' est désormais #G achevée#!."

 flavor_gaul.74.t:0 "Le sel de Laciacum"
 flavor_gaul.74.desc:0 "Après la conquête des terres alauniennes, leurs précieuses lacs de sel @salt! sont maintenant sous notre contrôle. Les Alauniens n'avaient apparemment pas exploité cette zone salifère à son plein potentiel, mais nous pouvons désormais le faire. Bien que nous n'ayons pas besoin de grandes quantités de sel, d'autres marchés peuvent nous en acheter à grand profit, comme les Germains du nord."
 flavor_gaul.74.a:0 "Un bien si précieux est toujours très demandé."
 flavor.gaul.74.tt:0 "La tâche '#Y Le sel de Laciacum#!' est désormais #G achevée#!."

 flavor_gaul.75.t:0 "Ferrum Noricum"
 flavor_gaul.75.desc:0 "Le fer @iron! n'est pas la seule chose intéressante dans [GetProvince('(int32)3672').GetName].\n\nCes cols de montagne sont faciles à défendre, même avec une petite troupe, et le fer abondant dans la région nous permettra de forger de nouvelles armes, outils et armures. Bien que nous ne soyons pas de nature montagnarde, nous saurons tirer profit de cette gorge stratégique. Ce sera notre bastion du sud, d'où nous repousserons tout ennemi qui tenterait de pénétrer dans nos riches terres du nord."
 flavor_gaul.75.a:0 "Nos lames seront aussi vives que notre esprit."
 flavor.gaul.75.tt:0 "La tâche '#Y Ferrum Noricum#!' est désormais #G achevée#!."

 flavor_gaul.76.t:0 "Mettre les voiles"
 flavor_gaul.76.desc:0 "Loin au sud, dans les eaux claires de la #E mer Méditerranée#!, on sait qu'il existe des milliers de navires qui naviguent de port en port, de cité en cité, portant de précieux chargements de marchandises de luxe ou de puissants escadrons d'élites militaires — autant d'ambitions que [ROOT.GetCountry.GetRuler.GetName] nourrit pour [ROOT.GetCountry.GetName] un jour.\n\nNotre flotte est modeste comparée aux vastes armadas de ces royaumes puissants, mais chacun doit commencer quelque part, et [ROOT.GetCountry.GetRuler.GetFirstName] est fier de ce que nous avons accompli jusqu'ici."
 flavor_gaul.76.a:0 "Notre marine est destinée à de grandes choses, vous verrez."
 flavor.gaul.76.tt:0 "La tâche '#Y Mettre les voiles#!' est désormais #G achevée#!."

 flavor_gaul.77.t:0 "Commerce de la mer du Nord"
 flavor_gaul.77.desc:0 "Grâce à l'augmentation du commerce vers [ROOT.GetCountry.GetCapital.GetName], nos marchands et artisans gagnent plus qu'ils n'auraient cru possible. En signe de gratitude, ils ont envoyé une somme considérable à [ROOT.GetCountry.GetRuler.GetName] pour exprimer leur reconnaissance envers le [ROOT.GetCountry.GetRulerTitle].\n\nLe spectacle d'un navire marchand affrontant les eaux agitées du #E Mare Germanicum#! pour atteindre nos ports devient courant, et beaucoup de nos jeunes rêvent de devenir marins un jour."
 flavor_gaul.77.a:0 "Je remercie le geste — je mettrai cet or à profit."
 flavor.gaul.77.tt:0 "La tâche '#Y Commerce de la mer du Nord#!' est désormais #G achevée#!."

 flavor_gaul.78.t:0 "Offrande du marais"
 flavor_gaul.78.desc:0 "L'un de nos plus anciens rites religieux consiste à sacrifier une victime en la noyant dans un marais et en laissant son corps dans les eaux boueuses, avec des offrandes de nourriture et de vêtements. Cette antique pratique a assuré la victoire [ROOT.GetCountry.GetAdjective] au combat, ainsi que des récoltes abondantes chaque année, et c'est pourquoi l'on a fait pression sur [ROOT.GetCountry.GetRuler.GetName] pour qu'il accomplisse son devoir sacré.\n\nMaintenant que nous avons des prisonniers enchaînés à [ROOT.GetCountry.GetCapital.GetName], les #E anciens de la tribu#! ont amené une victime convenable au [ROOT.GetCountry.GetRulerTitle] et exigé que les dieux soient invoqués."
 flavor_gaul.78.a:0 "Que la puissance des dieux soit accordée à [ROOT.GetCountry.GetRuler.GetFirstName]."
 flavor_gaul.78.b:0 "Demandez aux dieux de bénir [ROOT.GetCountry.GetName] de la victoire sur nos ennemis."
 flavor_gaul.78.c:0 "Je ferai grâce à la victime — tous les Frisiens ne sont pas des monstres."
 flavor.gaul.78.tt:0 "La tâche '#Y Offrande du marais#!' est désormais #G achevée#!."
 frisians_decide_bog_offering_tt:0 "Notre [ROOT.GetCountry.GetRulerTitle|Y] décidera du sort de notre prisonnier..."
 frisian_victim_moves_to_bar_tt:0 "Le prisonnier sera #T libéré#! dans la nature sauvage de la Frise..."

 flavor_gaul.79.t:0 "Côte de la mer du Nord"
 flavor_gaul.79.desc:0 "Au cours des derniers mois, le spectacle des raids [ROOT.GetCountry.GetAdjective] qui montent et descendent les côtes du Nord est devenu un mauvais présage pour les habitants du rivage ; ils savent que nos bateaux portent des esclavagistes, et que nos guerriers n'épargneront personne.\n\n[ROOT.GetCountry.GetRuler.GetName] a souvent dirigé lui-même nombre de ces raids, et s'est fait une réputation redoutable de pillard et meurtrier."
 flavor_gaul.79.a:0 "Ce n'est que le début de vos malheurs."
 flavor.gaul.79.tt:0 "La tâche '#Y Côte de la mer du Nord#!' est désormais #G achevée#!."

 flavor_gaul.80.t:0 "Marins saxons"
 flavor_gaul.80.desc:0 "Nos marins sont devenus experts dans l'attaque et la capture des navires ennemis, portant au grand large la maîtrise frisonne du vol et l'amour du butin. [ROOT.GetCountry.GetRuler.GetName] a loué leurs efforts, les exhortant à prendre autant de bateaux étrangers que possible ; nos flottes se sont agrandies ces dernières années, il est vrai, mais il reste toujours place pour plus."
 flavor_gaul.80.a:0 "Glorieuse sera notre marine !"
 flavor.gaul.80.tt:0 "La tâche '#Y Marins saxons#!' est désormais #G achevée#!."

 flavor_gaul.81.t:0 "Fortifier notre capitale"
 flavor_gaul.81.desc:0 "Si nos fortifications ne peuvent rivaliser avec les murailles de pierre des vieilles cités du sud, [ROOT.GetCountry.GetRuler.GetName] a fait de son mieux pour que la défense de [ROOT.GetCountry.GetCapital.GetName] soit digne de ce nom. Nos garnisons sont bien fournies, et nos défenseurs ont juré de combattre jusqu'au dernier."
 flavor_gaul.81.a:0 "Notre capitale protégée, nous ne craignons plus rien, ni Belges ni quiconque."
 flavor.gaul.81.tt:0 "La tâche '#Y Fortifier notre capitale#!' est désormais #G achevée#!."

 flavor_gaul.82.t:0 "Sacrifice à [GetDeityDefinition('omen_yngvi').GetName]"
 flavor_gaul.82.desc:0 "[ROOT.GetCountry.GetRuler.GetName] a invoqué [GetDeityDefinition('omen_yngvi').GetName] à son aide, demandant au puissant fils de [GetDeityDefinition('omen_mannus').GetName] de réduire nos ennemis en poussière. Entendant nos prières, Ingwaz a tourné son visage vers [ROOT.GetCountry.GetName] et nous a comblés de force et de puissance divines !"
 flavor_gaul.82.a:0 "Nous déchaînerons la fureur de [GetDeityDefinition('omen_yngvi').GetName] sur nos ennemis !"
 flavor.gaul.82.tt:0 "La tâche '#Y Sacrifice à [GetDeityDefinition('omen_yngvi').GetName]#!' est désormais #G achevée#!."

 flavor_gaul.83.t:0 "Raids en Pritannia"
 flavor_gaul.83.desc:0 "Maintenant que nous sommes en guerre avec les #E Pritanniens#!, [ROOT.GetCountry.GetRuler.GetName] a ordonné à nos levées de faire preuve de nulle clémence envers les insulaires dans ces premiers combats. 'Le temps viendra de prendre des esclaves, mais ce n'est pas encore le moment ; il faut détruire ceux qui peuvent nous résister, puis nous prendrons tout ce que nous voulons.'"
 flavor_gaul.83.a:0 "Ne prenez aucun prisonnier ! Que tous meurent !"
 flavor.gaul.83.tt:0 "La tâche '#Y Raids en Pritannia#!' est désormais #G achevée#!."

 flavor_gaul.85.t:0 "Partage du butin"
 flavor_gaul.85.desc:0 "Parce que les dieux de la guerre se sont montrés généreux envers les levées de [ROOT.GetCountry.GetName] et nous ont donné d'innombrables victoires et des richesses sans mesure, [ROOT.GetCountry.GetRuler.GetName] a décidé de partager ses gains avec les grands hommes de [ROOT.GetCountry.GetCapital.GetName].\n\nAprès avoir distribué des cadeaux d'or au #E conseil tribal#!, [ROOT.GetCountry.GetRuler.GetFirstName] a encouragé ses hommes à employer le produit de cette aubaine pour s'armer de fer @iron! — demande qu'ils furent heureux d'accorder."
 flavor_gaul.85.a:0 "Ainsi armés, nous sommes prêts à tenir tête à n'importe qui !"
 flavor.gaul.85.tt:0 "La tâche '#Y Partage du butin#!' est désormais #G achevée#!."

 flavor_gaul.86.t:0 "La chasse au renard"
 flavor_gaul.86.desc:0 "Des nouvelles surprenantes viennent de la frontière ! Lors de notre récent raid dans [GetCountry('EBS').GetName], nos guerriers ont réussi à saisir un groupe de vauriens mené par le bandit notoire [SCOPE.sChar('rups_belgae').GetName], homme recherché pour ses cruelles attaques sur le territoire frison, alors qu'ils rapportaient leur butin vers [ROOT.GetCountry.GetCapital.GetName].\n\nCe scélérat éburon, connu sous le nom de #E 'Le Renard'#! pour la facilité avec laquelle il glissait inaperçu au-delà de notre frontière, a pillé nos plus riches terres pendant des années ; sa capture est presque un miracle."
 flavor_gaul.86.a:0 "Voilà la justice du peuple frison !"
 flavor.gaul.86.tt:0 "La tâche '#Y La chasse au renard#!' est désormais #G achevée#!."

 flavor_gaul.87.t:0 "Les Saxons"
 flavor_gaul.87.desc:0 "Par un étrange retournement du destin, il semble que les peuples #E pritanniens#! aient pris l'habitude de nommer #E 'Saxons'#!, tant ils craignent les couteaux que nous portons dans nos cruelles razzias. La nouvelle s'est vite répandue dans l'île du danger qu'ils voient en nous, et beaucoup de chefs de tribu espèrent former une ligue défensive contre nous.\n\nRiant de leurs efforts pitoyables pour nous ralentir, [ROOT.GetCountry.GetRuler.GetName] a juré de brûler de sa main les navires et les peuplements de quiconque se dressera contre nous."
 flavor_gaul.87.a:0 "Si les hommes nous nomment Saxons, nous embrassons ce nom."
 flavor.gaul.87.tt:0 "La tâche '#Y Les Saxons#!' est désormais #G achevée#!."

 flavor_gaul.88.t:0 "Avant-poste pritannien"
 flavor_gaul.88.desc:0 "Nos armées victorieuses, ayant assuré à nos frères un avant-poste sur l'île de #E Pritannia#!, tournent maintenant leurs yeux affamés vers l'horizon, où les terres du peuple appellent à être conquises. [ROOT.GetCountry.GetRuler.GetName], jamais satisfait de la paix, a ordonné aux levées de [ROOT.GetCountry.GetName] de se mettre en ordre de bataille."
 flavor_gaul.88.a:0 "Nous ne nous reposerons point tant que nous n'aurons détruit nos ennemis !"
 flavor.gaul.88.tt:0 "La tâche '#Y Avant-poste pritannien#!' est désormais #G achevée#!."

 flavor_gaul.89.t:0 "La côte nord"
 flavor_gaul.89.desc:0 "Les guerriers de [ROOT.GetCountry.GetName] sont vraiment remarquables ; ils ne rechignent jamais au combat, mais courent vers la mort sans frayeur. Ils traversent les marais fangeux de #E Pritannia#! sans mot dire, et ni la pluie incessante qui la dévore ni le vent mordant de ses landes sauvages ne font gronder nos hommes.\n\nQuand nos soldats gagnent une campagne, ils n'implorent ni repos ni retour au foyer, mais poussent [ROOT.GetCountry.GetRuler.GetName] à les mener plus avant vers la bataille glorieuse."
 flavor_gaul.89.a:0 "Avec de tels combattants à mes côtés, comment les tribus [ROOT.GetCountry.GetAdjective] pourraient-elles perdre ?"
 flavor.gaul.89.tt:0 "La tâche '#Y La côte nord#!' est désormais #G achevée#!."

 flavor_gaul.90.t:0 "La côte sud"
 flavor_gaul.90.desc:0 "Nos armées continuent de broyer ceux qui s'opposent à elles, gagnant de nouvelles terres et territoires pour [ROOT.GetCountry.GetName], ce qui nous ouvre encore mieux la route à travers #E Pritannia#! — situation que [ROOT.GetCountry.GetRuler.GetName] est prêt à exploiter."
 flavor_gaul.90.a:0 "Nos armées marchent vers #E Durotrigia#! — transmettez-leur l'ordre."
 flavor.gaul.90.tt:0 "La tâche '#Y La côte sud#!' est désormais #G achevée#!."

 flavor_gaul.91.t:0 "La côte est"
 flavor_gaul.91.desc:0 "Pendant trois mois d'horreur, tandis que l'on préparait encore des revendications sur les terres voisines, les levées de [ROOT.GetCountry.GetName] ont pillé et ravagé la cité de [GetProvince('(int32)2032').GetName] à leur guise. Tout ce qui avait valeur fut pris ; ses rues furent jonchées de corps. Jamais encore dans l'histoire des #E Icéniens#! une telle tragédie ne les avait frappés, et leur peuple n'oubliera jamais les crimes des soldats de [ROOT.GetCountry.GetRuler.GetName]."
 flavor_gaul.91.a:0 "Soyez reconnaissants d'avoir encore une cité."
 flavor_gaul.91.b:0 "Voulez-vous voir ce dont je suis capable ?"
 flavor.gaul.91.tt:0 "La tâche '#Y La côte est#!' est désormais #G achevée#!."

 flavor_gaul.92.t:0 "Port occidental"
 flavor_gaul.92.desc:0 "Selon toute preuve, le port construit à [GetProvince('(int32)2047').GetName] dépasse encore les hautes espérances de [ROOT.GetCountry.GetRuler.GetName], celui qui fut le plus enthousiaste à y investir. Les eaux du #E Mare Hibernicum#! foisonnent de vie, et les pêcheurs qui en partent chaque jour rapportent des prises records ; bénédiction qui a ramené la sécurité alimentaire chez les habitants."
 flavor_gaul.92.a:0 "Un tributaire bien nourri est un homme heureux, j'en suis sûr."
 flavor.gaul.92.tt:0 "La tâche '#Y Port occidental#!' est désormais #G achevée#!."

 flavor_gaul.93.t:0 "Northumbrie"
 flavor_gaul.93.desc:0 "[ROOT.GetCountry.GetRuler.GetName] a momentanément tourné sa pensée de la guerre vers la construction des cités, ouvrant le trésor de [ROOT.GetCountry.GetName] à d'immenses travaux — œuvre qui a réussi au-delà des espérances.\n\nLe sage [ROOT.GetCountry.GetRulerTitle] a bien vu que le meilleur moyen d'étendre [ROOT.GetCountry.GetAdjective] sur les terres conquises est de bâtir son infrastructure, ce qui a réjoui notre peuple et apaisé ses cœurs usés par la guerre."
 flavor_gaul.93.a:0 "Mes cités de Northumbrie montrent à tous que nous y resterons."
 flavor.gaul.93.tt:0 "La tâche '#Y Northumbrie#!' est désormais #G achevée#!."

 flavor_gaul.94.t:0 "Wessex"
 flavor_gaul.94.desc:0 "Notre suite ininterrompue de victoires nous mène au bonheur ; rien que bonnes nouvelles n'arrivent à [ROOT.GetCountry.GetRuler.GetName]. La gloire est à nous, nos guerriers grandissent chaque jour, et beaucoup de tribaux quittent leurs terres ravagées pour s'établir dans les nôtres, ce qui augmente nos revenus et le nombre de soldats levés."
 flavor_gaul.94.a:0 "Que les dieux continuent de nous bénir ainsi !"
 flavor.gaul.94.tt:0 "La tâche '#Y Wessex#!' est désormais #G achevée#!."

 flavor_gaul.95.t:0 "Sussex et Essex"
 flavor_gaul.95.desc:0 "Après avoir visité personnellement certains lieux prometteurs, [ROOT.GetCountry.GetRuler.GetName] ordonna de bâtir de nouvelles cités dans les régions du sud-est de #E Pritannia#!. Ces bourgs sont destinés à accueillir nos frères de l'autre côté des eaux, nombre d'entre eux ayant quitté leurs anciens établissements pour fonder une nouvelle vie sur notre île.\n\nÀ mesure que la rumeur se répand dans nos possessions continentales sur les opportunités offertes à [GetProvince('(int32)2028').GetName] et [GetProvince('(int32)2020').GetName], les navires chargés de colons saxons traversent sans cesse le #E Mare Britannicum#!."
 flavor_gaul.95.a:0 "C'est un développement des plus excellents."
 flavor.gaul.95.tt:0 "La tâche '#Y Sussex et Essex#!' est désormais #G achevée#!."

 flavor_gaul.96.t:0 "Le cœur de Pritannia"
 flavor_gaul.96.desc:0 "La province de [GetProvince('(int32)2045').GetArea.GetName] tenant fermement entre nos mains, les levées de [ROOT.GetCountry.GetName] ont pris le contrôle du cœur de l'île. Nos raiders et nos guerriers pourront désormais partir en razzia en tout sens, et nul ne saura se dérober à la colère de [ROOT.GetCountry.GetRuler.GetName]."
 flavor_gaul.96.a:0 "C'est une bonne nouvelle pour les tribus [ROOT.GetCountry.GetAdjective]."
 flavor.gaul.96.tt:0 "La tâche '#Y Le cœur de Pritannia#!' est désormais #G achevée#!."

 flavor_gaul.97.t:0 "Anglie orientale"
 flavor_gaul.97.desc:0 "La situation dans [GetProvince('(int32)2035').GetArea.GetName] ne cesse de s'améliorer pour notre peuple, devenu assez nombreux pour être tenus pour les premiers habitants de cette contrée. Le culte de nos dieux a supplanté les rites locaux des natifs, dont beaucoup ont embrassé notre foi en espérant imiter notre grandeur. Au total, [ROOT.GetCountry.GetRuler.GetName] est fort satisfait de tout ce que [ROOT.GetCountry.GetRuler.GetSheHe] entend de ses conseillers."
 flavor_gaul.97.a:0 "Certes, nous sommes fortunés — n'oublions jamais cela."
 flavor.gaul.97.tt:0 "La tâche '#Y Anglie orientale#!' est désormais #G achevée#!."

 flavor_gaul.98.t:0 "La mer d'Hibernie"
 flavor_gaul.98.desc:0 "Notre puissance navale s'est considérablement accrue au cours des dernières années, nous permettant de projeter notre force loin de nos côtes — nécessité pour les tribus [ROOT.GetCountry.GetAdjective], qui commandent un vaste royaume. Les eaux qui entourent #E Pritannia#! sont à nous, et nul voisin ne peut espérer contester notre domination en mer ; il est même pensé que nous pourrions infliger de lourds dommages aux armadas des puissants États de la #E Méditerranée#!, bien que [ROOT.GetCountry.GetRuler.GetName] ait déclaré n'avoir nulle hâte de vérifier la vérité de cette supposition."
 flavor_gaul.98.a:0 "Que nos flottes restent pour l'instant sur la mer d'Hibernie."
 flavor.gaul.98.tt:0 "La tâche '#Y La mer d'Hibernie#!' est désormais #G achevée#!."

 flavor_gaul.99.t:0 "Londinium"
 flavor_gaul.99.desc:0 "Quand nos vaisseaux envahisseurs traversèrent pour la première fois les eaux du #E Mare Germanicum#! dans l'espoir de piller les établissements côtiers de #E Pritannia#!, combien de nos marins auraient-ils pu prévoir que, un jour, notre [ROOT.GetCountry.GetRuler.GetName] bâtirait pour [ROOT.GetCountry.GetRuler.GetHerHim] même une capitale sur les rives du #E Tamesis#! ?\n\nNos frères ont quitté leurs terres ancestrales pour toujours, car [ROOT.GetCountry.GetRuler.GetFirstName] a déclaré que [GetProvince('(int32)2022').GetName] est la nouvelle capitale de [ROOT.GetCountry.GetName] — rupture irrévocable avec notre passé, et signe clair que le temps du changement est venu pour le peuple [ROOT.GetCountry.GetAdjective]."
 flavor_gaul.99.a:0 "Notre avenir est ici, sur l'île d'Albion..."
 flavor.gaul.99.tt:0 "La tâche '#Y Londinium#!' est désormais #G achevée#!."

 flavor_gaul.100.t:0 "Les mines de Belerion"
 flavor_gaul.100.desc:0 "Tout va selon le plan, [ROOT.GetCountry.GetRuler.GetName] ; les mines que nos gens ont bâties au pied des collines rocheuses de [GetProvince('(int32)2006').GetArea.GetName] se révèlent déjà de sages investissements, nous rapportant des dividendes que nul parmi nous n'avait osé espérer."
 flavor_gaul.100.a:0 "Voilà une excellente nouvelle — merci de me l'avoir dite."
 flavor.gaul.100.tt:0 "La tâche '#Y Les mines de Belerion#!' est désormais #G achevée#!."

 flavor_gaul.101.t:0 "Kent"
 flavor_gaul.101.desc:0 "Pendant bien des nuits, [ROOT.GetCountry.GetRuler.GetName] eut le même rêve : une lumière apparaissait dans la chambre du [ROOT.GetCountry.GetRulerTitle] et promettait récompense si un #E lieu saint#! était construit près du village de [GetProvince('(int32)2021').GetName]. Cette créature lumineuse refusa de livrer son nom, mais promit que la présence des dieux se ferait sentir au peuple si un lieu saint était érigé dans un bosquet sacré près du rivage. Bien que certains de [ROOT.GetCountry.GetCapital.GetName] eussent reculé devant les coûts de cette construction, [ROOT.GetCountry.GetRuler.GetFirstName] ordonna qu'on la menât à bien, convaincu au fond du cœur que les bienfaits seraient immédiats... et ils le furent."
 flavor_gaul.101.a:0 "Je le savais... nous devons offrir des sacrifices d'action de grâce."
 flavor.gaul.101.tt:0 "La tâche '#Y Kent#!' est désormais #G achevée#!."

 flavor_gaul.102.t:0 "Fortifier la Mercie"
 flavor_gaul.102.desc:0 "Quand les habitants de [GetProvince('(int32)2054').GetArea.GetName] demandèrent secours à [ROOT.GetCountry.GetRuler.GetName], le [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetAdjective] n'hésita point et vint aussitôt à leur aide. Les tribus qui y vivent sont las du pillage mené par les sauvages #E Celtes#! du nord, et acceptent tout ce qu'il faut pour assurer leur sécurité, mais ne sauraient se défendre seules.\n\nPour mettre fin à ce péril tribal, [ROOT.GetCountry.GetRuler.GetFirstName] envoya quelques-uns de nos meilleurs guerriers dans la région, leur ordonnant de surveiller les forêts et d'attaquer quiconque leur tomberait sous les yeux. La forteresse bâtie en Dobunnie deviendrait la base de ces soldats, prêts à faire respecter la paix [ROOT.GetCountry.GetAdjective] de leur vie."
 flavor_gaul.102.a:0 "Un jour, je conquerrai ces terres sans détour."
 flavor.gaul.102.tt:0 "La tâche '#Y Fortifier la Mercie#!' est désormais #G achevée#!."

 flavor_gaul.103.t:0 "Royaume anglo-saxon"
 flavor_gaul.103.desc:0 "La popularité sans égale de [ROOT.GetCountry.GetRuler.GetName] a permis à [ROOT.GetCountry.GetRuler.GetHerHim] de faire tout ce que [ROOT.GetCountry.GetRuler.GetSheHe] jugeait bon dans les terres gouvernées par les [ROOT.GetCountry.GetAdjective]s, car sans la conduite dynamique et brillante du clan #E [ROOT.GetCountry.GetRuler.GetFamily.GetName]#!, bien des grandes réalisations de ses proches ne seraient jamais advenues.\n\nEt quand le grand conquérant annonça qu'un nouveau royaume serait proclamé, gouverné depuis une capitale nouvelle qui étendrait sa domination sur tout #E Albion#!, les tribus de [ROOT.GetCountry.GetName] se réjouirent d'embrasser ce changement."
 flavor_gaul.103.a:0 "Gloire au #E royaume anglo-saxon#! et à son monarque !"
 flavor.gaul.103.tt:0 "La tâche '#Y Royaume anglo-saxon#!' est désormais #G achevée#!."

 flavor_gaul.104.t:0 "Royaume juto-saxon"
 flavor_gaul.104.desc:0 "La popularité sans égale de [ROOT.GetCountry.GetRuler.GetName] a permis à [ROOT.GetCountry.GetRuler.GetHerHim] de réaliser tout le nécessaire dans les terres gouvernées par les [ROOT.GetCountry.GetAdjective]s, car sans la conduite dynamique et brillante du clan #E [ROOT.GetCountry.GetRuler.GetFamily.GetName]#!, bien des grandes réalisations de ses proches ne seraient jamais advenues.\n\nEt quand le grand conquérant annonça qu'un nouveau royaume serait proclamé, gouverné depuis une capitale nouvelle qui étendrait sa domination sur tout #E Albion#!, les tribus de [ROOT.GetCountry.GetName] se réjouirent d'embrasser ce changement."
 flavor_gaul.104.a:0 "Gloire au #E royaume juto-saxon#! et à son monarque !"
 flavor.gaul.104.tt:0 "La tâche '#Y Royaume juto-saxon#!' est désormais #G achevée#!."

 flavor_gaul.105.t:0 "Royaume saxon"
 flavor_gaul.105.desc:0 "La popularité sans égale de [ROOT.GetCountry.GetRuler.GetName] a permis à [ROOT.GetCountry.GetRuler.GetHerHim] de réaliser tout le nécessaire dans les terres gouvernées par les [ROOT.GetCountry.GetAdjective]s, car sans la conduite dynamique et brillante du clan #E [ROOT.GetCountry.GetRuler.GetFamily.GetName]#!, bien des grandes réalisations de ses proches ne seraient jamais advenues.\n\nEt quand le grand conquérant annonça qu'un nouveau royaume serait proclamé, gouverné depuis une capitale nouvelle qui étendrait sa domination sur tout #E Albion#!, les tribus de [ROOT.GetCountry.GetName] se réjouirent d'embrasser ce changement."
 flavor_gaul.105.a:0 "Gloire au #E royaume saxon#! et à son monarque !"
 flavor.gaul.105.tt:0 "La tâche '#Y Royaume saxon#!' est désormais #G achevée#!."

 #Aremorica Mission Events

 flavor_gaul.106.t:0 "Les dons de Toutatis !"
 flavor_gaul.106.desc:0 "En sa munificence divine, Toutatis a rendu manifeste un objet sacré par lequel invoquer ses bénédictions !\n\nForgé par les mains de nos plus grands forgerons et dirigé par intervention divine, l'effort de nos plus experts et pieux artisans a produit un chaudron noir d'une grande élaboration, à la puissance bénie. Par ce moyen nous mènerons sacrifices, potions et sortilèges de haute importance à notre dieu sacré !\n\nAujourd'hui, pour nous avoir aidés à obtenir ce chaudron, les dieux ont encore plus nobilisé le peuple de [SCOPE.GetRootScope.GetCountry.GetName]. Par l'usage de notre nouveau récipient, notre fortune se décuplera !"
 flavor_gaul.106.a:0 "Par Toutatis, quelle puissance !"
 flavor_gaul.106.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_20$#!' est désormais #G achevée#!."

 flavor_gaul.107.t:0 "Centre commercial armoricain"
 flavor_gaul.107.desc:0 "Des côtes où nous voyions autrefois les vaisseaux carthaginois passer au loin vers les terres de Bretannia, nous accueillons désormais les maréchauds puniques qui mouillent dans nos propres ports, versant des tributs pour profiter de l'activité commerciale florissante.\n\nBien que notre position maritime nous ait toujours portés vers le négoce, nos terres furent longtemps négligées comme centres de tel commerce, forçant nos marchands vers Dumnonia et au-delà. Par les grands investissements de notre [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] en cette région, nous avons enfin fait de notre pays une place de richesse !"
 flavor_gaul.107.a:0 "Nous avons gagné grande relévance parmi les peuples gaulois."
 flavor_gaul.107.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_1$#!' est désormais #G achevée#!."

 flavor_gaul.108.t:0 "Flotte des [SCOPE.GetRootScope.GetCountry.GetAdjective]s"
 flavor_gaul.108.desc:0 "Il fut nécessaire pour [SCOPE.GetRootScope.GetCountry.GetName] de tenir une flotte respectable pour protéger son commerce avec les Pritanniens, mais l'accroissement du commerce et le détachement de nos vaisseaux pour l'expansion ont épuré nos forces navales.\n\nMaintenant cependant, nous avons enfin augmenté notre flotte selon nos besoins. Une fois de plus nous pouvons défendre notre commerce contre la piraterie et projeter notre volonté sur nos côtes de manière rarement imaginée."
 flavor_gaul.108.a:0 "Notre grande flotte dominera les mers !"
 flavor_gaul.108.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_3$#!' est désormais #G achevée#!."

 flavor_gaul.109.t:0 "Défense des côtes armoricaines"
 flavor_gaul.109.desc:0 "Malgré nos traditions marines, nos côtes furent longtemps en proie aux maraudeurs. Étant un peuple si lié à la mer, nos demeures, nombreuses, étaient trop éparpillées pour demeurer défendues.\n\nC'est avec grande sagesse que notre [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] décida de fortifier tous nos bourgs et villages échelonnés le long de la côte arémoricaine. Ce travail achevé, notre peuple peut enfin dormir sans crainte."
 flavor_gaul.109.a:0 "Les [SCOPE.GetRootScope.GetCountry.GetAdjective]s ne seront plus buts de rapines !"
 flavor_gaul.109.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_2$#!' est désormais #G achevée#!."

 flavor_gaul.110.t:0 "Une Armorique unie"
 flavor_gaul.110.desc:0 "Les Gaulois de notre péninsule sont demeurés trop longtemps divisés ! Seuls, nous n'étions que peu nombreux, mais ensemble les peuples d'Armorique peuvent aspirer à la vraie puissance. Des fröides mers du Nord au-delà des monts glaciaux, que tous les Celtes sachent qu'un peuple indomptable vit en Arémorica, qui aspire à bien plus qu'avant !"
 flavor_gaul.110.a:0 "Nul ne peut conquérir les Armoricains indomptés !"
 flavor_gaul.110.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_5$#!' est désormais #G achevée#!."

 flavor_gaul.111.t:0 "Saisie de la côte belge"
 flavor_gaul.111.desc:0 "Les féroces Belges s'inclinent enfin devant notre [SCOPE.GetRootScope.GetCountry.GetRulerTitle], et nos armées  se dressent victorieuses.\n\nLes Belges sont célèbres pour leur courage et leur vaillance, et nous savions dès le départ ce que nous attendait. Malgré cela, nous avons prouvé notre mérite et montré la suprématie armoricaine.\n\nDésormais nous régnerons sans rival sur le commerce de la Mer du Nord."
 flavor_gaul.111.a:0 "Victoire à [SCOPE.GetRootScope.GetCountry.GetName] !"
 flavor_gaul.111.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_9$#!' est désormais #G achevée#!."

 flavor_gaul.112.t:0 "Grande Armorique"
 flavor_gaul.112.desc:0 "Notre [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] peut à peine reprendre haleine. Épuisé, [ROOT.GetCountry.GetRuler.GetSheHe] rassemble toutes ses forces pour élever son regard sur le champ de bataille. Les corps jonchent le sol ; la plupart sont ceux de l'ennemi.\n\nÀ grand coût d'efforts, après de long marches et combats, les terres de ces peuples lointains sont enfin sous le commandement inconteste de notre [SCOPE.GetRootScope.GetCountry.GetRulerTitle]. Avec la dernière forteresse conquise, nous avons étendu le pouvoir [SCOPE.GetRootScope.GetCountry.GetAdjective] au-delà de ce qu'imaginaient nos ancêtres.\n\nBien que de plus grands défis puissent nous attendre, nous pouvons affirmer que c'est [SCOPE.GetRootScope.GetCountry.GetName] qui demeure suprême !"
 flavor_gaul.112.a:0 "Gloire à notre [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] !"
 flavor_gaul.112.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_12$#!' est désormais #G achevée#!."

 flavor_gaul.113.t:0 "Tribut dumnien"
 flavor_gaul.113.desc:0 "Parmi les royaumes pritanniens, les Dumnons sont le peuple qui partage le plus nos coutumes. C'est juste que notre première incursion au Nord nous amena leur contrôle. Bien qu'ils nous voient aujourd'hui avec blessure, ils verront bientôt la valeur de la paix et protection que nous apportons en échange de leur étain et tribut."
 flavor_gaul.113.a:0 "Dumnonie nous appartient maintenant !"
 flavor_gaul.113.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_6$#!' est désormais #G achevée#!."

 flavor_gaul.114.t:0 "Across Pritannia"
 flavor_gaul.114.desc:0 "Nous avons poussé profond dans les terres des royaumes pritanniens, dépassant les côtes vitales de Cambrie et établissant un avant-poste en Hibernie aussi.\n\nBien que nous venions longtemps en ces terres pour notre subsistance, nous étendons maintenant notre familiarité en possession solidaire. Avec les côtes pritanniennes sous notre maîtrise, la mer qui nous entoure est notre terrain de jeu."
 flavor_gaul.114.a:0 "Nul autre que [SCOPE.GetRootScope.GetCountry.GetName] ne dominera ces mers !"
 flavor_gaul.114.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_10$#!' est désormais #G achevée#!."

 flavor_gaul.115.t:0 "Un peuple de la mer"
 flavor_gaul.115.desc:0 "Nous sommes un peuple né de l'océan, destinés à y mourir aussi. Nous vivons de ses fruits, la traversons pour nos gains commerciaux et la chevauchons pour aller à la guerre.\n\nCette dépendance ancienne envers la mer s'est renforcée récemment, avec de nouveaux villages côtiers partout en [SCOPE.GetRootScope.GetCountry.GetName]. Nous célébrons ce patrimoine dans nos récits, poésies et œuvres !"
 flavor_gaul.115.a:0 "Ah, les vagues nous appellent au-delà de l'horizon..."
 flavor_gaul.115.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_4$#!' est désormais #G achevée#!."

 flavor_gaul.116.t:0 "Commerce avec les îles"
 flavor_gaul.116.desc:0 "Les peuples de Pritannia, par nos fréquents contacts, sont de plus en plus familiers avec nos coutumes. Or, ce qui intéresse vraiment [SCOPE.GetRootScope.GetCountry.GetName] est plus que l'accointance pritannienne: ce sont les biens précieux qui viennent uniquement des côtes du Nord.\n\nPar les liens commerciaux accrus que nos marchands ont noués, tous ces précieux biens arrivent chez nous en quantités plus grandes que jamais."
 flavor_gaul.116.a:0 "Nous devrions approfondir nos liens avec les Pritanniens encore plus !"
 flavor_gaul.116.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_7$#!' est désormais #G achevée#!."

 flavor_gaul.117.t:0 "Une nouvelle route de l'ambre"
 flavor_gaul.117.desc:0 "La pierre orange précieuse, appelée lyngurium par les Grecs, coulait autrefois en infimes quantités ; elle est devenue plus abondante par l'effort de nos plus ambitieux marchands.\n\nAyant cherché à tirer profit du négoce de cette pierre, nos marchands se sont avancés aux terres du Nord-Ouest où on la trouve, concluant des marchés avec les tribus du rivage de la Mer Suèbe.\n\nBien que toujours coûteuse, les colliers et objets d'ambre sont devenus plus courants parmi les nantis [SCOPE.GetRootScope.GetCountry.GetAdjective]s, nos nouvelles routes commerciales en permettant plus grande quantité."
 flavor_gaul.117.a:0 "Et les profits gonflent notre trésor..."
 flavor_gaul.117.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_17$#!' est désormais #G achevée#!."

 flavor_gaul.118.t:0 "Commerce étendu du Nord-Ouest"
 flavor_gaul.118.desc:0 "Bien que les terres des îles du Nord soient sous contrôle [SCOPE.GetRootScope.GetCountry.GetAdjective] depuis longtemps, il appert que les ports ne suffirent pas à exporter les biens extraits. Métaux, vases, chairs, laines et autres s'entassaient jusqu'à pourrir, les biens précieux perdus aux brigands.\n\nNotre [SCOPE.GetRootScope.GetCountry.GetRulerTitle] ordonna donc la construction de ports tout le long de la côte pritannienne. Maintenant une bien plus grande quantité de biens arrivent en notre métropole depuis les îles du Nord-Ouest."
 flavor_gaul.118.a:0 "L'importance de notre contrôle de Pritannia grandit sans doute !"
 flavor_gaul.118.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_23$#!' est désormais #G achevée#!."

 flavor_gaul.119.t:0 "Plus grand que Carthage"
 flavor_gaul.119.desc:0 "Nos flottes commerciales se sont étendues bien loin, notre marine s'est agrandie. Autrefois nous voyions les Carthaginois comme de paisibles étrangers ; leur hostilité s'est levée face à notre force croissante. Ils tentèrent de saborder nos routes et relations, mais tout vint à néant.\n\nIl est clair que notre puissance commerciale et navale dépasse celle de Carthage, et nous sommes maintenant prêts à imposer notre volonté sur la Mer Méditerranée même."
 flavor_gaul.119.a:0 "Notre influence se fera sentir au-delà des côtes de Baétique !"
 flavor_gaul.119.tt:0 "La tâche '#Y $barbaricum_aremorica_mission_task_19$#!' est désormais #G achevée#!."

 #

 flavor_gaul.120.t:0 "Un guerrier surgit de l'obscurité"
 flavor_gaul.120.desc:0 "[ROOT.GetCountry.GetRuler.GetName] a fait connaître son désir de conquérir pour [ROOT.GetCountry.GetName] ; nul n'ignore les cris de guerriers s'entraînant dans [ROOT.GetCountry.GetCapital.GetName]. Cependant [ROOT.GetCountry.GetRuler.GetSheHe] croyait que la pleine guerre n'était pas encore le moment.\n\nUn jour, comme [ROOT.GetCountry.GetRuler.GetFirstName] se préparait pour une chasse, un jeune homme armé apparut à sa porte et demanda audience.\n\n'Qui es-tu, vaillant, et pourquoi cherches-tu le [ROOT.GetCountry.GetRulerTitle] ?'\n\nPlaçant sa main sur son cœur, le soldat s'inclina et parla d'une voix pleine d'émotion. 'Je suis connu sous le nom de [SCOPE.sChar('chattia_character_appears_scope').GetName], et on m'a dit de venir ici.'\n\nLevant un sourcil, [ROOT.GetCountry.GetRuler.GetFirstName] répliqua. 'On t'a envoyé ? Qui ?'\n\n'Vous le trouverez peut-être difficile à croire, mais je jure par tous les dieux que c'est vrai — [GetDeityDefinition('omen_istaevo').GetName] m'est apparu en rêve et m'a dit que j'étais destiné à combattre dans la suite de [ROOT.GetCountry.GetRuler.GetFirstName].'"
 flavor_gaul.120.a:0 "C'est donc ainsi, jeune [SCOPE.sChar('chattia_character_appears_scope').GetFirstName] ? Nous verrons bien..."
 flavor_gaul.120.tt:0 "La tâche '#Y Un guerrier surgit de l'obscurité#!' est désormais #G achevée#!."

 flavor_gaul.121.t:0 "Commerce germano-celte"
 flavor_gaul.121.desc:0 "Le commerce entre les #E Germains#! et les #E Gaulois#! s'est intensifié, avec de nombreuses caravanes marchandes traversant les terres de [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetRuler.GetName], cherchant toujours à accroître la richesse de nos tribus, lève une petite taxe sur les cargaisons ; droit que beaucoup payent volontiers, sachant que le passage sûr vaut plus que l'or."
 flavor_gaul.121.a:0 "Le bon commerce profite à tous...cela m'agrée."
 flavor_gaul.121.tt:0 "La tâche '#Y Commerce germano-celte#!' est désormais #G achevée#!."
 chattia_germano_celt_trade_mod:0 "Commerce germano-celte"
 desc_chattia_germano_celt_trade_mod:0 "Grâce à notre position entre Germains et Gaulois, nous bénéficions des routes commerciales."

 flavor_gaul.122.t:0 "Faire fonctionner les fourneaux"
 flavor_gaul.122.desc:0 "Les fourneaux affamés de nos forgerons ne sont jamais rassasiés, car nos armées ont toujours besoin de fer @iron! pour les armes et nos guerriers de métaux précieux @precious_metals! pour leurs torques. [ROOT.GetCountry.GetRuler.GetName] a sagement investi dans les mines, et les rapports de nos travailleurs nous encourag ent."
 flavor_gaul.122.a:0 "Dites aux esclaves de travailler plus ! Nous avons des quotas à remplir."
 flavor_gaul.122.tt:0 "La tâche '#Y Faire fonctionner les fourneaux#!' est désormais #G achevée#!."
 barbaricum_form_francia_mission_task_8_tt:0 "Nous devons posséder au moins #T 1 Mine#! dans la province de #G Sicambrie#!."

 flavor_gaul.123.t:0 "Les nombreux fils d'Istijo"
 flavor_gaul.123.desc:0 "Les tribus [ROOT.GetCountry.GetAdjective]s ont déchaîné leur colère, se répandant des forêts de [ROOT.GetCountry.GetCapital.GetName] et conquérant de vastes terres en peu de temps. Même [ROOT.GetCountry.GetRuler.GetName] est surpris du succès de ses armées — aurait-on sous-estimé leur force ?\n\nLes nombreux combats contre les #E Gaulois#! ont affilé les talents de notre [ROOT.GetCountry.GetRuler.GetFirstName] ; maintenant ses armées, guéries de la soif de victoire, crèvent d'envie de piller bien d'autres terres — souhait qui sera bientôt accordé."
 flavor_gaul.123.a:0 "Les fils triomphants de [GetDeityDefinition('omen_istaevo').GetName] feront festin ce soir !"
 flavor_gaul.123.tt:0 "La tâche '#Y Les nombreux fils d'Istijo#!' est désormais #G achevée#!."

 flavor_gaul.124.t:0 "Une Capitale digne"
 flavor_gaul.124.desc:0 "À travers [ROOT.GetCountry.GetName], on chante déjà les embellissements apportés à notre capitale ; tributs et guerriers convergent vers [ROOT.GetCountry.GetCapital.GetName], aspirant à servir sous l'étendard de [ROOT.GetCountry.GetRuler.GetName]. Le [ROOT.GetCountry.GetRulerTitle] commande le respect, sûr de soigner les siens. Nos frères, avides de gloire et de richesse, s'empressent de rejoindre [ROOT.GetCountry.GetRuler.GetHerHis] bannière."
 flavor_gaul.124.a:0 "En [ROOT.GetCountry.GetCapital.GetName], tous trouveront leur place."
 flavor_gaul.124.tt:0 "La tâche '#Y Une Capitale digne#!' est désormais #G achevée#!."

 flavor_gaul.125.t:0 "Une Forteresse marchande"
 flavor_gaul.125.desc:0 "Par sagesse, [ROOT.GetCountry.GetRuler.GetName] a fait ériger de puissantes fortifications autour du marché de [ROOT.GetCountry.GetCapital.GetName]. Les négociants naviguant autour de [ROOT.GetCountry.GetCapital.GetArea.GetName] s'empressent de franchir nos murs avant le crépuscule, assurés d'y trouver sécurité. Nos quartiers s'agrandissent pour accueillir cette prospérité nouvelle ; c'est le signe incontestable de nos jours heureux."
 flavor_gaul.125.a:0 "Venez offrir vos produits ici, et goûtez à l'hospitalité de nos murs."
 flavor_gaul.125.tt:0 "La tâche '#Y Une Forteresse marchande#!' est désormais #G achevée#!."
 chattia_trade_fort_mod:0 "Forteresse marchande"
 desc_chattia_trade_fort_mod:0 "Pour défendre nos précieux revenus marchands, une forteresse a été construite dans notre principal centre de commerce."

 flavor_gaul.126.t:0 "Sang gaulois versé"
 flavor_gaul.126.desc:0 "Pour les tribus de #E Gaule#!, l'ascension de [ROOT.GetCountry.GetRuler.GetName] est cauchemar incarné ; le redoutable [ROOT.GetCountry.GetRulerTitle] a rassemblé guerriers féroces et les lâche sur des terres inguerres. Les frontières de [ROOT.GetCountry.GetName] s'étendent à rythme qui glace le sang des villages paisibles. Les Anciens gaulois convoquent leurs assemblées en hâte, se demandant si la menace [ROOT.GetCountry.GetAdjective] les épargnera.\n\nPour certaines tribus, la réponse fut cruelle."
 flavor_gaul.126.a:0 "En avant vers la gloire éternelle !"
 flavor_gaul.126.tt:0 "La tâche '#Y Sang gaulois versé#!' est désormais #G achevée#!."

 flavor_gaul.127.t:0 "Centraliser l'État"
 flavor_gaul.127.desc:0 "Les triomphes de [ROOT.GetCountry.GetName] ne tiennent pas qu'aux victories des champs de bataille, mais à l'ordre politique qui permet aux [ROOT.GetCountry.GetAdjective]s d'administrer leurs conquêtes. [ROOT.GetCountry.GetRuler.GetName] confère longuement avec le #E Conseil Tribal#!, s'assurant que chaque voix résonne en [ROOT.GetCountry.GetCapital.GetName] avec dignité. Cette attention à l'ordre interne porte fruit ; la tribu se centralise et s'affermit."
 flavor_gaul.127.a:0 "Nos victoires futures reposent sur ce que nous avons édifié aujourd'hui."
 flavor_gaul.127.tt:0 "La tâche '#Y Centraliser l'État#!' est désormais #G achevée#!."
 chattia_political_influence_modifier:0 "Chattia Centralisée"
 desc_chattia_political_influence_modifier:0 "Par nos réformes internes, notre influence politique s'est fortifiée."

 flavor_gaul.128.t:0 "Étalon de Barre de Fer"
 flavor_gaul.128.desc:0 "Avec l'essor du négoce, il a fallu normaliser le fer @iron! que travailleurs et forgerons emploient. [ROOT.GetCountry.GetRuler.GetName] s'y est attelé noblement, malgré le prix élevé de l'entreprise ; le [ROOT.GetCountry.GetRulerTitle] savait que nul sacrifice ne devrait épargner l'ordre du royaume.\n\nLes résultats ont dépassé espérances ; production s'est décuplée. Certes, nos esclaves maugréent, mais tous les autres jouissent de cette richesse nouvelle."
 flavor_gaul.128.a:0 "Chacun dans [ROOT.GetCountry.GetName] doit faire son devoir."
 flavor_gaul.128.tt:0 "La tâche '#Y Étalon de Barre de Fer#!' est désormais #G achevée#!."

 flavor_gaul.129.t:0 "Le Royaume des Francs"
 flavor_gaul.129.desc:0 "Lorsque le #E Conseil Tribal#! présenta à [ROOT.GetCountry.GetRuler.GetName] une couronne d'or, le [ROOT.GetCountry.GetRulerTitle] demeurait interdit. Certes, [ROOT.GetCountry.GetRuler.GetSheHe] nourrit longtemps le rêve de royauté, mais des tourments pressants occupaient [ROOT.GetCountry.GetName] et l'heure ne semblait jamais propice.\n\nLors donc que les Chefs se rassemblèrent pacifiquement en [ROOT.GetCountry.GetCapital.GetName] pour rendre hommage, ce fut grande merveille. Jamais en l'histoire des tribus [ROOT.GetCountry.GetAdjective]s n'avait un chef accompli autant que [ROOT.GetCountry.GetRuler.GetFirstName], et cet honneur lui semblait justement acquis."
 flavor_gaul.129.a:0 "Tu es notre Roi naturel... [GetDeityDefinition('omen_istaevo').GetName] t'accorde ce titre, non point nous."
 flavor_gaul.129.tt:0 "La tâche '#Y Le Royaume des Francs#!' est désormais #G achevée#!."


 flavor_gaul.130.t:0 "Salland"
 flavor_gaul.130.desc:0 "L'oppidum de [SCOPE.sProvince('batavian_city_scope').GetName] est enfin achevé, et les nôtres, désormais nommés #COLOR:{0.207,0.301,1} Francs Saliens#!, se sont implantés dans les marais du delta de la #E Rinaz#!, formant cette île qu'on appelle #E Batavie#!.\n\nLes marais sont meurtrissants, gorgés de pestilence et difficiles d'accès ; bien des esclaves y ont succombé. La vie en [SCOPE.sProvince('batavian_city_scope').GetName] demeure rude : approvisionnements épars, difficultés multiples. Déjà, certains murmurent de repeupler d'autres terres..."
 flavor_gaul.130.a:0 "Nous verrons où cela nous mènera."
 flavor.gaul.130.tt:0 "La tâche '#Y Salland#!' est désormais #G achevée#!."

 flavor_gaul.131.t:0 "Ripuaria"
 flavor_gaul.131.desc:0 "Au nord, nos cousins se sont implantés pacifiquement, tandis qu'en [GetProvince('(int32)3726').GetArea.GetName], les terres se disputent à outrance ; de la mer arrivent régulièrement raids celtiques, et notre venue a renforcé les violences entre tribus.\n\nMaintenant, les #COLOR:{0.361,0.807,0.525} Ripuariens#! s'enracinent ici. Longtemps avant de franchir la #E Rinaz#!, ils rêvaient d'elle : terre de douceur et ciel pur. Pourtant menaces abondent, car les tribus rémontent le fleuve, affamées et bellqueuses..."
 flavor_gaul.131.a:0 "Il y a toujours quelque chose à accomplir, un ennemi à terrasser !"
 flavor.gaul.131.tt:0 "La tâche '#Y Ripuaria#!' est désormais #G achevée#!."

 flavor_gaul.132.t:0 "Settle Toxandria"
 flavor_gaul.132.desc:0 "The tall, dark trees of Toxandria hid their secrets right up to the point our armies crossed the #E Rinaz#!; what presented itself as a fertile and plentiful land is yet again wet, damp and muddy. Some elders who went along chastise their leaders, such as [SCOPE.sChar('salian_chieftain_scope').GetName] for the two forced, and ultimately disappointing, migrations out of the land where our ancient ones reigned.\n\nThat is now the past though, and the #COLOR:{0.207,0.301,1} Salian Franks#! must now work very hard to establish a living in these formerly Celt lands; they have decided to have their councils in a place they now call #E Tohsandrjo Bairgaz#!."
 flavor_gaul.132.t:0 "Coloniser la Toxandria"
 flavor_gaul.132.desc:0 "Les arbres noirs et massifs de la Toxandria gardaient leurs secrets jusqu'à l'arrivée de nos armées franchissant la #E Rinaz#! ; ce qui semblait terre fertile et généreuse se révéla boueuse et détrempée. Les anciens parmi nos contingents se lamentent des deux migrations forcées, si décevantes, loin des terres où nos pères avaient régné.\n\nCe temps est révolu. Les #COLOR:{0.207,0.301,1} Francs Saliens#! doivent laborer dur pour s'enraciner ici, anciennement gauloise. Leurs conseils se tiendront en #E Tohsandrjo Bairgaz#!."
 flavor_gaul.132.a:0 "Oublie la fatigue et trace le chemin de l'effort !"
 flavor.gaul.132.tt:0 "La tâche '#Y Coloniser la Toxandria#!' est désormais #G achevée#!."

 flavor_gaul.133.t:0 "La Vallée de Moginos"
 flavor_gaul.133.desc:0 "La plaine bucolique de Moginos est vaste et hospitalière. C'est terre heureuse où les faibles Celtes ont cédé sans grande résistance.\n\nSous la bénédiction de [GetDeityDefinition('omen_istaevo').GetName], nous, #COLOR:{0.361,0.807,0.525} Ripuariens#!, avons conquis des terres dont nos pères n'osaient que rêver. Telle est la puissance de sa grâce."
 flavor_gaul.133.a:0 "Un nouveau refuge sûr pour nos familles."
 flavor.gaul.133.tt:0 "La tâche '#Y La Vallée de Moginos#!' est désormais #G achevée#!."

 flavor_gaul.134.t:0 "Le long de la Rinaz"
 flavor_gaul.134.desc:0 "Les #COLOR:{0.361,0.807,0.525} Francs Ripuariens#! ont défié le cours de la rivière, remontant vers terres inconnues, leurs boucliers repoussant les assauts des #E Celtes#! [GetCulture('ubian').GetName], leurs pieds gravissant collines, forêts et palissades. Ils contrôlent désormais l'essentiel du cours de la grande Rinaz ; quelle prouesse!."
 flavor_gaul.134.a:0 "Vaillants soldats, soyez fiers!"
 flavor.gaul.134.tt:0 "La tâche '#Y Le long de la Rinaz#!' est désormais #G achevée#!."

 flavor_gaul.135.t:0 "Toxandria jadis stérile"
 flavor_gaul.135.desc:0 "De nombreux efforts ont transformé cette région ; canaux creusés entre champs, forêts déboisses, désert devenu habitable. Villages s'y multiplient, peuplant de migrants venus d'outre-fleuve, car famine aurait sévi là-bas. Les antiques cérémonies celtiques ont cédé aux autels de [GetReligion('germanic_religion').GetName], où régnent vrais dieux. La chasse sauvage a franchi la #E Rinaz#! !"
 flavor_gaul.135.a:0 "Quel exploit prodigieux !"
 flavor.gaul.135.tt:0 "La tâche '#Y Toxandria jadis stérile#!' est désormais #G achevée#!."

 flavor_gaul.136.t:0 "Vers l'Ouest"
 flavor_gaul.136.desc:0 "« Nous n'avions jamais connu tel climat, été sucré, hivers dénués de neige, champs verts comme les plus beaux joyaux. Nous, #COLOR:{0.207,0.301,1} Francs Saliens#!, avons découvert notre destin : une terre où vivre n'est point supplice, mais plénitude », dit au tournant du monticule [SCOPE.sChar('salian_chieftain_scope2').GetName].\n\n« Et j'ai vu ses guerriers dévêtus ces derniers temps en étés (je conviens la chaleur y est infernale), mais nous sommes ici, installés en cette divine région. Honneur à nous et à [SCOPE.sChar('salian_warband_leader_scope').GetName] !"
 flavor_gaul.136.a:0 "Formidable !"
 flavor.gaul.136.tt:0 "La tâche '#Y Vers l'Ouest#!' est désormais #G achevée#!."

 flavor_gaul.137.t:0 "La conversion germanique"
 flavor_gaul.137.desc:0 "Les chars qui défilèrent le long de la Rinaz, leurs roues éclaboussant l'onde, ont posé leurs tonnelles sur cette terre vierge.\n\nLes #COLOR:{0.356,0.141,0} Fraujaz#! célèbrent ici cérémonies nouvelles, où régnent nos dieux ancestraux."
 flavor_gaul.137.a:0 "Nous, porteurs de nos dieux en ce monde, méritons louange."
 flavor.gaul.137.tt:0 "La tâche '#Y La conversion germanique#!' est désormais #G achevée#!."

 flavor_gaul.138.t:0 "Turnacum et Camaracum"
 flavor_gaul.138.desc:0 "Heureux hasard qu'en deux lieux si accueillants se soient établis, séparément, deux groupes de #COLOR:{0.207,0.301,1} Francs Saliens#!. Ces deux cités servent de sièges administratifs pour nos terres occidentales ; dès l'origine, elles se sont étendues. Nous avons perfectionné nos arts de bâtisseurs, démolissant maintes demeures, car la vermine urbaine y régnait."
 flavor_gaul.138.a:0 "Fortune de la vie."
 flavor.gaul.138.tt:0 "La tâche '#Y Turnacum et Camaracum#!' est désormais #G achevée#!."

 flavor_gaul.139.t:0 "Fortifier nos frontières occidentales"
 flavor_gaul.139.desc:0 "Certains chantaient que la civilisation nous pervertirait, nous rendant oublieux de leurs rudes origines. Or, avec tumultes grondant en Gaule, voilà que nous pouvons les démentir ! De nombreuses oppida, longtemps délaissées, se sont élevées le long du [GetProvince('(int32)9168').GetName], réaménagées pour guerres nouvelles.\n\nNul doute : cette rivière est désormais ligne d'une organisation sans pareille au nord."
 flavor_gaul.139.a:0 "Nulle pitié pour qui ose franchir nos frontières."
 flavor.gaul.139.tt:0 "La tâche '#Y Fortifier nos frontières occidentales#!' est désormais #G achevée#!."

 flavor_gaul.140.t:0 "Les Saliens triomphants"
 flavor_gaul.140.desc:0 "La prospérité des terres #COLOR:{0.207,0.301,1} Saliennes#! fit croître rapidement l'influence salienne au gouvernement ; voilà que tous s'en furent en [GetProvince('(int32)3045').GetName], contrée si distincte, mais beauté sans pareille, près des flots et naturellement fortifiée. Un tertre contient mille possibilités.\n\nSes champs annoncent une  ère nouvelle pour [GetCulture('istvaeonic').GetName]#E s#!, loin terre source. Fini les despotiques Suèves, hivers mortifères, champs stériles. À présent, nous sommes inarrêtables."
 flavor_gaul.140.a:0 "Vers l'ouest !"
 flavor.gaul.140.tt:0 "La tâche '#Y Les Saliens triomphants#!' est désormais #G achevée#!."

 flavor_gaul.141.t:0 "Les Ripuariens triomphants"
 flavor_gaul.141.desc:0 "Certains rêvent déjà de grandes cités [GetCulture('istvaeonic').GetName]es en ces lieux, songe lointain mais non impossible.\n\nGrand cortège du chef suivi de peuple loyal, du [GetProvince('(int32)3831').GetName] au [GetProvince('(int32)3690').GetName]. Fini les despotiques Suèves, hivers mortifères, champs stériles. À présent, nous sommes inarrêtables."
 flavor_gaul.141.a:0 "Vers les fleuves !"
 flavor.gaul.141.tt:0 "La tâche '#Y Les Ripuariens triomphants#!' est désormais #G achevée#!."

 flavor_gaul.142.t:0 "La Révolte des Suèves"
 flavor_gaul.142.desc:0 "Tant de nôtres migrèrent vers l'occident que peuples [GetCulture('irminonic').GetName]s de l'orient, dénués d'auxiliaires francs, ont décidé de renier la vassalité et cracher à face de leurs anciens maîtres.\n\n Les Tribus suèves se rassemblent autour du vieux chef ambitieux [SCOPE.sCountry('cheruscia_revolt_scope').GetRuler.GetName] des #E Chérusques#!, qui mande les ambassadeurs : paix ou guerre, feu et destruction.\n\nNos guerriers s'enflamment de vengeance. Or, l'exode occidental laissa anciens territoires dépeuplés ; ceux de l'occident songent peu à combattre pour rues délaissées."
 flavor_gaul.142.a:0 "Ces huttes boueuses, qu'elles périssent !"
 flavor_gaul.142.b:0 "Nulle choix ; il faut marcher pour notre honneur !"
 flavor.gaul.142.tt:0 "La tâche '#Y La Révolte des Suèves#!' est désormais #G achevée#!."
 francia_overstretched_armies:0 "Francie débordante"
 cheruscia_morale_marines:0 "Esprit des Forêts Suèves"
 SUEBI_FREEDOM_WARBAND:0 "Bande guerrière de Suèves Libres"