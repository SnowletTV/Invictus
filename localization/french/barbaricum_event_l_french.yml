l_french:
 flavor_germanics.1.t:0 "Le grand déluge"
 flavor_germanics.1.desc:0 "Des jours de pluie et d'orages ont fait craindre à nos habitants de [SCOPE.germanics_1_target.GetName] que la fin des temps approche. Cependant, ceux-ci n'ont pas annoncé la fin, mais une grande inondation qui a englouti maisons, animaux et humains - tous destinés à ne plus jamais revoir la lumière des jours. \n \nAprès que ce soit fini, les survivants ont loué les dieux mais sont maintenant posés avec le grand défi de reconstruire ce qui était autrefois. La terre est encore inondée deux fois par jour, créant des milliers de petites îles complètement entourées d'eau, mais l'eau se retire lentement... \n \nNotre peuple attend de nous que nous mettions de côté une partie de nos fonds pour essayer d'aider ceux qui en ont besoin, afin de tirer le meilleur parti de la situation."
 flavor_germanics.1.a:0 "Dépenser de l'argent."
 flavor_germanics.1.b:0 "Utiliser l'armée comme main-d'œuvre."
 flavor_germanics.1.c:0 "Ils sont seuls."
 flavor_germanics.1.tt:0 "Jusqu'à #Y 20%#! de la population de #Y [THIS.GetProvince.GetName]#! est tué par le déluge."
 flavor_germanics.2.t:0 "Règlement Terp"
 flavor_germanics.2.desc:0 "L'augmentation récente de la population a entraîné une demande accrue de terres habitables. Certains de nos hommes ont élevé pour imiter les colonies frisonnes de terp, qu'ils ont érigées il y a plusieurs siècles. Le rivage d'Amsivaria semble être un bon endroit pour entasser de la boue pour créer des terps et construire des maisons dessus pour les protéger des inondations. Nous aurions cependant besoin d'envoyer quelques-uns de nos hommes pour les aider."
 flavor_germanics.2.a:0 "Construisez une telle colonie."
 flavor_germanics.2.b:0 "Il y a d'autres sujets plus importants."
 flavor_germanics.4.t:0 "Décès d'un être cher"
 flavor_germanics.4.desc:0 "Après la mort de [SCOPE.sChar('rip_dead_dog').GetName], des gens ont essayé de me réconforter, mais je n'ai jamais eu l'impression qu'ils comprenaient vraiment. Maintenant, j'ai tendance à les éviter ainsi que leurs bavardages inutiles. Cependant, il y a une âme dont je n'ai pas détesté la compagnie : un chien brun qui a participé au rituel de l'œillet du corps de [SCOPE.sChar('rip_dead_dog').GetName] et montre un comportement similaire. Peut-être que le prêtre m'a conseillé correctement et que nos proches vivent vraiment dans les chiens après une cérémonie appropriée."
 flavor_germanics.4.a:0 "Jolie levrette, tu me comprends mieux que personne."
 flavor_germanics.5.t:0 "Mort de votre chien"
 flavor_germanics.5.desc:0 "Votre chien fidèle et de confiance a enfin rendu son dernier souffle. Il vous a servi longtemps depuis que vous avez reconnu votre être cher décédé pour la première fois dans son comportement, mais il est maintenant temps d'enterrer votre vieil ami."
 flavor_germanics.5.a:0 "Je vais l'enterrer tranquillement."
 flavor_germanics.6.t:0 "Le bosquet sacré de Mannus"
 flavor_germanics.6.desc:0 "Une fois de plus il est temps, le sacrifice à Mannus aura lieu ce soir. Comme toujours, nous sommes enchaînés, montrant notre soumission à notre grand Dieu. Heureusement, personne n'est tombé cette fois-ci - un bon présage. L'année dernière, le fils du chaman a dû se rouler par terre après être tombé. L'année écoulée nous a apporté de nombreuses tempêtes et la récolte a été mauvaise. Cela a sûrement été causé par le jeune maladroit ! \n \nLe sacrifice de cette année se dresse fièrement au milieu de la terre sacrée, lié au vieux chêne derrière lui. Ses traits sont à peine reconnaissables, car les derniers rayons du soleil du jour m'aveuglent, la volonté de Mannus le cache de ma vue. Déjà le Chaman s'approche de la victime, pressant le tranchant du couteau contre sa poitrine, provoquant la chute des premières gouttelettes de sang sur le jeune chêne sous lui. Sa force vitale renouvellera les forêts et la terre. Pour sauvegarder nos communautés et améliorer nos récoltes, il est offert à Mannus. Maintenant, la lame transperce son cœur, son dernier souffle nous maudit, tout en allumant le feu de la vie. \n \nDéjà, les oiseaux se sont mis à chanter et à se réjouir, comblant le vide laissé par les sacrifices de la mort."
 flavor_germanics.6.a:0 "Mannus, accorde-nous la force !"
 flavor_germanics.6.b:0 "S'opposer au rituel."
 flavor_germanics.7.t:0 "Le chariot de Nerthuz dans les profondeurs"
 flavor_germanics.7.desc:0 "Il est temps pour notre prêtre de reprendre le chariot de Nerthuz, le temps de la guerre est révolu. L'épée sera remplacée par la charrue, la terre fertile ensemencée de grains. Quand Nerthuz visitera nos maisons, il y aura plus d'enfants, la fécondité des femmes est plus grande qu'avant. Ils sont tous bénis par son voyage sur la terre, jusqu'à ce qu'elle s'en lasse. Son premier serviteur suivra sa maîtresse dans son domaine de l'océan. Là, le prêtre enfermera à nouveau le chariot, après que les esclaves aient lavé le chariot et l'aient orné de fleurs et d'or. Par la suite, les esclaves sont dévorés par l'océan, le dernier sacrifice à Nerthuz, jusqu'à ce qu'elle se réveille une fois de plus et bénisse les terres de sa présence."
 flavor_germanics.7.a:0 "Nerthuz, bénis-nous !"
 flavor_germanics.7.b:0 "Arrêtez le prêtre !"
 
 flavor_germanics.8.t:0 "Arioviste"
 flavor_germanics.8.desc:0 "Dans nos rangs, un homme appelé par les Gaulois Arioviste, titre honorifique gaulois pour un grand chef militaire, est apparu récemment. C'est un vrai guerrier Suebian qui a combattu et remporté de nombreuses batailles parfois même avec les Gaulois. \n \nAu cours de ces campagnes, il a appris la langue gauloise, une compétence qui, associée à ses contacts avec les Vangiones, les Némètes et les Tribocci, pourrait nous aider à former une alliance avec ces tribus. \n \nParmi notre peuple, de plus en plus réclament son leadership, car les réalisations de [ROOT.GetCountry.GetRuler.GetName] sont pâles par rapport aux réalisations d'Ariovistus."
 flavor_germanics.8.a:0 "Faites d'Ariovistus notre nouveau dirigeant."
 flavor_germanics.8.b:0 "Ce n'est qu'un parvenu !"

 NICKNAME_ARIOVISTUS:0 "Arioviste"
 FAMILY_ARIOVISTID:0 "Arioviste"
 ariovistid:0 "Sang d'Arioviste"
 ariovistid_desc:0 "Arioviste est un titre honorifique gaulois pour un grand chef militaire. Il a été accordé à un guerrier Suebian qui a combattu et remporté de nombreuses batailles parfois même avec des Gaulois. Au cours de ces campagnes, il a appris la langue gauloise et a noué des alliances avec plusieurs Gaulois. \n \nBien que son nom d'origine ait disparu, ses exploits sont encore dans les mémoires à ce jour. \n \n#G Ce trait peut être transmis de manière matrilinéaire ou patrilinéaire.#!"
 flavor_germanics.9.t:0 "Les alliés d'Arioviste"
 flavor_germanics.9.desc:0 "Les contacts d'Ariovistus avec les Gaulois vivant dans notre sud nous ont assuré des « alliances » avec eux, car ils nous sont évidemment subordonnés, les Suebi, sous la forme d'affluents."
 flavor_germanics.9.a:0 "Ils feront de redoutables « alliés »."

 flavor_germanics.10.t:0 "Le mariage norique"
 flavor_germanics.10.desc:0 "Notre plaidoyer pour un mariage politique avec une princesse noricaine a été entendu. Ils ont présenté [SCOPE.sChar('noric_princess').GetName], une belle et belle demoiselle d'origine noble."
 flavor_germanics.10.a:0 "Appelez le prêtre."
 flavor_germanics.10.b:0 "Il y a de meilleurs matchs en attente."

 flavor_germanics.11.t:0 "La Ligue Lugienne"
 flavor_germanics.11.desc:0 "Les Vandales sont notoirement divisés en plusieurs tribus différentes. Ils n'aiment pas renoncer à leur allégeance tribale. Si les Vandales doivent prospérer, nous devons les unir en une confédération sous l'égide de Lugus, le dieu celtique des forgerons, car les dieux celtiques sont apparemment supérieurs à nos anciennes croyances. \n \nSi nous parvenions à organiser nos alliés dispersés et les factions mineures indépendantes, notre hégémonie serait incontestable."
 flavor_germanics.11.a:0 "Envoyez les invitations."

 flavor_germanics.12.t:0 "La Ligue Lugienne"
 flavor_germanics.12.desc:0 "Les ambassadeurs de [SCOPE.sC('mission_country_lugia').GetName] sont venus nous voir avec une offre. Les tribus vandales sont faibles lorsqu'elles sont isolées, et l'Europe centrale a été le champ de bataille des Celtes pendant trop longtemps. Ils prétendent que si les Vandales doivent prospérer, nous devons nous unir en une confédération sous l'égide de Lugus, le dieu celtique des forgerons, car les dieux celtiques sont apparemment supérieurs à nos anciennes croyances. \n \nLa proposition est scandaleuse, mais nous n'aurons peut-être pas le choix, car une ligue forte sous la protection d'un leader fort pourrait être notre seule chance de survie."
 flavor_germanics.12.a:0 "Rejoignez la Ligue."
 flavor_germanics.12.b:0 "Défendez notre souveraineté !"
 flavor_germanics.13.t:0 "Navire de Nehalennia"
 flavor_germanics.13.desc:0 "Nehalennia, nous te remercions pour une année de terre fertile, de femmes et de récolte. De nombreux enfants sont nés, dotés de membres et d'un esprit sains. Les récoltes ont poussé en abondance, pour cela nous remercions votre prêtre, qui vous a amené à nous il y a de nombreuses saisons. Nous te remercions pour la protection des vivants contre les mauvais esprits et la protection des morts jusqu'à leur arrivée dans l'au-delà. Cette route périlleuse vers le royaume des morts, vous la sauvegardez. Votre navire les transporte tous et amène le nouveau-né dans le ventre des mères. Nous vous remercions Nehelennia d'avoir entendu nos demandes et nous vous remercions de les avoir satisfaites."
 flavor_germanics.13.a:0 "Nehelennia soit louée !"

 flavor_germanics.14.t:0 "Le désert helvétique"
 flavor_germanics.14.desc:0 "Lors de la conquête des terres helvètes, notre peuple a pillé tous les villages helvètes. Cette terre sera connue sous le nom de désert helvétique même dans d'innombrables siècles !"
 flavor_germanics.14.a:0 "Le monde va brûler !"

 flavor_germanics.15.t:0 "La chute des Éduens"
 flavor_germanics.15.desc:0 "L'oppidum éduen est en ruine, les Éduens sont dispersés et nos guerriers ont pillé tout ce qu'ils ont pu trouver. Dans cette tourmente, les Aedui ont envoyé un druide avec un appel à l'aide, mais sa mission a échoué, car personne ne veut aider l'arrogant Aedui contre notre puissance."
 flavor_germanics.15.a:0 "Le monde va brûler !"

 flavor_germanics.16.t:0 "La chute de l'Ubii"
 flavor_germanics.16.desc:0 "Enfin, l'oppidum Ubien est tombé. La bataille a été assez féroce, car nos guerriers ont dû se battre en montée et percer trois remparts circulaires. Ensuite, nos guerriers Suebian ont pillé tout ce qu'ils ont pu trouver. \n \nLes Ubii ne pourront plus venir en aide aux Gaulois à l'ouest du Rhenus."
 flavor_germanics.16.a:0 "Le monde va brûler !"

 flavor_germanics.17.t:0 "Rex germanorum"
 flavor_germanics.17.desc:0 "Seulement six étapes. [ROOT.GetCountry.GetRuler.GetName] serait alors à la destination de ses plans ambitieux : s'asseoir sur le trône en tant qu'oint Rex Germanorum, comme les Romains l'appelaient avant même ce jour. \n \n [ROOT.GetCountry.GetRuler.GetName] aurait de préférence chargé les six dernières étapes. Mais par déférence pour la majesté du moment, il marchait pas à pas avec dignité. \n \nLorsqu'il se tenait devant le trône sans prétention, il persévéra peu de temps, le dos tourné au public. Puis il se tourna et s'arrêta de nouveau, tout en regardant triomphalement et sévèrement l'homme le plus important de son royaume. \n \nJusqu'à ce qu'il s'assit avec des réjouissances. Un sentiment grisant l'envahit... omnipotence, infaillibilité et fierté. Il était maintenant [ROOT.GetCountry.GetRuler.GetName] le premier du nom, Rex Germanorum."
 flavor_germanics.17.a:0 "Longue vie [ROOT.GetCountry.GetRuler.GetName]!"

 flavor_germanics.18.t:0 "Le gué de l'Albis"
 flavor_germanics.18.desc:0 "Le #E Conseil des clans#! a tranché : nous quittons la sûreté de [ROOT.GetCountry.GetCapital.GetName] pour franchir l'ardente #E rivière Albis#!. Mais déjà gronde le débat.\n\n[SCOPE.sCharacter('clan_chief_one').GetName], vaillant et hardi, réclame le premier gué ; son frère, [SCOPE.sCharacter('clan_chief_two').GetName], veut que les hommes du clan [SCOPE.sCharacter('clan_chief_two').GetFamily.GetName] prouvent leur force devant les #E [SCOPE.sCharacter('clan_chief_one').GetFamily.GetName]s#!.\n\n[ROOT.GetCountry.GetRuler.GetName] n'a que faire de leurs querelles. Il faut choisir."
 flavor_germanics.18.a:0 "Je me fie à [SCOPE.sCharacter('clan_chief_one').GetFirstName], vaillant et sûr."
 flavor_germanics.18.b:0 "Suivons [SCOPE.sCharacter('clan_chief_two').GetFirstName] ; qu'il ne nous trompe point."
 flavor_germanics.18.c:0 "L'honneur du gué m'appartient !"
 flavor_germanics.18.tooltip:0 "La tâche '#Y Le gué de l'Albis#!' est désormais #G achevée#!."

 flavor_germanics.19.t:0 "Les alliés du Nord"
 flavor_germanics.19.desc:0 "Les bandes du Nord ont menacé nos bords ; maintenant, ils ont juré foi au clan [ROOT.GetCountry.GetRuler.GetFamily.GetName].\n\nIls ne nous trament point ; ils veulent joindre leurs forces aux nôtres, pour abattre nos ennemis communs. Ils voient notre butin et veulent y goûter.\n\nReste à décider : combattre au front, ou laisser nos nouveaux alliés razzier à cœur joie."
 flavor_germanics.19.a:0 "Écrasons nos ennemis ; puis nous pillerons leurs champs."
 flavor_germanics.19.b:0 "À qui prend le plus d'esclaves, un pièce d'or !"
 flavor_germanics.19.tooltip:0 "La tâche '#Y Les alliés du Nord#!' est désormais #G achevée#!."
 suebians_choose_military_bonus_tt:0 "Nous choisirons un #R bonus militaire#! pour nos armées."

 flavor_germanics.20.t:0 "Chasser Usipètes et Tenctères"
 flavor_germanics.20.desc:0 "Nos guerriers victorieux ont broyé les vaillants #E Usipètes#! et #E Tenctères#!. Les captifs vont en chaînes vers [ROOT.GetCountry.GetCapital.GetName]. Ceux qui ont résisté ont vu leur tête tomber.\n\nLe sauvage [ROOT.GetCountry.GetRuler.GetName] n'entend nul dissentiment devant sa loi."
 flavor_germanics.20.a:0 "Gloire et louange à [GetDeityDefinition('omen_mannus').GetName] !"
 flavor_germanics.20.tooltip:0 "La tâche '#Y Chasser Usipètes et Tenctères#!' est désormais #G achevée#!."

 flavor_germanics.21.t:0 "Vers la Teuriochaemia"
 flavor_germanics.21.desc:0 "Depuis quelques années, nos frères se poussent vers [GetProvince('(int32)3951').GetArea.GetName], là où les forêts sont vastes et le gibier riche.\n\nLe bruit court parmi les clans : le sud donne chasse facile. Beaucoup s'y mettent, en quête d'un meilleur sort."
 flavor_germanics.21.a:0 "Que cette terre soit bénie pour [ROOT.GetCountry.GetName]."
 flavor_germanics.21.tooltip:0 "La tâche '#Y Vers la Teuriochaemia#!' est désormais #G achevée#!."

 flavor_germanics.22.t:0 "Alliés gaulois"
 flavor_germanics.22.desc:0 "Le renom de [ROOT.GetCountry.GetRuler.GetName] a franchi les bois. Un #E envoyé gaulois#! vient un matin à [ROOT.GetCountry.GetCapital.GetName], en grand hâte.\n\nNos espions rapportent : les Gaulois se déchirent entre eux. Ils offrent au grand [ROOT.GetCountry.GetRuler.GetFirstName] la terre de leurs ennemis, pourvu qu'il les pille."
 flavor_germanics.22.a:0 "Ces Gaulois regretteront de nous avoir invités."
 flavor_germanics.22.tooltip:0 "La tâche '#Y Alliés gaulois#!' est désormais #G achevée#!."

 flavor_germanics.23.t:0 "Les Sept Alliés"
 flavor_germanics.23.desc:0 "Jamais nos armées n'ont si bien porté le fer. Sous la conduite du [ROOT.GetCountry.GetRulerTitle], nos guerriers ont vaincu qui osait se dresser.\n\nNos levées grossissent de mercenaires venus pour gloire et butin. Reste à les instruire."
 flavor_germanics.23.a:0 "L'infanterie légère est le cœur de notre armée."
 flavor_germanics.23.b:0 "Nos archers doivent être prêts à tout."
 flavor_germanics.23.c:0 "Que nos guerriers s'entraînent dans les forêts du pays."
 flavor_germanics.23.tooltip:0 "La tâche '#Y Les Sept Alliés#!' est désormais #G achevée#!."

 flavor_germanics.24.t:0 "Au-delà du Rhin"
 flavor_germanics.24.desc:0 "Le pays au-delà du #E Rhin#! est fertile et doux. Collines, blés et pâtures abondent.\n\nLe [ROOT.GetCountry.GetRulerTitle] a déjà livré la décision : nos levées franchiront le fleuve."
 flavor_germanics.24.a:0 "Les fils de mes fils laboureront ces terres."
 flavor_germanics.24.tooltip:0 "La tâche '#Y Au-delà du Rhin#!' est désormais #G achevée#!."

 flavor_germanics.25.t:0 "Dompter le loup romain"
 flavor_germanics.25.desc:0 "Nos guerriers invincibles ont humilié les #E légions romaines#!. Elles ont fui vers leur péninsule maudite, la queue basse.\n\nLes Romains ont cru nous avoir pour faibles. Ils n'ont point vu nos embuscades.\n\nLeurs camps se sont remplis de panique. Même leurs consuls ont essuyé la honte devant le Sénat."
 flavor_germanics.25.a:0 "Un jour, je réduirai [GetProvince('(int32)1').GetName] en cendres !"
 flavor_germanics.25.tooltip:0 "La tâche '#Y Dompter le loup romain#!' est désormais #G achevée#!."

 flavor_germanics.26.t:0 "Intégrer les alliés"
 flavor_germanics.26.desc:0 "Bien que [ROOT.GetCountry.GetRuler.GetName] ait tenu compte des suggestions formulées par ceux que nous avons conquis, le farouche [ROOT.GetCountry.GetRulerTitle] a rejeté leurs propositions de coexistence et a décidé que tous ceux qui vivent sous notre hégémonie devaient être directement intégrés."
 flavor_germanics.26.a:0 "Un peuple uni est la seule voie à suivre pour [ROOT.GetCountry.GetName]!"
 flavor_germanics.26.tooltip:0 "La mission « #Y Intégrer les alliés#! » est désormais #G terminée#!"

 flavor_germanics.27.t:0 "Assimiler les alliés"
 flavor_germanics.27.desc:0 "Au lieu d'écraser les vassaux, [ROOT.GetCountry.GetRuler.GetName] veut les assimiler.\n\n« Qui résistera à nos mœurs ? » dit le [ROOT.GetCountry.GetRulerTitle]. « Dans une génération, nul ne saura plus qui est de chez nous. »"
 flavor_germanics.27.a:0 "J'espère avoir choisi sagement."
 flavor_germanics.27.tooltip:0 "La tâche '#Y Assimiler les alliés#!' est désormais #G achevée#!."

 flavor_germanics.28.t:0 "L'héritier royal"
 flavor_germanics.28.desc:0 "Jamais [ROOT.GetCountry.GetCapital.GetName] n'a vu telle fête. [ROOT.GetCountry.GetRuler.GetName] a célébré la naissance de son fils, [SCOPE.sChar('but_thats_my_baby_scope').GetName].\n\nLe vin coule comme le #E Rhin#!. Le peuple danse, la mère est honorée, et le [ROOT.GetCountry.GetRulerTitle] boit à sa santé comme un homme ivre.\n\nLe petit est levé vers le ciel, et le fier sire sourit, comme si le monde n'était plus qu'à sa dévotion."
 flavor_germanics.28.a:0 "Que ma lignée règne sur [ROOT.GetCountry.GetName] mille années !"
 flavor_germanics.28.b:0 "N'est-elle point la plus belle dame du monde ?"
 flavor_germanics.28.tooltip:0 "La tâche '#Y L'héritier royal#!' est désormais #G achevée#!."

 flavor_germanics.29.t:0 "Le bassin bohémien"
 flavor_germanics.29.desc:0 "Au sud, les terres n'appartiennent à nul clan. Seules des ermites y vivent, oublieux du monde.\n\nNos frères ont franchi les forêts obscures. Là, ils ont trouvé le #E bassin bohémien#!, grand, vierge et plein de promesses.\n\nQuand [ROOT.GetCountry.GetRuler.GetName] l'a connu, il a décrété : nos armées partiront vers le sud."
 flavor_germanics.29.a:0 "Que trouverons-nous encore dans ce bassin ?"
 flavor_germanics.29.tooltip:0 "La tâche '#Y Le bassin bohémien#!' est désormais #G achevée#!."

 flavor_germanics.30.t:0 "Le commerce du Moenus"
 flavor_germanics.30.desc:0 "Conquérir de nouvelles terres porte richesse et danger. Pourtant, depuis le franchissement du #E Moenus#!, nos clans n'ont connu que l'abondance.\n\nLe commerce s'éveille, nos trésors s'emplissent, et les taxes des marchands gonflent les coffres."
 flavor_germanics.30.a:0 "Que l'or soit mis au bon usage."
 flavor_germanics.30.tooltip:0 "La tâche '#Y Le commerce du Moenus#!' est désormais #G achevée#!."


 flavor_germanics.31.t:0 "Envahir la Bohème"
 flavor_germanics.31.desc:0 "Heureusement pour nos guerriers, nulle résistance ne s'est dressée, tandis que nos levées se sont ruées en masse dans la #E Bohème#! ; quiconque s'est montré assez insensé pour croiser l'épée avec nous pourrit déjà sur le champ de bataille, et un flot constant d'esclaves remonte vers [ROOT.GetCountry.GetCapital.GetName].\n\nEncouragés par de si beaux succès, [ROOT.GetCountry.GetRuler.GetName] a ordonné à ses soldats de poursuivre le pillage et la razzia."
 flavor_germanics.31.a:0 "Les dieux de la guerre sont avec nous ! Il faut pousser l'attaque !"
 flavor_germanics.31.tooltip:0 "La tâche '#Y Envahir la Bohème#!' est désormais #G achevée#!."

 flavor_germanics.32.t:0 "Le palais de Maroboduus"
 flavor_germanics.32.desc:0 "Si [ROOT.GetCountry.GetRuler.GetName] est surtout connu pour son art de mener les guerriers au combat, le [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] aspire aussi à être reconnu comme bâtisseur. Souvent, il confie à ses conseillers cette pensée : 'Tout homme peut tuer un autre, mais si je veux laisser une mémoire durable, alors les enfants de mes petits-enfants devront regarder les œuvres que j'ai laissées derrière moi. Ces mains noueuses, faites pour saisir la lance et l'épée, devront aussi élever pierre sur pierre...'\n\nGuidé par de telles visions, la construction d'un palais magnifique commença bientôt aux champs, et une fois achevé, les tribus de [ROOT.GetCountry.GetName] vinrent de tout le pays, à travers un pays rude, pour le contempler de leurs yeux. Impressionnés par sa grandeur, beaucoup décidèrent d'y demeurer, et c'est ainsi que [ROOT.GetCountry.GetRuler.GetFirstName] fut connu comme un grand architecte."
 flavor_germanics.32.a:0 "Puisse ce grand édifice demeurer des siècles !"
 flavor_germanics.32.tooltip:0 "La tâche '#Y Le palais de Maroboduus#!' est désormais #G achevée#!."

 flavor_germanics.33.t:0 "Le refuge des traîtres"
 flavor_germanics.33.desc:0 "Au cours des dernières années, les terres de [GetCountry('GTH').GetName] sont devenues un lieu où les rebelles et mécontents [ROOT.GetCountry.GetAdjective] pouvaient trouver refuge contre la longue main de [ROOT.GetCountry.GetRuler.GetName] et sa justice inflexible ; mais le vindicatif [ROOT.GetCountry.GetRulerTitle] a enfin mis un terme à cette violation flagrante de nos lois, en soumettant les Guthoniens de plein droit.\n\nÀ présent, ceux qui attirent la colère de notre peuple ne peuvent espérer que le salut dans la mort, car [ROOT.GetCountry.GetRuler.GetFirstName] a fait clairement entendre qu'il n'est point de refuge pour les traîtres sous son regard."
 flavor_germanics.33.a:0 "Croyez-vous vraiment que je vous laisserais ainsi vous en tirer ?"
 flavor_germanics.33.b:0 "Ma parole fait loi au sein de [ROOT.GetCountry.GetName]..."
 flavor_germanics.33.tooltip:0 "La tâche '#Y Le refuge des traîtres#!' est désormais #G achevée#!."

 flavor_germanics.34.t:0 "Passer le Marus"
 flavor_germanics.34.desc:0 "Les dieux ont vraiment béni nos efforts pour fixer nos gens dans les terres du #E bassin boïohémien#!, car nous n'avons connu que la réussite au-delà des eaux du #E fleuve Marus#!. Déjà, nos frères domptent les landes sauvages, plantent les moissons et laissent paître leurs troupeaux sur les collines ondoyantes sous le regard vigilant de leurs bergers.\n\nNos tribus se montrent fort satisfaites de [ROOT.GetCountry.GetRuler.GetName], qui a fait plus que quiconque pour rendre cela possible, et le nom du [ROOT.GetCountry.GetRulerTitle] est loué par le peuple."
 flavor_germanics.34.a:0 "Cette terre sera nôtre à jamais... je m'en assurerai."
 flavor_germanics.34.tooltip:0 "La tâche '#Y Passer le Marus#!' est désormais #G achevée#!."

 flavor_germanics.35.t:0 "Défendre le bassin"
 flavor_germanics.35.desc:0 "Depuis peu, [ROOT.GetCountry.GetRuler.GetName] a consacré beaucoup de temps à former personnellement les levées destinées à garder les défilés qui mènent au #E bassin bohémien#!, et après des semaines d'entraînement rude dans les forêts, le [ROOT.GetCountry.GetRulerTitle] est enfin satisfait des efforts de nos frères [ROOT.GetCountry.GetAdjective] et est retourné à [ROOT.GetCountry.GetCapital.GetName].\n\nCes vaillants guerriers, qui devront constituer la première ligne de défense pour protéger nos nouvelles terres, sont prêts à la tâche qui leur est confiée et patrouillent les fortifications élevées par notre peuple avec une sombre résolution."
 flavor_germanics.35.a:0 "Que vos flèches aillent droit et que vos épées frappent juste !"
 flavor_germanics.35.tooltip:0 "La tâche '#Y Défendre le bassin#!' est désormais #G achevée#!."

 flavor_germanics.36.t:0 "Répandre la parole de Tuisto"
 flavor_germanics.36.desc:0 "Quand on demande qui a le plus contribué à la victoire de notre peuple, [ROOT.GetCountry.GetRuler.GetName] est le premier à louer [GetDeityDefinition('omen_tuisto').GetName], car le pieux [ROOT.GetCountry.GetRulerTitle] n'a jamais cessé d'accorder aux dieux la primauté sur les affaires des hommes.\n\nPeu satisfait de n'offrir qu'un semblant de culte à notre grand dieu, [ROOT.GetCountry.GetRuler.GetFirstName] a fait élever un sanctuaire à sa divinité tutélaire, afin d'étendre notre foi dans les terres que nous avons peuplées."
 flavor_germanics.36.a:0 "Je ne suis point surpris que Tuisto ait trouvé de nouveaux adeptes."
 flavor_germanics.36.tooltip:0 "La tâche '#Y Répandre la parole de Tuisto#!' est désormais #G achevée#!."

 flavor_germanics.37.t:0 "Les guerres marcomanniques"
 flavor_germanics.37.desc:0 "Depuis les humbles commencements, les efforts de [ROOT.GetCountry.GetRuler.GetName] ont porté les tribus de [ROOT.GetCountry.GetName] au faîte du pouvoir ; la parole et la volonté du grand [ROOT.GetCountry.GetRulerTitle] sont imposées par les levées d'une force dévastatrice que commandées par [ROOT.GetCountry.GetRuler.GetName]. Jamais, dans notre histoire, une si grande armée n'a été conduite par nos chefs ; c'est un signe que notre gloire grandit et que nul ne peut nous barrer la route.\n\nLe seul nom de notre peuple fait frémir nos ennemis, et chaque jour nos adversaires prient afin que la colère des [ROOT.GetCountry.GetAdjective] ne les écrase point."
 flavor_germanics.37.a:0 "Avec de telles forces à ma disposition, je pourrais conquérir le monde !"
 flavor_germanics.37.tooltip:0 "La tâche '#Y Les guerres marcomanniques#!' est désormais #G achevée#!."

 flavor_germanics.38.t:0 "Esclaves cotiniens"
 flavor_germanics.38.desc:0 "Les #E [GetCountry('OTN').GetName]s#! vivaient autrefois dans leurs défilés montagneux, évitant autant que possible le contact avec les étrangers et espérant passer leurs jours seuls ; rêve brisé par le tout-puissant [ROOT.GetCountry.GetRuler.GetName], qui a lancé ses armées dans les anfractuosités rocheuses et les collines pour asservir et piller.\n\nMaintenant que les faibles Cotiniens ont été écrasés, le [ROOT.GetCountry.GetRulerTitle] se demande ce que leur avenir leur réserve."
 flavor_germanics.38.a:0 "Mettez les gens du lieu au travail dans leur propre patrie."
 flavor_germanics.38.b:0 "Enchaînez les Cotini et envoyez-les aux champs et aux mines."
 flavor_germanics.38.tooltip:0 "La tâche '#Y Esclaves cotiniens#!' est désormais #G achevée#!."

 flavor_germanics.39.t:0 "Une nouvelle demeure germanique"
 flavor_germanics.39.desc:0 "Beaucoup a changé pour notre peuple au cours des dernières années ; nous sommes sortis de l'obscurité et sommes devenus une puissance avec laquelle il faut compter.Notre migration vers le sud, dans le #E bassin boïohémien#!, a été un succès éclatant, rapportant des biens et des récompenses que même le grand [ROOT.GetCountry.GetRuler.GetName] n'avait pu prévoir. Jadis, notre avenir semblait incertain ; maintenant, le futur est à nous de le façonner..."
 flavor_germanics.39.a:0 "Puisse cette nouvelle demeure être un refuge pour nos tribus au cours des jours à venir."
 flavor_germanics.39.tooltip:0 "La tâche '#Y Une nouvelle demeure germanique#!' est désormais #G achevée#!."

 flavor_germanics.40.t:0 "Le bois sacré alhiz"
 flavor_germanics.40.desc:0 "Bien que la terre sainte de [GetProvince('(int32)4005').GetName] soit lointaine de [ROOT.GetCountry.GetCapital.GetName], [ROOT.GetCountry.GetRuler.GetName] n'a pas perdu de temps à s'assurer cette importante possession pour les tribus de [ROOT.GetCountry.GetName]. Peu satisfait de n'être qu'un gardien du sacré, notre [ROOT.GetCountry.GetRulerTitle] a dépensé une somme immense pour faire ériger un #E lieu saint#! à Stragona près d'un bois que les habitants disent béni par [GetDeityDefinition('omen_alcis').GetName], une divinité que [ROOT.GetCountry.GetRuler.GetSheHe] croit veiller sur [ROOT.GetCountry.GetRuler.GetHerHim] en personne.\n\nLe sanctuaire construit et la réputation de [ROOT.GetCountry.GetRuler.GetFirstName] grandissante, le fier guerrier a annoncé que nos armées allaient bientôt conquérir de nouvelles terres."
 flavor_germanics.40.a:0 "La province élysienne nous appartient, et nous la réclamerons ! [GetDeityDefinition('omen_alcis').GetName] le veut."
 flavor_germanics.40.tooltip:0 "La tâche '#Y Le bois sacré alhiz#!' est désormais #G achevée#!."

 flavor_germanics.41.t:0 "Urne faciale"
 flavor_germanics.41.desc:0 "L'un des plus grands honneurs qu'un [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] puisse recevoir est d'être inhumé dans une #E urne faciale vandale#! ; avec ses restes mortels ensevelis en un état si somptueusement orné, le nom et la réputation du défunt sont presque assurés de vivre éternellement.\n\nEt même si [ROOT.GetCountry.GetRuler.GetFirstName] n'est pas encore passé de ce monde dans l'au-delà, une urne faciale a déjà été préparée pour [ROOT.GetCountry.GetRuler.GetHerHim], en signe de respect et d'admiration pour ce guerrier illustre. Nos #E anciens de tribu#! veulent s'assurer que nous n'oublions jamais toutes les grandes choses que le puissant [ROOT.GetCountry.GetRuler.GetFirstName] a accomplies pour nous."
 flavor_germanics.41.a:0 "Puissent mes exploits être dignes de ce don que j'ai reçu !"
 flavor_germanics.41.tooltip:0 "La tâche '#Y Urne faciale#!' est désormais #G achevée#!."

 flavor_germanics.42.t:0 "La route de l'ambre"
 flavor_germanics.42.desc:0 "Bien que nous soyons fort contents de vaquer à nos affaires et de limiter nos rapports avec les tribus voisines, [ROOT.GetCountry.GetRuler.GetName] nous a encouragés à élargir nos liens avec le monde plus vaste, surtout si cela signifie vendre de l'ambre @amber!, une marchandise de luxe que nous avons en abondance et que recherchent ardemment les marchands étrangers.\n\nAu fil des années, les réseaux commerciaux se sont fortifiés, et nos liens avec nos voisins #E celtes#! sont bien plus grands qu'auparavant. Dieu merci, la chose semble profiter à tous."
 flavor_germanics.42.a:0 "Je promets de mettre le profit à bon usage."
 flavor_germanics.42.tooltip:0 "La tâche '#Y La route de l'ambre#!' est désormais #G achevée#!."

 flavor_germanics.43.t:0 "L'ambre à nous"
 flavor_germanics.43.desc:0 "Depuis quelque temps, une frénésie pour l'ambre @amber! semble avoir saisi notre peuple, car chacun souhaite avoir pour soi une pièce de 'glesum'. Nos artisans façonnent la précieuse résine en formes d'animaux, comme l'ours ou le cerf, et un sanctuaire [ROOT.GetCountry.GetAdjective] n'est point considéré comme sacré s'il n'abrite quelque part une parcelle d'ambre consacré. Il y a parmi nous des tribus qui se sont enrichies en commerçant l'ambre avec les étrangers, et dès que [ROOT.GetCountry.GetRuler.GetName] sut combien d'or circulait ainsi, le [ROOT.GetCountry.GetRulerTitle] décida de faire de la production d'ambre une priorité pour [ROOT.GetCountry.GetName]."
 flavor_germanics.43.a:0 "Il nous faut ramasser le plus d'ambre possible !"
 flavor_germanics.43.tooltip:0 "La tâche '#Y L'ambre à nous#!' est désormais #G achevée#!."
 barbaricum_vandalia_lugia_mission_task_4_tt:0 "Un établissement aléatoire verra son #T bien de production#! changé en #T Ambre#! @amber!, et un établissement aléatoire produisant de l'#T Ambre#! recevra un #G bonus spécial#!."

 flavor_germanics.44.t:0 "Contacts avec les Celtes"
 flavor_germanics.44.desc:0 "[ROOT.GetCountry.GetRuler.GetName] entretient depuis longtemps des liens commerciaux avec les #E Celtes#! qui vivent près de nous, et au fil du temps, les relations entre nos tribus et bien d'autres se sont fort adoucies. Notre peuple s'entend plutôt bien, et il faut le dire : nous aimons beaucoup les mêmes choses, comme les gloires de la chasse, et beaucoup de nos gens se sont mariés à des cousins celtes.\n\nAu lieu d'empêcher de tels liens, [ROOT.GetCountry.GetRuler.GetFirstName] leur a donné sa bénédiction, car [ROOT.GetCountry.GetRuler.GetSheHe] aussi a des amis chez les Celtes et fréquente souvent leurs sages et leurs #E anciens de tribu#! pour y puiser quelque sagesse."
 flavor_germanics.44.a:0 "Par les dieux, je crois que cela vaut vraiment la peine..."
 flavor_germanics.44.tooltip:0 "La tâche '#Y Contacts avec les Celtes#!' est désormais #G achevée#!."

 flavor_germanics.45.t:0 "Un rituel celtique"
 flavor_germanics.45.desc:0 "Bien que beaucoup des #E anciens de tribu#! aient regardé les actes de [ROOT.GetCountry.GetRuler.GetName] avec méfiance ouverte, nul ne put empêcher le [ROOT.GetCountry.GetRulerTitle] de tenir un rituel religieux #E celtique#! au cœur de [ROOT.GetCountry.GetCapital.GetName]. Certains soutenaient que les rites coûtaient trop cher, d'autres répétaient, comme de vieux dictons, qu'ils étaient blasphématoires et capables d'attirer la colère de nos dieux ancestraux ; et pourtant aucun de nos dieux ne se montra pour se plaindre.\n\nAu contraire, les présages furent plus favorables que jamais ; nos ruches débordaient de miel, les poissons sautaient presque des rivières dans nos filets, et des troupeaux de cerfs gras et lents traversèrent nos forêts."
 flavor_germanics.45.a:0 "Il y a une puissance dans le panthéon celtique !"
 flavor_germanics.45.tooltip:0 "La tâche '#Y Un rituel celtique#!' est désormais #G achevée#!."

 flavor_germanics.46.t:0 "La confédération lugienne"
 flavor_germanics.46.desc:0 "Le dieu celtique [GetDeityDefinition('omen_lugus').GetName] a béni notre peuple de victoires innombrables, nous élevant au-dessus de tous les autres, bien que son nom fût inconnu à nos aïeux ; et l'on ne s'étonne pas que [ROOT.GetCountry.GetRuler.GetName] ait décidé de former une confédération qui honore ce grand dieu.\n\n'À compter de ce jour, nous serons connus sous le nom de #E Lugia#! ; un foyer pour les guerriers #E germaniques#! comme #E celtes#!. Comme deux grands fleuves qui ont joint leurs eaux, ainsi la force de nos peuples forgera une nouvelle culture. Célébrons ce moment sacré par des sacrifices et des louanges à Lugus, qui a rendu tout ceci possible.'"
 flavor_germanics.46.a:0 "Gloire à #E Lugia#!, et gloire à [ROOT.GetCountry.GetRuler.GetFirstName] !"
 flavor_germanics.46.tooltip:0 "La tâche '#Y La confédération lugienne#!' est désormais #G achevée#!."
 lugus_added_to_lugia_pantheon_tt:0 "La divinité #T Lugus#! sera ajoutée à notre #T panthéon#!."

 flavor_germanics.47.t:0 "Notre minorité suève"
 flavor_germanics.47.desc:0 "Il y a beaucoup de gens dans [ROOT.GetCountry.GetName] qui voient d'un œil soupçonneux les #E Irminones#! qui vivent parmi nous, mais [ROOT.GetCountry.GetRuler.GetName] a dit à nos frères qu'ils devaient accepter cette minorité au milieu d'eux... ou bien.\n\n'Donnez aux Irminones le temps de se faire connaître de vous, et vous verrez qu'ils sont dignes des éloges que je leur ai décernés. Nos levées se grossissent de combattants hardis, nos revenus marchands croissent, et nos ennemis nous craignent... il n'y a ici nul inconvénient.'\n\nQue ces paroles se vérifient ou non, reste à voir ; mais, pour l'heure, chacun se fie au [ROOT.GetCountry.GetRulerTitle]."
 flavor_germanics.47.a:0 "Tout ce que je fais, je le fais pour [ROOT.GetCountry.GetName]."
 flavor_germanics.47.tooltip:0 "La tâche '#Y Notre minorité suève#!' est désormais #G achevée#!."

 flavor_germanics.48.t:0 "Inviter davantage de migrants tribaux"
 flavor_germanics.48.desc:0 "À mesure que la nouvelle se répand que les tribus de [ROOT.GetCountry.GetName] encouragent les migrants à s'établir dans leurs frontières, [ROOT.GetCountry.GetRuler.GetName] a été approché par un riche marchand #E irminon#!, homme de noble lignage nommé [SCOPE.sCharacter('irminonic_nobleman_scope').GetName], riche et ambitieux, qui souhaite vivre à [ROOT.GetCountry.GetCapital.GetName].\n\nQuand on lui demande pourquoi il veut vivre au milieu des [ROOT.GetCountry.GetAdjective]s, [SCOPE.sCharacter('irminonic_nobleman_scope').GetFirstName] affirme qu'il existe de bonnes occasions de commerce dans notre patrie et qu'il souhaite aider à développer le commerce de l'ambre @amber!.\n\nLe noble irminon est prêt à payer pour le privilège de séjourner ici, mais demande que ses droits soient consignés dans la loi ; ce qui se révélera un mauvais signe si [ROOT.GetCountry.GetRuler.GetFirstName] décide de le faire."
 flavor_germanics.48.a:0 "Nous accueillerons quiconque souhaite vivre à nos côtés."
 flavor_germanics.48.b:0 "Faites ce que demande [SCOPE.sCharacter('irminonic_nobleman_scope').GetFirstName], que le sort nous juge."
 flavor_germanics.48.tooltip:0 "La tâche '#Y Inviter davantage de migrants tribaux#!' est désormais #G achevée#!."

 flavor_germanics.49.t:0 "À la lance et à l'épée"
 flavor_germanics.49.desc:0 "Partout dans [ROOT.GetCountry.GetName] et au-delà, [ROOT.GetCountry.GetRuler.GetName] acquiert une renommée de vaillant guerrier sans pareil de son temps, et beaucoup croient même que [ROOT.GetCountry.GetRuler.GetFirstName] est peut-être le plus grand combattant qu'ait jamais foulé la terre.\n\nChaque ennemi qui a attiré la colère du [ROOT.GetCountry.GetRulerTitle] a été envoyé vers les dieux du monde souterrain auxquels il croyait, et l'une des plus grandes gloires de [ROOT.GetCountry.GetRuler.GetFirstName] est la soumission de toutes les autres tribus #E vandales#!.\n\nL'odeur de villages et de corps en flammes est devenue comme de l'encens offert aux dieux de la guerre, et le monde tremble de peur, se demandant où frapperont bientôt les armées du redoutable chef."
 flavor_germanics.49.a:0 "Tout ce que je désire pour moi, je le prendrai !"
 flavor_germanics.49.tooltip:0 "La tâche '#Y À la lance et à l'épée#!' est désormais #G achevée#!."

 flavor_germanics.50.t:0 "L'unification des Vandales"
 flavor_germanics.50.desc:0 "'Désormais, nous adoptons un nouveau nom ; plus nous ne serons connus sous le nom de #E Harian#!, mais sous celui de #E Vandal#!. Nous avons uni tous nos frères sous une seule bannière, et depuis humble origine, nous sommes devenus la puissance dominante en #E Germanie#!. Que les dieux nous bénissent tandis que nous poursuivons nos ennemis !'\n\nÀ ces paroles, des cris de joie éclatent dans le camp militaire où [ROOT.GetCountry.GetRuler.GetName] s'adresse à ses troupes. Sans trêve ni repos, [ROOT.GetCountry.GetRuler.GetFirstName] n'avait presque pas le temps de se remettre de la dernière bataille qu'il décida d'annoncer la nouvelle réjouissante aux vaillants guerriers qui avaient rendu ce jour possible."
 flavor_germanics.50.a:0 "Il n'est point temps de se reposer, car bien du labeur reste à faire."
 flavor_germanics.50.tooltip:0 "La tâche '#Y L'unification des Vandales#!' est désormais #G achevée#!."

 flavor_germanics.51.t:0 "Colonisation de l'Est"
 flavor_germanics.51.desc:0 "Il y a longtemps, de vastes territoires à l'est étaient presque déserts ; mais nos frères hardis ont lentement migré vers les forêts et les plaines, bâtissant des établissements. La colonisation de l'est semble aller à merveille ; notre peuple se porte bien, les revenus fiscaux sont plus élevés que jamais, et nos tribus disposent de place pour croître sans se gêner entre elles."
 flavor_germanics.51.a:0 "Cela me satisfait grandement... j'ai choisi sagement."
 flavor_germanics.51.tooltip:0 "La tâche '#Y Colonisation de l'Est#!' est désormais #G achevée#!."

 flavor_germanics.52.t:0 "Les plaines pannoniques"
 flavor_germanics.52.desc:0 "Les vastes territoires des #E plaines pannoniques#! s'étendent devant nous, sans personne pour nous barrer la route afin de les revendiquer entièrement. Si certains habitants de [ROOT.GetCountry.GetCapital.GetName] questionnent la profondeur des ambitions de [ROOT.GetCountry.GetRuler.GetName], peu sont ceux qui oseraient parler contre le [ROOT.GetCountry.GetRulerTitle] ; tout ce qui est arrivé à [ROOT.GetCountry.GetName] n'est dû qu'aux actes de [ROOT.GetCountry.GetRuler.GetSheHe]."
 flavor_germanics.52.a:0 "Les plaines de Pannonie ne sont qu'un tremplin vers de plus grands honneurs..."
 flavor_germanics.52.tooltip:0 "La tâche '#Y Les plaines pannoniques#!' est désormais #G achevée#!."

 flavor_germanics.53.t:0 "Ateliers celtiques"
 flavor_germanics.53.desc:0 "Bien que notre peuple soit surtout connu comme guerrier et conquérant, [ROOT.GetCountry.GetRuler.GetName] a veillé à ce que nous n'ayons point négligé notre infrastructure ; au contraire. D'énormes sommes ont été mis de côté pour faire bâtir des mines dans nos provinces, et les forgerons de [ROOT.GetCountry.GetName] ont grand besoin de fer @iron!, un métal précieux dont nous ne semblons jamais avoir assez.\n\nS'il reste encore de la place pour développer notre capacité de production, les efforts de [ROOT.GetCountry.GetRuler.GetFirstName] portent déjà leurs fruits, ce qui ajoute une autre plume au chapeau du fameux [ROOT.GetCountry.GetRulerTitle]."
 flavor_germanics.53.a:0 "Notre économie a besoin d'une base solide, si nous voulons nous élever au-dessus de tous."
 flavor_germanics.53.tooltip:0 "La tâche '#Y Ateliers celtiques#!' est désormais #G achevée#!."

 flavor_germanics.54.t:0 "Glesum"
 flavor_germanics.54.desc:0 "Bien que [ROOT.GetCountry.GetRuler.GetName] ait manifesté une perplexité curieuse devant la popularité de l'ambre @amber! chez les marchands voyageurs, le [ROOT.GetCountry.GetRulerTitle] ne 'regarde pas un cheval donné dans la bouche', comme l'on dit.\n\nLes étrangers sont prêts à payer de beaux deniers pour cette matière rare ; pourquoi donc les tribus de [ROOT.GetCountry.GetName] laisseraient-elles leur argent dormir sur la table ? Au contraire, le peuple [ROOT.GetCountry.GetAdjective] doit faire tout son possible pour ramasser autant d'ambre qu'il soit humainement possible."
 flavor_germanics.54.a:0 "Tu veux davantage de glesum, dis-tu ? J'en ai justement pour vendre."
 flavor_germanics.54.tooltip:0 "La tâche '#Y Glesum#!' est désormais #G achevée#!."

 flavor_germanics.55.t:0 "Réclamer la côte"
 flavor_germanics.55.desc:0 "Bien que notre terre soit bien arrosée par les rivières voisines, nous n'avons point encore un libre accès aux côtes, et [ROOT.GetCountry.GetRuler.GetName] est prêt à y remédier, même si cela devait nous entraîner dans une guerre avec nos voisins."
 flavor_germanics.55.a:0 "Par la présente, je réclame les côtes pour [ROOT.GetCountry.GetName] !"
 flavor_germanics.55.tooltip:0 "La tâche '#Y Réclamer la côte#!' est désormais #G achevée#!."

 flavor_germanics.56.t:0 "Nœud suébe"
 flavor_germanics.56.desc:0 "L'un des moyens les plus simples d'identifier un #E Suébe#! est la coiffure ; leurs guerriers ramassent leurs mèches sur les côtés de la tête et les nouent en paquet, le fameux #E 'nœud suébe'#!.\n\nBien que notre peuple n'ait pas coutume de porter ce nœud, les liaisons amicales avec les Suebi voisins ont accru les contacts entre nos tribus, et de plus en plus de nos frères adoptent cette étrange mode.\n\nSi [ROOT.GetCountry.GetRuler.GetName] préfère une autre coupe pour [ROOT.GetCountry.GetRuler.GetHerHim] même, avec les cheveux courts devant et longs et sauvages derrière, même le [ROOT.GetCountry.GetRulerTitle] convient que le nœud suébe est impressionnant."
 flavor_germanics.56.a:0 "Je suis content de voir nos guerriers adopter ce style."
 flavor_germanics.56.tooltip:0 "La tâche '#Y Nœud suébe#!' est désormais #G achevée#!."

 flavor_germanics.57.t:0 "Ports baltiques"
 flavor_germanics.57.desc:0 "Maintenant que nous maîtrisons les terres qui bordent les eaux de l'#E Oceanus Sarmaticus#!, notre besoin d'une marine puissante, capable de protéger nos intérêts économiques et militaires, est devenu une nécessité pressante ; un appel clair à l'action que [ROOT.GetCountry.GetRuler.GetName] a entendu de toute sa force.\n\nAvec un stock régulier de bois @wood! amassé à [ROOT.GetCountry.GetCapital.GetName] et une petite armée de manœuvres œuvrant dans nos ports nouvellement construits, nos compatriotes se sont jetés avec ardeur dans la construction d'une armada."
 flavor_germanics.57.a:0 "Nous ne nous reposerons point tant que nous n'aurons une flotte digne de ce nom."
 flavor_germanics.57.tooltip:0 "La tâche '#Y Ports baltiques#!' est désormais #G achevée#!."

 flavor_germanics.58.t:0 "Un artéfact précieux"
 flavor_germanics.58.desc:0 "Bien que la somme d'or requise pour acheter le #E chaudron du nœud suébe#! n'ait rien eu de négligeable, dès que [ROOT.GetCountry.GetRuler.GetName] l'eut vu et admiré de ses propres yeux la finesse de son travail, [ROOT.GetCountry.GetRuler.GetSheHe] sut que [ROOT.GetCountry.GetRuler.GetSheHe] serait prêt à payer n'importe quel prix, car jamais encore le [ROOT.GetCountry.GetRulerTitle] n'avait contemplé une œuvre aussi magnifique.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] savait que ses compatriotes [ROOT.GetCountry.GetAdjective] ressentiraient pareillement, et fit les préparatifs nécessaires pour acheter le chaudron. Le pressentiment du [ROOT.GetCountry.GetRulerTitle] se révéla juste, car les tribus furent impressionnées par sa splendeur."
 flavor_germanics.58.a:0 "Les gens voyageront loin et loin pour voir ce miracle !"
 flavor_germanics.58.tooltip:0 "La tâche '#Y Un artéfact précieux#!' est désormais #G achevée#!."

 flavor_germanics.59.t:0 "Conscription du fer"
 flavor_germanics.59.desc:0 "L'une des décisions les plus controversées jamais prises par [ROOT.GetCountry.GetRuler.GetName] fut le projet de saisir tout le fer @iron! de son peuple. Malgré les plaintes et les remontrances de certains segments de la société [ROOT.GetCountry.GetAdjective], [ROOT.GetCountry.GetRuler.GetSheHe] insista que le fait d'être [ROOT.GetCountry.GetRulerTitle] n'était point un concours de popularité ; toute mesure nécessaire au succès continu de [ROOT.GetCountry.GetName] serait entreprise, même si chacun le haïssait pour cela. Oui, nos tribus exploitaient le fer, mais nous en avions besoin davantage, et il fallait le trouver quelque part.\n\nSi les répercussions de cette décision devaient faire naître de la tension pendant des années, [ROOT.GetCountry.GetRuler.GetFirstName] savait dans le fond de son cœur que les levées seraient renforcées pendant au moins une génération, et cela lui suffisait amplement."
 flavor_germanics.59.a:0 "Enterrez vos proches avec des objets en ambre et gardez le fer pour notre armée."
 flavor_germanics.59.tooltip:0 "La tâche '#Y Conscription du fer#!' est désormais #G achevée#!."

 flavor_germanics.60.t:0 "Route de l'ambre"
 flavor_germanics.60.desc:0 "Autrefois, [ROOT.GetCountry.GetRuler.GetName] demanda à son #E conseil des tribus#! ce qu'il était advenu de l'ambre @amber! vendu aux #E marchands celtes#! qui s'étaient présentés au marché de [ROOT.GetCountry.GetCapital.GetName], et [ROOT.GetCountry.GetRuler.GetSheHe] ne put croire à la réponse.\n\nIl fut rapporté que les Celtes voyageraient loin au sud, jusque dans des contrées que nul dans [ROOT.GetCountry.GetName] n'avait jamais vues ni imaginées, où ils rencontraient des marchands parlant des langues incompréhensibles. Notre précieux ambre serait alors échangé contre des épices @spices! ou des produits rares comme l'ivoire @elephants!, ou même contre des gemmes @gems!, bien que l'or et l'argent @precious_metals! fussent fort recherchés.\n\nSi cela était déjà difficile à croire, le reste dépassa l'entendement de [ROOT.GetCountry.GetRuler.GetFirstName] ; notre ambre serait chargé sur des navires et transporté au-delà des mers, et ces lourdes cargaisons seraient déchargées dans des villes portuaires à des milliers de lieues de là."
 flavor_germanics.60.a:0 "Le monde est vraiment un lieu fort mystérieux..."
 flavor_germanics.60.tooltip:0 "La tâche '#Y Route de l'ambre#!' est désormais #G achevée#!."

 flavor_germanics.61.t:0 "Culture du seigle"
 flavor_germanics.61.desc:0 "Nos frères sont chasseurs et guerriers, sans pareils pour traquer le cerf @wild_game! dans les forêts, et nos compatriotes savent où cueillir les baies @dates! et les fruits @fruits! dans les bois sauvages ; notre alimentation est riche et variée, assez pour nourrir notre peuple affamé.\n\nEt bien que [ROOT.GetCountry.GetRuler.GetName] préfère manger de la viande rôtie par-dessus tout, le [ROOT.GetCountry.GetRulerTitle] se réjouit de voir les tribus planter de plus en plus de seigle @grain! dans les terres labourées que nous avons défrichées. Le pain est l'un de nos mets de base, et nos fermiers ingénieux savent même faire fermenter le grain pour fabriquer des boissons enivrantes fort goûtées par le peuple de [ROOT.GetCountry.GetCapital.GetName]."
 flavor_germanics.61.a:0 "Du pain, de la bière et de la viande... que demander de plus ?"
 flavor_germanics.61.tooltip:0 "La tâche '#Y Culture du seigle#!' est désormais #G achevée#!."

 flavor_germanics.62.t:0 "Relations avec les Cimbres"
 flavor_germanics.62.desc:0 "Au lieu de faire la guerre à chaque tribu qui nous entoure, [ROOT.GetCountry.GetRuler.GetName] a décidé de cultiver des relations amicales avec certains de nos voisins, dans l'espoir d'ouvrir de nouvelles voies au peuple de [ROOT.GetCountry.GetName] ; expérience qui s'est jusqu'ici révélée un grand succès.\n\nNos contacts parmi les #E Scandiens#! ont conduit certains des nôtres à s'installer à [ROOT.GetCountry.GetCapital.GetName], dans l'espoir de vivre aux côtés de nos frères. Notre réputation de puissance croissante a attiré beaucoup de gens désireux d'unir leur destin au nôtre ; innovation que [ROOT.GetCountry.GetRuler.GetFirstName] a reçue avec bienveillance."
 flavor_germanics.62.a:0 "Tous ceux qui souhaitent adopter nos coutumes sont les bienvenus ici."
 flavor_germanics.62.tooltip:0 "La tâche '#Y Relations avec les Cimbres#!' est désormais #G achevée#!."

 flavor_germanics.63.t:0 "Côte baltique"
 flavor_germanics.63.desc:0 "La puissance navale des tribus [ROOT.GetCountry.GetAdjective] s'accroissant d'année en année, le ambitieux [ROOT.GetCountry.GetRuler.GetName] a fait savoir que les vaisseaux de [ROOT.GetCountry.GetName] ne reculeraient point devant le transport de nos troupes vers des rivages lointains ; partout où nous pouvons naviguer, la proie est bonne pour nos raiders. Déjà, une flotte nouvellement construite s'est rassemblée à [GetProvince('(int32)4752').GetName], en vue d'aventures outre-mer."
 flavor_germanics.63.a:0 "Nous attaquerons par terre comme par mer !"
 flavor_germanics.63.tooltip:0 "La tâche '#Y Côte baltique#!' est désormais #G achevée#!."

 flavor_germanics.64.t:0 "La terre des dieux"
 flavor_germanics.64.desc:0 "Au cours des derniers mois, notre marine a cessé d'attaquer nos voisins et s'est mise en mission de découverte, emmenant nos frères vers des terres étranges, mais non à la poursuite du combat glorieux. Quand une rare accalmie des hostilités ouvrit une brève fenêtre de possibilité à nos tribus de naviguer vers le nord, en quête de la réputée #E Terre des dieux#!, [ROOT.GetCountry.GetRuler.GetName] sut qu'il eût regretté de la laisser passer et donna ordre d'ouvrir les explorations.\n\nNotre expédition ne déçut point ; nos explorateurs hardis affirment avoir découvert une terre où le soleil traîne bas dans le ciel toute la journée, se levant à peine au-dessous de l'horizon avant de se lever à nouveau. Dans ce royaume de lumière éternelle, où de mystérieuses ruines parsemaient le paysage, la présence des dieux se faisait sentir, et nos hommes jurent qu'une aura de bonne fortune les entourait et les protégeait tandis qu'ils exploraient."
 flavor_germanics.64.a:0 "On dirait que vous avez ramené cette puissante énergie avec vous — bien fait."
 flavor_germanics.64.tooltip:0 "La tâche '#Y La terre des dieux#!' est désormais #G achevée#!."

 flavor_germanics.65.t:0 "Cercles de pierre"
 flavor_germanics.65.desc:0 "La présence d'étrangers au milieu des tribus de [ROOT.GetCountry.GetName] n'est presque plus notable, tant de voyageurs ont déjà bâti leurs huttes et leurs établissements dans nos frontières, et [ROOT.GetCountry.GetRuler.GetName] les y a encouragés. Ces nouveaux venus ont apporté leurs traditions et leurs coutumes, et il n'est point rare de voir dans la campagne des monuments qu'ils ont érigés, comme leurs #E cercles de pierre#!.\n\nSi cela eût paru inconcevable il y a deux générations, nul ne détourne aujourd'hui les yeux."
 flavor_germanics.65.a:0 "Comme le temps passe, le changement le suit à ses pas."
 flavor_germanics.65.tooltip:0 "La tâche '#Y Cercles de pierre#!' est désormais #G achevée#!."

 flavor_germanics.66.t:0 "Gothiscandia"
 flavor_germanics.66.desc:0 "Depuis les plus humbles commencements, notre peuple s'est hissé d'un coup jusqu'aux cimes vertigineuses du pouvoir ; nos levées victorieuses ont conquis des terres connues seulement de nos ancêtres, et nous avons réduit au silence les langues de ceux qui s'opposaient à nos desseins. Même maintenant, nos frontières englobent des territoires éloignés de notre patrie traditionnelle ; témoignage de la direction dynamique de [ROOT.GetCountry.GetRuler.GetName], qui nous a menés de victoire en victoire.\n\nQuand donc le [ROOT.GetCountry.GetRulerTitle] ambitieux décréta que nos tribus recevraient un nom nouveau, plus conforme à notre nouvel état dans le monde, cette déclaration fut accueillie avec une quasi-unanimité."
 flavor_germanics.66.a:0 "Gloire à #E Gothiscandia#! et au clan [ROOT.GetCountry.GetRuler.GetFamily.GetName] !"
 flavor_germanics.66.tooltip:0 "La tâche '#Y Gothiscandia#!' est désormais #G achevée#!."

 flavor_germanics.67.t:0 "Migration vers l'Est"
 flavor_germanics.67.desc:0 "Bien que les frontières de [ROOT.GetCountry.GetName] soient à présent plus vastes qu'elles ne l'ont jamais été, le rusé [ROOT.GetCountry.GetRuler.GetName] a tourné ses regards vers l'est, où les terres inoccupées appellent les colons [ROOT.GetCountry.GetAdjective].\n\nAfin de garantir l'avenir de nos tribus, le [ROOT.GetCountry.GetRulerTitle] a fait savoir que nous enverrions nos gens vers l'est."
 flavor_germanics.67.a:0 "Puissent les dieux marcher à vos côtés vers votre nouvelle patrie."
 flavor_germanics.67.tooltip:0 "La tâche '#Y Migration vers l'Est#!' est désormais #G achevée#!."

 flavor_germanics.68.t:0 "Vers les Alpes"
 flavor_germanics.68.desc:0 "S'il est des gens dans [ROOT.GetCountry.GetName] qui souhaitaient voir nos tribus aller vers l'est, les décisions finales concernant quoi que ce soit appartiennent à [ROOT.GetCountry.GetRuler.GetName], et il fut fait savoir que nous nous dirigerions plutôt vers le sud.\n\nLa chaîne montagneuse que les habitants nommaient #E 'Alpes'#! a séduit le [ROOT.GetCountry.GetRulerTitle] ; les cols qui mènent dans et hors des hautes terres rocheuses sont faciles à défendre, et il y a beaucoup de riches pays en #E Italie#! qui feraient d'excellentes cibles pour la razzia."
 flavor_germanics.68.a:0 "J'ai fait le bon choix... vers les Alpes, et au-delà !"
 flavor_germanics.68.tooltip:0 "La tâche '#Y Vers les Alpes#!' est désormais #G achevée#!."

 flavor_germanics.69.t:0 "Vers la mer Noire"
 flavor_germanics.69.desc:0 "Fort de notre succès dans l'#E Oceanus Sarmaticus#!, le puissant [ROOT.GetCountry.GetRuler.GetName] a informé nos #E anciens de tribu#! que notre peuple se dirigerait vers l'est, dans l'espoir de revendiquer des territoires sur les rivages du #E Pontus Euxinus#!. Nos frères sont devenus de bons marins, et [ROOT.GetCountry.GetRuler.GetFirstName] a vu de ses propres yeux les esclaves et le butin que nos guerriers ont ramenés du dehors. Il existe de nombreuses riches colonies #E grecques#! dans le Pontus Euxinus, et le [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetAdjective] brûle d'envie de déchaîner nos raiders sur les citadins sans méfiance."
 flavor_germanics.69.a:0 "Un jour, je contrôlerai tout le Pontus Euxinus !"
 flavor_germanics.69.tooltip:0 "La tâche '#Y Vers la mer Noire#!' est désormais #G achevée#!."

