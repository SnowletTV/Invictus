 flavor_cilicia.1.b:0 "[GetCountry('CAS').GetRuler.GetPraenomen] n'est point roi, mais les domaines de [GetCountry('CAS').GetName] seront agrandis."
 flavor_cilicia.1.bt:0 "#Y La Cilicie supérieure#! annexera tous les territoires de #E la Cilicie supérieure#! possédés par #Y [THIS.GetCountry.GetName]#! ou l'un de ses sujets.\n#Y Castabala#! demeurera un #T État temple#!"
