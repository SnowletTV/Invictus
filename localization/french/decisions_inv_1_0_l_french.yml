 form_locrian_league_italian:0 "Unifier les Locriens"
 form_locrian_league_italian_desc:0 "Les Locriens se disent descendants de Deucalion, le descendant de Prométhée, par l'intermédiaire du légendaire Locrus lui-même. On dit qu'ils furent les premiers « Hellènes ». Au cours des millénaires qui ont suivi leur arrivée en Grèce, le peuple locrien s'est dispersé, s'étendant sur toute la largeur de la mer Ionienne et jusqu'en Italie. Peut-être le moment est-il venu pour les enfants de Locrus de se réunir sous un seul État : le nôtre…"

 form_greater_armenia:0 "Une Grande Arménie"
