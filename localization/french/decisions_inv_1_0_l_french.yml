 #Change religion decisions:
 convert_to_pre_indo_european_religion:0 "Adopter la foi waaqie"
 convert_to_pre_indo_european_religion_desc:0 "De plus en plus de notre peuple demande conseil aux prêtres de Mari, la déesse de la montagne, et offre des cadeaux à Aatxe en échange de sa protection. Il est temps pour nous de reprendre officiellement leur culte."
 convert_to_puntic_religion:0 "Adopter la foi waaqie"
 convert_to_puntic_religion_desc:0 "Pendant des années, les commerçants de nos ports ont parlé de la divinité suprême connue sous le nom de Waaq, qui n'a personne d'autre pour se tenir à ses côtés, et les histoires de son amour sans fin et de son autorité divine ont trouvé un écho auprès de notre peuple, qui cherche à devenir son enfants. Peut-être pourrions-nous tous rechercher l'étreinte réconfortante de Waaq ?"
 convert_to_italic_pantheon:0 "Embrace Italic faith"
 convert_to_italic_pantheon_desc:0 "The faith of the Italic is the same as the faith of the ancient Latine, and has been spread throughout the lands. Let us embrace the Italic and pursue one of these cults as our own."
 convert_to_illyrian_pantheon:0 "Adopter la foi illyrique"
 convert_to_illyrian_pantheon_desc:0 "La foi des Illyriens provient d'anciennes croyances paléo-balkaniques. Faisant autrefois partie des mêmes croyances que le zalmoxisme et le cybélisme, la foi illyrique se distingue par ses cultes décentralisés. Le Culte du Soleil au Nord, le Culte du Serpent au Sud, et le nouveau Culte du Cavalier thrace venu de l'Est. Peut-être devrions-nous adopter les croyances illyriques et poursuivre l'un de ces cultes comme le nôtre."
 convert_to_hinduism:0 "Adopter la foi védique"
 convert_to_hinduism_desc:0 "Pour que les Védas et les anciens enseignements de l'Inde ancienne soient la politique officielle de notre État, promeuvons le védisme parmi nos sujets et à notre cour."
 convert_to_agama:0 "Adopter la foi agamique"
 convert_to_agama_desc:0 "La foi agamique des Dravidiens est ancienne et remonte à l'aube de la civilisation. Faisons la promotion de l'agamisme parmi nos sujets et à notre cour."
 convert_to_ajivika:0 "Adopter la foi ajivika"
 convert_to_ajivika_desc:0 "Le grand Makkhali Gosala a montré ses voies à sa secte ajivika. Il prêche que le destin est absolu, que tout est prédestiné. Soumettons-nous à notre sort d'embrasser Ajivika."
 convert_to_burmese_religion:0 "Adopter la foi natique"
 convert_to_burmese_religion_desc:0 "La religion des peuples du Sud-Est du monde s'est propagée jusqu'à nous. Ils disent que dans chaque être vivant se trouvent des Nats, et que les Nats sont dans chaque être vivant. Peut-être devrions-nous officiellement embrasser le culte Nat."
 convert_to_anahitic_religion:0 "Adopter la foi anahitique"
 convert_to_anahitic_religion_desc:0 "Les fidèles d'Anahit se sont répandus dans tout notre pays. Il s'est avéré une religion populaire avec sa malléabilité à nos divinités locales. Il est peut-être temps d'adopter officiellement cette religion arménienne et de l'appeler la nôtre."
 convert_to_berber_religion:0 "Adopter la foi amazighe"
 convert_to_berber_religion_desc:0 "Bien que les personnes de confession amazighe aient été autrefois inspirées et affectées par leurs voisins, elles nous ont à leur tour affectées. Notre peuple a commencé à adopter les croyances des tribus du désert, se tournant autant vers Nanna Tala et Shaheded que vers n'importe quelle divinité locale."
 convert_to_eastern_animism:1 "Adopter la foi swanco"
 convert_to_eastern_animism_desc:1 "Les déesses Swancho et Menya sont vénérées sur nos terres. Les idoles de Kem et de Kom se retrouvent partout dans leurs maisons. L'État devrait maintenant aussi accepter les dieux de Tocharie et du bassin du Tarim comme siens."
 convert_to_nilotic_pantheon:0 "Adopter la foi nhialique"
 convert_to_nilotic_pantheon_desc:0 "Le culte de Kowth Nhial et des nombreux Colwics du peuple nilotique s'est répandu sur nos terres. Il est peut-être temps d'accepter les dieux du Haut-Nil comme les dieux de notre propre peuple."
 convert_to_vaksh_religion:0 "Adopter la foi voxiste"
 convert_to_vaksh_religion_desc:0 "La religion du fleuve Vakhsh s'est répandue dans les terres que nous administrons. Les gens adorent le dieu solaire Mihr Oir le matin avec le lever du soleil et nomment leurs enfants après Ramset, le dieu du peuple. Que le Seigneur Vish nous porte à l'illumination et adopte Vakhsh et son saint panthéon de divinités."
 convert_to_nuragic_pantheon:0 "Adopter la foi nuragique"
 convert_to_nuragic_pantheon_desc:0 "La religion indigène des peuples nuragiques de Sardaigne et de Corse est une tradition millénaire. Le grand père des Nuragiques nous incite à lui rendre un culte. Embrassons le culte et les croyances de cette religion."
 convert_to_mithra_religion:0 "Adopter la foi mithraïque"
 convert_to_mithra_religion_desc:0 "Nous avons remarqué la prédominance du dieu glorieux du Soleil, Mithra, ainsi que sa foi mithriaque. Les prêtres mages annonçant les Mèdes sont certainement une entité convaincante. Notre État peut bénéficier de l'acceptation de Mithra et des pratiques du mithraïsme comme les nôtres."
 convert_to_uralic_pantheon:0 "Adopt Ilmaric Beliefs"
 convert_to_uralic_pantheon_desc:0 "The supreme god of the sky, Ilma, has been adopted by many of our people. They talk of the vibrant light of the first dawn and the deafening black of the last ray of the sun. From the Finns to the Ugrics, and to us as well now, the lights shine. It is time to open the curtains of the nation and adopt the Ilamric religion."
 convert_to_anatolian_religion:0 "Adopter la foi cybélienne"
 convert_to_anatolian_religion_desc:0 "La croyance en la Déesse-Mère a longtemps côtoyé celle de nos autres divinités, mais ces derniers temps cette dernière a connu un déclin évident. Cybèle est désormais devenue une figure centrale de nos traditions et de nos pratiques religieuses."
 convert_to_circassian_pantheon:0 "Embrace the Nartic Pantheon"
 convert_to_circassian_pantheon_desc:0 "The heroes and gods of the Nart Sagas have encapsulated the hearts of our people. Their powerful, tricky, and complex nature inspire us to adopt them as our official religion."
 convert_to_hurrian_pantheon:0 "Adopt Hurrian Beliefs"
 convert_to_hurrian_pantheon_desc:0 "The Hurrio-Hittite beliefs are those of 1000 gods! As the once mighty Bronze Age Empire declared itself the lands of the thousand gods, perhaps our own gods belong to that pantheon?"
 convert_to_hatti_religion:0 "Adopt Hattic Pantheon"
 convert_to_hatti_religion_desc:0 "Once, in the lands we now know as Anatolia, we called it the lands of the Hatti. And as fate would have it, the lands of the Hatti have once more returned to the faith of the ancient people. Shall we too accept the resurgent Hattic pantheon?"

 form_scandia:0 "Form Scandia"
 form_scandia_desc: "Lying at the northernmost periphery of the Germanic world, Scandia is a harsh, bitter place where cold, long nights meet colder, longer winters, spoken of only within the whispers, rumors, and tall-tales of distant travelers. Yet, despite the odds, we have managed to not only persist and survive, but have found ways to grow strong and thrive; by subduing the remainder of our kin, we can establish a great northern federation, and thus claim our rightful place within Germania."
 SCANDIA_NAME:0 "Scandia"
 SCANDIA_ADJECTIVE:0 "Scandian"
 SCN:0 "Scandia"
 inherit_scandia_provinces_tooltip:0 "Conquer all territories in the $herulia_area$, $east_gothia_area$, $west_gothia_area$, and $ultima_thule_area$ areas."
 
 turan_must_not_exist:0 "#T Turan#! #Y must not exist#!."
 
 restore_argead_dynasty:0 "Restaurer la dynastie Argead"
 restore_argead_dynasty_desc:0 "[COUNTRY.GetRuler.GetName], souverain de Macédoine, siège des rois macédoniens, a décidé de restaurer la dynastie Argead, car il a du sang Argead, de l'épouse de Kassandre, Thessalonique, demi-sœur d'Alexandre le Grand."
 argead_restoration_tt:1 "Nous restaurerons l'ancienne dynastie Argead."

 formable_not_duna_exists:0 "#Y Duna#! does not exist."
 DUN:0 "$DUNA_NAME$"
 DUNA_NAME:0 "Duna"
 DUNA_ADJECTIVE:0 "Dunian"
 form_duna:0 "Form Duna"
 form_duna_desc:0 "The city known to the Romans as Duna Urbs is called as such for its location at the westernmost point of its namesake river, the Duna river. Its positioning is ideal for accessing the inner traderoutes of the eastern fringes of Europe and tapping into the rich Baltic sea trade network. While the settlement remains small at this moment, it is simply fated for greatness... and we are the first step in that legacy."

 become_gallus:0 "Se castrer"
 become_gallus_desc:0 "En raison de la nature zélée de notre souverain, celui-ci peut se castrer comme s'il était un saint prêtre de Cybèle afin de témoigner de son respect pour l'épouse de Cybèle, Attis."
 make_gallus:0 "Ordonner au prêtre de se castrer"
 make_gallus_desc:0 "Les Galli étaient des prêtres ou saints hommes du culte de Cybèle. Comme l'époux de la déesse Attis, qui s'est castré dans une frénésie divine, un Gallus se castrerait lui aussi et porterait exclusivement des vêtements féminins. Continuons cette pratique en faisant castrer notre grand prêtre lui-même.\n\nCette décision peut être prise une fois tous les 25 ans."

 egypt_mission_3_empire_task_1a:0 "Refondation des Villes"
 egypt_mission_3_empire_task_1a_DESC:0 ""
 cyr_libyan_influences:0 "La Cité gréco-libyenne"
 desc_cyr_libyan_influences:0 "Depuis longtemps les colons grecs et les indigènes libyens vivent côte à côte dans cette cité."
 cyr_treasure_serpent_of_slonta:0 "Le Grand Serpent libyen"
 cyr_treasure_serpent_of_slonta_desc:0 "Un magnifique relief en pierre représentant un serpent, créé par les anciens Libyens en hommage à leurs dieux-serpents."
 cyr_silted_harbour:0 "Port ensablé"
 desc_cyr_silted_harbour:0 "La lagune naturelle qui sert de port à cette ville est ensablée, ce qui rend difficile l'accostage des navires."

 embellish_suebi_grave_fields:0 "Embellissez les champs de sépulture de Suebian"
 embellish_suebi_grave_fields_desc:0 "De nombreux guerriers morts ont été inhumés dans les tombes de #Y Laciburaium#!, leurs familles allongées à côté d'eux et leurs esprits ont été relâchés dans l'au-delà lors de cérémonies de crémation élaborées. Ils nous ont tous bien servis, chacun à leur manière. Leurs lieux de repos définitifs ont été abandonnés pendant des décennies et sont maintenant dans un état déplorable. \nLeurs esprits libérés peuvent nous regarder avec bienveillance depuis l'au-delà - si nous embellissons et restaurons leurs tombes. Les morts méritent d'être commémorés pour les actes qu'ils ont accomplis."
 chaukia_terp:0 "Le Terp d'Amsivaria"
 chaukia_terp_desc:0 "Les conditions de construction d'un terp en [GetProvince('(int32)3836').GetName] sur l'exemple des Frisons sont idéales. Cela donnera à notre peuple plus de terres sur lesquelles vivre, car il s'agit d'un monticule d'habitation artificiel créé pour fournir un sol sûr pendant les ondes de tempête, les marées hautes et les inondations de la mer ou des rivières."

 # Rutabega Random Stuff

 form_salluvian_confederacy:0 "Form the Salluvian Confederacy"
 form_salluvian_confederacy_desc:0 "Emerging in the second century BCE, the Salluvian Confederacy was a loose tribal organization of the various Salluvian tribes. This confederation was formed in part to protect from encroaching Massalian settlement. However this would not last long, as in 121 BCE, the Romans intervened between the Salluvians and the Massalians, sacking the former's capital, and subjugating their leaders."
 formable_not_salluvian_confederacy_exists:0 "The #Y Salluvian Confederacy#! does not exist."
 form_salluvia_claims_tooltip:0 "The #Y Salluvian Confederacy#! will gain claims on the region of #Y Transalpine Gaul#!."
 SALLUVIA_NAME:0 "Salluvian Confederacy"
 SALLUVIA_ADJECTIVE:0 "Salluvian"

 form_bastetania:0 "Unite Bastetania"
 form_bastetania_desc:0 "The various tribes of the Bastetani have always existed separate from each other. But, to unite our lands would ensure the prosperity of our people, and would lead us to prosper, perhaps even greater than the Punics who we are so often in contact with."
 form_bastetania_claims_tooltip:0 "The Bastetanian Confederation will gain claims on the regions of #Y Baetica#! and #Y Contestania#!."
 formable_not_bastetania_exists:0 "#Y Bastetania#! does not exist."
 BASTETANIA_NAME:0 "Bastetania"
 BASTETANIA_ADJECTIVE:0 "Bastetanian"
 inherit_bastetania_provinces_tooltip:1 "Any #Y Subject#! provinces required to form Bastetania will be annexed."

 form_attica:0 "Form Attica"
 form_attica_desc:0 "For centuries now the Attican peninsula and her surrounding islands have been dominated by Athens, who was for a time, the most powerful and influential of all the Greek cities. But this was not always the case; we remember a time when Attica was still divided amongst many cities, Eleusis, Thorikos, Rhamnous, and Megara to name a few. Given the shifting fortunes of the Greek cities ever since the rise of the Diadochi, we would be wise to seek to unite our kin, even if we may have been divided in the past."
 form_attica_claims_tooltip:0 "Attica will gain claims on the province of #Y Attica#!."
