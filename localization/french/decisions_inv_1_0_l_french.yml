l_french:

 #### Decisions from Commander Kings - To Appoint A Regent

 become_regency:0 "Nommer un régent"
 become_regency_desc:0 "[COUNTRY.GetName] marchera bientôt à la guerre. Notre [COUNTRY.GetRulerTitle] [COUNTRY.GetRuler.GetName] doit diriger nos troupes sur le front, et pour cela nommer un régent pour gouverner en son absence. Le régent gouvernera la région capitale et commandera aux levées de cette région pendant que [COUNTRY.GetRuler.GetName] pourra diriger les soldats d'élite d'une légion ou bien une flotte. Vous pourriez gagner de l'influence politique en fonction du nombre d'idées actives!"
 revert_regency:0 "Retirer le régent"
 revert_regency_desc:0 "Le moment est venu pour [COUNTRY.GetCoRulerTitle] [COUNTRY.GetCoRuler.GetName] de revenir aux affaires du gouvernement. Vous pourriez gagner de l'influence politique en fonction du nombre d'idées actives!"

 #### Decisions from 2 Spartan Kings - To Create Higher Ranking Government Forms

 create_spartan_empire:0 "Sparte impériale"
 create_spartan_empire_desc:0 "[COUNTRY.GetRuler.GetName], resplendit dans la gloire des conquêtes, eclypsant tous les autres petits royaumes; il nous faudrait un nouveau titre pour le dirigeant de l'Empire [COUNTRY.GetAdjective]."
 deify_spartan_emperor:0 "Déifier l'empereur spartiate"
 deify_spartan_emperor_desc:0 "Peu de gens nient que [COUNTRY.GetRuler.GetName] est béni. Il s'ensuit donc que cet héritage divin ne peut être que la propriété d'un être divin."

 proclaim_punic_republic:0 "Adopter le républicanisme punique"
 proclaim_punic_republic_desc:0 "Les héritiers de la Phénicie gouvernent en tenant compte à la fois des traditions républicaines et de pratiques commerciales astucieuses, ce qui constitue véritablement la meilleure forme de gouvernement pour [COUNTRY.GetName]."

 become_tyrannic_monarchy:0 "Embrasser la tyrannie"
 become_tyrannic_monarchy_desc:0 "Il est de plus en plus évident que [COUNTRY.GetRuler.GetName] est un dirigeant fort et capable, et que le peuple de [COUNTRY.GetName] a besoin d'un gouvernement fort pour survivre dans ce monde chaotique. Il est temps de mettre fin à la démocratie et d'embrasser la tyrannie."
 become_tyrannic_monarchy_tt:0 "Un personnage avec un haut score martial tentera d'usurper le trône [COUNTRY.GetAdjective] et établir une #Y Tyrannie#!."



 restore_parsa:0 "Restaurer la Perse"
 restore_parsa_desc:0 "Il serait sage de redonner à la Perse sa gloire d'antan."

 #Formables
 form_liguria:0 "Former la Ligurie"
 form_liguria_desc:0 "Les Ligures ont persisté en Gaule cisalpine pendant des millénaires, vivant divisés en petites tribus et travaillant dans les champs. Cependant, une nouvelle puissance se lève au sud qui, si elle n'est pas contrôlée, pourrait menacer notre existence même. Afin de contrer cette menace, nous devons nous regrouper en une fédération panligure capable de combattre ceux qui veulent nous soumettre."
 formable_not_liguria_exists:0 "#Y Ligurie# ! n'existe pas"

 form_hellespontine_district:0 "Former le district d'Hellespont"
 form_hellespontine_district_desc:0 "Né à l'origine du monopole athénien sur la violence et le commerce dans la mer de Propontide et le détroit du Bosphore, le district hellespontin constituait l'un des centres commerciaux les plus prospères au monde, contrôlant la perception des impôts et les flux de marchandises. Recréer ce monopole sur l'économie nous conférerait un contrôle considérable sur la politique et l'avenir du monde."
 formable_not_hellespontine_district_exists:0 "#Y Hellespontine District#! n'existe PAS."

 form_lesser_scythia:0 "Former la Petite Scythie"
 form_lesser_scythia_desc:0 "Connue également sous le nom de "Scythia Minor", cette région était l'un des royaumes les plus méridionaux contrôlés par les Scythes à leur apogée de l'ère classique sous le roi Ateas. Riche de ports de commerce et d'arrière-pays sauvages, elle se présente comme un avant-poste formidable mais insignifiante pour les seigneurs des steppes."
 formable_not_lesser_scythia_exists:0 "#Y Petite Scythie#! n'existe PAS"

 form_lesser_media:0 "Former la Petite Médie"
 form_lesser_media_desc:0 "La Médie a été fragmentée à la suite de la conquête d'Alexandre le Grand, mais la Petite Médie n'en est certainement pas moins importante sur le plan culturel. Cette région constitue sans doute la plus grande partie de la Médie, avec ses terres riches et ancestrales qui abritent le patrimoine de connaissances du plateau iranien, depuis l'époque des Assyriens jusqu'à nos jours."
 formable_not_lesser_media_exists:0 "#Y Lesser Media#! n'existe PAS."
 LESSER_MEDIA_NAME:0 "Lesser Media"
 LESSER_MEDIA_ADJ:0 "Lesser Median"
 lesser_media_claim_tooltip:0 "#E Lesser Media#! va disposer de revendications sur la région de #Y Media#!."
 add_media_claims:0 "La Médie va disposer de revendications sur la région de #Y Médie#!."

 form_corsica:0 "Former la Corse"
 form_corsica_desc:0 "Île située tout près des riches côtes de l'Italie, la Corse est toujours restée une terre sauvage, divisée en deux par une chaîne de montagnes escarpée qui abrite des tribus redoutables et tenaces. Cette terre pourrait devenir un bastion des Corsii si elle était unifiée sous une autorité autochtone."
 formable_not_corsica_exists:0 "#Y Corse#! n'existe PAS"

 form_greater_maeotia:0 "Former la Grande Méotie"
 form_greater_maeotia_desc:0 "Le lac Maeotis, une grande mer au nord du Pont-Euxin, est au point extrême des voies d'eau qui s'étendent jusqu'à l'Atlantiqueau-delà des colonnes d'Hercule. Le peuple tribal méote, longtemps opprimé à la fois par les Grecs et les peuples des steppes, doit prendre le contrôle de son héritage côtier afin de s'affirmer dans ce monde chaotique."
 formable_not_greater_maeotia_exists:0 "#Y Grande Méotie#! n'existe PAS"

 form_slavia:0 "Former la Slavie"
 form_slavia_desc:0 "Nous, les Slaves, vivons aux frontières du monde connu depuis des millénaires, nous contentant d'une maigre existence au milieu des vastes forêts. Pourtant, en dépit de nos similitudes, nous sommes dispersés et divisés, vivant comme si nous étions des peuples distincts, nous battant et nous faisant la guerre les uns contre les autres pour des motifs insignifiants et des querelles sans importance. Si nous nous soulevions et soumettions le reste de notre communauté, nous pourrions proclamer une fédération panslave s'étendant de la mer Baltique à la steppe, capable de soumettre ceux qui sont assez fous pour nous défier."
 formable_not_slavia_exists:0 "#Y Slavie#! n'existe PAS"

 form_lazica:0 "Former la Lazica"
 form_lazica_desc:0 "Le peuple des Laz vivait autrefois parmi les Abasgoi, au nord, et parcourt depuis des générations les sentiers sinueux des terres marécageuses de la région du delta de la Colchide. Oubliés aux yeux du peuple de Kuji, ce sont les Laz qui devraient à leur tour régner sur le Phasis et tracer une nouvelle voie pour les peuples de l'est de la mer Noire."
 formable_not_lazica_exists:0 "#Y Lazica#! n'existe PAS."

 form_punt:0 "Former le Pount"
 form_punt_desc:0 "D'Adouli à Apocopa, le Royaume de Pount est au carrefour du commerce depuis des générations. L'ivoire d'Afrique, l'encens d'Arabie et même les épices de la lointaine Inde transitent par ses ports. Si nous unissions les différentes villes et royaumes de la région sous notre bannière, nous serions en mesure de monopoliser le commerce et d'atteindre une immense richesse au-delà de nos plus folles imaginations."
 formable_not_punt_exists:0 "#Y Punt#! n'existe PAS"

 form_tibetan_empire:0 "Former le Tibet"
 form_tibetan_empire_desc:0 "Le Tibet a longtemps été un trou perdu, isolé sur les sommets des montagnes qui nous protègent. Cependant, nos terres dures et perfides ne nous protégeront pas pour toujours, car tôt ou tard, nous serons conquis par une force trop grande et terrible pour être vaincue par nous-mêmes ; pour survivre, nous devons mettre fin à notre période d'isolement et conquérir activement nos voisins. Avec le plateau fermement sécurisé à l'intérieur des frontières de notre royaume, nous pouvons proclamer un glorieux empire tibétain capable de projeter puissance et influence du haut du monde !"
 tibetan_empire_not_exists:0 "#Y Tibet#! n'existe PAS."
 tibetan_empire_prov_zhangzhung:0 "Nous ou l'un de nos sujets possède des portions tibétaines de #Y Zhangzhung#!."
 tibetan_empire_prov_jangtang:0 "Nous ou l'un de nos sujets possède des portions tibétaines de #Y Jangtang#!."
 tibetan_empire_prov_chomolangma:0 "Nous ou l'un de nos sujets possède des portions tibétaines de #Y Chomolangma#!."
 tibetan_empire_prov_tsang:0 "Nous ou l'un de nos sujets possède des portions tibétaines de #Y Tsang#!."
 
 form_indger:0 "Former le Royaume indo-germanique"
 form_indger_desc:0 "Nous avons migré bien au-delà des limites de notre patrie germanique et nous nous sommes trouvés une terre riche et fertile à l'est des montagnes de l'Hindu Kush. Avec cet endroit comme fondation de notre nouveau pays, notre peuple peut prospérer."
 indger_not_exists:0 "#Y Royaume indo-germanique#! n'existe PAS."
 
 form_arabia:0 "Former l'Arabie"
 form_arabia_desc:0 "Pendant des générations, l'Arabie a été un lien commercial, fournissant de l'encens et de la myrrhe aux principales civilisations du monde, mais notre potentiel de grandeur a été gaspillé par les nombreuses tribus et royaumes fragmentés de la région, qui se font la guerre au lieu de travailler ensemble. En unifiant la péninsule, nous pouvons forger une civilisation des sables rivalisant avec celle de l'Egypte et de la Perse."
 formable_not_arabia_exists:0 "#Y Arabie# ! n'existe PAS."
 
 form_germania:0 "Former la Germanie"
 form_germania_desc:0 "Les tribus de Germania sont chacune individuellement fortes et puissantes, mais sans un chef fort pour les diriger, nous restons juste cela; des tribus séparées trop occupées à être embourbées dans des luttes intestines pour participer à la plus grande gloire qui nous attend. En soumettant et en déposant nos rivaux faibles et myopes, nous pourrons proclamer un Empire germanique capable de mener des guerres titanesques dont la légende parlera pendant mille ans, et la domination du continent sera à nous!"
 formable_not_germania_exists:0 "#Y Germanie# ! n'existe PAS."
 
 form_neo_mitanni:0 "Reformer le Mitanni"
 form_neo_mitanni_desc:0 "Il y a longtemps, le grand Royaume mitanni a été détruit par les Assyriens, son peuple massacré et ses villes réduites en cendres. Maintenant que nous contrôlons ses anciennes terres, nous pouvons nous proclamer les héritiers de ce fier héritage et inaugurer un renouveau de la civilisation mitannie."
 formable_not_neo_mitanni_exists:0 "#Y Royaume néo-mitanni#! n'existe PAS."
 switch_to_mitanni_culture:0 "Nous ferons de #Y néo-mitannie#! notre culture principale, et toutes les pops de notre précédente culture principale s'y convertiront."
 switch_characters_to_mitanni_culture:0 "Tous les personnages des familles importantes de notre précédente culture principale se convertiront à la culture #Y néo-mitannie#!."
 
 form_alania:0 "Former l'Alanie"
 form_alania_desc:0 "Divisés et sans chef, les Alains ont été à plusieurs reprises poussés plus à l'ouest par des tribus plus fortes, forcés de se contenter des pires pâturages. En consolidant nos parents sous une seule tribu, nous serons dans une position privilégiée pour dominer les Sarmates et assurer notre place légitime en tant que seigneurs des chevaux de la steppe."
 formable_not_alania_exists:0 "#Y Alanie#! n'existe PAS."
 alania_formable_prov_darn:0 "Nous ou l'un de nos sujets possède des portions alaniques de #Y Darn#!"
 alania_formable_prov_durse:0 "Nous ou l'un de nos sujets possède des portions alaniques de #Y Durse#!."
 alania_formable_prov_zhalaqana:0 "Nous ou l'un de nos sujets possède des portions alaniques de #Y Zhalaqana#!."
 
 form_massagetia:0 "Former les Massagètes"
 form_massagetia_desc:0 "Nous étions autrefois la puissance dominante de la région, célèbre pour avoir pillé et terrorisé nos voisins, allant jusqu'à tuer Cyrus lui-même. Cependant, notre pouvoir a été brisé par Darius, qui nous a forcés à nous soumettre à son autorité. Maintenant que les Perses sont partis et que leurs terres sont en déroute, nous pouvons nous unir aux autres tribus massagéennes pour reprendre notre place légitime dans la steppe."
 formable_not_massagetia_exists:0 "#Y Massagètes#! n'existe PAS."
 massagetia_formable_prov_darn:0 "Nous ou l'un de nos sujets possède des portions massagètes de #Y Darn#!."
 massagetia_formable_prov_chach:0 "Nous ou l'un de nos sujets possède des portions massagètes de #Y Chach#!."
 massagetia_formable_prov_chomaria:0 "Nous ou l'un de nos sujets possède des portions massagètes de #Y Chomaria#!."

 form_piaoyue:0 "Former le Piaoyue"
 form_piaoyue_desc:0 "Les terres où les religions bon, védique et natique ​​se rencontrent ont longtemps été un carrefour qui facilite l'échange de biens et d'idées à travers une région remplie d'une variété de personnes très différentes. Et pourtant, il peut y avoir de la force dans la diversité et les terres des Piaoyue en témoignent."
 PIY_NAME:0 "Piaoyue"
 PIY_ADJECTIVE:0 "piaoyue"
 PIY:0 "Piaoyue"
 natic_flavor.1.t:0 "Adoption du natisme par les Pyu"
 natic_flavor.1.desc:0 "La migration du peuple pyu s'est bien établie dans ces terres autrefois occupées par les cultures pu. Avec l'installation de notre peuple, la plupart des gens embrassent les croyances natiques plutôt que nos croyances ancestrales tibétaines. En fait, la religion natique ​​est devenue un meilleur reflet de nos croyances que nos anciennes habitudes ne l'ont jamais été. Officialisons le changement."
 natic_flavor.1.a:0 "Adoptons la foi en Nats."
 natic_flavor.1.b:0 "Sans doute pas."
 pyu_natic_convert.tt:0 "Jusqu'à #G 20#! pops dans la capitale se convertissent au #E Natisme#!."

 unite_the_dahae:0 "Unifier les Dahéens"
 unite_the_dahae_desc:0 "Depuis trop longtemps, les tribus dahae se chamaillent entre elles. Nous avons été désunis et faibles, ouverts aux caprices des grands empires qui nous entourent.\nUnissons les tribus dahéennes en une puissante fédération tribale, car ce n'est qu'alors que nous serons maîtres de notre destin."
 unite_dahae_claims_tooltip:0 "Les Dahéens vont disposer de revendications sur la province de #Y Parthie#!."

 form_abasgia:0 "Former l'Abasgie"
 form_abasgia_desc:0 "En vainquant et en soumettant les différentes tribus qui nous entourent pour former une nation puissante, nous avons prouvé au monde entier que nous ne sommes pas de simples barbares, mais les fondateurs d'un nouveau royaume : l'Abasgie!"
 
 form_vindelicia:0 "Former la Vindelicia"
 form_vindelicia_desc:0 "Aux contreforts rocheux des Alpes vivent les différentes tribus vindéliciennes, divisées et désunies, ce qui permet aux tribus germaniques et celtiques voisines de nous attaquer et de nous piller en toute impunité; si nous parvenions à former une confédération et à rassembler les autres tribus vindeliciennes sous un seul chef, nous pourrions coordonner nos forces et repousser ceux qui oseraient nous asservir."
 vindelicia_not_exists:0 "#Y Vindelicia#! n'existe PAS."
 
 form_tocharia:0 "Former la Tocharie"
 form_tocharia_desc:0 "Depuis des temps immémoriaux, nous nous sommes trouvés au carrefour de grandes civilisations, facilitant les échanges commerciaux et les idées entre l'Est et l'Ouest en tant qu'intermédiaires, alimentant ainsi la croissance de villes prospères situées le long des couloirs habitables qui traversent le désert hostile. Avec la mort d'Alexandre à l'ouest, la montée en puissance des Xiongnu au nord-est et la Chine divisée en États belligérants, une grande partie du monde a été plongée dans la tourmente, ce qui rend plus prudent que jamais le renforcement de nos défenses et la sécurisation des routes commerciales pour les marchands de passage; en prenant le contrôle des autres villes du bassin du Tarim, nous pourrons monopoliser la Route de la soie afin d'accroître nos profits et de financer une défense efficace."
 formable_not_tocharia_exists:0 "#Y Tocharia#! n'existe PAS."
 
 form_pong:0 "Former la Pong"
 form_pong_desc:0 "Cachée dans la brume, la peuple shan vit dans les hautes terres nébuleuses au bord des mondes indien et sinitique, ayant migré ici de nombreuses générations auparavant. Avec l'arrivée récente des Pyu, la fertile vallée de l'Irrawaddy a été morcelée et divisée en diverses cités-États et tribus, laissant cette contrée vulnérable à une incursion étrangère. Avec les meilleurs guerriers des hautes terres réunis en une seule force, nous pourrons sortir de nos collines fortifiées et fonder un grand royaume dont on parlera dans les mythes et les légendes pendant des générations."
 formable_not_pong_exists:0 "#Y Pong#! n'existe PAS."
 
 #Pannonia
 form_pannonia_all:0 "Former la Pannonie"
 form_pannonia_dacia:0 "Former la Pannonie"
 form_pannonia_celtic:0 "Former la Pannonie"
 form_pannonia_germanic:0 "Former la Pannonie"
 form_pannonia_scythian:0 "Former la Pannonie"
 form_pannonia_baltic:0 "Former la Pannonie"
 form_pannonia_pannonian:0 "Former la Pannonie"
 form_pannonia_berber:0 "Former la Pannonie"
 form_pannonia_all_desc:0 "Protégées par les montagnes au nord et à l'est, et mises à l'abri par les rivières au sud, les plaines fertiles du bassin des Carpates constituent l'endroit idéal pour fonder un royaume fort et puissant, digne d'être rappelé dans les annales. Pourtant, les autres tribus qui y vivent sont dispersées et divisées, dirigées par des hommes de peu de valeur, indignes de leurs titres; si nous parvenons à nous démarquer de nos pairs et à unifier la région, nous pourrons nous proclamer véritables maîtres de la Pannonie et forger un avenir meilleur pour notre peuple."
 form_pannonia_dacia_desc:0 "Protégé par les montagnes au nord et à l'est, et mis à l'abri par les rivières au sud, le bassin des Carpates est l'endroit idéal pour fonder un grand royaume qui restera dans les mémoires. Nos frères sont dispersés et divisés, dirigés par des souverains de second ordre indignes de leur titre; si nous parvenons à unifier la région, nous pourrons nous proclamer véritables maîtres de la Pannonie."
 form_pannonia_celtic_desc:0 "Protégé par les montagnes au nord et à l'est, et mis à l'abri par les rivières au sud, le bassin des Carpates est l'endroit idéal pour fonder un grand royaume digne d'être rappelé. Nos frères sont dispersés et divisés, dirigés par des souverains de second ordre indignes de leur titre; si nous parvenons à unifier la région, nous pourrons nous proclamer véritables maîtres de la Pannonie."
 form_pannonia_germanic_desc:0 "Protégé par les montagnes au nord et à l'est, et mis à l'abri par les rivières au sud, le bassin des Carpates est l'endroit idéal pour établir un nouveau foyer pour notre peuple, où il ne connaîtra plus jamais la peur ni les horreurs de la guerre. Les habitants de cette région sont peu nombreux et divisés par de mesquines querelles tribales; si nous agissons dès maintenant, nous pourrons conquérir cette région et nous imposer comme les maîtres de la Pannonie."
 form_pannonia_scythian_desc:0 "Protégé par les montagnes au nord et à l'est, et mis à l'abri par les rivières au sud, le bassin des Carpates est l'endroit idéal pour établir un nouveau foyer pour notre peuple, où il ne connaîtra plus jamais la peur ni les horreurs de la guerre. Les habitants de cette région sont peu nombreux et divisés par de mesquines querelles tribales; si nous agissons dès maintenant, nous pourrons conquérir cette région et nous imposer comme les maîtres de la Pannonie."
 form_pannonia_baltic_desc:0 "Protégé par les montagnes au nord et à l'est, et mis à l'abri par les rivières au sud, le bassin des Carpates est l'endroit idéal pour établir un nouveau foyer pour notre peuple, où il ne connaîtra plus jamais la peur ni les horreurs de la guerre. Les habitants de cette région sont peu nombreux et divisés par de mesquines querelles tribales; si nous agissons dès maintenant, nous pourrons conquérir cette région et nous imposer comme les maîtres de la Pannonie."
 form_pannonia_pannonian_desc:0 "Protégé par les montagnes au nord et à l'est, et mis à l'abri par les rivières au sud, le bassin des Carpates est l'endroit idéal pour fonder un grand royaume digne d'être rappelé. Nos frères sont dispersés et divisés, dirigés par des souverains de second ordre indignes de leur titre; si nous parvenons à unifier la région, nous pourrons nous proclamer véritables maîtres de la Pannonie."
 form_pannonia_berber_desc:0 "Après avoir quitté notre terre natale, un désert rude, aride et inhospitalier, à la recherche de pâturages plus verts, notre peuple a survécu au gré de ses déplacements, vivant au jour le jour, en saisissant toutes les occasions qui se présentaient. Cependant, après de longues années de privations et de conflits, bon nombre d'entre eux sont las de ces longs voyages et commencent à remettre en question notre direction. Pourtant, alors que tout espoir semblait perdu, nous sommes tombés par hasard sur une région riche et fertile qui est en grande partie abandonnée, et ceux qui y demeurent sont dispersés et divisés; si nous agissons maintenant et tirons parti de cette faiblesse, nous pouvons conquérir cette région et nous imposer comme les maîtres de la Pannonie."
 PANNONIA_NAME:0 "Pannonie"
 PANNONIA_ADJECTIVE:0 "Pannonien"
 pannonia_not_exists:0 "#Y Pannonia#! ne doit PAS exister."
 formable_pannonia_capital:0 "Notre capital doit être implanté dans les régions de #Y Pannonia#!, #Y Dacia#!, ou les territoires surlignés de #Y Boihaemia#!."
 
 #Atrebatia
 form_atrebatia:0 "Former l'Atrébatie"
 form_atrebatia_desc:0 "Depuis longtemps déjà, nous traversons la Manche pour mener des raids et piller les côtes de Britannie, ce qui a permis à nos guerriers d'amasser de grandes richesses et de nombreux butins au fil des ans. Cependant, maintenant que nous avons commencé à établir des colonies permanentes dans la région, il est temps que nous revendiquions la seigneurie sur nos nouveaux domaines en fondant le royaume d'Atrebatia."
 ATREBATIA_NAME:0 "Atrébatie"
 ATREBATIA_ADJECTIVE:0 "Atrébatien"
 atrebatia_not_exists:0 "#Y Atrebatia#! ne doit PAS exister."
 formable_atrebatia_capital:0 "Notre capital doit être implanté dans les régions de #Y Britannia#! ou #Y Caledonia#!."

#make sure there's no overlap with caria
 form_chrysaoric_league:0 "Former la Ligue chrysaorienne"
 form_chrysaoric_league_desc:0 "Alexandre s'attira une grande popularité auprès des Cariens pour avoir rétabli la reine Ada sur le trône de Carie après qu'elle eut été destituée par son frère. Pendant un certain temps, elle régna sous l'œil vigilant d'Asandre, qui avait été satrape de Lydie puis également de Carie. Bien qu'Asandre fût en faveur auprès d'Antipater, de Ptolémée et de Séleucos, il était l'ennemi d'Antigone, qui l'enviait. En 313 av. J.-C., Asandre fut contraint de céder ses territoires à Antigone, ce qui entraîna la dissolution effective de la satrapie de Carie. \n\nPeut-être qu'en créant une ligue de villes cariennes sous les auspices d'Hécate et de Zeus Chrysaoreus, centrée autour de [GetProvince('(int32)1980').GetName], qui abrite des temples dédiés à ces dieux particulièrement favorisés, les villes et villages de Carie pourraient accomplir leur destin et celui de notre peuple en ouvrant une nouvelle voie, libre de toute ingérence d'envahisseurs étrangers."
 form_chrysaoric_league_claims_tooltip:0 "Chrysaoreus va disposer de revendications sur la région de #Y $ionia_area$#!, #Y $sporades_area$#! et #Y $lycia_area$#!."
 caria_ownership_value_tooltip:0 "Au moins #Y 75%#! des territoires mis en évidence dans #Y Caria#! sont possédés en propre ou par une dépendance de #Y [THIS.GetCountry.GetName]#!."
# caria_ownership_value_tooltip_old:0 "At least #Y 15#! Territories in #Y Caria#! are owned by #Y [COUNTRY.GetName]#! or a Subject. (Current:0 #Y [SCOPE.ScriptValue('current_caria_ownership_value')|0]#!)"

 formable_not_chrysaoric_league_exists:0 "#Y Chrysaoreus#! ne doit PAS exister."
 formable_not_chrysaoric_exists:0 "La #Y Ligue chrysaorienne#! ne doit PAS exister."
 CHRYSAORIC_NAME:0 "Ligue chrysaorienne"
