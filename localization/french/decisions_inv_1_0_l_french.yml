 SVA:0 "$SUANIA_NAME$"
 SUANIA_NAME:0 "Suanie"
 SUANIA_ADJECTIVE:0 "suanien"
 form_suania:0 "Suanie"
 form_suania_desc:0 "Des hauteurs escarpées du Caucase, nous planterons notre bannière, le drapeau de la Suanie, au sommet des plus hautes cimes — proclamons à la Terre qu'une nation de conquérants a triomphé !"

 LIG:0 "$LIGURIA_NAME$"
 LIGURIA_NAME:0 "Ligurie"
 LIGURIA_ADJECTIVE:0 "ligurienne"

# Lesser Scythia
 LES:0 "$LESSER_SCYTHIA_NAME$"
 LESSER_SCYTHIA_NAME:0 "Petite Scythie"
 LESSER_SCYTHIA_ADJECTIVE:0 "scythe"
 form_scythia:0 "Former la Scythie"
 form_scythia_desc:0 "Les Scythes sont un peuple fier et indépendant, connu pour son habileté au combat et sa maîtrise des steppes. Le moment est venu d'unir les tribus de la Scythie sous une seule bannière, afin d'apporter force et stabilité à ces contrées. De là, nous protégerons notre manière de vivre et, si nécessaire, étendrons notre puissance pour sécuriser nos frontières face aux menaces de toutes parts."
 formable_not_scythia_exists:0 "#Y Scythia#! n'existe pas."
 form_lesser_scythia_claims_tooltip:0 "#E Scythia#! obtiendra des revendications sur les régions de #Y $borysthenia_minor_area$#! et #Y $borysthenia_area$#!."

 form_hellespontine_phrygia:0 "Former la Phrygie hellespontine"
 form_hellespontine_phrygia_desc:0 "Établie au début du Ve siècle avant J.-C., la Phrygie hellespontine fut gouvernée par des descendants de Pharnace, l'oncle du roi Darius Ier, avec sa capitale à Dascylium. Pendant la campagne d'Alexandre le Grand en 334 avant J.-C., le satrape de la Phrygie hellespontine, Arsites, subit une défaite décisive à la bataille du Granique, après quoi il se suicida. Alexandre nomma Calas comme successeur. Après la mort d'Alexandre en 323 avant J.-C., la satrapie fut attribuée à Léonnatos, membre de la maison royale de Lyncestis en Macédoine et l'un des gardes du corps de confiance d'Alexandre. Léonnatos nourrissait des ambitions au-delà de sa satrapie ; il demanda la main de Cléopâtre, sœur d'Alexandre, ce qui aurait pu renforcer sa prétention au pouvoir. S'il avait vaincu les Athéniens, Léonnatos aurait très bien pu tenter de s'emparer du trône macédonien. Sa carrière fut brisée pendant la guerre de Lamia, où il conduisit une force de 20 000 fantassins et 1 500 cavaliers pour secourir Antipater lors du siège de Lamia. Léonnatos fut tué au combat, laissant ses ambitions inachevées. Le contrôle de la satrapie passa alors à Arrhidée, qui la conserva jusqu'au Partage de Triparadisos (321 av. J.-C.), après quoi Clitus le Blanc fut nommé satrape. Le règne de Clitus fut bref. Il fut vaincu et tué en 317 av. J.-C. par Arrhidée. Son successeur, Ardys, gouverna pendant une période incertaine avant qu'un nouveau changement de pouvoir n'ait lieu. Phoenix de Ténédos, fidèle subordonné d'Antigone, gouverna la région un temps, puis ce fut le neveu d'Antigone, Polémaios, autre général d'Antigone. Toutefois, après le suicide forcé de Polémaios, la satrapie est désormais disparue."
 hellespontine_phrygia_claims_tooltip:0 "La Phrygie hellespontine obtiendra des revendications sur les régions de #Y $asia_region$#! et #Y $bithynia_region$#!."
 formable_not_hellespontine_phrygia_exists:0 "#Y Hellespontine Phrygia#! ne doit PAS exister."
