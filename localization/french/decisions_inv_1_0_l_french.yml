 form_phocian_confederation:0 "Unir la Grande Phocide"
 form_phocian_confederation_desc:0 "Semblant de se réunir d'abord face à l'armée perse pendant la Seconde Guerre gréco-perse, la Confédération phocienne était l'union de cités aux vues similaires dans la région culturelle centrée autour de Delphes et d'Élatée. Les membres de la Confédération mirent à profit l'importance religieuse et culturelle de leur patrie pour poursuivre des visées politiques dans la région environnante, cherchant activement le conflit afin de gagner des territoires au prix de ses terres plus riches en ressources. Avant d'être humiliée par Philippe, la Confédération phocienne faisait contrepoids à la Ligue béotienne, qui menaçait sans cesse son existence."
