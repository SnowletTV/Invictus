 form_upper_cilicia_claims_tooltip:0 "#E Cilicie supérieure#! obtiendra des revendications sur les régions de #Y $cilicia_pedias_area$#!, #Y $cilicia_trachea_area$#!, #Y $cappadocia_cataonia_area$#! et #Y $commagene_area$#!"
 UPPER_CILICIA_NAME:0 "Cilicie supérieure"
 UPPER_CILICIA_ADJECTIVE:0 "cilicien supérieur"

 priests_of_the_pedias:0 "Prêtres du Pédias"
 priests_of_the_pedias_desc:0 "Les basses terres de la Cilicie du Pédias, dominées par la cité sacrée de Castabala, ont longtemps suivi les rites de la déesse hourrite Kubaba, hellénisés en Artémis Perasia et Tyche. Ces rites gouvernent les cœurs des hommes plus sûrement qu'aucune garnison étrangère. À l'ombre du sanctuaire antique de Castabala, des prêtres-rois ont régné pendant des générations innombrables. Peut-être conviendrait-il de confier à ces gardiens des anciens dieux la royauté de la Cilicie supérieure. Leurs domaines seront enviés même par la noblesse de [COUNTRY.GetCapital.GetName]. Parmi les collines de Campestris et sous les escarpements de l'Amanus, la résistance peut persister, mais nul chieftain, fût-il sauvage, n'ose défier les dieux et leurs fidèles protecteurs..."
 priests_of_the_pedias_ownership_value_tooltip:0 "Au moins #Y 8#! des territoires de #Y la Cilicie supérieure#! sont possédés par #Y [COUNTRY.GetName]#! ou un de ses sujets. (Actuel : #Y [SCOPE.ScriptValue('current_upper_cilicia_ownership_value')|0]#!/#R 8#!)"
 priests_of_the_pedias_effect_tt:0 "#Y [THIS.GetCountry.GetName]#! aura l'option d'élever le #T Prêtre de Castabala#! au rang de #E Royauté de la Cilicie supérieure#!.\n#Y La Cilicie supérieure#! annexera tous les territoires de la région possédés par #Y [COUNTRY.GetName]#! ou l'un de ses sujets.\nLe #E suivant#! se produira si nous choisissons de le faire :\n"

 flavor_cilicia.1.t:0 "Prêtres du Pédias"
 flavor_cilicia.1.desc:0 "Les basses terres de la Cilicie du Pédias, dominées par la cité sacrée de Castabala, ont longtemps suivi les rites de la déesse hourrite Kubaba, hellénisés en Artémis Perasia et Tyche. Ces rites gouvernent les cœurs des hommes plus sûrement qu'aucune garnison étrangère. À l'ombre du sanctuaire antique de Castabala, des prêtres-rois ont régné pendant des générations innombrables. Peut-être conviendrait-il de confier à ces gardiens des anciens dieux la royauté de la Cilicie supérieure. Leurs domaines seront enviés même par la noblesse de [ROOT.GetCountry.GetCapital.GetName]. Parmi les collines de Campestris et sous les escarpements de l'Amanus, la résistance peut persister, mais nul chieftain, fût-il sauvage, n'ose défier les dieux et leurs fidèles protecteurs..."
 flavor_cilicia.1.a:0 "'Roi [GetCountry('CAS').GetRuler.GetName]' sonne bien."
