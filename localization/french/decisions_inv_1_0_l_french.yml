###THESSALY###
# THESSALIAN_LEAGUE:0 "Ligue thessalienne"
# THL:0 "Ligue thessalienne"
 THESSALIAN_LEAGUE:0 "Thessalie"
 THL:0 "Thessalie"
 #Thessaly Releasable
 restore_thessalian_league:0 "La question thessalienne"
 restore_thessalian_league_desc:0 "Berceau même de l'Olympe, la Thessalie siège depuis longtemps au bord extrême de la frontière grecque, loin au nord d'Athènes civilisée, mais sans encore atteindre les terres barbares au-delà de la Macédoine. Les nombreuses cités qui parsèment les plaines ont historiquement été unies sous une Ligue thessalienne centrale, développant ainsi une identité distincte et propre. Depuis l'époque du Tagus Aléuas, qui prétendait descendre d'Héraclès, les terres que nous appelons Thessalie furent morcelées en quatre régions autonomes, toutes soumises à l'obéissance du Tagus que les grandes familles de Pharsale, Larisa et Pherai avaient établies dans leurs lignées honorées. Pourtant, après avoir remporté une guerre civile au nom de Larisa et vaincu Lycophron de Phères et Onomarchos de Phocide, Philippe II de Macédoine brisa l'équilibre établi lorsqu'il fut nommé Archonte de la Ligue thessalienne, soumettant celle-ci au trône de la Macédoine. La Ligue thessalienne devint une quasi-nullité après une révolte avortée contre Alexandre le Grand, puis perdit une grande partie de son autonomie.\n\nRétablir la #E Ligue thessalienne#!, même si son indépendance n'est que nominale, rendrait sans doute le gouvernement de [COUNTRY.GetAdjective] plus acceptable aux yeux du peuple thessalien."
 thessalian_league_not_exists:0 "#Y La Ligue thessalienne#! n'existe pas."
 thessalian_league_tooltip:0 "Nous déciderons du sort de la Thessalie.\nLa Ligue thessalienne peut être restaurée en tant que #Y feudataire#!, recevant toutes les terres de la région de #Y Thessalie#!, ou bien intégrée au cœur de notre royaume."

 #Thessaly Formable
 form_thessalian_league:0 "Former la Thessalie"
 form_thessalian_league_desc:0 "Berceau même de l'Olympe, la Thessalie siège depuis longtemps au bord extrême de la frontière grecque, loin au nord d'Athènes civilisée, mais sans encore atteindre les terres barbares au-delà de la Macédoine. Les nombreuses cités et villes qui parsèment les plaines ont historiquement été unies sous une Ligue thessalienne centrale, développant ainsi une identité distincte et propre. Depuis l'époque du Tagus Aléuas, qui prétendait descendre d'Héraclès, les terres que nous appelons Thessalie furent morcelées en quatre régions autonomes, toutes soumises à l'obéissance du Tagus que les grandes familles de Pharsale, Larisa et Pherai avaient établies dans leurs lignées honorées. Pourtant, après avoir remporté une guerre civile au nom de Larisa et vaincu Lycophron de Phères et Onomarchos de Phocide, Philippe II de Macédoine brisa l'équilibre établi lorsqu'il fut nommé Archonte de la Ligue thessalienne, soumettant celle-ci au trône de la Macédoine. La Ligue thessalienne devint une quasi-nullité après une révolte avortée contre Alexandre le Grand, puis perdit une grande partie de son autonomie.\n\nDepuis trop longtemps, les Thessaliens ont été dominés par les Macédoniens, qui écrasèrent les antiques Tripolis de Pharsale, Larisa et Pherai. À mesure que la puissance macédonienne s'affaiblit, la Thessalie retrouvera sa place parmi les grandes puissances grecques !"
 thessalian_nobles_tooltip:0 "#Y Thessalien#! (#E Culture#!) possède le statut de #E noble#!."
 thessalian_culture_tooltip:0 "Jusqu'à 25 nobles, citoyens et hommes libres non thessaliens deviendront #Y Thessaliens#!."
 thessalian_character_culture_tooltip:0 "Plusieurs personnages majeurs se convertiront à la culture #Y thessalienne#!."
 #Thessaly Heritage
 thessalian_league_heritage:0 "Héritage thessalien"
 thessalian_league_heritage_desc:0 "Berceau même de l'Olympe, la Thessalie siège depuis longtemps au bord extrême de la frontière grecque, loin au nord d'Athènes civilisée, mais sans encore atteindre les terres barbares au-delà de la Macédoine. Les nombreuses cités et villes qui parsèment les plaines ont historiquement été unies sous une Ligue thessalienne centrale, développant ainsi une identité distincte et propre. Depuis l'époque du Tagus Aléuas, qui prétendait descendre d'Héraclès, les terres que nous appelons Thessalie furent morcelées en quatre régions autonomes, toutes soumises à l'obéissance du Tagus que les grandes familles de Pharsale, Larisa et Pherai avaient établies dans leurs lignées honorées. Pourtant, après avoir remporté une guerre civile au nom de Larisa et vaincu Lycophron de Phères et Onomarchos de Phocide, Philippe II de Macédoine brisa l'équilibre établi lorsqu'il fut nommé Archonte de la Ligue thessalienne, soumettant celle-ci au trône de la Macédoine. La Ligue thessalienne devint une quasi-nullité après une révolte avortée contre Alexandre le Grand, puis perdit une grande partie de son autonomie. La Thessalie est réputée pour élever les meilleurs chevaux et produire les cavaliers les plus habiles de la Méditerranée. Ils servirent vaillamment d'abord sous Philippe II, puis sous Alexandre III, jusqu'à ce qu'Alexandre congédia ses cavaliers thessaliens après la conquête de la Médie. Dans les années qui suivirent la mort d'Alexandre, beaucoup se retrouvèrent au service des Diadoques, dont les services étaient fort prisés."

 #Thessaly modifier
 thessalian_cavalrymen:0 "Commandants thessaliens"
 desc_thessalian_cavalrymen:0 "Ayant gagné la confiance des Thessaliens, un groupe de commandants et de cavaliers thessaliens vétérans s'est offert pour enseigner à notre propre cavalerie leurs techniques."
 #Thessaly event
 thessalian_league_title:0 "Thessalie resplendissante ?"
 thessalian_league_desc:0 "Alors que le soleil se couche sur la grandiose ville de [ROOT.GetCountry.GetCapital.GetName], un #E noble thessalien#! très populaire du nom de [thessalian_nobleman.GetName] fait son entrée, monté sur un cheval qui ressemble fort à #E Bucéphale#!. Le noble, accompagné d'une petite suite composée de #E commandants thessaliens chevronnés#! et de #E cavaliers#!, sollicite une audience auprès de [ROOT.GetCountry.GetRuler.GetName]. En entrant dans les appartements de [ROOT.GetCountry.GetRuler.GetFamily.GetName], les cavaliers saluent [ROOT.GetCountry.GetRuler.GetFamily.GetName] et #E s'engagent à ses services#! à [ROOT.GetCountry.GetName], en proposant d'enseigner leurs techniques à notre propre cavalerie. S'inclinant profondément, [thessalian_nobleman.GetName] formule sa requête : « Honorable [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetFamily.GetName], je viens en tant que représentant des #E peuples thessaliens#! que [ROOT.GetCountry.GetRuler.GetName] a si gracieusement libérés. Notre peuple se souvient des jours de gloire d'une #E Ligue thessalienne# forte et indépendante! En fin de compte, l'ancienne Ligue était faible et n'était guère plus qu'un appareil destiné à décerner des titres ronflants à des intrus, mais sous la direction de [ROOT.GetCountry.GetName], peut-être qu'une #E Ligue thessalienne#! indépendante, protégée bien sûr par un #E [ROOT.GetCountry.GetAdjective] Archonte#!, pourrait renaître. « Espérant peut-être influencer [ROOT.GetCountry.GetRuler.GetFamily.GetName], [thessalian_nobleman.GetName] tomba à genoux et se mit à exprimer avec véhémence sa gratitude. « Merci. Merci, Archonte! Vraiment, [ROOT.GetCountry.GetName] nous a libérés.'\n\nBien que beaucoup à [ROOT.GetCountry.GetName] considèrent sûrement que l'octroi de l'indépendance est intenable, une #E Ligue thessalienne#! subordonnée à [ROOT.GetCountry.GetName] constituerait un tampon indispensable face aux terres barbares du nord. Le rétablissement de la #E Ligue de Thessalie#!, même si son indépendance n'est que nominale, rendrait certainement notre domination plus acceptable aux yeux du peuple thessalien, qui nous considérerait alors non pas comme des conquérants, mais comme des libérateurs!\n\nAmusé, [ROOT.GetCountry.GetRuler.GetFamily.GetName] répond en disant… »"
 thessalian_league.a:0 "Oh, je ne dirais pas libre, plutôt sous une nouvelle administration."
 thessalian_league.b:0 "#E La Ligue thessalienne#! renaîtra de ses cendres !"
 thessalian_league_release_tooltip:0 "Libérer la Ligue thessalienne en tant que #Y tributaire#!, elle recevra toutes les terres que #Y [SCOPE.GetRootScope.GetCountry.GetName]#! détient dans la région de #Y Thessalie#!"
 thessalian_league_tribute_tooltip:0 "Cela satisfera tous les pays $hellenic$"
 thessalian_league.c:0 "[thessalian_nobleman.GetPraenomen], aimeriez-vous être roi ?"
 thessalian_league_2_release_tooltip:0 "Libérer la Thessalie en tant que #Y feudataire#!, elle recevra toutes les terres que #Y [SCOPE.GetRootScope.GetCountry.GetName]#! détient dans la région de #Y Thessalie#!"

 ######
 macedon_thrace_not_existing:0 "La Macédoine ne doit pas exister."
 form_macedon_thrace:0 "Le trône de Macédoine"
 form_macedon_thrace_desc:0 "Les seigneurs de Macédoine ont toujours favorisé les forts et puissants plutôt que les faibles et chétifs. Si nous jouons bien notre carte, les Lysimachides peuvent encore se révéler les plus puissants de tous. Cependant, si l'héritage d'Alexandre doit un jour être rétabli, nous devons d'abord saisir ce qu'il reste de son royaume, l'arracher aux mains de ceux qui le conduisent à la ruine et créer à sa place un nouvel État plus solide pour les Macédoniens dispersés dans les débris fracassés de l'Empire argead."
 thrace_macedon_capital:0 "Capitale lysmachide-argeade"
 desc_thrace_macedon_capital:0 "La ville de Pella sert désormais de centre au royaume lysimachide de Macédoine — les légitimes récupérateurs de l'héritage d'Alexandre."

 flavor_tre.1.t:0 "Le trône de Macédoine"
 flavor_tre.1.desc:0 "[ROOT.GetCountry.GetRuler.GetName] a réussi à récupérer le trône d'Alexandre le Grand à Pella, cœur du royaume macédonien et tombes ancestrales de ses chefs et guerriers de la dynastie maudite des Antipater. La position de la dynastie lysmachide comme rois légitimes de Macédoine, plus que de simples successeurs provinciaux d'un empire mort, est désormais assurée."
 flavor_tre.1.a:0 "[ROOT.GetCountry.GetRuler.GetPraenomen] est le [ROOT.GetCountry.GetRulerTitle] de Macédoine !"
 flavor_tre.1.at:0 "Nous adopterons le drapeau et les couleurs de la Macédoine."
 flavor_tre.1.b:0 "Ceci est, et sera toujours, le royaume de Lysimaque."
 flavor_tre.1.bt:0 "Nous conserverons le drapeau et les couleurs des Lysimachides."
 flavor_tre.1.c:0 "Nous gouvernons la Macédoine, mais ce n'est pas la Macédoine d'antan."
 flavor_tre.1.ct:0 "Nous adopterons les couleurs de la Macédoine, mais conserverons les symboles des Lysimachides."
 flavor_tre.1.d:0 "Ceci est un nouveau chapitre dans l'histoire des Macédoniens."
 flavor_tre.1.dt:0 "Nous adopterons les symboles de la Macédoine, mais conserverons les couleurs des Lysimachides."
#

 eunostos_soloi_egypt:0 "Rois chypriotes"
 eunostos_soloi_egypt_desc:0 "Avant la mort de Perdiccas (321 av. J.-C.), Ptolémée avait conclu une alliance avec Nikokréon, le plus éminent des rois chypriotes. En 316 avant J.-C., Chypre devint le champ de bataille entre Ptolémée et Antigone pour le contrôle de la Méditerranée. À ses côtés, Nikokréon comptait trois autres vassaux fidèles : Nicoclès de Paphos, Androklès d'Amathonte et Pasikrates de Soles. Les autres rois de Chypre s'allièrent à Antigone. L'intervention militaire de Ptolémée sous le commandement de son frère Ménélaos s'avéra couronnée de succès pour apaiser les rois rebelles. En 312, Ptolémée chassa tous les rois chypriotes à l'exception de Nikokréon de Salamine (et peut-être d'Eunostos de Soles). Ptolémée maria sa fille Irène à Eunostos peu après la mort du père de ce dernier afin de s'assurer que le nouveau roi d'un grand royaume chypriote restât fidèle. Les domaines de Nikokréon furent grandement étendus ; il fut nommé principal officier ptolémaïque de l'île et nommé stratège de Chypre.\n\nBien que Nikokréon fût favorisé par Ptolémée, sa mort en 309 av. J.-C. conduisit à une administration ptolémaïque directe de Chypre et à l'abolition des royaumes chypriotes indépendants restants. Le frère de Ptolémée, Ménélaos, succéda à Nikokréon ; il fut fait roi de Salamine et satrape de Chypre."
 eunostos_soloi_egypt_allow_tt:0 "[GetCharacter('(int32)430').GetName] est dans [THIS.GetCountry.GetName]"
 eunostos_soloi_egypt_reward_tt:0 "Les Pasikratides peuvent être libérés comme sujets sur [GetProvince('(int32)333').GetArea.GetName] en échange d'or."

 form_delphic_amphictyony:0 "Rétablir l'Amphictyonie delphique"
 form_delphic_amphictyony_desc:0 "Selon la légende, la Ligue amphictyonique delphique fut fondée par le frère d'Hélène, Amphictyon. À l'origine, la ligue comprenait douze groupes membres : les Aenianes, Béotiens, Dolopes, Doriens, Ioniens, Locriens, Magnésiens, Maliens, Perrhébiens, Phocidiens, Pythiens et Thessaliens. Organisée autour du lieu éponyme de Delphes pour soutenir les rites et l'entretien du temple d'Apollon et de Déméter à Delphes, l'Amphictyonie delphique dispensait la loi religieuse et la punition, menait la guerre et établissait des règles du conflit et de l'État.\n\nLa Troisième Guerre sacrée (356 av. J.-C.) fut déclenchée après que les Phocidiens s'emparèrent de Delphes et pillèrent son trésor. Finalement, les Macédoniens de Philippe se joignirent à la guerre contre les Phocidiens, les vainquirent et reçurent leurs sièges au conseil de la ligue, prélude à sa conquête de la Grèce par la diplomatie et la force."
 delphic_amphictyony_not_exists:0 "L'#E Amphictyonie delphique#! ne doit PAS exister."
 DL2:0 "Amphictyonie delphique"
 DELPHIC_AMPHICTYONY_NAME:0 "Amphictyonie delphique"
 GREAT_AMPHICTYONY_NAME:0 "Grande Amphictyonie"
 DELPHIC_AMPHICTYONY_ADJECTIVE:0 "amphictyonique"
 inherit_delphic_amphictyony_provinces_tooltip:0 "Toute province #Y sujet#! requise pour former l'Amphictyonie delphique sera annexée."
 form_delphic_amphictyony_claims_tooltip:0 "L'Amphictyonie delphique obtiendra des revendications sur les régions de #Y Grèce#! et #Y Macédoine#!."
 delphic_amphictyony_title:0 "Statut de Delphes"
 delphic_amphictyony_desc:0 "Cité éponyme de l'Amphictyonie delphique, Delphes est la demeure de la Pythie et de son imposant trésor, alimenté par les dons des membres de l'Amphictyonie.\n\nAprès une journée entière de discussions avec les prêtres de Delphes, une procession vers le temple d'Apollon, des ablutions rituelles, la présentation d'offrandes et des sacrifices au dieu du soleil, [zeal_thinker.GetName], l'un de nos grands prêtres et le principal conseiller de [ROOT.GetCountry.GetRuler.GetName], fut autorisé à pénétrer dans le sanctuaire intérieur de la Pythie et à la consulter. [zeal_thinker.GetPraenomen] conclut qu'il n'est pas juste que ceux qui adorent le dieu en notre nom servent aussi des maîtres temporels. [zeal_thinker.GetSheHe] demande que nous restituions l'autonomie à Delphes afin que ses prêtres puissent se consacrer entièrement aux affaires sacrées. [zeal_thinker.GetPraenomen] fait allusion à de vagues promesses de la Pythie selon lesquelles quiconque libérera le nombril du monde deviendra son maître."
 delphic_amphictyony.a:0 "Cela semble assez raisonnable."
 delphic_amphictyony.at:0 "#E Delphes#! sera libérée comme notre #Y cité de ligue#!"
# delphic_amphictyony.at:0 "#E Delphes#! sera libérée comme notre #Y État temple#!"
 delphic_amphictyony.b:0 "La Pythie pourra jouir de son autonomie, mais nous garderons son trésor."
# delphic_amphictyony.at:0 "[GetProvince('(int32)424').GetName] sera libérée comme notre #Y État temple#!"
 delphic_amphictyony.c:0 "Non, Delphes doit servir de capitale à l'Amphictyonie delphique."
 delphic_amphictyony_capital:0 "Un certain nombre de pops ayant la culture et la religion de l'État apparaîtront à [GetProvince('(int32)424').GetName]."
 delphic_amphictyony.d:0 "Delphes n'est qu'un autre membre de notre Grande Amphictyonie"
 
 form_indo_parthia:0 "Former l'Indo-Parthie"
 form_indo_parthia_desc:0 "Une grande partie de l'Est est plongée dans le chaos et l'anarchie depuis les invasions des Sakas et des Yuezhis, ce qui a contraint la Parthie à laisser bon nombre de ses territoires orientaux livrés à eux-mêmes. L'un des gouverneurs parthes, en particulier, est devenu ambitieux : il a conquis les villes de l'Indus et a émis sa propre monnaie. Peut-être est-il temps pour ce gouverneur de se détacher officiellement de ses suzerains de nom et de proclamer un royaume indo-parthe indépendant."
 formable_not_indo_parthia_exists:0 "#Y Indo-Parthia#! n'existe pas."

