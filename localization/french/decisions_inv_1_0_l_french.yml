 cyr_libyan_influences:0 "La Cité gréco-libyenne"
 desc_cyr_libyan_influences:0 "Depuis longtemps les colons grecs et les indigènes libyens vivent côte à côte dans cette cité."
 cyr_treasure_serpent_of_slonta:0 "Le Grand Serpent libyen"
 cyr_treasure_serpent_of_slonta_desc:0 "Un magnifique relief en pierre représentant un serpent, créé par les anciens Libyens en hommage à leurs dieux-serpents."
 cyr_silted_harbour:0 "Port ensablé"
 desc_cyr_silted_harbour:0 "La lagune naturelle qui sert de port à cette ville est ensablée, ce qui rend difficile l'accostage des navires."

 embellish_suebi_grave_fields:0 "Embellissez les champs de sépulture de Suebian"
 embellish_suebi_grave_fields_desc:0 "De nombreux guerriers morts ont été inhumés dans les tombes de #Y Laciburaium#!, leurs familles allongées à côté d'eux et leurs esprits ont été relâchés dans l'au-delà lors de cérémonies de crémation élaborées. Ils nous ont tous bien servis, chacun à leur manière. Leurs lieux de repos définitifs ont été abandonnés pendant des décennies et sont maintenant dans un état déplorable. \nLeurs esprits libérés peuvent nous regarder avec bienveillance depuis l'au-delà - si nous embellissons et restaurons leurs tombes. Les morts méritent d'être commémorés pour les actes qu'ils ont accomplis."
 chaukia_terp:0 "Le Terp d'Amsivaria"
 chaukia_terp_desc:0 "Les conditions de construction d'un terp en [GetProvince('(int32)3836').GetName] sur l'exemple des Frisons sont idéales. Cela donnera à notre peuple plus de terres sur lesquelles vivre, car il s'agit d'un monticule d'habitation artificiel créé pour fournir un sol sûr pendant les ondes de tempête, les marées hautes et les inondations de la mer ou des rivières."

 # Rutabega Random Stuff

 form_salluvian_confederacy:0 "Former la confédération salluvienne"
 form_salluvian_confederacy_desc:0 "Née au IIe siècle avant J.-C., la Confédération salluvienne était une organisation tribale lâche regroupant les diverses tribus salluviennes. Cette confédération fut créée en partie pour se protéger des implantations massaliotes envahissantes. Mais cela ne dura pas, car en 121 avant J.-C., les Romains intervinrent entre Salluviens et Massaliotes, saccagèrent la capitale des premiers et soumirent leurs chefs."
 formable_not_salluvian_confederacy_exists:0 "La #Y Confédération salluvienne#! n'existe pas."
 form_salluvia_claims_tooltip:0 "La #Y Confédération salluvienne#! obtiendra des revendications sur la région de #Y Gaule transalpine#!."
 SALLUVIA_NAME:0 "Confédération salluvienne"
 SALLUVIA_ADJECTIVE:0 "salluvien"

 form_bastetania:0 "Unir la Bastétanie"
 form_bastetania_desc:0 "Les diverses tribus des Bastétans ont toujours vécu séparées les unes des autres. Mais unir nos terres assurerait la prospérité de notre peuple et nous ferait prospérer, peut-être même davantage que les Puniques avec lesquels nous sommes si souvent en contact."
 form_bastetania_claims_tooltip:0 "La Confédération bastétane obtiendra des revendications sur les régions de #Y Bétique#! et #Y Contestanie#!."
 formable_not_bastetania_exists:0 "#Y Bastétanie#! n'existe pas."
 BASTETANIA_NAME:0 "Bastétanie"
 BASTETANIA_ADJECTIVE:0 "bastétan"
 inherit_bastetania_provinces_tooltip:1 "Toute province #Y sujet#! requise pour former la Bastétanie sera annexée."

 form_attica:0 "Former l'Attique"
 form_attica_desc:0 "Depuis des siècles, la péninsule attique et ses îles environnantes sont dominées par Athènes, qui fut un temps la cité grecque la plus puissante et la plus influente. Mais ce n'était pas toujours le cas ; nous nous souvenons d'une époque où l'Attique était encore divisée entre de nombreuses cités, Eleusis, Thorikos, Rhamnous et Mégare pour n'en nommer que quelques-unes. Compte tenu des fortunes changeantes des cités grecques depuis l'essor des Diadoques, il serait sage de chercher à unir nos proches, même si nous avons pu être divisés par le passé."
 form_attica_claims_tooltip:0 "L'Attique obtiendra des revendications sur la province de #Y Attique#!."
