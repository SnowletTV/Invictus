#Phocia
 PH2:0 "$PHOCIAN_CONFEDERATION$"
# PHOCIAN_CONFEDERATION:0 "Phocian Confederation"
 PHOCIAN_CONFEDERATION:0 "Greater Phocis"
 PHOCIAN_ADJECTIVE:0 "Phocian"
 form_phocian_confederation:0 "Unite Greater Phocis"
 form_phocian_confederation_desc:0 "Seeming to first unify in the face of the Persian army during the Second Greco-Persian War, the Phocian Confederation was a unification of similarly-minded towns in the cultural region centralized around Delphi and Elatea. The members of the Confederation used the religious and cultural importance of their homeland to vie for political aims in the surrounding region, actively seeking out conflict for territorial gain at the expense of its more resource-rich terrain. Before its humbling by Phillip, the Phocian Confederation acted as a counterbalance to the Boeotian League which constantly threatened its existence."
 form_phocian_confederation_claims_tooltip:0 "#E Greater Phocia#! will gain Claims on the Areas of #Y $thessaly_area$#!, #Y $boeotia_area$#! and #Y $aetolia_area$#!."
 formable_not_phocian_confederation_exists:0 "#Y Greater Phocia#! must NOT exist."

#Locrian League
 LO2:0 "$LOCRIAN_LEAGUE$"
 LOCRIAN_LEAGUE:0 "La Grande Locris"
 form_locrian_league:0 "Unifier les Locriens"
 form_locrian_league_desc:0 "Les Locriens se disent descendants de Deucalion, le descendant de Prométhée, par l'intermédiaire du légendaire Locrus lui-même. On dit qu'ils furent les premiers « Hellènes ». Au cours des millénaires qui ont suivi leur arrivée en Grèce, le peuple locrien s'est dispersé, s'étendant sur toute la largeur de la mer Ionienne et s'étendant jusqu'en Italie. Peut-être est-il temps que les enfants de Locrus se réunissent sous un seul État : le nôtre…"
 form_locrian_league_claims_tooltip:0 "#E Greater Locris#! obtiendra des droits sur les zones de #Y $croton_area$#!, #Y $boeotia_area$#! et #Y $aetolia_area$#!."
 formable_not_locrian_league_exists:0 "#Y Greater Locris#! ne doit PAS exister."
#Variant for Italiote Locrians
 form_locrian_league_italian:0 "Unifier les Locriens"
 form_locrian_league_italian_desc:0 "Les Locriens se disent descendants de Deucalion, le descendant de Prométhée, par l'intermédiaire du légendaire Locrus lui-même. On dit qu'ils furent les premiers « Hellènes ». Au cours des millénaires qui ont suivi leur arrivée en Grèce, le peuple locrien s'est dispersé, s'étendant sur toute la largeur de la mer Ionienne et s'étendant jusqu'en Italie. Peut-être le moment est-il venu pour les enfants de Locrus de se réunir sous un seul État : le nôtre…"

 form_greater_armenia:0 "Une Grande Arménie"
 form_greater_armenia_desc:0 "Les territoires et les peuples de l'Arménie sont désormais placés sous notre direction forte et compétente. Nous devons à présent étendre notre influence et rassembler nos voisins sous la bannière d'un État de la Grande Arménie."
 GREATER_ARMENIA_NAME:0 "Grande Arménie"
 GREATER_ARMENIA_ADJECTIVE:0 "Arménien" 
 greater_armenia_not_exists:0 "#Y Greater Armenia#! ne doit PAS exister."
