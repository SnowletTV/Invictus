 LESSER_SCYTHIA_NAME:0 "Lesser Scythia"
 LESSER_SCYTHIA_ADJECTIVE:0 "Scythian"
 form_scythia:0 "Form Scythia"
 form_scythia_desc:0 "The Scythians are a fierce and independent people, known for their prowess as warriors and masters of the steppes. The time has come to unite the tribes of Scythia under one banner, bringing strength and stability to these lands. From here, we shall protect our way of life and, if necessary, expand to secure our borders from potential threats in all directions."
 formable_not_scythia_exists:0 "#Y Scythia#! does not exist."
 form_lesser_scythia_claims_tooltip:0 "#E Scythia#! will gain Claims on the Areas of #Y $borysthenia_minor_area$#! and #Y $borysthenia_area$#!."

 form_hellespontine_phrygia:0 "Form Hellespontine Phrygia"
 form_hellespontine_phrygia_desc:0 "Established at the beginning of the fifth century BCE, Hellespontine Phrygia was ruled by descendants of Pharnaces, an uncle of King Darius I the Great, with its capital located at Dascylium. During the campaign of Alexander the Great in 334 BCE, the satrap of Hellespontine Phrygia, Arsites, suffered a decisive defeat at the Battle of the Granicus River, after which he committed suicide. Alexander appointed Calas as his successor. Following Alexander's death in 323 BCE, the satrapy was awarded to Leonnatus, a member of the royal house of Lyncestis in Macedonia and one of Alexander's trusted bodyguards. Leonnatus entertained ambitions beyond his satrapy; he sought marriage with Cleopatra, Alexander's sister, a move that could have strengthened his claim to power. Had he defeated the Athenians, Leonnatus may very well have attempted to seize the Macedonian throne for himself. His career was cut short during the Lamian War, where he led a force of 20,000 infantry and 1,500 cavalry to relieve Antipater during the siege of Lamia. Leonnatus was killed in the battle, leaving his aspirations unfulfilled. Control of the satrapy then passed to Arrhidaeus, who held it until the Partition of Triparadisus (321 BCE), after which Clitus the White was assigned as satrap. Clitus' rule was brief. He was defeated and killed in 317 BCE by Arrhidaeus. His successor, Ardys, governed for an uncertain period before power shifted again. Phoenix of Tenedos, a loyal subordinate of Antigonus, governed the region for a time, followed by Antigonos' nephew Polemaios, another of Antigonus' generals. However, after the compelled suicide of Polemaios, the satrapy has been defunct."
 hellespontine_phrygia_claims_tooltip:0 "Hellespontine Phrygia will gain Claims on the Regions of #Y $asia_region$#! and #Y $bithynia_region$#!."
 formable_not_hellespontine_phrygia_exists:0 "#Y Hellespontine Phrygia#! must NOT exist."
 HPP:0 "$HELLESPONTINE_NAME$"
 HELLESPONTINE_NAME:0 "Hellespontine Phrygia"
 HELLESPONTINE_ADJECTIVE:0 "Hellespontine"
 
