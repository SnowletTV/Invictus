l_french:

 #modifiers
 flood_initial_damage:0 "Inondation"
 desc_flood_initial_damage:0 "Une inondation a détruit les moyens de subsistance de nombreux habitants."
 flood_reduced_damage:0 "Inondation"
 desc_flood_reduced_damage:0 "Une inondation a détruit les moyens de subsistance de quelques habitants."
 hit_by_avalanche:0 "Frappé par une avalanche"
 desc_hit_by_avalanche:0 "Ce territoire a récemment subi une avalanche. Les destructions sont encore visibles en de nombreux endroits."
 the_land_slides_into_your_dms:0 "Glissement de terrain"
 desc_the_land_slides_into_your_dms:0 "Un glissement de terrain a bloqué les routes et détruit plusieurs bâtiments. Il n'est pas facile de traverser la région, surtout lorsque les habitants s'affairent à sauver leurs moyens de subsistance."
 grow_a_pear:0 "Sécheresse"
 desc_grow_a_pear:0 "Cette région est touchée par une sécheresse. Faute d'eau, personne ne peut manger ni boire à sa faim et tous risquent de mourir."
 sand_up_comedy:0 "Tempête de sable du siècle"
 desc_sand_up_comedy:0 "Une tempête de sable est passée et ses ravages sont encore visibles."
 jizz_storm:0 "Tempête de neige du siècle"
 desc_jizz_storm:0 "La pire tempête de neige depuis des générations s'est abattue sur cette région."
 i_bet_you_wish_you_had_my_water:0 "Partage des réserves d'eau"
 desc_i_bet_you_wish_you_had_my_water:0 "Les réserves d'eau, déjà rares, ont dû être partagées avec un autre territoire, rendant cette région moins productive et mécontente."
 light_locust_plague:0 "Essaim de criquets"
 desc_light_locust_plague:0 "Un essaim de criquets a été aperçu. Il dévore tout ce qu'il peut, mais semble encore maîtrisable."
 locust_plague:0 "Invasion de criquets"
 desc_locust_plague:0 "Les criquets ont dévoré tout ce qui pousse ici ; il ne reste pas une feuille."
 locust_plague_non_plant:0 "Invasion de criquets"
 desc_locust_plague_non_plant:0 "Les criquets ont dévoré tout ce qui pousse ici ; il ne reste pas une feuille."
 desert_sandstorm: "Tempête de sable dans le désert"
 desc_desert_sandstorm: "Les vents du désert ont déchaîné de cruelles tempêtes de sable dans cette colonie."
 
 #tooltips
 disasters_inv_destroyed_building:0 "Un bâtiment peut être détruit."
 disasters_inv_8_a_1:0 "La sécheresse peut encore s'étendre."
 disasters_inv_8_a_2:0 "La sécheresse pourrait bientôt prendre fin."
 disasters_inv_8_b:0 "Cette option est disponible car votre dirigeant est miséricordieux, déchu, arbitraire ou fou."
 anti_locust_power_tt:0 "Les criquets pourraient #G ne pas essaimer#! davantage si vous agissez #R maintenant#!."
 locusts_spreading_tt:0 "Les criquets #R se propagent#! à tous les territoires limitrophes de [we_are_hungry.GetName], puis au-delà, champ après champ, colonie après colonie. \nCes territoires obtiennent le modificateur suivant si une ressource commerciale liée aux #G plantes#! y est produite."
 locusts_spreading_2_tt:0 "S'il s'agit d'une ressource commerciale #G non végétale#!, elle recevra ce modificateur."
 locusts_spreading_3_tt:0 "Les territoires limitrophes ne sont pas encore aussi durement touchés... pour l'instant ?"
 disaster_spread_chance_tt:0 "Cette catastrophe peut s'étendre"
 
 #event locs
 disasters_inv.1.t:0 "Inondations à [the_day_after.GetName]"
 disasters_inv.1.desc:0 "Les niveaux des eaux à [the_day_after.GetName] se sont élevés à des hauteurs sans précédent ! Nombreux sont ceux qui ont fui leurs demeures, abandonnant leurs biens dans l'espoir d'échapper au sinistre, mais beaucoup ont déjà péri et nous craignons que le bilan ne s'alourdisse. Nul ne saurait s'en étonner: la production dans la région est tombée à un niveau fort bas ; le fleuve qui apportait autrefois la prospérité à [the_day_after.GetName] n'apporte désormais que ruine et désolation."
 disasters_inv.1.a:0 "Nous devons préparer les régions avoisinantes."
 disasters_inv.1.b:0 "Hélas ! Qu'il en soit ainsi..."
 disasters_inv.2.t:0 "L'inondation s'étend"
 disasters_inv.2.desc:0 "Le cauchemar se poursuit, car l'inondation à [the_day_after.GetName] s'est amplifiée et menace à présent les établissements voisins, qui débordaient déjà de réfugiés fuyant le désastre. Le gouverneur local rapporte toutefois que nous maîtrisons la situation. Bien que les dommages ne soient pas aussi terribles que nous l'avions craint, il faudra du temps avant que la région ne recouvre toute son activité. Pis encore, le nombre d'habitants a diminué, ce qui signifie que la productivité sera affectée."
 disasters_inv.2.a:0 "Que les dieux aient pitié de nous."
 disasters_inv.3.t:0 "Les inondations se retirent"
 disasters_inv.3.desc:0 "Enfin, l'inondation se retire. Bien que nous ayons perdu bien des choses, l'espoir persiste encore - notre peuple s'avère véritablement indomptable. Les habitants de [the_day_after.GetName] commencent à revenir et reconstruisent leurs demeures. Il faudra fort longtemps avant que [the_day_after.GetName] ne recouvre pleinement son ancien état ; beaucoup d'ouvrage demeure, mais grâce aux dieux, le peuple luttera. Prions pour que nul pareil événement ne se reproduise."
 disasters_inv.3.a:0 "Le pire est derrière nous."
 disasters_inv.4.t:0 "Une avalanche"
 disasters_inv.4.desc:0 "Nous avons reçu nouvelles d'un terrible malheur ! Une avalanche s'est abattue sur [snowball.GetName] et a causé de grands dégâts aux vies et aux biens ; les routes locales sont impraticables, tant la masse de neige tombée est considérable, et l'on rapporte que les infrastructures ont subi des ravages. Tant que [snowball.GetName] ne sera pas reconstruite, rares seront ceux qui souhaitent y vivre ou y travailler. \nNon loin de là, une autre avalanche s'est récemment produite. Seraient-elles liées ? Si le peuple venait à croire ces terres maudites, nul ne voudrait jamais y demeurer. Qu'est-ce donc qui provoque ces avalanches ? Raconte-t-on que les vibrations peuvent en déclencher une - les cris d'aide doivent certes être pris en compte."
 disasters_inv.4.a:0 "Que leurs âmes trouvent la paix éternelle."
 disasters_inv.5.t:0 "Un glissement de terrain"
 disasters_inv.5.desc:0 "Malheur sur malheur ! Nous recevons de terribles nouvelles de [mudstick.GetName], qui souffre d'intempéries. Il pleut depuis des semaines, et l'on rapporte qu'un formidable glissement de terrain a ruiné la campagne environnante. Tenaces comme toujours, les habitants locaux s'efforcent de se secourir mutuellement et ensevelissent leurs morts, mais l'ampleur du problème surpasse leurs maigres ressources. Le passage par le territoire s'est fait malaisé pour tout voyageur, tarrissant le commerce, et les bâtiments brisés et couverts de boue sont fort déplaisants à contempler. Quelque chose doit être entrepris."
 disasters_inv.5.a:0 "Nous devons nous préparer au pire !"
 disasters_inv.5.b:0 "Hélas ! Qu'il en soit ainsi..."
 disasters_inv.6.t:0 "Une deuxième vague"
 disasters_inv.6.desc_1:0 "Ce matin, un autre glissement de terrain a frappé [mudstick.GetName]. Cependant, vous serez heureux d'apprendre que nos préparatifs ont porté fruit et qu'aucune perte substantielle n'a été subie. Le peuple est reconnaissant d'avoir un chef si sage et bienveillant, qui chérit également tous les habitants de notre empire."
 disasters_inv.6.desc_2:0 "Nous aurions dû être plus prudents après les premiers glissements. Peut-être ainsi n'affronterions-nous pas un problème encore plus grand à présent. Comme prédit, un autre glissement a causé ravage en la région, entraînant davantage de pertes de vies. Bien que les vies des habitants de [mudstick.GetName] ne soient pas aussi précieuses que celles de notre peuple, nous ne pouvons nous permettre de les gaspiller."
 disasters_inv.6.a:0 "Heureusement, nous étions préparés"
 disasters_inv.6.b:0 "La patience est une vertu qui nous fait défaut."
 disasters_inv.7.t:0 "Sécheresse à [i_am_thirsty.GetName]"
 disasters_inv.7.desc:0 "[i_am_thirsty.GetName] subit une période de raréfaction de l'eau extrême. Le sol est desséché, gonflé et crevassé, rendant l'agriculture quasi impossible, et les marchands commencent à délaisser la région, sachant qu'il n'y feront point bon profit en ces marchés désertés. L'eau s'est faite si rare que les premiers combats pour sa possession ont éclaté - l'on rapporte que des foules gardent les puits qui se tarissent en leurs villages, s'assurant qu'aucun étranger ne dérobe ce qui jadis était librement donné. Heureusement, la région environnante possède encore des ressources en eau que nous pourrions ordonner de partager - cela mécontenterait fort nombreux, toutefois. Nous devons décider ce que nous favorisons."
 disasters_inv.7.a:0 "Nous devons aider nos sujets !"
 disasters_inv.7.b:0 "Qui s'en soucie ?"
 disasters_inv.8.t:0 "Famine"
 disasters_inv.8.desc:0 "Vous avez reçu de fâcheuses nouvelles qui ont assombri votre humeur. La sécheresse originaire de [i_am_thirsty.GetName] s'est mise à affecter toute la région et s'est transformée en famine. Le prix du pain a quadruplé, quand on peut le trouver, et un lucratif marché noir prospère pour les vivres volés malgré nos plus vigoureux efforts pour l'éradiquer. Les paysans affamés se tournent vers le brigandage, aggravant la situation. L'absence d'eau tue tout et chacun ; même les chameaux, ces bêtes si robustes, n'en sont point exempts. Nulle bonne nouvelle ne s'y trouve."
 disasters_inv.8.a:0 "Que les dieux nous prennent en pitié. #RNGesus s'il vous plaît#"
 disasters_inv.8.b:0 "J'ai changé d'avis."
 disasters_inv.9.t:0 "La tempête du siècle"
 disasters_inv.9.desc:0 "Une terrible tempête originaire de [stormy_mommy.GetArea.GetRegion.GetName] s'est abattue sur [stormy_daniels.GetName] et a causé d'immenses dévastations. Les navires ont sombré dans les ports, impuissants face à la fureur des flots qui charrient désormais les dépouilles de marins noyés sur nos rives. Nombreux sont ceux qui pleurent leurs proches emportés par le malheur, parcourant les plages en quête de leurs biens-aimés. Cependant, les habitants de [stormy_daniels.GetName] se sont ralliés pour surmonter cet événement terrible et reconstruire leur cité ; ils sont une source d'inspiration pour nous tous."
 disasters_inv.9.a:0 "Les dieux demeurent capricieux."
 disasters_inv.10.t:0 "Le vent des dieux"
 disasters_inv.10.desc:0 "La tempête de sable originaire de [sandman_daddy.GetArea.GetRegion.GetName] s'est abattue sur [sandman.GetName], infligeant de grandes souffrances aux habitants qui doivent la supporter. La tempête entrave tout mouvement et la milice locale se trouve impuissante à aider les résidents. Chacun s'est retranché où il se trouvait, attendant que les sables maudits cessent de souffler. Face à ce terrible désastre, les habitants de [sandman.GetName] se sont cependant ralliés, jurant de récupérer ce qui a été emporté par les vents."
 disasters_inv.10.a:0 "Les dieux demeurent capricieux."
 disasters_inv.11.t:0 "La tempête de neige"
 disasters_inv.11.desc:0 "La violente tempête de neige originaire de [snow_daddy.GetArea.GetRegion.GetName] a surpris les habitants robustes de [not_snowden.GetName], habitués à de telles conditions ; même les anciens ne se souviennent d'un hiver aussi terrible. La tempête entrave tous les déplacements ; pas même les plus robustes des mules ne peuvent traverser l'épaisse couche de neige qui recouvre le territoire. Les habitants de [not_snowden.GetName] demeurent retranchés dans leurs demeures, s'efforçant de ne pas succomber au froid. Cela a entraîné l'arrêt complet de toute production, hormis les tâches les plus essentielles."
 disasters_inv.11.a:0 "Les dieux demeurent capricieux."
 disasters_inv.12.t:0 "Essaim de criquets aperçu"
 disasters_inv.12.desc:0 "Un essaim de criquets a été aperçu en [we_are_hungry.GetName]. Leur nombre est si considérable qu'on dit que le soleil en serait obscurci lors de leur passage, bien que ce ne soit probablement qu'une exagération. Néanmoins, les rapports sont alarmants : ils ont dévoré tout ce qu'ils ont trouvé sur leur passage, progressant de champ en champ, de village en village. Nous devons surveiller la situation de près, mais pour l'instant, cela ne semble pas être un véritable désastre."
 disasters_inv.12.a:0 "Nous devons agir maintenant, pendant qu'il en est encore temps."
 disasters_inv.12.b:0 "Ce ne sont que quelques bestioles."
 disasters_inv.13.t:0 "L'essaim de criquets grandit"
 disasters_inv.13.desc:0 "Nous sommes envahis par une armée d'insectes ! L'essaim d'abord aperçu en [we_are_hungry.GetName] s'est propagé aux villages voisins, dévastant l'approvisionnement alimentaire. Les fermiers affligés supplient votre aide, mon [ROOT.GetCountry.GetRulerTitle] ; le désarroi transparaît dans chaque message que nous recevons."
 disasters_inv.13.a:0 "Nous devons agir, présent !"
 disasters_inv.13.b:0 "Ils ne savent rien."
 disasters_inv.14.t:0 "Le fléau des criquets"
 disasters_inv.14.desc:0 "L'essaim de criquets originaire de [we_are_hungry.GetName] s'est grossi davantage - la vaste horde s'est même scindée en plusieurs plus petites, toutes en quête de nourriture. Chaque établissement aux alentours de [we_are_hungry.GetName] a été vidé de toute matière végétale. Certains récits que vous avez entendu défient toute raison ; des gens quittant leurs demeures se retrouvent avec les vêtements littéralement dévorés de leurs dos. Le bétail, les hommes, la faune - tous et chacun souffrent de famine, et certains en périssent. Nous devons trouver une solution présent, si nous voulons voir l'hiver prochain."
 disasters_inv.14.a:0 "Mieux vaut tard que jamais."
 disasters_inv.14.b:0 "Nous le surmonterons tel quel."
 disasters_inv.15.t:0 "Les criquets ont disparu"
 disasters_inv.15.desc:0 "Les plus récents rapports en provenance de [we_are_hungry.GetName] et la région environnante indiquent que les criquets ont pour l'essentiel disparu. Le danger d'un fléau de criquets ne pend plus, mais il faudra un certain temps avant que la région ne recouvre entièrement. Espérons que les créatures maudites demeurent désormais dans les terres de nos ennemis... que jamais elles ne reviennent !"
 disasters_inv.15.a:0 "Enfin !"