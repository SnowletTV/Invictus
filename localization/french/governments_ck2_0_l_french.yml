l_french:
 spartan_monarchy:0 "Diarchie spartiate"
 spartan_monarchy_desc:0 "Deux rois sont mieux qu'un. -Proverbe laconique"
 #spartan_monarchy_desc:0 "The Spartans have always been governed by two kings rather than one, both families sharing Heraclian ancestry."
 spartan_imperial_cult:0 "Culte impérial spartiate"
 spartan_imperial_cult_desc:1 "Dans certaines cultures, l'empereur ou l'impératrice détient une telle autorité qu'il est considéré comme le messager des dieux, si ce n'est une divinité incarnée."
 spartan_imperium:0 "Empire spartiate"
 spartan_imperium_desc:0 "Un empereur possède le pouvoir absolu sur l'État, et est le plus souvent le souverain de rois et de princes de moindre rang."
 ###EVENT 2: Spartan Flavor Event to start the game off
 spartan_event.2.t:0 "Alexandre le terrible"
 spartan_event.2.desc:0 "À Babylone, il y a 18 ans, le roi Alexandre mourut subitement à l'âge de 32 ans, brisant son empire nouvellement conquis. Depuis son père, le roi Philippe, les Macédoniens se sont levés pour devenir l'hégémon de tous les Grecs, sauf nous, les Spartiates. Cette défiance n'a jamais été oubliée par les Macédoniens, et Alexandre le Grand nous a humiliés diplomatiquement, puis militairement, à la bataille de Mégalopolis. Nous restons indépendants, mais les dieux se sont moqués de nous avec leur sens de l'humour tordu.\n\nLa perte de Messène et des Ilotes montre au monde grec que notre propre patrie n'est pas en ordre, ainsi notre héritage spartiate perd lentement sa crédibilité. La plupart des Grecs se souviendront de notre absence dans la campagne de Perse et de notre campagne ratée contre les Macédoniens. Cependant, comme les Diadoques se concentrent sur les guerres internes entre eux, nous avons une petite fenêtre d'opportunité pour réformer, adapter et restaurer l'ordre ancien.\n\nFils d'Héraclès, nous nous relèverons par Hadès !"
 spartan_event.2.a:0 "Molon Labe!"
### Spartan Kings
###EVENT 3: New Spartan Ruler Flavor Event
 spartan_event.3.t:0 "La mort du Basileus"
 spartan_event.3.desc:0 "Terribles nouvelles ce matin, [ROOT.GetCountry.GetRulerTitle] [SCOPE.sChar('old_spartan_king').GetPraenomen] de la famille [SCOPE.sChar('old_spartan_king').GetFamilyDisplayName] a traversé le Styx. La famille [ROOT.GetCountry.GetCoRuler.GetFamilyDisplayName], en apprenant la nouvelle, s'est jointe à la famille [SCOPE.sChar('old_spartan_king').GetFamilyDisplayName] pour leur dernier adieu. Alors que la cité de Sparte est silencieuse en ce jour de deuil, le suivant marquera un nouveau départ, un nouveau [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetFamilyDisplayName], et ensemble avec les [ROOT.GetCountry.GetCoRuler.GetFamilyDisplayName], Sparte continuera l'héritage Héracléen."
 spartan_event.3.a:0 "Ce soir il festoie en Hadès."
###EVENT 4: New Spartan Ruler Flavor Event - If co-ruler was the primary heir
 spartan_event.4.t:0 "L'éclipse royale"
 spartan_event.4.desc:0 "Aussi rare que la visite d'un des dieux, la perception de qui est la famille royale dominante a changé. Bien qu'ils soient égaux, partageant le sang Héraclien, les [SCOPE.sChar('old_ruler').GetFamilyDisplayName] étaient traditionnellement considérés comme étant le plus important des deux. C'était le résultat de l'héritage familial, des personnages célèbres et des héros d'antan. Cependant cela a changé, la perception qu'ont les gens de la famille la plus importante a été bouleversée, et ceci n'est pas surprenant puisque les [ROOT.GetCountry.GetRuler.GetFamilyDisplayName] ont engendré de nombreux grands dirigeants et héros de ces dernières années, éclipsant effectivement l'autre famille"
 spartan_event.4.a:0 "Premier entre pairs !"
###EVENT 5: New Spartan Co-Ruler Flavor Event
 spartan_event.5.t:0 "La mort du co-Basileus"
 spartan_event.5.desc:0 "Terribles nouvelles ce matin, [ROOT.GetCountry.GetCoRulerTitle] [SCOPE.sChar('old_co_ruler').GetPraenomen] de la famille [SCOPE.sChar('old_co_ruler').GetFamilyDisplayName] est parti en Hadès. La famille [ROOT.GetCountry.GetRuler.GetFamilyDisplayName], en apprenant la nouvelle, s'est jointe à la famille [SCOPE.sChar('old_co_ruler').GetFamilyDisplayName] pour honorer sa mémoire. Aujourd'hui la cité de Sparte est restée silencieuse, en deuil de leur défunt [ROOT.GetCountry.GetCoRulerTitle], mais alors que le soleil se lève, un nouveau jour et un nouveau [ROOT.GetCountry.GetCoRulerTitle] [ROOT.GetCountry.GetCoRuler.GetFamilyDisplayName] accède au trône. Ensemble avec la famille [ROOT.GetCountry.GetRuler.GetFamilyDisplayName] ils dirigeront Sparte désormais, et poursuivront son héritage Héracléen."
 spartan_event.5.a:0 "Ce soir il festoie en Hadès."

 punic_republic:0 "République punique"
 punic_republic_desc:0 "Un système de gouvernance hybride avec séparation des pouvoirs, deux dirigeants élus et de fortes institutions oligarchiques et ploutocratiques."

 rhodian_dictatorship:0 "Dictature rhodienne"
 rhodian_dictatorship_desc:0 "Une forme de gouvernement totalitaire, la dictature place le pouvoir politique entre les mains d'un seul individu. Les habitants de Rhodes ont placé leur destin entre les mains d'un seul homme."
 rhodian_dictatorship_ruler:0 "Tyran"
 rhodian_dictatorship_ruler_female:0 "Tyran"
 rhodian_dictatorship_consort:0 "$title_consort$"

##change 
 tyrannic_monarchy_event.1.t:0 "La mort d'un tyran"
 tyrannic_monarchy_event.1.desc:0 "Ce matin, de tristes nouvelles sont arrivées. Le médecin de [SCOPE.sChar('old_tyrant_king').GetPraenomen] a informé la cour que [SCOPE.sChar('old_tyrant_king').GetSheHe] décéderait dans les prochaines heures. Sachant que [SCOPE.sChar('old_tyrant_king').GetSheHe] quitterait bientôt ce monde, tous les [ROOT.GetCountry.GetRuler.GetFamilyDisplayName] résidant à [ROOT.GetCountry.GetCapital.GetName] sont entrés dans la chambre de [SCOPE.sChar('old_tyrant_king').GetPraenomen] pour rendre leurs derniers hommages. Alors que [SCOPE.sChar('old_tyrant_king').GetName] tirait son dernier souffle, [SCOPE.sChar('old_tyrant_king').GetSheHe] renvoya tout le monde, même son médecin, pour pouvoir confier ses dernières volontés à [SCOPE.sChar('old_tyrant_heir').GetName].\n\nAprès la mort du [ROOT.GetCountry.GetRulerTitle], le peuple de [ROOT.GetCountry.GetCapital.GetName] était accablé de chagrin. Le peuple pleurait feu le [ROOT.GetCountry.GetRulerTitle], mais est certain que le jour suivant marquera un nouveau commencement. À présent, après une période de deuil respectable, [SCOPE.sChar('old_tyrant_heir').GetPraenomen] annoncera les dernières paroles de [SCOPE.sChar('old_tyrant_king').GetPraenomen] au peuple [ROOT.GetCountry.GetAdjective]. « [SCOPE.sChar('old_tyrant_heir').GetPraenomen], tu dois... »"
# tyrannic_monarchy_event.1.a:0 "'Restituer le pouvoir au peuple.'" 
 tyrannic_monarchy_event.1.b:0 "'Enrichir les soldats, mépriser tous les autres.'"
 tyrannic_monarchy_event.1.c:0 "'Abandonner le titre de tyran et revendiquer formellement le trône [ROOT.GetCountry.GetAdjective].'" 
 tyrannic_monarchy_event.1.ct:0 "La famille [SCOPE.sChar('old_tyrant_heir').GetFamilyDisplayName] gouvernera désormais en tant que rois." 
 tyrannic_monarchy_event.1.d:0 "'Sachez que le règne de [ROOT.GetCountry.GetName] appartient au plus fort!'"
 tyrannic_monarchy_event.1.dt:0 "Un personnage ayant une haute statistique Martiale remettra en question le droit de [SCOPE.sChar('old_tyrant_heir').GetName] à gouverner et tentera d'usurper le trône [COUNTRY.GetAdjective]."


 tyrannic_monarchy_event.2.t:0 "Death of a Tyrant: Succession"
 tyrannic_monarchy_event.2.desc:0 "As the tyrant [SCOPE.sChar('old_tyrant_king').GetName], breathed [SCOPE.sChar('old_tyrant_king').GetHerHis] last, [SCOPE.sChar('old_tyrant_king').GetPraenomen] declared that 'Rule of [ROOT.GetCountry.GetName] belongs to the strongest,' clearly viewing [SCOPE.sChar('old_tyrant_heir').GetPraenomen] as an unworthy heir. There is always treasonous talk at such times, but now possible successors circle like vultures. The enthusiasm and ambition of [SCOPE.sChar('tyrant_plotter').GetName] has set [SCOPE.sChar('tyrant_plotter').GetHerHim] apart among the other pretenders.\n\nRather than risk years of ineffective rule under a dotard like [SCOPE.sChar('old_tyrant_heir').GetPraenomen], [SCOPE.sChar('tyrant_plotter').GetName] suggests acting now to ensure we have a strong and capable ruler, clearly indicating that [SCOPE.sChar('tyrant_plotter').GetSheHe] is the one for the job.\n\nDangerous talk to be sure, but [SCOPE.sChar('tyrant_plotter').GetSheHe] may have a point. Can we afford to pass up an opportunity like this?"
 tyrannic_monarchy_event.2.a:0 "Leadership does not become [SCOPE.sChar('tyrant_plotter').GetHerHim]."
 tyrannic_monarchy_event.2.b:0 "We will look the other way..."
 tyrannic_monarchy_event.2.bt:0 "[SCOPE.sChar('tyrant_plotter').GetName] will attempt to depose [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]."

 tyrannic_monarchy_event.3.t:0 "Death of a Tyrant: Ascension"
 tyrannic_monarchy_event.3.desc:0 "The plot to remove the [ROOT.GetCountry.GetRulerTitle] [SCOPE.sChar('old_tyrant_heir').GetName] has finally been fully realized, with support secured across the government and aristocracy. [SCOPE.sChar('old_tyrant_heir').GetName], who leads the usurpers, marches with a party of loyal soldiers and eminent officials to the palace.\n\n[SCOPE.sChar('tyrant_plotter').GetPraenomen] and his men, aided by [SCOPE.sChar('old_tyrant_heir').GetName]'s disgruntled bodyguards entered the royal bed chambers of [SCOPE.sChar('tyrant_plotter').GetPraenomen] early this morning, issuing a decree that [SCOPE.sChar('tyrant_plotter').GetHerHis] actions were necessary for the sake of all [ROOT.GetCountry.GetName] and for the protection of its people.\n\nWe must now witness whether our tacit consent for the coup and the accession of [SCOPE.sChar('tyrant_plotter').GetName] was the best decision after all..."
 tyrannic_monarchy_event.3.a:0 "Send [SCOPE.sChar('old_tyrant_heir').GetName] to the dungeons."
 tyrannic_monarchy_event.3.b:0 "Here ends the [SCOPE.sChar('old_tyrant_heir').GetFamilyDisplayAdjective] dynasty..."
 tyrannic_monarchy_event.3.bt:0 "All members of the [SCOPE.sChar('old_tyrant_heir').GetFamilyDisplayName] will be executed."
 tyrannic_monarchy_event.3.c:0 "[SCOPE.sChar('old_tyrant_heir').GetFamilyDisplayAdjective] rule will endure, albeit with a few changes."
 tyrannic_monarchy_event.3.ct:0 "[SCOPE.sChar('old_tyrant_heir').GetName]'s heir, [SCOPE.sChar('old_tyrant_heir_heir').GetPraenomen], will rule as king, under the watchful eye of [SCOPE.sChar('tyrant_plotter').GetName] and [SCOPE.sChar('tyrant_plotter').GetHerHis] supporters."
 tyrannic_monarchy_event.3.d:0 "On second thought... nice try traitors!"
 tyrannic_monarchy_event.3.dt:1 "A mad melee will ensue between the ruler and plotters. A surviving plotter or the preferred heir will be made ruler.\nThis option is available due to [SCOPE.sChar('old_tyrant_heir').GetName]'s #Y Martial#! skill."

 tyrannic_monarchy_event.4.t:0 "Dark Times"
 tyrannic_monarchy_event.4.desc:0 "The plot to remove [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName], has finally been fully realized, with support secured across the government and aristocracy. [tyrant_usurper.GetName], who leads the usurpers, marches with a party of loyal soldiers and eminent officials to the palace.\n\n[tyrant_usurper.GetPraenomen] and his men, aided by [ROOT.GetCountry.GetRuler.GetName]'s' disgruntled bodyguards entered the royal bed chambers of [tyrant_usurper.GetPraenomen] early this morning, issuing a decree that [tyrant_usurper.GetHerHis] actions were necessary for the sake of all [ROOT.GetCountry.GetName] and for the protection of its people.\n\nWe must now witness whether our tacit consent for the coup and the accession of [tyrant_usurper.GetName] was the best decision after all..."
 tyrannic_monarchy_event.4.a:0 "Send [ROOT.GetCountry.GetRuler.GetName] to the dungeons."
 tyrannic_monarchy_event.4.b:0 "Here ends the [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] dynasty..."
 tyrannic_monarchy_event.4.bt:0 "All members of the [ROOT.GetCountry.GetRuler.GetFamilyDisplayName] will be executed.\nThis option is available because [tyrant_usurper.GetPraenomen] is not related to our ruler."
 tyrannic_monarchy_event.4.c:0 "The [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] line will endure this calamity."
 tyrannic_monarchy_event.4.ct:0 "[ROOT.GetCountry.GetRuler.GetName]'s heir, will rule [ROOT.GetCountry.GetName] as its king, under the watchful eye of [tyrant_usurper.GetName]."
 tyrannic_monarchy_event.4.d:0 "On second thought... nice try traitors!"
 tyrannic_monarchy_event.4.dt:1 "A mad melee will ensue between the ruler and plotters. A surviving plotter or the preferred heir will be made ruler.\nThis option is available due to [ROOT.GetCountry.GetRuler.GetName]'s #Y Martial#! skill."