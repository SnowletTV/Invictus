 #### From Mod - Added Wonders
 
 ### Hellenic ###
 wonder_greek_academy:0 "Académie platonique"
 wonder_greek_academy_DESC:0 "Fondée par Platon, l'École d'Athènes perdura durant l'époque hellénistique comme centre du savoir et de la philosophie grecque. Parmi ses membres célèbres figurent Speusippe, Xénocrate, Aristote, Héraclide, Eudoxe de Cnide et Héraclide du Pont."
 wonder_knossos_palace:0 "Palais de Cnossos"
 wonder_knossos_palace_DESC:0 "L'une des plus anciennes cités d'Europe, Cnossos devint le centre cérémoniel et politique de l'antique civilisation minoenne, désormais l'ombre d'elle-même. Selon les légendes grecques, le roi Minos demeurait jadis au palais, d'où fut bâti le labyrinthe abritant le fameux Minotaure."
 wonder_athenian_acropolis:0 "Acropole d'Athènes"
 wonder_athenian_acropolis_DESC:0 "Antique citadelle-temple dominant la cité d'Athènes, l'Acropole incarne matériellement la gloire et la puissance athéniennes."
 wonder_athena_ilias_temple:0 "Temple d'Athéna Ilias"
 wonder_athena_ilias_temple_desc:0 "Érigé sur les ruines de Troie, le temple d'Athéna Ilias fait l'envie du monde connu."
 wonder_delphi_oracle:0 "Oracle de Delphes"
 wonder_delphi_oracle_desc:0 "À Delphes, nombril du monde marqué en son centre par la pierre sacrée de l'Omphalos, se trouve un oracle connu sous le nom de Pythie. Grands rois comme humbles laboureurs s'y rendent pour entendre Apollon parler par des lèvres mortelles."
 wonder_asklepion_epidauros:0 "Asclépiéion d'Épidaure"
 wonder_asklepion_epidauros_desc:0 "L'Asclépiéion d'Épidaure est depuis longtemps le plus célèbre centre de guérison du monde grec. Son prestige comme haut lieu cultuel égale celui du sanctuaire de Zeus à Olympie et de l'oracle de Delphes."

 wonder_apadana_susa:0 "Apadana de Suse"
 wonder_apadana_susa_desc:0 "Érigé par Darius Ier dans la capitale cérémonielle de l'Empire achéménide, l'Apadana de Suse était une vaste salle d'audience, symbole de l'autorité perse et de son génie architectural."

 wonder_media_temple:0 "Grand temple du Feu"
 wonder_media_temple_desc:0 "Le Grand temple du Feu d'Hagmatana s'éleva de trois étages : le premier sous les Mèdes, le deuxième sous les Perses et le troisième sous les Parthes. Dressé dans la grande cité mède, il représentait la puissance naissante du peuple iranien, qui allait à jamais changer le destin du Croissant fertile et sa riche histoire."
 gw_effect_fire_temple:0 "Grand Temple du Feu"


 ### Punic ###
 wonder_cothon:0 "Grand Cothon de Carthage"
 wonder_cothon_DESC:0 "Le grand cothon de Carthage se divisait en un port marchand rectangulaire, suivi d'un bassin intérieur protégé et d'un arsenal réservé à la flotte. Ce bassin circulaire était ceint d'un anneau de cales sèches pouvant abriter deux cent vingt navires. Au centre se dressait le poste de commandement, surélevé afin que le maître du port pût embrasser toute la baie du regard."
 wonder_numidian_tomb:0 "Tombes numides"
 wonder_numidian_tomb_DESC:0 "Cette tombe fut bâtie comme mausolée pour abriter les dépouilles d'une illustre lignée royale numide."
 wonder_punic_tomb:0 "Tombe punique"
 wonder_punic_tomb_DESC:0 "Antique tombe punique, elle témoigne du respect dû aux morts."
 ### Egyptian ###
 wonder_abu_simbel:0 "Abou Simbel"
 wonder_abu_simbel_DESC:0 "Deux temples monumentaux taillés dans le roc à Abou Simbel, dédiés aux dieux solaires Amon-Rê et Rê-Horakhty en mémoire de la bataille de Qadesh. Jadis, leurs statues colossales gardaient la frontière méridionale de l'Égypte sous Ramsès II."
 ### Mesopotamian ###
 wonder_ur_ziggurat:0 "Grande Ziggourat d'Our"
 wonder_ur_ziggurat_DESC:0 "Ce temple à degrés s'élève vers le royaume des dieux ; bâti par les Sumériens, il fut restauré par les Babyloniens."
 ### Arabian ###
 wonder_marib_dam:0 "Barrage de Ma'rib"
 wonder_marib_dam_DESC:0 "Entre trois montagnes, le grand barrage de Ma'rib fut bâti par les Sabéens afin de recueillir les pluies de la mousson."
 ### Judaic ###
 wonder_second_temple_ezra:0 "Second Temple"
 wonder_second_temple_ezra_DESC:0 "Bien qu'il ne puisse rivaliser avec le Temple de Salomon et qu'il lui manque nombre d'objets sacrés, telle l'Arche d'alliance, ce deuxième temple sert de lieu au culte juif et aux offrandes prescrites par la Torah."
 wonder_second_temple_herod:0 "Second Temple"
 wonder_second_temple_herod_DESC:0 "Reconstruit tout en demeurant en usage, ce deuxième temple couvre l'intégralité du mont du Temple. Il sert de lieu au culte juif et aux offrandes prescrites par la Torah."
 gw_effect_second_temple:0 "Cérémonie de Pessah"
 gw_effect_athena_ilias_temple_DESC:0 "Alexandre le Grand projetait d'agrandir le temple d'Athéna Ilias à une échelle qui aurait surpassé tous les autres temples du monde connu, mais il mourut avant de réaliser sa vision. Nous avons corrigé les erreurs de ses héritiers et fait du temple d'Athéna Ilias l'envie de tous."
 gw_effect_delphi_oracle:0 "Nombril du monde"
 gw_effect_delphi_oracle_DESC:0 "Zeus envoya deux aigles chercher le nombril du monde et marqua d'une pierre, l'omphalos, le lieu où ils se rencontrèrent à Delphes : le « nombril de la Terre ». Depuis lors, les Grecs considèrent Delphes comme le centre du monde."
 gw_effect_asklepion_epidauros:0 "Maîtrise médicale"
 gw_effect_asklepion_epidauros_DESC:0 "" 
 gw_effect_apadana_susa:0 "Roi des rois"
 gw_effect_apadana_susa_DESC:0 "" 
 #######################################
 gw_effect_marib_dam:0 "Ma'rib Dam"
 gw_effect_marib_dam_DESC:0 "Le barrage de Ma'riba était une ancienne merveille d'ingénierie. Construit au 8e siècle avant J.-C., il a fertilisé une grande partie de la région pendant des siècles."
 gw_effect_cothon:0 "Grand Cothon"
 gw_effect_cothon_DESC:0 "Le grand cothon de Carthage abritait la grande marine carthaginoise."
 gw_effect_knossos:0 "Le palais de Cnossos"
 gw_effect_knossos_DESC:0 "L'ancien palais de Knossos est un témoignage de la culture et de la civilisation minoenne de l'âge du bronze."
 gw_effect_punic_tomb:0 "Tombe punique"
 gw_effect_punic_tomb_DESC:0 "Une ancienne tombe punique, signe de respect envers les morts."
 gw_effect_abu_simbel:0 "Abou Simbel"
 gw_effect_abu_simbel_DESC:0 "Abou Simbel commémore la bataille de Kadesh et inspire de nouveaux exploits similaires sous la direction du déifié Ramsès II, une fois de plus."
 gw_effect_ur_ziggurat:0 "Ziggurat d'Ur"
 gw_effect_ur_ziggurat_DESC:0 "Ancienne ziggourat des peuples mésopotamiens, elle était dédiée au dieu de la lune Nanna. Beaucoup y apportaient leur nourriture pour la conserver."
 gw_effect_hippodrome_barce:0 "Hippodrome de Barce"
 gw_effect_hippodrome_barce_DESC:0 "L'hippodrome de Barce accueille les grandes courses qui attirent tous les peuples d'Afrique. Il est présidé par la patronne des compétitions et divinité tutélaire de Barke, la Dame Barce."
 
