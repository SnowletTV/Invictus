 HISTORIC_CHARACTER_UI_INFO_TOOLTIP:0 "#T Historic Character\n\n#color:{0.6,0.6,0.6} [CharacterWindow.GetCharacter.Custom('historic_character')]"

 # NOTE: The UI only fits descriptions less than around 2100-2400 characters. Anything longer than that might get cutoff and not displayed.

 historic_character_1:0 "Antigone Ier le Monophtalme était un général grec macédonien et un successeur d’Alexandre le Grand. Chef au sein de l’armée d’Alexandre, il parvint à prendre le contrôle d’une grande partie de l’ancien empire d’Alexandre. Il s’est attribué le titre de basileus en 306 av. J.-C. et a régné jusqu’à sa mort. Il est le fondateur de la dynastie des Antigonides, qui a régné sur la Macédoine jusqu’à sa conquête par les Romains en 168 av. J.-C.\n\nIl a pris part à l’invasion de la Perse achéménide par Alexandre et a été nommé satrape de Phrygie. Après la mort d’Alexandre en 323 av. J.-C., il a également reçu la Pamphylie et la Lycie conformément au partage de Babylone. Cependant, il s’attira par la suite l’inimitié de Perdiccas, le régent de l’empire d’Alexandre, et fut chassé de la Phrygie. Il s’enfuit en Grèce et forma une alliance avec Antipater, à laquelle se joignit plus tard Ptolémée, contre Perdiccas. Perdiccas fut assassiné par ses propres officiers en 320 av. J.-C., et Antipater fut élu nouveau régent. Au cours d’une série de guerres entre les successeurs d’Alexandre, Antigone s’imposa brièvement comme le plus puissant des Diadoques, régnant sur la Grèce, l’Asie Mineure, la Syrie, la Phénicie et le nord de la Mésopotamie. Cassandre, Séleucos, Ptolémée et Lysimaque formèrent une coalition contre lui, qui aboutit à sa défaite décisive et à sa mort lors de la bataille d’Ipsos en 301 av. J.-C. Son royaume fut partagé entre Lysimaque et Séleucos, mais son fils Démétrios survécut et parvint à prendre le contrôle de la Macédoine en 294 av. J.-C. Antigone naquit en Macédoine vers 382 av. J.-C., fils d’un noble nommé Philippe et d’une épouse dont le nom n’est pas connu. Bien que les opinions divergent quant à l’origine sociale de sa famille, Antigone était probablement de naissance noble. Lorsqu’il apparaît dans les sources historiques, il est à la tête d’une grande partie de l’armée d’Alexandre (Antigone commandait les 7 000 fantassins grecs alliés d’Alexandre). Plutarque rapporte l’histoire d’un Antigone qui aurait perdu un œil lors du siège de Périnthe (340 av. J.-C.) après avoir été touché par un projectile de catapulte. Son importance à la cour de Philippe II est attestée par les liens d’amitié qu’il a noués avec Antipater et Eumène, deux des lieutenants de Philippe."

 historic_character_2:0 "Cassandre fut roi du royaume de Macédoine dans la Grèce antique de 305 av. J.-C. à 297 av. J.-C., et souverain de facto du sud de la Grèce de 317 av. J.-C. jusqu’à sa mort.\n\nFils d’Antipater et contemporain d’Alexandre le Grand, Cassandre fut l’un des Diadoques qui se disputèrent l’empire d’Alexandre après la mort de ce dernier en 323 av. J.-C. Cassandre s’est ensuite emparé du pouvoir en faisant assassiner Alexandre IV, fils et héritier d’Alexandre le Grand. Tout en gouvernant la Macédoine de 317 av. J.-C. à 297 av. J.-C., Cassandre s’est attaché à renforcer les frontières nord et à favoriser le développement économique, tout en fondant ou en restaurant plusieurs villes; cependant, sa cruauté envers ses ennemis politiques complique l’évaluation de son règne."

 historic_character_3:0 "Ptolémée Ier Sôter était un général grec de Macédoine, historien et successeur d’Alexandre le Grand, qui fonda par la suite le royaume ptolémaïque, centré sur l’Égypte et dirigé par la dynastie ptolémaïque de 305 av. J.-C. à 30 av. J.-C. Ptolémée fut basileus et pharaon de l’Égypte ptolémaïque de 305/304 av. J.-C. jusqu’à sa mort; durant cette période, l’Égypte devint un bastion florissant de la civilisation hellénistique et Alexandrie un grand centre de la culture grecque.\n\nPtolémée Ier était le fils d’Arsinoé de Macédoine, dont le père était soit son époux Lagus, soit Philippe II de Macédoine, le père d’Alexandre. Toutefois, cette dernière hypothèse est peu probable et pourrait n’être qu’un mythe inventé pour glorifier la dynastie ptolémaïque. Ptolémée était l’un des compagnons et officiers militaires les plus fidèles d’Alexandre. Après la mort d’Alexandre en 323 av. J.-C., Ptolémée récupéra son corps alors qu’il était en route pour être inhumé en Macédoine, et le fit transférer à Memphis, d’où il fut plus tard transporté à Alexandrie dans un nouveau tombeau. Par la suite, il se joignit à une coalition contre Perdiccas, le régent royal de Philippe III de Macédoine. Ce dernier envahit l’Égypte, mais fut assassiné par ses propres officiers en 320 av. J.-C., ce qui permit à Ptolémée Ier de consolider son emprise sur le pays. À la suite d’une série de guerres entre les successeurs d’Alexandre, Ptolémée fit valoir ses droits sur la Judée, dans le sud de la Syrie, ce qui donna lieu à un conflit avec le roi syrien Séleucos Ier. Il prit également le contrôle de Chypre et de la Cyrénaïque, cette dernière étant placée sous l’autorité de Magas, le beau-fils de Ptolémée. Ptolémée fit également construire la Bibliothèque d’Alexandrie.\n\nPtolémée Ier aurait épousé Thaïs, sa maîtresse du vivant d’Alexandre; on sait qu’il épousa la noble perse Artakama sur ordre d’Alexandre. Il épousa plus tard Eurydice, fille du régent macédonien Antipater; leurs fils, Ptolémée Kéraunos et Méléagre, régnèrent tour à tour comme rois de Macédoine. Le dernier mariage de Ptolémée fut celui avec Bérénice Ire, cousine et dame d’honneur d’Eurydice. Ptolémée Ier mourut en 282 av. J.-C. et fut succédé par son fils né de son union avec Bérénice, Ptolémée II."

 historic_character_4:0 "Seleucus Ier Nicator était un général grec macédonien, officier et successeur d’Alexandre le Grand, qui fonda par la suite l’Empire séleucide éponyme, dirigé par la dynastie séleucide. Au cours des luttes de pouvoir qui ont suivi la mort d’Alexandre, Séleucos est passé du statut d’acteur secondaire à celui de souverain absolu de l’Asie Mineure, de la Syrie, de la Mésopotamie et du plateau iranien, s’attribuant le titre de basileus (empereur). L’Empire séleucide fut l’une des grandes puissances du monde hellénistique, jusqu’à ce qu’il soit vaincu par la République romaine et l’Empire parthe à la fin du IIe siècle et au début du Ier siècle avant notre ère.\n\nAlors qu’il servait sous les ordres d’Alexandre, Séleucos était commandant des Hypaspistes, ou « boucliers d’argent », une unité d’infanterie macédonienne d’élite. Après la mort d’Alexandre en juin 323 av. J.-C., Séleucos appuya d’abord Perdiccas, le régent de l’empire d’Alexandre, et fut nommé commandant des Compagnons et chiliarque lors du partage de Babylone en 323 av. J.-C. Cependant, après le déclenchement des guerres des Diadoques en 322, les échecs militaires de Perdiccas face à Ptolémée en Égypte ont entraîné la mutinerie de ses troupes à Péluse. Perdiccas fut trahi et assassiné lors d’un complot ourdi par Séleucos, Peithon et Antigène à Péluse, soit en 321, soit en 320 av. J.-C. Lors du partage de Triparadisus en 321 av. J.-C., Séleucos fut nommé satrape de Babylone sous l’autorité du nouveau régent Antipater. Les guerres entre les Diadoques reprirent et l’un des plus puissants d’entre eux, Antigone, contraignit Séleucos à fuir Babylone. Séleucos ne put revenir à Babylone qu’en 312 av. J.-C. grâce au soutien de Ptolémée. À partir de 312 av. J.-C., Séleucos étendit sans pitié ses domaines et finit par conquérir les terres perses et mèdes. Séleucos régnait sur la Babylonie, mais aussi sur la partie orientale de l’empire d’Alexandre.\n\nSeleucus revendiqua en outre les anciennes satrapies du Gandhara et de l’est de l’Inde. Cependant, ces ambitions furent contestées par Chandragupta Maurya, ce qui donna lieu à la guerre séleucide-mauryenne (305–303 av. J.-C.). Le conflit fut finalement résolu par un traité qui permit à l’Empire mauryen d’annexer les satrapies orientales. De plus, une alliance matrimoniale fut conclue : Chandragupta épousa une fille de Séleucos, selon Strabon et Appien."

 historic_character_5:0 "Polyperchon appartenait à la génération de Philippe II; il servit d’abord sous ses ordres, puis sous ceux de son fils, Alexandre. Après la bataille d’Issos en 333, Polyperchon obtint le commandement de la phalange de Tymphae, composée de ses compatriotes épirotes. Après le décès d’Alexandre, Polyperchon fut nommé commandant en second de Crateros et se vit confier le poste de gouverneur de la Macédoine. Polyperchon aida Antipater à écraser les rebelles pendant la guerre de Lame. Jugeant son fils, Cassandre, inapte à régner et recherchant un homme d’expérience, Antipater nomma Polyperchon pour lui succéder en tant que régent de l’empire. Cassandre, mécontent d’être le second de Polyperchon, déclencha une guerre civile et chassa Polyperchon de la Macédoine. Il s’allia à Olympias et, ensemble, ils reprirent brièvement le contrôle de la Macédoine et tuèrent Philippe III Arrhidée. Après avoir été chassé une nouvelle fois, Polyperchon passa la décennie suivante à exercer la fonction de stratège du Péloponnèse, perdant progressivement la loyauté des cités grecques restantes, avant de sombrer dans l’oubli."