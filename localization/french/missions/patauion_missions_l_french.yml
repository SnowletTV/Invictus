 PATAVNOS_COUNTRY_ADJECTIVE:0 "Patavian"

 ANTENORIO_FAMILY:0 "Antenorios"

 ####################
 # Decisions
 ####################

 a_new_patauion_decision:0 "Un nouveau Patavion"
 a_new_patauion_decision_desc:0 "Depuis que nos ancêtres spartiates ont débarqué sur les terres vénètes, les relations entre notre classe dirigeante et les autochtones ont été loin d'être amicales. Notre tentative de faire des Vénètes nos nouveaux hilotes s'est avérée vaine, en raison de leur nature obstinément indépendante et du fait qu'ils surpassaient largement en nombre leurs dirigeants helléniques. Si nous voulons nous extirper de l'ombre néfaste de Cléonymos, nous devons reconstruire notre ville et notre culture en une fusion entre Spartiates et Patavii vénitiens. Que les puissants Spartiates ne fassent plus qu'un avec ces Vénètes inébranlables!"
 a_new_patauion_decision_requirement_1_tt:0 "#E #Y $venetic$#!#! culture has been #E integrated#!."
 reform_patauion_completion_tt_1:0 "#E #Y $enetoian$#!#! will become our #E primary culture#!"
 reform_patauion_completion_tt_2:0 "All #E #T $peloponnesian$#!#! pops, and #E #Y 5#!#! #E #T $venetic$#!#! pops in [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] will become "

 ####################
 # Modifiers +
 ####################

 me_angry_patavi_cmod:0 "Patavi en colère"
 desc_me_angry_patavi_cmod:0 "Furieux de voir leur classe dirigeante remplacée par des Grecs étrangers et craignant d'être réduits en esclavage, les habitants de Patavion ne reculeront devant rien pour chasser jusqu'au dernier Spartiate de leur ville."
 me_pat_outnumbered_aristocracy_cmod:0 "Une classe dirigeante en infériorité numérique"
 desc_me_pat_outnumbered_aristocracy_cmod:0 "Bien qu'ils se soient appuyés sur des mercenaires pour conquérir leur nouveau royaume, le nombre de Spartiates qui se sont effectivement rendus à Patavion pour y régner était extrêmement faible. Par conséquent, ils courent constamment le risque d'être renversés par les habitants hostiles."
 me_pat_difficulty_with_taxation_cmod:0 "Problèmes liés à la fiscalité"
 desc_me_pat_difficulty_with_taxation_cmod:0 "Furieux de cette conquête et déterminés à ruiner le royaume de leurs conquérants par tous les moyens, les Patavi locaux refusent de payer le moindre impôt à leurs suzerains spartiates. Évidemment, cela pose un grave problème aux dirigeants de Patavion, qui sont incapables de rassembler suffisamment d'hommes pour assurer le maintien de l'ordre parmi les Patavi."
 me_pat_patavium_representation_pmod:0 "Representation pour les Patavi"
 desc_me_pat_patavium_representation_pmod:0 "Grâce à la mise en place d'infrastructures et à la création d'organismes destinés à leur permettre d'exprimer leurs besoins et leurs insatisfactions, les habitants de Patavion constatent que leur représentation au sein des instances gouvernementales s'est considérablement renforcée."
 me_recently_reformed_patauion_enetoian_path_cmod:0 "Renaissance de Patavion"
 desc_me_recently_reformed_patauion_enetoian_path_cmod:0 "Après de nombreux conflits sanglants, Patavion a récemment réussi à s'établir en tant que nouveau royaume des Enétois, et ses citoyens sont déterminés à protéger ce royaume qu'ils ont tant lutté pour construire."
 me_recently_reformed_patauion_spartan_path_cmod:0 "Une nouvelle Sparte"
 desc_me_recently_reformed_patauion_spartan_path_cmod:0 "Après de nombreux conflits sanglants, Patavion a récemment réussi à s'établir en tant que nouveau royaume spartiate, et ses citoyens sont déterminés à protéger ce royaume qu'ils ont tant lutté pour construire."
 me_pat_hiring_mercenary_guards_cmod:0 "Gardes mercenaires"
 desc_me_pat_hiring_mercenary_guards_cmod:0 "En réponse à la menace que représentent les Patavi, les dirigeants de Patavion ont engagé des mercenaires pour assurer la sécurité de la ville et faire respecter l'ordre parmi les habitants."
 me_aftermath_of_the_patavi_revolt_pmod:0 "Conséquences de la révolte des Patavi"
 desc_me_aftermath_of_the_patavi_revolt_pmod:0 "Les Patavi de cette ville ont été vaincus, et les Spartiates ont pu consolider leur emprise sur Patavion. Cependant, la révolte a laissé des cicatrices profondes dans la population locale, et il faudra du temps pour rétablir la confiance et l'ordre."
 me_showed_charity_to_the_patavi_pmod:0 "Charité envers les Patavi"
 desc_me_showed_charity_to_the_patavi_pmod:0 "Avec les fonds généreusement donnés par les Spartiates, les Patavi ont pu reconstruire leur ville et améliorer leurs conditions de vie. Cette charité a permis de renforcer les liens entre les deux cultures et de favoriser la paix dans la région."
 me_patauian_hippeis_cmod:0 "Hippeis"
 desc_me_patauian_hippeis_cmod:0 "Beaucoup des anciens chefs de guerre vénètes, les Ekupetars, ont été incorporés dans la classe des Hippeis de Patavion, et sont désormais considérés comme des membres à part entière de la société spartiate."
 me_spartan_martial_tradition_cmod:0 "Traditions martiales spartiates"
 desc_me_spartan_martial_tradition_cmod:0 "Conçues selon l'ancien système d'éducation spartiate, les jeunes hommes de Patavion sont formés à la guerre et à la discipline, perpétuant ainsi l'héritage martial de leurs ancêtres."
 me_sycrenised_local_venetic_deities_cmod:0 "Syncrétisme des divinités locales vénètes"
 desc_me_sycrenised_local_venetic_deities_cmod:0 "Les anciennes divinités vénètes ont été intégrées dans le panthéon hellénique de Patavion, permettant aux habitants de pratiquer leur religion traditionnelle tout en honorant les dieux grecs."
 me_pat_invoking_the_power_of_ares_cmod:0 "Invocation du pouvoir d'Arès"
 desc_me_pat_invoking_the_power_of_ares_cmod:0 "Le grand royaume d'Italie du nord est désormais sous la protection d'Arès, le dieu de la guerre, et les habitants de Patavion se tournent vers lui pour obtenir force et courage dans les batailles à venir."
 me_pat_great_temple_to_ares_pmod:0 "Temple d'Arès à Patavion"
 desc_me_pat_great_temple_to_ares_pmod:0 "Ce territoire abrite un temple monumental dédié au dieu hellénique Arès, véritable témoignage de sa grandeur qui éclipse tous les autres de la région!"
 me_pat_change_of_deities_cmod:0 "Réflexions sur les dieux"
 desc_me_pat_change_of_deities_cmod:0 "Après avoir connu de profonds bouleversements religieux, ce pays ne sait plus très bien quels dieux vénérer."

 refused_to_help_patauion_opinion:0 "A refusé de nous envoyer de l'aide"
 strengthened_ties_patauion_opinion:0 "Liens renforcés"

 pat_spartans_must_stick_together:0 "Les Spartans se serrent les coudes"

 ####################
 # Event Localization
 ####################

 me_patauion.16.t:0 "Les conséquences de la conquête"
 me_patauion.16.desc:0 "Victoire! Nos soldats spartiates, menés par l'intrépide Kléonymos et renforcés par des troupes mercenaires, ont pris Patavion aux mains des Patavi vénétiens! Alors que nous partions en quête de gloire, nous ne savions pas où notre traversée de la mer Adriatique nous mènerait; mais en voyant les richesses de Patavion, nous avons souhaité les mettre entre nos mains lémacédoniennes. Maintenant que la victoire est nôtre, Kléonymos a décidé de saisir cette occasion pour fonder un nouveau royaume, avec ses camarades comme nouvelle noblesse spartiate. Mais tout ne va pas pour le mieux dans notre royaume de Patavion.\n\nOutrés d'avoir été privés de leurs droits, les Patavi locaux nous regardent avec un mépris absolu, refusant toute tentative de percevoir des impôts ou de mobiliser de la main-d'œuvre. Pire encore, maintenant que les mercenaires qui nous ont aidés à remporter la victoire sont partis, ils sont bien plus nombreux que nous, bien plus encore que les esclaves héloètes que nous pouvions contrôler chez nous. Nous nous sommes peut-être créé un nouveau foyer, mais il repose sur des fondations extrêmement fragiles. Un seul faux pas, et il nous échappera."
 me_patauion.16.a:0 "Nous devons stabiliser notre nouveau royaume"
 me_patauion.16.a_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! doit se stabiliser rapidement, sinon d'autres la conquerront à leur tour.\n\n$mission_completed_tooltip_1$ '#Y $patauion_mission_task_1$#!' $mission_completed_tooltip_2$"

 me_patauion.17.t:0 "United Spartans"
 me_patauion.17.desc:0 "Nous, les Spartiates, ne sommes pas réputés pour céder à la peur, et pourtant, nous restons éveillés la nuit, tremblants dans nos lits.\nLes habitants de notre ville conquise nous haïssent, complotent contre nous et brandissent leurs couteaux en vue d'assassinats, voire de futurs soulèvements, et nous en sommes bien conscients. Alors que chaque coin de rue peut signifier la mort, les querelles mesquines qui tourmentaient notre élite à Sparte semblent désormais insignifiantes. Alors que les Parques veillent ainsi avec avidité sur nos vies, nous ne pouvons pas nous permettre de rester divisés."
 pat_unite_the_aristocracy_effect_tooltip:0 "La fidélité de chaque #Y #E $peloponnesian$#!#! personnage dans #E [SCOPE.GetRootScope.GetCountry.GetName]#! a augmenté."
 me_patauion.17.a:0 "Nous, les Spartans, devons rester soudés"
 me_patauion.17.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_2$#!' $mission_completed_tooltip_2$"

 me_patauion.18.t:0 "The future of Patavion"
 me_patauion.18.desc:0 "A few years have now passed since we arrived on these shores, and our position remains far too procarious, we must take a decisive choice on how we are to lead our city in the coming years.\nWhile the Spartan elite has been discussing which direction we should take our city, two main paths have been laid out. Either to (as our leader here, Kleonymos, has wished) try to subjugate the numerous Patavi, and reestablish the old social order of Sparta, to which many of us long to return to, or to try to calm the locals down, and try to establish a city where both Laemacedonians and Patavi may live in harmony.\n\n#E Will we follow the wish of Kleonymos, and reestablish a new Sparta in this northern land, or try to create a Hellenic state distinct from that which we came from?#!"
 me_patauion.18.a:0 "Kleonymos is gone, we must look for another destiny to follow..."
 me_patauion.18.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_5$#!' $mission_completed_tooltip_2$\n$mission_completed_tooltip_1$s towards #E #Y$patauion_mission_task_11$#!#! will be #E disabled#!\n\nThis option is available because #E Kleonymos#! is either #E dead#! or has been #E removed from power#!"
 me_patauion.18.b:0 "Kleonymos will lead us, as he lead us to this land."
 me_patauion.18.b_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_5$#!' $mission_completed_tooltip_2$\n$mission_completed_tooltip_1$s towards #E #Y$patauion_mission_task_8$#!#! will be #E disabled#!\n\nThis option is available because #E Kleonymos#! remains the ruler of #E Patavion#!, and will not change his mind."

 me_patauion.19.t:0 "Rise of the Enetoi"
 me_patauion.19.desc:0 "Our efforts have been paying off for a while now, the Patavi have been seeing us less and less as foreign conquerors, and more like just rulers. So much so that many of them have started to make and effort to learn our tounge, albiet with a strong Patavi accent. Similarly, our Spartan upper class has started to adopt many of the Venetic customs that we once thought of as barbaric, using a few words of the local language in our own day to day speach, and even adopting many of their items of clothing, even sometimes including the trousers that we once thought of as so barbaric.\n\nAs time goes on we truly see that our once opposed people are slowly becoming one."
 me_patauion.19.a:0 "As time changes Patavion, so does it it's people."
 me_patauion.19.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_8$#!' $mission_completed_tooltip_2$"

 me_patauion.20.t:0 "A New Sparta"
 me_patauion.20.desc:0 "Instabillity had plagued since we arrived on these shores, but we remained determined. The native Patavi revolted in overwhelming numbers, and yet we stood unyielding, united. Now, the dust has settled, and our hold over Patavion has been ensured, and we are free to create the furture that we have for so long fought for.\nBy the fist of Ares, and litres of blood, we have managed to carve out a new Spartan kingdom, so far from Hellas, in the city of Patavion."
 me_patauion.20.a:0 "Patavion will forever remain unconquerable!"
 me_patauion.20.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_11$#!' $mission_completed_tooltip_2$"

 me_patauion.21.t:0 "Hellenic Help"
 me_patauion.21.desc:0 "In our fragile state, we have made great efforts to try and secure some alliance networks that may serve to protect our realm in the short term. However, with our current lack of recources, and our inability to currently produce more, we are also in need of aid.\nTo this end, we hope that our hellenic brethren answer our call for help, and aid us as we try to spread our shared civilisation ever further."
 me_patauion.21.a:0 "Let us hope our Hellenic brothers help!"
 me_patauion.21.a_tt:0 "A request for aid will be sent to your new #E Hellenic ally#!"

 me_patauion.22.t:0 "Patavion requests assistance"
 me_patauion.22.desc:0 "The city of #E [GetProvince('(int32)3594').GetName]#! may grow to become a powerful ally in the future, but having so recently been established, it is yet to consolidate itself, and will need both time and recources to develop. As such, diplomats from [GetProvince('(int32)3594').GetName] have come to our [ROOT.GetCountry.GetRulerTitle], asking us if we could honour our alliance with them by sending them much needed aid, citing the shared hellenic heritage that we should seek to protect in these new frontiers."
 me_patauion.22.a:0 "Of course we will help our newfound ally!"
 me_patauion.22.a_tt:0 "#E #Y 2#! of #E our#! pops will leave for #E Patavion#!"
 me_patauion.22.b:0 "Eeeeh,"
 me_patauion.22.b_tt:0 "#E Patavion#! will be #R outraged#! at our refusal to help"

 me_patauion.23.t:0 "Our ally sends help"
 me_patauion.23.desc:0 "It seems as though our request was fruitful, for our ally has agreed to send us aid!\nOf course, we can't be to surprised, for this was the result of hard diplomatic work by our [ROOT.GetCountry.GetRulerTitle], [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]."
 me_patauion.23_tt:0 "#E #Y 4#! Hellenic Greek#! pops arrive in #E Patavion#!"
 me_patauion.23.a:0 "We knew they would help us!"
 me_patauion.23.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_3$#!' $mission_completed_tooltip_2$"

 me_patauion.24.t:0 "Our ally sends no aid"
 me_patauion.24.desc:0 "In spite of our clear and reasonable request for help, it seems as though our ally has refused it, shunning us in our time of need in spite of the brotherhood that exists between us.\n\nCurses upon them."
 me_patauion.24.a:0 "Filthy traitors!"
 me_patauion.24.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_3$#!' $mission_completed_tooltip_2$"

 me_patauion.25.t:0 "Assistance from the Locals"
 me_patauion.25.desc:0 "In our fragile state, we have made great efforts to try and secure some alliance networks that may serve to protect our realm in the short term. However, with our current lack of recources, and our inability to currently produce more, we are also in need of aid.\nWe must be able to convince these local barbarians that helping their ally in the short term will lead to future mutual benefit."
 me_patauion.25.a:0 "Let us hope our newfound allies will help!"
 me_patauion.25.a_tt:0 "A request for aid will be sent to your new #E ally#!"

 me_patauion.26.t:0 "Patavion requests assistance"
 me_patauion.26.desc:0 "The city of #E [GetProvince('(int32)3594').GetName]#! may grow to become a powerful ally in the future, but having so recently been established, it is yet to consolidate itself, and will need both time and recources to develop. As such, diplomats from [GetProvince('(int32)3594').GetName] have come to our [ROOT.GetCountry.GetRulerTitle], asking us if we could honour our alliance with them by sending them much needed aid, citing the benefits of a stable Hellenic emporium so close to home."
 me_patauion.26.a:0 "Of course we will help our newfound ally!"
 me_patauion.26.a_tt:0 "#E Patavion#! will recieve our funds\nThe #E relations#! between #E you#! and #E #Y Patavion#!#! will greatly improve."
 me_patauion.26.b:0 "Do we really owe so much to these Greeks?"
 me_patauion.26.b_tt:0 "#E Patavion#! will be #R disappointed#! at our refusal to help"

 me_patauion.27.t:0 "Local ally sends Aid"
 me_patauion.27.desc:0 "It seems as though our request was fruitful, for our ally has agreed to send us aid!\nOf course, we can't be to surprised, for this was the result of hard diplomatic work by our [ROOT.GetCountry.GetRulerTitle], [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]."
 me_patauion.27_tt:0 "The #E relations#! between #E you#! and #E your new ally#! greatly improve."
 me_patauion.27.a:0 "We picked a good ally!"
 me_patauion.27.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_4$#!' $mission_completed_tooltip_2$"

 me_patauion.28.t:0 "Local ally refuses to help"
 me_patauion.28.desc:0 "In spite of our clear and reasonable request for help, it seems as though our ally has refused it, shunning us in our time of need in spite of the strong links that we had worked to forge between us.\n\nCurses upon them."
 me_patauion.28.a:0 "Barbarians can seldom be trusted"
 me_patauion.28.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_4$#!' $mission_completed_tooltip_2$"

 me_patauion.30.t:0 "A question of Leadership"
 me_patauion.30.desc:0 "For the new home we have now, we have one man to thank, and that is Kleonymos, he who sailed across the Adriatic sea in search of glory. But as more time goes on, and the precariousness of our situation becomes more apparent, we can clearly see that he is partially to blame for this as well. Being determined to rebuild that Spartan kingdom that should have been his in the first place, he is utterly fixated on which path we should take the city of Patavion. Even if it may lead us to ruin.\n\n#E If Patavion is to take a more flexible approach, we may have to have a change in leadership.#!"
 me_patauion.30.a:0 "Kleonymos must be removed"
 me_patauion.30.a_tt:0 "#E Kleonymos#! will be removed from power\n\n#T This will affect the course of Patavion's mission tree.#!"
 me_patauion.30.b:0 "We won't betray our king!"
 me_patauion.30.b_tt:0 "#E Kleonymos#! will stay in power\n\n#T This will affect the course of Patavion's mission tree.#!"

 me_patauion.31.t:0 "Representation for the Patavi"
 me_patauion.31.desc:0 "In response to inumerous calls by the local population of our city, our [ROOT.GetCountry.GetRulerTitle], [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen], has wisely decided to establish localities from which the Patavi may voice their concerns and frustrations with their current governors.\nWhile miscomunication will still ocurr to a certain extent, these measures will at least ensure that our local populace at least feels heard by our spartan upper class."
 me_patauion.31.a:0 "People of Patavion, let us hear your concerns!"
 me_patauion.31.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_7$#!' $mission_completed_tooltip_2$"

 me_patauion.32.t:0 "Hired Guards"
 me_patauion.32.desc:0 "Outnumbered by Patavi wolves, our Spartan noblemen and family members are in mortal danger of assasinations at the hands at the local populace. With the conscription of locals being out of the question, our leader, [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen], has wisely decided to start hiring foreign mercenaries for our protection.\nWhile dependence on mercenaries has rendered the defence of lesser states more feeble, we will try to maintain our own martial traditions, albiet with artificialy boosted numbers. Besides, with more armed guards under our control, we can finally collect our taxes through brute force."
 me_patauion.32.a:0 "Finally, the tax can flow"
 me_patauion.32.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_9$#!' $mission_completed_tooltip_2$"

 me_patauion.33.t:0 "The Patavi Revolt!"
 me_patauion.33.desc:0 "Outraged at our attempts to slowly exert more and more pressure upon them, the Patavi have finally snapped upon our attempt to formalize their status as Helot slaves. Slavemasters sent to control the Helots have all been killed, and the Patavi march along the streets of Patavium, intent on slaughtering every last Greek in the city that they rightfully view as theirs!\nWe have defeated them once before, but [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] knows that loosing control now not only means loosing [ROOT.GetCountry.GetRuler.GetHerHis] realm, but the end of Spartan rule over Patavion."
 patavi_have_revolted_tooltip:0 "All #E $venetic$ culture #Y slaves#!#! in Patavion have risen up in #E revolt#!"
 me_patauion.33.a:0 "We will never relinquish control over #E Patavion#!!"
 me_patauion.33.a_tt:0 "If the #E Patavi Revolt Rebels#! hold the province of #E [GetProvince('(int32)3594').GetName]#! in #E #Y 1#! years#! time, our kingdom #E #R will fall to the Patavi#!#!"

 me_patauion.35.t:0 "Final defeat of the Patavi"
 me_patauion.35.desc:0 "After months of bloody fighting, we have managed to finally put down the revolt of the Helots. There were times when our [SCOPE.GetRootScope.GetCountry.GetRulerTitle] shuddered at the prospect of the Patavi army breaching the Royal quarters in the city and slaughtering all they could find, but thankfully such events never came to pass.\nNow the Patavi have fully exhausted all of their forces and recources, and there's no more threat of further resistance. And with the revolt finally crushed, our Spartan slavemasters have begun to round up the weakned Venetic populace, putting the barbarians in the chains that they had resisted for so long.\n\nWhile the cost has been enormous, the gate is now open to properly reestablish our old way of life here in Patavnos."
 patavi_army_is_defeated_tt:0 "All surviving #E $venetic$ culture #Y slaves#!#! that had joined the #E revolt#! are reenslaved in #E [GetProvince('(int32)3594').GetName]#!"
 me_patauion.35.a:0 "Now we are free to forge a true Spartan state"
 me_patauion.35.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_10$#!' $mission_completed_tooltip_2$\nThe Patavi Revolt has been crushed"

 me_patauion.37.t:0 "The Patavi breach the Royal Quarters"
 me_patauion.37.desc:0 "In the final months of fighting, the Spartan [SCOPE.GetRootScope.GetCountry.GetRulerTitle] of Patavion, [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen], had hunkered down in the Royal quarters of the city, unwilling to even attempt one more feeble skirmish against the Patavi horde. The Spartan armies have been crushed, and while the rest of the aristocracy have met their ends on the battlefield, only our traumatized [SCOPE.GetRootScope.GetCountry.GetRulerTitle] still survives within a hidden abode within the city.\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] hears heavy footsteps outside, and the clamour of men and weapons. Panicking, [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] looks for a way to escape, but it is too late. The doors of [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]'s' room crash open, with the leader of the Patavi forces, Anetor of Patavnos, standing in the doorway, with many of Anetor's armed men rushing towards [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHim].\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] cuts many of the barbarians down, but they are too many. And the old [SCOPE.GetRootScope.GetCountry.GetRulerTitle] is eventually immobilized by the overwhealming slashing of blades."
 patavi_army_defeats_patauion_tt:0 "All of the surviving Veneti pops that joined the revolt are freed"
 patavi_army_defeats_patauion_spartan_deaths_tt:0 "All #E $peloponnesian$#! characters and pops are #E #R massacred#!#!"
 me_patauion.37.a:0 "YOU WILL ALL SUFFER IN TARTARUS!"
 me_patauion.37.a_tt:0 "#E #R The game will end for you#!#!"
 me_patauion.37.b:0 "I wonder how fate will treat this 'Antenor'?"
 me_patauion.37.b_tt:0 "#E You will switch to playing as #Y $PATAVNOS_COUNTRY_NAME$#!#!"

 me_patauion.38.t:0 "Making Concessions to the Patavi"
 me_patauion.38.desc:0 "The people of Patavion remain highly weary of us Laemacedonians, however their hostilities are slowly subsiding. While they seemed to have been terrified of the prospect of Spartan rule, with fear of being forced to become the Helot slaves that we have talked of having in our old homeland (alas, a very just fear), their hostility has forced us to make concessions to their legal status, giving them the rights that they have demanded to secure their ways of life. As a result, they are becoming less aggressive towards us Hellenes."
 me_patauion.38.a:0 "We are pleased with this progress!"
 me_patauion.38.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_6$#!' $mission_completed_tooltip_2$"
 me_patauion.38.b:0 "Let the natives see the generocity of their Spartan rulers!"
 me_patauion.38.b_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_6$#!' $mission_completed_tooltip_2$"

 me_patauion.39.t:0 "Incorporation of the old Ekupetars"
 me_patauion.39.desc:0 "The beating of hooves is commonly heard across the plains of Venetia, including in our city of Patavion, as it was in times long gone and as it will be in days to come. While our Spartan forefathers weren't especially atune to the ways of the horse, this was greatly remedied by the inclusion of the old Patavi Ekupetars into our Hippeis.\nNow with a fortified martial culture born on the horse, few will be able to fight the Enetoi man to man."
 me_patauion.39.a:0 "The Enetoi will rule the plains!"
 me_patauion.39.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_12$#!' $mission_completed_tooltip_2$"

 me_patauion.40.t:0 "Gods of the Enetoi"
 me_patauion.40.desc:0 "When the Spartans first came to these lands, they where thought of as foreign conquerors by the Patavi, time has, however, erased the lines inbetween the two groups. Similarly, the gods that the Spartans brought where seen as strange, foreign and blasphemous entities, yet as time goes on, we all see that their parallels with those local gods of the Patavi show them to be one and the same as those already worshiped in these lands.\nJust as the Enetoi have become united under a single tounge, they now unite in worship too."
 syncrenise_venetic_deities_pop_conversion_tooltip:0 "#E #Y All#! $italic_pantheon$#! pops in #E [GetProvince('(int32)3594').GetName]#! will convert to #E $roman_pantheon$#!."
 me_patauion.40.a:0 "Patavion stands firm, with the support of Ares Einaios"
 me_patauion.40.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_13$#!' $mission_completed_tooltip_2$"

 me_patauion.41.t:0 "The Great temple of Ares"
 me_patauion.41.desc:0 "Finally the Temple is unveiled. Ready for worship to begin.\nOne of the greatest temples outside of Hellas, built not only as a testament to the glory of Ares, but also as a monument to our double defeat of the Patavi, and of their subjegation as our Helots. While our gods have long held little space in these lands, this temple now serves as a beacon for their growing power in northern Italia."
 pat_built_temple_to_ares_tooltip:0 "A Great Temple of Ares in Patavion has been built"
 me_patauion.41.a:0 "May the glory of Ares be evident for all to see!"
 me_patauion.41.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_14$#!' $mission_completed_tooltip_2$"

 me_patauion.42.t:0 "Spartan Traditions"
 me_patauion.42.desc:0 "Separated from our homeland for many years, and embroiled in overwhealming strife, we had gone many years without carrying out our old Spartan traditions, such as educating our youngsters in the martial ways in which we had been brought up.\nConsequently, our younger Patavian warriors had started to behave much more cowardly, and appeared far more feeble, then what would have ever been tolerated in Sparta. Consequently, [ROOT.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] initiated policies to rediscipline our youth, and bring back our old Spartan means of maintaining a warriors education.\n\nNow we can see that such efforts are paying off, and our young men are adopting the hardiness and resolution for battle that would make our ancestors proud. #for task desc - we must return Patavion to being a carrier of the famously martial traditions of Sparta."
 me_patauion.42.a:0 "Like all Spartans, the Patavians will never back down!"
 me_patauion.42.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_15$#!' $mission_completed_tooltip_2$"

 me_patauion.44.t:0 "Left on our own"
 me_patauion.44.desc:0 "In spite of our efforts, we have been unable to find any allies to support our settlement of Patavion. Without any diplomatic prospects, we are left entirely on our own to deal with our instability and strife, much to the frustration of [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen].\nWith no short term solution to our lack recourses, an easy path forward looks less and less likely for our Spartan nobles."
 me_patauion.44.a:0 "We will come out of this."
 me_patauion.44.a_tt:0 "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_16$#!' $mission_completed_tooltip_2$"