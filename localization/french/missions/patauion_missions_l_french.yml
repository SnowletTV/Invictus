 patauion_mission_task_13_allow_tt_1:0 "At least #E #Y 2#! $italic_pantheon$#! deities are present in the #E [SCOPE.GetRootScope.GetCountry.GetAdjective] pantheon#!"


 patauion_mission_task_1_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! will have to quickly #E stabilise itself#! by either completing the #E #Y $patauion_mission_task_8$#! task#! or the #E #Y $patauion_mission_task_11$#! task#!."
 patauion_mission_task_2_tt:0 "The #E loyalty#! of each #E #Y $peloponnesian$#! culture#! character in #E [SCOPE.GetRootScope.GetCountry.GetName]#! will increase."
 patauion_mission_task_3_tt:0 "Your new #E Hellenic#! ally will be asked to #E send aid#!."
 patauion_mission_task_4_tt:0 "Your new ally in #E Cisalpine Gaul#! will be asked to #E send aid#!."
 patauion_mission_task_5_tt:0 "#E Once this task is complete#!, you will either lead Patavion towards the #E #Y $patauion_mission_task_8$#!#! mission task, or the #E #Y $patauion_mission_task_11$#!#! mission task, #E depending on if #Y [GetCharacter('(int32)176').GetPraenomen]#! is still the ruler of [SCOPE.GetRootScope.GetCountry.GetName]#!."
 patauion_mission_task_6_tt:0 "Being more placated, and having their demands met, #E the Patavi will calm down#!"
 will_start_integrating_the_veneti_tt:0 "We will start #E integrating#! the #E #Y $venetic$#! culture#!."
 patauion_mission_task_7_tt:0 "Feeling more represented by the new administration, #E the Patavi will agree to start paying tax#!"
 patauion_mission_task_8_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! will switch to a new #E #Y hybrid#! culture#! and gain a #E new #Y heritage#!#!."
 patauion_mission_task_9_tt:0 "With mercenaries in employment for policing the Patavi, we will finally be able to #E force them to pay taxes#!."
 patauion_mission_task_10_tt:0 "Furious at being disenfranchised, The Patavi #E rise up#! in a #E huge #R slave revolt#!#! that must be defeated within #E #Y 1#! year#!."
 patauion_mission_task_11_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! will gain a #E new #Y heritage#!#!."
 patauion_mission_task_12_tt:0 "The old Ekupetar elite will be incorporated into our Hippeis class."
 patauion_mission_task_13_tt:0 "We will gain access to #E #Y 4#! #! new #E Veneto-Hellenic #Y Enetoian deities#!#! at the cost of some old Hellenic ones.\n#E All #Y $italic_pantheon$#!#! pops in #E [GetProvince('(int32)3594').GetName]#! will convert to #E $roman_pantheon$#!"
 patauion_mission_task_14_tt:0 "Spartan martial education will be reimplemented in #E [SCOPE.GetRootScope.GetCountry.GetName]#!, giving a temporary military buff."
 patauion_mission_task_15_tt:0 "A Grand Temple to Ares in #E [GetProvince('(int32)3594').GetName]#! will become the center of hellenic worship in Northern Italia, giving the following effects:"
 patauion_mission_task_16_tt:0 "Without having secured any allies to support us, #E [SCOPE.GetRootScope.GetCountry.GetName]#! will be left alone to deal with its internal strife."

