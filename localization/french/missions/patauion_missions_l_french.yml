 patauion_mission_task_4_allow_tt:0 "Any allied country, whose #E capital#! is in the region of #E #Y $cisalpine_gaul_region$#!#! has an opinion of #E [SCOPE.GetRootScope.GetCountry.GetName]#! of at least #E #G 70#!#!"
 patauion_mission_task_6_allow_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! has chosen to follow the path of #E #Y reforming Patavion#!#!"
 patauion_mission_task_6_allow_tt_2:0 "The #E $venetic$#! culture has been given the #E #Y $right_of_marriage$#! culture right#!"
