 ####################
 # Title
 ####################

 scandinavian_missions_01: "Unir les tribus scandiennes"
 scandinavian_missions_01_DESCRIPTION: "Dans le lointain septentrion s'étendent des terres inconnues des cartographes et des historiens du monde civilisé, un royaume peuplé d'hommes menant une existence rude aux confins mêmes du monde : #E Scandia#!. Le soleil va et vient à sa guise, tandis que de longs hivers cruels semblent durer toute l'année ; et durant les brefs instants où sa lumière honore les cieux, les champs se teintent du sang des armées en bataille.\n\nÀ présent encore, les sombres nuées de la guerre s'amoncellent à l'horizon, et la rumeur se répand de conflits entre les tribus #E scandiennes#! qui vivent dans les contrées sauvages et boisées. "
 scandinavian_missions_01_CRITERIA_DESCRIPTION: "Cette mission sera accomplie lorsque la nation de #E Scandie#! aura été formée."
 scandinavian_missions_01_BUTTON_TOOLTIP: "Notre gloire future ne saurait attendre"
 scandinavian_missions_01_BUTTON_DETAILS: ""

 ####################
 # Mission Tasks
 ####################

 scandinavian_missions_task_1: "Ultima Thule"
 scandinavian_missions_task_1_DESC: "Les territoires les plus occidentaux de la province d'#T Ultima Thule#! sont inhabités, mais [ROOT.GetCountry.GetRuler.GetName|Y] a conçu un plan pour coloniser rapidement la région.\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 scandinavian_missions_task_1_tt: "Nous enverrons des #G colons#! dans #T Ultima Thule#!."

 scandinavian_missions_task_2: "Herulia"
 scandinavian_missions_task_2_DESC: "Les ressources minérales du sud de la #E Scandinavie#! appellent nos levées dans cette région, car quiconque possède ces terres opulentes sera assurément fort riche.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 scandinavian_missions_task_2_tt: "Nous recevrons des revendications sur la province d'#T Herulia#!."

 scandinavian_missions_task_3: "Gothie occidentale"
 scandinavian_missions_task_3_DESC: "Les puissantes tribus qui vivent dans les régions occidentales de la #T Gothie#! passeraient pour des combattants féroces et sans rivaux, mais nous les conquerrons néanmoins.\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 scandinavian_missions_task_3_tt: "Nous recevrons des revendications sur la province de #T Gothie occidentale#!."

 scandinavian_missions_task_4: "Gothie orientale"
 scandinavian_missions_task_4_DESC: "La prise de #T Gothie orientale#! fera entrer l'île précieuse de [GetProvince('(int32)6010').GetName|Y] en notre possession et nous donnera la maîtrise maritime des routes commerciales de l'#E Oceanus Sarmaticus#!.\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 scandinavian_missions_task_4_tt: "Nous recevrons des revendications sur la province de #T Gothie orientale#!."

 scandinavian_missions_task_5: "Les dépouilles de la guerre"
 scandinavian_missions_task_5_DESC: "À présent que nous avons conquis le nord et le sud de #T Scandie#!, jouissons du fruit de nos labeurs en pillant ces terres et en envoyant des esclaves à [ROOT.GetCountry.GetCapital.GetName|T].\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"

 scandinavian_missions_task_6: "Écraser les Goths"
 scandinavian_missions_task_6_DESC: "Les levées [ROOT.GetCountry.GetAdjective] victorieuses ont écrasé les tribus qui vivaient en #T Gothie#!, accroissant grandement l'étendue de nos frontières ; gloire à [ROOT.GetCountry.GetRuler.GetName|Y] et aux armées de [ROOT.GetCountry.GetName|T] ! \n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 scandinavian_missions_task_7: "Scandia"
 scandinavian_missions_task_7_DESC: "Enfin, nous avons vaincu nos ennemis voisins et soumis leurs chefs tribaux ; nous sommes désormais réunis pour assister à la naissance de #Y Scandie#!.\n\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 you_need_to_form_scandinavia: "Nous devons prendre la décision de #Y former la Scandie#!."

 scandinavian_missions_task_8: "Les pillards scandiens"
 scandinavian_missions_task_8_DESC: "Des cités se trouvent au-delà des eaux, en #T Bretagne#! et dans d'autres contrées civilisées avec lesquelles nous pourrions établir des relations commerciales, si tel était notre désir ; mais nous pourrions tout aussi aisément lancer des raids sur leurs territoires...\n\n\n\n\n\n\n\n\n\n\n@celt_mil17!"
 scandian_pillage_bonus_var_tt: "Lorsque nos armées #R rasent des cités#!, nous gagnons #G 2 % de recherche civique#!."

 scandinavian_missions_task_9: "Revendications calédoniennes"
 scandinavian_missions_task_9_DESC: "À présent que nous nous sommes assurés des territoires essentiels, nous comprenons que des terres situées n'attendent que nous...\n\n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 scandinavian_missions_task_10: "Une capitale scandienne"
 scandinavian_missions_task_10_DESC: "La seule chose qui manque à notre nation est une véritable capitale, mais nous remédierons à ce problème. Dès que nous aurons choisi l'emplacement de notre capitale nationale, nous commencerons aussitôt à bâtir une cité.\n\n#Y Nous aurons la possibilité de déplacer la capitale de notre nation et une cité sera construite.#!\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 scandinavian_missions_task_11: "Fermes scandiennes"
 scandinavian_missions_task_11_DESC: "Notre nation grandissante aura besoin de nourriture ; bâtissons des fermes partout où nous le pourrons, dans l'espoir de survivre aux hivers glacés. \n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 scandinavian_missions_task_11_tt: "Nous devons bâtir au moins #Y 5 établissements agricoles#! dans la région de #T Scandie#!."

 scandinavian_missions_task_12: "Les étalons scandiens"
 scandinavian_missions_task_12_DESC: "Nombre de choses nous font défaut, mais heureusement l'accès aux chevaux @horses! n'est pas de celles-là ; nous devrions développer [GetProvince('(int32)6024').GetName|Y] afin d'accroître la taille de nos troupeaux et la puissance de notre cavalerie.\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"


 ####################
 # Events
 ####################

 me_scandinavia_1_title: "Le chef ambitieux"
 me_scandinavia_1_desc: "Bien que la plupart des habitants des civilisations du sud et de l'est n'aient jamais entendu parler des forêts escarpées de #E Scandie#! ni de son peuple, il s'agit d'une contrée prospère et vivante, peuplée d'un grand nombre de tribus qui se disputent sans cesse la suprématie.\n\nNul ne connaît l'avenir, mais l'unification des contrées sauvages du Nord est tenue pour inévitable... les annales attendent l'avènement du premier souverain qui unira #E Scandie#!."
 me_scandinavia_1.a: "Je sais qui sera cette personne..."
 me_scandinavia_1_tooltip: "Le temps est venu d'entrer dans l'histoire..."

 me_scandinavia_2_title: "Herulia"
 me_scandinavia_2_desc: "[ROOT.GetCountry.GetRuler.GetName] n'a jamais renié ses ambitions, et s'emparer des terres du sud de #E Scandie#! est depuis longtemps le rêve du [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetAdjective].\n\nLa province d'#E Herulia#! commande le passage terrestre d'une importance capitale vers les îles #E cimbres#!, lesquelles constituent à leur tour la porte du continent de l'#E Europe#!. Nous assurer ces territoires nous conférera une puissance jusqu'alors inconnue et accroîtra grandement notre prestige dans la région."
 me_scandinavia_2.a: "Les dieux sont avec nous, vous le verrez ! Herulia est nôtre !"
 me_scandinavia_2_tooltip: "$mission_completed_tooltip_1$ '#Y Herulia#!' $mission_completed_tooltip_2$"

 me_scandinavia_3_title: "Ultima Thule"
 me_scandinavia_3_desc: "[ROOT.GetCountry.GetRuler.GetName] comprenait fort bien pourquoi les côtes occidentales de la province d'#E Ultima Thule#! n'étaient revendiquées par personne : la terre elle-même était d'une pauvreté extrême, incapable de nourrir une agriculture digne de ce nom, battue par les vents et détrempée par les pluies. Bien que quelques régions boisées abritassent une précieuse ressource @woad!, il n'y avait guère autre chose à mentionner ; la plupart des tribus dispersées d'Ultima Thule exerçaient leur métier en mer et vivaient de la pêche, car la chasse était misérable et aucune récolte ne survivait aux hivers dévastateurs.\n\nMalgré ces contraintes, le [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetAdjective] comprit la nécessité de revendiquer ces terres : nous ne devons pas laisser nos rivaux prétendant au pouvoir s'emparer de territoires susceptibles de leur profiter. Les #E Anciens des tribus#! proposèrent donc un plan : nos hommes prendraient la mer depuis le port de [GetProvince('(int32)6038').GetName] et bâtiraient de petits villages le long des côtes. Ce serait coûteux, mais nous pourrions aussitôt prendre possession de toutes les terres que nous ne contrôlons pas encore."
 me_scandinavia_3.a: "L'idée me plaît : envoyez les colons par mer"
 me_scandinavia_3.b: "Le moment n'est pas venu pour une expédition vers l'ouest..."
 me_scandinavia_3_tooltip: "$mission_completed_tooltip_1$ '#Y Ultima Thule#!' $mission_completed_tooltip_2$"
 me_scandinavia_3.a_tt: "Nous coloniserons tous les territoires inhabités de la province d'#T Ultima Thule#!."

 me_scandinavia_4_title: "Gothie occidentale"
 me_scandinavia_4_desc: "[ROOT.GetCountry.GetRuler.GetName] a hardiment proclamé des revendications sur les terres ancestrales de certaines des tribus les plus fortes et les plus puissantes de toute #E Scandia#!, garantissant presque qu'une guerre de conquête décisive sera menée par les [ROOT.GetCountry.GetAdjective]s dans les jours à venir.\n\nAlors que la nouvelle des hostilités imminentes se répand dans les villages de campagne, les compagnies mercenaires aiguisent leurs armes et rassemblent leurs provisions en vue des campagnes à venir."
 me_scandinavia_4.a: "Le sang versé vaudra les récompenses, j'en suis certain"
 me_scandinavia_4_tooltip: "$mission_completed_tooltip_1$ '#Y Gothie occidentale#!' $mission_completed_tooltip_2$"

 me_scandinavia_5_title: "Gothie orientale"
 me_scandinavia_5_desc: "Les territoires orientaux de #E Scandie#! ont toujours revêtu une importance particulière pour [ROOT.GetCountry.GetRuler.GetName], qui garde un souvenir ému des étés passés à parcourir les côtes durant sa jeunesse. Les forêts foisonnant de gibier, l'air marin glacé qui emplit les poumons et donne pour la première fois le sentiment d'être véritablement vivant, le littoral saisissant hérissé de rochers imposants surgissant des eaux gelées, la menace des pirates errants et des bandes de chasseurs d'esclaves... il y en a pour tous les goûts.\n\nC'est peut-être la nostalgie qui a poussé [ROOT.GetCountry.GetName] à revendiquer la région, mais quelles qu'aient été les motivations du [ROOT.GetCountry.GetRulerTitle], l'issue aurait été la même."
 me_scandinavia_5.a: "Je serai heureux de retourner en Gothie orientale..."
 me_scandinavia_5_tooltip: "$mission_completed_tooltip_1$ '#Y Gothie orientale#!' $mission_completed_tooltip_2$"

 me_scandinavia_6_title: "Les pillages de la guerre"
 me_scandinavia_6_desc: "[ROOT.GetCountry.GetRuler.GetName] a récemment conduit [ROOT.GetCountry.GetName] à une série de victoires impressionnantes, fait célébré par toute la population de [ROOT.GetCountry.GetCapital.GetName], qui couvre le [ROOT.GetCountry.GetRulerTitle] d'éloges.\n\nNotre [ROOT.GetCountry.GetRulerTitle] triomphant a placé les provinces lointaines d'#E Ultima Thule#! et d'#E Herulia#! sous notre contrôle, offrant à [ROOT.GetCountry.GetRuler.GetFirstName] une place éternelle dans nos récits transmis oralement. Pour célébrer cet événement capital, nos armées furent autorisées à piller la campagne sur le chemin du retour, et les enclos d'esclaves de [ROOT.GetCountry.GetCapital.GetName] poussèrent un gémissement de misère en se remplissant de centaines de pauvres âmes."
 me_scandinavia_6.a: "Je combattrai toujours pour offrir la victoire au peuple [ROOT.GetCountry.GetAdjective] !"
 me_scandinavia_6_tooltip: "$mission_completed_tooltip_1$ '#Y Les pillages de la guerre#!' $mission_completed_tooltip_2$"

 me_scandinavia_7_title: "Écraser les Goths"
 me_scandinavia_7_desc: "En définitive, tout s'est joué en quelques batailles décisives opposant nos levées [ROOT.GetCountry.GetAdjective] aux tribus vivant dans les forêts de #E Gothie occidentale#! et de #E Gothie orientale#!, et les dieux de la guerre ont démontré une fois pour toutes qu'ils combattaient aux côtés de nos guerriers.\n\nNos forces victorieuses ont écrasé tout ce qui se dressait contre elles sur le champ de bataille, et la puissance de [ROOT.GetCountry.GetRuler.GetName] s'est accrue jusqu'à atteindre des sommets stupéfiants."
 me_scandinavia_7.a: "Ramenez esclaves et richesses à la capitale !"
 me_scandinavia_7_tooltip: "$mission_completed_tooltip_1$ '#Y Écraser les Goths#!' $mission_completed_tooltip_2$"

 me_scandinavia_8_title: "Scandie"
 me_scandinavia_8_desc: "Il est difficile de le croire, mais [ROOT.GetCountry.GetRuler.GetName] a conduit notre nation au pinacle de la gloire ; nous ne sommes plus de simples tribus, et avons accompli un exploit remarqué par les chefs et les rois de toute l'Europe septentrionale.\n\nNous sommes [ROOT.GetCountry.GetName] : que le monde tremble !"
 me_scandinavia_8.a: "Notre nom sera à jamais associé à la victoire éternelle"
 me_scandinavia_8_tooltip: "$mission_completed_tooltip_1$ '#Y Scandie#!' $mission_completed_tooltip_2$"

 me_scandinavia_9_title: "Les pillards scandiens"
 me_scandinavia_9_desc: "Les raids dévastateurs lancés par les tribus [ROOT.GetCountry.GetAdjective] ont apporté d'innombrables misères aux communautés côtières et la vue de nos navires apparaissant à l'horizon inspire une véritable terreur au cœur des habitants.\n\nPar terre comme par mer, les guerriers de [ROOT.GetCountry.GetName] ont ravagé maintes colonies et cités, et la menace imposée par leurs bandes de pillards a poussé de nombreuses communautés à envisager la construction de fortifications plus puissantes."
 me_scandinavia_9.a: "Rien ne nous empêchera de prendre ce que nous désirons !"
 me_scandinavia_9_tooltip: "$mission_completed_tooltip_1$ '#Y Les pillards scandiens#!' $mission_completed_tooltip_2$"

 me_scandinavia_10_title: "Revendications calédoniennes"
 me_scandinavia_10_desc: "Bien que chacun affirme que les #E Calédoniens#! sont de redoutables guerriers, cela n'a pas dissuadé [ROOT.GetCountry.GetRuler.GetName] de préparer les revendications [ROOT.GetCountry.GetAdjective]es sur leurs terres. Nos navires de guerre [ROOT.GetCountry.GetAdjective]s ont maintes fois ravagé leurs côtes, et nos levées savent que nous n'avons rien à craindre de ces insulaires couards.\n\nBientôt, nos levées franchiront le #E Mare Hibernicum#! et apporteront la dévastation à ceux qui ne s'y attendent pas ; ils ne pourront se cacher derrière leurs murailles ! En prévision de cet événement glorieux, nos artisans ont conçu des navires plus rapides que tout ce qui vogue en haute mer."
 me_scandinavia_10.a: "J'ai grand-peine à attendre ! Voilà qui promet d'être magnifique"
 me_scandinavia_10_tooltip: "$mission_completed_tooltip_1$ '#Y Revendications calédoniennes#!' $mission_completed_tooltip_2$"

 me_scandinavia_11_title: "Une capitale scandienne"
 me_scandinavia_11_desc: "À présent que [ROOT.GetCountry.GetRuler.GetName] a uni les diverses tribus #E scandiennes#! sous une même bannière, il a été proposé de bâtir une cité entièrement nouvelle pour servir de capitale officielle à un royaume si puissant. [ROOT.GetCountry.GetRuler.GetFirstName] doit désormais décider où nous bâtirons notre capitale... une tâche enviable, mais dont [ROOT.GetCountry.GetRuler.GetSheHe] est assurément digne."
 me_scandinavia_11.a: "Les plaines de [GetProvince('(int32)6000').GetName] sont un excellent emplacement"
 me_scandinavia_11.b: "[GetProvince('(int32)6012').GetName], sur la côte, est un lieu séduisant"
 me_scandinavia_11.c: "[GetProvince('(int32)6004').GetName] serait un emplacement intéressant pour une capitale..."
 me_scandinavia_11.d: "Je choisis l'île boisée de [GetProvince('(int32)6009').GetName]"
 me_scandinavia_11.e: "Nous conserverons notre capitale ancestrale"
 me_scandinavia_11_tooltip: "$mission_completed_tooltip_1$ '#Y Une capitale scandienne#!' $mission_completed_tooltip_2$"

 me_scandinavia_12_title: "Fermes scandiennes"
 me_scandinavia_12_desc: "Dans toute la campagne, les fermes que nous avons bâties sont productives et fécondes, et notre peuple ne manque jamais de légumes durant les jours difficiles de l'hiver. Grâce aux infrastructures dont nous disposons désormais, nous pourrons entreposer davantage de nourriture qu'auparavant ; ce n'est pas là un mince exploit, et il y a de quoi se réjouir dans un pays où la faim constitue une menace véritable."
 me_scandinavia_12.a: "Cette abondance me réjouit ; j'espère que notre peuple est heureux"
 me_scandinavia_12_tooltip: "$mission_completed_tooltip_1$ '#Y Fermes scandiennes#!' $mission_completed_tooltip_2$"

 me_scandinavia_13_title: "Les étalons scandiens"
 me_scandinavia_13_desc: "Nous avons le plaisir d'annoncer que les chevaux élevés dans les domaines que nous avons bâtis à [GetProvince('(int32)6024').GetName] dépassent toutes nos hautes espérances, et que ceux envoyés à nos cavaliers bondissent à travers les ravins boisés de [ROOT.GetCountry.GetName] avec une adresse qui semble surnaturelle."
 me_scandinavia_13.a: "Puissent nos cavaliers nous conduire à la victoire !"
 me_scandinavia_13_tooltip: "$mission_completed_tooltip_1$ '#Y Les étalons scandiens#!' $mission_completed_tooltip_2$"

 ####################
 # Modifiers
 ####################
 scandinavia_abandoned_capital_mod:0 "Capitale historique abandonnée"
 desc_scandinavia_abandoned_capital_mod:0 "Nos hommes sont furieux que nous ayons abandonné les collines ondoyantes où sont enterrés leurs pères."
 scandinavia_historic_capital_mod:0 "Capitale historique conservée"
 desc_scandinavia_historic_capital_mod:0 "Notre peuple, convaincu que l'emplacement de notre capitale ancestrale est sacré, a décidé de rester chez lui plutôt que de s'installer ailleurs."
 scandinavian_horseworks: "Étalons scandiens"
 desc_scandinavian_horseworks: "Nos chevaux sont dressés dans les campagnes boisées de notre patrie et savent franchir les terrains périlleux avec célérité."
 scandinavian_food_mod: "Réserves de grains scandiennes"
 desc_scandinavian_food_mod: "Grâce aux fermes que nous avons bâties, nous pouvons entreposer du grain pour les hivers difficiles."
 muh_fast_viking_boats: "Drakkars scandiens"
 desc_muh_fast_viking_boats: "Notre peuple a maîtrisé l'art de construire des navires longs, rapides et élégants pour aller piller nos ennemis."

 SCANDIA_FLAG: "Le drapeau de Scandie unie"

