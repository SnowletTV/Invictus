  salluvia_start: "#t Salluvie#!\nDifficulté: #Y Normal#!\n\n$salluvia_heritage_desc$"

  #Northern Europe
  scythia_start: "#t Scythes#! \nDifficulté: #y Facile#! \n\nLa Scythie a connu un grand déclin après la mort du roi Ateas aux mains de Philippe II de Macédoine. Malgré des relations fragiles avec les Grecs, certains commencent à considérer leurs villes comme des piliers de force et de stabilité. Scythia changera-t-elle avec son temps ou restera-t-elle fidèle à son mode de vie nomade ?"
  bosporan_start: "#t Royaume du Bosphore#! \nDifficulté: #Y Normal#! \n\nSpartokos Ier était un capitaine mercenaire apparenté aux souverains du royaume des Odryses. Engagé par le tyran de Pantikapaion, Archéanactide, roi du Bosphore, Spartokos a vu son influence s'étendre progressivement grâce à ses prouesses militaires exceptionnelles et à son sens stratégique, ce qui lui a valu la loyauté des troupes qui servaient à ses côtés. Finalement, il organisa un coup d'État contre les Archéanactides, s'empara de Pantikapaion et établit la dynastie des Spartokides à leur place.\n\nAu cours de leurs trois siècles de règne, les Spartokides ont étendu les possessions du royaume du Bosporus, le faisant passer d'une poignée de villes vaguement reliées entre elles, regroupées autour de la péninsule de Kertch, à un véritable royaume hellénique capable de servir de rempart contre l'expansion des Scythes et des Sarmates."
  boihaemia_start: "#t Boïens#! \nDifficulté: #Y Facile#! \n\n$boihaemia_heritage_desc$"
  treveria_start: "#t Trévires#! \nDifficulté: #Y Facile#! \n\n$treverian_heritage_desc$"
  haria_start: "#t Hares#! \nDifficulté: #Y Normal#! \n\n$lugian_heritage_desc$"
  semnonia_start: "#t Semnons#! \nDifficulté: #Y Normal#! \n\n$suebic_heritage_desc$"
  marcomannia_start: "#t Marcomans#! \nDifficulté: #Y Difficile#! \n\n$suebic_heritage_desc$"
  frisia_start: "#t Frisons#! \nDifficulté: #Y Normal#! \n\n$ingvaeonic_heritage_desc$"
  guthonia_start: "#t Guthons#! \nDifficulté: #Y Normal#! \n\n$gothonic_heritage_desc$"
  bastarnia_start: "#t Bastarnes#! \nDifficulté: #Y Normal#! \n\nL'histoire de notre peuple, les tribus migratrices des Bastarnae, est longue et riche en histoires, remontant au-delà de la mémoire dans les brumes du Temps ; même nos aînés ne savent pas où se trouvait notre patrie d'origine. D'aussi loin que nous nous souvenions, nous avons erré, rêvant d'un temps où notre vagabondage cesserait..."
  osismia_start: "#t Osismes#! \nDifficulté: #Y Normal#! \n\n$aremorican_heritage_desc$"
  chattia_start: "#t Chattes#! \nDifficulté: #Y Normal#! \n\n$istvaeonic_heritage_desc$"
  insubria_start: "#t Insubres#! \nDifficulté: #Y Normal#! \n\n$lepontic_heritage_desc$"
  androphagia_start: "#t Androphagia#!\nDifficulté: #y Difficile#!\n\n$androphagia_heritage_desc$"
  eburonia_start: "#t Éburons#!\nDifficulté : #Y Normal#!\n\nLes clans belliqueux d'Eburonie vivent près du fleuve Rhenus, dans les plaines et les forêts qu'ils considèrent comme leur territoire. Les marchands du sud civilisé évitent de s'aventurer dans ces forêts sombres, craignant la réputation de la féroce tribu des Belges, connue pour s'opposer aux tentatives des étrangers de visiter leurs villages."
  icenia_start: "#t Icènes#!\nDifficulté : #Y Normal#!\n\n$icenian_heritage_desc$"
  caledonia_start: "#t Calédoniens#!\nDifficulté : #Y Difficile#!\n\n$caledonia_heritage_desc$"
  ivernia_start: "#t Ivernes#!\nDifficulté : #Y Normal#!\n\n$ivernia_heritage_desc$"
  arvernia_start: "#t Arvernia#!\nDifficulté: #Y Normal#!\n\n$arvernia_heritage_desc$"

  #Africa
  egypt_start: "#t Égypte#! \nDifficulté: #y Très facile#! \n\n$ptolemys_heritage_desc$"
  cyrenaica_start: "#t Cyrène#! \nDifficulté: #y Difficile#! \n\nLa Cyrénaïque a longtemps été le jouet d'autres empires ; d'abord les Achéménides leur imposèrent leur odieux joug d'esclavage, puis les armées barbares d'Alexandre apportèrent encore plus de chaos et de servitude forcée à cette partie fertile et luxuriante de l'Afrique. La Cyrénaïque, qui abritait autrefois un peuple libre et fier, est désormais théoriquement gouvernée par Ptolemaios, le général macédonien qui a pris le pouvoir et s'est établi sous le nom de Basileus."
  kush_start: "#t Kouch#! \nDifficulté: #y Facile#! \n\nLes habitants de Kouch sont presque tombés dans l'obscurité après la chute de la 25e dynastie. Il est temps d'inverser les fortunes et de devenir le pharaon le plus fort que le monde ait jamais vu !"
  aksum_start: "#t Axoum#! \nDifficulté: #Y Normal#! \n\n$Axumite_heritage_desc$"
  garamantia_start: "#t Garamantes#! \nDifficulté: #Y Facile#! \n\n$garamantes_heritage_desc$"
  massaesylia_start: "#t Massésyles#! \nDifficulté: #Y Difficile#! \n\n$Massaesylian_heritage_desc$"
  nuragic_start: "#t Gymnésie#! \nDifficulté: #Y Difficile#! \n\n$balearic_heritage_desc$"
  mosylon_start: "#t Mosylon#!\nDifficulté: #y Difficile#!\n\nLes pays voisins partageant la #Y Macrobian Culture#! ont accès à cet arbre.\n\n$mosylon_heritage_desc$"
  blemmia_start: "#t Blemmia#!\nDifficulté: #y Difficile#!\n\n$Blemmian_heritage_desc$"
  scandia_start: "#t Goutia#!\nDifficulté: #y Difficile#!\n\nLes pays voisins partageant la #Y Scandian Culture#! ont accès à cet arbre.\n\n$scandian_heritage_desc$"

  #Asia
  antigonid_start: "#T Royaume antigonide#! \nDifficulté: #y Normal#! \n\n$antigonid_heritage_desc$"
  seleukid_start: "#T Royaume séleucide#! \nDifficulté: #y Facile#! \n\n$seleucus_heritage_desc$"
  bithynia_start: "#T Bithynie#! \nDifficulté: #y Difficile#! \n\n$bithynia_heritage_desc$"
  rhodes_start: "#t Rhodes#! \nDifficulté: #y Difficile#! \n\nLa belle île de Rhodes est la porte d'entrée de la mer Égée, stratégiquement située et dotée d'un peuple industrieux et raffiné, et ce sont ces faits incontestables qui ont poussé de nombreuses puissances étrangères à convoiter l'île pour elles-mêmes. Rhodes a récemment été assiégée pendant un an et se remet encore des effets délétères, mais ne sera pas brisée !"
  judea_start: "#t Judée#! \nDifficulté: #y Difficile#! \n\nPendant des siècles, les Juifs ont été confinés en Palestine et dans certains coins de l'Arabie, leurs lieux saints et lieux de sépulture ancestraux aux mains d'usurpateurs. Il est temps de reprendre ce qui appartient de droit au peuple hébreu !"
  samaria_start: "#t Samarie#! \nDifficulté: #y Difficile#! \n\n$samaria_heritage_desc$"
  bactria_start: "#t Bactriane#! \nDifficulté: #y Difficile#! \n\nLa Bactriane reste sous l'emprise de fer de l'empire séleucide, qui est devenu préoccupé par de nombreux conflits à l'ouest, laissant sa satrapie sans défense face aux hordes de Scythie. La Bactriane est riche, urbanisée et fertile, et pourrait devenir une grande nation, si elle parvient à gagner sa liberté."
  persis_start: "#t Perse#! \nDifficulté: #y Normal#! \n\n$heritage_of_persis_desc$"
  atropatene_start: "#t Atropatène#! \nDifficulté: #y Normal#! \n\n$atropatenian_heritage_desc$"
  sogdia_start: "#t Sogdiane#! \nDifficulté: #y Très difficile#! \n\n$sogdian_heritage_desc$"
  tasm_start:0 "#t Tasm#!\nDifficulté : #y Difficile#!\n\nAu cœur de la péninsule arabique, les tribus de Tasm mènent une existence précaire au milieu des dunes de sable désolées, s'accrochant aux eaux vivifiantes des rares oasis disséminées sur leurs territoires. Souvent ignorés par les républiques et les monarchies côtières, qui considèrent le peuple tasmite comme des sauvages ne servant qu'à être embauchés comme mercenaires pour leurs guerres régionales, cela causera leur perte…"
  nabatea_start:0 "#t Nabatée#!\nDifficulté : #y Difficile#!\n\nLe Malka de Nabaté, comme on appelle leur roi, règne sur un territoire d'importance stratégique, largement sillonné par les marchands, les diplomates et les armées, car le royaume des Nabatéens s'étend jusqu'en Asie, en Afrique et en Arabie. Les guerres des Diadoques ont propulsé cette région vitale sous les feux de la rampe, car l'effondrement du statu quo politique a offert aux Nabatéens ambitieux une occasion d'expansion.. "
  iberia_start:0 "#t Ibérie#!\nDifficulté : #y Normal#!\n\n$iberian_heritage_desc$"
  cappadocia_start:0 "#t Cappadoce#!\nDifficulté : #y Normal#!\n\n$cappadocian_heritage_desc$"
  saba_start:0 "#t Saba#!\nDifficulté : #Y Facile#!\n\n$saba_heritage_desc$"
  qataba_start:0 "#t Qataba#!\nDifficulté : #Y Facile#!\n\n$qataba_heritage_desc$"
  ach_heraclea_persica_start:0 "#t Heraclea Pontica#!\nDifficulté : #Y Très difficile#!\n\n$heraclea_pontican_heritage_desc$"
  tylos_start:0 "#t Tylos#!\nDifficulté : #Y Très difficile#!\n\n$tylosian_heritage_desc$"
  caria_start:0 "#t Carie#!\nDifficulté: #y Difficile#!\n\n"La lignée d'Hécatomnos a autrefois fait la grandeur de la Carie. Depuis leur fief ancestral de Mylasa, les Hécatomnides se sont imposés comme satrapes de la Carie, maîtres tant de ses hautes terres que de ses côtes. Sous Mausole et Artémise, Halicarnasse devint célèbre pour son mausolée colossal, ses flottes dominaient la mer Égée et sa cour accueillait des poètes, des érudits et des soldats venus de tout le monde hellénique. Même à son déclin, la dynastie a survécu dans l'honneur : la reine Ada, dernière des Hekatomnides, a adopté Alexandre le Grand comme fils.\n\nAujourd'hui, la Carie se trouve à la croisée des chemins. Rétablissez les anciennes traditions sous un Hécatomnide ressuscité ou forgez un royaume successeur sous Pleistarchus et revendiquez votre part de l'empire d'Alexandre!"
  phoenicia_start:0 "#t Tyr#!\nDifficulté: #y Difficile#!\n#E Les missions phéniciennes#! sont également disponibles à Arados, Byblos, Sidon et Tripoli\n\nDe la forteresse insulaire d'Arados aux ports animés de Sidon et de Tyr, les Phéniciens étaient réputés pour être des marchands, des constructeurs navals et des explorateurs d'une qualité inégalée. C'est nous qui avons enseigné au monde les secrets de la mer, qui avons bâti la puissante Carthage et qui avons relié des terres lointaines grâce à des réseaux commerciaux et culturels. Mais l'ère de la soumission aux empires et aux seigneurs doit prendre fin. Les vagues qui ont porté nos navires aux quatre coins du monde connu nous mèneront désormais vers la suprématie, tant sur terre qu'en mer. Le moment est venu d'unir les villes de la Phénicie et de reconquérir la gloire qui est notre droit de naissance."
  #kios_start:0 "#t Kios#!\nDifficulté: #y Difficile#!\n\n$kian_heritage_desc$"
  mithridatid_start:0 "#t Domaine des Mithridates#!\nDifficulté: #Y Normal#!\n\nLa maison de Mithridate revendique sa filiation avec Darius par l'intermédiaire du noble Gobryas, et son emprise s'étend des collines boisées de la Mariandynie aux côtes battues par les tempêtes de la Mysie. Pourtant, le sort de notre dynastie est en suspens, alors que de soi-disants amis convoitent nos possessions, tandis que les guerres des Diadoques écrasent les petits royaumes sous le talon macédonien.\n\nNous devons faire preuve d'audace. Si le danger se referme sur nos terres de Pergame, nous devrions les abandonner, ne serait-ce que pour un temps, et nous tourner vers l'est, vers les hauteurs protectrices de la Paphlagonie et de la Cappadoce pontique. Un royaume pontique, non, un empire pontique, s'offre à nous, pourvu que Mithridate Ktistes s'empare de la couronne et laisse les Diadoques se quereller entre eux!"
  albania_start:0 "#t Albanie#!\nDifficulté: #Y Normal#!\n\n$caucasia_albania_heritage_desc$"
  colchis_start:0 "#t Colchide#!\nDifficulté: #Y Normal#!\n\n$colchis_heritage_desc$"
  paphlagonia_start:0 "#t Paphlagonie#!\nDifficulté: #y Difficile#!\n\n$paphlagonia_heritage_desc$"
  parthia_start: "#t Parthie#!\nDifficulté: #Y Normal#!\n\n$satrapy_parthia_heritage_desc$"
  dahae_start: "#t Parnie#!\nDifficulté: #Y Normal#!\n\n$parnia_heritage_desc$"
  legia_start: "#t Légie#!\nDifficulté: #y Difficile#!\n\n$legia_heritage_desc$"
  zygia_start: "#t Zygie#!\nDifficulté: #y Difficile#!\n\n$zygia_heritage_desc$"
