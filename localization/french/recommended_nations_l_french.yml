  siculia_start: "#t Siculia#!\nDifficulté: #Y Très difficile#!\n\n150 ans après leur défaite lors de la bataille de Nomae face à Syracuse, la tribu de Siculia est tout ce qui reste du grand empire sicèle de Ducetius, survivant tant bien que mal dans l'arrière-pays sicilien. Face à la colonisation implacable menée par les Grecs et les Carthaginois avides de pouvoir, tout espoir semble perdu pour la Siculia, vouée à disparaître dans les méandres de l'histoire aux côtés du reste de ses semblables. Le sort de la Siculia est-il vraiment scellé, ou un grand chef à l'image de Ducetius pourra-t-il émerger de l'obscurité pour défier des obstacles insurmontables et faire naître une nouvelle aube sicule sur la Sicile?"
  armenia_start: "#t Arménie#!\nDifficulté: #Y Normal#!\n\n$armenian_heritage_desc$"
