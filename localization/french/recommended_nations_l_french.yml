  #India
  maurya_start:0 "#t Maurya#! \nDifficulté: #Y Facile#! \n\n$maurya_heritage_desc$"
  anuradhpura_start: "#t Anurahapura#! \nDifficulté: #y Normal#! \n\nAnuradhapura domine l'île de Lanka à plus d'un titre ; non seulement c'est la nation la plus proche du continent, bénéficiant d'opportunités de commerce et de diplomatie que ses voisins n'ont tout simplement pas, mais Anuradhapura a également la chance d'être le site où la Sigiriya, une ancienne forteresse de grande puissance et merveille, domine et protège tout le paysage en dessous."
  chola_start: "#t Chola#! \nDifficulté: #y Normal#! \n\nLes rois tamouls de Chola, Chera et Pandya ont dominé le sud de l'Inde pendant le règne de Maurya. Instable et enclin à la guerre, le triumvirat a trop longtemps divisé le peuple tamoul. En les unissant sous une seule règle, nous prendrons notre place en tant que dirigeants légitimes du Tamilakam."
  pandya_start:0 "#t Pandya#! \nDifficulté: #Y Normal#! \n\n$pandyan_heritage_desc$"
  chera_start:0 "#t Chera#! \nDifficulté: #Y Normal#! \n\n$cheran_heritage_desc$"
  kalinga_start:0 "#t Kalinga#! \nDifficulté: #Y Normal#! \n\n$kalingan_heritage_desc$"
  zhangzhung_start:0 "#t Zhangzhung#! \nDifficulté: #Y Normal#! \n\n$zhangzhung_heritage_desc$"
  paurava_start:0 "#t Paurava#!\nDifficulté : #Y Difficile#!\n\n$paurava_heritage_desc$"
  nabhapakti_start:0 "#t Nabhapakti#!\nDifficulté : #Y Très difficile#!\n\n$nabhapakti_heritage_desc$"
  yaudheya_start:0 "#t Yaudheya#!\nDifficulté: #y Difficile#!\n\n$yaudheya_heritage_desc$"
  fungadulu_start: "#t Fugandulu#!\nDifficulté: #Y Normal#!\n\n$fugandulu_heritage_desc$"
