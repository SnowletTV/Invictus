 rel_flavor_persia.1.t:0 "Cultes de la Perse"
 rel_flavor_persia.1.desc:0 "Les cultes de la #E Perse#! sont nombreux, hauts en couleur et incroyablement attrayants à adopter. Il nous sera très facile d'adapter nos traditions religieuses, très malléables, aux cultes #E persans#! Il y a ceux que l'on appelle les #E Zoroastriens#!, qui vénèrent avant tout #E Ahura Mazda#!, le seigneur des cieux, et qui considèrent le prophète #E Zoroastre#! comme une figure importante. Ou peut-être le culte de #E Mithra#!, le seigneur de la lumière, exalté par les #E mages médiens#!. Nous pourrions, bien sûr, tenter d'imposer notre propre foi #E heptadique#! aux habitants de la #E Perse#!. Ou encore, nous pourrions nous tourner vers les cultes #E séleucides#! et #E macédoniens#! de #E Zeus#!, #E Aphrodite#! et #E Hadès#!, entre autres. Et puis il y a les terres de la #E Mésopotamie#! avec leurs dieux comme #E Ishtar#!, #E Ereshkigal#!, #E Humban#!.\n\nLe choix nous appartient. Décidons quel culte sera celui de l'avenir de la #E Perse#!."
 rel_flavor_persia.1.ai:0 "Ai only moment"
 rel_flavor_persia.1.a:0 "The great Ahura Mazda!"
 rel_flavor_persia.1.b:0 "The shining Mithra!"
 rel_flavor_persia.1.c:0 "We stand by our old gods!"
 rel_flavor_persia.1.d:0 "The thunderous Zeus!"
 rel_flavor_persia.1.e:0 "The might of Ishtar!"
 rel_flavor_persia.1.f:0 "The power of Vakhsh!"
 rel_flavor_persia.1.g:0 "The way of the Buddha!"