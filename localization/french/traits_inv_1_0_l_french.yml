 ##Hindu Deity Status Traits
 personal_deity_murugan:0 "Patronnage de Murugan"
 personal_deity_murugan_desc:0 "Murugan, le dieu rouge assis sur le paon bleu, qui est toujours jeune et resplendissant, en tant que dieu préféré des Tamouls, conduira notre peuple à la victoire!"
 personal_deity_kartikeya:0 "Patronnage de Kartikeya"
 personal_deity_kartikeya_desc:0 "Kartikeya, également connu sous les noms de Skanda, Kumara, Murugan, Mahasena, Shanmukha et Subrahmanya, est le dieu hindou de la guerre."
 personal_deity_ganga:0 "Patronnage de Ganga"
 personal_deity_ganga_desc:0 "Ganga est la déesse du fleuve sacré, le Gange, qui purifie et le renouvelle."
 personal_deity_shakti:0 "Patronnage de Shakti"
 personal_deity_shakti_desc:0 "Shakti est la déesse du pouvoir et de l'énergie dynamique."
 personal_deity_shiva:0 "Patronnage de Shiva"
 personal_deity_shiva_desc:0 "Shiva est le dieu de la transformation par la destruction et le seigneur de la danse."
 personal_deity_surya:0 "Patronnage de Surya"
 personal_deity_surya_desc:0 "Surya est le dieu du soleil, du courage et de la volonté."
 personal_deity_vishnu:0 "Patronnage de Vishnu"
 personal_deity_vishnu_desc:0 "Vishnu est le dieu omniprésent qui soutient le monde."
 personal_deity_buddha:0 "Patronnage de Buddha"
 personal_deity_buddha_desc:0 "Le fondateur de la foi bouddhiste.  Les idées bouddhistes continuent d'occuper une place importante dans notre pratique de l'hindouisme."
 personal_deity_krishna:0 "Patronnage de Krishna"
 personal_deity_krishna_desc:0 "Le huitième avatar de Vishnu bénira notre peuple avec amour et compassion et le conduira sur le chemin de la sainteté."
 #Buddhist Status Traits
 meditating:0 "Méditer"
 meditating_desc:0 "Ce personnage médite, dans l'espoir de percer les mystères de l'Univers en maîtrisant le chaos qui l'habite."
 sotapanna:0 "Sotapanna"
 sotapanna_desc:0 "En atteignant le stade de Sotapanna, première étape vers l'Éveil, ce personnage est devenu un « entré dans le courant », faisant ainsi ses premiers pas vers un état supérieur."
 sakadagami:0 "Sakadagami"
 sakadagami_desc:0 "La deuxième étape de l'illumination a été atteinte : l'esprit s'est libéré des chaînes qu'il s'était lui-même imposées et qui nous lient aux affaires de ce monde."
 anagami:0 "Anagami"
 anagami_desc:0 "En embrassant l'Anagami, ce personnage a brisé de manière irrévocable les chaînes fragiles qui entravaient son âme; nous savons qu'une vie après la mort dans le Ciel des Demeures Pures nous attend."
 arhat:0 "Arhat"
 arhat_desc:0 "La véritable nature de la réalité apparaît clairement; le chemin menant à l'Éveil est une route que maintes fois parcourue. Ce personnage est un arhat et a atteint le nirvana."
 samyaksambodhi:0 "Samyaksambodhi"
 samyaksambodhi_desc:0 "Tout ce qui constitue le Dharma t'est familier; aucune parabole ni aucun paradoxe ne vient troubler ton esprit. Partager ce que tu as accompli avec ceux qui t'entourent est désormais devenu un devoir sacré."

 #Illyric Cultist Traits
 sun_cultist:0 "Cultiste du Soleil"
 serpent_cultist:0 "Cultiste du Serpent"
 horseman_cultist:0 "Cultiste du Chevalier Thracien"

 sun_cultist_desc:0 "Le Culte du Soleil considère le Soleil comme une divinité en soi. Le Soleil était vénéré et considéré comme étant présent dans les animaux, en particulier les oiseaux aquatiques. Une partie de la tradition du Culte du Soleil implique l'incendie de feux de joie sur les sommets des montagnes. Le Culte du Soleil était le plus répandu parmi les Illyriens du nord."
 serpent_cultist_desc:0 "Le Culte du Serpent était répandu et très populaire dans le sud des terres illyriennes. Le serpent était considéré comme un symbole de fertilité et de puissance. Le Culte du Serpent était également connu pour créer des décorations, des gravures et construire des totems représentant des serpents."
 horseman_cultist_desc:0 "Le Culte du Chevalier Thracien était plus récent que les deux autres cultes, et a été principalement introduit pendant l'ère romaine. Le Chevalier Thracien venait de l'Est dans le pays des Daciens et des Thraciens, et faisait souvent partie des rites funèbres."

 wolf_cultist:0 "Cultiste du Loup"
 pirate_cultist:0 "Cultiste de la Piraterie"

 wolf_cultist_desc:0 "Le Culte du Loup était une fusion traditionnelle des croyances locales messapiennes avec la vénération des loups par les tribus italiques. Le loup était considéré comme sacré, puissant, et célèbrement les Romains vénéraient une louve femelle comme nourrice des fondateurs de Rome, Romulus et Reamus."
 pirate_cultist_desc:0 "Alors que les Illyriens commencent à conquérir les mers eux-mêmes, une nouvelle vénération des pratiques piratées s'est formée. Le Culte de la Piraterie incarne ce qu'il signifie devenir un fléau non seulement de l'Adriatique, mais de la mer méditerranée elle-même. C'est une vie de pirate pour moi!"

 #Cybele Gallus Traits
 gallus:0 "Gallus"
 gallus_desc:0 "Ce personnage s'est castré au nom d'Attis, le compagnon de la grande déesse Cybèle. Cela en valait-il la peine?"

 priest_king:0 "Prêtre-Roi"
 priest_king_desc:0 "En tant que responsable d'un vaste domaine religieux, [CHARACTER.GetPraenomen] Il gouverne de vastes territoires, comprenant des villages, des villes et des champs.  Le double rôle de [CHARACTER.GetHerHis], à la fois prêtre et souverain, place [CHARACTER.GetPraenomen] au cœur des affaires régionales, où il exerce une autorité qui rivalise avec celle des rois et des dynastes."

 hebrew_high_priest:0 "Grand Prêtre hébreu"  
 hebrew_high_priest_desc:0 "Au service du Temple sacré de Jérusalem, [CHARACTER.GetPraenomen] accomplit les rituels les plus importants et agit à titre d'intermédiaire principal entre le peuple et Dieu. En collaboration avec la Gerousia, un conseil des anciens, [CHARACTER.GetPraenomen] gouverne la ville de Jérusalem, supervisant à la fois ses affaires religieuses et administratives. [CHARACTER.GetPraenomen] porte l'éphod, un vêtement sacerdotal richement brodé, ainsi que le pectoral d'or appelé Hoshen, orné de douze pierres précieuses représentant les tribus d'Israël; le Hoshen renferme l'Urim et le Thummim, des outils divinatoires utilisés pour discerner la volonté de Dieu."  

 divine_blood:0 "Sang divin"
 divine_blood_desc:0 "On raconte que de l'ichor doré, mélangé avec du sang, circule dans les veines de [CHARACTER.GetPraenomen]. Il n'est pas surprenant que les gens voient quelque chose de divin dans son visage, car [CHARACTER.GetPraenomen] prétend descendre d'un dieu. Certains vont même jusqu'à l'adorer comme une divinité vivante."


#######################################################
 #Personality Traits
 #######################################################
 dull:0 "Insipide"
 dull_desc:0 "Il ne se passe pas grand-chose dans la tête de [CHARACTER.GetPraenomen], ce qui est plutôt ennuyeux lorsqu'il s'exprime devant des invités; cela rend également [CHARACTER.GetPraenomen] ennuyeux dans la chambre à coucher."
 dull_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Insipide#!."

 paranoid:0 "Paranoïaque"
 paranoid_desc:0 "[CHARACTER.GetPraenomen] a beaucoup de mal à faire confiance aux autres, et garde ses enemies aussi près que ses amis - en d'autres termes, très, très distants. Donc, si [CHARACTER.GetPraenomen] vous trahit un jour, ne le prenez pas personnellement - [CHARACTER.GetSheHe] a simplement agi en premier avant que vous ne puissiez le trahir."
 paranoid_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Paranoïaque#!."

 shy:0 "Gêné"
 shy_desc:0 "[CHARACTER.GetPraenomen] est assez timide, ce que tous ceux qui ont rencontré [CHARACTER.GetHerHim] ont remarqué. Toujours timide en présence des autres, qu'il s'agisse de personnes que [CHARACTER.GetSheHe] connaît depuis moins d'une minute ou depuis de nombreuses années, cette personne est également trop craintive pour nourrir la moindre ambition perfide."
 shy_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Gêné#!."

 xenophobic:0 "Xénophobe"
 xenophobic_desc:0 "Attaché à sa propre culture et à ses propres traditions tout en se montrant hostile envers toutes les autres, [CHARACTER.GetPraenomen] est, c'est le moins qu'on puisse dire, loin d'être la personne la plus tolérante qui soit. En favorisant de manière flagrante les siens, [CHARACTER.GetHerHis] a pour effet négatif de susciter la colère de ceux qui ne partagent pas la même culture."
 xenophobic_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Xénophobe#!."

 immature:0 "Immature"
 immature_desc:0 "[CHARACTER.GetPraenomen] fait preuve d'une maturité digne d'un enfant, ce qui complique la gestion des affaires tant à l'intérieur qu'à l'extérieur de l'État. Par ailleurs, un dirigeant immature risque davantage d'être sous-estimé par son entourage."
 immature_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Immature#!."

 impartial:0 "Impartial"
 impartial_desc:0 "[CHARACTER.GetPraenomen] est impartial et prête toujours une oreille attentive à quiconque cherche un jugement juste. Cela permet à [CHARACTER.GetHerHim] de s'attirer les faveurs de tous ses subordonnés, sans privilégier aucun groupe ni aucun individu par rapport aux autres."
 impartial_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Impartial#!."

 reclusive:0 "Reclus"
 reclusive_desc:0 "[CHARACTER.GetPraenomen] est un solitaire qui préfère la compagnie de ses livres et de ses pensées à celle des autres. [CHARACTER.GetSheHe] se retire souvent dans sa chambre, où [CHARACTER.GetSheHe] peut méditer et réfléchir à des questions plus profondes."
 reclusive_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Reclus#!."

 uncouth:0 "Rustre"
 uncouth_desc:0 "[CHARACTER.GetPraenomen] est l'incarnation même de la barbarie. Pourtant, même le comportement grossier a ses avantages, car [CHARACTER.GetPraenomen] s'entend généralement très bien avec les mercenaires, avec lesquels il boit du coucher du soleil jusqu'à bien après le lever du soleil."
 uncouth_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Rustre#!."

 cultured:0 "Cultivé"
 cultured_desc:0 "[CHARACTER.GetPraenomen] est l'incarnation même de la civilisation. Vraiment, sa disposition attrayante aide à la diplomatie, et être bien instruit offre également des avantages pour la recherche sur une échelle plus locale."
 cultured_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Cultivé#!."

 obsessive_perfectionist:0 "Perfecctionniste obsessionnel"
 obsessive_perfectionist_desc:0 "[CHARACTER.GetPraenomen] est un perfectionniste obsessionnel, toujours à la recherche de la perfection dans tout ce qu'il entreprend. [CHARACTER.GetHerHe] ne se contente jamais de résultats médiocres et s'efforce toujours d'atteindre l'excellence, même si cela signifie passer des heures à peaufiner les moindres détails."
 obsessive_perfectionist_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Perfecctionniste obsessionnel#!."

 intimidating:0 "Intimidant"
 intimidating_desc:0 "[CHARACTER.GetPraenomen] a une allure très intimidante. Même lorsque [CHARACTER.GetSheHe] tente de se montrer amical(e), [CHARACTER.GetSheHe] ne peut s'empêcher d'avoir l'air effrayant(e). Cela a toutefois une conséquence étrange : les personnes qui ont affaire directement à [CHARACTER.GetHerHim] sont beaucoup moins susceptibles de dépasser les limites ou de l'offenser."
 intimidating_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Intimidant#!."

 extravagant:0 "Extravagant"
 extravagant_desc:0 "[CHARACTER.GetPraenomen] est extrêmement extravagant, gaspillant beaucoup de sa richesse sur des choses superficielles et matérielles. En conséquence, sa disposition à faire cadeau aux envoys et aux souverains étrangers a gagné notre faveur en retour."
 extravagant_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Extravagant#!."

 overbearing:0 "Dominant"
 overbearing_desc:0 "[CHARACTER.GetPraenomen] a un habitude de sembler très domineur et arrogant envers ses sujets ainsi qu'envers les diplomates étrangers, toujours regardant vers le bas avec sa tête penchée vers le haut."
 overbearing_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Dominant#!."

 easygoing:0 "Coulant"
 easygoing_desc:0 "[CHARACTER.GetPraenomen] est un type plutôt décontracté, qui vit ses jours sans souci. Bien que cela permette à [CHARACTER.GetHerHim] de se lier facilement d'amitié avec les autres et d' être beaucoup moins strict avec ses sujets, sa supervision laxiste des troupes peut se traduire par des armées peu disciplinées."
 easygoing_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Coulant#!."

 two_faced:0 "Hypocrite"
 two_faced_desc:0 "Personne ne peut vraiment savoir ce qui se passe dans l'esprit de [CHARACTER.GetPraenomen], qui peut se montrer un ami généreux et bienveillant un jour, puis un ennemi cruel et amer le lendemain. Tout ce que l'on peut supposer, c'est qu'il ne faut pas lui faire confiance et que l'expression qu'il affiche sur son visage un jour donné n'est probablement qu'une façade."
 two_faced_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Hypocrite#!."

 inferiority_complex:0 "Complexe d'infériorité"
 inferiority_complex_desc:0 "[CHARACTER.GetPraenomen] tente toujours de surpasser ses pairs, même lorsque personne d'autre ne considère cela comme une compétition. Par conséquent, [CHARACTER.GetPraenomen] considère tout le monde comme un rival et gaspille son argent à construire les édifices les plus grands et les plus extravagants, même s'ils n'impressionnent personne."
 inferiority_complex_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Complexe d'infériorité#!."

 provocateur:0 "Provocateur"
 provocateur_desc:0 "[CHARACTER.GetPraenomen] est passé maître dans l'art de faire bouillir le sang de ses rivaux, en les poussant à des accès de rage qu'il retourne ensuite contre eux, ce qui met en difficulté ses rivaux et rehaussant son propre statut."
 provocateur_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Provocateur#!."

 forger:0 "Fraudeur"
 forger_desc:0 "[CHARACTER.GetPraenomen] est un maître de la tromperie et de la manipulation, capable de duper même les esprits les plus perspicaces. [CHARACTER.GetSheHe] utilise son intelligence et sa ruse pour obtenir ce qu'[CHARACTER.GetSheHe] veut, souvent au détriment des autres."
 forger_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Fraudeur#!."

 eccentric:0 "Eccentrique"
 eccentric_desc:0 "[CHARACTER.GetPraenomen] a une façon très… étrange… de faire les choses, que ce soit dans la manière dont [CHARACTER.GetHerHis] s'exprime ou dans la façon dont [CHARACTER.GetSheHe] mène sa vie quotidienne. Même si certains peuvent se sentir mal à l'aise en sa présence, on ne peut nier que tout ce que fait [CHARACTER.GetPraenomen] fonctionne."
 eccentric_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Eccentrique#!."

 charming:0 "Charismatique"   #changed from Charming
 charming_desc:0 "[CHARACTER.GetPraenomen] dégage un charme et une sympathie qu'il ne faut pas sous-estimer : [CHARACTER.GetPraenomen] pourrait bien être un imbécile sans instruction, mais [CHARACTER.GetSheHe] n'en attire pas moins des partisans et des admirateurs dans tout le royaume, le simple fait d'être en sa présence suffisant à susciter cet engouement."
 charming_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Charismatique#!."

 midas_touched:0 "Touché par Midas"   #changed from Charming
 midas_touched_desc:0 "[CHARACTER.GetPraenomen] a reçu des dieux le don de tirer profit de presque rien. Doté d'un talent exceptionnel pour la gestion de l'or et de la monnaie, ce don ne présente que très peu d'inconvénients, contrairement à la malédiction déguisée dont souffrait le pauvre roi Midas."
 midas_touched_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Touché par Midas#!."

 patient:0 "Patient"
 patient_desc:0 "[CHARACTER.GetPraenomen] a une patience incroyable, que ce soit pour gérer les États étrangers, attendre le tribut de ses sujets, ou avoir la patience de faire sécher un fort par la torture lors d'un siège."
 patient_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Patient#!."

 impatient:0 "Impatient"
 impatient_desc:0 "[CHARACTER.GetPraenomen] est physiquement incapable de tolérer même une seconde de retard ; bien que son impatience stricte contribue à une construction plus rapide, cette impatience ne lui vaut aucun crédit auprès de la classe ouvrière."
 impatient_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Impatient#!."

 well_connected:0 "De bons contacts"
 well_connected_desc:0 "[CHARACTER.GetPraenomen] est une personne qui compte de nombreux amis et qui excelle à tisser des liens avec des personnalités influentes issues de tous les horizons. Se constituer un vaste cercle d'amis présente également des avantages, car [CHARACTER.GetPraenomen] s'entoure de nombreux esprits brillants de son époque."
 well_connected_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y De bons contacts#!."

 narcissistic:0 "Narcissiste"
 narcissistic_desc:0 "[CHARACTER.GetPraenomen], tout comme Narcisse, pourrait passer des journées entières à contempler son propre reflet dans un étang. Malheureusement, personne d'autre ne semble comprendre pourquoi [CHARACTER.GetSheHe] s'aime autant."
 narcissistic_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Narcissiste#!."

 pacifist:0 "Pacifiste"
 pacifist_desc:0 "[CHARACTER.GetPraenomen] est, au fond de lui-même sincèrement pacifiste. Moins enclin à déclarer la guerre et plus disposé à accepter la paix, son attitude lui a valu la faveur des États étrangers, ainsi que celle des hommes libres qui, habituellement, seraient enrôlés dans des guerres sanglantes et parfois sans but précis."
 pacifist_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Pacifiste#!."

 carouser:0 "Fêtard"
 carouser_desc:0 "Fêtard dans l'âme, [CHARACTER.GetPraenomen] apprécie autant la compagnie de bons amis que celle du vin. En invitant sans cesse ses collègues et des diplomates à des fêtes somptueuses, [CHARACTER.GetPraenomen] tisse, sans s'en rendre compte, un réseau de relations grâce à son amour pour le vin et les banquets."
 carouser_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Fêtard#!."

 pillager:0 "Pilleur"
 pillager_desc:0 "[CHARACTER.GetPraenomen] est un brigand qui n'a aucun scrupule à étendre sa propre richesse au détriment des autres. S'emparant autant que possible de butin tant pendant les guerres que pendant la paix, [CHARACTER.GetPraenomen] n'a également aucun problème à s'associer avec les pirates qui pillent de manière similaire les villes aisées le long de la côte."
 pillager_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Pilleur#!."

 pyromaniac:0 "Pyromane"
 pyromaniac_desc:0 "[CHARACTER.GetPraenomen] apprécie la vue des objets enflammés (et des êtres vivants). Quel est exactement la source de ce plaisir déformé ? Personne ne sait. Tout ce qui compte, c'est que cela permet d'exécuter des sièges plus efficaces (et sans pitié) et des tactiques de terre brûlée - mieux vaut ne pas poser de questions supplémentaires."
 pyromaniac_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Pyromane#!."

 pessimistic:0 "Pessimiste"
 pessimistic_desc:0 "[CHARACTER.GetPraenomen] a du mal à voir le bon côté des choses. La plupart du temps, [CHARACTER.GetSheHe] voit le verre à moitié vide."
 pessimistic_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Pessimiste#!."

 trustworthy:0 "Digne de confiance"
 trustworthy_desc:0 "Si jamais tu te demandes qui est de ton côté, tu peux toujours compter sur [CHARACTER.GetPraenomen] pour te soutenir, que [CHARACTER.GetSheHe] soit un ami, un allié ou un sujet."
 trustworthy_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Digne de confiance#!."

 resourceful:0 "Ingénieux"
 resourceful_desc:0 "[CHARACTER.GetPraenomen] est d'une ingéniosité sans pareille. Si vous ne donniez à [CHARACTER.GetPraenomen] que quelques planches de bois, [CHARACTER.GetSheHe] parviendrait sans doute à en faire quelque chose d'utile."
 resourceful_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Ingénieux#!."

 gladiator:0 "Gladiateur"
 gladiator_desc:0 "[CHARACTER.GetPraenomen] est prêt à affronter tout ce qui se dresse sur son chemin."

 drunkard:0 "Saoulard"
 drunkard_desc:0 "[CHARACTER.GetPraenomen] n'apprécie pas plus un bon verre que n'importe qui d'autre, mais [CHARACTER.GetSheHe] l'apprécie bien davantage et est largement connu(e) pour sa tendance à abuser de l'alcool."
 drunkard_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Saoulard#!."

# seducer:0 "Seducer"
# seducer_desc:0 "[CHARACTER.GetPraenomen] possesses a slick tongue, as well as a character oozing with charisma. This aspect of [CHARACTER.GetHerHis] character also helps [CHARACTER.GetPraenomen] get what [CHARACTER.GetSheHe] wants in regards to more adulterous affairs."
# seducer_bad_tooltip:0 "This option is #Y exclusive#! because your ruler has the #Y Seducer#! trait."

 artist:0 "Artisan"
 artist_desc:0 "Réputé(e) pour sa précision et son souci du détail, [CHARACTER.GetPraenomen] préfère se concentrer sur son art et laisser les combats à d'autres chaque fois que c'est possible."

# philosopher:0 "Philosopher"
# philosopher_desc:0 "Relishing in debate and study, [CHARACTER.GetPraenomen] is acutely interested in understanding human behavior and the application of reason.\n\n#G Characters with this trait can generate additional Innovations if assigned to a Research position. This effect can stack.#!"

 explorer:0 "Explorateur"
 explorer_desc:0 "[CHARACTER.GetPraenomen], désireux de (littéralement) laisser son empreinte sur la carte, est animé d'un désir insatiable de repousser les limites de ce qui est connu et de s'aventurer en terres inconnues."

 insecure:0 "Inquiet"
 insecure_desc:0 "[CHARACTER.GetPraenomen] se demande sans cesse ce que les gens disent dans son dos."
 insecure_bad_tooltip:0 "Cette option est #Y disponible#! car votre souverain possède le trait #Y Insecure#!."

