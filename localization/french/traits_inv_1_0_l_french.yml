 comradely:0 "Dans un esprit de camaraderie"
 comradely_desc:0 "Une personne digne de confiance et loyale, qui veillera à vos intérêts autant qu'aux siens."

 equestrian:0 "Cavalier"
 equestrian_desc:0 "Qu'il se détende à la campagne ou qu'il soit au cœur de la bataille, [CHARACTER.GetPraenomen] n'est jamais loin de sa selle."

