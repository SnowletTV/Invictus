l_french:

 game_rules: "Règles du jeu"
 select_country_first: "[Select_CString(LobbyView.HasSelectedPlayable, '', 'Select a country first.')]"
 select_country_first_tooltip: "Select a country first."
 diadochi_old: "Nouvelle mécanique Diadochi CB"
 diadochi_old_desc: "Ne nécessite pas d'assiéger la capitale de la province (pour des raisons techniques). \n#Y Désactiver pour l'expérience vanille#!"
 diadochi_names: "Noms dynastiques des diadoques"
 diadochi_names_desc: "Tous les dirigeants diadoques se sont couronnés du titre de Basileus. Pour assurer leur domination dans les régions de Macédoine et de Thrace, les Antipadrides et les Lysimaques pourraient officiellement faire de leurs royaumes un domaine personnel de leurs dynasties. \n#Y Activer pour les noms dynastiques Diadochi#!"
 host_rules: "Seul l'hôte peut modifier les règles"

 food_mechanic_game_rule: "Mécanicien alimentaire saisonnier"
 food_mechanic_game_rule_desc: "Invictus ajoute des mécanismes alimentaires saisonniers qui rendent le système alimentaire beaucoup plus réaliste et percutant. \n#Y Désactiver pour l'expérience vanille#!"

 mauryan_collapse_game_rule: "Effondrement de Maurya"
 mauryan_collapse_game_rule_desc: "Après la mort d'Ashoka Maurya, l'Empire Maurya a une chaîne d'événements scénarisés pour simuler leur effondrement historique. \n#Y Désactiver pour empêcher Mauryan de s'effondrer à la mort d'Ashoka#!"

 bigger_revolts_game_rule: "Grandes révoltes"
 bigger_revolts_game_rule_desc: "Invictus ajoute une mécanique qui rend les révoltes plus meurtrières en les regroupant lorsque plusieurs provinces sont sur le point de se révolter en même temps. #! \n#Y Désactiver pour l'expérience vanille#!"

 galation_invasion_game_rule: "Invasion galate"
 galation_invasion_game_rule_desc: "Invictus ajoute l'invasion celtique historique de l'Anatolie pour simuler la migration historique des tribus galates. \n#Y Désactiver pour empêcher l'invasion galate#!"

 gender_rules_desc:0 "Avec les règles #Y mixtes#!, si vous le désirez, vous pouvez instaurer l'égalité des sexes dans le pays que vous jouez.\nAvec les règles #Y fixes#!, ces règles resteront celles fixées par avance."

 advanced_ai_name: "IA avancée"
 advanced_ai_features: "Les capacités des pays dotés d'IA seront améliorées d'une manière jugée trop puissante ou « méta » pour être activée par défaut. #E Aucune triche n'est impliquée.#!\n- Recruter davantage de mercenaires et, parfois, les soudoyer.\n- Prévenir certaines guerres civiles qu'ils ne pourraient normalement pas empêcher.\n- Se développer davantage en tant que tribus, avec une plus grande probabilité de se réformer.\n- Effectuer un plus grand nombre d'investissements dans les provinces.\n- Déplacer manuellement la population des colonies vers les villes."
 advanced_ai_tooltip: "#Y $advanced_ai_name$#!:\n\n$advanced_ai_features$\n\n#T Certaines fonctionnalités peuvent être désactivées dans l'onglet « Règles du jeu ».#!\nActivez ce paramètre pour une IA nettement plus difficile."
 non_host_advanced_ai_tooltip: "$host_rules$\n\n$advanced_ai_tooltip$"
 advanced_ai_desc: "$advanced_ai_features$\n#R Certaines fonctionnalités peuvent être désactivées à l'aide des règles de jeu ci-dessous.#!\n#Y Activez ce paramètre pour une IA nettement plus difficile.#!"

 ahistorical_formables_name: "Permettre la formation de pays non historiques"
 ahistorical_formables_desc: "Permet à l'IA de former des pays qui ne sont pas historiquement formables."

 advanced_ai_mercenaries_name: "Désactiver le recrutement personnalisé de mercenaires"
 advanced_ai_character_loyalty_name: "Désactiver la résistance accrue aux guerres civiles"
 advanced_ai_tribal_development_name: "Désactiver le développement tribale amélioré"
 advanced_ai_province_investment_name: "Désactiver les investissements de province accrus"
 advanced_ai_move_population_name: "Désactiver le déplacement manuel de la population"
 advanced_ai_configuration_tooltip: "N'a aucun effet à moins que $advanced_ai_name$ ne soit activé"

 ai_road_building_name: "Construction de routes par l'IA"
 ai_road_building_desc: "Les pays contrôlés par l'IA construiront des routes dans leurs territoires, reliant les régions, les états et potentiellement même les villes individuelles au fil du temps.\n#R Vous pouvez limiter la construction de routes par l'IA en utilisant les règles de jeu ci-dessous.#!\n#Y Désactiver pour interdire aux pays contrôlés par l'IA de construire des routes.#!"

 ai_road_building_only_major_powers_name: "Seuls les grands et les puissances majeures peuvent construire des routes"
 ai_road_building_only_major_powers_tooltip: "Les pays contrôlés par l'IA ne construiront des routes que s'ils ont un rang de puissance majeure ou grande puissance. Notez qu'ils pourraient encore être capables de le faire dans leurs sujets de rang inférieur.\n$ai_road_building_configuration_tooltip$"
 ai_road_building_only_great_powers_name: "Seules les grandes puissances peuvent construire des routes"
 ai_road_building_only_great_powers_tooltip: "Les pays contrôlés par l'IA ne construiront des routes que s'ils ont un rang de grande puissance. Notez qu'ils pourraient encore être capables de le faire dans leurs sujets de rang inférieur.\n$ai_road_building_configuration_tooltip$"
 ai_road_building_low_density_effect: "AI countries will only build roads to connect capitals of the regions they control, leading to a lower road density."
 ai_road_building_low_density_name: "Ne construisez que des routes principales tout au long du jeu"
 ai_road_building_low_density_tooltip: "$ai_road_building_low_density_effect$\n$ai_road_building_configuration_tooltip$"
 ai_road_building_scaling_density_name: "Ne construis des routes principales qu'en fin de partie"
 ai_road_building_scaling_density_tooltip: "$ai_road_building_low_density_effect$ Cette restriction sera levée vers l'an 650 (104 av. J.-C.).\n$ai_road_building_configuration_tooltip$"
 ai_road_building_player_subjects_name: "Autoriser la construction de routes dans les territoires des joueurs"
 ai_road_building_player_subjects_tooltip: "Normalement, les seigneurs de l'IA n'ont pas le droit de construire des routes dans les pays assujettis contrôlés par le joueur, mais l'activation de cette règle leur permettra de le faire.\n$ai_road_building_configuration_tooltip$"
 ai_road_building_configuration_tooltip: "N'a d'effet que si la règle de jeu $ai_road_building_name$ est activée."

 merc_buyoff_stack_limit: "Nous ne dépassons PAS notre capacité actuelle en matière de mercenaires."
 legion_with_commander_slots: "Notre légion doit compter moins de quatre commandants."
 wooed_our_general:0 "Wooed General"

 ai_clear_state_trade_routes: "Réinitialiser les routes commerciales de l'IA"
 ai_restore_state_trade_routes: "Restaurer les routes commerciales de l'IA"
 ai_avoiding_to_invoke_devotio: "L'IA évite d'invoquer la Dévotion"

 ai_major_agressive_name: "Grandes puissances chaotiques"
 ai_major_agressive_desc: "Toutes les puissances majeures contrôlées par l'IA seront extrêmement agressives et prêtes à prendre une expansion considérablement plus agressive. \n#R Attention : cela ne les rendra pas plus performants, ils seront simplement plus chaotiques, en fin de partie, ils pourraient même être plus faibles.#! \n#Y Enable pour les puissances majeures extrêmement agressives AI.#!"

 ai_all_agressive_name: "IA chaotique"
 ai_all_agressive_desc: "Toutes les nations contrôlées par l'IA seront extrêmement agressives et prêtes à prendre une expansion plus agressive. \n#R Attention : cela ne les rendra pas plus performants, ils seront simplement plus chaotiques, en fin de partie, ils pourraient même être plus faibles. \n#Y Activer pour une IA générale plus agressive.#!"

