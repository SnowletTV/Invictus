l_french:
 #event

 zorgo_event.1.t: "Régler ses comptes"
 zorgo_event.1.desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], il y a une affaire délicate qui nécessitera votre attention personnelle. Nous avons reçu des informations selon lesquelles [SCOPE.sCharacter('random_dude').GetName] aurait menacé de tuer [SCOPE.sCharacter('random_dude_2').GetName] à cause d’un différend immobilier; il semblerait qu’ils convoitent tous deux la même propriété à [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] et qu’aucun des deux ne cède. La guerre des mots n’a cessé de s’intensifier au cours des dernières semaines, et hier soir encore, [SCOPE.sCharacter('random_dude_2').GetFirstName] a été agressé devant la maison de [SCOPE.sCharacter('random_dude_2').GetHerHis] et a été sévèrement roué de coups, ce qui lui a finalement coûté un œil.\n\nBien que nous ne vous importunions normalement pas avec de telles affaires, votre lien de parenté avec [SCOPE.sCharacter('random_dude').GetFirstName] complique la situation - [SCOPE.sCharacter('random_dude_2').GetFirstName] raconte à tout le monde que vous avez envoyé vos hommes de main là-bas pour donner une leçon à [SCOPE.sCharacter('random_dude_2').GetHerHim], et les gens commencent à le croire."
 zorgo_event.1.a: "Envoyez à [SCOPE.sCharacter('random_dude_2').GetFirstName] un cadeau provenant du trésor, ainsi que nos excuses les plus sincères"
 zorgo_event.1.b: "Dites à ce fou de garder la bouche fermée s’il veut conserver l’autre !"

 zorgo_event.2.t: "Une découverte curieuse"
 zorgo_event.2.desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], un paysan travaillait dans les champs près de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] quand une étrange anomalie a été découverte; un idole en argent d'un dieu rustique et oublié, recouvert de runes étranges qui sont indéchiffrables. [SCOPE.sCharacter('priest').GetName], qui est un expert dans de telles affaires, a déclaré qu'un esprit maléfique était piégé à l'intérieur de la statue et que nous avions involontairement déchaîné une malédiction. Bien que [SCOPE.sCharacter('priest').GetFirstName] ait dit que ceci est un mauvais présage pour notre peuple, tout le monde n'est pas convaincu que ceci soit un coup de malchance."
 zorgo_event.2.a: "Fondez la statue et faites-en des pièces - je ne crains pas d'un ancien esprit"
 zorgo_event.2.b: "Dites à [SCOPE.sCharacter('priest').GetFirstName] de la reterrer sur le même endroit et de faire des sacrifices"

 zorgo_event.3.t: "Un cadeau de la mer"
 zorgo_event.3.desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] était profondément endormi dans [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] chambre quand, soudain, il y eut des cris perçants et les sons de meubles brisés, arrachant [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] à [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] rêves. Il y eut un éclair d'acier, et quelques moments paniqués plus tard, les gardes du corps de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] tenaient [SCOPE.sCharacter('dumbass').GetName] au sol.\n\nCe qui vint ensuite fut une histoire si ridicule, si étrange, que pour un moment, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] pensa qu'elle était encore un rêve. Mais non, cela arriva effectivement; il semble que [SCOPE.sCharacter('dumbass').GetFirstName], clairement un simplet, ait acheté un énorme thon au marché aux poissons et l'ait apporté à [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] comme cadeau. Comment il réussit à contourner vos sentinelles au milieu de la nuit reste un mystère.\n\nLorsqu'on lui demanda plus de détails, [SCOPE.sCharacter('dumbass').GetFirstName] continuait à pleurer la même histoire - 'C'est le plus grand poisson que j'ai jamais vu, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], et je devais juste vous le donner. Je n'ai pas eu l'intention de faire du mal, sincère'. En toute équité, à côté des pieds de [SCOPE.sCharacter('dumbass').GetHerHis] se trouve véritablement le plus grand thon que vous ayez jamais vu."
 zorgo_event.3.a: "Euh... merci, je suppose? Voici, prenez quelques pièces pour vos ennuis"
 zorgo_event.3.b: "Gardes, frappez ce idiot avec le thon et jetez-les tous les deux dans la rue!"
 zorgo_event.3.c: "C'était la chose la plus stupide que vous ayez jamais faite, [SCOPE.sCharacter('dumbass').GetFirstName]."
 zorgo_event.4.t: "Observer le Maître"
 zorgo_event.4.desc: "Ces derniers temps, [SCOPE.sCharacter('heir').GetName] harcèle [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] presque quotidiennement avec une simple demande, une demande que [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] ne pourra plus ignorer très longtemps. Ce que [SCOPE.sCharacter('heir').GetFirstName] a demandé est assez simple, même si c’est un peu gênant; tout ce que [SCOPE.sCharacter('heir').GetSheHe] souhaite, c’est avoir la chance d’observer [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] lors de la prochaine réunion du Conseil. Étant quelque peu inexpérimenté en matière de politique, [SCOPE.sCharacter('heir').GetFirstName] aimerait observer « le Maître à l’œuvre », pour ainsi dire, dans l’espoir d’apprendre à composer avec les conseillers."
 zorgo_event.4.a: "Tu peux t'asseoir derrière moi, mais reste tranquille et ne te montre pas trop enthousiaste."
 zorgo_event.4.b: "Un jour, tu auras tout le temps d’apprendre par toi-même"

 zorgo_event.5.t: "Des greniers débordants"
 zorgo_event.5.desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], les récoltes ont été si abondantes cette année que nous n’avons plus de place pour entreposer le blé. Les greniers que nous avons construits près de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] sont pleins à craquer, et il n’y a tout simplement plus de place pour ce que nous avons en stock — nous n’aurons d’autre choix que de vendre l’excédent au marché."
 zorgo_event.5.a: "Nous sommes heureux de ne manquer de nourriture — que le peuple se réjouisse !"

 zorgo_event.6.t: "Le collecteur d’impôts assassiné"
 zorgo_event.6.desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], nous sommes au regret de vous informer que l’un de nos collecteurs d’impôts, un homme nommé [SCOPE.sCharacter('taxman').GetName], a été retrouvé poignardé à mort dans les rues de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]. Tout le monde affirme que [SCOPE.sCharacter('taxman').GetFirstName] avait les doigts crochus et détournait bien plus d’argent qu’il ne le devait. Même si cela est vrai, cet homme méritait-il une mort aussi violente ? À présent, les habitants refusent de nous dire qui est responsable du crime, malgré les menaces de nos soldats... cela n’augure rien de bon."
 zorgo_event.6.a: "C’est terriblement contrariant... adieu, [SCOPE.sCharacter('taxman').GetFirstName]"

 zorgo_event.7.t: "Raid barbare"
 zorgo_event.7.desc: "Nous avons une terrible nouvelle à vous annoncer ce matin, ô [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. Une bande de pillards barbares a ravagé la région de [temple_province.GetName], traversant la rivière au milieu de la nuit et prenant nos gardes par surprise. Non seulement les bandits ont réussi à voler un peu d’or, ce qui est déjà grave, mais ils ont tué des habitants, ce qui est pire encore — notre peuple pleure aujourd’hui ses morts et ses biens perdus."
 zorgo_event.7.a: "Nous ferons tout ce qui est en notre pouvoir pour punir les responsables !"

 zorgo_event.8.t: "Une chanson pour [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]"
 zorgo_event.8.desc: "Il y a quelques jours, deux troubadours de renom, connus pour chanter à l’unisson, [SCOPE.sCharacter('bard').GetName] et [SCOPE.sCharacter('bard_2').GetName], sont arrivés à [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] et ont demandé une audience avec [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] dès que [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] en aurait le temps. La raison de leur visite était connue avant même leur arrivée dans notre capitale, car la réputation de [SCOPE.sCharacter('bard').GetFirstName] et de [SCOPE.sCharacter('bard_2').GetFirstName] les précédait assurément, et leur dernier chef-d’œuvre, un poème épique intitulé « Les exploits de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] », fait jaser la ville depuis des semaines.\n\nLes deux poètes ont humblement demandé à pouvoir se produire, et plus tard dans la soirée, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] aura l’honneur d’entendre cette célèbre œuvre récitée en personne."
 zorgo_event.8.a: "Au moins, le sujet sera intéressant..."

 zorgo_event.9.t: "Un complot découvert"
 zorgo_event.9.desc: "At the last moment, our agents uncovered a plot to have [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] assassinated, and as more and more details are revealed, the scandal continues to grow, shocking the inhabitants of [SCOPE.GetRootScope.GetCountry.GetCapital.GetName].\n\nThe rot runs deep; it seems that the perpetrators were able to persuade one of [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]'s relatives, [SCOPE.sCharacter('cousin').GetName], to join their number. Indeed, [SCOPE.sCharacter('cousin').GetFirstName] was the linchpin of the entire operation, for it was hoped that [SCOPE.sCharacter('cousin').GetSheHe] would have been able to bring [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] someplace secluded where the murderers would have been hiding. In fact, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] was supposed to pay a visit tomorrow afternoon... \n\nWhen the intrigue was discovered, [SCOPE.sCharacter('cousin').GetFirstName] tried to flee in the middle of the night, hoping to find a ship to take [SCOPE.sCharacter('cousin').GetHerHim] anywhere, but was arrested at the harbor. What shall we do?"
 zorgo_event.9.a: "Jetez [SCOPE.sCharacter('cousin').GetFirstName] dans le puits le plus profond... pour l’instant"

 zorgo_event.10.t: "Le marchand errant"
 zorgo_event.10.desc: "Il y a quelques jours, un étranger nommé [SCOPE.sCharacter('euthymios').GetName] a été appréhendé aux abords de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] et conduit devant [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], qui lui a demandé de s’expliquer. Dans une vie antérieure, [SCOPE.sCharacter('euthymios').GetFirstName] était marchand et venait de la ville de [GetProvince('(int32)416').GetName], mais les troubles politiques qui agitaient sa cité natale ont entraîné son bannissement. Après avoir erré pendant des années, Euthymios a enfin atteint nos terres, démuni et épuisé.\n\nUne fois devant [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], Euthymios tend une minuscule bourse et tombe à genoux. « Je vous en prie, noble seigneur, acceptez tout ce qu’il me reste dans cette vie, mais permettez-moi de rester ici auprès de vous. Je ne peux pas aller plus loin. »\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] est enclin à faire preuve de clémence, mais les habitants ne manqueront certainement pas de se plaindre, eux qui ne souhaitent pas vivre avec le marchand exilé parmi eux."
 zorgo_event.10.a: "Notre hospitalité envers les étrangers est légendaire ; vous pouvez rester parmi nous"
 zorgo_event.10.b: "Dites à cet idiot de quitter notre cité immédiatement ! Quelle idée absurde"

 zorgo_event.11.t: "Vent tissé"
zorgo_event.11.desc: "Bien que [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] soit connu pour apprécier les plaisirs raffinés de la vie, [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] est dernièrement perturbé par les signes croissants d’une richesse extravagante dans notre société. Beaucoup trop de nos nobles dépensent leur argent à importer des vêtements de soie, que l’on appelle communément le « vent tissé » en raison de leur nature vaporeuse, et les rues sont remplies de dandys qui passent leurs journées à parler de mode, ce qui n’est certainement pas une vertu [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName].\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] envisage de restreindre ces frivolités, mais sait pertinemment que les élites culturelles pourraient s’y opposer."
zorgo_event.11.a: "Trop, c’est trop : interdisons le port de vêtements de soie pendant un an"
zorgo_event.11.b: "Bah ! J’ai des choses plus importantes à régler... laissez-moi tranquille"

zorgo_event.12.t: "Exposition au Grand Cothon"
zorgo_event.12.desc: "Nous avons appris qu’une grande inauguration doit avoir lieu au Grand Cothon de [GetProvince('(int32)3256').GetName], car des rénovations récentes sont achevées dans le quartier portuaire et les architectes ont hâte de présenter leurs dernières réalisations. Seules les familles les plus prestigieuses ont été invitées à l’exposition, ce qui inclut naturellement [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. L’élite de la société [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName] sera présente, et l’événement s’annonce rapidement comme le plus commenté de l’année.\n\nBien qu’être invité soit un grand honneur, le voyage aura un coût ; la décision vous revient, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]. Le peuple voudra certainement que son dirigeant y assiste, mais nos trésors peuvent-ils se le permettre ?"
zorgo_event.12.a: "Voyager coûte cher, mais élargit l’esprit : nous irons !"
zorgo_event.12.b: "Je suis trop occupé pour m’y rendre moi-même, mais j’ai hâte d’en entendre parler"

zorgo_event.13.t: "Offrandes à Tannit"
zorgo_event.13.desc: "Tous les cinq ans, toutes les nations qui se souviennent de la déesse Tannit et de ses bontés sont tenues d’envoyer un présent à son temple de [GetProvince('(int32)3256').GetName], une tradition séculaire que notre peuple est plus qu’heureux de perpétuer.\n\nÀ l’approche de la cérémonie, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] s’est vu rappeler par [SCOPE.sCharacter('jerk').GetName] que nous n’avions pas envoyé les tributs la dernière fois, ayant demandé un délai en raison de difficultés financières. C’est regrettable, mais nous devons envoyer le double de la somme si nous voulons rester dans les bonnes grâces de la déesse."
zorgo_event.13.a: "Que sommes-nous sans les dieux ? Même si cela fait mal, envoyez les fonds"
zorgo_event.13.b: "Je me moque de ce que j’ai promis : nous n’avons pas les moyens"

zorgo_event.14.t: "Contraint d’intervenir dans un conflit commercial"
zorgo_event.14.desc: "Bien que nous fassions de notre mieux pour ne pas vous déranger, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], une affaire délicate nécessite votre intervention personnelle. Deux marchands, [SCOPE.sCharacter('random_bro').GetName] et [SCOPE.sCharacter('random_bro_2').GetName], se sont lancés dans une dispute très publique et très sordide au sujet d’un terrain en bord de mer près de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] : il semble qu’ils veuillent tous deux les mêmes entrepôts pour y stocker des amphores. Ce sont deux marchands ambitieux, rivaux sur la place publique, et leur guerre des mots risque de dégénérer en violence si rien n’est fait.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] devra rendre son jugement, et il n’existe aucune solution facile : quelqu’un sera forcément contrarié."
zorgo_event.14.a: "J’ai choisi [SCOPE.sCharacter('random_bro_2').GetName]"
zorgo_event.14.b: "De toute évidence, [SCOPE.sCharacter('random_bro').GetName] le mérite davantage"
zorgo_event.14.c: "Menacez-les tous deux d’exil s’ils ne cessent pas de se quereller"

 zorgo_event.15.t: "Restauration du temple de Melqart"
 zorgo_event.15.desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], nous avons reçu la nouvelle d’un terrible présage dans la province de [GetProvince('(int32)743').GetName]. Un effroyable tremblement de terre a dévasté le temple de Melqart, et les prêtres de Tyr ont envoyé des messagers dans toutes les cités [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName], demandant des aumônes pour aider à restaurer le lieu sacré endommagé. De grandes fissures sont apparues dans le stylobate de l’édifice, et l’on craint que le temple tout entier ne s’effondre si les travaux ne commencent pas immédiatement.\n\nBien que les demandes d’argent ne soient jamais les bienvenues, on sait que Melqart prend soin de ses fidèles ; nos citoyens seraient très heureux de savoir qu’ils ont contribué."
 zorgo_event.15.a: "Puisque les dieux prennent soin de nous, nous prendrons soin d’eux"
 zorgo_event.15.b: "Nous envoyons déjà suffisamment de dîmes à Tyr : non"

 zorgo_event.16.t: "Le retour de l’explorateur"
 zorgo_event.16.desc: "Nous avons certainement entendu parler de [SCOPE.sCharacter('traveler').GetName], l’intrépide voyageur qui idolâtre Hannon le Navigateur, car toute cité ayant accès à la mer a entendu parler des audacieuses expéditions entreprises par [SCOPE.sCharacter('traveler').GetFirstName]. Guidé uniquement par les notes d’Hannon, [SCOPE.sCharacter('traveler').GetFirstName] prend la mer chaque saison, s’aventurant toujours plus loin le long de la côte africaine avant de rentrer chez lui, souvent avec des marchandises exotiques à vendre et des récits qui valent leur pesant d’or.\n\nImaginez donc notre surprise lorsque le légendaire explorateur est passé par [SCOPE.GetRootScope.GetCountry.GetCapital.GetName], demandant à rencontrer [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. Il semble que, tout comme Hannon, [SCOPE.sCharacter('traveler').GetFirstName] ait rencontré l’étrange tribu du redoutable peuple gorillai, et qu’il soit disposé à nous vendre une curiosité si nous pouvons nous l’offrir. Notre peuple serait très intéressé de voir un tel spectacle de ses propres yeux..."
 zorgo_event.16.a: "Nous ne pouvons pas nous permettre cette dépense pour le moment"
 zorgo_event.16.b: "Qu’est-ce que c’est que ça ?! Je n’ai jamais rien vu de tel... il nous le faut"

 zorgo_event.17.t: "Un élève distrait"
 zorgo_event.17.desc: "[SCOPE.sCharacter('teacher').GetName] a été chargé d’enseigner à [SCOPE.sCharacter('pupil').GetName] tout ce qui concerne [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName] ; une tâche assez simple, pensions-nous, et qui paie fort bien le privilège d’instruire un membre de la noblesse. Malheureusement pour nous, [SCOPE.sCharacter('teacher').GetFirstName] se plaint que [SCOPE.sCharacter('pupil').GetFirstName] ne prête aucune attention aux leçons quotidiennes et s’endort souvent en plein cours. Lorsque [SCOPE.sCharacter('teacher').GetFirstName] lui a gentiment demandé de se concentrer, [SCOPE.sCharacter('pupil').GetFirstName] a jeté une coupe de vin au professeur, qui menace maintenant de démissionner !"
 zorgo_event.17.a: "Quelle insolence... menacez [SCOPE.sCharacter('pupil').GetFirstName] de représailles s’il ne s’améliore pas !"
 zorgo_event.17.b: "Je n’en ai absolument rien à faire : ne me dérangez plus avec cela"

 zorgo_event.18.t: "Des navires esclavagistes au port"
 zorgo_event.18.desc: "Nous avons appris que des pirates traversent actuellement la région et que les cales de leurs navires sont remplies d’esclaves qu’ils ont enlevés. Mais ce n’est pas tout : il semblerait que ces pillards soient poursuivis par ceux qu’ils ont attaqués et, craignant d’être rattrapés, ils tentent désormais de se débarrasser de leur butin mal acquis.\n\nSelon le chef des pirates, un scélérat nommé [SCOPE.sCharacter('pirate').GetName], leurs ennemis ne sont qu’à moins d’une journée derrière eux; le temps presse donc. En raison de leur précipitation, ils sont prêts à nous offrir des prix réduits…si nous acceptons de faire affaire avec eux."
 zorgo_event.18.a: "Nous ne nous mêlerons pas de cela : dites aux pirates de quitter nos eaux !"
 zorgo_event.18.b: "Achetez quelques esclaves"
 zorgo_event.18.c: "Nous achèterons tout ce qu’ils accepteront de vendre"

 zorgo_event.19.t: "Des mains sûres à la barre"
 zorgo_event.19.desc: "Un matin, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] cherchait à [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] un successeur, mais on lui a fait savoir que celui-ci était en mer, en train de s’entraîner aux manœuvres de voile avec notre marine.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] s’est réjoui de cette nouvelle, espérant que d’autres remarqueraient cet esprit de sacrifice et suivraient son exemple."
 zorgo_event.19.a: "Si seulement chacun prenait ses devoirs aussi au sérieux que nous..."

 zorgo_event.20.t: "Un orateur renommé"
 zorgo_event.20.desc: "Un orateur renommé, [SCOPE.sCharacter('orator').GetName], est arrivé à [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] et a fait savoir en secret que [SCOPE.sCharacter('orator').GetSheHe] serait heureux de prononcer un discours public en l’honneur de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], surtout si nous sommes capables de faire un petit don.\n\nComprenant que le don est tombé directement dans le laps de [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis], il n’y a pas d’hésitation de la part de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], et les préparatifs sont mis en place immédiatement."
 zorgo_event.20.a: "Je n’ai aucune hésitation à soutenir une cause aussi noble"

 zorgo_event.21.t: "Un signe de Jupiter"
 zorgo_event.21.desc: "[ROOT.GetCountry.GetRuler.GetName], we have heard a strange and disturbing tale that is making the rounds in [ROOT.GetCountry.GetCapital.GetName]. It seems that one of our citizens erected a colossal bronze statue of #E Herakles#! in the center of town, and almost immediately, a bolt of lightning struck the plinth and sent the metalwork crashing into the ground.\n\nOf course, everyone is taking this as a sign of [GetDeityDefinition('omen_jupiter').GetName|Y]'s displeasure, who is punishing us Romans for our hubris."
 zorgo_event.21.a: "Ordonnez que la statue soit enterrée et offrez des sacrifices"
 zorgo_event.21.b: "Allumez un immense feu et faites fondre l’idole pour en tirer des pièces"

 zorgo_event.22.t: "Le port d’Ostie"
 zorgo_event.22.desc: "Our architects report that the harbor at [GetProvince('(int32)15').GetName] is beginning to show signs of silting over, and unless we take the painful but necessary steps to start dredging the waters, we could have a long-term problem on our hands. Even now, the laborers at the docks have to work twice as hard to get the ships in and out, and many times, our sailors end up having to help and they are starting to complain."
 zorgo_event.22.a: "Je suppose que nous n’avons pas vraiment le choix"
 zorgo_event.22.b: "Dites aux hommes de travailler davantage ; nous ne pouvons pas nous permettre cette dépense"

 zorgo_event.23.t: "Disputes parmi l’aristocratie"
 zorgo_event.23.desc: "[SCOPE.sCharacter('random_dude_from_rome').GetName] et [SCOPE.sCharacter('random_dude_2_from_rome').GetName] ont tous deux abordé [ROOT.GetCountry.GetRuler.GetName], prenant [ROOT.GetCountry.GetRuler.GetHerHim] par surprise un agréable après-midi à [ROOT.GetCountry.GetCapital.GetName] et gâchant immédiatement l’ambiance.\n\nIl semble qu’un mariage ait été prévu entre les familles de [SCOPE.sCharacter('random_dude_from_rome').GetPraenomen] et de [SCOPE.sCharacter('random_dude_2_from_rome').GetPraenomen], mais des disputes au sujet de la dot ont provoqué une rupture irréparable, qui menace de gagner la sphère politique si nous n’intervenons pas. À présent, [SCOPE.sCharacter('random_dude_from_rome').GetFirstName] demande à [ROOT.GetCountry.GetRuler.GetFirstName] d’accepter d’entendre les détails sordides de l’affaire, dans l’espoir qu’une décision condamnant [SCOPE.sCharacter('random_dude_2_from_rome').GetFirstName] soit rendue.\n\nMalheureusement pour nous, cette affaire est trop retentissante et, quelle que soit notre décision, le peuple de #E Rome#! aura des opinions bien tranchées."
 zorgo_event.23.a: "Je siégerai avec honneur au tribunal, sachant que je ne peux pas gagner"
 zorgo_event.23.b: "Eh bien, voyons qui nous paiera le plus et prenons leur parti"

 zorgo_event.24.t: "Un étudiant fainéant"
 zorgo_event.24.desc: "On ne cesse d’entendre des plaintes selon lesquelles [SCOPE.sCharacter('heir').GetName] néglige ses leçons quotidiennes, évite d’étudier la grammaire grecque et préfère galoper sur son cheval préféré, Ungula Fulgens.\n\nMême à son très jeune âge, [SCOPE.sCharacter('heir').GetFirstName] est réputé pour ses prouesses à cheval — à vrai dire, l’enfant surpasse des hommes deux fois plus âgés que lui — et [ROOT.GetCountry.GetRuler.GetName] peut difficilement reprocher au garçon de vouloir un peu d’excitation, mais les roturiers commencent à se plaindre, affirmant qu’il faudrait exiger davantage d’un membre de notre famille."
 zorgo_event.24.a: "Embauchez les meilleurs tuteurs de grec et menacez [SCOPE.sCharacter('heir').GetFirstName]"
 zorgo_event.24.b: "Laissez l’enfant jouer... qu’est-ce qui pourrait lui faire du mal?"

 zorgo_event.25.t: "Célébrations improvisées"
 zorgo_event.25.desc: "Notre peuple est unique en son genre : quoi que le destin ou la fortune lui réservent, qu’il s’agisse de périodes de guerre et de souffrance ou d’années d’abondance et d’excès, il n’abandonne jamais les dieux, leur offrant sans cesse louanges et actions de grâce. Nous devrions nous estimer chanceux d’avoir des citoyens romains aussi pieux, car les dieux se réjouissent des célébrations improvisées qui ont lieu dans les campagnes."
 zorgo_event.25.a: "Comme c’est charmant!!"

 zorgo_event.26.t: "Des mesures sans précédent"
 zorgo_event.26.desc: "[ROOT.GetCountry.GetRuler.GetName], comme vous le savez, nos récentes campagnes nous ont laissés à court de main-d’œuvre – un fait que nous ne pouvons pas laisser nos ennemis découvrir, sous peine de courir à notre perte.\n\nEn cette période désespérée, il a été suggéré de réquisitionner certains esclaves pour les enrôler dans l’armée. Bien que cela aille certainement à l’encontre des précédents romains, nous n’avons peut-être pas d’autre choix. Le peuple se plaindra et notre stabilité en souffrira, mais avons-nous d’autres options?"
 zorgo_event.26.a: "J’aimerais ne pas avoir à faire cela, mais mes mains sont liées"
 zorgo_event.26.b: "Je ne permettrai jamais aux esclaves de combattre aux côtés des hommes libres"

 zorgo_event.27.t: "Tension au Sénat"
 zorgo_event.27.desc: "La noblesse de [ROOT.GetCountry.GetCapital.GetName] milite en faveur d’une modification de nos lois militaires, faisant valoir que nous avons fait preuve d’une trop grande indulgence en autorisant les classes inférieures à prendre les armes. En plus de rétablir les critères de richesse pour le service militaire, on a fait valoir que seuls les citoyens et les nobles devraient être autorisés à diriger nos troupes au combat.\n\nComme on le sait, les classes inférieures ne sont pas autorisées à interpréter les présages en observant les poulets sacrés, et l’idée de combattre sans connaître la volonté des dieux a grandement irrité les éléments les plus conservateurs de notre société."
 zorgo_event.27.a: "Donnez aux #Y Optimates#! ce qu’ils veulent"
 zorgo_event.27.b: "Je ne permettrai jamais aux esclaves de combattre aux côtés des hommes libres"

 zorgo_event.28.t: "Répartition par discipline"
 zorgo_event.28.desc: "Nous avons le regret de vous informer, ô [ROOT.GetCountry.GetRuler.GetName], que nos armées prennent de plus en plus l’habitude de piller les territoires étrangers qu’elles traversent, allant même jusqu’à ignorer les ordres leur enjoignant de laisser les habitants tranquilles. Nos généraux reconnaissent qu’il s’agit d’un problème, mais jusqu’à présent, personne n’a voulu punir les soldats comme il se doit, de crainte qu’un esprit de mutinerie ne s’empare des hommes."
 zorgo_event.28.a: "En guise de punition, pas de feux de camp pour le souper pendant cinq ans!"
 zorgo_event.28.b: "Réintroduire la décimation et ne faire preuve d'aucune clémence envers les coupables"

 zorgo_event.29.t: "L'oiseau qui parle"
zorgo_event.29.desc: "Un matin, un marchand nommé [SCOPE.sCharacter('random_talking_bird_merchant').GetName] se rendit sur le #E mont Palatin#! avec une offre intrigante : pour dix pièces d’or, il accepterait de vendre un corbeau parlant nommé « Mica Aurea », dressé à chanter les louanges de [ROOT.GetCountry.GetRuler.GetName]. Amusé par cette idée, [ROOT.GetCountry.GetRuler.GetFirstName] accepta d’assister à une démonstration dans la Curie.\n\nQuelques instants plus tard, cependant, l’oiseau se mit à croasser bruyamment : « [SCOPE.sCharacter('coruler_head_of_family').GetName] est le plus grand #E consul#! de l’histoire romaine » — quelle honte ! Il semble que [SCOPE.sCharacter('random_talking_bird_merchant').GetFirstName] ait appris à l’oiseau à prononcer plusieurs noms, et voilà que cette petite bête a ridiculisé [ROOT.GetCountry.GetRuler.GetFirstName] devant tout le monde ! Des éclats de rire se répandent dans la Curie."
 zorgo_event.29.a: "Je sais en rire quand c'est moi qui suis visé… ce n'est pas grave"
 zorgo_event.29.b: "Tue l'oiseau, et tue [SCOPE.sCharacter('random_talking_bird_merchant').GetFirstName]!"

 zorgo_event.30.t: "Réprimer une révolte d’esclaves"
 zorgo_event.30.desc: "Nous avons découvert un complot à [ROOT.GetCountry.GetCapital.GetName] visant à armer les esclaves domestiques dans l’espoir de renverser le régime de [ROOT.GetCountry.GetRuler.GetName]. Bien qu’un projet aussi insensé fût voué à l’échec, le fait que la conspiration en soit à un stade avancé est très inquiétant. Un grand nombre d’épées ont été découvertes, dissimulées dans une planque aux abords de la région de #E Subura#! à Rome, et il semble que l’attaque devait avoir lieu demain : nous l’avons échappé belle.\n\nLa #E Via Appia#! est désormais jonchée des corps torturés des crucifiés, un sinistre avertissement pour tous ceux qui nourrissent des pensées traîtresses."
 zorgo_event.30.a: "C’était moins une..."

 zorgo_event.31.t: "Fièvre quarte"
 zorgo_event.31.desc: "Des rumeurs font état d’une épidémie de fièvre quarte le long des côtes, sans aucun doute apportée sur nos rivages par des marchands étrangers.\n\nHeureusement, notre [GetOffice('office_apothecary').GetCulturalName(ROOT.GetCharacter.GetCountry)], [SCOPE.sCharacter('apothecary').GetName], a pris l’initiative de son propre chef et a ordonné que personne ne soit autorisé à quitter la région, mais les gens du peuple reprochent à [ROOT.GetCountry.GetRuler.GetName] de ne pas les avoir protégés."
 zorgo_event.31.a: "Maudite soit-elle ! Bouclez le port jusqu’à la fin de l’épidémie"

 zorgo_event.32.t: "Le prix des intrigues politiques"
 zorgo_event.32.desc: "Tout le monde à [ROOT.GetCountry.GetCapital.GetName] est au courant des tentatives de [SCOPE.sCharacter('random_house_head').GetName] pour utiliser ses relations familiales afin d’acheter du pouvoir politique ; il semble que tout le monde, des gardes du corps les plus humbles aux chefs des grandes familles, ait reçu un pot-de-vin de la bourse de [SCOPE.sCharacter('random_house_head').GetFirstName].\n\nImaginez donc le dégoût de [SCOPE.sCharacter('random_house_head').GetFirstName] lorsque [ROOT.GetCountry.GetRuler.GetName] a convoqué [SCOPE.sCharacter('random_house_head').GetHerHim] dans la capitale pour réclamer sa part..."
 zorgo_event.32.a: "J’ignore ce que tu manigances, mais ne m’oublie pas..."

 zorgo_event.33.t: "Le don de la connaissance"
 zorgo_event.33.desc: "[ROOT.GetCountry.GetRuler.GetName], nous avons reçu un curieux cadeau d’un roi étranger qui souhaite rester anonyme. Tout le monde sait à quel point le peuple de [ROOT.GetCountry.GetName] estime la connaissance, car nous avons acquis la réputation d’être les gens les plus intelligents à avoir jamais habité cette partie du monde. C’est donc une agréable surprise de recevoir en cadeau deux esclaves étrangers, parfaitement formés aux arts de la rhétorique et des mathématiques.\n\nUn simple message est remis à [ROOT.GetCountry.GetRuler.GetFirstName] : 'Nous espérons que ces tuteurs érudits aideront le peuple [ROOT.GetCountry.GetAdjective] dans sa noble quête de sagesse. Signé : Un ami.'"
 zorgo_event.33.a: "C’est un cadeau extraordinaire : nous avons beaucoup de chance !"

 zorgo_event.34.t: "Embarras au banquet"
 zorgo_event.34.desc: "[ROOT.GetCountry.GetRuler.GetName] était déjà de mauvaise humeur aujourd’hui, irrité de devoir assister à un banquet auquel [ROOT.GetCountry.GetRuler.GetSheHe] ne pouvait échapper, et buvait abondamment pour passer le temps lorsque l’incident s’est produit.\n\nÀ la moitié du troisième service, un serviteur maladroit, un homme nommé [SCOPE.sCharacter('random_baker').GetName], a perdu l’équilibre et trébuché, laissant tomber une coûteuse aiguière en cristal qui s’est brisée en mille morceaux. L’hôte, [SCOPE.sCharacter('random_dinner_host').GetName], s’est levé, le visage congestionné par la colère, et a exigé que [SCOPE.sCharacter('random_baker').GetFirstName] soit battu devant tout le monde.\n\nTous les regards se tournent avec insistance vers [ROOT.GetCountry.GetRuler.GetFirstName], qui se lève tant bien que mal sur [ROOT.GetCountry.GetRuler.GetHerHis] pieds."
 zorgo_event.34.a: "Inutile de faire une scène ; je paierai moi-même la vaisselle"
 zorgo_event.34.b: "Brisez toute la vaisselle restante de [SCOPE.sCharacter('random_dinner_host').GetFirstName] pour sa cupidité"
 zorgo_event.34.c: "Une erreur aussi grave mérite la mort ! Faites-moi cet honneur"

 zorgo_event.35.t: "Les gens que l'on fréquente"
 zorgo_event.35.desc: "Bien que nous fassions de notre mieux pour ne pas vous importuner avec des problèmes mineurs, tout le monde s’accorde à dire que vous devez faire quelque chose au sujet de [SCOPE.sCharacter('heir').GetName].\n\nDernièrement, [SCOPE.sCharacter('heir').GetFirstName] fréquente des individus peu recommandables, comme des marchands étrangers venus des terres de nos ennemis, qui lui mettent en tête du vin fort et de sottes rêveries. On dit même que certains parlent de placer [SCOPE.sCharacter('heir').GetFirstName] sur le trône de [ROOT.GetCountry.GetName] et, puisque [SCOPE.sCharacter('heir').GetSheHe] est un #E prétendant#!, cette affaire pourrait prendre une ampleur considérable. Que devons-nous faire, le cas échéant ?"
 zorgo_event.35.a: "Je refuse d’intervenir sans preuve concrète"
 zorgo_event.35.b: "Menacez [SCOPE.sCharacter('heir').GetFirstName] d’exil et payez quelqu’un pour le surveiller"

 zorgo_event.36.t: "Un aventurier las du monde"
 zorgo_event.36.desc: "Tôt ce matin, une troupe de guerriers vêtus de manière étrange, menée par un homme intimidant nommé [SCOPE.sCharacter('typhion').GetName], s’est présentée aux portes de [ROOT.GetCountry.GetCapital.GetName] pour demander la permission d’acheter des provisions sur nos marchés. Interrogés sur la valeur de leur monnaie, ils ont répondu penauds qu’ils étaient démunis, mais qu’ils accepteraient de se séparer d’un trésor si le prix était convenable. Sentant chez cet homme une aura de grandeur, [ROOT.GetCountry.GetRuler.GetName] a demandé à [SCOPE.sCharacter('typhion').GetFirstName] de lui accorder une audience privée, dans l’espoir d’entendre l’histoire de ces vagabonds.\n\nBien que les combattants taciturnes aient hésité à se présenter devant notre [ROOT.GetCountry.GetRuler.GetTitleName], après quelques coupes de vin, ainsi que du pain et de la viande, une histoire curieuse leur a été racontée.\n\nEnfant, [SCOPE.sCharacter('typhion').GetFirstName] fut capturé par des pillards d’#E Eburonia#! et vendu comme esclave. Il finit à [GetProvince('(int32)84').GetName], où on lui donna le nom grec de « Typhon ». Formé pour servir de garde du corps, Typhon navigua avec son Maître jusqu’en Extrême-Orient, où il resta dix longues années. Il affirme même avoir visité l’île au bout du monde, un lieu connu sous le nom de #E Wa#!.\n\nC’est en Orient que Typhon entra en possession d’une lame connue sous le nom d’#Y épée des Vents#!. Bien que son visage se crispe lorsqu’il en parle, il propose de la vendre : « Je ne peux pas regarder mes hommes mourir de faim... leur vie vaut plus à mes yeux que cet artefact. »"
 zorgo_event.36.a: "Peut-être resterez-vous ici, [SCOPE.sCharacter('typhion').GetFirstName], et mettrez-vous votre bras armé à notre service ?"
 zorgo_event.36.b: "Payez le prix demandé et renvoyez-les demain matin"
 zorgo_event.36.c: "Renvoyez immédiatement cet étranger sans rien lui donner"

 zorgo_event.37.t: "Routes emportées par les eaux"
 zorgo_event.37.desc: "Nous avons de mauvaises nouvelles aujourd’hui, [ROOT.GetCountry.GetRuler.GetName] : nous avons dû courroucer un dieu de la tempête, car le vent hurlant et la pluie sont incessants depuis une semaine, n’apportant que misère et mauvaise humeur au peuple de [ROOT.GetCountry.GetName].\n\nMalheureusement, le temps a été si mauvais que toutes les routes menant à [ROOT.GetCountry.GetCapital.GetName] ont été ravagées, et la circulation vers notre capitale est désormais pratiquement à l’arrêt. Le commerce est presque inexistant, et la ville commence à manquer de nourriture fraîche... au moins y a-t-il de l’eau pour tout le monde, n’est-ce pas ?"
 zorgo_event.37.a: "Payez les habitants pour restaurer les grandes routes"

 zorgo_event.38.t: "Une demande de discrétion"
 zorgo_event.38.desc: "Récemment, une missive interceptée a été transmise anonymement à [ROOT.GetCountry.GetRuler.GetName], qui n’a pas tardé à en lire le contenu.\n\nS’attendant à découvrir les détails d’un complot traître, [ROOT.GetCountry.GetRuler.GetFirstName] a été stupéfait de trouver à la place une lettre d’amour passionnée, écrite par [SCOPE.sCharacter('random_adulterer').GetName] à [SCOPE.sCharacter('random_adulteress').GetName]. Normalement, cette affaire aurait été ignorée, mais le problème est que [SCOPE.sCharacter('random_adulterer').GetFirstName] et [SCOPE.sCharacter('random_adulteress').GetFirstName] sont mariés à d’autres personnes.\n\nSi cette liaison venait à être connue, les répercussions se feraient sentir dans toute la société [ROOT.GetCountry.GetAdjective]."
 zorgo_event.38.a: "J’ai mieux à faire que de surveiller la moralité"
 zorgo_event.38.b: "Rendez le contenu de la lettre public et forcez-les à divorcer"
 zorgo_event.38.c: "Faites chanter les amants... mais qui m’a envoyé cette lettre ?"

 zorgo_event.39.t: "Des levées renommées"
 zorgo_event.39.desc: "Récemment, une histoire sur nos soldats s’est répandue comme une traînée de poudre, prenant un caractère presque mythique qui ne fait que renforcer la suprématie de [ROOT.GetCountry.GetAdjective] au combat.\n\nLors d’un affrontement récent, la levée de [ROOT.GetCountry.GetCapital.GetName] avait été encerclée par l’ennemi et, bien que nos forces fussent inférieures en nombre dans un rapport de sept contre un, nos guerriers ont bel et bien vaincu l’adversaire, dispersant ses troupes et s’emparant de son convoi de bagages.\n\nDe retour au camp avec leur butin, l’un de nos hommes a hardiment demandé que les prises de guerre soient distribuées sous forme de gratification, afin d’encourager les soldats à continuer le combat."
 zorgo_event.39.a: "Donnez aux hommes tout ce qu’ils ont rapporté"
 zorgo_event.39.b: "Combattre pour [ROOT.GetCountry.GetName] est une récompense suffisante"

 zorgo_event.40.t: "Émeutes dans la capitale"
 zorgo_event.40.desc: "Pour être honnêtes, [ROOT.GetCountry.GetRuler.GetName], nous ne savons même pas ce qui s’est récemment passé dans les rues de [ROOT.GetCountry.GetCapital.GetName] ; selon les rumeurs, une dispute entre deux commerçants aurait dégénéré et, avant que quiconque puisse intervenir, une rixe générale aurait éclaté.\n\nQuelques personnes sont bien sûr mortes tragiquement dans les affrontements, mais le pire reste les incendies déclenchés par le camp perdant. Bien que nous ayons pu éteindre les flammes assez rapidement, un quartier résidentiel de [ROOT.GetCountry.GetCapital.GetName] a été réduit en cendres."
 zorgo_event.40.a: "Salauds ! Nous traquerons les responsables..."

 zorgo_event.41.t: "Ressentiment tenace"
 zorgo_event.41.desc: "Les conséquences du banquet de la semaine dernière chez [SCOPE.sCharacter('random_dinner_host').GetName] continuent de se faire sentir.\n\nAprès que [ROOT.GetCountry.GetRuler.GetName] a ordonné sous l’effet de l’ivresse que chaque plat de service de la maison soit brisé, il semble que [SCOPE.sCharacter('random_dinner_host').GetFirstName] ait nourri du ressentiment et fréquente désormais ouvertement nos ennemis.\n\nInutile de dire que cette situation ne semble pas vouloir disparaître."
 zorgo_event.41.a: "Bah... je me moque de [SCOPE.sCharacter('random_dinner_host').GetPraenomen] et de ses états d’âme"

 zorgo_event.42.t: "Un voleur dans la nuit"
 zorgo_event.42.desc: "[ROOT.GetCountry.GetRuler.GetName] est plongé dans un rêve lorsqu’un grand fracas métallique et un juron étouffé arrachent le sommeil aux yeux de [ROOT.GetCountry.GetRuler.GetHerHis]. [ROOT.GetCountry.GetRuler.GetFirstName] saisit péniblement un poignard près du lit et se remet debout en titubant. Là, dans le coin de la pièce près de la fenêtre, une silhouette obscure s’apprête à descendre le long des murs de la citadelle.\n\n« Qui êtes-vous ? » appelle désespérément [ROOT.GetCountry.GetRuler.GetFirstName].\n\n« Tu ne pensais tout de même pas que j’allais te laisser garder mon épée, n’est-ce pas ? » ricane [SCOPE.sCharacter('typhion').GetName]. « Tu n’as aucune idée de ce que j’ai dû endurer pour l’obtenir. »\n\nAvec un rire cruel, [SCOPE.sCharacter('typhion').GetFirstName] saisit un vase de bronze et le lance sur [ROOT.GetCountry.GetRuler.GetFirstName], frappant au visage le [ROOT.GetCountry.GetRuler.GetTitleName] encore ensommeillé. « N’essaie pas de me retrouver... nous ne nous reverrons que dans les Enfers. » Sur ces mots, Typhon disparaît par la fenêtre."
 zorgo_event.42.a: "Gardes ! À l’aide, on m’attaque !"
 zorgo_event.42.b: "Il est trop tard... Typhon s’échappe..."
 zorgo_event.42.c: "Je couperai la corde et regarderai ce voleur tomber à sa perte"

 zorgo_event.43.t: "L’esprit bienveillant"
 zorgo_event.43.desc: "[ROOT.GetCountry.GetRuler.GetName], nous avons reçu des provinces des rapports dignes de votre attention. Il semblerait qu’un dieu local, une divinité mineure, ait été aperçu parcourant notre royaume, touchant les vignes flétries et les champs en jachère pour leur rendre les couleurs du printemps.\n\nNotre peuple a rencontré cette créature divine à plusieurs reprises, laissant pour le dieu des gâteaux aux dattes et du vin, et celui-ci a en retour béni leurs récoltes et accru leur productivité.\n\nPour célébrer ce lien divin, les habitants ont de leur propre initiative bâti un sanctuaire à ce dieu inconnu."
 zorgo_event.43.a: "La piété des fidèles [ROOT.GetCountry.GetAdjective] a été récompensée !"

 zorgo_event.44.t: "Ne dérangez pas mes os"
 zorgo_event.44.desc: "Récemment, certains de nos citoyens de [ROOT.GetCountry.GetCapital.GetName] construisaient des maisons, mais au lieu d’extraire leur propre pierre, ils ont décidé de démolir d’anciennes tombes de la région et de réutiliser le marbre de Paros. En soi, cela n’a rien de remarquable, car notre peuple est connu pour employer des spolia, mais il convient de mentionner ce qu’il a découvert dans l’une des tombes.\n\nBien que les inscriptions fussent effacées, un vase d’or contenant les cendres d’un célèbre architecte a été découvert, peut-être celui qui avait conçu la nécropole, ainsi qu’un avertissement rédigé en plusieurs langues.\n\n« Ne dérangez pas mes os, de peur que le destin qui a frappé mon peuple ne détruise le vôtre. »\n\nLorsque [ROOT.GetCountry.GetRuler.GetName] a entendu cette histoire, [ROOT.GetCountry.GetRuler.GetSheHe] a été troublé et a exigé que le vase d’or soit réinhumé, mais celui-ci a disparu depuis longtemps et personne ne veut avouer où il se trouve."
 zorgo_event.44.a: "Je suis dégoûté d’entendre cette histoire sordide"

 zorgo_event.45.t: "Organiser la garde de nuit"
 zorgo_event.45.desc: "Récemment, un groupe de citoyens inquiets de [ROOT.GetCountry.GetCapital.GetName] a présenté une pétition à [ROOT.GetCountry.GetRuler.GetName]. Après qu’un incendie a failli réduire la capitale en cendres, le peuple a décidé de prendre les choses en main et a commencé à former des patrouilles nocturnes, qui ont jusqu’ici réussi à réduire la criminalité et à protéger nos foyers de la menace mortelle des incendies.\n\nMalheureusement, ils demandent que l’État subventionne officiellement leurs efforts ; ils veulent que nous équipions les volontaires dès maintenant, ce qui ne sera pas bon marché, et que nous financions continuellement leur initiative.\n\nPersonne ne connaît mieux nos finances que vous, [ROOT.GetCountry.GetRuler.GetFirstName] ; le choix vous appartient."
 zorgo_event.45.a: "Il est hors de question que nous financions cela"
 zorgo_event.45.b: "Cela coûtera peut-être un peu maintenant, mais chaque pièce en vaudra la peine"

 zorgo_event.46.t: "Camps de brigands"
 zorgo_event.46.desc: "Nous avons appris par des rumeurs que des esclaves en fuite formaient des bandes, unissant leurs forces pour rendre à la société qui les avait autrefois asservis la misère qu’ils avaient subie.\n\nCes brigands sèment le chaos, laissant derrière eux une traînée de mort et de destruction, et l’on dit même qu’ils ont établi des camps dans l’une de nos colonies : quel mépris total pour la loi [ROOT.GetCountry.GetAdjective] !\n\nLa pression monte pour que [ROOT.GetCountry.GetRuler.GetName] agisse. Nous n’allons tout de même pas laisser ces voleurs opérer impunément à [ROOT.GetCountry.GetName] ?"
 zorgo_event.46.a: "Envoyez quelques cohortes de nos meilleurs hommes mettre fin à leur terreur"
 zorgo_event.46.b: "Nous ne pouvons pas nous permettre de mobiliser des hommes pour le moment, je le crains"

 zorgo_event.47.t: "Camps de brigands : bataille"
 zorgo_event.47.desc: "Nos éclaireurs ont repéré l’emplacement du camp des brigands et les derniers préparatifs de l’attaque sont en cours.\n\nLes voleurs sont plus rusés qu’on ne pourrait le croire : ils ont attaqué des domaines esclavagistes, libérant les captifs et grossissant leurs rangs. Bien que nous nous attendions à une simple escarmouche, tous les signes annoncent une bataille désespérée et rangée... les esclaves ne céderont pas facilement leur liberté."
 zorgo_event.47.a: "Je mènerai moi-même nos guerriers au combat"
 zorgo_event.47.b: "Une tâche aussi dérisoire doit être déléguée ; informez-moi de notre victoire"

 zorgo_event.48.t: "Camp de brigands : triomphe"
 zorgo_event.48.desc: "Bien que le combat fût périlleux, les forces de [ROOT.GetCountry.GetName] ont réussi à repousser la populace d’esclaves, anéantissant tous ceux qui tenaient leur position et combattaient. Lorsque le cours de la bataille s’est inversé, une vaste multitude s’est rendue et a immédiatement été chargée de fers ; les marchés aux esclaves de [ROOT.GetCountry.GetCapital.GetName] seront pleins d’ici quinze jours.\n\nCependant, comme le dit le proverbe, une meute de chiens peut vaincre un lion solitaire, et bien que [ROOT.GetCountry.GetRuler.GetName] ait combattu vaillamment, [ROOT.GetCountry.GetRuler.GetSheHe] a reçu un coup de lance au visage et a malheureusement perdu un œil. [ROOT.GetCountry.GetRuler.GetFirstName] est attristé par ce retournement, et la découverte du trésor des brigands n’atténue que légèrement la douleur."
 zorgo_event.48.a: "Les dieux ne nous donnent que ce que nous sommes capables de supporter"

 zorgo_event.49.t: "Camp de brigands : triomphe"
 zorgo_event.49.desc: "Des nouvelles de la campagne contre les brigands ! [SCOPE.sCharacter('general_getting_recognition').GetName] a reçu le commandement de nos forces et a mené nos hommes à la victoire, écrasant tous ceux qui osaient se dresser dans le champ contre nos levées [ROOT.GetCountry.GetAdjective].\n\n[SCOPE.sCharacter('general_getting_recognition').GetFirstName] a remis un rapport personnel à [ROOT.GetCountry.GetRuler.GetName], détaillant les événements palpitants de la bataille.\n\nÀ mesure que la nouvelle de la victoire éclatante de [SCOPE.sCharacter('general_getting_recognition').GetFirstName] se répand, le peuple se réjouit d’apprendre que [ROOT.GetCountry.GetName] est béni de génies militaires."
 zorgo_event.49.a: "Qui aurait douté que mes armées écraseraient ces chiens ?"

 zorgo_event.50.t: "Une pluie d’or sur le peuple"
 zorgo_event.50.desc: "Un après-midi, [ROOT.GetCountry.GetRuler.GetName] se détend dans [ROOT.GetCountry.GetRuler.GetHerHis] appartements privés à [ROOT.GetCountry.GetCapital.GetName], écoutant les bruits du marché animé à l’extérieur. Le dernier repas de la journée sera bientôt servi et les rues sont remplies de bons citoyens [ROOT.GetCountry.GetAdjective] qui achètent de la nourriture. Une pensée impétueuse traverse l’esprit de [ROOT.GetCountry.GetRuler.GetFirstName] et, quelques instants plus tard, [ROOT.GetCountry.GetRuler.GetSheHe] se trouve à l’arrière d’un char, se dirigeant vers les ruelles où les vendeurs s’affairent.\n\nPlongeant la main au fond d’une bourse, [ROOT.GetCountry.GetRuler.GetFirstName] commence à jeter des poignées d’or et d’argent dans les rues. Une foule se rassemble et tend les mains vers son [ROOT.GetCountry.GetRuler.GetTitleName], le visage couvert de poussière brillant d’admiration."
 zorgo_event.50.a: "Je vous aime tous, chacun d’entre vous !"

 zorgo_event.51.t: "Une trêve fiscale"
 zorgo_event.51.desc: "Le moment de recouvrer les impôts dus par les classes supérieures approche, une période historiquement impopulaire à [ROOT.GetCountry.GetName], au grand dam de [ROOT.GetCountry.GetRuler.GetName], qui attend avec impatience les sommes forfaitaires perçues mais déteste s’attirer les foudres des puissants.\n\nAlors que [ROOT.GetCountry.GetRuler.GetFirstName] examine les registres fiscaux, un conseiller s’avance en se raclant la gorge.\n\n« Et si nous brûlions simplement les registres ? Vous deviendriez extrêmement populaire en pardonnant toutes ces dettes accumulées, et nos terres ont déjà connu de telles mesures. »"
 zorgo_event.51.a: "Voilà une excellente idée... qu’il en soit ainsi"
 zorgo_event.51.b: "Certainement pas. Je veux chaque pièce due à l’État !"

 zorgo_event.52.t: "Camps militaires pour notre jeunesse"
 zorgo_event.52.desc: "[SCOPE.sCharacter('general_advisor').GetName], connu dans tout [ROOT.GetCountry.GetName] pour [SCOPE.sCharacter('general_advisor').GetHerHis] habileté à manier la lame, a demandé à [ROOT.GetCountry.GetRuler.GetName] d’envisager la création d’un programme financé par l’État qui formerait les enfants de nos classes supérieures aux arts de la guerre.\n\n« On dit que dans les terres de nos ennemis, on apprend à un enfant de cinq ans à combattre à la lance. Pourquoi nos fils [ROOT.GetCountry.GetAdjective] ne feraient-ils pas de même ? »"
 zorgo_event.52.a: "Nous ne pouvons tout simplement pas nous le permettre, même si l’idée est bonne"
 zorgo_event.52.b: "Excellente idée, [SCOPE.sCharacter('general_advisor').GetFirstName] : qu’il en soit ainsi"

 zorgo_event.53.t: "Le sage au carrefour"
 zorgo_event.53.desc: "[ROOT.GetCountry.GetRuler.GetName] ramène sa petite suite à [ROOT.GetCountry.GetCapital.GetName] après une journée de chasse réussie lorsque [ROOT.GetCountry.GetRuler.GetSheHe] rencontre un étrange personnage au carrefour menant à la capitale. Vêtu de la simple robe d’un moine, [SCOPE.sCharacter('dementive_sadhu').GetName] est assis les yeux fermés, tenant une petite pipe en argile. \n\n« Bom Shiva ! » s’exclame l’homme en expirant un nuage de fumée épaisse. « Enfin, [ROOT.GetCountry.GetRuler.GetFirstName], nos chemins se croisent. » Le vieillard se lève et s’incline profondément. « J’ai voyagé de nombreux jours pour atteindre cet endroit ; mon dieu, le Seigneur Shiva, m’a ordonné de vous offrir mes services.\n\nRepoussant les nuages nauséabonds, [ROOT.GetCountry.GetRuler.GetFirstName] hausse un sourcil. « Et dans quel but votre dieu vous a-t-il envoyé ici ? »\n\nAvec un rire strident, [SCOPE.sCharacter('dementive_sadhu').GetFirstName] répond avec une lueur dans les yeux.\n\n« Cela reste à voir, mon Seigneur. »"
 zorgo_event.53.a: "Fort bien, vous pouvez donc nous suivre jusqu’à chez nous"

 zorgo_event.54.t: "Assassins Foiled"
 zorgo_event.54.desc: "One evening, there is a loud commotion in the courtyard of [ROOT.GetCountry.GetRuler.GetName]'s home - it sounds like a pitched battle is taking place! The screams of dying men fill the air, punctuated by the clangs of metal. Grabbing a sword and a breastplate, [ROOT.GetCountry.GetRuler.GetFirstName] rushes out into the street to see what is happening.\n\nMuch to [ROOT.GetCountry.GetRuler.GetHerHis] surprise, by the time [ROOT.GetCountry.GetRuler.GetSheHe] arrives, the fighting is over. There, standing over the bodies of twelve slain men and completely untouched himself, is [SCOPE.sCharacter('dementive_sadhu').GetName], who spits on the corpse nearest to him.\n\nTurning to [ROOT.GetCountry.GetRuler.GetFirstName], [SCOPE.sCharacter('dementive_sadhu').GetFirstName] bows and walks past the stunned [ROOT.GetCountry.GetRuler.GetTitleName], who is standing there mouth agape. 'Shiva be praised that I was awake...'"
 zorgo_event.54.a: "...and now you know why I was sent here"

 zorgo_event.55.t: "Une terre digne d’être visitée"
 zorgo_event.55.desc: "La rumeur se répand au loin que notre pays de [ROOT.GetCountry.GetName] est un endroit agréable à visiter, [ROOT.GetCountry.GetCapital.GetName] étant le site le plus impressionnant que nous ayons à offrir. Notre hospitalité [ROOT.GetCountry.GetAdjective] est réputée, et même ceux qui n’ont aucune affaire dans notre royaume font souvent un détour pour venir visiter notre capitale."
 zorgo_event.55.a: "Nous sommes reconnaissants d’avoir une réputation si accueillante"

 zorgo_event.56.t: "Un cartographe renommé"
 zorgo_event.56.desc: "[ROOT.GetCountry.GetRuler.GetName], cela pourrait vous surprendre, mais un visiteur ayant parcouru la largeur de la Terre pour rejoindre votre cour se trouve à [ROOT.GetCountry.GetCapital.GetName]. Bien que cet étranger, un homme nommé [SCOPE.sCharacter('shocky_cartographer').GetName], ne connaisse pas notre langue, il communique avec nous par l’intermédiaire d’interprètes et nous raconte son histoire ainsi que ses aventures.\n\n[SCOPE.sCharacter('shocky_cartographer').GetFirstName] vient d’un archipel connu sous le nom de #E Maldives#!, qui se trouverait au large des côtes de l’#E Inde#!, et a passé les vingt dernières années à naviguer sur toutes les mers entre [ROOT.GetCountry.GetName] et son pays natal.\n\nIl possède ainsi certaines des cartes les plus détaillées jamais réalisées par un cartographe et nous offre la possibilité d’en faire faire des copies par nos scribes. Si nous acceptons son tarif, il s’installera à [ROOT.GetCountry.GetCapital.GetName] et commencera immédiatement à travailler avec nos hommes, même si l’ouvrage prendra du temps."
 zorgo_event.56.a: "Nous ne pouvons pas nous le permettre pour le moment"
 zorgo_event.56.b: "Donnez à Indra ce qu’il demande et installez-le dans notre bibliothèque"

 zorgo_event.57.t: "Une demande de fonds"
 zorgo_event.57.desc: "[SCOPE.sCharacter('shocky_cartographer').GetName] s’est révélé être un élève rapide durant son travail à [ROOT.GetCountry.GetCapital.GetName], apprenant les rudiments de la langue [ROOT.GetCountry.GetAdjective] avec une facilité qui a impressionné [ROOT.GetCountry.GetRuler.GetName]. Il est désormais capable de communiquer seul, un exploit qui a impressionné tous ceux qui y prêtaient attention.\n\nMalheureusement, il nous a directement demandé davantage d’argent : il affirme avoir besoin de plus de fournitures, mais nous promet que le travail accompli jusqu’à présent est de premier ordre."
 zorgo_event.57.a: "Nous ne pouvons plus nous le permettre..."
 zorgo_event.57.b: "Heureusement, l’État a les poches profondes"
 zorgo_event.57.c: "Quoi ?! Nous allons simplement prendre les cartes d’Indra et le chasser de [ROOT.GetCountry.GetName]"
 shocky_stops_working_tt: "#Y Indra cessera de travailler à la copie des cartes.#!"
 shocky_keeps_working_tt: "#Y Indra poursuivra son travail.#!"

 zorgo_event.58.t: "Un développement stupéfiant"
 zorgo_event.58.desc: "« Que faites-vous ?! » demande [SCOPE.sCharacter('shocky_cartographer').GetName] tandis que vos soldats font irruption dans ses appartements. C’est le milieu de la nuit, et pourtant le cartographe travaille encore avec acharnement ; une petite bougie brûle vivement sur son bureau.\n\n[ROOT.GetCountry.GetRuler.GetName] s’avance, l’air déterminé sur le visage. « Vous êtes en état d’arrestation, [SCOPE.sCharacter('shocky_cartographer').GetFirstName]. »\n\n« En état d’arrestation ? Pour quel motif ? C’est grotesque ! »\n\nAvant que [ROOT.GetCountry.GetRuler.GetFirstName] puisse répondre, [SCOPE.sCharacter('shocky_cartographer').GetFirstName] plonge la main dans sa tunique et en sort un poignard, se jetant en avant et frappant sauvagement. La lame s’enfonce profondément dans la gorge de [ROOT.GetCountry.GetRuler.GetFirstName], [ROOT.GetCountry.GetRuler.GetHerHim] tuant sur-le-champ."
 zorgo_event.58.a: "Mes hommes me vengeront..."

 zorgo_event.59.t: "Les cartes d’Indra"
 zorgo_event.59.desc: "Bien qu’il semble s’être écoulé une éternité depuis que nous avons chargé [SCOPE.sCharacter('shocky_cartographer').GetName] de réaliser des cartes pour nous, le savant cartographe nous informe qu’il a enfin terminé et a personnellement demandé à [ROOT.GetCountry.GetRuler.GetName] de venir les voir en personne.\n\n« Vous constaterez que ces cartes sont les plus précises jamais réalisées », déclare pompeusement [SCOPE.sCharacter('shocky_cartographer').GetFirstName] en désignant les noms des fleuves et des chaînes de montagnes sur la pile de rouleaux posée sur la table. « Je vous prie de m’excuser d’avoir été si long, mais la qualité ne souffre pas la précipitation, ô estimé [ROOT.GetCountry.GetRuler.GetTitleName]. »"
 zorgo_event.59.a: "Indra... je suis stupéfait. Elles sont magnifiques !"

 zorgo_event.60.t: "Un guerrier et un érudit"
 zorgo_event.60.desc: "Des rumeurs affirment qu’un capitaine mercenaire stationné à [ROOT.GetCountry.GetCapital.GetName], un certain [SCOPE.sCharacter('omega_corp_trainer').GetName], connaît un succès sans précédent sur le champ de bataille grâce à des tactiques militaires inhabituelles qu’il a lui-même conçues. À la fin de chaque saison de campagne, les hommes de [SCOPE.sCharacter('omega_corp_trainer').GetFirstName] rentrent chez eux alourdis d’or et d’esclaves, sans paraître plus mal en point pour autant : comment font-ils ?\n\nDésireux de rencontrer en personne un esprit militaire aussi brillant, [ROOT.GetCountry.GetRuler.GetName] a invité le mercenaire à dîner avec [ROOT.GetCountry.GetRuler.GetHerHim] dans une semaine."
 zorgo_event.60.a: "J’ai hâte de rencontrer [SCOPE.sCharacter('omega_corp_trainer').GetName]"

 zorgo_event.61.t: "La dernière ligne de défense"
 zorgo_event.61.desc: "« Alors, tu veux connaître mes secrets, hein ? »\n\nLe dîner entre [SCOPE.sCharacter('omega_corp_trainer').GetName] et [ROOT.GetCountry.GetRuler.GetName] se déroule dans une ambiance détendue et, bien que la raison de cette rencontre ait été évitée durant les premiers services, alors que les esclaves apportent davantage de vin et de fruits, la conversation se tourne vers les affaires.\n\n[SCOPE.sCharacter('omega_corp_trainer').GetFirstName] se penche en avant, les yeux brillant d’excitation. « Je vais faire mieux et vous révéler le plus grand de tous les secrets. Je compte en réalité me retirer du service mercenaire ; il est temps de garder mes troupeaux et d’élever des enfants chez moi. Si vous êtes prêt à en payer le prix, je vous vendrai mes troupes d’élite. Vous avez sûrement entendu parler de l’Armée Omega ? »\n\n« Oui, j’en ai entendu parler. » [ROOT.GetCountry.GetRuler.GetFirstName] s’adosse sur son divan et croque dans une grosse pomme. « Tout le monde en a entendu parler ; puisque l’Alpha est le premier... »\n\n« Alors l’Omega est le dernier. Vous voulez connaître les prétendus secrets de ma gloire ? Mes hommes ne battent jamais en retraite, ils tiennent toujours leur position. Qu’en dites-vous, [ROOT.GetCountry.GetRuler.GetFirstName] ? Je mets les voiles pour #E Ordovicia#! à l’aube. Vous connaissez mon prix : voici votre chance de posséder l’une des compagnies de mercenaires les plus redoutées de tout le pays. »"
 zorgo_event.61.a: "Nous ne pouvons pas nous permettre cette dépense pour le moment"
 zorgo_event.61.b: "Quelle heureuse circonstance ! Bien sûr, nous achèterons vos hommes"

 zorgo_event.62.t: "Une curieuse découverte : du lait aigre"
 zorgo_event.62.desc: "Dernièrement, nos fermiers se plaignent que leurs vaches produisent un lait aigre au goût d’ail qui caille presque immédiatement. Il est si piquant et infect que même leurs veaux refusent de le boire, et de nombreux animaux meurent. Ce phénomène épouvantable s’est répandu dans tout le pays et, bien que [ROOT.GetCountry.GetRuler.GetName] le nie, certains murmurent qu’un dieu a dû être gravement offensé par une conduite inconsidérée du dirigeant [ROOT.GetCountry.GetAdjective]."
 zorgo_event.62.a: "Je... je n’ai aucune idée de la raison pour laquelle cela nous arrive"

 zorgo_event.63.t: "Une soirée au théâtre"
 zorgo_event.63.desc: "Un dramaturge renommé présente ce soir une nouvelle pièce à [ROOT.GetCountry.GetCapital.GetName] et l’excitation est palpable en ville, particulièrement dans la demeure de [ROOT.GetCountry.GetRuler.GetPraenomen], où [ROOT.GetCountry.GetRuler.GetSpouse.GetName] a fait savoir que [ROOT.GetCountry.GetRuler.GetSpouse.GetSheHe] souhaitait vivement y assister. En vérité, c’est la seule chose dont [ROOT.GetCountry.GetRuler.GetSpouse.GetSheHe] parle depuis des mois."
 zorgo_event.63.a: "Je suis trop occupé pour aller voir une pièce ennuyeuse"
 zorgo_event.63.b: "Oui, mon amour, nous serons au premier rang"
 going_to_see_the_play_tt: "#Y Vous et votre conjoint assisterez à la pièce au Grand Théâtre."

 zorgo_event.64.t: "Une soirée au théâtre : la pièce"
 zorgo_event.64.desc: "Bien qu’il n’ait pas voulu venir, une fois installé, [ROOT.GetCountry.GetRuler.GetName] a vraiment apprécié la pièce. Le #E Grand Théâtre#!, au cœur de [ROOT.GetCountry.GetCapital.GetName], est un établissement impressionnant, doté d’une acoustique inégalée. Assister à une représentation de qualité dans un si bel endroit fut une expérience magique, difficile à oublier.\n\nEt le bonheur de [ROOT.GetCountry.GetRuler.GetSpouse.GetName] n’y est pas pour rien."
 zorgo_event.64.a: "J’attends avec impatience notre prochaine soirée au théâtre"

 zorgo_event.65.t: "Rumeurs de barbares"
 zorgo_event.65.desc: "Des rumeurs infondées prétendent qu’une importante horde barbare ravage la campagne, pillant, saccageant et réduisant en cendres les paisibles foyers [ROOT.GetCountry.GetAdjective]. Les prix commencent à augmenter dans la capitale et ceux qui en ont les moyens fuient vers la sécurité de la campagne.\n\nBien que [ROOT.GetCountry.GetRuler.GetName] ait assuré aux habitants de [ROOT.GetCountry.GetCapital.GetName] que ces histoires sont absurdes et qu’il n’y a rien à craindre, la population de la ville panique."
 zorgo_event.65.a: "Tout ira bien, mais vous devez vous détendre !"

 zorgo_event.66.t: "Des prises décevantes"
 zorgo_event.66.desc: "Nos pêcheurs rapportent qu’ils n’ont pas réussi à trouver autant de poissons que les années précédentes, et beaucoup commencent à craindre de ne plus pouvoir nourrir leur famille, encore moins d’en avoir suffisamment à vendre au marché.\n\nLe prix du poisson frais est devenu exorbitant à [ROOT.GetCountry.GetCapital.GetName] : certains hommes paient une semaine de salaire pour un gros maquereau. Avez-vous déjà entendu pareille chose ?"
 zorgo_event.66.a: "Vous verrez, ces temps difficiles finiront par passer"

 zorgo_event.67.t: "Un amour-propre blessé"
 zorgo_event.67.desc: "[SCOPE.sCharacter('random_dude_advisor').GetName] accuse [ROOT.GetCountry.GetRuler.GetName] d’une offense imaginaire et repousse désormais ses tentatives de réconciliation.\n\nOn dirait que nous avons un nouvel ennemi à prendre en compte."
 zorgo_event.67.a: "C’est terriblement agaçant... je n’ai pourtant rien fait"

 zorgo_event.68.t: "Une soif d’aventure"
 zorgo_event.68.desc: "Un matin, [ROOT.GetCountry.GetRuler.GetName] est abordé par [SCOPE.sCharacter('heir').GetName], qui est vêtu comme s’il se préparait à partir pour un long voyage.\n\n« Une occasion de voyager avec des compagnons de confiance s’est présentée à moi, [ROOT.GetCountry.GetRuler.GetFirstName], et j’ai l’intention de la saisir. Je vous en prie, soyez clément et permettez-moi de quitter [ROOT.GetCountry.GetName] : je veux découvrir le monde par moi-même avant de devoir rester ici, à [ROOT.GetCountry.GetCapital.GetName], et d’assumer mes responsabilités. »"
 zorgo_event.68.a: "Vous pouvez partir, mais prenez soin de vous"
 zorgo_event.68.b: "Nous avons besoin de vous ici, chez vous, [SCOPE.sCharacter('heir').GetFirstName]"


 zorgo_event.69.t: "Un moment pour moi"
 zorgo_event.69.desc: "Bien que les devoirs liés au gouvernement de [ROOT.GetCountry.GetName] occupent presque chaque heure de chaque jour, il reste quelques instants, aussi rares soient-ils, où [ROOT.GetCountry.GetRuler.GetName] peut s’éclipser pour une journée, remettre ses obligations au lendemain et se retirer dans une petite maison à la périphérie de [ROOT.GetCountry.GetCapital.GetName] pour profiter du calme et de la tranquillité.\n\nC’est ici, loin du chaos et de l’agitation de la capitale, que [ROOT.GetCountry.GetRuler.GetFirstName] peut se détendre et réfléchir sereinement."
 zorgo_event.69.a: "Je reviendrai dans un jour ou deux, plein d’entrain et de vigueur"

 zorgo_event.70.t: "Voleurs de chevaux"
 zorgo_event.70.desc: "Puisque les chevaux [ROOT.GetCountry.GetAdjective] sont réputés être parmi les meilleurs du monde, nous devons parfois faire face à des pillards et des bandits qui prennent nos haras pour cible dans l’espoir de dérober autant de ces précieux animaux que possible.\n\nNous avons malheureusement le regret de vous informer que nous avons récemment subi une telle attaque : quelques vies ont été perdues et quelques bêtes de valeur ont été emportées... Je suis désolé, [ROOT.GetCountry.GetRuler.GetName]."
 zorgo_event.70.a: "Je le suis également... quelle terrible mésaventure"

 zorgo_event.71.t: "Des guerriers venus de l’étranger"
 zorgo_event.71.desc: "La chose la plus étrange s’est produite ce matin près de [ROOT.GetCountry.GetCapital.GetName]. Deux cohortes de soldats, vêtus d’armures en lambeaux, dont beaucoup marchaient pieds nus tout en soignant des blessures infectées, sont arrivées aux portes de notre capitale en implorant notre protection.\n\nIls parlent d’une grande bataille qui a eu lieu au nord, où plusieurs armées se sont affrontées. Ces braves combattants ont survécu, mais pas leur pays, entièrement détruit par ses ennemis. À présent, ils n’ont nulle part où aller et cherchent désespérément un nouveau foyer."
 zorgo_event.71.a: "Nous pouvons toujours accueillir des combattants expérimentés à [ROOT.GetCountry.GetName]"

 zorgo_event.72.t: "Le camp barbare"
 zorgo_event.72.desc: "Nous recevons sans cesse des rapports au sujet de barbares vivant au-delà des frontières [ROOT.GetCountry.GetAdjective], qui rendent la vie misérable à notre peuple. Non seulement ils ont établi un vaste camp quelque part dans les montagnes, mais ils attendent même que nos armées soient en campagne pour lancer leurs attaques. On dirait qu’ils préfèrent assassiner des femmes et des enfants innocents plutôt que de combattre honorablement, comme de vrais guerriers.\n\nNous pourrions envoyer une partie de nos forces régler le problème, si telle est votre décision."
 zorgo_event.72.a: "Les habitants de la frontière doivent s’endurcir"
 zorgo_event.72.b: "Je mènerai nos hommes au combat contre eux"
 we_will_start_marching_asap_tt: "#Y Nous marcherons vers le camp barbare à l’aube.#!"

 zorgo_event.73.t: "Le camp barbare : les contreforts montagneux"
 zorgo_event.73.desc: "Nous marchons depuis près d’une semaine, ne nous reposant que quelques heures par-ci par-là, et nos hommes commencent à en subir les conséquences. [ROOT.GetCountry.GetRuler.GetName] a imposé un rythme implacable, sans doute parce qu’il regrette d’avoir quitté [ROOT.GetCountry.GetCapital.GetName] pour accompagner ces guerriers. Les affaires de la capitale exigent toujours une main délicate, et [ROOT.GetCountry.GetRuler.GetFirstName] reçoit chaque jour des rapports de la métropole. Il est évident qu’il souhaite rentrer au plus vite, mais nos guerriers sont épuisés et cela se voit.\n\nLe crépuscule s’étend sur les contreforts escarpés de la région où se trouverait le camp barbare, et une légère neige commence à tomber. Le cheval de [ROOT.GetCountry.GetRuler.GetFirstName] souffle bruyamment, envoyant des volutes de vapeur dans l’air froid de la montagne."
 zorgo_event.73.a: "En avant, soldats de [ROOT.GetCountry.GetName] !"
 zorgo_event.73.b: "Nous camperons ici dans les contreforts et attaquerons demain"
 zorgo_event.73.c: "Les affaires de [ROOT.GetCountry.GetCapital.GetName] nous rappellent chez nous"
 we_camp_at_barbarians_tt: "#Y Nous dresserons les tentes et dormirons quelques heures...#!"
 we_wont_fight_the_barbarians_tt: "#Y Nous abandonnerons la mission et rentrerons chez nous.#!"

 zorgo_event.74.t: "Le camp barbare : l’embuscade"
 zorgo_event.74.desc: "Bien que nos hommes soient épuisés, poursuivre la marche durant la soirée s’est révélé être une sage décision. Il semble que les barbares aient eu vent de la présence de nos forces et aient prévu de nous tendre une embuscade dans les cols montagneux.\n\nGrâce à la diligence de [ROOT.GetCountry.GetRuler.GetName], nous avons toutefois renversé la situation et surpris nos ennemis, dispersés et désorganisés. La vue de nos adversaires a revigoré nos hommes, qui chargent le camp barbare !"
 zorgo_event.74.a: "Exploitons notre avantage ! À l’attaque ! En avant !"

 zorgo_event.75.t: "Le camp barbare : bataille nocturne"
 zorgo_event.75.desc: "Le son des hommes hurlants tire [ROOT.GetCountry.GetRuler.GetName] de son sommeil et ses instincts prennent immédiatement le dessus. En quelques secondes, il est revêtu de son armure et se tient dehors, scrutant frénétiquement l’horizon.\n\nLes barbares, que les dieux les maudissent, ont lancé une attaque surprise ! Ils ont encerclé notre camp et avancent de toutes parts. L’air est déjà chargé de projectiles et les flèches transpercent la toile de la tente de [ROOT.GetCountry.GetRuler.GetFirstName] dans un sifflement aigu. Heureusement, nos sentinelles les ont vus descendre la montagne et ont pu donner l’alarme, mais de justesse.\n\nLe lourd martèlement des sabots annonce la charge des forces ennemies : la bataille est imminente !"
 zorgo_event.75.a: "Pour [ROOT.GetCountry.GetName] ! Aaaarrrggghhh !"

 zorgo_event.76.t: "Le camp barbare : défi"
 zorgo_event.76.desc: "La bataille au camp barbare a été sanglante. Les deux camps se sont engagés dans le rythme familier de la violence et il est difficile de déterminer qui prend l’avantage dans ces combats désespérés.\n\nAu centre, [ROOT.GetCountry.GetRuler.GetName] mène la première ligne et se fraye un chemin sanglant dans les rangs barbares. Soudain, un carnyx émet un son lugubre et une silhouette à cheval émerge de la foule des barbares : leur chef, le terrifiant [SCOPE.sCharacter('barbarian_camp_leader').GetName].\n\nPointant une lance vers [ROOT.GetCountry.GetRuler.GetFirstName], [SCOPE.sCharacter('barbarian_camp_leader').GetFirstName] hurle dans une langue étrangère. Bien que les mots soient incompréhensibles, leur signification ne fait aucun doute."
 zorgo_event.76.a: "Bien sûr, je vous affronterai en duel !"
 zorgo_event.76.b: "Nous ne croiserons pas le fer aujourd’hui, vermine barbare"
 the_barbarian_battle_continues_tt: "#Y La bataille continue sans glorieux combat singulier...#!"
 zorgo_event.76.c: "Archers, concentrez vos tirs sur Deimos !"

 zorgo_event.77.t: "Le camp barbare : duel"
 zorgo_event.77.desc: "[SCOPE.sCharacter('barbarian_camp_leader').GetName] charge, frappant son épée contre son bouclier et hurlant de manière incohérente. Avec une rapidité surprenante pour sa stature, le barbare bondit sur [ROOT.GetCountry.GetRuler.GetName] et la pointe de sa lame cruelle fait couler le premier sang.\n\nReculant, [ROOT.GetCountry.GetRuler.GetFirstName] jure, l’esprit en ébullition : il n’y a pas de temps pour réfléchir !"
 zorgo_event.77.a: "Deimos est un adversaire plus coriace que je ne le pensais, mais je n’abandonnerai pas"
 zorgo_event.77.b: "Vous négligez votre sécurité et attaquez sans discernement"
 zorgo_event.77.c: "Salue les dieux des enfers de ma part, Deimos"
 damn_dawg_youre_strong_af_tt: "#Y Cette option est disponible grâce à la valeur élevée de Martial de votre dirigeant.#!"
 coward_tooltip: "#Y Cette option est disponible parce que votre dirigeant est lâche.#!"

 zorgo_event.78.t: "Le camp barbare : conclusion"
 zorgo_event.78.desc: "Tous les regards se tournent vers [SCOPE.sCharacter('barbarian_camp_leader').GetName] et [ROOT.GetCountry.GetRuler.GetName], engagés dans un combat acharné. Le son du métal frappant le métal emplit l’air, ponctué par les grognements et les cris des deux combattants.\n\nSaisissant une occasion, [ROOT.GetCountry.GetRuler.GetFirstName] bondit en avant et abat son épée de toutes ses forces. La tête de [SCOPE.sCharacter('barbarian_camp_leader').GetFirstName] est tranchée sur-le-champ et s’envole dans les airs, accompagnée d’un magnifique flot de sang. À cette vision horrifique, les formations barbares s’effondrent et nos soldats [ROOT.GetCountry.GetAdjective] commencent à massacrer sans distinction tous ceux qui se trouvent à proximité."
 zorgo_event.78.a: "Détruisez le camp barbare !"

 zorgo_event.79.t: "Le camp barbare : conclusion"
 zorgo_event.79.desc: "Comme prévu, nos soldats ont réussi à détruire les forces barbares qui leur faisaient face. Que pensaient ces sauvages en affrontant les hommes de [ROOT.GetCountry.GetName] ?\n\n[SCOPE.sCharacter('barbarian_camp_leader').GetName] a été retrouvé se tordant de douleur sur le champ de bataille, une profonde blessure de lance dans le dos, mais [ROOT.GetCountry.GetRuler.GetName] n’a fait preuve d’aucune clémence envers le chef barbare lâche et l’a exécuté sous les yeux de l’armée [ROOT.GetCountry.GetAdjective].\n\nLe camp barbare a été pillé avant d’être incendié et nos hommes ont repris la route de [ROOT.GetCountry.GetCapital.GetName], leurs sacs à dos remplis à craquer du butin mal acquis des pillards vaincus."
 zorgo_event.79.a: "Nous ferons de même à tous ceux qui s’en prennent à notre peuple"

 zorgo_event.80.t: "Le camp barbare : une richesse incommensurable"
 zorgo_event.80.desc: "Alors que les dernières redoutes barbares étaient livrées aux flammes, [ROOT.GetCountry.GetRuler.GetName] et ses conseillers se tenaient là, les mains sur la tête, abasourdis par leur découverte.\n\nUne somme colossale de talents d’argent et d’or a été trouvée dans vingt grands coffres : une fortune digne d’un roi. Non seulement ils ont libéré le peuple [ROOT.GetCountry.GetAdjective] d’une menace errante, mais ils ont également renfloué le trésor [ROOT.GetCountry.GetAdjective] d’un seul coup."
 zorgo_event.80.a: "Nous saurons en faire bon usage"

 zorgo_event.81.t: "Des récoltes ravagées"
 zorgo_event.81.desc: "Nous avons le regret de vous informer que la récolte de cette année sera particulièrement mauvaise. L’oïdium est devenu un fléau ces derniers temps et nous avons dû détruire une grande partie de ce qui avait été récolté."
 zorgo_event.81.a: "Malédiction !"

 zorgo_event.82.t: "Une occasion d’investissement"
 zorgo_event.82.desc: "Un groupe de marchands a hardiment approché [ROOT.GetCountry.GetRuler.GetName], lui demandant de mettre de côté des fonds publics afin d’acheter une cargaison de myrrhe à prix réduit. Ils souhaitent équiper une flotte privée et la conduire eux-mêmes jusqu’aux ports. Si nous les aidons et que tout se passe bien, nous pourrons doubler notre mise. Qu’en dites-vous ?"
 zorgo_event.82.a: "Nous ne jouerons pas le trésor aux dés"
 zorgo_event.82.b: "Qui ne risque rien n’a rien, n’est-ce pas ? Voyons ce qui arrivera"
 zorgo_event.82.c: "Mettez de côté une somme princière : nous allons être riches"

 zorgo_event.83.t: "Une occasion d’investissement : l’échec"
 zorgo_event.83.desc: "Eh bien, cela fait largement plus d’un an que le navire marchand chargé de la myrrhe à prix réduit, cette prétendue « incroyable occasion d’investissement » qui nous avait été présentée, aurait dû revenir. Nous pouvons donc affirmer sans risque qu’il ne reviendra jamais.\n\nInutile de préciser que tout l’argent que nous avions investi est perdu."
 zorgo_event.83.a: "J’aurais dû m’en douter ! Cela m’arrive tout le temps"

 zorgo_event.84.t: "De pluies abondantes près de [ROOT.GetCountry.GetCapital.GetName]"
 zorgo_event.84.desc: "Bien que tout le monde se plaigne de la pluie incessante, nos fermiers sont reconnaissants pour l’orage qui s’abat depuis une semaine sur [ROOT.GetCountry.GetCapital.GetName]. Nous connaissions un temps anormalement chaud, qui faisait dépérir les cultures et asséchait les champs. Les pluies ont toutefois tout changé."
 zorgo_event.84.a: "Loués soient les dieux !"

 zorgo_event.85.t: "L’épée ou l’arc ?"
 zorgo_event.85.desc: "[ROOT.GetCountry.GetRuler.GetName] a l’occasion de s’entraîner avec [SCOPE.sCharacter('warrior_trainer').GetName], un guerrier impressionnant qui excelle dans tous les aspects du combat et est réputé être un tuteur compétent.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] doit choisir l’objectif de cette séance."
 zorgo_event.85.a: "Montrez-moi une ou deux astuces à l’épée"
 zorgo_event.85.b: "Je préfère attaquer à distance : l’arc me convient"

 zorgo_event.86.t: "Une occasion d’investissement : réussite"
 zorgo_event.86.desc: "Une nouvelle incroyable ! Les investissements que nous avons réalisés ont effectivement porté leurs fruits et rapporté un joli bénéfice à [ROOT.GetCountry.GetName]. Bravo, [ROOT.GetCountry.GetRuler.GetName]. Les navires chargés de myrrhe sont arrivés dans nos ports il y a quelques jours et nous avons déjà vendu la majeure partie de la cargaison... Nous avons récupéré notre mise initiale et réalisé un bénéfice appréciable pour tous ces efforts."
 zorgo_event.86.a: "Quelle excellente nouvelle !"

 zorgo_event.87.t: "Une occasion d’investissement : réussite extraordinaire"
 zorgo_event.87.desc: "Une nouvelle incroyable ! Les investissements que nous avons réalisés ont effectivement porté leurs fruits et rapporté un joli bénéfice à [ROOT.GetCountry.GetName]. Bravo, [ROOT.GetCountry.GetRuler.GetName]. Les navires chargés de myrrhe sont arrivés dans nos ports il y a quelques jours et nous avons déjà vendu la majeure partie de la cargaison... Nous gagnons de l’argent à profusion."
 zorgo_event.87.a: "Quelle nouvelle incroyable !"

 zorgo_event.88.t: "Puisque vous m’accordez votre attention..."
 zorgo_event.88.desc: "Alors que [ROOT.GetCountry.GetName] se prépare pour une fête religieuse annuelle, [SCOPE.sCharacter('priest').GetName] a approché [ROOT.GetCountry.GetRuler.GetName] en privé, lui proposant de rencontrer notre [ROOT.GetCountry.GetRuler.GetTitleName] afin de prier ensemble, à l’écart, pour que les dieux continuent de nous accorder leurs bénédictions.\n\n[SCOPE.sCharacter('priest').GetFirstName] est une personne érudite, connue pour sa connaissance intime de diverses philosophies. Après quelques hésitations, [ROOT.GetCountry.GetRuler.GetFirstName] a finalement trouvé le courage de lui demander une faveur personnelle."
 zorgo_event.88.a: "Apprenez-moi à comprendre l’esprit des hommes"
 zorgo_event.88.b: "Je dois comprendre les voies des dieux..."

 zorgo_event.89.t: "Une journée aux courses"
 zorgo_event.89.desc: "Afin d’accroître sa popularité auprès des masses, [ROOT.GetCountry.GetRuler.GetName] a annoncé qu’une course de chars exceptionnelle aurait lieu dans un mois à [ROOT.GetCountry.GetCapital.GetName].\n\nDu pain gratuit sera distribué à tous les spectateurs et du vin coupé sera vendu au prix dérisoire d’une pièce par coupe. Le spectacle promet d’être l’événement de l’année."
 zorgo_event.89.a: "Venez tous ! Mais souvenez-vous de qui vous a invités"

 zorgo_event.90.t: "Une journée aux courses : la veille"
 zorgo_event.90.desc: "C’est la veille de la grande course de chars à [ROOT.GetCountry.GetCapital.GetName] et les boulangeries de toute la capitale sont remplies d’esclaves qui préparent les pains pour le lendemain. [ROOT.GetCountry.GetRuler.GetName] supervise personnellement les préparatifs lorsqu’un boulanger au visage rouge, la tunique couverte de farine, s’approche en se tordant les mains.\n\n« Nous attendons bien plus de monde demain que prévu et nous risquons de manquer de pain. Je suis désolé de vous le demander, mais nous avons besoin de provisions supplémentaires. »"
 zorgo_event.90.a: "Nous ne pouvons pas nous permettre de payer quoi que ce soit de superflu"
 zorgo_event.90.b: "Le peuple aura tout ce qu’il désire"

 zorgo_event.91.t: "Une journée aux courses : arrivée des auriges"
 zorgo_event.91.desc: "Alors que le soleil se lève sur [ROOT.GetCountry.GetCapital.GetName], les rues de la ville sont déjà remplies de centaines de personnes qui se disputent les meilleures places encore disponibles dans le stade au cœur de la cité. Bien qu’aucune structure permanente n’ait été construite dans la capitale [ROOT.GetCountry.GetAdjective] pour les courses de chevaux, le Forum a été débarrassé des étals des marchands et des bancs de bois ont été installés pour accueillir la foule.\n\nLorsque les meilleurs auriges du pays entrent fièrement dans le Forum, vêtus de leurs plus beaux atours, une immense acclamation parcourt la foule."
 zorgo_event.91.a: "Tout cela est si enthousiasmant !"

 zorgo_event.92.t: "Une journée aux courses : un pari amical"
 zorgo_event.92.desc: "Tout est prêt et la course va commencer d’un instant à l’autre lorsque [ROOT.GetCountry.GetRuler.GetName] sent une légère tape sur son épaule.\n\n« Que diriez-vous de rendre cet événement un peu plus intéressant ? Je mise cent pièces contre les vôtres... J’ai le pressentiment que mon aurige favori, Adonis, va gagner. »\n\nC’est [SCOPE.sCharacter('gambling_patriarch').GetName], un joueur invétéré dont on dit qu’il croule sous les dettes."
 zorgo_event.92.a: "Je ne joue pas, désolé..."
 zorgo_event.92.b: "J’accepte votre pari, pourquoi pas"

 zorgo_event.93.t: "Une journée aux courses : un pari amical"
 zorgo_event.93.desc: "La première épreuve, une course entre auriges solitaires, est terminée. Bien qu’elle ait tenu tout le monde en haleine jusqu’aux dernières secondes, le aurige favori de [ROOT.GetCountry.GetRuler.GetName] a gagné !\n\n[ROOT.GetCountry.GetRuler.GetFirstName] sourit pour lui-même, lève le poing vers le ciel et pousse un cri de joie."
 zorgo_event.93.a: "Je n’arrive pas à croire que j’ai gagné ! C’est incroyable !"

 zorgo_event.94.t: "Une journée aux courses : un pari amical"
 zorgo_event.94.desc: "Il va sans dire que [ROOT.GetCountry.GetRuler.GetName] a choisi le pire aurige du lot. [ROOT.GetCountry.GetRuler.GetFirstName] serre les dents de colère tandis qu’Adonis le Champion remporte l’épreuve, dépassant au galop tous les autres auriges pour s’emparer de la couronne de la victoire."
 zorgo_event.94.a: "Vite gagné, vite perdu... nous gagnerons davantage un autre jour"

 zorgo_event.95.t: "Une journée aux courses : conclusion"
 zorgo_event.95.desc: "La course de chars de [ROOT.GetCountry.GetCapital.GetName] restera certainement dans l’histoire [ROOT.GetCountry.GetAdjective] comme l’un des événements les plus mouvementés jamais organisés dans la capitale. À tous points de vue, ce fut un succès total. Le point culminant fut sans aucun doute la course finale, durant laquelle Adonis le Champion perdit le contrôle de son char et s’écrasa de façon spectaculaire avant d’être piétiné à mort par un quadrige. Tous les invités furent impressionnés par la nourriture et les boissons offertes par l’État, tandis que les marchands et aubergistes locaux se réjouirent de l’augmentation de leur activité. Alors que le soleil descend à l’horizon et que l’événement touche à sa fin, [ROOT.GetCountry.GetRuler.GetFirstName], épuisé mais exalté, ressent encore l’excitation de la journée."
 zorgo_event.95.a: "J’ai hâte de revenir aux courses !"

 zorgo_event.96.t: "Tensions à la frontière"
 zorgo_event.96.desc: "Nos espions rapportent que [aggressive_neighbor.GetName] rassemble une importante force d’invasion et teste nos frontières. Nous devrions préparer nos hommes, car il semble qu’une guerre soit imminente.\n\nCes tensions ont malheureusement fait flamber les prix à [ROOT.GetCountry.GetCapital.GetName], chacun se demandant s’il doit se préparer à un siège."
 zorgo_event.96.a: "Nous ne craignons personne, surtout pas ces chiens [aggressive_neighbor.GetAdjective]"

 zorgo_event.97.t: "Financer des bandits de grand chemin"
 zorgo_event.97.desc: "Nous avons obtenu des preuves accablantes que [aggressive_neighbor.GetName] paie des bandits pour rôder sur nos routes commerciales et attaquer tous ceux qui se dirigent vers [ROOT.GetCountry.GetName]. Ils espèrent apparemment perturber notre commerce, réduire nos revenus fiscaux et effrayer les marchands qui voudraient visiter [ROOT.GetCountry.GetCapital.GetName].\n\nLorsque nous avons présenté ces informations à leurs diplomates, ils ont vivement nié les faits, mais nous ne croyons pas ces menteurs [aggressive_neighbor.GetAdjective]."
 zorgo_event.97.a: "Vous pensiez que nous ne pourrions nous en rendre compte ?"

 zorgo_event.98.t: "Cadeaux étrangers"
 zorgo_event.98.desc: "Dans une habile tentative pour gagner l’amitié du peuple [ROOT.GetCountry.GetAdjective], le dirigeant de [friendly_neighbor.GetName], [friendly_neighbor.GetRuler.GetName], nous a envoyé un cadeau accompagné d’une note manuscrite. Il y loue nos relations harmonieuses et demande que le statu quo soit maintenu concernant nos frontières."
 zorgo_event.98.a: "C’est aimable de leur part, mais ne promettez rien"

 zorgo_event.99.t: "L’occasion de prier ensemble"
 zorgo_event.99.desc: "Nous avons reçu un message de [friendly_neighbor.GetName] nous demandant si nous accepterions de les honorer de la présence de représentants officiels [ROOT.GetCountry.GetAdjective] à une fête religieuse organisée dans leur capitale, [friendly_neighbor.GetCapital.GetName]. Le peuple [friendly_neighbor.GetAdjective] célèbre ses récoltes et, ayant été particulièrement béni cette année, souhaite partager l’abondance de ses dieux avec tous ses voisins."
 zorgo_event.99.a: "C’est très aimable de leur part... oui, nous irons"

 zorgo_event.100.t: "Démanteler les fortifications"
 zorgo_event.100.desc: "Nos éclaireurs rapportent que le gouvernement de [friendly_neighbor.GetName] connaît de graves difficultés financières et que, dans une tentative désespérée d’économiser chaque pièce, il a commencé à démanteler certaines de ses fortifications frontalières.\n\nTandis que leurs plus grandes forteresses restent garnies de troupes, les auxiliaires ont tous été renvoyés dans leurs villages... ce qui nous offre des possibilités, si nous sommes assez impitoyables pour les saisir."
 zorgo_event.100.a: "Informez nos généraux de cette bénédiction et voyez ce qu’ils veulent faire"

 zorgo_event.101.t: "Partir à la chasse"
 zorgo_event.101.desc: "[ROOT.GetCountry.GetRuler.GetName] travaille d’arrache-pied à [ROOT.GetCountry.GetCapital.GetName], se noyant lentement sous une mer de correspondances importantes qui auraient dû être traitées la veille, lorsqu’un coup ferme retentit à la porte de [ROOT.GetCountry.GetRuler.GetHerHis]. Ce sont [SCOPE.sCharacter('random_dude_hunter').GetName] et [SCOPE.sCharacter('random_dude_hunter_2').GetName], vêtus de leurs tenues de chasse. Derrière eux, dans la cour, une meute de chiens hirsutes jappe et se chamaille, tandis qu’une vingtaine de personnes s’affairent, certaines à cheval mais la plupart à pied.\n\n« Pardonnez-nous de vous déranger, [ROOT.GetCountry.GetRuler.GetFirstName], mais certains d’entre nous partent quelques jours à la campagne. La fête consacrée à #E [ROOT.GetCountry.Custom('get_harvest_goddess')]#! approche et il est d’usage que nous autres nobles allions chasser en l’honneur de cet événement sacré. Qu’en dites-vous ? »\n\nFixant la pile de travail devant [ROOT.GetCountry.GetRuler.GetHerHim], [ROOT.GetCountry.GetRuler.GetFirstName] se lève."
 zorgo_event.101.a: "Oui, cela semble merveilleux : partons immédiatement"
 zorgo_event.101.b: "Non, je suis trop occupé pour faire cela maintenant"

 zorgo_event.102.t: "Partir à la chasse : une journée à la campagne"
 zorgo_event.102.desc_1: "Maintenant que [ROOT.GetCountry.GetRuler.GetName] a accepté de participer à la chasse, il a été décidé que le groupe se rendrait dans un pavillon de chasse que [SCOPE.sCharacter('random_dude_hunter').GetName] entretient près de [SCOPE.sP('randomized_country_province').GetName].\n\nLe rythme est tranquille et les occasions de converser sont nombreuses en chemin. [ROOT.GetCountry.GetRuler.GetFirstName] chevauche aux côtés de [SCOPE.sCharacter('random_dude_hunter').GetName] et de [SCOPE.sCharacter('random_dude_hunter_2').GetName], et la conversation aborde toutes sortes d’expériences : enfance, mariage, batailles gagnées et perdues, nature des dieux, prix de l’immobilier à [ROOT.GetCountry.GetCapital.GetName]... tout ce qui peut se discuter en bonne société est évoqué.\n\nLorsque le groupe s’arrête pour camper ce soir-là, la conversation se poursuit autour d’un feu crépitant, le vin et les viandes grillées entretenant la bonne humeur. Bien que [ROOT.GetCountry.GetRuler.GetFirstName] connaisse [SCOPE.sCharacter('random_dude_hunter').GetFirstName] et [SCOPE.sCharacter('random_dude_hunter_2').GetFirstName] depuis des années, il ne se souvient pas de la dernière fois où [ROOT.GetCountry.GetRuler.GetSheHe] a eu une conversation aussi agréable."
 zorgo_event.102.desc_2: "Maintenant que [ROOT.GetCountry.GetRuler.GetName] a accepté de participer à la chasse, il a été décidé que le groupe se rendrait dans un pavillon de chasse que [SCOPE.sCharacter('random_dude_hunter').GetName] entretient près de [SCOPE.sP('randomized_country_province').GetName].\n\nUne pluie légère tombe, plus agaçante qu’autre chose, et en quelques instants tout le monde est trempé jusqu’aux os. Tous supportent stoïquement ce désagrément, à l’exception de [SCOPE.sCharacter('random_dude_hunter_2').GetName], qui ne cesse de jurer et de lancer des regards noirs à [ROOT.GetCountry.GetRuler.GetFirstName]. Crachant bruyamment au sol, [SCOPE.sCharacter('random_dude_hunter_2').GetFirstName] lève les bras au ciel et jure encore. Se tournant vers [ROOT.GetCountry.GetRuler.GetFirstName], [SCOPE.sCharacter('random_dude_hunter_2').GetFirstName] pointe un doigt et ricane.\n\n« Pas un nuage dans le ciel lorsque nous avons quitté [ROOT.GetCountry.GetCapital.GetName], mais maintenant les cieux nous pissent dessus. Qu’avez-vous fait pour irriter [ROOT.GetCountry.Custom('get_harvest_goddess')] ? Vous auriez peut-être dû rester chez vous... »\n\nTout le monde pousse un hoquet de stupeur devant cette violation choquante des convenances."
 zorgo_event.102.desc_3: "Maintenant que [ROOT.GetCountry.GetRuler.GetName] a accepté de participer à la chasse, il a été décidé que le groupe se rendrait dans un pavillon de chasse que [SCOPE.sCharacter('random_dude_hunter').GetName] entretient près de [SCOPE.sP('randomized_country_province').GetName].\n\nLe deuxième jour du voyage, le groupe traverse un petit ruisseau près d’une forêt lorsqu’un morceau de pierre effritée dans les bois attire l’œil de [ROOT.GetCountry.GetRuler.GetFirstName]. En s’approchant pour examiner les lieux, il apparaît que [ROOT.GetCountry.GetRuler.GetTitleName] a découvert un sanctuaire dédié à un dieu, couvert de lierre et manifestement en ruines. Des morceaux de marbre et de briques sont éparpillés partout, certains noircis par le feu.\n\n« Je n’ose imaginer les choses maléfiques qui se sont produites ici », marmonne sombrement [ROOT.GetCountry.GetRuler.GetFirstName] tandis que tous se rassemblent autour de [ROOT.GetCountry.GetRuler.GetHerHim]. « Pourtant, je sais que nous sommes toujours dans les frontières de [ROOT.GetCountry.GetName] et, aux dernières nouvelles, ma parole a force de loi. Descendez immédiatement de cheval, mes amis : il reste du travail avant de poursuivre notre route. »"
 zorgo_event.102.desc_4: "Le groupe n’est qu’à une journée de chevauchée de [ROOT.GetCountry.GetCapital.GetName] lorsqu’un groupe de cavaliers, leurs montures haletantes et couvertes de sueur, rattrape les chasseurs. Le messager en tête semble soulagé d’avoir retrouvé [ROOT.GetCountry.GetRuler.GetTitleName].\n\n« Salut à vous, [ROOT.GetCountry.GetRuler.GetName] ! Des affaires dans la capitale requièrent votre attention personnelle : vous devez rentrer immédiatement. »\n\nTout le monde paraît déçu, mais [ROOT.GetCountry.GetRuler.GetFirstName] ne pourra certainement pas poursuivre. Se tournant vers [ROOT.GetCountry.GetRuler.GetHerHis] hommes avec un regard mélancolique, [ROOT.GetCountry.GetRuler.GetFirstName] leur fait de tristes adieux et reprend le chemin du retour."
 zorgo_event.102.a: "Je ne vous savais pas si intéressants..."
 zorgo_event.102.b: "Je suis surpris de votre franchise : je m’en souviendrai"
 zorgo_event.102.c: "Restaurons le sanctuaire pour [ROOT.GetCountry.Custom('get_harvest_goddess')]"
 zorgo_event.102.d: "Bien sûr, il fallait que cela m’arrive... peut-être une prochaine fois"
 zorgo_event.102.e: "Vous avez peut-être raison ! Quel temps exécrable"

 zorgo_event.103.t: "Partir à la chasse : matin au camp"
 zorgo_event.103.desc_1: "Après une semaine de voyage, tout le monde est arrivé au pavillon de chasse de [SCOPE.sCharacter('random_dude_hunter').GetName] et l’excitation est palpable. Tous admettent que la vie a été stressante dernièrement à [ROOT.GetCountry.GetCapital.GetName] et que ce voyage est une occasion en or de se détendre et de passer un bon moment. Les chasseurs installent le camp et s’installent pour la soirée, convenant de prendre le petit-déjeuner avant le lever du soleil afin que la chasse coïncide avec les premières lueurs du jour.\n\nBien sûr, cette décision a été prise avant que [ROOT.GetCountry.GetRuler.GetName] ne sorte une cruche de vin [ROOT.GetCountry.GetAdjective] corsé autour du feu de camp. La bouteille circule jusqu’à être vidée, puis une autre est apportée, puis une autre encore, chacune connaissant le même destin que la première. Des rires tonitruants emplissent le camp et les histoires s’échangent toute la nuit.\n\nLe soleil pointait à peine à l’horizon lorsque [ROOT.GetCountry.GetRuler.GetFirstName] se traîna jusqu’à son lit, ivre mort, en se fourrant des brins d’herbe dans les oreilles pour ne plus entendre le chant matinal des oiseaux."
 zorgo_event.103.desc_2: "Après une semaine de voyage, tout le monde est arrivé au pavillon de chasse de [SCOPE.sCharacter('random_dude_hunter').GetName] et l’excitation est palpable. Tous admettent que la vie a été stressante dernièrement à [ROOT.GetCountry.GetCapital.GetName] et que ce voyage est une occasion en or de se détendre et de passer un bon moment. Les chasseurs installent le camp et s’installent pour la soirée, convenant de prendre le petit-déjeuner avant le lever du soleil afin que la chasse coïncide avec les premières lueurs du jour.\n\n[ROOT.GetCountry.GetRuler.GetName] est le premier à se réveiller, parfaitement reposé, et ne tarde pas à réveiller les autres. Peu après, les feux de camp sont éteints, quelques morceaux de pain et de viande froide sont rapidement avalés et les chasseurs partent dans la forêt."
 zorgo_event.103.desc_3: "Après une semaine de voyage, tout le monde est arrivé au pavillon de chasse de [SCOPE.sCharacter('random_dude_hunter').GetName] et l’excitation est palpable. Tous admettent que la vie a été stressante dernièrement à [ROOT.GetCountry.GetCapital.GetName] et que ce voyage est une occasion en or de se détendre et de passer un bon moment. Les chasseurs installent le camp et s’installent pour la soirée, convenant de prendre le petit-déjeuner avant le lever du soleil afin que la chasse coïncide avec les premières lueurs du jour.\n\nMalheureusement pour tous, les pluies qui ont commencé aux abords de la capitale semblent avoir suivi le groupe et [ROOT.GetCountry.GetRuler.GetName] ne parvient pas à dormir correctement à cause de la bruine incessante. Sortant de la tente de [ROOT.GetCountry.GetRuler.GetFirstName] après une nuit agitée, [ROOT.GetCountry.GetRuler.GetFirstName] tousse rauquement, le corps entier tremblant."
 zorgo_event.103.desc_4: "Après une semaine de voyage, tout le monde est arrivé au pavillon de chasse de [SCOPE.sCharacter('random_dude_hunter').GetName] et l’excitation est palpable. Tous admettent que la vie a été stressante dernièrement à [ROOT.GetCountry.GetCapital.GetName] et que ce voyage est une occasion en or de se détendre et de passer un bon moment. Les chasseurs installent le camp et s’installent pour la soirée, convenant de prendre le petit-déjeuner avant le lever du soleil afin que la chasse coïncide avec les premières lueurs du jour.\n\nÀ l’aube, [ROOT.GetCountry.GetRuler.GetName] tend son arc lorsqu’un grand bruissement retentit dans les bois. Dégainant rapidement une flèche et se retournant, [ROOT.GetCountry.GetRuler.GetFirstName] est surpris de voir un groupe de soldats vêtus à la mode [ROOT.GetCountry.GetAdjective] sortir de la forêt.\n\n« Les dieux soient remerciés de nous avoir permis de vous retrouver, [ROOT.GetCountry.GetRuler.GetFirstName] ! Nous suivons votre groupe depuis une semaine. Vous devez retourner immédiatement à [ROOT.GetCountry.GetCapital.GetName], car un terrible accident s’est produit : votre héritier principal, [SCOPE.sCharacter('zorgo_event_103_heir').GetName], a été grièvement blessé. »"
 zorgo_event.103.a: "Donnez-moi juste... hips... quelques heures et je serai prêt"
 zorgo_event.103.b: "Et c’est parti !"
 zorgo_event.103.c: "Je commence à me sentir mal... beurk"
 zorgo_event.103.d: "Nous devons rentrer immédiatement : chevauchons vers [ROOT.GetCountry.GetCapital.GetName] !"


 zorgo_event.104.t: "Partir à la chasse : au cœur de la forêt"
 zorgo_event.104.desc_1: "Au final, la seule chose que [ROOT.GetCountry.GetRuler.GetName] rapportera sera de nouvelles histoires à raconter. Il semble que [ROOT.GetCountry.Custom('get_harvest_goddess')] n’ait pas jugé bon de bénir [ROOT.GetCountry.GetRuler.GetHerHim] d’une chasse fructueuse aujourd’hui.\n\nCe ne fut toutefois pas une perte de temps totale : aucun des autres chasseurs ne fit mieux et tous plaisantèrent au camp au sujet de leur malchance. Bientôt, un feu rugissant crépita dans la nuit et les chasseurs racontèrent à tour de rôle les cerfs qu’ils avaient vus bondir agilement au bord des champs, ou les ours qui avançaient lourdement dans les broussailles. À mesure que les récits de bravoure et d’audace s’enchaînèrent, les rires et les réjouissances se prolongèrent jusque tard dans la nuit."
 zorgo_event.104.desc_2: "[ROOT.GetCountry.GetRuler.GetName] a passé la majeure partie de la journée à ramper dans les broussailles épaisses et enchevêtrées de l’arrière-pays, sans rien rapporter après ces innombrables heures passées au cœur de la forêt. Comble du ridicule, [ROOT.GetCountry.GetRuler.GetSheHe] a même réussi à se séparer des autres et à se perdre. Le crépuscule devenait nuit lorsque [ROOT.GetCountry.GetRuler.GetFirstName] retrouva enfin les autres chasseurs, qui recherchaient désespérément [ROOT.GetCountry.GetRuler.GetTitleName].\n\nIrrité au-delà de toute mesure, [ROOT.GetCountry.GetRuler.GetFirstName] ordonna de plier le camp et de rentrer immédiatement."
 zorgo_event.104.desc_3: "Tous ceux qui étaient présents peuvent l’attester : [ROOT.GetCountry.Custom('get_harvest_goddess')] était véritablement aux côtés de [ROOT.GetCountry.GetRuler.GetName] ce jour-là, car personne ne fut aussi chanceux pour pister et trouver des animaux dans les forêts sombres de [SCOPE.sP('randomized_country_province').GetName]. [ROOT.GetCountry.GetRuler.GetFirstName] abattit un grand cerf et, sans [ROOT.GetCountry.GetRuler.GetHerHis] visée heureuse, personne n’aurait eu de nourriture fraîche pour le dîner.\n\nQuelques heures plus tard, le ventre rempli de cerf rôti et de vin [ROOT.GetCountry.GetAdjective] corsé, les chasseurs commencèrent à louer leur chef et à trinquer au long règne de [ROOT.GetCountry.GetRuler.GetFirstName] sur [ROOT.GetCountry.GetName]."
 zorgo_event.104.desc_4: "Le cerf pousse un puissant bramement de douleur lorsque la flèche de [ROOT.GetCountry.GetRuler.GetName] s’enfonce profondément dans son dos, et l’animal gigantesque chancelle avant de s’effondrer. Accourant, [ROOT.GetCountry.GetRuler.GetFirstName] lui porte le coup fatal et appelle les autres en riant de la taille de la bête qu’il vient d’abattre.\n\nLe cerf est gigantesque, doté d’un pelage épais et hirsute qui a connu de nombreux hivers, ainsi que de bois presque aussi longs qu’un homme de haute taille. Lorsque les autres verront ce que [ROOT.GetCountry.GetRuler.GetFirstName] a accompli, ils seront secrètement envieux, chacun regrettant de ne pas avoir été béni par [ROOT.GetCountry.Custom('get_harvest_goddess')] et gratifié d’un trophée aussi glorieux."
 zorgo_event.104.desc_5: "[ROOT.GetCountry.GetRuler.GetName] attend depuis des heures près d’un lac, scrutant l’horizon à la recherche du moindre signe de vie, mais aucun animal ne s’est approché de toute la journée. Tandis que le soleil traverse le ciel, [ROOT.GetCountry.GetRuler.GetFirstName] s’irrite de plus en plus et maudit sa malchance.\n\nLa chasse se solde par un échec et, déçu, [ROOT.GetCountry.GetRuler.GetSheHe] retourne au camp."
 zorgo_event.104.desc_6: "[ROOT.GetCountry.GetRuler.GetName] rampe dans des buissons lorsqu’un rugissement retentit soudain : un ours ! Il n’a pas le temps de dégainer une arme que l’animal saisit la jambe de [ROOT.GetCountry.GetRuler.GetFirstName]. En quelques instants, le [ROOT.GetCountry.GetRuler.GetTitleName] de [ROOT.GetCountry.GetName] se retrouve engagé dans un combat désespéré pour sa vie.\n\nSi [ROOT.GetCountry.GetRuler.GetFirstName] a survécu, c’est uniquement parce que les autres chasseurs ont entendu ses cris et se sont précipités à son secours. Tous peuvent cependant voir qu’il est grièvement blessé."
 zorgo_event.104.desc_7: "Lorsque [ROOT.GetCountry.GetRuler.GetName] se réveille au camp plus tard dans la soirée, sa tête est bandée et [ROOT.GetCountry.GetRuler.GetSheHe] n’a aucun souvenir de la journée. C’est [SCOPE.sCharacter('random_dude_hunter').GetName] qui doit raconter à [ROOT.GetCountry.GetRuler.GetFirstName] ce qui s’est passé.\n\n« Vous êtes tombé de votre cheval, mon [ROOT.GetCountry.GetRuler.GetTitleName], et vous vous êtes violemment cogné la tête. Louée soit [ROOT.GetCountry.Custom('get_harvest_goddess')] de vous avoir réveillé, car nous pensions que vous ne le feriez pas. »"
 zorgo_event.104.desc_8: "Cela fait des heures que [ROOT.GetCountry.GetRuler.GetName] n’a vu personne. [ROOT.GetCountry.GetRuler.GetSheHe] est si profondément enfoui dans les bois que la cime des arbres bloque entièrement la lumière du soleil. Le cri solitaire d’un loup résonne au loin et un frisson parcourt l’échine de [ROOT.GetCountry.GetRuler.GetFirstName] lorsqu’il découvre une petite hutte dans l’obscurité.\n\nS’approchant de la porte, la main sur la garde de son arme, [ROOT.GetCountry.GetRuler.GetFirstName] est accueilli par une vieille femme, les yeux couverts de bandages. Elle lève une main desséchée et affiche un sourire édenté. « Je vous attendais, [ROOT.GetCountry.GetRuler.GetName]. Donnez-moi cent pièces et je vous bénirai au nom de [ROOT.GetCountry.Custom('get_harvest_goddess')]. »"
 zorgo_event.104.desc_9: "Jusqu’à présent, [ROOT.GetCountry.GetRuler.GetName] n’a rien réussi à attraper et passe plus de temps à récupérer les flèches qui ont manqué leur cible qu’à faire autre chose. La journée commence à ressembler à un échec, mais malgré ce résultat décevant, [ROOT.GetCountry.GetRuler.GetFirstName] garde le moral en retournant au camp.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] traverse un ravin ombragé lorsqu’il fait une découverte stupéfiante : là, dans une nappe de soleil, brille de l’or ! Une amphore brisée renferme une petite fortune."
 zorgo_event.104.desc_10: "[ROOT.GetCountry.GetRuler.GetName] n’a jamais rien vu de tel de sa vie : au bord du lac, un cerf blanc s’abreuve, le dos tourné au chasseur.\n\nPlongeant la main dans son carquois, [ROOT.GetCountry.GetRuler.GetFirstName] encocha doucement une flèche et, une prière à [ROOT.GetCountry.Custom('get_harvest_goddess')] aux lèvres, la décocha.\n\nQuelques secondes plus tard, la majestueuse bête s’effondra, morte. La flèche de [ROOT.GetCountry.GetRuler.GetName] avait atteint sa cible. En s’approchant de l’animal, [ROOT.GetCountry.GetRuler.GetFirstName] formula une nouvelle prière d’action de grâce."
 zorgo_event.104.desc_11: "[ROOT.GetCountry.GetRuler.GetName] court à toute vitesse, le souffle s’échappant en violentes bouffées. Derrière [ROOT.GetCountry.GetRuler.GetHerHim], une meute de loups affamés le poursuit et semble sur le point de rattraper sa proie.\n\nLe sol cède soudain et [ROOT.GetCountry.GetRuler.GetFirstName] dévale une ravine vers le bord d’une falaise. Le claquement de mâchoires et les hurlements furieux résonnent au-dessus de lui, tandis que les loups sautent à sa suite.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] se précipite vers le précipice, sachant déjà ce qu’il doit faire. Quelques secondes plus tard, il fend les airs comme un oiseau maladroit et s’écrase dans la rivière en contrebas après ce qui semble une éternité. Très haut au-dessus, les loups hurlent de frustration tandis que [ROOT.GetCountry.GetRuler.GetFirstName] s’éloigne du danger, essoufflé, terrifié, mais vivant."
 zorgo_event.104.desc_12: "Après une sortie fructueuse, tout le monde s’est rassemblé au camp et la conversation se tourne inévitablement vers le chasseur le plus chanceux et le plus habile.\n\nDe l’avis général, [ROOT.GetCountry.GetRuler.GetName] a remporté la palme en abattant trois cerfs. Il semble que [ROOT.GetCountry.Custom('get_harvest_goddess')] ait voulu que le [ROOT.GetCountry.GetRuler.GetTitleName] reçoive la part du lion de la gloire aujourd’hui."
 zorgo_event.104.desc_13: "Tout le monde au camp est d’humeur sombre et mange seul dans sa tente. Après les événements tragiques de la journée, qui pourrait les blâmer ?\n\nMalheureusement pour [ROOT.GetCountry.GetRuler.GetName], il semble que [ROOT.GetCountry.Custom('get_harvest_goddess')] ait voulu punir le [ROOT.GetCountry.GetRuler.GetTitleName], car aucune explication logique ne permet de comprendre ce qui s’est passé. Une meute de loups s’est jetée sur [ROOT.GetCountry.GetRuler.GetFirstName], attaquant sauvagement son visage et manquant de le déchiqueter.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] a survécu à l’attaque, mais non sans perdre ses yeux..."
 zorgo_event.104.desc_14: "[ROOT.GetCountry.GetRuler.GetName] suit discrètement un cerf, l’arc bandé et toute son attention concentrée sur l’animal devant [ROOT.GetCountry.GetRuler.GetHerHim]. À quelques pas derrière [ROOT.GetCountry.GetRuler.GetFirstName], [SCOPE.sCharacter('random_dude_hunter').GetName] le suit, et le seul son dans la forêt est le murmure agité d’un petit ruisseau.\n\nLe cerf, inconscient du danger mortel qui le menace, lape calmement l’eau du ruisseau. [ROOT.GetCountry.GetRuler.GetFirstName] s’accroupit, à quelques instants de tirer sur sa proie.\n\nSans prévenir, un éclair d’acier, une douleur aiguë, puis les ténèbres."
 zorgo_event.104.a: "Tu n’as pas tué deux ours, [SCOPE.sCharacter('random_dude_hunter').GetFirstName] ! Tu racontes n’importe quoi"
 zorgo_event.104.b: "Quelle perte de temps !"
 zorgo_event.104.c: "Je vivrai chaque jour en gardant à l’esprit le bien-être du peuple [ROOT.GetCountry.GetAdjective]"
 zorgo_event.104.d: "Ce n’était pas de la chance : ce que vous avez vu, c’est du talent, mes amis"
 zorgo_event.104.e: "C’est parfois ainsi..."
 zorgo_event.104.f: "De l’eau... tousse... que quelqu’un m’apporte de l’eau"
 zorgo_event.104.g: "Grands dieux, c’était moins une !"
 zorgo_event.104.h: "Donnez-moi votre bénédiction, puis je reprendrai ma route"
 zorgo_event.104.i: "Quelle découverte incroyable !"
 zorgo_event.104.j: "Quel glorieux présent vous avez offert à votre serviteur ! Je vous en remercie"
 zorgo_event.104.k: "Ouf... c’était moins une"
 zorgo_event.104.l: "Peut-être que la prochaine fois, les autres feront mieux"
 zorgo_event.104.m: "C’est une tragédie, un désastre !"
 zorgo_event.104.n: "Comment cela a-t-il pu arriver..."

 zorgo_event.105.t: "Partir à la chasse : retour au bercail"
 zorgo_event.105.desc_1: "Tout le monde était d’humeur agréable en chevauchant vers [ROOT.GetCountry.GetCapital.GetName], profitant de quelques instants de silence sur les routes. Bientôt, les portes de la capitale furent visibles au loin."
 zorgo_event.105.desc_2: "Le voyage de retour vers [ROOT.GetCountry.GetCapital.GetName] fut sans histoire, voire plutôt agréable. Le temps était clément et les habitants de [SCOPE.sP('randomized_country_province').GetName] sortirent pour saluer et acclamer [ROOT.GetCountry.GetRuler.GetName] lorsqu’il passa devant leurs villages.\n\nD’humeur joyeuse et enjouée ce soir-là, [ROOT.GetCountry.GetRuler.GetFirstName] ne se fit pas prier pour jouer son rôle de [ROOT.GetCountry.GetRuler.GetTitleName], prenant le temps de saluer les citoyens de [ROOT.GetCountry.GetName] en passant à cheval. C’était la manière idéale de conclure l’expédition de chasse et de reprendre progressivement ses fonctions officielles."
 zorgo_event.105.desc_3: "Alors que le groupe rentrait vers [ROOT.GetCountry.GetCapital.GetName], la conversation entre [SCOPE.sCharacter('random_dude_hunter_2').GetName] et [ROOT.GetCountry.GetRuler.GetName] s’orienta vers l’art de gouverner, car nul n’ignore que [SCOPE.sCharacter('random_dude_hunter_2').GetFirstName] s’intéresse à tout ce qui concerne la gestion de l’État [ROOT.GetCountry.GetAdjective].\n\n[ROOT.GetCountry.GetRuler.GetFirstName] se fit un plaisir de répondre en détail, et ceux qui les observaient purent voir les liens d’amitié se renforcer entre eux."
 zorgo_event.105.desc_4: "Tout se passa bien sur le chemin du retour vers [ROOT.GetCountry.GetCapital.GetName], jusqu’à la tombée de la nuit. La capitale étant proche, chacun avait baissé sa garde et personne ne prêtait vraiment attention.\n\nSans prévenir, une bande de brigands fondit sur les chasseurs. Les guerriers vainquirent les voleurs et les mirent en fuite, mais à un prix élevé : étendu dans la rue et couvert de sang gisait le corps de [SCOPE.sCharacter('random_dude_hunter').GetName]."
 zorgo_event.105.a: "Enfin de retour chez nous : merci de m’avoir invité, mes amis"
 zorgo_event.105.b: "Je suis comblé d’avoir des compatriotes si loyaux et aimants"
 zorgo_event.105.c: "Si vous avez d’autres questions, [SCOPE.sCharacter('random_dude_hunter_2').GetFirstName], n’hésitez pas à les poser"
 zorgo_event.105.d: "Oh non... ce n’est pas possible !"

 zorgo_event.106.t: "Partir à la chasse : conclusion"
 zorgo_event.106.desc: "[ROOT.GetCountry.GetRuler.GetName] est rentré à [ROOT.GetCountry.GetCapital.GetName] et, en quelques jours, toute la bonne société a appris ce qui s’était passé durant le voyage. Mais cela était bien sûr prévisible. Malgré les commérages des chasseurs, [ROOT.GetCountry.GetRuler.GetFirstName] n’est pas trop contrarié et se montre magnanime tandis que ses esclaves commencent à faire chauffer de l’eau.\n\nUne heure plus tard, [ROOT.GetCountry.GetRuler.GetFirstName] profite d’un bain chaud et d’un verre de vin dans ses appartements privés, méditant sur les événements du mois écoulé."
 zorgo_event.106.a: "Je devrais remercier [ROOT.GetCountry.Custom('get_harvest_goddess')] de m’avoir ramené sain et sauf"

 zorgo_event.107.t: "Des diplomates attaqués"
 zorgo_event.107.desc: "[ROOT.GetCountry.GetRuler.GetName], nous avons le regret de vous informer que certains messagers envoyés depuis [ROOT.GetCountry.GetName] ont été attaqués par des bandits sur la route quittant [ROOT.GetCountry.GetCapital.GetName].\n\nHeureusement, nos diplomates ont survécu à l’attaque, mais ils sont naturellement terrifiés à l’idée de voyager désormais."
 zorgo_event.107.a: "Comme c'est vexant..."

 zorgo_event.108.t: "Maître de la diplomatie"
 zorgo_event.108.desc: "Tout le monde reconnaît que [ROOT.GetCountry.GetRuler.GetName] est un maître incontesté de la négociation, capable de convaincre les diplomates d’accepter sa volonté. Jamais [ROOT.GetCountry.GetName] n’avait eu pour dirigeant un homme d’État aussi habile."
 zorgo_event.108.a: "Je ne vis que pour servir le peuple"

 zorgo_event.109.t: "Régler les vieilles dettes"
 zorgo_event.109.desc: "Nous avons le plaisir de vous annoncer que nous avons reçu des arriérés d’impôts qui nous étaient dus.\n\nBien que nous regrettions d’avoir dû attendre si longtemps pour recevoir ce qui nous revient de droit, nos citoyens savent au moins ce qu’ils doivent à l’État [ROOT.GetCountry.GetAdjective]."
 zorgo_event.109.a: "Mieux vaut tard que jamais, comme on dit..."

 zorgo_event.110.t: "Le sujet de toutes les conversations à [ROOT.GetCountry.GetCapital.GetName]"
 zorgo_event.110.desc: "La fête consacrée à [ROOT.GetCountry.Custom('get_harvest_goddess')], qui a lieu tous les cinq ans à [ROOT.GetCountry.GetCapital.GetName], vient de s’achever. Ceux qui se sont rendus dans la capitale pour les célébrations ne cessent de louer la générosité de [ROOT.GetCountry.GetRuler.GetName].\n\nLes récoltes ont été spectaculaires cette année et l’abondance de nos champs a été partagée avec tous. Notre peuple rentre le cœur et le ventre pleins, louant les dieux ainsi que le [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetAdjective]."
 zorgo_event.110.a: "J’attends cet événement chaque année avec impatience"

 zorgo_event.111.t: "Pénurie d’eau dans les puits sacrés"
 zorgo_event.111.desc: "[ROOT.GetCountry.GetRuler.GetName], nous avons reçu un rapport inquiétant : il semblerait que l’eau de nos puits sacrés près de [ROOT.GetCountry.GetCapital.GetName] soit en train de disparaître.\n\nC’est un terrible présage pour le peuple [ROOT.GetCountry.GetAdjective] et la nouvelle de ce qui se passe se répand rapidement... Je suis désolé. Il semble que nous ayons d’une manière ou d’une autre encouru le mécontentement divin."
 zorgo_event.111.a: "Nous devons prier et espérer"

 zorgo_event.112.t: "Les puits sacrés débordent"
 zorgo_event.112.desc: "Mon [ROOT.GetCountry.GetRulerTitle], vous ne croirez pas ce qui se passe près de [ROOT.GetCountry.GetCapital.GetName] ! Les puits sacrés si chers à notre peuple semblent déborder : l’eau est impossible à contenir et jaillit sans discontinuer.\n\nLe peuple est fou de joie ! Nous n’avons jamais rien vu de tel à [ROOT.GetCountry.GetName]. Qu’est-ce que cela peut bien signifier ?"
 zorgo_event.112.a: "Mon choix est juste"

 zorgo_event.113.t: "Un nuraghe endommagé doit être réparé"
 zorgo_event.113.desc: "Les habitants près de [ROOT.GetCountry.GetCapital.GetName] rapportent que le nuraghe le plus proche de la capitale présente des signes visibles de délabrement, de profondes fissures menaçant d’endommager définitivement la structure.\n\nIl est demandé à [ROOT.GetCountry.GetRuler.GetName] de faire tout son possible pour régler ce problème. Laisser cette affaire sans suite serait considéré comme un signe d’irrespect envers [ROOT.GetCountry.Custom('get_harvest_goddess')]."
 zorgo_event.113.a: "Bien sûr, nous allons nous en occuper !"
 zorgo_event.113.b: "Je le crains, nous n’avons pas les ressources nécessaires"

 zorgo_event.114.t: "Une visite au temple de Sardos"
 zorgo_event.114.desc: "Il a été proposé que [ROOT.GetCountry.GetRuler.GetName] se rende au temple de #E Sardos#!, le dieu des guerriers et protecteur des fermes. Sardos doit recevoir les offrandes du peuple [ROOT.GetCountry.GetAdjective] afin de garantir ses bénédictions pour les années à venir.\n\nCette importante responsabilité revient à [ROOT.GetCountry.GetRuler.GetFirstName] et tous les regards sont tournés vers [ROOT.GetCountry.GetRuler.GetHerHim]."
 zorgo_event.114.a: "C’est mon devoir d’y aller : nous partirons à l’aube"
 zorgo_event.114.b: "Je suis malheureusement trop occupé"

 zorgo_event.115.t: "Le temple de Sardos"
 zorgo_event.115.desc: "Après une courte semaine de voyage, [ROOT.GetCountry.GetRuler.GetName] a enfin atteint le temple de Sardos, l’un des lieux les plus anciens et les plus sacrés de [ROOT.GetCountry.GetName].\n\nAprès s’être purifié rituellement, le [ROOT.GetCountry.GetRulerTitle] est entré dans le sanctuaire de Sardos et y est resté des heures en contemplation silencieuse.\n\nAlors que le soleil commençait à disparaître derrière la ligne d’arbres au loin, [ROOT.GetCountry.GetRuler.GetFirstName] est sorti du temple et a trouvé quelques prêtres dehors, leur présence étant manifestement intentionnelle."
 zorgo_event.115.a: "Laissons une offrande votive et demandons des bénédictions"
 zorgo_event.115.b: "Nous ne pouvons pas nous permettre de laisser un présent ici"

 zorgo_event.116.t: "On a dérangé ses cercles"
 zorgo_event.116.desc: "Lors du pillage de [GetProvince('(int32)84').GetName], des soldats sont tombés sur un vieillard qui dessinait des symboles dans le sable et criait avec ferveur : « Ne dérangez pas mes cercles ! » Certains affirment qu’il s’agissait d’Archimède, un mathématicien de génie, mais d’autres en doutent. Quoi qu’il en soit, cela a suffisamment intrigué nos soldats pour qu’ils s’en souviennent à la fin de la journée."
 zorgo_event.116.a: "Vite, écrivez tout cela."

 zorgo_event.117.t: "Des viols et des pillages"
 zorgo_event.117.desc: "Il y a des générations, les Romains nous ont traîtreusement volé nos femmes. Aujourd’hui, la ville est tombée aux mains de nos hommes et beaucoup ont déjà commencé à la piller. Certains sont venus nous demander de ramener les descendantes de nos femmes chez nous, à [ROOT.GetCountry.GetCapital.GetName]. D’autres soutiennent cependant que trop de temps s’est écoulé et que leurs descendantes sont désormais romaines."
 zorgo_event.117.a: "Ramenez nos femmes !"
 zorgo_event.117.b: "Elles sont devenues romaines et ne sont plus sabines."

 zorgo_event.118.t: "Le sage du divin"
 zorgo_event.118.desc: "[ROOT.GetCountry.GetRuler.GetName], nous avons reçu un rapport d’un magistrat local que vous devriez entendre. La semaine dernière, nos gardes-frontières ont rencontré un sadhu renommé qui quittait [ROOT.GetCountry.GetCapital.GetName] en pèlerinage vers les lieux sacrés [GetCountry('MRY').GetAdjective], suivi par une foule de centaines de personnes.\n\nCe vagabond, un sage nommé [SCOPE.sCharacter('izn_divine_scholar').GetName] connu dans tout [ROOT.GetCountry.GetName] pour sa piété, serait parti de [ROOT.GetCountry.GetCapital.GetName] pour étudier les nombreuses religions de [ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName] dans l’espoir d’en tirer une vérité universelle. Mais un léger problème se pose : [SCOPE.sCharacter('izn_divine_scholar').GetFirstName] est très aimé des citoyens de notre capitale et une grande tristesse les a envahis, car ils ne veulent pas voir le sage quitter notre pays.\n\n[ROOT.GetCountry.GetRuler.GetFirstName], avez-vous peut-être quelque chose à dire à ce sujet ?"
 zorgo_event.118.a: "Demandez à Izn de rejoindre ma cour : nous devrions tous profiter de sa sagesse"
 zorgo_event.118.b: "Peut-être ce sage m’enseignera-t-il quelque chose avant son départ ?"
 zorgo_event.118.c: "Arrêtez-le s’il tente de franchir les frontières"

 zorgo_event.121.t: "Le prix du cannibalisme"
 zorgo_event.121.desc_1: "Depuis quelques jours, l’estomac de [ROOT.GetCountry.GetRuler.GetName] fait souffrir [ROOT.GetCountry.GetRuler.GetHerHim], contraignant le [ROOT.GetCountry.GetRulerTitle] à se retirer dans ses appartements, à portée de main d’un pot de chambre."
 zorgo_event.121.desc_2: "Dernièrement, [ROOT.GetCountry.GetRuler.GetName] consomme la chair humaine, se gavant lors des sacrifices qui ont lieu à [ROOT.GetCountry.GetCapital.GetName] et se faisant connaître dans tout [ROOT.GetCountry.GetName] comme un cannibale zélé.\n\nAinsi, lorsque le [ROOT.GetCountry.GetRulerTitle] fut frappé d’une étrange maladie quelques jours après la fin de la dernière cérémonie, nombre d’habitants de la capitale [ROOT.GetCountry.GetAdjective] accusèrent la gloutonnerie de [ROOT.GetCountry.GetRuler.GetFirstName] d’avoir attiré ce malheur sur [ROOT.GetCountry.GetRuler.GetHerHim]. [ROOT.GetCountry.GetRuler.GetFirstName] avait certainement mangé quelqu’un qui était malade et s’était ainsi infecté."
 zorgo_event.121.desc_3: "Dans une répugnante démonstration d’opulence indigne d’un [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetAdjective], [ROOT.GetCountry.GetRuler.GetName] a contracté la goutte à cause de son mode de vie aristocratique. Tout le monde sait que [ROOT.GetCountry.GetRuler.GetSheHe] est un gourmet, mais ces appétits sont récemment devenus incontrôlables.\n\nOn dit que les réserves de [ROOT.GetCountry.GetRuler.GetFirstName] regorgent de mets raffinés importés de l’étranger : de délicieuses dattes @dates! venues du lointain Sud, des vins doux @wine! importés par des marchands helléniques et des épices succulentes @spices! que l’on ne trouve que dans l’Inde lointaine #E India#! sont tous gardés sous clé. Et [ROOT.GetCountry.GetRuler.GetFirstName] ne se contente pas de festoyer de fromages et de viandes rôties à chaque repas : [ROOT.GetCountry.GetRuler.GetSheHe] est également connu pour consommer régulièrement de la chair humaine préparée de manière élaborée, exigeant des esclaves travaillant dans les cuisines de [ROOT.GetCountry.GetCapital.GetName] qu’ils concoctent des horreurs culinaires pour satisfaire son avidité."
 zorgo_event.121.desc_4: "Lorsque [ROOT.GetCountry.GetRuler.GetName] tomba malade pour la première fois, les dieux manifestèrent clairement leur mécontentement envers le [ROOT.GetCountry.GetRulerTitle] par des présages. Pendant des mois, le lait de nos troupeaux eut un goût de soufre et le ciel se vida de ses nuages, provoquant dans tout [ROOT.GetCountry.GetName] une sécheresse qui terrifia les fermiers [ROOT.GetCountry.GetAdjective].\n\nLa passion de [ROOT.GetCountry.GetRuler.GetFirstName] pour la chair humaine était récemment devenue une véritable manie et d’innombrables prisonniers avaient été traînés en hurlant des cachots de [ROOT.GetCountry.GetCapital.GetName] jusqu’à la table du cruel [ROOT.GetCountry.GetRulerTitle]. Les rumeurs sur les appétits tyranniques de [ROOT.GetCountry.GetRuler.GetFirstName] emplirent les tribus locales d’effroi et beaucoup furent secrètement ravis d’apprendre que [ROOT.GetCountry.GetRuler.GetSheHe] était malade."
 zorgo_event.121.desc_5: "[ROOT.GetCountry.GetRuler.GetName] a sûrement mangé quelqu’un qui était infecté par une maladie, car le [ROOT.GetCountry.GetRulerTitle] se sent particulièrement mal. Une toux rauque rend sa vie misérable et aucun des remèdes proposés par l’Apothicaire ne semble aider.\n\nBien que [ROOT.GetCountry.GetRuler.GetSheHe] ait courageusement tenté de remplir ses devoirs à [ROOT.GetCountry.GetCapital.GetName] malgré ses maux, son refroidissement de poitrine s’est aggravé au cours des jours suivants et l’a contraint à un repos forcé au lit."
 zorgo_event.121.desc_6: "[ROOT.GetCountry.GetRuler.GetName] s’est montré très imprudent dernièrement et a dû manger une victime sacrificielle infectée par une maladie de peau invalidante. Quelle horrible surprise lorsque le [ROOT.GetCountry.GetRulerTitle] s’est réveillé un matin avec une étrange éruption sur le bras, plongeant toute la maisonnée dans la frénésie."
 zorgo_event.121.desc_7: "[ROOT.GetCountry.GetRuler.GetName] ne peut faire dix pas sans devoir utiliser un pot de chambre. Ses intestins se vident constamment et [ROOT.GetCountry.GetRuler.GetSheHe] peine à garder de l’eau sans tomber violemment malade. Il semble que le [ROOT.GetCountry.GetRulerTitle] ait contracté une maladie quelconque, peut-être à cause de son appétit pour la chair humaine."
 zorgo_event.121.desc_8: "Au début, [ROOT.GetCountry.GetRuler.GetName] refusa de croire ses propres yeux, mais au fil des jours et des semaines, il devint impossible d’ignorer la vérité : [ROOT.GetCountry.GetRuler.GetFirstName] était infecté par la peste."
 zorgo_event.121.desc_9: "Un matin, [ROOT.GetCountry.GetRuler.GetName] se réveilla avec le ventre et le visage gonflé couverts d’une éruption douloureuse. Des guérisseurs furent immédiatement appelés, mais ils ne purent que confirmer que [ROOT.GetCountry.GetRuler.GetFirstName] avait contracté la variole. Aucun de leurs onguents ni cataplasmes ne parvint à extraire la maladie de la chair fiévreuse de [ROOT.GetCountry.GetRuler.GetFirstName]."
 zorgo_event.121.desc_10: "Au cours des dernières années, [ROOT.GetCountry.GetRuler.GetName] s’est forgé une réputation d’amateur de chair humaine, allant bien au-delà de ce qui est considéré comme normal dans la société [ROOT.GetCountry.GetAdjective], où de telles activités ne sont généralement pas réprouvées.\n\nOn dit que [ROOT.GetCountry.GetRuler.GetFirstName] punit ses esclaves désobéissants en les faisant rôtir sur des braises, et l’on croit que le [ROOT.GetCountry.GetRulerTitle] se nourrit chaque jour de plats terribles préparés de cette manière, délaissant la chasse pour se gaver de viande et de vin."
 zorgo_event.121.a: "J’ai dû manger quelque chose que je ne digère pas..."
 zorgo_event.121.b: "Pouah... je ne me sens pas très bien..."
 zorgo_event.121.c: "Que les dieux maudissent tout ! Mon pied est en feu !"
 zorgo_event.121.d: "Je ne me suis jamais senti aussi mal..."
 zorgo_event.121.e: "Je n’arrive pas à croire à quel point je me sens mal"
 zorgo_event.121.f: "Serait-ce... la lèpre ? Non, les dieux ne permettraient pas cela !"
 zorgo_event.121.g: "Que les dieux aient pitié de moi !"
 zorgo_event.121.h: "J’ai dû manger de la viande avariée..."
 zorgo_event.121.i: "Je jure devant les dieux que je ne mangerai plus jamais de chair humaine !"
 zorgo_event.121.j: "Je mangerai tous ceux qui vivent à [ROOT.GetCountry.GetName] si j’en ai envie !"

 zorgo_event.124.t: "Une maladie épouvantable"
 zorgo_event.124.desc: "[ROOT.GetCountry.GetRuler.GetName] s’est réveillé ce matin avec de terribles douleurs abdominales et a atteint de justesse son pot de chambre avant de tomber violemment malade. Les heures suivantes se sont passées à quatre pattes, le [ROOT.GetCountry.GetRulerTitle] gémissant doucement de douleur et incapable de bouger, des épisodes de diarrhée explosive l’empêchant de quitter le sol.\n\nManger les os d’Alexandre n’était peut-être pas la meilleure idée..."
 zorgo_event.124.a: "Par les dieux, j’ai mal au ventre..."

 nomadic_raid: "Partir en raid"
 nomadic_raid_act: "Notre dirigeant mènera un groupe de guerriers dans un raid audacieux !"
 is_on_nomadic_raid_tt: "N’a pas effectué de raid au cours des dix dernières années."
 looted_by_enemies: "Province pillée"
 looted_by_enemies_desc: "Cette province a été attaquée et pillée par une tribu voisine."

 me_zorgoomni.31_title: "Un raid contre nos voisins"
 me_zorgoomni.31_desc: "[ROOT.GetCountry.GetRuler.GetName] a entendu l’appel de la gloire et souhaite mener personnellement certains de nos guerriers en raid sur les terres de nos ennemis. Les présages ont parlé clairement et [recipient.GetName] serait une cible facile à dépouiller pour nos hommes. Nous n’avons rien à craindre !"
 me_zorgoomni.31.a: "Le moment est venu de donner une leçon à [recipient.GetName]"
 me_zorgoomni.31.b: "À bien y réfléchir, je n’ai pas le temps pour cela"
 me_zorgoomni.31_tooltip1: "#Y Notre dirigeant partira immédiatement avec nos pillards !#!"
 me_zorgoomni.31_tooltip2: "#Y Cela mettra fin à la chaîne d’événements actuelle.#!"

 me_zorgoomni.32_title: "Le raid contre [recipient.GetName]"
 me_zorgoomni.32_desc_1: "Les dieux étaient avec [ROOT.GetCountry.GetRuler.GetName] lorsque [ROOT.GetCountry.GetRuler.GetSheHe] mena le groupe de pillards vers [recipient.GetName] : les guerriers [ROOT.GetCountry.GetAdjective] franchirent les gardes-frontières [recipient.GetAdjective] sans être repérés. Nos hommes pillèrent de nombreux petits villages sans rencontrer de force organisée et emportèrent autant d’or et d’argent qu’ils pouvaient porter.\n\nRéserves de céréales, statues religieuses d’ivoire et d’argent, fourrures luxueuses, chevaux et esclaves furent pris comme butin ; tout ce qui ne pouvait être emporté fut brûlé. [ROOT.GetCountry.GetRuler.GetFirstName] rentra à [ROOT.GetCountry.GetCapital.GetName] à la tête d’un groupe triomphant qui avait triplé de taille, ses fontes débordant de richesses mal acquises."
 me_zorgoomni.32_desc_2: "[ROOT.GetCountry.GetRuler.GetName] mena les pillards depuis [ROOT.GetCountry.GetCapital.GetName] jusque dans l’arrière-pays de [recipient.GetName] sans rencontrer de résistance notable. Les quelques gardes-frontières malchanceux qui croisèrent notre route furent rapidement envoyés auprès des dieux auxquels ils croyaient.\n\nLe raid fut rapide et méthodique : nos guerriers se dispersèrent et incendièrent fermes et villages. Des civils furent abattus dans les rues et nos soldats emportèrent toutes les richesses qu’ils pouvaient porter."
 me_zorgoomni.32_desc_3: "Nos guerriers évitèrent les gardes-frontières de [recipient.GetName] et se retrouvèrent bientôt à la périphérie d’un petit village prospère. Ses bâtiments étaient en briques et des sanctuaires religieux de marbre se dressaient au centre d’une humble place.\n\nLorsque les gardes [recipient.GetAdjective] comprirent que leurs villages étaient pillés, nos soldats repassaient déjà la frontière vers [ROOT.GetCountry.GetName], après avoir tué tous ceux qui auraient pu donner l’alarme."
 me_zorgoomni.32_desc_4: "Bien que nous n’ayons rencontré aucune levée [recipient.GetAdjective] durant le raid, nos guerriers ne trouvèrent pas autant de trésors qu’ils l’espéraient. La région semblait dépourvue de toute richesse, comme une carcasse dévorée dans la steppe. [ROOT.GetCountry.GetRuler.GetFirstName] fut un peu déçu du résultat, mais aucun de nos compatriotes [ROOT.GetCountry.GetAdjective] ne fut blessé et nous pûmes piller quelques petites fermes."
 me_zorgoomni.32_desc_5: "Nos guerriers purent piller quelques minuscules fermes à la frontière entre [ROOT.GetCountry.GetName] et [recipient.GetName], mais l’arrivée inattendue de levées [recipient.GetAdjective] poussa [ROOT.GetCountry.GetRuler.GetName] à ordonner la retraite. Le [ROOT.GetCountry.GetRulerTitle] ne pouvait se permettre de perdre des soldats expérimentés et les hommes avaient pris assez de butin pour être satisfaits."
 me_zorgoomni.32_desc_6: "Quelques heures après le départ de [ROOT.GetCountry.GetRuler.GetName] de [ROOT.GetCountry.GetCapital.GetName] à la tête d’un groupe de pillards, le temps se dégrada. Une pluie torrentielle surgit de nulle part et refusa de cesser. Les esprits s’assombrirent et le voyage devint misérable ; lorsqu’il devint évident que la situation ne ferait qu’empirer, tous décidèrent de rentrer à [ROOT.GetCountry.GetName]."
 me_zorgoomni.32_desc_7: "Malheureusement pour les pillards, ils ne purent ravager la campagne : presque aussitôt après leur entrée dans [recipient.GetName], [ROOT.GetCountry.GetRuler.GetName] et ses hommes furent attaqués par de féroces cavaliers [recipient.GetAdjective].\n\nHeureusement pour [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetFirstName] remporta cette bataille désespérée grâce à ses exploits personnels. Le [ROOT.GetCountry.GetRulerTitle] tua trois fois plus d’ennemis que tous les autres, suscitant l’admiration générale."
 me_zorgoomni.32_desc_8: "Les dieux n’étaient pas avec [ROOT.GetCountry.GetRuler.GetName] et ses pillards : un grand groupe de soldats [recipient.GetAdjective] attaqua le [ROOT.GetCountry.GetRulerTitle] dès que les soldats [ROOT.GetCountry.GetAdjective] eurent franchi la frontière.\n\nDes dizaines de nos hommes tombèrent en quelques secondes, transpercés par d’innombrables flèches, et [ROOT.GetCountry.GetRuler.GetFirstName] reçut une flèche dans la cuisse, une blessure douloureuse qui rendit difficile de monter à cheval et de combattre.\n\nL’ennemi sépara [ROOT.GetCountry.GetRuler.GetFirstName] des cavaliers, mais [ROOT.GetCountry.GetRuler.GetFirstName] finit par regagner [ROOT.GetCountry.GetName] sain et sauf, ce que tous ses compagnons ne purent pas dire."
 me_zorgoomni.32_desc_9: "Ce fut un désastre pour [ROOT.GetCountry.GetName] : [ROOT.GetCountry.GetRuler.GetName] et ses pillards furent attaqués par une importante force de gardes [recipient.GetAdjective], qui tuèrent nombre de nos compatriotes et capturèrent notre [ROOT.GetCountry.GetRulerTitle].\n\nLorsque l’identité de [ROOT.GetCountry.GetRuler.GetFirstName] fut découverte, les soldats de [recipient.GetName] le battirent avec une cruauté sauvage, manquant de le tuer. Seuls de l’or et des promesses permirent à [ROOT.GetCountry.GetRuler.GetFirstName] d’être libéré vivant."
 me_zorgoomni.32_desc_10: "Au début, il sembla que les pillards menés par [ROOT.GetCountry.GetRuler.GetName] avaient franchi sans être vus la frontière entre [ROOT.GetCountry.GetName] et [recipient.GetName]. Mais quelques heures plus tard, les guerriers [ROOT.GetCountry.GetAdjective] tombèrent dans un piège. La route se resserrait vers un petit pont au bord d’un ruisseau, où les [recipient.GetAdjective] lancèrent une embuscade qui força les pillards [ROOT.GetCountry.GetAdjective] à descendre dans l’eau.\n\nAlors que des dizaines de flèches sifflaient au-dessus de sa tête, [ROOT.GetCountry.GetRuler.GetFirstName] fut saisi d’une peur écrasante, d’une torpeur paralysante qui lui glaça les membres : je vais mourir.\n\nLorsque la fin arriva, elle fut brutale."
 me_zorgoomni.32_desc_11: "Notre raid contre [recipient.GetName] ne pouvait mieux se dérouler. [ROOT.GetCountry.GetRuler.GetName] captura plusieurs esclaves, tua des dizaines de soldats [recipient.GetAdjective] et sema la peur des [ROOT.GetCountry.GetAdjective] dans le cœur des habitants. Nous ne perdîmes pas même un seul guerrier au combat."
 me_zorgoomni.32_desc_12: "Le raid contre [recipient.GetName] fut assez réussi au début : nos guerriers pillèrent des fermes et capturèrent même un esclave pour [ROOT.GetCountry.GetCapital.GetName].\n\nMais l’ennemi eut le dernier mot. Sur le chemin du retour vers [ROOT.GetCountry.GetName], des guerriers [recipient.GetAdjective] qui avaient suivi [ROOT.GetCountry.GetRuler.GetName] et ses hommes tendirent une embuscade aux pillards [ROOT.GetCountry.GetAdjective] alors qu’ils traversaient une rivière. Leur attaque les submergea temporairement. Nos pillards réussirent heureusement à les repousser, mais [ROOT.GetCountry.GetRuler.GetName] reçut une flèche dans le bras qui tenait son épée et fut grièvement blessé."
 me_zorgoomni.32_desc_13: "Le raid contre [recipient.GetName] ne fut pas aussi facile que [ROOT.GetCountry.GetRuler.GetName] l’aurait souhaité. Nos hommes purent attaquer quelques villages mineurs et voler de l’or, mais [ROOT.GetCountry.GetRuler.GetFirstName] fut cloué au sol par des archers et reçut une flèche dans la cuisse. La blessure n’était pas dévastatrice, mais elle n’était pas insignifiante. Grimaçant de douleur, le [ROOT.GetCountry.GetRulerTitle] leva une épée couverte de sang et ordonna à ses guerriers de battre en retraite."
 me_zorgoomni.32_desc_14: "Le raid contre [recipient.GetName] se déroulait exceptionnellement bien, jusqu’à ce que tout bascule. Les pillards [ROOT.GetCountry.GetAdjective] avaient rempli leurs fontes et regagnaient tranquillement [ROOT.GetCountry.GetCapital.GetName] lorsqu’une troupe de cavaliers [recipient.GetAdjective] les rattrapa.\n\nMalgré les efforts de [ROOT.GetCountry.GetRuler.GetName] pour organiser la retraite, le [ROOT.GetCountry.GetRulerTitle] fut encerclé et grièvement blessé. Comprenant que [ROOT.GetCountry.GetRuler.GetFirstName] était en danger de mort, les pillards [ROOT.GetCountry.GetAdjective] se rallièrent autour de leur chef, repoussèrent les cavaliers et lui sauvèrent la vie."
 me_zorgoomni.32_desc_15: "De mauvais présages accompagnèrent le groupe dès son départ de la capitale [ROOT.GetCountry.GetAdjective]. Il plut durant tout le voyage et nombre d’hommes tombèrent malades dans ces conditions difficiles.\n\nLorsque les pillards atteignirent les frontières de [recipient.GetName], tous étaient de mauvaise humeur et moins vigilants qu’ils n’auraient dû l’être. C’est alors qu’une volée de flèches déchira le groupe [ROOT.GetCountry.GetAdjective] et que [ROOT.GetCountry.GetRuler.GetName] eut le malheur d’en recevoir une dans l’œil. Tombé au sol comme mort, le [ROOT.GetCountry.GetRulerTitle] fut traîné à grand-peine jusqu’en sécurité. Des heures plus tard, loués soient les dieux, [ROOT.GetCountry.GetRuler.GetFirstName] se réveilla, mais [ROOT.GetCountry.GetRuler.GetSheHe] ne serait plus jamais le même."
 me_zorgoomni.32_desc_16: "L’or et l’argent pris à [recipient.GetName] étaient suffisants, mais les guerriers de [ROOT.GetCountry.GetName] ne cessaient de louer les exploits héroïques de l’inarrêtable [ROOT.GetCountry.GetRuler.GetName] durant le raid.\n\nÀ un moment de l’attaque, un grand groupe de renforts [recipient.GetAdjective] surgit de nulle part et menaça de semer la panique parmi les pillards. Mais le [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetAdjective] ne trembla pas et chargea leurs rangs, tuant deux hommes d’un coup et mutilant un autre.\n\nLe cours de la bataille s’inversa et les guerriers purent rentrer à [ROOT.GetCountry.GetCapital.GetName], vivants et avec des fontes un peu plus lourdes."
 me_zorgoomni.32_desc_17: "Après une semaine de voyage sans incident depuis [ROOT.GetCountry.GetCapital.GetName], les pillards [ROOT.GetCountry.GetAdjective] franchirent la frontière vers [recipient.GetName], rêvant de richesses mal acquises. Ils furent donc très surpris de tomber sur une levée [recipient.GetAdjective] en entraînement dans la nature.\n\nDix fois moins nombreux, les pillards durent combattre pour regagner la sécurité. Nombre d’hommes, craignant pour leur vie, jetèrent leurs armes et s’enfuirent vers les collines, abandonnant leurs frères à la mort.\n\nTout aurait été perdu sans le commandement audacieux de [ROOT.GetCountry.GetRuler.GetName], qui chargea l’ennemi pour gagner du temps. Le cri de guerre [ROOT.GetCountry.GetAdjective] aux lèvres, le [ROOT.GetCountry.GetRulerTitle] se fraya un chemin parmi les soldats [recipient.GetAdjective] et les força à battre en retraite, sauvant la situation et permettant au groupe de s’échapper."
 me_zorgoomni.32_desc_18: "[ROOT.GetCountry.GetRuler.GetName] comptait attaquer les villages [recipient.GetAdjective] et ramener esclaves et butin à [ROOT.GetCountry.GetCapital.GetName]. Mais lorsque les pillards [ROOT.GetCountry.GetAdjective] franchirent la frontière vers [recipient.GetName], ils rencontrèrent une importante troupe menée par [recipient.GetRuler.GetName]. Les bandits étaient trois fois moins nombreux.\n\nComprenant qu’il ne s’agissait pas d’une visite amicale, les guerriers menés par [recipient.GetRuler.GetFirstName] lancèrent une attaque féroce contre les [ROOT.GetCountry.GetAdjective], tuant des dizaines d’hommes et en blessant plusieurs autres. Poussant un cri de terreur absolue, [ROOT.GetCountry.GetRuler.GetFirstName] jeta son arme et s’enfuit du champ de bataille, abandonnant des dizaines de ses frères aux [recipient.GetAdjective]."
 me_zorgoomni.32_desc_19: "Le raid contre [recipient.GetName] fut stoppé par des levées [recipient.GetAdjective], qui semblaient attendre les guerriers [ROOT.GetCountry.GetAdjective] dès qu’ils franchiraient la frontière. Lorsque [ROOT.GetCountry.GetRuler.GetName] comprit que ses hommes rentreraient à [ROOT.GetCountry.GetName] les mains vides, le [ROOT.GetCountry.GetRulerTitle] furieux ordonna de n’épargner personne.\n\nQuelques heures plus tard, les champs étaient rouges du sang des soldats [recipient.GetAdjective] tombés et [ROOT.GetCountry.GetRuler.GetName], triomphant, fit signe à ses guerriers de rentrer."
 me_zorgoomni.32_desc_20: "Bien que les pillards partis de [ROOT.GetCountry.GetName] fussent confiants dans leur capacité à piller, le Destin avait condamné [ROOT.GetCountry.GetRuler.GetName] à mourir. Les guerriers [ROOT.GetCountry.GetAdjective] avaient à peine franchi la frontière vers [recipient.GetName] qu’une force cinq fois supérieure les attaqua.\n\nComprenant que [ROOT.GetCountry.GetRuler.GetSheHe] ne rentrerait pas à [ROOT.GetCountry.GetCapital.GetName], le [ROOT.GetCountry.GetRulerTitle] fit la paix avec ses dieux et chargea bravement l’ennemi."
 me_zorgoomni.32.a: "Gloire au maître pillard [ROOT.GetCountry.GetRuler.GetName] !"
 me_zorgoomni.32.b: "Une nouvelle victoire pour [ROOT.GetCountry.GetName] !"
 me_zorgoomni.32.c: "Nous sommes invincibles !"
 me_zorgoomni.32.d: "C’était agréable de quitter [ROOT.GetCountry.GetCapital.GetName] quelque temps"
 me_zorgoomni.32.e: "Une bataille rangée est inutile : retournez à [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.32.f: "Quelle perte de temps maudite !"
 me_zorgoomni.32.g: "[ROOT.GetCountry.GetRuler.GetFirstName] est vraiment un combattant talentueux !"
 me_zorgoomni.32.h: "C’était une erreur de quitter [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.32.i: "Est-ce une chance d'avoir survécu...?"
 me_zorgoomni.32.j: "Quel désastre absolu pour [ROOT.GetCountry.GetName] !"
 me_zorgoomni.32.k: "Je crache au visage de [recipient.GetRuler.GetName] et de ses armées"
 me_zorgoomni.32.l: "Malédiction sur les [recipient.GetAdjective] !"
 me_zorgoomni.32.m: "Nous devons regagner la sécurité de [ROOT.GetCountry.GetName] !"
 me_zorgoomni.32.n: "J’ai le vertige..."
 me_zorgoomni.32.o: "Bah ! Je n’aurais jamais dû quitter [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.32.p: "Je détruirai quiconque se dressera sur le chemin de la victoire !"
 me_zorgoomni.32.q: "Je recommencerais volontiers pour sauver mes guerriers"
 me_zorgoomni.32.r: "J’ai de la chance d’avoir sauvé ma vie !"
 me_zorgoomni.32.s: "L’expérience du champ de bataille peut valoir plus que l’or"
 me_zorgoomni.32.t: "Je mourrai l’épée à la main ! Aaarrrggghhh !"
 me_zorgoomni.32_tooltip: "#Y Cela mettra fin à la chaîne d’événements actuelle.#!"

 me_zorgoomni.33_title: "Raid transfrontalier"
 me_zorgoomni.33_desc: "Mon [ROOT.GetCountry.GetRulerTitle], nous avons de terribles nouvelles à rapporter de [this_province_was_raided_scope.GetName]. La nuit dernière, une cohorte de guerriers de [nomadic_raid_country.GetName] a franchi notre frontière et lancé un raid surprise contre les habitants sans méfiance. Les pillards [nomadic_raid_country.GetAdjective] ont tué des nôtres, pillé leurs terres, emportant tout ce qu’ils pouvaient transporter et brûlant le reste.\n\nSachez que ces bandits étaient personnellement menés par [nomadic_raid_country.GetRuler.GetName], signe insolent de mépris envers le peuple de [ROOT.GetCountry.GetName]."
 me_zorgoomni.33.a: "Quoi ! C’est pratiquement une déclaration de guerre !"

