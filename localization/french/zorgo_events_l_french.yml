l_french:
 #event

 zorgo_event.1.t: "Régler ses comptes"
 zorgo_event.1.desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], il y a une affaire délicate qui nécessitera votre attention personnelle. Nous avons reçu des informations selon lesquelles [SCOPE.sCharacter('random_dude').GetName] aurait menacé de tuer [SCOPE.sCharacter('random_dude_2').GetName] à cause d’un différend immobilier; il semblerait qu’ils convoitent tous deux la même propriété à [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] et qu’aucun des deux ne cède. La guerre des mots n’a cessé de s’intensifier au cours des dernières semaines, et hier soir encore, [SCOPE.sCharacter('random_dude_2').GetFirstName] a été agressé devant la maison de [SCOPE.sCharacter('random_dude_2').GetHerHis] et a été sévèrement roué de coups, ce qui lui a finalement coûté un œil.\n\nBien que nous ne vous importunions normalement pas avec de telles affaires, votre lien de parenté avec [SCOPE.sCharacter('random_dude').GetFirstName] complique la situation - [SCOPE.sCharacter('random_dude_2').GetFirstName] raconte à tout le monde que vous avez envoyé vos hommes de main là-bas pour donner une leçon à [SCOPE.sCharacter('random_dude_2').GetHerHim], et les gens commencent à le croire."
 zorgo_event.1.a: "Envoyez à [SCOPE.sCharacter('random_dude_2').GetFirstName] un cadeau provenant du trésor, ainsi que nos excuses les plus sincères"
 zorgo_event.1.b: "Dites à ce fou de garder la bouche fermée s’il veut conserver l’autre !"

 zorgo_event.2.t: "Une découverte curieuse"
 zorgo_event.2.desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], un paysan travaillait dans les champs près de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] quand une étrange anomalie a été découverte; un idole en argent d'un dieu rustique et oublié, recouvert de runes étranges qui sont indéchiffrables. [SCOPE.sCharacter('priest').GetName], qui est un expert dans de telles affaires, a déclaré qu'un esprit maléfique était piégé à l'intérieur de la statue et que nous avions involontairement déchaîné une malédiction. Bien que [SCOPE.sCharacter('priest').GetFirstName] ait dit que ceci est un mauvais présage pour notre peuple, tout le monde n'est pas convaincu que ceci soit un coup de malchance."
 zorgo_event.2.a: "Fondez la statue et faites-en des pièces - je ne crains pas d'un ancien esprit"
 zorgo_event.2.b: "Dites à [SCOPE.sCharacter('priest').GetFirstName] de la reterrer sur le même endroit et de faire des sacrifices"

 zorgo_event.3.t: "Un cadeau de la mer"
 zorgo_event.3.desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] était profondément endormi dans [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] chambre quand, soudain, il y eut des cris perçants et les sons de meubles brisés, arrachant [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] à [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] rêves. Il y eut un éclair d'acier, et quelques moments paniqués plus tard, les gardes du corps de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] tenaient [SCOPE.sCharacter('dumbass').GetName] au sol.\n\nCe qui vint ensuite fut une histoire si ridicule, si étrange, que pour un moment, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] pensa qu'elle était encore un rêve. Mais non, cela arriva effectivement; il semble que [SCOPE.sCharacter('dumbass').GetFirstName], clairement un simplet, ait acheté un énorme thon au marché aux poissons et l'ait apporté à [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] comme cadeau. Comment il réussit à contourner vos sentinelles au milieu de la nuit reste un mystère.\n\nLorsqu'on lui demanda plus de détails, [SCOPE.sCharacter('dumbass').GetFirstName] continuait à pleurer la même histoire - 'C'est le plus grand poisson que j'ai jamais vu, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], et je devais juste vous le donner. Je n'ai pas eu l'intention de faire du mal, sincère'. En toute équité, à côté des pieds de [SCOPE.sCharacter('dumbass').GetHerHis] se trouve véritablement le plus grand thon que vous ayez jamais vu."
 zorgo_event.3.a: "Euh... merci, je suppose? Voici, prenez quelques pièces pour vos ennuis"
 zorgo_event.3.b: "Gardes, frappez ce idiot avec le thon et jetez-les tous les deux dans la rue!"
 zorgo_event.3.c: "C'était la chose la plus stupide que vous ayez jamais faite, [SCOPE.sCharacter('dumbass').GetFirstName]."
 zorgo_event.4.t: "Observer le Maître"
 zorgo_event.4.desc: "Ces derniers temps, [SCOPE.sCharacter('heir').GetName] harcèle [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] presque quotidiennement avec une simple demande, une demande que [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] ne pourra plus ignorer très longtemps. Ce que [SCOPE.sCharacter('heir').GetFirstName] a demandé est assez simple, même si c’est un peu gênant; tout ce que [SCOPE.sCharacter('heir').GetSheHe] souhaite, c’est avoir la chance d’observer [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] lors de la prochaine réunion du Conseil. Étant quelque peu inexpérimenté en matière de politique, [SCOPE.sCharacter('heir').GetFirstName] aimerait observer « le Maître à l’œuvre », pour ainsi dire, dans l’espoir d’apprendre à composer avec les conseillers."
 zorgo_event.4.a: "Tu peux t'asseoir derrière moi, mais reste tranquille et ne te montre pas trop enthousiaste."
 zorgo_event.4.b: "Un jour, tu auras tout le temps d’apprendre par toi-même"

 zorgo_event.5.t: "Des greniers débordants"
 zorgo_event.5.desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], les récoltes ont été si abondantes cette année que nous n’avons plus de place pour entreposer le blé. Les greniers que nous avons construits près de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] sont pleins à craquer, et il n’y a tout simplement plus de place pour ce que nous avons en stock — nous n’aurons d’autre choix que de vendre l’excédent au marché."
 zorgo_event.5.a: "Nous sommes heureux de ne manquer de nourriture — que le peuple se réjouisse !"

 zorgo_event.6.t: "Le collecteur d’impôts assassiné"
 zorgo_event.6.desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], nous sommes au regret de vous informer que l’un de nos collecteurs d’impôts, un homme nommé [SCOPE.sCharacter('taxman').GetName], a été retrouvé poignardé à mort dans les rues de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]. Tout le monde affirme que [SCOPE.sCharacter('taxman').GetFirstName] avait les doigts crochus et détournait bien plus d’argent qu’il ne le devait. Même si cela est vrai, cet homme méritait-il une mort aussi violente ? À présent, les habitants refusent de nous dire qui est responsable du crime, malgré les menaces de nos soldats... cela n’augure rien de bon."
 zorgo_event.6.a: "C’est terriblement contrariant... adieu, [SCOPE.sCharacter('taxman').GetFirstName]"

 zorgo_event.7.t: "Raid barbare"
 zorgo_event.7.desc: "Nous avons une terrible nouvelle à vous annoncer ce matin, ô [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. Une bande de pillards barbares a ravagé la région de [temple_province.GetName], traversant la rivière au milieu de la nuit et prenant nos gardes par surprise. Non seulement les bandits ont réussi à voler un peu d’or, ce qui est déjà grave, mais ils ont tué des habitants, ce qui est pire encore — notre peuple pleure aujourd’hui ses morts et ses biens perdus."
 zorgo_event.7.a: "Nous ferons tout ce qui est en notre pouvoir pour punir les responsables !"

 zorgo_event.8.t: "Une chanson pour [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]"
 zorgo_event.8.desc: "Il y a quelques jours, deux troubadours de renom, connus pour chanter à l’unisson, [SCOPE.sCharacter('bard').GetName] et [SCOPE.sCharacter('bard_2').GetName], sont arrivés à [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] et ont demandé une audience avec [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] dès que [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] en aurait le temps. La raison de leur visite était connue avant même leur arrivée dans notre capitale, car la réputation de [SCOPE.sCharacter('bard').GetFirstName] et de [SCOPE.sCharacter('bard_2').GetFirstName] les précédait assurément, et leur dernier chef-d’œuvre, un poème épique intitulé « Les exploits de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] », fait jaser la ville depuis des semaines.\n\nLes deux poètes ont humblement demandé à pouvoir se produire, et plus tard dans la soirée, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] aura l’honneur d’entendre cette célèbre œuvre récitée en personne."
 zorgo_event.8.a: "Au moins, le sujet sera intéressant..."

 zorgo_event.9.t: "Un complot découvert"
 zorgo_event.9.desc: "At the last moment, our agents uncovered a plot to have [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] assassinated, and as more and more details are revealed, the scandal continues to grow, shocking the inhabitants of [SCOPE.GetRootScope.GetCountry.GetCapital.GetName].\n\nThe rot runs deep; it seems that the perpetrators were able to persuade one of [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]'s relatives, [SCOPE.sCharacter('cousin').GetName], to join their number. Indeed, [SCOPE.sCharacter('cousin').GetFirstName] was the linchpin of the entire operation, for it was hoped that [SCOPE.sCharacter('cousin').GetSheHe] would have been able to bring [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] someplace secluded where the murderers would have been hiding. In fact, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] was supposed to pay a visit tomorrow afternoon... \n\nWhen the intrigue was discovered, [SCOPE.sCharacter('cousin').GetFirstName] tried to flee in the middle of the night, hoping to find a ship to take [SCOPE.sCharacter('cousin').GetHerHim] anywhere, but was arrested at the harbor. What shall we do?"
 zorgo_event.9.a: "Jetez [SCOPE.sCharacter('cousin').GetFirstName] dans le puits le plus profond... pour l’instant"

 zorgo_event.10.t: "Le marchand errant"
 zorgo_event.10.desc: "Il y a quelques jours, un étranger nommé [SCOPE.sCharacter('euthymios').GetName] a été appréhendé aux abords de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] et conduit devant [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], qui lui a demandé de s’expliquer. Dans une vie antérieure, [SCOPE.sCharacter('euthymios').GetFirstName] était marchand et venait de la ville de [GetProvince('(int32)416').GetName], mais les troubles politiques qui agitaient sa cité natale ont entraîné son bannissement. Après avoir erré pendant des années, Euthymios a enfin atteint nos terres, démuni et épuisé.\n\nUne fois devant [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], Euthymios tend une minuscule bourse et tombe à genoux. « Je vous en prie, noble seigneur, acceptez tout ce qu’il me reste dans cette vie, mais permettez-moi de rester ici auprès de vous. Je ne peux pas aller plus loin. »\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] est enclin à faire preuve de clémence, mais les habitants ne manqueront certainement pas de se plaindre, eux qui ne souhaitent pas vivre avec le marchand exilé parmi eux."
 zorgo_event.10.a: "Notre hospitalité envers les étrangers est légendaire ; vous pouvez rester parmi nous"
 zorgo_event.10.b: "Dites à cet idiot de quitter notre cité immédiatement ! Quelle idée absurde"

 zorgo_event.11.t: "Vent tissé"
zorgo_event.11.desc: "Bien que [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] soit connu pour apprécier les plaisirs raffinés de la vie, [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] est dernièrement perturbé par les signes croissants d’une richesse extravagante dans notre société. Beaucoup trop de nos nobles dépensent leur argent à importer des vêtements de soie, que l’on appelle communément le « vent tissé » en raison de leur nature vaporeuse, et les rues sont remplies de dandys qui passent leurs journées à parler de mode, ce qui n’est certainement pas une vertu [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName].\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] envisage de restreindre ces frivolités, mais sait pertinemment que les élites culturelles pourraient s’y opposer."
zorgo_event.11.a: "Trop, c’est trop : interdisons le port de vêtements de soie pendant un an"
zorgo_event.11.b: "Bah ! J’ai des choses plus importantes à régler... laissez-moi tranquille"

zorgo_event.12.t: "Exposition au Grand Cothon"
zorgo_event.12.desc: "Nous avons appris qu’une grande inauguration doit avoir lieu au Grand Cothon de [GetProvince('(int32)3256').GetName], car des rénovations récentes sont achevées dans le quartier portuaire et les architectes ont hâte de présenter leurs dernières réalisations. Seules les familles les plus prestigieuses ont été invitées à l’exposition, ce qui inclut naturellement [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. L’élite de la société [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName] sera présente, et l’événement s’annonce rapidement comme le plus commenté de l’année.\n\nBien qu’être invité soit un grand honneur, le voyage aura un coût ; la décision vous revient, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]. Le peuple voudra certainement que son dirigeant y assiste, mais nos trésors peuvent-ils se le permettre ?"
zorgo_event.12.a: "Voyager coûte cher, mais élargit l’esprit : nous irons !"
zorgo_event.12.b: "Je suis trop occupé pour m’y rendre moi-même, mais j’ai hâte d’en entendre parler"

zorgo_event.13.t: "Offrandes à Tannit"
zorgo_event.13.desc: "Tous les cinq ans, toutes les nations qui se souviennent de la déesse Tannit et de ses bontés sont tenues d’envoyer un présent à son temple de [GetProvince('(int32)3256').GetName], une tradition séculaire que notre peuple est plus qu’heureux de perpétuer.\n\nÀ l’approche de la cérémonie, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] s’est vu rappeler par [SCOPE.sCharacter('jerk').GetName] que nous n’avions pas envoyé les tributs la dernière fois, ayant demandé un délai en raison de difficultés financières. C’est regrettable, mais nous devons envoyer le double de la somme si nous voulons rester dans les bonnes grâces de la déesse."
zorgo_event.13.a: "Que sommes-nous sans les dieux ? Même si cela fait mal, envoyez les fonds"
zorgo_event.13.b: "Je me moque de ce que j’ai promis : nous n’avons pas les moyens"

zorgo_event.14.t: "Contraint d’intervenir dans un conflit commercial"
zorgo_event.14.desc: "Bien que nous fassions de notre mieux pour ne pas vous déranger, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], une affaire délicate nécessite votre intervention personnelle. Deux marchands, [SCOPE.sCharacter('random_bro').GetName] et [SCOPE.sCharacter('random_bro_2').GetName], se sont lancés dans une dispute très publique et très sordide au sujet d’un terrain en bord de mer près de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] : il semble qu’ils veuillent tous deux les mêmes entrepôts pour y stocker des amphores. Ce sont deux marchands ambitieux, rivaux sur la place publique, et leur guerre des mots risque de dégénérer en violence si rien n’est fait.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] devra rendre son jugement, et il n’existe aucune solution facile : quelqu’un sera forcément contrarié."
zorgo_event.14.a: "J’ai choisi [SCOPE.sCharacter('random_bro_2').GetName]"
zorgo_event.14.b: "De toute évidence, [SCOPE.sCharacter('random_bro').GetName] le mérite davantage"
zorgo_event.14.c: "Menacez-les tous deux d’exil s’ils ne cessent pas de se quereller"

 zorgo_event.15.t: "Restauration du temple de Melqart"
 zorgo_event.15.desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], nous avons reçu la nouvelle d’un terrible présage dans la province de [GetProvince('(int32)743').GetName]. Un effroyable tremblement de terre a dévasté le temple de Melqart, et les prêtres de Tyr ont envoyé des messagers dans toutes les cités [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName], demandant des aumônes pour aider à restaurer le lieu sacré endommagé. De grandes fissures sont apparues dans le stylobate de l’édifice, et l’on craint que le temple tout entier ne s’effondre si les travaux ne commencent pas immédiatement.\n\nBien que les demandes d’argent ne soient jamais les bienvenues, on sait que Melqart prend soin de ses fidèles ; nos citoyens seraient très heureux de savoir qu’ils ont contribué."
 zorgo_event.15.a: "Puisque les dieux prennent soin de nous, nous prendrons soin d’eux"
 zorgo_event.15.b: "Nous envoyons déjà suffisamment de dîmes à Tyr : non"

 zorgo_event.16.t: "Le retour de l’explorateur"
 zorgo_event.16.desc: "Nous avons certainement entendu parler de [SCOPE.sCharacter('traveler').GetName], l’intrépide voyageur qui idolâtre Hannon le Navigateur, car toute cité ayant accès à la mer a entendu parler des audacieuses expéditions entreprises par [SCOPE.sCharacter('traveler').GetFirstName]. Guidé uniquement par les notes d’Hannon, [SCOPE.sCharacter('traveler').GetFirstName] prend la mer chaque saison, s’aventurant toujours plus loin le long de la côte africaine avant de rentrer chez lui, souvent avec des marchandises exotiques à vendre et des récits qui valent leur pesant d’or.\n\nImaginez donc notre surprise lorsque le légendaire explorateur est passé par [SCOPE.GetRootScope.GetCountry.GetCapital.GetName], demandant à rencontrer [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. Il semble que, tout comme Hannon, [SCOPE.sCharacter('traveler').GetFirstName] ait rencontré l’étrange tribu du redoutable peuple gorillai, et qu’il soit disposé à nous vendre une curiosité si nous pouvons nous l’offrir. Notre peuple serait très intéressé de voir un tel spectacle de ses propres yeux..."
 zorgo_event.16.a: "Nous ne pouvons pas nous permettre cette dépense pour le moment"
 zorgo_event.16.b: "Qu’est-ce que c’est que ça ?! Je n’ai jamais rien vu de tel... il nous le faut"

 zorgo_event.17.t: "Un élève distrait"
 zorgo_event.17.desc: "[SCOPE.sCharacter('teacher').GetName] a été chargé d’enseigner à [SCOPE.sCharacter('pupil').GetName] tout ce qui concerne [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName] ; une tâche assez simple, pensions-nous, et qui paie fort bien le privilège d’instruire un membre de la noblesse. Malheureusement pour nous, [SCOPE.sCharacter('teacher').GetFirstName] se plaint que [SCOPE.sCharacter('pupil').GetFirstName] ne prête aucune attention aux leçons quotidiennes et s’endort souvent en plein cours. Lorsque [SCOPE.sCharacter('teacher').GetFirstName] lui a gentiment demandé de se concentrer, [SCOPE.sCharacter('pupil').GetFirstName] a jeté une coupe de vin au professeur, qui menace maintenant de démissionner !"
 zorgo_event.17.a: "Quelle insolence... menacez [SCOPE.sCharacter('pupil').GetFirstName] de représailles s’il ne s’améliore pas !"
 zorgo_event.17.b: "Je n’en ai absolument rien à faire : ne me dérangez plus avec cela"

 zorgo_event.18.t: "Des navires esclavagistes au port"
 zorgo_event.18.desc: "Nous avons appris que des pirates traversent actuellement la région et que les cales de leurs navires sont remplies d’esclaves qu’ils ont enlevés. Mais ce n’est pas tout : il semblerait que ces pillards soient poursuivis par ceux qu’ils ont attaqués et, craignant d’être rattrapés, ils tentent désormais de se débarrasser de leur butin mal acquis.\n\nSelon le chef des pirates, un scélérat nommé [SCOPE.sCharacter('pirate').GetName], leurs ennemis ne sont qu’à moins d’une journée derrière eux; le temps presse donc. En raison de leur précipitation, ils sont prêts à nous offrir des prix réduits…si nous acceptons de faire affaire avec eux."
 zorgo_event.18.a: "Nous ne nous mêlerons pas de cela : dites aux pirates de quitter nos eaux !"
 zorgo_event.18.b: "Achetez quelques esclaves"
 zorgo_event.18.c: "Nous achèterons tout ce qu’ils accepteront de vendre"

 zorgo_event.19.t: "Des mains sûres à la barre"
 zorgo_event.19.desc: "Un matin, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] cherchait à [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] un successeur, mais on lui a fait savoir que celui-ci était en mer, en train de s’entraîner aux manœuvres de voile avec notre marine.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] s’est réjoui de cette nouvelle, espérant que d’autres remarqueraient cet esprit de sacrifice et suivraient son exemple."
 zorgo_event.19.a: "Si seulement chacun prenait ses devoirs aussi au sérieux que nous..."

 zorgo_event.20.t: "Un orateur renommé"
 zorgo_event.20.desc: "Un orateur renommé, [SCOPE.sCharacter('orator').GetName], est arrivé à [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] et a fait savoir en secret que [SCOPE.sCharacter('orator').GetSheHe] serait heureux de prononcer un discours public en l’honneur de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], surtout si nous sommes capables de faire un petit don.\n\nComprenant que le don est tombé directement dans le laps de [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis], il n’y a pas d’hésitation de la part de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], et les préparatifs sont mis en place immédiatement."
 zorgo_event.20.a: "Je n’ai aucune hésitation à soutenir une cause aussi noble"

 zorgo_event.21.t: "Un signe de Jupiter"
 zorgo_event.21.desc: "[ROOT.GetCountry.GetRuler.GetName], we have heard a strange and disturbing tale that is making the rounds in [ROOT.GetCountry.GetCapital.GetName]. It seems that one of our citizens erected a colossal bronze statue of #E Herakles#! in the center of town, and almost immediately, a bolt of lightning struck the plinth and sent the metalwork crashing into the ground.\n\nOf course, everyone is taking this as a sign of [GetDeityDefinition('omen_jupiter').GetName|Y]'s displeasure, who is punishing us Romans for our hubris."
 zorgo_event.21.a: "Ordonnez que la statue soit enterrée et offrez des sacrifices"
 zorgo_event.21.b: "Allumez un immense feu et faites fondre l’idole pour en tirer des pièces"

 zorgo_event.22.t: "Le port d’Ostie"
 zorgo_event.22.desc: "Our architects report that the harbor at [GetProvince('(int32)15').GetName] is beginning to show signs of silting over, and unless we take the painful but necessary steps to start dredging the waters, we could have a long-term problem on our hands. Even now, the laborers at the docks have to work twice as hard to get the ships in and out, and many times, our sailors end up having to help and they are starting to complain."
 zorgo_event.22.a: "Je suppose que nous n’avons pas vraiment le choix"
 zorgo_event.22.b: "Dites aux hommes de travailler davantage ; nous ne pouvons pas nous permettre cette dépense"

 zorgo_event.23.t: "Disputes parmi l’aristocratie"
 zorgo_event.23.desc: "[SCOPE.sCharacter('random_dude_from_rome').GetName] et [SCOPE.sCharacter('random_dude_2_from_rome').GetName] ont tous deux abordé [ROOT.GetCountry.GetRuler.GetName], prenant [ROOT.GetCountry.GetRuler.GetHerHim] par surprise un agréable après-midi à [ROOT.GetCountry.GetCapital.GetName] et gâchant immédiatement l’ambiance.\n\nIl semble qu’un mariage ait été prévu entre les familles de [SCOPE.sCharacter('random_dude_from_rome').GetPraenomen] et de [SCOPE.sCharacter('random_dude_2_from_rome').GetPraenomen], mais des disputes au sujet de la dot ont provoqué une rupture irréparable, qui menace de gagner la sphère politique si nous n’intervenons pas. À présent, [SCOPE.sCharacter('random_dude_from_rome').GetFirstName] demande à [ROOT.GetCountry.GetRuler.GetFirstName] d’accepter d’entendre les détails sordides de l’affaire, dans l’espoir qu’une décision condamnant [SCOPE.sCharacter('random_dude_2_from_rome').GetFirstName] soit rendue.\n\nMalheureusement pour nous, cette affaire est trop retentissante et, quelle que soit notre décision, le peuple de #E Rome#! aura des opinions bien tranchées."
 zorgo_event.23.a: "Je siégerai avec honneur au tribunal, sachant que je ne peux pas gagner"
 zorgo_event.23.b: "Eh bien, voyons qui nous paiera le plus et prenons leur parti"

 zorgo_event.24.t: "Un étudiant fainéant"
 zorgo_event.24.desc: "On ne cesse d’entendre des plaintes selon lesquelles [SCOPE.sCharacter('heir').GetName] néglige ses leçons quotidiennes, évite d’étudier la grammaire grecque et préfère galoper sur son cheval préféré, Ungula Fulgens.\n\nMême à son très jeune âge, [SCOPE.sCharacter('heir').GetFirstName] est réputé pour ses prouesses à cheval — à vrai dire, l’enfant surpasse des hommes deux fois plus âgés que lui — et [ROOT.GetCountry.GetRuler.GetName] peut difficilement reprocher au garçon de vouloir un peu d’excitation, mais les roturiers commencent à se plaindre, affirmant qu’il faudrait exiger davantage d’un membre de notre famille."
 zorgo_event.24.a: "Embauchez les meilleurs tuteurs de grec et menacez [SCOPE.sCharacter('heir').GetFirstName]"
 zorgo_event.24.b: "Laissez l’enfant jouer... qu’est-ce qui pourrait lui faire du mal?"

 zorgo_event.25.t: "Célébrations improvisées"
 zorgo_event.25.desc: "Notre peuple est unique en son genre : quoi que le destin ou la fortune lui réservent, qu’il s’agisse de périodes de guerre et de souffrance ou d’années d’abondance et d’excès, il n’abandonne jamais les dieux, leur offrant sans cesse louanges et actions de grâce. Nous devrions nous estimer chanceux d’avoir des citoyens romains aussi pieux, car les dieux se réjouissent des célébrations improvisées qui ont lieu dans les campagnes."
 zorgo_event.25.a: "Comme c’est charmant!!"

 zorgo_event.26.t: "Des mesures sans précédent"
 zorgo_event.26.desc: "[ROOT.GetCountry.GetRuler.GetName], comme vous le savez, nos récentes campagnes nous ont laissés à court de main-d’œuvre – un fait que nous ne pouvons pas laisser nos ennemis découvrir, sous peine de courir à notre perte.\n\nEn cette période désespérée, il a été suggéré de réquisitionner certains esclaves pour les enrôler dans l’armée. Bien que cela aille certainement à l’encontre des précédents romains, nous n’avons peut-être pas d’autre choix. Le peuple se plaindra et notre stabilité en souffrira, mais avons-nous d’autres options?"
 zorgo_event.26.a: "J’aimerais ne pas avoir à faire cela, mais mes mains sont liées"
 zorgo_event.26.b: "Je ne permettrai jamais aux esclaves de combattre aux côtés des hommes libres"

 zorgo_event.27.t: "Tension au Sénat"
 zorgo_event.27.desc: "La noblesse de [ROOT.GetCountry.GetCapital.GetName] milite en faveur d’une modification de nos lois militaires, faisant valoir que nous avons fait preuve d’une trop grande indulgence en autorisant les classes inférieures à prendre les armes. En plus de rétablir les critères de richesse pour le service militaire, on a fait valoir que seuls les citoyens et les nobles devraient être autorisés à diriger nos troupes au combat.\n\nComme on le sait, les classes inférieures ne sont pas autorisées à interpréter les présages en observant les poulets sacrés, et l’idée de combattre sans connaître la volonté des dieux a grandement irrité les éléments les plus conservateurs de notre société."
 zorgo_event.27.a: "Donnez aux #Y Optimates#! ce qu’ils veulent"
 zorgo_event.27.b: "Je ne permettrai jamais aux esclaves de combattre aux côtés des hommes libres"

 zorgo_event.28.t: "Répartition par discipline"
 zorgo_event.28.desc: "Nous avons le regret de vous informer, ô [ROOT.GetCountry.GetRuler.GetName], que nos armées prennent de plus en plus l’habitude de piller les territoires étrangers qu’elles traversent, allant même jusqu’à ignorer les ordres leur enjoignant de laisser les habitants tranquilles. Nos généraux reconnaissent qu’il s’agit d’un problème, mais jusqu’à présent, personne n’a voulu punir les soldats comme il se doit, de crainte qu’un esprit de mutinerie ne s’empare des hommes."
 zorgo_event.28.a: "En guise de punition, pas de feux de camp pour le souper pendant cinq ans!"
 zorgo_event.28.b: "Réintroduire la décimation et ne faire preuve d'aucune clémence envers les coupables"

 zorgo_event.29.t: "L'oiseau qui parle"
zorgo_event.29.desc: "Un matin, un marchand nommé [SCOPE.sCharacter('random_talking_bird_merchant').GetName] se rendit sur le #E mont Palatin#! avec une offre intrigante : pour dix pièces d’or, il accepterait de vendre un corbeau parlant nommé « Mica Aurea », dressé à chanter les louanges de [ROOT.GetCountry.GetRuler.GetName]. Amusé par cette idée, [ROOT.GetCountry.GetRuler.GetFirstName] accepta d’assister à une démonstration dans la Curie.\n\nQuelques instants plus tard, cependant, l’oiseau se mit à croasser bruyamment : « [SCOPE.sCharacter('coruler_head_of_family').GetName] est le plus grand #E consul#! de l’histoire romaine » — quelle honte ! Il semble que [SCOPE.sCharacter('random_talking_bird_merchant').GetFirstName] ait appris à l’oiseau à prononcer plusieurs noms, et voilà que cette petite bête a ridiculisé [ROOT.GetCountry.GetRuler.GetFirstName] devant tout le monde ! Des éclats de rire se répandent dans la Curie."
 zorgo_event.29.a: "Je sais en rire quand c'est moi qui suis visé… ce n'est pas grave"
 zorgo_event.29.b: "Tue l'oiseau, et tue [SCOPE.sCharacter('random_talking_bird_merchant').GetFirstName]!"

 zorgo_event.30.t: "Réprimer une révolte d’esclaves"
 zorgo_event.30.desc: "Nous avons découvert un complot à [ROOT.GetCountry.GetCapital.GetName] visant à armer les esclaves domestiques dans l’espoir de renverser le régime de [ROOT.GetCountry.GetRuler.GetName]. Bien qu’un projet aussi insensé fût voué à l’échec, le fait que la conspiration en soit à un stade avancé est très inquiétant. Un grand nombre d’épées ont été découvertes, dissimulées dans une planque aux abords de la région de #E Subura#! à Rome, et il semble que l’attaque devait avoir lieu demain : nous l’avons échappé belle.\n\nLa #E Via Appia#! est désormais jonchée des corps torturés des crucifiés, un sinistre avertissement pour tous ceux qui nourrissent des pensées traîtresses."
 zorgo_event.30.a: "C’était moins une..."

 zorgo_event.31.t: "Fièvre quarte"
 zorgo_event.31.desc: "Des rumeurs font état d’une épidémie de fièvre quarte le long des côtes, sans aucun doute apportée sur nos rivages par des marchands étrangers.\n\nHeureusement, notre [GetOffice('office_apothecary').GetCulturalName(ROOT.GetCharacter.GetCountry)], [SCOPE.sCharacter('apothecary').GetName], a pris l’initiative de son propre chef et a ordonné que personne ne soit autorisé à quitter la région, mais les gens du peuple reprochent à [ROOT.GetCountry.GetRuler.GetName] de ne pas les avoir protégés."
 zorgo_event.31.a: "Maudite soit-elle ! Bouclez le port jusqu’à la fin de l’épidémie"

 zorgo_event.32.t: "Le prix des intrigues politiques"
 zorgo_event.32.desc: "Tout le monde à [ROOT.GetCountry.GetCapital.GetName] est au courant des tentatives de [SCOPE.sCharacter('random_house_head').GetName] pour utiliser ses relations familiales afin d’acheter du pouvoir politique ; il semble que tout le monde, des gardes du corps les plus humbles aux chefs des grandes familles, ait reçu un pot-de-vin de la bourse de [SCOPE.sCharacter('random_house_head').GetFirstName].\n\nImaginez donc le dégoût de [SCOPE.sCharacter('random_house_head').GetFirstName] lorsque [ROOT.GetCountry.GetRuler.GetName] a convoqué [SCOPE.sCharacter('random_house_head').GetHerHim] dans la capitale pour réclamer sa part..."
 zorgo_event.32.a: "J’ignore ce que tu manigances, mais ne m’oublie pas..."

 zorgo_event.33.t: "Le don de la connaissance"
 zorgo_event.33.desc: "[ROOT.GetCountry.GetRuler.GetName], nous avons reçu un curieux cadeau d’un roi étranger qui souhaite rester anonyme. Tout le monde sait à quel point le peuple de [ROOT.GetCountry.GetName] estime la connaissance, car nous avons acquis la réputation d’être les gens les plus intelligents à avoir jamais habité cette partie du monde. C’est donc une agréable surprise de recevoir en cadeau deux esclaves étrangers, parfaitement formés aux arts de la rhétorique et des mathématiques.\n\nUn simple message est remis à [ROOT.GetCountry.GetRuler.GetFirstName] : 'Nous espérons que ces tuteurs érudits aideront le peuple [ROOT.GetCountry.GetAdjective] dans sa noble quête de sagesse. Signé : Un ami.'"
 zorgo_event.33.a: "C’est un cadeau extraordinaire : nous avons beaucoup de chance !"

 zorgo_event.34.t: "Embarras au banquet"
 zorgo_event.34.desc: "[ROOT.GetCountry.GetRuler.GetName] était déjà de mauvaise humeur aujourd’hui, irrité de devoir assister à un banquet auquel [ROOT.GetCountry.GetRuler.GetSheHe] ne pouvait échapper, et buvait abondamment pour passer le temps lorsque l’incident s’est produit.\n\nÀ la moitié du troisième service, un serviteur maladroit, un homme nommé [SCOPE.sCharacter('random_baker').GetName], a perdu l’équilibre et trébuché, laissant tomber une coûteuse aiguière en cristal qui s’est brisée en mille morceaux. L’hôte, [SCOPE.sCharacter('random_dinner_host').GetName], s’est levé, le visage congestionné par la colère, et a exigé que [SCOPE.sCharacter('random_baker').GetFirstName] soit battu devant tout le monde.\n\nTous les regards se tournent avec insistance vers [ROOT.GetCountry.GetRuler.GetFirstName], qui se lève tant bien que mal sur [ROOT.GetCountry.GetRuler.GetHerHis] pieds."
 zorgo_event.34.a: "Inutile de faire une scène ; je paierai moi-même la vaisselle"
 zorgo_event.34.b: "Brisez toute la vaisselle restante de [SCOPE.sCharacter('random_dinner_host').GetFirstName] pour sa cupidité"
 zorgo_event.34.c: "Une erreur aussi grave mérite la mort ! Faites-moi cet honneur"

 zorgo_event.35.t: "Les gens que l'on fréquente"
 zorgo_event.35.desc: "Bien que nous fassions de notre mieux pour ne pas vous importuner avec des problèmes mineurs, tout le monde s’accorde à dire que vous devez faire quelque chose au sujet de [SCOPE.sCharacter('heir').GetName].\n\nDernièrement, [SCOPE.sCharacter('heir').GetFirstName] fréquente des individus peu recommandables, comme des marchands étrangers venus des terres de nos ennemis, qui lui mettent en tête du vin fort et de sottes rêveries. On dit même que certains parlent de placer [SCOPE.sCharacter('heir').GetFirstName] sur le trône de [ROOT.GetCountry.GetName] et, puisque [SCOPE.sCharacter('heir').GetSheHe] est un #E prétendant#!, cette affaire pourrait prendre une ampleur considérable. Que devons-nous faire, le cas échéant ?"
 zorgo_event.35.a: "Je refuse d’intervenir sans preuve concrète"
 zorgo_event.35.b: "Menacez [SCOPE.sCharacter('heir').GetFirstName] d’exil et payez quelqu’un pour le surveiller"

 zorgo_event.36.t: "Un aventurier las du monde"
 zorgo_event.36.desc: "Tôt ce matin, une troupe de guerriers vêtus de manière étrange, menée par un homme intimidant nommé [SCOPE.sCharacter('typhion').GetName], s’est présentée aux portes de [ROOT.GetCountry.GetCapital.GetName] pour demander la permission d’acheter des provisions sur nos marchés. Interrogés sur la valeur de leur monnaie, ils ont répondu penauds qu’ils étaient démunis, mais qu’ils accepteraient de se séparer d’un trésor si le prix était convenable. Sentant chez cet homme une aura de grandeur, [ROOT.GetCountry.GetRuler.GetName] a demandé à [SCOPE.sCharacter('typhion').GetFirstName] de lui accorder une audience privée, dans l’espoir d’entendre l’histoire de ces vagabonds.\n\nBien que les combattants taciturnes aient hésité à se présenter devant notre [ROOT.GetCountry.GetRuler.GetTitleName], après quelques coupes de vin, ainsi que du pain et de la viande, une histoire curieuse leur a été racontée.\n\nEnfant, [SCOPE.sCharacter('typhion').GetFirstName] fut capturé par des pillards d’#E Eburonia#! et vendu comme esclave. Il finit à [GetProvince('(int32)84').GetName], où on lui donna le nom grec de « Typhon ». Formé pour servir de garde du corps, Typhon navigua avec son Maître jusqu’en Extrême-Orient, où il resta dix longues années. Il affirme même avoir visité l’île au bout du monde, un lieu connu sous le nom de #E Wa#!.\n\nC’est en Orient que Typhon entra en possession d’une lame connue sous le nom d’#Y épée des Vents#!. Bien que son visage se crispe lorsqu’il en parle, il propose de la vendre : « Je ne peux pas regarder mes hommes mourir de faim... leur vie vaut plus à mes yeux que cet artefact. »"
 zorgo_event.36.a: "Peut-être resterez-vous ici, [SCOPE.sCharacter('typhion').GetFirstName], et mettrez-vous votre bras armé à notre service ?"
 zorgo_event.36.b: "Payez le prix demandé et renvoyez-les demain matin"
 zorgo_event.36.c: "Renvoyez immédiatement cet étranger sans rien lui donner"

 zorgo_event.37.t: "Routes emportées par les eaux"
 zorgo_event.37.desc: "Nous avons de mauvaises nouvelles aujourd’hui, [ROOT.GetCountry.GetRuler.GetName] : nous avons dû courroucer un dieu de la tempête, car le vent hurlant et la pluie sont incessants depuis une semaine, n’apportant que misère et mauvaise humeur au peuple de [ROOT.GetCountry.GetName].\n\nMalheureusement, le temps a été si mauvais que toutes les routes menant à [ROOT.GetCountry.GetCapital.GetName] ont été ravagées, et la circulation vers notre capitale est désormais pratiquement à l’arrêt. Le commerce est presque inexistant, et la ville commence à manquer de nourriture fraîche... au moins y a-t-il de l’eau pour tout le monde, n’est-ce pas ?"
 zorgo_event.37.a: "Payez les habitants pour restaurer les grandes routes"

 zorgo_event.38.t: "Une demande de discrétion"
 zorgo_event.38.desc: "Récemment, une missive interceptée a été transmise anonymement à [ROOT.GetCountry.GetRuler.GetName], qui n’a pas tardé à en lire le contenu.\n\nS’attendant à découvrir les détails d’un complot traître, [ROOT.GetCountry.GetRuler.GetFirstName] a été stupéfait de trouver à la place une lettre d’amour passionnée, écrite par [SCOPE.sCharacter('random_adulterer').GetName] à [SCOPE.sCharacter('random_adulteress').GetName]. Normalement, cette affaire aurait été ignorée, mais le problème est que [SCOPE.sCharacter('random_adulterer').GetFirstName] et [SCOPE.sCharacter('random_adulteress').GetFirstName] sont mariés à d’autres personnes.\n\nSi cette liaison venait à être connue, les répercussions se feraient sentir dans toute la société [ROOT.GetCountry.GetAdjective]."
 zorgo_event.38.a: "J’ai mieux à faire que de surveiller la moralité"
 zorgo_event.38.b: "Rendez le contenu de la lettre public et forcez-les à divorcer"
 zorgo_event.38.c: "Faites chanter les amants... mais qui m’a envoyé cette lettre ?"

 zorgo_event.39.t: "Des levées renommées"
 zorgo_event.39.desc: "Récemment, une histoire sur nos soldats s’est répandue comme une traînée de poudre, prenant un caractère presque mythique qui ne fait que renforcer la suprématie de [ROOT.GetCountry.GetAdjective] au combat.\n\nLors d’un affrontement récent, la levée de [ROOT.GetCountry.GetCapital.GetName] avait été encerclée par l’ennemi et, bien que nos forces fussent inférieures en nombre dans un rapport de sept contre un, nos guerriers ont bel et bien vaincu l’adversaire, dispersant ses troupes et s’emparant de son convoi de bagages.\n\nDe retour au camp avec leur butin, l’un de nos hommes a hardiment demandé que les prises de guerre soient distribuées sous forme de gratification, afin d’encourager les soldats à continuer le combat."
 zorgo_event.39.a: "Donnez aux hommes tout ce qu’ils ont rapporté"
 zorgo_event.39.b: "Combattre pour [ROOT.GetCountry.GetName] est une récompense suffisante"

 zorgo_event.40.t: "Émeutes dans la capitale"
 zorgo_event.40.desc: "Pour être honnêtes, [ROOT.GetCountry.GetRuler.GetName], nous ne savons même pas ce qui s’est récemment passé dans les rues de [ROOT.GetCountry.GetCapital.GetName] ; selon les rumeurs, une dispute entre deux commerçants aurait dégénéré et, avant que quiconque puisse intervenir, une rixe générale aurait éclaté.\n\nQuelques personnes sont bien sûr mortes tragiquement dans les affrontements, mais le pire reste les incendies déclenchés par le camp perdant. Bien que nous ayons pu éteindre les flammes assez rapidement, un quartier résidentiel de [ROOT.GetCountry.GetCapital.GetName] a été réduit en cendres."
 zorgo_event.40.a: "Salauds ! Nous traquerons les responsables..."

 zorgo_event.41.t: "Ressentiment tenace"
 zorgo_event.41.desc: "Les conséquences du banquet de la semaine dernière chez [SCOPE.sCharacter('random_dinner_host').GetName] continuent de se faire sentir.\n\nAprès que [ROOT.GetCountry.GetRuler.GetName] a ordonné sous l’effet de l’ivresse que chaque plat de service de la maison soit brisé, il semble que [SCOPE.sCharacter('random_dinner_host').GetFirstName] ait nourri du ressentiment et fréquente désormais ouvertement nos ennemis.\n\nInutile de dire que cette situation ne semble pas vouloir disparaître."
 zorgo_event.41.a: "Bah... je me moque de [SCOPE.sCharacter('random_dinner_host').GetPraenomen] et de ses états d’âme"

 zorgo_event.42.t: "Un voleur dans la nuit"
 zorgo_event.42.desc: "[ROOT.GetCountry.GetRuler.GetName] est plongé dans un rêve lorsqu’un grand fracas métallique et un juron étouffé arrachent le sommeil aux yeux de [ROOT.GetCountry.GetRuler.GetHerHis]. [ROOT.GetCountry.GetRuler.GetFirstName] saisit péniblement un poignard près du lit et se remet debout en titubant. Là, dans le coin de la pièce près de la fenêtre, une silhouette obscure s’apprête à descendre le long des murs de la citadelle.\n\n« Qui êtes-vous ? » appelle désespérément [ROOT.GetCountry.GetRuler.GetFirstName].\n\n« Tu ne pensais tout de même pas que j’allais te laisser garder mon épée, n’est-ce pas ? » ricane [SCOPE.sCharacter('typhion').GetName]. « Tu n’as aucune idée de ce que j’ai dû endurer pour l’obtenir. »\n\nAvec un rire cruel, [SCOPE.sCharacter('typhion').GetFirstName] saisit un vase de bronze et le lance sur [ROOT.GetCountry.GetRuler.GetFirstName], frappant au visage le [ROOT.GetCountry.GetRuler.GetTitleName] encore ensommeillé. « N’essaie pas de me retrouver... nous ne nous reverrons que dans les Enfers. » Sur ces mots, Typhon disparaît par la fenêtre."
 zorgo_event.42.a: "Gardes ! À l’aide, on m’attaque !"
 zorgo_event.42.b: "Il est trop tard... Typhon s’échappe..."
 zorgo_event.42.c: "Je couperai la corde et regarderai ce voleur tomber à sa perte"

 zorgo_event.43.t: "L’esprit bienveillant"
 zorgo_event.43.desc: "[ROOT.GetCountry.GetRuler.GetName], nous avons reçu des provinces des rapports dignes de votre attention. Il semblerait qu’un dieu local, une divinité mineure, ait été aperçu parcourant notre royaume, touchant les vignes flétries et les champs en jachère pour leur rendre les couleurs du printemps.\n\nNotre peuple a rencontré cette créature divine à plusieurs reprises, laissant pour le dieu des gâteaux aux dattes et du vin, et celui-ci a en retour béni leurs récoltes et accru leur productivité.\n\nPour célébrer ce lien divin, les habitants ont de leur propre initiative bâti un sanctuaire à ce dieu inconnu."
 zorgo_event.43.a: "La piété des fidèles [ROOT.GetCountry.GetAdjective] a été récompensée !"

 zorgo_event.44.t: "Ne dérangez pas mes os"
 zorgo_event.44.desc: "Récemment, certains de nos citoyens de [ROOT.GetCountry.GetCapital.GetName] construisaient des maisons, mais au lieu d’extraire leur propre pierre, ils ont décidé de démolir d’anciennes tombes de la région et de réutiliser le marbre de Paros. En soi, cela n’a rien de remarquable, car notre peuple est connu pour employer des spolia, mais il convient de mentionner ce qu’il a découvert dans l’une des tombes.\n\nBien que les inscriptions fussent effacées, un vase d’or contenant les cendres d’un célèbre architecte a été découvert, peut-être celui qui avait conçu la nécropole, ainsi qu’un avertissement rédigé en plusieurs langues.\n\n« Ne dérangez pas mes os, de peur que le destin qui a frappé mon peuple ne détruise le vôtre. »\n\nLorsque [ROOT.GetCountry.GetRuler.GetName] a entendu cette histoire, [ROOT.GetCountry.GetRuler.GetSheHe] a été troublé et a exigé que le vase d’or soit réinhumé, mais celui-ci a disparu depuis longtemps et personne ne veut avouer où il se trouve."
 zorgo_event.44.a: "Je suis dégoûté d’entendre cette histoire sordide"

 zorgo_event.45.t: "Organiser la garde de nuit"
 zorgo_event.45.desc: "Récemment, un groupe de citoyens inquiets de [ROOT.GetCountry.GetCapital.GetName] a présenté une pétition à [ROOT.GetCountry.GetRuler.GetName]. Après qu’un incendie a failli réduire la capitale en cendres, le peuple a décidé de prendre les choses en main et a commencé à former des patrouilles nocturnes, qui ont jusqu’ici réussi à réduire la criminalité et à protéger nos foyers de la menace mortelle des incendies.\n\nMalheureusement, ils demandent que l’État subventionne officiellement leurs efforts ; ils veulent que nous équipions les volontaires dès maintenant, ce qui ne sera pas bon marché, et que nous financions continuellement leur initiative.\n\nPersonne ne connaît mieux nos finances que vous, [ROOT.GetCountry.GetRuler.GetFirstName] ; le choix vous appartient."
 zorgo_event.45.a: "Il est hors de question que nous financions cela"
 zorgo_event.45.b: "Cela coûtera peut-être un peu maintenant, mais chaque pièce en vaudra la peine"

 zorgo_event.46.t: "Camps de brigands"
 zorgo_event.46.desc: "Nous avons appris par des rumeurs que des esclaves en fuite formaient des bandes, unissant leurs forces pour rendre à la société qui les avait autrefois asservis la misère qu’ils avaient subie.\n\nCes brigands sèment le chaos, laissant derrière eux une traînée de mort et de destruction, et l’on dit même qu’ils ont établi des camps dans l’une de nos colonies : quel mépris total pour la loi [ROOT.GetCountry.GetAdjective] !\n\nLa pression monte pour que [ROOT.GetCountry.GetRuler.GetName] agisse. Nous n’allons tout de même pas laisser ces voleurs opérer impunément à [ROOT.GetCountry.GetName] ?"
 zorgo_event.46.a: "Envoyez quelques cohortes de nos meilleurs hommes mettre fin à leur terreur"
 zorgo_event.46.b: "Nous ne pouvons pas nous permettre de mobiliser des hommes pour le moment, je le crains"

 zorgo_event.47.t: "Camps de brigands : bataille"
 zorgo_event.47.desc: "Nos éclaireurs ont repéré l’emplacement du camp des brigands et les derniers préparatifs de l’attaque sont en cours.\n\nLes voleurs sont plus rusés qu’on ne pourrait le croire : ils ont attaqué des domaines esclavagistes, libérant les captifs et grossissant leurs rangs. Bien que nous nous attendions à une simple escarmouche, tous les signes annoncent une bataille désespérée et rangée... les esclaves ne céderont pas facilement leur liberté."
 zorgo_event.47.a: "Je mènerai moi-même nos guerriers au combat"
 zorgo_event.47.b: "Une tâche aussi dérisoire doit être déléguée ; informez-moi de notre victoire"

 zorgo_event.48.t: "Camp de brigands : triomphe"
 zorgo_event.48.desc: "Bien que le combat fût périlleux, les forces de [ROOT.GetCountry.GetName] ont réussi à repousser la populace d’esclaves, anéantissant tous ceux qui tenaient leur position et combattaient. Lorsque le cours de la bataille s’est inversé, une vaste multitude s’est rendue et a immédiatement été chargée de fers ; les marchés aux esclaves de [ROOT.GetCountry.GetCapital.GetName] seront pleins d’ici quinze jours.\n\nCependant, comme le dit le proverbe, une meute de chiens peut vaincre un lion solitaire, et bien que [ROOT.GetCountry.GetRuler.GetName] ait combattu vaillamment, [ROOT.GetCountry.GetRuler.GetSheHe] a reçu un coup de lance au visage et a malheureusement perdu un œil. [ROOT.GetCountry.GetRuler.GetFirstName] est attristé par ce retournement, et la découverte du trésor des brigands n’atténue que légèrement la douleur."
 zorgo_event.48.a: "Les dieux ne nous donnent que ce que nous sommes capables de supporter"

 zorgo_event.49.t: "Camp de brigands : triomphe"
 zorgo_event.49.desc: "Des nouvelles de la campagne contre les brigands ! [SCOPE.sCharacter('general_getting_recognition').GetName] a reçu le commandement de nos forces et a mené nos hommes à la victoire, écrasant tous ceux qui osaient se dresser dans le champ contre nos levées [ROOT.GetCountry.GetAdjective].\n\n[SCOPE.sCharacter('general_getting_recognition').GetFirstName] a remis un rapport personnel à [ROOT.GetCountry.GetRuler.GetName], détaillant les événements palpitants de la bataille.\n\nÀ mesure que la nouvelle de la victoire éclatante de [SCOPE.sCharacter('general_getting_recognition').GetFirstName] se répand, le peuple se réjouit d’apprendre que [ROOT.GetCountry.GetName] est béni de génies militaires."
 zorgo_event.49.a: "Qui aurait douté que mes armées écraseraient ces chiens ?"

 zorgo_event.50.t: "Une pluie d’or sur le peuple"
 zorgo_event.50.desc: "Un après-midi, [ROOT.GetCountry.GetRuler.GetName] se détend dans [ROOT.GetCountry.GetRuler.GetHerHis] appartements privés à [ROOT.GetCountry.GetCapital.GetName], écoutant les bruits du marché animé à l’extérieur. Le dernier repas de la journée sera bientôt servi et les rues sont remplies de bons citoyens [ROOT.GetCountry.GetAdjective] qui achètent de la nourriture. Une pensée impétueuse traverse l’esprit de [ROOT.GetCountry.GetRuler.GetFirstName] et, quelques instants plus tard, [ROOT.GetCountry.GetRuler.GetSheHe] se trouve à l’arrière d’un char, se dirigeant vers les ruelles où les vendeurs s’affairent.\n\nPlongeant la main au fond d’une bourse, [ROOT.GetCountry.GetRuler.GetFirstName] commence à jeter des poignées d’or et d’argent dans les rues. Une foule se rassemble et tend les mains vers son [ROOT.GetCountry.GetRuler.GetTitleName], le visage couvert de poussière brillant d’admiration."
 zorgo_event.50.a: "Je vous aime tous, chacun d’entre vous !"

 zorgo_event.51.t: "Une trêve fiscale"
 zorgo_event.51.desc: "Le moment de recouvrer les impôts dus par les classes supérieures approche, une période historiquement impopulaire à [ROOT.GetCountry.GetName], au grand dam de [ROOT.GetCountry.GetRuler.GetName], qui attend avec impatience les sommes forfaitaires perçues mais déteste s’attirer les foudres des puissants.\n\nAlors que [ROOT.GetCountry.GetRuler.GetFirstName] examine les registres fiscaux, un conseiller s’avance en se raclant la gorge.\n\n« Et si nous brûlions simplement les registres ? Vous deviendriez extrêmement populaire en pardonnant toutes ces dettes accumulées, et nos terres ont déjà connu de telles mesures. »"
 zorgo_event.51.a: "Voilà une excellente idée... qu’il en soit ainsi"
 zorgo_event.51.b: "Certainement pas. Je veux chaque pièce due à l’État !"

 zorgo_event.52.t: "Camps militaires pour notre jeunesse"
 zorgo_event.52.desc: "[SCOPE.sCharacter('general_advisor').GetName], connu dans tout [ROOT.GetCountry.GetName] pour [SCOPE.sCharacter('general_advisor').GetHerHis] habileté à manier la lame, a demandé à [ROOT.GetCountry.GetRuler.GetName] d’envisager la création d’un programme financé par l’État qui formerait les enfants de nos classes supérieures aux arts de la guerre.\n\n« On dit que dans les terres de nos ennemis, on apprend à un enfant de cinq ans à combattre à la lance. Pourquoi nos fils [ROOT.GetCountry.GetAdjective] ne feraient-ils pas de même ? »"
 zorgo_event.52.a: "Nous ne pouvons tout simplement pas nous le permettre, même si l’idée est bonne"
 zorgo_event.52.b: "Excellente idée, [SCOPE.sCharacter('general_advisor').GetFirstName] : qu’il en soit ainsi"

 zorgo_event.53.t: "Le sage au carrefour"
 zorgo_event.53.desc: "[ROOT.GetCountry.GetRuler.GetName] ramène sa petite suite à [ROOT.GetCountry.GetCapital.GetName] après une journée de chasse réussie lorsque [ROOT.GetCountry.GetRuler.GetSheHe] rencontre un étrange personnage au carrefour menant à la capitale. Vêtu de la simple robe d’un moine, [SCOPE.sCharacter('dementive_sadhu').GetName] est assis les yeux fermés, tenant une petite pipe en argile. \n\n« Bom Shiva ! » s’exclame l’homme en expirant un nuage de fumée épaisse. « Enfin, [ROOT.GetCountry.GetRuler.GetFirstName], nos chemins se croisent. » Le vieillard se lève et s’incline profondément. « J’ai voyagé de nombreux jours pour atteindre cet endroit ; mon dieu, le Seigneur Shiva, m’a ordonné de vous offrir mes services.\n\nRepoussant les nuages nauséabonds, [ROOT.GetCountry.GetRuler.GetFirstName] hausse un sourcil. « Et dans quel but votre dieu vous a-t-il envoyé ici ? »\n\nAvec un rire strident, [SCOPE.sCharacter('dementive_sadhu').GetFirstName] répond avec une lueur dans les yeux.\n\n« Cela reste à voir, mon Seigneur. »"
 zorgo_event.53.a: "Fort bien, vous pouvez donc nous suivre jusqu’à chez nous"

 zorgo_event.54.t: "Assassins Foiled"
 zorgo_event.54.desc: "One evening, there is a loud commotion in the courtyard of [ROOT.GetCountry.GetRuler.GetName]'s home - it sounds like a pitched battle is taking place! The screams of dying men fill the air, punctuated by the clangs of metal. Grabbing a sword and a breastplate, [ROOT.GetCountry.GetRuler.GetFirstName] rushes out into the street to see what is happening.\n\nMuch to [ROOT.GetCountry.GetRuler.GetHerHis] surprise, by the time [ROOT.GetCountry.GetRuler.GetSheHe] arrives, the fighting is over. There, standing over the bodies of twelve slain men and completely untouched himself, is [SCOPE.sCharacter('dementive_sadhu').GetName], who spits on the corpse nearest to him.\n\nTurning to [ROOT.GetCountry.GetRuler.GetFirstName], [SCOPE.sCharacter('dementive_sadhu').GetFirstName] bows and walks past the stunned [ROOT.GetCountry.GetRuler.GetTitleName], who is standing there mouth agape. 'Shiva be praised that I was awake...'"
 zorgo_event.54.a: "...and now you know why I was sent here"

 zorgo_event.55.t: "Une terre digne d’être visitée"
 zorgo_event.55.desc: "La rumeur se répand au loin que notre pays de [ROOT.GetCountry.GetName] est un endroit agréable à visiter, [ROOT.GetCountry.GetCapital.GetName] étant le site le plus impressionnant que nous ayons à offrir. Notre hospitalité [ROOT.GetCountry.GetAdjective] est réputée, et même ceux qui n’ont aucune affaire dans notre royaume font souvent un détour pour venir visiter notre capitale."
 zorgo_event.55.a: "Nous sommes reconnaissants d’avoir une réputation si accueillante"

 zorgo_event.56.t: "Un cartographe renommé"
 zorgo_event.56.desc: "[ROOT.GetCountry.GetRuler.GetName], cela pourrait vous surprendre, mais un visiteur ayant parcouru la largeur de la Terre pour rejoindre votre cour se trouve à [ROOT.GetCountry.GetCapital.GetName]. Bien que cet étranger, un homme nommé [SCOPE.sCharacter('shocky_cartographer').GetName], ne connaisse pas notre langue, il communique avec nous par l’intermédiaire d’interprètes et nous raconte son histoire ainsi que ses aventures.\n\n[SCOPE.sCharacter('shocky_cartographer').GetFirstName] vient d’un archipel connu sous le nom de #E Maldives#!, qui se trouverait au large des côtes de l’#E Inde#!, et a passé les vingt dernières années à naviguer sur toutes les mers entre [ROOT.GetCountry.GetName] et son pays natal.\n\nIl possède ainsi certaines des cartes les plus détaillées jamais réalisées par un cartographe et nous offre la possibilité d’en faire faire des copies par nos scribes. Si nous acceptons son tarif, il s’installera à [ROOT.GetCountry.GetCapital.GetName] et commencera immédiatement à travailler avec nos hommes, même si l’ouvrage prendra du temps."
 zorgo_event.56.a: "Nous ne pouvons pas nous le permettre pour le moment"
 zorgo_event.56.b: "Donnez à Indra ce qu’il demande et installez-le dans notre bibliothèque"

 zorgo_event.57.t: "Une demande de fonds"
 zorgo_event.57.desc: "[SCOPE.sCharacter('shocky_cartographer').GetName] s’est révélé être un élève rapide durant son travail à [ROOT.GetCountry.GetCapital.GetName], apprenant les rudiments de la langue [ROOT.GetCountry.GetAdjective] avec une facilité qui a impressionné [ROOT.GetCountry.GetRuler.GetName]. Il est désormais capable de communiquer seul, un exploit qui a impressionné tous ceux qui y prêtaient attention.\n\nMalheureusement, il nous a directement demandé davantage d’argent : il affirme avoir besoin de plus de fournitures, mais nous promet que le travail accompli jusqu’à présent est de premier ordre."
 zorgo_event.57.a: "Nous ne pouvons plus nous le permettre..."
 zorgo_event.57.b: "Heureusement, l’État a les poches profondes"
 zorgo_event.57.c: "Quoi ?! Nous allons simplement prendre les cartes d’Indra et le chasser de [ROOT.GetCountry.GetName]"
 shocky_stops_working_tt: "#Y Indra cessera de travailler à la copie des cartes.#!"
 shocky_keeps_working_tt: "#Y Indra poursuivra son travail.#!"

 zorgo_event.58.t: "Un développement stupéfiant"
 zorgo_event.58.desc: "« Que faites-vous ?! » demande [SCOPE.sCharacter('shocky_cartographer').GetName] tandis que vos soldats font irruption dans ses appartements. C’est le milieu de la nuit, et pourtant le cartographe travaille encore avec acharnement ; une petite bougie brûle vivement sur son bureau.\n\n[ROOT.GetCountry.GetRuler.GetName] s’avance, l’air déterminé sur le visage. « Vous êtes en état d’arrestation, [SCOPE.sCharacter('shocky_cartographer').GetFirstName]. »\n\n« En état d’arrestation ? Pour quel motif ? C’est grotesque ! »\n\nAvant que [ROOT.GetCountry.GetRuler.GetFirstName] puisse répondre, [SCOPE.sCharacter('shocky_cartographer').GetFirstName] plonge la main dans sa tunique et en sort un poignard, se jetant en avant et frappant sauvagement. La lame s’enfonce profondément dans la gorge de [ROOT.GetCountry.GetRuler.GetFirstName], [ROOT.GetCountry.GetRuler.GetHerHim] tuant sur-le-champ."
 zorgo_event.58.a: "Mes hommes me vengeront..."

 zorgo_event.59.t: "Les cartes d’Indra"
 zorgo_event.59.desc: "Bien qu’il semble s’être écoulé une éternité depuis que nous avons chargé [SCOPE.sCharacter('shocky_cartographer').GetName] de réaliser des cartes pour nous, le savant cartographe nous informe qu’il a enfin terminé et a personnellement demandé à [ROOT.GetCountry.GetRuler.GetName] de venir les voir en personne.\n\n« Vous constaterez que ces cartes sont les plus précises jamais réalisées », déclare pompeusement [SCOPE.sCharacter('shocky_cartographer').GetFirstName] en désignant les noms des fleuves et des chaînes de montagnes sur la pile de rouleaux posée sur la table. « Je vous prie de m’excuser d’avoir été si long, mais la qualité ne souffre pas la précipitation, ô estimé [ROOT.GetCountry.GetRuler.GetTitleName]. »"
 zorgo_event.59.a: "Indra... je suis stupéfait. Elles sont magnifiques !"

 zorgo_event.60.t: "Un guerrier et un érudit"
 zorgo_event.60.desc: "Des rumeurs affirment qu’un capitaine mercenaire stationné à [ROOT.GetCountry.GetCapital.GetName], un certain [SCOPE.sCharacter('omega_corp_trainer').GetName], connaît un succès sans précédent sur le champ de bataille grâce à des tactiques militaires inhabituelles qu’il a lui-même conçues. À la fin de chaque saison de campagne, les hommes de [SCOPE.sCharacter('omega_corp_trainer').GetFirstName] rentrent chez eux alourdis d’or et d’esclaves, sans paraître plus mal en point pour autant : comment font-ils ?\n\nDésireux de rencontrer en personne un esprit militaire aussi brillant, [ROOT.GetCountry.GetRuler.GetName] a invité le mercenaire à dîner avec [ROOT.GetCountry.GetRuler.GetHerHim] dans une semaine."
 zorgo_event.60.a: "J’ai hâte de rencontrer [SCOPE.sCharacter('omega_corp_trainer').GetName]"

 zorgo_event.61.t: "La dernière ligne de défense"
 zorgo_event.61.desc: "« Alors, tu veux connaître mes secrets, hein ? »\n\nLe dîner entre [SCOPE.sCharacter('omega_corp_trainer').GetName] et [ROOT.GetCountry.GetRuler.GetName] se déroule dans une ambiance détendue et, bien que la raison de cette rencontre ait été évitée durant les premiers services, alors que les esclaves apportent davantage de vin et de fruits, la conversation se tourne vers les affaires.\n\n[SCOPE.sCharacter('omega_corp_trainer').GetFirstName] se penche en avant, les yeux brillant d’excitation. « Je vais faire mieux et vous révéler le plus grand de tous les secrets. Je compte en réalité me retirer du service mercenaire ; il est temps de garder mes troupeaux et d’élever des enfants chez moi. Si vous êtes prêt à en payer le prix, je vous vendrai mes troupes d’élite. Vous avez sûrement entendu parler de l’Armée Omega ? »\n\n« Oui, j’en ai entendu parler. » [ROOT.GetCountry.GetRuler.GetFirstName] s’adosse sur son divan et croque dans une grosse pomme. « Tout le monde en a entendu parler ; puisque l’Alpha est le premier... »\n\n« Alors l’Omega est le dernier. Vous voulez connaître les prétendus secrets de ma gloire ? Mes hommes ne battent jamais en retraite, ils tiennent toujours leur position. Qu’en dites-vous, [ROOT.GetCountry.GetRuler.GetFirstName] ? Je mets les voiles pour #E Ordovicia#! à l’aube. Vous connaissez mon prix : voici votre chance de posséder l’une des compagnies de mercenaires les plus redoutées de tout le pays. »"
 zorgo_event.61.a: "Nous ne pouvons pas nous permettre cette dépense pour le moment"
 zorgo_event.61.b: "Quelle heureuse circonstance ! Bien sûr, nous achèterons vos hommes"

 zorgo_event.62.t: "Une curieuse découverte : du lait aigre"
 zorgo_event.62.desc: "Dernièrement, nos fermiers se plaignent que leurs vaches produisent un lait aigre au goût d’ail qui caille presque immédiatement. Il est si piquant et infect que même leurs veaux refusent de le boire, et de nombreux animaux meurent. Ce phénomène épouvantable s’est répandu dans tout le pays et, bien que [ROOT.GetCountry.GetRuler.GetName] le nie, certains murmurent qu’un dieu a dû être gravement offensé par une conduite inconsidérée du dirigeant [ROOT.GetCountry.GetAdjective]."
 zorgo_event.62.a: "Je... je n’ai aucune idée de la raison pour laquelle cela nous arrive"

 zorgo_event.63.t: "Une soirée au théâtre"
 zorgo_event.63.desc: "Un dramaturge renommé présente ce soir une nouvelle pièce à [ROOT.GetCountry.GetCapital.GetName] et l’excitation est palpable en ville, particulièrement dans la demeure de [ROOT.GetCountry.GetRuler.GetPraenomen], où [ROOT.GetCountry.GetRuler.GetSpouse.GetName] a fait savoir que [ROOT.GetCountry.GetRuler.GetSpouse.GetSheHe] souhaitait vivement y assister. En vérité, c’est la seule chose dont [ROOT.GetCountry.GetRuler.GetSpouse.GetSheHe] parle depuis des mois."
 zorgo_event.63.a: "Je suis trop occupé pour aller voir une pièce ennuyeuse"
 zorgo_event.63.b: "Oui, mon amour, nous serons au premier rang"
 going_to_see_the_play_tt: "#Y Vous et votre conjoint assisterez à la pièce au Grand Théâtre."

 zorgo_event.64.t: "A Night At The Theater: The Play"
 zorgo_event.64.desc: "Despite not wanting to go, once [ROOT.GetCountry.GetRuler.GetName] got settled, [ROOT.GetCountry.GetRuler.GetSheHe] really enjoyed the play - the #E Grand Theater#! in the heart of [ROOT.GetCountry.GetCapital.GetName] is an impressive facility, with acoustics that are unrivaled, and seeing a high-quality performance in such a beautiful venue was a magical experience that will be hard to forget.\n\nIt doesn't hurt that [ROOT.GetCountry.GetRuler.GetSpouse.GetName] is happy, either."
 zorgo_event.64.a: "I look forward to our next evening at the theater"

 zorgo_event.65.t: "Rumors Of Barbarians"
 zorgo_event.65.desc: "There are unfounded rumors that a large barbarian horde is sweeping through the countryside, pillaging, plundering and burning good [ROOT.GetCountry.GetAdjective] homesteads to ashes. Prices are starting to rise in the capital, and those with the means to are fleeing for the safety of the countryside.\n\nAlthough [ROOT.GetCountry.GetRuler.GetName] has assured the people of [ROOT.GetCountry.GetCapital.GetName] that these stories are nonsense and there is nothing to be afraid of, the people in the city are panicking."
 zorgo_event.65.a: "Everything will be fine, but you must relax!"

 zorgo_event.66.t: "Disappointing Hauls"
 zorgo_event.66.desc: "Our fishermen report that they have been unable to find as many fish as they have in years past, and many are starting to worry that they will not be able to feed their families, let alone have enough left to sell at market.\n\nThe price of fresh fish has gotten to be outrageous in [ROOT.GetCountry.GetCapital.GetName], with men paying a week's wages for a large mackerel - have you ever heard of such a thing?"
 zorgo_event.66.a: "These hard times will pass, you will see"

 zorgo_event.67.t: "Hurt Feelings"
 zorgo_event.67.desc: "[SCOPE.sCharacter('random_dude_advisor').GetName] has accused [ROOT.GetCountry.GetRuler.GetName] of some imagined slight, and is now rebuffing [ROOT.GetCountry.GetRuler.GetFirstName]'s efforts at peacemaking.\n\nIt seems like we have another enemy to worry about."
 zorgo_event.67.a: "This is terribly vexatious...I didn't even do anything"

 zorgo_event.68.t: "Aching For Adventure"
 zorgo_event.68.desc: "One morning, [ROOT.GetCountry.GetRuler.GetName] is confronted by [SCOPE.sCharacter('heir').GetName], who is dressed as though [SCOPE.sCharacter('heir').GetSheHe] is getting ready to leave on a long journey.\n\n'An opportunity for me to travel with some trusted companions has arisen, [ROOT.GetCountry.GetRuler.GetFirstName], and I intend to pursue it. Please, be gracious and allow me to leave [ROOT.GetCountry.GetName] - I want to see the world for myself before I have to stay here in [ROOT.GetCountry.GetCapital.GetName] and assume my duties.'"
 zorgo_event.68.a: "You may leave, but take care of yourself"
 zorgo_event.68.b: "We need you here, at home, [SCOPE.sCharacter('heir').GetFirstName]"


 zorgo_event.69.t: "A Moment To Myself"
 zorgo_event.69.desc: "Although the duties of ruling [ROOT.GetCountry.GetName] consume practically every hour of every day, there are still a few moments, rare as they might be, when [ROOT.GetCountry.GetRuler.GetName] is able to steal away for a day, leaving [ROOT.GetCountry.GetRuler.GetHerHis] duties for the morrow and retiring to a small home on the outskirts of [ROOT.GetCountry.GetCapital.GetName] for some peace and quiet.\n\nIt is here, away from the chaos and commotion of the capital, that [ROOT.GetCountry.GetRuler.GetFirstName] is able to relax and think clearly."
 zorgo_event.69.a: "I shall return in a day or two with renewed vim and vigor"

 zorgo_event.70.t: "Horse Thieves"
 zorgo_event.70.desc: "Because it is known that [ROOT.GetCountry.GetAdjective] horses are some of the finest in the entire world, we occasionally must deal with raiders and bandits that target our stud farms, hoping to steal as many of the precious animals for themselves as they can.\n\nRegrettably, we must inform you that we recently suffered such an attack; a few lives were lost, and a few prized beasts taken...I am sorry, [ROOT.GetCountry.GetRuler.GetName]."
 zorgo_event.70.a: "And I am sorry as well...what a terrible thing to happen"

 zorgo_event.71.t: "Warriors From Abroad"
 zorgo_event.71.desc: "The strangest thing happened this morning near [ROOT.GetCountry.GetCapital.GetName]. Two cohorts of soldiers, dressed in tattered armor, with many of the men marching barefoot and nursing infected wounds, arrived at the gates of our capital, begging for sanctuary.\n\nThey speak of a great battle that took place to our north, where multiple armies clashed, and while these brave fighters survived, their country did not - utterly destroyed by their enemies. Now, they have nowhere to go and are desperately searching for a new home."
 zorgo_event.71.a: "We could always use experienced fighters in [ROOT.GetCountry.GetName]"

 zorgo_event.72.t: "The Barbarian Camp"
 zorgo_event.72.desc: "We keep hearing reports of barbarians that live beyond our [ROOT.GetCountry.GetAdjective] borders that are making life miserable for our people. Not only have they created a large camp somewhere in the mountains, but they even wait until our armies are away on campaign before they launch their attacks - it seems that they would rather murder innocent women and children instead of fight with honor, like real warriors.\n\nWe could dispatch some of our forces to take care of the problem for us, if you so choose."
 zorgo_event.72.a: "The people living near the border need to toughen up"
 zorgo_event.72.b: "I will lead our men into battle against them"
 we_will_start_marching_asap_tt: "#Y We march for the barbarian camp at dawn.#!"

 zorgo_event.73.t: "The Barbarian Camp:Mountain Foothills"
 zorgo_event.73.desc: "We have been marching for the better part of a week, only resting for a few hours here and there, and it is starting to catch up with our men - [ROOT.GetCountry.GetRuler.GetName] has set an unrelenting pace, no doubt due to the fact that [ROOT.GetCountry.GetRuler.GetSheHe] is regretting leaving [ROOT.GetCountry.GetCapital.GetName] to accompany these warriors. Affairs in the capital city always require a delicate hand, and [ROOT.GetCountry.GetRuler.GetFirstName] has been receiving daily reports from back home - it is obvious that [ROOT.GetCountry.GetRuler.GetSheHe] wants to return as soon as possible, but our warriors are tired and it shows.\n\nDusk is creeping over the craggy foothills of the region where the barbarian camp is rumored to be, and a light snow is beginning to fall. [ROOT.GetCountry.GetRuler.GetFirstName]'s horse is breathing heavily, sending puffs of steam in the cold mountain air."
 zorgo_event.73.a: "Press forward, ye men of [ROOT.GetCountry.GetName]!"
 zorgo_event.73.b: "We will make camp here in the foothills and attack tomorrow"
 zorgo_event.73.c: "Business in [ROOT.GetCountry.GetCapital.GetName] calls us home"
 we_camp_at_barbarians_tt: "#Y We will set up tents and sleep for a few hours...#!"
 we_wont_fight_the_barbarians_tt: "#Y We will abandon the mission and return home.#!"

 zorgo_event.74.t: "The Barbarian Camp:Ambush"
 zorgo_event.74.desc: "Even though our men are exhausted, marching through the evening has proven to be a wise course of action - it seems that the barbarians have caught wind of our forces and were planning to ambush us in the mountain passes.\n\nThanks to [ROOT.GetCountry.GetRuler.GetName]'s diligence, however, we have turned the tables on our enemies and have caught them unprepared, in a scattered and unorganized state. The sight of our foes has reinvigorated our men, who are charging into the barbarian camp!"
 zorgo_event.74.a: "Seize our advantage! Attack, attack! Forward!"

 zorgo_event.75.t: "The Barbarian Camp:Night Battle"
 zorgo_event.75.desc: "The sound of screaming men jolts [ROOT.GetCountry.GetRuler.GetName] from [ROOT.GetCountry.GetRuler.GetHerHis] slumber, and instincts take over immediately - within seconds, [ROOT.GetCountry.GetRuler.GetSheHe] is dressed in armor and standing outside, frantically scanning the horizon.\n\nThe barbarians, gods damn them, have launched a surprise attack! They have surrounded our camp and are pressing in on all sides - the air is already thick with missiles, and there is a sharp zipping sound as the arrows pierce the leather of [ROOT.GetCountry.GetRuler.GetFirstName]'s tent. Thankfully, our watchmen saw them coming down the mountainside and were able to sound the alarm, but just barely.\n\nThe heavy thudding of hooves announces the charge of the enemy forces - battle is at hand!"
 zorgo_event.75.a: "For [ROOT.GetCountry.GetName]! Aaaarrrggghhh!"

 zorgo_event.76.t: "The Barbarian Camp:Challenge"
 zorgo_event.76.desc: "The battle at the barbarian camp has been bloody, with both sides settling into the familiar rhythm of violence, and it is hard to determine who has the upper hand in the desperate fighting.\n\nIn the center, [ROOT.GetCountry.GetRuler.GetName] has been leading the front line, hacking a gory path through the barbarian ranks. Suddenly, a carnyx bleats out a woeful sound, and a figure on horseback emerges from the barbarian throngs - it is their leader, the terrifying [SCOPE.sCharacter('barbarian_camp_leader').GetName].\n\nPointing a spear at [ROOT.GetCountry.GetRuler.GetFirstName], [SCOPE.sCharacter('barbarian_camp_leader').GetFirstName] yells in a foreign tongue, and although the words are unintelligible, their meaning is not."
 zorgo_event.76.a: "Of course, I will duel you!"
 zorgo_event.76.b: "We shall not cross blades today, barbarian scum"
 the_barbarian_battle_continues_tt: "#Y The battle continues without glorious one-on-one combat...#!"
 zorgo_event.76.c: "Archers, concentrate your fire on Deimos!"

 zorgo_event.77.t: "The Barbarian Camp:Duel"
 zorgo_event.77.desc: "[SCOPE.sCharacter('barbarian_camp_leader').GetName] charges forward, pounding his sword against his shield and screaming incoherently. With a speed that belies his size, the barbarian pounces on [ROOT.GetCountry.GetRuler.GetName], with the tip of his cruel blade drawing the first blood.\n\nStepping back, [ROOT.GetCountry.GetRuler.GetFirstName] curses, [ROOT.GetCountry.GetRuler.GetHerHis] mind racing - there's no time to think!"
 zorgo_event.77.a: "Deimos is a tougher foe than I first thought but I won't give up"
 zorgo_event.77.b: "You disregard personal safety and attack wildly"
 zorgo_event.77.c: "Give my greetings to the gods of the underworld, Deimos"
 damn_dawg_youre_strong_af_tt: "#Y This option is available because of your Ruler's high Martial stat.#!"
 coward_tooltip: "#Y This option is available because your Ruler is a coward.#!"

 zorgo_event.78.t: "The Barbarian Camp:Conclusion"
 zorgo_event.78.desc: "All eyes are on [SCOPE.sCharacter('barbarian_camp_leader').GetName] and [ROOT.GetCountry.GetRuler.GetName], who are locked in fierce combat - the sound of metal striking against metal fills the air, punctuated by the grunts and cries of the two combatants.\n\nSeeing an opportunity, [ROOT.GetCountry.GetRuler.GetFirstName] lunges forward, swinging [ROOT.GetCountry.GetRuler.GetHerHis] sword with all of [ROOT.GetCountry.GetRuler.GetHerHis] might. [SCOPE.sCharacter('barbarian_camp_leader').GetFirstName]'s head is severed immediately, flying into the air with a magnificent stream of blood accompanying it. At this horrific sight, the barbarian formations collapse, and our [ROOT.GetCountry.GetAdjective] soldiers begin indescriminately slaughtering anyone in the vicinity."
 zorgo_event.78.a: "Destroy the barbarian camp!"

 zorgo_event.79.t: "The Barbarian Camp:Conclusion"
 zorgo_event.79.desc: "As was anticipated, our soldiers were able to destroy the barbarian forces arrayed against them - what were the savages thinking, meeting the men of [ROOT.GetCountry.GetName] in battle?\n\n[SCOPE.sCharacter('barbarian_camp_leader').GetName] was found writhing on the battlefield, a deep spear wound in his back, but [ROOT.GetCountry.GetRuler.GetName] did not show clemency to the cowardly barbarian leader, executing him in full sight of the [ROOT.GetCountry.GetAdjective] army.\n\nThe barbarian camp was plundered before it was set ablaze, and our men began marching back to [ROOT.GetCountry.GetCapital.GetName], their knapsacks filled to bursting with the ill-gotten gains of the defeated raiders."
 zorgo_event.79.a: "And we will do the same to any who attack our people"

 zorgo_event.80.t: "The Barbarian Camp:Wealth Beyond Measure"
 zorgo_event.80.desc: "As the last of the barbarian redoubts were set to the torch, [ROOT.GetCountry.GetRuler.GetName] and [ROOT.GetCountry.GetRuler.GetHerHis] advisors were standing around with their hands on their heads, flabbergasted by what they had found.\n\nA massive sum of silver and gold talents were uncovered in twenty large chests - a fortune worthy of a king. Not only had they freed the [ROOT.GetCountry.GetAdjective] people from a roving menace, but they had also swelled the [ROOT.GetCountry.GetAdjective] treasury in one fell swoop."
 zorgo_event.80.a: "We will be sure to put this to good use"

 zorgo_event.81.t: "Blighted Crops"
 zorgo_event.81.desc: "We are sorry to report that the harvest this year is going to be exceptionally bad - powdery mildew has been an awful problem lately, and we have had to destroy much of what was gathered."
 zorgo_event.81.a: "Curses!"

 zorgo_event.82.t: "Investment Opportunity"
 zorgo_event.82.desc: "A group of merchants have boldly approached [ROOT.GetCountry.GetRuler.GetName], asking [ROOT.GetCountry.GetRuler.GetHerHim] to set aside state funds in order to purchase a supply of myrrh at a discount rate. They want to raise a private fleet and sail it to the ports themselves, and if we help them and all goes well, then we will be able to double our money. What do you say?"
 zorgo_event.82.a: "We won't gamble with the treasury"
 zorgo_event.82.b: "No risk, no reward, right? Let's see what happens"
 zorgo_event.82.c: "Set aside a princely sum - we are going to be rich"

 zorgo_event.83.t: "Investment Opportunity:Bust"
 zorgo_event.83.desc: "Well, it's been well over a year since the trade ship with the discounted myrrh - this so-called 'amazing investment opportunity' that was presented to us - was supposed to return, so it is safe to say that it's never coming back.\n\nNeedless to say, any money that we invested was lost."
 zorgo_event.83.a: "I should have known! This always happens to me"

 zorgo_event.84.t: "Heavy Rains Near [ROOT.GetCountry.GetCapital.GetName]"
 zorgo_event.84.desc: "Although everyone is complaining about the near-constant rain, our farmers are thankful for the week-long storm that has been pouring over [ROOT.GetCountry.GetCapital.GetName]. We had been experiencing unseasonably warm weather, which in turn was causing the crops to wither and the fields to dry out - the rains have changed everything, however."
 zorgo_event.84.a: "Gods be praised!"

 zorgo_event.85.t: "The Sword Or The Bow?"
 zorgo_event.85.desc: "[ROOT.GetCountry.GetRuler.GetName] has been given the opportunity to train with [SCOPE.sCharacter('warrior_trainer').GetName], an impressive warrior who excels at all aspects of martial combat and is known to be a skilled teacher.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] must choose what the focus of this session will be."
 zorgo_event.85.a: "Show me a trick or two with the sword"
 zorgo_event.85.b: "I prefer attacking from a distance - the bow suits me"

 zorgo_event.86.t: "Investment Opportunity:Boom"
 zorgo_event.86.desc: "Unbelievable news! The investments we made have actually paid off, bringing [ROOT.GetCountry.GetName] a healthy profit - well done, [ROOT.GetCountry.GetRuler.GetName]. The ships laden down with myrrh arrived in our ports a few days ago, and already we have sold off most of the cargo...we have made our initial sum back, with a healthy profit to show for our troubles."
 zorgo_event.86.a: "How delightful!"

 zorgo_event.87.t: "Investment Opportunity:Boom"
 zorgo_event.87.desc: "Unbelievable news! The investments we made have actually paid off, bringing [ROOT.GetCountry.GetName] a healthy profit - well done, [ROOT.GetCountry.GetRuler.GetName]. The ships laden down with myrrh arrived in our ports a few days ago, and already we have sold off most of the cargo...we are making money hand over fist."
 zorgo_event.87.a: "What incredible news!"

 zorgo_event.88.t: "While I Have Your Ear..."
 zorgo_event.88.desc: "As [ROOT.GetCountry.GetName] prepares for an annual religious festival, [SCOPE.sCharacter('priest').GetName] has privately approached [ROOT.GetCountry.GetRuler.GetName], offering to meet with our [ROOT.GetCountry.GetRuler.GetTitleName] to privately pray together for the continued blessings of the gods.\n\n[SCOPE.sCharacter('priest').GetFirstName] is an erudite figure, one known for [SCOPE.sCharacter('priest').GetHerHis] intimate knowledge of sundry philosophies, and, after some deliberation, [ROOT.GetCountry.GetRuler.GetFirstName] has worked up the nerve to ask for a personal favor."
 zorgo_event.88.a: "Teach me how to understand the minds of men"
 zorgo_event.88.b: "I need to understand the ways of the gods..."

 zorgo_event.89.t: "A Day At The Races"
 zorgo_event.89.desc: "In an attempt to increase [ROOT.GetCountry.GetRuler.GetHerHis] popularity with the masses, [ROOT.GetCountry.GetRuler.GetName] has announced that a special chariot race will take place in one month's time in [ROOT.GetCountry.GetCapital.GetName].\n\nFree bread will be distributed to all that attend, and watered-down wine will be available for the low, low price of one coin per cup - the spectacle promises to be the event of the year."
 zorgo_event.89.a: "Come one, come all! Just remember who invited you"

 zorgo_event.90.t: "A Day At The Races:The Night Before"
 zorgo_event.90.desc: "It is the night before the big chariot race in [ROOT.GetCountry.GetCapital.GetName], and the bakeries all throughout the capital are filled with slaves that are churning out loaves for tomorrow. [ROOT.GetCountry.GetRuler.GetName] is personally supervising the preparations when a red-faced baker, his tunic covered in flour, comes up and wrings his hands.\n\n'We are expecting many more people tomorrow than we originally anticipated, and there's a chance that we are going to run out of bread. I'm sorry to ask you, but we need more supplies.'"
 zorgo_event.90.a: "We can't afford to pay for anything extravagant"
 zorgo_event.90.b: "Anything that the people want, they will have"

 zorgo_event.91.t: "A Day At The Races:Arrival Of The Horsemen"
 zorgo_event.91.desc: "As the sun rises over [ROOT.GetCountry.GetCapital.GetName], the city streets are already filled with hundreds of people, all clamoring to find the best seats left at the stadium in the heart of town. Although there is no permanent structure built in the [ROOT.GetCountry.GetAdjective] capital for horse races, the Forum has been cleared of merchant stalls and wooden benches have been built to accommodate the crowds.\n\nAs the country's best riders proudly march into the Forum, dressed in their finest regalia, a loud cheer ripples through the crowd."
 zorgo_event.91.a: "How exciting all of this is!"

 zorgo_event.92.t: "A Day At The Races:A Friendly Wager"
 zorgo_event.92.desc: "All is in place, moments away from the race beginning, when [ROOT.GetCountry.GetRuler.GetName] feels a light tap on [ROOT.GetCountry.GetRuler.GetHerHis] shoulder.\n\n'How would you like to make this event a little more interesting? I'll put up one hundred coins against yours...I have a feeling that my favored rider, Adonis, is going to win.'\n\nIt is [SCOPE.sCharacter('gambling_patriarch').GetName], a notorious gambler that is said to have crushing debts."
 zorgo_event.92.a: "I don't gamble, sorry..."
 zorgo_event.92.b: "I will match your wager; why not"

 zorgo_event.93.t: "A Day At The Races:A Friendly Wager"
 zorgo_event.93.desc: "The first event, a race between solitary riders, has finished, and although it was a nail-biter up until the last seconds, [ROOT.GetCountry.GetRuler.GetName]'s favored horseman won!\n\nSmirking to [ROOT.GetCountry.GetRuler.GetHerHim]self, [ROOT.GetCountry.GetRuler.GetFirstName] raises a fist into the air and screams in joy."
 zorgo_event.93.a: "I can't believe I won! This is amazing!"

 zorgo_event.94.t: "A Day At The Races:A Friendly Wager"
 zorgo_event.94.desc: "It goes without saying that [ROOT.GetCountry.GetRuler.GetName] chose literally the worst rider out of the lot, and [ROOT.GetCountry.GetRuler.GetFirstName] grits [ROOT.GetCountry.GetRuler.GetHerHis] teeth in anger as Adonis the Champion wins the event, galloping past all of the other riders to claim the crown of victory."
 zorgo_event.94.a: "Easy come, easy go...we will make more money one day"

 zorgo_event.95.t: "A Day At The Races:Conclusion"
 zorgo_event.95.desc: "The chariot race in [ROOT.GetCountry.GetCapital.GetName] will certainly go down in [ROOT.GetCountry.GetAdjective] history as one of the most action-packed events to ever take place in the capital; by all accounts, it was a complete success. The highlight was undoubtedly the final race, when Adonis the Champion lost control of his chariot, crashing in spectacular fashion before being trampled to death by a quadriga. All of the guests were impressed by the food and drink offered by the state, and the local merchants and innkeepers are ecstatic over the increased business. As the sun settles low on the horizon, bringing a conclusion to the event, an exhausted but exuberant [ROOT.GetCountry.GetRuler.GetFirstName] is still feeling the excitement of the day. "
 zorgo_event.95.a: "I can't wait to come back to the races!"

 zorgo_event.96.t: "Increased Tensions On The Border"
 zorgo_event.96.desc: "Our spies report that [aggressive_neighbor.GetName] has been amassing a large invasionary force and have been probing our borders - we should prepare our men, because it seems like we might have a war on our hands, very soon.\n\nThese tensions have sent prices skyrocketing in [ROOT.GetCountry.GetCapital.GetName], unfortunately, as everyone is wondering if they should be preparing for a siege."
 zorgo_event.96.a: "We aren't afraid of anyone, especially the [aggressive_neighbor.GetAdjective] dogs"

 zorgo_event.97.t: "Funding Highway Bandits"
 zorgo_event.97.desc: "We have obtained overwhelming evidence that [aggressive_neighbor.GetName] has been paying bandits to prowl upon our trade routes, attacking anyone and everyone that is headed into [ROOT.GetCountry.GetName]. It seems that they hope to disrupt our economy, hurting our tax incomes and making merchants scared to visit [ROOT.GetCountry.GetCapital.GetName].\n\nWhen we presented this information to their diplomats, there were fervent denials, but we don't believe the [aggressive_neighbor.GetAdjective] liars."
 zorgo_event.97.a: "Did you think we weren't going to find out? Do you take us for fools?"

 zorgo_event.98.t: "Foreign Gifts"
 zorgo_event.98.desc: "In a wise attempt to earn the friendship of the [ROOT.GetCountry.GetAdjective] people, the ruler of [friendly_neighbor.GetName], [friendly_neighbor.GetRuler.GetName] has sent us a gift and a hand-written note, praising our harmonious relations and asking that the status quo be maintained when it comes to the status of our borders."
 zorgo_event.98.a: "That was nice of them, but make no promises"

 zorgo_event.99.t: "An Opportunity To Worship Together"
 zorgo_event.99.desc: "We have received a message from [friendly_neighbor.GetName], asking if we would grace them with some official [ROOT.GetCountry.GetAdjective] representatives at a religious festival that they are having in their capital city of [friendly_neighbor.GetCapital.GetName]. The [friendly_neighbor.GetAdjective] people are celebrating their harvest, and because they have been overwhelmingly blessed this year, want to extend the bounty of their gods to everyone around them."
 zorgo_event.99.a: "How very kind of them...yes, we will go"

 zorgo_event.100.t: "Tearing Down Fortifications"
 zorgo_event.100.desc: "Our scouts report that the government of [friendly_neighbor.GetName] is having acute financial difficulties, and in a desperate attempt to save every coin possible, they have begun the process of dismantling some of their border fortifications.\n\nWhile their larger fortresses remain garrisoned, the auxillaries have all been sent back to their villages...which presents us with opportunities, if we are ruthless enough to pursue them."
 zorgo_event.100.a: "Inform our generals of this blessing, and see what they want to do"

 zorgo_event.101.t: "Going On A Hunt"
 zorgo_event.101.desc: "[ROOT.GetCountry.GetRuler.GetName] is hard at work at [ROOT.GetCountry.GetCapital.GetName], slowly drowning under a sea of important correspondences that needed to be addressed yesterday, when there is a firm knock on [ROOT.GetCountry.GetRuler.GetHerHis] door - it is [SCOPE.sCharacter('random_dude_hunter').GetName] and [SCOPE.sCharacter('random_dude_hunter_2').GetName], dressed in full hunting kit. Behind them in the courtyard, a scruffy pack of dogs are yapping and wrestling with each other, and there are about twenty people milling about, some on horseback but most standing on foot.\n\n'Apologies for disturbing you, [ROOT.GetCountry.GetRuler.GetFirstName], but some of us are leaving to head out into the countryside for a few days. The festival dedicated to #E [ROOT.GetCountry.Custom('get_harvest_goddess')]#! is almost here, and it is customary for us nobles to go hunting in honor of this sacred event. What do you say?'\n\nStaring down at the pile of work in front of [ROOT.GetCountry.GetRuler.GetHerHim], [ROOT.GetCountry.GetRuler.GetFirstName] stands up."
 zorgo_event.101.a: "Yes, that sounds wonderful - let us leave immediately"
 zorgo_event.101.b: "No, I am too busy to do this right now"

 zorgo_event.102.t: "Going On A Hunt:A Day In The Country"
 zorgo_event.102.desc_1: "Now that [ROOT.GetCountry.GetRuler.GetName] has agreed to join the hunt, it has been decided that the party will ride out to a hunting lodge that [SCOPE.sCharacter('random_dude_hunter').GetName] keeps near [SCOPE.sP('randomized_country_province').GetName].\n\nThe pace is kept leisurely, and there are ample opportunities for conversation on the road. [ROOT.GetCountry.GetRuler.GetFirstName] rides alongside [SCOPE.sCharacter('random_dude_hunter').GetName] and [SCOPE.sCharacter('random_dude_hunter_2').GetName], and the conversation runs the gamut of life experiences - childhood, marriage, battles fought and battles lost, the nature of the gods, the price of real estate in [ROOT.GetCountry.GetCapital.GetName] - anything and everything that can be discussed in polite society has been broached.\n\nWhen the party stops to make camp that evening, the discourse continues around a crackling fire, with wine and grilled meats keeping the atmosphere jovial. Despite knowing [SCOPE.sCharacter('random_dude_hunter').GetFirstName] and [SCOPE.sCharacter('random_dude_hunter_2').GetFirstName] for years, [ROOT.GetCountry.GetRuler.GetFirstName] can't remember the last time that [ROOT.GetCountry.GetRuler.GetSheHe] had such a lovely conversation."
 zorgo_event.102.desc_2: "Now that [ROOT.GetCountry.GetRuler.GetName] has agreed to join the hunt, it has been decided that the party will ride out to a hunting lodge that [SCOPE.sCharacter('random_dude_hunter').GetName] keeps near [SCOPE.sP('randomized_country_province').GetName].\n\nThere is a light rain falling, one that is more annoying than anything, and within moments everyone is soaked to their skin. Everyone bears this inconvenience stoically save [SCOPE.sCharacter('random_dude_hunter_2').GetName], who keeps cursing and casting dirty looks at [ROOT.GetCountry.GetRuler.GetFirstName]. Spitting loudly on the ground, [SCOPE.sCharacter('random_dude_hunter_2').GetFirstName] raises [SCOPE.sCharacter('random_dude_hunter_2').GetHerHis] arms to the skies and swears again. Turning to face [ROOT.GetCountry.GetRuler.GetFirstName], [SCOPE.sCharacter('random_dude_hunter_2').GetFirstName] points a finger and sneers.\n\n'Not a cloud in the sky when we left [ROOT.GetCountry.GetCapital.GetName], but now the heavens are pissing down on us - what have you done to anger [ROOT.GetCountry.Custom('get_harvest_goddess')]? Perhaps you should have stayed home...'\n\nEveryone gasps at this shocking breach of decorum."
 zorgo_event.102.desc_3: "Now that [ROOT.GetCountry.GetRuler.GetName] has agreed to join the hunt, it has been decided that the party will ride out to a hunting lodge that [SCOPE.sCharacter('random_dude_hunter').GetName] keeps near [SCOPE.sP('randomized_country_province').GetName].\n\nOn the second day of the journey, the party is forging a small stream next to a forest when a bit of crumbling stone in the woods catches [ROOT.GetCountry.GetRuler.GetFirstName]'s eye. Moving closer to investigate, it appears that the [ROOT.GetCountry.GetRuler.GetTitleName] has uncovered a shrine to a god, one that is covered in vines and clearly in a state of ruin. There are scattered pieces of marble and brick everywhere, and some of the pieces are scorched by fire.\n\n'I dare not guess what evil things occurred here.' [ROOT.GetCountry.GetRuler.GetFirstName] mutters grimly as everyone gathers around [ROOT.GetCountry.GetRuler.GetHerHim]. 'Yet I know that we are still within the borders of [ROOT.GetCountry.GetName], and the last time I checked, my word carries the weight of law. Dismount immediately, friends, for there is work to be done before we move on.'"
 zorgo_event.102.desc_4: "The party is barely a day's ride from [ROOT.GetCountry.GetCapital.GetName] when a party of riders, their mounts gasping and frothy with sweat, overtakes the hunters. The lead messenger looks relieved to have located the [ROOT.GetCountry.GetRuler.GetTitleName].\n\n'Hail [ROOT.GetCountry.GetRuler.GetName]! There are matters at the capital that require your personal touch - you must return immediately.'\n\nEveryone looks disappointed, but there is no chance that [ROOT.GetCountry.GetRuler.GetFirstName] will be able to go. Turning towards [ROOT.GetCountry.GetRuler.GetHerHis] men with a wistful look, [ROOT.GetCountry.GetRuler.GetFirstName] waves a sad farewell and begins the journey back home."
 zorgo_event.102.a: "I never knew that you two were so interesting..."
 zorgo_event.102.b: "I am surprised you are speaking so freely - I will remember this"
 zorgo_event.102.c: "Let us restore the shrine for [ROOT.GetCountry.Custom('get_harvest_goddess')]"
 zorgo_event.102.d: "Of course this happens to me...maybe next time"
 zorgo_event.102.e: "Perhaps you are right! This is foul weather indeed"

 zorgo_event.103.t: "Going On A Hunt:Morning At Camp"
 zorgo_event.103.desc_1: "After a week of traveling, everyone has arrived at [SCOPE.sCharacter('random_dude_hunter').GetName]'s hunting lodge, and the excitement in the air is palpable - everyone admits that life has been stressful lately in [ROOT.GetCountry.GetCapital.GetName], and this trip is a golden opportunity for everyone to relax and have a good time. The hunters make camp and settle down for the evening, agreeing to breakfast before the sunrise so that the hunt can coincide with the morning light.\n\nOf course, this was decided before [ROOT.GetCountry.GetRuler.GetName] pulled out a jug of strong [ROOT.GetCountry.GetAdjective] wine around the campfire. The bottle was passed until it was drained, and then another, and then another, were produced, each meeting a similar fate to the first. Raucous laughter fills the camp and stories are swapped throughout the night. \n\nThe sun was barely peeking over the horizon when [ROOT.GetCountry.GetRuler.GetFirstName] crawled off to bed dead drunk, stuffing bits of grass in [ROOT.GetCountry.GetRuler.GetHerHis] ears to shut out the morning birdsong."
 zorgo_event.103.desc_2: "After a week of traveling, everyone has arrived at [SCOPE.sCharacter('random_dude_hunter').GetName]'s hunting lodge, and the excitement in the air is palpable - everyone admits that life has been stressful lately in [ROOT.GetCountry.GetCapital.GetName], and this trip is a golden opportunity for everyone to relax and have a good time. The hunters make camp and settle down for the evening, agreeing to breakfast before the sunrise so that the hunt can coincide with the morning light.\n\n[ROOT.GetCountry.GetRuler.GetName] is the first to wake, feeling well rested, and wastes no time in rousing the others. Before long, the campfires have been stamped out, scraps of bread and cold meat have been quickly eaten, and the hunters depart into the forest."
 zorgo_event.103.desc_3: "After a week of traveling, everyone has arrived at [SCOPE.sCharacter('random_dude_hunter').GetName]'s hunting lodge, and the excitement in the air is palpable - everyone admits that life has been stressful lately in [ROOT.GetCountry.GetCapital.GetName], and this trip is a golden opportunity for everyone to relax and have a good time. The hunters make camp and settle down for the evening, agreeing to breakfast before the sunrise so that the hunt can coincide with the morning light.\n\nUnfortunately for everyone, the rains that began outside of the capital seem to have followed the party, and [ROOT.GetCountry.GetRuler.GetName] is unable to get good sleep because of the steady drizzling. Stepping outside of [ROOT.GetCountry.GetRuler.GetHerHis] tent after a restless night, [ROOT.GetCountry.GetRuler.GetFirstName] coughs raggedly, [ROOT.GetCountry.GetRuler.GetHerHis] entire body shaking."
 zorgo_event.103.desc_4: "After a week of traveling, everyone has arrived at [SCOPE.sCharacter('random_dude_hunter').GetName]'s hunting lodge, and the excitement in the air is palpable - everyone admits that life has been stressful lately in [ROOT.GetCountry.GetCapital.GetName], and this trip is a golden opportunity for everyone to relax and have a good time. The hunters make camp and settle down for the evening, agreeing to breakfast before the sunrise so that the hunt can coincide with the morning light.\n\nDawn finds [ROOT.GetCountry.GetRuler.GetName] stringing [ROOT.GetCountry.GetRuler.GetHerHis] bow when there is a loud rustling from the woods - quickly drawing an arrow and spinning around, [ROOT.GetCountry.GetRuler.GetFirstName] is surprised to see a group of soldiers dressed in [ROOT.GetCountry.GetAdjective] clothing leaving the forest.\n\n'Thank the gods that we found you, [ROOT.GetCountry.GetRuler.GetFirstName] - we have been tracking your party for a week now. You must return to [ROOT.GetCountry.GetCapital.GetName] at once, for there has been a terrible accident - your primary heir, [SCOPE.sCharacter('zorgo_event_103_heir').GetName], was grievously wounded.'"
 zorgo_event.103.a: "Just give me...hic...a few hours and I'll be ready"
 zorgo_event.103.b: "And away we go!"
 zorgo_event.103.c: "I'm starting to feel poorly...ugh"
 zorgo_event.103.d: "We must return home immediately - we ride for [ROOT.GetCountry.GetCapital.GetName]!"


 zorgo_event.104.t: "Going On A Hunt:Deep In The Forest"
 zorgo_event.104.desc_1: "In the end, the only thing that [ROOT.GetCountry.GetRuler.GetName] would end up bringing home were more stories to be shared - it seems that [ROOT.GetCountry.Custom('get_harvest_goddess')] did not see fit to bless [ROOT.GetCountry.GetRuler.GetHerHim] with a successful hunt today.\n\nStill, it wasn't a waste of time entirely and none of the other hunters fared any better, and everyone was cracking jokes back at camp about their bum luck. Soon, a roaring fire was filling the air with a crackling sound, and the hunters took turns describing the stags they had seen at the edge of fields, nimbly leaping away, or the bears lumbering through the brush. As the tales of bravado and daring increased, the laughter and revelry lasted long into the night."
 zorgo_event.104.desc_2: "[ROOT.GetCountry.GetRuler.GetName] spent the better part of the day crawling through the thick and tangled brush of the backcountry, with nothing to show for the countless hours spent out deep in the forest. Laughably, [ROOT.GetCountry.GetRuler.GetSheHe] even managed to somehow get separated from the others and quickly became lost - dusk was turning into night before [ROOT.GetCountry.GetRuler.GetFirstName] managed to reconnect with the rest of the hunters, who were desperately searching for the [ROOT.GetCountry.GetRuler.GetTitleName].\n\nIrritated beyond words, [ROOT.GetCountry.GetRuler.GetFirstName] gave the order to pack up and head home immediately."
 zorgo_event.104.desc_3: "Everyone who was there can attest that [ROOT.GetCountry.Custom('get_harvest_goddess')] was truly with [ROOT.GetCountry.GetRuler.GetName] that day, for no one else was as lucky when it came to tracking and finding animals in the dark forests of [SCOPE.sP('randomized_country_province').GetName]. [ROOT.GetCountry.GetRuler.GetFirstName] was able to bring down a large deer, and if not for [ROOT.GetCountry.GetRuler.GetHerHis] fortunate aim, then no one would have had anything fresh to eat for dinner that night.\n\nHours later, with bellies filled with roasted stag and strong [ROOT.GetCountry.GetAdjective] wine, the hunters begin to praise their leader, offering toasts to [ROOT.GetCountry.GetRuler.GetFirstName]'s long rule over [ROOT.GetCountry.GetName]."
 zorgo_event.104.desc_4: "There is a loud, anguished bellow from the deer as [ROOT.GetCountry.GetRuler.GetName]'s arrow sinks deep into its back, and the giant animal staggers and falls to the ground. Rushing over, [ROOT.GetCountry.GetRuler.GetFirstName] delivers a killing blow and begins to yell for the others, laughing at the size of the creature that [ROOT.GetCountry.GetRuler.GetSheHe] just felled.\n\nThe stag is gigantic, with a thick, shaggy coat that has seen many winters, and horns that are easily the length of a tall man. When the others see what [ROOT.GetCountry.GetRuler.GetFirstName] has accomplished, they will be secretly envious, every man wishing that he had been blessed by [ROOT.GetCountry.Custom('get_harvest_goddess')] and gifted such a boastworthy prize."
 zorgo_event.104.desc_5: "[ROOT.GetCountry.GetRuler.GetName] has been waiting for hours near a lake, eyes scanning the horizon for any sign of life, but there hasn't been a single animal that has come nearby all day. As the sun travels across the sky, [ROOT.GetCountry.GetRuler.GetFirstName] grows more and more irritated, cursing [ROOT.GetCountry.GetRuler.GetHerHis] dumb luck.\n\nThe hunt ends in failure, and, disappointed, [ROOT.GetCountry.GetRuler.GetSheHe] heads back to camp."
 zorgo_event.104.desc_6: "[ROOT.GetCountry.GetRuler.GetName] is crawling through some bushes when [ROOT.GetCountry.GetRuler.GetSheHe] suddenly hears a loud roar - a bear! There is no time to draw a weapon before the animal grabs ahold of [ROOT.GetCountry.GetRuler.GetFirstName]'s leg, and within moments, the [ROOT.GetCountry.GetRuler.GetTitleName] of [ROOT.GetCountry.GetName] is in a desperate fight for [ROOT.GetCountry.GetRuler.GetHerHis] life.\n\nThe only reason that [ROOT.GetCountry.GetRuler.GetFirstName] survived was because the other hunters heard [ROOT.GetCountry.GetRuler.GetHerHis] screaming and rushed over, but everyone can see that [ROOT.GetCountry.GetRuler.GetSheHe] is badly injured."
 zorgo_event.104.desc_7: "When [ROOT.GetCountry.GetRuler.GetName] wakes up in camp later that evening, [ROOT.GetCountry.GetRuler.GetHerHis] head is bandaged and [ROOT.GetCountry.GetRuler.GetSheHe] has no memories of the day. It is [SCOPE.sCharacter('random_dude_hunter').GetName] who has to tell [ROOT.GetCountry.GetRuler.GetFirstName] what happened.\n\n'You fell off of your horse, my [ROOT.GetCountry.GetRuler.GetTitleName], and really bumped your head quite hard - praise be to [ROOT.GetCountry.Custom('get_harvest_goddess')] that you woke, for we thought you might not.'"
 zorgo_event.104.desc_8: "It has been hours since [ROOT.GetCountry.GetRuler.GetName] has last seen anyone else - [ROOT.GetCountry.GetRuler.GetSheHe] is so deep in the woods that the canopy of the trees blocks the sunlight out entirely. The lonesome cry of a lone wolf in the distance hangs in the air, and a chill runs down [ROOT.GetCountry.GetRuler.GetFirstName]'s spine when [ROOT.GetCountry.GetRuler.GetSheHe] discovers a small hut in the gloomy darkness.\n\nApproaching the door with hand on hilt, [ROOT.GetCountry.GetRuler.GetFirstName] is greeted by an old crone, her eyes covered in bandages. Raising a shriveled hand, she cackles a toothless grin. 'I was expecting you, [ROOT.GetCountry.GetRuler.GetName]. Give me one hundred coins and I will bless you in the name of [ROOT.GetCountry.Custom('get_harvest_goddess')].'"
 zorgo_event.104.desc_9: "So far, [ROOT.GetCountry.GetRuler.GetName] has been unable to catch anything, spending more time retrieving arrows that missed their target than anything else. The day is starting to look like a bust, but despite this disappointing outcome, [ROOT.GetCountry.GetRuler.GetFirstName] is in a decent mood as [ROOT.GetCountry.GetRuler.GetSheHe] heads back to camp.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] is walking through a shaded ravine when [ROOT.GetCountry.GetRuler.GetSheHe] makes a startling discovery - there, in a patch of sunlight, is the glimmer of gold! There is a broken amphora here with a small fortune."
 zorgo_event.104.desc_10: "[ROOT.GetCountry.GetRuler.GetName] has never seen anything like it before in [ROOT.GetCountry.GetRuler.GetHerHis] life - there, at the edge of the lake, a white stag is drinking, its back turned to the hunter.\n\nReaching into [ROOT.GetCountry.GetRuler.GetHerHis] quiver, [ROOT.GetCountry.GetRuler.GetFirstName] gently nocks an arrow, and with a prayer to [ROOT.GetCountry.Custom('get_harvest_goddess')] on [ROOT.GetCountry.GetRuler.GetHerHis] lips, the missile is loosened.\n\nSeconds later, the majestic beast falls dead to the ground - [ROOT.GetCountry.GetRuler.GetName]'s arrow struck true. Walking over to the animal, [ROOT.GetCountry.GetRuler.GetFirstName] offers another prayer of thanksgiving."
 zorgo_event.104.desc_11: "[ROOT.GetCountry.GetRuler.GetName] is running at full speed, [ROOT.GetCountry.GetRuler.GetHerHis] breath escaping in violent bursts - behind [ROOT.GetCountry.GetRuler.GetHerHim], a pack of starving wolves is in hot pursuit and it seems that they are about to catch their prey.\n\nThe ground suddenly gives way, and [ROOT.GetCountry.GetRuler.GetFirstName] finds [ROOT.GetCountry.GetRuler.GetHerHim]self tumbling down into a ravine, down towards the edge of a cliff. There is the snap of jaws overhead and angry howls, and the wolves leap down.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] rushes towards the precipice, already knowing what has to be done. A few seconds later, [ROOT.GetCountry.GetRuler.GetFirstName] is soaring through the air like a graceless bird, splashing into the river below after what seemed like an eternity. High above, the wolves howl in frustration as [ROOT.GetCountry.GetRuler.GetFirstName] floats away from the danger, breathless and terrified but alive."
 zorgo_event.104.desc_12: "Everyone has gathered back in the camp after a successful outing, and talk inevitably turns to who was the luckiest and best of the hunters.\n\nBy everyone's reckoning, [ROOT.GetCountry.GetRuler.GetName] came out on top, having taken three stags - it seems that [ROOT.GetCountry.Custom('get_harvest_goddess')] wanted the [ROOT.GetCountry.GetRuler.GetTitleName] to have the lion's share of glory today."
 zorgo_event.104.desc_13: "Everyone in camp is in a grim mood, eating in their tents alone - after the day's tragic events, who can blame them?\n\nUnfortunately for [ROOT.GetCountry.GetRuler.GetName], it seems that [ROOT.GetCountry.Custom('get_harvest_goddess')] wanted to punish the [ROOT.GetCountry.GetRuler.GetTitleName], for there could be no logical explanation for what happened. A pack of wolves set upon [ROOT.GetCountry.GetRuler.GetFirstName], savagely attacking [ROOT.GetCountry.GetRuler.GetHerHis] face and nearly mauling [ROOT.GetCountry.GetRuler.GetHerHim].\n\n[ROOT.GetCountry.GetRuler.GetFirstName] survived the attack, but not without losing [ROOT.GetCountry.GetRuler.GetHerHis] eyes..."
 zorgo_event.104.desc_14: "[ROOT.GetCountry.GetRuler.GetName] is quietly following a stag, arrow drawn and focus entirely on the animal in front of [ROOT.GetCountry.GetRuler.GetHerHim]. A few feet behind [ROOT.GetCountry.GetRuler.GetFirstName], [SCOPE.sCharacter('random_dude_hunter').GetName] is following, and the only sound in the forest is the busy murmuring of a small creek.\n\nThe stag, unaware of the mortal danger it is in, is lapping water from the stream calmly, and [ROOT.GetCountry.GetRuler.GetFirstName] crouches over, a few moments away from firing at [ROOT.GetCountry.GetRuler.GetHerHis] prey.\n\nWithout warning, there is a flash of steel and a sharp pain, and all is dark."
 zorgo_event.104.a: "You didn't kill two bears, [SCOPE.sCharacter('random_dude_hunter').GetFirstName]! You're full of it"
 zorgo_event.104.b: "What a waste of time this turned out to be"
 zorgo_event.104.c: "I will live every day with the [ROOT.GetCountry.GetAdjective] people's wellbeing in mind"
 zorgo_event.104.d: "That wasn't luck - what you saw is skill, my friends"
 zorgo_event.104.e: "So it goes sometimes..."
 zorgo_event.104.f: "Water...cough...someone bring me water"
 zorgo_event.104.g: "Good gods, that was a close one!"
 zorgo_event.104.h: "Give me your blessing, and then I am on my way"
 zorgo_event.104.i: "What an unbelievable find!"
 zorgo_event.104.j: "What a glorious prize you have gifted to your servant - I thank you"
 zorgo_event.104.k: "Phew...that was close"
 zorgo_event.104.l: "Maybe next time, everyone else will do better"
 zorgo_event.104.m: "This is a tragedy, a disaster!"
 zorgo_event.104.n: "How could this happen..."

 zorgo_event.105.t: "Going On A Hunt:Returning Home"
 zorgo_event.105.desc_1: "Everyone was in a decent mood riding back home to [ROOT.GetCountry.GetCapital.GetName], enjoying a few moments of silence as they made their way along the roads, and before long, the gates of the capital were visible in the distance."
 zorgo_event.105.desc_2: "The trip back home to [ROOT.GetCountry.GetCapital.GetName] was uneventful, if not somewhat enjoyable - the weather was pleasant on the way, and the locals in [SCOPE.sP('randomized_country_province').GetName] came out to wave and cheer when [ROOT.GetCountry.GetRuler.GetName] passed by their villages.\n\n[ROOT.GetCountry.GetRuler.GetFirstName], who was feeling cheerful and upbeat that evening, was more than happy to play up the part of a [ROOT.GetCountry.GetRuler.GetTitleName], taking the time to greet the citizens of [ROOT.GetCountry.GetName] as [ROOT.GetCountry.GetRuler.GetSheHe] rode by. It was the perfect way to end the hunting excursion, and a gentle way for [ROOT.GetCountry.GetRuler.GetFirstName] to begin easing back into [ROOT.GetCountry.GetRuler.GetHerHis] official duties."
 zorgo_event.105.desc_3: "As the party was headed home to [ROOT.GetCountry.GetCapital.GetName], the conversation between [SCOPE.sCharacter('random_dude_hunter_2').GetName] and [ROOT.GetCountry.GetRuler.GetName] turned to matters of governance, for it is no secret that [SCOPE.sCharacter('random_dude_hunter_2').GetFirstName] is interested in all things pertaining to running the [ROOT.GetCountry.GetAdjective] state.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] was more than happy to indulge the request for detailed conversation, and those watching the two discuss could see the bonds of friendship growing stronger between them."
 zorgo_event.105.desc_4: "Everything was going well on the return trip to [ROOT.GetCountry.GetCapital.GetName] until night fell, and with the capital being so close, everyone's guard was down and no one was really paying attention.\n\nWithout warning, a party of bandits fell upon the hunters, and although the warriors overcame the robbers and drove them off, it was at a great cost - there, lying in the street covered in blood, was the body of [SCOPE.sCharacter('random_dude_hunter').GetName]."
 zorgo_event.105.a: "Home again at last - thanks for inviting me, lads"
 zorgo_event.105.b: "I am blessed beyond measure to have such loyal and loving countrymen"
 zorgo_event.105.c: "If you ever have any other questions, [SCOPE.sCharacter('random_dude_hunter_2').GetFirstName], feel free to ask"
 zorgo_event.105.d: "Oh no...this can't be!"

 zorgo_event.106.t: "Going On A Hunt:Conclusion"
 zorgo_event.106.desc: "[ROOT.GetCountry.GetRuler.GetName] has returned back to [ROOT.GetCountry.GetCapital.GetName], and within a few days, all of polite society has heard about everything that happened on the trip - but this is to be expected, of course. Still, despite the wagging tongues of gossiping hunters, [ROOT.GetCountry.GetRuler.GetFirstName] isn't too upset, and is in a magnanimous mood as [ROOT.GetCountry.GetRuler.GetHerHis] slaves began to heat up water.\n\nAn hour or so later, [ROOT.GetCountry.GetRuler.GetFirstName] is enjoying a hot bath and a glass of wine in [ROOT.GetCountry.GetRuler.GetHerHis] private chambers, musing over the events of the last month."
 zorgo_event.106.a: "I should thank [ROOT.GetCountry.Custom('get_harvest_goddess')] for bringing me home safely"

 zorgo_event.107.t: "Diplomats Attacked"
 zorgo_event.107.desc: "[ROOT.GetCountry.GetRuler.GetName], we regret to inform you that some messengers that we sent out from [ROOT.GetCountry.GetName] were attacked by bandits on the road leading out from [ROOT.GetCountry.GetCapital.GetName].\n\nThankfully, our diplomats survived the attack, but they are understandably terrified of traveling now."
 zorgo_event.107.a: "This is frustating..."

 zorgo_event.108.t: "Master Of Diplomacy"
 zorgo_event.108.desc: "Everyone acknowledges that [ROOT.GetCountry.GetRuler.GetName] is an undisputed master of negotiation, able to bend the ears of diplomats to get our [ROOT.GetCountry.GetRuler.GetHerHis] way. Truly, our [ROOT.GetCountry.GetName] has never before had such a skillful statesman as a leader."
 zorgo_event.108.a: "I live but to serve the people"

 zorgo_event.109.t: "Paying Old Debts"
 zorgo_event.109.desc: "We are pleased to tell you that we received some back taxes that were owed to us.\n\nWhile we regret that it took so long to receive what is rightfully ours, at least our citizens are mindful of what they owe to the [ROOT.GetCountry.GetAdjective] state."
 zorgo_event.109.a: "Better late than never, they say..."

 zorgo_event.110.t: "The Talk of [ROOT.GetCountry.GetCapital.GetName]"
 zorgo_event.110.desc: "The Festival dedicated to [ROOT.GetCountry.Custom('get_harvest_goddess')], which takes place in [ROOT.GetCountry.GetCapital.GetName] every five years, has drawn to a close, and those who traveled to the capital for the celebrations have been praising the generosity of [ROOT.GetCountry.GetRuler.GetName] nonstop.\n\nThe harvests were spectacular this year, and the bounty of our fields was shared with everyone. Our people return home with their hearts and stomachs full, praising the gods and the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle]."
 zorgo_event.110.a: "I look forward to this event every year"

 zorgo_event.111.t: "Holy Well Water Shortage"
 zorgo_event.111.desc: "[ROOT.GetCountry.GetRuler.GetName], we have received a disturbing report - it seems that the water that is in our holy wells near [ROOT.GetCountry.GetCapital.GetName] are drying up.\n\nThis is a terrible omen for the [ROOT.GetCountry.GetAdjective] people, and word is quickly spreading about what is happening...I am sorry. It seems that we have incurred some divine displeasure somehow."
 zorgo_event.111.a: "We must pray and wait to see what happens"

 zorgo_event.112.t: "Overflowing Holy Wells"
 zorgo_event.112.desc: "My [ROOT.GetCountry.GetRulerTitle], you will not believe what is happening near [ROOT.GetCountry.GetCapital.GetName]! It seems that the holy wells that are so dear to our people are overflowing - the water cannot be contained, and it gushes without unceasing.\n\nThe people are overjoyed! We have never had such a thing happen before in [ROOT.GetCountry.GetName] - what could this possibly mean?"
 zorgo_event.112.a: "This is a sign that what I am doing is right"

 zorgo_event.113.t: "Damaged Nuraghe Needs Repair"
 zorgo_event.113.desc: "The locals near [ROOT.GetCountry.GetCapital.GetName] are reporting that the nuraghe closest to the capital is showing visible signs of disrepair, with larger cracks threatening to permanently damage the structure.\n\nIt has been requested that [ROOT.GetCountry.GetRuler.GetName] do anything and everything that [ROOT.GetCountry.GetRuler.GetSheHe] can to fix this problem - it is viewed as a sign of disrespect to [ROOT.GetCountry.Custom('get_harvest_goddess')] if we leave this matter unattended."
 zorgo_event.113.a: "Of course we are going to take care of this!"
 zorgo_event.113.b: "We don't have the budget for this, I'm afraid"

 zorgo_event.114.t: "A Visit To The Temple Of Sid Addir"
 zorgo_event.114.desc: "It has been proposed that [ROOT.GetCountry.GetRuler.GetName] pay a visit to the temple of #E Sid Addir#!, the god of the warrior and protector of the farms. Sid Addir must receive the offerings of the [ROOT.GetCountry.GetAdjective] people in order to ensure that we are blessed in the years ahead.\n\nSuch an important responsibility belongs to [ROOT.GetCountry.GetRuler.GetFirstName], and all eyes are on [ROOT.GetCountry.GetRuler.GetHerHim]."
 zorgo_event.114.a: "It is my duty to go, and I look forward to it - we leave at dawn"
 zorgo_event.114.b: "I am unfortunately too busy right now and have no time for this"

 zorgo_event.115.t: "The Temple of Sid Addir"
 zorgo_event.115.desc: "After a short week of traveling, [ROOT.GetCountry.GetRuler.GetName] has finally reached the temple of Sid Addir, one of the most ancient and holy places in all of [ROOT.GetCountry.GetName].\n\nAfter ritually purifying [ROOT.GetCountry.GetRuler.GetHerHim]self, the [ROOT.GetCountry.GetRulerTitle] entered the shrine to Sid Addir and remained for hours in silent contemplation.\n\nAs the sun was beginning to hide behind the treeline in the distance, [ROOT.GetCountry.GetRuler.GetFirstName] emerged from the temple to find a few priests outside, their presence intentional and immediately understood."
 zorgo_event.115.a: "We shall leave a votive offering and ask for blessings"
 zorgo_event.115.b: "At this moment, we cannot afford to leave a gift here"

 zorgo_event.116.t: "One's Circles Disturbed"
 zorgo_event.116.desc: "When sacking [GetProvince('(int32)84').GetName] some of our sooldiers happened upon an old man, drawing somy symbols in the sand and intently cried 'do not disturb my circles'. Some say it was Archimedes, a genius mathematician, yet others doubt it. Still, it seemed interesting enough for our soldiers to remember it at the end of the day."
 zorgo_event.116.a: "Quick, write it all down."

 zorgo_event.117.t: "The Rape of Rome"
 zorgo_event.117.desc: "Generations ago, the Romans stole our women treacherously. Today, the city has fallen to our men and many have started looting the place already. Some of them have approached us and demand that we take the descendants of our women back home to [ROOT.GetCountry.GetCapital.GetName]. Others, however, argue that it has been too long and that their descendants are now Roman."
 zorgo_event.117.a: "Take our women back!"
 zorgo_event.117.b: "They have become Roman and are no Sabines."

 zorgo_event.118.t: "Scholar of the Divine"
 zorgo_event.118.desc: "[ROOT.GetCountry.GetRuler.GetName], we have received a report from a local magistrate that you should hear about; last week, our border guards encountered a famous sadhu that was leaving [ROOT.GetCountry.GetCapital.GetName] on a pilgrimage to the [GetCountry('MRY').GetAdjective] holy sites, followed by a crowd of hundreds of people.\n\nThis wanderer, a sage named [SCOPE.sCharacter('izn_divine_scholar').GetName] that is known all throughout [ROOT.GetCountry.GetName] for his piety, is said to be leaving [ROOT.GetCountry.GetCapital.GetName] to study the many religions of [ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName] in hopes of gleaning a universal truth, but there is a slight problem; [SCOPE.sCharacter('izn_divine_scholar').GetFirstName] is much loved by the citizens in our capital and a spirit of sadness has overtaken them, for they do not wish to see the wise man depart from our country.\n\n[ROOT.GetCountry.GetRuler.GetFirstName], perhaps you have something to say about the matter?"
 zorgo_event.118.a: "Ask Izn to join my court, for we should all learn from his wisdom"
 zorgo_event.118.b: "Perhaps this wise man will teach me something before he leaves?"
 zorgo_event.118.c: "Arrest him if he tries to leave the borders"

 zorgo_event.121.t: "The Cost Of Cannibalism"
 zorgo_event.121.desc_1: "Over the last few days, [ROOT.GetCountry.GetRuler.GetName]'s stomach has been bothering [ROOT.GetCountry.GetRuler.GetHerHim], forcing the [ROOT.GetCountry.GetRulerTitle] to retire to [ROOT.GetCountry.GetRuler.GetHerHis] bedchambers and remain within arm's reach of a chamber pot."
 zorgo_event.121.desc_2: "As of late, [ROOT.GetCountry.GetRuler.GetName] has been overindulging in human flesh, gorging [ROOT.GetCountry.GetRuler.GetHerHim]self at the sacrifices that have been taking place at [ROOT.GetCountry.GetCapital.GetName] and becoming known far and wide throughout [ROOT.GetCountry.GetName] as a zealous cannibal.\n\nAnd so, when the [ROOT.GetCountry.GetRulerTitle] was stricken down by a strange illness a few days after the last ceremony concluded, many living within the [ROOT.GetCountry.GetAdjective] capital blamed the gluttunous behaviors of [ROOT.GetCountry.GetRuler.GetFirstName] for bringing this calamity upon [ROOT.GetCountry.GetRuler.GetHerHim]self. [ROOT.GetCountry.GetRuler.GetFirstName] must have eaten someone that was sick with an illness, infecting [ROOT.GetCountry.GetRuler.GetHerHim]self in the process."
 zorgo_event.121.desc_3: "In a disgusting display of opulence that is unbecoming of a [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName] has contracted gout as a result of [ROOT.GetCountry.GetRuler.GetHerHis] aristocratic lifestyle. Everyone knows that the [ROOT.GetCountry.GetRuler.GetSheHe] is a gourmand, savoring the pleasures of the flesh over all others, but as of late, these appetites have grown out of control.\n\nIt is said that the larders within [ROOT.GetCountry.GetRuler.GetFirstName]'s are filled with all sorts of delicacies imported from abroad; delicious dates @dates! from far to the south, sweet wines @wine! imported by Hellenic traders, and succulent spices @spices! that can only be found in distant #E India#! are all kept under lock and key. And not only does [ROOT.GetCountry.GetRuler.GetFirstName] feast upon cheeses and roasted meat at every meal, but [ROOT.GetCountry.GetRuler.GetSheHe] is known to consume human flesh prepared in elaborate ways regularly, demanding that the slaves working in the kitchens of [ROOT.GetCountry.GetCapital.GetName] concoct culinary horrors in order to satiate [ROOT.GetCountry.GetRuler.GetHerHis] greed."
 zorgo_event.121.desc_4: "When [ROOT.GetCountry.GetRuler.GetName] first became ill, the gods made their displeasure towards the [ROOT.GetCountry.GetRulerTitle] clear through omens; for months, the milk of our herd animals tasted of sulfur, and the skies were emptied of their clouds, causing a drought throughout [ROOT.GetCountry.GetName] that terrified the farmers of the [ROOT.GetCountry.GetAdjective]s.\n\n[ROOT.GetCountry.GetRuler.GetFirstName]'s zeal for eating human flesh had become something of a mania lately, and countless prisoners had been dragged screaming from the dungeons of [ROOT.GetCountry.GetCapital.GetName] towards the dinner table of the cruel [ROOT.GetCountry.GetRulerTitle]. Rumors of the tyrannical appetites of [ROOT.GetCountry.GetRuler.GetFirstName] filled the local tribesmen with dread, and many were secretly pleased to hear that [ROOT.GetCountry.GetRuler.GetSheHe] was sick."
 zorgo_event.121.desc_5: "[ROOT.GetCountry.GetRuler.GetName] must have eaten someone that was infected with a disease, because the [ROOT.GetCountry.GetRulerTitle] has been feeling especially unwell lately - a ragged cough has been making [ROOT.GetCountry.GetRuler.GetHerHis] life miserable, and none of the cures suggested by the Apothecary have been helping.\n\nAlthough [ROOT.GetCountry.GetRuler.GetSheHe] bravely tried to go about [ROOT.GetCountry.GetRuler.GetHerHis] duties at [ROOT.GetCountry.GetCapital.GetName] in spite of [ROOT.GetCountry.GetRuler.GetHerHis] ailments, the chest cold became worse over the next few days and forced [ROOT.GetCountry.GetRuler.GetHerHim] into unwilling bedrest."
 zorgo_event.121.desc_6: "[ROOT.GetCountry.GetRuler.GetName] has been very careless lately and must have eaten a sacrificial victim that was infected with some sort of debilitating skin disease. It came as an awful surprise, then, when the [ROOT.GetCountry.GetRulerTitle] woke up one morning to discover a strange rash on [ROOT.GetCountry.GetRuler.GetHerHis] arm that sent the household into a frenzy."
 zorgo_event.121.desc_7: "[ROOT.GetCountry.GetRuler.GetName] cannot take ten steps without being forced to use a chamber pot; [ROOT.GetCountry.GetRuler.GetHerHis] bowels are constantly emptying, and [ROOT.GetCountry.GetRuler.GetSheHe] is having a tough time keeping water down without getting violently ill. It seems that the [ROOT.GetCountry.GetRulerTitle] has contracted some sort of illness, perhaps as a result of [ROOT.GetCountry.GetRuler.GetHerHis] appetite for human flesh."
 zorgo_event.121.desc_8: "At first, [ROOT.GetCountry.GetRuler.GetName] refused to believe [ROOT.GetCountry.GetRuler.GetHerHis] own eyes, but as the days and weeks progressed, it became impossible to ignore - [ROOT.GetCountry.GetRuler.GetFirstName] was infected with the plague."
 zorgo_event.121.desc_9: "[ROOT.GetCountry.GetRuler.GetName] woke up one morning to find [ROOT.GetCountry.GetRuler.GetHerHis] stomach and swollen face covered in a painful rash. Healers were sent for immediately, but they were only able to confirm that [ROOT.GetCountry.GetRuler.GetFirstName] had contracted the pox; none of their ointments or poultices were able to draw out the sickness from [ROOT.GetCountry.GetRuler.GetFirstName]'s fevered flesh." 
 zorgo_event.121.desc_10: "Over the last few years, [ROOT.GetCountry.GetRuler.GetName] has earned a reputation for being a lover of eating human flesh, going far beyond what is considered to be normal behavior within [ROOT.GetCountry.GetAdjective] society, where such activities are usually not frowned upon.\n\nIt is said that [ROOT.GetCountry.GetRuler.GetFirstName] punishes [ROOT.GetCountry.GetRuler.GetHerHis] disobedient slaves by roasting them over coals, and it is believed that the [ROOT.GetCountry.GetRulerTitle] dines on terrible dishes prepared in this manner every day, eschewing the hunt and gorging instead on meat and wine."
 zorgo_event.121.a: "I must have eaten something that disagreed with me..."
 zorgo_event.121.b: "Ugh...I don't feel so good..."
 zorgo_event.121.c: "Gods curse everything - my foot feels like it is on fire!"
 zorgo_event.121.d: "This is the worst that I have ever felt..."
 zorgo_event.121.e: "I can't believe how awful I feel right now"
 zorgo_event.121.f: "Could this be...leprosy? No, the gods wouldn't allow this!"
 zorgo_event.121.g: "May the gods have mercy on me!"
 zorgo_event.121.h: "I must have eaten some tainted meat..."
 zorgo_event.121.i: "I swear to the gods that I will never eat human meat again!"
 zorgo_event.121.j: "I will eat everyone living within [ROOT.GetCountry.GetName] if I want!"

 zorgo_event.124.t: "Devastating Sickness"
 zorgo_event.124.desc: "[ROOT.GetCountry.GetRuler.GetName] awoke this morning with terrible abdominal pains and was barely able to make it over to [ROOT.GetCountry.GetRuler.GetHerHis] chamber pot before getting violently ill. The next hours were spent on hands and knees as the [ROOT.GetCountry.GetRulerTitle] whimpered softly in pain, unable to move as bouts of explosive diarrhea prevented [ROOT.GetCountry.GetRuler.GetHerHim] from leaving the ground.\n\nPerhaps eating the bones of Alexader wasn't the best idea..."
 zorgo_event.124.a: "By the gods, my stomache ails me..."

 nomadic_raid: "Go Raiding"
 nomadic_raid_act: "Our Ruler will lead a party of warriors on a daring raid!"
 is_on_nomadic_raid_tt: "Has not gone on a raid in the last ten years."
 looted_by_enemies: "Raided Province"
 looted_by_enemies_desc: "This province was raided and looted by a neighboring tribe."

 me_zorgoomni.31_title: "A Raid On Our Neighbors"
 me_zorgoomni.31_desc: "[ROOT.GetCountry.GetRuler.GetName] has heard the call of glory and wants to personally lead some of our warriors on a raid into the lands of our enemies. The omens have spoken clearly, and [recipient.GetName] would be an easy target for our men to despoil - we have nothing to fear!"
 me_zorgoomni.31.a: "The time has come to teach [recipient.GetName] a lesson"
 me_zorgoomni.31.b: "On second thought, I do not have time for this"
 me_zorgoomni.31_tooltip1: "#Y Our Ruler will leave with our raiders immediately!#!"
 me_zorgoomni.31_tooltip2: "#Y This will end the current event chain.#!"

 me_zorgoomni.32_title: "The Raid Into [recipient.GetName]"
 me_zorgoomni.32_desc_1: "The gods were with [ROOT.GetCountry.GetRuler.GetName] when [ROOT.GetCountry.GetRuler.GetSheHe] lead the raiding party into [recipient.GetName], for the [ROOT.GetCountry.GetAdjective] warriors were able to slip pass the [recipient.GetAdjective] border guards undetected. Our men were able to plunder many small villages without any resistance from an organized force, and our warriors stole as much gold and silver from the people of [recipient.GetName] as they could carry.\n\nStores of grain, religious statues carved out of ivory and silver, luxurious furs, and even horses and slaves were taken as prizes - anything that was not taken away was set to the torch. [ROOT.GetCountry.GetRuler.GetFirstName] returned home to [ROOT.GetCountry.GetCapital.GetName] at the head of a triumphant party that had tripled in size, [ROOT.GetCountry.GetRuler.GetHerHis] saddlebags filled to bursting with all manner of ill-gotten gains."
 me_zorgoomni.32_desc_2: "[ROOT.GetCountry.GetRuler.GetName] was able to lead the raiders from [ROOT.GetCountry.GetCapital.GetName] into the hinterlands of [recipient.GetName] without encountering any major resistance - the few unlucky border guards that crossed our paths were quickly sent to whatever gods they believed in.\n\nThe raid itself was quick and methodical, and our warriors wasted no time in spreading out and setting farms and towns to the torch. Civilians were struck down in the streets of their villages, and our soldiers carried off as much wealth as they could carry."
 me_zorgoomni.32_desc_3: "Our warriors were able to avoid the border guards of [recipient.GetName] without any problems and soon found themselves on the outskirts of a small but wealthy village - the buildings were made of brick and there were religious shrines made of marble in the center of a humble square.\n\nBy the time that the [recipient.GetAdjective] guards had any idea that their towns were being raided, our soldiers were already crossing back into [ROOT.GetCountry.GetName], having killed any in our way that would have raised an alarm."
 me_zorgoomni.32_desc_4: "Although we did not encounter any [recipient.GetAdjective] levies on our raid, our warriors did not find as much treasure as they had hoped for - the region seemed to be devoid of all wealth, picked over like a carcass on the steppe. [ROOT.GetCountry.GetRuler.GetFirstName] was a little disappointed in the results of the raid, but none of our [ROOT.GetCountry.GetAdjective] kinsmen were hurt or injured and we were able to steal from a few small farms."
 me_zorgoomni.32_desc_5: "Our warriors were able to raid a few tiny farms on the border between [ROOT.GetCountry.GetName] and [recipient.GetName], but the unexpected arrival of [recipient.GetAdjective] levies caused [ROOT.GetCountry.GetRuler.GetName] to call for a full retreat - the [ROOT.GetCountry.GetRulerTitle] could not afford to lose any experienced soldiers, and the men had taken enough to satisfy themselves."
 me_zorgoomni.32_desc_6: "A few hours after [ROOT.GetCountry.GetRuler.GetName] left [ROOT.GetCountry.GetCapital.GetName] at the head of a raiding party, the weather had turned sour; a blistering rain storm appeared out of nowhere and refused to let up in its assault. Moods immediately darkened and travel became a miserable endeavor, and when it became apparent that it was only going to continue to get worse, everyone decided they would just rather go back to [ROOT.GetCountry.GetName]."
 me_zorgoomni.32_desc_7: "Unfortunately for the raiders, they were not able to loot the countryside, for almost immediately upon crossing into [recipient.GetName], [ROOT.GetCountry.GetRuler.GetName] and [ROOT.GetCountry.GetRuler.GetHerHis] men were attacked by ferocious [recipient.GetAdjective] soldiers on horseback.\n\nThankfully for [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetFirstName] prevailed in this desperate battle thanks to personal feats of glory - the [ROOT.GetCountry.GetRulerTitle] killed three times as many as all others, causing many to look at [ROOT.GetCountry.GetRuler.GetFirstName] in awe."
 me_zorgoomni.32_desc_8: "The gods were not with [ROOT.GetCountry.GetRuler.GetName] and [ROOT.GetCountry.GetRuler.GetHerHis] raiders, for a large group of [recipient.GetAdjective] soldiers set upon the [ROOT.GetCountry.GetRulerTitle] as soon as the [ROOT.GetCountry.GetAdjective] soldiers crossed the border.\n\nDozens of our men fell within seconds, pierced by countless arrows, and [ROOT.GetCountry.GetRuler.GetFirstName] was shot in the thigh - a painful wound that made it difficult for [ROOT.GetCountry.GetRuler.GetHerHim] to ride and fight.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] was separated from the riders by the enemy, but was able to eventually cross back into [ROOT.GetCountry.GetName] with [ROOT.GetCountry.GetRuler.GetHerHis] life - something that not all of [ROOT.GetCountry.GetRuler.GetHerHis] companions could say."
 me_zorgoomni.32_desc_9: "In a disaster for [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetName] and [ROOT.GetCountry.GetRuler.GetHerHis] raiders were attacked by a large force of [recipient.GetAdjective] guards, who slew many of our countrymen and took our [ROOT.GetCountry.GetRulerTitle] prisoner.\n\nWhen the identity of [ROOT.GetCountry.GetRuler.GetFirstName] was discovered, the soldiers of [recipient.GetName] beat [ROOT.GetCountry.GetRuler.GetHerHim] with a savage cruelty that nearly ended [ROOT.GetCountry.GetRuler.GetHerHis] life, and it was only with gold and promises that [ROOT.GetCountry.GetRuler.GetFirstName] was released alive."
 me_zorgoomni.32_desc_10: "At first, it seemed that the raiders under [ROOT.GetCountry.GetRuler.GetName]'s lead had managed to slip across the border between [ROOT.GetCountry.GetName] and [recipient.GetName] without being seen, but a couple of hours later, the [ROOT.GetCountry.GetAdjective] warriors found themselves in a trap. The road narrowed down to meet a small bridge at the edge of a stream, and it was here that the [recipient.GetAdjective] launched an ambush that forced the [ROOT.GetCountry.GetAdjective] raiders down into the water.\n\nAs dozens of arrows whizzed past [ROOT.GetCountry.GetRuler.GetHerHis] head, [ROOT.GetCountry.GetRuler.GetFirstName] felt an overwhelming fear take ahold of [ROOT.GetCountry.GetRuler.GetHerHim], a paralyzing stupor that made [ROOT.GetCountry.GetRuler.GetHerHis] limbs freeze up; I'm about to die.\n\nWhen the end came, it was brutal."
 me_zorgoomni.32_desc_11: "Our raid into [recipient.GetName] could not have gone any better; [ROOT.GetCountry.GetRuler.GetName] captured multiple slaves, slew dozens of [recipient.GetAdjective] soldiers, and put the fear of the [ROOT.GetCountry.GetAdjective]s into the hearts of locals. We didn't even lose a single warrior in battle, either."
 me_zorgoomni.32_desc_12: "The raid into [recipient.GetName] was moderately successful in the beginning, as our warriors were able to plunder farms and even capture a slave for [ROOT.GetCountry.GetCapital.GetName].\n\nYet the enemy had the last laugh. On the return trip back home to [ROOT.GetCountry.GetName], a group of [recipient.GetAdjective] warriors that had followed [ROOT.GetCountry.GetRuler.GetName] and [ROOT.GetCountry.GetRuler.GetHerHis] men ambushed the [ROOT.GetCountry.GetAdjective] raiders when they were fording a river, launching a blistering attack that temporarily overwhelmed them. Our raiders were able to fight them off, thankfully, but [ROOT.GetCountry.GetRuler.GetName] took an arrow in [ROOT.GetCountry.GetRuler.GetHerHis] sword arm and was seriously injured."
 me_zorgoomni.32_desc_13: "The raid into [recipient.GetName] was not as easy as [ROOT.GetCountry.GetRuler.GetName] would have liked; even though our men were able to attack some minor settlements and steal some gold, [ROOT.GetCountry.GetRuler.GetFirstName] was pinned down by some archers and took an arrow in the thigh - not a devastating wound, but not an inconsequential one. Grimacing in pain, the [ROOT.GetCountry.GetRulerTitle] raised a blood-soaked sword into the air and yelled for [ROOT.GetCountry.GetRuler.GetHerHis] warriors to retreat."
 me_zorgoomni.32_desc_14: "The raid into [recipient.GetName] was going exceptionally well until it wasn't - the [ROOT.GetCountry.GetAdjective] raiders had filled their saddlebags to bursting and were leisurely heading back to [ROOT.GetCountry.GetCapital.GetName] when a warband of [recipient.GetAdjective] cavalry caught up with them.\n\nDespite the efforts of [ROOT.GetCountry.GetRuler.GetName] to lead a retreat, the [ROOT.GetCountry.GetRulerTitle] was surrounded by the enemy and seriously wounded. Realizing that [ROOT.GetCountry.GetRuler.GetFirstName] was in mortal danger, the [ROOT.GetCountry.GetAdjective] raiders rallied around their leader, driving off the horsemen and saving [ROOT.GetCountry.GetRuler.GetHerHis] life."
 me_zorgoomni.32_desc_15: "Bad omens accompanied the raiding party from the moment that they left the protection of the [ROOT.GetCountry.GetAdjective] capital; it rained the entire time that the warriors traveled, and many of the men started to catch sick in the harsh conditions.\n\nBy the time that the raiders reached the borders of [recipient.GetName], everyone was in a foul mood and not alert as they should have been. It was precisely at this moment that a barrage of arrows ripped through the [ROOT.GetCountry.GetAdjective] party, and [ROOT.GetCountry.GetRuler.GetName] had the great misfortune of taking an arrow in the eye. Falling to the ground as though dead, it was with great effort that the raiders were able to drag the comatose body of the [ROOT.GetCountry.GetRulerTitle] to safety. Hours later, gods be praised, [ROOT.GetCountry.GetRuler.GetFirstName] awoke, but never again would [ROOT.GetCountry.GetRuler.GetSheHe] be the same."
 me_zorgoomni.32_desc_16: "While the gold and silver taken from [recipient.GetName] was adequate, the warriors of [ROOT.GetCountry.GetName] could not stop praising the heroic feats displayed by the unstoppable [ROOT.GetCountry.GetRuler.GetName] during the raid.\n\nAt one point during the attack, a large group of [recipient.GetAdjective] reinforcements arrived from out of nowhere, threatening to send the raiders into a panic, but the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] was undaunted and charged straight into their ranks, killing two men at once and maiming another.\n\nThe tide of the battle was turned, and the warriors were able to return home to [ROOT.GetCountry.GetCapital.GetName] with their lives and their saddlebags a little heavier than they were before."
 me_zorgoomni.32_desc_17: "After an uneventful week of traveling from [ROOT.GetCountry.GetCapital.GetName], the [ROOT.GetCountry.GetAdjective] raiders crossed the border into [recipient.GetName] with visions of ill-gotten gains dancing through their heads. It came as quite a shock, then, when they party of warriors came across a [recipient.GetAdjective] levy training in the wilderness.\n\nOutnumbered ten to one, the raiders were forced to fight their way back to safety, but many of the men, fearing for their lives, threw their weapons to the ground and rode for the hills, abandoning their brethren to their deaths.\n\nAll would have been lost if not for the bold leadership of [ROOT.GetCountry.GetRuler.GetName], who charged towards the enemy in order to buy [ROOT.GetCountry.GetRuler.GetHerHis] men some time. With a [ROOT.GetCountry.GetAdjective] battlecry on [ROOT.GetCountry.GetRuler.GetHerHis] lips, the [ROOT.GetCountry.GetRulerTitle] hacked [ROOT.GetCountry.GetRuler.GetHerHis] way through the [recipient.GetAdjective] soldiers and sent them retreating from the battlefield, saving the day and allowing the raiding party to escape."
 me_zorgoomni.32_desc_18: "[ROOT.GetCountry.GetRuler.GetName] had every intention of attacking [recipient.GetAdjective] settlements and carrying back slaves and plunder to [ROOT.GetCountry.GetCapital.GetName], but once the [ROOT.GetCountry.GetAdjective] raiders crossed the border into [recipient.GetName], they ran into a large warband led by none other than [recipient.GetRuler.GetName] - the bandits were outnumbered three to one.\n\nSensing that this was not a friendly visit, the warriors led by [recipient.GetRuler.GetFirstName] launched a ferocious attack against the [ROOT.GetCountry.GetAdjective]s, slaying dozens immediately and wounding several others. Screaming in abject terror, [ROOT.GetCountry.GetRuler.GetFirstName] threw [ROOT.GetCountry.GetRuler.GetHerHis] weapon to the ground and immediately ran from the battlefield, leaving dozens of [ROOT.GetCountry.GetRuler.GetHerHis] brethren to be cut down by the [recipient.GetAdjective]s."
 me_zorgoomni.32_desc_19: "The raid into [recipient.GetName] was stopped by [recipient.GetAdjective] levies, who were seemingly waiting for the [ROOT.GetCountry.GetAdjective] warriors as soon as they slipped across the border. Once [ROOT.GetCountry.GetRuler.GetName] realized that [ROOT.GetCountry.GetRuler.GetHerHis] men would be returning to [ROOT.GetCountry.GetName] empty-handed, the furious [ROOT.GetCountry.GetRulerTitle] gave the order to show no mercy and kill everyone present.\n\nHours later, the fields were stained red with the blood of fallen [recipient.GetAdjective] soldiers, and a triumphant [ROOT.GetCountry.GetRuler.GetName] signaled for [ROOT.GetCountry.GetRuler.GetHerHis] warriors to return home."
 me_zorgoomni.32_desc_20: "Although the raiders that left [ROOT.GetCountry.GetName] were filled with confidence in their own abilities to plunder, Fate had marked [ROOT.GetCountry.GetRuler.GetName] for death; the [ROOT.GetCountry.GetAdjective] warriors had barely crossed the border into [recipient.GetName] when they were set upon by a force five times their size.\n\nRealizing that [ROOT.GetCountry.GetRuler.GetSheHe] would not be returning home to [ROOT.GetCountry.GetCapital.GetName], the [ROOT.GetCountry.GetRulerTitle] made [ROOT.GetCountry.GetRuler.GetHerHis] peace with [ROOT.GetCountry.GetRuler.GetHerHis] gods and charged bravely into the enemy."
 me_zorgoomni.32.a: "All hail the masterful raider [ROOT.GetCountry.GetRuler.GetName]!"
 me_zorgoomni.32.b: "Another victory for [ROOT.GetCountry.GetName]!"
 me_zorgoomni.32.c: "We are untouchable!"
 me_zorgoomni.32.d: "It was fun getting out of [ROOT.GetCountry.GetCapital.GetName] for a while"
 me_zorgoomni.32.e: "There is no need for a pitched battle - return to [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.32.f: "What a cursed waste of time!"
 me_zorgoomni.32.g: "[ROOT.GetCountry.GetRuler.GetFirstName] is truly a skilled fighter!"
 me_zorgoomni.32.h: "It was a mistake to leave [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.32.i: "I am lucky to have survived, but I don't feel very lucky..."
 me_zorgoomni.32.j: "What an absolute disaster for [ROOT.GetCountry.GetName]!"
 me_zorgoomni.32.k: "I spit in the face of [recipient.GetRuler.GetName] and [recipient.GetRuler.GetHerHis] armies"
 me_zorgoomni.32.l: "A curse upon the [recipient.GetAdjective]s!"
 me_zorgoomni.32.m: "We must return to the safety of [ROOT.GetCountry.GetName]!"
 me_zorgoomni.32.n: "I feel dizzy..."
 me_zorgoomni.32.o: "Bah! I should have never left [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.32.p: "I will destroy any that stand in the way of victory!"
 me_zorgoomni.32.q: "I would gladly do it all again to save my warriors"
 me_zorgoomni.32.r: "I am lucky to have escaped with my life!"
 me_zorgoomni.32.s: "Battlefield experience can be more valuable than gold"
 me_zorgoomni.32.t: "I will die with sword in hand! Aaarrrggghhh!"
 me_zorgoomni.32_tooltip: "#Y This will end the current event chain.#!"

 me_zorgoomni.33_title: "Cross Border Raid"
 me_zorgoomni.33_desc: "My [ROOT.GetCountry.GetRulerTitle], we have terrible news to report from [this_province_was_raided_scope.GetName]. Last night, a cohort of warriors from [nomadic_raid_country.GetName] slipped across our border and launched a surprise raid on the unsuspecting locals. It is known that the [nomadic_raid_country.GetAdjective] raiders killed some of our people and plundered their land, carting off whatever they could carry and burning everything that they could not.\n\nYou should know that these bandits were personally led by [nomadic_raid_country.GetRuler.GetName] in a brazen sign of disrespect to the people of [ROOT.GetCountry.GetName]."
 me_zorgoomni.33.a: "What! This is practically a declaration of war!"

