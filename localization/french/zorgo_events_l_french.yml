 me_zorgoomni.34_title: "Cross Border Raid"
 me_zorgoomni.34_desc: "My [ROOT.GetCountry.GetRulerTitle], we have both terrible and good news to report from [this_province_was_raided_scope.GetName], but first, the bad.\n\nLast night, a cohort of warriors from [nomadic_raid_country.GetName] slipped across our border and launched a surprise raid on the unsuspecting locals. Unfortunately, the treacherous [nomadic_raid_country.GetAdjective] raiders killed some of our people and plundered their land, carting off whatever they could carry and burning everything that they could not. And what is worse - you should know that these bandits were personally led by [nomadic_raid_country.GetRulerTitle] [nomadic_raid_country.GetRuler.GetName] in a brazen sign of disrespect to the people of [ROOT.GetCountry.GetName].\n\nBut the gods of war were with us, for the treacherous [nomadic_raid_country.GetRuler.GetFirstName] was actually slain in battle by our warriors! The foolish [nomadic_raid_country.GetAdjective] [nomadic_raid_country.GetRuler.GetFirstName] was chased down by three of our soldiers and shown no mercy."
 me_zorgoomni.34.a: "We will destroy anyone that thinks they can raid [ROOT.GetCountry.GetName]!"
 me_zorgoomni.34_tooltip: "'#Y Cross Border Raid#!' has now been #G Completed#!!"
 

 inv_after_battle.11.t: "The Bonds of Friendship"
 inv_after_battle.11.d: "[SCOPE.sCharacter('inv_after_battle_1_target').GetName] has acquired a reputation for never leaving a wounded soldier behind on the battlefield, often putting [SCOPE.sCharacter('inv_after_battle_1_target').GetHerHim]self in great personal danger in order to make sure that no one is forgotten.\n\nThanks to [SCOPE.sCharacter('inv_after_battle_1_target').GetFirstName]'s selfless example, many of our soldiers are inspired to follow in [SCOPE.sCharacter('inv_after_battle_1_target').GetHerHis] footsteps."
 inv_after_battle.11.a: "I'll watch your back if you protect mine"

