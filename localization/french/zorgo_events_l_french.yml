 me_zorgoomni.34_title: "Raid transfrontalier"
 me_zorgoomni.34_desc: "Mon [ROOT.GetCountry.GetRulerTitle], nous avons des nouvelles à rapporter de [this_province_was_raided_scope.GetName], mais commençons par les mauvaises.\n\nLa nuit dernière, une cohorte de guerriers de [nomadic_raid_country.GetName] a franchi notre frontière et lancé un raid surprise contre les habitants sans méfiance. Malheureusement, les pillards [nomadic_raid_country.GetAdjective] traîtres ont tué des nôtres et pillé leurs terres, emportant tout ce qu’ils pouvaient transporter et brûlant le reste. Pire encore, ces bandits étaient personnellement menés par [nomadic_raid_country.GetRulerTitle] [nomadic_raid_country.GetRuler.GetName], signe insolent de mépris envers le peuple de [ROOT.GetCountry.GetName].\n\nMais les dieux de la guerre étaient avec nous : le traître [nomadic_raid_country.GetRuler.GetFirstName] a été tué au combat par nos guerriers ! Le stupide [nomadic_raid_country.GetAdjective] [nomadic_raid_country.GetRuler.GetFirstName] a été rattrapé par trois de nos soldats, qui ne lui ont fait aucune grâce."
 me_zorgoomni.34.a: "Nous détruirons quiconque pense pouvoir piller [ROOT.GetCountry.GetName] !"
 me_zorgoomni.34_tooltip: "Le « #Y Raid transfrontalier#! » est désormais #G terminé# !!"
 

 inv_after_battle.11.t: "Les liens de l’amitié"
 inv_after_battle.11.d: "[SCOPE.sCharacter('inv_after_battle_1_target').GetName] s’est forgé la réputation de ne jamais laisser un soldat blessé derrière lui sur le champ de bataille, mettant souvent sa propre vie en grand danger pour s’assurer que personne ne soit oublié.\n\nGrâce à l’exemple désintéressé de [SCOPE.sCharacter('inv_after_battle_1_target').GetFirstName], nombre de nos soldats sont inspirés à suivre ses traces."
 inv_after_battle.11.a: "Je protégerai tes arrières si tu protèges les miens"

