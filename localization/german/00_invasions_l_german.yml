l_german:
  
  invasions_1_title:0 "Die Xiongnu-Horde"
  invasions_1_desc:0 "In den fernen Ländern der östlichen Steppen hat eine als Xiongnu bekannte Stammeskonföderation unter ihrem Anführer Chanyu Modun die Mehrheit der Stämme jenseits des Altai-Gebirges unterworfen. Die Angst wächst, dass der Blick der Chanyu weiter nach Süden und Westen gerichtet ist."
  invasions_1.a:0 "Das kann nicht gut sein..."
 
  invasions_2_title:0 "Die Wusun-Migration"
  invasions_2_desc:0 "Es gibt schreckliche Nachrichten von der Grenze. Unter Fahnen mit den Zeichen der #E Wusun#! ist eine riesige Schar von Steppen-Nomaden in die nördlichen Täler eingedrungen. Familien, Herden und Pferdewagen folgen dicht hinter dieser berittenen Vorhut, und diese furchterregende Horde zeigt keinerlei Anzeichen, umzukehren, sondern setzt ihren unaufhaltsamen Vormarsch in unser Gebiet fort. Dies ist kein Überfall, von dem die Reiter einfach wieder nach Hause zurückkehren werden, sondern eine vollumfängliche Invasion von [ROOT.GetCountry.GetName]!"
  invasions_2_warning_desc: "Mein [ROOT.GetCountry.GetRulerTitle], aus dem Osten eintreffende Händler berichten von unbekannten Reitern, die sich jenseits der Gebirgspässe versammeln. Sie nennen sich #E Wusun#! und reisen nicht nur mit Kriegern, sondern auch mit Kindern, Wagen und Herden, die sich so weit erstrecken, wie das Auge reicht.\n\nIhre Späher wurden bereits entlang der nach Norden führenden Straßen gesichtet. Wenn die Berichte stimmen, sind sie nicht auf der Suche nach Beute – sie suchen eine neue Heimat und erwarten, diese auf unserer Seite der Grenze zu finden."
  invasions_2.a: "Dann muss jeder Pass beobachtet werden." 
  invasions_2_invasion.a: "Wir werden diese Barbaren vernichten!"
  invasions_2.b: "Wir werden diese [ROOT.GetCountry.GetAdjective]en Barbaren vernichten!"
  invasions_2_switch_tt: "#T Wir werden den Tag wechseln und als die#! #G Wusun#! #T Horde#! spielen"
  invasions_2_tooltip:0 "Der #Y [wusun_country_scope.GetName]#!  Stamm erklärt #Y [wusun_invasion_defender.GetName]#! den Krieg mit dem Kriegsziel #Y Hordeneroberung#!."
 
  invasions_3_title:0 "Ankunft der Yuezhi"
  invasions_3_desc:0 "Händler aus [ROOT.GetCountry.GetCapital.GetName] bringen Nachrichten von großen Kriegen im Fernen Osten mit. Eine mächtige Konföderation von Steppenstämmen hat ihre Rivalen, die sogenannten #E Yuezhi#!, vollständig vernichtet und vertreibt sie nun aus ihrem Land. Da sie nirgendwo hin können, fliehen die Yuezhi nach Westen, und es wird erwartet, dass viele von ihnen in den kommenden Tagen in unserer Region eintreffen werden."
  invasions_3.a:0 "Wie viele könnten es noch sein..."
  invasions_3_tooltip:0 "Viele Stammesangehörige der #Y Yuezhi#! Kultur werden im Tarim-Becken auftauchen"
  
  invasions_4_title:0 "Die Yuezhi"
  invasions_4_desc:0 "In den letzten Monaten haben sich große Gruppen von Angehörigen des #E Yuezhi#!-Stammes aus der Steppe in [ROOT.GetCountry.GetName] niedergelassen. Zunächst waren es nur wenige, doch ihre Zahl ist stetig gestiegen, und scheinbar über Nacht wurden Teile unseres Landes von diesen Nomaden besetzt.\n\nWann immer unser Volk versucht hat, sich ihren Lagern zu nähern, stieß es auf eisige Gleichgültigkeit, wenn nicht gar auf offene Feindseligkeit. Die Yuezhi sind ein stolzes Volk, und sie werden sich nicht damit begnügen, einfach nur durch unser Land zu ziehen. Irgendwann werden sie Forderungen an uns stellen, und wenn wir uns weigern, werden sie sich das Gewünschte mit Gewalt nehmen."
  invasions_4.a:0 "Die  Yuezhi Kultur annehmen"
  invasions_4.b:0 "Wir sind keine Yuezhi, wir sind [ROOT.GetCountry.GetAdjective]!"
  invasions_4_tooltip:0 "Erhaltet Zugang zum #Y Horde-Eroberung#! Kriegsziel für 25 Jahre \nBis zu #Y 50#! Pops konvertieren zur Yuezhi-Kultur."
 
  invasions_5_title:0 "Yuezhi Invasion"
  invasions_5_desc:0 "[ROOT.GetCountry.GetRuler.GetName], unsere schlimmsten Befürchtungen haben sich bewahrheitet. Die barbarischen Horden der #E Yuezhi#! haben sich im Norden gezeigt und strömen über die Grenze herein. Unsere Späher berichten, dass sie bereits eine auswärtige Armee vernichtet haben, die entsandt worden war, um sie aufzuhalten, und da ihnen niemand mehr im Weg steht, strömen sie in die Täler. Die Yuezhi sind ein stolzes Volk, und sie werden sich nicht damit begnügen, sich einfach in unseren Ländern niederzulassen. Sie werden Tribut fordern, und wenn wir uns weigern, werden sie ihn mit Gewalt einfordern."
  invasions_5_warning_desc: "Mein [ROOT.GetCountry.GetRulerTitle], uns erreichen beunruhigende Berichte über gewaltige Stammeswanderungen in der Steppe. Obwohl wir dies nicht überprüfen können, heißt es, dass ganze Sippen langsam, aber sicher in unsere Richtung marschieren, begleitet von Kriegern und gigantischen Herden, die sich jeder Beschreibung entziehen.\n\nSollten diese Berichte zutreffen, ist damit zu rechnen, dass diese Barbaren im Laufe des kommenden Jahres die Grenze überschreiten werden – wir sollten uns auf das Schlimmste vorbereiten."
  invasions_5_warning.a: "Belästigt mich nicht mit unbegründeten Gerüchten..."
  invasions_5.a: "Sie werden nicht weit kommen … ich hoffe doch sehr, dass sie nicht weit kommen."  
  invasions_5.b: "Ich werde die Yuezhi in eine neue Heimat führen."
  invasions_5_switch_tt: "Wir werden unser derzeitiges Land verlassen und als die einfallende Horde der #Y Yuezhi#! weiter spielen"
  invasions_5_tooltip: "Der #Y [yuezhi_country_scope.GetName]#! Stamm  erklärt #Y [yuezhi_invasion_defender.GetName]#! den Krieg mit dem Kriegsziel '#Y Hordeneroberung#!'."
  
  invasions_6_title:0 "Die Sakische Horde"
  invasions_6_desc:0 "Der nördliche Horizont ist in einer Staubwolke verschwunden. Über die Grenze reiten die #E Saken#!, denen es gelungen ist, Provinzen in unserem Hinterland zu erobern und uns den Krieg erklärt haben. [ROOT.GetCountry.GetRuler.GetName] versuchte, Gesandtschaften zu entsenden, um um Frieden zu bitten, doch unsere Diplomaten wurden von den Wilden kaltblütig ermordet.\n\nMit verzweifelten Männern lässt sich vielleicht verhandeln, doch ein verzweifeltes Volk lässt sich nicht mit Worten aufhalten – eine schmerzhafte Lektion, die der [ROOT.GetCountry.GetRulerTitle] nie wieder vergessen wird. Die Saken sind gekommen, um sich durch die Eroberung unserer reichen Täler und Städte eine Heimat zu schaffen, und wir müssen ihnen mit Bogen und Schwert entgegentreten."
  invasions_6_warning_desc: "Mein [ROOT.GetCountry.GetRulerTitle], in den nördlichen Hügeln wurden Leuchtfeuer gesichtet – zuerst eine Handvoll, dann Hunderte, schließlich mehr, als ein Mensch jemals zu zählen hoffen könnte. Flüchtlinge aus dem Norden schwören, dass dieser Stamm, die #E Saken#!, ihre alten Weidegründe verlassenen hat und mit ihren Familien und Habseligkeiten nach Süden zieht.\n\nDie Nachrichten von der Grenze waren bereits düster. Sakische Reiter wurden dabei beobachtet, wie sie jede Furt und jeden Bergpfad überprüften, der in unser Land führt. Sie reiten nicht wie Plünderer, die auf leichte Beute aus sind – sie reiten wie Männer, die nirgendwo anders hin können und unsere Verteidigungsanlagen ausloten."
  invasions_6.a:0 "Verzweiflung wird Ihnen unser Land nicht einbringen!"
  invasions_6_invasion.a: "Wir werden sie vernichten und zurück in die Steppe jagen!"
  invasions_6.b: "Ich werde mit den Saken nach Süden reiten..."
  invasions_6_switch_tt: "#T Wir werden den Tag wechseln und als die#! #G Saken#! #T Horde spielen.#!"
  invasions_6_tooltip:0 "Der #Y [sakia_country_scope.GetName]#! Stamm erklärt #Y [sakia_invasion_defender.GetName]# den Krieg! mit dem #Y Hordeneroberung#! Kriegsziel."
  
  invasions_8_title:0 "Yuezhi Invasion von Bactria"
  invasions_8_desc:0 "Die Berichte unserer Späher sind alle gleich: Die Bergpässe können sie nicht mehr aufhalten. Kolonnen von #E Yuezhi#!-Kriegern strömen aus dem Norden herab und erobern Städte und Dörfer, während ihre Familien und Herden ihnen folgen.\n\nUnsere Mauern, Tempel und fruchtbaren Felder müssen einem Volk, das aus einer Heimat nach der anderen vertrieben wurde, wie unvorstellbare Schätze erscheinen. Sie beabsichtigen, die Königreiche Baktriens zu zerschlagen, unsere Täler für sich zu beanspruchen und genügend Berge zwischen ihre Kinder und den Zorn ihrer Feinde zu bringen, damit sie nie wieder vertrieben werden."
  invasions_8_warning_desc: "Mein [ROOT.GetCountry.GetRulerTitle], Boten aus den nördlichen Satrapien überbringen ernste Nachrichten. Die #E Yuezhi#! wurden aus dem Ili-Tal vertrieben, und ihre verstreuten Gruppen sammeln sich erneut – diesmal entlang der Straßen, die hinab nach #E Baktrien#! führen.\n\nUnsere Spione berichten, dass sie berittene Patrouillen gesichtet haben, die die hohen Pässe auskundschaften. Das sind keine Vorbereitungen von Flüchtlingen, die um Durchlass bitten … ganz im Gegenteil. Innerhalb eines Jahres könnte die volle Wucht ihrer Wanderung auf uns niedergehen."
  invasions_8.a:0 "Baktrien wird ihnen kein Zufluchtsort sein, solange ich [ROOT.GetCountry.GetRulerTitle] bin!"
  invasions_8_A_tooltip:0 "Der #Y [yuezhi_country_scope_2.GetName]#! Stamm erklärt #Y [yuezhi_bactria_invasion_defender.GetName]#! den Krieg mit dem #Y Hordeneroberungs#! Kriegsziel."
  invasions_8_B_tooltip:0 "Der #Y [yuezhi_country_scope.GetName]#! Stamm erklärt #Y [yuezhi_bactria_invasion_defender.GetName]#! den Krieg mit dem #Y Hordeneroberungs#! Kriegsziel."
  
