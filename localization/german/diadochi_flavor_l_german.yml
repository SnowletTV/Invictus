 diadochi_liberation.2002.t: "[flipping_subject.GetName] Unter [subject_flipper.GetAdjective]e Besatzung" 
 diadochi_liberation.2002.desc: "[flipping_subject.GetName] leistete so lange wie möglich Widerstand, aber [subject_flipper.GetName] hat [flipping_subject.GetCapital.GetName] eingenommen. Nun herrscht Uneinigkeit unter den [flipping_subject.GetAdjective]er Eliten: Einige haben ihre Unterstützung für die [subject_flipper.GetAdjective]e Sache erklärt, während andere hoffen, dass [current_overlord.GetName] die [subject_flipper.GetAdjective]e Besatzung beenden wird, bevor es zu spät ist." 
 diadochi_liberation.2002.a: "Wir müssen schnell handeln, um ein Abfallen zu verhindern." 
 diadochi_liberation.2002.at: "[flipping_subject.GetName] wird zu den [subject_flipper.GetAdjective]en #R abfallen#! , wenn wir nicht innerhalb der nächsten Monate die Kontrolle über [flipping_subject.GetCapital.GetName] oder eine benachbarte [flipping_subject.GetAdjective]e Provinz zurückgewinnen." 
  
 diadochi_liberation.2003.t: "Das Schicksal von [flipping_subject.GetName]" 
 diadochi_liberation.2003.desc: "Die Loyalisten von [current_overlord.GetName] haben so lange wie möglich durchgehalten, aber es kam keine Hilfe. Da [subject_flipper.GetName] nun die Kontrolle über [flipping_subject.GetCapital.GetName] hat, argumentieren einige nun, dass weiterer Widerstand sinnlos sei. Vielleicht ist es an der Zeit, die [subject_flipper.GetAdjective]e Sache zu unterstützen." 
 diadochi_liberation.2003.a: "Heil [subject_flipper.GetRulerTitle] [subject_flipper.GetRulerTitle.GetName]!" 
 diadochi_liberation.2003.at: "Wir werden allen aktuellen Kriege von [subject_flipper.GetName] #G beitreten#!" 
 diadochi_liberation.2003.b: "Wir werden noch ein wenig länger durchhalten." 
  
 diadochi_liberation.2004.t: "[flipping_subject.GetName] schließt sich uns an"
 diadochi_liberation.2004.desc: "Ohne Hilfe von [current_overlord.GetName] mussten die [current_overlord.GetAdjective]en Loyalisten kapitulieren. Nach monatelanger Verteidigung hat sich [flipping_subject.GetName] für [subject_flipper.GetName] ausgesprochen."
 diadochi_liberation.2004.a: "Sie haben die richtige Wahl getroffen." 

 diadochi_liberation.2005.t: "[flipping_subject.GetName] fällt ab" 
 diadochi_liberation.2005.desc: "Ohne Hilfe von [current_overlord.GetName] mussten die [current_overlord.GetAdjective]en Loyalisten kapitulieren. Nach monatelanger Verteidigung hat sich [flipping_subject.GetName] für [subject_flipper.GetName] ausgesprochen." 
 diadochi_liberation.2005.a: "Verdammt seien diese Verräter."   
 #NEw 
 diadochi_liberation.2006.t: "[flipping_subject.GetName] gerät unter [subject_flipper.GetAdjective]e Besetzung" 
 diadochi_liberation.2006.desc: "Wir haben so lange wie möglich durchgehalten, aber nun hallen die Straßen von [flipping_subject.GetCapital.GetName] vom Stampfen der [subject_flipper.GetAdjective]en Soldaten wider. Unter unseren eigenen Eliten haben einige das Knie vor [subject_flipper.GetRuler.GetPraenomen] gebeugt und suchen unter [subject_flipper.GetRuler.GetHerHis]er Herrschaft nach Vorteilen. Andere hingegen warten heimlich auf ihre Stunde und setzen ihre Hoffnungen auf [current_overlord.GetName], um die [subject_flipper.GetAdjective]en aus [flipping_subject.GetCapital.GetName] zu vertreiben und unsere Unabhängigkeit wiederherzustellen." 
 diadochi_liberation.2006.a: "Wir werden durchhalten, bis die Befreiung naht." 
 #diadochi_liberation.2006.b: "Some see only opportunity in defeat." #NNT!
  
 diadochi_liberation.2007.t: "[flipping_subject.GetName] gerät unter [subject_flipper.GetAdjective]e Besetzung" 
 diadochi_liberation.2007.desc: "Die [flipping_subject.GetAdjective]en leisteten so lange Widerstand, wie sie konnten, aber jetzt patrouillieren [subject_flipper.GetAdjective]e Truppen in den Straßen von [flipping_subject.GetCapital.GetName]. Bestimmte Mitglieder der [flipping_subject.GetAdjective]e Elite haben ihre Unterstützung für die [subject_flipper.GetAdjective]e Sache erklärt, um sich die Gunst des neuen Regimes zu sichern. Andere jedoch schmieden heimlich Pläne im Verborgenen und hoffen, dass [current_overlord.GetName] eines Tages die [subject_flipper.GetAdjective]en aus der Stadt vertreiben und ihre Herrschaft loyalen Händen anvertrauen wird."
 diadochi_liberation.2007.a: "Endlich erkennt [flipping_subject.GetCapital.GetName] unsere Macht an."
 diadochi_liberation.2007.b: "[flipping_subject.GetName] hätte aufgeben sollen, als es die Chance dazu hatte." 
 diadochi_liberation.2007.c: "Wir werden uns um [flipping_subject.GetName] kümmern, sobald die [current_overlord.GetAdjective]en besiegt sind." 
 diadochi_liberation.2007.ct: "#T Nichts passiert#!" 
  
 diadochi_liberation.2008.t: "[flipping_subject.GetName] fällt an [subject_flipper.GetAdjective]e Kräfte"
 diadochi_liberation.2008.desc: "Die [flipping_subject.GetAdjective]en Streitkräfte leisteten so lange Widerstand, wie sie konnten, aber jetzt patrouillieren [subject_flipper.GetAdjective]e Truppen in den Straßen von [flipping_subject.GetCapital.GetName]. Kollaborateure unter den [flipping_subject.GetAdjective]en Kräften haben nun die Kontrolle über [flipping_subject.GetName]. Ihre Gegner schmieden jedoch im Verborgenen Pläne und hoffen, dass [current_overlord.GetName] eines Tages zurückkehren wird, um die [subject_flipper.GetAdjective]en aus [flipping_subject.GetCapital.GetName] zu vertreiben." 
 diadochi_liberation.2008.a: "Wie konnte dies passieren?" 
 diadochi_liberation.2008.b: "Besser, [subject_flipper.GetRuler.GetPraenomen] als Freund zu haben als einen Feind."
 diadochi_liberation.2008.c: "Interessant..." 
  
  
  #Diadochi Flavor 
 diadochi_flavor.1.a.antigonus.death:2 "#R Wenn Ihr es NICHT schafft, [GetProvince('(int32)418').GetName|Y] zu erobern ODER [GetProvince('(int32)660').GetName|Y], [GetProvince('(int32)790').GetName|Y], [GetProvince('(int32)407').GetName|Y], [GetProvince('(int32)331').GetName|Y] oder [GetProvince('(int32)1936').GetName|Y] verliert, wird Euer Reich zersplittert, wenn [GetCharacter('(int32)37').GetPraenomen] stirbt.#! \n\n"
 diadochi_flavor.1.a.tt: "$legacy_of_alexander_wargoal_tt$ \n \n#R Diese Ansprüche und das Kriegsziel werden mit dem Tod unseres zweiten Herrschers verschwinden.#!"
 diadochi_flavor.2.a.tt: "$legacy_of_alexander_wargoal_tt$ \n#R Diese Ansprüche und das Kriegsziel werden mit dem Tod unseres Herrschers verschwinden.#!"
 legacy_of_alexander_wargoal_tt:0 "Wir können jetzt den Kriegsgrund #G Vermächtnis von Alexander#! gegen andere Diadochen einsetzen.\n#G Wir erhalten Ansprüche auf das ehemalige Reich von [GetCharacter('(int32)39').GetPraenomen]:#!\n[GetProvince('(int32)418').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)350').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)379').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)1883').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)1936').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)4799').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)516').GetArea.GetRegion.GetName|Y] und [GetProvince('(int32)569').GetArea.GetRegion.GetName|Y]."
 diadochi_flavor.6.a.tt:0 "#R Alle Ansprüche auf Alexanders Reich erlöschen.#!\n#R Wir können nicht länger den Kriegsgrund "Vermächtnis von Alexander" verwenden, wenn wir den Krieg erklären.#!"
 diadochi_flavor.1.t: "Die Kriege der Diadochen"
 diadochi_flavor.1.a: "Das Imperium gehört dem Stärksten!"
 diadochi_flavor.1.b: "Antigonos wird alle überdauern, koste es, was es wolle!"
 diadochi_flavor.1.b.tt: "Alle Fähigkeiten von [GetCountry('PRY').GetRuler.GetPraenomen]' werden auf #R 7#! reduziert."
 diadochi_flavor_1_desc_intro:1 "Nachdem [GetCharacter('(int32)39').GetSheHe] das größte Reich errichtet hatte, das die Welt je sah, starb [GetCharacter('(int32)39').GetPraenomen] [GetCharacter('(int32)39').Custom('get_DieDer')] Große vor neunzehn Jahren plötzlich. Da es keinen klaren Nachfolger für das Reich gab, kämpfen die Generäle seither um die Hinterlassenschaften und sind als "Diadochen" oder Nachfolger bekannt geworden.\n\n"
 diadochi_flavor_1_desc_outro: "[GetCharacter('(int32)37').GetPraenomen] ist vielleicht der erfolgreichste der Diadochen, aber der Erfolg bringt viele Feinde hervor und er steht jetzt alleine und verwundbar da."
 diadochi_flavor.1.desc:3 "$diadochi_flavor_1_desc_intro$Als Satrap von [GetProvince('(int32)1936').GetArea.GetRegion.GetName] war unser Herrscher [GetCharacter('(int32)37').GetPraenomen] zwar nicht Teil der großen Feldzüge von [GetCharacter('(int32)39').GetPraenomen], doch in den Konflikten des letzten Jahrzehnts konnte er sich einen Namen machen und ist zum Stärksten der Nachfolger aufgestiegen. Andernorts schaffte es [GetCharacter('(int32)24').GetPraenomen], [GetProvince('(int32)918').GetName] zurückzuerobern, und hat damit das östliche Reich vereinigt. So geht der Konflikt um [GetProvince('(int32)418').GetArea.GetRegion.GetName] gegen [GetCharacter('(int32)32').GetPraenomen] aus Makedonien weiter ...\n\nUnser Ruf als Beschützer der freien griechischen Städte brachte uns viele Freunde unter den kleineren griechischen Staaten ein. Abgesehen davon führen wir unseren Kampf nun jedoch allein ..."
 diadochi_flavor.2.desc:4 "$diadochi_flavor_1_desc_intro$Unser Herrscher [GetCharacter('(int32)32').GetPraenomen] aus Makedonien ist der Sohn von [GetCharacter('(int32)9').GetPraenomen], der der dienstälteste General von [GetCharacter('(int32)39').GetPraenomen] war und dem nach der Ermordung des vorherigen Regenten Perdikkas die Ehre zuteil wurde, das Erbe von [GetCharacter('(int32)39').GetPraenomen] bis zur Mündigkeit seines Sohnes zu verwalten. Nach dem Tod seines Vaters verdrängte [GetCharacter('(int32)32').GetPraenomen] den ernannten Nachfolger [GetCharacter('(int32)521').GetPraenomen] mithilfe der Feinde seines Vaters und tötete schließlich die Erben von [GetCharacter('(int32)39').GetPraenomen] sowie deren Mütter.\n\n$diadochi_flavor_1_desc_outro$ Seine Einmischung in die Politik der griechischen Staaten geht weiter, und er hat nun die Kontrolle über die strategisch wichtige [GetProvince('(int32)407').Custom('get_city_type_loc')] [GetProvince('(int32)407').GetName] errungen."
 diadochi_flavor.3.desc:3 "$diadochi_flavor_1_desc_intro$Als enger Freund von [GetCharacter('(int32)39').GetPraenomen] und erfahrener General scheint für unseren Herrscher [GetCharacter('(int32)41').GetPraenomen] eine wohlhabendere Provinz als Thrakien gerechtfertigt zu sein. Obwohl er häufig in die Konflikte der Antipatriden in Makedonien mit [GetCharacter('(int32)37').GetPraenomen], dem ehemaligen Satrapen von [GetProvince('(int32)1936').GetArea.GetRegion.GetName], verwickelt war, war [GetCharacter('(int32)41').GetPraenomen] bisher nicht in der Lage, seine Herrschaft über jene Region hinaus auszuweiten, deren Schutz ihm aufgetragen worden war.\n\n$diadochi_flavor_1_desc_outro$ Dies wäre eine großartige Gelegenheit, wenn wir nur Verbündete gewinnen könnten, die sich ihm entgegenstellen …"
 diadochi_flavor.4.desc:3 "$diadochi_flavor_1_desc_intro$Unser Herrscher [GetCharacter('(int32)42').GetPraenomen], einer der ältesten Freunde von [GetCharacter('(int32)39').GetPraenomen], hat Ägypten, die wohlhabendste Provinz des Reiches, für sich gesichert. Die Expansion nach [GetProvince('(int32)418').GetArea.GetRegion.GetName] und [GetProvince('(int32)790').GetArea.GetRegion.GetName] wurde jedoch durch [GetCharacter('(int32)37').GetPraenomen] Monophtalmos, den ehemaligen Satrapen von [GetProvince('(int32)1936').GetArea.GetRegion.GetName] vereitelt, dessen Sohn [GetCharacter('(int32)38').GetPraenomen] "der Belagerer" vor Kurzem unsere gesamte Flotte in der Schlacht von Salamis vor [GetProvince('(int32)331').GetArea.GetName] vernichtete.\n\n$diadochi_flavor_1_desc_outro$ Dies wäre eine großartige Gelegenheit, wenn wir nur Verbündete gewinnen könnten, die sich ihm entgegenstellen …"
  diadochi_flavor.5.desc:3 "$diadochi_flavor_1_desc_intro$Unser Herrscher [GetCharacter('(int32)24').GetPraenomen] eroberte die Satrapie von [GetProvince('(int32)918').GetName] von [GetCharacter('(int32)37').GetPraenomen] zurück, dem ehemaligen Satrapen von [GetProvince('(int32)1936').GetArea.GetRegion.GetName], der in den Osten einmarschierte und die königlichen Schatzkammern plünderte, ehe er nach [GetProvince('(int32)790').GetArea.GetRegion.GetName] zurückkehrte. Allein dank seiner eigenen Fähigkeiten kontrolliert [GetCharacter('(int32)24').GetPraenomen] nun das gesamte östliche Reich.\n\n[GetCharacter('(int32)37').GetPraenomen] mag vielleicht der Mächtigste der Nachfolger sein, doch Erfolg bringt einem auch stets Feinde ein, und so kämpft er nun allein und ist verwundbar. Eine große Chance, vorausgesetzt der Frieden an unserer Ostgrenze kann gesichert werden …"
  
 diadochi_flavor.6.t: "Die Epigonen"
 diadochi_flavor.6.desc: "Die Könige, die einst [GetCharacter('(int32)39').GetPraenomen] gedient haben, beginnen nach und nach zu sterben und mit ihnen auch der unmittelbare Anspruch auf sein Reich. Die als 'Nachfolger' bekannten Männer werden nun selbst von ihren Nachkommen, den 'Epigonen', abgelöst. \n \nDiese Epigonen sind zwar mächtige Anführer mit einem starken Anspruch auf die Reiche ihrer Väter, aber sie sind regionale Dynastien und können kein Reich wiederherstellen, das von der vorherigen Generation durch Machtkämpfe befleckt wurde."
 diadochi_flavor.6.a: "Die Welt soll uns an unseren eigenen Taten messen."
  
 diadochi_flavor.7.t:0 "Hauptstadt eines Reiches"
 diadochi_flavor.7.desc:1 "Als Nachfolger des Reichs von [GetCharacter('(int32)39').GetPraenomen] müssen wir uns überlegen, ob [ROOT.GetCountry.GetCapital.GetName] tatsächlich der beste Ort ist, um über die hellenistische Welt zu regieren. Manche argumentieren, es gäbe andere Städte, die für eine solche Aufgabe besser geeignet wären.\n\nJeder mögliche Standort hat natürlich seine eigenen Vorteile, weswegen eine solche Entscheidung sorgfältig abgewogen werden müsste."
 diadochi_flavor.7.a:1 "[GetProvince('(int32)379').GetName], Sitz der argeadischen Könige."
 diadochi_flavor.7.b:1 "[GetProvince('(int32)516').GetName], Herz Ägyptens."
 diadochi_flavor.7.c:1 "[GetProvince('(int32)918').GetName], Gründungsort des Reiches."
 diadochi_flavor.7.d:1 "[GetProvince('(int32)4371').GetName], am Ende der Welt."
 diadochi_flavor.7.e:0 "[ROOT.GetCountry.GetCapital.GetName] bleibt weiterhin unsere Hauptstadt."
  
 diadochi_flavor.8.t:3 "Der antigonidische Wille wankt"
 diadochi_flavor.8.desc:3 "Mit seinem Ableben steht jener Staat, den [GetCharacter('(int32)37').GetPraenomen] aus seiner phrygischen Satrapie errichtete, zum ersten Mal ohne seinen Gründer da. Sein kometenhafter Aufstieg zog einst den Neid und die Bewunderung einer ganzen Generation auf sich, doch die erbitterte Feindschaft der anderen Diadochen brachte den alten General bis an seine Grenzen.\n\nDie Loyalität unter unseren asiatischen Untertanen und ihren makedonischen Verwaltern schwankt, und unsere Feinde absorbieren in diesem Augenblick bereits unzählige Provinzen und treiben die anderen dazu, sich ebenfalls von unserer Autorität loszulösen. Wir müssen entscheiden, ob wir versuchen, die Reste des östlichen Kerns von [GetCharacter('(int32)37').GetPraenomen] zusammenzuhalten, oder ob wir das Schicksal unserer Dynastie durch eine Verbindung mit den Griechen im Westen in deren Hände legen."
 diadochi_flavor.8.a:0 "Wir werden zurückkommen, um zurückzufordern, was verloren ging."
 diadochi_flavor.8.at:0 "Alle antigonidischen Territorien abgesehen von [GetProvince('(int32)418').GetArea.GetRegion.GetName|Y] und [GetProvince('(int32)331').GetArea.GetName|Y] können #R unter anderen Diadochen aufgeteilt#! werden."
 diadochi_flavor.8.at1:1 "#R [GetProvince('(int32)244').GetArea.GetRegion.GetName|Y] wird von #Y [GetCountry('TRE').GetName]#! @[GetCountry('TRE').GetFlag]!#! übernommen"
 diadochi_flavor.8.at2:1 "#R [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y] wird von #Y [GetCountry('EGY').GetName]#! @[GetCountry('EGY').GetFlag]!#! übernommen"
 diadochi_flavor.8.at3:1 "#R [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y] und [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y] werden von #Y [GetCountry('SEL').GetName]#! @[GetCountry('SEL').GetFlag]!#! übernommen"
 diadochi_flavor.8.at31:1 "#R [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y] wird von #Y [GetCountry('SEL').GetName]#! @[GetCountry('SEL').GetFlag]!#! übernommen"
 diadochi_flavor.8.at32:1 "#R [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y] wird von #Y [GetCountry('SEL').GetName]#! @[GetCountry('SEL').GetFlag]!#! übernommen"
 diadochi_flavor.8.at33:1 "#R [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y] wird von #Y [GetCountry('SEL').GetName]#! @[GetCountry('SEL').GetFlag]!#! übernommen"
 diadochi_flavor.8.at4:1 "#R #Y Karien#! und die östliche Kernlandregion [GetProvince('(int32)1883').GetArea.GetRegion.GetName|Y] werden von #Y [GetCountry('MAC').GetName]#! @[GetCountry('MAC').GetFlag]!#! übernommen"
 diadochi_flavor.8.at5:2 "#R [GetProvince('(int32)244').GetArea.GetRegion.GetName|Y] wird von #Y [GetCountry('TRE').GetName]#! @[GetCountry('TRE').GetFlag]!#! übernommen"
 diadochi_flavor.8.tt:1 "#R [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y] und [GetProvince('(int32)1936').GetArea.GetRegion.GetName|Y] laufen als Satrapien zu #Y [GetCountry('TRE').GetName]#! @[GetCountry('TRE').GetFlag]!#! über"
 diadochi_flavor_will_be_seized:0 "wird übernommen von:"
 diadochi_flavor.8.at6:1 "#R Das westliche Kernland [GetProvince('(int32)1883').GetArea.GetRegion.GetName|Y] wird von #Y [GetCountry('TRE').GetName]#! @[GetCountry('TRE').GetFlag]!#! übernommen"
 diadochi_flavor.8.b:0 "Wir geben nicht eine einzige Stadt auf!"
 diadochi_flavor.8.bt:1 "Es besteht die Möglichkeit, dass antigonidische Territorien in [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)244').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)418').GetArea.GetRegion.GetName|Y] und [GetProvince('(int32)331').GetArea.GetName|Y] #R zwischen anderen Diadochen aufgeteilt werden#!."
 diadochi_flavor.8.bt1:1 "#R [GetProvince('(int32)331').GetArea.GetName|Y] wird von #Y [GetCountry('EGY').GetName]#! @[GetCountry('EGY').GetFlag]!#! übernommen"
 diadochi_flavor.8.bt2:1 "#R [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y] und [GetProvince('(int32)331').GetArea.GetName|Y] werden von #Y [GetCountry('EGY').GetName]#! @[GetCountry('EGY').GetFlag]!#! übernommen"
 diadochi_flavor.8.bt4:2 "#R [GetProvince('(int32)418').GetArea.GetRegion.GetName|Y] und #Y Karien#! $diadochi_flavor_will_be_seized$ #Y [GetCountry('MAC').GetName]#! @[GetCountry('MAC').GetFlag]!#!"
 diadochi_flavor.8.c:0 "Die Antigoniden sind besiegt, aber andere haben einen Plan!"
 diadochi_flavor.8.ct:0 "Wir spielen als #Y Pergamon#! weiter, angeführt von [attalid_head.GetName|Y]."
 diadochi_flavor.8.ct2:0 "Pergamon wird zur Satrapie von @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName|Y]"
  
 diadochi_flavor.9.t:1 "Die [GetCountry('PRY').GetAdjective]e Sache"
 diadochi_flavor.9.desc:1 "Mit dem Tod von [GetCharacter('(int32)39').GetPraenomen] dem Einäugigen steht der Staat, der aus einer kleinen phrygischen Satrapie errichtet wurde, nun zum ersten Mal ohne Gründer da. Der rasante Aufstieg von [GetCharacter('(int32)37').GetPraenomen] rief den Neid und die Bewunderung einer ganzen Generation hervor, und dieses Erbe wird unseren Herrschern auch in kommenden Generationen zugutekommen."
 diadochi_flavor.9.a:0 "Lang lebe der König!"
 claims_on_trans_indus_tooltip:1 "Das Argeadenreich erhält Ansprüche auf die Region [GetProvince('(int32)4428').GetArea.GetRegion.GetName|Y]."
 diadochi_flavor.10.t:0 "Krönung von [ROOT.GetCountry.GetRuler.GetPraenomen]"
 diadochi_flavor.10.desc:1 "Nachdem [ROOT.GetCountry.GetSuccession.GetPrimaryHeir.GetPraenomen] die ägyptische Flotte bei Salamis geschlagen hatte, entsandt [ROOT.GetCountry.GetSuccession.GetPrimaryHeir.GetSheHe] [ROOT.GetCountry.GetSuccession.GetPrimaryHeir.GetHerHis]en vertrautesten Offizier, Aristodemos aus Miletos, mit der Nachricht über unseren großen Sieg. Aristodemos betitelte [ROOT.GetCountry.GetRuler.GetPraenomen] als [ROOT.GetCountry.GetRulerTitle] vor der versammelten Menge und das Volk freute sich. Die Krönung folgte schnell und [ROOT.GetCountry.GetRuler.GetPraenomen] ist nun allen als [ROOT.GetCountry.GetRulerTitle] bekannt.\n\nNun jedoch hat [ROOT.GetCountry.GetRuler.GetPraenomen] die Nachricht erreicht, dass [ROOT.GetCountry.GetSuccession.GetPrimaryHeir.GetPraenomen], [ROOT.GetCountry.GetSuccession.GetPrimaryHeir.Custom('get_DieDer')] zum Zweitkönig gekrönt wurde, sich über die anderen Diadochi lustig macht und ihnen abfällige Titel verliehen hat. Darunter sind Seleukos "Kommandant der Elefanten", Ptolemaios "der Admiral", Lysimachos "der Schatzmeister" und Agathokles "Statthalter von Sizilien", selbst wenn dieser gar keiner von uns ist. Sollten sie davon hören, werden sie sicherlich wenig erfreut sein ..."
 diadochi_flavor.10.a:0 "Sie werden sowieso alle ihr Knie beugen!"
 diadochi_flavor.10.b:1 "[ROOT.GetCountry.GetSuccession.GetPrimaryHeir.GetPraenomen] soll sich lieber auf den Sieg konzentrieren."
 diadochi_flavor.11.t:1 "Nachrichten von den Antigoniden"
 diadochi_flavor.11.desc:1 "Unser Hofspitzel betritt den Thronsaal und gestikuliert, dass er mit unserem Herrscher sprechen möchte. Er bringt Nachrichten von den Antigoniden. Die Schlacht bei Salamis war für uns ein katastrophaler Verlust und der größte Teil unserer Flotte wurde vor der Küste Zyperns versenkt. Darüber hinaus hält [GetCharacter('(int32)37').GetPraenomen] dies offenbar für eine solche Leistung, dass er sich nach seinem Sieg bei Salamis über die ägyptische Flotte selbst zum Basileus krönen ließ und jeden Anspruch der #E Argeaden#!-Nachfolge offiziell abweist. Der Thron von [GetCharacter('(int32)39').GetPraenomen]' Reich liegt offen vor ihm.\n\nDer Hofspitzel hat jedoch noch weitere Neuigkeiten. Es scheint, dass [GetCharacter('(int32)39').GetPraenomen]' Erbe [GetCharacter('(int32)38').GetPraenomen] die anderen Diadochi verleumdet hat und ihnen unschöne Titel gegeben hat. Darunter waren [GetCharacter('(int32)24').GetPraenomen] "Meister der Elefanten" [GetCharacter('(int32)41').GetPraenomen], "der Schatzmeister" und [GetCharacter('(int32)56').GetPraenomen] "Statthalter von Sizilien", selbst wenn dieser gar keiner von uns ist. [ROOT.GetCountry.GetRuler.GetPraenomen] fragt seinen Hofspitzel daraufhin, welcher Titel ihm verliehen wurde. Der Hofspitzel schweigt für einen Moment und antwortet dann mit "Admiral", woraufhin [ROOT.GetCountry.GetRuler.GetPraenomen] Lachen im ganzen Thronsaal hallt." #pause
 diadochi_flavor.11.a:0 "Als Antwort darauf krönen wir uns selbst zum Götterkönig!"
 diadochi_flavor.11.b:0 "Admiral, hm?"
 diadochi_flavor.12.t:1 "$diadochi_flavor.11.t$"
 diadochi_flavor.12.desc:1 "Unser Hofspitzel betritt den Thronsaal und gestikuliert, dass er mit unserem Herrscher sprechen möchte. Er bringt Nachrichten von den Antigoniden. Scheinbar hat sich Antigonos nach seinem Sieg gegen die ägyptische Flotte bei Salamis selbst zum Basileus gekrönt und damit jeden Anspruch der Argeaden-Nachfolge offiziell abgewiesen. Der Thron von Alexanders Reich liegt offen vor ihm.\n\nDer Hofspitzel hat jedoch noch weitere Neuigkeiten. Es scheint, dass Antigonos Erbe Demetrios die anderen Diadochi verleumdet hat und ihnen unschöne Titel gegeben hat. Darunter waren Seleukos, "Kommandant der Elefanten", Ptolemaios, "der Admiral" und Lysimachos "der Schatzmeister". Es scheint jedoch, dass wir aufgrund unseres jüngsten Anspruchs auf den Titel "König von Sizilien" mit einem eigenen Titel geehrt wurden. Agathokles fragt seinen Hofspitzel, welcher Titel ihm verliehen wurde. Der Hofspitzel schweigt einen Moment und antwortet dann "Statthalter von Sizilien", woraufhin Agathokles Lachen im ganzen Thronsaal hallt."
 diadochi_flavor.12.a:0 "Ich bin KÖNIG von Sizilien!"
 diadochi_flavor.12.b:0 "Statthalter, hm?"
 diadochi_flavor.13.t:1 "$diadochi_flavor.11.t$"
 diadochi_flavor.13.desc:1 "Unser Hofspitzel betritt den Thronerraum und gestikuliert, dass er mit unserem Herrscher sprechen möchte. Er bringt Nachrichten von den Antigoniden. Scheinbar hat sich Antigonos nach seinem Sieg gegen die ägyptische Flotte bei Salamis selbst zum Basileus gekrönt und damit jeden Anspruch der Argeaden-Nachfolge offiziell abgewiesen. Der Thron von Alexanders Reich liegt offen vor ihm.\n\nDer Hofspitzel hat jedoch noch weitere Neuigkeiten. Es scheint, dass Antigonos Erbe Demetrios die anderen Diadochi verleumdet hat und ihnen unschöne Titel gegeben hat. Darunter waren Ptolemaios "der Admiral", Lysimachos, "der Schatzmeister" und Agathokles "Statthalter von Sizilien", selbst wenn dieser gar keiner von uns ist. Seleukos fragt seinen Hofspitzel daraufhin, welcher Titel ihm verliehen wurde. Der Hofspitzel schweigt für einen Moment und antwortet dann mit "Kommandant der Elefanten", woraufhin Seleukos Lachen im ganzen Thronsaal hallt."
 diadochi_flavor.13.a:0 "Wir sind Herrscher über ganz Asien!"
 diadochi_flavor.13.b:0 "Elefanten, hm?"
  
 diadochi_flavor.14.t: "Schlechte Nachrichten von den Antigoniden"
 diadochi_flavor.14.desc: "Unser Spionagemeister betritt den Thronsaal und deutet an, dass er mit unserem Herrscher über Neuigkeiten von den Antigoniden sprechen möchte. Anscheinend hat sich [GetCharacter('(int32)37').GetPraenomen] hat sich nach seinem Sieg bei Salamis zum Basileus krönen lassen. Jeder Vorwand einer #E Argeaden#!-Nachfolge wurde offiziell beiseite geschoben und der Thron von [GetCharacter('(int32)39').GetPraenomen]s Imperium ist zum Greifen nahe. \n \nDer Spionagemeister hat jedoch noch mehr Neuigkeiten. [GetCharacter('(int32)37').GetPraenomen]' Erbe [GetCharacter('(int32)38').GetPraenomen] hat die anderen Diadochen verleumdet und ihnen wenig schmeichelhafte Titel verliehen. [GetCharacter('(int32)24').GetPraenomen] 'der Elefantengeneral', [GetCharacter('(int32)42').GetPraenomen] 'der Admiral' und sogar [GetCharacter('(int32)56').GetPraenomen] 'der Gouverneur von Sizilien', obwohl er keiner von uns ist. [ROOT.GetCountry.GetRuler.GetPraenomen] fragt seinen Spionagemeister, welcher Titel ihm verliehen wurde. Das Gesicht des Spionagemeisters wird so weiß wie frisch gefallener Schnee in den Bergen von Odrysien, aber er steigt die Stufen hinauf und flüstert [ROOT.GetCountry.GetRuler.GetPraenomen] ins Ohr. [ROOT.GetCountry.GetRuler.GetPraenomen] selbst wird rot vor Wut und brüllt seinen Spionagemeister an. 'der Schatzmeister!? Wie kann er es wagen, mich Schatzmeister zu nennen!?' Ein Hauch von Kichern und Glucksen erfüllt den Thronsaal."
 diadochi_flavor.14.a: "'Ich bin KEIN Eunuch!'"
 diadochi_flavor.14.b: "'Wir werden ihm zeigen, wie männlich wir sind!'"
  
 diadochi_flavor.15.t: "Krieg in [GetProvince('(int32)418').GetArea.GetRegion.GetName]"
 diadochi_flavor.15.desc: "Nach der herakleischen Anstrengung, die die Belagerung von [GetProvince('(int32)266').GetName] kennzeichnete, richteten die Antigoniden ihre Augen nach Westen. Die freien Stadtstaaten von [GetProvince('(int32)418').GetArea.GetRegion.GetName] wurden zu einem disziplinierten Bündnis zusammengeschlossen, mit dem einzigen Ziel, den skrupellosen [GetCharacter('(int32)32').GetPraenomen] und die Überreste seiner Streitkräfte, die immer noch in Makedonien präsent sind, einzuhegen. \n\n Nach einer kurzen Kampfpause bestehen die von Antigonos angeführten Generäle nun darauf, dass die Zeit reif ist, eine Offensive gegen [GetCharacter('(int32)38').GetPraenomen] zu führen, ungeachtet der Bedrohung durch die weiteren Diadochen anderswo."
 diadochi_flavor.15.a: "[GetCharacter('(int32)32').GetPraenomen] wird den Tag bereuen."
 diadochi_flavor.15.b: "Wir müssen uns woanders konzentrieren."
 diadochi_flavor.15.b.tooltip: "#R Die Antigoniden ziehen sich aus [GetProvince('(int32)418').GetArea.GetRegion.GetName]  zurück!#!"
 no_longer_champion_of_free_greeks: "Indem wir die freien Griechen im Stich lassen, könnten wir in Zukunft mit Unruhen zu Hause konfrontiert werden."
 macedon_war_choice:0 "#R Dies könnte zu einem Krieg führen.#!"
 macedon_back_down:0 "#R Unser Volk wird weniger von uns halten, wenn wir einen Rückzieher machen.#!"
  
 diadochi_flavor.16.t: "[GetCountry('PRY').GetAdjective]e Segel"
 diadochi_flavor.16.desc: "Unsere Soldaten an der Küste haben begonnen, eine große Masse von [GetCountry('PRY').GetAdjective]en Segeln am Horizont zu melden. [GetCountry('PRY').GetName] musste nach der Belagerung von Rhodos seine Aufmerksamkeit wieder auf Makedonien richten, und unsere Generäle drängen uns zu einem raschen Handeln. \n\nDie gemäßigteren Mitglieder unseres Rates schlagen allerdings vor, dass wir uns ein wenig Zeit erkaufen könnten, indem wir unsere letzten verbleibenden Besitztümer auf dem Peloponnes abgeben und effektiv jede Hoffnung fahren lassen, die Dominanz über den sogenannten Hellenischen Bund zurückzugewinnen."
 diadochi_flavor.16.a: "Wir können den Krieg nicht für immer aufschieben."
 diadochi_flavor.16.b: "Wir müssen Zeit gewinnen, um uns vorzubereiten!"
  
 diadochi_flavor.17.t: "[GetCountry('PRY').GetAdjective]e Friedensbotschafter"
 diadochi_flavor.17.desc: "In einer schockierenden Wendung der Ereignisse erschien ein [GetCountry('PRY').GetAdjective]er Botschafter unter einer Waffenstillstandsflagge an unseren Grenzen. \n \nEr behauptet, dass der [GetCountry('PRY').GetAdjective]en Sache nicht durch einen Krieg mit dem [GetCountry('MAC').GetAdjective]en Königreich gedient sei und dass alle ihre Armeen aus [GetProvince('(int32)418').GetArea.GetRegion.GetName] abgezogen würden. \n \nUnsere Generäle sind sich einig, dass ein kurzer Waffenstillstand eine praktikable Option ist, dies wird es den [GetCountry('PRY').GetAdjective]en Truppen ermöglichen, sich zurückzuziehen, während der Rest von [GetProvince('(int32)418').GetArea.GetRegion.GetName] offen bleibt, um von uns zurückgefordert zu werden. Wir werden die Entwicklung mit Interesse verfolgen."
 diadochi_flavor.17.a: "So sei es."
 diadochi_flavor.17.a.tt: "@[antigonids_scope.GetFlag]![antigonids_scope.GetName|Y] [GetProvince('(int32)418').GetArea.GetRegion.GetName] hat in der Region kein Territorium oder Untertanen mehr."
  
 diadochi_flavor.18.t:1 "Konzession von [GetProvince('(int32)418').GetName]"
 diadochi_flavor.18.desc:2 "In einem höchst ungewöhnlichen Schritt trat der auf dem [GetCountry('MAC').GetAdjective]en Thron sitzende Taugenichts die [GetProvince('(int32)418').Custom('get_city_type_loc')] [GetProvince('(int32)418').GetName] als Gegenleistung für einen Waffenstillstand ab.\n\nUnser Diplomat nahm dieses Angebot zu Recht an, ohne auf eine Bestätigung zu warten. Unsere Machtbasis in [GetProvince('(int32)418').GetArea.GetRegion.GetName] wird immer stärker."
 diadochi_flavor.18.a:0 "Vorzüglich."
  
  diadochi_flavor.19.t:1 "Krieg in [GetProvince('(int32)418').GetArea.GetRegion.GetName]"
 diadochi_flavor.19.desc:2 "[GetCountry('PRY').GetName] beschloss in Selbstüberschätzung und Torheit, die Feindseligkeiten mit [GetCharacter('(int32)32').GetName] von Makedonien wiederaufzunehmen. Es hofft so, seine Dominanz über die sogenannten Diadochen zu beweisen.\n\nWir können nur abwarten, welche Auswirkungen dies auf die Politik der bekannten Welt haben wird und wie viele Söhne sterben müssen, um den Blutdurst der Tyrannenkönige zu stillen."
 diadochi_flavor.19.a:0 "Das sind beunruhigende Nachrichten."
  
 diadochi_flavor.20.t:1 "In Verteidigung von [GetCharacter('(int32)32').GetName]"
 diadochi_flavor.20.desc:2 "Der lange Krieg wütet weiter, und unsere Generäle versichern uns, es sei an der Zeit, uns gegen die [GetCountry('PRY').GetAdjective]e Bedrohung zu erheben.\n\nEine nachdenkliche Stimme im hinteren Teil des Kriegsrats erinnert jedoch daran, dass vielleicht eine Vereinbarung mit [GetCountry('PRY').GetName] getroffen werden könnte, das sehr damit beschäftigt scheint, [GetCharacter('(int32)32').GetName] auf dem Peloponnes Herr zu werden."
 diadochi_flavor.20.a:0 "Unsere Versprechen müssen eingehalten werden."
 diadochi_flavor.20.b:0 "Vielleicht lässt sich hier ein Abkommen erzielen..."
 offer_will_be_sent_egy:2 "Ein Angebot für den Austausch von @[GetCountry('PRY').GetFlag]! #Y [GetCountry('PRY').GetAdjective]em#! Territorium wird unterbreitet.#!\nWenn sie ablehnen:"
 diadochi_flavor.20.c:0 "Warten wir besser ab und sehen, wie sich die Dinge entwickeln."
 passive_egypt_tt:0 "Wir werden uns vorerst nicht an den Diadochenkriegen beteiligen."
  
 diadochi_flavor.21.t: "[GetCharacter('(int32)42').GetName] etzt sich in Bewegung"
 diadochi_flavor.21.desc: "Wir wissen nicht, ob es zur Verteidigung des schwachen Paktes zwischen [GetCountry('MAC').GetName] und [GetCountry('EGY').GetName] oder aus reinem Eigennutz geschehen ist. Wir wissen nur, dass [GetCountry('EGY').GetName] vom Süden aus auf [GetCountry('PRY').GetName] zumarschiert.\n\nDie Zukunft des einst großen Reichs von [GetCharacter('(int32)39').GetName] scheint immer mehr ins Wanken zu geraten."
 diadochi_flavor.21.a: "Diese Hybris..."
  
 diadochi_flavor.22.t: "Ptolemäisches Ultimatum"
 diadochi_flavor.22.desc: "Während der Krieg in [GetProvince('(int32)418').GetArea.GetRegion.GetName] wütet, unternimmt der heimtückische [GetCountry('EGY').GetRuler.GetPraenomen] einen Zug: Ein Gesandter des Königreichs der Sonne und des Adlers traf heute mit einem verlockenden Angebot ein.\n\nIm Austausch für einige unserer Territorien in [GetProvince('(int32)790').GetArea.GetRegion.GetName] und [GetProvince('(int32)714').GetArea.GetRegion.GetName] ist [GetCountry('EGY').GetName] bereit, einen formellen Waffenstillstand zu unterzeichnen, der uns die Möglichkeit gibt, den jämmerlichen [GetCountry('MAC').GetRuler.GetPraenomen] ein für alle Mal zu besiegen.""
 diadochi_flavor.22.a: "Wir können uns in diesem Krieg keine weitere Front leisten."
 diadochi_flavor.22.b: "Niemals! Unsere Sache ist gerecht!"
  
 diadochi_flavor.23.t: "[GetCountry('PRY').GetAdjective]e Zugeständnisse"
 diadochi_flavor.23.desc: "In einer überraschenden Wendung der Ereignisse scheinen die [GetCountry('PRY').GetAdjective]en Herrscher so sehr mit [GetProvince('(int32)418').GetArea.GetRegion.GetName] beschäftigt zu sein, um unsere unverschämten Forderungen nicht ablehnen zu können. \n\nIhr Gesandter stimmt widerwillig zu, im Gegenzug für einen Waffenstillstand #E Megara#!, #E [GetProvince('(int32)687').GetArea.GetRegion.GetName]#! und #E [GetProvince('(int32)790').GetArea.GetRegion.GetName]#! abzutreten, während ihre Armeen damit beschäftigt sind, den heimtückischen [GetCharacter('(int32)32').GetName] und seine Sippe zu bekämpfen."
 diadochi_flavor.23.a: "Hervorragende Nachrichten!"
  
 diadochi_flavor.24.t: "[GetCountry('PRY').GetAdjective]e Zugeständnisse an das [GetCountry('EGY').GetAdjective]e Königreich"
 diadochi_flavor.24.desc: "Die Passatwinde bringen beunruhigende Kunde: Die Antigoniden haben viele ihrer Territorien in [GetProvince('(int32)687').GetArea.GetRegion.GetName] und [GetProvince('(int32)790').GetArea.GetRegion.GetName] an die Lagiden abgetreten, vermutlich in der Hoffnung, einen langen Waffenstillstand zu erreichen, um [GetCharacter('(int32)32').GetName] und seinen Verbündeten in Makedonien dzu besiegen.\n\nDie Diadochen stoßen sich weiterhin in geübter Manier wechselseitig Dolche in den Rücken."
 diadochi_flavor.24.a: "Höchst beunruhigend."
 transfer_phrygian_lands_egy_tt: "[GetCountry('PRY').GetAdjective|Y]e Ländereien in [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)331').GetArea.GetName|Y], [GetProvince('(int32)750').GetArea.GetName|Y] und [GetProvince('(int32)743').GetArea.GetName|Y] werden an [GetCountry('EGY').GetName|Y] abgetreten."
 transfer_antigonid_lands_egy_tt: "#Y [GetCountry('PRY').GetName]#! hat die Kontrolle über #E Megara#!, #E Die Inseln#! und #E Koile Syrien#! an das #Y Ptolemäische Königreich#! abgetreten." #ntu!

  
 diadochi_flavor.25.t: "Krieg in [GetProvince('(int32)418').GetArea.GetRegion.GetName]"
 diadochi_flavor.25.desc: "In seiner typischen arroganten Art hat [GetCharacter('(int32)32').GetName] den Krieg der Vernunft vorgezogen. Das [GetCountry('MAC').GetAdjective]e Königreich bereitet sich auf einen Krieg mit uns vor."
 diadochi_flavor.25.a: "Wir werden ihm ein Ende bereiten."
 diadochi_flavor.25.at:1 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetName|Y] befindet sich nun im Krieg mit @[GetCountry('MAC').GetFlag]! [GetCountry('MAC').GetName|Y]"
 diadochi_flavor.26.t: "Ultimatum abgelehnt"
 diadochi_flavor.26.desc: "[GetCountry('PRY').GetName] hat unser Angebot abgelehnt, und deshalb droht nun erneut ein Krieg um [GetProvince('(int32)687').GetArea.GetRegion.GetName] auszubrechen." 
 diadochi_flavor.26.a: "Diese Hybris..."
  
 diadochi_flavor.27.t: "Zeit für den Angriff"
 diadochi_flavor.27.desc: "Die Antigoniden sind im Westen in Konflikte verwickelt. Das ist vielleicht die Gelegenheit, nach der wir gesucht haben, um ihrer erbärmlichen Dynastie endlich ein Ende zu bereiten. Unsere Berater empfehlen, sofort zuschlagen und mit aller Kraft und mit aller Kraft in Syrien einzufallen. \n\nAbseits unserer Heimat zu agieren, birgt allerdings auch Gefahren, und vielleicht reicht ein Ultimatum, um den Zugang zum Mittelmeer zu sichern. Weitere Eroberungen können für einen späteren Zeitpunkt geplant werden."
 diadochi_flavor.27.a: "Wir müssen jetzt zuschlagen!"
 diadochi_flavor.27.b: "Schicken wir einen Boten zu [GetCharacter('(int32)37').GetPraenomen]."
 offer_will_be_sent_to_pry: "Schickt ein Angebot für den Austausch von @[GetCountry('PRY').GetFlag]! #Y [GetCountry('PRY').GetAdjective]em#! Territorium und verlangt, dass sie ihre Provinzen [GetProvince('(int32)818').GetArea.GetName|Y], [GetProvince('(int32)790').GetArea.GetName|Y], [GetProvince('(int32)810').GetArea.GetName|Y], [GetProvince('(int32)777').GetArea.GetName|Y], [GetProvince('(int32)754').GetArea.GetName|Y] und [GetProvince('(int32)779').GetArea.GetName|Y] an uns abzutreten. \nWenn sie #R ablehnen#!:"
 diadochi_flavor.27.c: "Im Frieden sind wir stärker..." 
 passive_seleukids_tt: "Wir werden uns an dieser Runde der Diadochenkriege vorerst nicht beteiligen." 
  
 diadochi_flavor.28.t: "Ein Bote aus [GetCountry('SEL').GetName]"
 diadochi_flavor.28.desc: "Unser Konflikt im Westen ist im [GetCountry('SEL').GetName] nicht unbemerkt geblieben. Heute ist ein Bote eingetroffen, der verkündet, dass die Seleukiden bereit sind, unsere Feinde zu unterstützen, die sich unserem Anspruch auf das Reich von [GetCharacter('(int32)39').GetName] widersetzen und erneut im Osten gegen uns in den Krieg ziehen würden. \n\nDer Gesandte bringt aber auch ein Angebot: \nWenn wir [GetProvince('(int32)790').GetArea.GetRegion.GetName] aufgeben, willigen sie ein, sich vorerst zurückzuhalten und uns unsere Differenzen mit den anderen Diadochen ohne ihre direkte Beteiligung beilegen zu lassen.\nDer Bote macht klar, dass dies auch bedeutet, dass wir unsere große Hauptstadt Antigoneia aufgeben müssen. Ob die Seleukiden erwarten, dass wir dies als etwas anderes als eine Beleidigung auffassen, ist da schon weit weniger deutlich."
 diadochi_flavor.28.a: "Wir müssen einen Krieg im Osten um jeden Preis vermeiden."
 diadochi_flavor.28.b: "Das ist nichts als eine Beleidigung!"
  
 diadochi_flavor.29.t: "[GetCountry('SEL').GetAdjective]e Invasion"
 diadochi_flavor.29.desc: "Der Konflikt zwischen den Diadochen flammt erneut auf, als [GetCountry('SEL').GetAdjective]e Armeen die [GetCountry('PRY').GetAdjective]e Grenze nach [GetProvince('(int32)790').GetArea.GetRegion.GetName] überqueren.\n\nDie Elefanten von [GetCountry('SEL').GetRuler.GetName] könnten es vielleicht schaffen, den einäugigen Riesen zu stürzen, der über [GetCountry('PRY').GetName] herrscht." 
 diadochi_flavor.29.a: "Wird es jemals enden?"
 diadochi_flavor.29.b: "Wenn sie unser Land wollen, müssen sie es sich nehmen!"
  
 diadochi_flavor.30.t: "Krieg mit [GetCountry('SEL').GetName]"
 diadochi_flavor_30.desc: "Zweifellos hat er unseren Konflikt im Westen bemerkt, denn [GetCharacter('(int32)24').GetName] hat seine Armeen versammelt und marschiert Berichten zufolge an unsere Grenzen. Wir müssen jetzt wieder einen Zweifrontenkrieg führen."
 diadochi_flavor_30.a: "Sie werden es bereuen!"
 diadochi_flavor_30.at:1 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetName|Y] befindet sich nun im Krieg mit @[GetCountry('SEL').GetFlag]! [GetCountry('SEL').GetName|Y]"

 diadochi_flavor.31.t: "Krieg mit dem [GetCountry('EGY').GetAdjective|Y]en Königreich"
 diadochi_flavor.31.desc: "Während der Krieg in [GetProvince('(int32)418').GetArea.GetRegion.GetName] tobt, ternimmt auch der heimtückischege [GetCharacter('(int32)42').GetName] seinen Zug. Die [GetCountry('EGY').GetAdjective]en Armeen nähern sich unseren Grenzen und es ist klar, dass dieser Konflikt nun wieder einen südlichen Schauplatz umfasst."
 diadochi_flavor.31.a: "Unverschämtheit!"
 diadochi_flavor_31.at:1 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetName|Y] befindet sich nun im Krieg mit @[GetCountry('EGY').GetFlag]! [GetCountry('EGY').GetName|Y]"
  
 diadochi_flavor.32.t: "[GetCountry('PRY').GetName] lehnt ab"
 diadochi_flavor.32.desc: "Ein [GetCountry('PRY').GetAdjective]er Bote ist heute eingetroffen und hat unser großzügiges Angebot, Blutvergießen zu vermeiden, trotzig abgelehnt. Die Antigoniden bereiten sich darauf vor in den Krieg zu ziehen, um ihr hart erkämpftes Reich zu verteidigen ..."
 diadochi_flavor.32.a: "Das kann nur Krieg bedeuten."
  
 diadochi_flavor.33.t: "[GetCountry('PRY').GetAdjective]e Zugeständnisse"
 diadochi_flavor.33.desc: "Überraschenderweise scheinen sich die Antigoniden entschieden zu haben, unseren Forderungen nachzugeben. \n\nSie stimmen widerwillig zu, Gebiete in [GetProvince('(int32)790').GetArea.GetRegion.GetName] und [GetProvince('(int32)918').GetArea.GetRegion.GetName] als Gegenleistung für einen Waffenstillstand abzutreten."
 diadochi_flavor.33.a: "Das sind ausgezeichnete Neuigkeiten!"
 transfer_phrygian_lands_sel_tt: "[GetCountry('PRY').GetAdjective|Y]e Ländereien in [GetProvince('(int32)818').GetArea.GetName|Y], [GetProvince('(int32)790').GetArea.GetName|Y], [GetProvince('(int32)810').GetArea.GetName|Y], [GetProvince('(int32)777').GetArea.GetName|Y], [GetProvince('(int32)754').GetArea.GetName|Y] und [GetProvince('(int32)779').GetArea.GetName|Y] werden an @[GetCountry('SEL').GetFlag]! [GetCountry('SEL').GetName|Y] abgetreten!"
  
 diadochi_flavor.34.t: "[GetCountry('PRY').GetAdjective]e Zugeständnisse an [GetCountry('SEL').GetName]"
 diadochi_flavor.34.desc: "[GetCountry('PRY').GetName] hat viele seiner Territorien in [GetProvince('(int32)790').GetArea.GetRegion.GetName] und [GetProvince('(int32)918').GetArea.GetRegion.GetName] an [GetCountry('SEL').GetName] abgetreten, vermutlich in der Hoffnung, den Konflikt im Osten abzuwenden, während sie ihren Krieg im Westen führen. \n\nEs scheint, dass [GetCharacter('(int32)24').GetPraenomen] wieder einmal einem Freund in den Rücken gefallen ist."
 diadochi_flavor.34.a: "Höchst beunruhigend."
  
 diadochi_flavor.35.t: "Freiheit?"
 diadochi_flavor.35.desc: "Unser Oberherr hat sich aus dieser Region zurückgezogen und seine Festungen an eine gegnerische Diadochen-Fraktion abgetreten. Ein Abgesandter vom [GetCountry('PRY').GetAdjective]en Hof ist heute, fast wie als Nachgedanke in diesem allgemein eher hastigen Rückzug, bei uns eingetroffen, um uns wissen zu lassen, dass wir keinen Schutz mehr genießen und keine Form von Tribut mehr entrichten sollen."
 diadochi_flavor.35.a: "Wir sind frei, aber sind wir sicher?"
 freedom_tooltip: "Wir sind nicht länger ein Untertanenstaat von @[GetCountry('PRY').GetFlag]![GetCountry('PRY').GetName|Y]!."
  
 diadochi_flavor.36.t: "Beschützer der Griechen?"
 diadochi_flavor.36.desc: "Der Rückzug der Antigoniden aus [GetProvince('(int32)418').GetArea.GetRegion.GetName] und ihr Versagen, ihren Ansprüchen gerecht zu werden, die freien griechischen Städte vor den anderen Diadochen zu schützen, veranlasst immer mehr Menschen in unserer eigenen Regierung, unsere Unterstützung für die [GetCountry('PRY').GetAdjective]e Sache zu überdenken. \n\nEinige argumentieren, dass [GetCountry('PRY').GetName] sich als schwach erwiesen hat und dass wir besser dran wären, als unabhängiger Staat unser eigenes Glück zu suchen. Als freie Griechen sollten wir das Recht haben, unser eigenes Schicksal zu lenken."
 diadochi_flavor.36.a: "Nein. Das würden sie niemals dulden."
 diadochi_flavor.36.a.tt: "[GetCountry('PRY').GetName] kann weiter auf unsere Loyalität zählen."
 diadochi_flavor.36.b: "Lasst uns wirklich frei sein."
 diadochi_flavor.36.b.tt: "#R Dies kann zu einem Krieg mit @[GetCountry('PRY').GetFlag]![GetCountry('PRY').GetName|Y] führen!.#!"
  
 diadochi_flavor.37.t:0 "Beschützer der Griechen?"
 diadochi_flavor.37.desc:1 "Unser Rückzug aus [GetProvince('(int32)418').GetArea.GetRegion.GetName] hat dazu geführt, dass viele uns nicht mehr als die Beschützer der freien griechischen Städte betrachten, als die wir uns ausgeben.\nDie Menschen von [freedom_tag.GetName] haben nun erklärt, dass sie als freie Griechen selbst über ihr Schicksal bestimmen wollen und unseren Schutz nicht mehr benötigen."
 diadochi_flavor.37.a:0 "Das bedeutet Krieg!"
 diadochi_flavor.37.b:0 "Es steht ihnen frei, jederzeit zu gehen."
 diadochi_flavor.38.t: "Krieg!"
 diadochi_flavor.38.desc: "Es scheint, dass all das Gerede über den Schutz der freien Griechen nur leere Worte waren. Die Antigoniden haben uns mitgeteilt, dass sie ihre Armeen darauf vorbereiten, uns zum Gehorsam zu zwingen."
 diadochi_flavor.38.a: "Die Welt wird von diesem Verrat erfahren!"
  
 diadochi_flavor.39.t:0 "Verrat der Ideale"
 diadochi_flavor.39.desc:2 "[GetCountry('PRY').GetName] hat den Traum von einer freien griechischen Welt verraten, indem es gegen [freedom_tag.GetName] in den Krieg gezogen ist, anstatt es sein eigenes Schicksal als freies Land suchen zu lassen.\n\nDas ist höchst beunruhigend."
 diadochi_flavor.39.a:0 "In der Tat sehr beunruhigend."
  
 diadochi_flavor.40.t:2 "[GetCountry('PRY').GetAdjective]e Schwachstellen"
 diadochi_flavor.40.desc:2 "Das Gezänk der anderen Diadochen geht weiter und stiftet erneut Aufruhr in der hellenischen Welt.\n\nWir haben uns bisher distanziert, doch unsere Generäle sind sich einig, dass wir die geteilte Aufmerksamkeit von [GetCountry('PRY').GetName] ausnutzen könnten. Vielleicht gelingt es uns sogar, [GetCountry('PRY').GetName] zu einem Abkommen zu bewegen, so beschäftigt, wie es bereits in [GetProvince('(int32)418').GetArea.GetRegion.GetName] ist."
 diadochi_flavor.40.a:2 "[GetCountry('PRY').GetName] muss einen Dämpfer erhalten."
 diadochi_flavor.40.b:0 "Holt die Schreiber."
 diadochi_flavor.40.c:0 "In Friedenszeiten sind wir stärker..."
 offer_will_be_sent_tre:2 "Ein Angebot für den Austausch von #Y [GetCountry('PRY').GetAdjective]em#! Territorium wird unterbreitet.#!\nWenn sie #R ablehnen#!:"
  
 diadochi_flavor.41.t:1 "[GetCharacter('(int32)41').GetPraenomen] wagt einen Zug"
 diadochi_flavor.41.desc:2 "Obwohl sie der schwächste Diadochenstaat sind, hat die [GetCountry('TRE').GetAdjective]e Satrapie überraschenderweise eine Invasion der [GetCountry('PRY').GetAdjective]en Besitztümer im Nordwesten von [GetProvince('(int32)290').GetArea.GetRegion.GetName] begonnen und damit eine nördliche Front für [GetCountry('PRY').GetName] geöffnet.\n\nSelbst [GetCharacter('(int32)39').GetPraenomen] dürfte überrascht sein, wie lange die Spiele als Folge seines Todes anhalten."
 diadochi_flavor.41.a:0 "Wir Menschen sind elende Kreaturen."
  
 diadochi_flavor.42.t:1 "Krieg mit [GetCountry('TRE').GetName]"
 diadochi_flavor.42.desc:1 "Da unsere Aufmerksamkeit auf anderen Dingen lag, haben die verräterischen Alkimachiden die Gelegenheit genutzt, um sich erneut in den Konflikt einzumischen. Thrakische Armeen dringen nach [GetProvince('(int32)290').GetArea.GetRegion.GetName] vor, was unsere ohnehin schon schwierige Lage noch verschlimmert ..."
 diadochi_flavor.42.a:0 "Feiglinge."
 diadochi_flavor.42.at:1 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetName|Y] befindet sich nun im Krieg mit @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName]"

 diadochi_flavor.43.t:0 "Abkommen mit den Alkimachiden"
 diadochi_flavor.43.desc:1 "Da unsere Aufmerksamkeit auf die anderen Nachfolger gerichtet war, hat es die erbärmliche Satrapie von [GetCharacter('(int32)41').GetPraenomen] gewagt, von uns zu verlangen, dass wir unsere westlich gelegenen Ländereien in [GetProvince('(int32)244').GetArea.GetRegion.GetName] in ihre Hände übergeben, wenn wir uns nicht einer Invasion aus dem Norden stellen wollen.\n\nIm Gegenzug dafür, dass wir ihnen die Kontrolle über den Norden überlassen, werden sie einen großzügigen Waffenstillstand vereinbaren, der uns Zeit gibt, uns auf den Sieg über [GetCharacter('(int32)32').GetPraenomen] zu konzentrieren ..."
 diadochi_flavor.43.a:0 "Wir sind zu überfordert, um dies aufzuhalten."
 diadochi_flavor.43.b:0 "Elende Geier!"
  
 diadochi_flavor.44.t:2 "[GetCountry('PRY').GetAdjective]e Zugeständnisse"
 diadochi_flavor.44.desc:2 "Zur Überraschung aller wurde unser Abkommen mit [GetCountry('PRY').GetName] akzeptiert! Sie müssen in der Tat verzweifelt sein, wenn sie unseren Drohungen so leicht nachgeben.\n\nIhr Gesandter hat sich gezwungenermaßen dazu bereit erklärt, das Territorium im Nordwesten, [GetProvince('(int32)290').GetArea.GetRegion.GetName], als Gegenleistung für einen Waffenstillstand abzutreten, damit sie [GetCharacter('(int32)32').GetPraenomen] und seinesgleichen in [GetCountry('MAC').GetName] erledigen können."
 diadochi_flavor.44.a:0 "Ausgezeichnet!"
  
 diadochi_flavor.45.t:0 "Abkommen abgelehnt"
 diadochi_flavor.45.desc:2 "[GetCountry('PRY').GetName] hat unser Angebot abgelehnt, sodass ein Krieg in Asien unvermeidlich ist..."
 diadochi_flavor.45.a:0 "Kaum eine Überraschung."
  
 diadochi_flavor.46.t: "Freiheit?" 
 diadochi_flavor.46.desc: "Unser Oberherr hat diese Region verlassen und seine Festungen einer gegnerischen Diadochen-Fraktion übergeben. Heute ist ein Abgesandter vom Hof der [GetCountry('PRY').GetAdjective]en Herrscher eingetroffen, fast wie ein nachträglicher Einfall bei diesem allgemeinen hastigen Rückzug, um uns mitzuteilen, dass wir keinen Schutz mehr genießen und von uns auch keine Form von Tribut erwartet wird." 
 diadochi_flavor.46.a: "Wir sind frei, aber sind wir sicher?"
  
 diadochi_flavor.47.t: "[GetCountry('PRY').GetAdjective]e Zugeständnisse an [GetCountry('TRE').GetName]"
 diadochi_flavor.47.desc: "Gerüchte von der Agora haben bestätigt, dass [GetCountry('PRY').GetName], von allen Seiten bedrängt, seine Territorien im Nordwesten, in [GetProvince('(int32)290').GetArea.GetRegion.GetName], als Gegenleistung für einen langen Waffenstillstand [GetCharacter('(int32)41').GetPraenomen] überlassen hat.\n\n[GetCountry('PRY').GetName] muss in der Tat schwer in Bedrängnis sein, wenn es einem so demütigenden Abkommen mit dem schwächsten Diadochen zuzustimmt..."
 diadochi_flavor.47.a: "Eine Wendung für die Geschichtsbücher."
 transfer_phrygian_lands_tre_tt: "@[GetCountry('PRY').GetFlag]! #Y [GetCountry('PRY').GetAdjective|Y] e#! Ländereien in [GetProvince('(int32)283').GetArea.GetName|Y], [GetProvince('(int32)292').GetArea.GetName|Y], [GetProvince('(int32)254').GetArea.GetName|Y], [GetProvince('(int32)278').GetArea.GetName|Y], [GetProvince('(int32)244').GetArea.GetName|Y] und [GetProvince('(int32)329').GetArea.GetName|Y], und [GetProvince('(int32)207').GetArea.GetName|Y] werden an @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName|Y] abgetreten."
  
 diadochi_flavor.48.t: "Eine gespaltener Bund"
 diadochi_flavor.48.desc: "[GetCountry('PRY').GetAdjective]e Rückschläge haben es dem [GetCountry('TRE').GetAdjective]en Königreich ermöglicht, Anspruch auf Kleinasien zu erheben und dabei die Städte entlang der Propontis zu erobern...\n\nDer Äolische Bund war einst ein loser Zusammenschluss von Städten, die durch eine gemeinsame Geschichte und gegenseitige Verteidigung verbunden waren. Doch mit den Kriegen der Diadochen, die das Festland verwüstet haben, ist das Band, das unsere Städte verbindet, schwach geworden. Mytilene, geschützt durch das Meer, ist sicherer als Elaia, das den Ambitionen der Eroberer ausgesetzt ist.\n\n Da die größten Nachfolger um die Vorherrschaft wetteifern, ist es klar, dass das Festland noch lange in Konflikte verwickelt sein wird. Vielleicht ist es für Lesbos an der Zeit, sich offiziell von den Kämpfen in Aeolis zu distanzieren. Wenn wir schnell handeln, können wir unsere alkimachidischen Oberherren davon überzeugen, die Autonomie von Lesbos zu bekräftigen, bevor das Chaos des Krieges uns völlig verschlingt."
 diadochi_flavor.48.a: "Lesbos muss seinen eigenen Weg gehen."
 diadochi_flavor.48.at: "#G Unser Vorschlag wird in den kommenden Wochen an @[GetCountry('TRE').GetFlag]!  [GetCountry('TRE').GetCapital.GetName|Y] übermittelt#!.\nSollten wir erfolgreich sein, geschieht Folgendes:\n #G schaltet#! #E Lesbische#! Aufgaben für den #E #T Missionsbaum 'Ionische Wiederbelebung'#! #G frei.#!" 
 diadochi_flavor.48.b: "Wir können Aeolis nicht im Stich lassen. " 

 LESBOS_NAME: "Lesbos" 
 LESBOS_ADJ: "Lesbisch" 
