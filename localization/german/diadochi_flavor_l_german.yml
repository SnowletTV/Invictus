 diadochi_flavor.51.desc_3: "\n\nDie Hartnäckigkeit der Antigoniden angesichts der erdrückenden Übermacht ist bedauerlich, doch unsere Truppen sind bereits auf dem Weg, um das alte Hinterland des Euphrats zu sichern."
 diadochi_flavor.51.desc_4: "\n\nUnsere Verhandlungen mit den anderen Diadochen haben unseren Anspruch auf [GetProvince('(int32)790').GetArea.GetRegion.GetName] und [GetCharacter('(int32)37').GetPraenomen]' neue Hauptstadt außer Zweifel gelassen, und unsere Verwalter stellen bereits sicher, dass die örtlichen Herrscher dieses Landes die [GetCountry('SEL').GetAdjective]e Autorität akzeptieren."
 diadochi_flavor.51.tt1: "@[GetCountry('PRY').GetFlag]![GetCountry('PRY').GetAdjective] [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y] $diadochi_flavor_have_been_seized$"
