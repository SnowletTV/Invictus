 epigoni.5.t: "Untergang von[agathocles_scope.GetPraenomen]: Unruhe"
 epigoni.5.desc: "Nach [ROOT.GetCountry.GetRuler.GetPraenomen]s Entscheidung, [agathocles_scope.GetPraenomen] aus der [ROOT.GetCountry.GetAdjective]en Nachfolge auszuschließen, brodelt die Unzufriedenheit unter den Anhängern von  [agathocles_scope.GetPraenomen] im hellespontinischen Phrygien. Berichten zufolge versammeln sie sich auf den Straßen und rufen: „Unserem Prinzen wurde Unrecht getan!“ Unterdessen schmiedet [thrace_wife_scope.GetPraenomen] weitere Pläne und flüstert [ROOT.GetCountry.GetRuler.GetPraenomen] zu, dass [agathocles_scope.GetPraenomen] angeblich eine Gefahr für die Stabilität des Königreichs darstellt. „Er ist eine Bedrohung für dein Erbe“, beharrt sie. „Man muss sich um ihn kümmern …“" 
 epigoni.5.a: "[agathocles_scope.GetPraenomen] verdient [agathocles_scope.GetHerHis]enrechtmäßigen Platz." 
 epigoni.5.at: "Alle Provinzen in den Regionen Asien und Bithynien erhalten Loyalität dazu"
 epigoni.5.at1: "#E [agathocles_scope.GetPraenomen]#! kehrt nach [ROOT.GetCountry.GetCapital.GetName] zurück und wird zum Erben ernannt" 
 epigoni.5.b: "Ein paar Tropfen Gift könnten diese Krise beenden." 
 epigoni.5.bt: "#E [agathocles_scope.GetPraenomen]#! überlebt den Versuch" 
 #chance he dies / or he will spit out the poison and launcch a war to claim his throne. he circulates proclamations saying that his father has gone mad under the influence of his wife 
