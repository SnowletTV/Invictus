 diadochi_flavor_49_intro: "Der Tod von [GetCharacter('(int32)37').GetPraenomen] hat, zusammen mit den jüngsten Rückschlägen, die Stabilität des Königreichs des Zyklopen erschüttert."
 diadochi_flavor.49.desc_1: "$diadochi_flavor_49_intro$ Sein Erbe und Mitkönig [antigonids_scope.GetRuler.GetPraenomen] hat jedoch geschworen, das Königreich zusammenzuhalten, trotz des Abfalls lokaler Regierungen zu den benachbarten Diadochen und der bröckelnden Unterstützung in [antigonids_scope.GetRuler.GetHerHis]en verbleibenden Besitztümern."
 diadochi_flavor.49.desc_2: "$diadochi_flavor_49_intro$ Sein Erbe und Mitkönig [antigonids_scope.GetRuler.GetPraenomen], unfähig, die Loyalität von [antigonids_scope.GetRuler.GetHerHis]en Untertanen zu erhalten, hat einen Großteil des Königreichs den Ansprüchen der anderen Diadochen überlassen, während [antigonids_scope.GetRuler.GetSheHe] sich zurückzieht, um [antigonids_scope.GetRuler.GetHerHis]en Wunden im Kreise [antigonids_scope.GetRuler.GetHerHis]er griechischen Freunden zu lecken." 
 diadochi_flavor.49.desc_3: "\n\nUnsere Truppen sind bis nach Kanaan vorgedrungen und haben die Kontrolle über die umkämpfte Region und ihre lokalen Herrscher bis nach Syrien gesichert – was zweifellos die [GetCountry('SEL').GetAdjective]en Gemüter erregen wird-,auch wenn die phönizischen Städte und die Garnison der Inselstadt Tyros den Antigoniden vorerst treu bleiben...\n\nEs gibt auch Berichte, dass die antigonidischen Truppen, die die seit langem umkämpfte Insel Zypern besetzten – die Antigonos so hartnäckig gegen unsere Vorstöße verteidigt hatte –, geflohen sind und dass eine Reihe loyaler Zyprioten die Ablenkung nutzen, um die Kontrolle über die Insel wiederherzustellen."
 diadochi_flavor.49.desc_4: "\n\nUnsere Truppen sind bis nach Kanaan vorgedrungen und haben die Kontrolle über die umkämpfte Region und ihre lokalen Herrscher bis nach Syrien gesichert – was zweifellos die [GetCountry('SEL').GetAdjective]en Gemüter erregen wird-,auch wenn die phönizischen Städte und die Garnison der Inselstadt Tyros den Antigoniden vorerst treu bleiben..."
 diadochi_flavor.49.a: "Lass sie laufen."
 diadochi_flavor.49.bt: "Die Gebiete der Antigoniden in [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)244').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)418').GetArea.GetRegion.GetName|Y] und [GetProvince('(int32)331').GetArea.GetName|Y] können #R unter anderen Diadochen aufgeteilt werden#!." 
