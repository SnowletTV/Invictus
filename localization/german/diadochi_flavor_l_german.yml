 epigoni.6.t: "Untergang von[agathocles_scope.GetPraenomen]: Anschuldigungen" 
 epigoni.6.desc: "In einer schockierenden Wendung der Ereignisse beschuldigte [thrace_wife_scope.GetPraenomen] [agathocles_scope.GetPraenomen] öffentlich, sie nach einem großen Fest in [ROOT.GetCountry.GetCapital.GetName] angegriffen zu haben, und behauptete: „Er hat Schande über das Haus von [ROOT.GetCountry.GetRuler.GetName] gebracht!“ Sie fordert dauerhafte und sofortige Gerechtigkeit und besteht darauf, dass [ROOT.GetCountry.GetRuler.GetPraenomen] handeln muss, um die Ehre seiner Familie zu schützen. Das klingt höchst untypisch für [agathocles_scope.GetPraenomen] und [thrace_wife_scope.GetPraenomen] hat viel zu gewinnen, wenn er stirbt ..." 
 epigoni.6.a: "Ein bisschen Gift hat noch nie jemandem geschadet..."
 epigoni.6.at: "#E [agathocles_scope.GetPraenomen]#! überlebt den Versuch" 
  #death 
 #manikos event in 20 - 40 days 
 epigoni.6.b: "[agathocles_scope.GetPraenomen] ist unschuldig und darf nicht für ihre Lügen leiden!"
 #[thrace_wife_scope.GetPraenomen] (and her children) losses a ton of loyalty 
 loyalty_plot_ignored_allegations: "Ignorierte Vorwürfe"
  
  
 epigoni.7.t: "Untergang von [ROOT.GetCountry.GetRuler.GetPraenomen]: Manikos" 
 epigoni.7.desc: "Nach der Ermordung von [agathocles_scope.GetPraenomen] bricht in den Provinzen Asiens Chaos aus. Loyalisten versammeln sich zu seinem Gedenken und rufen: „[ROOT.GetCountry.GetRuler.GetPraenomen] hat unseren Prinzen getötet!“ Während Städte brennen und Unruhen sich ausbreiten, verurteilen die Menschen [ROOT.GetCountry.GetRuler.GetPraenomen] für seine tyrannische Entscheidung. „Deine Herrschaft ist ein Fluch!“, rufen sie.\n\n[agathocles_scope.GetPraenomen]s Familie ist aus Angst um ihr Leben nach [GetCountry('SEL').GetRuler.GetName] geflohen, um Zuflucht und mögliche Unterstützung gegen [ROOT.GetCountry.GetRuler.GetPraenomen] zu suchen. Viele in ganz [ROOT.GetCountry.GetName] glauben, dass [ROOT.GetCountry.GetRuler.GetPraenomen] verrückt geworden ist, und bezeichnen ihn als „Manikos“. Ehemalige Verbündete von [agathocles_scope.GetPraenomen] mobilisieren und wollen Rache an [ROOT.GetCountry.GetRulerTitle], der seinem eigenen Blut verfallen ist."
 epigoni.7.a: "ICH BIN NICHT VERRÜCKT!" 
 #manikos 
 #all subjects in asia rebel 
