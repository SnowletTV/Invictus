 diadochi_flavor.75.t: "Geburt von [ptolemy_epigonos.GetPraenomen]" 
 diadochi_flavor.75.desc: "Die Götter haben das [GetCountry('TRE').GetAdjective]e Königreich  mit der Geburt eines neuen Prinzen gesegnet! [arsinoe_ii_scope.GetPraenomen], die geliebte Frau des edlen [GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetPraenomen], hat einen gesunden Sohn zur Welt gebracht. Dieses Kind, [ptolemy_epigonos.GetName], verspricht, ein Symbol der Hoffnung und des Wohlstands für unsere Dynastie zu werden. Höflinge und Bürger freuen sich gleichermaßen über dieses glückverheißende Ereignis, denn die Zukunft unserer Dynastie wird mit diesem Neuzugang immer rosiger."
