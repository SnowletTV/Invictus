 LEMNOS_ADJECTIVE: "Lemnisch" 
  
 diadochi_flavor.87.t: "Aischylos von Rhodos"
 diadochi_flavor.87.desc: "Die Nachricht hat [ROOT.GetCountry.GetCapital.GetName] erreicht, dass  #E Aischylos von Rhodos#!, der ehemalige Kommandant der antigonidischen Garnison von Lemnos und Imbros, die Inseln zurückerobert hat. Mit Hilfe von wohlwollenden Einheimischen und alten Kontakten ist es ihm gelungen, unsere Präsenz dort zu verdrängen."
 diadochi_flavor.87.a: "Verdammt seien sie alle!." 
 diadochi_flavor.87.at: "#E Lemnos#! wird ein #Y Bundesgenosse#! von [GetCountry('PRY').GetName]"
 diadochi_flavor.87.at1: "E Skyros#! wird Besitz von #Y Lemnos#!" 
  
 diadochi_flavor.88.t: "Boeotia schikanieren" 
 diadochi_flavor.88.desc: "Philipp II. brach 338 v. Chr. bei Chaironeia die Macht Thebens, und Onchestus wurde zur neuen Hauptstadt des Böotischen Bundes erhoben. 335 v. Chr. zerstörte Alexander Theben als Vergeltung für dessen Aufstand vollständig, und obwohl Kassandros 316 mit dem Wiederaufbau begann, blieben die Narben der Eroberung bestehen. Seit der Wiederherstellung der Stadtmauern von Theben diente die Stadt unter seinem Einfluss als makedonische Festung. Polemaios vertrieb 312 v. Chr. die Garnison der Stadt, und während seiner Rebellion gegen Antigonos Monophthalmos gehörte Theben zusammen mit dem Rest von Böotien zweifellos zu seinem kurzlebigen Herrschaftsgebiet. Nach dem Tod des Verräters erlangte Kassandros rasch die Kontrolle über die Stadt zurück.\n\nIn dem Machtvakuum, das nach Polemaios' Sturz entstand, übernahm der Böotische Bund die Vorherrschaft. Chalkis und Eretria, Städte, die ohne Schutzmacht zurückblieben, schlossen sich ihrem Koinon an und verschafften dem Bund damit einen Stützpunkt auf Euböa und die Kontrolle über den Euripos. Obwohl sie sich als Verbündete des Hauses Antigonos bezeichnen, berichten unsere Informanten, dass sie in Wirklichkeit mit Kassandros unter einer Decke stecken. Für ihr Verhalten müssen sie zur Rechenschaft gezogen werden. Demetrios ist mit einer Armee in Aulis gelandet, nur wenige Stadien von Chalkis entfernt ..." 
 diadochi_flavor.88.a: "Der Euböische Bund wird der Macht der Böotier entgegenwirken."
 diadochi_flavor.88.at: "Eine Forderung an die  @[GetCountry('BOE').GetFlag]! #Y [GetCountry('BOE').GetAdjective]en#! zum Rückzug aus Euböa wird übermittelt.#!\nFalls sie #G akzeptieren:#!\n#E Euboea#! wird ein #Y Bundesgenosse#! von [GetCountry('PRY').GetName]\nFalls sie #R ablehnen#!:" 
 diadochi_flavor.88.b: "Die Verräter müssen die Garnisonen akzeptieren!"
 diadochi_flavor.88.bt: "Eine Forderung an die @[GetCountry('BOE').GetFlag]! #Y [GetCountry('BOE').GetAdjective]en#! zur Aufnahme einer Garnison.#!\nFalls sie #G zustimmen:#!\n#E Boeotia#! wird ein #Y Bundesgenosse#! von [GetCountry('PRY').GetName]\nFalls sie #R ablehnen#!:" 
 diadochi_flavor.88.c: "Sie müssen Kassandros ablehnen." 
 diadochi_flavor.88.ct: "Eine Forderung an die @[GetCountry('BOE').GetFlag]! #Y [GetCountry('BOE').GetAdjective]en#! sich von Kassandros abzuwenden, wird übermittelt.#!\nFalls sie #G zustimmen:#!\n#E Boeotia#! hört auf, ein #Y Verbündeter#! von [GetCountry('MAC').GetName] zu sein" 
  
 diadochi_flavor.89.t: "Die Rückkehr der Antigoniden: Rückzug aus Euböa" 
 diadochi_flavor.89.desc: "Demetrios ist mit einer Armee in Aulis gelandet und hat Gesandte geschickt, die verlangen, dass wir unsere Garnisonen aus Chalkis und Eretria abziehen. Diese Städte, die von den Antigoniden für frei erklärt wurden, sind ohne Genehmigung von unserem Bund besetzt worden. Die Botschafter machen deutlich, dass unsere geheimen Absprachen mit Kassandros und die illegale Besetzung von Euböa uns in den Augen des Königs verdächtig gemacht haben. Demetrios beabsichtigt, den Euböern unter einem neu gegründeten Euböischen Bund ihre Unabhängigkeit zurückzugeben." 
 diadochi_flavor.89.a: "Wir werden uns zurückziehen."
 diadochi_flavor.89.at: "Alle #E Boeotischen#! Provinzen in Euboea werden Eigentum von #E Euboea#!\n#E Euboea#! wird ein #Y Bundesgenosse#! von [GetCountry('PRY').GetName]" 
 diadochi_flavor.89.b: "Wir werden Euböa nicht aufgeben!" 
  
 diadochi_flavor.90.t: "Die Rückkehr der Antigoniden: Böotien in Ketten" 
 diadochi_flavor.90.desc: "Demetrios ist mit einer Armee in Aulis gelandet und hat Gesandte geschickt, die verlangen, dass wir antigonidische Garnisonen in unseren Städten zulassen. Unsere geheimen Absprachen mit Kassandros und die unrechtmäßige Besetzung von Euböa haben uns in den Augen des Königs verdächtig gemacht..." 
 diadochi_flavor.90.a: "Wir akzeptieren gerne Garnisonen." 
 diadochi_flavor.90.b: "Boeotia wird frei bleiben."
  
 diadochi_flavor.91.t: "Die Rückkehr der Antigoniden: Bruch mit Kassandros" 
 diadochi_flavor.91.desc: "Demetrios ist mit einer Armee in Aulis gelandet und hat Gesandte geschickt, die verlangen, dass wir antigonidische Garnisonen in unseren Städten zulassen. Unsere geheimen Absprachen mit Kassandros und die illegale Besetzung von Euböa haben uns in den Augen des Königs verdächtig gemacht. Seine Botschafter haben deutlich gemacht, dass wir, wenn wir Vergeltungsmaßnahmen vermeiden wollen, öffentlich alle Verbindungen zu Kassandros aufgeben müssen." 
 diadochi_flavor.91.a: "Ein angemessenes Angebot." 
 diadochi_flavor.91.b: "Wir können beide Seiten ausspielen..." 
  
 diadochi_flavor.92.t: "Bund der Euböer" 
 diadochi_flavor.92.desc: "Lange Zeit zwischen größeren Mächten hin- und hergerissen, fehlte es den Städten von Euböa oft an der Einheit, um sich gegen die Ambitionen ihrer Nachbarn zu behaupten. Nun wurde eine neue Koinon gegründet, der Bund der Euböer, mit Sitz in Chalkis und unter der Leitung eines Bundesrats. Der Bund hat dem Haus Antigonos und dem Grundsatz der Autonomie die Treue geschworen und bietet eine Vision von gemeinsamer Verteidigung und Wohlstand für Euböa. Ob diese fragile Einheit dem Druck der makedonischen Politik standhalten kann, bleibt abzuwarten." 
 diadochi_flavor.92.desc_DEL: "\nKeos hat Isopolitea-Verträge sowohl mit Oreos als auch mit den Eritreern geschlossen, vielleicht würde es ihm in einem euböischen Koinon besser gehen als in einem nessiotischen." 
 diadochi_flavor.92.a: "Euböa erhebt sich erneut." 
 diadochi_flavor.92.tt: "#E Euboea#! wird ein #Y Bundesgenosse#! von [GetCountry('PRY').GetName]" 
 diadochi_flavor.92.b: "Oreos soll sich der Koinon anschließen."
 diadochi_flavor.92.c: "Keos schließt sich ihrer Koinon an." 
  
 diadochi_flavor.93.t: "Das Schicksal von Salamis" 
 diadochi_flavor.93.desc: "Die Insel Salamis, die angeblich nach der Nymphe Salamis benannt wurde und einst vom mythischen König Cychreus regiert wurde, war in der späten archaischen Zeit zwischen Megara und Athen umkämpft. Nach einem langwierigen Krieg, für den Solon oder Peisistratos verantwortlich gemacht werden, sicherte sich Athen die Kontrolle, und ein spartanisches Schiedsgericht bestätigte später seinen Anspruch. Ab dem späten 6. Jahrhundert v. Chr. wurde Salamis von athenischen Kleruchoi besiedelt, die der Mutterstadt Tribut und Militärdienst schuldeten. Die einheimischen Salamier erlangten nie die volle athenische Staatsbürgerschaft, behielten aber neben den Athenern ihren eigenen Demos auf der Insel. Salamis diente Athen als wichtiger Marinestützpunkt und Tor zum Saronischen Golf. Hier fand 480 v. Chr. die entscheidende griechische Sieg über Persien statt.\n\nIm letzten Kampf vertrieb [GetCharacter('(int32)38').GetPraenomen]die Garnison von Kassander und stellte die Ordnung der Antigoniden auf der Insel wieder her. Mit dem Ende dieser Kampfhandlungen ist es an der Zeit, den Status der Salamier neu zu bewerten." 
 diadochi_flavor.93.a: "Von nun an wird Salamis frei und autonom sein." 
 diadochi_flavor.93.at: "#E Salamis#! wird ein #Y Bundesgenosse#! von [GetCountry('PRY').GetName]\nJedes #Y Hellenische#! Land auf dem Festland [GetProvince('(int32)418').GetArea.GetRegion.GetName] erhält #G 15#! Meinung über [GetCountry('PRY').GetName]." 
 diadochi_flavor.93.b: "Lasst die Athener die Salamier regieren." 
 diadochi_flavor.93.bt: "#E Salamis#! wird von #E Athen#! regiert" 
 diadochi_flavor.93.c: "Wir werden eine starke Garnison auf der Schlüsselinsel des Saronischen Golfs stationieren." 
 diadochi_flavor.93.ct: "Jedes #Y Hellenische#! Land auf dem Festland  [GetProvince('(int32)418').GetArea.GetRegion.GetName] verliert #R -15#! Meinung über [GetCountry('PRY').GetName]." 
   
  
