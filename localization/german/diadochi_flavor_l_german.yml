 diadochi_flavor.49.tt3: "@[antigonids_scope.GetFlag]!#E [antigonids_scope.GetAdjective]e#! Untertanen in [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y] $diadochi_flavor_become_our_subjects$"
  
 diadochi_flavor.50.desc_3: "\n\nIhre Entschlossenheit bedeutet wenig angesichts des Abfalls derjenigen, die von [GetCharacter('(int32)37').GetPraenomen] eingesetzt wurden, um über die Satrapie zu wachen, die [GetCharacter('(int32)39').GetPraenomen]  ihm vor all den Jahren übertragen hatte. Es ist klar, dass [GetCountry('TRE').GetRuler.GetPraenomen] derjenige ist, der die Makedonen des Westens vereinen wird."
 diadochi_flavor.50.desc_4: "\n\nIn dem Chaos haben asiatische Provinznotare uns ihre Loyalität geschenkt – und damit die Herrschaft über ursprünglichen Besitztümer von [GetCharacter('(int32)37').GetPraenomen]' in [GetProvince('(int32)1936').GetArea.GetRegion.GetName], die ihm von [GetCharacter('(int32)39').GetPraenomen] dem Großen gewährt wurden – wodurch wir unseren Einfluss über den Bosporus hinweg bis nach  [GetProvince('(int32)244').GetArea.GetRegion.GetName] und darüber hinaus ausgedehnen konnten."
 diadochi_flavor.50.a: "Endlich gehört der Bosporos uns."
