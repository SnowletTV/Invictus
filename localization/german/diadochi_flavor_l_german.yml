 flavor_sel.1.t: "Die östlichen Satrapien" 
 flavor_sel.1.desc: "Vor Jahrzehnten eroberte [GetCharacter('(int32)39').GetPraenomen] Indien und dehnte sein Reich bis zum #E Indus#! aus, doch die vielen Kriege zwischen den nachfolgenden Königen haben diese östlichen Satrapien isoliert und geschwächt.\n\nIm vergangenen Jahr hat [GetCharacter('(int32)22').GetName] Nordindien vereint, das #E Nanda-Reich#! vernichtet und gleichzeitig die griechischen Satrapen im Indus-Tal überrannt.\n\nEs wurde vorgeschlagen, dass wir unsere Verluste begrenzen und die letzten östlichen Satrapien an die #E Maurya#! abgeben sollten, da sich dieser Konflikt sonst über Jahre hinziehen könnte. Ein Waffenstillstand würde uns außerdem die Zeit verschaffen, die wir brauchen, um unser eigenes Reich zu festigen und die anderen Nachfolger zu besiegen."
 flavor_sel.1.a: "Lasst uns mit Maurya verhandeln." 
 flavor_sel.1.b: "Wir geben ihnen gar nichts!"
 seleucid_maurya_start.1.a.tt: "Wenn Maurya zustimmt, wird Folgendes geschehen:\n" 
 seleucid_maurya_start.1.b.tt:2 "#R Der Krieg mit Maurya (@[GetCountry('MRY').GetFlag]!) wird wahrscheinlich sofort wieder aufgenommen. #!\nSollte der Krieg wiederaufgenommen werden, $seleucid_maurya_start.5.b.tt$" 
 seleucid_maurya_war_deets_tt: "#R Wenn der Krieg mit Maurya wieder aufgenommen wird (@[GetCountry('MRY').GetFlag]!), werden wir Teile von Gandhara  (@[GetCountry('GHA').GetFlag]!) und Arachosia (@[GetCountry('ARS').GetFlag]!) annektieren." 
 seleucid_maurya_start.5.b.tt: "#Y Maurya#! erhält:\n" 
 seleucid_land_transfer_tooltip: "Die Provinzen #R Bamyan#!, #R Sattagydia#!, #R Arachosia#!, #R Gedrosia#! und #R Parecania#!, werden an Maurya abgetreten (@[GetCountry('MRY').GetFlag]!))." 
 seleucid_land_transfer_mauryan_tooltip: "Die Provinzen #G Bamyan#!, #G Sattagydia#!, #G Arachosia#!, #G Gedrosia#! und #G Parecania#!, werden an Maurya (@[THIS.GetCountry.GetFlag]!) abgetreten." 
  
 flavor_sel.2.t: "Und das Ende der griechischen Bedrohung?" 
 flavor_sel.2.desc: "Vor Jahrzehnten fiel [GetCharacter('(int32)39').GetName] in unseren Subkontinent ein und besiegte die lokalen Herrscher des Indus-Tals. Seitdem hat sich jedoch vieles geändert. Der Tod des großen Eroberers führte zur Aufteilung seines Reiches unter streitenden Nachfolgern und der kometenhafte Aufstieg von Chandragupta Maurya veränderte Nordindien.\nIm vergangenen Jahr eroberten Maurya-Armeen das Indus-Tal und rücken auf die Positionen des Nachfolgerkönigs Seleukos vor.\nEin Abgesandter von Seleukos bietet nun an, diese Region im Austausch für einen Freundschaftsvertrag mit unserem Reich aufzugeben." 
 flavor_sel.2.a: "Nehmen wir dieses Angebot an." 
 flavor_sel.2.b: "Nein, Persien wird uns gehören!" 
 flavor_sel.3.t: "Die griechische Bedrohung" 
  
 flavor_sel.3.desc: "Vor Jahrzehnten fiel [GetCharacter('(int32)39').GetName] in unseren Subkontinent ein und besiegte die lokalen Herrscher des Indus-Tals. Seitdem hat sich jedoch vieles geändert. Der Tod des großen Eroberers führte zur Aufteilung seines Reiches unter streitenden Nachfolgern und der kometenhafte Aufstieg von Chandragupta Maurya hat Nordindien verändert.\nIm vergangenen Jahr haben Maurya-Armeen das Indus-Tal erobert und rücken auf die Positionen des Nachfolgerkönigs Seleukos vor.\nEin Abgesandter von Seleukos bietet uns nun einen Waffenstillstand an. Das gibt uns Zeit, unsere Zugewinne zu konsolidieren und unsere Aufmerksamkeit vielleicht anderen Dingen zuzuwenden."
 flavor_sel.3.a: "Wir müssen weitermachen!"
 flavor_sel.3.b: "Versuchen wir, Frieden zu schließen und warten wir ab." 
 seleucid_maurya_start.3.b.tt: "Wenn die Seleukiden zustimmen, wird Folgendes geschehen:\n"
  
 flavor_sel.4.t: "Frieden in unserer Zeit" 
 flavor_sel.4.desc: "Die Maurya haben unserem Angebot zugestimmt und uns als Zeichen ihrer Dankbarkeit eine große Anzahl Kriegselefanten geschickt, die wir im Kampf gegen die anderen makedonischen Nachfolgestaaten einsetzen sollen." 
 flavor_sel.4.a: "Fantastisch!" 

 flavor_sel.401.t: "Annexion von Gandhara" 
 flavor_sel.401.desc: "Mit dem neuen Frieden zwischen den Seleukiden und uns können wir entscheiden, wie wir das Land in der Region Gandhara aufteilen wollen. Wir können zwar denselben Vasallen behalten, der uns übergeben wurde, aber wir können uns auch dafür entscheiden, die wichtigen Teile des Landes direkt zu regieren und den Rest dem Bergvolk zu überlassen, obwohl dies die Einheimischen sehr verärgern würde." 
 flavor_sel_401.a: "Wen kümmert das? Es ist jetzt unser Land."
 flavor_sel_401.b: "Sie sind besser als unsere Vasallen aufgehoben." 
  
 flavor_sel.5.t: "Ein unsicherer Waffenstillstand"
 flavor_sel.5.desc: "Die Maurya haben einem Waffenstillstand zugestimmt. Dies würde unseren beiden Staaten eine dringend benötigte Ruhepause verschaffen. Zeit für den Wiederaufbau und die Festigung unseres jungen Reiches.\nDas würde zwar bedeuten, dass wir den griechischen Städten im Indus-Tal vorerst den Rücken kehren, aber es ist vielleicht die vernünftigste Vorgehensweise."
 flavor_sel.5.a: "Zeit, unsere Aufmerksamkeit Antigonos zuzuwenden!" 
 flavor_sel.5.b: "Zum Indus!" 
  
 flavor_sel.6.t: "Krieg!"
 flavor_sel.6.desc: "Anstatt eine formelle Antwort zu senden, haben uns die Maurya den Kopf unseres Boten geschickt.\nUnsere Grenzgarnisonen melden Maurya-Truppen, die ihre Stellungen auskundschaften, ein Krieg ist nun unvermeidlich." 
 flavor_sel.6.a: "Zeit zu sterben."
 flavor_sel.6.b: "Annektiert eine eine Landroute durch unsere Untertanen."
  
 flavor_sel.7.t: "Krieg!" 
 flavor_sel.7.desc: "Die Seleukiden haben unser großzügiges Waffenstillstandsangebot abgelehnt. Stattdessen rücken ihre Armeen auf unsere Stellungen vor.\nAuch in den griechischen Gebieten entlang des Indus wächst die Unterstützung für die Seleukiden." 
  
 flavor_sel.10.t: "Die Verwüstung von Gedrosia" 
 flavor_sel.10.desc: "Gedrosia, das Land, das ein Drittel der Armee Alexanders stahl, als dieser nach Hause marschierte und in den Tod ging, ist ein fast karger Felsen, der von Bergen und Wüsten bevölkert ist, ein starker Kontrast zu dem großen Erythräischen Meer, das darunter liegt und das Nearchus durchsegelte, als er Alexander auf seiner schicksalshaften Reise begleitete. Obwohl es ein totes Land ist, gibt es diese wenigen Seelen, die dort leben – die Fischfresser, wie sie genannt werden, die Ichthyophagoi. Sie müssen ein verfluchtes Volk sein, wenn sie ihr Leben an einem so rauen und unbarmherzigen Ort verbringen. Diese Ichthyophagoi mit ihren seltsamen Bräuchen bieten keinen Tribut, der die Mühe wert wäre, und die Verwüstung des Landes dient nur dazu, das Leben derer zu fordern, die es wagen, es zu betreten. Die Berater von [gedrosia_old_overlord.GetRuler.GetPraenomen] schlagen vor, dass es an der Zeit sein könnte, die Wüste zurückfordern zu lassen, was ihr gehört, Gedrosia seiner Wildnis zu überlassen und unsere Bemühungen auf wohlhabendere Länder umzulenken. Wenn wir uns zurückziehen, werden wir dies vorsichtig und langsam tun, um sicherzustellen, dass das Land nicht von unseren Feinden eingenommen wird und die einheimischen Stämme [gedrosia_old_overlord.GetName] gegenüber freundlich gesinnt bleiben." 
 flavor_sel.10.a: "Zieh dich zurück und überlasse der Wüste die Eroberung von Gedrosia." 
 flavor_sel.10.at: "#E #Y Gedrosia#! #! wird in zwei Jahren als [gedrosia_old_overlord.GetAdjective]er #E Stammesvasall#! entlassen" 
 flavor_sel.10.b: "Wir werden kein einziges Sandkorn aufgeben." 
 flavor_sel.10.b.effect: "Erhöhen Sie die Unruhen und die Instandhaltungskosten in Gedrosia, erhalten Sie jedoch einen kleinen Prestigebonus." 
 flavor_sel.11.t: "Gedrosia verlassen" 
 flavor_sel.11.desc: "Die Wüste von Gedrosia wurde ihrem Schicksal überlassen. Die letzten [gedrosia_old_overlord.GetAdjective]en Streitkräfte haben die Region verlassen. Tatsächlich sind die Ichthyophagoi-Stämme jetzt niemandem mehr Rechenschaft schuldig, aber sie erkennen die [gedrosia_old_overlord.GetAdjective]en Herrscher nominell als ihren Oberherrn an. Der Treibsand dieser Wildnis bleibt ungezähmt ..." 
 flavor_sel.11.a: "Endlich sind wir frei von dieser Last." 
 flavor_sel.11.b: "Ich frage mich, was die Zukunft für [gedrosia_tribal.GetName] bereithält …" 
 flavor_sel.11.bt: "#R Wir wechseln zur Nation @[gedrosia_tribal.GetFlag]! #Y [gedrosia_tribal.GetName]#!#!"
  
  
 #Seleukid Syria 
 SELEUKID_SYRIA: "Seleukidisches Syrien" 
 form_seleukid_syria: "Ein syrisches Königreich"
 form_seleukid_syria_desc: "Das Kernland Babylons, die alte Satrapie Seleukos', ist für uns verloren, zumindest auf absehbare Zeit. Dank seiner strategischen Lage zwischen Ost und West, seiner natürlichen Verteidigungsanlagen und seines guten Zugangs zum Meer wäre Syrien ein nützliches Sprungbrett für künftige Angriffe auf die anderen Diadochen und würde uns einen Weg bieten, das zurückzuerobern, was uns gestohlen wurde. Vielleicht sollten wir unsere verbleibenden Besitztümer konsolidieren und uns selbst zu Königen Syriens machen." 
 form_seleukid_syria_tooltip: "Wir werden uns zu den Königen Syriens erklären" 
 syriote_nobles_tooltip: "Die königliche Familie und alle Charaktere der Primärkultur werden die #Y syrische Kultur#! annehmen" 
 syriote_converts_tooltip: "Einige Völker unserer primären Kultur und alle Völker, die dem hellenischen Glauben folgen, werden die #Y syrische Kultur#! annehmen" 
 form_seleukid_syria_claims_tooltip: "#E Das syrische Königreich#! erhält Ansprüche auf die Regionen #Y Kilikien#!, #Y Syrien#!, #Y Assyrien#! und #Y Kanaan#!" 
 formable_not_syria_exists: "#Y Syrien#! darf NICHT existieren"
 seleukid_syria_capital_region: "Die #E Hauptstadt#! von #E [THIS.GetCountry.GetName]#! muss in der Region #Y Syrien#!, #Y Mespotamien#! oder #Y Kanaan#! liegen." 
 create_characene_tooltip: "#E #Y Characene#! #! wird als [THIS.GetCountry.GetAdjective]e #E Satrapie#! entlassen und erbt alles [THIS.GetCountry.GetAdjective]e Land in den Gebieten #Y Characene#!, #Y Sumer#!, #Y Chaldea#!, #Y Sittacene#!, #Y Babylonia#! und #Y Qara'ah#!." 
 create_elymais_tooltip: "#E #Y Elymais#! #! wird als [THIS.GetCountry.GetAdjective]e #E Satrapie#! entlassen und erbt das gesamte [THIS.GetCountry.GetAdjective]e Land in den Gebieten #Y Susiana#! und #Y Mardiene#!" 
 seleucid_syria_babylon_control_tooltip: "Weniger als 50 Provinzen in den Gebieten #Y Susiana#!, #Y Mardiene#!, #Y Characene#!, #Y Sumer#!, #Y Chaldea#!, und #Y Qara'ah#!, werden von #E [THIS.GetCountry.GetName]#! (Aktuell: [SCOPE.ScriptValue('seleucid_syria_babylon_control_current')|0Y]/#Y 50#!)." 
 seleucid_syria_eastern_control_tooltip: "Weniger als 75 Provinzen in den Regionen #Y Ariana#!, #Y Parthia#!, und #Y Media#! werden von #E [THIS.GetCountry.GetName]#! kontrolliert (Aktuell: [SCOPE.ScriptValue('seleucid_syria_eastern_control_current')|0Y]/#Y 75#!)" 
  
  
