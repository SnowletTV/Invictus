 diadochi_flavor.78.t: "Hellespontinisches Phrygien: [agathocles_scope.GetPraenomen]s Preis" 
 diadochi_flavor.78.desc: "Das zu Beginn des 5. Jahrhunderts v. Chr. gegründete Hellespontinische Phrygien wurde von Nachkommen von Pharnakes, einem Onkel von König Darius I. dem Großen, regiert. Die Hauptstadt des Landes war Dascylium. Während des Feldzugs Alexanders des Großen im Jahr 334 v. Chr. erlitt der Satrap des Hellespontinischen Phrygien, Arsites, in der Schlacht am Fluss Granikos eine entscheidende Niederlage und beging danach Selbstmord. Alexander ernannte Calas zu seinem Nachfolger. Nach Alexanders Tod im Jahr 323 v. Chr. wurde die Satrapie Leonnatus zugesprochen, einem Mitglied des Königshauses von Lynkestis in Makedonien und einem von Alexanders treuen Leibwächtern. Alexanders Schwester Kleopatra, die Witwe von König Alexander I. von Epirus, bot Leonnatus ihre Hand zur Heirat an, eine Verbindung, die seinen Machtanspruch gestärkt hätte. Hätte er die Athener besiegt, hätte Leonnatus durchaus versucht, den makedonischen Thron für sich zu beanspruchen. Seine Karriere endete im Lamianischen Krieg, als er eine Streitmacht von 20.000 Infanteristen und 1.500 Kavalleristen anführte, um Antipater während der Belagerung von Lamia zu entlasten. Trotz seiner wahrscheinlichen Ambitionen, Antipaters Autorität herauszufordern und möglicherweise Alexanders Schwester Kleopatra zu heiraten, wurde Leonnatus in der Schlacht getötet, wodurch seine Ambitionen unerfüllt blieben. Die Satrapie des hellespontinischen Phrygien existiert seit dem Tod von Leonnatus nicht mehr.\n\nJetzt ist die Kontrolle über das hellespontinische Phrygien an [ROOT.GetCountry.GetRuler.GetPraenomen] gefallen. Wir könnten zwar dem Beispiel von Antigonos folgen und die Satrapie einfach übernehmen, aber wir haben die Möglichkeit, eine neue Machtbasis für unsere Dynastie zu errichten. [attalid_head.GetPraenomen]s Vorschlag, Asien von einem Statthalter oder sogar einem König mit starken lokalen Verbindungen regieren zu lassen, war zwar inspiriert, aber [attalid_head.GetPraenomen] war für eine solche Aufgabe eindeutig nicht geeignet. [agathocles_scope.GetPraenomen] ist bei unseren asiatischen Untertanen unglaublich beliebt und zweifellos einer unserer fähigsten Verwalter. [agathocles_scope.GetPraenomen] war schon immer ein treuer Unterstützer von [ROOT.GetCountry.GetRuler.GetPraenomen]. Da das Blut von Alkimachus in seinen Adern fließt, steht seine Loyalität gegenüber unserer Dynastie außer Frage. Es wird behauptet, dass [agathocles_scope.GetPraenomen] das hellespontinische Phrygien fast im Alleingang erobert und vertrieben hat. Und vielleicht hat er das auch sogar getan. Ist ein solcher Mann nicht des Mantels von Leonnatus würdig?" 
 diadochi_flavor.78.a: "Es gibt keinen besseren Mann, um das hellespontinische Phrygien zu regieren." 
 diadochi_flavor.78.at: "#Y Hellespontisches Phrygia#! wird alle unsere Gebiete in Äolien, Mysia Superioris, Mysia Inferioris, Sangarios, Bithynia und Mariandynia erhalten.\n#Y Hellespontinisches Phrygia#! wird eine #Y Satrapie#! von #Y [THIS.GetCountry.GetName]#!.\n#Y [agathocles_scope.GetName]#! wird der Herrscher  #Y Hellespontine Phrygia#!s" 
 diadochi_flavor.78.b: "Die Auflösung des hellespontinischen Phrygien erfolgte aus einem bestimmten Grund."
  
  diadochi_flavor.79.t: "Die Frage von Lesbos" 
 diadochi_flavor.79.desc: "Gesandte aus Mytilene auf Lesbos haben eine Anfrage an [THIS.GetCountry.GetCapital.GetName] gerichtet, in der sie darum bitten, dass wir ihre Autonomie vom Äolischen Bund anerkennen. Sie argumentieren, dass das Festland noch jahrelang von den Kämpfen der Diadochen heimgesucht werden wird und dass Mytilene, sicher auf seiner Insel gelegen, besser dran wäre, sich formell vom Rest Äoliens zu trennen.\n\nAls Gegenleistung für unsere Anerkennung wird Lesbos einen geringen, aber regelmäßigen Tribut zahlen. Die Gewährung einer solchen Autonomie könnte jedoch andere ermutigen, ähnliche Zugeständnisse zu fordern." 
 diadochi_flavor.79.a: "Lesbos soll seine Autonomie erhalten." 
 diadochi_flavor.79.at: "#E Lesbos#! wird ein  #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#!er #Y Tributstaat#!" 
 diadochi_flavor.79.b: "Der Äolische Bund muss vereint bleiben." 
  
 diadochi_flavor.80.t: "Autonomes Lesbos" 
 diadochi_flavor.80.desc: "Aus  [GetCountry('TRE').GetCapital.GetName], ist die Nachricht eingetroffen, dass die Alkimachiden zugestimmt haben, die Autonomie von Lesbos offiziell anzuerkennen. Als Gegenleistung für diese Anerkennung wird von uns ein geringer, aber regelmäßiger Tribut erwartet." 
 diadochi_flavor.80.a: "Ein notwendiger Preis für unsere Freiheit."
 diadochi_flavor.80.at: "#G Schaltet#! #E Lesbische#! Aufgaben für den #E #T Ionische Wiedergeburt#! Missionsbaum frei#!" 
  
 diadochi_flavor.81.t: "Der Bund bleibt bestehen" 
 diadochi_flavor.81.desc: "Aus [GetCountry('TRE').GetCapital.GetName], ist die Nachricht eingetroffen, dass die Alkimachiden beschlossen haben, dass der Äolische Bund vereint bleiben muss, ungeachtet unserer Bedenken hinsichtlich der Gefahren, denen das Festland ausgesetzt ist. Vorerst bleibt Mytilene dem Bund verbunden, und wir müssen weiterhin seine Lasten mittragen. Auch wenn die Zukunft ungewiss ist, besteht kaum Zweifel daran, dass unser Volk diese Kränkung nicht vergessen wird." 
 diadochi_flavor.81.a: "Wir müssen es vorerst aushalten."
  
 diadochi_flavor.82.t: "Über die Ägäis" 
 diadochi_flavor.82.desc: "Es ist [ROOT.GetCountry.GetCapital.GetName] zu Ohren gekommen, dass sich unsere verbliebenen asiatischen Truppen in Ephesus versammeln und sich darauf vorbereiten, nach [ROOT.GetCountry.GetCapital.GetName] zurückzusegeln. Allerdings verbleiben symbolische Streitkräfte in Chios und Ephesus, Städten, die unserer Sache weiterhin treu sind. Wenn wir auch ihnen die Abreise gestatten, verlieren wir unsere Macht über Asien vollständig; die Schatzkammer und der Tempel von Ephesus würden mit Sicherheit von unseren Feinden geplündert werden. Anstatt nach [ROOT.GetCountry.GetCapital.GetName] zu ziehen, sollten unsere asiatischen Truppen vielleicht lieber zurückbleiben und die Garnisonen von Chios und Ephesus verstärken, um die Sicherheit dieser loyalen und reichen Städte zu gewährleisten. Einige in [ROOT.GetCountry.GetCapital.GetName] schlagen vor, weitere Truppen über die Ägäis zu entsenden, um alle Städte Ionias zu besetzen." 
 diadochi_flavor.82.a: "Ephesus muss unversehrt bleiben." 
 diadochi_flavor.82.at: "#E Ephesus#! muss ein  #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#!er #Y Tempelstaat#! werden" 
 diadochi_flavor.82.b: "Eine symbolische Streitmacht auf Chios und in Ephesus zurücklassen." 
 diadochi_flavor.82.bt: "#E Chios#! wird ein  #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#!er #Y Tributstaat#!\n#E Ephesus#! wird ein  #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#!er #Y Templstaat#!"
 #Ephesus and Chios (token force to ensure the wealthiest cities are not left for our enemies) temple state and tributary (30) 
 diadochi_flavor.82.c: "Die asiatischen Truppen müssen die lokalen Garnisonen ergänzen." 
 diadochi_flavor.82.ct: "#E Chios#! wird ein  #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#!er #Y Bundesgenosse#!\n#E Ephesus#! wird ein  #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#!er #Y Bundesgenosse#!" 
 #Feudatories (30) 
 diadochi_flavor.82.d: "Entsendet weitere Truppen als Besatzung nach Ionia." 
 #All of IOnia (40) 
 diadochi_flavor.82.e: "Wir werden zurückkehren, um das Verlorene zurückzugewinnen." 
  
