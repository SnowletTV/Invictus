 diadochi_flavor.84.t: "Die antigonidische Sache wankt"
 diadochi_flavor.84.desc: "[pleistarchus_scope.GetPraenomen] ist sowohl ein vertrauter Freund von [GetCountry('TRE').GetRuler.GetPraenomen] als auch ein Angerhöriger von [GetCountry('MAC').GetRuler.GetPraenomen]. n Anerkennung seiner maßgeblichen Rolle bei der Herbeiführung des Sturzes der Antigoniden wurde beschlossen, ihm die Satrapie von #E @[GetCountry('CIA').GetFlag]! [GetCountry('CIA').GetName]#! als Belohnung zu übertragen.\n\nUm die Bedenken von [GetCountry('EGY').GetRuler.GetPraenomen] und  [GetCountry('SEL').GetRuler.GetPraenomen] zu zerstreuen, wird [pleistarchus_scope.GetPraenomen] wdie unabhängige Herrschaft über seine neue Provinz übertragen, ohne dass er jemandem unterstellt ist. Dennoch wird er aufgrund seiner persönlichen Verbindungen sicherlich enge Beziehungen sowohl zu [GetCountry('TRE').GetRuler.GetName] als auch zu [GetCountry('MAC').GetRuler.GetName] pflegen.\n\n[old_caria_ruler.GetName]wird mit Ehrerbietungen und zeremoniellen Gesten besänftigt werden, aber  [old_caria_ruler.GetSheHe] wird sich unter dem Regiment von [pleistarchus_scope.GetPraenomen] gewiss unwohl fühlen." 
