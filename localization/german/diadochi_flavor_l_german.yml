 #flavor_cyprus.2.t: "Kontrolle über Zypern" #NNT
 #flavor_cyprus.2.desc: "[GetCharacter('(int32)42').GetPraenomen] schaffte nach dem Tod von Alexandros alle Königreiche Zyperns ab, mit Ausnahme von Soloi, das sich während Alexandros‘ Feldzügen als außergewöhnlicher Verbündeter erwiesen hatte. [GetCharacter('(int32)42').GetPraenomen]s Versuche, die Insel #E Zypern#! zu kontrollieren, wurden vereitelt, nachdem #E Demetrius#! die ptolemäische Flotte in der #E Schlacht von [GetProvince('(int32)331').GetName] (306 v. Chr.)#! besiegt hatte. Danach marschierte Demetrius in Zypern ein und #E Eunostos von [GetCharacter('(int32)42').GetPraenomen]0#!, der letzte zypriotische König, floh zum Schutz in das ptolemäische Königreich und heiratete [GetCharacter('(int32)42').GetPraenomen]s Tochter Eirene. \n\nNachdem #E Zypern#! nun den Händen der Antigoniden entglitten ist, scheinen viele zypriotische Stadtstaaten die Abwesenheit der makedonischen Truppen auszunutzen und Teile des seit kurzem nicht mehr besetzten Landes zu besetzen, um ihre alten Königreiche wiederherzustellen. [GetCharacter('(int32)42').GetPraenomen]5 wird in Begleitung eines bescheidenen Kontingents an [GetCharacter('(int32)42').GetPraenomen]6 Soldaten von [GetCharacter('(int32)42').GetPraenomen]7 entsandt, um den Zustand der Insel zu beurteilen und, wenn möglich, sein Königreich [GetCharacter('(int32)42').GetPraenomen]0 zurückzuerobern." #NNT
 # flavor_cyprus.2.a: "Viel Glück [eunostos_of_soloi.GetName]." #NNT
  
 # flavor_cyprus.3.t: "Zypriotischer König" #NNT
 # flavor_cyprus.3.desc: "Nachdem [eunostos_of_soloi.GetName] mit Hilfe der [ROOT.GetCountry.GetAdjective]en Truppen seinen Stammsitz erfolgreich zurückerobert hatte, kehrte er nach [ROOT.GetCountry.GetCapital.GetName] zurück, um [ROOT.GetCountry.GetRuler.GetPraenomen] seinen Bericht zu überbringen. [eunostos_of_soloi.GetPraenomen] warnt, dass diese neu wiederhergestellten zypriotischen Königreiche Angst davor haben, erneut in die Hände von Außenstehenden zu fallen. Sie haben sich verschanzt und es würde einen erheblichen Aufwand erfordern, die Insel mit Gewalt einzunehmen. Wenn [ROOT.GetCountry.GetRuler.GetPraenomen] jedoch ein paar weitere Truppen entbehren könnte, ist [eunostos_of_soloi.GetPraenomen] zuversichtlich, dass er die Kontrolle über [keryneia_country.GetName] übernehmen könnte." #NNT
 # flavor_cyprus.3.a: "Sie sollen alle Männer haben, die Sie brauchen." #NNT
 # flavor_cyprus.3.at: "#E [eunostos_of_soloi.GetPraenomen]#! erhält eine Armee und versucht, [keryneia_country.GetName] zu erobern." #NNT
 # flavor_cyprus.3.b: "Wir können derzeit keine weiteren Männer entbehren." #NNT
  
 # flavor_cyprus.4.t: "Eroberung von [keryneia_country.GetName]" #NNT
 # flavor_cyprus.4.desc: "Nach einem kurzen, aber blutigen Feldzug haben [eunostos_of_soloi.GetName] und die [ROOT.GetCountry.GetAdjective]e Armee unter seinem Kommando [keryneia_country.GetName] zur Räson gebracht. Jetzt muss nur noch entschieden werden, wie das eigensinnige Gemeinwesen verwaltet werden soll. [eunostos_of_soloi.GetPraenomen] bat darum, dass das von [keryneia_country.GetName] gehaltene Gebiet entweder seinem Königreich #E Soloi#! zugeteilt oder von seinem Cousin [eunostos_cousin.GetPraenomen] verwaltet wird, mit der Begründung, dass [ROOT.GetCountry.GetRuler.GetPraenomen] nie Angst haben müsse, wo die Loyalität der Pasikratiden liege. Für [ROOT.GetCountry.GetRuler.GetPraenomen] ist jedoch klar, dass [eunostos_of_soloi.GetPraenomen] nicht nur den Stammsitz [ROOT.GetCountry.GetAdjective]1 regieren will, sondern ganz Zypern unterwerfen will ..." #NNT
 # flavor_cyprus.4.a: "Nimm alles." #NNT
 # flavor_cyprus.4.at: "#E Soloi#! wird [keryneia_country.GetName] annektieren." #NNT
 # flavor_cyprus.4.b: "Ein äußerst vernünftiger Vorschlag; [eunostos_cousin.GetPraenomen] kann über [keryneia_country.GetName] herrschen." #NNT
 # flavor_cyprus.4.bt: "[eunostos_cousin.GetPraenomen] wird der Herrscher über [keryneia_country.GetName]." #NNT
 # flavor_cyprus.4.c: "#E Keryneia#! wäre ein guter Marinestützpunkt." #NNT
 # flavor_cyprus.4.ct: "Wir werden [keryneia_country.GetName] annektieren, und #E Soloi#! erhält #E Chrythroi#!." #NNT
 #for sparta 
 # flavor_cyprus.5.t: "Lapethos befreit" #NNT
 # flavor_cyprus.5.desc: "Vor Jahrhunderten wurde #E Lapethos#! als östlichste #E spartanische Kolonie#! auf der Insel #E Zypern#! gegründet. Praxippus, der frühere König von Lapathus, war ein treuer Verbündeter von Antigonos, übertrieb jedoch törichterweise seine Karten. Nachdem [GetCharacter('(int32)42').GetPraenomen] die Insel erobert hatte, schaffte er das Königreich Lapethos ab. [GetCharacter('(int32)42').GetPraenomen]s Versuche, die Insel Zypern zu kontrollieren, wurden jedoch vereitelt, nachdem Demetrius die ptolemäische Flotte in der Schlacht von [GetProvince('(int32)331').GetName] (306 v. Chr.) besiegt hatte. Danach marschierte Demetrius in Zypern ein und eroberte es für eine Weile zurück. \n\nNachdem #E Zypern#! den antigonidischen Händen entzogen ist, scheinen viele der zypriotischen Stadtstaaten, darunter auch #E Lapethos#!, die Abwesenheit der makedonischen Besatzung auszunutzen und sich Parzellen des seit kurzem nicht mehr besetzten Landes zu bemächtigen, um ihre alten Königreiche wiederherzustellen. Nachdem er seine Unabhängigkeit erlangt hatte, #!3, hat der König von Lapethos angeboten, den Tribut seines Königreichs an #!4 im Austausch für Siedler wieder einzuführen." #NNT
 # flavor_cyprus.5.a: "Wir heißen unsere Spartan-Brüder willkommen!" #NNT
  
 # flavor_cyprus.6.t: "Alassan-Botschafter" #NNT
 # flavor_cyprus.6.desc: "Eine Delegation aus Abgesandten der drei neuen unabhängigen Königreiche auf Zypern, die offenbar eine Art Bündnis gebildet haben: @[kition_country.GetFlag]! [kition_country.GetName|Y], @[marion_country.GetFlag]! [marion_country.GetName|Y] und @[amathous_country.GetFlag]! [amathous_country.GetName|Y], sind in [ROOT.GetCountry.GetCapital.GetName] eingetroffen, um mit [ROOT.GetCountry.GetRuler.GetPraenomen] zu verhandeln. Nach dem Austausch von Höflichkeiten erklären die Botschafter, dass die sich zurückziehenden Streitkräfte im Chaos nach dem Rückzug der Antigoniden die meisten Seeschiffe auf der Insel Zypern gekapert haben, die der Botschafter amüsanterweise als „#E Alassa#!,'“ bezeichnet, die größer als kleine Fischerboote sind. Ohne diese Schiffe war der Handel, die Wirtschaftsadern ihrer Städte, unterbrochen. Ihre Händler sind jetzt größtenteils auf die Küsten beschränkt und können sich nur gelegentliche Ausflüge auf die andere Seite des #E Levantinischen Meeres[kition_country.GetName|Y]1 leisten. Viele der wenigen Schiffe, die sie ausschicken, werden von #E Olban-Piraten[kition_country.GetName|Y]1 gekapert. Sogar diejenigen, die es bis in die Levante schaffen, müssen oft exorbitante Anlegegebühren zahlen und bei jedem Besuch scheinen neue Steuern erhoben zu werden. \n\nDie führenden Botschafter von [kition_country.GetName|Y]5 flehen [kition_country.GetName|Y]4 um Unterstützung an und erklären sich bereit, ihre Städte zu verpflichten, dem #E Ptolemäischen Königreich[kition_country.GetName|Y]7 Tribut zu zahlen, wenn [kition_country.GetName|Y]8 garantieren kann, dass ihre Handelsrechte geschützt und Berichte über Piraten angemessen behandelt werden. \n\nNachdem sein Gegenüber sein Plädoyer beendet hatte, fügte der Botschafter von [kition_country.GetName|Y]9 hinzu, dass ihre Städte, die sich offenbar als „#E Alassanische Liga[kition_country.GetName|Y]1“ bezeichneten, sich gerne in das ptolemäische Wirtschaftssystem integrieren würden, wenn ihnen Schiffe und Geldmittel zugeteilt würden, damit sie ihre Handelsrouten wiederbeleben und sich wieder mit den geschäftigen Märkten des #E Mittelmeers[kition_country.GetName|Y]1 verbinden könnten. Die anderen Botschafter nickten heftig und signalisierten ihre Bereitschaft, ähnlichen Bedingungen zuzustimmen. \n\nDie Rückeroberung der Insel wäre jetzt, da die Einheimischen ihre Positionen gefestigt haben, ein Ärgernis und diese Lösung würde viele der Vorteile des vollständigen Eigentums ohne die gesamte Haftung bieten …" #NNT
 # flavor_cyprus.6.a: "Wir können Ihnen Schutz und einen günstigen Handelsstatus gewähren." #NNT
 # flavor_cyprus.6.b: "Ihre Städte werden in die Hände der Ptolemäer fallen." #NNT
 # flavor_cyprus.6.c: "Das ptolemäische Königreich kann derzeit keine Ressourcen sparen" #NNT
 # flavor_cyprus.6.ct: "#R Die Diplomaten werden enttäuscht sein und ihre Herrscher könnten beleidigt sein.#!" #NNT
 # flavor_cyprus.6.d: "Lauft zurück auf eure Insel. Ganz Zypern wird bald das Knie beugen!" #NNT
 # flavor_cyprus.6.dt: "#R Die Königreiche der #E Alassan-Liga#! werden wahrscheinlich versuchen, #E Solois#! Marine mit Gewalt an sich zu reißen...#!\nDiese Option ist aufgrund der #Y Kampfkunst#! Fertigkeit Ihres Herrschers verfügbar." #NNT
  
 # flavor_cyprus.7.t: "Alashiyan-Botschafter" #NNT
 # flavor_cyprus.7.desc: "Die Stadtkönigreiche auf #E Alashiya#! brachten einst großen Reichtum in die #E phönizische#! Heimat zurück. Die erste phönizische Kolonie jenseits der #E Levante#! wurde im #E 9. Jahrhundert v. Chr.#! auf #E Alashiya#! gegründet, das die Griechen #E Kypros#! nennen. Diese „neue Stadt“, #E Qarthadast#! (bei den Griechen als Kition bekannt), diente als äußerst wichtiger Handelsknotenpunkt und ermöglichte es Tyros, seinen wirtschaftlichen Einfluss weit über die Levante hinaus auszuüben, wodurch es in die Lage versetzt wurde, den Mittelmeerraum mit Kolonien wie unserer eigenen Hauptstadt zu bevölkern. Sogar die Achämeniden erkannten die Verbindung zwischen Phönizien und #E Alashiya#! und ordneten beide der fünften Satrapie zu.\n\n Nach Jahrhunderten der Vorherrschaft endete die phönizische Herrschaft über Qarthadast jedoch, als der verhasste #!6 die Insel eroberte und das Königreich Qarthadast abschaffte. #!6s Versuche, die Insel #E Alashiya#! zu kontrollieren, wurden vereitelt, nachdem Demetrius die ptolemäische Flotte in der Schlacht von #E0 (306 v. Chr.) besiegt hatte. Danach eroberte Demetrius #E Alashiya#! und eroberte es für eine Weile zurück. \n\nNachdem #E Alashiya#!#! aus den Händen der Antigoniden gefallen ist, nutzen viele der alten Stadtstaaten von #E Alashiya#!, darunter #E Qarthadast#!, die Unterbrechung der makedonischen Präsenz, um ihre alten Königreiche wiederherzustellen. Drei dieser Königreiche: #E Qarthadast#!, #E 'I Mor#! und #E Amathous#! haben ausrichten lassen, dass wir in den kommenden Monaten mit der Ankunft von Botschaftern rechnen können, um einen radikalen Vorschlag anzuhören." #NNT
 # flavor_cyprus.7.a: "Wir freuen uns darauf, zu hören, was unsere phönizischen Brüder zu sagen haben." #NNT
 # flavor_cyprus.7.at: "#E Alashiyan#! Diplomaten werden bald eine Audienz bei den Sufets suchen." #NNT
 # flavor_cyprus.7.b: "Wir werden uns nicht in die Angelegenheiten von Alashiya einmischen." #NNT
 # flavor_cyprus.7.bt: "#R Die Diplomaten werden enttäuscht sein und ihre Herrscher könnten beleidigt sein.#!" #NNT
  
 # flavor_cyprus.8.t: "Abgesandte aus Alashiya" #NNT
 # flavor_cyprus.8.desc: "Eine Delegation aus Abgesandten dreier der seit kurzem unabhängigen Königreiche auf Zypern, die offenbar eine Art Bund gebildet haben: @[kition_country.GetFlag]! #Y Qarthadast#!, @[marion_country.GetFlag]! [marion_country.GetName|Y] und @[amathous_country.GetFlag]! [amathous_country.GetName|Y] sind in [ROOT.GetCountry.GetCapital.GetName] eingetroffen, um mit [ROOT.GetCountry.GetRuler.GetPraenomen] zu verhandeln. Alle drei Städte waren in ihrer Geschichte stark von Phöniziern geprägt und waren in ihrer Blütezeit recht wohlhabend. Nach dem Austausch von Höflichkeiten erklären die Botschafter, dass im Chaos nach dem Rückzug der Antigoniden die sich zurückziehenden Streitkräfte die meisten Seeschiffe auf der Insel Alashiya gekapert haben, die größer als kleine Fischerboote waren. Ohne diese Schiffe war der Handel, die Wirtschaftsader ihrer Städte, unterbrochen. Ihre Händler sind jetzt größtenteils auf die Küsten beschränkt und können sich nur gelegentliche Ausflüge auf die andere Seite des #E Levantinischen Meeres#Y0 leisten. Viele der wenigen Schiffe, die sie ausschicken, werden von #E Olban-Piraten#Y0 gekapert. Sogar von denen, die es bis in die Levante schaffen, werden oft exorbitante Anlegegebühren verlangt und bei jedem Besuch scheinen neue Steuern erhoben zu werden. \n\nDer leitende Botschafter von #Y4 flehte #Y3 um Unterstützung an und brachte die Bereitschaft seiner Städte zum Ausdruck, #E Karthago#Y6 Tribut zu zahlen, wenn #Y7 garantieren könne, dass ihre Handelsrechte geschützt und Berichte über Piraten angemessen behandelt würden.\n\nNachdem sein Gegenüber seine Bitte beendet hatte, fügte der Botschafter von #E Qarthadast#Y6 hinzu, dass seine Stadt sich gern in das karthagische Wirtschaftssystem integrieren würde, wenn ihr Schiffe und Geldmittel zugeteilt würden, sodass #E Qarthadast#Y6 seine Handelsrouten wiederbeleben und sich wieder mit den geschäftigen Märkten des Mittelmeers verbinden könne. Vielleicht um den Botschafter von Qarthadasti zu übertrumpfen, bat der Gesandte von #E 'I Mor#Y6 darum, dass wir Kolonisten nach Alashiya schicken, um die phönizische Bevölkerung zu vergrößern und direkter in die Regierung dieser jungen Staaten einzugreifen. Die anderen Botschafter nickten heftig und signalisierten ihre Bereitschaft, karthagischen Kolonisten die Besiedlung ihres Landes zu gestatten, und dass sie bereit wären, ihre Souveränität für Wohlstand aufzugeben. \n\n Dieser Vorschlag ist sicherlich sinnvoll, denn da die alten Städte unter ausländischer Herrschaft stehen, fällt die Führung der phönizischen Welt zu Recht Karthago zu, der '#E neuen-neuen Stadt#Y0'. Allerdings könnte die Regierung von #E Alashiya#Y6 von den Küsten #E Afrikas#Y6 aus eine logistische Herausforderung darstellen und notwendige Verbindlichkeiten schaffen..." #NNT
 # flavor_cyprus.8.a: "Wir können Ihnen Schutz und einen günstigen Handelsstatus gewähren." #NNT
 # flavor_cyprus.8.b: "Ihre Städte werden in die Hände der Karthager fallen." #NNT
 # flavor_cyprus.8.c: "Karthago kann derzeit keine Ressourcen entbehren" #NNT
 # flavor_cyprus.8.ct: "#R Die Diplomaten werden enttäuscht sein und ihre Herrscher könnten beleidigt sein.#!" #NNT
 # flavor_cyprus.8.d: "Wir heißen alle unsere phönizischen Brüder auf Alashiya willkommen!" #NNT
 # flavor_cyprus.8.dt: "Alle phönizischen Nationen auf #Y Zypern#! werden sich zu #E Alashiya#! zusammenschließen." #NNT
