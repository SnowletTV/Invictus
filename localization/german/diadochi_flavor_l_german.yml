 diadochi_flavor.71.t: "Eine königliche Hochzeit?"
 diadochi_flavor.71.desc: "Mit dem Zusammenbruch von @[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetName] hat sich das Kräfteverhältnis unter den Diadochen erneut verschoben. Während wir einen Großteil der ehemaligen Besitztümer der Antigoniden zurückeroberten, scheint [GetCountry('SEL').GetRuler.GetName] bereit zu sein, das Reich von [GetCharacter('(int32)39').GetPraenomen] gewaltsam wieder zu vereinen. Die Zeit zum Handeln ist gekommen. Derzeit stellt @[GetCountry('EGY').GetFlag]! [GetCountry('EGY').GetName] keine Bedrohung für uns dar, daher wäre es vielleicht ratsam, sie Freunde zu nennen – vorerst. Mit Hilfe von [GetCountry('EGY').GetRuler.GetName] können wir den 'Meister der Elefanten' aus [GetProvince('(int32)743').GetArea.GetRegion.GetName|E] und [GetProvince('(int32)1887').GetArea.GetRegion.GetName|E] vertreiben, sodass die Regionen unter unseren verbündeten Reichen aufgeteilt werden können.\n\nEs scheint, dass große Geister gleich denken, denn [GetCountry('EGY').GetRuler.GetPraenomen] hat Botschafter nach [GetCountry('TRE').GetCapital.GetName] entsandt und eine Heiratsallianz zwischen [arsinoe_ii_scope.GetName] und [GetCountry('TRE').GetRuler.GetPraenomen] angeboten."
 diadochi_flavor.71.a: "Also gut. Wir werden gemeinsam feiern!" 
 diadochi_flavor.71.at: "Wir werden in naher Zukunft einer Heirat zwischen [arsinoe_ii_scope.GetName] und [GetCountry('TRE').GetRuler.GetName] zustimmen und damit einer Allianz zwischen @[arsinoe_ii_scope.GetEmployer.GetFlag]! [arsinoe_ii_scope.GetEmployer.GetName|Y] und @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName|Y]" 
 diadochi_flavor.71.b: "Wir brauchen weder ihre Hilfe noch ihre Freundschaft." 
  
 arsionoe.desc_0: "Nach langen Monaten der Beratung wurde die Hochzeit von [GetCountry('TRE').GetRuler.GetPraenomen] und [arsinoe_ii_scope.GetPraenomen] endlich stattgefunden.\n\nBei ihrer Ankunft in @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName|E] wurde der Streitwagen von [arsinoe_ii_scope.GetPraenomen] in einer opulenten Prozession durch [GetCountry('TRE').GetRuler.GetEmployer.GetCapital.GetName] zum königlichen Palast eskortiert, wo sie in den zeremoniellen Apfel biss, der ihr von [GetCountry('TRE').GetRuler.GetPraenomen] überreicht wurde.\n\nSie heirateten dann in einer aufwendigen Zeremonie, an der Hunderte von Gästen teilnahmen und die mit Geschenken überhäuft wurden, gefolgt von einem königlichen Bankett mit Festessen und Feiern bis spät in die Nacht ..." 
  
