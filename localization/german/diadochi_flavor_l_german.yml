 diadochi_flavor.53.a: "Das Glück ist ein wankelmütiger Freund ..."
 diadochi_flavor.53.at: "@[antigonids_scope.GetFlag]! [antigonids_scope.GetName|Y] wurde von den anderen Diadochenstaaten aufgeteilt."
  
 diadochi_flavor.54.t: "[pleistarchus_scope.GetPraenomen] von [pleistarchus_satrapy.GetName]"
 diadochi_flavor.54.desc_01: "Obwohl Makedonien schon lange Anspruch auf #E Karien#! erhebt, wurde entschieden, dass die Herrschaft über Karien und Kilikien in die Hände einer scheinbar neutralen dritten Partei gelegt werden soll, die als Pufferstaat zwischen den nördlichen und östlichen Diadochen fungieren soll.\n\n" 
 diadochi_flavor.54.desc_02: "Makedonien erhob bei der jüngsten Aufteilung der [GetCountry('PRY').GetAdjective]en Beute Anspruch auf @[pleistarchus_satrapy.GetFlag]! [pleistarchus_satrapy.GetName|Y] und trieb damit einen Keil zwischen die nördlichen und östlichen Diadochen.\n\n" 
 diadochi_flavor.54.desc_1:1 "Da die Sieger der Konföderation zustimmten, wurde  [GetCharacter('(int32)32').GetPraenomen] von seinem treuen Bruder und General [pleistarchus_scope.GetPraenomen] überzeugt oder dazu gedrängt, ihm die Herrschaft über eine eigene Satrapie zu gewähren – mit nahezu vollständiger Unabhängigkeit."
 diadochi_flavor.54.desc_2: "Die Provinz wurde nun [pleistarchus_scope.GetPraenomen] anvertraut, einem angesehenen makedonischen Höfling und treuen General mit Erfahrung in der Region, der [pleistarchus_satrapy.GetName] mit weitreichender Autonomie regieren soll."
 diadochi_flavor.54.a: "Wir werden die Karriere von [pleistarchus_scope.GetPraenomen] mit großem Interesse verfolgen..."
 diadochi_flavor.54.at: "@[pleistarchus_satrapy.GetFlag]![pleistarchus_satrapy.GetName|Y] hat sich [GetCountry('MAC').GetName|Y] angeschlossen"
 diadochi_flavor.54.b: "Ich frage mich, was die Zukunft für [pleistarchus_scope.GetPraenomen] bereithält …" 
 diadochi_flavor.54.bt: "#R Wir wechseln zur Nation @[pleistarchus_satrapy.GetFlag]! #Y [pleistarchus_satrapy.GetName]#!#!" 
  
  
 diadochi_flavor.55.t: "Winde der Veränderung"
 diadochi_flavor.55.desc: "Der sich entwickelnde Kampf zwischen den Diadochen-Königreichen, einschließlich unserer Herren im [antigonids_scope.GetAdjective]en Reich, hat uns unserer alten Wohltäter beraubt.\n\n"
 diadochi_flavor.55.desc_1: "[transferred_subject.GetOverlord.GetAdjective]e Verwalter haben schnell dafür gesorgt, dass wir uns im Sinne unserer bisherigen untergeordneten Beziehung an die Vorgaben halten..."
 diadochi_flavor.55.desc_2: "Wir müssen uns nun auf unser eigenes Überleben konzentrieren und dabei umsichtig durch die neue politische Landschaft navigieren..."
 diadochi_flavor.55.a: "Die Schwachen müssen tun, was ihnen gesagt wird."
 diadochi_flavor.55.at: "Wir sind kein Untertan mehr von [antigonids_scope.GetName|Y] @[antigonids_scope.GetFlag]!"
  
 diadochi_flavor.56.t: "[attalid_head.GetFamilyDisplayAdjective]e Abtrünnigkeit"
 diadochi_flavor.56.desc: "Es scheint, dass unsere jüngsten Rückschläge sogar vertrauenswürdige Adlige veranlasst haben, ihre Loyalität und Pläne für die Zukunft zu überdenken.\n\n"
 diadochi_flavor.56.desc_1: "Die ehrgeizigen Attaliden - durch den Eunuch [GetCharacter('(int32)37').GetPraenomen] zu großer Bekanntheit im Königreich von [GetCharacter('(int32)385').GetPraenomen] gebracht - sind nach [thrace_scope.GetName] übergelaufen und haben [thrace_scope.GetRuler.GetPraenomen] ihre Loyalität angeboten ..."
 diadochi_flavor.56.desc_2: "Die bedeutende [attalid_head.GetFamilyDisplayAdjective]e Dynastie ist an den Hof von [thrace_scope.GetRuler.GetPraenomen] nach [thrace_scope.GetName] geflohen, um unseren Feinden ihre Loyalität zu schwören..."
 diadochi_flavor.56.desc_3: "Die bedeutende [attalid_head.GetFamilyDisplayAdjective]e Dynastie hat die Unterstützung der Bevölkerung in [GetProvince('(int32)290').GetArea.GetRegion.GetName] gewonnen,  um sich ein eigenes Reich mit [pergamon_scope.GetCapital.GetName] als Hauptstadt zu errichten!"
 diadochi_flavor.56.a: "Na und? Das wird schon ins Leere laufen."
 diadochi_flavor.56.at1: "[attalid_head.GetName|Y] und [attalid_head.GetHerHis]e Familie sind nach [GetCountry('TRE').GetName|Y] gezogen \nIhnen kann Land zum Regieren gewährt werden."
 diadochi_flavor.56.at2: "[attalid_head.GetName|Y] hat das Königreich [pergamon_scope.GetName|Y] gegründet."
  
 diadochi_flavor.57.t: "[attalid_head.GetFamilyDisplayAdjective]e  Abtrünnigkeit" 
 diadochi_flavor.57.desc: "[GetCountry('PRY').GetAdjective]e Rückschläge haben die Abtrünnigkeit vieler phrygischer Würdenträger begünstigt, die das Ende des Königreichs von Antigonos kommen sehen. [attalid_head.GetName|Y] ist ein angesehenes Mitglied des alten Hofes. Die turbulente Situation ausnutzend, hat [attalid_head.GetPraenomen] versucht, die [attalid_head.GetFamilyDisplayAdjective]e starke lokale Verbindungen zu nutzen, um [attalid_head.GetHerselfHimself] in Asien als Statthalter oder sogar als König der alten Stadt Pergamon zu etablieren.\n\n Pergamon ist gut aufgestellt, um ganz Kleinasien zu regieren, das größtenteils noch in den Händen von aufstrebenden Feldherren mit ungewisser Loyalität liegt. [attalid_head.GetPraenomen] argumentiert, dass es zweckmäßig wäre, die Herrschaft über Asien in einer Hand zu bündeln. Ein verbündeter und nominell unabhängiger Herrscher, dessen Loyalität gesichert ist, könnte als Bollwerk gegen die seleukidischen Ambitionen in Anatolien dienen."
 diadochi_flavor.57.a: "Basileos [attalid_head.GetPraenomen] klingt wirklich gut."
 diadochi_flavor.57.at: "Das #E [attalid_head.GetFamilyDisplayAdjective]e Königreich #Y Pegamon#!#! wird alle unsere Gebiete in #T Anatolien#! erhalten.\ n#Y Pegamon#! wird #T unabhängig#! und ein #Y Verbündeter#! von #Y [THIS.GetCountry.GetName]#!.\n#Y [attalid_head.GetName]#! wird Herrscher von #Y Pegamon#!"
  diadochi_flavor.57.sardis_1_tt: "#Y [sardis_scope.GetName]#! wird in den Herrschaftsbereich von von [attalid_head.GetPraenomen] aufgenommen." 
 diadochi_flavor.57.phrygia_1_tt: "#Y [galatia_satrapy.GetName]#! wird in den Herrschaftsbereich von [attalid_head.GetPraenomen] eingegliedert." 
 diadochi_flavor.57.b: "[attalid_head.GetPraenomen] soll in unserem Namen Mysien und Lydien regieren."
 diadochi_flavor.57.bt: "#Y Pergamon#! wird alle unsere Gebiete in  [GetProvince('(int32)278').GetArea.GetName], [GetProvince('(int32)257').GetArea.GetName] und [GetProvince('(int32)254').GetArea.GetName] erhalten.\n#Y Pergamon#! wird zu einer #Y Satrapie#! von #Y [THIS.GetCountry.GetName]#!.\n#Y [attalid_head.GetName]#! wird Herrscher von #Y Pergamon#!"
 diadochi_flavor.57.c: "Er wird ein nützliches Werkzeug sein, aber [attalid_head.GetPraenomen] ist kein König." 
 diadochi_flavor.57.ct: "#Y [attalid_head.GetName]#! wird Herrscher über #Y Pergamon#! und dessen unmittelbare Umgebung\n#Y Pergamon#! wird zu einer #Y Satrapie#! von #Y [THIS.GetCountry.GetName]#!." 
 diadochi_flavor.57.sardis_tt: "[sardis_scope.GetRuler.GetFullName] wird als Satrap von #Y $asia_region$#! ersetzt."
 diadochi_flavor.57.d: "Das hat mich auf eine ganz wunderbare Idee gebracht..." 
 diadochi_flavor.57.dt: "In den kommenden Monaten wird [THIS.GetCountry.GetRuler.GetPraenomen] entscheiden, ob er eine #Y Satrapie#! des hellespontischen Phrygiens bestimmen wird." 
 diadochi_flavor.57.e: "Ein guter Vorschlag, aber [attalid_head.GetPraenomen] ist nicht vertrauenswürdig."
 diadochi_flavor.57.tt: "Die [attalid_head.GetFamilyDisplayAdjective]e Familie  ist in @[THIS.GetCountry.GetFlag]! [THIS.GetCountry.GetName|Y] angekommen!."
  
 diadochi_flavor.58.t: "[attalid_head.GetFamilyDisplayAdjective]es Reich" #Antigonidischer Wechsel
 diadochi_flavor.58.desc: "Wie Ratten, die vor einer sinkenden Trireme fliehen, hat sich die Dynastie der Attaliden – ehemals treue Diener der Antigoniden – in [GetProvince('(int32)278').GetName] niedergelassen und sich verpflichtet, das Gebiet in unserem Namen zu regieren."
 diadochi_flavor.58.a: "Ha!"
  
 diadochi_flavor.59.t: "Der Aufstieg von Pergamon"
 diadochi_flavor.59.desc: "In den chaotischen Kämpfen um [GetProvince('(int32)290').GetArea.GetRegion.GetName] hat die [attalid_head.GetFamilyDisplayAdjective]e Familie  - Adlige, die früher im Dienst der Antigoniden standen - ein neues Reich um Pergamon in [attalid_head.GetEmployer.GetCapital.GetArea.GetName] errichtet."
 diadochi_flavor.59.desc_subject: "\n\nEs scheint, dass ihre Anwesenheit von [attalid_head.GetEmployer.GetOverlord.GetRuler.GetName] von [attalid_head.GetEmployer.GetOverlord.GetName] gebilligt wurde, denen die [attalid_head.GetFamilyDisplayAdjective]e Familie  formal als Statthalter des Gebiets dient."
 diadochi_flavor.59.a: "Pergamon, oder?"
 diadochi_flavor.59.at: "@[attalid_head.GetEmployer.GetFlag]!#Y Pergamon#! wurde erschaffen."
  
 #New Diadochi Events 
 diadochi_flavor.60.desc_1: "\n\nObwohl wir nicht in der Lage waren, von diesen Entwicklungen so viel zu profitieren wie ihre direkten Nachbarn, nutzten unsere Soldaten und Partisanen die Gelegenheit, die Kontrolle über die [GetCountry('PRY').GetAdjective]en Garnisonen auf dem Festland [GetProvince('(int32)418').GetArea.GetRegion.GetName] zu übernehmen, als diese von der Nachricht des Todes ihres Königs erschüttert waren …" 
 diadochi_flavor.60.desc_2: "\n\nNun, da das Reich der Antigoniden zerfällt, befinden sich die Satrapien @[caria_satrapy.GetFlag]! #E Karien#! und @[cilicia_satrapy.GetFlag]! [GetProvince('(int32)1883').GetArea.GetRegion.GetName] in einem Übergangszustand und könnten möglicherweise unter unseren Einfluss geraten. Aufgrund ihrer geografischen Lage sind diese Satrapien jedoch für unser Königreich schwer zu kontrollieren. [pleistarchus_scope.GetName] hat beharrlich auf [pleistarchus_scope.GetHerHis]e Treue und die entfernte Lage der Provinzen verwiesen, um seine Ernennung zum Satrapen in dieser Region zu rechtfertigen...Wenn [pleistarchus_scope.GetPraenomen] alles bekäme, was [pleistarchus_scope.GetSheHe] sich wünscht, wäre [pleistarchus_scope.GetSheHe]  in der Lage, [pleistarchus_scope.GetHerHis] eigenes Reich zu errichten. Ein Bündnis mit einem strategisch günstig gelegenen Pufferkönigreich würde sicherlich dazu beitragen, unsere Position in der Region zu stabilisieren und gleichzeitig die meisten unserer persönlichen Risiken zu mindern, obwohl wir es vielleicht bereuen würden, diese Gewinne aufgegeben zu haben."
 diadochi_flavor.60.desc_3: "\n\nAuch wenn wir aus dieser Wendung der Ereignisse nicht unmittelbar Nutzen ziehen konnten, ist das Unglück, das die Antigoniden ereilt hat, stets willkommen..." 
 diadochi_flavor.60.desc_4: "\n\nUnsere Soldaten und Anhänger nutzten die Gelegenheit, die Kontrolle über die [GetCountry('PRY').GetAdjective]en Garnisonen auf dem Festland [GetProvince('(int32)418').GetArea.GetRegion.GetName] zu übernehmen, als diese von der Nachricht des Todes ihres Königs erschüttert waren..." 
 diadochi_flavor.60.desc_5: "\n\nObwohl es uns nicht gelungen ist, die [GetCountry('PRY').GetAdjective]en Garnisonen vom Festland [GetProvince('(int32)418').GetArea.GetRegion.GetName] zu vertreiben, ist ein Unglück der Antigoniden immer willkommen..." 
 diadochi_flavor.60.desc_6: "" #fehlt?
