 diadochi_flavor.74.desc: "Die verfluchten [GetCountry('TRE').GetRuler.GetFamilyDisplayAdjective]en haben unseren Vorschlag, uns durch eine Heirat zwischen [arsinoe_ii_scope.GetName] und [GetCountry('TRE').GetRuler.GetPraenomen] gegen die Seleukiden zu verbünden, abgelehnt und die politischen Unruhen als Grund zur Unsicherheit genannt.\n\nWir hatten auf ihre Unterstützung in den unvermeidlichen Konflikten in [GetProvince('(int32)743').GetArea.GetRegion.GetName|E] und [GetProvince('(int32)1887').GetArea.GetRegion.GetName|E] gesetzt. Wir müssen noch einmal Bilanz ziehen ..." 
