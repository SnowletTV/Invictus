 diadochi_flavor.61.t: "Satrapie von [ptolemy_new_satrapy.GetName]"
 diadochi_flavor.61.desc: "Mit dem Schrumpfen des Antigonidischen Königreichs warten unzählige Anwärter darauf, wie Geier auf eine Leiche, den Titel des Satrapen von [ptolemy_new_satrapy.GetName] zu erringen. Glücklicherweise hat sich [ptolemy_new_satrapy.GetRuler.GetName], ein loyaler Unterstützer von [ROOT.GetCountry.GetRuler.GetName], durchgesetzt. [ptolemy_new_satrapy.GetRuler.GetPraenomen] scheint bereit, aber widerstrebend, seine neu gewonnenen Gebiete an [ROOT.GetCountry.GetRuler.GetPraenomen] abzutreten, und hat Gesandte nach [ROOT.GetCountry.GetCapital.GetName] geschickt, die [ROOT.GetCountry.GetRuler.GetPraenomen] bitten, [ptolemy_new_satrapy.GetRuler.GetHerHis]e Position als Satrap von [ptolemy_new_satrapy.GetName] zu bestätigen. Die Botschafter verweisen hartnäckig auf [ptolemy_new_satrapy.GetRuler.GetHerHis]e Loyalität und die Entfernung der Provinzen, um die Ernennung von [ptolemy_new_satrapy.GetRuler.GetPraenomen] zu unserem Satrapen in [ptolemy_new_satrapy.GetName] zu rechtfertigen. Ihr Vorschlag ist nicht ohne Wert, da [ptolemy_new_satrapy.GetName] aufgrund seiner geografischen Lage ein schwer zu kontrollierendes Gebiet für unser Reich darstellt."
 diadochi_flavor.61.a: "@[ptolemy_new_satrapy.GetFlag]! [ptolemy_new_satrapy.GetName] soll Dir zur Verfügung stehen und Dir gehören." 
 diadochi_flavor.61.b: "@[ptolemy_new_satrapy.GetFlag]! [ptolemy_new_satrapy.GetName] braucht keinen Satrapen." 
 diadochi_flavor.61.bt: "@[ptolemy_new_satrapy.GetFlag]! [ptolemy_new_satrapy.GetName] wird #R annektiert #! und [ptolemy_new_satrapy.GetRuler.GetName] wird sich unserem Hof anschließen." 
  
  #Not used 
 diadochi_flavor.62.t: "Zugeständnisse an [GetCountry('TRE').GetName]" 
 diadochi_flavor.62.desc: "Die griechischen Städte der Troas, in denen sich die Ruinen der sagenumwobenen Stadt Troja befinden, blühten dank ihrer strategischen Lage am Hellespont lange Zeit auf und verfügten über starke Handelstraditionen sowie Zugang zu wichtigen Handelswegen zwischen Europa und Asien. Die bedeutendsten Städte der Region – Ilion, Dardanos, Skepsis, Assos, Alexandria Troas, Abydos und Lampsakos – sind traditionell im Koinon der Athena Ilias vereint, einem religiösen und politischen Bund, der unter der Führung von Antigonos I. Monophthalmos gegründet wurde. Dieser Bund wurde gegründet, um das jährliche Panathenaia-Fest im heiligen Heiligtum der Athena Ilias in Troja zu veranstalten, einem mächtigen Symbol der Einheit und des gemeinsamen Erbes für die Städte der Region. \n\n Nun haben uns Gesandte aus [GetCountry('PRY').GetAdjective] mitgeteilt, dass sie im Rahmen eines Abkommens mit dem alkimachidischen Königreich Thrakien vereinbart haben, dass [ROOT.GetCountry.GetName] eine #E alkimachidische #! Besitzung werden soll." 
 diadochi_flavor.62.a: "Es sieht so aus, als hätten wir einen neuen Gottkönig!" 
  
 nearchos_description: "Obwohl er ein gebürtiger #E Kreter#! war, wuchs [GetCharacter('(int32)71').GetPraenomen] in [GetCountry('MAC').GetName] auf und war einer von [GetCharacter('(int32)32').GetPraenomen]s Jugendfreunden. Er wurde zusammen mit Ptolemäus und anderen verbannt, nachdem er Alexandros dazu gedrängt hatte, zu versuchen, #E Pixodarus'#! Tochter zu heiraten, was den Wunsch von #E Philipp#! verletzte. [GetCharacter('(int32)71').GetPraenomen] und die anderen wurden nach Philipps Tod zurückgerufen. Bald darauf ernannte #E Alexandros#! [GetCharacter('(int32)71').GetPraenomen] zum #E Satrapen#! von #E Lykien#! und #E Pamphylien#!. Im Jahr 326 v.Chr. wurde [GetCharacter('(int32)71').GetPraenomen] zum Admiral der Flotte ernannt, die Alexandros am #E Hydaspes#! aufgebaut hatte. Die Flotte zog triumphierend den #E Hydaspes#! hinab, eine Zeit lang begleitet von [GetCharacter('(int32)32').GetPraenomen]s Armee, bevor sie ohne Bodentruppen weiterzog und zahllose indische Städte eroberte. Schließlich wurde [GetCharacter('(int32)71').GetPraenomen] zur Vorbereitung zukünftiger Eroberungen nach Arabien geschickt, bevor er sich Alexandros zuwandte, um ihm zu berichten, was er erfahren hatte. [GetCharacter('(int32)71').GetPraenomen] hätte wahrscheinlich in [GetCharacter('(int32)32').GetPraenomen]s Plänen zur Eroberung von #E Arabien#! und #E Karthago#! eine Rolle gespielt, aber diese Pläne wurden durch den Tod des Königs zunichte gemacht. Vielleicht mehr als jeder andere erlitt [GetCharacter('(int32)71').GetPraenomen] nach dem Tod von #E Alexandros#! einen großen Statusverlust, da er sich dem Hof von [GetCharacter('(int32)37').GetPraenomen] anschloss, nachdem er den Zorn von #E Perdikkas#! auf sich gezogen hatte." 
  
 diadochi_flavor.63.t: "Nearchos von Kreta" 
 diadochi_flavor.63.desc: "$nearchos_description$\n\nEs scheint, dass [GetCharacter('(int32)71').GetPraenomen] einen detaillierten Bericht über seine Erlebnisse geführt hat. Nachdem er sich von seiner Rolle als Berater von #E Demetrius#! zurückgezogen hat, hatte [GetCharacter('(int32)71').GetPraenomen] Zeit, diese in einem Text zusammenzufassen, in dem #E Indiens#! Grenzen, Größe, Bevölkerung, Kasten, Fauna, Flora, Kulturen und Militärs detailliert beschrieben werden.\n\n[GetCharacter('(int32)71').GetPraenomen] hat angedeutet, dass in der von makedonischen Schreibern kopierten Version wichtige Details fehlen, die für jeden, der das Reich von [GetCharacter('(int32)39').GetPraenomen] wiedervereinigen möchte, von unschätzbarem Wert wären. Diese Geheimnisse könnten uns gehören, aber sie haben einen hohen Preis. [GetCharacter('(int32)71').GetPraenomen] möchte für die mühsame Arbeit, die es erforderte, diesen Text, dieses #E Indike#!,angemessen entschädigt werden." 
 diadochi_flavor.63.a: "[GetCharacter('(int32)71').GetPraenomen] verdient eine Belohnung für seine Bemühungen." 
 diadochi_flavor.63.b: "Welchen Nutzen hätten wir für eine solche Arbeit?" 
 diadochi_flavor.63.bt: "#R Nearchos könnte auf der Suche nach einem Wohltäter zu einem anderen unserer Diadochen überlaufen. #!" 
  
 diadochi_flavor.64.t: "Nearchos von Kreta" 
 diadochi_flavor.64.desc: "$nearchos_description$\n\n Es scheint, als habe sich Antigonus mit Nearchos überworfen, indem er den Wert von Nearchos’ '#E Indike,#!' herabgewürdigt hat – einer Aufzeichnung seiner Erlebnisse, die Nearchos verfasste, nachdem er sein Amt als Berater von #E Demetrius#! niedergelegt hatte. Die '#E Indike,#!' enthält detaillierte Informationen über #E Indiens#! Grenzen, Größe, Bevölkerung, Kasten, Fauna, Flora, Kulturen und Streitkräfte.\n\n[GetCharacter('(int32)71').GetPraenomen] hat angedeutet, dass die von makedonischen Schreibern kopierte Fassung wichtige Details auslässt, die für jeden, der das Reich von [GetCharacter('(int32)39').GetPraenomen]  wiedervereinigen möchte, von unschätzbarem Wert wären. Diese Geheimnisse könnten uns gehören, aber sie haben einen hohen Preis dafür. [GetCharacter('(int32)71').GetPraenomen] möchte für die mühevolle Arbeit, die zur Zusammenstellung dieses Textes, dieser '#E Indike#!'' erforderlich war, 'angemessen entschädigt' werden." 
 diadochi_flavor.64.a: "[GetCharacter('(int32)71').GetPraenomen] verdient eine Belohnung für seine Bemühungen." 
 diadochi_flavor.64.at: "Nearchos wird in unseren Dienst treten" 
 diadochi_flavor.64.b: "Welchen Nutzen hätten wir für eine solche Arbeit?" 
 diadochi_flavor.64.bt: "#R Nearchos könnte versuchen, einen weiteren Wohltäter unter unseren Diadochen-Kollegen zu finden#!" 
  
 treasure_indike_manuscript: "Indike-Manuskript" 
 treasure_indike_manuscript_desc: "Diese schlichte Schriftrolle ist der handschriftliche Originalbericht von Admiral Nearchos über seine beschwerliche Reise von der Mündung des Indus in Indien bis zum Persischen Golf. Der Admiral Nearchos, auf den sich Alexander stützte, verfasste eine Chronik seiner großen Seereisen und eine Beschreibung des indischen Subkontinents, wie er ihn erlebt hatte. Kopien seines Werks 'Indike' wurden weit verbreitet, doch dieses Originalmanuskript enthält Details, die in diesen Abschriften ausgelassen wurden." 
  
 iasos_description: "[GetProvince('(int32)275').GetName] wurde im 9. Jahrhundert v.Chr. von griechischen Kolonisten aus Argos gegründet und liegt strategisch günstig auf einer kleinen Insel vor der karischen Küste, die später mit dem Festland verbunden wurde. Bekannt für seinen strategisch günstigen Hafen und seine reichen Fischgründe, florierte [GetProvince('(int32)275').GetName] und erlangte Reichtum und Bekanntheit durch seinen charakteristischen rot-weißen 'Isianischen Marmor', der an den nahe gelegenen Hügeln abgebaut wurde.\n\nIm Jahr 309 v. Chr. unterzeichnete [GetProvince('(int32)275').GetName] einen Vertrag, in dem festgelegt wurde, dass [GetProvince('(int32)275').GetName] Ptolemaios wohlgesinnt sein und ihm und seinen Nachkommen für alle Zeiten ein Verbündeter sein solle, frei und autonom, ohne Garnison und von Tributpflicht befreit. Dies verschaffte dem ptolemäischen Königreich einen entscheidenden Stützpunkt in Karien. Die Beziehungen zwischen [GetProvince('(int32)275').GetName] und dem ptolemäischen Königreich wurden jedoch durch Demetrios' Eingreifen in dem Gebiet und die katastrophale Seeniederlage bei Salamis gestört." 
  
 diadochi_flavor.65.t: "Die Marmorinsel" 
 diadochi_flavor.65.desc: "$iasos_description$\n\nNun hat der neu eingesetzte ptolemäische Vertreter in der Region, [aristoboulos_scope.GetName], gefordert, dass wir unsere Macht über [GetProvince('(int32)275').GetName] aufgeben und uns mit ihm verbünden, um erneut ein 'unabhängiger Verbündeter' des ptolemäischen Königreichs zu werden." 
 diadochi_flavor.65.a: "Wir werden keinen Zentimeter nachgeben!"
 diadochi_flavor.65.at: "Das #Y Ptolemäische Königreich#! erhält Ansprüche auf #E Iasos#! und #E Karien#!."
 diadochi_flavor.65.b: "Die Schwachen müssen tun, was ihnen gesagt wird."
 diadochi_flavor.65.bt: "Die Autorität über [GetProvince('(int32)275').GetName] wird an das #Y Ptolemäische Königreich#! @[GetCountry('EGY').GetFlag]! übergeben" 
  
