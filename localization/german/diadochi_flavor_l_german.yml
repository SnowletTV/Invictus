 diadochi_flavor.83.t: "Die antigonidische Sache wankt" 
 diadochi_flavor.83.desc_1: "\n\nObwohl wir diese Entwicklungen nicht so stark nutzen konnten wie ihre direkten Nachbarn, nutzten unsere Soldaten und Anhänger die Gelegenheit, um die Kontrolle über die [GetCountry('PRY').GetAdjective]e Garnisonen auf dem Festland [GetProvince('(int32)418').GetArea.GetRegion.GetName]  zu übernehmen, als diese unter der Nachricht vom Tod ihres Königs ins Wanken gerieten..." 
 diadochi_flavor.83.desc_2: "\n\nObwohl es uns nicht gelungen ist, die [GetCountry('PRY').GetAdjective]e Garnisonen auf dem Festland [GetProvince('(int32)418').GetArea.GetRegion.GetName], zu vertreiben, ist das Unglück, das die Antigoniden ereilt hat, immer willkommen..." 
 diadochi_flavor.83.desc_3: "[pleistarchus_scope.GetPraenomen] ist sowohl ein vertrauter Freund von  [GetCountry('TRE').GetRuler.GetPraenomen] als auch ein Angerhöriger von  [GetCountry('MAC').GetRuler.GetPraenomen]. In Anerkennung seiner maßgeblichen Rolle bei der Herbeiführung des Sturzes der Antigoniden wurde beschlossen, ihm die Satrapie von #E @[GetCountry('CIA').GetFlag]! [GetCountry('CIA').GetName]#! als Belohnung zu übertragen.\n\nUm die Bedenken von  [GetCountry('EGY').GetRuler.GetPraenomen] und [GetCountry('SEL').GetRuler.GetPraenomen] zu zerstreuen, wird [pleistarchus_scope.GetPraenomen] die unabhängige Herrschaft über seine neue Provinz übertragen, ohne dass er jemandem unterstellt ist. Dennoch wird er aufgrund seiner persönlichen Verbindungen sicherlich enge Beziehungen sowohl zu  [GetCountry('TRE').GetRuler.GetName] als auch zu  [GetCountry('MAC').GetRuler.GetName] pflegen."
