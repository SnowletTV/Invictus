 ELYMAIS_ADJ: "Elymäisch"
  
 flavor_sel.8.t: "Ein syrisches Königreich" 
 flavor_sel.8.desc: "Die Winde des Schicksals haben sich gegen uns gewendet und uns gezwungen, das alte Kernland Babylons aufzugeben. Doch selbst in der Not ergeben sich Chancen. Syrien mit seiner strategischen Lage und seinen natürlichen Befestigungen bietet uns die Chance, unser Reich wieder aufzubauen und zu stärken. Indem wir uns als Könige Syriens etablieren, verankern wir unsere Herrschaft an der Kreuzung von Ost und West, sichern unser Überleben und bereiten den Weg für die zukünftige Rückeroberung unserer verlorenen Gebiete. Heute wurde der [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName] im Rahmen einer großen Zeremonie zum König von Syrien gekrönt.\n\nDie Krönung war ein großes Ereignis, an dem Würdenträger, Generäle und Abgesandte aus allen verbleibenden Gebieten teilnahmen. Mit der Platzierung des Diadems auf dem Kopf von [ROOT.GetCountry.GetRuler.GetName] wurde ein feierlicher Eid abgelegt: Syrien zu schützen, seine Verteidigung zu stärken und eines Tages stark genug aufzusteigen, um den Osten zurückzuerobern. Obwohl unser Herrschaftsbereich geschrumpft ist, bleibt der Geist des [ROOT.GetCountry.GetRuler.GetFamily.GetName]en Hauses  ungebrochen.\n\nIm Rahmen dieser Neuorganisation werden unsere Gebiete entlang des Roten Meeres konsolidiert, um eine effektivere Verwaltung zu gewährleisten. Der Verlust der direkten Kontrolle über die Länder entlang des Sinus Persicus ist eine bittere Pille, erfordert aber eine stärkere Abhängigkeit von unseren Satrapen, die nun als quasi-unabhängige Dynasten regieren werden. Diese Dezentralisierung ist zwar riskant, ermöglicht es uns jedoch, unsere Ressourcen auf die Kerngebiete Syriens zu konzentrieren und uns auf zukünftige Unternehmungen vorzubereiten." 
 flavor_sel.8.a: "Heil dem König von Syrien!" 
  
  
 dhe_thrace_flavor.1.t:0 "Wie Alexander erzogen wurde"
 dhe_thrace_flavor.1.desc:0 "[SCOPE.sChar('onesikritos_historian').GetPraenomen], unser [SCOPE.sChar('onesikritos_historian').GetOffice.GetName], hat um Audienz gebeten, damit [SCOPE.sChar('onesikritos_historian').GetSheHe] aus [SCOPE.sChar('onesikritos_historian').GetHerHis]er neuen Abhandlung über das Leben und die Taten Alexanders des Großen vorlesen kann. Als Alexanders ehemaliger Leibwächter war Lysimachos bei den meisten wichtigen Momenten in Alexanders Leben anwesend und freut sich riesig darauf. Es fängt gut an, aber im Laufe der Geschichte bemerkt Lysimachos immer mehr Ereignisse, an die er sich nicht mehr erinnern kann.\n\nEr beginnt sich zu fragen, ob sich [SCOPE.sChar('onesikritos_historian').GetOffice.GetName] einige der Ereignisse einfach ausgedacht hat. Sein eigenes Gedächtnis würde ihm sicherlich keinen Streich spielen. Schließlich beginnt [SCOPE.sChar('onesikritos_historian').GetPraenomen] eine Geschichte über die Zeit zu erzählen, als Alexander eine Audienz bei der Königin der Amazonen hatte, an die sich Lysimachos mit Sicherheit erinnern würde ..."
 dhe_thrace_flavor.1.a:0 "Und wo war ich zu der Zeit!?"
 dhe_thrace_flavor.1.b:0 "Ah, das! Daran erinnere ich mich gut!"
 dhe_thrace_flavor.2.t:0 "Ein Löwenmärchen"
 dhe_thrace_flavor.2.desc:0 "Unser Basileus, so groß er auch sein mag, liebt es, Geschichten über seine Tage als Alexanders Leibwächter zu erzählen und sich daran zu erinnern. Seine absolute Lieblingsgeschichte ist die, in der er Alexander bei einer Jagd vor einem Löwenangriff das Leben gerettet hat. Lysimachos wird diese Geschichte jedem erzählen, der bereit ist zuzuhören, normalerweise einem ahnungslosen Höfling und die große Narbe zur Schau stellen, die der Löwe ihm zugefügt hat.\n\nDiesmal hat er es geschafft, [SCOPE.sChar('lion_tale_audience').GetPraenomen] in die Enge zu treiben. [SCOPE.sChar('lion_tale_audience').GetSheHe|U] sieht Lysimachos voller Besorgnis an, unwissend, was passieren wird. Lysimachos schaut [SCOPE.sChar('lion_tale_audience').GetHerHim] direkt in die Augen und beginnt: "Als der Löwe in wilder Wut laut brüllte ..."
 dhe_thrace_flavor.2.a:0 "Nein! Nicht schon wieder!"
 dhe_thrace_flavor.2.a.tt:0 "[SCOPE.sChar('lion_tale_audience').GetPraenomen] versucht zu entkommen, doch Lysimachos packt [SCOPE.sChar('lion_tale_audience').GetHerHis]en Arm und hebt seine Tunika an, um seine Narbe zu zeigen.\n "
 dhe_thrace_flavor.2.b:0 "Oh! Ich liebe diese Geschichte!"
 dhe_thrace_flavor.2.b.tt:0 "[SCOPE.sChar('lion_tale_audience').GetPraenomen] setzt sich zu Lysimachos und lauscht gespannt seiner Geschichte.\n "
  
  
  
  
 ###Parthia 
 diadochi_flavor.100.t:0 "Eine Möglichkeit für den Angriff"
 diadochi_flavor.100.desc:0 "Die schwache [SCOPE.sC('origin').GetRuler.GetFamilyDisplayName]en-Dynastie lauert im Westen und beansprucht die nominelle Lehnsherrschaft über weite Landstriche.\n\nIn Wahrheit jedoch sind wir die Einzigen, die es wagen, die Wahrheit auszusprechen: Die Legitimität der Seleukiden-Herrschaft ist vorüber.\n\nEs ist daher von großem Interesse für uns, dass einer unserer Jagdtrupps vor Kurzem nach Hause gehumpelt kam, nachdem er von einer Grenzpatrouille in Begleitung von [SCOPE.sC('origin').GetRuler.GetName], [SCOPE.sC('origin').GetRuler.Custom('get_DerDem')] [SCOPE.sC('origin').GetRulerTitle] von [SCOPE.sC('origin').GetName], angegriffen wurde. Mit einer schnellen Antwort könnten wir ihnen vielleicht einen schweren Schlag versetzen, obwohl dies sicherlich auch Anlass für einen regelrechten Krieg wäre."
 diadochi_flavor.100.a:0 "Unsere Zeit ist jetzt!"
 diadochi_flavor.100.b:0 "Wir dürfen das fragile Gleichgewicht der Kräfte nicht gefährden."
 
 diadochi_flavor.101.t:0 "Parthische Horde"
 diadochi_flavor.101.desc:0 "In einem Augenblick der Schwäche sind die Horden der [SCOPE.sC('target').GetAdjective]en Wüste über das [SCOPE.sC('origin').GetRuler.GetFamilyDisplayName]en-Land gekommen, wie ein Rudel Wölfe ein Lamm zerfleischen würde.\n\nDer Angriff ereignete sich ohne Vorwarnung und [SCOPE.sC('origin').GetRulerTitle] [SCOPE.sChar('sel_rul').GetPraenomen] war unter den ersten Opfern, da [SCOPE.sC('origin').GetRuler.GetSheHe] zu jener Zeit gerade die Grenzregion bereiste.\n\nAls ob diese apokalyptischen Wendung der Ereignisse nicht schon genug wäre, hat sich der Adel unseres [SCOPE.sC('origin').GetAdjective]en Reiches nun auch noch gegeneinander gewandt und zankt sich darum, einen legitimen Nachfolger zu bestimmen: Wird der Titan des Ostens zugrunde gehen?"
 diadochi_flavor.101.a:0 "Wehe!"
 seleucid_struggles:0 "Ein Zwist!"
 desc_seleucid_struggles:0 "Durch den Angriff der parthischen Horden provoziert befindet sich das Reich in Aufruhr."
  
  
 egypt_cypriot_kings: "Zypriotische Könige" 
 egypt_cypriot_kings_desc: "Vor dem Tod von Perdikkas (321 v. Chr.) hatte Ptolemaios ein Bündnis mit Nikokreon geschlossen, dem bedeutendsten der zypriotischen Könige. 316 v. Chr. wurde Zypern zum Schlachtfeld zwischen Ptolemaios und Antigonos um die Kontrolle über das Mittelmeer. Neben Nikokreon gab es drei weitere loyale Vasallenkönige: Nikokles von Paphos, Androkles von Amathus und Pasikrates von Soli. Die anderen Könige Zyperns verbündeten sich mit Antigonos. Ptolemaios‘ militärische Intervention unter dem Kommando seines Bruders Menelaos erwies sich als erfolgreich bei der Niederschlagung rebellischer Könige. Im Jahr 312 verdrängte Ptolemaios alle zypriotischen Könige mit Ausnahme von Nikokreon von [GetProvince('(int32)331').GetName] (und vielleicht Eunostos von [GetProvince('(int32)333').GetName]). Ptolemaios vermählte seine Tochter Eirene mit Eunostos, kurz nachdem Eunostos' Vater gestorben war, um sicherzustellen, dass der neue König eines führenden zypriotischen Königreichs loyal bleiben würde. Nikokreons Herrschaftsgebiete wurden stark erweitert; er wurde zum obersten ptolemäischen Offizier auf der Insel ernannt und zum Strategos von Zypern ernannt.\n\nObwohl Nikokreon von Ptolemaios begünstigt wurde, führte sein Tod (möglicherweise durch erzwungenen Selbstmord) im Jahr 309 v.Chr. zu einer direkten ptolemäischen Verwaltung Zyperns und zur Abschaffung der verbleibenden unabhängigen zypriotischen Königreiche. Ptolemaios' Bruder Menealos übernahm Nikokreons Rolle; er wurde zum König von [GetProvince('(int32)331').GetName] und Satrap von Zypern ernannt." 
 egypt_cypriot_kings_reward_tt: "Wir werden bestimmen, wie #E #Y Zypern#!#! verwaltet werden soll" 
  
 #Cyprus Events 
 flavor_cyprus.1.t: "[eunostos_of_soloi.GetPraenomen] von [GetProvince('(int32)333').GetName]"
 flavor_cyprus.1.desc: "Vor dem Tod von #E Perdikkas#! (321 v. Chr.) hatte [GetCharacter('(int32)42').GetPraenomen] ein Bündnis mit Nikokreon geschlossen, dem bedeutendsten der zypriotischen Könige. 316 v.Chr. wurde Zypern zum Schlachtfeld zwischen [GetCharacter('(int32)42').GetPraenomen] und #E Antigonos#! um die Kontrolle über das Mittelmeer. Neben #E Nikokreon#! gab es drei weitere loyale Vasallenkönige: #E Nikokreon#! von Paphos, #E Androkles#! von Amathus und #E Pasikrates#! von Soli. Die anderen Könige Zyperns verbündeten sich mit Antigonos. [GetCharacter('(int32)42').GetPraenomen]s militärische Intervention unter dem Kommando seines Bruders Menelaos erwies sich als erfolgreich bei der Niederschlagung rebellischer Könige. Im Jahr 312 stürzte [GetCharacter('(int32)42').GetPraenomen] alle zypriotischen Könige mit Ausnahme von Nikokreon von [GetProvince('(int32)331').GetName] (und vielleicht Eunostos von [GetProvince('(int32)333').GetName]). [GetCharacter('(int32)42').GetPraenomen] vermählte seine Tochter Eirene mit Eunostos, kurz nachdem Eunostos' Vater gestorben war, um sicherzustellen, dass der neue König eines führenden zypriotischen Königreichs loyal bleiben würde. Nikokreons Herrschaftsgebiete wurden erheblich erweitert, als ihm die Herrschaft über Gebiete übertragen wurde, die Königen entrissen worden waren, die der Sache der Antigoniden treu ergeben waren. Er wurde zum obersten ptolemäischen Offizier auf der Insel ernannt und zum Strategos von Zypern ernannt.\n\nObwohl Nikokreon von [GetCharacter('(int32)42').GetPraenomen] begünstigt wurde, führte sein Tod (möglicherweise durch erzwungenen Selbstmord) im Jahr 309 v. Chr. zu einer direkten ptolemäischen Verwaltung Zyperns und der Abschaffung der verbleibenden unabhängigen zypriotischen Königreiche. [GetCharacter('(int32)42').GetPraenomen]s Bruder Menealos übernahm Nikokreons Rolle; er wurde zum König von [GetProvince('(int32)331').GetName] und zum Satrapen von Zypern ernannt.\n\nNachdem Zypern nun nicht mehr unter der Kontrolle der Antigoniden steht, hat [menelaos_lagid.GetPraenomen] in unserem Namen die Kontrolle über die Insel übernommen; [eunostos_of_soloi.GetPraenomen], der angeblich rechtmäßige Herrscher von [GetProvince('(int32)333').GetName], drängt [ROOT.GetCountry.GetRuler.GetPraenomen] jedoch unaufhörlich,  [eunostos_of_soloi.GetHerHis]efamilären Ländereien zurückzugeben. Er bietet beträchtliche Goldsummen an und argumentiert, dass [ROOT.GetCountry.GetRuler.GetPraenomen] sich nie davor fürchten müsse, wo [eunostos_of_soloi.GetHerHis]eLoyalität liege. Für [ROOT.GetCountry.GetRuler.GetPraenomen] ist jedoch klar, dass [eunostos_of_soloi.GetPraenomen] nicht nur [eunostos_of_soloi.GetHerHis]enStammsitz von regieren will, sondern ganz Zypern unterwerfen will..." 
 flavor_cyprus.1.a: "[eunostos_of_soloi.GetPraenomen] nach Soloi zurückkehren lassen." 
 flavor_cyprus.1.at: "[eunostos_of_soloi.GetPraenomen] wird [GetProvince('(int32)333').GetName] als unser #Y Bundesgenosse#! gewährt" 
 flavor_cyprus.1.b: "[eunostos_of_soloi.GetPraenomen] soll für seine Treue belohnt werden." 
 flavor_cyprus.1.bt: "[eunostos_of_soloi.GetPraenomen] erhält die westliche Hälfte von #E Zypern#!, während [menelaos_lagid.GetPraenomen] die östliche Hälfte behält"
 flavor_cyprus.1.c: "Wir müssen  sofort [menelaos_lagid.GetPraenomen] zurückrufen." 
 flavor_cyprus.1.ct: ""
 flavor_cyprus.1.d: "Die ganze Insel wird die Insel von [menelaos_lagid.GetPraenomen] sein."
 flavor_cyprus.1.dt: ""
 flavor_cyprus.1.e: "Keiner von beiden ist geeignet, in unserem Namen zu regieren."
 flavor_cyprus.1.et: "#R Alle Gebiete Zyperns werden annektiert#!"
 flavor_cyprus_soloi_feudatory_1.tt: "#E Soloi#! wird ein #Y Bundesgenosse#! von [SCOPE.GetRootScope.GetCountry.GetName]" 
 flavor_cyprus_salamis_feudatory_1.tt: "#E Salamis#! wird ein #Y Bundesgenosse#! von [SCOPE.GetRootScope.GetCountry.GetName]"
