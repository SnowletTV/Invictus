 diadochi_flavor.66.t: "Die Marmorinsel" 
 diadochi_flavor.66.desc: "$iasos_description$\n\nNun da die Macht der Antigoniden in der Region geschwunden ist, hat unser Vertreter in Karien, [aristoboulos_scope.GetName], dafür gesorgt, dass [GetProvince('(int32)275').GetOwner.GetName] die Herrschaft über [GetProvince('(int32)275').GetName] an uns abtritt, damit es wieder ein 'unabhängiger Verbündeter' des ptolemäischen Königreichs werden kann." 
 diadochi_flavor.66.tt: "Das #Y Ptolemäische Königreich#! erlangt Ansprüche auf #E Iasos#! und #E Karien#!." 
 diadochi_flavor.66.a: "Unser Bündnis wird erneuert werden."
 diadochi_flavor.66.at: "#Y $IASOS_NAME$#! wird als #Y Bundesgenosse#! als Untertan entlassen." 
 diadochi_flavor.66.b: "„Unabhängig“, was für ein Witz!"
 diadochi_flavor.66.bt: "Jedes #Y $hellenic$#!e Land in den Regionen #Y Griechenland#! und #Y Asia#! wird #R -25#! Meinungen über uns verlieren." 
 diadochi_flavor.66.c: "[GetProvince('(int32)275').GetName] gehört zu seinen karischen Brüdern." 
 diadochi_flavor.66.ct: "Diese Option ist #Y exklusiv#!, da Karien unsere Satrapie ist." 
  
 diadochi_flavor.67.t: "Die Marmorinsel" 
 diadochi_flavor.67.desc: "$iasos_description$\n\nNachdem die Macht der Antigoniden in der Region geschwunden ist, hat unser Vertreter in Karien, [aristoboulos_scope.GetName], mit [GetProvince('(int32)275').GetOwner.GetName] verhandelt, um die Herrschaft über [GetProvince('(int32)275').GetName] an uns abzutreten, damit es wieder ein 'unabhängiger Verbündeter' des ptolemäischen Königreichs werden kann. Die [GetProvince('(int32)275').GetOwner.GetAdjective]en Niederträchtigen  haben unsere Annäherungsversuche jedoch abgelehnt. Es scheint, dass Karien mit Gewalt befreit werden muss ..." 
 diadochi_flavor.67.a: "Wir werden unsere Zeit abwarten." 
 diadochi_flavor.67.at: "Das #Y Ptolemäische Königreich#! erlangt Ansprüche auf #E Iasos#! und #E Karien#!." 
  
 #Used in .68 and .69 as the generic description 
 diadochi_flavor.68.desc_0: "Mit dem Schrumpfen des Königreichs der Antigoniden haben unzählige Anwärter versucht, wie Geier, die sich auf eine Leiche stürzen,  den Titel des Satrapen von [ptolemy_new_satrapy.GetName] zu erringen. Glücklicherweise hat sich [ptolemy_new_satrapy.GetRuler.GetName], ein loyaler Unterstützer von [ROOT.GetCountry.GetRuler.GetName], durchgesetzt. [ptolemy_new_satrapy.GetRuler.GetPraenomen] scheint bereit, aber widerstrebend, seine neu gewonnenen Gebiete an [ROOT.GetCountry.GetRuler.GetPraenomen] abzutreten, und hat Gesandte nach [ROOT.GetCountry.GetCapital.GetName] geschickt, die [ROOT.GetCountry.GetRuler.GetPraenomen] bitten, [ptolemy_new_satrapy.GetRuler.GetHerHis]e Position als Satrap von [ptolemy_new_satrapy.GetName] zu bestätigen. Die Botschafter verweisen hartnäckig auf [ptolemy_new_satrapy.GetRuler.GetHerHis]e Loyalität und die Entfernung der Provinzen, um die Ernennung von [ptolemy_new_satrapy.GetRuler.GetPraenomen] zu unserem Satrapen in [ptolemy_new_satrapy.GetName] zu rechtfertigen. Ihr Vorschlag ist nicht ohne Wert, da [ptolemy_new_satrapy.GetName] aufgrund seiner geografischen Lage ein schwer zu kontrollierendes Gebiet für unser Reich darstellt." 
