 diadochi_flavor.51.tt5: "@[antigonids_scope.GetFlag]!#E [antigonids_scope.GetAdjective]e#! Untertanen in [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y] und [GetProvince('(int32)1799').GetArea.GetRegion.GetName|Y] $diadochi_flavor_become_our_subjects$"
