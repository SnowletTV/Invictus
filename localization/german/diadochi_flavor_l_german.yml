 colonize_dioskourides: "Die Insel der Glückseligkeit" 
 colonize_dioskourides_desc: "Der Kontakt zu den Gesegneten Inseln ist verloren gegangen, seit die Barbaren Patala eingenommen haben, den Hafen, den Alexander an der Mündung des Roten Meeres erbaut hatte, um eine Brücke zwischen Ost und West zu schlagen. Es gibt sogar Gerüchte, dass Alexander vor seinem frühen Tod vorhatte, Griechen auf Dioskoridos anzusiedeln, bevor sein vorzeitiger Tod diese großartigen Pläne zur Vereinigung der Welt zunichte machte. Umgeben von heftigen Monsunen und chaotischen Gewässern ist die Insel der Dioskuren ein Land, das fremd und anders ist als alle anderen. Sie beherbergt mehrere endemische Arten, wie den Drachenblutbaum, dessen kostbarer Saft wegen seiner medizinischen Eigenschaften auf allen Kontinenten begehrt war. Die Gesegnete Insel könnte den Handel zwischen den Indoi und den Völkern des Mittelmeerraums über Erythraer hinweg erleichtern. Neben Myrrhe, Weihrauch, Baumsaft und Aloe ist die Insel auch für ihre Schildkrötenpanzer bekannt, denn selbst die Bäuche der dort lebenden Schildkröten waren dick genug, um daraus Tische herzustellen. Obwohl Dioskoridos abgelegen und dünn besiedelt ist, ist es ein Ort mit großem Potenzial und könnte zu einem Dreh- und Angelpunkt der großen eryträischen Handelsrouten werden. Indem wir die Kontrolle über dieses vergessene Land erlangen, können wir daran arbeiten, Alexanders Traum zu verwirklichen: die Schaffung einer einzigen, miteinander verbundenen Welt, in der kein Ufer außerhalb des Einflussbereichs der hellenischen Zivilisation liegt."
 colonize_dioskourides_reward_tt: "Wir werden versuchen, die Insel #Y [GetProvince('(int32)7530').GetName]#! zu kaufen." 
 DIOSKOURIDES_NAME: "Dioskoridos" 
 DIOSKOURIDES_ADJ: "Dioskoridisch" 
  
 #Modifiers 
 kyinda_modifier: "Gold von Kyinda" 
 desc_kyinda_modifier: "Seit der Zeit der Assyrer fungierte Kyindia, damals bekannt als Kundi, als kaiserliche Schatzkammer. Als wichtiges Sammelzentrum während der Ära Alexanders des Großen beherbergte das makedonische Gazophylakion (königliche Schatzkammer) riesige Reichtümer, die aus dem Inneren Asiens zusammengetragen wurden, um nach Makedonien verschifft zu werden. Trotz regelmäßiger Plünderungen blieb der Inhalt der Schatzkammer, das 'Gold von Kyinda', während der gesamten hellenistischen Periode berühmt." 
  
 control_corinth_tt: "#E #Y [GetProvince('(int32)418').GetName]#!#! ist im Besitz oder unter der Kontrolle von #E #Y [THIS.GetCountry.GetName]#!#! oder ihr Untertan." 
