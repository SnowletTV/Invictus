 diadochi_flavor.85.t: "Wind der Veränderung" 
 diadochi_flavor.85.desc: "Die Machtverhältnisse unter den Diadochen haben sich erneut gewendet. Nach dem Zusammenbruch der Antigoniden wurde unser Schicksal von den Ambitionen von [pleistarchus_scope.GetPraenomen] bestimmt.\n\nAls treuer Verbündeter von [GetCountry('TRE').GetRuler.GetPraenomen] und Verwandter von  [GetCountry('MAC').GetRuler.GetPraenomen] wurde  [pleistarchus_scope.GetPraenomen] die Satrapie von #E @[GetCountry('CIA').GetFlag]! [GetCountry('CIA').GetName]#! übertragenals Belohnung für seine treuen Dienste. OUnsere Gebiete wurden offiziell seiner neuen Satrapie angegliedert, und seine Vertreter überwachen nun unsere Verwaltung." 
 diadochi_flavor.85.a: "Die Schwachen müssen tun, was ihnen gesagt wird." 
 diadochi_flavor.85.at: "Wir sind jetzt ein Untertan von [new_overlord.GetName|Y] @[new_overlord.GetFlag]!" 
  
 diadochi_flavor.86.t: "Aischylos von Rhodos" 
 diadochi_flavor.86.desc: "Der Verrat der Athener schmerzt umso mehr, als sie nun die Symbole in ihren Händen halten, die einst in Freundschaft zurückgegeben wurden, als Demetrios 307 v. Chr. Athen befreite: die Inseln Lemnos und Imbros. Es scheint, dass Dankbarkeit in Hellas nur von kurzer Dauer ist. Nun sind uns genau diese Inseln erneut entglitten und wurden von denen beansprucht, die auf unseren Namen spucken.\n\n#E Aischylos von Rhodos#!,  der ehemalige Garnisonskommandant der Inseln, genießt unter den lokalen Aristoi und Hafenmeistern nach wie vor hohes Ansehen. Er glaubt, dass er mit einer bescheidenen Streitmacht zurückkehren und Unterstützung sammeln könnte, um unsere Feinde von den Inseln zu vertreiben." 
 diadochi_flavor.86.a: "Aischylos soll zurückholen, was uns gehört."
 diadochi_flavor.86.at: "#E Lemnos#! wird ein #Y Bundesgenosse#! von [SCOPE.GetRootScope.GetCountry.GetName]" 
 diadochi_flavor.86.b: "Warum nicht auch Skyros mit einer Besatzung versehen?" 
 diadochi_flavor.86.bt: "#E Lemnos#! wird ein #Y Bundesgenosse#! von [SCOPE.GetRootScope.GetCountry.GetName]\n#E Skyros#! wird Eigentum von #Y Lemnos#!" 
 diadochi_flavor.86.c: "Lasst sie mit ihren Athener Freunden verrotten."
 diadochi_flavor.86.ct: "#R Nichts passiert#!" 
