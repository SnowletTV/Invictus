 chronos.1.a: "Mit Philadelphos am Ruder wartet der Ruhm." 
 chronos.1.b: "Wir bleiben bei Keraunos." 
 chronos.1.desc: "Lange Zeit war Ptolemaios Keraunos unser Favorit, doch kürzlich hat Ptolemaios Philadelphos gezeigt, dass er besser für den Thron geeignet wäre. Da die Jahre voranschreiten, wäre es das Beste, jetzt zugunsten des wahren Erben abzudanken und unsere letzten Tage in Frieden zu verbringen." 
 chronos.1.t: "Der bessere Ptolemaios"
 chronos.2.a: "Arsinoe schwört, dass ihr Bruder eine große Bereicherung wäre." 
 chronos.2.b: "Das wird nur Probleme verursachen; schickt ihn nach Hause." 
 chronos.2.desc: "Ein Besucher ist vom Meer angekommen: niemand anderes als Ptolemaios Keraunos, der ehemalige Erbe des ägyptischen Throns. Er ist aus den Ländern des Nils geflohen, nachdem sein Vater seinen Bruder ihm vorgezogen hatte. Wir müssen jetzt eine Entscheidung treffen."
 chronos.2.t: "Blitze werden einschlagen" 
 chronos.3.a: "Es liegt jetzt nicht mehr in unserer Hand." 
 chronos.3.desc: "Ptolemaios Keraunos ist zu Lysimachos geflohen, der ihm Unterschlupf gewährt hat. Vielleicht planen er und seine Schwester etwas gegen uns" 
 chronos.3.t: "Der Klang des Donners" 
 chronos.4.a: "Möge die Barmherzigkeit uns versöhnen." 
 chronos.4.b: "Es war klug von dir, beim ersten Mal zu fliehen, Bruder."
 chronos.4.desc: "Ptolemaios Keraunos wurde zurückgeschickt, nachdem er zu Lysimachus geflohen war, der uns anscheinend einen Gefallen getan hat. Irgendwann werden wir uns revanchieren, aber erst einmal müssen wir uns mit einem potenziellen Usurpator befassen"
 chronos.4.t: "Ein Bruder kehrt zurück" 
 flavor_krk_pry_marriage_op: "Antigonidisch-Agathoklidische Hochzeit"
 flavor_krk_pry_rejected_op: "Heirat zwischen Antigoniden und Agathokliden abgelehnt" 
 flavor_syr_epi_marriage_op: "Aiakidaisch-Agathoklidische Hochzeit" 
 flavor_syr_epi_rejected_op: "Aiakidaisch-Agathoklidische Ehe abgelehnt" 
  
 icarus.1.a: "Die Thraker sollen an die Marmara zurückkehren." 
 icarus.1.desc: "Es ist ein Bericht eingegangen, dass Lysimachos seinen eigenen Sohn und Erben Agathokles töten ließ. Es scheint, dass Arsinoe möchte, dass ihre eigenen Nachkommen das nördliche Königreich regieren. Doch nicht dieser tyrannische Kindsmörder, sondern unsere eigene Linie ist es, die ganz Asien unter einer Herrschaft vereint."
 icarus.1.t: "Der Wahnsinn des Lysimachos"
 icarus.2.a: "Die Trommeln des Krieges erklingen."
 icarus.2.desc: "Wir haben unseren Anspruch erhoben und unsere Armeen aufgestellt. Bald wird unser Reich wieder in die Ägäis hinausschauen, und wir werden wie Dädalus und Ikarus Flügel erhalten und der Sonne nachjagen, wenn sie im Westen untergeht." 
 icarus.2.t: "Ikarus fliegt"
  
  
 epigoni.1.t: "Keraunos: Der Ehrgeiz des Donnerschlag" 
 epigoni.1.desc: "Je älter [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] wird, desto dringlicher wird die Frage der Nachfolge. [ROOT.GetCountry.GetRuler.GetPraenomen]s Erbe, [ptolemy_keraunos_scope.GetName], drängt aggressiv auf mehr Verantwortung und verweist auf den Präzedenzfall der gemeinsamen Herrschaft von Antigonos und Seleukos.\n\n[ptolemy_keraunos_scope.GetName]' berüchtigtes Temperament und seine rücksichtslose Art führten jedoch dazu, dass Mitglieder des Hofes ihn 'Keraunos' oder 'den Donnerschlag' nannten. Viele von [ROOT.GetCountry.GetRuler.GetPraenomen]' Beratern haben im Geheimen Bedenken über [ptolemy_keraunos_scope.GetPraenomen]s Eignung als zukünftiger Anführer von [ROOT.GetCountry.GetName] geäußert. Unter bestimmten Beamten wird sogar leise darüber gesprochen, dass [ptolemy_other_heir_scope.GetPraenomen] besser für den Thron geeignet sei. Es wird wahrscheinlich zu Konflikten zwischen den beiden kommen, wenn die Nachfolgefrage nicht bald geklärt wird. Es wäre am besten, jetzt zugunsten des wahren Erben abzudanken und unsere letzten Tage in Frieden zu verbringen."
 epigoni.1.a: "Keraunos wird die Last der Herrschaft teilen." 
 epigoni.1.b: "Der Ruhm erwartet [ptolemy_other_heir_scope.GetPraenomen]." 
 epigoni.1.bt: "#R Dies kann zu unglücklichen Konsequenzen führen#!" 
 epigoni.1.c: "Eine Änderung der Nachfolge ist bislang nicht erforderlich." 
 epigoni.1.ct: "Es passiert nichts" 
 the_thunderbolt_modifier: "Keraunos" 
  
 epigoni.2.t: "Der Aufstieg von [former_ruler.GetPraenomen]: Pharaonische Hochzeit"
 epigoni.2.desc: "Die Pyramidentexte beschreiben die Natur des Pharaos in verschiedenen Charakteren als Horus und Osiris zugleich. Der Pharao als Horus im Leben wird im Tod zum Pharao als Osiris, wo er mit den anderen Göttern vereint wird. Neue Inkarnationen des Horus folgten dem verstorbenen Pharao auf Erden in Form neuer Pharaonen. Während [former_ruler.GetName] sich darauf vorbereitet, in die Unterwelt hinabzusteigen, muss [ROOT.GetCountry.GetRuler.GetName] aufsteigen, um die Rolle eines richtigen ägyptischen Pharaos zu erfüllen.\n\nLaut [ROOT.GetCountry.GetRuler.GetHerHis]en Priestern praktizierten viele [ROOT.GetCountry.GetRuler.GetHerHis]er pharaonischen Vorgänger die Familienheirat, um die Reinheit ihrer königlichen Linie zu bewahren und die Blutsverwandtschaft zwischen Osiris und seiner Schwester Isis zu ehren. [pharaonic_wife_scope.GetName] zu heiraten, hieße, in die Fußstapfen der Götter selbst zu treten. Mit einem solchen Schritt würden wir uns und die nachfolgenden [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]en Angerhörigen sicherlich bei den einheimischen Ägyptern beliebt machen, aber unsere griechischen Untertanen könnten dadurch verunsichert werden …" 
 epigoni.2.a: "Wir werden dem Beispiel von Osiris folgen." 
 epigoni.2.b: "Eine solche Barbarei wird nicht toleriert."
 refused_barbaric_practices: "Ablehnung inzestuöser Praktiken" 
 embraced_barbaric_practices: "Inzestuöse Praktiken" 
 embraced_local_customs: "Lokale Bräuche übernommen"
 flouted_local_customs: "Verspottete lokale Bräuche" 
  
 epigoni.3.t: "Keraunos: Die Wut des Donnerschlags" 
 epigoni.3.desc: "Nach der Abdankung seines Vaters hat [ptolemy_other_heir_scope.GetPraenomen] den Titel des Pharaos angenommen, woraufhin [ptolemy_keraunos_scope.GetName] wütend ist und sich betrogen fühlt. In einem Wutanfall stürmt #E Keraunos#! in den Hof und schreit: „Ihr habt mich meines Geburtsrechts beraubt!“\n\nSein Temperament bestätigt die Mitglieder des Hofes, dass sie sich entschieden haben, die Thronbesteigung des „Donnerschlags“ nicht zu unterstützen. Doch trotz seiner Wut ist ein Schimmer von Vernunft in seinen Augen, der darauf hindeutet, dass er noch besänftigt werden kann. #E Keraunos#! ist zu stolz, um direkt um etwas zu bitten, und warnt, dass er, wenn er keinen Thronplatz abbekommt, ins Ausland reisen wird, um die anderen Erben Alexanders um Unterstützung bei der Beanspruchung des Throns seines Vaters zu bitten. Vielleicht könnte ihn eine Satrapie zufriedenstellen, die ihm einen Anschein der Autorität verleiht, die er sucht, und ihm gleichzeitig die Krone sichert." 
 epigoni.3.a: "[ptolemy_keraunos_scope.GetSheHe] wird einen Thron haben, aber nicht meinen." 
 epigoni.3.at: "#E Cyrenacia#! erhält alle unsere Gebiete in den Gebieten #Y Cyrenacia#!, #Y Barka#! und #Y Syrtica#!"
 epigoni.3.b: "Wir dürfen keine Schwäche zeigen."
 epigoni.3.bt: "#R Keraunos wird ins Ausland reisen#!" 
 epigoni.3.c: "Vielleicht könnte [ptolemy_keraunos_scope.GetName] zu meinem Erben ernannt werden?" 
 epigoni.3.ct: "#E Keraunos#! wird zum Erben ernannt und #E könnte#! besänftigt werden" 
