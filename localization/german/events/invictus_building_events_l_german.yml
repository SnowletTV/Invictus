l_german:
  #Done 22.11.26
  inv_building_events.1.t:0 "Verfallene Festung"
  inv_building_events.1.desc:0 "[ROOT.GetCountry.GetRuler.GetName], wir haben einen Bericht von [building_province.GetName] erhalten - die Festung in dieser Provinz wurde durch ein kleines Erdbeben beschädigt, und ein großer Teil der Mauer ist eingestürzt. \n\nDa unsere Garnisonstruppen alle Hände voll zu tun haben, den Schaden zu beheben, können sie ihre normale Arbeit nicht erledigen und die Provinz beginnt unruhig zu werden."
  inv_building_events.1.a:0 "Sie müssen es im Laufe der Zeit ohne unsere Hilfe beheben"
  inv_building_events.1.b:0 "Gebt das Geld jetzt aus, um die Reparatur zu bezahlen"

  inv_building_events.2.t:0 "Sabotierte Festung"
  inv_building_events.2.desc:0 "Einer unserer Nachbarn hat Saboteure bezahlt, um einen heimlichen Angriff auf eine unserer Festungen durchzuführen. Glücklicherweise konnten wir die Pioniere vertreiben, bevor allzu großer Schaden angerichtet wurde.\n \nLeider wissen wir nicht genau, welcher unserer Feinde dafür verantwortlich ist. Das spielt im Moment jedoch keine Rolle – wir müssen die Reparaturen finanzieren."
  inv_building_events.2.a:0 "Das ist furchtbar ärgerlich, aber was kann man tun?"
  inv_building_events.2.b:0 "Wir führen die Reparaturen durch und halten Ausschau"

  inv_building_events.3.t:0 "Örtlicher Festungsbaumeister"
  inv_building_events.3.desc:0 "[ROOT.GetCountry.GetRuler.GetName] hat von einem örtlichen Ausnahmetalent gehört: einem genialen Architekten namens [fort_guy.GetName], der sich einen Namen gemacht hat, indem er die Befestigungsanlagen in seiner Heimatprovinz verbessert hat.\n\nWenn wir es uns leisten können, könnten wir diesen jungen Mann in die Hauptstadt holen, damit er sein Fachwissen mit unseren eigenen Ingenieuren teilt"
  inv_building_events.3.a:0 "Lassen wir [fort_guy.GetName] in seiner Provinz bleiben"
  inv_building_events.3.b:0 "Bezahlen wir [fort_guy.GetFirstName] dafür, nach [ROOT.GetCountry.GetCapital.GetName] zu ziehen"

  inv_building_events.4.t:0 "Brände in der Festung"
  inv_building_events.4.desc:0 "Schreckliche Nachrichten aus [burning_fort_province.GetName] – offenbar hat der verantwortungslose [pyromaniac_administrator.GetName] zugelassen, dass sich ein Feuer in der gesamten Region ausbreitet und wichtige militärische Einrichtungen beschädigt, auf die [ROOT.GetCountry.GetName] angewiesen ist.\n\nWas sollen wir unternehmen?\n\nWas sollen wir machen? Wir sollten solch gefährliches Verhalten nicht ungestraft lassen."
  inv_building_events.4.a:0 "Na schön, löscht die Brände und lasst alles wieder seinen gewohnten Gang gehen"
  inv_building_events.4.b:0 "Verurteilt [pyromaniac_administrator.GetFirstName] öffentlich und fordert Schadensersatz"

  inv_building_events.5.t:0 "Unüberwindbare Verteidigungsanlagen"
  inv_building_events.5.desc:0 "Dank der in [building_province.GetName] errichteten Erdwerke erreichen uns Berichte, dass die Einheimischen außer sich vor Freude sind. Sie danken [ROOT.GetCountry.GetRuler.GetName] dafür, dass [ROOT.GetCountry.GetRuler.GetName] ihren Schutz im Blick behalten hat, und möchten dem [ROOT.GetCountry.GetAdjective]en [ROOT.GetCountry.GetRulerTitle] ein Geschenk überreichen"
  inv_building_events.5.a:0 "Übermittelt unseren Dank – was für eine aufmerksame Geste"
  inv_building_events.5.b:0 "Reinvestiere das Geld in die Provinz"

  inv_building_events.6.t:0 "Eingestürzte Wallanlagen"
  inv_building_events.6.desc:0 "Mit Bedauern müssen wir mitteilen, dass die in [building_province.GetName] errichteten Wallanlagen nahezu vollständig eingestürzt sind. Zwar besteht Hoffnung, die verbliebenen Teile retten zu können, doch die Arbeiten werden langwierig und schwierig sein.\n\nWenn wir ausreichende Mittel erübrigen können, könnten wir die Reparaturarbeiten finanzieren."
  inv_building_events.6.a:0 "Zweifellos eine kostspielige Katastrophe, aber wir müssen handeln"
  inv_building_events.6.b:0 "Wir können es uns leisten, dies im Moment zu ignorieren"

  inv_building_events.7.t:0 "Günstige Bedingungen auf See"
  inv_building_events.7.desc:0 "Es dürfte Euch erfreuen zu erfahren, dass die ruhigen Gewässer vor [building_province.GetName] den zahlreichen Händlern, die von den dortigen Häfen auslaufen, nahezu sichere und erfolgreiche Reisen bescheren.\n\nDer Handel in der Region floriert, und unsere örtlichen Steuereintreiber melden Rekordeinnahmen. Das Glück ist uns heute hold, doch wir müssen entscheiden, was wir mit den zusätzlichen Einnahmen anfangen."
  inv_building_events.7.a:0 "Führt den Überschuss der Staatskasse zu"
  inv_building_events.7.b:0 "Verteilt das Geld als Geschenk an die Einheimischen"

  inv_building_events.8.t:0 "Missstände in der Hafenverwaltung in [building_province.GetName]"
  inv_building_events.8.desc:0 "[port_manager.GetName] hält das Besitztum von [building_province.GetName] und ist daher für die Verwaltung des geschäftigen Hafenviertels verantwortlich, das eine lebenswichtige wirtschaftliche Lebensader des [ROOT.GetCountry.GetAdjective]en Staates darstellt.\n\nAllerdings hören wir immer wieder Beschwerden über die korrupte Hafenverwaltung. Offenbar nimmt [port_manager.GetFirstName] ständig Bestechungsgelder an und erlaubt Piraten, in den Gewässern anzulegen ... Dagegen muss etwas unternommen werden."
  inv_building_events.8.a:0 ""Und ich nehme an, Ihr wollt, dass ich etwas dagegen unternehme? Vergesst es"
  inv_building_events.8.b:0 "Droht [port_manager.GetFirstName] und schickt Soldaten zu den Docks"

  inv_building_events.9.t:0 "Rattenbefall im Hafen von [building_province.GetName]"
  inv_building_events.9.desc:0 "Aus irgendeinem Grund hat [building_province.GetName] ein Ungezieferproblem, das außer Kontrolle gerät. Es gibt so viele Ratten im Hafenviertel, dass sie an nur einem Abend das Lager eines ganzen Getreidespeichers leerfressen könnten, was in der ganzen Region unsägliches Elend anrichten würde. \n \nDer Hafenverwalter [port_manager.GetName] bittet um Hilfe, denn wenn wir nichts unternehmen, werden die Menschen dort sehr bald verhungern."
  inv_building_events.9.a:0 "Lassen wir die Einheimischen ihre Angelegenheiten ohne unsere Hilfe selbst regeln"
  inv_building_events.9.b:0 "Schickt ihnen Gold und Soldaten, um die Ratten zu töten"

  inv_building_events.10.t:0 "Erfahrene Schiffbauer von [building_province.GetName]"
  inv_building_events.10.desc:0 "Die meisterhaften Schiffsbauer von [building_province.GetName] haben eine Nachricht nach [ROOT.GetCountry.GetCapital.GetName] geschickt und um Erlaubnis gebeten, örtliche Steuerüberschüsse für den Ausbau des Hafenviertels verwenden zu dürfen.\n\nObwohl dies ein teures Unterfangen sein wird, kann jeder den Vorteil der Reinvestition der Gewinne erkennen."
  inv_building_events.10.a:0 "Was für eine hervorragende Idee – setzt sie sofort um"
  inv_building_events.10.b:0 "Wir brauchen diese Steuereinnahmen jetzt selbst, fürchte ich"

  inv_building_events.11.t:0 "Feuer in den Häfen von [burning_port_province.GetName]"
  inv_building_events.11.desc:0 "Der Statthalter von [burning_port_province.GetName], ein Pyromane namens [pyromaniac_administrator.GetName], ist persönlich für die Brände verantwortlich, die das Hafenviertel verwüstet haben.\n\nObwohl [pyromaniac_administrator.GetFirstName] ausdrücklich davor gewarnt wurde, mit dem Feuer zu spielen, scheint die Warnung ignoriert worden zu sein."
  inv_building_events.11.a:0 "Schickt Geld nach [burning_port_province.GetName], um den Wiederaufbau zu unterstützen"
  inv_building_events.11.b:0 "[pyromaniac_administrator.GetName] muss persönlich dafür aufkommen!"

  inv_building_events.12.t:0 "Ausschreitungen betrunkener Soldateb in [building_province.GetName]"
  inv_building_events.12.desc:0 "Uns liegen Berichte vor, wonach die Kaserne in [building_province.GetName] angegriffen wurde, allerdings nicht von einer ausländischen Armee.\n\nZu unserem Unglück hatten einige unserer dort stationierten Soldaten Alkohol getrunken und gerieten in eine Schlägerei mit einigen ihrer Kameraden. Bevor jemand die Schlägerei beenden konnte, war ein Feuer ausgebrochen, das einen Teil der Stadt beschädigt hat."
  inv_building_events.12.a:0 "Bestraft die verantwortlichen Soldaten!"
  inv_building_events.12.b:0 "Wir sollten uns nicht in Angelegenheiten der Armee einmischen ..."

  inv_building_events.13.t:0 "Truppenausbildung durch[governor_dude.GetName]"
  inv_building_events.13.desc:0 ""Nachrichten aus [building_province.GetName] – offenbar bildet der Statthalter [governor_dude.GetName] die Truppen unter [governor_dude.GetHerHis]em  persönlich aus. Eine Maßnahme, die [ROOT.GetCountry.GetRuler.GetName] niemals angeordnet hat."
  inv_building_events.13.a:0 "Für so viel Eigeninitiative sollten wir dankbar sein"
  inv_building_events.13.b:0 "Danke für die Information ... Ich werde [governor_dude.GetFirstName] im Auge behalten"

  inv_building_events.14.t:0 "Militärische Unruhen in [building_province.GetState.GetGovernorship.GetName]"
  inv_building_events.14.desc:0 "Uns erreichen Nachrichten aus den Kasernen von [building_province.GetName]. Dort soll ein legendärer Krieger namens [badass_soldier.GetName] den unbeliebten [bitch_ass_governor.GetName] offen zu einem Duell herausgefordert haben.\n\nObwohl die Soldaten begeistert von der Aussicht sind, einen der Ihren gegen ein Mitglied der Oberschicht kämpfen zu sehen, hat uns [bitch_ass_governor.GetName] geschrieben und verlangt, dass wir alles in unserer Macht Stehende tun, um dem ein Ende zu bereiten."
  inv_building_events.14.a:0 "Lasst sie kämpfen – unsere Männer werden ihre Freude an dem Schauspiel haben"
  inv_building_events.14.b:0 "Lasst diesen Soldaten wegen Ungehorsams hinrichten"

  inv_building_events.15.t:0 "Neue Ausbildungsmethoden"
  inv_building_events.15.desc:0 "Angeblich werden in den Kasernen von [building_province.GetName] einige militärische Neuerungen eingeführt. Der Rekrutenreservenüberschuss hat es dem Statthalter ermöglicht, bestimmte Kohorten für die Ausbildung in spezialisierten militärischen Techniken abzustellen.\n\nBislang sind die Ergebnisse spektakulär, und man hat uns gebeten, einen Geldbetrag zur Unterstützung dieser Initiative bereitzustellen."
  inv_building_events.15.a:0 "Das können wir uns leider nicht leisten"
  inv_building_events.15.b:0 "Das ist es absolut wert – öffnet unsere Schatzkammern"

  inv_building_events.16.t:0 "Die Gießerei von [building_province.GetName] floriert"
  inv_building_events.16.desc:0 "Eine der fortschrittlichsten Gebäudearten, die wir zu errichten gelernt haben, ist die #E Gießerei#!, und allen Berichten zufolge erlebt [building_province.GetName] dank der dort wachsenden Industrie einen gewaltigen Aufschwung.\n\nDa die Produktion auf einem Allzeithoch ist, haben wir einen kleinen Überschuss – heutzutage eine Seltenheit.  Wie sollten wir diesen Überschuss verwenden? Vielleicht könnten wir die Gießerei in [building_province.GetName] erweitern."
  inv_building_events.16.a:0 "Wir sollten die Mittel erneut in [building_province.GetName] investiere"
  inv_building_events.16.b:0 "Das klingt für mich nach einer angemessenen Belohnung für gute Arbeit!"

  inv_building_events.17.t:0 "[building_province.GetName], das Arsenal von [SCOPE.GetRootScope.GetCountry.GetName]"
  inv_building_events.17.desc.1:0 "In [building_province.GetName] befindet sich eine Gießerei, die sich auf die Herstellung der besten Speere und Schwerter spezialisiert hat, die im gesamten Gebiet von [SCOPE.GetRootScope.GetCountry.GetName] zu finden sind. Tatsächlich ist die Nachfrage nach dem mittlerweile als #E '[ROOT.GetCountry.GetAdjective]em Stahl#! bekannten Material so groß, dass wir nicht schnell genug produzieren können.\n\nDas ließe sich jedoch ändern. Es wurde vorgeschlagen, dass [ROOT.GetCountry.GetRuler.GetName] die Staatskasse nutzt, um in [building_province.GetName] zu investieren und so die Produktion dieser wertvollen Legierung zu steigern."
  inv_building_events.17.desc.2:0 "In der Nähe von [building_province.GetName] befindet sich eine Gießerei, die sich einen Ruf für die Herstellung hervorragender Rüstungen erworben hat – man würde in ganz [SCOPE.GetRootScope.GetCountry.GetName] kaum etwas Besseres finden. \n\nNatürlich ist [ROOT.GetCountry.GetRuler.Custom('get_DieDer')] [ROOT.GetCountry.GetAdjective]e [ROOT.GetCountry.GetRulerTitle] daran interessiert, in der Region zu investieren."
  inv_building_events.17.a:0 "Das ist eine außergewöhnliche Gelegenheit, die wir nutzen sollten"
  inv_building_events.17.b:0 "Wenn wir nur die notwendigen Mittel dafür hätten!"

  inv_building_events.18.t:0 "Sklaven ermorden Gießereibesitzer in [building_province.GetName]"
  inv_building_events.18.desc:0 "[murdered_master.GetName], ein wohlhabender Provinzbewohner, dem eine Gießerei in der Nähe von [building_province.GetName] gehört, wurde heute Morgen tot aufgefunden – ausgerechnet von Sklaven ermordet.\n\nEs wurden Forderungen laut, dass [ROOT.GetCountry.GetName] die genauen Umstände untersuchen soll, doch damit wären unangenehme Kosten verbunden."
  inv_building_events.18.a:0 "Das ist mir gleich"
  inv_building_events.18.b:0 "Schickt einige Soldaten und bezahlt sie dafür, die Mörder aufzuspüren"

  inv_building_events.26.t:0 "Undichte Aquädukte in [building_province.GetName]"
  inv_building_events.26.desc:0 "Unsere Architekten senden uns alarmierende Berichte, wonach die Aquädukte in [building_province.GetName] undicht geworden sind und die Lecks mit jedem Tag größer werden. Es besteht die Befürchtung, dass die Bauwerke einstürzen könnten, wenn nicht unverzüglich Maßnahmen ergriffen werden.\n\nDamit ist natürlich gemeint, dass [ROOT.GetCountry.GetName] die Freigabe von Notfallmitteln aus der Staatskasse genehmigt."
  inv_building_events.26.a:0 "Wir werden sofort Arbeiter schicken"
  inv_building_events.26.b:0 "Können die das nicht selbst regeln?"

  inv_building_events.27.t:0 "Aquädukte in [building_province.GetName] wurden sabotiert!"
  inv_building_events.27.desc:0 "In der von Unruhen geplagten Provinz [building_province.GetName] wurden die Aquädukte sabotiert, [ROOT.GetCountry.GetRuler.GetName], und nun ist die Trinkwasserversorgung der Region gefährdet.\n\nNiemand weiß, wer dafür verantwortlich ist, aber das Problem liegt dennoch in unserer Verantwortung.""
  inv_building_events.27.a:0 "Ha, da irrt Ihr Euch gewaltig – nein, das tut es nicht"
  inv_building_events.27.b:0 "Die Reparatur wird teuer, aber wir müssen sie durchführen"

  inv_building_events.28.t:0 "Aquädukte in [building_province.GetName] bringen Wohlstand"
  inv_building_events.28.desc:0 "Reisende, die die Region [building_province.GetArea.GetName] besuchen, machen häufig einen Umweg, um [building_province.GetName] zu besichtigen. Das liegt zweifellos am Ruf der Stadt als Ort des Reichtums und der Kultur, bevölkert von großzügigen Menschen. Auch unsere hervorragende städtische Infrastruktur ist ein Segen, wobei das beeindruckende Aquäduktsystem der Stadt zu ihren wertvollsten Errungenschaften zählt.\n\nDiese Aquädukte, die die Zisternen der Stadt unablässig mit frischem, sauberem Wasser füllen, scheinen [building_province.GetName] mehr als nur lebensnotwendiges Wasser zu bringen."
  inv_building_events.28.a:0 "Was für erfreuliche Nachrichten"
  happy_city_reward_modifier: "Blühende Stadt"

  inv_building_events.29.t:0 "Mord in [building_province.GetName]"
  inv_building_events.29.desc:0 "Schreckliche Neuigkeiten, [ROOT.GetCountry.GetRuler.GetName] - [SCOPE.sCharacter('dead_priest').GetOffice.GetName] wurde ermordet, als er die Tempel von [building_province.GetName] besuchte, aber niemand gibt Informationen preis, und uns ist ehrlich gesagt nicht klar, was wirklich passiert ist.\n\nDie Einheimischen sind verärgert über diese Blasphemie und wollen die Täter vor Gericht stellen."
  inv_building_events.29.a:0 "Wir müssen etwas tun, damit die Götter nicht verärgert werden – schickt Geld!"
  inv_building_events.29.b:0 "Es ist besser, sich aus dieser Angelegenheit herauszuhalten"

  inv_building_events.30.t:0 "Örtliches Fest am Tempel von [building_province.GetName]"
  inv_building_events.30.desc:0 ""Die Zeit für ein örtliches religiöses Fest in [building_province.GetName] ist gekommen. Die örtlichen Behörden haben uns jedoch mitgeteilt, dass sie es sich dieses Jahr nicht leisten können und sich Unterstützung von [ROOT.GetCountry.GetName] wünschen.\n\nLasst Euch nicht täuschen: Dies wird eine beträchtliche Summe kosten, aber auch zahlreiche Vorteile mit sich bringen ..."
  inv_building_events.30.a:0 "Natürlich werden wir dieses Fest finanzieren"
  inv_building_events.30.b:0 "Teilt den Magistraten mit, dass sie die Feierlichkeiten dieses Jahr verschieben müssen"

  inv_building_events.31.t:0 "Blitz schlägt in den Tempel von [building_province.GetName] ein!"
  inv_building_events.31.desc:0 "Wir haben Berichte erhalten, dass ein Blitz in den Tempel von [ROOT.GetCountry.Custom('get_harvest_goddess')] in [building_province.GetName] eingeschlagen ist. Die Einheimischen sind nun in heller Aufregung, weil sie darin ein böses Omen sehen. Was sollen wir ihnen sagen?"
  inv_building_events.31.a:0 "Bringt Opfer dar und versichert allen, dass alles in Ordnung ist"
  inv_building_events.31.b:0 "Sagt ihnen, dass die Götter sie bestrafen werden, wenn sie mir nicht zahlen!"

  inv_building_events.32.t:0 "Überquellende Getreidespeicher in [helping_state.GetName]"
  inv_building_events.32.desc:0 "[prov_to_help.GetName] leidet in letzter Zeit unter Nahrungsmangel. Die benachbarte Provinz [helping_state.GetName] verfügt hingegen über bis zum Rand gefüllte Getreidespeicher, und ihre Bewohner sind aus reiner Herzensgüte bereit, ihren Überschuss zu teilen."
  inv_building_events.32.a:0 "Was für selbstlose Menschen wir doch haben!"
 
  inv_building_events.33.t:0 "Schimmel in den Getreidespeichern von [building_state.GetName]!"
  inv_building_events.33.desc:0 "Unsere Verwalter in [building_state.GetName] haben uns mitgeteilt, dass sich Schimmel in der diesjährigen Ernte ausgebreitet hat und damit die Ernährungssicherheit in [building_state.GetArea.GetName] ernsthaft gefährdet. Zunehmend erreichen uns Berichte, dass viele Stadtbewohner, insbesondere Kinder, hungern."
  inv_building_events.33.a:0 "Wir sollten an die Einheimischen Brotspenden verteilen"
  inv_building_events.33.b:0 "Verkauft das verdorbene Getreide trotzdem und streicht den Gewinn ein"

  inv_building_events.34.t:0 "Aufgebrachter Mob stürmt die Getreidespeicher von [building_province.GetName]"
  inv_building_events.34.desc_1:0 "Uns erreichen Berichte, dass ein ausgehungerter Mob in die Getreidespeicher von [building_province.GetName] eingrunden ist.\n\nDer örtliche Statthalter, ein für seine Korruption berüchtigter Mann namens [corrupt_governor.GetName], konnte nur knapp mit dem Leben entkommen."
  inv_building_events.34.desc_2:0 "Wir erhalten Berichte, dass ein hungernder Mob in die Getreidespeicher von [building_province.GetName] eingebrochen ist. \n \nDer örtliche Gouverneur, eine notorisch korrupte Person namens [corrupt_governor.GetName], wurde offenbar in die Enge getrieben und in Stücke gerissen – wie schrecklich."
  inv_building_events.34.a:0 "Schickt Soldaten, um die Ordnung wiederherzustellen"
  inv_building_events.34.b:0 "Informiert mich, wenn sich die Lage beruhigt hat"

  inv_building_events.41.t:0 "Ein Adliger wurde von einem freien Mann im Theater in [building_province.GetName] ermordet"
  inv_building_events.41.desc:0 "Es macht eine Geschichte die Runde, wonach ein Adliger vor dem Theater in [building_province.GetName] von einem freien Mann ermordet worden sei. Wie Ihr Euch vorstellen könnt, haben die Klassenspannungen in der Region inzwischen einen Höhepunkt erreicht."
  inv_building_events.41.a:0 "Wenn unsere streitsüchtigen Untertanen doch nur miteinander auskommen könnten..."
  inv_building_events.41.b:0 "Schickt einige Kohorten, um die Täter dieses Verbrechens zu bestrafen"

  inv_building_events.42.t:0 "Theater in [building_province.GetName] zieht Adlige an"
  inv_building_events.42.desc:0 "Es spricht sich weit herum, dass [building_province.GetName] zur bedeutendsten Stadt der gesamten Region [building_province.GetArea.GetRegion.GetName] geworden ist, wenn es um die darstellenden Künste geht.\n\nDie Qualität der an öffentlichen Orten aufgeführten Stücke kann es mit allem aufnehmen, was anderswo geboten wird. Viele behaupten sogar, dass [ROOT.GetCountry.GetName] die besten Dramatiker der ganzen Welt besitzt."
  inv_building_events.42.desc.2:0 "[neighbor.GetRuler.GetName], der Herrscher von [neighbor.GetName], hat eine Drohbotschaft nach [ROOT.GetCountry.GetCapital.GetName] geschickt und fordert, dass wir die Theateraufführungen in [building_province.GetName] einstellen.\n\nOffenbar sind unsere Inszenierungen für ihre herausragende Qualität so berühmt, dass sie Adlige aus anderen Ländern, darunter auch [neighbor.GetName], in unser Land ziehen"
  inv_building_events.42.a:0 Und die Leute behaupten, Theater sei langweilig ..."
  inv_building_events.42.b:0 "Verbietet sämtliche zukünftigen Auftritte"

  inv_building_events.43.t:0 "Theater-Horror in [building_province.GetName]"
  inv_building_events.43_drama:0 "Wir haben von einem Vorfall im Theater von [building_province.GetName] gehört, der ganz [ROOT.GetCountry.GetName] erschüttert hat.\n\nDas mit großer Spannung erwartete Drama mit dem Titel „[ROOT.GetCountry.GetAdjective]e Magnolien“ war derart schrecklich, dass das Publikum in einem Wutanfall tatsächlich die Schauspieler auf der Bühne ermordete.\n\nDas Stück befand sich bereits in seiner fünften Stunde, und die Zuschauer versuchten heimlich, das Theater zu verlassen. Doch ein bewaffneter Wächter versperrte gewaltsam den Ausgang und drohte, das Stück von vorne beginnen zu lassen – da verloren die Menschen endgültig die Beherrschung."
  inv_building_events.43_tragedy:0 "Wir haben von einem Vorfall im Theater von [building_province.GetName] gehört, der ganz [ROOT.GetCountry.GetName] erschüttert hat.\n\nDie mit großer Spannung erwartete Tragödie mit dem Titel „Verlassener Imperator“ machte das Publikum derart wütend, dass die Zuschauer in einem Wutanfall begannen, die Bühne zu stürmen.\n\nWährend des zweiten Aktes verkündete ein Bühnenarbeiter, dass das Stück nach einer fünfzehnminütigen Pause fortgesetzt werde, kehrte dann jedoch nie zurück. Daraufhin begann das Publikum zu randalieren.\n\nSelbst nachdem die örtlichen Wachen den Mob auseinandergetrieben hatten, waren die ganze Nacht hindurch Rufe wie „Bringt den Imperator zurück!“ zu hören"
  inv_building_events.43_comedy:0 "Wir haben von einem Vorfall im Theater von [building_province.GetName] gehört, der ganz [ROOT.GetCountry.GetName] erschüttert hat.\n\nDie mit großer Spannung erwartete Komödie mit dem Titel „[ROOT.GetCountry.GetAdjective]e Dummheiten“ machte das Publikum derart wütend, dass die Zuschauer in einem Wutanfall tatsächlich die Schauspieler auf der Bühne ermordeten.\n\nDie „Witze“ wurden immer schlechter, und als das Publikum begann, faule Eier auf die Bühne zu werfen, warf einer der Schauspieler eines zurück ... und dann brach die Hölle los."
  inv_building_events.43_satyr:0 "Wir haben von einem Vorfall im Theater von [building_province.GetName] gehört, der ganz [ROOT.GetCountry.GetName] erschüttert hat.\n\nDas mit großer Spannung erwartete Satyrspiel, ein anzügliches Stück namens „Die lüsterne [ROOT.GetCountry.GetAdjective]e Maid“, machte das Publikum derart wütend, dass die Zuschauer in einem Wutanfall tatsächlich die Schauspieler auf der Bühne ermordeten.\n\nWas danach geschah, wurde mit einem Aufstand verglichen – wir können von Glück sagen, dass nicht noch mehr Menschen ums Leben kamen."
  inv_building_events.43.a:0 "Das ist das Verrückteste, was ich seit langem gehört habe"
  inv_building_events.43.b:0 "Was?! Schickt sofort Soldaten nach [building_province.GetName]!"

  inv_building_events.44.t:0 "[assimilating_culture.GetName]e Menschen zerstören heilige [SCOPE.GetRootScope.GetCountry.GetCulture.GetName]e Bücher in der Bibliothek von [building_province.GetName]"
  inv_building_events.44.desc:0 "Wir haben eine abscheuliche Geschichte gehört – offenbar haben die [assimilating_culture.GetName] Teile der Bibliothek von [building_province.GetName] in Brand gesteckt.\n\nBei dem Feuer wurden Bücher zerstört, die dem [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]en Volk heilig sind. Nun ist die gesamte Region angespannt und fürchtet weitere Gewaltausbrüche."
  inv_building_events.44.a:0 "Wir werden eingreifen und Soldaten zur Wahrung des Friedens entsenden"
  inv_building_events.44.b:0 "Schickt unsere Diplomaten in die Region, um eine Einigung auszuhandeln"

  inv_building_events.45.t:0 "Auf den Schultern von Giganten"
  inv_building_events.45_science:0 "Es wird berichtet, dass die großen Denker, die sich in [building_province.GetName] versammelt haben, einen Durchbruch erzielt haben.\n\nDer Anführer dieser Gelehrten, ein Mann namens [great_thinker.GetName], soll ein Genie auf dem Gebiet der Wissenschaft sein und ist bereit, seine Erkenntnisse mit [ROOT.GetCountry.GetName] zu teilen."
  inv_building_events.45_philosophy:0 "Es wird berichtet, dass die großen Denker, die sich in [building_province.GetName] versammelt haben, einen Durchbruch erzielt haben.\n\nDer Anführer dieser Gelehrten, ein Mann namens [great_thinker.GetName], soll ein Genie auf dem Gebiet der Philosophie sein und ist bereit, seine Erkenntnisse mit [ROOT.GetCountry.GetName] zu teilen."
  inv_building_events.45_medicine:0 "Es wird berichtet, dass die großen Denker, die sich in [building_province.GetName] versammelt haben, einen Durchbruch erzielt haben.\n\nDer Anführer dieser Gelehrten, ein Mann namens [great_thinker.GetName], soll ein Genie auf dem Gebiet der Medizin sein und ist bereit, seine Erkenntnisse mit [ROOT.GetCountry.GetName] zu teilen." "
  inv_building_events.45.a:0 "Was für ein Glück für uns! Wir könnten das Geld gut gebrauchen"
  inv_building_events.45.b:0 "Investiert in [building_province.GetName] und setzt diese Ideen auf den Märkten um"

  inv_building_events.46.t:0 "Gefährliche Diskussionen"
  inv_building_events.46.desc:0 "Obwohl wir in unseren akademischen Kreisen eine offene Atmosphäre geduldet haben, wurde nun berichtet, dass es in [building_province.GetName] Gruppen von Philosophen gibt, die den gewaltsamen Sturz der Oberschicht fordern und die Gründung einer Utopie propagieren, in der alle Gesellschaftsschichten dieselben Rechte besitzen.\n\nWerden wir zulassen, dass sich diese Lehren ungehindert verbreiten, oder sollten wir eingreifen?"
  inv_building_events.46.a:0 "Wir schätzen lebhafte Debatten – ignorieren wir sie vorerst"
  inv_building_events.46.b:0 "Sperrt jeden ein, der solche aufständischen Ansichten vertritt"

  inv_building_events.47.t:0 "Neue Ideen und neue Perspektiven entstehen in den Akademien von [building_province.GetName]"
  inv_building_events.47.desc:0 "Man sagt, dass die Akademien in [building_province.GetName] für die Qualität ihrer intellektuellen Debatten bekannt werden. Unsere kulturelle Elite trifft dort auf die besten und klügsten [ROOT.GetCountry.GetAdjective]en Gelehrten des ganzen Landes.\n\nZwar genießen wir derzeit kostenfrei die gelehrte Atmosphäre und die lebhaften Diskussionen in [building_province.GetName], doch wurde vorgeschlagen, dass der Staat diese Philosophen und Weisen offiziell finanziell unterstützt – sie haben eine Zuwendung beantragt, mit der ihre Aktivitäten für die nächsten zehn Jahre finanziert werden könnten."
  inv_building_events.47.a:0 "Wissen ist eben doch unbezahlbar – lassen Sie uns hier investieren"
  inv_building_events.47.b:0 "Wir werden die Debatten ihren natürlichen Lauf nehmen lassen, ohne uns einzumischen."

  inv_building_events.48.t:0 "Mord auf dem Markt"
  inv_building_events.48.desc:0 "[building_governor.GetName], eine allgemein beliebte Persönlichkeit, wurde kaltblütig ermordet aufgefunden. Der entstellte Leichnam lag auf dem Marktplatz von [building_province.GetName].\n\nNiemand weiß, warum das geschehen ist, doch die Stadt ist nun von Angst ergriffen und der Handel leidet darunter."
  inv_building_events.48.a:0 "Das sind schreckliche Neuigkeiten, aber wir können jetzt nichts tun"
  inv_building_events.48.b:0 "Schickt Soldaten, um die Märkte von [building_province.GetName] zu bewachen"

  inv_building_events.49.t:0 "Märkte von [building_province.GetName]"
  inv_building_events.49.desc:0 "Es dürfte Euch erfreuen zu hören, dass die Marktplätze von [building_province.GetName] florieren, alle anderen in der Region [building_province.GetArea.GetName] übertreffen und den örtlichen Behörden beträchtliche Gewinne einbringen.\n\nAls Zeichen ihrer Dankbarkeit haben sie uns ein Geschenk geschickt."
  inv_building_events.49.a:0 "Ausgezeichnete Nachrichten! Gold ist immer willkommen"
  inv_building_events.49.b:0 "Sag den Einheimischen, dass wir dankbar sind, sie ihr Geld aber behalten können"

  inv_building_events.50.t:0 "Korruptionsvorwürfe"
  inv_building_events.50.desc:0 "Die mutmaßlichen Verbrechen des berüchtigten [politician_on_trial.GetName] haben [politician_on_trial.GetHerHim] endlich eingeholt, und der laufende Prozess in [building_province.GetName] hält die gesamte Region in Atem. \n\nIn einem verzweifelten Versuch, ihre Position zu behaupten, hat [politician_on_trial.GetName] eine geheime Nachricht an [ROOT.GetCountry.GetRuler.GetName] geschickt, in der verzweifelte Summen versprochen werden, wenn der Staat in [politician_on_trial.GetHerHis]em Namen interveniert."
  inv_building_events.50.a:0 "Wir werden uns in keiner Weise einmischen"
  inv_building_events.50.b:0 "Von wie viel Geld reden wir?"

  inv_building_events.51.t:0 "Unerträgliche Korruption"
  inv_building_events.51.desc:0 "[building_governor.GetName], der Statthalter von [building_province.GetName], soll so korrupt sein, dass sich mit Geld alles kaufen lässt: manipulierte Gerichtsverfahren, ermordete Gegner, gefälschte Landansprüche und nur Götter wissen, was sonst noch alles.\n\nEs wird erwartet, dass [ROOT.GetCountry.GetRuler.GetName] etwas gegen diese Verhöhnung der Gerechtigkeit unternimmt."
  inv_building_events.51.a:0 "Wir werden Soldaten entsenden, um in [building_province.GetName] für Ordnung zu sorge"
  inv_building_events.51.b:0 "Ich verlange einen Anteil an den Gewinnen, sonst endet [building_governor.GetName] auf dem Schaffott"

  inv_building_events.52.t:0 "Katastrophe bei einer Militärübung"
  inv_building_events.52.desc:0 "Wir haben erfahren, dass eine militärische Übung in [building_province.GetName] völlig außer Kontrolle geraten ist. Es kam zu hitzigen Wortgefechten und Zusammenstößen zwischen unseren Soldaten, bei denen Dutzende ums Leben kamen.\n\nUnsere Generäle wollen die Meuterer bestrafen, raten [ROOT.GetCountry.GetName] jedoch zur Vorsicht."
  inv_building_events.52.a:0 "Die Soldaten müssen das nächste Jahr von Brotkrusten leben"
  inv_building_events.52.b:0 "Wir werden nichts tun ... die Armee ist unantastbar"

  inv_building_events.53.t:0 "Starker Anstieg der Einberufungen in [building_province.GetName]"
  inv_building_events.53.desc:0 "Unsere militärischen Berater freuen sich, uns mitteilen zu können, dass die verfügbaren personellen Ressourcen in [building_province.GetName] dank einer beispiellosen Rekrutierungskampagne stark angestiegen sind.\n\nWie sollen wir den Rekrutenüberschuss nutzen?"
  inv_building_events.53.a:0 "Lasst sie mit ihrer Ausbildung beginnen"
  inv_building_events.53.b:0 "Setzt einen Teil der Männer sofort zur Arbeit ein – unsere Bauernhöfe brauchen Hilfe"

  inv_building_events.54.t:0 "Brände in den Ausbildungslagern von [building_province.GetName]"
  inv_building_events.54.desc:0 "Vor Kurzem hat eine Reihe von Bränden Teile von [building_province.GetName] verwüstet. Dabei wurden Abschnitte eines Militärlagers zerstört und zahlreiche Soldaten getötet.\n\nDie Einheimischen trauern und haben gefragt, ob wir ihnen in dieser schweren Stunde Unterstützung zukommen lassen können."
  inv_building_events.54.a:0 "Wir werden den Wiederaufbau unterstützen und es besser als zuvor werden lassen"
  inv_building_events.54.b:0 "Das ist leider alles Teil des natürlichen Kreislaufs des Lebens"

  inv_building_events.55.t:0 "Bürger auf dem Forum von [building_province.GetName] erzürnt über [building_governor.GetName]"
  inv_building_events.55.desc:0 "Die Unruhen in [building_province.GetName] werden von Bürgern verursacht, die über [building_governor.GetName] verärgert sind. Dieser gilt als fauler und unfähiger Anführer.\n\nUnsere Agenten berichten, dass [building_governor.GetName] letzte Woche im Forum von [building_province.GetName] angegriffen wurde. Alle sind sich einig, dass dies eine schreckliche Tat war."
  inv_building_events.55.a:0 "Sagt den Bürgern, sie sollen den Mund halten, sonst…!"
  inv_building_events.55.b:0 "Der Mob könnte Recht haben..."

  inv_building_events.56.t:0 "Neue Denkweisen entstehen in Foren von [building_province.GetName]"
  inv_building_events.56.desc:0 "Es heißt, dass die philosophischen Schulen, die sich in der Nähe von [building_province.GetArea.GetName] entwickelt haben, nun beginnen, seltsame Ideen zu verbreiten, wobei einige sogar behaupten, sie würden den Sturz des Staates befürworten.\n\nWo haben diese Schulen ihren Ursprung? Im Forum von [building_province.GetName], das als Brutstätte intellektueller Aktivität bekannt ist."
  inv_building_events.56.a:0 "Duldet die philosophischen Diskussionen, solange sie theoretisch bleiben"
  inv_building_events.56.b:0 "Verbietet Debatten und Demonstrationen auf den öffentlichen Plätzen"

  inv_building_events.57.t:0 "Steuerämter in [building_province.GetName] melden deutlich niedrigere Einnahmen als erwartet ..."
  inv_building_events.57.desc:0 "Unsere Steuereintreiber berichten, dass sie ihre Vorgaben in [building_province.GetName] nur schwer erfüllen konnten. Sie geben einer Reihe von Unglücksfällen die Schuld, die [building_province.GetArea.GetName] in letzter Zeit heimgesucht haben. Die Bevölkerung bittet natürlich um Nachsicht."
  inv_building_events.57.a:0 "Dann hoffen wir wohl auf mehr Glück im nächsten Jahr"
  inv_building_events.57.b:0 "Schickt Soldaten, um sicherzustellen, dass alle ihre Steuern bezahlen"

  inv_building_events.58.t:0 "Sklaven ermorden Adlige in [building_province.GetName]"
  inv_building_events.58.desc:0 "Wir haben erfahren, dass einige Sklaven in [building_province.GetName] ausgebrochen sind und eine Mordserie begangen haben, bei der ein örtlicher Adliger ums Leben kam. Nun herrscht überall Panik, da die Menschen einen ausgewachsenen Sklavenaufstand befürchten."
  inv_building_events.58.a:0 "Das ist eine Katastrophe, aber wir können nichts unternehmen"
  inv_building_events.58.b:0 ""Schickt Soldaten nach [building_province.GetName], um die Ordnung wiederherzustellenn"

  fort_guy_assisting_local_fort:0 "Örtlicher Ingenieur"
  desc_fort_guy_assisting_local_fort:0 "In dieser Provinz lebt ein genialer Ingenieur, der mit der Verantwortung für die regionale Verteidigung betraut ist."
  increased_defense_in_this_province:0 "Verstärkte Verteidigungsanlagen"
  desc_increased_defense_in_this_province:0 "Dank getätigter Investitionen genießt diese Provinz durch ihre verstärkten Verteidigungsanlagen eine erhöhte Sicherheit"
  decreased_defense_in_this_province:0 "Geschwächte Verteidigungsanlagen"
  desc_decreased_defense_in_this_province:0 "Aufgrund einer Katastrophe, die diese Region heimgesucht hat, ist die Sicherheit dieser Provinz beeinträchtigt."
  rat_infestation_in_port:0 "Rattenplage"
  desc_rat_infestation_in_port:0 "Diese Region leidet unter einer verheerenden Rattenplage, die die lokalen Lebensmittelvorräte zerstört."
  locally_expanded_port_infrastructure_modifier:0 "Erweitertes Hafenviertel"
  desc_locally_expanded_port_infrastructure_modifier:0 "Der Hafen in dieser Region wurde dank der erfahrenen Schiffbauer erweitert."
  local_economic_boom_modifier:0 "Wirtschaftlicher Aufschwung"
  desc_local_economic_boom_modifier:0 "Dank kluger Investitionen erlebt diese Region eine Phase wirtschaftlichen Wachstums."
  grateful_populace_modifier:0 "Dankbare Bevölkerung"
  desc_grateful_populace_modifier:0 "ADank unserer Bemühungen, die Einheimischen zu unterstützen, sind diese uns außerordentlich dankbar."
  local_economic_bust_modifier:0 "Wirtschaftlicher Niedergang"
  desc_local_economic_bust_modifier:0 "Aufgrund von Umständen, die außerhalb unserer Kontrolle liegen, ist die Wirtschaftsleistung dieser Region vorübergehend gesunken."
