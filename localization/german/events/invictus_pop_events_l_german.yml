l_german:
  #Done 22.11.26
  inv_pop_events.1.t:0 "Spannungen unter freien Männern" 
  inv_pop_events.1.desc:0 "Wie Ihr wisst, [ROOT.GetCountry.GetRuler.GetName], leben zahlreiche freie Männer in [pop_province.GetName]. Das ist zwar von Vorteil, wenn wir Männer für unsere Aufgebote rekrutieren müssen, doch manchmal entstehen daraus Probleme, mit denen wir uns befassen müssen.\n\nUnter den Einheimischen ist es aufgrund der Ergebnisse einiger sportlicher Wettkämpfe zu Ausschreitungen gekommen. Wenn wir nicht eingreifen, drohen diese außer Kontrolle zu geraten.\n\nEiner der Einheimischen, ein Mann namens [SCOPE.sChar('free_man').GetName], ist den weiten Weg von [pop_province.GetName] nach [ROOT.GetCountry.GetCapital.GetName] gereist, um uns diese beunruhigenden Nachrichten zu überbringen."
  inv_pop_events.1.a:0 "Belästigt Ihr mich tatsächlich gerade mit so etwas?"
  inv_pop_events.1.b:0 "Schickt Wachen in die Region, um für Ordnung zu sorgen"

  inv_pop_events.2.t:0 "Stammesfehden"
  inv_pop_events.2.desc:0 "[ROOT.GetCountry.GetRuler.GetName], zwischen einigen unserer Stammesangehörigen herrschen Blutfehden, die sich zu etwas weitaus Schlimmerem ausweiten könnten, wenn wir nicht alles in unserer Macht Stehende tun, um die Spannungen abzubauen. Die Stammesgefechte, die wir als unvermeidlichen Bestandteil des [ROOT.GetCountry.GetAdjective]en Lebens hinnehmen, werden zunehmend blutiger. Ein regionaler Konflikt könnte jederzeit ausbrechen, wenn wir dem nicht Einhalt gebieten.\n\nEin örtlicher Krieger namens [SCOPE.sChar('free_man').GetName] ist in unsere Hauptstadt gereist, um uns über diese Entwicklungen zu informieren."
  inv_pop_events.2.a:0 "Droht allen und fordert sie auf, ihre Raubzüge einzustellen"
  inv_pop_events.2.b:0 ""Das kümmert mich nicht ... Der Stärkste soll sich nehmen, was er will"

  inv_pop_events.3.t:0 "Bürger geraten mit freien Männern aneinander"
  inv_pop_events.3.desc:0 "Die Klassenspannungen zwischen den Gesellschaftsschichten in [pop_province.GetName] verschärfen sich zunehmend. Offenbar können die Bürger und die freien Männer dieser Region nicht miteinander auskommen und geraten immer wieder öffentlich aneinander.\n\nPolitische Ereignisse, religiöse Feste, sportliche Wettkämpfe – alles wird zum Auslöser von Ausschreitungen, bei denen auf beiden Seiten zahlreiche Menschen ihr Leben verlieren. Es ist offensichtlich, dass wir diese Situation nicht länger ignorieren können."
  inv_pop_events.3.a:0 "Ich fürchte, wir haben im Augenblick keine Zeit, uns darum zu kümmern"
  inv_pop_events.3.b:0 "Schickt unsere Soldaten, um in [pop_province.GetName] wieder für Ordnung zu sorgen"

  inv_pop_events.4.t:0 "Adlige verlangen nach Seide"
  inv_pop_events.4.desc:0 "Die Bewohner von [pop_province.GetName], einem Ort, der für seinen verschwenderischen Reichtum und Luxus bekannt ist, verlangen, dass wir edle Stoffe wie Seide auf ihre Märkte bringen.\n\nEs kümmert sie nicht, wie selten dieses hauchzarte Material ist, wie teuer es ist oder wie schwierig es sich beschaffen lässt. Offenbar zählt für sie nur, ihre Gier zu befriedigen."
  inv_pop_events.4.a:0 "Wir werden ein neues Luxusviertel für Seidenimporte errichten"
  inv_pop_events.4.b:0 "Wer kann schon vorhersagen, was die Handelsrouten uns bringen? Ich jedenfalls nicht"

  inv_pop_events.5.t:0 "Adliger  brutal ermordet"
  inv_pop_events.5.desc:0 "[ROOT.GetCountry.GetRuler.GetName], in [pop_province.GetName] macht eine Geschichte die Runde, von der Ihr erfahren solltet. Offenbar wurde einer der örtlichen Adligen mit einem unbekannten Versprechen zu einer Wegkreuzung gelockt, wo er anschließend mit Ziegelsteinen zu Tode geprügelt wurde.\nUnabhängig davon, was wir unternehmen, der Adlige ist bereits tot. Aber vielleicht könnten wir Wachen an die Wegkreuzung schicken, um sicherzustellen, dass so etwas nicht noch einmal geschieht?"
  inv_pop_events.5.a:0 "Das können wir uns nicht leisten - was für eine lächerliche Forderung!"
  inv_pop_events.5.b:0 "Die Sicherheit unserer Bevölkerung ist unbezahlbar – tut, was nötig ist"

  inv_pop_events.6.t:0 "Ruchlose Adlige töten Besitztumshalter"
  inv_pop_events.6.desc:0 "Schreckliche Nachrichten aus [pop_province.GetName] – offenbar hat eine Verschwörung habgieriger Adliger einen örtlichen Grundbesitzer ermordet, weil dieser sich geweigert hatte, ihnen sein Land zu verkaufen.\n\nEin derart dreistes und offenkundiges Verbrechen muss bestraft werden. Doch die Adligen sind der unvermeidlichen Empörung über ihre niederträchtige Tat zuvorgekommen und haben eine Bestechungssumme nach [ROOT.GetCountry.GetCapital.GetName] geschickt, in der Hoffnung, dass wir die ganze Angelegenheit ignorieren."
  inv_pop_events.6.a:0 "Wie viel haben sie geschickt? Das ist eine ordentliche Summe ..."
  inv_pop_events.6.b:0 "Schickt Soldaten, um das Land zu beschlagnahmen und zu versteigern"

  inv_pop_events.7.t:0 "Adlige tragen zur Forschung bei"
  inv_pop_events.7.desc.1:0 "Der Adel in [pop_province.GetName] zählt zu den gebildetsten und kultiviertesten Mitgliedern unserer Gesellschaft; viele Historiker und Philosophen stammen aus den Reihen dieser vornehmen Familien. Da es in der Region einen Überschuss an Papyrus gibt, könnten wir die Adligen dafür bezahlen, ihre zivilen Forschungen auszuweiten, wenn wir dies wünschten – sie würden diese Arbeit gerne übernehmen, benötigen dafür jedoch finanzielle Mittel."
  inv_pop_events.7.desc.2:0 "Der Adel in [pop_province.GetName] zählt zu den gebildetsten und kultiviertesten Mitgliedern unserer Gesellschaft; viele Historiker und Philosophen stammen aus den Reihen ihrer vornehmen Familien. Da es in der Region einen Überschuss an Papyrus gibt, könnten wir die Adligen dafür bezahlen, ihre militärische Forschung voranzutreiben, wenn wir dies wünschten – sie würden diese Arbeit gerne übernehmen, benötigen dafür jedoch finanzielle Mittel."
  inv_pop_events.7.desc.3:0 "Der Adel in [pop_province.GetName] zählt zu den gebildetsten und kultiviertesten Mitgliedern unserer Gesellschaft; viele Historiker und Philosophen stammen aus den Reihen ihrer vornehmen Familien. Da es in der Region einen Überschuss an Papyrus gibt, könnten wir die Adligen finanziell unterstützen, damit sie ihre Forschungen im Bereich der Rhetorik ausbauen – sie würden diese Arbeit gerne übernehmen, benötigen dafür jedoch finanzielle Mittel."
  inv_pop_events.7.desc.4:0 "Der Adel in [pop_province.GetName] zählt zu den gebildetsten und kultiviertesten Mitgliedern unserer Gesellschaft; viele Historiker und Philosophen stammen aus den Reihen dieser vornehmen Familien. Da es in der Region einen Überschuss an Papyrus gibt, könnten wir die Adligen finanziell unterstützen, damit sie ihre religiösen Forschungen ausweiten – sie würden diese Arbeit gerne übernehmen, benötigen dafür jedoch die nötigen Mittel."
  inv_pop_events.7.a:0 "Das können wir uns im Moment nicht leisten"
  inv_pop_events.7.b:0 "Auf jeden Fall! Dafür bezahlen wir gerne"

  inv_pop_events.8.t:0 "Sklaven zu Unrecht getötet"
  inv_pop_events.8.desc:0 "Wir haben einen Bericht aus [pop_province.GetName] erhalten, der sehr beunruhigend ist. Es scheint, als hätten sich die weitläufigen Landgüter dort den Ruf erworben, Orte der Grausamkeit und des Elends zu sein, an denen Sklaven zu Tode geschunden und gefoltert werden, wenn sie ihre täglichen Arbeitsquoten nicht erfüllen – Quoten, die für eine einzelne Person nahezu unmöglich zu bewältigen sind.\n\nDie Bevölkerung von [ROOT.GetCountry.GetCapital.GetName], deren Herzen von diesen schrecklichen Geschichten berührt wurden, fordert, dass etwas unternommen wird."
  inv_pop_events.8.a:0 "Was können wir realistisch tun? Die Antwort ist nichts"
  inv_pop_events.8.b:0 "Wir müssen Soldaten nach [pop_province.GetName] schicken, um wieder für Ordnung zu sorgen"

  inv_pop_events.9.t:0 "Verleumderischer Adel"
  inv_pop_events.9.desc:0 "Uns liegen Berichte vor, dass in [pop_province.GetName] offenbar üble Gerüchte über [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] verbreitet werden. Es scheint, dass einige örtliche Adlige es sich zum Zeitvertreib gemacht haben, sich immer neue, besonders einfallsreiche Beleidigungen für den [ROOT.GetCountry.GetAdjective]en [ROOT.GetCountry.GetRulerTitle] auszudenken."
  inv_pop_events.9.a:0 "Sollen sie doch reden, es kümmert mich nicht ..."
  inv_pop_events.9.b:0 "Schickt unsere Agenten in die gesamte Region, um sie einzuschüchtern und zum Schweigen zu bringen"

  inv_pop_events.10.t:0 "Bürger fordern mehr Freiheiten"
  inv_pop_events.10.desc:0 "[ROOT.GetCountry.GetRuler.GetName] hat eine Petition von den Einwohnern von [pop_province.GetName] erhalten, die sich über unsere harte Hand in ihrer Region beschwert. \n\nIn einem ziemlich unangemessenen Ton fordern sie mehr lokale Freiheiten und hoffen, dass die Verhältnisse wieder so werden wie vor unserer Ankunft in der Region."
  inv_pop_events.10.a:0 "Sie werden nichts bekommen"
  inv_pop_events.10.b:0 "Entbindet einige der Einheimischen von ihren militärischen Verpflichtungen"

  local_unrest_generic_unrest:0 "Allgemeine Unruhe"
  desc_local_unrest_generic_unrest:0 "Aufgrund örtlicher Ereignisse herrscht in dieser Gegend allgemeine Unruhe und die Menschen sind unzufrieden."
  local_unrest_heavy_unrest:0 "Schwere Unruhen"
  desc_local_unrest_heavy_unrest:0 "Aufgrund lokaler Ereignisse leidet diese Gegend unter schweren Unruhen und die Menschen sind ziemlich unglücklich."
  local_noble_research_boost:0 "Adelige  Forscher"
  desc_local_noble_research_boost:0 "Die Adligen dieser Region nutzen den Überschuss an Papyrus, um die Ergebnisse ihrer wissenschaftlichen Forschungen festzuhalten."
  silk_quarter_merchant_modifier:0 "Ausgebaute Infrastruktur"
  desc_silk_quarter_merchant_modifier:0 "Aufgrund der Nachfrage nach Seide in unseren Städten haben wir die lokale Infrastruktur ausgebaut, um den Wünschen der Einheimischen gerecht zu werden."