 embrace_galatian_culture: "Galatische Kultur annehmen"
 embrace_galatian_culture_desc: "Da sich die Lebensweise unserer Bevölkerung abhängig von ihren Nachbarn und der Entfernung zu unserer angestammten Heimat verändert, sollten wir diese Bräuche auf staatlicher Ebene annehmen."
