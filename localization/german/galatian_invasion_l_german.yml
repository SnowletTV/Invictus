l_german:
 galatian_invasion.1.t: "Migration"
 galatian_invasion.1.desc: "Seit mehreren Jahren zählen die alten Frauen die leeren Getreidekrüge, und die alten Männer sehen zu, wie die junge Krieger mit nichts als Speeren ausgerüstet ihren Herd verlassen und hungrige Familien zurücklassen. Pannonien und Illyrien, einst großzügig gegenüber unseren Vätern, können die Last so vieler Münder nicht länger tragen. Jenseits der Berge liegen die reichen und zerstrittenen Königreiche der Griechen, deren Könige immer noch mehr Zeit damit verbringen, sich um das Erbe Alexanders zu streiten, als es zu bewahren.\n\nDie Migration wird kein einheitliches Heer unter einem Banner sein. Die Dindarii blicken nach Süden in Richtung Pella, die Scordiscii nach [GetProvince('(int32)424').GetName] und die Stämme, die Tylis gründen wollen, nach Mesembria. Für die Volcae liegt der größere Gewinn jenseits der Meerenge in Anatolien. Dort könnten wir, wenn Mut und die Götter es zulassen, nicht nur Beute finden, sondern ein Land, das wir unser Eigen nennen können."
 galatian_invasion.1.a: "Die alten Straßen liegen vor uns offen"
 galatian_invasion.2.t: "Unsere Volcae-Brüder"
 galatian_invasion.2.desc: "Boten sind aus den Lagern der Trocmeri und Tolistobogii eingetroffen. Ihre Häuptlinge sprechen in schwärmerischen Tönen von gemeinsamem Blut, gemeinsamen Göttern und gemeinsamem Hunger; ihre Krieger sprechen unverblümter von den reichen Höfen jenseits des Bosporos. Allein könnte jeder Stamm vielleicht ein oder zwei Dörfer einnehmen. Gemeinsam könnten die drei Volcae-Völker die Herrscher Anatoliens dazu bringen, uns Gehör zu schenken, wenn wir einen Platz unter ihrer Sonne fordern.\n\nEin gemeinsames Unterfangen wird uns nicht zu einem gemeinsamen Volk machen, noch wird es uns vor Rivalitäten bewahren, sobald die Beute gezählt ist. Aber es wird sicherstellen, dass die Verteidiger, wenn sie endlich ihren Mut zusammennehmen, mehr als nur ein gallisches Banner vorfinden, das auf sie wartet."
 galatian_invasion.2.a: "Lasst die Volcae als Brüder aufbrechen"
 galatian_invasion.2.a.tt: "Die Volcae werden sich der Expedition anschließen. Unser Herrscher erhält #G 1 Kriegskunst#! und Tectosagia wird in allen derzeitigen Kriegen, an denen ein Stamm der Volcae beteiligt ist, Frieden herstellen."
 galatian_invasion.2.b: "Bietet ihnen bescheidene Geschenke und gemeinsame Beratung an" 
 galatian_invasion.2.b.tt: "Die Volcae werden sich der Expedition anschließen. Unser Herrscher erhält #G 1 Finesse#!, jedoch werden die derzeitigen Kriege von Tectosagia weiterhin andauern."
 galatian_invasion.2.c: "Versprecht ihnen von unseren Speeren erobertes Land" 
 galatian_invasion.2.c.tt: "Die Volcae werden sich der Expedition anschließen. Unser Herrscher erhält #G 1 Charisma#!, Tectosagia hingegen erhält #R 2#! aggressive Expansion." 
 galatian_invasion.3.t: "Die Felder Phrygiens"
 galatian_invasion.3.desc: "Der Rat hat bis tief in die Nacht hinein beraten, doch nun ist die Angelegenheit geklärt. Die Küste ist reich, doch sie gehört den Kaufleuten und Schiffen; die Berge sind zwar sicher, können aber ein Volk nicht ernähren. In #E Phrygien#! hingegen erstreckt sich dunkler Boden entlang ruhiger Flüsse, und weite Felder versprechen, dass unsere Kinder mehr erben werden als die Speere ihrer Väter.\n\nDie Expedition wird daher die ihr zugeteilten Ländereien in Phrygien in Besitz nehmen. Tectosagia, Trocmeria und Tolistobogia werden jeweils an ihrer gewählten Siedlung eine Streitmacht ausheben und denen, die dies verweigern, den Krieg erklären. Wir kommen nicht als Gäste, die um Durchgangsrecht bitten, sondern als ein Volk, das entschlossen ist, zu bleiben."
 galatian_invasion.3.a: "An den Küsten Asiens wartet reichlich Beute!"
 galatian_invasion.3.b: "Phrygien wird unser Volk ernähren."
 galatian_invasion.3.c: "Die Berge Kappadokiens bieten Zuflucht."
 galatian_invasion.4.t: "Plünderung und Raubzug"
 galatian_invasion.4.desc: "Die glanzvollen Städte Asiens liegen vor uns: Marmorkaien, überfüllte Märkte und Schreine, überladen mit Opfergaben, die über Generationen von Händlern gesammelt wurden. Ihre Bewohner bezeichnen unser Kommen als Überfall, als wäre Hunger ein vorübergehender Sturm und als könnte ein Stamm einfach nach Hause zurückkehren, sobald seine Kinder satt sind. Wir sind gekommen, um Reichtum zu erlangen, ja, aber auch, um zu beweisen, dass man die Volcae nicht mit einem Beutel Silber und einer gesicherten Straße vertreiben kann.\n\nWenn unsere Fahnen gehisst werden, wird jeder Stamm die ihm zugewiesene Siedlung angreifen und ihre Verteidiger zwingen, sich zu wehren. Mögen die reichen Männer an der Küste erfahren, was es kostet, wenn man von einem Volk wahr genommen wird, das nirgendwo mehr sonst hingehen kann."
 galatian_invasion.4.a: "Lasst die Küste unsere Namen erfahren"
 galatian_invasion.5.t: "Schwert und Pflug"
 galatian_invasion.5.desc: "Phrygien ist kein Land glitzernder Häfen, sondern ein Land dunkler Erde, ruhig fließender Flüsse und Felder, die groß genug sind, dass ein neues Volk darin alt werden kann. Hier kann ein Mann einen Speer in die Erde rammen und sich vorstellen, dass sein Enkel eines Tages denselben Boden nutzen wird, um eine Grenze zu setzen statt ein Grab. Die Menschen, die diese Ländereien besitzen, werden uns Eindringlinge nennen – sie mögen uns nennen, wie ihnen beliebt, solange sie uns Platz machen.\n\nDie Expedition hat die ihr zugedachten Gebiete erreicht. Tectosagia, Trocmeria und Tolistobogia haben jeweils eine Horde aufgeboten, um ihren Anspruch geltend zu machen, und erklären allen, die diesen ablehnen, den Krieg. Es wird keine Bitte um Durchzug und keine friedliche Ankunft geben – die Wanderung beginnt, sobald unsere Banner auf phrygischem Boden zu sehen sind."
 galatian_invasion.5.a: "Lasst uns unsere Fahnen in der schwarzen Erde platzieren!"
 galatian_invasion.6.t: "Heimat im Bergland"
 galatian_invasion.6.desc: "Kappadokien ragt wie eine Steinmauer aus den umliegenden Ebenen empor. Seine Täler sind schmal, seine Wege schwer zu begehen und seine Bergfestungen sind hartnäckige Bastionen; doch für ein Volk, das an raues Gelände gewöhnt ist, bietet ein solches Land mehr als nur Entbehrungen. Es bietet Zuflucht. Von diesen Höhen aus können wir beobachten, wie sich die Könige unter uns zerstreiten, wir können zuschlagen, wenn sie unachtsam werden, und Behausungen errichten, zu denen sich ihre Steuereintreiber nicht hinwagen.\n\nDie ausgewählten Siedlungen werden mit Gewalt beansprucht werden. Unsere Horde wird sich an dem festgelegten Ort versammeln, und das erste Zeichen, das die Kappadokier von uns erhalten, wird der Klang der Kriegshörner in ihren Tälern sein."
 galatian_invasion.6.a: "Die Berge mögen unser Volk beschützen"
 galatian_invasion.10.t: "Pella unter Belagerung"
 galatian_invasion.10.desc: "Mein König, [GetProvince('(int32)379').GetName|E] wwird derzeit von den einfallenden Horden der Gallier belagert. In der Vergangenheit blieben diese Horden nie lange in griechischen Gebieten, sondern plünderten und verwüsteten lediglich ihren Zielort. Nun jedoch treibt sie die Suche nach neuem Siedlungsland an, denn [GetProvince('(int32)4184').GetArea.GetRegion.GetName|E] und [GetProvince('(int32)4064').GetArea.GetRegion.GetName|E] sind zu klein, um die Nachkommen der vorangegangenen Migration zu ernähren. Wir müssen davon ausgehen, dass [GetProvince('(int32)379').GetName|E] zwar geplündert würde, sie sich dort aber niemals niederlassen würden, da die Gallier wissen, dass wir sie vertreiben würden. Dennoch dürfen wir nicht zulassen, dass der Palast von [GetCharacter('(int32)35').GetPraenomen] und [GetCharacter('(int32)39').GetPraenomen] in die Hände der Barbaren fällt! Wie würden sie darüber urteilen, wenn ihr Vermächtnis so kurz nach ihrem Tod entehrt würde?"
 galatian_invasion.10.a: "Wir müssen die Stadt entlasten!"
 galatian_invasion.11.t: "Pella unter Belagerung"
 galatian_invasion.11.desc: "Die Dindarier belagern [GetProvince('(int32)379').GetName|E], getrieben von ihrer Suche nach neuem Siedlungsland. Der makedonische König bittet um Hilfe, um diese Horde aus den griechischen Gebieten zu vertreiben. Wir sollten ihm beistehen, denn sollte die Stadt fallen, wäre der Weg nach Osten offen, um unsere Städte zu bedrohen. Die Horden würden in Richtung Thrakien und Troas marschieren und die schwachen Städte in Kleinasien plündern. Die Barbaren müssen sofort gestoppt werden!"
 galatian_invasion.11.a: "Wir werden dem Ruf des Königs folgen!"
 galatian_invasion.11.b: "Er hat sein Schicksal verdient!"
 galatian_invasion.12.t: "Pella unter Belagerung"
 galatian_invasion.12.desc: "Horden gallischer Barbaren belagern [GetProvince('(int32)379').GetName|E]. Sollte es fallen, wäre der Weg nach Osten und Süden frei. Die Stämme würden in [GetProvince('(int32)416').GetArea.GetRegion.GetName|E], [GetProvince('(int32)1453').GetArea.GetRegion.GetName|E] und [GetProvince('(int32)257').GetArea.GetRegion.GetName|E] einmarschieren, eine Gelegenheit, die sie sicherlich nutzen würden.\n\nDiese Stämme stammten ursprünglich aus [GetProvince('(int32)3666').GetArea.GetRegion.GetName|E], [GetProvince('(int32)2285').GetArea.GetRegion.GetName|E] und [GetProvince('(int32)152').GetArea.GetRegion.GetName|E] und hatten sich vor einigen Generationen in [GetProvince('(int32)4184').GetArea.GetRegion.GetName|E] und [GetProvince('(int32)4064').GetArea.GetRegion.GetName|E] niedergelassen. Nun sind sie erneut auf der Suche nach neuem Land, auf dem sie sich niederlassen können. Ihre Zahl ist gewachsen, denn die Länder von [GetProvince('(int32)4184').GetArea.GetRegion.GetName|E] und [GetProvince('(int32)4064').GetArea.GetRegion.GetName|E] sind fruchtbar. Doch diese Gebiete sind zu klein, was sie weiter nach Süden und Osten treibt. Wir sind zu weit entfernt, um helfen zu können, sollten uns aber auf das Schlimmste vorbereiten."
 galatian_invasion.12.a: "Versammelt die Männer!"
 galatian_invasion.13.t: "Neuigkeiten aus Pella"  
 galatian_invasion.13.desc: "Ein Reiter ist eingetroffen, sein Umhang mit Schlamm und Blut bespritzt, und bringt Nachricht von den Invasionen, die bereits begonnen haben. Die #E Dindarii#! sind über [GetProvince('(int32)379').GetName|E]hergefallen, und ihre Horde hat ihre Fahnen vor [SCOPE.sCountry('pella_defender').GetName] gehisst. Was auch immer aus dieser großen Migration entstehen mag – die Griechen werden nicht behaupten können, dass die #E Volcae#! allein marschierten.\n\nDer erste Schlag ist in #E Makedonien#! erfolgt, und schon verlassen die Flüchtlinge ihre Höfe, um sich hinter den Stadtmauern in Sicherheit zu bringen. Mögen die Anführer von [ROOT.GetCountry.GetName] sich dies gut merken: Jeder Sieg unseres Volkes lässt den Weg nach Osten kürzer erscheinen, doch jede Niederlage bringt uns den griechischen Speeren näher."  
 galatian_invasion.13.a: "Die Dindarii haben ihren Einsatz getätigt"
 galatian_invasion.20.t: "Galater haben [GetProvince('(int32)424').GetName] angegriffen"
 galatian_invasion.20.desc: "Nachdem sie ihre Feinde im Norden bekämpft haben, sind die Stämme nach Süden gezogen. Auf ihrem Weg plünderten und brandschatzten sie und hinterließen eine blutige Spur der Verwüstung in Thessalien. Nun stehen sie vor unserem Heiligtum des Apollo mit ihren Augen voller Gier angesichts all der Schätze, von denen sie träumen, unserer geliebten Stadt [GetProvince('(int32)424').GetName] zu entreißen. Ares verabscheut die Schwachen, also werden wir stark sein. Athene leitet die Klugen, mit ihrem Segen wird unsere List den Feind täuschen. Mit Apollos Treffsicherheit finden unsere Pfeile die Herzen unserer Feinde. Mit allen Göttern auf unserer Seite – wie könnten wir da verlieren? Wir werden nicht zulassen, dass diese Barbaren unseren heiligen Schrein und unsere Stadt entehren! Wir werden sie bis zum letzten Atemzug verteidigen, denn die Götter würden den Verrätern keine Gnade gewähren!"
 galatian_invasion.20.a: "Apollo ist mit uns!"
 galatian_invasion.21.t: "Belagertes [GetProvince('(int32)424').GetName]"
 galatian_invasion.21.desc: "Die Stämme sind nach Süden gezogen, nachdem sie auf den Feldern von Emathia auf die Makedonen getroffen sind. Auf ihrem Weg durch Thessalien plündernd haben sie nun [GetProvince('(int32)424').GetName] erreicht, das sie belagern. Sie wollen seine Reichtümer plündern, seine Bewohner versklaven und seinen Schrein zu Ehren ihrer heidnischen Götter entweihen. Wir müssen unseren hellenischen Brüdern bei der Verteidigung des Apollon-Heiligtums beistehen. In ihrer Selbstüberschätzung sehen sie die griechischen Städte nicht als Bedrohung an. Die Götter werden uns beistehen!"
 galatian_invasion.21.a: "Hochmut kommt vor dem Fall"
 galatian_invasion.22.t: "[GetProvince('(int32)424').GetName] belagert"
 galatian_invasion.22.desc: "[GetProvince('(int32)424').GetName] ist bedroht. Die barbarischen Horden sind nach ihren Zusammenstößen mit den Makedonen im Norden nach [GetProvince('(int32)424').GetName] vorgerückt und haben die Städte auf ihrem Weg nach Süden geplündert. Jetzt wird das Heiligtum des Apollo von den Scordiscii belagert. Die Pythia, die [GetProvince('(int32)424').GetName] reich gemacht hat, hat es nun zur Zielscheibe gemacht, denn die Heiden wollen sie ihren Göttern opfern. Die Reichtümer, die sie birgt, haben sie angezogen, ihren Verstand getrübt und ihre Gier Überhand nehmen lassen. Es wäre ein bitteres Zeichen Apollos, sollte [GetProvince('(int32)424').GetName] fallen."
 galatian_invasion.22.a: "Sakrileg"
 galatian_invasion.22.at: "#R Die Scordiscii werden versuchen, [GetProvince('(int32)424').GetName] zu plündern#!"
 galatian_invasion.22.b: "[GetProvince('(int32)424').GetName] muss unter allen Umständen verteidigt werden."
 galatian_invasion.23.t: "Neuigkeiten aus Delphi" 
 galatian_invasion.23.desc: "Wir haben erfahren, dass die Scordiscii vor den heiligen Höhen von [GetProvince('(int32)424').GetName|E] stehen. Ihre Häuptlinge haben sich ein Ziel auserkoren, das jede griechische Stadt aufhorchen lassen wird: ein Heiligtum, reich an Opfergaben, das ebenso sehr durch seinen Ruf wie durch seine Mauern geschützt ist. [SCOPE.sCountry('delphi_defender').GetName] hat ihre Forderung mit Krieg beantwortet – ein törichter Fehler ihrerseits.\n\nManche unserer Krieger spotten, dass die Griechen zwar viele Götter, aber zu wenige Schwerter hätten. Andere machen das Zeichen gegen das Unglück; selbst ein [ROOT.GetCountry.GetAdjective]er Häuptling weiß, dass ein Volk, das um seine heiligen Stätten fürchtet, mit gefährlichem Mut kämpfen kann." 
 galatian_invasion.23.a: "Apollos Gold hat gallischen Stahl angezogen" 
 galatian_invasion.30.t: "[GetProvince('(int32)4244').GetName] erobert"
 galatian_invasion.30.desc: "Mein [ROOT.GetCountry.GetRulerTitle], [GetProvince('(int32)4244').GetName] wurde von den migrierenden Galaterhorden erobert, die sich vor einigen Generationen in Pannonien und Illyrien niedergelassen hatten. Jetzt sind sie wieder auf der Suche nach neuem Land, auf dem sie sich niederlassen können. Ihre Zahl ist gewachsen, denn die Länder Pannoniens und Illyriens sind fruchtbar. Dennoch scheinen diese Ländereien zu klein für sie zu sein.\n\nDer fruchtbare Boden und die strategische Lage unseres Landes haben offensichtlich ihre Aufmerksamkeit erregt. Es liegt an uns, das zu bewahren, was unsere Vorfahren geschaffen haben. Sie wollen unser Land zerstören und aus ihren Trümmern ein eigenes Königreich errichten. Wir dürfen bei der Verteidigung unserer Städte nicht nachlassen, denn hinter den Mauern verstecken sich unsere Frauen und Kinder. Die Galater sind bekannt für ihre Brutalität nach der Schlacht: Sie vergewaltigen die Frauen und foltern die Männer. Wir werden nicht kapitulieren! Es ist unsere Pflicht, im Namen der Götter, nicht zuzulassen, dass sie unsere Heimat einnehmen!"
 galatian_invasion.30.a: "Dunkle Zeiten stehen uns bevor."
 galatian_invasion.30.at: "Die  @[tylis_attacker.GetFlag]! #Y [SCOPE.sCountry('tylis_attacker').GetAdjective]en#! Angreifen werden versuchen, aus unseren Ländern ein unabhängiges Königreich zu schaffen."
 galatian_invasion.32.t: "[GetProvince('(int32)480').GetName] gefährdet"
 galatian_invasion.32.desc: "Die thrakischen Kolonien sind in Gefahr. Eine barbarische Streitmacht hat unsere Linien durchbrochen und belagert [GetProvince('(int32)480').GetName]. Die Celegerii versuchen, ihre Migration abzuschließen und sich in Tylis niederzulassen. \n\n[GetProvince('(int32)480').GetName] ist eine Bastion gegen die Geten. Sollte die Stadt fallen, könnten weitere Plünderer von Norden nach [GetProvince('(int32)1453').GetArea.GetRegion.GetName] eindringen, da die Verteidigungslinie von den Celegerii durchbrochen wurde. Unsere Städte könnten verwundbar sein, wenn wir nicht bald eine Lösung finden. Was bringt die Zukunft?"
 galatian_invasion.32.a: "Dunkle Zeiten stehen uns bevor"
 galatian_invasion.32.at: "Die  @[tylis_attacker.GetFlag]! #Y [SCOPE.sCountry('tylis_attacker').GetAdjective]en#! Angreifer werden versuchen, in Tylis ein unabhängiges Königreich zu errichten."

 galatian_invasion.33.t: "Neuigkeiten aus Mesembria" 
 galatian_invasion.33.desc: "Der dritte Bericht stammt von der Küste Thrakiens. Die Stämme, die von Tylis träumen, sind in die Gebiete um [GetProvince('(int32)480').GetName|E] vorgedrungen, wo sie ihre eigene Armee aufgestellt und [SCOPE.sCountry('tylis_defender').GetName] um ein Königreich am Meer gefordert haben.\n\nDrei Wege führen nun von unserer alten Heimat weg: einer nach Pella, einer nach Delphi und einer nach Mesembria. Wir von Tectosagia haben uns für Anatolien entschieden, doch unser Schicksal bleibt mit ihrem verbunden. Wenn die Griechen gezwungen sind, ihre Kräfte an allen Fronten gleichzeitig einzusetzen, bleibt vielleicht genug Land für uns alle."
 galatian_invasion.33.a: "Die Welt öffnet sich für unser Volk"
 
 galatian_invasion.34.t: "Königreich Tylis"
 galatian_invasion.34.desc: "Nach harten Kämpfen haben wir endlich unsere Herrschaft über [GetProvince('(int32)4244').GetName] gefestigt und sind bereit, uns in diesen neuen Ländern zu einem richtigen Königreich zu formieren. In den kommenden Jahren werden die Tylier sicherlich als ein wildes Volk bekannt werden. Die Zeit für Handel und Reisen steht kurz bevor, denn ein neues Volk bietet neue, aufregende Dinge zu entdecken."
 galatian_invasion.34.a: "Ein neues Volk hat sich erhoben"
 galatian_invasion.34.at: "Das Königreich von  @[tylis_attacker.GetFlag]! #Y Tylis#! wurde gegründet."
 TYL: "Tylis"  
 TYLIS_NAME: "Tylis"  
 TYLIS_ADJ: "Tylisch" 
 tylis_must_not_exist: "Tylis darf nicht existieren." 
 tylis_claims_tooltip: "Tylis erhält Ansprüche auf die Regionen #Y $thrace_region$#! und #Y $moesia_region$#!." 
 form_tylis: "Tylis bilden"  
 form_tylis_desc: "Unsere Ländereien in Pannonien und Illyrien sind zwar fruchtbar, aber zu klein, um uns zu ernähren. Weit im Westen liegt eine Region namens Tylis, die Gerüchten zufolge großen Reichtum besitzt. Ihre strategische Lage macht sie zu einem idealen Ort, um ein eigenes Königreich zu gründen, nah genug an den Hellenen, um sie zu überfallen, aber weit genug entfernt, um Gegenangriffe zu verhindern."  

 galatian_invasion.35.t: "Königreich von Tylis" #nt! Pause
 galatian_invasion.35.desc: "Die keltisch-pannonischen Stämme, die  [GetProvince('(int32)4244').GetName] erobert haben, haben sich nun zu einem Königreich um diese Siedlung herum zusammengeschlossen. In den kommenden Jahren werden diese Tylier sicherlich als ein wildes Volk bekannt werden. Die Zeit für Handel und Reisen steht kurz bevor, denn ein neues Volk bietet neue, spannende Dinge zu entdecken. Es gibt Gerüchte über eine neue Art von Schwert, das die Gallier aus ihrer fernen Heimat mitgebracht haben..."
 galatian_invasion.35.a: "Ein neues Volk hat sich gebildet."
 galatian_invasion.35.at: "Das Königreich von  @[tylis_attacker.GetFlag]! #Y Tylis#! wurde gegründet."
 galatian_invasion.40.t: "Die Gallier in Anatolien"
 galatian_invasion.40.desc: "Die Galater haben sich nach Anatolien eingeschlichen und einige kleinere Städte überfallen, geplündert und geplündert. Jetzt erreichen sie unsere Stadt Gordion und wollen sich hier niederlassen, auf dem Land unserer Vorväter. Wir werden sie hier nicht dulden, wir müssen die Barbaren aus Phrygien vertreiben. \nHellenen von Anatolien vereinigt euch, denn ihr habt nichts zu verlieren als euer Land. Die Gallier haben Ihre Farmen überfallen, Ihre Söhne getötet und Ihre Töchter entführt. Hellenen von Phrygien, schließen Sie sich der Verteidigung von Gordion an. Der Sieg ist sicher, denn die Stämme sind Heiden und die Götter sind auf unserer Seite! Wir werden keinen Zentimeter nachgeben. Wir werden unsere Heimat verteidigen und die brutalen und barbarischen Galater nach Hause treiben! \n  \n - Auszug aus einer Kundgebungsrede in Gordion, Redner unbekannt, etwa 50 Jahre nach Alexanders Tod."
 galatian_invasion.40.a: "Wir werden keinen Zentimeter nachgeben!"
 galatian_invasion.42.t: "Die Gallier in Anatolien"
 galatian_invasion.42.desc: "Einige Stämme, die Pella belagerten, haben den Bosporus und die Dardanellen überquert. Sie überfielen Kleinasien und plünderten einige kleinere Städte, blieben jedoch weitgehend unbemerkt. Die Diadochen und Epigenoi streiten sich eifrig, und die kleineren Stadtstaaten müssen sie versorgen. Somit stoßen die Stämme auf keinen wirklichen Widerstand. Ursprünglich verließen die Gallier Pannonien und Illyrien, um eine neue Heimat zu finden. Jetzt haben sie die Region gefunden, in der sie siedeln wollen. Um Gordion herum ist das Land fruchtbar, die Ländereien sind hügelig. Die Galater sind an ähnliches Terrain gewöhnt, sie wissen, wie man darin kämpft. Doch Phrygien wird ihnen nicht auf einer Silbertafel überreicht, denn Gordion wird erbittert verteidigt."
 galatian_invasion.42.a: "So sei es"
 galatian_invasion.43.t: "Besiedlung der Barbaren"
 galatian_invasion.43.desc: "Die Galater haben einen Abgesandten geschickt, sie suchen Frieden. Sie sind mit einem Angebot zu uns gekommen, das durchaus verlockend sein könnte. Im Austausch für etwas Land in Phrygien würden sie als Vasallenstaat dienen. Die gallischen Krieger würden für unsere Sache kämpfen und unseren Befehlen gehorchen. Sollten wir ihr Angebot ablehnen, würden sie bis zum letzten Mann kämpfen, ihre Frauen und Kinder seien mit dieser Migration mitgekommen. Der Krieg wäre blutig und wir wären gezwungen, Kräfte einzusetzen, die wir an anderen Fronten brauchen. Sie schlagen diese Lösung vor, denn die Barbaren wissen, dass wir von anderen Fronten abgelenkt werden; dies, glauben sie, wäre zu unserem beiderseitigen Vorteil. \nWir sollten nicht vergessen, dass wir, wenn wir das Land jetzt abtreten, es später immer noch zurückerobern könnten ..."
 galatian_invasion.43.a: "Sie werden ihr Land haben ... für jetzt"
 galatian_invasion.43.b: "Dieses Land ist mein!"
 galatian_invasion.44.t: "Ein neues Zuhause"
 galatian_invasion.44.desc: "Nachdem unser Volk das Recht errungen hat, diese fruchtbaren Ebenen zu besiedeln, hat es seine Heimat in Pannonien verlassen, um sich hier in Anatolien niederzulassen. Die Phryger nannten diese Region früher ihre Heimat, aber die uns umgebenden Hellenen nennen dieses Land jetzt Galatien nach unserem Volk."
 galatian_invasion.44.a: "Lass unsere Schwerter zu Pflugscharen werden."
 galatian_invasion.44.b: "Unser Volk soll bleiben."
 galatian_invasion.53.t: "Besiedlung der Barbaren"
 galatian_invasion.53.desc: "Die Galater haben einen Abgesandten geschickt, sie suchen Frieden. Sie sind mit einem Angebot zu uns gekommen, das durchaus verlockend sein könnte. Im Austausch für etwas Land in Phrygien würden sie als Vasallenstaat dienen. Die gallischen Krieger würden für unsere Sache kämpfen und unseren Befehlen gehorchen. Sollten wir ihr Angebot ablehnen, würden sie bis zum letzten Mann kämpfen, ihre Frauen und Kinder seien mit dieser Migration mitgekommen. Der Krieg wäre blutig und wir wären gezwungen, Kräfte einzusetzen, die wir an anderen Fronten brauchen. Sie schlagen diese Lösung vor, denn die Barbaren wissen, dass wir von anderen Fronten abgelenkt werden; dies, glauben sie, wäre zu unserem beiderseitigen Vorteil. \nWir sollten nicht vergessen, dass wir, wenn wir das Land jetzt abtreten, es später immer noch zurückerobern könnten ..."
 galatian_invasion.53.a: "Sie werden ihr Land haben ... für jetzt"
 galatian_invasion.53.b: "Dieses Land ist mein!"
 galatian_invasion.63.t: "Besiedlung der Barbaren"
 galatian_invasion.63.desc: "Die Galater haben einen Abgesandten geschickt, sie suchen Frieden. Sie sind mit einem Angebot zu uns gekommen, das durchaus verlockend sein könnte. Im Austausch für etwas Land in Phrygien würden sie als Vasallenstaat dienen. Die gallischen Krieger würden für unsere Sache kämpfen und unseren Befehlen gehorchen. Sollten wir ihr Angebot ablehnen, würden sie bis zum letzten Mann kämpfen, ihre Frauen und Kinder seien mit dieser Migration mitgekommen. Der Krieg wäre blutig und wir wären gezwungen, Kräfte einzusetzen, die wir an anderen Fronten brauchen. Sie schlagen diese Lösung vor, denn die Barbaren wissen, dass wir von anderen Fronten abgelenkt werden; dies, glauben sie, wäre zu unserem beiderseitigen Vorteil. \nWir sollten nicht vergessen, dass wir, wenn wir das Land jetzt abtreten, es später immer noch zurückerobern könnten ..."
 galatian_invasion.63.a: "Sie werden ihr Land haben ... für jetzt"
 galatian_invasion.63.b: "Dieses Land ist mein!"
 galatian_invasion.70.t: "Umarmung neuer Länder"
 galatian_invasion.70.desc: "Unser Volk, weit entfernt von den alten keltischen Ländern, beginnt, neue Praktiken anzunehmen, die sich von den alten Gewohnheiten unterscheiden. Sollen wir dieses neue Ethos annehmen oder an den alten Traditionen festhalten?"
 galatian_invasion.70.a: "Ein neues Land für ein neues Volk."
 galatian_invasion.70.b: "Wir werden unsere angestammten Bräuche niemals aufgeben!"
 galatian_invasion.71.t: "Galatien"
 galatian_invasion.71.desc: "Seit die ersten Gallier in Mazedonien eingefallen sind, sind viele Jahre vergangen. Viele haben gegen die Galater gekämpft, einige Schlachten haben sie gewonnen, einige haben sie verloren, aber keiner hat es geschafft, sie zu besiegen. Die Trocmeri, Tectosagii und Tolistobogii haben einen Ort erobert und besiedelt, den sie Heimat nennen können, und stecken jetzt ihre Schwerter in die Scheide und tauschen sie gegen Pflugscharen ein, was ihre Wanderung beendet. \n Jetzt haben sich die Stämme in dem, was sie Galatien nennen, vereint. In den kommenden Jahren werden sie sicherlich als kämpferisches Volk bekannt sein, bereit zu kämpfen, wenn nötig, aber an den Frieden gewöhnt. Im Herzen Anatoliens leben und sterben ihre Menschen. \nDie Zeit für Handel und Reisen ist gekommen, denn ein neues Volk bietet neue, aufregende Dinge zu entdecken. Es gibt ein Gerücht über ein neues Schwert, das die Gallier aus ihrer fernen Heimat mitgebracht haben ..."
 galatian_invasion.71.a: "Ein neues Volk ist entstanden"
 galatian_invasion.72.t: "Keltisches Phrygien"
 galatian_invasion.72.desc: "Die Kelten haben sich in Phrygien niedergelassen, ihre Reise neigt sich dem Ende zu. Sie haben gegen Griechen und Mazedonier, Hellenen und Kybelene gekämpft. Mit dem Blut, das sie vergossen haben, bewässern sie die fruchtbaren Länder, die sie erobert haben. Sie haben sich bewährt, und ihre Götter haben ihre Reise begünstigt. Ihre neue Heimat nennen sie Galatien. \n \n Die Galater sind immer noch Barbaren, wir sollten versuchen, sie zu zivilisieren. Krieg ist nicht der einzige Weg, ein Volk zu besiegen; mit Geld und einem Lächeln würden sie sich sicherlich integrieren. Wenn sie neue Griechen würden, hätten sie nichts zu befürchten. Sie haben eine neue Art von Schwert mitgebracht, die sie als Meister im Umgang bewiesen haben. Vielleicht können wir die Gallier davon überzeugen, uns welche zu verkaufen. Neue Leute bieten neue Vorteile..."
 galatian_invasion.72.a: "Endlich Frieden"
 galatian_invasion.75.t: "Vereinigte Vulcae"
 galatian_invasion.75.desc: "Unsere Brüder haben unser Recht akzeptiert, eine Konföderation zu führen. Sie haben ihre Untertanenvereinbarung mit ihren ehemaligen Oberherren gebrochen und schwören uns Treue."
 galatian_invasion.75.a: "Eine neue Ära steht uns bevor."
