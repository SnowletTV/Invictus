 start_galatian_invasion: "Greifen Sie in Griechenland ein"
 start_galatian_invasion_desc: "Zu lange wurden uns die Reichtümer Griechenlands vorenthalten. Wir zahlen einen hohen Preis für ihren Wein und ihr Öl, während diese Schwächlinge sich laben. Jetzt, wo der gefürchtete Alexander fort ist, gehört ihr Schatz uns, und niemand ist stark genug, um sich uns entgegenzustellen!"
