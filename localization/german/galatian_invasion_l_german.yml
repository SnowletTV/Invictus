 start_galatian_invasion: "In Griechenland einfallen"
 start_galatian_invasion_desc: "Allzu lange wurden uns die Reichtümer Griechenlands vorenthalten. Wir zahlen einen hohen Preis für ihren Wein und ihr Öl, während diese Schwächlinge schlemmen. Nun, da der gefürchtete [GetCharacter('(int32)39').GetPraenomen] nicht mehr ist, liegen ihre Schätze zum Greifen nah, und niemand ist stark genug, sich uns entgegenzustellen!"
