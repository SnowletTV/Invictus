 embrace_galatian_culture: "Umfassen Sie die galatische Kultur"
 embrace_galatian_culture_desc: "Da unser Volk seine Gewohnheiten aufgrund seiner Nachbarn und der Entfernung von unserem angestammten Heimatland ändert, sollten wir diese Bräuche auf staatlicher Ebene annehmen."
