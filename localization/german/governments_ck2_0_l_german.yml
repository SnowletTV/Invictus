l_german:
  spartan_monarchy:0 "Spartanische Dyarchie" #Done 13.7.26 -V1.11.0.3 - Germanicus
  spartan_monarchy_desc:0 "Zwei Könige sind besser als einer. - Lakonisches Sprichwort"
   #spartan_monarchy_desc:0 "The Spartans have always been governed by two kings rather than one, both families sharing Heraclian ancestry."
  spartan_imperial_cult:0 "Spartanischer Kaiserkult"
  spartan_imperial_cult_desc:0 "In manchen Kulturen besitzt ein Kaiser oder eine Kaiserin eine solche Autorität, dass sie und ihre Vorfahren als Botschafter des Göttlichen oder sogar selbst als Gottheit betrachtet werden."
  spartan_imperium:0 "Spartanisches Reich"
  spartan_imperium_desc:0 "Ein Kaiser übt absolute Macht über den Staat aus und hat normalerweise die Souveränität über kleinere Könige und Adlige."
   ###EVENT 2: Spartan Flavor Event to start the game off
  spartan_event.2.t:0 "Alexander der Schreckliche"
  spartan_event.2.desc:0 "Babylon, 18 Jahre zuvor,  König Alexander starb plötzlich im Alter von 32 Jahren und ließ sein neu erobertes Reich zerbrechen. Seit seinem Vater, König Philipp, sind die Makedonen zum Hegemon aller Griechen aufgestiegen, außer uns Spartanern. Diesen Trotz haben die Makedonen nie vergessen, und Alexander der „Große“ hat uns zunächst diplomatisch und später in der Schlacht von Megalopolis auch militärisch gedemütigt. Wir bleiben unabhängig, aber die Götter haben uns mit ihrem verdrehten Sinn für Humor verspottet. \n\nDer Verlust von Messene und der Heloten zeigt der griechischen Welt, dass unser eigenes Haus nicht in Ordnung ist, wodurch unser spartanisches Vermächtnis langsam an Glaubwürdigkeit verliert. Die meisten Griechen werden sich an unsere Abwesenheit im Perserfeldzug und an unseren gescheiterten Feldzug gegen die Makedonier erinnern. Da sich die Diadochen jedoch auf Kriege untereinander konzentrieren, haben wir ein kleines Zeitfenster, um Reformen durchzuführen, uns anzupassen und die alte Ordnung wiederherzustellen. \n\nSöhne des Herakles, durch den Hades werden wir uns erheben!"
  spartan_event.2.a:0 "Molon Labé!"
  ### Spartan Kings
###EVENT 3: New Spartan Ruler Flavor Event
  spartan_event.3.t:0 "Der Basileus ist tot"
  spartan_event.3.desc:0 "Traurige Nachrichten heute Morgen, [ROOT.GetCountry.GetRulerTitle] [SCOPE.sChar('old_spartan_king').GetPraenomen] aus der Familie [SCOPE.sChar('old_spartan_king').GetFamilyDisplayName] hat den Styx überquert. Die Familie [ROOT.GetCountry.GetCoRuler.GetFamilyDisplayName] hat von der Nachricht erfahren und sich der Familie [SCOPE.sChar('old_spartan_king').GetFamilyDisplayName] bei ihrem letzten Abschied angeschlossen. Während die Stadt Sparta an diesem Tag in Trauer verstummt, wird der nächste Tag einen Neuanfang markieren, ein neuer [ROOT.GetCountry.GetRuler.GetFamilyDisplayName] [ROOT.GetCountry.GetRulerTitle], und zusammen mit den [ROOT.GetCountry.GetCoRuler.GetFamilyDisplayName]en wird Sparta sein herakleisches Erbe fortsetzen."
  spartan_event.3.a:0 "Heute Abend speist er im Hades."
  ###EVENT 4: New Spartan Ruler Flavor Event - If co-ruler was the primary heir
  spartan_event.4.t:0 "Die königliche Sonnenfinsternis"
  spartan_event.4.desc:0 "So selten wie der Besuch eines der Götter, hat sich die Wahrnehmung darüber, wer die Dominante der beiden königlichen Familien ist, verändert. Obwohl sie gleichberechtigt sind und herakleisches Blut teilen, wurden die [SCOPE.sChar('old_ruler').GetFamilyDisplayName] traditionell als die etwas prominenteren der beiden Familien angesehen. Dies ist das Ergebnis des Erbes der Familie, berühmter Persönlichkeiten und Helden aus alter Zeit. Dies hat sich jedoch geändert, die Wahrnehmung der Menschen darüber, welche Familie die prominentere ist, wurde auf den Kopf gestellt, und dies ist eine langsame, aber lang erwartete Änderung, da die [ROOT.GetCountry.GetRuler.GetFamilyDisplayName]en in letzter Zeit viele große Führer und Helden hervorgebracht haben und die andere Familie effektiv in den Schatten gestellt haben."
  spartan_event.4.a:0 "Erster unter Gleichen!"
  ###EVENT 5: New Spartan Co-Ruler Flavor Event
  spartan_event.5.t:0 "Der Co-Basileus ist tot"
  spartan_event.5.desc:0 "Traurige Nachrichten heute Morgen, [ROOT.GetCountry.GetCoRulerTitle] [SCOPE.sChar('old_co_ruler').GetPraenomen] der [SCOPE.sChar('old_co_ruler').GetFamilyDisplayName]en Familie ist in den Hades gegangen. Die [ROOT.GetCountry.GetRuler.GetFamilyDisplayName]en haben die Nachricht erhalten und sich der [SCOPE.sChar('old_co_ruler').GetFamilyDisplayName]en-Familie angeschlossen, um ihnen die letzte Ehre zu erweisen. An diesem Tag blieb die Stadt Sparta ruhig und trauerte um ihren verstorbenen [ROOT.GetCountry.GetCoRulerTitle], aber wenn die Sonne aufgeht, beginnt ein neuer Tag und ein neuer [ROOT.GetCountry.GetCoRuler.GetFamilyDisplayName] [ROOT.GetCountry.GetCoRulerTitle] auf dem Thron. Zusammen mit der [ROOT.GetCountry.GetRuler.GetFamilyDisplayName]-Familie werden sie Sparta voranbringen und sein heraklianisches Erbe fortführen."
  spartan_event.5.a:0 "Alles geht einmal vorbei … betet für die Verstorbenen"

  punic_republic:0 "Punische Republik"
  punic_republic_desc:0 "Die punische Regierung ist eine Form der Oligarchie, in der zwei Sopheten zusammen mit einem Senat regieren, der von den reichsten Mitgliedern des Staates gebildet wird. Diese Aristokratie basierte nicht auf Landbesitz, sondern auf purem Reichtum."

  rhodian_dictatorship:0 "Diktatur von Rhodos"
  rhodian_dictatorship_desc:0 "Eine Form der totalitären Regierung, eine Diktatur, legt die politische Macht in die Hände einer einzelnen Person. Das Volk von Rhodos hat seine Herrschaft einem einzigen Mann anvertraut."
  rhodian_dictatorship_ruler:0 "Tyrann"
  rhodian_dictatorship_ruler_female:0 "Tyrannin"
  rhodian_dictatorship_consort:0 "$title_consort$"

   ##change 
 tyrannic_monarchy_event.1.t: "Tod eines Tyrannen" 
 tyrannic_monarchy_event.1.desc: "Traurige Nachrichten heute Morgen: Der Arzt von [SCOPE.sChar('old_tyrant_king').GetPraenomen], teilte dem Hof mit, dass [SCOPE.sChar('old_tyrant_king').GetSheHe] innerhalb weniger Stunden sterben würde. In dem Wissen, dass [SCOPE.sChar('old_tyrant_king').GetSheHe] bald diese Welt verlassen würde, fanden sich alle in [ROOT.GetCountry.GetCapital.GetName] ansässigen [ROOT.GetCountry.GetRuler.GetFamilyDisplayName]en in den Gemächern von [SCOPE.sChar('old_tyrant_king').GetPraenomen] zusammen, um ihren letzten Respekt zu erweisen. Als [SCOPE.sChar('old_tyrant_king').GetName] [SCOPE.sChar('old_tyrant_king').GetHerHis]en letzten Atemzug tat, schickt [SCOPE.sChar('old_tyrant_king').GetSheHe] jeden weg, sogar seinen Arzt, so dass [SCOPE.sChar('old_tyrant_king').GetSheHe] seine letzten Wünsche an [SCOPE.sChar('old_tyrant_heir').GetName] übermitteln kann.\n\nNach dem Tod des [ROOT.GetCountry.GetRulerTitle]s, waren die Menschen in [ROOT.GetCountry.GetCapital.GetName] von Verzweiflung überwältigt und trauerten um ihren verstorbenen [ROOT.GetCountry.GetRulerTitle], aber sie warteten gespannt darauf, zu erfahren, was ihr geliebter [SCOPE.sChar('old_tyrant_king').GetName] für sie gewünscht hatte, und sind sich sicher, dass der nächste Tag einen Neuanfang markieren wird. Nun, nach einer angemessenen Trauerzeit, wird [SCOPE.sChar('old_tyrant_heir').GetPraenomen] die Abschiedsworte von [SCOPE.sChar('old_tyrant_king').GetPraenomen] an das [ROOT.GetCountry.GetAdjective]e Volk zu verkünden. '[SCOPE.sChar('old_tyrant_heir').GetPraenomen] du musst..."  
 # tyrannic_monarchy_event.1.a: "'Divest power back into the people.'"  <"„Macht zurück an die Menschen abgeben.“">  #NT!
 tyrannic_monarchy_event.1.b: "'Die Soldaten reichlich belohnen, verachte alle anderen.'" 
 tyrannic_monarchy_event.1.c: "'Den Titel des Tyrannen aufgeben und  offiziell den [ROOT.GetCountry.GetAdjective]en Thron beanspruchen.'" 
 tyrannic_monarchy_event.1.ct: "Die [SCOPE.sChar('old_tyrant_heir').GetFamilyDisplayName]en werden fortan als Könige regieren."  
 tyrannic_monarchy_event.1.d: "'Wissen, dass die Herrschaft über [ROOT.GetCountry.GetName] dem Stärksten gebührt'"  
 tyrannic_monarchy_event.1.dt: "Ein Charakter mit einem 'Kriegskunst-Wert' wird [SCOPE.sChar('old_tyrant_heir').GetName] das Recht auf die Herrschaft streitig machen und versuchen, den [COUNTRY.GetAdjective]en Thron an sich zu reißen."  
  
  
 tyrannic_monarchy_event.2.t: "Tod eines Tyrannen: Nachfolge"  
 tyrannic_monarchy_event.2.desc: "Als der Tyrann [SCOPE.sChar('old_tyrant_king').GetName] [SCOPE.sChar('old_tyrant_king').GetHerHis]en letzten Atemzug tat, erklärte [SCOPE.sChar('old_tyrant_king').GetPraenomen] dass die 'Herrschaft über [ROOT.GetCountry.GetName] dem Stärksten gebührt',womit er [SCOPE.sChar('old_tyrant_heir').GetPraenomen] offensichtlich als unwürdigen Erben betrachtet. In solchen Zeiten kommt es immer zu Verrat, aber jetzt scharen sich mögliche Nachfolger wie Geier um ihn. Die Begeisterung und der Ehrgeiz von [SCOPE.sChar('tyrant_plotter').GetName] haben [SCOPE.sChar('tyrant_plotter').Custom('get_SieIhn')] von den anderen Anwärtern abgehoben.\n\nAnstatt jahrelange ineffektive Herrschaft unter einem Greis wie [SCOPE.sChar('old_tyrant_heir').GetPraenomen], zu riskieren, schlägt [SCOPE.sChar('tyrant_plotter').GetName] vor, jetzt zu handeln, um sicherzustellen, dass wir einen starken und fähigen Herrscher haben, und weist eindeutig darauf hin, dass [SCOPE.sChar('tyrant_plotter').GetSheHe] die richtige Person für diese Aufgabe ist.\n\nDas ist sicherlich gefährliches Gerede, aber [SCOPE.sChar('tyrant_plotter').GetSheHe] könnte Recht haben. Können wir es uns leisten, eine solche Gelegenheit ungenutzt verstreichen zu lassen?"  
 tyrannic_monarchy_event.2.a: "Die Herrschaft wird nicht [SCOPE.sChar('tyrant_plotter').GetHerHim]."  
 tyrannic_monarchy_event.2.b: "Wir werden wegschauen..."
 tyrannic_monarchy_event.2.bt: "[SCOPE.sChar('tyrant_plotter').GetName] wird versuchen, [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] abzusetzen."  
  
 tyrannic_monarchy_event.3.t: "Der Tod eines Tyrannen: Aufstieg"  
 tyrannic_monarchy_event.3.desc: "Das Komplott zur Beseitigung von [ROOT.GetCountry.GetRulerTitle] [SCOPE.sChar('old_tyrant_heir').GetName], wurde nun mit Unterstützung der Regierung und der Aristokratie vollständig verwirklicht [SCOPE.sChar('old_tyrant_heir').GetName], [SCOPE.sChar('old_tyrant_heir').Custom('get_DieDer')] die Thronräuber anführt, marschiert mit einer Gruppe aus Soldaten und hochrangigen Beamten in den Palast.\n\n[SCOPE.sChar('tyrant_plotter').GetPraenomen] und seine Männer, unterstützt von den unzufriedenen Leibwächtern von [SCOPE.sChar('old_tyrant_heir').GetName], drangen heute früh in die königlichen Gemächer von [SCOPE.sChar('tyrant_plotter').GetPraenomen] ein und verkündeten ein Dekret, wonach [SCOPE.sChar('tyrant_plotter').GetHerHis] Vorgehen zum Wohle von ganz [ROOT.GetCountry.GetName] und zum Schutz seines Volkes notwendig seien.\n\nWir müssen nun abwarten, ob unsere stillschweigende Zustimmung zum Staatsstreich und zur Thronbesteigung von [SCOPE.sChar('tyrant_plotter').GetName] letztendlich doch die beste Entscheidung war..."  
 tyrannic_monarchy_event.3.a: "Werft [SCOPE.sChar('old_tyrant_heir').GetName] in den Kerker."  
 tyrannic_monarchy_event.3.b: "Hier endet die [SCOPE.sChar('old_tyrant_heir').GetFamilyDisplayAdjective]e Dynastie..."  
 tyrannic_monarchy_event.3.bt: "Alle Mitglieder der [SCOPE.sChar('old_tyrant_heir').GetFamilyDisplayName] werden hingerichtet." 
 tyrannic_monarchy_event.3.c: "Die [SCOPE.sChar('old_tyrant_heir').GetFamilyDisplayAdjective]e Herrschaft wird fortbestehen, wenn auch mit einigen Änderungen."  
 tyrannic_monarchy_event.3.ct: "[SCOPE.sChar('old_tyrant_heir').Custom('get_DieDer')|U] Erbe von [SCOPE.sChar('old_tyrant_heir').GetName], [SCOPE.sChar('old_tyrant_heir_heir').GetPraenomen], wird als König[SCOPE.sChar('old_tyrant_heir_heir').Custom('get_inFemale'] regieren, unter dem wachsamen Auge von [SCOPE.sChar('tyrant_plotter').GetName] und [SCOPE.sChar('tyrant_plotter').GetHerHis]er Unterstützer."  
 tyrannic_monarchy_event.3.d: "Andererseits ... netter Versuch, Verräter!"  
 tyrannic_monarchy_event.3.dt: "Es kommt zu einem wilden Handgemenge zwischen dem Herrscher und den Verschwörern. Ein überlebender Verschwörer oder der bevorzugte Erbe wird zum Herrscher ernannt.\nDiese Option ist aufgrund der #Y Kriegskunst#! Fähigkeit von [SCOPE.sChar('old_tyrant_heir').GetName] verfügbar." 
  
 tyrannic_monarchy_event.4.t: "Dunkle Zeiten" 
 tyrannic_monarchy_event.4.desc: "Das Komplott zur Beseitigung von [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName], wurde nun mit Unterstützung der Regierung und der Aristokratie vollständig verwirklicht. [tyrant_usurper.GetName], [tyrant_usurper.GetName.Custom('get_DieDer')] die Thronräuber anführt, marschiert mit einer Gruppe aus Soldaten und hochrangigen Beamten in den Palast.\n\n[tyrant_usurper.GetPraenomen] und seine Männer, unterstützt von den unzufriedenen Leibwächtern von [ROOT.GetCountry.GetRuler.GetName] drangen heute früh in die königlichen Gemächer von [tyrant_usurper.GetPraenomen] ein und verkündeten ein Dekret, wonach [tyrant_usurper.GetHerHis] Vorgehen zum Wohle von ganz [ROOT.GetCountry.GetName] und zum Schutz seines Volkes notwendig seien.\n\nNun müssen wir abwarten, ob unsere stillschweigende Zustimmung zum Staatsstreich und zur Thronbesteigung von [tyrant_usurper.GetName] letztendlich doch die beste Entscheidung war..."  
 tyrannic_monarchy_event.4.a: "Werft [ROOT.GetCountry.GetRuler.GetName] in den Kerker."  
 tyrannic_monarchy_event.4.b: "Hier endet die [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]e Dynastie..."  
 tyrannic_monarchy_event.4.bt: "Alle Mitglieder der [ROOT.GetCountry.GetRuler.GetFamilyDisplayName]en werden hingerichtet.\nDiese Option ist verfügbar, da [tyrant_usurper.GetPraenomen] nicht mit unserem Herrscher verwandt ist."  
 tyrannic_monarchy_event.4.c: "Die [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]e Linie wird diese Katastrophe überstehen."  
 tyrannic_monarchy_event.4.ct: "Der Primärerbe von [ROOT.GetCountry.GetRuler.GetName] wird [ROOT.GetCountry.GetName] als dessen König regieren, unter dem wachsamen Auge von [tyrant_usurper.GetName]." 
 tyrannic_monarchy_event.4.d: "Wenn ich es mir genauer überlege... netter Versuch, Verräter!"  
 tyrannic_monarchy_event.4.dt: "Es kommt zu einem wilden Handgemenge zwischen dem Herrscher und den Verschwörern. Ein überlebender Verschwörer oder der bevorzugte Erbe wird zum Herrscher ernannt.\nDiese Option ist wegen der #Y Kriegkunst#! Fähigkeit von [ROOT.GetCountry.GetRuler.GetName] verfügbar."  
