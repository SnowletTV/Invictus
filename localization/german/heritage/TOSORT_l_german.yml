  fezzani_heritage:0 "Fezzani-Erbe"
  fezzani_heritage_desc:0 "Die Stämme der Fezzan waren Meister des Wüstenkampfes und Dompteure der zahlreichen Oasen Libyens. Während sie auf offenem Feld gegen gut ausgebildete Legionen kämpfen, stellten ihre Guerillakämpfe in der Wüste und der Einsatz mobilerer Einheiten eine ewige Herausforderung für Griechen, Phönizier und Römer gleichermaßen dar."
  macrobian_heritage:0 "Somalisches Erbe"
  macrobian_heritage_desc:0 "Was den Völkern des modernen Somalia an Landkriegen fehlte, machten sie auf See enorm wett. Sie waren produktive Händler exotischer Waren, Piraten und Küstenräuber, die sich diejenigen mit minderwertiger Seemannschaft zunutze machten. Ihr Handelsnetz erstreckte sich von Indien bis zum Mittelmeer und entlang der Ostküste Afrikas und verschaffte ihnen diplomatische Kontakte in der ganzen bekannten Welt."

  Mahiladvipikan_heritage:0 "Mahiladvipikan-Erbe"
  Mahiladvipikan_heritage_desc:0 "Der Archipel, der die legendäre Insel Mahiladvipika umgibt, ist eine große Ansammlung natürlicher Atolle und Inselchen und die Heimat ziemlich isolierter Bevölkerungsgruppen, die ursprünglich aus einer Mischung aus südwestindischen und nordwestlichen srilankischen Völkern bestanden, aber später durch die angebliche Ankunft der Singhalesen beeinflusst wurden Menschen im 6. Jahrhundert v. Chr. als Magadha-Verbannte. Die Inselkette liegt an einem wichtigen Wegpunkt, der die Indisch-Rotes-Meer-Route überspannt, und trug zur allgemeinen Konnektivität des Erythräischen Meeres bei. Der Buddhismus würde bald mehrere der Atolle erobern und kulturelle Erneuerung und Innovation anregen, um eine maledivische Identität zu schaffen."

