  argos_gather_support_loc_2: "(#Y [SCOPE.ScriptValue('argos_total_character_powerbase_current')|0]#!/#Y [SCOPE.ScriptValue('argos_total_character_powerbase_total')|0]#!)"
  argos_missions_01_greece_task_20_B_tooltip: "#R Ein tödlicher Kampf um die Macht in Argos wird folgen.#!"
  argos_missions_01_greece_task_19_tt: "Mindestens #Y 3#! Charaktere haben die #Y Unterstützung gesammelt#! Charaktermodifikator, der aus der Charakter-Interaktion #Y Unterstützung sammeln#! gewonnen wird! (Derzeit: #Y SCOPE.ScriptValue('argos_chars_with_support_gathered')|0]#!)"
  argos_missions_01_greece_task_11_tt: "Mindestens #Y 5#! besessene Gebiete in der Provinz #Y $arcadia_area$#! haben Stadtstatus."
  gain_claims_on_sparta_tt: "Erhalte Ansprüche auf alle Gebiete, die #Y Sparta#! gehören"
  me_argos_1_title: "Eine königliche Ehe"
  me_argos_1_desc: "Auf Betreiben bestimmter weiblicher Mitglieder Ihres Haushalts, die untereinander entschieden hatten, dass ein unverheirateter Archon von Argos einfach ein unerträglicher Zustand sei, haben Sie zugestimmt, einen Gesandten nach Makedonien zu schicken, in der Hoffnung, eine geeignete Braut zu finden. Im Laufe der Wochen hattest du die ganze Angelegenheit ganz vergessen, hast hauptsächlich versucht, das Nörgeln deiner Großfamilie zu beruhigen, und warst eines Nachmittags ziemlich überrascht, als deine Berater dir mitteilen, dass nicht eine, sondern drei antipatridische Bräute nach Argos geschickt wurden ; Kassandros muss dich wirklich mögen! Sie warten in einer Villa darauf, Sie zu treffen, also spritzen Sie sich etwas Wasser ins Gesicht und gehen hinunter zu ihrer Unterkunft - Sie werden das Abendessen mit ihnen einnehmen. \n \n Sie sind sofort sprachlos, wenn Sie endlich in ihrer Gegenwart sind, deren Ironie Ihnen nicht entgeht; Wie komisch ist es, dass einem so großen Redner wie Ihnen, der es gewohnt ist, mitreißende Reden vor den Versammlungen zu halten, die Worte fehlen. Jede Frau ist überaus schön und außergewöhnlich intelligent, und das Gespräch dauert Stunden, bevor ihre Begleiter sie für den Abend entschuldigen. Sie werden allein auf Ihrer Couch zurückgelassen, dem Kopf schwirrt der Wein und die Aufregung Ihrer Möglichkeiten; das wird eine schwierige entscheidung."
  me_argos_1.a: "[potential_wife.GetName] ist das für mich"
  me_argos_1.b: "Ich werde [potential_wife_2.GetName] als meine Frau wählen"
  me_argos_1.c: "[potential_wife_3.GetName] ist die beste Wahl"
  me_argos_2_title: "Heiratsangebot von Argos"
  me_argos_2_desc: "Wir haben einen merkwürdigen Vorschlag von Argos erhalten, einem der vielen Stadtstaaten in Griechenland, für die wir persönlich verbürgt sind. Offenbar hat ihr Archon, ein ehrgeiziger junger Bursche, von dem ihr schon viel gehört habt, demütig darum gebeten, dass wir ihm eine königliche Braut schicken. Er stamme aus gutem Hause, wird dir gesagt, und diese Geste würde sicherlich deinen Ruf in Argos festigen. Und obwohl es in unserer Familie sicherlich eine Reihe unverheirateter Frauen gibt, wollen wir den Argivern ein solches Geschenk machen? Sind sie wirklich würdig?"
  me_argos_2.a: "Großartige Idee!"
  me_argos_2.b: "Keine Chance!"
  me_argos_3_title: "Eheangelegenheiten"
  me_argos_3_desc_1: "Unsere Botschaft in Argos ist mit einem bemerkenswerten Unterschied nach Pella zurückgekehrt; während drei schöne Mädchen auf Booten nach Argos abfuhren, sind nur zwei zurückgekehrt. Es scheint, dass der Anführer der Argosier von Eurer Großzügigkeit überwältigt war und es erst nach vielen Diskussionen geschafft hat, eine Frau auszuwählen. Wie Sie hören, war die Hochzeitsfeier jedoch eine für die Ewigkeit, und Ihr Freund in Argos ist sicherlich mit Ihnen zufrieden."
  me_argos_3_desc_2: "Die Botschaft, die wir nach Argos geschickt haben, kehrt mit frustrierenden Neuigkeiten zurück, und jetzt stehen drei Frauen Ihrer Familie vor Ihnen, die Gesichter sind rot vom Weinen und fordern Rache. Es scheint, dass nach all dieser Diskussion über die Entsendung einer Braut nach Argos die Verhandlungen in letzter Minute gescheitert sind, und jetzt haben Sie drei verlegene Frauen, die Sie ausschimpfen. Bei allem, was im Moment vor sich geht, ist das sicherlich eine Ablenkung, aber Sie sind nicht glücklich – überhaupt nicht glücklich. Du schickst deine Verwandten mit vagen Versprechungen weg und erinnerst dich daran, dich später um die Argoser zu kümmern."
  me_argos_3.a: "Wir freuen uns über dieses Ergebnis. Senden Sie unser Bestes an das Brautpaar"
  me_argos_3.b: "Lächerlich! Sie wagen es, uns die Ehre einer antipatridischen Braut zu verweigern? Narren"
  me_argos_3_tt: "Sie ist jetzt verheiratet mit [ROOT.GetCountry.GetRuler.GetName]"
  me_argos_4_title: "$argos_missions_01_greece_task_1$"
  me_argos_4_desc: "Wir haben die Argolis mit vielen Städten geteilt, eine Situation, die einst akzeptabel war, aber unser vorhergesagtes Wachstum wurde von unseren Nachbarn behindert. Es gibt nicht genug Ressourcen, um herumzukommen, also wäre es am besten, sie direkt zu nehmen, damit niemand unsere Vormachtstellung in Frage stellt."
  me_argos_4.a: "Bereiten Sie unsere Forderungen vor"
  me_argos_4_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_1$#!'$mission_completed_tooltip_2$!"
  me_argos_5_title: "$argos_missions_01_greece_task_3$"
  me_argos_5_desc: "Um die Schifffahrtsrouten im Sinus Argolicus zu sichern, waren wir gezwungen, alle benachbarten Stadtstaaten zu erobern, die Boote auf ihre Gewässer schicken. Jetzt, wo es uns gelungen ist, unsere Rivalen auszumerzen, können unsere Flotten unbehelligt über die Meere segeln. Tag für Tag wächst die Macht von Argos und unsere Feinde verkümmern vor unseren Armeen."
  me_argos_5.a: "Ein Hoch auf Argos!"
  me_argos_5_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_3$#!'$mission_completed_tooltip_2$!"
  me_argos_6_title: "$argos_missions_01_greece_task_4$"
  me_argos_6_desc: "Unsere landwirtschaftliche Siedlung in Thyrea wurde fertiggestellt und die Fischmärkte von Argos sind bereits mit Poseidons Gaben gefüllt. Das Fischangebot ist so reichlich, dass die Preise durch den Boden gefallen sind, was Ihren Bürgern große Freude bereitet hat; Die breiten Alleen von Argos sind zu jeder Tages- und Nachtzeit von den verlockenden Gerüchen gegrillter Sardinen erfüllt. Ja, eigentlich ... das klingt nach dem, was wir uns heute zum Mittagessen wünschen."
  me_argos_6.a: "Heute ist ein guter Tag"
  me_argos_6_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_4$#!'$mission_completed_tooltip_2$!"
  me_argos_7_title: "$argos_missions_01_greece_task_5$"
  me_argos_7_desc: "Während Ihre Boten die Nachricht laut vorlesen, die Sie für Sparta vorbereitet haben, ertönt überall in Ihrem Hof lautes Kichern, unterbrochen von gelegentlichem Schnauben. Auch wenn Sie die Liste der Beleidigungen persönlich zusammengestellt haben, lachen Sie immer noch schallend, wenn Sie den Estrich laut hören – Sie haben definitiv ein Händchen für Worte. In Lakonien wird es brennende Ohren geben, wenn diese Beleidigungen zu hören sind, aber Sie sagen die Wahrheit!"
  me_argos_7.a: "Die Spartaner werden wütend sein, wenn sie das hören – gut!"
  me_argos_7_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_5$#!'$mission_completed_tooltip_2$!"
  
  me_argos_8_title: "$argos_missions_01_greece_task_6$"
  me_argos_8_desc: "Nun, es scheint, als hätte Ihre Botschaft an Sparta die beabsichtigte Wirkung erzielt. Ihr Gesandter kehrte mit Berichten über deren glühende Empörung zurück und behauptete, die Spartaner hätten beinahe gegen alle diplomatischen Gepflogenheiten verstoßen, indem sie Ihren Boten hinrichteten! Es wird nicht lange dauern, bis ihre Heere nach Argos marschieren, in der Hoffnung, Ihre spöttische Zunge zu zügeln. Wenn Ihr sie zu einem Krieg provozieren wolltet, scheint es, als hättet Ihr Erfolg gehabt!"
  me_argos_8.a: "Wir werden ihren Streitkräften im Kampf begegnen und sie besiegen!"
  me_argos_8_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_6$#!'$mission_completed_tooltip_2$!"
  
  me_argos_9_title: "$argos_missions_01_greece_task_7$"
  me_argos_9_desc: "Der Kampf zwischen Argos und Sparta ist zu Ende gegangen, wobei sich Letzteres als völlig untauglich erwiesen hat. Schon ziehen unsere Truppen durch die Straßen von Lakonien, während die sogenannte Macht der spartanischen Armee vor Ihren Augen zerschlagen wurde. Es gibt keinen Widerstand mehr; hättet Ihr nur gewusst, wie schwach Sparta in Wahrheit war, hättet Ihr es schon längst erobert."
  me_argos_9.a: "Versendet Proklamationen in ganz Griechenland, die verkünden, dass Sparta an Argos gefallen ist"
  me_argos_9_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_7$#!'$mission_completed_tooltip_2$!"
  
  me_argos_10_title: "$argos_missions_01_greece_task_8$"
  me_argos_10_desc: "Die Herrschaft von Argos dehnt sich weiter aus, und die wohlhabende Provinz Arkadien liegt nun fest in unserer Hand. Die Liste der Städte, die unter unserer Kontrolle stehen, ist wahrlich beeindruckend: Stymphalos, Thyreai, Mantineia, Epidauros und Megalopolis haben alle einen neuen Herrscher – ein Vorbote für die guten Zeiten, die vor uns liegen."
  me_argos_10.a: "Argos hat eine glänzende Zukunft vor sich"
  me_argos_10_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_8$#!'$mission_completed_tooltip_2$!"
  
  me_argos_11_title: "$argos_missions_01_greece_task_9$"
  me_argos_11_desc: "Unsere Berater haben Sie unter vier Augen sanft zurechtgewiesen und darauf hingewiesen, dass Sie sich offenbar nur darauf versteifen, anderen ihr Land wegzunehmen, anstatt das zu verbessern, was Ihnen bereits gehört. Argos wächst rasant, doch wenn man unsere Hauptstadt betrachtet, würde man niemals vermuten, dass sie das Herzstück eines aufstrebenden Reiches ist. Ihr habt euch den Rat eurer Berater zu Herzen genommen, die Staatskasse öffnen lassen und eure Architekten auf die Straßen von Argos geschickt, um die Wohn- und Geschäftsviertel zu erweitern. Nun sind sie fertig und haben euch eingeladen, euch ihr Werk anzusehen. Ihr seid sicherlich zufrieden mit dem, was sie geleistet haben, aber ihr glaubt, dass irgendwann noch mehr möglich sein wird. Dennoch feiern wir die Erweiterung unserer Stadt, während wir von noch besseren Tagen träumen."
  me_argos_11.a: "Argos blüht auf, dank unserer Führung"
  me_argos_11_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_9$#!'$mission_completed_tooltip_2$!"
 
  me_argos_12_title: "$argos_missions_01_greece_task_10$"
  me_argos_12_desc: "Argos, unsere Hauptstadt, hat sich zu einer der größten Städte auf dem Peloponnes entwickelt – ein Beweis für unseren Aufstieg zur führenden Macht in der Region. Praktisch jeden Tag entstehen in der Stadt neue Gebäude, und die Straßen sind voller Händler, die Waren aus der gesamten zivilisierten Welt anbieten. Liebeskranke Dichter haben zahlreiche Oden verfasst, in denen sie die Schönheit unserer Hauptstadt preisen, die sich im Vergleich zu allen anderen Städten Griechenlands wahrhaftig abhebt – euch liegt besonders das Epos „Eine Stadt wie keine andere“ am Herzen, und die Straßen sind übersät mit Graffiti, die Zeilen aus diesem und anderen gefeierten Werken zitieren. Wir sind wirklich stolz darauf, was aus Argos wird: ein Zentrum der Kultur und Zivilisation."
  me_argos_12.a: "Unsere Stadt ist eine richtige Hauptstadt, die unsere Vormachtstellung widerspiegelt"
  me_argos_12_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_10$#!'$mission_completed_tooltip_2$!"

  me_argos_13_title: "$argos_missions_01_greece_task_11$"
  me_argos_13_desc: "Wir sind stolz darauf, berichten zu können, dass sich die gesamte Argolis uns unterworfen hat. Nie wieder werden die unzähligen Städte, die die Ebene übersäen, untereinander streiten, in der Hoffnung, irgendwie eine vorübergehende Vorherrschaft über ihre Feinde zu erlangen, bevor sie einer weiteren Invasion erliegen; das Zeitalter von Argos ist angebrochen, in dem wir unsere Brüder in Ruhm voranführen. Die Bewohner unserer Länder freuen sich über den Frieden, den wir gesichert haben, und sind bereit, uns immer weiter voranzubringen."
  me_argos_13.a: "Argos marschiert weiter!"
  me_argos_13_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_11$#!'$mission_completed_tooltip_2$!"
  me_argos_14_title: "$argos_missions_01_greece_task_12$"
  me_argos_14_desc: "Unser Krieg gegen Sparta rückt immer weiter in die Vergangenheit, und während einige noch immer an ihren Groll festhalten, möchte die überwiegende Mehrheit der besiegten Spartaner einfach nur ihr Leben weiterleben. Um diesen Prozess zu erleichtern, haben wir den Wiederaufbau Spartas selbst finanziert: Wir reparieren die zerstörten Mauern, räumen die Straßen von Trümmern frei und sanieren die ausgebrannten Gebäude, die von unserer Belagerung übrig geblieben sind. Anstatt im lokalen Stil zu bauen, haben wir Sparta mit argivischer Architektur veredelt, um die Lakonier daran zu erinnern, wer ihre neuen Herren sind – manche bezeichnen die Stadt nun scherzhaft als „Spargos“, ein Wortwitz, der immer wieder für ein Schmunzeln sorgt."
  me_argos_14.a: "Unsere Großzügigkeit ist unbestritten"
  me_argos_14_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_12$#!'$mission_completed_tooltip_2$!"
  me_argos_15_title: "$argos_missions_01_greece_task_13$"
  me_argos_15_desc: "Unsere Herrschaft erstreckt sich über den gesamten Süden Griechenlands – ein untrügliches Zeichen dafür, dass unser Aufstieg unaufhaltsam ist. Wir haben Lakonien und Arkadien unterworfen und ihre Kräfte mit unseren vereint, doch damit sind wir noch nicht am Ziel; nein, wir stehen erst am Anfang. Argos, das sich niemals auf seinen Lorbeeren ausruht, wird seine Position festigen und den triumphalen Weg, den es selbst eingeschlagen hat, weiter beschreiten."
  me_argos_15.a: "Argos marschiert vorwärts!"
  me_argos_15_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_13$#!'$mission_completed_tooltip_2$!"
  me_argos_16_title: "$argos_missions_01_greece_task_14$"
  me_argos_16_desc: "Für [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ist es eine große persönliche Ehre, dass wir die Provinz Olympia erobert haben. Dies ist zweifellos ein enormer Prestigegewinn und ein Zeichen für die Gunst, die uns die Götter zuteilwerden lassen. Alle, die zu den Spielen kommen, werden das prächtige Spektakel genießen, das wir ihnen bieten werden, und der Name unserer Stadt wird weltweit in aller Munde sein."
  me_argos_16.a: "Wir nehmen diese Verantwortung demütig an"
  me_argos_16_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_14$#!'$mission_completed_tooltip_2$!"
  
  me_argos_17_title: "$argos_missions_01_greece_task_15$"
  me_argos_17_desc: "Wir haben eine Bitte der Priester des Olymp erhalten, die wir sorgfältig prüfen sollten; bitte, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], wäge ihr Angebot gründlich ab, bevor du voreilige Entscheidungen triffst. Wir sind uns bewusst, dass dies als Affront aufgefasst werden könnte, da sie ganz offensichtlich von den Vorteilen unseres Schutzes profitieren und unter unserer Führung wie nie zuvor florieren. Leider scheint es so, als ob zwar viele gute Eigenschaften der Argiver nachgeahmt werden, ihr Stolz jedoch offenbar nicht erloschen ist. Sie haben uns höflich gebeten, sie als Bundesgenossen zu entlassen, damit sie ihre einzigartige Identität in der weiten Welt bewahren und gleichzeitig die familiären Bindungen aufrechterhalten können, die wir aufgebaut haben. Diese Haltung, so kühn sie auch sein mag, wird auch von einigen Ihrer Berater geteilt, die befürchten, unzivilisiert zu wirken, und argumentieren, es sei am besten, wenn wir die Fassade der Herrschaft aufrechterhalten. \n\nObwohl die Bitte gewagt ist, habt Ihr ihr nach einiger Überlegung zugestimmt, da Ihr wisst, dass das Ansehen von Argos dadurch nicht geschädigt wird – Olympia ist zweifellos ein Sonderfall unter Euren Herrschaftsgebieten. Wenn überhaupt, wird unser Ansehen dadurch nur noch steigen."
  me_argos_17.a: "Wir sind nicht unvernünftig ... sagt ihnen, dass dieser Bitte entsprochen wird"
  me_argos_17_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_15$#!'$mission_completed_tooltip_2$!"

  me_argos_18_title: "$argos_missions_01_greece_task_16$"
  me_argos_18_desc: "Die Herrschaft von Argos ist jetzt auf dem gesamten Peloponnes anerkannt, da wir die vollständige Kontrolle über unsere natürlichen Grenzen übernommen und unsere Herrschaft auf Länder ausgedehnt haben, von deren Besitz wir nie geträumt haben. Wir treten in eine neue Ära des Wohlstands ein, was zum großen Teil auf die außergewöhnliche Führung von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] zurückzuführen ist. Zu welchen weiteren Höhen werden wir unter göttlich inspiriertem Befehl aufsteigen?"
  me_argos_18.a: "Argos ist die großartigste Stadt Griechenlands"
  me_argos_18_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_16$#!'$mission_completed_tooltip_2$!"
  me_argos_19_title: "$argos_missions_01_greece_task_17$"
  me_argos_19_desc: "Wir haben unsere besten Architekten beauftragt, den Akrokorinth, die imposante Festung, die die Landschaft von Korinth beherrscht, zu verstärken. Nachdem Ihr die endgültigen Entwürfe genehmigt habt, reist Ihr persönlich in die Stadt, um die Arbeiten zu beaufsichtigen und so Gewissheit zu erlangen. Korinth sichert, wie Ihr wisst, den Landzugang zum Peloponnes, wodurch der Akrokorinth zur ersten Verteidigungslinie gegen eine einfallende Armee wird und somit von größter Bedeutung ist. Ihr werdet niemals zulassen, dass eine fremde Armee eurem Land antut, was ihr anderen angetan habt. \n\n Die Arbeiten schreiten in zufriedenstellendem Tempo voran und sind nach einem Monat ununterbrochener Bautätigkeit abgeschlossen. Mit Blick auf die Zinnen fragt ihr euch, was ihr tun würdet, wenn ihr ein feindlicher Feldherr wärt; wie würdet ihr die Stadt einnehmen? Euer Blick wandert entlang der Mauern, auf der Suche nach Schwachstellen, und Ihr nickt anerkennend. Die Befestigungsanlagen sind, gelinde gesagt, einschüchternd; es gibt keine einfachen Möglichkeiten, die Stadt einzunehmen. „Wir segeln bei Tagesanbruch nach Argos“, sagst Ihr zu Euren Begleitern, was für reges Treiben sorgt. „Unsere Arbeit hier ist beendet.“"
  me_argos_19.a: "Argos ruht sicher und fürchtet niemanden"
  me_argos_19_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_17$#!'$mission_completed_tooltip_2$!"
  
  me_argos_20_title: "Unterstützung sammeln"
  me_argos_20_desc: "Ihr habt eine schwierige Entscheidung getroffen, eine, die euren Körper vor Aufregung zittern lässt, wenn Ihr die Tragweite wirklich bedenkt. Mit dem Versuch, die Herrschaft der Gerousia zu stürzen und durch Eure Herrschaft zu ersetzen, habt Ihr eine verhängnisvolle Entscheidung getroffen; jeder Fehltritt, jeder Fehler in Euren Plänen wird zu Eurer öffentlichen Hinrichtung als Staatsfeind führen. Die Kleingeistigen mögen sagen, dass das, was ich vorschlage, Hochverrat ist... Ich kann das nicht alleine tun; ich muss Unterstützung bei denen suchen, die so denken wie ich, um meinen Ansprüchen Legitimität zu verleihen."

  me_argos_20_desc_2: "[ROOT.GetCountry.GetRuler.GetName] schien in den letzten Tagen beschäftigt zu sein und weigerte sich, preiszugeben, was [ROOT.GetCountry.GetRuler.GetHerHis] beschäftigt. Trotz dieser kleinen Ablenkung, da gereizte Stimmungen bei [ROOT.GetCountry.GetRuler.GetFirstName] selten sind, geht das Leben in der Hauptstadt wie gewohnt weiter. Die endlosen Debatten in der Gerousia gehen weiter, die Straßen sind voller Kaufleute und Handwerker, und das einfache Volk geht seinen täglichen Geschäften nach. Die weniger Ehrgeizigen könnten sogar mit diesem Zustand zufrieden sein.\n\nDennoch würde es Aufmerksamkeit erregen, wenn sie den wahren Grund dafür wüssten, dass [ROOT.GetCountry.GetRuler.GetFirstName] ängstlich erscheint; Während wir hier sprechen, wurden geheime Abgesandte nach [target.GetName] geschickt, in der Hoffnung, Unterstützung für einen Regierungswechsel zu gewinnen. Auch jetzt geht unsere Gerüchtekampagne weiter..."
  me_argos_20_desc_3: "[ROOT.GetCountry.GetRuler.GetName] hat entschieden, dass die Unterstützung von [target.GetName] eine Voraussetzung für die Zukunft sein wird, da [ROOT.GetCountry.GetRuler.GetFirstName] nicht hoffen kann, auf [ROOT.GetCountry.GetRuler.GetHerHis] eigenen zwei Beinen zu stehen, wenn die Zeit der Rebellion nahe ist. Dennoch ist bekannt, dass [target.GetFirstName] eine treue Sorte ist, obwohl [target.GetHerHis]-Loyalität sicherlich erkauft werden könnte. Wie bei allem im Leben gibt es keine Versprechungen."
  me_argos_20_desc_4: "''Ist Ihnen bewusst, was Sie vorschlagen, [ROOT.GetCountry.GetRuler.GetFirstName]?'' [target.GetName] lehnt sich zurück auf eine Couch, ein heftiges Funkeln in [ROOT.GetCountry.GetRuler.GetHerHis] Augen. Die Stunde ist spät; Alle Haussklaven schlafen, bis auf den einen Diener, der schläfrig in der Tür steht. „Mach dir wegen Phaedo keine Sorgen; er ist taub.' [target.GetName] sagt sachlich. „Er wird nicht zum Gerousia rennen, um zu berichten, was du sagst.“ \n \n„Was sagst du dann, [target.GetFirstName]? Ihre Unterstützung wird für das, was kommen wird, von entscheidender Bedeutung sein.'"
  me_argos_20.a: "Es genügt eine kleine Summe"
  me_argos_20.b: "[target.GetName] wird mehr brauchen, um überzeugt zu werden"

  me_argos_21_title: "Antwort von [target.GetName]"
  me_argos_21_desc_success: "Ihr habt einen vertrauenswürdigen Berater zu [target.GetName] geschickt und ihn gebeten, euren Versuch, die Gerousia zu stürzen und euch selbst als Basileus zu einsetzen, heimlich zu unterstützen. Ihr müsst zugeben, dass ihr überrascht seid, als [target.GetFirstName] eines Abends persönlich bei euch zu Hause auftaucht, das Gesicht unter den Falten seiner langen Tunika verborgen. „Verzeiht mir den unerwarteten Besuch“, flüstert [target.GetFirstName] und tritt näher an euch heran, „Aber ich wage es nicht, jemand anderem eine so heikle Bitte anzuvertrauen. Ich wollte euch persönlich sagen, dass ihr auf uns zählen könnt, wenn die Zeit gekommen ist.“"
  me_argos_21_desc_failed: "Ihr habt die Antwort von [target.GetName] erhalten, einen Brief voller Beleidigungen und offener Verhöhnung … und einer Drohung! „Wenn ihr diesen rebellischen Weg weitergeht, werden wir den Behörden mitteilen, dass ihr eine Verschwörung plant – gebt eure Torheit auf und denkt daran, wo euer Platz ist.“ Ihr zerknüllt das Pergament zu einem Knäuel, spottet höhnisch und werft es auf den Boden. Merkt Euch [target.GetName] und tragt seine Familie in die Proskritptionsliste ein; wenn die Zeit gekommen ist, werdet Ihr seine feige Untätigkeit nicht vergessen."
  me_argos_21.a: "[target.GetName] wird sich uns anschließen!"
  me_argos_21.b: "[target.GetName] hat den Beitritt abgelehnt!"
  
  me_argos_22_title: "Eine neue Regierung"
  me_argos_22_desc: "Alle Vorbereitungen sind getroffen; ihr habt vertrauenswürdige Männer in sicheren Positionen, eure im ganzen Reich stationierten Truppen sind heimlich bewaffnet, und euer Spionagenetzwerk berichtet euch täglich über die Schritte eurer Gegner. Aus irgendeinem Grund hat die Gerousia noch nicht mitbekommen, was ihr vorhabt; wenn ihr zuschlagt, wird euch der Überraschungseffekt zugutekommen. Jetzt gibt es kein Zurück mehr! Vorwärts – für Ruhm oder Tod!"
  me_argos_22.a: "Zeit zu kämpfen!"
 
  me_argos_23_title: "Ein neuer Weg nach vorne"
  me_argos_23_desc: "‚Edle Mitglieder der Gerousia, ich trete heute aus der Not vor euch, denn diese schwierigen Zeiten haben mich gezwungen, zu handeln.' [ROOT.GetCountry.GetRuler.GetName] lässt [ROOT.GetCountry.GetRuler.GetHerHis]en Blick über die versammelte Versammlung schweifen; im ganzen Saal herrscht Stille, jeder hängt an seinen Lippen. \n\n„Was in der Vergangenheit für Argos erfolgreich war, hilft uns jetzt offensichtlich nicht weiter. Ich, [ROOT.GetCountry.GetRuler.GetFirstName],  stehe mit einer kühnen Vision vor euch; ich bin hier, um einen neuen Weg in die Zukunft vorzuschlagen...'. \n\nEine neue Charakterinteraktion, 'Unterstützung sammeln', ist jetzt verfügbar."
  me_argos_23.a: "Die Zeit zum Handeln ist gekommen!"
  me_argos_23.b: "Wir werden uns jetzt Zeit lassen ..."
  me_argos_23_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_18$#!'$mission_completed_tooltip_2$!"

  me_argos_24_title: "Öffentliche Unterstützung"
  me_argos_24_desc: "Diese letzten paar Wochen waren furchtbar nervenaufreibend, da [ROOT.GetCountry.GetRuler.GetName] davon überzeugt war, dass die gesamte Verschwörung aufgedeckt werden würde, und doch wurden diese Befürchtungen nie realisiert; Irgendwie ist sich die Gerousia glücklicherweise ahnungslos, dass die Tage ihrer Herrschaft fast vorbei sind. Vielleicht ist das ein Zeichen dafür, dass die Götter den Plan befürworten? \n \n[ROOT.GetCountry.GetRuler.GetFirstName] hat es irgendwie geschafft, genug Unterstützung für eine Rebellion zu sammeln, ohne die Behörden zu alarmieren, und jetzt müssen nur noch ein paar Vorbereitungen getroffen werden. Der Übergang zur Monarchie wird nicht einfach sein, aber wenn es einfach wäre, Ruhm zu erlangen, dann würde jeder danach streben."
  me_argos_24.a: "Der Tag der Abrechnung steht kurz bevor"
  me_argos_24_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_19$#!'$mission_completed_tooltip_2$!"

  me_argos_25_title: "$argos_missions_01_greece_task_21$" 
  me_argos_25_desc: "Kythera war ein wichtiger Handelsstützpunkt im maritimen Netzwerk der minoischen Zivilisation, das sich über die bronzezeitliche Ägäis erstreckte. Unter dem späteren Einfluss der mykenischen Kultur blieb die Insel ein wichtiges Bindeglied im Mittelmeerhandel. In der archaischen Zeit zog Kytheras strategische Lage und sein Reichtum die Aufmerksamkeit größerer Mächte auf sich. Obwohl wir die Insel einst besaßen, fiel Kythera im frühen 6. Jahrhundert v. Chr. an die Spartaner. Seit Generationen wird sie von einem Kytherodikes (Richter auf Kythera) regiert, der unter spartanischer Herrschaft ein einzigartiges Maß an Autonomie genießt. Mit seinen Küstengewässern, die reich an Murex-Schnecken sind, war Kythera einst ein wichtiger Standort für die Herstellung von Tyrianpurpur, dem begehrten Farbstoff der Könige. Die Athener eroberten Kythera während des Peloponnesischen Krieges wiederholt und nutzten seine Häfen, um die peloponnesische Küste zu überfallen und die Seewege zu schützen.\n\nUnsere Agenten halfen den Kytheranern, die Spartaner von ihrer Insel zu vertreiben, und haben einen gefügigen Kytherodikes eingesetzt, der unsere Interessen vertritt. Mit der Rückeroberung von Kythera haben wir auch einen Teil unseres verlorenen Stolzes zurückgewonnen..."
  me_argos_25_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_21$#!' $mission_completed_tooltip_2$!"

  me_argos_25.a: "Eine höchst glückliche Entwicklung"
  me_argos_26_title: "$argos_missions_01_greece_task_22$"
  me_argos_26_desc: "Mit seinen an Murex-Schnecken reichen Küstengewässern war Kythera einst ein wichtiger Standort für die Herstellung tyrischen Purpurs, des geschätzten Farbstoffs der Könige.\n\nTyrisches Purpur, der legendäre Farbstoff, der von Königen und Eliten im gesamten Mittelmeerraum geschätzt wurde, musste mühsam aus Murex- und Purpura-Meeresschnecken gewonnen werden. Arbeiter stellten 'Tyrisches Purpur' her, indem sie die Murex-Schnecken regelmäßig mit einem Stab stachen, wodurch diese einen Film absonderten, der dann in Bottichen gesammelt wurde. Schätzungen zufolge waren die Sekrete von zwölftausend Schnecken erforderlich, um das Futter eines Kleidungsstücks zu färben. Für die Färbung einer ganzen Toga waren eine Viertelmillion Schnecken notwendig. Aus diesem Grund konnten es sich nur die Allerreichsten leisten, und die Farbe Purpur wurde mit dem Königtum in Verbindung gebracht. Der Herstellungsprozess von Purpur war zu dieser Zeit ein Geschäftsgeheimnis, was möglicherweise den Ursprung des Namens Phönizien (Land des Purpurs) erklärt. Der häufigste Purpurton wurde Tyrischer Purpur genannt, benannt nach Tyros, der bedeutendsten phönizischen Stadt. Unmengen von weggeworfenen Muscheln zeugen von der jahrhundertelangen Produktion dieser begehrten königlichen Farbe für den Export. Der Prozess ist arbeitsintensiv und erfordert selbst für eine kleine Menge Farbstoff Tausende von Schnecken. Nach der Gewinnung werden die Drüsen zerkleinert und fermentiert, wobei das entstandene Pigment dem Sonnenlicht ausgesetzt wird, um seinen leuchtenden, lang anhaltenden Purpurton zu erzielen."
 me_argos_26.a: "[ROOT.GetCountry.GetCapital.GetName] stinkt nach verrottender Schnecke..."
 me_argos_26_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_22$#!' $mission_completed_tooltip_2$!"

 me_argos_27_title: "$argos_missions_01_greece_task_23$" 
 me_argos_27_desc: "Im Jahr 315 startete #E Apollonides#! einen erfolglosen Feldzug in Arkadien und eroberte Stymphalos in einem nächtlichen Angriff. Sein Feldzug wurde jedoch abgebrochen, als er herausfand, dass eine Fraktion der Argiver plante, ihre Stadt an Polyperchons Sohn Alexander zu übergeben. Nun ist die Stadt erneut der Macht der Argiver zum Opfer gefallen!\n\nDer Überlieferung zufolge tötete Herakles die Stymphalischen Vögel in den Sümpfen nahe der Stadt als sechste seiner zwölf Aufgaben. Diese menschenfressenden Kreaturen sollen bronzerne Schnäbel und scharfe metallische Federn gehabt haben. Diejenigen, die entkommen konnten, flohen auf die Insel Aretias im Euxinischen Meer. Eine andere Version, in späteren Quellen überliefert, besagt, dass es sich bei den 'Vögeln' in Wirklichkeit um Frauen handelte, die Töchter des Königs Stymphalos und der Ornis, die von Herakles getötet wurden, weil sie ihm die Gastfreundschaft verweigert hatten. Die Stadt selbst entwickelte sich zu einer befestigten Polis mit klarer Stadtplanung, die im vierten Jahrhundert v. Chr. auf einem orthogonalen Raster angelegt wurde. Ihre Akropolis und ihre 2,3 Kilometer lange Stadtmauer, die etwa 40 Hektar umschließt, zeugen von ihrem urbanen Anspruch. Dorische Tempel, darunter einer, der möglicherweise Athena Polias gewidmet war, standen innerhalb ihrer Grenzen, aber die brauronische Artemis war die Schutzgöttin der Stadt, die auf ihren Münzen abgebildet war und über ihre öffentlichen Verordnungen wachte. Stymphalos war Mitglied der Arkadischen Konföderation." 
 me_argos_27_tt: "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_23$#!' $mission_completed_tooltip_2$!" 
 me_argos_27.a: "Von nun an wird Stymphalos autonom sein." 
 me_argos_27.at: "#E Stymphalos#! wird ein #Y Bundesgenosse#! von #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#!" 
 me_argos_27.b: "Wir werden in Stymphalos eine Kleruchie errichten."
 me_argos_27.bt: "#E Stymphalos#! wird zu einer #Y Kolonie#! von #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#!" 
 me_argos_27.c: "Stymphalos bedarf keiner Autonomie." 

