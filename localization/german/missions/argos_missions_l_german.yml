l_german:
  #wip 
  argos_missions_01_greece: "Die Stadt Argos" 
  argos_missions_01_greece_DESCRIPTION: "Argos, die alte und ehrwürdige Stadt, die die fruchtbare Ebene der Argoliden beherrscht, ist ideal gelegen, um die Kontrolle über ihre Nachbarn zu festigen. Mit dem Zugang zum Meer, ihren fruchtbaren Feldern, die von den vielen Flüssen der Argolis gut genährt werden, und dem zähen Geist ihrer Bewohner ist Argos bereit, ihren Namen in der Welt zu verkünden!"
  argos_missions_01_greece_CRITERIA_DESCRIPTION: "Diese Mission gilt als abgeschlossen, wenn wir die Kontrolle über den gesamten Peloponnes erlangt haben."
  argos_missions_01_greece_BUTTON_TOOLTIP: ""
  argos_missions_01_greece_task_1: "Die Stadt Argos"
  argos_missions_01_greece_task_1_DESC: "Obwohl die Häfen von Argos ideal an der Mündung des Sinus Argolicus liegen, sind wir nicht die einzige Hafenstadt, die Händler aus fernen Ländern anzieht. Wir haben viele Jahre in einem unruhigen Zusammenleben mit unseren Nachbarn gelebt, aber vielleicht ist es an der Zeit, unsere wirtschaftlichen Rivalen in der Region auszuschalten. \n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
  argos_missions_01_greece_task_2: "Eine makedonische Heirat"
  argos_missions_01_greece_task_2_DESC: "Wir sollten eine passende Braut für unseren Archon finden, die seine Stellung als führender Mann unserer Stadt widerspiegelt. Keine einfache Anordnung reicht aus; wir brauchen eine königliche Braut. Lasst uns Boten zu unseren Freunden in Makedonien schicken und unsere Bitte vorbringen. \n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
  argos_missions_01_greece_task_3: "Konsolidierung der Argolis"
  argos_missions_01_greece_task_3_DESC: "Da wir uns in den Ebenen der Argolis befinden, sollten wir unsere natürlichen Grenzen auf die gesamte Region ausdehnen. Es wird ein Segen für unser Glück sein, wenn wir in der Lage sind, hier die Kontrolle zu erlangen. \n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
  argos_missions_01_greece_task_4: "Argivische Infrastruktur"
  argos_missions_01_greece_task_4_DESC: "Während unsere geschäftigen Häfen unsere Bäuche mit Getreide gefüllt halten, gibt es keinen Grund, warum wir nicht so autark wie möglich sein sollten. Lasst uns in das Ackerland von Thyrea investieren und unsere Besitztümer in Epidauros vergrößern, da wir davon stark profitieren werden. \n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
  argos_missions_01_greece_task_5: "Die Spartaner beleidigen"
  argos_missions_01_greece_task_5_DESC: "Die Spartaner, eure lästigen Nachbarn im Süden, scheinen durch unseren Aufstieg bedroht und verbreiten Unwahrheiten über uns in ganz Griechenland. Seltsam, dass solch berühmte Kämpfer auf Flüstern statt Waffen zurückgreifen würden, aber zwei können das Spiel der Diplomatie spielen; wir sollten ihre Leute wissen lassen, was wir wirklich für sie empfinden. \n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
  argos_missions_01_greece_task_6: "Ein ehrenhafter Krieg"
  argos_missions_01_greece_task_6_DESC: "Die Zeit der Worte ist zu Ende, und nur der Sieg auf dem Schlachtfeld wird unsere Beschwerden lösen. Schicke deine Männer los, o Argos, und zerschmettere ein für alle Mal den Mythos der spartanischen Vorherrschaft! \n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
  argos_missions_01_greece_task_7: "Das Ende Spartas"
  argos_missions_01_greece_task_7_DESC: "Wir haben unsere alten Rivalen im Süden besiegt und das Machtgleichgewicht in Griechenland für immer erschüttert. Alle, die von unserer Dominanz hören, werden zweifellos von unserer Kampfkraft beeindruckt sein, und die spartanischen Heloten umarmen ihre Befreier. \n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
  argos_missions_01_greece_task_8: "Arkadien"
  argos_missions_01_greece_task_8_DESC: "Durch die Ausweitung unserer Herrschaft auf ganz Arkadien haben wir uns mehr als nur unseren angesehenen Ruf erworben; Ströme von Gold fließen durch deine Fingerspitzen. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
  argos_missions_01_greece_task_9: "Argos entwickeln"
  argos_missions_01_greece_task_9_DESC: "Argos selbst wächst, ein Beweis für Ihre geschickte Führung. Wir sollten eine umfassende Baukampagne durchführen, um sicherzustellen, dass unsere Bürger alle Einrichtungen haben, die sie sich wünschen. Indem sie sich um unsere Leute kümmern, werden sie sich um uns kümmern. \n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
  argos_missions_01_greece_task_10: "Eine glorreiche Stadt"
  argos_missions_01_greece_task_10_DESC: "Argos entwickelt sich zur herausragenden Stadt auf dem Peloponnes, nachdem sie ihre bescheidenen Anfänge als bloße Stadt der Argoliden vor langer Zeit überschritten hat. Jeden Tag kommen neue Reisende mit Schiffen an und verlassen das Land ihrer Vorfahren, um an unserer Seite ihre Zukunft aufzubauen. \n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
  argos_missions_01_greece_task_11: "Einbeziehung der Argoliden"
  argos_missions_01_greece_task_11_DESC: "Vor Jahren hielt unser Archon eine Rede und beschrieb die Zukunft, wie er sie sah; eine, in der Argos der unbestrittene Herr der Argolidenebene war. Wir freuen uns, Ihnen mitteilen zu können, dass dieser Traum heute Wirklichkeit geworden ist; der lang ersehnte Sieg ist da! \n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
  argos_missions_01_greece_task_12: "Sparta wieder aufbauen"
  argos_missions_01_greece_task_12_DESC: "Da sich die Stadt Sparta dem Joch von Argos unterworfen hat, haben wir nichts von unserer Schwesterstadt zu befürchten, die unsere Armeen vor kurzem zerstört haben. Im Gegenteil, wir sollten die Kriegsbeute in Sparta selbst reinvestieren und der Welt zeigen, dass wir in unserem Triumph großmütig sind. \n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
  argos_missions_01_greece_task_13: "Argivische Dominanz"
  argos_missions_01_greece_task_13_DESC: "Während der Fluss Inachus in den Sinus Argolicus mündet und den Golf mit seinen kaskadierenden Wassern füllt, strömen auch unsere Armeen über den Peloponnes, nehmen die Provinzen Lakonien und Arkadien ein und fügen sie unserem Besitz hinzu. \n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
  argos_missions_01_greece_task_14: "Olympia sichern"
  argos_missions_01_greece_task_14_DESC: "Wir haben Pläne für die Eroberung von Olympia; Wir werden die Länder befestigen und ihre Städte verschönern, damit alle, die die Spiele besuchen, von der unbestreitbaren Macht von Argos beeindruckt sind. Wahrlich, Olympia soll den besten Hausmeister haben, den sie sich nur vorstellen kann. \n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
  argos_missions_01_greece_task_15: "Priester des Olymp"
  argos_missions_01_greece_task_15_DESC: "Einige Berater sagen, dass es rüpelhaft erscheint, dass wir Olympia direkt in unser Land aufgenommen haben, und behaupten, dass wir uns nicht von streitsüchtigen Barbaren unterscheiden, die versuchen, ihren Besitz zu vergrößern. Indem wir Olympia als unseren Feudalherrn freigeben, können wir die Illusion aufrechterhalten, dass wir nicht die Fäden der Marionette ziehen und die Götter uns vielleicht belohnen werden. \n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
  argos_missions_01_greece_task_16: "Peloponnesische Dominanz"
  argos_missions_01_greece_task_16_DESC: "Achaea war einer der letzten Überbleibsel, aber das Wachstum von Argos kann nicht von denen gestoppt werden, die etwas anderes wünschen. Durch die Unterwerfung unserer nördlichen Nachbarn haben wir viel gelernt, Lektionen, die auf unser gesamtes Reich angewendet werden können. \n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
  argos_missions_01_greece_task_17: "Befestige Korinth"
  argos_missions_01_greece_task_17_DESC: "Korinth ist das Tor zum Peloponnes; buchstäblich die Haustür zu unseren Besitzungen in Griechenland, mit unbestreitbarem strategischem Wert. Indem wir die Festungsmauern von Korinth verstärken, stärken wir unsere Verteidigung und stellen sicher, dass unsere Feinde nicht einfach in unser Territorium einmarschieren können. \n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
  argos_missions_01_greece_task_18: "Eine neue Verwaltung"
  argos_missions_01_greece_task_18_DESC: "Während Argos eine republikanische Tradition hat, die von ergrauten Senatoren gefeiert wird, die an ihren Privilegien festhalten, behindert die inhärente Dysfunktion der Demokratie unsere Ambitionen. Unsere Regierung würde sicherlich schlanker vorgehen, wenn wir diese lästigen Traditionen einfach umgehen könnten. Wir sollten Verbündete suchen, die unsere Ansichten teilen... \n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
  argos_missions_01_greece_task_19: "Unterstützung sammeln"
  argos_missions_01_greece_task_19_DESC: "Unser Archon war in letzter Zeit damit beschäftigt, das Wasser für eine Revolution zu testen. Einige Adelsfamilien haben unsere Angebote rundweg abgelehnt, aber zum Glück haben sie Sie nicht öffentlich beschuldigt, versucht zu haben, den Staat zu zerstören. Und obwohl es einige gibt, die mit dem Status quo zufrieden sind, zeigen viele mehr Interesse an dem, was Sie versprechen. Die Zeit rückt immer näher. \n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 
  argos_missions_01_greece_task_20: "Übernahme"
  argos_missions_01_greece_task_20_DESC: "Es wird nie einen besseren Zeitpunkt als den jetzigen geben, um den von Ihnen gewählten Kurs zu beginnen. Monate sorgfältiger Planung sind endlich abgeschlossen und Ihre Unterstützer warten auf die Nachricht. Sie erwarten, dass es Widerstand geben wird, aber Sie werden nicht zulassen, dass ein möglicher Bürgerkrieg Ihren Ambitionen im Wege steht, oder? \n\n\n\n\n\n\n\n\n\n\n@greek_mil5!"

 argos_missions_01_greece_task_21: "Kythera zurückerobern"  
 argos_missions_01_greece_task_21_DESC: "Kythera war ein wichtiger Handelsstützpunkt im maritimen Netzwerk der minoischen Zivilisation, das sich über die bronzezeitliche Ägäis erstreckte. Unter dem späteren Einfluss der mykenischen Kultur blieb die Insel ein wichtiges Bindeglied im Mittelmeerhandel. In der archaischen Zeit zog Kytheras strategische Lage und sein Reichtum die Aufmerksamkeit größerer Mächte auf sich. Obwohl wir die Insel einst besaßen, fiel Kythera im frühen 6. Jahrhundert v.Chr. an die Spartaner. Seit Generationen wird sie von einem Kytherodikes (Richter auf Kythera) regiert, der unter spartanischer Herrschaft ein einzigartiges Maß an Autonomie genießt. Mit seinen an Murex-Schnecken reichen Küstengewässern war Kythera einst ein wichtiger Standort für die Herstellung des tyrischen Purpurs, des geschätzten Farbstoffs der Könige. Die Athener eroberten Kythera während des Peloponnesischen Krieges wiederholt und nutzten seine Häfen, um die peloponnesische Küste zu überfallen und die Seewege zu schützen.\n\nWenn wir Kythera zurückerobern können, können wir vielleicht auch einen Teil unseres verlorenen Stolzes zurückgewinnen...\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 argos_missions_01_greece_task_21_start_tt: "#Y Argivische#! Agenten werden auf eine Mission entsandt, nach [GetProvince('(int32)471').GetName"
 argos_missions_01_greece_task_21_finish_tt: "[GetProvince('(int32)471').GetName] wird ein argivischer #Y Untertan#!"

 argos_missions_01_greece_task_22: "Tyrianisches Purpur"
 argos_missions_01_greece_task_22_DESC: "Mit seinen an Murex-Schnecken reichen Küstengewässern war Kythera einst ein wichtiger Standort für die Herstellung des tyrischen Purpurs, des geschätzten Farbstoffs der Könige.\n\nTyrisches Purpur, der legendäre Farbstoff, der von Königen und Eliten im gesamten Mittelmeerraum geschätzt wurde, musste mühsam aus Murex- und Purpura-Meeresschnecken gewonnen werden. Arbeiter stellten 'Tyrisches Purpur' her, indem sie die Murex-Schnecken regelmäßig mit einem Stab stachen, wodurch diese einen Film absonderten, der dann in Bottichen gesammelt wurde. Schätzungen zufolge waren die Sekrete von zwölftausend Schnecken erforderlich, um das Futter eines Kleidungsstücks zu färben. Für die Färbung einer ganzen Toga waren eine Viertelmillion Schnecken notwendig. Aus diesem Grund konnten es sich nur die Allerreichsten leisten, und die Farbe Purpur wurde mit dem Königtum in Verbindung gebracht. Der Herstellungsprozess von Purpur war zu dieser Zeit ein Geschäftsgeheimnis, was möglicherweise den Ursprung des Namens Phönizien (Land des Purpurs) erklärt. Der häufigste Purpurton wurde Tyrischer Purpur genannt, benannt nach Tyros, der bedeutendsten phönizischen Stadt. Unmengen von weggeworfenen Muscheln zeugen von der jahrhundertelangen Produktion dieser begehrten königlichen Farbe für den Export. Der Prozess ist arbeitsintensiv und erfordert selbst für eine kleine Menge Farbstoff Tausende von Schnecken. Nach der Gewinnung werden die Drüsen zerkleinert und fermentiert, wobei das entstandene Pigment dem Sonnenlicht ausgesetzt wird, um seinen leuchtenden, lang anhaltenden Purpurton zu erzielen.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 argos_missions_01_greece_task_23: "Stymphalische Klerarchie" 
 argos_missions_01_greece_task_23_DESC: "Im Jahr 315 startete #E Apollonides#! einen erfolglosen Feldzug in Arkadien und eroberte Stymphalos in einem nächtlichen Angriff. Sein Feldzug wurde jedoch abgebrochen, als er herausfand, dass eine Fraktion der Argiver plante, ihre Stadt an Polyperchons Sohn Alexander zu übergeben.\n\nDer Überlieferung zufolge tötete Herakles die Stymphalischen Vögel in den Sümpfen nahe der Stadt als sechste seiner zwölf Aufgaben. Diese menschenfressenden Kreaturen sollen bronzerne Schnäbel und scharfe metallische Federn gehabt haben. Diejenigen, die entkommen konnten, flohen auf die Insel Aretias im Euxinischen Meer. Eine andere Version, die in späteren Quellen überliefert ist, besagt, dass es sich bei den 'Vögeln' in Wirklichkeit um Frauen handelte, die Töchter des Königs Stymphalos und der Ornis, die von Herakles getötet wurden, weil sie ihm die Gastfreundschaft verweigert hatten. Die Stadt selbst entwickelte sich zu einer befestigten Polis mit klarer Stadtplanung, die im vierten Jahrhundert v. Chr. auf einem orthogonalen Raster angelegt wurde. Ihre Akropolis und ihre 2,3 Kilometer lange Stadtmauer, die etwa 40 Hektar umschließt, zeugen von ihrem urbanen Anspruch. Dorische Tempel, darunter einer, der möglicherweise Athena Polias gewidmet war, standen innerhalb ihrer Grenzen, aber die brauronische Artemis war die Schutzgöttin der Stadt, die auf ihren Münzen abgebildet war und über ihre öffentlichen Verordnungen wachte. Stymphalos war Mitglied der Arkadischen Konföderation.\n\n\n\n\n\n\n\n\n\n\n@greek_mil5!" 
 argos_missions_01_greece_task_23_tt: "#E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#! kann #E Stymphalos# als #Y Bundesgenossen#! oder #Y Kolonie#! entlassen" 

   #Tooltips 
  argos_missions_01_greece_task_3_tooltip: "Gewinnen Sie Ansprüche auf die Provinz [GetProvince('(int32)440').GetArea.GetName|Y]"
  argos_missions_01_greece_task_6_tooltip: "Fordern Sie #Y Sparta#! heraus zu einem ehrenhaften Krieg an dem nur #Y argivische#! und #Y spartanische#! Kräfte teilnehmen."
  argos_missions_01_greece_task_18_tooltip: "Schalte eine Charakterinteraktion frei, die verwendet werden kann, um #Y Unterstützung zu sammeln#! für die kommende Revolution."
  argos_missions_01_greece_task_19_tooltip: "Mindestens 3 Charaktere haben den #Y Unterstützung gesammelt#! Modifikator."
  argos_missions_01_greece_task_20_A_tooltip: "Die gesamte Powerbase von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName|Y] und Charakteren mit dem #Y Support Gathered#! Modifikator ist mindestens #Y [SCOPE.ScriptValue('argos_total_character_powerbase_total')|0]#!. \n[SCOPE.GetRootScope.GetCountry.Custom('argos_gather_support_loc')]"
