l_german:
  armazic_missions:0 "Der Aufstieg der iberischen Könige" #Done 12.09.26 - 1.11.0.3 - Germanicus
  armazic_missions_DESCRIPTION:0 "Wenn man von den großen Hafenstädten des Mittelmeers aus segelt und den Wasserstraßen an Byzantion vorbei bis zum Pontus Euxinos folgt, erreicht man schließlich eine ferne Küste, an der sich eine kolossale Bergkette, der Kaukasus, erhebt, um die weite nördliche Steppe zu durchbrechen - diese unversöhnliches Land ist unser Zuhause. Wir haben hier unsere eigenen Traditionen, verehren die wahren Götter, die Außenstehenden unbekannt sind, und obwohl wir von Feinden umgeben sind, die uns gerne aus unseren Hochlandstädten vertreiben würden, ist es ihnen bisher nicht gelungen. \n\nAnstatt unseren Feinden die Möglichkeit zu geben, ihren üblen Absichten nachzukommen, müssen wir unser Schicksal fest in die Hand nehmen."
  armazic_missions_CRITERIA_DESCRIPTION:0 "Diese Mission ist erfüllt, wenn die Herrscher Iberiens ihre Nachbarn zurückdrängen und eine starke und sichere Nation errichten, die in der Lage ist, ihre Macht weit über unsere bergige Heimat hinaus auszuüben."
  armazic_missions_BUTTON_TOOLTIP:0 ""
  armazic_missions_BUTTON_DETAILS: ""

   #Missions
  armazic_missions_task_1:0 "Von Feinden umgeben"
  armazic_missions_task_1_DESC:0 "Wir sind von allen Seiten von Feinden umgeben; die grimmigen Armenier im Süden, das arrogante Kolchis im Westen und die wilden Albaner im Osten. Da unsere Militärberater keinen Konsens erzielen können, werden wir Ansprüche gegen alle unserer Nachbarn erheben. \n\n\n\n\n\n\n\n\n\n@greek_mil6!"
  armazic_missions_task_2:0 "Der Vorstoß an die Küsten"
  armazic_missions_task_2_DESC:0 "Unsere jüngsten Siege bringen die verlockende Aussicht auf noch größere Erfolge in den kommenden Tagen mit sich; wenn unsere Soldaten weiter vorrücken, werden wir nicht nur die Küsten des Mare Hyrcanum erreichen, sondern könnten sogar Zugang zu den Gewässern des Pontus Euxinus erlangen. \n\n\n\n\n\n\n\n\n\n@greek_mil18!"
  armazic_missions_task_3:0 "Land des Vlieses"
  armazic_missions_task_3_DESC:0 "Obwohl wir die Macht von [GetProvince('(int32)1715').GetArea.GetName] zerschmettert haben, gibt es immer noch Befürchtungen, dass sie wieder an Stärke gewinnen könnten. Es ist klar geworden, dass wir sie vollständig vernichten müssen, um zu verhindern, dass diese Möglichkeit jemals eintritt. \n\n\n\n\n\n\n\n\n\n@greek_mil14!"
  armazic_missions_task_4:0 "Albanische Reste"
  armazic_missions_task_4_DESC:0 "Unsere Truppen vernichten weiter die albanischen Stammesangehörigen; nun, da wir ihre Kerngebiete fest im Griff haben, wird es nicht mehr lange dauern, bis wir auch die letzten Reste ihres Königreichs verschlungen haben. \n\n\n\n\n\n\n\n\n\n@celt_mil6!"
  armazic_missions_task_5:0 "Unsere Füße nass bekommen"
  armazic_missions_task_5_DESC:0 "Obwohl wir neue machtvolle Akteure in der Region sind, wird unsere Präsenz im Pontus Euxinus bald allen bekannt sein – unsere Schiffbauinitiative wird unseren Einfluss weit über die Küsten unseres Heimatlandes hinaus erweitern! \n\n\n\n\n\n\n\n\n\n@greek_mil4!"
  armazic_missions_task_6:0 "Die Eristavi stärken"
  armazic_missions_task_6_DESC:0 "Die Eristavi waren eine in den Adelsstand erhobene Klasse lokaler Herrscher, deren Aufgaben denen eines Statthalters ähnelten, und denen die Pharnavaziden die Herrschaft über Provinzen in ihrem Namen anvertraut hatten. Bevor wir weitere Reformen durchführen können, müssen wir ihnen die entsprechende Befugnis erteilen. \n\n\n\n\n\n\n\n\n\n@celt_mil3"
  armazic_missions_task_7:0 "Eine einzigartige Sprache"
  armazic_missions_task_7_DESC:0 "Obwohl derzeit in unserem Heimatland eine große Anzahl von Sprachen gesprochen wird und eine gleiche Anzahl von Schriften von den Menschen verwendet wird, haben wir beschlossen, dass alle denselben Dialekt sprechen und auf dieselbe Weise schreiben müssen. \n\n\n\n\n\n\n\n\n\n@india_mil17!"
  armazic_missions_task_8:0 "Baiberdon"
  armazic_missions_task_8_DESC:0 "[GetProvince('(int32)1760').GetName], eine wichtige Stadt in Armenia Superioris, ist unverteidigt, ihre Mauern werden einzig durch den Ruf der armenischen Armee geschützt. Wenn wir jetzt unsere Ansprüche vorbereiten und schnell zuschlagen, glauben wir, dass die gesamte Provinz an unsere Soldaten fallen könnte. \n\n\n\n\n\n\n\n\n\n@greek_mil8!"
  armazic_missions_task_9:0 "Aus dem Lychnitis-See"
  armazic_missions_task_9_DESC:0 "Von der neu eroberten Stadt [GetProvince('(int32)1572').GetName] sind es nur wenige Tagesritte bis zur Hauptstadt der Armenier, und auch wenn sie unseren Truppen mit allen Mitteln Widerstand leisten werden, müssen wir das Herz ihres Königreichs treffen. \n\n\n\n\n\n\n\n\n\n@greek_mil15!"
  armazic_missions_task_10:0 "Armenische Befestigungen"
  armazic_missions_task_10_DESC:0 "Da wir so viele der großen Städte Armeniens erobert haben, verfügen wir nun über einen riesigen Wissensschatz, auf den wir vorher keinen Zugang hatten. Jeder weiß, dass die Armenier meisterhafte Festungen bauen,  warum lernen unsere eigenen Ingenieure also nicht, ihren Stil nachzuahmen? \n\n\n\n\n\n\n\n\n\n@greek_mil1!"
  armazic_missions_task_11:0 "Eine Linie von Königen"
  armazic_missions_task_11_DESC:0 "Aufgrund der von der Pharnavaziden-Dynastie eingeleiteten Reformen ist der Ruhm unseres Volkes für Generationen gesichert. Von unserer Festung in [GetProvince('(int32)1676').GetName] aus herrschen wir über ein weitläufiges Königreich, das wir mit unseren eigenen Händen aufgebaut haben. \n\n\n\n\n\n\n\n\n\n@greek_mil10!"
  armazic_missions_task_12:0 "Armazische Union"
  armazic_missions_task_12_DESC:0 "Zum ersten Mal in der Geschichte unseres Volkes wurden die Anhänger des armazischen Glaubens unter einer Krone vereint, wobei die Macht unserer benachbarten Feinde für eine Generation oder länger zerstört wurde. Möge Armazi weiterhin seinen Segen über uns ausschütten und uns zum Sieg führen! \n\n\n\n\n\n\n\n\n\n@greek_mil3!"
  armazic_missions_task_13:0 "Iberischer Wein"
  armazic_missions_task_13_DESC:0 "Unser Volk ist bekannt für seine Fertigkeiten in der Weinherstellung – ein Gewerbe, dem wir schon seit Jahrtausenden nachgehen. Sobald die Ernte eingebracht ist, füllen wir riesige Tongefäße, die wir in unserer Sprache „Kvevri“ nennen, und vergraben sie tief im Boden. Wer iberischen Wein trinkt, empfindet andere Jahrgänge oft als geschmacklich minderwertig. \n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 

 #Modifiers
 armazic_power:0 "Armazische Macht"
 armazic_power_desc:0 "Wir haben die Länder erobert, in denen der armazische Glaube praktiziert wird, und die Region zu einer mächtigen Macht vereint, in der die Armeen der Glaubenden die Städte voller wahrer Gläubiger verteidigen."

 #Events
  me_armazic_1_title:0 "$armazic_missions_task_1$#!"
  me_armazic_1_desc:0 "Auch wenn wir unsere Heimat von ganzem Herzen lieben und gerne unser Leben opfern würden, um unser Land zu verteidigen, müssen wir zugeben, dass unsere geografische Lage verbesserungswürdig ist; wir sind buchstäblich von allen Seiten von Feinden umgeben, eine Situation, die [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] bis tief in die Nacht hinein wach gehalten hat. Unsere Militärberater können sich nicht entscheiden, wer der schwächste unserer Nachbarn ist, was die Unsicherheit noch verstärkt. Daher wurde beschlossen, dass wir in alle Richtungen Ansprüche erheben und auf einen günstigen Moment für eine Expansion warten sollten."
  me_armazic_1.a:0 "Es ist gut, die Wahl zu haben..."
  me_armazic_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_1$#!' $mission_completed_tooltip_2$!"

  me_armazic_2_title:0 "$armazic_missions_task_2$#!"
  me_armazic_2_desc:0 "Eines führte zum anderen, und dank der Siege, die unsere Armeen auf den Schlachtfeldern errungen haben, sehen unsere Generäle nun die Gelegenheit, die verbliebenen Armeen der #E Albaner#! und der #E Kolchier#! zu vernichten! Da sie Kerngebiete an unsere Truppen verloren haben, sind ihre Streitkräfte zerschlagen und in Unordnung, und unsere Spione berichten, dass die Moral in den feindlichen Lagern auf einem Tiefpunkt ist. Wir dürfen ihnen keine Atempause gewähren, sondern müssen zuschlagen, solange der Moment günstig ist!"
  me_armazic_2.a:0 "Die Wasser des Pontus Euxinus liegen direkt hinter dem Horizont!"
  me_armazic_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_2$#!' $mission_completed_tooltip_2$!"

  me_armazic_3_title:0 "$armazic_missions_task_3$#!"
  me_armazic_3_desc:0 "Es ist uns nicht nur gelungen, die #E Kolchier#! von ihren Küsten zu vertreiben, sondern wir haben auch einige der kleineren unabhängigen Stadtstaaten geplündert, die an den Ufern des Pontus Euxinus liegen – etwas, das auch in Hauptstädten weit entfernt von unserer eigenen bemerkt werden wird.\n\nAber das sei nun einmal beiseite gelassen; hier, in unserer neuen Stadt [GetProvince('(int32)1720').GetName], werden unsere maritimen Ambitionen ihren Anfang nehmen. Der Zugang zu diesem Gewässer mit seinen Möglichkeiten der Handelsbeziehungen und vielleicht sogar der militärischen Expansion signalisiert der Welt, dass Iberien kein unbedeutender Akteur ist, sondern eine Macht, mit der man rechnen muss."
  me_armazic_3.a:0 "Beginnt mit dem Aufbau einer Flotte!"
  me_armazic_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_3$#!' $mission_completed_tooltip_2$!"
  
  me_armazic_4_title:0 "$armazic_missions_task_4$#!"
  me_armazic_4_desc:0 "Obwohl die albanischen Stammesangehörigen, unsere barbarischen Vettern im Osten, ihr Bestes versuchten, um unseren Soldaten Widerstand zu leisten, war ihr Schicksal am Ende ähnlich dem der Kolcher. Dennoch würdigen wir die Tapferkeit ihrer Kämpfer und bedauern die Umstände, die uns gezwungen haben, unsere kaukasischen Brüder zu töten. \n\nNachdem nun die endgültige Unterwerfung der albanischen Anführer erreicht wurde,  wurde vorgeschlagen, dass wir die verbleibenden Stämmen zu einem Bundesgenossen machen. Einige Stimmen in unserer Regierung haben vorgeschlagen, solch ungehobelte Wilden auf Abstand zu halten, während andere argumentieren, dass sie die gleichen Chancen verdienen, die unsere anderen Bürger haben – die Entscheidung wird [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] überlassen."
  me_armazic_4.a:0 "Mit der Zeit werden die Albaner unsere Lebensweise übernehmen – annektiert sie"
  me_armazic_4.b:0 "Es wurde beschlossen, dass wir ihre letzten Überreste indirekt beherrschen werden"
  me_armazic_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_4$#!' $mission_completed_tooltip_2$!"
  
  me_armazic_5_title:0 "$armazic_missions_task_5$#!"
  me_armazic_5_desc:0 "Großartige Neuigkeiten aus den Städten entlang des Pontus Euxinos! Da wir es für richtig gehalten haben, die Werften von [GetProvince('(int32)1737').GetArea.GetName] mit ausgezeichnetem Holz zu beliefern, genießen wir anscheinend einen kleinen Aufschwung in der Region – unsere Schiffsbauer werden nicht nur besser darin, brauchbare Schiffe zu bauen, sondern immer mehr Reisende entscheiden sich dafür, in der Gegend zu bleiben. Wir haben recht gut daran getan, in die Region zu investieren."
  me_armazic_5.a:0 "Von uns werdet ihr niemals hören, dass wir uns über solche Dinge beschweren"
  me_armazic_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_5$#!' $mission_completed_tooltip_2$!"
 
  me_armazic_6_title:0 "$armazic_missions_task_6$#!"
  me_armazic_6_desc:0 "Eines der allerersten Dinge, die nach der Machtübernahme auf der Tagesordnung von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] standen, war die Einberufung eines Großen Rates, zu dem die führenden Familien in ganz [SCOPE.GetRootScope.GetCountry.GetName] Vertreter entsenden würden, um den neuen Herrscher zu begrüßen. Bei der Ankunft in [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] wurde der Zweck dieses Treffens schnell klar: Da er vor allem Frieden und Stabilität wünschte, hatte [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] beschlossen, eine besondere Art von Statthalterschaft zu schaffen, eine Position, die als „Eristavi“ bekannt ist und als Erweiterung des königlichen Willens fungieren würde. Er rief sieben Männer auf, sich vor [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHim] aufzureihen, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] nahm ihnen einen heiligen Eid ab und überreichte jedem dieser Anführer Zeichen ihrer Autorität."
  me_armazic_6.a:0 "Nehmt diesen Ring, diesen Gürtel, dieses Zepter und dieses Schwert – erinnert euch an euren Eid"
  me_armazic_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_6$#!' $mission_completed_tooltip_2$!"
  
  me_armazic_7_title:0 "$armazic_missions_task_7$#!"
  me_armazic_7_desc:0 "Wir sind dankbar, dass unser Land von einer Vielzahl von Völkern bevölkert ist, aber es ist zugegebenermaßen schwierig, über eine so unterschiedliche Gruppe zu herrschen, wo in jedem Bergtal ein etwas anderer Dialekt gesprochen wird und ein Schriftsystem verwendet wird, das für die Kaufleute in den nahegelegenen Städten möglicherweise unverständlich ist. Da [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] erkannte, dass dies zu einem Problem geworden ist, insbesondere im Hinblick auf die Modernisierung unserer Verwaltung, ordnete er an, eine neue Schrift zu verwenden, die eigens für unser Volk geschaffen wurde. Es wurde außerdem festgelegt, dass die von den Einwohnern von [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] gepflegte Sprache nun die offizielle Landessprache ist, sodass jeder unseren besonderen Dialekt übernehmen muss."
  me_armazic_7.a:0 "Lokale Dialekte sind im Privaten durchaus in Ordnung, aber für offizielle Angelegenheiten benötigen wir unsere neue Schrift"
  me_armazic_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_7$#!' $mission_completed_tooltip_2$!"
 
  me_armazic_8_title:0 "$armazic_missions_task_8$#!"
  me_armazic_8_desc:0 "Die stolze Stadt [GetProvince('(int32)1760').GetName] liegt in den Bergen nahe der Region [GetProvince('(int32)1757').GetArea.GetName], und eine solch glänzende Beute erweist sich für unsere gierigen Armeen als schwer zu widerstehen. Da die Armenier törichterweise beschlossen haben, in diesem Gebiet keine Befestigungsanlagen zu errichten, wäre es für unsere Männer ein Kinderspiel, über die Bergpässe hereinzuströmen und Verwüstung anzurichten...es muss nur noch der Befehl zur Aufnahme der Feindseligkeiten erteilt werden."
  me_armazic_8.a:0 "Sagt unseren Soldaten, dass ich hoffe, dass sie bereit sind zu plündern..."
  me_armazic_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_8$#!' $mission_completed_tooltip_2$!"
 
  me_armazic_9_title:0 "$armazic_missions_task_9$#!"
  me_armazic_9_desc:0 "Eine nach der anderen fallen die reichen Städte der Provinz [GetProvince('(int32)1572').GetArea.GetName] an unsere Armeen, was uns fragen lässt, wie die Armenier sich von diesen Rückschlägen überhaupt wieder erholen wollen. Selbst jetzt, da sich unsere Soldaten am Ufer des Lychnitis-Sees versammeln, um auf ihre nächsten Befehle zu warten, werden unsere Pläne bereits in die Tat umgesetzt; schon bald werden wir in das Kernland Armeniens vordringen und deren Hauptstadt belagern – es wird nicht lange dauern, bis unsere Soldaten in den Straßen von [GetProvince('(int32)1570').GetName] selbst Tür an Tür kämpfen!"
  me_armazic_9.a:0 "Wir werden jeden vernichten, der sich unseren Plänen entgegenstellt!"
  me_armazic_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_9$#!' $mission_completed_tooltip_2$!"

  me_armazic_10_title:0 "$armazic_missions_task_10$#!"
  me_armazic_10_desc:0 "Da die armenische Heimat von schroffen Höhen und felsigen Schluchten geprägt ist, haben ihre Ingenieure und Architekten einen Baustil entwickelt, der sich an die örtlichen Gegebenheiten anpasst. Indem sie ihre Befestigungsanlagen direkt an die Berghänge anpassen, nutzen die Armenier die Kraft der Erde selbst und können so sichere Festungen errichten, die jeder gegnerischen Armee Angst und Schrecken einjagen – fragt doch einfach die Veteranen unserer letzten Feldzüge im Süden, was sie von den armenischen Festungen halten."
  me_armazic_10.a:0 "Das sind großartige Neuigkeiten! Auf solchen Grundlagen baut unsere Zukunft auf."
  me_armazic_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_10$#!' $mission_completed_tooltip_2$!"
  
  me_armazic_11_title:0 "$armazic_missions_task_11$#!"
  me_armazic_11_desc:0 "Auch wenn es vermessen ist, sich vorzustellen, was künftige Generationen über die Taten von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] sagen werden, glauben wir doch, dass der Name der Pharnavaziden bis in alle Ewigkeit nachhallen wird. Keine andere Herrscherfamilie hat so viel für unser Volk getan . Die Eristavi herrschen über eine zufriedene Gesellschaft, und indem er die Sprache, die wir sprechen, und die Worte, die wir schreiben, grundlegend verändert hat, hat [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], der sich mit der Sonne selbst salbt, unsere Wahrnehmung der Realität buchstäblich geprägt.\n\nSolange sich die Menschen an das Königreich Iberien erinnern, werden sie sich auch an die Königsfamilie erinnern, die es geschaffen hat."
  me_armazic_11.a:0 "Die Herrschaft über das iberische Volk war das größte Privileg meines Lebens"
  me_armazic_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_11$#!' $mission_completed_tooltip_2$!"
  
  me_armazic_12_title:0 "$armazic_missions_task_12$#!"
  me_armazic_12_desc:0 "Der Tag, von dem unsere Vorfahren geträumt haben, ist endlich gekommen: nach Jahren erbitterter Kämpfe wurden unsere Rivalen um die Macht besiegt, ihre Fähigkeit, Krieg zu führen, unwiderruflich gebrochen, und eine höchste Autorität herrscht nun über die Länder, die von den armazischen Gläubigen bewohnt werden. Wer könnte angesichts unserer Besitzungen und der uns zuteilgewordenen Segnungen die Macht und Stärke Armazis leugnen? Möge Er uns weiterhin mit göttlicher Gunst überhäufen, während wir unser Volk in die glorreiche Zukunft führen, die uns erwartet!"
  me_armazic_12.a:0 "Wir werden das Licht unseres Glaubens in alle Ecken der Welt tragen"
  me_armazic_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_12$#!' $mission_completed_tooltip_2$!"
 
  me_armazic_13_title:0 "$armazic_missions_task_13$#!"
  me_armazic_13_desc:0 "Eine erfreuliche Nachricht für euch heute Morgen, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]; eine willkommene Abwechslung von den unaufhörlichen Forderungen der Menschen oder den Berichten über Scharmützel in der Nähe der Grenze. Wie Ihr wisst, ist unser Volk in der Weinherstellung außergewöhnlich begabt, und unsere jüngsten Initiativen zur Ausweitung der Produktion sind reibungslos verlaufen. Die Kvevri, die übergroßen Tonfässer,  in denen die Flüssigkeit gelagert wird, wurden in den Boden eingegraben und unsere Traubenstampfer beginnen mit der Arbeit. Es wird nicht lange dauern, bis wir alle die diesjährigen Ernte genießen können, ein Anlass, den jeder gerne feiern wird."
  me_armazic_13.a:0 "Teilt uns unbedingt mit, wann die ersten Kvevri fertig sind!"
  me_armazic_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $armazic_missions_task_13$#!' $mission_completed_tooltip_2$!"