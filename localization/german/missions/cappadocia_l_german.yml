  #mission tasks 
 cappadocia_mission_inv_1_task: "Unsere Position stabilisieren"  
 cappadocia_mission_inv_1_task_DESC: "Bevor wir außerhalb unserer Landesgrenzen aktiv werden, müssen wir sicherstellen, dass unsere Lage im Inland stabil ist – unser Volk ist bereit für die bevorstehenden Herausforderungen! \n\n\n\n\n\n\n\n\n\n@greek_mil1!" 
 cappadocia_mission_inv_BUTTON_TOOLTIP: "Der Weg, der vor uns liegt, ist tückisch, und doch sind die versprochenen Belohnungen unvorstellbar..." 
 cappadocia_mission_inv_BUTTON_DETAILS: ""
  
  # Pro-Antigonid Branch 
 cappadocia_mission_inv_2A_task: "Zusammen mit [ROOT.GetCountry.GetOverlord.GetName] stark!" 
 cappadocia_mission_inv_2A_task_DESC: "Die Zukunft unserer Nation ist eng mit dem Schicksal des #E Antigonidischen Königreichs#!, verbunden. Anstatt für sie ein Ärgernis zu sein, lasst uns tun, was wir können, um unsere Beziehung zu stärken und unser Ansehen in ihren Augen zu erhöhen.  \n\n\n\n\n\n\n\n\n\n@greek_mil13!" 
 cappadocia_mission_inv_3A_task: "Die Eumenidische Bedrohung erhebt sich erneut"  
 cappadocia_mission_inv_3A_task_DESC: "Wir hatten gehofft, dass die Lehren, die wir #E Eumenes von Kardia#! vermittelt hatten, seinen Nachkommen in Erinnerung bleiben würden, doch diese haben törichterweise den Weg der Selbstzerstörung eingeschlagen.\n\n\n\n\n\n\n\n\n\n@greek_mil6!"  
 cappadocia_mission_inv_4A_task: "Treuebelohnungen"  
 cappadocia_mission_inv_4A_task_DESC: "Da wir nun in der Lage sind, unsere Wohltäter mit einem Geschenk zu segnen, hoffen wir, dass sie uns einer Gegenleistung für würdig erachten. \n\n\n\n\n\n\n\n\n\n@egypt_mil19!"  
 cappadocia_mission_inv_5A_task: "Zurück zu den Grenzen der Satrapie"  
 cappadocia_mission_inv_5A_task_DESC: "Die Stunde ist gekommen – wir müssen unsere Truppen nach Norden schicken und #E Pontus#!, angreifen, denn wir wollen unsere Grenzen erweitern. \n\n\n\n\n\n\n\n\n\n@persia_mil2!" 
 cappadocia_mission_inv_6A_task: "Der persische Überrest"  
 cappadocia_mission_inv_6A_task_DESC: "Schreckliche Neuigkeiten – die Perser in unserem Land haben sich unter #E [GetCharacter('(int32)50').GetName] in einem unklugen Versuch zusammengeschlossen, die Macht zurückzuerobern – zu den Waffen! \n\n\n\n\n\n\n\n\n\n@persia_mil14!" 
 cappadocia_mission_inv_7A_task: "Die Rückforderung des armenischen Raubguts"  
 cappadocia_mission_inv_7A_task_DESC: "Die heimtückischen #E Armenier#! haben das regionale Chaos ausgenutzt, um ihre Macht auf unsere Kosten zu vergrößern, aber diese beschämenden Zeiten werden durch uns ein Ende finden! \n\n\n\n\n\n\n\n\n\n@persia_mil18!" 
 cappadocia_mission_inv_8A_task: "Die reichste Satrapie"  
 cappadocia_mission_inv_8A_task_DESC: "Diese heimtückischen #E Armenier#! haben das Chaos in der Region ausgenutzt, um ihre Macht auf unsere Kosten auszubauen, aber diese beschämende Zeit wird dank uns ein Ende finden! \n\n\n\n\n\n\n\n\n\n@egypt_mil16!" 
 cappadocia_mission_inv_8A_task_tt: "Wir benötigen #Y 8 Städte#! mit mindestens #Y 5 @nobles! Adligen#! und #T 35 Zivilisationswert#!."
 cappadocia_mission_inv_9A_task: "Zufriedenheit mit dem eigenen Stand"  
 cappadocia_mission_inv_9A_task_DESC: "Die Geschichten sind voller Erzählungen von ehrgeizigen Männern, die zu nah an die Sonne geflogen sind, aber [ROOT.GetCountry.GetRuler.GetName] ist kein Dummkopf – es hat Vorteile, seinen Platz zu kennen, und vielleicht kann man sogar davon profitieren, wenn man unterwürfig ist. \n\n\n\n\n\n\n\n\n\n@greek_mil13!"  
 cappadocia_mission_inv_10A_task: "Rivale entthront"  
 cappadocia_mission_inv_10A_task_DESC: "In letzter Zeit wurde die Ansicht geäußert, dass wir stärker sind als unser Herr, und dass wir uns derzeit in einem unnatürlichen Zustand befinden, in dem wir jemandem Ehrerbietung erweisen, den wir zu Recht vernichten könnten – vielleicht ist es an der Zeit. \n\n\n\n\n\n\n\n\n\n@greek_mil12!"  
 cappadocia_mission_inv_11A_task: "Unabhängiges hellenistisches Königreich" 
 cappadocia_mission_inv_11A_task_DESC: "Viel zu lange haben wir zugelassen, dass andere den Weg bestimmen, den wir in Zukunft einschlagen sollen – aber warum eigentlich? Sind wir nicht unser eigener Herr? \n\n\n\n\n\n\n\n\n\n@celt_mil6!"  
 cappadocia_mission_inv_12A_task: "[ROOT.GetCountry.GetOverlord.GetName] Nachfolger" 
 cappadocia_mission_inv_12A_task_DESC: "Mögen die Tyrannen und Despoten dieser Welt vor Schrecken zittern angesichts des Aufstiegs der neuen [ROOT.GetCountry.GetAdjective]en Macht in der Region, des #Y Menandridischen Königreichs#!! Alle, die sich gegen uns verschwören, werden ihr eigenes Verderben erleben. \n\n\n\n\n\n\n\n\n\n@greek_mil10!"  
 cappadocia_mission_inv_13A_task: "Hegemon von Anatolien" 
 cappadocia_mission_inv_13A_task_DESC: "Alle, die sich auf den Weg durch die staubigen Hochebenen von #E Anatolien#! machen, wissen, dass #Y Großkappadokien#! die maßgebliche Macht in der Region ist. \n\n\n\n\n\n\n\n\n\n@persia_mil20!"
  
  # Persian Branch 
 cappadocia_mission_inv_2B_task: "Die ariarathidsche Dynastie"  
 cappadocia_mission_inv_2B_task_DESC: "Vor nicht allzu langer Zeit gab es keine Hellenen und Makedonen in diesem Land, und das Leben blühte unter der wohlwollenden Herrschaft der #E Achämeniden#! – viele wünschen sich eine Rückkehr zu diesen besseren Tagen. \n\n\n\n\n\n\n\n\n\n@persia_mil1!"  
 cappadocia_mission_inv_15_task: "Ein kappadokisches Königreich" 
 cappadocia_mission_inv_15_task_DESC: "Wir sind den #E Armeniern#! nach ihrer Hilfe in unserem letzten Krieg zu großem Dank verpflichtet, und unsere Ehre gebietet es uns, ihnen gebührend zu danken … die Frage ist nur, wie.\n\nDiese Aufgabe #R schließt sich aus#! mit #Y $cappadocia_mission_inv_16_task$#!\n\n\n\n\n\n\n\n\n\n@persia_mil15!"  
 cappadocia_mission_inv_16_task: "Armenischer Partner"  
 cappadocia_mission_inv_16_task_DESC: "Es gibt diejenigen, die alles tun werden, um zu verhindern, dass #E Armenien#! und [ROOT.GetCountry.GetName] sich näher kommen, aber sie werden sich vergeblich bemühen.\n\nDiese Aufgabe #R schließt sich aus#! mit #Y $cappadocia_mission_inv_15_task$#!\n\n\n\n\n\n\n\n\n\n@persia_mil12!"  
 cappadocia_mission_inv_17_task: "Das seleukidische Ultimatum"  
 cappadocia_mission_inv_17_task_DESC: "Die arroganten #E Seleukiden#! glauben, dass sie mit uns sprechen können, wie sie wollen – es bleibt an uns zu sehen, ob das stimmt oder nicht. \n\n\n\n\n\n\n\n\n\n@persia_mil10!"  
 cappadocia_mission_inv_18_task: "Persisches Kappadokien" 
 cappadocia_mission_inv_18_task_DESC: "Es gibt viele Dinge, die wir von den in Kappadokien lebenden #E Persern#! lernen könnten, denn ihre Kultur ist alt und weise. \n\n\n\n\n\n\n\n\n\n@persia_mil5!"  
 cappadocia_mission_inv_19_task_DESC: "Wenn man die #E griechische#! und die #E persische#! Kultur miteinander vergleicht, wird man feststellen, dass in beiden viele bewundernswerte Eigenschaften zu finden sind. Anstatt sie als Gegensätze zu betrachten, sollten wir die besten Aspekte, die sie zu bieten haben, nachahmen und annehmen.  \n\n\n\n\n\n\n\n\n\n@greek_mil13!" 
 cappadocia_mission_inv_19A_task: "[ROOT.GetCountry.GetReligion.GetName] Kappadokien"  
 cappadocia_mission_inv_19A_task_DESC: "Kappadokien zu [ROOT.GetCountry.GetReligion.GetName]  bekehren – das ist doch ein lohnenswertes Ziel. Zwar hat jeder das Recht auf seine eigenen Glaubensvorstellungen, doch unsere sind natürlich die besten. \n\n\n\n\n\n\n\n\n\n@greek_mil3!" 
 cappadocia_mission_inv_19B_task: "Armenische Präsenz"  
 cappadocia_mission_inv_19B_task_DESC: "Anstatt sie als Außenseiter zu betrachten, sollten wir die Armenier voll und ganz in die [ROOT.GetCountry.GetAdjective]e Gesellschaft aufnehmen – haben sie sich dieses Recht nicht verdient? \n\n\n\n\n\n\n\n\n\n@persia_mil1!" 
 cappadocia_mission_inv_19B_task_tt: "Die #Y Armenische#! Kultur muss #Y Adlige#! Rechte und #Y Ehrengarde#! haben." 
 cappadocia_mission_inv_20_task: "Eine wahre persische Armee"  
 cappadocia_mission_inv_20_task_DESC: "Die alten Perser waren dafür bekannt, ihre Legionen äußerst wirkungsvoll einzusetzen, und da wir in ihre Fußstapfen treten, müssen wir selbst über eine wahre persische Armee verfügen. \n\n\n\n\n\n\n\n\n\n@persia_mil2!" 
 persian_bactrian_path_7_tt: "Wir brauchen die #T Persische Militärtradition#! #Y Kernland#!." 
 cappadocia_mission_inv_21_task: "Tolerantes Reich"  
 cappadocia_mission_inv_21_task_DESC: "Wie die einstigen #E Achämeniden#! werden wir gegenüber denjenigen, die unter unserer Herrschaft stehen, mit sanfter Hand vorgehen, da wir es vorziehen, zusammenzuarbeiten, anstatt von oben mit harter Hand zu regieren. \n\n\n\n\n\n\n\n\n\n@persia_mil7!" 
 cappadocia_mission_inv_22_task: "Die Armenier überleben"  
 cappadocia_mission_inv_22_task_DESC: "Obwohl wir #E Armenien#! in der Vergangenheit nahe standen, können wir nicht zulassen, dass unsere Freundschaft der Korrektur der Fehler der Geschichte im Wege steht. \n\n\n\n\n\n\n\n\n\n@persia_mil11!"
 cappadocia_mission_inv_23_task: "Pontische Expedition"  
 cappadocia_mission_inv_23_task_DESC: "Die Küsten von #E Pontus#! wären eine wertvolle Ergänzung unserer Besitztümer, da uns der Zugang zum #E Pontus Euxinus#! die Erschließung vieler neuer Möglichkeiten eröffnen würde. \n\n\n\n\n\n\n\n\n\n@greek_mil19!" 
 cappadocia_mission_inv_24_task: "Die neuen Achämeniden"  
 cappadocia_mission_inv_24_task_DESC: "Jeder kann sehen, dass wir wahrhaftig die Erben des #E Achämenidenreichs# sind, und wir werden ihre Ansprüche geltend machen, um allen zu beweisen, dass das, was gesagt wird, zutrifft. \n\n\n\n\n\n\n\n\n\n@india_mil23!"  
 cappadocia_mission_inv_25_task: ""
 cappadocia_mission_inv_25_task_DESC: ""
 cappadocia_mission_inv_23B_task: "Pontische Besitztümer"  
 cappadocia_mission_inv_23B_task_DESC: "Da wir viele der bedeutenden Städte an der pontischen Küste beherrschen, haben wir enorme Vorteile daraus gezogen. \n\n\n\n\n\n\n\n\n\n@greek_mil18!"  
 ###New Task for Temple States 
 # cappadocia_mission_inv_23C_task: "Pontic Temple States"  <*Pontische Tempelstaaten*>  
 # cappadocia_mission_inv_23C_task_DESC: "The realm of Pontus has long been home to temple states, small theocracies wherein a princely ruled over a secular society typically consisting of extensive estates worked by a large number of sacred slaves. These cults, ran out of grand temples, also administered fields and small towns within their surrounding area. Supporting these temple states can revive immigration to the Pontic inland as well as grant the throne divine favor.\n\n\n\n\n\n\n\n\n\n@greek_mil3!"  <*Das Reich von Pontus war lange Zeit die Heimat von Tempelstaaten, kleinen Theokratien, in denen ein Fürst über eine säkulare Gesellschaft herrschte, die typischerweise aus ausgedehnten Ländereien bestand, die von einer großen Zahl heiliger Sklaven bewirtschaftet wurden. Diese Kulte gingen von großen Tempeln aus und verwalteten auch Felder und kleine Städte in der Umgebung. Die Unterstützung dieser Tempelstaaten kann die Einwanderung ins pontische Landesinnere wiederbeleben und dem Thron göttliche Gunst gewähren.\n\n\n\n\n\n\n\n\n\n@greek_mil3!*>  
 # cappadocia_mission_inv_23C_task_finish_tt: "The future of #E Zela#! and #E Comana Pontica#! wil be decided"  <*Die Zukunft von #E Zela#! und #E Comana Pontica#! wird entschieden*>  
  
 cappadocia_mission_inv_23C_task: "Der flammende Lotus"  
 cappadocia_mission_inv_23C_task_DESC: "Der Tempelstaat Zela war die Heimat eines der frühesten Feuerkulte in Kleinasien, dessen Ursprung mit der legendären Niederlage der Saken durch Kyros den Großen verbunden ist. Zum Gedenken an diesen Sieg wurde ein großer Tempel aus weißem Marmor im korinthischen Stil errichtet und zu seinen Ehren ein jährliches Fest namens Sacaea ins Leben gerufen. Dieses von Strabon beschriebene Fest wies auffallende Ähnlichkeiten mit bacchischen Ritualen auf, bei denen Männer, geschmückt mit skythischen Gewändern, den ganzen Tag und die ganze Nacht mit Frauen ausschweiften, tranken und fröhlich waren. Die Regierungsführung von Zela ähnelte stark der von Comana Pontica, mit ihrer theokratischen Struktur, die sich auf eine mächtige Priesterschaft konzentrierte. Wie es in Anatolien üblich war, übten die Priester des Tempels die Kontrolle über das gesamte umliegende Gebiet aus, das von zahlreichen Tempeldienern und Priestern bevölkert war. Der Tempel war nicht nur ein Ort des Feierns, sondern auch ein Zentrum religiöser Aktivitäten, die sowohl mit dem zoroastrischen als auch mit dem anatolischen Pantheon verbunden waren. In der lokalen Mythologie wurden die Göttin Artemis Anaitis und der Gott Men als Mutter-Sohn-Duo verehrt, das persische und anatolische Traditionen vereinte."  
  
 cappadocia_mission_inv_23D_task: "Kleines Korinth" 
 cappadocia_mission_inv_23D_task_DESC: "Das Gebiet von Comana Pontica erstreckte sich entlang des Iris, was der Stadt eine beträchtliche landwirtschaftliche Fläche sowie Verkehrsverbindungen nach Armenien und zu anderen Städten des Pontus verschaffte. Hier befand sich einer der bedeutendsten Tempel der Region, der der Göttin Ma geweiht war. Der Ma-Kult wurde später nach Comana in Kappadokien gebracht. Schließlich brachte Sulla, der behauptete, Ma habe ihm in einem Traum Blitze verliehen, um seine Feinde zu vernichten, ihren Kult nach Rom. Die Bürger von Comana Pontica erlangten großen Reichtum durch die Weinberge sowie durch die Kaufleute und deren Kunden, die während des zweimal jährlich stattfindenden großen Festes in die Stadt kamen. Strabon merkt an, dass die Vielzahl der der Göttin Ma geweihten Prostituierten die Stadt gewissermaßen zu einem „kleinen Korinth“ machte. 6.000 heilige Sklaven, sogenannte Hierodouloi, bewirtschafteten die Felder des Tempelgeländes und waren dem Dienst an Ma geweiht. Sie genossen eine beneidenswerte Stellung, da ihnen Unverletzlichkeit gewährt wurde. Das Territorium des Tempelstaates Comana Pontica sollte erheblich erweitert werden, sobald es unter römische Herrschaft fiel."  
  
 cappadocia_mission_inv_20B_task: "Nach Persien"  
 cappadocia_mission_inv_20B_task_DESC: "Lasst unsere Landsleute wissen, dass unsere Armeen nach #E  Persien#! marschieren – wir brauchen jeden Mann, den wir aufbringen können! \n\n\n\n\n\n\n\n\n\n@greek_mil19!"  <
  
  # Eumenes Branch 
 cappadocia_mission_inv_26_task: "Eumenes' Vermächtnis"  
 cappadocia_mission_inv_26_task_DESC: "'Wie können die Verbrechen der Antigoniden ungestraft bleiben? Soll ich, #E Eumenes Eumenides#!, vor denen kriechen, die meinen Vater ermordet haben, und mich wie ein Hund, der um Essensreste bettelt, zu ihren Füßen winden? Die Götter verlangen Gerechtigkeit – sie werden uns beistehen! Ich muss meinen Vater rächen!' \n\n\n\n\n\n\n\n\n\n@celt_mil1!" 
 cappadocia_mission_inv_27_task: "Die Bedrohung durch die Ariarathiden" 
 cappadocia_mission_inv_27_task_DESC: "Die rebellischen #E Ariarathiden#! haben ihre Unabhängigkeit von uns erklärt, weil sie einem törichten Traum nachjagen – wir müssen sie ein für alle Mal ausschalten. \n\n\n\n\n\n\n\n\n\n@greek_mil9!" 
 cappadocia_mission_inv_28_task: "Die Perser akzeptieren"  
 cappadocia_mission_inv_28_task_DESC: "Wir müssen die Tatsache akzeptieren, dass die #E Perser#! schon lange in dieser Region leben, und anstatt sie an unsere Gewohnheiten anzupassen, müssen wir lernen, in Frieden zusammenzuleben. \n\n\n\n\n\n\n\n\n\n@persia_mil5!"  
 cappadocia_mission_inv_29_task: "Rache für Eumenes"  
 cappadocia_mission_inv_29_task_DESC: "Die für den Mord an #E Eumenes von Kardia#! verantwortlichen Verbrecher haben ihre Strafe erhalten, und [ROOT.GetCountry.GetRuler.GetName] hat dafür gesorgt. \n\n\n\n\n\n\n\n\n\n@persia_mil9!"  
 cappadocia_mission_inv_30_task: "Anatolien sichern"  
 cappadocia_mission_inv_30_task_DESC: "Mit der Kontrolle über #E Anatolien#! ist ein neuer Tag angebrochen – das Zeitalter des #E Eumenidenreichs#!! \n\n\n\n\n\n\n\n\n\n@persia_mil8!"  
 cappadocia_mission_inv_31_task: "Das Reich der Antigoniden ausmerzen"  
 cappadocia_mission_inv_31_task_DESC: "In einer Wendung des Schicksals waren wir es, die den Antigoniden den Todesstoß versetzt haben – alle wissen, dass wir dafür verantwortlich sind, ihr Reich ein für alle Mal zerstört zu haben.. \n\n\n\n\n\n\n\n\n\n@greek_mil15!"  
 cappadocia_mission_inv_32_task: "Konkurrenten in Asien"  
 cappadocia_mission_inv_32_task_DESC: "Es gibt Gerüchte, dass Boten des #Seleukidenreichs#! im Eilzug nach [ROOT.GetCountry.GetCapital.GetName] reiten und ein Ultimatum an [ROOT.GetCountry.GetRuler.GetName] überbringen – wir sollten uns besser auf sie vorbereiten. \n\n\n\n\n\n\n\n\n\n@persia_mil11!"  
 cappadocia_mission_inv_33_task: "Die Beute von Kilikien Pedias"  
 cappadocia_mission_inv_33_task_DESC: "Die Region #E Cilicia Pedias#! ist im Vergleich zu allen anderen ein wahres Juwel, und wir haben die erfreuliche Aufgabe, zu entscheiden, was wir mit ihren Reichtümern anfangen sollen. \n\n\n\n\n\n\n\n\n\n@egypt_mil19!"  
 cappadocia_mission_inv_34_task: "Alexanders Reich"  
 cappadocia_mission_inv_34_task_DESC: "Indem wir die wichtigsten Städte der Makedonen für uns beansprucht haben, haben wir uns das Recht verdient, die Pläne eines #Y Hellenistischen Reiches#! zu verfolgen – und genau dies haben wir auch fest vor. \n\n\n\n\n\n\n\n\n\n@celt_mil1!"  
 cappadocia_mission_inv_35_task: "Alexanders Vision"  
 cappadocia_mission_inv_35_task_DESC: "Jeder weiß, dass [GetCharacter('(int32)39').GetName] danach strebte, größere Gebiete zu erobern als irgendjemand vor ihm, aber letztendlich scheiterte er bei der Verwirklichung seiner Ziele – wir werden dort Erfolg haben, wo der Makedone gescheitert ist. \n\n\n\n\n\n\n\n\n\n@india_por2!"  
 cappadocia_mission_inv_34B_task: "Griechisches Erbe"  
 cappadocia_mission_inv_34B_task_DESC: "Wir haben beschlossen, unser griechisches Erbe anzunehmen, auch wenn die Makedonen darüber verärgert sein werden – letztendlich überwiegen die Vorteile die Nachteile. \n\n\n\n\n\n\n\n\n\n@greek_mil12!" 
 integrate_propontic_tt: "[GetCulture('thracian').GetName|Y] muss integriert sein und mindestens #Y 25#! Pops haben."  
 cap_greek_conv_tt: "Wir werden die Möglichkeit bekommen von unserer Primärkultur zur [GetCulture('thracian').GetName|Y]-Kultur zu wechseln."  
 cappadocia_mission_inv_34C_task: "Beschützer der Argeaden"  
 cappadocia_mission_inv_34C_task_DESC: "All jene Verräter, die persönlichen Ruhm über ihre Eide stellten, liegen nun in ihren Gräbern, und [ROOT.GetCountry.GetRuler.GetName] steht unangefochten an der Spitze und wird als wahrer Beschützer der Argeaden anerkannt. \n\n\n\n\n\n\n\n\n\n@greek_mil17!"  
 cappadocia_mission_inv_34D_task: "Der letzte Royalist"  
 cappadocia_mission_inv_34D_task_DESC: "In einer Welt, in der das Licht des wahren adeligen Geistes fast vollständig erloschen ist, lodert in [ROOT.GetCountry.GetCapital.GetName] – der Heimat des unvergleichlichen [ROOT.GetCountry.GetRuler.GetName], des letzten Royalisten eine helle Flamme. \n\n\n\n\n\n\n\n\n\n@greek_mil10!"  
  
  # Infra Branch 
 cappadocia_mission_inv_1d_task: "Das Handelszentrum von [ROOT.GetCountry.GetCapital.GetName]"  
 cappadocia_mission_inv_1d_task_DESC: "Unsere Hauptstadt befindet sich in einer hervorragenden Lage, die wir zweifellos zum führenden Handelszentrum der Region ausbauen könnten – wir werden sehen, was wir im Laufe der Zeit erreichen können. \n\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"  
 cappadocia_mission_inv_2d_task: "Kappadokische Reiterei"  
 cappadocia_mission_inv_2d_task_DESC: "Wenn es um die Pferdezucht geht, ist unser Volk unübertroffen, und wir haben Tiere, die dies beweisen. Unsere Schlachtrösser sind besser ausgebildet als die meisten anderen, können komplexe Manöver ausführen und heben sich dadurch von allen anderen ab. \n\n\n\n\n\n\n\n\n\n@celt_mil13!"  
 cappadocia_mission_inv_3d_task: "Der Palast von Gazioura"  
 cappadocia_mission_inv_3d_task_DESC: "In längst vergangenen Zeiten war die bescheidene Provinz [GetProvince('(int32)7998').GetName] die Residenz der Könige von #E Pontus#!, und es würde [ROOT.GetCountry.GetName] großen Ruhm einbringen, diesen verlassenen Ort wieder zu seinem früheren Glanz zu führen. \n\n\n\n\n\n\n\n\n\n@celt_mil8!"  
 cappadocia_mission_inv_4d_task: "Prestigeträchtige Kultur" 
 cappadocia_mission_inv_4d_task_DESC: "Wer würde, wenn man alles in allem betrachtet, nicht gerne Makedone sein? Sie sind Eroberer, unübertroffen im Kampf, gerissen und geschickt … da ist es nur verständlich, dass man sich dieser angesehenen Kultur anschließen möchte. \n\n\n\n\n\n\n\n\n\n@greek_mil3!"  
 cappadocia_mission_inv_5d_task: "Die unterirdischen Städte erweitern"  
 cappadocia_mission_inv_5d_task_DESC: "Als in vergangenen Zeiten gefährliche Bedrohungen auftauchten, flüchtete sich unser Volk in unterirdische Städte, die direkt in den Fels der Erde gehauen waren. Auch wenn viele das vielleicht nicht glauben mögen: Diese Zeiten der Not sind noch immer nicht vorbei, daher sollten wir diese Städte ausbauen, solange wir noch Zeit dazu haben. \n\n\n\n\n\n\n\n\n\n@greek_mil7!"  
 cappadocia_mission_inv_6d_task: "Regierung in Tyana"  <
 cappadocia_mission_inv_6d_task_DESC: "Die Stadt [GetProvince('(int32)1951').GetName] liegt an einem wichtigen Verkehrsknotenpunkt und verdient unsere besondere Aufmerksamkeit – ihre günstige Lage macht sie zu einem naheliegenden Kandidaten für eine verstärkte [ROOT.GetCountry.GetAdjective]e Präsenz. \n\n\n\n\n\n\n\n\n\n\n\n@event_pic1!" 
 cappadocia_mission_inv_7d_task: "Kappadokische Ausbildung"  
 cappadocia_mission_inv_7d_task_DESC: "Wir haben die Kriegskunst in dem unwegsamen Gelände, das uns umgibt, perfektioniert, und ganz gleich, ob wir über die Ebenen galoppieren oder einen Hügel hinaufstürmen – unsere Truppen werden stets den Sieg davontragen. \n\n\n\n\n\n\n\n\n\n@persia_mil11!" 
 cappadocia_mission_inv_8d_task: "Kappadokische Küste"  
 cappadocia_mission_inv_8d_task_DESC: "Wir haben uns den Weg bis an die Küsten erkämpft – eine sensationelle militärische Leistung, die es wert ist, in ganz [ROOT.GetCountry.GetName] gefeiert zu werden. Wir haben nun Zugang zu ausländischen Märkten, die auf dem Landweg zu weit entfernt sind – das verändert alles. \n\n\n\n\n\n\n\n\n\n@greek_mil4!"  
 cappadocia_mission_inv_9d_task: "Kilikisches Unterfangen"  
 cappadocia_mission_inv_9d_task_DESC: "In der Region #E Kilikien# gibt es alles, was man sich nur wünschen kann: fruchtbares Ackerland, prachtvolle Städte, ertragreiche Bergwerke und fruchtbare Felder. Da wir nun die Hüter dieses kostbaren Landes sind, sollten wir Maßnahmen ergreifen, um unsere maritime Präsenz in der Region auszubauen – die Kontrolle über das #E Mare Cilicium# muss in unseren Händen liegen. \n\n\n\n\n\n\n\n\n\n@greek_mil18!"  
 cappadocia_mission_inv_10d_task: "Die Stadt des Honigs"  
 cappadocia_mission_inv_10d_task_DESC: "[GetProvince('(int32)1854').GetName] - schon allein die Erwähnung des Ortes, an dem solch köstlicher Honig produziert wird, lässt einem das Wasser im Mund zusammenlaufen. Lasst uns die Region ausbauen, damit wir mehr von dem süßen, gelben Stoff herstellen können … und damit meinen wir Gold. \n\n\n\n\n\n\n\n\n\n@celt_mil2!"  
  
  # Native Path 
 cappadocia_native_path_1: "Einheimisch werden"  
 cappadocia_native_path_1_DESC: "Warum nicht das Beste aus der aktuellen Situation machen? Es gibt viele reizvolle lokale Bräuche, die das Leben hier angenehm und lebenswert machen – wir könnten viel lernen, wenn wir uns Freunde unter den Einheimischen suchen.\n\n#Y Wir werden unsere Primärkultur zu #T Kappadokisch#! und unsere Religion zu #T Anatolisch#! ändern.#!\n\n\n\n\n\n\n\n\n\n@persia_mil15!"  
 cappadocia_native_path_2: "Die makedonischen Überreste"
 cappadocia_native_path_2_DESC: "[GetCharacter('(int32)431').GetName] glaubt, dass die Zeit gekommen ist, die Macht an sich zu reißen, aber wir werden ihn seiner Illusionen berauben. \n\n\n\n\n\n\n\n\n\n@persia_mil1!"  
 cappadocia_native_path_3: "Der persische Thronanwärter"  
 cappadocia_native_path_3_DESC: "[GetCharacter('(int32)50').GetName] hat kühn seine Unabhängigkeit erklärt und führt eine Revolte gegen uns an! \n\n\n\n\n\n\n\n\n\n@persia_mil2!" 
 cappadocia_native_path_4: "Freies Schicksal"  
 cappadocia_native_path_4_DESC: "Es gibt Grund zum Feiern in [ROOT.GetCountry.GetCapital.GetName], denn wir sind endlich eine freie Nation! \n\n\n\n\n\n\n\n\n\n@greek_mil9!"  
 cappadocia_native_path_5: "Ein überstandener Sturm"  
 cappadocia_native_path_5_DESC: "Obwohl wir mit einer überraschend großen Anzahl von Konflikten zu kämpfen hatten, haben wir die stürmischen Zeiten unbeschadet überstanden – ein Beweis unserer Stärke \n\n\n\n\n\n\n\n\n\n@greek_mil14!"  
 cappadocia_native_path_6: "Das unterirdische Stadtnetz erweitern"  
 cappadocia_native_path_6_DESC: "Die wundersamen unterirdischen Städte in unserem Reich erfreuen sich großer Beliebtheit – sowohl bei unserem Volk als Wohnort als auch in fremden Ländern wegen ihrer Einzigartigkeit. Wir sollten diese Städte ausbauen und weitere errichten, was uns sicherlich zugutekommen wird."  
 cappadocia_native_path_7: "Unterirdischer Stadtknotenpunkt" 
 cappadocia_native_path_7_DESC: "[GetProvince('(int32)7981').GetName] ist eine wichtige unterirdische Stadt in unserem Netzwerk, in der zahlreiche Menschen und Waren durch die großen unterirdischen Hallen strömen und über die Gänge in die Außenwelt gelangen. Wenn wir dafür sorgen, dass alle Waren und Menschen diesen Ort sicher passieren können, wird dies sicherlich den Handel in der Region stabilisieren und mehr Menschen anziehen – und Menschen sind die Grundlage jeder Zivilisation."  
 cappadocia_native_path_8: "Das Land der Vorfahren zurückerobern"  
 cappadocia_native_path_8_DESC: "Unsere #Y kappadokischen#! Brüder, die in #Y Pontus#! leben, waren einst Teil unseres Landes, sie sind Teil unserer Geschichte. Wir sollten die beiden Teile wieder vereinen ..." 
 cappadocia_native_path_9: "Kappadokisches Reich"  
 cappadocia_native_path_9_DESC: "Ein Reich für ein Volk – das ist ein Traum. Natürlich kann dieses Reich auch anderen Völkern eine Heimat sein, aber dies ist unsere Geschichte."  
 cappadocia_native_path_10: "Unterirdische Infrastruktur"  
 cappadocia_native_path_10_DESC: "Waren und Lebensmittel müssen stets in ausreichender Menge verfügbar sein, damit niemand von Hunger oder Not bedroht ist. Glücklicherweise waren unsere Herrscher weise genug, dies vorauszusehen..."  
 cappadocia_native_path_11: "Anatolisches Reich" 
 cappadocia_native_path_11_DESC: "Anatolien gehört den Anatoliern! Die Fremden haben in unserem schönen Land nichts zu suchen! Ob Griechen und Makedonen oder Perser und Assyrer – sie alle haben unserem Volk ihre Lebensweise aufgezwungen. Damit ist jetzt Schluss, sage ich!" 
 cappadocia_native_path_12: "Unabhängigkeit sichern"  
 cappadocia_native_path_12_DESC: "Um unsere Freiheit zu bewahren, brauchen wir eine gut ausgerüstete stehende Armee, die jederzeit bereit ist, unsere Grenzen zu verteidigen. \n\n\n\n\n\n\n\n\n\n@greek_mil17!"  
 cappadocia_native_path_13: "Komplizen"  
 cappadocia_native_path_13_DESC: "Obwohl wir unseren fremden Verbündeten bis zu einem gewissen Grad vertrauen, ist es offensichtlich, dass wir eine engere Verbindung zu unseren Verwandten verspüren würden. \n\n\n\n\n\n\n\n\n\n@greek_mil12!"  
 cappadocia_native_path_14: "Der Wiederaufstieg der Kimmerer"  
 cappadocia_native_path_14_DESC: "Unsere längst verstorbenen Vorfahren haben uns ein Erbe hinterlassen, ein Erbe, das wir angenommen haben und leben. Ein Erbe, das wir wiederbeleben werden!"  
 cappadocia_native_path_15: "Vermischung mit den Anatoliern"  
 cappadocia_native_path_15_DESC: "Im Laufe der Jahrhunderte der Vermischung mit den einheimischen Kappadokiern und Kataoniern ist der heutige #E Kimmerier#! nicht mehr derselbe Kimmerier, der seine Vorfahren waren.Dennoch ist eine Veränderung nicht immer etwas Schlechtes..."  
 cappadocia_native_path_16: "Der Aufstieg der Pferdeherren"  
 cappadocia_native_path_16_DESC: "Im Geiste unserer nomadischen Wurzeln haben wir uns im ganzen Land der Lebensweise der Reiter verschrieben. Mit ihnen werden wir allen Reichen die Botschaft vom neuen Aufschwung der Pferdefürsten überbringen. Manchen von uns mit Pfeil und Bogen in der Hand."  
 cappadocia_native_path_17: "Die alten Kimmerer rächen"  
 cappadocia_native_path_17_DESC: "Die einstigen #Y Kimmerer#!  wurden von den #Y Lydern#! und den #Y Phrygern#! besiegt – eine Niederlage, die für unsere Lebensweise fast den kulturellen Untergang bedeutete. Nun haben wir unsere Vorfahren gerächt und unser Fortbestehen gesichert."  
 cappadocia_native_path_18: "Vorstoß nach Osten"  
 cappadocia_native_path_18_DESC: "Im Osten liegen die alten, reichen Zivilisationen. Einige kamen einst in unser Land und unterwarfen unser Volk. Jetzt kommen wir, um den Gefallen zu erwidern."  
 cappadocia_native_path_19: "Ein kimmerisches Reich"  
 cappadocia_native_path_19_DESC: "Erneut herrschen die #YSkythen#! südlich des Kaukasus, und dieses Mal wird uns niemand entthronen!" 
 cappadocia_native_path_20: "Die alte Heimat"  
 cappadocia_native_path_20_DESC: "Wir reiten in die alte Heimat, befreien die Steppen von der Fremdherrschaft und nehmen Kontakt zu den Verwandten unserer Vorfahren auf. Während unsere Vermischung mit den #Y Kappadokiern#! unser Volk verändert hat, halten die Nomadenstämme immer noch an alten Traditionen fest, die von Stamm zu Stamm unterschiedlich sind. Einige Stimmen behaupten, wir müssten zu den Gewohnheiten unserer Vorfahren zurückkehren, andere sagen, dass sich unser Volk dafür zu sehr verändert habe und dass wir das Beste aus der neuen Kultur machen sollten, die aus dieser Vermischung hervorgegangen sei."  
  
  #events 
 cappadocia_event.1.t: "Eumenes' Erben"  
 cappadocia_event.1.desc: "[ROOT.GetCountry.GetRuler.GetName] muss noch einige offene Fragen klären, und dazu gehören leider auch die Erben dieses senilen Greises [GetCharacter('(int32)431').GetName], die [ROOT.GetCountry.GetName] den Krieg erklärt haben.\n\nDie Eumeniden, die glauben, ihre Stunde sei gekommen, versammeln sich um [GetCharacter('(int32)432').GetName] in dem fehlgeleiteten Versuch, uns zu stürzen, doch sie haben sich gewaltig verkalkuliert." 
 cappadocia_event.1.a: "Eumenes ist eine Bedrohung, mit der wir umgehen müssen" 
  
 cappadocia_event.2.t: "Belohnungen für Treue" 
 cappadocia_event.2.desc: "In einem unverhohlenen Versuch, sich bei [GetCharacter('(int32)37').GetName] einzuschmeicheln, hat [ROOT.GetCountry.GetRuler.GetName] beschlossen, dass [ROOT.GetCountry.GetName] unseren mächtigen Herrschern ein Geschenk schicken soll, doch es ist noch nicht entschieden, was wir ihnen schenken sollen." 
 cappadocia_event.2.a: "Gold haben wir im Überfluss, also lasst uns dies schicken"  
 cappadocia_event.2.b: "Wir können die Rekrutenreserve im Moment entbehren" 
  
 cappadocia_event.3.t: "Ein großzügiges Geschenk"  
 cappadocia_event.3.desc: "[ROOT.GetCountry.GetRuler.GetName], es wird Euch freuen zu erfahren, dass einer unserer treuen Vasallen uns ein Geschenk geschickt hat, wobei jedoch ganz klar erwartet wird, dass wir uns dafür revanchieren. Wie sollen wir uns bei unseren treuen Dienern bedanken? Sie warten gespannt darauf, was wir ihnen schenken werden."  
 cappadocia_event.3.a: "Sie wären sicherlich dankbar für ein wenig Technologie"  
 cappadocia_event.3.b: "Nun, wir werden ihnen politisch helfen" 
  
 cappadocia_event.4.t: "Belohnungen für Treue" 
 cappadocia_event.4.desc: "Fantastische Neuigkeiten! Unser Oberherr hat unser Geschenk zur Kenntnis genommen und sich revanchiert – wir haben sein Geschenk tatsächlich heute Morgen erhalten. Ich frage mich, was er uns geschickt hat?"  
 cappadocia_event.4.a: "Wir sind dankbar für alles, was sie uns gegeben haben" 
  
 cappadocia_event.5.t: "Loyalität belohnen" 
 cappadocia_event.5.desc: "Unser Vasall [GetCountry('cap').GetName] hat seine Treue wiederholt unter Beweis gestellt, wobei er uns mit zahlreichen Geschenken bedachte. \nBeunruhigenderweise haben wir kürzlich erfahren, dass der Sohn von [GetCharacter('(int32)431').GetName] in Kappadokien einen Aufstand begonnen hat, um das Erbe seines Vaters zurückzugewinnen. Da wir bereits den Vater besiegt haben, bittet unser Untertan aufgrund seiner früheren Treue um Hilfe. Es liegt nun an [ROOT.GetCountry.GetRuler.GetName], zu entscheiden, wie wir auf diese Bitte reagieren werden."  
 cappadocia_event.5.a: "Sie brauchen unsere Hilfe gegen die Armenier." 
 cappadocia_event.5.b: "Wir werden etwas Geld und Männer schicken."
 cappadocia_event.5.c: "Wir können uns keinen weiteren Krieg leisten."  
 cappadocia_event.5_war_overlord_tt: "Wir werden einen Boten zu unserem Vasallen entsenden, um ihm unsere Unterstützung im Krieg zuzusichern."  
  
 cappadocia_event.6.t: "Belohnungen für Treue"  
 cappadocia_event.6.desc_1: "Wir haben eine Antwort von unserem Oberherrn erhalten – sie haben sich unserem Krieg angeschlossen, den Göttern sei Dank!" 
 cappadocia_event.6.desc_2: "Unser Oberherr hat auf unsere Bitten reagiert und uns einer Gabe für würdig befunden – zu unserem Glück hat er uns materielle Hilfe zugesandt, die uns in den kommenden Tagen von großem Nutzen sein wird."  
 cappadocia_event.6.desc_3: "Obwohl wir unseren Oberherrn um Hilfe gebeten haben, scheint er uns ignoriert zu haben..." 
 cappadocia_event.6.a: "So ist das eben..."  
  
 cappadocia_event.7.t: "Die Ariarathidische Bedrohung"  
 cappadocia_event.7.desc: "Verdammt! Der heimtückische [GetCharacter('(int32)50').GetName] glaubt, dass jetzt der richtige Moment gekommen ist, die Macht an sich zu reißen, und hat uns den Krieg erklärt – doch noch schlimmer ist, dass die verräterischen #E Armenier#! seinem Aufruf zu den Waffen gefolgt sind.\n\nWir stehen nun vor einem gewaltigen regionalen Konflikt, und nur die Götter wissen, ob wir dafür bereit sind."  
 cappadocia_event.7.a: "Und doch werden wir siegen – auf zum Sieg!!"  

 cappadocia_event.8.t: "Belohnungen für Treue"  
 cappadocia_event.8.desc: "[GetCharacter(‚(int32)37‘).GetName] hat die Verdienste von [ROOT.GetCountry.GetRuler.GetName] gewürdigt und als Geste des guten Willens Diplomaten nach [ROOT.GetCountry.GetCapital.GetName] entsandt, die ein verlockendes Angebot überbringen: den Verkauf der gesamten Region #E Cappadocia Garsauritis#! für dreihundert Goldstücke."  
 cappadocia_event.8.a: "Das ist das Geschäft unseres Lebens – ja, auf jeden Fall ja"  
 cappadocia_event.8.b: "Wir können uns einen so hohen Preis nicht leisten" 
  
 cappadocia_event.9.t: "Ein Vorschlag" 
 cappadocia_event.9.desc: "Mein [ROOT.GetCountry.GetRulerTitle], wir haben einen Vorschlag erhalten, der Ihre sofortige Aufmerksamkeit erfordert.\n\nEs scheint, als würde eine Anfrage bezüglich einiger unserer Gebiete vorliegen – wenn wir etwas Geld verdienen wollen, müssen wir lediglich zustimmen, einige Ländereien an einen Vasallen zu verkaufen. Was halten Sie davon?"  
 cappadocia_event.9.a: "Wir werden die betreffenden Gebiete verkaufen" 
 cappadocia_event.9.b: "Sagt den Boten, dass so etwas niemals passieren wird"  
  
 cappadocia_event.10.t: "Vorschlag: Antwort" 
 cappadocia_event.10.desc_1: "Leider muss ich berichten, dass unser Angebot, Gebiete von unserem Oberherrn zu erwerben, trotz unserer fairen Konditionen mit Spott und Gelächter quittiert wurde. Man teilte uns trocken mit, dass wir, sollten wir jemals wieder eine solch alberne Frage stellen, dafür bestraft würden, uns ungebührlich geäußert zu haben."  
 cappadocia_event.10.desc_2: "Du wirst es vielleicht nicht glauben, [ROOT.GetCountry.GetRuler.GetName], aber unser Oberherr hat auf unsere Bitte um den Kauf von Ländereien reagiert und dem Geschäft zugestimmt! Seine Vertreter haben unser Geld bereits entgegengenommen, und damit ist die Sache nun abgeschlossen." 
 cappadocia_event.10.a: "Wie wunderbar!" 
 cappadocia_event.10.b: "Das macht mich traurig zu hören..." 
  
 cappadocia_event.11.t: "Zufriedenheit mit dem eigenen Stand"  
 cappadocia_event.11.desc: "Dank unserer treuen Hingabe an die Sache unseres Meisters wurde [ROOT.GetCountry.GetRuler.GetName] von [GetCharacter('(int32)37').GetName] mit einer prächtigen Zeremonie geehrt, die die [ROOT.GetCountry.GetAdjective]e Nation und ihr Volk würdigt.\n\n'Du gehörst zu den treuesten Dienern, die ich habe, [ROOT.GetCountry.GetRuler.GetFirstName], und dafür lobe ich dich. Wie ein treuer Hund bist du an meiner Seite, und ich freue mich über deinen Gehorsam – wir werden viele sonnige Tage gemeinsam genießen, mein Freund.'"  
 cappadocia_event.11.a: "Da haben Sie vollkommen Recht, mein Herr! Vielen Dank, mein Herr."  
  
 cappadocia_event.12.t: "Die Verhandlungen beginnen"  
 cappadocia_event.12.desc: "Heute Morgen ist ein Botschafter unseres Oberherrn in [ROOT.GetCountry.GetCapital.GetName] eingetroffen. Dieser [SCOPE.sCharacter('ambassador_char_scope').GetName] wurde entsandt, um uns dabei zu helfen, genau das auszuhandeln, was wir fordern. Sobald wir die Einzelheiten geklärt haben, wird [SCOPE.sCharacter('ambassador_char_scope').GetFirstName] uns darüber informieren, wie die Dinge voranschreiten.\n\nEine wichtige Frage bleibt jedoch offen: Was genau fordern wir eigentlich?" 
 cappadocia_event.12.a: "Wir wünschen politische Unterstützung"  
 cappadocia_event.12.b: "Militärische Unterstützung ist immer von Vorteil" 
 cappadocia_event.12.c: "Ihre Technologie ist der unseren überlegen … wären sie vielleicht bereit, sie mit uns zu teilen?"  
 cappadocia_event.12.d: "Eine verstärkte wirtschaftliche Entwicklung ist etwas, das wir uns wünschen"
  
 cappadocia_event.13.t: "Die Verhandlungen gehen weiter"  
 cappadocia_event.13.desc: "Wir haben die Nachricht erhalten, dass unserem Antrag auf politische Unterstützung stattgegeben wurde, und es wird erwartet, dass wir unseren Dank aussprechen und die Angelegenheit regeln"  
 cappadocia_event.13.a: "Was für eine großartige Nachricht! Bitte richtet unseren Dank aus"  
 cappadocia_event.13.b: "Fordern wir unser Glück heraus und unterbreiten ein Gegenangebot, in dem wir mehr verlangen"  
 cappadocia_event.13.c: "Ist das etwa ein Witz?"  
  
 cappadocia_event.14.t: "Militärische Unterstützung"  
 cappadocia_event.14.desc: "Nachdem wir nun beschlossen haben, um militärische Unterstützung zu bitten, müssen wir unseren Diplomaten nur noch die Einzelheiten ihres Auftrags übertragen – eine Aufgabe, die [ROOT.GetCountry.GetRuler.GetName] vorbehalten ist."  
 cappadocia_event.14.a: "Die Anfrage entsenden"  
 cappadocia_event.14.b: "Das ist nicht, was wir wollten..."  
  
 cappadocia_event.15.t: "Technologische Unterstützung" 
 cappadocia_event.15.desc: "Nun, da wir uns entschieden haben, müssen wir nur noch einen Boten zu unserem Oberherrn schicken – wir hoffen sehr, dass wir für würdig befunden werden, seine technologischen Geheimnisse zu erfahren." 
 cappadocia_event.15.a: "Lasst uns unsere Verhandlungsführer entsenden und auf das Beste hoffen"  
 cappadocia_event.15.b: "Wir werden derzeit niemanden entsenden"  
  
 cappadocia_event.16.t: "Die Verhandlungen gehen weiter"  
 cappadocia_event.16.desc_1: "[SCOPE.sCharacter('ambassador_char_scope').GetName] berichtet uns, dass die Verhandlungen sehr gut verlaufen und es scheint, dass uns alles, worum wir gebeten haben, gegeben wird, sofern nicht etwas Unvorhergesehenes passiert." 
 cappadocia_event.16.desc_2: "Anstatt blindlings unseren Forderungen zuzustimmen, hat [SCOPE.sCharacter('ambassador_char_scope').GetName] ein Gegenangebot unterbreitet, das etwas fragwürdig erscheint – es sieht so aus, als müssten wir noch weiter verhandeln."  
 cappadocia_event.16.desc_3: "Obwohl wir merkten, dass es [SCOPE.sCharacter('ambassador_char_scope').GetName] peinlich war, uns eine ablehnende Antwort zu erteilen, ist das Endergebnis – abgesehen von allen persönlichen Gefühlen – dasselbe: Unser Oberherr hat unsere Bitte rundweg abgelehnt und die Gespräche abgebrochen."  
 cappadocia_event.16.a: "Wir können es kaum erwarten, das Wort „Ja“ zu vernehmen!" 
 cappadocia_event.16.b: "Ich denke, wir werden akzeptieren, was auch immer sie wollen"  
 cappadocia_event.16.c: "Wir werden unsere Anstrengungen verdoppeln!" 
 cappadocia_event.16.d: "Wie enttäuschend..."  
  
 cappadocia_event.17.t: "Wirtschaftliche Unterstützung"  
 cappadocia_event.17.desc: "[ROOT.GetCountry.GetRuler.GetName] – wir müssen unsere besten Diplomaten zu unserem Oberherrn entsenden und hoffen, dass sie mit ihren Bitten Erfolg haben – wie wir wissen, gibt es im Leben keine Garantien. Ist es das überhaupt wert, dass wir uns damit beschäftigen?"  
 cappadocia_event.17.a: "Lasst uns unsere Verhandlungsführer schicken und auf das Beste hoffen" 
 cappadocia_event.17.b: "Wir werden vorerst niemanden entsenden."  
  
 cappadocia_event.18.t: "Eine Antwort" 
 cappadocia_event.18.desc_1: "Unser Oberherr hat zustimmend geantwortet, wobei jedoch darauf hingewiesen wurde, dass dies das gesamte Ausmaß der gewährten Hilfe sein wird."  
 cappadocia_event.18.desc_2: "Unser Oberherr hat unsere Bitte rundweg abgelehnt und uns gebeten, seine Zeit nicht mit törichten Anfragen zu verschwenden." 
 cappadocia_event.18.a: "Wir sind für alles dankbar" 
 cappadocia_event.18.b: "Wie bedauerlich für uns..."  
  
 cappadocia_event.19.t: "Eine helfende Hand" 
 cappadocia_event.19.desc_1: "Fabelhafte Neuigkeiten! Wir haben von unserem Oberherrn die Nachricht erhalten, dass er einige Forscher und Ingenieure nach [ROOT.GetCountry.GetCapital.GetName] entsenden wird – anscheinend ist er bereit, unsere Forschungsinitiativen zu fördern!"  
 cappadocia_event.19.desc_2: "Unser Oberherr hat auf unsere Bitte um technologische Unterstützung mit einem einzigen Wort geantwortet: Nein."  
 cappadocia_event.19.a: "Dafür sind wir sehr dankbar – was für ein Segen für [ROOT.GetCountry.GetName]"  
 cappadocia_event.19.b: "Nun, sie mussten nicht gleich so unhöflich sein – hmmph"  
  
 cappadocia_event.20.t: "Eine Antwort erhalten"  
 cappadocia_event.20.desc: "In [ROOT.GetCountry.GetCapital.GetName] ist die Nachricht eingetroffen, dass unsere Anfragen von unserem gnädigen Oberherrn beantwortet wurden, der der Meinung ist, wir sollten uns mit dem Status quo zufrieden geben."  
 cappadocia_event.20.a: "Wir sollten mit dem zufrieden sein, was wir haben" 
 cappadocia_event.20.b: "Das ist für uns inakzeptabel"  
  
 cappadocia_event.21.t: "Ökonomische Experten"  
 cappadocia_event.21.desc_1: "Was für ein Glück für uns! Unser Oberherr hat gnädigerweise einen seiner besten wirtschaftlichen Berater an unseren Hof entsandt – ich nehme an, das bedeutet, dass unser Hilfsgesuch positiv aufgenommen wurde."  
 cappadocia_event.21.desc_2: "Unser Oberherr hat unsere Bitte abgelehnt und behauptet, wir seien einer solchen Ehre nicht würdig."  
 cappadocia_event.21.a: "Wir schätzen uns sehr glücklich, dies erhalten zu dürfen" 
 cappadocia_event.21.b: "Wie schade für uns ... leider"  
  
 cappadocia_event.22.t: "Die lang erwartete Antwort" 
 cappadocia_event.22.desc_1: "Man muss sagen, dass es manchmal klug ist, sein Glück herauszufordern und um einen Gefallen zu bitten, obwohl dieser bereits abgelehnt wurde.\n\nIn unserem Fall ist es uns gelungen, einen Gefallen von unserem Oberherrn zu erwirken, obwohl dieser bereits abgelehnt worden war – was für ein Staatsmann [ROOT.GetCountry.GetRuler.GetName] doch ist."  
 cappadocia_event.22.desc_2: "Wir hätten nicht ein zweites Mal um einen Gefallen bitten sollen, denn wir haben keine Antwort erhalten – anscheinend verachtet uns unser Oberherr so sehr."  
 cappadocia_event.22.a: "Wir sind für alles dankbar"  
 cappadocia_event.22.b: "Wie bedauerlich für uns … das betrübt mich"  
  
 cappadocia_event.23.t: "Rivale entthront"  
 cappadocia_event.23.desc: "Die Stunde unseres größten Triumphs ist nahe – lasst uns den Spieß gegen unseren Herren umdrehen und unseren rechtmäßigen Platz als wahre Herrscher unseres eigenen Landes einnehmen. [ROOT.GetCountry.GetRuler.GetName] hat den beispiellosen Schritt unternommen, den [ROOT.GetCountry.GetOverlord.GetName] den Krieg zu erklären, und jetzt warten alle unsere regionalen Nachbarn gespannt darauf, wer aus diesem Konflikt siegreich hervorgehen wird."  
 cappadocia_event.23.a: "Wir schreiten voran zum ewigen Ruhm!" 
  
 cappadocia_event.24.t: "Verschwörung gegen unseren Oberherrn"  
 cappadocia_event.24.desc: "Aufgrund unserer Entscheidung, das Herrschaftsgebiet unseres Oberherren zu übernehmen, sind einige Berater mit dem Vorschlag an uns herangetreten, zu versuchen, einige Statthalter in der Nähe unserer Grenze zu bestechen, damit sie sich uns anschließen, sobald wir die Unabhängigkeit erklären.\n\nObwohl dieser Plan seine Vorzüge hat, sollten wir uns davor hüten, [ROOT.GetCountry.GetOverlord.GetRuler.GetName] zu beunruhigen."  
 cappadocia_event.24.a: "Wir sollten uns auf [SCOPE.sChar('cap_beguile_gov_char_1').GetGovernorship.GetName] konzentrieren."  
 cappadocia_event.24.b: "[SCOPE.sChar('cap_beguile_gov_char_2').GetGovernorship.GetName] ist die wichtigere Region, auf die man sich konzentrieren sollte"  
 cappadocia_event.24.c: "Wir brauchen ihre Hilfe nicht."  
  
 cappadocia_event.25.t: "Sicherung von [SCOPE.sChar('cap_beguile_gov_char_1').GetGovernorship.GetName]"  
 cappadocia_event.25.desc: "Wenn man jemanden kauft, sollte man immer darauf achten, nicht übertölpelt zu werden. Außerdem sollten man etwas zu bieten haben, das gewünscht wird. Dies gilt auch für [SCOPE.sChar('cap_beguile_gov_char_1').GetName], der unser Angebot sicherlich gerne annehmen wird, aber absolute Gewissheit gibt es nie..."  
 cappadocia_event.25.a: "Geld ist die Lösung für alles."  
 cappadocia_event.25.b: "Ein nettes Amt wird sicherlich geschätzt." 
  
 cappadocia_event.26.t: "Sicherung von [SCOPE.sChar('cap_beguile_gov_char_2').GetGovernorship.GetName]"  
 cappadocia_event.26.desc: "Wenn man jemanden kauft, sollte man immer darauf achten, nicht übertölpelt zu werden. AAußerdem sollten man etwas zu bieten haben, das gewünscht wird. Dies gilt auch für [SCOPE.sChar('cap_beguile_gov_char_2').GetName], der unser Angebot sicherlich gerne annehmen wird, aber absolute Gewissheit gibt es nie..."  
 cappadocia_event.26.a: "Geld ist die Lösung für alles."  
 cappadocia_event.26.b: "Ein nettes Amt wird sicherlich geschätzt."  
  
 cappadocia_event.27.t: "Sicherung von [SCOPE.sChar('cap_beguile_gov_char_1').GetGovernorship.GetName]: Antwort"  
 cappadocia_event.27.desc: "[SCOPE.sChar('cap_beguile_gov_char_1').GetName] hat zustimmend auf unsere „Anfrage“ reagiert, scheint jedoch mit der Vereinbarung nicht ganz zufrieden zu sein … es sieht so aus, als hätte er noch mehr im Sinn. Auf jeden Fall hat er kein Interesse an der Führung durch [ROOT.GetCountry.GetOverlord.GetName]..."  
 cappadocia_event.27.a: "Wunderbar."  
 cappadocia_event.27.b: "Es ist es wert."  
 cappadocia_event.27.c: "Der Schurke bekommt keine einzige Drachme mehr!"  
  
 cappadocia_event.28.t: "Sicherung von [SCOPE.sChar('cap_beguile_gov_char_2').GetGovernorship.GetName]: Antwort"  
 cappadocia_event.28.desc: "[SCOPE.sChar('cap_beguile_gov_char_2').GetName] hat zustimmend auf unsere „Anfrage“ reagiert, scheint jedoch mit der Vereinbarung nicht ganz zufrieden zu sein … es sieht so aus, als hätte er noch mehr im Sinn. Auf jeden Fall hat er kein Interesse an der Führung durch [ROOT.GetCountry.GetOverlord.GetName]..."  
 cappadocia_event.28.a: "Wunderbar."  
 cappadocia_event.28.b: "Es ist es wert."  
 cappadocia_event.28.c: "Der Schurke bekommt keine einzige Drachme mehr!"  
  
 cappadocia_event.29.t: "Gesicherte Unterstützung"  
 cappadocia_event.29.desc: "Nachdem wir uns nun mit [SCOPE.sChar('cap_beguile_gov_char_1').GetName] geeinigt haben, können wir endlich mit der Planung des Sturzes unseres gemeinsamen Feindes beginnen. Mit der Hilfe unseres neuen Freundes werden wir mit Sicherheit über alles triumphieren, was unser Feind uns entgegenzusetzen hat."  
 cappadocia_event.29.a: "Kommen wir nun zu [ROOT.GetCountry.GetOverlord.GetRuler.GetName]."  
  
 cappadocia_event.30.t: "Gesicherte Unterstützung"  
 cappadocia_event.30.desc: "Nachdem wir uns nun mit [SCOPE.sChar('cap_beguile_gov_char_2').GetName] geeinigt haben, können wir endlich mit der Planung des Sturzes unseres gemeinsamen Feindes beginnen. Mit der Hilfe unseres neuen Freundes werden wir mit Sicherheit über alles triumphieren, was unser Feind uns entgegenzusetzen hat."  
 cappadocia_event.30.a: "Kommen wir nun zu [ROOT.GetCountry.GetOverlord.GetRuler.GetName]." 
  
 cappadocia_event.31.t: "Attentat: Ein böser Plan"  
 cappadocia_event.31.desc: "Kürzlich haben einige unserer Berater vorgeschlagen, zu versuchen, [ROOT.GetCountry.GetOverlord.GetRuler.GetName] zu ermorden, um Unzufriedenheit und Chaos zu säen, wenn wir uns gegen [ROOT.GetCountry.GetOverlord.GetName] wenden werden.\n\nEs wäre natürlich eine unehrenhafte Tat, und sie könnte auf uns zurückgeführt werden, aber sie hätte deutliche Vorteile… vorausgesetzt natürlich, wir sind erfolgreich."  
 cappadocia_event.31.a: "Es ist für eine größere Sache." 
 cappadocia_event.31.b: "Ich bin kein Abschaum." 
  
 cappadocia_event.32.t: "Attentat: Agenten"  
 cappadocia_event.32.desc: "Mit der Entscheidung, [ROOT.GetCountry.GetOverlord.GetRuler.GetName] zu ermorden, müssen wir nun entscheiden, wen wir für diese Tat entsenden sollen. Unser Spionagechef hat zwei mögliche Wege aufgezeigt, um zum [ROOT.GetCountry.GetOverlord.GetAdjective] [ROOT.GetCountry.GetOverlord.GetRuler.GetTitle] zu gelangen.\n\nEine Möglichkeit wäre, heimlich und mit roher Gewalt vorzugehen und die Wachen nachts zu überwältigen; [SCOPE.sChar('cap_martial_assassin').GetName] wäre für diese Aufgabe bestens geeignet. Ein anderer Ansatz wäre weibliche Verführung, etwa durch das Untermischen von Gift in eine Mahlzeit oder ein Getränk … eine Rolle, die [SCOPE.sChar('cap_charisma_assassin').GetName] nur allzu gerne übernehmen würde." 
 cappadocia_event.32.a: "Entsendet [SCOPE.sChar('cap_martial_assassin').GetName]."  
 cappadocia_event.32.b: "[SCOPE.sChar('cap_charisma_assassin').GetName] wird erfolgreich sein."  
  
 cappadocia_event.33.t: "Attentat: Gelegenheit"  
 cappadocia_event.33.desc: "[ROOT.GetCountry.GetOverlord.GetRuler.GetName] hat begonnen, unserem Agenten großes Vertrauen zu schenken, wodurch [ROOT.GetCountry.GetOverlord.GetRuler.GetHerHis] zukünftiger Mörder nachts leichten Zugang zu [ROOT.GetCountry.GetOverlord.GetRuler.GetHerHis]en Gemächern erhält. Natürlich nur, wenn unser Agent bereit ist, den Preis für eine solch angesehene Position zu zahlen. Diese Nähe könnte jedoch das Risiko erhöhen, entdeckt zu werden..." 
 cappadocia_event.33.a: "Noch vor Jahresende wird unser Ziel tot sein."  
 cappadocia_event.33.b: "Unser Ziel präsentiert sich uns auf dem Silbertablett."  #unsicher
 cappadocia_event.33.c: "Es lohnt sich nicht."  
  
 cappadocia_event.34.t: "Attentat: Rückschlag" 
 cappadocia_event.34.desc: "Das Unglück ist herein gebrochen! Unser Agent wurde bei einem Spaziergang durch [ROOT.GetCountry.GetOverlord.GetCapital.GetName], die Hauptstadt, von einigen Soldaten der Königlichen Garde erkannt. Zwar wurde noch kein Großalarm ausgelöst, doch herrscht allgemeines Misstrauen, und die Wachmannschaften wurden verdoppelt. Möge unser Attentäter dennoch Erfolg haben..." 
 cappadocia_event.34.a: "Das ist katastrophal." 
  
 cappadocia_event.35.t: "Attentat: Störung"  
 cappadocia_event.35.desc: "Das Unglück schlug zu! Unser Agent wurde bei einem Spaziergang durch [ROOT.GetCountry.GetOverlord.GetCapital.GetName], die Hauptstadt, von einem Veteranen der Feldzüge Alexanders erkannt. Nun ist dieser jemand kein Anhänger von [ROOT.GetCountry.GetOverlord.GetRuler.GetName], daher ist er bereit, den Mund zu halten – natürlich gegen Bezahlung –, doch wir glauben, dass er uns melden und auf eine Belohnung vom Palast hoffen wird, wenn wir das Geld nicht aufbringen."  
 cappadocia_event.35.a: "Niemand wird ihm glauben."  
 cappadocia_event.35.b: "Bezahlt ihn." 
  
 cappadocia_event.36.t: "Die Unabhängigkeit von [ROOT.GetCountry.GetName]" 
 cappadocia_event.36.desc_1: "Da [ROOT.GetCountry.GetOverlord.GetName] unsere Unterwerfung fordert und wir Unabhängigkeit fordern, kommen wir zu dem Ergebnis, dass es nur eine Lösung für unsere Differenzen gibt: Krieg. Unser Schicksal wird auf den Schlachtfeldern von #E Anatolien#! entschieden werden, die mit dem Blut tapferer Männer getränkt werden." 
 cappadocia_event.36.desc_2: "Glücklicherweise hat [ROOT.GetCountry.GetOverlord.GetName] unseren Forderungen nach Unabhängigkeit stattgegeben und uns sogar Freundschaft angeboten, da ein Bündnis beide Nationen stärken würde, die andernfalls den Geiern der anderen Diadochen schutzlos ausgeliefert wären."  
 cappadocia_event.36.a: "Dann wird es eben Krieg geben."  
 cappadocia_event.36.b: "Alles wird besser, wenn man darüber redet."  
  
 cappadocia_event.37.t: "Unabhängigkeit fordern" 
 cappadocia_event.37.desc: "In den letzten Jahren sind auf den Marktplätzen unserer Städte immer mehr kritische Stimmen zu vernehmen, die ihre Unzufriedenheit zum Ausdruck bringen und die Unabhängigkeit unseres Landes von [ROOT.GetCountry.GetOverlord.GetName] fordern.\n\nAllerdings wollen nicht alle dasselbe: Einige möchten, dass wir uns an unseren Oberherren für vergangene Verfehlungen rächen, und verstehen dies als eine Form der Vergeltung, während andere sich dafür einsetzen, unsere Unabhängigkeit friedlich zu erlangen, und davon überzeugt sind, dass niemand sterben muss."  
 cappadocia_event.37.a: "Krieg ist unsere einzige Möglichkeit."  
 cappadocia_event.37.b: "Wir werden erst einmal Diplomatie versuchen."  
  
 cappadocia_event.38.t: "Forderung nach Unabhängigkeit"  
 cappadocia_event.38.desc: "Ein katastrophaler Tag! Unser Untertan [SCOPE.sCountry('cap_subject_country_scope').GetName] fordert Unabhängigkeit und droht mit Krieg, wenn wir sie nicht sofort entlassen!" 
 cappadocia_event.38.a: "Dann wird es eben Krieg geben." 
 cappadocia_event.38.b: "Sie sollen frei sein."  
  
 cappadocia_event.39.t: "Forderung nach Unabhängigkeit" 
 cappadocia_event.39.desc: "Unser Untertan [SCOPE.sCountry('cap_subject_country_scope').GetName] strebt nach Unabhängigkeit und verlangt von uns, ihm volle Unabhängigkeit zu gewähren und es stattdessen als Verbündeten anzuerkennen. Seine Diplomaten haben sogar die Frechheit, vom sogenannten „gegenseitigen Nutzen“ für beide Seiten zu sprechen." 
 cappadocia_event.39.a: "Wenn du Freiheit wünschst, musst du darum kämpfen."  
 cappadocia_event.39.b: "Ein Verbündeter ist besser als ein Feind." 
  
 cappadocia_event.73.t: "Gewährte Freiheit"  
 cappadocia_event.73.desc: "Eingeschüchtert von unserer militärischen Stärke und der Drohung mit Krieg, gewährte uns unser Oberherr unsere Freiheit, den Kampf auf dem Schlachtfeld fürchtend"  
 cappadocia_event.73.a: "Auch ohne Blutvergießen sind wir jetzt frei! Ein freudiger Tag" 
  
