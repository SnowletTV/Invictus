 cappadocia_event.41.t: "Das Menandridische Königreich "  
 cappadocia_event.41.desc: "Als Erben von [GetCharacter('(int32)51').GetName] haben wir den gleichen Anspruch auf Alexanders Reich wie alle anderen Diadochen, einen Anspruch, den wir gefestigt haben, indem wir uns vom Joch der Antigoniden befreit und die Bedrohung durch die Seleukiden abgewehrt haben. Obendrein kontrollieren wir den Großteil von Alexanders ersten Eroberungen. Wer, wenn nicht wir, könnte seine Feldzüge wiederholen?"
 cappadocia_event.41.a: "Alexanders Vermächtnis soll unser sein." 
  
 cappadocia_event.42.t: "Hegemon von Anatolien"  
 cappadocia_event.42.desc: "[ROOT.GetCountry.GetRuler.GetName] verfügt über eine gut ausgebildete und gut ausgerüstete Armee, auf die [ROOT.GetCountry.GetRuler.GetSheHe] jederzeit zurückgreifen kann, um die Grenzen und Interessen von [ROOT.GetCountry.GetName] zu verteidigen, und niemand kann ihrem Volk Widerstand leisten,wenn es gilt, die Kontrolle über #E Anatolien#! zu erringen. Es versteht sich von selbst, dass der Beiname 'Hegemon von Anatolien' verdient ist."  
 cappadocia_event.42.a: "Mein Wort ist in diesem Teil der Welt Gesetz"  
  
  # persian branch from now 
  
 cappadocia_event.43.t: "Ariarathes' Rebellion"  
 cappadocia_event.43.desc: "Wenn man bedenkt, wie ruhig [ROOT.GetCountry.GetRuler.GetName] in letzter Zeit war, hätte niemand damit gerechnet, dass der selbsternannte [ROOT.GetCountry.GetRulerTitle] der #E Ariarathiden-Dynastie#! heimlich eine Armee aufstellte, um Kappadokien anzugreifen. Im Jahr [GetProvince('(int32)1799').GetName] herrschte große Bestürzung, als verzweifelte Boten mit der Nachricht von dem Krieg eintrafen, den [ROOT.GetCountry.GetRuler.GetFirstName] erklärt hatte, und sofort wurden Rufe laut, die Aufgebote auszuheben."  
 cappadocia_event.43.a: "Zu wenig, zu spät – der Sieg wird unser sein!"  
  
 cappadocia_event.44.t: "Der Preis armenischer Unterstützung"  
 cappadocia_event.44.desc: "Für ihre großzügige Unterstützung im Kampf gegen die makedonischen Thronprätendenten verlangen die Armenier nun eine Gegenleistung, eine Art Tribut. Sollen wir uns den Forderungen dieses wilden Bergvolkes beugen? "  
 cappadocia_event.44.a: "Wir werden es unseren armenischen Freunden zurückzahlen."  
 cappadocia_event.44.b: "Ich beuge mich nicht!"  
  
 cappadocia_event.45.t: "Der Preis armenischer Unterstützung" 
 cappadocia_event.45.desc: "Nichts im Leben ist wirklich umsonst, so lautet ein altes Sprichwort, und es entspricht der Wahrheit. Um uns für die Unterstützung der Armenier bei der Rückeroberung meines Throns zu revanchieren, müssen wir entscheiden, wie wir ihnen dafür danken wollen. Werden wir Tribut zahlen oder werden wir sie unterstützen? Oder vielleicht sogar beides?\n\nUnsere armenischen Partner erwarten mit Sicherheit eine Gegenleistung, daher müssen wir uns überlegen, was wir ihnen geben werden."  
 cappadocia_event.45.a: "Wir werden ihre Hilfe in Gold zurückzahlen." 
 cappadocia_event.45.b: "Wir werden ihre Hilfe in Gold vergelten."  
 cappadocia_event.45.c: "Wir werden uns ihrer Herrschaft unterwerfen."  
  
 cappadocia_event.46.t: "Ariarathes' Bezahlung seiner Unterstützung"  
 cappadocia_event.46.desc_1: "Ariarathes hat uns Geld gesandt, eine großzügige Summe, um seine Schulden bei uns zu begleichen. Doch sind wir mit einem so geringen Betrag wirklich zufrieden? Warum fordern wir nicht mehr?"  
 cappadocia_event.46.desc_2: "Als Gegenleistung für unsere Unterstützung hat Ariarathes uns seine Unterstützung bei unseren politischen Vorhaben zugesagt – ein großartiges Versprechen! Doch genügt das schon für das, wofür unsere Männer ihr Blut vergossen haben und ihr Leben gelassen haben?" 
 cappadocia_event.46.desc_3: "Ariarathes hat uns seine Vasallenschaft als Gegenleistung für unsere Unterstützung bei der Rückeroberung des kappadokischen Throns angeboten. Auch wenn es ein verlockendes Angebot ist – sind wir uns sicher, dass wir es annehmen wollen?"  
 cappadocia_event.46.a: "Damit hat er seine Schuld beglichen."  
 cappadocia_event.46.b: "Das ist doch nur ein lächerlicher Betrag für das, wofür Menschen ihr Blut vergossen haben."  
 cappadocia_event.46.c: "Damit hat er seine Schuld beglichen." 
 cappadocia_event.46.d: "Das genügt nicht als Gegenleistung für das ihm Gegebene."  
 cappadocia_event.46.e: "Damit hat er seine Schuld beglichen."  
 cappadocia_event.46.f: "Wir brauchen keine Bittsteller." 
  
 cappadocia_event.47.t: "Der Preis armenischer Unterstützung: Antworten"  
 cappadocia_event.47.desc_1: "Die Armenier haben unser Zeichen der Dankbarkeit großzügig angenommen, und alle Schulden sind nun beglichen. Vor uns liegen Tage und Jahre der Freundschaft."  
 cappadocia_event.47.desc_2: "Die Armenier haben uns einen Boten geschickt, und es sind keine guten Nachrichten. Sie halten unser Tributangebot für lächerlich gering und fordern eine höhere Summe! Sollen wir ihren unverschämten Forderungen nachgeben?" 
 cappadocia_event.47.a: "Wir haben keine Wahl..."  
 cappadocia_event.47.b: "Wir haben unsere Schulden beglichen!"  
 cappadocia_event.47.c: "Was für eine Erleichterung." 
  
 cappadocia_event.48.t: "Ariarathes' Bezahlung seiner Unterstützung" 
 cappadocia_event.48.desc_1: "Dieser persische Schurke ist unseren Forderungen nach einer höheren Zahlung nicht nachgekommen, dieser Mistkerl! Wir müssen ihn nun zur Unterwerfung zwingen. Was wir ihm gaben, können wir ihm auch wieder nehmen!"  
 cappadocia_event.48.desc_2: "Ariarathes hat sich vernünftig gezeigt und unseren gestiegenen Entschädigungsforderungen entsprochen. Er hat erkannt, dass das für seinen Thron vergossene armenische Blut einigen Goldwert hat." 
 cappadocia_event.48.a: "Er wird diesen Tag bereuen!" 
 cappadocia_event.48.b: "Er ist ein vernünftiger Mann, vielleicht wird er auch ein vernünftiger Freund sein." 
  
 cappadocia_event.49.t: "Der Preis armenischer Unterstützung: Erwiderung"  
 cappadocia_event.49.desc_1: "Die Armenier haben begonnen, Kräfte gegen uns zu mobilisieren, da sie über unsere Weigerung verärgert sind … wir sollten uns auf einen Krieg vorbereiten. Hoffentlich ist das nur eine Drohgebärde."  
 cappadocia_event.49.desc_2: "Endlich haben wir eine Einigung erzielt, und alle Schulden sind nun endgültig beglichen. Jetzt wird niemand mehr unsere Zukunft beeinflussen, und wir haben einen verlässlichen Freund an unserer Seite." 
 cappadocia_event.49.a: "Wachsamkeit ist das Gebot der Stunde."  
 cappadocia_event.49.b: "Ende gut, alles gut."  
  
 cappadocia_event.50.t: "Ultimatum an Ariarathes"  
 cappadocia_event.50.desc: "Die Weigerung von Ariarathes, unseren vernünftigen Forderungen nachzukommen, lässt nur eine mögliche Konsequenz zu: Krieg. Nur eine in letzter Minute getroffene Entscheidung von [ROOT.GetCountry.GetRuler.GetName] – die sicherlich auf wenig Zustimmung stoßen wird – vermag jetzt noch den Kurs zu ändern, den die jüngsten Ereignisse für uns vorgezeichnet haben."  
 cappadocia_event.50.a: "Sie sollen sich verneigen!" 
 cappadocia_event.50.b: "Was können wir tun?"  
  
 cappadocia_event.51.t: "Armenisches Ultimatum."  
 cappadocia_event.51.desc: "Die armenischen Hunde haben uns ein Ultimatum gestellt: uns zu unterwerfen oder zu sterben.\n\nNun ist die Stunde der Wahrheit gekommen, und unser Mut wird in der Schlacht auf die Probe gestellt – ansonsten werden wir als Feiglinge dastehen, die bereit sind, sich zu unterwerfen, sobald sie von einem Niemand bedroht werden." 
 cappadocia_event.51.a: "Wir werden uns verbeugen…vorerst." 
 cappadocia_event.51.b: "Wir werden bis zum bitteren Ende kämpfen."  
  
 cappadocia_event.52.t: "Armenische Allianz" 
 cappadocia_event.52.desc: "Die Armenier könnten sich als wertvoller Verbündeter für uns erweisen, da einige unserer Interessen übereinstimmen. Vielleicht ist es an der Zeit, den Armeniern die Hand zur Freundschaft zu reichen … eine Anfrage kann schließlich nicht schaden."  
 cappadocia_event.52.a: "Geld wird sie überzeugen, so wie es jeden überzeugt." 
 cappadocia_event.52.b: "Entsendet  kräftige Männer und schaut, was sie dazu sagen." 
  
 cappadocia_event.53.t: "Ein Freund in Kappadokien?"  
 cappadocia_event.53.desc: "Die Kappadokier haben ein Bündnisangebot bis an die Grenzen Armeniens herangetragen, in der Hoffnung, ihrem Volk durch die Verbindung mit uns eine gewisse Stabilität zu verschaffen.\n\nWie sollen wir auf ihre Bitte und ihre Angebote reagieren? Seid euch bewusst, dass sie zweifellos um militärische Hilfe bitten werden, sobald sie wissen, dass sie Verbündete haben, die bereit sind, an ihrer Seite zu kämpfen."  
 cappadocia_event.53.a: "Du hast einen Freund in mir!" 
 cappadocia_event.53.b: "Ein Bündnis? Mit Kappadokien?! Von wegen."  
  
 cappadocia_event.54.t: "Armenien akzeptiert!" 
 cappadocia_event.54.desc: "Das Angebot, das wir Armenien unterbreitet haben, wurde wohlwollend aufgenommen, und nun kehrt ein Bote mit guten Nachrichten zurück. Unsere Feinde werden erzittern, sobald sie erfahren, dass Kappadokien und Armenien in einem Bündnis zusammenstehen!"  
 cappadocia_event.54.a: "Dies wird die Machtverhältnisse in unserer Region verändern."  
  
 cappadocia_event.55.t: "Armenien lehnt ab!"  
 cappadocia_event.55.desc: "Diese dickköpfigen Armenier lehnen unser großzügiges Angebot ab! Ich werde die Beleidigungen, die uns an den Kopf geworfen wurden, nicht wiederholen, damit wir nicht aus Wut unüberlegt reagieren. Aber was sollen wir darauf entgegnen?" 
 cappadocia_event.55.a: "Mal sehen, ob dieses Gold ihre Meinung ändert."  
 cappadocia_event.55.b: "Diese armenischen Hunde … wir brauchen sie nicht" 
  
 cappadocia_event.56.t: "Schon wieder Kappadokien??"  
 cappadocia_event.56.desc: "Interessanterweise haben uns die Kappadokier – obwohl wir uns geweigert haben, ein Bündnis mit ihnen einzugehen – noch mehr Gold geschickt, um uns zu überzeugen. Sie müssen wirklich verzweifelt nach einem Verbündeten suchen – sind sie bereit, ihr Königreich in den Ruin zu treiben, um sich einen Freund zu kaufen?\n\nSollen wir unsere Haltung ändern?" 
 cappadocia_event.56.a: "Sie scheinen verzweifelt genug zu sein, um loyal zu bleiben." 
 cappadocia_event.56.b: "Ha! Wie erbärmlich. Nein."  
  
 cappadocia_event.57.t: "Frage seleukidischer Oberhohheit"  
 cappadocia_event.57.desc: "Derzeit sind wir noch ein Untertan des Seleukidenreichs. Viele Menschen in [ROOT.GetCountry.GetName] sehnen sich jedoch nach der Freiheit, unsere Angelegenheiten selbstständig zu regeln.\n\nAuch wenn unsere militärischen Berater angesichts der Aussicht, den seleukidischen Truppen auf dem Schlachtfeld gegenüberzutreten, besorgt sind, werden sie uns nicht davon abhalten, die Unabhängigkeit zu erklären, wenn wir dies wünschen."  
 cappadocia_event.57.a: "Wir werden Seleukos treu bleiben."  
 cappadocia_event.57.b: "Es ist an der Zeit, sich von diesem Schwein zu befreien." 
  
 cappadocia_event.58.t: "Das seleukidische Ultimatum"  
 cappadocia_event.58.desc: "Boten von [GetCharacter('(int32)24').GetName] haben ein Ultimatum mit ungewöhnlicher Schroffheit überbracht, und dieser Mangel an diplomatischem Taktgefühl zeigt, dass es ihnen völlig gleichgültig ist, wie wir darauf antworten, da sie davon überzeugt sind, dass sie sich am Ende doch durchsetzen werden.\n\nEs liegt nun an [ROOT.GetCountry.GetRuler.GetName], zu entscheiden, ob dies tatsächlich der Fall sein wird."  
 cappadocia_event.58.a: "Ergebt euch friedlich und rettet das Leben der Menschen" 
 cappadocia_event.58.b: "Auf keinen Fall! Wir fürchten [GetCharacter('(int32)24').GetFirstName] nicht."  
  
 cappadocia_event.59.t: "Freiheit von Armenien"  
 cappadocia_event.59.desc: "Viel zu lange haben wir zugelassen, dass die Armenier von ihren befestigten Gebirgspässen aus über unser Land herrschen, ohne Rücksicht auf unser Volk zu nehmen, doch das muss sich ändern.\n\n[ROOT.GetCountry.GetRuler.GetName] hat in [ROOT.GetCountry.GetCapital.GetName] Boten versammelt, um sie mit einer Botschaft zu unserem Oberherrn zu entsenden – wir sind ein freies Volk."  
 cappadocia_event.59.a: "Wir müssen für den Krieg bereit sein..."  
 cappadocia_event.59.b: "Sagt ihnen, dass wir einige Grenzprovinzen beanspruchen ..."  
 cappadocia_event.59.c: "Ehrlich gesagt sehe ich keine Notwendigkeit, etwas zu ändern."  
  
 cappadocia_event.60.t: "Armenien für uns"  #Armenien für uns
 cappadocia_event.60.desc: "Wir würden sehr gerne unsere Vorherrschaft über die Region #E Armenien#! behaupten. Die Frage ist nur, wie wir das erreichen sollen. Einerseits könnten wir versuchen, unsere Vorherrschaft mit Gewalt durchzusetzen, was jedoch zu Blutvergießen führen könnte; andererseits könnte ein diplomatischer Schachzug genauso gut zu einem gewünschten Ergebnis führen." 
 cappadocia_event.60.a: "Das werden wir natürlich fordern." 
 cappadocia_event.60.b: "Gehen wir die Sache diplomatisch an."  
  
 cappadocia_event.61.t: "Forderungen nach Unabhängigkeit"  
 cappadocia_event.61.desc: "An unserem Hof sind Nachrichten von unserem Untertanen, dem [GetCountry('ARI').GetName], eingegangen. Dieser fordert nicht nur seine Unabhängigkeit, sondern erhebt auch Anspruch auf einige unserer westlichsten Gebiete und verlangt deren friedliche Übergabe – was für eine Unverschämtheit!" 
 cappadocia_event.61.a: "Lasst sie einfach gehen … es ist, wie es ist"  
 cappadocia_event.61.b: "Das Land wird ihnen gehören … vorerst."  
 cappadocia_event.61.c: "Für den richtigen Preis können sie es haben."  
 cappadocia_event.61.d: "Niemals!" 
  
 cappadocia_event.62.t: "Freiheit von Armenien"  
 cappadocia_event.62.desc_1: "Wir haben endlich das erreicht, wonach sich unser Volk so lange gesehnt hat – Freiheit. Wir sind nun Herren unseres eigenen Schicksals, und uns erwartet ruhmreiche Zukunft. Wir können nun endlich darauf hinarbeiten, die Heimat von [ROOT.GetCountry.GetRuler.GetName],  zurückzuerobern #Y Persien#!"  
 cappadocia_event.62.desc_2: "Wir haben endlich das erreicht, wonach sich unser Volk so lange gesehnt hat – Freiheit. Wir sind nun Herr unseres eigenen Schicksals, und uns erwartet Ruhm. Unsere überlegenen Ansprüche auf [GetProvince('(int32)1778').GetArea.GetName] und [GetProvince('(int32)1850').GetArea.GetName] brachten uns die [GetCountry('ARM').GetAdjective]e Anerkennung! Auf zum Ruhm!"  
 cappadocia_event.62.desc_3: "Die [GetCountry('ARM').GetAdjective]en Hunde haben unsere Forderungen nach Unabhängigkeit abgelehnt. Nachdem sie bereits unsere Ansprüche auf [GetProvince(‚(int32)1778‘).GetArea.GetName] und [GetProvince(‚(int32)1850‘).GetArea.GetName] abgelehnt haben...nein, sie lehnen sogar unsere grundlegendsten Wünsche ab. Wir werden ihnen jetzt zeigen müssen, wer den anderen in die Knie zwingen kann – keine Gnade für diese Mistkerle!"  
 cappadocia_event.62.a: "Endlich."  
 cappadocia_event.62.b: "Wunderbar."
 cappadocia_event.62.c: "Es herrscht Krieg."  
  
 cappadocia_event.63.t: "Die neuen Achämeniden"  
 cappadocia_event.63.desc: "Wenn man alle Faktoren berücksichtigt, sind wir dann nicht schon fast die Achämeniden geworden – nur noch ohne diesen Namen? Wir könnten jetzt genauso gut ihren Platz einnehmen, oder sollten wir uns vielleicht einen neuen Titel geben, einen, der unsere eigenen Errungenschaften widerspiegelt? Wir werden [ROOT.GetCountry.GetRuler.GetName] die Ehre zuteilwerden lassen, zu entscheiden, wer wir sind."  
 cappadocia_event.63.a: "Den Thron der Achämeniden zurückerobern."  
 cappadocia_event.63.b: "Wir werden fortan als 'Persien' bekannt sein"  
 cappadocia_event.63.c: "Ein neues Vermächtnis schaffen."  
 cappadocia_event.63.d: "Unser Name soll nicht ganz so pompös, aber dennoch beeindruckend sein" 
  
 cappadocia_event.64.t: "Ein gewagter Schachzug" 
 cappadocia_event.64.desc: "[ROOT.GetCountry.GetRuler.GetName] hat in den letzten Monaten heimlich seine Kräfte gesammelt und große Mengen an Gold angehäuft sowie zahlreiche Männer versammelt, die der Sache der #E Eumeniden#! treu ergeben sind. [ROOT.GetCountry.GetRuler.GetFirstName] hatte nie daran gezweifelt, dass sich viele an die Verbrechen gegen seinen Vater erinnern und sich unter seinem Banner versammeln würden, wenn die Zeit gekommen wäre, Gerechtigkeit walten zu lassen.\n\nZum Unglück der perfiden Kappadokier ist dieser Zeitpunkt nun gekommen." 
 cappadocia_event.64.a: "Die Zeit zum Zuschlagen ist gekommen – ich werde den Tod meines Vaters rächen!"  
  
 cappadocia_event.65.t: "Die Kriegsbeute von Kilikien"  
 cappadocia_event.65.desc: "Nun, da #E Kilikien#! und all seine reichhaltigen Ressourcen zu unserer freien Verfügung stehen, stehen wir vor einer entscheidenden Frage: Wie sollen wir den Reichtum verwenden, den wir diesem fruchtbaren Land geraubt haben?"  
 cappadocia_event.65.a: "Alles auf einmal verwenden"  
 cappadocia_event.65.b: "Wir sollten sorgfältig haushalten und davon über viele Jahre hinweg profitieren" 
  
 cappadocia_event.66.t: "Das hellenistische Reich" 
 cappadocia_event.66.desc: "Obwohl viele daran gezweifelt haben, dass wir das erreichen könnten, was wir erreicht haben, hat [ROOT.GetCountry.GetRuler.GetName] die Welt erneut schockiert, indem er das Unmögliche vollbracht hat.\n\nDer einzige noch unentdeckte Ruhm ist das Vermächtnis von [GetCharacter('(int32)39').GetName] selbst."  
 cappadocia_event.66.a: "Ich bin der größte Feldherr, der je gelebt hat, und ich werde es beweisen"  
  
 cappadocia_event.67.t: "Die Kappadokische Reiterei"  
 cappadocia_event.67.desc: "[ROOT.GetCountry.GetRuler.GetName] hat beschlossen, persönlich die Ställe zu besuchen, in denen die gefürchtete #E Kappadokische Reiterei#! außerhalb der Kriegszeiten trainiert. Der [ROOT.GetCountry.GetRulerTitle] war sehr erfreut, die Männer bei ihrer fleißigen Arbeit zu sehen, doch der Grund für den Besuch war keine überraschende Inspektion – es ist an der Zeit, dass unsere Reiter ihre Kampftaktiken verfeinern, und [ROOT.GetCountry.GetRuler.GetFirstName] war vor Ort, um ihnen ihre Befehle zu erteilen."  
 cappadocia_event.67.a: "Stets zuerst zuschlagen."  
 cappadocia_event.67.b: "Konzentration auf den Schutz unserer Flanken" 
  
  # Native 
  
 cappadocia_event.68.t: "Eine einheimische Verwaltung"  
 cappadocia_event.68.desc: "Seit einiger Zeit schon werden wir politisch von allen Seiten bedrängt und müssen sowohl innere als auch äußere  Feinde bekämpfen. Eine Möglichkeit, diesen Druck zu mildern, wäre, viele Einheimische in Machtpositionen zu bringen – ein unpopulärer Weg, aber einer, den wir gezwungenermaßen einschlagen müssen.\n\nNun stellt sich nur noch die Frage: Wen sollen wir wo einsetzen? Eine Frage, die sicherlich zu Streitigkeiten führen wird. Hoffentlich wird dies in Zukunft zu einem starken Kappadokien führen."  
 cappadocia_event.68.a: "Ernennt einheimische #E Kappadokier#!." 
 cappadocia_event.68.b: "Der Weg der alten Pferdefürsten ist auch unserer."  
  
 cappadocia_event.69.t: "Eine einheimische Verwaltung: Widerstand"  
 cappadocia_event.69.desc: "Nicht alle waren mit der Entscheidung einverstanden, Einheimischen den Weg in die Regierung zu ebnen, und fordern nun Garantien und Zugeständnisse ihrer Privilegien; sie drohen mit offener Rebellion, sollten wir diesen Forderungen nicht nachkommen. Wie sollen wir mit diesen Forderungen umgehen?"  
 cappadocia_event.69.a: "Ich fordere sie zur Rebellion heraus!" 
 cappadocia_event.69.b: "Einige Privilegien zugestehen, um den Frieden zu wahren."  
  
 cappadocia_event.70.t: "Ein seltsames Volk" 
 cappadocia_event.70.desc: "Vor kurzem haben einige unserer Späher berichtet, dass sie in den Ebenen unserer ländlichen Gebiete ein seltsames Nomadenvolk beobachtet haben, das eine fremde Sprache spricht, aber unsere eigene beherrscht. Sie reiten auf kleinen Pferden, die kleiner sind, als ein Pferd eigentlich sein dürfte. Nur Fohlen sind so groß, doch diese sind es ganz offensichtlich nicht! \nDiese Menschen sind recht freundlich und offen für Handel; sie sagen, dass sie bereits seit Generationen in dieser Gegend leben. Obwohl sie offenbar gerne zu Pferde von Ort zu Ort ziehen, weisen sie viele Gemeinsamkeiten mit den einheimischen Kappadokiern und Kataoniern auf, mit denen sie sicherlich verwandt sein müssen." 
 cappadocia_event.70.a: "Das ist nur irgendein Stamm."  
 cappadocia_event.70.b: "Wir sollten genauer untersuchen, wer diese Menschen sind."  
  
 cappadocia_event.71.t: "Anatolisches Reich" 
 cappadocia_event.71.desc: "Lange Zeit war Anatolien von fremden Mächten besetzt, zuerst von den Assyrern, dann von den Persern und bis vor kurzem von den Makedonen. Doch heute sind wir hier, frei vom fremden Joch, frei, so zu leben, wie es unsere Traditionen vorschreiben, befreit von fremder Herrschaft. Die Anatolier herrschen wieder über Anatolien!\nEs gibt zwar noch immer kleine Gruppen von Eindringlingen in unserem Land, doch sie haben begonnen, unserem Beispiel zu folgen und leben friedlich in unserem Reich – und wer weiß? Vielleicht werden auch sie in ein paar Generationen Anatolier sein und keine Fremden mehr..."  
 cappadocia_event.71.a: "Wir haben Anatolien wieder groß gemacht."  
  
 cappadocia_event.72.t: "Der kimmerische Traum" 
 cappadocia_event.72.desc: "Vor vielen Generationen kamen unsere Vorfahren aus der Steppe nach Kappadokien und fanden dort eine neue Heimat und Zuflucht. Als sie von den Lydern besiegt wurden, schien alles verloren, und der Traum von einem kimmerischen Reich zerplatzte im Nu. Doch heute stehen wir hier, nachdem wir unsere alten Feinde besiegt und ein Reich für unser Volk geschaffen haben. Die Kimmerer können nun dahin reiten, wohin der Wind sie trägt, ihr Leben in Frieden führen und stets sicher sein, dass es eine Heimat gibt, in die sie zurückkehren können."  
 cappadocia_event.72.a: "Wir hatten einen Traum... und wir haben ihn verwirklicht!"
  
  ### All events below only exist for the pop-up, they aren't necessary beyond that... for task number they are related to look at the events file, it's commented there 
  
 cappadocia_event.80.t: "Unsere Position stabilisieren"  
 cappadocia_event.80.desc: "Bevor wir nach außen aktiv werden, müssen wir sicherstellen, dass unsere Lage im Inland stabil ist – unser Volk ist bereit für die bevorstehenden Herausforderungen!"  
 cappadocia_event.80.a: "Lasst uns uns vorbereiten."  
  
 cappadocia_event.81.t: "Zusammen mit [ROOT.GetCountry.GetOverlord.GetName] stark"  
 cappadocia_event.81.desc: "Die Zukunft unserer Nation ist untrennbar mit dem Schicksal des #E Antigonidenreichs#! verbunden, daher sollten wir, anstatt ihnen im Weg zu stehen, alles in unserer Macht Stehende tun, um unsere Beziehungen zu ihnen zu stärken und unser Ansehen bei ihnen zu verbessern.  
 cappadocia_event.81.a: "Eher Freunde als Feinde."  
  
 cappadocia_event.82.t: "Die Grenzen der Satrapie überschreiten"  
 cappadocia_event.82.desc: "Die Stunde ist gekommen – wir müssen unsere Streitkräfte nach Norden entsenden und #E Pontus#! angreifen, denn wir wollen unsere Grenzen erweitern.\n\nWir rechnen nicht mit allzu großen Widerstand durch die Stämme im Norden, und unsere Soldaten gehen davon aus, dass dies ein schneller und einfacher Feldzug werden wird."  
 cappadocia_event.82.a: "Pontus gehört uns!"  
  
 cappadocia_event.83.t: "Rückforderung der armenischen Diebesbeute"  
 cappadocia_event.83.desc: "Diese heimtückischen #E Armenier#! haben das Chaos in der Region ausgenutzt, um ihre Macht auf unsere Kosten auszubauen, doch diese beschämende Zeiten werden dank uns ein Ende finden!\n\nNun, da wir unsere Kräfte gesammelt haben, lasst uns den Eindringling vertreiben und die Ehre unseres Volkes wiederherstellen." 
 cappadocia_event.83.a: "Unsere Zeit wird kommen … lasst uns beten, dass wir bereit sind." 
  
 cappadocia_event.84.t: "Die reichste Satrapie" 
 cappadocia_event.84.desc: "Die Götter segnen uns mit unermesslichem Reichtum und bestätigen damit, dass es unsere Bestimmung ist, den Reichtum und die Sicherheit zu genießen, die mit dem Amt eines treuen Satrapen einhergehen.\n\nEs heißt sogar, dass [ROOT.GetCountry.GetRuler.GetName] ausschließlich von Silber- und Goldgeschirr speist, so unermesslich ist der Reichtum im [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]en Herrscherhaus." 
 cappadocia_event.84.a: "Wir werden bald so reich sein wie einst Krösus."  
  
 cappadocia_event.85.t: "Persisches Kappadokien"  
 cappadocia_event.85.desc: "Es gibt vieles, was wir von den #E Persern#! in Kappadokien lernen könnten, denn ihre Kultur ist uralt und voller Weisheit.\n\nIn Fragen des Krieges, der Kultur, der Religion, der Geschichte … gibt es viel, was jemand, der sich mit den Persern beschäftigt, lernen könnte, und genau das haben wir vor."  
 cappadocia_event.85.a: "Ihr altes Wissen ist wertvoll."  
  
 cappadocia_event.86.t: "Eine graeko-persische Welt"  
 cappadocia_event.86.desc: "Vergleicht man die #E griechische#! und die #E persische#! Kultur miteinander, so fällt auf, dass beide viele bewundernswerte Eigenschaften aufweisen. Anstatt sie als Gegensätze zu betrachten, sollten wir die besten Aspekte, die sie zu bieten haben, nachahmen und annehmen."  
 cappadocia_event.86.a: "Im Synkretismus liegt Stärke."  
  
 cappadocia_event.87.t: "[ROOT.GetCountry.GetReligion.GetName]es Kappadokien"  
 cappadocia_event.87.desc: "Kappadokien zum [ROOT.GetCountry.GetReligion.GetName]en Glaube bekehren – das ist ein lohnenswertes Ziel. Zwar hat jeder das Recht auf seinen eigenen Glauben, doch unserer ist ganz offensichtlich der beste. Wir hoffen, dass unser Bestreben, die Massen zu bekehren, mit offenen Armen und Herzen aufgenommen wird."  
 cappadocia_event.87.a: "Kappadokien war schon immer persisch." 
  
 cappadocia_event.88.t: "Armenische Präsenz"  
 cappadocia_event.88.desc: "Anstatt sie als Außenseiter zu betrachten, sollten wir die Armenier voll und ganz in die [ROOT.GetCountry.GetAdjective]e Gesellschaft aufnehmen – haben sie sich dieses Recht nicht verdient? Haben sie nicht ihre Loyalität zu unserer Sache unter Beweis gestellt, indem sie ihr Blut vergossen haben, damit wir frei sein können?"  
 cappadocia_event.88.a: "Sie sind eigentlich gar nicht so schlecht..."  
  
 cappadocia_event.89.t: "Eine wahre persische Armee"  
 cappadocia_event.89.desc: "Die alten Perser waren dafür bekannt, ihr Heer äußerst wirkungsvoll einzusetzen, und da wir in ihre Fußstapfen treten, müssen wir selbst über eine echte persische Armee verfügen.\n\nSobald sich herumgesprochen hat, dass wir die Kampftaktiken vergangener Zeiten wiederbeleben, rechnen wir mit einem völligen Zusammenbruch der feindlichen Moral."  
 cappadocia_event.89.a: "Wir werden unbezwingbar sein."  
  
 cappadocia_event.90.t: "Nach Persien" 
 cappadocia_event.90.desc: "Lasst unsere Landsleute wissen, dass unsere Armeen nach #E  Persien#! marschieren – wir brauchen jeden Mann, den wir aufbringen können! Wir sind schon zu weit gekommen, um jetzt einen Rückzieher zu machen – der einzige Weg führt nach vorne!"  
 cappadocia_event.90.a: "Wir marschieren nach Osten!"  
  
 cappadocia_event.91.t: "Tolerantes Reich" 
 cappadocia_event.91.desc: "Wie schon die #E Achämeniden#! in früheren Zeiten werden wir mit denen, die unter unserer Herrschaft stehen, behutsam umgehen, da wir eine Zusammenarbeit bevor
 cappadocia_event.91.a: "In den Schuhen Kyros'."  
  
 cappadocia_event.92.t: "Pontische Expedition" 
 cappadocia_event.92.desc: "Die Küsten von #E Pontus#! wären eine wertvolle Bereicherung für unseren Herrschaftsbereich, da uns der Zugang zum #E Pontus Euxinos#! die Erschließung vieler neuer Möglichkeiten eröffnen würde.\n\nSchon bald werden unsere [ROOT.GetCountry.GetAdjective]en Schiffbauer reichlich zu tun haben, denn wir beabsichtigen, eine Flotte aufzubauen, um dieses Meer zu erkunden." 
 cappadocia_event.92.a: "Schließlich geht es hier um die Erforschung."  
  
 cappadocia_event.93.t: "Pontische Besitztümer" 
 cappadocia_event.93.desc: "Da wir viele der bedeutenden Städte an der pontischen Küste beherrschen, haben wir enorme Vorteile daraus gezogen.\n\nAlle Nationen der Region nehmen unsere Präsenz in ihren Gewässern widerwillig hin, und obwohl einige Länder es lieber sähen, wenn wir auf der anatolischen Hochebene blieben, behalten sie diese Meinung für sich."  
 cappadocia_event.93.a: "Wir suchen hier nur Freundschaft … das versprechen wir"  
  
 cappadocia_event.94.t: "Die Perser akzeptieren" 
 cappadocia_event.94.desc: "Wir müssen die Tatsache akzeptieren, dass die #E Perser#! schon lange in dieser Region leben, und anstatt sie an unsere Gewohnheiten anzupassen, müssen wir lernen, in Frieden zusammenzuleben." 
 cappadocia_event.94.a: "Die Kinder von Eran werden gut behandelt werden." 
  
 cappadocia_event.95.t: "Rache für Eumenes"  
 cappadocia_event.95.desc: "Die für den Mord an #E Eumenes von Kardia#! verantwortlichen Verbrecher haben ihre Strafe erhalten, und [ROOT.GetCountry.GetRuler.GetName] hat dafür gesorgt." 
 cappadocia_event.95.a: "Sie verdienen einen angemessenen Tod … Möge die Erde sanft auf dir ruhen, Eumenes." 
  
 cappadocia_event.96.t: "Anatolien sichern"  
 cappadocia_event.96.desc: "Mit der Kontrolle über #E Anatolien#! ist ein neuer Tag angebrochen – das Zeitalter des #E Eumenidenreichs#!!\n\nUnsere Feinde ziehen sich in die Wildnis zurück, lecken ihre Wunden und schmieden vergeblich Intrigen gegen [ROOT.GetCountry.GetRuler.GetName]. Die Götter sind auf unserer Seite, und kein Mensch wird dem Eumenidenreich standhalten können!" 
 cappadocia_event.96.a: "Wir sind nicht aufzuhalten!"  
  
 cappadocia_event.97.t: "Das Reich der Antigoniden ausmerzen"  
 cappadocia_event.97.desc: "In einer Wendung des Schicksals waren wir es, die den Antigoniden den Todesstoß versetzt haben – alle wissen, dass wir dafür verantwortlich sind, ihr Reich ein für alle Mal zerstört zu haben.\n\nUm diese unvergleichliche Leistung zu feiern, soll in [ROOT.GetCountry.GetCapital.GetName] eine riesige Parade stattfinden, um [ROOT.GetCountry.GetRuler.GetName] dafür zu ehren, dass er uns zum Sieg geführt hat." 
 cappadocia_event.97.a: "Das Glück ist unbeständig, mein Feind – eine zu spät gelernte Lektion." 
  
 cappadocia_event.98.t: "Alexanders Vision" 
 cappadocia_event.98.desc: "Jeder weiß, dass [GetCharacter('(int32)39').GetName] danach strebte, größere Gebiete zu erobern als irgendjemand vor ihm, aber letztendlich scheiterte er bei der Verwirklichung seiner Ziele – wir werden dort Erfolg haben, wo der Makedone gescheitert ist."  
 cappadocia_event.98.a: "Vorbei an den Bergen gehen wir!"  
  
 cappadocia_event.99.t: "Griechisches Erbe"  
 cappadocia_event.99.desc: "Wir haben beschlossen, unser griechisches Erbe anzunehmen, auch wenn die Makedonen darüber verärgert sein werden – letztendlich überwiegen die Vorteile die Nachteile."  
 cappadocia_event.99.a: "Wir sind ebenfalls Griechen."  
 cappadocia_event.99.b: "Unser Vorfahr war Grieche, aber wir haben uns verändert. Lasst uns die Vergangenheit ehren." 
  
 cappadocia_event.100.t: "Beschützer der Argeaden"  
 cappadocia_event.100.desc: "All jene Verräter, die persönlichen Ruhm über ihre Eide stellten, liegen nun in ihren Gräbern, und [ROOT.GetCountry.GetRuler.GetName] steht unangefochten an der Spitze und wird als wahrer Beschützer der Argeaden anerkannt."  
 cappadocia_event.100.a: "Alexander beobachtet uns voller Stolz."  
  
 cappadocia_event.101.t: "Der letzte Königstreue"  
 cappadocia_event.101.desc: "In einer Welt, in der das Licht des wahren adeligen Geistes fast vollständig erloschen ist, lodert in [ROOT.GetCountry.GetCapital.GetName] – der Heimat des unvergleichlichen [ROOT.GetCountry.GetRuler.GetName], des letzten Königstreuen– eine helle Flamme."  
 cappadocia_event.101.a: "Und dann war da einer..."  <
  
 cappadocia_event.102.t: "Das Handelszentrum von Mazaka"  
 cappadocia_event.102.desc: "Die Hauptstadt von Kappadokien, #E Mazaka#!, befindet sich in einer hervorragenden Lage, die wir zweifellos zum führenden Handelszentrum der Region ausbauen könnten – wir werden sehen, was wir im Laufe der Zeit erreichen können."  
 cappadocia_event.102.a: "Die Märkte sollen mit den besten Waren gefüllt werden, die man für Gold kaufen kann."  
  
 cappadocia_event.103.t: "Der Palast von Gazioura"  
 cappadocia_event.103.desc: "In längst vergangenen Zeiten war die bescheidene Provinz [GetProvince('(int32)7998').GetName] die Residenz der Könige von #E Pontus#!, und es würde [ROOT.GetCountry.GetName] großen Ruhm einbringen, diesen verlassenen Ort wieder zu seinem früheren Glanz zu führen."  
 cappadocia_event.103.a: "Wahrlich herrlich. Lasst uns fortfahren, ohne Kosten zu scheuen."  
  
 cappadocia_event.104.t: "Prestigeträchtige Kultur" 
 cappadocia_event.104.desc: "Wer würde nicht gerne [ROOT.GetCountry.GetPrimaryCulture.GetName] sein, wenn man alles in allem betrachtet? Sie sind Eroberer, unübertroffen im Kampf, gerissen und geschickt … da ist es nur verständlich, dass man sich dieser angesehenen Kultur anschließen möchte."  
 cappadocia_event.104.a: "In der Tat ist unsere Kultur etwas, das man verehren sollte." 
  
 cappadocia_event.105.t: "Die unterirdischen Städte erweitern"  
 cappadocia_event.105.desc: "Als in vergangenen Zeiten gefährliche Bedrohungen auftauchten, flüchtete sich unser Volk in unterirdische Städte, die direkt in den Fels der Erde gehauen waren. Auch wenn viele das vielleicht nicht glauben mögen: Diese Zeiten der Not sind noch immer nicht vorbei, daher sollten wir diese Städte ausbauen, solange wir noch Zeit dazu haben." 
 cappadocia_event.105.a: "Unter der Erde ist das Wetter immer schön."  
  
 cappadocia_event.106.t: "Regierung in Tyana"  
 cappadocia_event.106.desc: "Die Stadt [GetProvince('(int32)1951').GetName] liegt an einem wichtigen Verkehrsknotenpunkt und verdient unsere besondere Aufmerksamkeit – ihre günstige Lage macht sie zu einem naheliegenden Kandidaten für eine verstärkte [ROOT.GetCountry.GetAdjective]e Präsenz."
 cappadocia_event.106.a: "Dann soll es so sein."  
  
 cappadocia_event.107.t: "Kappadokische Ausbildung" 
 cappadocia_event.107.desc: "Wir haben die Kriegskunst in dem unwegsamen Gelände, das uns umgibt, perfektioniert, und ganz gleich, ob wir über die Ebenen galoppieren oder einen Hügel hinaufstürmen – unsere Truppen werden stets den Sieg davontragen."  
 cappadocia_event.107.a: "Wir verfügen über überlegene Kampfkraft, die im Kampf erworben wurde." 
  
 cappadocia_event.108.t: "Kappadokische Küste"  
 cappadocia_event.108.desc: "Wir haben uns den Weg bis an die Küsten erkämpft – eine sensationelle militärische Leistung, die es wert ist, in ganz [ROOT.GetCountry.GetName] gefeiert zu werden. Wir haben nun Zugang zu ausländischen Märkten, die auf dem Landweg zu weit entfernt sind – das verändert alles." 
 cappadocia_event.108.a: "Perfekt; importiert Waren von höchster Qualität." 
  
 cappadocia_event.109.t: "Kilikisches Unterfangen"  
 cappadocia_event.109.desc: "In der Region #E Kilikien# gibt es alles, was man sich nur wünschen kann: fruchtbares Ackerland, prachtvolle Städte, ertragreiche Bergwerke und fruchtbare Felder. Da wir nun die Hüter dieses kostbaren Landes sind, sollten wir Maßnahmen ergreifen, um unsere maritime Präsenz in der Region auszubauen – die Kontrolle über das #E Mare Cilicium# muss in unseren Händen liegen."  
 cappadocia_event.109.a: "Unsere Flotte wird das Meer selbst bedrohen."  
  
 cappadocia_event.110.t: "Die Stadt des Honigs" 
 cappadocia_event.110.desc: "[GetProvince('(int32)1854').GetName] - schon allein die Erwähnung des Ortes, an dem solch köstlicher Honig produziert wird, lässt einem das Wasser im Mund zusammenlaufen. Lasst uns die Region ausbauen, damit wir mehr von dem süßen, gelben Stoff herstellen können … und damit meinen wir Gold."  
 cappadocia_event.110.a: "Mmm...flüssiges Gold..." 
  
 cappadocia_event.111.t: "Freies Schicksal"  
 cappadocia_event.111.desc: "Es gibt Grund zum Feiern in [ROOT.GetCountry.GetCapital.GetName], denn wir sind endlich eine freie Nation! Ein Geist der Dankbarkeit hat unser Volk erfasst und überall in [ROOT.GetCountry.GetName] finden spontane religiöse Feiern statt, bei denen den Göttern für die Siege gedankt wird, die sie uns beschert haben."  
 cappadocia_event.111.a: "Freiheit!!!"  
  
 cappadocia_event.112.t: "Ein überstandener Sturm" 
 cappadocia_event.112.desc: "Obwohl wir mit einer überraschend großen Anzahl von Konflikten zu kämpfen hatten, haben wir die stürmischen Zeiten unbeschadet überstanden – ein Beweis für unsere Stärke und unsere Entschlossenheit, angesichts von Widrigkeiten nicht nachzugeben."  
 cappadocia_event.112.a: "Wir sind die Besten und unübertroffen in allem, was wir tun." 
  
 cappadocia_event.113.t: "Das unterirdische Stadtnetz erweitert" 
 cappadocia_event.113.desc: "Die wundersamen unterirdischen Städte in unserem Reich erfreuen sich großer Beliebtheit – sowohl bei unserem Volk als Wohnort als auch in fremden Ländern wegen ihrer Einzigartigkeit. Wir sollten diese Städte ausbauen und weitere errichten, was uns sicherlich zugutekommen wird." 
 cappadocia_event.113.a: "Ein besonderer Dank geht an unsere Ingenieure"
  
 cappadocia_event.114.t: "Unterirdischer Stadtknotenpunkt" 
 cappadocia_event.114.desc: "[GetProvince(‚(int32)7981‘).GetName] ist eine wichtige unterirdische Stadt in unserem Netzwerk, in der zahlreiche Menschen und Waren durch die großen unterirdischen Hallen strömen und über die Gänge in die Außenwelt gelangen. Wenn wir dafür sorgen, dass alle Waren und Menschen diesen Ort sicher passieren können, wird dies sicherlich den Handel in der Region stabilisieren und mehr Menschen anziehen – und Menschen sind die Grundlage jeder Zivilisation."  
 cappadocia_event.114.a: "Achtet darauf, nicht nur gerade nach unten zu graben." 
 cappadocia_event.115.t: "Das Land der Vorfahren zurückerobern"  
 cappadocia_event.115.desc: "Unsere #Y kappadokischen#! Brüder, die in #Y Pontus#! leben, waren einst Teil unseres Landes, sie sind Teil unserer Geschichte. Wir sollten die beiden Teile wieder vereinen ..."  
 cappadocia_event.115.a: "Zeit für ein Familientreffen."  
  
 cappadocia_event.116.t: "Kappadokisches Reich" 
 cappadocia_event.116.desc: "Ein Reich für ein Volk – das ist ein Traum. Natürlich kann dieses Reich auch anderen Völkern eine Heimat sein, aber dies ist unsere Geschichte."  
 cappadocia_event.116.a: "So wie es sein sollte." 
  
 cappadocia_event.117.t: "Unterirdische Infrastruktur" 
 cappadocia_event.117.desc: "Waren und Lebensmittel müssen stets in ausreichender Menge verfügbar sein, damit niemand von Hunger oder Not bedroht ist. Glücklicherweise waren unsere Herrscher weise genug, dies vorauszusehen..."  
 cappadocia_event.117.a: "*Auch weise und mächtig. Und gutaussehend, wenn ich das selbst sagen darf."  
  
 cappadocia_event.118.t: "Unabhängigkeit sichern" 
 cappadocia_event.118.desc: "Um unsere Freiheit zu bewahren, brauchen wir eine gut ausgerüstete stehende Armee, die jederzeit bereit ist, unsere Grenzen zu verteidigen.\n\nGlücklicherweise teilen alle einfachen Soldaten diese Ansicht; wir haben alle zu viel geopfert, um dorthin zu gelangen, wo wir heute stehen, und niemand möchte eine Rückkehr zu den alten Zeiten erleben."  
 cappadocia_event.118.a: "Wir werden sie nie wieder verlieren." 
 cappadocia_event.119.t: "Komplizen"  
 cappadocia_event.119.desc: "Obwohl wir unseren fremden Verbündeten bis zu einem gewissen Grad vertrauen, ist es offensichtlich, dass wir eine engere Verbindung zu unseren Verwandten verspüren würden."  
 cappadocia_event.119.a: "Wir vertrauen unseren Verwandten, aber jeder andere ist verdächtig"  
  
 cappadocia_event.120.t: "Der Wiederaufstieg der Cimmerier"  
 cappadocia_event.120.desc: "Unsere längst verstorbenen Vorfahren haben uns ein Erbe hinterlassen, ein Erbe, das wir angenommen haben und leben. Ein Erbe, das wir wiederbeleben werden!" 
 cappadocia_event.120.a: "Tradition! Geschichte! Wir stehen wieder auf!"  
  
 cappadocia_event.121.t: "Vermischung mit den Anatoliern"  
 cappadocia_event.121.desc: "Im Laufe der Jahrhunderte der Vermischung mit den einheimischen Kappadokiern und Kataoniern ist der heutige #E Kimmerier#! nicht mehr derselbe Kimmerier, der seine Vorfahren waren.\ n\nMan sagt, die alten Cimmerier seien schwarzhaarig gewesen, mit dunklen Augen und dem Schwert in der Hand; Diebe, Plünderer, Mörder, mit tiefer Melancholie und unbändiger Fröhlichkeit, und man sagt, sie hätten die juwelenbesetzten Throne der Erde unter ihren Sandalen zertreten. Dennoch ist eine Veränderung nicht immer etwas Schlechtes..." 
 cappadocia_event.121.a: "Die anatolischen Frauen sind hübsch..."  
  
 cappadocia_event.122.t: "Der Aufstieg der Pferdefürsten"  
 cappadocia_event.122.desc: "Im Geiste unserer nomadischen Wurzeln haben wir uns im ganzen Land der Lebensweise der Reiter verschrieben. Mit ihnen werden wir allen Reichen die Botschaft vom neuen Aufschwung der Pferdefürsten überbringen. Manchen von uns mit Pfeil und Bogen in der Hand."  
 cappadocia_event.122.a: "Wir galoppieren einen neuen Weg entlang!"  
  
 cappadocia_event.123.t: "Die alten Kimmerer rächen" 
 cappadocia_event.123.desc: "Die alten #E Kimmerer#! wurden von den #E Lydern#! und den #E Phrygern#! besiegt – eine Niederlage, die für unsere Lebensweise fast den kulturellen Untergang bedeutete. Nun haben wir unsere Vorfahren gerächt und unser Fortbestehen gesichert." 
 cappadocia_event.123.a: "Kalt servierte Rache ist so süß."  
  
 cappadocia_event.124.t: "Vorstoß nach Osten" 
 cappadocia_event.124.desc: "Im Osten liegen die alten, reichen Zivilisationen. Einige kamen einst in unser Land und unterwarfen unser Volk. Jetzt kommen wir, um den Gefallen zu erwidern." 
 cappadocia_event.124.a: "Oh, wie sich das Blatt gewendet hat ..."  
  
 cappadocia_event.125.t: "Die alte Heimat" 
 cappadocia_event.125.desc: "Wir reiten in die alte Heimat, befreien die Steppen von der Fremdherrschaft und nehmen Kontakt zu den Verwandten unserer Vorfahren auf. Während unsere Vermischung mit den #Y Kappadokiern#! unser Volk verändert hat, halten die Nomadenstämme immer noch an alten Traditionen fest, die von Stamm zu Stamm unterschiedlich sind. Einige Stimmen behaupten, wir müssten zu den Gewohnheiten unserer Vorfahren zurückkehren, andere sagen, dass sich unser Volk dafür zu sehr verändert habe und dass wir das Beste aus der neuen Kultur machen sollten, die aus dieser Vermischung hervorgegangen sei."  
 cappadocia_event.125.a: "Entscheidungen, Entscheidungen ... wir haben Entscheidungen zu treffen" 
  
 cappadocia_event.126.t: "Der flammende Lotus" 
 cappadocia_event.126.desc: "Der Tempelstaat Zela war die Heimat eines der frühesten Feuerkulte in Kleinasien, dessen Ursprung mit der legendären Niederlage der Saken durch Kyros den Großen verbunden ist. Zum Gedenken an diesen Sieg wurde ein großer Tempel aus weißem Marmor im korinthischen Stil errichtet und zu seinen Ehren ein jährliches Fest namens Sacaea ins Leben gerufen. Dieses von Strabon beschriebene Fest wies auffallende Ähnlichkeiten mit bacchischen Ritualen auf, bei denen Männer, geschmückt mit skythischen Gewändern, den ganzen Tag und die ganze Nacht mit Frauen ausschweiften, tranken und fröhlich waren. Die Regierungsführung von Zela ähnelte stark der von Comana Pontica, mit ihrer theokratischen Struktur, die sich auf eine mächtige Priesterschaft konzentrierte. Wie es in Anatolien üblich war, übten die Priester des Tempels die Kontrolle über das gesamte umliegende Gebiet aus, das von zahlreichen Tempeldienern und Priestern bevölkert war. Der Tempel war nicht nur ein Ort des Feierns, sondern auch ein Zentrum religiöser Aktivitäten, die sowohl mit dem zoroastrischen als auch mit dem anatolischen Pantheon verbunden waren. In der lokalen Mythologie wurden die Göttin Artemis Anaitis und der Gott Men als Mutter-Sohn-Duo verehrt, das persische und anatolische Traditionen vereinte." 
 cappadocia_event.126.a: "Vielleicht werde ich dieses Jahr am Sacaea-Fest teilnehmen."  
 cappadocia_event.126.tt: "$mission_completed_tooltip_1$ '#Y $cappadocia_mission_inv_23C_task$#!' $mission_completed_tooltip_2$"  
  
 cappadocia_event.127.t: "Kleines Korinth" 
 cappadocia_event.127.desc: "Das Gebiet von Comana Pontica erstreckte sich entlang des Iris, was der Stadt eine beträchtliche landwirtschaftliche Fläche sowie Verkehrsverbindungen nach Armenien und zu anderen Städten des Pontus verschaffte. Hier befand sich einer der bedeutendsten Tempel der Region, der der Göttin Ma geweiht war. Der Ma-Kult wurde später nach Comana in Kappadokien gebracht. Die Bürger von Comana Pontica erlangten großen Reichtum durch die Weinberge sowie durch die Kaufleute und deren Kunden, die während des zweimal jährlich stattfindenden großen Festes in die Stadt kamen. Strabon merkt an, dass die Vielzahl der der Göttin Ma geweihten Prostituierten die Stadt gewissermaßen zu einem „kleinen Korinth“ machte. 6.000 heilige Sklaven, sogenannte Hierodouloi, bewirtschafteten die Felder des Tempelgeländes und waren dem Dienst an Ma geweiht. Sie genossen eine beneidenswerte Stellung, da ihnen Unverletzlichkeit gewährt wurde. Das Territorium des Tempelstaates Comana Pontica sollte erheblich erweitert werden, sobald es unter römische Herrschaft fiel." 
 cappadocia_event.127.a: "Ich werde etwas von diesem Wein probieren müssen."  
 cappadocia_event.127.tt: "$mission_completed_tooltip_1$ '#Y $cappadocia_mission_inv_23D_task$#!' $mission_completed_tooltip_2$"  
