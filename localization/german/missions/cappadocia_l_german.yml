  #mission 
 cappadocia_mission_inv: "Kappadokisches Schicksal" 
 cappadocia_mission_inv_DESCRIPTION: "Kappadokien hat einige turbulente Jahrzehnte hinter sich und hat nun zahlreiche Wege für seine Zukunft vor sich. Von den persischen Ariarathiden bis hin zu einer Rückeroberung durch die Einheimischen – wer weiß schon, was die Zukunft für Kappadokien bereithält?"  
 cappadocia_mission_inv_CRITERIA_DESCRIPTION: "Wir werden Kappadokien in die Zukunft führen, nachdem wir den Weg gewählt haben, den wir einschlagen wollen, was in den meisten Fällen zu einem gewaltigen Reich führen wird, das den größten Teil Anatoliens umfasst." 
  
