 caria_missions_task_11: "Unter den Flügeln des Adlers"  
 caria_missions_task_11_DESC: "Die Welt wird von Jahr zu Jahr düsterer. Die Diadochen bekämpfen sich unablässig, Piraten suchen die Meere heim und die Ambitionen brutaler Generäle nehmen mit jeder verstrichenen Jahreszeit zu. In solchen Zeiten muss Besonnenheit vor Stolz stehen.\n\nUnser jüngstes Bündnis mit den Ptolemäern hat Reichtum und Anerkennung gebracht, aber wir müssen uns jetzt fragen, ob eine engere Bindung erforderlich ist. Indem wir offiziell ein ptolemäischer Satrap werden, können wir ein gewisses Maß an Souveränität gegen dauerhafte Sicherheit eintauschen. Der ägyptische Adler wird seinen Schatten über unser Land werfen, aber unter seinen Flügeln werden wir bestehen."  
 caria_missions_task_11_tt: "[THIS.GetCountry.GetName] hat die Möglichkeit, eine #E @[GetCountry('EGY').GetFlag] zu werden!  [GetCountry('EGY').GetAdjective]e#! #Y Satrapie#! zu werden. Folgendes wird passieren, wenn wir #G#! akzeptieren#!:\n\n"  
  
 caria_missions_task_12: "Im Schatten des Löwen"  
 caria_missions_task_12_DESC: "Die Welt wird von Jahr zu Jahr düsterer. Die Diadochen bekämpfen sich unablässig, Piraten suchen die Meere heim und die Ambitionen brutaler Generäle nehmen mit jeder verstrichenen Jahreszeit zu. In solchen Zeiten muss Besonnenheit vor Stolz stehen.\n\nUnser jüngstes Bündnis mit Lysimachos hat uns Stärke und Ansehen gebracht, doch der Löwe ist nicht leicht gesättigt. Sein Hunger nach Territorium und Vorherrschaft ist wohlbekannt, und schon richtet er seinen wachsamen Blick auf die Ägäis. Indem wir offiziell zu Satrapen der Lysimachiden werden, tauschen wir vielleicht ein Stück Souveränität gegen dauerhafte Sicherheit ein. Der thessalische Löwe wird seinen Schatten über unser Land werfen, doch unter seiner Mähne werden wir bestehen."
 caria_missions_task_12_tt: "[THIS.GetCountry.GetName] hat die Möglichkeit, eine #E @[GetCountry('TRE').GetFlag]!  [GetCountry('TRE').GetAdjective]e#! #Y Satrapie#! zu werden. Folgendes wird passieren, wenn wir #G#! akzeptieren#!:\n\n"  
  
 caria_missions_task_13: "Neben dem Elefanten" 
 caria_missions_task_13_DESC: "Die Welt wird von Jahr zu Jahr düsterer. Die Diadochen bekämpfen sich unablässig, Piraten suchen die Meere heim und die Ambitionen brutaler Generäle nehmen mit jeder verstrichenen Jahreszeit zu. In solchen Zeiten muss Besonnenheit vor Stolz stehen.\n\nUnser jüngstes Bündnis mit den Seleukiden hat uns Reichtum und mächtige Verbündete beschert, doch der #E Herr der Elefanten#! ist nicht leicht zufriedenzustellen. Sein Streben nach Territorium und Vorherrschaft ist wohlbekannt, und schon jetzt richtet er seinen wachsamen Blick auf die Ägäis. Indem wir offiziell zu seleukidischen Satrapen werden, tauschen wir vielleicht ein Stück Souveränität gegen dauerhafte Sicherheit ein. Besser, an der Seite des Ungeheuers zu gehen, als unter ihm zermalmt zu werden."  
 caria_missions_task_13_tt: "[THIS.GetCountry.GetName] hat die Möglichkeit, eine #E @[GetCountry('SEL').GetFlag]! [GetCountry('SEL').GetAdjective]e#! #Y Satrapie#! zu werden! Folgendes wird passieren, wenn wir #G#! akzeptieren#!:\n\n" 
  
 caria_missions_task_14: "Mauern von Halikarnassos" 
 caria_missions_task_14_DESC: "Halikarnassos trotzte einst dem größten Eroberer seiner Zeit. Als Alexander die Stadt im Jahr 334 v. Chr. belagerte, hielt sie unter dem Kommando von Memnon von Rhodos monatelang stand, und obwohl sie schließlich fiel, verdiente sich ihre Verteidigung den Respekt ganz Hellas’. Seitdem wechselte Halikarnassos mehr als einmal den Besitzer, während die Diadochen wie Wölfe um die Beute des Reiches kämpften.\n\nDoch damit ist nun Schluss. Mögen die Könige und Satrapen noch so sehr intrigieren – Halikarnassos wird nicht ihre Beute sein. Wir werden ihre Mauern wiederaufbauen, ihre Häfen verstärken und ihre Türme wiederherstellen. Die Stadt wird als uneinnehmbare Bastion der karischen Macht stehen, und wer versucht, sie einzunehmen, muss einen schrecklichen Preis zahlen."  
  
 caria_missions_task_15: "Erben von Hekatomnos" 
 caria_missions_task_15_DESC: "Das Haus der Hekatomniden führte Karien zu seiner Blütezeit. Von ihrem Stammsitz in Mylasa aus stiegen die Hekatomniden als Satrapen von Karien und Herrscher sowohl über das Hochland als auch über die Küstengebiete zur Macht auf. Unter Mausolos und Artemisia erlangte Halikarnassos Ruhm: Seine Denkmäler konnten sich mit denen antiker Dynastien messen, seine Flotten beherrschten die Meere, und an seinem Hof versammelten sich Dichter, Gelehrte und Soldaten. Selbst in ihrer Untergangszeit bestand die Dynastie in Ehren fort: Königin Ada, die Letzte der Hekatomniden, adoptierte Alexander den Großen als ihren Sohn. Nun, da Halikarnassos wieder gesichert ist, ist es nur angemessen, dass wir die Herrschaft darüber einem Nebenzweig dieses edlen Hauses anvertrauen." 
 caria_missions_task_15_tt: "Ein #E Hekatomnide#! wird zum Herrscher von #E @[GetCountry('HKS').GetFlag]!  [GetCountry('HKS').GetName]#!"  
  
 caria_missions_task_16: "Wiederherstellung der Hekatomniden"  
 caria_missions_task_16_DESC: "Zu lange schon hat Karien vor den Persern, den Makedonen und den selbsternannten Königen, die keine Wurzeln in unserem Boden hatten, die Knie gebeugt. Nicht mehr. Karien erinnert sich. In den Bergheiligtümern von Mylasa, in den Hafentavernen von Halikarnassos, in den Herzen der Menschen leben die alten Loyalitäten weiter. Es gibt Gerüchte von einem Aufstand, von Rache, von Wiederherstellung.\n\nEs ist an der Zeit. Karien soll wieder von den Kariern regiert werden. Die Erben des Hekatomnos werden das zurückerobern, was ihnen rechtmäßig zusteht – nicht als Satrapen, sondern als Herrscher. Der Usurpator möge zittern. Die Revolution steht bevor! Schon erreichen uns Berichte über eine Verschwörung gegen [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName]. In den Hallen [ROOT.GetCountry.GetRuler.GetHerHis]es Palasts  werden im Schatten Dolche gezückt, und in goldenen Bechern schlummert Gift."  
 caria_missions_task_16_tt: "Wir können uns dafür entscheiden, einzugreifen und [THIS.GetCountry.GetRuler.GetName] zu retten, oder die Fortsetzung des Attentats zuzulassen.\n\nWenn die Verschwörung #G erfolgreich#! ist, wird Folgendes passieren:\nEin #Y Hekatomnide#! wird der Herrscher von [THIS.GetCountry.GetName]"  
  
 caria_missions_task_17: "Kaunische Münzen"  
 caria_missions_task_17_DESC: "Während die materiellen Überreste von Kaunos die Gründung oder frühe Nutzung des Ortes höchstens auf das 9. Jahrhundert v. Chr. datieren, reicht die überlieferte Geschichte der Stadt bis zu ihrem Namensgeber Kaunos zurück, dem Sohn des karischen Königs Miletos und der Najade Kyane. Es heißt, dass sich Kaunos und seine Schwester Byblis ineinander verliebten und dass Kaunos, um Inzest zu vermeiden, vor ihr bis nach Lykien in Anatolien floh. Dorthin folgte ihm Byblis, verfiel jedoch in Trauer und Wahnsinn und starb; sie verwandelte sich in eine Quelle, vergoss unaufhörlich Tränen über das Land und schuf mit ihren tränenreichen Augen den Fluss Kalbys. In Asien heiratete Kaunos die Nymphe Pronoe und zeugte einen Sohn, Aegialus, der später in der Nähe eine Stadt gründete, die nach seinem Vater benannt wurde. Die Stadt selbst war ein hervorragender Handelshafen mit zwei aktiven Häfen, und Herodot berichtet, dass die Einwohner der Stadt hartnäckig gegen den persischen Feldherrn Harpagus kämpften – sie unterlagen jedoch nach einiger Zeit. Der Historiker merkt außerdem an, dass er zwar persönlich ihrer Behauptung, ausländischer Herkunft zu sein, nicht zustimmt, da sie eine Sprache sprechen, die der seiner Heimat ähnelt, er jedoch nicht leugnen kann, dass sie sich auf eigentümliche Weise verhalten, anders als alle anderen Karer und Lykier. Alle Männer, Frauen und sogar die Kinder trinken gemeinsam Wein.\n\nWenn wir den Ehrgeiz hegen, zu den Erben Alexanders zu gehören, müssen wir es ihnen gleichtun. Wir werden in Kaunos eine königliche Münzstätte errichten und dort Münzen in unserem Namen prägen."  
 caria_missions_task_17_tt: "#E Kaunos#! kann als #E @[THIS.GetCountry.GetFlag]! [THIS.GetCountry.GetAdjective]er#! #Y Bundesgenosse#! entlassen werden"  
  
 caria_missions_task_18: "Herr von Lykien" 
 caria_missions_task_18_DESC: "Mausolos, der große Architekt der karischen Macht, wusste, dass ein Imperium nicht von einer Hand allein errichtet werden kann. Um seine Südgrenze zu sichern, vertraute er die Herrschaft über Lykien seinem Bruder Pixodaros an. Wir täten gut daran, seinem Beispiel zu folgen. Die lykischen Städte, von Xanthos bis Patara, sind stolz und widerspenstig, aber strategisch wichtig"  
 caria_missions_task_18_tt: "[THIS.GetCountry.GetName] erhält Ansprüche auf die Gebiete #Y Lycia#!, #Y Milyas#!, #Y Pisidia#!, und #Y Pamphylia#!"
  
 caria_missions_task_19: "Die Haarsteuer" 
 caria_missions_task_19_DESC: "Der Hyparch Kondalos, der zur Regierung Lykiens entsandt wurde, bemerkte einmal, dass die Einheimischen ihr Haar im Gegensatz zu den glattrasierten Kariern lang trugen. Kondalos witterte eine Gelegenheit und verkündete dem Volk, dass der Großkönig Artaxerxes Haare für Pferdeperücken benötige und dass jeder Lykier sich den Kopf rasieren und die abgeschnittenen Haare an den königlichen Hof schicken müsse. Wer sich weigerte, konnte stattdessen in Silber bezahlen. Kein Haar hat die Provinz jemals verlassen, aber Kondalos' Plan steigerte die Einnahmen erheblich.\n\nWir werden diese Tradition mit angemessenen Anpassungen an unsere Zeit wiederbeleben. Nennt es Tribut, nennt es Brauch, so oder so wird von den unterworfenen Völkern in unserem Reich erwartet, dass sie ihren Anteil zahlen, in Silber oder in Haaren" 
 caria_missions_task_19_tt: "Jede #R nicht integrierte#! Kultur erhält den folgenden Modifikator:"  
  
 caria_missions_task_20: "Asiatische Expedition" 
 caria_missions_task_20_DESC: "Die Westküste Kleinasiens ist ein Flickenteppich aus Stadtstaaten, Bundesstädten und verblassenden Satrapien. Viele dieser Städte zahlten einst Mausolos Tribut oder kämpften an der Seite von Artemisia. Einige sind unter dem Einfluss makedonischer Generäle geraten oder klammern sich hinter bröckelnden Mauern an hohle Freiheiten. Die asiatische Küste ist unser Erbe.\n\nEs ist an der Zeit, eine Expedition vorzubereiten, um unsere Herrschaft über Asia für kommende Generationen zu sichern."  
  
 caria_missions_task_21: "Dynast von Derbe"  
 caria_missions_task_21_DESC: "Das Hochland von Lykaonien ist nach wie vor zerklüftet und unbeansprucht, ein wildes Land mit befestigten Städten, Stammeshäuptlingen und Bergfestungen. Zu diesen gehört die Stadt Derbe, die in der Nähe der Pässe zwischen Isauria und der Kilikischen Ebene liegt. Ein Mitglied unseres Hauses soll für eine Expedition nach Derbe ausgerüstet und finanziert werden. Mit genügend Gold, Waffen und [ROOT.GetCountry.GetAdjective]er Unterstützung könnte er sich einen Platz als Herrscher erkämpfen und die Region an unsere Linie binden."  
 caria_missions_task_21_tt: "#E Derbe#! wird ein #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]er#! #Y Bundesgenosse#!"  
  
 caria_missions_task_22: "Das Hinterland kultivieren"  
 caria_missions_task_22_DESC: "Auch wenn unsere Küstenstädte in Marmor erstrahlen, liegt das wahre Herzstück von [ROOT.GetCountry.GetName] im Landesinneren – in den Tälern, Hügeln und verstreuten Dörfern, die unsere Städte versorgen und uns Soldaten für unsere Armeen bereitstellen. Wir müssen unseren Blick auf die Hirten, Bauern und Siedler richten, die unsere Stärke erhalten. Mit bescheidenen Zuschüssen und beständiger Betreuung haben wir das Landesinnere zum schlagenden Herzen der [ROOT.GetCountry.GetAdjective]en Macht gemacht. Mögen Straßen durch die Hügel von Mylasa gebaut und Weiden in den felsigen Boden gehauen werden."  
 caria_settlement_svalue_tt: "Habt mindestens #Y 15#! Gebäude in #Y Siedlungen#!. ([SCOPE.ScriptValue('caria_settlement_svalue')|R0]/#Y 10#!)" 
 caria_missions_task_22_tt: "Jedes Territorium mit #Y Siedlungs#! Rang in [GetProvince('(int32)1992').GetArea.GetRegion.GetName] oder [GetProvince('(int32)1977').GetArea.GetRegion.GetName] wird G# #E 2#!#! @freemen! #Y Freie Männer#! Bevölkerungstypen und #G #E 1#!#! @citizen! #Y Bürger#! Bevölkerungstypen #G erhalten#!"  
  
 caria_missions_task_23: "Der Thron von Makedonien" 
 caria_missions_task_23_DESC: "Die Adligen von Makedonien haben schon immer die Starken und Fähigen den Schwachen und Gebrechlichen vorgezogen. Wenn wir unsere Karten richtig ausspielen, könnte sich unsere Linie noch als die stärkste von allen erweisen. Soll Alexanders Vermächtnis jedoch jemals wiederhergestellt werden, müssen wir zunächst das erobern, was von seinem Königreich noch übrig ist, es aus den Händen derer befreien, die es in den Ruin treiben, und an seiner Stelle einen neuen, stabileren Staat schaffen, dem die Makedonen, die über die zersplitterten Überreste des Argeadenreichs verstreut sind, dienen können." 
 caria_missions_task_23_tt: "#G Schaltet#! #T Makedonische Missionen#! #G frei#!\nDer Abschluss von #T Hellenische Beherrschung#! #G schaltet#! #T Hellenistisches Reich#! #G frei#!"  
  
 caria_missions_task_24: "Wissensspeicher"  
 caria_missions_task_24_DESC: "Die hellenistische Welt ist reich an philosophischen Lehren, Kunst, Geschichte und Gelehrsamkeit – von den Werken Platons bis zu den „Historien“ des Herodot. Durch die Bereitstellung öffentlicher Mittel für Bibliotheken in unseren großen Städten können wir [ROOT.GetCountry.GetName] als Hochburg des griechischen Wissens und des wissenschaftlichen Fortschritts etablieren." 
 caria_missions_task_24_tt: "Ein erfahrener Forscher wird in unser Land reisen." 
  
 caria_missions_task_25: "Marken-Status fordern"  
 caria_missions_task_25_DESC: "Der Reichtum, die Macht und das Prestige von [ROOT.GetCountry.GetName|G] heben uns von anderen #T Satrapen#!, ab, und obwohl keine Seite es gerne zugeben würde, könnten die [ROOT.GetCountry.GetAdjective]en Aufgeboten sich gegen die ihres #T Oberherrn#! behaupten.\n\nWeil wir stark sind, ist [ROOT.GetCountry.GetRuler.GetName|Y] der Meinung, dass wir einen besonderen Status verdienen,  und wird fordern, dass wir als solcher anerkannt werden – eine kühne Provokation." 
 caria_missions_task_25_tt: "Wir werden in der Lage sein, eine Abmachung mit unserem #T Oberherren#! #Y [THIS.GetCountry.GetOverlord.GetName]#! auszuhandeln, um ein #T #E Mark#!#! zu werden. [THIS.GetCountry.GetRuler.GetPraenomen] wird darum bitten, dass uns besondere Privilegien gewährt werden, und wir werden je nach Verlauf der Verhandlungen unterschiedliche Belohnungen erhalten." 
  
