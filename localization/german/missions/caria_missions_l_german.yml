 me_caria_1_title: "$caria_missions_task_1$"
 me_caria_1_desc: "Die Zukunft von Karien ist untrennbar mit der unseren mächtigen #E [ROOT.GetCountry.GetOverlord.GetAdjective]en# Oberherren verbunden. Auch wenn es verlockend sein mag, mehr Unabhängigkeit einzufordern, ist jetzt nicht der richtige Zeitpunkt für solche Schritte. Das würde nur Konflikte und Misstrauen schüren. Stattdessen gebietet es die Weisheit, einen anderen Kurs einzuschlagen – einen, der unsere Stellung stärkt und unsere Bedeutung innerhalb ihres Herrschaftsgebiets sichert."  
 me_caria_1.a: "Lieber Freunde als Feinde." 
 me_caria_1_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_1$#!' $mission_completed_tooltip_2$"  
  
 me_caria_2_title: "$caria_missions_task_2$" 
 me_caria_2_desc: "Karien hat den Großmächten der Ägäis und des Nahen Ostens schon seit langem seinen Wert unter Beweis gestellt. Unter persischer Herrschaft spielten unsere erfahrenen Seeleute und Söldner eine entscheidende Rolle in deren Feldzügen, während die Hekatomniden Karien zu beispiellosem Reichtum und Einfluss verhalfen. Alexander der Große vertraute Königin Ada die Herrschaft über Karien an – als treue Verbündete und nicht als bloße Untertanin.\ n\nNun bittet der Satrap von Karien unter Berufung auf den historischen Präzedenzfall der karischen Autonomie unter persischer Herrschaft und das von Alexander dem Großen entgegengebrachte Vertrauen darum, den Status Kariens als Verbündeter offiziell zu verankern. Der Erlass dieses Antrags würde ihre Loyalität sichern und ihre Beiträge stärken, aber auch einen Präzedenzfall für größere Autonomie unter unseren Untertanen schaffen. Sollten wir sie als Partner und nicht als bloße Provinz anerkennen?" 
 me_caria_2.a: "Lasst uns eine Allianz mit [caria_ally_country.GetName] formalisieren."  
 me_caria_2.b: "Karien wird eine Provinz unter unserer Herrschaft bleiben." 
  
 me_caria_201_title: "Unseren Wert beweisen"  
 me_caria_201_desc: "Vom #E [caria_old_overlord.GetAdjective]en#! Hof  ist eine Antwort auf unseren Wunsch eingegangen. Nach sorgfältiger Beratung haben sie zugestimmt, uns als Partner und nicht nur als bloße Provinz anzuerkennen, und uns damit die Autonomie gewährt, sowohl ihren als auch unseren Interessen besser gerecht zu werden."  #
 me_caria_201.a: "Es ist uns eine Ehre, dass man uns als Partner vertraut."  
 me_caria_2_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_2$#!' $mission_completed_tooltip_2$"  
  
 me_caria_202_title: "Unseren Wert beweisen"  
 me_caria_202_desc: "Der #E [caria_old_overlord.GetAdjective]e#! Hof hat unseren Wunsch nach Anerkennung als Partner abgelehnt. Bedauerlicherweise müssen wir vorsichtig vorgehen und weiterhin unseren Wert unter Beweis stellen, bis wir den Status erlangen können, den wir verdienen."  
 me_caria_202.a: "Äußerst bedauerlich."
  
 me_caria_3_title: "$caria_missions_task_3$"  
 me_caria_3_desc: "Die Karer blicken auf eine lange und ruhmreiche Seefahrertradition zurück und dienten als Kommandanten, Schiffsbauer und Krieger in den Flotten mächtiger Reiche. Schon in der Bronzezeit bereisten unsere Vorfahren als Söldner und Händler die Meere. Unter Lygdamis, Artemisia, Mausolus und Ada stellte Karien gewaltige Flotten auf und sicherte sich die Vorherrschaft über weite Teile der Ägäis. Doch viel zu lange wurde unsere Seemacht im Dienste anderer eingesetzt.\n\nWir haben wahrlich eine der besten Marineakademien der Welt gegründet! Die Küsten von #E Karien#! werden von den Seeleuten aus #E [ROOT.GetCountry.GetCapital.GetName]#! gesegnet, die bald die besten in ganz Asien sein werden."  
 me_caria_3.a: "Wir werden großartig sein." 
 me_caria_3_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_3$#!' $mission_completed_tooltip_2$"  
  
 me_caria_4_title: "$caria_missions_task_4$"  
 me_caria_4_desc: "Die Karer blicken auf eine lange und ruhmreiche Seefahrertradition zurück und dienten als Kommandanten, Schiffsbauer und Krieger in den Flotten mächtiger Reiche. Schon in der Bronzezeit bereisten unsere Vorfahren als Söldner und Händler die Meere. Unter Lygdamis, Artemisia, Mausolus und Ada stellte Karien gewaltige Flotten auf und sicherte sich die Vorherrschaft über weite Teile der Ägäis. Doch viel zu lange wurde unsere Seemacht im Dienste anderer eingesetzt.\n\nNun, mit der Fertigstellung der [ROOT.GetCountry.GetAdjective]en Kriegsflotte, wird unser Schicksal auf den Wellen besiegelt sein!"  
 me_caria_4.a: "Asien wird vor unserer Macht erzittern!"  
 me_caria_4_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_4$#!' $mission_completed_tooltip_2$"  
  
 me_caria_5_title: "$caria_missions_task_5$" 
 me_caria_5_desc: "Schiffe mit zehn oder mehr Ruderern pro Seite wurden erstmals von Alexander dem Großen eingesetzt, verbreiteten sich jedoch erst, nachdem die Flotten der Antigoniden sie bei der Belagerung von Tyros und darüber hinaus einsetzten. Ein solches Schiff verfügt in einer offenen Seeschlacht stets über eine äußerst eingeschränkte Manövrierfähigkeit. Für die Belagerungskriegsführung sind diese „Mega-Polyremen“ jedoch ideal, da sie Küstenbefestigungen durchbrechen und anschließend als Plattformen für Artillerie dienen können, während sie gleichzeitig die Landung einer großen Anzahl von Truppen ermöglichen. Es ist nur folgerichtig, dass wir solche Schiffe für uns selbst bauen, und das erste davon, die „Artemisia“ unter dem Kommando von [sailor_man.GetName], wird als Flaggschiff der karischen Marine dienen." 
 me_caria_5.a: "Die „Artemisia“ ist nur die erste von vielen..."  
 me_caria_5_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_5$#!' $mission_completed_tooltip_2$"  
  
 me_caria_6_title: "$caria_missions_task_6$"  
 me_caria_6_desc: "Die mächtigsten der Diadochen bezeichnen sich nun als Könige, als „Basileis“, und nicht mehr als Satrapen. Karien hat Königinnen und Dynasten, Kriegsherren und Visionäre gekannt. Wir herrschen nun nicht mehr als bloße Diener ferner Mächte, sondern als souveräne Herrscher aus eigenem Recht.\n\nUnd dennoch bezeichnen manche unseren Herrscher als „Satrapen“ – einen Titel, der Unterordnung bedeutet. Das geht so nicht. Das Diadem wartet auf uns, und mit ihm die Anerkennung unseres rechtmäßigen Platzes unter den Nachfolgern Alexanders."  
 me_caria_6.a: "Lang lebe [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName] von [ROOT.GetCountry.GetName]!"  
 me_caria_6.b: "[ROOT.GetCountry.GetRuler.GetPraenomen] wird das Militär stärken und alle anderen verachten."  
 me_caria_6_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_6$#!' $mission_completed_tooltip_2$"  
  
 me_caria_7_title: "$caria_missions_task_7$"  
 me_caria_7_desc: "Pleistarchos' Vater, Antipatros, regierte Makedonien als Regent der Könige,  und sein Bruder Kassandros legte die alten Titel der Unterordnung ab, um sich selbst zum Basileus zu erklären und eine eigene Dynastie zu gründen. Sollen wir weniger mutig sein als Kassandros?\n\nAuch wenn uns die Verbündeten [ROOT.GetCountry.GetName] vermacht haben, sind wir nicht länger an seine engen Grenzen gebunden. Unsere Ambitionen reichen weit darüber hinaus. Lasst uns unseren Platz unter den Nachfolgern Alexanders einnehmen und [ROOT.GetCountry.GetName] zum 'Pleistarchadischen Königreich' umgestalten!"  
 me_caria_7.a: "Von nun an wird [ROOT.GetCountry.GetName] als das Pleistarchidische Königreich  bekannt sein!" 
 me_caria_7.b: "Der Status quo genügt."  
 me_caria_7_tooltip: "Wir können nun das Kriegsziel  #G Das Erbe Alexanders#! gegen andere Diadochen verwenden.\n#G Wir werden Ansprüche auf [GetCharacter('(int32)39').GetPraenomen]s ehemaliges Imperium geltend machen#!:\n[GetProvince('(int32)418').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)350').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)379').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)1883').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)1936').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)4799').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)516').GetArea.GetRegion.GetName|Y], und [GetProvince('(int32)569').GetArea.GetRegion.GetName|Y].\n#R Diese Ansprüche und das Kriegsziel erlöschen mit dem Tod oder der Abdankung von [THIS.GetCountry.GetRuler.GetName].#!\nDie Missionsaufgabe '#Y $caria_missions_task_7$#!' wurde nun #G abgeschlossen#!" 
  
 me_caria_8_title: "$caria_missions_task_8$"  
 me_caria_8_desc: "Thukydides nannte die Bewohner von Chios einst „die reichsten Griechen“, und das nicht ohne Grund. Mit fast 900 Quadratkilometern fruchtbarem Land, hohen Gipfeln und Zugang zu den östlichen Meeren ist die Insel eine Welt für sich und viel zu wertvoll, um sie den Launen der Demokratie zu überlassen.\n\nIn den Tagen von Mausolos vertrieben die Oligarchen von Chios klugerweise die Demokraten, verbündeten sich mit Karien und bildeten eine Allianz mit Rhodos, Kos und Byzantion. Aber wie bei allen instabilen Dingen kehrte mit Alexanders Eroberungen die Demokratie zurück.\n\nDieser Fehler wurde behoben. Mit Hilfe unserer Flotte haben die natürlichen Anführer der Insel ihren Platz zurückerobert und Chios erneut unter karische Herrschaft gebracht. Ihr Anführer, [chios_country.GetRuler.GetName], bittet uns, einen umstrittenen Landstreit mit den Erythraern mit Waffengewalt beizulegen."  
 me_caria_8.a: "Alles für unsere treuen Freunde." 
 me_caria_8.b: "Wir sollten uns nicht überanstrengen."  
 me_caria_8_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_8$#!' $mission_completed_tooltip_2$"  
  
 me_caria_8001_title: "Oligarchen übernehmen Chios"  
 me_caria_8001_desc: "Überall in der Ägäis verbreitet sich die Nachricht: Das demokratische Regime von Chios ist gestürzt. Unterstützt durch [chios_new_master.GetAdjective]e Gelder und Schiffe hat die oligarchische Fraktion der Insel die Versammlung gestürzt und die Kontrolle unter einem Rat von „natürlichen Anführern“ wiederhergestellt.\n\nDer Schritt erinnert an die Tage von Mausolos, als Chios den Demos vertrieb und sich zusammen mit Rhodos, Kos und Byzantion einem von Karern geführten Bund anschloss. Jetzt neigt sich die wohlhabende Insel erneut der Oligarchie und [chios_new_master.GetName] zu." 
 me_caria_8001.a: "Interessant..." 
 me_caria_8001.b: "Diese Kränkung darf nicht ungestraft bleiben!"  
 me_caria_8001.c: "Diese Kränkung darf nicht ungestraft bleiben!" 
  
 me_caria_9_title: "$caria_missions_task_9$"  
 me_caria_9_desc: "Die ionische Stadt [priene_country.GetName], seit jeher bekannt für ihre erhabenen Tempel und stolzen demokratischen Traditionen, ist verstummt … bis auf das Stampfen der [ROOT.GetCountry.GetAdjective]en Stiefel. Mit der diskreten Unterstützung der [ROOT.GetCountry.GetAdjective]en Truppen hat sich [hieron_scope.GetName] zum „Prinzen von Priene“ erklärt, die Stadtversammlung aufgelöst und das Diadem aufgesetzt. Das Heiligtum der Athena Polias bleibt unberührt, doch seine Verwalter sind nun einem Prinzen statt dem Volk Rechenschaft schuldig.\n\nSchon jetzt regt sich Unruhe im Ionischen Bund. Noch vor wenigen Wochen war Priene der Versammlungsort des Bundes; nun ist es, bis auf den Namen, ein [ROOT.GetCountry.GetAdjective]er Vasall."  
 me_caria_9.a: "Der Weg nach Ionien liegt offen!"  
 me_caria_9_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_9$#!' $mission_completed_tooltip_2$"  
  
 me_caria_9001_title: "Prinz von Priene"  
 me_caria_9001_desc: "Die ionische Stadt [priene_country.GetName], seit jeher bekannt für ihre erhabenen Tempel und stolzen demokratischen Traditionen, ist verstummt … bis auf das Stampfen karischer Stiefel. Mit der diskreten Unterstützung karischer Truppen hat sich [hieron_scope.GetName], einer der führenden Adligen von Priene, zum „Prinzen von Priene“ erklärt, die Stadtversammlung aufgelöst und das Diadem aufgesetzt. Das Heiligtum der Athena Polias bleibt unberührt, doch seine Verwalter sind nun einem Fürsten statt dem Volk Rechenschaft schuldig.\n\nGanz Ionien ist in Unruhe versetzt. Noch vor wenigen Wochen war Priene der Versammlungsort des Ionischen Bundes; nun ist es, abgesehen vom Namen, ein karischer Vasall." 
 me_caria_9001.a: "Interessant..."  
 me_caria_9001.b: "Diese Kränkung darf nicht ungestraft bleiben!" 
  
 me_caria_10_title: "$caria_missions_task_10$"  
 me_caria_10_desc: "Das Zeitalter der Könige steht bevor. Die Erben Alexanders geben sich nicht länger damit zufrieden, sich Satrapen zu nennen, sondern bezeichnen sich nun als Basileis, und jeder baut sein Reich nach dem Vorbild seines Gründers auf. Die Welt wird nicht mehr allein von Menschen regiert, sondern von wilden Tieren.\n\nIm Süden kreisen die Ptolemäer wie Adler: unnahbar, majestätisch und zum blitzschnellen Angriff bereit. Im Osten rücken die Seleukiden getragen von Elefantenstampfen vor: gewaltig, bedächtig und unaufhaltsam. Im Norden brüllen die Lysimachiden wie Löwen, immer auf der Suche nach Territorium und Ruhm.\n\nJeder hat Karien im Blick, und jeder hegt heimliche Absichten gegenüber unseren Küsten. Aber vielleicht müssen wir uns ihnen nicht im Kampf stellen. Natürlich hat Frieden seinen Preis. Eine königliche Hochzeit, begleitet von der Mitgift Halikarnassos, könnte das Raubtier dennoch zum Partner machen." 
 me_caria_10.a: "Eine Tochter von [GetCountry('EGY').GetRuler.GetPraenomen] wäre geeignet."  
 me_caria_10.at: "Ein Heiratsantrag wird an [GetCountry('EGY').GetCapital.GetName] gesendet#!\nFalls [GetCountry('EGY').GetRuler.GetPraenomen] #G akzeptiert#!, dann geschieht Folgendes:\n\nEin Spross der Linie von #E #T [GetCountry('EGY').GetRuler.GetPraenomen]#!#! wird ein Mitglied unseres Hauses heiraten"  
 me_caria_10.b: "[GetCountry('TRE').GetRuler.GetPraenomen] soll zu unseren Verwandten gehören"  
 me_caria_10.bt: "Ein Heiratsantrag wird an [GetCountry('TRE').GetCapital.GetName] gesendet#!\nFalls [GetCountry('TRE').GetRuler.GetPraenomen] #G akzeptiert#!, dann geschieht Folgendes:\n\nEin Spross der Linie von #E #T [GetCountry('TRE').GetRuler.GetPraenomen]#!#! wird ein Mitglied unseres Hauses heiraten"  
 me_caria_10.c: "[GetCountry('SEL').GetRuler.GetPraenomen] ist ein vernünftiger Mann." 
 me_caria_10.ct: "Ein Heiratsantrag wird an [GetCountry('SEL').GetCapital.GetName] gesendet#!\nFalls [GetCountry('SEL').GetRuler.GetPraenomen] #G akzeptiert#!, dann geschieht Folgendes:\n\nEin Spross der Linie von #E #T [GetCountry('SEL').GetRuler.GetPraenomen]#!#! wird ein Mitglied unseres Hauses heiraten" 
 me_caria_10.d: "Wir werden uns nicht durch Geschenke und Schmeicheleien erniedrigen." 
 me_caria_10_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_10$#!' $mission_completed_tooltip_2$"  
  
  
  
 me_caria_1001_title: "Der karische Heiratsantrag"  
 me_caria_1001_desc: "Nun kommen Gesandte aus Karien, die Schmeicheleien, Silber und etwas noch Gefährlicheres mitbringen: ein Angebot. Sie schlagen eine Verbindung zwischen unseren beiden Häusern vor, besiegelt durch eine Mitgift aus Halikarnassos. Sie hoffen, mit Häfen und verwandtschaftlichen Bindungen Frieden zu erkaufen.\n\nEin kluger Schachzug. Karien will sich uns nicht widersetzen; es will uns überleben. Wir können ihrem Antrag stattgeben und sie durch Blutsverwandtschaft an uns binden … oder ihn ablehnen und die Schakale auf ihre Mauern loslassen."  
 me_caria_1001.a: "Ein höchst willkommenes Angebot."  
 me_caria_1001.b: "Was für eine lächerliche Bitte." 
  
 me_caria_1002_title: "$caria_missions_task_10$: Erfolg"  
 me_caria_1002_desc: "Es sind Nachrichten vom Hof von [sucessor_kingdom.GetCapital.GetName] eingetroffen. Eine königliche Verbindung wurde vereinbart. Einer der Unseren soll in deren Familie einheiraten, und im Gegenzug werden uns Schutz, Bündnis und Anerkennung gewährt. Natürlich ist Frieden niemals umsonst: Halikarnassos wird nun als Mitgift in [sucessor_kingdom.GetAdjective]e Hände übergehen." 
 me_caria_1002.a: "Lasst die Hochzeitsfeierlichkeiten beginnen."  
  
 me_caria_1003_title: "$caria_missions_task_10$: Fehlschlag"  
 me_caria_1003_desc: "Die [sucessor_kingdom.GetAdjective]e Antwort ist eingetroffen und sie ist kühl ausgefallen. Unsere Gesandtschaft wurde abgewiesen, unsere Geschenke abgelehnt, unser Vorschlag rundweg zurückgewiesen. Es wird keine Hochzeit geben, kein Bündnis, keinen mit Mitgiften erkauften Frieden."  
 me_caria_1003.a: "Dann stehen wir alleine da." 
  
 me_caria_11_title: "$caria_missions_task_11$" 
 me_caria_11_desc: "Die Welt ist ein Ort voller Unruhen. Alexander ist nicht mehr unter uns, und in seiner Abwesenheit teilen die Diadochen die Welt in ihrem Streben nach Herrschaft unter sich auf. Flotten brennen, Städte fallen, und kein Land bleibt vom Krieg verschont. In einer solchen Zeit bedeutet es, auf Messers Schneide zu stehen, wenn man auf sich allein gestellt ist. Viele fordern nun, dass wir uns offiziell unter den Schutz unserer guten und treuen Freunde, den Ptolemäern, begeben." 
 me_caria_11.a: "Lang lebe [GetCountry('EGY').GetRuler.GetTitle] [GetCountry('EGY').GetRuler.GetName]" 
 me_caria_11.b: "Wir werden ein freies Volk bleiben."  
 me_caria_11_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_11$#!' $mission_completed_tooltip_2$."  
  
