 caria_missions_task_10: "Der Preis des Friedens"  
 caria_missions_task_10_DESC: "Das Zeitalter der Könige steht bevor. Die Erben Alexanders geben sich nicht länger damit zufrieden, sich Satrapen zu nennen, sondern bezeichnen sich nun als Basileis, und jeder baut sein Reich nach dem Vorbild seines Gründers auf. Die Welt wird nicht mehr allein von Menschen regiert, sondern von wilden Tieren.\n\nIm Süden kreisen die Ptolemäer wie Adler: unnahbar, majestätisch und zum blitzschnellen Angriff bereit. Im Osten rücken die Seleukiden getragen von Elefantenstampfen vor: gewaltig, bedächtig und unaufhaltsam. Im Norden brüllen die Lysimachiden wie Löwen, immer auf der Suche nach Territorium und Ruhm.\n\nJeder hat Karien im Blick, und jeder hegt heimliche Absichten gegenüber unseren Küsten. Aber vielleicht müssen wir uns ihnen nicht im Kampf stellen. Natürlich hat Frieden seinen Preis. Eine königliche Hochzeit, begleitet von der Mitgift Halikarnassos, könnte das Raubtier dennoch zum Partner machen."  
 caria_missions_task_10_tt: "Ein Heiratsantrag wird an einen der #E Diadochen#! gesendet\nFalls er #G annimmt#!, wird Folgendes geschehen:\n#E @[GetCountry('CIA').GetFlag]!  [GetCountry('CIA').GetName]#! verbündet sich mit dem #E #T Diadochenmonarchen#!#!\n@[GetCountry('CIA').GetFlag]!  [GetCountry('CIA').GetName] erhält #G 250#! @gold! als Mitgift\nEin Spross der Linie des #E #T Diadochenmonarchen#!#! wird ein Mitglied unseres Hauses heiraten\n#E Halikarnassos#! wird ein #Y Bundesgenosse#! des #E #T Nachfolgekönigreiches#!#! "  

  
