 me_caria_12_desc: "Die Welt ist ein Ort voller Unruhen. Alexander ist nicht mehr unter uns, und in seiner Abwesenheit teilen die Diadochen die Welt in ihrem Streben nach Herrschaft unter sich auf. Flotten brennen, Städte fallen, und kein Land bleibt vom Krieg verschont. In einer solchen Zeit bedeutet es, auf Messers Schneide zu stehen, wenn man auf sich allein gestellt ist. Viele fordern nun, dass wir uns offiziell unter den Schutz unserer guten und treuen Freunde, den Alkimachiden, begeben." 
 me_caria_12.a: "Lang lebe [GetCountry('TRE').GetRuler.GetTitle] [GetCountry('TRE').GetRuler.GetName]" 
 me_caria_12.b: "Wir werden ein freies Volk bleiben."  
