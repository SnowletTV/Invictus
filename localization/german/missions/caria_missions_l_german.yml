 me_caria_14_title: "$caria_missions_task_14$"  
 me_caria_14_desc: "Halikarnassos, once defied the greatest conqueror of the age. When Alexander laid siege to the city in 334 BCE, it held firm for months under the command of Memnon of Rhodes, and though it fell in the end, its defenses earned the respect of all Hellas. Since then, Halikarnassos has changed hands more than once, as the Diadochi fought like wolves over the spoils of empire.\n\nBut no longer. Let the kings and satraps scheme as they will, Halikarnassos shall not be their prize. We have rebuilt her walls, reinforced her harbors, and restorde her towers. The city now stands as an impregnable bastion of Carian power, and those who seek to take her must pay a terrible price."  #<Halikarnassos trotzte einst dem größten Eroberer seiner Zeit. Als Alexander die Stadt 334 v. Chr. belagerte, hielt sie unter dem Kommando von Memnon von Rhodos monatelang stand, und obwohl sie am Ende fiel, verdienten ihre Verteidigungsanlagen den Respekt von ganz Hellas. Seitdem hat Halikarnassos mehr als einmal den Besitzer gewechselt, da die Diadochen wie Wölfe um die Beute des Imperiums kämpften.\n\nAber nicht mehr. Mögen die Könige und Satrapen planen, was sie wollen, Halikarnassos soll nicht ihre Beute sein. Wir haben ihre Mauern wieder aufgebaut, ihre Häfen verstärkt und ihre Türme restauriert. Die Stadt ist nun eine uneinnehmbare Bastion karischer Macht, und diejenigen, die sie einnehmen wollen, müssen einen schrecklichen Preis zahlen.#>  #NT!
 me_caria_14.a: "Der Schild von Karien, unzerbrechlich und ewig, ist vollkommen!"  
 me_caria_14_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_14$#!' $mission_completed_tooltip_2$"  
  
 me_caria_15_title: "$caria_missions_task_15$" 
 me_caria_15_desc: "Das Haus der Hekatomniden führte Karien zu seiner Blütezeit. Von ihrem Stammsitz in Mylasa aus stiegen die Hekatomniden als Satrapen von Karien und Herrscher sowohl über das Hochland als auch über die Küstengebiete zur Macht auf. Unter Mausolos und Artemisia erlangte Halikarnassos Ruhm: Seine Denkmäler konnten sich mit denen antiker Dynastien messen, seine Flotten beherrschten die Meere, und an seinem Hof versammelten sich Dichter, Gelehrte und Soldaten. Selbst in ihrer Untergangszeit bestand die Dynastie in Ehren fort: Königin Ada, die Letzte der Hekatomniden, adoptierte Alexander den Großen als ihren Sohn. Nun, da Halikarnassos wieder gesichert ist, ist es nur angemessen, dass wir die Herrschaft darüber [hecatomnid_heir.GetName] anvertrauen, einem Spross eines Nebenzweiges des Hauses Hekatomnos aus Mylassa." 
 me_caria_15.a: "Lang lebe Basileos [hecatomnid_heir.GetPraenomen]!"  
 me_caria_15.b: "[hecatomnid_heir.GetPraenomen] wird der erste Mann in Halikarnassos sein."  
 me_caria_15_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_15$#!' $mission_completed_tooltip_2$"  
  
 me_caria_16_title: "$caria_missions_task_16$"  
 me_caria_16_desc: "Zu lange schon hat Karien vor den Persern, den Makedonen und den selbsternannten Königen, die keine Wurzeln in unserem Boden hatten, die Knie gebeugt. Nicht mehr. Karien erinnert sich. In den Bergheiligtümern von Mylasa, in den Hafentavernen von Halikarnassos, in den Herzen der Menschen leben die alten Loyalitäten weiter. Es gibt Gerüchte von einem Aufstand, von Rache, von Wiederherstellung.\n\nEin solches Gerücht hat in der Person eines [hekatomnid_assasain.GetName] Gestalt angenommen, eines Mannes mit Charisma und Ehrgeiz aus der Linie von Hekatomnos, der sich mit vorgetäuschter Loyalität und Schmeichelei das Vertrauen von [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName] verdient hat. [hekatomnid_assasain.GetPraenomen] glaubt, dass es an der Zeit ist, dass die Erben von Hekatomnos das zurückfordern, was ihnen rechtmäßig gehört, nicht als Satrapen, sondern als Herrscher.\n\nAber heute Nacht wird in den dunklen Hallen des Palastes [hekatomnid_assasain.GetHerHis] Verrat offengelegt. Die Wachen von [ROOT.GetCountry.GetRuler.GetPraenomen] haben [hekatomnid_assasain.GetHerHim] dabei erwischt, wie er den Wein von [ROOT.GetCountry.GetRuler.GetPraenomen] vergiftet hat. Ein Wort des Hauptmanns der Wache kann [hekatomnid_assasain.GetPraenomen] in Ketten legen und [ROOT.GetCountry.GetRuler.GetPraenomen] retten.  Doch es gibt noch einen anderen Weg: das Schweigen..." 
 me_caria_16.a: "Lasst den Usurpator erzittern!" 
 me_caria_16.at: "Wir werden die Flagge von #T Halikarnassos#! übernehmen" 
 me_caria_16.b: "Karien für die Karier." 
 me_caria_16.c: "[hekatomnid_assasain.GetPraenomen] einsperren!"  
 me_caria_16_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_16$#!' $mission_completed_tooltip_2$"  
  
 me_caria_17_title: "$caria_missions_task_17$"  
 me_caria_17_desc: "Während die materiellen Überreste von Kaunos die Gründung oder frühe Nutzung des Ortes höchstens auf das 9. Jahrhundert v. Chr. datieren, reicht die überlieferte Geschichte der Stadt bis zu ihrem Namensgeber Kaunos zurück, dem Sohn des karischen Königs Miletos und der Najade Kyane. Es heißt, dass sich Kaunos und seine Schwester Byblis ineinander verliebten und dass Kaunos, um Inzest zu vermeiden, vor ihr bis nach Lykien in Anatolien floh. Dorthin folgte ihm Byblis, verfiel jedoch in Trauer und Wahnsinn und starb; sie verwandelte sich in eine Quelle, vergoss unaufhörlich Tränen über das Land und schuf mit ihren tränenreichen Augen den Fluss Kalbys. In Asien heiratete Kaunos die Nymphe Pronoe und zeugte einen Sohn, Aegialus, der später in der Nähe eine Stadt gründete, die nach seinem Vater benannt wurde. Die Stadt selbst war ein hervorragender Handelshafen mit zwei aktiven Häfen, und Herodot berichtet, dass die Einwohner der Stadt hartnäckig gegen den persischen Feldherrn Harpagus kämpften – sie unterlagen jedoch nach einiger Zeit. Der Historiker merkt außerdem an, dass er zwar persönlich ihrer Behauptung, ausländischer Herkunft zu sein, nicht zustimmt, da sie eine Sprache sprechen, die der seiner Heimat ähnelt, er jedoch nicht leugnen kann, dass sie sich auf eigentümliche Weise verhalten, anders als alle anderen Karer und Lykier. Alle Männer, Frauen und sogar die Kinder trinken gemeinsam Wein.\n\nWenn wir den Ehrgeiz hegen, zu den Erben Alexanders zu gehören, müssen wir es ihnen gleichtun. Wir werden in Kaunos eine königliche Münzstätte errichten und dort Münzen in unserem Namen prägen."  
 me_caria_17.a: "Ein autonomes Kaunos entspricht unseren Interessen."  
 me_caria_17.at: "#E Kaunos#! wird ein #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]er#! #Y Bundesgenosse#!" 
 me_caria_17.b: "Die ganze Welt wird das Gesicht von [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName] kennen!" 
 me_caria_17_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_17$#!' $mission_completed_tooltip_2$"  
  
 me_caria_18_title: "$caria_missions_task_18$"  
 me_caria_18_desc: "Mausolos, der große Architekt der karischen Macht, wusste, dass ein Imperium nicht von einer Hand allein aufgebaut werden kann. Um seine Südgrenze zu sichern, vertraute er die Herrschaft über Lykien seinem Bruder Pixodaros an. Wir täten gut daran, seinem Beispiel zu folgen. Die lykischen Städte, von Xanthos bis Patara, sind stolz und widerspenstig, aber strategisch wichtig."  
 me_caria_18.a: "Lykien wird fortan von einem Satrapen regiert!" 
 me_caria_18.b: "Die Grenzen Lykiens sollen sich weit und breit erstrecken."  
 me_caria_18_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_18$#!' $mission_completed_tooltip_2$"  
  
 me_caria_19_title: "$caria_missions_task_19$"  
 me_caria_19_desc: "Der Hyparch Kondalos, der zur Regierung Lykiens entsandt wurde, bemerkte einmal, dass die Einheimischen ihr Haar im Gegensatz zu den glattrasierten Kariern lang trugen. Kondalos witterte eine Gelegenheit und verkündete dem Volk, dass der Großkönig Artaxerxes Haare für Pferdeperücken benötige und dass jeder Lykier sich den Kopf rasieren und die abgeschnittenen Haare an den königlichen Hof schicken müsse. Wer sich weigerte, konnte stattdessen in Silber bezahlen. Kein Haar hat die Provinz jemals verlassen, aber Kondalos' Plan steigerte die Einnahmen erheblich."  
 me_caria_19.a: "Mausolos wusste sicher, wie man sie auswählt..." 
 me_caria_19_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_19$#!' $mission_completed_tooltip_2$"  
  
 me_caria_20_title: "$caria_missions_task_20$"  
 me_caria_20_desc: "Die Westküste Kleinasiens ist ein Flickenteppich aus Stadtstaaten, Bundesstädten und verblassenden Satrapien. Viele dieser Städte zahlten einst Mausolos Tribut oder kämpften an der Seite von Artemisia. Einige sind unter dem Einfluss makedonischer Generäle geraten oder klammern sich hinter bröckelnden Mauern an hohle Freiheiten. Die asiatische Küste ist unser Erbe. Es ist an der Zeit, eine Expedition zu starten, um unsere Herrschaft über Asien für kommende Generationen zu sichern." 
 me_caria_20.a: "Bald gehört Asien uns!"  
 me_caria_20_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_20$#!' $mission_completed_tooltip_2$"  
  
 me_caria_21_title: "$caria_missions_task_21$" 
 me_caria_21_desc: "Vor nicht allzu langer Zeit war das Hochland von Lykaonien zerklüftet und unbeansprucht, ein wildes Land mit befestigten Städten, Stammeshäuptlingen und Bergfestungen. Unsere Expedition nach Derbe hat Früchte getragen. [derbe_ruler.GetPraenomen] regiert diese Länder nun als Dynastie, nachdem er sich mit Hilfe von [ROOT.GetCountry.GetAdjective]em Gold die Treue seiner Burgen und Städte gesichert hat. Auf [derbe_ruler.GetHerHis]er Seite  steht [derbe_heir.GetPraenomen], der Erbe dieser neuen derbeanischen-Linie."  
 me_caria_21.a: "Endlich hat Derbe einen Dynasten." 
 me_caria_21_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_21$#!' $mission_completed_tooltip_2$"  
  
 me_caria_22_title: "$caria_missions_task_22$"  
 me_caria_22_desc: "Auch wenn unsere Küstenstädte in Marmor erstrahlen, liegt das wahre Herzstück von [ROOT.GetCountry.GetName] im Landesinneren – in den Tälern, Hügeln und verstreuten Dörfern, die unsere Städte versorgen und uns Soldaten für unsere Armeen bereitstellen. Wir müssen unseren Blick auf die Hirten, Bauern und Siedler richten, die unsere Stärke erhalten. Mit bescheidenen Zuschüssen und beständiger Betreuung haben wir das Landesinnere zum schlagenden Herzen der [ROOT.GetCountry.GetAdjective]en Macht gemacht. Durch die Hügel von Mylasa wurden Straßen gebaut und Weiden auf dem steinigen Boden angelegt."  
 me_caria_22.a: "Wir kümmern uns um die Unsrigen." 
 me_caria_22.at: "Jedes Territorium mit #Y Siedlungs#! Rang wird  #E 2#! @freemen! #Y Freie Männer#! Bevölkerungstypen und #G #E 1#!#! @citizen! #Y Bürger#! Bevölkerungstypen #G erhalten."  
 me_caria_22_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_22$#!' $mission_completed_tooltip_2$"  
  
 me_caria_23_title: "$caria_missions_task_23$"  
 me_caria_23_desc: "Die Adligen von Makedonien haben schon immer die Starken und Fähigen den Schwachen und Gebrechlichen vorgezogen. Wenn wir unsere Karten richtig ausspielen, könnte sich unsere Linie noch als die stärkste von allen erweisen. [ROOT.GetCountry.GetRuler.GetName] hat die Überreste von Alexanders Königreich an sich gerissen und es aus der Gewalt derer gerissen, die es in den Ruin trieben, um an seiner Stelle einen neuen, stabileren Staat für die Makedonen zu schaffen, die über die zersplitterten Überreste des Argeadenreichs verstreut sind und ihm dienen sollen"  
 me_caria_23.a: "[ROOT.GetCountry.GetRuler.GetPraenomen] ist der [ROOT.GetCountry.GetRulerTitle] von Makedonien" 
 me_caria_23.at: "Wir werden die Flagge und Farben Makedoniens übernehmen." 
 me_caria_23.b: "Wir herrschen über Makedonien, aber es ist nicht mehr das Makedonien von einst."  
 me_caria_23.bt: "#R Nichts passiert.#!" 
 me_caria_23.c: "Dies ist ein neues Kapitel in der Geschichte der Makedonen." 
 me_caria_23.ct: "Wir werden die Symbole Makedoniens übernehmen, aber unsere Farben beibehalten." 
 me_caria_23_tooltip: "$mission_completed_tooltip_1$ '#Y $caria_missions_task_23$#!' $mission_completed_tooltip_2$\n#G Schaltet#! #T Makedonische Missionen#! #G frei#!\nDer Abschluss von #T Hellenische Beherrschung#! #G schaltet#! #T Hellenistisches Reich#! #G frei#!" #hellenistic Empire
  
 me_caria_24_title: "$caria_missions_task_24$"  
 me_caria_24_desc: "Die hellenistische Welt ist reich an Lehren der Philosophie, Kunst, Geschichte und Bildung, von den Werken Platons bis zu den Historien des Herodot.\n\nMit dem Bau öffentlicher Bibliotheken im ganzen Land ist [ROOT.GetCountry.GetName] zu einem Leuchtturm des Hellenismus im Osten geworden, mit dem Klang großer Debatten, der durch die Straßen hallt und viele Gelehrte dazu verleitet, vom griechischen Festland zu reisen. Insbesondere ein Gelehrter, [hellenic_scholar.GetName], hat einen außergewöhnlich scharfen Verstand bewiesen und wäre der ideale Forscher, sollten wir ihm die Möglichkeit geben, für uns zu arbeiten."  
 me_caria_24.a: "Exzellent."  
