 colchian_silphium: "Kolchisches Silphium"
 desc_colchian_silphium: "Die Kolcher haben die Wunder der Silphiumpflanze entdeckt." 
  
 colchian_silphium_growers: "Die kolchischen Silphium-Anstrengungen" 
 desc_colchian_silphium_growers: "Diese Person trug dazu bei, den Silphium-Anbau in Kolchis gewissenhaft zu fördern." 
  
 colchian_silphium_growing: "Bemühungen um den Silphionanbau" 
 desc_colchian_silphium_growing: "n den warmen Feuchtgebieten des kolchischen Deltas hat die Silphium-Pflanze mit ihren seltenen Eigenschaften eine neue Heimat gefunden, in der sie gedeiht und der lokalen Bevölkerung Freude bereitet" 
  
 kuji_fortress: "Kujis Burg" 
 desc_kuji_fortress: "Mit einheimischen Edelsteinen geschmückt, überblickt die Burg einen wichtigen Verkehrsknotenpunkt und kontrolliert den örtlichen Handel." 
  
 the_thorny_rose: "Die dornige RoseRose" 
 desc_the_thorny_rose: "Umgeben von blühenden Feldern verfügt die Stadt Rhodopolis über schützende Mauern und dornige Verteidigungsanlagen, die sie vor Angriffen bewahren."
  
 rose_thorn: "Der Dorn der Rose"
 desc_rose_thorn: "Dieser Gebirgspass fungiert nun als verlängerter Dorn des nahegelegenen Rhodopolis und ist gut gegen feindliche Vorstöße geschützt." 
  
 siezed_western_passes: "Eingenommene westliche Pässe" 
 desc_siezed_western_passes: "Die Kolcher haben sich gierig der Grauzonen bemächtigt, die sich entlang unserer westlichen Gebirgspässe erstrecken." 
  
 fields_of_roses: "Felder und Rosen" 
 desc_fields_of_roses: "Obwohl militärisch schwach, sind die Felder rund um Vardsikhe/Rhodopolis gut bewässert und fruchtbar und bereit, eine wachsende Stadt zu versorgen" 
  
 rosy_mines: "Rosige Minen" #NT!
 desc_rosy_mines: "Schöne Rosenflecken am Hügel am Rande der fruchtbaren Ebenen decken reichhaltige Metallablagerungen ab, die den zukünftigen Bau und die künftige Wartung befeuern können." #NT!
  
 rose_gold_traders: "Roségoldhändler" #NT!
 desc_rose_gold_traders: "Mit dem neu entdeckten Vermögen der Rhodopolis -Minen an lokale Unternehmer werden Händler weiterhin durch unsere Basare fließen." #NT!
  
 rose_assault: "Angriff der Rose" #NT!
 desc_rose_assault: "Der Angriff und die Einnahme der Bergpässe rund um die Rose City haben diesen Kommandanten befriedigt." #NT!
  
 pheasant_farms: "Fasanfarmen" #NT!
 desc_pheasant_farms: "Wenn wir den jüngsten Boom in der Fasanenbevölkerung ausnutzen, können wir unser Kapital ernähren." #NT!
  
 pheasant_markets: "Fasanmärkte" #NT!
 desc_pheasant_markets: "Phaesanten aus den Hügelwäldern werden den Fluss hinuntergebracht, um in den Hafenständen zu segeln." #NT!
  
 pheasant_problem: "Fasanproblem" #NT!
 desc_pheasant_problem: "Fasanen überragen die Dörfer und werden zu einem großen Ärgernis für die Einheimischen." #NT!
  
 gold_rush: "Ein Goldrausch" #NT!
 desc_gold_rush: "Die Menschen sind frei, die goldenen Vorteile der Flussphase zu nutzen, sodass sie hierher strömen und sich um das Banner des großzügigen Herrn des goldenen Stroms versammeln." #NT!
  
 royal_hide_sifting: "Royal Hide Sifting" #NT!
 desc_royal_hide_sifting: "Die von der Krone bezahlten Arbeiter veranstalten die goldenen Vorteile der Flussphase für uns." #NT!
  
 anger_against_argonaut_stone: "Wut über Iasons Stein" #NT!
 desc_anger_against_argonaut_stone: "Das Volk ist verärgert, dass Iasons Stein, eine Erinnerung an griechische Vikotrie über den Herrscher des Kolchischen Volkes, vom Gericht von Kolchis gelobt wurde." #NT!
  
 praise_stone_destruction: "Lob für die Zerstörung von Iasons Stein" #NT!
 desc_praise_stone_destruction: "Das Volk freut sich darüber, dass der Stein, den Iason besiegte, um die Drachen-Sowen-Verteidiger von Kolchis zu besiegen, in einer Show der Kolchischen Souveränität und des Stolzes zerstört wurde." #NT!
  
 destroy_argonaut_stone: "Zerstörung von Iasons Stein" #NT!
 desc_destroy_argonaut_stone: "Das Priestertum von Kolchis hat die göttliche Aura um den Stein, den Iason besetzt, rituell entfernt, und die Menschen sind jetzt frei von diesem argonauten Einfluss." #NT!
  
 outrage_over_stone_destruction: "Empörung über die Zerstörung von Iasons Stein" #NT!
 desc_outrage_over_stone_destruction: "Die Griechen der Pontos Euxinos, für die Iason und seine Argonauten unsterbliche Helden sind, haben große Beleidigung über die Zerstörung des Steins genommen, den er inmitten des Kampfes gegen die Krieger aus Dragon's Thee gezogen hat." #NT!
  
 argonaut_legacy: "Das Argonaut -Erbe" #NT!
 desc_argonaut_legacy: "Das Erbe des Argo und ihrer Crew, die aus den Ländern von Kolchis ausgeht, in denen das legendäre Goldene Vlies bekannt war, erstreckt sich über die gesamte griechische Welt und ein besonderer Platz in der Erinnerung an die meisten." #NT!
  
 stone_throwing: "Stein werfen" #NT!
 desc_stone_throwing: "Wie Iason können auch die Menschen in Kholkis die einfachsten Steine ​​in die tödlichsten Raketen verwandeln." #NT!
  
 replaced_the_swamp: "Den Sumpf ersetzt" #NT!
 desc_replaced_the_swamp: "Die sumpfige Natur der kolchischen Feuchtgebiete wurde durch unsere bloße Willenskraft überwunden und enthüllt neues und lebensfähiges Land, um sich niederzulassen." #NT!
  
 flooding_assistance: "Überschwemmungshilfe" #NT!
 desc_flooding_assistance: "Der Herrscher gab den Menschen Geschenke, damit sie nach der Überschwemmung ihr Leben aufnehmen konnten." #NT!
  
 rebuilt_after_flood: "Wiederaufbau nach der Flut" #NT!
 desc_rebuilt_after_flood: "Nachdem die versehentliche Überschwemmungen das Dorf fast ausgelöscht hatten, hat der Thron dazu beigetragen, ihn von Grund auf wieder aufzubauen, um es inmitten der Feuchtgebiete zu basteln, die austrocknen." #NT!
  
 expanded_millet_farms: "Erweiterte Hirsefarmen" #NT!
 desc_expanded_millet_farms: "Die am besten wachsende Ernte im wärmeren Klima der vorherigen Feuchtgebiete haben jetzt mehr Platz, um die Hirsefelder zu wachsen." #NT!
  
 colchian_farmer_autonomy: "Bauer Autonomie" #NT!
 desc_colchian_farmer_autonomy: "Die Landwirte der kolchischen Feuchtgebiete haben ihre eigenen Geräte überlassen und haben ihre eigenen Vorgehensweisen ergriffen." #NT!
  
 competitive_colchian_farmers: "Wettbewerb zwischen kolchischen Bauern" #NT!
 desc_competitive_colchian_farmers: "Angetrieben von dem Ansturm in neue Lande, um sich zu kultivieren, muss jeder Landwirt mehr denn je um die Preise und den Wohlstand seines Nachbarn als je zuvor sorgen, um mehr Waren für die Märkte zu machen." #NT!
  
 corrupt_colchian_nobles: "Korruption in der kolchischen Elite" #NT!
 desc_corrupt_colchian_nobles: "Der Adel in Colchis wird von der Spitze jeder Handelssteuerzahlung nutzen, die ihre Taschen mästen und sie eher dazu neigen, den Thron zu unterstützen." #NT!
  
 state_phasis_tax: "Eine staatliche Steuer der Phase" #NT!
 desc_state_phasis_tax: "Die Krone hat eine allgemeine Steuer auf den Handel eröffnet, der die Phase hinunterfließt." #NT!
  
 indo_euxinos_trade: "Der Indo-Exinos-Handel" #NT!
 desc_indo_euxinos_trade: "Der Handel aus dem Osten und Schwarzen Meer hat viele neue Menschen mit Dingen mitgeführt, die verkauft werden." #NT!
  
 colchian_potential: "Colchian Potenzial" #NT!
 desc_colchian_potential: "Die Menschen in Colchis haben ein riesiges und findiges Land, mit dem man arbeiten kann. Es wird sie bei ihrem Aufstieg zur Größe unterstützen." #NT!
  
 restricted_skeptoukhi: "Eingeschränkte Skeptoukhi" #NT!
 desc_restricted_skeptoukhi: "Die königlichen Gouverneure von Colchis werden nur eine begrenzte Befugnis haben, ihre Regionen zu verwalten und sich in ihren größten Ambitionen zu vereinen." #NT!
  
 unrestricted_skeptoukhi: "Uneingeschränkter Skeptoukhi" #NT!
 desc_unrestricted_skeptoukhi: "Die königlichen Gouverneure von Colchis werden viel Macht haben, ihre Regionen zu verwalten, was zu einer Gewinnfähigkeit führt, jedoch zu einem Preis." #NT!
  
 royal_caucasian_marriage: "Eine königliche kaukasische Ehe" #NT!
 desc_royal_caucasian_marriage: "Eine Ehe zwischen den Mächten von Colchis und kaukasischem Iberia hat zu guten Gefühlen geführt." #NT!
  
 refuse_ibero_marriage: "Verweigerte die königliche Iberische Ehe" #NT!
 desc_refuse_ibero_marriage: "Der kolchische Adel freut sich darüber, dass Kuji es unterlassen hat, eine iberische Marionette zu werden." #NT!
  
 colchis_saeristavo_client: "Der Saeristavo von Egrisi" #NT!
 desc_colchis_saeristavo_client: "Als direkter Kunde des kaukasischen Iberiens von Pharnavaz I hat Colchis viel von gegenseitiger Zusammenarbeit und Wohlstand gewonnen." #NT!
  
 rejected_saeristavo: "Abgelehnte Saeristavo -Vasalisierung" #NT!
 desc_rejected_saeristavo: "Der Thron von Kuji hat sich geweigert, das Knie zu den Pharnavaziden zu biegen." #NT!
  
 killed_pharnavaz: "Getöteter Pharnavaz I" 
 desc_killed_pharnavaz: "Die Kolcher töteten Pharnavaz I. aus dem kaukasischen Iberien." 
  
 attempted_kill_pharnavaz: "Versuchte Ermordung von Pharnavaz I." 
 desc_attempted_kill_pharnavaz: "Es ist bekannt, dass die Kolcher versucht haben, Pharnavaz I. vom kaukasischen Iberien zu töten" #NT!
  
 tribute_from_colchis: "Tribut von Colchis" 
 desc_tribute_from_colchis: "Kolchis zahlt uns weiterhin einen nominalen Tribut." 
  
 colchian_tribute: "Kolchischer Tribut an Iberia" 
 desc_colchian_tribute: "Wir zahlen weiterhin Tribut an die Iberer."
  
 aeetes_palace_attraction: "Anziehung zum Palast des Aietes"
 desc_aeetes_palace_attraction: "Menschen aus dem gesamten Schwarzmeerraum und darüber hinaus strömen herbei, um den restaurierten Palast des alten Aietes zu besichtigen." 
  
 aeetid_throne: "Der Aeetiden-Thron"
 desc_aeetid_throne: "Kolchis verwaltet nun sein Herrschaftsgebiet vom wiederhergestellten Thron des alten Aietes aus." 
  
 euxinos_control: "Kontrolle des Euxinos"
 desc_euxinos_control: "Mit der längsten Küstenlinie am Pontos Euxinos hat Kolchis die Kontrolle über seine Gewässer und ist sehr erfahren in der Schiffsführung und Hafenverwaltung." 
  
 trapezous_kolchis_trade: "Handel von Trapezous"
 desc_trapezous_kolchis_trade: "Mit seinem neuen Hafen blüht der Handel von Trapezous auf."
  
 telephis_trade: "Handel von Telephos" 
  
 expanded_trapezous_quarters: "Erweiterte Viertel von Trapezous" 
 desc_expanded_trapezous_quarters: "Trapezous hat seine Quartiere erweitert, um verschiedenen ethnischen Gruppen mehr Platz zu bieten." 
  
 trapezous_chaos: "Trapezous-Chaos" 
 desc_trapezous_chaos: "In Trapezous ist es zu gewalttätigen Ausschreitungen zwischen den pontischen Griechen und den Lazi gekommen." 
  
 trapezous_ethnic_tensions: "Ethnische Spannungen in Trapezous" 
 desc_trapezous_ethnic_tensions: "Spannungen sind zwischen pontischen Griechen und Lazi-Gruppen in Trapezous ausgebrochen" 
  
 lazi_mercenary_pool: "Das Lazi Söldner-Reservoir" #NNT!
 desc_lazi_mercenary_pool: "Der Söldnerstaat der Lazi in Rhizaion wird billige und fähige Streitkräfte zur Verfügung stellen." 
  
 achaemenid_inspired_colchian_administration: "Achämenidisch beeinflusste Verwaltung in Kolchis" 
 desc_achaemenid_inspired_colchian_administration: "Die Kolcher haben Elemente des alten achämenidischen Stils der Verwaltungsmaßnahmen übernommen." 
  
 monopoly_on_straight_violence: "Ein Gewaltmonopol über die Meerengen" 
 desc_monopoly_on_straight_violence: "Um die Wirtschaft der Meerenge zu kontrollieren, unterhalten die Kolcher eine starke Seemacht." 
  
 black_sea_colchis_hegemon: "Hegemon des Schwarzen Meeres" 
 desc_black_sea_colchis_hegemon: "Kolchis ist zur kolonisierenden Seemacht des Pontos Euxinos geworden." 
  
 dioscuri_blessing: "Segen der Dioscuren" 
 desc_dioscuri_blessing: "Mit ihrem Schrein, der in einem großen Tempel untergebracht ist, haben die Dioskuren Dioscurias, ihre namensgebende Hafenstadt, mit Glück für die Zukunft gesegnet."
  
 occupation_of_dioscurias: "Die Besetzung von Dioscurias" 
 desc_occupation_of_dioscurias: "Die Kolcher haben Dioskurias scheinbar über Nacht gewaltsam besetzt und haben nun die vollständige Kontrolle über das heilige Gelände des Heiligtums der Dioskuren." 
  
 rebuffed_suani_elders: "Zurückgewiesene Älteste der Suani" 
 desc_rebuffed_suani_elders: "Das kolchische Gericht weigerte sich, den Suani bei ihren Verhandlungen zu helfen." 
  
 suani_stations: "Suani-Posten" 
 desc_suani_stations: "Den Suani wurde in Dioscurias der gesamte benötigte Platz zur Verfügung gestellt, zum Nachteil und Missfallen der Einheimischen." 
  
 suanian_discurias_trade: "Suanischer Dioscurias-Handel" 
 desc_suanian_discurias_trade: "Die Suani, die nun für Dioscurias verantwortlich sind, haben den Export von Kunsthandwerk und wertvollen Luxusgütern gesteigert." 
  
 dioscurias_ethnic_violence: "Ethnische Gewalt bei Dioskurias" 
 desc_dioscurias_ethnic_violence: "Es ist selten und beängstigend, ethnische Spannungen an einem so bemerkenswert vielfältigen Ort aufleben zu sehen, wobei die Griechen so weit gehen, die Suani aus der Stadt zu vertreiben." 
  
 resentful_suani: "Verbitterte Suani"
 desc_resentful_suani: "Die Suani verübeln dem Thron von Kolchis, dass er ihre Kaufleute und Handwerker in der Stadt Dioskurias nicht geschützt hat." 
  
  #################### 
  # Decisions 
  #################### 
 colchis_decision_1: "Das goldene Vlies"
 colchis_decision_1_desc: "Während die Griechen von Phasis behaupteten, den letzten Strang des berühmten goldenen Vlies abgehalten zu haben und es als Stück des griechischen Erbes angepriesen zu haben, wissen wir, dass das Vlies immer in Kolchische Hände gehörte. Ein vertrauenswürdiger Berater des Hohepriesters ist mit einer bemerkenswerten Sache hervorgekommen. Es hat einen Unglauben im Gerichtshof verursacht. In seinen Händen hielt er das Vlies eines Widders ... so golden, so leuchtend, so herrlich in seiner Färbung, dass es nur göttlich hätte sein können. Dennoch fehlte ein Patch im Display. Einige glauben, dass die Götter einen einsamen Bauern mit einem goldenen Widder präsentierten, damit ein anderes Vlies Kolchis gehören kann." #NT!
  
 colchis_decision_2: "Die Verehrung von Iason"
 colchis_decision_2_desc: "Richten Sie eine heilige Stätte für Jason von den Argonauten ein" #NT!
  
 colchis_decision_3: "Die Verehrung von Aietes"
 colchis_decision_3_desc: "Richten Sie eine heilige Stätte für König Aietes von Kolchis ein" 
  
 restore_palace_aeetes: "Den Palast des Aietes wiederherstellen" 
 restore_palace_aeetes_desc: "Der König des alten Kolchis, den Iason mit Hilfe von Medea (der Tochter des Königs) mühelos besiegte, regierte einst von einem prächtigen Palast aus, der direkt am Pontos Euxinos in dem Gebiet lag, das heute als Phasis bekannt ist. Der Palast, den viele für längst verloren gehalten hatten, ist noch immer in seiner zerstörten Form erhalten. Es liegt nun an den neuen Herrschern von Kolchis, dieses alte Wunderwerk wiederherzustellen und das Ansehen und die Ehre zurückzugewinnen, die Kolchis einst unter seinem Zaubererkönig genoss!"
 restore_aeetes_palace_deadline: "#Y Aietes' Palast#! wird in #G 2#! Jahren wiederhergestellt." 
  
 lazi_appeasement_trade: "Beschwichtigungshandel mit den Lazi"
 desc_lazi_appeasement_trade: "Wir haben Handel betrieben, der die Lazi begünstigt, um ihre Bedenken zu zerstreuen und ihre rebellische Aufmerksamkeit abzulenken." 
  
  
  #################### 
  # Treasures 
  #################### 
  
 stone_of_iason: "Der Stein von Iason" 
 stone_of_iason_desc: "Dieser Stein war einer von vielen, die Iason warf, um die Krieger abzulenken, die aus den Zähnen des Drachen entsprungen waren, kurz bevor er sie in ihrer Verwirrung besiegte. Seltsam poliert, wirft er die Frage auf, ob es sich wirklich um einen Stein handelt, der vor langer Zeit von den Händen des Halbgottes geworfen wurde." 
  
 the_golden_fleece: "Das goldene Vlies" 
 the_golden_fleece_desc: "Die glänzende Wolle des geflügelten Widders namens Chrysomallos, den Phrixus rettete und nach Kolchis brachte, war ein begehrter Schatz der Antike, der als „verloren“ galt, nachdem er von Iason geraubt worden war. Nun wurde das Vlies wieder „gefunden“ und erstrahlt, geschützt von den Hütern des kolchischen Throns, in voller Pracht in den Ländern am Rande der Welt." 
  
 golden_goat_rhyton: "Der goldene Ziegenrhyton" 
 golden_goat_rhyton_desc: "Dieses Rhyton, ein Trinkgefäß mit der Ausgussöffnung am unteren Ende, stammt aus den Werkstätten von Ekbatana und zeigt einen Widderkopf, dessen Maul sich an der Ausgussöffnung befindet. Es wird auf die Zeit der Achämeniden datiert." 
  
  ### GREAT WORKS 
 wonder_aeetes_palace: "Der Palast von Aietes" 
 wonder_aeetes_palace_desc: "Einst Sitz des gütigen und erfolgreichen Königs Aietes, bleibt dieser Hauptsitz von Kolchis, der lange Zeit vernachlässigt wurde, eine Attraktion für alle, die seine Mauern betrachten."
  
  ### GREAT WORK EFFECTS 
 gw_effect_aeetes_palace: "Vermächtnis von Aietes" 
 gw_effect_aeetes_palace_DESC: "Es gibt keinen griechischen oder kolchischen Mann oder eine kolchische Frau, die die Geschichte von Iason, seinen Argonauten, nicht gehört hat und wie sie den großen König Aietes von Colchis trafen, selbst ein Korinther aus alter Zeit. Kein Reisender konnte widerstehen, diesen heiligen und mächtigen Ort zu besuchen und dem gottgleichen Aietes Geschenke zu hinterlassen." 
  
