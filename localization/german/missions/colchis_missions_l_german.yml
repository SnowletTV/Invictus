  #################### #Done (24.11.25) 
  # Title 
  #################### 
 colchis_missions: "Das Vermächtnis des Zauberkönigs"
 colchis_missions_BUTTON_TOOLTIP: "Es wird ein langer Weg sein, die Erinnerung an die Heimat des Aietes wiederherzustellen, doch wir werden nicht aufgeben!" 
 colchis_missions_BUTTON_DETAILS: "Die Zauber wirken"
 colchis_missions_DESCRIPTION: "Die Geschichte des sagenumwobenen Kolchis reicht bis in die Zeit der Legenden zurück, als der antike Aietes über die neu gegründeten Länder entlang des Flusses Phasis herrschte. Nachdem er seine Besitztümer in Korinth aufgegeben hatte, regierte Aietes diesen fremden Ort als Meister der Magie und errichtete ein reiches und begehrenswertes Königreich inmitten der Sümpfe und Wälder des westlichen Kaukasus.\n\n Erstmals von den Assyrern als Qulha erwähnt, erlebte Kolchis im Laufe seiner Geschichte wiederholt Zeiten der Einheit und des Zerfalls. Es zerfiel in zahlreiche Kleinkönigreiche, um sich anschließend in zyklischen Abständen erneut zu einem großen Staat im Einzugsgebiet des Phasis zusammenzuschließen. Die natürliche Geografie des Landes machte Kolchis zu einem fruchtbaren Land, verurteilte es jedoch zugleich zu einer landschaftlichen Schönheit ohne nennenswerte wirtschaftliche Kapazitäten. Der Thron von Aia/Kutaisi konnte niemals mit den etablierten Königreichen in Hellas, Anatolien oder auf dem Iranischen Hochland konkurrieren.\n\n  Kolchis blieb am Rande der bekannten Welt, versteckt am Ende des „Gastlichen Meeres”, das erst nach den griechischen Entdeckungsfahrten und Kolonisationen diesen Namen erhielt. Dies änderte sich, als das Achämenidenreich seine Grenzen bis an Kolchis heran ausdehnte, nachdem das benachbarte kaukasische Iberien in das Satrapiensystem eingegliedert worden war. Von diesem Zeitpunkt an waren die Händler, Märkte und die Verwaltung von Kolchis viel stärker mit dem Mittelmeer und der Ägäis verflochten, doch blieb es weiterhin eine reine Schwarzmeermacht. Vielleicht ist nun die Zeit gekommen, dass die alten Herrschaftsgebiete des Aïetes über ihre Wiege hinauswachsen und die Möglichkeiten erkunden, die ihnen die Welt zu bieten hat." 
 colchis_missions_CRITERIA_DESCRIPTION: "Diese Mission gilt als abgeschlossen, wenn Kolchis sowohl die Ehre und das Vermächtnis des Aïetes wiederhergestellt als auch den Pontos Euxeinos erobert hat." 
 colchis_missions_REWARD_DESCRIPTION: "Kolchis wird militärische und wirtschaftliche Fähigkeiten erlangen, die jene der Mittelmeermächte im Süden übertreffen."
  
  
  #################### 
  # Mission Tasks 
  #################### 
  
 colchis_missions_task_01: "Preise in 300 Sprachen" 
 colchis_missions_task_01_DESC: "Die Stadt Dioskurias, die angeblich von den Dioskuren selbst gegründet wurde, entwickelte sich zu einem vielbesuchten Hafen für Menschen aller Art aus dem Kaukasus, dem Schwarzmeerraum, der Steppe und Anatolien. Berühmt für ihre Salzvorkommen, sind die Märkte von Dioskurias derart vielfältig und weitläufig, dass man angeblich an einem einzigen Tag beim Durchstreifen der Stadt zwischen 70 und 300 verschiedene Sprachen hören kann. Die Kolcher müssen größeren Nutzen aus den natürlichen Vorzügen Dioskurias' ziehen." 
 colchis_missions_task_01_tt: "Wir werden uns in die vielfältigen Märkte der Küste wagen." 
  
 colchis_missions_task_02: "Kujis juwelenbesetzte Burg" 
 colchis_missions_task_02_DESC: "Tsikhegoji, den die Griechen als Archaeopolis kannten, wurde auf gewaltigen Kalksteinvorkommen und auf einem leicht zu verteidigenden hügeligen Gebiet am Rande der Ebenen erbaut und lag an einer wichtigen Handelskreuzung. Die Stadt profitierte direkt von den Edelstein- und Edelmetallminen in den Bergen, die sie überragten. Somit war es sowohl ein strategisch günstiger als auch ein prestigeträchtiger Ort für eine Festung – aber vielleicht können wir eine passendere Festung für denjenigen schaffen, der den kolchischen Thron innehat." 
  
 colchis_missions_task_03: "Der goldene Fluss" 
 colchis_missions_task_03_DESC: "Der Phasis, benannt nach den glitzernden Brocken, die sich zwischen den Felsen und Kieselsteinen am Grund befinden, ist die Lebensader des Handels und der Kommunikation zwischen unserer Hauptstadt und dem Großraum Pontos. Wir müssen ihn kontrollieren und als den eigentlichen Antrieb unserer Wirtschaft nutzen." 
 colchis_missions_task_03_tt: "Schon bald könnten zahlreiche #Y Geschenke#! flussabwärts zu uns gelangen ..." 
  
 colchis_missions_task_04: "Eine Hochzeit in den Bergen"
 colchis_missions_task_04_DESC: "Mitglieder des Hofes von Kolchis und seiner Königsfamilie unterstützten Parnawas I. dabei, dem Tyrannen Azo den iberischen Thron zu entreißen. Die Beziehung zwischen den beiden Königsfamilien ist angespannt. Es könnte von Vorteil sein, unsere Beziehung durch eine königliche Hochzeit zu festigen." 
  
 colchis_missions_task_05: "Schutz der Rosenstadt" 
 colchis_missions_task_05_DESC: "Vardtsikhe, von den Griechen als Rhodopolis oder Stadt der Rosen bekannt, liegt in einer offenen Ebene und ist eine üppige, aber verletzliche Blume der Zivilisation. Sollten Feinde wie eine Horde heranstürmen und durch die Gebirgspässe wie Lawinen hinabströmen, muss die Stadt vorbereitet und geschützt sein. Andernfalls wird diese Blume ihre Blüten hängen lassen und verwelken." 
  
 colchis_missions_task_06: "Die Sümpfe trockenlegen" 
 colchis_missions_task_06_DESC: "Viele sagen, dass das Königreich und das Volk von Kolchis vor allem durch seine natürliche Landschaft zurückgehalten werden. Die Kolcher sind zwar daran gewöhnt, sich durch Kanalnetze und sumpfiges Gelände zu schlagen, um Waren zu den Märkten im Landesinneren und an der Küste zu transportieren, aber wenn diese manchmal nachteiligen Eigenschaften des Landes beseitigt würden, könnten Städte expandieren und mehr Straßen gebaut werden, um die Handelswege zu erweitern und das Wachstum des Produktionssektors zu fördern." 
 colchis_misisons_task_6_tt: "Jede Provinz in der Provinz [GetProvince('(int32)1711').GetArea.GetName] wird #Y $replaced_the_swamp$#! erhalten." 
  
 colchis_missions_task_07: "Der Indo-Euxinos-Handel" 
 colchis_missions_task_07_DESC: "Während das iranische Hochland schon immer als eine der wichtigsten Handelsrouten diente, gab es auch alternative Routen für kostengünstigen Seetransport über den Pontos Euxinos und das Mazandaranische Meer, die in die Bosporus-Meerenge und dann in die reiche Ägäis mündeten. Der Ausbau der Infrastruktur entlang des Flusses Phasis sollte den kolchischen Händlern einen besseren und schnelleren Zugang zu weit entfernten Waren ermöglichen." 
 colchis_missions_task_07_tt: "#Y 3#! Territorien in der Provinz #E Kolchis#! müssen #Y Städte #! mit #Y 2#! oder mehr #E Marktplätzen#! sein." 
  
 colchis_missions_task_08: "Eine kaukasische Union" 
 colchis_missions_task_08_DESC: "Während sich die Kolcher lange Zeit auf ihre Küstengewässer und die Sicherheit ihrer Seite der Gebirgspässe beschränkt haben, lässt sich nicht bestreiten, dass der innere Südkaukasus über größere Bodenschätze und bessere Handelsverbindungen zu den Steppenvölkern im Norden verfügt, insbesondere über das zentrale Kaukasische Tor. Die Vereinigung der Häuser von Aietes und Parnawas könnte zu einem bedeutenden regionalen Machtgefüge führen." 
  
 colchis_missions_task_09: "Die Delegation der Skeptoucki" 
 colchis_missions_task_09_DESC: "Angesichts der wachsenden Zahl von Angelegenheiten, die die Aufmerksamkeit eines Königs erfordern, ist eine Delegation von Aufgaben unerlässlich, um die Effizienz und das Wachstum Kolchis' aufrechtzuerhalten. Ein System königlicher Statthalter, die aus allen größeren Städten und Siedlungen im Phasis-Delta und darüber hinaus regieren, soll dazu beitragen, die tägliche Ordnung aufrechtzuerhalten, indem sie die zeremoniellen Aufgaben des Königs wahrnehmen." 
  
 colchis_missions_task_10: "Der Palast von Aietes" 
 colchis_missions_task_10_DESC: "Zwar gibt es niemanden in ganz Kolchis, der nicht die Geschichte von Aietes und den Argonauten, die ihn besiegten, erzählen kann, ganz zu schweigen von seiner zauberkundigen Tochter Medea, doch nur wenige können über das Land blicken und dorthin zeigen, wo der alte König lebte. Dort liegt eine alte und vergessene Ruine am Rande der Stadt Phasis. Die Berater des Throns glauben, dass diese überwucherten und sumpfigen Relikte der Vergangenheit die wenigen verbliebenen Überreste eines alten Palastes sind – desselben Palastes, in dem Aietes auf seinem Thron saß und eines der mächtigsten Königreiche der sagenumbwobenen Vergangenheit regierte. Um unser Erbe zurückzugewinnen und erneut die Rolle des reichen Handelszentrums der Meere zu übernehmen, müssen wir den alten Glanz dieses Ortes wiederherstellen." 
 colchis_missions_task_10_tt: "#Y Kolchis#! muss die Entscheidung #E Wiederherstellung des Palasts von Aietes#! getroffen haben, und die #G Wiederherstellung#! des #Y Palasts von Aietes#! muss abgeschlossen sein." 
  
 colchis_missions_task_11: "Die östliche Küste des gastlichen Meeres"
 colchis_missions_task_11_DESC: "Der Pontos Euxinos ist nur aufgrund der Dichte und des Reichtums des Handels, der das Meer und seine Küsten überzieht, als solcher bekannt geworden. Während die Lage Kolchis im Osten den transkaukasischen und kaspischen Handel aus dem Osten ermöglicht hat, wird die Kontrolle über größere Teile der Nord- und Südküste eine Expansion in die Märkte der Steppe, Tauris und Anatoliens ermöglichen. Zudem würde Kolchis dadurch eine größere Kontrolle über die örtlichen Gewässer erlangen und könnte Piraterie sowie ernsthafte Konkurrenten in Schach halten." 
  
 colchis_missions_task_12: "Eine Inspirierte Verwaltung" 
 colchis_missions_task_12_DESC: "Die 19. Satrapie der Achämeniden umfasste einst die südlichen Grenzgebiete Kolchis'. Obwohl die Perser im Süden mitunter aggressiv und aufdringlich auftraten, waren sie für ihre außergewöhnliche Ordnung und ihre Fähigkeit bekannt, jede Art von administrativer Herausforderung politischer oder gesellschaftlicher Natur zu bewältigen. Da sich die Macht des Königs über zahlreiche königliche Statthalter in den bedeutenden Städten erstreckt, liegt die zentrale und effiziente Kontrolle der Angelegenheiten in den Händen vermeintlich loyaler Verwalter. Wenn der kolchische Hof sich von der achämenidischen Art der Kommunikation, regelmäßigen Überprüfung und kulturellen Sensibilität inspirieren ließe, könnte es wesentlich einfacher werden, die Loyalität und Leistungsfähigkeit dieser Skeptoukhi zu gewährleisten." 
 colchis_missions_task_12_tt: "#Y 0#! Familien sind #R verachtet#!"
  
 colchis_missions_task_13: "Die Meerengen kontrollieren" 
 colchis_missions_task_13_DESC: "Der Bosporus und die Kimmerische Meerenge kontrollieren und begrenzen den Schiffsverkehr, der von Norden und Süden in das Schwarze Meer hinein- und aus ihm herausführt. Zwar hat Kolchis schon immer vom Handel profitiert, der über diese Meerenge nach Norden fließt, doch geht durch den fehlenden direkten Einfluss auf diese Meerenge und die dort erhobenen Abgaben viel potenzieller Gewinn verloren. Der Bosporus und der Kimmerische Bosporus sind Machtmonopole – um sie zu kontrollieren, müssen die Flotten und Kaufleute von Kolchis sie besitzen...vollständig." 
  
 colchis_missions_task_14: "Hegemon des Pontos Euxinos" 
 colchis_missions_task_14_DESC: "Wirtschaftlich und politisch könnte Kolchis zu einer unbezwingbaren Macht werden, wenn es den gesamten Pontos Euxinos kontrollieren würde und damit alleinige Entscheidungsgewalt über Schifffahrt, Personenverkehr und militärische Angelegenheiten hätte. Würde das Meer zu Kolchis' eigenem Binnensee werden, würden der Thron und das Vermächtnis des alten Aïetes sogar jene Griechen übertreffen, die ihn einst bezwungen haben." 
 colchis_missions_task_14_tt: "#Y [THIS.GetCountry.GetName]#! muss #E alle Küstengebiete#! entlang der Provinzen #T Schwarzes Meer#! und #T Maeotisches Meer#! besitzen."
  
  
  
  #################### 
  # Events 
  #################### 
  
 me_colchis_1_title: "Die Sprache des Steppenhandels"
 me_colchis_1_desc: "Während der Sommermonate überqueren die nomadischen Hirtenvölker der nördlichen Ebenen und Steppen die Gebirgspässe und kommen zum Hafen von Dioskurias herab, um ihre Waren und Dienstleistungen gegen Salz einzutauschen, mit dem sie ihr Fleisch haltbar machen und würzen. Wir sollten einige unserer eigenen königlichen Händler zum Hafen entsenden, um Kutaisi mit den notwendigen Gütern zu versorgen." 
 me_colchis_1.a: "Auch wir wollen das schwer zu beschaffende Salz dieses geschäftigen Hafens erwerben." 
 me_colchis_1.b: "Lasst uns die kolchische Sprache auf diesem Marktplatz weiter verbreiten." 
 me_colchis_1.c: "Die Steppenvölker fertigen meisterhafte Metallarbeiten. Der Thron sollte einige davon besitzen." 
 me_colchis_1.d: "Die Pferdefürsten würden stattdessen auf unseren Märkten bessere Möglichkeiten finden." 
  
 me_colchis_2_title: "Salz für die Heniochi" 
 me_colchis_2_desc: "Die Griechen von Dioskurias haben sich stets als besser als die Heniochi-Stämme angesehen - beide behaupten, Kinder der Dioskuri zu sein. Dioskurias aber beansprucht den Namen der Zwillinge, während das Stammesvolk einfach den Spitznamen "Die Wagenlenker" beansprucht. Doch so sehr die Griechen den Umgang mit den Stammesangehörigen auch verachten, so sind eben diese Hirtenvölker doch ihre besten Kunden: Sie kaufen regelmäßig große Mengen Salz, um ihren Fisch zu würzen, und verkaufen im Gegenzug billige Pelze. Zwar gelten die Heniochi unter den Griechen als Wilde und Piraten, die in schlanken Booten segeln, die man über Land tragen kann, doch an den Marktständen sind sie die wahrhaftigsten Ehrenmänner, die stets einen fairen Preis zahlen. \n\nMan sagt, dass die Heniochi einst weiter südlich bis zum Fluss Phasis lebten und ein Ableger der Phasioi waren, die vor langer Zeit von den Griechen vertrieben wurden; doch nun sind sie auf ihre einsamen Klippen und kleinen Häfen beschränkt. Vor diesem Hintergrund war es umso merkwürdiger, als ein Bote aus Dioskurias durch die Hallen eilte und behauptete, die Heniochi hätten alle bisherigen Gepflogenheiten gebrochen und würden gerade in diesem Moment den Hafen von Dioskurias angreifen. Die Griechen haben uns inständig gebeten, ihnen bei der Zerstörung der Wilden zu helfen." 
 me_colchis_2.a: "Wir werden diesen Augenblick nutzen, um Macht und Einfluss über beide zu gewinnen." 
 me_colchis_2.b: "Hier stimmt etwas nicht. Schickt einen bewaffneten Gesandten, um zu verhandeln." 
 me_colchis_2.c: "Die Heniochi könnten sich als wertvolle Verbündete erweisen – überlasst ihnen Dioskurias im Austausch für einen Gefallen." 
 me_colchis_2.d: "Mögen die widerwärtigen Griechen leiden. Ironie schmeckt am besten an der Spitze eines Speeres." 
  
 me_colchis_3_title: "Die magische Pflanze"
 me_colchis_3_desc: "Eine bestimmte Gruppe von Händlern jenseits der Symplegaden erfreut sich in letzter Zeit großer Beliebtheit im Hafen von Dioskurias. Während der Reichtum an Erzen, Gold, Pelzen, Lebensmitteln und Einrichtungsgegenständen häufig Gesprächsthema in der Stadt ist, haben diese sonderbaren Männer die Herzen der Menschen mit ihren Blumen erobert.\n\nSie schritten durch die Straßen und entlang der Flussufer und hielten die bauschigen, gelben Blütenköpfe mit ihren dicken Stielen in die Höhe; in ihrer Gruppe hatten sie Sklaven, die keine Angst vor der sengenden Sonne und ihrem grellen Schein hatten. Die Soldaten waren ihre besten Kunden, und nachts hallte in den Gasthäusern ungewöhnlich lautes Gelächter wider, während von morgendlicher Übelkeit weder etwas zu hören noch zu sehen war. \n\nSogar ein örtlicher Priester des Ghmerti erwarb ein Bündel dieser Pflanzen und ließ uns bei einer Begegnung wissen, dass der König seinem Volk einen großen Dienst erweisen würde, wenn die Flussufer das ganze Jahr über mit diesen sonderbaren gelben Knollen bepflanzt würden." 
  me_colchis_3.a: "Wir werden keine Mittel für Blumen verschwenden." 
 me_colchis_3.b: "Versuchen wir es doch mal mit...Botanik." 
 me_colchis_3.c: "Die größten Heiler, aus nah und fern, sollen sich dieser Sache annehmen." 
 me_colchis_3.d: "Vielleicht würde auch mein Schlafgemach dadurch etwas lebhafter werden ..." 
  
 me_colchis_4_title: "Die Verehrung der Dioskuren" 
 me_colchis_4_desc: "Als große Reisende, Wagenlenker und Kolonisatoren sind die Dioskuren in der gesamten bekannten Welt berühmt. Entlang der Küste des Pontos Euxinos werden sie jedoch besonders verehrt, und alle Einwohner von Dioskurias kennen ihre Namen und sprechen ein Gebet, bevor sie an Bord der Schiffe im Hafen gehen. Sie waren schon immer ein untrennbares Duo, und es ist unsere Pflicht, ihr Ansehen in unserem Teil der Welt zu wahren." 
 me_colchis_4.a: "Sorgt lediglich dafür, dass ihre Weihestätten nicht entweiht werden." 
 me_colchis_4.b: "Errichtet einen prächtigen Tempel für die Wagenlenker!" 
 me_colchis_4.c: "Die Dioskuren und ihr Heiligtum sollen allein uns zur Verehrung vorbehalten sein." 
  
 me_colchis_5_title: "Meisterwerke der Suani" 
 me_colchis_5_desc: "Die Suani, ein äußerst geheimnisvolles Volk aus den Bergen, kommen oft in die Agora von Dioskurias, um raffinierte Meisterwerke zu verkaufen. Ihre Werkstätten und Stände zählen zu den meistbesuchten – selbst schon wahre Wunderwerke, die zugleich schlicht und doch sehr kunstvoll gestaltet sind. In letzter Zeit haben sich viele von ihnen entschieden, in der Hafenstadt zu bleiben, doch ihre eher zurückgezogenen und traditionellen Bräuche haben zu Konflikten mit den Stadtbewohnern geführt, die als dauerhafte Einwohner und nicht als reisende Händler leben. Für diese Leute sind die Suani ein seltsames und unzuverlässiges Völkchen, das seine Sachen packen und zurück in die Berge fliehen sollte. \n\nDa zahlreiche suanische Stämme innerhalb unserer eigenen Grenzen und Städte leben und ihre Sprache und Kultur den kolchischen Gepflogenheiten weniger fremd sind, haben mehrere ihrer Stammesführer Gesandte an unseren Hof geschickt. Sie hoffen, dass wir gemeinsam mit der örtlichen Verwaltung von Dioskurias eine Vereinbarung zu ihrem Schutz aushandeln können." 
 me_colchis_5.a: "Die Suani sind auf sich allein gestellt" 
 me_colchis_5.b: "Wir unterstützen die Suani voll und ganz!" 
 me_colchis_5.c: "Die Suani haben schon immer ihren eigenen Hafen gebraucht ..." 
 me_colchis_5.c.t: "Die Stadt #Y Dioskurias#! wird zu einer #T Suanischen#! #Y Bundstadt#! innerhalb von #E Kolchis#!." 
 me_colchis_5.d: "Die Griechen sind unsere Handelspartner." 
 me_colchis_5.e: "Die Suani sind uns politisch schon viel zu lange ein Dorn im Auge." 
 me_colchis_5.e.t: "#E [suani_leader.GetName]#! entfacht unter dem Banner des #Y Svanischen Königreichs#! einen Bürgerkrieg."
 me_colchis_5.f: "Die Suani sind die stärksten Männer Kolchis'." 
 me_colchis_5.f.t: " Ihr übernehmt die Kontrolle über das #Y Svanische Königreich#!." 
  
 me_colchis_6_title: "Das bewachten Juwel" 
 me_colchis_6_desc: "Die Festung liegt hoch und mächtig da und blickt herab auf die Wagen der Händler und Boten, die die vor ihr verlaufenden ausgetretenen Straßen überqueren. Von hier aus lassen sich ein Großteil des lokalen Handels und der Schutzmaßnahmen verwalten, und viele Menschen von hohem Stand haben sich unter ihren mit funkelnden Steinen besetzten Festungsmauern versammelt." 
 me_colchis_6.a: "Diese schützende Bastion soll in vollem Glanz erstrahlen!"
  
 me_colchis_7_title: "Land der Fasane" 
 me_colchis_7_desc: "Dank unserer Investitionen und des Wachstums entlang des Phasis ist die Zahl der einheimischen Fasane, die aus den dichten Wäldern herabkommen, um aus den Bächen und am Flussufer selbst zu trinken, auf seltsame und ziemlich erfreuliche Weise gestiegen. Zwar sind sie eine niedliche Bereicherung der Naturlandschaft, doch die kleinen Schwärme beginnen, den Menschen bei der Ausübung ihrer täglichen Geschäfte im Weg zu stehen.\nWie sollen wir mit diesem Phänomen umgehen, bevor es zu einem größeren Problem für unsere Bauern und Arbeiter wird?" 
 me_colchis_7.a: "Geflügel soll die Teller unseres Volkes füllen." 
 me_colchis_7.b: "Vielleicht wissen andere Länder diesen Vogel zu schätzen?" 
 me_colchis_7.c: "Das klingt nach einem örtlichen Problem ..." 
  
 me_colchis_8_title: "Mit Fellen Sieben"
 me_colchis_8_desc: "Unser Volk ist es gewohnt, die flauschigen Schaffelle in den Fluss Phasis zu tauchen. Mit etwas Glück kann man sie anschließend mit einer goldenen Färbung wieder herausziehen, da sich Goldflöckchen darin verfangen haben. Vor Kurzem entdeckte ein Bauer, dessen Name nicht überliefert ist, ein großes Vorkommen an Goldnuggets und Goldstücken im Fluss. Seitdem sind zahlreiche Menschen aus den Dörfern, Werkstätten und von den Höfen herbeigeströmt, um ihr eigenes Glück bei der Suche nach dem Reichtum des Flusses zu versuchen. Diese Entwicklung bereitet einigen am Hof Sorgen hinsichtlich der allgemeinen Arbeitsproduktivität ..." 
 me_colchis_8.a: "Lasst das Volk zu den Ufern des Flusses strömen, den Reichtum seiner Heimat ernten und Wohlstand erlangen." 
 me_colchis_8.b: "Die Krone soll das Aussieben des Flusses kontrollieren, denn es ist das Land der Krone." 
  
 me_colchis_9_title: "Ein Stück Vergangenheit" 
 me_colchis_9_desc: "Ein einfacher Wanderer ist mit einem breiten Grinsen vor unseren Hof getreten. Er sagt, der Stein sei einer jener Steine, die Iason von den Argonauten während seiner Prüfungen in Kolchis zwischen die Krieger warf, die aus gesäten Drachenzähnen gewachsen waren – gefunden im Flussbett des Phasis selbst, auf dem die Argonauten bei ihrer Flucht segelten. Diese Steine lenkten die Krieger ab und ermöglichten es Iason, sie zu besiegen. So gelang es ihm, das Goldene Vlies zu rauben, das dieses Land als heilig verehrte. Selbst wenn es sich bei diesem Stein tatsächlich um ein Relikt jenes Kampfes handelt, so trug er doch zur Niederlage unseres legendären Anführers bei. Wie können wir ihn also in Ehren halten?" 
 me_colchis_9.a: "Dieser Schatz wird für Griechen überall ein Objekt der Neugier sein!"
 me_colchis_9.b: "Wir werden diesen Stein rituell zerstören und damit jene piratenhaften Argonauten anprangern." 
 me_colchis_9.c: "Vielleicht würden die Griechen Iasons Vermächtnis sogar kaufen..." 
 me_colchis_9.d: "Es ist nur ein Stein, nichts weiter. Schafft diesen Lügen verbreitenden Tagträumer fort." 
  
 me_colchis_10_title: "Eine Verbindung zwischen den Kujiden und Pharnavaziden" 
 me_colchis_10_desc: "Kuji und Pharnavaz I. trafen sich in der neuen Burg von Mzcheta, um über die Lage im südlichen Kaukasus zu beraten, nachdem der alte Azo gestürzt und hingerichtet worden war. Um Missgunst und schädliche Rivalitäten zu verhindern, schlug Pharnavaz I. Kuji vor, seine Schwester Barbare zu heiraten und so die beiden Königshäuser miteinander zu vereinen. Nun, da der alte Kuji auf seinem Thron sitzt, muss er entscheiden, welcher Weg für sein Volk der beste ist." 
 me_colchis_10.a: "Ich werde Barbare heiraten, Schwester von Pharnavaz I." 
 me_colchis_10.b: "Stattdessen werde ich Mandanis, die Mutter Pharnavaz' I., heiraten." 
 me_colchis_10.c: "Ich weigere mich, in diese Familie einzuheiraten und zu ihrem Vasallen zu werden!" 
  
 me_colchis_11_title: "Der kolchisch-iberische Status" 
 me_colchis_11_desc: "Nachdem die Throne von Kolchis und Kaukasisch-Iberien durch eine Heirat miteinander verbunden wurden, hat Pharnavaz I sowohl sprichwörtlich als auch buchstäblich an unsere Tür geklopft, um über den Status von Kolchis im Verhältnis zu Iberien zu sprechen. Kuji ist mit der Schwester von Pharnavaz verheiratet, und da Iberien eine patriarchalische Gesellschaft ist, wird der Thron an Pharnavaz' eigenen Sohn fallen. Die Kinder Kujis werden jedoch einen umstrittenen Anspruch auf Kolchis selbst erheben können – ihre eigene Heimat. Viele vermuten, dass Pharnavaz Kolchis gerne zu einem seiner Eristavi-Fürstentümer machen würde, wodurch Kuji in seiner eigenen Heimat auf die Rolle eines einfachen Statthalters herabgestuft würde. Eine solche Ordnung könnte zwar für größere Stabilität und eine engere militärische Zusammenarbeit zwischen den beiden Königreichen sorgen, doch besteht die Gefahr, dass die Bewohner Kolchis' in ihrer eigenen Heimat zu Bürgern zweiter Klasse werden." 
 me_colchis_11.a: "Das Saeristavo von Kolchis soll unter der Oberherrschaft der Pharnavaziden gedeihen."
 me_colchis_11.b: "Wir sollten uns für ein gleichberechtigtes Bündnis einsetzen."
 me_colchis_11.c: "Sollte Pharnavaz sterben, wäre unser Anspruch der stärkste..." 
  
 me_colchis_12_title: "Königliche Spannungen im Kaukasus"
 me_colchis_12_desc: "Da wir eine Heirat mit ihm abgelehnt haben, hat Pharnavaz I begonnen, Boten mit feindseligen Botschaften und scharfer Zunge zu entsenden. Unter dem Adel wächst die Sorge vor einem Krieg, doch gibt es stets diplomatische Wege, um Streitigkeiten beizulegen. Krieg ist schließlich nur eine weitere Form der Diplomatie." 
 me_colchis_12.a: "Ein Bündnis wird die Lage entspannen." 
 me_colchis_12.b: "Warum sollten wir nicht ihre Ländereien beherrschen..." 
  
 me_colchis_13_title: "Unsere Trümpfe ausspielen"
 me_colchis_13_desc: "Der kaukasisch-iberische Hof hat seine Karten auf den Tisch gelegt und versucht, uns zu unterwerfen. Doch wir bleiben standhaft, und unsere stärksten Trümpfe haben wir noch nicht ausgespielt. Jetzt oder nie. Die Kolcher sollten darauf drängen, dass sich die Iberer unterwerfen." 
 me_colchis_13.a: "Diese Spannung sorgt dafür, dass unsere Rivalen auf der Hut bleiben." 
 me_colchis_13.b: "Sie werden sich beugen oder dazu gezwungen werden." 
  
 me_colchis_14_title: "Rosen bewachen"
 me_colchis_14_desc: "Der Bau der verbesserten Befestigungsanlagen ist im Gange, hat jedoch unsere Ressourcen stark beansprucht. Diese blühende Stadt befindet sich in einer intensiven Wachstumsphase, und wir müssen weiter in sie investieren, wenn sie in schwierigen Zeiten zu einer Bastion unseres Volkes werden soll." 
 me_colchis_14.a: "Um uns solche Befestigungsanlagen leisten zu können, müssen wir die Rosenebenen gewinnbringend nutzen." 
 me_colchis_14.b: "Mehr Truppen zur Verteidigung der Stadtmauer benötigen mehr Nahrung." 
 me_colchis_14.c: "Wir werden rasch die unverteidigten Gebirgspässe einnehmen, von denen aus die Stadt überblickt werden kann." 
  
 me_colchis_15_title: "Rosengold" 
 me_colchis_15_desc: "Die Rosenminen waren schon immer reich an Metallerzen. Doch an einem ganz gewöhnlichen Tag glaubte einer der örtlichen Bergleute, einen hellen Schimmer durch den Schmutz und Ruß hindurch zu sehen, der alle Felsen bedeckte. Als sein Vorarbeiter nachschaute, entdeckte er eine weitere Lage goldener Adern, die sich durch den Hang zogen. Kolchis ist wahrlich das Land des goldenen Sandes! \nEinige sind jedoch der Meinung, dass diese Lagerstätte am besten genutzt würde, wenn man sie an private Bergleute auslagern würde. Ein seltsamer Mann, bekannt als der ‚Gold-Schnüffler‘, ist eingetroffen, um seine Dienste anzubieten – im Gegenzug dafür, dass er das Gold privat verwerten darf." 
 me_colchis_15.a: "Die Rosenstadt soll unverzüglich auf Goldförderung umgestellt werden."
 me_colchis_15.b: "Wer unsere Goldvorkommen ausbeuten möchte, soll kommen und für uns arbeiten." 
 me_colchis_15.b.t: "Ein Mann namens #Y Goldschnüffler#! wird als unbedeutender Charakter unserem Land beitreten." 
  
 me_colchis_16_title: "Unbeabsichtigte Überschwemmung" 
 me_colchis_16_desc: "Bei der Umleitung des Wassers aus dem Feuchtgebiet ist eines unserer hölzernen Gerüste gebrochen. Daraufhin ergoss sich eine gewaltige Flut über ein nahegelegenes Dorf, riss die Stützpfeiler zahlreicher Hütten mit sich und verärgerte die örtliche Bevölkerung."
 me_colchis_16.a: "Entschädigt die Bewohner für ihre Verluste und gebt ihnen zusätzlich etwas Nahrung." 
 me_colchis_16.b: "Wir werden das gesamte Dorf wiedererrichten, diesmal mit einem soliden Fundament."
 me_colchis_16.c: "Wo gehobelt wird, da fallen Späne..." 
  
 me_colchis_17_title: "Der griechische Architekt" 
 me_colchis_17_desc: "Während wir den Bau eines Entwässerungssystems planen, um die Feuchtgebiete von Kolchis endlich von ihrem natürlichen Nachteil zu befreien, ist ein griechischer Architekt und Ingenieur aus der Hafenstadt Phasis an unseren Hof gekommen und hat uns seine Dienste als Handwerksmeister und Konstrukteur ungewöhnlicher Vorrichtungen und Systeme angeboten. Er behauptet, er könne uns wertvolle Einblicke in die Gestaltung unseres Entwässerungssystems geben und würde sich unserer Sache verschreiben...gegen Bezahlung" 
 me_colchis_17.a: "Seine Dienste könnten sich als wertvoll erweisen." 
 me_colchis_17.b: "Bezahlt ihn für seine Entwürfe und schickt ihn anschließend fort."
 me_colchis_17.c: "Wir brauchen keine Hilfe von den Griechen!" 
  
 me_colchis_18_title: "Neues Land zur Bewirtschaftung" 
 me_colchis_18_desc: "Während die Feuchtgebiete allmählich trockengelegt werden, kommt zunehmend fruchtbares Ackerland zum Vorschein, das zuvor unter einer Schicht aus Schlamm und sumpfigem Boden verborgen lag. Es sollte unsere oberste Aufgabe sein, diese Gebiete auf neue Weise zu erschließen und sie endlich zum Wohle des kolchischen Volkes zu nutzen! Doch es bleibt die Frage: Wie? Und wo?" 
 me_colchis_18.a: "Lasst uns die Hirsefelder erweitern, die wir bereits bewirtschaften."
 me_colchis_18.b: "Vielleicht sollten wir den Anbau von Feldfrüchten in einem neuen Gebiet erproben." 
 me_colchis_18.c: "Überlassen wir die Entscheidung den Bauern."
 me_colchis_18.c.t: "Die Bauern sind faul und tun #Y NICHTS#!." 
  
 me_colchis_19_title: "Unser Anteil am Handel" 
 me_colchis_19_desc: "Die Handelsrouten, die bis in den Fernen Osten in die Länder der Indoi und noch weiter führen, haben unseren Häfen und den Märkten am Schwarzen Meer großen Reichtum beschert. Angesichts dessen möchten die Zollbeamten und Zollstellen in unseren Häfen die Abgaben für den Warentransport entlang des Flusses Phasis erhöhen. Wir müssen entscheiden, wie wir vorgehen, wie wir Gewinn erzielen, ohne diesen lukrativen Handel zu ersticken." 
 me_colchis_19.a: "Der Handel soll frei fließen." 
 me_colchis_19.b: "Der Adel soll seinen Anteil erhalten." 
 me_colchis_19.c: "Die Kaufleute sollen dem Thron ihren Anteil entrichten."
  
 me_colchis_20_title: "Weitere Sprachen zu erlernen" 
 me_colchis_20_desc: "Viele neue Völker haben unsere Küsten erreicht, sei es über den Pontos Euxinos oder aus den Gebieten jenseits des Kaukasus. Sie haben unserer ohnehin einzigartigen kulturellen Vielfalt zweifellos eine weitere Facette hinzugefügt. Angesichts der zunehmenden Vielfalt in unserem Land stellt sich die Frage, wie wir mit den neu hinzugekommenen Völkern umgehen sollen." 
 me_colchis_20.a: "Die Menschen sollen sich frei niederlassen können, wo sie es möchten."
 me_colchis_20.b: "Die Hauptstadt wird weitere Übersetzer benötigen." 
 me_colchis_20.c: "Telephis ist bereits ein Ort für Fremde – machen wir es zu seiner eigentlichen Bestimmung." 
 me_colchis_20.c.t: "Die Stadt #Y Telephis#! wird zu einer #Y Bundstadt#! von #E Kolchis#!."
 me_colchis_20.d: "In Phasis sollen weitere Arten von Werkstätten entstehen." 
  
 me_colchis_21_title: "Ein östlicher Schatz" 
 me_colchis_21_desc: "Auf dem Rücken eines Steppenreiters kaspischer Abstammung stießen unsere Staatskaufleute auf einen kunstvoll gearbeiteten goldenen Rhyton in Form eines Ziegenkopfes. Was sollen wir mit einem derart erlesenen Stück tun?" 
 me_colchis_21.a: "Unsere Tempel sollen diese Kunst ausstellen."
 me_colchis_21.b: "„Es wird meinen Thronsaal schmücken." 
 me_colchis_21.c: "Käufer gibt es zuhauf." 
  
 me_colchis_22_title: "Eine Union des Kaukasus"
 me_colchis_22_desc: "Da ein großer Teil der kaukasischen Region nun unter unserer direkten oder indirekten Kontrolle steht, fragen sich viele, welche Ziele wir verfolgen und welche Rolle wir in dieser Region einnehmen wollen. Einige unter den kolchischen Adligen bevorzugen unsere Vormachtstellung und hegen weitreichende Ambitionen für eine größere kolchische Einflusssphäre entlang der Gebirgszüge und Küstenregionen. Andere hingegen bevorzugen eine stärker lokal ausgerichtete Politik, die den Bedürfnissen und Wünschen der zahlreichen Völker innerhalb unseres Herrschaftsgebiets Rechnung trägt. Welchen Weg sollen wir einschlagen?" 
 me_colchis_22.a: "Wir werden als das dominierende Königreich den Weg weisen." 
 me_colchis_22.b: "Die Einheit von Kolchern und Iberern ist von größtem Nutzen." 
 me_colchis_22.c: "Wir werden das erste transkaukasische Reich schaffen." 
 me_colchis_22.d: "Die Dinge werden am besten so gelassen, wie sie sind." 
  
 me_colchis_23_title: "Statthalter-Befugnisse" 
 me_colchis_23_desc: "Die Insignien des Königs von Kolchis wurden in großer Zahl neu angefertigt und an die ausgewählten königlichen Statthalter der kolchischen Teilfürstentümer verteilt. Diese Praxis dürfte einige Aspekte der Verwaltung erleichtern, doch besteht die Befürchtung, dass die Statthalter angesichts ihrer weitreichenden Befugnisse gierig und aufsässig werden könnten." 
 me_colchis_23.a: "Ihre Befugnisse sollen eingeschränkt bleiben." 
 me_colchis_23.b: "Die königlichen Statthalter sollten dem Thron in nichts nachstehen"
  
 me_colchis_24_title: "Die Wege eines Untertanen" 
 me_colchis_24_desc: "Nachdem sie nun schon seit einiger Zeit unter der Herrschaft der kaukasischen Iberer leben, haben die Menschen (insbesondere der Adel) in Kolchis unterschiedliche Meinungen über die Iberer entwickelt. Viele haben durch die Zusammenarbeit mit iberischen Händlernetzwerken und den Zugang zu diesen ihren persönlichen Wohlstand gesteigert. Andere hegen eine Abneigung gegen die Iberer und ihre Bräuche und empfinden es als beschämend, von einem solchen Volk unterworfen zu sein. Es gab einige Forderungen, unsere Rolle in dieser Machtdynamik zu ändern." 
 me_colchis_24.a: "Die iberische Herrschaft sorgt für Sicherheit." 
 me_colchis_24.b: "Wir müssen versuchen, in dieser Beziehung die führende Rolle zu übernehmen." 
 me_colchis_24.c: "Die Beseitigung von Pharnavaz I. sollte uns von diesem Bündnis befreien." 
  
 me_colchis_25_title: "Den Palast des Aietes wiederhergestellt" 
 me_colchis_25_desc: "Der alte Palast von König Aietes aus der Argonauten-Sage und anderen alten Legenden, der lange Zeit dem Verfall preisgegeben war, wurde wieder zu seiner rechtmäßigen Pracht und Bedeutung restauriert. Alle Kolcher werden ihn als glorreiche Attraktion für Händler, Diplomaten und Entdecker feiern, die in den entlegensten Winkeln der Welt nach neuen Geschichten suchen." 
 me_colchis_25.a: "Gepriesen sei der alte Zauberkönig."
  
 me_colchis_26_title: "Ein Thron der Aietiden"
 me_colchis_26_desc: "Angesichts des großen Aufsehens um den neuen Palast in Phasis haben zahlreiche hochrangige Berater vorgeschlagen, die Hauptstadt und die Verwaltungszentren in den wiederhergestellten Palast des Aietes zu verlegen. Dies könnte sich als vorteilhaft erweisen, insbesondere angesichts des schnelleren Zugangs zum Pontos Euxinos. Was sollen wir tun?" 
 me_colchis_26.a: "Der Palast von Aietes wird eine mächtige Hauptstadt sein."
 me_colchis_26.b: "Der Sitz der Macht bleibt, wo er ist." 
  
 me_colchis_27_title: "Die Häfen von Trapezous" 
 me_colchis_27_desc: "Ein bekannter Kaufmann wurde fünf Parasangen östlich des Hafens von Trapezous an den Strand gespült. Er behauptet, dass es für Schiffe aufgrund des stürmischen Wetters an der südlichen Küste des Euxinos schwierig sei, den Hafen zu erreichen, wenn Poseidon seinen Dreizack erhebt und heftige Wellen gegen die felsigen Klippen schlagen lässt. Er fragte, ob wir die Sicherheit und Kapazität des Hafens erhöhen könnten, damit der Schiffsverkehr unverzüglich wieder aufgenommen werden könne." 
 me_colchis_27.a: "Entschädigt den Mann lediglich für seine Mühen." 
 me_colchis_27.b: "Der Hafen soll im Mittelpunkt stehen und der Mann sein Verwalter werden." 
 me_colchis_27.b.t: "Die Stadt #Y Trapezous#! wird zu einer #Y Bundstadt#! von #E Kolchis#!." 
 me_colchis_27.c: "Wir werden Männer aus dem Hinterland anwerben, um einen größeren Hafen zu errichten." 
  
 me_colchis_28_title: "Die Lazen-Stämme von Trapezous"
 me_colchis_28_desc: "Obwohl in der Hafenstadt Trapezous und den umliegenden Weilern schon seit Langem eine beträchtliche Bevölkerung aus den lazischen Stämmen lebt, hat die große Zahl zusätzlicher Arbeitskräfte, die wir aus den Stämmen des Hinterlandes für den weiteren Ausbau des Hafens angeworben haben, diese Volksgruppe erheblich anwachsen lassen. Viele beginnen bereits, den südwestlichen Teil von Trapezous als das „Lazische Viertel“ zu bezeichnen. Die pontischen Griechen fühlen sich innerhalb ihrer eigenen Stadtmauern zunehmend in die Minderheit gedrängt, und die ethnischen Spannungen haben zugenommen. Wie sollen wir damit umgehen?" 
 me_colchis_28.a: "Innerhalb dieser Mauern ist genug Platz für beide Völker!" 
 me_colchis_28.b: "Mit der Zeit werden sich die Spannungen legen." 
 me_colchis_28.c: "Nun, was wollen die Lazi eigentlich?"
 me_colchis_28.c.t: "Diplomaten aus #Y Kolchis#! werden sich mit den Stammesführern treffen, um eine Entschärfung der #E Spannungen#! zu #T verhandeln#!."
  
 me_colchis_29_title: "Eine lazische Republik?" 
 me_colchis_29_desc: "Unsere Diplomaten sind mit den Forderungen der Mossynoiken, Makronen und Chalyber zurückgekehrt. Nachdem die Stammesangehörigen erlebt haben, was das Leben innerhalb der Mauern von Trapezous zu bieten hat, stellen sie nun unterschiedliche Forderungen. Werden diese ignoriert, drohen sie mit einem Aufstand oder zumindest mit Unruhen. Wie sollen wir mit den Stammesvölkern zusammenarbeiten oder gegen sie vorgehen?" 
 me_colchis_29.a: "Beseitigt das Problem, bevor es sich ausbreitet."
 me_colchis_29.b: "Lasst uns Geschäfte machen." 
 me_colchis_29.c: "Überlasst den Einheimischen die Kontrolle über die Häfen."
 me_colchis_29.c.t: "Die Stadt #Y Trapezous#! wird zu einer #Y Bundstadt#! der #T Lazen#! innerhalb von #E Kolchis#!." 
 me_colchis_29.d: "Die Lazi sollen in unseren Kriegen ihre Wut nachgeben."
 me_colchis_29.d.t: "#Y Rizaion#! wird zu einem #T lazischen#! #Y Söldnerstaat#!, der #E Kolchis#! treu ergeben ist."
 me_colchis_29.e: "Sie sind den Heeren Kolchis' nicht gewachsen." 
 me_colchis_29.e.t: "#E [lazi_leader.GetName]#! entfacht unter dem Banner des #Y Königreichs der Mossynoiken#! einen Bürgerkrieg." 
 me_colchis_29.f: "Die Mosynoiker sind stärker als die Kolcher!" 
 me_colchis_29.f.t: "Ihr wechselt zur Kontrolle des #Y Königreichs der Mossynoiken#!."
  
 me_colchis_30_title: "Schatten der Achämeniden" 
 me_colchis_30_desc: "Wir haben Elemente der einstigen achämenidischen Verwaltung übernommen, um unser wachsendes Reich besser regieren und verwalten zu können. Die Adligen haben die Fähigkeit des Thrones gelobt, mit vergleichsweise geringem Aufwand derart große Fortschritte und eine so hohe Effizienz zu erzielen. Viele fragen sich jedoch, ob sich aus diesem persischen Vorbild nicht noch mehr herausholen ließe. Die alte iranische Heimat dieses Reiches ist noch immer reich an Schätzen..." 
 me_colchis_30.a: "Der Kaukasus wird unser Herrschaftsgebiet bleiben." 
 me_colchis_30.b: "Die Länder der Achämeniden könnten uns gehören!" 
 me_colchis_30.c: "Wir haben einen Anspruch auf jenen fernen Thron!" 
  
 me_colchis_31_title: "Gewaltmonopol" 
 me_colchis_31_desc: "Um die Herrschaft über den Bosporus und die Kimmerische Meerenge zu sichern, müssen wir die Steuererhebung durchsetzen und verhindern, dass skrupellose Händler, Piraten oder Rivalen günstigere Transportalternativen anbieten können. Um diese wirtschaftliche Dynamik bestmöglich zu kontrollieren, müssen wir eine mächtige Flotte unterhalten." 
 me_colchis_31.a: "Eine Flotte, die niemand herausfordern kann."
  
 me_colchis_32_title: "Hegemon des gastlichen Meeres" 
 me_colchis_32_desc: "Mit der vollständigen Kontrolle über das Schwarze Meer und seine Seewege haben die unbesiegten Flotten von [ROOT.GetCountry.GetRuler.GetName] eines der reichsten und mächtigsten Meere zu [ROOT.GetCountry.GetRuler.GetHerHis]em eigenem Binnensee gemacht. Um dieses gewaltige Gewässer zu befahren und zu beherrschen, hat unser unbeugsames Volk seine bisherigen Grenzen überwunden und ist nun in der Lage, die größten Schiffe zu bauen, die über die Wellen kreuzen und unsere maritime Zukunft sichern sollen." 
 me_colchis_32.a: "Das [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]e Haus gebietet über die Wellen!" 
  
