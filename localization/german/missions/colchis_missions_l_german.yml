 rosy_mines: "Rosige Minen" 
 desc_rosy_mines: "Wunderschöne Rosenfelder an den Hängen am Rande der fruchtbaren Ebenen bedecken reiche Metallvorkommen, die künftige Bauvorhaben und deren Instandhaltung finanzieren können." 
  
 rose_gold_traders: "Rosengold-Händler" 
