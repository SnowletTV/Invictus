 pheasant_farms: "Fasanenzucht" 
 desc_pheasant_farms: "Indem wir den jüngsten Anstieg der Fasanenpopulation nutzen, werden wir unsere Hauptstadt mit Nahrung versorgen können." 
  
 pheasant_markets: "Fasanmärkte" 
 desc_pheasant_markets: "Fasane aus den Wäldern der Hügel werden flussabwärts transportiert, um in den Marktständen des Hafens zum Verkauf angeboten zu werden." 
  
 pheasant_problem: "Fasanenplage" 
 desc_pheasant_problem: "Die Fasane überrennen die Dörfer und werden für die örtliche Bevölkerung zu einer erheblichen Plage." 
  
 gold_rush: "Ein Goldrausch"
 desc_gold_rush: "Den Menschen steht es frei, die goldenen Schätze des Flusses Phasis zu ernten, daher strömen sie hierher und scharen sich um das Banner des großzügigen Herrn des Goldenen Stroms"
  
 royal_hide_sifting: "Königliche Fell-Siebung" 
 desc_royal_hide_sifting: "Vom Königshof entlohnte Arbeiter waschen für uns die goldenen Reichtümer aus dem Fluss Phasis." 
  
 anger_against_argonaut_stone: "Zorn über Iasons Stein" 
 desc_anger_against_argonaut_stone: "Das Volk ist verärgert, dass Iasons Stein, eine Erinnerung an griechische Vikotrie über den Herrscher des Kolchischen Volkes, vom Gericht von Kolchis gelobt wurde." 
  
 praise_stone_destruction: "Lob für die Zerstörung von Iasons Stein" 
 desc_praise_stone_destruction: "Das Volk jubelt, dass jener Stein, den Iason schleuderte, um die drachenentsprossenen Verteidiger Kolchis' zu besiegen, als Zeichen kolchischer Souveränität und des eigenen Stolzes zerstört wurde." 
  
 destroy_argonaut_stone: "Zerstörung von Iasons Stein"
 desc_destroy_argonaut_stone: "Die Priesterschaft von Kolchis hat die göttliche Aura, die den von Iason geworfenen Stein umgab, rituell beseitigt, und das Volk ist nun von diesem Einfluss der Argonauten befreit."
  
 outrage_over_stone_destruction: "Empörung über die Zerstörung von Iasons Stein" 
 desc_outrage_over_stone_destruction: "Die Griechen am Pontos Euxinos, für die Iason und seine Argonauten unsterbliche Helden sind, haben die Zerstörung des Steins, den er mitten in der Schlacht gegen die aus Drachenzähnen entstandenen Krieger warf, als große Beleidigung empfunden." 
  
 argonaut_legacy: "Das Vermächtnis der Argonauten"
 desc_argonaut_legacy: "Ausgehend von den Ländern Kolchis, wo das legendäre Goldene Vlies seinen Ursprung hatte, reicht das Vermächtnis der Argo und ihrer Besatzung über die gesamte griechische Welt und nimmt im Gedächtnis der meisten einen besonderen Platz ein."
  
 stone_throwing: "Steinwurf" 
 desc_stone_throwing: "Wie Iason können auch die Bewohner Kolchis' selbst die einfachsten Steine in todbringende Geschosse verwandeln."
  
 replaced_the_swamp: "Die Sümpfe bezwungen" 
 desc_replaced_the_swamp: "Die sumpfige Natur der kolchischen Feuchtgebiete wurde durch unsere schiere Willenskraft überwunden und hat neues, bewohnbares Land zum Besiedeln freigelegt." 
  
 flooding_assistance: "Überschwemmungshilfen"
 desc_flooding_assistance: "Der Herrscher gewährte dem Volk Zuwendungen, damit es nach der Überschwemmung sein Leben wieder in den Griff bekommen konnte." 
  
 rebuilt_after_flood: "Wiederaufbau nach der Überschwemmung" 
 desc_rebuilt_after_flood: "Nachdem die versehentliche Überschwemmung das Dorf fast ausgelöscht hatte, hat der Thron dabei geholfen, es von Grund auf wieder aufzubauen, um es zu einer Bastion inmitten der austrocknenden Feuchtgebiete zu machen."
  
 expanded_millet_farms: "Ausgebaute Hirsefelder" 
 desc_expanded_millet_farms: "Da Hirse unter dem wärmeren Klima der ehemaligen Feuchtgebiete besonders gut gedeiht, steht uns nun mehr Land für den Anbau dieser Feldfrucht zur Verfügung."
  
 colchian_farmer_autonomy: "Bäuerliche Autonomie" 
 desc_colchian_farmer_autonomy: "Auf sich allein gestellt, haben die Bauern der kolchischen Feuchtgebiete ihren eigenen Weg eingeschlagen." 
  
 competitive_colchian_farmers: "Wettbewerb kolchischer Bauern" 
 desc_competitive_colchian_farmers: "Getrieben vom Ansturm auf neues Ackerland muss nun jeder Bauer mehr denn je auf die Preise und den Wohlstand seiner Nachbarn achten. Alle bemühen sich, möglichst viele Waren für die Märkte herzustellen." 
  
 corrupt_colchian_nobles: "Korruption in der kolchischen Elite" 
 desc_corrupt_colchian_nobles: "Der Adel in Kolchis wird sich einen Anteil an jeder gezahlten Handelssteuer sichern, wodurch er seine Taschen füllt und umso eher geneigt ist, den Thron zu unterstützen." 
  
 state_phasis_tax: "Eine staatliche Abgabe auf der Phasis" 
 desc_state_phasis_tax: "Die Krone hat eine allgemeine Steuer auf den Handel entlang des Phasis eingeführt." 
  
 indo_euxinos_trade: "Der Indo-Euxinos-Handel" 
 desc_indo_euxinos_trade: "Der Handel aus dem Osten und vom Schwarzen Meer hat viele neue Menschen mit Waren zum Verkauf hierher gebracht." 
  
 colchian_potential: "Kolchisches Potenzial" 
 desc_colchian_potential: "Das Volk von Kolchis verfügt über ein weitläufiges und reich an Ressourcen gesegnetes Land, das es bewirtschaften kann. Es wird seinen Aufstieg zu wahrer Größe ermöglichen." 
  
 restricted_skeptoukhi: "Eingeschränkte Skeptoukhi" 
 desc_restricted_skeptoukhi: "Die königlichen Statthalter von Kolchis werden nur begrenzte Befugnisse zur Verwaltung ihrer Regionen haben, was ihre größten Ambitionen zügeln wird." 
  
 unrestricted_skeptoukhi: "Uneingeschränkter Skeptoukhi" 
 desc_unrestricted_skeptoukhi: "Die königlichen Statthalter von Kolchis werden weitreichende Befugnisse zur Verwaltung ihrer Gebiete erhalten. Dies wird zwar den Wohlstand fördern, jedoch seinen Preis haben."
  
 royal_caucasian_marriage: "Eine königliche kaukasische Ehe" 
 desc_royal_caucasian_marriage: "Eine Heirat zwischen den Machthabern von Kolchis und dem kaukasischen Iberien hat allerorts zu positiver Stimmung geführt."
  
 refuse_ibero_marriage: "Königliche Heirat mit Iberien abgelehnt" 
 desc_refuse_ibero_marriage: "Der kolchische Adel freut sich darüber, dass Kuji es vermieden hat, zu einer iberischen Marionette zu werden." 
  
 colchis_saeristavo_client: "Der Saeristavo von Egrisi" 
 desc_colchis_saeristavo_client: "Als direkter Vasall des kaukasischen Iberiens unter Pharnavaz I. hat Kolchis durch gegenseitige Zusammenarbeit und gemeinsamen Wohlstand viel gewonnen." 
  
 rejected_saeristavo: "AVasallenschaft unter den Saeristavo abgelehnt" 
 desc_rejected_saeristavo: "Der Thron Kujis hat sich geweigert, vor den Pharnavaziden das Knie zu beugen." 
  
 killed_pharnavaz: "Pharnavaz I. getötet" 
 desc_killed_pharnavaz: "Die Kolcher haben Pharnavaz I. des kaukasischen Iberiens getötet" 
  
 attempted_kill_pharnavaz: "Versuchte Ermordung von Pharnavaz I." 
 desc_attempted_kill_pharnavaz: "Es ist bekannt, dass die Kolcher versucht haben, Pharnavaz I. des kaukasischen Iberiens zu ermorden" 
  
 tribute_from_colchis: "Tribut von Colchis" 
 desc_tribute_from_colchis: "Kolchis zahlt uns weiterhin einen nominalen Tribut." 
  
 colchian_tribute: "Kolchischer Tribut an Iberia" 
 desc_colchian_tribute: "Wir zahlen weiterhin Tribut an die Iberer."
  
 aeetes_palace_attraction: "Anziehung zum Palast des Aietes"
 desc_aeetes_palace_attraction: "Menschen aus dem gesamten Schwarzmeerraum und darüber hinaus strömen herbei, um den restaurierten Palast des alten Aietes zu besichtigen." 
  
 aeetid_throne: "Der Aeetiden-Thron"
 desc_aeetid_throne: "Kolchis verwaltet nun sein Herrschaftsgebiet vom wiederhergestellten Thron des alten Aietes aus." 
  
 euxinos_control: "Kontrolle des Euxinos"
 desc_euxinos_control: "Mit der längsten Küstenlinie am Pontos Euxinos hat Kolchis die Kontrolle über seine Gewässer und ist sehr erfahren in der Schiffsführung und Hafenverwaltung." 
  
 trapezous_kolchis_trade: "Handel von Trapezous"
 desc_trapezous_kolchis_trade: "Mit seinem neuen Hafen blüht der Handel von Trapezous auf."
  
 telephis_trade: "Handel von Telephos" 
  
 expanded_trapezous_quarters: "Erweiterte Viertel von Trapezous" 
 desc_expanded_trapezous_quarters: "Trapezous hat seine Quartiere erweitert, um verschiedenen ethnischen Gruppen mehr Platz zu bieten." 
  
 trapezous_chaos: "Trapezous-Chaos" 
 desc_trapezous_chaos: "In Trapezous ist es zu gewalttätigen Ausschreitungen zwischen den pontischen Griechen und den Lazi gekommen." 
  
 trapezous_ethnic_tensions: "Ethnische Spannungen in Trapezous" 
 desc_trapezous_ethnic_tensions: "Spannungen sind zwischen pontischen Griechen und Lazi-Gruppen in Trapezous ausgebrochen" 
  
 lazi_mercenary_pool: "Das Lazen Söldner-Reservoir" 
 desc_lazi_mercenary_pool: "Der Söldnerstaat der Lazen in Rhizaion wird günstige und fähige Streitkräfte zur Verfügung stellen." 
  
 achaemenid_inspired_colchian_administration: "Achämenidisch beeinflusste Verwaltung in Kolchis" 
 desc_achaemenid_inspired_colchian_administration: "Die Kolcher haben Elemente des alten achämenidischen Stils der Verwaltungsmaßnahmen übernommen." 
  
 monopoly_on_straight_violence: "Ein Gewaltmonopol über die Meerengen" 
 desc_monopoly_on_straight_violence: "Um die Wirtschaft der Meerenge zu kontrollieren, unterhalten die Kolcher eine starke Seemacht." 
  
 black_sea_colchis_hegemon: "Hegemon des Schwarzen Meeres" 
 desc_black_sea_colchis_hegemon: "Kolchis ist zur kolonisierenden Seemacht des Pontos Euxinos geworden." 
  
 dioscuri_blessing: "Segen der Dioskuren" 
 desc_dioscuri_blessing: "Mit ihrem Schrein, der in einem großen Tempel untergebracht ist, haben die Dioskuren Dioskurias, ihre namensgebende Hafenstadt, mit Glück für die Zukunft gesegnet."
  
 occupation_of_dioscurias: "Die Besetzung von Dioskurias" 
 desc_occupation_of_dioscurias: "Die Kolcher haben Dioskurias scheinbar über Nacht gewaltsam besetzt und haben nun die vollständige Kontrolle über das heilige Gelände des Heiligtums der Dioskuren." 
  
 rebuffed_suani_elders: "Zurückgewiesene Älteste der Suani" 
 desc_rebuffed_suani_elders: "Das kolchische Gericht weigerte sich, den Suani bei ihren Verhandlungen zu helfen." 
  
 suani_stations: "Suani-Posten" 
 desc_suani_stations: "Den Suani wurde in Dioskurias der gesamte benötigte Platz zur Verfügung gestellt, zum Nachteil und Missfallen der Einheimischen." 
  
 suanian_discurias_trade: "Suanischer Dioskurias-Handel" 
 desc_suanian_discurias_trade: "Die Suani, die nun für Dioskurias verantwortlich sind, haben den Export von Kunsthandwerk und wertvollen Luxusgütern gesteigert." 
  
 dioscurias_ethnic_violence: "Ethnische Gewalt bei Dioskurias" 
 desc_dioscurias_ethnic_violence: "Es ist selten und beängstigend, ethnische Spannungen an einem so bemerkenswert vielfältigen Ort aufleben zu sehen, wobei die Griechen so weit gehen, die Suani aus der Stadt zu vertreiben." 
  
 resentful_suani: "Verbitterte Suani"
 desc_resentful_suani: "Die Suani verübeln dem Thron von Kolchis, dass er ihre Kaufleute und Handwerker in der Stadt Dioskurias nicht geschützt hat." 
  
  #################### 
  # Decisions 
  #################### 
 colchis_decision_1: "Das goldene Vlies"
 colchis_decision_1_desc: "Zwar behaupteten die Griechen von Phasis, im Besitz des letzten Fadens des berühmten Goldenen Vlieses zu sein, und priesen es als Teil des griechischen Erbes an, doch wissen wir, dass das Vlies stets in kolchischen Händen war. Ein vertrauter Berater des Hohepriesters ist mit einem bemerkenswerten Gegenstand hervortreten. Dies hat am Hofe Unglauben ausgelöst. In seinen Händen hielt er ein Widdervlies… so golden, so strahlend, so prächtig in seiner Färbung, dass es nur göttlichen Ursprungs sein konnte. Doch an der Stelle fehlte ein Stück.\n\nEr griff nach dem Stück, das wir von den Griechen in Phasis erworben hatten, legte es von sich aus an genau diese Stelle und präsentierte ein vollendetes Meisterwerk – es war, als wäre das Stück verschwunden, und bestätigte damit, dass das Vlies echt war. Manche glauben, die Götter hätten einem einsamen Bauern einen goldenen Widder geschenkt, damit Kolchis ein weiteres Vlies besitzen könne; andere glauben, das alte Relikt sei einfach von den thessalischen Küsten nach Hause zurückgekehrt – so lauten jedenfalls die Geschichten und Gerüchte…" 
  
 colchis_decision_2: "Die Verehrung von Iason"
 colchis_decision_2_desc: "Einen heiligen Ort für König Aietes von Kolchis errichten."
  
 colchis_decision_3: "Die Verehrung von Aietes"
 colchis_decision_3_desc: "Richten Sie eine heilige Stätte für König Aietes von Kolchis ein" 
  
 restore_palace_aeetes: "Den Palast des Aietes wiederherstellen" 
 restore_palace_aeetes_desc: "Der König des alten Kolchis, den Iason mit Hilfe von Medea (der Tochter des Königs) mühelos besiegte, regierte einst von einem prächtigen Palast aus, der direkt am Pontos Euxinos in dem Gebiet lag, das heute als Phasis bekannt ist. Der Palast, den viele für längst verloren gehalten hatten, ist noch immer in seiner zerstörten Form erhalten. Es liegt nun an den neuen Herrschern von Kolchis, dieses alte Wunderwerk wiederherzustellen und das Ansehen und die Ehre zurückzugewinnen, die Kolchis einst unter seinem Zaubererkönig genoss!"
 restore_aeetes_palace_deadline: "#Y Aietes' Palast#! wird in #G 2#! Jahren wiederhergestellt." 
  
 lazi_appeasement_trade: "Beschwichtigungshandel mit den Lazi"
 desc_lazi_appeasement_trade: "Wir haben Handel betrieben, der die Lazi begünstigt, um ihre Bedenken zu zerstreuen und ihre rebellische Aufmerksamkeit abzulenken." 
  
  
  #################### 
  # Treasures 
  #################### 
  
 stone_of_iason: "Der Stein von Iason" 
 stone_of_iason_desc: "Dieser Stein war einer von vielen, die Iason warf, um die Krieger abzulenken, die aus den Zähnen des Drachen entsprungen waren, kurz bevor er sie in ihrer Verwirrung besiegte. Seltsam poliert, wirft er die Frage auf, ob es sich wirklich um einen Stein handelt, der vor langer Zeit von den Händen des Halbgottes geworfen wurde." 
  
 the_golden_fleece: "Das goldene Vlies" 
 the_golden_fleece_desc: "Die glänzende Wolle des geflügelten Widders namens Chrysomallos, den Phrixus rettete und nach Kolchis brachte, war ein begehrter Schatz der Antike, der als „verloren“ galt, nachdem er von Iason geraubt worden war. Nun wurde das Vlies wieder „gefunden“ und erstrahlt, geschützt von den Hütern des kolchischen Throns, in voller Pracht in den Ländern am Rande der Welt." 
  
 golden_goat_rhyton: "Der goldene Ziegenrhyton" 
 golden_goat_rhyton_desc: "Dieses Rhyton, ein Trinkgefäß mit der Ausgussöffnung am unteren Ende, stammt aus den Werkstätten von Ekbatana und zeigt einen Widderkopf, dessen Maul sich an der Ausgussöffnung befindet. Es wird auf die Zeit der Achämeniden datiert." 
  
  ### GREAT WORKS 
 wonder_aeetes_palace: "Der Palast von Aietes" 
 wonder_aeetes_palace_desc: "Einst Sitz des gütigen und erfolgreichen Königs Aietes, bleibt dieser Hauptsitz von Kolchis, der lange Zeit vernachlässigt wurde, eine Attraktion für alle, die seine Mauern betrachten."
  
  ### GREAT WORK EFFECTS 
 gw_effect_aeetes_palace: "Vermächtnis von Aietes" 
 gw_effect_aeetes_palace_DESC: "Es gibt keinen griechischen oder kolchischen Mann oder eine kolchische Frau, die die Geschichte von Iason, seinen Argonauten, nicht gehört hat und wie sie den großen König Aietes von Colchis trafen, selbst ein Korinther aus alter Zeit. Kein Reisender konnte widerstehen, diesen heiligen und mächtigen Ort zu besuchen und dem gottgleichen Aietes Geschenke zu hinterlassen." 
  
