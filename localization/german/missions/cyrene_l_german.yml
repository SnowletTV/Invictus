cyrene_1_intoegypt:0 "Die Reichtümer Ägyptens"
cyrene_1_intoegypt_DESCRIPTION:0 "Der Reichtum des Landes Ägypten, gesegnet und genährt vom lebensspendenden Nil, zieht Anwärter an wie Honig die Fliegen, und die hungrigen Kyrenaiker unterscheiden sich in dieser Hinsicht nicht von den Persern oder den Makedoniern. Auch wenn der Kampf um die Beute erbittert sein wird, sind die üppigen Schätze der Pharaonen verlockend nah, nur knapp außer Reichweite … doch mit unserer kühnen Vision, die uns vorantreibt, wird sich dies für immer ändern."
cyrene_1_intoegypt_CRITERIA_DESCRIPTION:0 "Diese Mission gilt als abgeschlossen, wenn das stolze Ägypten unterworfen ist und seine riesigen Ressourcen von ihren rechtmäßigen Eigentümern, den Kyrenaikern, kontrolliert werden."
cyrene_1_intoegypt_BUTTON_TOOLTIP: ""
cyrene_1_intoegypt_BUTTON_DETAILS: ""
 cyrene_1_intoegypt_task_1: "Grenzkonflikt um Marmarica"
cyrene_1_intoegypt_task_1_DESC: "Die Region Marmarica gilt traditionell als Teil der Kyrenaika, steht jedoch derzeit faktisch unter der Kontrolle der  [cyr_egypt_scope.GetName], die eine Garnison in der einzigen bedeutenden Stadt der Gegend, [GetProvince('(int32)3373').GetName], unterhält. \n\nDie umliegenden Gebiete hingegen sind dünn besiedelt und die [cyr_egypt_scope.GetAdjective]e Herrschaft ist nach wie vor dürftig. Wenn wir das unbeanspruchte Land mit unseren eigenen Bürgern besiedeln würden, würde dies sicherlich unseren Anspruch auf das Gebiet stärken."
cyrene_1_intoegypt_task_2: "Marmarica besiedeln"
cyrene_1_intoegypt_task_2_DESC: "Nun, da [GetProvince('(int32)3372').GetArea.GetName] uns gehört, sollten wir unsere Kontrolle sichern, indem wir die Bevölkerung des Gebiets erhöhen. Ein Großteil von [GetProvince('(int32)3372').GetArea.GetName] ist unwirtlich, aber das Gebiet von [GetProvince('(int32)3370').GetName] (so genannt, weil es gegenüber der Stadt Pyrgos auf Kreta liegt) hat einen der besten natürlichen Häfen in Afrika und wäre ein guter Standort für eine neue Stadt."
cyrene_1_intoegypt_task_3: "Die Küstenkarawanen erweitern"
cyrene_1_intoegypt_task_3_DESC: "Das Reisen auf dem Landweg durch die Wüsten von [GetProvince('(int32)3372').GetArea.GetName] und , war noch nie einfach, aber jetzt, da wir Frieden in die Region gebracht haben, sollten wir den Bau von Straßen in Betracht ziehen, um das Reisen zu erleichtern. Auf diese Weise werden wir den Karawanenverkehr an der Küste erheblich fördern."
cyrene_1_intoegypt_task_4: "Verwalter aus der Kyrenaika einsetzen"
cyrene_1_intoegypt_task_4_DESC: "Zwar gibt es einige, die sich bereitwillig den Veränderungen unterworfen haben, die wir im Land Ägypten herbeigeführt haben, doch vertrauen wir den lokalen Eliten nicht, unsere Angelegenheiten zu regeln – warum sollten wir auch? Indem wir Kyrenaiker in Machtpositionen berufen, können wir beruhigt sein."
cyrene_1_intoegypt_task_5: "Die Tore von Alexandreia"
cyrene_1_intoegypt_task_5_DESC: "In einer überwältigenden Demonstration militärischen Könnens haben die Kyrenaiker die feigen Ptolemäer aus Alexandreia vertrieben und die schöne Stadt für sich eingenommen. Es ist nur eine Frage der Zeit, bis die Armeen von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] den Rest der von den perfiden Makedoniern besetzten Gebiete erobern."
cyrene_1_intoegypt_task_6: "Alexandrinische Zusammenarbeit"
cyrene_1_intoegypt_task_6_DESC:0 "Indem wir einen Teil unseres Reichtums in die Verschönerung der Stadt Alexandreia investieren, würden wir uns die Loyalität ihrer Einwohner sichern, was wiederum ihre Produktivität steigern dürfte. Aber lasst uns unsere Hauptstadt nicht vernachlässigen; ordnet an, dass in beiden Städten gebaut wird, um den Austausch von Ideen und Waren zwischen diesen beiden Leuchttürmen der Zivilisation zu erleichtern."
cyrene_1_intoegypt_task_7:0 "Kyrenes Rivalen demütigen"
cyrene_1_intoegypt_task_7_DESC:0 "Einst wurden wir durch die launischen und tyrannischen Befehle der Alexandriner geschunden, doch nun sind die Götter uns wohlgesonnen und stürzen die Makedonier in tiefstes Elend. Es würde der Gerechtigkeit dienen, wenn wir unseren ehemaligen Feind bestrafen und ihn an die zahlreichen Verbrechen erinnern würden, die er gegen die Kyrenaika begangen hat."
cyrene_1_intoegypt_task_8:0 "Umsiedlung des Museions"
cyrene_1_intoegypt_task_8_DESC:0 "Das Museion von Alexandreia ist in vielerlei Hinsicht eines der Kronjuwelen der Stadt und genießt einen Ruf, der Gelehrte und Reisende aus der ganzen Welt ins Nildelta zieht. Nach Rücksprache mit Euren Beratern wurde beschlossen, dass wir die Schätze des Mausions nach [GetProvince('(int32)3360').GetName] verlagern sollten - die Kosten werden hoch sein, aber die Belohnungen werden noch größer sein."
cyrene_1_intoegypt_task_9:0 "Die Hörner von Ägypten"
cyrene_1_intoegypt_task_9_DESC:0 "Ägypten ist mit natürlichen Befestigungen gesegnet, die wir ausbauen können; etwas, das wir unbedingt tun sollten. Indem wir die Festungen in [GetProvince('(int32)509').GetName] verstärken, werden wir den Überlandweg in unsere neuen Gebiete schützen. Befiehl, dies zu tun und auch die Marktplätze von [GetProvince('(int32)3378').GetName] auszubauen."
cyrene_1_intoegypt_task_10:0 "Den Nil hinauf"
cyrene_1_intoegypt_task_10_DESC:0 "Die Wasser des Nils winken und versprechen, uns zu noch größeren Siegen zu führen; lasst uns die Arbeit fortsetzen, die wir mühsam begonnen haben, und weiterhin die Ptolemäer aus Ägypten vertreiben."
 cyrene_1_intoegypt_task_11: "Das Mittelmeerreich"
 cyrene_1_intoegypt_task_11_DESC: "Von unserer Machtposition in [GetProvince('(int32)509').GetName] aus sind wir in der Lage, unsere Autorität auf Bereiche auszudehnen, die sie einst vielleicht in Frage gestellt haben könnten. Die Länder Kanaans und Syriens, die einst von den Ptolemäern beansprucht wurden, gehören nun uns. Der Klang von Kriegstrommeln begleitet uns in eine glorreiche Zukunft."
cyrene_1_intoegypt_task_12: "Das Haus des Ammon"
cyrene_1_intoegypt_task_12_DESC: "Die Oase von [GetProvince('(int32)5537').GetName] ist die heiligste Stätte des libyschen widderköpfigen Gottes Ammon. Obwohl Ammon libyschen Ursprungs ist, ist er ein äußerst beliebter Gott in der Kyrenaika. Das Volk von [GetProvince('(int32)3360').GetName] vereinte seine Verehrung mit der von Zeus zu einer Gottheit, Zeus-Ammon, und nicht zuletzt dank der Kyrenaika hat sich die Anbetung von Ammon nun weit über das Mittelmeer verbreitet. \n \nNun, da [GetProvince('(int32)3373').GetName] unter unserer Kontrolle ist, sollten wir unsere Wertschätzung zeigen, indem wir einen großen neuen Tempel errichten, um das dort befindliche Orakel von Ammon zu beherbergen."
 cyrene_1_intoegypt_task_13: "Segen von Ammon"
 cyrene_1_intoegypt_task_13_DESC: "Einst reiste [GetCharacter('(int32)39').GetName] zur Oase in [GetProvince('(int32)5537').GetName], wo er als göttliches Wesen und rechtmäßiger Pharao Ägyptens anerkannt wurde. Angesichts der besonderen Beziehung zwischen Kyrenaika und Ammon ist es nur folgerichtig, dass unser Herrscher versuchen würde, in die Fußstapfen von [GetCharacter('(int32)39').GetFirstName] zu treten."
cyrene_1_intoegypt_task_14: "Den Priestern des Amun den Hof machen"
 cyrene_1_intoegypt_task_14_DESC: "Amun ist das ägyptische Gegenstück zum Gott Ammon, der in der Kyrenaika verehrt wird. Dies macht die Priesterschaft des Amun zu natürlichen Verbündeten in unseren Bemühungen, unsere Kontrolle über Ägypten zu legitimieren."
 cyrene_1_intoegypt_task_15: "Pharao von Unterägypten"
 cyrene_1_intoegypt_task_15_DESC: "Da nun ganz Unterägypten unter unserer Herrschaft steht und wir die einheimische Priesterschaft auf unserer Seite haben, können wir die Gelegenheit nutzen, unseren Herrscher zum Pharao von Unterägypten erklären zu lassen. Dies würde die Verwaltung Ägyptens erheblich erleichtern, auch wenn es bei einigen Griechen in unserem Reich nicht unpopulär wäre.\n\n\n\n\n\n\n\n\n\n@egypt_por1!"
 cyrene_1_intoegypt_task_final: "Ptolemaios' Traum zerplatzt"
 cyrene_1_intoegypt_task_final_DESC: "Ptolemaios, der verräterische Hund, der sich eigenmächtig zum Basileus von Ägypten ernannte und gierige Eroberungskriege gegen seine Mit-Diadochi führte, hat den Traum von der Herrschaft über ein ägyptisches Königreich begraben müssen – ein passendes Ende, das er zweifellos verdient hat. Während von der Macht der Ptolemäer nur noch Dunkelheit und Schatten übrig sind, geht die Sonne wie der glorreiche Aten über den siegreichen Kyrenaikern auf!"
 cyrene_1_intoegypt_task_1.tt: "Wir werden versuchen, #Y einen Anspruch#! auf #Y [cyr_egypt_scope.GetName]s Grenzprovinzen#! zu erheben."
cyrene_1_intoegypt_task_2.tt: "Jede andere Provinz in #Y [GetProvince('(int32)3373').GetArea.GetName]#! erhält #Y $cyr_marmarica_growing$#!."
cyrene_1_intoegypt_task_3.tt: "[GetProvince('(int32)3366').GetName|Y], [GetProvince('(int32)3373').GetName|Y] und [GetProvince('(int32)3378').GetName|Y] sind durch eine Straße verbunden."
 cyrene_1_intoegypt_task_4.tt: "Mehrere #Y Kyrenaikische Adlige Bewohnertypen#! werden in Städte in #Y Oberägypten#! ziehen."
cyrene_1_intoegypt_task_8.tt: "#Y NICHT#! Die Bibliothek von Alexandria wird gebaut."
cyrene_1_intoegypt_task_8.ttt: "#Y Bibliothek von Alexandria#! wurde bereits gebaut."
cyrene_1_intoegypt_task_8.tttt: "[GetProvince('(int32)516').GetName] hat keine #Y Bibliothek von Alexandria#!."
cyrene_1_intoegypt_task_10.tt: "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! erhält einen Anspruch auf jedes Gebiet in der Region von #Y [THIS.GetProvince.GetArea.GetRegion.GetName]#! im Besitz von #Y [cyr_egypt_scope.GetName]#!."
cyrene_1_intoegypt_task_12.tt: "#Y [GetProvince('(int32)5537').GetName]#! ist eine heilige Stätte für $omen_ammon$, $omen_zeus_amun$ oder $omen_amun$."
cyrene_1_intoegypt_task_12.ttt: "Der lokale Gott [GetDeityDefinition('omen_zeus_amun').GetName|Y] ist jetzt in unserem Pantheon verfügbar!"
cyrene_1_intoegypt_task_14.tt: "Jede #Y Pantheon-Gottheit#! ist #Y $egyptian_pantheon$#!."
cyrene_1_intoegypt_task_14.ttt: "$omen_ammon$, $omen_zeus_amun$ oder $omen_amun$ müssen Teil des #Y Pantheons#! sein."
 cyrene_1_intoegypt_task_1_A.tt: "Sowohl [SCOPE.GetRootScope.GetCountry.GetName|Y] als auch [GetCountry('EGY').GetName|Y] haben Territorien in der Provinz #Y [GetProvince('(int32)3367').GetArea.GetName]#!."
cyrene_1_intoegypt_task_1_B.tt: "Wir werden Events über den Besitz in Marmarika erhalten, die möglicherweise Ansprüche begründen könnten. Wenn wir bereits die Provinz Marmarika besitzen, wird jede untreue ägyptische Provinz in der Region Kyrenaika zu uns überlaufen."  
cyrene_1_intoegypt_task_2_A.tt: "Mindestens #Y 3#! Gebiete in der Provinz [GetProvince('(int32)3367').GetArea.GetName|Y] mit #Y Stadt#!-Status haben [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]e Kultur."
 cyrene_1_intoegypt_task_4_A.tt: "Besitzt mindestens 20 Provinzen in der Region #Y [GetProvince('(int32)516').GetArea.GetRegion.GetName]#!."
 cyrene_1_intoegypt_task_4_B.tt: "Mindestens #Y 3#! Gebiete in der Region #Y [GetProvince('(int32)516').GetArea.GetRegion.GetName]#! haben #Y 3 Gerichtshöfe#!"
 cyrene_1_intoegypt_task_6_A.tt: "Der Statthalter von [GetProvince('(int32)516').GetArea.GetRegion.GetName|Y] hat mindestens #Y 8 Finesse#!@civic_icon!."
 cyrene_1_intoegypt_task_10_A.tt: "Besitzt ein beliebiges Gebiet in der Region [GetProvince('(int32)552').GetArea.GetRegion.GetName|Y]."
 cyrene_1_intoegypt_task_10_B.tt: "[SCOPE.GetRootScope.GetCountry.GetName|Y] hat keinen Waffenstillstand oder Bündnis mit [cyr_egypt_scope.GetName|Y]."
 cyrene_1_intoegypt_task_11_A.tt: "Besitzt ein beliebiges Gebiet in der Region #Y $palestine_region$#! oder der Region #Y $syria_region$#!."
cyrene_1_intoegypt_task_14_A.tt: "Die [GetCulture('egyptian').GetName|Y]e Kultur hat #Y Adels#!@nobles! Rechte."
 cyrene_1_intoegypt_task_15_A.tt: "Die [GetCulture('egyptian').GetName|Y]e Kultur ist integriert." 
cyrene_1_intoegypt_task_15_B.tt: "Wenn [SCOPE.GetRootScope.GetCountry.GetRuler.GetName|Y] beschließt, sich selbst zum #Y Pharao#! zu krönen, erhält er die folgenden Effekte:\n\n"
cyrene_1_intoegypt_task_15_C.tt: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName|Y] erhält die Eigenschaft #Y Pharaoh#! @pharaoh!"
cyrene_1_intoegypt_task_15_D.tt: "Wir können uns dafür entscheiden, unsere #Y Hauptstadt#! nach Ägypten zu verlegen."  
