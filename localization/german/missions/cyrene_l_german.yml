 cyrene_1_thera: "Ägäische Dominanz" 
 cyrene_1_thera_DESCRIPTION: "Vor einige Jahrhunderten gründeten Siedler von der ägäischen Insel [GetProvince('(int32)454').GetName] auf der Flucht vor einer schweren Hungersnot in ihrer Heimat [GetProvince('(int32)3360').GetName] – die Stadt, nach der die Kyrenaika benannt ist Während [GetProvince('(int32)3360').GetName] weiter an Bedeutung gewann und bald die anderen griechischen Kolonien der Region dominierte und sie unter dem Königreich Kyrenaika vereinte, verlor [GetProvince('(int32)454').GetName] selbst zunehmend an Bedeutung und wurde zu kaum mehr als einer Fußnote in den politischen Machenschaften der Ägäis. \n\nJetzt, da die Kyrenaika wieder auf dem Vormarsch ist, könnte es für die stolzesten Kinder von [GetProvince('(int32)454').GetName] an der Zeit sein, in ihre Mutterstadt zurückzukehren. Eine Aussicht, die umso attraktiver wird, als die Position von [GetProvince('(int32)454').GetName] an der Südspitze der Kykladen es auch zum perfekten Ort macht, um den lukrativen Handel zu dominieren, der durch die Ägäis fließt. Bevor wir unsere triumphale Rückkehr nach [GetProvince('(int32)454').GetName] schaffen können, müssen wir es den Händen seiner derzeitigen Oberherren entreißen … \n\nSollte sich [GetProvince('(int32)454').GetName] als außerhalb unserer unmittelbaren Reichweite erweisen, könnten wir uns zuerst in der Gegend niederlassen. Zwischen der Kyrenaika und [GetProvince('(int32)454').GetName] liegt die große Insel Kreta. Kreta ist ein chaotisches Flickwerk aus verfeindeten Stadtstaaten, die oft Außenstehende um Intervention in ihre internen Streitigkeiten bitten. Wenn es uns gelänge, die Insel unter unserer Herrschaft zu vereinen, würde dies unsere Position im Norden erheblich stärken."
 cyrene_1_thera_CRITERIA_DESCRIPTION: "Diese Mission gilt als abgeschlossen, wenn wir die Kontrolle über Kreta übernommen, [GetProvince('(int32)454').GetName] zu einer wohlhabenden Stadt entwickelt und unsere Vorherrschaft über die Ägäis bestätigt haben."
 cyrene_1_thera_BUTTON_TOOLTIP: "Expandiert nach Kreta und entwickelt die ägäische Insel Thera."
 cyrene_1_thera_BUTTON_DETAILS: ""
 cyrene_1_thera_task_1: "Die kriegführenden Staaten Kretas"
 cyrene_1_thera_task_1_DESC: "Die vielen Stadtstaaten Kretas sind ständig in kleinliche Querelen miteinander verstrickt. Vielleicht können wir einen von ihnen in unseren Einflussbereich bringen, indem wir ihnen in ihren Kriegen helfen."
 cyrene_1_thera_task_2: "Ausweitung des Einflusses auf Kreta"
 cyrene_1_thera_task_2_DESC: "Nachdem wir unser erstes Standbein auf der Insel errichtet haben, sollten wir unsere Expansion fortsetzen, bis die gesamte Insel unter unserer Kontrolle ist."
 cyrene_1_thera_task_3: "Kreta befrieden"
 cyrene_1_thera_task_3_DESC: "Die Insel Kreta ist eine sehr gespaltene Region. Um die Insel wirklich zu vereinen, reicht es nicht, Städte zu erobern, wir müssen sicherstellen, dass die Menschen auf Kreta unsere Herrschaft akzeptiert haben."
 cyrene_1_thera_task_10: "Kretische Bogenschützen"
 cyrene_1_thera_task_10_DESC: "Kreta ist berühmt für das Geschicklichk seiner Bogenschützen. Die Rekrutierung dieser Männer für unsere Armeen könnte uns den Vorteil verschaffen, den wir brauchen, um unsere zukünftigen Kriege zu gewinnen."
 cyrene_1_thera_task_4: "Die Kykladen umwerben"
 cyrene_1_thera_task_4_DESC: "Die Kykladen, einschließlich Thera, stehen derzeit unter dem Schutz fremder Mächte. Wenn wir nach Thera zurückkehren und unsere Position in der Ägäis errichten wollen, müssen wir sie davon überzeugen, dass wir einen geeigneteren Oberherrn abgeben würden."
 cyrene_1_thera_task_5: "Nach Thera zurückkehren"
 cyrene_1_thera_task_5_DESC: "Sobald Thera unter unserer Herrschaft ist, können wir mit unseren Bemühungen beginnen, die Insel wiederherzustellen."
 cyrene_1_thera_task_6: "Herz des ägäischen Handels"
 cyrene_1_thera_task_6_DESC: "Es wird gesagt, dass die Insel Thera vor langer Zeit, während des Trojanischen Krieges, das Herz eines mächtigen Handelsimperiums war. Davon sind heute nur noch wenige Zeugnisse erhalten, aber aufgrund seiner Lage könnte Thera sicherlich ein wichtiges Handelszentrum für die Ägäis werden. Wir müssen nur die Ressourcen investieren, um die notwendige Infrastruktur aufzubauen."
 cyrene_1_thera_task_7: "Ein großer Hafen für die Kriegsflotte"
 cyrene_1_thera_task_7_DESC: "Thera ist der perfekte Ort, um als wichtiger Hafen für unsere Kriegsflotte zu dienen. Wenn wir die nötige Infrastruktur aufbauen, könnte uns ein Marinestützpunkt hier ermöglichen, mit unserer Flotte die Ägäis zu beherrschen."
 cyrene_1_thera_task_8: "Thera steigt aus der Asche auf"
 cyrene_1_thera_task_8_DESC: "Einst ein provinzielles Hinterland, haben unsere Bemühungen dazu geführt, dass sich Thera zu einer der bedeutendsten Städte der Kykladen entwickelt hat. Heute ist sie unsere unangefochtene Hauptstadt im Norden."
 cyrene_1_thera_task_9: "Rivalen auf Rhodos"
 cyrene_1_thera_task_9_DESC: "Mit Kreta und den Kykladen unter unserer Herrschaft ist unsere Kontrolle über die südliche Ägäis fast vollständig. Ein Rivale bleibt jedoch: Die mächtige Stadt Rhodos hat diesen Teil des Meeres traditionell dominiert, und wir können nicht ruhen, bis die Bedrohung, die Rhodos darstellt, beseitigt ist."
 cyrene_1_thera_task_final: "Ägäische Thalassokratie"
 cyrene_1_thera_task_final_DESC: "Alle unsere Rivalen in der Ägäis wurden erledigt und die meisten großen Inseln der Region sind jetzt unter unserer Kontrolle. Wir sind der unbestrittene Hegemon der Ägäis."
  
