 cyr_ophellas_01.1.t: "Der Ruf des Abenteuers"
 cyr_ophellas_01.1.desc: "Boten von [cyr_adventuring_root_scope.GetName] sind kürzlich an unserem Hof eingetroffen. Sie planen einen Krieg gegen [GetCountry('CAR').GetName] und bitten um unsere Erlaubnis, eine Armee unter unseren Bürgern aufzustellen."
 cyr_ophellas_01.1.a: "Versichern Sie ihnen, dass sie unsere Unterstützung haben."
 cyr_ophellas_01.1.b: "Es ist besser, sich nicht in ausländische Kriege einzumischen."
 cyr_ophellas_01.1.tt: "#R Dies kann dazu führen, dass wir ein Untertan von [cyr_adventuring_root_scope.GetName]  werden#!"
 cyr_ophellas_01.2.t: "Griechische Abenteurer – Eine Armee aufstellen"
 cyr_ophellas_01.2.desc: "Die Boten, die wir ausgesandt haben, sind mit Nachrichten aus mehreren Städten zurückgekehrt, die bereit sind, uns in unserem Krieg gegen Karthago zu unterstützen. Jetzt müssen wir entscheiden, auf welche von ihnen wir unsere Rekrutierungsbemühungen konzentrieren wollen. \n\nDie Stadt, für die wir uns entscheiden, wird vorübergehend unter unsere Herrschaft fallen und an unserer Seite in unseren Kriegen kämpfen, bis wir in Afrika genügend Land erobert haben, damit sich die Abenteurer dort niederlassen können."
 cyr_ophellas_01.2.a: "Rekrutiere Abenteurer von [cyr_adventurer_city_candidate_1.GetName]"
 cyr_ophellas_01.2.b: "Rekrutiere Abenteurer von [cyr_adventurer_city_candidate_2.GetName]"
 cyr_ophellas_01.2.c: "Rekrutiere Abenteurer von [cyr_adventurer_city_candidate_3.GetName]"
 cyr_ophellas_01.2.d: "Heuere stattdessen einfach eine Gruppe von Söldnern an."
 cyr_ophellas_01.3.t: "Griechische Abenteurer"
 cyr_ophellas_01.3.desc: "Als Ophellas zum ersten Mal in Karthago einfiel, stellte er eine Armee aus dem Heimatland seiner athenischen Frau [GetCharacter('(int32)148').GetName] auf. [GetCharacter('(int32)148').GetFirstName] hat seitdem die Kyrenaika zusammen mit ihrem Sohn [GetCharacter('(int32)549').GetFirstName] verlassen, um [GetCharacter('(int32)38').GetFullName] zu heiraten, aber die Städte Griechenlands sind immer noch voller abenteuerlustiger Seelen, die überzeugt werden könnten, für uns zu kämpfen, wenn wir ihnen das Recht versprechen, sich in unseren neuen Eroberungen niederzulassen. \n\nIm Gegensatz zu Ophellas haben wir nicht den Luxus, mit einer der wichtigsten Frauen Athens verheiratet zu sein, also müssen wir Boten zu den kleineren Nationen der hellenischen Welt schicken, um zu sehen, ob einer von ihnen bereit ist, ihren Bürgern etwas zu leihen zu unserer Sache."
 cyr_ophellas_01.3.a: "Senden Sie Nachricht an jeden Winkel der griechischen Welt!"
 cyr_ophellas_01.4.t: "Griechische Abenteurer wollen sich niederlassen"
 cyr_ophellas_01.4.desc: "Nach unseren jüngsten Eroberungen in Afrika wurden wir von den Anführern der Abenteurer in unserem Dienst angesprochen. Sie erinnerten uns daran, dass wir ihnen das Recht versprochen haben, sich in den eroberten Gebieten niederzulassen, und bestehen darauf, dass es jetzt an der Zeit ist, unser Versprechen einzulösen. \n\n Die Abenteurer haben bereits einen Ort in der Nähe von [cyr_adventurer_colony_1.GetName] als Ort vorgesehen, an dem sie eine Stadt gründen wollen, aber einige in unserer Verwaltung bestehen darauf, dass [cyr_adventurer_colony_2.GetName] ein geeigneterer Ort wäre."
 cyr_ophellas_01.4.a: "Kolonie gegründet bei [cyr_adventurer_colony_1.GetName]"
 cyr_ophellas_01.4.b: "Kolonie gegründet bei [cyr_adventurer_colony_2.GetName]"
 cyr_ophellas_01.4.c: "Sie haben ihren Zweck erfüllt, schickt sie weg."
 cyr_ophellas_01.5.t: "Spartas verlorene Kolonie in Afrika"
 cyr_ophellas_01.5.desc: "Sparta ist für seine Kolonien nicht so berühmt wie andere griechische Städte. Dies hinderte den spartanischen Prinzen Dorieus, den älteren Bruder des späteren spartanischen Königs Leonidas, jedoch nicht daran, eine Kolonie in der Nähe des Flusses Cinyps in Tripolitanien zu gründen. Obwohl die Spartaner nur wenige Jahre später von einem Bündnis aus Phöniziern und einheimischen Stammesangehörigen vertrieben wurden, ist die Erinnerung an die Kolonie von Dorieus immer noch vorhanden. Jetzt, da die Region fest unter unserer Kontrolle ist, können wir vielleicht eine neue Gruppe von Siedlern davon überzeugen, die Kolonie wieder aufzubauen."
 cyr_ophellas_01.5.a: "Eine Stadt am alten Standort bei [kinyps_scope.GetName] gegründet."
 cyr_ophellas_01.5.b: "Eine Stadt etwas weiter westlich gegründet, in der Nähe der punischen Siedlung [leptis_scope.GetName]"
 cyr_ophellas_01.5.c: "Das klingt nach einer schlechten Idee."
 cyr_ophellas_01.5.tt: "#Y Ein Charakter mit außergewöhnlich hoher Kriegskunst @military_icon! wird sich Ihrer Sache anschließen! #!"
 cyr_ophellas_01.6.t: "Kauf schwerer Kriegsschiffen"
 cyr_ophellas_01.6.desc: "Trotz ihrer fruchtbaren Böden werden in der Cyrenaika nur sehr wenige Holzarten produziert, die für den Bau von Kriegsschiffen geeignet sind. Glücklicherweise sind die Schiffbauer von [cyr_ship_builders.GetName] bereit, eine kleine Flotte moderner schwerer Kriegsschiffe für uns zu bauen. Gegen einen angemessenen Preis, versteht sich.\n\nSobald wir den Auftrag erteilt haben und die Zahlung eingegangen ist, wird es etwa ein Jahr dauern, bis die Schiffe fertiggestellt und zur Übergabe bereit sind."
 cyr_ophellas_01.6.a: "Sag ihnen, sie sollen sofort mit dem Bau beginnen!"
 cyr_ophellas_01.6.b: "Sie verlangen wie viel?"
 cyr_ophellas_01.7.t: "Kauf schwerer Kriegsschiffe – Bau abgeschlossen"
 cyr_ophellas_01.7.desc: "Das Kriegsschiff, das wir bei [cyr_ship_builders.GetName] bestellt haben, ist endlich fertiggestellt und wurde an unseren Hafen in Kyrene geliefert. \n\nEs war vielleicht nicht billig, aber jetzt kann unsere Flotte mit den großen Seemächten der Welt mithalten."
 cyr_ophellas_01.7.a: "Endlich!"
 cyr_ophellas_01.8.t: "Delegation von [GetCharacter('(int32)148').GetName]"
 cyr_ophellas_01.8.desc: "Wir haben eine Delegation von [GetCharacter('(int32)148').GetFullName] erhalten. [GetCharacter('(int32)148').GetFirstName] ist derzeit mit [GetCharacter('(int32)38').GetName], dem Herrscher von [GetCountry('PRY').GetName], verheiratet. Noch wichtiger ist jedoch, dass sie die Witwe von Ophellas ist, dem Mann, dessen Verrat und Tod unsere Strafexpedition gegen Syrakus rächen soll. \n\n[GetCharacter('(int32)148').GetFirstName] gehört zu einer der einflussreichsten Familien Athens – ihr Vorfahre Miltiades entwickelte die Strategie, die die Schlacht von Marathon gewann – und durch diese Verbindung mit Athen konnte Ophellas die Armee griechischer Abenteurer aufstellen, mit denen er in Karthago einmarschierte. Nach dem frühen Tod von Ophellas floh [GetCharacter('(int32)148').GetFirstName] nach Athen, wo sie [GetCharacter('(int32)38').GetName], den Sohn und Erben von [GetCharacter('(int32)37').GetName], heiratete. \n\n[GetCharacter('(int32)148').GetFirstName]  hegt keinerlei Sympathie für die Mörder ihres ersten Mannes und sie hat zugestimmt, unsere Expedition mit allen ihr zur Verfügung stehenden Mitteln zu unterstützen."
 cyr_ophellas_01.8.a: "Eine bemerkenswerte Frau!"
 cyr_ophellas_01.9.t: "Die fremden Oberherren von Syrakus"
 cyr_ophellas_01.9.desc: "Vielleicht als Folge göttlicher Vergeltung hat die Stadt Syrakus seit den Tagen von [GetCharacter('(int32)56').GetFullName] ihre Unabhängigkeit verloren. [GetProvince('(int32)84').GetName] liegt jetzt innerhalb der Grenzen von [cyr_syracuse_foreign_owner.GetName]. \n\nWährend dies eine angemessene Strafe für ihre Verbrechen sein mag, stellt es ein Problem für unsere geplante Strafexpedition dar. Wenn ein umfassender Krieg nicht in unserem Interesse ist, könnte es sich lohnen zu fragen, ob [cyr_syracuse_foreign_owner.GetName] bereit ist, die Stadt zunächst friedlich zu übergeben..."
 cyr_ophellas_01.9.a: "Fragen schadet nie..."
 cyr_ophellas_01.9.b: "Unsinn, wir betreiben Diplomatie an der Speerspitze!"
 cyr_ophellas_01.9.a.tt: "Ein Ultimatum wird an [cyr_syracuse_foreign_owner.GetName] übermittelt."
 cyr_ophellas_01.9.b.tt: "Es wird kein Ultimatum übermittelt."
 cyr_ophellas_01.10.t: "Fremde bedrohen Syrakus"
 cyr_ophellas_01.10.desc: "Es scheint, dass das Land [cyr_syracuse_invasion_root_scope.GetName] einen alten Groll gegen unsere Stadt [GetProvince('(int32)84').GetName] hat. Sie haben verlangt, dass wir unsere Garnison zurückziehen und die Stadt ihrer Gnade ausliefern. Unter normalen Umständen käme das natürlich nicht in Frage,  aber sollte  [cyr_syracuse_invasion_root_scope.GetName] eine ausreichende Bedrohung darstellen, bleibt uns vielleicht keine andere Wahl..."
 cyr_ophellas_01.10.a: "Sie werden sie aus unseren kalten, toten Händen reißen müssen."
 cyr_ophellas_01.10.a.tt: "[cyr_syracuse_invasion_root_scope.GetName] wird darüber informiert, dass wir nicht die Absicht haben, die Stadt zu übergeben."
 cyr_ophellas_01.10.b: "Wir haben keine Wahl, wir übergeben die Stadt."
 cyr_ophellas_01.10.b.tt: "#R Wir werden das Territorium von [GetProvince('(int32)84').GetName] übergeben#!"
 cyr_ophellas_01.11.t: "Fremde Herrscher von Syrakus – Forderungen angenommen"
 cyr_ophellas_01.11.desc: "Die Anführer von [cyr_syracuse_foreign_owner.GetName] haben unseren Forderungen nachgegeben. Die [cyr_syracuse_foreign_owner.GetAdjective]e Garnison wurde aus [GetProvince('(int32)84').GetName] abgezogen und die Stadt ist jetzt wehrlos, abgesehen von ein paar mutigen Einheimischen, die sich hastig zusammengeschlossen haben, um ihre Häuser zu verteidigen."
 cyr_ophellas_01.11.a: "[GetProvince('(int32)84').GetName] ist jetzt leichte Beute!"
 cyr_ophellas_01.11.a.tt: "#Y [GetProvince('(int32)84').GetName] ist unabhängig geworden.#!"
 cyr_ophellas_01.12.t: "Fremde Herrscher von Syrakus – Forderungen zurückgewiesen"
 cyr_ophellas_01.12.desc: "Es überrascht nicht, dass die Anführer von [cyr_syracuse_foreign_owner.GetName] unsere Forderungen, die Stadt friedlich zu übergeben, zurückgewiesen haben. Wir werden sie mit Gewalt einnehmen müssen."
 cyr_ophellas_01.12.a: "Zumindest kann niemand sagen, wir hätten sie nicht gewarnt."
 cyr_ophellas_01.12.a.tt: "#Y [GetProvince('(int32)84').GetName] bleibt ein Teil von [cyr_syracuse_foreign_owner.GetName]. #!"
 cyr_ophellas_01.13.t: "Vorbereitungen abgeschlossen"
 cyr_ophellas_01.13.desc: "Die Vorbereitungen für unsere Invasion von [GetProvince('(int32)84').GetName] sind endlich abgeschlossen. Bald werden die Syrakusaner lernen, den Tag zu bereuen, an dem sie ihre Speere gegen Freunde gerichtet haben."
 cyr_ophellas_01.13.a: "Bei nächster Gelegenheit zuschlagen!"
 cyr_ophellas_01.14.t: "Syrakus vermisst?"
 cyr_ophellas_01.14.desc: "Es scheint, dass etwas Unerwartetes passiert ist und es in Syrakus niemanden mehr gibt, den wir bestrafen könnten."
 cyr_ophellas_01.14.a: "Das sollte nicht passieren..."
 cyr_ophellas_01.15.t: "Das Schicksal von Syrakus"
 cyr_ophellas_01.15.desc: "[GetProvince('(int32)84').GetName], die Stadt des heimtückischen [GetCharacter('(int32)56').GetName], war lange Zeit eine der mächtigsten Städte der griechischen Welt und konkurrierte sogar mit Athen an Größe, als letzteres auf dem Höhepunkt seiner Macht stand. Jetzt, da es uns endlich ausgeliefert ist, müssen wir über sein Schicksal entscheiden. \n\nAngesichts der schweren Verbrechen, die die Syrakusaner gegen Ophellas begangen haben, verlangen viele die vollständige Zerstörung der Stadt. Dies lässt jedoch die Frage offen, was mit seinen Bürgern geschehen soll. Die einfachste Lösung ist natürlich, diejenigen zu versklaven, die versklavt werden können, und jeden zu töten, der sich widersetzt. \n\nEs könnte jedoch klüger sein, die Bevölkerung von Syrakus an einem Ort zu behalten und sie zur Gründung einer neuen Stadt an einem anderen Ort zu verwenden. Hoffentlich würde die durch das erzwungene Exil verursachte Zerrüttung ausreichen, um sicherzustellen, dass die neue Stadt nicht die gleiche Bedrohung darstellt wie einst Syrakus. \n\nSchließlich könnten wir die Stadt natürlich unangetastet lassen – schließlich lässt sich argumentieren, dass die Menschen in Syrakus selbst nur Opfer der Tyrannei von [GetCharacter('(int32)56').GetName] waren."
 cyr_ophellas_01.15.a: "Keine Gnade! Zerstört die Stadt, salzt die Felder und tötet jeden, der sich widersetzt!"
 cyr_ophellas_01.15.b: "Zerstört die Stadt und verbannt ihre Bevölkerung in die Kyrenaika."
 cyr_ophellas_01.15.c: "Zerstört die Stadt und erschafft ein neues Machtzentrum in Sizilien"
 cyr_ophellas_01.15.d: "Lass die Stadt in Ruhe, bestraft nur ihre Anführer."
 cyr_ophellas_01.15.a.tt: "Jeder Bewohnertyp in [GetProvince('(int32)84').GetName] hat eine Wahrscheinlichkeit von #Y 45%#!, #R getötet zu werden#!, eine Chance von #Y 40%#!,  #R versklavt und in eine zufällige Provinz in Kyrenaika umgesiedelt zu werden#!  und eine Chance von #Y 15%#!, #G zu überleben#!."
 cyr_ophellas_01.15.b.tt: "Jeder Bewohnertyp in [GetProvince('(int32)84').GetName] hat eine Wahrscheinlichkeit von #Y 15%#!, #R getötet#!, eine Wahrscheinlichkeit von #Y 65%#! nach [syracuse_destruction_target_scope.GetName] #R verbannt zu werden#! und eine Wahrscheinlichkeit von #Y 20%#!, #G zu überleben#!."
 cyr_ophellas_01.15.c.tt: "Jeder Bewohnertyp in [GetProvince('(int32)84').GetName] hat eine Wahrscheinlichkeit von #Y 15%#!  #R getötet#!, eine Wahrscheinlichkeit von #Y 65%#! nach [syracuse_destruction_target_scope.GetName] #R verbannt zu werden#!  und eine Wahrscheinlichkeit von #Y 20%#! #G zu überleben#!."
 cyr_ophellas_01.16.t: "Gründung des Sizilianischen Bundes"
 cyr_ophellas_01.16.desc: "Als unsere Armeen zum ersten Mal sizilianischen Boden betraten, sollte Syrakus für den Verrat an unserem früheren Herrscher Ophellas bestraft werden. Jetzt, da Syrakus gebührend gedemütigt ist, befinden wir uns jedoch im Besitz eines beträchtlichen Stück Lands am Rande unseres Einflussbereichs. \n\nDa es nie unsere Absicht war, Sizilien zu erobern, haben wir uns entschieden, unseren neuen Besitzungen Autonomie unter einer neuen Regierung zu gewähren. Der neue Staat wird die Form eines Bundes mit der Hauptstadt [cyr_sicilian_league_capital.GetName] annehmen und wird verpflichtet sein, regelmäßig Tribut zu zahlen und uns in unseren Kriegen zu helfen."
 cyr_ophellas_01.16.a: "Der sizilanische Bund wird geboren."
 cyr_ophellas_01.16.a.tt: "Der #Y sizilianische Bund#! wird als Bundesgenosse von [SCOPE.GetRootScope.GetCountry.GetName] unabhängig."
 cyr_ophellas_01.17.t: "Ophellas Prost aus dem Elysium"
 cyr_ophellas_01.17.desc: "Ophellas jubelt aus dem Elysium! [GetProvince('(int32)84').GetName] ist gefallen, dieser einst große Hegemon der westlichen Hellenen, von denen bekannt ist, dass sie eine ganze Reihe verräterischer Tyrannen hervorgebracht haben, eine Tatsache, die unser großer Vorgänger nur zu gut wusste. Ebenso wurden unsere afrikanischen Nachbarn, die Punier, von unseren großen Armeen so schwer gedemütigt, dass sogar die große Stadt [GetProvince('(int32)3256').GetName] selbst jetzt unter unserer Kontrolle ist. \n\n Kyrenaika geht aus diesen Konflikten als unbestreitbarer Hegemon der westlichen Griechen und Afrikas westlich des Nils hervor."
 cyr_ophellas_01.17.a: "Exzellent!"
 cyr_ophellas_01.18.t: "Untergang des karthagischen Staates"  
 cyr_ophellas_01.18.desc: "Mit dem Verlust ihrer Hauptstadt und Heimatregion löst sich der karthagische Staat vor unseren eigenen Augen auf. Bald werden sie nur noch in den Geschichtsbüchern in Erinnerung bleiben, während der Name Kyrenaika von allen respektiert wird."  
 cyr_ophellas_01.18.a: "Die Welt wird vor uns niederknien."  
 cyr_thera_01.1.t: "Die streitenden Städte Kretas"
 cyr_thera_01.1.desc: "Die vielen Stadtstaaten Kretas sind ständig in kleinere Konflikte untereinander und mit Eindringlingen von außen verwickelt. Um einen Vorteil gegenüber ihren Rivalen zu erlangen, suchen viele von ihnen die Hilfe ausländischer Mächte, um ihre Position zu stärken. Wir könnten dies als Gelegenheit nutzen, um auf Kreta Fuß zu fassen: Wenn wir einer der kriegführenden Städte helfen, ihren aktuellen Krieg zu gewinnen, könnten wir die Situation nutzen, um sie dauerhaft in unseren Einflussbereich zu ziehen."
 cyr_thera_01.1.a: "Wir werden uns in ihrem Krieg auf die Seite von [cyr_crete_war_country_1.GetName] stellen!"
 cyr_thera_01.1.b: "[cyr_crete_war_country_2.GetName] verdient unsere Hilfe!"
 cyr_thera_01.1.c: "[cyr_crete_war_country_3.GetName] braucht unsere Hilfe!"
 cyr_thera_01.1.d: "Bei näherem Nachdenken - besser sich nicht darin verstricken..."
 cyr_thera_01.1.a.tt: "Wenn [cyr_crete_war_country_1.GetName] akzeptiert, werden wir uns #R einem Krieg auf der Seite von [cyr_crete_war_country_1.GetName] anschließen#! und #G [cyr_crete_war_country_1.GetName] wird unser Untertan.#!"
 cyr_thera_01.1.b.tt: "Wenn [cyr_crete_war_country_2.GetName] akzeptiert, werden wir uns #R einem Krieg auf der Seite von [cyr_crete_war_country_2.GetName] anschließen#! und #G [cyr_crete_war_country_2.GetName] wird unser Untertan.#!"
 cyr_thera_01.1.c.tt: "Wenn [cyr_crete_war_country_3.GetName] akzeptiert, werden wir uns #R einem Krieg auf der Seite von [cyr_crete_war_country_3.GetName] anschließen#! und #G [cyr_crete_war_country_3.GetName] wird unser Untertan.#!"
 cyr_thera_01.1.d.tt: "Wir werden uns nicht in die Angelegenheiten Kretas einmischen"
 cyr_thera_01.2.t: "[GetCountry('CYR').GetRuler.GetName] bietet Hilfe an"
 cyr_thera_01.2.desc: "Heute ist eine Gesandtschaft von  [GetCountry('CYR').GetRuler.GetName] aus [GetCountry('CYR').GetName] an unserem Hof eingetroffen.  [GetCountry('CYR').GetRuler.GetName] behauptet, mit unserer Seite im aktuellen Krieg zu sympathisieren, und bietet uns die Unterstützung von [GetCountry('CYR').GetName] an, um den Krieg zu gewinnen. \n\nWährend es sehr verlockend ist, unsere Position mit [GetCountry('CYR').GetAdjective]en Männern und Speeren zu stärken, ist es wahrscheinlich, dass die Annahme des  Vorschlags [GetCountry('CYR').GetName] erheblichen Einfluss auf unsere inneren Angelegenheiten verschaffen würde."
 cyr_thera_01.2.a: "Wir können jede Hilfe gebrauchen, die wir bekommen können."
 cyr_thera_01.2.b: "Es besteht keine Notwendigkeit für ausländische Eindringlinge!"
 cyr_thera_01.2.a.tt: "[GetCountry('CYR').GetName] wird sich uns in unserem aktuellen Krieg anschließen"
 cyr_thera_01.2.a.ttt: "#R Wir werden ein Untertan von [GetCountry('CYR').GetName]!#!"
 cyr_thera_01.2.b.tt: "[GetCountry('CYR').GetName] wird sich nicht weiter in unsere Angelegenheiten einmischen."
 cyr_thera_01.3.t: "Streitende Städte Kretas - Hilfe angenommen"
 cyr_thera_01.3.desc: "[cyr_crete_war_country_chosen.GetRuler.GetName] von [cyr_crete_war_country_chosen.GetName] hat unsere Hilfe in ihrem Krieg mit Begeisterung angenommen. Dies wird uns in Zukunft mit Sicherheit einen erheblichen Einfluss auf [cyr_crete_war_country_chosen.GetAdjective]e Angelegenheiten verschaffen."
 cyr_thera_01.3.a: "Exzellent!"
 cyr_thera_01.3.b: "Tatsächlich hat sich die Situation geändert..."
 cyr_thera_01.4.t: "Streitende Städte Kretas - Hilfe verweigert"
 cyr_thera_01.4.desc: "Anscheinend hat [cyr_crete_war_country_chosen.GetRuler.GetName] von [cyr_crete_war_country_chosen.GetName] die von uns angebotene Hilfe abgelehnt. [cyr_crete_war_country_chosen.GetName] zieht es vor, seine Kriege ohne ausländische Beteiligung zu führen."
 cyr_thera_01.4.a: "Sie werden diese Entscheidung bereuen."
 cyr_thera_01.4.b: "Nun gut, wir wollten nur helfen."
 cyr_thera_01.5.t: "Überprüfen, ob Kreta noch im Krieg ist"
 cyr_thera_01.5.desc: "Verstecktes Ereignis ... Sie sollten das nicht sehen."
 cyr_thera_01.5.a: "Den Tooltip überprüfen"
 cyr_thera_01.6.t: "Einfluss über [cyr_crete_war_country_chosen.GetName]"
 cyr_thera_01.6.desc: "Der Krieg, in den [cyr_crete_war_country_chosen.GetName] verwickelt war, ist vorbei, aber der Einfluss, den wir durch unser rechtzeitiges Eingreifen gewonnen haben, bleibt bestehen. [cyr_crete_war_country_chosen.GetName] ist nun fest in unserem Einflussbereich. Wir sollten sie als Brückenkopf nutzen, um unseren Einfluss auf den Rest Kretas auszudehnen."
 cyr_thera_01.6.a: "Sie sind uns zu Dank verpflichtet..."
 cyr_thera_01.7.t: "Die Kykladen umwerben"
 cyr_thera_01.7.desc: "[GetProvince('(int32)454').GetName], die angestammte Heimat der Griechen von [GetProvince('(int32)3360').GetName], wird derzeit vom [GetCountry('DEL').GetName] kontrolliert, einem losen Bündnis zwischen den Inseln der Ägäis mit Hauptsitz in [GetCountry('DEL').GetCapital.GetName]. Die wahre Macht liegt jedoch bei [GetCountry('PRY').GetName], die die [GetCountry('DEL').GetAdjective]e Politik fest im Griff haben und sie nutzen, um ihren Einfluss in der Region auszuüben. Bevor wir unsere glorreiche Rückkehr nach Thera antreten können, müssen wir zuerst den [GetCountry('DEL').GetName] aus ihrem Einflussbereich befreien. \n\n#R Diese Mission hat mehrere neue Entscheidungen freigeschaltet, die uns helfen, unseren Einfluss auf den [GetCountry('DEL').GetName] zu erhöhen. Sobald unser Einfluss stark genug ist, können wir versuchen, den [GetCountry('DEL').GetName] mit der Entscheidung „Loyalität fordern“ in unseren Einflussbereich zu ziehen.#!"
 cyr_thera_01.7.a: "[GetCountry('PRY').GetName] mischt sich schon viel zu lange in die Angelegenheiten des  [GetCountry('DEL').GetName]es ein"
 cyr_thera_01.8.t: "Freundschaft zwischen Herrschern"
 cyr_thera_01.8.desc: "[GetCountry('CYR').GetRuler.GetName] hat seine enge Freundschaft mit [GetCountry('DEL').GetRulerTitle] [GetCountry('DEL').GetRuler.GetName] genutzt, um [GetCountry('DEL').GetRuler.GetFirstName] von den Vorteilen einer engeren Verbindung mit [GetCountry('CYR').GetName] zu überzeugen. Dadurch rückt der [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_thera_01.8.a: "Exzellent!"
 cyr_thera_01.9.t: "Diplomatische Beleidigung"
 cyr_thera_01.9.desc: "Die bösartige diplomatische Beleidigung, die wir kürzlich [GetCountry('PRY').GetName] zugefügt haben, hatte ihre beabsichtigte Wirkung; die Unfähigkeit von [GetCountry('PRY').GetRuler.GetName], eine entscheidende Antwort zu geben, hat ihn in den Augen seiner Untertanen schwach erscheinen lassen. Dadurch rückt der [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_thera_01.9.a: "Alles nach Plan."
 cyr_thera_01.9.b: "Ihn weiter beleidigen!"
 cyr_thera_01.10.t: "Geschenke für den [GetCountry('DEL').GetName]"
 cyr_thera_01.10.desc: "Die Menschen im [GetCountry('DEL').GetName] waren tief beeindruckt von den Geschenken, die wir ihnen kürzlich geschickt haben. Dies könnte der richtige Zeitpunkt sein, unsere Großzügigkeit zu verdoppeln und eine noch größere Spende zu leisten. Unabhängig davon, was wir tun, wird dies den [GetCountry('DEL').GetName] sicherlich näher an unseren Einflussbereich rücken."
 cyr_thera_01.10.a: "Das vorherige Geschenk war ausreichend…"
 cyr_thera_01.10.b: "Lasst uns den [GetCountry('DEL').GetName] mit Gold überschütten."
 cyr_thera_01.10.c: "Den Bau eines großen Tempels in einer ihrer Städte in Auftrag geben!"
 cyr_thera_01.11.t: "Piraterie ausrotten"
 cyr_thera_01.11.desc: "Piraten sind die Geißel der Ägäis, weshalb ihre Ausrottung eine der Hauptaufgaben der [GetCountry('CYR').GetAdjective]en Flotte ist. Es scheint, dass diese Investition in die maritime Sicherheit von [GetCountry('DEL').GetName] nicht unbemerkt geblieben ist, die sich jetzt stark auf unsere Hilfe verlassen, um ihre Küstengewässer sicher zu halten. Dadurch rückt der [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_thera_01.11.a: "Tod allen Piraten!" 
 cyr_thera_01.11.b: "Beeindruckt den [GetCountry('DEL').GetName] noch weiter, indem Ihr die Heimatbasis der Piraten angreift."
 cyr_thera_01.12.t: "Eine große Kriegsflotte"
 cyr_thera_01.12.desc: "Als Ansammlung kleiner Inseln ist der [GetCountry('DEL').GetName] für sein Überleben stark vom Meer abhängig. Es wäre nicht übertrieben zu sagen, dass derjenige, der das Meer kontrolliert, den [GetCountry('DEL').GetName] kontrolliert. Wir besitzen jetzt eine Flotte, die groß genug ist, um die Gewässer der Ägäis gegen fast jeden Feind zu bestehen. Dadurch rückt der [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_thera_01.12.a: "Beeindruckend."
 cyr_thera_01.13.t: "Die Seemacht von [GetCountry('PRY').GetName] in den Schatten stellen"
 cyr_thera_01.13.desc: "Die [GetCountry('CYR').GetAdjective]e Flotte ist jetzt beträchtlich größer als die Flotte des Oberherrn des [GetCountry('DEL').GetName]s, [GetCountry('PRY').GetName]. Ohne eine starke Flotte wird es für [GetCountry('PRY').GetName] sehr schwierig sein, weiterhin Einfluss auf die Ägäischen Inseln auszuüben. Dadurch rückt der [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_thera_01.13.a: "Die [GetCountry('CYR').GetAdjective]e Flotte dominiert unangefochten!"
 cyr_thera_01.14.t: "[GetCountry('PRY').GetName] in den Schatten stellen"
 cyr_thera_01.14.desc: "[GetCountry('PRY').GetName] ist klein und schwach. In ihrem gegenwärtigen Zustand wird es ihnen sehr schwer fallen, die Kontrolle über den [GetCountry('DEL').GetName] zu behalten, besonders wenn sie mit einem viel mächtigeren Land wie unserem konkurrieren. Dadurch rückt der [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_thera_01.14.a: "Doe [GetCountry('PRY').GetAdjective]e Macht wankt."
 cyr_thera_01.15.t: "Die Befreiung des [cyr_wooing_DEL_liberated_country_scope.GetName]s"
 cyr_thera_01.15.desc: "Unsere kürzliche Befreiung des [cyr_wooing_DEL_liberated_country_scope.GetName] von ausländischer Unterdrückung hat [GetCountry('CYR').GetName] fest als Freund der kleinen Stadtstaaten von Hellas und darüber hinaus etabliert. Das macht uns als potenziellen Verbündeten für den [GetCountry('DEL').GetName] erheblich attraktiver, da sie darauf vertrauen können, dass ihre Rechte unter unserer Herrschaft geschützt werden. Dadurch rückt der [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_thera_01.15.a: "Gute Botschaften sind sehr wichtig."
 cyr_thera_01.15.b: "Um unseren guten Willen zu beweisen, werden wir den von unseren Untertanen gezahlten Tribut senken."
 cyr_thera_01.16.t: "Öffentliche Spiele sponsern"
 cyr_thera_01.16.desc: "Das vielleicht sichtbarste Zeichen der [GetCountry('PRY').GetAdjective]en Autorität  über den [GetCountry('DEL').GetName] sind die jährlichen Spiele, die in [GetCountry('DEL').GetCapital.GetName] zu Ehren der herrschenden [GetCountry('PRY').GetAdjective]en Familie  stattfinden. Wenn wir unsere eigenen Spiele sponsern würden, um mit den [GetCountry('PRY').GetAdjective]en Spielen zu konkurrieren, würde dies sicherlich die [GetCountry('PRY').GetAdjective]e Herrschaft stark untergraben."
 cyr_thera_01.16.a: "Nur die aktuellen Spiele sind ausreichend."
 cyr_thera_01.16.b: "Veranstalten Sie unsere eigenen Spiele in [GetCountry('DEL').GetCapital.GetName]."
 cyr_thera_01.17.t: "Umwerben des [GetCountry('DEL').GetName]s - Moment der Wahrheit"
 cyr_thera_01.17.desc: "Seit einiger Zeit gehen [GetCountry('CYR').GetAdjective]e Diplomaten in[GetCountry('DEL').GetCapital.GetName] ein und aus und versuchen, den [GetCountry('DEL').GetName] von den Vorteilen des [GetCountry('CYR').GetAdjective]en Schutzes zu überzeugen. Jetzt sind wir endlich bereit, unsere Beziehung zu formalisieren. Wenn der [GetCountry('DEL').GetName] unser Angebot annimmt, verlässt es den Einflussbereich von [GetCountry('PRY').GetName] und wird ein Untertan von [GetCountry('CYR').GetName]. Bedauerlicherweise ist der Erfolg alles andere als garantiert, da mehrere einflussreiche Persönlichkeiten im [GetCountry('DEL').GetName] immer noch gegen engere Beziehungen zu uns sind. Wir können nur hoffen, dass unsere vergangenen Aktionen genügend Unterstützung gefunden haben, um diese abweichenden Stimmen zu übertönen."
 cyr_thera_01.17.a: "Machent ihnen ein Angebot, das zu gut ist, um es abzulehnen."
 cyr_thera_01.17.b: "Machent ihnen ein Angebot, das zu gut ist, um es abzulehnen."
 cyr_thera_01.17.c: "Machent ihnen ein Angebot, das zu gut ist, um es abzulehnen."
 cyr_thera_01.17.a.tt: "Wenn wir den [GetCountry('DEL').GetName] genug beeindruckt haben, können sie sich dafür entscheiden, unser Thema zu werden."
 cyr_thera_01.18.t: "Werben um den [GetCountry('DEL').GetName] - Schutz akzeptiert"
 cyr_thera_01.18.desc: "Es scheint, dass der [GetCountry('DEL').GetName] unser Angebot, sie zu beschützen, bereitwillig  angenommen hat. Der [GetCountry('DEL').GetName] ist jetzt ein Untertan von [GetCountry('CYR').GetName]."
 cyr_thera_01.18.a: "Eine weise Wahl."
 cyr_thera_01.19.t: "[GetCountry('CYR').GetName] bietet Schutz an"
 cyr_thera_01.19.desc: "Heute haben wir einen Diplomaten aus [GetCountry('CYR').GetName] erhalten. [GetCountry('CYR').GetName] bietet uns ihren Schutz als Gegenleistung für regelmäßigen Tribut und unsere Hilfe in ihren Kriegen an. Wenn wir akzeptieren, werden wir ein Untertan von [GetCountry('CYR').GetName], aber wenn wir ablehnen, könnten sie versuchen, uns durch Krieg zu unterwerfen."
 cyr_thera_01.19.a: "[GetCountry('CYR').GetAdjective]er Schutz hört sich wunderbar an."
 cyr_thera_01.19.a.tt: "#R Wir werden ein Bundesgenosse von [GetCountry('CYR').GetName].#!"
 cyr_thera_01.19.b: "Wir werden uns nie wieder fremden Tyrannen unterwerfen!"
 cyr_thera_01.20.t: "Werben um den [GetCountry('DEL').GetName] - Schutz abgelehnt"
 cyr_thera_01.20.desc: "Es scheint, dass der [GetCountry('DEL').GetName] trotz unserer Bemühungen unser Angebot, sie zu schützen, abgelehnt hat. Wenn wir immer noch die Kontrolle über die Kykladen wollen, müssen wir sie mit Waffengewalt erkämpfen."
 cyr_thera_01.20.a: "Narren!"
 cyr_thera_01.21.t: "Rückkehr nach Thera"
 cyr_thera_01.21.desc: "Vor Jahrhunderten flohen die Vorfahren der ersten Siedler von [GetProvince('(int32)3360').GetName] vor einer Hungersnot auf der Insel [GetProvince('(int32)454').GetName], um in der heutigen Kyrenaika ein neues Leben aufzubauen. \n\nJetzt, da [GetProvince('(int32)454').GetName] unter unserer Kontrolle gefallen ist, ist es endlich an der Zeit, dass ihre Nachkommen nach Hause zurückkehren. Die erste Gruppe kyrenaikischer Siedler ist bereits auf [GetProvince('(int32)454').GetName] eingetroffen und viele weitere werden sicher bald folgen."
 cyr_thera_01.21.a: "Großartig!" 
 cyr_thera_01.21.a.tt: "[GetProvince('(int32)454').GetName] ist jetzt im Besitz von [SCOPE.GetRootScope.GetCountry.GetName]."
 cyr_thera_01.21.a.ttt: "Mehrere kyrenaikische Bewohnertypen sind nach [GetProvince('(int32)454').GetName] umgezogen."
 cyr_thera_01.22.t: "Thera erhebt sich aus der Asche"
 cyr_thera_01.22.desc: "Vor nicht allzu langer Zeit war [GetProvince('(int32)454').GetName] nur eine kleine Siedlung an der Peripherie der Kykladeninseln. Jetzt ist es dank unserer Bemühungen zu einer großen und geschäftigen Stadt geworden, eine der wichtigsten Städte in der Gegend, wenn nicht sogar die wichtigste. Von [GetProvince('(int32)454').GetName] aus breitet sich unser Einfluss weit über das Wasser aus, was uns zu einem wichtigen Anwärter im Kampf um den Einfluss auf die Ägäis macht."
 cyr_thera_01.22.a: "Thera ist größer denn je"
 cyr_thera_01.23.t: "Kretischer Verbündeter annektiert"
 cyr_thera_01.23.desc: "Es scheint, dass unser kretischer Verbündeter inmitten des Kriegschaos von seinen Feinden vernichtet wurde. Dies könnte einen großen Rückschlag für unsere Pläne darstellen."
 cyr_thera_01.23.a: "Der Preis des Krieges..."
 cyr_reform_01.1.t: "Der Staat Kyrenaika"
 cyr_reform_01.1.desc: "Nachdem ihnen jahrhundertelang ihre Herrscher von weit entfernten Königen aufgezwungen worden waren, haben die griechischen Städte der Kyrenaika nun endlich wieder einen eigenen König.  Allerdings sind die [reform_mission_root_scope.GetRuler.GetFamily.GetName]en selbst Fremde, die mit Hilfe ihrer makedonischen Verbündeten den Thron von [reform_mission_root_scope.GetCapital.GetName] bestiegen haben. In den Augen vieler Kyrenaiker unterscheiden sie sich dadurch kaum von der Reihe ausländischer Herrscher, die vor ihnen regierten. \n\nWenn [reform_mission_root_scope.GetRuler.GetName] an seiner Macht festhalten will, muss er seine Herrschaft in den Augen seiner Bürger legitimieren; entweder indem er lokale Bräuche  annimmt und an die Erinnerungen an das vorpersische Königreich Kyrenaika anknüpft, oder indem er sich als hellenistischer König nach dem Vorbild der Seleukiden und Ptolemäer etabliert. Andernfalls könnten die [reform_mission_root_scope.GetRuler.GetFamily.GetName]en bald von genau den Leuten gestürzt werden, die sie zu beherrschen trachten. \n\n #G Königliche #! und #R republikanische #! Kräfte konkurrieren um Einfluss auf [reform_mission_root_scope.GetName]. Der Versuch, radikale Regierungsreformen durchzuführen, ohne sich die Unterstützung der entsprechenden Fraktion zu sichern – oder während die Unterstützung für die gegnerische Fraktion hoch ist –, könnte zu einem Bürgerkrieg führen."
 cyr_reform_01.1.a: "Wir müssen vorsichtig vorgehen..."
 cyr_reform_01.2.t: "Die Königsstadt [GetProvince('(int32)3360').GetName]"
 cyr_reform_01.2.desc: "Wir haben ein ehrgeiziges Projekt begonnen, um [GetProvince('(int32)3360').GetName] in eine Stadt zu verwandeln, die eines Königs würdig ist. Unsere Ingenieure planen bereits den Verlauf neuer Straßen und inspizieren die alten Gebäude, um zu sehen, welche verschönert und welche abgerissen werden können. \n\nDer Wiederaufbau wird ein langer Prozess sein, aber nach Abschluss wird [GetProvince('(int32)3360').GetName] zu den großartigsten Städten des Mittelmeerraums zählen – ein stolzes Beispiel für die griechische Zivilisation und [reform_mission_root_scope.GetAdjective]en Einfallsreichtum."
 cyr_reform_01.2.a: "Herrlich!"
 cyr_reform_01.3.t: "Die Königsstadt - Eine hellenische Stadt"
 cyr_reform_01.3.desc: "Bevor der Ausbau von [GetProvince('(int32)3360').GetName] fortgesetzt werden kann, müssen wir über den Umfang des Umbaus entscheiden. Viele der von Alexander und seinen Nachfolgern gegründeten Städte sind nach einem strengen Rastersystem angelegt, das die Raumnutzung optimiert und das Navigieren durch die Straßen der Stadt vereinfacht. Wir könnten versuchen, [GetProvince('(int32)3360').GetName] nach griechischem Vorbild wieder aufzubauen, allerdings müssten dafür viele der bestehenden Gebäude abgerissen werden. \n\nNatürlich wäre ein solcher Schritt teuer und dürfte bei den derzeitigen Einwohnern von [GetProvince('(int32)3360').GetName] wahrscheinlich auf wenig Gegenliebe stoßen…."
 cyr_reform_01.3.a: "Baut die Stadt von Grund auf wieder auf!"
 cyr_reform_01.3.b: "Eine begrenzte Neugestaltung wird ausreichen"
 cyr_reform_01.4.t: "Die Königsstadt - Widmung"
 cyr_reform_01.4.desc: "Im Rahmen der laufenden Expansionsbemühungen in [GetProvince('(int32)3360').GetName] haben wir die Möglichkeit, eines der neuen Gebäude  [reform_mission_root_scope.GetRuler.GetName] zu widmen. Nach seiner Fertigstellung würde der Neubau als Denkmal für die Pracht der [reform_mission_root_scope.GetRuler.GetFamily.GetName]en Familie  stehen, eine physische Manifestation der Macht und Autorität der [reform_mission_root_scope.GetRuler.GetFamily.GetName]en. Allerdings sind große öffentliche Bauvorhaben natürlich nie billig …"
 cyr_reform_01.4.a: "Einen großen Tempel widmen!"
 cyr_reform_01.4.b: "Ein großes Theater für die Bürger von [GetProvince('(int32)3360').GetName]!"
 cyr_reform_01.4.c: "Diese Mittel könnten woanders besser eingesetzt werden …"
 cyr_reform_01.5.t: "Die königliche Stadt - Zuwanderer"
 cyr_reform_01.5.desc: "Der Ausbau von [GetProvince('(int32)3360').GetName] beginnt, eine große Anzahl von Einwanderern anzuziehen, die hoffen, ihr Glück in der königlichen Hauptstadt zu finden. Natürlich sorgt dieser Zustrom von Fremden für Kontroversen mit den Bewohnern von [GetProvince('(int32)3360').GetName]. Wenn wir uns die Unterstützung unseres Volkes sichern wollen, müssen wir möglicherweise unsere Türen für Zuwanderer von außerhalb von [reform_mission_root_scope.GetName] schließen ."
 cyr_reform_01.5.a: "[GetProvince('(int32)3360').GetName] ist für Kyrenaiker!"
 cyr_reform_01.5.b: "In [GetProvince('(int32)3360').GetName] ist jeder willkommen."
 cyr_reform_01.5.c: "Unsinn! Verkündet, dass die Türen von [GetProvince('(int32)3360').GetName] jedem offen stehen."
 cyr_reform_01.6.t: "Die Königsstadt - Der Königspalast"
 cyr_reform_01.6.desc: "Das große Projekt zum Wiederaufbau von [GetProvince('(int32)3360').GetName] ist fast abgeschlossen. Die Stadt hat sich bereits in eines der Juwelen der griechischen Zivilisation verwandelt. Jetzt fehlt nur noch ein königlicher Palast, der dem Herrscher einer solchen Stadt angemessen ist. Die Frage ist, wie viel Geld wir bereit sind, in den Bau zu investieren."
 cyr_reform_01.6.a: "Das Zentrum unserer Herrschaft wird unübertroffen sein!"
 cyr_reform_01.6.b: "Ein moderates Design sollte ausreichen."
 cyr_reform_01.6.c: "Ein bescheidener Wohnsitz, wir brauchen keinen dekadenten Luxus."
 cyr_reform_01.7.t: "Die Battiaden-Dynastie"
 cyr_reform_01.7.desc: "Vor mehr als 300 Jahren führte Battos I. eine Gruppe von Siedlern von der Ägäisinsel [GetProvince('(int32)454').GetName] an die Küste Libyens, wo sie die Stadt [GetProvince('(int32)3360').GetName] gründeten. Battos wurde der erste König der Kyrenaika, und die von ihm gegründete Dynastie der Battiaden regierte zwei Jahrhunderte lang, bevor sie einer Kombination aus internen Unruhen und persischem Expansionismus erlag. \n\nObwohl die Battiaden die Königsherrschaft verloren haben, bekleiden viele ihrer Nachkommen weiterhin wichtige Positionen in der gesamten Kyrenaika. Dies stellt unsere neue Regierung vor eine gewisse Herausforderung: Die Einbindung der Battiaden in unsere Regierung könnte die Legitimität unserer Herrschaft stärken, würde aber möglicherweise bedeuten, unsere größten Rivalen in Reichweite des Throns zu bringen. Andererseits würde eine Nichtbeachtung zwar ihren Einfluss einschränken, sie aber mit ziemlicher Sicherheit in die Arme unserer Feinde treiben."
 cyr_reform_01.7.a: "Wir können ihre alte Abstammung nicht ignorieren."
 cyr_reform_01.7.b: "Das Battiadische Königreich ist schon lange tot."
 cyr_reform_01.8.t: "Eine Eheverbindung mit den Battiaden"
 cyr_reform_01.8.desc: "Heute ist [battiad_1.GetName] mit einem faszinierenden Vorschlag an den Hof gekommen: Er bietet die Hand von [cyr_battiad_bride.GetName] zur Ehe an. [cyr_battiad_bride.GetFirstName] ist eine junge Frau im heiratsfähigen Alter aus einem der angesehensten Zweige des Battiaden-Stammbaums. Eine Heirat zwischen ihr und einem Mitglied der [reform_mission_root_scope.GetRuler.GetFamily.GetName]en-Familie würde sicherlich unsere Autorität stärken, aber es gibt keine Garantie dafür, dass dies nicht alles Teil eines Plans ist, die Battiaden wieder auf den Thron zu bringen …"
 cyr_reform_01.8.a: "[cyr_battiad_bride.GetName] wird [reform_mission_root_scope.GetRuler.GetName] heiraten"
 cyr_reform_01.8.b: "Eine Vereinigung zwischen [cyr_battiad_bride.GetName] und [cyr_battiad_groom_heir.GetName] wäre am vorteilhaftesten."
 cyr_reform_01.8.c: "Nein, die Battiaden hatten ihre Chance."
 cyr_reform_01.9.t: "Die versandete Lagune der Euesperiden"
 cyr_reform_01.9.desc: "Ursprünglich von Verbannten gegründet, die vor den politischen Unruhen in [GetProvince('(int32)3360').GetName] flohen, ist [GetProvince('(int32)3350').GetName] die abgelegenste der Städte im Kernland der Kyrenaika. Umso schlimmer ist es, dass die natürliche Lagune, die als Hafen dient, versandet und es für Schiffe immer schwieriger wird, dort anzulegen. An diesem Punkt könnte die einzige Lösung darin bestehen, die gesamte Stadt mehrere Kilometer an einen neuen Ort mit einem besseren Hafen zu verlegen."
 cyr_reform_01.9.a: "[GetProvince('(int32)3350').GetName] am neuen Standort neugegründet."
 cyr_reform_01.9.b: "Verlegt sie und gebt ihr einen neuen Namen: Berenike"
 cyr_reform_01.9.c: "Es ist nur etwas Sand im Wasser, das macht schon nichts aus."
 cyr_reform_01.10.t: "Ein neuer Hafen für Barke"
 cyr_reform_01.10.desc: "[GetProvince('(int32)3357').GetName] gilt traditionell als die zweitwichtigste Stadt der Kyrenaika. Sie ist bekannt dafür, dass hier Griechen und Libyer Seite an Seite leben – und zwar in einem Maße, das sie selbst unter den anderen Städten der Kyrenaika hervorhebt, die schon immer ungewöhnlich freundschaftliche Beziehungen zu ihren einheimischen Nachbarn unterhielten. \n\n[GetProvince('(int32)3357').GetName] liegt allerdings auch im Landesinneren, weit weg von der Küste. Dies ist zu einem Problem geworden, seit Alexanders Eroberungen auch in der Kyrenaika zu einer stärkeren Einbindung in die hellenischen Welt geführt haben. Glücklicherweise gibt es einen guten Platz für eine Stadt, die näher am Meer liegt …"
 cyr_reform_01.10.a: "Eine neue Stadt in [GetProvince('(int32)3354').GetName] gründen."
 cyr_reform_01.10.b: "Die neue Stadt soll als Magadeia bekannt werden."
 cyr_reform_01.10.c: "[GetProvince('(int32)3357').GetName] ist so, wie es ist, in Ordnung."
 cyr_reform_01.11.t: "Die wachsende Stadt [GetProvince('(int32)3354').GetName]"
 cyr_reform_01.11.desc: "Die Bauarbeiten in unserer neuen Stadt in [GetProvince('(int32)3354').GetName] gehen reibungslos voran. Das Verwaltungszentrum der Stadt ist bereits fertiggestellt und der neue Hafen ist bereit, die ersten Schiffe aufzunehmen. Jetzt müssen wir entscheiden, was die Rolle von [GetProvince('(int32)3354').GetName] sein wird, wenn es fertig ist."
 cyr_reform_01.11.a: "[GetProvince('(int32)3354').GetName] war immer als Hafen für [GetProvince('(int32)3357').GetName] gedacht."
 cyr_reform_01.11.b: "[GetProvince('(int32)3354').GetName] wird [GetProvince('(int32)3357').GetName] als zweite Stadt der Kyrenaika ersetzen."
 cyr_reform_01.5.c.tt: "Zwischen #Y 4#! und #Y7#! Bevölkerungstypen werden in [GetProvince('(int32)3360').GetName] erscheinen."
 cyr_reform_01.10.b.tt: "[GetProvince('(int32)3354').GetName] wird als Magadeia bekannt."
 cyr_reform_01.11.b.tt: "75% der Bevölkerung von [GetProvince('(int32)3357').GetName] werden  nach [GetProvince('(int32)3354').GetName] #Y migrieren#!."
 cyrene_1_magas: "Der Erstgeborene der Königin"
 cyr_reform_01.12.t: "Städtetour - Start"
 cyr_reform_01.12.desc: "[reform_mission_root_scope.GetRuler.GetName] mag der unangefochtene Herrscher der Kyrenaika sein, aber viele seiner Bewohner wissen nicht viel mehr über ihn als seinen Namen. Um sicherzustellen, dass er von seinen Untertanen anerkannt wird, hat [reform_mission_root_scope.GetRuler.GetFirstName] beschlossen, sich auf eine ausgedehnte Tour durch die Landschaft der Kyrenaika zu begeben. \n\nIm Laufe der nächsten sechs Monate werden [reform_mission_root_scope.GetRuler.GetFirstName] und sein Leibwächter so viele Städte wie möglich besuchen, um lokale Streitigkeiten zu schlichten und sich bei den lokalen herrschenden Klassen hervorzuheben."
 cyr_reform_01.12.a: "Holt die Pferde, wir werden sofort abreisen"
 cyr_reform_01.13.t: "Ein Streit zwischen Städten"
 cyr_reform_01.13.desc: "Kurz nach der Ankunft in [tour_location_scope_1_1.GetName] wird [reform_mission_root_scope.GetRuler.GetName] von Vertretern der nahe gelegenen Siedlung [tour_location_scope_1_2.GetName] angesprochen. Sie verlangen, dass [reform_mission_root_scope.GetRuler.GetName] über einen langjährigen Streit zwischen [tour_location_scope_1_2.GetName] und [tour_location_scope_1_1.GetName] urteilt. \n \nNach dem erblosen Tod eines wohlhabenden Adligen aus [tour_location_scope_1_2.GetName] übernahm [tour_location_scope_1_1.GetName] einen Teil der Besitzes des Mannes, der innerhalb des Territoriums von [tour_location_scope_1_1.GetName] liegt. [tour_location_scope_1_2.GetName] besteht jedoch darauf, dass, da der Mann ein Bürger von [tour_location_scope_1_2.GetName] war, sein gesamtes Eigentum [tour_location_scope_1_2.GetName] gehört. \n\nUnabhängig davon, wen wir unterstützen, werden wir wahrscheinlich die andere Seite verärgern."
 cyr_reform_01.13.a: "Das Eigentum des Toten gehört [tour_location_scope_1_2.GetName]"
 cyr_reform_01.13.b: "Was sich im Gebiet von [tour_location_scope_1_1.GetName] befindet, gehört [tour_location_scope_1_1.GetName]"
 cyr_reform_01.13.c: "Der rechtmäßige Erbe ist eindeutig niemand anderes als [reform_mission_root_scope.GetRuler.GetName] selbst."
 cyr_reform_01.14.t: "Lokale Zeremonie"
 cyr_reform_01.14.desc: "Als der königliche Zug an den Toren von [tour_location_scope_2.GetName] vorbeizieht, wird deutlich, dass sich der Ort mitten in den Vorbereitungen für ein wichtiges lokales Fest befindet. Als König wäre es mehr als angebracht, [reform_mission_root_scope.GetRuler.GetName] eine zentrale Rolle bei den Feierlichkeiten zukommen zu lassen. Die örtliche Priesterschaft scheint jedoch nicht bereit zu sein, ihre traditionellen Rituale um ihres Königs willen zu ändern …"
 cyr_reform_01.14.a: "Sicherlich wird eine großzügige Spende ausreichen, sie zu überzeugen"
 cyr_reform_01.14.b: "Die Priester werden den Forderungen ihres Königs gehorchen!"
 cyr_reform_01.14.c: "Lasst uns die Götter nicht verärgern, indem wir mit der Tradition brechen"
 cyr_reform_01.15.t: "Libysche Banditen"
 cyr_reform_01.15.desc: "Als die Reisegesellschaft von [reform_mission_root_scope.GetRuler.GetName] an [tour_location_scope_3.GetName] vorbeikommt, erhaltet ihr Neuigkeiten über eine kleine Bande libyscher Banditen, die sich in der Gegend niedergelassen haben und die lokale Gemeinschaft mit ihren unaufhörlichen Überfällen plagen. Als König der Kyrenaika ist es unsere oberste Pflicht, unser Volk vor dieser Art der Übergriffen zu schützen. Da uns jedoch nur unsere kleine Leibwache begleitet, könnte es gefährlich sein, die Banditen offen anzugreifen."
 cyr_reform_01.15.a: "Wir dürfen keine Zeit verlieren. Wir werden es hier und jetzt mit ihnen aufnehmen."
 cyr_reform_01.15.b: "Die Banditen werden erledigt, aber zuerst werden wir Verstärkung aus den umliegenden Städten anfordern"
 cyr_reform_01.15.c: "Wir haben keine Zeit, uns um sie zu kümmern …"
 cyr_reform_01.15.a.tt: "\n #Y Sonst:0 #!"
 cyr_reform_01.16.t: "Unerwünschte Aufmerksamkeit"
 cyr_reform_01.16.desc: "Gerade als [reform_mission_root_scope.GetRuler.GetName] sich für die Nacht zurückziehen will, wird er von einem jungen Mann aus der nahe gelegenen Gemeinde [tour_location_scope_5.GetName] angesprochen. Er behauptet, dass einer unserer Leibwächter unerwünschte Annäherungsversuche an seine Schwester gewagt hätte und verlangt, dass der Leibwächter hart bestraft wird. Wir müssen mit dieser Situation vorsichtig umgehen, wenn wir nicht riskieren wollen, die Einheimischen zu verärgern."
 cyr_reform_01.16.a: "Lasst den Leibwächter auspeitschen und die Familie des Mannes entschädigen"
 cyr_reform_01.16.b: "Dieser Mann scheint nützlich zu sein … er kann seine Gerechtigkeit bekommen, wenn er sich im Gegenzug unserem Gefolge anschließt."
 cyr_reform_01.16.c: "Wir können unsere Männer nicht für jedes Dorfmädchen bestrafen, das sie bedrängen"
 cyr_reform_01.16.d: "Eigentlich suche ich jemanden, der mein Bett wärmt…"
 cyr_reform_01.16.b.tt: "#Y [cyr_tour_local_brother.GetName]#! wird dem Hof beitreten."
 cyr_reform_01.16.d.tt: "#Y [cyr_tour_local_sister.GetName]#! wird dem Hof beitreten."
 cyr_reform_01.16.d.ttt: "#Y [cyr_tour_local_sister.GetName]#! könnte schwanger werden."
 cyr_reform_01.17.t: "Nach Hause zurückkehren"
 cyr_reform_01.17.desc: "Nach sechs langen Monaten unterwegs ist [reform_mission_root_scope.GetRuler.GetName] endlich nach Hause zurückgekehrt. Die Reise war anstrengend, und in der Hauptstadt hat sich in Abwesenheit des Königs viel Arbeit angesammelt. Trotz der enormen Arbeitsbelastung, die Ihnen jetzt ins Gesicht starrt, sollten sich zumindest die Bürger der Kyrenaika ihrem König näher fühlen."
 cyr_reform_01.17.a: "Trautes Heim, Glück allein."
 cyr_academies_01.1.t: "Der Erdumfang"
 cyr_academies_01.1.desc: "Heute gab [eratosthenes_scope.GetName] eine bahnbrechende Entdeckung bekannt: Durch Messung des Unterschieds zwischen den Längen der Schatten, die von identischen Stäben an verschiedenen Orten geworfen wurden, konnte  [eratosthenes_scope.GetFirstName] den genauen Umfang der Erde berechnen. Nicht zufrieden damit, nur der erste Mensch zu sein, der die wahre Größe der Welt kannte, fuhr er fort, auch die Neigung der Rotationsachse der Erde relativ zur Ebene der Sonne zu berechnen. Er erstellte sogar die erste genaue Karte der bekannten Welt, indem er seine Berechnungen mit den Berichten von Reisenden kombinierte, die die weit entfernten Provinzen an der Peripherie der Zivilisation besucht hatten. \n\n[eratosthenes_scope.GetFirstName] selbst wurde in [GetProvince('(int32)3360').GetName] geboren, erwarb sich aber nach dem Studium in [GetProvince('(int32)416').GetName] und [GetProvince('(int32)516').GetName] seinen Ruf als Gelehrter.  Er ist bekannt für die große Bandbreite der Themen, mit denen er sich beschäftigt hat; neben seinen Arbeiten zur Größe der Erde erfand er Breiten- und Längengrade zur Angabe von Orten auf einem Globus, war der Erste, der versuchte, das genaue Datum des Trojanischen Krieges zu bestimmen, und entwickelte eine Methode zur effizienten Ermittlung von Primzahlen.\n\nDie Entdeckungen von [eratosthenes_scope.GetFirstName] sind in seinem Opus Magnum „Über den Erdumfang“ zusammengefasst."
 cyr_academies_01.1.a: "Die ganze Welt liegt vor uns!" 
 cyr_academies_01.2.t: "Die Zukunft der kyrenaikischen Philosophie"
 cyr_academies_01.2.desc: "[SCOPE.GetRootScope.GetCountry.GetName] ist die Heimat der berühmten philosophischen Schule der Kyrenaiker. Die Schule selbst wurde von #Y Aristippus dem Älteren#! gegründet, Während der Zeit von Sokrates wurden jedoch viele seiner Lehren nur von [GetCharacter('(int32)233').GetName] formalisiert, genannt ''Metrodidaktos'' (''Mutter-Gelehrt''), da er Philosophie von seiner Mutter Arete, der Tochter von Aristippus dem Älteren, lernte. \n\nDer Kyrenaizismus ist eine hedonistische philosophische Schule, die das individuelle Vergnügen als höchstes Ziel des menschlichen Lebens betont. Andere Werte, wie beispielsweise ein tugendhaftes Leben, werden nur insofern geschätzt, als sie das Vergnügen des Einzelnen steigern oder sein Leiden mindern können. \n\nIn jüngster Zeit ist die Popularität des Kyrenaizismus jedoch zurückgegangen, was vor allem auf den Aufstieg neuer, nicht-kyrenaistischer hedonistischer Philosophen wie [GetCharacter('(int32)218').GetName],zurückzuführen ist, deren Ideen ausgefeilter sind als die von Aristippos. Als Reaktion darauf ist eine neue Generation kyrenaischer Philosophen herangewachsen, die versucht, die kyrenaische Schule zu modernisieren, damit sie mit den anderen philosophischen Schulen der Zeit konkurrieren kann. Besonders hervorzuheben sind die Lehren von [GetCharacter('(int32)469').GetName], [GetCharacter('(int32)230').GetName] und [GetCharacter('(int32)468').GetName]. \n\nWie andere Kyrenaiker betrachtet [GetCharacter('(int32)469').GetName] das Vergnügen als das ultimative Ziel des Lebens, im Gegensatz zu Aristippos ist er jedoch der Ansicht, dass das Vergnügen bei jeder Handlung einzeln betrachtet werden muss (und nicht als die Summe des im Laufe des Lebens angehäuften Vergnügens) und dass Leiden nicht das Gegenteil von Vergnügen ist. Daher können für [GetCharacter('(int32)469').GetFirstName] Tugenden wie Freundschaft, Loyalität und Patriotismus gut sein, da sie im Moment Freude bereiten, auch wenn sie auf lange Sicht hin und wieder Schmerz und Leid verursachen können. \n\nAuch [GetCharacter('(int32)230').GetName] teilt den gemeinsamen kyrenäischen Glauben an das Vergnügen als höchstes Ziel des Lebens. Er lehnt jedoch offen Freundschaft und Patriotismus als Ablenkung vom Streben nach Glück ab und besteht stattdessen darauf, dass „die Welt sein Land ist“. Tatsächlich glaubt [GetCharacter('(int32)230').GetFirstName], dass an Verbrechen wie Diebstahl und Ehebruch nichts falsch ist – sie sollten nur vermieden werden, weil die Strafen, die die Gesellschaft im Gegenzug auferlegt, Leiden verursachen (und somit das Vergnügen verringern). Die bei weitem umstrittenste Aussage von [GetCharacter('(int32)230').GetFirstName] ist jedoch sein Beharren darauf, dass die Götter – oder zumindest die allgemein akzeptierten Götter der hellenistischen Welt – nicht existieren und dass Götter, Gebete, Opfer und Gotteslästerung alles nur menschliche Erfindungen sind. Sein Beharren darauf, dass die Götter nicht existieren, hat ihm den Spitznamen „Atheus“ („Der Atheist“) eingebracht.\n\n[GetCharacter('(int32)468').GetFirstName] sieht Glück ebenfalls als das höchste Ziel des Lebens. Im Gegensatz zu den beiden anderen glaubt er, dass es grundsätzlich unmöglich ist, wahres Glück zu erreichen. Außerdem glaubt [GetCharacter('(int32)468').GetName], dass es unmöglich ist, die Erfahrungen eines anderen Mannes wirklich zu verstehen. Daher gibt es für ihn keinen Unterschied zwischen einem Leben als König und einem Leben als Sklave; keiner kann wahres Glück kennen, beide sind gezwungen, Leid zu erfahren, und keiner kann sich mit dem anderen vergleichen, weil er die Erfahrungen des anderen nicht kennen kann. Anstatt das Vergnügen zu maximieren, geht es für [GetCharacter('(int32)468').GetFirstName] also darum, persönliches Leiden zu minimieren - und für [GetCharacter('(int32)468').GetFirstName] gibt es keinen besseren Weg, das Leiden zu verringern, als den Tod. Dies ist die kühnste Behauptung von [GetCharacter('(int32)468').GetFirstName]; dass der Tod dem Leben vorzuziehen ist, denn im Tod gibt es kein Leiden. Gerüchten zufolge haben die Vorträge von [GetCharacter('(int32)468').GetFirstName] Hunderte davon überzeugt, sich das Leben zu nehmen, was ihm den Spitznamen „Peisithanatos“ – „Überzeuger des Todes“ eingebracht hat."
 cyr_academies_01.2.a: "Die kyrenäische Philosophie verändert sich..."
 cyr_academies_01.3.t: "Förderung der hegesiadischen Philosophie"
 cyr_academies_01.3.desc: "Unsere tatkräftige Unterstützung der #Y Hegesiadischen Schule #! hat es de facto zur Staatsphilosophie von [SCOPE.GetRootScope.GetCountry.GetName] gemacht. \n\n[GetCharacter('(int32)468').GetName] sah Glück als das höchste Ziel im Leben an. Er war jedoch davon überzeugt, dass es grundsätzlich unmöglich ist, wahres Glück zu erreichen. Außerdem glaubte er, dass es unmöglich sei, die Erfahrungen eines anderen Menschen wirklich zu verstehen. Für [GetCharacter('(int32)468').GetFirstName] gibt es also keinen Unterschied zwischen einem Leben als König und einem Leben als Sklave: Keiner kann wahres Glück kennen, beide sind gezwungen, Leiden zu erfahren, und keiner kann sich mit dem anderen vergleichen, weil sie die Erfahrungen des anderen nicht kennen können. Anstatt das Vergnügen zu maximieren, geht es im Leben also für [GetCharacter('(int32)468').GetFirstName]  darum, persönliches Leiden zu minimieren - und für [GetCharacter('(int32)468').GetFirstName] gibt es keinen besseren Weg, das Leiden zu verringern, als den Tod. Das ist die kühnste Behauptung von [GetCharacter('(int32)468').GetFirstName]: Dass der Tod dem Leben vorzuziehen ist, denn im Tod gibt es kein Leiden. Gerüchten zufolge haben [GetCharacter('(int32)468').GetFirstName]s Vorträge Hunderte davon überzeugt, sich das Leben zu nehmen, was ihm den Spitznamen „Peisithanatos“ – „Überzeuger des Todes“ eingebracht hat. \n \nDie Lehren von [GetCharacter('(int32)468').GetFirstName] sind in seinem berühmtesten Werk, einem Buch mit dem Titel „Tod durch Hunger“, gesammelt. Es ist so gestaltet, dass ein weiser Mann seinen Freunden erklärt, warum er sich entschieden hat, sich zu Tode zu hungern, und die darin enthaltene Beschreibung des Elends des menschlichen Zustands soll so überzeugend sein, dass die meisten, die es lesen, Selbstmord in Betracht ziehen."
 cyr_academies_01.3.a: "Die Hegesiadische Philosophie ist zur dominierenden Schule des Kyrenaismus geworden."
 cyr_academies_01.4.t: "Theodoridische Philosophie gefördert" 
 cyr_academies_01.4.desc: "Unsere tatkräftige Unterstützung der #Y Theodoridischen Schule #! hat sie de facto zur Staatsphilosophie von [SCOPE.GetRootScope.GetCountry.GetName] gemacht.\n\n[GetCharacter('(int32)230').GetName] teilte die in der kyrenaischen Philosophie verbreitete Überzeugung, dass das Vergnügen das höchste Ziel des Lebens sei.  Er lehnt jedoch offen Freundschaft und Patriotismus als Ablenkung vom Streben nach Glück ab und besteht stattdessen darauf, dass „die Welt sein Land ist“. Tatsächlich glaubt [GetCharacter('(int32)230').GetFirstName], dass Verbrechen wie Diebstahl und Ehebruch an sich nichts Falsches sind, sie sollten nur deshalb vermieden werden, weil die Strafen, die die Gesellschaft im Gegenzug auferlegt, Leiden verursachen (und somit das Vergnügen verringern). Die bei weitem umstrittenste Behauptung von [GetCharacter('(int32)230').GetFirstName] ist jedoch sein Beharren darauf, dass die Götter – oder zumindest die allgemein angenommenen Götter der hellenistischen Welt – falsch sind und dass Götter, Gebete, Opfer und Gotteslästerung alles nur menschliche Erfindungen sind. Sein Beharren darauf, dass die Götter nicht existieren, hat ihm den Spitznamen „Atheus“ („Der Atheist“) eingebracht. \n\nDas bedeutendste Werk von [GetCharacter('(int32)230').GetFirstName] ist ein Buch mit dem Titel „Über die Götter“, das seine theologischen Gedanken zusammenfasst und angeblich eine wichtige Inspirationsquelle für andere hedonistische Philosophen war, darunter auch [GetCharacter('(int32)230').GetFirstName]."
 cyr_academies_01.4.a: "Die theodoridische Philosophie ist zur dominierenden Schule des Kyrenaikismus geworden."
 cyr_academies_01.5.t: "Annikeridische Philosophie gefördert"
 cyr_academies_01.5.desc: "Unsere tatkräftige Unterstützung der #Y annikeridische Schule#! hat sie de facto zur Staatsphilosophie von [SCOPE.GetRootScope.GetCountry.GetName] gemacht. \n\nWie andere Kyrenaiker betrachtete [GetCharacter('(int32)446').GetName] Vergnügen als das ultimative Ziel des Lebens,  im Gegensatz zu anderen ist er jedoch der Ansicht, dass das Vergnügen jeder einzelnen Handlung für sich betrachtet werden muss (und nicht als die Summe des im Laufe eines Lebens angehäuften Vergnügens) und dass Leiden nicht das Gegenteil von Vergnügen ist. So können für [GetCharacter('(int32)446').GetFirstName] Tugenden wie Freundschaft, Loyalität und Patriotismus gut sein, da sie im Moment Freude bereiten, auch wenn sie auf lange Sicht hin und wieder Schmerz und Leid verursachen können."
 cyr_academies_01.5.a: "Die annikeridische Philosophie ist zur dominierenden Schule des Kyrenaikismus geworden."
 cyr_academies_01.6.t: "Poesie für das hellenistische Zeitalter"
 cyr_academies_01.6.desc: "Unter den vielen Schriftstellern und Dichtern von [GetProvince('(int32)3360').GetName] überragt ein Mann alle seinesgleichen: [kallimakhos_scope.GetName] wird bereits als der vielleicht größte Dichter seiner Zeit anerkannt. [kallimakhos_scope.GetFirstName]s ästhetische Philosophie, bekannt als Kallimacheanismus, legt den Schwerpunkt auf kurze, äußerst raffinierte Werke statt auf lange, epische Erzählungen und hat unter seinen Schriftstellerkollegen  einen großen Einfluss erlangt. Man sagt, [kallimakhos_scope.GetFirstName] habe „die Dichtung für das hellenistische Zeitalter neu erfunden“, und es ist wahrscheinlich, dass sie die Richtung der Literatur für die kommenden Jahrhunderte, wenn nicht sogar Jahrtausende, prägen wird. \n\n[kallimakhos_scope.GetFirstName] selbst soll mehr als 800 Werke geschaffen haben, von denen die bekanntesten die „Pinakes“ (ein umfassender Katalog der gesamten griechischen Literatur), die „Aetia“ (eine Reihe von Gedichten über die mythologischen Ursprünge der Wirklichkeit), die „Hekale“ (ein episches Gedicht über das Leben einer alten Frau, erzählt aus der Perspektive des Helden Theseus) sowie seine Iamben (satirische Gedichte) und Hymnen (eine Sammlung von 60 religiösen Hymnen)." 
 cyr_academies_01.6.a: "Ein wahrer Meister seines Fachs!"
 cyr_academies_01.7.t: "Neue Ideen für ein neues Zeitalter"
 cyr_academies_01.7.desc: "Aufgrund ihrer hedonistischen Fokussierung auf das Vergnügen ist die kyrenaikische Philosophie nicht förderlich für die Schaffung eines gut funktionierenden Staates. Glücklicherweise nimmt die Popularität des Kyrenaikismus bereits ab. Mit ein bisschen staatlicher Unterstützung sollten wir in der Lage sein, die Akademie von [GetProvince('(int32)3360').GetName] in die richtige Richtung zu lenken. Von den vielen bestehenden Philosophieschulen kämen besonders drei als Kandidaten für eine neue Staatsphilosophie in Frage: \n\nDer #Y Epikureismus#! ist eine weitere hedonistische Schule und in vielerlei Hinsicht der Nachfolger unserer Kyrenaiker. Während der Kyrenaikismus jedoch die körperlichen Genüsse betont, bevorzugt der Epikureismus die geistigen Genüsse. Epikureer lehnen körperliche Genüsse wie Völlerei und Wollust ab, da sie der Überzeugung sind, dass diese auf lange Sicht mehr Leid als Freude verursachen. Stattdessen leben die Anhänger von [GetCharacter('(int32)218').GetFirstName] bescheiden und streben nach den immateriellen Freuden, die sich aus Freundschaft, Gerechtigkeit und intellektuellen Bestrebungen ergeben.  \n\nDer #Y Stoizismus #! betont Standhaftigkeit, Selbstbeherrschung und das Leben eines tugendhaften Lebens. Glück ist für die Stoiker nicht das Ziel im Leben, sondern eine natürliche Folge des Lebens nach den stoischen Tugenden. Zu diesem Zweck streben Stoiker danach, sich von Leidenschaft zu befreien und stattdessen auf alles im Leben mit Vernunft, Logik und einem ruhigen Geist zu reagieren. Indem sie diesen Lehren folgen, glauben die Stoiker, dass sie Leiden vermeiden und somit Glück erlangen können, indem sie die Rolle erkennen, die schmerzhafte Ereignisse in der natürlichen Ordnung des Universums spielen. \n\nSchließlich konzentriert sich der #Y Kynismus#! auf das Streben nach einem tugendhaften Leben, indem er die künstlichen Konventionen der Gesellschaft ablehnt und in Übereinstimmung mit der natürlichen Ordnung lebt. Die Kyniker predigen Armut und Schamlosigkeit, nicht weil sie zu Scham unfähig wären, sondern weil sie sich selbst als über materiellem Reichtum und Schamgefühl stehend betrachten. Dementsprechend leben Kyniker in Armut und zögern nicht, in der Öffentlichkeit zu essen, ihre Notdurft zu verrichten oder Geschlechtsverkehr zu haben; oft geben sie sich sogar besondere Mühe, ihren Lebenszustand so sichtbar wie möglich zu machen, in der Hoffnung, ihre Philosophie zu verbreiten."
 cyr_academies_01.7.a: "Die #Y Epikureer#! sind die natürlichen Nachfolger der Kyrenaiker."
 cyr_academies_01.7.b: "Unsere Bürger täten gut daran, der Tapferkeit der #Y Stoiker#! nachzueifern."
 cyr_academies_01.7.c: "Wir müssen im Einklang mit der Natur leben wie die #Y Kyniker#!."
 cyr_academies_01.8.t: "Der Silphium-Handel"
 cyr_academies_01.8.desc: "Das wichtigste in unserem Land produzierte Handelsgut ist #Y Silphium#!. Diese äußerst seltene Pflanze wächst nur in der Kyrenaika, ist aber ein unschätzbarer Bestandteil der Medizin im gesamten Mittelmeerraum. \n\nEs wird angenommen, dass Silphium alles heilt, von Husten und Halsschmerzen bis hin zu Warzen, Verdauungsstörungen und „Hervortreten des Darms“.  Seine wichtigste Verwendung ist jedoch die Verhinderung der Geburt ungewollter Kinder. Eine Frau, die die unbeabsichtigten Folgen einer leidenschaftlichen Nacht vermeiden möchte, nimmt einen Teil der Pflanze zu sich, bevor sie sich mit ihrem Partner einlässt, und kein Kind wird in ihrem Mutterleib Fuß fassen können. Ebenso nimmt eine Frau, die eine ungewollte Schwangerschaft vermutet, eine größere Dosis Silphium zu sich, um ihren Körper dazu zu bringen, das Kind abzuweisen. \n\nDiese Eigenschaften und die Tatsache, dass Silphium nicht angebaut werden kann, da es sich weigert, außerhalb der Grenzen der Kyrenaika zu wachsen, haben Silphium für unsere Wirtschaft so wichtig gemacht, dass die meisten in Kyrenaika geprägten Münzen ein Bild der Pflanze auf einer ihrer Seiten zeigen. \n\nAußerhalb unseres Reiches wird Silphium so stark mit Liebe in Verbindung gebracht, dass die Form der Frucht, die die Silphiumsamen enthält, vielerorts zum anerkannten Symbol der Liebe geworden ist. Anscheinend bezeichnen einige Barbaren, die mit der Pflanze nicht vertraut sind, sie als 'Herzform', obwohl es uns ein Rätsel ist, wie jemand in der Form der Frucht ein menschliches Herz erkennen könnte..."
 cyr_academies_01.8.a: "Apollo hat uns wirklich mit diesem Geschenk gesegnet."
 cyr_academies_01.9.t: "Silphium immer seltener"
 cyr_academies_01.9.desc: "Der Export von #Y Silphium#! bringt unserer Nation großen Reichtum. \n\nIn letzter Zeit ist die Menge des geernteten Silphiums jedoch jedes Jahr zurückgegangen. In gewisser Weise kann dies als Segen betrachtet werden. Die steigende Nachfrage, gepaart mit einem abnehmenden Angebot, hat dazu beigetragen, den Marktwert von Silphium noch weiter zu steigern. Einige sind jedoch besorgt, ob die derzeitige Ausbeutung von Silphium nachhaltig ist …"
 cyr_academies_01.9.a: "Ein Segen für unsere Schatzkammer…"
 cyr_academies_01.10.t: "Silphium ausgestorben"
 cyr_academies_01.10.desc: "Die unkontrollierte Ausbeutung von #Y Silphium#! hat dazu geführt, dass die Pflanzenbestände so weit zurückgegangen sind, dass unsere Sammler mittlerweile Mühe haben, überhaupt noch etwas davon zu finden Für alle praktischen Zwecke ist Silphium bereits ausgestorben. Der Silphium-Handel, der unserem Land einst Wohlstand bescherte, ist vollständig versiegt, und unsere Kaufleute haben nun Schwierigkeiten, sich in Wirtschaftszweigen zu etablieren, in denen ihre ausländischen Konkurrenten einen natürlichen Vorteil haben. Es versteht sich von selbst, dass dies eine Katastrophe ist – ein Schlag für unsere Wirtschaft, von dem wir uns vielleicht nie ganz erholen werden. Hätten wir doch nur Maßnahmen ergriffen, als noch Zeit war…\n\n Ein letzter Silphiumhalm – der einzige, der dieses Jahr geerntet wurde – wurde getrocknet, konserviert und [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] geschenkt, der plant, ihn als Kuriosum zu behalten – der letzte Überrest des Geschenks von Apollo, das [SCOPE.GetRootScope.GetCountry.GetName] einst im gesamten Mittelmeerraum berühmt machte."
 cyr_academies_01.10.a: "Unsere Wirtschaft liegt in Trümmern!"
 cyr_academies_01.11.t: "Silphium-Ausbeutung stabilisiert"
 cyr_academies_01.11.desc: "Dank des rechtzeitigen Eingreifens unserer Regierung konnte die Ernte von #Y Silphium#! auf einem nachhaltigen Niveau stabilisiert werden. \n\nWährend die aktuelle Exportrate im Vergleich zu dem phänomenalen Reichtum, den der Silphiumhandel unserem Land einst einbrachte, ein Rückschritt ist, garantiert sie zumindest, dass die Menschen von [SCOPE.GetRootScope.GetCountry.GetName] in der Lage sein werden, von dem Geschenk von Apollo für kommende Generationen zu profitieren."
 cyr_academies_01.11.a: "Ein unvermeidliches Opfer."
 cyr_academies_01.9.a.tt: "#Y Mehrere neue Entscheidungen sind verfügbar geworden.#!"
 cyr_academies_01.10.a.tt: "[SCOPE.GetRootScope.GetCountry.GetName] #R verliert die Effekte#! von #Y $cyr_new_export_markets$#!, #Y $cyr_silphium_medicine$#!, #Y $cyr_silphium_cuisine$#!, #Y $cyr_silphium_economy$#! und #Y $cyr_silphium_scarce$#!. \n \n#Y $cyr_silphium_settlement$#! und #Y $cyr_silphium_trade_hub$#! werden #R aus allen Territorien entfernt.#!"
 cyr_academies_01.10.a.ttt: "\n"
 cyr_intoegypt_01.1.t: "Kyrenaikische Siedler für Marmarica"
 cyr_intoegypt_01.1.desc: "Eine Gruppe entrechteter Kyrenaiker hat uns um Unterstützung bei der Gründung einer Kolonie in der [cyr_egypt_scope.GetAdjective] kontrollierten [GetProvince('(int32)3373').GetArea.GetName] gebeten. Das würde natürlich bedeuten, dass wir einen Teil unserer eigenen Untertanen aufgeben müssten, aber dieses Opfer könnte es wert sein, um unseren Anspruch auf [GetProvince('(int32)3373').GetArea.GetName] zu stärken."
 cyr_intoegypt_01.1.a: "Sie sind frei zu gehen"
 cyr_intoegypt_01.1.b: "Wir werden unser Volk nicht in die Arme Ägyptens schicken"
 cyr_intoegypt_01.1.a.tt: "Das wird unseren Anspruch auf die östliche Kyrenaika #G stärken#!."
 cyr_intoegypt_01.2.t: "Libysche Unterstützung in Marmarica"
 cyr_intoegypt_01.2.desc: "Einige unserer libyschen Untertanen haben historische Verbindungen zum östlichen [GetProvince('(int32)3373').GetArea.GetName] und wären bereit, Unterstützung für uns unter der lokalen libyschen Bevölkerung zu gewinnen. Alles, was sie als Gegenleistung verlangen, sind Mittel, um angemessene Geschenke für die örtlichen Würdenträger zu kaufen."
 cyr_intoegypt_01.2.a: "Sie haben unsere volle Unterstützung"
 cyr_intoegypt_01.2.b: "Wir brauchen keine Verbündeten unter den Barbaren"
 cyr_intoegypt_01.3.t: "Ansprüche auf Marmarica- Erfolg"
 cyr_intoegypt_01.3.desc: "Während der größte Teil von [GetProvince('(int32)3373').GetArea.GetName] unter [cyr_egypt_scope.GetAdjective]er Herrschaft bleibt, haben unsere jüngsten Aktivitäten uns genug Unterstützung in der Region gegeben, um die Integration der Region erheblich zu erleichtern, falls wir uns entscheiden sollten, unseren Anspruch auf die Region durchzusetzen."
 cyr_intoegypt_01.3.a: "Gut"
 cyr_intoegypt_01.4.t: "Ansprüche auf Marmarica - Scheitern"
 cyr_intoegypt_01.4.desc: "Leider konnten wir die Kontrolle von [cyr_egypt_scope.GetName] über [GetProvince('(int32)3373').GetArea.GetName] nicht anfechten. Wir werden einen Anspruch auf herkömmliche Weise fingieren müssen.
 cyr_intoegypt_01.4.a: "Unglücklich"
 cyr_intoegypt_01.5.t: "Ptolemaios' Traum zerplatzt"
 cyr_intoegypt_01.5.desc: "Unsere kürzliche Eroberung von [GetProvince('(int32)516').GetArea.GetRegion.GetName] hat das [cyr_egypt_scope.GetAdjective]e Königreich in zwei Teile geteilt. Unfähig, die Kontrolle über ihr geteiltes Reich zu behalten, haben sich die Erben von [GetCharacter('(int32)42').GetName] in ihre nördlichen Besitzungen rund um die Mittelmeerküste zurückgezogen. \n \nOhne eine zentrale Herrschaft wurde der Rest ihres Reiches zwischen lokalen Kriegsherren aufgeteilt, die untereinander um die zerbrochenen Überreste des einst großen Imperiums von [GetCharacter('(int32)42').GetFirstName] kämpfen."
 cyr_intoegypt_01.5.a: "Das Vermächtnis von [GetCharacter('(int32)42').GetFirstName] liegt in Trümmern."
 cyr_intoegypt_01.6.t: "Pharaonische Krönung"
 cyr_intoegypt_01.6.desc: "Heute wurde [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] vom Hohepriester des Ammun zum Pharao von Unterägypten gekrönt. Obwohl viele in Südägypten die Legitimität dieses Titels bestreiten, steht außer Frage, dass die Eliten Unterägyptens uns zumindest als Verfechter der ägyptischen Traditionen ansehen. Dies sollte es wesentlich einfacher machen, ihre Unterstützung bei der Verwaltung unserer ägyptischen Besitztümer zu gewinnen."
 cyr_intoegypt_01.6.a: "Ägyptischen Traditionen folgen!"
 cyr_intoegypt_01.6.b: "Wir brauchen ihre dummen Traditionen nicht!"
 cyr_intoegypt_01.7.t: "Ptolemaios' Traum zerplatzt"
 cyr_intoegypt_01.7.desc: "Unsere kürzliche Eroberung von [GetProvince('(int32)516').GetArea.GetRegion.GetName] hat das [cyr_egypt_scope.GetAdjective]e Königreich in zwei Teile geteilt. Unfähig, die Kontrolle über ihr geteiltes Reich zu behalten, haben sich die Erben von [GetCharacter('(int32)42').GetName] in ihre südlichen Besitzungen entlang des Nils zurückgezogen. \n\nOhne eine zentrale Herrschaft wurde der Rest ihres Reiches zwischen lokalen Kriegsherren aufgeteilt, die nun untereinander um die zerbrochenen Überreste von [GetCharacter('(int32)42').GetFirstName]s einst großem Imperium kämpfen."
 cyr_intoegypt_01.7.a: "[GetCharacter('(int32)42').GetFirstName]s Vermächtnis liegt in Trümmern."
 cyr_intoegypt_01.8.t: "Sitz der Macht"  
 cyr_intoegypt_01.8.desc: "Mit der Eroberung Ägyptens und der Übernahme der pharaonischen Traditionen durch unseren Herrscher müssen wir entscheiden, wie sehr wir uns unserem ägyptischen Land verpflichtet fühlen. Es versteht sich von selbst, dass es von dort aus viel einfacher sein wird, die Ägypter zu regieren."  
 cyr_intoegypt_01.8.a: "Die Stadt Alexander wird uns gute Dienste leisten."  
 cyr_intoegypt_01.8.b: "Memphis wird den Kemeten gefallen."  
 cyr_intoegypt_01.8.c: "Oberägypten wird unterschätzt."  
 cyr_intoegypt_01.8.d: "Wir können unsere Wurzeln nicht aufgeben."  
 cyr_intoegypt_01.8.a.tt: "Jede Provinz in Unterägypten wird 10 Jahre lang #G 10 % an Bevölkerungszufriedenheit#! gewinnen." 
