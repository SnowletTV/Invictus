 cyrene_1_reform: "Politik der Pentapolis"
 cyrene_1_reform_DESCRIPTION: "Nachdem den griechischen Städten der Kyrenaika jahrhundertelang ihre Herrscher von fernen Königen aufgezwungen worden waren, haben sie nun endlich wieder einen eigenen König. Allerdings sind die neuen Monarchen der Kyrenaika selbst Fremde, die den Thron von Kyrene mit Hilfe ihrer makedonischen Armee bestiegen haben. In den Augen vieler Kyrenaiker unterscheiden sie sich dadurch kaum von der Reihe fremder Herrscher, die vor ihnen regierten.\n\nWenn die derzeitigen Herrscher ihre Macht behalten wollen, müssen sie ihre Herrschaft in den Augen ihrer Bürger legitimieren – entweder indem sie lokale Bräuche übernehmen und an die Erinnerungen an das vorpersische Königreich Kyrenaika anknüpfen oder indem sie sich als hellenistische Könige nach dem Vorbild der Seleukiden und Ptolemäer etablieren. Andernfalls könnten sie schon bald durch eine inklusivere Regierungsform abgelöst werden."
 cyrene_1_reform_CRITERIA_DESCRIPTION: "Diese Mission gilt als abgeschlossen, wenn die Kyrenaika ihre Regierungsphilosophie reformiert hat."
 cyrene_1_reform_BUTTON_TOOLTIP: "Die Regierung von Kyrenaika reformieren"
 cyrene_1_reform_BUTTON_DETAILS: ""
 cyrene_1_reform_task_1: "Der Beginn eines neuen Zeitalters"
 cyrene_1_reform_task_1_DESC: "Das erste Königreich Kyrenaika, das von Battos I. und seinem theranischen Kolonisten gegründet wurde, endete, als es sich selbst darüber zerriss, wie viel Macht die königliche Familie ausüben sollte. Jetzt, da eine neue Dynastie den Platz der Battiaden eingenommen hat, steht die Kyrenaika erneut an einem Scheideweg: Werden die [SCOPE.GetRootScope.GetCountry.GetRuler.GetFamily.GetName]en ihre Macht festigen und als absolute Könige herrschen, oder werden sie sich das Vertrauen ihrer Untertanen sichern, indem sie einen Teil ihrer Macht mit ihren Untergebenen teilen? Wenn sie sich sogar komplett ersetzt sehen könnten..."
 cyrene_1_reform_task_2: "Reise durch die fünf Städte"
 cyrene_1_reform_task_2_DESC: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] mag [SCOPE.GetRootScope.GetCountry.GetRuler.Custom('get_DieDer')] unbestrittene Herrscher[SCOPE.GetRootScope.GetCountry.GetRuler.Custom('get_inFemale')] der Kyrenaika sein, aber viele der Bewohner wissen nicht viel mehr über [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] als den Namen. Eine ausgedehnte Reise durch die Landschaft der Kyrenaika könnte dafür sorgen, dass die Untertanen [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] als den wahren König erkennen."
 cyrene_1_reform_task_3: "Die letzten Battiaden"
 cyrene_1_reform_task_3_DESC: "Vor mehr als 300 Jahren führte Battos I. eine Siedlergruppe von der Ägäisinsel [GetProvince('(int32)454').GetName] an die Küste Libyens, wo sie die Stadt [GetProvince('(int32)3360').GetName] gründeten. Battos wurde der erste König der Kyrenaika, und die von ihm gegründete Dynastie der Battiaden regierte zwei Jahrhunderte lang weiter, bevor sie einer Kombination aus internen Unruhen und persischem Expansionismus erlag. Obwohl die Battiaden das Königtum verloren haben, bekleiden viele ihrer Nachkommen weiterhin wichtige Positionen ..."
 cyrene_1_reform_task_4: "Lokale Versammlungen stärken"
 cyrene_1_reform_task_4_DESC: "Jede Stadt in der Kyrenaika hat ihre eigene lokale Versammlung, die über Angelegenheiten entscheidet, die zu unwichtig – oder zu dringend – sind, um sie dem König vorzulegen. Viele in der Kyrenaika fordern, dass die Befugnisse dieser Versammlungen erweitert und formalisiert werden. Dies könnte jedoch einen sehr gefährlichen Präzedenzfall schaffen ..."
 cyrene_1_reform_task_5: "Die drei Stämme der Kyrenaika"
 cyrene_1_reform_task_5_DESC: "Vor langer Zeit unterteilte der griechische Gesetzgeber Demonax die Bürger der Kyrenaika in drei Stämme: Griechen von der Insel Thera, Griechen von der Peloponnes und Kreta sowie Griechen von den anderen Ägäischen Inseln. Damals trug dies wirksam dazu bei, die Unruhen zu unterdrücken, die die Kyrenaika erfasst hatten. Eine Wiederbelebung dieser alten Regelung könnte uns helfen, die vielfältigen Bevölkerungsgruppen innerhalb unserer Grenzen besser zu organisieren."
 cyrene_1_reform_task_6: "Die Pentapolis verschönern"
 cyrene_1_reform_task_6_DESC: "Kyrenaika ist berühmt für seine fünf Städte: Kyrene, Barke, Taucheira, Euesperides und Apollonia. Da Kyrene der Sitz der kyrenaischen Monarchie ist, wurden die anderen vier Städte zeitweise etwas vernachlässigt. Eine große Investition in diese Städte würde als deutliches Zeichen des königlichen Wohlwollens angesehen, obwohl es bedeuten würde, dass beträchtliche Ressourcen an Orten eingesetzt werden, die nicht direkt unter königlicher Kontrolle stehen."
 cyrene_1_reform_task_7: "Königliche Prägestätten"
 cyrene_1_reform_task_7_DESC: "Es ist Tradition, dass Könige nach der Thronbesteigung damit beginnen, Münzen mit ihrem Bildnis zu prägen. Dies erschwert nicht nur das Fälschen der Münzen, sondern erfüllt auch die sehr wichtige Funktion, den König im Alltag seiner Untertanen präsent erscheinen zu lassen."
 cyrene_1_reform_task_8: "Die Königsstadt ausbauen"
 cyrene_1_reform_task_8_DESC: "[GetProvince('(int32)3360').GetName] ist die älteste Stadt der Kyrenaika und war lange Zeit das Zentrum der königlichen Macht in der Kyrenaika. Dies hat [GetProvince('(int32)3360').GetName] praktisch zum Synonym für die Macht des Königs gemacht. Eine Reihe großartiger Bauprojekte in [GetProvince('(int32)3360').GetName] würde direkt auf die Pracht der Monarchie rückwirken."
 cyrene_1_reform_task_9: "Eine Machtbasis an der Küste"
 cyrene_1_reform_task_9_DESC: "Die Autorität der neuen hellenistischen Herrscher von [GetProvince('(int32)3360').GetName] ist am stärksten entlang der Küste, wo Schiffe die Kyrenaika mit der griechischen Heimat verbinden können. Einige der traditionellen Machtzentren der Kyrenaika liegen jedoch weit entfernt von der Küste auf dem fruchtbaren Plateau, das an die libysche Wüste grenzt. Eine Reihe neuer Städte könnte das wirtschaftliche Zentrum der Kyrenaika näher an die Küste bringen, wo es für uns leichter zu kontrollieren wäre."
 cyrene_1_reform_task_10: "Eine königliche Armee bilden"
 cyrene_1_reform_task_10_DESC: "Alexanders Nachfolger regieren durch die Autorität ihrer persönlichen Armeen. Wenn [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] eine eigene persönliche Armee hätte, wäre es für andere erheblich schwieriger, seine Autorität herauszufordern."
 cyrene_1_reform_task_11: "Die fremden Könige vertreiben"
 cyrene_1_reform_task_11_DESC: "Die Zeit der Könige und Tyrannen ist vorbei. Die Kyrenaika wird die Fesseln der Monarchie abwerfen und die Macht an ihre Bürger zurückgeben! ... Zumindest für diejenigen, die es wert sind, es zu führen."
 cyrene_1_reform_task_12: "Demonax' Vision"
 cyrene_1_reform_task_12_DESC: "In den letzten Tagen des ersten Königreichs von Kyrenaika verfasste der große Gesetzgeber Demonax eine Verfassung für Kyrenaika. Unter Demonax’ Herrschaft wurde die Macht der Monarchie so stark eingeschränkt, dass der König kaum mehr als eine Galionsfigur war. Demonax hatte ganz offensichtlich die richtige Idee – es ist an der Zeit, dass wir seine Verfassung wieder in Kraft setzen."
 cyrene_1_reform_task_13: "Das erneuerte Königreich"
 cyrene_1_reform_task_13_DESC: "Hundert Jahre lang herrschten die Könige von Kyrenaika mit absoluter Macht, und solange dies der Fall war, blieb Kyrenaika stark und unabhängig. Erst nachdem der fünfte König, Battos III, einen Großteil seiner Macht an seine Untergebenen abgetreten hatte, wurde das Königreich von inneren Unruhen heimgesucht, was schließlich zu seiner Annexion durch die Perser führte. Wir werden die Fehler von Battos III nicht wiederholen, der König von Kyrenaika muss mit absoluter Macht regieren!"
 cyrene_1_reform_task_14: "Ein Diadochenkönig"
 cyrene_1_reform_task_14_DESC: "Während [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] über Kyrenaika herrschen mag, ist er in erster Linie einer von Alexanders Nachfolgern. Die Kyrenaika wird die Machtbasis sein, von der aus [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] sich seinen Anteil an Alexanders großem Reich sichern wird."
 cyrene_1_reform_task_final_democracy: "Freiheit gesichert"
 cyrene_1_reform_task_final_democracy_DESC: "Nachdem die Rechte der Bürger der Kyrenaika gesichert und die Macht der Monarchie beschnitten wurde, ist die Kyrenaika zu einem Musterstaat geworden, dem andere freiheitsliebende Staaten folgen können."
 cyrene_1_reform_task_final_authocracy: "Königliche Rechte bewahrt"
 cyrene_1_reform_task_final_authocracy_DESC: "Alle abweichenden Stimmen wurden zum Schweigen gebracht, und die Macht des Königs wurde eindrucksvoll unter Beweis gestellt. Die Autorität von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] und seiner königlichen Dynastie steht jetzt außer Frage."
 cyrene_1_reform_task_3.tt: "Alle besessenen Provinzen in der Region #Y Kyrenaika#! erhalten #Y lokale Versammlungen#!."
 cyrene_1_reform_task_5.tt: "Jede andere fremde Kultur in der #Y hellenistischen Kulturgruppe#! erhält #Y $cyr_three_tribes$#!. \n\n"
