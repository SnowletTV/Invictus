l_german:
  
 # Events #Autotranslate V1.11.0.2 - Tayuan (Done 23.07.2026) #Kyrenaikische vs kyrenäische Schule
  
 cyr_magas_01.1.t: "Ein neuer Statthalter für Kyrenaika"
 cyr_magas_01.1.desc: "Die griechischen Kolonien der Kyrenaika, die früher Teil des ptolemäischen Ägyptens waren, befinden sich in Verwirrung, seit der frühere ptolemäische Statthalter während einer gescheiterten Invasion in Karthago im Jahr 444 AUC (309 v.Chr.) von seinen syrakusanischen Verbündeten getötet wurde. Da ein neuer offizieller Statthalter noch nicht ernannt wurde, behält eine Gruppe lokaler griechischer Eliten derzeit die Kontrolle über das Land. \n\nVorerst ist der Blick unserer ägyptischen Oberherren fest auf ihre Rivalen im Osten gerichtet, aber es ist nur eine Frage der Zeit, bis die Ptolemäer einen neuen Statthalter für unsere Region ernennen werden. Und sobald sie das tun, werden sie wahrscheinlich eine engere Integration mit Ägypten fordern. \n\nVielleicht könnten wir Ägypten unserer fortgesetzten Loyalität versichern, indem wir uns an sie wenden, um einen neuen Statthalter zu fordern, bevor sie eine Entscheidung in dieser Angelegenheit treffen. Dies könnte uns auch ermöglichen, ein größeres Maß an Unabhängigkeit zu bewahren als andere ägyptische Holdings …"
 cyr_magas_01.1.a: "Entsendet die Botschafter."
 cyr_magas_01.2.t: "Magas von Kyrene"
 cyr_magas_01.2.desc: "Endlich ist ein geeigneter Kandidat für das Amt des Statthalters der Kyrenaika gefunden: [GetCharacter('(int32)46').GetFullName], der Stiefsohn von [GetCharacter('(int32)42').GetFullName] selbst. \n\nMagas' Vater Philip war ein versierter Kommandant in Alexanders Armee und diente in der Armee des großen Eroberers von den ersten Streifzügen nach Persisch-Anatolien bis zur Invasion der fernen Länder des Indus-Tals. \n\nNoch wichtiger ist jedoch, dass seine Mutter [GetCharacter('(int32)18').GetFullName] kürzlich den ägyptischen König [GetCharacter('(int32)42').GetFullName] geheiratet hat, und ihr Sohn [GetCharacter('(int32)45').GetFullName] - Magas' Halbbruder - obwohl er noch jung ist, gilt bereits als wahrscheinlicher Nachfolger auf dem ägyptischen Thron. Berenike selbst ist die Grand-Nice des ehemaligen mazedonischen Regenten [GetCharacter('(int32)9').GetFullName] und eine entfernte Verwandte von Alexander dem Großen, was sie schon vor ihrer Heirat mit Ptolemaios zu einer Frau von außergewöhnlich hohem Status macht. \n\nZwischen den militärischen Talenten seines Vaters und dem Erbe und den politischen Verbindungen seiner Mutter wird Magas der Kyrenaika erlauben, eine wichtige Rolle in den Kriegen um Alexanders Erbe zu spielen."
 cyr_magas_01.2.a: "Kyrenaika hat einen neuen Statthalter"
 cyr_magas_01.3.t: "Ägyptische Bindungen"
 cyr_magas_01.3.desc: "#R VERALTET. WENN SIE DIES SEHEN, IST ETWAS ERNSTHAFT FALSCH GELAUFEN #! Mit unserem gewählten Statthalter auf dem Thron genießt die Kyrenaika erheblich mehr lokale Autonomie als die anderen Untertanen Ägyptens. Ein solches System ist jedoch von Natur aus zerbrechlich. Wenn das Bündnis zwischen Kyrenaika und Ägypten irgendwann gebrochen wird, wird Ägypten wahrscheinlich mit einer sofortigen Kriegserklärung reagieren."
 cyr_magas_01.3.a: "Der Preis der ägyptischen Oberherrschaft ist beträchtlich …"
 independent_egyptian_subject: "Ägyptische Bindungen"
 desc_independent_egyptian_subject: "Obwohl wir ein größeres Maß an Unabhängigkeit genießen als die meisten ägyptischen Untertanen, sind wir formell immer noch Teil des Königreichs Ägypten. Bis wir unsere Verbindungen zu Ägypten abbrechen, wird unsere Fähigkeit, unabhängig zu handeln, begrenzt bleiben."
 cyr_magas_01.4.t: "Ägyptische Bindungen gebrochen"
 cyr_magas_01.4.desc: "#R VERALTET. WENN SIE DIES SEHEN, IST ETWAS ERNSTHAFT FALSCH GELAUFEN #! Ob durch unser eigenes Handeln oder durch ihr Handeln, die Bande zwischen Ägypten und der Kyrenaika wurden zerrissen. Kyrenaikas Angelegenheiten sind jetzt ihre eigenen, aber ihre ehemaligen ägyptischen Oberherren werden dies wahrscheinlich nicht unbestritten lassen."
 cyr_magas_01.4.a: "Ägypten erklärt der Kyrenaika den Krieg"
 cyr_magas_01.5.t: "Ägypten fordert Tribut"
 cyr_magas_01.5.desc: "#R VERALTET. WENN SIE DIES SEHEN, IST ETWAS ERNSTHAFT FALSCH GELAUFEN #! Es ist an der Zeit, unseren Oberherren in Ägypten unseren regelmäßigen Tribut zu zollen. Die Ägypter verlangen Nahrung, Gold und Soldaten für ihre Armeen."
 cyr_magas_01.5.a: "Wir haben keine Wahl…"
 cyr_magas_01.5.b: "Nicht mehr; Es ist an der Zeit, für wahre Unabhängigkeit zu kämpfen"
 cyr_magas_01.6.t: "Sich nähernd [magas_diplomacy_scope.GetName]"
 cyr_magas_01.6.desc: "Unsere Abgesandten sind am Hof angekommen. Sie werden nun versuchen, [magas_diplomacy_scope.GetAdjective] davon zu überzeugen, dass jeder Verlust für [magas_diplomacy_scope.GetRuler.GetName] ein Gewinn für das [GetCountry('EGY').GetName] ist. Obwohl natürlich ein paar großzügige Geschenke an den richtigen Stellen dazu beitragen können, den Prozess einfacher zu gestalten …"
 cyr_magas_01.6.a: "Moment, wir brauchen ihre Hilfe doch nicht"
 cyr_magas_01.6.b: "Versuchen Sie, sie von unserer Notlage zu überzeugen"
 cyr_magas_01.6.c: "Nichts ist überzeugender als Gold"
 cyr_magas_01.7.t: "Königliche Hochzeit mit [cyr_royal_marriage_country.GetName]"
 cyr_magas_01.7.desc: "Dank der unermüdlichen Arbeit unserer Gesandten konnten wir eine Hochzeit zwischen unserem Herrscher [GetCountry('CYR').GetRuler.GetName] und einer jungen Adligen aus der Familie [cyr_royal_marriage_country.GetRuler.GetFamily.GetName] arrangieren. Hoffentlich garantiert dies [cyr_royal_marriage_country.GetAdjective]e Unterstützung, falls die Ägypter uns wegen unseres Wunsches nach Unabhängigkeit herausfordern sollten."
 cyr_magas_01.7.a: "Arrangieren Sie eine große Hochzeit!"
 cyr_magas_01.8.t: "Magas indische Verbindungen"
 cyr_magas_01.8.desc: "Der Vater von [GetCharacter('(int32)46').GetFullName] war einer der Kommandeure während Alexanders Invasion in Indien. Von ihm und seinen vielen Gefährten hat Magas ein starkes Interesse an den Ländern des Fernen Ostens geerbt. Jetzt sind Abgesandte des größten Herrschers Indiens [GetCountry('MRY').GetRuler.GetName] an unserem Hof eingetroffen. Neben Geschenken und Handelsangeboten bringen sie Wissen über fremde Medizin und die Kunde eines fremden neuen Glaubens mit."
 cyr_magas_01.8.aa: "Lasst uns diese Verbindung ausloten und unsere eigenen Gesandten zurückschicken."  
 cyr_magas_01.8.a.tt: "In ein paar Jahren werden die Abgesandten zurückkommen."  
 cyr_magas_01.8.bb: "Dankt ihnen für die Geschenke und verabschiedet sie."  
 cyr_magas_01.8.a: "Die Fremden sollen uns helfen, unser Verständnis der Kräuterkunde zu vertiefen."
 cyr_magas_01.8.b: "Ihre Philosophie, wenn auch seltsam, wird unsere lokalen Akademien bereichern."
 cyr_magas_01.8.c: "Die Fremden haben Recht, wir müssen ihre Lebensweise übernehmen!"
 cyr_magas_01.8.b.tt: "5% der Bevölkerung von Kyrene können zum Buddhismus konvertieren."
 cyr_magas_01.8.c.tt: "10 % der Bevölkerung von Kyrene können zum Buddhismus konvertieren."
 cyr_magas_01.8.b.ttt: "Ein außergewöhnlich talentierter Philosoph wird sich unserem Hof anschließen."
 cyr_magas_01.9.t: "Unabhängigkeitskrieg gegen Ägypten"
 cyr_magas_01.9.desc: "Wir haben [GetCountry('EGY').GetRuler.GetName] informiert, dass die Städte der Kyrenaika die regulären Tribute, die sie den Ägyptern zahlen, einstellen werden. Unnötig zu erwähnen, dass er die Nachricht nicht gut aufgenommen hat. Unsere Abgesandten wurden hingerichtet, und Gerüchte besagen, dass eine Armee aufgestellt wird, um „die cyrenaikanische Rebellion zu bekämpfen“, während wir hier sprechen."
 cyr_magas_01.9.a: "Das Schicksal der Kyrenaika steht auf dem Spiel …"
 cyr_magas_01.10.t: "Suche nach Verbündeten"
 cyr_magas_01.10.desc: " Die [GetCountry('EGY').GetAdjective]e Oberherrschaft war lange Zeit eine schwere Last auf den Schultern der Kyrenaika. Jetzt, da die dynastischen Bande zwischen [GetCountry('CYR').GetRuler.GetName] und den [GetCountry('EGY').GetRuler.GetFamily.GetName] Herrschern Ägyptens zerbrochen sind, werden die Rufe nach Unabhängigkeit von Tag zu Tag lauter. \n\n Alleine hat die Kyrenaika jedoch kaum eine Chance auf den Sieg. Wir sollten versuchen, einen der vielen Rivalen Ägyptens davon zu überzeugen, unser Streben nach Unabhängigkeit zu unterstützen."
 cyr_magas_01.10.a: "Schicken Sie Abgesandte zu jeder Großmacht in der hellenischen Welt!"
 cyr_magas_01.11.t: "König von Kyrene"
 cyr_magas_01.11.desc: "Heute wurde [GetCountry('CYR').GetRuler.GetName] in einer großen Zeremonie im großen Tempel in Kyrene zum König von Kyrenaika gekrönt. Unter dem Jubel der Menge wurde ihm vom Hohepriester ein goldenes Stirnband aufgesetzt, und Würdenträger aus allen Städten der Kyrenaika wurden vor ihn geführt,um ihm Geschenke zu überreichen und ihm Treue zu schwören. \n\n Es werden bereits neue Münzen geprägt mit dem Titel [GetCountry('CYR').GetRuler.GetName], König von Kyrene und allen Städten der Pentapolis versehen sind. Vergessen ist das Joch der persischen und ägyptischen Herrschaft. Zum ersten Mal seit dem Tod von Arcesilaus IV. im Jahr 313 AUC (440 v. Chr.) sitzt ein wahrer König auf dem Thron der Kyrenaika."
 cyr_magas_01.11.a: "Lang lebe das Königreich Kyrenaika!"
 cyr_magas_01.12.t: "Der Todesverführer"
 cyr_magas_01.12.desc: "Beeinflusst von den Lehren buddhistischer Missionare hat [death_persuader.GetName], ein prominenter Philosoph der kyrenäischen Schule, eine besonders radikale Form der kyrenäischen Philosophie hervorgebracht. Wie andere kyrenäische Philosophen glaubt er, dass das Erreichen von Glück der einzige Zweck des Lebens ist und dass alles, was nicht zu größerem Glück führt, grundsätzlich bedeutungslos ist. [death_persuader.GetName] geht jedoch noch weiter, indem er argumentiert, dass wahres Glück im Leben unerreichbar ist und dass das Leben selbst daher bedeutungslos ist – und geht sogar so weit zu behaupten, dass „dem Weisen Leben und Tod gleichgültig sind“. \n \n[death_persuader.GetName] hat seine Lehren in einem Buch mit dem Titel „Tod durch Hunger“ zusammengefasst. Gerüchten zufolge wurden Hunderte, die das Buch gelesen haben, davon überzeugt, sich das Leben zu nehmen, anstatt weiterhin die Qualen des Daseins zu erleiden. Daraus leitet sich der Name ab, unter dem [death_persuader.GetName] berüchtigt geworden ist: „Peisithanatos“, „der Todesverführer“. \n \n Während einige dieser Behauptungen sicherlich übertrieben sind, besteht kein Zweifel daran, dass „Tod durch Hunger“ zu den größten philosophischen Werken der heutigen Generation gehört."
 cyr_magas_01.12.a: "Es gehört in eine Bibliothek!"
 cyr_magas_01.121.t: "Abgesandte kehren zurück"  
 cyr_magas_01.121.desc: "Es scheint, dass die Expedition unserer Gesandten nach Indien zu Ende gegangen ist und sie zurückgekehrt sind. Nun, mit weiteren indischen Geschenken und neuem Wissen, bleibt nur noch eine Frage offen: Wie gut werden wir das Gelernte nutzen können?"  
 cyr_magas_01.121.c: "Der Jainismus scheint am besten mit unseren Werten vereinbar zu sein."  
 cyr_magas_01.121.c.tt: "10 % der Bevölkerung von Kyrene könnten zum Jainismus konvertieren"  
 cyr_magas_01.13.t: "Die Libyer"
 cyr_magas_01.13.desc: "Die Libyer haben [GetProvince('(int32)3365').GetArea.GetName] schon lange vor der Ankunft der ersten griechischen Siedler bewohnt. Traditionell haben die Libyer einen nomadischen Lebensstil geführt und Ziegen, Schafe und andere Tiere gehütet. Seit der Ankunft der Kyrenaika-Griechen haben sich viele der nördlichen Libyer in der Nähe der griechischen Städte niedergelassen und leben ähnlich wie ihre neuen Nachbarn. Die Libyer des Südens haben jedoch ihren traditionellen nomadischen Lebensstil bewahrt und ziehen entlang der Karawanenrouten von Oase zu Oase. \n \nAls die ersten griechischen Siedler in [GetProvince('(int32)3365').GetArea.GetName] ankamen, waren die Beziehungen zu den einheimischen Libyern zunächst bemerkenswert eng. Nachdem sich die Griechen ursprünglich in [GetProvince('(int32)3365').GetName] niedergelassen hatten, war es eine Gruppe einheimischer Libyer, die den aktuellen Standort von [GetProvince('(int32)3360').GetName] als einen besseren Ort für die Gründung einer Stadt vorschlugen. Die Griechen ihrerseits wählten die legendäre griechische Jägerin $omen_cyre$ zur Schutzgottheit ihrer Stadt (neben $omen_apollo$, deren Orakel sie zur Kyrenaika geführt hatte). Mischehen zwischen Libyern und Griechen waren üblich, und viele libysche religiöse und kulturelle Praktiken wurden in die Kyrenaikanische Kultur integriert - in erster Linie die Verehrung des libyschen widderköpfigen Gottes $omen_ammon$. Nirgendwo ist diese kulturelle Vermischung deutlicher als in der zweitgrößten Stadt der Kyrenaika, [GetProvince('(int32)3357').GetName], die von vielen als ebenso libysch wie griechisch angesehen wird. \n \nSeit den frühen Tagen der griechischen Besiedlung haben sich die libysch-griechischen Beziehungen jedoch erheblich verschlechtert. Nomadische libysche Stämme aus dem Süden sind eine ständige Bedrohung für die Städte der Kyrenaika, da sie regelmäßig das Land unterstützen und sich gelegentlich zusammenschließen, um die Städte selbst anzugreifen. Die Beziehungen zu den Nordlibyern, die jetzt eine Minderheit in ihrem eigenen Land sind, sind immer noch relativ gut, aber außerhalb von [GetProvince('(int32)3357').GetName] Mischehen sind selten geworden, und Libyer werden oft an den Rand der Gesellschaft gedrängt. \n \nNichtsdestotrotz bleiben die Libyer eine mächtige Kraft innerhalb von [GetProvince('(int32)3365').GetArea.GetName]. Abhängig von unseren Handlungen könnten sie ein mächtiger Verbündeter oder ein mächtiger Feind für die neue Regierung von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] werden."
 cyr_magas_01.13.a: "Wir werden die Versöhnung mit den Libyern suchen"
 cyr_magas_01.13.b: "Die libysche Bedrohung wird niedergeschlagen"
 cyr_magas_01.14.t: "Präventivschläge"
 cyr_magas_01.14.desc: "Um der Bedrohung durch libysche Überfälle auf unser Land entgegenzuwirken, haben wir die Patrouillen am Rande der Wüste intensiviert. Einige besonders wagemutige Kommandeure haben sogar Präventivangriffe auf Gruppen von libyschen Nomaden gestartet, die sie für verdächtig hielten. Dies hat dazu beigetragen, die Zahl der Überfälle auf unser Territorium drastisch zu reduzieren, aber es hat auch viel Feindseligkeit unter den Libyern entlang der Grenze hervorgerufen."
 cyr_magas_01.14.a: "Konzentrieren Sie sich auf die Bewachung der Grenze"
 cyr_magas_01.14.b: "Greift alle Libyer an, die wir finden können"
 cyr_magas_01.15.t: "Der Libyenkrieg"
 cyr_magas_01.15.desc: "Es scheint, dass der anhaltende Konflikt mit den libyschen Ureinwohnern zu einem offenen Krieg eskaliert ist. \n \nNach einer Reihe eskalierender Überfälle und Grenzgefechte haben sich die südlichen Stämme der libyschen Wüste um den charismatischen Anführer des Stammes der Nasamones versammelt. Jetzt stürmt ihr vereintes Heer auf die Städte der Kyrenaika zu, begierig darauf, jede Beute zu nehmen, die sie tragen können, und sie in ihre Wüstenoasen zurückzubringen."
 cyr_magas_01_15_tooltip_1: "Wir werden die barbarische Bedrohung bekämpfen."
 cyr_magas_01.15.a: "Sie müssen aufgehalten werden, bevor sie die wohlhabenden Städte an der Küste erreichen können!"
 cyr_magas_01_15_tooltip_2: "Wir werden die Kyrenaika verlassen und uns nach Libyen wenden."
 cyr_magas_01.15.b: "Es ist an der Zeit, dass sich die Libyer wieder erheben!"
 cyr_magas_01.16.t: "Der Tod des Ptolemäus"
 cyr_magas_01.16.desc: "Nach dem kürzlichen Tod von [GetCharacter('(int32)42').GetName] wird die politische Situation in [GetCountry('EGY').GetName] zunehmend instabil. Dies wäre die perfekte Gelegenheit, um unsere eigenen Ambitionen voranzutreiben, aber es scheint, als hätten wir noch einige interne Probleme, mit denen wir uns befassen müssen …"
 cyr_magas_01.16.a.tt: "Alle nicht abgeschlossenen Missionsaufgaben, die zu „Der Tod des Ptolemäus“ führen, werden umgangen."
 cyr_magas_01.16.b.tt: "Alle unerledigten Aufgaben im libyschen Zweig des Missionsbaums werden umgangen."
 cyr_magas_01.16.c.tt: "Es werden keine Missionsaufgaben umgangen."
 cyr_magas_01.16.a: "Lassen Sie alles andere fallen, jetzt ist es an der Zeit, unseren Zug zu machen."
 cyr_magas_01.16.b: "Die libysche Frage wird zu einem späteren Zeitpunkt behandelt werden müssen."
 cyr_magas_01.16.c: "Wir können es uns leisten, unsere Zeit abzuwarten."
 cyr_magas_01.17.t: "Die Kunst des Krieges"
 cyr_magas_01.17.desc: "[cyr_focus_martial_char_scope.GetOffice] [cyr_focus_martial_char_scope.GetName] ist ein außergewöhnlich talentierter Stratege. In letzter Zeit scheint er begierig darauf zu sein, mehr Zeit mit [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] zu verbringen. Obwohl dies alles nur ein kaum verhüllter Versuch sein könnte, seinen eigenen Einfluss am Hof zu vergrößern, könnte es [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] helfen, sein Verständnis der Kunst der Kriegsführung zu vertiefen …"
 cyr_magas_01.17.a: "Wir sollten mehr Zeit mit [cyr_focus_martial_char_scope.GetName] verbringen."
 cyr_magas_01.17.b: "Eigentlich hatte ich etwas Bestimmtes, worüber ich reden wollte…"
 cyr_magas_01.17.c: "Das ist Zeitverschwendung."
 cyr_magas_01.18.t: "Ausbildung der Bürgeraufgebote in Kyrene"
 cyr_magas_01.18.desc: "Das Rückgrat der Armee jeder griechischen Stadt sind die Bürgeraufgebote, und [GetProvince('(int32)3360').GetName] ist da keine Ausnahme. Es gehört zu den Pflichten von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] als Statthalter, dafür zu sorgen, dass die Abgabe in gutem Zustand und einsatzbereit ist, falls dies erforderlich sein sollte."
 cyr_magas_01.18.a: "Die wöchentliche Aufgebotsausbildung wird von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] persönlich geleitet"
 cyr_magas_01.18.b: "Erweitert die Trainingsfelder, die aktuelle Übungsfläche reicht nicht aus"
 cyr_magas_01.18.c: "Diese Zeit wäre besser damit verbracht, die Hauptbücher zu überprüfen"
 cyr_magas_01.19.t: "Begnadigung der Verbannten"
 cyr_magas_01.19.desc: "Über das Mittelmeer verstreut lebt eine nicht unerhebliche Zahl von Kyrenaika-Verbannten. Die meisten von ihnen sind Menschen, die nach Meinungsverschiedenheiten über die lokale Stadtpolitik aus ihrer Heimatstadt fliehen mussten. Da jedoch viele Exilanten immer noch Verwandte in der Kyrenaika haben, sind Bittsteller, die [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] um Verzeihung bitten, ein alltäglicher Anblick am Hof in [GetProvince('(int32)3360').GetName]. \n \nIm Großen und Ganzen stellen die Verbannten keine Bedrohung für die Autorität von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] dar, aber die Gerichte der Städte der Kyrenaika zu untergraben, indem man im Exil lebende Kriminelle begnadigt, wäre bei der Bürgerschaft nicht beliebt. Andererseits ist die Kyrenaika von vielen mächtigen Rivalen umgeben, und die Vertreibung der eigenen Bürger ist ein Luxus, den sie sich nicht leisten kann."
 cyr_magas_01.19.a: "Massenamnestien für alle außer den gefährlichsten Verbannten, wir brauchen sie hier."
 cyr_magas_01.19.b: "Dies ist nicht die Zeit, unsere Bürger zu verärgern, indem wir ihre Gesetze missachten."
 cyr_magas_01.19.c: "Eigentlich gibt es jemanden, der lieber weit weg von der Kyrenaika wäre…"
  
 cyr_magas_01.20.t: "Libysche Söldner"
 cyr_magas_01.20.desc: "Unsere Bemühungen, Krieger unter den Libyern zu rekrutieren, zeigen Erfolg. Eine kleine Gruppe libyscher Soldaten hat sich um [cyr_libyan_mercs_spawn_province.GetName] versammelt, bereit, ihre Speere zu unserer Sache beizutragen."
 cyr_magas_01.20.a: "Fasst sie zu einer Gruppe von Kriegern zusammen."
 cyr_magas_01.20.b: "Haltet sie bereit, falls wir die Armee verstärken müssen."
  
 cyr_magas_01.21.t: "Bündnis durch Ehe"
 cyr_magas_01.21.desc: "Die Unabhängigkeit der Kyrenaika allein zu sichern, wird sehr schwierig sein, wenn man die Stärke der [GetCountry('EGY').GetAdjective]en Kräfte im Verhältnis zu unseren eigenen bedenkt. Glücklicherweise haben unsere Oberherren viele Feinde, die bereit sein könnten, unsere Sache zu unterstützen. \n \nUm jedoch sicherzustellen, dass unser zukünftiger Verbündeter uns zu gegebener Zeit nicht im Stich lässt, sollten wir darauf bestehen, das Bündnis mit einer königlichen Hochzeit zwischen [GetCountry('CYR').GetRuler.GetName] und einer Prinzessin vom Hof unseres Verbündeten zu besiegeln. \n\nMehrere der hellenischen Großmächte wären vielversprechende Kandidaten für ein solches Bündnis."
 cyr_magas_01.21.a: "Wir wenden uns an [cyr_marriage_country_scope_1.GetName]"
 cyr_magas_01.21.b: "[cyr_marriage_country_scope_2.GetName] wäre ein guter Verbündeter."
 cyr_magas_01.21.c: "Wir versuchen unser Glück mit [cyr_marriage_country_scope_3.GetName]"
 cyr_magas_01.21.d: "[cyr_marriage_country_scope_4.GetName] könnte die sicherste Wahl sein."
 cyr_magas_01.21.e: "Vielleicht hilft uns [cyr_marriage_country_scope_5.GetName]?"
 cyr_magas_01.21.f: "Wir brauchen doch keine Verbündeten."
 cyr_magas_01.22.t: "Eine königliche Ehe"
 cyr_magas_01.22.desc: "Wir wurden von einem Abgesandten des Hofes von [GetCountry('CYR').GetRuler.GetName] in [GetCountry('CYR').GetName] angesprochen. Sie schlagen vor, dass wir eine Allianz gegen unsere gemeinsamen Rivalen in [GetCountry('EGY').GetName] bilden. [GetCountry('CYR').GetName] ist ein wichtiger [GetCountry('EGY').GetAdjective]er Untertan und ihre Unabhängigkeit wäre ein herber Schlag für [GetCountry('EGY').GetName]. \n \nUm jedoch unseren Einsatz für die [GetCountry('CYR').GetAdjective]e Sache sicherzustellen, bittet [GetCountry('CYR').GetRuler.GetName] um die Hand von [cyr_marriage_princess_scope.GetFullName] in der Ehe."
 cyr_magas_01.22.a: "Eine ausgezeichnete Gelegenheit, [GetCountry('EGY').GetName] zu schwächen."
 cyr_magas_01.22.b: "Wir können es uns im Moment nicht leisten, [GetCountry('EGY').GetName] zu verärgern."
 cyr_magas_01.23.t: "Königliche Hochzeit mit [cyr_royal_marriage_country.GetName]"
 cyr_magas_01.23.desc: "Dank der unermüdlichen Arbeit unserer Gesandten konnten wir eine Hochzeit zwischen unserem Herrscher [GetCountry('CYR').GetRuler.GetName] und einer jungen Adligen aus der Familie [cyr_royal_marriage_country.GetRuler.GetFamily.GetName] arrangieren. Hoffentlich garantiert dies [cyr_royal_marriage_country.GetAdjective]e Unterstützung, falls die Ägypter uns wegen unseres Wunsches nach Unabhängigkeit herausfordern sollten."
 cyr_magas_01.23.a: "Arrangieren Sie eine große Hochzeit!"
  
 cyr_magas_01.24.t: "Königliche Hochzeit – Angebot abgelehnt"
 cyr_magas_01.24.desc: "Leider hat [cyr_royal_marriage_country.GetName] unser Allianzangebot abgelehnt. Wir sollten einen der anderen Kandidaten in Betracht ziehen..."
 cyr_magas_01.24.a: "Wir wenden uns an [cyr_marriage_country_scope_1.GetName]"
 cyr_magas_01.24.b: "[cyr_marriage_country_scope_2.GetName] wäre ein guter Verbündeter."
 cyr_magas_01.24.c: "Wir versuchen unser Glück mit [cyr_marriage_country_scope_3.GetName]"
 cyr_magas_01.24.d: "[cyr_marriage_country_scope_4.GetName] könnte die sicherste Wahl sein."
 cyr_magas_01.24.e: "Vielleicht hilft uns [cyr_marriage_country_scope_5.GetName]?"
 cyr_magas_01.24.f: "Wir brauchen doch keine Verbündeten."
 cyr_magas_01.23.a.tt: "[cyr_royal_marriage_country.GetName] wird sich dem Unabhängigkeitskrieg von [GetCountry('CYR').GetName] anschließen, wenn die Zeit gekommen ist."
 cyr_magas_01.25.t: "Die Unterstützung von Berenike"
 cyr_magas_01.25.desc: "Seit [GetCharacter('(int32)18').GetName]s Heirat mit [GetCharacter('(int32)42').GetName] hat sie es sich zur Aufgabe gemacht, dafür zu sorgen, dass ihre Kinder in Machtpositionen gelangen. Daher war es größtenteils ihrer Unterstützung zu verdanken, dass [GetCharacter('(int32)46').GetName] zum Statthalter von [GetCountry('CYR').GetName] ernannt wurde. \n \nDie Unterstützung von [GetCharacter('(int32)18').GetFirstName] ist auch jetzt noch von unschätzbarem Wert. Wir könnten ihre Hilfe bei der Sicherung unserer Kontrolle über Kyrenaika anfordern, aber jetzt wäre auch ein guter Zeitpunkt, unseren eigenen Beitrag zum Wohlergehen der Magiden-Familie zu leisten."
 cyr_magas_01.25.a: "Wir brauchen die finanzielle Unterstützung von [GetCharacter('(int32)18').GetFirstName], um [GetCountry('CYR').GetName] zu kontrollieren"
 cyr_magas_01.25.b: "Vielleicht könnte [GetCharacter('(int32)18').GetFirstName] einigen Verwandten von [GetCharacter('(int32)46').GetFirstName]s Vater schreiben"
 cyr_magas_01.25.c: "Wir werden unseren Teil dazu beitragen, die Familie zu unterstützen"
 cyr_magas_01.25.b.tt: "Mehrere #Y Magiden-Charaktere#! mit #G erhöhter Loyalität#! werden sich Ihrem Hof anschließen."
 cyr_magas_01.26.t: "Der wahre Herrscher der Kyrenaika"
 cyr_magas_01.26.desc: "[GetCountry('CYR').GetRuler.GetName]s Fokus auf [GetCountry('CYR').GetName]s interne Angelegenheiten hat ihn fest als Herrscher des Gebiets etabliert. Obwohl [GetCountry('CYR').GetRuler.GetName] offiziell [GetCountry('EGY').GetName] immer noch Treue schuldet, ist er für viele Einheimische genauso der König von [GetCountry('CYR').GetName] wie [GetCountry('EGY').GetRuler.GetName] im fernen [GetCountry('EGY').GetCapital.GetName]. \n \nEs mag noch der Tag kommen, an dem [GetCountry('CYR').GetName] sich von [GetCountry('EGY').GetAdjective]em Einfluss befreien wird."
 cyr_magas_01.26.a: "Lang lebe [GetCountry('CYR').GetRuler.GetName]"
 cyr_magas_01.30.t: "Marionettenkönig – eine Sache der Regierung"  
 cyr_magas_01.30.desc: "Da [GetCountry('CYR').GetRuler.GetName] noch unter Aufsicht steht, haben wir die einmalige Gelegenheit, eine Verschwörung zu planen, um ihn zu entthronen, oder den Staat zu stärken."  
 cyr_magas_01.30.a: "Sichert die lokale Verwaltungen mit unseren handverlesenen Männern." 
 cyr_magas_01.30.b: "Bauen Sie Vertrauen in den Staatsapparat auf." 
 cyr_magas_01.31.t: "Marionettenkönig - eine Sache des Geldes" 
 cyr_magas_01.31.desc: "Geld regiert alles. Wir müssen uns nur entscheiden, ob wir lieber unsere Verschwörung zur Thronbesteigung oder staatliche Institutionen vorantreiben soll."  
 cyr_magas_01.31.a: "Geld unterschlagen und bezahlen, wen wir können."  
 cyr_magas_01.31.b: "Vertrauen in den Staatsapparat aufbauen."  
 cyr_magas_01.32.t: "Marionettenkönig - eine Sache der Politik" 
 cyr_magas_01.32.desc: "Sollten wir unseren Einfluss zum Wohle des Staates nutzen, indem wir Unterstützung für einen Königsmord sammeln, oder zum Wohle des Staates?"  
 cyr_magas_01.32.a: "Einige Leute dazu zwingen, Unterstützung zu leisten." 
 cyr_magas_01.32.b: "Vertrauen in den Staatsapparat aufbauen." 
 cyr_magas_01.33.t: "Marionettenkönig - das Ende"  
 cyr_magas_01.33.desc: "Wir können jetzt ohne unnötige Ablenkungen regieren" 
 cyr_magas_01.33.a: "Schuld daran ist das Unglück deiner Geburt." 
 cyr_magas_01.33.b: "Wo auch immer du landest, möge es dort immer sonnig sein, Philadelphos." 
 cyr_magas_01.34.t: "Den zu sicherendenden Bereich auswählen"  
 cyr_magas_01.34.desc: "Da wir Truppen in den ptolemäischen Ländern haben, können wir uns lokale Unterstützung für unsere Sache sichern. Das heißt, wenn wir dafür bezahlen können."
 cyr_magas_01.34.a: "[cyr_area_1.GetName] sichern."  
 cyr_magas_01.34.b: "[cyr_area_2.GetName] sichern."  
 cyr_magas_01.34.c: "[cyr_area_3.GetName] sichern."  
 cyr_magas_01.34.d: "Bei näherer Überlegung sollten wir andere Möglichkeiten in Betracht ziehen."
 cyr_magas_01.35.t: "Die Entführung des Philadelphos – Planungsphase"  
 cyr_magas_01.35.desc: "Während wir die Entführung von Ptolemaios Philadelphos planen, bietet sich uns die Gelegenheit, weitere Verbündete für unsere Sache zu gewinnen. Sollen wir sie wahrnehmen?"  
 cyr_magas_01.35.a: "Nutzen wir diese Gelegenheit, um weitere Verbündete zu gewinnen." 
 cyr_magas_01.35.b: "Sich ausschließlich auf die Entführung konzentrieren." 
 cyr_magas_01.36.t: "Entführung von Philadelphos – Ausgang" 
 cyr_magas_01.36.desc: "Ptolemaios Philadelphos befindet sich nun in unserem Gewahrsam." 
 cyr_magas_01.36.a: "Erfolg!"  
 cyr_magas_01.42.t: "Ägyptischer Bürgerkrieg" 
 cyr_magas_01.42.desc: "Wir können den Magiden bei ihrer Eroberung Ägyptens unterstützen, als Gegenleistung dafür, dass sie uns Oberägypten überlassen und unser Tributstaat werden."  
 cyr_magas_01.42.a: "Ein tolles Angebot." 
 cyr_magas_01.42.a.tt: "#R Wir werden uns der Kyrenaika bei ihrem Versuch anschließen, Ägypten zu erobern.#! Im Gegenzug werden sie für einige Jahre unser Tributstaat und treten im Falle eines Sieges im Krieg alle ihre Besitztümer in Oberägypten ab." 
 cyr_magas_01.42.b: "Das wird auf Dauer nur Ärger bringen." 
 cyr_magas_01.43.t: "Ägyptischer Bürgerkrieg"  
 cyr_magas_01.43.desc: "Wir können den Magiden bei ihrer Eroberung Ägyptens helfen – im Gegenzug dafür, dass sie uns ihre asiatischen Besitztümer überlassen und unser Tributstaat werden."  
 cyr_magas_01.43.a: "Auf in den Krieg also."  
 cyr_magas_01.43.a.tt: "#R Wir werden uns der Kyrenaika bei ihrem Versuch anschließen, Ägypten zu erobern.#! Im Gegenzug werden sie für einige Jahre unser Tributstaat und treten im Falle eines Sieges im Krieg alle ihre Besitztümer in Asien ab."  
 cyr_magas_01.43.b: "Da sollten wir uns nicht einmischen." 
 cyr_magas_01.46.t: "Friedensangebot" 
 cyr_magas_01.46.desc: "Kyrenaika gewinnt den Krieg gegen uns, daran besteht kein Zweifel. Aber es scheint, als sei die Eroberung unseres Landes nicht ihr Ziel – zumindest noch nicht –, und sie sind bereit, die Feindseligkeiten gegen eine einmalige Zahlung einzustellen."  
 cyr_magas_01.46.a: "Lieber Gold als Land verlieren."  
 cyr_magas_01.46.b: "Der endgültige Sieg wird unser sein!"  
 cyr_magas_01.46.tt: "Wir unterzeichnen einen #Y weißen Frieden#!, zahlen aber #R 500 Gold#!."  
 cyr_magas_01.48.t: "Neues Ägypten" 
 cyr_magas_01.48.desc: "Als Helios in seinem Sonnenwagen über dem Horizont aufgeht und das Land Ägypten erhellt, kann er nicht umhin, die neuen Herrscher dieses irdischen Reiches zu bemerken, die fest in ihrer Position verankert sind.\nNun stellt sich die Frage: Welche Farben wird die Familie der Magiden auf ihren Bannern tragen?" 
 cyr_magas_01.48.a: "Die ptolemäischen Standarten werden unsere Legitimität unter Beweis stellen."  
 cyr_magas_01.48.b: "Vergessen wir nicht unsere kyrenaiischen Wurzeln." 
 cyr_magas_01.999.t: "Aufstieg des Atreides"
 cyr_magas_01.999.desc: "Ein Mann aus einfachen Verhältnissen, der am Rande der Wüste stationiert war, war vor einiger Zeit verschwunden. Nun ist er zurückgekehrt, begleitet von einer Armee aus Libyern, die sich zunächst unkooperativ zeigten und sich weigerten, sich versklaven zu lassen, ihn nun aber verehren, da er behauptet, ein Nachkomme des mythischen Königs Atreus zu sein, und Anspruch auf das Reich Alexanders erhebt. Uns bleibt kaum eine andere Wahl, als seine Herrschaft zu akzeptieren."  
 cyr_magas_01.999.a: "Wüstenmacht" 
 cyr_magas_01.999.tt: "#T Wir erhalten Ansprüche auf alle von Alexander beanspruchten Gebiete#!, eine Armee aus Kamelkavallerie und die Möglichkeit, #G imperiale Eroberungskriege zu erklären#! – für 30 Jahre." 
  
