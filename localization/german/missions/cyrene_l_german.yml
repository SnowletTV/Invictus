 cyrene_1_academies: "Das Juwel von Libyen"
 cyrene_1_academies_DESCRIPTION: "[GetProvince('(int32)3360').GetName] verdankt seinen Status als eine der größten griechischen Städte hauptsächlich zwei Dingen; der große Menge an Literatur, die von den vielen Intellektuellen der Stadt produziert wurde, und das wertvolle Heilkraut Silphium, das nirgendwo außerhalb der Kyrenaika zu finden ist. \n \nDie wichtigsten unter den Intellektuellen sind die Philosophen der kyrenaikischen Schule. Die Kyrenaiker glauben, dass Vergnügen das höchste Ziel im Leben ist und dass alle Entscheidungen darauf basieren sollten, das Vergnügen zu maximieren und das Leiden zu minimieren. Leider wird die kyrenaikische Schule zunehmend von jüngeren, weiterentwickelten philosophischen Schulen herausgefordert, was zu einer Spaltung der Schule geführt hat, da die jüngste Generation kyrenaikischer Philosophen darüber debattiert, wie darauf zu reagieren sei... \n \nUnterdessen stammt der finanzielle Reichtum von [GetProvince('(int32)3360').GetName] aus dem Export von Silphium. Silphium ist ein äußerst wertvoller Rohstoff, der als Medizin für eine Vielzahl von Erkrankungen sowie als aromatisches Gewürz in der gehobenen Küche Verwendung findet. Seine wichtigste Anwendung ist jedoch die Empfängnisverhütung. Wenn es von Frauen konsumiert wird, bewirkt Silphium, dass der Körper das Kind abstößt, wodurch eine Schwangerschaft je nach Bedarf verhindert oder abgebrochen wird."
 cyrene_1_academies_CRITERIA_DESCRIPTION: "Diese Mission gilt als abgeschlossen, sobald die kyrenaikische Philosophieschule reformiert und der Silphium-Handel ausgeweitet wurde."
 cyrene_1_academies_BUTTON_TOOLTIP: "Fördert die Kyrenaika als Zentrum des Lernens und erweitert die Wirtschaft, indem der Silphium-Handel gefördet wird."
 cyrene_1_academies_BUTTON_DETAILS: ""
 cyrene_1_academies_task_1: "Zentrum des Lernens"
 cyrene_1_academies_task_1_DESC: "[GetProvince('(int32)3360').GetName] ist dank unserer Investitionen als ein Ort bekannt geworden, an dem sich die gelehrten Eliten des Mittelmeerraums versammeln können, an dem sie sich frei austauschen und Ideen teilen können. Es gibt noch viel mehr, was wir tun könnten; durch den Import von Papyrus werden wir sicherstellen, dass die Schreiber, die ohnehin schon bis zur Erschöpfung arbeiten, unsere Bibliotheken weiter ausbauen können."
 cyrene_1_academies_task_2: "Kyrenaikische Philosophie"
 cyrene_1_academies_task_2_DESC: "Unsere Akademien werden zum Gegenstand des Neids der zivilisierten Welt, und viele behaupten sogar, dass wir dabei sind, Athen als Leuchtturm des philosophischen Denkens zu übertreffen – eine Ansicht, der Sie zufällig zustimmen. Wir sollten den Bau von Akademien weiterhin finanziell unterstützen, damit unsere herausragende Stellung in der Welt der Philosophie unangefochten bleibt."
 cyrene_1_academies_task_3: "Bildende Künste fördern"
 cyrene_1_academies_task_3_DESC: "Unsere Theater sind unglaublich beliebte Veranstaltungsorte; wann immer die neuesten Stücke aufgeführt werden, ist es praktisch unmöglich, noch einen freien Platz zu finden. Um unsere gebildete Bevölkerung zu unterhalten, sollten wir in Erwägung ziehen, noch mehr große Theater zu bauen."
 cyrene_1_academies_task_4: "Kyrenaikische Staatsphilosophie"
 cyrene_1_academies_task_4_DESC: "Während wir zweifellos die Vorteile der Annahme einer offiziellen Staatsphilosophie gesehen haben, könnten wir es besser machen, wenn wir uns entscheiden, uns auf eine der vielen Schulen zu spezialisieren, die sich in unserem Königreich ausbreiten. Die Lehren der Anneceriden, Theodoriden und Hegesiaden sind alle akzeptable Kandidaten."
 cyrene_1_academies_task_5: "Eine neue Denkschule"
 cyrene_1_academies_task_5_DESC: "Die Stadt Kyrene wird aufgrund der schieren Anzahl wundersamer Lehren, die von den größten Denkern, die jemals in einer Stadt versammelt wurden, gelehrt werden, das „Forum der Philosophie“ genannt. So beginnen verschiedene philosophische Schulen Fuß zu fassen, eine Entwicklung, die Euch außerordentlich erfreut. Wir könnten die Grundsätze der Stoiker, Epikureer oder sogar der Kyniker offiziell übernehmen, sollte es Eurer Majestät gefallen."
 cyrene_1_academies_task_6: "Die Akademie von Kyrene"
 cyrene_1_academies_task_6_DESC: "Unser Ruf als Zentrum des gelehrten Denkens wächst von Tag zu Tag, und manche bezeichnen uns sogar als das „philosophische Atlantis“ und vergleichen uns mit der sagenumwobenen Stadt, die Platon in den Dialogen „Timaios und Kritias“ beschreibt – wer sind wir, um dem zu widersprechen?"
 cyrene_1_academies_task_7: "Apollos Geschenk an die Kyrenaika"
 cyrene_1_academies_task_7_DESC: "Wenn wir unsere Bauernsiedlungen erweitern,  stehen die Chancen gut, dass wir Silphium anbauen können – ein Geschenk des gesegneten Apollon an sein auserwähltes Volk, die Kyrenaiker."
 cyrene_1_academies_task_8: "Förderung des Silphium-Handels"
 cyrene_1_academies_task_8_DESC: "Die seltene Pflanze Silphium sorgt in unseren Häfen und auf unseren Märkten für einen regelrechten Aufschwung; offenbar ist diese Handelsware weltweit sehr begehrt. Gebt die Anweisung, den Anbau auszuweiten!"
 cyrene_1_academies_task_9: "Neue Exportmärkte sichern"
 cyrene_1_academies_task_9_DESC: "Auch wenn unser Ruf im Ausland zu Recht hoch geschätzt wird, schadet es nie, die Räder der Freundschaft mit diplomatischen Gesten und Geschenken zu schmieren, wenn es darauf ankommt. Wenn wir gute Beziehungen zu unseren Nachbarn aufbauen, wird dies zweifellos unsere Handelseinnahmen steigern, insbesondere mit unserer wertvollen Verkaufspflanze Silphium."
 cyrene_1_academies_task_10: "Intensivierung der Silphium-Ausbeutung"
 cyrene_1_academies_task_10_DESC: "Die Nachfrage nach Silphium übersteigt unsere Förderkapazitäten bei weitem, und uns entgehen potenzielle Einnahmen in Höhe kleiner Vermögen. Spart nicht an Kosten; sorgt dafür, dass in ganz Kyrenaika Mühlen und Minen errichtet werden, um den Verkauf unserer wertvollsten Ernte zu erleichtern!"
 cyrene_1_academies_task_11: "Diversifizierung der Exportbranchen"
 cyrene_1_academies_task_11_DESC: "Zwar erzielen wir mit unseren derzeitigen Exporten beträchtliche Einnahmen, doch haben einige unserer Berater vorgeschlagen, unsere Wirtschaft zu diversifizieren und uns nicht zu sehr auf ein einzelnes Handelsgut zu verlassen, damit etwaige Veränderungen der Marktbedingungen keine Auswirkungen auf unsere Einnahmen haben. Da Sie die Weisheit dieses Vorschlags erkennen, haben Sie beschlossen, unsere Pferdemärkte auszubauen, da die Rösser aus Kyrenaika die besten der Welt sind."
 cyrene_1_academies_task_12: "Medizinisches Wunder"
 cyrene_1_academies_task_12_DESC: "Silphium, die Wunderpflanze mit unzähligen Verwendungsmöglichkeiten, könnte auch veredelt und zu Arzneimitteln verarbeitet werden - gibt es etwas, was diese Wunderpflanze nicht kann?"
 cyrene_1_academies_task_13: "Kochschule"
 cyrene_1_academies_task_13_DESC: "Die intensiven Aromen des Silphiums gelten als Delikatesse und sind bei Feinschmeckern, die ihre Geschmacksnerven mit seltenen und exotischen Aromen verzaubern möchten, sehr gefragt. Es wird vermutet, dass manche Reisende nicht in unsere Städte kommen, um aus den überfließenden Brunnen unserer philosophischen Schulen zu schöpfen, sondern um die Köstlichkeiten zu kosten, die in unseren Küchen zubereitet werden."
 cyrene_1_academies_task_14: "Hafen von Apollonia"
 cyrene_1_academies_task_14_DESC: "Kyrene ist dank des Zustroms von Siedlern, die von unserem Wohlstand profitieren wollen, so überfüllt, dass euch ein ehrgeiziger Expansionsplan vorgelegt wurde: der Bau eines großen Hafens im Nachbargebiet von [GetProvince('(int32)3361').GetName]. Dadurch könnte wertvolles Land in unserer Hauptstadt freigegeben werden, das sich besser für den Bau anderer Gebäude eignen könnte."
 cyrene_1_academies_task_final: "Silphium-Exporte"
 cyrene_1_academies_task_final_DESC: "Der Silphium-Handel ist dank unseres umsichtigen Umgangs mit dieser wertvollen Ressource zu einem Grundpfeiler unserer Wirtschaft geworden, und unser Volk, das eine regelrechte Leidenschaft für dieses Gewürz entwickelt hat, genießt es täglich. Unsere Bürger, deren Atem nach dem pikanten Duft unseres geliebten Silphiums duftet, feiern die Freuden unserer erlesenen Küche."
