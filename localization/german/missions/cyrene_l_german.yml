 # Treasures, Decisions Etc. 
  
 cyr_death_by_starvation: "Tod durch Verhungern"
 cyr_death_by_starvation_desc: "Das Hauptwerk des kyrenäischen Philosophen Hegesias von Kyrene, genannt „Peisithanatos“ (Todesverführer) wegen seiner Fähigkeit, Menschen in den Selbstmord zu treiben, indem er sie davon überzeugt, dass Glück unerreichbar und das Leben nicht lebenswert ist."
 cyr_on_the_measure_of_the_world: "Über das Maß der Welt"
 cyr_on_the_measure_of_the_world_desc: "Das Hauptwerk des Eratosthenes von Kyrene. Es beschreibt, wie er die Längen der Schatten an verschiedenen Orten nutzte, um den Umfang der Welt genau zu berechnen"
 cyr_rock_edict: "Rock-Edikt: Mission nach Yona"
 cyr_rock_edict_desc: "Nun ist es die Eroberung durch Dhamma, die der Geliebte-der-Götter als die beste Eroberung betrachtet. Und sie wurde hier an den Grenzen errungen, sogar sechshundert Yojanas entfernt, wo der griechische König Antiochos herrscht, jenseits davon, wo die vier Könige namens Ptolemaios, Antigonos, Magas und Alexander herrschen."
cyr_works_of_kallimakhos: "Poesie des Kallimachos"
cyr_works_of_kallimakhos_desc: "Das Gesamtwerk des großen Dichters Kallimachos, das aus über 800 einzelnen Literaturstücken besteht, ist vielleicht das einflussreichste Werk der Literatur des hellenistischen Zeitalters. \n \nKallimachos wichtigste Schöpfungen sind die „Pinakes“ (ein umfassender Katalog der gesamten griechischen Literatur), die „Aetia“ (eine Reihe von Gedichten über die mythologischen Ursprünge der Wirklichkeit), die „Hekale“ (ein episches Gedicht über das Leben einer alten Frau, erzählt aus der Perspektive des Helden Theseus) sowie seine Iamben (satirische Gedichte) und Hymnen (eine Sammlung von 60 religiösen Hymnen)."
cyr_the_last_silphium: "Das letzte Silphium"
cyr_the_last_silphium_desc: "Die getrockneten und konservierten Überreste der letzten Silphium-Pflanze, die jemals geerntet wurde. Einst war dieses Heilkraut in der Kyrenaika so reichlich vorhanden, dass ein Großteil der kyrenaikschen Wirtschaft auf seinem Export beruhte. Nun ist dieses kleine Bündel aus Pflanzenmaterial alles, was übrig geblieben ist."
 cyr_control_grazing: "#R Silphium #! Viehbeweidung kontrollieren"
 cyr_control_grazing_desc: "Einer der Gründe für den Rückgang der Silphium-Ernte ist die wachsende Zahl von Nutztieren, insbesondere Rindern, die in der Kyrenaika weiden. Die Viehherden fressen viele Silphiumpflanzen, bevor sie sich vermehren können. \n\nWenn wir die Silphiumversorgung sichern wollen, müssen wir die Menge an Rindern kontrollieren, die in der Kyrenaika weiden dürfen."
 cyr_control_exports: "#R Silphium #! Silphiumexport begrenzen"
 cyr_control_exports_desc: "Die größte Ursache für den Rückgang des Silphiums ist unser eigener unkontrollierter Export der Pflanze. Die Durchsetzung strenger Exportbeschränkungen wird nicht populär sein, ist aber eine Notwendigkeit, wenn wir den Silphiumbeständen Zeit geben wollen, sich zu erholen."
 cyr_stabilise_silphium: "#R Silphium #! Silphiumausbeutung stabilisieren"
 cyr_stabilise_silphium_desc: "Durch rechtzeitige Maßnahmen unserer Regierung konnte die Silphiumernte auf einem nachhaltigen Niveau stabilisiert werden. Dies ist zwar ein kleiner Rückschritt im Vergleich zu dem phänomenalen Reichtum, den der Silphiumhandel unserem Land einst bescherte, aber es garantiert, dass die Menschen in [SCOPE.GetRootScope.GetCountry.GetName] noch über Generationen hinweg von dem Geschenk Apollos profitieren können"
 cyr_stabilise_silphium.tt: "Die Entscheidungen $cyr_control_grazing$ und $cyr_control_exports$ sind getroffen worden."
 cyr_wooing_DEL_friendship: "#R Nesiotenbund #! Freundschaft zwischen Herrschern"
 cyr_wooing_DEL_friendship_desc: "[GetCountry('CYR').GetRuler.GetName] hat seine enge Freundschaft mit [GetCountry('DEL').GetRulerTitle] [GetCountry('DEL').GetRuler.GetName] genutzt, um den [GetCountry('DEL').GetRuler.GetFirstName] von den Vorteilen einer engeren Verbindung mit [GetCountry('CYR').GetName] zu überzeugen. Dadurch rückt der [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_wooing_DEL_insult: "#R Nesiotenbund #! Diplomatische Beleidigung"
 cyr_wooing_DEL_insult_desc: "Die zähe diplomatische Beleidigung, die wir kürzlich dem [GetCountry('PRY').GetName] zugefügt haben, hatte ihre beabsichtigte Wirkung: [GetCountry('PRY').GetRuler.GetName]s Unfähigkeit, eine entschiedene Antwort zu geben, ließ ihn in den Augen seiner Untertanen schwach erscheinen. Dadurch rückt der [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_wooing_DEL_insult.tt: "Beleidigung des Oberherrn des [GetCountry('DEL').GetName]es."  
 cyr_wooing_DEL_gifts: "#R Nesiotenbund#! Geschenke"
 cyr_wooing_DEL_gifts_desc: "Die Menschen des [GetCountry('DEL').GetName]es waren tief beeindruckt von den Geschenken, die wir ihnen kürzlich geschickt haben. Dies könnte der richtige Zeitpunkt sein, unsere Großzügigkeit zu verdoppeln und eine noch größere Spende zu leisten. Unabhängig davon, was wir tun, wird dies den [GetCountry('DEL').GetName] sicherlich näher an unseren Einflussbereich rücken."
 cyr_wooing_DEL_piracy: "#R Nesiotenbund #! Piraterie ausmerzen"
 cyr_wooing_DEL_piracy_desc: "Piraten sind die Geißel der Ägäis, weshalb ihre Ausrottung eine der Hauptaufgaben der [GetCountry('CYR').GetAdjective] Flotte ist. Es scheint, dass diese Investition in die maritime Sicherheit des [GetCountry('DEL').GetName]es nicht unbemerkt geblieben ist, da sie sich jetzt stark auf unsere Hilfe verlassen, um ihre Küstengewässer sicher zu halten. Dies bringt den [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_wooing_DEL_fleet: "#R Nesiotenbund #! Eine große Kriegsflotte"
 cyr_wooing_DEL_fleet_desc: "Als Ansammlung kleiner Inseln ist der [GetCountry('DEL').GetName] für sein Überleben stark vom Meer abhängig. Es wäre nicht übertrieben zu sagen, dass derjenige, der das Meer kontrolliert, den [GetCountry('DEL').GetName] kontrolliert. Wir besitzen jetzt eine Flotte, die groß genug ist, um die Gewässer der Ägäis gegen fast jeden Feind zu bestreiten. Dies bringt den [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_wooing_DEL_eclipsing_fleet: "#R Nesiotenbund #! In den Schatten stellende Seemacht"
 cyr_wooing_DEL_eclipsing_fleet_desc: "Die [GetCountry('CYR').GetAdjective]e Flotte  ist jetzt beträchtlich größer als die Flotte des Oberherrn des [GetCountry('DEL').GetName]es, [GetCountry('PRY').GetName]. Ohne eine starke Flotte wird es für [GetCountry('PRY').GetName] sehr schwierig sein, weiterhin Einfluss auf die Ägäischen Inseln auszuüben. Dies bringt den [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_wooing_DEL_eclipsing_PRY: "#R Nesiotenbund #! In den Schatten stellen der Antigoniden"
 cyr_wooing_DEL_eclipsing_PRY_desc: "[GetCountry('PRY').GetName] ist klein und schwach. In seinem gegenwärtigen Zustand wird es ihm sehr schwer fallen, die Kontrolle über den [GetCountry('DEL').GetName] aufrechtzuerhalten, besonders wenn es mit einem viel mächtigeren Land wie unserem konkurriert. Dies bringt den [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_wooing_DEL_liberation: "#R Nesiotenbund #! Befreiung"
 cyr_wooing_DEL_liberation_desc: "Unsere kürzliche Befreiung von [cyr_wooing_DEL_liberated_country_scope.GetName] von fremder Unterdrückung hat [GetCountry('CYR').GetName] fest als Freund der kleinen Stadtstaaten von Hellas und darüber hinaus etabliert. Das macht uns als potenziellen Verbündeten für den [GetCountry('DEL').GetName] erheblich attraktiver, da sie darauf vertrauen können, dass ihre Rechte unter unserer Herrschaft geschützt werden. Dies bringt den [GetCountry('DEL').GetName] näher an unseren Einflussbereich heran."
 cyr_wooing_DEL_games: "#R Nesiotenbund #! Öffentliche Spiele sponsern"
 cyr_wooing_DEL_games_desc: "Das vielleicht sichtbarste Zeichen der [GetCountry('PRY').GetAdjective]en Autorität über den [GetCountry('DEL').GetName] sind die jährlichen Spiele, die in [GetCountry('DEL').GetCapital.GetName] zu Ehren der herrschenden [GetCountry('PRY').GetAdjective]en Familie  stattfinden. Wenn wir unsere eigenen Spiele sponsern würden, um mit den [GetCountry('PRY').GetAdjective]en Spielen zu konkurrieren, würde dies sicherlich die [GetCountry('PRY').GetAdjective]e Herrschaft stark untergraben."
 cyr_wooing_DEL_demand_loyalty: "#R Nesiotenbund #! Loyalität einfordern"
 cyr_wooing_DEL_demand_loyalty_desc: "Es ist an der Zeit zu fordern, dass der [GetCountry('DEL').GetName] uns als ihren neuen Oberherrn akzeptiert. Wenn sie akzeptieren, wird der [GetCountry('DEL').GetName] kein Untertan von [GetCountry('PRY').GetName] mehr sein und Teil unseres Einflussbereichs werden."
 cyr_wooing_DEL_demand_loyalty.tt: "Unser Einfluss auf den [GetCountry('DEL').GetName] ist ausreichend hoch."
 cyr_wooing_DEL_uncertain_overlordship: "#R Nesiotenbund #! unsichere Autorität"
 cyr_wooing_DEL_uncertain_overlordship_desc: "Es scheint, dass etwas Unvorhergesehenes passiert ist und die Autorität von [GetCountry('PRY').GetName] über [GetCountry('DEL').GetName] abnimmt.Dies könnte der Zeitpunkt sein, an dem wir handeln müssen."
 aaa_timer_cyr: "#R Zeit#! bis zum Bürgerkrieg"  
 aaa_timer_cyr_desc: "In #R [GetCountry('CYR').MakeScope.GetVariable('cyr_timer').GetValue|0] Tagen#! beginnt der Kampf um Ägypten. Derzeitige Unterstützung für unseren Putsch beträgt #Y [GetCountry('CYR').MakeScope.GetVariable('cyr_coup_support').GetValue|0] #!. Jeder Punkt über #Y 10#! verleiht uns Legitimität nach Kriegsbeginn." 
cyr_area_to_secure: "Gebiet sichern"  
 cyr_area_to_secure_desc: "Wir können auswählen, welches Gebiet wir sichern möchten (bis zu 3), vorausgesetzt wir stationieren dort Truppen und verfügen ausreichende Mittel."  
 cyr_area_to_secure.tt: "Entscheide, welches Gebiet gesichert werden soll."  
 cyr_steal_money: "Gold aus den ägyptischen Schatzkammern stehlen"  
 cyr_steal_money_desc: "Stiehlt 100 Gold von den Ptolemäern. Einmal alle 2 Monate möglich." 
 cyr_steal_money_tt: "Der Krieg beginnt 30 Tage früher (Derzeit: #R [GetCountry('CYR').MakeScope.GetVariable('cyr_timer').GetValue|0]#! Tage bis zum Krieg)." 
 cyr_entice_troop_defection: "Ptolemäische Truppen zum Überlaufen bewegen"  
 cyr_entice_troop_defection_desc: "2 ägyptische Kohorten leichter Infanterie @light_infantry! laufen kurz nach Kriegsbeginn zu uns über. Alle 2 Monate verfügbar." 
 cyr_entice_troop_defection_tt: "Der Krieg beginnt 30 Tage früher (Derzeit: #R [GetCountry('CYR').MakeScope.GetVariable('cyr_timer').GetValue|0]#! Tage bis zum Krieg)." 
 cyr_entice_char_defection: "Ptolemäischen Charakter zum Überlaufen bewegen"  
 cyr_entice_char_defection_desc: "Ein zufälliger beschäftigter ptolemäischer Charakter läuft bei Beginn des Bürgerkriegs zu uns über, zugleich wird dadurch die Unterstützung für unsere Sache in Ägypten gestärkt. Alle 2 Monate verfügbar."  
cyr_blackmail_char: "Ptolemäischen Charakter erpressen" 
cyr_blackmail_char_desc: "Ein zufälliger beschäftigter ptolemäischer Charakter läuft zu Beginn des Bürgerkriegs zu uns über, zugleich wird dadurch die Unterstützung für unsere Sache in Ägypten gestärkt. Alle 2 Monate verfügbar."  
 cyr_distribute_bribes: "Bestechungsgelder verteilen"  
 cyr_distribute_bribes_desc: "Für etwas Geld können wir die Unterstützung für unsere Ansprüche erhöhen. Alle 2 Monate durchführbar." 
 cyr_prolong_war: "Zeit bis zum Krieg verlängern"  
 cyr_prolong_war_desc: "Der Krieg beginnt 30 Tage später (Derzeit: #R [GetCountry('CYR').MakeScope.GetVariable('cyr_timer').GetValue|0]#! Tage bis zum Krieg). Alle 3 Monate verfügbar." 
 cyr_prolong_war.tt: Verlängert die Zeit bis zum Krieg um 30 Tage."  
 cyr_appeal_kush: "Bitte an Kusch"  
 cyr_appeal_kush_desc: "Indem wir Oberägypten an die Kuschiten abtreten und ihr Tributstaat werden, sichern wir uns ihre Hilfe in unserem Kampf - und den Sieg" 
 cyr_appeal_kush_tt: "#R Sollte Kusch zustimmen, werden sie sich unserem Krieg gegen die Ptolemäer anschließen. Im Gegenzug überlassen wir ihnen das Gebiet Oberägyptens und werden ihr Tributstaat.#!"  
 cyr_ask_sel: "Bitte an die Seleukiden"  
 cyr_ask_sel_desc: "Wir können den Sieg sichern, indem wir unsere asiatischen Gebiete aufgeben und Tribustaat der Seleukiden werden." 
 cyr_ask_sel.tt: "#R Sollten die Seleukiden zustimmen, werden sie sich unserem Krieg gegen die Ptolemäer anschließen. Im Gegenzug werden wir ihnen alle unsere Besitzungen in Asien überlassen, und werden zu ihrem Tributstaat.!#"  
 cyr_winwar: "Um Frieden bitten"  
 cyr_winwar_desc: "Da unser Krieg gegen die Ptolemäer unerwartet gut verläuft, bietet sich uns die einmalige Gelegenheit, ihre Verzweiflung auszunutzen, unbeschadet zu bleiben. Das einzige, was sie das kosten wird, ist eine exorbitante Summe, damit wir das Land verlassen." 
 cyr_winwar.tt: "Wir schlagen vor, einen weißen Frieden mit den Ptolemäern zu unterzeichnen und uns mit #T 500 Gold#! auszahlen."  
 cyr_thera_more_pops: "Thera besiedeln"  
 cyr_thera_more_pops_desc: Wir siedeln bis zu 20 Bevölkerungseinheiten nach Thera um"  
 cyr_thera_more_pops.tt: "Wir siedeln Sklaven aus unserem Territorium für je 8 Gold um.  
 cyr_car_subj_decision: "Karthagos Vasallen übernehmen" 
 cyr_car_subj_decision_desc: "Bei unserer großartigen Eroberung Karthagos dürfen wir ihre Vasallen nicht vergessen."  
 cyr_roads_decision: "Straßen in Kyrenaika bauen"  
 cyr_roads_decision_desc: "Bau einer Straße von Paliouros nach Paraitonion."  
  
 cyr_geography: "Vater der Geographie"
 cyr_geography_desc: "Die Entdeckungen dieses Charakters haben ihn de facto zum Vater der Wissenschaft der Geographie gemacht."
