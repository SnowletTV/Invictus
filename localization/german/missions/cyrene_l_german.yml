 # Tasks 
  
 #cyrene_1_magas_DESCRIPTION: "The lands of Kyrenaika form an oasis of lush plains and verdant forests amidst the unforgiving sands of the Libyan Desert. \n\nIt was this wealth of resources which three hundred years ago, attracted Greek settlers from the island of Thera who founded the five cities of Kyrenaika; Cyrene, Taucheira, Euesperides, Belagrae and Barce. These five cities gave Kyrenaika its two names, Pentapolis, "The Five Cities", or Kyrenaika, "The Lands of Cyrene", after the most important of the five. The commander of the group that founded Cyrene took the local Libyan name Battus, and his descendants would reign as Kings of Kyrenaika until the Kingdom's fall to the expanding Persian Empire. \n\nUnder the rule of the Battids the young colonies of Colonies of Kyrenaika grew to be one of the most important centers of learning in the Greek world, with its medical school and philosophical academy at times rivaling Athens itself. The flourishing trade with Crete and the Greek cities on the Peleponnese brought with it not only much wealth, but also a growing number of new settlers from all over the Greek world. \n\nSoon however, tensions between the original settlers from Thera, other Greeks, and the local Libyans began to grow. And thus, around the year 200 AUC (~550 BCE) the then king of Kyrenaika, Battus III, in an attempt to stabilize his realm, instituted constitutional reforms which greatly limited the authority of the king in favor of an elected senate. Battus III's heirs greatly resented this move towards republicanism until, following a series of civil wars and the eventual murder of his father Arcesilaus III, the grandson of Battus III, Battus IV, invited in the armies of Persia in order to secure his old rights. \n\nSubmission to the Persians however would not save the Battid dynasty. In the year 313 AUC (440 BCE) Battus IV's successor, Arcesilaus IV, would likewise be murdered by his own citizens, to be replaced this time not by another Battid ruler, but by a governor appointed by the Persian Emperor. \n\nThus the Kingdom of Kyrenaika came to an end, replaced first by Persian rule and then by submission to its conquerors, Alexander the Great and ultimately his successor in Egypt, Ptolemy I Soter. Ptolemy put Kyrenaika into the hands of Ophellas, a veteran of Alexander's Indian campaign. Ophellas however was killed when he was betrayed by his own allies during an invasion of Carthage. The death of Ophellas has left Kyrenaika without an official ruler, formally still part of Egypt but de facto independent. This situation however is unlikely to last for long - it is certain that the Ptolemies will appoint a new governor sooner rather than later. "  #<Die Länder der Kyrenaika bilden eine Oase aus üppigen Ebenen und grünen Wäldern inmitten der unerbittlichen Sandstrände der libyschen Wüste. \n\nEs war dieser Reichtum an Ressourcen, der vor dreihundert Jahren griechische Siedler von der Insel Thera anzog, die die fünf Städte der Kyrenaika gründeten; Cyrene, Taucheira, Euesperides, Belagrae und Barce. Diese fünf Städte gaben der Kyrenaika ihre beiden Namen: Pentapolis, „Die fünf Städte“, oder Kyrenaika, „Das Land von Zyrene“, nach der wichtigsten der fünf Städte. Der Kommandeur der Gruppe, die Kyrene gründete, nahm den lokalen libyschen Namen Battus an, und seine Nachkommen regierten als Könige von Kyrenaika, bis das Königreich an das expandierende Persische Reich fiel. \n\nUnter der Herrschaft der Battiden entwickelten sich die jungen Kolonien der Kolonien von Kyrenaika zu einem der wichtigsten Bildungszentren in der griechischen Welt, mit ihrer medizinischen Fakultät und philosophischen Akademie, die zeitweise mit Athen selbst konkurrierte. Der florierende Handel mit Kreta und den griechischen Städten auf dem Peleponnes brachte nicht nur großen Reichtum, sondern auch eine wachsende Zahl neuer Siedler aus der ganzen griechischen Welt. \n\nBald jedoch begannen die Spannungen zwischen den ursprünglichen Siedlern aus Thera, anderen Griechen und den örtlichen Libyern zu wachsen. Und so führte der damalige König von Kyrenaika, Battus III., um das Jahr 200 AUC (ca. 550 v. Chr.) in einem Versuch, sein Reich zu stabilisieren, Verfassungsreformen ein, die die Autorität des Königs zugunsten eines gewählten Senats stark einschränkten. Die Erben von Battus III. lehnten diesen Schritt in Richtung Republikanismus sehr ab, bis Battus IV., der Enkel von Battus III., nach einer Reihe von Bürgerkriegen und der schließlichen Ermordung seines Vaters Arcesilaos III. die Armeen Persiens einlud, um seine alten Rechte zu sichern. \n\nEine Unterwerfung unter die Perser würde die Battiden-Dynastie jedoch nicht retten. Im Jahr 313 AUC (440 v. Chr.) wurde der Nachfolger von Battus IV., Arcesilaos IV., ebenfalls von seinen eigenen Bürgern ermordet, um dieses Mal nicht durch einen anderen battidischen Herrscher, sondern durch einen vom persischen Kaiser ernannten Statthalter ersetzt zu werden. \n\nSo endete das Königreich Kyrenaika, das zunächst durch die persische Herrschaft und dann durch die Unterwerfung unter seine Eroberer, Alexander den Großen, und schließlich seinen Nachfolger in Ägypten, Ptolemaios I. Soter, ersetzt wurde. Ptolemaios übergab die Kyrenaika in die Hände von Ophellas, einem Veteranen von Alexanders Indianerfeldzug. Ophellas wurde jedoch getötet, als er während einer Invasion in Karthago von seinen eigenen Verbündeten verraten wurde. Der Tod von Ophellas hat dazu geführt, dass die Cyrenaika keinen offiziellen Herrscher mehr hat und formell immer noch zu Ägypten gehört, aber de facto unabhängig ist. Es ist jedoch unwahrscheinlich, dass diese Situation lange anhält – es ist sicher, dass die Ptolemäer eher früher als später einen neuen Statthalter ernennen werden.#>  #ot!
 #cyrene_1_magas_CRITERIA_DESCRIPTION: "This mission will be considered complete when we have addressed the issue of Egyptian overlordship and Kyrenaika has re-established its position as an independent kingdom."  #<Diese Mission gilt als abgeschlossen, wenn wir uns mit der Frage der ägyptischen Oberherrschaft befasst haben und die Cyrenaika ihre Position als unabhängiges Königreich wiederhergestellt hat.#>  #ot!
 #cyrene_1_magas_BUTTON_TOOLTIP: "Establish Kyrenaika as an independent kingdom"  #<Errichten Sie Kyrenaika als unabhängiges Königreich#>  #ot!
 #cyrene_1_magas_task_1: "A Governor for Kyrenaika"  #<Ein Statthalter für Kyrenaika#>  #ot!
 #cyrene_1_magas_task_1_DESC: "Since Ophellas's death at the hands of the Syracusans Kyrenaika has been in a political vacuum. We should request a new governor from the Egyptians."  #<Seit Ophellas‘ Tod durch die Syrakusaner herrschte in der Kyrenaika ein politisches Vakuum. Wir sollten die Ägypter um einen neuen Statthalter bitten.#>  #ot!
 #cyrene_1_magas_task_2: "Consolidate Hold over Kyrene"  #<Konsolidieren Sie die Macht über Kyrene#>  #ot!
 #cyrene_1_magas_task_2_DESC: "Now that Magas has been appointed as ruler of Kyrenaika he needs to prove himself by stabilizing the realm and ensuring the loyalty of his court."  #<Nachdem Magas nun zum Herrscher von Kyrenaika ernannt wurde, muss er sich beweisen, indem er das Reich stabilisiert und die Loyalität seines Hofes sicherstellt.#>  #ot!
 #cyrene_1_magas_task_3: "Epirote Ties"  #<Epirote-Krawatten#>  #ot!
 #cyrene_1_magas_task_3_DESC: "Magas's mother Berenike has been supporting a marriage between Magas full sister, Antigone, and King Pyrrhus of Epirus. If this arrangement goes through we might be able to leverage it to form an alliance with Epirus."  #<Magas‘ Mutter Berenike hat eine Heirat zwischen Magas Vollschwester Antigone und König Pyrrhus von Epirus unterstützt. Wenn diese Vereinbarung zustande kommt, können wir sie möglicherweise nutzen, um eine Allianz mit Epirus zu bilden.#>  #ot!
 #cyrene_1_magas_task_4: "Connection to the East"  #<Verbindung zum Osten#>  #ot!
 #cyrene_1_magas_task_4_DESC: "Magas's father was a commander during Alexander's Indian campaign and Magas has maintained a strong interest in the far east. This relationship has made Magas's name well known in the palaces of the east. The emissaries of the Mauryan emperor have even been pressuring Magas to convert to the emperor's new faith..."  #<Magas‘ Vater war Kommandeur während Alexanders Indienfeldzug und Magas hat ein starkes Interesse am Fernen Osten aufrechterhalten. Diese Beziehung hat Magas‘ Namen in den Palästen des Ostens bekannt gemacht. Die Abgesandten des maurischen Kaisers haben Magas sogar gedrängt, zum neuen Glauben des Kaisers zu konvertieren ...#>  #ot!
 #cyrene_1_magas_task_5: "Souring Ties with Egypt"  #<Schlechte Beziehungen zu Ägypten#>  #ot!
 #cyrene_1_magas_task_5_DESC: "Now that our ruler's mother Is no longer the queen of Egypt, relations between Egypt and their westernmost subjects have started to deteriorate rapidly."  #<Da die Mutter unseres Herrschers nun nicht mehr die Königin von Ägypten ist, beginnen sich die Beziehungen zwischen Ägypten und seinen westlichsten Untertanen rapide zu verschlechtern.#>  #ot!
 #cyrene_1_magas_task_6: "Alliance with the Seleucids"  #<Bündnis mit den Seleukiden#>  #ot!
 #cyrene_1_magas_task_6_DESC: "To secure our independence from Egypt we will need the support of Ptolemy's rivals. The Seleucids in Persia are amongst the most powerful of Alexander's successors and the most likely candidate for an alliance. A marriage between Magas and a Seleucid princess would assure [GetCountry('SEL').GetRuler.GetName] of our continued friendship."  #<Um unsere Unabhängigkeit von Ägypten zu sichern, brauchen wir die Unterstützung der Rivalen des Ptolemäus. Die Seleukiden in Persien gehören zu den mächtigsten Nachfolgern Alexanders und sind die wahrscheinlichsten Kandidaten für ein Bündnis. Eine Heirat zwischen Magas und einer seleukidischen Prinzessin würde [GetCountry('SEL').GetRuler.GetName] unsere anhaltende Freundschaft sichern.#>  #ot!
 #cyrene_1_magas_task_7: "Alliance with the Antigonids"  #<Bündnis mit den Antigoniden#>  #ot!
 #cyrene_1_magas_task_7_DESC: "To secure our independence from Egypt we will need the support of Ptolemy's rivals. The Antigonid has long since been Ptolemaios worst rival and they would certainly help us if only to spite Ptolemy. A marriage between Magas and an Antigonid princess would assure [GetCountry('PRY').GetRuler.GetName] of our continued friendship."  #<Um unsere Unabhängigkeit von Ägypten zu sichern, brauchen wir die Unterstützung der Rivalen des Ptolemäus. Die Antigoniden sind seit langem Ptolemaios schlimmster Rivale und sie würden uns sicherlich helfen, und sei es nur, um Ptolemaios zu ärgern. Eine Heirat zwischen Magas und einer antigonidischen Prinzessin würde [GetCountry('PRY').GetRuler.GetName] unserer dauerhaften Freundschaft versichern.#>  #ot!
 #cyrene_1_magas_task_8: "Alliance with Macedon"  #<Bündnis mit Mazedonien#>  #ot!
 #cyrene_1_magas_task_8_DESC: "To secure our independence from Egypt we will need the support of Ptolemy's rivals. Macedon is the heart of Alexander's old empire and some of Magas's relatives still hold power there. A marriage between Magas and a Macedon princess would assure [GetCountry('MAC').GetRuler.GetName] of our continued friendship."  #<Um unsere Unabhängigkeit von Ägypten zu sichern, brauchen wir die Unterstützung der Rivalen des Ptolemäus. Makedonien ist das Herz von Alexanders altem Reich und einige von Magas‘ Verwandten haben dort immer noch die Macht. Eine Heirat zwischen Magas und einer mazedonischen Prinzessin würde [GetCountry('MAC').GetRuler.GetName] unserer dauerhaften Freundschaft versichern.#>  #ot!
 #cyrene_1_magas_task_9: "War for Independence"  #<Krieg um die Unabhängigkeit#>  #ot!
 #cyrene_1_magas_task_9_DESC: "The time has come to inform [GetCountry('SEL').GetRuler.GetName] that we are his servants no longer. The Egyptians are unlikely to take these news lightly."  #<Es ist an der Zeit, [GetCountry('SEL').GetRuler.GetName] mitzuteilen, dass wir nicht länger seine Diener sind. Die Ägypter werden diese Nachricht wahrscheinlich nicht auf die leichte Schulter nehmen.#>  #ot!
 #cyrene_1_magas_task_final: "A New King of Kyrene"  #<Ein neuer König von Kyrene#>  #ot!
 #cyrene_1_magas_task_final_DESC: "With our independence secured, the time has come to crown [ROOT.GetRuler.GetName] King of Kyrenaika."  #<Da unsere Unabhängigkeit gesichert ist, ist es an der Zeit, [ROOT.GetRuler.GetName] zum König von Kyrenaika zu krönen.#>  #ot!
  
 cyrene_1_magas_DESCRIPTION: "Die Ländereien der Kyrenaika bilden eine Oase aus üppigen Ebenen und grünen Wäldern inmitten des unversöhnlichen Sandes der libyschen Wüste. \n\nEs war dieser Reichtum an Ressourcen, der vor dreihundert Jahren griechische Siedler von der Insel Thera anzog, die die fünf Städte der Kyrenaika gründeten: Kyrene, Taucheira, Euesperides, Belagrae und Barce. Diese fünf Städte gaben der Kyrenaika ihre beiden Namen, Pentapolis, „Die fünf Städte“, oder Kyrenaika, „Die Länder von Kyrene“, nach der wichtigsten der fünf. Der Anführer der Gruppe, die Kyrene gründete, nahm den lokalen libyschen Namen Battus an, und seine Nachkommen würden als Könige der Kyrenaika regieren, bis das Königreich an das expandierende persische Reich fiel. \n\nUnter der Herrschaft der Battiden entwickelten sich die jungen Kolonien der Kyrenaika zu einem der bedeutendsten Zentren der Gelehrsamkeit in der griechischen Welt, wobei ihre medizinische Schule und ihre philosophische Akademie zeitweise sogar mit Athen selbst rivalisierten. Der blühende Handel mit Kreta und den griechischen Städten auf dem Peloponnes brachte nicht nur großen Reichtum mit sich, sondern auch eine wachsende Zahl neuer Siedler aus der gesamten griechischen Welt. \n\nBald jedoch begannen die Spannungen zwischen den ursprünglichen Siedlern aus Thera, anderen Griechen und den lokalen Libyern zu wachsen. Und so führte der damalige König der Kyrenaika, Battus III., um das Jahr 200 AUC (~550 v.Chr.) in einem Versuch, sein Reich zu stabilisieren, Verfassungsreformen ein, die die Autorität des Königs zugunsten eines gewählten Senats stark einschränkten. Die Erben von Battus III. lehnten diesen Schritt in eine republikanische Richtung vehement ab, bis schließlich, nach einer Reihe von Bürgerkriegen und der Ermordung seines Vaters Arkesilaos III., der Enkel von Battus III., Battus IV., die persischen Heere ins Land holte, um seine alten Rechte zu sichern. \n\nDie Unterwerfung unter die Perser würde die Battiden-Dynastie jedoch nicht retten. Im Jahr 313 AUC (440 v.Chr.) Wurde der Nachfolger von Battus IV., Arkesilaus IV., ebenfalls von seinen eigenen Bürgern ermordet, um dieses Mal nicht durch einen anderen Battiden-Herrscher, sondern durch einen vom persischen Herrscher ernannten Statthalter ersetzt zu werden. \n\nSo fand das Königreich Kyrenaika sein Ende und wurde zunächst durch persische Herrschaft abgelöst, dann durch die Unterwerfung unter seine Eroberer, Alexander den Großen und schließlich dessen Nachfolger in Ägypten, Ptolemaios I. Soter. Ptolemaios legte die Kyrenaika in die Hände von Ophellas, einem Veteranen von Alexanders Indienfeldzug. Ophellas wurde jedoch getötet, als er während einer Invasion in Karthago von seinen eigenen Verbündeten verraten wurde. Der Tod von Ophellas hat Kyrenaika ohne offiziellen Herrscher hinterlassen, formal immer noch Teil Ägyptens, aber de facto unabhängig. Diese Situation wird jedoch nicht lange anhalten - es ist sicher, dass die Ptolemäer eher früher als später einen neuen Statthalter ernennen werden."
 cyrene_1_magas_CRITERIA_DESCRIPTION: "Diese Mission gilt als abgeschlossen, wenn wir uns mit der Frage der ägyptischen Oberherrschaft befasst haben und die Kyrenaika ihre Position als unabhängiges Königreich wiederhergestellt hat."
 cyrene_1_magas_BUTTON_TOOLTIP: "Errichtung der Kyrenaika als unabhängiges Königreich"
 cyrene_1_magas_BUTTON_DETAILS: ""
 cyrene_1_magas_task_1: "Ein Statthalter für Kyrenaika"
 cyrene_1_magas_task_1_DESC: "Seit Ophellas Tod durch die Hand der Syrakusaner befindet sich Kyrenaika in einem politischen Vakuum. Wir sollten einen neuen Statthalter von den Ägyptern fordern."
 cyrene_1_magas_task_2: "Die Kontrolle über Kyrene konsolidieren"
 cyrene_1_magas_task_2_DESC: "Eine unglaublich wichtige Sache: Loyalität. Denn wie können wir überhaupt von Expansion träumen, wenn das Fundament, auf dem wir aufbauen, bis ins Mark verfault ist? Es wurden Geschenke gemacht und Versprechen gegeben, die unseren Bürokraten ihren Platz vor Augen geführt haben – wir können nun sicher sein, dass wir die volle Unterstützung derer haben, die wir beschäftigen."
 cyrene_1_magas_task_3: "Die libysche Frage"
 cyrene_1_magas_task_3_DESC: "Die Spannungen zwischen den griechischen Siedlern und den Ureinwohnern Libyens erreichen einen Siedepunkt – wir müssen hier lieber früher als später eine Lösung finden, sonst stehen wir vor einem noch größeren Problem."
 cyrene_1_magas_task_4: "Libysche Koexistenz"
 cyrene_1_magas_task_4_DESC: "Die Libyer sind, obwohl sie den Griechen vielleicht nicht ebenbürtig sind, trotz einiger bemerkenswerter Mängel ein feines Volk. Warum ihnen nicht mehr Rechte einräumen? Dies wird einen dauerhaften Frieden zwischen unseren Völkern sicherstellen."
 cyrene_1_magas_task_5: "Die Plünderer befrieden"
 cyrene_1_magas_task_5_DESC: "Diese verfluchten libyschen Plünderer richten in unseren Provinzen großen Unfrieden an, und wir haben beschlossen, dass es nun genug ist. Lasst wissen, dass man diesen Barbaren unverzüglich das Handwerk legen soll! Wir haben keine Zeit, die Plünderer zurück in die Wüste zu jagen."
 cyrene_1_magas_task_6: "Griechische Dominanz"
 cyrene_1_magas_task_6_DESC: "Die Ureinwohner Libyens, die in unmittelbarer Nähe zu den griechischen Siedlern leben, fangen an, sich für gleichberechtigt zu halten, was, wie wir alle wissen, eine gefährliche Lüge ist. Wir müssen ihren sozialen Status zu einer Frage der staatlichen Politik machen, damit wir uns nicht mit unvorhergesehenen Auswirkungen auseinandersetzen müssen."
 cyrene_1_magas_task_7: "Der Libyenkrieg"
 cyrene_1_magas_task_7_DESC: "Die törichten Libyer haben beschlossen, gegen die Griechen zu kämpfen, und entschieden, dass ihr völliger Untergang der Knechtschaft vorzuziehen ist. Also gut, dann werden wir ihnen den Tod bescheren, nach dem sie sich so verzweifelt sehnen.\n\nUnd doch – auch wenn es weit hergeholt erscheint – werden die Libyer vielleicht ihre Fesseln abschütteln …"
 cyrene_1_magas_task_8: "Königin Berenike"
 cyrene_1_magas_task_8_DESC: "[GetCharacter('(int32)18').GetFirstName], mögen die Götter sie beschützen, war immer freundlich zu uns und hat uns ihre Gunst erwiesen, wenn andere dies nicht taten. Wenn wir uns schnell anfreunden, könnten wir in Erwägung ziehen, sie um Hilfe zu bitten."
 cyrene_1_magas_task_9: "Die Priesterschaft des Apollo annehmen"
 cyrene_1_magas_task_9_DESC: "Es ist bekannt, dass die Kyrenaiker ein frommes Volk sind, das von vielen Göttern geliebt wird, und Apollon lag uns schon immer besonders am Herzen. Es wäre eine große Ehre für uns, wenn wir die Leitung des Priesteramtes des Phoebus übernehmen dürften."
 cyrene_1_magas_task_10: "Fremde Freunde"
 cyrene_1_magas_task_10_DESC: "Wenn es uns gelingt, mit einem ausländischen Herrscher Freundschaft zu schließen, wird sich unser Ansehen im In- und Ausland erheblich verbessern – wir sollten unsere Bemühungen verdoppeln, einen Vertrauten zu finden, der es wert ist, die Absichten von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] zu kennen."
 cyrene_1_magas_task_11: "Freunde am ägyptischen Hof"
 cyrene_1_magas_task_11_DESC: "Es ist unerlässlich, dass wir so viele Freunde wie möglich haben, vor allem angesichts der Vielzahl an Feinden, die wir uns irgendwie eingehandelt haben. Wenn wir am ägyptischen Hof ein wenig herumschnüffeln, finden wir vielleicht einen Freund, der bereit ist, uns die Geheimnisse zu verraten, die dort hinter vorgehaltener Hand geflüstert werden…"
 cyrene_1_magas_task_12: "Der Statthalter der östlichen Kyrenaika"
 cyrene_1_magas_task_12_DESC: "Unser Freund am ägyptischen Hof hat uns verraten, dass der Statthalter der östlichen Kyrenaika ein Liebhaber von Bestechungsgeldern ist und bereit wäre, seinen Treueeid gegenüber Alexandria zu vergessen, wenn der Preis stimmt. Wir können davon profitieren, wenn wir diese Untreue unterstützen."
 cyrene_1_magas_task_13: "Der Tod des Ptolemaios"
 cyrene_1_magas_task_13_DESC: "Nachfolgen sind nicht immer reibungslos, und die Weisen sollten das Chaos nach dem Tod eines Herrschers ausnutzen. Sobald [GetCharacter('(int32)42').GetName] von dieser Welt in die nächste übergegangen ist, wird die Zeit reif sein, unsere Pläne in die Tat umzusetzen."
 cyrene_1_magas_task_14: "Sich auf die Kyrenaika konzentrieren"
 cyrene_1_magas_task_14_DESC: "Indem wir in unsere Provinz Kyrenaika investieren, werden wir die Legitimität unseres Herrschers stärken und unser Herrschaftsrecht in den Köpfen unseres Volkes fest verankern."
 cyrene_1_magas_task_15: "Die Kontrolle über auswärtige Angelegenheiten übernehmen"
 cyrene_1_magas_task_15_DESC: "Die kriegslüsternen Ptolemäer haben genug Elend und Leid in der Kyrenaika verursacht, und wir haben entschieden, dass genug genug ist. Teilen Sie Alexandria mit, dass wir sie nicht länger als zuständig für unsere Außenangelegenheiten ansehen."
 cyrene_1_magas_task_16: "Botschaften an fremde Höfe"
 cyrene_1_magas_task_16_DESC: "Jeder, der aufmerksam ist, weiß, was auf uns zukommt: Die Kyrenaika wird bald ihr Schicksal selbst in die Hand nehmen. Lasst uns unsere diplomatischen Netzwerke nutzen und prüfen, ob es Partner gibt, die bereit sind, uns militärisch zu unterstützen."
 cyrene_1_magas_task_17: "Libysche Söldner anheuern"
 cyrene_1_magas_task_17_DESC: "Wir wissen besser als die meisten anderen, dass die Libyer erbitterte Kämpfer sind. Wir sollten einen Gesandten zu den Stämmen schicken und prüfen, ob wir nicht einige Söldner rekrutieren können; je mehr Speere wir unter unserem Kommando haben, desto besser sind unsere Aussichten."
 cyrene_1_magas_task_18: "Allianz durch Heirat"
 cyrene_1_magas_task_18_DESC: "Die Bande der Ehe können unser Schicksal mit dem einer größeren Macht verbinden; lasst uns unser Fortbestehen sichern, indem wir uns mit einer hellenistischen Macht verbünden. Gelingt uns dies, sind wir fast bereit, dem Haus der Ptolemäer die Stirn zu bieten."
 cyrene_1_magas_task_19: "Verteidigung vorbereiten"
 cyrene_1_magas_task_19_DESC: "Wir haben zwar vollstes Vertrauen in unsere Soldaten, doch nur ein Narr würde unsere Verteidigungsanlagen außer Acht lassen. Lasst mitteilen, dass unsere Festung in Petra Mikra verstärkt werden soll, und weist die Garnison an, sich auf den Krieg vorzubereiten – die Zeit ist fast gekommen."
 cyrene_1_magas_task_20: "Durch die Wüste vorrücken"
 cyrene_1_magas_task_20_DESC: "Wenn wir schnell handeln, können unsere Armeen die Ptolemäer unvorbereitet überrumpeln – das Überraschungsmoment könnten wir durchaus gut gebrauchen. Stellt sicher, dass wir über genügend Kamele und Pferde verfügen, bevor wir unsere Männer in die Wüste schicken, um Ruhm zu erlangen."
 cyrene_1_magas_task_21: "Unabhängigkeitskrieg"
 cyrene_1_magas_task_21_DESC: "Der Moment der Wahrheit ist endlich gekommen; nach monatelanger intensiver Vorbereitung ist es nun an der Zeit, für unsere Freiheit zu kämpfen. Sagt dem Usurpator in Alexandria, dass die Kyrenaiker ein freies Volk sind und sich niemandem unterwerfen!"
 cyrene_1_magas_task_independence_final: "König von Kyrene"
 cyrene_1_magas_task_independence_final_DESC: "Auch wenn niemand hätte vorhersagen können, was geschehen ist, haben diejenigen, die daran glaubten, nie an dem Ausgang gezweifelt: Die Kyrenaika hat die ptolemäischen Heere besiegt und die Fesseln der Knechtschaft ein für alle Mal abgeschüttelt. Es ist an der Zeit, einen neuen König von Kyrene zu krönen."
 cyrene_1_magas_task_22: "Anspruch auf Ägypten" 
 cyrene_1_magas_task_22_DESC: "Zwar sind die Familien der Magiden und Lagiden voneinander getrennt, doch wurde durch die Ehe des verstorbenen Ptolemäus Soter mit Berenike eine Verbindung zwischen unserer Familie und den Ptolemäern hergestellt. Da die Liste der Anwärter auf den Pharaonentitel jedoch so dürftig ist, ist es nur verständlich, dass wir diesen Titel für die Familie der Magiden beanspruchen."  
 cyrene_1_magas_task_23: "Lokale Unterstützung sichern"  
 cyrene_1_magas_task_23_DESC: "Um Ägypten zu beherrschen, müssen wir zunächst im Land am Nil Verbündete für unsere Sache finden. Die Entsendung von Truppen und Geld in das ptolemäische Königreich wird uns im kommenden Kampf sehr helfen."  
 cyrene_1_magas_task_24: "Die Armee infiltrieren"  
 cyrene_1_magas_task_24_DESC: "Wir können Kontakte zur ptolemäischen Armee und zum Rekrutierungsapparat knüpfen, wodurch ein Teil ihrer Truppen bei Kriegsausbruch zu uns überlaufen wird."  
 cyrene_1_magas_task_25: "Verbündete in hohen Positionen" 
 cyrene_1_magas_task_25_DESC: "Indem wir uns mit Familienoberhäuptern in Ägypten anfreunden, erhöhen wir unsere Chancen, das Land zu übernehmen."  
 cyrene_1_magas_task_26: "Einheimische Versprechen"  
 cyrene_1_magas_task_26_DESC: "Über Ägypten zu herrschen bedeutet, über die Ägypter zu herrschen. Deshalb müssen wir Ankündigungen darüber verbreiten, dass sich ihre Lage verbessern wird, wenn es unvermeidlich zu einem Führungswechsel kommt."  
 cyrene_1_magas_task_27: "Der gestelzte Erbe"  
 cyrene_1_magas_task_27_DESC: "Ptolemaios Philadelphos hat als legitimes Kind von Ptolemaios Soter und Berenike Magid für unsere Zwecke den besten Anspruch auf den ägyptischen Thron, daher unterstützen wir seinen Anspruch." 
 cyrene_1_magas_task_28: "Eine königliche Entführung"  
 cyrene_1_magas_task_28_DESC: "Ptolemäus Philadelphos, Nachkomme sowohl der Lagiden als auch der Magiden, hat den stärksten Anspruch auf den ägyptischen Thron. Da er sich jedoch in ägyptischer Gewalt befindet, müssen wir dafür sorgen, dass er auf unsere Seite wechselt – notfalls auch mit Gewalt."  
 cyrene_1_magas_task_29: "Ein Marionettenkönig"  
 cyrene_1_magas_task_29_DESC: "Es lebe Basileus Ptolemaios Philadelphos! In Staatsangelegenheiten sollte man sich jedoch bitte an seinen Erzieher wenden."  
 cyrene_1_magas_task_30: "Ptolemaios' Vermächtnis  beanspruchen"  
 cyrene_1_magas_task_30_DESC: "Anstatt irgendwelcher halbherziger Maßnahmen wie der Einsetzung eines Marionettenkönigs könnte unser Herrscher den Titel des Pharaos einfach für sich beanspruchen – auch wenn die Legitimität dieses Anspruchs etwas mehr Überzeugungsarbeit mit Schwert und Gold erfordern würde." 
 cyrene_1_magas_task_31: "Die Krone Ägypten usurpieren"  
 cyrene_1_magas_task_31_DESC: "Es kann nur einen legitimen Pharao Ägyptens geben. Und wir sorgen dafür, dass eine würdige Person diesen Titel erhält." 
 cyrene_1_magas_task_32: "Aufstände in Alexandria"  #
 cyrene_1_magas_task_32_DESC: "Mit etwas Geschick können wir Spannungen in der von den Ptolemäern so geschätzten Hauptstadt schüren, die durch verschiedene ethnische Gruppen in unterschiedlichen Stadtvierteln gespalten ist. Schon wenige Eindringlinge reichen aus, damit die Spannungen überkochen." 
 cyrene_1_magas_task_coup_final: "Ein neues Ägypten"  
 cyrene_1_magas_task_coup_final_DESC: "Endlich gibt es niemanden mehr, der unsere Legitimität als rechtmäßige Nachkommen des Gottes Ra, des ersten Pharaos, anzweifeln würde. Und so werden wir eine neue Dynastie Ägyptens ausrufen und für alle Zeiten herrschen." 
  
  
  #Magas tooltips 
 cyrene_1_magas_task_1.tt: "#Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]![GetProvince('(int32)3353').GetArea.GetRegion.GetName]! wird einen neuen Statthalter in #Y [GetProvince('(int32)3353').GetArea.GetRegion.GetName]#! ernennen"
 cyrene_1_magas_task_2.tt: "Alle Charaktere, die ein Amt innehaben, haben mindestens #Y 60#! Loyalität."
 cyrene_1_magas_task_3.tt: "#Y Wir werden entscheiden, wie wir die Libyer in unserem Land behandeln. #R Sich auf die Seite der Griechen zu stellen, wird die Libyer sicherlich verärgern, könnte aber auch andere Möglichkeiten bieten.#!"
 cyrene_1_magas_task_4_A.tt: "Die [GetCulture('libyan').GetName|Y]e Kultur ist #Y integriert#! oder hat #Y das Recht auf Mischehe#!." 
 cyrene_1_magas_task_4_B.tt: "Alle unsere Provinzen erhalten #G 5 Zivilisationswert#!."  
 cyrene_1_magas_task_5.tt: "[SCOPE.GetRootScope.GetCountry.GetName] wird #G freundschaftliche Beziehungen#! mit den libyschen Einheimischen #G aufbauen#!."
 cyrene_1_magas_task_5_b.tt: "Die Provinzen #Y [GetProvince('(int32)3360').GetArea.GetName]#!, #Y [GetProvince('(int32)3352').GetArea.GetName]#!, #Y [GetProvince('(int32)3341').GetArea.GetName]#! und #Y [GetProvince('(int32)3367').GetArea.GetName]#! haben  die #Y Zivilisierungsbemühungen#! Statthalterspolitik." 
 cyrene_1_magas_task_5_c.tt: "Das unwegsame Gelände von #Y [GetProvince('(int32)5993').GetName]#! hat keine \n#R Barbarenhochburg#! oder zumindest #Y 2#! Nachbargebiete haben #Y 30#! oder mehr #Y Zivilisationswert#!."
 cyrene_1_magas_task_6.tt: "Die #Y [GetCulture('libyan').GetName|Y]e#! Kultur hat #Y Sklaven#!@slaves! oder #! #Y Stammesangehörigen#!@tribesmen! Rechte."
 cyrene_1_magas_task_6_B.tt: "Jede Provinz in der Region #Y [GetProvince('(int32)3352').GetArea.GetRegion.GetName]#! hat die Statthalterspolitik #Y Religiöse Konvertierung #! oder #Y Kulturelle Assimilation#!" 
 cyrene_1_magas_task_7.tt: "#R Die Libyer werden kämpfen, um ihre Rechte zu wahren – wir werden die Gelegenheit bekommen, uns gegen die Griechen auf ihre Seite zu stellen."
 cyrene_1_magas_task_8_A.tt: "#Y [GetCountry('CYR').GetRuler.GetName]#! ist mit #Y [GetCharacter('(int32)18').GetName]#! befreundet"
 cyrene_1_magas_task_8.tt: "#G Wir können wählen, wie wir die Unterstützung von [GetCharacter('(int32)18').GetFirstName] verwenden.#!"
 cyrene_1_magas_task_9.tt: "Der [GetOffice('office_high_priest_monarchy').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#! hat eine Loyalität von mindestens #Y 85#! und mindestens #Y 6#! Eifer@religious_icon!."
 cyrene_1_magas_task_9_A.tt: "[SCOPE.GetRootScope.GetCountry.GetName] hat kürzlich #Y die Künste gefördert#!."
 cyrene_1_magas_task_10.tt: "Jedes Land in diplomatischer Reichweite von #Y [SCOPE.GetRootScope.GetCountry.GetName]#! hat einen Herrscher, der mit #Y [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]#! befreundet ist."
 cyrene_1_magas_task_11.tt: "Irgendein männlicher Charakter in #Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]! der keinen Anspruch auf den Thron hat, ist ein Freund von #Y [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]#!."
 cyrene_1_magas_task_12.tt: "Der Statthalter von #Y [GetProvince('(int32)3353').GetArea.GetRegion.GetName]#! in #Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]! hat den #Y Illoyalität geschürt#! Modifikator."
 cyrene_1_magas_task_13.tt: "#Y [GetCharacter('(int32)42').GetName]#! ist gestorben."
 cyrene_1_magas_task_14.tt: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] wird sich vorerst darauf konzentrieren, sich als Herrscher der Kyrenaika zu etablieren."
 cyrene_1_magas_task_14.ttt: "#Y Nach Abschluss dieses Missionsbaums erhalten Sie Zugriff auf 5 einzigartige kyrenaikische Missionsbäume.#!"  
 cyrene_1_magas_task_15.tt: "#Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]! hat mindestens 75 Meinungen über #Y [SCOPE.GetRootScope.GetCountry.GetName]#!."
 cyrene_1_magas_task_15_A.tt: "#Y 2#! Länder, die nicht #Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]! sind oder ihre Untertanen haben eine Meinung von mindestens #Y 40#! von #Y [SCOPE.GetRootScope.GetCountry.GetName]#!."
 cyrene_1_magas_task_15_B.tt: "Ihr seid nicht länger ein #Y Bundesgenosse#!  von #Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]! und zieht euch aus allen Kriegen zurück, die sie derzeit führen."
 cyrene_1_magas_task_15.ttt: "Alle ptolemäischen Anfangsgebiete in Unterägypten sind unser."  
 cyrene_1_magas_task_16.tt: "Erweitert die Suche nach Verbündeten."
 cyrene_1_magas_task_17.tt: "[SCOPE.GetRootScope.GetCountry.GetName] hat #G freundschaftliche Beziehungen#! mit den libyschen Ureinwohnern geknüpft."
 cyrene_1_magas_task_17_A.tt: "Mindestens #Y 2#! Territorien mit dominanter #Y [GetCulture('libyan').GetName|Y]er#! Kultur haben ein #Y Kasernen#! Gebäude."
 cyrene_1_magas_task_17_B.tt: "Rekrutiert #Y [GetCulture('libyan').GetName|Y]e#! Söldner."
 cyrene_1_magas_task_17_c.tt: "#G War mit den Libyern befreundet.#!"
 cyrene_1_magas_task_18.tt: "#Y Wir werden nach einem Land suchen, das bereit ist, unsere Unabhängigkeit zu unterstützen.#!"
 cyrene_1_magas_task_18_B.tt: "Eine beliebige #Y hellenistische#! Monarchie, die nicht mit #Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]! verbündet ist, die mehr als #Y 50#! Territorien und mindestens eine Meinung von #Y 100#! über [SCOPE.GetRootScope.GetCountry.GetName] hat."
 cyrene_1_magas_task_19.tt: "Die Provinz #Y [GetProvince('(int32)3360').GetArea.GetName]#! hat mindestens #Y 1#! Festung."
 cyrene_1_magas_task_20.tt: "Die Provinz #Y [GetCountry('CYR').GetCapital.GetArea.GetName]#! hat einen Überschuss von mindestens #Y 2 Kamelen#!@camel! oder #Y Pferden#!@horses!."
 cyrene_1_magas_task_21.tt: "Seid nicht länger ein Untertan von #Y [GetCountry('EGY').GetName]#![GetCountry('EGY').GetFlag]!."
 cyrene_1_magas_task_22.tt: "#R In einem Jahr bricht der Bürgerkrieg zur Übernahme Ägyptens aus.#! Schaltet eine Entscheidung frei, uns darauf vorzubereiten."  
 cyrene_1_magas_task_22.ttt: "#Y Nach Abschluss dieses Missionsbaums erhalten Sie Zugriff auf 4 ptolemäische Missionsbäume und 1 einzigartigen kyrenaikische Missionsbaum.#!"  
 cyrene_1_magas_task_23_A.tt: "Wir müssen mindestens eine Kohorte in Siwa, Plynos Limen und Paraitonion stationieren"  
 cyrene_1_magas_task_23_B.tt: "Wir erhalten Zugriff auf #Y Entscheidungen zur Sicherung von Gebieten#!, wenn wir mindestens eine Truppe in einem bestimmten Gebiet stationieren. Für den Einsatz benötigte Bereiche werden gesichert."  
 cyrene_1_magas_task_24.tt: "#Y 5 Kohorten ptolemäischer leichter Infanterie @light_infantry! werden bei Kriegsbeginn zu uns überlaufen.#!" 
 cyrene_1_magas_task_25.tt: "Unser Herrscher muss mit mindestens zwei ägyptischen Familienoberhäuptern befreundet sein." 
 cyrene_1_magas_task_26.tt: "Die memphitische Kultur wird bei Kriegsbeginn integriert."  
 cyrene_1_magas_task_27.tt: "Ptolemaios Philadelphos wird nach dem Bürgerkrieg Herrscher."  
 cyrene_1_magas_task_28_A.tt: "Die Unterstützung für unseren Anspruch auf den ptolemäischen Thron beträgt mindestens #Y 10#! (Derzeit: #Y [GetCountry('CYR').MakeScope.GetVariable('cyr_coup_support').GetValue|0]#!)."  
 cyrene_1_magas_task_28_B.tt: "Wir werden Ptolemaios Philadelphos entführen, #Y was unseren Anspruch auf den ptolemäischen Thron stärkt#!. Er wird unser Herrscher, wenn er den Bürgerkrieg gewinnt."  
 cyrene_1_magas_task_29_A.tt: "Ptolemaios Philadelphos ist der derzeitige Basileus."  
 cyrene_1_magas_task_29_B.tt: "Wir werden einige Events erhalten, die entweder den Sturz von Philadelphos weiter vorantreiben oder ihm Legitimität verleihen werden."  
 cyrene_1_magas_task_30_A.tt: "Die Unterstützung für unseren Staatsstreich beträgt mindestens #Y 10#! (Aktuell: #Y [GetCountry('CYR').MakeScope.GetVariable('cyr_coup_support').GetValue|0]#!)."  
 cyrene_1_magas_task_30_B.tt: "Der derzeitige Herrscher wird das Erbe des Ptolemaios beanspruchen und danach streben, Pharao zu werden." 
 cyrene_1_magas_task_31_A.tt: "Die Unterstützung für unseren Staatsstreich beträgt mindestens #Y 20#! (Aktuell: #Y [GetCountry('CYR').MakeScope.GetVariable('cyr_coup_support').GetValue|0]#!)." 
 cyrene_1_magas_task_31_B.tt: "#R Wenn Ptolemaios Philadelphos unser Herrscher ist, ermorden wir ihn für 15-20 Aggressive Expansion."  
 cyrene_1_magas_task_32_A.tt: "Wir müssen alle Schiffe vor der Küste Alexandrias stationieren." 
 cyrene_1_magas_task_32_B.tt: "Das gesamte westliche Deltagebiet wird nach Ausbruch des Bürgerkriegs unser Stützpunkt in Ägypten werden."  
 cyrene_1_magas_task_coup_final_A.tt: "Alle ptolemäischen Anfangsgebiete in Ägypten sind in unser." 
  
 cyrene_1_ophellas: "Ophellas rächen"
 cyrene_1_ophellas_DESCRIPTION: "Vor vielen Jahren, im Jahr 444 AUC (309 v. Chr.), wandte sich der Tyrann von [GetCountry('SYR').GetName], [GetCharacter('(int32)56‘).GetFullName], an den Herrscher von Kyrenaika, Ophellas, um gemeinsam eine Invasion gegen [GetCountry('CAR').GetName] zu unternehmen. Als Teil dieses Bündnisses sollte Syrakus die Kontrolle über die karthagischen Besitzungen auf Sizilien erhalten, während uns alle in Afrika eroberten Gebiete verbleiben sollten. \n\nAn der Spitze einer gemischten Armee aus Kyrenaikern und Abenteurern aus der griechischen Heimat kämpfte sich Ophellas durch die libysche Wüste und eroberte dabei weite Teile des karthagischen Territoriums. Als er jedoch schließlich auf Agathokles’ Armee traf, wurde er mit Verrat konfrontiert. \n\nZunächst hatten die Syrakusaner Ophellas freundschaftlich empfangen, doch dann richteten sie ihre Waffen gegen ihre eigenen Verbündeten und griffen Ophellas’ erschöpfte Armee an, wobei sie schließlich Ophellas selbst töteten. Die wenigen Überlebenden von Ophellas’ Invasionsstreitmacht wechselten daraufhin die Seiten und schlossen sich der Armee von [GetCharacter('(int32)56').GetFirstName] an. \n\nAgathokles’ Verrat kostete die Kyrenaika ihre neu eroberten westlichen Besitztümer und stürzte ihre Regierung in Chaos und Bürgerkrieg. Obwohl die Syrakusaner selbst schließlich gezwungen waren, sich besiegt nach Sizilien zurückzuziehen, hat die Kyrenaika ihren Verrat nie vergessen."
 cyrene_1_ophellas_CRITERIA_DESCRIPTION: "Diese Mission gilt als abgeschlossen, wenn Ophellas' Eroberungen in Karthago wiederhergestellt und die Syrakusaner für ihren Verrat bestraft wurden."
 cyrene_1_ophellas_BUTTON_TOOLTIP: "Erobert Karthago und bestrafe die Syrakusaner"
 cyrene_1_ophellas_BUTTON_DETAILS: ""
 cyrene_1_ophellas_task_1: "Angriff auf Karthago"
 cyrene_1_ophellas_task_1_DESC: "Im Jahr 444 AUC (309 v. Chr.) wurde Ophellas’ Einmarsch in Karthago durch den Verrat von Agathokles, dem Tyrannen von Syrakus, vereitelt. Der Tod von Ophellas stürzte die Kyrenaika ins Chaos, doch nun, da sich die innenpolitische Lage wieder stabilisiert hat, ist es an der Zeit, dort weiterzumachen, wo Ophellas aufgehört hat."
 cyrene_1_ophellas_task_2: "Versorgungslinien vorbereiten"
 cyrene_1_ophellas_task_2_DESC: "Der Weg durch die libysche Wüste ist beschwerlich. Die Strapazen, denen Ophellas’ Invasionsstreitkräfte dabei ausgesetzt waren, trugen zweifellos zum Scheitern des Feldzugs bei. Wenn wir in seine Fußstapfen treten wollen, sollten wir sicherstellen, dass wir über die nötige Infrastruktur verfügen, um unsere Truppen ausreichend zu versorgen."
 cyrene_1_ophellas_task_3: "Rekrutiert griechische Abenteurer"
 cyrene_1_ophellas_task_3_DESC: "Als Ophellas zum ersten Mal in Karthago einfiel, stellte er eine Armee aus dem Heimatland seiner Frau [GetCharacter('(int32)148').GetFirstName] auf. [GetCharacter('(int32)148').GetFirstName] hat seitdem die Kyrenaika verlassen, um [GetCharacter('(int32)38').GetFullName] zu heiraten, aber die Städte Griechenlands sind immer noch voller abenteuerlustiger Seelen, die überzeugt werden könnten, für uns zu kämpfen, wenn wir ihnen das Recht versprechen, sich in unseren neuen Eroberungen niederzulassen."
 cyrene_1_ophellas_task_4: "Invasion von Tripolitanien"
 cyrene_1_ophellas_task_4_DESC: "Nachdem alle Vorbereitungen getroffen sind, kann unsere Invasion in Karthago beginnen. Zuerst müssen wir uns die Kontrolle über die karthagischen Verbündeten in Tripolitanien sichern."
 cyrene_1_ophellas_task_5: "Kolonien in Tripolitanien gegründet"
 cyrene_1_ophellas_task_5_DESC: "Während wir die Kontrolle über unsere neuen Gebiete im Westen übernommen haben, hegt ihre Bevölkerung immer noch starke Sympathien für Karthago. Durch die Gründung griechischer Kolonien in ganz Tripolitanien könnten wir damit beginnen, eine lokale Machtbasis aufzubauen und unseren Einfluss auf die Region zu sichern."
 cyrene_1_ophellas_task_6: "Spartas verlorene Kolonie"
 cyrene_1_ophellas_task_6_DESC: "Vor langer Zeit versuchten die Spartaner erfolglos, eine Kolonie in der Nähe des Cinyps-Flusses in Tripolitanien zu errichten. Jetzt, wo die Region unter unserer Kontrolle ist, können wir sie vielleicht davon überzeugen, es noch einmal zu versuchen."
 cyrene_1_ophellas_task_7: "Das Herz von Karthago"
 cyrene_1_ophellas_task_7_DESC: "Mit Tripolitanien unter unserer Kontrolle ist es an der Zeit, das Herz der punischen Welt anzugreifen: die wohlhabenden Städte Afrikas und sogar die Stadt Karthago selbst."
 cyrene_1_ophellas_task_8: "Die punischen Städte hellenisieren"
 cyrene_1_ophellas_task_8_DESC: "Solange die Städte Afrikas punisch bleiben, werden wir sie nie wirklich in unser Reich integrieren können. Nur durch die Unterdrückung der punischen Kultur und die Förderung der Hellenisierung der Region können unsere neuen Eroberungen gesichert werden."
 cyrene_1_ophellas_task_9: "Die punische Verwaltung integrieren"
 cyrene_1_ophellas_task_9_DESC: "Die Karthager sind ebenso zahlreich wie wohlhabend. Wir täten gut daran, einen reibungslosen Übergang von ihrer Verwaltung in unsere eigene zu gewährleisten."
 cyrene_1_ophellas_task_10: "Rache an Syrakus"
 cyrene_1_ophellas_task_10_DESC: "Im Jahr 444 AUC (309 v. Chr.) überzeugte der Tyrann von [GetCountry('SYR').GetName], [GetCharacter('(int32)56').GetFullName] den damaligen Herrscher der Kyrenaika, Ophellas, sich ihm bei einer Invasion in Karthago anzuschließen. Während des Feldzugs jedoch verriet [GetCharacter('(int32)56').GetFirstName] Ophellas, was zu seinem Tod durch die Armee von [GetCharacter('(int32)56').GetFullName] führte. Wir können nicht zulassen, dass solch ein abscheuliches Verbrechen ungestraft bleibt."
 cyrene_1_ophellas_task_11: "Aufbau einer Invasionsflotte"
 cyrene_1_ophellas_task_11_DESC: "Viele Meilen offenes Meer trennen unser Land in der Kyrenaika von der Stadt Syrakus auf Sizilien. Eine starke Flotte wird notwendig sein, um unsere Strafexpedition zu unterstützen."
 cyrene_1_ophellas_task_12: "Schwere Schiffe kaufen"
 cyrene_1_ophellas_task_12_DESC: "Die Kyrenaika ist zwar fruchtbar, hat aber wenig Holz, das für den Bau großer Kriegsschiffe geeignet ist. Zum Glück müssen wir keine eigenen Schiffe bauen. Es gibt viele griechische Städte, die bereit wären, uns ihre Schiffsbauer zum angemessenen Preis zur Verfügung zu stellen."
 cyrene_1_ophellas_task_13: "Die Strafexpedition vorbereiten"
 cyrene_1_ophellas_task_13_DESC: "Es ist an der Zeit, die letzten Vorbereitungen für unsere Strafexpedition gegen Syrakus zu treffen."
 cyrene_1_ophellas_task_14: "Das Schicksal von Syrakus"
 cyrene_1_ophellas_task_14_DESC: "Jetzt, da Syrakus in unseren Händen ist, müssen wir über das Schicksal der Stadt entscheiden."
 cyrene_1_ophellas_task_15: "Ein Klientelstaat in Sizilien"
 cyrene_1_ophellas_task_15_DESC: "Als unsere Armeen zum ersten Mal sizilianischen Boden betraten, geschah dies, um Syrakus für seinen Verrat zu bestrafen. Nun, da Syrakus angemessen gedemütigt ist, befinden wir uns im Besitz eines beträchtlichen Landstrichs am Rande unseres Einflussbereichs. Da es nie unsere Absicht war, Sizilien zu erobern, wäre es vielleicht ratsam, das eroberte Gebiet zu einem neuen Staat unter unserem Schutz umzugestalten."
 cyrene_1_ophellas_task_16: "Die westlichste Provinz"
 cyrene_1_ophellas_task_16_DESC: "Während das Ziel unserer Expedition nach Sizilien darin bestand, die Syrakusaner zu bestrafen, würde der Teil Siziliens, den wir jetzt kontrollieren, als perfekte Operationsbasis für die Expansion in die reichen und fruchtbaren Länder der Insel dienen. Die direkte Kontrolle über diese unruhige Region erfordert einen erfahrenen Statthalter und erhebliche Investitionen in die lokale Verwaltungsinfrastruktur."
 cyrene_1_ophellas_task_17: "Griechische Kolonien in Tripolitanien"
 cyrene_1_ophellas_task_17_DESC: "Um unser Wachstum fortzusetzen, liegt es in unserem besten Interesse, Kolonien zu fördern, wo immer wir können, und Tripolitanien bildet dabei keine Ausnahme."
 #cyrene_1_ophellas_task_16.tt: "The chosen governor must have a #Y combined martial @military_icon! and finesse @civic_icon! of at least 14.#!"  #<Der gewählte Statthalter muss über ein #Y kombiniertes Kampf-@military_icon verfügen! und Finesse @civic_icon! von mindestens 14.#!#>  #ot!
