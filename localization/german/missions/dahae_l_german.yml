l_german:

# Events

 me_dahae.1.t:0 "Versammlung der Clans – Beginn"
 me_dahae.1.desc:0 "Da die Anführer der Clans nun anwesend sind, müssen wir uns eine grundlegende Frage stellen – wie sollen wir die Frage der Expansion angehen? [ROOT.GetCountry.GetRuler.GetName] muss vieles bedenken, denn ein einziger falscher Schritt oder Fehltritt könnte nach hinten losgehen und dem [ROOT.GetCountry.GetRulerTitle] einen lebenslangen Feind einbringen.\n\nUnsere Entscheidungen hier werden zu unterschiedlichen Boni führen, die unseren bevorzugten Ansatz unterstützen."
 me_dahae.1.a:0 "Den diplomatischen Ansatz bevorzugen."
 me_dahae.1.b:0 "Den gewaltsamen Ansatz bevorzugen."

 me_dahae.2.t:0 "Versammlung der Clans – Fortschritt"
 me_dahae.2.desc:0 "Während die Versammlung fortschreitet, ist [ROOT.GetCountry.GetRuler.GetName] mit der Richtung zufrieden, welche die Gespräche einschlagen. Nachdem [ROOT.GetCountry.GetRuler.GetSheHe] aufmerksam den neuesten Vorschlägen der anderen Clans gelauscht hat, trifft [ROOT.GetCountry.GetRuler.GetSheHe] sich mit [ROOT.GetCountry.GetRuler.GetHerHis]en engsten Beratern und erteilt Anweisungen für den nächsten Schritt."
 me_dahae.2.a:0 "Wir müssen uns um ein gutes Ansehen bemühen."
 me_dahae.2.b:0 "Lasst alle wissen, dass wir kommen!"

 me_dahae.3.t:0 "Versammlung der Clans – Ergebnis"
 me_dahae.3.desc:0 "Nachdem die Versammlung der Clans nun abgeschlossen ist, haben sich unsere [ROOT.GetCountry.GetAdjective]en Diplomaten in [ROOT.GetCountry.GetCapital.GetName] wieder mit [ROOT.GetCountry.GetRuler.GetName] getroffen, um die Ergebnisse mitzuteilen."
 me_dahae.3.a:0 "Es scheint, als wollten die Stämme Krieg."
 me_dahae.3.b:0 "Es scheint, als wollten die Stämme eine freundschaftliche Einigung."
 me_dahae.3.tt:0 "Wir erhalten #R Ansprüche auf alle anderen Dahae-Stämme.#!"

 me_dahae.4.t:0 "Steppenpferde züchten"
 me_dahae.4.desc:0 "Steppenpferde @steppe_horses! sind für ihre Größe und Zahmheit berühmt, und Händler aus aller Welt reisen zu unseren Märkten, in der Hoffnung, diese mächtigen Tiere für ihre eigenen Zwecke erwerben zu können. Es ist weithin bekannt, dass [ROOT.GetCountry.GetName] die besten Steppenpferde überhaupt besitzt, und wir können uns glücklich schätzen, ganze Herden dieser kostbaren Tiere zur Verfügung zu haben.\n\nDa wir nun über so viele Pferde verfügen, ist es nur folgerichtig, sie nach unserem Ermessen auszubilden und einzusetzen.  Unsere Pferdemeister haben [ROOT.GetCountry.GetRuler.GetName] gebeten zu entscheiden, wie unsere Tiere ausgebildet werden sollen. Sollen sie sich darauf konzentrieren, unsere Feinde anzugreifen, oder unsere Schlachtformationen zu verteidigen?"
 me_dahae.4.a:0 "Wir müssen uns auf die Offensive konzentrieren – der einzige Weg führt nach vorn!"
 me_dahae.4.b:0 "Es wäre klüger, uns auf defensive Taktiken zu konzentrieren."

 me_dahae.6.t:0 "Verteidigt das Land der Dahae"
 me_dahae.6.desc:0 "Früher am Morgen erreichten uns in [ROOT.GetCountry.GetCapital.GetName] düstere Nachrichten, überbracht von Boten, die die ganze Nacht hindurch geritten waren, um unsere Hauptstadt zu erreichen. Es scheint, dass [friendly_neighbor_target.GetName] von [dahae_aggressor_target.GetName] angegriffen wurde, und die Gefahr eines regionalen Krieges ist größer als seit langer Zeit.\n\n[ROOT.GetCountry.GetRuler.GetName] muss eine Entscheidung treffen. Sollen wir unseren befreundeten Nachbarn zu Hilfe eilen, oder sollen wir diese Angelegenheit den Göttern überlassen?"
 me_dahae.6.a:0 "Dieser Augenblick verlangt unsere Hufe auf dem Boden."
 me_dahae.6.b:0 "Gut ... lasst sie kämpfen."

 me_dahae.7.t:0 "Steppenfalknerei – Beginn"
 me_dahae.7.desc:0 "Die Jagd mit Falken gehört zu den größten Freuden eines [ROOT.GetCountry.GetAdjective] Kriegers, abgesehen davon, sich im Kampf zu beweisen. [ROOT.GetCountry.GetRuler.GetName] hat beschlossen, einen solchen Wettstreit auszurichten, um unser diplomatisches Ansehen bei den anderen Stammeshäuptlingen zu verbessern. Und wenn [ROOT.GetCountry.GetRuler.GetFirstName] dieses Ereignis gewinnen kann, wird sich der Ruhm unseres Häuptlings weit und breit verbreiten – zum Vorteil der Stammesleute von [ROOT.GetCountry.GetName]."
 me_dahae.7.a:0 "Lasst uns den größten Falknereiwettstreit veranstalten!"

 me_dahae.8.t:0 "Steppenfalknerei – Einladungen"
 me_dahae.8.desc:0 "Bevor wir zur Falkenjagd aufbrechen, müssen wir natürlich Einladungen verschicken. Wie viel Mühe sollen wir dafür aufwenden? Es ist weithin bekannt, dass ein kleines Geschenk zusammen mit unserer Bitte eine Ablehnung erschwert. Doch letztlich hängt es davon ab, ob [ROOT.GetCountry.GetRuler.GetName] bereit ist, in die Schatzkammer zu greifen."
 me_dahae.8.a:0 "Normale Einladungen verschicken"
 me_dahae.8.b:0 "Einladungen mit Geschenken verschicken"
 me_dahae.8.b.tt:0 "Andere Stammesführer werden die Einladung mit deutlich höherer Wahrscheinlichkeit annehmen."

 me_dahae.8000.t:0 "[dahae_host.GetEmployer.GetName] Falknerei-Aktivität"
 me_dahae.8000.desc:0 "[ROOT.GetCountry.GetRuler.GetName], wir haben eine Nachricht von [dahae_host.GetName] erhalten – es scheint, dass der [dahae_host.GetAdjective] [dahae_host.GetRulerTitle] eine #E Falkenjagd#! plant und möchte, dass Ihr an den Feierlichkeiten teilnehmt. Sollen wir die Einladung von [dahae_host.GetFirstName] annehmen?"
 me_dahae.8000.a:0 "Dann lasst uns vorbereiten!"
 me_dahae.8000.a.tt:0 "Wir werden die Einladung annehmen."
 me_dahae.8000.b:0 "Sagt ihnen, sie sollen viel Spaß haben."
 me_dahae.8000.b.tt:0 "Wir werden die Einladung ablehnen."

 me_dahae.9.t:0 "Steppenfalknerei – Antworten"
 me_dahae.9.desc:0 "Die von [ROOT.GetCountry.GetRuler.GetName] ausgesandten Gesandten kehren nun nach [ROOT.GetCountry.GetCapital.GetName] zurück, und jetzt werden wir sehen, wer bereit ist, unseren [ROOT.GetCountry.GetRulerTitle] auf der Falkenjagd zu begleiten."
 me_dahae.9.a:0 "Sehen wir, wer zugesagt hat ..."
 me_dahae.9.a.1t:0 "[attendee_1.GetName] von [attendee_1.GetCountry.GetName] @[attendee_1.GetCountry.GetFlag]! hat die Einladung angenommen."
 me_dahae.9.a.2t:0 "[attendee_2.GetName] von [attendee_2.GetCountry.GetName] @[attendee_2.GetCountry.GetFlag]! hat die Einladung angenommen."
 me_dahae.9.a.3t:0 "[attendee_3.GetName] von [attendee_3.GetCountry.GetName] @[attendee_3.GetCountry.GetFlag]! hat die Einladung angenommen."
 me_dahae.9.a.4t:0 "[attendee_4.GetName] von [attendee_4.GetCountry.GetName] @[attendee_4.GetCountry.GetFlag]! hat die Einladung angenommen."

 me_dahae.9001.t:0 "Steppenfalknerei – Misserfolg"
 me_dahae.9001.desc:0 "Nun, es scheint, als hätte niemand Interesse daran gehabt, zur Falkenjagd zu erscheinen. Die Ausreden, die [ROOT.GetCountry.GetRuler.GetName] vorgetragen wurden, waren erbärmlich, und unsere Verwandten lachen hinter dem Rücken des [ROOT.GetCountry.GetRulerTitle] über ihn. Vielleicht sollten wir unsere diplomatischen Möglichkeiten noch einmal überdenken."
 me_dahae.9001.a:0 "Das ist peinlich ..."
 me_dahae.9001.a.tt:0 "Die #Y Falkenjagd#! wird #R abgesagt#!."

 me_dahae.9002.t:0 "Steppenfalknerei – Gäste treffen ein"
 me_dahae.9002.desc:0 "Oh, welch Freude, alle versammelt und vereint in ihrer Liebe zu Kumis und zur Jagd zu sehen. Nun bleibt nur noch, die Menge zu unterhalten, was sich später sicherlich auszahlen wird."
 me_dahae.9002.a:0 "Lasst uns diesen bedeutenden Anlass feiern!"
 me_dahae.9002.a.tt:0 "Die #Y Falkenjagd#! beginnt in einigen Wochen."

 me_dahae.1001.t:0 "Steppenfalknerei – Freund im Lager"
 me_dahae.1001.desc:0 "In den vergangenen Tagen ist [attendee_1.GetCountry.GetRuler.GetName] ein guter Freund von [ROOT.GetCountry.GetRuler.GetName] geworden – Diplomatie in ihrer besten Form. Die beiden werden oft gemeinsam gesehen, wie sie Kriegsgeschichten austauschen und über die Witze des jeweils anderen lachen. Wann immer sich die Gelegenheit bietet, stoßen beide Anführer auf die Gesundheit des anderen mit vergorener Stutenmilch an."
 me_dahae.1001.a:0 "Lasst uns unsere Becher mit köstlichem Kumis erheben!"

 me_dahae.1002.t:0 "Steppenfalknerei – Unglücklicher Witz"
 me_dahae.1002.desc:0 "Heute Morgen ereignete sich ein Vorfall, den [ROOT.GetCountry.GetRuler.GetName] möglichst schnell vergessen möchte. Während alle dem [ROOT.GetCountry.GetRulerTitle] zuhörten, machte [ROOT.GetCountry.GetRuler.GetSheHe] einen Witz, der beim Publikum nicht ganz ankam. Die anderen Anführer waren taktvoll genug, nicht allzu beleidigt zu sein, doch unser Ansehen unter ihnen verbessert dies dennoch nicht."
 me_dahae.1002.a:0 "Nun, das ist peinlich ..."

 me_dahae.11.t:0 "Steppenfalknerei – Aufbruch"
 me_dahae.11.desc:0 "Nun ist die Zeit gekommen, den Komfort des Lagers zu verlassen und mit dem zu beginnen, worauf alle gewartet haben: die #E Falkenjagd#!. [ROOT.GetCountry.GetRuler.GetName] hat [ROOT.GetCountry.GetRuler.GetHerHis] Gefolge versammelt und bereitet sich darauf vor, die Krieger hinaus in die weite Steppe zu führen.\n Unsere derzeitige Erfolgschance: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.11.a:0 "Vorwärts!"
 me_dahae.11.a.t:0 "#T Die Falknerei-Aktivität beginnt.#!"

 me_dahae.12.t:0 "Steppenfalknerei – Lager errichten"
 me_dahae.12.desc:0 "Nach stundenlangem Ritt durch die endlose Weite der Steppe hat [ROOT.GetCountry.GetRuler.GetName] beschlossen, dass wir einen guten Ort gefunden haben, von dem aus wir Beute aufspüren können. Der [ROOT.GetCountry.GetRulerTitle] gab den Befehl, hier ein Lager zu errichten.\n\nUnsere derzeitige Erfolgschance: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.12.a:0 "Lasst uns ein wenig ausruhen und uns umsehen."

 me_dahae.1301.t:0 "Steppenfalknerei – Jagdunfall"
 me_dahae.1301.desc:0 "Der Körper des Kindes von [ROOT.GetCountry.GetRuler.GetName] wurde in ein weißes Tuch gehüllt, das nun vom Lebensblut des Kindes rot gefärbt ist. Man sagt, [heir_scope.GetName] sei von seinem Pferd entfernt, auf einer kleinen Lichtung mit einigen verstreuten Bäumen gefunden worden – [ROOT.GetCountry.GetRuler.GetFirstName] kennt den Ort, von dem sie sprechen. Im Tod ist [heir_scope.GetFirstName] Gesicht ruhig, beinahe friedlich, und der erschütterte [ROOT.GetCountry.GetRulerTitle] streckte eine zitternde Hand aus, um [heir_scope.GetHerHis] blasse Stirn zu berühren.\n\nMit einem Mal wurde [ROOT.GetCountry.GetRuler.GetFirstName] die schreckliche Realität der Situation bewusst, und [ROOT.GetCountry.GetRuler.GetSheHe] begann lautlos zu weinen.\n\nUnsere derzeitige Erfolgschance: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1301.a:0 "Die Trauer überwältigt Euch."
 me_dahae.1301.b:0 "Nun gut ..."

 me_dahae.1302.t:0 "Steppenfalknerei – Zelt des Schamanen"
 me_dahae.1302.desc:0 "Während unserer Jagd entdeckte [ROOT.GetCountry.GetRuler.GetName] das Zelt eines Einsiedlers, [hermit_scope.GetName], eines zutiefst religiösen Mannes, der bei den Einheimischen für seine Hingabe an die Götter bekannt ist. Wie sollen wir uns ihm gegenüber verhalten? Vielleicht können wir den Einsiedler dazu bewegen, uns seinen Segen zu erteilen.\n\nUnsere derzeitige Erfolgschance: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1302.a:0 "Gehen wir hinein und bitten um göttliche Gunst."
 me_dahae.1302.b:0 "Ladet ihn an unseren Hof ein."
 me_dahae.1302.b.tt:0 "[hermit_scope.GetName] wird Eurem Hof beitreten."

 me_dahae.1303.t:0 "Steppenfalknerei – Wilderer"
 me_dahae.1303.desc:0 "Eine schlechte Nachricht durchbricht die morgendliche Stille. Während [ROOT.GetCountry.GetRuler.GetName] durch das hohe Gras schlich, entdeckte [ROOT.GetCountry.GetRuler.GetSheHe] einige Wilderer – niederträchtige Verbrecher, die gegen die Gesetze der Steppe verstoßen. Diese Jagdgründe gelten als heiliger Ort und sind den Stammeshäuptlingen vorbehalten. Unsere Verwandten wissen es besser, als diese Gebiete auf der Suche nach Beute zu durchstreifen. Eine Bestrafung muss unverzüglich erfolgen.\n\nUnsere derzeitige Erfolgschance: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1303.a:0 "Hängt sie auf."
 me_dahae.1303.b:0 "Fragt, was sie über die Vögel hier wissen."

 me_dahae.1304.t:0 "Steppenfalknerei – Vogelepisode"
 me_dahae.1304.desc:0 "Während der Falke von [ROOT.GetCountry.GetRuler.GetName] unterwegs war, scheint [ROOT.GetCountry.GetRuler.GetHerHis] Vogel wertvolle Beute gefunden zu haben. Das ist ein gutes Zeichen – wir müssen unserem Ziel näherkommen.\n\nUnsere derzeitige Erfolgschance: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1304.a:0 "Großartig!"

 me_dahae.1305.t:0 "Steppenfalknerei – Schickt Euren Vogel los"
 me_dahae.1305.desc:0 "Um [ROOT.GetCountry.GetRuler.GetHerHis] Chancen zu erhöhen, wertvolle Beute zu finden, kann [ROOT.GetCountry.GetRuler.GetName] [ROOT.GetCountry.GetRuler.GetHerHis] Vogel zum Kundschaften aussenden.\n\nUnsere derzeitige Erfolgschance: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1305.a:0 "Schickt den Falken mit Gebeten für Erfolg hinaus!"
 me_dahae.1305.tt:0 "Das Ergebnis hängt von der Summe der Fähigkeiten in Kriegskunst@military_icon! und Finesse@civic_icon! Eures Herrschers ab."
 me_dahae.1305.b:0 "Wir sollten uns statt auf Ruhmsucht auf die Spurensuche konzentrieren."

 me_dahae.1306.t:0 "Steppenfalknerei – [attendee_1.GetName] gefangen"
 me_dahae.1306.desc:0 "Es scheint, als sei [attendee_1.GetName] unter einem Pferd eingeklemmt worden, und wir müssen ihm sofort helfen! Aber wie?\n\nUnsere derzeitige Erfolgschance: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1306.a:0 "Keine Zeit anzuhalten – [attendee_1.GetFirstName] muss sich selbst helfen."
 me_dahae.1306.b:0 "Ruft Euren Apotheker!"
 me_dahae.1306.tt:0 "Das Ergebnis hängt von der Finesse@civic_icon!-Fähigkeit Eures #T Apothekers#! ab."

 me_dahae.1307.t:0 "Steppenfalknerei – Prahlen"
 me_dahae.1307.desc:0 "Als die Jagdgesellschaft einen kleinen Fluss durchquert, wollen andere Teilnehmer ihre Fähigkeiten zur Schau stellen und haben eine kurze Ablenkung vorgeschlagen. Typisches Gehabe der [ROOT.GetCountry.GetAdjective] Krieger, die sich ständig gegenseitig mit ruhmreichen Taten übertreffen wollen. [ROOT.GetCountry.GetRuler.GetName] kann es sich nicht leisten zu verlieren; [ROOT.GetCountry.GetRuler.GetSheHe] muss diese Prüfung gewinnen oder sich vor allen blamieren. Das Ziel besteht darin, einen Falken einen Fisch aus den reißenden Fluten schnappen zu lassen.\n\nUnsere derzeitige Erfolgschance: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1307.a:0 "Schickt meinen Vogel los, um ihn zu fangen."
 me_dahae.1307.tt:0 "Das Ergebnis hängt von der Summe der Fähigkeiten in Charisma@oratory_icon! und Eifer@religious_icon! Eures Herrschers ab."
 me_dahae.1307.b:0 "Versucht, den Fisch selbst zu fangen."

 me_dahae.1308.t:0 "Steppenfalknerei – Der Vogel will fliegen"
 me_dahae.1308.desc:0 "Der Himmel ist bedeckt, und ein schnell heranziehender Sturm droht, seinen Zorn über die Jagdgesellschaft zu entfesseln. Es ist kein besonders geeigneter Zeitpunkt, den Vogel hinauszulassen, doch er scheint unruhig zu sein und krächzt unaufhörlich. Wenn der Falke nichts findet, könnte dies dem Ruf von [ROOT.GetCountry.GetRuler.GetName] schaden. Soll [ROOT.GetCountry.GetRuler.GetSheHe] ihn freilassen?\n\nUnsere derzeitige Erfolgschance: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1308.a:0 "Lasst ihn in den Himmel steigen."
 me_dahae.1308.b:0 "Konzentriert Euch auf die Spurensuche."

 me_dahae.1309.t:0 "Steppenfalknerei – Ist Euer Vogel dumm?"
 me_dahae.1309.desc:0 "Der Falke von [ROOT.GetCountry.GetRuler.GetName] hat einen hohen Baum gefunden und lässt sich in dessen höchsten Ästen nieder. Nichts kann den Vogel dazu bewegen, zu [ROOT.GetCountry.GetRuler.GetFirstName]s Arm zurückzukehren – nicht einmal Geschenke aus getrocknetem Fleisch können das törichte Tier überzeugen. Alle lachen über den [ROOT.GetCountry.GetRulerTitle] und [ROOT.GetCountry.GetRuler.GetHerHis] widerspenstiges Haustier, wodurch [ROOT.GetCountry.GetRuler.GetFirstName]s Wangen knallrot werden.\n\nWenn [ROOT.GetCountry.GetRuler.GetName] versucht, den Falken von seiner Sitzstange zu holen und scheitert, wird [ROOT.GetCountry.GetRuler.GetSheHe] wie ein Narr aussehen. Den Vogel jedoch in Ruhe zu lassen, würde dem Ruf des [ROOT.GetCountry.GetRulerTitle] schaden.\n\nUnsere derzeitige Erfolgschance: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1309.a:0 "Ich werde hinaufklettern und das verdammte Ding selbst holen."
 me_dahae.1309.b:0 "Vielleicht kommt es von selbst zurück."

 me_dahae.1601.t:0 "Steppenfalknerei – Ergebnisse"
 me_dahae.1601.desc:0 "Die #E Falkenjagd#! ist zu Ende gegangen, und der Vogel von [ROOT.GetCountry.GetRuler.GetName] hat einen großen Habicht gefangen – ein Tier, das unserem Volk heilig ist! Der wilde Falke des [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] hat irgendwie einen doppelt so großen Vogel getötet und dessen Kadaver zu [ROOT.GetCountry.GetRuler.GetFirstName] gebracht, was für große Anerkennung unter den versammelten Gästen sorgte. Diese Jagd wird sicherlich allen in Erinnerung bleiben."
 me_dahae.1601.a:0 "Großer Erfolg!"
 me_dahae.1601.a.t:0 "Die #Y Falkenjagd#! endet."

 me_dahae.1602.t:0 "Steppenfalknerei – Ergebnisse"
 me_dahae.1602.desc:0 "Obwohl [ROOT.GetCountry.GetRuler.GetName] stundenlang durch die Steppe geritten ist und den Falken ein halbes Dutzend Mal ausgesandt hat, gelang es [ROOT.GetCountry.GetRuler.GetSheHe] nicht, Beute zu fangen. Einige der Krieger behaupteten, dieser Misserfolg sei ein böses Omen, doch der [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] tat dies als leeres Gerede ab und sagte allen, dass es Zeit sei, nach [ROOT.GetCountry.GetCapital.GetName] zurückzukehren."
 me_dahae.1602.a:0 "Nun gut ... Gewinnen war hier nicht die Priorität."
 me_dahae.1602.a.t:0 "Die #Y Falkenjagd#! endet."

 me_dahae.18.t:0 "Der Steppengipfel – Beginn"
 me_dahae.18.desc:0 "Nun, da die Jagd abgeschlossen und die diplomatischen Beziehungen zwischen [ROOT.GetCountry.GetName] und unseren Nachbarn gefestigt sind, ist die Zeit gekommen, sich auf die wichtigste Aufgabe zu konzentrieren – alle davon zu überzeugen, dass die #E Dahae#! eine #E Stammeskonföderation#! bilden müssen."
 me_dahae.18.a:0 "Einladungen verschicken"

 me_dahae.1800.t:0 "[dahae_host.GetEmployer.GetName] Diplomatischer Gipfel"
 me_dahae.1800.desc:0 "[ROOT.GetCountry.GetRuler.GetName], wir haben eine weitere Einladung von unseren Nachbarn erhalten, die zu einem diplomatischen Gipfeltreffen in ihrer Hauptstadt aufrufen."
 me_dahae.1800.a:0 "Annehmen"
 me_dahae.1800.b:0 "Ablehnen"

 me_dahae.19.t:0 "Der Steppengipfel – Antworten"
 me_dahae.19.desc:0 "Die Gesandten, die wir zu den anderen Stämmen geschickt haben, sind mit wichtigen Nachrichten nach [ROOT.GetCountry.GetCapital.GetName] zurückgekehrt. [ROOT.GetCountry.GetRuler.GetName] ist gespannt darauf zu erfahren, wer bereit ist, sich mit unseren Diplomaten zu treffen, um unsere gemeinsame Zukunft zu besprechen."
 me_dahae.19.a:0 "Sehen wir, wer dabei sein will."

 me_dahae.1901.t:0 "Der Steppengipfel – Misserfolg"
 me_dahae.1901.desc:0 "Nun, es scheint, dass die Diplomatie gescheitert ist und niemand außerhalb von [ROOT.GetCountry.GetName] ein geeintes und starkes #E Dahae-Bündnis#! möchte ... Nun liegt es an [ROOT.GetCountry.GetRuler.GetName], dafür zu sorgen, dass diese Initiative Wirklichkeit wird."
 me_dahae.1901.a:0 "Nun gut ..."
 me_dahae.1901.a.tt:0 "Es scheint, als müssten wir die # Dahae#! mit Gewalt vereinigen."

 me_dahae.1902.t:0 "Der Steppengipfel – Gemeinsame Ausbildung besprechen"
 me_dahae.1902.desc:0 "Nachdem sich die versammelten Heere in [ROOT.GetCountry.GetCapital.GetName] eingefunden haben, um unsere gemeinsame Zukunft zu besprechen, dreht sich die erste Diskussion um die Frage, ob unsere Aufgebote gemeinsam trainieren sollten. Dies wird auch das Gefühl der Brüderlichkeit zwischen den Stämmen stärken. Es gibt jedoch jene, die glauben, dass dies ein Trick von [ROOT.GetCountry.GetRuler.GetName] ist, um die Kontrolle über die Aufgebote an sich zu reißen."
 me_dahae.1902.a:0 "Um ihre Zustimmung bitten."
 me_dahae.1902.att:0 "Wir werden vorsichtig versuchen, alle zu überzeugen."
 me_dahae.1902.b:0 "Etwas Aufwand darauf verwenden."
 me_dahae.1902.btt:0 "Wir werden Druck ausüben, wodurch die Wahrscheinlichkeit einer Zustimmung steigt."

 me_dahae.2000.t:0 "Gemeinsame Ausbildung besprechen"
 me_dahae.2000.desc:0 "Der erste Punkt auf der Tagesordnung ist einfach, doch unsere Entscheidung wird wichtige Folgen für die Zukunft haben. Sollen wir einer gemeinsamen Ausbildung mit den anderen #E Dahae#!-Stämmen zustimmen?"
 me_dahae.2000.a:0 "Ich sehe darin kein Problem ... ja"
me_dahae.2000.b:0 "Solchen Bedingungen werden wir niemals zustimmen!"

me_dahae.20.t:0 "Das Steppengipfeltreffen – Antworten zur Ausbildung"
me_dahae.20.desc:0 "Die versammelten Stammesräte haben die von [ROOT.GetCountry.GetRuler.GetName] vorgebrachten Vorschläge unter vier Augen beraten, und nun ist die Zeit gekommen zu sehen, ob unsere diplomatischen Bemühungen Früchte tragen werden. Je nachdem, wie viele Länder einer gemeinsamen Ausbildung zugestimmt haben, erhält [ROOT.GetCountry.GetName] einen entsprechenden Bonus."
me_dahae.20.a:0 "Sehen wir, wie viele unserer Nachbarn weise sind."
me_dahae.20.a.tt1:0 "[attendee_1.GetName] von [attendee_1.GetCountry.GetName] @[attendee_1.GetCountry.GetFlag]! hat zugestimmt."
me_dahae.20.a.tt2:0 "[attendee_2.GetName] von [attendee_2.GetCountry.GetName] @[attendee_2.GetCountry.GetFlag]! hat zugestimmt."
me_dahae.20.a.tt3:0 "[attendee_3.GetName] von [attendee_3.GetCountry.GetName] @[attendee_3.GetCountry.GetFlag]! hat zugestimmt."
me_dahae.20.a.tt4:0 "[attendee_4.GetName] von [attendee_4.GetCountry.GetName] @[attendee_4.GetCountry.GetFlag]! hat zugestimmt."
me_dahae.20.b:0 "Das war ein völliger Fehlschlag, denn niemand hat zugestimmt."

me_dahae.21.t:0 "Das Steppengipfeltreffen – Gemeinsame Kultur besprechen"
me_dahae.21.desc:0 "Als Nächstes müssen wir darüber sprechen, was unsere Stämme miteinander verbindet, in der Hoffnung, alle davon zu überzeugen, dass wir in erster Linie alle Dahae sind."
me_dahae.21.a:0 "Um ihre Zustimmung bitten."
me_dahae.21.att:0 "Wir werden versuchen, alle behutsam zu überzeugen."
me_dahae.21.b:0 "Ein wenig Mühe in diese Sache investieren."
me_dahae.21.btt:0 "Wir werden Druck ausüben, was die Wahrscheinlichkeit einer Zustimmung erhöht."

me_dahae.2100.t:0 "Gemeinsame Kultur besprechen"
me_dahae.2100.desc:0 "Der nächste Punkt auf der Tagesordnung betrifft unsere kulturellen Verbindungen; sollen wir anerkennen, dass es eine gemeinsame #E Dahae#!-Identität gibt?"
me_dahae.2100.a:0 "Natürlich gibt es sie!"
me_dahae.2100.b:0 "Wir sind nicht dasselbe Volk; wir haben unsere Unterschiede."

me_dahae.22.t:0 "Das Steppengipfeltreffen – Antworten zur gemeinsamen Kultur"
me_dahae.22.desc:0 "Eine Antwort nach der anderen wird [ROOT.GetCountry.GetRuler.GetName] von den versammelten Stammesfürsten überbracht."
me_dahae.22.a:0 "Sehen wir, wer sich dem anschließen möchte."

me_dahae.23.t:0 "Das Steppengipfeltreffen – Die Konföderation besprechen"
me_dahae.23.desc:0 "Nach Tagen sorgfältiger Beratungen und nahezu endlosen Festgelagen stehen die versammelten Stammesfürsten vor der letzten Frage, dem eigentlichen Grund, weshalb sie nach [ROOT.GetCountry.GetCapital.GetName] gerufen wurden – soll die #E Dahae-Konföderation#! bestehen dürfen?"
me_dahae.23.a:0 "Um ihre Zustimmung bitten."
me_dahae.23.a.tt:0 "Wir werden versuchen, alle behutsam davon zu überzeugen, unserem Beispiel zu folgen."
me_dahae.23.b:0 "Ein wenig Mühe investieren! Es ist sehr wichtig."
me_dahae.23.b.tt:0 "Wir werden Druck auf die Stammesfürsten ausüben, was die Wahrscheinlichkeit einer Zustimmung erhöht."

me_dahae.2300.t:0 "Die Einigung besprechen"
me_dahae.2300.desc:0 "Wir haben eine eindringliche Bitte vom #E Stammesrat#! erhalten, eine Bitte, die das Schicksal von [ROOT.GetCountry.GetName] für kommende Generationen prägen wird. Sollen wir zustimmen, Teil der #E Dahae-Konföderation#! zu werden, oder sollen wir die Einladung ablehnen, uns mit unseren Nachbarn zu vereinen?"
me_dahae.2300.a:0 "Wer sind wir, uns der Geschichte in den Weg zu stellen? Ja."
me_dahae.2300.a.tt:0 "#R Das Spiel wird für uns enden.#!"
me_dahae.2300.b:0 "Auf keinen Fall!"
me_dahae.2300.b.tt:0 "#R [dahae_host.GetEmployer.GetName] wird Ansprüche auf unser Land erhalten!#!"

me_dahae.24.t:0 "Das Steppengipfeltreffen – Antworten zur Einigung"
me_dahae.24.desc:0 "Und mit der Klärung der letzten Frage neigt sich das Treffen der #E Dahae-Stämme#! dem Ende zu. Die Ältesten von [ROOT.GetCountry.GetCapital.GetName] können sich nicht daran erinnern, jemals eine #E Konferenz#! wie diese erlebt zu haben, und viele glauben, dass [ROOT.GetCountry.GetRuler.GetName] soeben [ROOT.GetCountry.GetAdjective] Geschichte geschrieben hat."
me_dahae.24.a:0 "Ich bin dazu bestimmt, noch Größeres zu vollbringen ..."
me_dahae.24.a.tt:0 "Stämme, die zugestimmt haben, werden zu unseren #T Stammesvasallen#!.\nWir erhalten #R Ansprüche#! auf Stämme, die uns abgelehnt oder nicht an der #Y Konferenz#! teilgenommen haben."
me_dahae.24.b:0 "Das ist ein Rückschlag, aber nur ein vorübergehender."
me_dahae.24.b.tt:0 "Die Konferenz ist #R gescheitert#!; niemand hat zugestimmt. Nun, offenbar müssen wir alle mit Bogen und Huf von unserer Sache überzeugen ..."

me_dahae.25.t:0 "Der Aufstieg des Arsakes"
me_dahae.25.desc:0 "Mit der vollendeten Einigung der #E Dahae#!-Stämme stehen auch große gesellschaftliche Veränderungen bevor, und [ROOT.GetCountry.GetRuler.GetName] ist bestens darauf vorbereitet, diese chaotischen Zeiten zu seinem Vorteil zu nutzen. Unser [ROOT.GetCountry.GetRulerTitle] wird zusammen mit seiner gesamten Familie neue Namen annehmen, damit sie für alle Zeiten in die Annalen der Geschichte eingehen können.\n\nWährend sich die Stammesangehörigen von [ROOT.GetCountry.GetName] an die vielen Veränderungen gewöhnen, die über sie hereingebrochen sind, können wir diese Gelegenheit auch nutzen, um unsere Hauptstadt erheblich auszubauen und zu einem geeigneten Lager zu machen, von dem aus wir herrschen, oder wir können näher an die sesshaften Provinzen heranrücken, in der Hoffnung, unsere Ziele voranzutreiben."
me_dahae.25.a:0 "Verlegen wir die Hauptstadt näher an unsere nächste Beute."
me_dahae.25.a.tt:0 "Parthaunisa erhält #T 3 Bürger#!."
me_dahae.25.b:0 "Unsere Hauptstadt soll zum Zentrum unserer Herrschaft werden."
me_dahae.25.b.tt:0 "Unsere Hauptstadt erhält einen #G Modifikator, der den Geländemalus#! für die Bevölkerungskapazität aufhebt und einen zusätzlichen #G Bonus von 10 %#! auf die #Y Bevölkerungskapazität#! gewährt."
me_dahae.25.b.tt2:0 "Unsere Hauptstadt erhält #T 3 Bürger#!."

me_dahae.27.t:0 "Investitionen in Verbündete"
me_dahae.27.desc:0 "[ROOT.GetCountry.GetRuler.GetName] hat vorgeschlagen, dass unsere Ingenieure gemeinsam mit unserem Verbündeten ein #E Sklavengut#! errichten; wir übernehmen nur die Hälfte der Kosten und teilen unser technisches Wissen und unsere Erfahrung mit unseren Freunden. Dieser Unternehmergeist und dieses Engagement werden unseren Ruf unter den #E Dahae#!-Stämmen sicherlich verbessern."
me_dahae.27.a:0 "[dahae_jv1.GetName] wird sich sicherlich freuen!"
me_dahae.27.a.tt:0 "[dahae_jv1.GetName] erhält in einer zufälligen Provinz ein #T Sklavengut#!."

me_dahae.100.t:0 "$dahae_missions_1$"
me_dahae.100.desc:0 "Auch wenn unser Lebensstil hart sein mag, sind wir keine Monster; auch wenn unser Ehrgeiz groß sein mag, ist er nicht unkontrollierbar.\n\nAuch wenn [ROOT.GetCountry.GetRuler.GetName] unsere Nachbarstämme vereinen möchte, um für uns alle Größeres zu erreichen, muss [ROOT.GetCountry.GetRuler.GetSheHe] zunächst ernsthaft darüber nachdenken, ob der Weg dorthin das Vergießen des Blutes unserer Verwandten erfordert. Soweit [ROOT.GetCountry.GetRuler.GetFirstName] weiß, blicken unsere Nachbarn nachts zu denselben Sternen auf und träumen dieselben Träume wie wir; wir sind nicht die Einzigen, die sich ein Leben jenseits von Sattel und Steppe wünschen.\n\nDoch auch das Gegenteil könnte wahr sein, und unsere Vettern könnten nicht vertrauenswürdig sein – ein Dorn in unserem Rücken, wo wir eigentlich eine helfende Hand erwarten würden. Sollte dies der Fall sein, dann sollte [ROOT.GetCountry.GetRuler.GetFirstName] sie besser wie elende Mäuse unter [ROOT.GetCountry.GetRuler.GetHerHis] Hufen zerquetschen. Wir müssen ihre wahren Absichten herausfinden, bevor es viel zu spät ist."
me_dahae.100.a:0 "Ein echtes Dilemma ..."

me_dahae.101.t:0 "[c1_scope.GetName] erobern"
me_dahae.101.desc:0 "Die Folgen der Schlachten zwischen unseren [ROOT.GetCountry.GetAdjective] Reitern und den erbärmlichen [c1_scope.GetAdjective] Ponyreitern werden noch Generationen später in Liedern besungen werden. Obwohl sie tapfer zusammenstanden, in der Hoffnung, ihre Freiheit zu bewahren, stürzten sich die Armeen von [ROOT.GetCountry.GetRuler.GetName] auf die Truppen von [c1_scope.GetName|E] und zerstreuten sie wie Asche im Wind.\n\nDas Gemetzel war so groß, dass viele Feinde tot von den Rücken ihrer Reittiere fielen. Es heißt, dass diese reiterlosen Pferde, ihre Augen vor Schrecken weit aufgerissen und ihre Felle mit Schaum bedeckt, über die weiten Grasländer der Steppe galoppierten und ihre Satteltaschen hinter sich herzogen."
me_dahae.101.a:0 "Wer sich mir entgegenstellt, wird ein Schicksal erleiden, das schlimmer ist als der Tod!"

me_dahae.102.t:0 "Alle [c2_scope.GetAdjective]-Ländereien besitzen"
me_dahae.102.desc:0 "[c2_scope.GetName] fällt unseren Armeen zum Opfer, und eine Prozession der Besiegten tritt vor [ROOT.GetCountry.GetRuler.GetName]. Die Luft ist erfüllt vom Wehklagen der Gefangenen, und der [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] beobachtet mit kaltem Desinteresse, wie sie um Gnade flehen, unbeeindruckt von dieser erbärmlichen Vorstellung.\n\nWenige Augenblicke später entsteht am Ende der Reihe ein lautes Durcheinander. Unsere wütenden Soldaten treiben die Menge auseinander und zerren einen Gefangenen vor [ROOT.GetCountry.GetRuler.GetFirstName]. Dieser Unruhestifter, ein Mann namens [SCOPE.sChar('dahae_warrior_scope').GetFirstName], ein ehemaliger Soldat der [c2_scope.GetAdjective] Armeen, bietet eine große Summe Gold im Austausch für den Schutz seiner Familie.\n\nUm ehrlich zu sein, könnte [ROOT.GetCountry.GetRuler.GetFirstName] das Schicksal einer weiteren Gruppe besiegter Menschen kaum weniger kümmern, doch das angebotene Geld lässt [ROOT.GetCountry.GetRuler.GetHerHis] Augenbraue hochziehen."
me_dahae.102.a:0 "Heute ist dein Glückstag, [SCOPE.sChar('dahae_warrior_scope').GetFirstName] ..."
me_dahae.102.b:0 "Zeigt keine Gnade mit dem Dahae-Hund."
me_dahae.102.tt:0 "Die Aufgabe wurde abgeschlossen!"

me_dahae.103.t:0 "$dahae_missions_4$"
me_dahae.103.desc:0 "Als unsere Armeen durch die Gebiete zogen, die einst von den #E [c3_scope.GetName]ns#! gehalten wurden, waren unsere Pferde wohlgenährt und unsere Männer wurden mit Großzügigkeit und offenen Armen empfangen – alles, was ihre Herzen begehrten, wurde ihnen gegeben, ohne eine Gegenleistung zu erwarten.\n\nEs scheint, dass nicht alle unter den #E Dahae#!-Stämmen unserer Vision gegenüber blind sind, und die Stammesangehörigen von [c3_scope.GetName] scheinen anzuerkennen, dass nur die mächtigen [ROOT.GetCountry.GetAdjective] über die nötigen Mittel verfügen, sie vom Trinken von Stutenmilch dazu zu bringen, von den schönsten Dienern bewirtet zu werden; vielleicht sollten wir nach unseren zukünftigen Eroberungen [c3_scope.GetAdjective] unter den anderen Stämmen am großzügigsten belohnen ..."
me_dahae.103.a:0 "Das sehen wir gerne."

me_dahae.104.t:0 "$dahae_missions_5$"
me_dahae.104.desc:0 "Die [ROOT.GetCountry.GetAdjective] Armee schlägt ihre Feinde erneut vernichtend. Wir sind schneller, wendiger und besser organisiert als unsere Nachbarn, trotz unserer größeren Anzahl, und die anderen [GetCulture('derbiccan').GetName]-Stämme sind uns nicht gewachsen. [ROOT.GetCountry.GetRuler.GetName] erweist sich schnell als der wahre Anführer unserer Konföderation, und die Ambitionen geringerer Stammesfürsten liegen im Schmutz, umgeben vom Blut und den Gliedmaßen ihrer treuesten Anhänger.\n\nUnsere Siege sind so beeindruckend, dass die Fremden dieser Länder sich uns sofort unterordnen und unsere Lebensweise übernehmen. Zahlreiche Siedler folgen den Spuren unserer Armeen, überzeugt davon, dass unsere Siege ihnen in den von uns unterworfenen Gebieten neue Möglichkeiten eröffnen werden."
me_dahae.104.a:0 "Auf zur nächsten Eroberung ..."

me_dahae.105.t:0 "$dahae_missions_7$"
me_dahae.105.desc:0 "[ROOT.GetCountry.GetCapital.GetName] wirkt heutzutage wie ein Handelszentrum; so viele Gesichter werden fortgeschickt und so viele kommen an. Doch wir sind kein Händlervolk, und diejenigen, die fortgehen, werden weggeschickt und verbannt, während die Ankommenden Loyalisten der Konföderation sind, die nun über alle Gebiete der [GetCulture('derbiccan').GetName] herrscht. [SCOPE.sChar('dahae_arbitrator').GetName], der mit der #E Schlichtung#! betraute Mann, der dafür sorgen soll, dass unsere Pläne reibungslos umgesetzt werden, scheint recht stolz auf [SCOPE.sChar('dahae_arbitrator').GetHerHis] Arbeit zu sein.\n\nPolitisch ist es keine leichte Aufgabe, unseren Stammesrat effektiv regieren zu lassen, da wir unser Gebiet mehr als verdreifacht haben und die Menschen, über die wir herrschen, nicht erwarten, allzu lange auf derselben Weide zu grasen. Trotz der Schwierigkeiten, die die Verwaltung nomadischer Horden mit sich bringt, haben wir große Fortschritte bei der Vereinigung der Stämme gemacht, und [ROOT.GetCountry.GetRuler.GetFirstName] ist mit [SCOPE.sChar('dahae_arbitrator').GetFirstName] zufrieden."
me_dahae.105.a:0 "Diesmal hast du dich wirklich selbst übertroffen."

me_dahae.106.t:0 "$dahae_missions_8$"
me_dahae.106.desc:0 "Während der Koch mit der Menge an Arbeit, die er in letzter Zeit hatte, sehr zufrieden ist, würde die astronomische Rechnung für all die Festgelage von [ROOT.GetCountry.GetRuler.GetName] jeden zum Weinen bringen. Die ungeheure Menge an Tieren, die für diese kleinen Festgelage gejagt werden musste, hat manche Gegenden völlig von Leben entvölkert – eine bemerkenswerte Leistung.\n\nAbgesehen von diesen Kleinigkeiten scheint [ROOT.GetCountry.GetRuler.GetFirstName] jedoch zufrieden zu sein, und [ROOT.GetCountry.GetRuler.GetHerHis] Gefährten verlassen die Festzelte nicht nur schwankend, sondern lachen laut und singen Kriegslieder. Diese Krieger werden den Rest der Nacht am Feuer verbringen, weiteren Wein trinken und den Namen des großzügigen [ROOT.GetCountry.GetRuler.GetFirstName] preisen. Derartige Zurschaustellungen von Reichtum brennen unseren Stammesangehörigen ein, dass [ROOT.GetCountry.GetName] in der Lage sein wird, sie angemessen zu behandeln und weit zu führen."
me_dahae.106.a:0 "Wir legen noch einen drauf."
me_dahae.107.t:0 "$dahae_missions_9$"
me_dahae.107.desc:0 "Es ist zwar leicht genug, unseren Verwandten Alkohol und schöne Tänzerinnen anzubieten, um ihre Loyalität zu erkaufen, doch die anderen Stämme dazu zu bringen, uns vollkommen zu vertrauen, ist ein weitaus heiklerer Prozess. Unsere Nachbarn davon zu überzeugen, ihre Meinung über uns zu ändern, ist keine leichte Aufgabe, insbesondere da jeder Stamm aus zahlreichen Clans besteht. Unser oberster Schlichter [SCOPE.sChar('dahae_arbitrator2').GetName] arbeitet lange Tage und ist von [SCOPE.sChar('dahae_arbitrator2').GetHerHis] Bemühungen erschöpft. Wenn gerade keine Einzelheiten der Verträge besprochen werden, die wir aushandeln, liegt [SCOPE.sChar('dahae_arbitrator2').GetHerHis] lieber im Zelt herum.\n\nZwischen den Besuchen unserer Gesandten, dem Empfangen und Verteilen von Geschenken und der Überwachung der Opfergaben an [GetDeityDefinition('omen_patampasa').GetName] tun die Diplomaten von [ROOT.GetCountry.GetName] alles in ihrer Macht Stehende, um sicherzustellen, dass ein dauerhafter Frieden über den Steppen einkehrt."
me_dahae.107.a:0 "Jeder Preis, den wir zahlen müssen, ist sein Gewicht in Gold wert!"

me_dahae.108.t:0 "$dahae_missions_14$"
me_dahae.108.desc:0 "[ROOT.GetCountry.GetRuler.GetName] ist nun der unangefochtene Herrscher eines gewaltigen Reiches, und viele zerschlagene Stämme unterwerfen sich der Herrschaft von [ROOT.GetCountry.GetCapital.GetName]. Unsere einstigen Feinde sind nun Werkzeuge für unsere größeren Vorhaben – alles nur, weil sie [ROOT.GetCountry.GetRuler.GetFirstName]s Gnade ablehnten und nun zu [ROOT.GetCountry.GetRuler.GetHerHis] Füßen liegen und um Gnade flehen. Die Launen von [ROOT.GetCountry.GetRuler.GetFirstName] sind ihnen Befehl, und die Stammesangehörigen der widerspenstigen [GetCulture('derbiccan').GetName]-Clans haben durch ihre Unruhe und Unwissenheit ihre Freiheit verspielt, als sie versuchten, sich [ROOT.GetCountry.GetName] entgegenzustellen.\n\n[SCOPE.sChar('dahae_warman').GetName], unser unvergleichlicher #E Kriegshäuptling#!, war maßgeblich dafür verantwortlich, die eroberten Stämme unter Kontrolle zu halten und sie in unsere größere Armee einzugliedern. Es war eine schwierige Aufgabe, und die Art und Weise, wie sie ausgeführt werden musste, brachte [SCOPE.sChar('dahae_warman').GetHerHim] einen ziemlich üblen Spitznamen ein. Auch wenn die Bemühungen von [SCOPE.sChar('dahae_warman').GetFirstName] [SCOPE.sChar('dahae_warman').GetHerHim] nicht viele Freunde eingebracht haben, müssen wir dafür sorgen, dass sich der Zorn dieser Reiter gegen den Feind richtet, dem sie gegenüberstehen, und nicht gegen uns."
me_dahae.108.a:0 "Trag den Titel mit Stolz, [SCOPE.sChar('dahae_warman').GetFirstName] – dein Name wird für viele Zeitalter in Erinnerung bleiben."

me_dahae.109.t:0 "$dahae_missions_15$"
me_dahae.109.desc:0 "Wohlwollen liegt uns nicht besonders; wir sind Plünderer, die Geißel der Zivilisation, und wir wollen nicht für unsere Freundlichkeit bekannt sein. Da wir beschlossen haben, nicht einfach unsere eigenen Verwandten abzuschlachten, sehen wir uns nun gezwungen, ihnen Honig ums Maul zu schmieren – [ROOT.GetCountry.GetRuler.GetName] wird dabei an die unbeholfene Art erinnert, mit der ein unerfahrener Liebhaber versucht, seine neue Geliebte zu bezaubern.\n\nDennoch ist es uns gelungen, einen Weg zu finden, das zu verbinden, worin wir gut sind, mit dem, was wir tun müssen. Indem wir den Bau eines #E Sklavenguts#! in [dahae_jv1.GetName] unterstützen, haben wir unserem Verbündeten einen Ort geschenkt, an dem die geplünderten Seelen seiner Eroberungen untergebracht werden können. Welch glückliche Verbindung! Wir sollten unsere Interessen und Ziele öfter miteinander verbinden."
me_dahae.109.a:0 "Ich freue mich auf die Zusammenarbeit mit dir, [dahae_jv1.GetRuler.GetName]."

me_dahae.110.t:0 "$dahae_missions_16$"
me_dahae.110.desc:0 "Wie ehemalige Rivalen, die gemeinsam eine Mahlzeit genießen, haben die [GetCulture('derbiccan').GetName]#E s#! ihre kleinlichen Differenzen und alten Feindschaften beiseitegelegt, und nun stehen ihre Pferde Seite an Seite, bereit, die größten Imperien niederzutrampeln.\n\nEs ist ein herzerwärmender Anblick zu sehen, wie die Bande der Verwandtschaft zwischen unseren Völkern wachsen; eine starke Verbindung, geschmiedet aus Widrigkeiten, die die Müßiggänger der Zivilisation in ihrem bequemen Leben niemals erreichen könnten."
me_dahae.110.a:0 "Vorwärts, wir reiten!"

Tasks

dahae_missions:0 "Dahae-Konföderation"
dahae_missions_DESCRIPTION:0 "Östlich von [GetProvince('(int32)4571').GetName] liegt eine gewaltige, aber öde [GetTerrainType('steppes').GetName], die von Menschen bewohnt wird, die #E ostiranische#! Sprachen sprechen. Unser Reich ist schwer zu durchqueren; Wasser ist schwieriger zu finden als ein freundliches Gesicht, und die endlosen Steppen bieten keinen Schutz vor der brennenden Hitze der Sonne. So ist es nur passend, dass die Härte dieser Umgebung die stolzen und widerstandsfähigen #E [ROOT.GetCountry.GetAdjective]#! Stämme hervorgebracht hat.\n\nIn den Schriften der zivilisierten Völker heißt es, dass wir mit einem Bogen in der Hand auf dem Rücken unserer Pferde geboren werden und unsere Ausbildung erst endet, wenn auch unser Atem endet – eine Vorstellung, die [ROOT.GetCountry.GetRuler.GetName] keineswegs zu widerlegen beabsichtigt.\n\nViele Bewohner von [ROOT.GetCountry.GetCapital.GetName] glauben, dass die Steppenstämme, wenn sie irgendwie vereint werden könnten, die Welt verändern könnten, die nach dem Tod von #E Alexander dem Großen#! zurückblieb. Der kühne [ROOT.GetCountry.GetRuler.GetFirstName] hat geschworen, dafür zu sorgen, dass dies Wirklichkeit wird."
dahae_missions_CRITERIA_DESCRIPTION:0 "Diese Mission ist abgeschlossen, sobald wir die [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName|E]-Stämme vereint haben – entweder durch Gewalt oder Diplomatie."
dahae_missions_BUTTON_TOOLTIP:0 "Ich werde die Dahae-Clans unter meinem Banner vereinen!"
dahae_missions_BUTTON_DETAILS: ""

dahae_missions_1:0 "Versammlung der Clans"
dahae_missions_1_DESC:0 "Unser Stamm besteht aus vielen Clans, die unterschiedliche Vorstellungen davon haben, wie das Ziel der #E Einigung#! erreicht werden soll. Wir müssen uns mit ihnen treffen, um unser weiteres Vorgehen zu bestimmen. \n\n\n\n\n\n\n\n\n\n@persia_mil17!"
dahae_missions_1.tt:0 "Wir erhalten die Wahl, unseren Ansatz zur #Y Einigung#! festzulegen: #R Gewalt#! oder #G Diplomatie#!."

dahae_missions_2:0 "[c1_scope.GetName] erobern"
dahae_missions_2_DESC:0 "[c1_scope.GetName|G] muss fallen, damit wir unseren ersten Schritt in Richtung #Y Einigung#! machen können. Versammelt unsere tapferen Krieger und lasst sie wissen, dass die Stunde der Schlacht naht!\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
dahae_missions_2.tt:0 "Alle [c1_scope.GetAdjective|G]-Ländereien besitzen."

dahae_missions_3:0 "Alle #E [c2_scope.GetAdjective]#!-Ländereien besitzen"
dahae_missions_3_DESC:0 "Wir müssen unsere Suche nach #Y Einigung#! fortsetzen und jeden unterwerfen, der sich uns in den Weg stellt, denn dies ist der Wille der Götter. Die Zeit ist gekommen, die hochmütigen Krieger von [c2_scope.GetName|G] zu vernichten. \n\n\n\n\n\n\n\n\n\n@persia_mil15!"
dahae_missions_3.tt:0 "Alle [c2_scope.GetAdjective|G]-Ländereien besitzen."

dahae_missions_4:0 "[c3_scope.GetName] erobern"
dahae_missions_4_DESC:0 "Da wir uns der Vollendung unseres Ziels nähern, müssen wir den #E #G [c3_scope.GetName]ns#!#! noch ihren Platz zeigen. \n\n\n\n\n\n\n\n\n\n@persia_mil16!"
dahae_missions_4.tt:0 "Alle [c3_scope.GetAdjective|G]-Ländereien besitzen."

dahae_missions_5:0 "[c4_scope.GetName] beenden"
dahae_missions_5_DESC:0 "Die [c4_scope.GetAdjective]-Stammesangehörigen stehen uns weiterhin im Weg, und sie werden nicht diejenigen sein, die unsere Einigung verhindern – die Zeit ist gekommen, sie zu vernichten. \n\n\n\n\n\n\n\n\n\n@persia_mil20!"
dahae_missions_5.tt:0 "Alle [c4_scope.GetAdjective|G]-Ländereien besitzen."

dahae_missions_6:0 "Steppenpferde züchten"
dahae_missions_6_DESC:0 "Um mit unseren Plänen Erfolg zu haben, müssen wir sicherstellen, dass wir über einen ausreichenden Bestand unserer mächtigsten Waffe verfügen: #Y Steppenpferde#! @steppe_horses! . \n\n\n\n\n\n\n\n\n\n@persia_mil13!"
dahae_missions_6.att:0 "In einer beliebigen eigenen Provinz mindestens 2 #Y Steppenpferde @steppe_horses!#! produzieren."
dahae_missions_6.btt:0 "Für #Y 10#! Jahre zwischen einem #R offensiven#! oder #G defensiven#! Bonus für eure Reitereinheiten entscheiden."

dahae_missions_7:0 "Die Stämme stabilisieren"
dahae_missions_7_DESC:0 "Da unsere Mission nun abgeschlossen ist, müssen wir für Stabilität sorgen, damit unsere noch junge #Y Konföderation#! Bestand haben kann. \n\n\n\n\n\n\n\n\n\n@persia_mil2!"

dahae_missions_8:0 "Verbindungen knüpfen"
dahae_missions_8_DESC:0 "Um unsere großen Pläne zur #E Einigung#! der [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName|E] zu verwirklichen, müssen wir Verbindungen zu unseren Gleichgestellten knüpfen. Schließlich ist der erste Eindruck wichtig! \n\n\n\n\n\n\n\n\n\n@persia_mil11!"

dahae_missions_9:0 "Mit den benachbarten Stämmen anfreunden"
dahae_missions_9_DESC:0 "Die Beziehungen zwischen den [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName|G]-Stämmen müssen so herzlich wie möglich sein, wenn wir unser Ziel der Einigung erreichen wollen. \n\n\n\n\n\n\n\n\n\n@persia_mil19!"

dahae_missions_10:0 "Dahae-Ländereien verteidigen"
dahae_missions_10_DESC:0 "Um zum Anführer der stolzen #E Dahae#! zu werden, müssen wir unsere Stärke und unser Engagement unter Beweis stellen, indem wir andere Stämme verteidigen. \n\n\n\n\n\n\n\n\n\n@persia_mil12!"
dahae_missions_10.tt:0 "#R Wir werden einen Stamm in der Region dazu verleiten, einen unserer unschuldigen, brüderlichen Dahae-Stämme anzugreifen#! – und wir können ihn verteidigen."

dahae_missions_11:0 "Steppenfalknerei"
dahae_missions_11_DESC:0 "Kontakte zu knüpfen kann viel dazu beitragen, alle von unserer Sichtweise zu überzeugen – warum also nicht eine #Y Falknerjagd#! veranstalten.\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
dahae_missions_11.tt:0 "Wir werden eine #Y Falknerjagd#! veranstalten, zu der wir andere [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName|G] Stammesführer einladen.\nDies wird unsere Beziehungen und unser Ansehen bei anderen Stammesführern verbessern, und wenn wir die Jagd gewinnen, können wir zusätzliche Belohnungen erhalten."

dahae_missions_12:0 "Der Gipfel der Steppe"
dahae_missions_12_DESC:0 "Da die Diplomatie auf allen Seiten in die Wege geleitet wurde, bleibt nur noch, die anderen Anführer zu versammeln, um ihnen unseren Vorschlag für die Zukunft zu unterbreiten.\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
dahae_missions_12.tt1:0 "Wir benötigen mindestens 5 #G Dahae-Hegemonie #!(Derzeit: #Y [root_scope.MakeScope.GetVariable('dahae_hegemony').GetValue|0]#!)"
dahae_missions_12.tt2:0 "Wir werden ein Treffen einberufen, bei dem wir versuchen werden, die anderen Stämme davon zu überzeugen, der Gründung der #G Dahae-Konföderation#! zuzustimmen.\n\nIhre Zustimmungswahrscheinlichkeit hängt von ihrer Meinung über uns und davon ab, ob die Herrscher miteinander befreundet sind.\n#E Alle Stämme müssen zustimmen#!, andernfalls wird die Konferenz scheitern und wir müssen sie #R erobern#!."

dahae_missions_13:0 "Dahae-Konföderation"
dahae_missions_13_DESC:0 "Endlich haben die Armeen von [ROOT.GetCountry.GetName|G] das einst für unmöglich gehaltene Unterfangen vollbracht und die mächtigen #G Dahae#!-Stämme vereinigt. Heil sei [ROOT.GetCountry.GetRuler.GetName|Y], dem mächtigen [ROOT.GetCountry.GetRulerTitle], der alle zerschmettert hat, die sich der [ROOT.GetCountry.GetAdjective|G] Herrschaft widersetzten!\n\n\n\n\n\n\n\n\n\n@persia_mil21!"
dahae_missions_13.tt:0 "Wir haben die #G Dahae-Konföderation#! gegründet."
dahae_missions_13.tt1:0 "Wir benötigen mindestens 10 #G Dahae-Hegemonie #!(Derzeit: #Y [root_scope.MakeScope.GetVariable('dahae_hegemony').GetValue|0]#!)"
dahae_missions_13.tt2:0 "Die Familie unseres Häuptlings, der #G [root_scope.GetRuler.GetFamily.GetName]-Clan#!, wird fortan als die #BOLD;COLOR:{0.6,0.13,0.98} Arsakiden-Dynastie#! bekannt sein.\nWir erhalten einen permanenten Modifikator für unsere Hauptstadt und bekommen die Möglichkeit, sie zu verlegen."

dahae_missions_14:0 "Die Eroberten ausbeuten"
dahae_missions_14_DESC:0 "Wehe den Besiegten! Sie sollen Arbeitskräfte für unsere zukünftigen Unternehmungen bereitstellen.\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
dahae_missions_14.tt:0 "Alle Gebiete, die zuvor von anderen #G Dahae#!-Stämmen gehalten wurden, erhalten den Modifikator [GetModifier('dahae_squeezed_ter').GetName|Y]. Dieser gewährt diesen Gebieten [GetModifier('dahae_squeezed_ter').GetDesc] für #Y 10 Jahre#!."

dahae_missions_15:0 "Gemeinsame Investitionen"
dahae_missions_15_DESC:0 "Es könnte sich lohnen, als Zeichen der Freundschaft den Bau eines [GetBuilding('latifundia_building').GetName|Y] bei einem verbündeten Stamm zu finanzieren, wobei wir die Hälfte der Kosten übernehmen.\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
dahae_missions_15.tt:0 "Wir haben beschlossen, ein gemeinsames Unternehmen mit einem anderen Dahae-Stamm einzugehen."

dahae_missions_16:0 "Gleichheit der Dahae"
dahae_missions_16_DESC:0 "Alle #E Dahae#! sind durch #G Diplomatie#! vereint – eine Tatsache, die sicherlich alle innerhalb unserer neuen Grenzen erfreuen wird!\n\n\n\n\n\n\n\n\n\n@persia_mil1!"


