l_german:
  
  #################### 
  # Title Done 18.09.2026 - 1.12 - Hephaestus
  #################### 
  
 eburonian_missions_01: "Tapferste der Gallier!"
 eburonian_missions_01_DESCRIPTION: "In der nördlichen Region Galliens, weit weg von den sanften, zivilisierten Ländern des Mittelmeers, leben die wilden Belgae. Sie sind von feindlichen Stämmen umgeben. Die gefürchteten Germanen im Osten überqueren oft den Rhenus, um sie überfallen, und die Gallier im Westen sind keine Freunde der Belgae, sondern Rivalen um die Macht.\n\nWährend im Süden Vereinigungskriege toben und Könige und Feldherren darum ringen, ein zerrissenes Reich wieder zusammenzufügen, kämpfen auch die Belger um die Gründung ihres Staates – nur die Zeit wird zeigen, wer von sich behaupten kann, der tapferste unter den Galliern zu sein."
 eburonian_missions_01_CRITERIA_DESCRIPTION: "Diese Mission wird abgeschlossen sein, wenn Eburonia seine belgischen Rivalen besiegt und ein mächtiges Königreich im Norden errichtet hat."
 eburonian_missions_01_BUTTON_TOOLTIP: "'Unter all diesen (Galliern) sind die Belger die tapfersten. Sie wohnen nämlich am weitesten entfernt von der Kultur und Zivilisation der römischen Provinz.'- Julius Caesar""
 eburonian_missions_01_BUTTON_DETAILS: ""
  
  #################### 
  # Mission Tasks 
  #################### 
  
 eburonian_missions_task_1: "Die südliche Strategie"
 eburonian_missions_task_1_DESC: "Nun, da wir uns entschieden haben, dürfen wir keine Zeit mehr verlieren – machen wir uns bereit, unsere Nachbarn im Süden anzugreifen, bevor sie von unseren Plänen erfahren.\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
  
 eburonian_missions_task_2: "Menapische Forderungen"
 eburonian_missions_task_2_DESC: "Die nördlichen Küstengebiete sind die Heimat der Menapianer, aber hoffentlich wird dieser Fehler bald korrigiert; Bereiten Sie unsere Männer vor und weist sie an, sie sollen unsere Nachbarn darüber informieren, dass ihre Wahl Tod oder Knechtschaft ist.\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
  
 eburonian_missions_task_3: "Einen Nervii treffen"
 eburonian_missions_task_3_DESC: "Während sich in ganz #E Belgica#! die Nachricht über den Feldzug von [ROOT.GetCountry.GetRuler.GetName] verbreitet, zittern unsere Feinde und fragen sich, ob sie die nächsten sein werden, die sich den eburonischen Armeen stellen werden. Während unsere Freunde aus der Ferne in unsere Hauptstadt reisen und freiwillig ihre Dienste anbieten, in der Hoffnung, etwas Ruhm für sich zu beanspruchen. \n\n#Y Ein Charakter mit außergewöhnlich hoher Kriegskunst @military_icon! wird sich eurer Sache anschließen.#!\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
  
 eburonian_missions_task_4: "Belgische Sklaven"
 eburonian_missions_task_4_DESC: "Unsere anhaltenden Feldzüge gegen die benachbarten Stämme sind erfolgreich und sorgen dafür, dass unsere Siedlungen und Werkstätten mit Sklaven gefüllt sind, die zum Ruhm von #E Eburonia#! arbeiten.\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
  
 eburonian_missions_task_5: "Mare Germanicum"
 eburonian_missions_task_5_DESC: "Der Hafen von [GetProvince('(int32)3026').GetName] wäre eine schöne Ergänzung zu den ständig wachsenden Beständen der gefürchteten #E Eburonen#! -  mittlerweile sollten sie wissen, was wir erwarten, wenn unsere Diplomaten an ihrem Hof eintreffen.\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
  
 eburonian_missions_task_6: "Etwas, worauf man stolz sein kann"
 eburonian_missions_task_6_DESC: "[ROOT.GetCountry.GetRuler.GetName] hat zu einer vorübergehenden Einstellung unserer Kriege im Ausland aufgerufen, damit wir feiern können, was wir gewonnen haben. Während einige mit dem Urteil, unsere Stammesheimat zu verlassen, unzufrieden sind, wurde entschieden, dass wir den Rhenus verlassen werden, um an die Küste des Mare Germanicum zu ziehen - eine neue Hauptstadt für eine neue Nation, geschmiedet durch Eisen und Willen.\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 random_belgae_port_bonus: "#Y Unsere Häfen in der#! #T Region Belgica#! #Y erhalten einen dauerhaften Handelsmodifikator.#!" 
  
 eburonian_missions_task_7: "Belgica beanspruchen"
 eburonian_missions_task_7_DESC: "Auch wenn unser Volk nach so vielen Jahren endloser Feldzüge erschöpft ist, dürfen wir unsere heiligen Gelübde nicht vergessen und müssen weiter voranschreiten – unsere Heere dürfen keine Ruhe finden, bis wir ganz Belgica für uns erobert haben! Marschiert zum Fluss Sequana!\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
  
 eburonian_missions_task_8: "Britannische Händler"
 eburonian_missions_task_8_DESC: "Die Insel #E [GetProvince('(int32)2022').GetArea.GetRegion.GetName]#! ist die Heimat seltsamer und wilder Stämme, und obwohl ihre Lebensweise sich sehr von unserer unterscheidet, sind wir begierig auf ihre feinen Handelsgüter und möchten unsere wirtschaftlichen Verbindungen zu den Inselbewohnern ausbauen ... doch wir benötigen eine geeignete Flotte, wenn wir die Gewässer überqueren wollen.\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
  
 eburonian_missions_task_9: "Stadt der Eburonen"
 eburonian_missions_task_9_DESC: "Reisender, hast du schon von der Stadt #E Cortoriacum#! gehört, der Hauptstadt, die von den frommen Eburonen im Norden errichtet wurde? Man könnte durch ganz #E Gallien#! wandern, bevor man eine andere Stadt wie diese fände – viele glauben, die Eburonen seien nur zum Kriegführen fähig, doch das Wachstum ihrer Stadt beweist das Gegenteil.\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 random_belgae_port_bonus2: "#Y Einer unserer Häfen in der#! #T Region Belgica#! #Y erhält einen dauerhaften Handelsmodifikator.#!"  
  
 eburonian_missions_task_10: "Tapferster der Belgae"
 eburonian_missions_task_10_DESC: "Es ist wahr, dass unser Volk den Krieg und die in der Schlacht errungenen Auszeichnungen liebt – nichts macht die Eburonen glücklicher, als eine Geschichte über die tapferen Taten ihrer Krieger zu hören.\n\nDies gilt auch für das Privatleben ihrer Anführer; ein Stammeshäuptling darf keine Scheu haben, Feinde zu besiegen, wo immer sie sich befinden, selbst im Zweikampf.\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
  
 eburonian_missions_task_11: "Bienenfarmen von Traiectus"
 eburonian_missions_task_11_DESC: "Viele sind fassungslos zu hören, dass die wilden Eburonen, die auf dem Schlachtfeld ihresgleichen suchen und einen erschreckenden Ruf haben, Honig überaus mögen, ihr Fleisch süßen und auch so viel Met wie möglich brauen. Es sollte daher nicht überraschen, dass sie in #E Traiectus#! Bienenstöcke bauen.\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
  
 eburonian_missions_task_12: "Ganuentianische Piraten"
 eburonian_missions_task_12_DESC: "#E Ganuenta#! war schon lange bevor wir Eburonen hier ankamen die Heimat von Piraten, doch anstatt die niederträchtigen Banditen zu vertreiben, haben wir beschlossen, unsere Untermieter willkommen zu heißen – schließlich gibt es keinen Grund, warum wir nicht zusammenarbeiten sollten.\n\n\n\n\n\n\n\n\n\n@@egypt_mil6!"
  
 eburonian_missions_task_13: "Harenatium am Rhenus"
 eburonian_missions_task_13_DESC: "Obwohl wir unsere ehemalige Hauptstadt für eine neue, geplante Stadt an der Küste aufgegeben haben, heißt das nicht, dass [GetProvince('(int32)3712').GetName] zu einem abgelegenen Ort geworden ist; ganz im Gegenteil. Es scheint, als hätte die Verlegung des Regierungssitzes der Stadt nur noch mehr neue Möglichkeiten eröffnet\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
  
 eburonian_missions_task_14: "Barbarische Weisheit"
 eburonian_missions_task_14_DESC: "In der Erkenntnis, dass die Zukunft von [ROOT.GetCountry.GetName] auf einem Fundament aufgebaut werden muss, das stärker ist als nur die Unterwerfung unserer Feinde, wurde die Entscheidung getroffen, [GetProvince('(int32)3675').GetName] in eine Stadt zu verwandeln, die es mit jeder Hauptstadt aufnehmen kann. Wir müssen die Infrastruktur schaffen, die es unserem Volk ermöglicht, weise und stark zu werden – wir müssen Cortoriacum zu einem Ort machen, an dem es sich zu leben lohnt.\n\n\n\n\n\n\n\n\n\n@event_pic13!"
  
 eburonian_missions_task_16: "Die Zukunft der Belgae"
 eburonian_missions_task_16_DESC: "Nun, da wir in diesem Moment des vollständigen Sieges triumphieren, müssen wir unseren Blick nach innen richten; wir müssen ein Königreich schmieden, das den Prüfungen der Zeit standhält. Verkündet, dass in [ROOT.GetCountry.GetCapital.GetName] eine Versammlung stattfinden wird, um über die Zukunft der Belgen zu beraten.\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
  
 eburonian_missions_task_17: "Der Rhenus hält uns nicht auf"
 eburonian_missions_task_17_DESC: "Die perfiden #E Friesen#! im Norden glauben, auf der anderen Seite des Rhenus in Sicherheit zu sein, doch wir werden ihnen ihren Verrat heimzahlen, und sei es, dass wir sie bis ans Ende der Welt verfolgen müssen.\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
  
  
 me_belgae_ultimatum.2.tt: "Wir haben den #Y $belgae_group$en#! Stämmen  den Krieg erklärt, die unsere Forderungen abgelehnt haben."
 me_belgae_ultimatum_send.tt: "WWir werden jedem hervorgehobenen Land ein Ultimatum stellen: Entweder es erkennt unsere Vorherrschaft an oder es wird Krieg geben."
 bravest_belgae_ruler_duel_tt: "Unser Herrscher muss die Charakterinteraktion #Y Zum Rivalen machen#! auf den Anführer eines feindlichen Landes anwenden und #Y zum Duell fordern#!."
 you_need_to_form_belgia: "Wir müssen die Entscheidung treffen, #Y Belgia vereinen#!."
  
  
  
  
  #################### 
  # Events 
  #################### 
  
 me_belgae_1_title: "Tapferste der Gallier!"
 me_belgae_1_desc: "Es ist ein bitterkalter Abend in der Region #E [GetProvince('(int32)3712').GetArea.GetRegion.GetName]#!, für diese Jahreszeit ungewöhnlich kalt, doch [ROOT.GetCountry.GetRuler.GetName] scheint die Kälte nicht zu bemerken, während [ROOT.GetCountry.GetRuler.GetSheHe] in [ROOT.GetCountry.GetRuler.GetHerHis]er Unterkunft in [ROOT.GetCountry.GetCapital.GetName] auf und ab geht.\n\nDer Grund für die Aufregung von [ROOT.GetCountry.GetRuler.GetFirstName] ist leicht zu verstehen: In den Kriegsräten von [ROOT.GetCountry.GetName] wurde ein großartiger Plan geschmiedet, der Blutvergießen und Verwüstung bis in den hohen Norden bringen wird, aber selbst jetzt bleibt ein gewisses Zögern - wenn alles nach den Plänen von [ROOT.GetCountry.GetRuler.GetFirstName] läuft, werden viele Menschen ihr Leben verlieren.\n \n'Mögen die Götter mir die Zerstörung vergeben, die ich gleich entfesseln werde...'"
 me_belgae_1.a: "Belgien wird durch die Spitze eines Schwertes geteilt werden!"
 me_belgae_1_tooltip: "$mission_completed_tooltip_1$ '#Y Tapferste der Gallier!#!' $mission_completed_tooltip_2$"
  
 me_belgae_2_title: "Die südliche Strategie"
 me_belgae_2_desc: "Nachdem er sich umgesehen und unsere Optionen abgewogen hat, hat [ROOT.GetCountry.GetRuler.GetName] klugerweise beschlossen, Druck auf unsere schwächeren Nachbarn im Süden auszuüben.\n\nUnsere Gesandten haben [ROOT.GetCountry.GetCapital.GetName] bereits verlassen, doch sie bringen keine Geschenke mit sich, sie sind nicht mit Pelzen beladen und bringen keine Silber- oder Goldhalsketten – es wird keine diplomatischen Floskeln geben, sondern lediglich die Übermittlung unseres Ultimatums."
 me_belgae_2.a: "Wir werden unsere Antwort in zehn Tagen haben..."
 me_belgae_2_tooltip: "$mission_completed_tooltip_1$ '#Y Die südliche Strategie#!' $mission_completed_tooltip_2$"
  
 me_belgae_3_title: "Menapische Forderungen"
 me_belgae_3_desc: "Die #E Menapier#! im Norden weisen einige Ähnlichkeiten mit unserem eigenen Volk auf; aufgrund ihrer Nähe zu den Küsten ist das Leben auf dem Wasser fester Bestandteil ihres Alltags. Und obwohl wir dankbar sind, dass uns die Gewässer des #E Rhenus#! den Zugang zum Mare Germanicum ermöglichen, würde unsere militärische Führung einen uneingeschränkten Zugang bevorzugen, ohne auf Flusstransporte angewiesen zu sein.\n\nWir erwarten jeden Tag eine Antwort der Menapier – wir hoffen, dass sie eine kluge Entscheidung treffen werden.
 me_belgae_3.a: "Lasst uns für friedliche Lösungen beten, aber haltet eure Schwerter scharf"
 me_belgae_3_tooltip: "$mission_completed_tooltip_1$ '#Y Menapische Forderungen#!' $mission_completed_tooltip_2$"
  
 me_belgae_4_title: "Einen Nervii treffen"
 me_belgae_4_desc: "Eines Morgens verabschiedete [ROOT.GetCountry.GetRuler.GetName] unsere Diplomaten, als diese sich darauf vorbereiteten, [ROOT.GetCountry.GetCapital.GetName] zu verlassen, um in die Länder der #E Nervii#! zu reisen, und eine Menschenmenge hatte sich versammelt, um den Abzug unserer Gesandten mitzuerleben. Viele beteten für den Erfolg ihrer Mission und hofften, dass sich die Nervier friedlich unterwerfen und [ROOT.GetCountry.GetName] nicht erneut in einen regionalen Krieg stürzen würden.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] war gerade mitten in einer beeindruckenden Rede, als plötzlich lautes Getöse in der Menge aufkam. Nur wenige Augenblicke später hatte sich ein junger Mann einen Weg durch die Menge nach vorne gebahnt. Als er vor unserem Stammeshäuptling stand, sank der Mann auf die Knie und hielt [ROOT.GetCountry.GetRuler.GetFirstName] sein Schwert entgegen.\n\n„Mein Name ist [SCOPE.sCharacter('rups_belgae').GetName], und die Götter erschienen mir in einem Traum mit einer Prophezeiung über die Zukunft – ich bin gekommen, um dem zukünftigen König der Belger mein Schwert anzubieten. Erlaube mir, dir zu dienen, oh [ROOT.GetCountry.GetRuler.GetName]!'"
 me_belgae_4.a: "Also gut, [SCOPE.sCharacter('rups_belgae').GetFirstName] - Ich könnte dich gebrauchen"
 me_belgae_4_tooltip: "$mission_completed_tooltip_1$ '#Y Einen Nervii treffen#!' $mission_completed_tooltip_2$"
  
 me_belgae_5_title: "Belgische Sklaven"
 me_belgae_5_desc: "[ROOT.GetCountry.GetRuler.GetName] ist heute Morgen in bester Stimmung und spürt zweifellos den Schwung unserer Feldzüge – einer nach dem anderen fallen unsere Nachbarstaaten [ROOT.GetCountry.GetRuler.GetHerHis]em Schwert  zum Opfer, genau wie geplant.\n\nWährend manche Menschen vielleicht Bedenken haben, ihre Verwandten zu versklaven, leidet das [ROOT.GetCountry.GetAdjective]e Volk nicht unter solchen moralischen Schwächen – alle, die sich unseren Absichten widersetzen, werden ein ähnliches Schicksal erleiden."
 me_belgae_5.a: "Wir werden alle versklaven, die sich unseren Plänen widersetzen"
 me_belgae_5_tooltip: "$mission_completed_tooltip_1$ '#Y Belgische Sklaven#!' $mission_completed_tooltip_2$"
  
 me_belgae_6_title: "Mare Germanicum"
 me_belgae_6_desc: "Den #E Morinern#! wurde mitgeteilt, dass ihnen dasselbe Ultimatum gestellt wird, das auch die anderen belgischen Stämme erhalten haben. Wir hoffen, dass sie aus der jüngsten Geschichte gelernt haben und eine kluge Entscheidung treffen werden, auch wenn in unserer Welt nichts sicher ist."
 me_belgae_6.a: "Zu Land und zu Wasser werden unsere Streitkräfte jeden Widerstand zerstören"
 me_belgae_6_tooltip: "$mission_completed_tooltip_1$ '#Y Mare Germanicum#!' $mission_completed_tooltip_2$"
  
 me_belgae_7_title: "Etwas, worauf man stolz sein kann"
 me_belgae_7_desc: "Eine feierliche Prozession folgt [ROOT.GetCountry.GetRuler.GetName], während [ROOT.GetCountry.GetRuler.GetSheHe] die Grenzen unserer neuen Siedlung bei [GetProvince('(int32)3675').GetName] festlegt. Dies ist ein bedeutsamer Moment in der Geschichte von [ROOT.GetCountry.GetName], da die Entscheidung, die Hauptstadt zu verlegen, keine ist, die [ROOT.GetCountry.GetRuler.GetFirstName] leichtfertig getroffen hat.\n\nEs gibt Menschen, die Heimweh nach [GetProvince('(int32)3712').GetName] haben, doch an diesem heiligen Tag behalten sie diese Gefühle für sich – denn es ist klar, dass die Zukunft Eburonias mit #E Cortoriacum#! verbunden ist."
 me_belgae_7.a: "Wir weihen diesen Boden, auf dem Belgae-Blut vergossen wurde"
 me_belgae_7_tooltip: "$mission_completed_tooltip_1$ '#Y Etwas, worauf man stolz sein kann#!' $mission_completed_tooltip_2$"
  
 me_belgae_8_title: "Belgica beanspruchen"
 me_belgae_8_desc: "In [ROOT.GetCountry.GetCapital.GetName] spielt sich eine vertraute Szene ab, die in der Hauptstadt der Eburonen zu einem Gewohnheit geworden ist: [ROOT.GetCountry.GetRuler.GetName] wendet sich an [ROOT.GetCountry.GetRuler.GetHerHis]e Diplomaten, die sich darauf vorbereiten, unsere Ultimaten in die Städte unserer Feinde zu überbringen. Nur die Zeit wird zeigen, ob sie sich friedlich unterwerfen werden, doch unsere Armeen sind auf alles vorbereitet, was auf sie zukommt."
 me_belgae_8.a: "Belgica muss uns gehören - es gibt keine andere Alternative!"
 me_belgae_8_tooltip: "$mission_completed_tooltip_1$ '#Y Belgica beanspruchen#!' $mission_completed_tooltip_2$"
  
 me_belgae_9_title: "Britannische Händler"
 me_belgae_9_desc: "Dank unserer Handelsbeziehungen zu [GetProvince('(int32)2022').GetArea.GetRegion.GetName] finden sich in den Läden von [ROOT.GetCountry.GetCapital.GetName] allerlei exotische Waren, die vor ein paar Monaten noch nicht zu finden waren. Schmuckstücke aus Bernstein, Zinnbarren und feine Pelze werden an den Marktständen zum Verkauf angeboten. \n\nNachmittags, wenn die Arbeit des Tages erledigt ist, sieht man [ROOT.GetCountry.GetRuler.GetName] oft durch die Läden schlendern und die angebotenen Waren mit kritischem Blick begutachten. Glücklicherweise ist [ROOT.GetCountry.GetRuler.GetFirstName] in der Regel mit allem zufrieden – sehr zur Erleichterung der Händler, die den legendären Stammeshäuptling auf keinen Fall verärgern wollen."
 me_belgae_9.a: "Für Eburonia und ihr Volk ist nur das Beste genug!"
 me_belgae_9_tooltip: "$mission_completed_tooltip_1$ '#Y Britannische Händler#!' $mission_completed_tooltip_2$"
  
 me_belgae_10_title: "Stadt der Eburonen"
 me_belgae_10_desc: "Das [ROOT.GetCountry.GetAdjective]e Volk ist äußerst abergläubisch und scheut keine Mühen, den Kriegsgöttern Opfer darzubringen. Da [ROOT.GetCountry.GetRuler.GetName] erkannt hat, dass nichts im Leben sicher ist, hat [ROOT.GetCountry.GetRuler.GetSheHe] es sich zur Aufgabe gemacht, die religiösen Bräuche unseres Stammes zu fördern, in der Hoffnung, die Götter dazu zu bewegen, unsere Unternehmungen weiterhin zu segnen.\n\nEin berühmtes Beispiel dieser Politik ist, was mit #E Cortoriacum#! geschah. Bevor die Stadt erbaut wurde, fand eine Reihe von Opferritualen in den Heiligtümern auf dem Land statt. Nachdem das Land rituell gereinigt worden war, nahmen unsere Architekten und Ingenieure ihre Arbeit mit Elan auf."
 me_belgae_10.a: "Lass uns alle um uns herum hassen, aber mögen die Götter uns weiterhin segnen"
 me_belgae_10_tooltip: "$mission_completed_tooltip_1$ '#Y Stadt der Eburonen#!' $mission_completed_tooltip_2$"
  
 me_belgae_11_title: "Tapferster der Belgae"
 me_belgae_11_desc: "Der Ruf von [ROOT.GetCountry.GetRuler.GetName] ist in den letzten Jahren sprunghaft gewachsen; nicht nur hat [ROOT.GetCountry.GetRuler.GetFirstName] #E Eburonia#! zu bisher ungeahnten Höhen geführt, unser tapferer Stammeshäuptling hat auch persönlich triumphiert, indem er [ROOT.GetCountry.GetRuler.GetHerHis]en Rivalen in einem Duell besiegte.\n\nNun bewegt sich jeder auf Zehenspitzen um [ROOT.GetCountry.GetRuler.GetFirstName] herum, aus Angst, dass eine falsch verstandene Bemerkung zu einem Handgemenge führen könnte."
 me_belgae_11.a: "Ich will mich nicht mit dem berühmten [ROOT.GetCountry.GetRuler.GetFirstName] messen – du etwa?!"
 me_belgae_11_tooltip: "$mission_completed_tooltip_1$ '#Y Tapferster der Belgae#!' $mission_completed_tooltip_2$"
  
 me_belgae_12_title: "Bienenfarmen von Traiectus"
 me_belgae_12_desc: "Besucher der Region [GetProvince('(int32)3709').GetName] sind oft von den Obstgärten und Feldern dieses bewaldeten Landes fasziniert, denn die Wildblumen wachsen dort in Hülle und Fülle. Das Haar mancher Dorfbewohner ist mit duftenden Blumen durchflochten.\n\nDoch hier gibt es mehr als nur die natürliche Schönheit von [GetProvince('(int32)3709').GetArea.GetRegion.GetName]; dieses Gebiet wird von Bienen bevölkert, die einen außergewöhnlichen Honig herstellen, der durch die Pollen der überall wachsenden Fichten sein Aroma erhält."
 me_belgae_12.a: "Honig ist in Ordnung, aber ich bevorzuge Met – bringt mir noch ein Horn!"
 me_belgae_12_tooltip: "$mission_completed_tooltip_1$ '#Y Bienenfarmen von Traiectus#!' $mission_completed_tooltip_2$"
  
 me_belgae_13_title: "Ganuentianische Piraten"
 me_belgae_13_desc: "In vergangenen Jahren machten die Piraten von [GetProvince('(int32)3843').GetName] keinen Unterschied zwischen Freund und Feind und überfielen die Städte all jener, die töricht genug waren, ihre Tore unbewacht zu lassen. Und obwohl sie uns, solange man sich erinnern kann, ein Dorn im Auge waren, hat [ROOT.GetCountry.GetRuler.GetName] verkündet, dass wir diese Banditen als geschätzte Gäste behandeln sollen.\n\nBald werden wir uns an den Geschichten von Piraten laben, die weit und breit plündern, und es wird viel Gelächter in [ROOT.GetCountry.GetCapital.GetName] geben."
 me_belgae_13.a: "Keine Angst, diese Piraten arbeiten mittlerweile für Eburonia"
 me_belgae_13_tooltip: "$mission_completed_tooltip_1$ '#Y Ganuentianische Piraten#!' $mission_completed_tooltip_2$"
  
 me_belgae_14_title: "Harenatium am Rhenus"
 me_belgae_14_desc: "Alle Stimmen, die behaupteten, dass [GetProvince('(int32)3712').GetName] in Vergessenheit geraten würde, sobald die Hauptstadt nach [GetProvince('(int32)3675').GetName] verlegt worden wäre, mussten ihre Worte zurücknehmen – sehr zum Vergnügen von [ROOT.GetCountry.GetRuler.GetName].\n\nDas Leben in der ehemaligen Hauptstadt geht weiter; die Märkte sind nach wie vor voller frischer Fische, die im #E Rhenus#! gefangen wurden, und täglich fahren Schiffe von der Küste ins Landesinnere und bringen Handelswaren aus #E Cortoriacum#! und sogar aus dem fernen[GetProvince('(int32)2022').GetArea.GetRegion.GetName]– im nahegelegenen Hafen von [GetProvince('(int32)3714').GetName] herrscht von früh bis spät reger Betrieb.\n\nWährend [ROOT.GetCountry.GetRuler.GetFirstName] im Sieg normalerweise großmütig ist, ist [ROOT.GetCountry.GetRuler.GetSheHe] heute schadenfroh – zum Glück ist niemand verärgert."
 me_belgae_14.a: "Ich wusste, was ich tat, als ich den Befehl zum Umzug gab!"
 me_belgae_14_tooltip: "$mission_completed_tooltip_1$ '#Y Harenatium am Rhenus#!' $mission_completed_tooltip_2$"
  
 me_belgae_15_title: "Barbarische Weisheit"
 me_belgae_15_desc: "Der Bau in [ROOT.GetCountry.GetCapital.GetName] ist fast abgeschlossen – eine Nachricht, die sich wie ein Blitz in #E Belgica#! verbreitet hat. Einst fristeten unser Volk ein elendes Dasein in strohgedeckten Hütten am Flussufer, den Elementen schutzlos ausgeliefert, doch nun bieten Gebäude aus Stein und Holz unseren stolzen Bürgern Schutz.\n\n[ROOT.GetCountry.GetRuler.GetName] hat zudem den Bau einer Bibliothek angeordnet, in der Hoffnung, dass diese eines Tages zu einem Hort des Wissens wird. Es ist bekannt, dass [ROOT.GetCountry.GetRuler.GetFirstName] mit außergewöhnlicher Weitsicht gesegnet ist und, nachdem er einen Blick in die Zukunft Eburonias geworfen hat, den Befehl persönlich erteilt hat – alle befürworten den Bau eines Tempels des Wissens."
 me_belgae_15.a: "Unser Volk muss seinen Besitz vermehren, und Weisheit ist das Größte davon"
 me_belgae_15_tooltip: "$mission_completed_tooltip_1$ '#Y Barbarische Weisheit#!' $mission_completed_tooltip_2$"
  
 me_belgae_16_title: "Die Zukunft der Belgae"
 me_belgae_16_desc: "[ROOT.GetCountry.GetRuler.GetName] hat in [ROOT.GetCountry.GetCapital.GetName] erneut einen Stammesrat einberufen und damit viele überrascht – das letzte Mal, dass so etwas geschah, war vor unserem schrecklichen Bürgerkrieg, doch was könnte nun, da unser ermordeter König gerächt wurde, der Grund für diese Versammlung sein?\n\n[ROOT.GetCountry.GetRuler.GetFirstName] gilt als ernst und besonnen, doch [ROOT.GetCountry.GetRuler.GetSheHe] ist von gerechtem Zorn erfüllt, und [ROOT.GetCountry.GetRuler.GetHerHis]e Stimme ist vor Emotionen erstickt, als [ROOT.GetCountry.GetRuler.GetSheHe] sich an die Anwesenden wendet.\n\n'Wir haben die Gefallenen gerächt, doch das ist nur eine halbe Maßnahme, und das Blut der Unschuldigen schreit nach Gerechtigkeit. Wir dürfen nicht zulassen, dass die #E Friesen#!, unsere erklärten Feinde, die die Attentäter unterstützt haben, welche unser Reich in den Krieg gestürzt haben, weiterhin den #E Rhenus#! überqueren und nach Belieben unsere Gebiete überfallen. Viel zu lange habe ich zugelassen, dass sie ungestraft bleiben, da meine Aufmerksamkeit der Fürsorge des [ROOT.GetCountry.GetAdjective]en Volkes galt. Doch nun, da wir wieder festen Boden unter den Füßen haben, müssen wir ihre Beleidigungen vergelten – wir werden für jedes Haar eines Belgae-Stammesangehörigen, dem Schaden zugefügt wurde, zehn Friesen töten.' \n\n[ROOT.GetCountry.GetRuler.GetFirstName] zieht ein Schwert, hält es vor [ROOT.GetCountry.GetRuler.GetHerHis]Gesicht und spricht einen eindrucksvollen Schwur."
 me_belgae_16.a: "Möge mein Schwertarm verdorren, wenn er Frisia nicht niederwirft! Zu den Waffen!"
 me_belgae_16_tooltip: "$mission_completed_tooltip_1$ '#Y Die Zukunft der Belgae#!' $mission_completed_tooltip_2$"
  
 me_belgae_17_title: "Ein reformwilliger Herrscher"
 me_belgae_17_desc: "Unter dem stolzen neuen Banner von [ROOT.GetCountry.GetName] hat [ROOT.GetCountry.GetRuler.GetName] verkündet, dass [ROOT.GetCountry.GetRuler.GetSheHe] plant, unsere [ROOT.GetCountry.GetAdjective]e Gesellschaft von Grund auf zu reformieren.\n\nObwohl einige [ROOT.GetCountry.GetRuler.GetFirstName] gebeten haben, diese ehrgeizigen Vorhaben aufzuschieben, bis wir uns vollständig von unseren Kriegen erholt haben, lässt [ROOT.GetCountry.GetRuler.GetSheHe] sich nicht beirren – wir müssen jetzt handeln, argumentiert [ROOT.GetCountry.GetRuler.GetSheHe], denn niemand weiß, was morgen bringen mag, und der Moment ist gerade günstig für uns.\n\nDer Aufruf ist ergangen, und bald wird sich ein Rat in [ROOT.GetCountry.GetCapital.GetName] versammeln, um die Vorschläge von [ROOT.GetCountry.GetRuler.GetFirstName] anzuhören."
 me_belgae_17.a: "Die Stunde ist gekommen; wir müssen diese Schritte jetzt tun"
  
 me_belgae_18_title: "Abweichende Stimmen"
 me_belgae_18_desc: "Noch bevor [ROOT.GetCountry.GetRuler.GetName] die Gelegenheit hatte, für [ROOT.GetCountry.GetRuler.GetHerHis]e Sache einzutreten, haben sich bereits einige Stammeshäuptlinge gegen die Initiativen ausgesprochen, ohne überhaupt zu wissen, worum es dabei geht, und ihre Meinung bereits lange vor deren Einreichung im Rat kundgetan. [SCOPE.sCharacter('random_belgae_dude').GetName] hat sich besonders lautstark geäußert, und der wachsende Widerstand gegen [ROOT.GetCountry.GetRuler.GetName] hat sich um diesen charismatischen Redner geschart. \n\n 'Es passiert zu viel, und die Omen sagen uns, dass wir langsamer machen müssen. Hat [ROOT.GetCountry.GetRuler.GetFirstName] unserem Volk mit [ROOT.GetCountry.GetRuler.GetHerHis]en beispiellosen Angriffskriegen nicht schon genug Leid zugefügt? Außerdem glauben wir nicht, dass [ROOT.GetCountry.GetRuler.GetFirstName] die Weisheit besitzt, unser Volk zu führen, daher ist diese ganze Angelegenheit von vornherein zum Scheitern verurteilt.' \n\nObwohl [ROOT.GetCountry.GetRuler.GetFirstName] über diese Ungehorsamkeit erzürnt ist, beißt [ROOT.GetCountry.GetRuler.GetSheHe] die Zähne zusammen und lädt die Häuptlinge ein, sich an den Tisch zu setzen."
 me_belgae_18.a: "Lasst uns nichts überstürzen; kommt und redet mit mir!"
  
 me_belgae_19_title: "Ein schlauer Freund, durch und durch"
 me_belgae_19_desc: "Die Beratungen in [ROOT.GetCountry.GetCapital.GetName] sind gescheitert, und viele sind nach Hause zurückgekehrt, erfüllt von glühender Wut auf [ROOT.GetCountry.GetRuler.GetName]. Zunächst ging [ROOT.GetCountry.GetRuler.GetFirstName] auf abweichende Standpunkte ein und tat alles in [ROOT.GetCountry.GetRuler.GetHerHis]er Macht Stehende, damit jeder seine Meinung äußern konnte; doch als klar wurde, dass die anderen Stämme [ROOT.GetCountry.GetRuler.Custom('get_SieIhn')] nicht unterstützten, wurden Beleidigungen ausgetauscht, und eins führte zum anderen.\n\nIrgendwann wurde [ROOT.GetCountry.GetRuler.GetFirstName] vorgeworfen, ein Mörder zu sein, der so viele Angehörige der Belgae-Stämme wegem [ROOT.GetCountry.GetRuler.GetHerHis]es Ehrgeiz getötet habe, doch dies war ein Spott, der zu weit ging – allen wurde befohlen, die Hauptstadt unverzüglich zu verlassen.\n\nEin paar Stunden später, als [ROOT.GetCountry.GetRuler.GetFirstName] voller Wut in [ROOT.GetCountry.GetRuler.GetHerHis]en Gemächern saß, klopfte es an der Tür – es war [SCOPE.sCharacter('hail_emperor_fox').GetName].\n\n'Ich bin hier, um dir, oh [ROOT.GetCountry.GetRuler.GetName], zu sagen, dass es Menschen gibt, die noch an dich glauben – auch wenn alle anderen dies offenbar nicht tun.'"
 me_belgae_19.a: "Danke für deine Unterstützung, mein Freund … trink doch einen mit mir"
  
 me_belgae_20_title: "Eine entdeckte Verschwörung!"
 me_belgae_20_desc: "Es wurde zu viel geredet, und die Agenten von [ROOT.GetCountry.GetRuler.GetName] haben ein Mordkomplott aufgedeckt. Nach der katastrophalen Konferenz in [ROOT.GetCountry.GetCapital.GetName] scheint es, als hätten einige der illoyalen Stammeshäuptlinge heimlich versucht, friesische Attentäter anzuheuern, um [ROOT.GetCountry.GetRuler.GetFirstName] und [ROOT.GetCountry.GetRuler.GetHerHis]e gesamte Familie zu ermorden!\n\nGlücklicherweise haben wir diese heimtückische Verschwörung aufgedeckt – hoffentlich, ehe es zu spät ist."
 me_belgae_20.a: "Du machst wohl Witze ... nach allem, was ich für Belgia getan habe?"
  
 me_belgae_21_title: "Tod eines Helden"
 me_belgae_21_desc: "Es ist spät am Abend, fast die dritte Stunde, und [ROOT.GetCountry.GetRuler.GetName] ist in [ROOT.GetCountry.GetRuler.GetHerHis]en Gemächern eifrig bei der Arbeit, als ein Bote eintrifft, mit geröteten Wangen und außer Atem vom Laufen.\n\n„Mein Häuptling, Ihr müsst sofort kommen – wir haben die Männer gefasst, die für das Attentatskomplott gegen Euch verantwortlich sind.“\n\n[ROOT.GetCountry.GetRuler.GetFirstName] steht auf, nickt grimmig und begibt sich in den Flur. Als [ROOT.GetCountry.GetRuler.GetSheHe] um eine Ecke biegt, entsteht plötzlich Aufruhr hinter [ROOT.GetCountry.GetRuler.GetHerHim] – er wirbelt wild herum, [ROOT.GetCountry.GetRuler.GetFirstName] sieht den Schimmer einer friesischen Streitaxt, Sekunden bevor sie [ROOT.GetCountry.GetRuler.GetHerHis] Gesicht trifft. Es ertönt ein entsetzliches, feuchtes Geräusch von zerbrechenden Knochen, und [ROOT.GetCountry.GetRuler.GetFirstName] öffnet [ROOT.GetCountry.GetRuler.GetHerHis]en Mund, als wolle er schreien, doch nur Blut strömt heraus.\n\nAls [ROOT.GetCountry.GetRuler.GetFirstName] zu Boden sinkt, tritt eine Gruppe von Stammeshäuptlingen hervor, die ihre Dolche und Äxte erhoben haben, um ihr grausames Werk fortzusetzen."
 me_belgae_21.a: "Jemand...bitte...irgendjemand...helft mir..."
  
 me_belgae_22_title: "Belger gegen Belger" #nt!Pause
 me_belgae_22_desc: "[ROOT.GetCountry.GetRuler.GetName] hat in einer für das Land kritischen Zeit die Herrschaft über [ROOT.GetCountry.GetName] übernommen, und obwohl die Thronbesteigung eines neuen Herrschers normalerweise Anlass zum Feiern ist, hat der andauernde Bürgerkrieg jegliche Feierlichkeiten verhindert.\n\nEs wird später noch Zeit sein, diesen Anlass zu feiern, doch vorerst steht die düstere Aufgabe an, rebellische Stammesangehörige zu töten."
 me_belgae_22.a: "Ich weine um die tapferen Söhne von [ROOT.GetCountry.GetName], die in diesem sinnlosen Krieg sterben werden"
  
 me_belgae_23_title: "Der Rhenus hält uns nicht auf"
 me_belgae_23_desc: "[ROOT.GetCountry.GetRuler.GetName] verschwendete keine Zeit, nachdem [ROOT.GetCountry.GetRuler.GetSheHe] die Nachricht erhalten hatte, dass unsere Ansprüche gegenüber den #E Friesen#! im Norden erfüllt wurden, und mobilisierte sofort Truppen – noch am selben Morgen erging der Befehl an die Soldaten, sich in der Nähe von [ROOT.GetCountry.GetCapital.GetName] zu versammeln.\n\nZwar gibt es innerhalb von [ROOT.GetCountry.GetName] einige Stimmen, die zur Zurückhaltung mahnen und darauf hinweisen, dass eine vollumfängliche Invasion über den #E Fluss Rhenus#! eine unnötige Belastung für unser Land darstellt, doch [ROOT.GetCountry.GetRuler.GetFirstName] weigert sich, darauf zu hören – der [ROOT.GetCountry.GetRulerTitle] hat einen Blutschwur der Rache geleistet."
 me_belgae_23.a: "Ich werde nicht ruhen, bis jeder Friese den Tod gefunden hat!"
  
 me_belgae_24_title: "Seltsame Lichter am Himmel"
 me_belgae_24_desc: "In den letzten Wochen wurden über [ROOT.GetCountry.GetCapital.GetName] bei Sonnenuntergang seltsame Lichter beobachtet, die am Himmel tanzten und jeden Abend in der [ROOT.GetCountry.GetAdjective]en Hauptstadt große Panik auslösten. Diese leuchtenden Kugeln, die sich ärgerlicherweise außerhalb der Bogenreichweite befinden, scheinen von unseren militärischen Befestigungsanlagen angezogen zu werden und versammeln sich oft über unseren Festungen.\n\nUnsere Stammesältesten glauben, dass diese mysteriösen Lichter von den Göttern gesandt wurden und nicht aus dieser sterblichen Welt stammen – eine Ansicht, die von [SCOPE.sCharacter('rups_belgae').GetName] zurückgewiesen wird, der für eine pragmatischere Interpretation des Phänomens plädiert."
 me_belgae_24.a: "Woher sie auch kommen mögen, das ist auf jeden Fall äußerst ärgerlich..."
  
 me_belgae_ultimatum_1_title: "Unterwerfung der Belgae"
 me_belgae_ultimatum_1_desc: "Da sie erkannt haben, dass sie niemals hoffen können, uns auf dem Schlachtfeld zu besiegen, haben unsere Feinde uns ihre Freiheit überlassen und bitten uns lediglich darum, sie gut zu behandeln und unsere Macht nicht zu missbrauchen."
 me_belgae_ultimatum_1.a: "Es spielt keine Rolle...wir werden am Ende triumphieren"
 me_belgae_ultimatum_1.b: "Wir heißen diejenigen willkommen, die uns umarmen, und zerstören diejenigen, die sich abwenden"
  
 me_belgae_ultimatum_2_title: "Blutdurst der Belgae"
 me_belgae_ultimatum_2_desc: "Unsere diplomatischen Bemühungen gegenüber unseren belgischen Nachbarn waren nicht gerade erfolgreich, doch das schürt nur weiter den Ruhmeshunger von [ROOT.GetCountry.GetRuler.GetName]. Es scheint, als sei in diesem Leben nichts einfach, doch wir werden alle Hindernisse überwinden, die sich uns in den Weg stellen!"
 me_belgae_ultimatum_2.a: "Sammle die Abgaben und schicke sie in die Schlacht!"
  
