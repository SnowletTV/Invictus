 britannic_trade_2: "Britannischer Handel" 
 desc_britannic_trade_2: "Wir haben Handelsbeziehungen zu den Stämmen in Britannien aufgebaut." 
 britannic_trade_3: "Wachsende Bevölkerung" 
 desc_britannic_trade_3: "Unsere Landsleute strömen an diesen Ort, in der Hoffnung, ein neues Leben beginnen zu können."  
 belgae_pride_city: "Stolz der Belgae"
 desc_belgae_pride_city: "Aufgrund unserer Investitionen hier ist diese Stadt unser ganzer Stolz geworden."
 belgae_pride_country: "Eine Zeit des Wachstums"
 desc_belgae_pride_country: "Ein perfekter Sturm an Gelegenheiten hat die Bedingungen für schnelles Wachstum in unserer neuen Hauptstadt geschaffen."
 bravest_of_the_belgae: "Der Tapferste der Belgae"
 desc_bravest_of_the_belgae: "Durch das Recht der Tapferkeit behaupten wir, der tapferste der Belgae-Stämme zu sein."
 belgae_bee_farm: "Bienenfarmen von Traiectus"
 desc_belgae_bee_farm: "Wir haben in Traiectus Bienenstöcke errichtet, damit wir den Honig, nach dem sich unser Volk sehnt, leichter gewinnen können."
 belgae_ganuentian_pirates: "Ganuentische Piraten"
 desc_belgae_ganuentian_pirates: "Die wilden Piraten, die die Gewässer des Mare Germanicum befahren, sind oft im Hafen von Ganuenta anzutreffen, wenn sie nicht auf See sind."
 belgae_harenatium: "Harenatium am Rhenus"
 desc_belgae_harenatium: "Der Standort unserer ehemaligen Hauptstadt gedeiht weiterhin, zweifellos aufgrund seiner günstigen Lage."
 bravest_tribe_in_all_of_gaul_belgae: "Tapferster Stamm in ganz Gallien"
 desc_bravest_tribe_in_all_of_gaul_belgae: "Es ist wahr, dass die Belgae der mutigste und wildeste Stamm in ganz Gallien sind."
 belgae_civ_boost_mod: "Blühende Hauptstadt"
 desc_belgae_civ_boost_mod: "Während einige behaupten, wir seien bloße Barbaren, beweist unsere blühende Kultur das Gegenteil."
 BELGAE_FORMABLE_FLAG: "Die glorreiche Flagge der siegreichen Belgae"  
