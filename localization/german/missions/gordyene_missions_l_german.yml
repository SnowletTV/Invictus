l_german:

01_gordyene: "Land der Karduchoi" #Done 15.05.25 (1.11)
01_gordyene_DESCRIPTION: "Das Volk der Karduchoi, mit ihrer Heimat, die im Laufe der Jahrhunderte unter vielen Namen bekannt war, einschließlich des Namens 'Qardu', existierte in der Geschichte als Randgruppe und als scheinbar räuberischer Stamm, der entlang der sogenannten Gordyaean-Berge sowie entlang des linken Ufers des Tigris selbst streifte.\n\nIhre Heimat war reich an Naturschätzen, aber gefährlich, und es wurde gesagt, dass sie ganze Armeen in wenigen Tagen verschlungen hat. Ein eigenartiges Volk, sie waren sowohl Expertenkämpfer als auch Schöpfer, fein abgestimmt auf den Reichtum des Handels, der an Engstellen und leichteren Übergängen entlang des Flusses verbunden war. Aus diesen Gründen wurden sie von vielen Reichen begehrt, aber wirklich 'kontrolliert' von keinem. Sie zahlten Tribute an einige, wie die Assyrer und die Armenier, wurden aber oft genauso von ihren vermeintlichen Oberherren abgeworben. Ihr Schicksal ist es, den kontinentalen Sumpf zwischen den imperialen hellenischen Mächten zu überwinden und sich als einzigartige Machtfaktor im mesopotamischen Raum auf die Weltbühne zu begeben."
01_gordyene_CRITERIA_DESCRIPTION: "Diese Mission ist erfüllt, wenn Gordyene sich von ihren politischen Fesseln befreit hat und die Krieger der Qardu ein blühendes und beständiges Königreich errichtet haben, das über die nördlichen Gebiete des Tigris herrscht."
01_gordyene_BUTTON_TOOLTIP: "So beginnt die Bewegung der Berge: furchterregend, zeitlos und unbesiegbar."
01_gordyene_BUTTON_DETAILS: ""

#Missions

01_gordyene_task_1: "Ein aufsässiges Volk"
01_gordyene_task_1_DESC: "Obwohl die Armenier in der Vergangenheit über uns im Norden herrschten, ist ihre Zeit jetzt nicht gekommen. Unser Tribut an sie ist keine Freude, sondern eine Ärgernis. Wir nennen die Berge zu Hause - wie sollen sie gedeihen, wenn wir den Bitliss-Pass sperren und uns weigern, ihre Marionetten zu bleiben?"
01_gordyene_mission_task_1_tooltip: "Das Volk von #Y Gordyene#! wird sich durch #R Krieg#! von der Kontrolle durch #E Armenien#! befreien!"

01_gordyene_task_2: "Befestigung der Berge von Qardu"
01_gordyene_task_2_DESC: "Unsere Länder sind die Gebirgspässe. Im Nordwesten liegt der Berg Masion und im Nordosten der Berg Niphates, wo die Arche der Tiere vermutet wird. Unsere Bedeutung in der Region und unsere Kontrolle über die regionalen Handelsrouten hängen von unserer Fähigkeit ab, die Pässe und Tigris-Flussübergänge zu verteidigen. Wir müssen diese Kommunikationswege gründlich befestigen, um unsere Position zu halten und auszubauen."

01_gordyene_task_3: "Plünderung der Seleukiden"
01_gordyene_task_3_DESC: "Im Krieg mit den anderen Diadochen und dünn gesät durch den Kampf gegen rebellische Vasallen und gefährliche Nachbarn sind die Seleukiden verwundbar. Die Zeit ist gekommen, ihre Autorität über die Region Oberer Tigris herauszufordern. Die Karduchoi können mit Grenzüberfällen beginnen, und dann kann der Angriff auf das Hinterland beginnen..."
01_gordyene_mission_task_3_a_tooltip: "Dein #Y Sadhshar#! muss ein #Y Freund#! deines #Y aktuellen Herrschers#! sein und Mitglied der #Y herrschenden Familie#! sein."
01_gordyene_mission_task_3_b_tooltip: "Die Krieger von #Y Gordyene#! werden das #Y Seleukidenreich#! in der Provinz #E Obermesopotamien#! in einem Überraschungskrieg angreifen."

01_gordyene_task_4: "Konsolidierung des Oberen Tigris"
01_gordyene_task_4_DESC: "Entlang der vielen Zweige des Tauros-Gebirges nach Süden erstrecken sich die Länder des Oberen Tigris reicher und fruchtbarer als die oberen Bereiche des Euphrats im Süden. Die Handelsrouten, die durch dieses Gebiet führen, bringen Wohlstand und Lebendigkeit für seine Menschen. Zivilisationen der alten Zeiten sind hier entstanden und aufgewachsen. Die Karduchoi von Qardu haben zuvor Teile dieses Gebiets erkundet und zuweilen kontrolliert, aber noch nie alles auf einmal. Nun können die Menschen gedeihen und das Potenzial des Landes aufbauen."
01_gordyene_task_4_tt:0 "Das Gebiet von [GetProvince('(int32)833').GetArea.GetName] hat mindestens #Y 3#! Städte."
01_gordyene_task_4_ttt:0 "Das Gebiet von [GetProvince('(int32)830').GetArea.GetName] hat mindestens #Y 3#! Städte."
01_gordyene_task_4_tttt:0 "Das Gebiet von [GetProvince('(int32)862').GetArea.GetName] hat mindestens #Y 3#! Städte."

01_gordyene_task_5: "Ein Rivale in Adiabene"
01_gordyene_task_5_DESC: "Im Südosten hat das Königreich Adiabene uns immer wieder als Bedrohung erwiesen. Ihre Grenze liegt nahe an unseren südlichen Weidefeldern, und es gab mehrere Streitigkeiten zwischen benachbarten Hirten darüber, welche Herde auf welchen Hügeln weiden sollte. Aufgrund unserer... rebellischen... Natur haben sie oft die regionalen Oberherren - zuerst die Achaemeniden und jetzt die Seleukiden - gebeten, ihnen bei der Eroberung unseres Heimatlandes zu helfen. Wir müssen ihre Bedrohung beenden, bevor sie diesen Wunsch in die Tat umsetzen können."
01_gordyene_task_5_tt:0 "[GetCountry('ADI').GetName] hat eine Meinung von mindestens #G +75#! über [SCOPE.GetRootScope.GetCountry.GetName] und [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ist mit [GetCountry('ADI').GetRuler.GetName] befreundet."
01_gordyene_task_5_ttt:0 "[GetCountry('ADI').GetName] hat eine Meinung von weniger als #R -25#! zu [SCOPE.GetRootScope.GetCountry.GetName] und [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ist mit [GetCountry('ADI').GetRuler.GetName] verfeindet."
01_gordyene_mission_task_5_tooltip: "Abhängig von der #E Beziehung#! zwischen #Y Gordyene#! und #Y Adiabene#! könnten sich #G freundliche Beziehungen# oder #R Konflikte# ergeben..."

01_gordyene_task_6: "Königreich Gordyene"
01_gordyene_task_6_DESC: "Wenn die Karduchoi als Volk in dieser sich ständig verändernden Welt überleben sollen, müssen unsere Länder und unsere Leute in einem Königreich des Volkes vereint sein. Unser mächtigster Anführer, der des größten Stammes, soll hervorgehen und ein neues Zeitalter verkünden - das des Königreichs Gordyene.\n\n#R Durch den Abschluss dieser Aufgabe wird #T Ein hurritisches Königreich#! deaktiviert.#!"

01_gordyene_task_7: "Ein hurritisches Königreich"
01_gordyene_task_7_DESC: "Die Ältesten unserer Stämme kennen Orte, an denen uralte Knochen liegen und die Ruinen alter Tempel stehen. Es gibt noch immer jene wenigen Einsiedler, zurückgezogen lebende Männer und Frauen, die in der Stille der Berggipfel und Höhlenkammern leise Zaubersprüche und Flüche murmeln. Dennoch sollten wir sie nicht mit Verwirrung oder Verachtung betrachten. Ihre Welt war eine Welt der Macht, so erzählen es die Geschichten. Vielleicht lässt sich ein größerer Nutzen daraus ziehen, ihre Wege zu erlernen und das wiederzubeleben, was einst in diesen Ländern war...\n\n#R Durch den Abschluss dieser Aufgabe wird #T Königreich Gordyene#! deaktiviert.#!"

01_gordyene_task_8: "Die dreifache Zitadellenstadt"
01_gordyene_task_8_DESC: "Die Hauptstadt Pinaka hat sich bereits langsam zu einem wohlhabenden Ort entwickelt, der an einem natürlichen Kreuzungspunkt und Übergang am Fluss Tigris liegt. Es gibt drei Höhenlagen in der Stadt - zwei auf dem Westufer und eine auf dem Ostufer. Zusammen bieten diese Orte die perfekten verteidigungsfähigen Positionen, um die wirtschaftlichen und militärischen Bemühungen entlang des Flussverlaufs zu schützen und zu überwachen. Es wird auch neidisch beäugt werden und muss um jeden Preis geschützt werden."
01_gordyene_mission_task_7_tooltip: "Die #Y Karduchoi#! werden in der Lage sein, die antike #E Hurritische Religion#! wiederzubeleben."

01_gordyene_task_9: "Die Meisterbauer"
01_gordyene_task_9_DESC: "In ihren Werkstätten in den Bergen haben die Baumeister von Qardu schon lange sowohl starke und kreative Geräte als auch meisterhafte Strukturen gefertigt. Es ist kein Wunder, dass trotz ihrer dezentralen Natur die Menschen von Qardu so viele erfolgreiche Festungen, Siedlungen und Städte erbaut haben. Angesichts ihres Ansehens wäre es Verschwendung, sie nicht dazu zu bringen, die Infrastruktur und Verteidigung des Volkes zu verbessern."

01_gordyene_task_10: "Sareisa und Satalka"
01_gordyene_task_10_DESC: "Viele mittelgroße Siedlungen hoffen schon seit langem darauf, dass ein kleiner Zuzug von Menschen zu blühenden Städten führt. Da die Wirtschaft von Qardu sowohl vom Handel entlang des Tigris als auch von den reichen Rohstoffvorkommen in den Bergen abhängt, sehnen sich die Orte Saraeisa und Satalka nach Aufschwung und Erfolg."

01_gordyene_task_21: "Kreuzung am Tigris"
01_gordyene_task_21_DESC: "Der Lauf des Tigris bestimmt den Handel in der Region Mesopotamien im Norden. Karawanen und Händler müssen den Tigris an entscheidenden Stellen überqueren. Das Land der Qardu bietet einige der besten und sichersten Übergänge, wie schon Alexander der Große auf seinem Weg nach Gaugamela feststellte. Die Möglichkeiten der Handelswege und die damit verbundenen Vorteile müssen genutzt werden."
gordyene_mission_01_task_21_custom_tooltip:0 "Die Provinz #Y $corduene_area$#! hat mindestens #Y [SCOPE.ScriptValue('gordyene_mission_01_task_21_money_total')|0]#! Provinzeinkommen@income! [SCOPE.GetRootScope.GetCountry.Custom('gordyene_mission_01_task_21_money_loc')]."

01_gordyene_task_12: "Weideflächen der Karduchoi"
01_gordyene_task_12_DESC: "Für all die Zeit, die unser kollektives Gedächtnis zurückreicht, waren unsere Menschen größtenteils mobile Hirten, die unsere Tiere auf den reichen Hügeln östlich des Tigris und in den Bergen südlich der armenischen Bergkette weiden ließen. Um sowohl unsere Stammesangehörigen zu besänftigen als auch unseren natürlichen Reichtum zu erhöhen, sollten wir die Qualität und den Schutz unserer Weideflächen verbessern."

01_gordyene_task_13: "Aromatisches Amomum"
01_gordyene_task_13_DESC: "Unser Amomum, ähnlich dem Kardamom der Indoi im Osten, dient als sehr beliebtes Gewürz und entzündungshemmendes Mittel. Köche entlang des gesamten Tigris und Euphrats bestellen mehr davon sowie unsere heimischen Minzen, Lorbeer- und Myrtenblätter. Die natürlichen Gewürze unseres wilden 'Macquis' können unseren wirtschaftlichen Unternehmungen sehr helfen. Lassen Sie uns mehr dieser kostbaren Substanzen anbauen."

01_gordyene_task_14: "Die Weinberge von Qardu"
01_gordyene_task_14_DESC: "Im Gegensatz zu den schwachen Griechen im fernen Westen trinken wir von Qardu unseren Wein stark. Unsere Weinberge sind wohlhabend, und die Märkte Mesopotamiens dürsten nach mehr. Um unsere Gewinne und das Glück unserer Menschen zu maximieren, müssen wir die Produktion unseres bekannten Weins erhöhen."

01_gordyene_task_15: "Bergbau auf Gagat"
01_gordyene_task_15_DESC: "Auch als Gangitis bezeichnet, ist dieses seltene Juwel eine Schönheit zu sehen. Wenn es jedoch geschmolzen wird, entsteht ein starker Rauch, der Echsen und andere Kreaturen abschreckt... so sagt man. Für diese medizinischen Zwecke und für seine ästhetischen Anziehungskraft ist das Juwel ein recht wertvoller Export entlang des Tigris und sollte zum Nutzen der karduchoischen Wirtschaft genutzt werden."


#Tooltips

#Modifiers
qardu_mountain_defense: "Die Bergverteidigungen von Qardu"
desc_qardu_mountain_defense: "Die terrassierten Festungsplattformen der Gordyaean-Berge sollen die Karduchoi am besten schützen."
bitliss_pass_preparations: "Vorbereitungen am Bitliss-Pass"
desc_bitliss_pass_preparations: "In Erwartung eines armenischen Angriffs von Norden haben wir den Bitliss-Pass verbarrikadiert."
karduchian_tigris: "Der Karduchische Tigris"
desc_karduchian_tigris: "Die Karduchoi bauen nun das Gebiet des Oberen Tigris aus."
gordyene_adiabene_trade: "Handel zwischen Gordyene und Adiabene"
desc_gordyene_adiabene_trade: "Die freundlichen Beziehungen zu Adiabene haben zu vorteilhaften Handelsarrangements geführt."
aggression_against_adiabene: "Aggression gegen Adiabene"
desc_aggression_against_adiabene: "Unser Herrscher wurde vom König von Adiabene mehrmals beleidigt. Es ist an der Zeit, sie an ihren Platz zu verweisen."
kingdom_of_karduchoi: "Königreich der Karduchoi"
desc_kingdom_of_karduchoi: "Die Karduchoi haben eine stabile Monarchie errichtet, um ihr Land effizient zu regieren und es in das nächste Zeitalter zu führen."
karduchian_convert_hurrian: "Karduchier konvertieren zum hurritischen Glauben"
desc_karduchian_convert_hurrian: "Die Karduchoi konvertieren zum Glauben an Teshub."
pinnacle_of_pinaka: "Der Gipfel von Pinaka"
desc_pinnacle_of_pinaka: "Die aus drei Festungen bestehenden Flussbefestigungen von Pinaka gewährleisten die Sicherheit der Bevölkerung und einen ungehinderten Handelsverkehr über den Tigris."
fortesses_of_pinaka: "Die Festungen von Pinaka"
desc_fortesses_of_pinaka: "Die Festungen von Pinaka überspannen und bewachen beide Ufer des Tigris in der wirtschaftlich wichtigen Hauptstadt."
expert_karduchian_construction: "Expertise der karduchischen Bauweise"
desc_expert_karduchian_construction: "Die Karduchoi sind bekannt für ihre Baumeister, und ihre Festungen bestehen den Test sowohl in der Schlacht als auch in der Zeit."
karduchian_military_engineers: "Karduchische Militäringenieure"
desc_karduchian_military_engineers: "Die Belagerungsmaschinen, die von den Handwerkern von Qardu gebaut wurden, werden ausländische Festungen dezimieren."
karduchian_civil_engineers: "Karduchische Bauingenieure"
desc_karduchian_civil_engineers: "Die Meisterhandwerker von Qardu werden sich darauf konzentrieren, eine bessere Heimat zu schaffen."
building_satalka: "Aufbau von Satalka"
desc_building_satalka: "Der Ort Satalka, ein wachsender Weiler, hat sich schließlich zu einer prächtigen Stadt in den Bergen entwickelt, reich an Bergwerken und Metallen."
building_sareisa: "Aufbau von Sareisa"
desc_building_sareisa: "Der Ort Sareisa, eine wichtige Handelsstation, wurde zu einer riesigen Stadt auf den gut bewässerten Feldern des Tigris ausgebaut."
ad_flumen_tigrim: "Ad Flumen Tigrim"
desc_ad_flumen_tigrim: "An Pinaka, der Überquerung namens Ad Flumen Tigrim, fließt der meiste Handel."
pasturelands_of_qardu: "Weideflächen von Qardu"
desc_pasturelands_of_qardu: "Die reichen Hügel und Ebenen von Qardu sorgen für einen Überfluss an Weidewirtschaft."
amomum_consumption: "Amomum-Verzehr"
desc_amomum_consumption: "Der Handel mit Amomum-Gewürzen hat überall zu glücklicheren Bürgern geführt."
amomum_trade: "Der Amomum-Handel"
desc_amomum_trade: "Der Handel mit Amomum-Gewürzen aus Gordyene hat zu gesteigertem Wohlstand und regionaler Freude geführt."
spice_farms: "Amomum-Gewürzfelder"
desc_spice_farms: "Die Nachfrage nach Amomum hat zu einem verstärkten Anbau der Gewürzpflanzen geführt."
wine_of_sareisa: "Der Wein von Sareisa"
desc_wine_of_sareisa: "Der Wein aus Qardu verkauft sich besser denn je; die durstigen Adligen lieben ihn mehr als Wasser und das Leben selbst – man trinkt ihn am besten unverdünnt, ganz anders als diese lauwarme Flüssigkeit, die die Griechen schlürfen."
drunken_qardu_friendship: "Eine betrunkene Freundschaft aus Qardu"
desc_drunken_qardu_friendship: "Der Wein von Qardu hat zu vielen schnellen Freundschaften und gelallten Beleidigungen geführt..."
gagates_mining: "Gagates-Bergbau"
desc_gagates_mining: "Die Minen der wunderschönen Gangitis-Adern wurden voll ausgeschöpft."
gordyene_mercenary_markets: "Die Söldnermärkte von Gordyene"
desc_gordyene_mercenary_markets: "Gordyene war immer berühmt für seine Krieger, und sein natürlicher Reichtum hat es ihm ermöglicht, große Armeen allein zu besiegen, doch es war auch gut darin, sein Volk als Söldner zu verleihen."


#Events
me_gordyene_1_title: "Armenien wird nicht passieren!"
me_gordyene_1_desc: "Die Zeit ist gekommen, um die Souveränität über die Gordyäischen Berge zurückzugewinnen - die Klippen des Niphates ohne Behinderung und Tribut zu erklimmen. Lange Zeit waren unsere Länder ein Mysterium für Außenstehende... eine Welt voller Gefahr und Verzweiflung. Lassen Sie uns die Gültigkeit solcher Gerüchte beweisen und unsere Präsenz auf der regionalen Bühne bekannt machen."
me_gordyene_1.a: "Wir werden unsere Berge zurückerobern!"
me_gordyene_1_tooltip: "Ein #R Krieg#! der Unabhängigkeit beginnt mit Ihrem Oberherren, #Y Armenien#!."

me_gordyene_2_title: "Die Gordyäischen Berge"
me_gordyene_2_desc: "Die Gordyäischen Berge, für die unser Volk bekannt ist, stehen nun als Zeugnis für unsere Ingenieure und Steinmetze - eine Bastion des Schutzes für das Volk von Qardu. Im fernen Norden leuchtet der Gipfel des Berges Niphates strahlend weiß, nur ein seltsamer Fleck an seiner Seite. Es wurde lange gemunkelt, dass ein großes Schiff in der Zeit der Flutung an diesen steilen Hang krachte und von dort aus Tiere über das Land verteilte. Vielleicht könnte ein Stück dieses alten Schiffes immer noch im Stein eingebettet sein..."
me_gordyene_2.a: "Die Berge sollen für immer unsere Heimat sein."
me_gordyene_2.b: "Der Berg Niphates soll unserem Volk ein Mittel regionaler Prestige verleihen."
me_gordyene_2_a_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_2$#!' $mission_completed_tooltip_2$"
me_gordyene_2_b_tooltip: "Ein #E Erkundungsteam#! wird entsandt, um einen Teil der #Y Arche Noahs#! vom #E Berg Niphates#! zurückzubringen."

me_gordyene_3_title: "Geißel der oberen Tigris"
me_gordyene_3_desc: "Wir haben alle Länder kurz jenseits unserer Grenzen geplündert, und überall steigt Rauch auf. Jetzt ist es an der Zeit, die seleukidische Grenze anzugreifen und Land zu übernehmen, das in unserer Reichweite liegt. Ihr Gouverneur wird bald in Angst fliehen. Die Stadt Nisibis, auch bekannt als Antiocheia Mydonia, und ihre mygdonischen Bewohner haben keine Liebe für ihre seleukidischen Oberherren, und so sollten wir diesen Ort von ihrer Herrschaft befreien."
me_gordyene_3.a: "Überqueren Sie den Tigris!"
me_gordyene_3_tooltip: "#Y Gordyene wird einen #R Krieg#! gegen die Seleukiden um die Stadt #Y Nisibis#! und das Gebiet von #Y Obermesopotamien#! erklären."

me_gordyene_4_title: "Eine bessere Zukunft liegt in der Zukunft des Tigris."
me_gordyene_4_desc: "Die Seleukiden haben den Tigris und seine Gewässer missverstanden. Jetzt, da wir die Länder jenseits seiner Ufer erobert und unsere Kontrolle gefestigt haben, können die berühmten Baumeister der Karduchoi effektiv die Städte und Siedlungen am Oberlauf des Tigris wieder aufbauen und in ein neues Zeitalter führen."
me_gordyene_4.a: "Eine bessere Zukunft liegt in der Zukunft des Tigris."
me_gordyene_4_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_4$#!' $mission_completed_tooltip_2$"

me_gordyene_5_title: "Freunde in Adiabene"
me_gordyene_5_desc: "Wir haben uns Zeit genommen, die Menschen von Adiabene im Süden kennenzulernen und von ihnen zu lernen. In dieser Zeit haben wir festgestellt, dass ihre Treue zu den Seleukiden, wie auch einst unsere eigene, nicht so stark ist, wie die Herrscher in Babylon glauben mögen. Es besteht eine Möglichkeit, besser mit unserem Nachbarn zu interagieren... zu unserem eigenen Nutzen."
me_gordyene_5.a: "Freundschaftlichen Handel fördern."
me_gordyene_5.b: "Unsere Oberherrschaft würde ihnen mehr nutzen."
me_gordyene_5_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_5$#!' $mission_completed_tooltip_2$"

me_gordyene_6_title: "Feinde in Adiabene"
me_gordyene_6_desc: "Unser Hass auf den Thron von Arbela und dessen Inhaber hat in dieser politischen Pattsituation nur weiter geschwelt. Das Volk verlangt nach Taten, und so erscheint es nur recht und billig. Wenn wir nicht in ihr Land einmarschieren und den ersten Schlag ausführen, werden sie bald ihre Armeen über die Grenze in unser Land schicken."
me_gordyene_6.a: "Arbela soll fallen!"

me_gordyene_7_title: "König der Berge"
me_gordyene_7_desc: "Die Karduchoi wurden nun in einen zentralisierteren und geordneteren Staat organisiert, der zum Nutzen des Volkes und seiner Kultur geführt wird. Lange wird der König auf dem Pinakan-Thron herrschen und den Einfluss der Karduchoi im Reich zwischen den beiden großen Flüssen weit und breit ausdehnen."
me_gordyene_7.a: "Dem König von Gordyene!"
me_gordyene_7.b: "Dem König von Qardu!"
me_gordyene_7_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_6$#!' $mission_completed_tooltip_2$"

me_gordyene_8_title: "Söhne von Subartu"
me_gordyene_8_desc: "In den Bergen haben sich viele alte Bräuche über die Jahrhunderte hinweg erhalten, und die Anhänger von Teshub scheinen da keine Ausnahme zu bilden – ja, sie scheinen in ihrer Hingabe an die alten Traditionen sogar noch stärker zu sein. Es gibt viele alte Geschichten über die Siege und den Ruhm, die seine Anhänger errungen haben. Darüber hinaus zeugen alte Tafeln, die in verlassenen Hütten und jahrhundertealten Mauern gefunden wurden, vom Reichtum, den die Oberläufe des Tigris einst besaßen. Unter dem Namen „Subartu“ gehörten die Menschen hier zu den besten Händlern und Auktionären und waren wohlhabender, als sie es sich jemals hätten träumen lassen. Es scheint, als sei seit jener Zeit so viel verloren gegangen..."
me_gordyene_8.a: "Diese Götter sind lediglich Relikte der Geschichte."
me_gordyene_8.b: "Teshub und seine Art werden uns den Weg wieder zeigen."
me_gordyene_8.c: "Wir müssen das alte, reiche Land Subartu wieder zum Leben erwecken."
me_gordyene_8_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_7$#!' $mission_completed_tooltip_2$"
me_gordyene_8_a_tooltip: "Die #E Karduchoi#! werden den Kult des #Y khaldischen Pantheons#! übernehmen."
me_gordyene_8_c_tooltip: "Die #E Karduchoi#! werden das alte #Y Königreich Subartu#! wiederherstellen!!"

me_gordyene_9_title: "Die Spitze von Pinaka"
me_gordyene_9_desc: "Der Tigris ist ein mächtiger Fluss, und nun haben die Karduchoi-Maurer und Ingenieure die größten Schutzmauern um ihn herum errichtet, die die Region besitzt. Mit diesen drei Zitadellenbefestigungen sind der Thron und der Handel, der ihn versorgt, sicher."
me_gordyene_9.a: "Pinaka ist geschützt."
me_gordyene_9_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_8$#!' $mission_completed_tooltip_2$"

me_gordyene_10_title: "Fokus der Meisterbauer"
me_gordyene_10_desc: "Die Handwerker und Baumeister der Karduchoi waren schon immer für ihre Geschicklichkeit und Genialität bekannt. Angesichts der vielen Herausforderungen, denen sich die Menschen des Oberen Tigris gegenübersehen, ist es an der Zeit zu überlegen, wie man diese Personen am besten lenken und nutzen kann, um unsere Städte und Armeen zu unterstützen."
me_gordyene_10.a: "Die Baumeister sollen in ihren Werkstätten bleiben."
me_gordyene_10.b: "Ausbildung der Baumeister in den Künsten des Krieges."
me_gordyene_10.c: "Baumeister bauen bessere Städte!"
me_gordyene_10_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_9$#!' $mission_completed_tooltip_2$"

me_gordyene_11_title: "Satalka und Sareisa"
me_gordyene_11_desc: "Die Städte Satalka und Sareisa haben endlich ein wirtschaftliches und verkehrstechnisches Niveau erreicht, das ihrer Lage und ihrem Potenzial entspricht."
me_gordyene_11.a: "Diese Städte werden gedeihen!"
me_gordyene_11_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_10$#!' $mission_completed_tooltip_2$"

me_gordyene_12_title: "Ad Flumen Tigrim"
me_gordyene_12_desc: "Gordyene beherrscht einige der bedeutendsten Handelsstationen, und die Festungen von Pinaka bewachen eine der wertvollsten Furtstellen am gesamten Tigris. Alexander selbst nutzte diesen Ort während seiner Eroberungszüge in Persien."
me_gordyene_12.a: "Lasst den Handel fließen."
me_gordyene_12_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_21$#!' $mission_completed_tooltip_2$"

me_gordyene_13_title: "Herden von Qardu"
me_gordyene_13_desc: "Dank weitläufigerer Weideflächen, größerer Bewegungsfreiheit und mehr Arbeitskräften konnten die Hirten von Qardu eine größere Anzahl von Tieren halten und Nahrungsmittel in weitaus mehr Märkte in Mesopotamien und darüber hinaus exportieren."
me_gordyene_13.a: "Lasst die Schafe frei grasen."
me_gordyene_13_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_12$#!' $mission_completed_tooltip_2$"

me_gordyene_14_title: "Amomum im Überfluss"
me_gordyene_14_desc: "Könige und Herrscher aus aller Welt haben sich auf Gerichte gestürzt, die mit unseren köstlichen Amomum-Gewürzen zubereitet wurden. Unsere Händler können gar nicht genug davon verkaufen. Einige fordern uns auf, in weitere Gewürzfelder zu investieren, um der wachsenden Nachfrage gerecht zu werden."
me_gordyene_14.a: "Ich werde zu beschäftigt sein, in meinem Thronsaal zu rauchen..."
me_gordyene_14.b: "Das Gewürz muss fließen."
me_gordyene_14_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_13$#!' $mission_completed_tooltip_2$"

me_gordyene_15_title: "Der Wein muss getrunken werden"
me_gordyene_15_desc: "Der Wein aus unseren Weinbergen war fast schon zu erfolgreich. Es ist schwer, einen Tisch oder ein Schlafgemach zu finden, auf dem kein Kelch oder Becher steht. Der Rauschzustand unserer Adligen und ihrer Gäste hat einige … peinliche Folgen gehabt."
me_gordyene_15.a: "Betrunkenheit ist der beste Zustand..."
me_gordyene_15_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_14$#!' $mission_completed_tooltip_2$"

me_gordyene_16_title: "Berge von Gagaten"
me_gordyene_16_desc: "Das Gordyaeische Gebirge hat Krüge voller Gagat-Edelsteine hervorgebracht wie eine Quelle, die warmes Wasser speit – eine Freude für alle. Dennoch halten sich hartnäckig Gerüchte, dass es entlang der Gebirgskette noch weitere Orte gibt, die ähnliche Adern voller Reichtümer bergen könnten."
me_gordyene_16.a: "Wir haben hier schon jede Menge Schmuck."
me_gordyene_16.b: "Ja, entdeckt neue Edelsteinvorkommen!"
me_gordyene_16_tooltip: "$mission_completed_tooltip_1$ '#Y $01_gordyene_task_15$#!' $mission_completed_tooltip_2$"
me_gordyene_16_b_tooltip: " #Y Gordyene#! wird eine #G Expedition#! entsenden, um nach vielversprechenden Standorten für #Y Gagaten-Minen#! zu suchen."


