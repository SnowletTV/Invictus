 ### MISSIONS 
 greek_5_pontus: "Vergessene Kinder von Hellas"
 greek_5_pontus_BUTTON_TOOLTIP: "Die hellenischen Republiken auf dem Pontos Euxinus müssen sich anpassen, um zu überleben."
 greek_5_pontus_BUTTON_DETAILS: ""
 greek_5_pontus_DESCRIPTION: "Unterjocht, isoliert oder kurz vor der Eroberung müssen sich die unterschiedlichen Kolonien der Pontos Euxinos zusammenschließen, um die kommenden Stürme zu überstehen."
 greek_5_pontus_CRITERIA_DESCRIPTION: "Vereinige die Hellenen des Nordens und bilde eine Liga von Städten, um die Vorherrschaft der Pontos Euxinos herauszufordern."
 greek_5_pontus_REWARD_DESCRIPTION: "Kontrolle über mehrere hellenische Kolonien und Meisterhandel im Schwarzen Meer."
 greek_5_pontus_loyalty_reward_tt: "Jedes Mitglied des #Y [gm_family_head_5.GetFamilyDisplayAdjective]#! Familie erhält #G 10#! LoyalitätLoyalität!"
 greek_5_2: "Ausbau der Poleis"
 greek_5_2_DESC: "Der Handel mit Hellenen, den Skythoi, den Getae und anderen hat in jüngster Zeit zu einem Segen in unserer Stadt geführt. Zahlreiche neue Einwanderer strömen in Scharen in unsere Stadt und wir müssen wachsen, um sie unterzubringen."
 greek_5_2_allow_tt: "Unsere Hauptstadtprovinz muss über eine erweiterte #Y State Infrastructure# verfügen! um all diese neuen Bewohner unterzubringen."
 greek_5_3: "Versammlung überzeugen"
 greek_5_3_DESC: "Spaltung und Fraktionismus kennzeichnen in letzter Zeit viele der Reden im Senat. Es scheint keinen Konsens darüber zu geben, wie wir unser neu gewonnenes Vermögen ausgeben sollen. Es wird eine Kombination aus starker Stimme und ausgefeilter Politik erfordern, um den Senat zu vereinen. Mit der Unterstützung des Senats verfügen wir über das politische Kapital, um unsere Expansionspläne voranzutreiben."
 greek_5_3_allow_tt: "Wir müssen eine Senatsgenehmigung von #R 60# haben! oder größer."
 greek_5_4: "Annäherung an Kolonie"
 greek_5_4_DESC: "Unsere Landsleute sind gespalten und wetteifern um ihre kleinen Handelsverbindungen und lokalen Exporte. Wir müssen sie davon überzeugen, größer zu träumen und der Sache aller Nordgriechen zu helfen."
 greek_5_4_allow_tt: "Alle freien griechischen Staaten mit weniger als #Y 5#! Territorien existieren rund um die Schwarzmeerküste."
 greek_5_4_reward_tt: "Kann einen hellenischen Feudalherren gewinnen."
 greek_5_5: "Grenzreibung"
 greek_5_5_DESC: "Es gibt bestimmte Fraktionen innerhalb unserer Regierung, die sich für eine aggressivere Haltung gegenüber einem unserer Nachbarn in Bezug auf den Besitz eines Territoriums einsetzen."
 greek_5_5_allow_tt: "Wir müssen entweder an eine andere hellenische Nation grenzen, die eine geringe Meinung von uns hat, oder an eine nicht-hellenische Nation."
 greek_5_6: "Barbarischer Tauschhandel"
 greek_5_6_DESC: "Die friedliche Ausweitung der Handelsmöglichkeiten ist eine alte griechische Tradition, und tatsächlich muss man nicht immer zu Speer und Schild greifen, um sich Zugang zu einem Markt zu verschaffen."
 greek_5_6_allow_tt_1: "#Y [gm_5_greek_scope.GetRulerTitle] [gm_5_greek_scope.GetRuler.GetPraenomen]#! hat mindestens #Y 6#! Charismaoratory_icon!"
 greek_5_6_allow_tt_2: "Jeder Schwarzmeerhafen innerhalb der Kontrollreichweite gehört einem Nicht-#Y $hellenic$#! Land, mit dem wir im Frieden sind und das über #R -50# hat! Meinung von uns."
 greek_5_6_reward_tt: "Kann einen Euxine-Port aus einem Nicht-$hellenic$-Land kaufen."
 greek_5_7: "Hellenisierung der Chora"
 greek_5_7_DESC: "Unser neu erworbenes Land muss von den richtigen Leuten besiedelt werden. Wir sollten eine Liste potenzieller Bürger und Ehrenbürger zusammenstellen, die die Kontrolle über die größere Chora unserer Poleis übernehmen können."
 greek_5_7_allow_tt: "Jedes Gebiet, das wir kontrollieren, hat weniger als 50 % unserer Primärkultur."
 greek_5_7_reward_tt: "Vier zufällige Pops werden zu Ihrer Kultur und Religion konvertiert."
 greek_5_8: "Eine Bastion für die Hellenen"
 greek_5_8_DESC: "Unsere einst kleine Kolonie ist unter den jüngsten Führungen erheblich gewachsen. Wo einst die Geldinteressen festgefahrener Eliten und ausländischer Eindringlinge Chaos verursachten, herrscht heute Harmonie. Andere griechische Kolonisten bemerken es und viele machen sich auf den Weg, um ihr Glück in #Y [gm_5_greek_scope.GetName]#! zu machen."
 greek_5_9: "Gründung der Istrischen Liga"
 greek_5_9_DESC: "Zukünftige Generationen werden sich vielleicht darüber streiten und streiten, ob es um das Streben nach größerer Kontrolle über den Euxine-Handel oder um ein pragmatisches Selbstverteidigungsgefühl ging, das unsere Handlungen leitete. Auf die eine oder andere Weise ist es an der Zeit, dass sich die Städte an der Westküste der Pontos Euxinos zusammenschließen und eine neue Liga von Städten bilden, um sich den Herausforderungen unserer Zeit zu stellen!"
 greek_5_9_allow_tt: "Die #Y istrische Liga#! kann nicht schon existieren."
 greek_5_9_reward_tt: "Wir werden eine neue Nation gründen und Ansprüche auf die umliegenden Provinzen erhalten."
 greek_5_10: "Gründung der Bosporanischen Liga"
 greek_5_10_DESC: "Zukünftige Generationen werden sich vielleicht darüber streiten und streiten, ob es um das Streben nach größerer Kontrolle über den Euxine-Handel oder um ein pragmatisches Selbstverteidigungsgefühl ging, das unsere Handlungen leitete. Auf die eine oder andere Weise ist es an der Zeit, dass sich die Städte an der Nordküste der Pontos Euxinos zusammenschließen und eine neue Liga von Städten bilden, um sich den Herausforderungen unserer Zeit zu stellen!"
 greek_5_10_allow_tt: "Die #Y Bosporanische Liga#! kann nicht schon existieren."
 greek_5_10_reward_tt: "Wir werden eine neue Nation gründen und Ansprüche auf die umliegenden Provinzen erhalten."
 greek_5_11: "Gründung des Pontischen Bundes"
 greek_5_11_DESC: "Zukünftige Generationen werden sich vielleicht darüber streiten und streiten, ob es um das Streben nach größerer Kontrolle über den Euxine-Handel oder um ein pragmatisches Selbstverteidigungsgefühl ging, das unsere Handlungen leitete. Auf die eine oder andere Weise ist es an der Zeit, dass sich die Städte an der Nordküste der Pontos Euxinos zusammenschließen und eine neue Liga von Städten bilden, um sich den Herausforderungen unserer Zeit zu stellen!"
 greek_5_11_allow_tt: "Die #Y Pontic League#! kann nicht schon existieren."
 greek_5_11_reward_tt: "Wir werden eine neue Nation gründen und Ansprüche auf die umliegenden Provinzen erhalten."
 greek_5_12: "An der Kreuzung"
 greek_5_12_DESC: "Die Region von Scythia Minor, die vom Istros begrenzt wird, bildet das Tor zwischen den Steppennomaden, den Stämmen der Getae und der hellenischen Welt im Süden. Die Kontrolle über dieses Territorium ist von größter Bedeutung für die Verteidigung unserer Interessen."
 greek_5_13: "Meister der Steppe"
 greek_5_13_DESC: "Der Flusshandel ist das Lebenselixier unserer Städte. Nichts weniger als die totale Kontrolle der Mündungen der Flüsse Tyras und Borysthenes sowie des Bosporus Cimmerus wird ausreichen. Sobald diese Ländereien sicher sind, werden wir sicherstellen, dass wir den Warenfluss von den Nomadenstämmen in die eigentliche griechische Welt kontrollieren."
 greek_5_14: "Eine pontische Festung"
 greek_5_14_DESC: "Die Verteidigung unserer Städte erfordert den Erwerb von zusätzlichem Territorium. Indem wir die Bergpässe zwischen unseren Städten und dem Rest Asiens kontrollieren, können wir Angreifer abwehren, während wir vom Meer aus verstärkt werden."
 greek_5_14_reward_tt: "Sie erhalten ein Gebäude Ihrer Wahl in Ihrer Hauptstadt. \nJe nach Auswahl erhalten Sie auch einen Modifikator in Ihrer Hauptstadt."
 greek_5_15: "Schutz der Mutterstadt"
 greek_5_15_DESC: "Viele unserer Leute stammen historisch gesehen entweder aus Milet oder Heraklea Pontike. Es gibt einen starken Vorstoß von einer Fraktion innerhalb unserer Regierung, die zum Handeln auffordert, um die Stadt zu verteidigen, die sie einst Mutter nannten. Mit unserer neuen Stärke könnten wir unsere Heimat zurückerobern und unser Erbe für zukünftige Generationen bewahren."
 greek_5_16: "Aufbau eines Handelsimperiums"
 greek_5_16_DESC: "Wir müssen unsere Flottenkapazität weiter ausbauen, wenn wir mit unseren Rivalen konkurrieren wollen."
 greek_5_17: "Bewachung der Handelsflotte"
 greek_5_17_DESC: "Wenn wir unseren Handel in den Pontos Euxinos optimal nutzen wollen, müssen wir sicherstellen, dass es für Händler und Reisende relativ sicher ist, seine Gewässer zu durchqueren."
 greek_5_17_allow_tt: "Eine Marine mit mindestens #Y 30#! Liburner [gm_family_head_5.GetFamilyDisplayAdjective]liburnian! wird von einem Admiral aus dem #Y# geführt! Familie."
 greek_5_17_allow_tt_fallback: "Eine Marine mit mindestens #Y 30#! Liburnerliburnian! wird von einem Admiral geführt."
 greek_5_17_reward_tt: "Der ernannte Admiral erhält #G 15#! Loyaltyloyalty_icon!. \nSie können dann einen Bonus für diese Flotte auswählen."
 greek_5_18: "Oberste Kaufleute"
 greek_5_18_DESC: "Der Handel mit Hellenen, den Skythoi, den Getae und anderen hat in jüngster Zeit zu einem Segen in unserer Stadt geführt. Zahlreiche neue Einwanderer strömen in Scharen in unsere Stadt und wir müssen wachsen, um sie unterzubringen."
 greek_5_19: "Erbe der Kolonialisierung"
 greek_5_19_DESC: "Weit weg von der Stadt, die wir einst Heimat nannten, hat das Wachstum unserer bescheidenen Poleis viele dazu gebracht, sich zu fragen, ob wir die Geschichte wiederholen und eine neue Stadt im Ausland gründen sollen?"
 greek_5_20: "Eine edle Suche"
 greek_5_20_DESC: "Die richtige Anbetung der Götter geht mit Opfern einher. Wir mögen hinter unseren Mauern und auf den Decks unserer Schiffe sicher sein, aber wenn wir gerufen werden, antworten ehrenwerte Griechen."
 greek_5_21: "Auf den Spuren von Iphegeneia"
 greek_5_21_DESC: "Barbaren und Griechen wissen die Götter gleichermaßen zu ehren. Wehe denen, die ihre Schreine verfallen lassen ... und Ruhm denen, die ihnen ihren rechtmäßigen Glanz zurückgeben."
 greek_5_22: "Erkundung von Taurica"
 greek_5_22_DESC: "Die Länder der Taurianer zu durchsuchen, ist keine leichte Aufgabe. Es wird Zeit und Mühe kosten, unsere Ziele zu erreichen."
 greek_5_22_allow_tt: "Der Tempel kann nicht bereits entdeckt werden."
 greek_5_23: "Verankerung der Schutzgöttin"
 greek_5_23_DESC: "Unsere Suche hat positive Ergebnisse erbracht! Jetzt werden wir das einst verlorene Xoanon verherrlichen und das Prestige erhalten, das wir verdienen."
 greek_5_23_reward_tt: "Zwei neue Gottheiten werden in deinem Pantheon verfügbar sein: #Y Artemis Tauropolos#! und #Y Hekate Iphemide#!. \nSie können dann über das Schicksal des verlassenen Tempels entscheiden."
 greek_5_24: "Gründung von Manitra"
 greek_5_24_DESC: "Die einst stolze Hauptstadt des Königreichs der Spartokiden liegt in Trümmern. Vielleicht kann eine neue Stadt gebaut und mit Griechen besiedelt werden, die unserer Sache treu ergeben sind?"
 greek_5_25: "Skythoi-Händler"
 greek_5_25_DESC: "Der Sklavenhandel ist für die Wirtschaft der Küstenstädte der Pontos Euxinos von wesentlicher Bedeutung, und die Skythoi sind vielleicht der erfolgreichste Lieferant. Das Territorium von #Y [GetProvince('(int32)4557').GetName]#! ist der Slave-Hub Nummer eins in der Gegend. Wer ein günstiges Handelsabkommen mit den Skythoi abschließen kann, wird sicherlich beginnen, seine Rivalen zu überflügeln."
 greek_5_25_allow_tt: "Wir brauchen gute Beziehungen zu #Y [GetProvince('(int32)4557').GetOwner.GetName]"
 greek_5_25_allow_tt_1: "Niemand sonst handelt derzeit mit #Y [GetProvince('(int32)4557').GetOwner.GetName]."
 greek_5_25_reward_tt: "Eines unserer Territorien wird mehrere neue Sklaven-Pops erhalten ... vielleicht mehr, wenn die Verhandlungen gut verlaufen."
 greek_5_26: "Throwing Off Thrace"  <None>  #NT!
 greek_5_26_DESC: "For too long, the proud poleis of the Euonymos Pontos, Istros, Kallatis, Odessos, Mesembria, and Apollonia, have endured the burdensome oversight of Thracian kings and satraps. Though alliances have been made and treaties sworn, our cities were not founded to bow before petty dynasts. The time has come to cast off these foreign fetters and revive our autonomy. United in purpose, the Greek cities of the Euonymos Pontos shall rise together once more."  <None>  #NT!
 greek_5_26_reward_tt: "The Thracian subjects on the Euonymos Pontos will join together in an #E Independence War#!#!."  <None>  #NT!
 greek_5_27: "Reorganizing Orgame"  <None>  #NT!
 greek_5_27_DESC: "Orgame, located at Cap Dolojman near modern Jurilovca, was one of the earliest Milesian foundations along the Western Pontic coast. Archaeological evidence places its founding in the mid-7th century BCE, possibly as a secondary 'apoikia' established from nearby Istros. The site itself shows traces of earlier habitation dating back to the Bronze Age, though its urban development remained modest compared to neighboring poleis. Orgame's history is obscure, but it may have remained a dependent kome within the chora of Istros. It is said that Jason and the Argonauts rested here for a time before continuing on their way back to the Greek world with the Golden Fleece in tow."  <None>  #NT!
 greek_5_27_tt: "#E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#! can release #E Orgame#! as a #Y Feudatory#! or a #Y Colony#!"  <None>  #NT!
 greek_5_28: "'Independent' Tomis"  <None>  #NT!
 greek_5_28_DESC: "Tomis, located on the peninsula of modern Constanta, was founded in the 6th century BCE, either directly by Miletos or through nearby Istros. Though the city features in local legend as a resting place of Jason and the Argonauts, and some later traditions connect it to Queen Tomyris of the Massagetae, historical and archaeological evidence suggest it began as an 'emporion,' a coastal trading post rather than a full polis. Strabo called it a 'polichnion,' while Memnon likewise used 'emporion' to describe it in the late 3rd century BCE. Tomis became a point of contention in the 260s BCE, caught in a territorial dispute between Kallatis and Byzantion. Its elevation to 'apoikia' status may have followed this conflict. By the 2nd century BCE, Tomis issued decrees and developed civic institutions, including an eponymous priest of Apollo,its chief deity.. Inscriptions from the Roman period attest to all six Milesian 'phylai': Argadeis, Boreis, Geleontes, Oinopeis, Hopletes, and Aigikoreis. By the Roman Imperial period, Tomis referred to itself as a 'patris' and was the meeting place of the 'Koinon tou Eunnymou Pontou' (League of the Western Pontus)."  <None>  #NT!
 greek_5_28_tt: "#E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#! can release #E Tomis#! as a #Y Feudatory#! or a #Y Colony#!"  <None>  #NT!
 greek_5_29: "The City of Dionysos"  <None>  #NT!
 greek_5_29_DESC: "Originally a Thracian settlement on a naturally defensible coastal site, Krounoi was refounded in the 5th century BCE by Ionian settlers, likely from nearby Odessos, who named it for its abundant freshwater springs ('krounoi'). Some sources also record the name Matiopolis in reference to the site. According to local tradition, the settlement later became known as Dionysopolis, after a statue of Dionysos was miraculously discovered emerging from the sea, prompting the establishment of his cult. A more daring interpretation connects the city's final name and foundation to a later Hellenistic initiative by Dionysiac settlers during or after the campaigns of Alexander the Great. Velkov posits that although the location was not ideal for the foundation of a fully independent colony, the citizens of Odessos established an emporion to take advantage of the harbor's commercial potential. Dionysopolis appears to have fully emerged as a 'polis' with developed political institutions only in the mid-3rd century BCE. In the Roman period, Dionysopolis participated in the regional 'Koinon tou Euonymou Pontou' (League of the Western Pontus)."  <None>  #NT!
 greek_5_29_tt: "#E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#! can release #E Dionysopolis#! as a #Y Feudatory#! or a #Y Colony#!"  <None>  #NT!
 greek_5_30: "Restore Nikonion"  <None>  #NT!
 greek_5_30_DESC: "Once a modest yet prosperous emporion on the lower Istros, Nikonion was likely founded in the late 6th century BCE by Istros, itself a proud Milesian colony. Nikonion came under the protectorate of the Skythian king Skyles and even minted bronze coinage bearing Scythian symbols. Nikonion was laid waste by Zopyrion, Alexander's ill-fated strategos of Thrace, around 331 BCE. The time has come to restore Nikonion to glory."  <None>  #NT!
 greek_5_30_tt: "#E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#! can release #E Nikonion#! as a #Y Feudatory#! or a #Y Colony#!"  <None>  #NT!
 greek_5_30_tt_2: "#Y Histrianon Limen#! becomes owned by #E Nikonion#!"  <None>  #NT!
  
 ### MISSION EVENTS 
 me_gre_task_start_tt_5: "[gm_5_greek_scope.GetRulerTitle] [gm_5_greek_scope.GetRuler.GetPraenomen] beginnt"
 me_greek_5_pontus.1.t: "$greek_5_pontus$: Unternehmungslustige [gm_family_head_5.GetFamilyDisplayAdjective]s"
 me_greek_5_pontus.1.desc: "Seit einiger Zeit gibt es Grummeln in [gm_5_greek_scope.GetName], was den Wunsch nach mehr Einfluss bei den Pontos Euxinos weckt. \n \nEs scheint, dass der Hauptanstifter [gm_family_head_5.GetPraenomen] ist, der zweifellos [gm_family_head_5.GetHerHis] seine eigenen Ziele verfolgt, aber wenn nicht wir – wer sonst?"
 me_greek_5_pontus.1.a: "Wer sonst."
 me_greek_5_pontus.2.t: "Nicht mehr vergessen"
 me_greek_5_pontus.2.desc: "Während die Kolonien Pontos Euxinos ursprünglich nur die weit verstreuten Kinder überfüllter oder bedrohter Städte gewesen sein mögen, hat unser Erfolg allen klar gemacht, dass die Hellenen auf den Pontos Euxinos stolz, stark und wohlhabend sind. \n \nUnser Bündnis von Verbindungen hat einst gespaltene Griechen näher zusammengebracht und dadurch unser Vermächtnis gesichert."
 me_greek_5_pontus.2.a: "Lass es die Ausrufer auf der Agora rufen!"
 me_greek_5_pontus.2.at: "Die Mission „#Y Forgotten Children of Hellas#!“ wurde #G abgeschlossen#!!"
 me_greek_5_pontus.3.t: "$greek_5_2$"
 me_greek_5_pontus.3.desc: "Unsere Hauptstadt wächst nicht ohne eine beträchtliche Menge an Planung, Debatten und harter Arbeit. Unsere Kolonialstadt wächst und mit ihr wachsen unsere Bestrebungen und Ambitionen. Was auch immer unser nächster Schritt sein mag, er wird die Unterstützung des lokalen Senats erfordern. So sind unsere Traditionen."
 me_greek_5_pontus.3.a: "So wie es sein sollte."
 me_greek_5_pontus.3.at: "$mission_task_completed_tt_1$$greek_5_2$$mission_task_completed_tt_2$"
 me_greek_5_pontus.4.t: "$greek_5_3$: Vermessung der politischen Landschaft"
 me_greek_5_pontus.4.desc: "Die jüngste Erweiterung der Poleis hat viele im Senat dazu veranlasst, ihre eigenen Interessen voranzutreiben. Möchtegern-Lords von edlem Blut, aufstrebende Kaufleute, Politiker aller Couleur im Senat schreien wie am besten #Y [gm_5_greek_scope.GetName]#! fortfahren soll."
 me_greek_5_pontus.4.a: "Die verschiedenen Fraktionen des Senats zu besänftigen, wird keine einfache Aufgabe sein."
 me_greek_5_pontus.4.at: "Der Senat wird 180 Tage lang debattieren."
 me_greek_5_pontus.5.t: "$greek_5_3$: Mit der Unterstützung des Senats"
 me_greek_5_pontus.5.desc: "Durch eine Kombination aus Charisma, Hinterzimmergeschäften, einigen gut platzierten Bestechungsgeldern und einer wilden Entschlossenheit ist es uns gelungen, die Mehrheit der Senatsmitglieder davon zu überzeugen, dass unsere Expansionspolitik der richtige Weg ist und sicherlich für alle erfolgreich sein wird."
 me_greek_5_pontus.5.a: "Jetzt beginnt die eigentliche Arbeit."
 me_greek_5_pontus.5.at: "$mission_task_completed_tt_1$$greek_5_3$$mission_task_completed_tt_2$"
  ## Approach Colonies Start 
 #me_greek_5_pontus.6.t: "$greek_5_4$: Hellenische Abgesandte"
 #me_greek_5_pontus.6.desc_1: "Wir sind in der Lage, unseren Einfluss auf die anderen Euxinischen Kolonien auszudehnen, die in der Vergangenheit ihren eigenen Weg gefunden haben.\n\n"
 #me_greek_5_pontus.6.desc: "Wir können uns darauf verlassen, dass [gm_family_head_5.GetPraenomen] [gm_family_head_5.GetFamilyDisplayAdjective] uns eine ehrliche Einschätzung der verschiedenen Möglichkeiten gibt, die sich uns bieten - unsere Interessen stimmen perfekt überein."
 #me_greek_5_pontus.6.a: "An die Arbeit."
 #me_greek_5_pontus.6.at: "$me_gre_task_start_tt_5$ Bewertung der freien Kolonien."
 #me_greek_5_pontus.7.t: "$greek_5_4$: Greek Governments"
 #me_greek_5_pontus.7.desc: "Unsere Kaufleute sind von den freien hellenischen Kolonien des Euxin mit ihren Bewertungen zurückgekehrt.\n\nWir sollten unser Angebot mit Bedacht machen, indem wir unsere früheren Geschäfte und ihre relative Größe berücksichtigen."
 #me_greek_5_pontus.7.a: "Lasst uns [gm_5_colony_scope_1.GetName] ansprechen."
 #me_greek_5_pontus.7.b: "Was ist mit [gm_5_colony_scope_2.GetName]?"
 #me_greek_5_pontus.7.c: "Es sollte [gm_5_colony_scope_3.GetName] sein."
 #me_greek_5_pontus.7.d: "[gm_5_colony_scope_4.GetName] ist sehr vielversprechend."
 #me_greek_5_pontus.7.e: "Nein, es muss [gm_5_colony_scope_5.GetName] sein."
 #me_greek_5_pontus.7.f: "Dummköpfe, nur [gm_5_colony_scope_6.GetName] ist geeignet."
 #me_greek_5_pontus.7.g: "[SCOPE.Custom('gm_5_get_go_back_colony')]"
 #me_greek_5_pontus.7.gt: "Wir werden andere mögliche Kolonien in Betracht ziehen."
 #me_greek_5_pontus.7.h: "Vergiss es, sie sind es nicht wert."
 #me_greek_5_pontus.7.ht: "[gm_5_greek_scope.GetName] wird nicht mehr versuchen, sich Kolonien zu nähern."
 #me_greek_5_pontus.7.tt: "Wir werden uns #Y [gm_5_colony_target_scope.GetName]#! mit einem Angebot von #G [SCOPE.ScriptValue('gm_5_colony_value')]#! Die Chance, dass das Angebot angenommen wird, wird durch das Charisma von #Y [gm_family_head_5.GetPraenomen]#!, die relative Größe des Landes und die diplomatische Meinung beeinflusst. [SCOPE.Custom('gm_5_chance_colony')]\nWenn sie sich weigern, erhalten wir einen Anspruch auf das gesamte [gm_5_colony_target_scope.GetAdjective] Territorium."
 #me_greek_5_pontus.71.t: "$greek_5_4$: [gm_5_greek_scope.GetAdjective] Angebot"
 #me_greek_5_pontus.71.desc: "Wir sind von Händlern aus [gm_5_greek_scope.GetName] angesprochen worden, die ihre Regierung vertreten. Sie wollen uns ihren Schutz im Tausch gegen ein Geschenk anbieten, obwohl klar ist, dass ihre wahre Absicht darin besteht, ihren eigenen Einfluss auszuweiten..."
 #me_greek_5_pontus.71.bt: "Wenn #Y [gm_5_greek_scope.GetName]#! das Angebot annimmt, erhalten wir das doppelte Geld dafür, dass wir ihr Lehnsherr werden (#G [SCOPE.ScriptValue('gm_5_colony_double_value')]#! @gold!), andernfalls werden sie Ansprüche erheben."
 #me_greek_5_pontus.71.a: "Der Preis der Sicherheit."
 #me_greek_5_pontus.71.b: "Wir können mehr verlangen."
 #me_greek_5_pontus.71.c: "Man unterschätzt uns."
 #me_greek_5_pontus.71.ct: "[gm_5_greek_scope.GetName] erhebt Anspruch auf unser gesamtes Gebiet."
 #me_greek_5_pontus.72.t: "$greek_5_4$: [gm_5_colony_target_scope.GetAdjective] Negotiations"
 #me_greek_5_pontus.72.desc: "Die Händler, die von [gm_family_head_5.GetName] zu Verhandlungen mit [gm_5_colony_target_scope.GetName] geschickt wurden, sind zurückgekehrt "
 #me_greek_5_pontus.72.desc_1: "with terms of acceptance from their [gm_5_colony_target_scope.GetRulerTitle], [gm_5_colony_target_scope.GetRuler.GetPraenomen]!\n\nWe have already dispatched the promised funds along with a party of magistrates who will oversee the [gm_5_colony_target_scope.GetAdjective] payments of tribute as a [gm_5_greek_scope.GetAdjective] subject."  <None>  #NT!
 #me_greek_5_pontus.72.desc_2: "mit einem Gegenangebot ihres [gm_5_colony_target_scope.GetRulerTitle], [gm_5_colony_target_scope.GetRuler.GetPraenomen].\n\nSie sind bereit, unseren Schutz zu akzeptieren und Tribut zu zahlen, verlangen dafür aber einen weitaus höheren Preis."
 #me_greek_5_pontus.72.desc_3: "Die [gm_5_colony_target_scope.GetRulerTitle], [gm_5_colony_target_scope.GetRuler.GetPraenomen].\n\nDer Brief behauptet, dass sie durchaus in der Lage sind, sich selbst zu verteidigen, und das [gm_5_colony_target_scope.GetAdjective] Volk wird seine Freiheit nicht für Profit eintauschen."
 #me_greek_5_pontus.72.a: "Sehr weise von ihnen."
 #me_greek_5_pontus.72.b: "Wir bewundern ihren Willen..."
 #me_greek_5_pontus.72.c: "...aber sie hätten das Angebot annehmen sollen."
 #me_greek_5_pontus.72.d: "Eine wahnsinnige Schande."
 #me_greek_5_pontus.72.tt: "$mission_task_completed_tt_1$$greek_5_4$$mission_task_completed_tt_2$"
 #me_greek_5_pontus.73.t: "$greek_5_4$: Antwort von [gm_5_greek_scope.GetName]"
 #me_greek_5_pontus.73.desc: "Unser Gegenangebot an [gm_5_greek_scope.GetName] hat endlich eine Antwort gefunden.\n\n"
 #me_greek_5_pontus.73.desc_1: "Es scheint, dass sie darauf erpicht sind, ihren Einfluss auf den Euxine zu erweitern, und unsere teuren Forderungen akzeptiert haben!"
 #me_greek_5_pontus.73.desc_2: "Es scheint, dass die Geizhälse durch unsere Forderungen verunsichert wurden und beschlossen haben, ihr 'großzügiges Freundschaftsangebot' zurückzuziehen."
 #me_greek_5_pontus.73.a: "Wir sind es wert."
 #me_greek_5_pontus.73.b: "Großzügig in der Tat..."
 #me_greek_5_pontus.73.ct: "TODO"
 #me_greek_5_pontus.8.t: "$greek_5_4$: Die Schicksale"
 #me_greek_5_pontus.8.desc: "Unsere Handelsgesandten sind mit leeren Händen zurückgekehrt, es scheint, dass es einfach keine geeigneten Kolonien gibt, denen wir Schutz bieten können."
 #me_greek_5_pontus.8.a: "Verflixt."
 #me_greek_5_pontus.8.at: "Die Missionsaufgabe '#Y $greek_5_4$#!' wurde #R Bypassed#!!"
  ## Approach Colonies End 
  
  ## Border Friction Start 
 me_greek_5_pontus.9.t: "$greek_5_5$: Beginn der Debatte"
 me_greek_5_pontus.9.desc: "Wir sind mächtig genug, um darüber nachzudenken, wem einige Ländereien in unserer Region gehören sollten. Während Diplomatie vorzuziehen ist, gibt es diejenigen, die glauben, dass diese Länder mit dem Speer erobert werden müssen."
 me_greek_5_pontus.9.desc_1: "Welche Richtung wichtiger wäre, wird der Senat debattieren."
 me_greek_5_pontus.9.a: "In der Tat mächtig ..."
 me_greek_5_pontus.10.t: "$greek_5_5$: Debatte abgeschlossen"
 me_greek_5_pontus.10.desc: "Der Senat hat die Expansionsgespräche beendet und Anspruch auf alle Ländereien rund um die Hauptstadt erhoben."
 me_greek_5_pontus.10.desc_1: "Wir sollten diese neu beanspruchten Gebiete so schnell wie möglich erreichen, um unsere Stärke zu demonstrieren."
 me_greek_5_pontus.10.a: "Vorwärts, zum Sieg!"
 me_greek_5_pontus.10.at: "Wir haben einen Anspruch auf unser Heimatgebiet #Y [gm_5_greek_area_scope.GetName]# erhalten!"
 me_greek_5_pontus.11.t: "$greek_5_5$: Die Schicksale"
 me_greek_5_pontus.11.desc: "Leider gibt es keine geeigneten Länder mehr, denen wir Schutz bieten können."
 me_greek_5_pontus.11.a: "Drat"
 me_greek_5_pontus.11.at: "Die Missionsaufgabe '#Y $greek_5_5$#!' wurde #R umgangen#!!"
  ## Border Friction End 
  
  ## Barbarian Bartering Start 
 #me_greek_5_pontus.12.t: "$greek_5_6$: Shopping Around"
 #me_greek_5_pontus.12.desc: "[gm_family_head_5.GetPraenomen] der [gm_family_head_5.GetFamilyDisplayAdjective]s organisiert Händlergruppen, um die verschiedenen Barbarenstädte zu begutachten und ihren Wert und die Freundlichkeit des aktuellen Besitzers zu beurteilen."
 #me_greek_5_pontus.12.a: "Machen Sie weiter."
 #me_greek_5_pontus.12.at: "$me_gre_task_start_tt_5$ Schätzung der von den Barbaren gehaltenen Häfen."
 #me_greek_5_pontus.121.t: "$greek_5_6$: Euxine Havens"
 #me_greek_5_pontus.121.desc: "Die von [gm_family_head_5.GetPraenomen] gesandten Händler sind mit einer Liste möglicher Häfen zurückgekehrt, deren Nutzung wir eventuell kaufen können. Sie geben auch an, was wir anbieten müssten, um den Appetit des derzeitigen Besitzers zu wecken, falls dies überhaupt möglich ist."
 #me_greek_5_pontus.121.a: "[gm_5_bartering_scope_1.GetName], ein Port von [gm_5_bartering_scope_1.GetOwner.GetName]?"
 #me_greek_5_pontus.121.b: "Wir hören gute Dinge über [gm_5_bartering_scope_2.GetOwner.GetAdjective] [gm_1_bartering_scope_2.GetName]."
 #me_greek_5_pontus.121.c: "Was ist mit [gm_5_bartering_scope_3.GetName], in [gm_5_bartering_scope_3.GetOwner.GetName]?"
 #me_greek_5_pontus.121.d: "Es muss [gm_5_bartering_scope_4.GetName] in [gm_5_bartering_scope_4.GetOwner.GetName] sein."
 #me_greek_5_pontus.121.e: "[gm_5_bartering_scope_5.GetName] scheint von [gm_5_bartering_scope_5.GetOwner.GetName] zu profitieren..."
 #me_greek_5_pontus.121.f: "Die Position von [gm_5_bartering_scope_6.GetOwner.GetAdjective] [gm_5_bartering_scope_6.GetName] ist hervorragend."
 #me_greek_5_pontus.121.g: "[SCOPE.Custom('gm_5_get_go_back')]"
 #me_greek_5_pontus.121.gt: "Wir werden andere mögliche Ports in Betracht ziehen."
 #me_greek_5_pontus.121.h: "Das ist es nicht wert."
 #me_greek_5_pontus.121.ht: "[gm_5_greek_scope.GetName] wird die Prüfung von Häfen einstellen."
 #me_greek_5_pontus.121.tt: "Wir werden anbieten, #Y [gm_5_barter_target_territory.GetName]#! von [gm_5_barter_target_territory.GetOwner.GetName] für #R -[SCOPE.ScriptValue('gm_5_barter_territory_value')]# zu kaufen! @gold!\nDie Chance auf Annahme wird durch das Charisma von #Y [gm_family_head_5.GetPraenomen]#!, den relativen Wert des Hafens und die diplomatische Meinung beeinflusst. [SCOPE.Custom('gm_5_chance_barter')]\nWenn sie sich weigern, erhalten wir einen Anspruch auf #Y [gm_5_barter_target_territory.GetName]#!"
 #gm_5_get_go_back_1: "Es gibt andere Möglichkeiten..."
 #gm_5_get_go_back_2: "On second thoughts..."
 #gm_5_unlikely: "Sie sind #R unwahrscheinlich#! zu akzeptieren."
 #gm_5_likely: "Sie sind #G wahrscheinlich#! zu akzeptieren."
 #me_greek_5_pontus.122.t: "$greek_5_6$: Canny Greeks of [gm_5_greek_scope.GetName]"
 #me_greek_5_pontus.122.desc: "Wir wurden von Kaufleuten angesprochen, die behaupten, [gm_5_greek_scope.GetName] zu vertreten, einen hellenischen Staat in [gm_5_greek_scope.GetCapital.GetArea.GetRegion.GetName] an der Küste des Pontos Euxinos.\n\nSie möchten die Landung in [gm_5_barter_target_territory.GetName] im Austausch für einen 'angemessenen Aufwand' erwerben."
 #me_greek_5_pontus.122.bt: "Wenn #Y [gm_5_greek_scope.GetName]#! akzeptieren, erhalten wir das doppelte Geld im Austausch für #Y [gm_5_barter_target_territory.GetName]#! (#G [SCOPE.ScriptValue('gm_5_barter_territory_double_value')]#! @gold!), sonst erhalten sie einen Claim."
 #me_greek_5_pontus.122.a: "Was für ein Glück, die Narren werden uns reich machen!"
 #me_greek_5_pontus.122.b: "Vielleicht, für eine größere Summe."
 #me_greek_5_pontus.122.c: "Sie beleidigen unsere Intelligenz!"
 #me_greek_5_pontus.122.ct: "[gm_5_greek_scope.GetName] gewinnt einen Anspruch auf #Y [gm_5_barter_target_territory.GetName]#!."
 #me_greek_5_pontus.123.t: "$greek_5_6$: [gm_5_barter_target_territory.GetOwner.GetAdjective] Negotiations"
 #me_greek_5_pontus.123.desc: "Die von [gm_family_head_5.GetName] ausgesandten Händler, die mit [gm_5_barter_target_territory.GetOwner.GetName] verhandeln sollten, sind zurückgekehrt "
 #me_greek_5_pontus.123.desc_1: "with terms of acceptance from the barbarian [gm_5_barter_target_territory.GetOwner.GetRulerTitle], [gm_5_barter_target_territory.GetOwner.GetRuler.GetPraenomen]!\n\nWe have already dispatched the promised funds along with a party of magistrates who will oversee the administration of [gm_5_barter_target_territory.GetName] as a [gm_5_greek_scope.GetAdjective] port."  <None>  #NT!
 #me_greek_5_pontus.123.desc_2: "with a counter offer presented by the barbarian [gm_5_barter_target_territory.GetOwner.GetRulerTitle], [gm_5_barter_target_territory.GetOwner.GetRuler.GetPraenomen].\n\nThey are prepared to sell us the lands and harbor surrounding [gm_5_barter_target_territory.GetName], but demand a far steeper price in exchange."  <None>  #NT!
 #me_greek_5_pontus.123.desc_3: "with a flat refusal from the barbarian [gm_5_barter_target_territory.GetOwner.GetRulerTitle], [gm_5_barter_target_territory.GetOwner.GetRuler.GetPraenomen].\n\nThe letter claims the land is ancient territory of the [gm_5_barter_target_territory.GetOwner.GetAdjective] people and worth far more than any shiny trinkets."  <None>  #NT!
 #me_greek_5_pontus.123.a: "Ha, die Narren!"
 #me_greek_5_pontus.123.b: "Sehr schlau, für barbarische Welpen..."
 #me_greek_5_pontus.123.c: "...but our original offer was more than fair!"
 #me_greek_5_pontus.123.d: "Wir haben andere, blutigere, Mittel."
 #me_greek_5_pontus.124.t: "$greek_5_6$: Antwort von [gm_5_greek_scope.GetName]"
 #me_greek_5_pontus.124.desc: "Unser Gegenangebot an [gm_5_greek_scope.GetName] hat endlich eine Antwort gefunden.\n\n"
 #me_greek_5_pontus.124.desc_1: "Es scheint, als wollten sie das Land und den Hafen, den es für Schiffe bietet, unbedingt erwerben und haben unsere Forderungen akzeptiert. Unsere Schatzkammer füllt sich mit dem Lohn unserer vertrauensvollen Geschäfte!"
 #me_greek_5_pontus.124.desc_2: "Es scheint, dass die Geizhälse durch unsere Forderungen verärgert waren und sich weigerten, 'bei lebendigem Leibe von hosentragenden Wilden gehäutet zu werden.'"
 #me_greek_5_pontus.124.a: "Wissen sie etwas, was wir nicht wissen?"
 #me_greek_5_pontus.124.b: "Diese Churls sollten das besser vergessen."
 #me_greek_5_pontus.13.t_1: "$greek_1_7$"
 #me_greek_5_pontus.13.t_2: "$greek_1_8$"
 #me_greek_5_pontus.13.t_3: "$greek_1_10$"
 #me_greek_5_pontus.13.t_4: "$greek_1_9$"
 #me_greek_5_pontus.13.desc: "Unsere jüngste Expansion in neue Gebiete des Pontos Euxinos hat unsere Fähigkeit, die nördlichen Handelsrouten zu kontrollieren, massiv verbessert, genau wie [gm_family_head_5.GetPraenomen] gehofft hatte.\n\n"
 #me_greek_5_pontus.13.desc_1: "Die alten Kolonien an der bithynischen Küste werden als lebenswichtige Hochburgen hellenischen Einflusses an der Südküste dienen."
 #me_greek_5_pontus.13.desc_2: "Die alten Kolonien von Khersonesos gehören zu den reichsten in der gesamten Region und werden uns sicher großen Reichtum bringen."
 #me_greek_5_pontus.13.desc_3: "Die alten Kolonien an der getischen Küste werden als Zentren des Handels und der Zivilisation wieder auferstehen."
 #me_greek_5_pontus.13.desc_4: "Der unerschlossene Reichtum der Kolchis wird endlich wieder der hellenischen Ausbeutung zugänglich sein; diese alten Häfen werden neu geboren."
 #me_greek_5_pontus.13.a: "Ausgezeichnet."
 #me_greek_5_pontus.13.at1: "$mission_task_completed_tt_1$$greek_1_7$$mission_task_completed_tt_2$"
 #me_greek_5_pontus.13.at2: "$mission_task_completed_tt_1$$greek_1_8$$mission_task_completed_tt_2$"
 #me_greek_5_pontus.13.at3: "$mission_task_completed_tt_1$$greek_1_10$$mission_task_completed_tt_2$"
 #me_greek_5_pontus.13.at4: "$mission_task_completed_tt_1$$greek_1_9$$mission_task_completed_tt_2$"
 #me_greek_5_pontus.13.tt: "Die Staaten der betreffenden Territorien haben Boni für Handel und Assimilation erhalten."
 #me_greek_5_pontus.14.t: "$greek_5_6$: Die Schicksale"
 #me_greek_5_pontus.14.desc: "Unsere Handelsgesandten sind mit leeren Händen zurückgekehrt, es scheint, als gäbe es einfach keine geeigneten Plätze mehr zum Tauschen."
 #me_greek_5_pontus.14.a: "Explosion"
 #me_greek_5_pontus.14.at: "Die Missionsaufgabe '#Y $greek_5_6$#!' wurde #R Bypassed#!!"
  ## Barbarian Bartering End 
  
  ## Hellenizing the Chora Start 
 me_greek_5_pontus.15.t: "$greek_5_7$: Vorbereitungen treffen"
 me_greek_5_pontus.15.desc: "Ehrenwerter Archon, es ist eine Farce, dass Barbaren, die nicht unserer Religion oder Kultur angehören, in unseren neu erworbenen Ländern angesiedelt werden. Unsere großartigen Entwürfe erfordern, dass diese Ländereien in vertrauenswürdigere Hände gelangen."
 me_greek_5_pontus.15.desc_1: "Wir sollten eine Liste potenzieller Bürger und Ehrenbürger zusammenstellen, die die Kontrolle über die umliegende Chora übernehmen können."
 me_greek_5_pontus.15.a: "Mach es so"
 me_greek_5_pontus.15.at: "Bis zu 4 Pops werden in der Provinz #Y [temp_hellenizing_province_scope.GetName]#! an unsere Religion und Kultur angepasst."
 me_greek_5_pontus.16.t: "$greek_5_7$: Fertigstellung"
 me_greek_5_pontus.16.desc: "Es sind Berichte eingetroffen, die ankündigen, dass die jüngste Umsiedlungspolitik ein großer Erfolg war! Unsere griechischen Werte herrschen jetzt in unseren kürzlich erworbenen Ländereien."
 me_greek_5_pontus.16.desc_1: "Und das werden sie noch viele Jahre tun."
 me_greek_5_pontus.16.a: "Exzellent"
 me_greek_5_pontus.16.at: "In der Provinz #Y [temp_hellenizing_province_scope.GetName]#! wurden einige Pops an unsere Religion und Kultur assimiliert."
 me_greek_5_pontus.17.t: "$greek_5_7$: Die Schicksale"
 me_greek_5_pontus.17.desc: "Unsere neu eroberten Länder haben unsere Kultur und Religion übernommen. Eine koordinierte Hellenisierung dieser Gebiete ist nicht erforderlich."
 me_greek_5_pontus.17.a: "Gut"
 me_greek_5_pontus.17.at: "Die Missionsaufgabe '#Y $greek_5_7$#!' wurde #R umgangen#!!"
  ## Hellenizing the Chora End 
  
 me_greek_5_pontus.18.t: "$greek_5_8$"
 me_greek_5_pontus.18.desc: "Jeden Tag ernten mehr Bürger die Früchte unserer Arbeit. Unsere Häfen und Marktplätze waren noch nie so belebt. Unsere Tempel und Verwaltungsgebäude sind gut gepflegt und fast überall, wo man hinschaut, kann man unseren wachsenden Wohlstand sehen. Vielleicht stehen wir an der Schwelle zu einem goldenen Zeitalter."
 me_greek_5_pontus.18.a: "Ein Moment der Konsolidierung ist notwendig, bevor weitere Pläne in Gang gesetzt werden."
 me_greek_5_pontus.18.at: "$mission_task_completed_tt_1$$greek_5_8$$mission_task_completed_tt_2$"
 me_greek_5_pontus.18.tt: "Alle #Y Bosporan & Graeco-Pontic#! Länder gewinnen #G 25#! Meinung von [gm_5_greek_scope.GetName]."
  
  ## Forming Istrian League Start 
 me_greek_5_pontus.19.t: "Die istrische Liga"
 me_greek_5_pontus.19.desc: "Wir sind weit gekommen, seit unsere Vorfahren diese Küsten besiedelt haben. Trotz der Schwierigkeiten, mit denen wir als Fremde in diesen Ländern konfrontiert waren, gelang es uns, zu gedeihen und uns zu übertreffen. Unsere griechischen Werte sind ein Leuchtfeuer für die anderen Nationen rund um den Pontus Euxinos. Nachdem wir unsere benachbarten Hellenen unter einem Banner vereint haben, ist es notwendig, unsere eigene Identität zu proklamieren. Die Istrische Liga wird tausend Jahre bestehen!"
 me_greek_5_pontus.19.a: "So möge es sein"
 me_greek_5_pontus.19.at: "Sie werden jetzt als Istrische Liga bekannt sein. Möge Ihre Zukunft so hell sein, um das Schwarze Meer zu kontrastieren."
  ## Forming Istrian League End 
  
 me_greek_5_pontus.20.t: "$greek_5_9$: Die Schicksale"
 me_greek_5_pontus.20.desc: "Unsere griechischen Brüder am Westufer des Pontos Euxinos müssen uns mit eifersüchtigem Neid ansehen."
 me_greek_5_pontus.20.a: "Auf den Pontos Euxinos kann es nur einen Städtebund geben."
 me_greek_5_pontus.20.at: "Die Missionsaufgabe '#Y $greek_5_9$#!' wurde #R umgangen#!!"
  
 me_greek_5_pontus.21.tt: "Alle #Y Bosporan & Graeco-Pontic#! Länder gewinnen #G 25#! Meinung von [gm_5_greek_scope.GetName]."
  
  ## Forming Bosporan League Start 
 me_greek_5_pontus.21.t: "Die Bosporanische Liga"
 me_greek_5_pontus.21.desc: "Wir sind weit gekommen, seit unsere Vorfahren diese Küsten besiedelt haben. Trotz der Schwierigkeiten, mit denen wir als Fremde in diesen Ländern konfrontiert waren, gelang es uns, zu gedeihen und uns zu übertreffen. Unsere griechischen Werte sind ein Leuchtfeuer für die anderen Nationen rund um den Pontus Euxinos. Nachdem wir unsere benachbarten Hellenen unter einem Banner vereint haben, ist es notwendig, unsere eigene Identität zu proklamieren. Die Bosporanische Liga wird tausend Jahre bestehen!"
 me_greek_5_pontus.21.a: "So möge es sein"
 me_greek_5_pontus.21.at: "Sie werden jetzt als Bosporan League bekannt sein. Möge Ihre Zukunft so hell sein, um das Schwarze Meer zu kontrastieren."
  ## Forming Bosporan League End 
  
 me_greek_5_pontus.22.t: "$greek_5_10$: Die Schicksale"
 me_greek_5_pontus.22.desc: "Unsere griechischen Brüder am Nordufer des Pontos Euxinos müssen uns mit eifersüchtigem Neid ansehen."
 me_greek_5_pontus.22.a: "Auf den Pontos Euxinos kann es nur einen Städtebund geben."
 me_greek_5_pontus.22.at: "Die Missionsaufgabe '#Y $greek_5_10$#!' wurde #R umgangen#!!"
  
 me_greek_5_pontus.23.tt: "Alle #Y Bosporan & Graeco-Pontic#! Länder gewinnen #G 25#! Meinung von [gm_5_greek_scope.GetName]."
  
  ## Forming Pontic League Start 
 me_greek_5_pontus.23.t: "Die pontische Liga"
 me_greek_5_pontus.23.desc: "Wir sind weit gekommen, seit unsere Vorfahren diese Küsten besiedelt haben. Trotz der Schwierigkeiten, mit denen wir als Fremde in diesen Ländern konfrontiert waren, gelang es uns, zu gedeihen und uns zu übertreffen. Unsere griechischen Werte sind ein Leuchtfeuer für die anderen Nationen rund um den Pontus Euxinos. Nachdem wir unsere benachbarten Hellenen unter einem Banner vereint haben, ist es notwendig, unsere eigene Identität zu proklamieren. Die Pontic League wird tausend Jahre bestehen!"
 me_greek_5_pontus.23.a: "So möge es sein"
 me_greek_5_pontus.23.at: "Sie werden jetzt als Pontic League bekannt sein. Möge Ihre Zukunft so hell sein, um das Schwarze Meer zu kontrastieren."
  ## Forming Pontic League End 
  
 me_greek_5_pontus.24.t: "$greek_5_11$: Die Schicksale"
 me_greek_5_pontus.24.desc: "Unsere griechischen Brüder am Südufer des Pontos Euxinos müssen uns mit eifersüchtigem Neid ansehen."
 me_greek_5_pontus.24.a: "Auf den Pontos Euxinos kann es nur einen Städtebund geben."
 me_greek_5_pontus.24.at: "Die Missionsaufgabe '#Y $greek_5_11$#!' wurde #R umgangen#!!"
  
 me_greek_5_pontus.25.t: "$greek_5_12$"
 me_greek_5_pontus.25.desc: "Wir haben jetzt die Gebiete zwischen Istros und der Annäherung an Hellespont vollständig unter Kontrolle. Garnisonen machen sich bereits auf den Weg zu den Grenzen und die örtlichen Versammlungen gehorchen unserer Verwaltung. Von unseren bescheidenen Poleis sind wir auf den Pontos Euxinos zu einer Einheit der Bewunderung und Angst geworden!"
 me_greek_5_pontus.25.a: "Die Istrische Liga steht stolz gegen Mazedonier, Getae, Skythen und Thraker gleichermaßen."
 me_greek_5_pontus.25.at: "$mission_task_completed_tt_1$$greek_5_12$$mission_task_completed_tt_2$"
 me_greek_5_pontus.26.t: "$greek_5_12$: Die Schicksale"
 me_greek_5_pontus.26.desc: "Unser Fokus wird woanders gebraucht. Die dunklen Wälder und Flussufer, die von den Getae verfolgt werden, sind nicht unsere Sorge."
 me_greek_5_pontus.26.a: "Wir müssen uns um unsere eigenen Grenzen kümmern."
 me_greek_5_pontus.26.at: "Die Missionsaufgabe '#Y $greek_5_12$#!' wurde #R umgangen#!!"
 me_greek_5_pontus.27.t: "$greek_5_13$"
 me_greek_5_pontus.27.desc: "Wir haben jetzt die volle Kontrolle über die Länder rund um die Flüsse Tyras, Borysthene und den kimmerischen Bosporus. Soldaten und Matrosen arbeiten zusammen, um die Kontrolle über unsere neuen Territorien und Handelskanäle zu verstärken. Von unseren bescheidenen Poleis sind wir auf den Pontos Euxinos zu einer Einheit der Inspiration und des Respekts geworden!"
 me_greek_5_pontus.27.a: "Die Bosporanische Liga ist im Norden Herr über Meer und Pferd."
 me_greek_5_pontus.27.at: "$mission_task_completed_tt_1$$greek_5_13$$mission_task_completed_tt_2$"
 me_greek_5_pontus.28.t: "$greek_5_13$: Die Schicksale"
 me_greek_5_pontus.28.desc: "Unser Fokus wird woanders gebraucht. Die von den Skythoi dominierten Ebenen und Flussufer der nördlichen Steppe sind nicht unser Anliegen."
 me_greek_5_pontus.28.a: "Wir müssen uns um unsere eigenen Grenzen kümmern."
 me_greek_5_pontus.28.at: "Die Missionsaufgabe '#Y $greek_5_13$#!' wurde #R umgangen#!!"
 me_greek_5_pontus.29.t: "$greek_5_14$"
 me_greek_5_pontus.29.desc: "Wir haben jetzt die volle Kontrolle über die Nordküste Anatoliens. Unsere Garnisonen in den Bergpässen und in unseren wertvollen Häfen werden dafür sorgen, dass wir vor Eindringlingen zu Land und zu Wasser geschützt sind. Aus unseren bescheidenen Poleis sind wir auf den Pontos Euxinos zu einer Einheit voller Pracht und Neid geworden!"
 me_greek_5_pontus.29.a: "Die Pontic League ist gut aufgestellt, um mit den Anatoliern und Kaukasiern fertig zu werden."
 me_greek_5_pontus.29.at: "$mission_task_completed_tt_1$$greek_5_14$$mission_task_completed_tt_2$"
 me_greek_5_pontus.30.t: "$greek_5_14$: Die Schicksale"
 me_greek_5_pontus.30.desc: "Unser Fokus wird woanders gebraucht. Die unzähligen Berge und felsigen Küsten, Heimat der Stämme Anatoliens, sind nicht unser Anliegen."
 me_greek_5_pontus.30.a: "Wir müssen uns um unsere eigenen Grenzen kümmern."
 me_greek_5_pontus.30.at: "Die Missionsaufgabe '#Y $greek_5_14$#!' wurde #R umgangen#!!"
  
 me_greek_5_pontus.31.t: "$greek_5_15$"
 me_greek_5_pontus.31.desc: "Ursprünglich stammten unsere Leute aus #Y [home_country_scope.GetName]#!. Jetzt, da wir die Kontrolle über unsere „Mutterstadt“ erlangt haben, ist es nur richtig, uns als die wahren Erben dieser Länder zu erklären. \nVielleicht könnten wir sogar unsere frühere Identität annehmen, wenn es das ist, was die Götter für uns vorgesehen haben."
 me_greek_5_pontus.31.a: "Trautes Heim, Glück allein..."
 me_greek_5_pontus.31.at: "Wir werden als #Y [home_country_scope.GetName]#! fortfahren. Die Hauptstadt wird in unser Stammhaus verlegt."
 me_greek_5_pontus.31.b: "Nein, unser Schicksal liegt hier, auf den Pontos Euxinos."
 me_greek_5_pontus.31.bt: "Wir werden unserer jetzigen Bestimmung treu bleiben."
  
 me_greek_5_pontus.32.t: "$greek_5_17$"
 me_greek_5_pontus.32.desc: "Unser weitläufiges maritimes Netzwerk erfordert eine ebenso weitläufige Marine, die in der Lage ist, unsere Händler vor Plünderern, Plünderern und Rivalen zu verteidigen. \n \nJetzt müssen wir entscheiden, ob wir unsere Staffeln auf Geschwindigkeit oder Überlebensfähigkeit spezialisieren."
 me_greek_5_pontus.32.a: "Wir werden sie zu einer Macht machen, mit der man rechnen muss."
 me_greek_5_pontus.32.b: "Erleichtern Sie ihre Lasten und rekrutieren Sie nur die besten Ruderer."
 me_greek_5_pontus.32.tt: "$mission_task_completed_tt_1$$greek_5_17$$mission_task_completed_tt_2$"
 me_greek_5_pontus.33.t: "$greek_5_19$: Vergangenheit und Gegenwart"
 me_greek_5_pontus.33.desc: "Vor kurzem hat die Geschichte unseres Volkes und vielleicht das größere Erbe von #Y [gm_5_greek_scope.GetName]#! war in aller Munde. Einige sind der Meinung, dass die Bewahrung unserer Geschichte und Traditionen Vorrang haben sollte, während andere sagen, dass wir unseren eigenen Weg gehen müssen, unabhängig davon, was unsere Vorfahren beabsichtigten."
 me_greek_5_pontus.33.a: "Unsere bewegte Vergangenheit wird niemals vergessen werden."
 me_greek_5_pontus.33.at: "Eine #Y-Bibliothek#! wird in unserer Hauptstadt gebaut"
 me_greek_5_pontus.33.b: "Wir müssen einen neuen Hafen bauen, um das Hier und Jetzt besser zu beeinflussen."
 me_greek_5_pontus.33.bt: "Ein #Y-Anschluss#! wird in unserer Hauptstadt gebaut"
 me_greek_5_pontus.34.t: "$greek_5_19$: Ich freue mich auf"
 me_greek_5_pontus.34.desc: "Die Poleis schwirren vor Aufregung über den jüngsten Bau. Eine Hektik der Aktivität scheint die neue Norm zu sein, da die Bürger und Ehrenbürger immer produktiver und entschlossener erscheinen."
 me_greek_5_pontus.34.a: "Wir müssen unser Schicksal aktiv gestalten."
 me_greek_5_pontus.34.at: "$mission_task_completed_tt_1$$greek_5_19$$mission_task_completed_tt_2$"
 me_greek_5_pontus.35.t: "$greek_5_20$: Geschichten aus der Ferne"
 me_greek_5_pontus.35.desc: "Ein merkwürdiges Ereignis hat sich gerade ereignet. [gm_5_greek_scope.GetRulerTitle] wurde kürzlich von einem skythischen Besucher angesprochen, der behauptete, ein Ehrenbürger aus der Region Taurica zu sein. Er sprach von mysteriösen Ruinen und erblickte eine vergessene Statue aus seltsam aussehendem Stein."
 me_greek_5_pontus.35.a: "Vielleicht bedarf dies weiterer Nachforschungen."
 me_greek_5_pontus.35.at: "Begib dich auf die Suche nach dem verschollenen Tempel der Artemis."
 me_greek_5_pontus.36.t: "$greek_5_20$: Neugierde geweckt"
 me_greek_5_pontus.36.desc: "Die Untersuchung wurde abgeschlossen, nachdem mit einigen Kaufleuten und Seeleuten über die Gerüchte über den vergessenen Tempel gesprochen wurde. Die Behauptungen des Besuchers erscheinen plausibel und nun bleibt die Frage: \n''Was soll mit diesen neu gewonnenen Informationen geschehen?''"
 me_greek_5_pontus.36.a: "Es ist nur richtig, dass wir es finden."
 me_greek_5_pontus.36.at: "$mission_task_completed_tt_1$$greek_5_20$$mission_task_completed_tt_2$"
 me_greek_5_pontus.37.t: "$greek_5_21$"
 me_greek_5_pontus.37.desc: "Wir haben erfolgreich einen Brückenkopf in den angestammten Ländern der Taurianer gesichert, jener Barbaren, die einst Menschenopfer an ehrlichen, gottesfürchtigen Griechen vollbrachten. Dieses Gebiet wird als Operationsbasis dienen, während wir unsere Suche nach dem Tempel der Artemis fortsetzen."
 me_greek_5_pontus.37.a: "Ein Talent für den ersten Mann, der es findet!"
 me_greek_5_pontus.37.at: "$mission_task_completed_tt_1$$greek_5_21$$mission_task_completed_tt_2$"
 me_greek_5_pontus.38.t: "$greek_5_22$: Suche abgeschlossen"
 me_greek_5_pontus.38.desc: "Erfolg! Nach vielen Wochen erfolgloser Suche und Bestechung von Einheimischen nach Hinweisen haben wir den Tempel der Artemis erfolgreich entdeckt! Es ist in einem traurigen, baufälligen Zustand, scheinbar von seinen Anbetern verlassen und vor Möchtegern-Räubern versteckt. Im Inneren konnten wir ein Bild von Artemis finden, das aus einem Stein gemacht wurde, wie wir es noch nie zuvor gesehen haben. Wir werden eine Gruppe von Männern zusammenrufen, um ihn und einige der anderen Schätze zu bergen."
 me_greek_5_pontus.38.a: "Die Götter lächeln auf uns herab."
 me_greek_5_pontus.38.at: "$mission_task_completed_tt_1$$greek_5_22$$mission_task_completed_tt_2$"
 me_greek_5_pontus.52.t: "$greek_5_22$: Starten Sie die Suche"
 me_greek_5_pontus.52.desc: "Wir müssen die Länder der Barbaren erkunden, um den verlorenen Tempel zu finden. Es wird sicherlich ein ziemliches Unterfangen, aber es besteht kein Zweifel, dass wir uns durchsetzen werden."
 me_greek_5_pontus.52.a: "Ein Viehopfer wird sicherlich den Göttern gefallen und uns Glück bringen."
 me_greek_5_pontus.52.at: "Die Suche beginnt ..."
 me_greek_5_pontus.39.t: "$greek_5_23$: Der verlorene Tempel"
 me_greek_5_pontus.39.desc: "Das schöne Bildnis der Jägergöttin ist endlich in unserem Besitz. Trotzdem können wir nicht sagen, aus welchem ​​​​speziellen Material es besteht. Wir können nur schlussfolgern, dass es sich um einen göttlichen Stein handeln muss, der von Olympos herabgeworfen wurde. \n \nJetzt, da wir diesen Tempel der Artemis gefunden haben, müssen wir besprechen, was wir damit machen. Unsere Entscheidung darf die Göttin selbst nicht verärgern."
 me_greek_5_pontus.39.a: "Wir müssen vorsichtig sein."
 me_greek_5_pontus.40.t: "$greek_5_23$: Ein gesegnetes Bild"
 me_greek_5_pontus.40.desc: "Nach wochenlangen Debatten hat der Senat in dieser Frage eine Pattsituation erreicht. #Y [gm_family_head_5.GetName]#! schlägt Sparsamkeit vor und ist nicht bereit, weitere Mittel für dieses Abenteuer auszugeben, während das #Y [high_priest_scope.GetOffice.GetName]#! besteht darauf, dass dieses Denkmal zu seinem früheren Glanz wiederhergestellt werden muss! \nMenschenmassen haben sich auf der Agora versammelt, um Neuigkeiten darüber zu erhalten, was mit dem verlorenen Tempel geschehen soll."
 me_greek_5_pontus.40.a: "Natürlich muss es rekonstruiert werden!"
 me_greek_5_pontus.40.at: "Der Wiederaufbau des Tempels wird mit Gold aus unseren Kassen bezahlt."
 me_greek_5_pontus.40.b: "Wir können es mit anderen Ressourcen wieder aufbauen."
 me_greek_5_pontus.40.bt: "Der Wiederaufbau des Tempels wird mit Geld, Arbeitskraft und politischem Einfluss bezahlt."
 me_greek_5_pontus.40.c: "Wir können es uns einfach nicht leisten."
 me_greek_5_pontus.40.ct: "Der Tempel wird nicht wieder aufgebaut."
 me_greek_5_pontus.41.t: "$greek_5_24$"
 me_greek_5_pontus.41.desc: "Die einst stolze Hauptstadt unseres Handelsrivalen, des bosporanischen Königreichs, liegt in Trümmern. Die angestammte Heimat dieser verstoßenen Thraker, der Spartokiden, wurde gestürzt, und doch wäre es vorteilhaft, eine befestigte Stadt am kimmerischen Bosporus zu kontrollieren ... Vielleicht kann eine neue Stadt in der Nähe gebaut und von unseren loyalen Griechen bewohnt werden Ursache."
 me_greek_5_pontus.41.a: "Wehe den Besiegten ... beginne sofort mit dem Bau."
 me_greek_5_pontus.41.at: "$mission_task_completed_tt_1$$greek_5_24$$mission_task_completed_tt_2$"
  ## Scythian Traders Start 
 me_greek_5_pontus.42.t: "$greek_5_25$: Hohe Designs"
 me_greek_5_pontus.42.desc: "[gm_family_head_5.GetPraenomen] of the [gm_family_head_5.GetFamilyDisplayAdjective]s beruft ein Treffen einiger unserer erfolgreichsten und ehrgeizigsten Kaufleute und Schiffskapitäne ein, um einen Plan für ein günstigeres Handelsabkommen mit den Skythoi auszuarbeiten. Sie sind die besten Anbieter von Sklaven auf den Pontos Euxinos, und wenn wir ihren Appetit anregen, könnten wir ein besseres Geschäft machen als unsere Rivalen."
 me_greek_5_pontus.42.a: "Weisen Worten müssen mutige Taten folgen."
 me_greek_5_pontus.42.at: "$me_gre_task_start_tt_5$ beginnt um Skythens Gunst zu werben."
 me_greek_5_pontus.43.t: "$greek_5_25$: Ein bescheidener Vorschlag"
 me_greek_5_pontus.43.desc: "Unsere besten Händler, angeführt von [gm_family_head_5.GetPraenomen], haben eine Liste mit möglichen Zugeständnissen und Bedingungen erstellt, die wir dem skythischen Herrscher anbieten können. Sie geben auch an, was wir anbieten müssten, um den aktuellen Besitzern Appetit zu machen, wenn dies überhaupt möglich ist."
 me_greek_5_pontus.43.a: "Wir sollten sofort eine große Summe Gold anbieten. Sie mögen von unserer Großzügigkeit bewegt sein."
 me_greek_5_pontus.43.at: "Wir werden anbieten, eine große Anzahl von Sklavenpops von [GetProvince('(int32)4557').GetOwner.GetName] zu kaufen. \nDie Chance auf Akzeptanz wird durch das Charisma von #Y [gm_family_head_5.GetPraenomen]#!, den relativen Wert der Pops und die diplomatische Meinung beeinflusst."
 me_greek_5_pontus.43.b: "Ein Angebot knapp über dem Marktpreis könnte sie bei uns beliebt machen."
 me_greek_5_pontus.43.bt: "Wir werden anbieten, eine Reihe von Sklavenpops von [GetProvince('(int32)4557').GetOwner.GetName] zu kaufen. \nDie Chance auf Akzeptanz wird durch das Charisma von #Y [gm_family_head_5.GetPraenomen]#!, den relativen Wert der Pops und die diplomatische Meinung beeinflusst."
 me_greek_5_pontus.43.c: "Sicherlich können wir nicht bis zum Ende eilen. Beginnen wir mit den Standardkosten."
 me_greek_5_pontus.43.ct: "Wir werden anbieten, eine kleine Anzahl von Sklavenpops von [GetProvince('(int32)4557').GetOwner.GetName] zu kaufen. \nDie Chance auf Akzeptanz wird durch das Charisma von #Y [gm_family_head_5.GetPraenomen]#!, den relativen Wert der Pops und die diplomatische Meinung beeinflusst."
 me_greek_5_pontus.43.d: "Es scheint, dass keiner unserer Standardanbieter heute etwas zu verkaufen hat ..."
 me_greek_5_pontus.43.dt: "Drat."
 me_greek_5_pontus.43.e: "Wir sollten sofort eine große Summe Gold anbieten. Sie mögen von unserer Großzügigkeit bewegt sein."
 me_greek_5_pontus.43.et: "Wir werden anbieten, eine große Anzahl von Sklavenpops von [GetProvince('(int32)6114').GetOwner.GetName] zu kaufen. \nDie Chance auf Akzeptanz wird durch das Charisma von #Y [gm_family_head_5.GetPraenomen]#!, den relativen Wert der Pops und die diplomatische Meinung beeinflusst."
 me_greek_5_pontus.43.f: "Ein Angebot knapp über dem Marktpreis könnte sie bei uns beliebt machen."
 me_greek_5_pontus.43.ft: "Wir werden anbieten, eine Reihe von Sklavenpops von [GetProvince('(int32)6114').GetOwner.GetName] zu kaufen. \nDie Chance auf Akzeptanz wird durch das Charisma von #Y [gm_family_head_5.GetPraenomen]#!, den relativen Wert der Pops und die diplomatische Meinung beeinflusst."
 me_greek_5_pontus.43.g: "Sicherlich können wir nicht bis zum Ende eilen. Beginnen wir mit den Standardkosten."
 me_greek_5_pontus.43.gt: "Wir werden anbieten, eine kleine Anzahl von Sklavenpops von [GetProvince('(int32)6114').GetOwner.GetName] zu kaufen. \nDie Chance auf Akzeptanz wird durch das Charisma von #Y [gm_family_head_5.GetPraenomen]#!, den relativen Wert der Pops und die diplomatische Meinung beeinflusst."
 me_greek_5_pontus.44.t: "$greek_5_25$: Ein interessanter Vorschlag"
 me_greek_5_pontus.44.desc: "Die Nation [gm_5_greek_scope.GetName] hat angeboten, einige Sklaven von uns zu kaufen."
 me_greek_5_pontus.44.desc_1: "Sie haben einen beträchtlichen Betrag für diesen Transfer angeboten. Es wäre in unserem Interesse, eine so lukrative Beziehung aufrechtzuerhalten."
 me_greek_5_pontus.44.desc_2: "Sie haben einen normalen Betrag für diese Überweisung angeboten. Wir werden mit ihrem Verhandlungsführer besprechen, wie viele Sklaven für diesen Preis bereitgestellt werden können."
 me_greek_5_pontus.44.desc_3: "Sie haben einen kleinen Betrag für diesen Transfer angeboten. Wir werden eine Erklärung für diese Beleidigung von ihrem Verhandlungsführer brauchen."
 me_greek_5_pontus.44.a: "Senden Sie ihnen so viele, wie gerade verfügbar sind."
 me_greek_5_pontus.44.at: "Insgesamt #Y 5#! Sklaven werden ausgeliefert. \nIhre Meinung über uns kann steigen."
 me_greek_5_pontus.44.b: "Eine beträchtliche Gruppe von Sklaven muss ausreichen."
 me_greek_5_pontus.44.bt: "Insgesamt #Y 3#! Sklaven werden ausgeliefert."
 me_greek_5_pontus.44.c: "Sie können sich glücklich schätzen, sogar ein paar zu erhalten."
 me_greek_5_pontus.44.ct: "Insgesamt #Y 1#! Sklaven werden ausgeliefert. \nIhre Meinung von uns kann abnehmen."
 me_greek_5_pontus.45.t: "$greek_5_25$: Der Raum, in dem es passiert"
 me_greek_5_pontus.45.desc: "Wir haben von den Skythoi Nachricht bezüglich unseres Handelsangebots erhalten! Wie waren die Vorzeichen heute morgen?"
 me_greek_5_pontus.45.desc_1: "Bei den Göttern, wir haben es geschafft! Sie sind bereit, uns aufgrund der großzügigen Bedingungen und der brillanten Bemühungen unserer Verhandlungsführer exklusive Rechte zu gewähren!"
 me_greek_5_pontus.45.desc_2: "Sie sind bereit, einem Handelsabkommen mit günstigen Bedingungen zuzustimmen. Der Erfolg ist sicherlich ein Beweis für die Fähigkeiten unserer Verhandlungsführer."
 me_greek_5_pontus.45.desc_3: "Sie sind nicht bereit, einem Handelsabkommen zuzustimmen, das ihrer Beziehung zu den anderen griechischen Städten schaden könnte. Dies ist sicherlich nicht das Ergebnis, das wir uns erhofft hatten."
 me_greek_5_pontus.45.a: "Oh Fortuna hat uns gesegnet!"
 me_greek_5_pontus.45.b: "Vielleicht war eine größere Summe erforderlich."
 me_greek_5_pontus.45.c: "Was für eine Katastrophe!"
  ## Scythian Traders End 
  
  ## Building The Taurican Temple 
 me_greek_5_pontus.47.t: "Sinkende Materialien"
 me_greek_5_pontus.47.desc: "Wir haben die Nachricht erhalten, dass eine der Lieferungen mit Materialien für den Tempel von Piraten außerhalb der Küste von [SCOPE.sP('random_coastal_province_scope').GetName] versenkt wurde. Ohne diese Baumaterialien müssen wir eine neue Lieferung anfordern, sonst wird die Qualität der Rekonstruktion sicherlich leiden."
 me_greek_5_pontus.47.a: "Eine neue Sendung wird bezahlt."
 me_greek_5_pontus.47.a.tt: "Der Fortschritt am Tempel der Artemis geht ungehindert weiter."
 me_greek_5_pontus.47.b: "Wir müssen mit dem auskommen, was wir haben."
 me_greek_5_pontus.47.b.tt: "Der Fortschritt beim Tempel der Artemis wird durch Materialmangel behindert."
 me_greek_5_pontus.48.t: "Uninspirierte Arbeiter"
 me_greek_5_pontus.48.desc: "Ein Großteil der Arbeiten zur Restaurierung des Tempels wurde mit dem guten Willen der Menschen durchgeführt, aber es scheint, dass viele Arbeiter in letzter Zeit demotiviert wurden, da die Fortschritte nicht annähernd so schnell waren, wie sie ursprünglich gehofft hatten. \n \nWir könnten dafür bezahlen, dass neue Arbeiter nach #Y [SCOPE.sP('taurican_temple_territory_scope').GetName]# geschickt werden! den Rest der Arbeit zu übernehmen, einen anderen Weg zu finden, diejenigen zu motivieren, die wir bereits haben, oder einige unserer Pläne zu ändern, um die verbleibende Arbeitsbelastung zu reduzieren."
 me_greek_5_pontus.48.a: "Neue Hände sind erforderlich, um die Arbeit abzuschließen."
 me_greek_5_pontus.48.a.tt: "Der Fortschritt am Tempel der Artemis geht ungehindert weiter."
 me_greek_5_pontus.48.b: "Da ist eine Motivationsrede genau das Richtige."
 me_greek_5_pontus.48.b.tt: "Der Fortschritt am Tempel der Artemis geht ungehindert weiter."
 me_greek_5_pontus.48.c: "Wir werden unsere Entwürfe zurückschrauben müssen, um dies zu kompensieren."
 me_greek_5_pontus.48.c.tt: "Der Fortschritt beim Tempel der Artemis wird von uninspirierten Arbeitern behindert."
 me_greek_5_pontus.49.t: "Sabotage des Tempels"
 me_greek_5_pontus.49.desc: "Es gibt Berichte darüber, dass die Wiederaufbaubemühungen durch Diebstahl und Sabotage heimgesucht wurden, vielleicht von eifersüchtigen Rivalen, die unsere Ambitionen lieber nicht verwirklicht sehen wollten. Obwohl die Vorfälle bisher relativ gering waren, befürchten wir, dass dies nur ein Vorgeschmack auf das sein könnte, was noch kommen wird. \n \n[SCOPE.sCharacter('random_advisor').GetName] empfiehlt die Entsendung zusätzlicher Soldaten zur besseren Bewachung der Baustelle. Alternativ könnten wir zusätzliche Mittel bereitstellen, um die zerstörten Materialien zu ersetzen, oder die Angelegenheit insgesamt ignorieren."
 me_greek_5_pontus.49.a: "Wir ersetzen nur, was beschädigt wird."
 me_greek_5_pontus.49.a.tt: "Der Fortschritt am Tempel der Artemis geht ungehindert weiter."
 me_greek_5_pontus.49.b: "Unsere Soldaten werden das in Ordnung bringen."
 me_greek_5_pontus.49.b.tt: "Der Fortschritt am Tempel der Artemis geht ungehindert weiter."
 me_greek_5_pontus.49.c: "Es ist ein relativ kleines Problem, es wird wahrscheinlich in Ordnung sein."
 me_greek_5_pontus.49.c.tt: "Der Fortschritt am Tempel der Artemis wird durch Diebstahl und Sabotage behindert."
 me_greek_5_pontus.50.t: "Die Restaurierung des Tempels der Artemis"
 me_greek_5_pontus.50.desc: "Die Restaurierung des Tempels wurde kürzlich mit einigen Zugeständnissen abgeschlossen, um die Probleme zu lösen, die während des Baus aufgetreten sind. Die Göttin Artemis wird uns hoffentlich immer noch Gunst gewähren, nachdem sie ihr Bild zu einer Pracht wiederhergestellt hat, die keiner unserer Partnerstädte gleicht. Reisende aus aller Welt haben begonnen, sich zu versammeln, um der Göttin der Jagd zu huldigen."
 me_greek_5_pontus.50.a: "Es hätte besser sein können..."
 me_greek_5_pontus.51.t: "Die Restaurierung des Großen Tempels der Artemis"
 me_greek_5_pontus.51.desc: "Die Tempelrestaurierung wurde kürzlich abgeschlossen und unsere Bemühungen waren ein voller Erfolg! \nDie Göttin Artemis wird uns jetzt sicherlich Gunst gewähren, nachdem sie ihren Tempel zu einer Pracht restauriert hat, die keiner unserer Partnerstädte gleicht. Reisende aus aller Welt haben begonnen, sich zu versammeln, um der Göttin der Jagd zu huldigen."
 me_greek_5_pontus.51.a: "Hurra! Die Göttin der Jägerin gewährt ihren Segen."
 me_greek_5_pontus.53.t: "Throwing Off [my_overlord.GetName]"  <None>  #NT!
 me_greek_5_pontus.53.desc: "For too long, the proud poleis of the Euonymos Pontos, Istros, Kallatis, Odessos, Mesembria, and Apollonia, have endured the burdensome oversight of Thracian kings and satraps. Though alliances have been made and treaties sworn, our cities were not founded to bow before petty dynasts. The time has come to cast off these foreign fetters and revive our autonomy. United in purpose, the Greek cities of the Euonymos Pontos shall rise together once more."  <None>  #NT!
 me_greek_5_pontus.53.a: "Now we strike!"  <None>  #NT!
 me_greek_5_pontus.53.at: "The [my_overlord.Adjective] subjects on the Euonymos Pontos will join together in an #E Independence War#!#!."  <None>  #NT!
 me_greek_5_pontus.54.t: "Reorganizing Orgame"  <None>  #NT!
 me_greek_5_pontus.54.desc: "Orgame, located at Cap Dolojman near modern Jurilovca, was one of the earliest Milesian foundations along the Western Pontic coast. Archaeological evidence places its founding in the mid-7th century BCE, possibly as a secondary 'apoikia' established from nearby Istros. The site itself shows traces of earlier habitation dating back to the Bronze Age, though its urban development remained modest compared to neighboring poleis. Orgame's history is obscure, but it may have remained a dependent kome within the chora of Istros. It is said that Jason and the Argonauts rested here for a time before continuing on their way back to the Greek world with the Golden Fleece in tow."  <None>  #NT!
 me_greek_5_pontus.54.a: "Henceforth, Orgame will be autonomous."  <None>  #NT!
 me_greek_5_pontus.54.at: "#E Orgame#! becomes a #Y Feudatory#! of #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#!"  <None>  #NT!
 me_greek_5_pontus.54.b: "We shall send a new wave of colonists to Orgame."  <None>  #NT!
 me_greek_5_pontus.54.bt: "#E Orgame#! becomes a #Y Colony#! of #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#!"  <None>  #NT!
 me_greek_5_pontus.54.c: "The status quo will do."  <None>  #NT!
 me_greek_5_pontus.54.ct: "#R Nothing happens#!"  <None>  #NT!
 me_greek_5_pontus.55.t: "'Independent' Tomis"  <None>  #NT!
 me_greek_5_pontus.55.desc: "Tomis, located on the peninsula of modern Constanta, was founded in the 6th century BCE, either directly by Miletos or through nearby Istros. Though the city features in local legend as a resting place of Jason and the Argonauts, and some later traditions connect it to Queen Tomyris of the Massagetae, historical and archaeological evidence suggest it began as an 'emporion,' a coastal trading post rather than a full polis. Strabo called it a 'polichnion,' while Memnon likewise used 'emporion' to describe it in the late 3rd century BCE. Tomis became a point of contention in the 260s BCE, caught in a territorial dispute between Kallatis and Byzantion. Its elevation to 'apoikia' status may have followed this conflict. By the 2nd century BCE, Tomis issued decrees and developed civic institutions, including an eponymous priest of Apollo,its chief deity.. Inscriptions from the Roman period attest to all six Milesian 'phylai': Argadeis, Boreis, Geleontes, Oinopeis, Hopletes, and Aigikoreis. By the Roman Imperial period, Tomis referred to itself as a 'patris' and was the meeting place of the 'Koinon tou Eunnymou Pontou' (League of the Western Pontus)."  <None>  #NT!
 me_greek_5_pontus.55.a: "Henceforth, Tomis will be autonomous."  <None>  #NT!
 me_greek_5_pontus.55.at: "#E Tomis#! becomes a #Y Feudatory#! of #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#!"  <None>  #NT!
 me_greek_5_pontus.55.b: "We shall send a new wave of colonists to Tomis."  <None>  #NT!
 me_greek_5_pontus.55.bt: "#E Tomis#! becomes a #Y Colony#! of #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#!"  <None>  #NT!
 me_greek_5_pontus.55.c: "The status quo will do."  <None>  #NT!
 me_greek_5_pontus.55.ct: "#R Nothing happens#!"  <None>  #NT!
 me_greek_5_pontus.56.t: "The City of Dionysos"  <None>  #NT!
 me_greek_5_pontus.56.desc: "Originally a Thracian settlement on a naturally defensible coastal site, Krounoi was refounded in the 5th century BCE by Ionian settlers, likely from nearby Odessos, who named it for its abundant freshwater springs ('krounoi'). Some sources also record the name Matiopolis in reference to the site. According to local tradition, the settlement later became known as Dionysopolis, after a statue of Dionysos was miraculously discovered emerging from the sea, prompting the establishment of his cult. A more daring interpretation connects the city's final name and foundation to a later Hellenistic initiative by Dionysiac settlers during or after the campaigns of Alexander the Great. Velkov posits that although the location was not ideal for the foundation of a fully independent colony, the citizens of Odessos established an emporion to take advantage of the harbor's commercial potential. Dionysopolis appears to have fully emerged as a 'polis' with developed political institutions only in the mid-3rd century BCE. In the Roman period, Dionysopolis participated in the regional 'Koinon tou Euonymou Pontou' (League of the Western Pontus)."  <None>  #NT!
 me_greek_5_pontus.56.a: "Henceforth, Dionysopolis will be autonomous."  <None>  #NT!
 me_greek_5_pontus.56.at: "#E Dionysopolis#! becomes a #Y Feudatory#! of #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#!"  <None>  #NT!
 me_greek_5_pontus.56.b: "We shall send a new wave of colonists to Dionysopolis."  <None>  #NT!
 me_greek_5_pontus.56.bt: "#E Dionysopolis#! becomes a #Y Colony#! of #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#!"  <None>  #NT!
 me_greek_5_pontus.56.c: "The status quo will do."  <None>  #NT!
 me_greek_5_pontus.56.ct: "#R Nothing happens#!"  <None>  #NT!
 me_greek_5_pontus.57.t: "Restore Nikonion"  <None>  #NT!
 me_greek_5_pontus.57.desc: "Once a modest yet prosperous emporion on the lower Istros, Nikonion was likely founded in the late 6th century BCE by Istros, itself a proud Milesian colony. Nikonion came under the protectorate of the Skythian king Skyles and even minted bronze coinage bearing Scythian symbols. Nikonion was laid waste by Zopyrion, Alexander's ill-fated strategos of Thrace, around 331 BCE."  <None>  #NT!
 me_greek_5_pontus.57.a: "Henceforth, Nikonion will be autonomous."  <None>  #NT!
 me_greek_5_pontus.57.at: "#E Nikonion#! becomes a #Y Feudatory#! of #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#!"  <None>  #NT!
 me_greek_5_pontus.57.b: "We shall send a new wave of colonists to Nikonion."  <None>  #NT!
 me_greek_5_pontus.57.bt: "#E Nikonion#! becomes a #Y Colony#! of #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetName]#!"  <None>  #NT!
 me_greek_5_pontus.57.c: "Nikonion will be restored."  <None>  #NT!
 me_greek_5_pontus.57.ct: "#R Nothing happens#!"  <None>  #NT!
  
 ### MODIFIERS 
