 me_gre_5_24_cmod: "Aus der Asche"
 desc_me_gre_5_24_cmod: "Nachdem die ehemalige Hauptstadt der Spartokiden dem Erdboden gleichgemacht wurde, wird eine neue Stadt aus ihrer Asche auferstehen. Es soll seinen Vorgänger höher übertreffen, als es ihre begrenzten Bestrebungen jemals zuließen."
