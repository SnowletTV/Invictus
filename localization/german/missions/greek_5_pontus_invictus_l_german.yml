 me_gre_5_3_pmod: "Handelszentrum"
 desc_me_gre_5_3_pmod: "Wir haben die Entwicklung dieses neuen Hafens als Handels- und Kapitalzentrum von Euxine gefördert."
 me_gre_5_5_cmod: "War Hawks besänftigt"
 desc_me_gre_5_5_cmod: "Heutzutage scheint jeder, vom Sklaven bis zum Adligen, über die jüngste Welle der Kriegspropaganda verärgert zu sein."
 me_gre_5_8_cmod: "Griechischer Wohlstand"
 desc_me_gre_5_8_cmod: "Wir sind in eine neue Periode relativen Friedens und Wohlstands eingetreten."
 me_gre_5_12_cmod: "Ostthrakien sicher"
 desc_me_gre_5_12_cmod: "Die vollständige Kontrolle über die Nordküste Anatoliens führt zu positiven wirtschaftlichen und kulturellen Ergebnissen, da viele ehemalige Einheimische unsere Bräuche übernommen haben."
 me_gre_5_13_cmod: "Dominanz des Flusshandels"
 desc_me_gre_5_13_cmod: "Die vollständige Kontrolle über die Mündungen der Flüsse Tyras und Borysthenes führt zu positiven wirtschaftlichen und kulturellen Ergebnissen, da viele ehemalige Einheimische unsere Bräuche übernommen haben."
 me_gre_5_14_cmod: "Nordanatolische Dominanz"
 desc_me_gre_5_14_cmod: "Total control over the northern coast of Anatolia is yielding positive economic and cultural results, as many former locals have been seen adopting our customs."  <None>  #NT!
 me_gre_5_15_1_pmod: "Milesische Sicherheit"
 desc_me_gre_5_15_1_pmod: "Die Rückeroberung von Miletos durch seine längst verstorbenen Einwohner hat eine Welle der Besiedlung und des Wachstums in der Region ausgelöst."
 me_gre_5_15_2_pmod: "Herakleische Sicherheit"
 desc_me_gre_5_15_2_pmod: "Die Rückeroberung von Heraklea Pontike durch seine längst verstorbenen Bewohner hat eine Welle der Besiedlung und des Wachstums in der Region ausgelöst."
 me_gre_5_16_cmod: "Maritimer Boom"
 desc_me_gre_5_16_cmod: "Die Expansion unserer Marine hat unsere Schiffbauindustrie belebt und die Seeleute mit Stolz und Entschlossenheit erfüllt."
 me_gre_5_18_pmod: "Euxine-Handel"
 desc_me_gre_5_18_pmod: "Mit unserem neuen Einfluss wurden unsere Händler mit Gelegenheiten überschwemmt, die sie nur dazu bereit machten, unsere Flotte zu subventionieren."
 me_gre_5_19_1_pmod: "Ahnen-Hommage"
