 me_gre_5_19_2_pmod: "Griechisches Handelszentrum"
 desc_me_gre_5_19_2_pmod: "Wir haben die Entwicklung dieses neuen Hafens als Handels- und Produktionszentrum gefördert."
 me_gre_5_23_cmod: "Fromme Bestrebungen"
