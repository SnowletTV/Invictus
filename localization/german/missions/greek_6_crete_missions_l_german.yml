l_german:
  
  #################### 
  # Title Done 13.09.2026
  #################### 
  
 greek_6_crete: "Die Vereinigung Kretas"
 greek_6_crete_DESCRIPTION: "Krieg! Seine unverkennbare schwarze Hand hat alles um uns herum befleckt; wohin man heutzutage auch geht, sei es auf die Agora, in den Tempel oder in die Taverne, überall wird nur noch von Krieg und Verwüstung gesprochen. Die Makedonen, angeführt von Alexander und seinen Nachfolgern, haben den Krieg nun in die weite Welt getragen, doch den Stadtstaaten auf der Insel Kreta ist es bislang gelungen, sich nicht in diesen Wahnsinn hineinziehen zu lassen. Und trotzdem hat eine neue Generation ehrgeiziger Männer die Gefahren ignoriert, vor denen ihre Väter sie verzweifelt gewarnt hatten, und versucht nun, die Insel mit Gewalt zu beherrschen und den prekären Status quo zu erschüttern. \n\nDie Dichter, versunken in ihren Träumereien, seufzen schwer während sie ihre Verse vortragen und aus ihren Bechern trinken, und verkünden, dass alles Gute einmal ein Ende haben muss...\n\nDenn nun hat der Krieg Kreta erreicht."
 greek_6_crete_CRITERIA_DESCRIPTION: "Diese Mission gilt als abgeschlossen, wenn Kreta zu einem einzigen Staat vereint wurde."
 greek_6_crete_BUTTON_TOOLTIP: ""
 greek_6_crete_BUTTON_DETAILS: ""
  
  #################### 
  # Mission Tasks 
  #################### 
  
  
 crete_mission_inv_1_task: "Disziplin in den Lagern"
 crete_mission_inv_1_task_DESC: "Wenn wir daran denken, ganz Kreta zu erobern, brauchen wir eine disziplinierte, professionelle Armee – eine ,  ganz anders als die, über die wir derzeit verfügen. Das mag bei der einfachen Truppe vielleicht nicht gut ankommen, aber unterricht die Soldaten davon, dass die Zeit zum Trainieren gekommen ist! \n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 crete_mission_inv_2_task: "Eisernes Schwert und Lederpanzer"
 crete_mission_inv_2_task_DESC: "Wir müssen unsere Soldaten angemessen mit der besten militärischen Ausrüstung ausstatten, die wir bekommen können, denn wir können es uns kaum leisten, Männer gegen einen Feind ins Feld zu schicken, der über eine bessere Ausrüstung verfügt. Die Schatzkammern der kretischen Stadtstaaten sind gut gefüllt, doch unsere müssen noch besser gefüllt sein. \n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 crete_mission_inv_3_task: "Ein chatotischer Zustand"
 crete_mission_inv_3_task_DESC: "Viel zu lange schon befindet sich Kreta in einem Zustand der fast vollständigen Erstarrung, in dem jeder nur seine eigenen Interessen verfolgt. So wie ein Schiff nur einen Kapitän haben darf, so darf auch unsere Insel nur einen Herrscher haben! Bereitet unsere Ansprüche vor und versammelt unsere Truppen, denn der Krieg steht bevor! \n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 crete_mission_inv_4_task: "Belagerungsmaschinen und Pioniere"
 crete_mission_inv_4_task_DESC: "Die chaotische politische Lage auf unserer Insel, auf der es keine klare Hegemonialmacht gibt, die ihre Autorität über die zahlreichen Stadtstaaten ausübt, hat dazu geführt, dass fast jede Provinz befestigt ist. Unsere Soldaten, insbesondere diejenigen, die unsere Belagerungsmaschinen bedienen, sind vor eine große Herausforderung gestellt.\n\nEs versteht sich von selbst, dass die Unterhaltung einer solchen militärischen Eliteeinheit mit entsprechenden Kosten verbunden ist...\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 crete_mission_inv_5_task: "Eine Goldmünze für den ersten Mann"
 crete_mission_inv_5_task_DESC: "Für jede neu eingenommene Stadt haben wir bekannt gegeben, dass der erste Soldat, der die Mauern der feindlichen Stadt erklimmt, eine Goldmünze aus der Staatskasse erhält. Nun streben alle nach dieser Ehre und kämpfen, als wären sie von höllischen Geistern besessen! \n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 crete_mission_inv_6_task: "Jeden letzten Tropfen herauspressen"
 crete_mission_inv_6_task_DESC: "Unsere Eroberungskriege haben verheerende Auswirkungen auf unsere Gemeinden gehabt – dies ist bekannt –, doch unsere derzeitige Lage hat uns gezwungen, noch tiefer aus dieser Quelle zu schöpfen und jeden verfügbaren Tropfen an Rekrutenreserven aus unseren Dörfern und Städten herauszupressen. Wir werden dieses unschätzbare Geschenk, das uns unsere Mütter und Schwestern gemacht haben, niemals vergessen und versprechen, für den Traum von Kreta zu kämpfen! \n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 crete_mission_inv_7_task: "Rationierung einführen"
 crete_mission_inv_7_task_DESC: "Wir müssen nicht nur Getreide importieren, um unsere Soldaten zu versorgen, sondern auch leider ein Rationierungssystem in unseren Provinzen einführen – in diesen Zeiten muss jeder Getreidekorn, jede Prise Mehl genau abgerechnet werden. \n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 crete_mission_inv_8_task: "Das Uneroberbare erobern"
 crete_mission_inv_8_task_DESC: "Manche haben behauptet, Kreta sei ein Land voller uneinnehmbarer Städte gewesen, die alle von Dieben, Lügnern und Piraten bevölkert waren. Wie unsere jüngsten Erfolge gezeigt haben, ist der erste Teil dieser Behauptung eindeutig falsch. \n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 thicc_crete_tt: "Ihr müsst mindestens acht Provinzen auf der Insel Kreta direkt besitzen."
 crete_mission_inv_9_task: "Die Stierspringer"
 crete_mission_inv_9_task_DESC: "Unsere Kundschafter haben die Erkundung der Provinz [GetProvince('(int32)358').GetName] abgeschlossen und sind der Meinung, dass wir uns die antiken Ruinen unbedingt selbst ansehen sollten. \n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 crete_mission_inv_10_task: "Wie es war, so soll es wieder sein"
 crete_mission_inv_10_task_DESC: "In früheren Zeiten herrschte eine einzige Macht über Kreta, und wir sind bereit, der Welt zu verkünden, dass diese Zeiten zurückgekehrt sind. Die Zeit der Unruhen, die unseren Aufstieg ermöglicht hat – eine Zeit voller Gefahren und Elend für die Bewohner unserer Insel –, ist endlich zu Ende gegangen.\n\nDa unsere ruhmreichen Vorfahren, die Minoer, einst von [GetProvince('(int32)358').GetName] aus über Kreta herrschten, ist es nur recht und billig, dass wir dies nun ebenfalls tun. \n\n\n\n\n\n\n\n\n\n@greek_mil10!"
  
  
  #################### 
  # Events 
  #################### 
  
 me_crete_1_title: "Disziplin in den Lagern"
 me_crete_1_desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ist derzeit wohl der unbeliebteste Mann in den Armeelagern – eine Auszeichnung, die der heißblütige Anführer mit stoischer Gleichgültigkeit hinnimmt. Der Grund, warum [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] so viel Unmut hervorruft, ist einfach: Unsere Soldaten trainieren drei- bis viermal so hart wie zuvor, und obwohl die Rationen leicht erhöht wurden, um das zermürbende Tempo auszugleichen, gibt es zahlreiche Soldaten, die unzufrieden sind.\n\nAls einige [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]er engsten militärischen Berater auf ihn zukamen, wies [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] alle Vorstöße zurück, die Trainingsbelastung zu verringern – immer wieder kam derselbe Satz über [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]e Lippen."
 me_greek_6_crete_1.a: "Wir müssen als Einheit kämpfen, wenn wir überhaupt die Chance haben wollen zu überleben, geschweige denn zu gewinnen!"
 me_crete_1_tooltip: "$mission_completed_tooltip_1$ '#Y Disziplin in den Lagern#!'' $mission_completed_tooltip_2$"
  
 me_crete_2_title: "Eisernes Schwert und Lederpanzer"
 me_crete_2_desc: "Obwohl uns diese Entscheidung praktisch in den Ruin getrieben hat, haben wir uns letztendlich entschlossen, den Ermahnungen von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] Folge zu leisten, der uns nachdrücklich davon abgeraten hatte, unsere Männer ins Feld zu schicken, solange sie nicht über die beste verfügbare Ausrüstung verfügten. Zwar sind sich alle einig, dass unsere Krieger prächtig aussehen, doch haben sich einige unserer führenden Bürger über die exorbitanten Kosten beschwert.\n\n'Wie können wir hoffen, uns gegen irgendjemanden zu behaupten, wenn wir darauf angewiesen sind, dass unsere Männer ihre eigenen Waffen mitbringen?', hatte [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] überzeugend argumentiert. 'Die Schleuder deines Großvaters wird nichts nützen, wenn unsere Feinde eiserne Schwerter tragen. Wenn wir unseren Traum von der Vereinigung Kretas verwirklichen wollen, müssen wir das tun, was noch niemand vor uns getan hat – koste es, was es wolle!'"
 me_greek_6_crete_2.a: "Es liegt Wahrheit in den Worten von [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]..."
 me_crete_2_tooltip: "$mission_completed_tooltip_1$ '#Y Eisernes Schwert und Lederpanzer#!'' $mission_completed_tooltip_2$"
  
 me_crete_3_title: "Ein chaotischer Zustand"
 me_crete_3_desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] hat die führenden Familien unserer Stadt einberufen und dabei tief auf das Netzwerk [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]er Unterstüzzer zurückgegriffen, um sicherzustellen, dass ein aufgeschlossenes Publikum für [SCOPE.GetRootScope.GetCountry. GetRuler.GetHerHis]e Rede  anwesend ist – jede Gunst und jede Schuld, die [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] geschuldet wird, wurde in Erinnerung gerufen.\n\nAls die festgesetzte Stunde gekommen ist, hebt [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]e Hand  und fordert Ruhe, während [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] eine spricht und eine großartige Ansprache mit dem Titel 'Ein chaotischer Zustand der Dinge' vorträgt. Mit dem Argument, dass das zersplitterte kretische Gemeinwesen dem Untergang geweiht ist, wenn wir uns nicht zu einer Einheit zusammenschließen, zeichnet [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] eloquent ein Bild des bevorstehenden Untergangs. Mit dem Versprechen, dass [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] eine Vision habe, um diese katastrophale Zukunft abzuwenden, warnt [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] uns, dass schwere Zeiten auf uns zukommen, und doch werde die Sonne eines Tages wieder aufgehen – doch dies werde das Vertrauen und die Unterstützung unseres Volkes in den bevorstehenden dunklen Tagen erfordern.\n\nStunden später, als sich das Publikum der Versammlung zerstreute, war die Stimmung düster. Nicht jeder ließ sich von den Worten von [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] überzeugen, doch herrscht Einigkeit darüber, dass ein Krieg unsere Region bald heimsuchen wird."
 me_greek_6_crete_3.a: "Dennoch werde ich diesem chaotischen Reich Frieden bringen"
 me_crete_3_tooltip: "Wir haben nun Ansprüche auf ganz Kreta. $mission_completed_tooltip_1$ '#Y Eine chaotische Lage#!' $mission_completed_tooltip_2$"
  
 me_crete_4_title: "Belagerungsmaschinen und Pioniere"
 me_crete_4_desc: "Es wurden offizielle Beschwerden unserer Buchhalter eingereicht, nachdem die Kosten für die Ausbildung und Ausrüstung unserer Pioniereinheiten bekannt wurden. Obwohl sie gewarnt wurden, dass unsere Mittel gefährlich knapp werden, beginnen unsere Ingenieure jetzt mit der Errichtung von Belagerungsmaschinen, eine zusätzliche Ausgabe, die in unserer ganzen Stadt für Aufsehen gesorgt hat. [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] hörte sich die Beschwerden zunächst schweigend an, beendete aber weitere Auseinandersetzungen schnell mit einem trockenen Kommentar, bevor er sich wieder umdrehte, um den Bau zu beobachten. \n\n'Sagt mir, wie viel es kosten würde, wenn unsere Armee zwei Jahre lang außerhalb der Mauern einer Stadt stationiert wäre, und ihr werdet feststellen, dass ich uns ein Vermögen gespart habe.'"
 me_greek_6_crete_4.a: "Ich versichere euch, diese hervorragend ausgebildeten Truppen werden uns den Sieg bescheren!"
 me_crete_4_tooltip: "$mission_completed_tooltip_1$ '#Y Belagerungsmaschinen und Pioniere#!' $mission_completed_tooltip_2$"
  
 me_crete_5_title: "Eine Goldmünze für den ersten Mann"
 me_crete_5_desc: "Was für eine Wende! Der Mensch ist wahrlich ein launisches Wesen. Noch vor wenigen Monaten wurde [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] regelmäßig von eben jenen Soldaten verflucht, die nun [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]en Namen in Loblieder preisen. Warum dieser plötzliche Sinneswandel, könnte man fragen? Letzte Woche wandte sich [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] an die Truppen im Lager und versprach, dem ersten Mann, der die Mauern einer feindlichen Stadt erklimmt, persönlich eine Goldmünze zu überreichen.\n\nUnsere Soldaten sind begierig darauf, diese Ehre zu erlangen, und viele träumen davon, sich diese unerwartete Belohnung zu sichern. Was für eine brillante Strategie [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] da ersonnen hat!"
 me_greek_6_crete_5.a: "Es ist nichts Falsches daran,... die Männer zu ermutigen, ihre Pflicht zu tun"
 me_crete_5_tooltip: "$mission_completed_tooltip_1$ '#Y Eine Goldmünze für den ersten Mann#!' $mission_completed_tooltip_2$"
  
 me_crete_6_title: "Jeden letzten Tropfen herauspressen"
 me_crete_6_desc: "Unsere jüngsten Erfolge auf dem Schlachtfeld waren zwar überwältigend, haben unseren Männern jedoch einen hohen Blutzoll abverlangt. Es ist allgemein bekannt, dass uns die Mannstärke ausgeht, und ohne weitere Soldaten, die die Lücken in unseren Reihen füllen, drohen wir alles zu verlieren, was wir bisher errungen haben.\ n\nAngesichts der Schwere der Lage traf [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] die unpopuläre Entscheidung, Soldaten auf die Marktplätze zu schicken, um jeden aufzulesen, der in der Lage schien, einen Speer zu halten, und ihn zum Militärdienst zu zwingen.\n\nEine beispiellose Maßnahme, aber das sind leider die Zeiten, in denen wir leben."
 me_greek_6_crete_6.a: "Nehmt jeden körperlich tauglichen Mann fest und schickt ihn unverzüglich in die Ausbildungslager"
 me_crete_6_tooltip: "$mission_completed_tooltip_1$ '#Y Jeden letzten Tropfen herauspressen#!' $mission_completed_tooltip_2$"
  
 me_crete_7_title: "Rationierung einführen"
 me_crete_7_desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] erwirbt sich den Ruf, schwierige Entscheidungen zu treffen, selbst wenn dies auf Kosten von [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]er Beliebtheit geht. Mit der Begründung, es sei nahezu unmöglich, sowohl unsere Armeen als auch unsere Bürger zu ernähren, hat [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] angeordnet, dass Brot in den Städten rationiert wird. Während viele weiterhin ihr Vertrauen in [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] setzen, gibt es einige, die hinter vorgehaltener Hand flüstern, dass [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] nichts weiter als ein Tyrann sei, der nur auf die erste Gelegenheit warte, um die Macht über ein hungerndes Volk an sich zu reißen.\n\nMan muss jedoch schon sehr genau hinhören, um dieses verräterische Gemurmel zu vernehmen – vor allem angesichts des Knurrens leerer Mägen."
 me_greek_6_crete_7.a: "Eines Tages wird es kostenloses Brot für alle geben, aber jetzt müssen wir Opfer bringen"
 me_crete_7_tooltip: "$mission_completed_tooltip_1$ '#Y Rationierung einführen#!' $mission_completed_tooltip_2$"
  
 me_crete_8_title: "Das Uneroberbare erobern"
 me_crete_8_desc: "Auch wenn viele der von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] erlassenen Maßnahmen ihre Kritiker hatten, kann niemand behaupten, dass [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] seine Versprechen nicht eingehalten hat. Zum ersten Mal seit Jahren gibt es auf Kreta eine aufstrebende Macht; unsere Einnahmen, unser Territorium und unser Einfluss wachsen, während unsere Errungenschaften weltweit Anerkennung finden.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] führt uns zum Sieg; wir setzen unser ganzes Vertrauen in [SCOPE.GetRootScope.GetCountry.GetRuler.Custom('get_SieIhn')!"
 me_greek_6_crete_8.a: "Es gibt noch so viel zu tun"
 me_crete_8_tooltip: "$mission_completed_tooltip_1$ '#Y Das Uneroberbare erobern#!' $mission_completed_tooltip_2$"
  
 me_crete_9_title: "Die Stierspringer"
 me_crete_9_desc: "Der Palast in [GetProvince('(int32)358').GetName], einst Wohnsitz legendärer Könige, existiert immer noch in einem halbzerstörten Zustand, und obwohl es unzählige Pflichten gibt, die die verfügbare Zeit von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] in Anspruch nehmen, hat [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] sich entschieden, der Gegend einen persönlichen Besuch abzustatten, im Glauben dass eine altmodische Besichtigung Wunder [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]en Stresspegel bewirken könnte. \n\nEs war Vormittag, als [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], nachdem er auf dem hügeligen Gelände mit Blick auf das Anwesen gefrühstückt hatte, beschloss, sich in den Palast selbst zu wagen. Dort, in der Dunkelheit und Stille, verschlug ein Fresko an einer der östlichen Wände ihm den Atem. Auf die Stuckvertäfelung war eine Szene gemalt, die einen anstürmenden Stier zeigte, prächtig und furchterregend, der alles zu zerstören drohte, was sich vor seinen tobenden Hufen befand, und doch gab es Akrobaten, die lachend und unerschrocken flink über das Tier hinwegsprangen.\n\nMit einer vor Emotionen erstickten Stimme spricht [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]: 'Ich sehe mich selbst und unseren Kampf in diesen Gemälden...wir scheuen niemals die Gefahr, sondern blicken mutig nach vorne, packen den Stier bei den Hörnern und bewegen uns mit Eleganz und Anmut über dem Chaos. Lasst uns diesen Ort verlassen, aber diese Lektion nicht vergessen'"
 me_greek_6_crete_9.a: "Was für eine Inspiration diese Minoer waren..."
 me_crete_9_tooltip: "$mission_completed_tooltip_1$ '#Y Die Stierspringer#!' $mission_completed_tooltip_2$"
  
 me_crete_10_title: "Wie es war, so soll es wieder sein"
 me_crete_10_desc: "Für [GetProvince('(int32)358').GetArea.GetName] ist ein neuer Tag angebrochen, die Insel ist nicht länger Schauplatz von Kämpfen zwischen zerstrittenen Stadtstaaten und rücksichtslosen Söldner, sondern wurde dank der göttlich inspirierten Führung von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] zum ersten Mal seit Menschengedenken befriedet. Jahrelang musste sich unser Herrscher mit den hinterhältigen Strategien feindlicher Generäle herumschlagen und gleichzeitig das angespannte politische Klima sowie die knappen finanziellen Mittel im eigenen Land berücksichtigen – eine Leistung, die unmöglich schien, bevor [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] bewies, dass sie möglich ist. Auf den Straßen herrscht ausgelassene Feierlaune, und Stimmen, die [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] beschuldigten, ein Despot zu sein, besingen nun [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]en ewigen Ruhm.\n\nSelbst jetzt, da [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] mit nahezu allgemeiner Hochachtung überhäuft wird, bleibt [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] ungewöhnlich schweigsam... in dieser Stunde des Triumphs scheint es, als gäbe es noch etwas, das [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] beschäftigt?"
 me_greek_6_crete_10.a: "Wir werden von dem alten Sitz minoischer Macht aus über eine vereinte Insel herrschen"
 me_greek_6_crete_10.b: "Einige haben mich als Tyrannen bezeichnet … sie hatten keine Ahnung, wozu ich fähig bin"
 me_crete_10_tooltip: "$mission_completed_tooltip_1$ '#Y Wie es war, so soll es wieder sein#!' $mission_completed_tooltip_2$"
 me_crete_11_tooltip: "#R [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] und [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]e Unterstützer werden den Thron besteigen!#!"
  
 grumbling_soldiers: "Grummelnde Soldaten"
 desc_grumbling_soldiers: "Unsere Soldaten haben sich über die strenge militärische Disziplin in unseren Lagern beschwert."
 grumbling_bellies: "Grummelnde Bäuche"
 desc_grumbling_bellies: "Während die Einführung eines strengen Rationierungssystems für unsere Kriegsanstrengungen notwendig ist, hat es sich als unglaublich unbeliebt erwiesen."
 iron_weapons: "Eisenwaffen"
 desc_iron_weapons: "Die Ausrüstung einer Armee mit den besten Waffen ist eine Investition, die sich auf dem Schlachtfeld auszahlt."
 cretan_sappers: "Kretische Pioniere"
 desc_cretan_sappers: "Diese Eliteeinheit ist darauf trainiert, Stadtmauern zu zerstören; so ist das Leben auf unserer Insel."
 motivated_soldiers: "Motivierte Soldaten"
 desc_motivated_soldiers: "Unsere Soldaten kämpfen um Ruhm und Ehre, aber das Versprechen einer Goldmünze an den ersten Menschen, der eine Stadtmauer erklimmt, ist ein starker Motivator."
 mighty_crete: "Hegemon Kretas"
 desc_mighty_crete: "Nachdem wir die Insel gewaltsam erobert haben, erklären wir uns zum Hegemon Kretas."
  
  
  
  
  
