l_german:
  #Done 14.09.2026 - 1.11.0.3 - Germanicus
 greek_7_korkyra: "Korkyra, die Schwarze Insel"
 greek_7_korkyra_DESCRIPTION: "Korkyra, die Insel, auf der wir leben, war schon vor uns die Heimat vieler Völker: Illyrer, Phaiaken und Griechen haben sich alle als Herren der 'Schwarzen Insel' bezeichnet – ein Spitzname, der sich aus dem Reichtum ihres Bodens und den dichten Wäldern ableitet, die sich im Inneren der Insel ausbreiten. Seit vielen Jahren sind unsere Geschicke mit denen der Epiroten verflochten, und doch besteht die Hoffnung, dass wir uns bald von den Geschehnissen auf dem Festland lösen können."
 greek_7_korkyra_CRITERIA_DESCRIPTION: "Diese Mission wird abgeschlossen sein, wenn Korkyra ihre Infrastruktur und militärischen Kapazitäten aufgebaut und sichere Grenzen für ihre Landsleute geschaffen hat."
 greek_7_korkyra_BUTTON_TOOLTIP: "Korkyra wird sich ihren Feinden nicht unterwerfen, sondern die Welt mit ihren Errungenschaften überraschen."
 greek_7_korkyra_BUTTON_DETAILS: ""
  
  #Missions 
  
 greek_7_korkyra_task_1: "Nutzen, was wir haben"
 greek_7_korkyra_task_1_DESC: "Auch wenn die uns zur Verfügung stehenden Flächen klein sind, heißt das noch lange nicht, dass wir sie nicht nach besten Kräften erschließen sollten. Je besser unsere Infrastruktur ausgebaut ist, desto mehr Lebensraum steht unseren Bürgern zur Verfügung. \n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
  
 greek_7_korkyra_task_2: "Sicher hinter hölzernen Mauern"
 greek_7_korkyra_task_2_DESC: "Wir vertrauen auf nichts außer unserer eigenen Stärke und müssen alles in unserer Macht Stehende tun, um sicherzustellen, dass wir vor einer fremden Invasion geschützt sind. Der Aufbau unserer Marine sollte daher höchste Priorität haben. \n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
  
 greek_7_korkyra_task_3: "Ein Heimat für ausländische Kämpfer"
 greek_7_korkyra_task_3_DESC: "Da wir uns bei der Verteidigung unserer Insel nicht allein auf unsere eigenen Soldaten verlassen können, haben wir weit und breit bekannt gegeben, dass Söldner bei uns eine langfristige Beschäftigung finden können. Es wird Zeit und Geld kosten, diese Nachricht zu verbreiten, aber wir sind sicher, dass sich diese Investition lohnen wird. \n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
  
 greek_7_korkyra_task_4: "Die Sense schärfen"
 greek_7_korkyra_task_4_DESC: "Wie Ihnen jeder kompetente Architekt bestätigen wird: Wenn Sie ein großartiges Bauwerk errichten wollen, benötigen Sie ein solides Fundament; jede Abkürzung in den Vorbereitungsphasen führt später unweigerlich zur Katastrophe. Glücklicherweise sind wir keine Dummköpfe und werden dafür sorgen, dass [GetProvince('(int32)470').GetName] auf ihre Zukunft vorbereitet ist. \n\n\n\n\n\n\n\n\n\n\n@greek_mil10!!"
  
 greek_7_korkyra_task_5: "Für ihre Frömmigkeit gepriesen"
 greek_7_korkyra_task_5_DESC: "Unsere Insel ist seit jeher ein Ort, an dem die Götter ihr Unwesen trieben; sogar unser Name geht auf eine Legende zurück, denn Korkyra war eine Nymphe, die Poseidon entführte und an unsere Küsten brachte. Da unser Volk seine Zuneigung zu den Göttern stets bewahrt hat, bittet es uns nun, einen heiligen Schrein zu errichten. \n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 religious_piety_tt: "Wir brauchen die #Y Religiöse Zugeständnisse gewähren#! Provinzinvestition in unsere Hauptstadt."
  
 greek_7_korkyra_task_6: "Unsere Seite des Pindus'"
 greek_7_korkyra_task_6_DESC: "Obwohl es in der Provinz [GetProvince('(int32)459').GetArea.GetName] viele ausländische Interessen gibt, müssen wir das gesamte Gebiet auf unserer Seite der Berge kontrollieren – einen Feind so nah an unserer Heimatinsel heranzulassen, bedeutet, Ärger heraufzubeschwören. \n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
  
 greek_7_korkyra_task_7: "Einzug nach Epirus"
 greek_7_korkyra_task_7_DESC: "Auch wenn unsere Nachbarn in [GetProvince('(int32)421').GetArea.GetName] stärker sind als wir, sollten wir nicht zulassen, dass sie uns weiterhin so schikanieren. Da sie unsere Diplomaten ignoriert haben, werden sie vielleicht auf unsere Soldaten hören. \n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
  
 greek_7_korkyra_task_8: "Die Flotten anderswo einsetzen"
 greek_7_korkyra_task_8_DESC: "Uns sind Gerüchte zu Ohren gekommen, dass der Despot von [GetProvince('(int32)84').GetName] seinen hungrigen Blick ins Ausland gerichtet hat, auf der Suche nach kleineren Ländern, die er verschlingen kann – sie werden feststellen, dass wir keine leichte Beute sind; ganz im Gegenteil! \n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
  
 greek_7_korkyra_task_9: "Etwas, womit wir arbeiten können"
 greek_7_korkyra_task_9_DESC: "Vielleicht ist unsere Armee im Vergleich zu anderen klein, aber unsere Truppen sind kampferprobt und daran gewöhnt, in dem schwierigsten Gelände zu kämpfen, das man sich vorstellen kann … Bei militärischen Angelegenheiten können wir definitiv mit dem arbeiten, was wir haben. \n\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 twelve_troops_tt: "[SCOPE.GetRootScope.GetCountry.GetName|Y] hat eine Armeegröße von mindestens #Y 12#!."
  
 greek_7_korkyra_task_10: "Molossische Jagdhunde"
 greek_7_korkyra_task_10_DESC: "In den rauen Hochländern und Bergtälern von Epirus lebt eine wilde Mastiff-Rasse, die als Molosser bekannt ist – es handelt sich um wilde Hunde, die sich hervorragend für die Kriegsausbildung eignen. Wir trainieren diese Bestien, damit sie an der Seite unserer Männer kämpfen und als Wachhunde dienen … wehe dem Unglücklichen, der sich plötzlich Auge in Auge mit dem zahnbewehrten Maul eines dieser Höllenhunde wiederfindet! \n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
  
 greek_7_korkyra_task_11: "Herren der Berge"
 greek_7_korkyra_task_11_DESC: "Wenn wir in der Lage sind, die Provinz [GetProvince('(int32)422').GetArea.GetName] zu sichern, insbesondere die Ausläufer, die zu den Bergpässen hinaufführen, werden wir die Straße in das Kernland Mazedoniens selbst kontrollieren. Dies ist der beste Weg, um unsere widerspenstigen Nachbarn im Auge zu behalten. \n \nSag unseren Soldaten, es ist Zeit für sie, im Pindus zu trainieren, denn wir wollen die unbestrittenen Meister dieser Berge werden.greek_mil12!"
  
 greek_7_korkyra_task_12: "Die Spartaner aufhalten"
 greek_7_korkyra_task_12_DESC: "Wenn es uns gelingt, die Provinz [GetProvince('(int32)422').GetArea.GetName] zu sichern, insbesondere die Ausläufer, die zu den Gebirgspässen hinaufführen, werden wir die Straße ins Kernland Makedoniens selbst kontrollieren. Dies ist der beste Weg, um unsere widerspenstigen Nachbarn im Blick zu behalten.\n\nSagt unseren Soldaten, dass es Zeit für sie ist, im Pindos zu trainieren, denn wir wollen die unangefochtenen Herren dieser Berge werden. \n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
  
 greek_7_korkyra_task_13: "Eine Fülle von Wissen"
 greek_7_korkyra_task_13_DESC: "Zu den Bedingungen, die wir [GetProvince('(int32)84').GetName] nach unserem Sieg auferlegt haben, gehörte auch der Zugang zu den Schriften ihrer Philosophen und weisen Männer, denn wir haben viele Geschichten über die sagenumwobenen Ingenieure gehört, die innerhalb der Stadtmauern arbeiten.\n\nAuch wenn es noch einige Zeit dauern wird, bis sie eintreffen, haben wir die Zusicherung erhalten, dass eine Gruppe gelehrter Männer in unsere Hauptstadt kommen wird, um unsere eigenen Gelehrten zu unterrichten. Sie werden auch die Kriegsentschädigungen bringen, die sie uns schulden, daher erwarten wir ihre Ankunft mit Spannung. \n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
  
 greek_7_korkyra_task_14: "Ein Geschenk eines Gottes"
 greek_7_korkyra_task_14_DESC: "Das Eigenartigste berichten unsere Bürger aus [GetProvince('(int32)470').GetName]: Sie behaupten, dass ein Meeresgott jeden Morgen den Schrein besucht, den wir dort errichtet haben, eine Weile verweilt und dann mit den Gezeiten wieder verschwindet. Wir sollten die Gegend, die der Legende nach der Standort einer ehemaligen phaiakischen Kolonie ist, persönlich besuchen und ein Opfer darbringen. \n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
  
 greek_7_korkyra_task_15: "Ein angespanntes Verhältnis"
 greek_7_korkyra_task_15_DESC: "Jeder, der unsere Geschichte kennt, weiß, dass wir eine ehemalige Kolonie der Stadt [GetProvince('(int32)418').GetName] sind. Obwohl wir früher ein wunderbares Verhältnis zu unserer ehemaligen Heimatstadt hatten, ist dieses in letzter Zeit irreparabel angespannt… \n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
  
 greek_7_korkyra_task_16: "Die Ferse greifen"
 greek_7_korkyra_task_16_DESC: "Die reichen Hafenstädte jenseits des Fretum Hydruntis locken uns wie die sagenumwobenen Sirenen und singen ein liebliches Lied, das Reichtum und Ruhm verspricht, wenn wir unsere Präsenz ausweiten. \n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
  
  #Treasures 
 rudder_of_alcinous: "Ruder von Alkinoos"
 rudder_of_alcinous_desc: "König Alkinoos, Herrscher der Phaiaken, besaß ein bemerkenswertes Schiff, das in seiner Geschwindigkeit einem Falken glich und über das Wasser flog wie ein Vogel am Himmel."
  
  
  #Modifiers 
  
 sharp_scythe: "Geschärfte Sense"
 desc_sharp_scythe: "In der Antike gaben frühe Kartographen unserer Insel einen Spitznamen, der auf ihrer geografischen Form beruhte,  „Sense“. Indem wir jedes Stück Land, das uns zur Verfügung steht, für zivile und private Zwecke nutzen, haben wir die Klinge sicherlich geschärft!"
 korkyra_mercs: "Korkyranische Söldner"
 desc_korkyra_mercs: "Weil unsere Führung bereit ist, Gold auszugeben, um Soldaten anzuheuern, strömen Söldner zu unserem Banner."
 molossian_hounds: "Molossische Jagdhunde"
 desc_molossian_hounds: "Der Molosser wird aufgrund seines furchteinflößenden Aussehens und seiner robusten Konstitution sehr erfolgreich als Wachhund eingesetzt und patrouilliert in den Lagern und Garnisonen unserer Außenposten."
 mountain_master: "Herren des Pindusgebirges"
 desc_mountain_master: "Da unsere Truppen in unserer zerklüfteten Heimat intensiv trainieren und die hohen Gipfel mit einer Leichtigkeit erklimmen, als wären sie Ziegen, werden wir als die Meister des Pindos-Gebirges gefeiert."
  
  
  #Events 
 me_greek_7_korkyra_1_title: "$greek_7_korkyra_task_1$"
 me_greek_7_korkyra_1_desc: "Vom frühen Morgen, wenn die Sonne gerade erst über dem Horizont aufgeht, bis spät in den Abend hinein, wenn unsere Ingenieure im Schein von Fackeln arbeiten müssen, sind unsere Arbeiter in [GetProvince('(int32)470').GetName] ununterbrochen mit dem Bau beschäftigt. Nun, da wir die Nachricht erhalten haben, dass die letzten Projekte kurz vor der Fertigstellung stehen, können alle Einwohner der Stadt ihre Begeisterung kaum noch zurückhalten. Ein Spaziergang durch die frisch geschmückten Straßen von Korkyra mit ihren schattigen, mit Blumengirlanden verzierten Kolonnaden ist zu einer wunderbaren Art geworden, den Nachmittag zu verbringen."
 me_greek_7_korkyra_1.a: "So viel ungenutztes Potenzial hier..."
 me_greek_7_korkyra_1_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_1$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_2_title: "$greek_7_korkyra_task_2$"
 me_greek_7_korkyra_2_desc: "Unsere Küstennähe war schon immer ein zweischneidiges Schwert: zwar profitieren wir sehr davon, so nah am Festland zu liegen, insbesondere was den Handel mit den Epiroten angeht, doch die Meerenge von Korkyra ist so schmal, dass selbst ein Kind von zehn Sommern von [GetProvince('(int32)421').GetName] zu unserer Insel schwimmen kann. Zwar heißen wir alle friedlich gesinnten Besucher willkommen, doch haben wir in eine Flotte investiert, die jederzeit von unseren Häfen auslaufen kann, um jeden aufzuhalten, der mit böswilligen Absichten in unsere Heimat kommen möchte."
 me_greek_7_korkyra_2.a: "Unsere Schiffe sind unsere erste Verteidigungslinie"
 me_greek_7_korkyra_2_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_2$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_3_title: "$greek_7_korkyra_task_3$"
 me_greek_7_korkyra_3_desc: "Angesichts der prekären Lage, in der wir uns befinden, insbesondere was die dürftige Zahl verfügbarer Krieger zur Verteidigung von [GetProvince('(int32)470').GetName] betrifft,  hat unsere Führung beschlossen, voll und ganz auf Söldnerarmeen zu setzen. [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] war die überzeugende Stimme in den Debatten und brachte die konservativen Kräfte in unserem Staatswesen dazu, die Staatskassen zu öffnen und die erfahrenen Krieger aus [GetProvince('(int32)421').GetArea.GetRegion.GetName] einzuladen, sich unserem Militär anzuschließen. Da angeordnet wurde, unsere Ankündigung weit und breit zu verbreiten, wird es einige Monate dauern, bis die Nachricht bekannt ist, aber wir glauben, dass wir bald zahlreiche Krieger in unseren Ausbildungslagern haben werden."
 me_greek_7_korkyra_3.a: "Entsendet Ausrufer in jede Hauptstadt und lasst Maler die Wände der Agoras damit bemalen
 me_greek_7_korkyra_3_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_3$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_4_title: "$greek_7_korkyra_task_4$"
 me_greek_7_korkyra_4_desc: "Die letzten Monate waren stressig und kostspielig, eine Kombination, die [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] gereizt hat, aber wir haben endlich erreicht, was wir uns vorgenommen hatten, doch wir haben endlich unser Ziel erreicht, und nun sind unsere Streitkräfte ausgebildet und in höchster Alarmbereitschaft für alles, was kommen mag. Durch die Verbesserung unserer Offensiv- und Defensivfähigkeiten bei gleichzeitigem Ausbau der Infrastruktur unserer Hauptstadt sind wir nun endlich bereit, den Blick über unsere Stadt hinaus zu richten, sollten wir uns dazu entschließen..."
 me_greek_7_korkyra_4.a: "Wehe dem Angreifer, der versucht, unsere Mauern zu erklimmen!"
 me_greek_7_korkyra_4_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_4$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_5_title: "$greek_7_korkyra_task_5$"
 me_greek_7_korkyra_5_desc: "Seit Menschen sich um Feuer versammeln, um Geschichten zu erzählen, besingen die Dichter unsere Heimat, [GetProvince('(int32)470').GetName], denn wir leben in einem gesegneten Land, in dem sogar die Götter selbst von Zeit umherwandern. Es ist bekannt, dass Poseidon einst eine entführte Nymphe, Korkya, in unsere Heimat brachte und sie ihr anbot,  und unser gläubiges Volk hat unsere Ursprünge nie vergessen, sondern gedenkt ihrer mit Dankgebeten.\n\nDa wir so fromm sind, ist es nur angemessen, dass innerhalb unserer Stadtmauern ein heiliger Schrein errichtet wird, damit das Volk nach Belieben Opfer darbringen kann."
 me_greek_7_korkyra_5.a: "Wir werden selbst an den Morgenopfern teilnehmen und um Segen beten"
 me_greek_7_korkyra_5_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_5$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_6_title: "$greek_7_korkyra_task_6$"
 me_greek_7_korkyra_6_desc: "Das Pindos-Gebirge ist eine natürliche Festung, die uns vor den wütenden Armeen des Ostens schützt – ein kleiner Glücksfall, für den wir sehr dankbar sind. Wenn wir jedoch die Gebirgspässe nicht kontrollieren, handeln wir geradezu selbstmörderisch. Da [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] erkannt hat, wie prekär unsere Sicherheitslage ist, hat er uns dazu gedrängt, die Provinz [GetProvince('(int32)459').GetArea.GetName] zu sichern, sobald wir entsprechende Ansprüche geltend gemacht haben. Wir haben nicht nur ein Auge auf die Hafenstädte geworfen, die die Küsten des Sinus Patraicus säumen, wir können auch keinen ungehinderten Zugang durch die Berge zulassen."
 me_greek_7_korkyra_6.a: "Wir versuchen nur, unsere natürlichen Grenzen zu sichern"
 me_greek_7_korkyra_6_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_6$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_7_title: "$greek_7_korkyra_task_7$"
 me_greek_7_korkyra_7_desc: "Einige betrachten unsere eigene Geschichte als bloße Fußnote in der größeren Geschichte von [GetProvince('(int32)419').GetArea.GetName] und sehen unsere Insel als nicht mehr als einen nachträglichen Gedanken oder eine Mitgift, die zwischen entfernten Adligen gehandelt wurde – doch diese Sichtweise lehnen wir entschieden ab. Da wir uns bewusst sind, dass die Epiroten wild und kriegerisch sind, treffen wir nicht leichtfertig die Entscheidung, ihre Länder für uns zu beanspruchen, doch wir werden nicht zulassen, dass der Feind unsere Zukunft schreibt."
 me_greek_7_korkyra_7.a: "Wir marschieren entweder dem Ruhm oder dem Untergang entgegen, mögen die Götter mit uns sein!"
 me_greek_7_korkyra_7_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_7$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_8_title: "$greek_7_korkyra_task_8$"
 me_greek_7_korkyra_8_desc: "Wir haben von unseren Spionen erfahren, dass der Tyrann von [GetProvince('(int32)84').GetArea.GetName] unsere Fortschritte schon seit einiger Zeit beobachtet und – in der Überzeugung, dass eine solch reiche Beute seiner Stadt Ruhm einbringen würde – offen davon spricht, in unser Land einzufallen, sobald die Bedingungen auf See eine Überfahrt zulassen. Was wirklich beleidigend ist: Die Sirakuser verbergen ihre Kriegspläne nicht, sondern teilen sie ungeniert mit jedem, der ihnen zuhört. Sind wir so machtlos, dass wir zulassen, dass jemand offen unseren Untergang plant? In der Überzeugung, dass der Überraschungseffekt von Vorteil sein wird, hat [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] geschworen, den Feind seine Worte bereuen zu lassen..."
 me_greek_7_korkyra_8.a: "Der Möchtegern-Angreifer wird bald gezwungen sein, seine eigenen Stadtmauern zu verteidigen"
 me_greek_7_korkyra_8_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_8$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_9_title: "$greek_7_korkyra_task_9$"
 me_greek_7_korkyra_9_desc: "Auch wenn wir uns nicht gerne mit anderen vergleichen – da wir davon überzeugt sind, dass wir unbeirrt unseren eigenen Weg gehen und lediglich danach streben, heute besser zu sein als gestern –, können wir die Größe unserer Armee nicht außer Acht lassen, insbesondere im Vergleich zu einigen der benachbarten Mächte. Während wir lange Zeit auf Söldnertruppen angewiesen waren, können wir heute erfreut berichten, dass unsere eigenen Truppen endlich eine respektable Größe erreicht haben."
 me_greek_7_korkyra_9.a: "Mit einer solchen Armee können wir auf jeden Fall etwas anfangen"
 me_greek_7_korkyra_9_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_9$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_10_title: "$greek_7_korkyra_task_10$"
 me_greek_7_korkyra_10_desc: "Inspiriert vom molossischen Hund, jenem wilden Wachhund, der unter den besten Freunden des Menschen seinesgleichen sucht, haben wir begonnen, diese Tiere darauf auszubilden, gemeinsam mit unseren Soldaten zu kämpfen. Sie halten nicht nur in den Lagern und Palästen unserer Städte Wache, sondern marschieren auch an der Seite unserer Männer und heben deren Kampfgeist, während diese durch unwegsames Gelände ziehen. Und wenn der Befehl zum Angriff erteilt wird, stürmen unsere Hunde in die Schlacht, wobei ihr Heulen und Knurren ein absolut furchterregender Klang ist.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], der sich niemals eine einmalige Gelegenheit entgehen lässt, hat sich sogar einen Hund als Haustier zugelegt. Er hat ihn Hierax, also „Falke“, genannt, und der riesige Mischling ist zu einer Art Maskottchen in den Lagern geworden, der seinem Herrn überallhin folgt und bei den einfachen Soldaten sehr beliebt ist."
 me_greek_7_korkyra_10.a: "Wer ist ein guter Junge?"
 me_greek_7_korkyra_10_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_10$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_11_title: "$greek_7_korkyra_task_11$"
 me_greek_7_korkyra_11_desc: "Die taulantischen Stammesangehörigen, die in den Bergen von [GetProvince('(int32)415').GetArea.GetName] leben, sind unserem Volk nicht fremd; wir haben wechselweise Handelsgüter und Speerstöße mit ihnen ausgetauscht – ein Tanz, den wir nur allzu gut kennen. Da [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] beschlossen hat, dass es nun genug ist, und erfahren hat, dass die Taulantier ein Bündnis mit jedem in [GetProvince('(int32)415').GetArea.GetRegion.GetName] anstreben, der bereit ist, sich gegen uns zu stellen, hat er Anweisung gegeben, Ansprüche vorzubereiten."
 me_greek_7_korkyra_11.a: "Wir dürfen nicht tatenlos zusehen, wie unsere Feinde Intrigen gegen uns schmieden"
 me_greek_7_korkyra_11_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_11$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_12_title: "$greek_7_korkyra_task_12$"
 me_greek_7_korkyra_12_desc: "In jüngster Vergangenheit gab es zahlreiche Fälle, in denen [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] gezwungen war, einen Präventivkrieg zu erklären, um den Frieden zu sichern – eine schreckliche Situation für einen verantwortungsbewussten Anführer, insbesondere für einen, der kein großes Verlangen danach hat, die Soldaten von [GetProvince('(int32)470').GetName] in sinnlosen Kriegen sterben zu sehen. Zum Unglück für [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] steht [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] vor einer schwierigen Entscheidung; es scheint, als wollten die Spartaner unsere Insel für sich beanspruchen und hätten bereits mit der Aufstellung einer Invasionsstreitmacht begonnen. Wir werden es die Lakedaimonier bereuen lassen, sich vom Peloponnes entfernt zu haben."
 me_greek_7_korkyra_12.a: "Die Schilde Spartas werden die Leichname ihrer Söhne in den Hades befördern!"
 me_greek_7_korkyra_12_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_12$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_13_title: "$greek_7_korkyra_task_13$"
 me_greek_7_korkyra_13_desc: "Endlich haben die Syrakuser uns das zugesandt, was wir ihnen in unseren letzten Kriegen aus ihren gierigen Händen entrissen haben. Sie haben nicht nur zugestimmt, eine stattliche Kriegsentschädigung zu leisten, die Wunder bewirken wird, um den bitteren Stachel der mit diesem Feldzug verbundenen Kosten zu lindern, sondern wir haben auch um etwas gebeten, das wertvoller ist als Silber und Gold. Im vollen Bewusstsein, dass [GetProvince('(int32)84').GetArea.GetName] die Heimat vieler Gelehrter und Weiser ist, hat [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] verlangt, dass wir Kopien aller Texte aus ihren Bibliotheken erhalten. Kein Dokument wurde als zu unbedeutend angesehen, um kopiert zu werden; so erhielten wir neben philosophischen Abhandlungen und architektonischen Entwürfen auch königliche Kochbücher, Kopien von Verträgen zwischen Syrakus und seinen Nachbarstaaten und sogar einige persönliche Briefwechsel.\n\nUnsere Bibliothekare werden alle Hände voll zu tun haben – eine Aufgabe, die sie mit Begeisterung angehen."
 me_greek_7_korkyra_13.a: "Ich bin neugierig auf die Schriften von Archimedes, über die alle reden ..."
 me_greek_7_korkyra_13_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_13$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_14_title: "$greek_7_korkyra_task_14$"
 me_greek_7_korkyra_14_desc: "Obwohl unsere Quellen in [GetProvince('(int32)470').GetName] den Behörden allerlei Klatsch und Tratsch melden, ist die folgende Geschichte in aller Munde und hat schließlich die persönliche Aufmerksamkeit von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] auf sich gezogen. Es scheint, dass nur wenige Monate nach der Fertigstellung des Schreins, dessen Errichtung [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] in Korkyra angeordnet hatte, ein geheimnisvoller Gott mit der morgendlichen Flut eintraf, die heilige Stätte überflutete, als er das Heiligtum betrat, und nur wenige Stunden später wieder verschwand. Unsere Priester haben dies zu einem Wunder erklärt und [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] eingeladen, persönlich zu opfern, in der Hoffnung, Zeuge des göttlichen Spektakels zu werden, von dem viele glauben, dass es mit den alten Phaiakern in Verbindung steht, die einst hier lebten. \n \n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] traf eines Morgens mit [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]em Gefolge  ein und brachte eine Opfergabe aus dem besten Weihrauch dar, den man für Geld kaufen kann. Beim Betreten der heiligen Stätte entzündete [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] den Weihrauch, ließ den süßen Rauch zum Himmel aufsteigen und sank vor [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] auf die Knie. Als der Duft von Myrrhe den Schrein erfüllte, begann Wasser in den Tempel zu strömen und überspülte alle Anwesenden mit Meerschaum. Die Sonne verdunkelte sich am Firmament, und eine gespenstische Stimme seufzte laut und tief, als eine schimmernde Gestalt erschien, die alle Anwesenden mit Schrecken erfüllte.\n\nDoch kaum hatte der Tumult begonnen, kehrte sich alles ebenso schnell wieder um; der Schatten verschwand, das Wasser zog sich zurück, und der Himmel war wieder von Sonnenlicht und Vogelgesang erfüllt. Als [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] sich zu einem Berater umwandte, dessen Gesicht blass wie ein Laken war, bemerkte er in diesem Moment das Geschenk auf dem Altar..."
 me_greek_7_korkyra_14.a: "Was um alles in der Welt könnte das sein?!"
 me_greek_7_korkyra_14_tooltip: "Das #Y Ruder von Alcinous#! wurde Ihrem Inventar hinzugefügt. $mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_14$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_15_title: "$greek_7_korkyra_task_15$"
 me_greek_7_korkyra_15_desc: "Obwohl die ersten Siedler, die [GetProvince('(int32)470').GetName] gründeten, aus der Stadt [GetProvince('(int32)418').GetName] auf dem Festland stammten, herrschte zwischen uns und unseren Stammvätern nie gerade große Zuneigung.  Obwohl es bereits vor über einem Jahrhundert geschah, schmerzt der als „Affäre von Epidamnus“ bekannte Vorfall diejenigen noch immer, die sich daran erinnern, und gelegentlich trifft man in den Straßen von Korkyra einen Redner an, der eine Schmährede gegen die Korinther hält und behauptet, unsere Ehre verlange, dass wir unsere Mutterstadt militärisch bestrafen.\n\nObwohl [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] diese revanchistischen Träume als Ablenkung betrachtet, lässt sich zweifellos ein politischer Nutzen daraus ziehen, diese Forderungen zu unterstützen, und so ist das Ziel, Korinthos eines Tages zu erobern, zur offiziellen Staatspolitik geworden."
 me_greek_7_korkyra_15.a: "Lasst unsere 'Mutter' wissen, dass wir die Legende von Orestes mit großem Interesse studieren..."
 me_greek_7_korkyra_15_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_15$#!' $mission_completed_tooltip_2$"
  
 me_greek_7_korkyra_16_title: "$greek_7_korkyra_task_16$"
 me_greek_7_korkyra_16_desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], wir haben unsere Pläne für die Invasion Italiens abgeschlossen und die notwendigen Ansprüche vorbereitet. Unsere Soldaten sind außerordentlich begeistert von der Gelegenheit, sich an den Städten und Dörfern in [GetProvince('(int32)64').GetArea.GetName] zu bereichern, und wir können es ihnen kaum verübeln - allem Anschein nach ist es ein wohlhabendes Land, das unsere Schatzkammern mit Silber und Gold füllen wird."
 me_greek_7_korkyra_16.a: "Wir fürchten niemandem in Italien..."
 me_greek_7_korkyra_16_tooltip: "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_16$#!' $mission_completed_tooltip_2$"
  
  
 ###Kleonymos in Korkyra 
 kleonymos_korkyra_event.1.t: "Kleonymos in Korkyra"
 kleonymos_korkyra_event.1.desc: "Es scheint, dass, während #E [GetCharacter('(int32)176').GetPraenomen]#! gegen die Italer kämpfte, die Insel [GetProvince('(int32)470').GetName] seiner Kontrolle entglitt. Nachdem #E [GetCharacter('(int32)176').GetPraenomen]#! nun Zeit hatte, seine Männer neu zu organisieren, wird er sich auf den Weg machen, die Insel zurückzuerobern um seinen verlorenen Kleos wiederherzustellen.\n\nDa #E [GetCharacter('(int32)176').GetPraenomen]#! und seine Truppen die Länder #E [GetCountry('SPA').GetName]s#! zumindest vorläufig verlassen, ist #E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#! frei von jeglichen Bedrohungen durch den schädlichen Einfluss des Thronprätendenten; doch man muss sich fragen, was geschehen wird, sollte #E [GetCharacter('(int32)176').GetPraenomen]#! tatsächlich Erfolg haben..." 
 kleonymos_korkyra_event.1.a: "Hoffen wir, dass er nicht zurückkommt." 
 kleonymos_korkyra_event.1_tt: "#E [GetCharacter('(int32)176').GetPraenomen]#! wird versuchen, #E Korkyra#! zu erobern"  
  
 kleonymos_korkyra_event.2.t: "Ankunft der Armee Kleonymos'"  
 kleonymos_korkyra_event.2.desc: "Im Jahr 303 v. Chr. erreichte der spartanische Prinz #E [GetCharacter('(int32)176').GetPraenomen]#! von #E Sparta#! die Küsten von [GetProvince('(int32)470').GetName], eroberte mühelos die Insel und errichtete dort eine Tyrannis. #E [GetCharacter('(int32)176').GetPraenomen]#! verließ [GetProvince('(int32)470').GetName], in der Hoffnung, in Italien größeren Reichtum und Ruhm zu erlangen, doch seine Feldzüge brachten ihm nur wenig ein, und er verlor seinen Einfluss auf der Insel. Es scheint, als sei der ehrgeizige Prinz nun entschlossen, [GetProvince('(int32)470').GetName] zurückzuerobern, koste es, was es wolle.\n\nWir müssen unsere Armeen vorbereiten und die Streitkräfte von Kleonymos zerschlagen, damit der Tyrann unsere Insel nicht in Schutt und Asche legt..."  
 kleonymos_korkyra_event.2_tt: "Wir haben #Y 1#! #E Jahr#! Zeit, um die Armee von #E [GetCharacter('(int32)176').GetPraenomen]'#! zu besiegen, bevor wir uns mit ihm auseinandersetzen müssen."  
  
 kleonymos_korkyra_event.3.t: "Die Niederlage Kleonymos'"  
 kleonymos_korkyra_event.3.desc: "Unsere Streitkräfte haben die Armeen des verräterischen #E [GetCharacter('(int32)176').GetPraenomen]#! besiegt!\nDer Großteil seiner Schiffe wurde versenkt, und die wenigen Truppen, die ihm noch geblieben sind, wurden zerstreut. #E [GetCharacter('(int32)176').GetPraenomen]#! selbst ist bereits nach #E Sparta#! geflohen und wird wohl nie wieder einen Fuß in die Nähe unseres Landes setzen.\n\nObwohl [GetProvince('(int32)470').GetName] von seinen Truppen geringfügig geplündert wurde, ist unser Sieg über seine spartanische Armee ein großer Triumph für [ROOT.GetCountry.GetName]."  
 kleonymos_korkyra_event.3.a: "Möge Kleonymos für alle Ewigkeit verdammt sein!"  
  
 kleonymos_korkyra_event.4.t: "Kleonymos' Sieg" 
 kleonymos_korkyra_event.4.desc: "Trotz unserer größten Bemühungen, ihn zu besiegen, hat #E [GetCharacter('(int32)176').GetPraenomen]#! #E [GetProvince('(int32)470').GetName]#! eingenommen und einen Großteil der alten #E korinthischen#! Kolonie niedergebrannt, wobei es unseren Armeen nicht gelungen ist, die Überreste der Stadt zurückzuerobern.\n\nWas als Nächstes geschieht, hängt davon ab, welche Bedingungen wir mit dem schrecklichen Prinzen aushandeln können; jedoch wird jedes Ergebnis [SCOPE.GetRootScope.GetCountry.GetName] nun große Verluste bescheren."  
 kleonymos_korkyra_event.4.a: "Lasst uns Kleonymos den Reichtum geben, nach dem er verlangt."  
 kleonymos_korkyra_event.4.b: "Heil König Kleonymos!"  
  
 kleonymos_korkyra_event.5.t: "Kleonymos erleidet in Korkyra eine Niederlage"  
 kleonymos_korkyra_event.5.desc: "#E [GetCharacter('(int32)176').GetPraenomen]#! scheint in #E [GetProvince('(int32)470').GetName]#! eine vernichtende Niederlage erlitten zu haben,  nachdem er beim Versuch, die Inselstadt einzunehmen, den Großteil seiner Streitkräfte verloren hat.\n\nNun ist er mit eingezogenem Schwanz nach #E Sparta#! zurückgekehrt, ohne Aussicht, jemals wieder eine solche Expedition zu unternehmen. Obwohl er in der spartanischen Politik weiterhin eine wichtige Rolle spielen wird, wird diese endgültige Niederlage sein Ansehen beim Rest der spartanischen Bevölkerung für immer trüben."  
 kleonymos_korkyra_event.5.a: "Ein beschämendes Ende der Expedition." 
  
 kleonymos_korkyra_event.6.t: "Kleonymos in Korkyra getötet" 
 kleonymos_korkyra_event.6.desc: "Es scheint, als sei #E [GetCharacter('(int32)176').GetPraenomen]#! bei seinem Feldzug zur Rückeroberung der Insel [GetProvince('(int32)470').GetName] im Kampf gefallen.\n\nDa der Großteil seiner Streitkräfte vernichtet wurde, ist unklar, wie und wo genau ihm der Todesstoß versetzt wurde; sicher ist nur, dass weder er noch seine Soldaten jemals nach #E $SPA$#! zurückkehren werden, was unserem [SCOPE.GetRootScope.GetCountry.GetRulerTitle] #E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#! große Erleichterung verschafft."  
 kleonymos_korkyra_event.6.a: "Ein gewalttätiges Ende für einen gewalttätigen Mann." 
  
 kleonymos_korkyra_event.7.t: "Kleonymos kehrt glorreich nach Hause zurück!" 
 kleonymos_korkyra_event.7.desc: "#E [GetCharacter('(int32)176').GetPraenomen]#! ist von seiner Expedition zur Rückeroberung der Insel [GetProvince('(int32)470').GetName] zurückgekehrt und hat sowohl Gold als auch Ruhm mitgebracht, zum Entsetzen von [SCOPE.GetRootScope.GetCountry.GetRulerTitle] #E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#!.\n\nNachdem er #E [GetProvince('(int32)470').GetName]#! geplündert und die Insel in die Knie gezwungen hat,  hat er der alten #E korinthischen#! Kolonie exorbitante Tributzahlungen abgerungen und ist mit seinem neu erworbenen Reichtum nach [ROOT.GetCountry.GetName] zurückgekehrt. Er war bereits ein gefährlicher Thronanwärter gegen [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen], doch sein plötzlicher Popularitätsschub unter der spartanischen Elite sowie sein Reichtum machen ihn nun zu einem der führenden Akteure in der spartanischen Politik und zu einer unmittelbaren Bedrohung für unseren [SCOPE.GetRootScope.GetCountry.GetRulerTitle]."  
 kleonymos_korkyra_event.7.a: "Das macht die Dinge sicherlich komplizierter..." 
  
 kleonymos_korkyra_event.8.t: "Tyrann von Korkyra" 
 kleonymos_korkyra_event.8.desc: "Die Expedition von #E [GetCharacter('(int32)176').GetPraenomen]#! zur Rückeroberung der Insel [GetProvince('(int32)470').GetName] hat sowohl ihm selbst als auch #E [GetCountry('SPA').GetName]#! große Erfolge beschert.\n\nNachdem er die Streitkräfte der alten #E korinthischen#! Kolonie zerschlagen hat, hat er sich zum #E [GetCharacter('(int32)176').GetPraenomen]#! von #E Korykra#! erklärt und [GetCharacter('(int32)176').GetPraenomen] die Treue geschworen, als Gegenleistung für Siedler.\nDies ist eine äußerst günstige Entwicklung für unseren [SCOPE.GetRootScope.GetCountry.GetRulerTitle] #E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#!, denn neben der Förderung der [GetCountry('SPA').GetAdjective]en Interessen in der Region kommt auch das selbst auferlegte Exil von [GetCharacter('(int32)176').GetPraenomen] in [GetProvince('(int32)470').GetName] unserem [SCOPE.GetRootScope.GetCountry.GetRulerTitle] zugute, da dadurch ein gefährlicher Thronprätendent aus der spartanischen Politik entfernt wird."  
 kleonymos_korkyra_event.8.a: "Was für ein glücklicher Zufall!"  
  
 #9 is used to check success 
