 ####################
 # Title Done 14.09.2026 - V1.11.0.3 - Germanicus
 ####################

 hibernian_missions_01: "Die Vereinigung der hibernischen Stämme"
 hibernian_missions_01_DESCRIPTION: "Die verschiedenen Stämme, die auf der Insel #E Hibernia#! leben, werden unruhig. Dunkle Kriegswolken sammeln sich am Horizont, und es verbreitet sich das Gerücht von ehrgeizigen Stammesfürsten, die bereit sind, die Zerstörung ihrer gesamten Lebensweise zu riskieren, um einen Traum zu verwirklichen: die politische Vereinigung der zerstreuten Nationen unter einer Flagge."
 hibernian_missions_01_CRITERIA_DESCRIPTION: "Diese Mission ist abgeschlossen, wenn die Nation von #E Hibernia#! gebildet wurde."
 hibernian_missions_01_BUTTON_TOOLTIP: "Unsere zukünftigen Triumphe erwarten uns..."
 hibernian_missions_01_BUTTON_DETAILS: ""

 ####################
 # Mission Tasks
 ####################

 hibernian_missions_task_1: "Der Westen"
 hibernian_missions_task_1_DESC: "Es gibt nur eine Sprache, die die Stämme im Westen von #E Hibernia#! verstehen, und das ist Gewalt; zu ihrem Unglück beherrschen wir diese Sprache fließend. Sie werden sich uns unterwerfen oder sterben!\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 hibernian_missions_task_2: "Der Süden"
 hibernian_missions_task_2_DESC: "Die Bodenschätze im Süden von #E Hibernia#! locken unsere Truppen in diese Region, denn wer diese reichen Ländereien besitzt, wird in der Tat sehr wohlhabend sein.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 hibernian_missions_task_3: "Der Osten"
 hibernian_missions_task_3_DESC: "Die vielen Stämme, die in den östlichen Regionen der Insel leben, sollen wilde und unübertroffene Kämpfer sein, aber wir werden sie dennoch erobern.\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"

 hibernian_missions_task_4: "Der Norden"
 hibernian_missions_task_4_DESC: "Die Kontrolle über den Norden von #E Hibernien#! wird uns Zugang zu #E Kaledonien#! über das Meer verschaffen und gleichzeitig mehrere wichtige Handelsgüter unter unsere Kontrolle bringen.\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"

 hibernian_missions_task_5: "Die Kriegsbeute"
 hibernian_missions_task_5_DESC: "Nun, da wir einen großen Teil der Insel erobert haben, wollen wir die Früchte unserer Arbeit genießen - es gibt viele Sklaven, die wir gefangen genommen haben, und sie müssen nach [ROOT.GetCountry.GetCapital.GetName] geschickt werden.\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"

 hibernian_missions_task_6: "Hart erkämpfte Glorie"
 hibernian_missions_task_6_DESC: "Niemand kann leugnen, dass unsere Soldaten unsere [ROOT.GetCountry.GetAdjective]e Siege mit Blut und unzähligen Toten bezahlt haben - wir schulden ihnen alles!\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 hibernian_missions_task_7: "Hibernia"
 hibernian_missions_task_7_DESC: "Endlich haben wir unsere benachbarten Feinde besiegt und ihre Stammeshäuptlinge zur Unterwerfung gebracht - wir sind nun hier, um die Geburt von #Y Hibernia#! zu erleben.\n\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 you_need_to_form_hibernia: "#Y Wir müssen die Entscheidung treffen, um#! #E Hibernia zu gründen#!."

 hibernian_missions_task_8: "Britannischer Handel"
 hibernian_missions_task_8_DESC: "Es gibt Stämme jenseits des Wassers in #E Britannia#!, mit denen wir Handelsbeziehungen aufbauen könnten, wenn wir dies wünschen.\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"

 hibernian_missions_task_9: "Kaledonische Ansprüche"
 hibernian_missions_task_9_DESC: "Nun, da wir den Norden der Insel gesichert haben, erkennen wir, dass es Ländereien jenseits des Wassers gibt, die für uns leicht zu erobern wären...\n\n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 hibernian_missions_task_10: "Eine hibernische Hauptstadt"
 hibernian_missions_task_10_DESC: "Das Einzige, was unserem Land fehlt, ist eine Hauptstadt, aber das ist ein Problem, das wir lösen werden. Sobald wir den Standort unserer nationalen Hauptstadt gewählt haben, werden wir sofort mit dem Bau einer Stadt beginnen.\n\n#Y Wir werden die Gelegenheit erhalten, die Hauptstadt unseres Landes zu verlegen, und es wird eine Stadt errichtet werden.#!\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 hibernian_missions_task_11: "Hibernische Bauernhöfe"
 hibernian_missions_task_11_DESC: "Unsere wachsende Nation wird Nahrung brauchen - lasst uns überall auf der Insel Bauernhöfe errichten.\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

 hibernian_missions_task_12: "Unedle Metall-Minen"
 hibernian_missions_task_12_DESC: "Es gibt viele Dinge, die uns fehlen, aber zum Glück gehört der Zugang zu unedlen Metallen nicht dazu; wir sollten unsere Bergbaukapazitäten ausbauen, um unsere wirtschaftliche Stellung zu stärken.\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 we_need_one_hibernian_mines_tt: "Mindestens #Y 1#! Territorium in der Region von [GetProvince('(int32)2161').GetArea.GetName|Y], das #Y Unedle Metalle#! @base_metals! produziert, hat eine #Y Mine#!."

 me_hibernia_ultimatum.2.tt: "Wir werden Krieg gegen jeden #Y $hibernia_group$en#! Stamm erklären, der unsere Forderungen ablehnt!"
 me_hibernia_ultimatum_send.tt: "Wir werden jedem hervorgehobenen Land ein Ultimatum stellen: Entweder es erkennt unsere Vorherrschaft an oder es muss mit einem Krieg rechnen."
 bravest_hibernia_ruler_duel_tt: "Unser Herrscher muss die Charakterinteraktion #Y zum Rivalen machen#! mit dem Anführer eines feindlichen Landes verwenden und #Y zum Duell herausfordern#!."
 hibernia_group: "Hibernisch"
 
 
 
 

 ####################
 # Events
 ####################

 me_hibernia_1_title: "Die Insel Hibernia"
 me_hibernia_1_desc: "Obwohl viele Menschen noch nie von der Insel #E Hibernia#! gehört haben, es sei denn, sie sind mit den Abhandlungen der griechischen Entdecker vertraut, ist es ein blühender, lebendiger Ort, der von einer großen Anzahl von Stämmen bewohnt wird, die ständig um die Vorherrschaft kämpfen.\n\nAuch wenn niemand die Zukunft kennt, glaubt man, dass die Vereinigung der Insel unter einer Flagge unausweichlich ist... Die Geschichtsbücher erwarten die Ankunft des ersten Herrschers, der #E Hibernia#! vereint."
 me_hibernia_1.a: "Ich weiß, wer diese Person sein wird..."
 me_hibernia_1_tooltip: "Es ist Zeit, Geschichte zu schreiben..."

 me_hibernia_2_title: "Der Süden"
 me_hibernia_2_desc: "[ROOT.GetCountry.GetRuler.GetName] war noch nie jemand, der [ROOT.GetCountry.GetRuler.GetHerHis]e Ambitionen verleugnet hat, und der Besitz der reichen Länder im Süden von #E Hibernia#! war schon lange ein Traum vom [ROOT.GetCountry.GetAdjective]en [ROOT.GetCountry.GetRulerTitle].\n\nJetzt, da [ROOT.GetCountry.GetName] in der Lage ist, etwas dagegen zu unternehmen, bleibt abzuwarten, was geschehen wird.\n\nIn etwa einer Woche werden wir sehen, ob unser Angebot angenommen wurde."
 me_hibernia_2.a: "Die Götter sind mit uns, du wirst sehen! Der Sieg ist unser!"
 me_hibernia_2_tooltip: "$mission_completed_tooltip_1$ '#Y Der Süden#!' $mission_completed_tooltip_2$"

 me_hibernia_3_title: "Der Westen"
 me_hibernia_3_desc: "Unsere Ansprüche wurden vorbereitet und an unsere Nachbarn übermittelt - es wird nicht lange dauern, bis wir von ihnen hören. Hoffentlich sind sie so vernünftig, sich friedlich zu unterwerfen, aber wir sind auf alles vorbereitet, wofür sie sich auch entscheiden mögen\n\nIn etwa einer Woche werden wir sehen, ob unser Angebot angenommen wurde."
 me_hibernia_3.a: "Halte deine Schwerter scharf und deine Speere bereit..."
 me_hibernia_3_tooltip: "$mission_completed_tooltip_1$ '#Y Der Westen#!' $mission_completed_tooltip_2$"

 me_hibernia_4_title: "Der Osten"
 me_hibernia_4_desc: "Die Angriffskriege, die von [ROOT.GetCountry.GetName] geführt werden, werden eines Tages für die Herrlichkeit und Ehre in Erinnerung bleiben, die sie dem [ROOT.GetCountry.GetAdjective]en Volk gebracht haben.\n\nMögen die Geschichtsbücher freundlich zu [ROOT.GetCountry.GetRuler.GetName] sein, demjenigen, der all diese Leiden und Tode zwischen fernen Verwandten geschehen lässt.\n\nIn etwa einer Woche werden wir sehen, ob unser Angebot angenommen wurde."
 me_hibernia_4.a: "Das Blutvergießen wird die Belohnungen wert sein - da bin ich mir sicher."
 me_hibernia_4_tooltip: "$mission_completed_tooltip_1$ '#Y Der Osten#!' $mission_completed_tooltip_2$"

 me_hibernia_5_title: "Der Norden"
 me_hibernia_5_desc: "Die nördlichen Gebiete von #E Hibernia#! waren immer etwas Besonderes für [ROOT.GetCountry.GetRuler.GetName], der schöne Erinnerungen an Sommer entlang der Küsten in [ROOT.GetCountry.GetRuler.GetHerHis]er Jugend hat. Die kalte Meeresluft, die atemberaubende Küste...sie hat für jeden etwas zu bieten.\n\nVielleicht kann man sagen, dass es ein wenig Nostalgie ist, die [ROOT.GetCountry.GetName] dazu treibt, die Region zu erobern.\n\nIn etwa einer Woche werden wir sehen, ob unser Angebot angenommen wurde."
 me_hibernia_5.a: "Der Frieden, den ich bringe, wird wie ein Sommertag sein..."
 me_hibernia_5_tooltip: "$mission_completed_tooltip_1$ '#Y Der Norden#!' $mission_completed_tooltip_2$"

 me_hibernia_6_title: "Die Kriegsbeute"
 me_hibernia_6_desc: "[ROOT.GetCountry.GetRuler.GetName] ist es in letzter Zeit gelungen, [ROOT.GetCountry.GetName] zu einer Reihe beeindruckender Siege zu führen – eine Tatsache, die von allen Menschen in [ROOT.GetCountry.GetCapital.GetName] gefeiert wird, die den [ROOT.GetCountry.GetRulerTitle] mit Lob überschütten.\ n\nNun, da wir einen Moment Zeit haben, um durchzuatmen, ist es an der Zeit, das zu feiern, was wir auf dem Schlachtfeld errungen haben – die gesamte Nation wird davon profitieren."
 me_hibernia_6.a: "Ich werde immer kämpfen, um dem [ROOT.GetCountry.GetAdjective]em Volk zum Sieg zu verhelfen!"
 me_hibernia_6_tooltip: "$mission_completed_tooltip_1$ '#Y Die Kriegsbeute#!' $mission_completed_tooltip_2$"

 me_hibernia_7_title: "Hart erkämpfte Glorie"
 me_hibernia_7_desc: "Auch wenn Krieg für die Bevölkerung niemals leicht ist, hat [ROOT.GetCountry.GetRuler.GetName] dafür gesorgt, dass auch der einfache Mann nicht vergessen wird, wenn [ROOT.GetCountry.GetName] eine kurze Atempause von seinen Kriegen genießt.\n\nDer [ROOT.GetCountry.GetRulerTitle] war schon immer der Überzeugung, dass jeder an unseren Siegen teilhaben sollte, und nicht nur diejenigen, die in [ROOT.GetCountry.GetCapital.GetName] leben."
 me_hibernia_7.a: "Alle haben für unseren Sieg gekämpft, daher sollte jeder daran teilhaben"
 me_hibernia_7_tooltip: "$mission_completed_tooltip_1$ '#Y Hart erkämpfte Glorie#!' $mission_completed_tooltip_2$"

 me_hibernia_8_title: "Hibernia"
 me_hibernia_8_desc: "Es ist schwer zu glauben, aber [ROOT.GetCountry.GetRuler.GetName] hat unsere Nation auf den Höhepunkt des Ruhms gebracht; nicht länger als einfache Stammesmitglieder bekannt, haben wir eine Leistung erreicht, die von den Häuptlingen und Königen jenseits des Meeres bemerkt wird, ddie angesichts der wachsenden [ROOT.GetCountry.GetAdjective]en Macht zu Recht um ihre Sicherheit fürchten.\n\nWir sind [ROOT.GetCountry.GetName] - möge die Welt erzittern!"
 me_hibernia_8.a: "Unser Name wird für immer mit ewigem Sieg verbunden sein"
 me_hibernia_8_tooltip: "$mission_completed_tooltip_1$ '#Y Hibernia#!' $mission_completed_tooltip_2$"

 me_hibernia_9_title: "Britannischer Handel"
 me_hibernia_9_desc: "Dank der Handelsschiffe, die regelmäßig von unseren Häfen aus in Richtung #E Britannia#! auslaufen, ist ein stetiger Handelsstrom zu einem festen Bestandteil des täglichen Lebens in [ROOT.GetCountry.GetCapital.GetName] geworden.\n\nWährend sich alle über dieses Wachstum unseres Reichtums freuen, hat niemand vergessen, dass es die Initiativen von [ROOT.GetCountry.GetRuler.GetName] sind, die all dies möglich gemacht haben."
 me_hibernia_9.a: "Gemeinsam können wir alle Geld verdienen - unser [ROOT.GetCountry.GetAdjective]es Volk verdient Wohlstand"
 me_hibernia_9_tooltip: "$mission_completed_tooltip_1$ '#Y Britannischer Handel#!' $mission_completed_tooltip_2$"

 me_hibernia_10_title: "Kaledonische Ansprüche"
 me_hibernia_10_desc: "Obwohl jeder weiß, dass die #E Kaledonier#! furchterregende Krieger sind, hat dies [ROOT.GetCountry.GetRuler.GetName] nicht davon abgehalten, [ROOT.GetCountry.GetAdjective]e Ansprüche auf ihre Ländereien vorzubereiten.\n\nFrüh genug werden unsere Rekruten das #E Mare Hibernicum#! überqueren und Verwüstung über die nichtsahnenden bringen."
 me_hibernia_10.a: "Ich kann es kaum erwarten! Klingt nach einer großartigen Zeit"
 me_hibernia_10_tooltip: "$mission_completed_tooltip_1$ '#Y Kaledonische Ansprüche#!' $mission_completed_tooltip_2$"

 me_hibernia_11_title: "Eine hibernische Hauptstadt"
 me_hibernia_11_desc: "Nachdem [ROOT.GetCountry.GetRuler.GetName] die feindlichen Stämme von [ROOT.GetCountry.GetName] unterworfen hat, wurde vorgeschlagen, dass wir unsere nationale Hauptstadt in eine neue Provinz verlegen.\n\nEinige schlagen vor, dass wir unseren Regierungssitz in die Mitte der Insel verlegen, während andere den Standort von [GetProvince('(int32)2193').GetName] wegen seines natürlichen Hafens bevorzugen.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] muss nun entscheiden, wo wir unsere Hauptstadt errichten werden...eine beneidenswerte Aufgabe, aber eine, die [ROOT.GetCountry.GetRuler.GetSheHe] sicherlich verdient."
 me_hibernia_11.a: "[GetProvince('(int32)2191').GetName] in der Mitte von #E Hibernia#! ist die natürliche Wahl"
 me_hibernia_11.b: "[GetProvince('(int32)2193').GetName] an der Küste ist ein ansprechender Ort"
 me_hibernia_11.c: "[GetProvince('(int32)2169').GetName] im Westen hat mein Interesse geweckt"
 me_hibernia_11.d: "Ich glaube, ich habe [GetProvince('(int32)2162').GetName] gewählt"
 me_hibernia_11.e: "Wir werden unsere alte Hauptstadt behalten"
 me_hibernia_11_tooltip: "$mission_completed_tooltip_1$ '#Y Eine hibernische Hauptstadt#!' $mission_completed_tooltip_2$"

 me_hibernia_12_title: "Hibernische Gehöfte"
 me_hibernia_12_desc: "Überall auf dem Land sind die von uns errichteten Bauernhöfe produktiv und ertragreich; es scheint, dass der ständige Regen, den unsere Insel erhält, wahre Wunder für unsere Ernten bewirkt.\n\nDank der Infrastruktur, die wir jetzt haben, werden wir mehr Getreide lagern können als zuvor."
 me_hibernia_12.a: "Das freut mich - ich hoffe, dass unser Volk glücklich ist"
 me_hibernia_12_tooltip: "$mission_completed_tooltip_1$ '#Y Hibernische Gehöfte#!' $mission_completed_tooltip_2$"

 me_hibernia_13_title: "Unedle Metallvorkommen"
 me_hibernia_13_desc: "Wir freuen uns zu berichten, dass die von uns errichteten Minen unsere hohen Erwartungen übertreffen.\n\nWir haben nicht nur genügend Bodenschätze gesichert, um den Bau dauerhafter Bauwerke zu einer einfachen Angelegenheit zu machen, sondern auch eine bedeutende Eisenerzader entdeckt, die für unsere Waffen wahre Wunder bewirken wird."
 me_hibernia_13.a: "Ich bin gespannt, was unsere Schmiede herstellen können"
 me_hibernia_13_tooltip: "$mission_completed_tooltip_1$ '#Y Unedle Metallvorkommen#!' $mission_completed_tooltip_2$"

 me_hibernia_ultimatum_1_title: "Hibernische Unterwerfung"
 me_hibernia_ultimatum_1_desc: "Da sie erkannt haben, dass sie niemals hoffen können, uns auf dem Schlachtfeld zu besiegen, haben unsere Feinde uns ihre Freiheit überlassen und bitten uns lediglich darum, sie gut zu behandeln und unsere Macht nicht zu missbrauchen."
 me_hibernia_ultimatum_1.a: "Das spielt keine Rolle... wir werden am Ende triumphieren"
 me_hibernia_ultimatum_1.b: "Wir heißen diejenigen willkommen, die uns mit offenen Armen empfangen, und vernichten diejenigen, die sich von uns abwenden"

 me_hibernia_ultimatum_2_title: "Hibernischer Blutdurst"
 me_hibernia_ultimatum_2_desc: "Unsere Diplomaten bei unseren hibernischen Nachbarn zu Gast waren, kehren mit Nachrichten zurück, die [ROOT.GetCountry.GetRuler.GetName] und [ROOT.GetCountry.GetRuler.GetHerHis]en Durst nach Ruhm erfreuen werden. Was auch immer letztendlich passiert, wir werden über alle triumphieren, die uns im Weg stehen!"
 me_hibernia_ultimatum_2.a: "Sagt unseren Stammesmitgliedern, dass sie auf alles vorbereitet sein sollen!"

 ####################
 # Modifiers
 ####################
 hibernia_abandoned_capital_mod: "Verlassene historische Hauptstadt"
 desc_hibernia_abandoned_capital_mod: "Unsere Stammesangehörigen sind wütend darüber, dass wir die sanften Hügel verlassen haben, auf denen ihre Väter begraben sind."
 hibernia_historic_capital_mod: "Beibehaltene historische Hauptstadt"
 desc_hibernia_historic_capital_mod: "Da unser Volk den Ort unserer angestammten Hauptstadt als heilig betrachtet, hat es beschlossen, in unserer Heimat zu bleiben, anstatt einen anderen Ort zu suchen."
 hibernian_stoneworks: "Hibernische Bergleute"
 desc_hibernian_stoneworks: "Ob es nun darum geht, Eisen, Stein oder unedle Metalle aus unseren Minen zu gewinnen – unsere Stammesangehörigen meistern diese mühsame Aufgabe ausgezeichnet."
 iron_weapons_hibernia: "Eiserne Waffen"
 desc_iron_weapons_hibernia: "Unsere Minen in Hibernia sorgen dafür, dass unsere Streitkräfte mit widerstandsfähigen Waffen ausgerüstet sind – unsere Schwerter werden weder zerbrechen noch sich verbiegen, sondern so unnachgiebig bleiben wie unser Wille."
 hibernian_food_mod: "Hibernische Getreidespeicher"
 desc_hibernian_food_mod: "Dank der von uns gebauten Bauernhöfe können wir Getreide für die kargen Winter lagern."