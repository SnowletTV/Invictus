l_german:
  iberia_missions:0 "Der Aufstieg der iberischen Könige" #Done 12.09.26 - 1.11.0.3 - Germanicus
  iberia_missions_DESCRIPTION:0 "Wenn man von den großen Hafenstädten des Mittelmeers aus segelt und den Wasserstraßen an Byzantion vorbei bis zum Pontus Euxinos folgt, erreicht man schließlich eine ferne Küste, an der sich eine kolossale Bergkette, der Kaukasus, erhebt, um die weite nördliche Steppe zu durchbrechen - diese unversöhnliches Land ist unser Zuhause. Wir haben hier unsere eigenen Traditionen, verehren die wahren Götter, die Außenstehenden unbekannt sind, und obwohl wir von Feinden umgeben sind, die uns gerne aus unseren Hochlandstädten vertreiben würden, ist es ihnen bisher nicht gelungen. \n\nAnstatt unseren Feinden die Möglichkeit zu geben, ihren üblen Absichten nachzukommen, müssen wir unser Schicksal fest in die Hand nehmen.""
  iberia_missions_CRITERIA_DESCRIPTION:0 "Diese Mission ist erfüllt, wenn die Herrscher Iberiens ihre Nachbarn zurückdrängen und eine starke und sichere Nation errichten, die in der Lage ist, ihre Macht weit über unsere bergige Heimat hinaus auszuüben."
  iberia_missions_BUTTON_TOOLTIP:0 "Iberia wird sich seinen Feinden nicht beugen...ganz im Gegenteil."
  iberia_missions_BUTTON_DETAILS: ""
  
  #Missions
  iberia_missions_task_1:0 "Von Feinden umgeben"
  iberia_missions_task_1_DESC:0 "Wir sind von allen Seiten von Feinden umgeben; die grimmigen Armenier im Süden, das arrogante Kolchis im Westen und die wilden Albaner im Osten. Da unsere Militärberater keinen Konsens erzielen können, werden wir Ansprüche gegen alle unserer Nachbarn erheben. \n\n\n\n\n\n\n\n\n\n@greek_mil6!""
  iberia_missions_task_2:0 "Der Vorstoß an die Küsten"
  iberia_missions_task_2_DESC:0 "Unsere jüngsten Siege bringen die verlockende Aussicht auf noch größere Erfolge in den kommenden Tagen mit sich; wenn unsere Soldaten weiter vorrücken, werden wir nicht nur die Küsten des Mare Hyrcanum erreichen, sondern könnten sogar Zugang zu den Gewässern des Pontus Euxinus erlangen. \n\n\n\n\n\n\n\n\n\n@greek_mil18!"
  iberia_missions_task_3:0 "Land des Vlieses"
  iberia_missions_task_3_DESC:0 "Obwohl wir die Macht von [GetProvince('(int32)1715').GetArea.GetName] zerschmettert haben, gibt es immer noch Befürchtungen, dass sie wieder an Stärke gewinnen könnten. Es ist klar geworden, dass wir sie vollständig vernichten müssen, um zu verhindern, dass diese Möglichkeit jemals eintritt. \n\n\n\n\n\n\n\n\n\n@greek_mil14!"
  iberia_missions_task_4:0 "Albanische Reste"
  iberia_missions_task_4_DESC:0 "Unsere Truppen vernichten weiter die albanischen Stammesangehörigen; nun, da wir ihre Kerngebiete fest im Griff haben, wird es nicht mehr lange dauern, bis wir auch die letzten Reste ihres Königreichs verschlungen haben.\n\nNun, da wir sie fest im Griff haben, müssen wir über ihr Volk urteilen – wir werden nicht nur ihre Gebiete einnehmen, sondern auch ihre kostbaren Ressourcen an uns reißen – der Fisch aus dem #E Mare Hyrcanum# soll äußerst köstlich sein.n\n\n\n\n\n\n\n\n\n@celt_mil6!"
  iberia_missions_task_5:0 "Unsere Füße nass bekommen"
  iberia_missions_task_5_DESC:0 "Obwohl wir neue machtvolle Akteure in der Region sind, wird unsere Präsenz im Pontus Euxinus bald allen bekannt sein – unsere Schiffbauinitiative wird unseren Einfluss weit über die Küsten unseres Heimatlandes hinaus erweitern! Wir werden unsere Hauptstadt über eine Straße mit dem Meer verbinden, und dann wird uns die ganze Welt offenstehen. \n\n\n\n\n\n\n\n\n\n@greek_mil4!"
  iberia_missions_task_6:0 "Die Eristavi stärken"
  iberia_missions_task_6_DESC:0 "Die Eristavi waren eine in den Adelsstand erhobene Klasse lokaler Herrscher, deren Aufgaben denen eines Statthalters ähnelten, und denen die Pharnavaziden die Herrschaft über Provinzen in ihrem Namen anvertraut hatten. Bevor wir weitere Reformen durchführen können, müssen wir ihnen die entsprechende Befugnis erteilen. \n\n\n\n\n\n\n\n\n\n@celt_mil3"
  reduced_governor_tt:0 "Wir brauchen die Erfindung #Y Reduzierte Statthalterschaften#!."
  iberia_missions_task_7:0 "Eine einzigartige Sprache"
  iberia_missions_task_7_DESC:0 "Obwohl derzeit in unserem Heimatland eine große Anzahl von Sprachen gesprochen wird und eine gleiche Anzahl von Schriften von den Menschen verwendet wird, haben wir beschlossen, dass alle denselben Dialekt sprechen und auf dieselbe Weise schreiben müssen. \n\n\n\n\n\n\n\n\n\n@india_mil17!"
  iberia_missions_task_8:0 "#E Dowin#!" #nt!
  iberia_missions_task_8_DESC:0 "[GetProvince('(int32)1572').GetName] liegt am Zusammfluss dreier Flüsse und ist damit eine wichtige Stadt für den Reise- und Handelsschiffsverkehr. Auch wenn die Einheimischen von unsererAnwesenheit in ihrem Land nicht gerade begeistert sind, können wir sie für uns gewinnen, indem wir die Infrastruktur dieses wichtigen Handelsknotenpunkts verbessern.\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
  iberia_missions_task_9:0 "Aus dem Lychnitis-See"
  iberia_missions_task_9_DESC:0 "Unseren Truppen ist es gelungen, die erste Verteidigungslinie der Armenier zu durchbrechen und weite Teile des Landes zu erobern.\n\nLasst uns diesen Vorteil nutzen und das Eisen schmieden, solange es heiß ist! Sagt den Männern, dass wir #Y armenische Sklaven#! @slaves! in [ROOT.GetCountry.GetCapital.GetName] benötigen! \n\n\n\n\n\n\n\n\n\n@greek_mil15!"
  iberia_missions_task_10:0 "Armenische Befestigungen"
  iberia_missions_task_10_DESC:0 "Da wir so viele der großen Städte Armeniens erobert haben, verfügen wir nun über einen riesigen Wissensschatz, auf den wir vorher keinen Zugang hatten. Jeder weiß, dass die Armenier meisterhafte Festungen bauen,  warum lernen unsere eigenen Ingenieure also nicht, ihren Stil nachzuahmen?Bald werden wir unsere königlichen Bibliotheken mit ihren architektonischen Abhandlungen füllen. \n\n\n\n\n\n\n\n\n\n@greek_mil1!"
  iberia_missions_task_11:0 "Die Mauern von [GetProvince('(int32)1676').GetName]"
  iberia_missions_task_11_DESC:0 "[GetProvince('(int32)1676').GetName] ist zwar schon jetzt ein beeindruckender Anblick, aber wir glauben, dass wir unsere Festung und Zitadelle noch schwerer einzunehmen machen könnten.\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
  iberia_missions_task_12:0 "Iberische Union"
  iberia_missions_task_12_DESC:0 "Zum ersten Mal in der Geschichte unseres Volkes sind die Anhänger des [ROOT.GetCountry.GetReligion.GetName]en Glaubens unter einer Krone vereint, und die Macht unserer benachbarten Feinde ist für eine Generation oder länger gebrochen. Möge Armazi uns weiterhin seinen Segen schenken und uns zum Sieg führen! \n\n\n\n\n\n\n\n\n\n@greek_mil3!"
  iberia_missions_task_13:0 "Iberischer Wein"
  iberia_missions_task_13_DESC:0 "Unser Volk ist bekannt für seine Fertigkeiten in der Weinherstellung – ein Gewerbe, dem wir schon seit Jahrtausenden nachgehen. Sobald die Ernte eingebracht ist, füllen wir riesige Tongefäße, die wir in unserer Sprache „Kvevri“ nennen, und vergraben sie tief im Boden. Wer iberischen Wein trinkt, empfindet andere Jahrgänge oft als geschmacklich minderwertig. \n\n\n\n\n\n\n\n\n\n@celt_mil2!"
  iberia_missions_task_14:0 "Blut von Pharnavazid"
  iberia_missions_task_14_DESC:0 "Aufgrund der von der Pharnavaziden-Dynastie eingeleiteten Reformen ist der Ruhm unseres Volkes für Generationen gesichert. Von unserer Festung in [GetProvince('(int32)1676').GetName] aus herrschen wir über ein weitläufiges Königreich, das wir mit unseren eigenen Händen aufgebaut haben. \n\n\n\n\n\n\n\n\n\n@greek_mil10!"
  
 #Tooltips

 pharnavid_tt:0 "Pharnavaz Pharnazavid muss der König von Iberia sein."

 #Treasure
 eristavi_regalia_iberia_treasure:0 "Eristavi Regalia"
 eristavi_regalia_iberia_treasure_desc:0 "This magnificent belt, ring, sword and scepter - the symbols that were given to Iberian governors by the great ruler Pharnavaz Pharnavazid - are empowered with the authority of the renowned King."

   #Modifiers
  georgian_script:0 "Georgische Schrift"
  georgian_script_desc:0 "Die von Pharnavaz Pharnavazid eingeführte neue Schreibweise entwickelte sich schließlich im Laufe der Jahre und wurde als georgische Schrift bekannt."
  armenian_construction:0 "Armenische Baukunst"
  armenian_construction_desc:0 "Unsere Architekten haben viel über den Bau von Befestigungen von ihren armenischen Kollegen gelernt, die ihre Geheimnisse widerwillig mit unseren Ingenieuren geteilt haben."
  armazi_walls:0 "Die Mauern von Armazistsikhe"
  armazi_walls_desc:0 "Wir haben die Festung von Armazistsikhe so gebaut, dass sie unbesiegbar ist; Solange die Zitadelle innerhalb ihrer Mauern steht, wird unser Volk Hoffnung für die Zukunft haben."
  eristavi:0 "Eristavi"
  eristavi_desc:0 "Die Eristavi, eine besondere Art von Verwaltungsamt, das von Pharnavaz Pharnavazid eingeführt wurde, regierten die ihnen zugewiesenen Provinzen faktisch im Namen des Königs."
  iberian_wine:0 "Iberischer Wein"
  iberian_wine_desc:0 "Mit einer jahrtausendealten Tradition der Weinherstellung sind die Menschen auf der Iberischen Halbinsel bekannt für die Früchte der Weinrebe, die sie produzieren, wobei einige behaupten, dass wir die ersten waren, die diese Kunst beherrschten."
  iberian_power:0 "Armazische Macht"
  iberian_power_desc:0 "Wir haben die Gebiete erobert, in denen der armazische Glaube praktiziert wird, und die Region zu einer mächtigen Macht vereint, in der die Heere der Gläubigen die Städte voller wahrer Gläubiger beschützen."
  maritime_boom:0 "Maritimer Aufschwung"
  maritime_boom_desc:0 "Die Verbindung von Armazistsikhe mit der Hafenstadt Phasis hat zu einem beispiellosen Wachstum für unsere Nation geführt."
  iberian_warmonger_mod:0 "Von Feinden umgeben"
  desc_iberian_warmonger_mod:0 "Unsere prekäre militärische Lage hat den Willen unserer Soldaten, notfalls an allen Fronten zu kämpfen, nur noch bestärkt."
  iberian_access_to_the_caspian_sea_mod:0 "Zugang zum Mare Hyrcanum"
  desc_iberian_access_to_the_caspian_sea_mod:0 "Wir haben die Albaner aus ihrer Heimat vertrieben und sie in die Gewässer des Mare Hyrcanum gedrängt, zu denen wir nun uneingeschränkten Zugang haben."
  iberian_tree_dowin_city_mod:0 "Stadt der Flüsse"
  desc_iberian_tree_dowin_city_mod:0 "Die Iberer haben massiv in die Infrastruktur dieser Stadt investiert und dabei deren natürliche Lage als Handelszentrum genutzt."

   #Events
  me_iberia_1_title:0 "$iberia_missions_task_1$#!"
  me_iberia_1_desc:0 "Auch wenn wir unsere Heimat von ganzem Herzen lieben und gerne unser Leben opfern würden, um unser Land zu verteidigen, müssen wir zugeben, dass unsere geografische Lage verbesserungswürdig ist; wir sind buchstäblich von allen Seiten von Feinden umgeben, eine Situation, die [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] bis tief in die Nacht hinein wach gehalten hat. Unsere Militärberater können sich nicht entscheiden, wer der schwächste unserer Nachbarn ist, was die Unsicherheit noch verstärkt. Daher wurde beschlossen, dass wir in alle Richtungen Ansprüche erheben und auf einen günstigen Moment für eine Expansion warten sollten."
  me_iberia_1.a:0 "Es ist gut, die Wahl zu haben..."
  me_iberia_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_1$#!' $mission_completed_tooltip_2$"
  
  me_iberia_2_title:0 "$iberia_missions_task_2$#!"
  me_iberia_2_desc:0 "Eines führte zum anderen, und dank der Siege, die unsere Armeen auf den Schlachtfeldern errungen haben, sehen unsere Generäle nun die Gelegenheit, die verbliebenen Armeen der #E Albaner#! und der #E Kolchier#! zu vernichten! Da sie Kerngebiete an unsere Truppen verloren haben, sind ihre Streitkräfte zerschlagen und in Unordnung, und unsere Spione berichten, dass die Moral in den feindlichen Lagern auf einem Tiefpunkt ist. Wir dürfen ihnen keine Atempause gewähren, sondern müssen zuschlagen, solange der Moment günstig ist!"
  me_iberia_2.a:0 "Die Wasser des Pontus Euxinus sind gleich hinter dem Horizont!"
  me_iberia_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_2$#!' $mission_completed_tooltip_2$"
  
  me_iberia_3_title:0 "$iberia_missions_task_3$#!"
  me_iberia_3_desc:0 "Es ist uns nicht nur gelungen, die #E Kolchier#! von ihren Küsten zu vertreiben, sondern wir haben auch einige der kleineren unabhängigen Stadtstaaten geplündert, die an den Ufern des Pontus Euxinus liegen – etwas, das auch in Hauptstädten weit entfernt von unserer eigenen bemerkt werden wird.\n\nAber das sei nun einmal beiseite gelassen; hier, in unserer neuen Stadt [GetProvince('(int32)1720').GetName], werden unsere maritimen Ambitionen ihren Anfang nehmen. Der Zugang zu diesem Gewässer mit seinen Möglichkeiten der Handelsbeziehungen und vielleicht sogar der militärischen Expansion signalisiert der Welt, dass Iberien kein unbedeutender Akteur ist, sondern eine Macht, mit der man rechnen muss."
  me_iberia_3.a:0 "Beginnen Sie sofort mit dem Aufbau einer Flotte!"
  me_iberia_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_3$#!' $mission_completed_tooltip_2$"
 
  me_iberia_4_title:0 "$iberia_missions_task_4$#!"
  me_iberia_4_desc:0 "Obwohl die albanischen Stammesangehörigen, unsere barbarischen Vettern im Osten, ihr Bestes versuchten, um unseren Soldaten Widerstand zu leisten, war ihr Schicksal am Ende ähnlich dem der Kolcher. Dennoch würdigen wir die Tapferkeit ihrer Kämpfer und bedauern die Umstände, die uns gezwungen haben, unsere kaukasischen Brüder zu töten. \n\nNachdem nun die endgültige Unterwerfung der albanischen Anführer erreicht wurde,  wurde vorgeschlagen, dass wir die verbleibenden Stämmen zu einem Bundesgenossen machen. Einige Stimmen in unserer Regierung haben vorgeschlagen, solch ungehobelte Wilden auf Abstand zu halten, während andere argumentieren, dass sie die gleichen Chancen verdienen, wie unsere anderen Bürger \n\nZum Unglück der Albaner war die Entschlossenheit von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] noch nie so groß wie jetzt."
  me_iberia_4.a:0 "Nein, mit der Zeit werden die Albaner unsere Lebensweise übernehmen – annektiert sie"
  me_iberia_4.b:0 "Es wurde beschlossen, dass wir ihre letzten Überreste indirekt beherrschen werden"
  me_iberia_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_4$#!' $mission_completed_tooltip_2$"
 
  me_iberia_5_title:0 "$iberia_missions_task_5$#!"
  me_iberia_5_desc:0 "Großartige Neuigkeiten aus den Städten entlang des Pontus Euxinos! Da wir es für richtig gehalten haben, die Werften von [GetProvince('(int32)1737').GetArea.GetName] mit ausgezeichnetem Holz zu beliefern, genießen wir anscheinend einen kleinen Aufschwung in der Region – unsere Schiffsbauer werden nicht nur besser darin, brauchbare Schiffe zu bauen, sondern immer mehr Reisende entscheiden sich dafür, in der Gegend zu bleiben. Wir haben recht gut daran getan, in die Region zu investieren."
  me_iberia_5.a:0 "Von uns werdet ihr niemals hören, dass wir uns über solche Dinge beschweren"
  me_iberia_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_5$#!' $mission_completed_tooltip_2$"
 
  me_iberia_6_title:0 "$iberia_missions_task_6$#!"
  me_iberia_6_desc:0 "Eines der allerersten Dinge, die nach der Machtübernahme auf der Tagesordnung von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] standen, war die Einberufung eines Großen Rates, zu dem die führenden Familien in ganz [SCOPE.GetRootScope.GetCountry.GetName] Vertreter entsenden würden, um den neuen Herrscher zu begrüßen.\n\nBei der Ankunft in [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] wurde der Zweck dieses Treffens schnell klar: Da er vor allem Frieden und Stabilität wünschte, hatte [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] beschlossen, eine besondere Art von Statthalterschaft zu schaffen, eine Position, die als „Eristavi“ bekannt ist und als Erweiterung des königlichen Willens fungieren würde.\n\n Er rief sieben Männer auf, sich vor [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHim] aufzureihen, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] nahm ihnen einen heiligen Eid ab und überreichte jedem dieser Anführer Zeichen ihrer Autorität."
  me_iberia_6.a:0 "Nimm diesen Ring, diesen Gürtel, dieses Zepter und dieses Schwert – erinnere dich an deinen Eid"
  me_iberia_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_6$#!' $mission_completed_tooltip_2$"
  
  me_iberia_7_title:0 "$iberia_missions_task_7$#!"
  me_iberia_7_desc:0 "Wir sind dankbar, dass unser Land von einer Vielzahl von Völkern bevölkert ist, aber es ist zugegebenermaßen schwierig, über eine so unterschiedliche Gruppe zu herrschen, wo in jedem Bergtal ein etwas anderer Dialekt gesprochen wird und ein Schriftsystem verwendet wird, das für die Kaufleute in den nahegelegenen Städten möglicherweise unverständlich ist. \n\nDa [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] erkannte, dass dies zu einem Problem geworden ist, insbesondere im Hinblick auf die Modernisierung unserer Verwaltung, ordnete er an, eine neue Schrift zu verwenden, die eigens für unser Volk geschaffen wurde. Es wurde außerdem festgelegt, dass die von den Einwohnern von [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] gepflegte Sprache nun die offizielle Landessprache ist, sodass jeder unseren besonderen Dialekt übernehmen muss."
  me_iberia_7.a:0 "Unsere offiziellen Aufzeichnungen werden auf die neue Weise geschrieben"
  me_iberia_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_7$#!' $mission_completed_tooltip_2$"
 
  me_iberia_8_title:0 "$iberia_missions_task_8$#!"
  me_iberia_8_desc:0 "Die stolze Stadt [GetProvince('(int32)1572'). GetName] war bei den Menschen der Region [GetProvince('(int32)1757').GetArea.GetName] bereits lange bevor unsere [ROOT.GetCountry.GetAdjective]en Landsleute zum ersten Mal in ihre Berge kamen, sehr beliebt, doch niemand kann leugnen, dass [ROOT.GetCountry.GetName] diese Perle von einer Stadt in etwas viel Großartigeres verwandelt hat.\n\nDie Bedeutung von Dowin wird unter der Führung von [ROOT.GetCountry.GetRuler.GetName], der bereits so viel für unsere Nation geleistet hat, weiter zunehmen."
  me_iberia_8.a:0 "Dowin, die Stadt der Flüsse, wird stets ein wichtiger Teil von [ROOT.GetCountry.GetName] sein."
  me_iberia_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_8$#!' $mission_completed_tooltip_2$"
 
  me_iberia_9_title:0 "$iberia_missions_task_9$#!"
  me_iberia_9_desc:0 "Eine nach der anderen fallen die reichen Städte der Provinz [GetProvince('(int32)1572').GetArea.GetName] an unsere Armeen, was uns fragen lässt, wie die Armenier sich von diesen Rückschlägen überhaupt wieder erholen wollen. Selbst jetzt, da sich unsere Soldaten am Ufer des Lychnitis-Sees versammeln, um auf ihre nächsten Befehle zu warten, werden unsere Pläne bereits in die Tat umgesetzt; schon bald werden wir in das Kernland Armeniens vordringen und deren Hauptstadt belagern – es wird nicht lange dauern, bis unsere Soldaten in den Straßen von [GetProvince('(int32)1570').GetName] selbst Tür an Tür kämpfen!"
  me_iberia_9.a:0 "Wir werden jeden vernichten, der sich unseren Plänen entgegenstellt!"
  me_iberia_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_9$#!' $mission_completed_tooltip_2$"
  
  me_iberia_10_title:0 "$iberia_missions_task_10$#!"
  me_iberia_10_desc:0 "Da die armenische Heimat von schroffen Höhen und felsigen Schluchten geprägt ist, haben ihre Ingenieure und Architekten einen Baustil entwickelt, der sich an die örtlichen Gegebenheiten anpasst. Indem sie ihre Befestigungsanlagen direkt an die Berghänge anpassen, nutzen die Armenier die Kraft der Erde selbst und können so sichere Festungen errichten, die jeder gegnerischen Armee Angst und Schrecken einjagen – fragt doch einfach die Veteranen unserer letzten Feldzüge im Süden, was sie von den armenischen Festungen halten."
  me_iberia_10.a:0 "Das sind hervorragende Neuigkeiten! Unsere Zukunft baut auf solchen Fundamenten auf"
  me_iberia_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_10$#!' $mission_completed_tooltip_2$"
 
  me_iberia_11_title:0 "$iberia_missions_task_11$#!"
  me_iberia_11_desc:0 "Auch wenn man es beim Anblick der Stadtmauern von [GetProvince('(int32)1676').GetName] niemals vermuten würde, blüht dort eine lebendige und weltoffene Stadt. Dank der robusten Befestigungsanlagen konnte sich unsere [ROOT.GetCountry.GetAdjective]e Kultur auf eine Weise entfalten, die in weniger sicheren Zeiten undenkbar gewesen wäre."
  me_iberia_11.a:0 "Wir werden hinter unseren Stadtmauern sicher sein - wehe der Armee, die versucht zu belagern!"
  me_iberia_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_11$#!' $mission_completed_tooltip_2$"
 
  me_iberia_12_title:0 "$iberia_missions_task_12$#!"
  me_iberia_12_desc:0 "Der Tag, von dem unsere Vorfahren geträumt haben, ist endlich gekommen: nach Jahren erbitterter Kämpfe wurden unsere Rivalen um die Macht besiegt, ihre Fähigkeit, Krieg zu führen, unwiderruflich gebrochen, und eine höchste Autorität herrscht nun über die Länder, die von den armazischen Gläubigen bewohnt werden. Wer könnte angesichts unserer Besitzungen und der uns zuteilgewordenen Segnungen die Macht und Stärke Armazis leugnen? Möge Er uns weiterhin mit göttlicher Gunst überhäufen, während wir unser Volk in die glorreiche Zukunft führen, die uns erwartet!"
  me_iberia_12.a:0 "Wir werden das Licht unseres Glaubens in alle Ecken der Welt tragen"
  me_iberia_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_12$#!' $mission_completed_tooltip_2$"
  
  me_iberia_13_title:0 "$iberia_missions_task_13$#!"
  me_iberia_13_desc:0 "Eine erfreuliche Nachricht für euch heute Morgen, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]; eine willkommene Abwechslung von den unaufhörlichen Forderungen der Menschen oder den Berichten über Scharmützel in der Nähe der Grenze. Wie Ihr wisst, ist unser Volk in der Weinherstellung außergewöhnlich begabt, und unsere jüngsten Initiativen zur Ausweitung der Produktion sind reibungslos verlaufen. Die Kvevri, die übergroßen Tonfässer,  in denen die Flüssigkeit gelagert wird, wurden in den Boden eingegraben und unsere Traubenstampfer beginnen mit der Arbeit. Es wird nicht lange dauern, bis wir alle die diesjährigen Ernte genießen können, ein Anlass, den jeder gerne feiern wird."
  me_iberia_13.a:0 "Teilt uns unbedingt mit, wann die ersten Kvevri fertig sind!"
  me_iberia_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_13$#!' $mission_completed_tooltip_2$"
 
  me_iberia_14_title:0 "Das Blut von Pharnavazid"
  me_iberia_14_desc:0 "Auch wenn es vermessen ist, sich vorzustellen, was künftige Generationen über die Taten von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] sagen werden, glauben wir doch, dass der Name der Pharnavaziden bis in alle Ewigkeit nachhallen wird. Keine andere Herrscherfamilie hat so viel für unser Volk getan . Die Eristavi herrschen über eine zufriedene Gesellschaft, und indem er die Sprache, die wir sprechen, und die Worte, die wir schreiben, grundlegend verändert hat, hat [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], der sich mit der Sonne selbst salbt, unsere Wahrnehmung der Realität buchstäblich geprägt.\n\nSolange sich die Menschen an das Königreich Iberien erinnern, werden sie sich auch an die Königsfamilie erinnern, die es geschaffen hat."
  me_iberia_14.a:0 "Die Herrschaft über das iberische Volk war das größte Privileg meines Lebens"
  me_iberia_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_14$#!' $mission_completed_tooltip_2$"