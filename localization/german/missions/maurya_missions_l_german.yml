 mauryan_collapse_prevention_task_6_tooltip: "Der buddhistische Mönch #Y Samudra#! wird in unserem Land erscheinen"
 mauryan_collapse_prevention_task_8_tooltip: "Alle Charaktere, die ein Amt innehaben, haben mindestens #Y 75#! Loyalität."
 mauryan_collapse_prevention_task_8_tooltip_2: "Der Gouverneur von #Y Madhyadesa#! hat mindestens #Y 60#! Loyalität"
 mauryan_collapse_prevention_task_8_tooltip_3: "Der Gouverneur von #Y Maru#! hat mindestens #Y 60#! Loyalität"
 mauryan_collapse_prevention_task_8_tooltip_4: "Der Gouverneur von #Y Avanti#! hat mindestens #Y 60#! Loyalität"
 mauryan_collapse_prevention_task_8_tooltip_5: "Der Gouverneur von #Y Aparanta#! hat mindestens #Y 60#! Loyalität"
 mauryan_collapse_prevention_task_8_tooltip_6: "Der Gouverneur von #Y Vindhyaprstha#! hat mindestens #Y 60#! Loyalität"
 mauryan_collapse_prevention_task_8_tooltip_7: "Der Gouverneur von #Y Gandhara#! hat mindestens #Y 60#! Loyalität"
 mauryan_collapse_prevention_task_9_tooltip: "Der #R Mauryan Collapse#! wird durch #Y [GetCharacter('(int32)66').GetName]#! verhindert."
  
  ##Second Mission tree 
 mauryan_reconquest: "Magadhi-Wiederbelebung"
 mauryan_reconquest_DESCRIPTION: "Unser großes Königreich liegt in Trümmern. Unsere letzten paar Herrscher konnten den Untergang unserer Nation nicht verhindern. Nicht einmal der große Ashoka, dem wir so sehr vertrauen, konnte unseren Kampf für eine gefestigte Maurya beenden. Jetzt sind wir schwach und nur noch ein Schatten unseres früheren Selbst. Wenn wir unseren Status als Großmacht in Indien wiedererlangen wollen, müssen wir wieder stark werden!"
 mauryan_reconquest_CRITERIA_DESCRIPTION: "Diese Mission wird abgeschlossen, sobald Sie alle Länder zurückerobert haben, die nach dem Tod von Ashoka verloren gegangen sind."
 mauryan_reconquest_BUTTON_TOOLTIP: "Dem Ruhm vergangener Zeiten entgegen!"
 mauryan_reconquest_BUTTON_DETAILS: ""
  
 mauryan_reconquest_task_1: "Magadhi-Wiederbelebung"
 mauryan_reconquest_task_1_DESC: "Maurya is no longer the behemoth it was during the reign of Chandragupta. We have shrunken in power and influence throughout India, but our spirits are as high as ever. We mustn't go down without a fight!"  <"None">  #NT!
 mauryan_reconquest_task_2: "Shungan-Zerstörung"
 mauryan_reconquest_task_2_DESC: "The Shungan have used our time of temporary weakness to become a major power within our previous realm. Their decadence is sickening and their arrogance an insult towards us - we cannot tolerate their presence for another day. We must crush them."  <"None">  #NT!
 mauryan_reconquest_task_3: "Fordern Sie Satavahana heraus"
 mauryan_reconquest_task_3_DESC: "Satavahana is one of the many powers that sprung up after our fracture. Still, they are weak. We may be able to move diplomatically and secure our lost land without bloodshed."  <"None">  #NT!
 mauryan_reconquest_task_4: "Die indisch-griechische Frage"
 mauryan_reconquest_task_4_DESC: "The Greeks in Bactria and Persia have long been a nuisance for us. But now, damnable fates, there is even Greek influence within our former western provinces, a development that we should not tolerate. Though they are not considered a primary target of interest, gaining influence in the regions that they are infiltrating might prove profitable for us."  <"None">  #NT!
 mauryan_reconquest_task_5: "Wiederbelebung der Maurya"
 mauryan_reconquest_task_5_DESC: "We have lost much of our strength during the last events, but now we are growing powerful again. Our enemies shall cower before us; we will reclaim what was once ours!"  <"None">  #NT!
 mauryan_reconquest_task_6: "Magadhi-Einfluss"
 mauryan_reconquest_task_6_DESCc: "The recent losses of our dominions scattered our people into different kingdoms all over northern India. Reuniting our populace is of utmost importance for our revival, for what do we have if we do not have our people?"  <"None">  #NT!
 mauryan_reconquest_task_7: "Aufbau unseres Vermächtnisses"
 mauryan_reconquest_task_7_DESC: "We are not done yet! And we will prove it to the whole world. Building up our cities will show everyone that we are still a force to be reckoned with."  <"None">  #NT!
 mauryan_reconquest_task_8: "In den Dschungel"
 mauryan_reconquest_task_8_DESC: "The jungles of India are a harsh and unforgiving place. Wild animals and uncivilized tribes live within these dangerous biomes. However, we are destined for greatness, and even the forces of nature will be subdued by our arms."  <"None">  #NT!
 mauryan_reconquest_task_9: "Beherrsche Aparanta"
 mauryan_reconquest_task_9_DESC: "To the west lies the region of Aparanta. It is the gateway into the Arabian Sea and the Hellenistic kings in Syria and Egypt. "  <"None">  #NT!
 mauryan_reconquest_task_10: "Schieben Sie nach Süden"
 mauryan_reconquest_task_10_DESC: "After the untimely death of Raja [Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName], Dravidia and Karnata were lost. These provinces have always been an important anchor for Mauryan dominance and we will take them back."  <"None">  #NT!
 mauryan_reconquest_task_11: "Handel von Odisha"
 mauryan_reconquest_task_11_DESC: "Odisha lies in the east. From there, many exotic animals and other curiosities are traded throughout India and the western world."  <"None">  #NT!
 mauryan_reconquest_task_12: "Häfen des Westens"
 mauryan_reconquest_task_12_DESC: "The western coast of India brings many chances for economic growth. Just beyond the sea lies the fertile regions of Arabia and Mesopotamia, with markets that are the envy of all who see them. Many ports will be needed if we want to trade with them efficiently."  <"None">  #NT!
 mauryan_reconquest_task_13: "Die Metropole Pataliputra"
 mauryan_reconquest_task_13_DESC: "Pataliputra is the seat of our power, and as such, should reflect our strength. Building it up will set an important stone for our revival."  <"None">  #NT!
 mauryan_reconquest_task_14: "Pracyan-Seide"
 mauryan_reconquest_task_14_DESC: "Silk is one of the best selling products on the current market. Merchants travel far and wide to get a hand on the valuable fabric. Establishing a monopoly on this product would make them all come to us, no?"  <"None">  #NT!
 mauryan_reconquest_task_15: "Mauryaische Handelsnetzwerke"
 mauryan_reconquest_task_15_DESC: "Trade is what makes India rich. Its natural resources, abundance of food, and exotic goods are highly valued in the lands to the west. Expanding upon our trade network could help us to build up our economy."  <"None">  #NT!
 mauryan_reconquest_task_16: "Getreidespeicher von Indien"
 mauryan_reconquest_task_16_DESC: "The backbone of our nation has, and always will be, its people. Without them, who are we to rule over? Our kingdom is high in population, therefore, much food will be needed."  <"None">  #NT!
 mauryan_reconquest_task_17: "Dravidische Dominanz"
 mauryan_reconquest_task_17_DESC: "Dravidia escaped our control after the death of [Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]. Restoring our dominance over these lands will show them that Maurya is not to be underestimated."  <"None">  #NT!
 mauryan_reconquest_task_18: "Nach Karnata"
 mauryan_reconquest_task_18_DESC: "Karnata has always been a place of interest for our kingdom. Even Chandragupta had plans of invasion for it. "  <"None">  #NT!
 mauryan_reconquest_task_19: "Integrieren Sie Taxila wieder"
 mauryan_reconquest_task_19_DESC: "Taxila is a place with a long and glorious history. Regaining it for our kingdom will ensure the same glory for us."  <"None">  #NT!
 mauryan_reconquest_task_20: "Tamilische Wege"
 mauryan_reconquest_task_20_DESC: "In the far south rule the Tamil Kings. Highly proficient merchants who dominate the trade in the Indian Sea. Interaction with them might bring benefits for us."  <"None">  #NT!
 mauryan_reconquest_task_21: "Loyalitäten zurückgewinnen"
 mauryan_reconquest_task_21_DESC: "Our people have lost much faith in us throughout the years. The collapse of our empire after the death of [Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName] has brought with it a time of anarchy and lawlessness. We must ensure to them that order has been restored."  <"None">  #NT!
 mauryan_reconquest_task_99: "Bharat"
 mauryan_reconquest_task_99_DESC: "Bharat, the local name for our beloved India, is back under our control. But we mustn't stop here. We will unite all of India under our banner, so that we will all fight on the same side."  <"None">  #NT!
  
