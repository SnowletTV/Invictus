 mauryan_reconquest_task_99_tooltip: "Treffen Sie die Entscheidung, #Y Bharatavarsha#! zu gründen."
  
  #Flavor Events 
 flavor_maurya_1_title: "Tod von Chandragupta"
 flavor_maurya_1_desc: "Unser frommer Raja, Chandragupta, hat die Lehren des Jainismus vollständig angenommen und sich dafür entschieden, seinen irdischen Körper zu Tode zu hungern, damit seine Seele erblühen kann. Viele innerhalb des Gerichts sind immer noch schockiert, und einige fordern eine lange Trauerzeit, bevor die Nachfolge geregelt wird. Unsere vielen Feinde werden dies jedoch bemerken und wir müssen schnell handeln; Bindusara, der älteste Sohn von Chandragupta, wird der neue Raja sein."
 flavor_maurya_1.a: "Möge er ruhig ruhen."
  
 flavor_maurya_2_title: "Bhadrabahu der Jain"
 flavor_maurya_2_desc: "Unser berühmter Hof zieht viele reisende heilige Männer an; Einige versuchen zu missionieren und teilen die Lehren ihrer Meister in der Hoffnung, neue Anhänger zu gewinnen, und viele bitten einfach um Almosen, bevor sie in die nächste Stadt ziehen. Aber heute ist es anders; Ein Jain-Mönch namens Bhadrabahu, der im ganzen Land für seine vielen Schriften bekannt ist, ist in unserem Palast angekommen, und König Chandragupta hat großes Interesse an ihm gezeigt. Vielleicht könnten uns seine Lehren bei unserem Streben nach Größe helfen?"
 flavor_maurya_2.a: "Bringen Sie ihn vor Gericht"
 flavor_maurya_2.b: "Maurya ist kein Jain!"
  
 flavor_maurya_3_title: "Jainische Lehren"
 flavor_maurya_3_desc: "Bhadrabahu, der Jain-Mönch, der kürzlich unserem Hof ​​beigetreten ist, hat jeden Morgen gelehrt. Sogar Chandragupta selbst wagt sich nach Sonnenaufgang in den Hof hinunter, nimmt zwischen den Zuhörern Platz, und die Gespräche zwischen Monk und Raja dauern viele Stunden, oft über das Mittagessen hinaus. Viele beginnen zu glauben, dass jainistische Denkweisen eine Überlegung wert sind. Wenn wir sie in unserem ganzen Königreich predigen würden, könnten wir vielleicht irgendwie davon profitieren."
 flavor_maurya_3.a: "Fangen Sie an, Jain-Werte im Reich anzunehmen"
 flavor_maurya_3.b: "Maurya ist und bleibt vedisch!"
 flavor_maurya_3.tt: "Bhadrabahu wird gehen und nach Süden gehen ..."
  
 flavor_maurya_5_title: "Der Tod von Bindusara"
 flavor_maurya_5_desc: "In einer schrecklichen Kette von Ereignissen wurde unser Raja, Bindusara, Verschlinger der Feinde, ermordet. Kurz nachdem diese schreckliche Nachricht bekannt wurde, lieferten sich viele seiner Söhne einen blutigen Kampf um den Thron, aus dem sein Sohn Ashoka als Sieger hervorging. Obwohl wir vielleicht immer noch einen Raja haben, brauen sich in unserem Reich Probleme zusammen. Die jüngsten Todesfälle von Chandragupta und Bindusara haben ihre Spuren in unserem Königreich hinterlassen, und schwierige Zeiten werden vor uns liegen."
 flavor_maurya_5.a: "Ashoka wird dieses Chaos beheben."
 flavor_maurya_5_tooltip: "#G Erhalte Zugang zum Missionsbaum Kollapsprävention#!. \n#R Dieser Missionsbaum wird fehlschlagen, wenn er nicht vor dem Tod von Ashoka#! abgeschlossen wird."
  
 flavor_maurya_6_title: "Ashoka ist tot!"
 flavor_maurya_6.desc_1: "Ashoka der Große ist gestorben und wir auch. Wie können wir hoffen zu überleben, ohne dass seine führende Hand uns führt? Viele Länder an unseren Grenzen und sogar unsere eigenen Untertanen versuchen nun, unserem einst so großen Imperium ein Ende zu bereiten. Ist unsere letzte Überlebenschance wirklich dahin?"
 flavor_maurya_6.desc_2: "Ashoka der Große ist gestorben, aber seine Bemühungen waren nicht umsonst. Er stabilisierte unser Land und die Herrschaft der Mauryaner über ganz Indien. Er wird für viele Jahre als der größte indische Herrscher bekannt sein, der je gelebt hat. Seine Errungenschaften werden durch die Ewigkeit widerhallen!"
 flavor_maurya_6.a: "Ärger naht..."
  
 flavor_maurya_9_title: "Deccan Uneinigkeit"
 flavor_maurya_9_desc: "Mylord, unser Imperium liegt in Trümmern. Alle unsere Bestände in Südindien haben revoltiert. Die Satavahana-Dynastie und die Kalingas, mögen Hunde auf ihren Knochen kauen, haben sich für unabhängig erklärt, und viele weitere scheinen auf dem Weg zu sein, dasselbe zu tun! Was kann getan werden?"
 flavor_maurya_9.a: "Wann wird es enden..."
 flavor_maurya_9.b: "Vielleicht ist das ein Neuanfang."
 flavor_maurya_9_tooltip_B: "#Y Satavahana#! und #Y Kalinga#! entweder den Krieg erklären oder uns einen Waffenstillstand anbieten."
 flavor_maurya_9_tooltip_C: "Gib #Y Maurya# auf! und spiele weiterhin als #Y Satavahana#! und kämpfe gegen #Y Maurya#!."
  
 flavor_maurya_10_title: "Die Sache mit Satavahana"
 flavor_maurya_10_desc: "Die Anführer von Satavahana spüren unsere Uneinigkeit und haben entschieden, dass die Zeit gekommen ist, gegen uns zu rebellieren. Es gibt keine einfache Möglichkeit, dies auszudrücken, Mylord, aber ein Großteil von Zentralindien ist verloren. Wenn wir jedoch schnell zuschlagen, können wir diese Rebellion vielleicht niederschlagen und die Region sichern. Nichtsdestotrotz scheinen weitere Probleme auf dem Weg zu sein. Vielleicht wäre es klüger, ihnen erst einmal ihre Unabhängigkeit zu lassen und sie zu einem späteren Zeitpunkt zu schlagen?"
 flavor_maurya_10.a: "Lass sie sein ... für jetzt"
 flavor_maurya_10.b: "Wir müssen diese Gebiete zurückerobern!"
  
 flavor_maurya_11_title: "Umgang mit Kalinga"
 flavor_maurya_11_desc: "Im Südosten unseres Reiches hat die weit entfernte Provinz Kalinga ihre Unabhängigkeit von uns erklärt. Der örtliche Adel hat demonstrativ öffentlich seine Unterstützung für uns aufgegeben und eine totale Rebellion begonnen, indem er unsere Garnisonen aus ihren Städten vertrieben hat – dieser Verrat wird nicht toleriert. Ähnliche Ereignisse finden jedoch überall in unserem Reich statt, und Kalinga ist möglicherweise nicht das wichtigste Feuer, das gelöscht werden muss. Sie in einem falschen Sicherheitsgefühl zurückzulassen, könnte eine spätere Rückeroberung erleichtern."
 flavor_maurya_11.a: "Schaffen Sie einen Waffenstillstand"
 flavor_maurya_11.b: "Kalinga schadet Maurya!"
  
 flavor_maurya_12_title: "Indisch-griechische Koalition"
 flavor_maurya_12_desc: "Seit Jahren planen griechische Rebellen im Nordwesten Indiens, die Unabhängigkeit zu erlangen, aber wir haben diese Einmischung von Ausländern nie als mehr als ein Ärgernis empfunden. Aber jetzt haben sich die verfluchten Griechen in einer großen Koalition gegen die Maurya-Herrschaft organisiert und sogar einige der lokalen Bevölkerung davon überzeugt, sich ihnen anzuschließen! Was sollen wir tun, um mit dieser aufkommenden Bedrohung fertig zu werden?"
 flavor_maurya_12.a: "Erklären Sie diesen Rebellen den Krieg"
 flavor_maurya_12.b: "Wir können uns keinen weiteren kostspieligen Krieg leisten"
 flavor_maurya_12.c: "Spielen Sie als Kapisa"
 flavor_maurya_12.d: "Spielen Sie als Panchanada"
 flavor_maurya_12.e: "Spielen Sie als Kuninda"
 flavor_maurya_12.f: "Spielen Sie als Kaschmir"
 flavor_maurya_12.g: "Spielen Sie als Sauvira"
 flavor_maurya_12_tooltip_A: "Gib #Y Maurya# auf! und spiele weiterhin als #Y Indo-Greek Kingdom#! von #Y $indo_greek_revolt_one_name$#!."
 flavor_maurya_12_tooltip_B: "Gib #Y Maurya# auf! und spiele weiterhin als #Y Indo-Greek Kingdom#! von #Y $indo_greek_revolt_two_name$#!."
 flavor_maurya_12_tooltip_C: "Gib #Y Maurya# auf! und spiele weiterhin als #Y Indo-Greek Kingdom#! von #Y $indo_greek_revolt_three_name$#!."
 flavor_maurya_12_tooltip_D: "Gib #Y Maurya# auf! und spiele weiterhin als #Y Indo-Greek Kingdom#! von #Y $indo_greek_revolt_four_name$#!."
 flavor_maurya_12_tooltip_E: "Gib #Y Maurya# auf! und spiele weiterhin als #Y Indo-Greek Kingdom#! von #Y $indo_greek_revolt_five_name$#!."
  
 flavor_maurya_13_title: "Shunga-Rebellion"
 flavor_maurya_13_desc: "Der Brief kam spät abends, von einem Boten gebracht, der nach der Übergabe vor Erschöpfung in Ihrem Palast zusammenbrach. Als Sie es zum ersten Mal öffneten, um den Inhalt zu lesen, zitterte Ihre Hand beim zweiten Absatz und Sie ließen es zu Boden fallen. Ihren eigenen Augen nicht trauend, befehlen Sie einem Ratgeber mit stockender Stimme, es laut vorzulesen. Bei jedem Wort pocht dir das Blut in den Ohren; Ihr Freund Pushyamitra Shunga, einer unserer ranghöchsten Militäroffiziere, hat das Maurya-Königreich mit einem Akt des Verrats hintergangen. Er wagt es, sich zum Raja von ganz Nordindien zu erklären und hat eine Rebellion gegen uns begonnen. Aber noch schlimmer ist, dass ein Großteil unserer Armee bereits zu ihm übergelaufen ist! Wir sind buchstäblich von Feinden umgeben, die unser Verderben suchen. Wirklich, dies hätte für uns zu keinem schlechteren Zeitpunkt kommen können."
 flavor_maurya_13.a: "Das ist das Ende..."
 flavor_maurya_13.b: "Ein neuer Weg nach vorne, wie Shunga, wäre klug ..."
 flavor_maurya_13_tooltip: "#G Erhalte Zugang zum Missionsbaum der Maurya-Wiederbelebung#!"
 flavor_maurya_13_A_tooltip: "Gib #Y Maurya#! auf, spiele weiter als #Y Shunga#! und kämpfe den imperialen Herausforderungskrieg!"
  
 flavor_maurya_14_title: "Der Tod von Susima"
 flavor_maurya_14_desc: "Unsere Haupterbin, Susima Maurya, ist auf mysteriöse Weise gestorben. Die Palastwache hat den jungen Prinzen heute Morgen tot in seinen Gemächern gefunden, und unsere besten Heiler konnten nichts für ihn tun. Ermittlungen werden bereits durchgeführt, und die Schreie der verhörten Gefangenen hallen rund um die Uhr durch Ihren Palast, aber niemand scheint etwas gesehen oder gehört zu haben. Der plötzliche Mord an unserem Prinzen ist wirklich beunruhigend, und immer mehr Gerüchte über unzufriedene Gouverneure und Adelige verbreiten sich langsam am Hof. Es scheint, als ob Zeiten des Wandels vor uns liegen, ob wir wollen oder nicht."
 flavor_maurya_14.a: "Bonk!"
  
 flavor_maurya_16_title: "Mauryascher Zusammenbruch"
 flavor_maurya_16_desc: "Ashoka Maurya ist gestorben und hat das Maurya-Imperium in Unordnung gebracht. Intern wetteifern viele prominente Adlige um die Kontrolle über die Zügel des Staates, und diese intriganten Prinzen stiften große Spaltung unter unserem einst vereinten Volk. Es ist klar, dass das mächtige Maurya-Reich, das einst fast ganz Indien kontrollierte, nun kurz vor einem dramatischen Zusammenbruch steht – wer hätte so etwas vorhersehen können? Schon jetzt bereiten unsere vielen Feinde ihre Armeen vor ..."
 flavor_maurya_16.a: "Sehr interessant..."
 flavor_maurya.16.tt: "Länder, die an #Y [GetCountry('MRY').GetName]# grenzen! erhalten Zugang zum #Y Mauryan Collapse#! Kriegsziel, das die Eroberungskosten reduziert hat."
  
 flavor_maurya_17_title: "Indisch-griechische Wege"
 flavor_maurya_17_desc: "Das Maurya-Königreich war zu weit im Niedergang, um repariert zu werden, trotz der Bemühungen vieler, den Mantel für sich selbst zu beanspruchen. Anstatt zu versuchen, das, was zerbrochen bleiben sollte, neu zu schmieden, haben wir uns entschieden, ein neues Königreich zu schaffen, eines, das die Kulturen der vielen Völker umfasst, die unter unserem Banner leben. wir werden nicht versuchen, die erschütterte Legitimität der Maurya wieder zusammenzusetzen, sondern wir werden eine eigene indisch-griechische Dynastie schaffen, die mächtiger werden wird als alle, die uns vorangegangen sind."
 flavor_maurya_17.a: "Kapisa ist jetzt unser Zuhause"
 flavor_maurya_17.b: "Panchanada ist jetzt unser Zuhause"
 flavor_maurya_17.c: "Kuninda ist jetzt unser Zuhause"
 flavor_maurya_17.d: "Kaschmir ist jetzt unsere Heimat"
 flavor_maurya_17.e: "Sauvira ist jetzt unser Zuhause"
  
 flavor_maurya_18_title: "Die Shungan-Wege"
 flavor_maurya_18_desc: "Weise Männer und Philosophen argumentieren, dass alles Leben heilig ist und geschätzt werden muss, aber wenn die Herrschaft eines bösen Raja den unzähligen Seelen, für die sie verantwortlich sind, unsagbares Elend bringt, wird es zu einer heiligen Pflicht, den Täter zu töten und das Gleichgewicht der Schöpfung wiederherzustellen. Konnte ein wirklich gerechter Mensch eine solche Beleidigung von Göttern und Menschen ertragen, ohne zum Handeln aufgerufen zu werden? Unser Gründer, Pushyamitra Shunga, befand sich in dieser nicht beneidenswerten Position, wählte jedoch den Weg der Weisheit und befreite uns alle von der Tyrannei, die uns zerstörte. Während die dekadenten Maurya für ihre sündigen Wege bestraft werden, wird das Haus Shunga alle Autorität an sich reißen und ein eigenes mächtiges Königreich errichten."
 flavor_maurya_18.a: "Die Shunga-Dynastie wird für immer herrschen!"
  
 flavor_maurya_19_title: "Satavahana"
 flavor_maurya_19_desc: "Das maurische Reich ist zerfallen und in Zentralindien erhebt sich eine neue Macht; das Satavahana. Aus Angst vor unserem unvermeidlichen Aufstieg greifen uns unsere Feinde von allen Seiten an und hoffen, uns zu überwältigen, bevor wir uns etablieren können, aber unser Moment ist gekommen und wir werden erbittert um die Herrschaft über das Deccan-Plateau kämpfen. Jetzt ist die Zeit für Krieg, aber lasst es wissen, dass das Haus Satavahana eine Periode des Wohlstands einläuten wird, die es in ganz Indien noch nie zuvor gegeben hat!"
 flavor_maurya_19.a: "Die Satavahana-Dynastie wird für immer herrschen!"
  
 me_maurya_collapse_1_title: "Ashoka der Schreckliche"
 me_maurya_collapse_1_desc: "Es werden Geschichten über den Zorn von Ashoka erzählt; einige halten sie für absolut wahr, andere für falsch, aber selbst diejenigen, die sich über die Details lustig machen, wagen es nicht, ihn offen zu verspotten. Unser Raja hat die Ausschweifung angenommen; Ashoka füllt sich mit Delikatessen, ganzen Platten mit gebratenem Wild und gefüllten Pfauen, aber sein schrecklicher Hunger wird nicht durch Fleisch allein gestillt. In seinem Wahnsinn soll er seinen Ministern unmögliche Bitten gestellt haben, wie zum Beispiel jeden fruchttragenden Baum in ganz Indien zu fällen und diejenigen zu töten, die sich gegen seine seltsamen Befehle sträuben. Sogar seine eigenen Konkubinen sind vor seiner Hand nicht sicher; erst letzten Monat verbrannte er über fünfhundert zu Tode."
 me_maurya_collapse_1.a: "Verabscheuungswürdig..."
  
 me_maurya_collapse_2_title: "Ashoka der Große"
 me_maurya_collapse_2_desc: "Ashoka tut mit dem Eifer eines Neubekehrten alles in seiner Macht Stehende, um seine karmische Schuld zu begleichen, während er versucht, für seine Jahre der Grausamkeit zu büßen. Anstatt riesige Summen umzuleiten, um seinen ausschweifenden Appetit zu stillen, investiert der Raja mit einer beispiellosen Baukampagne in das Wohlergehen seines Volkes. Anstatt seinen Reichtum zu horten, werden die Ländereien mit Brunnen und Bewässerungsgräben befestigt, damit die Menschen nahrhafte Nahrung anbauen können. Schulen werden für die Ausbildung von Heilern gebaut, damit niemand unnötig leidet. In seiner Großzügigkeit beschränkt Ashoka diese Projekte nicht auf sein eigenes Kernland, sondern versucht, jeden in seinem riesigen Imperium zu versorgen – wir sind wirklich glücklich, einen so vernarrten Raja zu haben."
 me_maurya_collapse_2.a: "Phänomenal!"
  
 me_maurya_collapse_3_title: "Chandashoka"
 me_maurya_collapse_3_desc: "Die Bauern wiederholen eine Geschichte, die so lächerlich ist, dass sie amüsant sein könnte, aber wir werden sie Ihnen trotzdem berichten. Es wird gesagt, dass Ashoka in seinem immer größer werdenden Eifer tatsächlich in die Unterwelt gereist ist, um sich in den schwarzen Folterkünsten von Dämonen unterrichten zu lassen! Um dieses dunkle Wissen zu nutzen, hat er in Pataliputra einen ausgeklügelten Gefängniskomplex gebaut, den die Einheimischen Ashokas Hölle nennen, denn sobald Sie in ihre Eingeweide hinabsteigen, können die Götter selbst Sie nicht befreien. Ist es ein Wunder, dass der Raja Chandasoka, Ashoka der Wilde genannt wird?"
 me_maurya_collapse_3.a: "Ekelhaft..."
  
 me_maurya_collapse_4_title: "Kalingan-Zerstörung"
 me_maurya_collapse_4_desc: "Ihre blutbespritzte Waffe fällt aus Ihrer Hand und Sie sinken auf die Knie, vorübergehend von widersprüchlichen Empfindungen überwältigt. Der Kampf ist endlich beendet, aber er hatte einen schrecklichen Preis für die Menschen in Kalinga. Um dich herum die blutrünstigen Schreie verwundeter Tiere und Menschen; ein lautes, anhaltendes Heulen, das unheimlich über das Schlachtfeld schwebt und sich mit dem Rauch der brennenden Befestigungen vermischt. Dieses erbärmliche Geräusch durchdringt deine Seele - ist das einer deiner Soldaten, der stirbt? Einer der Feinde? Ist der Mensch nicht ein edles Geschöpf, das es verdient, ein Leben frei von den Wechselfällen des Schicksals zu führen? Wie kommt es, dass du, Ashoka der Große, in diesem Moment des Triumphs zögerst? Obwohl es seltsam ist, das zuzugeben, verspürst du einen scharfen Stich des Bedauerns für die Verwüstung, die du angerichtet hast. Ungebeten kommt Ihnen ein buddhistischer Grundsatz in den Sinn, der Sie überrascht ... wahre Stärke liegt im Mitgefühl. Du sprichst die Worte lautlos immer und immer wieder, während sich deine siegreiche Armee um dich versammelt."
 me_maurya_collapse_4.a: "I Have Had an Epiphany – Bekehre das Reich"
 me_maurya_collapse_4.b: "Maurya ist kein Buddhist!"
  
 me_maurya_collapse_5_title: "Samudra der Mönch"
 me_maurya_collapse_5_desc: "Ihre Majestät werden nicht glauben, worüber sie auf den Märkten sprechen, aber es ist wahr, alles wahr; Ich habe es mit eigenen Augen überprüft. Es scheint, dass der Sohn eines Kaufmanns, ein buddhistischer Mönch namens Samudra, wegen seiner Verbrechen zum Tode verurteilt worden war. Als die festgesetzte Stunde gekommen war, wurde er in den Bottich mit kochenden Exkrementen gelegt, aber – verzeihen Sie mir, mein Herr, aber ich wiederhole nur, was gesagt wurde – er ließ eine Lotusblume aus dem Schmutz erblühen, über die er friedlich meditierte. Unbeeindruckt von dieser wundersamen Darstellung versuchten unsere Gefängniswärter, ihn zu bestrafen, aber Samudra predigte ... und irgendwie entkam er. Aber er ist nicht weggelaufen! Er ging ins Zentrum der Stadt und begann zu schweben, wobei die Hälfte seines Körpers in Flammen und die andere in Wasser getränkt war. Samudra sagt, er sei kein Gott, sondern folge den Wegen des Buddha. Sollen wir diesen Wundertäter zum Reden rufen?"
 me_maurya_collapse_5.a: "Bringen Sie ihn vor Gericht"
 me_maurya_collapse_5.b: "Maurya ist kein Buddhist!"
  
 me_maurya_collapse_6_title: "Kollaps verhindert"
 me_maurya_collapse_6_desc: "Dank der harten Arbeit unseres unbezwingbaren Königs Ashoka konnte der Zusammenbruch des Maurya-Reiches verhindert werden. Ashoka verkörpert ein militaristisches und administratives Genie und hat sich als einer der größten Könige erwiesen, die Indien je gesehen hat. Unsere perfiden Gouverneure wollen uns nicht länger verraten und unser geliebtes Volk hat sein Vertrauen in uns zurückgewonnen. Jetzt, nachdem wir die Probleme in unserem Reich gelöst und unser Imperium gerettet haben, sind wir wieder frei, nach außen zu schauen. Wer weiß, was die Zukunft für das Maurya-Reich bringen wird?"
 me_maurya_collapse_6.a: "Gesegnet sei Ashoka"
  
