l_german:
  
 mauryan_collapse_prevention: "Kollaps verhindern"
 mauryan_collapse_prevention_DESCRIPTION: "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName] besteigt in einer schwierigen Zeit den Thron. Zwei unserer Rajas sind bei unglücklichen Ereignissen ums Leben gekommen und haben unser Land in einem Zustand des Niedergangs zurückgelassen. Viele politische Persönlichkeiten in unserem Reich sind illoyal und dienen nur ihren eigenen Interessen, indem sie uns ihre Eide aufgeben. Hinzu kommt, dass unsere Nachbarn uns wie hungrige Bestien ansehen, die auf ein Zeichen von Schwäche warten. Maurya darf nicht fallen. Maurya wird nicht fallen! . '#R Wenn [Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName] stirbt, bevor die Missionen abgeschlossen wurden, sind diese nicht mehr verfügbar und Maurya wird zusammenbrechen#!"
 mauryan_collapse_prevention_CRITERIA_DESCRIPTION: "Diese Mission wird abgeschlossen sein, wenn [Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName] seine Herrschaft gefestigt hat und die Position der Maurya-Dynastie sicher ist."
 mauryan_collapse_prevention_BUTTON_TOOLTIP: "Hoffentlich sind wir erfolgreich..."
 mauryan_collapse_prevention_BUTTON_DETAILS: ""
  
  #Mission Tasks 
 mauryan_collapse_prevention_task_1: "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName] der Große"
 mauryan_collapse_prevention_task_1_DESC: "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName] is the son of Bindusara and grandson of Chandragupta himself. He is of royal descendance and appears to be much more competent than his late father. And even though his rise to the throne has not been without blood, with him as our leader, we may survive these trying times."  <"None">  #NT!
 mauryan_collapse_prevention_task_2: "Konsolidiere Pracya"
 mauryan_collapse_prevention_task_2_desc: "Pracya ist seit langem der Sitz der Macht für uns. Die Wiederherstellung der Ordnung in unserem Kapital ist für unser Überleben unerlässlich."
 mauryan_collapse_prevention_task_3: "Chandashoka"
 mauryan_collapse_prevention_task_3_desc: "Ashoka regiert mit eiserner Faust. Er zeigt keine Gnade gegenüber seinen Feinden, egal ob sie aus fremden Ländern stammen oder aus seinem riesigen Reich stammen. Seine Mittel sind oft grausam, aber effizient. Viele nennen ihn hinter seinem Rücken Chandashoka, was Ashoka der Grausame bedeutet."
 mauryan_collapse_prevention_task_4: "Große Kampagnen von Ashoka"
 mauryan_collapse_prevention_task_4_desc: "Raja Ashoka wirkt nicht nur in Staatsangelegenheiten hochkompetent, sondern auch in Militärangelegenheiten. Er wird der Welt seine kriegerischen Fähigkeiten beweisen, damit sie alle unsere wahre Macht spüren."
 mauryan_collapse_prevention_task_5: "Die Zerstörung der Kalingas"
 mauryan_collapse_prevention_task_5_desc: "Kalinga liegt im Süden und hat lange versucht, unserer Hegemonie über Indien Widerstand zu leisten. Ashoka wird derjenige sein, der sie endlich vor uns niederknien lässt."
 mauryan_collapse_prevention_task_6: "Der buddhistische Mönch Samudra"
 mauryan_collapse_prevention_task_6_desc: "Die Bürger sprechen von einer höchst verdächtigen Person in unserer Stadt. Ein gewisser Mönch namens Samudra predigt unserem Volk seine Wege. Er könnte sich als Gefahr oder Chance erweisen."
 mauryan_collapse_prevention_task_7: "Beschwichtigen Sie die Gouverneure"
 mauryan_collapse_prevention_task_7_desc: "Ein Mann kann nicht ganz Maurya allein regieren. Viele andere werden benötigt, um das Reich in Ordnung zu halten. Und diese Menschen müssen bei Laune gehalten werden."
 mauryan_collapse_prevention_task_8: "Loyalität sichern"
 mauryan_collapse_prevention_task_8_desc: "Unsere Gouverneure sind zunehmend korrupt und illoyal geworden. Wir müssen ihr Vertrauen zurückgewinnen, wenn wir unser Imperium behalten wollen!"
 mauryan_collapse_prevention_task_9: "Kollaps verhindern"
 mauryan_collapse_prevention_task_9_desc: "Ashoka hat vielleicht das Unmögliche getan. Mit einem wahren Verständnis der Hofpolitik hat er unser Land stabilisiert. Die vergangenen Jahre waren hart, aber jetzt können wir diese Zeiten vielleicht hinter uns lassen."
 mauryan_collapse_prevention_task_10: "Unterstützen Sie den buddhistischen Glauben"
 mauryan_collapse_prevention_task_10_desc: "Der buddhistische Glaube ist derzeit nur ein kleiner Teil unserer Bevölkerung. Aber ihre Lehren sind für uns von unschätzbarem Wert. Die alten Götter haben uns im Stich gelassen und es ist an der Zeit, nach einem neuen Leuchtfeuer Ausschau zu halten."
  
