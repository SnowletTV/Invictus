 me_maurya_let_us_hope: "Hoffen wir, dass dies der Beginn einer großartigen Zusammenarbeit zwischen dem [SCOPE.sC('mry_offer_scope').GetAdjective] und dem maurischen Volk ist."
 me_mauryan_conventional_means: "[SCOPE.sC('mry_offer_scope').GetCapital.GetName] ist ein Preis, der mit konventionelleren Mitteln gewonnen werden muss."
  
 me_maurya_revival_1_title: "$mauryan_reconquest_task_3$: Unsere berechtigten Ansprüche"
 me_maurya_revival_1_desc: "Die Leute von Satavahana haben den Moment unserer Schwäche genutzt, um ihre Unabhängigkeit von uns wiederzuerlangen. Wir konnten wegen dringenderer Angelegenheiten in unserem Reich nicht sofort handeln, aber jetzt konnten wir versuchen, sie wieder zur Unterwerfung zu zwingen. Damit würden wir unserem Volk und dem Rest Indiens zeigen, dass wir keine Schwächlinge sind!"
 me_maurya_revival_1.a: "Senden Sie das Ultimatum!"
 me_maurya_revival_1.at: "#Y Satavahana#! unser Angebot zur Rückgabe unserer berechtigten Ansprüche annehmen könnte."
 me_maurya_revival_1.b: "Wir haben größere Sorgen."
  
 me_maurya_revival_2_title: "$mauryan_reconquest_task_3$: Mauryan Forderungen"
 me_maurya_revival_2_desc: "Von Maurya erreichen uns beunruhigende Neuigkeiten. Ihr neu gekrönter Herrscher, der hofft, seine Legitimität auf unsere Kosten zu etablieren, versucht, den großen Mann zu spielen, und fordert die Rückgabe ihres verlorenen Landes. Wir haben jedoch Berichte gehört, dass sie tatsächlich schwach und möglicherweise nicht mehr so ​​kompetent sind wie früher ... dieser sogenannte Raja ist kein Chandragupta."
 me_maurya_revival_2.a: "Gib ihnen, was sie wollen."
 me_maurya_revival_2.at: "Wir geben #Y Maurya#! ihre berechtigten Ansprüche zurück."
 me_maurya_revival_2.b: "Wenn es Krieg ist, wollen sie..."
 me_maurya_revival_2.bt: "Dies kann zu #R War# führen!..."
  
 me_maurya_revival_3_title: "$mauryan_reconquest_task_3$: Satavahana akzeptiert"
 me_maurya_revival_3_desc: "Glorreiche Neuigkeiten wurden von unseren Diplomaten zurückgebracht, die wir nach Satavahana geschickt haben! Sie haben unsere rechtmäßigen Ansprüche auf das Land akzeptiert und werden sich uns nicht entgegenstellen. Dies ist wirklich ein großartiges Ergebnis der Ereignisse, denn jetzt können wir unsere ganze Aufmerksamkeit auf dringendere Angelegenheiten richten."
 me_maurya_revival_3.a: "Für das Maurya-Reich!"
  
 me_maurya_revival_4_title: "$mauryan_reconquest_task_3$: Satavahana lehnt ab"
 me_maurya_revival_4_desc: "Mein Raja, es scheint, als hätte Satavahana unseren Vorschlag zur Rückgabe unserer Gebiete abgelehnt. Dieser Verrat kann natürlich nicht ohne Strafe bleiben. Allerdings sind wir derzeit nicht so stark, wie wir sein möchten. Wir müssen wirklich sorgfältig abwägen, ob wir unsere Gebiete mit Gewalt einnehmen oder uns zurückziehen wollen, um an einem anderen Tag zu kämpfen. In unserem Staat können wir uns keine Fehltritte leisten. Was ist Ihr Befehl?"
 me_maurya_revival_4.a: "Dann ist Krieg!"
 me_maurya_revival_4.b: "Wir können uns keinen Krieg leisten..."
  
 me_maurya_revival_5_title: "$mauryan_reconquest_task_4$: Ein friedliches Angebot?"
 me_maurya_revival_5_desc: "Wir müssen entscheiden, wie wir an die Frage der Zusammenarbeit herangehen wollen."
 me_maurya_revival_5.a: "Wir schicken ihnen das Angebot!"
 me_maurya_revival_5.at: "$me_maurya_more_likely_to_succeed$ [SCOPE.sC('mry_offer_scope').GetName] ist schwach und isoliert."
 me_maurya_revival_5.b: "Senden Sie ihnen ein Bestechungsgeld für die Unterwerfung."
 me_maurya_revival_5.bt: "$me_maurya_more_likely_to_succeed$ das [SCOPE.sC('mry_offer_scope').GetRulerTitle] von [SCOPE.sC('mry_offer_scope').GetName] ist korrupt oder unbeständig."
 me_maurya_revival_5.c: "Krieg ist die einzige Option!"
 me_maurya_revival_5.ct: "Wir werden Ansprüche in allen #Y Indo-Griechischen Königreichen # erlangen!."
  
 me_maurya_revival_6_title: "$mauryan_reconquest_task_4$: Mauryaisches Angebot"
 me_maurya_revival_6_desc: "Die herrschsüchtigen Schnupftabaks von Maurya sind mit einem Angebot vor den Toren von [ROOT.GetCountry.GetCapital.GetName] erschienen. Obwohl Ihre anfängliche Neigung darin besteht, sie nach Hause zu schicken, beschließen Sie, sich anzuhören, was sie zu sagen haben."
 me_maurya_revival_6_desc_1: "Die Abgesandten von Maurya wollen eigentlich gar nichts diskutieren und stellen uns mit kalten, unverblümten Worten eine Reihe von Forderungen. Sie finden unsere anhaltende Unabhängigkeit einen unerträglichen Zustand und erklären, dass wir ihnen Tribut zollen müssen. \n \nIhre Grabboten warten sogar jetzt ungeduldig auf unsere Antwort ..."
 me_maurya_revival_6_desc_2: "Sie verlangten eine Privataudienz bei [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] und unterhalten sich nun seit einigen Stunden heimlich in ihrem Zelt mit [ROOT.GetCountry.GetRuler.GetHerHim]. \n \nSie müssen versuchen, unseren Anführer zu korrumpieren – Mauryaner nehmen kein unnötiges Blatt vor den Mund."
 me_maurya_revival_6.a: "Welche Wahl haben wir?"
 me_maurya_revival_6.b: "'[ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen], warum so glücklich?'"
 me_maurya_revival_6.c: "Wie können es diese Köter wagen?! Die Galle!"
 me_maurya_revival_6_C_tooltip: "#Y Maurya#! Ansprüche auf alle unsere Provinzen bekommen"
  
 me_maurya_revival_7_title: "$mauryan_reconquest_task_4$: [SCOPE.sC('mry_offer_scope').GetAdjective] Antwort"
 me_maurya_revival_7_desc_1: "[SCOPE.sC('mry_offer_scope').GetName] waren von unseren Drohungen sehr betroffen und entschieden, dass ihre Freiheit keinen Krieg mit Maurya wert war. \n \n$me_maurya_let_us_hope$"
 me_maurya_revival_7_desc_2: "[SCOPE.sC('mry_offer_scope').GetRuler.GetName] nahm unser persönliches Angebot an und brachte [SCOPE.sC('mry_offer_scope').GetName] friedlich in unsere Hände. \n \n$me_maurya_let_us_hope$."
 me_maurya_revival_7_desc_3: "Hochmütig [SCOPE.sC('mry_offer_scope').GetName] reagierte auf unser Angebot, indem er unsere Ehre mit der einer Reihe unerwünschter Tiere verglich. Ich wage nicht zu wiederholen, was sie genau gesagt haben. \n \n$me_mauryan_conventional_means$"
 me_maurya_revival_7.a: "Ein wenig sanfte Überzeugungsarbeit funktioniert immer."
 me_maurya_revival_7.b: "Natürlich taten sie es."
 me_maurya_revival_7.c: "Sie werden diesen Tag bereuen."
 me_maurya_revival_7.ct: "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! erhält Ansprüche auf alle Provinzen von #Y [SCOPE.sC('mry_offer_scope').GetName]#!"
  
 me_maurya_revival_8_title: "Dravidische Kolonien"
 me_maurya_revival_8_desc: "Wir haben beschlossen, einige Siedler nach Dravidia zu schicken. Sie werden für uns das maurische Banner hochhalten, Beziehungen zur lokalen Bevölkerung aufbauen und für die Sicherheit der Region sorgen. Wir sind uns jedoch noch nicht sicher, wie viele Kolonien wir gründen sollen. Was ist Ihr Befehl?"
 me_maurya_revival_8.a: "Zwei Kolonien, übertreiben wir es nicht"
 me_maurya_revival_8.b: "Drei Kolonien scheinen angemessen"
 me_maurya_revival_8.c: "Vielleicht vier Kolonien?"
 me_maurya_revival_8.d: "Fünf Kolonien, eine für jeden Finger unserer eisernen Faust"
  
 me_maurya_revival_9_title: "Spezialisierung auf dravidische Kolonien"
 me_maurya_revival_9_desc: "Die von uns ausgesandten Siedler haben die Gründung der Kolonien erfüllt. Nun stehen wir vor der Frage der Spezialisierung; Wofür sollen die Kolonien von Dravidia bekannt sein?"
 me_maurya_revival_9.a: "Wir müssen unsere militärischen Fähigkeiten ausbauen"
 me_maurya_revival_9.b: "Infrastruktur wird sich als wichtig erweisen"
 me_maurya_revival_9.c: "Die Götter kennen den Weg!"
 me_maurya_revival_9.d: "Lassen Sie uns unseren Handel ausbauen"
  
 me_maurya_revival_10_title: "Dravidische Kolonien"
 me_maurya_revival_10_desc: "Wir haben beschlossen, einige Siedler nach Dravidia zu schicken. Neben dem Aufbau von Beziehungen zur lokalen Bevölkerung werden sie die Sicherheit der Region sichern und unseren Wohlstand dort sichern. Wir sind uns jedoch noch nicht sicher, wie viele Kolonien wir gründen sollen. Was sollen wir tun?"
 me_maurya_revival_10.a: "Zwei Kolonien, wir brauchen unsere Völker hier."
 me_maurya_revival_10.b: "Drei Kolonien, meine Glückszahl!"
 me_maurya_revival_10.c: "Vier Kolonien, obendrein."
 me_maurya_revival_10.d: "Fünf Kolonien, lass uns All-in gehen" #nt!
  
 me_maurya_revival_11_title: "Dravidische Kolonie-Spezialisierung"
 me_maurya_revival_11_desc: "Die von uns ausgesandten Siedler haben die Gründung der Kolonien erfüllt. Nun stehen wir vor der Frage der Spezialisierung; Wir sollten sie anweisen, sich in eine Richtung zu konzentrieren, damit unsere Kräfte wachsen können."
 me_maurya_revival_11.a: "Wir müssen unsere militärischen Fähigkeiten ausbauen"
 me_maurya_revival_11.b: "Infrastruktur wird sich als wichtig erweisen"
 me_maurya_revival_11.c: "Die Götter kennen den Weg!"
 me_maurya_revival_11.d: "Lasst uns unseren Handel ausbauen"
  
