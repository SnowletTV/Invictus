l_german:
  
  #################### 
  # Title 
  #################### 
  
 nuragic_mission_01_inv: "Die Rückeroberung der Nuraghen-Heimat"
 nuragic_mission_01_inv_DESCRIPTION: "So lange die Sonne ihren Weg in den himmlischen Reichen zurückgelegt hat, hat unser Volk ein einfaches und ereignisloses Leben geführt, unser Vermögen schwankte und floss wie das uns umgebende Ozeanwasser. Während einige über unsere Art spotten und uns Barbaren nennen, waren wir zufrieden mit dem, was wir unser Eigen nennen mussten. \n \nDies hat sich mit der Ankunft der Karthager geändert, die die Südküste unserer Insel für sich erobert haben. Ihre Diplomaten haben unmissverständlich klar gemacht, dass unsere bergigen Heimatländer nicht sicher vor ihren einfallenden Armeen sind, aber wir haben eine andere Vorstellung von unserer Zukunft."
 nuragic_mission_01_inv_CRITERIA_DESCRIPTION: "Diese Mission gilt als abgeschlossen, wenn wir die Ausländer von unserer Insel vertrieben und sie für uns zurückerobert haben."
 nuragic_mission_01_inv_BUTTON_TOOLTIP: "Wir müssen die Eindringlinge aus unserer Heimat vertreiben und sie für uns zurückerobern."
 nuragic_mission_01_inv_BUTTON_DETAILS: ""
  
  #################### 
  # Mission Tasks 
  #################### 
  
  
 nuragic_mission_01_inv_1_task: "Versammlung der Stammesältesten"
 nuragic_mission_01_inv_1_task_DESC: "Bevor wir irgendwelche Schritte gegen die Ausländer unternehmen, müssen wir zuerst einen Konsens unter unseren Stammesbrüdern erzielen. Wir können dies nicht alleine tun; wir müssen unsere Kräfte vereinen, wenn wir Hoffnung auf Erfolg haben. Sendet den Nachbarstämmen Nachricht, dass ein Rat abgehalten wird!celt_mil3!"
  
 nuragic_mission_01_inv_2_task: "Sicherung der Reserven"
 nuragic_mission_01_inv_2_task_DESC: "Wenn wir hoffen können, im Feld zu gewinnen, müssen unsere Soldaten gut ernährt und jederzeit kampfbereit sein, denn Hunger ist ein allgegenwärtiger Feind, dem man nur schwer entkommen kann. Sobald uns die Mittel zur Verfügung stehen, sollten wir eine Bauernsiedlung bauen und so viel Getreide importieren, wie wir lagern können.@celt_mil14!"
  
 nuragic_mission_01_inv_3_task: "Stelle die Nuraghe wieder her"
 nuragic_mission_01_inv_3_task_DESC: "In schwierigen Zeiten zogen sich unsere Vorfahren in die von ihnen errichteten Festungstürme, die Nuraghen, zurück und warteten auf günstige Zeiten, um von diesen Positionen der Stärke aus gegen ihre Feinde vorzugehen. Bevor wir unsere eigenen Kriege führen, müssen wir die alten Sitten ehren und sicherstellen, dass die Nuraghen befestigt und ausreichend mit Vorräten versorgt sind.@celt_mil8!"
  
 nuragic_mission_01_inv_4_task: "Die erste Stadt, die fällt"
 nuragic_mission_01_inv_4_task_DESC: "Es gibt eine Stadt im Norden, die die Karthager [GetProvince('(int32)3504').GetName] genannt haben, die relativ isoliert ist ... dies wird die erste sein, die unseren Armeen zum Opfer fällt. Da wir keine eigenen Städte haben, hoffen wir, [GetProvince('(int32)3504').GetName] als Operationsbasis für die Zukunft zu nutzen, daher ist es von entscheidender Bedeutung, dass wir schließlich die Infrastruktur dort entwickeln.@event_pic4!"
  
 nuragic_mission_01_inv_5_task: "Abschließen der Hintertür"
 nuragic_mission_01_inv_5_task_DESC: "Die Leichtigkeit der Kreuzung bei [GetProvince('(int32)3506').GetName] ist jedem bekannt; Es ist eine triviale Sache für eine Armee aus Korsika, über die Gewässer zu segeln, und weil wir es ablehnen, jemandem einen so einfachen Zugang zu unserer Insel zu ermöglichen, müssen wir Maßnahmen ergreifen, um dies zu verhindern. Aber zuerst müssen wir die Korser vertreiben, die sich derzeit auf unserer Insel befinden ...@greek_mil1!"
  
 nuragic_mission_01_inv_6_task: "Ein Standbein in Phikaria"
 nuragic_mission_01_inv_6_task_DESC: "Träume von fremden Eroberungen sind das Letzte, womit wir uns verstricken wollen, aber alle können die Klugheit einsehen, den Hafen von [GetProvince('(int32)3508').GetName] für unsere eigenen Zwecke zu sichern. Außerdem wollen wir die Korser nicht gedeihen sehen, schon gar nicht auf unsere Kosten.@egypt_mil6!"
  
 nuragic_mission_01_inv_7_task: "Augen auf die Hügel"
 nuragic_mission_01_inv_7_task_DESC: "Ein klarer Vorteil, den wir gegenüber den Ausländern haben, ist, dass wir diese Länder gut kennen, obwohl sie nur Eindringlinge sind. Wir können unsere Geländekenntnisse zu unserem Vorteil nutzen und unsere Männer durch schwieriges Gelände schicken, um ihre Truppenbewegungen im Auge zu behalten. \n \nDie Räuber, die in den Bergen leben, sind erfahrene Spurenleser; wir sollten eine Amnestie ankündigen, wenn sie bereit sind, uns zu helfen.@celt_mil7!"
  
 nuragic_mission_01_inv_8_task: "Opfer für die Götter des Krieges"
 nuragic_mission_01_inv_8_task_DESC: "Es gibt geheime Wege, die unseren Schamanen bekannt sind, wodurch unsere Siege über unsere Feinde so gut wie sicher sind ... der Preis, den die Götter des Todes verlangen, ist jedoch hoch; Sie sind nur mit Blut zufrieden.@celt_mil15!"
  
 nuragic_mission_01_inv_9_task: "Der Hafen von [GetProvince('(int32)3494').GetName]"
 nuragic_mission_01_inv_9_task_DESC: "Obwohl das Land selbst bisher relativ unerschlossen ist, betrachten die Karthager den Hafen von [GetProvince('(int32)3494').GetName] als lebenswichtig für ihre Nachschubbemühungen, und aus diesem Grund können wir ihnen nicht länger erlauben, diesen Ort zu kontrollieren.@greek_mil4!"
  
 nuragic_mission_01_inv_10_task: "Die Zerstörung von [GetProvince('(int32)3481').GetName]"
 nuragic_mission_01_inv_10_task_DESC: "Wie Tiere in einem Blutrausch können unsere Soldaten, gestärkt durch ihre jüngsten Erfolge im Feld, den Untergang der Eindringlinge spüren und verlangen, dass wir nach [GetProvince('(int32)3481').GetName] vordringen, zweifellos begierig nach den reichen Schätzen, die angeblich innerhalb seiner Mauern aufbewahrt werden . Unsere Männer werden sich mit nichts weniger als der vollständigen Zerstörung der Stadt begnügen.@greek_mil15!"
  
 nuragic_mission_01_inv_11_task: "Karalisches Ackerland"
 nuragic_mission_01_inv_11_task_DESC: "Wirklich, wir haben nur wenige Orte wie [GetProvince('(int32)3484').GetName] gesehen; eine Stadt, umgeben von fruchtbaren Weinbergen, von der Sonne geküsst und wo das wahre Glück lebt. Alle, die an dieser Stadt vorbeikommen, wünschen sich ein Ende ihrer Reisen, sehnen sich danach, auf unseren Anwesen zu bleiben und die Delphine beim Spielen im Wasser des Mare Tyrrhenum zu beobachten. Wir werden Karali kultivieren und es ungeachtet der Kosten zu einer großartigen Stadt machen.@greek_mil16!"
  
 nuragic_mission_01_inv_12_task: "Eine südliche Hauptstadt"
 nuragic_mission_01_inv_12_task_DESC: "Nachdem wir die unbestrittenen Herren unserer Insel geworden sind und unsere Autorität von den nördlichen Schanzen bis zu den südlichsten Städten anerkannt ist – tatsächlich gehört ganz Sardinien uns – kann man mit Sicherheit sagen, dass eine neue Ära angebrochen ist, eine, in der die Nuraghen leben werden eine eigene Heimat haben.@greek_mil19!"
  
 nuragic_mission_01_inv_13_task: "Erobern Sie die Schiffe"
 nuragic_mission_01_inv_13_task_DESC: "Jetzt, da wir es geschafft haben, uns eine Hafenstadt zu sichern, sollten wir sofort den Bau einer Flotte in Betracht ziehen. Zu unserem Glück ließ der Feind in seiner Eile, die Region zu räumen, einige Schiffe zurück, die sich in anständigem Zustand befinden. es würde nicht viel brauchen, um sie wieder funktionsfähig zu machen.@egypt_mil21!"
  
 nuragic_mission_01_inv_14_task: "Ein blindes Auge für Piraterie"
 nuragic_mission_01_inv_14_task_DESC: "Obwohl es viele Jahre her ist, dass wir Kontakt zu unseren Cousins ​​hatten, haben wir von den schrecklichen Piraten von Mago gehört ... vielleicht möchten sie uns für eine Weile besuchen kommen?@egypt_mil24!"
  
 nuragic_mission_01_inv_16_task: "Alte Gäste"
 nuragic_mission_01_inv_16_task_DESC: "Obwohl es zunächst wie eine gute Idee schien, gehen die Talaiotic Pirates, die wir eingeladen haben, sich in [GetProvince('(int32)3494').GetName] niederzulassen, rücksichtslos über die lokale Bevölkerung, eine Situation, die auf lange Sicht unhaltbar ist. Wir müssen drastische Maßnahmen ergreifen, bevor es zu spät ist.@greek_mil18!"
  
 nuragic_mission_01_inv_17_task: "The Mines Of Palma"  <"Die Minen von Palma">  #NT!
 nuragic_mission_01_inv_17_task_DESC: "Now that we have conquered [GetProvince('(int32)1465').GetName], we should dismantle the settlements of the #E Balearics#! and build a mine instead - those fools were literally sitting on top of a gold mine. \n\n\n\n\n\n\n\n\n\n@greek_mil18!"  <"None">  #NT!
  
 nuragic_mission_01_inv_18_task: "Settle [GetProvince('(int32)3510').GetName]"  <"Begleiche [GetProvince('(int32)3510').GetName]">  #NT!
 nuragic_mission_01_inv_18_task_DESC: "If we are able to capture the city of [GetProvince('(int32)3515').GetName], then we will be able to use the wealth of that rich region to fund construction in [GetProvince('(int32)3510').GetName]. \n\n\n\n\n\n\n\n\n\n@event_pic9!"  <"Wenn es uns gelingt, die Stadt [GetProvince('(int32)3515').GetName] zu erobern, können wir den Reichtum dieser reichen Region zur Finanzierung des Baus in [GetProvince('(int32)3510').GetName] nutzen. \n\n\n\n\n\n\n\n\n\n@event_pic9!">  #NT!
  
 nuragic_mission_01_inv_19_task: "Strait Of Taphros"  <"Straße von Taphros">  #NT!
 nuragic_mission_01_inv_19_task_DESC: "Developing the cities around Taphros will induce a newer trade influx among our strait, thus enabling our local marketplaces to prosper and thrive.\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"  <"Die Entwicklung der Städte rund um Taphros wird zu einem neueren Handelszustrom in unsere Meerenge führen und so unseren lokalen Marktplätzen ermöglichen, zu gedeihen und zu gedeihen.\n\n\n\n\n\n\n\n\n\n@egypt_mil24!">  #NT!
  
 nuragic_mission_01_inv_20_task: "The Grain Of Nurrensia"  <"Das Korn von Nurrensia">  #NT!
 nuragic_mission_01_inv_20_task_DESC: "The plains of Nurrensia, located in the north-western part of Sardinia, are notorious for the fertility of the soil and a mild climate. [GetProvince('(int32)3496').GetName] is suitable for cultivating a large network of the finest wheat varieties we are able to grasp - our people will excavate enough canals and wells to bring the water we need for the future granary of our civilization.\n\n\n\n\n\n\n\n\n\n@celt_mil14!"  <"Die Ebenen von Nurrensia, im Nordwesten Sardiniens gelegen, sind bekannt für die Fruchtbarkeit des Bodens und ein mildes Klima. [GetProvince('(int32)3496').GetName] eignet sich für den Anbau eines großen Netzwerks der besten Weizensorten, die wir begreifen können – unsere Leute werden genügend Kanäle und Brunnen ausheben, um das Wasser zu liefern, das wir für die zukünftige Kornkammer unserer Zivilisation benötigen.\n\n\n\n\n\n\n\n\n\n@celt_mil14!">  #NT!
  
 nuragic_mission_01_inv_21_task: "Raze The Foreigns"  <"Zerstöre die Ausländer">  #NT!
 nuragic_mission_01_inv_21_task_DESC: "For generations, we watched from our high places. We endured. The mountain bred in us patience, and the knowledge that even iron breaks if bent long enough. Their mines poison the earth. Their outposts grow fat and arrogant. Their temples speak false tongues. And yet they believe us broken, scattered—content to haunt the forests and heights like ghosts. They have forgotten who we are.\n\n\n\n\n\n\n\n\n\n@celt_mil16!"  <"Über Generationen hinweg haben wir von unseren Höhen aus zugeschaut. Wir haben es ausgehalten. Der Berg hat in uns Geduld geweckt und das Wissen, dass sogar Eisen bricht, wenn es lange genug gebogen wird. Ihre Minen vergiften die Erde. Ihre Außenposten werden fett und arrogant. Ihre Tempel reden falsche Zungen. Und doch glauben sie, dass wir zerbrochen und zerstreut sind und uns damit zufrieden geben, wie Geister durch die Wälder und Höhen zu spuken. Sie haben vergessen, wer wir sind.\n\n\n\n\n\n\n\n\n\n@celt_mil16!">  #NT!
  
 nuragic_mission_01_inv_22_task: "Build A Fleet"  <"Bauen Sie eine Flotte auf">  #NT!
 nuragic_mission_01_inv_22_task_DESC: "The Sardan spirit yearns not only for stone underfoot, but for the taste of brine on the wind and the creak of a mast under sky. We were not born to be penned in mountains, watching from afar as foreigners feast on the wealth of our island and steer their ships through our waters as if we were gone from the world.\n\nNo more.\n\n\n\n\n\n\n\n\n\n@greek_mil11!"  <"Der sardische Geist sehnt sich nicht nur nach Steinen unter seinen Füßen, sondern auch nach dem Geschmack von Salzlake im Wind und dem Knarren eines Mastes unter dem Himmel. Wir wurden nicht dafür geboren, in Bergen eingesperrt zu sein und aus der Ferne zuzusehen, wie Ausländer sich am Reichtum unserer Insel erfreuen und ihre Schiffe durch unsere Gewässer steuern, als ob wir von der Welt verschwunden wären.\n\nNicht mehr.\n\n\n\n\n\n\n\n\n\n@greek_mil11!">  #NT!
  
 nuragic_mission_01_inv_23_task: "Aim To Corsica"  <"Ziel ist Korsika">  #NT!
 nuragic_mission_01_inv_23_task_DESC: "The sea between Sardinia and Corsica has always been narrow—but never has it felt narrower than now. On clear days, we can see the peaks of our sister isle from our northern shores, rising proud and defiant against the sky. That land is not foreign to us. It is not strange. It is ours—not by conquest, but by blood.\n\nFor in the highlands of Corsica dwell our brothers, our kin—those who share the tongue of the towers and the rites of the old god. Long have they endured beneath the shadow of the #E Etruscans#!, a people of cunning trade who came not to coexist, but to dominate. Their garrisons line the plains of Alalia, their merchants plunder the forests, their chains press against the necks of free men.\n\nThis must end. \n\n\n\n\n\n\n\n\n\n@celt_mil6!"  <"Das Meer zwischen Sardinien und Korsika war schon immer schmal – aber noch nie fühlte es sich schmaler an als jetzt. An klaren Tagen können wir von unserer Nordküste aus die Gipfel unserer Schwesterinsel sehen, die stolz und trotzig in den Himmel ragen. Dieses Land ist uns nicht fremd. Es ist nicht seltsam. Es gehört uns – nicht durch Eroberung, sondern durch Blut.\n\nDenn im Hochland von Korsika wohnen unsere Brüder, unsere Verwandten – diejenigen, die die Sprache der Türme und die Riten des alten Gottes teilen. Lange standen sie im Schatten der #E Etrusker#!,, eines Volkes mit raffiniertem Handel, das nicht kam, um zusammenzuleben, sondern um zu dominieren. Ihre Garnisonen säumen die Ebenen von Alalia, ihre Kaufleute plündern die Wälder, ihre Ketten drücken sich um die Hälse freier Männer.\n\nDas muss ein Ende haben. \n\n\n\n\n\n\n\n\n\n@celt_mil6!">  #NT!
  
 nuragic_mission_01_inv_24_task: "The Tip Of Corsica"  <"Die Spitze Korsikas">  #NT!
 nuragic_mission_01_inv_24_task_DESC: "On the northeast tip of the island—where once only rocks, wind, and scattered Etruscan outposts stood—we have laid the foundation of a great harbor. It is not merely a place for ships to rest; it is a blade thrust into the sea, pointing toward the very heart of Etruria. \n\n\n\n\n\n\n\n\n\n@italic_mil15!"  <"An der Nordostspitze der Insel – wo einst nur Felsen, Wind und vereinzelte etruskische Außenposten standen – haben wir den Grundstein für einen großen Hafen gelegt. Es ist nicht nur ein Rastplatz für Schiffe; Es ist eine ins Meer gestoßene Klinge, die auf das Herz Etruriens zeigt. \n\n\n\n\n\n\n\n\n\n@italic_mil15!">  #NT!
  
 nuragic_mission_01_inv_25_task: "Fate of Alalia"  <"Schicksal von Alalia">  #NT!
 nuragic_mission_01_inv_25_task_DESC: "Once a proud port under the yoke of the #E Etruscans#!, it now lies silent beneath the banners of the Sardan. Her walls are blackened with the fire of our siege, her gates torn from their hinges by our war cries, her towers bearing the scars of freedom hard-won. The Etruscan garrison lies broken or scattered across the hills. The harbor, once filled with their sleek ships, now carries only the scent of smoke and salt. \n\n\n\n\n\n\n\n\n\n@italic_mil3!"  <"Einst ein stolzer Hafen unter dem Joch der #E Etrusker#!,, liegt er nun still unter den Bannern der Sardan. Ihre Mauern sind vom Feuer unserer Belagerung geschwärzt, ihre Tore sind durch unser Kriegsgeschrei aus den Angeln gerissen, ihre Türme tragen die Narben der hart erkämpften Freiheit. Die etruskische Garnison liegt zersplittert oder verstreut über die Hügel. Der Hafen, einst voller eleganter Schiffe, riecht nur noch nach Rauch und Salz. \n\n\n\n\n\n\n\n\n\n@italic_mil3!">  #NT!
  
 nuragic_mission_01_inv_26_task: "Develop The North"  <"Entwickeln Sie den Norden">  #NT!
 nuragic_mission_01_inv_26_task_DESC: "With sword and fire, with oath and stone, we have brought unity to the north. For too long, the northern lands of Sardinia were a fractured realm—picked apart by petty Balarian and Corsian kings who crowned themselves in the dark.\n\nYet victory is the beginning, not the end. The northern coasts are wild and empty, their harbors forgotten, their fields overgrown. Great potential lies buried beneath neglect. If we do not build, if we do not settle, if we do not restore what has been lost—then the blood we've spilled will have been for nothing. \n\n\n\n\n\n\n\n\n\n@italic_mil9!"  <"Mit Schwert und Feuer, mit Eid und Stein haben wir dem Norden Einheit gebracht. Zu lange waren die nördlichen Länder Sardiniens ein zersplittertes Reich – auseinandergerissen von kleinen balarianischen und korsischen Königen, die sich im Dunkeln krönten.\n\nDoch der Sieg ist der Anfang, nicht das Ende. Die Nordküsten sind wild und leer, ihre Häfen vergessen, ihre Felder überwuchert. Großes Potenzial liegt unter der Vernachlässigung verborgen. Wenn wir nicht aufbauen, wenn wir uns nicht einigen, wenn wir nicht wiederherstellen, was verloren gegangen ist – dann wird das Blut, das wir vergossen haben, umsonst gewesen sein. \n\n\n\n\n\n\n\n\n\n@italic_mil9!">  #NT!
  
 nuragic_mission_01_inv_27_task: "Develop The South"  <"Entwickeln Sie den Süden">  #NT!
 nuragic_mission_01_inv_27_task_DESC: "There was a time when the southern of Sardinia—what we call Iliensia—were the heart of our people's power. Before the coming of the Carthaginians, before the rise of foreign altars and foreign laws, these lands were Sardan to their very bone. From the salt of Sulki to the deep harbors of Karali, from the plains of [GetProvince('(int32)3493').GetName] to the sacred stones of Nura, our ancestors ruled not with gold nor decree, but with presence, strength, and wisdom carved in Nuraghe and temple alike. \n\n\n\n\n\n\n\n\n\n@italic_mil30!"  <"Es gab eine Zeit, in der der Süden Sardiniens – das, was wir Iliensia nennen – das Herz der Macht unseres Volkes war. Vor der Ankunft der Karthager, vor der Entstehung fremder Altäre und fremder Gesetze waren diese Länder bis auf die Knochen Sardans. Vom Salz von Sulki bis zu den tiefen Häfen von Karali, von den Ebenen von [GetProvince('(int32)3493').GetName] bis zu den heiligen Steinen von Nura regierten unsere Vorfahren nicht mit Gold oder Dekreten, sondern mit Präsenz, Stärke und Weisheit, die gleichermaßen in Nuraghen und Tempel gemeißelt waren. \n\n\n\n\n\n\n\n\n\n@italic_mil30!">  #NT!
  
 nuragic_mission_01_inv_28_task: "Lesitanian Mines"  <"Lesitanische Minen">  #NT!
 nuragic_mission_01_inv_28_task_DESC: "With [GetProvince('(int32)3502').GetName] under our banner once more, the mines must live again. Not merely for gold or glory, but because they are ours. They are part of what once made Sardinia feared and respected—from the Pillars of the World to the lands of Peleset. To leave them dormant is to betray what was given to us by the mountain and the underworld alike. \n\n\n\n\n\n\n\n\n\n@italic_mil24!"  <"Da [GetProvince('(int32)3502').GetName] wieder unter unserem Banner steht, müssen die Minen wieder leben. Nicht nur wegen Gold oder Ruhm, sondern weil sie uns gehören. Sie sind Teil dessen, was Sardinien einst gefürchtet und respektiert hat – von den Säulen der Welt bis zu den Ländern Peleset. Sie ruhen zu lassen bedeutet, zu verraten, was uns der Berg und die Unterwelt gleichermaßen gegeben haben. \n\n\n\n\n\n\n\n\n\n@italic_mil24!">  #NT!
  
 nuragic_mission_01_inv_29_task: "Karensian Harbor"  <"Karensischer Hafen">  #NT!
 nuragic_mission_01_inv_29_task_DESC: "[GetProvince('(int32)3489').GetName] has long stood as a lonely outpost, lashed by waves and forgotten by time. Its cliffs once hosted a simple watchpost, a beacon against raiders and pirates who crossed the narrow sea. But those days are gone. The world grows more connected. Trade flows faster, and with it comes danger, ambition, and opportunity. If the eastern shore is left untended, it will be others—not us—who shape its fate.\n\nA harbor must rise in [GetProvince('(int32)3489').GetName]. \n\n\n\n\n\n\n\n\n\n@italic_mil4!"  <"[GetProvince('(int32)3489').GetName] war lange Zeit ein einsamer Außenposten, von Wellen gepeitscht und von der Zeit vergessen. Auf seinen Klippen befand sich einst ein einfacher Wachposten, ein Leuchtfeuer gegen Plünderer und Piraten, die das schmale Meer überquerten. Aber diese Zeiten sind vorbei. Die Welt wird vernetzter. Der Handel fließt schneller und mit ihm gehen Gefahren, Ambitionen und Chancen einher. Wenn die Ostküste unbewirtschaftet bleibt, werden andere – nicht wir – ihr Schicksal bestimmen.\n\nEin Hafen muss in [GetProvince('(int32)3489').GetName] entstehen. \n\n\n\n\n\n\n\n\n\n@italic_mil4!">  #NT!
  
 nuragic_mission_01_inv_30_task: "Urbanize Balaria"  <"Balaria urbanisieren">  #NT!
 nuragic_mission_01_inv_30_task_DESC: "The time has come to raise a city—a true city—at the mouth of the Nurrensian rivers, where the fields meet the sea and the wind carries both the scent of barley and salt. That place is [GetProvince('(int32)3500').GetName].\n\nThere, the Balarians shall gather not as scattered kin, but as a people. There, trade from the inland valleys may flow outward, and goods from across the sea may enter the heart of the north. \n\n\n\n\n\n\n\n\n\n@italic_mil27!"  <"Es ist an der Zeit, eine Stadt – eine echte Stadt – an der Mündung der nurrensischen Flüsse zu errichten, wo die Felder auf das Meer treffen und der Wind sowohl den Duft von Gerste als auch von Salz trägt. Dieser Ort ist [GetProvince('(int32)3500').GetName].\n\nDort werden sich die Balarianer nicht als verstreute Sippe, sondern als Volk versammeln. Dort kann der Handel aus den Binnentälern nach außen fließen und Waren von jenseits des Meeres in das Herz des Nordens gelangen. \n\n\n\n\n\n\n\n\n\n@italic_mil27!">  #NT!
  
 nuragic_mission_01_inv_31_task: "Consolidate Balaria"  <"Balaria konsolidieren">  #NT!
 nuragic_mission_01_inv_31_task_DESC: "This is not merely the conquest of land. This is the return of order, of purpose, of legacy. Balaria has not been reshaped—it has been restored to what it was always meant to be: strong, whole, and ours. \n\n\n\n\n\n\n\n\n\n@greek_mil2!"  <"Dabei geht es nicht nur um die Eroberung von Land. Dies ist die Rückkehr der Ordnung, des Zwecks, des Vermächtnisses. Balaria wurde nicht umgestaltet – es wurde wieder zu dem gemacht, was es immer sein sollte: stark, ganz und unser Eigentum. \n\n\n\n\n\n\n\n\n\n@greek_mil2!">  #NT!
  
 nuragic_mission_01_inv_32_task: "Iolean Plains"  <"Ioleische Ebene">  #NT!
 nuragic_mission_01_inv_32_task_DESC: "For two hundred years, the Carthaginians took the plain and bled its soil dry with endless tribute. They sowed the land not with seed, but with coin and chain. And when they had stripped it bare—of its crops, its people, its spirit—they left it to rot. For generations, the Iolean Plain has known only the echo of what once was.\n\nBut now, we have returned. \n\n\n\n\n\n\n\n\n\n@event_pic8!"  <"Zweihundert Jahre lang eroberten die Karthager die Ebene und ließen ihren Boden mit endlosen Tributen ausbluten. Sie besäten das Land nicht mit Samen, sondern mit Münzen und Ketten. Und als sie es seiner Ernte, seinen Menschen und seinem Geist beraubt hatten, ließen sie es verrotten. Seit Generationen kennt die Iolean-Ebene nur das Echo dessen, was einst war.\n\nAber jetzt sind wir zurückgekehrt. \n\n\n\n\n\n\n\n\n\n@event_pic8!">  #NT!
  
 nuragic_mission_01_inv_33_task: "The Silver Veins"  <"Die Silberadern">  #NT!
 nuragic_mission_01_inv_33_task_DESC: "For two hundred years they dug deep, taking not only ore, but lives. They turned the wealth of Sardinia into the wealth of Carthage. The tunnels were expanded, yes—but only for their gain. The workers were enslaved, the profits shipped across the sea. When their rule was broken, they left the mines wounded and empty, scarred but unhealed.\n\nNow, they are ours again. \n\n\n\n\n\n\n\n\n\n@egypt_mil19!"  <"Zweihundert Jahre lang gruben sie tief und nahmen nicht nur Erz, sondern auch Leben mit. Sie verwandelten den Reichtum Sardiniens in den Reichtum Karthagos. Die Tunnel wurden zwar erweitert – aber nur zu ihrem eigenen Vorteil. Die Arbeiter wurden versklavt, die Gewinne über das Meer verschifft. Als ihre Herrschaft gebrochen wurde, hinterließen sie die Minen verwundet und leer, vernarbt, aber ungeheilt.\n\nJetzt gehören sie wieder uns. \n\n\n\n\n\n\n\n\n\n@egypt_mil19!">  #NT!
  
 nuragic_mission_01_inv_34_task: "[GetProvince('(int32)3493').GetName] Reclaimed"  <"[GetProvince('(int32)3493').GetName] Zurückgefordert">  #NT!
 nuragic_mission_01_inv_34_task_DESC: "The flame of [GetProvince('(int32)3493').GetName], once dimmed, burns again beneath the sign of the Sardan. The bells ring not for tribute, but for triumph. The people walk freely, not in fear, but in memory.\n\nThis is more than victory—it is vindication. For every elder who remembered [GetProvince('(int32)3493').GetName] as she was. For every child taught to never forget. For every warrior who fell believing she would be free. \n\n\n\n\n\n\n\n\n\n@event_pic1!"  <"Die Flamme von [GetProvince('(int32)3493').GetName] brennt, sobald sie erloschen ist, erneut unter dem Zeichen des Sardan. Die Glocken läuten nicht zum Tribut, sondern zum Triumph. Die Menschen wandeln frei, nicht in Angst, sondern in Erinnerung.\n\nDas ist mehr als ein Sieg – es ist eine Rechtfertigung. Für jeden Ältesten, der sich an [GetProvince('(int32)3493').GetName] erinnerte, wie sie war. Für jedes Kind, das gelernt hat, niemals zu vergessen. Für jede Kriegerin, die im Glauben fiel, sie würde frei sein. \n\n\n\n\n\n\n\n\n\n@event_pic1!">  #NT!
  
 nuragic_mission_01_inv_35_task: "Invest In Sarcapos"  <"Investieren Sie in Sarcapos">  #NT!
 nuragic_mission_01_inv_35_task_DESC: "Nestled between wind-carved hills and the open blue of the Eastern Sea, [GetProvince('(int32)3486').GetName] was once a modest outpost of the old Sardan world—a small city-state of fishermen, salt-workers, and humble merchants. It was never great in size, nor mighty in walls, yet it endured. And now, after long years of neglect and foreign shadow, it stands once more beneath the banner of the Sardan.\n\nBut mere possession is not enough. [GetProvince('(int32)3486').GetName] must rise. \n\n\n\n\n\n\n\n\n\n@egypt_mil7!"  <"Eingebettet zwischen vom Wind geformten Hügeln und dem offenen Blau des Ostmeeres war [GetProvince('(int32)3486').GetName] einst ein bescheidener Außenposten der alten sardischen Welt – ein kleiner Stadtstaat aus Fischern, Salzarbeitern und bescheidenen Kaufleuten. Es war weder groß noch mächtig in seinen Mauern, aber es blieb bestehen. Und jetzt, nach langen Jahren der Vernachlässigung und fremden Schatten, steht es wieder unter dem Banner der Sardan.\n\nAber bloßer Besitz reicht nicht aus. [GetProvince('(int32)3486').GetName] muss steigen. \n\n\n\n\n\n\n\n\n\n@egypt_mil7!">  #NT!
  
 nuragic_mission_01_inv_36_task: "Consolidate Iliensia"  <"None">  #NT!
 nuragic_mission_01_inv_36_task_DESC: "For generations, the southern lands of Iliensia have known conflict and division. Once home to powerful city-states like [GetProvince('(int32)3493').GetName], [GetProvince('(int32)3483').GetName], [GetProvince('(int32)3481').GetName] and [GetProvince('(int32)3484').GetName], the southern plains were brought low by foreign hands and the weight of subjugation. The Carthaginians sought to erase the heart of Sardinia from memory, but the blood of the Sardan runs too deep in these hills. Now, after years of strife, Iliensia stands as one—unified, restored, and stronger than ever. \n\n\n\n\n\n\n\n\n\n@greek_mil7!"  <"None">  #NT!
  
