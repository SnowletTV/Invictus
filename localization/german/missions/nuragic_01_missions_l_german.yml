 me_nuragic_1_title: "Ein Konzil von großer Bedeutung"
 me_nuragic_1_desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] platzt aus dem Zelt, ein schmutziger Strom von Flüchen bricht aus [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] Mund, und Augenblicke später gesellt sich [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] die gesamte Entourage hinzu. Alle, die draußen stehen – nicht wenige, denn den ganzen Vormittag tummeln sich viele Soldaten – können sich so selbst ein Bild vom Verhandlungsverlauf machen. Ein leises Murmeln geht durch die sich versammelnde Menge, als [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] sich mit vor Wut gerötetem Gesicht umdreht, um sie anzusprechen. \n \n»Vor ein paar Wochen schickte ich, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], eine Nachricht an die Stammesältesten, um eine Zuhörerschaft zu suchen, um über die Gefahr zu sprechen, die die Karthager für uns alle darstellen, und doch musste niemand den Anstand aufbringen, um den Anruf zu beantworten, außer den Tibulaten, die Ausländer sind diese Insel genauso wie die Nordafrikaner. Ich habe erwartet, dass unsere Cousins ​​dem heiligen Ruf folgen, wenn man bedenkt, dass wir auf dieser Insel viele Nuraghenstämme haben, aber es sollte mich nicht überraschen, dass sie sich alle vor einem Kriegsrat davonschleichen.“ Sich einem rotgesichtigen [GetCountry('X47').GetRuler.GetName] zuwendend, der mit verschränkten Armen dasteht, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] streckt [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] Finger aus und setzt [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] Tirade fort, [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] Stimme zittert vor Wut. \n \n„Ich glaube, ihr seid alle Feiglinge, unwürdig, mit Schweinen zu schlafen! [GetCountry('X47').GetRuler.GetFirstName], du wagst es, hierher zu kommen mit honigsüßen Worten, die einen falschen Frieden versprechen, dein Atem ist versüßt von karthagischem Wein und deine Taschen sind mit ihrem Silber gefüllt – genug! Du bist kein Kriegspartner, sondern eine Schlange im Gras. Geh sofort, damit ich nicht meinen Schwur der Gastfreundschaft breche und dich niederschlage, wo du stehst!' Die Stimmung in der Menge wird hässlich, als [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] schreit: ‚Es soll niemandem Gnade erwiesen werden! Sardinien wird uns gehören!'"
 me_nuragic_01_inv_1.a: "Tod den Feiglingen und Fremden! Wir werden sie alle töten!"
 me_nuragic_1_tooltip: "#Y Wir haben jetzt Ansprüche auf ganz Sardinien#!. Die Missionsaufgabe „#Y A Council of Great Importance#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_2_title: "Sicherung der Reserven"
 me_nuragic_2_desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ist in der gerade erst fertiggestellten Bauernsiedlung angekommen, hat beschlossen, nichts dem Zufall zu überlassen und möchte die Handarbeit unserer Arbeiter persönlich in Augenschein nehmen. [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] ging durch die Felder, inspizierte die Qualität des Bodens und verbrachte Stunden damit, durch die Lagerräume zu laufen, um das Futter für die Nutztiere zu überprüfen und ob ihre Ställe ordnungsgemäß gereinigt wurden oder nicht - kein Detail wurde als zu unbedeutend für [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] Aufmerksamkeit erachtet. Nach einem unglaublich langen Tag waren alle erleichtert, als [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] seine Aussage machte."
 me_nuragic_01_inv.2.a: "Wir können uns auf das, was kommt, vorbereiten und wissen, dass unsere Bäuche voll sein werden"
 me_nuragic_2_tooltip: "Die Missionsaufgabe '#Y Sicherung der Reserven#!' ist jetzt #G Completed#!!"
 securing_reserves_tt: "Bauen Sie eine landwirtschaftliche Siedlung in einem beliebigen Lebensmittel produzierenden Gebiet."
  
 me_nuragic_3_title: "Stelle die Nuraghe wieder her"
 me_nuragic_3_desc: "Seit Monaten haben wir Männer, die hart in den Bergen arbeiten und die notwendigen Steine ​​abbauen, um die Nuraghenbefestigungen in unserem Land zu reparieren. Die Arbeit ist zermürbend und die Arbeiter beschweren sich oft heftig während der Hitze des Tages, aber alle sind sich bewusst, dass diese schwierige Arbeit von größter Bedeutung ist. \n \nObwohl wir voll und ganz auf die Fähigkeit unserer Soldaten vertrauen, unser Volk zu beschützen, sind wir beruhigt, da wir wissen, dass wir uns, wenn alles andere fehlschlägt, innerhalb der Mauern der Nuraghe versammeln können, um wieder zu Kräften zu kommen."
 me_nuragic_01_inv.3.a: "Mögen wir uns niemals in diese Türme zurückziehen müssen"
 me_nuragic_3_tooltip: "Die Missionsaufgabe „#Y Restore the Nuraghe#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_4_title: "Der Fall von [GetProvince('(int32)3504').GetName]"
 me_nuragic_4_desc: "Von [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] Aussichtspunkt in den nahe gelegenen Hügeln hat [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] einen beeindruckenden Blick auf die darunter liegenden Ebenen, wobei alle Augen auf die dicke schwarze Rauchfahne gerichtet sind, die von [GetProvince('(int32)3504').GetName] nach oben treibt. Seit Monaten wissen die Karthager von unseren Vorbereitungen, haben uns aber in ihrer Hybris als bloße Barbaren abgetan, die unfähig sind, unsere Kriegspläne auszuführen. Sie glaubten, hinter ihren Mauern sicher zu sein, aber sie haben die Art der Gefahr, in der sie sich befanden, eindeutig missverstanden. \n \n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] trocken wendet sich an einen Berater in der Nähe und gibt einen Befehl. »Finden Sie den Kommandanten der Zitadelle und schicken Sie seinen Kopf nach Karthago. Verschone niemanden sonst, den du findest.“"
 me_nuragic_01_inv.4.a: "Dies ist eine Botschaft, die die Karthager verstehen werden ..."
 me_nuragic_4_tooltip: "Die Missionsaufgabe „#Y The First City to Fall#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_5_title: "Abschließen der Hintertür"
 me_nuragic_5_desc: "Wir haben endlich die Nachricht erhalten, dass unser laufender Bau bei [GetProvince('(int32)3506').GetName] fast abgeschlossen ist, trotz der Schikanen der örtlichen Tibulaten und Korser, die unsere Anwesenheit in der Region nicht sehen wollen. Dennoch sind die Soldaten auf der Baustelle mehr als in der Lage, diese Scharmützler zu vertreiben, sodass die Arbeit ihrem unvermeidlichen Ende entgegengeht. \n \nObwohl die Festung Viniolae eine beeindruckende Errungenschaft ist, hat uns unser Chefarchitekt informiert, dass wir mehr tun könnten, um unsere Verteidigung zu verstärken, wenn wir die Münze dazu hätten."
 me_nuragic_01_inv.5.a: "Das ist für unsere Zwecke mehr als geeignet"
 me_nuragic_01_inv.5.b: "Es lohnt sich, mehr auszugeben, um eine Katastrophe in der Zukunft zu verhindern"
 me_nuragic_5a_tooltip: "Die Missionsaufgabe „#Y Locking the Back Door#!“ ist jetzt #G Completed#!!"
 me_nuragic_5b_tooltip: "Die Missionsaufgabe „#Y Locking the Back Door#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_6_title: "Ein Standbein in Phikaria"
 me_nuragic_6_desc: "Obwohl wir unser Bestes getan haben, um die Nordküste Sardiniens zu sichern, werden wir ständig von korsischen und tibulatischen Angreifern belästigt, die, unfähig, ihre Niederlage durch unsere Hand zu akzeptieren, auf Räuberei zurückgreifen und durch List und Verrat nehmen, was sie nicht bekommen können Waffengewalt. Da wir uns fälschlicherweise auf der Insel Korsika in Sicherheit glaubten, waren wir gezwungen, einen Außenposten auf der Insel zu errichten, in der Hoffnung, ihre versuchte Überquerung des Mare Sardoum an der Quelle zu vereiteln. \n \nDie Situation ist vorerst in Ordnung, aber langfristig unhaltbar ... wir könnten gezwungen sein, die Insel irgendwann zu befrieden."
 me_nuragic_01_inv.6.a: "Jetzt können wir dieses verdammte Gesindel im Auge behalten"
 me_nuragic_6_tooltip: "Wir haben jetzt Forderungen auf der Insel Korsika. Die Missionsaufgabe „#Y A Foothold in Phikaria#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_7_title: "Augen auf die Hügel"
 me_nuragic_7_desc: "„Runter, du Narr! Sie sind fast bei uns!' [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] zischt, packt [SCOPE.sCharacter('random_dude3').GetName] an der Tunika und zieht sie in Richtung der Bürste. Sekunden später galoppiert ein großer Stoßtrupp leichter Kavallerie an der Stelle vorbei, an der Sie gerade gestanden haben - eine Katastrophe wurde nur knapp vermieden. Sobald der Trommelschlag der Hufe verklungen ist, gibt [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] das Signal, [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] versammelt Soldaten und sie kriechen auf dem Bauch den Hügel hinauf und beobachten die feindlichen Reiter, die auf die Küste zusteuern. \n \nDie Karthager haben ihre Patrouillen in letzter Zeit verdoppelt, und obwohl sie unsere Insel mit Silber überschwemmen und jeden und jeden anheuern, der bereit ist, sich gegen uns zu stellen, finden unsere Späher die versteckten Orte in den Tälern und behalten ihre Bewegungen im Auge, Gott sei Dank. Mit etwas Glück können wir diesen Vorsprung halten, vor allem mit Hilfe der Bergrebellen, die diese Straßen wie ihre Westentasche kennen."
 me_nuragic_01_inv.7.a: "Tun Sie Ihr Bestes, um ungesehen zu bleiben – wir brauchen den Überraschungseffekt"
 me_nuragic_7_tooltip: "Die Missionsaufgabe „#Y Eyes in the Hills#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_8_title: "Blutige Geschenke für Babai"
 me_nuragic_8_desc: "Verzweifelte Zeiten erfordern verzweifelte Maßnahmen, wie das Sprichwort sagt, und obwohl unser Volk seit vielen Jahren keine Menschen mehr den Göttern geopfert hat, hat [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] entschieden, dass wir uns an die Götter des Krieges und des Todes wenden müssen. Die Luft ist erfüllt vom herzzerreißenden Wehklagen von Frauen und Kindern, wenn unsere Soldaten sie von den Wagen zerren und zum Hinrichtungsort drängen. Einige werfen auf dem Weg zum Hackklotz einen mitleidigen Blick auf [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] in der Hoffnung, Mitleid zu finden, und finden ihren Blick unerwidert. Es wird heute keine Milde geben, nur die Axt. \n \nNatürlich wird unser Ruf im In- und Ausland darunter leiden ... die Karthager werden allen erzählen, dass wir Barbaren sind, und auf diesen Moment als Beweis unserer Wildheit hinweisen."
 me_nuragic_01_inv.8.a: "Babai wird dieses Angebot nicht vergessen ... der Preis wird es wert sein!"
 me_nuragic_8_tooltip: "Die Missionsaufgabe „#Y Opfer für die Götter des Krieges#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_9_title: "Der Hafen von Cornus"
 me_nuragic_9_desc: "Seit langem wissen wir, dass die Siedlung [GetProvince('(int32)3494').GetName] eine wichtige Zwischenstation für karthagische Kaufleute ist, die oft in diesem freundlichen Hafen anhalten, um frisches Wasser und Vorräte zu holen, während sie das von Piraten heimgesuchte Mare Sardoum durchqueren. \n \nUnnötig zu erwähnen, dass unser jüngster Sieg dort viel dazu beitragen wird, diese Bemühungen zu vereiteln. Ach ja, und die zurückgelassene Schatzkammer ist eine nette Bereicherung für unsere eigenen Kassen."
 me_nuragic_01_inv.9.a: "Jedes Bisschen hilft"
 me_nuragic_9_tooltip: "Die Missionsaufgabe „#Y The Port of Cornus#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_900_title: "The Oath of Hospiton"  <"None">  #NT!
 me_nuragic_900_desc: "They say he arrived at dusk, when the wind carried the scent of wild myrtle and sea-salt up from the western coast. His steps echoed across the hall as if the earth itself remembered him. It was not a man who entered the court that evening, but a shadow out of memory. \n\nClad in pristine Nuragic armor made of boiled and blackened leather, shaped with sacred oils and stitched with hide taken from beasts long extinct on the island. Upon his head rested an horned helm engraved with runes long thought lost—a mark no common folk dares wear, and only blood truly earns.\n\nHospiton of Sanaphar, they called him.\n\nAcross his chest ran a belt of knives—Its finely-worked leather bore the sacred V-pattern, each chevron was a medal, a mark of great honour and courage in battle. The belt was draped with five chevrons: only those of the highest martial order—those who could sail in a stormy night, those who killed hundreds of enemies—were allowed such a pattern. And all in the court knew it. Some had only seen such belts buried with the dead.\n\nA local chieftain, yes—but more than that. He was no ordinary man, but it was what he held that stilled even the whisper of silk among the nobles.\n\nIn his outstretched hand lay a golden scarab, its surface etched with the cartouche of Usermaatre Setepenre—the name of Ramses II, the Living God of Kemet. The scarab gleamed with an otherworldly glow, as if it still carried the warmth of the Nile sun.\n\nHospiton raised his voice—not loud, but so filled with weight that it silenced the hall:\n\n“I am Hospiton, son of Agasin, son of Tar-Ammon\nDescendant of the Sardana who crossed the sands\nWho stood beside the Son of Ra\nThis scarab was given to my forefather\nNot as a trinket, but as a seal of kinship.\nWith it, I now seal my oath.”\n\nHe placed the scarab upon the throne's lowest step, then unsheathed his Nuragic dagger—the hilt carved in the sacred gammadion form—and struck its point into the stone beside it.\n\n“By the Light of Il, Father\nBy the blood of my ancestors,\nBy this blade and by this scarab,\nI pledge my life to the King of the Sardan,\nAnd to the rebirth of Sardan's glory.”\n\nNone dared speak. They knew what this meant. Hospiton was not a man—they would speak of him as a sign.\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] descended, and without a word, touched the scarab with two fingers, then placed his hand over Hospiton's heart.\n\nThe court erupted into chants, the sound of drums rising from the lower halls. Outside, the wind now carried the scent of omens of kingship, war, and legacy."  <"Man sagt, er sei in der Abenddämmerung angekommen, als der Wind den Duft von wilder Myrte und Meersalz von der Westküste heraufgetragen habe. Seine Schritte hallten durch die Halle, als würde sich die Erde selbst an ihn erinnern. Es war kein Mann, der an diesem Abend den Gerichtssaal betrat, sondern ein Schatten aus der Erinnerung. \n\nGekleidet in makellose Nuraghenrüstung aus gekochtem und geschwärztem Leder, geformt mit heiligen Ölen und genäht mit Haut von Tieren, die auf der Insel längst ausgestorben sind. Auf seinem Kopf ruhte ein gehörnter Helm, in den lange verloren geglaubte Runen eingraviert waren – ein Zeichen, das kein gewöhnliches Volk zu tragen wagt und das nur Blut wirklich verdient.\n\nHospiton von Sanaphar, nannten sie ihn.\n\nÜber seiner Brust verlief ein Messergürtel – sein fein gearbeitetes Leder trug das heilige V-Muster, jeder Chevron war eine Medaille, ein Zeichen großer Ehre und Mut im Kampf. Der Gürtel war mit fünf Chevrons drapiert: Nur diejenigen der höchsten kriegerischen Ordnung – diejenigen, die in einer stürmischen Nacht segeln konnten, diejenigen, die Hunderte von Feinden töteten – durften ein solches Muster tragen. Und alle im Gericht wussten es. Manche hatten solche Gürtel nur bei Toten gesehen.\n\nEin örtlicher Häuptling, ja – aber mehr als das. Er war kein gewöhnlicher Mann, aber es war das, was er hielt, das sogar das Flüstern von Seide unter den Adligen zum Schweigen brachte.\n\nIn seiner ausgestreckten Hand lag ein goldener Skarabäus, auf dessen Oberfläche die Kartusche von Usermaatre Setepenre eingraviert war – der Name von Ramses II., dem lebenden Gott von Kemet. Der Skarabäus schimmerte in einem jenseitigen Glanz, als ob er immer noch die Wärme der Nilsonne in sich tragen würde.\n\nHospiton erhob seine Stimme – nicht laut, aber so schwer, dass die Halle verstummte:\n\n„Ich bin Hospiton, Sohn von Agasin, Sohn von Tar-Ammon\nNachkomme der Sardana, die den Sand überquerte\nDer neben dem Sohn von Ra stand\nDieser Skarabäus wurde mir gegeben Vorvater\nNicht als Schmuckstück, sondern als Siegel der Verwandtschaft.\nDamit besiegele ich jetzt meinen Eid.“\n\nEr legte den Skarabäus auf die unterste Stufe des Throns, zog dann seinen Nuraghendolch – den in der heiligen Gammadion-Form geschnitzten Griff – aus der Scheide und schlug seine Spitze in den Stein daneben.\n\n„Beim Licht von Il, Vater\nBeim Blut meiner Vorfahren,\nDurch diese Klinge und durch diese Skarabäus,\nIch schwöre mein Leben dem König von Sardan,\nund der Wiedergeburt von Sardans Ruhm.“\n\nNiemand wagte es zu sprechen. Sie wussten, was das bedeutete. Hospiton war kein Mann – sie würden von ihm als einem Zeichen sprechen.\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] stieg herab und berührte wortlos den Skarabäus mit zwei Fingern, dann legte er seine Hand auf Hospitons Herz.\n\nDer Hof brach in Gesänge aus, und aus den unteren Hallen erklangen Trommeln. Draußen trug der Wind nun den Duft von Vorzeichen des Königtums, des Krieges und des Erbes.">  #NT!
 me_nuragic_01_inv.900.a: "Be praised Sardo."  <"None">  #NT!
 me_nuragic_900_tooltip: "$mission_completed_tooltip_1$ '#Y The Port of Sanaphar#!' $mission_completed_tooltip_2$"  <"None">  #NT!
  
 me_nuragic_10_title: "Die Zerstörung von Sulki"
 me_nuragic_10_desc: "[GetProvince('(int32)3481').GetName], der Sitz der karthagischen Macht auf Sardinien, ist den siegreichen Streitkräften von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] zum Opfer gefallen, und die Rache unserer blutrünstigen Soldaten ist erschreckend. Seit jeher haben die Karthager unser Volk hinter Sulkis Mauern terrorisiert und so getan, als ob ihnen die Insel gehörte, aber jetzt haben die Götter die perfiden Männer aus Nordafrika im Stich gelassen und die Stunde des Gerichts ist nahe. \n \nAls sich die Armeen von [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] zum ersten Mal Sulki näherten, wurde befürchtet, dass der Sieg zur völligen Zerstörung der verhassten karthagischen Hauptstadt führen würde - ehrlich gesagt könnte [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] die Männer von [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] nicht davon abhalten, die Stadt niederzubrennen. \n \nDurch die Zerstörung dieser Stadt glauben die Soldaten, dass die Verbrechen ihrer Väter endlich gerächt würden, ein symbolischer Schritt, um die hasserfüllte Präsenz der Karthager für immer aus dem Land zu entfernen, aber unsere Berater reißen sich die Haare über den Gedanken, einen davon zu plündern die wenigen Städte unserer Insel. \n \n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] steht vor Sulkis Toren, eine ganze Armee wartet auf den Befehl ... mit einem einzigen Wort könnten Tausende von Seelen sterben."
 me_nuragic_01_inv.10.a: "Erspare ihnen keine Tränen, das ist es, was sie verdienen. Brennen Sie alles nieder!"
 me_nuragic_10_tooltip: "Die Missionsaufgabe „#Y The Sack of Sulki#!“ ist jetzt #G Completed#!!"
 me_nuragic_01_inv.10.b: "Ich habe meine Meinung geändert – sag den Männern, sie sollen die Stadt verschonen"
  
 me_nuragic_11_title: "Karalisches Ackerland"
 me_nuragic_11_desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] hat in den letzten Wochen immer mehr Zeit in der Provinz [GetProvince('(int32)3484').GetName] verbracht. Da er zu diesem Zeitpunkt mit ganz Sardinien vertraut ist und den größten Teil seines [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] Erwachsenenlebens mit Kampagnen auf der Insel verbracht hat, ist [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] mit praktisch jeder Bergstraße und jedem Tal unserer Insel gut vertraut, daher sollte es nicht überraschen, dass Karali erhalten hat die meiste Aufmerksamkeit. \n \nGutes Ackerland war auf unserer Insel schon immer schwer zu finden, und doch ist Karali mit fruchtbaren Feldern und Süßwasserströmen gesegnet, mit viel Platz für unsere Nutztiere, um nach Belieben umherzuwandern. Die Bienen, die auf dem Land leben, produzieren einen Honig mit einer leichten Bitterkeit, den Feinschmecker exquisit finden, und die Weine, die in den Weinbergen von Karali produziert werden, sind einfach die besten, die auf Sardinien zu finden sind. Nichts für sanftes Leben, selbst der mächtige [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] war von den Reizen der Region gefesselt und befahl, die Stadt nach anspruchsvollen Standards zu bauen."
 me_nuragic_01_inv.11.a: "Ich stelle mir hier eine Zukunft vor..."
 me_nuragic_11_tooltip: "Die Missionsaufgabe „#Y Karalian Farmlands#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_12_title: "Eine südliche Hauptstadt"
 me_nuragic_12_desc: "Nachdem er die Nachricht erhalten hat, dass die Stadt [GetProvince('(int32)3484').GetName] gedeiht, hat unser Anführer dank der Großzügigkeit, die [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] bei der Finanzierung seines Baus gezeigt hat, eine mutige Entscheidung getroffen, eine, die die Stammesältesten schockiert hat - wir müssen unser angestammtes Zuhause sofort verlassen und auswandern Hauptstadt in die neue Stadt an der Küste. Obwohl einige sich gegen [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]'s unorthodoxen Befehl sträuben, hat [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] die persönliche Popularität sowie kürzliche Änderungen in unseren Gesetzen [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] die absolute Autorität gegeben, die Lebensweise unseres Volkes zu entwurzeln, so dass alle gegensätzlichen Stimmen zum Schweigen gebracht wurden. \n \nEs ist wahr, dass [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] alles andere als dem Namen nach regiert, ungeachtet dessen, was unsere Gesetze und Traditionen sagen mögen. Wenn also eines Morgens bekannt gegeben wird, dass in [SCOPE.GetRootScope.GetCountry.GetName] ein königlicher Palast gebaut wurde, sind nicht viele überrascht. Es scheint, dass die Tage unserer früheren Regierungsweisen, was auch immer sie sein mögen, stillschweigend vorbei sind und eine neue Ära vor uns liegt. Wir beten nur, dass die Götter [GetProvince('(int32)3484').GetName], Vorname von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], die Weisheit gewähren, unser Volk durch eine gewalttätige und turbulente Welt zu führen. \n \nEs gibt einige, die offen den Verlust unserer alten Hauptstadt betrauern, und viele andere trauern heimlich um den Verlust unserer alten Freiheiten, aber diese mutlosen Stimmen sind wenige im Vergleich zu denen, die von dieser unerwarteten Veränderung begeistert sind. Das Leben wird für uns jetzt anders sein ..."
 me_nuragic_01_inv.12.a: "Dieser Tag markiert wirklich den Beginn unserer Geschichte"
 me_nuragic_01_inv.12.b: "The old Carthaginian seat of power, Nura, is the natural choice"  <"None">  #NT!
 me_nuragic_01_inv.12.c: "There is no other place like Karalis - it must be there"  <"Es gibt keinen anderen Ort wie Karalis – es muss dort sein">  #NT!
 me_nuragic_01_inv.12.d: "Tarshish is an excellent choice, it's former glory shall again return to shine"  <"Tarschisch ist eine ausgezeichnete Wahl, sein früherer Glanz wird wieder in neuem Glanz erstrahlen">  #NT!
 me_nuragic_01_inv.12.e: "Proud Luguido is my favorite suggestion"  <"None">  #NT!
 me_nuragic_01_inv.12.f: "Phausiane...can there be any other capital?"  <"Phausiane...kann es noch eine andere Hauptstadt geben?">  #NT!
 me_nuragic_01_inv.12.g: "We shall keep our traditional capital"  <"Wir behalten unser traditionelles Kapital">  #NT!
 me_nuragic_12_tooltip: "Die Missionsaufgabe „#Y A Southern Capital#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_13_title: "Erobern Sie die Schiffe"
 me_nuragic_13_desc: "In ihrer Eile, [GetProvince('(int32)3504').GetName] aufzugeben, ließen die Karthager viel zurück – eine überraschende Wendung der Dinge, wenn man bedenkt, dass sie für ihren Geiz bekannt sind. Sie überließen unseren Streitkräften nicht nur die Stadt, sondern ließen in ihrer blinden Panik sogar Schiffe im Hafen treiben, obwohl sie anscheinend einen halbherzigen Versuch unternahmen, sie zu verbrennen, bevor sie flohen. Die Winde arbeiteten jedoch gegen sie, und wir konnten die Brände löschen und eine kleine Anzahl von Schiffen bergen. \n \nObwohl wir in Seesachen sehr unerfahren sind, haben unsere Ingenieure diese Schiffe nach besten Kräften repariert, und es scheint, als hätten wir jetzt eine kleine Marine, o [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]."
 me_nuragic_01_inv.13.a: "Eine Marine, sagst du? Dies ist sicherlich unerwartet"
 me_nuragic_13_tooltip: "Die Missionsaufgabe „#Y Beschlage die Schiffe#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_14_title: "Ein blindes Auge für Piraterie"
 me_nuragic_14_desc: "'Cousin! Die Götter behandeln dich gut!' \n \nBei diesen Worten erhellt [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]s Gesicht ein strahlendes Lächeln. Beim Überqueren des Decks von [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] Flaggschiff begrüßt [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] den Anführer der Piraten von Mago, der unserem Anruf gefolgt ist und zugestimmt hat, unsere Vorschläge zu hören. Es ist sicherlich ein seltsamer Anblick, als die Piraten ihre Flotte gerade außerhalb von [GetProvince('(int32)3494').GetName] gesegelt sind, wo [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] zugestimmt hat, hinauszugehen und sie auf See zu treffen. \n \nObwohl sich unsere Stämme vor Hunderten von Jahren voneinander getrennt haben, hat unser Volk eine schwache Verbindung zu unseren talayotischen Verwandten aufrechterhalten, die auf den Inseln weit im Westen leben. Dort, auf den Balearen, haben sich die gefürchteten Piraten von Mago niedergelassen, die Jagd auf die reichen Handelsrouten machen, die Iberia und Karthago verbinden. Piraterie ist ein lukratives Geschäft, und [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] hat entschieden, dass wir an dem glorreichen Schläger teilhaben wollen. \n \n„Wie Sie sehen können, haben wir hier alles gebaut, was man braucht, aber uns fehlt es an Leuten … die Kriege haben uns schwer zugesetzt. Sagen Sie es, und wir werden unseren Hafen für Sie und Ihre Männer öffnen.«"
 me_nuragic_01_inv.14.a: "Richten Sie sich auf jeden Fall hier ein – wir beide werden von dieser Anordnung profitieren"
 me_nuragic_14_tooltip: "Die Missionsaufgabe „#Y A Blind Eye to Piracy#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_15_title: "Sklaven in unserer eigenen Heimat"
 me_nuragic_15_desc: "Vor langer Zeit lebte unser Volk, stolze Stammesangehörige der Nuraghen, in Harmonie mit unseren Nachbarn; einfache, aber ehrbare Leute, wir waren zufrieden damit, unsere Tiere an den Berghängen zu weiden und unseren Enkelkindern beim Altern zuzusehen. Manche mögen diesen Daseinszustand als traurig empfinden, aber wir waren den Göttern dankbar für die Güte, die sie uns erwiesen. \n \nAll dies änderte sich mit der Ankunft der Ausländer - zuerst kamen die Karthager, umrundeten unsere Insel in ihren riesigen Flotten und eroberten das beste Land für sich, errichteten ihre Festungen im Süden, nur um von korsischen Stammesangehörigen aus dem Norden gefolgt zu werden. die es satt hatten, die Gewässer zu überqueren, um uns zu überfallen, und dauerhafte Lager errichteten. Diese Fremden, die mit unseren Wegen nicht vertraut sind, hatten kein Interesse daran, zusammenzuleben und unser Volk aus dem Land seiner Vorfahren und tief in das Innere der Insel zu vertreiben. Unfähig oder nicht bereit, sich zu wehren, verließen wir unsere Häuser und flohen in die Sicherheit der Berge. \n \nKürzlich haben die Karthager, ermutigt durch die Fehler unserer Väter, sich nicht gegen sie zu stellen, ihre Steuereintreiber in unsere Städte und Dörfer geschickt. Wann immer einer unserer Leute sich über diese schwere Ungerechtigkeit beschwert, wird er geschlagen oder schlimmer noch getötet. Erst neulich erwürgten karthagische Agenten ungestraft einen alten Mann direkt vor den Augen unseres Stammeshäuptlings [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], weil er versuchte, ein paar Kupfermünzen zurückzuhalten. Offensichtlich halten sie wenig bis gar nichts von uns, und es ist nur eine Frage der Zeit, bis sie uns endgültig erobern."
 me_nuragic_01_inv.15.a: "Ich, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], halte das nicht länger aus..."
 me_nuragic_15_tooltip: "Wie lange kann dieser Zustand anhalten?"
  
 me_nuragic_16_title: "Alte Gäste"
 me_nuragic_16_desc: "Es kommt selten vor, dass [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] einen Fehler von [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] anerkennt, aber mit jedem Tag sieht es so aus, als wäre es eine schreckliche, schreckliche Idee gewesen, die Piraten von [GetProvince('(int32)1469').GetName] zu begrüßen, damit sie in unserer Provinz [GetProvince('(int32)3494').GetName] ein Geschäft eröffnen. Es stimmt zwar, dass wir von der Vereinbarung profitiert haben, indem wir an der Beute teilhaben, die die Piraten in den Hafen zurückbringen, aber der Ärger mit diesen Angreifern beginnt, die Vorteile zu überwiegen. Die talayotischen Piraten respektieren unsere Bräuche nicht und behandeln unser Volk als Ärgernis, fordern besondere Privilegien wie freie Unterkunft und Verpflegung in der Stadt und machen sich im Allgemeinen zu betrunkenen Plagegeistern. Die Einwohner von Cornus reichen ständig Petitionen ein, beschuldigen die Piraten, schlimmer als die Karthager zu sein, und fordern, dass etwas gegen sie unternommen wird. Offensichtlich haben unsere Cousins ​​keinen Respekt vor uns und denken, dass wir ihr ungehobeltes Verhalten tolerieren werden. \n \n'Eine schwierige Sache, einen verjährten Hausgast zu entfernen.' [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] murmelt eines Abends zu sich selbst, als [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHim] durch [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] Quartiere geht. Schlaf war schwer zu finden, denn [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]mind war damit beschäftigt, eine Lösung für dieses heikle Problem zu finden. „Es muss etwas getan werden, aber was? Vielleicht ist die beste Vorgehensweise eine, die niemand jemals vermuten würde ..."
 me_nuragic_01_inv.16.a: "Wir segeln im Morgengrauen nach Mago! Macht unsere Schiffe bereit!"
 me_nuragic_16_tooltip: "#R Wir werden Gymnaesia sofort den Krieg erklären!#! Die Missionsaufgabe „#Y Stale Guests#!“ ist jetzt #G Completed#!!"
 me_nuragic_01_inv.16.b: "Sammeln Sie vorerst unsere Ansprüche - wir werden segeln, wenn die Vorzeichen günstig sind"
 me_nuragic_16_b_tooltip: "Die Missionsaufgabe „#Y Stale Guests#!“ ist jetzt #G Completed#!!"
  
 me_nuragic_17_title: "The Mines Of Palma"  <"None">  #NT!
 me_nuragic_17_desc: "At last, we have finished constructing a mine in the province of [GetProvince('(int32)1465').GetName], and we have wasted no time in filling the quarry with Balearic slaves.\n\nAlthough many of the men now toiling in the dark mineshafts were once citizens of note, their former lives are a distant memory, with nothing remaining for them there but bittersweet memories of the way things were. It is only the pickaxe now, until death finally comes to relieve them of their labors."  <"Endlich haben wir den Bau einer Mine in der Provinz [GetProvince('(int32)1465').GetName] abgeschlossen, und wir haben keine Zeit damit verschwendet, den Steinbruch mit balearischen Sklaven zu füllen.\n\nObwohl viele der Männer, die jetzt in den dunklen Minenschächten schuften, einst angesehene Bürger waren, sind ihre früheren Leben eine ferne Erinnerung, und für sie bleibt dort nichts als bittersüße Erinnerungen an die Art und Weise, wie die Dinge waren. Jetzt ist es nur noch die Spitzhacke, bis der Tod sie endlich von ihrer Arbeit befreit.">  #NT!
 me_nuragic_01_inv.17.a: "A mine is a much smarter use of this land - what were they thinking?"  <"Eine Mine ist eine viel intelligentere Nutzung dieses Landes – was haben sie sich dabei gedacht?">  #NT!
 me_nuragic_17_tooltip: "$mission_completed_tooltip_1$ '#Y The Mines Of Palma#!' $mission_completed_tooltip_2$"  <"None">  #NT!
  
 me_nuragic_170_title: "Balearic Slingers"  <"Balearische Schleuderer">  #NT!
 me_nuragic_170_desc: "From childhood, the sons of Balearic Islands are trained with the sling, not as play, but as rite. With three lengths of cord — short, medium, and long — they can strike a hare on the run, or shatter a shield from afar.\n\nThey ask for no armor, no horses, no bronze — only a pouch of stones, a steady hand, and open ground. Light of foot and lethal at distance, the Balearic slingers have earned their fearsome reputation across the sea, having served in distant wars, from the mountains of Iberia to the plains of Africa.\n\nNow, under our banners, these sons of stone could serve a higher cause — not as mercenaries, but as comrades in arms. Let us grant them honor and good coin, and their volleys shall soften the enemy before our spears ever reach them."  <"Von Kindheit an wird den Söhnen der Balearen der Umgang mit der Schlinge beigebracht, nicht als Spiel, sondern als Ritual. Mit drei Längen Schnur – kurz, mittel und lang – können sie einen Hasen auf der Flucht schlagen oder einen Schild aus der Ferne zerschmettern.\n\nSie verlangen keine Rüstung, keine Pferde, keine Bronze – nur einen Beutel voller Steine, eine ruhige Hand und offenes Gelände. Die balearischen Schleuderer sind leichtfüßig und auf Distanz tödlich und haben sich ihren furchterregenden Ruf über das Meer hinweg erworben, indem sie in fernen Kriegen von den Bergen Iberiens bis zu den Ebenen Afrikas gedient haben.\n\nJetzt könnten diese Söhne aus Stein unter unseren Bannern einer höheren Sache dienen – nicht als Söldner, sondern als Waffenbrüder. Gewähren wir ihnen Ehre und gutes Geld, und ihre Salven werden den Feind erweichen, bevor unsere Speere sie jemals erreichen.">  #NT!
 me_nuragic_01_inv.170.a: "To ignore their worth would be folly."  <"Ihren Wert zu ignorieren wäre Torheit.">  #NT!
 me_nuragic_01_inv.170.b: "They are not that good."  <"Sie sind nicht so gut.">  #NT!
 me_nuragic_170_tooltip.a: "Institute special corps of Balearic Slingers, integrate them among our ranks."  <"Richten Sie ein Spezialkorps balearischer Schleuderer ein und integrieren Sie sie in unsere Reihen.">  #NT!
 me_nuragic_170_tooltip.b: "They are no different than any other slinger of our great nation."  <"None">  #NT!
  
 me_nuragic_18_title: "Settle [GetProvince('(int32)3510').GetName]"  <"Begleiche [GetProvince('(int32)3510').GetName]">  #NT!
 me_nuragic_18_desc: "Never one to let an opportunity go to waste, [ROOT.GetCountry.GetRuler.GetFirstName] has wisely decided to divert some of the material wealth from the citizens of [GetProvince('(int32)3515').GetName] in order to fund the construction of a brand new city in [GetProvince('(int32)3510').GetName].\n\nWhile some of the Corsians have complained about having to pay this extra tax, [ROOT.GetCountry.GetRuler.GetFirstName] has argued that everyone on the island will benefit, especially now that it will be easier to settle the western coast."  <"[ROOT.GetCountry.GetRuler.GetFirstName] lässt keine Gelegenheit ungenutzt ungenutzt und hat klugerweise beschlossen, einen Teil des materiellen Reichtums von den Bürgern von [GetProvince('(int32)3515').GetName] abzuziehen, um den Bau einer brandneuen Stadt in [GetProvince('(int32)3510').GetName] zu finanzieren.\n\nWährend sich einige der Korsier darüber beschwert haben, dass sie diese zusätzliche Steuer zahlen müssen, hat [ROOT.GetCountry.GetRuler.GetFirstName] argumentiert, dass jeder auf der Insel davon profitieren wird, insbesondere jetzt, da es einfacher sein wird, die Westküste zu besiedeln.">  #NT!
 me_nuragic_01_inv.18.a: "Believe me, I am thinking in the long-term here...have faith!"  <"Glauben Sie mir, ich denke hier langfristig ... haben Sie Vertrauen!">  #NT!
 me_nuragic_18_tooltip: "$mission_completed_tooltip_1$ '#Y Corsian Cities#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Korsische Städte#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_19_title: "Strait Of Taphros"  <"Straße von Taphros">  #NT!
 me_nuragic_19_desc: "Having a steady control over [GetProvince('(int32)3508').GetName] and [GetProvince('(int32)3506').GetName] can guarantee a firm influence on the narrow of Taphros.\n\nThe ships which will attempt to have a faster route between Iberia and the Italian Peninsula will have to pay small maritime fees to cross the strait. In the wise plans of [ROOT.GetCountry.GetRuler.GetFirstName], Taphros will offer a secure trade route under the protection of our people, exempt from the danger of the pirates, and the trade influx will benefit of our coastal markets and ports, which would receive the finest naval craftmanship."  <"Eine ständige Kontrolle über [GetProvince('(int32)3508').GetName] und [GetProvince('(int32)3506').GetName] kann einen festen Einfluss auf die Meerenge von Taphros garantieren.\n\nDie Schiffe, die eine schnellere Route zwischen Iberia und der italienischen Halbinsel anstreben, müssen geringe Seegebühren zahlen, um die Meerenge zu überqueren. In den klugen Plänen von [ROOT.GetCountry.GetRuler.GetFirstName] wird Taphros eine sichere Handelsroute unter dem Schutz unseres Volkes bieten, frei von der Gefahr der Piraten, und der Handelszustrom wird unseren Küstenmärkten und Häfen zugute kommen, die die beste Marine-Handwerkskunst erhalten würden.">  #NT!
 me_nuragic_01_inv.19.a: "The Gates of Sardinia and Corsica are under our hands."  <"Die Tore Sardiniens und Korsikas liegen in unseren Händen.">  #NT!
 me_nuragic_19_tooltip: "$mission_completed_tooltip_1$ '#Y Strait Of Taphros#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Straße von Taphros#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_20_title: "The Grain Of Nurrensia"  <"Das Korn von Nurrensia">  #NT!
 me_nuragic_20_desc: "The plains of Nurrensia shine with our greatness; the canals have been completed and our water wells excavated - everything has been conceived, fullfilling the wise vision of [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. [GetProvince('(int32)3496').GetName] shall truly become the granary of Sardinia and soon we will grasp the fruits of our hard works."  <"Die Ebenen von Nurrensia strahlen vor unserer Größe; Die Kanäle wurden fertiggestellt und unsere Wasserbrunnen ausgehoben – alles wurde geplant, um die weise Vision von [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] zu erfüllen. [GetProvince('(int32)3496').GetName] wird wirklich zur Kornkammer Sardiniens und bald werden wir die Früchte unserer harten Arbeit ernten.">  #NT!
 me_nuragic_01_inv.20.a: "Be praised, Sardo! You have blessed our swords and our fields"  <"Sei gelobt, Sardo! Du hast unsere Schwerter und unsere Felder gesegnet">  #NT!
 me_nuragic_20_tooltip: "$mission_completed_tooltip_1$ '#Y The Grain of Nurrensia#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Das Korn von Nurrensia#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_21_title: "Raze The Foreigns"  <"Zerstöre die Ausländer">  #NT!
 me_nuragic_21_desc: "No longer shall we merely raid and vanish. No longer shall our fury be a whisper in the wind. We descend now—not as skirmishers, but as fire made flesh. We go not to reclaim, but to raze. Let no foreign banner stand upright. Let no field yield grain for their tables. Let the Iolean Plain burn, so that none may mistake this land for theirs.\n\nThe time of waiting has passed. The mountain speaks again, and its voice is war.\n[ROOT.GetCountry.GetRuler.GetFirstName] must now descend, blade drawn, to carve [ROOT.GetCountry.GetRuler.GetHerHis] name into the stone of memory. If the ancestors are watching, let them see that the blood of Sardan has not run cold."  <"Wir sollen nicht länger einfach nur plündern und verschwinden. Unsere Wut soll nicht länger ein Flüstern im Wind sein. Wir steigen jetzt ab – nicht als Scharmützler, sondern wie Fleisch gewordenes Feuer. Wir wollen nicht zurückgewinnen, sondern zerstören. Kein fremdes Banner soll aufrecht stehen. Kein Feld soll Getreide für ihre Tische bringen. Lass die Iolean-Ebene brennen, damit niemand dieses Land mit seinem verwechseln kann.\n\nDie Zeit des Wartens ist vorbei. Der Berg spricht wieder und seine Stimme ist Krieg.\n[ROOT.GetCountry.GetRuler.GetFirstName] muss nun mit gezogener Klinge hinabsteigen, um [ROOT.GetCountry.GetRuler.GetHerHis] Namen in den Stein der Erinnerung zu ritzen. Wenn die Vorfahren zuschauen, sollen sie sehen, dass das Blut von Sardan nicht erkaltet ist.">  #NT!
 me_nuragic_01_inv.21.a: "Take anything of value, burn the rest."  <"Nimm alles Wertvolle, verbrenne den Rest.">  #NT!
 me_nuragic_21_tooltip: "$mission_completed_tooltip_1$ '#Y Raze The Foreigns#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Raze The Foreigns#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_22_title: "Build A Fleet"  <"Bauen Sie eine Flotte auf">  #NT!
 me_nuragic_22_desc: "The mountain stirs, and so too must the sea. The call to build anew echoes across all Sardinia—from the mouths of young warriors to the hammers of the last shipwrights. We shall raise a new fleet—not for trade, not for show, but for war, for pride, for the reclaiming of our name upon the waves.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] now sees this vision made real-we have built a fleet with haste and purpose: lean vessels, fast and sharp, born for pursuit and for flame. Let our ships return to the sea like foxes to the hunt. Let the foreign merchants fear the horizon once again. Let the invader's triremes burn. Let the docks be filled with hammer and flame, and let the forges burn bright with the promise of vengeance. The sea, too, must remember who we are."  <"Der Berg regt sich und das Meer auch. Der Ruf, neu zu bauen, hallt in ganz Sardinien wider – von den Mündern junger Krieger bis zu den Hämmern der letzten Schiffbauer. Wir werden eine neue Flotte aufstellen – nicht für den Handel, nicht zur Schau, sondern für den Krieg, für den Stolz, um unseren Namen auf den Wellen zurückzugewinnen.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] sieht nun, wie diese Vision Wirklichkeit wird – wir haben eine Flotte mit Eile und Zielstrebigkeit aufgebaut: schlanke Schiffe, schnell und scharf, geboren für die Verfolgung und für die Flamme. Lasst unsere Schiffe ins Meer zurückkehren wie Füchse auf die Jagd. Lassen Sie die ausländischen Kaufleute erneut den Horizont fürchten. Lass die Triremen des Eindringlings brennen. Lasst die Docks mit Hammer und Flammen erfüllt sein und lasst die Schmieden hell brennen mit dem Versprechen der Rache. Auch das Meer muss sich daran erinnern, wer wir sind.">  #NT!
 me_nuragic_01_inv.22.a: "The mountain rules the land. The fleet shall rule the sea."  <"Der Berg beherrscht das Land. Die Flotte soll das Meer beherrschen.">  #NT!
 me_nuragic_22_tooltip: "$mission_completed_tooltip_1$ '#Y Build A Fleet#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Baue eine Flotte#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_23_title: "Aim To Corsica"  <"Ziel ist Korsika">  #NT!
 me_nuragic_23_desc: "We can no longer afford to look north and see our brothers living as strangers in their own land. The Etruscans may grow bolder If left unchecked. They will look to Sardinia next, as they always have. We must strike now—not only to protect our future, but to restore what was torn from our past.\n\nThis is no war of ambition—it is a duty. A homecoming. A reckoning.\n\nLet our ships cross the straits with fire in their hearts. Let the Etruscan outposts fall, one by one, to the cry of Utturà Utalabì! Let the Corsican highlanders see our banners on the wind and know that the Sardan have not forgotten them.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] must now act, lest history write that we were content to let our own flesh be ruled by foreign hands. The island to the north calls to us. And we shall answer—not with words, but with war."  <"Wir können es uns nicht länger leisten, nach Norden zu schauen und unsere Brüder als Fremde in ihrem eigenen Land leben zu sehen. Die Etrusker könnten mutiger werden, wenn sie nicht kontrolliert werden. Als nächstes werden sie wie immer nach Sardinien blicken. Wir müssen jetzt zuschlagen – nicht nur, um unsere Zukunft zu schützen, sondern um wiederherzustellen, was unserer Vergangenheit entrissen wurde.\n\nDies ist kein Krieg der Ambitionen – es ist eine Pflicht. Eine Heimkehr. Eine Abrechnung.\n\nLasst unsere Schiffe die Meerenge mit Feuer im Herzen überqueren. Lassen Sie die etruskischen Außenposten einer nach dem anderen dem Ruf von Utturà Utalabì zum Opfer fallen! Lass die korsischen Hochländer unsere Banner im Wind sehen und wissen, dass die Sardaner sie nicht vergessen haben.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] muss jetzt handeln, damit die Geschichte nicht schreibt, dass wir damit zufrieden waren, unser eigenes Fleisch von fremden Händen regieren zu lassen. Die Insel im Norden ruft uns. Und wir werden antworten – nicht mit Worten, sondern mit Krieg.">  #NT!
 me_nuragic_01_inv.23.a: "Our brothers calls for aid, It is our duty."  <"Unsere Brüder rufen um Hilfe. Es ist unsere Pflicht.">  #NT!
 me_nuragic_23_tooltip: "$mission_completed_tooltip_1$ '#Y Aim To Corsica#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Ziel Korsika#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_24_title: "The Tip Of Corsica"  <"Die Spitze Korsikas">  #NT!
 me_nuragic_24_desc: "This harbor is both a beginning and a warning. It is the gateway to the north, the anvil upon which our fleets will be forged. Already, the sound of hammers echoes across the shore, and the scent of pitch and sawdust mixes with salt. The shipwrights work tirelessly. The Corsican highlanders bring timber from the inland forests. The Sardan banners fly high above the cliffs, daring the Etruscans to look across the sea and remember who has come to stay.\n\nWe did not come to Corsica for glory alone. We came for justice, for blood, for the old ties of kinship long severed. And now, with this harbor as our anchor, we will not be dislodged. Let this place be a reminder: the Sardan do not retreat. When we build, we build to endure.\n\nLet the rulers of Etruria gaze across the waters and see their future—not in visions, but in sails.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] has claimed this shore in the name of the mountain and the sea, and from this stone-bound harbor, the next chapter of our people will be written—across waves, across blades, across time itself."  <"Dieser Hafen ist ein Anfang und eine Warnung zugleich. Es ist das Tor zum Norden, der Amboss, auf dem unsere Flotten geschmiedet werden. Schon hallt das Geräusch von Hämmern über das Ufer, und der Geruch von Pech und Sägemehl vermischt sich mit Salz. Die Schiffbauer arbeiten unermüdlich. Die korsischen Hochländer bringen Holz aus den Wäldern im Landesinneren. Die Sardan-Banner wehen hoch über den Klippen und fordern die Etrusker heraus, über das Meer zu blicken und sich daran zu erinnern, wer gekommen ist, um zu bleiben.\n\nWir sind nicht nur wegen des Ruhms nach Korsika gekommen. Wir kamen für Gerechtigkeit, für Blut, für die alten Bande der Verwandtschaft, die längst getrennt waren. Und jetzt, mit diesem Hafen als unserem Anker, werden wir nicht vertrieben. Dieser Ort soll eine Erinnerung sein: Die Sardan weichen nicht zurück. Wenn wir bauen, bauen wir, um zu bestehen.\n\nLassen Sie die Herrscher Etruriens über das Wasser blicken und ihre Zukunft sehen – nicht in Visionen, sondern in Segeln.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] hat dieses Ufer im Namen des Berges und des Meeres beansprucht, und von diesem steinernen Hafen aus wird das nächste Kapitel unseres Volkes geschrieben – über Wellen, über Klingen, über die Zeit selbst hinweg.">  #NT!
 me_nuragic_01_inv.24.a: "From north to south, Corsica is now free."  <"Von Nord nach Süd ist Korsika nun frei.">  #NT!
 me_nuragic_24_tooltip: "$mission_completed_tooltip_1$ '#Y The Tip Of Corsica#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Die Spitze Korsikas#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_25_title: "Fate Of [GetProvince('(int32)3515').GetName]"  <"Schicksal von [GetProvince('(int32)3515').GetName]">  #NT!
 me_nuragic_25_desc: "As we walk through the streets of [GetProvince('(int32)3515').GetName], we do not see a foreign city—we see a lost memory. For [GetProvince('(int32)3515').GetName] was not always theirs. Before the Etruscans came with iron and coin, before even the Greeks built their fleeting outposts, this land was watched by eyes like ours. \n\nNow that it is under our hands again, we must ask: what shall become of Alalia?\n\nShall we raise her to the ground, so no foreign hand may ever claim her again? Let her stones tumble into the sea and her name be swallowed by time? Or shall we remake her—stone by stone, pillar by pillar—into a Sardan city, loyal to the mountain, to the sea, and to the memory of our ancestors? What we do with [GetProvince('(int32)3515').GetName] will echo beyond her walls.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] must choose wisely. For Alalia is not just a city—it is a symbol. Of return. Of reckoning. Of what it means to be Sardan in a world that has long tried to forget us.\n\nLet the decision be carved in stone, for all who come after."  <"Wenn wir durch die Straßen von [GetProvince('(int32)3515').GetName] gehen, sehen wir keine fremde Stadt – wir sehen eine verlorene Erinnerung. Denn [GetProvince('(int32)3515').GetName] gehörte nicht immer ihnen. Bevor die Etrusker mit Eisen und Münzen kamen und bevor die Griechen ihre flüchtigen Außenposten errichteten, wurde dieses Land von Augen wie unseren beobachtet. \n\nJetzt, da es wieder in unseren Händen ist, müssen wir uns fragen: Was soll aus Alalia werden?\n\nSollen wir sie zu Boden heben, damit keine fremde Hand sie jemals wieder beanspruchen kann? Sollen ihre Steine ​​ins Meer fallen und ihr Name von der Zeit verschluckt werden? Oder sollen wir sie – Stein für Stein, Säule für Säule – in eine sardische Stadt umwandeln, die dem Berg, dem Meer und der Erinnerung an unsere Vorfahren treu bleibt? Was wir mit [GetProvince('(int32)3515').GetName] machen, wird über ihre Mauern hinaus widerhallen.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] muss weise wählen. Denn Alalia ist nicht nur eine Stadt – es ist ein Symbol. Der Rückkehr. Der Abrechnung. Was es bedeutet, Sardan zu sein in einer Welt, die schon lange versucht hat, uns zu vergessen.\n\nLass die Entscheidung für alle, die danach kommen, in Stein gemeißelt sein.">  #NT!
 me_nuragic_01_inv.25.a: "[GetProvince('(int32)3515').GetName] is no more worthy of Sardo."  <"[GetProvince('(int32)3515').GetName] ist Sardos nicht mehr würdig.">  #NT!
 me_nuragic_01_inv.25.b: "Make [GetProvince('(int32)3515').GetName] prosper again."  <"Sorgen Sie dafür, dass [GetProvince('(int32)3515').GetName] wieder gedeiht.">  #NT!
 me_nuragic_25_tooltip: "$mission_completed_tooltip_1$ '#Y Fate Of Alalia#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Schicksal von Alalia#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_26_title: "Develop The North"  <"Entwickeln Sie den Norden">  #NT!
 me_nuragic_26_desc: "The north must thrive—not only for its own sake, but for the strength of all Sardinia.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] must now turn from the sword to the hammer, from the war camp to the workshop. The fields must be tamed, the forests made into ships and homes, and the people given reason to believe not only in freedom—but in the future.\n\nLet the northern winds carry the sound of new life. Let the stone speak again with the tongue of the towers."  <"Der Norden muss gedeihen – nicht nur um seiner selbst willen, sondern für die Stärke ganz Sardiniens.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] muss sich nun vom Schwert zum Hammer wenden, vom Kriegslager zur Werkstatt. Die Felder müssen gezähmt, die Wälder zu Schiffen und Häusern gemacht werden und den Menschen muss Grund gegeben werden, nicht nur an die Freiheit zu glauben, sondern auch an die Zukunft.\n\nLassen Sie die Nordwinde den Klang neuen Lebens tragen. Lass den Stein wieder mit der Zunge der Türme sprechen.">  #NT!
 me_nuragic_01_inv.26.a: "Balaria must be made whole."  <"Balaria muss geheilt werden.">  #NT!
 me_nuragic_26_tooltip: "$mission_completed_tooltip_1$ '#Y Develop The North#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Den Norden entwickeln#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_27_title: "Develop The South"  <"Entwickeln Sie den Süden">  #NT!
 me_nuragic_27_desc: "The coastal cities, once radiant with our customs, now wear foreign masks. They call themselves Sardo-Punic—half-ours, half-theirs—bowing to Carthage while feasting upon the fruits of Sardan soil. Their walls are built upon the bones of our ancestors, yet their banners bear not our sigils. Their markets speak a tongue not born from the mountain or the sea.\n\nInland, the Iliensian tribes live fragmented—proud, fierce, and stubborn. Each hill clan claims its own domain, each chieftain wary of the next. They remember the old ways, but not the strength we once shared when united. This division has left the south vulnerable—first to foreign influence, now to decay.\n\nThis must end.\n\nIf Sardinia is to rise again, Iliensia must be made whole. The tribes must be gathered under a single banner—not by force alone, but by oath and purpose. And the coastal cities must be reclaimed—not just with blades, but with truth: they were ours before they were anyone's.\n\nLet Tarshish hear our drums again. Let Sanaphar open its gates to the mountain's call. Let Sarcapos remember the builders who raised its quays. Let Sulki, Nura, and Karali be what they once were: not colonies, not trade ports, but Sardan cities, proud and free."  <"Die Küstenstädte, die einst von unseren Bräuchen strahlten, tragen heute ausländische Masken. Sie nennen sich sardo-punisch – halb von uns, halb von ihnen – und verneigen sich vor Karthago, während sie sich an den Früchten des sardischen Bodens erfreuen. Ihre Mauern sind auf den Knochen unserer Vorfahren errichtet, doch ihre Banner tragen nicht unsere Siegel. Ihre Märkte sprechen eine Sprache, die nicht aus dem Berg oder dem Meer stammt.\n\nIm Landesinneren leben die iliensischen Stämme zersplittert – stolz, wild und stur. Jeder Bergclan beansprucht seine eigene Domäne, jeder Häuptling ist vor dem nächsten auf der Hut. Sie erinnern sich an die alten Sitten, aber nicht an die Stärke, die wir einst vereint hatten. Diese Teilung hat den Süden verwundbar gemacht – zuerst für ausländische Einflüsse, jetzt für den Verfall.\n\nDas muss ein Ende haben.\n\nWenn Sardinien wieder auferstehen soll, muss Iliensia geheilt werden. Die Stämme müssen unter einem einzigen Banner versammelt werden – nicht nur durch Gewalt, sondern durch Eid und Absicht. Und die Küstenstädte müssen zurückerobert werden – nicht nur mit Klingen, sondern mit der Wahrheit: Sie gehörten uns, bevor sie irgendjemandem gehörten.\n\nLass Tarshish unsere Trommeln wieder hören. Lass Sanaphar seine Tore dem Ruf des Berges öffnen. Sarcapos soll sich an die Baumeister erinnern, die seine Kais errichtet haben. Lassen Sie Sulki, Nura und Karali das sein, was sie einst waren: keine Kolonien, keine Handelshäfen, sondern stolze und freie sardische Städte.">  #NT!
 me_nuragic_01_inv.27.a: "This land was our long before their arrive. It will thrive again like the times of old, by our hand."  <"Dieses Land gehörte uns schon lange vor ihrer Ankunft. Durch unsere Hand wird es wieder wie in alten Zeiten gedeihen.">  #NT!
 me_nuragic_27_tooltip: "$mission_completed_tooltip_1$ '#Y Develop The South#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Den Süden entwickeln#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_28_title: "Lesitanian Mines"  <"Lesitanische Minen">  #NT!
 me_nuragic_28_desc: "Let the shafts be cleared. Let the old tunnels be mapped and reinforced. Let the forges burn hot the Lesitanian ores. And let those who once bought our metals at great cost remember that the Sardan are no longer silent. The wealth of [GetProvince('(int32)3502').GetName] is not just buried in its soil—it is in its return.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] must now give the order, so that pick and torch may descend once more. For if the mines of [GetProvince('(int32)3502').GetName] awaken, so too shall the might of Sardinia. The mountain watches. The earth is ready. We must dig not just for ore—but for the future."  <"Lassen Sie die Schächte räumen. Lassen Sie die alten Tunnel kartieren und verstärken. Lassen Sie die Schmieden die lesitanischen Erze heiß verbrennen. Und diejenigen, die unsere Metalle einst teuer kauften, sollten sich daran erinnern, dass die Sardan nicht mehr schweigen. Der Reichtum von [GetProvince('(int32)3502').GetName] ist nicht nur in seinem Boden vergraben – er liegt in seiner Rückkehr.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] muss nun den Befehl erteilen, damit Spitzhacke und Fackel erneut herabsteigen können. Denn wenn die Minen von [GetProvince('(int32)3502').GetName] erwachen, wird auch die Macht Sardiniens erwachen. Der Berg wacht. Die Erde ist bereit. Wir müssen nicht nur nach Erz graben, sondern auch nach der Zukunft.">  #NT!
 me_nuragic_01_inv.28.a: "The Mines of Balaria shall awaken."  <"Die Minen von Balaria werden erwachen.">  #NT!
 me_nuragic_28_tooltip: "$mission_completed_tooltip_1$ '#Y Lesitanian Mines#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Lesitanische Minen#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_29_title: "Karensian Harbor"  <"Karensischer Hafen">  #NT!
 me_nuragic_29_desc: "Not just a pier for fishing boats or a landing for tired vessels, but a true harbor—strong, stone-bound, and shielded against the sea. A harbor where fleets can be born. Where merchants can dock. Where our warriors can leap from ship to shore without fear of the tide.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] must act swiftly. The sea waits for no one. And neither do the Sardan. Let the harbor of [GetProvince('(int32)3489').GetName] rise from the cliffs like a challenge to the waves. Let it stand as proof that even the wildest coast can be tamed by the will of our people."  <"Nicht nur ein Pier für Fischerboote oder ein Anlegeplatz für müde Schiffe, sondern ein echter Hafen – stark, von Steinen umgeben und gegen das Meer abgeschirmt. Ein Hafen, in dem Flotten geboren werden können. Wo Händler anlegen können. Wo unsere Krieger ohne Angst vor der Flut vom Schiff ans Ufer springen können.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] muss schnell handeln. Das Meer wartet auf niemanden. Und die Sardan auch nicht. Lassen Sie den Hafen von [GetProvince('(int32)3489').GetName] wie eine Herausforderung für die Wellen von den Klippen aufragen. Lassen Sie es als Beweis dafür gelten, dass selbst die wildeste Küste durch den Willen unseres Volkes gezähmt werden kann.">  #NT!
 me_nuragic_01_inv.29.a: "Tame the Cliff, tame the sea."  <"Zähme die Klippe, zähme das Meer.">  #NT!
 me_nuragic_29_tooltip: "$mission_completed_tooltip_1$ '#Y Karensian Harbor#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Karensischer Hafen#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_290_title: "The Marble of [GetProvince('(int32)3489').GetName]"  <"Der Marmor von [GetProvince('(int32)3489').GetName]">  #NT!
 me_nuragic_290_desc: "At [GetProvince('(int32)3489').GetName], where the harsh cliffs meet the salt-wind of the Tyrrenian Sea, the land has revealed a secret long buried beneath the vine-covered slopes—a vein of pale marble, strong, unblemished, and radiant in the morning sun like the bones of the Earth herself.\n\nAlready, whispers echo in the halls of the Sardan: Should the hills of Kares trade the press for the chisel?"  <"Bei [GetProvince('(int32)3489').GetName], wo die schroffen Klippen auf den Salzwind des Tyrrhenischen Meeres treffen, hat das Land ein Geheimnis enthüllt, das lange unter den mit Weinreben bewachsenen Hängen verborgen war – eine Ader aus blassem Marmor, stark, makellos und strahlend in der Morgensonne wie die Knochen der Erde selbst.\n\nBereits hallt in den Hallen des Sardan ein Flüstern wider: Sollten die Hügel von Kares die Presse gegen den Meißel eintauschen?">  #NT!
 me_nuragic_01_inv.290.a: "Invest in Marble quarries!"  <"Investieren Sie in Marmorsteinbrüche!">  #NT!
 me_nuragic_01_inv.290.b: "It is not worth it."  <"Es lohnt sich nicht.">  #NT!
 me_nuragic_01_inv.290.c: "Remind me in 10 years."  <"Erinnere mich in 10 Jahren daran.">  #NT!
 me_nuragic_290_tooltip.b: "[GetProvince('(int32)3489').GetName] will continue to produce wine."  <"[GetProvince('(int32)3489').GetName] wird weiterhin Wein produzieren.">  #NT!
 me_nuragic_290_tooltip.c: "The event will happen again in 10 years, useful in case we don't have enough finance."  <"Die Veranstaltung wird in 10 Jahren erneut stattfinden, was nützlich ist, falls wir nicht genug Geld haben.">  #NT!
  
 me_nuragic_291_title: "The Pompìa"  <"Die Pompia">  #NT!
 me_nuragic_291_desc: "In the groves of the northeast, where the winds from the sea meet the breath of the mountains, there grows a fruit unlike any other—a gnarled, golden sphere whose scent stirs memory and whose name is whispered with reverence: Pompìa.\n\nTo nurture it would be to embrace what is rare, what is uniquely ours. In a world of olives and wine and wheat, it would set Sardinia apart—a treasure no foreign trader can claim as his own.\n\nNow, word reaches the court that the Pompìa thrives again—wild, uncultivated, surviving only in the stubborn orchards of a few coastal families. The question stirs within the council: Shall we invest in this fruit?"  <"In den Wäldern im Nordosten, wo die Winde des Meeres auf den Atem der Berge treffen, wächst eine Frucht wie keine andere – eine knorrige, goldene Kugel, deren Duft die Erinnerung weckt und deren Name mit Ehrfurcht geflüstert wird: Pompìa.\n\nUm sie zu pflegen, würde man das Seltene, das Einzigartige von uns annehmen. In einer Welt voller Oliven, Wein und Weizen würde es Sardinien auszeichnen – ein Schatz, den kein ausländischer Händler für sich beanspruchen kann.\n\nJetzt erreicht der Hof die Nachricht, dass die Pompìa wieder gedeiht – wild, unkultiviert und nur in den hartnäckigen Obstgärten einiger Küstenfamilien überlebt. Im Rat herrscht die Frage: Sollen wir in diese Frucht investieren?">  #NT!
 me_nuragic_01_inv.291.a: "We shall plant whole farms of Pompìa!"  <"Wir werden ganze Farmen von Pompia bepflanzen!">  #NT!
 me_nuragic_01_inv.291.b: "It's just a bitter citrus."  <"Es ist nur eine bittere Zitrusfrucht.">  #NT!
 me_nuragic_01_inv.291.c: "Remind me in 10 years."  <"Erinnere mich in 10 Jahren daran.">  #NT!
 me_nuragic_291_tooltip.b: "[GetProvince('(int32)3503').GetName] will continue to produce wine."  <"[GetProvince('(int32)3503').GetName] wird weiterhin Wein produzieren.">  #NT!
 me_nuragic_291_tooltip.c: "The event will happen again in 10 years, useful in case we don't have enough finance."  <"Die Veranstaltung wird in 10 Jahren erneut stattfinden, was nützlich ist, falls wir nicht genug Geld haben.">  #NT!
  
 me_nuragic_292_title: "The Pompìa Trees have grown productive!"  <"Die Pompia-Bäume sind produktiv geworden!">  #NT!
 me_nuragic_292_desc: "When we planted the first saplings, many doubted. The fruit was rare, stubborn, known only in whispers passed down from village to village. It had survived in the wild corners of our land, forgotten by merchants and ignored by kings. But the Sardan remembered. We saw in the Pompìa not just a fruit—but a symbol.\n\nThe trees of Pompìa have borne their first fruit. Gnarled and noble, with leaves like weathered bronze and roots sunk deep into Sardan soil, these trees now shimmer with golden orbs.\n\nWhat shall we do now?"  <"Als wir die ersten Setzlinge pflanzten, zweifelten viele. Die Frucht war selten, hartnäckig und nur im Flüsterton bekannt, der von Dorf zu Dorf weitergegeben wurde. Es hatte in den wilden Ecken unseres Landes überlebt, von Händlern vergessen und von Königen ignoriert. Aber der Sardan erinnerte sich. Wir sahen in der Pompìa nicht nur eine Frucht, sondern ein Symbol.\n\nDie Bäume von Pompìa haben ihre ersten Früchte getragen. Knorrig und edel, mit Blättern wie verwitterte Bronze und Wurzeln, die tief in der sardischen Erde vergraben sind, schimmern diese Bäume jetzt mit goldenen Kugeln.\n\nWas sollen wir jetzt tun?">  #NT!
 me_nuragic_01_inv.292.a: "The first crop is enough."  <"Die erste Ernte reicht aus.">  #NT!
 me_nuragic_01_inv.292.b: "Confiscate those farms, only the king shall eat pompìa!"  <"Beschlagnahmt diese Höfe, nur der König darf Pompìa essen!">  #NT!
 me_nuragic_01_inv.292.c: "We shall invest more on these farms!"  <"Wir werden mehr in diese Betriebe investieren!">  #NT!
 me_nuragic_292_tooltip.b: "The pompìa trees will now become property of the king."  <"Die Pompia-Bäume werden nun Eigentum des Königs.">  #NT!
 me_nuragic_292_tooltip.c: "The king will invest into the development of better farmlands for Pompìa trees."  <"Der König wird in die Entwicklung besserer Ackerflächen für Pompia-Bäume investieren.">  #NT!
  
 me_nuragic_293_title: "The Development of Pompìa Farmlands"  <"Die Entwicklung des Ackerlandes von Pompia">  #NT!
 me_nuragic_293_desc: "We will not allow this fruit, born of our land and blood, to return to obscurity. New groves shall be planted—rows of saplings guided by skilled hands and guarded like sacred flame. Irrigation channels will be carved through rock and root to feed them in the dry months. Stone walls shall rise to shield them from wind and theft. And around these groves, villages will grow—homes for those whose lives are now bound to the fruit, from farmer to perfumer, from preserver to priest."  <"Wir werden nicht zulassen, dass diese aus unserem Land und Blut geborene Frucht wieder in Vergessenheit gerät. Neue Haine sollen gepflanzt werden – Reihen von Setzlingen, die von erfahrenen Händen geführt und wie eine heilige Flamme bewacht werden. Bewässerungskanäle werden in Felsen und Wurzeln gehauen, um sie in den trockenen Monaten mit Wasser zu versorgen. Steinmauern werden errichtet, um sie vor Wind und Diebstahl zu schützen. Und rund um diese Haine werden Dörfer wachsen – Häuser für diejenigen, deren Leben jetzt an die Früchte gebunden ist, vom Bauern bis zum Parfümeur, vom Konservierer bis zum Priester.">  #NT!
 me_nuragic_01_inv.293.a: "More trees shall be planted!"  <"Es sollen noch mehr Bäume gepflanzt werden!">  #NT!
 me_nuragic_01_inv.293.b: "Plant trees and tax the locals out of it."  <"Pflanzen Sie Bäume und besteuern Sie die Einheimischen.">  #NT!
 me_nuragic_01_inv.293.c: "I'll personally follow the works."  <"Ich werde die Arbeiten persönlich verfolgen.">  #NT!
  
 me_nuragic_30_title: "Urbanize Balaria"  <"Balaria urbanisieren">  #NT!
 me_nuragic_30_desc: "For too long, the northwestern coast has been a frontier—rich, but without a voice. Its warriors strong, but without a banner. Its fields fertile, but without a granary to feed more than a village. [GetProvince('(int32)3500').GetName] shall become that voice, that banner, that storehouse of prosperity.\n\nThis is not a conquest, but a gift. To the Balarians, whose strength held this land while others looked elsewhere. To the Sardan, who now return not only as rulers, but as builders. And to the generations yet unborn, who shall walk beneath the walls of [GetProvince('(int32)3500').GetName] and call it home.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] knows: a people without a city are wind without sail. With [GetProvince('(int32)3500').GetName], the north shall no longer drift—it shall lead."  <"Zu lange war die Nordwestküste eine Grenze – reich, aber ohne Stimme. Seine Krieger sind stark, aber ohne Banner. Die Felder sind fruchtbar, aber es gibt keinen Getreidespeicher, der mehr als ein Dorf ernähren könnte. [GetProvince('(int32)3500').GetName] wird diese Stimme, dieses Banner, dieser Vorrat an Wohlstand werden.\n\nDies ist keine Eroberung, sondern ein Geschenk. An die Balarianer, deren Stärke dieses Land hielt, während andere sich woanders umsahen. An die Sardan, die nun nicht nur als Herrscher, sondern auch als Baumeister zurückkehren. Und an die noch ungeborenen Generationen, die unter den Mauern von [GetProvince('(int32)3500').GetName] wandeln und es ihr Zuhause nennen werden.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] weiß: Ein Volk ohne Stadt ist Wind ohne Segel. Mit [GetProvince('(int32)3500').GetName] wird der Norden nicht mehr driften – er wird führen.">  #NT!
 me_nuragic_01_inv.30.a: "We are Balarians, we are Ioleans. We are Sardan."  <"Wir sind Balarianer, wir sind Ioleaner. Wir sind Sardan.">  #NT!
 me_nuragic_30_tooltip: "$mission_completed_tooltip_1$ '#Y Urbanize Balaria#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Balaria urbanisieren#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_31_title: "Consolidate Balaria"  <"Balaria konsolidieren">  #NT!
 me_nuragic_31_desc: "In the west, the mines of [GetProvince('(int32)3502').GetName] thunder once more, pulled from the grip of time. Their lead sings in the forges of our craftsmen, and their silver travels down rivers to the sea. What was once silent is now a furnace of life.\n\nIn the heart of the Nurrensian Plain, water flows where dust once ruled. Canals stretch like veins across the fields, and the soil, long forgotten by kings, feeds villages and granaries anew. [GetProvince('(int32)3500').GetName] rises with it—a city of stone and vision, a beacon to all Balarians.\n\nTo the east, where waves shatter against the cliffs, we have built harbors. At [GetProvince('(int32)3489').GetName], the wind no longer howls in solitude—it carries the scent of pitch, of sails, of movement. The sea, once an obstacle, is now our road.\n\nThe earth remembers its masters, and the towers cast their shadows long once more."  <"Im Westen donnern erneut die Minen von [GetProvince('(int32)3502').GetName], entrissen aus dem Griff der Zeit. Ihr Blei singt in den Schmieden unserer Handwerker, und ihr Silber wandert flussabwärts bis zum Meer. Was einst still war, ist jetzt ein Ofen des Lebens.\n\nIm Herzen der Nurrensischen Ebene fließt Wasser, wo einst Staub herrschte. Kanäle ziehen sich wie Adern über die Felder, und der von Königen längst vergessene Boden ernährt Dörfer und Getreidespeicher neu. [GetProvince('(int32)3500').GetName] erhebt sich mit ihr – eine Stadt aus Stein und Vision, ein Leuchtfeuer für alle Balarianer.\n\nIm Osten, wo Wellen an die Klippen schlagen, haben wir Häfen gebaut. Bei [GetProvince('(int32)3489').GetName] heult der Wind nicht mehr einsam – er trägt den Geruch von Pech, von Segeln, von Bewegung. Das Meer, einst ein Hindernis, ist jetzt unser Weg.\n\nDie Erde erinnert sich an ihre Herren und die Türme werfen noch einmal lange ihre Schatten.">  #NT!
 me_nuragic_01_inv.31.a: "Enemies of Sardan, have fear of Nuraghes."  <"Feinde von Sardan haben Angst vor Nuraghen.">  #NT!
 me_nuragic_31_tooltip: "$mission_completed_tooltip_1$ '#Y Consolidate Balaria#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Balaria konsolidieren#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_32_title: "Iolean Plain"  <"Ioleische Ebene">  #NT!
 me_nuragic_32_desc: "Let the old irrigation channels be cleared. Let oxen plow where weeds have taken root. Let villages rise where ruins crumble. Our people, long exiled to the mountains and hills, shall return to the fields their ancestors once walked. We shall not only feed our own, but trade once again with the world, as we did when the Sardan name meant prosperity as much as power.\n\nTo rebuild these farmlands is not just to restore food or wealth. It is to restore memory. Dignity. The Iolean Plain is not merely a prize of war—it is the hearth of our rebirth.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] must act swiftly. Seasons wait for no one. And the plain, long starved of purpose, must feel the weight of the plow once again—this time not for the gain of Carthage, but for the glory of Sardinia."  <"None">  #NT!
 me_nuragic_01_inv.32.a: "We now return to what was once our. Be praised Sardo."  <"Wir kehren nun zu dem zurück, was einst unser war. Sei gepriesen, Sardo.">  #NT!
 me_nuragic_32_tooltip: "$mission_completed_tooltip_1$ '#Y Iolean Plain#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Ioleische Ebene#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_320_title: "The Ruins of Nurac Barumenis"  <"Die Ruinen von Nurac Barumenis">  #NT!
 me_nuragic_320_desc: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] walks alone among the ruins of Nurac Barumenis, where the wild grass has crept between shattered flagstones, and fig trees claw at the sky through the old tower's heart. Time has worn down its walls, but not its soul. Each basalt block, weathered and dark, still holds the weight of those who carved it—our ancestors, the builders of towers.\n\nThe locals say this Nurac was the seat of a powerful lineage, a place where the sky and the stone once communed. They say the well still gives water, and the sun still strikes true through the sacred gate at the equinox.\n\nWhat shall we do of this place?"  <"[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] geht alleine zwischen den Ruinen von Nurac Barumenis spazieren, wo wildes Gras zwischen zerbrochenen Steinplatten gekrochen ist und Feigenbäume durch das Herz des alten Turms in den Himmel ragen. Die Zeit hat ihre Mauern zermürbt, aber nicht ihre Seele. Jeder Basaltblock, verwittert und dunkel, trägt noch immer das Gewicht derer, die ihn geschnitzt haben – unserer Vorfahren, der Turmbauer.\n\nDie Einheimischen sagen, dass dieser Nurac der Sitz einer mächtigen Linie war, ein Ort, an dem einst der Himmel und der Stein miteinander kommunizierten. Man sagt, dass der Brunnen immer noch Wasser spendet und die Sonne immer noch durch das heilige Tor zur Tagundnachtgleiche scheint.\n\nWas sollen wir mit diesem Ort machen?">  #NT!
 me_nuragic_01_inv.320.a: "Rebuild this Nurac to it's former glory."  <"None">  #NT!
 me_nuragic_01_inv.320.b: "We have no interest in this forsaken place."  <"None">  #NT!
 me_nuragic_01_inv.320.c: "Remind me in 10 years."  <"Erinnere mich in 10 Jahren daran.">  #NT!
 me_nuragic_320_tooltip.a: "The gigantic Nurac at [GetProvince('(int32)3482').GetName] will be rebuilt."  <"None">  #NT!
 me_nuragic_320_tooltip.b: "This place, once a great Nurac, has been forsaken by our people. Not investing resources here is partly appreciated by the once rivals of this land."  <"None">  #NT!
 me_nuragic_320_tooltip.c: "The event will happen again in 10 years, useful in case we don't have enough finance."  <"Die Veranstaltung wird in 10 Jahren erneut stattfinden, was nützlich ist, falls wir nicht genug Geld haben.">  #NT!
  
 me_nuragic_321_title: "Further Resources Required for Nurac Barumenis"  <"Weitere Ressourcen für Nurac Barumenis erforderlich">  #NT!
 me_nuragic_321_desc: "What was thought to be a modest restoration has revealed itself as a task of far greater depth. The foundations of Nurac Barumenis, buried by time and silence, are older and more complex than our masons had believed. Beneath the surface, the inner chambers sprawl wider, the stone blocks lie deeper, and the ancient cisterns require full rebinding. This is no mere outpost. This is a sacred fortress—a structure meant to endure centuries, and to rebuild it as it once stood is no simple feat."  <"None">  #NT!
 me_nuragic_01_inv.321.a: "Give the masons more than they require, spare no expenses."  <"None">  #NT!
 me_nuragic_01_inv.321.b: "Meet the workers demands."  <"None">  #NT!
 me_nuragic_01_inv.321.c: "Drain some resources, this is costing too much!"  <"None">  #NT!
 me_nuragic_01_inv.321.d: "Give them some money and tax the locals for the other half."  <"None">  #NT!
 me_nuragic_01_inv.321.e: "I could convince the clans to contribute to the expenses."  <"None">  #NT!
 me_nuragic_321_tooltip.a: "All ordinary and extraordinary expenses will get covered, including any unexpected cost. The works will get greatly speeded up."  <"None">  #NT!
 me_nuragic_321_tooltip.b: "Cover all ordinary expenses, although unexpected costs may delay the construction. The works are considerably speeded up."  <"Decken Sie alle normalen Kosten ab, auch wenn unerwartete Kosten den Bau verzögern können. Die Arbeiten werden erheblich beschleunigt.">  #NT!
 me_nuragic_321_tooltip.c: "Draining resources from the project will reduce the cost at the expenses of a far longer work-completion timeframe."  <"None">  #NT!
 me_nuragic_321_tooltip.d: "All ordinary expenses are covered, partly by us and partly by the revenues of a new tax imposed to the locals. The works are partly speeded up."  <"Alle gewöhnlichen Ausgaben werden teilweise von uns und teilweise durch die Einnahmen einer neuen Steuer gedeckt, die den Einheimischen auferlegt wird. Die Arbeiten werden teilweise beschleunigt.">  #NT!
 me_nuragic_321_tooltip.e: "All clans of our nation contribute together with us to cover the ordinary expenses, the work-completion is considerably speeded up."  <"None">  #NT!
  
 me_nuragic_322_title: "The Rebirth of Nurac Barumenis"  <"None">  #NT!
 me_nuragic_322_desc: "Let it be known to all Sardan, near and far, that Nurac Barumenis, long a sentinel of our ancient strength, now rises once more from the dust of ages.\n\nWhere once stood only ruins and whispered legends, the great keep of Barumenis now reaches again toward the heavens. Built anew in the manner of our ancestors, it stands upon a 12-meter-wide foundation, climbing to nearly 19 meters in height, with three levels and a broad terrace at its crown. Its southern gate opens as it once did, and within, the chambers arch in the sacred form of the tholos, echoing the architectural soul of the Nuragic people.\n\nAround this central bastion, four towers, rebuilt stone by stone, stand firm—each joined by straight curtain walls, each crowned with projecting corbels that now hold balconies and defense platforms, ready to guard our land. The arrow slits, once blocked by time, now watch over the realm once more.\n\nA complex web of passageways, stairs carved within the walls, sloped corridors, and bridges—both fixed and movable—bind this citadel in living motion. From the parapets to the towers, from the heart of the keep to the semi-elliptical courtyard, every level speaks of strength and purpose. That courtyard, which holds a deep well of pure spring water, now welcomes again the feet of our people. From it open the doors to the chambers of the eastern, western, southern, and northern towers, as well as to the sanctum at the heart of the keep.\n\nKnow this: what we rebuild is not merely stone—it is memory. For during the long night of time, when earth shifted and walls failed, our ancestors cloaked the bastion in mighty new walls, three meters thick, to shield it from collapse. They opened a new gate to the northeast, and surrounded it with seven new towers. Around these walls, the village stirred again, and the spirit of the land was not broken.\n\nFrom these grounds, now made sacred once more, we have uncovered treasures—relics of the Mycenaeans, who once knew the name of Barumenis. They bear witness to our ancient ties to the world beyond the sea.\n\nAnd now, to the east and south of the fortress, the homes of our people have returned. Two hundred houses, within and beyond the outer wall, rise from the earth. Let all remember the Council Hut, with its stone bench and sacred niches, where elders shall speak again, and where we have found a model of the nuraghe itself—a sign from the past, a promise for the future.\n\nLet this be the call to our people: Nurac Barumenis stands anew. The past lives in us, and we walk into tomorrow carrying the strength of ages."  <"None">  #NT!
 me_nuragic_01_inv.322.a: "Be praised Sardò. We shall have a feast!"  <"None">  #NT!
 me_nuragic_01_inv.322.b: "This costed us too much..."  <"None">  #NT!
 me_nuragic_322_tooltip.a: "All the nation rejoices at the completion of Nurac Barumenis!"  <"None">  #NT!
 me_nuragic_322_tooltip.b: "All the nation rejoices, except our pockets..."  <"None">  #NT!
  
 me_nuragic_33_title: "The Silver Veins"  <"None">  #NT!
 me_nuragic_33_desc: "Sardo has returned this land to us—but it is not enough to reclaim. We must restore. Rebuild. Invest. The silver still sleeps. The iron still waits. The lead still gleams in the dark. Let the mines be reforged into pillars of our strength—this time not for foreign lords, but for the people of Sardinia.\n\nLet the roads to the mines be cleared. Let smiths be summoned. Let furnaces rise anew in [GetProvince('(int32)3485').GetName]. These are not mere resources—they are the spine of our future. With iron, we forge weapons and walls. With silver, we mint coin and legacy. With lead, we trade and strengthen the bonds beyond our shores.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] must see what our ancestors once saw: that the wealth beneath the hills is not meant to be hoarded, but harnessed. The mines are not just Sardinia's past—they are Sardinia's promise."  <"None">  #NT!
 me_nuragic_01_inv.33.a: "The deep veins of the south belong to the Sardan—and they shall beat once more."  <"None">  #NT!
 me_nuragic_33_tooltip: "$mission_completed_tooltip_1$ '#Y The Silver Veins#!' $mission_completed_tooltip_2$"  <"None">  #NT!
  
 me_nuragic_34_title: "[GetProvince('(int32)3493').GetName] Reclaimed"  <"None">  #NT!
 me_nuragic_34_desc: "Long ago, when the sea was young and the towers were new, [GetProvince('(int32)3493').GetName] stood as a jewel upon the western coast. She was our gateway to the west—her harbors deep, her walls strong, her streets alive with the tongue of traders, priests, and warriors. From her quarries came stone. From her smithies came bronze. And from her council halls came wisdom that shaped the will of Sardinia.\n\nShe was not just a city. She was the mirror of who we were.\n\nAnd then came the long night.\n\nThe Carthaginians, hungry for our coasts, descended like locusts. They took [GetProvince('(int32)3493').GetName] with treachery and steel. They defiled her temples, replaced her banners with foreign sigils, and turned her sacred harbor into a vessel for their dominion. For generations, we watched from the hills and remembered. We spoke her name in whispers, and vowed she would be ours again.\n\nAnd now, she is.\n\nThe banners of Carthage have been torn from her towers. The foreign garrisons scattered. But her reconquest is not the end—it is the beginning. The temples must be cleansed. The walls rebuilt. Her harbors restored, her markets reopened. [GetProvince('(int32)3493').GetName] must rise not merely as a relic, but as a symbol of what was—and what shall be again. Sardinia is not whole without her."  <"Vor langer Zeit, als das Meer noch jung und die Türme neu waren, stand [GetProvince('(int32)3493').GetName] wie ein Juwel an der Westküste. Sie war unser Tor zum Westen – ihre Häfen waren tief, ihre Mauern stark, ihre Straßen waren voller Sprachen von Händlern, Priestern und Kriegern. Aus ihren Steinbrüchen kam Stein. Aus ihren Schmieden kam Bronze. Und aus ihren Ratssälen kam Weisheit, die den Willen Sardiniens prägte.\n\nSie war nicht nur eine Stadt. Sie war der Spiegel dessen, wer wir waren.\n\nUnd dann kam die lange Nacht.\n\nDie Karthager, hungrig nach unseren Küsten, kamen wie Heuschrecken herab. Sie nahmen [GetProvince('(int32)3493').GetName] mit Verrat und Stahl ein. Sie entweihten ihre Tempel, ersetzten ihre Banner durch fremde Siegel und verwandelten ihren heiligen Hafen in ein Gefäß ihrer Herrschaft. Über Generationen hinweg haben wir von den Hügeln aus zugesehen und uns erinnert. Wir sprachen flüsternd ihren Namen und schworen, dass sie wieder uns gehören würde.\n\nUnd jetzt ist sie es.\n\nDie Banner Karthagos wurden von ihren Türmen gerissen. Die ausländischen Garnisonen zerstreuten sich. Aber ihre Rückeroberung ist nicht das Ende – sie ist der Anfang. Die Tempel müssen gereinigt werden. Die Mauern wurden wieder aufgebaut. Ihre Häfen wurden wiederhergestellt, ihre Märkte wieder geöffnet. [GetProvince('(int32)3493').GetName] muss nicht nur als Reliquie auferstehen, sondern als Symbol für das, was war – und was wieder sein wird. Sardinien ist ohne sie nicht ganz.">  #NT!
 me_nuragic_01_inv.34.a: "Let Nuraghe be raised anew. Let the sea know the name of [GetProvince('(int32)3493').GetName] once more."  <"None">  #NT!
 me_nuragic_34_tooltip: "$mission_completed_tooltip_1$ '#Y [GetProvince('(int32)3493').GetName] Reclaimed#!' $mission_completed_tooltip_2$"  <"None">  #NT!
  
 me_nuragic_340_title: "The Carthaginian Elite of [GetProvince('(int32)3493').GetName]"  <"None">  #NT!
 me_nuragic_340_desc: "The Carthaginian elite of [GetProvince('(int32)3493').GetName], sons of Tyre and inheritors of the Punic tongue, pace behind their stone colonnades, veiled in linen and suspicion. Their ships no longer crowd the harbor. Their guards no longer stand at the gates. The standards of the Sardan now fly where once the sigils of Tanit rippled proud against the sea breeze.\n\nSome among them still cling to pride: 'We brought coin, we brought law, we brought the gods of fire and sea.' But they know, deep within, that they are no longer the wind—only the dust it lifts.\n\nOthers have begun to whisper more carefully in the old tongue of the towers, begun to inquire about Nuragic customs, begun to speak of loyalty, of service, of adaptation.\n\nWhat place have these Punic merchants in a city once again ruled by the blood of the Tower-Builders? Will their children be asked to serve? Or will they be made to watch, as the city rises without them?"  <"None">  #NT!
 me_nuragic_01_inv.340.a: "Accept them as our own."  <"None">  #NT!
 me_nuragic_01_inv.340.b: "Enslave them and take their belongings."  <"Versklaven Sie sie und nehmen Sie ihr Hab und Gut.">  #NT!
 me_nuragic_01_inv.340.c: "Kill them all."  <"Töte sie alle.">  #NT!
 me_nuragic_01_inv.340.d: "They may attend to their customs, for now, if they pay enough."  <"None">  #NT!
 me_nuragic_01_inv.340.e: "I know how to arrange this."  <"None">  #NT!
 me_nuragic_340_tooltip.a: "All Carthaginians of [GetProvince('(int32)3493').GetName] will embrance nuragic religion and assimilate to our culture"  <"Alle Karthager von [GetProvince('(int32)3493').GetName] werden die nuraghische Religion annehmen und sich unserer Kultur anpassen">  #NT!
 me_nuragic_340_tooltip.b: "All Carthaginians of [GetProvince('(int32)3493').GetName] will become slaves, those who do not obey will get killed."  <"None">  #NT!
 me_nuragic_340_tooltip.c: "Our men will enter house by house in search of all Carthaginians which inhabit the area, they cannot hide, none can escape."  <"None">  #NT!
 me_nuragic_340_tooltip.d: "Carthaginians are forced to pay a copious amount of gold to maintain their customs, although this doesn't stop us to assimilate them later on."  <"Die Karthager sind gezwungen, reichlich Gold zu zahlen, um ihre Bräuche aufrechtzuerhalten, was uns jedoch nicht davon abhält, sie später zu assimilieren.">  #NT!
 me_nuragic_340_tooltip.e: "All Carthaginians of [GetProvince('(int32)3493').GetName] will embrance nuragic religion and assimilate to our culture. For our gratitude, the important families of the city will arrange us a copious amount of gold."  <"Alle Karthager von [GetProvince('(int32)3493').GetName] werden die nuraghische Religion annehmen und sich unserer Kultur anpassen. Als Dank werden uns die wichtigen Familien der Stadt reichlich Gold zur Verfügung stellen.">  #NT!
  
 me_nuragic_35_title: "Invest In [GetProvince('(int32)3486').GetName]"  <"None">  #NT!
 me_nuragic_35_desc: "We must invest—not simply to restore, but to transform.\n\nLet her harbor be deepened, her docks reinforced with stone. Let storehouses rise and shipwrights be summoned. Let the city grow beyond her old walls, fed by new roads from the interior and guarded by towers that watch the sea. Trade must flow like water through her streets—not just fish and salt, but bronze, oil, linen, and letters.\n\n[GetProvince('(int32)3486').GetName] may never rival the ancient splendor of [GetProvince('(int32)3484').GetName] or the sacred legacy of [GetProvince('(int32)3493').GetName], but she holds a destiny of her own. She is the gateway—a door flung open to the rising sun and the merchant winds beyond.\n\nTo ignore her now would be to close that door forever."  <"Wir müssen investieren – nicht nur zur Wiederherstellung, sondern zur Umgestaltung.\n\nIhr Hafen soll vertieft und ihre Docks mit Steinen verstärkt werden. Lasst Lagerhäuser entstehen und Schiffbauer gerufen werden. Lassen Sie die Stadt über ihre alten Mauern hinaus wachsen, von neuen Straßen aus dem Landesinneren gespeist und von Türmen bewacht, die das Meer beobachten. Der Handel muss wie Wasser durch ihre Straßen fließen – nicht nur Fisch und Salz, sondern auch Bronze, Öl, Leinen und Briefe.\n\n[GetProvince('(int32)3486').GetName] wird vielleicht nie mit der alten Pracht von [GetProvince('(int32)3484').GetName] oder dem heiligen Erbe von [GetProvince('(int32)3493').GetName] mithalten können, aber sie hat ein eigenes Schicksal. Sie ist das Tor – eine Tür, die der aufgehenden Sonne und den dahinter strömenden Handelswinden offensteht.\n\nSie jetzt zu ignorieren würde bedeuten, diese Tür für immer zu schließen.">  #NT!
 me_nuragic_01_inv.35.a: "The east calls. [GetProvince('(int32)3486').GetName] must answer."  <"Der Osten ruft. [GetProvince('(int32)3486').GetName] muss antworten.">  #NT!
 me_nuragic_35_tooltip: "$mission_completed_tooltip_1$ '#Y Invest In [GetProvince('(int32)3486').GetName]#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Investieren in [GetProvince('(int32)3486').GetName]#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_350_title: "The Goods of [GetProvince('(int32)3486').GetName]"  <"Die Waren von [GetProvince('(int32)3486').GetName]">  #NT!
 me_nuragic_350_desc: "[GetProvince('(int32)3486').GetName], once a modest coastal outpost, now stands poised to become a vital link in Sardinia's eastern trade. But a city is more than stone and sails—it must produce, and what it offers the world will define how the world sees it.\n\nShall [GetProvince('(int32)3486').GetName] be a city of glass?\n\nThe sand of the southern shores is fine and clear. The sun burns hot, the sea wind steady—ideal for the ancient craft of glassblowing. To choose glass is to choose refinement, beauty, and luxury. The jars, beads, and vessels of [GetProvince('(int32)3486').GetName] could fetch high price in Etruria, Sicilia, and beyond. Let the fire be kindled in the kilns, and let Sarcapos dazzle the world.\n\nShall [GetProvince('(int32)3486').GetName] be a city of cloth\n\nThe flocks of Iliensia grow fat on the green plains, and the spinners and dyers of Karali already whisper of new looms. To choose cloth is to choose strength through trade. Robes, linen, and sails—woven in Sarcapos and sent eastward—could clothe noble and sailor alike. Let the workshops rise, and let [GetProvince('(int32)3486').GetName] dress the world.\n\nOr shall [GetProvince('(int32)3486').GetName] be a city of honey\n\nThe hills inland hum with bees, their hives nested among myrtle and wild thyme. To choose honey is to choose nature's gold. Sought by healers and priests, merchants and kings, the honey of [GetProvince('(int32)3486').GetName] could sweeten the tongues of foreign courts and line the jars of temples. Let the keepers build their hives, and let [GetProvince('(int32)3486').GetName] nourish the world.\n\nEach path holds promise. Each speaks to a different face of the Sardan spirit—art, industry, and harmony.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] must choose wisely. For once the choice is made, it shall echo through the markets, temples, and ships of the eastern sea.\n\nWhat shall [GetProvince('(int32)3486').GetName] be known for?"  <"[GetProvince('(int32)3486').GetName], einst ein bescheidener Außenposten an der Küste, ist nun bereit, ein wichtiges Bindeglied im Osthandel Sardiniens zu werden. Aber eine Stadt ist mehr als Stein und Segel – sie muss produzieren, und was sie der Welt bietet, wird bestimmen, wie die Welt sie sieht.\n\nSoll [GetProvince('(int32)3486').GetName] eine Stadt aus Glas sein?\n\nDer Sand der Südküste ist fein und klar. Die Sonne brennt heiß, der Meereswind ist stetig – ideal für das alte Handwerk des Glasblasens. Wer sich für Glas entscheidet, entscheidet sich für Raffinesse, Schönheit und Luxus. Die Gläser, Perlen und Gefäße von [GetProvince('(int32)3486').GetName] könnten in Etrurien, Sizilien und darüber hinaus hohe Preise erzielen. Lass das Feuer in den Öfen entfachen und lass Sarcapos die Welt verzaubern.\n\nSoll [GetProvince('(int32)3486').GetName] eine Stadt aus Stoff sein\n\nDie Herden von Iliensia werden auf den grünen Ebenen groß, und die Spinner und Färber von Karali flüstern bereits von neuen Webstühlen. Sich für Stoff zu entscheiden bedeutet, Stärke durch Handel zu wählen. Roben, Leinen und Segel – in Sarcapos gewebt und nach Osten geschickt – konnten Adlige und Seeleute gleichermaßen kleiden. Lasst die Werkstätten entstehen und lasst [GetProvince('(int32)3486').GetName] die Welt schmücken.\n\nOder soll [GetProvince('(int32)3486').GetName] eine Stadt aus Honig sein\n\nDie Hügel im Landesinneren summen vor Bienen, ihre Bienenstöcke nisteten zwischen Myrten und wildem Thymian. Wer sich für Honig entscheidet, entscheidet sich für das Gold der Natur. Der von Heilern und Priestern, Kaufleuten und Königen begehrte Honig von [GetProvince('(int32)3486').GetName] konnte die Zungen ausländischer Höfe versüßen und die Gefäße von Tempeln auskleiden. Lasst die Hüter ihre Bienenstöcke bauen und lasst [GetProvince('(int32)3486').GetName] die Welt ernähren.\n\nJeder Weg ist vielversprechend. Jeder spricht ein anderes Gesicht des sardischen Geistes an – Kunst, Fleiß und Harmonie.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] muss weise wählen. Denn sobald die Wahl getroffen ist, wird sie durch die Märkte, Tempel und Schiffe des östlichen Meeres widerhallen.\n\nWofür soll [GetProvince('(int32)3486').GetName] bekannt sein?">  #NT!
 me_nuragic_01_inv.350.a: "[GetProvince('(int32)3486').GetName] shall produce cloths."  <"[GetProvince('(int32)3486').GetName] soll Tücher herstellen.">  #NT!
 me_nuragic_01_inv.350.b: "Glass is the answer!"  <"Glas ist die Antwort!">  #NT!
 me_nuragic_01_inv.350.c: "Honey shall be the choice."  <"Honig soll die Wahl sein.">  #NT!
 me_nuragic_350_tooltip: "$mission_completed_tooltip_1$ '#Y Invest In [GetProvince('(int32)3486').GetName]#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Investieren in [GetProvince('(int32)3486').GetName]#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_36_title: "Consolidate Iliensia"  <"Konsolidieren Sie Iliensia">  #NT!
 me_nuragic_36_desc: "Iliensia is no longer a fractured land—it is the bedrock of the Sardan nation. From the fertile fields of the Iolean Plain to the bustling markets of [GetProvince('(int32)3484').GetName], from the reclaimed shores of [GetProvince('(int32)3493').GetName] to the revived harbors of [GetProvince('(int32)3486').GetName], we stand as one people, stronger and more prosperous than ever.\n\nBut this is only the beginning. We have restored the land, but now we must fortify it. We must build walls, raise armies, and continue the work our ancestors began. For the future of Sardinia will not be shaped by those who conquer it from afar, but by the Sardan who rule it as their own."  <"Iliensia ist kein zersplittertes Land mehr – es ist das Fundament der sardischen Nation. Von den fruchtbaren Feldern der Ioleischen Ebene bis zu den geschäftigen Märkten von [GetProvince('(int32)3484').GetName], von den zurückgewonnenen Küsten von [GetProvince('(int32)3493').GetName] bis zu den wiederbelebten Häfen von [GetProvince('(int32)3486').GetName] stehen wir als ein Volk da, stärker und wohlhabender als je zuvor.\n\nAber das ist nur der Anfang. Wir haben das Land wiederhergestellt, aber jetzt müssen wir es befestigen. Wir müssen Mauern bauen, Armeen aufstellen und die Arbeit fortsetzen, die unsere Vorfahren begonnen haben. Denn die Zukunft Sardiniens wird nicht von denen geprägt, die es aus der Ferne erobern, sondern von den Sardanern, die es als ihr Eigentum regieren.">  #NT!
 me_nuragic_01_inv.36.a: "One people, one land. Let this be testament of the greatness to come."  <"Ein Volk, ein Land. Lassen Sie dies ein Beweis für die zukünftige Größe sein.">  #NT!
 me_nuragic_36_tooltip: "$mission_completed_tooltip_1$ '#Y Consolidate Iliensia#!' $mission_completed_tooltip_2$"  <"$mission_completed_tooltip_1$ '#Y Iliensia konsolidieren#!' $mission_completed_tooltip_2$">  #NT!
  
 me_nuragic_1000_title: "Choose Country Color"  <"Wählen Sie Länderfarbe">  #NT!
 me_nuragic_1000_desc: "After forming Sardinia, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] has been summoned to choose the country color. You may choose to retain an unique Sardinia color, or pick up the previous Nuragic tags colors."  <"Nach der Gründung Sardiniens wurde [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] aufgefordert, die Landesfarbe zu wählen. Sie können sich dafür entscheiden, eine einzigartige Farbe Sardiniens beizubehalten oder die vorherigen Farben der Nuraghen-Tags zu übernehmen.">  #NT!
 me_nuragic_01_inv.1000.a: "I prefer the formable-decision color"  <"Ich bevorzuge die formbare Entscheidungsfarbe">  #NT!
 me_nuragic_01_inv.1000.b: "I prefer Coracensian Blue"  <"Ich bevorzuge Coracensian Blue">  #NT!
 me_nuragic_01_inv.1000.c: "I prefer Kelsitanian Green"  <"Ich bevorzuge Kelsitanian Green">  #NT!
 me_nuragic_01_inv.1000.d: "I prefer Rubrensian Black"  <"Ich bevorzuge Rubrensian Black">  #NT!
 me_nuragic_01_inv.1000.e: "I prefer Lugudonensian yellow"  <"Ich bevorzuge Lugudonensian-Gelb">  #NT!
 me_nuragic_1000_tooltip: "The country will change map color!!"  <"Das Land wird die Kartenfarbe ändern!!">  #NT!
  
  
  
  
 nuragic_sacrifice: "Nuragische Opfer"
 desc_nuragic_sacrifice: "Indem sie den Göttern des Krieges unschuldige Seelen opfern, werden sie uns im Kampf segnen."
 nuragic_scouts: "Nuragische Späher"
 desc_nuragic_scouts: "Unsere Männer sind mit der Lage des Landes gut vertraut, ein Segen in Kriegszeiten. Unsere Späher beobachten die Lager unserer Feinde und werden uns beraten, wann es Zeit zum Angriff ist."
 nuraghe_network: "Nuraghe-Netzwerk"
 desc_nuraghe_network: "Die Nuraghe, das von unseren weisen Vorfahren errichtete Befestigungssystem, ist noch immer eine Kraftquelle für unser Volk."
 nuragic_power: "Nuragische Kraft"
 desc_nuragic_power: "Die ganze Welt staunt über die Geschichte der tapferen Nuraghenstämme, die ihre ausländischen Feinde allen Widrigkeiten zum Trotz besiegten."
 nuragic_fortifications: "Nuragische Befestigungen"
 desc_nuragic_fortifications: "Wenn man bedenkt, dass wir aus bergigem Gelände kommen, sind wir geschickt darin, Befestigungen zu bauen, die an unsere natürlichen Verteidigungsanlagen erinnern."
 shorn_sheep: "Eifrige Steuereintreiber"
 desc_shorn_sheep: "Obwohl sie dazu kein Recht haben, stehlen uns die Karthager Steuereinnahmen - ein Frevel!"
 nuragic_archers: "Nuragische Bogenschützen"
 desc_nuragic_archers: "Unsere Stammesangehörigen sind tödlich mit dem Bogen, eine Fähigkeit, die wir auf dem Schlachtfeld verfeinert haben."
 nuragic_farm: "Nuragische Bauern"
 desc_nuragic_farm: "Unsere Landwirte sind Meister ihres Fachs, verschwenden absolut nichts und nutzen jedes Stück Land, das ihnen zur Verfügung steht."
 taphros_strait: "Strait of Taphros"  <"Straße von Taphros">  #NT!
 desc_taphros_strait: "The narrow strait between Sardinia and Corsica offers a faster trade route between Iberia, Gallia and the Italian Peninsula."  <"Die schmale Meerenge zwischen Sardinien und Korsika bietet eine schnellere Handelsroute zwischen Iberia, Gallia und der italienischen Halbinsel.">  #NT!
 sardinian_grain: "Grain of Sardinia"  <"Korn aus Sardinien">  #NT!
 desc_sardinian_grain: "Due to the particular soil composition, a mild climate and the joint use of peculiar wheat varieties with an extensive networks of irrigations, the plains of Sardinia are notorious for higher yield of the land."  <"Aufgrund der besonderen Bodenbeschaffenheit, des milden Klimas und der gemeinsamen Nutzung besonderer Weizensorten mit ausgedehnten Bewässerungsnetzen sind die Ebenen Sardiniens für ihre höheren Erträge bekannt.">  #NT!
 sardinian_silver: "Argyróphleps Nésos"  <"Argyróphleps Nésos">  #NT!
 desc_sardinian_silver: "Since the times of old, the mines in the south-western corner of the island are renowned for the size of their deposits - rich with rare metals. Such astonishing amounts of natural wealth has granted Sardinia the name of Argyróphleps Nésos (Island of the Silver Veins)."  <"Seit jeher sind die Minen in der südwestlichen Ecke der Insel für die Größe ihrer Vorkommen bekannt, die reich an seltenen Metallen sind. Solch erstaunlicher Naturreichtum hat Sardinien den Namen Argyróphleps Nésos (Insel der Silberadern) eingebracht.">  #NT!
 sardinian_lead: "Mines of Sardinia"  <"Minen von Sardinien">  #NT!
 desc_sardinian_lead: "The mountains of Sardinia are gifted with enormous quantities of metals. The Sardana have exploited such veins since the dawn of their civilization, becoming skilled metalworkers and traders. The Sardinian ingots of copper, silver and lead have reached all sides of the Mediterranean, to the shores of Judea in the east and the coasts of Iberia in the west and beyond - even reaching the shorelines of Goutia in the northern sea."  <"Die Berge Sardiniens sind mit enormen Mengen an Metallen gesegnet. Die Sardana haben solche Adern seit Beginn ihrer Zivilisation ausgebeutet und sich zu erfahrenen Metallarbeitern und Händlern entwickelt. Die sardischen Kupfer-, Silber- und Bleibarren haben alle Seiten des Mittelmeers erreicht, bis zu den Küsten Judäas im Osten und den Küsten Iberiens im Westen und darüber hinaus – sogar bis zu den Küsten von Goutia im Nordmeer.">  #NT!
 giants_of_tarshish: "Giants of Tarshish"  <"Riesen von Tarschisch">  #NT!
 desc_giants_of_tarshish: "A monumental necropolis built in ages of old by the Sardana, later destroyed by the Carthaginian invaders and now rebuilt to its ancient splendor. Encircled by Nuraghes and totems which recall the holy symbols, the center of the complex ends in a pathway of statues that depict warriors, archers, and boxers, all larger-than-life-sized, ranging from 2.5 to 2.7 meters (approximately 8 to 9 feet) tall. The statues are made of local sandstone and are skillfully crafted, showcasing remarkable attention to detail. They exhibit unique artistic features, such as complex armor, helmets, and intricate facial expressions. A gathering place for all the Nuragic peoples which aim to meet their ancient heroes."  <"Eine monumentale Nekropole, die vor langer Zeit von den Sardana erbaut, später von den karthagischen Invasoren zerstört und nun in ihrer antiken Pracht wieder aufgebaut wurde. Umgeben von Nuraghen und Totems, die an die heiligen Symbole erinnern, endet das Zentrum des Komplexes in einem Weg mit Statuen, die Krieger, Bogenschützen und Boxer darstellen, alle überlebensgroß und zwischen 2,5 und 2,7 Meter hoch. Die Statuen bestehen aus lokalem Sandstein und sind kunstvoll gefertigt und zeugen von bemerkenswerter Liebe zum Detail. Sie weisen einzigartige künstlerische Merkmale auf, wie komplexe Rüstungen, Helme und komplizierte Gesichtsausdrücke. Ein Treffpunkt für alle Nuraghenvölker, die ihre antiken Helden treffen möchten.">  #NT!
 new_capital_sardinia: "The City Of Towers"  <"Die Stadt der Türme">  #NT!
 desc_new_capital_sardinia: "The Sardana's Capital rises majestically with its architectural marvels inspired by the iconic nuraghe towers, which dot the cityscape. These towering stone structures pay homage to the ingenuity of the Nuragic people while serving as beacons of wisdom and cultural identity."  <"Die Hauptstadt von Sardana erhebt sich majestätisch mit ihren architektonischen Wunderwerken, die von den ikonischen Nuraghentürmen inspiriert sind, die das Stadtbild prägen. Diese hoch aufragenden Steinbauten sind eine Hommage an den Einfallsreichtum des Nuraghenvolkes und dienen gleichzeitig als Leuchtfeuer der Weisheit und kulturellen Identität.">  #NT!
 kares_port: "Harbor Among The Cliff"  <"Hafen unter der Klippe">  #NT!
 desc_kares_port: "A sheltered port with man-made facility built for loading and unloading vessels."  <"Ein geschützter Hafen mit künstlicher Anlage zum Be- und Entladen von Schiffen.">  #NT!
 nuragic_pompia: "Pompìa Ventures"  <"Pompia Ventures">  #NT!
 desc_nuragic_pompia: "A large field of Pompìa trees has been planted among the hills of the town. This fruit, indigenous of Sardinia, is largely unknown."  <"Auf den Hügeln der Stadt wurde ein großes Feld mit Pompia-Bäumen gepflanzt. Diese auf Sardinien heimische Frucht ist weitgehend unbekannt.">  #NT!
 great_pompia_farms: "Great Pompìa Farmlands"  <"Großes Pompìa-Ackerland">  #NT!
 desc_great_pompia_farms: "Large fields of Pompìa trees envelop the hills of the town, carefully planted to maximise production. Canals of irrigation have been directly connected to the springs and underground cisternae collect rainwater so that the farmlands always meet the water demand."  <"Große Felder mit Pompia-Bäumen umgeben die Hügel der Stadt und wurden sorgfältig gepflanzt, um die Produktion zu maximieren. Bewässerungskanäle wurden direkt an die Quellen angeschlossen und unterirdische Zisternen sammeln Regenwasser, so dass die Ackerflächen stets den Wasserbedarf decken.">  #NT!
 nurac_barumenis_construction: "Rebuilding Nurac Barumenis"  <"Wiederaufbau von Nurac Barumenis">  #NT!
 desc_nurac_barumenis_construction: "The inhabitants of [GetProvince('(int32)3482').GetName] are investing hard resources and time into the rebuilding of the ancient Nurac Barumenis."  <"Die Bewohner von [GetProvince('(int32)3482').GetName] investieren harte Ressourcen und Zeit in den Wiederaufbau des alten Nurac Barumenis.">  #NT!
 nurac_barumenis: "Nurac Barumenis"  <"Nurac Barumenis">  #NT!
 desc_nurac_barumenis: "Once in ruins, this polylobate Nurac is magnificient once more. The complex is comprehensive of four towers joined by a curtain wall with an upper balcony built around a central tower (20 meters high), all communicating with an inner courtyard served by a deep fresh-water well. The complex is surrounded by a curtain wall with seven towers, encircled by a settlement of around 200 houses of multiple purpose."  <"Nachdem er in Trümmern lag, ist dieser viellappige Nurac wieder großartig. Der Komplex besteht aus vier Türmen, die durch eine Vorhangfassade mit einem oberen Balkon verbunden sind, der um einen zentralen Turm (20 Meter hoch) herum gebaut ist und alle mit einem Innenhof verbunden ist, der von einem tiefen Süßwasserbrunnen versorgt wird. Der Komplex ist von einer Ringmauer mit sieben Türmen umgeben, umgeben von einer Siedlung mit etwa 200 Häusern mit mehreren Zwecken.">  #NT!
 balearic_slingers: "Balearic Slingers"  <"Balearische Schleuderer">  #NT!
 desc_balearic_slingers: "Specialized corps of Balearic Slingers have been integrated among our ranks."  <"Spezialisierte Korps balearischer Schleuderer wurden in unsere Reihen integriert.">  #NT!
  
 # Nuragic Decisions localization 
 rebuild_the_giants_of_tarshish: "Rebuild The Giants of Tarshish"  <"Bauen Sie die Riesen von Tarschisch wieder auf">  #NT!
 rebuild_the_giants_of_tarshish_desc: "It's our duty the reinstitute the old monumental necropolis of Tarshish, once destroyed by the Carthaginians in their attempt to subdue our people."  <"Es ist unsere Pflicht, die alte monumentale Nekropole von Tarschisch wiederherzustellen, die einst von den Karthagern bei ihrem Versuch, unser Volk zu unterwerfen, zerstört wurde.">  #NT!
  
 # Nuragic Traits 
 nur_horned_warrior: "Horned Warrior"  <"Gehörnter Krieger">  #NT!
 nur_horned_warrior_desc: "[CHARACTER.GetName] earned the Horns, a symbol of power and strength among the warriors."  <"[CHARACTER.GetName] erhielt die Hörner, ein Symbol für Macht und Stärke unter den Kriegern.">  #NT!
  
 # Items 
 mycenean_holy_axe: "Mycenean Holy Axe"  <"Mykenische Heilige Axt">  #NT!
 desc_mycenean_holy_axe: "A Mycenean Labrys, the double-headed axe of old. Forged in ancient times and buried beneath the collapsed stones of the southern tower, at Nurac Barumenis, it bears no rust, only reverence. Its edges, though dulled by centuries, still whisper of war and ritual. This is no mere weapon — it is a symbol of rule, of divine strength, and of the sacred bond between the warrior and Sardò."  <"Eine mykenische Labrys, die alte doppelköpfige Axt. In der Antike geschmiedet und unter den eingestürzten Steinen des Südturms in Nurac Barumenis begraben, zeugt es von keinem Rost, sondern nur von Ehrfurcht. Obwohl die Ränder durch die Jahrhunderte abgestumpft waren, flüstern sie immer noch von Krieg und Ritualen. Dies ist keine bloße Waffe – es ist ein Symbol der Herrschaft, der göttlichen Stärke und der heiligen Verbindung zwischen dem Krieger und Sardò.">  #NT!
