l_german:
  
  ### Odrysia Missions ###  updated 26.06.26 V1.11.0.3 - Germanicus
 odrysia_missions_01_freedom: "Der Makedone im Süden"
 odrysia_missions_01_freedom_DESCRIPTION: "Vor wenigen Jahren wurden unsere mächtigen #E Odrysier#! vom makedonischen Feldherrn #E Lysimachos von Thrakien#!, jenem Tyrannen, der in der Nähe des Hellesponts herrscht, besiegt. Auch wenn der verräterische thrakische Tyrann glaubt, unser Wille sei gebrochen, werden wir ihm diese Hybris heimzahlen, indem wir unseren Oberherrn stürzen und die Wiedergeburt eines unabhängigen Odrysia verkünden!"
 odrysia_missions_01_freedom_CRITERIA_DESCRIPTION: "Diese Mission gilt als abgeschlossen, wenn wir das #E Odrysische Königreich#! reformieren."
 odrysia_missions_01_freedom_BUTTON_TOOLTIP: "Mögen die Kriegsgötter unsere Stammesangehörigen zum Sieg führen!"
  
 odrysia_missions_01_freedom_task_01: "Die Flamme neu entfachen"
 odrysia_missions_01_freedom_task_01_DESC: "313 v. Chr. wurden die Odryser durch die Hände von [GetCharacter('(int32)41').GetName] besiegt, wodurch ihre Selbstverwaltung faktisch beendet wurde. Obwohl sie unterworfen waren, kämpften die Thraker weiterhin gegen die Makedonen um ihre Freiheit. \n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
  
 odrysia_missions_01_freedom_task_02: "Der Makedone im Süden"
 odrysia_missions_01_freedom_task_02_DESC: "Nach dem Tod von [GetCharacter('(int32)39').GetName] war [GetCharacter('(int32)41').GetName] zum Satrapen von Thrakien ernannt worden. In den folgenden Jahren verbrachte er viel Zeit damit, Rebellionen zu unterdrücken und das Land zu beruhigen, was die Thraker extrem unzufrieden machte – eine Situation, aus der wir Kapital schlagen könnten. \n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
  
 odrysia_missions_01_freedom_task_03: "Abgesandte zu Lysimachos"
 odrysia_missions_01_freedom_task_03_DESC: "Diplomatische Beziehungen zwischen Griechen und Thrakern sind gut belegt; sogar Xenophon gibt zu, dass die Thraker zivilisierter sind, als man ihnen zutraut. Wir sind keine Wilden, sondern respektieren die Regeln der Diplomatie.\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
  
 odrysia_missions_01_freedom_task_04: "Auf der Suche nach unseren Brüdern"
 odrysia_missions_01_freedom_task_04_DESC: "Obwohl das Land Thrakien von antiken Autoren oft als von einem einzigen Volk bewohnt beschrieben wurde, war es in Wirklichkeit von einer Reihe verschiedener Stämme und Königreiche besiedelt. Und auch wenn es zwischen ihnen oft zu Rivalitäten kam, schlossen sie sich doch häufig zusammen, um gemeinsamen Bedrohungen entgegenzutreten. \n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
  
 odrysia_missions_01_freedom_task_05: "Ein Band durch die Ehe"
 odrysia_missions_01_freedom_task_05_DESC: "Liebe - die Inspiration des Dichters, die Freude der Jugend und die Reue des Alters. Man muss kein Philosoph sein, um zu wissen, dass die Ehe etwas Wunderbares sein kann.\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
  
 odrysia_missions_01_freedom_task_06: "Musterung der Männer"
 odrysia_missions_01_freedom_task_06_DESC: "Herodot hielt die Odrysen für das zahlreichste Volk der Mittelmeerwelt und befürchtete, dass sie, sollten sie sich jemals vereinen, in ihrer Kampfkraft unübertroffen wären.\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
  
 odrysia_missions_01_freedom_task_07: "Sieg über die Griechen"
 odrysia_missions_01_freedom_task_07_DESC: "\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
  
 odrysia_missions_01_freedom_task_08: "Das nördliche Bollwerk werden"
 odrysia_missions_01_freedom_task_08_DESC: "Zu Beginn des 3. Jahrhunderts v. Chr. wanderten viele nördliche Gallier nach Süden aus und richteten unter den sesshaften Bevölkerungsgruppen im Mittelmeerraum – in #E Griechenland#! und #E Anatolien#! – verheerendes Unheil an. Es waren diese Wanderungsbewegungen, die auch das Ende des Volkes der Odrysen herbeiführten. Hätten sich unsere Vorfahren ausreichend auf die Verteidigung ihrer nördlichen Grenzen konzentrieren können, wären sie vielleicht nicht unvorbereitet überrascht und vernichtet worden. \n\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
  
 odrysia_missions_01_freedom_task_09: "Der Thrakische Krieg"
 odrysia_missions_01_freedom_task_09_DESC: "Ein wahrer Thraker würde lieber im Kampf für seine Freiheit sterben, als sich einem Fremden unterzuordnen! Ein Krieg scheint unvermeidlich, wenn wir unsere Autonomie zurückgewinnen wollen, aber wir freuen uns auf die Aussichten einer Schlacht.\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
  
 odrysia_missions_01_freedom_task_10: "Unterwerfung der Küste"
 odrysia_missions_01_freedom_task_10_DESC: "Falls es uns gelingt, die reichen Küstenstädte östlich von uns zu erobern und unserem Reich einzuverleiben, wird unsere gesamte Nation von der dadurch erlangten Beute profitieren. \n\n\n\n\n\n\n\n\n\n@greek_mil15!"
  
 odrysia_missions_01_freedom_task_11: "Vom Hof zur Hauptstadt"
 odrysia_missions_01_freedom_task_11_DESC: "Seuthopolis, die von Seuthes III. gegründete Hauptstadt, wurde im makedonischen Stil erbaut, um die Verwaltung des Volkes der Odrysen zu zentralisieren. Neben ihren administrativen Aufgaben diente die Stadt auch als religiöser Ort.\ n\nObwohl Seuthopolis als 'Polis' bezeichnet wurde, entwickelte sie sich im Vergleich zu Städten wie Lysimacheia oder Seleucia-Syria nie zu einer echten Hauptstadt, doch dies wird sich unter [ROOT.GetCountry.GetRuler.GetName] ändern.\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
  
 odrysia_missions_01_freedom_task_12: "Ein gespaltenes Volk"
 odrysia_missions_01_freedom_task_12_DESC: "Nach der Niederlage gegen Lysimachos im Jahr 313 v. Chr. wurden die Überreste des odrysischen Königreichs in das Hochland und das Landesinnere von Thrakien vertrieben, während die Küstenregionen sowie ein beträchtlicher Teil ihrer Bevölkerung in makedonischer Hand blieben.\ n\nLasst uns weit und breit verkünden, dass sich die Kräfte Odrysiens im Exil sammeln und dass alle, die für dessen Ruhm kämpfen wollen, herzlich eingeladen sind, sich uns anzuschließen!\n\n\n\n\n\n\n\n\n\n\n@india_mil14!"
  
 odrysia_missions_01_freedom_task_13: "Die wahre thrakische Hauptstadt"
 odrysia_missions_01_freedom_task_13_DESC: "Auch wenn ein solch gewaltiges Unterfangen mit hohen Kosten verbunden sein wird, lasst uns alles in unserer Macht Stehende tun, um eine echte thrakische Hauptstadt für unser Volk zu errichten, das diese verdient. \n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
  
 odrysia_missions_01_freedom_task_14: "Makedonische Brüderlichkeit"
 odrysia_missions_01_freedom_task_14_DESC: "Auch wenn sich ihre Position geändert hat, kann niemand den Einfluss leugnen, den die Makedonen auf unser Land hatten. Wir sollten die positiven Aspekte übernehmen, die wir von ihnen lernen können – wie zum Beispiel ihre Meisterschaft in der Kriegskunst. \n\n\n\n\n\n\n\n\n\n\n@celt_mil14!" 
  
 odrysia_missions_01_freedom_task_15: "Ein Königreich für einen König"
 odrysia_missions_01_freedom_task_15_DESC: "In dieser Stunde des Triumphs, da wir unsere neu errungene Freiheit von #E Thrakien#! fest in der Hand halten, lasst uns die Errungenschaften von [ROOT.GetCountry.GetRuler.GetName] feiern, indem wir [ROOT.GetCountry.GetRuler.GetHerHim] die Krone von #E Odrysia#! überreichen! \n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
  
 odrysia_missions_01_freedom_task_01_tt: "Wir müssen [GetCountry('TRE').GetName|G] den Krieg erklären und diesen so lange fortsetzen, bis ein #T Spezial-Event#! ausgelöst wird."
 odrysia_mission_01_freedom_task_02_tt: "Wir müssen uns entscheiden, entweder gegen unseren Oberherren zu kämpfen oder uns ihnen anzuschließen."
  
  ### Formable ### 
 formable_not_thrace_exists: "#Y Odrysisches Königreich#! darf NICHT existieren."
 form_thrace: "Reformiert das Odrysische Königreich"
 OYK: "$THRACIA_NAME$"
 THRACIA_NAME: "Odrysisches Königreich"
 THRACIA_ADJECTIVE: "Odrysisches Königreich"
 form_thrace_desc: "Nach dem Tod von Kotys I. im Jahr 360 v. Chr. zerfiel das Königreich der Odrysen in drei Teile, die alle von den aufstrebenden Makedonen unter Philipp II. unterworfen wurden. Ein neuer, starker Anführer könnte jedoch die glorreichen Zeiten von Kotys I. wieder aufleben lassen – oder vielleicht sogar die des großen Teres selbst."
  
  ### Events and Decisions # 
 me_odrysia_finish_1_title: "Die Flamme neu entfachen"
 me_odrysia_finish_1_desc: "Vor vielen Jahren hatte unser Herrscher [GetCharacter('(int32)101').GetName] den Kampf um unsere Freiheit gegen die Makedonen verloren, sehr zu seiner ewigen Schande. Doch vielleicht ist noch nicht alles verloren, auch wenn unser Geist gebrochen ist. \n\nInmitten der verstreuten Asche unseres niedergebrannten Traums von friedlicher Selbstverwaltung bleibt vielleicht noch ein Funke unseres früheren Ruhmes übrig, der darauf wartet, dass der richtige Anführer ihn wieder zu einem lodernden Feuer entfacht. Werden wir ihn rechtzeitig wieder entfachen können, um den herannahenden Sturm zu überstehen?"
 me_odrysia_finish.1.a: "Was wird uns die Zukunft bringen?"
  
 me_odrysia_1_title: "Der Makedone im Süden"
 me_odrysia_1_desc: "Der Krieg naht! Schon jetzt liegt der Gestank des Todes in der Luft. Die Generäle von [GetCharacter('(int32)39').GetName] schlagen ihre letzten großen Schlachten, und in den nördlichen Ödländern regt sich etwas – Gerüchte über seltsame und verzweifelte Wanderungen umherziehender Barbaren bringen die bestehende Ordnung ins Wanken.\ n\nWir stehen an einem Scheideweg, an dem es um unser Überleben geht, und müssen einige schwierige Entscheidungen treffen – werden wir unsere makedonischen Oberherren im Stich lassen und versuchen, die thrakischen Länder wieder zu vereinen, oder werden wir den Makedonen in ihrer Stunde der Not zur Seite stehen und uns ein neues Vermächtnis schaffen?"
 me_odrysia.1.a: "Wir werden uns auf die Seite der Makedonen stellen, damit wir nicht beide vernichtet werden"
 me_odrysia.1.b: "Wir werden für unsere angestammte Heimat kämpfen!"
  
 me_odrysia_2_title: "Das nördliche Bollwerk werden"
 me_odrysia_2_desc: "Wir haben unsere Beziehungen zu unseren makedonischen Oberherren gestärkt, und glücklicherweise hat dies für beide Seiten greifbare Vorteile gebracht. Nun müssen wir den Rest von Thrakien und Moesien unter unserem Banner vereinen, damit wir zum undurchdringlichen Schutzschild Thrakiens werden können. Unsere makedonischen Herren haben versprochen, sich unserem Kampf gegen die nördlichen Stämme anzuschließen, begierig auf ihren Anteil am Ruhm und an der Beute. Getrennt sind wir schwach, doch gemeinsam werden wir überleben.
 me_odrysia.2.a: "Wir werden den Norden unverzüglich sichern"
 me_odrysia.2.b: "Unsere derzeitige Position ist angemessen"
  
 me_odrysia_mid_2_title: "Eine Forderung nach Vereinigung"
 me_odrysia_mid_2_desc: "Die Odrysen, Sklaven der makedonischen Hunde im Süden, sind gekommen, um uns unsere Freiheit zu nehmen – sie verlangen, dass wir uns ihnen unterwerfen und ihnen als Untertanen dienen. Das würde unserem Volk zwar mehr Sicherheit bringen, doch wir würden auch jegliche Autonomie verlieren … Aber sind wir wirklich bereit, einen Krieg zu führen?"
 me_odrysia_mid_2.a: "Jetzt ist die Zeit, sich zu vereinen!"
 me_odrysia_mid_2.b: "Verräter! Wir werden ihre Herzen herausschneiden!"
  
 me_odrysia_3_title: "Eine passende Braut finden"
 me_odrysia_3_desc: "Um seine Herrschaft über Odrysia zu festigen, heiratete Seuthes III. eine Makedonin, Berenike, von der einige Forscher glauben, dass sie eine Tochter des Lysimachos war. Auf unserem Weg, unseren lysimachidischen Oberherren ebenbürtig zu werden, wollen wir das Band zwischen unseren Familien durch eine neue Ehe neu beleben. Die Lysimachiden haben zugestimmt, [ROOT.GetCountry.GetRuler.GetName] eine Braut zu übergeben. Zu diesem Zweck wurden drei geeignete Kandidatinnen für unseren Herrscher gefunden, der nun die angenehme Aufgabe hat, seine zukünftige Partnerin auszuwählen."
 me_odrysia_3.a: "Wir werden uns für [SCOPE.sCharacter('potential_wife_1.GetName').GetName] entscheiden"
 me_odrysia_3.b: "[SCOPE.sCharacter('potential_wife_2.GetName').GetName] erscheint passend"
 me_odrysia_3.c: "Warum nicht [SCOPE.sCharacter('potential_wife_3.GetName').GetName]?"
  
 me_odrysia_start_3_title: "Verhandlungen mit den Lysimachiden"
 me_odrysia_start_3_desc: "Wir sind zu dem Schluss gekommen, dass wir von unserem makedonischen Oberherrn abhängig sind, aber sie sind auch von uns abhängig – etwas, das uns erfreut. Während sie ihre Aufmerksamkeit auf den Süden richten, könnten wir uns nach Norden wenden, zum Schild von Thrakien werden und unseren gemeinsamen Wohlstand und unsere Sicherheit sichern."
 me_odrysia_start.3.a: "Für das Überleben von Thrakien!"
  
 me_odrysia_mid_3_title: "Ein Vorschlag der Odryser"
 me_odrysia_mid_3_desc: "Unsere immer so wankelmütigen Untertanen, die Odryser, sind mit einem Vorschlag zu uns gekommen. Sie möchten bei der Verwaltung und Verteidigung von Thrakien zusammenarbeiten – nicht das, was wir erwartet hatten. Sie stimmen zu, unser treuer Untertan zu bleiben und sind bereit, unsere nördlichen Grenzen zu schützen, vorausgesetzt, wir verteidigen den Süden."
 me_odrysia_mid.3.a: "Eine wunderbare Idee!"
 me_odrysia_mid.3.b: "Den Odrysii kann man nicht trauen."
  
 me_odrysia_finish_3_title: "Verhandlungen mit den Lysimachiden"
 me_odrysia_finish_3_desc: "Wir wollen uns mit unserem Oberherren einigen.  Es besteht kein Grund, unseren Vorschlag allzu detailliert zu erläutern: Während sie das südliche Thrakien verteidigen, könnte es an uns liegen, den Norden zu beschützen. Hoffentlich sehen sie die Weisheit darin."
 me_odrysia_finish.3.a: "Eine sinnvolle Vereinbarung."
  
 me_odrysia_4_title: "Ein ungewöhnlicher Vorschlag"
 me_odrysia_4_desc: "Unsere lästigen Untertanen, die Odryser, kommen mit einem unerwarteten Vorschlag: Sie bitten uns, unsere Familien durch Heirat zu vereinen, um das Land zu beruhigen und den Weg für eine friedliche Koexistenz zu ebnen. Etwas Ähnliches geschah, nachdem sich der odrysische König Seuthes III. im Jahr 313 v. Chr. dem Aufstand von Kallatis gegen Lysimachos angeschlossen hatte. Berenike, die Tochter unseres großen Herrschers, wurde die Frau von Seuthes und trug dazu bei, die Kluft zwischen uns und diesen falschen Barbaren im Norden zu überwinden. Wie sollten wir auf diesen kühnen Vorschlag der Barbaren reagieren?"
 me_odrysia_4.a: "Was ist schon ein weiterer Sprössling, wenn er ein ruhigeres Thrakien schafft!"
 me_odrysia_4.b: "So eine Frechheit! War Berenike nicht genug für sie?"
  
 me_odrysia_start_4_title: "Auf der Suche nach unseren Brüdern"
 me_odrysia_start_4_desc: "[ROOT.GetCountry.GetRuler.GetName] muss eine Entscheidung treffen, wenn es um die Kriege geht, die bald über uns kommen werden - werden wir unsere Brüder um Hilfe bitten? Es besteht die Möglichkeit, dass unsere Verwandten auf den Ruf zu den Waffen antworten, aber sie könnten uns sehr gut ignorieren oder warten, bis wir geschwächt sind, und uns dann selbst überfallen."
 me_odrysia_start.4.a: "Lassen Sie uns sofort die Delegationen schicken"
 me_odrysia_start.4.b: "Wir werden alleine kämpfen - wir brauchen keine Hilfe"
  
 me_odrysia_mid_4_title: "Ein Angebot der Odrysii"
 me_odrysia_mid_4_desc: "Die Odryser, die ihrer makedonischen Herren überdrüssig sind, möchten ein Bündnis mit uns schließen, damit wir ihnen helfen können, diese fremden Eindringlinge zu vertreiben und unser Land zurückzuerobern. \n\nDas klingt nach einer glorreichen, wenn nicht gar gefährlichen Bitte, aber es bleibt abzuwarten, wie wir uns entscheiden werden – beide Optionen haben ihre Vorzüge."
 me_odrysia_mid_4.a: "Eine Chance für ein Abenteuer? Natürlich machen wir mit"
 me_odrysia_mid_4.b: "Was kümmern uns ihre Kämpfe?"
  
 me_odrysia_start_5_title: "Ein Band durch die Ehe"
 me_odrysia_start_5_desc: "[ROOT.GetCountry.GetRuler.GetName] hat beschlossen, einige Zeit mit [ROOT.GetCountry.GetRuler.GetHerHis]em Privatleben zu verbringen, indem er einen Ehepartner sucht. Es wäre gut für unser Volk, unseren Anführer glücklich zu sehen, also werden wir mit der Suche beginnen."
 me_odrysia_start.5.a: "Lasst uns eine Frau finden!"
  
 me_odrysia_5_title: "Eine Antwort von unserem Oberherren"
 me_odrysia_5.a: "Hurra! Das ist es wert, gefeiert zu werden"
 me_odrysia_5.b: "Wie wagen sie es!?"
 me_odrysia_5_desc_1: "Wir haben eine Nachricht von unserem Oberherren erhalten, der unseren Vorschlag sorgfältig geprüft hat, bevor er geantwortet hat – sie haben akzeptiert, was wir verlangen."
 me_odrysia_5_desc_2: "Wir haben eine Nachricht von unserem Oberherren erhalten, der unseren Vorschlag sorgfältig geprüft hat, bevor er geantwortet hat – er hat unsere Anfrage zu diesem Zeitpunkt abgelehnt."
  
 me_odrysia_start.6.title: "Musterung der Männer"
 me_odrysia_start.6.desc: "In der Erkenntnis, dass wir jeden waffenfähigen Arm brauchen werden, den wir kriegen können, hat [ROOT.GetCountry.GetRuler.GetName] beschlossen, den Ruf nach Truppen auszusenden - sie sollen sich bei [ROOT.GetCountry.GetCapital.GetName] versammeln, sobald sie dazu in der Lage sind."
 me_odrysia_start.6.a: "Schürt die Schmieden an und schmiedet die Waffen des Krieges!"
 me_odrysia_finish_6_title: "Musterung der Männer" 
 me_odrysia_finish_6_desc: "Wir freuen uns, berichten zu können, dass nach einer Phase der Konsolidierung die von [ROOT.GetCountry.GetRuler.GetName] zur Vorbereitung auf den Konflikt angeforderten Truppen außerhalb von [ROOT.GetCountry.GetCapital.GetName] versammelt wurden. Auch jetzt noch werden den Göttern Opfer dargebracht, um ihren Schutz zu erbitten, während wir uns darauf vorbereiten, unsere Soldaten in gefährliche Gefechte zu entsenden."
 me_odrysia_finish.6.a: "Wir sind bereit für alles, was kommt"
  
 me_odrysia_7_title: "Verhandlungen mit den Griechen"
 me_odrysia_7_desc: "Wir haben unsere Diplomaten in die großen griechischen Städte an der Küste geschickt und um ihre Neutralität im bevorstehenden Kampf gebeten. Obwohl nichts sicher ist, hoffen wir, dass ihre selbstsüchtige Gier sie aus dem Konflikt heraushalten wird, wenn die Zeit gekommen ist."
 me_odrysia.7.a: "Hoffen wir, dass sie die Makedonen genauso wenig mögen wie wir"
  
 me_odrysia_8_title: "Ein Angebot der Odryser"
 me_odrysia_8_desc: "Das Volk der Odrysen, das tief in den Bergen lebt, hat uns einen Vorschlag unterbreitet, den wir sorgfältig prüfen sollten. Sie wollen gegen unseren gemeinsamen Oberherrn, die Makedonen, um ihre Unabhängigkeit kämpfen und sind gespannt, ob wir uns zusammenschließen können, um unsere Chancen im bevorstehenden Krieg zu verbessern. Sie suchen jedoch keinen Streit mit uns und schlagen einen Nichtangriffspakt vor."
 me_odrysia.8.a: "Wir akzeptieren!"
 me_odrysia.8.b: "Und anschließend Vergeltungsmaßnahmen riskieren? Niemals!"
  
 me_odrysia_9_finish_title: "Der Thrakische Krieg"
 me_odrysia_9_finish_desc: "Wir haben unsere Unabhängigkeit erklärt und unsere Verbündeten um uns geschart. Es gibt nun kein Zurück mehr; was auch immer kommen mag, wir sind bereit, für unsere Freiheit zu kämpfen, selbst wenn es uns das Leben unserer Familien kostet. Wir können kein Leben in Knechtschaft mehr führen!"
 me_odrysia_9_finish.a: "[GetProvince('(int32)478').GetName] ist die Heimat eines freien Volkes"
  
 me_odrysia_10_title: "Eine Antwort der Griechen"
 me_odrysia_10_desc: "Mein [ROOT.GetCountry.GetRulerTitle], ich habe ausgezeichnete Neuigkeiten wegen der Botschaften, die wir an die Griechen geschickt haben. Sie haben unseren Vorschlag angenommen!"
 me_odrysia.10.a: "Wunderbar!"
  
 me_odrysia_finish_10_title: "Unterwerfung der Küste"
 me_odyrsia_finish_10_desc: "Wir haben nicht nur ihre Städte geplündert und uns den Reichtum der kleinen Städte an der Küste des #E Pontus Euxinus#! angeeignet, sondern sogar eine Leistung vollbracht, die manche für noch größer halten – wir haben unter den Besitztümern der besiegten Städte viele wunderbare Dinge entdeckt, darunter zahlreiche Abhandlungen und Zeichnungen zum Bau mächtiger #E Belagerungsmaschinen#!, welche wir ganz sicher sinnvoll nutzen werden."
 me_odrysia_finish.10.a: "Wir werden die Mauern unserer Feinde niederreißen!"
  
 me_odrysia_finish_11_title: "Vom Hof zur Hauptstadt"
 me_odyrsia_finish_11_desc: "[GetProvince('(int32)478').GetName] ist seit langem unser Verwaltungs- und Diplomatiezentrum, doch ehrlich gesagt war es schon immer eher eine Festung als eine echte Stadt.\n\nUnter der weisen Herrschaft von [ROOT.GetCountry.GetRuler.GetName] haben wir jedoch Maßnahmen ergriffen, um unsere Hauptstadt zu verbessern. Indem wir einen größeren Teil unserer verstreuten Bevölkerung innerhalb ihrer Mauern zusammengeführt haben, haben wir etwas geschaffen, das allmählich einer Polis ähnelt."
 me_odrysia_finish_11.a: "Möge es tausend Jahre überdauern!"
  
 me_odrysia_11_title: "Eine Antwort der Griechen"
 me_odrysia_11_desc: "Nun, man muss sagen, dass die Griechen ihrem Ruf als clevere Verhandlungsführer gerecht werden, denn wir konnten uns auf nichts einigen."
 me_odrysia.11.a: "Absurd! Sie werden dies bereuen"
  
 me_odrysia_start_12_title: "Ein gespaltenes Volk"
 me_odrysia_start_12_desc: "Jetzt, da wir in der Lage sind, der odrysischen Diaspora zu helfen, hat [ROOT.GetCountry.GetRuler.GetName] angekündigt, dass [ROOT.GetCountry.GetRuler.GetSheHe] bald eine Rede halten wird, in der eine Vision skizziert wird, und alle sind neugierig, was [ROOT.GetCountry.GetRuler.Custom('get_DieDer')]  [ROOT.GetCountry.GetRulerTitle] im Sinn hat."
 me_odrysia_start.12.a: "Bringen wir unsere Leute nach Hause"
  
 me_odrysia_12_title: "Ein gespaltenes Volk"
 me_odrysia_12_desc: "[ROOT.GetCountry.GetRuler.GetName] hielt kürzlich eine Rede, die an die blumigen Reden erinnerte, die in den Senatshäusern der Republiken gehört werden, und argumentierte energisch zugunsten unserer Verwandten im Ausland, ihr Leben in der Sklaverei aufzugeben und massenhaft unter den Schutz von [ROOT.GetCountry.GetName] zurückzukehren. \n\nWährend viele für diese Politik der offenen Grenzen dankbar sind, gibt es viele Menschen, die empört sind – insbesondere [GetCharacter('(int32)41').GetName], der offizielle Beschwerden bei [GetProvince('(int32)478').GetName] eingereicht hat."
 me_odrysia.12.a: "Nur gemeinsam werden wir überleben"
  
 me_odrysia_finish_13_title: "Die wahre thrakische Hauptstadt"
 me_odrysia_finish_13_desc: "Während [ROOT.GetCountry.GetRuler.GetName] für viele Dinge bekannt ist – ein[ROOT.GetCountry.GetRuler.Custom('get_eFemale')]] fähige[ROOT.GetCountry.GetRuler.Custom('get_rMale')] Diplomat[ROOT.GetCountry.GetRuler.Custom('get_inFemale')], ein[ROOT.GetCountry.GetRuler.Custom('get_eFemale')] unübertroffene[ROOT.GetCountry.GetRuler.Custom('get_rMale')] Krieger[ROOT.GetCountry.GetRuler.Custom('get_inFemale')] und ein[ROOT.GetCountry.GetRuler.Custom('get_eFemale')] erbitterte[ROOT.GetCountry.GetRuler.Custom('get_rMale')] Kämpfer[ROOT.GetCountry.GetRuler.Custom('get_inFemale')] für das [ROOT.GetCountry.GetAdjective]e Volk – wissen nur wenige, dass [ROOT.GetCountry.GetRuler.GetSheHe] insgeheim eine Leidenschaft für Architektur hegt. \n\nAlle können die großartigen Visionen von [ROOT.GetCountry.GetRulerTitle] miterleben, wenn sie [GetProvince('(int32)478').GetName] besuchen, das gebaut und geformt wurde, um die Wünsche unseres Anführers zu erfüllen."
 me_odrysia_finish_13.a: "Unser Volk verdient all dies und noch mehr"
  
 me_odrysia_start_14_title: "Begrüßung unserer makedonischen Brüder"
 me_odrysia_start_14_desc: "Es wurde beschlossen, unsere Verbindungen zu den Makedonen auszubauen, anstatt die offensichtlichen Vorteile zu ignorieren, die eine Zusammenarbeit mit ihnen für [ROOT.GetCountry.GetName] bringen könnte. \n\nEs bleibt abzuwarten, wie sie reagieren werden, aber wir sind hoffnungsvoll."
 me_odrysia_start.14.a: "Für Thrakien!"
  
 me_odrysia_finish_14_title: "Begrüßung unserer makedonischen Brüder"
 me_odyrsia_finish_14_desc: "Jetzt, wo sich unsere Absicht, friedlich mit den Makedonen zusammenzuleben, mittlerweile weit und breit herumgesprochen hat, freuen wir uns sehr, berichten zu können, dass viele ihrer besten Kämpfer in unsere Gebiete gezogen sind.\n\nEs versteht sich von selbst, dass wir nun über eine Gruppe erfahrener und talentierter Krieger verfügen, auf die wir zurückgreifen können."
 me_odrysia_finish_14.a: "Wilkommen in der Familie!"
  
 me_odrysia_finish_15_title: "Ein Königreich für einen König"
 me_odyrsia_finish_15_desc: "Obwohl die Chancen scheinbar unüberwindbar gegen uns standen, hat  [ROOT.GetCountry.GetRuler.GetName] es irgendwie geschafft, die mächtigen Kräfte zu zerstören, die sich gegen [ROOT.GetCountry.GetName] verbündet haben, um das vor langer Zeit zerstörte Königreich wiederherzustellen. \n\nJetzt, in unserem Moment des Triumphs, wird eine große Feier in [ROOT.GetCountry.GetCapital.GetName] stattfinden, um die ewigen Errungenschaften unsere[ROOT.GetCountry.GetRuler.Custom('get_rsEnding')] unvergleichlichen [ROOT.GetCountry.GetRulerTitle] zu ehren."
 me_odrysia_finish_15.a: "Hurra! Dieser Tag wird in die Odrysische Geschichte eingehen!"
  
 me_odrysia_finish_16_title: "Der Thrakische Krieg"
 me_odrysia_finish_16_desc: "Die verräterischen Thraker, die in ihren Hügeln und Wäldern kauern, haben ihre Unabhängigkeit von uns erklärt. Das kann nicht sein – es ist an der Zeit, dass sie lernen, wer ihre Herren sind. Was sagen ihr, [ROOT.GetCountry.GetRuler.GetName]?"
 me_odrysia_finish_16.a: "Wir werden sie vernichten!"
 me_odrysia_finish_16.b: "Lasst ihnen ihre Freiheit – damit können wir jetzt nicht umgehen"
  
 me_odrysia_finish_17_title: "Eine Antwort unserer Brüder"
 me_odrysia_finish_17_desc: "Unsere Diplomaten kommen mit guten Neuigkeiten – unsere Verwandten haben zugestimmt, sich unserem Kampf gegen die makedonischen Invasoren anzuschließen und werden mit uns marschieren, wenn die Zeit für den Kampf gekommen ist."
 me_odrysia_finish_17.a: "Exzellent!"
  
 me_odrysia_finish_18_title: "Gleichgültige Nachbarn"
 me_odrysia_finish_18_desc: "Es tut mir leid, mitteilen zu müssen, mein [ROOT.GetCountry.GetRulerTitle.], dass sich unsere feigen Verwandten geweigert haben, unseren Kampf zur Befreiung unseres Heimatlandes zu unterstützen. Wir stehen ohne ihre Hilfe und müssen alleine kämpfen."
 me_odrysia_finish_18.a: "Verräter! Daran werden wir uns eines Tages erinnern"
  
 me_odrysia_finish_19_title: "Vereinigung angenommen"
 me_odrysia_finish_19_desc: "Unsere Untertanen haben erkannt, dass die Alternative der Tod und der Verlust von allem war, was ihnen lieb und teuer ist, und haben ihre Knechtschaft akzeptiert und sich gebeugt, ohne sich zu verteidigen."
 me_odrysia_finish_19.a: "Wunderbar! Und wie erbärmlich von ihnen ..."
  
 me_odrysia_finish_20_title: "Vereinigung verweigert"
 me_odrysia_finish_20_desc: "Unser Versuch, die Wiedervereinigung zu fordern, stieß auf Spott und Drohungen, und die von uns Angesprochenen warnten uns, wir sollten in unseren Ländern bleiben.\n\nIch nehme an, das bedeutet, dass wir den Überraschungseffekt verspielt haben … Sie werden nun mit Sicherheit mit unseren Soldaten rechnen."
 me_odrysia_finish_20.a: "So sei es..."
  
 me_odrysia_finish_21_title: "Eine Antwort von unserem Oberherren"
 me_odrysia_finish_21_desc: "Ein fröhlicher Tag! Boten unseres Oberherren sind mit der fantastischen Nachricht eingetroffen, dass sie unserem Vorschlag zugestimmt haben!"
 me_odrysia_finish.21.a: "Wunderbare Neuigkeiten!"
  
 me_odrysia_finish_22_title: "Eine Antwort von unserem Oberherren"
 me_odrysia_finish_22_desc: "Obwohl wir uns unserem Herren mit offenen Händen und einem Geist der Gemeinschaft näherten, haben sie unsere Versuche der Zusammenarbeit abgelehnt und uns mit leeren Händen nach Hause geschickt."
 me_odrysia_finish.22.a: "Wie können sie es wagen!"
  
 me_odrysia_finish_23_title: "Oberherr erklärt den Krieg"
 me_odrysia_finish_23_desc: "Nun, wenn wir gehofft hatten, frei zu werden, ohne dafür kämpfen zu müssen, wissen wir jetzt, dass dies ein törichter Traum war. Unser Oberherr hat unsere Unabhängigkeitserklärung abgelehnt und uns und unseren Verbündeten den Krieg erklärt."
 me_odrysia_finish.23.a: "So sei es..."
  
 me_odrysia_finish_24_title: "Unser Oberherr gibt nach"
 me_odrysia_finish_24_desc: "Unsere Oberherr hat nachgegeben und uns erlaubt, ein unabhängiges Volk zu werden, ohne viel Aufhebens darum zu machen."
 me_odrysia_finish.24.a: "Vielleicht sind sie schwächer als wir dachten?"
  
  
  ### tooltips ### 
  
 me_odrysia_mid_2_a_tt: "#Y Das führt dazu, dass wir annektiert werden!#!"
 me_odrysia_mid_2_b_tt: "#Y Dies wird einen Krieg zwischen unseren Leuten beginnen.#!"
 me_odrysia_mid_3_a_tt: "#Y Wir stimmen einer gemeinsamen Verwaltung sowie einem Waffenstillstand zwischen unseren Leuten zu.#!"
 me_odrysia_2_a_tt: "#Y Wir werden den anderen thrakischen Stämmen ein Angebot zur Vereinigung unter unserer Herrschaft unterbreiten.#!"
 odrysia_missions_01_freedom_task_02_tt: "#Y Wir werden unsere zukünftige Position über die Zukunft der Region Thrakien entscheiden.#!"
 odrysia_missions_01_freedom_task_03_tt: "#Y Wir werden Diplomaten zu unseren makedonischen Oberherren entsenden, um eine gemeinsame Zukunft in Thrakien zu besprechen.#!"
 odrysia_missions_01_freedom_task_04_tt: "#Y Wir werden uns an unsere Brüder in der Region Moesia wenden, um einen Plan zu entwerfen, um die eindringenden Makedonen loszuwerden.#!"
 odrysia_missions_01_freedom_task_05_tt: "#Y Dies wird dazu führen, dass wir die Lysimachiden um eine neue Braut bitten werden.#!"
 odrysia_missions_01_freedom_task_07_tt: "#Y Wir werden Delegationen zu den pontinischen griechischen Städten schicken und um ihre Neutralität im bevorstehenden Kampf um Thrakien bitten.#!"
 odrysia_missions_01_freedom_task_08_tt: "#Y Diese Mission wird den anderen thrakischen Stämmen Angebote zur Vereinigung unterbreiten, was entweder zu ihrer Annexion oder einem Krieg führen wird.#!"
 odrysia_missions_01_freedom_task_09_tt: "#Y Dies wird zu einem Krieg mit unserem Oberherren führen und uns ein für alle Mal von seinen Fesseln befreien.#!"
 odrysia_missions_01_freedom_task_12_tt: "#Y Mehrere odrysische Pops aus angrenzenden Regionen werden sich in eurem Reich niederlassen.#!"
 me_odrysia_start.4.a_tt: "#Y Wir werden Anspruch auf ganz Thrakien erheben und Delegationen zu unseren Brüdern entsenden.#!"
 me_odrysia_finish_21_a_tt: "#Y Wir erlangen Ansprüche auf alle Gebiete der anderen thrakischen Stämme und schließen einen Waffenstillstand mit den Makedonen.#!"
 me_odrysia_9_finish.att: "#Y Wir werden unsere Verbündeten zu Hilfe rufen, falls die Makedonen es wagen sollten, uns anzugreifen.#!"
  
