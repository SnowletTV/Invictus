 patauion_mission_task_1_DESC: "Wir haben hart gekämpft und sind weit gereist, um diese Stadt zu erobern. Doch im Königreich Patauion ist nicht alles bester Ordnung. Unsere Eroberung eines stolzen Volkes, der Patavi, bedeutet, dass unsere Oberschicht sich einer äußerst widerspenstigen und gewalttätigen Bevölkerung gegenüber sieht – doch wie werden wir es schaffen, aus unserem neuen Reich ein stabiles Königreich zu schmieden?\n\n\n\n\n\n\n\n\n\n@greek_mil15!" 
 patauion_mission_task_2_DESC: "Als wir noch in Sparta lebten, standen viele unserer Adelsfamilien in Konkurrenz zueinander, führten Fehden, hintergingen sich gegenseitig und beauftragen sogar Auftragsmörder, um einander zu beseitigen. In diesem fremden Land haben wir jedoch selten Zeit, uns um unsere alten, kleinlichen Streitigkeiten zu kümmern – nicht, solange die Patavi um uns herum gegen uns intrigieren und ihre Messer gegen uns wetzen.\nWenn wir die kommenden Jahre überleben wollen, müssen sich die wenigen spartanischen Adligen von Patauion zusammenschließen – wir können es uns nicht leisten, uneinig zu bleiben.\n\n\n\n\n\n\n\n\n\n@celt_mil1!" 
 patauion_mission_task_3_DESC: "Durch Schwierigkeiten bei der Steuererhebung mangelt es uns erheblich an Ressourcen, und wir müssen einen Weg finden, dem Abhilfe zu verschaffen. Wenn es uns gelingt, Kontakt zu einem anderen, wohlhabenden hellenischen Staat aufzunehmen, könnten wir diesen vielleicht davon überzeugen, dass es in seinem eigenen Interesse liegt, einem seiner Brüder in dessen anfänglichen Bemühungen um den Aufbau einer stabilen Polis beizustehen.\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 patauion_mission_task_4_DESC: "Es gibt zahlreiche lokale Stämme in der Region, die unterschiedlich stark sind. Und auch wenn ihre Sitten barbarisch sind, können wir es uns derzeit nicht leisten, uns Feinde zu machen. Angesichts unseres gravierenden Ressourcenmangels könnten wir, wenn wir ein starkes lokales Bündnis eingehen, unseren neuen Verbündeten vielleicht sogar davon überzeugen, uns Unterstützung zukommen zu lassen …\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 patauion_mission_task_5_DESC: "Unsere Stadt steht an einem Scheideweg. Da ihre Zukunft ungewiss ist und es bislang noch an jeglicher Grundlage mangelt, müssen wir dafür sorgen, dass wir sie in die Richtung lenken, die wir uns für sie wünschen – angesichts der vielen gegensätzlichen Vorstellungen darüber, welche Schritte zu unternehmen sind, müssen wir schnell entscheiden und entschlossen handeln, damit unser Königreich nicht vorzeitig untergeht.\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 patauion_mission_task_6_DESC: "Sie schreien und brüllen uns auf den Straßen an, aus Angst, einer Tyrannei ausgesetzt zu sein – die Patavi fordern, dass ihnen entweder Rechte und Privilegien gewährt werden oder dass man uns hinauswirft. Wenn wir die Einheimischen besänftigen wollen, sollten wir zumindest einigen ihrer Forderungen nachgeben.\n\n\n\n\n\n\n\n\n\n@italic_mil30!"
 patauion_mission_task_7_DESC: "Die einheimischen Pataver betrachten uns nicht nur mit Verachtung, sondern halten uns auch für viel zu fremd, um sie regieren zu können. Aber was wäre, wenn wir ihnen das Gegenteil beweisen würden? Wenn wir Foren schaffen, in denen sie ihre Unzufriedenheit und ihre Bedürfnisse frei von Verfolgung äußern können, wären sie vielleicht viel eher bereit, mit ihren hellenischen Herrschern zusammenzuarbeiten.\n\n\n\n\n\n\n\n\n\n@italic_mil5!"
 patauion_mission_task_8_DESC: "Seit unserer Ankunft in dieser Stadt haben wir große Fortschritte dabei gemacht, die Einheimischen zu verstehen und die Schäden zu beheben, die während unserer anfänglichen Eroberung entstanden sind. Die Einheimischen, die uns einst mit Verachtung begegneten, arbeiten nun mit uns zusammen und grüßen uns sogar auf den Straßen. Doch wir sind noch keine Stadt der Gleichberechtigten, und es besteht nach wie vor eine große Kluft zwischen dem spartanischen Adel und der venetischen Bevölkerung, über die wir herrschen – und wenn wir ein Königreich schaffen wollen, das frei von den sozialen Spannungen ist, die es schon so lange plagen, müssen wir etwas dagegen unternehmen.\n\n\n\n\n\n\n\n\n\n@italic_mil15!" 
 patauion_mission_task_9_DESC: "Auch wenn wir den Patavi zahlenmäßig nach wie vor hoffnungslos unterlegen sind, bietet die Erinnerung daran, wie es uns gelang, die Kontrolle über ihre Stadt zu erlangen, doch eine mögliche vorübergehende Lösung: der Einsatz von Söldnern. Abgesehen davon, dass sie uns als Leibwächter dienen könnten, könnten sie auch dazu eingesetzt werden, jene Steuern einzutreiben, die uns die Patavi bisher vorenthalten haben.\n\n\n\n\n\n\n\n\n\n@italic_mil28!" 
 patauion_mission_task_10_DESC: "Die Patavi haben sich viel zu lange unserer Herrschaft widersetzt, uns beschimpft und uns mit ihren Gewaltdrohungen einzuschüchtern versucht. In unserer alten Heimat Sparta wären solche Handlungen niemals geduldet worden! Nun ist es an der Zeit, diese patavischen Barbaren zu züchtigen und ihnen die Fesseln der Heloten anzulegen, die sie zu Recht verdienen – denn ihre Drohungen sind zweifellos leer, und ihr Kampfgeist ist zweifellos schwach.\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 patauion_mission_task_11_DESC: "Mit großem Blutvergießen haben wir um dieses Königreich gekämpft, und in vielen Schlachten haben wir bewiesen, dass wir dessen würdig sind. Komm, Ares! Sieh, dass wir es wahrhaftig verdienen, das Erbe unserer alten Krieger fortzuführen! Sieh den Ruhm des großen spartanischen Königreichs Patauion!\n\n\n\n\n\n\n\n\n\n@italic_mil3!" 
 patauion_mission_task_12_DESC: "Soziale Klassen, die auf dem Pferd basieren, sind den Menschen in Hellas nichts Fremdes. Sie waren für die Rivalen unserer Vorfahren, die Athener und Makedonen, von großer Bedeutung; doch die Einheimischen Venetiens haben eine besondere Verbundenheit zu Pferden und verfügen über eine höchst bewundernswerte kriegerische Tradition, die mit ihren „Pferdefürsten“ verbunden ist. – Wir wären Narren, wenn wir die Ekupetar-Eliten nicht für unsere Hippeis rekrutieren würden.\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 patauion_mission_task_13_DESC: "Als wir diese venetischen Küsten erreichten, ließen wir uns von unseren alten hellenischen Göttern leiten, doch in diesen Ländern weist uns die Weisheit der hiesigen patavischen Gottheiten den Weg. Auch wenn wir diejenigen, die wir so lange verehrt haben, nicht im Stich lassen dürfen, sollten wir doch die Bedeutung der Götter der Veneti reflektieren – sind Artemis und Reitia denn letztendlich so unterschiedlich?\n\n\n\n\n\n\n\n\n\n@greek_mil3!" 
 patauion_mission_task_14_DESC: "Die Spartaner sind für ihren unbeugsamen Geist bekannt und ziehen sich im Kampf nur selten zurück. Doch angesichts eines Sklavenaufstands erschauderten viele unserer Oberschicht und kauerten sich vor Angst zusammen, insbesondere die jüngsten unserer Männer.\nEs ist klar, dass wir es aufgrund von Instabilität und Ressourcenmangel nicht geschafft haben, diese alten Traditionen einer echten spartanischen Kampfausbildung aufrechtzuerhalten - dies ist eine Situation, die sofortiger Änderung bedarf!\n\n\n\n\n\n\n\n\n\n@greek_mil17!" 
 patauion_mission_task_15_DESC: "Durch die Gnade des Ares konnten wir dieses Land einnehmen, und es war der Segen des Ares, der es uns ermöglichte, den großen Helotenaufstand niederzuschlagen. Lasst uns unserem großen Gott danken und einen großen Tempel bauen, von dem aus seine Pracht über ganz Italien strahlen kann!\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 patauion_mission_task_16_DESC: "Während es natürlich ideal wäre, Verbündete zu finden, die uns in unserer derzeitigen Situation unterstützen könnten, bedeutet der Mangel an Alternativen, dass wir möglicherweise darüber nachdenken müssen, wie wir uns ohne Hilfe von außen selbst versorgen können – so bedauerlich das auch sein mag, könnte dies doch unsere einzige Möglichkeit sein, voranzukommen.\n\n\n\n\n\n\n\n\n\n@italic_mil28!"
  
