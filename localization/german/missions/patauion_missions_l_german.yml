 a_new_patauion_decision: "Ein neues Patauion" 
 a_new_patauion_decision_desc: "Seit unsere spartanischen Vorfahren in die venetischen Gebiete gekommen sind, ist das Verhältnis unserer Oberschicht zu den Einheimischen alles andere als freundschaftlich. Unser Versuch, die Veneter zu unseren neuen Heloten zu machen, hat sich als erfolglos erwiesen, da sie von Natur aus äußerst unabhängig sind und ihre hellenischen Herrscher zahlenmäßig weit übertreffen. Wenn wir uns aus dem dysfunktionalen Schatten Kleonymos’ befreien wollen, müssen wir unsere Stadt und unsere Kultur als Verschmelzung von Spartanern und venetischen Pataviern neu errichten. Mögen die mächtigen Spartaner eins werden mit diesen unnachgiebigen Venetern!"
 a_new_patauion_decision_requirement_1_tt: "#E Die #Y $venetic$e#!#! Kultur wurde #E integriert#!."
 reform_patauion_completion_tt_1: "#E #Y $enetoian$#!#! wird unsere #E Primärkultur#!" 
 reform_patauion_completion_tt_2: "Alle #E #T $peloponnesian$en#!#! Pops und #E #Y 5#!#! #E #T $venetic$en#!#! Pops in [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] werden " 
  
