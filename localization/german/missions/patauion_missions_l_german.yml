 me_angry_patavi_cmod: "Wütende Patavi"
 desc_me_angry_patavi_cmod: "Die Einwohner von Patauion sind wütend darüber, dass ihre Oberschicht durch ausländische Griechen ersetzt wird, und fürchten die Versklavung. Sie schrecken vor nichts zurück, um auch den letzten Spartaner aus ihrer Stadt zu vertreiben." 
 me_pat_outnumbered_aristocracy_cmod: "Unterzahl der herrschenden Klasse"
 desc_me_pat_outnumbered_aristocracy_cmod: "Da sie sich bei der Eroberung ihres neuen Königreichs auf Söldner verlassen mussten, war die Zahl der Spartaner, die tatsächlich nach Patauion kamen, um es zu regieren, äußerst gering. Folglich sind sie ständig in Gefahr, von den feindlichen Einheimischen gestürzt zu werden." 
 me_pat_difficulty_with_taxation_cmod: "Schwierigkeiten mit der Besteuerung" 
 desc_me_pat_difficulty_with_taxation_cmod: "Wütend über ihre Eroberung und entschlossen, das Königreich ihrer Eroberer auf jede erdenkliche Weise zu ruinieren, weigern sich die einheimischen Patavi, ihren spartanischen Herrschern Steuern zu zahlen. Dies stellt die Herrscher von Patauion natürlich vor ein großes Problem, da sie nicht in der Lage sind, genügend Männer aufzubieten, um die Patavi tatsächlich zu kontrollieren."
 me_pat_patavium_representation_pmod: "$me_patauion.31.t$" 
 desc_me_pat_patavium_representation_pmod: "Mit dem Aufbau der Infrastruktur und der Gründung von Gremien, die dazu dienen, ihre Bedürfnisse und Unzufriedenheiten zum Ausdruck zu bringen, stellen die lokalen Patavi fest, dass ihre Vertretung in der Politik deutlich gestiegen ist." 
 me_recently_reformed_patauion_enetoian_path_cmod: "Ein wiedergeborenes Patauion" 
 desc_me_recently_reformed_patauion_enetoian_path_cmod: "Da der Staat Patauion kürzlich einen tiefgreifenden Wandel durchlaufen hat, präsentiert er sich nun mit neuer Kraft und Energie nach außen, und seine Bürger sind bereit, bis zum letzten Mann zu kämpfen." 
 me_recently_reformed_patauion_spartan_path_cmod: "Ein neues Sparta" 
 desc_me_recently_reformed_patauion_spartan_path_cmod: "Nach viel Blutvergießen konnte sich Patauion vor Kurzem als neues Königreich der Spartaner etablieren und seine spartanischen Bürger sind entschlossen, das Königreich, für dessen Aufbau sie so hart gekämpft haben, zu beschützen."
 me_pat_hiring_mercenary_guards_cmod: "Söldnerwachen" 
 desc_me_pat_hiring_mercenary_guards_cmod: "Als Reaktion auf den Mangel an Mannstärke in der Oberschicht hat es sich in diesem Staat zur Tradition entwickelt, in großem Umfang Söldner für alle Arten von Verteidigungsaufgaben einzusetzen."
 me_aftermath_of_the_patavi_revolt_pmod: "Folgen des Patavischen Aufstands"
 desc_me_aftermath_of_the_patavi_revolt_pmod: "Die Patavi dieser Stadt haben kürzlich einen blutigen Krieg für ihre Freiheit geführt. Und obwohl sie viele Leben verloren haben, bedeutet die Hoffnung für die Zukunft,dass sie nun die Freiheit haben, viele weitere freie Patavi-Kinder großzuziehen und sich eine neue Zukunft aufzubauen." 
 me_showed_charity_to_the_patavi_pmod: "Wohltätigkeit gegenüber den Patavi" 
 desc_me_showed_charity_to_the_patavi_pmod: "Die Patavi sind ziemlich zufrieden mit den Geldern, die ihnen ihre Herrscher großzügig zukommen lassen." 
 me_patauian_hippeis_cmod: "Patauische Hippeis" 
 desc_me_patauian_hippeis_cmod: "Da sich viele der alten venetischen Ekupetaren von Patauion der neuen Hippeis-Klasse der Stadt angeschlossen haben, integrieren die Hippeis eine jahrhundertealte Tradition der Reitkunst, was ihre Kampfkraft erheblich steigert." 
 me_spartan_martial_tradition_cmod: "Spartanische Kampftraditionen" 
 desc_me_spartan_martial_tradition_cmod: "In Anlehnung an das alte spartanische System bildet Patauion seine Jugend durch einen brutalen Vorgang aus, der sie für jede Situation abhärtet. Das ist zwar grausam, bringt aber nahezu unbezwingbare Krieger hervor." 
 me_sycrenised_local_venetic_deities_cmod: "Das venetische Pantheon wurde snykretisiert" 
 desc_me_sycrenised_local_venetic_deities_cmod: "Die alten Götter der Patavi und die Götter, die die spartanische Elite Patauions mitbrachte, wurden vor Kurzem von den Enetoi synkretisiert, wodurch die Stärke beider Pantheons vereint wurde." 
 me_pat_invoking_the_power_of_ares_cmod: "Die Macht des Ares anrufen" 
 desc_me_pat_invoking_the_power_of_ares_cmod: "Patauion, ein großes Königreich an der norditalienischen Grenze, ist mit der Macht des großen Gottes Ares gesegnet! Auf in die Schlacht!" 
 me_pat_great_temple_to_ares_pmod: "Ares-Tempel in Patauion" 
 desc_me_pat_great_temple_to_ares_pmod: "In diesem Gebiet befindet sich ein monumentaler Tempel des hellenischen Gottes Ares, ein wahres Zeugnis seiner Größe, das alle anderen in der Region in den Schatten stellt!" 
 me_pat_change_of_deities_cmod: "Nachdenken über die Götter" 
 desc_me_pat_change_of_deities_cmod: "Nach großen religiösen Veränderungen ist sich dieses Land nicht sicher, welchen Göttern es folgen soll." 
  
 refused_to_help_patauion_opinion: "Weigerte sich, uns Hilfe zu schicken" 
 strengthened_ties_patauion_opinion: "Gestärkte Beziehungen"
  
 pat_spartans_must_stick_together: "Spartaner halten zusammen" 
  

  
  #################### 
  # Event Localization 
  #################### 
  
 me_patauion.16.t: "Die Nachwirkungen der Eroberung" 
 me_patauion.16.desc: "Sieg! Unsere spartanischen Soldaten, angeführt vom furchtlosen Kleonymos und unterstützt durch Söldnertruppen, haben Patauion den venetischen Patavi entrissen! Während wir uns auf den Weg zum Ruhm machten, waren wir uns nicht sicher, wohin uns unsere Reise über die Adria führen würde. Als wir jedoch die Reichtümer von Patauion erblickten, wollten wir sie in unsere lakedaimonischen  Hände bringen. Nun, da wir unseren Sieg errungen haben, hat Kleonymos beschlossen, die Gelegenheit zu nutzen, um ein neues Königreich für uns zu begründen, mit seinen Gefährten als seinem neuen spartanischen Adel. Doch ist nicht alles zum Besten in unserem Königreich Patauion.\n\nEmpört darüber, entrechtet worden zu sein, betrachten uns die einheimischen Patavi mit äußerster Verachtung und lehnen alle Versuche ab, Steuern zu zahlen und Heeresfolge zu leisten. Was noch schlimmer ist: Da die Söldner, die uns zum Sieg verholfen haben, nun fort sind, sind die Patavi uns zahlenmäßig weit überlegen – weitaus mehr noch als die Heloten-Sklaven, die wir in unserer Heimat kontrollieren konnten. Wir haben uns zwar eine neue Heimat geschaffen, doch diese steht auf äußerst wackeligen Füßen. Ein falscher Schritt, und sie wird uns entgleiten." 
 me_patauion.16.a: "Wir müssen unser neues Reich stabilisieren" 
 me_patauion.16.a_tt: "#E [SCOPE.GetRootScope.GetCountry.GetName]#! muss sich schnell stabilisieren, sonst werden andere es seinerseits erobern.\n\n$mission_completed_tooltip_1$ '#Y $patauion_mission_task_1$#!' $mission_completed_tooltip_2$" 
  
 me_patauion.17.t: "Vereinigte Spartaner" 
 me_patauion.17.desc: "Wir Spartaner sind nicht gerade dafür bekannt, Angst zu verspüren, und dennoch liegen wir nachts wach und zittern in unseren Betten.\nDie Einwohner unserer eroberten Stadt hassen uns, verschwören sich gegen uns und zücken ihre Messer für Attentate oder sogar zukünftige Aufstände, und dessen sind wir uns nur allzu bewusst. Da jede Straßenecke potenziell den Tod bedeuten kann, erscheinen uns die kleinlichen Meinungsverschiedenheiten, die unsere Elite damals in Sparta plagten, nun unbedeutend. Solange das Schicksal unser Leben auf diese Weise verfolgt, können wir es uns nicht leisten, uneinig zu bleiben." 
 pat_unite_the_aristocracy_effect_tooltip: "Die Loyalität jedes #Y #E $peloponnesian$en#!#! Charakters in #E [SCOPE.GetRootScope.GetCountry.GetName]#! hat zugenommen."
 me_patauion.17.a: "Wir Spartaner müssen zusammenhalten" 
 me_patauion.17.a_tt: "$mission_completed_tooltip_1$ #Y $patauion_mission_task_2$#!' $mission_completed_tooltip_2$" 
  
 me_patauion.18.t: "Die Zukunft von Patauion" 
 me_patauion.18.desc: "Seit unserer Ankunft an diesen Küsten sind nun einige Jahre vergangen und unsere Lage ist nach wie vor allzu prekär. Wir müssen eine wichtige Entscheidung darüber treffen, wie wir unsere Stadt in den kommenden Jahren führen wollen.\nWährend die spartanische Elite darüber diskutiert hat, in welche Richtung wir unsere Stadt führen sollen, haben sich zwei Hauptwege herauskristallisiert. Entweder versuchen wir (wie es sich unser Anführer hier, Kleonymos, gewünscht hat), die zahlreichen Patavi zu unterwerfen und die alte Gesellschaftsordnung Spartas einzuführen, zu der viele von uns zurückkehren möchten, oder wir versuchen, die Einheimischen zu beruhigen und eine Stadt zu errichten, in der Lakedaimonier und Patavi in Eintracht zusammenleben können.\n\n#E Werden wir dem Wunsch von Kleonymos folgen und ein neues Sparta in diesem nördlichen Land gründen oder versuchen, einen hellenischen Staat zu gründen, der sich von unserer Heimat unterscheidet?#!" !
 me_patauion.18.a: "Kleonymos ist nicht mehr, wir müssen ein anderes Schicksal suchen, dem wir folgen können..." 
 me_patauion.18.a_tt: "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_5$#!' $mission_completed_tooltip_2$\nDie Missionsaufgaben für #E #Y$patauion_mission_task_11$#!#! werden #E deaktiviert#!\n\nDiese Option ist verfügbar, weil #E Kleonymos#! entweder #E tot#! ist oder #E von der Macht entfernt wurde#!"
 me_patauion.18.b: "Kleonymos wird uns führen, wie er uns in dieses Land geführt hat." 
 me_patauion.18.b_tt: "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_5$#!' $mission_completed_tooltip_2$\nDie Missionsaufgaben für #E #Y$patauion_mission_task_8$#!#! werden #E deaktiviert#!\n\nDiese Option ist verfügbar, da #E Kleonymos#! weiterhin der Herrscher von #E Patauion#! ist und er seine Meinung nicht ändern wird." 
  
 me_patauion.19.t: "Aufstieg der Enetoi" 
 me_patauion.19.desc: "Unsere Bemühungen zahlen sich nun schon seit einiger Zeit aus: Die Patavi betrachten uns immer weniger als fremde Eroberer, sondern eher als gerechte Herrscher. Das geht so weit, dass viele von ihnen begonnen haben, sich die Mühe zu machen, unsere Sprache zu lernen – wenn auch mit einem starken patavischen Akzent. Ebenso hat unsere spartanische Oberschicht begonnen, viele der venetischen Bräuche zu übernehmen, die wir einst als barbarisch betrachteten: Wir verwenden einige Wörter der lokalen Sprache in unserem täglichen Sprachgebrauch und übernehmen sogar viele ihrer Kleidungsstücke, darunter manchmal sogar die Hosen, die wir einst als so barbarisch empfanden.\n\nMit der Zeit sehen wir wirklich, dass unsere einst verfeindeten Völker langsam zu einem einzigen verschmelzen."
 me_patauion.19.a: "Mit der Zeit verändert sich Patauion und damit auch seine Menschen."
 me_patauion.19.a_tt: "$mission_completed_tooltip_1$ #Y $patauion_mission_task_8$#!' $mission_completed_tooltip_2$" 
  
 me_patauion.20.t: "Ein neues Sparta" 
 me_patauion.20.desc: "Seit unserer Ankunft an diesen Küsten herrschte Instabilität, aber wir blieben entschlossen. Die einheimischen Patavi revoltierten in überwältigender Zahl, und doch blieben wir unnachgiebig und vereint. Jetzt hat sich der Staub gelegt, und unsere Macht über Patauion ist gesichert. Wir sind frei, die Zukunft zu gestalten, für die wir so lange gekämpft haben.\nMit der Faust des Ares und literweise Blut ist es uns gelungen, ein neues spartanisches Königreich zu errichten, weit weg von Hellas, in der Stadt Patauion." 
 me_patauion.20.a: "Patauion wird auf ewig unbesiegbar bleiben!" 
 me_patauion.20.a_tt: "$mission_completed_tooltip_1$ #Y $patauion_mission_task_11$#!' $mission_completed_tooltip_2$" 
  
 me_patauion.21.t: "Hellenische Hilfe" 
 me_patauion.21.desc: "In unserer schwierigne Lage haben wir große Anstrengungen unternommen, um einige Bündnisse zu schmieden, die unserem Reich kurzfristig Schutz bieten könnten. Da uns jedoch derzeit die Ressourcen fehlen und wir derzeit nicht in der Lage sind, weitere zu produzieren, sind wir auch auf Hilfe angewiesen.\nDazu hoffen wir, dass unsere griechischen Brüder unserem Hilferuf folgen und uns dabei unterstützen, unsere gemeinsame Zivilisation noch weiter zu verbreiten."
 me_patauion.21.a: "Hoffen wir, dass unsere hellenischen Brüder helfen!" 
 me_patauion.21.a_tt: "Eine Bitte um Hilfe wird an eure neuen #E hellenischen Verbündeten#! gesandt."
  
 me_patauion.22.t: "Patauion bittet um Unterstützung"
 me_patauion.22.desc: "Die Stadt #E [GetProvince('(int32)3594').GetName]#! könnte sich in Zukunft zu einem mächtigen Verbündeten entwickeln, aber da sie erst vor Kurzem gegründet wurde, muss sie sich noch konsolidieren und wird sowohl Zeit als auch Ressourcen benötigen, um sich zu entwickeln. Aus diesem Grund sind Diplomaten aus [GetProvince('(int32)3594').GetName] zu unserem [ROOT.GetCountry.GetRulerTitle] gekommen und haben uns gebeten, ob wir unsere Allianz mit ihnen ehren könnten, indem wir ihnen dringend benötigte Hilfe schicken. Dabei verwiesen sie auf das gemeinsame hellenische Erbe, das wir in diesen neuen Grenzgebieten schützen sollten."
 me_patauion.22.a: "Natürlich werden wir unserem neuen Verbündeten helfen!" 
 me_patauion.22.a_tt: "#E #Y 2#! #E unserer#! Pops werden nach #E Patauion#! aufbrechen" 
 me_patauion.22.b: "Ähh..." 
 me_patauion.22.b_tt: "#E Patauion#! wird über unsere Weigerung, zu helfen #R empört#! sein" 
  
 me_patauion.23.t: "Unser Verbündeter schickt Hilfe"
 me_patauion.23.desc: "Es scheint, als wäre unserer Bitte entsprochen worden, denn unser Verbündeter hat sich bereit erklärt, uns Hilfe zu schicken!\nNatürlich können wir nicht allzu überrascht sein, denn dies war das Ergebnis harter diplomatischer Arbeit durch [ROOT.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]."
 me_patauion.23_tt: "#E #Y 4#! Griechische #! Pops kommen in #E Patauion#! an" 
 me_patauion.23.a: "Wir wussten, dass sie uns helfen würden!" 
 me_patauion.23.a_tt: "$mission_completed_tooltip_1$ #Y $patauion_mission_task_3$#!' $mission_completed_tooltip_2$" 
  
 me_patauion.24.t: "Unser Verbündeter schickt keine Hilfe"
 me_patauion.24.desc: "Trotz unserer eindeutigen und vernünftigen Bitte um Hilfe scheint es, als hätte unser Verbündeter diese abgelehnt und uns in unserer Not im Stich gelassen – trotz der Brüderlichkeit, die zwischen uns besteht.\n\nVerflucht seien sie." 
 me_patauion.24.a: "Dreckige Verräter!" 
 me_patauion.24.a_tt: "$mission_completed_tooltip_1$ #Y $patauion_mission_task_3$#!' $mission_completed_tooltip_2$" 
  
 me_patauion.25.t: "Hilfe von den Einheimischen" 
 me_patauion.25.desc: "In unserer schwierigne Lage haben wir große Anstrengungen unternommen, um einige Bündnisse zu schmieden, die unserem Reich kurzfristig Schutz bieten könnten. Da uns jedoch derzeit die Ressourcen fehlen und wir derzeit nicht in der Lage sind, weitere zu produzieren, sind wir auch auf Hilfe angewiesen.\nWir müssen diese lokalen Barbaren davon überzeugen können, dass die kurzfristige Unterstützung ihres Verbündeten langfristig zu gegenseitigem Nutzen führen wird." 
 me_patauion.25.a: "Hoffen wir, dass unsere neu gewonnenen Verbündeten helfen werden!"
 me_patauion.25.a_tt: "Eine Bitte um Hilfe wird an eure neuen #E Verbündeten #! gesandt." 
  
 me_patauion.26.t: "Patauion erbittet Unterstützung" 
 me_patauion.26.desc: "Die Stadt #E [GetProvince('(int32)3594').GetName]#! könnte sich in Zukunft zu einem mächtigen Verbündeten entwickeln, aber da sie erst vor Kurzem gegründet wurde, muss sie sich noch konsolidieren und wird sowohl Zeit als auch Ressourcen benötigen, um sich zu entwickeln. Aus diesem Grund sind Diplomaten aus [GetProvince('(int32)3594').GetName] zu unserem [ROOT.GetCountry.GetRulerTitle] gekommen und haben gebeten, unser Bündnis mit ihnen zu ehren, indem wir ihnen dringend benötigte Hilfe schicken - und dabei verwiesen sie auf die Vorteile eines stabilen hellenischen Handelszentrums so nah an der Heimat." 
 me_patauion.26.a: "Natürlich werden wir unserem neuen Verbündeten helfen!" 
 me_patauion.26.a_tt: "#E Patauion#! wird unsere Mittel erhalten. \nDie #E Beziehungen#! zwischen #E euch#! und #E #Y Patauion#!#! werden sich erheblich verbessern." 
 me_patauion.26.b: "Verdanken wir diesen Griechen wirklich so viel?" 
 me_patauion.26.b_tt: "#E Patauion#! wird #R enttäuscht#! sein, wenn wir ihm nicht helfen"
  
 me_patauion.27.t: "Lokaler Verbündeter leistet Hilfe" 
 me_patauion.27.desc: "Es scheint, als wäre unserer Bitte entsprochen worden, denn unser Verbündeter hat sich bereit erklärt, uns Hilfe zu schicken!\nDas überrascht uns natürlich nicht allzu sehr, denn dies war das Ergebnis der intensiven diplomatischen Bemühungen durch [ROOT.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]" 
 me_patauion.27_tt: "Die #E Beziehungen#! zwischen #E euch#! und #E eurem neuen Verbündeten#! verbessern sich erheblich."
 me_patauion.27.a: "Wir haben einen guten Verbündeten gewählt!" 
 me_patauion.27.a_tt: "$mission_completed_tooltip_1$ #Y $patauion_mission_task_4$#!' $mission_completed_tooltip_2$" 
  
 me_patauion.28.t: "Lokaler Verbündeter verweigert Hilfe" 
 me_patauion.28.desc: "Trotz unserer deutlichen und verständlichen Bitte um Hilfe scheint es, als ob unser Verbündeter diese abgelehnt hätte und uns in Zeiten der Not trotz der starken Banden, die wir zwischen uns geknüpft hatten, im Stich lässt.\n\nVerflucht seien sie." 
 me_patauion.28.a: "Barbaren kann man selten trauen" 
 me_patauion.28.a_tt: "$mission_completed_tooltip_1$ #Y $patauion_mission_task_4$#!' $mission_completed_tooltip_2$" 
  
 me_patauion.30.t: "Eine Frage der Führung"
 me_patauion.30.desc: "Unsere neue Heimat haben wir einem Mann zu verdanken, nämlich Kleonymos, der auf der Suche nach Ruhm über die Adria segelte. Doch je mehr Zeit vergeht und je deutlicher die Unsicherheit unserer Lage wird, desto deutlicher wird, dass auch er dafür verantwortlich ist. Fest entschlossen, jenes spartanische Königreich wieder aufzubauen, das ihm von Anfang an hätte zustehen sollen, ist er völlig darauf versessen, welchen Weg wir mit der Stadt Patauion einschlagen sollen. Selbst wenn uns dieser in den Ruin führen sollte.\n\n#E WWenn Patauion einen flexibleren Ansatz verfolgen soll, müssen wir möglicherweise einen Führungswechsel vornehmen.#!" 
 me_patauion.30.a: "Kleonymos muss entfernt werden" 
 me_patauion.30.a_tt: "#E Kleonymos#! wird entmachtet\n\n#T Dies wird den Verlauf von Patauions Missionsbaum beeinflussen.#!" 
 me_patauion.30.b: "Wir werden unseren König nicht verraten!" 
 me_patauion.30.b_tt: "#E Kleonymos#! wird an der Macht bleiben\n\n#T Dies wird den Verlauf von Patauions Missionsbaum beeinflussen.#!" 
  
 me_patauion.31.t: "Vertretung der Patavi" 
 me_patauion.31.desc: "Als Reaktion auf unzählige Appelle der lokalen Bevölkerung unserer Stadt hat unser [ROOT.GetCountry.GetRulerTitle], [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen], in weiser Entscheidung beschlossen, Stellen einzurichten, an die sich die Patavi wenden können, um ihre Bedenken und ihren Unmut gegenüber ihren derzeitigen Statthaltern zu äußern. Zwar wird es weiterhin in gewissem Maße zu Missverständnissen kommen, doch diese Maßnahmen werden wenigstens dafür sorgen, dass sich unsere lokale Bevölkerung zumindest von unserer spartanischen Oberschicht gehört fühlt." 
 me_patauion.31.a: "Menschen Patauions, lasst uns eure Sorgen hören!" 
 me_patauion.31.a_tt: "$mission_completed_tooltip_1$ #Y $patauion_mission_task_7$#!' $mission_completed_tooltip_2$" 
  
 me_patauion.32.t: "Angeheuerte Wachleute" 
 me_patauion.32.desc: "Unsere spartanischen Adligen und Familienmitglieder sind den  patavischen Wölfen zahlenmäßig unterlegen und laufen Gefahr, von der örtlichen Bevölkerung ermordet zu werden. Da die Einberufung von Einheimischen nicht in Frage kommt, hat unser Anführer [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] klugerweise beschlossen, ausländische Söldner zu unserem Schutz anzuheuern.\nWährend die Abhängigkeit von Söldnern die Verteidigung kleinerer Staaten geschwächt hat, werden wir versuchen, unsere eigenen Kriegstraditionen aufrechtzuerhalten, wenn auch mit künstlich aufgestockten Zahlen. Außerdem können wir mit mehr bewaffneten Wachen unter unserer Kontrolle unsere Steuern endlich mit roher Gewalt eintreiben." 
 me_patauion.32.a: "Endlich kann die Steuer fließen" 
 me_patauion.32.a_tt: "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_9$#!' $mission_completed_tooltip_2$" 
  
 me_patauion.33.t: "Der Patavi-Aufstand!" 
 me_patauion.33.desc: "Empört über unsere Versuche, langsam immer mehr Druck auf sie auszuüben, sind die Patavi schließlich außer sich geraten, als wir versuchten, ihren Status als Helotensklaven zu formalisieren. Sklavenhalter, die zur Kontrolle der Heloten entsandt wurden, wurden alle getötet, und die Patavi marschieren durch die Straßen von Patavium, entschlossen, jeden letzten Griechen in der Stadt abzuschlachten, die sie zu Recht als ihr Eigentum betrachten!\nWir haben sie schon einmal besiegt, aber [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] weiß, dass der Verlust der Kontrolle jetzt nicht nur den Verlust von [ROOT.GetCountry.GetRuler.GetHerHis]em Reich bedeutet, sondern auch das Ende der spartanischen Herrschaft über Patauion."
 patavi_have_revolted_tooltip: "Alle #E #Y Sklaven $venetic$er Kultur#!#! in Patauion haben sich in einer #E Revolte#! erhoben" 
 me_patauion.33.a: "Wir werden niemals die Kontrolle über #E Patauion#! aufgeben!" 
 me_patauion.33.a_tt: "Wenn die #E patavischen revoltierenden Rebellen#! die Provinz #E [GetProvince('(int32)3594').GetName]#! in #E #Y 1#! Jahren#! in ihrer Gewalt haben, wird unser Königreich #E #R an die Patavi fallen.#!#! "
  
 me_patauion.35.t: "Endgültige Niederlage der Patavi" 
 me_patauion.35.desc: "Nach monatelangen blutigen Kämpfen ist es uns endlich gelungen, den Aufstand der Heloten niederzuschlagen. Es gab Zeiten, in denen unser [SCOPE.GetRootScope.GetCountry.GetRulerTitle] bei dem Gedanken zitterte, dass die Armee der Patavi in die königlichen Gemächer der Stadt eindringen und alle niedermetzeln könnte, die sie dort vorfanden, doch glücklicherweise ist es nie dazu gekommen.\nNun haben die Patavi all ihre Kräfte und Ressourcen vollständig aufgebraucht, und es besteht keine Gefahr mehr, dass sie weiteren Widerstand leisten. Und nachdem der Aufstand endgültig niedergeschlagen ist, haben unsere spartanischen Sklavenhalter begonnen, die geschwächte venetische Bevölkerung zusammenzutreiben und die Barbaren in die Ketten zu legen, gegen die sie sich so lange gewehrt hatten.\n\nAuch wenn der Preis enorm war, steht uns nun der Weg offen, unsere alte Lebensweise hier in Patavnos wieder angemessen zu etablieren." 
 patavi_army_is_defeated_tt: "Alle überlebenden  #E #Y Sklaven#! $venetic$er Kultur#!, die sich dem #E Aufstand#! angeschlossen hatten, werden in #E [GetProvince('(int32)3594').GetName]#! erneut versklavt."
 me_patauion.35.a: "Jetzt sind wir frei, einen wahren spartanischen Staat zu schmieden" 
 me_patauion.35.a_tt: "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_10$#!' $mission_completed_tooltip_2$\nDer Patavi-Aufstand wurde niedergeschlagen"
  
 me_patauion.37.t: "Die Patavi dringen in die königlichen Gemächer ein" !
 me_patauion.37.desc: "In den letzten Monaten des Kampfes hatte sich der spartanische [SCOPE.GetRootScope.GetCountry.GetRulerTitle] von Patauion, [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen],  in den königlichen Gemächern der Stadt verschanzt und war nicht bereit, auch nur den Versuch einer weiteren schwachen Gegenwehr gegen die Horde der Patavi zu unternehmen. Die spartanischen Heere wurden vernichtend geschlagen, und während der Rest der Aristokratie auf dem Schlachtfeld sein Ende fand, überlebt nur unser traumatisierter [SCOPE.GetRootScope.GetCountry.GetRulerTitle] in einem verborgenen Domizil in der Stadt.\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] vernimmt draußen schwere Schritte und den Lärm von Männern und Waffen. In Panik sucht [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] nach einem Fluchtweg, aber es ist zu spät. Die Türen zum Zimmer von [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] fliegen auf, und der Anführer der patavischen Truppen, Anetor von Patavnos, steht in der Tür, während viele von Anetors bewaffneten Männern auf [SCOPE.GetRootScope.GetCountry.GetRuler.Custom('get_SieIhn'] zustürmen.\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] streckt viele der Barbaren nieder, aber es sind zu viele. Und der alte [SCOPE.GetRootScope.GetCountry.GetRulerTitle] wird schließlich durch die überwältigenden Hiebe der Klingen bewegungsunfähig gemacht." 
 patavi_army_defeats_patauion_tt: "Alle überlebenden venetischen Pops, die sich dem Aufstand angeschlossen hatten, werden befreit" 
 patavi_army_defeats_patauion_spartan_deaths_tt: "Alle #E $peloponnesian$en#! Charaktere und Pops wurden #E #R massakriert#!#!"
 me_patauion.37.a: "IHR WERDET ALLE IM TARTARUS LEIDEN!" 
 me_patauion.37.a_tt: "#E #R Das Spiel endet für  dich#!#!" 
 me_patauion.37.b: "Ich frage mich, wie das Schicksal diesen 'Antenor' behandeln wird?" 
 me_patauion.37.b_tt: "#E Du spielst als #Y $PATAVNOS_COUNTRY_NAME$#!#!" 
  
 me_patauion.38.t: "Zugeständnisse an die Patavi" 
 me_patauion.38.desc: "Die Bewohner von Patauion stehen uns Lakemaidoniern nach wie vor äußerst misstrauisch gegenüber, doch ihre Feindseligkeiten lassen allmählich nach. Zwar schienen sie angesichts der Aussicht auf eine spartanische Herrschaft in Schrecken versetzt zu sein – aus Angst, zu Heloten-Sklaven gemacht zu werden, wie wir sie aus unserer alten Heimat kennen (leider eine durchaus berechtigte Angst) –, doch hat uns ihre Feindseligkeit dazu gezwungen, Zugeständnisse hinsichtlich ihres rechtlichen Status zu machen und ihnen die Rechte zu gewähren, die sie gefordert haben, um ihre Lebensweise zu sichern. Infolgedessen verhalten sie sich uns Hellenen gegenüber weniger aggressiv." 
 me_patauion.38.a: "Wir freuen uns über diese Fortschritte!"
 me_patauion.38.a_tt: "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_6$#!' $mission_completed_tooltip_2$" 
 me_patauion.38.b: "Zeigt den Eingeborenen die Großzügigkeit ihrer spartanischen Herrscher!"
 me_patauion.38.b_tt: "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_6$#!' $mission_completed_tooltip_2$" 
  
 me_patauion.39.t: "Eingliederung der alten Ekupetar" 
 me_patauion.39.desc: "Das Schlagen von Hufen ist auf den Ebenen Venetiens, auch in unserer Stadt Patauion, weit verbreitet,  so wie es schon in längst vergangenen Zeiten war und auch in Zukunft sein wird. Unsere spartanischen Vorfahren waren zwar nicht besonders vertraut mit den Gewohnheiten der Pferde, doch dies wurde durch die Eingliederung der alten Patavi Ekupetars in unsere Hippeis weitgehend behoben.\nMit einer gestärkten, auf dem Pferd beruhenden Kampfkultur werden nun nur noch wenige in der Lage sein, die Enetoi Mann gegen Mann zu bekämpfen." 
 me_patauion.39.a: "Die Enetoi werden die Ebenen beherrschen!" 
 me_patauion.39.a_tt: "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_12$#!' $mission_completed_tooltip_2$"
  
 me_patauion.40.t: "Götter der Enetoi" 
 me_patauion.40.desc: "Als die Spartaner zum ersten Mal in diese Gefilde kamen, wurden sie von den Patavi als fremde Eroberer angesehen, im Laufe der Zeit haben sich die Grenzen zwischen den beiden Gruppen jedoch aufgelöst. Ebenso wurden die Götter, die die Spartaner mitbrachten, als seltsame, fremde und blasphemische Wesen angesehen, doch im Laufe der Zeit sehen wir alle, dass ihre Parallelen zu den lokalen Göttern der Patavi zeigen, dass sie ein und dieselben sind wie jene, die in diesen Ländern bereits verehrt wurden.\nSo wie die Enetoi unter einer einzigen Sprache vereint wurden, vereinen sie sich nun auch in der Anbetung."
 syncrenise_venetic_deities_pop_conversion_tooltip: "#E #Y Alle #! $italic_pantheon$#! Pops in #E [GetProvince('(int32)3594').GetName]#! werden zu #E $roman_pantheon$#! konvertiert."
 me_patauion.40.a: "Patauion bleibt standhaft, mit der Unterstützung Ares' Einaios'" !
 me_patauion.40.a_tt: "$mission_completed_tooltip_1$ '#Y $patauion_mission_task_13$#!' $mission_completed_tooltip_2$"
  
 me_patauion.41.t: "Der große Tempel des Ares"
 me_patauion.41.desc: "Endlich wird der Tempel enthüllt. Bereit, zur Verehrung Ares'.\nEiner der größten Tempel außerhalb von Hellas, erbaut nicht nur als Zeugnis der Herrlichkeit Ares', sondern auch als Denkmal unseres doppelten Sieges über die Patavi und ihre Unterwerfung als unsere Heloten. Während unsere Götter in diesen Ländern lange Zeit kaum eine Rolle spielten, dient dieser Tempel nun als Leuchtfeuer für ihre wachsende Macht in Norditalien." 
 pat_built_temple_to_ares_tooltip: "Ein großer Ares-Tempel in Patauion wurde errichtet"
 me_patauion.41.a: "Möge die Herrlichkeit Ares' für alle sichtbar sein!" 
 me_patauion.41.a_tt: "$mission_completed_tooltip_1$ #Y $patauion_mission_task_14$#!' $mission_completed_tooltip_2$" 
  
 me_patauion.42.t: "Spartanische Traditionen" 
 me_patauion.42.desc: "Viele Jahre lang von unserer Heimat getrennt und in überwältigende Konflikte verwickelt, haben wir viele Jahre lang unsere alten spartanischen Traditionen nicht mehr gepflegt, wie etwa die Ausbildung unserer Jugend in den Künsten des Krieges, wie wir noch selbst erlernten.\nFolglich verhielten sich unsere jüngeren patauischen Krieger deutlich feiger und wirkten weitaus schwächer, als es in Sparta jemals toleriert worden wäre. Daher leitete [ROOT.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] Maßnahmen ein, um unsere Jugend neu zu disziplinieren und unsere spartanischen Methoden zur Ausbildung von Kriegern wieder einzuführen.\n\nNun können wir sehen, dass sich diese Bemühungen auszahlen und unsere jungen Männer die Robustheit und Entschlossenheit für den Kampf zeigen, die unsere Vorfahren stolz gemacht hätte. 
 me_patauion.42.a: "Wie alle Spartaner werden die Patauier niemals nachgeben!" 
 me_patauion.42.a_tt: "$mission_completed_tooltip_1$ #Y $patauion_mission_task_15$#!' $mission_completed_tooltip_2$"
  
 me_patauion.44.t: "Auf uns allein gestellt" 
 me_patauion.44.desc: "Trotz unserer Bemühungen konnten wir keine Verbündeten finden, die unsere Siedlung Patauion unterstützen. Ohne diplomatische Perspektiven sind wir ganz auf uns allein gestellt, um mit unserer Instabilität und unseren Konflikten fertig zu werden, sehr zum Leidwesen von [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen].\nOhne eine kurzfristige Lösung für unseren Ressourcenmangel erscheint ein einfacher Weg aus der Krise für unsere spartanischen Adligen immer unwahrscheinlicher." 
 me_patauion.44.a: "Wir werden das schon überstehen." 
 me_patauion.44.a_tt: "$mission_completed_tooltip_1$ #Y $patauion_mission_task_16$#!' $mission_completed_tooltip_2$" 