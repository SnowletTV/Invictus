 patauion_mission_01_DESCRIPTION: "Angetrieben von Ehrgeiz hat Kleomynos uns in einem ruhmreichen Feldzug an diesen Ort geführt, und wir haben eine der größten und ältesten Städte, #E Patavium#!, zu unserer neuen Heimat gemacht. Doch wir sind den einheimischen Barbaren zahlenmäßig völlig unterlegen. Da die Einheimischen unseren Untergang planen und unsere Herrschaft über die Stadt noch nicht gefestigt ist, müssen wir schnell handeln, um unser neues Königreich zu stabilisieren – sonst müssen wir vielleicht schneller nach Sparta zurückfliehen, als wir gekommen sind.\n\n#E Wird unsere Stadt aus dem Schatten von Kleonymos’ blutiger Eroberung treten?#!" 
 patauion_mission_01_CRITERIA_DESCRIPTION: "Wir müssen #E Patauion#! stabilisieren und entweder die aufgebrachten Einheimischen integrieren oder sie vollständig als Heloten  versklaven." 
 patauion_mission_01_REWARD_DESCRIPTION: ""
  
