l_german:
  #Done 26.09.26 - 
  persis_mission_1_freedom:0 "Persische Bestrebungen"
  persis_mission_1_freedom_DESCRIPTION:0 "Die Geschichte der Region Persis ist reich und vielfältig. Eine Erzählung, die mit jeder wiederholten Überlieferung scheinbar an Umfang zunimmt. Aus dieser Region stammten die Achämeniden, die der Welt das Licht der Zivilisation brachten, bevor sie die Schmach einer Niederlage durch makedonische Barbaren erleiden mussten. Wer glaubt, die besten Tage von Persis lägen hinter ihr, hat die Vorzeichen nicht beachtet; die Götter haben viel für uns vorgesehen."
  persis_mission_1_freedom_CRITERIA_DESCRIPTION:0 "Diese Mission gilt als abgeschlossen, wenn wir die fremden Eindringlinge aus unseren Heimatländern vertrieben und die Macht von Persis wiederhergestellt haben!"
  persis_mission_1_freedom_BUTTON_TOOLTIP:0 "In ihrer Hybris werden diejenigen, die uns versklaven wollen, selbst völlig zerstört werden."
  persis_mission_1_freedom_BUTTON_DETAILS: ""
 
  persis_mission_1_freedom_task_1:0 "Persepolis wiederherstellen"
  persis_mission_1_freedom_task_1_DESC:0 "Die Barbaren zerstörten Persepolis in ihrer Trunkenheit und brannten die Stadt bis auf die Grundmauern nieder. Sie mögen die Stadt zerstört haben, doch ihren Traum können sie nicht auslöschen. Heute lassen wir unsere Visionen Wirklichkeit werden. \n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 
  persis_mission_1_freedom_task_2:0 "Die Uxii kontaktieren"
  persis_mission_1_freedom_task_2_DESC:0 "Es gibt viele Verbindungen zwischen unserem Volk und den Uxiern. Wir teilen so viele religiöse und kulturelle Bräuche, dass viele Fremde unsere Völker nicht voneinander unterscheiden können. Es ist unsere Pflicht, diese alten Bande erneut zu knüpfen. \n\n\n\n\n\n\n\n\n\n@persia_mil1!"

  persis_mission_1_freedom_task_4:0 "Suravan urbanisieren"
  persis_mission_1_freedom_task_4_DESC:0 "Derzeit ist die Hauptstadt unserer Provinz Mardiene dieser Ehre nicht würdig, da sie nicht mehr als eine einfache Siedlung ist. Wir haben große Pläne für diese Region, daher sollten wir alles daran setzen, Suravan zu urbanisieren, sobald sich die Gelegenheit dazu bietet. \n\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 
  persis_mission_1_freedom_task_5:0 "Batrakatash verschönern"
  persis_mission_1_freedom_task_5_DESC:0 "Wenn man Parsa verlässt und der Königsstraße nach Norden folgt, ist die imposante Bergstadt Pathragada, die einst als Batrakatash bekannt war, in weniger als ein paar Wochen Reitzeit zu erreichen. Wir verlassen uns zwar auf die Befestigungsanlagen dieser alten Stadt, um unsere Hauptstadt zu schützen, könnten aber Maßnahmen ergreifen, um sie auch zu einem Zentrum der Kultur zu machen. \n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 
  persis_mission_1_freedom_task_6:0 "Kazerun erweitern"
  persis_mission_1_freedom_task_6_DESC:0 "Die Bedeutung unserer Städte steht in direktem Zusammenhang mit unseren Aussichten auf Unabhängigkeit. Wir dürfen keinen Bereich vernachlässigen, sonst laden wir die Katastrophe geradezu ein. Angesichts seiner Bedeutung für unsere Bemühungen sollte Kazerun ausgebaut werden! \n\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
  
  persis_mission_1_freedom_task_7:0 "Die Binnenwirtschaft wiederbeleben"
  persis_mission_1_freedom_task_7_DESC:0 "Gold ist das Öl, das die Kriegsmaschinen schmiert, und wir müssen sicherstellen, dass unser Kernland dem immensen wirtschaftlichen Druck standhalten kann, den wir darauf ausüben werden. Es ist an der Zeit, unsere finanziellen Ressourcen zu stärken. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
  persis_mission_1_freedom_task_8:0 "Kish verbinden"
  persis_mission_1_freedom_task_8_DESC:0 "Der wertvolle Hafen von Kish ist unser Tor zum Persischen Golf; jeden Tag segeln Schiffe aus Bushahr nach Süden zu unserem Außenposten an der Küste. Es wurde vorgeschlagen, die Königsstraße bis zu dieser Stadt zu verlängern, damit wir nicht vollständig auf unsere Flotten angewiesen sind. \n\n\n\n\n\n\n\n\n\n\n@persia_mil3!"
  
  persis_mission_1_freedom_task_9:0 "Kish urbanisieren"
  persis_mission_1_freedom_task_9_DESC:0 "Die verheißungsvolle Lage von [GetProvince('(int32)4956').GetName] verlangt von uns, alles in unserer Macht Stehende zu tun, um das Gebiet zu urbanisieren und die Siedlung in eine Stadt mit einer angemessenen Einwohnerzahl zu verwandeln. Es wird sich herumsprechen, was wir hier erreicht haben, und viele werden diese neue Stadt mit eigenen Augen sehen wollen. \n\n\n\n\n\n\n\n\n\n\n@event_pic3!"

  persis_mission_1_freedom_task_10:0 "Paradiese wiederherstellen"
  persis_mission_1_freedom_task_10_DESC:0 "Indem wir unsere Kapazitäten zur Produktion von Nahrungsmitteln und Handelsgütern ausbauen, wird unsere gesamte Wirtschaft angeregt und somit profitieren alle davon – lasst uns Investitionen im ganzen Land tätigen und das Paradies auf Erden schaffen. \n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

  persis_mission_1_freedom_task_11:0 "Die Unsterblichen wiederaufbauen"
  persis_mission_1_freedom_task_11_DESC:0 "Einst versetzte die als „Unsterbliche“ bekannte Eliteeinheit die Feinde der Achämeniden in Angst und Schrecken, doch seit Jahren hat sie nicht mehr gekämpft. Nun, da wir dazu in der Lage sind, müssen wir diese großartige Einheit wieder in unsere Armeen aufnehmen. \n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 
  persis_mission_1_freedom_task_12:0 "Die Kolonie bedrohen"
  persis_mission_1_freedom_task_12_DESC:0 ""
 
  persis_mission_1_freedom_task_13:0 "Die Pässe befestigen"
  persis_mission_1_freedom_task_13_DESC:0 "Um nichts dem Zufall zu überlassen, werden wir alle unsere wichtigen Zivilisationszentren befestigen, denn wir haben hart dafür gekämpft, dorthin zu gelangen, wo wir heute stehen, und wir werden unsere Errungenschaften nicht kampflos aufgeben. \n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 
  persis_mission_1_freedom_task_14:0 "Häfen errichten"
  persis_mission_1_freedom_task_14_DESC:0 "Die Gewässer des Sinus Persicus sind die Lebensader unseres Volkes, und wir können es uns schlichtweg nicht leisten, unseren Zugang zum Meer zu vernachlässigen. Gebt den Befehl, dass unsere Häfen ausgebaut werden, damit unsere Schiffsbauer Erfahrung im Bau von Flotten sammeln können. \n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 
  persis_mission_1_freedom_task_15:0 "Den Golf kontrollieren"
  persis_mission_1_freedom_task_15_DESC:0 "Wer kann es wagen, unsere Macht auf den Gewässern des Sinus Persicus in Frage zu stellen? Haben wir nicht eine riesige und mächtige Flotte unter unserer Kontrolle, die unseren Willen an den fernen Küsten weit entfernter Länder durchsetzen wird? \n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
  
  persis_mission_1_freedom_task_16:0 "Mardiene fordern"
  persis_mission_1_freedom_task_16_DESC:0 "Wir müssen [GetCountry('SEL').GetName] deutlich machen, dass wir um die Provinz Mardiene bis zum bitteren Ende kämpfen werden und dass sie diese unverzüglich abtreten müssen, sonst werden sie es mit unseren Armeen zu tun bekommen. \n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 
  persis_mission_1_freedom_task_17:0 "Die Königsstraße erweitern"
  persis_mission_1_freedom_task_17_DESC:0 "Die Königsstraße, eine der bedeutendsten Errungenschaften der Region, verbindet seit jeher Handelszentren und Zivilisationen. Nun, da wir die Verantwortung für diese wichtige Infrastruktur tragen, sollten wir Maßnahmen ergreifen, um den Verkehr auf diesem Weg dort zu erweitern, wo es möglich ist. \n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 
  persis_mission_1_freedom_task_18:0 "Die Armee ausbauen"
  persis_mission_1_freedom_task_18_DESC:0 ""
 
  persis_mission_1_freedom_task_19:0 "Hauptstädte befestigen"
  persis_mission_1_freedom_task_19_DESC:0 "Indem wir auf landesweiter Ebene Maßnahmen ergreifen, um unsere bestehenden Befestigungsanlagen zu verstärken, werden wir auf alles vorbereitet sein, was auf uns zukommt – unsere Armeen werden standhaft auf dem Schlachtfeld stehen, in dem Wissen, dass sie starke Mauern hinter sich haben. \n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 
  persis_mission_1_freedom_task_20:0 "Das ionische Joch abwerfen"
  persis_mission_1_freedom_task_20_DESC:0 "Endlich haben wir die intriganter Makedonen und ihre erzwungene Knechtschaft überwunden – wir haben unsere ehemaligen Herren gestürzt und uns befreit! Die Könige dieser Erde zittern angesichts unseres Eintritts auf die Weltbühne! \n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 
  persis_mission_1_freedom_task_21:0 "Kommandant der Götter"
  persis_mission_1_freedom_task_21_DESC:0 "Der Reichtum und die natürlichen Fähigkeiten des Adels eröffnen ihm Möglichkeiten, die den ärmeren Schichten verwehrt bleiben. Diese elegante Atmosphäre ermöglicht es unseren Adligen, sich speziellen Interessen wie dem Verfassen von Geschichtswerken zu widmen, und das Aufblühen unserer Führungsschicht ist ein klares Zeichen dafür, dass die Götter sie als unsere Anführer gesegnet haben. \n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
  
  persis_mission_1_freedom_task_22:0 "Magi fördern"
  persis_mission_1_freedom_task_22_DESC:0 "Wenn wir Maßnahmen ergreifen, die Magi zu fördern, wird nicht nur das Volk erfreut sein, sondern auch unser Herrscher persönlich davon profitieren – ein Grund mehr, dies in die Tat umzusetzen. \n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
  
  persis_mission_1_freedom_task_23:0 "Wiederbelebung der persischen Kultur"
  persis_mission_1_freedom_task_23_DESC:0 "Nun, da wir dazu in der Lage sind, sollten wir unserer persischen Kultur wieder die herausragende Stellung verschaffen, die sie in unserer Gesellschaft innehatte, bevor die Fremden den bisherigen Status quo auf den Kopf gestellt haben. \n\n\n\n\n\n\n\n\n\n\n@persia_mil9!"

 
 #Tooltips
 
  persis_mission_1_freedom_task_10_tt:0 "Besitzt fünf Bauernsiedlungen oder Landgüter"
  persis_mission_1_freedom_task_15_tt:0 "Kein Land mit Provinzen an der Golfküste hat mehr Schiffe als #Y [ROOT.GetCountry.GetName]#!"
  persis_mission_1_freedom_task_16_tt:0 "Fordet #Y [GetCountry('SEL').GetName]#! auf, #Y [GetProvince('(int32)4780').GetArea.GetName]#! an #Y [SCOPE.GetRootScope.GetCountry.GetName]#! abzutreten."
  persis_mission_1_freedom_task_17_tt:0 "[ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName] hat mindestens #Y 20#! Territorien, die durch Straßen verbunden sind."

