  me_persis_1_title:0 "$persis_mission_1_freedom_task_1$"
  me_persis_1_desc:0 "Wenn wir uns an die Schönheit der Stadt Persepolis erinnern, an ihre schattigen Straßen und duftenden Gärten, die die Seele erfreuten, füllen sich unsere Augen mit Tränen der Bitterkeit und Wut, wenn wir ihren gegenwärtigen Zustand betrachten. Diese makedonischen Barbaren glaubten, sie könnten unser Erbe mit Feuer und Tod auslöschen, doch ihre Gräueltaten haben unseren Wunsch, Persepolis wiederherzustellen, nur noch verstärkt.\n\nDie Zeit ist gekommen, unseren alten Ruhm wiederherzustellen, und die Welt wird wissen, dass Persis nicht mehr schläft."
  me_persis_1.a:0 "Unser zukünftiger Ruhm wird die Schande der Vergangenheit in den Schatten stellen"
  me_persis_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_1$#!' $mission_completed_tooltip_2$"
  
  me_persis_2_title:0 "$persis_mission_1_freedom_task_2$"
  me_persis_2_desc:0 "In längst vergangenen Zeiten galten die Perser und die Oxier als Brüder, die einander den Rücken stärkten, wenn niemand sonst dies tat, und auch wenn diese Erinnerungen weit zurückliegen, sind sie unter den Menschen nicht in Vergessenheit geraten.\n\nAus diesen schönen Erinnerungen schöpfend haben wir einen Gesandten zu unseren Freunden, den Oxiern, entsandt und sie gebeten, sich an ihre alten Gelübde zu erinnern. Es wird Euch freuen, oh [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], zu hören, dass sie treu sind und ihre Eide nicht vergessen haben"
  me_persis_2.a:0 "Wir danken euch, alte Freunde"
  me_persis_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_2$#!' $mission_completed_tooltip_2$"
  
  me_persis_4_title:0 "$persis_mission_1_freedom_task_4$"
  me_persis_4_desc:0 "Was für ein freudiger Tag! Unsere Ingenieure haben endlich die Bauarbeiten in [GetProvince('(int32)4782').GetName] abgeschlossen, die Gebäude der Besetzer abgerissen und durch dauerhafte Bauten aus Ziegel und Stein ersetzt. Diese Maßnahme wird nicht nur den wirtschaftlichen Wohlstand in der Region sichern, sondern auch unseren Armeen zugutekommen – wir verfügen nun über eine beherrschende Stellung in der Provinz Mardiene, die uns einen strategischen Vorteil verschafft."
  me_persis_4.a:0 "Suravan ist ein Dolch, der auf das Herz des [GetCountry('SEL').GetName] zeigt"
  me_persis_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_4$#!' $mission_completed_tooltip_2$"
 
  me_persis_5_title:0 "$persis_mission_1_freedom_task_5$"
  me_persis_5_desc:0 "Es ist uns gelungen, das starke Wachstum unserer Stadt [GetProvince('(int32)4951').GetName] so zu beeinflussen, dass es in die von uns zuvor festgelegte Richtung verläuft. Dank unseres unermüdlichen Einsatzes für die Stadt strömen immer mehr Menschen dorthin, in der Hoffnung, sich an diesem geschichtsträchtigen Ort einen Namen zu machen – hervorragende Arbeit, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]."
  me_persis_5.a:0 "Wenn ich sehe, dass etwas getan werden muss, tue ich es"
  me_persis_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_5$#!' $mission_completed_tooltip_2$"
  
  me_persis_6_title:0 "$persis_mission_1_freedom_task_6$"
  me_persis_6_desc:0 "Unsere Architekten berichten uns, dass die Arbeiten in [GetProvince('(int32)4781').GetName] abgeschlossen sind, und da wir die Wohngebiete in der Stadt erweitert haben, spricht sich herum, dass Kazerun derzeit besonders attraktiv ist. Glücklicherweise sind wir sicher, dass Platz für alle vorhanden ist – dank der Sorgfalt, die [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] bei der Ausarbeitung der Entwürfe gemeinsam mit unseren Ingenieuren an den Tag gelegt hat. Wir fragen uns, wie lange diese guten Zeiten wohl anhalten werden!"
  me_persis_6.a:0 "Großartige Neuigkeiten … eines Tages werden wir Kazerun selbst besuchen"
  me_persis_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_6$#!' $mission_completed_tooltip_2$"
  
  me_persis_7_title:0 "$persis_mission_1_freedom_task_7$"
  me_persis_7_desc:0 "Es wird Euch freuen zu hören, dass unsere Wirtschaft dank der Anstrengungen, die wir in den Wiederaufbau unseres Kernlandes gesteckt haben, floriert und die Handelseinnahmen absolut unglaublich sind – sie übertreffen sogar unsere kühnsten Erwartungen. Viele der führenden Magnaten unseres Landes wittern die Chance, ihr eigenes Vermögen zu mehren, und reisen daher in die regionalen Hauptstädte, um dort ihre Geschäfte aufzubauen."
  me_persis_7.a:0 "Der Adel wird immer Geld verdienen, wenn er eine Gelegenheit dazu sieht."
  me_persis_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_7$#!' $mission_completed_tooltip_2$"
 
  me_persis_8_title:0 "$persis_mission_1_freedom_task_8$"
  me_persis_8_desc:0 "Wir freuen uns, berichten zu können, dass eine Straße gebaut wurde, die [GetProvince('(int32)4799').GetName] und [GetProvince('(int32)4956').GetName] verbindet. Wie von unseren wirtschaftlichen Beratern vorhergesagt, hat die Verbindung dieser beiden Städte dazu geführt, dass nun ein Strom von Reichtum in unsere Staatskasse fließt. Die wertvollen Handelsgüter, die nach Portospana transportiert werden, erreichen Parsa nun wesentlich schneller als früher – alle unsere Investitionen zahlen sich aus!"
  me_persis_8.a:0 "Ein Problem, über das man sich nicht beklagen kann"
  me_persis_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_8$#!' $mission_completed_tooltip_2$"
 
  me_persis_9_title:0 "$persis_mission_1_freedom_task_9$"
  me_persis_9_desc:0 "Erfreulicherweise haben wir erfahren, dass das neue Bauprojekt in [GetProvince('(int32)4956').GetName] von der überglücklichen Bevölkerung begeistert aufgenommen wurde, die bereits die Vorteile der erweiterten Geschäftsviertel nutzt.\n\nDie Fischmärkte von Portospana werden weit und breit für die Vielfalt an täglich frischem Fang bekannt, und viele begeben sich noch vor Sonnenaufgang auf den Weg dorthin, um sich die besten Filets zu sichern."
  me_persis_9.a:0 "Auf diese Region warten noch weitere positive Entwicklungen"
  me_persis_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_9$#!' $mission_completed_tooltip_2$"
 
  me_persis_10_title:0 "$persis_mission_1_freedom_task_10$"
  me_persis_10_desc:0 "Heute Morgen gibt es noch weitere gute Nachrichten: Unsere Sklaven und unsere Felder waren produktiv, und wir machen uns auf den ausländischen Märkten einen Namen als Exporteur von Waren außergewöhnlicher Qualität. Die Menschen sind bereit, für die in [SCOPE.GetRootScope.GetCountry.GetName] hergestellten edlen Waren einen Aufpreis zu zahlen, und wir nehmen ihre Münzen nur allzu gerne entgegen."
  me_persis_10.a:0 "Es stimmt, dass wir die besten Handwerker der Welt sind"
  me_persis_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_10$#!' $mission_completed_tooltip_2$"
 
  me_persis_11_title:0 "$persis_mission_1_freedom_task_11$"
  me_persis_11_desc:0 "Es spricht sich langsam herum, dass wir die Elite-Militäreinheit der Unsterblichen wieder aufgebaut haben. Schon jetzt üben sie außerhalb der Stadtmauern von [GetProvince('(int32)4799').GetName] und verfeinern die uralten Kampfformationen, die sie schon so oft zum Sieg geführt haben.\n\nWenn der Kampf für die Unsterblichen unvermeidlich wird, erwarten wir von unserer schweren Infanterie, dass sie die gegnerischen Streitkräfte zerschmettert und unseren Feinden keine Gnade zeigt. Das ist das Erbe, für das wir uns entschieden haben."
  me_persis_11.a:0 "Wir machen uns keine allzu großen Sorgen um unsere Generäle..."
  me_persis_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_11$#!' $mission_completed_tooltip_2$"

  me_persis_13_title:0 "$persis_mission_1_freedom_task_13$" 
  me_persis_13_desc:0 "Auch wenn unsere Nachbarn unzufrieden sind, dass wir offen Maßnahmen zur Sicherung unserer Grenzen ergreifen, versichern wir unseren Nachbarn, dass wir lediglich unser Heimatland schützen wollen – wir suchen keinen Konflikt mit irgendjemandem, sondern hoffen vielmehr, unsere gemeinsamen Möglichkeiten zu erweitern."
  me_persis_13.a:0 "Mal sehen, ob sie das akzeptieren..."
  me_persis_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_13$#!' $mission_completed_tooltip_2$"
  
  me_persis_14_title:0 "$persis_mission_1_freedom_task_14$"
  me_persis_14_desc:0 "Wir müssen [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] dafür danken, dass [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] angeordnet hat, dass [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] den Bau der Häfen von [GetProvince('(int32)4791').GetName] und [GetProvince('(int32)4956').GetName]  in ihrem heutigen Zustand veranlasst hat. Dank der Weisheit und Weitsicht, die  [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] an den Tag gelegt hat, sind unsere gesamten Seestreitkräfte auf ein bisher unerreichtes Niveau angewachsen – wir werden in der Lage sein, Schiffe in beispielloser Geschwindigkeit zu bauen."
  me_persis_14.a:0 "Wir dürfen unsere Flotte nicht vernachlässigen, auch wenn wir unsere Heere ausbauen"
  me_persis_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_14$#!' $mission_completed_tooltip_2$"
 
  me_persis_15_title:0 "$persis_mission_1_freedom_task_15$"
  me_persis_15_desc:0 "Jedes andere Land, das eine Küstenlinie am Sinus Persicus hat, muss sich nun mit unserer Seemacht auseinandersetzen, denn wir haben allen, die sich in Segelentfernung befinden, deutlich gemacht, dass wir diese Gewässer als unser Eigentum betrachten. Wir werden nicht zulassen, dass in unserem Hinterhof irgendetwas geschieht, ohne dass wir es genehmigen, und diese Regel gilt ganz klar sowohl für das Meer als auch für das Land."
  me_persis_15.a:0 "Unsere Flotten werden jeden zerschlagen, der sich ihnen entgegenstellt"
  me_persis_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_15$#!' $mission_completed_tooltip_2$"
  
  me_persis_16_title:0 "$persis_mission_1_freedom_task_16$"
  me_persis_16_desc:0 "Da wir nun in der Lage sind, unsere Wünsche kundzutun, wurde beschlossen, ein Ultimatum an das [GetCountry('SEL').GetName] zu senden. Einfach ausgedrückt: wir müssen die Kontrolle über unsere historischen Heimatländer haben und bereit sein, in den Krieg zu ziehen, um diese Ansprüche durchzusetzen.\n\nEinige unserer Berater fordern uns auf, die gesamte Provinz Mardiene zu fordern, andere halten diesen Ansatz jedoch für zu maßlos und meinen, wir sollten lediglich die Stadt Margastana – oder Arragan, wie wir sie nennen – einfordern.  Die Entscheidung liegt bei [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]."
  me_persis_16.a:0 "[GetProvince('(int32)4780').GetArea.GetName] fordern"
  me_persis_16.b:0 "[GetProvince('(int32)4780').GetName] fordern"
  me_persis_16_tooltip:0 "Fordert das #Y [GetCountry('SEL').GetName]#!  #Y [GetProvince('(int32)4780').GetArea.GetName]#! an #Y [SCOPE.GetRootScope.GetCountry.GetName]#! abzutreten"
  me_persis_16_tooltip_B:0 "Fragt das #Y [GetCountry('SEL').GetName]#! nur nach #Y [GetProvince('(int32)4780').GetName]#!"
  
  me_persis.160.t:0 "Forderungen von [GetCountry('PES').GetName]"
  me_persis.160.desc:0 "[GetCountry('PES').GetName] hat darum gebeten, dass wir die Provinz [GetProvince('(int32)4780').GetName] an sie abtreten. Einige unserer Berater sagen, dass dies klug wäre, um unsere Untertanen zu besänftigen, da gesagt wurde, dass sie sich jederzeit gegen unsere Herrschaft erheben könnten."
  me_persis.160.desc2:0 "[GetCountry('PES').GetName] verlangt, dass wir das gesamte Gebiet von [GetProvince('(int32)4780').GetArea.GetName] abtreten. Viele sagen, dies würde der Welt unsere Schwäche deutlich zeigen. Aber es gibt andere, die sagen, dass dies nur dazu dienen wird, unsere Verbindungen zu [GetCountry('PES').GetName] zu stärken."
  me_persis.160.a:0 "Wir werden ihnen das Land geben ... vorerst."
  me_persis.160.b:0 "Auf keinen Fall!"
 
  me_persis.161.t:0 "Antwort vom [GetCountry('SEL').GetName]"
  me_persis.161.desc:0 "Das [GetCountry('SEL').GetName] hat weise entschieden, unseren Forderungen nachzugeben und uns das gesamte [GetProvince('(int32)4780').GetArea.GetName] abgetreten. Damit ist [GetCountry('PES').GetName] in einer besseren Position als je zuvor und die Träume von der Wiederherstellung Persiens sind einen Schritt näher gerückt..."
  me_persis.161.desc2:0 "Der [GetCountry('SEL').GetName] hat sich klugerweise entschieden, unser Angebot anzunehmen und uns das Territorium von [GetProvince('(int32)4780').GetName] abgetreten. Damit ist [GetCountry('PES').GetName] in einer besseren Position als je zuvor und die Träume von der Wiederherstellung Persiens sind einen Schritt näher gerückt..."
  me_persis.161.desc3:0 "Das [GetCountry('SEL').GetName] hat törichterweise  beschlossen, unser Angebot, das Gebiet von [GetProvince('(int32)4780').GetArea.GetName] an uns abzutreten, abzulehnen. Es gibt wenig, was jetzt dagegen getan werden kann, aber sie werden diese Entscheidung bereuen ... irgendwann."
  me_persis.161.desc4:0 "Das [GetCountry('SEL').GetName] hat törichterweise  beschlossen, unser Angebot abzulehnen, uns das Territorium von [GetProvince('(int32)4780').GetName] abzutreten. Es gibt wenig, was jetzt dagegen getan werden kann, aber sie werden diese Entscheidung bereuen ... irgendwann."
  me_persis.161.a:0 "Herrlich!"
  me_persis.161.b:0 "Äußerst unglücklich."
  
  me_persis_17_title:0 "$persis_mission_1_freedom_task_17$"
  me_persis_17_desc:0 "Nachdem unsere Arbeiten an der Königsstraße nun abgeschlossen sind, wird das gesamte Land  [SCOPE.GetRootScope.GetCountry.GetName] davon profitieren; nicht nur werden sich die Reisezeiten für unsere Armeen und Diplomaten erheblich verkürzen, sondern auch die Handelsbeziehungen im ganzen Land werden sich weiter verbessern."
  me_persis_17.a:0 "Was für eine geniale Idee das doch war!"
  me_persis_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_17$#!' $mission_completed_tooltip_2$"
 
  me_persis_18_title:0 "$persis_mission_1_freedom_task_18$"
  me_persis_18_desc:0 ""
  me_persis_18.a:0 ""
  me_persis_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_18$#!' $mission_completed_tooltip_2$"
  
  me_persis_19_title:0 "$persis_mission_1_freedom_task_19$"
  me_persis_19_desc:0 "Eine Zeit der Feierlichkeiten wurde in [SCOPE.GetRootScope.GetCountry.GetName] ausgerufen, und in den neu befestigten Hauptstädten unseres Kernlandes finden prächtige Umzüge statt. Dank unserer Architekten, die unsere bestehenden Befestigungsanlagen geschickt verstärkt haben, fühlen sich die Bürger unserer Städte sicherer denn je und vertrauen darauf, dass die hoch aufragenden Mauern sie vor einfallenden Armeen schützen werden."
  me_persis_19.a:0 "Unser Volk hat allen Grund zur Freude"
  me_persis_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_19$#!' $mission_completed_tooltip_2$"

  me_persis_20_title:0 "$persis_mission_1_freedom_task_20$"
  me_persis_20_desc:0 "Endlich haben wir uns aus der von den Makedonen auferlegten Knechtschaft befreit und das Joch der Unterwerfung in Stücke zerschlagen. Wir stehen nun zum ersten Mal seit Generationen auf eigenen Füßen, ohne Ketten um den Hals und ohne Fesseln an den Handgelenken.\n\nLasst uns mit der Hilfe der Götter diesem bedeutsamen Anlass gerecht werden, und möge Ahura Mazda es weiterhin für gut befinden, unserem Volk seinen Segen zu schenken.\n\nDas Königreich Persis ist zurückgekehrt."
  me_persis_20.a:0 "Mögen wir ein Licht für die Welt sein..."
  me_persis_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_20$#!' $mission_completed_tooltip_2$"
  
  me_persis_21_title:0 "$persis_mission_1_freedom_task_21$"
  me_persis_21_desc:0 "Da [GetProvince('(int32)4799').GetName] die Heimat der meisten führenden Adelsfamilien unseres Landes geworden ist, profitieren wir davon, dass die ganze Nation von diesem glücklichen Umstand profitiert. Ihre Präsenz in unserer Hauptstadt wird nur zu unserer Stabilität und unserem langfristigen Wachstum beitragen...wir sollten dankbar sein."
  me_persis_21.a:0 "Wir sind wirklich dankbar für die Geschenke, die wir erhalten haben"
  me_persis_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_21$#!' $mission_completed_tooltip_2$"
  
  me_persis_22_title:0 "$persis_mission_1_freedom_task_22$"
  me_persis_22_desc:0 "Aufgrund der persönlichen Bemühungen, die [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] für die Wiederherstellung der gesellschaftlichen Stellung der Magi gezeigt hat, wird unser Herrscher vom einfachen Volk gefeiert.\n\nIm ganzen Land finden spontane religiöse Feierlichkeiten statt, überall in unserem Reich werden die heiligen Feuer gepflegt, und Ahura Mazda werden Dankgebete dargebracht."
  me_persis_22.a:0 "Mögen die Götter uns weiterhin des Segens würdig finden!"
  me_persis_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_22$#!' $mission_completed_tooltip_2$"
  
  me_persis_23_title:0 "$persis_mission_1_freedom_task_23$"
  me_persis_23_desc:0 "Obwohl unsere Kultur lange Zeit stark gelitten hat und einige sogar glaubten, dass unsere besten Tage hinter uns lagen und das Licht der persischen Zivilisation für immer erlöschen würde, haben wir der ganzen Welt bewiesen, dass man niemals gegen [SCOPE.GetRootScope.GetCountry.GetName] wetten sollte , denn wir sind in der Lage, großartige Leistungen zu vollbringen, von denen andere Nationen nur träumen können. \n\nEntsendet Reiter in alle Ecken der Erde und verkündet, dass unser Zeitalter begonnen hat – alle sollen sich vor der wiedergeborenen persischen Macht verneigen!"
  me_persis_23.a:0 "Unsere Kultur breitet sich wie ein alles verzehrendes Feuer, angefacht vom Wind, ungehindert aus..."
  me_persis_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_23$#!' $mission_completed_tooltip_2$"