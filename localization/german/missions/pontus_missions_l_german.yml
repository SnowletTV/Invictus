  # Pontus missions (from carthago) 
 01_cde_pontus_missions_01_black_sea: "Pontische Hegemonen des Schwarzen Meeres"
 01_cde_pontus_missions_01_black_sea_DESCRIPTION: "Das #E Euxinische Meer#! ist die Heimat von jahrhundertealten Kulturen und Staaten mit vielen unterschiedlichen Hintergründen, darunter die #E griechischen Kolonien#! an der Schwarzmeerküste und die #E Skythen#! und #E Sarmaten#! jenseits des Meeres im Norden. Obwohl das #E Bosporanische Königreich#! einst eine mächtige Macht war, die dem Einfluss hellenistischer Königreiche wie dem Lysimachiden-Königreich widerstehen konnte, gibt es heute nur wenige Herrscher, die das Schwarze Meer vor ausländischem Einfluss schützen können. Lassen Sie uns also, die #E Mithridatiden#! Herrscher von #E Pontus#!, als wahre Hegemonen und Beschützer der Griechen des Schwarzen Meeres etablieren!"
 01_cde_pontus_missions_01_black_sea_CRITERIA_DESCRIPTION: "Die Mission wird abgeschlossen sein, sobald sich Pontus als dominierende Macht im Schwarzen Meer etabliert hat."
 01_cde_pontus_missions_01_black_sea_BUTTON_TOOLTIP: "Ehre sei Pontus! Ehre sei Mithridates!"
 01_cde_pontus_missions_01_black_sea_BUTTON_DETAILS: ""
 01_cde_pontus_missions_01_task_1: "Reiche der Vorfahren"
 01_cde_pontus_missions_01_task_1_DESC: "Während die verschiedenen griechischen Städte jenseits des Schwarzen Meeres von den Barbaren im Norden - den Skythen, Sarmaten und Kelten - überfallen und belagert werden, haben nur wenige Staaten entlang des Schwarzen Meeres die Macht, sie aufzuhalten. Und hier greifen wir ein: Als großer Basileus des Königreichs Pontus wird unser Herrscher die Rolle des Verteidigers der Hellenen übernehmen und über die Meere segeln, um alle unter unseren Schutz zu bringen. Da diese Länder entlang des Schwarzen Meeres unsere angestammten Reiche sind, wird allen klar gemacht, dass wir die rechtmäßigen Hegemonen dieser Länder sind. \n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 01_cde_pontus_missions_01_task_1.tt: "Gewinnansprüche auf #Y Kolchis#! und #Y Paphlagonien#!"
 #01_cde_pontus_missions_01_task_2: "Sinopean Palace"  <None>  #NT!
 #01_cde_pontus_missions_01_task_2_DESC: "One of our most recent acquisitions in Paphlagonia from our conquests is the Greek city of Sinope. A thriving city of enduring Greek heritage, it is a perfect embodiment of the Black Sea Greek identity. Rather than just constructing a summer residence in the city, our ruler is considering constructing a royal residence in the city of Sinope due to its strategic and cultural value. Our ruler is even considering moving the capital to Sinope entirely. \n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"  <None>  #NT!
 #01_cde_pontus_missions_01_task_2.tt: "Event fires, allowing you to choose to #Y move the capital#! to Sinope and grant bonuses to the city"  <None>  #NT!
 01_cde_pontus_missions_01_task_3: "Marinestützpunkt in Trapez"
 01_cde_pontus_missions_01_task_3_DESC: "Wenn wir unseren Einfluss über das Schwarze Meer ausweiten möchten, müssen wir zunächst eine starke Flotte aufbauen. Dazu benötigen wir einen Marinestützpunkt, der groß genug ist, um eine solche Flotte aufzunehmen. Daher sind sich unsere Berater einig, dass die griechische Stadt Trapezous hierfür der ideale Standort ist, da sie bereits über einen gut etablierten Hafen verfügt, der sowohl Flotten als auch Handelsschiffe beherbergt. \n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 01_cde_pontus_missions_01_task_4: "Handelsbeziehungen der Amis"
 01_cde_pontus_missions_01_task_4_DESC: "Indem wir den Einfluss der wichtigen Handelsstadt Amisos ausweiten, können wir unseren wirtschaftlichen und kulturellen Einfluss über das Euxine-Meer mit pontischen Münzen ausweiten. Amisos soll als Bindeglied für die wirtschaftlichen und kulturellen Verbindungen zwischen Pontus und den griechischen Städten entlang der Nord- und Schwarzmeerküste dienen. Dies würde eine wirtschaftlich einheitliche Sphäre über das Meer hinweg unter der Währung unseres Königreichs schaffen und den Griechen entlang der Küste die Möglichkeit bieten, unsere Hegemonie mit offenen Armen anzunehmen.\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 01_cde_pontus_missions_01_task_4.tt: "Jedes Land der #Y hellenischen#! Kulturgruppe #Y treibt Handel mit uns#!"
 01_cde_pontus_missions_01_task_5: "Hellenistischer Hof"
 01_cde_pontus_missions_01_task_5_DESC: "Die Mithridatiden-Dynastie ist sowohl kulturell als auch blutsverwandt fast so griechisch wie persisch. Aufgrund unserer Geschichte der Eheschließungen mit der Seleukiden-Dynastie haben unsere Könige seitdem versucht, Pontus als legitimes und eindeutig hellenistisches Königreich zu etablieren, von der Annahme des hellenischen Titels Basileus bis hin zur Bestimmung des Griechischen als offizielle Sprache und Schrift des Hofes. Beginnen wir also mit der Politik, Personen aus ausländischen hellenischen Staaten einzuladen, an unserem Hof ​​zu dienen – natürlich nur aus Staaten, denen wir vertrauen. Solche hellenischen Einflüsse werden es auch gegenwärtigen und zukünftigen griechischen Untertanen leichter machen, sich mit unserem Standard zu identifizieren.\n\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 01_cde_pontus_missions_01_task_5.tt: "Jedes #Y Hellenic#! Kulturgruppe Land hat mindestens #Y 80#! Meinung über uns"
 01_cde_pontus_missions_01_task_5.tt2: "Gewinnen Sie einen Berater für die griechisch-pontische Kultur mit den Eigenschaften „Gute Finesse“ und „Charisma“"
 01_cde_pontus_missions_01_task_51: "Pontische Poleis"
 01_cde_pontus_missions_01_task_51_DESC: "Eines der bestimmenden Merkmale der griechischen Zivilisation ist die griechische Polis oder Stadt, die viele Aspekte der hellenischen Kultur beherbergt, die wir nachahmen möchten, um ein wahrhaft hellenistisches Königreich zu werden. In den hellenistischen Königreichen der Diadochen wurden den Untertanen manchmal Privilegien und größere Möglichkeiten für sozialen Aufstieg geboten, wenn sie Poleis im griechischen Stil errichteten und sich in die hellenistische Gesellschaft integrierten. Lassen Sie uns also unsere griechischen und nicht-griechischen Untertanen ansprechen, indem wir in unserem eigenen Königreich große Poleis in einem deutlich griechisch-pontischen Stil errichten. \n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 01_cde_pontus_missions_01_task_51.tt: "Verfügt über ein #Y Forum#! und entweder einen #Y Großen Tempel#! oder ein #Y Großes Theater#!"
 01_cde_pontus_missions_01_task_51.tt2: "Jede besessene #Y Stadt#!, die nicht die Hauptstadt ist"
 01_cde_pontus_missions_01_task_6: "Griechische Söldner"
 01_cde_pontus_missions_01_task_6_DESC: "Unser Herrscher Mithridates V. war der erste pontische Herrscher, der in großem Umfang griechische Söldner einsetzte. Während Söldner im Allgemeinen nur für Geld kämpfen und keinem Königreich verpflichtet sind, können wir vielleicht eine Art Pseudofreundschaft mit diesen geldgierigen Söldnern aufbauen, indem wir ihnen zeigen, dass wir sie in Kriegszeiten gut behandeln. Lassen Sie uns also weiterhin starke Beziehungen zu den griechischen Söldnern entlang des Meeres aufbauen, damit wir uns den Ruf eines Kunden aufbauen können, der seine Söldner mit Würde und Respekt behandelt.\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 01_cde_pontus_missions_01_task_6_tt: "Haben Sie einen angeheuerten Söldnerkapitän."
 01_cde_pontus_missions_01_task_7: "Schutzpatron von Delphi"
 01_cde_pontus_missions_01_task_7_DESC: "Viele hellenistische Herrscher haben sich den Respekt der griechischen Stadtstaaten unter anderem dadurch verdient, dass sie die Stadt Delphi unterstützten, in der sich der berühmte Apollontempel und das ebenso berühmte Orakel von Delphi befinden. Lassen Sie uns der Stadt Delphi daher eine großzügige Spende zukommen, damit sie uns zu Ehren eine Stele errichten und im gesamten griechischen Reich die Kunde verbreiten kann, dass die Könige von Pontus im Herzen Philhellenen sind, also Liebhaber der griechischen Kultur und des griechischen Volkes. \n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 01_cde_pontus_missions_01_task_7.tt: "Eigentümer der Stadt #Y Delphi#!"
 01_cde_pontus_missions_01_task_71: "Beschützer der Hellenen"
 01_cde_pontus_missions_01_task_71_DESC: "Wenn wir die vakante Rolle des Beschützers der Griechen des Schwarzen Meeres übernehmen möchten, müssen wir unsere Absichten mit Taten statt mit Worten beweisen. Lassen Sie uns daher die Unabhängigkeit und Sicherheit der griechischen Städte garantieren, damit sie die Barbaren und fremden Mächte, die hungrig an ihren Grenzen stehen, nicht länger fürchten müssen. \n\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 01_cde_pontus_missions_01_task_71.tt: "Mindestens #Y 2#! Länder der hellenischen Kulturgruppe sind #Y von uns garantiert#! und haben mindestens #Y 90 Meinung#! gegenüber uns"
 01_cde_pontus_missions_01_task_72: "Garantierter Tribut"
 01_cde_pontus_missions_01_task_72_DESC: "Das Mithridatidenkönigreich Pontus hat sich in der Vergangenheit mit griechischen Stadtstaaten rund um das Schwarze Meer verbündet, fungierte als deren Beschützer und garantierte griechische Autonomie. Daher ist es vielleicht an der Zeit, dass wir starke Beziehungen zu jenen aufbauen, denen wir Unabhängigkeit garantieren, um uns im Austausch gegen Tribute als deren dauerhafte Beschützer zu etablieren. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 01_cde_pontus_missions_01_task_72.tt: "1 Land der hellenischen Kulturgruppe ist #Y von uns garantiert#! und hat mindestens #Y 150 Meinungen#! gegenüber uns"
 01_cde_pontus_missions_01_task_72.tt2: "Ein #Y Hellenisches#!-cultured Nicht-Spielerland, das einen #Y Niedrigeren Rang#! hat und von uns garantiert wird, wird unter unserer Herrschaft ein #Y Tributpflichtiges#!"
 ###Unused 
 01_cde_pontus_missions_01_task_8: "Druck auf die Paphlagonier ausübt"
 01_cde_pontus_missions_01_task_8_DESC: "Die einheimischen Könige von Paphlagonien herrschten einst über ein großes Reich in Nordanatolien. Heute sind wir jedoch viel mächtiger als sie – daher haben wir die Möglichkeit, den paphlagonischen König einfach dazu zu zwingen, uns sein Reich zu vermachen und als unser loyaler Vasallenstaat zu dienen, bis wir es für angebracht halten, sie als direkte Untertanen unseres Königreichs zu integrieren."
 01_cde_pontus_missions_01_task_8.tt: "#G Wird umgangen, wenn das Königreich Paphlagonien kein Land besitzt#!"
 01_cde_pontus_missions_01_task_8.tt2: "#R Drohen Sie mit Krieg#! mit #Y Paphlagonien#!, wenn sie nicht unser Vasallenstaat werden."
 01_cde_pontus_missions_01_task_81: "Kontrollieren Sie Paphlagonien"
 01_cde_pontus_missions_01_task_81_DESC: "Das Rumpfkönigreich Paphlagonien besaß nur einen Teil der gesamten historischen Region Paphlagonien selbst. Als unser angestammtes Land können wir nun jedem den Krieg erklären, der sich weigert, unsere rechtmäßigen Ansprüche an unser Königreich abzutreten."
 01_cde_pontus_missions_01_task_81.tt: "Im Besitz von uns, einem Untertan ODER einem Verbündeten"
 01_cde_pontus_missions_01_task_81.tt2: "Provinzen #Y Sinopene#! und #Y Paphlagonia Superior#!"
 01_cde_pontus_missions_01_task_9: "Eroberung von Kolchis"
 01_cde_pontus_missions_01_task_9_DESC: "Die Eroberung der Region Kolchis käme uns zugute, da die Region eine hervorragende strategische Position für unsere Expansion weiter nach Norden entlang der Schwarzmeerküste wäre. Da wir außerdem ehemalige Untertanen der Achämeniden sind, von denen die Familie Mithridatid abstammt, ist es nur angemessen, dass die Region unter unsere Herrschaft gestellt wird. \n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 01_cde_pontus_missions_01_task_9.tt: "Provinz #Y Kolchis#!"
 ### 
 01_cde_pontus_missions_01_task_10: "Kolchische Handelsplätze"
 01_cde_pontus_missions_01_task_10_DESC: "Die griechischen Handelszentren Phasis und Dioskourias sind zwei Hauptquellen des Reichtums und der Reichtümer der Bevölkerung von Kolchis. Wenn wir also den Reichtum unseres eigenen pontischen Königreichs nutzen, um diese Handelsstädte zu florierenden Handelszentren unter unserem Imperium auszubauen, werden wir sicherlich die Herzen derjenigen gewinnen, die am unmittelbarsten von solchen Entwicklungen profitieren. \n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 01_cde_pontus_missions_01_task_11: "Beschwichtigung der kolchischen Stämme"
 01_cde_pontus_missions_01_task_11_DESC: "Die Region Kolchis ist ein äußerst vielfältiger Schmelztiegel unterschiedlicher Sprachen, Kulturen und Traditionen. Allein in der Stadt Dioskourias werden zwischen siebzig und dreihundert Sprachen gesprochen. Daher ist die Region sehr schwer zu kontrollieren, da es in Kolchis sehr wahrscheinlich wieder zu Aufständen gegen größere Mächte wie in der Vergangenheit gegen die Achämeniden kommen wird. Lassen Sie uns also hart daran arbeiten, die vielen Stämme in Kolchis unter unserer Herrschaft zu besänftigen. \n\n\n\n\n\n\n\n\n\n\n@italic_mil22!"
 01_cde_pontus_missions_01_task_11.tt: "Provinz #Y Kolchis#!"
 01_cde_pontus_missions_01_task_12: "Klientenherrschaft in Kolchis"
 01_cde_pontus_missions_01_task_12_DESC: "Obwohl wir die Stämme von Kolchis besänftigt haben, gibt es kaum eine Garantie dafür, dass sie unserem Staat treu bleiben, insbesondere da unsere Zentralregierung weit entfernt in Pontus sitzt. Daher wäre es für uns vielleicht besser, ein Vasallenkönigreich in Pontus zu gründen, das in unserem Namen regiert und den lokalen Stämmen einen Herrscher gibt, der ihre Beschwerden besser behandeln kann und gleichzeitig sicherstellt, dass der Staat in pontischen Händen bleibt. \n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 01_cde_pontus_missions_01_task_12.tt: "Ein #Y Feudatorium#! von Kolchis wird aus allen besessenen und unterworfenen Gebieten in den Provinzen Kolchis, Suaneti und Abasgoi gebildet\n\nWählen Sie jemanden als neuen Klientelherrscher von Kolchis"
 01_cde_pontus_missions_01_task_13: "Unterwerfung der Küstenstämme"
 01_cde_pontus_missions_01_task_13_DESC: "Die Küstenstämme der Zygii und Heniochi sind seit jeher äußerst unabhängig. Die Zygii sind Hirten und Piraten, während die Heniochi von Herodot als Menschen beschrieben wurden, die bereit sind, ihre Mitmenschen zu töten und zu essen. Daher wäre das Besiegen und Unterwerfen dieser Stämme sicherlich ein Beweis unserer kriegerischen Macht.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 01_cde_pontus_missions_01_task_14: "Auslandsambitionen"
 01_cde_pontus_missions_01_task_14_DESC: "Mit der Einrichtung eines Marinestützpunkts in Trapezous verfügen wir nun über die maritimen Grundlagen für eine Invasion des Nordens per See. Lassen Sie uns also nun Anspruch auf die Länder des Nordens erheben, beginnend mit den Ländern von Taurica. \n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 01_cde_pontus_missions_01_task_14.tt: "Gewinnansprüche auf #Y Taurica#!"
 01_cde_pontus_missions_01_task_141: "Schlagen Sie die Skythen zurück"
 01_cde_pontus_missions_01_task_141_DESC: "Die wachsende Macht der königlichen Skythen in Taurica ist ein großes Hindernis für die alleinige pontische Hegemonie im Schwarzen Meer. Es würde uns zwar wenig ausmachen, wenn der Großteil Tauricas unter befreundeter Herrschaft stünde, aber es ist zwingend erforderlich, dass wir die wichtigste Stadt der Skythen, das skythische Neapolis in Taurica, einnehmen, um von seiner strategischen Position zu profitieren. \n\n\n\n\n\n\n\n\n\n\n\n@persia_mil13!"
 01_cde_pontus_missions_01_task_141.tt: "Provinz Taurica"
 01_cde_pontus_missions_01_task_141.tt2: "#Y Skythien#! und seine Untertanen besitzen KEINE Gebiete in #Y Taurica#!"
 01_cde_pontus_missions_01_task_15: "Treue zu Chersones"
 01_cde_pontus_missions_01_task_15_DESC: "Wir haben in der Vergangenheit gute Beziehungen zu den Menschen von Chersonesos gepflegt. Lassen Sie uns daher unseren Einfluss nutzen, um sicherzustellen, dass die Menschen von Chersonesos bereit sind, uns bei der Verfolgung unserer Ziele der Hegemonie in Taurica und der nördlichen Schwarzmeerküste zu folgen. \n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 01_cde_pontus_missions_01_task_15.tt: "Erhalte Ansprüche auf #Y Olbia#! und #Y Tyras#!"
 01_cde_pontus_missions_01_task_15.tt2: "#Y Chersonesus#! ist mit uns verbündet UND hat mindestens #Y 80#! Meinung von uns"
 01_cde_pontus_missions_01_task_16: "Nördliches Emporia"
 01_cde_pontus_missions_01_task_16_DESC: "Die reichen Handelsstädte Olbia und Tyras waren einst einflussreich. Allerdings sind die beiden Handelsstädte inzwischen in Verfall geraten und stehen nun unter dem Einfluss der Barbarenstämme im Norden, der Skythen und Sarmaten. Als Beschützer der Griechen des Schwarzen Meeres wollen wir nach Nordwesten segeln, um diese Städte zu befreien und ihren früheren Ruhm wiederherzustellen.\n\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 01_cde_pontus_missions_01_task_17: "Neapolis Taurike"
 01_cde_pontus_missions_01_task_17_DESC: "Wir haben die prestigeträchtige skythische Stadt Neapolis Taurike erobert. Die Skythen, Heimat sowohl von Skythen als auch von Griechen, haben die Stadt zu einem geschäftigen Zentrum Taurikas entwickelt, wobei griechische Händler, Architekten und Handwerker zur Kultur und zum Reichtum der Stadt beitragen. Lassen Sie uns also zur Entwicklung der Stadt beitragen, um Neapolis Taurike in eine ausgesprochen pontische Stadt in Taurika zu verwandeln. \n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 01_cde_pontus_missions_01_task_18: "Unterwerft die Bosporaner"
 01_cde_pontus_missions_01_task_18_DESC: "Das Bosporanische Königreich an der Nordküste des Schwarzen Meeres war einst eine Großmacht, die sogar das Diadochenreich der Lysimachiden herausfordern konnte. Seitdem ist das Königreich jedoch im Niedergang begriffen. Lasst uns also die kimmerischen Bosporaner hegemonisieren, damit sie einem mächtigeren Königreich unterstellt werden können, das ihre Sicherheit garantieren kann. \n\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 01_cde_pontus_missions_01_task_19: "Bosporan-Integration"
 01_cde_pontus_missions_01_task_19_DESC: "Als selbsternannter Beschützer der Griechen im Schwarzen Meer wäre es falsch, den Bosporan-Griechen, den Vettern der Pontos-Griechen in unserem Heimatland, die Rechte und Privilegien der Staatsbürgerschaft zu verweigern. Lassen Sie uns daher die Bosporan-Völker integrieren und als Zeichen unserer Freundschaft die Entwicklung ihrer ehemaligen Hauptstadt Pantikapaion direkt fördern. \n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 01_cde_pontus_missions_01_task_20: "Bezwinge die Stämme"
 01_cde_pontus_missions_01_task_20_DESC: "Viele der edlen skythischen Stämme, die viele Privilegien und sogar Verwandtschaftsbeziehungen mit den ehemaligen bosporanischen Königen genossen, befürchten, dass sie mit der Unterwerfung des bosporanischen Königreichs ihren Einfluss auf die Zentralregierung weit über das Meer in Pontus verlieren werden. Um weitere Probleme zu vermeiden, sollten wir die Illoyalen dazu bringen, sich zu zeigen und allen separatistischen Gedanken ein Ende zu setzen.\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 01_cde_pontus_missions_01_task_20.tt: "Skythische Barbaren erscheinen im Bosporus-Gebiet"
 01_cde_pontus_missions_01_task_21: "Marschiert nach Skythien"
 01_cde_pontus_missions_01_task_21_DESC: "Nachdem die Skythen aus Taurica vertrieben wurden, haben wir nun in der Region Fuß gefasst. Lasst uns also unsere Streitkräfte in Taurica verstärken und tiefer in skythisches Gebiet vordringen, um die volle Kontrolle über die nördliche Bosporusküste zu erlangen und allen Stämmen zu zeigen, dass man uns nicht auf die leichte Schulter nehmen darf. n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 01_cde_pontus_missions_01_task_22: "Griechen von Taurica"
 01_cde_pontus_missions_01_task_22_DESC: "Obwohl die Griechen uns als Retter vor der skythischen Bedrohung willkommen geheißen haben, stehen viele unseren Absichten bezüglich ihrer Städte immer noch skeptisch gegenüber. Lasst uns also ihre Herzen gewinnen, indem wir ihre Städte entwickeln und die lokalen Kulte von Taurica unterstützen, wie etwa den Kult der Göttin Parthenos - die Tauri, einst Verbündete der Skythen, verehren ebenfalls Parthenos als ihre Hauptgottheit, sodass dies auch die widerspenstigen Tauri besänftigen wird.\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 01_cde_pontus_missions_01_task_23: "Champion der Euxine-Griechen"
 01_cde_pontus_missions_01_task_23_DESC: "Wir haben alle Griechen entlang des nördlichen und östlichen Schwarzen Meeres befreit, und alle Griechen entlang der Küste kennen den Namen unseres großen Basileus. Daher erklären wir uns offiziell zum Retter der Schwarzmeergriechen!\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
  
  # Pontus events(from carthago) 
 cde_me_pon_01.1.t: "Das Land der Vorfahren"
 cde_me_pon_01.1.desc: "Vor über einem Jahrhundert gründete unser Gründer Mithridates Ktistes ein kleines Königreich in Paphlagonien, aus dem schließlich das große Königreich Pontus wurde, das heute herrscht. Unsere Dynastie stammt vom persischen Adel ab, und wir können unsere Abstammung sogar bis zu den Familien der großen achämenidischen Könige Cyrus und Darius von Persien zurückverfolgen. Um einen panpontischen Staat zu schaffen, der dem Einfluss sowohl Roms als auch der hellenistischen Königreiche widerstehen kann, sollten wir zunächst damit beginnen, Anspruch auf unsere angestammten Länder in Kolchis und Paphlagonien zu erheben, Reiche, die einst während der achämenidischen Ära im Besitz unserer edlen Vorfahren waren."
 cde_me_pon_01.1.a: "Lasst uns ein Königreich errichten, das dem Erbe unserer Vorfahren würdig ist!"
 cde_me_pon_01.1.tt: "Wir werden beginnen, Anspruch auf unsere angestammten Reiche zu erheben"
 cde_me_pon_01.2.t: "Für einen panpontischen Staat"
 cde_me_pon_01.2.desc: "Um einen panpontischen Staat zu bilden, der den römischen und hellenistischen Vorstößen in die Länder des Pontus Widerstand leisten kann, lasst uns unsere Macht über unsere angestammten Reiche in Kolchis und Paphlagonien festigen!"
 cde_me_pon_01.2.a: "Pontus muss vereint sein!"
 cde_me_pon_01.3.t: "Neue königliche Residenz in Sinope"
 cde_me_pon_01.3.desc: "Die Sommerresidenz der Monarchie in der Küstenstadt Sinope wurde um #Y [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName]#!, erweitert, was wiederum die Bedeutung und den Status der Stadt in unserem Königreich erhöht hat. Obwohl Sinope erst kürzlich von Mithridates V. erworben wurde, machen seine strategische Lage an der Küste sowie sein anhaltender Wohlstand und sein hellenisches Erbe es zu einem erstklassigen Kandidaten für eine neue Hauptstadt. Da wir also unsere Expansion über das Schwarze Meer planen, wäre eine Küstenhauptstadt in Sinope vielleicht besser für uns, was bedeuten würde, dass die königliche Familie dauerhaft nach Sinope umsiedelt."
 cde_me_pon_01.3.a: "Verlegen Sie die Hauptstadt nach Sinope."
 cde_me_pon_01.3.b: "Ein Sommerpalast allein reicht da schon."
 cde_me_pon_01.4.t: "Erweiterte Werft in Trapez"
 cde_me_pon_01.4.desc: "Wir haben die bereits geschäftige Hafenstadt Trapezous zu einem zentralen Marinestützpunkt für die pontische Flotte ausgebaut. Um dieser Expansion gerecht zu werden, wurde die Marinewerft erheblich erweitert, sodass wir mehr Schiffe als zuvor unterbringen und bauen können."
 cde_me_pon_01.4.a: "Möge Pontus von unseren Küsten aus über die Meere herrschen!"
 cde_me_pon_01.5.t: "Ökonomische Hegemonen in Amisos"
 cde_me_pon_01.5.desc: "Durch die Erweiterung des wichtigen Handelszentrums Amisos haben wir unseren wirtschaftlichen Einfluss auf das Schwarze Meer ausgedehnt und das Bild unseres Herrschers auf unseren Münzen weit über die pontischen Gebiete hinaus verbreitet. Indem wir weiterhin das gesamte Schwarze Meer unter pontischer Währung vereinen, werden wir eine einheitliche pontische Wirtschaftssphäre schaffen, in der alle Individuen unter einer hellenisch-pontischen Identität vereint sind."
 cde_me_pon_01.5.a: "Wir werden ihre Herzen mit Geld und Diplomatie gewinnen!"
 cde_me_pon_01.6.t: "Griechischer Berater tritt unserem Gericht bei"
 cde_me_pon_01.6.desc: "Mit unserer jüngsten Politik der Integration der griechischen Kulturen entlang des Schwarzen Meeres in unseren hellenistischen Staat haben wir talentierte Menschen aus befreundeten Ländern angezogen, die unserem Herrscher an unserem eigenen hellenistischen Hof in Pontus dienen möchten."
 cde_me_pon_01.6.a: "Prächtig."
 cde_me_pon_01.7.t: "Griechische Poleis im Pontus"
 cde_me_pon_01.7.desc: "Indem wir eine Politik der Hellenisierung durch den Bau von Poleis im griechischen Stil in unserem gesamten Reich verfolgten, inspirierten wir im Gegenzug unsere Völker, sowohl die Griechen als auch die Nicht-Griechen, sich an der Hellenisierung zu beteiligen, um eine größere soziale Mobilität in unserem Königreich zu erreichen."
 cde_me_pon_01.7.a: "Mögen unsere treuen Untertanen uns weiterhin gute Dienste leisten"
 cde_me_pon_01.8.t: "Griechische Söldnerbindungen"
 cde_me_pon_01.8.desc: "Unser wohlverdienter Ruf als fairer Kunde griechischer Söldner hat uns zu einem attraktiven Kunden für Söldner im ganzen Land gemacht."
 cde_me_pon_01.8.a: "Mögen sie uns gute Dienste leisten, wenn wir ihre Dienste in Zukunft benötigen"
 cde_me_pon_01.9.t: "Philhellenischer Schutzpatron von Delphi"
 cde_me_pon_01.9.desc: "Unser Herrscher und seine Gemahlin haben der Stadt Delphi eine großzügige Spende zukommen lassen. Dies verbessert nicht nur unsere Beziehung zur Stadt und ihren Oberherren, sondern macht auch allen griechischen Stadtstaaten klar, dass wir ein wohlwollendes Königreich philhellenischer oder griechenliebender Herrscher sind, die sie vor Schaden bewahren möchten. Im Gegenzug haben die Delphier eine Stele zu Ehren unseres Herrschers errichtet."
 cde_me_pon_01.9.a: "Mögen unsere Bindungen zu den Griechen immer stärker werden"
 cde_me_pon_01.10.t: "Spende von Pontus an Delphi"
 cde_me_pon_01.10.desc: "Die Herrscher von #Y Pontus#! haben der Stadt Delphi großzügig eine große Summe Geld gespendet. Es scheint, dass sie nach dem Vorbild der hellenistischen Herrscher der Vergangenheit die Schirmherrschaft von Delphi übernehmen möchten."
 cde_me_pon_01.10.a: "Wir danken für ihre Spende"
 cde_me_pon_01.11.t: "Beschützer der Euxinischen Griechen"
 cde_me_pon_01.11.desc: "Indem wir die Autonomie und Sicherheit mehrerer griechischer Staaten garantierten, haben wir allen gezeigt, dass wir die vakante Rolle des Beschützers der Griechen des Schwarzen Meeres übernehmen wollen. Die Griechen am Schwarzen Meer müssen keine Überfälle von Barbaren oder Bedrohungen durch die Großmächte der Welt mehr fürchten, denn wir von Pontus werden an ihrer Seite stehen!"
 cde_me_pon_01.11.a: "Wir werden alle Griechen des Schwarzen Meeres verteidigen!"
 cde_me_pon_01.12.t: "Ein neuer Nebenfluss"
 cde_me_pon_01.12.desc: "[me_epi_royal_wedding_country_scope.GetName], dessen Unabhängigkeit wir seit geraumer Zeit garantieren, hat sich klugerweise entschieden, unseren Schutz und unsere Hegemonie dauerhaft zu akzeptieren. Als Gegenleistung für den Schutz ihrer Völker vor den Feinden an ihren Grenzen erhalten wir regelmäßige Tribute von ihnen, wodurch sie offiziell zu Untertanen unseres Staates werden."
 cde_me_pon_01.12.a: "Sie werden ihre Entscheidung nicht bereuen"
 cde_me_pon_01.13.t: "Druck auf die Paphlagonier"
 cde_me_pon_01.13.desc: "Die einheimischen Könige von Paphlagonien herrschten einst über ein großes Reich in Nordanatolien. Heute sind wir jedoch viel mächtiger als sie – daher haben wir die Möglichkeit, den paphlagonischen König einfach dazu zu zwingen, uns sein Reich zu vermachen und als unser loyaler Vasallenstaat zu dienen, bis wir es für angebracht halten, sie als direkte Untertanen unseres Königreichs zu integrieren."
 cde_me_pon_01.13.a: "Hoffen wir, dass sie die richtige Entscheidung treffen …"
 cde_me_pon_01.14.t: "Pontus drängt uns zur Unterwerfung"
 cde_me_pon_01.14.desc: "Das Königreich Pontus hat uns mit Krieg gedroht, wenn wir uns nicht ihrer Herrschaft unterwerfen. Sie haben in der Vergangenheit unsere Gebiete erobert, und obwohl ihr Königreich mächtiger ist als unseres, möchten wir vielleicht kämpfen, um den Stolz unseres Volkes aufrechtzuerhalten. Andererseits wird die Akzeptanz ihrer Oberhoheit Blutvergießen vermeiden, und unser Herrscher wird weiterhin als Vasallenkönig von Pontus auf dem paphlagonischen Thron sitzen."
 cde_me_pon_01.14.a: "Lasst uns Blutvergießen vermeiden und uns unterwerfen"
 cde_me_pon_01.14.b: "Wir werden niemals aufgeben!"
 cde_me_pon_01.15.t: "Paphlagonien reicht ein"
 cde_me_pon_01.15.desc: "Um Blutvergießen zu vermeiden, hat das Königreich Paphlagonien klugerweise beschlossen, sich unserer Herrschaft zu unterwerfen und unser Vasallenstaat zu werden."
 cde_me_pon_01.15.a: "Sie haben die richtige Wahl getroffen"
 cde_me_pon_01.16.t: "Paphlagonien weigert sich, sich zu unterwerfen"
 cde_me_pon_01.16.desc: "Trotz unserer Überlegenheit an Waffen und Einfluss hat das Königreich Paphlagonien törichterweise beschlossen, unsere Friedensangebote im Austausch für ihre Unterwerfung abzulehnen. Daher werden wir ihrem Staat nun den Krieg erklären, um ihr Reich gewaltsam unter unsere Herrschaft zu bringen."
 cde_me_pon_01.16.a: "Lasst uns die Narren in ihre Schranken weisen"
 cde_me_pon_01.17.t: "Ahnenländer von Paphlagonien"
 cde_me_pon_01.17.desc: "Paphlagonien ist das Stammland der Mithridatiden, da der Gründer Mithridates I. Ktistes hier vor langer Zeit das Mithridatische Königreich errichtet hatte. Die Eingliederung in das Königreich war daher ein Segen für die einheimischen Paphlagonier, die von den örtlichen mithridatidischen Gouverneuren als Gleichberechtigte behandelt wurden."
 cde_me_pon_01.17.a: "Wer sind wir, dass wir sie anders behandeln?"
 cde_me_pon_01.18.t: "Land des Goldenen Vlieses"
 cde_me_pon_01.18.desc: "Wir haben endlich unser angestammtes Land in Kolchis gesichert, da die gesamte Region Kolchis unter pontische Herrschaft gestellt wurde. Kolchis war für die Griechen seit langem eine Quelle des Mysteriums und der Ehrfurcht, da es das Land war, in dem das Goldene Vlies aufbewahrt wurde. Nun sind wir der erste hellenistische Staat, der tatsächlich ganz Kolchis erobert hat."
 cde_me_pon_01.18.a: "Wie lustig, wir sind die neuen Argonauten!"
 cde_me_pon_01.19.t: "Phasis und Dioskourias"
 cde_me_pon_01.19.desc: "Die vor vielen Jahrhunderten gegründeten griechischen Handelszentren Phasis und Dioskourias sind zwei Hauptquellen des Reichtums und der Reichtümer der Bevölkerung von Kolchis. Unsere direkte staatliche Förderung der Entwicklung der Städte und die Förderung des Handels in der Region haben uns die Gunst der griechischen und kolchischen Händler und Bürger eingebracht, die am unmittelbarsten von unserer Schirmherrschaft profitieren."
 cde_me_pon_01.19.a: "Mögen sie Kolchis und Pontus Reichtum bringen"
 cde_me_pon_01.20.t: "Die vielen Stämme von Kolchis"
 cde_me_pon_01.20.desc: "Die Region Kolchis ist ein äußerst vielfältiger Schmelztiegel verschiedener Sprachen, Kulturen und Traditionen; allein in der Stadt Dioskourias werden unter den Einwohnern Hunderte von Sprachen gesprochen. Daher ist es eine ziemlich beeindruckende Leistung, dass wir die vielen Stämme und Völker Kolchis‘ – vorübergehend – besänftigt haben."
 cde_me_pon_01.20.a: "Lasst uns danach streben, die Loyalität dieser Völker zu bewahren"
 cde_me_pon_01.21.t: "Ein Klientelkönig in Kolchis"
 cde_me_pon_01.21.desc: "Obwohl wir entschieden haben, dass Kolchis unter einer indirekten Herrschaft durch einen Vasallenkönig besser dran wäre, haben wir uns noch nicht entschieden, wer genau die Verantwortung für die Herrschaft über das Land Kolchis übernehmen soll. Nach einiger Überlegung wurden drei Personen identifiziert: ein Mitglied der direkten Familie von [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName], ein entfernter Cousin von [ROOT.GetCountry.GetRuler.GetName] und ein prominenter lokaler kolchischer Herrscher."
 cde_me_pon_01.21.a: "[ruler_family_client_candidate.GetName] sollte regieren"
 cde_me_pon_01.21.b: "[ruler_cousin_client_candidate.GetName] sollte regieren"
 cde_me_pon_01.21.c: "[ruler_local_client_candidate.GetName] sollte regieren"
 cde_me_pon_01.21.btt: "Ein Cousin des Herrschers wird Klientelkönig von Kolchis"
 cde_me_pon_01.21.ctt: "Ein lokaler kolchischer Herrscher wird Klientelkönig von Kolchis"
 cde_me_pon_01.22.t: "Ansprüche auf Taurica"
 cde_me_pon_01.22.desc: "Nachdem wir nun in Trapezous einen Marinestützpunkt errichtet haben, verfügen wir nun über die Mittel, die Griechen auf der anderen Seite des Meeres zu schützen. Die Griechen in Taurica wurden von den königlichen Skythen fast besiegt, wobei Chersonesus sowie die Städte des Bosporanischen Königreichs die einzigen ehemaligen griechischen Kolonien sind, die nicht unter die Herrschaft der Skythen gefallen sind. Lassen Sie uns also Anspruch auf Taurica erheben, damit wir als aufrichtige Verteidiger der griechischen Autonomie die Meere überqueren können!"
 cde_me_pon_01.22.a: "Beschütze die Griechen von Taurica!"
 cde_me_pon_01.23.t: "Pontische Beschützer von Taurica"
 cde_me_pon_01.23.desc: "Wir sind in Taurica als Beschützer der Griechen von Taurica eingegriffen und haben ihnen den lang ersehnten Frieden und die Sicherheit vor den Barbarenstämmen im Norden gebracht."
 cde_me_pon_01.23.a: "Unter unserem Schutz werden sie nie Angst kennen!"
 cde_me_pon_01.24.t: "Freunde in Chersonesos"
 cde_me_pon_01.24.desc: "Nachdem die Stadt Chersonesos unter pontischen Einfluss gestellt wurde, ist es an der Zeit, dass wir uns anderswo umsehen, um unseren Einfluss an der Schwarzmeerküste auszuweiten. Unsere Freunde aus Chersones erzählen uns von den reichen Handelsstädten Olbia und Tyras, einst einflussreiche griechische Städte, die nun unter den Einfluss der barbarischen Stämme der Skythen und Sarmaten im Norden geraten sind. Lassen Sie uns daher als Beschützer der Schwarzen Griechen auch diese Städte befreien."
 cde_me_pon_01.25.t: "Sicherer Handel im Nordwesten von Emporia"
 cde_me_pon_01.25.desc: "Wir haben die Handelsstädte Olbia und Tyras von ihren barbarischen Oberherren befreit und die Skythen und Sarmaten zurückgeschlagen, sodass sie die Städte nicht länger überfallen und den schutzlosen Griechen entlang der Küste Angst und Schrecken einjagen können."
 cde_me_pon_01.25.a: "Kein Grieche soll unter unserem Banner Angst haben"
 cde_me_pon_01.26.t: "Neapolis Taurike"
 cde_me_pon_01.26.desc: "Wir haben die prestigeträchtige skythische Stadt Neapolis Taurike erobert. Die Skythen, Heimat sowohl von Skythen als auch von Griechen, haben die Stadt zu einem geschäftigen Zentrum Taurikas entwickelt, wobei griechische Händler, Architekten und Handwerker zur Kultur und zum Reichtum der Stadt beigetragen haben. Daher haben wir unsere eigenen Mittel investiert, um die Stadt Neapolis Taurike zu einem strategischen, wirtschaftlichen und kulturellen Zentrum von Pontus in Taurika auszubauen."
 cde_me_pon_01.26.a: "Lassen Sie uns Taurica weiterentwickeln"
 cde_me_pon_01.27.t: "Bosporanische Unterwerfung"
 cde_me_pon_01.27.desc: "Die Unterwerfung der Bosporan-Griechen hat uns größere militärische und wirtschaftliche Möglichkeiten eröffnet. Lassen Sie uns also unsere neuen Gebiete nutzen, indem wir pontische Händler in der zentralen Stadt Theodosia ansiedeln."
 cde_me_pon_01.27.a: "Prächtig."
 cde_me_pon_01.28.t: "Bosporan-Integration"
 cde_me_pon_01.28.desc: "Wir haben unsere Hingabe an die Bosporan-Griechen unter Beweis gestellt, indem wir ihr Land entwickelten und dafür sorgten, dass sie unter der Herrschaft Pontis gedeihen. So konnten selbst diejenigen in den Bosporan-Städten, die unseren Absichten in ihrem Heimatland skeptisch gegenüberstanden, durch unsere Großzügigkeit und Güte überzeugt werden."
 cde_me_pon_01.28.a: "Alle Griechen, ob Pontus oder Bosporus, werden gedeihen"
 cde_me_pon_01.29.t: "Skythische Adelsstämme rebellieren"
 cde_me_pon_01.29.desc: "Die skythischen Adligen, die befürchten, ihren Einfluss in der Bosporus-Region zu verlieren, jetzt wo wir das Sagen haben, wurden gezielt zum Aufstand angestachelt. Dadurch werden diejenigen ausgemerzt, die mit unserer Herrschaft unzufrieden sind, und es bleiben nur loyale Skythen oder zumindest solche, die gleichgültig sind, als Untertanen unseres Königreichs übrig. Lasst uns also diese skythischen Rebellen vernichten und allen Stämmen zeigen, dass wir uns nicht widersetzen!"
 cde_me_pon_01.29.a: "Lasst uns diesen erbärmlichen Widerstand niederschlagen!"
 cde_me_pon_01.30.t: "Champion der Euxine-Griechen"
 cde_me_pon_01.30.desc: "Wir haben alle Griechen entlang des nördlichen und östlichen Schwarzen Meeres befreit und alle Griechen entlang der Küste kennen den Namen unseres großen Basileus. Daher haben wir unseren Herrscher offiziell zum Retter der Schwarzmeergriechen erklärt.\n\nNachdem er eine brandneue Ära für die Griechen im Schwarzen Meer eingeläutet hat, wäre es für unseren Herrscher vielleicht angemessen, einen passenden Titel oder Beinamen anzunehmen, um seine Leistungen zu würdigen."
 cde_me_pon_01.30.a: "„Soter“, was „der Retter“ bedeutet"
 cde_me_pon_01.30.b: "„Euergetes“, was „der Wohltäter“ bedeutet"
 cde_me_pon_01.30.c: "„Megas Soter“, was „der große Retter“ bedeutet"
 cde_me_pon_01.30.d: "Wir sollten trotz unserer Erfolge bescheiden bleiben …"
  
