 pontus_kingdom_missions_task_8_tt: "Die Bereiche $paphlagonia_inferior_area$ und $machelonia_area$ verfügen insgesamt über #Y [SCOPE.ScriptValue('pontus_ports_task_8_max')|0]#! Häfen (aktuell: [SCOPE.ScriptValue('pontus_ports_task_8_current')|0Y])"
 pontus_kingdom_missions_task_9_tt: "Die Gebiete $paphlagonia_superior_area$ und $pontus_area$ verfügen insgesamt über #Y [SCOPE.ScriptValue('pontus_forts_task_9_max')|0]#! Festungen (aktuell: [SCOPE.ScriptValue('pontus_forts_task_9_current')|0Y])"
 pontus_kingdom_missions_task_12_tt: "Habe insgesamt #Y [SCOPE.ScriptValue('pontus_academy_task_12_max')]#! Akademien (Aktuell: [SCOPE.ScriptValue('pontus_academy_task_12_current')|0])"
 pontus_kingdom_missions_task_15_tt: "Bestimmen Sie den weiteren Weg für Pontus …"
 pontus_kingdom_missions_task_16_tt: "Geben Sie unsere [GetCulture('median').GetName|Y]-Methoden auf und übernehmen Sie stattdessen die [GetCulture('greco_pontic').GetName|Y]-Kultur."
 pontus_kingdom_missions_task_16_ttt: "Die [GetCulture('greco_pontic').GetName|Y]-Kultur ist integriert."
  
