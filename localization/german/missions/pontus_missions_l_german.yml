l_german:
  
 pontus_kingdom_missions: "Königreich Pontus"
 pontus_kingdom_missions_DESCRIPTION: "Unsere Nation befindet sich wahrlich in einer Phase großer Gefahr, denn jene, die behaupten, unsere Freunde zu sein, haben es offen und gierig auf unseren Besitz abgesehen, und unsere Grenzen werden von allen Seiten durch die Aufgeboten ehrgeiziger Generäle bedrängt, die nichts lieber tun würden, als das flackernde Licht unserer stolzen Zivilisation auszulöschen.\n\nAngesichts dieser Gefahr sind unsere Herrscher dem enormen Druck nicht nachgegeben, sondern haben sich stattdessen entschieden, gegen eine scheinbar unausweichliche Flut anzukämpfen."
 pontus_kingdom_missions_CRITERIA_DESCRIPTION: "Diese Mission wird abgeschlossen sein, wenn [ROOT.GetCountry.GetName] seine Position im Chaos nach den #E Diadochenkriegen#!. gesichert hat."
 pontus_kingdom_missions_BUTTON_TOOLTIP: "Der Weg vor uns wird schwierig sein, und doch wird uns niemand im Weg stehen können, wenn wir standhaft bleiben …"
 pontus_kingdom_missions_BUTTON_DETAILS: ""
  
  #Missions 
  
 pontus_kingdom_missions_task_1: "Die Bedrohung durch die Antigoniden"
 pontus_kingdom_missions_task_1_DESC: ""
 pontus_kingdom_missions_task_1_allow_tt: "Mithradates II has been #R executed#!"  <None>  #NT!
  
 pontus_kingdom_missions_task_2: "Angriff der Antigoniden"
 pontus_kingdom_missions_task_2_DESC: ""
 #declare war on Gandara owner 
  
  
 pontus_kingdom_missions_task_3: "Die Rache der Medians"
 pontus_kingdom_missions_task_3_DESC: ""
  
 pontus_kingdom_missions_task_4: "Eine neue Hoffnung"
 pontus_kingdom_missions_task_4_DESC: "Während die Welt um uns herum in Flammen aufgeht und die Zukunft unseres Volkes immer ungewisser scheint, dürfen wir uns nicht von der Angst unterkriegen lassen – die Hoffnung unserer Nation liegt in der Stärke unserer Waffen.\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
  
 pontus_kingdom_missions_task_5: "Ein neuer Weg"
 pontus_kingdom_missions_task_5_DESC: "Ist unsere aktuelle Situation darauf zurückzuführen, dass die Götter uns verlassen haben? Unser Volk war treu und dennoch können wir nicht umhin zu bemerken, dass unsere Frömmigkeit nicht belohnt wurde. Vielleicht sollten wir ein Pantheon wählen, das der Anbetung von [ROOT.GetCountry.GetAdjective] würdig ist? \n\n\n\n\n\n\n\n\n\n@greek_mil3!"
  
 pontus_kingdom_missions_task_6: "Das Erwachen der Brückenglieder"
 pontus_kingdom_missions_task_6_DESC: "Lassen Sie uns nicht tatenlos zusehen, wie unsere Nachbarstaaten in diesem Zeitalter des Chaos um die Vorherrschaft kämpfen. Auch wir haben Ansprüche gegenüber unseren Feinden und wir werden nicht ruhen, bis wir ein würdiges Königreich errichtet haben. \n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 pontus_kingdom_missions_task_6_tt: "Gain claims on the areas of [GetProvince('(int32)198').GetArea.GetName|Y] and [GetProvince('(int32)1812').GetArea.GetName|Y]"  <None>  #NT!
  
 pontus_kingdom_missions_task_7: "Juwel des Euxine"
 pontus_kingdom_missions_task_7_DESC: "Betrachten wir die Stadt [GetProvince('(int32)1812').GetName] mit ihrem geschäftigen Hafen und der beeindruckenden Aussicht auf den #E Pontus Euxinus#!;. Tatsächlich erinnert sie [ROOT.GetCountry.GetRuler.GetName] an [GetProvince('(int32)245').GetName]. Sollen wir unsere Hauptstadt an die Nordküste Anatoliens verlegen oder dort bleiben, wo wir sind? Eine wichtige Entscheidung muss getroffen werden. \n\n\n\n\n\n\n\n\n\n@greek_mil18!"
  
 pontus_kingdom_missions_task_8: "Rückkehr des Mithridatischen Handels"
 pontus_kingdom_missions_task_8_DESC: "Dank der Anzahl der Häfen an unseren Nordküsten sind die von uns erhobenen Steuern und Zölle exponentiell gestiegen. \n\n\n\n\n\n\n\n\n\n@greek_mil19!"
  
 pontus_kingdom_missions_task_9: "Schützen Sie die Küsten"
 pontus_kingdom_missions_task_9_DESC: "Es wurde beschlossen, dass wir unsere Landsleute vor umherziehenden Piraten und ehrgeizigen Admiralen schützen müssen, indem wir ein Netzwerk von Festungen entlang unserer Küste errichten. Diese Zitadellen sollen die erste Verteidigungslinie gegen jeden sein, der uns unserer Besitztümer berauben möchte.\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
  
 pontus_kingdom_missions_task_10: "Eine richtige Hauptstadt"
 pontus_kingdom_missions_task_10_DESC: "Jetzt, da wir einen kurzen Moment der Ruhe haben, um Luft zu holen und zu bewerten, was wir soeben erreicht haben, wollen wir unsere Aufmerksamkeit der Verschönerung unserer Hauptstadt [ROOT.GetCountry.GetCapital.GetName] zuwenden.\n\nWir können nicht zulassen, dass das Haus [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] in Demut lebt, sondern müssen eine angemessene Hauptstadt errichten, die ihren ewigen Ruhm widerspiegelt!\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
  
 pontus_kingdom_missions_task_11: "Kluge Investitionen"
 pontus_kingdom_missions_task_11_DESC: "Dank des Geschäftssinns von [ROOT.GetCountry.GetRuler.GetName] erlangt unsere Hauptstadt [ROOT.GetCountry.GetCapital.GetName] schnell den Ruf, ein Zentrum der pontischen Zivilisation zu sein – welche größere Auszeichnung könnte es für unser [ROOT.GetCountry.GetRulerTitle] geben? \n\n\n\n\n\n\n\n\n\n@italic_mil4!"
  
 pontus_kingdom_missions_task_12: "Große Werke von Pontus"
 pontus_kingdom_missions_task_12_DESC: "Gelehrte Reisende und Philosophen aus der ganzen Welt stechen in See und steuern die Häfen von [ROOT.GetCountry.GetName] an, in der Hoffnung, an einer der Vorlesungen teilzunehmen, die in den vielen Akademien unseres Landes abgehalten werden. \n\n\n\n\n\n\n\n\n\n@india_mil20!"
  
 pontus_kingdom_missions_task_13: "Angriff der Mithridatiker"
 pontus_kingdom_missions_task_13_DESC: "Die günstigen Winde des Krieges wehen zu unseren Gunsten, füllen unsere Segel und treiben unsere Streitkräfte zu größeren Siegen; vorwärts, Aushebungen von [ROOT.GetCountry.GetName]! Die Welt gehört uns!\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 pontus_kingdom_missions_task_13_tt: "Gewinnansprüche auf die Bereiche [GetProvince('(int32)1787').GetArea.GetName|Y] und [GetProvince('(int32)1791').GetArea.GetName|Y]."
  
 pontus_kingdom_missions_task_14: "Die Rache der Pontics"
 pontus_kingdom_missions_task_14_DESC: "Nachdem wir nun unsere Grenzen erweitert und alle Neinsager zum Schweigen gebracht haben, die an unserer Fähigkeit zweifelten, wie der legendäre Phönix aus der Asche aufzusteigen, muss innerhalb der Mauern von [ROOT.GetCountry.GetCapital.GetName] eine wichtige Entscheidung getroffen werden – eine, die durch die Geschichte nachhallen wird. \n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 pontus_kingdom_missions_task_14_tt: "Entscheiden Sie, ob wir als Königreich Pontus oder als Mithradatisches Königreich weitermachen sollen."
  
 pontus_kingdom_missions_task_15: "Der Weg nach vorn"
 pontus_kingdom_missions_task_15_DESC: "Weise Männer sagen, dass niemand den launenhaften Willen der Götter und das, was sie für uns bereithalten, kennen kann. Diese weise Beobachtung mag zwar wahr sein, aber unser Volk vertraut darauf, dass der Weg nach vorn ein erfolgreicher sein wird...\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 pontus_kingdom_missions_task_15_allow_tt: "#E #Y Pontus#!#! must #R not#! exist."  <None>  #NT!
  
  
 pontus_kingdom_missions_task_16: "Die Pontics schlagen zurück"
 pontus_kingdom_missions_task_16_DESC: "Überall auf [ROOT.GetCountry.GetName] finden in den Häusern der Eliten unangenehme Gespräche statt; sind wir wirklich noch ein #Y Median#!-Volk? Vielleicht ist die Annahme einer neuen Identität der Weg nach vorn ... wir verkünden allen, die zuhören wollen, dass wir uns als #Y Pontic#! betrachten.\n\n\n\n\n\n\n\n\n\n@persia_mil4!"
  
 pontus_kingdom_missions_task_17: "Strength With The Macedonians"  <None>  #NT!
 pontus_kingdom_missions_task_17_DESC: "The future of our dynasty is clearly entwined with that of the #E [ROOT.GetCountry.GetOverlord.GetAdjective]s#!, our mighty overlord. While it may be tempting to assert greater independence, such actions would only invite conflict and suspicion. Instead, let us take the wiser course-one that solidifies our position and elevates our stature within their realm."  <None>  #NT!
  
 pontus_kingdom_missions_task_18: "Proving Our Worth"  <None>  #NT!
 pontus_kingdom_missions_task_18_DESC: "Now, it is time to demonstrate to the worth of our dynasty to the #E [ROOT.GetCountry.GetOverlord.GetAdjective]s#!, and show them that [ROOT.GetCountry.GetName] has more to offer as an indispensable ally rather than one of myriad subjects."  <None>  #NT!
  
 pontus_kingdom_missions_task_19: "A Mithridatic Kingdom"  <None>  #NT!
 pontus_kingdom_missions_task_19_DESC: "Prince, dynast, satrap, strategoi, our predecessors held many titles, but never 'king.' The house of #E Mithridates#! has weathered countless storms and seized every opportunity to grow stronger. Our lineage traces its roots back to the days of the Achaemenid Empire, when Gobryas and his descendants held sway as one of Persia's leading noble families. Awarded Mariandynia by the Great King Darius I, the dynasty later expanded its holdings to include Mysia under Ariobarzanes. Our forebears served as satraps and strategoi, trusted by kings yet ever vigilant for their own survival. Soon, this long history of service to empires and rulers shall come to an end. No longer shall our line bow to foreign kings or fight for the ambitions of others. No, we shall reign as kings in our own right.\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"  <None>  #NT!
  
 pontus_kingdom_missions_task_20: "Achaemenid Connections"  <None>  #NT!
 pontus_kingdom_missions_task_20_DESC: "The House of Mithridates claims descent from the noblest blood of the Achaemenid Empire. Through Gobryas, son of Darius I and Artystone, the dynasty traces its roots to the royal line itself. Later generations, including Artabazus of Hellespontine Phrygia, further entertwined the family with the great satrapal houses of western Asia. Though the empire of Cyrus has fallen, its blood endures, alive in our veins, and remembered by those who still honor the memory of Kings and Conquerors.\n\n\n\n\n\n\n\n\n\n@persia_mil5!"  <None>  #NT!
  
 pontus_kingdom_missions_task_21: "The Flaming Lotus"  <None>  #NT!
 pontus_kingdom_missions_task_21_DESC: "The temple state of Zela was home to one of the earliest fire cults in Asia Minor, its origins tied to the legendary defeat of the Sakas by Cyrus the Great. To commemorate this victory, a grand temple was constructed from white marble in the Corinthian style, and an annual festival called the Sacaea was established in its honor. This festival, as described by Strabo, bore striking similarities to Bacchic rituals, where men, adorned in Scythian garb, would engage in revelry, drinking, and merrymaking with women throughout the day and night. The governance of Zela closely resembled that of Comana Pontica, with its theocratic structure centered around a powerful priesthood. As was commonplace in Anatolia, priests of the temple exercised control over the whole surrounding area, which was populated by numerous temple-servants and priests. The temple was not only a place of celebration but also a center for religious activity tied to both the Zoroastrian and Anatolian pantheons. Local mythology revered the goddess Artemis Anaitis and the god Men as a a mother-son duo, fusing Persian and Anatolian traditions."  <None>  #NT!
  
 pontus_kingdom_missions_task_22: "Little Corinth"  <None>  #NT!
 pontus_kingdom_missions_task_22_DESC: "The territory of Comana Pontica lay along the Iris, which provides it with a sizeable agricultural area and means of communication with Armenia as well as other cities of Pontus. One of the most important temples in the region was housed here and was dedicated to the goddess of Ma. The cult of Ma then carried onwards to Comana Cappadocia. Eventually, Sulla, who claimed that in a dream, Ma gave him lightning to destroy his enemies would introduce her cult to Rome. The citizens of Comana Pontica acquired great wealth from the vineyards and from the merchants and their customers who came to the city during the grand festival which took place twice a year. Strabo remarks that its multitude of prostitutes dedicated to the goddess Ma made it in a way a 'lesser Corinth.' 6000 sacred slaves known as hierodouloi worked the fields of the temple territory and were dedicated to the service of Ma. They had an enviable position, being granted inviolability. The temple state of Comana Pontica's territory would be considerably expanded once it came under Roman rule."  <None>  #NT!
  
  
  
 ###New Task for Temple States 
 #pontus_kingdom_missions_task_20: "Pontic Temple States"  <None>  #NT!
 #pontus_kingdom_missions_task_20_DESC: "The realm of Pontus has long been home to temple states, small theocracies wherein a priest-king ruled over a secular society typically consisting of extensive estates worked by a large number of sacred slaves. These cults, ran out of grand temples, also administered fields and small towns within their surrounding area. Supporting these temple states can revive immigration to the Pontic inland as well as grant the throne divine favor.\n\n\n\n\n\n\n\n\n\n@greek_mil3!"  <None>  #NT!
 #pontus_kingdom_missions_task_20_finish_tt: "The future of #E Zela#! and #E Comana Pontica#! wil be decided"  <None>  #NT!
  
  
  
  
