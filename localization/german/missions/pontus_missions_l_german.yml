 me_pontus_kingdom_1_title: "$pontus_kingdom_missions_task_1$"
 me_pontus_kingdom_1_desc: "[GetCharacter('(int32)52').GetNameWithNoTooltip] wurde von [GetCharacter('(int32)37').GetNameWithNoTooltip] getötet! Die Geschichte von [GetCharacter('(int32)52').GetNameWithNoTooltip]s Tod hat in unserem Land große Bestürzung ausgelöst, und unser Volk beweint diesen Verrat bitter.\n\nAber wir können es uns in diesem Moment nicht leisten, den Verlust zu betrauern, sonst werden unsere Köpfe von Krähen auf einer antigonidischen Pike abgenagt. Für das Volk von [GetCharacter('(int32)52').GetFamily.GetNameWithNoTooltip] ist die Zeit gekommen, sich vom Joch der Antigoniden zu befreien – wir müssen eine so große Armee wie möglich aufstellen und aus diesem Land fliehen!\n\nDer Plan für die Flucht ist bereits ausgearbeitet, und unsere Reiter reiten in diesem Moment nach [GetProvince('(int32)200').GetNameWithNoTooltip], um die Festung vor der Hauptarmee einzunehmen ..."
 me_pontus_kingdom_1.a: "Auf Wiedersehen, Kios...fürs Erste"
 me_pontus_kingdom_1.b: "Kimista is ours! Paphlagonia is next."  <None>  #NT!
 me_pontus_kingdom_1_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_1$#!' wurde nun #G Abgeschlossen#!!"
  
 #Pacifying Paphlogonia 
 me_pontus_kingdom_2_title: "Kampf ums Überleben"
 me_pontus_kingdom_2_desc: "Nach einem gewagten Überfall, an den wir uns noch Jahrzehnte lang stolz erinnern werden, haben unsere Männer die Festung [GetProvince('(int32)200').GetNameWithNoTooltip] ohne großen Widerstand der Einheimischen eingenommen. Es war fast so, als wollten sie, dass wir sie erobern, denn es ging so leicht. Zweifellos wird [kimiata_owner.GetNameWithNoTooltip] wütend sein über das, was wir getan haben, und doch könnten wir sie noch wütender machen; wagen wir es, noch mehr Territorium zu erobern?"
 me_pontus_kingdom_2_tooltip: "Es ist Zeit für Kios, der Welt zu zeigen, wer wir wirklich sind, denn heute ist der Tag, an dem die Menschen von [kimiata_owner.GetName] ihrem Untergang entgegensehen. Viele sagen, dass nur die Provinz [GetProvince('(int32)200').GetName] nötig ist, um [kimiata_owner.GetName] zur Kapitulation zu zwingen, da sie jetzt schwächer sind als je zuvor."
 me_pontus_kingdom_2.a: "Kios wird nicht umsonst verloren gegangen sein!"
 me_pontus_kingdom_2.at: "We will gain an army in #E Kimista#!"  <None>  #NT!
 me_pontus_kingdom_2.b: "Jetzt ist nicht die Zeit für Feindseligkeiten …"
 #me_pontus_kingdom_2_tooltip: "It is time for [THIS.GetRuler.GetPraenomen] to show the world who he truly really is, for today is the day the people of [kimista_owner.GetName] meet their doom. Many say only the province of [GetProvince('(int32)214').GetName] is needed to force [kimista_owner.GetName] to capitulate, as they are weaker now than ever."  <None>  #NT!
  
  
