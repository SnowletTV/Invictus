 me_pontus_kingdom_2002.a: "Men ought not interfere with the emmisarries of the gods"  <None>  #NT!
 me_pontus_kingdom_2002.at: "#E Zela#! will become our #Y Temple State#!"  <None>  #NT!
 me_pontus_kingdom_2002.b: "Perhaps the gods can govern bettern than men"  <None>  #NT!
 me_pontus_kingdom_2002.bt: "#E Zela#! will receive lands in #E Iris Superioris#! and become our #Y Temple State#!"  <None>  #NT!
 me_pontus_kingdom_2002.c: "Their lands shall be seied!"  <None>  #NT!
  
