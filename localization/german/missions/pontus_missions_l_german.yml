 #AI things 
 me_pontus_kingdom.222.t: "Die Bedrohung von Kios"
 me_pontus_kingdom.222.desc: "Eine fast unglaubliche Nachricht erreichte [ROOT.GetCountry.GetCapital.GetName] und doch versichern uns unsere atemlosen Reiter, deren erschöpfte, mit Schaum bedeckte Pferde uns, dass diese Information der Wahrheit entspricht - es scheint, dass eine kleine Militärtruppe aus [GetCountry('KIO').GetName] auf der Flucht vor der Ankunft der Aushebungen von #E Antigonid#! die Festung von [GetProvince('(int32)200').GetName] eingenommen und uns das Land gestohlen hat.\n\nDie feige Garnison, die mit dem Schutz des Territoriums betraut war, öffnete die Tore, ohne auch nur den Versuch zu unternehmen, unsere Rechte zu verteidigen und nun patrouillieren die Armeen von Kios entlang der Mauern.\n\nSicherlich sollte eine solch schwere Beleidigung nicht toleriert werden - was sollen wir tun, mein [ROOT.GetCountry.GetRulerTitle]?"
 me_pontus_kingdom.222.a: "Wir müssen unser rechtmäßiges Land zurückerobern!"
 me_pontus_kingdom.222.b: "Wir lassen sie in Ruhe...für jetzt"
  
 me_pontus_kingdom_2223_title: "Ein Vorschlag für den Frieden"
 me_pontus_kingdom_2223_desc: "Nach dem Verlust von [GetProvince('(int32)198').GetNameWithNoTooltip] im Krieg erkannte [kimiata_owner.GetName], dass der Krieg sinnlos war, und unterbreitete uns ein Angebot, das wir nicht ablehnen konnten. Fast ganz Nordpaphlagonien wird an uns abgetreten, und im Gegenzug werden wir [kimiata_owner.GetName] am Leben lassen ... vorerst."
 me_pontus_kingdom_2223.a: "Ein herrlicher Tag für die Menschen von Kios!"
 me_pontus_kingdom_2223.b: "Frieden war nie eine Option ... sie müssen alle sterben!!!"
 me_pontus_kingdom_2223_tooltip: "Jede Provinz im Besitz von [kimiata_owner.GetName] in den Gebieten [GetProvince('(int32)198').GetArea.GetName] und [GetProvince('(int32)208').GetArea.GetNameWithNoTooltip]"
  
 me_pontus_kingdom_3_title: "$pontus_kingdom_missions_task_3$"
 me_pontus_kingdom_3_desc: ""
 me_pontus_kingdom_3.a: ""
 me_pontus_kingdom_3_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_3$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_4_title: "$pontus_kingdom_missions_task_4$"
 me_pontus_kingdom_4_desc: "Unsere Feinde drängen von allen Seiten an unsere Grenzen und manche behaupten, die Vorzeichen würden den Untergang von [ROOT.GetCountry.GetName] vorhersagen - denn wie können wir hoffen, den Mächten standzuhalten, die sich gegen uns versammelt haben? Wir sind ein kleiner Fisch, der in einem Meer von ausgehungerten Haien schwimmt...\n\nDoch [ROOT.GetCountry.GetRuler.GetName] hat sich dieser Angst nicht hingegeben, sondern stattdessen jeden wachen Moment damit verbracht, mit unseren Truppen zu trainieren und sich darauf vorzubereiten, [ROOT.GetCountry.GetRuler.GetHerHis]s Schicksal zu erfüllen. Obwohl die Flut uns zu überwältigen droht, werden wir tapfer für unsere Ziele kämpfen!"
 me_pontus_kingdom_4.a: "Wir sehen vielleicht nicht nach viel aus, aber wir haben es da, wo es zählt"
 me_pontus_kingdom_4_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_4$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_5_title: "$pontus_kingdom_missions_task_5$"
 me_pontus_kingdom_5_desc: "Nach einem langen Tag voller fesselnder Dialoge endeten die Gespräche zwischen den heiligen Männern, die in den Städten [ROOT.GetCountry.GetCapital.GetName] und [ROOT.GetCountry.GetRuler.GetName] leben, schließlich und alle zogen sich für den Abend in ihre Häuser zurück, um über ihre Ausführungen nachzudenken.\n\n[ROOT.GetCountry.GetRuler.GetFirstName], jemand, der sich sehr für die Götter interessiert, hat lange nach spiritueller Wahrheit gesucht und Priester der Hellenen und Meder eingeladen, um ihre Philosophien mit [ROOT.GetCountry.GetRuler.GetHerHim] zu diskutieren. Nachdem er ihre Argumente gehört hat, denkt er offen über eine Änderung der religiösen Praktiken von [ROOT.GetCountry.GetName] nach.\n\nEs gibt Gründe, den #E Mithras-Glauben#! anzunehmen, denn viele würden argumentieren, dass es klug sei, den Riten der Meder zu folgen, aber es gibt Stimmen, die behaupten, die #E hellenischen#! Götter hätten der ganzen Welt ihre Tapferkeit bewiesen und man sollte ihnen schon allein aus diesem Grund folgen.\n\nNatürlich könnten wir uns dafür entscheiden, alles so zu lassen, wie es ist ... wagen wir es, den Zorn Gottes zu riskieren?"
 me_pontus_kingdom_5.a: "Der Mithrasglaube hat die Herzen der Menschen erobert"
 me_pontus_kingdom_5.b: "Die hellenischen Götter sind stark, und wir wünschen uns ihre Macht"
 me_pontus_kingdom_5.bt: "Unlock the #T #E Embrace Greco-Pontic Omens#!#! #G Decision#!"  <None>  #NT!
 me_pontus_kingdom_5.c: "Lassen Sie uns weiterhin das Feuer für Zoroaster entzünden …"
 me_pontus_kingdom_5.d: "Die Wege Zoroasters müssen angenommen werden!"
 me_pontus_kingdom_5.e: "Nonsense, our ways are true"  <None>  #NT!
 me_pontus_kingdom_5_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_5$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_6_title: "$pontus_kingdom_missions_task_6$"
 me_pontus_kingdom_6_desc: "In der Zitadelle um [ROOT.GetCountry.GetCapital.GetName] erreicht uns die Nachricht, dass wir unsere Boten vorbereitet haben. Sie sollen noch in dieser Nacht zu den Hauptstädten und Zitadellen unserer Nachbarn reiten, um ihnen eine schreckliche Botschaft zu überbringen: Wenn sie die Siedlungen und Städte, die wir als rechtmäßigen Besitz betrachten, nicht verlassen, kommt es zum Krieg zwischen unseren Nationen."
 me_pontus_kingdom_6.a: "Wir beanspruchen hiermit die folgenden Gebiete für Kios …"
 me_pontus_kingdom_6_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_6$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_7_title: "$pontus_kingdom_missions_task_7$"
 me_pontus_kingdom_7_desc: "Allem Anschein nach blüht die Stadt [GetProvince('(int32)1812').GetName], die bereits ein berühmter Hafen mit dem Ruf einer wahrhaft kosmopolitischen Polis ist, unter der Leitung ihrer neuen [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] Herrscher weiter auf.\n\nUnd während [ROOT.GetCountry.GetRuler.GetName] beginnt, [GetProvince('(int32)200').GetName] lieb zu gewinnen, hat [ROOT.GetCountry.GetRulerTitle] bittersüße Erinnerungen an das verlassene [GetProvince('(int32)245').GetName] an den Ufern des #E Propontis#!.. Eines Morgens kam [ROOT.GetCountry.GetRuler.GetHerHis] ein merkwürdiger Gedanke: Was hält uns davon ab, den Sitz der [ROOT.GetCountry.GetAdjective] Autorität an die Küste zu verlegen? Vielleicht könnten wir wieder am offenen Meer leben."
 me_pontus_kingdom_7.a: "[ROOT.GetCountry.GetCapital.GetName] ist ein guter Standort; der Status quo ist"
 me_pontus_kingdom_7.b: "Verlegen wir unsere Hauptstadt doch lieber nach Sinope."
 me_pontus_kingdom_7_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_7$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_8_title: "$pontus_kingdom_missions_task_8$"
 me_pontus_kingdom_8_desc: "Noch bevor die Sonne über den Gewässern des #E Pontus Euxinus#!, aufgegangen ist, sind die lauten Rufe der begeisterten Seeleute zu hören, die sich unseren Häfen nähern. Jetzt, da ihre Reise auf See zu Ende ist, warten sie alle ungeduldig auf die Gelegenheit, von Bord zu gehen und durch die Straßen unserer Städte zu schlendern, während die verschiedenen Silber- und Bronzemünzen in ihren Geldbörsen darauf warten, auf unseren Märkten ausgegeben zu werden.\n\nZum Glück für sie werden sie bald nach Herzenslust frische Lebensmittel trinken und essen können und vielleicht sogar zum ersten Mal seit Monaten wieder ein heißes Bad genießen können. Alles, was sie sich wünschen, wird ihnen gehören, bis das Geld ausgeht."
 me_pontus_kingdom_8.a: "Der Handel hat unserem Land wirklich Wohlstand beschert ..."
 me_pontus_kingdom_8_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_8$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_9_title: "$pontus_kingdom_missions_task_9$"
 me_pontus_kingdom_9_desc: "Obwohl wir uns zweifellos in offenen Schlachten an Land behaupten können, gab es Befürchtungen, dass unsere ausgedehnten Küsten eine Schwachstelle darstellen. Ohne angemessenen Schutz könnte eine Invasionsarmee von Piraten oder Söldnern an unseren Küsten landen und den Menschen am Meer Unheil zufügen.\n\nDank der Bemühungen von [ROOT.GetCountry.GetRuler.GetName], eine regelrechte Festungsmauer entlang unserer verwundbarsten Verteidigungslinien zu errichten, ist dies jedoch nicht mehr der Fall."
 me_pontus_kingdom_9.a: "Wendet eure Flotten ab, denn euch erwartet nur der Tod in [ROOT.GetCountry.GetName]"
 me_pontus_kingdom_9_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_9$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_10_title: "$pontus_kingdom_missions_task_10$"
 me_pontus_kingdom_10_desc: "Nach einer langen Bauphase wurde [ROOT.GetCountry.GetCapital.GetName] mit einer brandneuen Infrastruktur gesegnet, die den Ruhm unserer Nation weiter steigern wird. Die lokalen Steuereinnahmen sind besser als je zuvor und die Hauptstadt wächst weiterhin von selbst. Tausende Menschen finden innerhalb unserer Stadtmauern ihr Zuhause.\n\nUnd inmitten dieses wachsenden städtischen Chaos wird der Name [ROOT.GetCountry.GetRuler.GetName] täglich gepriesen, denn jeder ist sich völlig bewusst, wer unsere Hauptstadt im Alleingang zu diesem Moment gebracht hat."
 me_pontus_kingdom_10.a: "Kann unserem Volk irgendetwas im Wege stehen? Ich glaube nicht"
 me_pontus_kingdom_10_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_10$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_11_title: "$pontus_kingdom_missions_task_11$"
 me_pontus_kingdom_11_desc: "Während alle richtig davon ausgingen, dass [ROOT.GetCountry.GetRuler.GetName] ein tapferer Krieger sein würde, hätten nur wenige vermutet, dass unser [ROOT.GetCountry.GetRulerTitle] auch ein meisterhafter Baumeister sein würde. Dank der klugen Investitionen von [ROOT.GetCountry.GetRuler.GetHerHim] ist der Ruf von [ROOT.GetCountry.GetCapital.GetName] jedoch so gut wie nie zuvor.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] hat die Menschen nicht vernachlässigt, sondern es für angebracht gehalten, unsere Hauptstadt zu einem würdigen Zentrum der pontischen Zivilisation auszubauen, das es mit jeder Stadt entlang des #E Pontus Euxinus#!. aufnehmen kann."
 me_pontus_kingdom_11.a: "Ich möchte, dass es nicht anders ist ..."
 me_pontus_kingdom_11_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_11$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_12_title: "$pontus_kingdom_missions_task_12$"
 me_pontus_kingdom_12_desc: "In den vielen Akademien, die über ganz [ROOT.GetCountry.GetName] verstreut sind, kümmert sich eine kleine Armee von Bibliothekaren um die vielen Schriftrollen und Abhandlungen, die unter dem Kommando von [ROOT.GetCountry.GetRuler.GetName] zusammengestellt wurden. Es heißt, dass alle größten Werke der Menschheit - Geschichten fremder Nationen, wissenschaftliche Untersuchungen, epische Kriegsgeschichten - in unseren Bildungszentren zu finden sind, die allen Bürgern unserer Nation offen stehen.\n\n[ROOT.GetCountry.GetRuler.GetFirstName], ein wahrer Anhänger des Wertes des Wissenserwerbs, hat daher sichergestellt, dass unsere intellektuelle Überlegenheit unbesiegt bleibt - genau wie unsere Armeen."
 me_pontus_kingdom_12.a: "Mögen unsere [ROOT.GetCountry.GetAdjective] Menschen die weisesten sein, die je gelebt haben"
 me_pontus_kingdom_12_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_12$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_13_title: "$pontus_kingdom_missions_task_13$"
 me_pontus_kingdom_13_desc: "Im Hinterland von [ROOT.GetCountry.GetName] herrscht Unruhe, denn unseren Feinden wurde mehr als deutlich gemacht, dass wir uns nicht auf unseren Lorbeeren ausruhen werden. Nein, unsere Truppen dürsten nach Beute und Ruhm auf dem Schlachtfeld, und was unsere Krieger begehren, können wir nur in den schutzlosen Ländern unserer Nachbarn finden.\n\nDie Armeen von [ROOT.GetCountry.GetAdjective] bereiten sich unter der Führung des furchterregenden [ROOT.GetCountry.GetRuler.GetName] auf noch mehr Angriffskriege vor – die Träume von Frieden in ganz [ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName] schwinden schnell …"
 me_pontus_kingdom_13.a: "Wir werden euer Todesurteil sein!"
 me_pontus_kingdom_13_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_13$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_14_title: "$pontus_kingdom_missions_task_14$"
 me_pontus_kingdom_14_desc: "Der Ruhm liegt uns zu Füßen und bleibt fest in unserer Hand. Wir haben unsere Feinde aus Ländern vertrieben, für deren Erhalt sie verzweifelt gekämpft hatten, ihre Befestigungen niedergerissen und ihren Frauen und Kindern eiserne Fesseln angelegt. Die Asche ihrer Städte erfüllt die Luft, und in der ganzen Landschaft sind Trauergesänge zu hören, während unsere Soldaten durch die besetzten Gebiete ziehen.\n\nNachdem wir nun die Stärke von #E Pontus#!, endgültig zerstört haben, wurde vorgeschlagen, dass wir uns zu den rechtmäßigen Anwärtern auf die Legitimität dieser Nation erklären könnten, indem wir ihren Namen annehmen."
 me_pontus_kingdom_14.a: "Rache ist wahrlich ein süßes Gericht, das man seinen Feinden serviert"
 me_pontus_kingdom_14.at: "We will offer to take over #Y [GetCountry('PON').GetName]#! and absorb their realm. Should they refuse our ultimatum, we will go to war with #Y [GetCountry('PON').GetName]#!."  <None>  #NT!
 me_pontus_kingdom_14.b: "Wir sind jetzt #E Pontus#! in allem außer dem Namen - lasst uns das ändern"
 me_pontus_kingdom_14_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_14$#!' wurde nun #G Abgeschlossen#!!"
  
 #AI ONLY 
 me_pontus_kingdom_1400_title: "Mithridatic Solution"  <None>  #NT!
 me_pontus_kingdom_1400_desc: "The petty states of northern Asia, which have gone unchecked in the vacuum left by Alexander's death and the Diadochi wars, are weak and divided. The nobility of Pontus have been engaged in fractious bickering since the fall of the Persian empire and displeased by their current leadership. Now that the Mithridatids have expanded their borders and risen from the ashes like the legendary phoenix, the have issued an ultimatum: we can willingly submit to the rule of [GetCountry('MIT').GetRuler.GetPraenomen], a Persian noble of impeccable pedigree, or face a war of annihilation."  <None>  #NT!
 me_pontus_kingdom_1400.a: "New leadership is warranted."  <None>  #NT!
 me_pontus_kingdom_1400.b: "Never!"  <None>  #NT!
  #declare war tooltip 
  
 me_pontus_kingdom_1401_title: "Throne of Pontus"  <None>  #NT!
 me_pontus_kingdom_1401_desc: "Our envoys have returned from the back-rooms of [GetCountry('PON').GetCapital.GetName], where they have been laying down our proposal to the Pontic nobility."  <None>  #NT!
 me_pontus_kingdom_1401_desc_1: "$me_pontus_kingdom_1401_desc$\nAs it happens, they have seen the usefulness of a dynamic and prestigious ruler and agreed to put Pontus into the hands of [ROOT.GetCountry.GetRuler.GetPraenomen] in a bloodless coup..."  <None>  #NT!
 me_pontus_kingdom_1401_desc_2: "$me_pontus_kingdom_1401_desc$Whether cowardly or proud, they have refused to accept our reasonable terms, favoring their current leadership over the risks associated with upheaval..."  <None>  #NT!
 me_pontus_kingdom_1401.a: "Excellent!"  <None>  #NT!
 me_pontus_kingdom_1401.at: "We will annex @[GetCountry('PON').GetFlag]! [GetCountry('PON').GetName|Y]"  <None>  #NT!
 me_pontus_kingdom_1401.b: "The hard way, then."  <None>  #NT!
  
 me_pontus_kingdom_15_title: "$pontus_kingdom_missions_task_15$"
 me_pontus_kingdom_15_desc: "Wer hätte die vielen Gefahren und Fallen vorhersehen können, die unserem Volk gestellt wurden, wie Fallen, die ein Jäger stellt, der geduldig auf seine Beute wartet?\n\nWie ein mäandernder Fluss, der von sintflutartigen Regenfällen überflutet wird, trug uns der Wille der Götter auf einen Weg, dem wir nicht entkommen konnten, und während viele schwächere Herrscher den drückenden Gezeiten und Stürmen auf See erlegen wären, hat [ROOT.GetCountry.GetRuler.GetName] das Staatsschiff irgendwie durch eine schwierige Zeit gesteuert.\n\nDie vielen Feinde von [ROOT.GetCountry.GetName] warten atemlos auf Nachricht von [ROOT.GetCountry.GetCapital.GetName], aus Angst, dass die triumphierenden Armeen von [ROOT.GetCountry.GetAdjective] jederzeit eintreffen könnten."
 me_pontus_kingdom_15.a: "Der Weg nach vorn bleibt immer trügerisch, und doch müssen wir vorwärts gehen"
 me_pontus_kingdom_15.at: "Unlock the #T #E  Ktistes#!#! #G Achievement#!!\nThe #Y Pontic Eagle#!, emblazoned in gold on a vibrant purple banner shall become the sigil of Pontus"  <None>  #NT!
 me_pontus_kingdom_15.b: "Even in Pontus, we shall never forget our roots."  <None>  #NT!
 me_pontus_kingdom_15.bt: "Unlock the #T #E  Ktistes#!#! #G Achievement#!!\nThe #Y Pontic Eagle#!, emblazoned in brilliant white on our traditional banner shall become the sigil of Pontus"  <None>  #NT!
 me_pontus_kingdom_15.c: "'Pontus' implies too paltry an ambition..."  <None>  #NT!
 me_pontus_kingdom_15.ct: "The Mithridatid sigil will be emblazoned in black and gold on a vibrant purple banner"  <None>  #NT!
 me_pontus_kingdom_15.d: "Our dynasty is more important than our seat!"  <None>  #NT!
 me_pontus_kingdom_15.dt: "The Mithridatid sigil will remain unchanged"  <None>  #NT!
 me_pontus_kingdom_15_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_15$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_16_title: "$pontus_kingdom_missions_task_16$"
 me_pontus_kingdom_16_desc: "Eines der sichtbarsten Zeichen der Veränderungen, die sich in der ganzen Nation [ROOT.GetCountry.GetName] vollziehen, ist der kulturelle Wandel, der sich unter den Menschen vollzieht; sogar die gesprochene Sprache [ROOT.GetCountry.GetAdjective] hat sich verändert. Regionale Dialekte entwickeln ihre ganz eigene Charakteristik, und Ausländer kommentieren oft den melodischen Klang unserer Sprache.\n\nVor ein paar Generationen waren unsere [ROOT.GetCountry.GetAdjective] Verwandten kaum von anderen #E Medern#!, zu unterscheiden, und doch schwindet der Einfluss der Meder in unseren Städten und Siedlungen langsam und allmählich und wird durch die überlegene #E pontische#! Art, Dinge zu tun, ersetzt."
 me_pontus_kingdom_16.a: "Wahrlich, wir sind ein pontisches Volk, und das sollte weithin bekannt sein"
 me_pontus_kingdom_16.at: "Unlock the #T #E Embrace Greco-Pontic Omens#!#! #G Decision#!"  <None>  #NT!
 me_pontus_kingdom_16.b: "Nonsense, we will never lose our Persian character."  <None>  #NT!
 me_pontus_kingdom_16_tooltip: "Die Missionsaufgabe '#Y $pontus_kingdom_missions_task_16$#!' wurde nun #G Abgeschlossen#!!"
  
 me_pontus_kingdom_17_title: "Strength with the [ROOT.GetCountry.GetOverlord.GetAdjective]s"  <None>  #NT!
 me_pontus_kingdom_17_desc: "The future of our dynasty is clearly entwined with that of the #E [ROOT.GetCountry.GetOverlord.GetAdjective]s#!, our mighty overlord. While it may be tempting to assert greater independence, such actions would only invite conflict and suspicion. Instead, let us take the wiser course-one that solidifies our position and elevates our stature within their realm."  <None>  #NT!
 me_pontus_kingdom_17.a: "Rather friends than enemies."  <None>  #NT!
 me_pontus_kingdom_17_tooltip: "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_17$#!' $mission_completed_tooltip_2$"  <None>  #NT!
  
 me_pontus_kingdom_18_title: "A Request for Partnership"  <None>  #NT!
 me_pontus_kingdom_18_desc: "The rulers of [pontus_ally_country.GetName], members of a proud Persian family, have sent an emissary to our court with a bold request. They argue that their contributions to our cause have proven their worth not merely as a province, but as a valued partner.\n\nGranting this request would ensure their loyalty and strengthen their contributions, but it would also set a precedent for greater autonomy among our subjects. Should we recognize them as a partner rather than a mere province?"  <None>  #NT!
 me_pontus_kingdom_18.a: "Let us formalize an alliance with [pontus_ally_country.GetName]."  <None>  #NT!
 me_pontus_kingdom_18.b: "They will remain a province under our rule."  <None>  #NT!
  
 me_pontus_kingdom_1801_title: "Proving Our Worth"  <None>  #NT!
 me_pontus_kingdom_1801_desc: "Word has arrived from the court of the #E [pontus_old_overlord.GetAdjective]s#! regarding our request. After careful deliberation, they have agreed to recognize us as a partner rather than a mere province., granting us the autonomy to better serve both their interests and our own."  <None>  #NT!
 me_pontus_kingdom_1801.a: "We are honored to be trusted as partners."  <None>  #NT!
 me_pontus_kingdom_18_tooltip: "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_18$#!' $mission_completed_tooltip_2$"  <None>  #NT!
  
 me_pontus_kingdom_1802_title: "Proving Our Worth"  <None>  #NT!
 me_pontus_kingdom_1802_desc: "The court of the #E [pontus_old_overlord.GetAdjective]s#! have refused our request for recognition as a partner. Regrettably, we must tread carefully, continuing to demonstrate our value, until the day we can secure the status we deserve."  <None>  #NT!
 me_pontus_kingdom_1802.a: "We remain loyal... for now."  <None>  #NT!
  
 me_pontus_kingdom_19_title: "Coronation of [ROOT.GetCountry.GetRuler.GetPraenomen]"  <None>  #NT!
 me_pontus_kingdom_19_desc: "The halls of [ROOT.GetCountry.GetCapital.GetName] echo with the sound of celebration. Today marks the culmination of generations of ambition and resilience for the [ROOT.GetCountry.GetRuler.GetFamily.GetNameWithNoTooltip] dynasty. Prince, dynast, satrap, strategoi, our predecessors held many titles, but never 'king.' The house of #E Mithridates#! has weathered countless storms and seized every opportunity to grow stronger. Our lineage traces its roots back to the days of the Achaemenid Empire, when Gobryas and his descendants held sway as one of Persia's leading noble families. Awarded Mariandynia by the Great King Darius I, the dynasty later expanded its holdings to include Mysia under Ariobarzanes. Our forebears served as satraps and strategoi, trusted by kings yet ever vigilant for their own survival. \n\nToday, this long history of service to empires and rulers ends. No longer shall our line bow to foreign kings or fight for the ambitions of others. In the grand palace of [ROOT.GetCountry.GetCapital.GetName], surrounded by nobles, soldiers, and emissaries from across the region, [ROOT.GetCountry.GetRuler.GetPraenomen], proclaiming himself as the first king of a new state."  <None>  #NT!
 me_pontus_kingdom_19.a: "Long live [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen]!"  <None>  #NT!
 me_pontus_kingdom_19.at: "We will retain our current colors"  <None>  #NT!
 me_pontus_kingdom_19.b: "Our new kingdom has need of new heraldry..."  <None>  #NT!
 me_pontus_kingdom_19.bt: "We will adopt a purple color"  <None>  #NT!
 me_pontus_kingdom_19_tooltip: "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_19$#!' $mission_completed_tooltip_2$"  <None>  #NT!
  
 me_pontus_kingdom_20_title: "Achaemenid Connections"  <None>  #NT!
 me_pontus_kingdom_20_desc: "The House of Mithridates claims descent from the noblest blood of the Achaemenid Empire. Through Gobryas, son of Darius I and Artystone, the dynasty traces its roots to the royal line itself. Later generations, including Artabazus of Hellespontine Phrygia, further intertwined the family with the great satrapal houses of western Asia. Though the empire of Cyrus has fallen, its blood endures, alive in our veins, and remembered by those who still honor the memory of Kings and Conquerors."  <None>  #NT!
 me_pontus_kingdom_20.a: "Ours is the blood of Cyrus and Darius!"  <None>  #NT!
 me_pontus_kingdom_20.at: "The #Y #E Mithridatid#! sigil#! will be emblazoned in the traditional colors of the #E #T Achaemenids#!#!"  <None>  #NT!
 me_pontus_kingdom_20.b: "By the grace of Ahuramazda am I king; Ahuramazda has granted me the kingdom."  <None>  #NT!
 me_pontus_kingdom_20_tooltip: "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_20$#!' $mission_completed_tooltip_2$"  <None>  #NT!
  
 me_pontus_kingdom_21_title: "The Flaming Lotus"  <None>  #NT!
 me_pontus_kingdom_21_desc: "The temple state of Zela was home to one of the earliest fire cults in Asia Minor, its origins tied to the legendary defeat of the Sakas by Cyrus the Great. To commemorate this victory, a grand temple was constructed from white marble in the Corinthian style, and an annual festival called the Sacaea was established in its honor. This festival, as described by Strabo, bore striking similarities to Bacchic rituals, where men, adorned in Scythian garb, would engage in revelry, drinking, and merrymaking with women throughout the day and night. The governance of Zela closely resembled that of Comana Pontica, with its theocratic structure centered around a powerful priesthood. As was commonplace in Anatolia, priests of the temple exercised control over the whole surrounding area, which was populated by numerous temple-servants and priests. The temple was not only a place of celebration but also a center for religious activity tied to both the Zoroastrian and Anatolian pantheons. Local mythology revered the goddess Artemis Anaitis and the god Men as a a mother-son duo, fusing Persian and Anatolian traditions."  <None>  #NT!
 me_pontus_kingdom_21.a: "Perhaps I shall attend this year's Sacaea festival."  <None>  #NT!
 me_pontus_kingdom_21_tooltip: "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_21$#!' $mission_completed_tooltip_2$"  <None>  #NT!
  
 me_pontus_kingdom_22_title: "Little Corinth"  <None>  #NT!
 me_pontus_kingdom_22_desc: "The territory of Comana Pontica lay along the Iris, which provides it with a sizeable agricultural area and means of communication with Armenia as well as other cities of Pontus. One of the most important temples in the region was housed here and was dedicated to the goddess of Ma. The cult of Ma then carried onwards to Comana Cappadocia. The citizens of Comana Pontica acquired great wealth from the vineyards and from the merchants and their customers who came to the city during the grand festival which took place twice a year. Strabo remarks that its multitude of prostitutes dedicated to the goddess Ma made it in a way a 'lesser Corinth.' 6000 sacred slaves known as hierodouloi worked the fields of the temple territory and were dedicated to the service of Ma. They had an enviable position, being granted inviolability. The temple state of Comana Pontica's territory would be considerably expanded once it came under Roman rule."  <None>  #NT!
 me_pontus_kingdom_22.a: "I shall have to sample some of this wine."  <None>  #NT!
 me_pontus_kingdom_22_tooltip: "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_22$#!' $mission_completed_tooltip_2$"  <None>  #NT!
  
 ### UNUSED EVENTS 
 me_pontus_kingdom_2001_title: "$pontus_kingdom_missions_task_20$"  <None>  #NT!
 me_pontus_kingdom_2001_desc: "The influence of Achaemenid rule in Anatolia remained long after the King of Kings had been deposed. Under their rule land devoted to temples was still largely considered inviolable, and their priests could hold some of the highest positions in society. This created the conditions for temple estates, which could become very wealthy and influential with attached villages, cities and fields, to effectively become temple states.\n\nRule of these temple states was entrusted to a high priest, enjoying extended powers and privileges, whose authority is second only to the area's temporal ruler.\n\n The time has come to decide whether such a practice shall be allowed to endure..."  <None>  #NT!
 me_pontus_kingdom_2001.a: "We will consider the matter with great care"  <None>  #NT!
 me_pontus_kingdom_2001_tooltip: "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_20$#!' $mission_completed_tooltip_2$"  <None>  #NT!
  
 me_pontus_kingdom_2002_title: "$pontus_kingdom_missions_task_20$: [GetProvince('(int32)1834').GetName]"  <None>  #NT!
