 hostage_heir_modifier: "Hostage Heir"  <None>  #NT!
  
 pontus_startup.3.t: "A Less Enticing Offer"  <None>  #NT!
 pontus_startup.3.desc: "The [GetCountry('PRY').GetAdjective] envoys have arrived, bringing a message from [GetCharacter('(int32)37').GetName] cloaked in polite rhetoric but its true intent is unmistakable. Rumors of [GetCharacter('(int32)52').GetPraenomen]'s audience with envoys from envoys #E Kassandros#! and #E Lysimachos#! have reached [GetCharacter('(int32)37').GetPraenomen]'s ears. They request the presence of Mithridates Ktistes at [GetCharacter('(int32)37').GetName]'s court. Though framed as a gesture of friendship and alliance, it is evident that [GetCharacter('(int32)37').GetPraenomen] seeks to secure #E Ktistes#! as a hostage to guarantee the loyalty of [GetCharacter('(int32)52').GetName].\n\nThe request places [GetCharacter('(int32)52').GetName] in a precarious position. With age weighing heavily, the matter of succession is of the utmost importance. #E Ktistes#! is [GetCharacter('(int32)52').GetPraenomen]'s nephew and heir. It is uncertain whether [GetCharacter('(int32)37').GetPraenomen] would allow Mithridates Ktistes to inherit his uncle's lands should he perish whilst #E Ktistes#! was away. Yet refusal may provoke the ire of [GetCharacter('(int32)37').GetPraenomen], placing both the dynasty and its people in jeopardy. There is no question that the Mithridatid dynasty must endure at any cost, but how?"  <None>  #NT!
 pontus_startup.3.desc_1: "The [GetCountry('PRY').GetAdjective] envoys have arrived, bringing a message from [GetCharacter('(int32)37').GetName] cloaked in polite rhetoric but its true intent is unmistakable. Rumors of [GetCharacter('(int32)52').GetPraenomen]'s audience with envoys from envoys #E Kassandros#! and #E Lysimachos#! have reached [GetCharacter('(int32)37').GetPraenomen]'s ears. They request the presence of Mithridates Ktistes at [GetCharacter('(int32)37').GetName]'s court. Though framed as a gesture of friendship and alliance, it is evident that [GetCharacter('(int32)37').GetPraenomen] seeks to secure #E Ktistes#! as a hostage to guarantee the loyalty of [GetCharacter('(int32)52').GetName].\n\nHowever, as a sign of good faith, [GetCharacter('(int32)52').GetPraenomen] will be named Satrap of #E Hellespontine Phrygia#! and expected to take up residence in Daskyleion. The request places [GetCharacter('(int32)52').GetName] in a precarious position. With age weighing heavily, the matter of succession is of the utmost importance. #E Ktistes#! is [GetCharacter('(int32)52').GetPraenomen]'s nephew and heir. It is uncertain whether [GetCharacter('(int32)37').GetPraenomen] would allow Mithridates Ktistes to inherit his uncle's lands should he perish whilst #E Ktistes#! was away. Yet refusal may provoke the ire of [GetCharacter('(int32)37').GetPraenomen], placing both the dynasty and its people in jeopardy. There is no question that the Mithridatid dynasty must endure at any cost, but how?"  <None>  #NT!
 pontus_startup.3.a: "A most welcome offer"  <None>  #NT!
 pontus_startup.3.at: "#E #R (Ahistorical)#!#!\n$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_1$#!' will be #R unavailable#! until the #E Fourth War of the Diadochi#! concludes"  <None>  #NT!
 pontus_startup.3.a1t: "#E Hellespontine Phrygia#! will gain all Antigonid land in the Areas of #Y $mysia_abrettene_area$#!, #Y $mysia_area$#!, as well as in the Region of #Y $bithynia_region$#!"  <None>  #NT!
 pontus_startup.3.b: "Send Mithridates to [GetCharacter('(int32)37').GetPraenomen]'s court."  <None>  #NT!
 pontus_startup.3.bt: "#E #R (Ahistorical)#!#!\n$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_1$#!' will be #R unavailable#! until the #E Fourth War of the Diadochi#! concludes"  <None>  #NT!
 pontus_startup.3.c: "Ktistes will be safe in Mariandynia."  <None>  #NT!
 pontus_startup.3.ct: "#E #G (Historical)#!#!\n#R [GetCharacter('(int32)52').GetName] may not be so safe#!\n$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_1$#!' will be #G available#! in the coming weeks"  <None>  #NT!
