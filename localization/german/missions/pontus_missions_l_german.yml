 pontus_kingdom_missions_task_1_tt: "[GetCharacter('(int32)52').GetName] wird sich mit [GetCharacter('(int32)37').GetName] beraten, um zu versuchen, die Position von [mission_country.GetName] zu stärken."
 pontus_kingdom_missions_task_2_tt: "Nach dem Tod von [GetCharacter('(int32)52').GetName] ist [GetProvince('(int32)245').GetName] für das Volk von [GetCharacter('(int32)52').GetFamily.GetName] nicht länger sicher. Es ist an der Zeit, sich auf die Suche nach grüneren Weiden zu machen …"
