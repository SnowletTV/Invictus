 #Events 
 pontus_startup.1.t: "Könige von Kios"
 pontus_startup.1.desc: "Die Familie [GetCharacter('(int32)52').GetFamily.GetNameWithNoTooltip] hat viele Jahre über [GetProvince('(int32)245').GetNameWithNoTooltip] geherrscht und es gab noch nie eine so schwere Zeit für unser Volk wie jetzt.\n\nMit dem Tod Alexanders fiel unser Königreich unter die Herrschaft von [GetCharacter('(int32)37').GetNameWithNoTooltip], der am Rande einer Niederlage gegen die anderen sogenannten Diadochen steht. Werden wir nur eine weitere Schachfigur im Spiel der Mazedonier sein oder wird unsere Nation unter der Herrschaft der Könige von [GetCharacter('(int32)52').GetFamily.GetNameWithNoTooltip] wieder gedeihen?\n\nNur die Zeit wird es zeigen, im Moment ist [GetCharacter('(int32)52').GetNameWithNoTooltip] entschlossen, dafür zu sorgen, dass Kios ein unabhängiger Staat bleibt, und ist mit einer kleinen Gruppe von Männern an den Hof von [GetCharacter('(int32)37').GetNameWithNoTooltip] gegangen, um zu versuchen, für unsere großartige Stadt einzutreten."
 pontus_startup.1.a: "Wir können nur auf das Beste hoffen..."
 pontus_startup.1.at: "#G Envoys from  @[GetCountry('MAC').GetFlag]!  [GetCountry('MAC').GetCapital.GetName|Y] and @[GetCountry('TRE').GetFlag]!  [GetCountry('TRE').GetCapital.GetName|Y] will meet [GetCharacter('(int32)52').GetPraenomen] in #E Kios#! within the coming weeks#!"  <None>  #NT!
 # pontus_startup.1.at: "#R An  @[GetCountry('PRY').GetFlag]!  [GetCountry('PRY').GetAdjective|Y] embassy will arrive in [THIS.GetCountry.GetCapital.GetName] within the coming weeks#!"  <None>  #NT!
  
 pontus_startup.2.t: "An Enticing Offer"  <None>  #NT!
 pontus_startup.2.desc: "As the sun set over [THIS.GetCountry.GetCapital.GetName], the long-awaited envoys from #E Kassandros#! and #E Lysimachos#! arrived, their robes dusted with the wear of a hurried journey. They brought grim news and a tempting proposition. 'Antigonos is doomed. He will doubtless fall before the might of our combined arms. But if you, [GetCharacter('(int32)52').GetName], choose to side with us, your loyalty will not go unrewarded.' Lysimachus would name [GetCharacter('(int32)52').GetName] as Satrap of #E Hellespontine Phrygia#!, a title tied to the seat of Daskyleion. This province, once governed by the great Artabazos, has not had satrap since Polemaios was slain and Phoenix of Tenedos was relieved of his command. Though the title would do little to change [GetCharacter('(int32)52').GetName]'s actual position, it would confer much-needed legitimacy to the Mithridatid dynasty and provide political unity to their holdings in Mysia and Mariandynia. Think carefully about the future of the [GetCharacter('(int32)52').GetFamily.GetName] house before you make a decision.'"  <None>  #NT!
 pontus_startup.2.a: "Hellespontine Phrygia shall be mine!"  <None>  #NT!
 pontus_startup.2.at: "#E #R (Ahistorical)#!#!\n$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_1$#!' will be #R unavailable#! until the #E Fourth War of the Diadochi#! concludes"  <None>  #NT!
 pontus_startup.2.at1: "[THIS.GetCountry.GetName] will receive formerly @[GetCountry('PRY').GetFlag]!  [GetCountry('PRY').GetAdjective|Y] lands in Mysia Inferioris and Mysia Superioris should @[GetCountry('TRE').GetFlag]!  [GetCountry('TRE').GetName|Y] prove victorious against the  @[GetCountry('PRY').GetFlag]!  [GetCountry('PRY').GetAdjective|Y]#Y s#! in the #E Fourth War of the Diadochi#!"  <None>  #NT!
 pontus_startup.2.b: "A change in title is not necessary."  <None>  #NT!
 pontus_startup.2.bt: "#E #R (Ahistorical)#!#!\n$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_1$#!' will be #R unavailable#! until the #E Fourth War of the Diadochi#! concludes"  <None>  #NT!
 pontus_startup.2.c: "Perhaps the Antigonids have a better offer?"  <None>  #NT!
 pontus_startup.2.ct: "#E #G (Historical)#!#!\n#R An  @[GetCountry('PRY').GetFlag]!  [GetCountry('PRY').GetAdjective|Y] embassy will arrive in the port city of #E Kios#! within the coming weeks#!"  <None>  #NT!
