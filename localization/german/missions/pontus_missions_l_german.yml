 cde_me_pon_protector_of_hellenes: "Beschützer der Griechen"
 cde_me_pon_paphlagonian_ancestral_lands: "Ahnenland"
 desc_cde_me_pon_paphlagonian_ancestral_lands: "Paphlagonien ist das angestammte Land der Mithridatiden. Seine Eingliederung in das Königreich war daher ein Segen für die einheimischen Paphlagonier, die von den örtlichen mithridatidischen Gouverneuren als Gleichgestellte behandelt wurden."
 cde_me_pon_land_of_the_golden_fleece: "Land des Goldenen Vlieses"
 desc_cde_me_pon_land_of_the_golden_fleece: "Kolchis war für die Griechen schon lange ein Ort voller Geheimnisse und Ehrfurcht, da es das Land war, in dem sich das Goldene Vlies befand. Nun sind wir der erste hellenistische Staat, der tatsächlich ganz Kolchis erobert hat."
 cde_me_pon_developed_emporion: "Emporion entwickelt"
 desc_cde_me_pon_developed_emporion: "Wir haben auf den Grundlagen aufgebaut, die die Griechen in Kolchis gelegt haben, um aus dieser Stadt ein florierendes Handelszentrum zu machen."
 cde_me_pon_tribes_appeased: "Beschwichtigte Stämme"
 desc_cde_me_pon_tribes_appeased: "In Kolchis werden Hunderte verschiedener Sprachen gesprochen. Daher ist es besonders beeindruckend, dass wir alle Stämme von Kolchis auf die eine oder andere Weise besänftigt haben."
 cde_me_pon_pontic_protectorship: "Pontische Protektorschaft"
 desc_cde_me_pon_pontic_protectorship: "Wir sind in Taurica als Beschützer der Griechen von Taurica eingegriffen und haben ihnen den lang ersehnten Frieden und die Sicherheit vor den Barbarenstämmen im Norden gebracht."
 cde_me_pon_secure_pontic_trade: "Sicherer Handel"
 desc_cde_me_pon_secure_pontic_trade: "Durch den Schutz des Pontischen Königreichs wurde der Handel in den Handelszentren sicherer, und Händler konnten die Stadt betreten und verlassen, ohne sich vor Piraterie und Überfällen der Barbaren fürchten zu müssen."
 cde_me_pon_pontic_neapolis: "Pontisches Neapolis"
 cde_me_pon_theodosian_trade: "Königliches Sponsoring"
 cde_me_pon_scythian_nobles_disciplined: "Disziplinierte skythische Adlige"
 cde_me_pon_dedications_to_parthenos: "Widmungen an Parthenos"
 cde_me_pon_temples_to_local_cults: "Tempel für lokale Kulte"
 desc_cde_me_pon_temples_to_local_cults: "Wir haben den Bau von Tempeln und Schreinen für lokale Kulte gefördert, beispielsweise den besonders beliebten Parthenos-Kult unter den Menschen von Taurica."
