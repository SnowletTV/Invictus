 scandinavia_main_mission_4_tt: "Mindestens #E #Y 50 %#!#! der Region [GetProvince('(int32)6010').GetArea.GetName|G] gehören #E [SCOPE.GetRootScope.GetCountry.GetName|T]#!." 
