 golden_yoke_treasure:0 "Das Goldene Joch"
 golden_yoke_treasure_desc:0 "Ein Zaumzeug, das selbst dem stärksten Ochsen gerecht wurde – es war einer der vier goldenen Gegenstände, die vom Himmel fielen und die Targitaos' Sohn Cloaxais an sich nahm, um Herrscher über den mächtigsten skythischen Stamm zu werden."
 golden_chalice_treasure:0 "Der Goldene Kelch"
 golden_chalice_treasure_desc:0 "Aus dem der Wein so reichlich fließt wie unverständliche Worte – dies war einer der vier goldenen Gegenstände, die vom Himmel fielen und die Targitaos' Sohn Cloaxais an sich nahm, um Herrscher über den mächtigsten skythischen Stamm zu werden."
 golden_plough_treasure:0 "Der Goldene Pflug"
 golden_plough_treasure_desc:0 "Das Werkzeug zum Bestellen des Bodens – dies war einer der vier goldenen Gegenstände, die vom Himmel fielen und die Targitaos' Sohn Cloaxais an sich nahm, um Herrscher über den mächtigsten skythischen Stamm zu werden."
 golden_axe_treasure:0 "Die Goldene Streitaxt"
 golden_axe_treasure_desc:0 "Als unfehlbare Waffe eines Feldherrn war dies einer der vier goldenen Gegenstände, die vom Himmel fielen und die Cloaxais, der Sohn des Targitaos, an sich nahm, um Herrscher über den mächtigsten skythischen Stamm zu werden."
 claim_blood_of_ateas:0 "Nachfolger von Ateas"
 claim_blood_of_ateas_desc:0 "Ateas war ein skythischer König, der die skythischen Stämme vereinte und dann 339 v. Chr. in der Schlacht gegen Philipp von Makedonien fiel. Nun, viele Jahrzehnte später, können wir mit Fug und Recht behaupten, seine Nachkommen zu sein. Endlich ist sein Reich wieder vereint. \n\nNur noch sehr wenige bestreiten heute, dass [ROOT.GetCountry.GetRuler.GetName] aus dem Geschlecht des Ateas stammt."
