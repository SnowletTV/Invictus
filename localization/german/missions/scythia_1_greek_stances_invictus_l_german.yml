  desc_me_scy_1_5_pmod: "Diese Region ist bei Siedlern beliebt, die hierherziehen und ein neues Leben beginnen möchten."
  me_scy_1_5a_pmod:0 "Religiöse Partner"
  desc_me_scy_1_5a_pmod:0 "Wir haben heidnische Praktiken innerhalb unserer Grenzen angeprangert."
  me_scy_1_5b_pmod:0 "Zufluchtsort für Traditionalisten"
  desc_me_scy_1_5b_pmod:0 "Wir haben heidnische Bräuche innerhalb unserer Grenzen angeprangert."
  me_scy_1_6_cmod:0 "Verlassene Stammeswege"
  desc_me_scy_1_6_cmod:0 "Neue Gesetze und eine aktive Regierungspräsenz ermutigen die Menschen, Wurzeln zu schlagen."
  me_scy_1_18_cmod:0 "Sklavenrausch"
  desc_me_scy_1_18_cmod:0 "Eine Flut neuer Sklavenkäufe hat zu einer erhöhten Sklavenwirtschaft und schlechteren Arbeitsbedingungen für die Sklaven selbst geführt."
  me_scy_1_6a_pmod:0 "Neuer religiöser Kult"
  desc_me_scy_1_6a_pmod:0 "Ein neuer Kult wurde gegründet."
  me_scy_1_6b_pmod:0 "Aufgeregte örtliche Priesterschaft"
  desc_me_scy_1_6b_pmod:0 "Unsere Handlungen haben die heiligen Männer hier beleidigt, die jetzt Unruhe stiften."
  me_scy_1_7_pmod:0 "Ausländische Verwalter"
  desc_me_scy_1_7_pmod:0 "Wir haben ausländische Experten angeworben, um bei der Verwaltung dieser Provinz zu helfen."
  me_scy_1_180_cmod:0 "Adlige besänftigt"
  desc_me_scy_1_180_cmod:0 "Die jüngste Einschränkung der Privilegien unliebsamer Untertanen hat dazu geführt, dass die Adligen am Hof sowohl sagenhaft reich als auch dem Staat gegenüber verschuldet sind."
  me_scy_1_19_cmod:0 "Kavallerie-Austausch"
  desc_me_scy_1_19_cmod:0 "Die Einbindung von Reitern aus anderen Kulturen als der unseren sowie der Austausch von Techniken und Methoden haben zu einer allgemeinen Steigerung der Schlagkraft unserer Kavallerie geführt."
  me_scy_1_21_cmod:0 "Empörte Untertanen"
  desc_me_scy_1_21_cmod:0 "Die kürzliche Plünderung des Landes unseres Untertanen hat die Federn von mehr als ein paar Eliten zerzaust. Wir sollten in absehbarer Zeit keine Wärme von ihnen erwarten."
  me_scy_1_22_cmod:0 "Überfalltrupps"
  desc_me_scy_1_22_cmod:0 "Nach den jüngsten Plünderungen sind unsere Überfallkommandos mit Beute überhäuft und gieren nach mehr."
  me_scy_1_25_cmod:0 "Schnelle Reiter"
  desc_me_scy_1_25_cmod:0 "Unsere treuen Clanführer haben uns persönlich einige ihrer besten Reiter zur Verfügung gestellt. Sie werden hervorragende Befehlshaber für unsere Armeen sein."
  me_scy_1_26_cmod:0 "Belagerungskunst-Experimente"
  desc_me_scy_1_26_cmod:0 "Unser Volk war noch nie dafür bekannt, sich in der Belagerungskunst oder beim Sturm auf schwer befestigte Städte auszuzeichnen. Der einzige Weg, dies zu ändern, sind Übung und Ausprobieren."
  me_scy_1_27_1_pmod:0 "Produktive Bauernhöfe"
  desc_me_scy_1_27_1_pmod:0 "Diese Landzunge hat deutlich mehr Ertrag gebracht als erwartet! Die Götter sind uns wohlgesonnen."
  me_scy_1_27_2_pmod:0 "Produktive Herden"
  desc_me_scy_1_27_2_pmod:0 "Das Vieh, das hier weidet, ist in der Regel gesünder und pflanzt sich leichter fort als an anderen Orten."
  me_scy_1_28_cmod:0 "Lust auf Luxus"
  desc_me_scy_1_28_cmod:0 "Das Verlangen unserer Bevölkerung nach den schönen Dingen des Lebens scheint von Tag zu Tag zu wachsen, was die Preise für Waren entsprechend in die Höhe treibt."
  me_scy_1_28_pmod:0 "Jubelnde Hauptstadt"
  desc_me_scy_1_28_pmod:0 "Da mehr Waren denn je in unsere Hauptstadt strömen, ist es kein Wunder, dass scheinbar alle gut gelaunt sind."
  me_scy_1_32a_cmod:0 "Unbeständige Führung"
  desc_me_scy_1_32a_cmod:0 "Unser Volk wird unserer Launenhaftigkeit überdrüssig."
  me_scy_1_32b_cmod:0 "Starke Führung"
  desc_me_scy_1_32b_cmod:0 "Unser Volk wird unter unserer hartnäckigen Herrschaft ängstlich."
  me_scy_1_49_cmod: "Gestärktes Priestertum"
  desc_me_scy_1_49_cmod: "Unsere jüngsten Erfolge haben das Priestertum gestärkt.
  me_scy_1_53_cmod:0 "Zusagen des Clan-Oberhauptes"
  desc_me_scy_1_53_cmod:0 "Unsere jüngste Demonstration von Stärke und Engagement hat die mächtigen Clans für unsere Sache gewonnen."
  me_scy_1_89_cmod:0 "Der Aufstieg Skythiens"
  desc_me_scy_1_89_cmod:0 "Die Umstrukturierung unserer Regierung nach diesem neuen Modell ermöglicht eine bessere administrative Kontrolle als zuvor und bewahrt gleichzeitig unsere alten Bräuche."
