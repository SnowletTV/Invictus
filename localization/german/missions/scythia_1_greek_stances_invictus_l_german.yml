### Startup Event (Scythia)
 startup_events.9.t:0 "Der skythische Niedergang"
 startup_events.9.desc:0  "Vor nicht einmal fünfzig Jahren war das Land Skythien durch Handelsbeziehungen im Westen mit dem Meer jenseits der thrakischen Stämme verbunden und endete im Osten am Fluss, der die Grenze zum großen Pontos Euxinos markierte. Zu dieser Zeit führte ein großer König, der mächtige Ateas, unsere Reiter in einem gewaltigen Feldzug gegen alle bekannten Völker in allen vier Himmelsrichtungen. Und schon vor ihm war unser Volk als Eroberer und als das Volk bekannt, das die Kriege anderer beendete. Wir hatten uns bis zur alten Stadt Ninive am Ende des Assyrischen Reiches und bis zu den Medern im Osten ausgebreitet, und einst standen wir sogar vor den Toren des Pharaos Neko II., und er kauerte sich vor uns zusammen. Doch all das endete, als Philipp II. von Makedonien Ateas schließlich in hohem Alter stellte und ihn in der Schlacht auf den Ebenen von Kleinskythien töten ließ. Seit diesem Moment sind wir geschwächt, unsere Grenzen sind geschrumpft, und unser Volk hat sich auf die Taurische Halbinsel zurückgezogen, während die hellenistische Welt und rivalisierende Stämme uns immer enger einkreisen. Wir befinden uns auf Messers Schneide, und unser Volk weiß, dass unsere Zukunft ungewiss ist. Alles hängt von diesem Moment ab – davon, wie wir von hier aus weitermachen werden."
 startup_events.9.b:0 "Lasst uns unsere Geschichte zurückgewinnen!"

