l_german:

### MISSIONS 1.12 - Hephaestus 27.09.2026
 scythia_mission_01_greek_stance:0 "Unsere Haltung gegenüber den Griechen"
 scythia_mission_01_greek_stance_BUTTON_TOOLTIP:0 "Die skythischen Stämme des Nordens müssen sich mit dem wachsenden hellenischen Einfluss in ihren Gebieten auseinandersetzen."
 scythia_mission_01_greek_stance_BUTTON_DETAILS:0 ""
 scythia_mission_01_greek_stance_DESCRIPTION:0 "Unser Volk hat nach dem Tod des verstorbenen Königs Ateas durch die Hand Philipps II. von Makedonien eine Zeit des großen Niedergangs erlebt. Unsere Beziehungen zu den Griechen waren schon immer schwierig, doch nun betrachten einige unseres Volkes ihre Städte als Säulen der Stärke und Stabilität. Werden wir uns dem Wandel der Zeit anpassen oder unserem nomadischen Lebensstil treu bleiben, wie wir es seit unzähligen Generationen getan haben?"
 scythia_mission_01_greek_stance_CRITERIA_DESCRIPTION:0 "Die Mission gilt als abgeschlossen, sobald das skythische Volk sich entschieden hat, unseren überlieferten Traditionen zu folgen oder die hellenischen Bräuche vollständig anzunehmen."
 scythia_mission_01_greek_stance_REWARD_DESCRIPTION:0 "Reformiert die Regierung und verändert die gesellschaftliche Ausrichtung der skythischen Stämme."

 scythia_mission_01_greek_stance_task_1:0 "Grieche sein oder nicht sein"
 scythia_mission_01_greek_stance_task_1_DESC:0 "Unser ständiger Handel mit den griechischen Stadtstaaten und unsere nahen Grenzen sind am skythischen Volk nicht spurlos vorübergegangen. Fremder Einfluss scheint zahlreiche Aspekte unserer Stammesbräuche zu durchdringen. Es geht das Gerücht um, dass hellenische Riten in Zelten auf freiem Feld vollzogen werden und heimlich kleine Abbilder fremder Götter errichtet werden."
 scythia_mission_01_greek_stance_task_2:0 "Sie werden sich uns anschließen"
 scythia_mission_01_greek_stance_task_2_DESC:0 "Nachdem wir uns entschieden haben, den hellenischen Einfluss der griechischen Städte auf unser Volk anzunehmen, müssen wir unsere Beziehung zu ihnen nun vollenden."
 scythia_01_greek_stance_2_reward.tt:0 "Wir können nun einem der beiden Missionspfade folgen."
 scythia_mission_01_greek_stance_task_3:0 "Handel erfordert Häfen"
 scythia_mission_01_greek_stance_task_3_DESC:0 "Wenn wir mit den griechischen Städten um Handel und Macht auf dem Meer konkurrieren wollen, brauchen wir einen großen Hafen, in dem Handelsschiffe anlegen können, sowie einen Markt, auf dem sie ihre Waren verkaufen können."
 scythia_mission_01_greek_stance_task_4:0 "Aneinandergeraten mit den Bosporanern"
 scythia_mission_01_greek_stance_task_4_DESC:0 "Wir haben die Grundfesten einer großen Hafenstadt und bald auch für ein Handelsimperium gelegt. Doch das Bosporanische Königreich, der derzeitige Herrscher über die weiten Gewässer, stellt eine allgegenwärtige Bedrohung dar. Das Wasser brodelt und Spannung liegt in der Luft..."
 scythia_mission_01_greek_stance_task_5:0 "Skythische Pentapolis"
 scythia_mission_01_greek_stance_task_5_DESC:0 "Dicht gedrängte Hütten und Wagenzüge können nicht mit den Griechen konkurrieren. Wir müssen handeln; wir müssen gedeihen; wir müssen Städte errichten!"
 scythia_01_greek_stance_5_reward.tt:0 "Nach Abschluss werden wir neue Städte in der Region Taurika errichten."
 scythia_mission_01_greek_stance_task_6:0 "Die Stammesbräuche aufgeben"
 scythia_mission_01_greek_stance_task_6_DESC:0 "Wenn wir die griechischen Staaten nachahmen wollen, müssen wir die Stammesstrukturen ablegen, die uns zurückhalten. Der Staat muss stark sein und das Volk muss sich in unseren Landen sowohl militärisch als auch wirtschaftlich sicher fühlen."
 scythia_mission_01_greek_stance_task_7:0 "Die Griechen einladen"
 scythia_mission_01_greek_stance_task_7_DESC:0 "Wenn wir die griechische Lebensweise bestmöglich kennenlernen wollen, sollten wir Vorbilder in unseren eigenen Städten haben."
 scythia_01_greek_stance_7_reward.tt:0 "Nach Abschluss werden einige hellenische Pops in einer unserer Provinzen erscheinen."
 scythia_mission_01_greek_stance_task_8:0 "Den Hellenismus annehmen"
 scythia_mission_01_greek_stance_task_8_DESC:0 "Wir haben die Griechen in unseren Alltag gelassen, indem wir sie in unseren Städten leben lassen. Nun müssen wir sie auch in unsere Herzen lassen. Lassen wir die alten Bräuche im Angesicht der neuen vergehen.\n\nWir verlieren #R 30 Stabilität#!, wenn wir am Ende dieser Aufgabe unser Pantheon zum #Y Hellenisch#! umstellen."
 scythia_mission_01_greek_stance_task_9:0 "Alte Bande"
 scythia_mission_01_greek_stance_task_9_DESC:0 "Vor langer Zeit erzählte einer unseres Volkes den Griechen unsere größte Geschichte, die Geschichte von der Entstehung unseres Volkes. Doch als die Griechen die Taten unserer Götter sahen, erkannten sie darin die Namen ihrer eigenen Götter und schrieben diese Taten daher ihren Göttern zu, allen voran Herakles. Sie behaupten, er habe mit einem Wesen geschlafen, das halb Frau, halb Schlange war, und dass aus ihrer Verbindung der Erste unseres Stammes hervorgegangen sei. Vielleicht gibt es keinen Unterschied zwischen ihrer und unserer Version, und wenn wir schon Griechen sein sollen, dann glauben wir doch einfach, dass es so ist."
 scythia_mission_01_greek_stance_task_10:0 "Die Euxinischen Spiele abhalten"
 scythia_mission_01_greek_stance_task_10_DESC:0 "Da wir nun die griechischen Götter verehren, sollten wir unsere Anwesenheit auf der hellenischen Bühne stolz verkünden. Zu Ehren der Olympischen Spiele wollen wir an den Ufern des weiten Euxinus unsere eigenen Wettkämpfe für gleichgesinnte hellenische Nationen an den Ufern des weiten Euxinus abhalten."
 scythia_mission_01_greek_stance_task_11:0 "Den Basileus krönen"
 scythia_mission_01_greek_stance_task_11_DESC:0 "Der Moment ist gekommen. Wir haben die notwendigen Schritte unternommen, und es war ein langer Weg, doch nun können wir uns als ein hellenisches, gottesfürchtiges Volk betrachten, das nur noch Teile seines nomadischen Erbes bewahrt hat. Es ist daher nur folgerichtig, dass wir unter uns einen griechischen König krönen, den ersten skythischen Basileus."

 scythia_mission_01_greek_stance_task_12:0 "Sie werden sterben"
 scythia_mission_01_greek_stance_task_12_DESC:0 "Unser Volk hat gesprochen und wir haben die griechische Lebensweise abgelehnt. Nun müssen wir unsere Kontrolle über die Region ausweiten und den Fremden die wahre Stärke der skythischen Lebensweise beweisen!"
 scythia_01_greek_stance_12_reward.tt:0 "Wir können nun einem der beiden Missionspfade folgen."
 scythia_mission_01_greek_stance_task_13:0 "Das skythische Volk einen"
 scythia_mission_01_greek_stance_task_13_DESC:0 "Unser Volk muss mit einer Stimme sprechen, mit einer Hand beten und auf einem Pferd kämpfend den vergifteten Pfeil von einem einzigen Bogen schnellen lassen. So soll es geschehen."
 scythia_mission_01_greek_stance_task_14:0 "Die Griechen opfern"
 scythia_mission_01_greek_stance_task_14_DESC:0 "Wir müssen unsere Feinde den Göttern opfern, sie besänftigen und um gute Vorzeichen beten."
 scythia_mission_01_greek_stance_task_15:0 "Sie stehen unter uns"
 scythia_mission_01_greek_stance_task_15_DESC:0 "Die Griechen können nun nur noch unsere Feinde sein. Lasst uns sie dazu verleiten, törichterweise unsere Grenzen anzugreifen, damit wir ungehindert Krieg gegen sie führen können."
 scythia_mission_01_greek_stance_task_16:0 "Die Tyras schultern"
 scythia_mission_01_greek_stance_task_16_DESC:0 "Der Fluss Tyras wird eine neue Grenze unseres Herrschaftsgebiets bilden. Garnisonen auf unserer Seite des Flusses schützen unsere Flanken und unsere Reiter können ungestraft auf Raubzug gehen."
 scythia_mission_01_greek_stance_task_17:0 "Die taurischen Klippen"
 scythia_mission_01_greek_stance_task_17_DESC:0 "Die Tauri wurden von den Griechen bisweilen mit uns verwechselt. Vielleicht ließen sich diese meerliebenden Fremden unter unserer Herrschaft besser nutzen?"
 scythia_mission_01_greek_stance_task_18:0 "Sie können nur Sklaven sein"
 scythia_mission_01_greek_stance_task_18_DESC:0 "Was ist ein Bosporaner anderes als Ärger? Macht sie zu Sklaven und sie werden uns reich machen."
 scythia_mission_01_greek_stance_task_19:0 "Die große Horde"
 scythia_mission_01_greek_stance_task_19_DESC:0 "Wir haben genügend fähige Krieger, um die große Horde aufzustellen. Geht und ruft die wehrfähigen Männer und Frauen unter uns zusammen."
 scythia_mission_01_greek_stance_task_20:0 "Unwahrscheinliche Verbündete"
 scythia_mission_01_greek_stance_task_20_DESC:0 "Die Bosporaner haben sich bei unserer Eroberung der Region als mächtige Gegner erwiesen. Wir können sie vielleicht nicht allein bekämpfen, also müssen wir Verbündete finden. Wir werden einigen unserer Nachbarn diplomatische Angebote im Austausch für militärische Hilfe unterbreiten."
 scythia_mission_01_greek_stance_task_21:0 "Der Kimmerische Bosporus"
 scythia_mission_01_greek_stance_task_21_DESC:0 "Es ist an der Zeit, dass wir ganz Taurika beherrschen! Wie auch immer die Länder jenseits des Bosporus fallen mögen, jene auf dieser Seite sollen uns gehören."
 scythia_mission_01_greek_stance_task_22:0 "Ihre Städte niederbrennen"
 scythia_mission_01_greek_stance_task_22_DESC:0 "Griechen und Fremde werden unsere skythischen Heere fürchten und sich vor ihnen grauen. Zu lange haben sie sich hochmütig und herablassend verhalten. Wir werden ihnen eine Botschaft senden, die sie so schnell nicht vergessen werden."
 scythia_mission_01_greek_stance_task_23:0 "Ein zweites Goldenes Zeitalter"
 scythia_mission_01_greek_stance_task_23_DESC:0 "In ganz Taurika und Sarmatien haben die anderen Stämme und Nationen gelernt, unseren Befehl zu respektieren und unsere Heere zu fürchten. Ihre einst stolzen Städte liegen in Ruinen, während unsere eigene Hauptstadt gedeiht. Wir sind das aufstrebende Königtum Skythiens und werden für immer reiten!"
 scythia_mission_01_greek_stance_task_24:0 "Die Targitaos-Spiele"
 scythia_mission_01_greek_stance_task_24_DESC:0 "Lasst uns unsere Vorherrschaft über die Reiterfürsten der Welt festigen. Sendet die Boten aus und ruft alle Gruppen nah und fern dazu auf, über die sanften Hügel und durch die endlosen Ebenen in unser Land zu reisen, um an den großen Targitaos-Spielen zu Ehren unseres ersten Vaters teilzunehmen."
 scythia_mission_01_greek_stance_task_25:0 "Die Reiterfürsten bereitmachen"
 scythia_mission_01_greek_stance_task_25_DESC:0 "Wenn wir stärker werden und unsere Feinde erobern wollen, müssen wir eine große, unaufhaltsame Horde aufstellen."
 scythia_mission_01_greek_stance_task_26:0 "Die Mauern bemannen"
 scythia_mission_01_greek_stance_task_26_DESC:0 "Ob es nun vereinzelte Banden von Plünderern oder ein endloser Horizont voller Feinde sind, wir müssen uns darauf vorbereiten, uns zu schützen."
 missing_office_holder_scythia.tt:0 "Es scheint derzeit niemand dieses Amt innezuhaben."
 scythia_mission_01_greek_stance_task_27:0 "Aus unseren eigenen Händen"
 scythia_mission_01_greek_stance_task_27_DESC:0 "Um unsere große Horde zu versorgen, müssen wir mehr Nahrung erzeugen. Die Lande zwischen dem Großen Meer und der Steppe sind fruchtbar. Unsere Felder werden von jenen gepflügt werden, die nicht reiten können, und von unseren zahlreichen Sklaven."
 scythia_mission_01_greek_stance_task_28:0 "Luxusgüter sind Notwendigkeiten"
 scythia_mission_01_greek_stance_task_28_DESC:0 "Um unsere Expansion aufrechtzuerhalten, werden wir mehr Geld benötigen. Kauft die Waren der Griechen und unserer Nachbarvölker und bringt den Handel in unsere Häfen."


### MISSION EVENTS
  me_scythia_01_greek_stance.1.t:0 "$scythia_mission_01_greek_stance$: Identitätskrise"
  me_scythia_01_greek_stance.1.desc:0 "Wir hatten schon immer eine starke Verbindung zu den griechischen Städten an der Küste der Pontos Euxinos, im Guten wie im Schlechten. Wir können nicht so tun, als hätte diese Beziehung unsere Lebensweise, das Leben unseres eigenen Volkes, nicht beeinflusst. Aber jetzt ist die Zeit, in der wir entscheiden, wo wir stehen – wer wir sind."
  me_scythia_01_greek_stance.1.a:0 "Wohin die Herde auch geht, die Pferde folgen."
  me_scythia_01_greek_stance.2.t:0 "$scythia_mission_01_greek_stance$: Vermächtnis sichern"
  me_scythia_01_greek_stance.2.desc:0 "Die jüngsten Prüfungen haben unsere Entschlossenheit und unser Bekenntnis zur Zukunftsvision der Skythen auf die Probe gestellt. Wir haben gezeigt, dass wir uns weder beirren noch abschrecken lassen. Die Reiter des Nordens sind bereit, über unsere Grenzen hinauszuschauen und unsere ewigen Bräuche an andere weiterzugeben."
  me_scythia_01_greek_stance.2.a:0 "Der Weg ist für uns frei!"
  me_scythia_01_greek_stance.2.at:0 "Die Mission „#Y Grieche sein oder nicht sein#!“ wurde #G abgeschlossen#!!"
  me_scythia_01_greek_stance.4.t:0 "$scythia_mission_01_greek_stance_task_1$: Schwarzmeer-Sklavenhandel"
  me_scythia_01_greek_stance.4.desc:0 "Angesichts der schwierigen Wirtschaftslage müssen wir auf den Außenhandel setzen, um neuen Wohlstand zu schaffen. Die Griechen haben schon immer zwei Dinge von uns verlangt: Lebensmittel und Sklaven. Vor allem Letzteres ist ein lukratives Geschäft. Vielleicht eröffnen uns ein paar Sklaven mehr hier und da neue Handelsmöglichkeiten…"
  me_scythia_01_greek_stance.4.a:0 "Ja, die Münze zählt, egal woher sie kommt..."
  me_scythia_01_greek_stance.4.at:0 "Bis zu #Y 5#! Sklavenpops werden in verschiedene griechische Staaten umgesiedelt. #Y Skythien#! erhält Gold für jeden verkauften Sklaven. #Y 2#! hellenische bosporanische #Y Adlige #! erscheinen in [me_scythia_1_scope.GetCapital.GetName]"
  me_scythia_01_greek_stance.4.b:0 "Nein. Die Griechen haben uns genug Schaden zugefügt. Verflucht sind ihre unrechtmäßig erworbenen Gewinne."
  me_scythia_01_greek_stance.4.bt:0 "Bis zu #Y 5#! heptadische skythische #Y Stammesangehörigen#! Pops erscheinen in [me_scythia_1_scope.GetCapital.GetName]. Der Hafen von #Y Taphros#! erhält #Y verfallener Hafen#! für #Y 120#! Monate."
  me_scythia_01_greek_stance.5.t:0 "$scythia_mission_01_greek_stance_task_1$: Bacchische Riten"
  me_scythia_01_greek_stance.5.desc:0 "Es gab Gerüchte, dass einige unserer Leute in der Nacht ins olbische Gebiet geeilt seien, um einen gotteslästerlichen  hellenischen Ritus durchzuführen. Das war früher – jetzt missachtet unser Volk offen die alten Wege. Gruppen von Männern und Frauen reisen dreist am helllichten Tag in die griechische Stadt, um Opfergaben darzubringen. Was ist zu tun?"
  me_scythia_01_greek_stance.5.a:0 "Der Wille des Volkes will es so – es sind zu viele, als dass man sich dagegen wehren könnte. Lasst sie gehen."
  me_scythia_01_greek_stance.5.at:0 "Bis zu #Y 3#! heptadische Bürgerpops konvertieren zum #Y Hellenismus#! und werden in das Gebiet von #Y Ektonopolis#! ziehen."
  me_scythia_01_greek_stance.5.b:0 "Sie sind keine Skythen, die auf unsere Götter spucken. Behandlet sie so, wie wir alle Fremden behandeln."
  me_scythia_01_greek_stance.5.bt:0 "Bis zu #Y 3#! heptadische Bürgerpops konvertieren zum #Y Hellenismus#! und werden in das Gebiet von #Y Olbia#! ziehen."
  me_scythia_01_greek_stance.6.t:0 "$scythia_mission_01_greek_stance_task_1$: Herakleischer Targitaos"
  me_scythia_01_greek_stance.6.desc:0 "Unser Magistrat, [SCOPE.sChar('current_magistrate').GetName], ging seinen Pflichten nach und sammelte Tribute von allen Leuten unter eurer Herrschaft, als es spät wurde und er einen Zug von Leuten bemerkte, die in den Wald gingen. Dort fand er einen Schrein, nicht einen, der für unsere Götter gebaut wurde, sondern eine griechische Perversion des geliebten Targitaos. Was soll getan werden?"
  me_scythia_01_greek_stance.6.a:0 "Es ist klar, dass unser Volk die griechische Lebensweise annehmen und gleichzeitig die alten Götter ehren möchte."
  me_scythia_01_greek_stance.6.at:0 "Die #Y Hellenische#! Gottheit #Y Herakleischer Targitaos#! ist nun verfügbar. Eine #Y Heilige Stätte#! des #Y Herakleischen Targitaos#! wird im Gebiet von #Y Uttar#! errichtet."
  me_scythia_01_greek_stance.6.b:0 "Schickt bei Tagesanbruch eine Gruppe von Reitern los – nehmt alles Wertvolle und brennt den Rest nieder."
  me_scythia_01_greek_stance.7.t:0 "$scythia_mission_01_greek_stance_task_1$: Ein neuer Weg"
  me_scythia_01_greek_stance.7.desc_1:0 "Wir haben durch unsere jüngsten Prüfungen viele neue Dinge verstanden. Wir müssen der Tradition treu bleiben, sonst verlieren wir unsere Identität."
  me_scythia_01_greek_stance.7.desc_2:0 "Durch unsere jüngsten Erfahrungen haben wir vieles Neues gelernt. Vielleicht war es falsch, dass wir so sehr an unseren alten Idealen festhielten, und wir sollten uns lieber auf die neue Welt um uns herum einlassen, indem wir den größeren Herden folgten."
  me_scythia_01_greek_stance.7.a:0 "Das griechische Modell ist es."
  me_scythia_01_greek_stance.7.at:0 "Neue Missionsaufgaben sind verfügbar!"
  me_scythia_01_greek_stance.7.b:0 "Wir werden es wie unsere Vorfahren handhaben."
  me_scythia_01_greek_stance.7.bt:0 "Neue Missionsaufgaben sind verfügbar!"
  me_scythia_01_greek_stance.8.t:0 "$scythia_mission_01_greek_stance_task_3$: Es ist ein Anfang"
  me_scythia_01_greek_stance.8.desc:0 "Was einst eine leere Küstenlinie war, ist heute ein sicherer Hafen für diejenigen, die Waren und Münzen transportieren. Er ist noch nicht vergleichbar mit den vielen Hafenstädten entlang des großen Meeres im Süden, aber eines Tages könnte dieser Fluss etwas Größeres sein, kein Gewässer, sondern ein Strom von Schiffen."
  me_scythia_01_greek_stance.8.a:0 "Lasst die ersten Schiffe andocken und beginnt mit dem Entladen."
  me_scythia_01_greek_stance.10.t:0 "$scythia_mission_01_greek_stance_task_2$: Bindungen zu Tyras" 
  me_scythia_01_greek_stance.10.desc:0 "Ah, Tyras, der große Bruder von Nikonion, ein bedeutender Hafen am gleichnamigen Fluss. Wir haben diese griechische Stadt in unserer vergangenen Verachtung der Griechen oft ignoriert. Aber es ist ein neuer Tag, und wir müssen uns um bessere Beziehungen zu ihnen bemühen, um Zugang zu den Reichtümern zu erhalten, die auf dieser Wasserstraße transportiert werden."
  me_scythia_01_greek_stance.10.a:0 "Wir werden diese neuen Freunde als Verbündete sehen und uns über unser ebenso vorteilhaftes Arrangement freuen."
  me_scythia_01_greek_stance.10.bt:0 "#Y Tyras#! kann ein #Y Verbündeter#! werden."
  me_scythia_01_greek_stance.10.b:0 "Wir werden ein freundliches Gesicht aufsetzen und ihnen helfen."
  me_scythia_01_greek_stance.10.at:0 "#Y Tyras#! kann ein #Y Klientelstaat#! werden."
  me_scythia_01_greek_stance.10.c:0 "Lasst uns ein Zeichen der Freundschaft senden, mehr nicht."
  me_scythia_01_greek_stance.10.ct:0 "#Y Tyras#! wird unsere Annäherungsversuche wahrscheinlich zurückweisen."
  me_scythia_01_greek_stance.11.t:0 "$scythia_mission_01_greek_stance_task_2$: Verbindungen zu Olbia"
  me_scythia_01_greek_stance.11.desc:0 "Olbia, ein lange vernachlässigter Bruder unseres Volkes. War es nicht Skyles, der sie für gut genug hielt, innerhalb ihrer Stadtmauern ein Heim zu erwerben? Sie haben oft unser Getreide und unsere Waren gekauft und diese auf offener See weiterverkauft. Vielleicht ist es an der Zeit, dass wir sie als festen Partner anerkennen."
  me_scythia_01_greek_stance.11.a:0 "Wir werden ihnen unsere begehrteste Ware – Sklaven – zum Preis eines Verbündeten verkaufen."
  me_scythia_01_greek_stance.11.at:0 "Bis zu #Y 5#! Sklavenpops ziehen nach #Y Olbia#! im Rahmen eines Handelsabkommens. #Y Skythien#! erhält #G 25#! Gold für jede auf diese Weise bewegten Pop. #Y Olbia#! kann ein #Y Verbündeter#! werden."
  me_scythia_01_greek_stance.11.b:0 "Lasst uns dem alten Skyles nacheifern, den die Griechen so schätzten, und in sie und ihre Stadt investieren."
  me_scythia_01_greek_stance.11.bt:0 "#Y Olbia#! kann ein #Y Klientelstaat#! werden."
  me_scythia_01_greek_stance.11.c:0 "Lasst uns ein Zeichen der Freundschaft senden, mehr nicht."
  me_scythia_01_greek_stance.11.ct:0 "#Y Olbia#! wird unsere Annäherungsversuche wahrscheinlich zurückweisen"
  me_scythia_01_greek_stance.12.t:0 "$scythia_mission_01_greek_stance_task_2$: Bindungen mit Chersonesus"
  me_scythia_01_greek_stance.12.desc:0 "Die Taurer sind ein seltsames Volk, das mal von den Griechen beherrscht wird und mal ihr Joch abschüttelt. Die Stadt Chersonesos versucht, sie unter Kontrolle zu halten, doch man kann sich nie ganz sicher sein, vor allem da der Hafen von Kalos Limen so oft Piraten ausschickt, um griechische Schiffe zu zerstören. Vielleicht können wir sie zu unserem Vorteil nutzen, um uns Chersonesos anzunähern."
  me_scythia_01_greek_stance.12.a:0 "Wir werden die Aufstände der Taurer niederschlagen und Chersonesos eine Abteilung unserer eigenen Reiter zur Verfügung stellen."
  me_scythia_01_greek_stance.12.at:0 "#Y Bis zu 4 Territorien werden von skythischen Patrouillen gesichert#! #Y Chersonesos#! könnte ein Verbündeter werden."
  me_scythia_01_greek_stance.12.b:0 "Die Flotte der Taurer kann für uns von Nutzen sein. Wir sollten den Eindruck erwecken, als würden wir der griechischen Stadt eine Last abnehmen."
  me_scythia_01_greek_stance.12.bt:0 "#Y Kalos Limen#! wird übertragen. #Y Chersonesus#! könnte zu einem Vasallenstaat werden. #Y Skythien#! könnte eine Piratenflotte der Taurer erhalten."
  me_scythia_01_greek_stance.12.c:0 "Machen wir ihnen leere Versprechungen. Vielleicht können wir sie allein durch unsere Macht überzeugen."
  me_scythia_01_greek_stance.12.ct:0 "#Y Chersonsesus#! wird unsere Annäherungsversuche wahrscheinlich zurückweisen"
  me_scythia_01_greek_stance.13.t:0 "$scythia_mission_01_greek_stance_task_2$: Bote aus Skythien"
  me_scythia_01_greek_stance.13.desc:0 "Gesandte des skythischen Volkes sind eingetroffen und überbringen eine Botschaft ihres Herrschers."
  me_scythia_01_greek_stance.13.desc_1:0 "\nSie bieten uns große Mengen an Silber und Gold an, um uns für ihre Sache zu gewinnen. Ihr Herrscher ist auf der Suche nach militärischen Verbündeten und Handelspartnern."
  me_scythia_01_greek_stance.13.desc_2:0 "\nSie bieten uns eine gewisse Menge Silber an, um uns für ihre Sache zu gewinnen. Ihr Herrscher ist auf der Suche nach militärischen Verbündeten und Handelspartnern."
  me_scythia_01_greek_stance.13.desc_3:0 "\nObwohl ihre Worte süß sind, bieten sie wenig Geschenke oder Bestechungsgelder an."
  me_scythia_01_greek_stance.13.a:0 "Es schmerzt mich, das zu sagen, aber wir könnten in diesen gefährlichen Zeiten ihren Schutz gebrauchen. Lieber mit ihnen als gegen sie."
  me_scythia_01_greek_stance.13.at:0 "#Y Tyras#! wird zu einem #Y Klientelstaat#! von #Y Skythien#!."
  me_scythia_01_greek_stance.13.b:0 "Vielleicht wird ein Militärbündnis sie besänftigen und uns im Gegenzug Vorteile bieten?"
  me_scythia_01_greek_stance.13.bt:0 "#Y Tyras#! wird ein #Y Verbündeter#! von #Y Skythien#!."
  me_scythia_01_greek_stance.13.c:0 "Wir werden ihnen nichts anbieten."
  me_scythia_01_greek_stance.13.ct:0 "Die Diplomaten sind enttäuscht und ihr Herrscher möglicherweise beleidigt."
  me_scythia_01_greek_stance.14.t:0 "$scythia_mission_01_greek_stance_task_2$: Bote aus Skythien"
  me_scythia_01_greek_stance.14.desc:0 "Gesandte des skythischen Volkes sind eingetroffen und überbringen eine Botschaft ihres Herrschers."
  me_scythia_01_greek_stance.14.desc_1:0 "\nSie bieten uns eine beträchtliche Anzahl von Sklaven an, um uns für ihre Sache zu gewinnen. Ihr Herrscher sucht nach militärischen Verbündeten und Handelspartnern."
  me_scythia_01_greek_stance.14.desc_2:0 "\nSie bieten uns große Mengen an Silber und Gold an, um uns für ihre Sache zu gewinnen. Ihr Herrscher ist auf der Suche nach militärischen Verbündeten und Handelspartnern."
  me_scythia_01_greek_stance.14.desc_3:0 "\nObwohl ihre Worte süß sind, bieten sie wenig Geschenke oder Bestechungsgelder an."
  me_scythia_01_greek_stance.14.a:0 "Um unser Überleben zu sichern, müssen wir Vasallentum akzeptieren. Schicken Sie ihnen einen Berater, um zu sehen, ob unsere Interessen vorangetrieben werden."
  me_scythia_01_greek_stance.14.at:0 "#Y Olbia#! wird zu einem #Y Klientelstaat#! von #Y Skythien#!."
  me_scythia_01_greek_stance.14.b:0 "Vielleicht wird ein Militärbündnis sie besänftigen und uns im Gegenzug Vorteile bieten?"
  me_scythia_01_greek_stance.14.bt:0 "#Y Olbia#! wird ein #Y Verbündeter#! von #Y Skythien#!."
  me_scythia_01_greek_stance.14.c:0 "Wir werden ihnen nichts anbieten."
  me_scythia_01_greek_stance.14.ct:0 "Die Diplomaten sind enttäuscht und ihr Herrscher möglicherweise beleidigt."
  me_scythia_01_greek_stance.15.t:0 "$scythia_mission_01_greek_stance_task_2$: Bote aus Skythen"
  me_scythia_01_greek_stance.15.desc:0 "Abgesandte der skythischen Nation sind eingetroffen und haben eine Botschaft ihres Herrschers überbracht."
  me_scythia_01_greek_stance.15.desc_1:0 "\nSie haben uns eine Reihe ihrer Reiter zur Verfügung gestellt, damit wir unser Land besser überwachen und die einheimischen Taurer unter Kontrolle halten können. Im Gegenzug verlangen sie militärische Hilfe."
  me_scythia_01_greek_stance.15.desc_2:0 "\nSie bieten uns eine große Menge Silber und Gold an, um uns für ihre Sache zu gewinnen. Ihr Herrscher sucht nach militärischen Verbündeten und Handelspartnern."
  me_scythia_01_greek_stance.15.desc_3:0 "\nObwohl ihre Worte süß sind, bieten sie wenig Geschenke oder Bestechungsgelder an."
  me_scythia_01_greek_stance.15.a:0 "Wir dürfen uns die Skythoi nicht zum Feind machen. Bieten wir ihnen die Lehnstreue an und schicken wir ihnen ein paar Boote."
  me_scythia_01_greek_stance.15.at:0 "#Y Chersones#! wird zu einem #Y Klientelstaat#! von #Y Skythien#!."
  me_scythia_01_greek_stance.15.b:0 "Vielleicht wird ein Militärbündnis sie besänftigen und uns im Gegenzug Vorteile bieten?"
  me_scythia_01_greek_stance.15.bt:0 "#Y Chersones#! wird ein #Y Verbündeter#! von #Y Skythien#!."
  me_scythia_01_greek_stance.15.c:0 "Wir werden ihnen nichts anbieten."
  me_scythia_01_greek_stance.15.ct:0 "Die Diplomaten sind enttäuscht und ihr Herrscher möglicherweise beleidigt."
  me_scythia_01_greek_stance.16.t:0 "$scythia_mission_01_greek_stance_task_2$: Antwort von Tyras"
  me_scythia_01_greek_stance.16.desc:0 "Die Botschafter von Tyran sind mit ihrer Antwort eingetroffen."
  me_scythia_01_greek_stance.16.desc_1:0 "\nSie haben unsere großzügigen Vorschläge angenommen und werden nun unser Klientelstaat."
  me_scythia_01_greek_stance.16.desc_2:0 "\nSie haben unseren Allianzvorschlag angenommen und möchten mit uns für eine bessere Zukunft zusammenarbeiten."
  me_scythia_01_greek_stance.16.desc_3:0 "\nSie haben entschieden, unsere diplomatischen Bemühungen zu widerlegen und eine weitere Vertiefung unserer Beziehungen ausgeschlossen. Dies kann nur als Beleidigung unserer Bemühungen gewertet werden."
  me_scythia_01_greek_stance.16.a:0 "Unsere Bemühungen waren erfolgreich!"
  me_scythia_01_greek_stance.16.at:0 "#Y Tyras#! wird zu einem #Y Klientelstaat#! von #Y Skythien#!."
  me_scythia_01_greek_stance.16.b:0 "Eine Allianz zum gegenseitigen Nutzen, da bin ich mir sicher."
  me_scythia_01_greek_stance.16.bt:0 "#Y Tyras#! wird ein #Y Verbündeter#! von #Y Skythien#!."
  me_scythia_01_greek_stance.16.c:0 "Wie können sie es wagen, uns so zu beleidigen!"
  me_scythia_01_greek_stance.16.ct:0 "Wir haben nichts gewonnen, gar nichts..."
  me_scythia_01_greek_stance.17.t:0 "$scythia_mission_01_greek_stance_task_2$: Antwort von Olbia"
  me_scythia_01_greek_stance.17.desc:0 "Die olbischen Botschafter sind mit ihrer Antwort eingetroffen."
  me_scythia_01_greek_stance.17.desc_1:0 "\nSie haben unsere großzügigen Vorschläge angenommen und werden nun unser Klientelstaat. Um diese Beziehung zu festigen, haben sie uns einen ihrer Weisen geschickt."
  me_scythia_01_greek_stance.17.desc_2:0 "\nSie haben unseren Allianzvorschlag angenommen und möchten mit uns für eine bessere Zukunft zusammenarbeiten."
  me_scythia_01_greek_stance.17.desc_3:0 "\nSie haben beschlossen, unsere diplomatischen Bemühungen zurückzuweisen, und eine weitere Vertiefung unserer Beziehungen abgelehnt. Dies kann nur als Beleidigung unserer Bemühungen angesehen werden."
  me_scythia_01_greek_stance.17.a:0 "Unsere Bemühungen waren erfolgreich!"
  me_scythia_01_greek_stance.17.at:0 "#Y Olbia#! wird zu einem #Y Klientelstaat#! von #Y Skythien#!."
  me_scythia_01_greek_stance.17.b:0 "Eine Allianz zum gegenseitigen Nutzen, da bin ich mir sicher."
  me_scythia_01_greek_stance.17.bt:0 "#Y Olbia#! wird ein #Y Verbündeter#! von #Y Skythien#!."
  me_scythia_01_greek_stance.17.c:0 "Wie können sie es wagen, uns so zu beleidigen!"
  me_scythia_01_greek_stance.17.ct:0 "Wir haben nichts gewonnen, gar nichts..."
  me_scythia_01_greek_stance.18.t:0 "$scythia_mission_01_greek_stance_task_2$: Antwort von Chersonesus"
  me_scythia_01_greek_stance.18.desc:0 "Die Botschafter von Chersonesus sind mit ihrer Antwort eingetroffen."
  me_scythia_01_greek_stance.18.desc_1:0 "\nSie haben unsere großzügigen Vorschläge angenommen und werden nun unser Klientelstaat. Um diese Beziehung zu festigen, haben sie uns eine kleine Flotte übergeben."
  me_scythia_01_greek_stance.18.desc_2:0 "\nSie haben unseren Vorschlag für ein Bündnis angenommen und möchten mit uns gemeinsam an einer besseren Zukunft arbeiten."
  me_scythia_01_greek_stance.18.desc_3:0 "\nSie haben beschlossen, unsere diplomatischen Bemühungen zurückzuweisen, und eine weitere Vertiefung unserer Beziehungen abgelehnt. Dies kann nur als Beleidigung unserer Bemühungen angesehen werden."
  me_scythia_01_greek_stance.18.a:0 "Unsere Bemühungen waren erfolgreich! Unser neuer Vasall bietet uns seine Flotte an."
  me_scythia_01_greek_stance.18.at:0 "#Y Chersonesus#! wird zu einem #Y Klientelstaat#! von #Y Skythien#!. Vor den Toren von #Y Chersonesus#! ist eine kleine Flotte unter unserer Kontrolle aufgetaucht."
  me_scythia_01_greek_stance.18.b:0 "Eine Allianz zum gegenseitigen Nutzen, da bin ich mir sicher."
  me_scythia_01_greek_stance.18.bt:0 "#Y Chersonesus#! wird ein #Y Verbündeter#! von #Y Skythien#!."
  me_scythia_01_greek_stance.18.c:0 "Wie können sie es wagen, uns so zu beleidigen!"
  me_scythia_01_greek_stance.18.ct:0 "Wir haben nichts gewonnen, gar nichts..."
  me_scythia_01_greek_stance.20.t:0 "$scythia_mission_01_greek_stance_task_4$: Die Rechte auf Wasser"
  me_scythia_01_greek_stance.20.desc:0 "Heute Morgen traf ein Bote ein, ein persönlicher Gesandter des Herrschers des Bosporanischen Königreichs. Sie haben unsere wachsende Seemacht erkannt und scheinen darüber ziemlich verärgert zu sein. Da sie keinen Krieg wollen – schließlich haben sie bereits genug mit den Sindi und den Maeoten zu tun –, haben sie angeboten, einen unserer Häfen zu kaufen, und verlangen, dass wir alle anderen zerstören, an deren Bau wir monatelang gearbeitet haben."
  me_scythia_01_greek_stance.20.a:0 "Wir werden ihren Forderungen nachkommen, aber den Preis für unsere Zusammenarbeit hoch ansetzen."
  me_scythia_01_greek_stance.20.at:0 "Wir werden unsere Bereitschaft signalisieren, eine Einigung zu erzielen, auch wenn dies auf Kosten unserer Beliebtheit geht."
  me_scythia_01_greek_stance.20.b:0 "Enthauptet den Boten, schickt seinen Leichnam zurück und stellt eine große Horde auf"
  me_scythia_01_greek_stance.20.bt:0 "Mit dieser Kränkung werden wir die Bosporaner wahrscheinlich erzürnen"
  me_scythia_01_greek_stance.21.t:0 "$scythia_mission_01_greek_stance_task_4$: Bote aus Skythien"
  me_scythia_01_greek_stance.21.desc:0 "Wir haben eine Nachricht von den Skythoi wegen unseres Interesses an ihren Gebieten erhalten."
  me_scythia_01_greek_stance.21.desc_1:0 "\nSie scheinen bereit zu sein, mit uns einen Handel abzuschließen. Was für ein Glücksfall!"
  me_scythia_01_greek_stance.21.desc_2:0 "\nEin frevelhafter Akt! Sie haben unseren Boten getötet und unser Angebot auf höchst bedauerliche Weise zurückgewiesen."
  me_scythia_01_greek_stance.21.a:0 "Wenn ich es mir recht überlege, ist der Blutpreis der Preis, den sie zahlen werden. Marschiert mit unseren Truppen!"
  me_scythia_01_greek_stance.21.at:0 "#Y Bosporanisches Königreich#! erklärt #Y Skythien#! den Krieg mit dem #G Überlegenheit zeigen#! Kriegsgrund."
  me_scythia_01_greek_stance.21.b:0 "Der Preis, den sie für die von uns gewünschten Gebeite, die wir begehren, genannt haben, beträgt #G 500#! Gold. Das werden wir sicher im Handumdrehen wieder hereingeholt haben."
  me_scythia_01_greek_stance.21.bt:0 "Das #Y Bosporanische Königreich#! zahlt #Y Skythien#! #G 500#! Gold."
  me_scythia_01_greek_stance.21.c:0 "Hmm, anscheinend haben sie unseren Bluff durchschaut. Ein Krieg kommt zum jetzigen Zeitpunkt nicht in Frage."
  me_scythia_01_greek_stance.21.ct:0 "Nichts passiert."
  me_scythia_01_greek_stance.22.t:0 "$scythia_mission_01_greek_stance_task_4$: Spartokidische Gesandte"
  me_scythia_01_greek_stance.22.desc:0 "Wir haben von den Bosporanern eine Nachricht erhalten, dass sie Interesse an ihrem Land haben."
  me_scythia_01_greek_stance.22.desc_1:0 "\nSie haben uns den Krieg erklärt. Sie sammeln ihre Kräfte, um uns anzugreifen, während wir sprechen!"
  me_scythia_01_greek_stance.22.desc_2:0 "\nSie haben den von uns ausgehandelten Preis akzeptiert und den gesamten Betrag bezahlt."
  me_scythia_01_greek_stance.22.desc_3:0 "\nSie haben ihr Angebot zurückgezogen und scheinen keinen weiteren Ärger zu machen."
  me_scythia_01_greek_stance.22.a:0 "Holt mein Pferd! Dann soll es eben Krieg geben!"
  me_scythia_01_greek_stance.22.at:0 "#Y Bosporanisches Königreich#! erklärt #Y Skythien#! den Krieg mit dem #G Überlegenheit zeigen#! Kriegsziel."
  me_scythia_01_greek_stance.22.b:0 "Diese Mittel werden sinnvoll eingesetzt, aber hat es sich gelohnt?"
  me_scythia_01_greek_stance.22.bt:0 "Das #Y Bosporanisches Königreich#! zahlt #Y Skythien#! #G 500#! Gold."
  me_scythia_01_greek_stance.22.c:0 "Behaltet ihre Machenschaften im Auge. Es könnte sein, dass sie versuchen, uns in Zukunft weiter zu provozieren."
  me_scythia_01_greek_stance.22.ct:0 "Nichts passiert."
  me_scythia_01_greek_stance.25.t:0 "$scythia_mission_01_greek_stance_task_5$: Wurzeln schlagen"
  me_scythia_01_greek_stance.25.desc:0 "Männer mit Äxten haben riesige Waldflächen gerodet, um den Boden freizulegen, auf dem unsere Zivilisation wachsen wird. Alle Bauarbeiter sind an ihren jeweiligen Baustellen eingetroffen und wurden bezahlt. Jetzt bleibt nur noch zu warten...und zuzusehen..., wie unsere Städte wie Pilze aus dem Boden schießen."
  me_scythia_01_greek_stance.25.a:0 "Bau es und sie werden kommen."
  me_scythia_01_greek_stance.26.t:0 "$scythia_mission_01_greek_stance_task_5$: Bau abgeschlossen"
  me_scythia_01_greek_stance.26.desc:0 "Es ist vollbracht. Mit diesen vier neuen Städten zusätzlich zu unserer Hauptstadt verfügen wir nun über die Voraussetzungen, um eine wachsende Kultur und Bevölkerung zu fördern, während Migranten aus allen Ecken der Welt zu uns strömen."
  me_scythia_01_greek_stance.26.a:0 "Öffne die Tore!"
  me_scythia_01_greek_stance.26.at:0 "$mission_task_completed_tt_1$ '$scythia_mission_01_greek_stance_task_5$' $mission_task_completed_tt_2$"
  me_scythia_01_greek_stance.27.t:0 "$scythia_mission_01_greek_stance_task_6$: Eine solide Grundlage"
  me_scythia_01_greek_stance.27.desc:0 "Zu lange waren wir durch viele unserer Traditionen eingeschränkt, die sicherlich aus unterschiedlichen Umständen entstanden sind. Es gibt keine Entschuldigung mehr, in Staatsangelegenheiten unwissend zu bleiben. Das ist der richtige Weg."
  me_scythia_01_greek_stance.27.a:0 "Alles ist in Ordnung."
  me_scythia_01_greek_stance.27.at:0 "$mission_task_completed_tt_1$ '$scythia_mission_01_greek_stance_task_6$' $mission_task_completed_tt_2$"
  me_scythia_01_greek_stance.28.t:0 "$scythia_mission_01_greek_stance_task_7$: Suche nach Fachexpertise" 
  me_scythia_01_greek_stance.28.desc:0 "Bislang haben wir uns auf Gerüchte und Berichte unserer eigenen Boten sowie seltener Besucher verlassen, doch es ist recht schwierig, verlässliche Informationen über die Sitten der Welt da draußen zu erhalten. Nehmen wir zum Beispiel die Griechen, mit denen wir benachbart sind: Sie besuchen uns nur selten, und daher wissen wir so wenig über ihre Bräuche, die uns so fremd und doch auch nützlich erscheinen. Lasst uns ihre größten Köpfe mit Bildungseinrichtungen anlocken, die einer Stadt an der Ägäis würdig sind. Lasst uns jene zu uns holen, die darauf brennen, uns all ihr Wissen mitzuteilen."
  me_scythia_01_greek_stance.28.a:0 "Wissen ist Macht."
  me_scythia_01_greek_stance.28.at:0 "Wir könnten in unserer Hauptstadt einige hellenische Pops erhalten."
  me_scythia_01_greek_stance.29.t:0 "$scythia_mission_01_greek_stance_task_7$: Ständige Besucher"
  me_scythia_01_greek_stance.29.desc:0 "Es scheint, als seien unsere Bemühungen weitaus erfolgreicher gewesen, als wir es uns erhofft hatten. Nicht nur strömen Mitglieder der griechischen Welt in Scharen durch unsere Tore, vielmehr bringen sie mehr mit als nur einen Reisebeutel. Einige von ihnen sind Familien, die hier ein neues Leben suchen, um unter den Skythen, die sie einst als einfache Barbaren verachteten, zu Wohlstand zu gelangen. Vielleicht sind wir tatsächlich auf dem richtigen Weg."
  me_scythia_01_greek_stance.29.a:0 "Lasst das Lernen beginnen."
  me_scythia_01_greek_stance.29.at:0 "In Skythien erscheinen 2 Adlige, 3 Bürger und 3 Freie"
  me_scythia_01_greek_stance.30.t:0 "$scythia_mission_01_greek_stance_task_8$: Verärgerter Priester"
  me_scythia_01_greek_stance.30.desc:0 "Unser Volk vermischt sich mit den Griechen, besucht den hellenischen Tempel, den wir in der Hauptstadt errichtet haben, und betet an den Schreinen, die außerhalb der Adelshäuser aufgestellt wurden. Unser Hohepriester, [SCOPE.sChar('current_high_priest').GetName], ist jedoch unruhig angesichts dieser Entwicklung. Er läuft täglich auf und ab und murrt in der Nacht. Vielleicht wäre es das Beste, ihn in dieser Übergangsphase zu trösten."
  me_scythia_01_greek_stance.30.a:0 "Sie waren fleißige und treue Ratsmitglieder. Ich werde eine Feier für sie ausrichten!"
  me_scythia_01_greek_stance.30.at:0 "Wir werden versuchen, sie mit Geschenken zu überzeugen."
  me_scythia_01_greek_stance.30.b:0 "In der Vergangenheit zu leben ist ein Zeichen von Schwäche. Ignoriert ihre harmlosen Gewohnheiten."
  me_scythia_01_greek_stance.30.bt:0 "Wir werden nicht versuchen, sie für uns zu gewinnen."
  me_scythia_01_greek_stance.31.t:0 "$scythia_mission_01_greek_stance_task_8$: Private Beichte"
  me_scythia_01_greek_stance.31.desc:0 "Der Hohepriester, [SCOPE.sChar('current_high_priest').GetName], betrat gestern Abend das Zimmer von [ROOT.GetCountry.GetRuler.GetName]. [SCOPE.sChar('current_high_priest').GetSheHe] war sehr still und kränklich blass und sprach von einer Angst, die [SCOPE.sChar('current_high_priest').GetSheHe] hinsichtlich der Hellenisierung des Volkes hegte; [SCOPE.sChar('current_high_priest').GetSheHe] sagte, dass all dies von einer Krankheit umgeben sei und dass Tabiti ins Wanken geraten sei und bereit sei, zuzuschlagen und ihre Vorherrschaft zurückzugewinnen, sollte der neue Tempel in der Hauptstadt nicht zerstört werden. Was ist zu tun?"
  me_scythia_01_greek_stance.31.a:0 "Wir haben die alten Götter noch nicht vergessen, noch ihre große Macht. Lasst uns den Tempel niederreißen."
  me_scythia_01_greek_stance.31.at:0 "Wir werden versuchen, sie für uns zu gewinnen, auch wenn dies auf Kosten unserer Hauptstadt geht."
  me_scythia_01_greek_stance.31.b:0 "Ein verzweifelter Priester, voller Angst vor dem neuen Zustand der Dinge; der Tempel bleibt bestehen"
  me_scythia_01_greek_stance.31.bt:0 "Wir werden nicht versuchen, sie für uns zu gewinnen."
  me_scythia_01_greek_stance.31.c:0 "Ich werde [SCOPE.sChar('current_high_priest').GetHerHim] davon überzeugen, dass alles gut wird. Ich hatte eine Vision …"
  me_scythia_01_greek_stance.31.ct:0 "Wir werden sie mit Schmeicheleien und Versprechungen überzeugen."
  me_scythia_01_greek_stance.32.t:0 "$scythia_mission_01_greek_stance_task_8$: Eine Szene machen"
  me_scythia_01_greek_stance.32.desc:0 "Mitten in einer Sitzung des großen Rats verspätete sich keuchend der Hohepriester [SCOPE.sChar('current_high_priest').GetName] und verkündete, dass das skythische Volk von einem Tyrannen und Verräter an unseren Vorfahren regiert werde, [SCOPE.sChar('current_high_priest').GetSheHe] forderte, dass alle griechischen Adligen in der Stadt hingerichtet werden, um unseren Glauben an die alten Götter zu zeigen." 
  me_scythia_01_greek_stance.32.a:0 "[SCOPE.sChar('current_high_priest').GetName] hat recht – befehlt die Morde an."
  me_scythia_01_greek_stance.32.at:0 "Wir werden versuchen, sie auf Kosten unserer Reputation zu gewinnen"
  me_scythia_01_greek_stance.32.b:0 "Lasst [SCOPE.sChar('current_bodyguard').GetName] [SCOPE.sChar('current_high_priest').GetName] mitnehmen und [SCOPE.sChar('current_high_priest').GetHerHim] zur Vernunft bringen."
  me_scythia_01_greek_stance.32.bt:0 "Wir werden versuchen, sie durch Bloßstellung zum Schweigen zu bringen."
  me_scythia_01_greek_stance.32.c:0 "Ich bin das Oberhaupt des Volksglaubens – ich bestimme, an welche Götter wir glauben!"
  me_scythia_01_greek_stance.32.ct:0 "Wir werden versuchen, sie durch eine Demonstration von Autorität und Größe für uns zu gewinnen."
  me_scythia_01_greek_stance.33.t:0 "$scythia_mission_01_greek_stance_task_8$: Ein neues Pantheon"
  me_scythia_01_greek_stance.33.desc:0 "Viele befürchten, dass dies eine der größten Hürden in der Entwicklung unseres Volkes sein wird. Wir sind seit langem in den Traditionen unserer Vergangenheit verwurzelt, und es wird ein großes Unterfangen sein, das über viele Generationen hinweg gewachsene Vertrauen in die alten Götter über Bord zu werfen. Doch wir müssen den Wert der griechischen Götter erkennen sowie die potenziellen Märkte und Gemeinschaften, in die wir aufgenommen werden könnten, wenn wir behaupten können, in unseren eigenen großen Tempeln dieselben Riten für die Götter der Hellenen – Zeus, Poseidon, Hades und die anderen – durchgeführt zu haben."
  me_scythia_01_greek_stance.33.a:0 "Vielleicht weisen uns die Flügel des großen Adlers den Weg."
  me_scythia_01_greek_stance.34.t:0 "$scythia_mission_01_greek_stance_task_8$: Ein gewagter Versuch"
  me_scythia_01_greek_stance.34.desc:0 "Letzte Nacht war es friedlich, bis es vor dem Schlafgemach von [ROOT.GetCountry.GetRuler.GetName] laut krachte. Plötzlich stürmte der Hohepriester [SCOPE.sChar('current_high_priest').GetName] durch die Tür, schwang ein Messer und sprang auf das Bett von [ROOT.GetCountry.GetRuler.GetName], bereit, [COUNTRY.GetRuler.GetHerHim] zu ermorden. Glücklicherweise stürmte der Leibwächter des Herrschers, [SCOPE.sChar('current_bodyguard').GetName], direkt hinter [SCOPE.sChar('current_high_priest').GetHerHim] herein und durchbohrte [SCOPE.sChar('current_high_priest').GetHerHim] mit einem langen Schwert. Die Gefahr wurde abgewendet, doch was war der Grund für diesen verzweifelten Angriff?"
  me_scythia_01_greek_stance.34.a:0 "[SCOPE.sChar('current_high_priest').GetSheHe] war eine unruhige Seele, unfähig, mit einer sich verändernden Welt fertig zu werden."
  me_scythia_01_greek_stance.34.at:0 "[SCOPE.sChar('current_high_priest').GetName] stirbt."
  me_scythia_01_greek_stance.35.t:0 "$scythia_mission_01_greek_stance_task_8$: Ewiger Schlaf"
  me_scythia_01_greek_stance.35.desc:0 "Letzte Nacht war es friedlich, bis es vor dem Schlafgemach von [ROOT.GetCountry.GetRuler.GetName] laut krachte. Es gab einen lauten Knall und der Hohepriester, [SCOPE.sChar('current_high_priest').GetName], stürmte durch die Tür, schwang ein Messer und sprang auf das Bett von [ROOT.GetCountry.GetRuler.GetName], bereit, [COUNTRY.GetRuler.GetHerHim] zu töten. Der Leibwächter des Herrschers, [SCOPE.sChar('current_bodyguard').GetName], lag ausgestreckt auf dem Boden, tot vor der Tür. Eine Anrufung an Tabiti singend, stieß [SCOPE.sChar('current_high_priest').GetName] das Messer in  das Herz von [ROOT.GetCountry.GetRuler.GetName] und schlitzte sich selbst darauf [ROOT.GetCountry.GetRuler.GetHerHis]e Kehle auf. Blut klebte an den Wänden, und der nächste Morgen bedeutete einen dunklen Tag für das Volk der Skythen."
  me_scythia_01_greek_stance.35.a:0 "Niemand hat dies kommen sehen. Wir alle müssen unsere blinde Weigerung bereuen, die bitteren Worte des Priesters anzuerkennen."
  me_scythia_01_greek_stance.35.at:0 "[ROOT.GetCountry.GetRuler.GetName] und [SCOPE.sChar('current_high_priest').GetName] sterben."
  me_scythia_01_greek_stance.36.t:0 "$scythia_mission_01_greek_stance_task_8$: Abschiede"
  me_scythia_01_greek_stance.36.desc:0 "Der Wind weht sanft und das Gras wiegt sich im Wind. Auf [ROOT.GetCountry.GetRuler.GetHerHis]em Pferd sitzend, einen ausgetretenen Pfad entlang stapfend, spitzte [ROOT.GetCountry.GetRuler.GetName] [ROOT.GetCountry.GetRuler.GetHerHis]e Ohren, als das Klappern von Hufen von hinten zu hören war. Der Hohepriester, [SCOPE.sChar('current_high_priest').GetName], reitet neben [ROOT.GetCountry.GetRuler.GetHerHim]. [SCOPE.sChar('current_high_priest').GetSheHe] seufzt und gesteht, dass, obwohl [SCOPE.sChar('current_high_priest').GetSheHe] [ROOT.GetCountry.GetRuler.GetName] treu war und bleibt, die Welt nicht so ist, wie sie war, und [SCOPE.sChar('current_high_priest').GetSheHe] ein einsames Leben führen möchte, das durch die Prärie treibt. [SCOPE.sChar('current_high_priest').GetSheHe] reitet davon, um nie wieder gesehen zu werden."
  me_scythia_01_greek_stance.36.a:0 "Die besten Wünsche an die treibende Seele. Möge Targitaos [SCOPE.sChar('current_high_priest').GetHerHim] über das Gras führen."
  me_scythia_01_greek_stance.39.t:0 "$scythia_mission_01_greek_stance_task_8$: Hellenische Skythoi"
  me_scythia_01_greek_stance.39.desc:0 "Auf dem beschwerlichen Weg, den wir eingeschlagen haben, um diese neue religiöse Einheit zu erreichen – die Verehrung einer neuen Gruppe von Göttern, die wir zuvor in unseren eigenen Ländern als gotteslästerliche Gestalten verurteilt hatten –, haben wir Menschen verloren. Doch durch die Wiedergutmachung, die wir in unserer Gesellschaft geleistet haben, haben wir ein stärkeres Selbstbewusstsein gefunden und können nun voller Freude voranschreiten, da wir uns mit der großen und blühenden Gemeinschaft der hellenischen Völker in der gesamten bekannten Welt, die diese Götter teilen, vereint haben."
  me_scythia_01_greek_stance.39.a:0 "Bringt dem Herrn der Lüfte neun Stiere zu Ehren"
  me_scythia_01_greek_stance.39.at:0 "$mission_task_completed_tt_1$ '$scythia_mission_01_greek_stance_task_8$' $mission_task_completed_tt_2$"
  me_scythia_01_greek_stance.40.t:0 "$scythia_mission_01_greek_stance_task_9$: Das griechische Erbe verbreiten"
  me_scythia_01_greek_stance.40.desc:0 "Während wir zuvor die Legende von Herakles’ Ankunft in Skythien als eine von den Hellenen erfundene Fantasie abgetan hatten, um unser Misstrauen ihnen gegenüber zu mindern, erkennen wir nun die Wahrheit. Es war ein einzelner Mann, Spargapeithes, der, als er mit seiner Herde über die Felder wanderte, auf eine Senke im Gelände stieß, die sich auf eine Weise schlängelte, wie es kein Wagen auf seinen zwei Rädern jemals könnte. Es gab keinen Menschen auf der Welt, der eine solch unberechenbare Linie im Gras hätte ziehen können; getrieben von Neugier überließ er daher seine Herde der Obhut seines Pferdes und kroch der Linie entlang, wobei er jeder ihrer Kurven folgte. \n\nEr hatte damit begonnen, als die Sonne hoch am Himmel stand, und sie lag bereits tief am Horizont, als er endlich das Ende seines qualvollen Kriechens erreichte. Vor Schmerzen und Krämpfen in der Wirbelsäule sank er auf den Rücken und rollte einen Hügel hinunter bis zum Strand – er hatte das Brechen der Wellen an den Felsen nicht gehört – und kam vor dem Eingang einer großen Höhle zum Liegen. Er kroch allein mit der Kraft seiner Arme hinein und stieß auf den Schwanz einer riesigen Schlange, an dessen Ende sich der Körper eines Mannes – nein, einer Frau – befand, der in vollkommener Einheit mit der Schlange verschmolzen war. Angst ergriff ihn und gab ihm Kraft, also rannte er und rannte und rannte zurück zu der Stelle, an der er aufgebrochen war, und als er seine Herde nicht fand, rannte er weiter, zurück zum Wagenlager, von dem er gekommen war, und behauptete, er habe den Körper der Schlange gefunden, mit der Herakles geschlafen hatte, die Mutter von ihnen allen."
  me_scythia_01_greek_stance.40.a:0 "Die Geschichten sind also wahr. Vergessen wir unsere Mutter nicht."
  me_scythia_01_greek_stance.40.at:0 "$mission_task_completed_tt_1$ '$scythia_mission_01_greek_stance_task_9$' $mission_task_completed_tt_2$ Die #Y Hellenische#! Gottheit #Y Hylaian Drakania#! ist nun verfügbar."

###EUXINUS GAMES START###

  me_scythia_01_greek_stance.41.t:0 "Die Euxinus-Spiele"
  me_scythia_01_greek_stance.41.desc:0 "In [SCOPE.sP('scythian_games_province_scope').GetName] wurden die Flächen geräumt, um die zahlreichen Veranstaltungen auszurichten, die wir sorgfältig nach griechischem Vorbild gestaltet und dabei einige unserer traditionellen Spiele integriert haben.\n\nDie Kreise für die Ringkämpfe wurden abgesteckt, und Markierungen säumen die offenen Felder, auf denen die Wagenrennen stattfinden werden.\n\nGetränke und Festtagsdelikatessen treffen gerade in unseren Häfen ein und werden per Karawane herangeschafft, um unseren edlen Gästen dargeboten zu werden.\n\nKommt alle herbei, die Spiele dieses überaus gastfreundlichen Meeres beginnen bald!"
  me_scythia_01_greek_stance.41.a:0 "Ladet die vielen griechischen Städte ein, ihre größten Athleten zu entsenden."
  me_scythia_01_greek_stance.41.b:0 "Vielleicht ist es besser, einfach um die Teilnahme an der Olympiade zu bitten?"
  me_scythia_01_greek_stance.43.t:0 "$me_scythia_01_greek_stance.41.t$"
  me_scythia_01_greek_stance.43.desc:0 "Die Pferdeherren des Nordens haben uns eingeladen, an einer Reihe von Spielen nach olympischem Vorbild teilzunehmen.\n\nEs heißt, sie verehrten nun unsere Götter, doch wir wissen nicht, ob diese Spiele aus Respekt oder aus Trotz gegenüber den traditionellen Spielen im heiligen Olympia veranstaltet werden. Wenn wir daran teilnehmen sollen, ist es unser Brauch, die stolzesten und fähigsten jungen [ROOT.GetCountry.GetAdjective]en Athleten zu entsenden, um in unserem Namen anzutreten. Wir glauben, dass wir zwei ideale Kandidaten gefunden haben: ein [SCOPE.sChar('euxinus_games_champion').Custom('get_godly_description')] mit dem Namen [SCOPE.sChar('euxinus_games_champion').GetPraenomen] und ein [SCOPE.sChar('euxinus_games_champion_2').Custom('get_godly_description')], der  [SCOPE.sChar('euxinus_games_champion_2').GetHerselfHimself] [SCOPE.sChar('euxinus_games_champion_2').GetPraenomen] nennt. Welchen dieser hervorragenden Athleten sollen wir zu den Spielen entsenden?"
  me_scythia_01_greek_stance.43.a:0 "Entsendet [SCOPE.sChar('euxinus_games_champion').GetPraenomen]!"
  me_scythia_01_greek_stance.43.b:0 "[SCOPE.sChar('euxinus_games_champion_2').GetPraenomen] wird entsandt."
  me_scythia_01_greek_stance.43.c:0 "Es ist nicht einmal die echte Olympiade! Absurd!"
  me_scythia_01_greek_stance.45.t:0 "Die Euxinus-Spiele enden"
  me_scythia_01_greek_stance.45.desc:0 "Die unerschrockenen Euxinischen Spiele sind begleitet von großem Jubel und Feierlichkeiten von Jubel und Feierlichkeiten zu Ende gegangen.\n\nDer Höhepunkt der diesjährigen Spiele fand während des [SCOPE.Custom('get_olympic_highlight')] statt.\n\nInsgesamt wurde der Sieger zu [SCOPE.sChar('victorious_competitor').GetName] aus [SCOPE.sC('victor_origin_country').GetName], [SCOPE.sChar('victorious_competitor').Custom('get_number_of_wins')] dessen Kraft, Männlichkeit und herakleische Stärke unvergleichlich sind. Er wird als Sieger der Euxinischen Spiele in die Annalen der Geschichte eingehen!"
  me_scythia_01_greek_stance.45.desc_2:0 "Die unvergesslichen Euxinischen Spiele sind unter großem Jubel und mit vielen Feierlichkeiten zu Ende gegangen.  Die diesjährige Veranstaltung war jedoch aufgrund des Todes des posthumen Siegers [SCOPE.sChar('victorious_competitor').GetName] von Trauer überschattet. Unwillig, im Angesicht des Todes aufzugeben, kämpfte [SCOPE.sChar('victorious_competitor').GetSheHe] bis zum bitteren Ende gegen [SCOPE.sChar('victorious_competitor').GetHerHis]e Gegner in einem der kriegerischen Disziplinen und wurde aufgrund dieser mildernden Umstände ehrenhaft zum Sieger erklärt. \n\nTrotzdem zogen viele andere Veranstaltungen viele Menschen an, wobei eine besonders denkwürdige Veranstaltung  [SCOPE.Custom('get_olympic_highlight')] war"
  me_scythia_01_greek_stance.45.a:0 "Lob sei [SCOPE.sChar('victorious_competitor').GetPraenomen]!"
  me_scythia_01_greek_stance.45.b:0 "Nun ja, vielleicht klappt es beim nächsten Mal besser."
  me_scythia_01_greek_stance.45.c:0 "Eine großartige Veranstaltung!"
  me_scythia_01_greek_stance.46.t:0 "Stadion verlassen"
  me_scythia_01_greek_stance.46.desc:0 "Es scheint, dass kaum jemand zu den Euxinischen Spielen erschienen ist, und die Veranstaltung musste abgesagt werden. \n\nDiese Enttäuschung ist ein verheerender Schlag für das Projekt der Hellenisierung im Norden."
  me_scythia_01_greek_stance.46.a:0 "Wir müssen den mächtigen Zeus irgendwie beleidigt haben."

###EUXINUS GAMES END###

  me_scythia_01_greek_stance.49.t:0 "$scythia_mission_01_greek_stance_task_11$: Aufstieg der Graeko-Skythen"
  me_scythia_01_greek_stance.49.desc:0 "Es war das spektakulärste Ereignis, das das Volk je erlebt hatte, als der große Monarch [ROOT.GetCountry.GetRuler.GetName] von griechischen und skythischen Beamten, die Seite an Seite zu [ROOT.GetCountry.GetRuler.GetHerHis]en Füßen knieten, zum hellenischen Führer des Volkes gesalbt wurde, ein Zeichen der königlichen Vorherrschaft über beide Welten."
  me_scythia_01_greek_stance.49.a:0 "Wir können uns nun nur noch darauf freuen, was uns in dieser neuen, griechischen Welt erwartet."
  me_scythia_01_greek_stance.49.at:0 "$mission_task_completed_tt_1$ '$scythia_mission_01_greek_stance_task_11$' $mission_task_completed_tt_2$"
  me_scythia_01_greek_stance.50.t:0 "$scythia_mission_01_greek_stance_task_12$: Grenzstörungen"
  me_scythia_01_greek_stance.50.desc:0 "Seit einigen Jahren liegen wir mit unseren griechischen Nachbarn im Streit. Vor allem mit den kleinen Staaten – Olbia, Tyras und Chersonesos – haben wir am häufigsten Probleme. Wie oft werden schon taurische Piraten dabei erwischt, wie sie mit Duldung der Regierung von Chersonesos den Fluss hinauf in unsere Gewässer segeln? Wie oft verirren sich Handelskarawanen aus Olbia und Tyras bei der Durchquerung der grasbewachsenen Hügel und verursachen Probleme, wenn sie auf skythische Lager stoßen, nachdem sie Unmengen ihres Weins getrunken und unseren gestohlen haben? Diese Vergehen sind zahlreich, ebenso wie unsere Gründe für die Entscheidung, dass sie schon viel zu lange als unabhängige Einheiten bestehen..."
  me_scythia_01_greek_stance.50.a:0 "Sie werden bald einen nicht rückgängig zu machenden Fehler machen."
  me_scythia_01_greek_stance.50.at:0 "#Y Skythien#! erwirbt Ansprüche auf das Land ihres Nachbarn."
  me_scythia_01_greek_stance.51.t:0 "$scythia_mission_01_greek_stance_task_12$: Casus Belli"
  me_scythia_01_greek_stance.51.desc:0 "Es ist geschehen. Wir haben all diese fürchterlichen Städte bei mindestens einer Handlung ertappt, die wir als Rechtfertigung für Krieg und Eroberung ansehen. Tyros hat unseren Herrscher unverhohlen beleidigt, indem es ihn auf einer seiner Münzen in einer herabwürdigenden Weise dargestellt hat. Die Olbier schickten uns Wagenladungen mit angeblich Weinkrügen, doch es stellte sich heraus, dass diese bis zur Unkenntlichkeit mit billigem Sumpfwasser verdünnt waren – ihr Warenzeichen hat keinerlei Bedeutung. Chersonesos ist der Urheber eines genehmigten Raubzugs taurischer Piraten auf skythische Dörfer entlang des Flusses, der an unserer Hauptstadt vorbeifließt. Das sind inakzeptable Taten, daher bleibt uns keine andere Wahl, als mit Gewalt zu reagieren."
  me_scythia_01_greek_stance.51.a:0 "Rufe die Krieger an."
  me_scythia_01_greek_stance.51.at:0 "$mission_task_completed_tt_1$ '$scythia_mission_01_greek_stance_task_12$' $mission_task_completed_tt_2$"
  me_scythia_01_greek_stance.52.t:0 "$scythia_mission_01_greek_stance_task_14$: Wie Kriegsgefangene" 
  me_scythia_01_greek_stance.52.desc:0 "Der Hohepriester beaufsichtigte alle Opferrituale und behandelte die griechischen Toten und Gefangenen wie Kriegsbeute, die nach Beendigung der Schlacht vom Feind erbeutet worden war. Ein Trankopfer wurde über ihre Köpfe gegossen, bevor ihnen vor einem leeren Gefäß die Kehlen durchschlitzt wurden. Diese Gefäße wurden, nachdem sie gefüllt worden waren, hergebracht und über das bereitstehende Schwert des Herrschers der Skythen ausgegossen, während den leblosen Körpern die rechten Arme abgetrennt wurden – ein Schrei ging auf, und es regnete Gliedmaßen unserer Feinde herab. Und so erklärte der Hohepriester, [SCOPE.sChar('current_high_priest').GetName], dass Patampasa zufriedengestellt worden sei."
  me_scythia_01_greek_stance.52.a:0 "Die Griechen haben uns doch etwas Gutes getan."
  me_scythia_01_greek_stance.52.at:0 "$mission_task_completed_tt_1$ '$scythia_mission_01_greek_stance_task_14$' $mission_task_completed_tt_2$"
  me_scythia_01_greek_stance.53.t:0 "$scythia_mission_01_greek_stance_task_15$: Ein bisschen zu weit."
  me_scythia_01_greek_stance.53.desc:0 "Die Griechen schwadronieren ständig von ihrer Überlegenheit und ihre höhere Gesellschaft. Ich habe dies bereits bei früheren Gelegenheiten scharf kritisiert, doch ihre fortwährende Abhängigkeit von unserem Handel mit Sklaven und Getreide, während sie uns beim Vorbeiziehen das beleidigende „Bar, Bar, Bar“ hinterherrufen, ist unerträglich. Ich würde behaupten, dass es an der Zeit ist, ihnen erneut meine Forderungen zu übermitteln, doch einige haben dies als voreilige und unkluge Handlung bezeichnet."
  me_scythia_01_greek_stance.53.a:0 "Erneut zu versuchen, kann nicht schaden."
  me_scythia_01_greek_stance.53.at:0 "Skythien wird allen Nationen, die der hellenischen Religion angehören, eine Beleidigung übermitteln."
  me_scythia_01_greek_stance.53.b:0 "Vielleicht sollten wir nicht die ganze griechische Welt auf einmal verärgern."
  me_scythia_01_greek_stance.53.bt:0 "Skythien wird seine Anschuldigungen zurücknehmen."
  me_scythia_01_greek_stance.54.t:0 "$scythia_mission_01_greek_stance_task_15$: Skythische Anschuldigungen."
  me_scythia_01_greek_stance.54.desc:0 "Ein übermittelnder Bote ist mit einer weitergeleiteten Nachricht der Pferdefürsten aus dem Norden eingetroffen. Was wollen diese beleidigenden, rückständigen Säufer denn von uns? Schicken wir ihnen nicht schon genug Wein, um ihre Sorgen zu ertränken?"
  me_scythia_01_greek_stance.54.desc_1:0 "Es scheint, dass ihr Herrscher es für angebracht gehalten hat, uns erneut zu beleidigen."
  me_scythia_01_greek_stance.54.desc_2:0 "Sie haben Demut gelernt und sich für frühere Beleidigungen entschuldigt."
  me_scythia_01_greek_stance.54.a:0 "Das ist in Ordnung, aber sie werden nicht überrascht sein, wenn wir einmarschieren."
  me_scythia_01_greek_stance.54.at:0 "[SCOPE.GetRootScope.GetCountry.GetName] erhält einen Anspruch auf Skythien"
  me_scythia_01_greek_stance.54.b:0 "Ach, die sind bestimmt betrunken. Lass es einfach auf sich beruhen."
  me_scythia_01_greek_stance.54.bt:0 "[SCOPE.GetRootScope.GetCountry.GetName] wird nichts tun."
  me_scythia_01_greek_stance.55.t:0 "$scythia_mission_01_greek_stance_task_16$: Die Flussgrenze"
  me_scythia_01_greek_stance.55.desc:0 "Wir haben Oblia erobert, und Tyras gehört uns – der Stützpunkt am westlichen Ufer des gleichnamigen Flusses. Diese Städte sind sowohl ein Ausgangspunkt für unsere künftigen Eroberungen als auch eine mögliche Belastung, die wir berücksichtigen sollten – unsere dort stationierte Garnison wäre im Falle eines Hinterhalts oder eines unerwarteten Einfalls mit dem Rücken zum Fluss festgenagelt. Doch das ist ein Thema für ein anderes Mal. Lasst uns unseren Erfolg feiern."
  me_scythia_01_greek_stance.55.a:0 "Sollte jemand den Fluss überqueren, dringt er unberechtigt in Skythien ein, und wir werden bereit sein."
  me_scythia_01_greek_stance.55.at:0 "$mission_task_completed_tt_1$ '$scythia_mission_01_greek_stance_task_16$' $mission_task_completed_tt_2$"
  me_scythia_01_greek_stance.56.t:0 "$scythia_mission_01_greek_stance_task_17$: Piratenflotten"
  me_scythia_01_greek_stance.56.desc:0 "Der Piratenhafen Kalos Limen gehört nun endlich uns, ebenso wie der Rest von Chersonesus. Es ist erfreulich, dass der Hafen tatsächlich einen Monat nach der Stadt unserer Macht unterlag, obwohl wir das Land rund um ihr verstecktes Lager ungehindert durchstreiften. Anstatt sie alle zu töten, haben wir beschlossen, die besten Kämpfer und Seeleute unter ihnen zu verschonen, da es uns Skythen an Erfahrung und Talent auf den unberechenbaren Meeren mangelt. Es gab einen Mann, der unter ihnen hoch angesehen war; wir haben ihn als ihren Anführer eingesetzt und ihm ein gewisses Maß an Autonomie gewährt – allerdings mit der Fessel der Bezahlung um den Hals. Dieser Mann, Zeno, dient uns nun mit seiner Flotte, und es sollte uns freistehen, diese einzusetzen, um unsere Eroberungen auf dem Wasser voranzutreiben."
  me_scythia_01_greek_stance.56.a:0 "Er wird uns treu bleiben oder er wird mit seinem Schiff untergehen..."
  me_scythia_01_greek_stance.56.at:0 "Ein abtrünniger Admiral und seine Flotte stehen uns zur Verfügung."
  me_scythia_01_greek_stance.57.t:0 "$scythia_mission_01_greek_stance_task_17$: Ein verborgener Schatz"
  me_scythia_01_greek_stance.57.desc:0 "Als unsere Krieger die Stadt Chersonesus selbst überfielen, gab es einen alten Mann unter den Griechen am Rand der Stadt, der gesehen wurde, wie er sich inmitten des Chaos aus den Toren schlich und nach Norden eilte, aus Neugier folgten ihm einige unserer Männer.\n\nSie folgten dem Mann ein gutes Stück, bis er sie an einen abgelegenen Ort brachte, wo die Trümmer eines alten Tempels lagen, ein zerfallenes und vergessenes Relikt der Vergangenheit.  Als er mit einem Götzenbild in der Hand aus dem Tempel ging, sprachen ihn die Krieger an, nahmen ihn gefangen und nahmen das Götzenbild an sich. Es ist ein seltsames Stück und kann gut als Dekoration an einer unserer heiligen Stätten dienen."
  me_scythia_01_greek_stance.57.a:0 "Wirklich seltsam – möge der Tempel aus dem Gedächtnis verblassen."
  me_scythia_01_greek_stance.57.at:0 "$mission_task_completed_tt_1$ '$scythia_mission_01_greek_stance_task_17$' $mission_task_completed_tt_2$"
  me_scythia_01_greek_stance.58.t:0 "$scythia_mission_01_greek_stance_task_19$: Unsere Kräfte mustern"
  me_scythia_01_greek_stance.58.desc:0 "Unsere Untertanen sind eine wertvolle Ressource, die uns mit einer Fülle von Gütern und Menschen versorgt, insbesondere in Kriegszeiten, wenn wir sie am dringendsten benötigen. Für unsere bevorstehenden Eroberungen werden wir auf zahlreiche Krieger zurückgreifen müssen; daher ist es gut, dass wir viele verwandte Völker unterworfen haben, die unsere Reit- und Kampftechniken teilen."
  me_scythia_01_greek_stance.58.a:0 "Eine wahre skythische Horde"
  me_scythia_01_greek_stance.58.at:0 "$mission_task_completed_tt_1$ '$scythia_mission_01_greek_stance_task_19$' $mission_task_completed_tt_2$"
  me_scythia_01_greek_stance.60.t:0 "$scythia_mission_01_greek_stance_task_20$: Sindische Annäherungsversuche"
  me_scythia_01_greek_stance.60.desc:0 "Der Stamm der Sindi unterhält seit langem ein wechselhaftes Verhältnis zum Königreich Bosporus, das durch die Auseinandersetzungen zwischen den Söhnen von Satyros II. und dem Usurpator Oktamasades stark belastet wurde.\n Seitdem herrscht eine angespannte Lage, und wir gehen davon aus, dass der Stamm bereit wäre, die Feindseligkeiten wieder aufzunehmen und seinen Teil des kimmerischen Bosporus zurückzuerobern.\n Lasst uns ein Abkommen mit ihnen schließen, damit wir Verbündete haben, mit denen wir die Griechen schlagen können."
  me_scythia_01_greek_stance.60.a:0 "Unsere Beziehung ist sehr wichtig. Machen Sie sich das klar."
  me_scythia_01_greek_stance.60.at:0 "#Y Sindica#! kann ein #Y Klientelstaat#! werden."
  me_scythia_01_greek_stance.60.b:0 "Sie könnten ein nützlicher Verbündeter sein. Macht ihnen ein großzügiges Angebot."
  me_scythia_01_greek_stance.60.bt:0 "#Y Sindica#! kann ein #Y Verbündeter#! werden."
  me_scythia_01_greek_stance.60.c:0 "Lasst uns ihnen stattdessen ein Zeichen der Freundschaft schicken."
  me_scythia_01_greek_stance.60.ct:0 "#Y Sindica#! wird wahrscheinlich unsere Annäherungsversuche ablehnen."
  me_scythia_01_greek_stance.61.t:0 "$scythia_mission_01_greek_stance_task_20$: Maeotische Annäherungsversuche"
  me_scythia_01_greek_stance.61.desc:0 "Die Maeoten, benannt nach dem See, an dessen Ufer sie ihre Hütten errichten, haben eine undurchsichtige Geschichte, die größtenteils in den Sümpfen verloren gegangen ist, in denen sie Schutz finden und in die sie sich zurückziehen, wenn wir uns nähern.\n Allerdings scheinen sie uns wohlwollender zu betrachten als die Griechen, die sie verärgern und ihre traditionellen Bräuche unterdrücken. Heißt es nicht, dass die Prinzessin Tirgatao der Ixomaten, eines dieser am See lebenden Stämme, durch griechische List von ihrem Ehemann ungerecht behandelt wurde und daraufhin einen Krieg gegen sie führte?\n Vielleicht gibt es noch einige alte Wunden, die unsere mit Gift versetzten Pfeile und Speere erneut aufreißen könnten, um sie in unseren Krieg gegen die Bosporaner hineinzuziehen."
  me_scythia_01_greek_stance.61.a:0 "Unsere Beziehung ist sehr wichtig. Machen Sie sich das klar."
  me_scythia_01_greek_stance.61.at:0 "#Y Maeotia#! kann ein #Y Klientelstaat#! werden."
  me_scythia_01_greek_stance.61.b:0 "Sie könnten ein nützlicher Verbündeter sein. Macht ihnen ein großzügiges Angebot."
  me_scythia_01_greek_stance.61.bt:0 "#Y Maeotia#! kann ein #Y Verbündeter#! werden!."
  me_scythia_01_greek_stance.61.c:0 "Lasst uns ihnen stattdessen ein Zeichen der Freundschaft schicken."
  me_scythia_01_greek_stance.61.ct:0 "#Y Maeotia#! wird wahrscheinlich unsere Annäherungsversuche ablehnen."
  me_scythia_01_greek_stance.62.t:0 "$scythia_mission_01_greek_stance_task_20$: Tyrgetische Söldner"
  me_scythia_01_greek_stance.62.desc:0 "Die dakischen Stämme sind zwar unberechenbar, aber sie sind bekannt für ihre Gefährlichkeit und ihren Kampfeswillen.\nIm Krieg gegen das Königreich Bosporus könnten wir eine Gruppe dakischer Söldner gut gebrauchen, um unsere Streitkräfte zu verstärken – die Tyrgetäer, die auf ihrer Insel am Tyras leben, sind die idealen Kandidaten, da sie nah genug sind, um ihre Truppen in kurzer Zeit hierher zu bringen."
  me_scythia_01_greek_stance.62.a:0 "Bietet an, ihr Gefolge als Söldner anzuheuern."
  me_scythia_01_greek_stance.62.at:0 "#Y Tyrgetae#! wird wahrscheinlich akzeptieren."
  me_scythia_01_greek_stance.62.b:0 "Sie könnten ein nützlicher Verbündeter sein. Macht ihnen ein großzügiges Angebot."
  me_scythia_01_greek_stance.62.bt:0 "#Y Tyrgetae#! kann ein #Y Verbündeter#! werden."
  me_scythia_01_greek_stance.62.c:0 "Lasst uns ihnen stattdessen ein Zeichen der Freundschaft schicken."
  me_scythia_01_greek_stance.62.ct:0 "#Y Tyrgetae#! wird wahrscheinlich unsere Annäherungsversuche ablehnen."
  me_scythia_01_greek_stance.64.t:0 "$scythia_mission_01_greek_stance_task_20$: Bote aus Skythien"
  me_scythia_01_greek_stance.64.desc:0 "Gesandte des skythischen Volkes sind eingetroffen und überbringen eine Botschaft ihres Herrschers."
  me_scythia_01_greek_stance.64.desc_1:0 "\nSie bieten uns große Mengen an Silber und Gold an, um uns für ihre Sache zu gewinnen. Ihr Herrscher ist auf der Suche nach militärischen Verbündeten und Handelspartnern."
  me_scythia_01_greek_stance.64.desc_2:0 "\nSie bieten uns eine gewisse Menge Silber an, um uns für ihre Sache zu gewinnen. Ihr Herrscher ist auf der Suche nach militärischen Verbündeten und Handelspartnern."
  me_scythia_01_greek_stance.64.desc_3:0 "\nObwohl ihre Worte lieblich klingen, haben sie nur wenig an Geschenken oder Bestechungsgeldern zu bieten."
  me_scythia_01_greek_stance.64.a:0 "Es schmerzt mich, das zu sagen, aber wir könnten in diesen gefährlichen Zeiten ihren Schutz gebrauchen. Lieber mit ihnen als gegen sie."
  me_scythia_01_greek_stance.64.at:0 "#Y Sindica#! wird zu einem #Y Klientelstaat#! von #Y Skythien#!."
  me_scythia_01_greek_stance.64.b:0 "Vielleicht wird ein Militärbündnis sie besänftigen und uns im Gegenzug Vorteile bieten?"
  me_scythia_01_greek_stance.64.bt:0 "#Y Sindica#! wird ein #Y Verbündeter#! von #Y Skythien#!."
  me_scythia_01_greek_stance.64.c:0 "Wir werden ihnen nichts anbieten."
  me_scythia_01_greek_stance.64.ct:0 "Die Diplomaten sind enttäuscht und ihr Herrscher möglicherweise beleidigt."
  me_scythia_01_greek_stance.65.t:0 "$scythia_mission_01_greek_stance_task_20$: Antwort von Sindica"
  me_scythia_01_greek_stance.65.desc:0 "Die sindicanischen Gesandten sind mit ihrer Antwort eingetroffen."
  me_scythia_01_greek_stance.65.desc_1:0 "\nSie haben unsere großzügigen Vorschläge angenommen und werden nun unser Klientelstaat."
  me_scythia_01_greek_stance.65.desc_2:0 "\nSie haben unseren Allianzvorschlag angenommen und möchten mit uns gemeinsam an einer besseren Zukunft arbeiten."
  me_scythia_01_greek_stance.65.desc_3:0 "\nSie haben beschlossen, unsere diplomatischen Bemühungen zurückzuweisen, und eine weitere Verbesserung unserer Beziehungen abgelehnt. Dies kann nur als Beleidigung unserer Bemühungen angesehen werden."
  me_scythia_01_greek_stance.65.a:0 "Unsere Bemühungen waren erfolgreich!"
  me_scythia_01_greek_stance.65.at:0 "#Y Sindica#! wird ein #Y Stammesvasall#!."
  me_scythia_01_greek_stance.65.b:0 "Eine Allianz zum gegenseitigen Nutzen, da bin ich mir sicher."
  me_scythia_01_greek_stance.65.bt:0 "#Y Sindica#! wird ein #Y Verbündeter#!."
  me_scythia_01_greek_stance.65.c:0 "Wie können sie es wagen, uns so zu beleidigen!"
  me_scythia_01_greek_stance.65.ct:0 "Wir haben nichts gewonnen, gar nichts..."
  me_scythia_01_greek_stance.66.t:0 "$scythia_mission_01_greek_stance_task_20$: Bote aus Skythien"
  me_scythia_01_greek_stance.66.desc:0 "Abgesandte der skythischen Nation sind eingetroffen und haben eine Botschaft ihres Herrschers überbracht."
  me_scythia_01_greek_stance.66.desc_1:0 "Sie bieten uns eine beträchtliche Anzahl von Sklaven an, um uns für ihre Sache zu gewinnen. Ihr Herrscher sucht nach militärischen Verbündeten und Handelspartnern."
  me_scythia_01_greek_stance.66.desc_2:0 "\nSie bieten uns große Mengen an Silber und Gold an, um uns für ihre Sache zu gewinnen. Ihr Herrscher ist auf der Suche nach militärischen Verbündeten und Handelspartnern."
  me_scythia_01_greek_stance.66.desc_3:0 "\nAuch wenn ihre Worte lieblich klingen, haben sie doch kaum Geschenke oder Bestechungsgelder zu bieten."
  me_scythia_01_greek_stance.66.a:0 "Um unser Überleben zu sichern, müssen wir Vasallentum akzeptieren. Schicken Sie ihnen einen Berater, um zu sehen, ob unsere Interessen vorangetrieben werden."
  me_scythia_01_greek_stance.66.at:0 "#Y Maeotia#! wird ein #Y Stammesvasall#! von #Y Skythien#!."
  me_scythia_01_greek_stance.66.b:0 "Vielleicht wird ein Militärbündnis sie besänftigen und uns im Gegenzug Vorteile bieten?"
  me_scythia_01_greek_stance.66.bt:0 "#Y Maeotia#! wird ein #Y Verbündeter#! von #Y Skythien#!."
  me_scythia_01_greek_stance.66.c:0 "Wir werden ihnen nichts anbieten."
  me_scythia_01_greek_stance.66.ct:0 "Die Diplomaten sind enttäuscht und ihr Herrscher möglicherweise beleidigt."
  me_scythia_01_greek_stance.67.t:0 "$scythia_mission_01_greek_stance_task_20$: Antwort von Maeotia"
  me_scythia_01_greek_stance.67.desc:0 "Die maeotischen Botschafter sind mit ihrer Antwort eingetroffen."
  me_scythia_01_greek_stance.67.desc_1:0 "\nSie haben unsere großzügigen Vorschläge angenommen und werden nun unser Klientelstaat."
  me_scythia_01_greek_stance.67.desc_2:0 "\nSie haben unseren Allianzvorschlag angenommen und möchten mit uns gemeinsam an einer besseren Zukunft arbeiten."
  me_scythia_01_greek_stance.67.desc_3:0 "\nSie haben beschlossen, unsere diplomatischen Bemühungen zurückzuweisen, und eine weitere Verbesserung unserer Beziehungen abgelehnt. Dies kann nur als Beleidigung unserer Bemühungen angesehen werden."
  me_scythia_01_greek_stance.67.a:0 "Unsere Bemühungen waren ein voller Erfolg!"
  me_scythia_01_greek_stance.67.at:0 "#Y Maeotia#! wird ein #Y Stammesvasall#! von #Y Skythien#!."
  me_scythia_01_greek_stance.67.b:0 "Diese Allianz wird sicherlich für beide Seiten von Vorteil sein."
  me_scythia_01_greek_stance.67.bt:0 "#Y Maeotia#! wird ein #Y Verbündeter#!."
  me_scythia_01_greek_stance.67.c:0 "Sie werden den Tag bereuen, an dem sie uns verschmäht haben!"
  me_scythia_01_greek_stance.67.ct:0 "Unsere Bemühungen blieben erfolglos..."
  me_scythia_01_greek_stance.68.t:0 "$scythia_mission_01_greek_stance_task_20$: Bote aus Skythien"
  me_scythia_01_greek_stance.68.desc:0 "Abgesandte der skythischen Nation sind eingetroffen und haben eine Botschaft ihres Herrschers überbracht."
  me_scythia_01_greek_stance.68.desc_1:0 "Sie bieten uns eine große Menge Silber und Gold an, um uns für ihre Sache zu gewinnen. Ihr Herrscher sucht nach militärischen Verbündeten und Söldnern."
  me_scythia_01_greek_stance.68.desc_2:0 "\nSie bieten uns eine angemessene Anzahl von Sklaven an, um uns für ihre Sache zu gewinnen. Ihr Herrscher ist auf der Suche nach militärischen Verbündeten und Handelspartnern."
  me_scythia_01_greek_stance.68.desc_3:0 "Auch wenn ihre Worte lieblich klingen, haben sie doch kaum Geschenke oder Bestechungsgelder zu bieten."
  me_scythia_01_greek_stance.68.a:0 "Ihre Geschenke werden gerne angenommen und für den Bau einer neuen Stadt verwendet. Stellt eine Schar von Kriegern zusammen, die sie als Söldner einsetzen können."
  me_scythia_01_greek_stance.68.at:0 "#Y Skythien#! erhält eine Söldnerarmee."
  me_scythia_01_greek_stance.68.b:0 "Vielleicht wird ein Militärbündnis sie besänftigen und uns im Gegenzug Vorteile bieten?"
  me_scythia_01_greek_stance.68.bt:0 "#Y Tyrgetae#! wird ein #Y Verbündeter#! von #Y Skythien#!."
  me_scythia_01_greek_stance.68.c:0 "Wir werden ihnen nichts anbieten."
  me_scythia_01_greek_stance.68.ct:0 "Die Diplomaten sind enttäuscht und ihr Herrscher möglicherweise beleidigt."
  me_scythia_01_greek_stance.69.t:0 "$scythia_mission_01_greek_stance_task_20$: Antwort von Tyrgetae"
  me_scythia_01_greek_stance.69.desc:0 "Die Botschafter von Tyrgetae sind mit ihrer Antwort eingetroffen."
  me_scythia_01_greek_stance.69.desc_1:0 "\nTolle Neuigkeiten! Eine zusammengewürfelte Söldnerarmee aus Tyrgeten, Geten und Bastarnern wird unter unsere Führung gestellt. Ihre Schwerter und Speere werden uns bei unseren Expansionsbestrebungen gute Dienste leisten."
  me_scythia_01_greek_stance.69.desc_2:0 "\nDie Tyrgetaer haben klugerweise ein Militärbündnis mit uns geschlossen."
  me_scythia_01_greek_stance.69.desc_3:0 "\nSie haben unsere diplomatischen Angebote abgelehnt und bieten uns nichts an."
  me_scythia_01_greek_stance.69.a:0 "Ein voller Erfolg! Die Hellenen werden schon bald in die Knie gehen."
  me_scythia_01_greek_stance.69.at:0 "#Y Skythien#! erhält eine Armee von #Y Tyrgetae#!."
  me_scythia_01_greek_stance.69.b:0 "Ein Bündnis zum gegenseitigen Nutzen, sicherlich."
  me_scythia_01_greek_stance.69.bt:0 "#Y Tyrgetae#! wird ein #Y Verbündeter#!."
  me_scythia_01_greek_stance.69.c:0 "Diese Kleinigkeit wird nicht vergessen."
  me_scythia_01_greek_stance.69.ct:0 "Wir haben nichts gewonnen."
  me_scythia_01_greek_stance.75.t:0 "$scythia_mission_01_greek_stance_task_21$: Das Schicksal von Pantikapaion"
  me_scythia_01_greek_stance.75.desc:0 "Pantikapaion, die Heimat der herrschenden Archonten der Bosporaner, beugt sich nun unter unserer Klinge. Die Bosporaner haben sich uns auf jedem Schritt unseres Weges zum Wiederaufbau unseres Erbes in den Weg gestellt und sind daher ein gefährlicher Feind, den man nicht am Leben lassen sollte. Sollen wir diese Griechen ihrem Schicksal überlassen?"
  me_scythia_01_greek_stance.75.a:0 "Mögen sie unseren Plänen zugutekommen."
  me_scythia_01_greek_stance.75.b:0 "Wir machen es dem Erdboden gleich."
  me_scythia_01_greek_stance.75.c:0 "Pantikapaion ist eine vergangene Erinnerung."
  me_scythia_01_greek_stance.76.t:0 "$scythia_mission_01_greek_stance_task_21$: Spartokidisches Blut"
  me_scythia_01_greek_stance.76.desc:0 "Das Bosporanische Königreich wurde unter den Hufen unserer tobenden Horde zermalmt. Seine Gebäude liegen in Trümmern, und sein Volk kauert vor den großen Pferdefürsten. Ein Soldat ist zum General zurückgekehrt und hat das letzte Mitglied der Spartokiden-Dynastie mitgebracht, in dessen Adern noch immer das Blut der ursprünglichen Spartokiden fließt. Was soll nun aus diesem Kriegsgefangenen werden?"
  me_scythia_01_greek_stance.76.a:0 "Die Spartokiden haben sich als würdige Gegner erwiesen. Wenn wir sie verschonen, werden sie uns künftig als Berater zur Seite stehen."
  me_scythia_01_greek_stance.76.b:0 "Wir machen der Spartokiden-Dynastie ein für alle Mal ein Ende. Ihr Vermächtnis ist die Asche ihrer Stadt."
  me_scythia_01_greek_stance.77.t:0 "$scythia_mission_01_greek_stance_task_22$"
  me_scythia_01_greek_stance.77.desc:0 "Unsere jüngste Expansion hat eine Reihe administrativer Herausforderungen mit sich gebracht. Angesichts der einheimischen Bevölkerung, die unter der neuen Herrschaft leidet, und ihres tief verwurzelten Widerstands gegen die Aufgabe ihrer Traditionen erweisen sich die unter unserer Herrschaft stehenden Hellenen als schwer zu bändigen. Bevor es zu einem ernsthaften Aufstand kommen kann, sollten wir an ihnen ein Exempel statuieren. Unsere Reiter können ihr Land plündern und ihre Städte dem Erdboden gleichmachen. Sobald ihr Kampfgeist gebrochen ist, lassen sie sich leichter kontrollieren."
  me_scythia_01_greek_stance.77.a:0 "Gebt den Befehl. Lasst ihre Städte brennen, nachdem wir sie ihrer wertvollen Güter beraubt haben."
  me_scythia_01_greek_stance.77.at:0 "Bis zu 4 Städte, die wir kontrollieren, werden zu Siedlungen reduziert."
  me_scythia_01_greek_stance.78.t:0 "$scythia_mission_01_greek_stance_task_13$"
  me_scythia_01_greek_stance.78.desc:0 "Unser Herrschaftsgebiet leidet unter der Uneinigkeit unserer zahlreichen Nomadenstämme und der Zersplitterung unseres Volkes. Indem wir dies beenden, schaffen wir eine geschlossener Nation, über die wir herrschen können, und jeder Reiter kann seinen Nachbarn als Bruder oder Schwester betrachten – jeder Krieger kann den Soldaten zu seiner Linken und Rechten als ein Abbild seiner selbst sehen."
  me_scythia_01_greek_stance.78.a:0 "Gemeinsam sind wir stärker."
  me_scythia_01_greek_stance.78.at:0 "$mission_task_completed_tt_1$ '$scythia_mission_01_greek_stance_task_13$' $mission_task_completed_tt_2$"

###TARGITAOAN GAMES START###

 
  me_scythia_01_greek_stance.80.t:0 "Die Targitaoischen Spiele"
  me_scythia_01_greek_stance.80.desc:0 "Die grasbewachsenen Hügel rund um [SCOPE.sP('scythian_games_province_scope').GetName] liegen kahl bereit, um die vielen Wettkämpfe zu beherbergen, bei denen wir Nomaden seit Jahrhunderten gegeneinander antreten. \n\nDie Kreise für die Ringkampfwettkämpfe sind gezogen, Markierungen säumen die offenen Felder, auf denen Pferd und Reiter gegeneinander antreten werden, und die zu jagenden Hasen stehen bereit, aus ihren Käfigen freigelassen zu werden.\n\nUnsere Gäste strömen bereits aus der gesamten eurasischen Steppe und von überall her, wo die Targitaos Männer und Frauen hervorgebracht haben.\n\nKommt alle herbei, die Spiele der Pferdefürsten sollen beginnen!"
  me_scythia_01_greek_stance.80.a:0 "Ladet alle umherziehenden Stämme ein, ihre besten Krieger zu entsenden."
  me_scythia_01_greek_stance.80.b:0 "Wenn man es sich recht überlegt, sind wir noch nicht bereit, so viele Menschen innerhalb unserer Grenzen aufzunehmen."
  me_scythia_01_greek_stance.82.t:0 "$me_scythia_01_greek_stance.80.t$"
  me_scythia_01_greek_stance.82.desc:0 "Die Pferdefürsten am großen Meer haben uns mit dem Versprechen von Spielen und Belohnungen eingeladen, wenn wir unseren besten Wettkämpfer entsenden.\n\nSie sagen, sie hielten an der Tradition fest und würden eine fantastische Reihe von Spielen veranstalten, die die alten Bräuche ehren. Wenn wir daran teilnehmen wollen, ist es unser Brauch, die stolzesten und fähigsten jungen [ROOT.GetCountry.GetAdjective]en Athleten zu entsenden, um in unserem Namen anzutreten.  Wir glauben, dass wir zwei ideale Kandidaten gefunden haben; ein [SCOPE.sChar('targitaoan_games_champion').Custom('get_godly_description')] mit dem Namen [SCOPE.sChar('targitaoan_games_champion').GetPraenomen] und ein [SCOPE.sChar('targitaoan_games_champion_2').Custom('get_godly_description')], der [SCOPE.sChar('targitaoan_games_champion_2').GetHerselfHimself] [SCOPE.sChar('targitaoan_games_champion_2').GetPraenomen] ruft. Welchen dieser guten Athleten sollten wir zu den Spielen schicken?"
  me_scythia_01_greek_stance.82.a:0 "Schickt [SCOPE.sChar('targitaoan_games_champion').GetPraenomen]!"
  me_scythia_01_greek_stance.82.b:0 "Entsenden wir [SCOPE.sChar('targitaoan_games_champion_2').GetPraenomen]."
  me_scythia_01_greek_stance.82.c:0 "Wir werden an keinen Spielen teilnehmen, die von denen veranstaltet werden, die behaupten, unsere Könige zu sein."
  me_scythia_01_greek_stance.84.t:0 "$me_scythia_01_greek_stance.80.t$: Die Targitaoischen Spiele enden"
  me_scythia_01_greek_stance.84.desc:0 "Die glorreichen Targitaoischen Spiele sind mit viel Jubel und Feierlichkeiten zu Ende gegangen. Zwischen den Wagenrennen, Ringkämpfen und Kumis-Trinkwettbewerben ist es schwierig, einen Lieblingsmoment auszuwählen. \n \nDer Höhepunkt der Spiele war jedoch während der Hasenjagd, als weit und breit Hufgedonner zu hören war, als Pferdeschwadronen auf den einzigen silbernen Hasen zustürmten. \n\nWir waren alle überrascht, als [SCOPE.sChar('victorious_competitor').GetName] von [SCOPE.sC('victor_origin_country').GetName] an [SCOPE.sChar('highlight_competitor_2').GetName] von [SCOPE.sC('highlight_2_origin_country').GetName] vorbeistürmte und geschickt [SCOPE.sChar('victorious_competitor').GetHerHis]en Speer durch den Hals der Kreatur schleuderte. Zweifellos wird [SCOPE.sC('highlight_2_origin_country').GetName] als Champion der TTargitaoischen Spiele in die Annalen der Geschichte eingehen!"
  me_scythia_01_greek_stance.84.desc_2:0 "Die glorreichen Targitaoischen Spiele sind mit viel Jubel und Feierlichkeiten zu Ende gegangen. Die diesjährige Veranstaltung war jedoch aufgrund des Todes des posthumen Siegers [SCOPE.sChar('victorious_competitor').GetName] von Trauer überschattet. Unwillig, im Angesicht des Todes aufzugeben, kämpfte [SCOPE.sChar('victorious_competitor').GetSheHe] bis zum bitteren Ende gegen [SCOPE.sChar('victorious_competitor').GetHerHis]en Gegner in einem der kriegerischen Disziplinen und wurde aufgrund dieser mildernden Umstände ehrenhaft zum Sieger erklärt. \n\nTrotzdem zogen viele andere Wettbewerbe zahlreiche Zuschauer an, wobei ein besonders denkwürdiger Wettbewerb [SCOPE.Custom('get_olympic_highlight')] war"
  me_scythia_01_greek_stance.84.a:0 "Lob sei [SCOPE.sChar('victorious_competitor').GetPraenomen]!"
  me_scythia_01_greek_stance.84.b:0 "Naja, mehr Glück beim nächsten Mal."
  me_scythia_01_greek_stance.84.c:0 "Eine großartige Veranstaltung!"
  me_scythia_01_greek_stance.85.t:0 "Hippodrom verlassen"
  me_scythia_01_greek_stance.85.desc:0 "Es scheint, dass kaum jemand zu den Targitaoischen Spielen erschienen ist, und die Veranstaltung musste abgesagt werden. \n \nDiese Enttäuschung ist ein verheerender Schlag für das Ansehen der Traditionen unseres Landes."
  me_scythia_01_greek_stance.85.a:0 "Wir müssen den mächtigen Zeus irgendwie beleidigt haben."

###TARGITAOAN GAMES END### #nt!


  me_scythia_01_greek_stance.89.t:0 "Aufstieg der königlichen Skythen"
  me_scythia_01_greek_stance.89.desc:0 "Es begann als ein einfacher, unbedeutender Tag. Es gab keinen großen Abschied und keine Fanfaren. Es war einfach ein ganz gewöhnlicher Tag … als unser Herrscher, [ROOT.GetCountry.GetRuler.GetName], mit einer Eskorte aus adligen Anführern, allesamt kampferprobte Krieger, aus [me_scythia_1_scope.GetCapital.GetName] ausritt. Deshalb waren alle überrascht, als sie die königlichen Farben an den Sätteln wehen sahen, während die Schar der Eroberer durch das Reich aus Gras und Getreide ritt. Und deshalb scharten sie sich alle um den Kriegsruf des Kriegers, einen Laut, den nur die Götter inmitten des Lärms heftiger Kämpfe hätten ausstoßen können, und so ergriffen diejenigen, die dazu in der Lage waren, die Zügel ihrer Rösser und ritten dem Ruf hinterher. Und so ging es weiter, während [ROOT.GetCountry.GetRuler.GetName] und die unerschütterlichen Gefährten durch die Landschaft preschten, eine undurchdringliche Staubwolke hinter sich herziehend, die den Schrei der Schlachtrösser trug – ein unbeschreiblicher, Ehrfurcht gebietender Klang, den kein Lebewesen auf Erden hören konnte, ohne entweder in Deckung zu gehen oder sich zu verneigen – das skythische Volk geht nicht in Deckung! Und so, als [ROOT.GetCountry.GetRuler.GetName] nach [me_scythia_1_scope.GetCapital.GetName] zurückgekehrt war, führte [COUNTRY.GetRuler.GetSheHe] die größte Reiterarmee, die die Welt je gesehen hatte, durch die Tore, und so lag die Eroberung der ganzen Welt vor ihnen … Sie mussten sie sich nur noch nehmen."
  me_scythia_01_greek_stance.89.a:0 "Wir können nur nach vorne schauen."
  me_scythia_01_greek_stance.100.t:0 "$scythia_mission_01_greek_stance_task_25$: Sammeln von Geldern"
  me_scythia_01_greek_stance.100.desc:0 "Wenn wir unseren Blick auf benachbarte Länder und Völker richten, wird deutlich, dass auf unserem Weg viele Herausforderungen auf uns warten. Um diese zu bewältigen, brauchen wir starke Männer und Frauen in unseren Reihen – wahre Herren der Steppe. Doch die königlichen Schatzkammern sind begrenzt. Es ist an der Zeit, dass ich dem Oberhaupt jeder großen Familie einen Besuch abstehe."
  me_scythia_01_greek_stance.100.a:0 "Sie alle schulden mir ihre Unterstützung."
  me_scythia_01_greek_stance.100.b:0 "Ich nehme vom Stärksten."
  me_scythia_01_greek_stance.100.c:0 "Ich werde sie alle gegeneinander ausspielen."
  me_scythia_01_greek_stance.101.t:0 "$scythia_mission_01_greek_stance_task_25$: Ausbildung einer Armee"
  me_scythia_01_greek_stance.101.desc:0 "Jetzt, da wir die nötigen Mittel haben, müssen wir mit [SCOPE.sChar('current_warchief').GetName], dem Kriegshäuptling, zusammenarbeiten, um die Trainingseinrichtungen einzurichten und unsere große Horde aufzubauen. Nach langen Tagen der Beratung haben sie uns einige Optionen vorgelegt. Der einfachste Weg wäre die traditionelle Ausbildung, bei der [SCOPE.sChar('current_warchief').GetName] die Soldaten selbst ausbildet, wie es seine Aufgabe ist. Obwohl [SCOPE.sChar('current_warchief').GetName], ein kampferprobter Krieger und ein kompetenter Anführer ist, kennt er seine Grenzen. Uns wurden zwei Alternativen angeboten: \n\nDurch den ständigen Kontakt, den wir mit den hellenischen Stadtstaaten an der Küste haben, haben wir von den Heldentaten und der Tapferkeit ihrer Krieger gehört, und sogar davon, dass sie sich oft für den richtigen Preis als Söldner an jeden verkaufen. [SCOPE.sChar('current_warchief').GetName] verfügt über einige private Kontakte und kann eine Söldnertruppe zusammenstellen, die bei der Ausbildung der Truppen hilft und an ihrer Seite kämpft – allerdings gegen Bezahlung und im Austausch gegen etwas Land\n\nEine weitere Möglichkeit, so seltsam sie auch sein mag, wäre, sich auf Gerüchte und Berichte über einen seltsamen Mann zu verlassen – einen Pferdefürsten wie wir selbst, der mit nichts als einem Bogen und seiner Stute durch die nördlichen Gebiete streift, ihr Wasser trinkt und auf ihrem Rücken jagt.  [SCOPE.sChar('current_warchief').GetName] glaubt, dass sie diesen Mann finden und dazu bewegen können, die Armeen auszubilden und anzuführen – doch sicherlich wird er ungewöhnliche Bedingungen stellen..."
  me_scythia_01_greek_stance.101.a:0 "Unsere Wege haben uns über Generationen gute Dienste geleistet."
  me_scythia_01_greek_stance.101.b:0 "Fremde Söldner können sich als sehr nützlich erweisen."
  me_scythia_01_greek_stance.101.c:0 "Wir müssen versuchen, diesen Mann um jeden Preis zu finden."
  me_scythia_01_greek_stance.101.ct:0 "Ein äußerst mächtiger Feldherr wird an deinem Hof erscheinen, um deine Soldaten auszubilden."
  me_scythia_01_greek_stance.104.t:0 "$scythia_mission_01_greek_stance_task_26$: Sicherheitsmaßnahmen"
  me_scythia_01_greek_stance.104.desc:0 "Ihr Leibwächter, [SCOPE.sChar('current_bodyguard').GetName], kommt in den Abendstunden zu Ihnen und äußert sich zu Ihren Vorbereitungen, mit denen Ihr die Soldaten auf den Angriff auf die vielen umliegenden Stadtstaaten vorbereitet. [SCOPE.sChar('current_bodyguard').GetName] weist jedoch darauf hin, dass wir selbst sehr anfällig für einen Angriff sind, falls es jemals zu so etwas kommen sollte. Er sorgt sich um Ihre Sicherheit und die des Adels.\n\nZwar könnten wir versuchen, unsere Grenzen und unsere Hauptstadt auf die uns vertraute Weise zu verteidigen, doch wäre es vielleicht klug, die Griechen zu konsultieren, die sich so gut befestigen, und einen bedeutenden Festungsbauer zu beauftragen, uns zu beraten."
  me_scythia_01_greek_stance.104.a:0 "Wir brauchen keine Hilfe."
  me_scythia_01_greek_stance.104.b:0 "Vielleicht ist ein Rat am besten."
  me_scythia_01_greek_stance.104.c:0 "Stellt den Griechen ein, aber wir werden auch unsere Verteidigung aufbauen."
  me_scythia_01_greek_stance.108.t:0 "$scythia_mission_01_greek_stance_task_27$: Die Lage vor Ort"
  me_scythia_01_greek_stance.108.desc:0 "Unser Schlichter, [SCOPE.sChar('current_arbitrator').GetName], wurde ausgesandt, um sicherzustellen, dass die Ackerflächen ohne Streit zwischen den Männern und Frauen, die dort Getreide anbauen, gut bewirtschaftet werden. [SCOPE.sChar('current_arbitrator').GetName] ist jedoch zu Bewusstsein gekommen, dass an mehreren Stellen weidende Herden in das reiche Land am Flussufer vordringen. Mehrere Familien klagen über Ernteschäden und zertrampelte Felder.\n\nWir möchten, dass unser Handel mit Getreideüberschüssen zunimmt, doch dabei ist es schwierig, die Viehzüchter und ihre Lebensweise als Nomaden nicht zu verärgern – das ist unsere Lebensweise hier in den sanften Hügeln und den endlosen Ebenen. Was sollen wir tun?"
  me_scythia_01_greek_stance.108.a:0 "Helft den Hirten und ihren wandernden Tieren."
  me_scythia_01_greek_stance.108.b:0 "Unsere Wirtschaft beruht auf unserem Reichtum an überschüssigem Getreide"
  me_scythia_01_greek_stance.108.c:0 "Befestigt die Felder und vertreibt die Hirten."
  me_scythia_01_greek_stance.112.t:0 "$scythia_mission_01_greek_stance_task_28$: Ein freundlicherer Fisch im Teich"
  me_scythia_01_greek_stance.112.desc:0 "Unser Amtsträger, [SCOPE.sChar('current_magistrate').GetName], interessiert sich seit langem  für die stetig wachsende, beliebte Region Limnaioi, die an einer großen Bucht liegt, einem Hafen für Handelsschiffe, an denen sie anlegen und ihre Waren handeln können. [SCOPE.sChar('current_magistrate').GetName] besteht darauf, dass dieser Ort der beste Standort für eine Handelshafenstadt wäre, die unsere Wirtschaft stärken könnte. [SCOPE.sChar('current_magistrate').GetName] hat jedoch auch vorgeschlagen, dass wir die Gründung eines Stadtstaates an diesem Ort sponsern, damit sie ihn zu einem abhängigen Handelspartner machen könnten, der unser Wohltäter wäre. Was ist die beste Vorgehensweise?"
  me_scythia_01_greek_stance.112.a:0 "Limnaioi ist die Ressourcen nicht wert."
  me_scythia_01_greek_stance.112.b:0 "Wir werden die Gründung eines Stadtstaates unter unserer Herrschaft fördern."
  me_scythia_01_greek_stance.112.c:0 "Weist [SCOPE.sChar('current_magistrate').GetName] an, selbst an diesem Lieblingsprojekt zu arbeiten."
  me_scythia_01_greek_stance.112.d:0 "Gebt ihnen das Geld"
  me_scythia_01_greek_stance.112.e:0 "Limnaioi ist genau dort, wo es ist, in Ordnung."
  me_scythia_01_greek_stance.112.f:0 "Weist [SCOPE.sChar('current_magistrate').GetName] an, alles hineinzuschütten."
  me_scythia_01_greek_stance.112.bt:0 "#Y [GetProvince('(int32)4552').GetName]#! erhält eine Reihe von Gebäuden und Einwohnern."



