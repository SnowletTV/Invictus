 steppe_horde_desc:0 "Zwar bestanden die Nomaden in der Steppe im Kern aus einer Vielzahl konkurrierender und voneinander unterscheidbarer Stämme, doch herrschte in der Steppe das Gefühl einer stammesübergreifenden Verbundenheit und eines hierarchischen Netzwerks. An der Spitze dieser Hierarchie standen die herrschenden Stämme und ihre monarchischen Oberhäupter aus den mächtigsten Familien, die eine gewisse Kontrolle und Gerichtsbarkeit über alle untergeordneten Stämme ausübten."

