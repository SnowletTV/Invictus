l_german:

01_shan: "Die Herren der Shan-Hügel"
01_shan_DESCRIPTION: "Unser Volk, die #E Shan#!, lebt dort, wo das östliche Hochland zu den fruchtbaren Auen des #E Irrawaddy-Tals#! abfällt. Unsere Hügel sind reich an Eisenerz und werden von Gebirgsbächen bewässert, doch unsere relative Isolation hat dazu geführt, dass unsere Stämme gespalten blieben, während sich die #E Pyu#! in den Tälern darunter ausbreiteten.\n\nDa [ROOT.GetCountry.GetRuler.GetName|E] spürt, dass eine Zeit des Wandels bevorsteht, hat er geschworen, die Hügeltämme unter einem einzigen Banner zu vereinen, in die Ebenen vorzustoßen und [ROOT.GetCountry.GetName|E] aus seiner nebelverhangenen Heimat bis vor die Tore von #E Indien#! zu führen. Wenn die #E Nat#! unseren Feldzug unterstützen und an unserer Seite in die Schlacht ziehen, werden die Täler selbst vor unseren herannahenden Heeren erbeben!
01_shan_CRITERIA_DESCRIPTION: "Diese Mission gilt als abgeschlossen, wenn [ROOT.GetCountry.GetName] das #E Shan#!-Hochland vereint, das #E Irrawaddy-Tal#! und #E Samatata#! erobert und das Königreich #E Pong#! gegründet hat."
01_shan_BUTTON_TOOLTIP: "Die Hügel haben uns lange genug Schutz geboten … nun sollen die Täler unseren Namen kennenlernen."

#Missions

01_shan_task_1: "Shan sichern"
01_shan_task_1_DESC: "Die Hügel rund um [GetProvince('(int32)8808').GetName|Y] trennen uns von unseren Nachbarn, doch nun ist die Zeit gekommen, die feindlichen #E Pyu#!-Stämme in den westlichen Überschwemmungsgebieten anzugreifen. [ROOT.GetCountry.GetRuler.GetName|Y] strebt die Eroberung ihrer Gebiete für [ROOT.GetCountry.GetName|T] an und hat unseren Soldaten befohlen, sich in den kommenden Tagen auf den Krieg vorzubereiten. \n\n\n\n\n\n\n\n\n\n@india_mil19!"

01_shan_task_2: "Die Eisenminen von #E Myitnge#!"
01_shan_task_2_DESC: "In den Hügeln von [GetProvince('(int32)8806').GetName|Y] gibt es Eisen @iron! zu finden, und die Stammesangehörigen von [ROOT.GetCountry.GetName|T] benötigen alles davon. Sobald unser Bergbau in vollem Gange ist, werden wir unsere Aufgebote mit besseren Waffen ausstatten.\n\n\n\n\n\n\n\n\n\n@india_mil8!"

01_shan_task_3: "Die Armee versorgen"
01_shan_task_3_DESC: "Ein Aphorismus, den die [ROOT.GetCountry.GetAdjective]en Weisen immer wieder wiederholen, steht bei [ROOT.GetCountry.GetRuler.GetName|Y] stets im Vordergrund: 'Ein Narr kann nur einen von zwei Klängen hören: den Fanfarenstoß oder das Knurren im Magen des Soldaten.' Geleitet von dieser alten Weisheit ist für [ROOT.GetCountry.GetName|Y] die Zeit gekommen, zu säen und zu ernten, denn unsere wachsenden Heere benötigen Nachschub.\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

01_shan_task_4: "Vorstoß nach Westen"
01_shan_task_4_DESC: "Die Götter des Sieges reiten an der Seite von [ROOT.GetCountry.GetRuler.GetName|Y] und drängen den [ROOT.GetCountry.GetAdjective|Y]en  [ROOT.GetCountry.GetRulerTitle|T], unsere Feinde im Westen zu besiegen. Die Zeit ist gekommen, unsere Truppen aufzustellen und die #Y Pyu#!-Stämme im #G Irrawaddy-Tal#! ein für alle Mal zu vertreiben!\n\n\n\n\n\n\n\n\n\n@india_mil23!"

01_shan_task_5: "Pu Leatherworks"
01_shan_task_5_DESC: "[ROOT.GetCountry.GetCapital.GetName|Y] macht sich zunehmend einen Namen für die hervorragende Qualität des Leders @leather!, das in seinen Werkstätten hergestellt wird.\n\n\n\n\n\n\n\n\n\n@india_mil6!"

01_shan_task_6: "Invasion des Dschungels"
01_shan_task_6_DESC: "Da das #G Irrawaddy-Tal#! nun fest in unserer Hand ist, ist es an der Zeit, unseren Blick nach außen zu richten. Die Dschungel im Norden und Süden werden für unsere Männer, die [ROOT.GetCountry.GetCapital.GetName|Y] unzählige Siege beschert haben, kein Hindernis darstellen. Es ist an der Zeit, unsere Eroberungszüge zu beginnen!\n\n\n\n\n\n\n\n\n\n@india_mil12!"

01_shan_task_7: "Die nördliche Migration"
01_shan_task_7_DESC: "Die Gebiete nördlich von uns sind wertvoll, aber relativ abgelegen und unbewohnt – doch nun ist es an der Zeit, dass sich dies ändert. [ROOT.GetCountry.GetRuler.GetName|Y] hat in ganz [ROOT.GetCountry.GetName|Y] bekannt gegeben, dass unser Volk Siedler braucht, die bereit sind, ihr bisheriges Leben aufzugeben, um etwas Besseres zu suchen, und zum Glück für [ROOT.GetCountry.GetRuler.GetHerHim] sind viele diesem Aufruf gefolgt.\n\n\n\n\n\n\n\n\n\n@india_mil14!"

01_shan_task_8: "Jademinen von #E Myitkyina#!"
01_shan_task_8_DESC: "Die seltene Handelsware Jade @jade! ist in der Provinz [GetProvince('(int32)8813').GetName|Y] zu finden, und [ROOT.GetCountry.GetRuler.GetName|Y] hat verlangt, dass wir unsere Mittel in diese Region investieren – wir müssen dort unverzüglich eine Mine errichten.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

01_shan_task_9: "Kuji'i Nat"
01_shan_task_9_DESC: "In den übelriechenden Gewässern der Sumpfgebiete von [GetProvince('(int32)8770').GetName|G] erinnert der tödliche Upas-Baum eindringlich an die Macht von [GetDeityDefinition('omen_kujii').GetName|T], dem #G Nat des Krieges#!, der diejenigen beschützt, die seinen Segen suchen. Indem [ROOT.GetCountry.GetCapital.GetName|Y] dem Nat in [ROOT.GetCountry.GetCapital.GetName|Y] eine angemessene Bleibe schafft, hofft [ROOT.GetCountry.GetRuler.GetName|Y], dass wir die göttliche Gunst für unser Volk sichern können.\n\n\n\n\n\n\n\n\n\n@greek_mil3!"

01_shan_task_10: "Nikam Nat"
01_shan_task_10_DESC: "[ROOT.GetCountry.GetRuler.GetName|Y] has [ROOT.GetCountry.GetRuler.GetHerHis] eye on establishing a permanent legacy within [ROOT.GetCountry.GetName|Y]. With the kingdom of #T Pong#! established, a magnificent temple for the #Y Nats#! in [ROOT.GetCountry.GetCapital.GetName|Y] will bind our new realm to our divine protectors and ensure that [ROOT.GetCountry.GetRuler.GetHerHis] name remains unforgotten by our descendants.\n\n#R Converting to another faith will disable this task.#!\n\n\n\n\n\n\n\n\n\n@persia_mil7!"

01_shan_task_11: "Unstoppable Advance"
01_shan_task_11_DESC: "The undefeated armies of [ROOT.GetCountry.GetRuler.GetName|Y] have seized enough territory within the jungles of [GetProvince('(int32)7352').GetArea.GetName|Y] and [GetProvince('(int32)8768').GetArea.GetName|Y] that marching into [GetProvince('(int32)7401').GetArea.GetName|Y] seems a foregone conclusion at this point.\n\nA large force of #R War Elephants#! have been raised within [ROOT.GetCountry.GetCapital.GetName|Y] - the personal army of our majestic leader. While these beasts might be expensive to maintain, they will be an effective fighting force against our enemies.\n\n\n\n\n\n\n\n\n\n@india_mil16!"

01_shan_task_12: "Seizing Samatata"
01_shan_task_12_DESC: "Not only is [ROOT.GetCountry.GetRuler.GetName|Y] the undisputed authority of all [ROOT.GetCountry.GetName|Y], but the commands of our [ROOT.GetCountry.GetRulerTitle|T] are even obeyed in the cities of [GetProvince('(int32)7401').GetArea.GetName|Y].\n\n\n\n\n\n\n\n\n\n@india_mil22!"

01_shan_task_13: "The Purification Of Halin"
01_shan_task_13_DESC: "Although the inhabitants of [GetProvince('(int32)8778').GetName|Y] have abandoned the #T Natic Faith#!, [ROOT.GetCountry.GetRuler.GetName|Y] has vowed to see the Nats return to the holy site located within the city.\n\n\n\n\n\n\n\n\n\n@india_mil5!"

01_shan_task_14: "Indian Trade"
01_shan_task_14_DESC: "The #G Irrawaddy Valley#! grows fruits @fruits! that are exceedingly rare, like the rambutan and banana, and our friends across the Sea are very interested in importing our produce. Let us do what we can to encourage our connections abroad - the city of [GetProvince('(int32)7395').GetName|Y] is a trade hub for the region, and it is said that their people are amenable to making deals with foreigners.\n\n#Y This mission will be bypassed if we own#! [GetProvince('(int32)7395').GetName|G] #Y or if it is our subject#!. \n\n\n\n\n\n\n\n\n\n@india_mil1!"

01_shan_task_15: "Brothers In Arms"
01_shan_task_15_DESC: "The #T Pyu#! tribes live in isolated pockets within the #G Irrawaddy Valley#!, and although many of them have embraced heretical #T Bon#! beliefs, [ROOT.GetCountry.GetRuler.GetName|Y] believes that it is possible for our people to coexist in a state of peace. Are we not stronger together?\n\n#Y We will make a decision regarding the status of the#! #T Pyu Culture#!. \n\n\n\n\n\n\n\n\n\n@india_mil20!"


#Tooltips
you_need_to_form_pong_tt: "We need to take the decision to #T Form Pong#!."
shan_leather_tt: "#Y We must have a surplus of at least#! #T 2 Leather @leather!#! #Y in our capital#!."
claims_pracya_tibet_tt: "We will receive claims on the regions of #Y Tibet#! and #Y Pracya#!."
shan_two_farms_tt: "We need at least #Y 2#! #T Farms#! within our country."
shan_kujii_omen_active_tt: "[ROOT.GetCountry.GetName] must have the #Y Kuji'i Nat Omen#! #T Active#!."
shan_divine_sacrifice_tt: "We need to use the #T Perform Divine Sacrifice#! Religious Interaction."
shan_halin_religious_investment_tt: "We need the #T Make Religious Endowments#! Province Investment in the province of #Y Pyu#!."
shan_two_loyal_clan_chiefs_tt: "We must have #Y 2#! #T Clan Chiefs#! with a loyalty of at least #E 75#!."

#Modifiers

shan_slave_mine_mod: "Mines Of Myitnge"
desc_shan_slave_mine_mod: "The iron-bearing hills of Myitnge have been opened by Shan miners, providing a steady supply of ore for the kingdom's smiths."
shan_farm_bonus_mod: "Granaries Of The Shan Hills"
desc_shan_farm_bonus_mod: "New farms and storehouses ensure that the armies descending from the Shan highlands will march with full bellies."
shan_leatherworks_mod: "Pu Leatherworks"
desc_shan_leatherworks_mod: "The tanners and leatherworkers of Pu have earned renown for outfitting warriors in tough, supple hides."


#Events
me_shan_1_title: "$01_shan_task_1$"
me_shan_1_desc: "For generations, the valleys and ridges of #E Shan#! have been divided among quarrelsome clans, each guarding its own fields, paths and iron deposits with jealous determination. Feuds that began over a stolen buffalo or an insult delivered by some long-dead chieftain still demand blood from men who can no longer remember the names of those first offended. How can a tribe enslaved by such foolish obligations to the past hope to build a future?\n\n[ROOT.GetCountry.GetRuler.GetName] has summoned the clan elders to [ROOT.GetCountry.GetCapital.GetName] and offered them a simple choice; set aside their petty wars and march together beneath the banner of [ROOT.GetCountry.GetName], or be remembered as the first enemies crushed beneath it. Most bent the knee before sunset, and those who did not have given our young warriors an opportunity to prove their courage. Yet even now, [SCOPE.sCharacter('clan_chief_one').GetName] and [SCOPE.sCharacter('clan_chief_two').GetName] quarrel over who deserves the honor of leading our first great campaign. Each insists that the clans will follow no other into battle."
me_shan_1.a: "The vanguard belongs to [SCOPE.sCharacter('clan_chief_one').GetName]"
me_shan_1.b: "[SCOPE.sCharacter('clan_chief_two').GetName] shall lead the descent"
me_shan_1.c: "You will march together, and both of you will march behind me!"
me_shan_1_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_1$#!' $mission_completed_tooltip_2$"

me_shan_2_title: "$01_shan_task_2$"
me_shan_2_desc: "The old men of [GetProvince('(int32)8806').GetName] have always claimed that the hills possess iron bones - something that always sounded strange to [ROOT.GetCountry.GetRuler.GetName], but now the [ROOT.GetCountry.GetRulerTitle] understands the ancient wisdom. Until now, the ore was gathered from shallow pits and lonely outcrops - enough for a woodcutter's axe or a chieftain's blade, but never enough to arm a kingdom.\n\nUntil now. At [ROOT.GetCountry.GetRuler.GetFirstName]'s command, miners have followed the dark seams buried deep beneath the hills. Furnaces now glow through the night, their smoke curling above the trees while [ROOT.GetCountry.GetAdjective] smiths hammer out spearheads, swords and arrow-points by the cartload. Myitnge has surrendered its bones to us, and soon our enemies will feel their edge."
me_shan_2.a: "Let every warrior carry weapons of iron!"
me_shan_2_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_2$#!' $mission_completed_tooltip_2$"

me_shan_3_title: "$01_shan_task_3$"
me_shan_3_desc: "A hungry army is merely a crowd of armed complainers, and even the boldest Shan warrior cannot eat glory. Remembering this truth, [ROOT.GetCountry.GetRuler.GetName] ordered productive fields cleared wherever the soil was deep and dark, and a small army of workers carrying heavy iron tools attacked the weeds with a grim abandon.\n\nThe sweat of their brow has paid dividends. The first harvest has now arrived at [ROOT.GetCountry.GetCapital.GetName]. Baskets of fruit @fruits!, sacks of grain @grain! and lowing livestock @cattle! fill the market stalls, and the soldiers joke that [ROOT.GetCountry.GetRuler.GetFirstName] intends to conquer the world by feeding it.\n\nLet them laugh. When the campaign begins and our enemies discover empty storehouses behind them, they will understand why the armies of [ROOT.GetCountry.GetName] counted ploughs as carefully as their spears."
me_shan_3.a: "The call to battle sounds better on a full stomach, don't you agree?"
me_shan_3_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_3$#!' $mission_completed_tooltip_2$"

me_shan_4_title: "$01_shan_task_4$"
me_shan_4_desc: "The western slopes no longer mark the edge of our ambitions. From their summits, [ROOT.GetCountry.GetRuler.GetName] can see the hazy floodplains of the #E Irrawaddy Valley#! stretching toward the horizon; broad rivers, crowded settlements and fields richer than any found among our hills. There is even a city, [GetProvince('(int32)8778').GetName] - something that is execeptionally rare in these parts.\n\nThe #E Pyu#! foolishly believe the mountains will keep us penned in forever, and they mistake our patience for fear. Good - let them think what they will. Already our scouts have marked the passes and our clan levies gather beneath the standards of [ROOT.GetCountry.GetName]. We shall descend like a knife thrust - sudden and impossible to turn aside."
me_shan_4.a: "Down from the hills and into history!"
me_shan_4_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_4$#!' $mission_completed_tooltip_2$"

me_shan_5_title: "$01_shan_task_5$"
me_shan_5_desc: "Scrape, scrape, scrape. The workshops of [ROOT.GetCountry.GetCapital.GetName] ring with a gentler music than the hammering of our smithies, though their work is no less important. Tanners soak and cure the hides @leather! brought in from every corner of [ROOT.GetCountry.GetName], while our hardworking leatherworkers cut them into shields, harnesses, boots and armor. The smell of the tanner's urine vats burns the nostrils and causes most to stay away from their district, yet the workers themselves seem immune to the foul air and labor silently beneath the sun.\n\nTheir skill has made the leather of #E Pu#! famous far beyond the Shan hills. Merchants from abroad compete for whatever the army does not require, and prosperous craftsmen have begun raising fine houses beside their workshops. What began as a means of clothing our warriors has become an industry worthy of our capital."
me_shan_5.a: "Our men deserve nothing but the best"
me_shan_5_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_5$#!' $mission_completed_tooltip_2$"

me_shan_6_title: "$01_shan_task_6$"
me_shan_6_desc: "The conquest of the western plains has transformed [ROOT.GetCountry.GetName]. Tributaries arrive at [ROOT.GetCountry.GetCapital.GetName] bearing grain @grain!, timber @wood! and captives, while warriors who once knew only the paths between neighboring hills now boast of great victories won in the #E Irrawaddy Valley#!.\n\nYet [ROOT.GetCountry.GetRuler.GetName] is not content to recline on cushions and admire yesterday's victories. To the north and south, thick jungles conceal rival realms that are ripe for conquering. Orders have gone out to cut paths through the green wilderness, and where the axe opens a road, the spear shall follow."
me_shan_6.a: "There are kingdoms to conquer waiting beyond those trees..."
me_shan_6_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_6$#!' $mission_completed_tooltip_2$"

me_shan_7_title: "$01_shan_task_7$"
me_shan_7_desc: "Heralds sent north by [ROOT.GetCountry.GetRuler.GetName] have returned at the head of a curious procession, the likes of which have never before been seen in [ROOT.GetCountry.GetName]. There are hundreds gathered outside of the walls of our capital; landless tribesmen hoping for a change of fortune, ambitious younger sons with no inheritance, hunters tired of the jungles, and whole families carrying their possessions in baskets.\n\nThey are united in purpose, for all have accepted the promise of free land if they are willing to settle outside of our current borders. It is known that the journey will be hard. There are no roads leading where we are going, and more than one ambitious settler will turn back after hearing the roar of the tiger beyond the firelight. Yet enough of our people will endure. They shall clear the wilderness, raise villages and teach their children that it was [ROOT.GetCountry.GetRuler.GetFirstName] who opened the north to them."
me_shan_7.a: "Where a Shan hearth is lit, there stands Shan land"
me_shan_7_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_7$#!' $mission_completed_tooltip_2$"

me_shan_8_title: "$01_shan_task_8$"
me_shan_8_desc: "The settlers of [GetProvince('(int32)8813').GetName] have split the northern earth and found green fire sleeping inside it. Great stones of jade @jade!, cloudy and unremarkable beneath their rough skins, emerge beneath the chisels of our workers, who have excitedly sent messages back home describing their incredible discovery.\n\nIn order to honor the #E Nats#! that have blessed us, our miners have sent the best pieces of jade to the workshops in our capital, where our artisans will have their hands full. At [ROOT.GetCountry.GetRuler.GetName]'s command, a master carver worked upon it in secrecy for many months, refusing even to let the [ROOT.GetCountry.GetRulerTitle] see the unfinished masterpiece.\n\nWhen the artifact was finally completed, a lifelike statue of a jade Nat stood within the master's workshop, its polished face seeming almost alive in the lamplight. Some even swear that a low hum fills the room when the sun vanishes beyond the horizon. Our shamans, naturally, insist that this is a blessing and not trapped wind - the Nats are pleased with our offering."
me_shan_8.a: "Even the stones themselves honor the Nats!"
me_shan_8_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_8$#!' $mission_completed_tooltip_2$"

me_shan_9_title: "$01_shan_task_9$"
me_shan_9_desc: "For three nights, [ROOT.GetCountry.GetRuler.GetName] kept vigil before the shrine of [GetDeityDefinition('omen_kujii').GetName]. At dawn on the third day, the [ROOT.GetCountry.GetRulerTitle] emerged with eyes reddened by incense smoke and ordered the defenses of [ROOT.GetCountry.GetCapital.GetName] to be rebuilt in the Nat's honor. A vision of an impregnable fortress had been bestowed upon [ROOT.GetCountry.GetRuler.GetFirstName], and work began immediately to make this dream a reality.\n\nFrom this day forward, the citadel would be known as #E Kuji'i Nat's Fortress#!, and all living within the realm knew that the Nat's blessing was upon the [ROOT.GetCountry.GetAdjective] tribes. The new walls rise above the capital like a ring of stone mountains, their towers stocked with iron-tipped arrows and guarded by fearsome warriors. When the final stone was placed in the battlements, drops of pale venom were found glistening upon every arrowhead, though no hand admitted placing them there. [ROOT.GetCountry.GetRuler.GetFirstName] understood immediately what had happened, however."
me_shan_9.a: "Kuji'i Nat be praised this day!"
me_shan_9_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_9$#!' $mission_completed_tooltip_2$"

me_shan_10_title: "$01_shan_task_10$"
me_shan_10_desc: "The small realm of [GetCountry('SHN').GetName] has vanished, and in its place stands #E Pong#!, a land of highlands and floodplains whose warriors bow to [ROOT.GetCountry.GetRuler.GetName] and whose victories are spoken of in every settlement in the #E Irrawaddy Valley#!. Such a realm requires more than a ruler of men; it requires a guardian chosen by #E Nats#!, and fortunately for our people, we have been given a [ROOT.GetCountry.GetRulerTitle] that will be remembered until the end of days.\n\nMindful of the divine obligations placed upon [ROOT.GetCountry.GetRuler.GetHerHim], [ROOT.GetCountry.GetRuler.GetName] ordered a #E Grand Temple#! be constructed within [ROOT.GetCountry.GetCapital.GetName]. When construction was complete, [ROOT.GetCountry.GetRuler.GetFirstName] offered gold, incense @incense! and a sacred white elephant @elephants! to [GetDeityDefinition('omen_kingdom_nat').GetName], fervently praying that our faith would be rewarded.\n\nWithin seconds of the supplication leaving [ROOT.GetCountry.GetRuler.GetFirstName]'s lips, the air grew still. Bells began to sound, though no priest touched them, and every flame flickered and bent toward the throne.\n\nThe #E Nat of Kingdoms#! has recognized [ROOT.GetCountry.GetName] and has come to dwell among us. As long as our descendants keep faith, neither mountain nor jungle shall break what we have made."
me_shan_10.a: "A kingdom below always needs a protector above"
me_shan_10_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_10$#!' $mission_completed_tooltip_2$"

me_shan_11_title: "$01_shan_task_11$"
me_shan_11_desc: "The jungles of [GetProvince('(int32)7352').GetArea.GetName] and [GetProvince('(int32)8768').GetArea.GetName] have yielded their greatest treasure — not gold or jade @jade!, but elephants @warelephant! tall enough to look over a shield wall. At first, the beasts answered every attempt at training with trumpeted outrage, scattered handlers and a memorable quantity of crushed furniture. A few lives were unfortunately lost during these training sessions, sending the morale of our mahouts plummeting.\n\n[ROOT.GetCountry.GetRuler.GetName] refused to be discouraged, however. Day after day, the [ROOT.GetCountry.GetRulerTitle] rode among the elephant handlers, learning the touch of the heel, the pull of the rope and the quiet words that can turn a mountain of flesh into an extension of one's will. The days passed into weeks; broken bones healed as the bonds between man and mount strengthened.\n\nSix grueling months later, [ROOT.GetCountry.GetRuler.GetFirstName] returned to [ROOT.GetCountry.GetCapital.GetName] astride the largest bull ever seen in [ROOT.GetCountry.GetName], followed by a column of armored elephants whose footsteps shook dust from the rooftops. The road to the west lies ahead. Our enemies will hear us coming long before they see us."
me_shan_11.a: "Let the trembling earth itself announce our advance!"
me_shan_11_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_11$#!' $mission_completed_tooltip_2$"

me_shan_12_title: "$01_shan_task_12$"
me_shan_12_desc: "The cities of #E Samatata#! have opened their gates, and the standards of [ROOT.GetCountry.GetName] now fly where the waters of the Ganges meet the eastern sea. Traders from #E India#! stare in awe at our mounted elephant riders, and conquered governors hurry to learn the titles by which [ROOT.GetCountry.GetRuler.GetName] prefers to be addressed.\n\nFew remember that this great march began among divided clans beyond the eastern mountains. [ROOT.GetCountry.GetRuler.GetFirstName] remembers everything, however; the first desperate wars against our foes, or the moments where it felt like everything we had accomplished would be taken from us. Standing before the assembled chiefs, the [ROOT.GetCountry.GetRulerTitle] pointed west toward #E Pracya#! and north toward #E Tibet#!, lands farther than any we have taken, and asked the leaders if our armies had finally marched far enough.\n\nThe laughter lasted a very long time."
me_shan_12.a: "Far enough? We have only reached the beginning!"
me_shan_12_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_12$#!' $mission_completed_tooltip_2$"

