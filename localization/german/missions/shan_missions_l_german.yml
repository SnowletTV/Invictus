l_german:

01_shan: "Die Herren der Shan-Hügel" #Done 11.9.26 V1.11.0.3
01_shan_DESCRIPTION: "Unser Volk, die #E Shan#!, lebt dort, wo das östliche Hochland zu den fruchtbaren Auen des #E Irrawaddy-Tals#! abfällt. Unsere Hügel sind reich an Eisenerz und werden von Gebirgsbächen bewässert, doch unsere relative Isolation hat dazu geführt, dass unsere Stämme gespalten blieben, während sich die #E Pyu#! in den Tälern darunter ausbreiteten.\n\nDa [ROOT.GetCountry.GetRuler.GetName|E] spürt, dass eine Zeit des Wandels bevorsteht, hat er geschworen, die Hügeltämme unter einem einzigen Banner zu vereinen, in die Ebenen vorzustoßen und [ROOT.GetCountry.GetName|E] aus seiner nebelverhangenen Heimat bis vor die Tore von #E Indien#! zu führen. Wenn die #E Nat#! unseren Feldzug unterstützen und an unserer Seite in die Schlacht ziehen, werden die Täler selbst vor unseren herannahenden Heeren erbeben!
01_shan_CRITERIA_DESCRIPTION: "Diese Mission gilt als abgeschlossen, wenn [ROOT.GetCountry.GetName] das #E Shan#!-Hochland vereint, das #E Irrawaddy-Tal#! und #E Samatata#! erobert und das Königreich #E Pong#! gegründet hat."
01_shan_BUTTON_TOOLTIP: "Die Hügel haben uns lange genug Schutz geboten … nun sollen die Täler unseren Namen kennenlernen."

#Missions

01_shan_task_1: "Shan sichern"
01_shan_task_1_DESC: "Die Hügel rund um [GetProvince('(int32)8808').GetName|Y] trennen uns von unseren Nachbarn, doch nun ist die Zeit gekommen, die feindlichen #E Pyu#!-Stämme in den westlichen Überschwemmungsgebieten anzugreifen. [ROOT.GetCountry.GetRuler.GetName|Y] strebt die Eroberung ihrer Gebiete für [ROOT.GetCountry.GetName|T] an und hat unseren Soldaten befohlen, sich in den kommenden Tagen auf den Krieg vorzubereiten. \n\n\n\n\n\n\n\n\n\n@india_mil19!"

01_shan_task_2: "Die Eisenminen von #E Myitnge#!"
01_shan_task_2_DESC: "In den Hügeln von [GetProvince('(int32)8806').GetName|Y] gibt es Eisen @iron! zu finden, und die Stammesangehörigen von [ROOT.GetCountry.GetName|T] benötigen alles davon. Sobald unser Bergbau in vollem Gange ist, werden wir unsere Aufgebote mit besseren Waffen ausstatten.\n\n\n\n\n\n\n\n\n\n@india_mil8!"

01_shan_task_3: "Die Armee versorgen"
01_shan_task_3_DESC: "Ein Aphorismus, den die [ROOT.GetCountry.GetAdjective]en Weisen immer wieder wiederholen, steht bei [ROOT.GetCountry.GetRuler.GetName|Y] stets im Vordergrund: 'Ein Narr kann nur einen von zwei Klängen hören: den Fanfarenstoß oder das Knurren im Magen des Soldaten.' Geleitet von dieser alten Weisheit ist für [ROOT.GetCountry.GetName|Y] die Zeit gekommen, zu säen und zu ernten, denn unsere wachsenden Heere benötigen Nachschub.\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

01_shan_task_4: "Vorstoß nach Westen"
01_shan_task_4_DESC: "Die Götter des Sieges reiten an der Seite von [ROOT.GetCountry.GetRuler.GetName|Y] und drängen den [ROOT.GetCountry.GetAdjective|Y]en  [ROOT.GetCountry.GetRulerTitle|T], unsere Feinde im Westen zu besiegen. Die Zeit ist gekommen, unsere Truppen aufzustellen und die #Y Pyu#!-Stämme im #G Irrawaddy-Tal#! ein für alle Mal zu vertreiben!\n\n\n\n\n\n\n\n\n\n@india_mil23!"

01_shan_task_5: "Pu-Lederarbeiten"
01_shan_task_5_DESC: "[ROOT.GetCountry.GetCapital.GetName|Y] macht sich zunehmend einen Namen für die hervorragende Qualität des Leders @leather! hergestellt in seinen Werkstätten.\n\n\n\n\n\n\n\n\n\n@india_mil6!"

01_shan_task_6: "Invasion des Dschungels"
01_shan_task_6_DESC: "Da das #G Irrawaddy-Tal#! nun fest in unserer Hand ist, ist es an der Zeit, unseren Blick nach außen zu richten. Die Dschungel im Norden und Süden werden für unsere Männer, die [ROOT.GetCountry.GetCapital.GetName|Y] unzählige Siege beschert haben, kein Hindernis darstellen. Es ist an der Zeit, unsere Eroberungszüge zu beginnen!\n\n\n\n\n\n\n\n\n\n@india_mil12!"

01_shan_task_7: "Die nördliche Migration"
01_shan_task_7_DESC: "Die Gebiete nördlich von uns sind wertvoll, aber relativ abgelegen und unbewohnt – doch nun ist es an der Zeit, dass sich dies ändert. [ROOT.GetCountry.GetRuler.GetName|Y] hat in ganz [ROOT.GetCountry.GetName|Y] bekannt gegeben, dass unser Volk Siedler braucht, die bereit sind, ihr bisheriges Leben aufzugeben, um etwas Besseres zu suchen, und zum Glück für [ROOT.GetCountry.GetRuler.GetHerHim] sind viele diesem Aufruf gefolgt.\n\n\n\n\n\n\n\n\n\n@india_mil14!"

01_shan_task_8: "Jademinen von #E Myitkyina#!"
01_shan_task_8_DESC: "Die seltene Handelsware Jade @jade! ist in der Provinz [GetProvince('(int32)8813').GetName|Y] zu finden, und [ROOT.GetCountry.GetRuler.GetName|Y] hat verlangt, dass wir unsere Mittel in diese Region investieren – wir müssen dort unverzüglich eine Mine errichten.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

01_shan_task_9: "Kuji'i Nat"
01_shan_task_9_DESC: "In den übelriechenden Gewässern der Sumpfgebiete von [GetProvince('(int32)8770').GetName|G] erinnert der tödliche Upas-Baum eindringlich an die Macht von [GetDeityDefinition('omen_kujii').GetName|T], dem #G Nat des Krieges#!, der diejenigen beschützt, die seinen Segen suchen. Indem [ROOT.GetCountry.GetCapital.GetName|Y] dem Nat in [ROOT.GetCountry.GetCapital.GetName|Y] eine angemessene Bleibe schafft, hofft [ROOT.GetCountry.GetRuler.GetName|Y], dass wir die göttliche Gunst für unser Volk sichern können.\n\n\n\n\n\n\n\n\n\n@greek_mil3!"

01_shan_task_10: "Nikam Nat"
01_shan_task_10_DESC: "[ROOT.GetCountry.GetRuler.GetName|Y] hat es sich zum Ziel gesetzt, in [ROOT.GetCountry.GetName|Y] ein bleibendes Vermächtnis zu schaffen. Mit der Gründung des Königreichs #T Pong#! wird ein prächtiger Tempel für die #Y Nat#! in [ROOT.GetCountry.GetCapital.GetName|Y] unser neues Reich mit unseren göttlichen Beschützern verbinden und sicherstellen, dass [ROOT.GetCountry.GetRuler.GetHerHis] Name von unseren Nachkommen unvergessen bleibt.\n\n#R Ein Wechsel zu einem anderen Glauben deaktiviert diese Aufgabe.#!\n\n\n\n\n\n\n\n\n\n@persia_mil7!"

01_shan_task_11: "Unaufhaltsamer Vormarsch"
01_shan_task_11_DESC: "Die ungeschlagenen Armeen von [ROOT.GetCountry.GetRuler.GetName|Y] haben ausreichend Territorium in den Dschungeln von [GetProvince('(int32)7352'). GetArea.GetName|Y] und [GetProvince('(int32)8768').GetArea.GetName|Y] erobert, dass ein Einmarsch in [GetProvince('(int32)7401').GetArea.GetName|Y] zu diesem Zeitpunkt bereits als beschlossene Sache gilt.\n\nIn [ROOT.GetCountry.GetCapital.GetName|Y] wurde eine große Streitmacht von #R Kriegselefanten#! aufgestellt – die persönliche Armee unseres majestätischen Anführers. Auch wenn die Unterhaltung dieser Tiere kostspielig sein mag, werden sie eine wirksame Kampfkraft gegen unsere Feinde darstellen.\n\n\n\n\n\n\n\n\n\n@india_mil16!"

01_shan_task_12: "Die Eroberung von Samatata"
01_shan_task_12_DESC: "[ROOT.GetCountry.GetRuler.GetName|Y] gilt nicht nur als unangefochtene Autorität über ganz [ROOT.GetCountry.GetName|Y], sondern die Befehle unseres [ROOT.GetCountry.GetRulerTitle|T] werden sogar in den Städten von [GetProvince('(int32)7401').GetArea.GetName|Y] befolgt.\n\n\n\n\n\n\n\n\n\n@india_mil22!"

01_shan_task_13: "Die Reinigung von Halin"
01_shan_task_13_DESC: "Obwohl die Einwohner von [GetProvince('(int32)8778').GetName|Y] den #T Natischen-Glauben#! aufgegeben haben, hat [ROOT.GetCountry.GetRuler.GetName|Y] geschworen, dafür zu sorgen, dass die Nats an die heilige Stätte innerhalb der Stadt zurückkehren.\n\n\n\n\n\n\n\n\n\n@india_mil5!"

01_shan_task_14: "Indischer Handel"
01_shan_task_14_DESC: "Im #G Irrawaddy-Tal#! wachsen Früchte @fruits!, die äußerst selten sind, wie Rambutan und Bananen, und unsere Freunde jenseits des Meeres sind sehr daran interessiert, unsere Erzeugnisse zu importieren. Lasst uns alles tun, was wir können, um unsere Kontakte ins Ausland zu fördern – die Stadt [GetProvince('(int32)7395').GetName|Y] ist ein Handelsknotenpunkt für die Region, und man sagt, dass die Menschen dort offen dafür sind, Geschäfte mit Fremden zu machen.\n\n#Y Diese Mission wird übersprungen, wenn wir#! [GetProvince('(int32)7395').GetName|G] #Y besitzen oder wenn es unser Untertan ist.#! \n\n\n\n\n\n\n\n\n\n@india_mil1!"

01_shan_task_15: "Waffenbrüder"
01_shan_task_15_DESC: "Die #T Pyu#!-Stämme leben in isolierten Enklaven im #G Irrawaddy-Tal#!, und obwohl viele von ihnen ketzerische #T Bon#!-Glaubensvorstellungen angenommen haben, ist [ROOT.GetCountry.GetRuler.GetName|Y] davon überzeugt, dass unser Volk friedlich zusammenleben kann. Sind wir gemeinsam nicht stärker?\n\n#Y Wir werden eine Entscheidung über den Status der #! #T Pyu-Kultur#! treffen. \n\n\n\n\n\n\n\n\n\n@india_mil20!"


#Tooltips
you_need_to_form_pong_tt: "Wir müssen die Entscheidung treffen, #T Pong zu bilden#!"
shan_leather_tt: "#Y Wir müssen einen Überschuss von mindestens#! #T 2 Leder @leather!#! #Y in unserer Hauptstadt haben.#!"
claims_pracya_tibet_tt: "Wir werden Ansprüche auf die Regionen #Y Tibet#! und #Y Pracya#! erhalten."
shan_two_farms_tt: "Wir brauchen mindestens #Y 2#! #T Bauernsiedlungen#! in unserem Land."
shan_kujii_omen_active_tt: "[ROOT.GetCountry.GetName] muss das #Y Kuji'i Nat Omen#! #T aktiv#! haben."
shan_divine_sacrifice_tt: "Wir müssen die religiöse Interaktion #T Göttliches Opfer darbringen#! nutzen"
shan_halin_religious_investment_tt: "Wir brauchen die #T Religiöse Zugeständnisse machen#! Provinzinvestition in der Provinz #Y Pyu#!."
shan_two_loyal_clan_chiefs_tt: "Wir brauchen #Y 2#! #T Clan-Anführer#! mit einer Loyalität von mindestens #E 75#!."

#Modifiers

shan_slave_mine_mod: "Die Minen von Myitnge"
desc_shan_slave_mine_mod: "Die eisenerzhaltigen Hügel von Myitnge wurden von Shan-Bergleuten erschlossen und versorgen die Schmiede des Königreichs nun regelmäßig mit Erz."
shan_farm_bonus_mod: "Getreidespeicher der Shan-Hügel"
desc_shan_farm_bonus_mod: "Neue Bauernsiedlungen und Lagerhäuser sorgen dafür, dass die aus dem Shan-Hochland herabziehenden Armeen mit vollen Mägen marschieren können."
shan_leatherworks_mod: "Pu Lederarbeiten"
desc_shan_leatherworks_mod: "Die Gerber und Lederhandwerker von Pu haben sich einen Namen damit gemacht, Krieger mit robusten, aber geschmeidigen Lederrüstungen auszustatten."


#Events
me_shan_1_title: "$01_shan_task_1$"
me_shan_1_desc: "Seit Generationen sind die Täler und Bergkämme von #E Shan#! unter zerstrittenen Clans aufgeteilt, von denen jeder seine eigenen Felder, Wege und Eisenvorkommen mit eifersüchtiger Entschlossenheit bewacht. Fehden, die wegen eines gestohlenen Büffels oder einer Beleidigung durch einen längst verstorbenen Häuptling begannen, fordern noch immer Blut von Männern, die sich nicht einmal mehr an die Namen derer erinnern können, die ursprünglich beleidigt wurden. Wie kann ein Stamm, der durch solch törichte Verpflichtungen an die Vergangenheit versklavt ist, hoffen, eine Zukunft aufzubauen?\n\n[ROOT.GetCountry.GetRuler.GetName] hat die Clanältesten nach [ROOT.GetCountry.GetCapital.GetName] einberufen und ihnen eine einfache Wahl gestellt: Entweder sie legen ihre kleinlichen Kriege beiseite und marschieren gemeinsam unter dem Banner von [ROOT.GetCountry.GetName], oder sie gehen als die ersten Feinde in die Geschichte ein, die unter diesem Banner zerschlagen wurden. Die meisten beugten noch vor Sonnenuntergang das Knie, und diejenigen, die dies nicht taten, haben unseren jungen Kriegern die Gelegenheit gegeben, ihren Mut unter Beweis zu stellen. Doch selbst jetzt streiten sich [SCOPE.sCharacter('clan_chief_one').GetName] und [SCOPE.sCharacter('clan_chief_two').GetName] darüber, wer die Ehre verdient, unseren ersten großen Feldzug anzuführen. Jeder beharrt darauf, dass die Clans keinem anderen in die Schlacht folgen werden."
me_shan_1.a: "Die Führung gehört [SCOPE.sCharacter('clan_chief_one').GetName]"
me_shan_1.b: "[SCOPE.sCharacter('clan_chief_two').GetName] soll den Feldzug anführen"
me_shan_1.c: "Ihr werdet gemeinsam marschieren, und ihr beide werdet hinter mir marschieren!"
me_shan_1_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_1$#!' $mission_completed_tooltip_2$"

me_shan_2_title: "$01_shan_task_2$"
me_shan_2_desc: "Die alten Männer von [GetProvince('(int32)8806').GetName] haben schon immer behauptet, dass die Hügel eiserne Knochen besitzen – etwas, das für [ROOT.GetCountry.GetRuler.GetName] stets seltsam klang, doch nun versteht der [ROOT.GetCountry.GetRulerTitle] diese uralte Weisheit. Bislang wurde das Erz aus flachen Gruben und einsamen Ausläufern gewonnen – genug für die Axt eines Holzfällers oder die Klinge eines Häuptlings, aber niemals genug, um ein Königreich zu bewaffnen.\n\nBis jetzt. Auf Befehl von [ROOT.GetCountry.GetRuler.GetFirstName] sind Bergleute den dunklen Adern gefolgt, die tief unter den Hügeln verborgen liegen. Öfen glühen nun die ganze Nacht hindurch, ihr Rauch schlängelt sich über die Bäume, während [ROOT.GetCountry.GetAdjective]e Schmiede Speerspitzen, Schwerter und Pfeilspitzen karrenweise hämmern. Myitnge hat uns seine Knochen überlassen, und bald werden unsere Feinde ihre Schärfe zu spüren bekommen."
me_shan_2.a: "Möge jeder Krieger eiserne Waffen tragen!"
me_shan_2_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_2$#!' $mission_completed_tooltip_2$"

me_shan_3_title: "$01_shan_task_3$"
me_shan_3_desc: "Eine hungrige Armee ist nichts weiter als eine Horde bewaffneter Nörgler, und selbst der mutigste Shan-Krieger kann nicht von Ruhm allein leben. In Erinnerung an diese Wahrheit befahl [ROOT.GetCountry.GetRuler.GetName], überall dort, wo der Boden tief und dunkel war, fruchtbares Ackerland zu roden, und eine kleine Armee von Arbeitern, die schwere Eisenwerkzeuge trugen, ging mit grimmiger Entschlossenheit gegen das Unterholz vor.\n\nDer Schweiß ihres Angesichts hat sich ausgezahlt. Die erste Ernte ist nun in [ROOT.GetCountry.GetCapital.GetName] eingetroffen. Körbe voller Obst @fruits!, Säcke voller Getreide @grain! und muhendes Vieh @cattle! füllen die Marktstände, und die Soldaten scherzen, dass [ROOT.GetCountry.GetRuler.GetFirstName] vorhabe, die Welt zu erobern, indem er sie ernährt.\n\nSollen sie doch lachen. Wenn der Feldzug beginnt und unsere Feinde hinter sich leere Vorratskammern entdecken, werden sie verstehen, warum die Armeen von [ROOT.GetCountry.GetName] ihre Pflüge ebenso sorgfältig wie ihre Speere gezählt haben."
me_shan_3.a: "Der Ruf in die Schlacht klingt mit vollem Magen doch viel besser, nicht wahr?"
me_shan_3_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_3$#!' $mission_completed_tooltip_2$"

me_shan_4_title: "$01_shan_task_4$"
me_shan_4_desc: "Die Westhänge bilden nicht mehr die Grenze unserer Ambitionen. Von ihren Gipfeln aus kann [ROOT.GetCountry.GetRuler.GetName] die dunstigen Auen des #E Irrawaddy-Tals#! sehen, die sich bis zum Horizont erstrecken; breite Flüsse, dicht besiedelte Ortschaften und Felder, die fruchtbarer sind als alle, die man in unseren Hügeln findet. Es gibt dort sogar eine Stadt, [GetProvince('(int32)8778').GetName] – etwas, das in diesen Gegenden äußerst selten ist.\n\nDie #E Pyu#! glauben törichterweise, die Berge würden uns für immer einsperren, und sie verwechseln unsere Geduld mit Angst. Gut – sollen sie doch denken, was sie wollen. Unsere Späher haben die Pässe bereits ausgemacht, und unsere Clan-Truppen versammeln sich unter den Fahnen von [ROOT.GetCountry.GetName]. Wir werden herabstoßen wie ein scharfes Messer – plötzlich und unaufhaltsam."
me_shan_4.a: "Von den Hügeln hinab in die Geschichte!"
me_shan_4_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_4$#!' $mission_completed_tooltip_2$"

me_shan_5_title: "$01_shan_task_5$"
me_shan_5_desc: "Kratz, kratz, kratz. In den Werkstätten von [ROOT.GetCountry.GetCapital.GetName] erklingt eine sanftere Musik als das Hämmern unserer Schmieden, obwohl ihre Arbeit nicht weniger wichtig ist. Gerber weichen die aus allen Ecken von [ROOT.GetCountry.GetName] angelieferten Häute @leather! ein und gerben sie, während unsere fleißigen Lederverarbeiter sie zu Schilden, Zaumzeug, Stiefeln und Rüstungen zuschneiden. Der Geruch der Urinbecken der Gerber brennt in der Nase und hält die meisten Menschen von ihrem Viertel fern, doch die Arbeiter selbst scheinen gegen die üble Luft immun zu sein und arbeiten schweigend unter der Sonne.\n\nIhr Können hat das Leder von #E Pu#! weit über die Shan-Hügel hinaus berühmt gemacht. Händler aus dem Ausland wetteifern um alles, was die Armee nicht benötigt, und wohlhabende Handwerker haben begonnen, neben ihren Werkstätten prächtige Häuser zu errichten. Was als Mittel zur Bekleidung unserer Krieger begann, ist zu einem Wirtschaftszweig geworden, der unserer Hauptstadt würdig ist."
me_shan_5.a: "Unsere Männer verdienen nur das Beste"
me_shan_5_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_5$#!' $mission_completed_tooltip_2$"

me_shan_6_title: "$01_shan_task_6$"
me_shan_6_desc: "Die Eroberung der westlichen Ebenen hat [ROOT.GetCountry.GetName] grundlegend verändert. Tributstaaten bringen Getreide @grain!, Holz @wood! und Gefangene nach [ROOT.GetCountry.GetCapital.GetName], während Krieger, die einst nur die Wege durch die benachbarten Hügel kannten, nun mit großen Siegen prahlen, die sie im #E Irrawaddy-Tal#! errungen haben.\n\nDoch [ROOT.GetCountry.GetRuler.GetName] gibt sich nicht damit zufrieden, sich auf Kissen zurückzulehnen und die Siege von gestern zu bewundern. Im Norden und Süden verbergen dichte Dschungel rivalisierende Reiche, die reif für die Eroberung sind. Es wurden Befehle erteilt, Pfade durch die grüne Wildnis zu schlagen, und überall dort, wo die Axt einen Weg bahnt, wird der Speer folgen."
me_shan_6.a: "Hinter diesen Bäumen warten Königreiche darauf, erobert zu werden..."
me_shan_6_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_6$#!' $mission_completed_tooltip_2$"

me_shan_7_title: "$01_shan_task_7$"
me_shan_7_desc: "Die von [ROOT.GetCountry.GetRuler.GetName] nach Norden entsandten Boten sind an der Spitze eines seltsamen Zuges zurückgekehrt, wie man ihn in [ROOT.GetCountry.GetName] noch nie zuvor gesehen hat. Hunderte haben sich vor den Mauern unserer Hauptstadt versammelt: landlose Stammesangehörige, die auf eine Wende ihres Schicksals hoffen, ehrgeizige jüngere Söhne ohne Erbteil, Jäger, die des Dschungels überdrüssig sind, und ganze Familien, die ihren Hab und Gut in Körben mit sich führen.\n\nSie sind sich in ihrem Ziel einig, denn alle haben das Versprechen auf freies Land für den Fall angenommen, dass sie bereit sind, sich außerhalb unserer derzeitigen Grenzen niederzulassen. Es ist bekannt, dass die Reise beschwerlich sein wird. Es gibt keine Straßen, die dorthin führen, wohin wir gehen, und mehr als ein ehrgeiziger Siedler wird kehrtmachen, wenn er das Brüllen des Tigers jenseits des Lagerfeuers hört. Doch genügend Menschen aus unserem Volk werden durchhalten. Sie werden die Wildnis roden, Dörfer errichten und ihren Kindern beibringen, dass es [ROOT.GetCountry.GetRuler.GetFirstName] war, der ihnen den Norden erschlossen hat."
me_shan_7.a: "Wo ein Shan-Herd entfacht ist, liegt Shan-Land"
me_shan_7_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_7$#!' $mission_completed_tooltip_2$"

me_shan_8_title: "$01_shan_task_8$"
me_shan_8_desc: "Die Siedler von [GetProvince('(int32)8813').GetName] haben die Erde im Norden aufgegraben und darin schlummerndes grünes Feuer entdeckt. Große Jadesteine @jade!, die unter ihrer rauen Oberfläche trüb und unscheinbar wirken, kommen unter den Meißeln unserer Arbeiter zum Vorschein, die voller Begeisterung Nachrichten nach Hause geschickt haben, in denen sie ihre unglaubliche Entdeckung beschreiben.\n\nUm die #E Nat#! zu ehren, die uns gesegnet haben, haben unsere Bergleute die besten Jadestücke in die Werkstätten unserer Hauptstadt geschickt, wo unsere Handwerker alle Hände voll zu tun haben werden. Auf Befehl von [ROOT.GetCountry.GetRuler.GetName] arbeitete ein Meisterbildhauer viele Monate lang heimlich daran und weigerte sich sogar, den [ROOT.GetCountry.GetRulerTitle] das unvollendete Meisterwerk sehen zu lassen.\n\nAls das Artefakt endlich fertiggestellt war, stand eine lebensechte Statue eines Jade-Nat in der Werkstatt des Meisters, deren poliertes Gesicht im Lampenlicht fast lebendig wirkte. Manche schwören sogar, dass ein leises Summen den Raum erfüllt, wenn die Sonne hinter dem Horizont verschwindet. Unsere Schamanen bestehen natürlich darauf, dass dies ein Segen und kein eingeschlossener Wind ist – die Nat sind mit unserem Opfer zufrieden."
me_shan_8.a: "Sogar die Steine selbst ehren die Nat!"
me_shan_8_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_8$#!' $mission_completed_tooltip_2$"

me_shan_9_title: "$01_shan_task_9$"
me_shan_9_desc: "Drei Nächte lang verharrte [ROOT.GetCountry.GetRuler.GetName] vor dem Schrein von [GetDeityDefinition('omen_kujii').GetName] in Nachtwache. Im Morgengrauen des dritten Tages trat der [ROOT.GetCountry.GetRulerTitle] mit vom Weihrauch geröteten Augen hervor und befahl, die Verteidigungsanlagen von [ROOT.GetCountry.GetCapital.GetName] zu Ehren des Nat wieder aufzubauen. [ROOT.GetCountry.GetRuler.GetFirstName] war eine Vision einer uneinnehmbaren Festung zuteilgeworden, und sofort begannen die Arbeiten, um diesen Traum Wirklichkeit werden zu lassen.\n\nVon diesem Tag an sollte die Zitadelle als #E Kuji’i Nats Festung#! bekannt sein, und alle, die im Reich lebten, wussten, dass der Segen des Nat auf den [ROOT.GetCountry.GetAdjective]en Stämmen ruhte. Die neuen Mauern ragen wie ein Ring aus steinernen Bergen über der Hauptstadt empor, ihre Türme sind mit Spitzen aus Eisen bestückt und werden von furchterregenden Kriegern bewacht. Als der letzte Stein in die Zinnen gesetzt wurde, fand man auf jeder Spitze blasse Gifttröpfchen glitzern, obwohl niemand zugab, sie dort platziert zu haben. [ROOT.GetCountry.GetRuler.GetFirstName] verstand jedoch sofort, was geschehen war."
me_shan_9.a: "Gelobt sei Kuji'i Nat an diesem Tag!"
me_shan_9_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_9$#!' $mission_completed_tooltip_2$"

me_shan_10_title: "$01_shan_task_10$"
me_shan_10_desc: "Das kleine Reich [GetCountry('SHN').GetName] ist verschwunden, und an seiner Stelle steht nun #E Pong#!, ein Land aus Hochland und Auen, dessen Krieger sich vor [ROOT.GetCountry.GetRuler.GetName] verneigen und dessen Siege in jeder Siedlung im #E Irrawaddy-Tal#! besungen werden. Ein solches Reich erfordert mehr als nur einen Herrscher über die Menschen; es erfordert einen von den #E Nat#! auserwählten Wächter, und zum Glück für unser Volk wurde uns ein [ROOT.GetCountry.GetRulerTitle] gegeben, an den man bis ans Ende der Tage erinnern wird.\n\nIm Bewusstsein der göttlichen Pflichten, die [ROOT.GetCountry.GetRuler.GetHerHim] auferlegt wurden, befahl der  [ROOT.GetCountry.GetRuler.GetName], dass in [ROOT.GetCountry.GetCapital.GetName] ein #E Großer Tempel#! errichtet werde. Als der Bau vollendet war, opferte [ROOT.GetCountry.GetRuler.GetFirstName] Gold, Weihrauch @incense! und einen heiligen weißen Elefanten @elephants! an [GetDeityDefinition('omen_kingdom_nat').GetName] und betete inbrünstig darum, dass unser Glaube belohnt werde.\n\nKaum waren die Worte des Gebets über die Lippen von [ROOT.GetCountry.GetRuler.GetFirstName] gekommen, wurde es still. Glocken begannen zu läuten, obwohl kein Priester sie berührte, und jede Flamme flackerte und neigte sich dem Thron zu.\n\nDer #E Nat der Königreiche#! hat [ROOT.GetCountry.GetName] anerkannt und ist gekommen, um unter uns zu wohnen. Solange unsere Nachkommen den Glauben bewahren, werden weder Berge noch Dschungel das zerstören, was wir geschaffen haben."
me_shan_10.a: "Ein Reich von unten braucht immer einen Beschützer von oben"
me_shan_10_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_10$#!' $mission_completed_tooltip_2$"

me_shan_11_title: "$01_shan_task_11$"
me_shan_11_desc: "Die Dschungel von [GetProvince('(int32)7352').GetArea.GetName] und [GetProvince('(int32)8768').GetArea.GetName] haben ihren größten Schatz preisgegeben – nicht Gold oder Jade @jade!, sondern Elefanten @warelephant!, die groß genug sind, um über einen Schildwall  hinwegzusehen. Zunächst reagierten die Tiere auf jeden Trainingsversuch mit empörtem Trompeten, verstreuten Elefantenführern und einer unvergesslichen Menge an zertrümmerten Möbeln. Leider kamen bei diesen Trainingseinheiten einige Menschen ums Leben, was die Moral unserer Mahouts in den Keller sinken ließ.\n\n[ROOT.GetCountry.GetRuler.GetName] ließ sich jedoch nicht entmutigen. Tag für Tag ritt der [ROOT.GetCountry.GetRulerTitle] unter den Elefantenhütern umher und lernte den Druck der Ferse, den Zug am Seil und die leisen Worte, die einen Berg aus Fleisch in eine Verlängerung des eigenen Willens verwandeln können. Die Tage wurden zu Wochen; gebrochene Knochen heilten, während sich die Bande zwischen Mensch und Reittier festigten.\n\nSechs zermürbende Monate später kehrte [ROOT.GetCountry.GetRuler.GetFirstName] nach [ROOT.GetCountry.GetCapital.GetName] zurück, im Sattel des größten Elefanten, den man je in [ROOT.GetCountry.GetName] gesehen hatte, gefolgt von einer Kolonne gepanzerter Elefanten, deren Schritte den Staub von den Dächern schüttelten. Der Weg nach Westen liegt vor uns. Unsere Feinde werden uns kommen hören, lange bevor sie uns sehen."
me_shan_11.a: "Möge die bebende Erde selbst unseren Vormarsch verkünden!"
me_shan_11_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_11$#!' $mission_completed_tooltip_2$"

me_shan_12_title: "$01_shan_task_12$"
me_shan_12_desc: "Die Städte von #E Samatata#! haben ihre Tore geöffnet, und die Fahnen von [ROOT.GetCountry.GetName] wehen nun dort, wo die Gewässer des Ganges auf das östliche Meer treffen. Händler aus #E Indien#! blicken voller Ehrfurcht auf unsere Elefantenreiter, und die besiegten Statthalter beeilen sich, die Titel zu lernen, mit denen [ROOT.GetCountry.GetRuler.GetName] am liebsten angesprochen werden möchte.\n\nNur wenige erinnern sich daran, dass dieser große Feldzug zwischen den zerstrittenen Stämmen jenseits der östlichen Berge begann. [ROOT.GetCountry.GetRuler.GetFirstName] erinnert sich jedoch an alles: an die ersten verzweifelten Kämpfe gegen unsere Feinde oder an die Momente, in denen es so schien, als würde uns alles, was wir erreicht hatten, wieder genommen werden. Vor den versammelten Häuptlingen stehend, zeigte der [ROOT.GetCountry.GetRulerTitle] nach Westen in Richtung #E Pracya#! und nach Norden in Richtung #E Tibet#!, Länder, die weiter entfernt liegen als alle, die wir bisher erobert haben, und fragte die Anführer, ob unsere Armeen endlich weit genug marschiert seien.\n\nDas Gelächter hielt sehr lange an."
me_shan_12.a: "Weit genug? Wir stehen erst am Anfang!"
me_shan_12_tooltip: "$mission_completed_tooltip_1$ '#Y $01_shan_task_12$#!' $mission_completed_tooltip_2$"

