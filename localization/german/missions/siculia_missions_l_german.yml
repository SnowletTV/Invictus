l_german:
 
  
 ### MISSIONS 
 01_siculia_missions: "Duketios' Vermächtnis"
 01_siculia_missions_DESCRIPTION: "Vor 150 Jahren vereinte der große Duketios die verschiedenen sikelischen Stämme unter seinem Banner, gründete auf seinem Siegeszug blühende neue Städte und eroberte eine hellenische Kolonie nach der anderen. Doch nach seiner Niederlage in der Schlacht von Nomae gegen die verräterischen Syrakusaner wurde die pan-sikelische Armee vernichtet, die Hauptstadt Palike bis auf die Grundmauern niedergebrannt und der von ihm geschmiedete Bund löste sich in sich selbst auf. Da unser Volk zerstreut und gespalten ist, konnten die Griechen und Karthager den Rest der Insel kolonisieren, sodass wir nun im abgelegenen Landesinneren am seidenen Faden hängen. Es wird schwierig werden, doch als die letzten Sikeler sind wir die einzigen Erben des stolzen Vermächtnisses von Duketios, und sollte es uns gelingen, die syrakusischen und karthagischen Kolonisten zurückzudrängen, können wir unser verlorenes Königreich wiederherstellen und unser Überleben für viele kommende Generationen sichern."
 01_siculia_missions_BUTTON_TOOLTIP: "Wir müssen die syrakusischen und karthagischen Invasoren vertreiben, wenn wir als Volk überleben wollen."
 01_siculia_missions_BUTTON_DETAILS: ""
 #01_siculia_missions_DESCRIPTION: "Vor 150 Jahren vereinte der große Ducetius die verschiedenen sizilianischen Stämme unter seinem Banner, gründete in seinem Gefolge blühende neue Städte und eroberte eine nach der anderen hellenische Kolonie. Nach seiner Niederlage in der Schlacht von Nomae durch die verräterischen Syrakusaner wurde die pan-sizilianische Armee jedoch vernichtet, die Hauptstadt Palice niedergebrannt und die von ihm geschmiedete Föderation brach in sich zusammen. Da unser Volk zerstreut und geteilt war, konnten die Griechen und Karthager den Rest der Insel kolonisieren, sodass wir im abgelegenen Landesinneren am seidenen Faden hängen blieben. Es wird schwierig werden, aber als letzte der Sikeler sind wir die einzigen, die Ducetius‘ stolzes Erbe antreten, und wenn es uns gelingt, die syrakusanischen Kolonisten zurückzudrängen, können wir unser verlorenes Königreich wiederherstellen und unser Überleben für viele kommende Generationen sichern."
 #01_siculia_missions_BUTTON_TOOLTIP: "Wir müssen die Invasoren aus Syrakus vertreiben, wenn wir als Volk überleben wollen."
 01_siculia_missions_CRITERIA_DESCRIPTION: "Die Mission gilt als abgeschlossen, sobald wir Syrakus zerstört, die Kontrolle über die gesamte Insel gesichert und unser Königreich wiederhergestellt haben."
  
 01_siculia_missions_task_1: "Auf den Krieg vorbereiten"
 01_siculia_missions_task_1_DESC: "Wir können nicht darauf hoffen, den bevorstehenden Überlebenskampf allein mit Glauben und Tapferkeit zu überstehen; daher müssen wir fortschrittliche Kampftaktiken von unseren Nachbarn übernehmen und sicherstellen, dass unsere Männer auf dem Schlachtfeld Zugang zu Waffen höchster Qualität haben."
 01_siculia_missions_task_2: "Neue Allianzen schmieden"
 01_siculia_missions_task_2_DESC: "Da wir zahlenmäßig stark unterlegen sind, können wir unmöglich hoffen, allein gegen unsere Feinde zu den Waffen zu greifen; daher müssen wir Bündnisse mit unseren Nachbarn schließen, und sei es auch nur vorübergehend, wenn wir es mit Syrakus und Karthago aufnehmen wollen."
 01_siculia_missions_task_2_allies_tt: "Hat #Y 2#! oder mehr Allianzen."
 01_siculia_missions_task_3: "Angriff auf Akragas"
 01_siculia_missions_task_3_DESC: "Seit ihrer fast vollständigen Zerstörung durch Karthago vor einem Jahrhundert ist die Stadt Akragas nicht mehr der ernstzunehmende Gegner, der sie zu Duketios’ Zeiten war, sondern befindet sich in einem ständigen Verfall und Niedergang. Auch wenn Akragas kein leichtes Ziel ist, steht die Stadt allein auf der Insel, was uns die perfekte Gelegenheit bietet, jetzt zuzuschlagen und uns den Zugang zu ihrem wertvollen Hafen zu sichern, bevor er von den Karthagern eingenommen wird."
 01_siculia_missions_task_3_war_tt: "Wir haben die Wahl, entweder Ansprüche geltend zu machen oder #R Akragas den Krieg zu erklären#!."
  #Changed due to Calactea being removed as a starting tag 
 #01_siculia_missions_task_5: "Betray Calactea and Tyndaris" 
 #01_siculia_missions_task_5_DESC: "Although nominally our allies, the cities of Calactea and Tyndaris have been drifting close to Syracuse's orbit over the years, and with Agathokles' growing ambitions, it is only a matter of time before they find themselves in his iron grip. If we can strike first, we can secure access to the northern coast and put a dent in Syracusan expansionism." 
 01_siculia_missions_task_5: "Tyndaris verraten"
 01_siculia_missions_task_5_DESC: "Obwohl die Stadt Tyndaris nominell unser Verbündeter ist, hatte sie sich im Laufe der Jahre immer mehr in den Einflussbereich unseres Feindes Syrakus bewegt. Nun, da dessen elendes Reich zerstört ist, ist es nur eine Frage der Zeit, bis sie sich im eisernen Griff einer anderen Großmacht wiederfindet – warum nicht unserer? Wenn wir zuerst zuschlagen, können wir uns den Zugang zur Nordküste sichern und den Expansionsbestrebungen potenzieller Eroberer Einhalt gebieten."
 #01_siculia_missions_task_5_war_tt: "We will have the option to either get claims or #R declare war on Calactea and Tyndaris#!."  <"None">  #NT!
 01_siculia_missions_task_5_war_tt: "Wir haben die Wahl, entweder Ansprüche geltend zu machen oder #R Tyndaris den Krieg zu erklären#!."
 01_siculia_missions_task_6: "Geld für Söldner zurücklegen"
 01_siculia_missions_task_6_DESC: "Unsere Männer haben inzwischen die fortschrittlichen Ausbildungsmethoden unserer Nachbarn erlernt und verfügen über hochwertige Waffen; allerdings ist unsere Armee klein, und es stehen nur wenige Männer im wehrfähigen Alter für unsere Aushebung zur Verfügung. Glücklicherweise gibt es auf unserer Insel zahlreiche erfahrene Soldaten, die man anheuern kann. Wenn wir einen beträchtlichen Vorrat an Gold ansammeln, werden wir in der Lage sein, eine Streitmacht aufzustellen, die unseren Feinden ebenbürtig ist."
  
  
 01_siculia_missions_task_4: "Die Schlacht von Nomae rächen"
 01_siculia_missions_task_4_DESC: "Vor langer Zeit war Syrakus unser Verbündeter und unterstützte Duketios in seinem Befreiungskampf. Doch aus Angst und Neid angesichts unserer Macht haben sie unser Vertrauen missbraucht und sich auf die Seite von Akragas geschlagen, was schließlich zu unserer Vernichtung in der Schlacht von Nomae führte. Nun, da unser alter Feind verwundbar und abgelenkt ist und unsere Vorbereitungen abgeschlossen sind, ist es an der Zeit, gemeinsam mit unseren neuen Verbündeten zuzuschlagen, bevor Syrakus seine Verteidigung verstärken kann."
 01_siculia_missions_task_4_war_tt: "Wir haben die Möglichkeit, entweder Ansprüche geltend zu machen oder #R Syrakus den Krieg zu erklären#!."
 01_siculia_missions_task_7: "Unsere Verwandten befreien"
 01_siculia_missions_task_7_DESC: "Vor langer Zeit eroberten und unterwarfen die Phönizier und Griechen die Elymer, die enge Verwandte unseres Volkes sind und den westlichen Teil der Insel bewohnen. Karthago konzentriert derzeit seine Kräfte auf auswärtige Gebiete und unterhält nur noch eine minimale Truppenstärke zum Schutz seiner sizilischen Besitzungen: sollten wir schnell und entschlossen zuschlagen, können wir die Häfen sichern, bevor punische Verstärkung eintrifft, und unsere Verwandten von der fremden Tyrannei befreien."
 01_siculia_missions_task_7_war_tt: "Wir haben die Möglichkeit, entweder Ansprüche geltend zu machen oder #R Karthago den Krieg zu erklären#!."
  
 01_siculia_missions_task_8: "Sieg über Syrakus"
 01_siculia_missions_task_8_DESC: "Endlich haben wir die griechischen Unterdrücker vertrieben und sie zurück ins Meer geworfen, von wo sie gekommen sind. Nachdem wir Duketios gerächt haben, können wir uns nun darauf konzentrieren, dort weiterzumachen, wo er aufgehört hat, und unser eigenes Schicksal zu gestalten."
  
 01_siculia_missions_task_10: "Syrakousai dem Erdboden gleichmachen"
 01_siculia_missions_task_10_DESC: "Vor 150 Jahren haben die Syrakusaner unsere Armeen vernichtend geschlagen, den Kampfgeist unseres Volkes gebrochen und unsere Stadt niedergebrannt. Warum sollten wir jetzt, wo sich das Blatt gewendet hat, nicht dasselbe tun?"
 01_siculia_missions_task_10_tt: "#Y Sikeliotisch#! ist KEINE integrierte Kultur."
 01_siculia_missions_task_10_effect_tt: "#Y Syrakus#! wird bis auf die Grundmauern niedergebrannt, was wertvolle Beute einbringt, aber die Stadt wird in Schutt und Asche gelegt und einige Einwohner werden dabei ums Leben kommen."
 01_siculia_missions_task_10_mutually_exclusive_tt: "#R Diese Aufgabe schließt die Aufgabe '#T $01_siculia_missions_task_11$#!' aus.#!"  
 01_siculia_missions_task_11: "Die Stadt verschonen"
 01_siculia_missions_task_11_DESC: "Obwohl wir unter den Syrakusanern schwer gelitten haben, können wir nun, da wir über ihre Stadt herrschen, zeigen, dass wir die besseren Menschen sind, indem wir Gnade walten lassen und sie nicht plündern, wie sie es mit unserer Hauptstadt getan haben, und uns so die Loyalität der griechischen Kolonisten sichern. Schließlich wäre es töricht, einen strategischen Handelshafen zu verwüsten."
 01_siculia_missions_task_11_mutually_exclusive_tt: "#R Diese Aufgabe schließt die Aufgabe '#T $01_siculia_missions_task_10$#!' aus.#!"  
 01_siculia_missions_task_12: "Palast wieder aufbauen"
 01_siculia_missions_task_12_DESC: "Auch wenn ihre Existenz nur von kurzer Dauer war, war die Gründung von Palike eine glorreiche Errungenschaft für unser Volk, und ihr bemerkenswert schnelles Wachstum zeigte das unerschlossene Potenzial der Region. Da die Ruinen der Stadt nun fest in unserer Hand sind, können wir Duketios’ größte Errungenschaft zurückerobern und die Stadt neu errichten."
 01_siculia_missions_task_12_tt: "Wir haben die Möglichkeit, #Y Palike#! als unsere neue Hauptstadt festzulegen."
 01_siculia_missions_task_12_tt2: "6 Pops werden sich in #Y Palike#! niederlassen."
  
 01_siculia_missions_task_13: "Unsere Traditionen bewahren"
 01_siculia_missions_task_13_DESC: "Als überzeugter Verfechter der hellenischen Zivilisation übernahm Duketios viele Aspekte dieser Kultur in unsere eigene. Dieser Respekt und diese Bewunderung wurden jedoch von Seiten der Griechen nicht erwidert, die weiterhin unser Kernland kolonisierten und unser Volk an den Rand des Aussterbens brachten. Nun, da unsere Unabhängigkeit gesichert ist, sollten wir unsere lokalen Traditionen und Bräuche denen der Fremden vorziehen."
 01_siculia_missions_task_13_mutually_exclusive_tt: "#R Diese Aufgabe schließt die Aufgaben '#T $01_siculia_missions_task_14$#!' und '#T $01_siculia_missions_task_15$#!' aus.#!"  
 01_siculia_missions_task_14: "Den Spuren von Duketios folgen"
 01_siculia_missions_task_14_DESC: "Als überzeugter Verfechter der hellenischen Zivilisation übernahm Duketios viele Aspekte dieser Kultur in unsere eigene. Nun, da wir über Syrakus und viele andere griechische Kolonien herrschen, sollten wir seine synkretistische Politik der Hellenisierung fortsetzen, um die Zivilisation unseres Reiches und den Fortbestand unserer Herrschaft zu sichern."
 01_siculia_missions_task_14_tt: "#Y Sikeliotisch#! ist eine integrierte Kultur."
 01_siculia_missions_task_14_mutually_exclusive_tt: "#R Diese Aufgabe schließt die Aufgaben '#T $01_siculia_missions_task_13$#!' und '#T $01_siculia_missions_task_15$#!' aus.#!"  
 01_siculia_missions_task_15: "Eine dritte Option"
 01_siculia_missions_task_15_DESC: "Nach der Niederlage der fremden Eindringlinge drehte sich ein Großteil der Debatte in unserem Land darum, ob wir unser Volk weiterhin mit der hellenischen Welt verflechten und von deren Technologie lernen oder den alten Traditionen unserer Vorfahren treu bleiben und das Überleben unserer Kultur sichern sollten. Obwohl wir im Laufe unserer Geschichte stark von den Griechen im Osten beeinflusst wurden, gibt es im Westen eine weitere Zivilisation, die ebenso mächtig ist: die Karthagische. Durch unsere Kontrolle über die punischen Kolonien in Sikanien können wir unsere Kultur mit der ihren in Einklang bringen und die Kunst der Seefahrt erlernen, ohne uns den Griechen unterwerfen zu müssen."
 01_siculia_missions_task_15_tt: "#Y Punisch#! ist eine integrierte Kultur."
 01_siculia_missions_task_15_mutually_exclusive_tt: "#R Diese Aufgabe schließt die Aufgaben '#T $01_siculia_missions_task_14$#!' und '#T $01_siculia_missions_task_13$#!' aus.#!" 
  
 01_siculia_missions_task_9: "Sieg über Karthago"
 01_siculia_missions_task_9_DESC: "Nach vielen langen Jahren sind unsere westlichen Verwandten endlich von ihren fremden punischen Unterdrückern befreit worden. Da der westliche Teil der Insel nun fest unter unserer Kontrolle steht, haben wir Zugang zum strategisch wichtigen Handel im Tyrrhenischen Meer, was [ROOT.GetCountry.GetName] für kommende Generationen Wohlstand sichert."
  
  
 01_siculia_missions_task_16: "Punische Händler aus dem Ausland anlocken"
 01_siculia_missions_task_16_DESC: "Die Karthager beherrschen seit Jahrhunderten den Handel im westlichen Mittelmeerraum, und ihr Wissen und ihre Fachkenntnisse dürften sich nun, da wir ganz Sizilien beherrschen, als unschätzbar wertvoll erweisen. Indem wir die Häfen und Marktplätze in einer der alten phönizischen Kolonien der Insel ausbauen, können wir punische Kaufleute dazu ermutigen, sich dort niederzulassen und ihre Handelsgeheimnisse mitzubringen."
 01_siculia_missions_task_16_tt: "Zwischen #Y 3#! und #Y 12 Punische#! Pops werden entweder in [GetProvince('(int32)7842').GetName], [GetProvince('(int32)96').GetName] oder [GetProvince('(int32)94').GetName] ankommen, je nachdem, welche Stadt die Häfen und Marktplätze hat. Wenn mehr als eine Stadt über die erforderlichen Gebäude verfügt, wählen die Pops zufällig aus, in welcher Stadt sie sich niederlassen."
 #01_siculia_missions_task_15_tt: "Punisch ist eine integrierte Kultur."
 01_siculia_missions_task_17: "Die Loyalität einflussreicher Familien sichern"
 01_siculia_missions_task_17_DESC: "Auch wenn eine solche Verbindung viele Vorteile mit sich bringen wird, wird es ziemlich schwierig sein, unserem Volk zu vermitteln, dass wir uns an eine Kultur binden, die viele als fremd und befremdlich empfinden. Indem wir uns die bedingungslose Loyalität der mächtigsten und einflussreichsten Persönlichkeiten sichern, wird sich die Akzeptanz unserer Reformen von ihnen auf den Rest unserer Gesellschaft ausbreiten oder zumindest jeglichen nennenswerten Widerstand dagegen im Keim ersticken."
 01_siculia_missions_task_17_tt: "Punisch ist eine integrierte Kultur."
  
 01_siculia_missions_task_18: "Die kanaanitische Religion annehmen"
 01_siculia_missions_task_18_DESC: "Der Glaube an unsere Götter hat uns gute Dienste geleistet; doch um den hellenischen Einfluss ein für alle Mal aus unserem Land zu verbannen, müssen wir die hellenischen Lehren und alles, was sie verdorben haben – einschließlich unserer grundlegenden religiösen Praktiken – hinter uns lassen. Auch wenn diese Maßnahmen drastisch sind, sind sie doch notwendig, wenn wir jemals ein eigenständiges Land werden wollen, und nach der schmerzhaften Übergangsphase werden wir einen Neuanfang und einen grenzenlosen Horizont vor uns haben."
  
  
 01_siculia_missions_task_19: "Sich unserer matriarchalischen Bräuche erinnern"
 01_siculia_missions_task_19_DESC: "Lange vor der Ankunft der Griechen waren wir für unsere einzigartigen matriarchalischen Traditionen bekannt, in denen Frauen wesentlich mehr Rechte und Einfluss hatten als heute. Nun, da wir die hellenischen Tyrannen und Usurpatoren abgeschüttelt haben, sollten wir, um den Rest ihres Einflusses auszumerzen, vielleicht zu den alten Bräuchen zurückkehren und den Frauen die alten Privilegien zurückgeben, die sie verloren haben."
 01_siculia_missions_task_26: "Die sikulische Sprache entdecken"
 01_siculia_missions_task_26_DESC: "Unsere alte sikulische Sprache begleitet uns schon so lange, wie wir uns erinnern können, und wird im Landesinneren noch immer von vielen gesprochen. Da jedoch im Laufe der Jahrhunderte so viele Siedler aus Griechenland zu uns gekommen sind, haben unsere bevölkerungsreichsten und einladendsten Gebiete ihr Erbe längst aufgegeben, während die meisten Gelehrten ihre Geschäfte auf Griechisch statt auf Sikulisch abwickeln. Wenn wir nichts unternehmen, um dieser Entwicklung Einhalt zu gebieten, werden wir zu einer Kolonie, die nur dem Namen nach keine ist. Indem wir in unseren bevölkerungsreichsten Gebieten Akademien für die sikulische Sprache gründen und deren Gebrauch in der Verwaltung durchsetzen, können wir die hellenische Flut zurückdrängen und den Städten die Sprache unserer Vorfahren zurückgeben."
  
  
 01_siculia_missions_task_20: "Das hellenische Pantheon offiziell annehmen" 
 01_siculia_missions_task_20_DESC: "Seit Hunderten von Jahren stehen wir in Kontakt mit der hellenischen Welt, oft im Gefolge fremder Eroberer. Auch wenn wir nach wie vor Sikeler sind, können wir den Einfluss, den die Griechen auf uns hatten und immer noch haben, nicht länger leugnen. Deshalb sollten wir, um voranzukommen, die Übernahme des hellenischen Pantheons offiziell verkünden, da es seit vielen Jahren de facto unsere Religion ist."
 01_siculia_missions_task_20_tt: "Wir sind zur #Y Hellenisch#! Religion konvertiert durch die Entscheidung #Y Von Italischer zu Hellenischer Religion konvertieren#!."
 01_siculia_missions_task_27: "Wissenssammlungen"
 01_siculia_missions_task_27_DESC: "Die griechische Welt ist reich an philosophischen Lehren, Kunst, Geschichte und Gelehrsamkeit – von den Werken Platons bis zu den „Historiens“ des Herodot. Durch die Bereitstellung öffentlicher Mittel für Bibliotheken in unseren großen Städten können wir [ROOT.GetCountry.GetName] als Hochburg des griechischen Wissens und des wissenschaftlichen Fortschritts etablieren."
 01_siculia_missions_task_27_tt: "Ein talentierter #Y Hellenischer#! Wissenschaftler wird in unser Land reisen."
  
 01_siculia_missions_task_21: "Sizilien vereint"
 01_siculia_missions_task_21_DESC: "Nach vielen Jahren voller Leid und Kampf haben wir endlich die fremden Tyrannen von unseren Küsten vertrieben. Nun, da die gesamte Insel wieder unter einheimischer Herrschaft steht, ist es an der Zeit, dass wir auch den alten Namen wiederherstellen, den unsere Vorfahren ihr gegeben haben: #Y Trinakie#!.  In diesem Namen können wir eine Nation für alle Sikeler ausrufen."
 01_siculia_missions_task_21_tt: "Wir haben den Beschluss #Y „Sizilien vereinen“#! in die Tat umgesetzt."
  
 01_siculia_missions_task_22: "Die Macht konsolidieren"
 01_siculia_missions_task_22_DESC: "Da nun keine Fremden mehr an unseren Küsten unsere Lebensweise bedrohen, ist es an der Zeit, unseren Blick nach innen zu richten und sicherzustellen, dass [ROOT.GetCountry.GetName] nie wieder den Launen fremder Tyrannen ausgeliefert sein wird. Duketios war ein starker Anführer, der unser Volk mit seinem Charisma, seinem Intellekt und seiner bloßen Persönlichkeit zusammenhielt. Indem [ROOT.GetCountry.GetRuler.GetName] dem Beispiel von Duketios folgt, kann er die Macht weg von den Häuptlingen konsolidieren und für Stabilität sorgen."
 01_siculia_missions_task_22_mutually_exclusive_tt: "#R Diese Aufgabe schließt die Aufgabe '#T $01_siculia_missions_task_23$#!' aus.#!"  
 01_siculia_missions_task_24: "Mächtige Ämter sichern"
 01_siculia_missions_task_24_DESC: "Der vielleicht beste Weg, die Machtbasis von [ROOT.GetCountry.GetRuler.GetName] zu sichern, besteht darin, [ROOT.GetCountry.GetRuler.GetHerHis]e treuen Familienmitglieder strategisch in einflussreiche Positionen in der gesamten Regierung zu bringen, da sie in einer Monarchie am meisten zu gewinnen haben und daher am ehesten bereit sein werden, den Übergang zu unterstützen."
 01_siculia_missions_task_25: "Monarchie ausrufen"
 01_siculia_missions_task_25_DESC: "Indem [ROOT.GetCountry.GetRuler.GetSheHe] treue Verwandte in Schlüsselpositionen der Regierung einsetzte und dank [ROOT.GetCountry.GetRuler.GetHerHis]er großer Beliebtheit beim einfachen Volk der Sikeler, ist es [ROOT.GetCountry.GetRuler.GetName] gelungen, eine seit der Zeit von Duketios beispiellose Macht anzuhäufen, und [ROOT.GetCountry.GetRuler.GetSheHe] kann nun sich selbst offiziell zum König von [ROOT.GetCountry.GetName] krönen. Lang lebe Rex [ROOT.GetCountry.GetRuler.GetName]!"
  
 01_siculia_missions_task_23: "Keine Tyrannen mehr!"
 01_siculia_missions_task_23_DESC: "Da keine Fremden mehr an unseren Küsten unsere Lebensweise bedrohen, ist es nun an der Zeit, unseren Blick nach innen zu richten und sicherzustellen, dass [ROOT.GetCountry.GetName] nie wieder den Launen fremder Tyrannen ausgeliefert sein wird. Duketios war ein starker Anführer, der unser Volk zusammenhielt, doch nach seiner Niederlage brach das alte Siculia zusammen, und 150 Jahre lang hing unser Leben am seidenen Faden; indem wir die Macht auf eine gewählte Kammer statt auf einen einzigen Herrscher aufteilen, ähnlich wie bei den griechischen und punischen Republiken, können wir sicherstellen, dass unser Schicksal nicht an einen einzigen Mann gebunden ist."
 01_siculia_missions_task_23_mutually_exclusive_tt: "#R Diese Aufgabe schließt die Aufgabe '#T $01_siculia_missions_task_22$#!' aus.#!"  
  
