 me_siculia_50_title: "Duketios' Vermächtnis"
 me_siculia_50_desc: "Vor 150 Jahren vereinte der große Duketios die verschiedenen sikelischen Stämme unter seinem Banner, gründete auf seinem Siegeszug blühende neue Städte und eroberte eine hellenische Kolonie nach der anderen. Doch nach seiner Niederlage in der Schlacht von Nomae gegen die verräterischen Syrakusaner wurde die pan-sikelische Armee vernichtet, die Hauptstadt Palike bis auf die Grundmauern niedergebrannt und der von ihm geschmiedete Bund löste sich in sich selbst auf. Da unser Volk zerstreut und gespalten ist, konnten die Griechen und Karthager den Rest der Insel kolonisieren, sodass wir nun im abgelegenen Landesinneren am seidenen Faden hängen. Es wird schwierig werden, doch als letzte Sikeler sind wir die einzigen Erben des stolzen Vermächtnisses von Duketios, und sollte es uns gelingen, die syrakusischen und karthagischen Kolonisten zurückzudrängen, können wir unser verlorenes Königreich wiederherstellen und unser Überleben für viele kommende Generationen sichern."
 me_siculia_50.a: "Duketios soll gerächt werden!"
  
 me_siculia_1_title: "Vorbereitung auf den Krieg"
 me_siculia_1_desc: "Wir können nicht hoffen, den bevorstehenden Überlebenskampf allein durch Glauben und Tapferkeit zu überstehen. Deshalb  haben wir durch die Übernahme fortschrittlicher Ausbildungs-Taktiken unserer Nachbarn und durch die Sicherstellung, dass unsere Männer auf dem Schlachtfeld Zugang zu Waffen höchster Qualität haben, qualitative Gleichwertigkeit gewährleistet."
 me_siculia_1.a: "Exzellent."
 me_siculia_2_title: "Neue Allianzen schmieden"
 me_siculia_2_desc: "Da wir zahlenmäßig stark unterlegen sind, können wir unmöglich hoffen, allein gegen unsere Feinde zu den Waffen zu greifen. Deshalb haben wir durch den Abschluss von Bündnissen mit unseren Nachbarn – und sei es auch nur vorübergehend – dazu beigetragen, die Kräfteverhältnisse auszugleichen."
 me_siculia_2.a: "Exzellent."
 me_siculia_3_title: "Akragas angreifen"
 me_siculia_3_desc: "Seit ihrer fast vollständigen Zerstörung durch Karthago vor einem Jahrhundert ist die Stadt Akragas nicht mehr der ernstzunehmende Gegner, der sie zu Duketios’ Zeiten war, sondern befindet sich in einem ständigen Verfall und Niedergang. Auch wenn Akragas kein leichtes Ziel ist,  steht die Stadt auf der Insel allein. Dies bietet uns die perfekte Gelegenheit, jetzt zuzuschlagen und uns den Zugang zu ihrem wertvollen Hafen zu sichern, bevor er von den Karthagern eingenommen wird."
 me_siculia_3.a: "Jetzt angreifen!"
 me_siculia_3.b: "Wir werden warten, bis sie beschäftigt sind."
 #me_siculia_5_title: "Betray Calactea and Tyndaris"  
 me_siculia_5_title: "Tyndaris verraten"
 #me_siculia_5_desc: "Although nominally our allies, the cities of Calactea and Tyndaris have been drifting close to Syracuse's orbit over the years, and with Agathokles' growing ambitions, it is only a matter of time before they find themselves in his iron grip. If we can strike first, we can secure access to the northern coast and put a dent in Syracusan expansionism." 
 me_siculia_5_desc: "Obwohl die Stadt Tyndaris nominell unser Verbündeter ist, hatte sie sich im Laufe der Jahre immer mehr in den Einflussbereich unseres Feindes Syrakus bewegt. Nun, da dessen elendes Reich zerstört ist, ist es nur eine Frage der Zeit, bis sie sich im eisernen Griff einer anderen Großmacht wiederfindet – warum nicht unserer? Wenn wir zuerst zuschlagen, können wir uns den Zugang zur Nordküste sichern und den Expansionsbestrebungen potenzieller Eroberer Einhalt gebieten."
 me_siculia_5.a: "Das werden sie niemals ahnen!"
 me_siculia_5.b: "Wir werden warten, bis sie beschäftigt sind."
 me_siculia_6_title: "Geld für Söldner zurücklegen"
 me_siculia_6_desc: "Unsere Männer haben inzwischen die fortgeschrittenen Trainingsmethoden unserer Nachbarn erlernt und haben Zugang zu hochwertigen Waffen. Unsere Armee ist jedoch klein und es stehen nur wenige Männer im kampffähigen Alter für unsere Aushebungen zur Verfügung. Glücklicherweise gibt es auf unserer Insel viele erfahrene Soldaten, die angeheuert werden können. Indem wir einen beträchtlichen Goldvorrat ansparen, können wir eine Streitmacht aufstellen, die unseren Feinden ebenbürtig ist."
 me_siculia_6.a: "Nun warten wir..."
  
 me_siculia_4_title: "Die Schlacht von Nomae rächen"
 me_siculia_4_desc: "Vor langer Zeit war Syrakus unser Verbündeter und unterstützte Duketios in seinem Befreiungskampf. Doch aus Angst und Neid angesichts unserer Macht haben sie unser Vertrauen missbraucht und sich auf die Seite von Akragas geschlagen, was schließlich zu unserer Vernichtung in der Schlacht von Nomae führte. Nun, da unser alter Feind verwundbar und abgelenkt ist und unsere Vorbereitungen abgeschlossen sind, ist es an der Zeit, gemeinsam mit unseren neuen Verbündeten zuzuschlagen, bevor Syrakus seine Verteidigung verstärken kann."
 me_siculia_4.a: "Auf in den Krieg!"
 me_siculia_4.b: "Wir müssen unsere Zeit abwarten."
 me_siculia_7_title: "Unsere Verwandten befreien"
 me_siculia_7_desc: "Vor langer Zeit eroberten und unterwarfen die Phönizier und Griechen die Elymer, die enge Verwandte unseres Volkes sind und den westlichen Teil der Insel bewohnen. Karthago konzentriert derzeit seine Kräfte auf auswärtige Gebiete und unterhält nur noch eine minimale Truppenstärke zum Schutz seiner sizilischen Besitzungen: sollten wir schnell und entschlossen zuschlagen, können wir die Häfen sichern, bevor punische Verstärkung eintrifft, und unsere Verwandten von der fremden Tyrannei befreien."
 me_siculia_7.a: "Auf in den Krieg!"
 me_siculia_7.b: "Wir müssen unsere Zeit abwarten."
  
 me_siculia_8_title: "Sieg über Syrakus"
 me_siculia_8_desc: "Endlich haben wir die griechischen Unterdrücker vertrieben und sie zurück ins Meer geworfen, von wo sie gekommen sind. Nachdem wir Duketios gerächt haben, können wir uns nun darauf konzentrieren, dort weiterzumachen, wo er aufgehört hat, und unser eigenes Schicksal zu gestalten."
 me_siculia_8.a: "Ruhm allen Sikelern"
 me_siculia_9_title: "Sieg über Karthago"
 me_siculia_9_desc: "Nach vielen langen Jahren sind unsere westlichen Verwandten endlich von ihren ausländischen punischen Unterdrückern befreit worden. Da der westliche Teil der Insel nun unter unserer Kontrolle steht, haben wir Zugang zum strategischen Tyrrhenischen Handel und sichern [ROOT.GetCountry.GetName] damit für kommende Generationen Wohlstand."
 me_siculia_9.a: "Ruhm allen Sikelern"
 me_siculia_12_title: "Wiederaufbau von Palike"
 me_siculia_12_desc: "Mit dem Wiederaufbau von Palike sind die Sikeler in ganz [ROOT.GetCountry.GetName] überglücklich, und viele Menschen aus dem ganzen Land strömen herbei, um sich dort niederzulassen. Dies wirft ein interessantes Dilemma auf: Behalten wir [ROOT.GetCountry.GetCapital.GetName] als Hauptstadt bei, oder erklären wir – zu Ehren des Vermächtnisses von Duketios – Palike zum Zentrum unserer sikelischen Nation?"
 me_siculia_12.a: "Palike soll wieder zum Zentrum unserer Zivilisation werden!"
 me_siculia_12.b: "[ROOT.GetCountry.GetCapital.GetName] ist eine geeignete Hauptstadt."
 me_siculia_12.a_tt: "#Y Aufstrebende Hauptstadt#! wird von der alten Hauptstadt nach #Y Palike#! verlegt."
 me_siculia_21_title: "Sizilien vereint"
 me_siculia_21_desc: "Nach vielen Jahren voller Leid und Kampf haben wir endlich die fremden Tyrannen von unseren Küsten vertrieben. Nun, da die gesamte Insel wieder unter einheimischer Herrschaft steht, ist es an der Zeit, dass wir auch den alten Namen wiederherstellen, den unsere Vorfahren ihr gegeben haben: #Y Trinakie#!.  In diesem Namen können wir eine Nation für alle Sikeler ausrufen."
 me_siculia_21.a: "Und so soll es für alle Zeit sein."
 me_siculia_11_title: "Syrakus verschont"
 me_siculia_11_desc: "Obwohl wir unter den Syrakusanern schwer gelitten haben, können wir nun, da wir über ihre Stadt herrschen, zeigen, dass wir die besseren Menschen sind, indem wir Gnade walten lassen und sie nicht plündern, wie sie es mit unserer Hauptstadt getan haben, und uns so die Loyalität der griechischen Kolonisten sichern. Schließlich wäre es töricht, einen strategischen Handelshafen zu verwüsten."
 me_siculia_11.a: "Es ist klug, das Kriegsbeil zwischen unseren beiden Völkern zu begraben."
 me_siculia_14_title: "Auf den Spuren von Duketios"
 me_siculia_14_desc: "Als überzeugter Verfechter der hellenischen Zivilisation übernahm Duketios viele Aspekte dieser Kultur in unsere eigene. Nun, da wir über Syrakus und viele andere griechische Kolonien herrschen, sollten wir seine synkretistische Politik der Hellenisierung fortsetzen, um die Zivilisation unseres Reiches und den Fortbestand unserer Herrschaft zu sichern."
 me_siculia_14.a: "Der Synkretismus ist für beide Seiten von Vorteil."
 me_siculia_20_title: "Die offizielle Annahme des hellenischen Pantheons"
 me_siculia_20_desc: "Seit Hunderten von Jahren stehen wir in Kontakt mit der hellenischen Welt, oft im Gefolge fremder Eroberer. Auch wenn wir nach wie vor Sikeler sind, können wir den Einfluss, den die Griechen auf uns hatten und immer noch haben, nicht länger leugnen. Deshalb sollten wir, um voranzukommen, die Übernahme des hellenischen Pantheons offiziell verkünden, da es seit vielen Jahren de facto unsere Religion ist."
 me_siculia_20.a: "Für Zeus!"
  
 me_siculia_15_title: "Eine dritte Option"
 me_siculia_15_desc: "Nach der Niederlage der fremden Eindringlinge drehte sich ein Großteil der Debatte in unserem Land darum, ob wir unser Volk weiterhin mit der hellenischen Welt verflechten und von deren Technologie lernen oder den alten Traditionen unserer Vorfahren treu bleiben und das Überleben unserer Kultur sichern sollten. Obwohl wir im Laufe unserer Geschichte stark von den Griechen im Osten beeinflusst wurden, gibt es im Westen eine weitere Zivilisation, die ebenso mächtig ist: die karthagische. Durch unsere Kontrolle über die punischen Kolonien in Sikanien können wir unsere Kultur mit der ihren in Einklang bringen und die Kunst der Seefahrt erlernen, ohne uns den Griechen unterwerfen zu müssen."
 me_siculia_15.a: "Eine unorthodoxe Lösung."
 me_siculia_16_title: "Anwerbung punischer Händler aus dem Ausland"
 me_siculia_16_desc: "Nachdem in der Region Hafeninfrastruktur und Marktplätze errichtet wurden, haben zahlreiche punische Kaufleute Interesse daran bekundet, sich in unserem Land niederzulassen. Viele sind jedoch noch unentschlossen, und ein starker finanzieller Anreiz könnte ausreichen, um sie zu überzeugen..."
 me_siculia_16.a: "Die Hafeninvestitionen sind Anreiz genug, sie können sie annehmen oder ablehnen."
 me_siculia_16.b: "Eine kleine Geldzahlung sollte reichen."
 me_siculia_16.c: "Macht ihnen ein Angebot, das sie nicht ablehnen können."
 me_siculia_16.d: "Andererseits könnte man ihnen vielleicht stattdessen ein Mitspracherecht in der [ROOT.GetCountry.GetAdjective]en Verwaltung anbieten..."
 me_siculia_17_title: "Die Loyalität einflussreicher Familien ist gesichert"
 me_siculia_17_desc: "Auch wenn eine solche Verbindung viele Vorteile mit sich bringen wird, wird es ziemlich schwierig sein, unserem Volk zu vermitteln, dass wir uns an eine Kultur binden, die viele als fremd und befremdlich empfinden. Indem wir uns die bedingungslose Loyalität der mächtigsten und einflussreichsten Persönlichkeiten sichern, wird sich die Akzeptanz unserer Reformen von ihnen auf den Rest unserer Gesellschaft ausbreiten oder zumindest jeglichen nennenswerten Widerstand dagegen im Keim ersticken."
 me_siculia_17.a: "Perfekt."
 me_siculia_18_title: "Die Übernahme der kanaanitischen Religion"
 me_siculia_18_desc: "Der Glaube an unsere Götter hat uns gute Dienste geleistet; doch um den hellenischen Einfluss ein für alle Mal aus unserem Land zu verbannen, müssen wir die hellenischen Lehren und alles, was sie verdorben haben – einschließlich unserer grundlegenden religiösen Praktiken – hinter uns lassen. Auch wenn diese Maßnahmen drastisch sind, sind sie doch notwendig, wenn wir jemals ein eigenständiges Land werden wollen, und nach der schmerzhaften Übergangsphase werden wir einen Neuanfang und einen grenzenlosen Horizont vor uns haben."
 me_siculia_18.a: "Für Tanit!"
  
 me_siculia_10_title: "Die Plünderung von Syrakus"
 me_siculia_10_desc: "Im Laufe von fünf Tagen plünderten und verwüsteten die gierigen [ROOT.GetCountry.GetAdjective]en Soldaten die Stadt Syrakus und ließen dabei kein Gebäude unversehrt. Überlebende schilderten Szenen der Barbarei, die an die Plünderung Trojas erinnerten: Dutzende Tempel wurden geschändet, Krieger schleppten ganze Wagenladungen Gold davon, und der Boden selbst wurde mit Salz bestreut, damit dort nie wieder etwas wachsen sollte. Obwohl wir dafür gesorgt haben, dass Syrakus nie wieder auferstehen wird, haben Schockwellen die gesamte hellenistische Welt erschüttert, und diese Gräueltat wurde auf breiter Front verurteilt."
 me_siculia_10.a: "Syrakus wird unser Volk nie wieder bedrohen."
 me_siculia_10.a_tt: "6 Pops der Stadt werden umkommen."
 me_siculia_13_title: "Bewahrung unserer Traditionen"
 me_siculia_13_desc: "Als überzeugter Verfechter der hellenischen Zivilisation übernahm Duketios viele Aspekte dieser Kultur in unsere eigene. Dieser Respekt und diese Bewunderung wurden jedoch von Seiten der Griechen nicht erwidert, die weiterhin unser Kernland kolonisieren und unser Volk an den Rand des Aussterbens bringen. Indem wir dafür sorgen, dass unser Hohepriester mit den alten Riten und Ritualen unseres Volkes bestens vertraut ist, stellen wir sicher, dass diese für künftige Generationen bewahrt bleiben."
 me_siculia_13.a: "Sie werden niemals in Vergessenheit geraten."
 me_siculia_19_title: "Erinnerung an unsere matriarchalischen Bräuche"
 me_siculia_19_desc: "Lange vor der Ankunft der Griechen waren wir für unsere einzigartigen matriarchalischen Traditionen bekannt, in denen Frauen wesentlich mehr Rechte und Einfluss hatten als heute. Nachdem wir nun die hellenischen Tyrannen und Usurpatoren vertrieben und ihren restlichen Einfluss ausgelöscht haben, sollten wir vielleicht zu den alten Gepflogenheiten zurückkehren und den Frauen die alten Privilegien zurückgeben, die sie verloren haben."
 me_siculia_19.a: "Unser verlorenes Erbe soll wiederhergestellt werden."
 me_siculia_26_title: "Die sikulische Sprache entdecken"
 me_siculia_26_desc: "Unsere alte sikulische Sprache begleitet uns schon so lange, wie wir uns erinnern können, und wird im Landesinneren noch immer von vielen gesprochen. Da jedoch im Laufe der Jahrhunderte so viele Siedler aus Griechenland zu uns gekommen sind, haben unsere bevölkerungsreichsten und einladendsten Gebiete ihr Erbe längst aufgegeben, während die meisten Gelehrten ihre Geschäfte auf Griechisch statt auf Sikulisch abwickeln. Wenn wir nichts unternehmen, um dieser Entwicklung Einhalt zu gebieten, werden wir zu einer Kolonie, die nur dem Namen nach keine ist. Indem wir in unseren bevölkerungsreichsten Gebieten Akademien für die sikulische Sprache gründen und deren Gebrauch in der Verwaltung durchsetzen, können wir die hellenische Flut zurückdrängen und den Städten die Sprache unserer Vorfahren zurückgeben."
 me_siculia_26.a: "Nunus tenti mím arustainam íemitom."
 me_siculia_27_title: "Hochburg hellenischen Wissens"
 me_siculia_27_desc: "Mit dem Bau öffentlicher Bibliotheken im ganzen Land hat sich [ROOT.GetCountry.GetName] zu einem Leuchtturm des Hellenismus im Westen entwickelt, dessen Straßen vom Klang großer Debatten widerhallen, was viele Gelehrte aus dem griechischen Festland anzieht. Ein Gelehrter hat sich dabei durch einen außergewöhnlich scharfen Verstand ausgezeichnet und wäre der perfekte Forscher, sollten wir ihm die Möglichkeit geben, sich einzubringen."
 me_siculia_27.a: "Exzellent."
  
 me_siculia_23_title: "Keine Tyrannen mehr!"
 me_siculia_23_desc: "Da keine Fremden mehr an unseren Küsten unsere Lebensweise bedrohen, ist es nun an der Zeit, unseren Blick nach innen zu richten und sicherzustellen, dass [ROOT.GetCountry.GetName] nie wieder den Launen fremder Tyrannen ausgeliefert sein wird. Duketios war ein starker Anführer, der unser Volk zusammenhielt, doch nach seiner Niederlage brach das alte Siculia zusammen, und 150 Jahre lang hing unser Leben am seidenen Faden; indem wir die Macht auf eine gewählte Kammer statt auf einen einzigen Herrscher aufteilen, ähnlich wie bei den griechischen und punischen Republiken, können wir sicherstellen, dass unser Schicksal nicht an einen einzigen Mann gebunden ist."
 me_siculia_23.a: "Viele Köpfe sind besser als einer."
  
 me_siculia_22_title: "Die Macht konsolidieren"
 me_siculia_22_desc: "Da nun keine Fremden mehr an unseren Küsten unsere Lebensweise bedrohen, ist es an der Zeit, unseren Blick nach innen zu richten und sicherzustellen, dass [ROOT.GetCountry.GetName] nie wieder den Launen fremder Tyrannen ausgeliefert sein wird. Duketios war ein starker Anführer, der unser Volk mit seinem Charisma, seinem Intellekt und seiner bloßen Persönlichkeit zusammenhielt. Indem [ROOT.GetCountry.GetRuler.GetName] dem Beispiel von Duketios folgt, kann er die Macht weg von den Häuptlingen konsolidieren und für Stabilität sorgen."
 me_siculia_22.a: "Ein einziger Herrscher wird für Entschlossenheit und rasches Handeln sorgen."
  
 me_siculia_24_title: "Mächtige Ämter sichern"
 me_siculia_24_desc: "Der vielleicht beste Weg, die Machtbasis von [ROOT.GetCountry.GetRuler.GetName] zu sichern, besteht darin, [ROOT.GetCountry.GetRuler.GetHerHis]e treuen Familienmitglieder strategisch in einflussreiche Positionen in der gesamten Regierung zu bringen, da sie in einer Monarchie am meisten zu gewinnen haben und daher am ehesten bereit sein werden, den Übergang zu unterstützen."
 me_siculia_24.a: "Da nun alle Voraussetzungen gegeben sind, ist es an der Zeit, zu handeln."
 me_siculia_25_title: "Monarchie ausrufen"
 me_siculia_25_desc: "Durch die Besetzung wichtiger Regierungspositionen mit loyalen Verwandten und durch [ROOT.GetCountry.GetRuler.GetHerHis]e große Popularität unter den einfachen Sikelern gelang es [ROOT.GetCountry.GetRuler.GetName], eine Macht anzuhäufen wie seit der Zeit des Duketios nicht mehr, und er kann nun [ROOT.GetCountry.GetRuler.GetHerselfHimself] selbst offiziell zum König von [ROOT.GetCountry.GetName] krönen."
 me_siculia_25.a: "Lang lebe Rex [ROOT.GetCountry.GetRuler.GetName]!"