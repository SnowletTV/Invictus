 cynetic_sea_caves_modifier: "Zynetische Meereshöhlen" 
 desc_cynetic_sea_caves_modifier: "Die beeindruckenden Kalksteinfelsen und tiefen Meereshöhlen entlang dieser Küste bieten unvergleichliche natürliche Schutzwälle und reichlich Nahrung aus dem Meer. Aufgrund ihrer labyrinthartigen Anordnung ist es jedoch nahezu unmöglich, geltendes Recht durchzusetzen. Es ist ein wildes, ungezähmtes Grenzgebiet, in dem sich die Einheimischen den Magistraten leicht entziehen können und sich aktiv dem Vormarsch der Zivilisation und der kulturellen Assimilation widersetzen. 
