l_russian:
 LOADING_TIP_0:0 "Если ты должен нарушить закон, делай это для захвата власти; во всех остальных случаях соблюдай его.\nГай Юлий Цезарь"
 LOADING_TIP_1:1 "Среди друзей я был щедрейшим, свирепейшим — среди врагов.\nЛуций Корнелий Сулла"
 LOADING_TIP_2:0 "Чем ближе государство к падению, тем многочисленнее его законы.\nПублий Корнелий Тацит"
 LOADING_TIP_3:1 "Боязнь чужаков стала узами, крепче которых не найти, — она связала их, заставила отложить вражду и недоверие и объединиться.\nТит Ливий"
 LOADING_TIP_4:0 "Все заботятся не о том, правильно ли живут, а о том, долго ли проживут; между тем жить правильно — это всем доступно, жить долго — никому.\nЛуций Анней Сенека"
 LOADING_TIP_5:0 "Кроме того, я думаю, что Карфаген должен быть разрушен.\nМарк Порций Катон"
 LOADING_TIP_6:0 "Нельзя пасть жертвой предательства, если вообще никому не доверяешь.\nМартин Анвардий"
 LOADING_TIP_7:2 "Практиковать мораль — похвально, но что есть мораль? Она включает в себя несколько грехов, множество благочестивых деяний, сострадание, правдолюбие и чистоту.\nЭдикты Ашоки, II Большой наскальный эдикт"
 LOADING_TIP_8:2 "Ты мне пеняешь, Велокс, что длинны мои эпиграммы. Сам ты не пишешь совсем: право, короче нельзя.\nМарк Валерий Марциал"
 LOADING_TIP_9:2 "Да будет брошен жребий!\nприписывается Гаю Юлию Цезарю (который, вероятно, цитировал Менандра), перешедшему Рубикон и вошедшему с войском в Италию"
 LOADING_TIP_10:2 "Когда захочешь хорошо повеселиться, я буду в должном виде... жиреть и лосниться, как подобает истинному хряку Эпикурова стада.\nКвинт Гораций Флакк"
 LOADING_TIP_11:2 "Слова восхищают ум и окрыляют душу.\nАристофан"
 LOADING_TIP_12:2 "Царь должен помнить три вещи: что он властвует над людьми, что он властвует сообразно законам, что власть его не вечна.\nАгатон"
 LOADING_TIP_13:2 "Большие книги — большое зло.\nКаллимах"
 LOADING_TIP_14:2 "На обеды друзей ходи медленно, на беды — быстро.\nХилон Спартанский"
 LOADING_TIP_15:3 "Мудрость приносит сильному пользу, но без неё он чаще вредит самому себе.\nИзократ"
 LOADING_TIP_16:2 "Если не был бы ты мне глаз дороже, Кальв мой милый, тебя за твой гостинец ненавидел бы я ватиниански. Что такого сказал я или сделал, что поэтов ты шлёшь меня прикончить?\nГай Валерий Катулл"
 LOADING_TIP_17:2 "И в человеческом теле, и в Империи худшие болезни идут от головы.\nГай Плиний Цецилий Секунд, прозванный Младшим"
 LOADING_TIP_18:2 "Потерпевший кораблекрушение и тихой воды страшится.\nПублий Овидий Назон"
 LOADING_TIP_19:2 "Кроме того, это небезопасно, а значит, никакой чести в этом нет. Если нам суждено пасть, позволь отправиться опасности навстречу.\nЛакон и Икел, советники императора Гальбы"
 LOADING_TIP_20:2 "Те, кои глупым хотят казаться умными, умным кажутся глупыми.\nМарк Фабий Квинтилиан"
 LOADING_TIP_21:2 "Он понял, что наш город нуждается в таком человеке, а вся Эллада — в таком городе, который смог бы взять на себя руководство, и предоставил самого себя отечеству, а наш город — эллинам для борьбы за свободу.\nГиперид об афинском полководце Леосфене"
 LOADING_TIP_22:4 "«У меня нет времени», — сказал Деметрий. «Тогда не будь царём!» — прокричала старуха.\nПлутарх"
 LOADING_TIP_23:2 "Но когда мы вернём себе всё, что тогда станем делать?\nКиней, советник царя Пирра"
 LOADING_TIP_24:1 "Друзья, какое поле боя мы оставляем римлянам и карфагенянам!\nПирр"
 LOADING_TIP_25:2 "«Так почему же ты не ведёшь нас на них, пока кровь в наших жилах ещё не высохла?» — спросили воины. «Сперва нужно укрепить лагерь», — спокойно отвечал Марий.\nПлутарх"
 LOADING_TIP_26:2 "Здесь лежит человек, который более чем кто-либо из других смертных сделал добра своим друзьям и зла врагам.\nЛуций Корнелий Сулла"
 LOADING_TIP_27:1 "Сначала должны говорить просители, победители же пусть хранят молчание.\nЛуций Корнелий Сулла"
 LOADING_TIP_28:2 "Отличный щит, только римлянину больше пристало полагаться не на то, что в левой руке, а на то, что в правой.\nПублий Корнелий Сципион Африкан Эмилиан"
 LOADING_TIP_29:2 "Ни Риму пасть, пока стоит Сципион, ни Сципиону жить, когда Рим падёт.\nПублий Корнелий Сципион Африкан Эмилиан"
 LOADING_TIP_30:2 "Римляне — народ, который не может смириться с поражением. Позор, перенесённый ими, будет донимать их вечно и не даст им покоя до тех пор, пока они не возьмут своё стократ.\nГеренний Понтий, отец Гая Понтия, одержавшего победу при Кавдинском ущелье"
 LOADING_TIP_31:2 "Грешники, вы грешите против ваших отцов, которые завоевали весь мир при Филиппе и Александре?\nАнтиген, полководец Аргираспида, в битве за Габиене"
 LOADING_TIP_32:1 "Будь сильным или дружи с сильными.\nФокион"
 LOADING_TIP_33:2 "Даже если не будет другой пользы, о меня затупится меч врага.\nСпартанская поговорка, записана Плутархом"
 LOADING_TIP_34:2 "Настали опасные времена. К власти пришли высокомерные люди, что смеются над нами. Но вы, мои сыновья, оставайтесь преданы Закону и будьте готовы умереть, чтобы защитить то, что бог завещал нашим предкам.\nМаттафия, предводитель восстания маккавеев"
 LOADING_TIP_35:3 "Хоть я и был отделён от их империи со всех сторон другими царствами и тетрархиями, но, поскольку римлянам стало известно, что я богат и не желаю покоряться, они вынудили меня воевать.\nМитридат"
 LOADING_TIP_36:0 "Разве вам не известно, что римляне повернули своё оружие в эту сторону лишь после того, как океан преградил им путь на запад? Что с самого начала их существования у них было лишь то, что они украли: их дома, их жёны, их земли, их империя? Некогда они были бродягами, без родины, без предков, теперь же они стали проклятием всего мира.\nМитридат"
 LOADING_TIP_37:1 "Карфагенянин тащит за собой армию, в которой даже нет уроженцев Африки — он собрал её из самых дальних уголков мира, из океанских проливов и с Геркулесовых столпов, — бесправный сброд, едва наделённый даром речи.\nГай Теренций Варрон"
 LOADING_TIP_38:0 "Марий, взирающий на Карфаген, и Карфаген при виде Мария могли бы служить друг другу утешением.\nМарк Веллей Патеркул"
 LOADING_TIP_39:0 "Кто бы удержался и не пошёл на Ливию или Карфаген, когда город был в пределах досягаемости: город, который Агафокл едва не упустил, спешно покинув Сиракузы и перейдя море с несколькими кораблями?\nПирр"
 LOADING_TIP_40:0 "Из тех же вещей, из которых рождаются все сущие вещи, в эти же самые вещи они разрушаются согласно предназначению.\nАнаксимандр Милетский"
 LOADING_TIP_41:1 "Ни одному смертному не дано избежать гибельной воли богов.\nСофокл"
 LOADING_TIP_42:0 "Я не стану говорить о военных походах, в которых мы обрели разные свои богатства, и о том пыле, с которым мы и наши отцы сражались с врагами, будь то эллины или варвары: истории эти будут длинны, и вам они уже известны.\nПерикл"
 LOADING_TIP_43:0 "Мы регулярно проводим игры и жертвоприношения, дома наши красивы, а радость, которую всё это даёт нам каждый день, помогает уменьшить горе.\nПерикл"
 LOADING_TIP_44:1 "Люди Эллады, я привёл вас сюда потому, что хотел показать глупость правителя мидян, который, живя такой привольной жизнью, явился к нам, чтобы отнять у нас наше. Поистине, это достойно сожаления.\nСпартанский полководец Павсаний в битве при Платеях"
 LOADING_TIP_45:1 "Если против тебя выйдет лишь тысяча человек, значит, тысяча человек будет биться с тобой.\nСвергнутый царь Спарты Демарат о спартанцах"
 LOADING_TIP_46:1 "Одним словом, можно сказать, сама природа предназначила афинян к тому, чтобы и самим не иметь покоя, и другим людям не давать его.\nФукидид, афинский посол в Спарте"
 LOADING_TIP_47:0 "Всякая речь, если только не следует за нею дело, кажется чем-то суетным и пустым.\nДемосфен"
 LOADING_TIP_48:0 "Плыть необходимо, а жить — нет!\nГней Помпей Великий"
 LOADING_TIP_49:0 "Дайте мне точку опоры, и я переверну Землю.\nАрхимед"
 LOADING_TIP_50:1 "Не трогай мои чертежи!\nПоследние слова Архимеда о песке, где он рисовал круги"
 LOADING_TIP_51:1 "Пирр, царь молосский, посвящает Афине Итонийской эти щиты,\nотнятые им у надменных галатов, лишив Антигона всего войска.\nЭто неудивительно; как прежде, так и теперь эакиды воинственны.\nНадпись, оставленная Пирром в честь Афины Итонийской после битвы на Аоосе"
 LOADING_TIP_52:0 "...Об этом можно толковать только между собирающейся на площади чернью; что в том нет ничего верного; что они с оружием в руках должны только помнить, что «Знаменье то лишь благое, чтобы сражаться за Пирра!»\nслова Пирра после того, как другие усомнились в его вещем сне."
 LOADING_TIP_53:0 "Хищничать, убивать, грабить они называют лживым словом «владычество», а когда обратят державу в пустыню, это называют миром.\nКаледонский вождь Калгак о римлянах"
 LOADING_TIP_54:0 "Тот, кто сбежал, сможет вернуться в бой.\nМенандр"
 LOADING_TIP_55:0 "Время от времени напоминай себе, что ты — человек.\nМенандр"
 LOADING_TIP_56:0 "И в трудные времена можно найти радость.\nМенандр"
 LOADING_TIP_57:0 "Тот, кого любят боги, умирает молодым.\nМенандр"
 LOADING_TIP_58:0 "Благоразумие спасительно. Эту истину не понять с друзьями, её стремительно объясняют враги. Это враги, а не друзья заставляют города возводить высокие стены и строить боевые корабли.\nАристофан"
 LOADING_TIP_59:0 "Зло кажется добром тому, чей разум бог хочет погубить.\nСофокл"
 LOADING_TIP_60:0 "Помни, что в жизни человеческой нет постоянства, и не будешь ни чрезмерно ликовать о богатстве, ни печалиться о невзгодах.\nИзократ"
 LOADING_TIP_61:0 "Арес ненавидит мешкающих.\nЭврипид"
 LOADING_TIP_62:0 "Тот, кто пренебрегает обучением в юности, потерян для прошлого и мёртв для будущего.\nЭврипид"
 LOADING_TIP_63:0 "Ибо и сама природа ничего великого не производит скоро, и со всяким прекрасным делом соединила трудность.\nМарк Фабий Квинтилиан"
 LOADING_TIP_64:0 "Хиосцам разрешается гадить.\nСпартанское объявление, записано Плутархом"
 LOADING_TIP_65:0 "Небеса не помогают людям, которые бездействуют.\nСофокл"
 LOADING_TIP_66:0 "Страх? Зачем человеку страх? Нашей жизнью правит шанс, и будущее неизвестно. Лучше жить, как живётся, изо дня в день.\nСофокл"
 LOADING_TIP_67:0 "Много есть чудес на свете, человек их всех чудесней.\nСофокл"
 LOADING_TIP_68:0 "Величайшее, первое благо — совсем не рождаться, второе — родившись, умереть поскорее.\nСофокл"
 LOADING_TIP_69:0 "Я ведь, почтенный, как лев, царь зверей: сидит в золотой клетке, а смотрит наружу. Вот и я, почтенный, хоть и живу в миру, а всё наружу смотрю.\nЦарь Милинда (Менандр I Бактрийский)"
 LOADING_TIP_70:0 "Я — человек, и ничто человеческое мне не чуждо.\nПублий Теренций Афр"
 LOADING_TIP_71:0 "Кто хочет быть царём, не помышляя о благе всех; кто истину скрывает и для кого не выше всех друзей Отечество, — презрения достойным того считаю.\nСофокл"
 LOADING_TIP_72:0 "Властители должны отличаться от подвластных не только своим личным совершенством, но и способностью очаровывать других.\nКсенофонт"
 LOADING_TIP_73:0 "Но благороднее стремясь погибнуть и не как женщина глядя на меч, к брегам далёким с быстрым она не помчалась флотом. Сумела видеть царство погибшее с лицом спокойным; смелая, яростных ехидн приветила и чёрным ядом своё напитала тело.\nКвинт Гораций Флакк о победе Цезаря Октавиана над Клеопатрой"
 LOADING_TIP_74:0 "Пока мы говорим, уходит время злое. Лови текущий день, не веря в остальное.\nКвинт Гораций Флакк"
 LOADING_TIP_75:0 "Греция, взятая в плен, победителей диких пленила, в Лаций суровый внеся искусства.\nКвинт Гораций Флакк"
 LOADING_TIP_76:1 "А! Полководцы! Их много, но они не слишком хороши!\nАристофан"
 LOADING_TIP_77:0 "Когда я шёл на рынок, хотели власти умертвить нас поскорее.\nВот лучший способ вас избавить от страданья!\nАристофан"
 LOADING_TIP_78:0 "Скорее, принесите мне чашу вина, чтобы я мог освежить свой разум и сказать что-нибудь умное.\nАристофан"
 LOADING_TIP_79:0 "Мы должны перевернуть каждый камень, но не пропустить ни единого оратора, что захочет нас уколоть.\nАристофан"
 LOADING_TIP_80:0 "Гости, как рыба, начинают дурно пахнуть на третий день.\nТит Макций Плавт"
 LOADING_TIP_81:0 "Легко стать мудрым тому, кто научился на чужой беде.\nТит Макций Плавт"
 LOADING_TIP_82:0 "Здесь был Ауфидий.\nНадпись на стене в Помпеях"
 LOADING_TIP_83:0 "О стены, на вас столько чуши написано, удивляюсь, как вы ещё не обрушились.\nНадпись на стене в Помпеях"
 LOADING_TIP_84:0 "Вот ты ж хитрый трактирщик! Продаёшь воду, а сам неразбавленное вино пьёшь.\nНадпись на стене в Помпеях"
 LOADING_TIP_85:0 "И я даю тебе единственную истину: я лжец.\nЛукиан из Самосаты"
 LOADING_TIP_86:0 "Так вот и ты: постоянно держишь в руках книгу и читаешь её, но из прочитанного ничего не понимаешь и оказываешься тем ослом, который слушает игру на лире, хлопая ушами.\nЛукиан из Самосаты"
 LOADING_TIP_87:0 "Ты же прочь, речная влага, и струёй, вину враждебной, строгих постников довольствуй: чистый нам любезен Бахус.\nГай Валерий Катулл"
 LOADING_TIP_88:0 "Цезарь — муж всех женщин и жена всех мужчин!\nМарк Туллий Цицерон"
 LOADING_TIP_89:0 "Не на зависть ли всем такая доля?\nНе потеете, не течет из носа, и слюна не бежит, и нет мокроты.\nГай Валерий Катулл"
 LOADING_TIP_90:0 "Возлюбленный богами, царь Пиядаси, глаголет так: Творить добро трудно. Тот, кто творит добро, сначала совершает нечто трудное. — Пятый указ Ашоки"
 LOADING_TIP_91:0 "Не следует проводить празднества, ибо возлюбленный богами, царь Пиядаси, видит много предосудительного в таких празднествах. — Первый указ Ашоки"
 LOADING_TIP_92:0 "Где бы ни отсутствовали лекарственные травы, пригодные для людей или животных, я повелел доставить их и выращивать. Где бы ни отсутствовали лекарственные корни или плоды, я повелел доставить их и выращивать. Вдоль дорог я повелел вырыть колодцы и посадить деревья на благо людям и животным. — Второй указ Ашоки"
 LOADING_TIP_93:0 "Почтение к матери и отцу есть благо, щедрость к друзьям, знакомым, родственникам, брахманам и аскетам есть благо, неубиение живых существ есть благо, умеренность в тратах и умеренность в накоплениях есть благо. — Третий указ Ашоки"
 LOADING_TIP_94:0 "Явление небесных колесниц, благоприятных слонов, огненных тел и иных божественных знамений не случалось уже многие сотни лет. Но ныне, поскольку возлюбленный богами царь Пиядаси поощряет воздержание от убийства и причинения вреда живым существам, должное поведение по отношению к родственникам, брахманам и аскетам, а также почтение к матери, отцу и старшим, такие явления участились. — Четвертый указ Ашоки"
 LOADING_TIP_95:0 "Возлюбленный богами, царь Пиядаси, глаголет так: В прошлом государственные дела не велись, и доклады царю не доставлялись во все часы. Но ныне я отдал сей приказ: в любое время, будь то во время моей трапезы, в женских покоях, в спальне, в колеснице, в паланкине, в парке или где бы то ни было еще, докладчики должны быть на посту с инструкцией докладывать мне о делах народа, дабы я мог заниматься этими делами, где бы я ни находился. — Шестой указ Ашоки"
 LOADING_TIP_96:0 "Возлюбленный богами, царь Пиядаси, желает, чтобы все религии пребывали повсюду, ибо все они стремятся к самоконтролю и чистоте сердца. Но люди имеют различные желания и различные страсти, и они могут исполнять всё, что должны, или лишь часть этого. Но тот, кто получает великие дары, однако лишен самоконтроля, чистоты сердца, благодарности и твердой преданности; такой человек низок. — Седьмой указ Ашоки"
 LOADING_TIP_97:0 "И какие бы усилия ни прилагал возлюбленный богами, царь Пиядаси, всё это лишь ради благополучия людей в следующем мире, и чтобы у них было мало зла. И отсутствие заслуг есть зло. Это трудно сделать как простому человеку, так и великому, кроме как с великим усилием и отказавшись от других интересов. На деле, великому человеку сделать это может быть еще труднее. — Десятый указ Ашоки"
 LOADING_TIP_98:0 "Кто хвалит свою собственную религию из чрезмерной преданности и осуждает других с мыслью «Позвольте мне прославить мою собственную религию», тот вредит лишь своей собственной религии. Поэтому контакт между религиями есть благо. Следует слушать и уважать доктрины, исповедуемые другими. — Двенадцатый указ Ашоки"
 LOADING_TIP_99:0 "Возлюбленный богами, царь Пиядаси, завоевал Калингу через восемь лет после своей коронации. Сто пятьдесят тысяч были депортированы, сто тысяч были убиты, и многие другие погибли от иных причин. После того как Калинга была завоевана, возлюбленный богами почувствовал сильное стремление к дхамме, любовь к дхамме и к наставлениям в дхамме. Ныне возлюбленный богами испытывает глубокое раскаяние за завоевание Калинги. — Тринадцатый указ Ашоки"
 LOADING_TIP_100:0 "Разум, не затронутый превратностями жизни, разум, свободный от печали, незапятнанный и безопасный — это высшее благословение. — Гаутама Будда, из Мангала Сутты"
 LOADING_TIP_101:0 "Если, странствуя, нельзя найти никого лучше или равного себе, следует решиться идти в одиночестве; нет дружбы с глупцами. — Глава пятая Дхаммапады"
 LOADING_TIP_102:0 "Когда этот мир постоянно пылает, почему этот смех, почему это ликование? Окутанные тьмой, не увидите ли вы света? — Глава одиннадцатая Дхаммапады"
 LOADING_TIP_103:0 "Те, кто в юности не вел святой жизни или не сумел приобрести богатство, чахнут, как старые журавли в пруду без рыбы. — Глава одиннадцатая Дхаммапады"
 LOADING_TIP_104:0 "Чудесно, поистине, усмирять разум, столь трудный для усмирения, всегда быстрый и хватающий всё, чего он желает. Укрощенный разум приносит счастье. — Глава третья Дхаммапады"
 LOADING_TIP_105:0 "Как мощный поток сметает спящую деревню, так смерть уносит человека с рассеянным разумом, который лишь срывает цветы удовольствия. — Глава четвертая Дхаммапады"
 LOADING_TIP_106:0 "Слеп этот мир; лишь немногие обладают здесь прозрением. Лишь немногие, подобно птицам, вырывающимся из сети, идут в миры блаженства. — Глава тринадцатая Дхаммапады"
 LOADING_TIP_107:0 "Оросители регулируют воды, изготовители стрел выпрямляют древки, плотники формируют дерево, а добрые контролируют самих себя. — Глава десятая Дхаммапады"
 LOADING_TIP_108:0 "Отпусти прошлое, отпусти будущее, отпусти настоящее, и переправься на дальний берег бытия. С разумом, полностью освобожденным, ты более не придешь к рождению и смерти. — Глава двадцать четвертая Дхаммапады"
 LOADING_TIP_109:0 "Есть те, кто не осознает, что однажды мы все должны умереть. Но те, кто осознает это, прекращают свои ссоры. — Глава первая Дхаммапады"
 LOADING_TIP_110:0 "Из всех них бельги являются самыми храбрыми, потому что они дальше всего удалены от цивилизации и утонченности нашей Провинции, и купцы реже всего прибывают к ним, импортируя те вещи, которые изнеживают ум. — Гай Юлий Цезарь"
 LOADING_TIP_111:0 "На это посольство Ариовист ответил, что если бы сам он нуждался в чем-либо от Цезаря, он бы пришел к нему; и что если Цезарь хочет чего-либо от него, он должен прийти к нему сам. Кроме того, он не смеет идти без армии в те части Галлии, которыми владеет Цезарь, и не может без больших затрат и хлопот собрать свою армию в одном месте; к тому же ему кажется странным, какое дело вообще Цезарю или римскому народу до его собственной Галлии, которую он завоевал войной. — Записки о Галльской войне"
 LOADING_TIP_112:0 "Ариовист, после того как многие месяцы держал себя в своем лагере и на болотах и не давал возможности для сражения, внезапно напал на них, когда те уже отчаялись в битве и рассеялись во всех направлениях, и одержал победу более благодаря хитрости и коварству, чем доблести. — Записки о Галльской войне"
 LOADING_TIP_113:0 "По произнесении этой речи умы всех изменились удивительным образом, и возникли величайший пыл и рвение к продолжению войны; и десятый легион первым поблагодарил его через своих военных трибунов за то, что он выразил столь благоприятное мнение о них; и заверил его, что они вполне готовы продолжать войну. — Записки о Галльской войне"
 LOADING_TIP_114:0 "Что дружба римского народа должна стать для него украшением и защитой, а не ущербом; и что он искал её с таким ожиданием. Но если через римский народ дань будет прекращена, а те, кто сдался, будут переманены от него, он откажется от дружбы римского народа с таким же усердием, с каким искал её. — Записки о Галльской войне"
 LOADING_TIP_115:0 "«Это было, право же, богатство, о котором мы никогда не слышали и не знали», — сказал Айлиль; «но у тебя было лишь женское богатство, и враги из соседних земель привыкли уносить добычу и трофеи, которые они отбирали у тебя». — Похищение быка из Куальнге"
 LOADING_TIP_116:0 "«Клянусь богами, которым я поклоняюсь», — молвил Даре, — «они никоим образом не возьмут грязными средствами то, чего не могут взять честными!» — Похищение быка из Куальнге"
 LOADING_TIP_117:0 "И скажи ему, что для него честь противостоять войскам столько времени, сколько он совершает доблестные деяния против них, но что ему пристойнее скрыться, чем бежать перед любым из их воинов. — Похищение быка из Куальнге"
 LOADING_TIP_118:0 "Поскольку договор и условия единоборства были нарушены с Кухулином, Кухулин взял в руку свою пращу в тот день и начал обстреливать войско из Делги, Малым Дротиком, с юга. Хотя многочисленны были люди Эрина в тот день, никто из них не посмел повернуть лицо на юг, к Кухулину, будь то собака, лошадь или человек. — Похищение быка из Куальнге"
 LOADING_TIP_119:0 "И пастух быка не позволил им угнать Бурого Быка из Куальнге, поэтому они понукали быка, ударяя древками по щитам, пока не загнали его в узкое ущелье, и стадо втоптало тело пастуха в землю на тридцать футов, так что они обратили его тело в фрагменты и клочки. Форгемен было его имя. Такова смерть Форгемена при угоне скота из Куальнге. — Похищение быка из Куальнге"
 LOADING_TIP_120:0 "В этом, по моему мнению, причина, почему молодые люди вырастают такими болванами в школах, потому что они не видят и не слышат ни единой вещи, связанной с обычными обстоятельствами повседневной жизни, ничего, кроме чуши о пиратах, затаившихся на берегу с кандалами в руках, тиранах, издающих указы, принуждающие сыновей отрубать головы своим отцам, оракулах во время чумы, приказывающих принести в жертву трех дев или более, чтобы остановить мор; медово-сладкие, округлые фразы, слова и факты alike как бы, посыпанные маком и кунжутом. — Сатирикон"
 LOADING_TIP_121:0 "Что мне было делать, дураку, когда я умирал от голода? Остановиться и слушать вереницу фраз, не лучших, чем звон разбитого стекла или бессмысленные толкования в сонниках? Великим Геркулесом клянусь, ты гораздо подлее меня; чтобы заполучить ужин, ты снизошел до лести Поэту! — Сатирикон"
 LOADING_TIP_122:0 "«Послушай, Энколпий», — сказал он, — «ты так погряз в своих удовольствиях, что никогда не размышляешь о том, что наши деньги исчерпаны, а те мелочи, что остались, бесполезны. Город никуда не годится в летние дни; в деревне будет больше удачи. Давай навестим наших друзей». — Сатирикон"
 LOADING_TIP_123:0 "Любой раб, отправляющийся за границу без разрешения Хозяина, получит сто ударов плетью. — Сатирикон"
 LOADING_TIP_124:0 "Пока мы читали этикетки, Трималхион воскликнул, хлопая в ладоши: «Увы! Подумать только, вино живет дольше, чем бедное человечество! Ну же! Полные кубки! В вине есть жизнь. Это настоящий Опимиан, даю вам слово. Я не выставлял такого хорошего вчера, и со мной обедали люди гораздо лучше вас». — Сатирикон"
 LOADING_TIP_125:0 "Стремясь, как всегда, исследовать со всем своим чрезмерным рвением редкое и чудесное, и зная, что я нахожусь в сердце Фессалии, родины тех магических искусств, чьи мощные заклинания восхваляются по всему миру, и помня, что рассказ моего дорогого друга Аристомена происходил именно в этом городе, я был охвачен желанием и нетерпением, и отправился тщательно всё изучать. — Золотой осел"
 LOADING_TIP_126:0 "Заранее прошу вашего снисхождения, если я, как грубый исполнитель на экзотическом языке Форума, оскорблю вас. И поистине, сам факт смены голоса ответит, подобно навыку циркового наездника, когда это потребуется. Мы собираемся embark на греческую сказку. Читатель, внимай: и находи удовольствие. — Золотой осел"
 LOADING_TIP_127:0 "Но мое любопытство было возбуждено, и как только я услышал слово «магия», вместо того чтобы опасаться Памфилы, я возжаждал embark, охотно и по собственной воле, на ученичество в таких делах, какой бы ни была цена, и прыгнуть головой вперед в глубочайшую яму. — Золотой осел"
 LOADING_TIP_128:0 "Не успела Аврора, подняв свою розовую руку, начать гнать своих коней с пурпурной сбруей по небу, как я пробудился от беззаботного сна, и ночь передала меня дню. Боль затопила мой разум, когда я вспомнил вечернее насилие, и я сидел там, сгорбившись на кровати, скрестив ноги, сцепив руки, пальцы переплетены на коленях, обильно плача и уже представляя сцену на рыночной площади, суд, приговор и самого палача. — Золотой осел"
 LOADING_TIP_129:0 "Касательно самого преступления, которое должно быть строго наказано, даже виновная сторона не отрицает деяния. Но есть один недостающий кусок информации, имена его сообщников в этом дерзком felony, поскольку вряд ли он один лишил жизни трех сильных мужчин. Так что истина теперь будет извлечена пыткой. — Золотой осел"
 LOADING_TIP_130:0 "Люди, интересующиеся атлетикой и заботой о своем теле, думают не только о состоянии и упражнениях, но и об отдыхе в сезон;事实上, они считают это главной частью тренировки. Таким же образом студенты, я думаю, после длительного чтения серьезных работ могут с пользой расслабить свой разум и привести его в лучшую форму для будущего труда. — Правдивая история"
 LOADING_TIP_131:0 "Однажды, отправившись от Столпов Геркулеса и направляясь в западный океан при благоприятном ветре, я пустился в плавание. Мотив и цель моего путешествия заключались в моей интеллектуальной деятельности и жажде приключений, а также в моем желании узнать, каков конец океана, и кто те люди, что живут на другой стороне. — Правдивая история"
 LOADING_TIP_132:0 "Когда мы прошли через лес около трех стадий от моря, мы увидели бронзовую плиту, с надписью на греческом языке, блеклой и стертой, которая гласила: «До этого места дошли Геракл и Дионис». Мы поклонились и пошли дальше, но не прошли далеко, как наткнулись на реку вина, точь-в-точь похожую на хиосское. Поток был большим и полноводным, так что в некоторых местах он был действительно судоходным. Таким образом, мы не могли не иметь гораздо большей веры в надпись на плите, видя доказательства визита Диониса. — Правдивая история"
 LOADING_TIP_133:0 "Около полудня, когда остров уже скрылся из виду, внезапно возник вихрь, закрутил лодку, поднял её в воздух примерно на триста стадий и не опустил её снова в море; но пока она висела в вышине, ветер ударил в её паруса и погнал её вперед с надувшимся полотном. Семь дней и семь ночей мы плыли по воздуху, и на восьмой день мы увидели в нем великую страну, напоминающую остров, яркую, круглую и сияющую великим светом. — Правдивая история"
 LOADING_TIP_134:0 "Когда он осмотрел нас и сделал выводы из нашей одежды, он сказал: «Так вы греки, чужеземцы?» и когда мы согласились, «Ну, как вы попали сюда, преодолев столько воздуха?» Мы рассказали ему всё, и он начал рассказывать о себе: что он тоже человек, по имени Эндимион, который некогда был похищен из нашей страны во сне, и, прибыв туда, стал царем той земли. Он сказал, что его страна — это луна, которая светит нам вниз. — Правдивая история"
 LOADING_TIP_135:0 "Вольпланеры — пехота, безусловно, но они летают в воздухе без крыльев. Что касается манеры их полета, они подтягивают свои длинные туники через пояса, позволяют широким складкам наполняться ветром, словно парусам, и их несет, как лодки. По большей части они служат легкой пехотой в битве. Также говорилось, что звезды над Каппадокией пошлют семьдесят тысяч Воробьиных зерен и пять тысяч Журавлиных драгунов. — Правдивая история"
 LOADING_TIP_136:0 "Что до нас, то в тот день нас отвели к солнцу, связав руки за спиной участком паутины. Враг решил не осаждать город, но на обратном пути они построили стену через воздух, чтобы лучи солнца больше не достигали луны. Стена была двойной, сделанной из облака, так что произошло genuine затмение луны, и она была полностью окутана непроглядной ночью. — Правдивая история"
 LOADING_TIP_137:0 "Человек считается красивым в той стране, если он лыс и безволос, и они совершенно ненавидят длинноволосых людей. На кометах всё иначе, там длинноволосые считаются красивыми — были посетители на луне, которые рассказали нам о них. Еще один момент — у них есть бороды, растущие немного выше колена, и у них нет ногтей на ногах, но все они одноногие. Над каждым мужчиной на крупе растет длинный капустный лист, как хвост, который всегда зеленый и не ломается, если он упадет на спину. — Правдивая история"
 LOADING_TIP_138:0 "Митилена — большой и красивый город на острове Лесбос. Пролив, воды которого мягко текут из моря, отделяет его от материка. Многие мосты из дерева и блестящего белого камня украшают его дороги. Вы не поверите, что смотрите на город, а не на остров. — Лонг, из «Дафнис и Хлоя»"
 LOADING_TIP_139:0 "Ламон сначала подумал унести знаки и оставить младенца, но затем его охватило чувство стыда. «Разве я менее добр к ребенку, чем коза?» Он подождал до темноты и, под её покровом, принес всё домой своей жене Миртале, знаки, ребенка, саму козу. Миртала была смущена: «Неужели козы рожают детей?» — спросила она. — Лонг, из «Дафнис и Хлоя»"
 LOADING_TIP_140:0 "Дриас и Ламон были расстроены тем, что они увидели. Неужели дети станут козопасами и пастухами? Ради этого, когда их пеленки обещали столь лучший исход и судьбу? Неужели из-за этой судьбы они воспитывали детей на изысканных яствах и учили их грамоте и многим прекрасным вещам из сельской жизни? — Лонг, из «Дафнис и Хлоя»"
 LOADING_TIP_141:0 "Весна уже заканчивалась, и начиналось лето. Всё было в своем величайшем великолепии. Деревья были нагружены фруктами, равнины были покрыты стоящими хлебами, и цикады приятно стрекотали. Фрукты пахли сладко, и стада блеяли от восторга. Можно было бы подумать, что даже мягко текущие реки поют, и ветры, дуя на сосны, издают звуки свирели, и яблоки стремились plunge на землю, и солнце, тот любитель красоты, снимало одежду со всех. — Лонг, из «Дафнис и Хлоя»"
 LOADING_TIP_142:0 "Они решили почтить своего благодетеля. Они присоединились к родственникам Доркона, чтобы похоронить бедняка. Они насыпали на него много земли и посадили много культурных растений, и повесили первые плоды своих трудов как жертвоприношение. Они возлили возлияния молока и выдавили гроздья винограда, и сломали много пастушьих свирелей над ним. Было слышно жалобное мычание коров, и некоторые коровы были видны, беспорядочно бегающие вокруг. Как казалось среди стад и табунов, эти действия служили lament коров по смерти их пастуха. — Лонг, из «Дафнис и Хлоя»"
 LOADING_TIP_143:0 "Начиная с тебя, о Феб, я поведаю о знаменитых деяниях мужей древности, которые, по велению царя Пелия, вниз через устье Понта и между Кианейскими скалами, устремили хорошо оснащенный Арго в поисках золотого руна. — Аргонавтика"
 LOADING_TIP_144:0 "Не копи, молю тебя, мать, горькие скорби чрезмерно, ибо ты не спасешь меня от зла слезами, но лишь добавишь горе к горю. Ибо невидимы бедствия, которые боги определяют смертным; будь сильна, чтобы терпеть свою долю их, хотя с горем в сердце; черпай мужество из обещаний Афины и из ответов богов... — Аргонавтика"
 LOADING_TIP_145:0 "Тщетный несчастный, ты замыслишь разрушение для себя прежде времени. Разве чистое вино заставляет твое смелое сердце разбухать в груди к твоей погибели, и подтолкнуло ли оно тебя бесчестить богов? Есть другие слова утешения, которыми человек мог бы ободрить своего товарища; но ты говорил с полным безрассудством. — Аргонавтика"
 LOADING_TIP_146:0 "Ну же, скажи мне это своим пророческим искусством, сбудется ли для меня тоже такая судьба, какую твой отец обещал сыновьям Алоэя. И подумай, как ты ускользнешь из моих рук живым, если будешь пойман, делая пророчество тщетным, как праздный ветер. — Аргонавтика"
 LOADING_TIP_147:0 "Сын Эсона, не гневайся на меня, если в своем безумии я ошибся, ибо горе заставило меня произнести слово высокомерное и невыносимое. Но пусть моя вина достанется ветрам, и пусть наши сердца соединятся, как прежде. — Аргонавтика"
 LOADING_TIP_148:0 "Слушайте, вы, странствующие по морю, тому, что вам подобает знать. Таково правило, что ни один чужеземец, приходящий к бебрикам, не должен уйти, пока не поднимет руки в битве против моих. Поэтому выберите вашего храбрейшего воина из войска и поставьте его здесь, на месте, чтобы состязаться со мной в боксе. Но если вы не обратите внимания и попрете мои decrees ногами, несомненно, к вашему горю суровая необходимость придет на вас. — Аргонавтика"
 LOADING_TIP_149:0 "Но герой, всегда не раненный, своим мастерством thwarted натиск своего врага, и он быстро заметил brutal игру своих кулаков, чтобы увидеть, где он непобедим в силе, а где inferior, и стоял непрерывно и возвращал удар за ударом. И как когда корабельщики своими молотами бьют по корабельным балкам, чтобы meeting острым скобам, фиксируя слой за слоем; и удары раздаются один за другим; так щеки и челюсти грохотали с обеих сторон, и возник огромный лязг зубов, и они не прекращали наносить свои удары, пока затрудненное дыхание не одолело обоих. И, отступив немного, они вытерли со лбов обильный пот, устало задыхаясь. Затем они снова бросились назад вместе, как два быка сражаются в яростном соперничестве за пасущуюся телку. — Аргонавтика"
 LOADING_TIP_150:0 "Но когда солнце, восходящее из дальних краев, озарило росистые холмы и разбудило пастухов, тогда они отвязали канаты от ствола лаврового дерева и погрузили на борт всю добычу, какую нужно было взять; и при благоприятном ветре они прошли через бурлящий Боспор. — Аргонавтика"
 LOADING_TIP_151:0 "Несчастный, никто из людей не более жалок, чем ты, полагаю я. Почему на тебя возложено бремя стольких скорбей? Неужели ты пагубным безумием согрешил против богов своим даром пророчества? За это ли они сильно гневаются на тебя? — Аргонавтика"
 LOADING_TIP_152:0 "Этот народ не заботится ни о вспашке земли быками, ни о посадке сладкого как мед плода; также не пасут они стада на росистых лугах. Но они взрывают твердую, несущую железо землю и обменивают свой заработок на ежедневное пропитание; никогда не восходит для них утро без труда, но среди мрачных коптящих пламен и дыма они терпят тяжелую работу. — Аргонавтика"
 LOADING_TIP_153:0 "Злосчастный, почему ты так поражен отчаянием? Мы знаем, как вы отправились в поисках золотого руна; мы знаем каждое ваше испытание, все великие деяния, совершенные вами в странствиях по суше и морю. Мы — одинокие богини этой земли, говорящие человеческим голосом, героини, хранительницы Ливии и её дочери. Встань же; не будь так удручен в своем горе и ободрить своих товарищей. — Аргонавтика"
 LOADING_TIP_154:0 "Что заставляет улыбаться нивы; под какой звездой, Меценат, подобает переворачивать дерн или соединять вяз с виноградной лозой; как ухаживать за быком; какие хлопоты требуются для содержания скота или какое доказательство терпеливого испытания служит для бережливых пчел — таковы мои темы. — Георгик Вергилия"
 LOADING_TIP_155:0 "Заметь также, в какое время орех в лесах, обильно цветя, оденется и склонит свои душистые ветви. Если плодов будет больше, последует такой же урожай зерна, и наступит великое время веяния с великой жарой; но если тень изобилует листвой, напрасно твой ток будет молотить стебли, богатые лишь мякиной. — Георгик Вергилия"
 LOADING_TIP_156:0 "Прежде всего, закон природы для порождения деревьев многообразен; ибо некоторые из них всходят сами по себе, спонтанно, без принуждения рукой человека, и занимают равнины и излучины рек далеко вокруг, как гибкая ива, поникающий дрок, тополь и ивы, бледными группами мерцающие серо-зеленой листвой; а некоторые вырастают из случайно упавших семян, как высокие каштаны и, могущественнейшее из ветвистых лесных деревьев, Юпитеров дуб, и дубы, считавшиеся пророческими древними греками. — Георгик Вергилия"
 LOADING_TIP_157:0 "Но если тебе более по душе яростные эскадроны и боевые строи, или скользить на колесницах в Пизе, мимо быстро текущего Алфея, и в роще Юпитера гнать летящую колесницу, пусть первой задачей твоего коня будет встречать вооруженную ярость воина, и терпеть трубу, и долгий рев грохочущих колес, и звон бренчащих уздечек в конюшне; затем всё больше и больше любить ласковый голос хозяина или громкую руку, хлопающую его по шее. — Георгик Вергилия"
 LOADING_TIP_158:0 "Ибо каждый род на земле: люди, звери, обитатели океана, стада и пестрые птицы, бросаются в бушующий огонь: любовь правит ими всеми. — Георгик Вергилия"
 LOADING_TIP_159:0 "Прими свое величие, ибо время близится, дорогое чадо богов, великое потомство Юпитера! Видишь, как колеблется державная мощь мира, Земля, широкий океан и глубокий свод небес; все, видишь, в восторге от грядущего времени! — Эклоги Вергилия"
 LOADING_TIP_160:0 "Ранее легкие олени станут питаться в воздухе, моря оставят своих рыб обнаженными на берегу, германцы и парфяне сдвинут свои естественные границы, и одни будут пить Арар, другие Тигр, чем из моего сердца исчезнут его лицо и память. — Эклоги Вергилия"
 LOADING_TIP_161:0 "Становится всем людям, желающим превзойти других животных, стремиться изо всех сил не проходить жизнь в безвестности, подобно полевым зверям, которых природа создала ползающими и покорными аппетиту. — Саллюстий"
 LOADING_TIP_162:0 "Тем не менее, долгое время среди людей шел спор о том, достигаются ли военные успехи больше силой тела или силой интеллекта. — Саллюстий"
 LOADING_TIP_163:0 "Как в мирное, так и в военное время можно обрести известность; многие из тех, кто действовал, и многие из тех, кто записывал действия других, получают свою дань хвалы. — Саллюстий"
 LOADING_TIP_164:0 "Я сам, однако, будучи юношей, сначала был склонен, как и большинство других, участвовать в политических делах; но в этом начинании многие обстоятельства были неблагоприятны для меня; ибо вместо скромности, умеренности и честности господствовали бесстыдство, коррупция и алчность. — Саллюстий"
 LOADING_TIP_165:0 "Основателями и earliest жителями города Рима, насколько я понимаю, были троянцы, которые под предводительством Энея скитались как изгнанники из своей страны, не имея постоянного пристанища. — Саллюстий"
 LOADING_TIP_166:0 "Но среди самих себя главным соперничеством была слава; каждый стремился быть первым, кто ранит врага, взберется на стену и будет замечен при совершении такого подвига. — Саллюстий"
 LOADING_TIP_167:0 "Для укрепленных городов следует соблюдать следующие общие принципы. Прежде всего идет выбор очень здорового места. Такое место должно быть высоким, не туманным и не морозным, и в климате ни жарком, ни холодном, но умеренном; кроме того, без болот поблизости. — Витрувий"
 LOADING_TIP_169:0 "Следовательно, метод строительства, используемый греками, не следует презирать. Они не используют конструкцию из мягкого бутового камня, отполированного снаружи, но всякий раз, когда они отказываются от тесаного камня, они кладут ряды лавы или какого-либо твердого камня и, словно строя из кирпича, связывают вертикальные швы, чередуя направление камней, лежащих в рядах. Таким образом, они достигают совершенства, которое прослужит вечность. — Витрувий"
 LOADING_TIP_170:0 "Поскольку такие могущественные цари не побрезговали стенами, построенными из кирпича, хотя своими доходами и добычей они могли бы часто иметь их не только из каменной кладки или тесаного камня, но даже из мрамора, я думаю, что не следует отвергать здания, сделанные из кирпичной кладки, при условии, что они правильно «покрыты». Но я объясню, почему этот вид конструкции не должен использоваться римским народом внутри города, не упуская из виду причины и основания для этого. — Витрувий"
 LOADING_TIP_171:0 "Греки устраивают свои форумы в форме квадрата, окруженного очень просторными двойными колоннадами, украшают их колоннами, установленными довольно близко друг к другу, и антаблементами из камня или мрамора, и сооружают прогулочные дорожки выше, на верхнем этаже. Но в городах Италии тот же метод не может быть применен по той причине, что это обычай, переданный нам предками, что гладиаторские представления должны даваться на форуме. — Витрувий"
 LOADING_TIP_172:0 "Тогда родосцы, освобожденные от войны хитростью Диогнета, публично поблагодарили его и украсили его всеми почестями и отличиями. Диогнет привел эту гелеполис в город, установил её на общественном месте и поместил на ней надпись: «Диогнет из трофеев врага посвятил этот дар народу». Следовательно, в оборонительных сооружениях необходимо готовить не только машины, но, прежде всего, мудрые планы. — Витрувий"
 LOADING_TIP_173:0 "Чтобы предотвратить натирание: когда отправляешься в путь, держи маленькую веточку понтийской полыни под задним проходом. — Марк Катон"
 LOADING_TIP_174:0 "Верно, что получение денег торговлей иногда более прибыльно, если бы это не было так рискованно; а также ростовщичество, если бы оно было столь же почетным. Наши предки придерживались этого взгляда и воплотили его в своих законах, которые требовали, чтобы вор платил двойной штраф, а ростовщик — четырехкратный; насколько менее желательным гражданином они считали ростовщика, чем вора, можно судить по этому. — Марк Катон"
 LOADING_TIP_175:0 "Будь хорошим соседом и не позволяй своим людям совершать правонарушения. Если ты популярен в округе, тебе будет легче продавать свои продукты, легче сдавать работу внаймы, легче нанимать дополнительных работников. — Марк Катон"
 LOADING_TIP_176:0 "Следующие обязанности надзирателя: он должен проявлять хорошее управление. Праздничные дни должны соблюдаться. Он должен воздерживать руки от чужого имущества и тщательно сохранять свое собственное. Он должен разрешать споры среди рабов; и если кто-то совершает проступок, он должен наказывать его надлежащим образом соразмерно вине. — Марк Катон"
 LOADING_TIP_177:0 "Туники, тоги, одеяла, рубахи и обувь следует покупать в Риме; шапки, железные инструменты, косы, лопаты, кирки, топоры, сбрую, украшения и мелкие цепи — в Калах и Минтурнах; лопаты — в Венафре; повозки и сани — в Суэссе и в Лукании; кувшины и горшки — в Альбе и в Риме; а черепицу — в Венафре. — Марк Катон"
 LOADING_TIP_178:0 "Быков можно запрягать в праздничные дни для следующих целей: для перевозки дров, стеблей бобов и зерна для хранения. Для мулов, лошадей или ослов нет праздника, кроме семейных торжеств. — Марк Катон"
 LOADING_TIP_179:0 "О лекарственной ценности капусты: именно капуста превосходит все другие овощи. Её можно есть как вареной, так и сырой; если ешь её сырой, обмакни в уксус. Она чудесным образом способствует пищеварению и является отличным слабительным, а моча полезна для всего. — Марк Катон"
 LOADING_TIP_180:0 "Давай скоту лекарства каждый год, когда виноград начинает менять цвет, чтобы поддерживать его здоровье. Когда увидишь змеиную кожу, подбери её и убери, чтобы не пришлось искать её, когда она понадобится. Размочи эту кожу, полбу, соль и тимьян в вине и дай всему скоту выпить. Следи, чтобы у скота всегда была хорошая, чистая вода для питья летом; это важно для их здоровья. — Марк Катон"
 LOADING_TIP_181:0 "Ныне я стал Смертью, разрушителем миров. — Вишну, Бхагавад-гита"

