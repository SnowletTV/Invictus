l_spanish:
 LOADING_TIP_0:0 "Si tienes que romper la ley, hazlo para tomar el poder: en los demás casos, obsérvala. - Cayo Julio César"
 LOADING_TIP_1:1 "Ningún amigo me superó en amabilidad, ni ningún enemigo en crueldad. - Lucio Cornelio Sila"
 LOADING_TIP_2:0 "Cuánto más corrupto es el estado, más leyes tiene. - Publio Cornelio Tácito"
 LOADING_TIP_3:1 "El miedo a los extranjeros —el vínculo más fuerte— unió su voluntad, a pesar de su mutua desconfianza y hostilidad. - Tito Livio"
 LOADING_TIP_4:0 "A los hombres no les importa cuán noblemente vivan, sino solo durante cuánto tiempo. A pesar de que está en sus manos vivir noblemente, ningún hombre puede decidir vivir mucho tiempo. - Lucio Anneo Séneca"
 LOADING_TIP_5:0 "Y además, opino que Cartago debe ser destruida. - Marco Poncio Cato"
 LOADING_TIP_6:0 "Realmente, no es posible ser traicionado si en primer lugar uno nunca confía en los demás. - Martinus Anwardius"
 LOADING_TIP_7:2 "Practicar la moralidad es meritorio, pero ¿qué incluye la moralidad? Incluye pocos pecados, muchas acciones virtuosas, compasión, generosidad, sinceridad y pureza. - Edicto mayor 2 en un pilar, Edictos de Ashoka"
 LOADING_TIP_8:2 "Te quejas de que escribo largos poemas, Velox. Sin embargo, tú no escribes nada: los tuyos son más cortos. - Marco Valerio Marcial"
 LOADING_TIP_9:2 "¡La suerte está echada! - Atribuido a Cayo Julio César (posiblemente citando a Menandro) al cruzar el Rubicón y, por lo tanto, al invadir Italia."
 LOADING_TIP_10:2 "Cuando tengas ganas de reír, ven a verme: estoy gordo, lustroso, la piel bien cuidada, un puerco de la piara de Epicuro. - Quinto Horacio Flaco"
 LOADING_TIP_11:2 "Las palabras dan alas a la mente y hacen que un hombre se eleve hasta el cielo. - Aristófanes"
 LOADING_TIP_12:2 "Todo gobernante debe recordar tres cosas. Primero, que gobierna al hombre; segundo, que gobierna según la ley; y tercero, que no gobierna eternamente. - Agatón, poeta ateniense"
 LOADING_TIP_13:2 "Un libro grande es un gran mal. - Calímaco"
 LOADING_TIP_14:2 "Debes estar más preparado para visitar a amigos en la adversidad que en la prosperidad. - Quilón de Esparta"
 LOADING_TIP_15:3 "La fuerza, acompañada de sabiduría, es sin duda una ventaja, pero, sin sabiduría, perjudica más de lo que ayuda al que la posee. - Isócrates"
 LOADING_TIP_16:2 "Si a ti más que a los ojos míos no amara, gratísimo Calvo, por el presente este te odiaría a ti con odio vatiniano: pues qué he hecho yo o qué he dicho, por qué a mí con tantos poetas mal me pierdas. - Cayo Valerio Catulo"
 LOADING_TIP_17:2 "En el cuerpo humano, tal como en el Imperio, las enfermedades más graves se propagan a partir de la cabeza. - Cayo Plinio Cecilio Segundo, conocido como el Joven"
 LOADING_TIP_18:2 "El hombre que ha sufrido un naufragio se estremece incluso en un mar tranquilo. - Publio Ovidio Nasón"
 LOADING_TIP_19:2 "Además, eso no es seguro, lo cual no es honorable. Si es preciso morir, hagamos frente al riesgo. - Lacón e Icelo, consejeros del emperador Galba"
 LOADING_TIP_20:2 "Los que desean parecer sabios frente a los tontos, parecen tontos frente a los sabios. - Marco Fabio Quintiliano"
 LOADING_TIP_21:2 "Se dio cuenta de que nuestra ciudad necesitaba un comandante, y la propia Grecia de una ciudad, capaz de asumir el liderazgo, y se entregó a su país y la ciudad a los griegos, en la causa de la libertad. - Hiperides sobre el general ateniense Leóstenes"
 LOADING_TIP_22:4 "\"No tengo tiempo\", dijo Demetrio. \"Entonces no seas rey\", gritó la anciana. - Plutarco" # [LocEditor:AwaitingBatchUpdate]
 LOADING_TIP_23:2 "Pero cuando tengamos todo sujeto a nosotros, ¿qué haremos? - Cineas, consejero del Rey Pirro"
 LOADING_TIP_24:1 "Los líderes desleales evitan que puedas realizar varias acciones en una unidad, como despedirla." # [LocEditor:AwaitingBatchUpdate]
 LOADING_TIP_25:2 "¿Por qué, dijeron, no diriges de inmediato un ataque contra el enemigo, mientras nuestra sangre aún está húmeda? A lo que Mario respondió con calma: primero debemos fortalecer nuestro campamento. - Plutarco"
 LOADING_TIP_26:2 "A veces es mejor ser temido que amado: la tiranía ofrece importantes bonificaciones, así como penalizaciones." # [LocEditor:AwaitingBatchUpdate]
 LOADING_TIP_27:1 "Los celtas pueden sacrificar a los enemigos capturados." # [LocEditor:AwaitingBatchUpdate]
 LOADING_TIP_28:2 "Un buen escudo, joven señor; pero es más apropiado que un romano ponga sus esperanzas en su mano derecha que en su izquierda. - Publio Cornelio Escipión Emiliano Africano"
 LOADING_TIP_29:2 "No es posible que Roma caiga mientras Escipión esté de pie, ni que Escipión viva cuando Roma haya caído. - Publio Cornelio Escipión Emiliano Africano"
 LOADING_TIP_30:2 "Los romanos son una nación que no sabe cómo permanecer callada bajo la derrota. Cualquiera que sea la desgracia que esta situación queme en sus almas, no descansará allí para siempre, y no les permitirá descansar hasta que te hayan hecho pagar por ello muchas veces. - Herenio Poncio, padre de Cayo Poncio, vencedor en las Horcas Caudinas"
 LOADING_TIP_31:2 "Malvados, ¿están pecando contra sus padres, que conquistaron el mundo entero bajo Felipe y Alejandro? - Antígenes, general de los argiráspidas, en la Batalla de Gabiene"
 LOADING_TIP_32:1 "Si bien no puedes combinar infantería pesada con elefantes, puedes reclutar arqueros a caballo con caballos esteparios." # [LocEditor:AwaitingBatchUpdate]
 LOADING_TIP_33:2 "Aunque no logre nada más, al menos podré desafilar la espada de un enemigo. - Un dicho espartano, como informó Plutarco"
 LOADING_TIP_34:2 "Estos son tiempos de violencia y angustia. Hay gente arrogante al control y nos hizo objeto del ridículo. Pero ustedes, hijos míos, deben estar consagrados a la ley y dispuestos a morir para defender la alianza de Dios con nuestros ancestros. - Matatías, líder de la revuelta de los Macabeos."
 LOADING_TIP_35:3 "Aunque reinos y tetrarquías me apartaron de su imperio por todos lados debido a que se informó que yo era rico y que no sería esclavo, los romanos me provocaron para que luchara. - Mitrídates"
 LOADING_TIP_36:0 "¿No sabes que los romanos volvieron en esta dirección solo después de que el océano bloqueara su progreso hacia el oeste? ¿Que no poseyeron nada desde el principio de su existencia excepto lo que robaron: su hogar, sus esposas, sus tierras y su imperio? Fueron vagabundos sin patria, sin padres, creados para ser el azote de todo el mundo. - Mitrídates"
 LOADING_TIP_37:1 "El cartaginés arrastra consigo un ejército que ni siquiera está formado por nativos africanos. Reunió una fuerza proveniente de los rincones más lejanos de la tierra, de los estrechos oceánicos y de las Columnas de Hércules, hombres desprovistos de todo sentido del bien y desprovistos de la condición y casi del habla de los hombres. - Cayo Terencio Varrón"
 LOADING_TIP_38:0 "Mientras que Mario miraba a Cartago, y Cartago contemplaba a Mario, bien podrían haberse ofrecido consuelo el uno al otro. - Marco Veleyo Patérculo"
 LOADING_TIP_39:0 "¿Quién podría mantener sus manos fuera de Libia, o Cartago, cuando esa ciudad se puso a su alcance, una ciudad que Agatócles, deslizándose con sigilo fuera de Siracusa y cruzando el mar con unos pocos barcos, casi no la logra tomar? - Pirro"
 LOADING_TIP_40:0 "La fuente de la que las cosas existentes derivan su existencia es también aquella a la que regresan en el momento de su destrucción. - Anaximandros de Miletos"
 LOADING_TIP_41:1 "No importa dónde busques, no encontrarás un hombre mortal que pueda escapar de los dioses cuando lo guíen al desastre. - Sófocles"
 LOADING_TIP_42:0 "De las hazañas militares por las que nuestras posesiones fueron adquiridas, o de la energía con la que nosotros o nuestros padres hicieron retroceder la marea de la guerra, helénica o bárbara, no hablaré; porque la historia sería larga y te resultaría familiar. - Pericles"
 LOADING_TIP_43:0 "Tenemos juegos y sacrificios regulares durante todo el año; nuestros hogares son hermosos y elegantes; y el deleite que sentimos diariamente en todo esto ayuda a desterrar el dolor. - Pericles"
 LOADING_TIP_44:1 "Hombres de Hellas, os traigo aquí porque deseaba mostraros la estupidez del líder de los medos, que, teniendo tantas provisiones como veis, vino aquí para quitarnos las nuestras, y eso es patético. - Pausanias, general espartano en la batalla de Platea"
 LOADING_TIP_45:1 "Si mil hombres marchan contra ti, mil hombres te combatirán. - Rey depuesto Demarato de Esparta sobre los espartanos"
 LOADING_TIP_46:1 "No hemos hecho nada extraordinario, nada contrario a la naturaleza humana al aceptar un imperio cuando nos lo ofrecieron y luego al negarnos a abandonarlo. - Los embajadores atenienses en Esparta sobre Tucídides"
 LOADING_TIP_47:0 "Todo discurso sin acción parece vano y ocioso, pero especialmente el de nuestra mancomunidad; cuanto más se piensa que sobresalimos, más desconfiamos de todos. - Demóstenes"
 LOADING_TIP_48:0 "Navegar es necesario, vivir no lo es. -Cneo Pompeyo Magno"
 LOADING_TIP_49:0 "Dame un lugar donde pararme y moveré la tierra. - Arquímedes"
 LOADING_TIP_50:1 "¡No molesten a mis círculos! - Últimas palabras de Arquímedes acerca de los círculos que estaba dibujando en la arena"
 LOADING_TIP_51:1 "Pirro, descendiente de los Reyes Molosos, os trae a vos, Diosa Atenea Itonia, estos escudos como ofrenda,\nHabiéndoselos quitado a los valerosos galos cuando en la batalla las huestes de Antígono huían.\nEste hecho no ha ocurrido solo esta vez, pues como bien es sabido los Eácidas conocidos por su valentía.\nInscripción dedicatoria de Pirro a Atenea Itonia después de la batalla del Aoo."
 LOADING_TIP_52:0 "... todas estas cosas no son más que habladurías, llenas de incertidumbre, y solo sirven para divertir a los vulgares; tu reflexión, con la espada en la mano, debe ser siempre: \"¡el único buen presagio es la causa del Rey Pirro!\" - Pirro después de que el presagio de su sueño fuera cuestionado"
 LOADING_TIP_53:0 "A la rapiña, el asesinato y el robo los llaman Imperio, y dónde crean un desierto, lo llaman paz. - Calgaco, cacique caledonio, sobre los romanos"
 LOADING_TIP_54:0 "El que huye, puede volver a luchar. - Menandro"
 LOADING_TIP_55:0 "Recuérdate de vez en cuando que eres humano. - Menandro"
 LOADING_TIP_56:0 "Incluso en los problemas hay un poco de alegría. - Menandro"
 LOADING_TIP_57:0 "Aquel a quien los dioses aman muere joven. - Menandro"
 LOADING_TIP_58:0 "La desconfianza es la madre de la seguridad. Con un amigo jamás aprenderíamos a ser cautos, al paso que un enemigo nos obliga a serlo; las ciudades, en un principio, aprendieron de sus enemigos, y no de sus amigos, a rodearse de altas murallas y a construir grandes naves. - Aristófanes"
 LOADING_TIP_59:0 "El mal parece el bien a quien los dioses llevan a la desgracia. - Sófocles"
 LOADING_TIP_60:0 "Recuerda que no hay nada estable en los asuntos humanos; por lo tanto, evita la euforia excesiva en la prosperidad o la depresión excesiva en la adversidad. - Isócrates"
 LOADING_TIP_61:0 "Ares odia a los que dudan. - Eurípides"
 LOADING_TIP_62:0 "El que se niega a aprender en su juventud se pierde en el pasado y está muerto para el futuro. - Eurípides"
 LOADING_TIP_63:0 "Porque es ley de la naturaleza que nada grande se puede lograr en un momento y que todas las tareas más justas son llevadas a cabo con dificultad. - Marco Fabio Quintiliano"
 LOADING_TIP_64:0 "Los espartanos le conceden permiso a los chiíes para estar sucios. - Proclamación espartana transmitida por Plutarco"
 LOADING_TIP_65:0 "Los cielos nunca ayudan al hombre que no quiere actuar. - Sófocles"
 LOADING_TIP_66:0 "¿Por qué habría de tener temor el hombre al que domina el azar y para el que no existe previsión clara de nada? Lo mejor es vivir al azar, según cada uno pueda. - Sófocles"
 LOADING_TIP_67:0 "El mundo está lleno de maravillas, pero nada es tan maravilloso como el propio hombre. - Sófocles"
 LOADING_TIP_68:0 "Lo mejor es no nacer o, en todo caso, que aquel que vive vuelva cuanto antes al lugar desde el que aquí ha venido. - Sófocles"
 LOADING_TIP_69:0 "Como un león, el rey de las bestias, que cuando es encerrado en una jaula, aunque esta sea de oro, sigue mirando hacia afuera, yo, a pesar de ser el amo en la casa, sigo mirando hacia afuera. - Rey Milinda (Menandro I de Bactria)"
 LOADING_TIP_70:0 "Hombre soy; nada humano me es ajeno. - Publio Terencio Africano"
 LOADING_TIP_71:0 "No tengo más que desprecio para la clase de gobernador que teme, por la razón que sea, seguir el curso que sabe que es mejor para el estado; y en cuanto al hombre que pone la amistad privada por encima del bienestar público, tampoco vale para nada. - Sófocles"
 LOADING_TIP_72:0 "Hay un pequeño riesgo de que un general sea considerado con desprecio por aquellos a los que dirige si, sea lo que sea que tenga que predicar, muestra que es el más capacitado para hacerlo. - Jenofonte"
 LOADING_TIP_73:0 "César Octavio quería ceñir de cadenas al monstruo fatal. Mas ella, buscando noble muerte, ni tuvo femenil espanto ante la espada ni ganó con su flota rápida la seguridad de abrigadas costas; osó en cambio contemplar con impávido rostro su palacio en ruinas y sin temor manejar las serpientes irritadas para embeber su cuerpo en negra ponzoña. - Quinto Horacio Flaco sobre Cleopatra"
 LOADING_TIP_74:0 "Mientras hablamos huye rápido el tiempo. Aprovecha el día presente y fíate poco de los que vendrán. - Quinto Horacio Flaco"
 LOADING_TIP_75:0 "La Grecia conquistada domó al bárbaro conquistador e introdujo las artes en el Latium agreste. - Quinto Horacio Flaco"
 LOADING_TIP_76:1 "¡Ah, los generales! ¡Si su calidad estuviera en razón de su cantidad! - Aristófanes"
 LOADING_TIP_77:0 "-Cuando salí para venir al mercado, nuestras autoridades dictaban las medidas adecuadas para que la ciudad se arruinara lo antes posible.\n-Es el mejor sistema para resolver vuestras dificultades de una vez y para siempre - Aristófanes  "
 LOADING_TIP_78:0 "Mejor será que echemos un trago de vino en honor del Buen Genio. Probablemente, esto nos dará alguna buena idea. - Aristófanes"
 LOADING_TIP_79:0 "Es necesario mirar debajo de todas las piedras, no se oculte algún orador pronto a picarnos. - Aristófanes"
 LOADING_TIP_80:0 "El pescado y los invitados apestan a los tres días. - Tito Maccio Plauto"
 LOADING_TIP_81:0 "El que gana sabiduría con felicidad, la gana por la experiencia de otro. - Tito Maccio Plauto"
 LOADING_TIP_82:0 "Aufidio estuvo aquí. - Grafiti en Pompeya"
 LOADING_TIP_83:0 "Oh, muros, soportaron tanto grafiti tedioso que me sorprende que no se hayan derrumbado y destruido. - Grafiti en Pompeya"
 LOADING_TIP_84:0 "Ojalá te engañen tales mentiras, tabernero: vendes agua y tú mismo bebes vino puro. - Grafiti en Pompeya"
 LOADING_TIP_85:0 "Ahora diré la única afirmación verdadera que pueden esperar: soy un mentiroso. - Luciano de Samósata"
 LOADING_TIP_86:0 "Aunque tienes un libro en la mano y lees todo el tiempo, no entiendes ni una sola cosa que lees. Eres como un burro que escucha la lira y agita las orejas. - Luciano de Samósata"
 LOADING_TIP_87:0 "Y ustedes váyanse de aquí adonde quieran, aguas, pernicie del vino, y emigren hacia los sobrios, aquí Baco es puro. - Cayo Valerio Catulo"
 LOADING_TIP_88:0 "César, esposo de todas las esposas y esposa de todos los esposos. - Marco Tulio Cicerón"
 LOADING_TIP_89:0 "¿Cómo no te va a ir bien y dichosamente?\nDe sudor estás libre y de saliva, de mocos y del dañino resfriado de nariz. - Cayo Valerio Catulo"
 LOADING_TIP_90:0 "El amado de los dioses, el rey Piyadasi, habla así: Hacer el bien es difícil. Quien hace el bien primero, hace algo difícil de hacer. - Quinto Edicto de Ashoka"
 LOADING_TIP_91:0 "Tampoco deberían celebrarse festivales, porque el amado de los dioses, el rey Piyadasi, ve mucho que objetar a tales festivales. - Primer Edicto de Ashoka"
 LOADING_TIP_92:0 "Dondequiera que no haya hierbas medicinales adecuadas para humanos o animales, las he importado y cultivado. Dondequiera que no haya raíces o frutos medicinales disponibles, los he importado y cultivado. A lo largo de los caminos he hecho cavar pozos y plantar árboles para beneficio de los humanos y los animales. - Segundo Edicto de Ashoka"
 LOADING_TIP_93:0 "El respeto por la madre y el padre es bueno, la generosidad hacia los amigos, conocidos, parientes, brahmanes y ascetas es buena, no matar seres vivos es bueno, la moderación en el gasto y la moderación en el ahorro es buena. - Tercer Edicto de Ashoka"
 LOADING_TIP_94:0 "Los avistamientos de vehículos celestiales, elefantes auspiciosos, cuerpos de fuego y otros avistamientos divinos no ocurrían desde hace muchos cientos de años. Pero ahora, debido a que el amado de los dioses, el rey Piyadasi, promueve la moderación al matar y dañar a los seres vivos, el comportamiento adecuado hacia los familiares, brahmanes y ascetas, y el respeto por la madre, el padre y los mayores, tales avistamientos han aumentado. - Cuarto Edicto de Ashoka"
 LOADING_TIP_95:0 "El amado de los dioses, el rey Piyadasi, habla así: En el pasado, los asuntos estatales no se tramitaban ni se entregaban informes al rey a todas horas. Pero ahora he dado esta orden de que en cualquier momento, ya sea que esté comiendo, en los aposentos de las mujeres, en el dormitorio, en el carro, en el palanquín, en el parque o en cualquier otro lugar, se apostarán periodistas con instrucciones de informarme de los asuntos del pueblo para que yo pueda atenderlos dondequiera que esté. - Sexto Edicto de Ashoka"
 LOADING_TIP_96:0 "El amado de los dioses, el rey Piyadasi, desea que todas las religiones residan en todas partes, pues todas ellas desean el autocontrol y la pureza de corazón. Pero las personas tienen diversos deseos y diversas pasiones, y pueden practicar todo lo que deben o sólo una parte de ello. Pero a quien recibe grandes dones le falta dominio de sí mismo, pureza de corazón, gratitud y devoción firme; una persona así es mala. - Séptimo Edicto de Ashoka"
 LOADING_TIP_97:0 "Y cualesquiera que sean los esfuerzos que esté haciendo el amado de los dioses, el rey Piyadasi, todo eso es sólo para el bienestar de la gente en el otro mundo, y para que tengan poco mal. Y no tener mérito es malo. Esto es difícil de lograr tanto para una persona humilde como para una gran persona, excepto con gran esfuerzo y renunciando a otros intereses. De hecho, puede resultar incluso más difícil de lograr para una gran persona. - Décimo Edicto de Ashoka"
 LOADING_TIP_98:0 "Quien alaba su propia religión, debido a una devoción excesiva, y condena a otros con el pensamiento \"Déjame glorificar mi propia religión\", sólo daña su propia religión. Por tanto, el contacto entre religiones es bueno. Se deben escuchar y respetar las doctrinas profesadas por los demás. - Duodécimo Edicto de Ashoka"
 LOADING_TIP_99:0 "El amado de los dioses, el rey Piyadasi, conquistó los Kalingas ocho años después de su coronación. Ciento cincuenta mil fueron deportados, cien mil fueron asesinados y muchos más murieron por otras causas. Después de la conquista de los Kalingas, el amado de los dioses llegó a sentir una fuerte inclinación hacia el dhamma, un amor por el dhamma y por la instrucción en el dhamma. Ahora el amado de los dioses siente un profundo remordimiento por haber conquistado los Kalingas. - Decimotercer Edicto de Ashoka"
 LOADING_TIP_100:0 "La mente que no es tocada por las vicisitudes de la vida, la mente libre de pena, sin tacha y segura – esta es la mayor de las bendiciones. - Buda Gautama, extracto del Maṅgala Sutta"
 LOADING_TIP_101:0 "En la senda de la vida, si el discípulo no encuentra a alguien mejor que él, o por lo menos igual, es preferible que realice el viaje en soledad. Los necios nunca son buenas compañias. - Capítulo Cinco del Dhammapada"
 LOADING_TIP_102:0 "¿Cómo ser feliz, cómo puede hallar lugar el gozo en ti si sabes que en este mundo siempre se halla ardiendo la terrible hoguera de las pasiones? Y en medio de las tinieblas, ¿cómo es que no buscas la luz? - Capítulo Once del Dhammapada"
 LOADING_TIP_103:0 "Los que no han llevado una vida de santidad, los que durante su juventud no adquirieron ese precioso tesoro, ésos perecen como viejas garzas al borde de un lago sin peces. - Capítulo Once del Dhammapada"
 LOADING_TIP_104:0 "La mente es difícil de subyugar; ella es extremadamente sutil y tiene el hábito de correr detrás de sus fantasías. El sabio debe vigilarla atentamente; una mente controlada conduce hacia la Real Felicidad. - Capítulo Tres del Dhammapada"
 LOADING_TIP_105:0 "Aquel que en este mundo sólo recoge las flores de los placeres sensibles, y cuya mente se halla distraída, será inexorablemente arrastrado por la muerte, al igual que una gran inundación arrasa a un pueblo cuyos habitantes están entregados al sueño. - Capítulo Cuatro del Dhammapada"
 LOADING_TIP_106:0 "Este mundo es ciego. Muy pocos son los que ven con claridad. Como los pájaros que escapan de la red del cazador, así, son muy pocos los que se elevan hacia el Estado Bienaventurado. - Capítulo Trece del Dhammapada"
 LOADING_TIP_107:0 "Los constructores de acueductos conducen el agua, los arqueros enderezan las flechas y los carpinteros labran la madera. Los virtuosos se controlan a sí mismos. - Capítulo Diez del Dhammapada"
 LOADING_TIP_108:0 "Abandona los recuerdos de tu pasado. Abandona las preocupaciones sobre el futuro. Abandona los pensamientos sobre el presente. Cruza hacia la Otra Orilla, con tu mente libre de todo deseo. De este modo, ya no volverás a este mundo de nacimiento y muerte. - Capítulo Twenty Four del Dhammapada"
 LOADING_TIP_109:0 "Quienes ignoran que el odio los lleva a su propia destrucción, se sumergen en el error. Pero quienes esto saben, evitan que la semilla del odio se desarrolle en su corazón. - Capítulo Uno del Dhammapada"
 LOADING_TIP_110:0 "De todos estos, los Belgas son los más valientes porque, al ser los más alejados de la cultura y civilización romana, los mercaderes llegan rara vez a ellos a propósito con esas cosas que afeminan los ánimos. - Gaius Julius Caesar"
 LOADING_TIP_111:0 "A esta embajada respondió Ariovisto que, si por su parte pretendiese algo de César, hubiera ido en persona a buscarle; si él tenía alguna pretensión consigo, le tocaba ir a proponérsela. Fuera de que no se arriesgaba sin ejército a ir a parte alguna de la Galia cuyo dueño fuese César, ni podía mover el ejército a otro lugar sin grandes preparativos y gastos. No comprendía que César ni el Pueblo romano tuviesen que hacer en la Galia, que por conquista era suya. - De Bello Gallico"
 LOADING_TIP_112:0 "Ariovisto al cabo de muchos meses que sin dejarse ver estuvo acuartelado, metido entre pantanos, viendo a los galos aburridos de guerra tan larga, desesperanzados ya de venir con él a las manos y dispersos, asaltándolos de improviso, los venció, más con astucia y maña que por fuerza. - De Bello Gallico"
 LOADING_TIP_113:0 "En virtud de este discurso se trocaron maravillosamente los corazones de todos, y concibieron gran denuedo con vivos deseos de continuar la guerra. La legión décima fue la primera en darle por sus tribunos las gracias por el concepto ventajosísimo que tenía de ella, asegurando estar prontísima a la empresa.. - De Bello Gallico"
 LOADING_TIP_114:0 "Que la amistad del Pueblo romano debía redundar en honra y ventaja suya, no en menoscabo, pues con este fin la pretendió; que si los romanos le quitan el tributo y los vasallos tan presto, renunciaría su amistad como la había solicitado. - De Bello Gallico"
 LOADING_TIP_115:0 "\"Era una riqueza, en verdad, de la que nunca oímos ni supimos\", dijo Ailill; \"Pero lo único que tenías era la riqueza de una mujer, y los enemigos de las tierras vecinas a la tuya fueron utilizados para llevarte el botín y el botín que te quitaron\". - Táin Bó Cúalnge"
 LOADING_TIP_116:0 "'Juro por los dioses a quienes adoro', dijo Darè, '¡no tomarán por medios viles lo que no pueden tomar por medios justos!' - Táin Bó Cúalnge"
 LOADING_TIP_117:0 "Y dile que es un honor para él oponerse a las huestes por un espacio de tiempo tan largo o tan corto como el que hace con ellos sus hazañas, pero que le sería mejor esconderse que huir ante cualquiera de sus guerreros. - Táin Bó Cúalnge"
 LOADING_TIP_118:0 "Como se había roto el pacto y las condiciones del combate singular con Cuchulain, ese día Cuchulain tomó su honda y comenzó a disparar contra la hueste de Delga, el Pequeño Dardo, en el sur. Aunque eran numerosos los hombres de Erin ese día, ninguno de ellos se atrevió a volver su rostro hacia el sur, hacia Cuchulain, ni un perro, ni un caballo, ni un hombre. - Táin Bó Cúalnge"
 LOADING_TIP_119:0 "Y el pastor no les permitió llevarse al Toro Marrón de Cualnge, de modo que azuzaron al toro, golpeando con flechas los escudos, hasta que lo arrojaron a un espacio estrecho, y la manada pisoteó el cuerpo del pastor treinta pies en el suelo, de modo que hicieron fragmentos y jirones de su cuerpo. Forjadores era su nombre. Esta es entonces la Muerte de los Forjadores en la presa del Ganado de Cualnge. - Táin Bó Cúalnge"
 LOADING_TIP_120:0 "Esta es, en mi opinión, la razón por la que los jóvenes crecen tan tontos en las escuelas, porque no ven ni oyen nada relacionado con las circunstancias habituales de la vida cotidiana, nada más que cosas sobre piratas que acechan en la orilla del mar con grillos en sus manos, tiranos que emiten edictos para obligar a los hijos a cortar la cabeza de sus propios padres, oráculos que en tiempos de pestilencia ordenan sacrificar a tres vírgenes o más para detener la peste; Frases, palabras y hechos completos, dulces como la miel, por así decirlo, salpicados de amapola y sésamo. - El Satiricón"
 LOADING_TIP_121:0 "¿Qué iba a hacer yo, tonto, cuando me moría de hambre? ¿Detenerse y escuchar una retahíla de frases que no son mejores que el tintineo de cristales rotos o las interpretaciones absurdas de los libros de sueños? Por el gran Hércules, eres mucho más vil que yo; ¡Para celebrar una cena te has dignado halagar a un poeta! - El Satiricón"
 LOADING_TIP_122:0 "\"Mira, Encolpio\", dijo, \"estás tan sumergido en tus placeres que nunca piensas que nuestro dinero se ha agotado y que las bagatelas que nos quedan no tienen valor\". La ciudad no sirve para nada en los días de verano; Habrá mejor suerte en el país. Vayamos a visitar a nuestros amigos.' - El Satiricón"
 LOADING_TIP_123:0 "Todo esclavo que salga al extranjero sin el permiso del Amo recibirá cien azotes. - El Satiricón"
 LOADING_TIP_124:0 "Mientras leíamos las etiquetas, Trimalción exclamó, golpeándose las palmas de las manos: «¡Ay! ¡Pensar que el vino vive más que la pobre humanidad! ¡Bien! ¡Parachoques entonces! Hay vida en el vino. Es el opimiano adecuado, te doy mi palabra. Ayer no traje a nadie tan bueno y cenaron conmigo hombres mucho mejores que tú. - El Satiricón"
 LOADING_TIP_125:0 "Ansioso como siempre por investigar, con todo mi excesivo afán, lo raro y lo maravilloso, y sabiendo que me encontraba en el corazón de Tesalia, patria de esas artes mágicas cuyos poderosos hechizos son alabados en todo el mundo, y recordando que el cuento de mi querido amigo Aristómenes transcurría en esta misma ciudad, me poseyó el deseo y la impaciencia, y me dispuse a examinarlo todo cuidadosamente. - El asno de oro"
 LOADING_TIP_126:0 "Le pido de antemano indulgencia si, como tosco intérprete del exótico discurso del Foro, ofendo. Y en verdad, el hecho mismo de un cambio de voz responderá como la habilidad de un jinete de circo cuando sea necesario. Estamos a punto de embarcarnos en un cuento griego. Lector, atiende: y encuentra deleite. - El asno de oro"
 LOADING_TIP_127:0 "Pero se despertó mi curiosidad, y tan pronto como oí la palabra \"magia\", en lugar de desconfiar de Pamphile, quise embarcarme, de buena gana y por mi propia voluntad, en un aprendizaje en tales materias, cueste lo que cueste, y lanzarme de cabeza al pozo más profundo. - El asno de oro"
 LOADING_TIP_128:0 "Tan pronto como la Aurora, con su brazo rosado levantado, comenzó a conducir sus corceles con arreos púrpuras por el cielo, cuando me desperté de un sueño despreocupado, y la noche me unió al día. El dolor inundó mi mente al recordar la violencia de la noche, y me senté encorvado en mi cama, con los pies cruzados, las manos entrelazadas, los dedos entrelazados sobre las rodillas, llorando profusamente y evocando ya la escena del mercado, el proceso, la sentencia y el verdugo mismo. - El asno de oro"
 LOADING_TIP_129:0 "En cuanto al delito en sí, que debe ser severamente publicado, ni siquiera el culpable niega el hecho. Pero falta un dato: los nombres de sus cómplices en este audaz delito, ya que es poco probable que haya quitado la vida a tres hombres fuertes solo. Así que ahora la verdad se extraerá mediante la tortura. - El asno de oro"
 LOADING_TIP_130:0 "Los hombres interesados en el atletismo y en el cuidado de su cuerpo piensan no sólo en la condición y el ejercicio sino también en la relajación en la temporada; de hecho, consideran que esta es la parte principal de la formación. Creo que de la misma manera los estudiantes, después de mucha lectura de obras serias, pueden relajar provechosamente sus mentes y prepararlas para trabajos futuros. - Una historia real"
 LOADING_TIP_131:0 "Érase una vez, partiendo de las Columnas de Hércules y dirigiéndome hacia el océano occidental con un viento favorable, me puse a viajar. El motivo y propósito de mi viaje residía en mi actividad intelectual y deseo de aventuras, y en mi deseo de saber cuál era el fin del océano y quiénes eran las personas que vivían al otro lado. - Una historia real"
 LOADING_TIP_132:0 "Cuando habíamos avanzado por el bosque a unos tres estadios del mar, vimos una losa de bronce, inscrita con letras griegas, débiles y borradas, que decía: \"Hasta aquí llegaron Hércules y Dioniso\". Hicimos reverencias y seguimos adelante, pero no habíamos ido muy lejos cuando encontramos un río de vino, como podría serlo de Chian. El arroyo era grande y lleno, de modo que en algunos lugares era realmente navegable. Por lo tanto, no pudimos evitar tener una fe mucho mayor en la inscripción de la losa, al ver la evidencia de la visita de Dioniso. - Una historia real"
 LOADING_TIP_133:0 "Hacia el mediodía, cuando la isla ya no estaba a la vista, se levantó de repente un torbellino que hizo girar la barca, la levantó en el aire unos trescientos estadios y no la dejó volver al mar; pero mientras estaba colgado en lo alto, un viento golpeó sus velas y lo impulsó hacia adelante con las velas hinchadas. Durante siete días y siete noches navegamos por el aire, y al octavo día vimos en él una gran tierra, parecida a una isla, brillante y redonda, y brillando con una gran luz. - Una historia real"
 LOADING_TIP_134:0 "Cuando nos miró y sacó sus conclusiones de nuestras ropas, dijo: \"Entonces sois griegos, ¿verdad, extranjeros?\", y cuando asentimos: \"Bueno, ¿cómo habéis llegado aquí, con tanto aire que atravesar?\". Le contamos todo, y él comenzó a hablarnos de sí mismo: que él también era un ser humano, llamado Endimión, que una vez había sido raptado de nuestro país mientras dormía, y al llegar allí había sido hecho rey de la tierra. Dijo que su país era la luna que brilla sobre nosotros. - Una historia real"
 LOADING_TIP_135:0 "Los Volplaneurs son infantería, sin duda, pero vuelan por el aire sin alas. En cuanto a la manera de volar, se suben sus largas túnicas por encima del cinturón, dejan que los pliegues abultados se llenen de viento como si fueran velas, y son llevados como barcos. En su mayor parte sirven como infantería ligera en batalla. También se decía que las estrellas sobre Capadocia enviarían setenta mil Gorriones y cinco mil Dragones Grulla. - Una historia real"
 LOADING_TIP_136:0 "A nosotros, aquel día, nos llevaron al sol con las manos atadas a la espalda con un trozo de telaraña. El enemigo decidió no sitiar la ciudad, pero a su regreso construyó un muro en el aire, para que los rayos del sol ya no llegaran a la luna. La pared era doble, hecha de nubes, de modo que se produjo un verdadero eclipse de luna, y ella quedó completamente envuelta en una noche ininterrumpida. - Una historia real"
 LOADING_TIP_137:0 "En ese país se considera hermoso a un hombre si es calvo y sin pelo, y detestan bastante a las personas de pelo largo. En los cometas es diferente, donde consideran hermosas a las personas de pelo largo: hubo visitantes en la luna que nos hablaron de ellos. Otro punto: tienen barbas que les crecen un poco por encima de las rodillas y no tienen uñas en los pies, sino que todas tienen un solo dedo. Sobre el trasero de cada hombre crece una larga hoja de col, como una cola, que siempre está verde y no se rompe si cae de espaldas. - Una historia real"
 LOADING_TIP_138:0 "Mitilene es una ciudad grande y hermosa en la isla de Lesbos. Un estrecho cuyas aguas fluyen suavemente desde el mar lo separa del continente. Numerosos puentes de madera y piedra blanca brillante adornan sus caminos. No creerías que estás mirando una ciudad sino una isla. - Longus, de Dafnis y Cloe"
 LOADING_TIP_139:0 "Lamón primero pensó en llevarse las fichas y dejar al niño, pero luego le invadió la vergüenza. '¿Soy menos que una cabra en bondad hacia un bebé?' Esperó hasta que oscureció y, bajo su manto, se lo llevó todo a su esposa Myrtale: las fichas, el niño y la propia cabra. Myrtale estaba confundida: '¿Las cabras tienen hijos?' preguntó ella. - Longus, de Dafnis y Cloe"
 LOADING_TIP_140:0 "Dryas y Lamon estaban molestos por lo que habían visto. ¿Iban los niños a convertirse en cabreros y pastores? ¿Para esto, cuando sus pañales prometían un resultado y una fortuna mucho mejores? ¿Fue por esa fortuna que criaron a los niños con buena comida y les enseñaron las letras y muchas cosas hermosas de la vida en el campo? - Longus, de Dafnis y Cloe"
 LOADING_TIP_141:0 "Ya terminaba la primavera y comenzaba el verano. Todo estaba en su punto más glorioso. Los árboles estaban cargados de frutos, las llanuras estaban cubiertas de cultivos y las cigarras resonaban agradablemente. Los frutos olían dulcemente y los rebaños balaban de alegría. Se podría suponer que hasta los ríos que fluían mansamente cantaban, y los vientos, soplando sobre los pinos, emitían sonidos de flauta, y las manzanas deseaban hundirse en la tierra, y el sol, ese amante de la belleza, desnudaba a todos. - Longus, de Dafnis y Cloe"
 LOADING_TIP_142:0 "Decidieron honrar a su benefactor. Se unieron a los familiares de Dorkon para enterrar al pobre. Amontonaron sobre él mucha tierra, plantaron muchas plantas cultivadas y colgaron las primicias de sus esfuerzos como sacrificio. Le derramaron ofrendas de leche y prensaron racimos de uvas y rompieron sobre él muchas flautas de pastor. Se oyó el lastimero mugido de las vacas, y se vio a algunas vacas correteando en desorden. Como parecía entre los rebaños y manadas, estas acciones servían de lamento de las vacas ante la muerte de su pastor. - Longus, de Dafnis y Cloe"
 LOADING_TIP_143:0 "Comenzando por ti, Febo, contaré las famosas hazañas de los hombres antiguos que, a instancias del rey Pelias, por la desembocadura del Ponto y entre las rocas cianeas, se lanzaron al bien armado Argo en busca del vellocino de oro. - La Argonáutica"
 LOADING_TIP_144:0 "Te ruego, madre, que no acumules demasiado amargas penas, porque no me redimirás del mal con lágrimas, sino que añadirás dolor tras dolor. Porque invisibles son los males que los dioses imponen a los mortales; sé fuerte para soportar tu parte de ellos aunque con dolor en tu corazón; anímate de las promesas de Atenea, y de las respuestas de los dioses... - La Argonáutica"
 LOADING_TIP_145:0 "Vano desgraciado, estás tramando para ti la destrucción antes de tiempo. ¿El vino puro hace que tu audaz corazón se hinche en tu pecho hasta tu ruina, y te ha incitado a deshonrar a los dioses? Hay otras palabras de consuelo con las que un hombre podría animar a su camarada; pero has hablado con total imprudencia. - La Argonáutica"
 LOADING_TIP_146:0 "Ahora bien, dime con tu arte profético si los dioses también cumplirán para mí el destino que tu padre prometió para los hijos de Áloe. Y recuerda cómo escaparás vivo de mis manos, si te sorprenden haciendo una profecía vana como el viento ocioso. - La Argonáutica"
 LOADING_TIP_147:0 "Hijo de Esón, no te enojes conmigo si en mi necedad me he equivocado, porque me invadió el dolor de pronunciar una palabra arrogante e intolerable. Pero déjenme darle mi culpa a los vientos y que nuestros corazones se unan como antes. - La Argonáutica"
 LOADING_TIP_148:0 "Escuchen, vagabundos del mar, lo que les conviene saber. Es regla que ningún extraño que llegue a los bebricios debe partir hasta que haya levantado sus manos en batalla contra las mías. Por lo tanto, selecciona a tu guerrero más valiente del ejército y ponlo aquí en el lugar para competir conmigo en el boxeo. Pero si no prestáis atención y pisoteáis mis decretos, seguramente, para vuestro pesar, os sobrevendrá una severa necesidad. - La Argonáutica"
 LOADING_TIP_149:0 "Pero el héroe, siempre ileso, con su habilidad desconcertó el ataque de su enemigo, y rápidamente notó el juego brutal de sus puños para ver dónde era invencible en fuerza y dónde inferior, y se mantuvo firme sin cesar y devolvió golpe tras golpe. Y como cuando los carpinteros golpean con sus martillos las vigas de los barcos para que entren en contacto con las afiladas abrazaderas, fijando capa tras capa; y los golpes resuenan uno tras otro; Entonces mejillas y mandíbulas chocaron a ambos lados, y se levantó un enorme ruido de dientes, y no cesaron de golpear hasta que un jadeo trabajoso los venció a ambos. Y, un poco apartados, se secaban abundantemente el sudor de la frente, jadeando cansinamente. Luego regresaron corriendo juntos otra vez, mientras dos toros pelean en furiosa rivalidad por una novilla que pasta. - La Argonáutica"
 LOADING_TIP_150:0 "Pero cuando el sol que salía de tierras lejanas iluminó las colinas cubiertas de rocío y despertó a los pastores, entonces soltaron sus cables del tallo del laurel y subieron a bordo todo el botín que necesitaban tomar; y con un viento favorable navegaron a través del remolino del Bósforo. - La Argonáutica"
 LOADING_TIP_151:0 "Desdichado, creo que ningún otro hombre es más desgraciado que tú. ¿Por qué sobre ti recaen tantos dolores? ¿Has pecado con necia necedad contra los dioses por tu habilidad en la profecía? ¿Por esto se enojan mucho contigo? - La Argonáutica"
 LOADING_TIP_152:0 "A esa gente no le importa arar con bueyes ni plantar frutos dulces como la miel; ni todavía pastan rebaños en la pradera cubierta de rocío. Pero se parten de la dura tierra productora de hierro y cambian su salario por el sustento diario; Nunca amanece para ellos sin trabajo, sino que entre llamas sombrías y humo soportan trabajos pesados. - La Argonáutica"
 LOADING_TIP_153:0 "Desventurado, ¿por qué estás tan abatido por la desesperación? Sabemos cómo fuisteis en busca del vellocino de oro; Conocemos cada esfuerzo tuyo, todas las hazañas poderosas que realizaste en tus viajes por tierra y mar. Somos las solitarias, las diosas de la tierra, las que hablamos con voz humana, las heroínas, las guardianas y las hijas de Libia. Hasta entonces; No te aflijas así en tu miseria y despierta a tus camaradas. - La Argonáutica"
 LOADING_TIP_154:0 "Lo que hace sonreír al maizal; ¿Bajo qué estrella, Mecenas, conviene remover el césped o casar el olmo con la vid? cómo tiende el novillo; Qué dificultades para la cría de ganado o qué prueba de paciente prueba sirve para las abejas ahorradoras: tales son mis temas. - Las Geórgicas de Virgilio"
 LOADING_TIP_155:0 "Observad también cuándo el nogal del bosque la vestirá con amplia floración e inclinará sus olorosas ramas. Si el fruto prevalece, seguirá como una reserva de grano, y vendrá un gran tiempo de aventamiento con un gran calor; pero si la sombra con abundancia de hojas abunda, en vano tu era magullará los tallos ricos pero en paja. - Las Geórgicas de Virgilio"
 LOADING_TIP_156:0 "Primero, la ley de la naturaleza para generar árboles es múltiple; porque algunos de su propia fuerza surgen espontáneamente, sin que la mano del hombre los obligue, y poseen las llanuras y los meandros de los ríos a lo largo y ancho, como el mimbre flexible y la escoba curvada, el álamo y los sauces en compañías pálidas con hojas verdes que brillan de color gris; y algunos provienen de semillas caídas al azar que los crían, como los altos castaños y, el más poderoso de los árboles ramificados, el Esculus de Júpiter, y los robles, considerados oraculares por los griegos de antaño. - Las Geórgicas de Virgilio"
 LOADING_TIP_157:0 "Pero si te gustan más los escuadrones feroces y las filas de la guerra, o deslizarte sobre ruedas hacia Pisa, con Alfeo fugaz, y en el bosque de Júpiter apremiar el carro volador, que la primera tarea de tu corcel sea enfrentar la furia armada del guerrero, y soportar la trompeta, el largo rugido de las ruedas y el tintineo de las bridas en el establo; luego amar cada vez más la voz de su amo que le acaricia, o la mano ruidosa que le golpea el cuello. - Las Geórgicas de Virgilio"
 LOADING_TIP_158:0 "Es más, todas las razas de hombres, bestias, gente del océano, bandadas y pájaros pintados de la tierra corren hacia el fuego furioso: el amor los domina a todos. - Las Geórgicas de Virgilio"
 LOADING_TIP_159:0 "¡Asume tu grandeza, porque el tiempo se acerca, querido hijo de los dioses, gran descendencia de Júpiter! Mira cómo se tambalea: el poder orbital del mundo, la Tierra y el ancho océano y la bóveda profunda; ¡Todos, mirad, embelesados ​​por el tiempo venidero! - Las Églogas de Virgilio"
 LOADING_TIP_160:0 "Por lo tanto, antes los ciervos ligeros se alimentan en el aire, los mares que sus peces dejan desnudos en la playa, los germanos y los partos cambian sus límites naturales, y estos el Arar, aquellos el Tigris beben, que de mi corazón se desvanecen su rostro y su memoria. - Las Églogas de Virgilio"
 LOADING_TIP_161:0 "A todos los hombres que desean superar a los demás animales les conviene esforzarse, con todas sus fuerzas, en no pasar por la vida en la oscuridad, como las bestias del campo, a las que la naturaleza ha formado humilladas y serviles al apetito. - Salustio"
 LOADING_TIP_162:0 "Sin embargo, durante mucho tiempo fue tema de disputa entre la humanidad si los esfuerzos militares se hacían más por la fuerza del cuerpo o por la fuerza del intelecto. - Salustio"
 LOADING_TIP_163:0 "Tanto en la paz como en la guerra es posible obtener fama; muchos de los que han actuado y muchos de los que han registrado las acciones de otros reciben su tributo de alabanza. - Salustio"
 LOADING_TIP_164:0 "Yo mismo, sin embargo, cuando era joven, al principio me sentí impulsado, como la mayoría de los demás, a involucrarme en asuntos políticos; pero en esa búsqueda muchas circunstancias me fueron desfavorables; porque, en lugar de modestia, templanza e integridad, prevalecían la desvergüenza, la corrupción y la rapacidad. - Salustio"
 LOADING_TIP_165:0 "De la ciudad de Roma, según tengo entendido, los fundadores y primeros habitantes fueron los troyanos, quienes, bajo la dirección de Eneas, vagaban desterrados de su país, sin ningún lugar fijo. - Salustio"
 LOADING_TIP_166:0 "Pero entre ellos la gran rivalidad era por la gloria; cada uno buscaba ser el primero en herir a un enemigo, escalar un muro y ser notado mientras realizaba tal hazaña. - Salustio"
 LOADING_TIP_167:0 "Para las ciudades fortificadas se observarán los siguientes principios generales. Primero viene la elección de un sitio muy saludable. Tal sitio será alto, ni brumoso ni helado, y en un clima ni cálido ni frío, sino templado; más lejos, sin marismas en los alrededores. - Vitruvio"
 LOADING_TIP_169:0 "En consecuencia, no debe despreciarse el método de construcción empleado por los griegos. No utilizan una estructura de escombros blandos pulidos por fuera, pero cada vez que abandonan la piedra dimensional, colocan hileras de lava o de alguna piedra dura y, como si construyeran con ladrillos, unen las juntas verticales intercambiando la dirección de las piedras según se encuentran en las hileras. Así alcanzan una perfección que perdurará por la eternidad. - Vitruvio"
 LOADING_TIP_170:0 "Dado que reyes tan poderosos no han desdeñado los muros construidos con ladrillos, aunque con sus ingresos y con el botín podrían haberlos tenido a menudo no sólo de mampostería o piedra dimensional, sino incluso de mármol, creo que no se deben rechazar los edificios hechos de ladrillos, siempre que estén debidamente \"rematados\". Pero explicaré por qué el pueblo romano no debe utilizar este tipo de edificios dentro de la ciudad, sin omitir las razones y los motivos para ello. - Vitruvio"
 LOADING_TIP_171:0 "Los griegos disponen sus foros en forma de cuadrado rodeado de columnatas dobles muy espaciosas, los adornan con columnas bastante juntas y con entablamentos de piedra o mármol, y construyen paseos arriba en el piso superior. Pero en las ciudades de Italia no se puede seguir el mismo método, porque es costumbre heredada de nuestros antepasados ​​que los espectáculos de gladiadores se hagan en el foro. - Vitruvio"
 LOADING_TIP_172:0 "Entonces los rodios, liberados de la guerra por la astucia de Diogneto, le agradecieron públicamente y lo condecoraron con todos los honores y distinciones. Diogneto trajo esa helepolis a la ciudad, la instaló en un lugar público y puso en ella una inscripción: \"Diogneto, del botín del enemigo, dedicó este regalo al pueblo\". Por lo tanto, en las obras de defensa no sólo se deben preparar máquinas, sino, sobre todo, planes sabios. - Vitruvio"
 LOADING_TIP_173:0 "Para evitar rozaduras: cuando salgas de viaje, mantén una pequeña rama de ajenjo póntico debajo del ano. - Marco Catón"
 LOADING_TIP_174:0 "Es verdad que obtener dinero mediante el comercio es a veces más rentable, si no fuera tan peligroso; y también el préstamo de dinero, si fuera tan honorable. Nuestros antepasados ​​sostenían esta opinión y la plasmaban en sus leyes, que exigían que al ladrón se le pagara el doble y al usurero el cuádruple; Por esto se puede juzgar cuánto menos deseable era el ciudadano que consideraban al usurero que al ladrón. - Marco Catón"
 LOADING_TIP_175:0 "Sé buen vecino y no permitas que tu pueblo cometa ofensas. Si eres popular en el vecindario, te resultará más fácil vender tus productos, más fácil dejar salir tu trabajo, más fácil conseguir manos adicionales. - Marco Catón"
 LOADING_TIP_176:0 "Son deberes del capataz los siguientes:—Debe demostrar buena gestión. Deben observarse los días festivos. Debe apartar sus manos de los bienes ajenos y preservar diligentemente los suyos. Debe resolver las disputas entre los esclavos; y si alguno comete una falta debe castigarlo debidamente en proporción a la culpa. - Marco Catón"
 LOADING_TIP_177:0 "En Roma debían comprarse túnicas, togas, mantas, batas y zapatos; gorros, herramientas de hierro, guadañas, palas, azadones, hachas, arneses, adornos y pequeñas cadenas en Cales y Minturnae; espadas en Venafrum; carros y trineos en Suessa y en Lucania; tinajas y vasijas en Alba y Roma; y azulejos en Venafrum. - Marco Catón"
 LOADING_TIP_178:0 "Los bueyes se pueden unir en los días de fiesta con estos fines: para transportar leña, tallos de frijoles y grano para almacenar. No hay vacaciones para mulas, caballos o burros, excepto las fiestas familiares. - Marco Catón"
 LOADING_TIP_179:0 "Del valor medicinal de la col: es la col la que supera a todas las demás hortalizas. Puede comerse cocido o crudo; si lo comes crudo, sumérgelo en vinagre. Favorece maravillosamente la digestión y es un excelente laxante, y la orina es saludable para todo. - Marco Catón"
 LOADING_TIP_180:0 "Darle medicina al ganado todos los años cuando las uvas comiencen a cambiar de color, para que se conserven bien. Cuando veas una piel de serpiente, recógela y guárdala, para no tener que buscarla cuando la necesites. Macera esta piel, espelta, sal y tomillo con vino, y dáselo a beber a todo el ganado. Procure que el ganado tenga siempre agua buena y clara para beber en verano; es importante para su salud. - Marco Catón"
 LOADING_TIP_181:0 "Ahora me he convertido en la Muerte, la destructora de mundos. - Vishnu, Bhagavad-Gita"



































