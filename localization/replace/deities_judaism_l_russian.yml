## Generic ##
 omen_deborah:1 "Девора"
 omen_deborah_desc:4 "Более известная как Девора на английском, Девора однажды была направлена Богом для атаки на царя Ханаана. Подобно ей, мы должны быть уверены в битвах, которые ведём, и не слушать ложных пророков или следовать их советам. Однако, когда мы уверены, что битва должна состояться, наши воины должны сражаться с силой и дисциплиной, чтобы наш народ одержал победу.\n\n#! Apotheosis Effect: $deborah_apotheosis_effect_tt_description$"
 deity_samuel:0 "$omen_samuel$"
 omen_samuel:1 "Шмуэль"
 omen_solomon:2 "Шломо"
 omen_moses:1 "Моше"
 omen_abraham:1 "Авраам"
 omen_joseph:1 "Йосеф"
 omen_esther:1 "Эстер"
 deity_daniel:0 "$omen_daniel$"
 omen_daniel:1 "Даниэль"
 omen_ezekiel:1 "Йехезкель"
 omen_ezra:1 "Эзра"

 #Cybelene
 deity_ma:0 "$omen_ma$"
 omen_ma:1 "Ма"
 omen_ma_desc:3 "$ma_description$"
 ma_description:0 "Имя Ма использовалось уже во второй половине третьего тысячелетия до н.э. Хотя самая древняя документированная форма имени Ма принадлежит Месопотамии, мы не можем сделать определённых выводов о его происхождении. Её первое появление в Анатолии также неизвестно. Имя Ма означает «мать», но помимо того, что она была богиней-матерью, её также считали богиней луны и богиней-воительницей. Один из важнейших храмов Понтийского царства находился в Комане Понтийской и был посвящён богине Ма. Культ Ма затем перешёл в Коману Каппадокийскую. В конечном итоге Сулла, утверждавший, что во сне Ма дала ему молнию для уничтожения врагов, привнёс её культ в вечный город.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"

 #Anahita
 deity_anahita:0 "$omen_anahita$"
 omen_anahita:0 "Анахита"
 omen_anahita_desc:3 "$anahita_description$"
 anahita_description:0 "Одна из самых могущественных язатов, Анахита почитается как божество «Вод» и ассоциируется с исцелением, плодородием и мудростью. Ей поклонялись долгое время по всему зороастрийскому востоку, но культ богини Анахиты впервые был принесён в Малую Азию в VI веке до н.э. древней Персидской империей Ахеменидов. Символ Анахиты — цветок лотоса. В какой-то момент до IV века до н.э. этот язат слился с вариантом Иштар, также божества «девичьего» плодородия, от которого Ардви Сура Анахита унаследовала дополнительные черты божества войны и планеты Венеры."

 deity_anahit:0 "$omen_anahit$"
 omen_anahit:1 "Анаит"
 omen_anahit_desc:3 "$anahita_description$\n\nАнаит, богиня любви, плодородия, рождения и одно из важнейших божеств армянского народа. Когнатами Анаит являются Инанна, Астлик и Анунит. Анаит часто отождествляется с Артемидой, а иногда с Афродитой. У неё было много храмов, разбросанных по армянским землям, и, возможно, она была их наиболее почитаемым божеством. Она была женой Армазда и сестрой Мигра и Нане.\n\nМы надеемся, что заботливая Анаит благословит наш народ защитой для наших детей, её последователи живут спокойно, зная, что их дети теперь могут безопасно появиться на свет.\n\n#! Apotheosis Effect: $fertility_apotheosis_food_effect_tt_description$"

#Anaitis
 deity_anaitis:0 "$omen_anaitis$"
 omen_anaitis:0 "Анаитида"
 omen_anaitis_desc:0 "$anahita_description$\n\nВ Западной Анатолии Анахита была часто известна как Анаитида, часто синкретизированная с другими местно почитаемыми богинями. Анаитиду регулярно интерпретировали в Анатолии как Артемиду, а не как Афродиту, то есть как богиню плодородия, предположительно потому, что ей поклонялись преимущественно как речному божеству, следовательно, как источнику продуктивности. Однако в Лидии Анаитида отождествлялась с Кибелой, тогда как греки отождествляли её с Афродитой-Анаитидой. Храмовое государство в Зеле было посвящено Анахите и, вероятно, основано в поздний период Ахеменидов, ок. IV век до н.э.\n\n#! Apotheosis Effect: $fertility_apotheosis_food_effect_tt_description$\n $sandstorm_apotheosis_effect_tt_description$"