l_spanish:
  ## Generic ##
 omen_deborah:1 "Debora"
 omen_deborah_desc:4 "Mejor conocida como Débora en inglés, Débora una vez fue guiada por Dios para atacar al rey de Canaán. Como ella debemos estar seguros de las batallas que libramos y no escuchar a los falsos profetas ni seguir sus consejos. Sin embargo, cuando estamos seguros de que se debe librar una batalla, nuestros hombres deben participar con fuerza y ​​disciplina para que nuestro pueblo salga victorioso.\n\n#! Efecto apoteósico: $deborah_apotheosis_effect_tt_description$"
