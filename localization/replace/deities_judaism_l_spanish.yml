 #Cybelene
 deity_ma:0 "$omen_ma$"
 omen_ma:1 "Ma"
 omen_ma_desc:3 "$ma_description$"
 ma_description:0 "El nombre Ma se utilizó ya en la segunda mitad del tercer milenio antes de Cristo. Aunque la forma más antigua documentada del nombre Ma pertenece a Mesopotamia, no podemos llegar a conclusiones definitivas sobre su origen. También se desconoce su primera aparición en Anatolia. El nombre de Ma significa madre, pero además de ser una diosa madre, también era considerada una diosa de la luna y una diosa guerrera. Uno de los templos más importantes del Reino del Ponto estaba en Comana Pontica y estaba dedicado a la diosa Ma. El culto a Ma se extendió luego a Comana Capadocia. Finalmente, Sila, quien afirmó que en un sueño mamá le había dado un rayo para destruir a sus enemigos, introduciría su culto en la ciudad eterna.\n\n#! Efecto apoteósico: $military_apotheosis_manpower_effect_tt_description$"

 #Anahita
 deity_anahita:0 "$omen_anahita$"
 omen_anahita:0 "Anahita"
 omen_anahita_desc:3 "$anahita_description$"
 anahita_description:0 "Anahita, una de las Yazatas más poderosas, es venerada como la divinidad de \"las Aguas\" y asociada con la curación, la fertilidad y la sabiduría. Ha sido adorada durante mucho tiempo en todo el este de Zoroastro, pero el culto a la diosa Anahita fue introducido por primera vez en Asia Menor en el siglo VI a. C. Por el antiguo Imperio persa de los aqueménidas. El símbolo de Anahita es la flor de loto. En algún momento antes del siglo IV a. C., este yazata se combinó con una variante de Istar, también una divinidad de la fertilidad \"doncella\" y de quien Aredvi Sura Anahita heredó características adicionales de una divinidad de la guerra y del planeta Venus."

 deity_anahit:0 "$omen_anahit$"
 omen_anahit:1 "Anahit"
 omen_anahit_desc:3 "$anahita_description$\n\nAnahit, la diosa del amor, la fertilidad, el nacimiento y uno de los dioses más importantes del pueblo armenio. Los cognados de Anahit incluyen Inanna, Astlik y Anunit. Anahit a menudo se identifica con Artemisa y, a veces, con Afrodita. Tenía muchos templos repartidos por tierras armenias y puede haber sido su divinidad más venerada. Era la esposa de Armazd y hermana de Mihr y Nane.\n\nEsperamos que la cariñosa Anahit bendiga a nuestra nación con protección para nuestros jóvenes, sus seguidores viven cómodamente con el conocimiento de que sus hijos ahora pueden traer al mundo de forma segura.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"

#Anaitis
 deity_anaitis:0 "$omen_anaitis$"
 omen_anaitis:0 "anaítis"
 omen_anaitis_desc:0 "$anahita_description$\n\nEn Anatolia occidental, Anahita era conocida a menudo como Anaitis, frecuentemente sincretizada con otra diosa adorada localmente. Anaitis era interpretada regularmente en Anatolia como Artemisa más que como Afrodita, es decir, como una diosa de la fertilidad, presumiblemente porque era adorada predominantemente como una divinidad del río y, por tanto, como una fuente de productividad. Sin embargo, en Lidia, Anaitis fue identificada con Cibeles, mientras que los griegos la identificaron como Afrodita-Anaitis. El templo estatal en Zela estaba dedicado a Anahita y probablemente se estableció a finales del período aqueménida, c. Siglo IV a.C.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$\n $sandstorm_apotheosis_effect_tt_description$"
