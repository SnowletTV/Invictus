l_russian:
## Generic ##
 deity_tuisto:0 "$omen_tuisto$"
 omen_tuisto:1 "Твисто"
 omen_tuisto_desc:3 "Известный римлянам как Туисто, Твисто является верховным божеством нашего пантеона и прародителем нашего племени и народа. Рождённый землёй, он имел нескольких сыновей, которые стали правителями того, что позже стало германскими племенами. Наш народ обращается к нему за руководством и помощью во всех делах и глубоко чтит его в наших церемониях.\n\n#! Apotheosis Effect: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_alcis:0 "$omen_alcis$"
 omen_alcis:1 "Альхиз"
 omen_alcis_desc:3 "Известный римлянам как Альцис. Несмотря на все внешние признаки, Альхиз на самом деле является именем для двух братских божеств, считающихся единым целым, пары Божественных Близнецов. Почитаемые за их юность и братскую любовь, они иногда изображаются в виде лошадей или колесниц, везущих солнце по небу.\n\n#! Apotheosis Effect: $culture_apotheosis_characters_effect_tt_description$"
 deity_tamfana:0 "$omen_tamfana$"
 omen_tamfana:1 "Данно"
 omen_tamfana_desc:3 "Зафиксированная Тацитом как Тамфана. Данно почитается в некоторых из самых священных мест Германии и является важным божеством для тамошних священных рощ. Кроме того, поскольку она является одной из богинь-покровительниц урожая, мы часто оставляем ей дары, когда наши люди собираются выйти в поля.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_baduhenna:0 "$omen_baduhenna$"
 omen_baduhenna:1 "Бадвахено"
 omen_baduhenna_desc:3 "Более известная как Бадухенна. Бадвахено часто призывают и invocируют перед войной как одну из матрон нашего пантеона. Наши мужчины и солдаты обращаются к ней за руководством и надеются, что она направит их руку, пока они сражаются за племена.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"
 deity_vagdavercustis:0 "$omen_vagdavercustis$"
 omen_vagdavercustis:1 "Вагдаверкустиз"
 omen_vagdavercustis_desc:3 "Известная римлянам как Вагдаверкустис. Для некоторых наших людей она является главным божеством войны, военного прозрения и доблести. Её многочисленные истории вдохновляют наших мужчин и солдат на правильные поступки, и некоторые утверждают, что она направляет их руки в битве после того, как они возносят ей молитвы.\n\n#! Apotheosis Effect: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_hludana:0 "$omen_hludana$"
 omen_hludana:1 "Хлудано"
 omen_hludana_desc:3 "Упоминаемая в римских источниках как Хлюдана, Хлудано известна как защитница леса, а также как божество-покровительница сельского хозяйства. Хлудано обычно ассоциируется с верностью, преданностью и изображается как сострадательная фигура. В тяжёлые времена наш народ обращается к ней за защитой.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"
 deity_nehalennia:0 "$omen_nehalennia$"
 omen_nehalennia:1 "Нехалени"
 omen_nehalennia_desc:3 "Нехаленния, так римляне записали её имя, является богиней-покровительницей торговли, садоводства и коммерции. Обычно её изображают сидящей с собакой рядом, а также с товарами, относящимися к её сфере влияния. Торговцы и купцы часто призывают её, заключая сделки в чужих землях или с людьми из странных экзотических культур, так же поступают и те, кто хочет её помощи в производстве товаров и изделий.\n\n#! Apotheosis Effect: $economy_income_effect_tt_description$"
 deity_nerthus:0 "$omen_nerthus$"
 omen_nerthus:1 "Нертуз"
 omen_nerthus_desc:3 "Также известная как Нертус, одна из наших главных богинь плодородия, а также одно из самых популярных божеств плодородия среди германских племён в целом, Нертуз является знакомой фигурой и почитаемым божеством в нашем государстве. Легенды гласят, что Нертуз проявляет особый интерес к человеческим делам и часто путешествует среди своих последователей и народа.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_slaves_effect_tt_description$"