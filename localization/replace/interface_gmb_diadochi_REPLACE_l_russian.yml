 EGYINTRO:0 "#T Птолемеево царство#!\nСложность: #Y Легкая#!\n\nДинастия Лагидов Птолемея крепко держит в руках невероятно плодородную дельту Нила. Недавно потерпев сокрушительное морское поражение от рук Деметрия, первого сына Антигона, птолемеевский флот практически не существует. Тем не менее, концентрированная экономика дельты Нила обеспечивает фантастическую доходную базу для военной реорганизации. Однако следует проявлять осторожность, так как большинство египетского населения имеет культуру и религию, отличные от культуры и религии их греческих повелителей."
 SELINTRO:1 "#T Селевкидское царство#!\nСложность: #Y Тяжелая#!\n\nСелевкидская династия во главе с Селевком Никатором контролирует крупнейшее из государств-преемников на момент начала нашей игры. Хотя эта обширная империя может собрать огромные полчища солдат, близость Маурьев на востоке и мощного царства Антигона на западе может привести к конфликтам в двух совершенно разных сферах. Правящий класс состоит преимущественно из греческих дворян, что часто вызывает конфликты с различными культурными группами на территории Селевкидов. В дополнение к этой ситуации, ряд зависимых территорий полагается на поддержку Селевкидов, некоторые из которых имеют совершенно противоположные интересы..."
