l_spanish:

 EGYINTRO:0 "#T Reino Ptolemaico#!\nDificultad: #Y Fácil#!\n\nLa dinastía Lagid de Ptolemaio mantiene un firme control sobre el increíblemente fértil delta del Nilo. Habiendo sufrido recientemente una aplastante derrota naval a manos de Demetrio, el primer hijo de Antígono, la armada ptolemaica es prácticamente inexistente. No obstante, la economía condensada del delta del Nilo proporciona una fantástica base de ingresos para la reorganización militar. Sin embargo, se debe tener cuidado, ya que la mayoría de la población egipcia tiene una cultura y religión diferentes a las de sus señores griegos."
 SELINTRO:1 "#T Reino Seleukid#!\nDificultad: #Y Difícil#!\n\nLa dinastía Seleukid, encabezada por Seleukos Nikator, controla el mayor de los estados sucesores al inicio de nuestro juego. Si bien este imperio en expansión puede reunir grandes huestes de soldados, la proximidad de los Mauryas en el este y el poderoso reino de Antígonos en el oeste puede provocar conflictos en dos esferas completamente diferentes. La clase dominante está formada principalmente por nobles griegos, lo que a menudo puede causar conflictos con los diversos grupos culturales dentro del territorio seléucida. Para agravar esta situación, varias dependencias dependen del apoyo seléucida, algunas con agendas totalmente contrastantes..."
