l_russian:
 latin_greek_enable:1 "Марсово поле"
 latin_greek_enable_desc:0 "Изначально Марсово поле принадлежало последнему этрусскому царю Рима, Тарквинию Гордому. После его свержения поле было посвящено богу Марсу. Римские мужчины собирались здесь каждой весной перед тем, как отправиться воевать с враждебными племенами, окружающими Рим, а народ собирался для религиозных праздников."
 latin_celtic_enable:1 "Смерть галлам"
 latin_celtic_enable_desc:0 "После того как галлы разбили римлян у рек Тибр и Аллия, они двинулись на Рим. Летом 390 года до н.э. захватчики сожгли и разграбили город. Римляне продолжали сражаться на Капитолийском холме, пока не пали от голода. С тех пор римляне испытывали страх и ненависть к галлам."
 celtic_latin_enable:1 "Наследие Бренна"
 celtic_latin_enable_desc:0 "Когда римляне попросили выкупить свой город, Бренн потребовал 1000 фунтов золота. Галлы предоставили гири для взвешивания золота, но римляне утверждали, что они подтасованы в пользу галлов. Бренн бросил свой меч на весы и воскликнул: «Горе побежденным!»"
 celtic_north_african_enable:1 "Южные пастбища"
 celtic_north_african_enable_desc:0 "Коню нужна пастбище, как всаднику нужен конь."
 levantine_greek_enable:1 "Наследие Тира"
 levantine_greek_enable_desc:0 "Александр был так раздражен обороной тирянцами своего островного города, что разрушил половину его, когда тот пал."
 levantine_north_africa_enable:1 "Ливийские львы"
 levantine_north_africa_enable_desc:0 "Являясь символом гордости и власти, берберийский лев часто встречался в раннем египетском искусстве и литературе, а также throughout римского периода."
 mauryan_persia_enable:1 "Бескрайние равнины"
 mauryan_persia_enable_desc:0 "Засушливые земли между Персией и Индией идеально подходят для обучения искусству верховой езды."
 north_african_latin_enable:1 "Месть Дидоны"
 north_african_latin_enable_desc:0 "Бежав из родного Тира и основав Карфаген, а затем отвергнутая своим возлюбленным-троянцем Энеем, Дидона прокляла будущих римлян перед тем, как лишить себя жизни."
 north_african_levantine_enable:1 "Великое Финикийское море"
 north_african_levantine_enable_desc:0 "Финикийцы настолько искусны в навигации, что всё Средиземное море кажется их вотчиной."
 persian_mauryan_enable:1 "Джунгли Хиндустана"
 persian_mauryan_enable_desc:0 "Жаркие джунгли Индии создают плотную боевую среду, непохожую ни на одну из известных нам ранее."
 persian_levantine_enable:1 "Императорский флот"
 persian_levantine_enable_desc:0 "Дарий Великий был первым царем Ахеменидов, построившим флот. Даже к тому времени не существовало настоящего постоянного военно-морского флота ни в Греции, ни в Египте. Персия стала первой империей, развернувшей регулярный императорский флот."
 greek_levantine_enable:1 "Наследие Саламина"
 greek_levantine_enable_desc:0 "Битва при Саламине была морским сражением, выигранным альянсом греческих полисов под руководством Фемистокла против значительно более крупного флота Персидской империи под командованием царя Ксеркса в 480 году до н.э."
 greek_persian_enable:1 "Наследие Гавгамел"
 greek_persian_enable_desc:0 "Битва при Гавгамелах (331 год до н.э.) стала последней встречей Александра Македонского и царя Персии Дария III и началом конца Персидской империи."
 persian_philosophy:0 "Персидские традиции"
 persian_philosophydesc:4 "Иранские традиции охватывают тактику народов скифской степи и сателлитов бывшей империи Ахеменидов. Жизнь на степи и вокруг неё превратила эти народы в превосходных всадников, которые, вооруженные луками, могут изматывать и окружать своих противников, оставаясь вне зоны их досягаемости, в то время как их пехота сосредотачивается на истощении изношенных формирований.\n\nМожет разблокировать корабли типа '#Y Октера#!'\nМожет разблокировать тактику '#Y Конная стычка#!'\nМожет разблокировать способность '#Y Набор ополчения#!'\nМожет разблокировать способность '#Y Военные колонии#!'\n\n#G Фокусы традиций#!\nСильные #Y Конные лучники#!\nХорошая #Y Тяжелая пехота#!, #Y Тяжелая кавалерия#!"
 persian_philosophy_2:1 "Иранские традиции"