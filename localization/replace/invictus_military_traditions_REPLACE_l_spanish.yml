l_spanish:
 latin_greek_enable:1 "Field of Mars"
 latin_greek_enable_desc:0 "Campus Martius fue originalmente propiedad del último rey etrusco de Roma, Tarquinius Superbus. Después de su destitución, el campo fue dedicado al dios Marte. Los hombres romanos se reunían cada primavera antes de partir a luchar contra las tribus hostiles que rodeaban Roma y la gente se reunía para celebrar festivales religiosos."
 latin_celtic_enable:1 "Death to the Gauls"
 latin_celtic_enable_desc:0 "Después de que los galos derrotaron a los romanos en los ríos Tíber y Allia, marcharon hacia Roma. En el verano de 390 a. C., los invasores quemaron y saquearon la ciudad. Los romanos continuaron luchando en el Capitolio hasta que cayeron en hambruna. Desde entonces, Roma ha temido y odiado a los galos."
 celtic_latin_enable:1 "Legacy of Brennus"
 celtic_latin_enable_desc:0 "Cuando los romanos pidieron un rescate por su ciudad, Brennus exigió 1.000 libras de oro. Los galos proporcionaron pesas para medir el oro, pero los romanos afirmaron que estaban manipuladas a favor de los galos. Brennus arrojó su espada sobre las pesas y exclamó ¡Ay de los vencidos!"
 celtic_north_african_enable:1 "Pastos del Sur"
 celtic_north_african_enable_desc:0 "Un caballo necesita un pasto como un jinete necesita un caballo."
 levantine_greek_enable:1 "Legacy of Tyre"
 levantine_greek_enable_desc:0 "Alejandro estaba tan frustrado por la defensa de los tirios de su ciudad isleña que destruyó la mitad de ella cuando cayó en sus manos."
 levantine_north_africa_enable:1 "Lions of Libya"
 levantine_north_africa_enable_desc:0 "Símbolo de orgullo y poder, el león de Berbería apareció con frecuencia en el arte y la literatura egipcia temprana y durante todo el período romano."
 mauryan_persia_enable:1 "Endless Plains"
 mauryan_persia_enable_desc:0 "Las tierras áridas entre Persia y la India son ideales para aprender el arte de la equitación."
 north_african_latin_enable:1 "Dido's Revenge"
 north_african_latin_enable_desc:0 "Habiendo huido de su Tiro natal y fundado Cartago, luego rechazada por su amante troyano Eneas, Dido maldijo a los futuros romanos antes de quitarse la vida."
 north_african_levantine_enable:1 "Great Phoenician Sea"
 north_african_levantine_enable_desc:0 "Los fenicios son tan hábiles en la navegación que todo el mar Medio parece ser su dominio exclusivo."
 persian_mauryan_enable:1 "Selvas de Indostán"
 persian_mauryan_enable_desc:0 "Las húmedas selvas de la India proporcionan un entorno de combate denso como nunca antes habíamos conocido."
 persian_levantine_enable:1 "The Imperial Fleet"
 persian_levantine_enable_desc:0 "Darío el Grande fue el primer rey aqueménida en construir una flota. Incluso entonces, no había existido una verdadera armada permanente ni en Grecia ni en Egipto. Persia se convertiría en el primer imperio en desplegar una armada imperial regular."
 greek_levantine_enable:1 "Legacy of Salamis"
 greek_levantine_enable_desc:0 "La Batalla de Salamina fue una batalla naval ganada por una alianza de ciudades-estado griegas bajo el liderazgo de Temístocles contra la flota mucho más grande del Imperio Persa bajo el mando del rey Jerjes en 480 a.C."
 greek_persian_enable:1 "Legacy of Gaugamela"
 greek_persian_enable_desc:0 "La batalla de Gaugamela (331 a. C.) fue el encuentro final entre Alejandro Magno de Macedonia y el rey Darío III de Persia y el comienzo del fin del Imperio Persa."
 persian_philosophy:0 "Tradiciones persas"
 persian_philosophydesc:4 "Las Tradiciones iraníes cubren las tácticas de los pueblos de la estepa escita y los satélites del antiguo imperio aqueménida. La vida en la estepa y sus alrededores ha convertido a estos pueblos en exquisitos jinetes que, armados con un arco, pueden hostigar y rodear a sus oponentes más allá de su alcance, mientras su infantería se concentra en reducir la desgastada formación.\n\nPuede desbloquear los barcos '#Y Octere#!'\nPuede desbloquear la caballería '#Y Escaramuza#!' Táctica\nPuede desbloquear la habilidad '#Y Aumentar impuestos#!'\nPuede desbloquear la habilidad '#Y Colonias militares#!'\n\n#G Enfoques tradicionales#!\nFuerte #Y Arqueros a caballo#!\nBueno #Y Infantería pesada#!, #Y Caballería pesada#!"
 persian_philosophy_2:1 "Iranian Traditions"
