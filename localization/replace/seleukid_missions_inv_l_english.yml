# Task 1 - The Road East
 me_seleukid_06_upper_satrapies.101.t:0 "$seleukid_mission_06_upper_satrapies_task_1$"
 me_seleukid_06_upper_satrapies.101.desc:0 "The road out of Babylonia meets the Royal Road near Opis and then climbs into the Zagros by the pass the Greeks call the Median Gate, running beneath the great rock of Bagistanos where Dareios cut his proclamation into the cliff above the traffic. Past it lies Media, and past Media the hill country of the Amardoi and the Kadousioi, who have never taken kindly to being governed: Artaxerxes took an army up against the Kadousioi and brought it back starving, and Alexander had to go into the hills after the Amardoi himself. Our surveyors and our agents go ahead of the [ROOT.GetCountry.GetAdjective] army, mapping the passes and buying the goodwill of the mountain lords, and none of that comes cheap. The road has been opened. Our rights over the highland are still to be set out, before a single soldier follows."
 me_seleukid_06_upper_satrapies.101.a:0 "Let the road be opened."

 me_seleukid_06_upper_satrapies.1.t:0 "$seleukid_mission_06_upper_satrapies_task_1$"
 me_seleukid_06_upper_satrapies.1.desc:0 "Our surveyors and our agents have gone ahead of the [ROOT.GetCountry.GetAdjective] army, mapping the passes and buying the goodwill of the mountain lords, and none of it came cheap. The road out of Babylonia is open, up into the Zagros by the pass the Greeks call the Median Gate and beneath the great rock of Bagistanos where Dareios cut his proclamation into the cliff above the traffic. Past it lies Media, and past Media the hill country of the Amardoi and the Kadousioi, who have never taken kindly to being governed: Artaxerxes took an army up against the Kadousioi and brought it back starving, and Alexander had to go into the hills after the Amardoi himself. Our rights over the highland have been set out before a single soldier follows."
 me_seleukid_06_upper_satrapies.1.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_1$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.1.a:0 "Media shall answer to us."

# Task 2 - Media Atropatene
 me_seleukid_06_upper_satrapies.2.t:0 "$seleukid_mission_06_upper_satrapies_task_2$"
 me_seleukid_06_upper_satrapies.2.desc:0 "Atropates was satrap of Media under Dareios and led the Medes at Gaugamela, and Alexander thought well enough of him to hand the satrapy straight back and to marry his daughter to Perdikkas at the great wedding at Susa. When the empire was divided at Babylon, Peithon took Media proper and Atropates was left only the northern hills, whereupon he stopped answering to anyone at all and the Greeks began calling the place after him."
 me_seleukid_06_upper_satrapies.2.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_2$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.2.a:0 "Let the envoy ride for the highland."
 
 me_seleukid_06_upper_satrapies.201.t:0 "An Offer from [seleucid_overlord.GetName]"
 me_seleukid_06_upper_satrapies.201.desc:0 "The ambassadors of [seleucid_overlord.GetName] have come up into the highland, offering the great king's friendship and his protection. They bring rich gifts with them, gold and fine things out of the south, and ask only that we take our place among the king's men."
 me_seleukid_06_upper_satrapies.201.a:0 "The [seleucid_overlord.GetAdjective]s ask for little."
 me_seleukid_06_upper_satrapies.201.b:0 "Hail [seleucid_overlord.GetRuler.GetName]!"
 me_seleukid_06_upper_satrapies.201.c:0 "Send the embassy home."

 me_seleukid_06_upper_satrapies.202.t:0 "$seleukid_mission_06_upper_satrapies_task_2$"
 me_seleukid_06_upper_satrapies.202.desc:0 "The lord of Atropatene has refused us. He is trusting to his mountains and to the distance from our muster grounds, and neither of those will stop a phalanx that has already been paid."
 me_seleukid_06_upper_satrapies.202.a:0 "A shame."

 me_seleukid_06_upper_satrapies.203.t:0 "$seleukid_mission_06_upper_satrapies_task_2$"
 me_seleukid_06_upper_satrapies.203.desc:0 "Our envoy has done his work. The lord of Atropatene has taken the great king's gifts and his protection, and takes his place among our men in the northern hills."
 me_seleukid_06_upper_satrapies.203.a:0 "The highland is ours."
 me_seleukid_06_upper_satrapies.203.tributary.tt:0 "#E #Y Atropatene#!#! becomes a [THIS.GetCountry.GetAdjective] #E Tributary#!."
 me_seleukid_06_upper_satrapies.203.satrapy.tt:0 "#E #Y Atropatene#!#! becomes a [THIS.GetCountry.GetAdjective] #E Satrapy#!."

# Task 3 - Royal Ganzak
 me_seleukid_06_upper_satrapies.3.t:0 "$seleukid_mission_06_upper_satrapies_task_3$"
 me_seleukid_06_upper_satrapies.3.desc:0 "Ganzak is simply the Median word for a treasury, and it is where the satraps of Media have always kept theirs. The magi are one of the six old tribes of the Medes and the priesthood of the whole highland: they keep a walled enclosure with an altar deep in ash where the fire is never let go out, and no Median offering is made without one of them standing over it to chant. Atropates was himself named for that fire, and the herdsmen of these hills judge a king largely by how he handles it."
 me_seleukid_06_upper_satrapies.3.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_3$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.3.a:0 "Burn baby burn."

# Task 4 - The Summer Capital
 me_seleukid_06_upper_satrapies.4.t:0 "$seleukid_mission_06_upper_satrapies_task_4$"
 me_seleukid_06_upper_satrapies.4.desc:0 "Ekbatana lies high on the skirts of Mount Orontes and stays cool through the months when Babylonia is unlivable, which is why the Great Kings summered there and why our own court now does. It has no wall at all, only an artificial citadel of remarkable strength, and a palace running some seven stades around, all of it cedar and cypress, with the rafters and the columns of the colonnades plated in silver and gold and every roof tile of solid silver. Or so it was. Alexander's Macedonians stripped most of the plate off it, and what they left came off in our own generation, so what we have refounded is a magnificent carcass of bare timber. It has been rebuilt as Epiphaneia Ekbatana, the seat of the province moved into it, and we hold the East from there."
 me_seleukid_06_upper_satrapies.4.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_4$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.4.a:0 "Let the court remove to Ekbatana."

# Task 5 - The Elamite Gate
 me_seleukid_06_upper_satrapies.5.t:0 "$seleukid_mission_06_upper_satrapies_task_5$"
 me_seleukid_06_upper_satrapies.5.desc:0 "Susa has been a capital since the Elamites, and it holds the ground where the road up from Babylon meets the roads into Persis and Media. Dareios made it the working seat of the Achaemenids and ended the Royal Road at its gate, a hundred and eleven posting stations from Sardis; his own foundation charter for the palace there admits how much of the work was foreign, cedar hauled up from Lebanon by Ionians and Karians, gold out of Sardis and Baktria, the stone cut by Greeks and Lydians. In that same palace [GetCharacter('(int32)39').GetPraenomen] took Stateira to wife and had eighty of his officers wed Persian women beside him. The place has been half ours for two centuries without anyone saying so. We say so now, and refound it as Seleukeia on the Eulaios."
 me_seleukid_06_upper_satrapies.5.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_5$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.5.a:0 "Let the old capital rise anew."

# Task 6 - The Achaemenid Heartland
 me_seleukid_06_upper_satrapies.6.t:0 "$seleukid_mission_06_upper_satrapies_task_6$"
 me_seleukid_06_upper_satrapies.6.desc:0 "Persepolis has not been a living city since [GetCharacter('(int32)39').GetPraenomen] burned the terrace, and what is left of it is ceremonial rather than useful: the apadana of Dareios, the tribute reliefs climbing its stairs, and the Tachara, which the fire spared. Pasargadae, up the Pulvar, is older and quieter, Kyros's own foundation, where magi still keep watch on his tomb and cut stone channels carry water more than a thousand paces through a garden divided into four quarters for the four quarters of his empire. When [GetCharacter('(int32)39').GetPraenomen] found that tomb broken open he set Aristoboulos to make it good again, and then had it sealed. There is no profit in ruins, but there is a great deal in being seen to keep them. The palaces go back into repair and the gardens back under water, so that the Persians see the [ROOT.GetCountry.GetAdjective] house is heir to Kyros and Dareios."
 me_seleukid_06_upper_satrapies.6.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_6$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.6.a:0 "We are heir to Kyros and Dareios."

# Task 7 - The Satrapy of Persis
 me_seleukid_06_upper_satrapies.7.t:0 "$seleukid_mission_06_upper_satrapies_task_7$"
 me_seleukid_06_upper_satrapies.7.desc:0 "Our secretaries have gone over the accounts of Persis, still kept in the old fashion of the satrap's court."
 me_seleukid_06_upper_satrapies.7.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_7$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.7.a:0 "Sounds good."
 me_seleukid_06_upper_satrapies.7.a.tt:0 "The heartland of #Y Persis#! takes on a #Y Greco-Persian administration#!, and its people, city and countryside alike will beging to take up #E Greco-Persian#! ways."
 me_seleukid_06_upper_satrapies.7.b:0 "Let our satrap's court take up Greek ways."
 me_seleukid_06_upper_satrapies.7.b.tt:0 "#Y Persis#!'s ruling house and a great many of its people take up #E Greco-Persian#! ways"
 me_seleukid_06_upper_satrapies.7.c:0 "Leave the old order in place."

# Task 8 - The City of a Hundred Gates
 me_seleukid_06_upper_satrapies.8.t:0 "$seleukid_mission_06_upper_satrapies_task_8$"
 me_seleukid_06_upper_satrapies.8.desc:0 "Hecatompylos sits on the dry southern skirt of the Elburz, at the point where every road of the surrounding country comes together, and it is that meeting of roads, not any wall, that earned it the Greek name of the City of a Hundred Gates. Water here does not run on the surface. The Persian kings gave five generations' use of the land to any man who brought water to ground that had none, so the plain is threaded with underground channels and hidden wells that only men raised on them can find. Those channels are back in working order and a fortress stands over the crossroads, so the city can feed an army and hold the road at the same time."
 me_seleukid_06_upper_satrapies.8.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_8$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.8.a:0 "Let the desert bloom."

# Task 9 - The Satrapy of Parthia
 me_seleukid_06_upper_satrapies.9.t:0 "$seleukid_mission_06_upper_satrapies_task_9$"
 me_seleukid_06_upper_satrapies.9.desc:0 "Parthia and Hyrcania lie a long way from Antioch, out past Media and the Caspian Gates, and Hyrcania is shut away behind the Elburz with its forests and its vines and figs that Greek travelers will not stop talking about. The satrapy has usually been left to a Persian: Phrataphernes held Parthia and Hyrcania together for Dareios, kept faith with him to the last, and had the double satrapy confirmed when he came over to Alexander; and Dareios the Great's father Hystaspes had governed the country long before that. Whoever holds this march has to answer a raid off the steppe without waiting on word from us, and must be trusted with a free hand to do it."
 me_seleukid_06_upper_satrapies.9.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_9$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.9.a:0 "Confirm the satrapy of Parthia."
 me_seleukid_06_upper_satrapies.9.c:0 "Parthia is already ours."
 me_seleukid_06_upper_satrapies.9.d:0 "The matter rests for now."

# Task 10 - The Bactrian Road
 me_seleukid_06_upper_satrapies.10.t:0 "$seleukid_mission_06_upper_satrapies_task_10$"
 me_seleukid_06_upper_satrapies.10.desc:0 "The oasis of Margiana is a green island in a ring of desert, and Alexander planted a city there to keep the horsemen of Spitamenes off the Bactrian road. The ground repays the trouble: the vine grows stocks that two men together cannot get their arms around, and clusters a full two cubits long. But an oasis is only as safe as its edge, and the Parni and the other nomads come out of the sand where they please. The place has been refounded as Antiocheia Margiane, and we have walled not merely the town but the whole plain, fifteen hundred stadia of circuit, farmland and all."
 me_seleukid_06_upper_satrapies.10.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_10$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.10.a:0 "Let the gate to Bactria be held."

# Task 11 - The Satrapy of Bactria
 me_seleukid_06_upper_satrapies.11.t:0 "$seleukid_mission_06_upper_satrapies_task_11$"
 me_seleukid_06_upper_satrapies.11.desc:0 "Bactria is among the wealthiest and most remote regions in the civilized world. The Hindu Kush stands in front of it, desert behind, and [ROOT.GetCountry.GetCapital.GetName] is a season's march away. Men call it the land of a thousand cities..."
 me_seleukid_06_upper_satrapies.11.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_11$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.11.a:0 "King? Satrap? Its all the same."
 me_seleukid_06_upper_satrapies.11.c:0 "The status quo shall do."
 me_seleukid_06_upper_satrapies.11.d:0 "The matter rests for now."

# Task 12 - The Eastern Satraps

# Task 13 - Laodikeia Chosroi
 me_seleukid_06_upper_satrapies.13.t:0 "$seleukid_mission_06_upper_satrapies_task_13$"
 me_seleukid_06_upper_satrapies.13.desc:0 "Our house names its foundations for its own blood: Antiocheia for the king's father, Seleukeia for himself, Apameia for his wife, and Laodikeia for Laodike his mother. South of Ekbatana the road drops into the well-watered valley of Nihavand, broad enough for a polis of its own with Greek magistrates set over it. Below that it squeezes through the country of the Kossaioi, hill men who used to charge the Persian kings a toll every time the court moved between Ekbatana and Babylon, until Alexander spent a winter in their valleys and broke the habit."
 me_seleukid_06_upper_satrapies.13.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_13$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.13.a:0 "Let the colonists take root."

# Task 14 - The Stronghold of Rhagiana
 me_seleukid_06_upper_satrapies.14.t:0 "$seleukid_mission_06_upper_satrapies_task_14$"
 me_seleukid_06_upper_satrapies.14.desc:0 "The Avesta calls Rhagai Ragha of the three races and reckons it Zarathustra's own city; Dareios the Great's men ran the Median rebel Phraortes down in it; and Dareios III fled through it with Alexander eleven days behind him and got no further than the Caspian Gates, a day to the east, before his own officers killed him. Those Gates are a defile some eight miles long, cut so narrow that carts must pass in single file, and they are the only practical road out of Media into the East. Seleukos Nikator once refounded the town as Europos, after the place in Macedonia where he was born; walled again with a fortress over it, it is now Europos Rhagai, raised over the Gates to shut that road for us or open it as we please. Below it the plain is filling too: Apameia Ragiani, surnamed to tell it from the others of its name, and Charax Persias, whose name is only the Greek for a palisade, have been settled where the road runs out of the hills and that ground is ours."
 me_seleukid_06_upper_satrapies.14.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_14$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.14.a:0 "Let the Caspian Gates be held."

# Task 15 - Colonies in Rhagiana
# Task 16 - The Persian Colonies
 me_seleukid_06_upper_satrapies.16.t:0 "$seleukid_mission_06_upper_satrapies_task_16$"
 me_seleukid_06_upper_satrapies.16.desc:0 "Two Greek settlements in Persis were planted and then left to shift for themselves. One sits on the Hedyphon where the Susian plain gives out against the Persian hills, grain country astride the road east, and it will carry a proper city if we pay to raise one: Seleukeia Hedyphonte. The other is out on the gulf coast among the salt flats, and nothing there will grow of its own accord; for that one we write to Magnesia on the Maeander and ask the Magnesians outright for settlers, a favor they grant and cut into stone afterward, and refound the place as Antiocheia Persidos. The Hedyphon city we have for the money. The coast we take in hand if the coast is already ours."
 me_seleukid_06_upper_satrapies.16.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_16$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.16.a:0 "Let the coast be settled."

# Task 17 - Kalliope and Charis
 me_seleukid_06_upper_satrapies.17.t:0 "$seleukid_mission_06_upper_satrapies_task_17$"
 me_seleukid_06_upper_satrapies.17.desc:0 "Comisene is a long stretch of road with eight villages and their post-stations strung along it and not one city in the whole district, which is a poor way to hold a country. Kalliope sits on its rock there, one of the pair of forts the Parthians raised in the old days to watch the Medes, and it is the obvious place to make that city. Vishpauzatis is a name out of Dareios' own rock inscription: there his father Hystaspes met the rebel Parthians in the field and broke them, in the spring of the year the empire nearly came apart."
 me_seleukid_06_upper_satrapies.17.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_17$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.17.a:0 "Let the Muses come east."

# Task 18 - Expanding Northward
 me_seleukid_06_upper_satrapies.18.t:0 "$seleukid_mission_06_upper_satrapies_task_18$"
 me_seleukid_06_upper_satrapies.18.desc:0 "North of Parthia the plowland gives out and the Dahae have the country, three peoples under the one name: the Parni nearest us, then the Xanthii and the Pissuri. Their settled neighbors took the word to mean robbers, which is fair enough as far as it goes, though it does not do them justice. Their mounted archers held the left wing at Gaugamela beside the Bactrians, rode for Bessos and then for Spitamenes after that, and in the end Alexander took them into his own cavalry and set them on the Indian horse at the Hydaspes. Men of that quality are worth more in our pay than at our backs, and the frontier will not be quiet while they answer to nobody. We mean to master the marches of Derbicca, Dahaea and Parnia, and the claims go out now."
 me_seleukid_06_upper_satrapies.18.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_18$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.18.a:0 "The frontier shall be ours."

# Task 19 - Settling Bactria
 me_seleukid_06_upper_satrapies.19.t:0 "$seleukid_mission_06_upper_satrapies_task_19$"
 me_seleukid_06_upper_satrapies.19.desc:0 "Bactra is where the caravan roads of the East meet: gold and lapis down from the mountains, hides and horses off the steppe, and the wares of India and the distant Seres passing through her markets to the sea. The plain about her is watered off the Oxus by canals dug long before any Greek came here, and it will carry as many towns as we are willing to pay for. Two are worth founding. Bactra herself has been refounded as Antiocheia Baktriane, the seat and the great market of the whole East. Downstream stands Tarmita, at the one point where the Oxus must be crossed by anyone moving between Bactria and the lands to the south; where that crossing is ours, we raise Antiocheia Tharmata upon it as well. Four hundred gold has bought the settlers and the founding."
 me_seleukid_06_upper_satrapies.19.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_19$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.19.a:0 "Let a thousand cities rise upon the Oxus."

# Task 20 - Settling Aria
 me_seleukid_06_upper_satrapies.20.t:0 "$seleukid_mission_06_upper_satrapies_task_20$"
 me_seleukid_06_upper_satrapies.20.desc:0 "Aria is the garden on the road, green fields fed off the Arius and ringed by dry country, and every caravan passing between Parthia and Bactria must go through it. Alexander took Artacoana here on his way to Bactria and left a city of his own behind him. Our foundation is Antiocheia Soteira, and the name is not idle: Soter was earned in Asia against the Galatians, when sixteen elephants broke a far larger army, and the trophy was struck showing the elephant alone with no man beside it. Four hundred gold has paid for it, and for Apameia Raphane besides, where that town is already ours."
 me_seleukid_06_upper_satrapies.20.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_20$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.20.a:0 "Let the caravan roads be held."

# Task 21 - The Breadbaskets of Bactria
 me_seleukid_06_upper_satrapies.21.t:0 "$seleukid_mission_06_upper_satrapies_task_21$"
 me_seleukid_06_upper_satrapies.21.desc:0 "Where the Kokcha comes down into the Oxus a Greek city already stands, with a theatre for five or six thousand and a gymnasium far larger than the people there can fill. In the founder's precinct, over the bones of Kineas who settled the place, a man named Klearchos set up the maxims of the old sages, cut into the stone that he had copied them himself at holy Pytho. Far to the north, on the south bank of the Jaxartes, stands the other: Alexandreia Eschate, the Furthest, which Alexander walled in twenty days and settled with Greek mercenaries, Macedonians past service, and such of the natives as were willing. So the East does not want for Greeks, nor for their learning. What it wanted was ordered farmland, and for the canals off the Oxus and the Jaxartes to carry far more."
 me_seleukid_06_upper_satrapies.21.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_21$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.21.a:0 "Let the granary be filled."

# Task 22 - Antiocheia Skythias
 me_seleukid_06_upper_satrapies.22.t:0 "$seleukid_mission_06_upper_satrapies_task_22$"
 me_seleukid_06_upper_satrapies.22.desc:0 "Alexander set Alexandreia Eschate on the south bank of the Jaxartes and called it the Furthest, and for a while that was honest. It is not the furthest any longer. Beyond it the Massagetai water their horses on our side of the river whenever the fords run low, and there is nothing between them and the farmland of Ferghana but distance. Antiocheia Skythias has been planted out past the old limit, a walled town with settlers in it, and the name of the place tells the steppe whose river this is. It has cost two hundred gold."
 me_seleukid_06_upper_satrapies.22.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_22$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.22.a:0 "Beyond here there is nothing worth conquering."

# Task 23 - Humbling the Chorasmians
 me_seleukid_06_upper_satrapies.23.t:0 "$seleukid_mission_06_upper_satrapies_task_23$"
 me_seleukid_06_upper_satrapies.23.desc:0 "Down where the Oxus spreads out and loses itself in the sand lies Chorasmia, an oasis between two deserts, farmed off canals dug there thousands of years before the Persians ever claimed it. It was already out of Persian hands before Alexander came. When Pharasmanes rode into his camp with fifteen hundred horse he came as an ally offering to guide the army to the Black Sea, and Alexander took the friendship and left the country to itself. It has answered to nobody since; their kings strike coins copied from our own, which is the nearest to obedience they have ever come."
 me_seleukid_06_upper_satrapies.23.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_23$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.23.a:0 "Let Chorasmia be humbled."

# Task Final - To the Banks of the Indus
 me_seleukid_06_upper_satrapies.24.t:0 "$seleukid_mission_06_upper_satrapies_task_final$"
 me_seleukid_06_upper_satrapies.24.desc:0 "Ekbatana, Susa, and Persepolis are held, and the greater part of the country behind them, and we are Great King in fact and not only in style. Beyond them the road runs east through Arachosia and Gedrosia and Sattagydia down to Patalene and the mouths of the Indus. When Alexander died, the satraps he had set over India were put to the sword on the orders of Chandragupta, whom our people call Sandrocottus, and he freed those lands from us only to fasten his own yoke upon them. Long have their people languished under his despotism. [GetCharacter('(int32)39').GetPraenomen] turned back at the Hyphasis because his men would go no further. We will not. We claim the road east and go down it ourselves, to the banks of the Indus."
 me_seleukid_06_upper_satrapies.24.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_final$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.24.a:0 "To the banks of the Indus."

# Task 24 - The Satraps' Conference
 me_seleukid_06_upper_satrapies.30.t:0 "$seleukid_mission_06_upper_satrapies_task_12$"
 me_seleukid_06_upper_satrapies.30.desc:0 "They have come in from Media and Persis, from Parthia and Bactria and the Arachosian march, and sat down at one table with us. Each goes home confirmed in his seat, and each has watched the others confirmed in theirs. A settlement out of it, and not a coalition."
 me_seleukid_06_upper_satrapies.30.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_12$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.30.a:0 "Let them go home confirmed."

# Task 25 - Reducing the Nearer Satraps
 me_seleukid_06_upper_satrapies.31.t:0 "$seleukid_mission_06_upper_satrapies_task_25$"
 me_seleukid_06_upper_satrapies.31.desc:0 "A new age calls for a new order, and the near satrapies feel it first. The governors of Media and Persis hold the old Persian heartland in our name, each in his own seat, ruling as satraps have always ruled. The court is assembled now and waits on the word we give for them."
 me_seleukid_06_upper_satrapies.31.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_25$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.31.a:0 "Let the nearer fiefs be dissolved."
 me_seleukid_06_upper_satrapies.31.b:0 "Leave the nearer fiefs their thrones."
 me_seleukid_06_upper_satrapies.31.b.tt:0 "The nearer satraps keep their thrones as our subjects, and their loyalty is earned."

# Task 26 - Reducing the Farther Satraps
 me_seleukid_06_upper_satrapies.32.t:0 "$seleukid_mission_06_upper_satrapies_task_26$"
 me_seleukid_06_upper_satrapies.32.desc:0 "The new order must reach even to the ends of the empire, where a season's march separates our court from the satraps of Parthia, Aria, and Bactria. To annex them is to govern them ourselves, with our own men, at the far end of the longest road in the world. The court waits on our word."
 me_seleukid_06_upper_satrapies.32.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_26$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.32.a:0 "Let the work be finished."
 me_seleukid_06_upper_satrapies.32.b:0 "The status quo will do."
 seleukid_us_annex_satrap_tt:0 "#R #E Annex#!#! #Y [us_annex_target.GetName]#!#!"
 seleukid_us_reduce_satrap_tt_1: "#E #R Choose the following:#!#!"
 seleukid_us_reduce_satrap_tt:0 "#E Annex#!  #E #Y [us_annex_target.GetName]#!#!"
 seleukid_us_reduce_alt_tt:0 "#G #E Or choose the following:#!#!"

# Task 27 - The Kingdom of Elymais
 me_seleukid_06_upper_satrapies.33.t:0 "$seleukid_mission_06_upper_satrapies_task_27$"
 me_seleukid_06_upper_satrapies.33.desc:0 "Old Elam is really two countries. The plain about Susa can be governed from a desk, but the hills above it never have been: the Uxians who hold the passes charged the Great Kings a toll to cross their own empire, and it took [GetCharacter('(int32)39').GetPraenomen] coming over the mountain by night to end the arrangement, after which they paid a hundred horses, five hundred cattle and thirty thousand sheep a year, having neither coin nor ploughland to pay with. Holding all of that with our own garrisons is a slow bleed for a country that mostly wants to be left alone. [kamnaskires_scope.GetName] is a lord of the old Elamite blood and well disposed toward us."
 me_seleukid_06_upper_satrapies.33.complete.tt:0 "The mission task '#Y $seleukid_mission_06_upper_satrapies_task_27$#!' has now been #G Completed#!!"
 me_seleukid_06_upper_satrapies.33.a:0 "[kamnaskires_scope.GetPraenomen] will be raised up."
 me_seleukid_06_upper_satrapies.33.a.tt:0 "#E #Y Elymais#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Satrapy#!\n#E [kamnaskires_scope.GetName]#! becomes the ruler of #E #Y Elymais#!#!"
 me_seleukid_06_upper_satrapies.33.b:0 "The status quo will do."

 me_seleukid_06_upper_satrapies.500.t:0 "The Upper Satrapies Restored"
 me_seleukid_06_upper_satrapies.500.desc:0 "Ekbatana, Susa and Persepolis are held, and the greater part of the country behind them, and we are Great King in fact and not only in style. Beyond them the road runs east through Arachosia and Gedrosia and Sattagydia down to Patalene and the mouths of the Indus, and it is claimed. Chandragupta's envoys had already named their price for it: five hundred war elephants, and a marriage tie between the houses on terms their embassy and ours could not agree how to word, and in return we were to sign the eastern satrapies over to him and be done with them. Five hundred elephants would have settled any field we cared to name in the west. We could have taken the beasts and been sensible. We claimed the road instead, and we mean to go down it ourselves."
 me_seleukid_06_upper_satrapies.500.a:0 "Then let us go down it."

