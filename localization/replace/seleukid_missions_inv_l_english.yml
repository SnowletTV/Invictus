 esagila_of_babylon_modifier:0 "Temple of Esagila"
 desc_esagila_of_babylon_modifier:0 "The house of Bel-Marduk is repaired, and the temple estates pay their dues again."
 eanna_of_uruk_modifier:0 "Sanctuary of the Eanna"
 desc_eanna_of_uruk_modifier:0 "The temples of Anu and Ishtar are rebuilt, and the priestly houses of Uruk grow rich under them."
 patron_of_the_temples_modifier:0 "Patron of the Temples"
 desc_patron_of_the_temples_modifier:0 "The old priesthoods keep their lands and their rites, and they say so where the people can hear."
 sel_loyalty_earned:0 "Seleukid Investment"
 seleukid_erythraean_sea_modifier:0 "Gateway to the Erythraean Sea"
 desc_seleukid_erythraean_sea_modifier:0 "A harbor of ours at the head of the Erythraean Sea, where the routes to Arabia and India begin."
 ikaros_greek_colony_modifier:0 "Greek Colony of Ikaros"
 desc_ikaros_greek_colony_modifier:0 "Greeks off the mainland have made a town of the island, with a temple and a garrison on it."
 satrap_of_carmania_modifier:0 "Satrap of Carmania"
 desc_satrap_of_carmania_modifier:0 "A Persian satrap holds Carmania for us, and the far shore of the Gulf with it."
 hyparch_of_the_isles_modifier:0 "Hyparch of the Isles"
 desc_hyparch_of_the_isles_modifier:0 "A dynast of our choosing rules Tylos and the islands, and the sea lanes past them are safe."
 gerrha_tributary_modifier:0 "Arabian Tribute"
 desc_gerrha_tributary_modifier:0 "Gerrha sends us a share of the frankincense and silver its caravans bring out of the interior."
 charax_emporium_modifier:0 "Emporium of Charax"
 desc_charax_emporium_modifier:0 "Charax Spasinu answers to no satrap. The Gulf trade comes up the Tigris through our own customs house."
 patron_of_the_gulf_modifier:0 "Patron of the Gulf"
 desc_patron_of_the_gulf_modifier:0 "The Gulf ports send their dues up the Tigris, and their masters look to us."
