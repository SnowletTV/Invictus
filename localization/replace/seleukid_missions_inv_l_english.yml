# EVENTS
# ============================================================

# Task 1 - The Satrapy of Phrygia
 me_seleukid_03_anatolia.1.t:0 "$seleukid_mission_03_anatolia_task_1$"
 me_seleukid_03_anatolia.1.desc:0 "The road west runs through [GetProvince('(int32)1936').GetArea.GetRegion.GetName], and [GetProvince('(int32)1936').GetName] sits astride it. It was the satrapal seat under the Great Kings, where the Marsyas comes out of the rock below the citadel, and it is ours to govern from again."
 me_seleukid_03_anatolia.1.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_1$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.1.a:0 "[GetCharacter('(int32)37').GetPraenomen] would weep if [GetCharacter('(int32)37').GetSheHe] saw the state of [GetCharacter('(int32)37').GetHerHis] kingdom."

# Task 2 - Restoring Kelainai
 me_seleukid_03_anatolia.2.t:0 "$seleukid_mission_03_anatolia_task_2$"
 me_seleukid_03_anatolia.2.desc:0 "[GetProvince('(int32)1936').GetName] had been fought over and left standing by turns since Xerxes wintered in it. It has been rebuilt, and it houses our governors and gives [GetProvince('(int32)1936').GetArea.GetRegion.GetName] its seat again."
 me_seleukid_03_anatolia.2.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_2$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.2.a:0 "We have something in mind already."

# Task 3 - The Ancient Men
 me_seleukid_03_anatolia.3.t:0 "$seleukid_mission_03_anatolia_task_3$"
 me_seleukid_03_anatolia.3.desc:0 "At [GetProvince('(int32)1928').GetName] stands an old sanctuary of the moon-god Men, whose crescent the Phrygians have cut on their shrines since before the Persians came, and whose priests held the land around the city and the loyalty of its people. We have taken the place and refounded it in the image of our royal cities, so that the sanctuary and its district both answer to us."
 me_seleukid_03_anatolia.3.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_3$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.3.a:0 "They should be thanking us, really."

# Task 4 - Phrygian Administration
 me_seleukid_03_anatolia.4.t:0 "$seleukid_mission_03_anatolia_task_4$"
 me_seleukid_03_anatolia.4.desc:0 "[GetProvince('(int32)1936').GetArea.GetRegion.GetName] is a land of long roads and few walls, the highway from the Aegean to the east running straight through it. An administration here is only as strong as the road-stations, garrisons, and market-towns that tie it together. We have built that network out across the region, so that [GetProvince('(int32)1936').GetArea.GetRegion.GetName] stays a working part of [ROOT.GetCountry.GetName] and not a stretch of country we merely march through."
 me_seleukid_03_anatolia.4.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_4$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.4.a:0 "That is the price for ruling a region safely, after all."

# Task 5 - Antigonid Capital
 me_seleukid_03_anatolia.5.t:0 "$seleukid_mission_03_anatolia_task_5$"
 me_seleukid_03_anatolia.5.desc:0 "[GetProvince('(int32)1936').GetName] was [GetCharacter('(int32)37').GetPraenomen]'s own seat when he held [GetProvince('(int32)1936').GetArea.GetRegion.GetName] for Alexander, and he made it the strongest city in Asia by pouring men and silver into it. We have finished the work we began there and won its people as he once did, so that the old capital and the country around it look to our house and no other."
 me_seleukid_03_anatolia.5.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_5$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.5.a:0 "This relationship benefits the both of us, it seems."

# Task 6 - By the Taurus Mountains
 me_seleukid_03_anatolia.6.t:0 "$seleukid_mission_03_anatolia_task_6$"
 me_seleukid_03_anatolia.6.desc:0 "North of [GetProvince('(int32)1883').GetArea.GetRegion.GetName] lie [GetProvince('(int32)1799').GetArea.GetRegion.GetName] and the eastern reaches of [GetProvince('(int32)1936').GetArea.GetRegion.GetName], upland country that every power in Anatolia has been content to leave alone. It is poor ground and it pays little, but the road west runs through it, and it is ours now, with an administration of our own over it."
 me_seleukid_03_anatolia.6.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_6$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.6.a:0 "We will do what our predecessors could not."

# Task 7 - Administration in Kindyria
 me_seleukid_03_anatolia.7.t:0 "$seleukid_mission_03_anatolia_task_7$"
 me_seleukid_03_anatolia.7.desc:0 "We located a small settlement that could be refounded into a city of importance in [GetProvince('(int32)177').GetName], [GetProvince('(int32)177').GetArea.GetName], just north of the ancient city of [GetProvince('(int32)1934').GetName]."
 me_seleukid_03_anatolia.7.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_7$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.7.a:0 "It was well worth the effort we put into it."

# Task 8 - The Two Ancient Cities
 me_seleukid_03_anatolia.8.t:0 "$seleukid_mission_03_anatolia_task_8$"
 me_seleukid_03_anatolia.8.desc:0 "Two old cities anchor this country: [GetProvince('(int32)1934').GetName] in [GetProvince('(int32)1934').GetArea.GetName] and [GetProvince('(int32)1951').GetName] in [GetProvince('(int32)1951').GetArea.GetName]. We have spent on those two, and the towns around them are falling in behind."
 me_seleukid_03_anatolia.8.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_8$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.8.a:0 "We hope they will appreciate what we have done for them."

# Task 9 - Eastern Administration
 me_seleukid_03_anatolia.9.t:0 "$seleukid_mission_03_anatolia_task_9$"
 me_seleukid_03_anatolia.9.desc:0 "Though often less popular than its western neighbors, the region was in strong need of a capable administration with the infrastructure needed to take care of everything. We have handed them that, and it is sure to pay off in the future."
 me_seleukid_03_anatolia.9.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_9$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.9.a:0 "They are doing admirable work."

# Task 10 - The Cappadocian Satrapy
 me_seleukid_03_anatolia.10.t:0 "$seleukid_mission_03_anatolia_task_10$"
 me_seleukid_03_anatolia.10.desc:0 "[GetProvince('(int32)1799').GetArea.GetRegion.GetName] has never been easy for an outsider to hold. It is a land of lords, each ruling over a principality of his own, and the Great Kings governed them through satraps drawn from those same houses. Perhaps the time has come to place a lord loyal to [ROOT.GetCountry.GetRuler.GetPraenomen] over the Cappadocians in place of a governor from [ROOT.GetCountry.GetCapital.GetName]."
 me_seleukid_03_anatolia.10.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_10$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.10.a:0 "Cappadocia shall be [ariobarzanes_scope.GetPraenomen]'s to have and to hold!"
 me_seleukid_03_anatolia.10.a.tt:0 "#E #Y Cappadocia#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Satrapy#!\n#E [ariobarzanes_scope.GetName]#! becomes the ruler of #E #Y Cappadocia#!#!\n#Y Cappadocia#! will receive every territory #Y [SCOPE.GetRootScope.GetCountry.GetName]#! holds in the #E Region of #Y Cappadocia#!#!."
 me_seleukid_03_anatolia.10.a.2.tt:0 "#Y Cappadocia#! will receive every territory #Y [SCOPE.GetRootScope.GetCountry.GetName]#! holds in the #E Region of #Y Cappadocia Pontica#!#!."
 me_seleukid_03_anatolia.10.b:0 "The status quo will do."

# Task 11 - Moving Westwards
 me_seleukid_03_anatolia.11.t:0 "$seleukid_mission_03_anatolia_task_11$"
 me_seleukid_03_anatolia.11.desc:0 "The royal road ends among the Greek cities of the coast, in [GetProvince('(int32)292').GetArea.GetRegion.GetName]. They have risen against every distant master set over them, and there have been many. Ours is established there now."
 me_seleukid_03_anatolia.11.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_11$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.11.a:0 "The west draws nearer."

# Task 12 - At the End of the Persian Road
 me_seleukid_03_anatolia.12.t:0 "$seleukid_mission_03_anatolia_task_12$"
 me_seleukid_03_anatolia.12.desc:0 "[GetProvince('(int32)292').GetName] stands at the end of the royal road, where the couriers of the Great Kings came in from Susa. Anatolians and Greeks have lived in it side by side for as long as either can remember, and it has been enlarged to house our administration in the west."
 me_seleukid_03_anatolia.12.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_12$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.12.a:0 "The road ends here."

# Task 13 - Western Administration
 me_seleukid_03_anatolia.13.t:0 "$seleukid_mission_03_anatolia_task_13$"
 me_seleukid_03_anatolia.13.desc:0 "Every power that has held the west has lost it the same way: the satraps grow strong and the roads grow long. Cities and fortresses have been set along those roads, and they keep both in hand."
 me_seleukid_03_anatolia.13.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_13$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.13.a:0 "Another step closer to Macedon."

# Task 14 - Dreams of Seleukos
 me_seleukid_03_anatolia.14.t:0 "$seleukid_mission_03_anatolia_task_14$"
 me_seleukid_03_anatolia.14.desc:0 "According to [GetCharacter('(int32)24').GetPraenomen], our ruling family has descended from Apollo himself, and have long been loyal followers of the oracle in Didyma, a temple structure close to the city of [GetProvince('(int32)1973').GetName]. Our donations have gone to that oracle."
 me_seleukid_03_anatolia.14.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_14$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.14.a:0 "The temple is under our hand, now that we hold [GetProvince('(int32)1973').GetName]."

# Task 15 - The Oracle in Didyma
 me_seleukid_03_anatolia.15.t:0 "$seleukid_mission_03_anatolia_task_15$"
 me_seleukid_03_anatolia.15.desc:0 "It has long been a dream for the [GetCharacter('(int32)24').GetFamily.GetName] family to secure the loyalty of the oracle in Didyma, close to the city of [GetProvince('(int32)1973').GetName]. With the temple structure expanded, that loyalty is ours."
 me_seleukid_03_anatolia.15.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_15$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.15.a:0 "Our ancestors would be proud."

# Task 16 - Another Seleukeia
 me_seleukid_03_anatolia.16.t:0 "$seleukid_mission_03_anatolia_task_16$"
 me_seleukid_03_anatolia.16.desc:0 "Our founder's name stands on cities from the Tigris to the sea, and every one of them has paid for itself twice over. Another has been raised in far western Anatolia."
 me_seleukid_03_anatolia.16.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_16$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.16.a:0 "Yet another royal city under our rule."

# Task 17 - The Viceroy of the West
 me_seleukid_03_anatolia.30.t:0 "$seleukid_mission_03_anatolia_task_17$"
 me_seleukid_03_anatolia.30.desc:0 "$seleukid_mission_03_anatolia_task_17_DESC$"
 me_seleukid_03_anatolia.30.a:0 "Appoint Achaios viceroy of the lands beyond the Tauros."
 me_seleukid_03_anatolia.30.b:0 "Asia shall be Achaios's to have and to hold!"
 me_seleukid_03_anatolia.30.b.tt:0 "#E #Y Asia#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Satrapy#!\n#E [achaios_scope.GetName]#! becomes the ruler of #E #Y Asia#!#!"
 me_seleukid_03_anatolia.30.b.annex.tt:0 "#E Our subjects in #Y Asia#! and #Y Phrygia#! that are not republics and hold more than #Y 5#! territories will be annexed into #Y Asia#!#!"
 me_seleukid_03_anatolia.30.c:0 "He is not fit to rule in our name."
 me_seleukid_03_anatolia.30.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_17$#!' has now been #G Completed#!!"

# Task 18 - The Colonists of Phrygia
 me_seleukid_03_anatolia.31.t:0 "$seleukid_mission_03_anatolia_task_18$"
 me_seleukid_03_anatolia.31.desc:0 "$seleukid_mission_03_anatolia_task_18_DESC$"
 me_seleukid_03_anatolia.31.a:0 "The status quo shall do."
 me_seleukid_03_anatolia.31.b:0 "It is only right that these men rule over what they built."
 me_seleukid_03_anatolia.31.b.tt:0 "#E #Y Dokimeion#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Feudatory#!\n#E [dokimos_scope.GetPraenomen]#! becomes the ruler of #E #Y Dokimeion#!#!\n#E #Y Dorylaion#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Feudatory#!\n#E [dorylaos_scope.GetPraenomen]#! becomes the ruler of #E #Y Dorylaion#!#!\n#E #Y Themisonion#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Feudatory#!\n#E [themison_scope.GetPraenomen]#! becomes the ruler of #E #Y Themisonion#!#!\n#E #Y Kleonnaeion#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Feudatory#!\n#E [kleonnas_scope.GetPraenomen]#! becomes the ruler of #E #Y Kleonnaeion#!#!"
 me_seleukid_03_anatolia.31.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_18$#!' has now been #G Completed#!!"

# Task 19 - The Shipyards of Cyprus
 me_seleukid_03_anatolia.32.t:0 "$seleukid_mission_03_anatolia_task_19$"
 me_seleukid_03_anatolia.32.desc:0 "$seleukid_mission_03_anatolia_task_19_DESC$"
 me_seleukid_03_anatolia.32.a:0 "The yards of Cyprus will build the king's ships."
 me_seleukid_03_anatolia.32.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_19$#!' has now been #G Completed#!!"

# Task 20 - The Paphian Goddess
 me_seleukid_03_anatolia.33.t:0 "$seleukid_mission_03_anatolia_task_20$"
 me_seleukid_03_anatolia.33.desc:0 "$seleukid_mission_03_anatolia_task_20_DESC$"
 me_seleukid_03_anatolia.33.a:0 "Endow the sanctuary of Aphrodite."
 me_seleukid_03_anatolia.33.b:0 "Restore the Kinyrad priesthood as a temple state."
 me_seleukid_03_anatolia.33.b.tt:0 "#E #Y [GetProvince('(int32)334').GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!\n#E [kinyras_scope.GetName]#! becomes the ruler of #E #Y [GetProvince('(int32)334').GetName]#!#!"
 me_seleukid_03_anatolia.33.c:0 "Refound the sacred city as a free Greek polis."
 me_seleukid_03_anatolia.33.c.tt:0 "#E #Y [GetProvince('(int32)334').GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Client State#!"
 me_seleukid_03_anatolia.33.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_20$#!' has now been #G Completed#!!"

# Task 21 - The Satrapy of Cyprus
 me_seleukid_03_anatolia.34.t:0 "$seleukid_mission_03_anatolia_task_21$"
 me_seleukid_03_anatolia.34.desc:0 "$seleukid_mission_03_anatolia_task_21_DESC$"
 me_seleukid_03_anatolia.34.a:0 "Cyprus will be governed by a royal strategos."
 me_seleukid_03_anatolia.34.b:0 "A local ruler would be more effective."
 me_seleukid_03_anatolia.34.b.tt:0 "#E #Y Cyprus#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Satrapy#!\n#E [nikanor_scope.GetName]#! becomes the ruler of #E #Y Cyprus#!#!"
 me_seleukid_03_anatolia.34.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_21$#!' has now been #G Completed#!!"

# Task 22 - The Copper of Tamassos
 me_seleukid_03_anatolia.35.t:0 "$seleukid_mission_03_anatolia_task_22$"
 me_seleukid_03_anatolia.35.desc:0 "$seleukid_mission_03_anatolia_task_22_DESC$"
 me_seleukid_03_anatolia.35.a:0 "Work the royal copper mines."
 me_seleukid_03_anatolia.35.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_22$#!' has now been #G Completed#!!"

# Task Final - From Persepolis to Sardeis
 me_seleukid_03_anatolia.17.t:0 "$seleukid_mission_03_anatolia_task_final$"
 me_seleukid_03_anatolia.17.desc:0 "The royal road runs from [GetProvince('(int32)4799').GetName] to [GetProvince('(int32)292').GetName], and the Great Kings governed the west by it. It is ours now end to end, and with it, the west."
 me_seleukid_03_anatolia.17.complete.tt:0 "The mission task '#Y $seleukid_mission_03_anatolia_task_final$#!' has now been #G Completed#!!"
 me_seleukid_03_anatolia.17.a:0 "Though our work is not over yet."

 me_seleukid_03_anatolia.18.t:0 "$seleukid_mission_03_anatolia$"
 me_seleukid_03_anatolia.18.desc:0 "We have conquered to the shores of [GetProvince('(int32)1973').GetArea.GetRegion.GetName]. With the greater part of Anatolia under our rule and the royal road with it, the way lies open into every country [GetCharacter('(int32)39').GetPraenomen] once held."
 me_seleukid_03_anatolia.18.a:0 "The #E Legacy of Alexander#! is our own."
 me_seleukid_03_anatolia.18.a.tt:0 "The mission '#Y $seleukid_mission_03_anatolia$#!' has now been #G Completed#!!"

################################################################
# 04 PALESTINE
################################################################

 seleukid_mission_04_palestine:0 "To the Borders of Egypt"
 seleukid_mission_04_palestine_finish_tt:0 "#G Completing this task finishes#! #E #T To the Borders of Egypt#!#!."
 seleukid_mission_04_palestine_finish_upper_satrapies_unlock_tt:0 "#G Completing this task finishes#! #E #T To the Borders of Egypt#!#! and #G unlocks#! a new mission tree: #E #T Hellenistic Empire#!#!."
 seleukid_mission_04_palestine_DESCRIPTION:0 "Controlling [GetProvince('(int32)687').GetArea.GetRegion.GetName] and [GetProvince('(int32)789').GetArea.GetRegion.GetName] is essential if you want to be in charge of the crossroads of the old empire of [GetCharacter('(int32)39').GetPraenomen], as it brings people from Egypt to Anatolia, or from Anatolia to Babylonia.\n\nTaking control of those regions will enable us to start taking control of the rest of the remnants of the old empire."
 seleukid_mission_04_palestine_CRITERIA_DESCRIPTION:0 "Mission will be considered complete when we have taken control of [GetProvince('(int32)687').GetArea.GetRegion.GetName] and [GetProvince('(int32)789').GetArea.GetRegion.GetName]."
 seleukid_mission_04_palestine_BUTTON_TOOLTIP:0 "At the heart of the old empire lies [GetProvince('(int32)687').GetArea.GetRegion.GetName] and [GetProvince('(int32)789').GetArea.GetRegion.GetName], two regions waiting for us to rule them."

# ============================================================
# Missions
# ============================================================

 seleukid_mission_04_palestine_task_1:0 "Securing Syria"
 seleukid_mission_04_palestine_task_1_DESC:0 "We should secure all of [GetProvince('(int32)789').GetArea.GetRegion.GetName] before we start campaigning in [GetProvince('(int32)687').GetArea.GetRegion.GetName], to safely ensure a route southwards for our soldiers."

 seleukid_mission_04_palestine_task_2:0 "Protecting the Passes"
 seleukid_mission_04_palestine_task_2_DESC:0 "The hill roads between [GetProvince('(int32)789').GetArea.GetRegion.GetName] and [GetProvince('(int32)687').GetArea.GetRegion.GetName] are narrow and blind, and a column strung out along them can be broken by very few men. Forts along that road would turn the ground against anyone coming up it and leave our own traffic unmolested."

 seleukid_mission_04_palestine_task_3:0 "The Shipbuilders of Phoenicia"
 seleukid_mission_04_palestine_task_3_DESC:0 "The shipwrights of Phoenicia are well known far beyond the borders of their cities and provinces, as they are some of the best shipbuilders all around the Mediterranean. We are only the last in a long line of kings seeking their help in building a navy in which we can control our local shores."
 seleukid_mission_04_palestine_task_3_trigger_tt:0 "[THIS.GetCountry.GetName] has a subject loyalty of at least #Y [SCOPE.ScriptValue('seleukid_mission_04_palestine_task_3_total')|0]#!. [THIS.GetCountry.Custom('seleukid_mission_04_palestine_task_3_loc')]"

 seleukid_mission_04_palestine_task_4:0 "Preparing the Southern Campaign"
 seleukid_mission_04_palestine_task_4_DESC:0 "We hold [GetProvince('(int32)789').GetArea.GetRegion.GetName] now, and the whole road south lies open before us. Beyond the Palestinian coast, and the thin strip of desert past it, sits Egypt itself, richest of all the lands Alexander left behind, and its throne has grown soft and ripe for the taking. We should lay our claims and ready the army for the march down the coast."
 seleukid_mission_04_palestine_task_4_effect_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! gains a claim on every territory in #Y Lower Egypt#! not held by a subject or an ally."
 
 seleukid_mission_04_palestine_task_5:0 "The Shores of Palestine"
 seleukid_mission_04_palestine_task_5_DESC:0 "The coast from [GetProvince('(int32)747').GetName] down to [GetProvince('(int32)659').GetName] and [GetProvince('(int32)660').GetName] carries the trade of half the world between the old Phoenician cities on their harbors, and the caravan-roads running inland behind them. We should bring the whole shore under our hand, down to the edge of the Egyptian desert."

 seleukid_mission_04_palestine_task_6:0 "The Gods of Askalon"
 seleukid_mission_04_palestine_task_6_DESC:0 "Our advisors have pointed out the temple structure and shrines in [GetProvince('(int32)660').GetName], chief among them the sanctuary of the fish-goddess whom the locals call Derceto, as an area of improvement that would easily improve our popularity among the local populace of [GetProvince('(int32)687').GetArea.GetRegion.GetName]."
 seleukid_mission_04_palestine_task_6_trigger_tt:0 "#Y [GetProvince('(int32)660').GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_04_palestine_task_6_total')|0]#! [GetBuilding('temple_building').GetName] buildings. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_04_palestine_task_6_loc')]"
 seleukid_mission_04_palestine_task_6_effect_tt:0 "Unlocks the deity '[GetDeityDefinition('omen_hadad').GetName]'."

 seleukid_mission_04_palestine_task_7:0 "Integrating Palestine"
 seleukid_mission_04_palestine_task_7_DESC:0 "If we are ever to truly secure the loyalty of our subjects and vassals in [GetProvince('(int32)687').GetArea.GetRegion.GetName], they will have to become more accustomed to our rule, and we will have to integrate them to a certain degree in our governance of their homes."
 seleukid_mission_04_palestine_task_7_trigger_tt:0 "At least #Y 80%#! of the #Y [SCOPE.ScriptValue('seleukid_mission_04_palestine_task_7_absolute_total')|0]#! pops in the region of #Y [GetProvince('(int32)687').GetArea.GetRegion.GetName]#! owned by #Y [SCOPE.GetRootScope.GetCountry.GetName]#! is #Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#! or of an integrated culture. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_04_palestine_task_7_loc')]"
 seleukid_mission_04_palestine_task_7_trigger_aramaic_tt:0 "#Y Aramaic#! is an integrated culture in #Y [SCOPE.GetRootScope.GetCountry.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_04_palestine_task_7_aramaic_integration_loc')]"
 seleukid_mission_04_palestine_task_7_trigger_phoenician_tt:0 "#Y Phoenician#! is an integrated culture in #Y [SCOPE.GetRootScope.GetCountry.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_04_palestine_task_7_phoenician_integration_loc')]"
 seleukid_mission_04_palestine_task_7_trigger_hebrew_tt:0 "#Y Hebrew#! is an integrated culture in #Y [SCOPE.GetRootScope.GetCountry.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_04_palestine_task_7_hebrew_integration_loc')]"

 seleukid_mission_04_palestine_task_8:0 "Southern Administration"
 seleukid_mission_04_palestine_task_8_DESC:0 "Three cities hold the country between them: [GetProvince('(int32)659').GetName], the great emporium where the incense road from Arabia meets the sea; [GetProvince('(int32)670').GetName], which Ptolemaios renamed for himself and made his chief port on this coast; and [GetProvince('(int32)680').GetName] under Mount Gerizim, seat of the Samaritans. We should set a steady administration over the three, and the rest of the land will keep."

 seleukid_mission_04_palestine_task_9:0 "Lands of Milk and Honey"
 seleukid_mission_04_palestine_task_9_DESC:0 "The coast is ours, but the strength of the country is inland. [GetProvince('(int32)687').GetName] sits high in the Judaean hills, its temple the heart of the Jews; beyond the Jordan lie [GetProvince('(int32)733').GetName] of the Decapolis and the Moabite fastness of [GetProvince('(int32)681').GetName], which command the caravan roads up from Arabia. We should take these provinces and hold the interior as firmly as the shore."

 seleukid_mission_04_palestine_task_10:0 "The Southern Neighbors"
 seleukid_mission_04_palestine_task_10_DESC:0 "South of us the Nabataeans hold the desert and the incense road up from Arabia, and no army has ever brought them to heel: Antigonos sent Demetrios against their rock at Petra and got nothing for it but a truce. If we mean to hold [GetProvince('(int32)687').GetArea.GetRegion.GetName], we must come to terms with them, by treaty rather than by siege."
 seleukid_mission_04_palestine_task_10_integrated_trigger_tt:0 "#Y Nabatean#! is an integrated culture in #Y [SCOPE.GetRootScope.GetCountry.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_04_palestine_task_10_integration_loc')]"
 seleukid_mission_04_palestine_task_10_subject_trigger_tt:0 "A subject of #Y [SCOPE.GetRootScope.GetCountry.GetName]#! with at least #Y [SCOPE.ScriptValue('seleukid_mission_04_palestine_task_10_subject_total')|0]#! subject loyalty has a #Y Nabatean#! primary culture. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_04_palestine_task_10_loc')]"
 seleukid_mission_04_palestine_task_10_ally_trigger_tt:0 "An ally of #Y [SCOPE.GetRootScope.GetCountry.GetName]#! with at least #Y 100#! opinion of them has a #Y Nabatean#! primary culture."

 seleukid_mission_04_palestine_task_11:0 "Settling the Decapolis"
 seleukid_mission_04_palestine_task_11_DESC:0 "Though the lands of the [GetProvince('(int32)732').GetArea.GetName] are rich and fertile, we need more people that can farm them. With some settlers from the west, we might make better use of it."
 seleukid_mission_04_palestine_task_11_effect_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! will appeal to #Y [macedonian_culture.GetCultureGroup.GetName]#! Pops in #Y [GetProvince('(int32)416').GetArea.GetRegion.GetName]#!, #Y [GetProvince('(int32)379').GetArea.GetRegion.GetName]#! and #Y [GetProvince('(int32)290').GetArea.GetRegion.GetName]#! to migrate to territories in the #Y [GetProvince('(int32)732').GetArea.GetName]#!."

 seleukid_mission_04_palestine_task_12:0 "The Judean State"
 seleukid_mission_04_palestine_task_12_DESC:0 "[GetProvince('(int32)687').GetArea.GetName] is among the best land in [GetProvince('(int32)687').GetArea.GetRegion.GetName] and the least governable. Its people answer to their own law and their own priests, and every foreign administration set over them has come to grief on it."
 seleukid_mission_04_palestine_task_12_effect_tt:0 "#E #Y Judea#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Client State#!"

 seleukid_mission_04_palestine_task_13:0 "The Gates of Egypt"
 seleukid_mission_04_palestine_task_13_DESC:0 "Beyond Gaza the coast road runs down into Sinai and on to the Nile; by this road every army out of Egypt has come against Syria, and by it the Ptolemaioi will come again. We must make the southern march a wall of forts and garrisons, that the gate be shut against them."

 seleukid_mission_04_palestine_task_14:0 "The Ituraeans of the Beqaa"
 seleukid_mission_04_palestine_task_14_DESC:0 "In the valley of the Beqaa, between Lebanon and the Anti-Lebanon, dwell the Ituraeans, an Arab people of herdsmen and mountain archers who hold the fastness of Chalcis."
 seleukid_mission_04_palestine_task_14_effect_tt:0 "#E #Y Ituraea#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Client State#!"

 seleukid_mission_04_palestine_task_15:0 "The Temple of Heliopolis"
 seleukid_mission_04_palestine_task_15_DESC:0 "At Heliopolis in the Beqaa, which the Syrians call Baalbek, the City of Baal, rises a temple to the great god of the sun and sky."
 seleukid_mission_04_palestine_task_15_effect_tt:0 "#E #Y [GetProvince('(int32)763').GetName]#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Temple State#!"

 seleukid_mission_04_palestine_task_16:0 "The Temple of Gerizim"
 seleukid_mission_04_palestine_task_16_DESC:0 "Upon Mount Gerizim above Shekhem the Samaritans keep their temple, holding themselves the true Israel and rivals to Jerusalem."
 seleukid_mission_04_palestine_task_16_effect_tt:0 "#E #Y [GetProvince('(int32)680').GetName]#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Temple State#!"

 seleukid_mission_04_palestine_task_17:0 "The Idumaeans"
 seleukid_mission_04_palestine_task_17_DESC:0 "South of Judea lies Idumaea, the land of the old Edomites, a hard hill-country of herdsmen and caravan-men centred on Marisa and Adora."
 seleukid_mission_04_palestine_task_17_effect_tt:0 "#E #Y Idumaea#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Satrapy#!"

 seleukid_mission_04_palestine_task_18:0 "The Question of Jerusalem"
 seleukid_mission_04_palestine_task_18_DESC:0 "Jerusalem has no king but its god, no law but the Torah, and its high priest rules the people from the Temple."

 seleukid_mission_04_palestine_task_19:0 "The Cities of the Decapolis"
 seleukid_mission_04_palestine_task_19_DESC:0 "East of the Jordan stand old Semitic towns ripe for the founding: Gadara and Hippos above the lake, Gerasa on the Chrysorrhoas, and Dion, whose very name is that of Zeus. Settled with Hellenised colonists and given the dynastic name of our house, they will become Greek cities and hold the far bank for us."

 seleukid_mission_04_palestine_task_20:0 "Nysa-Scythopolis"
 seleukid_mission_04_palestine_task_20_DESC:0 "Where the Jordan valley meets the plain of Jezreel stands Beth-Shean, holding the road between the two. Refounded as Nysa, city of the nurses of Dionysos, and settled with Hellenised colonists, it will anchor our rule over the northern vale."

 seleukid_mission_04_palestine_task_21:0 "The Cities of the Coast"
 seleukid_mission_04_palestine_task_21_DESC:0 "Along the coast of the Paralia lie the old harbor-towns: Dora and Apollonia, the Tower of Straton, Ioppe and Iamneia, half-Greek already from their trade with the isles. Settled with Hellenised colonists and given their rights, they will hold the whole seaboard for us."

 seleukid_mission_04_palestine_task_22:0 "The Tobiads of the Ammanitis"
 seleukid_mission_04_palestine_task_22_DESC:0 "Across the Jordan in the Ammanitis, in a fortress of carved stone above their gardens, dwells the house of Tobias, lords and tax-farmers who have grown rich in the service of kings and hold the loyalty of the country round Rabbath-Ammon."
 seleukid_mission_04_palestine_task_22_effect_tt:0 "#E #Y Ammanitis#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Satrapy#!"

 seleukid_mission_04_palestine_task_23:0 "Gaza, the Seleukid Demos"
 seleukid_mission_04_palestine_task_23_DESC:0 "Gaza is the greatest emporium of the south, where the incense of Arabia comes up from the desert to be shipped across the sea. We shall settle a Greek citizen-body in the city of Marna, whom the Greeks call Zeus Marnas, and make its market our own, that the wealth of the caravans flow through Seleukid hands."

 seleukid_mission_04_palestine_task_24:0 "The Nabataeans and the Incense Road"
 seleukid_mission_04_palestine_task_24_DESC:0 "From the red rock city of the Nabataeans in the desert of Arabia, where they worship their god Dushara as an unhewn stone atop his mountain, comes the frankincense and myrrh of the south, carried by their caravans to our ports."

 seleukid_mission_04_palestine_task_25:0 "The Philistine Pentapolis"
 seleukid_mission_04_palestine_task_25_DESC:0 "The old cities of the Philistines, Ashkelon and Azotus upon the southern shore, remember the days when their five lords held the coast against all comers. Their old gods keep it still, Derceto of the sea at Ascalon and Marna at Gaza."
 seleukid_mission_04_palestine_task_25_effect_tt:0 "Release the Philistine coast as a client under a lord of the coast, or govern it directly."

 seleukid_mission_04_palestine_task_final:0 "The Southern Bulwark"
 seleukid_mission_04_palestine_task_final_DESC:0 "[GetProvince('(int32)687').GetArea.GetRegion.GetName] is held from the Syrian border down to the edge of the Egyptian desert. Whatever comes north out of Egypt must come through it first."

# ============================================================
# Modifiers & Effects
# ============================================================

 decapolis_league_modifier:0 "Decapolis"
 desc_decapolis_league_modifier:0 "A league of Greek cities beyond the Jordan, trading in common and keeping Greek law among the Semites of the country."
 nysa_vineyards_modifier:0 "Vineyards of Nysa"
 desc_nysa_vineyards_modifier:0 "The town claims Dionysos was nursed here, and its slopes give a wine and a linen worth the boast."

 gates_of_egypt_modifier:0 "The Gates of Egypt"
 heliopolis_temple_modifier:0 "Temple of Baalbek"
 gerizim_temple_modifier:0 "Temple of Mount Gerizim"
 second_temple_modifier:0 "The Second Temple"
 antiochia_jerusalem_modifier:0 "Antiocheia at Jerusalem"
 hasidim_unrest_modifier:0 "Zeal of the Pious"
 gaza_emporium_modifier:0 "Emporium of Gaza"
 seleukid_syriote_colony_tt:0 "#Y [THIS.GetProvince.GetName]#! is settled by #E Macedonian#! colonists: #Y 2#! citizens and #Y 4#! freemen. A few of its leading non-Hellenic pops, and one in each neighboring province we or our subjects hold, take up Greek ways as #E Syriote#!; in time the colony will mature into a full Greek polis."
 me_seleukid_move_pop_palestine_tt_1:0 "#Y [THIS.GetProvince.GetName]#! has received #Y [THIS.GetProvince.MakeScope.GetVariable('seleukid_pop_palestine_move_variable').GetValue|0]#! pop."
 me_seleukid_move_pop_palestine_tt_2:0 "#Y [THIS.GetProvince.GetName]#! has received #Y [THIS.GetProvince.MakeScope.GetVariable('seleukid_pop_palestine_move_variable').GetValue|0]#! pops."
 me_seleukid_move_pop_palestine_tt_3:0 "#Y [THIS.GetProvince.MakeScope.GetVariable('seleukid_pop_palestine_move_variable').GetValue|0]#! pop has left #Y [THIS.GetProvince.GetName]#!."
 me_seleukid_move_pop_palestine_tt_4:0 "#Y [THIS.GetProvince.MakeScope.GetVariable('seleukid_pop_palestine_move_variable').GetValue|0]#! pops has left #Y [THIS.GetProvince.GetName]#!."

# ============================================================
# EVENTS
# ============================================================

# Task 1 - Securing Syria
 me_seleukid_04_palestine.1.t:0 "$seleukid_mission_04_palestine_task_1$"
 me_seleukid_04_palestine.1.desc:0 "We have secured all of [GetProvince('(int32)789').GetArea.GetRegion.GetName] before we start campaigning in [GetProvince('(int32)687').GetArea.GetRegion.GetName], and the route southwards for our soldiers is safely ensured."
 me_seleukid_04_palestine.1.a:0 "It has been a long time coming."
 me_seleukid_04_palestine.1.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_1$#!' has now been #G Completed#!!"

# Task 2 - Protecting the Passes
 me_seleukid_04_palestine.2.t:0 "$seleukid_mission_04_palestine_task_2$"
 me_seleukid_04_palestine.2.desc:0 "The hill roads between [GetProvince('(int32)789').GetArea.GetRegion.GetName] and [GetProvince('(int32)687').GetArea.GetRegion.GetName] are narrow and blind, and a column strung out along them can be broken by very few men. Forts have been set along that road, and the ground works against anyone coming up it."
 me_seleukid_04_palestine.2.a:0 "Another step as we prepare our southern campaigns."
 me_seleukid_04_palestine.2.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_2$#!' has now been #G Completed#!!"

# Task 3 - The Shipbuilders of Phoenicia
 me_seleukid_04_palestine.4.t:0 "$seleukid_mission_04_palestine_task_3$"
 me_seleukid_04_palestine.4.desc:0 "The shipwrights of Phoenicia are well known far beyond the borders of their cities and provinces, as they are some of the best shipbuilders all around the Mediterranean. We were only the last in a long line of kings seeking their help, and the navy with which we can control our local shores has been built."
 me_seleukid_04_palestine.4.a:0 "Excellent."
 me_seleukid_04_palestine.4.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_3$#!' has now been #G Completed#!!"

# Task 4 - Preparing the Southern Campaign
 me_seleukid_04_palestine.5.t:0 "$seleukid_mission_04_palestine_task_4$"
 me_seleukid_04_palestine.5.desc:0 "We hold [GetProvince('(int32)789').GetArea.GetRegion.GetName] now, and the whole road south lies open before us. Beyond the Palestinian coast, and the thin strip of desert past it, sits Egypt itself, richest of all the lands Alexander left behind, and its throne has grown soft and ripe for the taking. Now we have laid our claims and readied the army for the march down the coast."
 me_seleukid_04_palestine.5.a:0 "As it should be."
 me_seleukid_04_palestine.5.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_4$#!' has now been #G Completed#!!"

# Task 5 - The Shores of Palestine
 me_seleukid_04_palestine.6.t:0 "$seleukid_mission_04_palestine_task_5$"
 me_seleukid_04_palestine.6.desc:0 "The coast from [GetProvince('(int32)747').GetName] down to [GetProvince('(int32)659').GetName] and [GetProvince('(int32)660').GetName] carries the trade of half the world: the old Phoenician cities on their harbors, and the caravan-roads running inland behind them. We have brought the whole shore under our hand, down to the edge of the Egyptian desert, and hold the roads that a fleet and an army both must use."
 me_seleukid_04_palestine.6.a:0 "A beginning, and no more than that."
 me_seleukid_04_palestine.6.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_5$#!' has now been #G Completed#!!"

# Task 6 - The Gods of Askalon
 me_seleukid_04_palestine.7.t:0 "$seleukid_mission_04_palestine_task_6$"
 me_seleukid_04_palestine.7.desc:0 "Our advisors pointed out the temple structure and shrines in [GetProvince('(int32)660').GetName], chief among them the sanctuary of the fish-goddess whom the locals call Derceto, as an area of improvement. We have improved them, and our popularity among the local populace of [GetProvince('(int32)687').GetArea.GetRegion.GetName] with them."
 me_seleukid_04_palestine.7.a:0 "[GetDeityDefinition('omen_hadad').GetName], you say?"
 me_seleukid_04_palestine.7.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_6$#!' has now been #G Completed#!!"

# Task 7 - Integrating Palestine
 me_seleukid_04_palestine.8.t:0 "$seleukid_mission_04_palestine_task_7$"
 me_seleukid_04_palestine.8.desc:0 "To truly secure the loyalty of our subjects and vassals in [GetProvince('(int32)687').GetArea.GetRegion.GetName], they had to become more accustomed to our rule, and we had to integrate them to a certain degree in our governance of their homes. That is done."
 me_seleukid_04_palestine.8.a:0 "Let us hope it stays that way."
 me_seleukid_04_palestine.8.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_7$#!' has now been #G Completed#!!"

# Task 8 - Southern Administration
 me_seleukid_04_palestine.9.t:0 "$seleukid_mission_04_palestine_task_8$"
 me_seleukid_04_palestine.9.desc:0 "Three cities hold the country between them: [GetProvince('(int32)659').GetName], the great emporium where the incense road from Arabia meets the sea; [GetProvince('(int32)670').GetName], which Ptolemaios renamed for himself and made his chief port on this coast; and [GetProvince('(int32)680').GetName] under Mount Gerizim, seat of the Samaritans. We have set a steady administration over the three, and the rest of the land will keep."
 me_seleukid_04_palestine.9.a:0 "With all our efforts in the region, it better work out well."
 me_seleukid_04_palestine.9.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_8$#!' has now been #G Completed#!!"

# Task 9 - Lands of Milk and Honey
 me_seleukid_04_palestine.10.t:0 "$seleukid_mission_04_palestine_task_9$"
 me_seleukid_04_palestine.10.desc:0 "The coast is ours, but the strength of the country is inland. [GetProvince('(int32)687').GetName] sits high in the Judaean hills, its temple the heart of the Jews; beyond the Jordan lie [GetProvince('(int32)733').GetName] of the Decapolis and the Moabite fastness of [GetProvince('(int32)681').GetName], which command the caravan roads up from Arabia. We have taken these provinces and hold the interior as firmly as the shore."
 me_seleukid_04_palestine.10.a:0 "And yet control them we must."
 me_seleukid_04_palestine.10.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_9$#!' has now been #G Completed#!!"

# Task 10 - The Southern Neighbors
 me_seleukid_04_palestine.11.t:0 "$seleukid_mission_04_palestine_task_10$"
 me_seleukid_04_palestine.11.desc:0 "South of us the Nabataeans hold the desert and the incense road up from Arabia, and no army has ever brought them to heel: Antigonos sent Demetrios against their rock at Petra and got nothing for it but a truce. To hold [GetProvince('(int32)687').GetArea.GetRegion.GetName], we had to come to terms with them, by treaty rather than by siege, and a pact between our peoples is now signed."
 me_seleukid_04_palestine.11.a:0 "They are masters of the desert, after all."
 me_seleukid_04_palestine.11.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_10$#!' has now been #G Completed#!!"

# Task 11 - Settling the Decapolis
 me_seleukid_04_palestine.13.t:0 "$seleukid_mission_04_palestine_task_11$"
 me_seleukid_04_palestine.13.desc:0 "Though the lands of the [GetProvince('(int32)732').GetArea.GetName] are rich and fertile, we needed more people that can farm them. With settlers from the west, we make better use of it now."
 me_seleukid_04_palestine.13.a:0 "They will prove invaluable to us."
 me_seleukid_04_palestine.13.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_11$#!' has now been #G Completed#!!"

# Task 12 - The Judean State
 me_seleukid_04_palestine.14.t:0 "$seleukid_mission_04_palestine_task_12$"
 me_seleukid_04_palestine.14.desc:0 "[GetProvince('(int32)687').GetArea.GetName] is among the best land in [GetProvince('(int32)687').GetArea.GetRegion.GetName] and the least governable. Its people answer to their own law and their own priests, and every foreign administration set over them has come to grief on it."
 me_seleukid_04_palestine.14.a:0 "The administration will figure it out. Probably."
 me_seleukid_04_palestine.14.b:0 "A free state, is that what they want? Let them have it, then."
 me_seleukid_04_palestine.14.b.tt:0 "#E #Y [GetProvince('(int32)687').GetArea.GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Client State#!"
 me_seleukid_04_palestine.14.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_12$#!' has now been #G Completed#!!"

# Task 13 - The Gates of Egypt
 me_seleukid_04_palestine.30.t:0 "$seleukid_mission_04_palestine_task_13$"
 me_seleukid_04_palestine.30.desc:0 "$seleukid_mission_04_palestine_task_13_DESC$"
 me_seleukid_04_palestine.30.a:0 "The gate is shut."
 me_seleukid_04_palestine.30.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_13$#!' has now been #G Completed#!!"

# Task 14 - The Ituraeans of the Beqaa
 me_seleukid_04_palestine.31.t:0 "$seleukid_mission_04_palestine_task_14$"
 me_seleukid_04_palestine.31.desc:0 "$seleukid_mission_04_palestine_task_14_DESC$"
 me_seleukid_04_palestine.31.a:0 "We will hold the valley ourselves."
 me_seleukid_04_palestine.31.b:0 "Let an Ituraean lord hold it for us."
 me_seleukid_04_palestine.31.b.tt:0 "#E #Y [GetProvince('(int32)764').GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Client State#!\n#E [ituraean_lord_scope.GetName]#! becomes the ruler of #E #Y [GetProvince('(int32)764').GetName]#!#!"
 me_seleukid_04_palestine.31.annex.tt:0 "#Y [THIS.GetProvince.GetName]#! becomes owned by #Y Ituraea#!."
 me_seleukid_04_palestine.31.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_14$#!' has now been #G Completed#!!"

# Task 15 - The Temple of Heliopolis
 me_seleukid_04_palestine.32.t:0 "$seleukid_mission_04_palestine_task_15$"
 me_seleukid_04_palestine.32.desc:0 "$seleukid_mission_04_palestine_task_15_DESC$"
 me_seleukid_04_palestine.32.a:0 "Endow the temple; the city remains ours."
 me_seleukid_04_palestine.32.b:0 "Give the god his city."
 me_seleukid_04_palestine.32.b.tt:0 "#E #Y [GetProvince('(int32)763').GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!\n#E [sohaemus_scope.GetName]#! becomes the ruler of #E #Y [GetProvince('(int32)763').GetName]#!#!"

 me_seleukid_04_palestine.32.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_15$#!' has now been #G Completed#!!"

# Task 16 - The Temple of Gerizim
 me_seleukid_04_palestine.33.t:0 "$seleukid_mission_04_palestine_task_16$"
 me_seleukid_04_palestine.33.desc:0 "$seleukid_mission_04_palestine_task_16_DESC$"
 me_seleukid_04_palestine.33.a:0 "Endow Gerizim; Samaria remains ours."
 me_seleukid_04_palestine.33.b:0 "Release Samaria to the priesthood."
 me_seleukid_04_palestine.33.b.tt:0 "#E #Y Samaria#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!\n#E [manasseh_scope.GetName]#! becomes the ruler of #E #Y Samaria#!#!"
 me_seleukid_04_palestine.33.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_16$#!' has now been #G Completed#!!"

# Task 17 - The Idumaeans
 me_seleukid_04_palestine.34.t:0 "$seleukid_mission_04_palestine_task_17$"
 me_seleukid_04_palestine.34.desc:0 "$seleukid_mission_04_palestine_task_17_DESC$"
 me_seleukid_04_palestine.34.a:0 "Hold it under a royal governor."
 me_seleukid_04_palestine.34.b:0 "Raise an Idumaean lord."
 me_seleukid_04_palestine.34.b.tt:0 "#E #Y Idumaea#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Satrapy#!\n#E [idumaean_lord_scope.GetName]#! becomes the ruler of #E #Y Idumaea#!#!"
 me_seleukid_04_palestine.34.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_17$#!' has now been #G Completed#!!"

# Task 18 - The Question of Jerusalem
 me_seleukid_04_palestine.35.t:0 "$seleukid_mission_04_palestine_task_18$"
 me_seleukid_04_palestine.35.desc:0 "$seleukid_mission_04_palestine_task_18_DESC$"
 me_seleukid_04_palestine.35.a:0 "Found Antiocheia at Jerusalem."
 me_seleukid_04_palestine.35.b:0 "Uphold the ancestral Law."
 me_seleukid_04_palestine.35.c:0 "Give the city to the High Priest."
 me_seleukid_04_palestine.35.c.tt:0 "#E #Y [GetProvince('(int32)687').GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!\n#E [onias_scope.GetName]#! becomes the ruler of #E #Y [GetProvince('(int32)687').GetName]#!#!"
 me_seleukid_04_palestine.35.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_18$#!' has now been #G Completed#!!"

# Task 19 - The Cities of the Decapolis
 me_seleukid_04_palestine.36.t:0 "$seleukid_mission_04_palestine_task_19$"
 me_seleukid_04_palestine.36.desc:0 "$seleukid_mission_04_palestine_task_19_DESC$"
 me_seleukid_04_palestine.36.a:0 "Let the Greek cities rise."
 me_seleukid_04_palestine.36.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_19$#!' has now been #G Completed#!!"

# Task 20 - Nysa-Scythopolis
 me_seleukid_04_palestine.37.t:0 "$seleukid_mission_04_palestine_task_20$"
 me_seleukid_04_palestine.37.desc:0 "$seleukid_mission_04_palestine_task_20_DESC$"
 me_seleukid_04_palestine.37.a:0 "Let Nysa rise."
 me_seleukid_04_palestine.37.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_20$#!' has now been #G Completed#!!"

# Task 21 - The Cities of the Coast
 me_seleukid_04_palestine.38.t:0 "$seleukid_mission_04_palestine_task_21$"
 me_seleukid_04_palestine.38.desc:0 "$seleukid_mission_04_palestine_task_21_DESC$"
 me_seleukid_04_palestine.38.a:0 "Let the coast be Greek."
 me_seleukid_04_palestine.38.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_21$#!' has now been #G Completed#!!"

# Task 22 - The Tobiads of the Ammanitis
 me_seleukid_04_palestine.39.t:0 "$seleukid_mission_04_palestine_task_22$"
 me_seleukid_04_palestine.39.desc:0 "$seleukid_mission_04_palestine_task_22_DESC$"
 me_seleukid_04_palestine.39.a:0 "Hold it under a royal governor."
 me_seleukid_04_palestine.39.b:0 "Raise up the house of Tobias."
 me_seleukid_04_palestine.39.b.tt:0 "#E #Y the Ammanitis#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Client State#!\n#E [hyrcanus_scope.GetName]#! becomes the ruler of #E #Y the Ammanitis#!#!"
 me_seleukid_04_palestine.39.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_22$#!' has now been #G Completed#!!"

# Task 23 - Gaza, the Seleucid Demos
 me_seleukid_04_palestine.40.t:0 "$seleukid_mission_04_palestine_task_23$"
 me_seleukid_04_palestine.40.desc:0 "$seleukid_mission_04_palestine_task_23_DESC$"
 me_seleukid_04_palestine.40.a:0 "Let the caravans come."
 me_seleukid_04_palestine.40.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_23$#!' has now been #G Completed#!!"

# Task 24 - The Nabataeans and the Incense Road
 me_seleukid_04_palestine.41.t:0 "$seleukid_mission_04_palestine_task_24$"
 me_seleukid_04_palestine.41.desc:0 "$seleukid_mission_04_palestine_task_24_DESC$"
 me_seleukid_04_palestine.41.a:0 "Take the incense road."
 me_seleukid_04_palestine.41.b:0 "[nabataean_king_scope.GetName] will rule Nabataea well."
 me_seleukid_04_palestine.41.b.tt:0 "#E #Y Nabataea#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Tributary#!\n#E [nabataean_king_scope.GetName]#! becomes the ruler of #E #Y Nabataea#!#!"
 me_seleukid_04_palestine.41.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_24$#!' has now been #G Completed#!!"

# Task 25 - The Philistine Pentapolis
 me_seleukid_04_palestine.42.t:0 "$seleukid_mission_04_palestine_task_25$"
 me_seleukid_04_palestine.42.desc:0 "$seleukid_mission_04_palestine_task_25_DESC$"
 me_seleukid_04_palestine.42.a:0 "We shall govern the coast directly."
 me_seleukid_04_palestine.42.b:0 "Raise a lord of the coast."
 me_seleukid_04_palestine.42.b.tt:0 "#E #Y the Philistine coast#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Client State#!\n#E [philistine_lord_scope.GetName]#! becomes the ruler of #E #Y the Philistine coast#!#!"
 me_seleukid_04_palestine.42.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_25$#!' has now been #G Completed#!!"

# Task Final - The Southern Bulwark
 me_seleukid_04_palestine.15.t:0 "$seleukid_mission_04_palestine_task_final$"
 me_seleukid_04_palestine.15.desc:0 "[GetProvince('(int32)687').GetArea.GetRegion.GetName] is held from the Syrian border down to the edge of the Egyptian desert. Whatever comes north out of Egypt must come through us first."
 me_seleukid_04_palestine.15.a:0 "We will start a new campaign in due time."
 me_seleukid_04_palestine.15.complete.tt:0 "The mission task '#Y $seleukid_mission_04_palestine_task_final$#!' has now been #G Completed#!!"

 me_seleukid_04_palestine.3.t:0 "A Navy From Phoenicia"
 me_seleukid_04_palestine.3.desc:0 "We have been in correspondence with the magistrates of the Phoenician cities about a fleet built in their yards. The timber, the silver and the terms are all in hand at last, and a messenger has gone down the coast with them."
 me_seleukid_04_palestine.3.a:0 "They are the best shipwrights in the known world, after all."

 me_seleukid_04_palestine.12.t:0 "The Greek Settlers"
 me_seleukid_04_palestine.12.desc:0 "We are preparing messengers to appeal to the people of [GetProvince('(int32)416').GetArea.GetRegion.GetName], [GetProvince('(int32)379').GetArea.GetRegion.GetName], and [GetProvince('(int32)290').GetArea.GetRegion.GetName] to come settle down in [GetProvince('(int32)732').GetArea.GetName]. With an influx of new settlers in the province, we will be able to start making use of its rich fertile lands more efficiently than what the current local population can."
 me_seleukid_04_palestine.12.a:0 "Let us see how many take the offer."

 me_seleukid_04_palestine.16.t:0 "$seleukid_mission_04_palestine$"
 me_seleukid_04_palestine.16.desc:0 "[GetProvince('(int32)687').GetArea.GetRegion.GetName] and [GetProvince('(int32)789').GetArea.GetRegion.GetName] are held entire, and the marches toward [GetProvince('(int32)516').GetArea.GetRegion.GetName] and [GetProvince('(int32)1883').GetArea.GetRegion.GetName] are closed behind us. The Phoenician yards and the ports along the coast are ours to command, and with them we can reach the parts of the empire of [GetCharacter('(int32)39').GetPraenomen] that our armies alone could never hold."
 me_seleukid_04_palestine.16.a:0 "A real success, after all."
 me_seleukid_04_palestine.16.complete.tt:0 "The mission '#Y $seleukid_mission_04_palestine$#!' has now been #G Completed#!!"

 me_seleukid_04_palestine.18.t:0 "The Trek to Decapolis"
 me_seleukid_04_palestine.18.desc:0 "Word went round our cities that land and the rights of citizens were to be had in [GetProvince('(int32)732').GetArea.GetName], and enough men believed it to fill a colony. They have gone east to take it up."
 me_seleukid_04_palestine.18.a:0 "Sell whatever the traitors left behind."

################################################################
# 05 ASSYRIA
################################################################

 seleukid_mission_05_assyria_armenia:0 "From Ashur to Ararat"
 seleukid_mission_05_assyria_armenia_DESCRIPTION:0 "To the north of Babylonia lies Assyria, the old land of Ashur, and beyond it the Armenian highlands climbing toward the Caucasus. These once answered to [GetCharacter('(int32)24').GetPraenomen], but the long wars loosened Macedonian hold, and the satraps and princes up there have grown used to ruling as they please.\n\nNo longer! It is hard country, yet it guards our northern frontier, and the time has come to bring these recalcitrant dynasts to heel before they drift any further."
 seleukid_mission_05_assyria_armenia_CRITERIA_DESCRIPTION:0 "This mission is complete once we exercise control over the region of Assyria and most of the Armenian highland."
 seleukid_mission_05_assyria_armenia_BUTTON_TOOLTIP:0 "Extend Seleukid rule from Assyria up into the Armenian highlands."
 seleukid_mission_05_assyria_armenia_BUTTON_DETAILS: ""

# ============================================================
# Missions
# ============================================================

 seleukid_mission_05_assyria_armenia_task_1:0 "A Grand Northern Campaign"
 seleukid_mission_05_assyria_armenia_task_1_DESC:0 "When Alexander's officers divided the empire at Triparadeisos, Assyria and Arbelitis were reckoned commands in their own right, Mesopotamia was given to Amphimachos, and the Orontid in Armenia paid heed to whoever held Babylon. [GetCharacter('(int32)37').GetPraenomen] afterward set a man named Blitor over Mesopotamia and then broke him for letting [GetCharacter('(int32)24').GetPraenomen] slip through his country into Egypt, and folded the whole of it into Babylonia under a single command, so the north and our heartland were governed as one. When Babylon was taken back the north came with it, for no one has ever held the one without the other for long. The long wars in the west then drew our armies off, the tribute stopped coming, and the north learned to do without us. Heralds can go ahead of the columns to remind these lands whose they were, but heralds do not feed a host, and the treasury must be opened for the muster before a man steps off."
 seleukid_mission_05_assyria_task_1_effect_tt:0 "Gain claims on every province of #E Assyria#! and #E Armenia#!."

 seleukid_mission_05_assyria_armenia_task_2:0 "The District of Chalonitis"
 seleukid_mission_05_assyria_armenia_task_2_DESC:0 "Chalonitis lies where Babylonia gives out and the hills begin. The road from Seleukeia passes Apolloniatis and the Greek city of Artemita, then crosses this district by its five villages and its posting station, and a few schoeni beyond them Zagros rises and Media starts. It is a gate, and at present we keep a gate with villages. Kelonai must be walled, given the buildings a city requires, and settled with Greek speakers under the name Chala, so that the road on to Adiabene begins in our hands and not in another's."

 seleukid_mission_05_assyria_armenia_task_3:0 "The Field of Gaugamela"
 seleukid_mission_05_assyria_armenia_task_3_DESC:0 "Adiabene is the country between the two Zab rivers, which the Greeks call the Lycus and the Caprus, and its heart is Arbela with its citadel and its oracle of Ishtar. Out on the plain lies a village the Persians named the Camel's House, Gaugamela, an estate set aside by Dareios son of Hystaspes to keep the beast that had carried his baggage into Scythia. There [GetCharacter('(int32)39').GetPraenomen] broke the last army of the Great King, though the histories still name the day after Arbela, some six hundred stades distant. The whole district must be ours and settled quiet, with a city standing at Gaugamela, before we can mark that field, fortify the country, and plant a colony of our own beside Arbela."

 seleukid_mission_05_assyria_armenia_task_4:0 "Apameia Archidos"
 seleukid_mission_05_assyria_armenia_task_4_DESC:0 "East of the Tigris lies Apolloniatis, the district the Persians governed as Sittakene, a country of canals and date-groves that our surveyors have renamed for Apollo, from whom our house counts its descent. Greeks are thin on the ground here: Artemita on the Sillas is the only town of any size, and the villages between it and the river are Babylonian still, working their allotments as they did under Dareios. At our own cost we can bring settlers down out of Syria and raise the old town anew as Apameia Archidos, for Apama, daughter of Spitamenes, whom Seleukos married at Sousa. A city of our planting on this bank holds the road between Babylonia and Media in our hands."

 seleukid_mission_05_assyria_armenia_task_5:0 "The House of Ashur"
 seleukid_mission_05_assyria_armenia_task_5_DESC:0 "Assur upon the Tigris, ancient seat of Ashur the city-god from whom the Assyrians and their whole land take their name, has stood broken since the Medes came down and threw its walls into the river. Its priests never left. They keep the offerings among the ruins, and they can still read out the inscriptions of kings who never called the city their property, but styled themselves only the god's steward in it."
 seleukid_mission_05_assyria_task_5_effect_tt:0 "#E #Y Assur#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Temple State#!"

 seleukid_mission_05_assyria_armenia_task_6:0 "Sennacherib's Palace"
 seleukid_mission_05_assyria_armenia_task_6_DESC:0 "At Nineveh stand the ruins of the house that Sennacherib called the Palace Without Rival, eighty rooms and more above the Tigris, its gates held by winged bulls of thirty tons that were dragged whole from quarries a day's march away. It has been open to the weather since the Medes and the Babylonians burned the city, and when the Ten Thousand marched beneath that wall on their way out of Persia they took the ruin for a town of the Medes and never learned whose it had been. Nineveh has its forum and its works already, so this asks nothing of our treasury and only the labor of the city: to clear the halls and set the colossi upright at the gates. The great men of Assyria would take it well that a [ROOT.GetCountry.GetAdjective] king restores the house of their kings rather than quarrying it for stone."

 seleukid_mission_05_assyria_armenia_task_7:0 "Refound Nisibis"
 seleukid_mission_05_assyria_armenia_task_7_DESC:0 "Nisibis stands on the Mygdonios beneath Mount Masios, on the road that runs from the Tigris crossings west to Zeugma and the Euphrates. The Macedonian settlers of the plain named the whole district Mygdonia, after the Mygdonia they left behind between the Axios and the Strymon, and they already call the town Antiocheia in Mygdonia. Whoever holds it holds the northern road, and an army coming down out of Armenia must pass beneath its walls. Let the place be built out to a proper city and refounded under that name, with Syriote colonists enrolled in it."

 seleukid_mission_05_assyria_armenia_task_8:0 "Among the Karduchoi"
 seleukid_mission_05_assyria_armenia_task_8_DESC:0 "Above the Tigris rise the hills of Corduene, whose people Xenophon's Greeks knew as the Karduchoi and fought through for seven days without buying a day's peace. They answer to no king, only to their own headmen in the high valleys, and their archers will serve whoever holds the passes down into Armenia. Their towns, Pinaka and Sareisa, are hill forts rather than cities, and no Greek has yet settled among them."

 seleukid_mission_05_assyria_armenia_task_9:0 "Edessa in the East"
 seleukid_mission_05_assyria_armenia_task_9_DESC:0 "The ground at Adma is fed by a spring so abundant that the Greeks who first saw it called it Kallirhoe, the fair-flowing, and its pools do not fail in summer. The Aramaeans of the place know it as Orhai. We shall give it the name of Edessa, after the old royal seat in Macedon that stands likewise upon its waters, and plant Macedonian nobles and settlers in it as a colony of the first rank. It sits at the head of the Balikh, on the road that runs from the Euphrates crossings east to Nisibis, and a satrapy of Assyria that is to be governed at all must be governed from there. Let the state be quiet and the city built out, and the seat of Assyria shall be moved within its walls."

 seleukid_mission_05_assyria_armenia_task_10:0 "Refound Tella"
 seleukid_mission_05_assyria_armenia_task_10_DESC:0 "East of Edessa, on the road to Nisibis, stands the town the Aramaeans call Tella, the mound, where the sown ground gives out and the steppe begins. The Greeks name that steppe Arabia, for the tent-dwelling Arabs who pasture it and answer to no satrap, and a walled town on the mound would give the caravans and the garrisons a fixed stage between the two cities. Refounded, it shall be Antiocheia Arabiki, Antioch in Arabia, taking its name from the country it watches rather than from any river. Let the state be quiet and the town built out, and we shall settle Syriote colonists in it."

 seleukid_mission_05_assyria_armenia_task_11:0 "Colonies in Commagene"
 seleukid_mission_05_assyria_armenia_task_11_DESC:0 "Where the Euphrates runs shallow enough to bridge, Seleukos Nikator set twin towns on either bank, Seleukeia on the near shore and Apameia opposite it, named for his wife. The pontoon strung between them gave the place its name, Zeugma, the yoking, and every army and caravan bound east from Antioch must pass it. Upstream at Samosata the Orontid Samos raised his seat on the old Kummuh mound, and whoever holds the two holds the river road entire. At our own cost we may settle Macedonians in both, so that Samosata rises as Antiocheia Kommaginis and the crossing as Seleukeia Zeugmatos."

 seleukid_mission_05_assyria_armenia_task_12:0 "King of Sophene"
 seleukid_mission_05_assyria_armenia_task_12_DESC:0 "Sophene holds the upper Euphrates and the road into Armenia, and the old Orontid house has kept it since before Macedonians first marched east. Binding the Sophenian Orontids to our house with a royal marriage would ensure the Euphrates remains in friendly hands and secures [GetCountry('SPH').GetRuler.GetPraenomen] a quiet reign."
 seleukid_mission_05_assyria_task_12_effect_tt:0 "[GetCountry('SPH').GetRuler.GetTitle] [GetCountry('SPH').GetRuler.GetPraenomen] of #E #Y Sophene#!#! will be offered a royal marriage with the Seleukid House.\nThe following occurs if [GetCountry('SPH').GetRuler.GetPraenomen] #G #E accepts#! the offer:#!"

 seleukid_mission_05_assyria_armenia_task_13:0 "Greater Armenia"
 seleukid_mission_05_assyria_armenia_task_13_DESC:0 "Greater Armenia is the highland north, held since the Great King's day by Orontid satraps who send down horses and silver when it suits them and forget the road when it does not. Courtiers in [ROOT.GetCountry.GetCapital.GetName] propose we seal the tie with a marriage, a princess of our house given to him as his queen."
 seleukid_mission_05_assyria_task_13_satrapy_tt:0 "#E #Y Armenia#!#! becomes a [ROOT.GetCountry.GetAdjective] #E Satrapy#!"
 seleukid_mission_05_assyria_task_13_wedding_tt:0 "The ruler of #E #Y Armenia#!#! can wed a [ROOT.GetCountry.GetAdjective] princess"

 seleukid_mission_05_assyria_armenia_task_14:0 "Lesser Armenia"
 seleukid_mission_05_assyria_armenia_task_14_DESC:0 "West of the Euphrates lies Lesser Armenia, an upland of pasture and river gorges running toward Cappadocia. It has always had princes of its own, sometimes in league with the kings across the river and sometimes not, and their reach runs down over the Chaldaioi and the Tibarenoi as far as Trapezous. Its old center is Ani above the western Euphrates, where the Armenians keep the sanctuary of Aramazd, the chief of their gods, and lay their dead kings. We have an Orontid of our own in Mithradates. He could be raised up over the country and rule it in our name."
 seleukid_mission_05_assyria_task_14_effect_tt:0 "#E #Y Lesser Armenia#!#! is be released as a [ROOT.GetCountry.GetAdjective] #E Satrapy#!"

 seleukid_mission_05_assyria_armenia_task_15:0 "Autonomous Arbelitis"
 seleukid_mission_05_assyria_armenia_task_15_DESC:0 "When the empire was divided, Arbelitis was reckoned a satrapy in its own right, though it was tied to Mesopotamia under Amphimachos, and it has never sat easily under a governor sent up from Seleukeia. The country keeps its own name, Hadyab, which we say as Adiabene, and buries its great men in the rock below Arbela. Ground like this is better held by a man who lives on it than by our clerks. Left to itself, Arbela stays Hadyab; pressed hard enough, its court will come to sound like Antioch."
 seleukid_mission_05_assyria_task_15_effect_tt:0 "#E #Y Arbelitis#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Satrapy#!"

 seleukid_mission_05_assyria_armenia_task_16:0 "Osroene and Edessa"
 seleukid_mission_05_assyria_armenia_task_16_DESC:0 "Osroene takes its name from Orhai, which is Edessa, and the country around it is not Greek. The Arab clans who pasture between the Euphrates and the Balikh keep their own chiefs whose names carry more weight than any officer we could send out from [ROOT.GetCountry.GetCapital.GetName]. Our governors almost spend more in holding it than the region returns to us."
 seleukid_mission_05_assyria_task_16_effect_tt:0 "#E #Y Osroene#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Satrapy#!"

 seleukid_mission_05_assyria_armenia_task_17:0 "Command of Commagene"
 seleukid_mission_05_assyria_armenia_task_17_DESC:0 "The Orontids have counted the Kummuh mound and the Euphrates crossing among their own holdings for as nearly as long as clerks have kept records. That is more of the river road than one highland house ought to hold. We have an Orontid of our own in Ptolemaios, of the same stock and the same gods, who honors Mithra and the Baal of the hill at Doliche as they do, and whose loyalty has never been in question. Perhaps the time has come to cut Commagene out of Sophene and set Ptolemaios over the country as our eparch."
 seleukid_mission_05_assyria_task_17_effect_tt:0 "#E #Y Commagene#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Satrapy#!"

 seleukid_mission_05_assyria_armenia_task_18:0 "Colchian Coast"
 seleukid_mission_05_assyria_armenia_task_18_DESC:0 "Colchis is the Euxine coast beyond the mountains, where the Phasis comes down to the sea past the Milesian foundations at Phasis and Dioskourias. It sends out linen and hemp, pitch and shipbuilding timber floated down its rivers, and gold still washed from the mountain torrents in fleecy skins. Its king is no autocrat: the land is parceled among skeptouchoi, the sceptre-holders of the local houses, and even the Persians never made a true satrapy of it, taking instead a gift of boys and girls every fifth year."
 seleukid_mission_05_assyria_task_18_effect_tt:0 "#E #Y Colchis#!#! may become a [ROOT.GetCountry.GetAdjective] #E Subject#!"

 seleukid_mission_05_assyria_armenia_task_19:0 "The Iberian Gates"
 seleukid_mission_05_assyria_armenia_task_19_DESC:0 "Iberia is the highland kingdom east of Colchis, seated at Mtskheta where the Kyros and the Aragos meet beneath the rock forts of Harmozike and Seusamora. It is a country held by its gates: the wagon road up from Colchis through the Phasis narrows, and northward the way out to the Sarmatian nomads, three days of climbing and then four days of footpath in single file, shut at the end by a wall. A king who keeps those gates for us shuts the northern road against the nomads and opens it to no one else, which is worth more to us than the tribute of the place. That is farther north than our business properly runs, but our reach is long enough. Let his heirs answer as tributaries or as a satrapy, or refuse and give us the right to their highlands."
 seleukid_mission_05_assyria_task_19_effect_tt:0 "#E #Y Iberia#!#! may become a [ROOT.GetCountry.GetAdjective] #E Subject#!"

 seleukid_mission_05_assyria_armenia_task_final:0 "From Ashur to Ararat"
 seleukid_mission_05_assyria_armenia_task_final_DESC:0 "From the plain of Ashur to the heights of Ararat, the northern march answers again to [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName]. Assyria is held from Edessa down to Arbela, and the Armenian highland is in our hands or in the hands of men who hold it for us. A conquest is not yet a satrapy: governors must be seated where the kings of Assyria sat, and the highland kept quiet long enough to pay for its own garrisons. Let the last of it be done."
 seleukid_mission_05_assyria_task_final_armenia_tt:0 "We or our subjects hold most of the Armenian highland. (#Y [SCOPE.ScriptValue('sel_assyria_armenia_control_svalue')|0]#!/40)"

 seleukid_mission_05_assyria_armenia_finish_tt:0 "#G Completing this task finishes#! #E #T From Ashur to Ararat#!#!."
 seleukid_mission_05_assyria_armenia_finish_upper_satrapies_unlock_tt:0 "#G Completing this task finishes#! #E #T From Ashur to Ararat#!#! and #G unlocks#! a new mission tree: #E #T Hellenistic Empire#!#!."

