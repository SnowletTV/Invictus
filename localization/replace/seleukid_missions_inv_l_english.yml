 syrian_tetrapolis_modifier:0 "Part of the Syrian Tetrapolis"
 desc_syrian_tetrapolis_modifier:0 "This city is part of the Syrian Tetrapolis, a wealthy group of cities that form the heartland of Seleukid Syria."

 seleukid_syrian_expansion_modifier:0 "Syrian Campaign"
 desc_seleukid_syrian_expansion_modifier:0 "The whole realm bends to the war for Syria: the muster comes in quick, the worn regiments fill again, and the roads to the front run open."
 thessalian_horse_modifier:0 "Thessalian Squadrons"
 desc_thessalian_horse_modifier:0 "Squadrons of settled Thessalian cavalry, kept in studs and readiness against the day of muster."
 kyrrhos_katoikia_modifier:0 "Katoikia of Kyrrhos"
 desc_kyrrhos_katoikia_modifier:0 "A military colony of Macedonians named for Kyrrhos in the homeland, mustering settler-troops of its own."

