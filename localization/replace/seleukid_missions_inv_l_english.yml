 seleukid_big_hellenizing_colony_tt:0 "#Y [THIS.GetProvince.GetName]#! is settled by #E Macedonian#! colonists: #Y 2#! nobles, #Y 2#! citizens and #Y 6#! freemen. Several of its leading non-Hellenic pops, and one in each neighboring province we or our subjects hold, take up Greek ways as #E Greco-Persian#!; in time the colony will mature into a full Greek polis."
 seleukid_colony_hellenise_tt:0 "Every pop of the province following the #E Roman pantheon#! and not of #E Hellenic#! culture becomes #E Greco-Persian#!, along with the most prominent of its other non-Hellenic pops and a few in the lands around."
 seleukid_colony.2.t:0 "A Polis Comes of Age"
 seleukid_colony.2.desc:0 "The colony we planted at #Y [scope:polis_province.GetProvince.GetName]#! has grown into a thriving Greek polis. Its council meets and its gymnasium fills, and the old families of the country round about have taken Greek names and Greek habits, reckoning themselves #E Greco-Persian#! now."
 seleukid_colony.2.a:0 "The East grows Greek."
 seleukid_colony_syriotise_tt:0 "Every pop of the province following the #E Roman pantheon#! and not of #E Hellenic#! culture becomes #E Syriote#!, along with the most prominent of its other non-Hellenic pops and a few in the lands around."
 seleukid_colony.12.desc:0 "The colony we planted at #Y [scope:polis_province.GetProvince.GetName]#! has grown into a thriving Greek polis. Its council meets and its gymnasium fills, and the old families of the country round about have taken Greek names and Greek habits, reckoning themselves #E Syriote#! now."
 seleukid_colony.12.a:0 "Syria grows Greek."

