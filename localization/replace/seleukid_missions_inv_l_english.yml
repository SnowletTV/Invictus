# Task 1 - Syrian Dreams
 me_seleukid_02_syria.1.t:0 "$seleukid_mission_02_syria_task_1$ - Planning a War"
 me_seleukid_02_syria.1.desc:0 "At the inception of our nation, we were a small satrapy focused around Babylonia, shut off from the Mediterranean and many of our rivals and allies. We have since learned the importance of a western port, and settlers from Greece itself.\n\nWe have set our eyes on the region around Syria, oft forgotten by greater powers who looks to the richer regions of Alexander's old empire."
 me_seleukid_02_syria.1.a:0 "Let the muster begin."

 me_seleukid_02_syria.2.t:0 "$seleukid_mission_02_syria_task_1$ - The War Campaign"
 me_seleukid_02_syria.2.desc:0 "We have prepared our troops for a campaign towards [GetProvince('(int32)789').GetArea.GetRegion.GetName], as we know just how dangerous the trek towards that area can be if we start unprepared."
 me_seleukid_02_syria.2.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_1$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.2.a:0 "All of it will be ours in due time."

# Task 2 - Home of the Antigonids
 me_seleukid_02_syria.3.t:0 "$seleukid_mission_02_syria_task_2$"
 me_seleukid_02_syria.3.desc:0 "Greek settlements and villages, and the old Antigonid capital, lie on the western shores. One of our first goals was to take control of the lower parts of the Orontes river, and it is done."
 me_seleukid_02_syria.3.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_2$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.3.a:0 "In time they will get accustomed to our rule."

# Task 3 - By the Amanos Mountains
 me_seleukid_02_syria.4.t:0 "$seleukid_mission_02_syria_task_3$"
 me_seleukid_02_syria.4.desc:0 "On the eastern side of [GetProvince('(int32)789').GetArea.GetRegion.GetName] lie ancient Aramaic cities and villages, with the occasional new Greek settlement among them, and all of it is ours. That country stood between us and the richer Antigonid lands, and the road from Babylonia to the sea runs through it."
 me_seleukid_02_syria.4.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_3$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.4.a:0 "And both sides will need to be dealt with in their own way."

# Task 4 - Syrian Governance
 me_seleukid_02_syria.5.t:0 "$seleukid_mission_02_syria_task_4$"
 me_seleukid_02_syria.5.desc:0 "New cities are worth only as much of the country as they hold down. [GetProvince('(int32)789').GetArea.GetRegion.GetName] has been settled, the villages and farmland tied to the colonies, and the region is governed through them."
 me_seleukid_02_syria.5.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_4$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.5.a:0 "But that is all in due time."

# Task 5 - Antioch on the Orontes
 me_seleukid_02_syria.45.t:0 "$seleukid_mission_02_syria_task_5$"
 me_seleukid_02_syria.45.desc:0 "Where the Orontes bends toward the sea, Antigonos raised his city of Antigoneia and meant it for the capital of Asia. That dream died with him at Ipsos. Upon the same well-watered plain, beneath Mount Silpius, we have raised a greater city and named it Antioch after Antiochos our father; it is the seat and glory of our house. With her rise the sisters of the Tetrapolis, Seleukeia, Laodikeia, and Apameia."
 me_seleukid_02_syria.45.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_5$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.45.a:0 "Let the Tetrapolis rise."

# Task 6 - A Mediterranean Capital
 me_seleukid_02_syria.46.t:0 "$seleukid_mission_02_syria_task_6$"
 me_seleukid_02_syria.46.desc:0 "Seleukeia on the Tigris has served as our eastern seat, but the heart of the realm now lies in the west, upon the shores of the Middle Sea. Antioch, grown great upon the Orontes, is fit to be the capital of a great kingdom."
 me_seleukid_02_syria.46.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_6$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.46.a:0 "I'd quite like to move to Antioch."
 me_seleukid_02_syria.46.b:0 "Move? In this economy?"
 me_seleukid_02_syria.46.c:0 "Antioch is already our capital."

# Task 7 - Ensuring Control
 me_seleukid_02_syria.10.t:0 "$seleukid_mission_02_syria_task_7$"
 me_seleukid_02_syria.10.desc:0 "A country is held by its edges. To the west the passes of the Amanus let armies down onto our plain, and to the east [GetProvince('(int32)810').GetName] carries the road across the Euphrates into our heartland. We have raised a network of forts and walled settlements along these approaches, and any invader who comes at [GetProvince('(int32)789').GetArea.GetRegion.GetName] now struggles to find safe passage through it."
 me_seleukid_02_syria.10.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_7$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.10.a:0 "One stone at a time."

# Task 8 - Greek Settlers
 me_seleukid_02_syria.8.t:0 "$seleukid_mission_02_syria_task_8$ - The Offer"
 me_seleukid_02_syria.8.desc:0 "Emissaries have gone to [GetProvince('(int32)416').GetArea.GetRegion.GetName], [GetProvince('(int32)379').GetArea.GetRegion.GetName] and [GetProvince('(int32)290').GetArea.GetRegion.GetName], where men have been sailing off to found colonies for three hundred years. The offer is land in [GetProvince('(int32)789').GetArea.GetRegion.GetName] and a place in the levy for any who will take it."
 me_seleukid_02_syria.8.a:0 "Every one of them will be well taken care of and appreciated."

 me_seleukid_02_syria.9.t:0 "$seleukid_mission_02_syria_task_8$"
 me_seleukid_02_syria.9.desc:0 "[GetProvince('(int32)789').GetArea.GetRegion.GetName] had cities enough drawn on the map and too few men in them. Greeks will cross for land, and with a Mediterranean port in our hands they have come by sea rather than the long way overland."
 me_seleukid_02_syria.9.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_8$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.9.a:0 "The settlers are invaluable."

# Task 9 - Through the Syrian Gates
 me_seleukid_02_syria.11.t:0 "$seleukid_mission_02_syria_task_9$"
 me_seleukid_02_syria.11.desc:0 "The road from Syria into Cilicia climbs the Amanus by the Syrian Gates and comes down to the Gulf of Issus, where Alexander broke the Persian king. We have carried our power west and taken that corridor: [GetProvince('(int32)795').GetName] under the mountain, [GetProvince('(int32)1879').GetName] on the gulf, and the gate-towns of [GetProvince('(int32)1873').GetName] and [GetProvince('(int32)1874').GetName] behind them."
 me_seleukid_02_syria.11.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_9$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.11.a:0 "They are the backbone our armies need."

# Task 10 - The Lands of Mopsus
 me_seleukid_02_syria.12.t:0 "$seleukid_mission_02_syria_task_10$"
 me_seleukid_02_syria.12.desc:0 "[GetProvince('(int32)1880').GetName], on the Pyramos, was the town the seer Mopsus is said to have raised when he came into Cilicia after the fall of Troy. We have refounded it as a city of our house, Seleukeia on the Pyramos, to hold the eastern stretches of the [GetProvince('(int32)1880').GetArea.GetName] and the road down from the gates."
 me_seleukid_02_syria.12.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_10$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.12.a:0 "And it is only fair we get to name it then."

# Task 11 - The Oracle of Mallos
 me_seleukid_02_syria.13.t:0 "$seleukid_mission_02_syria_task_11$"
 me_seleukid_02_syria.13.desc:0 "We have heard tales of an ancient oracle in the country around [GetProvince('(int32)1881').GetName], long since fallen into poverty. The temples and holy sites there have been restored, and the oracle may yet be brought to speak for us."
 me_seleukid_02_syria.13.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_11$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.13.a:0 "We hope we will receive some of these good news soon then."

 me_seleukid_02_syria.18.t:0 "$seleukid_mission_02_syria_task_11$"
 me_seleukid_02_syria.18.desc:0 "We receive news from the oracle of Mallos, as an emissary is rushed into our halls. It has been quite some time since last we heard from the oracle, so everyone is waiting excitedly, as the messenger starts reiterating the message.\n\n"
 me_seleukid_02_syria.18.desc.1:0 "$me_seleukid_02_syria.18.desc$ Apparently the oracle has seen good tidings for [ROOT.GetCountry.GetCapital.GetName]., [ROOT.GetCountry.GetCapital.GetName] in [ROOT.GetCountry.GetCapital.GetArea.GetName], as the whole area will flourish and grow prosperously moving forward."
 me_seleukid_02_syria.18.desc.2:0 "$me_seleukid_02_syria.18.desc$ Apparently the oracle has seen a large influx of new soldiers from [ROOT.GetCountry.GetCapital.GetName]., [ROOT.GetCountry.GetCapital.GetName] in [ROOT.GetCountry.GetCapital.GetArea.GetName], as the people in the area will be inspired by our leader and [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName]."
 me_seleukid_02_syria.18.desc.3:0 "$me_seleukid_02_syria.18.desc$ Apparently the oracle has seen good tidings for [ROOT.GetCountry.GetCapital.GetName]., [ROOT.GetCountry.GetCapital.GetName] in [ROOT.GetCountry.GetCapital.GetArea.GetName], as the local populace will flourish and stay loyal to our leadership in the foreseeable future."
 me_seleukid_02_syria.18.desc.4:0 "$me_seleukid_02_syria.18.desc$ Apparently the oracle has seen good tidings for our nation, as it will flourish and grow prosperously moving forward."
 me_seleukid_02_syria.18.desc.5:0 "$me_seleukid_02_syria.18.desc$ Apparently the oracle has seen good tidings for our nation, as the oracle has seen our people flock to our banners, providing troops and levies for the foreseeable future."
 me_seleukid_02_syria.18.desc.6:0 "$me_seleukid_02_syria.18.desc$ Apparently the oracle has seen good tidings for our nation, as our populace will flourish and flock around our leadership in the foreseeable future."
 me_seleukid_02_syria.18.a:0 "Flourishing, you say?"
 me_seleukid_02_syria.18.b:0 "Maybe it is the time to strike, then."
 me_seleukid_02_syria.18.c:0 "Good tidings for us all, then."
 me_seleukid_02_syria.18.d:0 "$me_seleukid_02_syria.18.a$."
 me_seleukid_02_syria.18.e:0 "$me_seleukid_02_syria.18.b$"
 me_seleukid_02_syria.18.f:0 "$me_seleukid_02_syria.18.c$"

# Task 12 - The Temple of Atargatis
 me_seleukid_02_syria.30.t:0 "The Syrian Goddess"
 me_seleukid_02_syria.30.desc:0 "At Bambyce, which the Syrians call Manbog, stands the great sanctuary of Atargatis, the Syrian Goddess, and her consort Hadad. Her sacred fish fill the temple pools, and her eunuch priests, heirs to the line of Abd-Hadad, have ruled the holy city since the days of the Persians. Pilgrims come to her from across Syria."
 me_seleukid_02_syria.30.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_12$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.30.a:0 "Endow the temple."
 me_seleukid_02_syria.30.b:0 "Restore the priestly temple state."
 me_seleukid_02_syria.30.b.tt:0 "#E #Y Hieropolis-Bambyce#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!\n#E [abd_hadad_scope.GetName]#! becomes the ruler of #E #Y [GetProvince('(int32)807').GetName]#!#!"
 me_seleukid_02_syria.30.c:0 "Refound it as the polis of Hieropolis."
 me_seleukid_02_syria.30.c.tt:0 "#E #Y Hieropolis#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Feudatory#!"

# Task 13 - The Priests of Olba
 me_seleukid_02_syria.31.t:0 "Zeus Olbios"
 me_seleukid_02_syria.31.desc:0 "In the rough highlands of Cilicia the temple of Zeus Olbios is served by priest-kings who trace their line to Teucer of Salamis and bear in turn the names Teukros and Aias. From their tower-crowned sanctuary they hold the loyalty of the wild Cilicians."
 me_seleukid_02_syria.31.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_13$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.31.a:0 "Endow the sanctuary."
 me_seleukid_02_syria.31.b:0 "Empower the Teucrid priest-dynasty."
 me_seleukid_02_syria.31.b.tt:0 "#E #Y [GetProvince('(int32)1894').GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!\n#E [teukros_scope.GetName]#! becomes the ruler of #E #Y [GetProvince('(int32)1894').GetName]#!#!"

# Task 14 - The Treasury at Kyinda
 me_seleukid_02_syria.32.t:0 "The Treasury of Asia"
 me_seleukid_02_syria.32.desc:0 "The fortress of Kyinda in the Cilician hills served the kings before us as a stronghold for their bullion; here Eumenes and the Silver Shields once drew upon the royal treasure of Asia. Secured and garrisoned anew, it serves as the western treasury of our realm."
 me_seleukid_02_syria.32.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_14$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.32.a:0 "Fill the vaults."

# Task 15 - An Ituraean in Arca
 me_seleukid_02_syria.33.t:0 "The House of Soaimus"
 me_seleukid_02_syria.33.desc:0 "The hill-country behind Arca is held by the Ituraeans, an Arab people of the Lebanon whose chieftains raid and trade along the coast. Foremost among them is the house of Soaimus. Rather than garrison this restless frontier ourselves, we might raise one of these Ituraean princes, [noarus_scope.GetPraenomen], son of Soaimus, to hold 'Arqa in our name."
 me_seleukid_02_syria.33.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_15$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.33.a:0 "Our forces will garrison [GetProvince('(int32)771').GetName]."
 me_seleukid_02_syria.33.b:0 "Let [noarus_scope.GetPraenomen] hold [GetProvince('(int32)771').GetName]."
 me_seleukid_02_syria.33.b.tt:0 "#E #Y Arca#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Tributary#!\n#E [noarus_scope.GetName]#! becomes the ruler of #E #Y Arca#!#"

# Task 16 - The Temple of Artemis Perasia
 me_seleukid_02_syria.34.t:0 "The Fire-Walkers of Perasia"
 me_seleukid_02_syria.34.desc:0 "At Castabala stands the sanctuary of Artemis Perasia, whose priestesses walk barefoot over burning coals and take no hurt. The Persians knew her for a kin of Anahita, the Greeks for Artemis."
 me_seleukid_02_syria.34.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_16$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.34.a:0 "Endow the temple."
 me_seleukid_02_syria.34.b:0 "Priestkings will reign over [GetProvince('(int32)1875').GetName]."
 me_seleukid_02_syria.34.b.tt:0 "#E #Y [GetProvince('(int32)1875').GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!\n#E [castabala_priest_scope.GetName]#! becomes the ruler of #E #Y [GetProvince('(int32)1875').GetName]#!#!"
 me_seleukid_02_syria.34.c:0 "Refound it as Hieropolis-Castabala."
 me_seleukid_02_syria.34.c.tt:0 "#E #Y Hieropolis-Castabala#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Client State#!"

# Task 17 - The Free Cities of Cilicia
 me_seleukid_02_syria.35.t:0 "Kinsmen of Argos"
 me_seleukid_02_syria.35.desc:0 "The old Greek cities of the Cilician coast have chafe under foreign rule. Alexander freed Mallos, a colony of Argos, from the tribute it owed Dareios, and left the Solians their democracy."
 me_seleukid_02_syria.35.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_17$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.35.a:0 "Restore their ancient freedom."
 me_seleukid_02_syria.35.a.tt:0 "#E #Y Soloi#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Feudatory#!\n#E #Y Mallos#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Feudatory#!\n"
 me_seleukid_02_syria.35.b:0 "What need have they of freedom?"

# Task 18 - The Elephants of Apamea
 me_seleukid_02_syria.36.t:0 "The Elephant Park"
 me_seleukid_02_syria.36.desc:0 "At Apameia the water-meadows of the Orontes run broad and green. Here the elephant stables have been raised, thirty thousand mares turned out to the royal pastures, and the whole laid out as a muster-ground for the army."
 me_seleukid_02_syria.36.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_18$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.36.a:0 "Elephants in Syria. What a site!"
 me_seleukid_02_syria.36.b:0 "We will keep a standing elephant corps."
 me_seleukid_02_syria.36.b.tt:0 "#Y [GetProvince('(int32)782').GetName]#! gains #Y 8#! cohorts of #E war-elephants#!."

# Task 19 - The Moon-Temple of Carrhae
 me_seleukid_02_syria.37.t:0 "The City of the Moon"
 me_seleukid_02_syria.37.desc:0 "At Carrhae, which the Assyrians called the City of the Moon, stands the temple of Sin, whose silver crescent has been worshiped at Harran since long before Assyria. There are Macedonians in the town as well. [GetCharacter('(int32)37').GetPraenomen] planted a colony of them here, and when [GetCharacter('(int32)24').GetPraenomen] came through on his march to take Babylon back, with only a few hundred men at his back, he pressed some of those colonists into his column and went on. Their grandsons are still here, and so is the god."
 me_seleukid_02_syria.37.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_19$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.37.a:0 "Endow the temple."
 me_seleukid_02_syria.37.b:0 "The priests can rule the temple state of Sin."
 me_seleukid_02_syria.37.b.tt:0 "#E #Y [GetProvince('(int32)819').GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!\n#E [carrhae_priest_scope.GetName]#! becomes the ruler of #E #Y [GetProvince('(int32)819').GetName]#!#!"

# Task 20 - Zeus of Baetocaece
 me_seleukid_02_syria.38.t:0 "The Village of the God"
 me_seleukid_02_syria.38.desc:0 "At Baetocaece lies a sacred village given over to Zeus, whom the country folk name only for their village, and the old tales call Hadad the storm-god. By a king's letter the god was granted the village and all its revenues, that his temple might prosper."
 me_seleukid_02_syria.38.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_20$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.38.a:0 "Renew the royal grant."
 me_seleukid_02_syria.38.b:0 "Give the village to the god."
 me_seleukid_02_syria.38.b.tt:0 "#E #Y [GetProvince('(int32)8011').GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!\n#E [baetocaece_priest_scope.GetName]#! becomes the ruler of #E #Y [GetProvince('(int32)8011').GetName]#!#!"

# Task 21 - The Royal Fleet
 me_seleukid_02_syria.39.t:0 "Masters of the Eastern Sea"
 me_seleukid_02_syria.39.desc:0 "The mouth of the Orontes at [GetProvince('(int32)789').GetName] is the natural station for a royal war-fleet. With the shipwrights of Phoenicia at our command and the treasury opened, we have built a navy worthy of the eastern sea."
 me_seleukid_02_syria.39.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_21$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.39.a:0 "Keep a standing royal navy."
 me_seleukid_02_syria.39.b:0 "Launch the great fleet at once."
 me_seleukid_02_syria.39.b.tt:0 "A royal fleet of a #Y hexere#! flagship and #Y 6#! tetreres puts to sea at #Y [GetProvince('(int32)789').GetName]#!."

# Task 22 - The Thessalians of Syria
 me_seleukid_02_syria.40.t:0 "Horsemen of Larissa"
 me_seleukid_02_syria.40.desc:0 "Larissa and Doliche bear the names of old Thessaly, for it was Thessalian horsemen whom the kings settled here. Fresh settlers now come from that homeland of horsemen to strengthen the studs and squadrons of our realm."
 me_seleukid_02_syria.40.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_22$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.40.a:0 "Let the horsemen come."

# Task 23 - The Vineyards of Chalybon
 me_seleukid_02_syria.41.t:0 "The Royal Wine"
 me_seleukid_02_syria.41.desc:0 "The wine of Chalybon was the reserved drink of the Great Kings of Persia, who would touch no other. The vineyards above the Belus yield that famous vintage still, and now it is ours to develop and to sell."
 me_seleukid_02_syria.41.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_23$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.41.a:0 "To the vineyards."

# Task 24 - The Field of Triparadeisos
 me_seleukid_02_syria.42.t:0 "Where the Empire Was Divided"
 me_seleukid_02_syria.42.desc:0 "Here at Triparadeisos, in the year the generals divided the empire, Seleukos was granted the satrapy of Babylonia, the seed from which our whole dominion grew. Upon this field we raise a monument to the fortune of our house."
 me_seleukid_02_syria.42.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_24$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.42.a:0 "Raise the monument."

# Task 25 - Founding Cyrrhus
 me_seleukid_02_syria.43.t:0 "A New Kyrrhos"
 me_seleukid_02_syria.43.desc:0 "The Macedonians who came with us named their new colonies for the homes they left behind. Where the settlement of Omeros stood, on the road between Antioch and the Euphrates, we have raised a city and called it Kyrrhos, after Cyrrhus in Emathia, and settled it with veterans of the phalanx, the Cyrrhestai, who have given Athena Kyrrhestis a home in their new city."
 me_seleukid_02_syria.43.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_25$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.43.a:0 "Let the Cyrrhestai raise their city."

# Task 26 - A Dynast of Cyrrhestica
 me_seleukid_02_syria.44.t:0 "A Man of the Frontier"
 me_seleukid_02_syria.44.desc:0 "The frontier north of Antioch, wedged between the Amanus and the Euphrates, is a hard land to govern from the capital. Among its people is a local noble named Pharnaeus, a man of some standing..."
 me_seleukid_02_syria.44.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_26$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.44.a:0 "Why change the status quo?"
 me_seleukid_02_syria.44.b:0 "Pharnaeus will make for a capable prince."
 me_seleukid_02_syria.44.b.tt:0 "#E #Y Cyrrhestica#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Satrapy#!\n#E [pharnaeus_scope.GetName]#! becomes the ruler of #E #Y Cyrrhestica#!#!"

# Task Final - A Second Home
 me_seleukid_02_syria.14.t:0 "$seleukid_mission_02_syria_task_final$"
 me_seleukid_02_syria.14.desc:0 "$seleukid_mission_02_syria_task_final_DESC$"
 me_seleukid_02_syria.14.complete.tt:0 "The mission task '#Y $seleukid_mission_02_syria_task_final$#!' has now been #G Completed#!!"
 me_seleukid_02_syria.14.a:0 "Another step for our empire."

 me_seleukid_02_syria.15.t:0 "$seleukid_mission_02_syria$"
 me_seleukid_02_syria.15.desc:0 "Syria is left in the hands of an administration that can hold it without us. It is a different country from Babylonia and a different people, but the ports are what matter: with a coast on the Middle Sea we are once more a party to the quarrels of Alexander's heirs, and not merely a power of the interior."
 me_seleukid_02_syria.15.a:0 "For better or for worse, it had to happen."
 me_seleukid_02_syria.15.a.tt:0 "The mission '#Y $seleukid_mission_02_syria$#!' has now been #G Completed#!!"

 me_seleukid_02_syria.17.t:0 "Settling in [GetProvince('(int32)789').GetArea.GetRegion.GetName]"
 me_seleukid_02_syria.17.desc:0 "A large number of our people have been fooled by the promises of a new life in [GetProvince('(int32)789').GetArea.GetRegion.GetName], in one of the many cities that have been founded there recently. Leaving many of their belongings behind, as well as their homes, they have been given new homes and work when they settle down in the east."
 me_seleukid_02_syria.17.a:0 "Let us try to make some money off of what they left behind, at least?"

################################################################
# 03 ANATOLIA
################################################################

 seleukid_mission_03_anatolia:0 "Western Dreams"
 seleukid_mission_03_anatolia_finish_tt:0 "#G Completing this task finishes#! #E #T Western Dreams#!#!."
 seleukid_mission_03_anatolia_finish_upper_satrapies_unlock_tt:0 "#G Completing this task finishes#! #E #T Western Dreams#!#! and #G unlocks#! a new mission tree: #E #T Hellenistic Empire#!#!."
 seleukid_mission_03_anatolia_DESCRIPTION:0 "Though we are the heirs of the Satrapy of Babylonia, we know that we will never be able to pick up Alexander's legacy if we are not the rulers of Macedon itself. To get there, we will need to secure the long Persian Royal Road first, all the way to Sardeis at the far end of Anatolia."
 seleukid_mission_03_anatolia_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when we have taken control of the western Persian Royal Road, and have built up an administration and defenses around it in Anatolia."
 seleukid_mission_03_anatolia_BUTTON_TOOLTIP:0 "We look westwards, towards Macedon. First step, however, is to take control of the entire western route of the Persian Royal Road."

# ============================================================
# Missions
# ============================================================

 seleukid_mission_03_anatolia_task_1:0 "The Satrapy of Phrygia"
 seleukid_mission_03_anatolia_task_1_DESC:0 "The road west runs through [GetProvince('(int32)1936').GetArea.GetRegion.GetName], and [GetProvince('(int32)1936').GetName] sits astride it. It was the satrapal seat under the Great Kings, where the Marsyas comes out of the rock below the citadel."

 seleukid_mission_03_anatolia_task_2:0 "Restoring Kelainai"
 seleukid_mission_03_anatolia_task_2_DESC:0 "[GetProvince('(int32)1936').GetName] has been fought over and left standing by turns since Xerxes wintered in it. Rebuilt, it will house our governors and give [GetProvince('(int32)1936').GetArea.GetRegion.GetName] its seat again."

 seleukid_mission_03_anatolia_task_3:0 "The Ancient Men"
 seleukid_mission_03_anatolia_task_3_DESC:0 "At [GetProvince('(int32)1928').GetName] stands an old sanctuary of the moon-god Men, whose crescent the Phrygians have cut on their shrines since before the Persians came, and whose priests hold the land around the city and the loyalty of its people. We should take the place and refound it in the image of our royal cities, so that the sanctuary and its district both answer to us."

 seleukid_mission_03_anatolia_task_4:0 "Phrygian Administration"
 seleukid_mission_03_anatolia_task_4_DESC:0 "[GetProvince('(int32)1936').GetArea.GetRegion.GetName] is a land of long roads and few walls, the highway from the Aegean to the east running straight through it. An administration here is only as strong as the road-stations, garrisons, and market-towns that tie it together. We should build that network out across the region, so that [GetProvince('(int32)1936').GetArea.GetRegion.GetName] stays a working part of [ROOT.GetCountry.GetName] and not a stretch of country we merely march through."
 seleukid_mission_03_anatolia_task_4_forts_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_03_anatolia_task_4_fort_total')|0]#! Fortress buildings in #Y [GetProvince('(int32)1931').GetArea.GetName]#!, #Y [GetProvince('(int32)1942').GetArea.GetName]#!, and #Y [GetProvince('(int32)1928').GetArea.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_03_anatolia_task_4_forts_trigger_loc')]"
 seleukid_mission_03_anatolia_task_4_cities_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_03_anatolia_task_4_cities_total')|0]#! cities in #Y [GetProvince('(int32)1931').GetArea.GetName]#!, #Y [GetProvince('(int32)1942').GetArea.GetName]#!, and #Y [GetProvince('(int32)1928').GetArea.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_03_anatolia_task_4_cities_trigger_loc')]"

 seleukid_mission_03_anatolia_task_5:0 "Antigonid Capital"
 seleukid_mission_03_anatolia_task_5_DESC:0 "[GetProvince('(int32)1936').GetName] was [GetCharacter('(int32)37').GetPraenomen]'s seat when he held [GetProvince('(int32)1936').GetArea.GetRegion.GetName] for Alexander, and he made it the one of the strongest cities in Asia by pouring men and silver into it. We should finish the work we began there and win its people as he once did, so that the old capital and the country around it look to our house and no other."
 seleukid_mission_03_anatolia_task_5_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has integrated the dominant culture in #Y [GetProvince('(int32)1936').GetName]#! (#Y [GetProvince('(int32)1936').GetCulture.GetName]#!)."

 seleukid_mission_03_anatolia_task_6:0 "By the Taurus Mountains"
 seleukid_mission_03_anatolia_task_6_DESC:0 "North of [GetProvince('(int32)1883').GetArea.GetRegion.GetName] lie [GetProvince('(int32)1799').GetArea.GetRegion.GetName] and the eastern reaches of [GetProvince('(int32)1936').GetArea.GetRegion.GetName], upland country that every power in Anatolia has been content to leave alone. It is poor ground and it pays little, but the road west runs through it."

 seleukid_mission_03_anatolia_task_7:0 "Administration in Kindyria"
 seleukid_mission_03_anatolia_task_7_DESC:0 "We have located a small settlement that we believe can be refounded into a city of importance in [GetProvince('(int32)177').GetName], [GetProvince('(int32)177').GetArea.GetName], just north of the ancient city of [GetProvince('(int32)1934').GetName]."

 seleukid_mission_03_anatolia_task_8:0 "The Two Ancient Cities"
 seleukid_mission_03_anatolia_task_8_DESC:0 "Two old cities anchor this country: [GetProvince('(int32)1934').GetName] in [GetProvince('(int32)1934').GetArea.GetName] and [GetProvince('(int32)1951').GetName] in [GetProvince('(int32)1951').GetArea.GetName]. Spend on those two and the towns around them will fall in behind."

 seleukid_mission_03_anatolia_task_9:0 "Eastern Administration"
 seleukid_mission_03_anatolia_task_9_DESC:0 "Though often less popular than its western neighbors, the region is in strong need of a capable administration with the infrastructure needed to take care of everything. If we were to hand them that, it would be sure to pay off in the future."
 seleukid_mission_03_anatolia_task_9_forts_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_03_anatolia_task_9_fort_total')|0]#! Fortress buildings in #Y [GetProvince('(int32)1920').GetArea.GetName]#!, #Y [GetProvince('(int32)1971').GetArea.GetName]#!, and #Y [GetProvince('(int32)1978').GetArea.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_03_anatolia_task_9_forts_trigger_loc')]"
 seleukid_mission_03_anatolia_task_9_cities_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_03_anatolia_task_9_cities_total')|0]#! cities in #Y [GetProvince('(int32)1920').GetArea.GetName]#!, #Y [GetProvince('(int32)1971').GetArea.GetName]#!, and #Y [GetProvince('(int32)1978').GetArea.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_03_anatolia_task_9_cities_trigger_loc')]"

 seleukid_mission_03_anatolia_task_10:0 "Consolidating Cappadocia"
 seleukid_mission_03_anatolia_task_10_DESC:0 "[GetProvince('(int32)1799').GetArea.GetRegion.GetName] has never been easy for an outsider to hold. It is a land of lords, each ruling over a principality of his own, and the Great Kings governed them through satraps drawn from those same houses. Perhaps the time has come to place a lord loyal to [ROOT.GetCountry.GetRuler.GetPraenomen] over the Cappadocians in place of a governor from [ROOT.GetCountry.GetCapital.GetName]."
 seleukid_mission_03_anatolia_task_10_effect_tt:0 "#E #Y Cappadocia#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Satrapy#!\n#Y Cappadocia#! will receive every territory #Y [SCOPE.GetRootScope.GetCountry.GetName]#! holds in the #E Region of #Y Cappadocia#!#!."

 seleukid_mission_03_anatolia_task_11:0 "Moving Westwards"
 seleukid_mission_03_anatolia_task_11_DESC:0 "The royal road ends among the Greek cities of the coast, in [GetProvince('(int32)292').GetArea.GetRegion.GetName]. They have risen against every distant master set over them, and there have been many."

 seleukid_mission_03_anatolia_task_12:0 "At the End of the Persian Road"
 seleukid_mission_03_anatolia_task_12_DESC:0 "[GetProvince('(int32)292').GetName] stands at the end of the royal road, where the couriers of the Great Kings came in from Susa. Anatolians and Greeks have lived in it side by side for as long as either can remember, and whoever has held the west has governed from it."

 seleukid_mission_03_anatolia_task_13:0 "Western Administration"
 seleukid_mission_03_anatolia_task_13_DESC:0 "Every power that has held the west has lost it the same way: the satraps grow strong and the roads grow long. Cities and fortresses set along those roads would keep both in hand."
 seleukid_mission_03_anatolia_task_13_forts_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_03_anatolia_task_13_fort_total')|0]#! Fortress buildings in #Y [GetProvince('(int32)1952').GetArea.GetName]#! and #Y [GetProvince('(int32)292').GetArea.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_03_anatolia_task_13_forts_trigger_loc')]"
 seleukid_mission_03_anatolia_task_13_cities_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_03_anatolia_task_13_cities_total')|0]#! cities in #Y [GetProvince('(int32)1952').GetArea.GetName]#! and #Y [GetProvince('(int32)292').GetArea.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_03_anatolia_task_13_cities_trigger_loc')]"

 seleukid_mission_03_anatolia_task_14:0 "Dreams of Seleukos"
 seleukid_mission_03_anatolia_task_14_DESC:0 "According to [GetCharacter('(int32)24').GetPraenomen], our ruling family has descended from Apollo himself, and have long been loyal followers of the oracle in Didyma, a temple structure close to the city of [GetProvince('(int32)1973').GetName]."

 seleukid_mission_03_anatolia_task_15:0 "The Oracle in Didyma"
 seleukid_mission_03_anatolia_task_15_DESC:0 "It has long been a dream for the [GetCharacter('(int32)24').GetFamily.GetName] family to secure the loyalty of the oracle in Didyma, close to the city of [GetProvince('(int32)1973').GetName]."
 seleukid_mission_03_anatolia_task_15_trigger_tt:0 "#Y [THIS.GetProvince.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_03_anatolia_task_15_total')|0]#! Temple buildings. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_03_anatolia_task_15_loc')]"
 seleukid_mission_03_anatolia_task_15_effect_tt:0 "Unlocks the deity #T Apollo Didymaios#!."

 seleukid_mission_03_anatolia_task_16:0 "Another Seleukeia"
 seleukid_mission_03_anatolia_task_16_DESC:0 "Our founder's name stands on cities from the Tigris to the sea, and every one of them has paid for itself twice over. There is room for one more in far western Anatolia."

 seleukid_mission_03_anatolia_task_17:0 "The Viceroy of the West"
 seleukid_mission_03_anatolia_task_17_DESC:0 "West of the Tauros the satrapies look to a single governor, and that office has made overmighty men. Achaios, a kinsman of our house, has driven back the Pergamene and restored the royal writ from Sardeis to the sea. A man who can do that for us can as easily do it for himself, and the west has made kings of lesser men than Achaios."
 seleukid_mission_03_anatolia_task_17_effect_tt:0 "Appoint Achaios viceroy of the west, release Asia to him as a satrapy, or govern the western satrapies directly."
 seleukid_mission_03_anatolia_task_17_allow_tt:0 "We own at least #Y 25#! territories in the region of #Y Asia#!"

 seleukid_mission_03_anatolia_task_18:0 "The Colonists of Phrygia"
 seleukid_mission_03_anatolia_task_18_DESC:0 "In the uplands of Phrygia Epiktetos stand the military colonies that the officers of the Macedonian conquest planted among the villages. Dokimos gave his name to Dokimeion of the quarries, Dorylaos to Dorylaion of the warm springs, and Themison and Kleonnas each raised a town of their own."
 seleukid_mission_03_anatolia_task_18_effect_tt:0 "#E #Y Dokimeion#!#!, #E #Y Dorylaion#!#!, #E #Y Kleonnaeion#!#!, and #E #Y Themisonion#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Feudatory#!"
 seleukid_mission_03_anatolia_task_18_effect_1_tt:0 "#E #Y Dokimeion#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Feudatory#!"
 seleukid_mission_03_anatolia_task_18_effect_2_tt:0 "#E #Y Dorylaion#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Feudatory#!"
 seleukid_mission_03_anatolia_task_18_effect_3_tt:0 "#E #Y Themisonion#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Feudatory#!"
 seleukid_mission_03_anatolia_task_18_effect_4_tt:0 "#E #Y Kleonnaeion#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Feudatory#!"
 
 seleukid_mission_03_anatolia_task_19:0 "The Shipyards of Cyprus"
 seleukid_mission_03_anatolia_task_19_DESC:0 "The great island lies athwart the sea-lanes between Kilikia and the Levant, rich in the cedar and pine that build fleets and in the copper of Tamassos that gave the metal its name. Its cities, Greek Salamis and Paphos, Phoenician Kition, old Amathous, once owed their tribute to the Great King of Persia, then bowed to the Macedonian conqueror, and since his death have been contested among his Successors."

 seleukid_mission_03_anatolia_task_20:0 "The Paphian Goddess"
 seleukid_mission_03_anatolia_task_20_DESC:0 "At Paphos the goddess the Greeks call Aphrodite is served by the priest-kings of the house of Kinyras. Her precinct knows neither image nor blood-offering, only the smooth stone of the goddess and the smoke of incense."
 seleukid_mission_03_anatolia_task_20_effect_tt:0 "#E #Y [GetProvince('(int32)334').GetName]#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Temple State#! or a #E Tributary#!"

 seleukid_mission_03_anatolia_task_21:0 "The Satrapy of Cyprus"
 seleukid_mission_03_anatolia_task_21_DESC:0 "Until very recently, Cyprus was a land of kings. But the wars of the Successors ravaged the island, and in that long strife its ancient kingdoms were dissolved, their thrones now ash and memory. The times have changed and we must change with them..."
 seleukid_mission_03_anatolia_task_21_effect_tt:0 "#E #Y Cyprus#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Satrapy#!"

 seleukid_mission_03_anatolia_task_22:0 "The Copper of Tamassos"
 seleukid_mission_03_anatolia_task_22_DESC:0 "The hills of Tamassos hold the copper that gave the metal its name, for the Greeks call it kypros. Alexander is said to have granted these mines to a favored companion. In royal hands they would sheathe the hulls our Cyprian yards lay down. We should take the mines of Tamassos in hand."

 seleukid_mission_03_anatolia_task_final:0 "From Persepolis to Sardeis"
 seleukid_mission_03_anatolia_task_final_DESC:0 "The royal road runs from [GetProvince('(int32)4799').GetName] to [GetProvince('(int32)292').GetName], and the Great Kings governed the west by it. Until it is ours end to end, neither is the west."

