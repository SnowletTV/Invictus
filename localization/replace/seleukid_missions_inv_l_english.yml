################################################################
# 01 BABYLONIA
################################################################

 seleukid_mission_01_babylonia:0 "The Satrapy of Babylonia"
 seleukid_mission_01_babylonia_DESCRIPTION:0 "At the heart of our nation lies Babylonia, once the satrapy of [GetCharacter('(int32)24').GetPraenomen]. A devastating campaign led by [GetCharacter('(int32)37').GetPraenomen] left it in ruins, and it is still suffering the consequences to this very day.\n\nAs one of the richer satrapies in the empires of the Persians and Alexander, it only makes sense that we would set aside time to restore this region to its former glory."
 seleukid_mission_01_babylonia_CRITERIA_DESCRIPTION:0 "This mission will be considered complete after we have restored Babylon and the surrounding region."
 seleukid_mission_01_babylonia_BUTTON_TOOLTIP:0 "At the heart of our nation lies Babylonia, a region still suffering from the invasion of [GetCharacter('(int32)37').GetPraenomen]. As one of the richer satrapies in the empires of the Persians and Alexander, it only makes sense that we would set aside time to restore this region to its former glory."
 seleukid_mission_01_babylonia_BUTTON_DETAILS: ""

# ============================================================
# Missions
# ============================================================

 seleukid_mission_01_babylonia_task_1:0 "The Priests of Marduk"
 seleukid_mission_01_babylonia_task_1_DESC:0 "Foremost in Babylon are the priests of Marduk, a strong caste of religious leaders that decides the day to day business of the city. Many a king has lost control over Babylonia after offending their order."
 seleukid_mission_01_babylonia_task_1_effect_tt:0 "A learned priest of Marduk takes up residence at our court."

 seleukid_mission_01_babylonia_task_2:0 "Securing Loyalties"
 seleukid_mission_01_babylonia_task_2_DESC:0 "When we win the priesthood over to our side, we can start taking steps in binding their faith to the dynasty of [ROOT.GetCountry.GetRuler.GetPraenomen], and to our continued rule of Babylonia."
 seleukid_mission_01_babylonia_task_2_trigger_tt:0 "#Y [THIS.GetCharacter.GetName]#! has a loyalty of at least #Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_2_total_svalue')|0]#!. [THIS.GetCharacter.GetEmployer.Custom('seleukid_mission_01_babylonia_task_2_loc')]"
 seleukid_mission_01_babylonia_task_2_loc_1:0 "(#R [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_2_current_svalue')|0]#!/#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_2_total_svalue')|0]#!)"
 seleukid_mission_01_babylonia_task_2_loc_2:0 "(#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_2_current_svalue')|0]#!/#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_2_total_svalue')|0]#!)"
 seleukid_mission_01_babylonia_task_2_trigger_tt_monarchy:0 "The #Y [GetOffice('office_high_priest_monarchy').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#! of #Y [SCOPE.GetRootScope.GetCountry.GetName]#! has the character modifier #Y $priest_of_babylon_char_modifier$#!."
 seleukid_mission_01_babylonia_task_2_trigger_tt_republic:0 "The #Y [GetOffice('office_pontifex').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#! of #Y [SCOPE.GetRootScope.GetCountry.GetName]#! has the character modifier #Y $priest_of_babylon_char_modifier$#!."
 seleukid_mission_01_babylonia_task_2_trigger_tt_tribal:0 "The #Y [GetOffice('office_high_priest').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#! of #Y [SCOPE.GetRootScope.GetCountry.GetName]#! has the character modifier #Y $priest_of_babylon_char_modifier$#!."

 seleukid_mission_01_babylonia_task_3:0 "Dynastic Cult"
 seleukid_mission_01_babylonia_task_3_DESC:0 "Now that the priesthood have been convinced of our rightful rule of their home, we can continue with binding their faith to our own, and to our [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetPraenomen]."
 seleukid_mission_01_babylonia_task_3_trigger_tt:0 "Any character in our court has the #Y $priest_of_babylon_char_modifier$#! character modifier."

 seleukid_mission_01_babylonia_task_4:0 "The Barriers of Babylonia"
 seleukid_mission_01_babylonia_task_4_DESC:0 "By the shores of the Euphrates lies Babylon, and by the shores of the Tigris we raised the great city of Seleukeia. Together they work as barriers and fortification against any who would try to pass through the lands of Babylonia."
 seleukid_mission_01_babylonia_task_4_seleukeia_1:0 "(#R [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_4_current_building_seleukeia')|0]#!/#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_4_total_building_seleukeia')|0]#!)"
 seleukid_mission_01_babylonia_task_4_seleukeia_2:0 "(#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_4_current_building_seleukeia')|0]#!/#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_4_total_building_seleukeia')|0]#!)"
 seleukid_mission_01_babylonia_task_4_trigger_tt_babylonia:0 "#Y [THIS.GetProvince.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_4_total_building_babylonia')|0]#! buildings. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_01_babylonia_task_4_babylonia')]"
 seleukid_mission_01_babylonia_task_4_babylonia_1:0 "(#R [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_4_current_building_babylonia')|0]#!/#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_4_total_building_babylonia')|0]#!)"
 seleukid_mission_01_babylonia_task_4_babylonia_2:0 "(#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_4_current_building_babylonia')|0]#!/#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_4_total_building_babylonia')|0]#!)"

 seleukid_mission_01_babylonia_task_5:0 "The People of Babylonia"
 seleukid_mission_01_babylonia_task_5_DESC:0 "Though we have introduced many of our own to the region around Babylon, and a large part of the Babylonian population have become accustomed to our rule, there are still those who oppose us at every turn."
 seleukid_mission_01_babylonia_task_5_trigger_tt:0 "At least #Y 85%#! of the #Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_5_absolute_total')|0]#! pops in the region of #Y $mesopotamia_region$#! owned by #Y [SCOPE.GetRootScope.GetCountry.GetName]#! is #Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#! or of an integrated culture. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_01_babylonia_task_5_loc')]"
 seleukid_mission_01_babylonia_task_5_loc_1:0 "(#R [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_5_current')|0]#!/#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_5_total')|0]#!)"
 seleukid_mission_01_babylonia_task_5_loc_2:0 "(#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_5_current')|0]#!/#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_5_total')|0]#!)"

 seleukid_mission_01_babylonia_task_6:0 "Restoring the Satrapy"
 seleukid_mission_01_babylonia_task_6_DESC:0 "After Seleukos reconquered Babylonia and took back his satrapy, Antigonos sent armies to plunder and ruin what he had lost. Though much of Babylon have been restored under our revered rule, there are still steps to be taken to restore it to the glory of old."
 seleukid_mission_01_babylonia_task_6_tt_trigger:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_6_total')|0]#! buildings in the region of #Y $mesopotamia_region$#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_01_babylonia_task_6_loc')] [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_01_babylonia_task_6_construction_loc')]"
 seleukid_mission_01_babylonia_task_6_loc_1:0 "(#R [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_6_current')|0]#!/#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_6_total')|0]#!)"
 seleukid_mission_01_babylonia_task_6_loc_2:0 "(#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_6_current')|0]#!/#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_6_total')|0]#!)"
 seleukid_mission_01_babylonia_task_6_construction_loc_1:0 "\n    @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! has on-going construction in the region of #Y $mesopotamia_region$#!."
 seleukid_mission_01_babylonia_task_6_construction_loc_2:0 ""

 seleukid_mission_01_babylonia_task_7:0 "Reorganizing the Administration"
 seleukid_mission_01_babylonia_task_7_DESC:0 "The administration of Babylonia has been mostly left untouched since it was taken from Dareios III. A [ROOT.GetCountry.GetPrimaryCulture.GetName] touch could make it more accustomed and fitting for our rulership."

 seleukid_mission_01_babylonia_task_8:0 "Local Legitimacy"
 seleukid_mission_01_babylonia_task_8_DESC:0 "With the help of our [GetOffice('office_steward').GetCulturalName(SCOPE.GetRootScope.GetCountry)] we will sow the seeds of loyalty across the Babylonian satrapy, to ensure the continued support from one of the richest regions in the empire of the Persians and Alexander both."

 seleukid_mission_01_babylonia_task_9:0 "Peace, Freedom, and Prosperity"
 seleukid_mission_01_babylonia_task_9_DESC:0 "Peace breeds prosperity and loyalty, and so we will make sure even the most distant and rural parts of Babylonia will be protected by our garrisons."
 seleukid_mission_01_babylonia_task_9_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_9_total')|0]#! forts built in the highlighted areas. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_01_babylonia_task_9_loc')]"
 seleukid_mission_01_babylonia_task_9_loc_1:0 "(#R [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_9_current')|0]#!/#Y [SCOPE.ScriptValue('seleukid_mission_01_babylonia_task_9_total')|0]#!)"
 seleukid_mission_01_babylonia_task_9_loc_2:0 ""

 seleukid_mission_01_babylonia_task_10:0 "Babylonian Support"
 seleukid_mission_01_babylonia_task_10_DESC:0 "The old cities of Babylonia still govern themselves through their assemblies and their temple-councils, as they did under kings a thousand years before us, and their notables carry more weight with the people than any officer we might send. We should court these men, confirm their privileges and their gods, and win the citizens and nobles of the ancient cities to our house."

 seleukid_mission_01_babylonia_task_11:0 "The House of Marduk"
 seleukid_mission_01_babylonia_task_11_DESC:0 "The Esagila, the great temple of Bel-Marduk, has stood at the heart of Babylon for a thousand years. Its priesthood commands the loyalty of the Babylonians and the wealth of the temple estates. The restorations ordered by Alexander remain unfinished. It falls to us to finish the job."
 seleukid_mission_01_babylonia_task_11_effect_tt:0 "#E #Y [GetProvince('(int32)918').GetName]#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Temple State#!"

 seleukid_mission_01_babylonia_task_12:0 "The Eanna of Uruk"
 seleukid_mission_01_babylonia_task_12_DESC:0 "At Uruk the temples of Anu and Ishtar have been raised grander than ever, and the priestly families of the city grow rich and powerful."
 seleukid_mission_01_babylonia_task_12_effect_tt:0 "#E #Y [GetProvince('(int32)937').GetName]#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Temple State#!"

 seleukid_mission_01_babylonia_task_13:0 "Seleukeia on the Tigris"
 seleukid_mission_01_babylonia_task_13_DESC:0 "Seleukeia was laid out where the Royal Canal comes down to the Tigris, and Babylon has been emptying into it ever since. The priests complain that the city takes their people faster than they can be replaced. [GetProvince('(int32)911').GetName] has outgrown the plan we drew for it."

 seleukid_mission_01_babylonia_task_14:0 "Colonies of Sittacene"
 seleukid_mission_01_babylonia_task_14_DESC:0 "Sittacene lies between the Tigris and the Tornadotus, good black soil the whole way, and nothing Greek on it but Seleukeia at the far end. We should take the old Babylonian town at [GetProvince('(int32)899').GetName] for our own and plant a fresh colony beside it on the plains of [GetProvince('(int32)898').GetName]."

 seleukid_mission_01_babylonia_task_16:0 "Settling Chaldaea"
 seleukid_mission_01_babylonia_task_16_DESC:0 "The region of Chaldaea is ancient and mysterious. We have already founded a Greek center of power there at [GetProvince('(int32)933').GetName], however it has been suggested that this wild land must be tamed further. A secondary 'Apameia' on the Selaeus river and a colony further inland, closer to our capital, will allow us to Hellenize the province of Chaldaea much faster."

 seleukid_mission_01_babylonia_task_17:0 "City of the Sun God"
 seleukid_mission_01_babylonia_task_17_DESC:0 "The ancient Babylonian city of [GetProvince('(int32)910').GetName] has fallen into ruin and disrepair. Repurposing this old and storied city into a new [ROOT.GetCountry.GetAdjective] colony would make it our first Greek polis in the province of Babylonia."

 seleukid_mission_01_babylonia_task_18:0 "The Restoration of Uruk"
 seleukid_mission_01_babylonia_task_18_DESC:0 "[GetProvince('(int32)937').GetName] is the legendary capital of the Sumer, and one of the oldest cities in the world. Time has not been kind to this once magnificent city, and today it is nothing more than a dilapidated ruin. Our administrators have drawn up plans for a complete restoration of [GetProvince('(int32)937').GetName], with a new name; 'Antioch on the Ishtar Canal'."
 seleukid_mission_01_babylonia_task_18_buildings_tt:0 "#Y [THIS.GetProvince.GetName]#! has at least #Y 5#! buildings."

 seleukid_mission_01_babylonia_task_19:0 "Charax of Alexander"
 seleukid_mission_01_babylonia_task_19_DESC:0 "Characene is the gate to the Erythraean Sea. Alexander himself planted the town at [GetProvince('(int32)940').GetName], where the Tigris runs out into the ocean roads and the Arabian trade comes up past it. Built up, it would put us on that trade rather than beside it."
 seleukid_mission_01_babylonia_task_19_effect_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! receives a claim on every territory in the areas of #Y [GetProvince('(int32)7196').GetArea.GetName]#! and #Y [GetProvince('(int32)7202').GetArea.GetName]#!."

 seleukid_mission_01_babylonia_task_20:0 "The Road to India"
 seleukid_mission_01_babylonia_task_20_DESC:0 "The coast of Characene is relatively unsettled, putting us at a disadvantage for trade with the kingdoms to the East. Establishing a [ROOT.GetCountry.GetAdjective] colony on the Erythraean coast would open up our empire to the riches of India and beyond."

 seleukid_mission_01_babylonia_task_21:0 "Colonize the Arabian Coast"
 seleukid_mission_01_babylonia_task_21_DESC:0 "Alexander had planned an invasion of Arabia before his untimely death. As the rightful heirs to his legacy, we must expand into the Arabian coast."

 seleukid_mission_01_babylonia_task_22:0 "The Loyal Satrapy"
 seleukid_mission_01_babylonia_task_22_DESC:0 "Though Babylonia was once taken by the troops of one-eyed Antigonos, it stayed loyal to Seleukos throughout the entire endeavor. Now the satrapy has been bound tightly to the [ROOT.GetCountry.GetRuler.GetFamily.GetName] dynasty, and we can depend on it for taxes and levies both."
 seleukid_mission_01_babylonia_task_22_effect_tt:0 "#Y 5#! [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName] Citizens appears in [THIS.GetProvince.GetName]."

 seleukid_mission_01_babylonia_task_23:0 "An Ikaros in Persia"
 seleukid_mission_01_babylonia_task_23_DESC:0 "Alexander named this island Ikaros for its likeness to the Aegean isle. At the head of the Erythraean Sea we shall plant a Greek colony and invite settlers from the old country to people it."

 seleukid_mission_01_babylonia_task_24:0 "Hyparch of Oaracta"
 seleukid_mission_01_babylonia_task_24_DESC:0 "The straits below Charax are the gate of the Gulf, and no ship comes up to the Tigris but by them. When Nearchos brought Alexander's fleet through, it was the Persian hyparch Mazenes who took him past the island of Oaracta and its shoals."
 seleukid_mission_01_babylonia_task_24_effect_tt:0 "Gain a #G unique modifier#! based on whether you appoint the ruler of Oaracta as #E Satrap#! of #Y Carmania#! or as #E Hyparch#! of #Y Tylos and the Isles#!."

 seleukid_mission_01_babylonia_task_25:0 "Intimidating Gerrha"
 seleukid_mission_01_babylonia_task_25_DESC:0 "Gerrha, the great incense-city of the Arabs, grows rich on the caravan trade. A royal fleet gathered in her waters may bring her merchants to terms without a siege."

 seleukid_mission_01_babylonia_task_26:0 "Satrap of the Gulf"
 seleukid_mission_01_babylonia_task_26_DESC:0 "Charax Spasinu commands the head of the Erythraean Sea, where the Tigris runs out to the ocean roads. The Gulf keeps its own seasons and its own reckoning of who is master, and word from Antioch arrives there long after it is of use. #E Hyspaosines#! the Bactrian governs the place and has the monsoon trade in hand."
 seleukid_mission_01_babylonia_task_26_effect_tt:0 "Decide whether to release the highlighted lands as the #E Satrapy of #Y Characene#!#!."
 seleukid_mission_01_babylonia_finish_tt:0 "#G Completing this task finishes#! #E #T The Satrapy of Babylonia#!#! and #G unlocks#! two mission trees: #E #T From Ashur to Ararat#!#! and #E #T The Upper Satrapies#!#!."

# ============================================================
# Modifiers & Effects
# ============================================================

 seleucia_on_tigris_modifier:0 "Seleukeia on the Tigris"
 desc_seleucia_on_tigris_modifier:0 "Seleukeia Epitigraea is the capital of the Seleukid Empire and the largest Hellenistic center in the East."
 seleukid_colony_modifier:0 "Seleukid Colony"
 desc_seleukid_colony_modifier:0 "This city was founded by the Seleukid Empire."

 chaldaean_datelands_modifier:0 "Date-Groves of Chaldaea"
 desc_chaldaean_datelands_modifier:0 "The palm-groves and watered fields of the southern marshland, feeding more mouths than the land looks able to."
 sippar_scholars_modifier:0 "Scholars of Sippar"
 desc_sippar_scholars_modifier:0 "The old priest-astronomers of Shamash, whom the Greeks call Chaldaeans, keep their tablets of the heavens here still, and now teach them to Greek pupils."
 uruk_canals_modifier:0 "Canals of Uruk"
 desc_uruk_canals_modifier:0 "The ancient dykes and channels off the Euphrates, dug before memory, water more fields about Uruk than any city of the south."

 seleukid_mission_01_babylonia_gerrha_fleet_tt:0 "A fleet of at least #Y 20#! ships lies in the waters off Gerrha."
 seleukid_big_colony_tt:0 "#Y [THIS.GetProvince.GetName]#! is settled by #E Macedonian#! colonists: #Y 2#! nobles, #Y 3#! citizens, and #Y 6#! freemen."

 seleukid_mission_02_syria_buildings_tt:0 "#Y [THIS.GetProvince.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_02_syria_buildings_total')|0]#! buildings. [THIS.GetProvince.Custom('seleukid_mission_02_syria_buildings_loc')] [THIS.GetProvince.Custom('seleukid_mission_02_syria_buildings_check_loc')]"
 seleukid_mission_02_syria_province_loyalty:0 "#Y [THIS.GetProvince.GetArea.GetName]#! has a province loyalty of at least #Y [SCOPE.ScriptValue('seleukid_mission_02_syria_province_loyalty_total')|0]#!. [THIS.GetProvince.Custom('seleukid_mission_02_syria_province_loyalty_loc')]"
 seleukid_mission_02_syria_province_loyalty_01:0 "(#R [SCOPE.ScriptValue('seleukid_mission_02_syria_province_loyalty_current')|0]#!/#Y [SCOPE.ScriptValue('seleukid_mission_02_syria_province_loyalty_total')|0]#!)"
 seleukid_mission_02_syria_province_loyalty_02:0 ""
 missing_governor_mesopotamia_tt:0 "The region of #Y $mesopotamia_region$#! is missing a governor."
 missing_office_holder_seleukid:0 "There is no #Y [GetOffice('office_steward').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#! in #Y [SCOPE.GetRootScope.GetCountry.GetName]#!."

# ============================================================
# EVENTS
# ============================================================

# Task 1 - The Priests of Marduk
 me_seleukid_01_babylon.101.t:0 "$seleukid_mission_01_babylonia_task_1$ - A Messenger"
 me_seleukid_01_babylon.101.desc:0 "As we were about to contact the priesthood in Babylon, we receive a messenger from their leader. Though they appreciate the steps we have taken to protect their position in Babylon, they would like one of their acolytes to be given a chance to see our rulership in person, to determine if [ROOT.GetCountry.GetRuler.GetPraenomen] is the right person to rule over the city."
 me_seleukid_01_babylon.101.a:0 "Fair enough."

 me_seleukid_01_babylon.1.t:0 "$seleukid_mission_01_babylonia_task_1$ - Arrival of [babylonian_priest_scope.GetPraenomen]"
 me_seleukid_01_babylon.1.desc:0 "Foremost in Babylon are the priests of Marduk, a strong caste of religious leaders that decides the day to day business of the city. Many a king has lost control over Babylonia after offending their order. We have not offended it, and [babylonian_priest_scope.GetPraenomen] now comes to our court to speak for them."
 me_seleukid_01_babylon.1.a:0 "Let us see what this priest is good for."
 me_seleukid_01_babylon.1.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_1$#!' has now been #G Completed#!!"

# Task 2 - Securing Loyalties
 me_seleukid_01_babylon.2.t:0 "$seleukid_mission_01_babylonia_task_2$"
 me_seleukid_01_babylon.2.desc:0 "We have won the priesthood over to our side, and we can start taking steps in binding their faith to the dynasty of [ROOT.GetCountry.GetRuler.GetPraenomen], and to our continued rule of Babylonia."
 me_seleukid_01_babylon.2.a:0 "So [babylonian_priest_scope.GetSheHe] is good for something after all."
 me_seleukid_01_babylon.2.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_2$#!' has now been #G Completed#!!"

# Task 3 - Dynastic Cult
 me_seleukid_01_babylon.301.t:0 "$seleukid_mission_01_babylonia_task_3$ - Ordering the Statue"
 me_seleukid_01_babylon.301.desc:0 "[babylonian_priest_scope.GetPraenomen] would have [GetCharacter('(int32)24').GetPraenomen], first of our house to rule [ROOT.GetCountry.GetName], carved in the likeness of Zeus Belos, in whom the Greek god and the Bel of Babylon are worshipped as one. He has a sculptor in mind already and has sent for him."
 me_seleukid_01_babylon.301.a:0 "[babylonian_priest_scope.GetPraenomen] will take care of the details then?"

 me_seleukid_01_babylon.3.t:0 "$seleukid_mission_01_babylonia_task_3$ - The Finished Statue"
 me_seleukid_01_babylon.3.desc:0 "Now that the priesthood have been convinced of our rightful rule of their home, we continue with binding their faith to our own, and to our [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetPraenomen]. The statue is revealed at last."
 me_seleukid_01_babylon.3.a:0 "We should ask [babylonian_sculptor_scope.GetPraenomen] if [babylonian_sculptor_scope.GetSheHe] wants to stick around."
 me_seleukid_01_babylon.3.a.tt:0 "#Y [babylonian_sculptor_scope.GetName]#! will stay at our court."
 me_seleukid_01_babylon.3.b:0 "Now we just need to figure out where we should put the statue."
 me_seleukid_01_babylon.3.b.tt:0 "#Y [babylonian_sculptor_scope.GetName]#! will leave our court."
 me_seleukid_01_babylon.3.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_3$#!' has now been #G Completed#!!"

# Task 4 - The Barriers of Babylonia
 me_seleukid_01_babylon.4.t:0 "$seleukid_mission_01_babylonia_task_4$"
 me_seleukid_01_babylon.4.desc:0 "By the shores of the Euphrates lies Babylon, and by the shores of the Tigris we raised the great city of Seleukeia. Together they now work as barriers and fortification against any who would try to pass through the lands of Babylonia."
 me_seleukid_01_babylon.4.a:0 "One step at a time."
 me_seleukid_01_babylon.4.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_4$#!' has now been #G Completed#!!"

# Task 5 - The People of Babylonia
 me_seleukid_01_babylon.5.t:0 "$seleukid_mission_01_babylonia_task_5$"
 me_seleukid_01_babylon.5.desc:0 "Though we have introduced many of our own to the region around Babylon, and a large part of the Babylonian population have become accustomed to our rule, there are still those who oppose us at every turn. We are finding new ways to oversee all our subjects."
 me_seleukid_01_babylon.5.a:0 "Greek, Babylonian, or Aramaic; all bend to our rule."
 me_seleukid_01_babylon.5.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_5$#!' has now been #G Completed#!!"

# Task 6 - Restoring the Satrapy
 me_seleukid_01_babylon.6.t:0 "$seleukid_mission_01_babylonia_task_6$"
 me_seleukid_01_babylon.6.desc:0 "After Seleukos reconquered Babylonia and took back his satrapy, Antigonos sent armies to plunder and ruin what he had lost. Much of Babylon has been restored under our revered rule, and the steps that remained to restore it to the glory of old have been taken."
 me_seleukid_01_babylon.6.a:0 "It is all to inspire loyalty in our subjects."
 me_seleukid_01_babylon.6.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_6$#!' has now been #G Completed#!!"

# Task 7 - Reorganizing the Administration
 me_seleukid_01_babylon.7.t:0 "$seleukid_mission_01_babylonia_task_7$"
 me_seleukid_01_babylon.7.desc:0 "The administration of Babylonia had been mostly left untouched since it was taken from Dareios III. A [ROOT.GetCountry.GetPrimaryCulture.GetName] touch has made it more accustomed and fitting for our rulership."
 me_seleukid_01_babylon.7.a:0 "And it will only get better from here on."
 me_seleukid_01_babylon.7.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_7$#!' has now been #G Completed#!!"

# Task 8 - Local Legitimacy
 me_seleukid_01_babylon.801.t:0 "$seleukid_mission_01_babylonia_task_8$ - Sending [current_steward.GetPraenomen]"
 me_seleukid_01_babylon.801.desc:0 "Our [GetOffice('office_steward').GetCulturalName(SCOPE.GetRootScope.GetCountry)] holds that the country districts hear of us only when the tax-farmers ride through, and that someone seen among them in person is worth more than any proclamation. [current_steward.GetSheHe|U] asks for the season and the silver to prove it, and has gone out to the provinces."
 me_seleukid_01_babylon.801.a:0 "Good luck, [current_steward.GetPraenomen]."

 me_seleukid_01_babylon.8.t:0 "$seleukid_mission_01_babylonia_task_8$ - Babylonian Faith"
 me_seleukid_01_babylon.8.desc:0 "With the help of our [GetOffice('office_steward').GetCulturalName(SCOPE.GetRootScope.GetCountry)] we have sown the seeds of loyalty across the Babylonian satrapy, and we have the continued support of one of the richest regions in the empire of the Persians and Alexander both."
 me_seleukid_01_babylon.8.a:0 "This is just the first step."
 me_seleukid_01_babylon.8.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_8$#!' has now been #G Completed#!!"

# Task 9 - From Ashur to Ikaros
 me_seleukid_01_babylon.9.t:0 "$seleukid_mission_01_babylonia_task_9$"
 me_seleukid_01_babylon.9.desc:0 "Peace breeds prosperity and loyalty, and even the most distant and rural parts of Babylonia are protected by our garrisons now."
 me_seleukid_01_babylon.9.a:0 "Another job well done."
 me_seleukid_01_babylon.9.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_9$#!' has now been #G Completed#!!"

# Task 10 - Babylonian Support
 me_seleukid_01_babylon.10.t:0 "$seleukid_mission_01_babylonia_task_10$"
 me_seleukid_01_babylon.10.desc:0 "The old cities of Babylonia still govern themselves through their assemblies and their temple-councils, as they did under kings a thousand years before us, and their notables carry more weight with the people than any officer we might send. We have courted these men, confirmed their privileges and their gods, and won the citizens and nobles of the ancient cities to our house."
 me_seleukid_01_babylon.10.a:0 "As any [ROOT.GetCountry.GetRulerTitle] should."
 me_seleukid_01_babylon.10.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_10$#!' has now been #G Completed#!!"

# Task 11 - The House of Marduk
 me_seleukid_01_babylon.11.t:0 "$seleukid_mission_01_babylonia_task_11$"
 me_seleukid_01_babylon.11.desc:0 "The Esagila, the great temple of Bel-Marduk, has stood at the heart of Babylon for a thousand years. Its priesthood commands the loyalty of the Babylonians and the wealth of the temple estates. The restorations ordered by Alexander are unfinished no longer."
 me_seleukid_01_babylon.11.a:0 "Endow the Esagila."
 me_seleukid_01_babylon.11.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_11$#!' has now been #G Completed#!!"
 me_seleukid_01_babylon.11.b:0 "Let the god have his city."
 me_seleukid_01_babylon.11.b.tt:0 "#E #Y [GetProvince('(int32)918').GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!"

# Task 12 - The Eanna of Uruk
 me_seleukid_01_babylon.12.t:0 "$seleukid_mission_01_babylonia_task_12$"
 me_seleukid_01_babylon.12.desc:0 "At Uruk the temples of Anu and Ishtar have been raised grander than ever, and the priestly families of the city grow rich and powerful."
 me_seleukid_01_babylon.12.a:0 "Endow the sanctuaries."
 me_seleukid_01_babylon.12.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_12$#!' has now been #G Completed#!!"
 me_seleukid_01_babylon.12.b:0 "Anu's priests will govern on our behalf."
 me_seleukid_01_babylon.12.b.tt:0 "#E #Y [GetProvince('(int32)937').GetName]#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!"

# Task 13 - Seleucia on the Tigris
 me_seleukid_01_babylon.13.t:0 "$seleukid_mission_01_babylonia_task_13$"
 me_seleukid_01_babylon.13.desc:0 "Seleukeia was laid out where the Royal Canal comes down to the Tigris, and Babylon has been emptying into it ever since. The priests complain that the city takes their people faster than they can be replaced. [GetProvince('(int32)911').GetName] had outgrown the plan we drew for it, and the plan has been redrawn to the measure of a metropolis."
 me_seleukid_01_babylon.13.a:0 "[GetProvince('(int32)911').GetName] stands tall."
 me_seleukid_01_babylon.13.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_13$#!' has now been #G Completed#!!"

# Task 14 - Antioch in Sittacene
 me_seleukid_01_babylon.14.t:0 "$seleukid_mission_01_babylonia_task_14$"
 me_seleukid_01_babylon.14.desc:0 "Sittacene lies between the Tigris and the Tornadotus, good black soil the whole way, and nothing Greek on it but Seleukeia at the far end. The old Babylonian town at [GetProvince('(int32)899').GetName] is ours now, and a fresh colony has been planted beside it on the plains of [GetProvince('(int32)898').GetName]."
 me_seleukid_01_babylon.14.a:0 "Greek roofs over the Babylonian fields."
 me_seleukid_01_babylon.14.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_14$#!' has now been #G Completed#!!"

# Task 15 - Colony in Sittacene

# Task 16 - Settling Chaldaea
 me_seleukid_01_babylon.16.t:0 "$seleukid_mission_01_babylonia_task_16$"
 me_seleukid_01_babylon.16.desc:0 "The region of Chaldaea is ancient and mysterious. We had already founded a Greek center of power there at [GetProvince('(int32)933').GetName], and this wild land is tamed further now. A secondary 'Apameia' on the Selaeus river and a colony further inland, closer to our capital, will Hellenize the province of Chaldaea much faster."
 me_seleukid_01_babylon.16.a:0 "Even old Chaldaea will learn Greek ways."
 me_seleukid_01_babylon.16.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_16$#!' has now been #G Completed#!!"

# Task 17 - City of the Sun God
 me_seleukid_01_babylon.17.t:0 "$seleukid_mission_01_babylonia_task_17$"
 me_seleukid_01_babylon.17.desc:0 "The ancient Babylonian city of [GetProvince('(int32)910').GetName] had fallen into ruin and disrepair. Repurposed into a new [ROOT.GetCountry.GetAdjective] colony, it is our first Greek polis in the province of Babylonia, and it takes the name of [GetCharacter('(int32)24').GetPraenomen] himself."
 me_seleukid_01_babylon.17.a:0 "An ancient city wakes bearing a Greek name."
 me_seleukid_01_babylon.17.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_17$#!' has now been #G Completed#!!"

# Task 18 - Antioch on the Ishtar Canal
 me_seleukid_01_babylon.18.t:0 "$seleukid_mission_01_babylonia_task_18$"
 me_seleukid_01_babylon.18.desc:0 "[GetProvince('(int32)937').GetName] is the legendary capital of the Sumer, and one of the oldest cities in the world. Time had not been kind to this once magnificent city, and it was nothing more than a dilapidated ruin. Our administrators drew up plans for a complete restoration of [GetProvince('(int32)937').GetName], with a new name; 'Antioch on the Ishtar Canal', and the work is done."
 me_seleukid_01_babylon.18.a:0 "And it is only fair we get to name it then."
 me_seleukid_01_babylon.18.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_18$#!' has now been #G Completed#!!"

# Task 19 - The Capital of Characene
 me_seleukid_01_babylon.19.t:0 "$seleukid_mission_01_babylonia_task_19$"
 me_seleukid_01_babylon.19.desc:0 "Characene is the gate to the Erythraean Sea. Alexander himself planted the town at [GetProvince('(int32)940').GetName], where the Tigris runs out into the ocean roads and the Arabian trade comes up past it. It has been built up, and we sit on that trade rather than beside it."
 me_seleukid_01_babylon.19.a:0 "On to Arabia."
 me_seleukid_01_babylon.19.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_19$#!' has now been #G Completed#!!"

# Task 20 - Seleucia on the Erythraean Sea
 me_seleukid_01_babylon.20.t:0 "$seleukid_mission_01_babylonia_task_20$"
 me_seleukid_01_babylon.20.desc:0 "The coast of Characene was relatively unsettled, putting us at a disadvantage for trade with the kingdoms to the East. We have established a [ROOT.GetCountry.GetAdjective] colony on the Erythraean coast, and it opens up our empire to the riches of India and beyond."
 me_seleukid_01_babylon.20.a:0 "At last, a Greek port opens to the Indian sea."
 me_seleukid_01_babylon.20.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_20$#!' has now been #G Completed#!!"

# Task 21 - Colonize the Arabian Coast
 me_seleukid_01_babylon.21.t:0 "$seleukid_mission_01_babylonia_task_21$"
 me_seleukid_01_babylon.21.desc:0 "Alexander had planned an invasion of Arabia before his untimely death. As the rightful heirs to his legacy, we have expanded into the Arabian coast."
 me_seleukid_01_babylon.21.a:0 "The coast of Arabia is ours."
 me_seleukid_01_babylon.21.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_21$#!' has now been #G Completed#!!"

# Task 22 - The Loyal Satrapy
 me_seleukid_01_babylon.22.t:0 "$seleukid_mission_01_babylonia_task_22$"
 me_seleukid_01_babylon.22.desc:0 "Though Babylonia was once taken by the troops of one-eyed Antigonos, it stayed loyal to Seleukos throughout the entire endeavor. Now the satrapy has been bound tightly to the [ROOT.GetCountry.GetRuler.GetFamily.GetName] dynasty, and we can depend on it for taxes and levies both."
 me_seleukid_01_babylon.22.a:0 "The satrapy is ours entire."
 me_seleukid_01_babylon.22.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_22$#!' has now been #G Completed#!!"

# Task 23 - Ikaros of the Persian Gulf
 me_seleukid_01_babylon.23.t:0 "Ikaros of the Persian Gulf"
 me_seleukid_01_babylon.23.desc:0 "Alexander named this island Ikaros for its likeness to the Aegean isle. At the head of the Erythraean Sea we have planted a Greek colony and invited settlers from the old country to people it. Now we must settle its governance."
 me_seleukid_01_babylon.23.a:0 "Ikaros, a city of Characene, nothing more."
 me_seleukid_01_babylon.23.b:0 "Let it stand as a free Greek city."
 me_seleukid_01_babylon.23.b.tt:0 "#E #Y Ikaros#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Tributary#!"
 me_seleukid_01_babylon.23.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_23$#!' has now been #G Completed#!!"
 me_seleukid_01_babylon.23.c:0 "Cede the island to Tylos."

# Task 24 - The Isle of Oaracta
 me_seleukid_01_babylon.24.t:0 "$seleukid_mission_01_babylonia_task_24$"
 me_seleukid_01_babylon.24.desc:0 "On the island of Oaracta the Persian hyparch Mazenes guided Nearchos through the straits. So loyal a man could hold these waters in the name of [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName], whether in Carmania or upon the isles themselves."
 me_seleukid_01_babylon.24.a:0 "Make him satrap of Carmania."
 me_seleukid_01_babylon.24.b:0 "Give him Tylos and the Isles."
 me_seleukid_01_babylon.24.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_24$#!' has now been #G Completed#!!"

# Task 25 - Intimidating Gerrha
 me_seleukid_01_babylon.25.t:0 "The Merchants of Gerrha"
 me_seleukid_01_babylon.25.desc:0 "Gerrha, the great incense-city of the Arabs, grows rich on the caravan trade. Our royal fleet gathered in her waters has brought her merchants to terms without a siege."
 me_seleukid_01_babylon.25.a:0 "A welcome development."
 me_seleukid_01_babylon.25.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_25$#!' has now been #G Completed#!!"

 me_seleukid_01_babylon.26.t:0 "A Persian Set Above Us"
 me_seleukid_01_babylon.26.desc:0 "Word comes from [ROOT.GetCountry.GetOverlord.GetCapital.GetName] that [ROOT.GetCountry.GetOverlord.GetName] intends to set [ariobarzanes_gulf_scope.GetName], a Persian lord over [ROOT.GetCountry.GetOverlord.GetName]."
 me_seleukid_01_babylon.26.a:0 "So it must be, for now..."
 me_seleukid_01_babylon.26.b:0 "We will never bow to a Persian!"

 me_seleukid_01_babylon.27.t:0 "A Persian Set Above Us"
 me_seleukid_01_babylon.27.desc:0 "Word comes from [ROOT.GetCountry.GetOverlord.GetCapital.GetName] that [ROOT.GetCountry.GetOverlord.GetName] intends to set [ariobarzanes_gulf_scope.GetName], a Persian lord over [ROOT.GetCountry.GetOverlord.GetName]."
 me_seleukid_01_babylon.27.a:0 "So it must be, for now..."
 me_seleukid_01_babylon.27.b:0 "We will never bow to a Persian!"

# Task 26 - Satrap of the Gulf
 me_seleukid_01_babylon.28.t:0 "$seleukid_mission_01_babylonia_task_26$"
 me_seleukid_01_babylon.28.desc:0 "Charax Spasinu commands the head of the Erythraean Sea, where the Tigris runs out to the ocean roads. The Gulf keeps its own seasons and its own reckoning of who is master, and word from Antioch arrives there long after it is of use. #E Hyspaosines#! the Bactrian governs the place and has the monsoon trade in hand."
 me_seleukid_01_babylon.28.a:0 "The status quo will do."
 me_seleukid_01_babylon.28.b:0 "Hyspaosines will be raised up."
 me_seleukid_01_babylon.28.b.tt:0 "#E #Y Characene#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Satrapy#!\n#E Hyspaosines#! becomes the ruler of #E #Y Characene#!#!"
 me_seleukid_01_babylon.28.complete.tt:0 "The mission task '#Y $seleukid_mission_01_babylonia_task_26$#!' has now been #G Completed#!!"

 me_seleukid_01_babylon.500.t:0 "$seleukid_mission_01_babylonia$"
 me_seleukid_01_babylon.500.desc:0 "Babylonia has been restored to its former glory, with the ruinous campaign of [GetCharacter('(int32)37').GetPraenomen] long forgotten. All across the satrapy people are closely linking our dynasty with that of their local faith, and our popularity have risen to new heights.\n\nWith Babylonia unquestionably loyal to our cause, we are looking to new areas of interest."
 me_seleukid_01_babylon.500.a:0 "Whoever holds Babylonia is the true heir of [GetCharacter('(int32)39').GetPraenomen]."
 me_seleukid_01_babylon.500.a.tt:0 "The mission '#Y $seleukid_mission_01_babylonia$#!' has now been #G Completed#!!"

 me_seleukid_01_babylon.501.t:0 "The Babylonian Priest"
 me_seleukid_01_babylon.501.desc:0 "With nobody to share their views at our court, the priesthood of Babylon has decided to send us another delegate. [babylonian_priest_scope.GetPraenomen] seems well-read and ready to serve from the moment [babylonian_priest_scope.GetSheHe] sets foot at court."
 me_seleukid_01_babylon.501.a:0 "[babylonian_priest_scope.GetSheHe|U] is of course welcome to stay."
 me_seleukid_01_babylon.501.a.tt:0 "[babylonian_priest_scope.GetPraenomen] is invited to stay at our court."
 me_seleukid_01_babylon.501.b:0 "We have no interest in one of their spies."
 me_seleukid_01_babylon.501.b.tt:0 "[babylonian_priest_scope.GetPraenomen] is barred from our court."
 me_seleukid_01_babylon.501.c:0 "Tell them to stop sending any of their priests to [ROOT.GetCountry.GetCapital.GetName]."
 me_seleukid_01_babylon.501.c.tt:0 "The priesthood in Babylon will stop sending us any of their priests."

################################################################
# 02 SYRIA
################################################################

 seleukid_mission_02_syria:0 "Syrian Ambition"
 seleukid_mission_02_syria_DESCRIPTION:0 "The other Successors all sit on the Mediterranean and talk to one another across it. We sit inland at Babylonia and hear of their business late. Syria would give us a coast of our own and a voice in the west."
 seleukid_mission_02_syria_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when we have taken control of Syria and settled it as a second seat of our realm."
 seleukid_mission_02_syria_BUTTON_TOOLTIP:0 "We are looking to Syria as a new possible port towards the west."

# ============================================================
# Missions
# ============================================================

 seleukid_mission_02_syria_task_1:0 "Syrian Dreams"
 seleukid_mission_02_syria_task_1_DESC:0 "We need to prepare our troops for a campaign towards [GetProvince('(int32)789').GetArea.GetRegion.GetName], as we know just how dangerous the trek towards that area can be if we start unprepared."

 seleukid_mission_02_syria_task_2:0 "Home of the Antigonids"
 seleukid_mission_02_syria_task_2_DESC:0 "Greek settlements and villages, and the old Antigonid capital, lie on the western shores. One of our first goals should be to take control of the lower parts of the Orontes river."

 seleukid_mission_02_syria_task_3:0 "By the Amanos Mountains"
 seleukid_mission_02_syria_task_3_DESC:0 "On the eastern side of [GetProvince('(int32)789').GetArea.GetRegion.GetName] lie ancient Aramaic cities and villages, with the occasional new Greek settlement among them. This country stood between us and the richer Antigonid lands, and the road from Babylonia to the sea runs through it."

 seleukid_mission_02_syria_task_4:0 "Syrian Governance"
 seleukid_mission_02_syria_task_4_DESC:0 "New cities are worth only as much of the country as they hold down. As we settle [GetProvince('(int32)789').GetArea.GetRegion.GetName] we will tie the villages and farmland to the colonies, and govern the whole region through them."
 seleukid_mission_02_syria_task_4_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! have at least #Y [SCOPE.ScriptValue('seleukid_mission_02_syria_task_4_total')|0]#! cities in #Y [GetProvince('(int32)790').GetArea.GetName]#! and #Y [GetProvince('(int32)810').GetArea.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_02_syria_task_4_loc')]"

 seleukid_mission_02_syria_task_5:0 "Antioch on the Orontes"
 seleukid_mission_02_syria_task_5_DESC:0 "Where the Orontes bends toward the sea, Antigonos raised his city of Antigoneia and meant it for the capital of Asia. That dream died with him at Ipsos. Upon the same well-watered plain, beneath Mount Silpius, we shall raise a greater city and name it Antioch after Antiochos our father; it shall be the seat and glory of our house."

 seleukid_mission_02_syria_task_6:0 "A Mediterranean Capital"
 seleukid_mission_02_syria_task_6_DESC:0 "Seleukeia on the Tigris has served as our eastern seat, but the heart of the realm now lies in the west, upon the shores of the Middle Sea. Antioch, grown great upon the Orontes, is fit to be the capital of the whole kingdom. We should move the royal seat there and make it the first city of Asia."
 seleukid_mission_02_syria_task_6_effect_tt:0 "Choose whether to make #Y [GetProvince('(int32)790').GetName]#! our capital."
 seleukid_mission_02_syria_task_6_population_trigger_tt:0 "#Y [THIS.GetProvince.GetName]#! has a population of at least #Y [SCOPE.ScriptValue('seleukid_mission_02_syria_task_6_population_total')|0]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_02_syria_task_6_population_loc')]"
 seleukid_mission_02_syria_task_6_buildings_trigger_tt:0 "#Y [THIS.GetProvince.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_02_syria_task_6_buildings_total')|0]#! buildings. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_02_syria_task_6_buildings_loc')] [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_02_syria_task_6_building_check_loc')]"

 seleukid_mission_02_syria_task_7:0 "Ensuring Control"
 seleukid_mission_02_syria_task_7_DESC:0 "A country is held by its edges. To the west the passes of the Amanus let armies down onto our plain, and to the east [GetProvince('(int32)810').GetName] carries the road across the Euphrates into our heartland. We should raise a network of forts and walled settlements along these approaches, so that any invader who comes at [GetProvince('(int32)789').GetArea.GetRegion.GetName] struggles to find safe passage through it."
 seleukid_mission_02_syria_task_7_trigger_tt:0 "The Province of #Y [THIS.GetProvince.GetState.GetShortName]#! is owned by #Y [SCOPE.GetRootScope.GetCountry.GetName]#! and has a province loyalty of at least #Y [SCOPE.ScriptValue('seleukid_mission_02_syria_task_7_total')|0]#!. [THIS.GetProvince.Custom('seleukid_mission_02_syria_task_7_loc')]"
 seleukid_mission_02_syria_task_7_fort_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_02_syria_task_7_fort_total')|0]#! #Y Fortresses#! in the Provinces of #Y [GetProvince('(int32)790').GetArea.GetName]#! and #Y [GetProvince('(int32)810').GetArea.GetName]#!. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_02_syria_task_7_fort_loc')]"

 seleukid_mission_02_syria_task_8:0 "Greek Settlers"
 seleukid_mission_02_syria_task_8_DESC:0 "[GetProvince('(int32)789').GetArea.GetRegion.GetName] has cities enough drawn on the map and too few men in them. Greeks will cross for land, and now that we hold a Mediterranean port they can come by sea rather than the long way overland."
 seleukid_mission_02_syria_task_8_effect_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! will appeal to [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetCultureGroup.GetName] Pops in #Y [GetProvince('(int32)416').GetArea.GetRegion.GetName]#!, #Y [GetProvince('(int32)379').GetArea.GetRegion.GetName]#! and #Y [GetProvince('(int32)290').GetArea.GetRegion.GetName]#! to migrate to [SCOPE.GetRootScope.GetCountry.GetAdjective] cities in #Y [GetProvince('(int32)789').GetArea.GetName]#! and #Y [GetProvince('(int32)810').GetArea.GetName]#!."

 seleukid_mission_02_syria_task_9:0 "Through the Syrian Gates"
 seleukid_mission_02_syria_task_9_DESC:0 "The road from Syria into Cilicia climbs the Amanus by the Syrian Gates and comes down to the Gulf of Issus, where Alexander broke the Persian king. If we mean to carry our power west, we must hold that corridor: [GetProvince('(int32)795').GetName] under the mountain, [GetProvince('(int32)1879').GetName] on the gulf, and the gate-towns of [GetProvince('(int32)1873').GetName] and [GetProvince('(int32)1874').GetName] behind them."

 seleukid_mission_02_syria_task_10:0 "The Lands of Mopsus"
 seleukid_mission_02_syria_task_10_DESC:0 "[GetProvince('(int32)1880').GetName], on the Pyramos, is the town the seer Mopsus is said to have raised when he came into Cilicia after the fall of Troy. We will refound it as a city of our house, Seleukeia on the Pyramos, to hold the eastern stretches of the [GetProvince('(int32)1880').GetArea.GetName] and the road down from the gates."
 seleukid_mission_02_syria_task_10_tt:0 "#Y [THIS.GetProvince.GetName]#! has at least #Y [SCOPE.ScriptValue('seleukid_mission_02_syria_task_10_total')|0]#! buildings. [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_02_syria_task_10_buildings_loc')] [SCOPE.GetRootScope.GetCountry.Custom('seleukid_mission_02_syria_task_10_building_check_loc')]"

 seleukid_mission_02_syria_task_11:0 "The Oracle of Mallos"
 seleukid_mission_02_syria_task_11_DESC:0 "We have heard tales of an ancient oracle in the country around [GetProvince('(int32)1881').GetName], long since fallen into poverty. If we restore the temples and holy sites there, the oracle may be brought to speak for us."
 seleukid_mission_02_syria_task_11_effect_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! will receive occasional boons from the oracle in #Y [GetProvince('(int32)1881').GetName]#!."

 seleukid_mission_02_syria_task_12:0 "The Temple of Atargatis"
 seleukid_mission_02_syria_task_12_DESC:0 "At Bambyce, which the Syrians call Manbog and the Greeks Hierapolis, stands the great sanctuary of Atargatis, the Syrian Goddess, and her consort Hadad. Her sacred fish fill the temple pools, and her eunuch priests, heirs to the line of Abd-Hadad, have struck their own coin and ruled the holy city since the days of the Persians. Her worship reaches far beyond the town, from the Lebanon to the heights of Mount Hermon."
 seleukid_mission_02_syria_task_12_effect_tt:0 "#E #Y [GetProvince('(int32)807').GetName]#!#! can be released as a [THIS.GetCountry.GetAdjective] #E Temple State#! or a #E Tributary#!"

 seleukid_mission_02_syria_task_13:0 "The Priests of Olba"
 seleukid_mission_02_syria_task_13_DESC:0 "In the rough highlands of Cilicia the temple of Zeus Olbios is served by a dynasty of priest-kings who trace their descent from Teucer of Salamis and bear in turn the names Teukros and Aias. From their tower-crowned sanctuary at Olba they command the loyalty of the wild Cilicians."
 seleukid_mission_02_syria_task_13_effect_tt:0 "#E #Y [GetProvince('(int32)1894').GetName]#!#! can be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!"

 seleukid_mission_02_syria_task_14:0 "The Treasury at Kyinda"
 seleukid_mission_02_syria_task_14_DESC:0 "The fortress of Kyinda in the Cilician hills served the kings before us as a stronghold for their bullion; here Eumenes and the Silver Shields once drew upon the royal treasure of Asia. Secured and garrisoned anew, it can serve as the western treasury of our realm."

 seleukid_mission_02_syria_task_15:0 "An Ituraean in Arca"
 seleukid_mission_02_syria_task_15_DESC:0 "The hill-country behind Arca is held by the Ituraeans, an Arab people of the Lebanon whose chieftains raid and trade along the coast. Foremost among them is the house of Soaimus. Rather than garrison this restless frontier ourselves, we might raise one of these Ituraean princes to hold 'Arqa in our name."
 seleukid_mission_02_syria_task_15_effect_tt:0 "#E #Y [GetProvince('(int32)771').GetName]#!#! can be released as a [THIS.GetCountry.GetAdjective] #E Tributary#!"

 seleukid_mission_02_syria_task_16:0 "The Temple of Artemis Perasia"
 seleukid_mission_02_syria_task_16_DESC:0 "At Castabala in the Cilician plain stands the sanctuary of Artemis Perasia, an ancient goddess whose priestesses were said to walk barefoot over burning coals and take no hurt. The Persians knew her for a kin of Anahita, the Greeks for Artemis."
 seleukid_mission_02_syria_task_16_effect_tt:0 "#E #Y [GetProvince('(int32)1875').GetName]#!#! can be released as a [THIS.GetCountry.GetAdjective] #E Temple State#! or a #E Tributary#!"

 seleukid_mission_02_syria_task_17:0 "The Free Cities of Cilicia"
 seleukid_mission_02_syria_task_17_DESC:0 "The old Greek cities of the Cilician coast have chafe under foreign rule. Alexander freed Mallos, a colony of Argos, from the tribute it owed Dareios, and left the Solians their democracy."
 seleukid_mission_02_syria_task_17_effect_tt:0 "#E #Y Soloi#!#! and #E #Y Mallos#!#! can be released as [ROOT.GetCountry.GetAdjective] #E Feudatories#!"

 seleukid_mission_02_syria_task_18:0 "The Elephants of Apameia"
 seleukid_mission_02_syria_task_18_DESC:0 "At Apameia the water-meadows of the Orontes run broad and green. Here we will raise the elephant stables and turn out thirty thousand mares to the royal pastures, and lay the whole out as a muster-ground for the army."

 seleukid_mission_02_syria_task_19:0 "The Moon-Temple of Carrhae"
 seleukid_mission_02_syria_task_19_DESC:0 "At Carrhae, which the Assyrians called the City of the Moon, stands the temple of Sin, whose silver crescent has been worshiped at Harran since long before Assyria. There are Macedonians in the town as well. [GetCharacter('(int32)37').GetPraenomen] planted a colony of them here, and when [GetCharacter('(int32)24').GetPraenomen] came through on his march to take Babylon back, with only a few hundred men at his back, he pressed some of those colonists into his column and went on."
 seleukid_mission_02_syria_task_19_effect_tt:0 "#E #Y [GetProvince('(int32)819').GetName]#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Temple State#!"

 seleukid_mission_02_syria_task_20:0 "Zeus of Baetocaece"
 seleukid_mission_02_syria_task_20_DESC:0 "At Baetocaece in the hills above the coast lies a sacred village given over to Zeus, though the country folk name the god only for their village, and the old tales call him Hadad the storm-god. A king before us set his grant in a letter, giving the god the village and all its revenues, its markets and its holy days, that his temple might prosper. We should renew this royal grant, or give the god his village outright."
 seleukid_mission_02_syria_task_20_effect_tt:0 "#E #Y [GetProvince('(int32)8011').GetName]#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Temple State#!"

 seleukid_mission_02_syria_task_21:0 "A Royal Fleet"
 seleukid_mission_02_syria_task_21_DESC:0 "The mouth of the Orontes at [GetProvince('(int32)789').GetName] is the natural station for a royal war-fleet. With the shipwrights of Phoenicia at our command and the treasury opened, we may build a navy worthy of the eastern sea."

 seleukid_mission_02_syria_task_22:0 "The Thessalians of Syria"
 seleukid_mission_02_syria_task_22_DESC:0 "Larissa and Doliche in the Syrian land bear the names of old Thessaly, for it was Thessalian horsemen whom the kings settled here. We should draw fresh settlers from that homeland of horsemen and strengthen the studs and squadrons of our realm."

 seleukid_mission_02_syria_task_23:0 "The Vineyards of Chalybon"
 seleukid_mission_02_syria_task_23_DESC:0 "The wine of Chalybon was the reserved drink of the Great Kings of Persia, who would touch no other. The vineyards on the slopes above the Belus still yield that famous vintage. Developed and made our own, the royal wine will fill the treasury and grace the tables of Antioch."

 seleukid_mission_02_syria_task_24:0 "The Field of Triparadeisos"
 seleukid_mission_02_syria_task_24_DESC:0 "Here at Triparadeisos, when the generals divided the empire, Seleukos was granted the satrapy of Babylonia, the seed from which our whole dominion grew. In the fields of Triparadeisos, we should raise a monument to commemorate the spot where the fortunes of our house was made."

 seleukid_mission_02_syria_task_25:0 "Founding Cyrrhus"
 seleukid_mission_02_syria_task_25_DESC:0 "The Macedonians who came with us named their new colonies for the homes they left behind. Where the settlement of Omeros stands, on the road between Antioch and the Euphrates, we shall raise a city and call it Kyrrhos, after Cyrrhus in Emathia, and settle it with veterans of the phalanx, the Cyrrhestai, who will give Athena Kyrrhestis a home in their new city."

 seleukid_mission_02_syria_task_26:0 "A Dynast of Cyrrhestica"
 seleukid_mission_02_syria_task_26_DESC:0 "The frontier north of Antioch, wedged between the Amanus and the Euphrates, is a hard land to govern from [ROOT.GetCountry.GetCapital.GetName]. There is among its people a local noble named Pharnaeus, a man of some standing."
 seleukid_mission_02_syria_task_26_effect_tt:0 "#E #Y Cyrrhestica#!#! can be released as a [ROOT.GetCountry.GetAdjective] #E Satrapy#!"

 seleukid_mission_02_syria_task_final:0 "A Second Home"
 seleukid_mission_02_syria_task_final_DESC:0 "[GetProvince('(int32)789').GetArea.GetRegion.GetName] has been settled, garrisoned and governed. The court can sit at Antioch as readily as at Seleukeia now, and the realm has two homes instead of one."

 seleukid_mission_02_syria_finish_tt:0 "#G Completing this task finishes#! #E #T Syrian Ambition#!#! and #G unlocks#! two mission trees: #E #T Western Dreams#!#! and #E #T To the Borders of Egypt#!#!."

