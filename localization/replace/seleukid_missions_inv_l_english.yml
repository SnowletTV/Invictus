# Task 1 - Assyrian Expansion
 me_seleukid_05_assyria.101.t:0 "$seleukid_mission_05_assyria_armenia_task_1$"
 me_seleukid_05_assyria.101.desc:0 "The north has learned to do without us, and the columns that would remind it otherwise are not yet paid for. The tally sheets laid before us reckon what the muster will cost in grain, remounts, and the pay of the settler-levies. Heralds can go ahead of them to read out the old settlement, but heralds do not feed a host, and nothing else in this hall can be decided until the treasury is opened."
 me_seleukid_05_assyria.101.a:0 "Open the treasury; let the muster begin."

 me_seleukid_05_assyria.1.t:0 "$seleukid_mission_05_assyria_armenia_task_1$"
 me_seleukid_05_assyria.1.desc:0 "Assyria and Arbelitis were commands in their own right when Alexander's officers divided the empire, and everything north of Babylon has been governed with Babylon ever since, for no one has ever held the one without the other for long. Then the long wars in the west drew our armies off, the tribute stopped coming, and the north learned to do without us.\n\nThe treasury has been opened for the muster, and the heralds have gone ahead of the columns to remind these lands whose they were, reading out the old settlement at Nisibis and at every garrison gate between the Euphrates and the Zab. The army is standing, and every province from the Zab to the Armenian highlands is open to our claim."
 me_seleukid_05_assyria.1.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_1$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.1.a:0 "The whole of the north shall answer to us once more."

# Task 2 - The District of Chalonitis
 me_seleukid_05_assyria.2.t:0 "$seleukid_mission_05_assyria_armenia_task_2$"
 me_seleukid_05_assyria.2.desc:0 "Chalonitis lies where Babylonia gives out and the hills begin. The road from Seleukeia passes Apolloniatis and the Greek city of Artemita, then crosses this district by its five villages and its posting station, and a few schoeni beyond them Zagros rises and Media starts. It is a gate, and we no longer keep a gate with villages. Kelonai stands walled, given the buildings a city requires, and settled with Greek speakers brought up out of Syria; on the milestones and in the registers the place is written Chala, and the road on to Adiabene begins in our hands and not in another's."
 me_seleukid_05_assyria.2.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_2$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.2.a:0 "The road north is open."

# Task 3 - Conquest of Adiabene
 me_seleukid_05_assyria.3.t:0 "$seleukid_mission_05_assyria_armenia_task_3$"
 me_seleukid_05_assyria.3.desc:0 "Adiabene is the country between the two Zab rivers, which the Greeks call the Lycus and the Caprus, and its heart is Arbela with its citadel and its oracle of Ishtar. Out on the plain lies a village the Persians named the Camel's House, Gaugamela, an estate set aside by Dareios son of Hystaspes to keep the beast that had carried his baggage into Scythia. There [GetCharacter('(int32)39').GetPraenomen] broke the last army of the Great King, though the histories still name the day after Arbela, some six hundred stades distant. The whole district is ours now and settled quiet. That field has been marked with a memorial, and the priests come down from Arbela to make the offerings over it; the country has been fortified, and beside Arbela, at Hazza, a colony of our own has been planted and goes onto the dies as Dimitriada, of the Demetrians by the Tigris."
 me_seleukid_05_assyria.3.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_3$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.3.a:0 "Let the memory of Gaugamela endure."

# Task 4 - Colony in Apolloniatis
 me_seleukid_05_assyria.4.t:0 "$seleukid_mission_05_assyria_armenia_task_4$"
 me_seleukid_05_assyria.4.desc:0 "East of the Tigris lies Apolloniatis, the district the Persians governed as Sittakene, a country of canals and date-groves that our surveyors have renamed for Apollo, from whom our house counts its descent. Greeks were thin on the ground here: Artemita on the Sillas was the only town of any size, and the villages between it and the river were Babylonian still, working their allotments as they did under Dareios. Now, at our own cost, settlers come down out of Syria and the old town has been raised anew as Apameia Archidos, for Apama, daughter of Spitamenes, whom Seleukos married at Sousa. The Babylonians of the district keep their fields and their canals, and a city of our planting on this bank holds the road between Babylonia and Media in our hands."
 me_seleukid_05_assyria.4.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_4$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.4.a:0 "Let the surveyors peg out the streets."

# Task 5 - Holy City of Assur
 me_seleukid_05_assyria.5.t:0 "$seleukid_mission_05_assyria_armenia_task_5$"
 me_seleukid_05_assyria.5.desc:0 "Assur upon the Tigris, ancient seat of Ashur the city-god from whom the Assyrians and their whole land take their name, had stood broken since the Medes came down and threw its walls into the river. Its priests never left. They kept the offerings among the ruins, and they can still read out the inscriptions of kings who never called the city their property, but styled themselves only the god's steward in it. The priests of Ashur come before [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName] with the question they have not dared to put since the sack: whether we hold the holy city in our own hands, or give the god his estate again and let his priests govern the sacred lands in his name."
 me_seleukid_05_assyria.5.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_5$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.5.a:0 "Excellent work."
 me_seleukid_05_assyria.5.b:0 "Henceforth, the priests of Assur will pay no tax."
 me_seleukid_05_assyria.5.b.tt:0 "#E #Y Assur#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Temple State#!"

# Task 6 - Sennacherib's Palace
 me_seleukid_05_assyria.6.t:0 "$seleukid_mission_05_assyria_armenia_task_6$"
 me_seleukid_05_assyria.6.desc:0 "At Nineveh stood the ruins of the house that Sennacherib called the Palace Without Rival, eighty rooms and more above the Tigris, its gates held by winged bulls of thirty tons that were dragged whole from quarries a day's march away. It had been open to the weather since the Medes and the Babylonians burned the city, and when the Ten Thousand marched beneath that wall on their way out of Persia they took the ruin for a town of the Medes and never learned whose it had been. Nineveh had its forum and its works already, so this has asked nothing of our treasury and only the labor of the city: the halls have been cleared and the colossi set upright at the gates, the inscriptions cut along their flanks still legible after three hundred years in the open. The great men of Assyria take it well that a [ROOT.GetCountry.GetAdjective] king restores the house of their kings rather than quarrying it for stone."
 me_seleukid_05_assyria.6.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_6$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.6.a:0 "Let the house of Sennacherib stand again."

# Task 7 - Refound Nisibis
 me_seleukid_05_assyria.7.t:0 "$seleukid_mission_05_assyria_armenia_task_7$"
 me_seleukid_05_assyria.7.desc:0 "Nisibis stands on the Mygdonios beneath Mount Masios, on the road that runs from the Tigris crossings west to Zeugma and the Euphrates. The Macedonian settlers of the plain named the whole district Mygdonia, after the Mygdonia they left behind between the Axios and the Strymon, and they had long called the town Antiocheia in Mygdonia. Now the place has been built out to a proper city and refounded under that name, with Syriote colonists enrolled in it, and an army coming down out of Armenia must pass beneath our walls."
 me_seleukid_05_assyria.7.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_7$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.7.a:0 "Antiocheia in Mygdonia it shall be."

# Task 8 - Colony in Corduene
 me_seleukid_05_assyria.8.t:0 "$seleukid_mission_05_assyria_armenia_task_8$"
 me_seleukid_05_assyria.8.desc:0 "Above the Tigris rise the hills of Corduene, whose people Xenophon's Greeks knew as the Karduchoi and fought through for seven days without buying a day's peace. They answer to no king, only to their own headmen in the high valleys, and their archers will serve whoever holds the passes down into Armenia. Their towns, Pinaka and Sareisa, are hill forts rather than cities, and no Greek had yet settled among them. A colony of our own has been planted there, Epiphaneia on the Tigris, which our clerks write as Epiphaneia Tigridos, with Syriote settlers given lots in it."
 me_seleukid_05_assyria.8.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_8$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.8.a:0 "Excellent work."

# Task 9 - The Capital of Assyria
 me_seleukid_05_assyria.9.t:0 "$seleukid_mission_05_assyria_armenia_task_9$"
 me_seleukid_05_assyria.9.desc:0 "The ground at Adma is fed by a spring so abundant that the Greeks who first saw it called it Kallirhoe, the fair-flowing, and its pools do not fail in summer. The Aramaeans of the place know it as Orhai. It has been given the name of Edessa, after the old royal seat in Macedon that stands likewise upon its waters, and Macedonian nobles and settlers have been planted in it as a colony of the first rank. It sits at the head of the Balikh, on the road that runs from the Euphrates crossings east to Nisibis, and a satrapy of Assyria that is to be governed at all must be governed from there. The city has been built out and the seat of Assyria moved within its walls, and from there [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName] shall govern the north."
 me_seleukid_05_assyria.9.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_9$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.9.a:0 "Let Edessa be our seat."

# Task 10 - Refound Tella
 me_seleukid_05_assyria.10.t:0 "$seleukid_mission_05_assyria_armenia_task_10$"
 me_seleukid_05_assyria.10.desc:0 "East of Edessa, on the road to Nisibis, stands the town the Aramaeans call Tella, the mound, where the sown ground gives out and the steppe begins. The Greeks name that steppe Arabia, for the tent-dwelling Arabs who pasture it and answer to no satrap. The mound has been walled and built out, and Syriote colonists have been settled in it. Refounded, it is Antiocheia Arabiki, Antioch in Arabia, taking its name from the country it watches rather than from any river, and the caravans and the garrisons have a fixed stage between the two cities at last."
 me_seleukid_05_assyria.10.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_10$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.10.a:0 "Let the mound be a city."

# Task 11 - Colonies in Commagene
 me_seleukid_05_assyria.11.t:0 "$seleukid_mission_05_assyria_armenia_task_11$"
 me_seleukid_05_assyria.11.desc:0 "Where the Euphrates runs shallow enough to bridge, Seleukos Nikator set twin towns on either bank, Seleukeia on the near shore and Apameia opposite it, named for his wife. The pontoon strung between them gave the place its name, Zeugma, the yoking, and every army and caravan bound east from Antioch must pass it. Upstream at Samosata the Orontid Samos raised his seat on the old Kummuh mound, and whoever holds the two holds the river road entire. At our own cost the settlers are come up the river and Macedonians enrolled in both, so that Samosata rises as Antiocheia Kommaginis and the crossing as Seleukeia Zeugmatos. Both are our foundations now, Macedonians in their assemblies and our men at the yoke of the Euphrates."
 me_seleukid_05_assyria.11.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_11$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.11.a:0 "The crossing is ours."

# Task 12 - The Kingdom of Sophene
 me_seleukid_05_assyria.12.t:0 "$seleukid_mission_05_assyria_armenia_task_12$"
 me_seleukid_05_assyria.12.desc:0 "Sophene holds the upper Euphrates and the road into Armenia, and the old Orontid house has kept it since before Macedonians first marched east. Binding the Sophenian Orontids to our house with a royal marriage between [seleucid_princess_scope.GetPraenomen] and [GetCountry('SPH').GetRuler.GetPraenomen] would ensure the Euphrates remains in friendly hands and secures [GetCountry('SPH').GetRuler.GetPraenomen] a quiet reign.\nAn envoy has been dispatched to [GetCountry('SPH').GetCapital.GetName] with our offer..."
 me_seleukid_05_assyria.12.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_12$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.12.a:0 "We shall wait and see."

 me_seleukid_05_assyria.120.t:0 "A Royal Offer from [seleucid_overlord.GetName]"
 me_seleukid_05_assyria.120.desc:0 "The envoy of [seleucid_overlord.GetName] comes with no army at his back, which is itself a kind of courtesy. He offers a [seleucid_princess_scope.GetPraenomen], princess of the [seleucid_overlord.GetAdjective] house for [GetCountry('SPH').GetRuler.GetPraenomen], and with her the protection of the greatest power in the East."
 me_seleukid_05_assyria.120.a:0 "This is a great honor."
 me_seleukid_05_assyria.120.b:0 "[GetCountry('SPH').GetCapital.GetName] will not bow to [GetCountry('SEL').GetCapital.GetName]."

 me_seleukid_05_assyria.1201.t:0 "$seleukid_mission_05_assyria_armenia_task_12$"
 me_seleukid_05_assyria.1201.desc:0 "The envoy has returned back from Arsamosata, the dust of the road still on him, with the Orontid king's answer."
 me_seleukid_05_assyria.1201.a:0 "So be it."
 me_seleukid_05_assyria.1201.accepted.tt:0 "#E #Y Sophene#!#! #G accepts#!"
 me_seleukid_05_assyria.1201.refused.tt:0 "#E #Y Sophene#!#! #R declines#!"

# Task 13 - Greater Armenia
 me_seleukid_05_assyria.13.t:0 "$seleukid_mission_05_assyria_armenia_task_13$"
 me_seleukid_05_assyria.13.desc:0 "Greater Armenia is the highland north, held since the Great King's day by Orontid satraps who send down horses and silver when it suits them and forget the road when it does not. [artaxias_scope.GetPraenomen] now holds the country now in our name, and the opinion in [ROOT.GetCountry.GetCapital.GetName] is [seleucid_princess_scope.GetPraenomen] ought to be wedded to him."
 me_seleukid_05_assyria.13.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_13$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.13.a:0 "Queen [seleucid_princess_scope.GetPraenomen] has a nice ring to it."
 me_seleukid_05_assyria.13.b:0 "We need to save [seleucid_princess_scope.GetPraenomen] for a better match."

# Task 14 - Lesser Armenia
 me_seleukid_05_assyria.14.t:0 "$seleukid_mission_05_assyria_armenia_task_14$"
 me_seleukid_05_assyria.14.desc:0 "West of the Euphrates lies Lesser Armenia, an upland of pasture and river gorges running toward Cappadocia. It has always had princes of its own, sometimes in league with the kings across the river and sometimes not, and their reach runs down over the Chaldaioi and the Tibarenoi as far as Trapezous. Its old center is Ani above the western Euphrates, where the Armenians keep the sanctuary of Aramazd, the chief of their gods, and lay their dead kings. We have an Orontid of our own in [mithradates_scope.GetPraenomen]. He could be raised up over the country and rule it in our name."
 me_seleukid_05_assyria.14.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_14$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.14.release.tt:0 "#E #Y Lesser Armenia#!#! is released as a [THIS.GetCountry.GetAdjective] #E Satrapy#! under a king of our choosing."
 me_seleukid_05_assyria.14.claimant.tt:0 "[mithradates_scope.GetPraenomen] becomes the ruler of #E #Y Lesser Armenia#!#!."
 me_seleukid_05_assyria.14.a:0 "Queen [seleucid_princess_scope.GetPraenomen] has a nice ring to it."
 me_seleukid_05_assyria.14.b:0 "We need to save [seleucid_princess_scope.GetPraenomen] for a better match."

# Task 15 - The Kingdom of Adiabene
 me_seleukid_05_assyria.15.t:0 "$seleukid_mission_05_assyria_armenia_task_15$"
 me_seleukid_05_assyria.15.desc:0 "When the empire was divided, Arbelitis was reckoned a satrapy in its own right, though it was tied to Mesopotamia under Amphimachos, and it has never sat easily under a governor sent up from Seleukeia. The country keeps its own name, Hadyab, which we say as Adiabene, and buries its great men in the rock below Arbela. Ground like this is better held by a man who lives on it than by our clerks from [ROOT.GetCountry.GetCapital.GetName], and [izates_scope.GetName] has been chosen for it, a man our court can vouch for and Arbela will accept. Left to itself, Arbela keeps its own manners and the name Adiabene; pressed hard enough, its court comes to sound like one of our Syrian cities."
 me_seleukid_05_assyria.15.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_15$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.15.a:0 "Remake its court after our Syrian cities."
 me_seleukid_05_assyria.15.a.tt:0 "#E #Y Arbelitis#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Satrapy#!, its court and speech remade after our Syrian cities\n#E [izates_scope.GetName]#! becomes its ruler"
 me_seleukid_05_assyria.15.b:0 "Leave its customs as they are."
 me_seleukid_05_assyria.15.b.tt:0 "#E #Y Adiabene#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Satrapy#!, its own customs left as they are\n#E [izates_scope.GetName]#! becomes its ruler"

# Task 16 - Osroene and Edessa
 me_seleukid_05_assyria.16.t:0 "$seleukid_mission_05_assyria_armenia_task_16$"
 me_seleukid_05_assyria.16.desc:0 "Osroene takes its name from Orhai, which is Edessa, and the country around it is not Greek. The Arab clans who pasture between the Euphrates and the Balikh keep their own chiefs, and among them the name Abgar carries more weight than any officer we could send out from Antioch. [abgar_scope.GetName] has come up to Edessa from the camps with his kin behind him, and the chiefs have settled it among themselves that he is to speak for them. We hold the whole of it now, but our governors spend more in holding it than it returns."
 me_seleukid_05_assyria.16.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_16$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.16.a:0 "[abgar_scope.GetPraenomen] will need to learn Greek."
 me_seleukid_05_assyria.16.a.tt:0 "#E #Y Osroene#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Satrapy#!\n#E [abgar_scope.GetName]#! becomes the ruler of #E #Y Osroene#!#!"
 me_seleukid_05_assyria.16.b:0 "These petty tribesmen respect only strength."
 me_seleukid_05_assyria.16.b.tt:0 "#E #Y Osroene#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Client Kingdom#!\n#E [abgar_scope.GetName]#! becomes the ruler of #E #Y Osroene#!#!"
 me_seleukid_05_assyria.16.c:0 "Now isn't the time for reorganizing."

# Task 17 - The Kingdom of Commagene
 me_seleukid_05_assyria.17.t:0 "$seleukid_mission_05_assyria_armenia_task_17$"
 me_seleukid_05_assyria.17.desc:0 "The Orontids have counted the Kummuh mound and the Euphrates crossing among their own holdings for as nearly as long as clerks have kept records. That is more of the river road than one highland house ought to hold. We have an Orontid of our own in [ptolemaios_scope.GetPraenomen], of the same stock and the same gods, who honors Mithra and the Baal of the hill at Doliche as they do, and whose loyalty has never been in question. Perhaps the time has come to cut Commagene out of Sophene and set Ptolemaios over the country as our eparch."
 me_seleukid_05_assyria.17.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_17$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.17.a:0 "Henceforth, [ptolemaios_scope.GetPraenomen] shall hold Commagene."
 me_seleukid_05_assyria.17.a.tt:0 "#E #Y Commagene#!#! will be released as a [THIS.GetCountry.GetAdjective] #E Satrapy#!\n#E [ptolemaios_scope.GetName]#! becomes the ruler of #E #Y Commagene#!#!" 
 me_seleukid_05_assyria.17.b:0 "Now isn't the time for reorganizing."

# Task 18 - The Coast of Colchis
 me_seleukid_05_assyria.18.t:0 "$seleukid_mission_05_assyria_armenia_task_18$"
 me_seleukid_05_assyria.18.desc:0 "Colchis is the Euxine coast beyond the mountains, where the Phasis comes down to the sea past the Milesian foundations at Phasis and Dioskourias. It sends out linen and hemp, pitch and shipbuilding timber floated down its rivers, and gold still washed from the mountain torrents in fleecy skins. Its king is no autocrat: the land is parceled among skeptouchoi, the sceptre-holders of the local houses, and even the Persians never made a satrapy of it, taking instead a gift of boys and girls every fifth year. This lies well beyond where our business in the north properly runs, but an envoy can still reach the Phasis, and a [ROOT.GetCountry.GetAdjective] envoy is on that road now.."
 me_seleukid_05_assyria.18.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_18$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.18.a:0 "Excellent."

# Task 19 - The Iberian Gates
 me_seleukid_05_assyria.19.t:0 "$seleukid_mission_05_assyria_armenia_task_19$"
 me_seleukid_05_assyria.19.desc:0 "Iberia is the highland kingdom east of Colchis, seated at Mtskheta where the Kyros and the Aragos meet beneath the rock forts of Harmozike and Seusamora. It is a country held by its gates: the wagon road up from Colchis through the Phasis narrows, and northward the way out to the Sarmatian nomads, three days of climbing and then four days of footpath in single file, shut at the end by a wall. A king who keeps those gates for us shuts the northern road against the nomads and opens it to no one else, which is worth more to us than the tribute of the place. That is farther north than our business properly runs, but a [ROOT.GetCountry.GetAdjective] envoy will climbto Mtskheta all the same..."
 me_seleukid_05_assyria.19.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_19$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.19.a:0 "Let the envoy climb to Mtskheta."
 
 me_seleukid_05_assyria.180.t:0 "An Offer from [seleucid_overlord.GetName]"
 me_seleukid_05_assyria.180.desc:0 "The ambassadors of [seleucid_overlord.GetName] have come down to the Phasis, offering the great king's protection and his friendship. They bring rich gifts with them, gold and fine things out of the south, and ask only that we send gifts back in our own turn, year upon year, and take our place among the king's men."
 me_seleukid_05_assyria.180.a:0 "The [seleucid_overlord.GetAdjective]s ask for little."
 me_seleukid_05_assyria.180.b:0 "Hail [seleucid_overlord.GetRuler.GetName]!"
 me_seleukid_05_assyria.180.c:0 "What utter nonsense."

 me_seleukid_05_assyria.182.t:0 "$seleukid_mission_05_assyria_armenia_task_18$"
 me_seleukid_05_assyria.182.desc:0 "The Colchians has refused us. The fools trust their mountains and to the sheer distance from our muster grounds, and neither of those will stop a phalanx that has already been paid. Let the heralds proclaim our right to the Phasis and its coast, and let the army make the road our envoy made."
 me_seleukid_05_assyria.182.a:0 "Then we take by the spear what was refused."

 me_seleukid_05_assyria.183.t:0 "$seleukid_mission_05_assyria_armenia_task_18$"
 me_seleukid_05_assyria.183.desc:0 "Our envoy has done his work. The king of Colchis has taken the great king's gifts and his protection, and takes his place among our men on the Euxine shore."
 me_seleukid_05_assyria.183.a:0 "The north is ours."
 me_seleukid_05_assyria.183.tributary.tt:0 "#E #Y Colchis#!#! becomes a [THIS.GetCountry.GetAdjective] #E Tributary#!."
 me_seleukid_05_assyria.183.satrapy.tt:0 "#E #Y Colchis#!#! becomes a [THIS.GetCountry.GetAdjective] #E Satrapy#!."

 me_seleukid_05_assyria.190.t:0 "An Offer from [seleucid_overlord.GetName]"
 me_seleukid_05_assyria.190.desc:0 "The ambassadors of [seleucid_overlord.GetName] have climbed to Mtskheta, offering the great king's protection and his friendship. They bring rich gifts with them, gold and goods out of the south, and ask only that we send gifts back in our own turn, year upon year, and stand among the king's friends."
 me_seleukid_05_assyria.190.a:0 "The [seleucid_overlord.GetAdjective]s ask for little."
 me_seleukid_05_assyria.190.b:0 "Hail [seleucid_overlord.GetRuler.GetName]!"
 me_seleukid_05_assyria.190.c:0 "Send them back down the road."

 me_seleukid_05_assyria.192.t:0 "$seleukid_mission_05_assyria_armenia_task_19$"
 me_seleukid_05_assyria.192.desc:0 "The Iberians have refused our generous offer."
 me_seleukid_05_assyria.192.a:0 "Unfortunate... For them."

 me_seleukid_05_assyria.193.t:0 "$seleukid_mission_05_assyria_armenia_task_19$"
 me_seleukid_05_assyria.193.desc:0 "Our envoy has come down from Mtskheta with word: the Iberian king has taken the great king's gifts and his protection, and holds the gates of the north in our name."
 me_seleukid_05_assyria.193.a:0 "The gates are ours."
 me_seleukid_05_assyria.193.tributary.tt:0 "#E #Y Iberia#!#! becomes a [THIS.GetCountry.GetAdjective] #E Tributary#!."
 me_seleukid_05_assyria.193.satrapy.tt:0 "#E #Y Iberia#!#! becomes a [THIS.GetCountry.GetAdjective] #E Satrapy#!."

# Task Final - From Ashur to Ararat
 me_seleukid_05_assyria.20.t:0 "$seleukid_mission_05_assyria_armenia_task_final$"
 me_seleukid_05_assyria.20.desc:0 "From the plain of Ashur to the heights of Ararat, the northern march answers again to [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName]. Assyria is held from Edessa down to Arbela, and the Armenian highland is in our hands or in the hands of men who hold it for us. What remained was the work that turns a conquest into a satrapy: governors seated where the kings of Assyria sat, and a highland kept quiet long enough to pay for its own garrisons. The last of it is done, and the treasury is open for the work that follows."
 me_seleukid_05_assyria.20.complete.tt:0 "The mission task '#Y $seleukid_mission_05_assyria_armenia_task_final$#!' has now been #G Completed#!!"
 me_seleukid_05_assyria.20.a:0 "The north is ours."

 me_seleukid_05_assyria.500.t:0 "The Northern March Restored"
 me_seleukid_05_assyria.500.desc:0 "Assyria and Armenia, Osroene and Commagene: the whole of the northern march lies within the reach of [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName]. The work begun on the road to Chala is finished upon the slopes of Ararat. Seleukos took this country from Antigonos with an army brought up out of Babylon, and it has been lost and taken back more than once since. Let the record be cut in the cities themselves, at Edessa and at Samosata and under Ararat, so that whoever governs here after us knows what he has been handed."
 me_seleukid_05_assyria.500.a:0 "Let it be remembered."

################################################################
# 06 UPPER SATRAPIES
################################################################

 seleukid_mission_06_upper_satrapies:0 "The Upper Satrapies"
 seleukid_mission_06_upper_satrapies_DESCRIPTION:0 "Beyond the Zagros lie the Upper Satrapies, the eastern half of the empire that the successors of [GetCharacter('(int32)24').GetPraenomen] once held. While we were tied up with the wars in the west, these provinces had little reason to fear us, and more than one of their satraps has started to act like a king in his own right.\n\nWe cannot let them slip away. There is wealth and manpower here that we badly need, and the roads through Media and Persis run all the way to the edge of India, so it makes sense to go east ourselves and set things right."
 seleukid_mission_06_upper_satrapies_CRITERIA_DESCRIPTION:0 "This mission will be considered complete once we have restored our hold over the Upper Satrapies in the east."
 seleukid_mission_06_upper_satrapies_BUTTON_TOOLTIP:0 "Bring the wayward eastern satrapies back under our control and secure the road east toward India."
 seleukid_mission_06_upper_satrapies_BUTTON_DETAILS: ""

# ============================================================
# Missions
# ============================================================

 seleukid_mission_06_upper_satrapies_task_1:0 "The Road East"
 seleukid_mission_06_upper_satrapies_task_1_DESC:0 "The road out of Babylonia meets the Royal Road near Opis and then climbs into the Zagros by the pass the Greeks call the Median Gate, running beneath the great rock of Bagistanos where Dareios cut his proclamation into the cliff above the traffic. Past it lies Media, and past Media the hill country of the Amardoi and the Kadousioi, who have never taken kindly to being governed: Artaxerxes took an army up against the Kadousioi and brought it back starving, and Alexander had to go into the hills after the Amardoi himself. We shall send scouts and surveyors ahead of the [ROOT.GetCountry.GetAdjective] army, mapping the passes and buying the goodwill of the mountain lords, and none of that comes cheap."
 seleukid_mission_06_upper_satrapies_task_1_effect_tt:0 "Gain claims on every province of this area that we do not hold directly."

 seleukid_mission_06_upper_satrapies_task_2:0 "Media Atropatene"
 seleukid_mission_06_upper_satrapies_task_2_DESC:0 "Atropates was satrap of Media under Dareios and led the Medes at Gaugamela, and Alexander thought well enough of him to hand the satrapy straight back and to marry his daughter to Perdikkas at the great wedding at Susa. When the empire was divided at Babylon, Peithon took Media proper and Atropates was left only the northern hills, whereupon he stopped answering to anyone at all and the Greeks began calling the place after him."
 seleukid_mission_06_upper_satrapies_task_2_effect_tt:0 "#E #Y Atropatene#!#! may become a [ROOT.GetCountry.GetAdjective] #E Subject#!"

 seleukid_mission_06_upper_satrapies_task_3:0 "Flames of Ganzak"
 seleukid_mission_06_upper_satrapies_task_3_DESC:0 "Ganzak is the Median word for a treasury, and it is where the satraps of Media have always kept theirs. The magi are one of the six old tribes of the Medes and the priesthood of the whole highland: they keep a walled enclosure with an altar deep in ash where the fire is never let go out, and no Median offering is made without one of them standing over it to chant. Alexander's satrap, Atropates, was himself named for that fire, and the herdsmen of these hills judge a king largely by how he handles it."

 seleukid_mission_06_upper_satrapies_task_4:0 "The Summer Capital"
 seleukid_mission_06_upper_satrapies_task_4_DESC:0 "Ekbatana lies high on the skirts of Mount Orontes and stays cool through the months when Babylonia is unlivable, which is why the Great Kings summered there and why our own court should. It has no wall at all, only an artificial citadel of remarkable strength, and a palace running some seven stades around, all of it cedar and cypress, with the rafters and the columns of the colonnades plated in silver and gold and every roof tile of solid silver. Or so it once was..."

 seleukid_mission_06_upper_satrapies_task_5:0 "The Elamite Gate"
 seleukid_mission_06_upper_satrapies_task_5_DESC:0 "Susa has been a capital since the days of the Elamites, and it holds the ground where the road up from Babylon meets the roads into Persis and Media. Dareios made it the working seat of the Achaemenids and ended the Royal Road at its gate, a hundred and eleven posting stations from Sardis. The gate's cedar was hauled up from Lebanon by Ionians and Karians, its gold out of Sardis and Baktria, the stone cut by Greeks and Lydians. In that same palace [GetCharacter('(int32)39').GetPraenomen] took Stateira to wife and had eighty of his officers wed Persian women beside him."

 seleukid_mission_06_upper_satrapies_task_6:0 "The Achaemenid Heartland"
 seleukid_mission_06_upper_satrapies_task_6_DESC:0 "Persepolis has not been a living city since [GetCharacter('(int32)39').GetPraenomen] burned the terrace, and what is left of it is ceremonial. At Pasargadae, magi still keep watch on Kyros's tomb and cut stone channels carry water more than a thousand paces through a garden divided into four quarters for the four quarters of his empire. When [GetCharacter('(int32)39').GetPraenomen] found that tomb broken open he set Aristoboulos to make it good again, and then had it sealed. There is no profit in ruins themselves, but there is a great deal in being seen to keep them. We shall put the palaces back in repair and the gardens back under water, so that the Persians see the [ROOT.GetCountry.GetAdjective] house is heir to Kyros and Dareios."

 seleukid_mission_06_upper_satrapies_task_7:0 "Greek Administration in Persis"
 seleukid_mission_06_upper_satrapies_task_7_DESC:0 "The old Achaemenid heartland is still run in the Persian way, its tax-rolls and land-registers kept by the satrap's stewards and the fire-priests as they were under the Great Kings. If we mean to hold Persis for good, we should work our own habits of order into its government: a Greek chancery keeping Greek records, and magistrates who answer to [ROOT.GetCountry.GetCapital.GetName], without tearing up what already serves us well."

 seleukid_mission_06_upper_satrapies_task_8:0 "City of a Hundred Gates"
 seleukid_mission_06_upper_satrapies_task_8_DESC:0 "Hecatompylos sits on the dry southern skirt of the Elburz, at the point where every road of the surrounding country comes together, and it is that meeting of roads, not any wall, that earned it the Greek name of the City of a Hundred Gates. Water here does not run on the surface. The Persian kings gave five generations' use of the land to any man who brought water to the air landscape, so the plain is threaded with underground channels and hidden wells that only men raised on them can find."

 seleukid_mission_06_upper_satrapies_task_9:0 "Parthava"
 seleukid_mission_06_upper_satrapies_task_9_DESC:0 "Parthia lays a long way from Antioch, out past Media and the Caspian Gates, and Hyrcania is shut away behind the Elburz with its forests and its vines and figs that Greek travelers will not stop talking about. Phrataphernes held Parthia and Hyrcania together for Dareios, kept faith with him to the last, and had the double satrapy confirmed when he came over to Alexander; and Dareios the Great's father Hystaspes had governed the country long before that. Whoeversoever holds these lands will need a free hand if he is to fend off threats from the steppe."

 seleukid_mission_06_upper_satrapies_task_10:0 "The Bactrian Road"
 seleukid_mission_06_upper_satrapies_task_10_DESC:0 "The oasis of Margiana is a green island in a ring of desert, and Alexander planted a city there to keep the horsemen of Spitamenes off the Bactrian road. The ground repays the trouble: the vine grows stocks that two men together cannot get their arms around, and clusters a full two cubits long. But an oasis is only as safe as its edge, and the Parni and the other nomads come out of the sand where they please. We mean to refound the place as Antiocheia Margiane, and to wall not merely the town but the whole plain, fifteen hundred stadia of circuit, farmland and all."

 seleukid_mission_06_upper_satrapies_task_11:0 "The Land of a Thousand Cities"
 seleukid_mission_06_upper_satrapies_task_11_DESC:0 "Bactria is among the wealthiest and most remote regions in the civilized world. The Hindu Kush stands in front of it, desert behind, and [ROOT.GetCountry.GetCapital.GetName] is a season's march away. Men call it the land of a thousand cities..."

 seleukid_mission_06_upper_satrapies_task_12:0 "The Satraps' Conference"
 seleukid_mission_06_upper_satrapies_task_12_DESC:0 "The satraps of the East have one reliable answer to a strong king: they combine. Triparadeisos made Peithon of Media general over all the upper satrapies, and when he killed Philippos of Parthia and put his own brother in the seat, the rest of them gathered under Peucestas of Persis and threw him back out of Parthia inside a season. Antigonos learned the same lesson from the other side. After Gabiene he could take Peucestas away with him a prisoner and put Peithon to death, but Stasanor in Bactria and Sibyrtios in Arachosia he simply confirmed where they sat, because his writ did not run that far and both of them knew it. Better to call them to one table ourselves, all of them together, and have a settlement out of them rather than a coalition."

 seleukid_mission_06_upper_satrapies_task_13:0 "Laodikeia Chosroi"
 seleukid_mission_06_upper_satrapies_task_13_DESC:0 "South of Ekbatana the road drops into the well-watered valley of Nihavand, broad enough for a polis of its own with Greek magistrates set over it. Below that it squeezes through the country of the Kossaioi, hill men who used to charge the Persian kings a toll every time the court moved between Ekbatana and Babylon, until Alexander spent a winter in their valleys and broke the habit."

 seleukid_mission_06_upper_satrapies_task_14:0 "The Caspian Gates"
 seleukid_mission_06_upper_satrapies_task_14_DESC:0 "The fire worshipers call Rhagai Ragha of the three races and reckon it Zarathustra's own city; Dareios the Great's men ran the Median rebel Phraortes down in it; and Dareios III fled through it with Alexander eleven days behind him and got no further than the Caspian Gates, a day to the east, before his own officers killed him. Those Gates are a defile some eight miles long, cut so narrow that carts must pass in single file, and they are the only practical road out of Media into the East."

 seleukid_mission_06_upper_satrapies_task_16:0 "The Persian Colonies"
 seleukid_mission_06_upper_satrapies_task_16_DESC:0 "Two Greek settlements in Persis were planted and then left to shift for themselves. One sits on the Hedyphon where the Susian plain gives out against the Persian hills, grain country astride the road east, and it will carry a proper city if we pay to raise one: Seleukeia Hedyphonte. The other is out on the gulf coast among the salt flats, and nothing there will grow of its own accord. Here we will write to the magistrates of Magnesia on the Maeander and ask the Magnesians to people it."

 seleukid_mission_06_upper_satrapies_task_17:0 "Kalliope and Charis"
 seleukid_mission_06_upper_satrapies_task_17_DESC:0 "Comisene is a long stretch of road with eight villages and their post-stations strung along it and not one city in the whole district, which is a poor way to hold a country. Kalliope sits on its rock there, one of the pair of forts the Parthians raised in the old days to watch the Medes, and it is the obvious place to make that city. At Vishpauzatis, Dareios' father Hystaspes met the rebel Parthians in the field and broke them, in the spring of the year the empire nearly came apart."

 seleukid_mission_06_upper_satrapies_task_18:0 "Dominate the Dahae"
 seleukid_mission_06_upper_satrapies_task_18_DESC:0 "North of Parthia the plowland gives out and the Dahae have the country, three peoples under the one name: the Parni nearest us, then the Xanthii and the Pissuri. Their settled neighbors took the word to mean robbers, which is fair enough as far as it goes, though it does not do them justice. Their mounted archers held the left wing at Gaugamela beside the Bactrians, rode for Bessos and then for Spitamenes after that, and in the end Alexander took them into his own cavalry and set them on the Indian horse at the Hydaspes. Men of that quality are worth more in our pay than at our backs, and the frontier will not be quiet while they answer to nobody. We mean to master the marches of Derbicca, Dahaea and Parnia, and the claims go out first."
 seleukid_mission_06_upper_satrapies_task_18_effect_tt:0 "Gain claims on every province in the areas of #E Parnia#!, #E Dahaea#!, and #E Siracene#!"

 seleukid_mission_06_upper_satrapies_task_19:0 "Bactra the Beautiful"
 seleukid_mission_06_upper_satrapies_task_19_DESC:0 "Bactra is where the caravan roads of the East meet: gold and lapis down from the mountains, hides and horses off the steppe, and the wares of India and the distant Seres passing through her markets to the sea. The plain about her is watered off the Oxus by canals dug long before any Greek came here, and it will carry as many towns as we are willing to pay for. Two are worth founding."

 seleukid_mission_06_upper_satrapies_task_20:0 "Antiocheia Soteira"
 seleukid_mission_06_upper_satrapies_task_20_DESC:0 "Aria is the garden on the road, green fields fed off the Arius and ringed by dry country, and every caravan passing between Parthia and Bactria must go through it. Alexander took Artacoana here on his way to Bactria and left a city of his own behind him. Our foundation will be Antiocheia Soteira, and the name is not idle: Soter was earned in Asia against the Galatians, when sixteen elephants broke a far larger army, and the trophy was struck showing the elephant alone with no man beside it."

 seleukid_mission_06_upper_satrapies_task_21:0 "Breadbaskets of Bactria"
 seleukid_mission_06_upper_satrapies_task_21_DESC:0 "Where the Kokcha comes down into the Oxus a Greek city already stands, with a theatre for five or six thousand and a gymnasium far larger than the people there can fill. In the founder's precinct, over the bones of Kineas who settled the place, a man named Klearchos set up the maxims of the old sages, cut into the stone that he had copied them himself at holy Pytho. Far to the north, on the south bank of the Jaxartes, stands the other: Alexandreia Eschate, the Furthest, which Alexander walled in twenty days and settled with Greek mercenaries, Macedonians past service, and such of the natives as were willing. So the East does not want for Greeks, nor for their learning. What it wants is ordered farmland, and for the canals off the Oxus and the Jaxartes to carry far more water to the fields than they presently do."

 seleukid_mission_06_upper_satrapies_task_22:0 "Antiocheia Skythias"
 seleukid_mission_06_upper_satrapies_task_22_DESC:0 "Alexander set Alexandreia Eschate on the south bank of the Jaxartes and called it the Furthest, and for a while that was honest. It is not the furthest any longer. Beyond it the Massagetai water their horses on our side of the river whenever the fords run low, and there is nothing between them and the farmland of Ferghana but distance. We will plant Antiocheia Skythias out past the old limit, a walled town with Greek settlers in it, and let the name of the place tell the steppe whose river this is. It will cost two hundred gold."

 seleukid_mission_06_upper_satrapies_task_23:0 "The Chorasmian Delta"
 seleukid_mission_06_upper_satrapies_task_23_DESC:0 "Down where the Oxus spreads out and loses itself in the sand lies Chorasmia, an oasis between two deserts, farmed off canals dug there thousands of years before the Persians ever claimed it. It was already out of Persian hands before Alexander came. When Pharasmanes rode into his camp with fifteen hundred horse he came as an ally offering to guide the army to the Black Sea, and Alexander took the friendship and left the country to itself. It has answered to nobody since; their kings strike coins copied from our own, which is the nearest to obedience they have ever come. We mean to master the delta, and the claims come first."
 seleukid_mission_06_upper_satrapies_task_23_effect_tt:0 "Gain claims on every province of #E #Y Chorasmia#!#!"

 seleukid_mission_06_upper_satrapies_task_25:0 "Reducing the Nearer Satraps"
 seleukid_mission_06_upper_satrapies_task_25_DESC:0 "Our rule has ushered in a new age, and a new age calls for a new order. Media and Persis, the old heart of the Persian realm, still answer to satraps of their own, ruling as they did before we came."

 seleukid_mission_06_upper_satrapies_task_26:0 "Reducing the Farther Satraps"
 seleukid_mission_06_upper_satrapies_task_26_DESC:0 "A new age calls for a new order, out to the ends of the empire. Parthia, Aria, and Bactria are the farthest of our satrapies, governed a season's march from our court."

 seleukid_mission_06_upper_satrapies_task_27:0 "Effulgent Elymais"
 seleukid_mission_06_upper_satrapies_task_27_DESC:0 "Old Elam is really two countries. The plain about Susa can be reliably controlled, but the hills above it never have been. The Uxii who hold the passes charged the Great Kings a toll to cross their own empire, and it took [GetCharacter('(int32)39').GetPraenomen] coming over the mountain by night to end the arrangement, after which they paid a hundred horses, five hundred cattle and thirty thousand sheep a year, having neither coin nor ploughland to pay with. Holding the hills directly costs more than they have ever returned, and the men up there want nothing from us but to be left alone."
 seleukid_mission_06_upper_satrapies_task_27_effect_tt:0 "Decide whether to release the highlighted lands as the #E Satrapy of #Y Elymais#!#!."

 seleukid_mission_06_upper_satrapies_task_final:0 "To the Banks of the Indus"
 seleukid_mission_06_upper_satrapies_task_final_DESC:0 "In the early years following Alexander's death, the satraps he had set over India were put to the sword on the orders of Chandragupta, and he 'freed' those lands from only to fasten his own yoke upon them. Long have their people languished under Indian despotism. [GetCharacter('(int32)39').GetPraenomen] turned back at the Hyphasis because his men would go no further. We could finish what he could not."
 seleukid_mission_06_upper_satrapies_task_final_control_tt:0 "We hold at least #Y 55#! provinces across #E Media#!, #E Persis#!, and #E Parthia#!, by our own hand or through our subjects."
 seleukid_mission_06_upper_satrapies_task_final_indus_tt:0 "Gain claims on every province of #E #Y Arachosia#!#!, #E #Y Gedrosia#!#!, #E #Y Sattagydia#!#!, and #E #Y Patalene#!#! not already ours."
 seleukid_hellenize_media_tt:0 "Across #Y Media#!, the Hellenic settlers and a number of the leading townsfolk are drawn together into a common #Y Greco-Persian#! culture."
 seleukid_greco_persian_characters_tt:0 "A number of the court's children and rising nobles take up a #Y Greco-Persian#! identity."

 seleukid_mission_06_upper_satrapies_finish_tt:0 "#G Completing this task finishes#! #E #T The Upper Satrapies#!#!."

