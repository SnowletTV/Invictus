 desc_summer_capital_modifier:0 "This city is the summer capital for the Seleukid court and hosts many great temples and palaces."

 wall_of_margiana_modifier:0 "Aegis of Margiana"
 desc_wall_of_margiana_modifier:0 "Antiochos walled the whole Margian oasis about, a rampart of many days' march, so that the settled land might keep the nomad out and the water in."
 bactra_mother_of_cities_modifier:0 "Bactra of the Caravan Roads"
 desc_bactra_mother_of_cities_modifier:0 "The roads to India and to the Seres meet in her markets, and the tolls of both are taken here."
 edge_of_the_world_modifier:0 "Edge of the Settled World"
 desc_edge_of_the_world_modifier:0 "The furthest wall of the Greek world, set on the Jaxartes against the Saka of the steppe, where the ploughland ends and the grass begins."

