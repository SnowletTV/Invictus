l_spanish:
 alcimachid:0 "Blood of Lysimachus"
 alcimachid_desc:0 "Alguna vez fue un amigo cercano de Alejandro y uno de los legendarios Somatophylakes; Lisímaco era un general brutal pero astuto, cuya comprensión de la tensa situación diplomática entre los Diadochi era insuperable.\n\n#G Este rasgo será heredado por la descendencia de [CHARACTER.GetPraenomen].#!"
 antigonids:0 "Blood of Antigonus"
 antigonids_desc:0 "Antigonus Monopthalmus era un sátrapa leal de Alejandro, que ascendió al poder después de derrotar a Pérdicas, poco después de la muerte de Alejandro. Fue el primero de los Diadochi en proclamarse rey, contó con el apoyo de su leal familia y se ganó una buena reputación entre las naciones griegas más pequeñas y menos capaces.\n\n#G Este rasgo lo heredará la descendencia de [CHARACTER.GetPraenomen].#!"
 antipatrid:0 "Sangre de Antípatro"
 antipatrid_desc:0 "Antípatro, gran amigo de Alejandro, fue responsable de salvaguardar Macedonia durante las grandes campañas de Alejandro. Su lealtad a Alejandro y su actitud dominante hacia los estados griegos menores fueron atenuadas por su hijo, Casandro, cuyo desprecio por Alejandro no era ningún secreto y cuyo legado incluyó la fundación y restauración de muchas grandes ciudades.\n\n#G Este rasgo será heredado por la descendencia de [CHARACTER.GetPraenomen].#!"
 argeads:0 "Sangre de los argéadas"
 argeads_desc:1 "Alejandro lloró cuando escuchó de Anaxarco que había una infinidad de mundos; y cuando sus amigos le preguntaron si le había sucedido algún accidente, respondió esta respuesta: \"¿No te parece digno de lamentación que siendo tan grande la multitud de ellos, todavía no hayamos conquistado a ninguno?\"\n\n#G Este rasgo lo heredará la descendencia de [CHARACTER.GetPraenomen].#!"
 lagids:0 "Blood of Ptolemy"
 lagids_desc:0 "Habiendo crecido junto a Alejandro, Ptolomeo Soter de los Lagidae, estuvo entre los primeros de los siete Somatophylakes. Después de la partición de Babilonia, se estableció en Egipto, gobernando con mano justa; a pesar de la gran población de diferentes culturas. Su antigua dinastía fue considerada muy influyente en el patrocinio del arte, la filosofía y la ciencia.\n\n#G Este rasgo será heredado por la descendencia de [CHARACTER.GetPraenomen].#!"
 seleucids:0 "Sangre de Seleuco"
 seleucids_desc:0 "A diferencia de los demás diádocos, Seleuco fue una figura de importancia mediocre durante las campañas de Alejandro. Tras una serie de victorias y derrotas, Seleuco finalmente estableció su dominio con la ayuda de Ptolomeo Soter y se embarcó en una campaña para recuperar el control de las zonas orientales del imperio de Alejandro. Rodeado por todos lados por potencias titánicas, Seleuco fue, por necesidad, un líder despiadado y astuto.\n\n#G Este rasgo será heredado por la descendencia de [CHARACTER.GetPraenomen].#!"
 aeacidae:0 "Sangre de Aiakos"
 aeacidae_desc:0 "Aiakos era el abuelo del mayor héroe griego, Aquiles, y rey de la isla de Aigina en el golfo Sarónico. Neoptólemo, hijo de Aquiles, llegó a ser rey de los epirotas molosos después de regresar de la guerra de Troya, y sus descendientes han gobernado desde entonces, uniendo a Epiro y contribuyendo al legado de Alejandro Magno a través de su madre Olimpia.\n\n#G Este rasgo será heredado por la descendencia de [CHARACTER.GetPraenomen].#!"

