 warfare.1.desc:1 "[SCOPE.sChar('siege_instigator').GetName] привел [SCOPE.sChar('siege_instigator').GetHerHis] людей к славной победе во время осады [SCOPE.sP('temp_city_scope_warfare_1').GetName]. Враг бежит в позоре, и осталось лишь решить, как поступить с жителями города.\n\nНет нужды говорить, что военные трофеи, скорее всего, заставят тех, кто находится в [SCOPE.sChar('siege_instigator').GetEmployer.GetCapital.GetName], сильно восхищаться [SCOPE.sChar('siege_instigator').GetPraenomen], но оставление такого богатства в руках одного [SCOPE.sChar('siege_instigator').GetWomanMan] может вызвать проблемы в будущем..."