 me_ant_task_start_tt_1:0 "[me_antigonids_scope.GetRulerTitle|Y] [me_antigonids_scope.GetRuler.GetPraenomen|Y] will commence"
### Antigonos' Vision
 me_antigonid_1_vision.1.t:0 "$antigonid_01_vision$: Истинные диадохи"
 me_antigonid_1_vision.1.desc:2 "Когда после битвы при [GetProvince('(int32)796').GetName] он был назначен сатрапом [GetProvince('(int32)1936').GetArea.GetRegion.GetName], никто, и уж тем более сам [GetCharacter('(int32)37').GetPraenomen], не мог предвидеть ту власть и славу, что ожидали его в будущем. Спокойно управляя своими землями из [GetProvince('(int32)1936').GetName], он сохранил свою сатрапию после смерти [GetCharacter('(int32)39').GetPraenomen] — несмотря на своё отсутствие в то время в [GetProvince('(int32)918').GetName] — до тех пор, пока против него не выступил амбициозный регент [GetCharacter('(int32)409').GetPraenomen]. [GetCharacter('(int32)37').GetPraenomen] был вынужден искать помощи у [GetCharacter('(int32)9').GetPraenomen] и [GetCharacter('(int32)16').GetPraenomen].\n\nПоднявшись с этих низин, он был назначен стратегом [GetProvince('(int32)290').GetArea.GetRegion.GetName] самим [GetCharacter('(int32)9').GetPraenomen] в [GetProvince('(int32)761').GetName], разбил сатрапов Пердикки, thwarted амбиции наследника [GetCharacter('(int32)9').GetPraenomen] — [GetCharacter('(int32)32').GetPraenomen], загнал [GetCharacter('(int32)408').GetPraenomen] — того хитрого грека — в [GetProvince('(int32)1595').GetArea.GetRegion.GetName], захватил ахеменидские сокровищницы и отменил земельные захваты [GetCharacter('(int32)41').GetPraenomen] и [GetCharacter('(int32)42').GetPraenomen], правя империей [GetCharacter('(int32)39').GetPraenomen] от [GetProvince('(int32)257').GetName] до [GetProvince('(int32)4799').GetName].\n\nС тех пор [GetCharacter('(int32)24').GetPraenomen] вернул под контроль непокорный и нерелевантный Восток, объединившись с другими диадохами против завоеванного копьем царства [GetCharacter('(int32)37').GetPraenomen], в то время как они сами погружаются во всевозможные тщеславные излишества: цареубийство, братоубийство, необузданную апофеозацию..."
 me_antigonid_1_vision.1.a:0 "Честь и семья помогут нам преодолеть всё."
 me_antigonid_1_vision.2.t:0 "$antigonid_01_vision$: Чемпионы среди диадохов"
 me_antigonid_1_vision.2.desc:0 "Развитие и расширение владений [GetCharacter('(int32)37').GetPraenomen] продолжается, и теперь нет никаких сомнений в том, что наше царство, несмотря на упорные попытки других диадохов подорвать его, одержало верх над альянсом, сформированным против него его старыми соперниками: [GetCharacter('(int32)42').GetPraenomen], [GetCharacter('(int32)32').GetPraenomen], [GetCharacter('(int32)24').GetPraenomen], [GetCharacter('(int32)41').GetPraenomen]..."
 me_antigonid_1_vision.2.a:0 "Аргеады уступили место Антигонидам."
 me_antigonid_1_vision.2.at:0 "Миссия '#Y $antigonid_01_vision$#!' теперь #G Завершена#!!"
 # Antigonid Capital
 me_antigonid_1_vision.11.t:0 "$antigonid_01_vision_1$: Дело всей жизни"
 me_antigonid_1_vision.11.desc:1 "Новый город [GetProvince('(int32)790').GetName] представляет собой не только развитие его владений, но и кульминацию жизненного пути Антигона в государственном управлении и войне: от времени, когда он был генералом при Филиппе II, до победы его сына Деметрия над Птолемеем при Саламине.\n\nНаконец-то восточная столица приближается к завершению строительства, а вместе с ней и грандиозный фестиваль, который привлек музыкантов и актеров со всего эллинистического мира, чтобы почтить династию Антигона."
 me_antigonid_1_vision.11.a:0 "Мы зашли так далеко."
 me_antigonid_1_vision.11.at:0 "$me_ant_task_start_tt_1$ подготовка к завершению строительства [GetProvince('(int32)790').GetName|Y]."
 me_antigonid_1_vision.12.t:0 "$antigonid_01_vision_1$: Жемчужина Востока"
 me_antigonid_1_vision.12.desc:0 "Боги благоволили нашим усилиям в [GetProvince('(int32)790').GetName], где административные и общественные здания наконец-то были построены. Был проведен грандиозный фестиваль и парад победы, собравший исполнителей со всего эллинского мира для беспрецедентного зрелища и продемонстрировавший всем славу и престиж династии Антигонидов.\n\nНаблюдая с балкона дворца, его члены могут быть уверены, что их королевский статус теперь не подлежит сомнению, позволяя им встать в один ряд с Аргеадами как одному из величайших македонских домов всех времен."
 me_antigonid_1_vision.12.a:0 "Город на века."
 me_antigonid_1_vision.12.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_1$$mission_task_completed_tt_2$"
 me_antigonid_1_vision.13.t:0 "$antigonid_01_vision_1$: Цена победы"
 me_antigonid_1_vision.13.desc:0 "Пока мы занимаемся улучшением городской инфраструктуры и развлечениями народа, наши жестокие соперники, разумеется, снова нападают на нас. Подготовка к завершению строительства [GetProvince('(int32)790').GetName] и грандиозному фестивалю все еще продолжается, и мы можем вернуть большую часть средств, если они понадобятся нам для ведения другой войны, как бы печально ни было отменять наш парад победы."
 me_antigonid_1_vision.13.a:0 "Наши враги должны быть повержены."
 me_antigonid_1_vision.13.at:0 "$mission_task_completed_tt_1$ $antigonid_01_vision_1$#!' будет #R Пропущена#!!"
 me_antigonid_1_vision.13.b:0 "Ничто не может прервать наши празднования."
 me_antigonid_1_vision.14.t:0 "$antigonid_01_vision_1$: Смерть мечты"
 me_antigonid_1_vision.14.desc:0 "Потеря Антигонеи — это сокрушительный символический удар по династии Антигонидов и непростительное унижение для [me_antigonids_scope.GetRulerTitle] [me_antigonids_scope.GetRuler.GetPraenomen].\n\nНам остается лишь молиться, чтобы боги однажды привели наши армии к её славному освобождению..."
 me_antigonid_1_vision.14.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_1$#!' была #R Пропущена#!!"
 me_antigonid_1_vision.14.a:0 "Это еще не конец."
 me_antigonid_1_vision.14.b:0 "Мы отступим в старую столицу."
 # Antigoneia's Port
 me_antigonid_1_vision.21.t:0 "$antigonid_01_vision_2$: Восточный узел"
 me_antigonid_1_vision.21.desc:0 "Во всех последующих планах развития столицы Антигонидов старый порт Мириандрос и поселение ветеранов Антигона в Александрии-ката-Иссон были центром наших морских усилий, с использованием старой персидской дороги через Сирийские ворота.\n\nОни хорошо служили нашей столице, но есть предложения, что поселение Гидатос — всего в коротком расстоянии вниз по реке Оронт и уже заселенное Антигоном карийскими ветеранами — может быть развито в главный порт Антигонеи."
 me_antigonid_1_vision.21.a:0 "Северные порты останутся нашим фокусом."
 me_antigonid_1_vision.21.at:0 "Как только задача миссии '#Y $antigonid_01_vision_2$#!' будет выполнена:"
 me_antigonid_1_vision.21.b:0 "У Гидатоса огромный потенциал."
 me_antigonid_1_vision.21.c:0 "Нет нужды ограничивать себя."
 me_antigonid_1_vision.21.ct:0 "[GetProvince('(int32)789').GetName|Y] также получит '#Y $ant_01_2_2_pmod$#!'."
 me_antigonid_1_vision.22.t:0 "$antigonid_01_vision_2$: Врата Востока"
 me_antigonid_1_vision.22.desc:0 "Наши инженеры завершили работы по углублению дна и строительству, обеспечив Антигонею новыми верфями, причалами и сухими доками без уязвимости, которая обычно сопровождает преимущества такого близкого расположения к океану.\n\n"
 me_antigonid_1_vision.22.desc_1:0 "Скромное поселение, возникшее вокруг трофея Александра после битвы при [GetProvince('(int32)796').GetName], теперь затмевает старый порт в Мириандросе, привлекая торговцев и ремесленников издалека. Нет никаких сомнений в том, что важность и пригодность этого места не были переоценены..."
 me_antigonid_1_vision.22.desc_2:0 "Начальник порта некогда скромной стоянки в Гидатосе теперь может похвастаться одними из лучших сооружений на Востоке, открывая путь для большого объема торговли и растущего района кораблестроителей и поставщиков морского снаряжения.\n\nНаши люди сравнивают местоположение Гидатоса с регионом Пиерия в нашей старой родине Македонии — который также находится между высокой горой и морем и является местом расположения крупного порта в [GetProvince('(int32)6399').GetName] — и уже называют его Антигонеей в честь столицы, которой он служит."
 me_antigonid_1_vision.22.desc_3:0 "Выбирая сбалансированный подход, двойные порты Мириандроса и Гидатоса будут продолжать служить столице, как и прежде, при этом их объекты получат некоторые столь необходимые дополнения и инвестиции."
 me_antigonid_1_vision.22.a:0 "У нашей столицы не будет соперников."
 me_antigonid_1_vision.22.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_2$$mission_task_completed_tt_2$"
 me_antigonid_1_vision.23.t:0 "$antigonid_01_vision_2$: Разрушения войны"
 me_antigonid_1_vision.23.desc:0 "По мере того как наш контроль над Антигонеей и окружающими территориями ослабевает, наши планы по развитию её портов становятся одними из первых, от которых приходится отказаться. Капризы истории украли еще одну мечту Антигонидов..."
 me_antigonid_1_vision.23.a:0 "Тихе дает, Тихе забирает."
 me_antigonid_1_vision.23.at:0 "$mission_task_completed_tt_1$$antigonid_01_vision_2$#!' была #R Пропущена#!!"
 # Phoenician Timber
 me_antigonid_1_vision.31.t:0 "$antigonid_01_vision_3$: Мореходные города"
 me_antigonid_1_vision.31.desc:0 "Наши связи в Греции и контроль над Средиземным морем требуют сильного флота для поддержания, в чем нам сильно помогли финикийцы, находящиеся на нашей службе.\n\nЕсли мы хотим сохранить наше военно-морское превосходство, мы должны убедиться, что наши связи с этими мореходными городами возобновлены и продолжаются."
 me_antigonid_1_vision.31.a:0 "Флот — наш хребет."
 me_antigonid_1_vision.31.at:0 "$me_ant_task_start_tt_1$ дальнейшие переговоры с финикийскими городами-государствами."
 me_antigonid_1_vision.32.t:0 "$antigonid_01_vision_3$: Владычество над морем"
 me_antigonid_1_vision.32.desc:1 "Наши dealings с финикийцами обновили наши давние отношения, вдохнув новый дух срочности в верфи и трюмы наших подданных. Давайте убедимся, что наши морские победы не станут знамениты своей редкостью, и пусть триумф при Саламине ознаменует новую эру доминирования Антигонидов во внутреннем море."
 me_antigonid_1_vision.32.a:0 "Океан принадлежит нам."
 me_antigonid_1_vision.32.at:0 "$mission_task_completed_tt_1$$antigonid_01_vision_3$$mission_task_completed_tt_2$"
 me_antigonid_1_vision.33.t:0 "$antigonid_01_vision_3$: Траур по кедрам"
 me_antigonid_1_vision.33.desc:0 "Потеря финикийских городов расстроила наши морские амбиции в регионе, лишив нас великих верфей и моряков древних торговых портов..."
 me_antigonid_1_vision.33.a:0 "Какая досада."
 me_antigonid_1_vision.33.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_3$#!' была #R Пропущена#!!"
 me_antigonid_1_vision.34.t:0 "$antigonid_01_vision_3$: [philokles_of_sidun.GetPraenomen] из [GetProvince('(int32)747').GetName]"
 me_antigonid_1_vision.34.desc_1:0 "Наши финикийские подданные предоставили большое количество кораблей и моряков для нашего дела, и [philokles_of_sidun.GetPraenomen], богатый принц города [GetProvince('(int32)747').GetName], сыграл важную роль в командовании и организации этих военно-морских сил от нашего имени.\n\nОднако очевидно, что принц жаждет трона своего города-королевства и считает, что настало высокое время вернуть [philokles_of_sidun.GetHerHis] многие услуги и щедрые расходы, угрожая найти работу в другом месте, если мы откажем..."
 me_antigonid_1_vision.34.desc_2:0 "[philokles_of_sidun.GetPraenomen] из [GetProvince('(int32)747').GetName], богатый принц города, помогал нашему делу в прошлом, особенно с нашими финикийскими флотами. Однако [philokles_of_sidun.GetHerHis] амбиции занять трон [philokles_of_sidun.GetHerHis] родного города вызвали разрыв в наших отношениях."
 me_antigonid_1_vision.34.desc_3:0 "[philokles_of_sidun.GetPraenomen] из [GetProvince('(int32)747').GetName], богатый принц города, станет другом в Финикии, на которого мы можем положиться в реализации наших морских амбиций в обмен на трон города."
 me_antigonid_1_vision.34.a:0 "Пусть [philokles_of_sidun.GetHerHim] наслаждается [philokles_of_sidun.GetHerHis] притязаниями."
 me_antigonid_1_vision.34.b:0 "Как жаль..."
 me_antigonid_1_vision.34_await_tt:0 "Мы ожидаем ответа от [GetProvince('(int32)747').GetOwner.GetName|Y]. Если они согласятся:"
 me_antigonid_1_vision.34_else_tt:0 "Если они откажут:"
 me_antigonid_1_vision.35.desc:1 "[philokles_sender.GetAdjective] послы прибыли в [ROOT.GetCountry.GetCapital.GetName] с [philokles_of_sidun.GetPraenomen] из [GetProvince('(int32)747').GetName], богатым дворянином города, который имеет виды на его трон в качестве награды за услуги македонянам.\n\n"
 me_antigonid_1_vision.35.desc_1:0 "Они хотят, чтобы мы сместили нашего правителя и заменили его этим выскочкой — и всё это по прихоти."
 me_antigonid_1_vision.35.desc_2:0 "Они хотят, чтобы мы передали город [philokles_of_sidun.GetPraenomen], ничего не давая взамен..."
 me_antigonid_1_vision.35.a:0 "Мы не будем раскачивать лодку."
 me_antigonid_1_vision.35.b:0 "[philokles_of_sidun.GetPraenomen] не наш король."
 me_antigonid_1_vision.36.desc_1:0 "[philokles_of_sidun.GetPraenomen] из [GetProvince('(int32)747').GetName] был заключен в тюрьму в [philokles_of_sidun.GetHerHis] родном городе как предатель и претендент на трон; похоже, действующему королю не понравилась идея быть замененным..."
 me_antigonid_1_vision.36.desc_2:0 "[GetProvince('(int32)747').GetOwner.GetName] ответил на нашу просьбу передать город [GetProvince('(int32)747').GetName] принцу [philokles_of_sidun.GetPraenomen] возмущением, и их руководство призвало страну к оружию против нас."
 me_antigonid_1_vision.36.desc_3:0 "[philokles_of_sidun.GetPraenomen] из [GetProvince('(int32)747').GetName] был провозглашен королем города с нашего благословения, заняв трон без особого шума или конфликтов."
 me_antigonid_1_vision.36.a:0 "Справедливо."
 me_antigonid_1_vision.36.b:0 "[philokles_of_sidun.GetSheHe|U] будет лоялен..."
 me_antigonid_1_vision.37.desc:0 "[philokles_of_sidun.GetPraenomen] из [GetProvince('(int32)747').GetName] прибыл ко нашему двору, недовольный принц, ищущий помощи в продвижении [philokles_of_sidun.GetHerHis] претензий на трон своего родного города — награда, отказанная Антигонидами, несмотря на [philokles_of_sidun.GetHerHis] услуги их делу."
 me_antigonid_1_vision.37.a:0 "Он может нам пригодиться."
 me_antigonid_1_vision.37.at:0 "Решение '#Y $install_philokles_egypt$#!' теперь доступно, пока [philokles_of_sidun.GetName|Y] жив и находится в [THIS.GetCountry.GetName|Y]."
 me_antigonid_1_vision.38.t:0 "$antigonid_01_vision_3$: Выносливый [phoenician_admiral.GetPraenomen]"
 me_antigonid_1_vision.38.desc:0 "На пристанях Финикии нет недостатка в опытных мореплавателях и капитанах, закаленных десятилетиями, проведенными за сопровождением или грабежом многочисленных торговцев, стремящихся в их города.\n\nОдин человек в частности, местный житель по имени [phoenician_admiral.GetPraenomen], достиг большой известности и славы и был рекомендован нам как надежный рулевой и командир эскадры."
 me_antigonid_1_vision.38.a:0 "[phoenician_admiral.GetSheHe|U] может быть полезен."
 me_antigonid_1_vision.38.at:0 "[phoenician_admiral.GetPraenomen|Y] переедет ко нашему двору."
 me_antigonid_1_vision.38.b:0 "Наши адмиралы более чем способны."
 me_antigonid_1_vision.38.bt:0 "[phoenician_admiral.GetPraenomen|Y] исчезнет."

 me_antigonid_1_vision.39.t:0 "$antigonid_01_vision_3$: Кедровые верфи"
 me_antigonid_1_vision.39.desc:1 "Мастерские кораблестроители финикийских городов уже столетия знамениты своим умением превращать знаменитые ливанские кедры в океанские суда, продавая свои творения тому, кто больше заплатит. Возможно, нам снова понадобится усиление флота через торговлю, если цена будет подходящей."
 me_antigonid_1_vision.39.a:1 "Кораблей никогда не бывает много."
 me_antigonid_1_vision.39.at:0 "Мы получим #Y 10#! @octere! Октер через 50 дней."
 me_antigonid_1_vision.39.b:1 "Мы можем построить свои собственные флоты."

 me_antigonid_1_vision.40.t:0 "$antigonid_01_vision_3$: Построено по заказу"
 me_antigonid_1_vision.40.desc:0 "Запрошенные нами корабли прибыли к побережью нашего порта [port_ship_scope.GetName], где они были переданы [sidun_scope.GetAdjective] моряками нашим собственным матросам. Эти корабли станут отличным дополнением к нашим военно-морским силам."
 me_antigonid_1_vision.40.a:0 "Какое удобство."
 me_antigonid_1_vision.40.tt:0 "#Y 10#! @octere! Октер прибыли к [port_ship_scope.GetName]."
# Demetrios' Playground
 me_antigonid_1_vision.41.t:0 "$antigonid_01_vision_4$: Безрассудство [GetCharacter('(int32)32').GetPraenomen]"
 me_antigonid_1_vision.41.desc:0 "Наша борьба с потомками [GetCharacter('(int32)9').GetPraenomen] за контроль над Грецией продолжается, но нам наконец-то удалось изгнать гарнизон [GetCharacter('(int32)32').GetPraenomen] из города [GetProvince('(int32)418').GetName]; возможно, самой стратегически важной оборонительной позиции в регионе.\n\nОсвобождение города, как мы сделали это с [GetProvince('(int32)416').GetName], является вариантом, но сохранение сил на Акрокоринфе, пусть даже временно, может оказаться слишком ценным активом, чтобы от него отказываться..."
 me_antigonid_1_vision.41.a:0 "[GetProvince('(int32)418').GetName] — важный стратегический гарнизон."
 me_antigonid_1_vision.41.b:0 "Коринфяне слишком долго страдали под оккупацией."
 me_antigonid_1_vision.41.bt:0 "#Y $CORINTH_NAME$#! будет выпущен как #Y Вассал#!."
 me_antigonid_1_vision.41.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_4$$mission_task_completed_tt_2$"
 # Reiterate Tyre Proclamation
 me_antigonid_1_vision.51.t:0 "$antigonid_01_vision_5$: Мечты о свободе"
 me_antigonid_1_vision.51.desc:0 "После того как мы сорвали алчные попытки [GetCharacter('(int32)42').GetPraenomen] захватить [GetProvince('(int32)687').GetArea.GetRegion.GetName] и вернули стратегически важный город [GetProvince('(int32)743').GetName], [GetCharacter('(int32)37').GetPraenomen] поклялся защищать свободу греческих городов от имени Македонии.\n\nХотя некоторые насмехались над этим, считая лишь политической целесообразностью, это породило надежду среди греков на то, что однажды они снова будут управлять собой без македонского вмешательства, как в старые добрые времена; надежду, которую мы можем использовать против других диадохов."
 me_antigonid_1_vision.51.a:0 "Обещания можно выполнять лишь настолько, насколько позволяет ситуация."
 me_antigonid_1_vision.51.at:0 "$me_ant_task_start_tt_1$ успокоение греческих городов-государств."
 me_antigonid_1_vision.52.t:0 "$antigonid_01_vision_5$: Эллинская гордость"
 me_antigonid_1_vision.52.desc:0 "Наши послы рассеялись по всему Эгейскому морю, посещая буле от [GetProvince('(int32)290').GetArea.GetName] до [GetProvince('(int32)418').GetArea.GetName] с заверениями и напоминаниями. Греческий мир страдал от господства македонян со времен победы [GetCharacter('(int32)35').GetPraenomen] II над [GetCountry('THE').GetName], и мы должны обеспечить их послушание обещанием минимального вмешательства во внутренние дела — обращаясь с ними как с союзниками, а не подданными, — иначе они при первой же возможности попытаются возродить свое glorious прошлое."
 me_antigonid_1_vision.52.a:0 "Как только станет безопасно, Эллада будет свободна."
 me_antigonid_1_vision.52.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_5$$mission_task_completed_tt_2$"
 me_antigonid_1_vision.53.t:0 "$antigonid_01_vision_5$: Синойкизм [ant_1_5_synoikism_scope.GetAdjective]"
 me_antigonid_1_vision.53.desc:0 "Воодушевленные нашими продолжающимися дипломатическими усилиями и прошлым участием [GetCharacter('(int32)37').GetPraenomen] в синойкизме, или объединении struggling греческих towns в единые процветающие поселения, наши [ant_1_5_synoikism_scope.GetAdjective] подданные обратились к нам за помощью.\n\nИх [ant_1_5_synoikism_scope.GetRulerTitle] [ant_1_5_synoikism_scope.GetRuler.GetPraenomen] умоляет нас предложить наши ресурсы и экспертизу, как их защитников, для реорганизации [ant_1_5_synoikism_province_scope.GetName] по аналогичному образцу."
 me_antigonid_1_vision.53.a:0 "Добрая воля греков бесценна."
 me_antigonid_1_vision.53.at:0 "Через год часть населения из окружающих [ant_1_5_synoikism_scope.GetAdjective] поселений переедет в #Y [ant_1_5_synoikism_province_scope.GetName]#!, который станет городом."
 me_antigonid_1_vision.53.b:0 "Наши собственные дела достаточно неотложны."
 me_antigonid_1_vision.54.desc:0 "Магистраты, отправленные для помощи [ant_1_5_synoikism_scope.GetAdjective] синойкизму [ant_1_5_synoikism_province_scope.GetName] и его соседних townships, сообщают, что их работа завершена.\n\nОрганизация этого нового городского центра, будем надеяться, поможет нашему подданному помогать нам и сохранит теплые отношения с греками на некоторое время..."
 me_antigonid_1_vision.54.a:0 "Это должно прекратить их нытье..."
 me_antigonid_1_vision.54.tt:0 "[SCOPE.ScriptValue('antigonid_01_vision_5_synoik_value')|0Y] [ant_1_5_synoikism_scope.GetAdjective] переселенцев переезжают в [ant_1_5_synoikism_province_scope.GetName|Y]"
 me_antigonid_1_vision.56.t:0 "$antigonid_01_vision_5$: Благожелательный арбитр"
 me_antigonid_1_vision.56.desc:0 "В бесконечном потоке греческих послов и просителей выделяется одна проблема; провинциальный спор, который может решить только [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen].\n\n"
 me_antigonid_1_vision.56.desc_1:0 "У [ant_1_5_dispute_subject_1.GetName] и [ant_1_5_dispute_subject_2.GetName] давний спор regarding границы [ant_1_5_dispute_territory_1.GetName]-[ant_1_5_dispute_territory_2.GetName], и они seek нашего мнения, чтобы уладить дело..."
 me_antigonid_1_vision.56.desc_2:0 "У [ant_1_5_dispute_subject_1.GetAdjective] townships [ant_1_5_dispute_territory_1.GetName] и [ant_1_5_dispute_territory_2.GetName] давний спор regarding разметки их respective land boundaries."
 me_antigonid_1_vision.56.a:0 "Тщательное изучение положит конец этому фарсу..."
 me_antigonid_1_vision.56.b:0 "[ant_1_5_dispute_subject_2.GetName], вероятно, прав."
 me_antigonid_1_vision.56.c:0 "Просто отдайте это [ant_1_5_dispute_subject_1.GetName]."
 me_antigonid_1_vision.56.d:0 "Как банально..."
 # Formalize Divinity
 me_antigonid_1_vision.61.t:0 "$antigonid_01_vision_6$: Восточная помпезность"
 me_antigonid_1_vision.61.desc:0 "[GetCharacter('(int32)37').GetPraenomen] и [GetCharacter('(int32)38').GetPraenomen] уже были признаны, подобно самому [GetCharacter('(int32)39').GetPraenomen] Великому, живыми божествами некоторыми греческими городами, но теперь настало время официально включить нашу королевскую династию в государственный пантеон, как это сделали Лагиды, сделав наших правителей равными великим царям [GetCountry('MAC').GetName] — [GetCharacter('(int32)35').GetPraenomen] и [GetCharacter('(int32)39').GetPraenomen] — и приблизившись к религиозным влияниям наших восточных земель..."
 me_antigonid_1_vision.61.a:0 "[GetCharacter('(int32)37').GetPraenomen] был божественен!"
 me_antigonid_1_vision.61.at:0 "$me_ant_task_start_tt_1$ легитимизация апофеоза Антигонидов."
 me_antigonid_1_vision.62.t:0 "$antigonid_01_vision_6$: Божественная династия"
 me_antigonid_1_vision.62.desc:0 "Наши усилия по легитимизации предстоящей деификации наших правителей увенчались большим успехом, даже если некоторые более традиционные греческие и македонские дворяне могут насмехаться над этим. Примеры Александра изменили мир, и мы должны принять его религиозные инновации, если наши правители хотят конкурировать за легитимность на востоке."
 me_antigonid_1_vision.62.a:1 "Все должны восхвалять Бога-[ROOT.GetCountry.GetRulerTitle] [divinely_scope.GetPraenomen]!"
 me_antigonid_1_vision.62.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_6$$mission_task_completed_tt_2$"
 # Secure Frontier
 me_antigonid_1_vision.71.t:0 "$antigonid_01_vision_7$: Точки компаса"
 me_antigonid_1_vision.71.desc:0 "Новая атака со стороны других диадохов почти неизбежна, как только они увидят возможность нанести удар. Нам было бы мудро подготовиться к такой eventualities, но мы должны решить, кто из наших fellow Successors представляет наибольшую угрозу..."
 me_antigonid_1_vision.71.a:0 "[ant_01_frontier_egy_scope.GetShortName] на юге наверняка будет атакован [GetCountry('EGY').GetName]."
 me_antigonid_1_vision.71.at:0 "$me_ant_task_start_tt_1$ укрепление выбранной территории.\nКогда задача миссии '#Y $antigonid_01_vision_7$ #!' будет выполнена:"
 me_antigonid_1_vision.71.b:0 "Мы должны защитить наше восточное ядро от [GetCountry('SEL').GetAdjective] атаки в [ant_01_frontier_sel_scope.GetShortName]."
 me_antigonid_1_vision.71.c:0 "Северная граница в [ant_01_frontier_tre_scope.GetShortName] уязвима для [GetCountry('TRE').GetName]."
 me_antigonid_1_vision.71.d:0 "Наш фокус должен быть на западе, в [ant_01_frontier_mac_scope.GetShortName]."
 me_antigonid_1_vision.72.t:0 "$antigonid_01_vision_7$: Черепаший панцирь"
 me_antigonid_1_vision.72.desc:0 "Наши военные инженеры и строители завершили бастион в [ant_01_frontier_scope.GetName], обезопасив [ant_01_frontier_scope.GetState.GetShortName] от любого прямого [ant_01_frontier_owner_scope.GetAdjective] натиска в [me_antigonids_scope.GetAdjective] [ant_01_frontier_scope.GetArea.GetRegion.GetName] и предоставив местный центр для использования нашими гарнизонами и патрулями."
 me_antigonid_1_vision.72.a:0 "Это должно задержать любые атаки..."
 me_antigonid_1_vision.72.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_7$$mission_task_completed_tt_2$"
 me_antigonid_1_vision.73.t:0 "$antigonid_01_vision_7$: Нерелевантный проект"
 me_antigonid_1_vision.73.desc:0 "Изменяющаяся политическая ситуация сделала наши планы по фортификации [ant_01_frontier_scope.GetName] против [ant_01_frontier_owner_scope.GetName] нерелевантными и свела на нет любой прогресс, которого мы могли добиться..."
 me_antigonid_1_vision.73.a:0 "Действительно."
 me_antigonid_1_vision.73.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_7$#!' была #R Пропущена#!!"
# Resettle Laranda
 me_antigonid_1_vision.81.t:0 "$antigonid_01_vision_8$: Исаврийские руины"
 me_antigonid_1_vision.81.desc:0 "Хотя наша знать остается македонской, значительная часть наших подданных решительно чужда нам своими обычаями и языками. Теперь было предложено — как способ завоевать расположение наших подданных и продемонстрировать наше благоволение на Востоке по сравнению с предыдущими македонскими правителями — заново основать исторический исаврийский город [GetProvince('(int32)169').GetName], жители которого сожгли свой город и погибли, предпочтя это позорному поражению от рук жаждущего власти регента Пердикки."
 me_antigonid_1_vision.81.a:0 "Если это поможет нашему делу..."
 me_antigonid_1_vision.81.at:0 "$me_ant_task_start_tt_1$ переселение в [GetProvince('(int32)169').GetName]."
 me_antigonid_1_vision.82.t:0 "$antigonid_01_vision_8$: Возрождение [GetProvince('(int32)169').GetName]"
 me_antigonid_1_vision.82.desc:0 "Наша реконструкция некогда важного города [GetProvince('(int32)169').GetName], выжженного дотла так, что от него осталось лишь расплавленное золото казны и храмов, теперь завершена. Как и задумывалось, эти работы порадовали местное население, которое когда-то указывало на его разрушение как на пример неповиновения жестокости македонского правления."
 me_antigonid_1_vision.82.a:0 "Вражда полезна лишь до определенного предела."
 me_antigonid_1_vision.82.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_8$$mission_task_completed_tt_2$"
 me_antigonid_1_vision.83.t:0 "$antigonid_01_vision_8$: Погасшие угли"
 me_antigonid_1_vision.83.desc:0 "Поскольку территория [GetProvince('(int32)169').GetName] больше не находится под нашим контролем, усилия по восстановлению её былого величия пошли прахом..."
 me_antigonid_1_vision.83.a:0 "Разочаровывает."
 me_antigonid_1_vision.83.at:0 "$mission_task_completed_tt_1$$antigonid_01_vision_8$#!' была #R Пропущена#!!"
 # Attract Greek Colonists
 me_antigonid_1_vision.91.t:0 "$antigonid_01_vision_9$: Земля возможностей"
 me_antigonid_1_vision.91.desc:0 "[GetCharacter('(int32)37').GetPraenomen] уже потратил немало времени на обеспечение прочности людских ресурсов и культурных основ своего царства, расселяя македонян, критян, халкидян и эллинизированных карийцев по своим городам.\n\nХотя [GetProvince('(int32)790').GetName], [GetProvince('(int32)782').GetName], [GetProvince('(int32)1986').GetName] и [GetProvince('(int32)258').GetName] наверняка станут вечными памятниками его дальновидности и величию, дополнительные колонисты могут принести только пользу нашему разнообразному царству."
 me_antigonid_1_vision.91.a:0 "Они придут."
 me_antigonid_1_vision.91.at:0 "$me_ant_task_start_tt_1$ привлечение колонистов для поселения."
 me_antigonid_1_vision.92.t:0 "$antigonid_01_vision_9$: Новая жизнь на Востоке"
 me_antigonid_1_vision.92.desc:0 "Наши послы и магистраты сделали всё возможное, чтобы разжечь энтузиазм к дальнейшей греческой колонизации — используя любые необходимые средства, — пока наши землемеры изучали наши владения в поисках наиболее подходящих мест для переселения.\n\nИх усилия не прошли даром; очевидно, есть немалое количество колонистов, готовых поселиться на выбранном нами месте, которое ожидает лишь окончательного слова нашего [me_antigonids_scope.GetRulerTitle], планирующего назвать колонию в честь отца [GetCharacter('(int32)37').GetPraenomen] Одноглазого — [GetCharacter('(int32)27').GetPraenomen]."
 me_antigonid_1_vision.92.a:0 "[ant_01_9_dest_1_scope.GetName] в [ant_01_9_dest_1_scope.GetArea.GetName] выглядит перспективно."
 me_antigonid_1_vision.92.b:0 "Нам следует развивать [ant_01_9_dest_2_scope.GetName] в [ant_01_9_dest_2_scope.GetArea.GetName]."
 me_antigonid_1_vision.92.c:0 "[ant_01_9_dest_3_scope.GetArea.GetName] и [ant_01_9_dest_3_scope.GetName] будут процветать."
 me_antigonid_1_vision.92.d:0 "Отправьте их в [ant_01_9_dest_4_scope.GetName] в [ant_01_9_dest_4_scope.GetArea.GetName]!"
 me_antigonid_1_vision.92.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_9$$mission_task_completed_tt_2$"
 me_antigonid_1_vision.92.at:0 "[SCOPE.ScriptValue('antigonid_01_vision_9_total_pop')|0Y] групп населения немедленно мигрируют в [ant_01_9_dest_scope.GetName|Y]."
 me_antigonid_1_vision.92.tt2:0 "Каждое участвующее зависимое государство потеряет #R -20#! к мнению о @[me_antigonids_scope.GetFlag]! [me_antigonids_scope.GetName|Y]."
 me_antigonid_1_vision.93.t:0 "$antigonid_01_vision_9$: Поколебленная уверенность"
 me_antigonid_1_vision.93.desc:0 "Наше ослабевающее влияние лишило нас необходимой базы для привлечения колонистов на наши земли или подходящего места для их поселения..."
 me_antigonid_1_vision.93.a:0 "Неважно."
 me_antigonid_1_vision.93.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_9$#!' была #R Пропущена#!!"
 me_antigonid_1_vision.94.t:0 "$antigonid_01_vision_9$: [me_antigonids_scope.GetAdjective] колонисты"
 me_antigonid_1_vision.94.desc:1 "[me_antigonids_scope.GetAdjective] представители распускали слухи о новой жизни на каждой греческой агоре, побуждая наш народ рискнуть и начать новую жизнь на Востоке. Одни называют их предателями, другие — отчаявшимися, но в любом случае наше население понесло убыль."
 me_antigonid_1_vision.94.a:0 "Удачи им..."
 me_antigonid_1_vision.94.tt:1 "[SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('me_ant_01_9_sub_pop_contributor').GetValue|0Y] групп населения переехали к @[SCOPE.GetRootScope.GetCountry.GetOverlord.GetFlag]! [SCOPE.GetRootScope.GetCountry.GetOverlord.GetName]"
 me_antigonid_1_vision.95.t:0 "$antigonid_01_vision_9$: [me_ant_01_9_sub_scope.GetAdjective] колонисты"
 me_antigonid_1_vision.95.desc:0 "Наши попытки привлечь греческих колонистов нашли отклик на агоре [me_ant_01_9_sub_scope.GetCapital.GetName] и за её пределами, где граждане и подданные наших клиентов в [me_ant_01_9_sub_scope.GetName] жаждут возможностей для новой жизни на Востоке. Однако их правительство может resent наше уговаривание, которое не всегда было деликатным..."
 me_antigonid_1_vision.95.a:0 "Превосходно."
 me_antigonid_1_vision.95.at:0 "[SCOPE.ScriptValue('antigonid_01_vision_9_sub_pop_proportion')|0Y] групп населения переедут из [me_ant_01_9_sub_scope.GetName|Y] в выбранное нами место по завершении задачи."
 me_antigonid_1_vision.96.t:0 "$antigonid_01_vision_9$: Энтузиазм [me_ant_01_9_ter_scope.GetCulture.GetName]"
 me_antigonid_1_vision.96.desc:0 "Некоторые греческие жители в окрестностях наших владений в [me_ant_01_9_ter_scope.GetName] в [me_ant_01_9_ter_scope.GetArea.GetName] сообщили о заинтересованности, добровольной или нет, в присоединении к новой восточной колонии Антигонидов!"
 me_antigonid_1_vision.96.a:0 "Отлично."
 me_antigonid_1_vision.96.at:0 "[SCOPE.ScriptValue('antigonid_01_vision_9_ter_pop_proportion')|0Y] [SCOPE.Custom('ant_mis_01_2_pops_loc')] переедут из [me_ant_01_9_ter_scope.GetName|Y] в выбранное нами место по завершении задачи."
 me_antigonid_1_vision.96.b:0 "[ant_01_9_city_2_scope.GetName]"
 me_antigonid_1_vision.96.c:0 "[ant_01_9_city_3_scope.GetName]"
 me_antigonid_1_vision.96.d:0 "[ant_01_9_city_4_scope.GetName]"
 # The Last Laugh
 me_antigonid_1_vision.111.t:0 "$antigonid_01_vision_11$: [me_antigonids_scope.GetRuler.GetPraenomen] Полиоркет"
 me_antigonid_1_vision.111.desc:0 "Мы наконец-то поставили на место ненавистных родосцев, которые пытались оставаться в стороне от конфликтов диадохов, пожинавая плоды нашей защиты. Унижение [GetCharacter('(int32)38').GetPraenomen] теперь искуплено плодами Ники, а мощь Антигонидов поставлена вне всяких сомнений."
 me_antigonid_1_vision.111.desc_1:0 "\n\nНапыщенные родосцы даже воздвигли огромную статую своего бога-покровителя Гелиоса, чтобы commemorate свою победоносную оборону — используя, не меньше того, выручку от продажи наших брошенных осадных машин! Хотя, справедливости ради, ни один честный человек не сможет отрицать красоту и качество exquisite мастерства Хареса..."
 me_antigonid_1_vision.111.desc_2:0 ""
 me_antigonid_1_vision.111.a:0 "Снесите её, они обязаны нам этим."
 me_antigonid_1_vision.111.b:0 "Родосцы теперь знают своё место."
 me_antigonid_1_vision.111.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_11$$mission_task_completed_tt_2$"
 me_antigonid_1_vision.113.t:0 "$antigonid_01_vision_11$: Падение Родоса"
 me_antigonid_1_vision.113.desc:0 "Храбрый город [GetProvince('(int32)266').GetName], стойко сопротивлявшийся [GetCharacter('(int32)38').GetPraenomen] Осаднику и вечно благодарный [GetCharacter('(int32)42').GetPraenomen] Сотеру за помощь в этом деле, всё же пал перед Антигонидами..."
 me_antigonid_1_vision.113.desc_1:0 "\n\nСотер, или Спаситель, был эпитетом, изначально дарованным [GetCharacter('(int32)42').GetPraenomen] I родосцами за то, что он пришел им на помощь, но в свете этих событий прозвище, кажется, утратило всё, кроме самого насмешливого оттенка..."
 me_antigonid_1_vision.113.desc_2:0 ""
 me_antigonid_1_vision.113.a:0 "Сыны Аида..."
 me_antigonid_1_vision.114.t:0 "$antigonid_01_vision_11$: Колосс уничтожен"
 me_antigonid_1_vision.114.desc:0 "Великий город [GetProvince('(int32)266').GetName], выдержавший осаду [GetCharacter('(int32)38').GetPraenomen] Осадника, наконец-то пал перед Антигонидами, несмотря на их договоры. В своей злобе [me_antigonids_scope.GetRuler.GetPraenomen] разобрал чудесный Колосс [helios_scope.GetName], воздвигнутый родосцами в честь их победы; трагическая утрата для Родоса и всех ценителей красоты..."
 me_antigonid_1_vision.114.a:0 "Музы, несомненно, рыдают."
 me_antigonid_1_vision.115.desc_1:0 "Проклятые Антигониды, окрыленные своей победой и всё ещё страдающие от ран, нанесенных когда-то их гордости, низвергли наш glorious памятник Гелиосу! Боги surely никогда не простят этих outrages!"
 me_antigonid_1_vision.115.desc_2:0 "Мы наконец-то пали под оружием Антигонидов, сведя на нет всю нашу тяжелую работу по героической обороне против [GetCharacter('(int32)38').GetPraenomen] Осадника..."
 me_antigonid_1_vision.115.a:0 "Мы должны быть терпеливы, братья."
 # Hellenic Liberator
 me_antigonid_1_vision.121.t:0 "$antigonid_01_vision_12$: Спаситель [GetProvince('(int32)418').GetArea.GetRegion.GetName]"
 me_antigonid_1_vision.121.desc:0 "Мы наконец-то изгнали других диадохов из [GetProvince('(int32)418').GetArea.GetRegion.GetName], реализовав обещания прокламации [GetCharacter('(int32)37').GetPraenomen] в [GetProvince('(int32)743').GetName] и нашу давнюю амбицию по господству над Грецией. Тщательно балансируя между благодетелем и повелителем, мы сможем обеспечить их постоянную лояльность в составе нашего realm."
 me_antigonid_1_vision.121.a:0 "Великолепный трофей."
 me_antigonid_1_vision.121.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_12$$mission_task_completed_tt_2$"
 # League of Korinthos
 me_antigonid_1_vision.131.t:0 "$antigonid_01_vision_13$: Совместное правление"
 me_antigonid_1_vision.131.desc:0 "Поскольку наша позиция защитника греков теперь не подлежит сомнению, самое время воскресить старые административные органы [GetCharacter('(int32)35').GetPraenomen] II и тем самым гарантировать лояльность и сотрудничество непокорных греческих городов.\n\nСнова представители каждого города будут собираться на синедрион в величественном городе [GetProvince('(int32)418').GetName], при этом внешняя политика будет находиться под председательством македонян. Общая армия и сеть договоров приведут раздробленные полисы Эллады в новую эру великих государств и единства, сохраняя при этом их индивидуальную автономию, традиции и идентичность."
 me_antigonid_1_vision.131.a:0 "Нельзя терять время!"
 me_antigonid_1_vision.131.at:0 "$me_ant_task_start_tt_1$ организация #Y $LEAGUE_OF_KORINTHOS$#!."
 me_antigonid_1_vision.132.t:0 "$antigonid_01_vision_13$: Гегемон Греции"
 me_antigonid_1_vision.132.desc:0 "Многие греки вновь оказались под benevolent защитой [ROOT.GetCountry.GetName] и Лиги [GetProvince('(int32)418').GetName], передав внешние дела своих городов в руки единого органа, tasked с защитой Греции. Будем надеяться, что эта итерация просуществует дольше, чем предыдущие..."
 me_antigonid_1_vision.132.a:0 "Пусть они живут долго и процветают."
 me_antigonid_1_vision.132.at:0 "Все наши собственные территории и территории наших подданных будут поглощены [ant_01_13_corinth_scope.GetName|Y]."
 me_antigonid_1_vision.132.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_13$$mission_task_completed_tt_2$"
 me_antigonid_1_vision.133.t:0 "$antigonid_01_vision_13$: Тревожная Эллада"
 me_antigonid_1_vision.133.desc:0 "Наше declining влияние в [GetProvince('(int32)418').GetArea.GetRegion.GetName] сорвало наши попытки организовать новую Лигу и объединить греческие города. Возможно, однажды они объединятся сами и найдут применение своим преимуществам."
 me_antigonid_1_vision.133.a:0 "Теперь греки должны позаботиться о себе сами."
 me_antigonid_1_vision.133.at:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_13$#!' была #R Пропущена#!!"
 me_antigonid_1_vision.134.desc:1 "[me_antigonids_scope.GetAdjective] $me_antigonid_1_vision.134_desc_body$"
 me_antigonid_1_vision.134.a:0 "Возможно, это необходимо..."
 me_antigonid_1_vision.134.at:0 "[ROOT.GetCountry.GetName|Y] станет #Y $LEAGUE_OF_KORINTHOS$#!, получив все греческие территории, принадлежащие или подчиненные @[me_antigonids_scope.GetFlag]! [me_antigonids_scope.GetName|Y] в качестве [me_antigonids_scope.GetAdjective] #Y Вассала#!."
 me_antigonid_1_vision.134.b:0 "...для овцы!"
 me_antigonid_1_vision.134_desc_body:0 "послы прибыли в [ROOT.GetCountry.GetCapital.GetName], они стремятся начать реорганизацию Лиги [GetProvince('(int32)418').GetName], изначально созданной [GetCharacter('(int32)35').GetPraenomen] II из [GetCountry('MAC').GetName]. Публично они заявляют, что их цель — объединить греческие города для общей обороны и дела, хотя македонское доминирование в Лиге suggests otherwise."
 me_antigonid_1_vision.135.t:0 "$antigonid_01_vision_13$: Греческое несогласие"
 me_antigonid_1_vision.135.desc:0 "Наши послы были отвергнуты нашим греческим подданным [ant_01_14_scope.GetName], чьи officials denounced наши дипломатические усилия как не что иное, как замаскированное завоевание!"
 me_antigonid_1_vision.135.a:0 "Глупцы."
 me_antigonid_1_vision.135.tt:0 "@[me_antigonids_scope.GetFlag]! [me_antigonids_scope.GetName|Y] получил claims на все [ant_01_14_scope.GetAdjective|Y] территории."
 me_antigonid_1_vision.136.desc:0 "С завершением formal организации Лиги [GetProvince('(int32)418').GetName] македоняне передали правительство в руки своих избранных представителей, в основном из нашего города [ROOT.GetCountry.GetCapital.GetName]. Это странные времена, но, возможно, unified Греция — это перемены, которых нам не хватало, даже если они delivered македонской сариссой..."
 me_antigonid_1_vision.136.a:0 "Давайте сделаем всё возможное для Греции."
# Diadochi Conquest
 me_antigonid_1_vision.141.t:0 "$antigonid_01_vision_14$: Земля, завоеванная копьем"
 me_antigonid_1_vision.141.desc_1:0 "Несмотря на наши предыдущие неудачи, мы наконец вырвали подступы к [GetCountry('EGY').GetName] из так называемого царства [GetCharacter('(int32)42').GetPraenomen], закрепив за собой великие крепости [GetProvince('(int32)660').GetName] в [GetProvince('(int32)687').GetArea.GetRegion.GetName] и [GetProvince('(int32)509').GetName] на берегах Нила."
 me_antigonid_1_vision.141.desc_2:0 "Мы наконец отвоевали у так называемого царства Лисимаха фракийские берега и множество усеивающих их городов, одновременно пресекая амбиции Антипатридов в отношении Геллеспонта и Азии."
 me_antigonid_1_vision.141.desc_3:0 "Снова отважившись отправиться на Восток, мы успешно вернули просторы Месопотамии из так называемого царства Селевкидов — необходимую буферную зону для обороны [GetProvince('(int32)790').GetArea.GetRegion.GetName]."
 me_antigonid_1_vision.141.desc:0 "\n\nНаши победы, несомненно, продолжатся, прокатываясь по ядру великой империи [GetCharacter('(int32)39').GetPraenomen], пока она вновь не объединится под властью законного македонского монарха."
 me_antigonid_1_vision.141.a:0 "Погребальные игры почти завершены, и лавровый венок на нас."
 me_antigonid_1_vision.141.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_14$$mission_task_completed_tt_2$"
 # Pragmatic Alliance
 me_antigonid_1_vision.151.t:0 "$antigonid_01_vision_15$: Оставим разногласия"
 me_antigonid_1_vision.151.desc:0 "Войны за наследие [GetCharacter('(int32)39').GetPraenomen] продолжаются без видимого конца. Поскольку глава оригинальных диадохов закрывается, возможно, пришло время принять статус-кво и оставить будущие разногласия сыновьям и дочерям, которые придут нам на смену...\n\nСкоординированные дипломатические усилия с другим наследником могут склонить чашу весов и дать передышку нашему новорожденному царству."
 me_antigonid_1_vision.151.a:0 "[ant_01_15_portrait_1.GetName]"
 me_antigonid_1_vision.151.at:0 "Мы обратимся к [ant_01_15_target.GetName|Y] с предложением дружбы."
 me_antigonid_1_vision.151.b:0 "[ant_01_15_portrait_2.GetName]"
 me_antigonid_1_vision.151.c:0 "[ant_01_15_portrait_3.GetName]"
 me_antigonid_1_vision.151.d:0 "[ant_01_15_portrait_4.GetName]"
 me_antigonid_1_vision.151.e:0 "Нет, нам не нужны союзники!"
 me_antigonid_1_vision.151.tt:0 "$mission_task_completed_tt_1$$antigonid_01_vision_15$$mission_task_completed_tt_2$"
 me_antigonid_1_vision.152.t:0 "$antigonid_01_vision_15$: Династические узы"
 me_antigonid_1_vision.152.desc:0 "Предложение союза — это хорошо, но прочная связь, основанная на взаимном доверии, может быть гарантирована только общими интересами брака.\n\nНаиболее очевидной партией для королевского брака между нашими двумя государствами был бы брак [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_groom_flag').GetCharacter.GetEmployer.GetAdjective] принца [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_groom_flag').GetCharacter.GetPraenomen] с [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_bride_flag').GetCharacter.GetEmployer.GetAdjective] принцессой [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_bride_flag').GetCharacter.GetPraenomen], тем самым скрепив династическую связь."
 me_antigonid_1_vision.152.a:0 "Отправить предложение."
 me_antigonid_1_vision.152.at:0 "Мы предложим брак между [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_groom_flag').GetCharacter.GetPraenomen|Y] и [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_bride_flag').GetCharacter.GetPraenomen|Y], переместив последнюю к @[me_antigonids_scope.MakeScope.GetVariable('ant_01_15_groom_flag').GetCharacter.GetEmployer.GetFlag]! [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_groom_flag').GetCharacter.GetEmployer.GetName|Y]."
 me_antigonid_1_vision.152.b:0 "Нам нужен только союз."
 me_antigonid_1_vision.152.bt:0 "Мы предложим @[ant_01_15_target.GetFlag]! [ant_01_15_target.GetName|Y] союз."
 me_antigonid_1_vision.152.c:0 "Подумав еще раз, отменим всё это!"
 me_antigonid_1_vision.153.t:0 "$antigonid_01_vision_15$: [me_antigonids_scope.GetAdjective] дипломатия"
 me_antigonid_1_vision.153.desc:0 "Наши исторические враги в борьбе за империю [GetCharacter('(int32)39').GetName], Антигониды, предложили зарыть топор войны ради нашей взаимной выгоды, заключив союз. Хотя это даст нам некоторую передышку, чтобы сосредоточиться на обеспечении наших интересов в других местах, это может принести Антигонидам больше пользы, чем нам."
 me_antigonid_1_vision.153.desc_1:0 "\n\nЧтобы скрепить сделку, они предложили брак между [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_groom_flag').GetCharacter.GetEmployer.GetAdjective] принцем [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_groom_flag').GetCharacter.GetPraenomen] и [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_bride_flag').GetCharacter.GetEmployer.GetAdjective] принцессой [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_bride_flag').GetCharacter.GetPraenomen], указывая на желание более постоянного объединения интересов..."
 me_antigonid_1_vision.153.a:0 "Мир имеет свои преимущества."
 me_antigonid_1_vision.153.b:0 "Только союз, ничего более."
 me_antigonid_1_vision.153.c:0 "Возможно, так будет лучше."
 me_antigonid_1_vision.153.d:0 "Трусы, должно быть, созрели для захвата!"
 me_antigonid_1_vision.153.dt:0 "Мы отвергнем предложение @[me_antigonids_scope.GetFlag]! [me_antigonids_scope.GetAdjective|Y]."
 me_antigonid_1_vision.154.t:0 "$antigonid_01_vision_15$: Ответ [ant_01_15_target.GetAdjective]"
 me_antigonid_1_vision.154.desc:0 "Наши послы вернулись из двора [ant_01_15_target.GetAdjective] с новостью, что они "
 me_antigonid_1_vision.154.desc_1:0 "с энтузиазмом приняли наше предложение о браке и союзе; немедленно организуя празднества для [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_groom_flag').GetCharacter.GetPraenomen] и [me_antigonids_scope.MakeScope.GetVariable('ant_01_15_bride_flag').GetCharacter.GetPraenomen]!"
 me_antigonid_1_vision.154.desc_2:0 "приняли прагматичный союз на время, явно опасаясь столкнуться с нашими сариссами в ближайшее время..."
 me_antigonid_1_vision.154.desc_3:0 "приняли прагматичный союз на время, но отказались принимать наше предложение о королевском браке."
 me_antigonid_1_vision.154.desc_4:0 "отвергли наше предложение с порога, назвав нас трусами, которые должны быть готовы к завоеванию, раз пришли просить подачек от соперника."
 me_antigonid_1_vision.154.a:0 "Слава Гере!"
 me_antigonid_1_vision.154.b:0 "Нам нечего жаловаться!"
 me_antigonid_1_vision.154.c:0 "Одной проблемой меньше."
 me_antigonid_1_vision.154.d:0 "Для этого у нас есть копья."
 me_antigonid_1_vision.158.desc:0 "Вероломные Антигониды заключили союз с царством [ant_01_15_target.GetAdjective]! Это наверняка нарушит баланс союзов в пользу Антигонидов..."
 me_antigonid_1_vision.158.a:0 "Нехорошо."
 ### Macedonian Aspiration
 me_antigonid_2_aspiration.1.t:0 "$antigonid_02_aspiration$: Истинное королевское достоинство"
 me_antigonid_2_aspiration.1.desc:0 "Хотя царство нашего основателя могло стать добычей вероложных, оппортунистических трусов из других царств диадохов, его королевский статус проистекал из санкции регента наследников Александра и его собственной бесподобной славы.\n\n[ROOT.GetCountry.GetRuler.GetPraenomen] — это [ROOT.GetCountry.GetRulerTitle] и законный претендент на трон Македонии!"
 me_antigonid_2_aspiration.1.a:0 "Это еще не конец."
 me_antigonid_2_aspiration.2.t:0 "$antigonid_02_aspiration$: Македонская королевская власть"
 me_antigonid_2_aspiration.2.desc:0 "Мы обеспечили выживание славной династии Антигона, несмотря на многие испытания; даже объединенная мощь царств-наследников не могла сравниться с упорством богоизбранных сыновей.\n\nКогда родная Македония будет в безопасности, наши старые восточные владения, возможно, однажды будут возвращены из незаконных восточных царств..."
 me_antigonid_2_aspiration.2.a:0 "Царство Антигона принадлежит нам."
 me_antigonid_2_aspiration.2.at:0 "Миссия '#Y $antigonid_01_vision$#!' теперь #G Завершена#!!\nМиссия '#Y $antigonid_03_dominance$#!'' теперь доступна."
 # Greek Dominion
 me_antigonid_2_aspiration.11.t:0 "$antigonid_02_aspiration_1$: Освобождение Греции"
 me_antigonid_2_aspiration.11.desc:0 "Походы Деметрия и других генералов Антигонидов в Греции были встречены с облегчением после хаоса и жестокости Полиперхона и Кассандра, но с потерей Востока наше отчаянное стремление обеспечить контроль стало очевидным.\n\nГреки должны принять наш авторитет как их «освободителей» и законных македонских повелителей, иначе заплатят цену."
 me_antigonid_2_aspiration.11.a:0 "Эти греки никогда не сдаются..."
 me_antigonid_2_aspiration.11.at:0 "$me_ant_task_start_tt_1$ осуждение ложных правителей Греции."
 me_antigonid_2_aspiration.12.t:0 "$antigonid_02_aspiration_1$: Битва за Грецию"
 me_antigonid_2_aspiration.12.desc:0 "После смерти Александра Антипатр держал греков в узде при Ламии, но после его собственной смерти полуостров стал все более хаотичным. Теперь уход Антигона может ознаменовать новую эру конфликтов для региона, и мы должны убедиться, что не позволим возрождающемуся греческому государству или другому диадоху вытеснить нас.\n\nГреция должна понять, что македонское, антигонидское, лидерство не подлежит обсуждению."
 me_antigonid_2_aspiration.12.a:0 "Давайте посмотрим, из чего они сделаны."
 me_antigonid_2_aspiration.12.at:0 "@[me_antigonids_scope.GetFlag]! [me_antigonids_scope.GetName|Y] получает претензии на все территории диадохов, олигархий и монархий в $ant_hellas_list_tt$. ([SCOPE.ScriptValue('antigonid_02_aspiration_1_final')|0Y] территорий)"
 # Dominate Epirus
 me_antigonid_2_aspiration.21.t:0 "$antigonid_02_aspiration_2$: Соседское соперничество"
 me_antigonid_2_aspiration.21.desc:0 "Подчинение эпиротов заканчивает дни долго терпимого шипа в боку Македонии и унижает династию Эакидов с их высокими претензиями на трон Македонии. Выносливые воины молосских племен теперь научатся служить нашим амбициям."
 me_antigonid_2_aspiration.21.a:0 "Где ты теперь, Ахиллес?"
 me_antigonid_2_aspiration.21.tt:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_2$$mission_task_completed_tt_2$"
 # Recover Cilicia
 me_antigonid_2_aspiration.31.t:0 "$antigonid_02_aspiration_3$: Восточный перекресток"
 me_antigonid_2_aspiration.31.desc:0 "Прибрежная равнина Киликии, известная своими пиратами, богатыми городами и стратегическим положением между Фригией и Сирией, была неотъемлемой частью царства Антигона.\n\nВозвращение этой области позволит нам вновь заявить о своих правах на Восток и усилить наше военно-морское господство во внутреннем море."
 me_antigonid_2_aspiration.31.a:0 "Судьба то жарит, то студит."
 me_antigonid_2_aspiration.31.tt:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_3$$mission_task_completed_tt_2$"
 # Dynastic Relevance
 me_antigonid_2_aspiration.41.t:0 "$antigonid_02_aspiration_4$: Падение с высоты"
 me_antigonid_2_aspiration.41.desc_1:0 "Хотя наше царство может быть расколото, побеждено альянсом других диадохов, престиж нашей династии после побед Антигона и лет правления не подлежит сомнению, особенно среди наших восточных подданных.\n\nВ нашем униженном положении другие диадохи могут согласиться на дружбу через кровный pact, что сейчас является обычным явлением среди других наследников."
 me_antigonid_2_aspiration.41.desc_2:0 "Наше щедрое предложение [ant_2_marriage_country_scope.GetAdjective] псам было отвергнуто с презрением их [ant_2_marriage_country_scope.GetRulerTitle], [ant_2_marriage_country_scope.GetRuler.GetPraenomen].\n\nНам придется искать в другом месте, если наш план должен принести плоды..."
 me_antigonid_2_aspiration.41.desc_3:0 "Все наши переговоры пошли прахом, другие царства-наследники отказываются видеть ценность союза с нашей династией. Пусть они живут, чтобы сожалеть об этом оскорблении, клянусь Зевсом!"
 me_antigonid_2_aspiration.41.a:0 "Мы ищем возмещения с [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('ant_2_marriage_country_1').GetCountry.GetName]."
 me_antigonid_2_aspiration.41.at:0 "@[ant_2_marriage_country_scope.GetFlag]! [ant_2_marriage_country_scope.GetName|Y] получит предложение женить своего правителя на [ant_2_marriage_bride_scope.GetName|Y].\nЕсли кто-либо из них уже в браке, они разведутся.\nЕсли @[ant_2_marriage_country_scope.GetFlag]! [ant_2_marriage_country_scope.GetName|Y] примет предложение, мы получим:"
 me_antigonid_2_aspiration.41.b:0 "Мы обратимся к [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('ant_2_marriage_country_2').GetCountry.GetName]."
 me_antigonid_2_aspiration.41.c:0 "[SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('ant_2_marriage_country_3').GetCountry.GetName] может стать полезным союзником."
 me_antigonid_2_aspiration.41.d:0 "Мы не опустимся так низко!"
 me_antigonid_2_aspiration.41.e:0 "Возмутительно..."
 me_antigonid_2_aspiration.41.tt:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_4$$mission_task_completed_tt_2$"
 me_antigonid_2_aspiration.42.t:0 "$antigonid_02_aspiration_4$: Королевский брак"
 me_antigonid_2_aspiration.42.desc:0 "Династия Антигона, хотя и потерявшая былую славу, приобрела lasting fame благодаря годам правления в Азии. Так называемый [me_antigonids_scope.GetRulerTitle] их оставшихся территорий, [me_antigonids_scope.GetRuler.GetName], теперь обращается к нам с предложением королевского брака.\n\nТакой жест может быть выгоден обеим сторонам, закапывая прошлые rivalries на новом фундаменте крови."
 me_antigonid_2_aspiration.42.a:0 "Это весьма приятно."
 me_antigonid_2_aspiration.42.b:0 "Она выйдет замуж за наследника, [ant_2_primary_heir.GetPraenomen]!"
 me_antigonid_2_aspiration.42.bt:0 "Это весьма приятно."
 me_antigonid_2_aspiration.42.c:0 "Им следует принять свое поражение, они лишь позорят себя."
 me_antigonid_2_aspiration.42.ct:0 "Мы отвергнем предложение @[me_antigonids_scope.GetFlag]! [me_antigonids_scope.GetAdjective|Y]."
 me_antigonid_2_aspiration.43.desc:0 "Наши послы с удовольствием сообщают, что [ant_2_marriage_country_scope.GetAdjective] приняли наше предложение, согласившись на брак [ant_2_marriage_groom_scope.GetName] и [ant_2_marriage_bride_scope.GetName], а вместе с ним и на объединение наших домов!\n\nБогатые пиры и фестивали будут сопровождать случай их union в [ant_2_marriage_groom_scope.GetEmployer.GetCapital.GetName] — будем надеяться, что это благословенное начало lasting friendship, какими бы ни были наши различия в прошлом."
 me_antigonid_2_aspiration.43.a:0 "За [ant_2_marriage_groom_scope.GetPraenomen] и [ant_2_marriage_bride_scope.GetPraenomen]!"
# Strategic Fastness
 me_antigonid_2_aspiration.51.t:0 "$antigonid_02_aspiration_5$: Оковы Греции"
 me_antigonid_2_aspiration.51.desc:0 "Наши солдаты secured крепость на вершине величественной горы Акрокоринф, а вместе с ней и самый важный стратегический гарнизон в Элладе.\n\nС нашими потерями на Востоке контроль над Грецией стал еще более важным; эта крепость должна обеспечить нашу хватку."
 me_antigonid_2_aspiration.51.a:0 "Мы не должны упустить Грецию."
 me_antigonid_2_aspiration.51.at:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_5$$mission_task_completed_tt_2$"
 # Blades of Tainaron
 me_antigonid_2_aspiration.61.t:0 "$antigonid_02_aspiration_6$: Солдаты удачи"
 me_antigonid_2_aspiration.61.desc:0 "Мыс Тайнарон к югу от Спарты стал притоном наемников, привлекая заблудшие души со всего эллинского мира, ищущие шумной и опасной жизни платного воина.\n\nЗдесь много опытных наемников, служивших в войнах Александра, или диадохов, или в мелких спорах городов-государств от Сиракуз до Никониона, и за немного золота они могут помочь нашему делу."
 me_antigonid_2_aspiration.61.a:0 "Нам нужно каждое преимущество в грядущих конфликтах."
 me_antigonid_2_aspiration.61.at:0 "$me_ant_task_start_tt_1$ обращение к наемникам Тайнарона."

 me_antigonid_2_aspiration.62.t:0 "$antigonid_02_aspiration_6$: Военная стратегия"
 me_antigonid_2_aspiration.62.desc:0 "Мы завершили обход лагерей в Тайнароне, но остается решить, как лучше всего использовать таланты его обитателей.\n\nНекоторые взятки могут дать нам больший доступ к услугам их компаний, но привлечение их командиров в наши ряды снизит нашу зависимость от наемников."
 me_antigonid_2_aspiration.62.a:0 "Смазать ладони влиятельных капитанов."
 me_antigonid_2_aspiration.62.b:0 "Самые опытные офицеры будут инструктировать наши ряды."
 me_antigonid_2_aspiration.62.tt:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_6$$mission_task_completed_tt_2$"
 me_antigonid_2_aspiration.63.t:0 "$antigonid_02_aspiration_6$: Закаленные командиры"
 me_antigonid_2_aspiration.63.desc:0 "Наши офицеры обыскивали лагеря и агору Тайнарона в поисках опытных командиров, которые помогли бы нашему делу против других царств диадохов.\n\nСреди мошенников и авантюристов, заполняющих это место, они нашли двух опытных командиров наемников, готовых служить нашему [SCOPE.GetRootScope.GetCountry.GetRulerTitle] — за плату."
 me_antigonid_2_aspiration.63.a:0 "[antigonid_general_1.GetPraenomen] будет полезен."
 me_antigonid_2_aspiration.63.b:0 "Приготовьте коня для [antigonid_general_2.GetPraenomen], он едет в столицу."
 me_antigonid_2_aspiration.63.c:0 "Отправьте их обратно в свои гамаки..."
 me_antigonid_2_aspiration.63.tt:0 "[accepted_general.GetName|Y] присоединится к нашему двору.\n[rejected_general.GetName|Y] исчезнет."
 me_antigonid_2_aspiration.63.ct:0 "[antigonid_general_1.GetName|Y] и [antigonid_general_2.GetName|Y] исчезнут."
 # Hellenic Hegemon
 me_antigonid_2_aspiration.71.t:0 "$antigonid_02_aspiration_7$: Защитник городов"
 me_antigonid_2_aspiration.71.desc:0 "Наш широкий охват и влияние на Грецию и её многочисленные города дали нам большой опыт в управлении разнообразными группами интересов и юридическими спорами, не говоря уже о бесспорном положении истинного лидера греческого мира.\n\nХотя мечта о Коринфском союзе, возможно, мертва, управление полуавтономными греческими государствами на нашей службе все еще является интригующим предложением."
 me_antigonid_2_aspiration.71.a:0 "Да, полуавтономными."
 me_antigonid_2_aspiration.71.tt:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_7$$mission_task_completed_tt_2$"
 # Alkimachid Heartland
 me_antigonid_2_aspiration.81.t:0 "$antigonid_02_aspiration_8$: Приобретения"
 me_antigonid_2_aspiration.81.desc:0 "Теперь, когда сердце старой сатрапии Лисимаха находится под нашим контролем, вместе с торговыми постами Геллеспонта, наши потери на Востоке переносятся несколько легче."
 me_antigonid_2_aspiration.81.a:0 "Одной проблемой меньше."
 me_antigonid_2_aspiration.81.at:0 "@[me_antigonids_scope.GetFlag]! [me_antigonids_scope.GetName|Y] получает претензии на провинции [GetProvince('(int32)252').GetArea.GetName|Y] и [GetProvince('(int32)245').GetArea.GetName|Y]."
 me_antigonid_2_aspiration.81.tt:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_8$$mission_task_completed_tt_2$"
 # Throne of Alexander
 me_antigonid_2_aspiration.91.t:0 "$antigonid_02_aspiration_9$: Наконец-то дома"
 me_antigonid_2_aspiration.91.desc:0 "Наша династия успешно вернула великую столицу македонян и ancestral tombs её лидеров и воинов у проклятой династии Антипатра. Положение династии Антигонидов как законных царей Македонии, больше не mere provincial successors мертвой империи, теперь обеспечено."
 me_antigonid_2_aspiration.91.a:0 "[me_antigonids_scope.GetRuler.GetPraenomen] — это [me_antigonids_scope.GetRulerTitle] Македонии!"
 me_antigonid_2_aspiration.91.at:0 "Мы примем флаг и цвета Македонии."
 me_antigonid_2_aspiration.91.b:0 "Это было и всегда будет царством Антигона."
 me_antigonid_2_aspiration.91.bt:0 "Мы сохраним флаг и цвета Антигонидов."
 me_antigonid_2_aspiration.91.c:0 "Мы правим Македонией, но это не та Македония, что была прежде."
 me_antigonid_2_aspiration.91.ct:0 "Мы примем цвета Македонии, но сохраним символы Антигонидов."
 me_antigonid_2_aspiration.91.d:0 "Это новая глава в истории македонян."
 me_antigonid_2_aspiration.91.dt:0 "Мы примем символы Македонии, но сохраним цвета Антигонидов."
 me_antigonid_2_aspiration.91.tt:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_9$$mission_task_completed_tt_2$"
 # Thessalian Fetter
 me_antigonid_2_aspiration.101.t:0 "$antigonid_02_aspiration_10$: Южный оплот"
 me_antigonid_2_aspiration.101.desc:0 "Много говорят о стратегических греческих городах Халкида и Коринф и их важности для македонских интересов, но Фессалия лежит на пути в Грецию из Пеллы, и её обеспечение бесценно для защиты наших интересов в обоих регионах.\n\nБыло предложено основать новый город и крепость на Пагасийском заливе, названный в честь сына Антигона Деметрия, чтобы защищать Фессалию и Грецию."
 me_antigonid_2_aspiration.101.a:0 "Старые Феры уступят место Деметриаде."
 me_antigonid_2_aspiration.101.at:0 "$me_ant_task_start_tt_1$ основание Деметриады."
 me_antigonid_2_aspiration.102.t:0 "$antigonid_02_aspiration_10$: Инаугурация Деметриады"
 me_antigonid_2_aspiration.102.desc:0 "Наши рабочие завершили строительство нового города Деметриада near старого портового города Пагасы и исторического фессалийского города Феры, население которых было переселено в новые жилища на этом месте.\n\nЭтот новый стратегический гарнизон наверняка будет процветать, располагаясь между Македонией и Грецией как по суше, так и по морю..."
 me_antigonid_2_aspiration.102.a:0 "Город, достойный нашего царства."
 me_antigonid_2_aspiration.102.tt:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_10$$mission_task_completed_tt_2$"
 me_antigonid_2_aspiration.103.t:0 "$antigonid_02_aspiration_10$: Заброшенные планы"
 me_antigonid_2_aspiration.103.desc:0 "Поскольку [GetProvince('(int32)391').GetName] больше не в наших руках, наши планы по основанию нового города Деметриада больше не могут быть осуществлены..."
 me_antigonid_2_aspiration.103.a:0 "Проклятие."
 me_antigonid_2_aspiration.103.at:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_10$#!' была #R Пропущена#!!"
#  Antigonid Royalty
 me_antigonid_2_aspiration.111.t:0 "$antigonid_02_aspiration_11$: Царство Македония"
 me_antigonid_2_aspiration.111.desc:0 "Хотя нас и вытеснили из завоеванного копьем восточного царства Антигона, наши успехи на западе, возможно, искупили нашу династию в глазах предка и богов.\n\nАнтипатриды были изгнаны из царства Александра, и Антигониды вернулись на свою исконную родину как законные цари Македонии."
 me_antigonid_2_aspiration.111.a:0 "Да правят они долго."
 me_antigonid_2_aspiration.111.at:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_11$$mission_task_completed_tt_2$"
  # Fourth Fetter
 me_antigonid_2_aspiration.121.t:0 "$antigonid_02_aspiration_12$: Непокорный Пелопоннес"
 me_antigonid_2_aspiration.121.desc:1 "Стратегические города [GetProvince('(int32)407').GetName] и [GetProvince('(int32)418').GetName] давно гарнизированы македонскими войсками для обеспечения контроля над центральной частью [GetProvince('(int32)418').GetArea.GetRegion.GetName], но за пределами последнего Пелопоннес полностью лишен защиты от восстаний.\n\nЕсли спартанцев нужно держать в узде, а ахейцам не давать взбрести в голову разные идеи, требуются четвертые оковы, и гора Ифома, вершина над городом [GetProvince('(int32)431').GetName], известная своим храмом Зевса Ифомата, имеет явные преимущества благодаря своей местности и положению."
 me_antigonid_2_aspiration.121.a:0 "Не теряя времени."
 me_antigonid_2_aspiration.121.at:0 "$me_ant_task_start_tt_1$ строительство крепости на горе Ифома."
 me_antigonid_2_aspiration.122.t:0 "$antigonid_02_aspiration_12$: Южный оплот"
 me_antigonid_2_aspiration.122.desc:0 "Наши рабочие наконец завершили стены и казармы запланированной крепости на вершине горы Ифома, служащей македонским оплотом в Южной Греции, способным соперничать с Акрокоринфом."
 me_antigonid_2_aspiration.122.a:0 "Греция наконец в безопасности..."
 me_antigonid_2_aspiration.122.tt:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_12$$mission_task_completed_tt_2$"
 me_antigonid_2_aspiration.123.t:0 "$antigonid_02_aspiration_12$: Потерянная гора"
 me_antigonid_2_aspiration.123.desc:0 "Поскольку она больше не в наших руках, все работы по строительству гарнизонной крепости на вершине горы Ифома были остановлены, похоронив наши планы."
 me_antigonid_2_aspiration.123.a:0 "Чёрт."
 me_antigonid_2_aspiration.123.tt:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_12$#!' была #R Пропущена#!!"
 # Poseidon's Throne
 me_antigonid_2_aspiration.131.t:0 "$antigonid_02_aspiration_13$: Возрожденный флот"
 me_antigonid_2_aspiration.131.desc:0 "Прилагаются все усилия для обеспечения выживания династии Антигонидов, и наше военно-морское господство над Египтом и другими диадохами является одним из важнейших гарантов успеха. Без сильного флота мы не сможем надеяться проецировать силу на Восток или защищать наши греческие владения от Египта."
 me_antigonid_2_aspiration.131.a:0 "Именно так."
 me_antigonid_2_aspiration.131.at:0 "$me_ant_task_start_tt_1$ изучение расширения флота."
 me_antigonid_2_aspiration.132.t:0 "$antigonid_02_aspiration_13$: Морские вопросы"
 me_antigonid_2_aspiration.132.desc:0 "Уроки походов Деметрия при Саламине и Родосе ещё свежи, и многие считают, что великие корабли, способные разрушать укрепления с помощью новых разработок в осадной артиллерии, — это будущее.\n\nОднако есть и те, кто предпочитает традиционные роли флота, полагаясь на абордаж и скорость, чтобы доминировать на волнах, пока сухопутные армии разбираются с укреплениями."
 me_antigonid_2_aspiration.132.a:0 "Наши могучие руки сделают их форты бесполезными."
 me_antigonid_2_aspiration.132.b:0 "Море станет озером Антигонидов."
 me_antigonid_2_aspiration.132.tt:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_13$$mission_task_completed_tt_2$"
 me_antigonid_2_aspiration.133.t:0 "$antigonid_02_aspiration_13$: Владыки морей"
 me_antigonid_2_aspiration.133.desc:0 "Наше дело находит много сочувствующих ушей среди моряков и пиратов Средиземноморья, ведь военно-морские усилия Антигона финансировали многие их карьеры — законные или нет.\n\nБыли найдены два перспективных македонских командира, готовых служить в наших флотах."
 me_antigonid_2_aspiration.133.a:0 "Добро пожаловать на борт, [antigonid_admiral_1.GetPraenomen]."
 me_antigonid_2_aspiration.133.b:0 "[antigonid_admiral_2.GetPraenomen] — наш человек."
 me_antigonid_2_aspiration.133.tt:0 "[accepted_admiral.GetName|Y] присоединится к нашему двору.\n[rejected_admiral.GetName|Y] исчезнет."
 me_antigonid_2_aspiration.134.t:0 "$antigonid_02_aspiration_13$: Жестокие судьбы"
 me_antigonid_2_aspiration.134.desc:0 "Поскольку у нас не осталось портов, наши мечты о военно-морском господстве пошли прахом. Если Антигонидам и предстоит когда-нибудь снова выставить сильный флот, то это будет не скоро..."
 me_antigonid_2_aspiration.134.a:0 "Проклятье..."
 me_antigonid_2_aspiration.134.tt:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_13$#!' была #R Пропущена#!!"
 # Stable Dynasty
 me_antigonid_2_aspiration.141.t:0 "$antigonid_02_aspiration_14$: Поколения царей"
 me_antigonid_2_aspiration.141.desc:0 "Легитимность нашего царства во многом проистекает из деяний Антигона Одноглазого, чья коронация ознаменовала возвышение династии до македонской королевской власти, выходящей за рамки простых завоеваний и позёрства.\n\nПоскольку корона теперь перешла ко второму поколению его потомков, мы доказали достойность семьи как стабильных правителей Македонии."
 me_antigonid_2_aspiration.141.a:0 "Мы непобедимы..."
 me_antigonid_2_aspiration.141.at:0 "$mission_task_completed_tt_1$$antigonid_02_aspiration_14$$mission_task_completed_tt_2$"
 me_antigonid_2_aspiration.141.b:0 "...и этого достаточно."
 ### Antigonid Birthright
 me_antigonid_3_birthright.1.t:0 "$antigonid_03_birthright$: Возвращение Востока"
 me_antigonid_3_birthright.1.desc:0 "Это был трудный путь, но, несмотря на многие слабости нашего дома и отступление на запад, мы показали миру, что благородство Антигонидов проистекает из их природных способностей, а не из длины списков их подданных и владений.\n\nЕсть мечта вернуться на Восток, в великие города и колонии, основанные [GetCharacter('(int32)39').GetPraenomen], и тем самым снять пятно поражения и завоевать лавры несравненной славы."
 me_antigonid_3_birthright.1.a:0 "[GetCharacter('(int32)37').GetPraenomen] будет отомщен."
 me_antigonid_3_birthright.1.at:0 "@[me_antigonids_scope.GetFlag]! [me_antigonids_scope.GetName|Y] получает претензии на регионы [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)243').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)1936').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)1883').GetArea.GetRegion.GetName|Y] и [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y]."

 me_antigonid_3_birthright.2.t:0 "$antigonid_03_birthright$: Никатор"
 me_antigonid_3_birthright.2.desc:0 "Антигониды, возможно, превзошли Аргеадов в своей стойкости и дерзости, добавив к своим владениям Македонию, Азию, Фригию и Сирию вопреки всем шансам.\n\nКогда будут написаны истории об этих днях, именно Антигониды будут помнить как величайших из наследников Александра и самых достойных наследников его короны."
 me_antigonid_3_birthright.2.a:0 "Ника!"
 me_antigonid_3_birthright.2.tt:0 "Миссия '#Y $antigonid_03_birthright$#! была #G Завершена#!!"
 # Kypriot Claim
 me_antigonid_3_birthright.11.t:0 "$antigonid_03_birthright_1$: Средиземноморский приз"
 me_antigonid_3_birthright.11.desc:0 "Великий остров Кипр жизненно важен для любых усилий по контролю над побережьями Финикии и станет полезным плацдармом для возвращения сирийского сердца. Остров должен быть превращен в мощную крепость, неприступную для амбиций любых потенциальных захватчиков.\n\nЭто также возможность расширить другие объекты, которые могут быть полезны нашему делу, что вызывает большой интерес у [me_antigonids_scope.GetRulerTitle] [me_antigonids_scope.GetRuler.GetPraenomen]."
 me_antigonid_3_birthright.11.tt:0 "Если ни один из портов не будет занят или аннексирован, через #Y 365#! дней:"
 me_antigonid_3_birthright.11.a:0 "Плавучая крепость."
 me_antigonid_3_birthright.11.at:0 "[GetProvince('(int32)331').GetName|Y] также получит '#Y $ant_3_1_1_cmod$#!'.\n[GetProvince('(int32)334').GetName|Y] и [GetProvince('(int32)331').GetName|Y] получат до #Y 2 крепостей#! каждый."
 me_antigonid_3_birthright.11.b:0 "Богатство острова — его награда."
 me_antigonid_3_birthright.11.bt:0 "[GetProvince('(int32)331').GetName|Y] также получит '#Y $ant_3_1_2_cmod$#!'.\n[GetProvince('(int32)334').GetName|Y] и [GetProvince('(int32)331').GetName|Y] получат до #Y 1 крепости#! и #Y 1 рынка#! каждый."
 me_antigonid_3_birthright.11.c:0 "Кипрские верфи будут соперничать с финикийскими."
 me_antigonid_3_birthright.11.ct:0 "[GetProvince('(int32)331').GetName|Y] также получит '#Y $ant_3_1_3_cmod$#!'.\n[GetProvince('(int32)334').GetName|Y] и [GetProvince('(int32)331').GetName|Y] получат до #Y 1 крепости#! и #Y 1 порта#! каждый."
 me_antigonid_3_birthright.12.t:0 "$antigonid_03_birthright_1$: Работы завершены"
 me_antigonid_3_birthright.12.desc:0 "Наши рабочие завершили реконструкцию и расширение объектов главных портов Кипра, в точности следуя планам нашего [ROOT.GetCountry.GetRulerTitle].\n\n"
 me_antigonid_3_birthright.12.desc_1:0 "Могучие стены [GetProvince('(int32)334').GetName] и [GetProvince('(int32)331').GetName] обеспечат, чтобы остров оставался в наших руках."
 me_antigonid_3_birthright.12.desc_2:0 "Оживленные эмпории [GetProvince('(int32)334').GetName] и [GetProvince('(int32)331').GetName] принесут великое богатство кипрских медных рудников."
 me_antigonid_3_birthright.12.desc_3:0 "Передовые верфи [GetProvince('(int32)334').GetName] и [GetProvince('(int32)331').GetName] обеспечат постоянный приток кораблей для наших флотов."
 me_antigonid_3_birthright.12.a:0 "Отлично."
 me_antigonid_3_birthright.12.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_1$$mission_task_completed_tt_2$"
 me_antigonid_3_birthright.13.t:0 "$antigonid_03_birthright_1$: Незащищенный остров"
 me_antigonid_3_birthright.13.desc:0 "Наша неспособность сохранить контроль над портами Кипра сорвала наши планы по дальнейшему укреплению его жизненно важных портов..."
 me_antigonid_3_birthright.13.a:0 "Чёрт."
 me_antigonid_3_birthright.13.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_1$#!' была #R Пропущена#!!"
# Treasuries of Asia
 me_antigonid_3_birthright.21.t:0 "$antigonid_02_aspiration_2$: Имперские богатства"
 me_antigonid_3_birthright.21.desc:0 "Значительная часть огромных богатств, изъятых из ахеменидских сокровищниц — сначала Александром Великим, а затем Антигоном, который перевез их в Азию, — всё ещё находится в провинциальных столицах, некогда укрепленных и укомплектованных доверенными подчиненными.\n\nВместо того чтобы оставлять их, чтобы они, возможно, снова финансировали амбиции предателей или захватчиков, давайте используем это богатство сейчас."
 me_antigonid_3_birthright.21.a:0 "Открыть сокровищницы."
 me_antigonid_3_birthright.21.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_2$$mission_task_completed_tt_2$"
 # Aegean Mastery
 me_antigonid_3_birthright.31.t:0 "$antigonid_03_birthright_3$: Наше море"
 me_antigonid_3_birthright.31.desc:0 "Мы обеспечили контроль над большинством крупных портов Эгейского моря, и теперь, когда они под нашим контролем, мы можем гарантировать морской путь в Азию, исключив других диадохов из прибыльных доходов от тарифов и важных убежищ для любых вторжений."
 me_antigonid_3_birthright.31.a:0 "Сейчас самое время."
 me_antigonid_3_birthright.31.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_3$$mission_task_completed_tt_2$"
 # Asian Foothold
 me_antigonid_3_birthright.41.t:0 "$antigonid_03_birthright_4$: Восточный драйв"
 me_antigonid_3_birthright.41.desc:0 "Подобно самому [GetCharacter('(int32)39').GetPraenomen], мы осуществили поход на восток из Македонии, пересекли [GetProvince('(int32)2623').GetName] и вновь утвердились на берегах [GetProvince('(int32)290').GetArea.GetRegion.GetName].\n\nСкоро мы вернем утраченную сатрапию и царство [GetCharacter('(int32)37').GetPraenomen], доказав превосходство нашей династии среди наследников."
 me_antigonid_3_birthright.41.a:0 "Ничто не может нас остановить."
 me_antigonid_3_birthright.41.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_4$$mission_task_completed_tt_2$"
 # Naval Precedents
 me_antigonid_3_birthright.51.t:0 "$antigonid_03_birthright_5$: Морской вызов"
 me_antigonid_3_birthright.51.desc:0 "Прошлые победы Антигонидов доказывают нашу способность доминировать на волнах и держать других диадохов в обороне. Они увидят, насколько могущественным стал наш флот."
 me_antigonid_3_birthright.51.a:0 "Море зовет."
 me_antigonid_3_birthright.51.at:0 "$me_ant_task_start_tt_1$ борьба за сохранение военно-морского господства.\n@[me_antigonids_scope.GetFlag]! [me_antigonids_scope.GetName|Y] должен поддерживать как минимум три четверти (сейчас [SCOPE.ScriptValue('antigonid_4_5_bypass_value')|Y0]) количества кораблей по сравнению с крупнейшим флотом другого диадоха $ant_other_diadochi_tooltip$ в течение #Y 2#! лет."
 me_antigonid_3_birthright.52.t:0 "$antigonid_03_birthright_5$: Доминирующий флот"
 me_antigonid_3_birthright.52.desc:0 "Размер нашего флота не ускользнул от внимания других диадохов и стал предметом разговоров в гаванях и тавернах внутреннего моря, привлекая моряков и кораблестроителей в наши города в поисках службы.\n\nНесомненно, мы можем найти полезного командира, который поможет управлять нашим большим флотом, но, возможно, наш [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName], предпочтет последовать примерам практичных [GetCharacter('(int32)37').GetPraenomen] и [GetCharacter('(int32)38').GetPraenomen] в вопросах командования флотом."
 me_antigonid_3_birthright.52.a:0 "Наши цари хорошо знают волны."
 me_antigonid_3_birthright.52.at:0 "[antigonid_admiral.GetPraenomen] исчезнет."
 me_antigonid_3_birthright.52.b:0 "Новые командиры всегда приветствуются."
 me_antigonid_3_birthright.52.bt:0 "[antigonid_admiral.GetPraenomen] присоединится к нашему двору."
 me_antigonid_3_birthright.52.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_5$$mission_task_completed_tt_2$"
 me_antigonid_3_birthright.53.t:0 "$antigonid_03_birthright_5$: Превзойдены"
 me_antigonid_3_birthright.53.desc:0 "Наши усилия по поддержанию военно-морского господства над другими диадохами не увенчались успехом. Нам придется пока довольствоваться второстепенной позицией."
 me_antigonid_3_birthright.53.a:0 "Проклятье."
 me_antigonid_3_birthright.53.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_5$#!' была #R Пропущена#!!"
 # Satrap of Phrygia
 me_antigonid_3_birthright.61.t:0 "$antigonid_03_birthright_6$: Семена династии"
 me_antigonid_3_birthright.61.desc:0 "Мы наконец вернули всю старую сатрапию [GetCharacter('(int32)37').GetPraenomen] в [GetProvince('(int32)1936').GetArea.GetRegion.GetName]; вечные города, поверженные священным завоевателем [GetCharacter('(int32)37').GetPraenomen]; древние персидские дороги, ведущие из [GetProvince('(int32)290').GetArea.GetName] в [GetProvince('(int32)790').GetName], а оттуда в легендарный [GetProvince('(int32)536').GetName] за великими реками; просторы диких земель, населенные грубыми народами и храмами их странных богов.\n\n[GetCharacter('(int32)39').GetPraenomen] понимал, что его vast empire нельзя управлять с окраин, находясь обратно в [GetProvince('(int32)379').GetName], и хотя наше собственное царство скромно по сравнению с его безграничной империей, было предложено вернуть наши административные функции в original capital [GetCharacter('(int32)37').GetPraenomen]."
 me_antigonid_3_birthright.61.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_6$$mission_task_completed_tt_2$"
 me_antigonid_3_birthright.61.a:0 "Нет, [ROOT.GetCountry.GetCapital.GetName] останется нашей столицей пока что."
 me_antigonid_3_birthright.61.b:0 "Давайте займем старые покои [GetCharacter('(int32)37').GetPraenomen]."
 me_antigonid_3_birthright.61.bt:0 "До [SCOPE.ScriptValue('ant_3_6_svalue')|0Y] групп населения культуры #Y $macedonian$#! переедут из [me_antigonids_scope.GetCapital.GetName] в [GetProvince('(int32)1936').GetName|Y]."
 # Our Strait
 me_antigonid_3_birthright.71.t:0 "$antigonid_03_birthright_7$: Босфорское море"
 me_antigonid_3_birthright.71.desc:0 "Контроль над переправой между Азией и Европой жизненно важен для успеха вторжения в бывшую и, если понадобится, для защиты последней, урок, который сам Антигон усвоил весьма хорошо, когда основал Антигонеи в Мисии и Вифинии.\n\nДавайте убедимся, что форты на переправах являются прочными бастионами."
 me_antigonid_3_birthright.71.a:0 "Никто не пройдет."
 me_antigonid_3_birthright.71.at:0 "$me_ant_task_start_tt_1$ усиление нашей босфорской обороны."
 me_antigonid_3_birthright.71.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_7$$mission_task_completed_tt_2$"
 me_antigonid_3_birthright.72.t:0 "$antigonid_03_birthright_7$: Азиатский плацдарм"
 me_antigonid_3_birthright.72.desc:0 "Наши рабочие завершили укрепление обороны ключевых стратегических точек, охраняющих азиатские подступы и переправы через Боспор."
 me_antigonid_3_birthright.72.a:0 "Отлично."
 me_antigonid_3_birthright.72.at:0 "Любые другие $ant_3_7_fort_spiel_tt$ также получат '#Y $ant_3_7_pmod$#!'."
 me_antigonid_3_birthright.72.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_7$$mission_task_completed_tt_2$"
 me_antigonid_3_birthright.73.t:0 "$antigonid_03_birthright_7$: Заброшенные основы"
 me_antigonid_3_birthright.73.desc:0 "Потеря ключевых городов, приближающихся к босфорской переправе, сделала наши планы по усилению их обороны неактуальными..."
 me_antigonid_3_birthright.73.a:0 "Действительно неактуальными."
 me_antigonid_3_birthright.73.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_7$' была #R Пропущена#!!"
 # Antigoneia
 me_antigonid_3_birthright.81.t:0 "$antigonid_03_birthright_8$: Завидные основы"
 me_antigonid_3_birthright.81.desc:0 "Мы не забыли, что именно [GetCharacter('(int32)37').GetPraenomen] основал великий город на Оронте, независимо от того, что делали или делают те, кто позже захватил его. Благодаря своему стратегическому расположению near Сирийских ворот, естественной защите и доступу к морю, он стал самым важным городом в Сирии; нет сомнений, что у нашего предка была great foresight.\n\nПоскольку место снова под контролем Антигонидов, было предложено перенести нашу администрацию в этот город. Возможно, поступив так, мы завершим видение [GetCharacter('(int32)37').GetPraenomen] о македонском царстве, centered на перекрестке завоеваний [GetCharacter('(int32)39').GetPraenomen]."
 me_antigonid_3_birthright.81.a:0 "Антигонея станет нашей столицей!"
 me_antigonid_3_birthright.81.b:0 "Прошлое осталось в прошлом."
 me_antigonid_3_birthright.81.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_8$$mission_task_completed_tt_2$"
 # To Gaza
 me_antigonid_3_birthright.91.t:0 "$antigonid_03_birthright_9$: У порога Нила"
 me_antigonid_3_birthright.91.desc:0 "Стоя в пустыне Филистии, в шаге от Нила и богатых городов Египта, давайте не забудем о безрассудстве, которое постигло [GetCharacter('(int32)37').GetPraenomen] и [GetCharacter('(int32)38').GetPraenomen] в их попытках вторгнуться туда, подобно [GetCharacter('(int32)406').GetPraenomen] до них.\n\nВозможно, Египет однажды станет нашим, но давайте будем готовы и избежим ловушек, которые преследовали наших предков."
 me_antigonid_3_birthright.91.a:0 "Заберем ли мы приз [GetCharacter('(int32)42').GetPraenomen]?"
 me_antigonid_3_birthright.91.at:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_9$$mission_task_completed_tt_2$"
 # Restore Ionian League
 me_antigonid_3_birthright.101.t:0 "$antigonid_03_birthright_10$: Автономия [header_scope.GetName]"
 me_antigonid_3_birthright.101.desc_1:0 "Наши [GetCountry('ION').GetAdjective] друзья наслаждались большой автономией под нашим ярмом, имея привилегированный доступ к [GetCharacter('(int32)37').GetPraenomen] лишь за помощь в собственной обороне."
 me_antigonid_3_birthright.101.desc_2:0 "[GetCountry('IOA').GetAdjective] были верными друзьями [GetCharacter('(int32)37').GetPraenomen], получая большую помощь в реорганизации своих полисов в обмен на рекрутов."
 me_antigonid_3_birthright.101.desc:0 "\n\nСегодня эти отношения возрождены, и потомки тех, кто процветал под нашим правлением, не забыли о нашей доброте."
 me_antigonid_3_birthright.101.a:0 "Почему бы и нет, [me_antigonids_scope.GetRuler.GetPraenomen] ДЕЙСТВИТЕЛЬНО освободитель!"
 me_antigonid_3_birthright.101.b:0 "Не будем заострять на этом внимание."
 me_antigonid_3_birthright.101.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_10$$mission_task_completed_tt_2$"
 # Reclaimer
 me_antigonid_3_birthright.111.t:0 "$antigonid_03_birthright_11$: Царство нашего основателя"
 me_antigonid_3_birthright.111.desc:0 "Мы наконец доказали мечом и пером всем, кто пытался оспорить наше превосходство над македонянами, что Антигониды являются законными наследниками империи [GetCharacter('(int32)39').GetPraenomen], способными объединить восток и запад, перегруппировываясь после каждой неудачи, побеждая в конце концов и навсегда.\n\nЭто знаменует рассвет новой эры для мира, справедливо управляемого македонским царством, расположенным там, где встречаются восток и запад, если мы сможем удержать вместе царство, которое [GetCharacter('(int32)37').GetPraenomen] потерял все эти годы назад."
 me_antigonid_3_birthright.111.a:0 "Слава победителю, слава [me_antigonids_scope.GetRulerTitle] [me_antigonids_scope.GetRuler.GetPraenomen]!"
 me_antigonid_3_birthright.111.b:0 "Боги любят смирение."
 me_antigonid_3_birthright.111.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_11$$mission_task_completed_tt_2$"
 # Ports of the East
 me_antigonid_3_birthright.121.t:0 "$antigonid_03_birthright_12$: Кедровые крылья"
 me_antigonid_3_birthright.121.desc:0 "Нигде else во всем Средиземноморье нельзя найти таких кораблестроителей и капитанов, как в финикийских городах. Наше военно-морское господство будет assured притоком моряков и ремесленников из этих городов на нашу службу."
 me_antigonid_3_birthright.121.a:0 "Моря принадлежат нам."
 me_antigonid_3_birthright.121.at:0 "Мы захватили #Y 7#! тяжелых кораблей."
 me_antigonid_3_birthright.121.tt:0 "$mission_task_completed_tt_1$$antigonid_03_birthright_12$$mission_task_completed_tt_2$"