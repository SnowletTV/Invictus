l_russian:
 chinese_religions:0 "Шэнизм"
 desc_chinese_religions:0 "Земля, столь же обширная, как Китай, содержит множество философий и традиций, переплетенных в богатый гобелен духовной жизни; заповеди великих учителей, таких как Конфуций, уважаются и соблюдаются наряду с древними ритуальными практиками местных кланов. Предков почитают, а капризным духам-хранителям, оберегающим очаг, приносят священные дары."
 convert_to_chinese_religions:0 "Принять веру Шэнизма"
 convert_to_chinese_religions_desc:0 "Подобно яркому свету, сияющему на вершине высокой башни, вера Шэнизма отбрасывает длинные тени на наш народ, который все повернулся, как подсолнухи, к сиянию, исходящему от странных богов. И все же, так ли они чужды? Так ли их пути отличаются от наших? Разве сходств не больше?"
 # Shenic
 deity_chinese_sheshen:0 "$omen_chinese_sheshen$"
 omen_chinese_sheshen:1 "Шэшэнь"
 omen_chinese_sheshen_desc:3 "#Y Китайский бог#!\nШэшэнь — бог, отвечающий за землю.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"
