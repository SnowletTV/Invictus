 omen_chinese_jishen:1 "Цзишэнь"
 omen_chinese_jishen_desc:3 "#Y Китайский бог#!\nЦзишэнь — титул бога земледелия и бога зерна.\n\n#! Apotheosis Effect: $economy_income_effect_tt_description$"
 deity_chinese_tianzhu:0 "$omen_chinese_tianzhu$"
 omen_chinese_tianzhu:1 "Тяньчжу"
 omen_chinese_tianzhu_desc:3 "#Y Китайский бог#!\nТяньчжу — один из восьми богов, почитаемых в Ци.\n\n#! Apotheosis Effect: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_chinese_dizhu:0 "$omen_chinese_dizhu$"
 omen_chinese_dizhu:1 "Дичжу"
 omen_chinese_dizhu_desc:3 "#Y Китайский бог#!\nДичжу — один из восьми богов, почитаемых в Ци.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"
 deity_chinese_bingzhu:0 "$omen_chinese_bingzhu$"
 omen_chinese_bingzhu:1 "Бинчжу"
 omen_chinese_bingzhu_desc:3 "#Y Китайский бог#!\nБинчжу — один из восьми богов, почитаемых в Ци.\n\n#! Apotheosis Effect: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_chinese_yinzhu:0 "$omen_chinese_yinzhu$"
 omen_chinese_yinzhu:1 "Иньчжу"
 omen_chinese_yinzhu_desc:3 "#Y Китайский бог#!\nИньчжу — один из восьми богов, почитаемых в Ци.\n\n#! Apotheosis Effect: $fertility_apotheosis_food_effect_tt_description$"
 deity_chinese_yangzhu:0 "$omen_chinese_yangzhu$"
 omen_chinese_yangzhu:1 "Янчжу"
 omen_chinese_yangzhu_desc:3 "#Y Китайский бог#!\nЯнчжу — один из восьми богов, почитаемых в Ци.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_chinese_yuezhu:0 "$omen_chinese_yuezhu$"
 omen_chinese_yuezhu:1 "Юэчжу"
 omen_chinese_yuezhu_desc:3 "#Y Китайский бог#!\nЮэчжу — один из восьми богов, почитаемых в Ци.\n\n#! Apotheosis Effect: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_chinese_rizhu:0 "$omen_chinese_rizhu$"
 omen_chinese_rizhu:1 "Жичжу"
 omen_chinese_rizhu_desc:3 "#Y Китайский бог#!\nЖичжу — один из восьми богов, почитаемых в Ци.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"
 deity_chinese_sishizhu:0 "$omen_chinese_sishizhu$"
 omen_chinese_sishizhu:1 "Сышичжу"
 omen_chinese_sishizhu_desc:3 "#Y Китайский бог#!\nСышичжу — один из восьми богов, почитаемых в Ци.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_chinese_fengshi:0 "$omen_chinese_fengshi$"
 omen_chinese_fengshi:1 "Фэнши"
 omen_chinese_fengshi_desc:3 "#Y Китайский бог#!\nФэнши, также называемый Фэй Лянь, — бог ветра в китайской мифологии, управляющий восемью ветрами новостей через пять климатов.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_chinese_yushi:0 "$omen_chinese_yushi$"
 omen_chinese_yushi:1 "Юйши"
 omen_chinese_yushi_desc:3 "#Y Китайский бог#!\nЮйши, происходящий из китайской мифологии, отвечает за дождь.\n\n#! Apotheosis Effect: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_chinese_dasiming:0 "$omen_chinese_dasiming$"
 omen_chinese_dasiming:1 "Да Сымин"
 omen_chinese_dasiming_desc:3 "#Y Китайский бог#!\nДа Сымин управляет жизнью и смертью людей.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"
 deity_chinese_shaosiming:0 "$omen_chinese_shaosiming$"
 omen_chinese_shaosiming:1 "Шао Сымин"
 omen_chinese_shaosiming_desc:3 "#Y Китайский бог#!\nШао Сымин — бог, отвечающий за наследников на земле.\n\n#! Apotheosis Effect: $fertility_apotheosis_food_effect_tt_description$"
 deity_chinese_houtu:0 "$omen_chinese_houtu$"
 omen_chinese_houtu:1 "Хоуту"
 omen_chinese_houtu_desc:3 "#Y Китайский бог#!\nХоуту является представителем китайских божеств земли (общий термин для всех природных богов земли) и имеет власть над всей землей, подобно Гее, Матери-Земле в западной мифологии.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_chinese_daizong:0 "$omen_chinese_daizong$"
 omen_chinese_daizong:1 "Дайцзун"
 omen_chinese_daizong_desc:3 "#Y Китайский бог#!\nДайцзун — это гора Тай, восточная гора. В мифах и легендах после смерти Пань Гу его голова превратилась в гору Тай.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"
 deity_chinese_graangsreen:0 "$omen_chinese_graangsreen$"
 omen_chinese_graangsreen:1 "Хэншань"
 omen_chinese_graangsreen_desc:3 "#Y Китайский бог#!\nХуанди установил гору Хэн как Южные горы, один из объектов горного поклонения.\n\n#! Apotheosis Effect: $economy_income_effect_tt_description$"
 deity_chinese_huashan:0 "$omen_chinese_huashan$"
 omen_chinese_huashan:1 "Хуашань"
 omen_chinese_huashan_desc:3 "#Y Китайский бог#!\nГора Хуа (также известная как гора Тайхуа), одна из Пяти Гор, также известна как Западные горы.\n\n#! Apotheosis Effect: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_chinese_gyyngsreen:0 "$omen_chinese_gyyngsreen$"
 omen_chinese_gyyngsreen:1 "Хэншань"
 omen_chinese_gyyngsreen_desc:3 "#Y Китайский бог#!\nХэншань — северная из Пяти Гор.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"
 deity_chinese_songshan:0 "$omen_chinese_songshan$"
 omen_chinese_songshan:1 "Суншань"
 omen_chinese_songshan_desc:3 "#Y Китайский бог#!\nСуншань — средняя гора из Пяти Гор.\n\n#! Apotheosis Effect: $military_apotheosis_defensive_effect_tt_description$"
 deity_chinese_he:0 "$omen_chinese_he$"
 omen_chinese_he:1 "Хэ Бо"
 omen_chinese_he_desc:3 "#Y Китайский бог#!\nХэ Бо, речной бог реки Хэ, живет в реке Хэ (ныне Желтая река) и ездит на белой черепахе, используя пятиполосых рыб в качестве проводников для осмотра окрестностей или подъема на гору Куньлунь для встречи с богами.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_chinese_huai:0 "$omen_chinese_huai$"
 omen_chinese_huai:1 "Хуай Шэнь"
 omen_chinese_huai_desc:3 "#Y Китайский бог#!\nРечной бог Хуай Шэнь. Один из Сыду.\n\n#! Apotheosis Effect: $culture_apotheosis_characters_effect_tt_description$"
 deity_chinese_ji:0 "$omen_chinese_ji$"
 omen_chinese_ji:1 "Цзи Шэнь"
 omen_chinese_ji_desc:3 "#Y Китайский бог#!\nРечной бог Цзи Шэнь. Один из Сыду.\n\n#! Apotheosis Effect: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_chinese_jiang:0 "$omen_chinese_jiang$"
 omen_chinese_jiang:1 "Цзян Шэнь"
 omen_chinese_jiang_desc:3 "#Y Китайский бог#!\nРечной бог Цзян Шэнь. Один из Сыду.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_chinese_xihe:0 "$omen_chinese_xihe$"
 omen_chinese_xihe:1 "Си Хэ"
 omen_chinese_xihe_desc:3 "#Y Китайский бог#!\n Си Хэ, имя матери бога солнца в мифологии. Легенда гласит, что она была женой Ди Цзюня, с которым родила десять сыновей, все они были солнцами (золотыми воронами), которые жили на дереве Фусан в восточном море и по очереди несли службу на небе.\n\n#! Apotheosis Effect: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_chinese_shangdi:0 "$omen_chinese_shangdi$"
 omen_chinese_shangdi:1 "Хаотянь Шанди"
 omen_chinese_shangdi_desc:3 "#Y Китайский бог#!\nШанди, Небесный Император или Бог Хао Тянь, широко известный как Небо, Небесный Бог, Небесный Владыка, является верховным богом, которому поклоняются Сыны Неба, императоры и монархи. Он происходит из китайской культуры поклонения небу (Цантянь, Хаотянь) и Полярной звезде (Бэйчэнь, Ди Син). С одной стороны, «верхнее небо» называется Хао Тянь из-за его vast энергии. Дальновидность неба называется Цантянь. Никто не пользуется большим уважением, чем император, и он доверен небу, поэтому его называют Шанди. С другой стороны, Шанди пребывает в Полярной звезде и называется Императором Неба, Звездой Полярной звезды.\n\n#! Apotheosis Effect: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_chinese_qingdi:0 "$omen_chinese_qingdi$"
 omen_chinese_qingdi:1 "Цинди Тайхао"
 omen_chinese_qingdi_desc:3 "#Y Китайский бог#!\nЦинди, один из пяти императоров в легенде, отвечает за восток мира и является одним из главных объектов поклонения для императоров и храмов. Его также называют «Цан Ди» и «Му Ди». В концепции «Пяти Императоров Первого Неба» Цинди — это Тайхао. Он соответствует дереву в пяти элементах, весне в сезонах и циановому цвету в пяти цветах.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"
 deity_chinese_yandi:0 "$omen_chinese_yandi$"
 omen_chinese_yandi:1 "Яньди Шэньнун"
 omen_chinese_yandi_desc:3 "#Y Китайский бог#!\nЯньди, называемый Шэньнуном, потому что он был хорош в огненном земледелии, был назван Яньди, потому что он был королем добродетели огня, и был общим повелителем мира в легендарные древние времена.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_chinese_huangdi:0 "$omen_chinese_huangdi$"
 omen_chinese_huangdi:1 "Хуанди Сюаньюань"
 omen_chinese_huangdi_desc:3 "#Y Китайский бог#!\nХуанди — первый из Пяти Императоров, отвечающий за мир. Мифическая легенда гласит, что его отец Шаодянь был царем медведей, и поскольку он жил на холме Сюань Юань, то получил имя Сюань Юань, долго жил у воды Цзи, имел фамилию Цзи, страна его была в месте обитания медведей, также известен как Медведь.\n\n#! Apotheosis Effect: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_chinese_baidi:0 "$omen_chinese_baidi$"
 omen_chinese_baidi:1 "Байди Шаохао"
 omen_chinese_baidi_desc:3 "#Y Китайский бог#!\nБелый Император, один из Пяти Императоров, как говорят, отвечает за запад мира и был одним из главных объектов поклонения в древних империях и храмах. В концепции «Пяти Императоров Первого Неба» Бай Ди — это Шао Хао. Он соответствует золоту в пяти элементах, осени в сезонах и белому цвету в пяти цветах.\n\n#! Apotheosis Effect: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_chinese_heidi:0 "$omen_chinese_heidi$"
 omen_chinese_heidi:1 "Хэйди Чжуаньсюй"
 omen_chinese_heidi_desc:3 "#Y Китайский бог#!\nЧжуань Сюй, один из Пяти Императоров, жил в Сюань Гун, северном дворце, который имеет черный цвет и пять элементов воды, поэтому говорили, что он был императором с добродетелью воды, также известным как Сюань Ди.\n\n#! Apotheosis Effect: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_chinese_xiangjun:0 "$omen_chinese_xiangjun$"
 omen_chinese_xiangjun:1 "Сянцзюнь"
 omen_chinese_xiangjun_desc:3 "#Y Китайский бог#!\nБог реки Сян.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_chinese_xiangfuren:0 "$omen_chinese_xiangfuren$"
 omen_chinese_xiangfuren:1 "Сянфужэнь"
 omen_chinese_xiangfuren_desc:3 "#Y Китайский бог#!\nБогиня реки Сян.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_noble_effect_tt_description$"

# Tengri
 deity_hu_ulgen:0 "$omen_hu_ulgen$" #Боги веры Тэнгри происходят из древнетюркской мифологии более поздних периодов; здесь выражаем благодарность @Мэй Лэ за помощь в создании этого мода.
 omen_hu_ulgen:1 "Ульгень"
 omen_hu_ulgen_desc:3 "#Y Божества Ху#!\nУльгень — самое священное из всех небесных существ, обитающее в шестнадцати небесах, и уступает лишь Плугу (а иногда даже равен ему), защитнику всех живых существ от рук Инь И, бога неопределенности и смерти. Белые лошади часто приносятся в жертву шаманами во время ритуалов Мигеля."
 deity_hu_qayra:0 "$omen_hu_qayra$"
 omen_hu_qayra:1 "Кайра"
 omen_hu_qayra_desc:3 "#Y Божества Ху#!\nКайра обитает на семнадцатом небе. Говорят, что в древности он бродил по реке времени и стал властелином трех миров — воздуха, воды и земли — после зарождения земли, а также созданием многих вещей и людей; кроме того, он научил людей делать вино."
 deity_hu_tengri:0 "$omen_hu_tengri$"
 omen_hu_tengri:1 "Тэнгри"
 omen_hu_tengri_desc:3 "#Y Божества Ди#!\nТэнгри был главным божеством и верховным богом народа Ди, часто отождествляемым с Небесным Императором Срединного государства. Со временем его образ начал дифференцироваться, например, Во Тэнгри, отвечавший за время, и Фу Тэнгри, отвечавший за землю."
 deity_hu_aqana:0 "$omen_hu_aqana$"
 omen_hu_aqana:1 "Акана"
 omen_hu_aqana_desc:3 "#Y Божества Ху#!\nАкана — дочь Кайры, бога плодородия земли и жизни в мифологии народа Ди, которая побудила Кайру начать творение из реки времени."
 deity_hu_qizagan:0 "$omen_hu_qizagan$"
 omen_hu_qizagan:1 "Кизаган"
 omen_hu_qizagan_desc:3 "#Y Божества Ху#!\n Кизаган обитает на Девяти Небесах и изображается с луком в одной руке и трубой в другой, верхом на большом красном коне; он является могущественным богом войны в верованиях народа Ди."
 deity_hu_erlik:0 "$omen_hu_erlik$"
 omen_hu_erlik:1 "Эрлик"
 omen_hu_erlik_desc:3 "#Y Божества Ху#!\n Эрлик обитает в аду и является символом смерти, подземного мира, болезней и неудач как божество народа Ди. Как создатель злых духов, люди часто делают ему подношения, чтобы избежать бедствий, которые он ниспосылает."
 deity_hu_mergen:0 "$omen_hu_mergen$"
 omen_hu_mergen:1 "Мерген"
 omen_hu_mergen_desc:3 "#Y Божества Ху#!\n Мерген, бог мудрости и мысли, обитает на 17-м небе и известен как воин в шлеме и с луком, верхом на белом коне."
 deity_hu_umay:0 "$omen_hu_umay$"
 omen_hu_umay:1 "Умай"
 omen_hu_umay_desc:3 "#Y Божества Ху#!\n Умай — богиня плодородия, защитница женщин и детей и жена неба, её образ также ассоциируется с солнцем. Северные диаспоры молились ей о благословении многочисленным потомством."

 # Baiyue
 deity_baiyue_warrior_worship:0 "$omen_baiyue_warrior_worship$"
 omen_baiyue_warrior_worship:1 "Поклонение воинам"
 omen_baiyue_warrior_worship_desc:3 "#Y Божества Байюэ#!\n Поклонение воинам народа Байюэ"
