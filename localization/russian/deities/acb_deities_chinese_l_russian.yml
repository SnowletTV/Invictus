 omen_baiyue_land_worship:1 "Поклонение земле"
 omen_baiyue_land_worship_desc:3 "#Y Божества Байюэ#!\n Поклонение земле народа Байюэ"
 deity_baiyue_forest_worship:0 "$omen_baiyue_forest_worship$"
 omen_baiyue_forest_worship:1 "Поклонение лесу"
 omen_baiyue_forest_worship_desc:3 "#Y Божества Байюэ#!\n Поклонение лесу народа Байюэ"
 deity_baiyue_ancestor_worship:0 "$omen_baiyue_ancestor_worship$"
 omen_baiyue_ancestor_worship:1 "Поклонение предкам"
 omen_baiyue_ancestor_worship_desc:3 "#Y Божества Байюэ#!\n Поклонение предкам народа Байюэ"
 deity_baiyue_elder_worship:0 "$omen_baiyue_elder_worship$"
 omen_baiyue_elder_worship:1 "Поклонение старейшинам"
 omen_baiyue_elder_worship_desc:3 "#Y Божества Байюэ#!\n Поклонение старейшинам народа Байюэ"
 deity_baiyue_river_worship:0 "$omen_baiyue_river_worship$"
 omen_baiyue_river_worship:1 "Поклонение рекам"
 omen_baiyue_river_worship_desc:3 "#Y Божества Байюэ#!\n Поклонение рекам народа Байюэ"
 deity_baiyue_fertility_cult:0 "$omen_baiyue_fertility_cult$"
 omen_baiyue_fertility_cult:1 "Культ плодородия"
 omen_baiyue_fertility_cult_desc:3 "#Y Божества Байюэ#!\n Культ плодородия народа Байюэ"

# Muisic
 deity_yi_god_of_wind:0 "$omen_yi_god_of_wind$"
 omen_yi_god_of_wind:1 "Синджан"
 omen_yi_god_of_wind_desc:3 "Духи военных генералов называются синджан. Эти духи можно найти в душах многих великих полководцев на протяжении всей истории. Эти военные генералы включают даже более поздних исторических полководцев."
 deity_yi_god_of_thunder:0 "$omen_yi_god_of_thunder$"
 omen_yi_god_of_thunder:1 "Човангшин"
 omen_yi_god_of_thunder_desc:3 "Човангшин — муисийская богиня огня. Она также может быть 'богом кухни', о котором упоминается в китайских источниках. Човангшин — богиня не только огня, но и очага, а также ритуалов табу. Эти табу были запрещены для домохозяек, которые оставались основными поклонниками Човангшин. Ритуалы табу следующие.\n\nНе ругайтесь в доме.\nНе садитесь на очаг.\nНе кладите ноги на очаг.\nКухня должна содержаться в чистоте.\nВы должны поклоняться божествам на кухне.\n\nЧовангшин — одно из самых популярных корейских божеств, и она наказывала всех, кто совершал любое из пяти табу. На самом деле, она была известна своей мстительностью к тем, кто это делал, что дало ей роль мстительной богини в мифологии."
 deity_yi_god_of_mountain:0 "$omen_yi_god_of_mountain$"
 omen_yi_god_of_mountain:1 "Сансиллён"
 omen_yi_god_of_mountain_desc:3 "Сансиллён, или Сансин, — горные духи. Обычно их изображают как мужчин с белыми бородами, в синих одеждах, в сопровождении тигров. Они защищают местных жителей благодаря своей мощной власти над природой."
 deity_yi_god_of_grass:0 "$omen_yi_god_of_grass$"
 omen_yi_god_of_grass:1 "Чхильсон"
 omen_yi_god_of_grass_desc:3 "Космологическое божество Чхильсон — дух семи звезд Большой Медведицы. Чхильсон в конечном итоге стал ассоциироваться с буддизмом, но изначально был связан с муисийским шаманизмом. Известно, что этот дух заботится о детях."
 deity_yi_god_of_wine:0 "$omen_yi_god_of_wine$"
 omen_yi_god_of_wine:1 "Пари Гонджу"
 omen_yi_god_of_wine_desc:3 "Покровительница шаманов, проводница душ умерших и богиня Большой Медведицы, Пари Гонджу, или Принцесса Пари, — одно из самых известных и почитаемых божеств в корейском шаманизме. Её история очень стара и рассказывается в различных версиях до наших дней.\n\nСуществует несколько версий истории, но основные детали рассказывают о браке между Королем и Королевой. Королева рождает шестерых дочерей, которых все балуют роскошью. На седьмой беременности Королеве снится сон, и они принимают это как знак того, что седьмой ребенок наконец будет сыном. Однако этот седьмой ребенок снова оказался дочерью. Разочарованный Король приказывает выбросить дочь, или по-корейски 'беори'. Отсюда и происходит имя Пари. Она отправится в путешествие, которое в конечном итоге приведет её к обретению божественности."
 deity_yi_god_of_medicine:0 "$omen_yi_god_of_medicine$"
 omen_yi_god_of_medicine:1 "Хванин"
 omen_yi_god_of_medicine_desc:3 "Хванин или Ханыльним, также называемый Ханыль-ним или Сан-дже, — бог небес. Он правитель небесного царства, он повелевает мудростью и властью. Он приобрел большую известность во времена царства Кочосон и получил еще большую известность в 19 веке. Вероятно, он оставался важным богом и в этот период. Хванин также является дедом Бога-Короля Дангуна."
 deity_yi_god_of_sea:0 "$omen_yi_god_of_sea$"
 omen_yi_god_of_sea:1 "Хогу Пёльсон"
 omen_yi_god_of_sea_desc:3 "Хогу Польсон — муисийская богиня оспы, однако раньше она могла быть богиней общих болезней. В современном корейском муисийском шаманизме Хогу Польсон была переосмыслена как богиня ветряной оспы вместо натуральной оспы. Это показывает непреходящую гибкую природу муисизма."
 deity_yi_god_of_river:0 "$omen_yi_god_of_river$"
 omen_yi_god_of_river:1 "Ёндын"
 omen_yi_god_of_river_desc:3 "Богиня ветра Ёндын Хальман, также называемая Ёндон, управляет морскими ветрами, особенно на острове Чеджудо (Тамна), крупнейшем острове в южной части Корейского полуострова.\n\nЕё легенда гласит, что она пришла с востока Тамны, но раз в год она приходила на остров, чтобы дать ему жизнь, семена и другие вещи для поддержания жизни жителей острова."
 deity_dalnim:0 "$omen_dalnim$"
 omen_dalnim:0 "Дальним"
 omen_dalnim_desc:0 "Сестра бога солнца Хэмосу, Дальним — муисийская богиня луны. У неё много мифов о происхождении того, как она достигла своего божественного статуса. Один миф гласит, что она была настолько красива, что покорила сами небеса, даровав ей божественность. Другой миф гласит, что она забралась так высоко, что достигла луны. И еще один миф предполагает, что она и её брат были пойманы, и поэтому она молилась небесам. С неба спустилась веревка, и она с братом поднялись по ней в безопасность и стали божествами солнца и луны соответственно."
 deity_haemosu:0 "$omen_haemosu$"
 omen_haemosu:0 "Хэмосу"
 omen_haemosu_desc:0 "Брат богини луны Дальним, Хэмосу — муисийский бог солнца. Говорили, что он спускался на землю на колеснице, запряженной пятью драконами, чтобы слушать людей, прежде чем вернуться на небеса, что символизирует восход и заход солнца."
 deity_seokga:0 "$omen_seokga$"
 omen_seokga:0 "Сокка"
 omen_seokga_desc:0 "Шаловливый бог-трикстер Сокка известен тем, что постоянно разыгрывает и вмешивается в дела смертных. Несмотря на то, что он является одним из божеств-создателей всего, Сокка желал стать единственным правителем мира. Он бросил вызов Мируку, другому божеству-создателю вселенной, на поединок силы. Тот, кто сможет создать больше цветов, останется, а другой будет отправлен прочь. Сокка тайно украл цветы, выращенные Мируком, и таким образом Мирук исчез. Однако этот нечестный акт привел к первому греху, что resulted в первой смерти, и был создан постоянный цикл рождения и смерти, сделав мир несовершенным местом, наполненным как радостными моментами, так и страданиями."
 deity_mireuk:0 "$omen_mireuk$"
 omen_mireuk:0 "Мирук"
 omen_mireuk_desc:0 "Главный бог творения и создатель вселенной, он тот, кто разделил смертный план от остального космоса. Были созданы 5 золотых насекомых и 5 серебряных насекомых, и эти 5 пар стали предками всех людей, когда-либо живших. Он правил человечеством во времена, когда не было греха, боли и смерти, но всё изменилось, когда другой бог-создатель Сокка захотел стать единственным правителем человечества. Сокка, будучи богом-трикстером, обманул на соревновании, которое решало, кто будет править человечеством. Мирук исчез после проигрыша, оставив мир наполненным грехом, болью и смертью в его отсутствие."

 # Kodo
 deity_wa_god_kaze:0 "$omen_wa_god_kaze$"
 omen_wa_god_kaze:1 "Фудзин"
 omen_wa_god_kaze_desc:3 "#Y Божества Кодо#!\nОдин из старейших ками, Фудзин был одним из двух ками, рожденных Идзанами, чтобы сбежать из Ёми, прежде чем оно было запечатано Идзанаги. Он ками ветра, и иногда его называют Кадзе или Рёбо. Его часто изображают вместе с его братом Райдзином, ками молнии, грома и штормов."
 deity_wa_god_kaminari:0 "$omen_wa_god_kaminari$"
 omen_wa_god_kaminari:1 "Райдзин"
 omen_wa_god_kaminari_desc:3 "#Y Божества Кодо#!\nИногда известный как Каминари, Райдзин был ками молнии, грома и штормов. Он был одним из двух ками, рожденных Идзанами, чтобы сбежать из Ёми, прежде чем оно было запечатано Идзанаги. Его часто изображают вместе с его братом Фудзином, ками ветра."
 deity_wa_god_hi:0 "$omen_wa_god_hi$"
 omen_wa_god_hi:1 "Кагу Цути"
 omen_wa_god_hi_desc:3 "#Y Божества Кодо#!\nКагу Цути, сияющая сила, был рожден Идзанами. Однако, будучи ками огня, Кагу Цути сжег Идзанами насмерть, пока она рожала его. Опечаленный Идзанаги обезглавил Кагу Цути, что привело к созданию нескольких ками. В конечном итоге он стал ассоциироваться с кузнецами. Кагу Цути иногда называют Хи."
 deity_wa_god_ame:0 "$omen_wa_god_ame$"
 omen_wa_god_ame:1 "Аматэрасу"
 omen_wa_god_ame_desc:3 "#Y Божества Кодо#!\nАматэрасу — богиня искусств и солнца. Она также известна как богиня плодородия, благодаря её солнечному свету, приносящему рост сельскому хозяйству. У неё бурные отношения с её братом, ками штормов по имени Сусаноо, который разрушил её рисовые поля. Это разозлило её, и она на время отказала миру в своём свете."
 deity_wa_god_kawa:0 "$omen_wa_god_kawa$"
 omen_wa_god_kawa:1 "Кава"
 omen_wa_god_kawa_desc:3 "#Y Божества Кодо#!\nЦарь речных ками, имя Кава настолько синонимично с речными ками, что стало общим термином для всех речных ками. Иногда его также называют Кахаку."
 deity_wa_god_inazuma:0 "$omen_wa_god_inazuma$"
 omen_wa_god_inazuma:1 "Идзанаги"
 omen_wa_god_inazuma_desc:3 "#Y Божества Кодо#!\nИдзанаги был одним из первых 7 поколений ками, появившихся при создании небес. Он и его сестра-жена Идзанами вместе создали многих ками. Однако один ками, Кагу Цути, был ками огня, и Идзанами умерла, сгорев заживо, рожая его. Идзанаги был разбит горем и отправился в Ёми, чтобы вернуть её. Однако, прибыв туда, он отверг Идзанами, потому что её плоть была зеленой и гниющей от смерти. Он запечатал Идзанами камнем, отгородив землю живых от земли мертвых."
 deity_wa_god_ama:0 "$omen_wa_god_ama$"
 omen_wa_god_ama:1 "Идзанами"
 omen_wa_god_ama_desc:3 "#Y Божества Кодо#!\nИдзанами была одной из первых 7 поколений ками, появившихся при создании небес. Она и её брат-муж Идзанаги вместе создали многих ками. Однако один ками, Кагу Цути, был ками огня, и Идзанами умерла, сгорев заживо, рожая его. Идзанаги был разбит горем и отправился в Ёми, чтобы вернуть её. Однако, прибыв туда, он отверг Идзанами, потому что её плоть была зеленой и гниющей от смерти. Он запечатал Идзанами камнем, отгородив землю живых от земли мертвых."
 deity_wa_god_yama:0 "$omen_wa_god_yama$"
 omen_wa_god_yama:1 "Ояматсуми"
 omen_wa_god_yama_desc:3 "#Y Божества Кодо#!\nОяматсуми был горным ками, которых также называют Яма-но-Ками. Ояматсуми был старшим братом Аматэрасу и ребенком Идзанами и Идзанаги. Он продолжил производить восемь ками-потомков вместе с Но-Цути, а также еще двух ками, у которых не было фигуры матери."
 deity_wa_god_umi:0 "$omen_wa_god_umi$"
 omen_wa_god_umi:1 "Окунинуси"
 omen_wa_god_umi_desc:3 "#Y Божества Кодо#!\nОкунинуси был ками строительства нации, бизнеса и земледелия. Он потомок ками Сусаноо. Окунинуси в конечном итоге стал ассоциироваться с Западными Ва."
 deity_wa_god_tsuki:0 "$omen_wa_god_tsuki$"
 omen_wa_god_tsuki:1 "Цуки-Ёми"
 omen_wa_god_tsuki_desc:3 "#Y Божества Кодо#!\nЦуки-Ёми — ками луны. Он близнец богини солнца Аматэрасу. У него была ссора с Аматэрасу, потому что он убил ками пищи, и с тех пор Аматэрасу не желала его больше видеть, что породило концепцию ночи и дня."
 deity_wa_god_tsuchi:0 "$omen_wa_god_tsuchi$"
 omen_wa_god_tsuchi:1 "Куни-но-токотати"
 omen_wa_god_tsuchi_desc:3 "#Y Божества Кодо#!\nКуни-но-токотати был одним из двух ками первого поколения. Он прибыл на первозданную Землю и иногда считается Первозданным ками вселенной."
 deity_wa_god_sorei:0 "$omen_wa_god_sorei$"
 omen_wa_god_sorei:1 "Сорэй"
 omen_wa_god_sorei_desc:3 "#Y Божества Кодо#!\nСорэй — концепция поклонения предкам в раннем кодоизме. Сорэй мог стать не только духами и защитниками, но даже быть возвышенным до статуса ками. Очень конкретно, Сорэй относится к тем духам предков, которых помнят в определенную дату календаря, как праздник или день памяти."
 deity_minakanushi:0 "$omen_minakanushi$"
 omen_minakanushi:0 "Амэ-но-Минакануси"
 omen_minakanushi_desc:0 "#Y Божества Кодо#!\nАмэ-но-Минакануси — первое божество, проявившееся после создания небес. Это одно из 5 божеств, предшествующих 7 поколениям ками. Они были Центральным Владыкой первых трех божеств."
 deity_takamimusubi:0 "$omen_takamimusubi$"
 omen_takamimusubi:0 "Таками-мусуби"
 omen_takamimusubi_desc:0 "#Y Божества Кодо#!\nТаками-мусуби был вторым божеством, проявившимся после создания небес. Они существовали до 7 поколений ками. Они были Высшим Создателем и ками земледелия."
 deity_kamimusubi:0 "$omen_kamimusubi$"
 omen_kamimusubi:0 "Ками-мусуби"
 omen_kamimusubi_desc:0 "#Y Божества Кодо#!\nКами-мусуби был третьим божеством, проявившимся после создания небес. Они были до 7 поколений ками. Они были Божественным Создателем."
 deity_mizuhanome:0 "$omen_mizuhanome$"
 omen_mizuhanome:0 "Мидзуханомэ"
 omen_mizuhanome_desc:0 "#Y Божества Кодо#!\nМидзуханомэ была ками воды. Она была дочерью Идзанами, рожденной из её мочи, и иногда известна как богиня водяного дракона."
 deity_inari:0 "$omen_inari$"
 omen_inari:0 "Инари"
 omen_inari_desc:0 "#Y Божества Кодо#!\nИнари — ками лис. Её также называют Инари-Оками. Инари считается как богом плодородия, так и ассоциируется с посланиями, поскольку говорили, что лисы могут доставлять послания смертным от самой Инари."