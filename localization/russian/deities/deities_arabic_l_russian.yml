l_russian:
## Generic Arabic Deities ##
 deity_alilat:0 "$omen_alilat$"
 omen_alilat:1 "Алилат"
 omen_alilat_desc:3 "Великая Алилат встанет среди наших воинов и благословит их знанием войны, укрепив их верность и боевой дух. С усиленной дисциплиной мы непременно одержим множество побед в войнах и достигнем успехов там, где раньше не могли.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"
 deity_al_uzza:0 "$omen_al_uzza$"
 omen_al_uzza:1 "Аль-Узза"
 omen_al_uzza_desc:3 "С благословением Аль-Уззы наши юноши будут охотно готовиться к войне, зная, что богиня будет наблюдать за ними и защищать их. Благодаря этим новым рекрутам наши армии наверняка переполнятся людьми, способными завоевать наших врагов.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"
 deity_al_kutbay:0 "$omen_al_kutbay$"
 omen_al_kutbay:1 "Аль-Кутбай"
 omen_al_kutbay_desc:3 "Писец научит наших ученых вопросам пророчеств и письменности. По мере того как мы постигаем новое, это непременно пойдет на пользу и благо всему нашему обществу.\n\n#! Apotheosis Effect: $culture_apotheosis_capital_effect_tt_description$"
 deity_talab:0 "$omen_talab$"
 omen_talab:1 "Та'лаб"
 omen_talab_desc:3 "Та'лаб — лунное божество, оказывающее определенное влияние на землю, плодородие и урожай. Мы часто обращаемся к его оракулу за советом о том, как действовать в трудные времена.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_ailiah:0 "$omen_ailiah$"
 omen_ailiah:1 "Айлия"
 omen_ailiah_desc:3 "Верховный бог будет наблюдать за нами и помогать в войнах, оправдывая нашу экспансию на чужие земли. Теперь, когда Айлия на нашей стороне и одобряет наши войны, против нашей непрерывной кампании смогут выступить лишь самые яростные соперники.\n\n#! Apotheosis Effect: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_al_qaum:0 "$omen_al_qaum$"
 omen_al_qaum:1 "Аль-Каум"
 omen_al_qaum_desc:3 "Мы просим бога караванов присматривать за нашими торговцами, пока они путешествуют по миру на благо нашего государства. Чем богаче становятся наши купцы и караваны, тем больше процветания они приносят нашему сообществу.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_manat:0 "$omen_manat$"
 omen_manat:1 "Манат"
 omen_manat_desc:3 "Мы возносим наши молитвы великой Манат, надеясь, что она изменит судьбы нашего народа к лучшему. С великой богиней на нашей стороне мы уверены, что на время станет меньше трудностей и внутренних разногласий.\n\n#! Apotheosis Effect: $economy_income_effect_tt_description$"
 deity_orotalt:0 "$omen_orotalt$"
 omen_orotalt:1 "Ороталт"
 omen_orotalt_desc:3 "Мы приносим жертвы Ороталту, чтобы убедить бога благословить наши урожаи жизнью на многие годы вперед. Наши посевы наверняка будут расти крепкими, пока у нас есть поддержка и помощь бога.\n\n#! Apotheosis Effect: $fertility_apotheosis_food_effect_tt_description$"