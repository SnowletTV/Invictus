l_russian:
## Generic Deities ##
 deity_zadeni:0 "$omen_zadeni$"
 omen_zadeni:1 "Задени"
 omen_zadeni_desc:2 "Задени — покровитель войны и плодородия, к которому наши воины часто обращаются перед битвой. Его обычно изображают с цветком или топором в руках, в сопровождении крылатого льва. Грекам он известен как Геракл.\n\n#! Apotheosis Effect: $military_apotheosis_defensive_effect_tt_description$"
 deity_armazi:0 "$omen_armazi$"
 omen_armazi:1 "Армази"
 omen_armazi_desc:2 "Армази — покровитель дождя, грома, погоды и изобилия. Одетый в доспехи и с мечом в руке, он служит вдохновением для своих последователей. Среди зороастрийцев он известен как Ахура Мазда, а среди греков — как Зевс.\n\n#! Apotheosis Effect: $culture_apotheosis_capital_effect_tt_description$"
 deity_kopala:0 "$omen_kopala$"
 omen_kopala:1 "Копала"
 omen_kopala_desc:2 "Великий герой, почитаемый многими нашими людьми за свои многочисленные подвиги. Величайшим из них было его изгнание девибов из мира, заточив их под землей после победы над ними в состязании и в битве.\n\n#! Apotheosis Effect: $military_apotheosis_defensive_effect_tt_description$"
 deity_gacim:0 "$omen_gacim$"
 omen_gacim:1 "Гацим"
 omen_gacim_desc:2 "Гацим — спутник Га и сам по себе бог плодородия. Их двоих часто считают божествами, управляющими всеми тайнами мира, а также прядильщиками судьбы. Некоторые отождествляют Гацима с анатолийским Аттисом.\n\n#! Apotheosis Effect: $fertility_apotheosis_food_effect_tt_description$"
 deity_ghmerti:0 "$omen_ghmerti$"
 omen_ghmerti:1 "Гмерти"
 omen_ghmerti_desc:2 "Гмерти — глава нашего пантеона, первое из всех наших божеств и властелин вселенной. Он отец солнца и луны, а также нескольких других божеств нашего пантеона. Как создатель всего сущего, жизни людей и животных находятся в его руках.\n\n#! Apotheosis Effect: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_ga:0 "$omen_ga$"
 omen_ga:1 "Га"
 omen_ga_desc:2 "Га — спутница Гацима и сама по себе богиня-мать. Их двоих часто считают божествами, управляющими всеми тайнами мира, а также прядильщиками судьбы. Некоторые отождествляют Га с анатолийской Кибелой.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"
 deity_adgilis_deda:0 "$omen_adgilis_deda$"
 omen_adgilis_deda:1 "Адгилис Деда"
 omen_adgilis_deda_desc:2 "Адгилис Деда — богиня плодородия и скота. Она направляет урожай и стада наших фермеров и защищает путешественников, прибывающих в наши земли. Её часто считают главной богиней народов, живущих в суровых горных землях Иберии.\n\n#! Apotheosis Effect: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_dali:0 "$omen_dali$"
 omen_dali:1 "Дали"
 omen_dali_desc:2 "Дали — покровительница охоты, прекрасное божество, обитающее в горах Кавказа. Среди охотников она является главной богиней, к которой они обращаются с просьбой позволить им войти в её царство, и только с её помощью они найдут добычу, которую ищут.\n\n#! Apotheosis Effect: $economy_apotheosis_province_improvement_effect_tt_description$"

 ## Ainina and Danina, event made omens ##
 deity_ainina_and_danina:0 "$omen_ainina_and_danina$"
 omen_ainina_and_danina:1 "Айнина и Данина"
 omen_ainina_and_danina_desc:2 "Айнина и Данина — пара богинь, введенных в армазический пантеон в более поздний период. Они часто ассоциируются с плодородием, исцелением и мудростью и имеют свой культ. Их иногда отождествляют с Анаит или Инанной.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_slaves_effect_tt_description$"