l_russian:
  ## Default ##
 deity_viriya_parami:0 "$omen_viriya_parami$"
 omen_viriya_parami:0 "Вирия Парами"
 omen_viriya_parami_desc:4 "Народ нашей страны обретёт бодрость, силу и усердие в бою. Хотя битва сама по себе нежелательна, иногда приходится сражаться за общее благо, и важно, чтобы это делалось с честью и дисциплиной.\n\nВирья Парами - одно из наших буддийских совершенств, в котором основное внимание уделяется обучению людей быть послушными, наблюдательными и проявлять старание в своей работе. "
 deity_adhitthana_parami:0 "$omen_adhitthana_parami$"
 omen_adhitthana_parami:0 "Адхиттхана Парами"
 omen_adhitthana_parami_desc:4 "Хотя это нормально - испытывать беспокойство перед лицом трудностей, мы внушаем нашим юношам решимость в эти трудные времена. Важно, чтобы общество сплотилось и объединило свои усилия для достижения поставленных целей, будь то война или другие общественные проекты.\n\nАдхиттхана Парами - одно из наших буддийских совершенств, направленное на обучение людей решительности и целеустремленности в своих действиях."
 deity_panna_parami:0 "$omen_panna_parami$"
 omen_panna_parami:0 "Панья Парами"
 omen_panna_parami_desc:4 "Наши учёные и преподаватели, как и весь наш народ, обретут мудрость и проницательность в своей жизни. С помощью этих знаний мы сможем принимать решения, которые принесут пользу и поддержку нашему народу.\n\nПанья Парами - одно из наших буддийских совершенств, направленное на обучение людей мудрости и проницательности в отношении вещей, превосходящих их самих."
 deity_dana_parami:0 "$omen_dana_parami$"
 omen_dana_parami:0 "Дана Парами"
 omen_dana_parami_desc:4 "Важно, чтобы все слои нашего общества вносили свой вклад в общее дело. Вместе мы можем создать нечто большее, чем мы сами, если каждый готов расстаться с частью своего богатства. Благотворительность - это важная концепция, позволяющая обрести настоящую внутреннюю ценность, отбросив материальные блага.\n\nДана Парами - одно из наших буддийских совершенств, направленное на то, чтобы научить людей быть щедрыми и отдавать себя как физически, так и духовно."
 deity_upekkha_parami:0 "$omen_upekkha_parami$"
 omen_upekkha_parami:0 "Упекха Парами"
 omen_upekkha_parami_desc:4 "Мы должны быть спокойны и безмятежны, пока вокруг нас бушует хаос войны, и найти правильный путь для нашего народа. Даже во время тягот войны и усталости важно, чтобы общество смогло прийти к соглашению о том, каким путем вы пойдёте как коллектив, будь то продолжение войны или отказ от неё.\n\nУпекха Парами - одно из наших буддийских совершенств, направленное на обучение людей спокойствию и очищению их психических состояний."
 deity_khanti_parami:0 "$omen_khanti_parami$"
 omen_khanti_parami:0 "Ханты Парами"
 omen_khanti_parami_desc:4 "Нашему народу необходимо пройти через трудности, проявить выдержку и терпение по отношению к тем, кто пришёл издалека. Только тогда мы сможем узнать их секреты и принять их отличия, а не встречать их с обидой или осуждением. Поняв их, мы сможем найти ценность в их обществе и принести благосостояние всем нам.\n\nХанты Парами - одно из наших буддийских совершенств, направленное на обучение людей терпению, терпимости и принятию других."
 deity_sila_parami:0 "$omen_sila_parami$"
 omen_sila_parami:0 "Sila Parami"
 omen_sila_parami_desc:4 "Мы будем вдохновлять наших людей на правильный путь вперёд, на добродетель и правильное поведение на пути вещей. Действуя добродетельно, наши люди смогут объединяться в большие коллективы, способные сотрудничать и работать вместе.\n\nСила Парами - одно из наших буддийских совершенств, в котором основное внимание уделяется обучению людей добродетели, гармонии и самоограничению."
 deity_metta_parami:0 "$omen_metta_parami$"
 omen_metta_parami:0 "Метта Парами"
 omen_metta_parami_desc:4 "Наша страна должна быть известна своей заботой и добротой. Это один из путей роста и расширения нашего народа и культуры за пределы нынешних ограничений.\n\nМетта Парами - одно из буддийских совершенств, направленное на обучение людей доброте и дружелюбию по отношению друг к другу."
 deity_trapusa_and_bahalika:0 "$omen_trapusa_and_bahalika$"
 omen_trapusa_and_bahalika:0 "Трапусса и Бхалика"
 omen_trapusa_and_bahalika_desc:2 "Первые ученики-миряне Будды, купцы Трапусса и Бхалика, принесли его учение через Гиндукуш на запад, где построили первую ступу в Бактре.\nОни олицетворяют собой универсальную мудрость его учения, распространившуюся по всему миру, и ту убедительную легкость, с которой оно распространилось."
 deity_sigiriya:0 "$omen_sigiriya$"
 omen_sigiriya:0 "Буддхатапас"
 omen_sigiriya_desc:2 "Будда отвергал крайний аскетизм, который ослабляет человека до такой степени, что он теряет представление о мире, поэтому для созерцания его учения необходимы тишина и покой.\nВ великой скале Сигирая на протяжении многих лет в её пещерах жили буддийские монахи, стремящиеся к нирване. Буддхатапас означает 'подвижничество Будды'."
 deity_bamyan:0 "$omen_bamyan$"
 omen_bamyan:0 "Буддачарита"
 omen_bamyan_desc:2 "Будда был щедр в своем учении, странствуя по стране, чтобы передать людям свою божественную мудрость.\nСтупы монастырей, расположенных далеко от места рождения Будды, свидетельствуют о традиции распространения его учения. Буддхачарита означает 'Странствия Будды'."
 deity_bodh:0 "$omen_bodh$"
 omen_bodh:0 "Буддхатвам"
 omen_bodh_desc:2 "Мудрое учение Будды поможет нашим людям жить этичной и приятной жизнью, свободной от отвлекающих факторов и ошибочных доктрин других религий.\nГород Гая известен как место, где Гаутама Будда достиг просветления под деревом Бодхи в праздник Будда Пурнима, отказавшись от роскоши и аскетизма, развивая средний путь. Буддхатвам означает 'Просветление Будды'."
 deity_kusinagara:0 "$omen_kusinagara$"
 omen_kusinagara:0 "Паринирванам"
 omen_kusinagara_desc:2 "Только следуя мудрому и святому образу жизни Гаутамы Будды, можно достичь Паринирваны и освободиться от наказания вечного цикла перерождений.\nБудда достиг этого состояния после своей смерти в городе Кусинагара, который стал местом паломничества для всех, кто убедился в истинности его учения. Паринирванам означает Паринирвану Будды."

# Deity loc TODO

 deity_mitreya:0 "$omen_mitreya$"
 omen_mitreya:0 "Митрейя"
 omen_mitreya_desc:0 "В тёмные времена, когда учение Гаутамы Будды будет забыто людьми, именно тогда Митрейя, Последний Будда этого века и Тот, Кто Обещан, явится, чтобы восстановить Дхарму. Хотя сейчас Митрейи нет рядом с нами, к нему можно обратиться с молитвой."
 deity_manjushri:0 "$omen_manjushri$"
 omen_manjushri:0 "Манджушри"
 omen_manjushri_desc:0 "Манджушри, которого называют Нежной Славой, древний бодхисаттва, парадоксальным образом сохранивший молодость, обитает в Чистой Земле Вимала, медитируя на мудрость и всё хорошее."
 deity_avalokitesvara:0 "$omen_avalokitesvara$"
 omen_avalokitesvara:0 "Авалокитешвара"
 omen_avalokitesvara_desc:0 "Авалокитешвара, Бодхисаттва и Могущественный Владыка, Взирающий на Мир, не глух к воплям страждущих, но исполнен сострадания и любви к угнетенным, за что и любим массами."
 deity_samantabhadra:0 "$omen_samantabhadra$"
 omen_samantabhadra:0 "Самантабхадра"
 omen_samantabhadra_desc:0 "Самантабхадра, Вседостойный и Всеблагой, Председатель Десяти обетов и пример для всех, кто стремится достичь состояния Будды, наставляет наш народ своим праведным учением и в мирное, и в военное время. "
 deity_samantabhadri:0 "$omen_samantabhadri$"
 omen_samantabhadri:0 "Самантабхадри"
 omen_samantabhadri_desc:0 "Самантабхадри, Первозданная Великая Мать Будды, которая является вечной супругой и спутницей Самантабхадры, - могущественная и мудрая богиня, чье божественное присутствие лучше всего представляется в тишине неподвижного ума."
 deity_sakra:0 "$omen_sakra$"
 omen_sakra:0 "Сакра"
 omen_sakra_desc:0 "Сакре Могучему, владыке Дэве и могущественному правителю неба Траястримса, поручено охранять центр мира из своей небесной обители на пятивершинной горе Меру, стремясь к миру и в то же время всегда готовый к войне."
 deity_mahesvara:0 "$omen_mahesvara$"
 omen_mahesvara:0 "Махешвара"
 omen_mahesvara_desc:0 "Великий Махешвара, восьмирукий и трехглазый, наделенный непостижимой для смертного мудростью, - вечный друг тех, кто творит добро, и непримиримый враг тех, кто сеет беды и раздоры."
 deity_vajrapani:0 "$omen_vajrapani$"
 omen_vajrapani:0 "Ваджрапани"
 omen_vajrapani_desc:0 "Разряды молний и завывание ветра возвещают о прибытии Ваджрапани, Владыки Тайн и Обладателя Громовержца, который едва сдерживает свой всепоглощающий гнев. Его благословение - грозное оружие для борьбы с врагами праведности."
 deity_marici:0 "$omen_marici$"
 omen_marici:0 "Маричи"
 omen_marici_desc:0 "Именно в предрассветные минуты, когда тьма тщетно цепляется за землю, прежде чем ее уничтожит богиня света Маричи, её поклонники собираются вместе, чтобы приветствовать Солнце благодарственными молитвами."

# Invictus
 deity_buddha_mazda:0 "$omen_buddha_mazda$"
 omen_buddha_mazda:0 "Будда-Мазда"
 omen_buddha_mazda_desc:0 "Впервые обнаруженный нарисованным на стене пещеры, датируемой I веком н.э., на территории современного Узбекистана, Будда-Мазда служит доказательством давнего взаимодействия буддизма с персидской сферой. Было установлено, что это место, вероятно, является Александрией на Оксе, а роспись изображает божество с чертами как Ахура Мазды, так и Будды.\n\nБуддизм в Персии, вероятно, существовал еще до I века, во времена Парфии, когда возможно, что многие представители низшей знати в восточных частях империи могли обратиться в буддизм, однако лучше всего он задокументирован в более поздние сасанидские времена, когда традиционалистская маздаяснийская империя обрушила молот на буддийские практики в Иране.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"
 
 deity_mithra_mitreya:0 "$omen_mithra_mitreya$"
 omen_mithra_mitreya:0 "Митра-Майтрея"
 omen_mithra_mitreya_desc:0 "В землях, где солнце восходит и над Иранским плато, и над Индийскими равнинами, возникло видение будущего спасителя. Для одних он был Митрой, Владыкой Завета и Хранителем Истины, который наблюдает тысячью глаз и карает нарушителей священных клятв. Для других он был Майтреей, Обещанным, который вернется, когда учения Просветленного угаснут, чтобы восстановить Дхарму и пробудить сострадание в потемневшую эпоху.\n\nМитра-Майтрея — символ этого союза, существо солнечной чистоты, божественной справедливости и мессианской надежды, рожденное из культурных взаимодействий внутри буддийско-парфянской империи. Во времена отчаяния его двойное пламя напоминает нам идти срединным путем с дисциплиной, но делать это мужественно, как хранителям как внутренней добродетели, так и мирской ответственности.\n\n#! Apotheosis Effect: $culture_apotheosis_characters_effect_tt_description$\n $add_legitimacy_apotheosis_effect_tt_description$"

# Helleno-Buddhism 
 deity_dhammarakkhita:0 "$omen_dhammarakkhita$"
 omen_dhammarakkhita:0 "Йонака Дхаммараккхита"
 omen_dhammarakkhita_desc:0 "Йонака Дхаммараккхита на пали и Йонака Дхармаракшита на санскрите, его имя напрямую переводится как «Грек, Защищенный Дхармой». Он был греком, вероятно из Бактрии или долины Инда, нанятым Ашокой Великим для проповеди буддизма в качестве миссионера в регионе Апаранта (и, вероятно, включавшем побережье от Синда до Гуджарата). Говорят, что ему удалось обратить 37 000 человек в регионе, 1 000 из которых вступили в Орден (Паббаджжа).\n\nПозже сингальский буддийский монах Пунаббасукумбикапутта Тисса Тхера отправился в земли Маурьев на север, чтобы учиться у Йонаки Дхаммараккхиты. Другая история описывает монаха Нагасену как бывшего ученика Дхаммараккхиты, достигшего просветления в Паталипутре под его руководством.\n\n#! Apotheosis Effect: $culture_apotheosis_capital_effect_tt_description$"

 deity_herakles_vajpranios:0 "$omen_herakles_vajpranios$"
 omen_herakles_vajpranios:0 "Геракл Ваджпрапани"
 omen_herakles_vajpranios_desc:0 "Геракл Ваджпрапани — форма Геракла, синкретизированная с буддийской идеей Ваджрапани. Ваджрапани буквально означает «Держатель Молнии» и обычно представляет защитника и проводника Гаутамы Будды, а также символ силы Будды. Геракл Ваджпрапани обычно изображается с геракловой палицей или Молнией (или ваджрой), а также иногда наделяется более зевсоподобными чертами (действительно, божество переняло качества как Зевса, так и Геракла). Кроме того, изображения показывают его волосатым и мускулистым, образ, который впоследствии повлиял на буддийские божества по всему восточноазиатскому миру, сделав популярной идею «Борца-Стража».\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"

 deity_wardo:0 "$omen_wardo$"
 omen_wardo:0 "Вардо"
 omen_wardo_desc:0 "Также пишется Оардо, Вардо наиболее известен западным грекам как Борей, бог холодных северных ветров и бурь. Сильно вдохновленный бактрийскими и эллинскими божествами, Вардо стал повторяющимся мотивом в более позднем буддийском мире, повлияв как на китайскую, так и на японскую религию (Фэн Бо на китайском, означающее Дядюшка Ветер, и Фудзин на японском, означающее Небесный Ветер). На протяжении различных форм бога он сохранял свой характерный мешок с ветром и растрепанный, неопрятный облик, демонстрируя очень четкую эволюцию от греко-буддизма к восточноазиатскому буддизму.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_wardo_10_bactrian_pops_required_tt: "Культуре #Y [GetCulture('bactrian').GetName]#! требуется не менее #Y 10#! жителей."

 deity_hegesias:0 "$omen_hegesias$"
 omen_hegesias:0 "Гегесий Пейситанатос"
 omen_hegesias_desc:0 "Киренский философ Гегесий был сторонником идеи, что Эвдемония (счастье) практически недостижима, и поэтому целью жизни должно быть освобождение от боли и скорби. Обычные ценности были безразличны и приносили не больше удовольствия, чем страдания. Что самое интересное, он также утверждал, что и смерть, и жизнь желанны. Эти идеи, а также период его жизни, заставляют многих полагать, что на него повлияли индийские философии. Знакомая идея появляется в его печально известной книге «Смерть от голода», которая, по-видимому, убедила стольких людей в Александрии в том, что Смерть действительно желаннее Жизни, что Птолемей II Филадельф запретил ему преподавать в великом городе."