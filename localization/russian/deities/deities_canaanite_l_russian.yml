l_russian:
 ### Nation specific ###
 ## Carthage ##
 deity_baal_qarnaim:0 "$omen_baal_qarnaim$"
 omen_baal_qarnaim:1 "Баал Карнаим"
 omen_baal_qarnaim_desc:3 "Мы принесем великие дары Владыке Двух Рогов, обеспечив его благословение и принятие наших недавних войн. С его руководством мы сможем легко оправдать нашу экспансию на земли врагов перед нашим народом, уставшим от битв и конфликтов.\n\nКак еще одно лицо великого Баала, мы почитаем Баала Карнаима в времена нужды и войны, и он вдохновляет наш народ.\n\n#! Apotheosis Effect: $culture_apotheosis_assimilate_effect_tt_description$"

 ## Arabian (south_levantine) ##
 deity_attar:0 "$omen_attar$"
 omen_attar:1 "Аттар"
 omen_attar_desc:3 "Тот, Кто Смел в Битве, поможет и защитит наших братьев по оружию, обеспечив их дисциплину и боевой дух. Поскольку наши солдаты сражаются, чтобы доказать свою доблесть, победа с большей вероятностью будет на нашей стороне.\n\n#! Apotheosis Effect: $military_apotheosis_defensive_effect_tt_description$"

 ## Carthaginian ##
 deity_tanit:0 "$omen_tanit$"
 omen_tanit:1 "Таннит"
 omen_tanit_desc:3 "Наша богиня-покровительница будет наблюдать за нами в битве, обеспечивая нашу победу, пока мы завоевываем наших врагов. Мало кто из божеств вдохновляет наших солдат так, как Таннит, и вновь будет доказано, какое влияние она оказывает на наши войны.\n\nВ отличие от финикийского пантеона в целом, Таннит является скорее местной карфагенской богиней. Она играет важную роль в наших обрядах как лунная богиня, а также как богиня войны. Таннит настолько благоприятна, что даже некоторые ливийцы и мавретанцы начали поклоняться ей, следуя нашему примеру.\n\n#! Apotheosis Effect: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_baal_hammon:0 "$omen_baal_hammon$"
 omen_baal_hammon:1 "Баал Хаммон"
 omen_baal_hammon_desc:3 "Юноши нашего государства стекутся под наши знамена, зная, что Баал Хаммон благословил наши войны. Имея больше рекрутов в нашем распоряжении, мы наверняка сможем заставить наших врагов согласиться с нашими требованиями благодаря нашему превосходству в численности.\n\nВ отличие от более общего поклонения Баалу в других финикийских регионах, мы пользуемся благосклонностью самого Баала Хаммона, главного в пантеоне карфагенских земель. Как бог урожая, его иногда сравнивают с греческим Кроносом, хотя он играет более важную активную роль, чем его греческий аналог.\n\n#! Apotheosis Effect: $fertility_apotheosis_food_effect_tt_description$"

 ## Generic ##
 deity_anat:0 "$omen_anat$"
 omen_anat:1 "Анат"
 omen_anat_desc:3 "Дикая богиня-воительница будет сражаться рядом с нашими воинами, направляя их руки в битве и укрепляя их боевой дух. Анат известна своим жестоким уничтожением врагов; с ней на нашей стороне мы с большей вероятностью одержим победу в войнах.\n\nКак богиня войны, Анат была хорошо известна среди многих ханаанских культур вдоль Леванта. Она играла важную роль в мщении за своего брата и возлюбленного Баала после его предполагаемой смерти от рук Мота.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"
 deity_el:0 "$omen_el$"
 omen_el:1 "Эль"
 omen_el_desc:3 "Все юноши стекутся под наши знамена под руководством верховного бога. Мы наверняка сможем выиграть наши войны теперь, когда у нас больше потенциальных рекрутов, чем раньше.\n\nВо главе пантеона Эль является первым среди равных, насколько это касается большинства. Он царь и отец большинства божеств и создатель земли.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"
 deity_kothar:0 "$omen_kothar$"
 omen_kothar:1 "Кушор"
 omen_kothar_desc:3 "Великие знания Кушора-ва-Хасиса озарят наших ремесленников, благословляя их проницательностью. Продвигаясь вперед под его руководством, мы наверняка сможем конкурировать с нашими соседями и превзойти возможности наших врагов.\n\nКушор хорошо известен как покровитель металлообработки и магии, создавший многие примечательные оружия и дары для других божеств своими уникальными навыками. Легенды гласят, что даже египтяне узнали об этом боге и назвали его Птахом на своем языке.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_yam:0 "$omen_yam$"
 omen_yam:1 "Ям"
 omen_yam_desc:3 "Ям — один из богов моря в его дикой форме. Из своего дворца в темных глубинах океана он управляет бушующими волнами и бурными ветрами, с которыми нашим кораблям приходится сталкиваться во время плавания по морям.\n\nХотя он и один из избранных чемпионов Эля, он представляет опасность для тех, кто осмеливается оскорбить его, и многие моряки испытали его гнев, разбиваясь о рифы или видя, как их корабли безжалостно разрываются волнами.\n\n#! Apotheosis Effect: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_melqart:0 "$omen_melqart$"
 omen_melqart:1 "Мелькарт"
 omen_melqart_desc:3 "Великий странствующий Владыка Мелькарт принесет богатство всему нашему царству. С большим богатством приходит большее процветание для нашего народа, обеспечивая нашу безопасность на данное время.\n\nХотя изначально бог был покровителем финикийского города Тир, он стал хорошо известен во всем финикийском мире, а также среди всех их торговых партнеров и связей.\n\n#! Apotheosis Effect: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_baal:0 "$omen_baal$"
 omen_baal:1 "Баал"
 omen_baal_desc:3 "Великий Баал оправдает нашу экспансию на земли врагов и обеспечит постоянный успех таких кампаний. Есть те, кто устал от войны, это благословение убедит их в необходимости продолжения военных действий.\n\nКак покровитель урожаев, бурь, погоды и моряков, Великий Баал является самым почитаемым из наших божеств. В времена борьбы и нужды Баал — это божество, которое приносит спасение и помощь.\n\n#! Apotheosis Effect: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_dagon:0 "$omen_dagon$"
 omen_dagon:1 "Дагон"
 omen_dagon_desc:3 "Дагон предоставит нашим купцам щедрые объемы ресурсов для торговли. С его помощью наши торговцы увидят большее изобилие и наверняка смогут расширить свои операции и продолжать погоню за богатством долгое время.\n\nИзвестный грекам как Зевс Аротриос, Дагон является Отцом Баала и богом экономики сам по себе.\n\n#! Apotheosis Effect: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_shapash:0 "$omen_shapash$"
 omen_shapash:1 "Шапаш"
 omen_shapash_desc:3 "Справедливость Шапаш будет сиять над нашим государством, как солнце, благословляя наш народ миром и честностью. Под её пристальным взглядом лишь самые неукротимые люди продолжат свою борьбу против нашего общества, и мы наконец положим конец любой внутренней угрозе.\n\nКак одна из дочерей Эля, она известна как богиня солнца и судья среди богов. Её справедливость решает судьбы других богов и может препятствовать их действиям при необходимости.\n\n#! Apotheosis Effect: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_astarte:0 "$omen_astarte$"
 omen_astarte:1 "Астарта"
 omen_astarte_desc:3 "Наш народ будет расти и расширяться под любящим взором богини. С её благословением над нашим народом наши дети наверняка вырастут здоровыми, а наши урожаи будут обильными долгие годы.\n\nАстарта известна как богиня плодородия по всем финикийским землям, иногда её празднуют вместе с богом исцеления Эшмуном. Греки часто сравнивают её со своей Афродитой.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"
 deity_eshmun:0 "$omen_eshmun$"
 omen_eshmun:0 "Эшмун"
 omen_eshmun_desc:1 "Мудрость и благожелательность Эшмуна принесут здоровье и счастье нашему народу. Обладая обширными знаниями о диких и разнообразных дарах природы, бог защитит наш народ от разрушений болезней и времени.\n\nПочитаемый от Финикии до Карфагена и называемый греками Асклепием, Эшмун является знаменитым и очень ценимым богом во всем ханаанском мире.\n\n#! Apotheosis Effect: $culture_apotheosis_capital_effect_tt_description$"
 deity_atargatis:0 "$omen_atargatis$"
 omen_atargatis:0 "Атаргатис"
 omen_atargatis_desc:2 "Известная как Атаргатис у греков, трижды благословенная носительница изобилия и защитница нуждающихся позаботится о том, чтобы потребности нашего народа оставались удовлетворенными.\n\nАтаргатис — это сочетание трех великих ханаанских богинь — Ашеры, Анат и Астарты, — чье поклонение оставалось популярным столетиями после эллинизации Сирии, особенно в Бамбике.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_baalat:0 "$omen_baalat$"
 omen_baalat:0 "Баалат"
 omen_baalat_desc:0 "Баалат — божество, происходящее из города-государства Библ в Финикии, и у неё есть впечатляющее святилище в городе с незапамятных времен.\n\nБожество часто ассоциируется с землей и другими богинями плодородия, такими как Астарта и Иштар, в то время как египтяне знают её как Хатор, а греки называют её Баалтис.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_noble_effect_tt_description$"

 # Heirs of Alexander #
 deity_gad:0 "$omen_gad$"
 omen_gad:0 "Гад"
 omen_gad_desc:0 "Гад — старый бог, или иногда богиня, удачи и случая. В отличие от многих других божеств Финикии и Палестины, Гад универсально призывается и почитается по всей восточной части Средиземноморья. Другие божества иногда также призываются с именем Гад, скорее как титул, чем как конкретное божество само по себе.\n\n#! Apotheosis Effect: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_hadad:0 "$omen_hadad$"
 omen_hadad:0 "Хадад"
 omen_hadad_desc:0 "Хадад — божество бури, происходящее изначально из северной Сирии и нижней Армении, где его часто почитали в единстве с синкретическим божеством Атаргатис. Несмотря на свое происхождение, один из его величайших храмов был возведен в Аскалоне, городе, где он считался самым важным божеством из всех.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_slaves_effect_tt_description$"