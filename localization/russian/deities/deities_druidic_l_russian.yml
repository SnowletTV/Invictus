l_russian:
## Nemeti ##
 deity_nemetona:0 "$omen_nemetona$"
 omen_nemetona:1 "Неметона"
 omen_nemetona_desc:3 "Наша богиня-покровительница благословит наших воинов своей милостью, сделав нашу победу в войне неизбежной. С ней на нашей стороне наши люди будут сражаться более дисциплинированно, защищая наше племя и богиню, которая благоволит нам.\n\nНеметона — важнейшая богиня пантеона для неметов, но менее известна в кельтском пантеоне в целом. Ей поклоняются как богине священных рощ и религиозных мест.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"

 ## Aedui ##
 deity_sucellus:0 "$omen_sucellus$"
 omen_sucellus:1 "Суцелл"
 omen_sucellus_desc:3 "Наш бог-покровитель Суцелл благословит наш народ защитой в эти трудные времена, обеспечив безопасность и согласие среди наших соплеменников. С этим богом на нашей стороне лишь самые худшие и проблемные элементы будут готовы продолжать свои беспорядки.\n\n#! Apotheosis Effect: $economy_apotheosis_province_improvement_effect_tt_description$"

 ## Aquitani ##
 deity_eki:0 "$omen_eki$"
 omen_eki:1 "Эки"
 omen_eki_desc:3 "Мы вознесем наши молитвы богине солнца в надежде, что она продолжит защищать нас. С её благословением наш народ непременно успокоится, и это усмирит несогласных прежде, чем они смогут причинить больше проблем нашему обществу.\n\n#! Apotheosis Effect: $culture_apotheosis_characters_effect_tt_description$"
 deity_mari:0 "$omen_mari$"
 omen_mari:1 "Мари"
 omen_mari_desc:3 "Мы будем поклоняться Владычице Бурь с надеждой, что она принесет бури плодородия, а не разрушения, на наши поля. Когда наши урожаи оживут и начнут расти, мы уверены, что наш народ будет безопасно процветать долгие годы.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"

 ## Pretani ##
 deity_andraste:0 "$omen_andraste$"
 omen_andraste:0 "Андрасте"
 omen_andraste_desc:0 "Андрасте — местное божество войны, обычно почитаемое племенами претанов, живущими в $britain_region$, причем особенно призывают её как богиню победы ицены. По преданию, заяц является священным животным для Андрасте, так как он играет важную роль в религиозных обрядах и ритуалах в её честь.\n\nСреди римлян она известна как Виктория, а греки называют её Ника.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"
 deity_belatucadros:0 "$omen_belatucadros$"
 omen_belatucadros:0 "Белатукадр"
 omen_belatucadros_desc:0 "Это божество — рогатый бог войны племен претанов севера, к которому обращаются многие местные племена, особенно вотadiniны. Хотя он и бог войны, это божество также ассоциируется с природой, флорой и ольхой.\n\nСреди греков и римлян он известен как Арес и Марс, а среди галльских племен его иногда почитают как Тутатиса.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"
 deity_coventina:0 "$omen_coventina$"
 omen_coventina:0 "Ковентина"
 omen_coventina_desc:0 "Ковентина — богиня колодцев и источников вокруг небольшой священной рощи в землях племен бригантов. По преданию, богиня принесла жизнь в суровые земли этого региона, и её культ начал распространяться за пределы первоначальной области почитания.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"
 deity_nodens:0 "$omen_nodens$"
 omen_nodens:0 "Ноденс"
 omen_nodens_desc:0 "Ноденс — божество войны и исцеления племен претанов, с акцентом на морские сражения и охоту. Как божество охоты, его священным животным является собака, которая играет важную роль в повседневной жизни тех, кто ему поклоняется, а также в ритуалах в его честь.\n\nЕго культ начал появляться за пределами $britain_region$, и его связывали с почитанием других божеств, таких как Сильван у римлян и Паппосилен у греков.\n\n#! Apotheosis Effect: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_sulis:0 "$omen_sulis$"
 omen_sulis:0 "Сулис"
 omen_sulis_desc:0 "Сулис — местная богиня термальных источников на юге $britain_region$, выступающая частично как фигура богини-матери, а частично как защита от проклятий. Даже люди издалека начали путешествовать к источникам, чтобы вознести молитвы богине, прося помощи против проклятий, которые могли их поразить.\n\nВ чужих землях её назвали Минервой или Афиной, соотнося с их Богиней Мудрости.\n\n#! Apotheosis Effect: $culture_apotheosis_rel_tech_effect_tt_description$"

 ## Belgae ##
 deity_camulus:0 "$omen_camulus$"
 omen_camulus:0 "Камул"
 omen_camulus_desc:0 "Камул — бог войны для бельгов Галлии, почитаемый всеми их племенами. Обычно он ассоциируется с диким кабаном, который иногда считается священным животным среди тех, кто чтит это божество.\n\nСреди греков он известен как Арес, а среди римлян — как Марс.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"

 ## Treveri ##
 deity_lenus:0 "$omen_lenus$"
 omen_lenus:0 "Ленус"
 omen_lenus_desc:0 "Ленус — бог войны некоторых мелких племен треверов на границах между Германией и Галлией. Его часто ассоциируют с более распространенным галльским богом Тутатисом как защитника племен, но у него есть и много уникальных черт.\n\nПомимо того, что он является защитным божеством войны, его почитают как бога источников и здоровья среди треверов. Во многих случаях его изображают вместе с богиней Анкамной, обычно как её супруга.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"
 deity_intarabus:0 "$omen_intarabus$"
 omen_intarabus:0 "Интараб"
 omen_intarabus_desc:0 "Интараб — одно из важнейших божеств для некоторых племен треверов Галлии, являясь одним из их многих защитников. Обычно его изображают как мужчину в расцвете сил, с волчьей шкурой на плечах и копьем в руке.\n\n#! Apotheosis Effect: $military_apotheosis_defensive_effect_tt_description$"
 deity_ancamna:0 "$omen_ancamna$"
 omen_ancamna:0 "Анкамна"
 omen_ancamna_desc:0 "Среди племен треверов Анкамна — богиня плодородия источников и одно из главных божеств их местного пантеона. Её часто изображают вместе с её супругом Ленусом как божественных защитников местных племен.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"

 ## Default ##
 deity_taranis:0 "$omen_taranis$"
 omen_taranis:1 "Таранис"
 omen_taranis_desc:4 "Наши воины должны стойко встречать невзгоды, зная, что бог неба благоволяет нашему делу. С его благословением и помощью наш народ наверняка одержит победу над врагами и соседями в нашей борьбе за господство.\n\nТаранис входит в Священную Триаду вместе с Эзусом и Тутатисом и широко известен как бог грома. При встрече с латинскими торговцами и купцами с Апеннинского полуострова этого бога часто отождествляют с их Юпитером.\n\n#! Apotheosis Effect: $military_apotheosis_defensive_effect_tt_description$"
 deity_toutatis:0 "$omen_toutatis$"
 omen_toutatis:1 "Тутатис"
 omen_toutatis_desc:3 "Защитник племени вдохновит наших воинов взяться за оружие и сражаться за племя в час нужды. С таким количеством новых потенциальных рекрутов мы наверняка сможем привести к войне больше людей, чем имели возможность делать за долгое время.\n\nТутатис входит в тройку Священной Триады вместе с Эзусом и Таранисом и широко известен как бог войны. Кроме того, его обычно считают великим защитником племен, выполняющим более оборонительную роль, чем многие боги войны в других государствах. Часто отождествляется с римским Марсом, хотя их природы довольно различны.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"
 deity_gobannus:0 "$omen_gobannus$"
 omen_gobannus:1 "Гобанн"
 omen_gobannus_desc:3 "Покровитель кузнецов принесет нам знания и технологии, необходимые для продвижения нашего общества за пределы текущих ограничений. Превзойдя наших предков, мы наверняка сможем конкурировать с нашими соседями и врагами.\n\n#! Apotheosis Effect: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_cernunnos:0 "$omen_cernunnos$"
 omen_cernunnos:1 "Кернунн"
 omen_cernunnos_desc:3 "Мы умоляем Рогатого бога поделиться с нашим народом частью богатства, которое он несет. С newfound wealth в наших руках наш народ наверняка будет процветать долгое время.\n\nКернунн — Хранитель Мертвых и бог жизни, животных и богатства. Несмотря на его несколько дикий вид и связь со смертью, бог обычно считается мирным и важной частью пантеона.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_ogmios:0 "$omen_ogmios$"
 omen_ogmios:1 "Огмий"
 omen_ogmios_desc:3 "Огмий привязывает наш народ к своему делу и оправдывает необходимые действия своих последователей. Поскольку наш народ убежден в необходимости войн, в которых мы участвовали, они будут более готовы взяться за оружие и в будущих битвах.\n\nВеликий воин-герой Огмий известен своими многочисленными путешествиями по нашим землям, привязывая встреченных людей к своим целям. Кроме того, он известен как психопомп, проводник душ мертвых в загробный мир. Часто отождествляется с римским Геркулесом или греческим Гераклом, хотя истории о героях различаются.\n\n#! Apotheosis Effect: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_lugus:0 "$omen_lugus$"
 omen_lugus:1 "Луг"
 omen_lugus_desc:3 "Три лица бога принесут нам достаток и побудят торговцев издалека открыть свои сундуки для наших товаров. Поскольку нашим купцам помогает великий бог, наш народ наверняка увидит больше богатства, проходящего через наше царство.\n\nКак один из главных богов нашей веры, Луг играет важную роль в искусствах, а также считается композитом Священной Триады: Тараниса, Тутатиса и Эзуса. Иногда отождествляется с римским Меркурием, несмотря на их различия.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_icovellauna:0 "$omen_icovellauna$"
 omen_icovellauna:1 "Иковеллауна"
 omen_icovellauna_desc:3 "Реки земли будут направлены так, чтобы обеспечивать наш народ и приносить мир и процветание тем, кто следует за богиней. С божеством на нашей стороне лишь самые проблемные несогласные продолжат создавать проблемы в нашем обществе, позволяя нам сосредоточить больше внимания на внешних врагах у наших границ.\n\n#! Apotheosis Effect: $fertility_apotheosis_food_effect_tt_description$"
 deity_rosmerta:0 "$omen_rosmerta$"
 omen_rosmerta:1 "Росмерта"
 omen_rosmerta_desc:3 "Богиня Плодородия благословит наш народ обильным урожаем и жизнью для наших детей. Поскольку наш народ благословлен, мы наверняка увидим меньше лет плохих урожаев, и больше наших людей вырастет здоровыми в ближайшие годы.\n\nОна — богиня плодородия и изобилия, а также супруга Луга.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"

 deity_brigantia:0 "$omen_brigantia$"
 omen_brigantia:0 "Бригантия"
 omen_brigantia_desc:1 "Наши храбрые воины устремятся к победе под руководством богини битвы и славы, вдохновленные улучшать свои боевые подвиги и верить в неизбежный триумф нашего народа.\nБригантия — кельтская богиня-воительница, засвидетельствованная преимущественно на Британских островах, которую римляне интерпретировали как параллель Ники или Виктории в эллинском пантеоне.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"
 deity_glanis:0 "$omen_glanis$"
 omen_glanis:0 "Гланис"
 omen_glanis_desc:1 "Божественная исцеляющая сила бога источников течет через многих паломников, которые стекаются разделить его добрую волю и искупаться в священных бассейнах. Отрадно знать, что есть надежда для больных, пока они оказывают должное уважение богам.\nГланис был галльским божеством исцеления, связанным с источниками в Глануме, культ которого просуществовал до возвышения христианства.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_berobreo:0 "$omen_berobreo$"
 omen_berobreo:0 "Беробрео"
 omen_berobreo_desc:1 "На западном краю мира подземное царство Беробрео поглощает неизведанные места и тайны земли. Мы должны помнить о бренности жизни и огромности нашего невежества, если хотим жить счастливо и ценить благословения бога в этом мире.\nИзвестное святилище, вдающееся в море в западной Галисии, было посвящено Беробрео.\n\n#! Apotheosis Effect: $economy_income_effect_tt_description$"
 deity_cichol:0 "$omen_cichol$"
 omen_cichol:0 "Циколл"
 omen_cichol_desc:0 "Это божество — одно из божеств войны, которым поклоняются почти во всем галльском мире, от бельгов на севере до народов Трансальпийской Галлии на юге. В отличие от многих других божеств войны, почитаемых в Галлии, его обычно не изображают как защитника, а скорее как сильного воина, не привязанного ни к одному племени.\n\n#! Apotheosis Effect: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_nantosuelta:0 "$omen_nantosuelta$"
 omen_nantosuelta:0 "Нантосуэльта"
 omen_nantosuelta_desc:0 "Нантосуэльта — таинственное божество, которому широко поклоняются в Галлии, Британии и Иберии, часто ассоциируемое либо с войной, либо с изобилием. Богиню часто изображают в виде ворона или с вороном рядом, животное, которое считается священным среди тех, кто ей поклоняется.\n\n#! Apotheosis Effect: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_maponos:0 "$omen_maponos$"
 omen_maponos:0 "Мапонос"
 omen_maponos_desc:0 "Мапонос — бог юности, которому поклоняются как в Галлии, так и в Британии, часто изображаемый с каким-либо музыкальным инструментом. Божество ассоциируется с поэзией или любовью, двумя атрибутами, часто проявляющимися в большинстве историй, где он участвует.\n\nСреди греков и римлян он известен как Аполлон, ближайший аналог их собственного бога юности.\n\n#! Apotheosis Effect: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_belisama:0 "$omen_belisama$"
 omen_belisama:0 "Белисама"
 omen_belisama_desc:0 "Белисама — солнечная богиня, которой поклоняются по всей Галлии и Британии. Она является женской формой еще более известного Белина, бога, который иногда называется её мужем, оба известны как те, кто перемещает солнце по небу.\n\nСреди римлян её иногда ассоциируют с их богиней мудрости, Минервой.\n\n#! Apotheosis Effect: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_belinus:0 "$omen_belinus$"
 omen_belinus:0 "Белин"
 omen_belinus_desc:0 "Белин — солнечный бог среди народов Галлии и Британии, с несколькими заметными мифами, делающими его носителем солнца. Он одно из самых почитаемых божеств по всей Галлии, также иногда в женском варианте, известном как Белисама, которую некоторые называют его женой.\n\nСреди народов Средиземноморья его обычно называют Гелиосом или Аполлоном, их собственными солнечными божествами.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_artio:0 "$omen_artio$"
 omen_artio:0 "Артия"
 omen_artio_desc:0 "Артия — богиня плодородия, жизни и изобилия, которой широко поклоняются. Медведь считается её священным животным, и эта связь глубока, до такой степени, что некоторые называют её богиней-медведицей и изображают с медвежьей головой или шкурой.\n\n#! Apotheosis Effect: $fertility_apotheosis_food_effect_tt_description$"
 deity_cissonius:0 "$omen_cissonius$"
 omen_cissonius:0 "Циссоний"
 omen_cissonius_desc:0 "Циссоний — бог путешественников и торговли для многих племен Галлии и Британии, уникальный и весьма отличный от многих воинственных и исцеляющих божеств, обычно почитаемых в этих землях. Его обычно изображают как пожилого мужчину, едущего на баране и пьющего вино, и считают эквивалентом греческого Гермеса или римского Меркурия.\n\n#! Apotheosis Effect: $economy_income_effect_tt_description$"