l_russian:
 #From Torugu
 deity_athena_tritogeneia: "$omen_athena_tritogeneia$"
 omen_athena_tritogeneia: "Афина Тритогения"
 omen_athena_tritogeneia_desc: "$athena_description$\n\n#Y Тритогения#!: В священной земле Ливии, именно там вы найдете животворящие воды озера Тритонида, и именно у этих священных вод родилась богиня Афина Тритогения, Та, Что Была Порождена Тремя. Восхвали её, смертный, и прими её благословения, если она сочтет тебя достойным.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"
 ## Dionysos Indikos
 deity_dionysos_indikos:0 "$omen_dionysos_indikos$"
 omen_dionysos_indikos:0 "Дионис Индик"
 omen_dionysos_indikos_desc:0 "$dionysus_description$\n\n#Y Индик#!: Дионис Индик — греческое проявление агамического бога Шивы. Мы ввели его в греко-буддийский пантеон. Мы вознесем наши молитвы Шиве в надежде, что он направит наших воинов в битве и укрепит их боевой дух. С укрепленной дисциплиной и решимостью наших солдат мы наверняка одержим множество побед в ближайшие годы.\n\n#! Apotheosis Effect: $military_apotheosis_capital_freemen_effect_tt_description$"

 ## Imperator Invictus ##
 deity_aphrodite_areia:0 "$omen_aphrodite_areia$"
 omen_aphrodite_areia:0 "Афродита Арейя"
 omen_aphrodite_areia_desc:0 "$aphrodite_description$\n\n#Y Арейя#!: Этот эпитет означает «Афродита Воинственная» и обычно почитается в Спарте и Тарасе. Часто изображаемая в полных доспехах, подобно богу войны Аресу, считается, что это воинственное изображение Афродиты принадлежит её самым ранним адептам и культам на Кипре и Кифере, где было сильное восточное влияние в период ориентализации.\n\nЭто изображение прослеживает происхождение Афродиты от более древних ближневосточных богинь, таких как шумерская Инанна, месопотамская Иштар и финикийская Аштарт.\n\nНа Кипре Афродиту также называли эпитетом «Афродита Энкейос» (Афродита с копьем), и предполагается, что культ был перенесен с Кипра в Спарту.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"
 deity_enyo:0 "$omen_enyo$"
 omen_enyo:0 "Энио"
 omen_enyo_desc:0 "Богиня войны, часто ассоциируемая с греческим богом Аресом, либо как его возлюбленная, либо как сестра, Энио ответственна за организацию разрушения городов, часто сопровождая Ареса в битве.\n\nВо время падения Трои Энио наводила ужас и проливала кровь в войне, вместе с Эридой («Раздор»), Фобосом («Страх») и Деймосом («Ужас»), причём последние двое были сыновьями Ареса. Согласно мифу, Энио участвовала в войне Семерых против Фив, а также в войне Диониса с индийцами.\n\nГоворят, что Энио настолько наслаждалась войной, что даже отказалась принимать чью-либо сторону в битве между Зевсом и чудовищем Тифоном.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"
 deity_bellona:0 "$omen_bellona$"
 omen_bellona:0 "Беллона"
 omen_bellona_desc:0 "Римская богиня войны, разрушения и опустошения, Беллона была супругой Марса, римского бога войны.\n\nВ римской традиции Беллона ответственна за организацию разрушения городов, часто сопровождая Марса в битве. В военном культе Беллоны она чаще всего ассоциировалась с Виртус, олицетворением доблести.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"
 deity_hestia:0 "$omen_hestia$"
 omen_hestia:0 "Гестия"
 omen_hestia_desc:0 "Богиня-дева очага, правильного устройства домашнего быта, семьи, дома и государства, Гестия была первенцем титанов Крона и Реи.\n\nПо обычаю, в греческой культуре Гестия получала первое подношение при каждой жертве в доме.\n\nВ общественной сфере очаг пританея выполнял функцию её официального святилища, и когда основывалась новая колония, пламя от общественного очага Гестии в городе-матери переносилось в новое поселение.\n\n#! Apotheosis Effect: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_vesta:0 "$omen_vesta$"
 omen_vesta:0 "Веста"
 omen_vesta_desc:0 "Богиня-дева очага, правильного устройства домашнего быта, семьи, дома и государства, Веста была первенцем титанов Сатурна и Опс. Её редко изображали в человеческом облике, и она часто представлялась огнем её храма на Римском форуме.\n\nВход в её храм разрешался только её жрицам, весталкам, которые поддерживали священный огонь на очаге в её храме. Поскольку она считалась хранительницей римского народа, её праздник, Весталии (7–15 июня), считался одним из важнейших римских праздников.\n\nВо время Весталий матроны ходили босиком по городу к святилищу богини, где приносили в дар пищу.\n\n#! Apotheosis Effect: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_proserpina:0 "$omen_proserpina$"
 omen_proserpina:0 "Прозерпина"
 omen_proserpina_desc:0 "Прозерпина — древняя римская богиня, чей культ, мифы и таинства были объединены из культов Либеры, ранней римской богини вина. В Греции она была известна как Персефона, и её мать — Деметра, богини зерна и земледелия.\n\nПодобно тому, как Персефона считалась дочерью Деметры, Прозерпина была дочерью римского эквивалента Деметры, Цереры.\n\nКак и Персефона, Прозерпина ассоциируется с подземным миром и его правителем, правя как Царица Подземного мира; и вместе со своей матерью Церерой, с весенним ростом посевов и циклом жизни, смерти и возрождения или обновления.\n\n#! Apotheosis Effect: $fertility_apotheosis_food_effect_tt_description$"
 deity_luna:0 "$omen_luna$"
 omen_luna:0 "Луна"
 omen_luna_desc:0 "Луна — богиня луны и сестра бога солнца Сола. Каждый день он путешествует по небесам, и каждую ночь она следует за ним.\n\nГоворят, что она так сильно любила своего возлюбленного Эндимиона, что попросила своего отца Юпитера даровать ему бессмертие, вечную юность и вечный сон, чтобы она могла навещать его каждую ночь.\n\nЛуна не всегда является отдельной богиней, но иногда скорее эпитетом, специализирующим богиню, поскольку и Диана, и Юнона отождествляются как богини луны.\n\n#! Apotheosis Effect: $culture_apotheosis_capital_effect_tt_description$"
 deity_kronos:0 "$omen_kronos$"
 omen_kronos:0 "Кронос"
 omen_kronos_desc:0 "Кронос был лидером и младшим из первого поколения титанов, божественных потомков Урана (Небо-Отец) и Геи (Мать-Земля). Он сверг своего отца и правил во время мифологического Золотого века, пока не был свергнут своим собственным сыном Зевсом и заключен в Тартар.\n\nСогласно Платону, однако, божества Форкис, Кронос и Рея были старшими детьми Океана и Тефии. Его обычно изображают с харпе, серпом или косой, которые были инструментом, использованным им, чтобы оскопить и свергнуть Урана, своего отца.\n\nКроноса часто путают или, возможно, сознательно отождествляют с Богом Времени Хроносом в античности из-за сходства их имен.\n\n#! Apotheosis Effect: $culture_apotheosis_capital_effect_tt_description$"
 deity_saturn:0 "$omen_saturn$"
 omen_saturn:0 "Сатурн"
 omen_saturn_desc:0 "Сатурн был богом порождения, растворения, изобилия, богатства, земледелия, периодического обновления и освобождения. Мифологическое правление Сатурна изображалось как Золотой век изобилия и мира. После римского завоевания Греции он был отождествлен с греческим титаном Кроносом.\n\nСупругой Сатурна была его сестра Опс, от которой он родил Юпитера, Нептуна, Плутона, Юнону, Цереру и Весту.\nСатурн особенно праздновался во время фестиваля Сатурналий каждый декабрь, возможно, самого известного из римских праздников, времени пиршеств, смены ролей, свободы слова, дарения подарков и веселья.\n\n#! Apotheosis Effect: $culture_apotheosis_capital_effect_tt_description$"
 deity_eris:0 "$omen_eris$"
 omen_eris:0 "Эрида"
 omen_eris_desc:0 "Эрида была греческой богиней раздора и вражды. Самая известная история об Эриде рассказывает о том, как она инициировала Троянскую войну, вызвав Суд Париса.\n\nБогини Гера, Афина и Афродита были приглашены вместе с остальным Олимпом на вынужденную свадьбу Пелея и Фетиды, которые должны были стать родителями Ахилла, но Эрида была проигнорирована из-за её склонности к неприятностям.\n\nПоэтому (как упоминается в Киприях согласно Проклу, как часть плана, задуманного Зевсом и Фемидой) она бросила на пир Яблоко Раздора, золотое яблоко с надписью: «Прекраснейшей» — спровоцировав богинь начать спор о подходящем получателе.\n\nНесчастному Парису, принцу Трои, было поручено Зевсом выбрать прекраснейшую. После этого богини пытались подкупить Париса, чтобы он выбрал их.\n\nГера предложила политическую власть; Афина пообещала бесконечную мудрость; а Афродита соблазнила его самой красивой женщиной в мире: Еленой, женой Менелая из Спарты.\n\nХотя греческая культура придавала большее значение доблести и силе, Парис решил отдать яблоко Афродите, тем самым обрекая свой город, который был разрушен в последовавшей войне.\n\n#! Apotheosis Effect: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_discordia:0 "$omen_discordia$"
 omen_discordia:0 "Дискордия"
 omen_discordia_desc:0 "Дискордия была римской богиней раздора и вражды и является аналогом Эриды. Как и Эрида, она известна тем, что начала Троянскую войну после того, как была проигнорирована олимпийскими богами, за что она представила Яблоко Раздора.\n\nЭто привело к тому, что Юпитер выбрал троянского принца Париса для выбора Прекраснейшей Богини из Всех, и тот выбрал Венеру после того, как она предложила ему Елену, жену Менелая из Спарты, что стало причиной Троянской войны.\n\n#! Apotheosis Effect: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_artemis_tauropolos:0 "$omen_artemis_tauropolos$"
 omen_artemis_tauropolos:0 "Артемида Таврополос"
 omen_artemis_tauropolos_desc:0 "$artemis_description$\n\n#Y Таврополос#!: История Ифигении, девы, которую чуть не принесли в жертву её отец, прежде чем её спасла богиня Артемида, — это история, особенная для нашего народа. Ибо Ифигения была увезена в землю тавров, и когда она в конце концов вернулась, она принесла с собой статую своей покровительницы Артемиды, которую мы почитаем по сей день. Помнить о милостях Артемиды Таврополос — наш священный долг.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_hecate_iphemide:0 "$omen_hecate_iphemide$"
 omen_hecate_iphemide:0 "Геката Ифемидида"
 omen_hecate_iphemide_desc:0 "$hecate_description$\n\n#Y Ифемидида#!: Геката, имя, которое шепчут непослушным детям по вечерам; таинственная богиня магии и тайн, света и тьмы, Та, Что Ждет на Перекрестках и Стоит За Вратами. В наших землях мы знаем её как Гекату Ифемидиду, вспоминая деяния, которые другие, менее благочестивые последователи давно забыли.\n\n#! Apotheosis Effect: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_heraklean_targitaos:0 "$omen_heraklean_targitaos$"
 omen_heraklean_targitaos:0 "Гераклов Таргитай"
 omen_heraklean_targitaos_desc:0 "$targitaos_description$\n\n#Y Гераклов#!: Эллинская интерпретация бога Таргитая, он представляет собой смесь культур. Объединенная сила как греческого, так и скифского праотца линии наших царей дарует нам неизмеримую силу в войне.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"
 deity_hylaian_drakaina:0 "$omen_hylaian_drakaina$"
 omen_hylaian_drakaina:0 "Гилейская Дракена"
 omen_hylaian_drakaina_desc:0 "$drakaina_description$\n\n#Y Дракена#!: Наполовину змея, наполовину женщина, подобно другим Дракенам из греческого мифа, Гилейская Дракена служит представлением плодородной земли. В попытке объяснить скифский традиционный миф о происхождении со своей собственной точки зрения, греки использовали её, чтобы передать идею земли, рождающей трех великих сыновей Геракла, которые должны были заселить землю Скифии.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_drakon_kholchikos:0 "$omen_drakon_kholchikos$"
 omen_drakon_kholchikos:0 "Колхидский Драконт"
 omen_drakon_kholchikos_desc:0 "$kholchikos_description$\n\n#Y Колхидский#!: Дракон, охранявший дуб, на котором изначально было повешено Золотое Руно, прежде чем Ясон из аргонавтов забрал его и бежал с помощью Медеи, дочери царя Ээта. Гигантский, бдительный змей, дракон был священным защитником рощи, которая, по словам греков, принадлежала Аресу. Из его зубов, посеянных в землю, восстали свирепые, закаленные в боях воины, готовые сражаться до горького конца. Это было ужасное, но внушающее благоговение существо с единственной целью, предназначенной богами.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"
 deity_aeetes:0 "$omen_aeetes$"
 omen_aeetes:0 "Ээт"
 omen_aeetes_desc:0 "Сын бога солнца Гелиоса и океаниды (водной нимфы) Персеиды, Ээт был царем Колхиды в греческой мифологии. Он играет видную роль в невероятной истории Ясона и аргонавтов, в которой Ээт пообещал Ясону легендарное Золотое Руно, если Ясон сможет выполнить определенные задания. Ээт также мог быть реальной исторической фигурой или, возможно, представлением реального исторического царя. Многие колхидские правители утверждают, что происходят от этой полулегендарной фигуры."
 deity_iason:0 "$omen_iason$"
 omen_iason:0 "Ясон"
 omen_iason_desc:0 "Ясон — древнегреческий герой и предводитель аргонавтов. Ясон собрал команду для своего корабля «Арго», в которую вошли многие греческие герои, включая Геракла, Диоскуров, Аргоса, Орфея и многих других выдающихся личностей. Они намеревались найти легендарное Золотое Руно и thus отправились в приключение. Сначала на остров Лемнос, где все мужчины, кроме Геракла, вступили в многочисленные связи с местными женщинами, что привело к появлению новой «расы» миниев. Затем они отправились в Кизик, где столкнулись с внезапной атакой рожденных землей гигантов, называемых гегеинами. Далее Ясон и аргонавты отплыли ко двору Финея, где на них напали гарпии. Наконец, чтобы достичь Колхиды, они прошли через коварные Симплегады — сокрушительные и сталкивающиеся скалы, которые уничтожали все, что проходило через них. Наконец, они прибыли в Колхиду, где им пришлось противостоять Ээту и его невыполнимым испытаниям, чтобы получить Золотое Руно."
 deity_leukothea:0 "$omen_leukothea$"
 omen_leukothea:0 "Левкофея"
 omen_leukothea_desc:0 "Левкофея, или Левкотея, была богиней со множеством слегка различающихся мифов о происхождении. В одной версии она была царицей Атаманта, которую затем назвали Ино. Гера свела Ино с ума в наказание за заботу о новорожденном боге Дионисе. Ино бросилась в море со своим сыном Меликертом на руках. Из жалости боги превратили обоих в морских богов. Ино стала Левкофеей, а её сын стал Палемоном.\n\nВ версии мифа с Родоса речь идет о Галии, нимфе (или малой богине). Она была дочерью титанов Талассы и Понта. Галия стала женой Посейдона, и этот союз родил паре шестерых сыновей, а также богиню Родос. Однако сыновья отказали Афродите высадиться на их острове, и поэтому она прокляла сыновей, которые изнасиловали свою собственную мать, Галию. В отчаянии Галия бросилась в океан и стала Левкофеей.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"
 deity_prometheus:0 "$omen_prometheus$"
 omen_prometheus:0 "Прометей"
 omen_prometheus_desc:0 "Прометей, греческий титан огня. Прометей знаменито бросил вызов греческим богам, подарив человечеству тайну огня. Он был провозглашен великим божеством для человечества, подарив им не только огонь, но и сущность технологического прогресса и цивилизации. Однако за то, что он ослушался богов, Прометей был наказан на вечность. Он был прикован к гигантской скале на горе на краю Колхиды. Там орел приходил каждый день, чтобы клевать его печень из тела. Каждую ночь его печень отрастала, только чтобы снова быть съеденной орлом.\n\n#! Apotheosis Effect: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_apsyrtus:0 "$omen_apsyrtus$"
 omen_apsyrtus:0 "Апсирт"
 omen_apsyrtus_desc:0 "Колхидский принц и потомок Гелиоса, Апсирт играл важную роль в истории Ясона и аргонавтов. Он и его сестра Медея бежали вместе с Ясоном из Колхиды с легендарным золотым руном. Однако Медея, чтобы замедлить своего отца, который настиг бы её, убила Апсирта и бросила части его тела позади себя, чтобы её отец был вынужден собрать все куски своего сына, тем самым замедлив его.\n\n#! Apotheosis Effect: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_apollo_hegemon:0 "$omen_apollo_hegemon$"
 omen_apollo_hegemon:0 "Аполлон Гегемон"
 omen_apollo_hegemon_desc:0 "Мстительная, победоносная форма бога света Аполлона, Тот, Кто Не Знает Пощады, кто властвует над царями и императорами мира. Аполлон Гегемон очень любим гражданами наших городов, которые видят в Аполлоне вдохновение в мирное и военное время, ибо та же рука, что щиплет лиру, несет меч."
 deity_ge:0 "$omen_ge$"
 omen_ge:0 "Гея"
 omen_ge_desc:0 "Гея — армазское изображение греческого божества Гайи. Одно из четырех изначальных бессмертных существ, появившихся после Хаоса, она была воплощением самой земли. Она создала Урана, небеса, прежде чем родить больше детей. Уреи, горы; Понт, море; и Циклопы; все без помощи супруга. Уран стал её первым супругом. От этого союза Гея забеременела тремя мальчиками. Однако Уран, боясь за свое положение, отказался позволить детям родиться. Таким образом, Гея страдала immensely, поскольку Уран препятствовал её родам. Наконец, Кронос помог ей отомстить Урану, отрезав его мужской член. От этого родилось множество существ: Эринии, гиганты, нимфы ясеня (Мелии), и из большей части плоти возникла богиня Афродита. Наконец, дети внутри Геи родились как титаны Бриарей, Котт и Гий.\n\n#! Apotheosis Effect: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_phrixus:0 "$omen_phrixus$"
 omen_phrixus:0 "Фрикс"
 omen_phrixus_desc:0 "Фрикс был сыном царя Беотии, Атаманта. Его матерью была богиня облаков, Нефела. Фрикс вместе со своей сестрой-близнецом Геллой должен был быть принесен в жертву, чтобы спасти посевы Беотии. Их мачеха, Ино (позже богиня Левкотея), ненавидела их и поэтому тайно прожарила все семена зерна в Беотии. Фермеры спросили оракула, что случилось и что делать, однако люди, которые должны были передать слова оракула, были подкуплены Ино, чтобы солгать и сказать остальным беотийцам, что оракул потребовал принести в жертву Фрикса и Геллу. Однако прежде чем их смогли принести в жертву, их спас плывущий баран с золотым руном. К несчастью, во время путешествия на баране Гелла упала и была брошена в воды, которые отныне стали называться Геллеспонтом. Тем временем Фрикс отправился в Колхиду, где царь Ээт хорошо его принял, и он даже женился на дочери Ээта, Халкиопе. Их союз породил Арга, Фронтиса, Меласа и Китисора.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"
 deity_hydaspes:0 "$omen_hydaspes$"
 omen_hydaspes:0 "Гидасп"
 omen_hydaspes_desc:0 "Гидасп — могучий бог реки Гидасп, также называемой рекой Джелум. Когда Александр вел свои армии к Инду и царь Пор сражался против него, боги тоже сражались. В эпической сказании Гидасп был описан как сражающийся с Дионисом как представление Пора против Александра. Хотя этот эпос появился в пятом веке н.э., вероятно, что истоки бога Гидаспа начались в первом веке до н.э. Он является воплощением реки, носящей то же имя. Его также называют богом Пентапотамии.\n\n#! Apotheosis Effect: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_zeus_dacieus:0 "$omen_zeus_dacieus$"
 omen_zeus_dacieus:0 "Зевс Дакиев"
 omen_zeus_dacieus_desc:0 "$zeus_description$\n\n#Y Дакиев#!: Зевс Дакиев почитался в Каппадокии многими, и его жрец был четвертым по важности жрецом в царстве.\n\n#! Apotheosis Effect: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_cataonian_apollo:0 "$omen_cataonian_apollo$"
 omen_cataonian_apollo:0 "Катаонский Аполлон"
 omen_cataonian_apollo_desc:0 "$apollo_description$\n\n#Y Катаонский#!: Храм Катаонского Аполлона в Дастаркуме был образцом для всех других храмов в Каппадокии.\n\n#! Apotheosis Effect: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_orpheus:0 "$omen_orpheus$"
 omen_orpheus:0 "Орфей"
 omen_orpheus_desc:0 "Орфей был легендарным греческим героем с музыкальным талантом, превосходящим человеческие возможности. Он был сыном Каллиопы и Ойагра, царя Фракии. Говорили, что его лиру ему дал сам Аполлон. Орфей присоединился к аргонавтам и соперничал с музыкой сирен своей собственной музыкой. По возвращении он женился на Эвридике, однако она умерла от укуса змеи. Он был так поражен горем, что использовал свое музыкальное мастерство, чтобы очаровать и тронуть Аида, который позволил Эвридике вернуться в мир живых при условии, что ни она, ни Орфей не обернутся, покидая его царство. Орфей дошел до самого выхода, а затем обернулся, однако Эвридика еще не вышла и мгновенно исчезла обратно в Подземный мир.\n\n#! Apotheosis Effect: $culture_apotheosis_capital_effect_tt_description$"
 deity_hermes_trumsiates:0 "$deity_hermes_trumsiates$"
 omen_hermes_trumsiates:0 "Гермес Трумсиат"
 omen_hermes_trumsiates_desc:0 "Спартанское слияние эллинского божества Гермеса с существовавшим венетским богом Трумсиатом, Гермес Трумсиат почитается как путешественниками, так и торговцами в эллинской сфере северо-восточной Италии. Покровитель караванов, он особенно почитаем энетами, которые часто полагаются на торговлю, чтобы зарабатывать на жизнь.\n\n#! Apotheosis Effect: $economy_income_effect_tt_description$"
 deity_apollo_altinos:0 "$omen_apollo_altinos$"
 omen_apollo_altinos:0 "Альтинский Аполлон"
 omen_apollo_altinos_desc:0 "Поскольку старый венетский бог Альтино считается одним и тем же, что и материковый греческий Аполлон, он стал одним из важнейших божеств энетов, и в его храмах периодически приносятся в жертву лошади.\n\n#! Apotheosis Effect: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_artemis_reitia:0 "$omen_artemis_reitia$"
 omen_artemis_reitia:0 "Рейтия Артемида"
 omen_artemis_reitia_desc:0 "Будучи одним из самых почитаемых божеств местных венетов, Рейтия была отождествлена с Артемидой вторгшимися спартанцами. Будучи как богиней природы, так и женщин, Рейтия Артемида, как говорят, защищает народ энетов, давая им глубокое уважение к природному миру и поощряя грамотность граждан через свои религиозные ритуалы.\n\n#! Apotheosis Effect: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_ares_einaios:0 "$omen_ares_einaios$"
 omen_ares_einaios:0 "Арес Энейский"
 omen_ares_einaios_desc:0 "Ранее бывший лишь местным патавийским богом, Эней был возвышен вторгшимися спартанцами и отождествлен с их великим богом войны, Аресом. Теперь Арес Энейский — главный бог войны энетов, как полагают, ведущий их к каждой победе.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"
 #omen_orpheus_desc:0 "Орфей был легендарным греческим героем с музыкальным талантом, превосходящим человеческие возможности. Он был сыном Каллиопы и Ойагра, царя Фракии. Говорили, что его лиру ему дал сам Аполлон. Орфей присоединился к аргонавтам и соперничал с музыкой сирен своей собственной музыкой. По возвращении он женился на Эвридике, однако она умерла от укуса змеи. Он был так поражен горем, что использовал свое музыкальное мастерство, чтобы очаровать и тронуть Аида, который позволил Эвридике вернуться в мир живых при условии, что ни она, ни Орфей не обернутся, покидая его царство. Орфей дошел до самого выхода, а затем обернулся, однако Эвридика еще не вышла и мгновенно исчезла обратно в Подземный мир."
 deity_hera_kandarene:0 "$omen_hera_kandarene$"
 omen_hera_kandarene:0 "Гера Кандарена"
 omen_hera_kandarene_desc:0 "$hera_description$\n\n#Y Кандарена#!: Скрытая в горах Олгассис в Северной Анатолии, Гера с теплым взором наблюдает за городом Кандара. Богиня-мать, подобная Кибеле Матери, Гера стала популярной в большей Анатолии после ионийской колонизации её западного побережья и близлежащих островов. Для пафлагонцев она существует как защитница их культуры, их царской линии и их образа жизни.\n\n#! Apotheosis Effect: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_kytioros:0 "$omen_kytioros$"
 omen_kytioros:0 "Китиор"
 omen_kytioros_desc:0 "Сын Фрикса, того человека, что бежал из Беотии и смерти в приветливый дом колхидского Ээта, верхом на золотом руне, Китиор не оказался ни в одной из земель своего отца. Вместо этого он сделал своим домом вершины хребта Олгассис в Пафлагонии, в горном святилище за портом Китора, и дал этому городу свое имя... или так заставлял людей верить Эфор из Ким.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_glycon:0 "$omen_glycon$"
 omen_glycon:0 "Гликон"
 omen_glycon_desc:0 "Предполагаемое воплощение бога исцеления Асклепия, Гликон-змея обитает в Абонотейхе, под управлением оракула Гликона. Змей с человекоподобной головой, говорят, что он говорит загадками и предсказывает судьбы. Существо-оракул напоминает о многих змеиных культах, найденных в сердце Македонии в Элладе. Повсюду люди стали высоко почитать змея, веря, что все его изречения — их путеводный свет.\n\n#! Apotheosis Effect: $glycon_apotheosis_effect_tt_description$"
 deity_zeus_chrysaoreus:0 "$omen_zeus_chrysaoreus$"
 omen_zeus_chrysaoreus:0 "Зевс Хрисаорей"
 omen_zeus_chrysaoreus_desc:0 "$zeus_description$\n\n#Y Хрисаорей#!: Зевс Хрисаорей, тесно связанный с Зевсом Лабрандосом, был продуктом слияния эллинской и карийской культуры, выступая как эллинизированная форма хурритского бога погоды Тешуба.\n\nБог небес благословляет наши продвижения на поле боя. С руководством приносящего бурю наш народ отточит свои навыки в обращении с топором и мечом.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"
 deity_achelous:0 "$omen_achelous$"
 omen_achelous:0 "Ахелой"
 omen_achelous_desc:0 "$achelous_description$\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 achelous_description:0 "Сын титанов Океана и Тефиды, Ахелой был олицетворением одноименной реки Ахелой, самой длинной реки в Греции. Ахелой почитался как бог пресной воды. Некоторые верили, что «воды сереброкружащегося Ахелоя» были источником всего Средиземноморья. Он знаменито сражался с Гераклом за руку Деяниры и был трижды побежден: сначала в облике человека, затем как змея и, наконец, как бык. Этот конфликт часто изображался на керамике по всему эллинскому миру. После победы над своим врагом Геракл оторвал один из бычьих рогов Ахелоя и отдал его Гесперидам, которые наполнили рог фруктами и цветами, превратив его в Рог Изобилия или Корнукопию. Говорили, что Ахелой породил Сирен от одной из Муз, обычно Терпсихоры или Мельпомены.\n\nАрхеологические свидетельства указывают на то, что Ахелой был важным речным богом, возможно, самым важным из всех греческих речных богов, с раннего периода. Но его влияние начало ослабевать к концу четвертого века до н.э., и Ахелой постепенно был низведен до статуса малого водного бога."
 deity_mithras:0 "$omen_mithras$"
 omen_mithras:0 "Митра"
 omen_mithras_desc:0 "Особенно популярный в римских армиях на востоке, Культ Митры окутан таинственными обрядами и почитанием титульного бога, Митры. Наиболее заметная иконография этого странного культа — это бык и бычьи бои. Некоторые говорят, что он был греческим героем древности, в то время как другие сравнивают его с самим Аполлоном. Трудно сказать, когда у бога так мало праздников, кроме 25-го дня декабря. В немногих фестивалях, которые они отмечают, они наполнены grand пирами в подземных храмах, называемых Митреум.\n\n#! Apotheosis Effect: $military_apotheosis_capital_freemen_effect_tt_description$"

 
 deity_demetrios:0 "$omen_demetrios$"
 omen_demetrios:0 "Деметрий Полиоркет"
 omen_demetrios_desc:0 "Деметрий Полиоркет был македонским греческим дворянином и военачальником, который стал царем Македонии между 294-288 годами до н.э. Член династии Антигонидов, он был сыном её основателя, Антигона I Одноглазого и его жены Стратоники, а также первым членом семьи, правившим Македонией в эллинистической Греции.\nПосле того как Деметрий вырвал контроль над Афинами у Кассандра, он был удостоен как живой бог благодарными жителями Афин, Деметрию были дарованы религиозные почести и божественный статус с ифифаллическим гимном, включая приписывание божественного происхождения путем называния Деметрия сыном Посейдона и Афродиты. Деметрию был отдан опистодом Парфенона в качестве его личной резиденции, и он был сделан оракулом, поставив Деметрия в положение высшей религиозной власти и возвысив его до практически неприкосновенного ранга. В этот период Деметрию Полиоркету были даны почести, подобающие богу Дионису. Среди многих изменений, фестиваль, называемый Дионисии, был воссоздан как Деметрии."

 deity_aphrodite_hoplimense:0 "$omen_aphrodite_hoplimense$"
 omen_aphrodite_hoplimense:0 "Афродита Гоплисмена"
 omen_aphrodite_hoplimense_desc:0 "$aphrodite_description$\n\n#Y Гоплисмена#!: означающее «вооруженная» — это эпитет Афродиты, которой поклоняются в Коринфе. Её храм стоит на вершине Акрокоринфа, большой скальной структуры, нависающей над городом. Она представляет интимный физический контакт, сексуальный и воинственный. Храм знаменит своей практикой проституции. Хотя это более своеобразный взгляд на богиню, в Илиаде Афродита сама вступила в битву, спасая Энея от смерти. Спартанцы почитают похожую версию богини, Афродиту Арейю.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_effect_tt_description$"

 deity_bellerophon:0 "$omen_bellerophon$"
 omen_bellerophon:0 "Беллерофонт"
 omen_bellerophon_desc:0 "Беллерофонт, сын Посейдона и смертной Эвриномы, был одним из величайших героев и убийцей чудовищ, до времени Геракла. Среди его подвигов — убийство дышащего огнем Химеры и укрощение легендарного коня Пегаса. Его гордыня взяла верх, и когда он попытался полететь на гору Олимп на Пегасе, Зевс послал овода ужалить Беллерофонта, заставив его упасть на землю и умереть. Беллерофонт — самый почитаемый герой из Коринфа, и поклонение ему особенно популярно там.\n\n#! Apotheosis Effect: $military_apotheosis_capital_freemen_effect_tt_description$"