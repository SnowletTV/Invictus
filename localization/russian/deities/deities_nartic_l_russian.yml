l_russian:
 deity_sawaserqua:0 "$omen_sawaserqua$" 
 omen_sawaserqua:0 "Савасерква"
 omen_sawaserqua_desc:0 "Более известный как Сосруко, имя Савасерквы может буквально означать «сын удара огненного меча». Считаясь слугой богов, нарт Савасерква — тот, кто украл огонь у великана. Савасерква — самый маленький из нартов, и его часто изображают как нарта-трикстера.\n\n#! Эффект апофеоза: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_batraz:0 "$omen_batraz$"
 omen_batraz:0 "Батраз"
 omen_batraz_desc:0 "Величайший воин нартов, а также их предводитель. По своей роли он сравним с южнокавказским «Амирани». Его меч — важный символ железа и его силы, хотя основное его призвание — быть богом бурь.\n\nВ одной из версий мифа Бартаз родился от Хами, чья жена подарила Хами кистоподобный горящий пузырь на спине, чтобы Бартаз рос на нём, прежде чем уйти. Как только Бартаз родился, всё ещё в огне, нарт Сырдон бросил его в море, где он вырос. Позже Бартаз посетил бога-кузнеца Курдалаегона, который нагрел Бартаза, дав ему силы, а затем щипцами бросил его в море. После этого Бартаз стал жить в небесах, метая грозовые стрелы, чтобы помочь нартam. В жизни им было совершено множество великих подвигов, включая свершение блестящей мести над коварным великаном, сеявшим насилие среди молодёжи нартов. Он также любит хвастовские игры, в которых обычно побеждает. В конечном итоге Бартаз погибнет на пути к мести за смерть своего отца, что привело к гибели многих других нартов.\n\n#! Эффект апофеоза: $military_apotheosis_military_experience_effect_tt_description$\n $heart_attack_apotheosis_effect_tt_description$"

 deity_satanaya:0 "$omen_satanaya$"
 omen_satanaya:0 "Сатаная"
 omen_satanaya_desc:0 "Мать нартов, Сатаная родила многих главных героев, таких как Савасерква, которому она помогла украсть огонь у великана. Как мудрая женщина и матриарх среди нартов, она подавала пример семье, например, ценя воду в истории, где она срывает цветок у реки Гипанис и не может увидеть, как он растёт, пока не прольётся сильный дождь. Она была достаточно хитра, чтобы заключить сделку с солнцем, чтобы продлить длину дня.\n\n#! Эффект апофеоза: $fertility_apotheosis_food_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"

 deity_theshkhue:0 "$omen_theshkhue$" 
 omen_theshkhue:0 "Тешхуэ"
 omen_theshkhue_desc:0 "Считаемый верховным существом, Тешхуэ создал вселенную и установил первозданные законы существования. Люди, ищущие просветления, стремятся следовать его космическим законам, закону Та. Будучи объединителем, он является получателем всех вопросов, но ничего не требует от своего творения взамен.\n\n#! Эффект апофеоза: $theshkhue_apotheosis_effect_tt_description$"

 deity_lady_of_flowing_waters:0 "$omen_lady_of_flowing_waters$" 
 omen_lady_of_flowing_waters:0 "Владычица Текучих Вод"
 omen_lady_of_flowing_waters_desc:0 "Владычица Текучих Вод, богиня воды, обитает в прекрасном белом доме, находящемся в туманном ущелье на глубине озера Меотида. Там она заботится о своих трёх дочерях, женщинах, носящих шкуры голубей, и о своих семи сыновьях. К её дому мог добраться только нарт Пизигаш, когда он ударил по озеру своим мечом, и волны расступились перед ним.\n\n#! Эффект апофеоза: $lady_of_flowing_waters_apotheosis_effect_tt_description$"

 deity_tlepsh:0 "$omen_tlepsh$" 
 omen_tlepsh:0 "Тлепш"
 omen_tlepsh_desc:0 "Кузнец нартов, Тлепш выковал первый в мире серп для уборки урожая, а также острый клинок, способный двигаться самостоятельно и сражаться за него в преклонном возрасте. Шаман, владеющий огнём и металлом, Тлепш сплёл нить между магией и наукой. Он даже искал все знания мира, неся галактику Млечного Пути вместе с богиней, представляющей четыре угла космоса.\n\n#! Эффект апофеоза: $tlepsh_apotheosis_effect_tt_description$"

 deity_pkharmat:0 "$omen_pkharmat$" 
 omen_pkharmat:0 "Пхармат"
 omen_pkharmat_desc:0 "Ещё один из нартов, стремившийся украсть огонь на благо человечества, Пхармат отправился на вершину горы Башлам, чтобы унести огонь, которым жестокий бог Села владел над нартami и их человеческими соратниками. С помощью богини Саты (жены Селы), героя-коня Турпала и своего собственного брата, он взял огонь и принёс его обратно к нартam, чтобы им больше не приходилось есть сырую пищу и пить холодное молоко. За свои подвиги жестокий бог Села приковал его к скале на вершине горы Балшам, используя своего слугу, циклопа Ужу, и Села приказал соколу Ида клевать его печень вечно.\n\n#! Эффект апофеоза: $pkharmat_apotheosis_effect_tt_description$"

 deity_turpal:0 "$omen_turpal$" 
 omen_turpal:0 "Турпал"
 omen_turpal_desc:0 "Конь-герой, на котором Пхармат бежит от гнева бога Селы с украденным огнем в руках, Турпал мог обогнать даже молнии. Его имя просто означает «герой», и это имя было принято детьми нартов с незапамятных времён.\n\n#! Эффект апофеоза: $turpal_apotheosis_effect_tt_description$"

 deity_dische_zhig:0 "$omen_dische_zhig$" 
 omen_dische_zhig:0 "Дише Жиг"
 omen_dische_zhig_desc:0 "Также известное как Золотое Древо, это знаменитое дерево нартов представляет древнее северокавказское почитание деревьев и духов, живущих в них. Помимо своего золотого оттенка, дерево приносит яблоки, наполовину снежно-белые, наполовину багряные. Если женщина съест с белой стороны, у неё родится дочь с волосами белыми, как снег. Если она съест с красной стороны, родится героический мальчик с такими же светлыми волосами. Древо дарует обновление, знание и магию.\n\n#! Эффект апофеоза: $dische_zhig_apotheosis_effect_tt_description$"

 deity_pija:0 "$omen_pija$" 
 omen_pija:0 "Пия"
 omen_pija_desc:0 "Старший из двух сыновей Тatemquo, Пия был великим воином, известным как «тот, кто копьём поражает». В «Сказании о том, как появились Варзамег и Тимис» Пия засыпает под Золотым Древом, Дише Жиг, и не замечает кражи красно-белых яблок с его золотых ветвей. Он известен своими стрелами, которые не промахиваются, и ударами меча, которые неизменно рассекают свою цель, но он не известен как отличный страж.\n\n#! Эффект апофеоза: $military_apotheosis_military_experience_effect_tt_description$"

 deity_pizighash:0 "$omen_pizighash$" 
 omen_pizighash:0 "Пизигаш"
 omen_pizighash_desc:0 "Младший из двух сыновей Тatemquo, Пизигаш — великий воин, известный как «тот, кто отсекает». В «Сказании о том, как появились Варзамег и Тимис» Пизигаш остаётся верным и бдительным стражем под Золотым Древом, Дише Жиг, и встречает трёх голубей, которые крадут красно-белые яблоки, чтобы отнести их на запад к озеру Меотида. Вместе со своим братом он отправляется в погоню и поражает одного из голубей стрелой. Осознав, что голубь на самом деле является дочерью (Мегазаш) Владычицы Текучих Вод в disguise, он исцеляет её и женится на ней, и у них рождается три дочери и три сына, включая героя Варзамега.\n\n#! Эффект апофеоза: $military_apotheosis_manpower_effect_tt_description$"

 deity_zhaqa:0 "$omen_zhaqa$" 
 omen_zhaqa:0 "Жака"
 omen_zhaqa_desc:0 "Конь, на котором ездит злой великан Архон Архож, Жака не имеет себе равных по скорости среди всех живых скакунов. На самом деле конь представляет переход между жизнью и смертью, увозя девушку Пстатину («Дающую Жизнь Мать»). Само имя Жака означает «курган», и поэтому он символизирует переход в цикле жизни и смерти. Ни одно живое существо не может догнать или обогнать его, поскольку ни одно живое существо не может обратить смерть вспять.\n\n#! Эффект апофеоза: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_tetertup:0 "$omen_tetertup$" 
 omen_tetertup:0 "Тетертуп"
 omen_tetertup_desc:0 "Бог войны и кровопролития, Тетертуп был эквивалентом галгайского/гелейского божества Молыз-Ерди или римского Марса. Он наполнял военную дружину силой и энергией, равной по мощи и stature героям нартов, но наиболее широко почитался абасгийскими племенами Северо-Западного хребта пиков Кавкасоса.\n\n#! Эффект апофеоза: $military_apotheosis_manpower_effect_tt_description$"

 deity_theqwafeshu:0 "$omen_theqwafeshu$" 
 omen_theqwafeshu:0 "Теквафешу"
 omen_theqwafeshu_desc:0 "Глашатай объединителя, великого создателя космоса Тешхуэ, Тековафешу действует как носитель его космического закона, проводник его великого плана. Следуя по стопам бога-творца, Тековафешу рассматривается абасгами как знак божественного суда и предстоящего руководства от господина глашатая.\n\n#! Эффект апофеоза: $economy_apotheosis_capital_noble_effect_tt_description$"

 deity_thageledj:0 "$omen_thageledj$" 
 omen_thageledj:0 "Тагеледж"
 omen_thageledj_desc:0 "Бог флоры и урожая, Тагеледж посвятил себя поиску полезных культур, которые могли бы выращивать нарты и другие боги гор, даже в суровых или морозных условиях. Фермеры, как те, кто выращивает для пропитания, так и те, кто выращивает на экспорт, молятся ему о хорошем урожае и об открытии новых, лучших культур в грядущие сезоны.\n\n#! Эффект апофеоза: $fertility_apotheosis_food_effect_tt_description$"

 deity_merise:0 "$omen_merise$" 
 omen_merise:0 "Мерисе"
 omen_merise_desc:0 "Младшее божество и защитница пчёл, Мерисе, как говорят, спасла последнюю выжившую пчелу во время ужасного события среди богов. Вылечив её в своём рукаве, она возродила вид пчёл, и поэтому каждое лето её чтят за её труд, который влияет на жизнь цветов, деревьев и всей природы. Пока она защищала пчёл, её три сестры защищали семейную жизнь, воинов и крестьян.\n\n#! Эффект апофеоза: $merise_apotheosis_effect_tt_description$"

 deity_arkhon_arkhozh:0 "$omen_arkhon_arkhozh$" 
 omen_arkhon_arkhozh:0 "Архон Архож"
 omen_arkhon_arkhozh_desc:0 "Правитель мертвых и подземного мира, Архон Архож — чешуйчатый великан, ездящий на коне Жака. Иногда изображаемый как змея или дракон, его имя означает «старый», «почтенный», «уродливый» или «злой». Он представляет дикую природу человечества и его более животную форму. В историях он крадёт девушку Пстатину, в которую влюблён Варзамег.\n\n#! Эффект апофеоза: $military_apotheosis_manpower_effect_tt_description$"

 deity_theshu:0 "$omen_theshu$" 
 omen_theshu:0 "Тешу"
 omen_theshu_desc:0 "Бог и защитник всадников, Тешу — покровитель горных наездников, пастухов на пастбищах и кочевых воинов, для которых лошади являются средством к существованию — он защищает лошадей в битве так же, как и сохраняет их ноги сильными, пока они тянут телегу или волочат мотыгу по полю.\n\n#! Эффект апофеоза: $military_apotheosis_manpower_effect_tt_description$"

 deity_psetha:0 "$omen_psetha$" 
 omen_psetha:0 "Псета"
 omen_psetha_desc:0 "Богиня жизни и душ, Псета не имеет гуманоидного или даже физического представления в мыслях и молитвах. Она является одним из космогонических божеств и считается частью каждого индивида и его окружения, а не контролирует обособленную часть природного мира. Она поддерживает жизнь, опирающуюся на космические законы Тешхуэ.\n\n#! Эффект апофеоза: $culture_apotheosis_civic_tech_effect_tt_description$"

 deity_sozrech:0 "$omen_sozrech$" 
 omen_sozrech:0 "Созрех"
 omen_sozrech_desc:0 "Бог плодородия, семьи, благополучия и болезней, Созрех владел природными силами ветра и воды, способный как исцелять болезни, так и распространять их через жидкости. Молитва Созреху принесёт счастливую, тёплую и растущую семью без недугов. Попав в немилость, он разрушит даже самый крепкий дом.\n\n#! Эффект апофеоза: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_schyble:0 "$omen_schyble$" 
 omen_schyble:0 "Шибле"
 omen_schyble_desc:0 "Бог грома и молний, Шибле был божеством, которого следовало бояться и перед которым следовало благоговеть из-за его подавляющей силы и власти над самими небесами. Его способности одинаково легко формируют природу битвы и войны, как и судьбу урожая и его сбора. Даже сами леса подчиняются ему, превращаясь в пожары по его прихоти.\n\n#! Эффект апофеоза: $military_apotheosis_capital_freemen_effect_tt_description$"

 deity_hedrixe:0 "$omen_hedrixe$" 
 omen_hedrixe:0 "Хедрикс"
 omen_hedrixe_desc:0 "Защитник умерших, Хедрикс, подобно греческому Аиду, рассматривается как всеобъемлющая сфера и природа мира за пределами, куда направляются все ушедшие души, как герои, так и обычные люди. Он является концептуальным божеством и имеет абстрактную форму, в отличие от антропоморфной фигуры, и существует в противопоставлении Тешхуэ, создателю вселенной и законов, управляющих жизнью.\n\n#! Эффект апофеоза: $hedrixe_apotheosis_effect_tt_description$"

 deity_zchithe:0 "$omen_zchithe$" 
 omen_zchithe:0 "Зчите"
 omen_zchithe_desc:0 "Повелитель ветров, Зчите заставлял голос и слово путешествовать, соединяя людей и всех существ через звук. Поскольку люди верят, что болезни и недуги собираются вокруг плохого воздуха, испорченного злыми силами, к нему обращаются с мольбой, чтобы развеять проклятия и болезни.\n\n#! Эффект апофеоза: $economy_apotheosis_province_improvement_effect_tt_description$"