l_russian:

 deity_sawaserqua:0 "$omen_sawaserqua$" 
 omen_sawaserqua:0 "Сасруква"
 omen_sawaserqua_desc:0 "Возможно, более известный как Сосруко, имя Сасруквы может буквально означать «сын удара огненного меча». Считаясь слугой богов, нарт Сасруква ответственен за кражу огня у великана. Сасруква — самый маленький из нартов, и его часто изображают как нарта-трикстера.\n\n#! Apotheosis Effect: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_batraz:0 "$omen_batraz$"
 omen_batraz:0 "Батрадз"
 omen_batraz_desc:0 "Величайший воин нартов, а также их лидер. Его роль сравнима с южнокавказским «Амирани». Его меч является важным символом железа и его силы, хотя его основная ассоциация — это бог бурь.\n\nВ одной из версий мифа Батрадз родился от Хами, чья жена оставила на спине Хами кистообразный горячий пузырь, в котором рос Батрадз, прежде чем уйти. Как только Батрадз родился, всё еще горящий, нарт Сырдон бросил его в море, где он и вырос. Позже Батрадз посетил бога-кузнеца Курдалегона, который нагрел Батрадза, даровав ему силы, а затем швырнул его в море клещами. После этого Батрадз стал жить на небесах, метая молнии, чтобы помочь нартam. Им было совершено множество великих подвигов, включая свершение glorious мести кривому великану, который сеял насилие среди молодежи нартов. Он также любил игры на хвастовство, в которых обычно побеждал. В конце концов Батрадз погиб на пути к мщению за смерть своего отца, что привело к гибели многих других нартов.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$\n $heart_attack_apotheosis_effect_tt_description$"

 deity_satanaya:0 "$omen_satanaya$"
 omen_satanaya:0 "Сатаней"
 omen_satanaya_desc:0 "Мать нартов, Сатаней родила многих главных героев, таких как Сасруква, которому она помогла украсть огонь у великана. Будучи мудрой женщиной и матриархом среди нартов, она подавала пример семье, например, ценя воду в истории, где она срывает цветок near реки Гипанис и не может увидеть, как он растет, пока не пойдет сильный дождь. Она была достаточно хитра, чтобы заключить сделку с солнцем, чтобы продлить длину дня.\n\n#! Apotheosis Effect: $fertility_apotheosis_food_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"

 deity_theshkhue:0 "$omen_theshkhue$" 
 omen_theshkhue:0 "Тешхуэ"
 omen_theshkhue_desc:0 "Считающийся верховным существом, Тешхуэ сотворил вселенную и установил изначальные законы существования. Люди, ищущие просветления, стремятся следовать его космическим законам, закону Та. Будучи объединителем, он получает все вопросы, но ничего не требует от своего творения взамен.\n\n#! Apotheosis Effect: $theshkhue_apotheosis_effect_tt_description$"

 deity_lady_of_flowing_waters:0 "$omen_lady_of_flowing_waters$" 
 omen_lady_of_flowing_waters:0 "Владычица Текучих Вод"
 omen_lady_of_flowing_waters_desc:0 "Владычица Текучих Вод, богиня воды, resides в прекрасном белом доме, найденном в туманном ущелье на глубине озера Меотида. Там она заботится о своих трех дочерях, женщинах, носящих шкуры голубей, и о своих семи сыновьях. К её дому мог попасть только нарт Пизигаш, когда он ударил озеро своим мечом, и волны parted для него.\n\n#! Apotheosis Effect: $lady_of_flowing_waters_apotheosis_effect_tt_description$"

 deity_tlepsh:0 "$omen_tlepsh$" 
 omen_tlepsh:0 "Тлепш"
 omen_tlepsh_desc:0 "Кузнец нартов, Тлепш создал первый в мире серп для урожая, а также острый клинок, способный двигаться самостоятельно и сражаться за него в его преклонном возрасте. Шаман, владеющий огнем и металлом, Тлепш сплел нить между магией и наукой. Он даже искал все знания мира, неся галактику Млечный Путь вместе с богиней, представляющей четыре угла космоса.\n\n#! Apotheosis Effect: $tlepsh_apotheosis_effect_tt_description$"

 deity_pkharmat:0 "$omen_pkharmat$" 
 omen_pkharmat:0 "Пхармат"
 omen_pkharmat_desc:0 "Еще один из нартов, который стремился украсть огонь на благо человечества, Пхармат отправился на вершину горы Башлам, чтобы похитить огонь, которым жестокий бог Села господствовал над нартamи и их человеческими соотечественниками. С помощью богини Саты (жены Селы), героя-коня Турпала и своего собственного брата, он взял огонь и принес его обратно нартam, чтобы им больше не приходилось есть сырую пищу и пить холодное молоко. За свои подвиги жестокий бог Села приковал его к скале на вершине горы Балшам, используя своего слугу, циклопа Ужа, и Села приказал соколу Ида клевать его печень вечно.\n\n#! Apotheosis Effect: $pkharmat_apotheosis_effect_tt_description$"

 deity_turpal:0 "$omen_turpal$" 
 omen_turpal:0 "Турпал"
 omen_turpal_desc:0 "Герой-конь, на котором Пхармат спасается от гнева бога Селы с украденным огнем в руках, Турпал мог обогнать даже молнии. Его имя просто означает «герой», и его имя было принято детьми нартов с незапамятных времен.\n\n#! Apotheosis Effect: $turpal_apotheosis_effect_tt_description$"

 deity_dische_zhig:0 "$omen_dische_zhig$" 
 omen_dische_zhig:0 "Дише Жиг"
 omen_dische_zhig_desc:0 "Также известное как Золотое Дерево, это знаменитое дерево нартов представляет древнее северокавказское почитание деревьев и духов, живущих в них. Помимо своего золотого оттенка, дерево приносит яблоки, наполовину снежно-белые, наполовину багровые. Если женщина съест часть с белой стороны, у неё родится дочь с волосами белыми, как снег. Если она съест с красной стороны, родится героический мальчик с такими же бледными волосами. Дерево дарует обновление, знание и магию.\n\n#! Apotheosis Effect: $dische_zhig_apotheosis_effect_tt_description$"

 deity_pija:0 "$omen_pija$" 
 omen_pija:0 "Пия"
 omen_pija_desc:0 "Старший из двух сыновей Татемкуо, Пия был великим воином, известным как «тот, кто пронзает копьем». В «Сказании о том, как появились Варзамег и Тимис», Пия засыпает под Золотым Деревом, Дише Жиг, и не замечает кражи красно-белых яблок с его золотых ветвей. Он славится стрелами, которые не промахиваются, и ударами меча, которые неизменно рассекают цель, но он не известен как отличный страж.\n\n#! Apotheosis Effect: $military_apotheosis_military_experience_effect_tt_description$"

 deity_pizighash:0 "$omen_pizighash$" 
 omen_pizighash:0 "Пизигаш"
 omen_pizighash_desc:0 "Младший из двух сыновей Татемкуо, Пизигаш — великий воин, известный как «тот, кто отсекает». В «Сказании о том, как появились Варзамег и Тимис», Пизигаш остается верным и бдительным стражем под Золотым Деревом, Дише Жиг, и встречает трех голубок, которые крадут красно-белые яблоки, чтобы унести их на запад к озеру Меотида. Вместе со своим братом он отправляется в погоню и стреляет в одну из голубок стрелой. Осознав, что голубка на самом деле дочь (Мегхазаш) Владычицы Текучих Вод под видом, он исцеляет её и женится на ней, и у них рождается три дочери и три сына, включая героя Варзамега.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"

 deity_zhaqa:0 "$omen_zhaqa$" 
 omen_zhaqa:0 "Жакуа"
 omen_zhaqa_desc:0 "Конь, на котором ездит злой великан, Архон Архож, Жакуа не имеет равных по скорости среди всех живых скакунов. На самом деле, конь представляет переход между жизнью и смертью, унося деву Псатину («Жизнедающая Мать»). Имя самого Жакуа означает «курган», и поэтому он символизирует переход в цикле жизни и смерти. Ни одно живое существо не может догнать его или обогнать, поскольку ни одно живое существо не может превозмочь смерть.\n\n#! Apotheosis Effect: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_tetertup:0 "$omen_tetertup$" 
 omen_tetertup:0 "Тетерту"
 omen_tetertup_desc:0 "Бог войны и кровопролития, Тетерту был эквивалентом галгайского/гелайского божества Молыз-Ерди или римского Марса. Он наполнял дружину силой и энергией, равной по мощи и stature героям-нартaм, но ему поклонялись наиболее широко абазгские племена северо-западного хребта пиков Кавкасоса.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"

 deity_theqwafeshu:0 "$omen_theqwafeshu$" 
 omen_theqwafeshu:0 "Текуафешу"
 omen_theqwafeshu_desc:0 "Вестник объединителя, великого творца космоса, Тешхуэ, Текуафешу выступает как носитель его космического закона, передатчик его великого плана. По стопам бога-творца, Текуафешу почитается абасгоi как знак божественного суда и грядущего руководства от хозяина вестника.\n\n#! Apotheosis Effect: $economy_apotheosis_capital_noble_effect_tt_description$"

 deity_thageledj:0 "$omen_thageledj$" 
 omen_thageledj:0 "Тхагеледж"
 omen_thageledj_desc:0 "Бог флоры и посевов, Тхагеледж посвятил себя поиску wholesome посевов, которые нартa и другие боги гор могли бы выращивать даже в суровых или морозных условиях. Фермеры, как те, кто выращивает для пропитания, так и те, кто выращивает на экспорт, молятся ему о хорошем урожае и об открытии новых, лучших посевов в грядущих сезонах.\n\n#! Apotheosis Effect: $fertility_apotheosis_food_effect_tt_description$"

 deity_merise:0 "$omen_merise$" 
 omen_merise:0 "Мерисе"
 omen_merise_desc:0 "Малое божество и защитница пчел, Мерисе, как говорят, спасла последнюю выжившую пчелу во время ужасного события среди богов. Вылечив её в своем рукаве, она возродила вид пчел, и поэтому её празднуют каждое лето за её работу, которая влияет на жизнь цветов, деревьев и всей природы. Пока она защищала пчел, её три сестры защищали семейную жизнь, воинов и крестьян.\n\n#! Apotheosis Effect: $merise_apotheosis_effect_tt_description$"

 deity_arkhon_arkhozh:0 "$omen_arkhon_arkhozh$" 
 omen_arkhon_arkhozh:0 "Архон Архож"
 omen_arkhon_arkhozh_desc:0 "Правитель мертвых и подземного мира, Архон Архож — чешуйчатый великан, ездящий на коне Жакуа. Иногда изображаемый в виде змеи или дракона, его имя означает «старый», «почтенный», «безобразный» или «злой». Он представляет дикую природу человечества и его более animalistic форму. В историях он крадет деву Псатину, в которую влюблен Варзамег.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"

 deity_theshu:0 "$omen_theshu$" 
 omen_theshu:0 "Тешу"
 omen_theshu_desc:0 "Бог и покровитель всадников, Тешу является покровителем горных всадников, пастухов на пастбищах и кочевых воинов, для которых лошади — средство к существованию — он защищает лошадей в битве так же, как и сохраняет их ноги сильными, пока они тянут телегу или тащат мотыгу через поле.\n\n#! Apotheosis Effect: $military_apotheosis_manpower_effect_tt_description$"

 deity_psetha:0 "$omen_psetha$" 
 omen_psetha:0 "Псета"
 omen_psetha_desc:0 "Богиня жизни и душ, Псета не имеет человекоподобного или даже физического представления в мыслях и молитвах. Она одно из космогонических божеств и считается частью каждого индивида и его окружения, а не контролирует compartmentalized часть природного мира. Она поддерживает жизнь, поддерживаемую космическими законами Тешхуэ.\n\n#! Apotheosis Effect: $culture_apotheosis_civic_tech_effect_tt_description$"

 deity_sozrech:0 "$omen_sozrech$" 
 omen_sozrech:0 "Созреш"
 omen_sozrech_desc:0 "Бог плодородия, семьи, благополучия и болезней, Созреш повелевал природными силами ветра и воды, способный исцелять болезни так же, как и распространять их через жидкости. Молитва Созрешу принесла бы счастливую, теплую и растущую семью без болезней. Разозлить его значило бы разрушить даже самый хорошо построенный дом.\n\n#! Apotheosis Effect: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_schyble:0 "$omen_schyble$" 
 omen_schyble:0 "Шибле"
 omen_schyble_desc:0 "Бог грома и молнии, Шибле был божеством, которого следует бояться и которым следует восхищаться за его подавляющую мощь и власть над самими небесами. Его способности формируют природу битвы и войны так же легко, как судьбу посевов и их урожая. Сами леса покоряются ему, сгорая в огненных ландшафтах по его воле.\n\n#! Apotheosis Effect: $military_apotheosis_capital_freemen_effect_tt_description$"

 deity_hedrixe:0 "$omen_hedrixe$" 
 omen_hedrixe:0 "Хедрице"
 omen_hedrixe_desc:0 "Покровитель мертвых, Хедрице, подобно греческому Аиду, рассматривается как всеобъемлющее царство и природа мира за пределами, куда направляются все ушедшие души, как герои, так и простые люди. Он концептуальное божество и имеет абстрактную форму, в отличие от антропоморфной фигуры, и существует в оппозиции к Тешхуэ, создателю вселенной и законам, управляющим жизнью.\n\n#! Apotheosis Effect: $hedrixe_apotheosis_effect_tt_description$"

 deity_zchithe:0 "$omen_zchithe$" 
 omen_zchithe:0 "Зчитхе"
 omen_zchithe_desc:0 "Повелитель ветров, Зчитхе заставил голос и слово путешествовать, соединяя людей и всех существ через звук. Поскольку люди верят, что болезнь и недуги собираются вокруг плохого воздуха, испорченного злыми силами, к нему обращаются с мольбой, чтобы он сдул проклятия и болезни.\n\n#! Apotheosis Effect: $economy_apotheosis_province_improvement_effect_tt_description$"