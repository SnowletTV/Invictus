### DHE Achaean League
 # Events

 dhe_achaean_league.1.t:0 "Приглашения в Ахейский союз"
 dhe_achaean_league.1.desc:0 "Многие враги хотели бы видеть народ Греции живущим в рабстве, но пока дыхание наполняет наши легкие, мы будем сражаться против врагов свободы! Слишком долго над нами тяготело наследие Филиппа и Александра. Пусть греки объединятся, чтобы противостоять наследникам! Ахейский союз станет оплотом против иностранных интриг вмешивающихся генералов и царей. Пора разослать наших вестников, пригласив каждый народ в Ахайе и Аркадии присоединиться к нам в общей обороне. Мы также должны решить, просить ли золото или людей у наших новых союзников."
 dhe_achaean_league.1.a:0 "Они должны открыть свои сокровищницы."
 dhe_achaean_league.1.at:0 "Каждый народ в #Y Ахайе#! и соседней #Y Аркадии#! будет приглашен присоединиться к нашему союзу; они могут предоставить золото для пополнения нашей военной казны"
 dhe_achaean_league.1.b:0 "Участников попросят прислать воинов для пополнения наших рядов."
 dhe_achaean_league.1.bt:0 "Каждый народ в #Y Ахайе#! и соседней #Y Аркадии#! будет приглашен присоединиться к нашему союзу; они могут предоставить людей для защиты наших интересов"

 dhe_achaean_league.2.t:0 "Приглашение в Ахейский союз"
 dhe_achaean_league.2.desc:0 "Ахейский союз направил нам приглашение, предложив присоединиться к ним в общей обороне от внешних угроз. Хотя идея единства среди греческих государств заманчива, есть и другие державы, к которым мы могли бы обратиться за защитой."
 dhe_achaean_league.2.a:0 "Греки вместе сильны!"
 dhe_achaean_league.2.at:0 ""
 dhe_achaean_league.2.b:0 "Мы останемся независимыми."
 dhe_achaean_league.2.bt:0 ""
 dhe_achaean_league.2.c:0 "Птолемеи защитят нас."
 dhe_achaean_league.2.ct:0 "Мы ищем защиты у египтян на юге"
 dhe_achaean_league.2.d:0 "Ахейский союз? Какая прекрасная идея!"
 dhe_achaean_league.2.dt:0 "#G Мы аннексируем все земли, которыми в настоящее время владеет #E Ахайя#!, и унаследуем всех вассалов #E Ахайи#!#!"

 dhe_achaean_league.3.t:0 "Города Ахайи и Аркадии присоединяются к союзу"
 dhe_achaean_league.3.desc:0 "После тщательного обсуждения города Ахайи и Аркадии ответили на наше приглашение. Многие добровольно решили присоединиться к нашему союзу, осознав силу единства перед лицом иностранных угроз. Делегаты из этих городов теперь прибыли в [ROOT.GetCountry.GetCapital.GetName], стремясь оформить свое членство в #E Ахейском союзе#! и обсудить будущее нашей общей обороны. Их вклад обеспечит нам лучшую защиту гарнизонов наших городов против общих врагов в трудные времена."
 dhe_achaean_league.3.a:0 "Мы примем их с распростертыми объятиями!"
 dhe_achaean_league.3.tt:0 "#E Ахайя#! получает ряд вассалов, которые смотрят на нас как на лидеров" 

 dhe_achaean_league.4.t:0 "[aratus_scope.GetName] из [GetProvince('(int32)8003').GetName]"
 dhe_achaean_league.4.desc:0 "Когда её муж, [GetCharacter('(int32)522').GetName], был убит, [GetCharacter('(int32)523').GetName] взяла командование его войсками, с которыми её доброта сделала её чрезвычайно популярной. Когда сикионцы, надеясь на легкую победу над женщиной, атаковали гарнизон, пытаясь установить независимое правительство, она подавила мятеж и распяла тридцать мятежников. [GetCharacter('(int32)523').GetPraenomen] правила в [GetProvince('(int32)8003').GetName] и [GetProvince('(int32)418').GetName] шесть лет, пока не передала города Птолемею. С тех пор [GetProvince('(int32)8003').GetName] боролся, чтобы освободиться от тиранов.\n\n[aratus_scope.GetName] из [GetProvince('(int32)8003').GetName], известный государственный деятель и полководец, привел свой город в Ахейский союз. Известный своей хитрой дипломатией и военным мастерством, [aratus_scope.GetPraenomen] освободил [GetProvince('(int32)8003').GetName] от тирании и провозглашен защитником греческой свободы. С таким выдающимся лидером теперь в наших рядах многие в [ROOT.GetCountry.GetCapital.GetName] призывают сделать его #E Стратегом#! #E Ахейского союза#!."
 dhe_achaean_league.4.a:0 "[aratus_scope.GetName] рожден править."
 dhe_achaean_league.4.b:0 "У стратега должно быть больше опыта"
 dhe_achaean_league.4.bt:0 "Ничего не происходит"

 dhe_achaean_league.5.t:0 "[former_subject.GetName] присоединяется к Ахейскому союзу"
 dhe_achaean_league.5.desc:0 "[former_subject.GetName], ранее находившийся под нашей защитой, решил присоединиться к #E Ахейскому союзу#!. Они разорвали свои связи с нами и посвятили себя этому новому альянсу, ища безопасности в единстве со своими собратьями на Пелопоннесе."
 dhe_achaean_league.5.a:0 "Крайне прискорбно."
 dhe_achaean_league.5.b:0 "[former_subject.GetName] должен быть освобожден от демагогии!"
 dhe_achaean_league.5.tt:0 "#R [former_subject.GetName] больше не наш вассал#!"

 dhe_achaean_league.6.t:0 "Взятие Коринфа"
 dhe_achaean_league.6.desc:0 "[GetProvince('(int32)418').GetName] когда-то был одним из величайших городов-государств Греции, стоявшим на границе между Аттикой и Пелопоннесом. Когда другие города-государства объединялись в союзы и лиги, чтобы сражаться друг с другом, Коринф упрямо держался своей независимости. Во время войн диадохов древний город-государство превратился не более чем в укрепленную крепость для македонских войск, став самой стратегически важной оборонительной позицией в регионе.\n\nНаша борьба с потомками [GetCharacter('(int32)9').GetPraenomen] за контроль над Грецией продолжается, но [aratus_scope.GetName] наконец изгнал македонский гарнизон из города [GetProvince('(int32)418').GetName], и наши войска теперь маршируют по его улицам."
 dhe_achaean_league.6.a:0 "Над Акрокоринфом будет развеваться ахейское знамя!"

### EVENT: The Achaean League in Abeyance  ###

 dhe_achaean_league.7.t:0 "Ахейский союз в подвешенном состоянии"
 dhe_achaean_league.7.desc:0 "Это дни глубокой неопределенности. Со смерти Александра македонские цари и местные сильные люди задушили Пелопоннес гарнизонами и тираниями. Даже наши собственные Керинея и Бура теперь находятся в руках демагогов. Советы союза больше не достигают кворума, и поэтому его указы не могут быть ратифицированы.\n\n Некоторые утверждают, что койнон следует временно приостановить. Они говорят, что мудрее сохранить то единство, что осталось, чем позволить нашему союзу быть развращенным иностранными марионетками. Другие настаивают, что койнон должен выстоять, какой бы ни была цена. Если мы приостановим наши институты, каждый свободный город должен будет защищаться сам, пока не вернется более светлый час."
 dhe_achaean_league.7.tt:0 "Решение #E Восстановить #Y Ахейский союз#!#! станет доступно через #G #E 10 лет#!#!"
 dhe_achaean_league.7.a:0 "Пусть Эгион плывет своим курсом."
 dhe_achaean_league.7.b:0 "Патры выглядят перспективно."
 dhe_achaean_league.7.c:0 "Дим подойдет."
 dhe_achaean_league.7.d:0 "В Сикионе есть сила"
 dhe_achaean_league.7.e:0 "Трон Пеллены — мой!"
 dhe_achaean_league.7.f:0 "Мы переживем бурю вместе."
 dhe_achaean_league.7.AIG.TT:0 "#Y #E Эгион#!#! становится #T вассалом#! #E @[AIG_overlord.GetFlag]! [AIG_overlord.GetAdjective]#!"
 dhe_achaean_league.7.PTA.TT:0 "#Y #E Патры#!#! становятся #T Независимыми#!"
 dhe_achaean_league.7.DYM.TT:0 "#Y #E Дим#!#! становится #T Независимым#!"
 dhe_achaean_league.7.SIC.TT:0 "#Y #E Сикион#!#! становится #T Независимым#!"
 dhe_achaean_league.7.PLE.TT:0 "#Y #E Пеллена#!#! становится #T Независимой#!"

