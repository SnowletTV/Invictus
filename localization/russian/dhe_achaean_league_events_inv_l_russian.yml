### EVENT: The Arcadian League in Abeyance  ###

 flavor_arcadia.1.t:0 "Аркадийский союз в подвешенном состоянии"
 flavor_arcadia.1.desc:0 "Это дни глубокой неопределенности. Со смерти Александра македонские цари и местные сильные люди задушили Пелопоннес гарнизонами и тираниями. Даже наш собственный Орхомен теперь находится в руках Стромбиха. Советы союза больше не достигают кворума, и поэтому его указы не могут быть ратифицированы.\n\n Некоторые утверждают, что койнон следует временно приостановить. Они говорят, что мудрее сохранить то единство, что осталось, чем позволить нашему союзу быть развращенным иностранными марионетками. Другие настаивают, что койнон должен выстоять, какой бы ни была цена. Если мы приостановим наши институты, каждый свободный город должен будет защищаться сам, пока не вернется более светлый час."
 flavor_arcadia.1.tt:0 "Решение #E Восстановить #Y Аркадийский союз#!#! станет доступно через #G #E 10 лет#!#!"
 flavor_arcadia.1.a:0 "Пусть Мантинея плывет своим курсом."
 flavor_arcadia.1.b:0 "Азания выглядит перспективно."
 flavor_arcadia.1.c:0 "Герея подойдет."
 flavor_arcadia.1.d:0 "В Трифилии мы одержим триумф."
 flavor_arcadia.1.e:0 "Стимфал будет нашим убежищем."
 flavor_arcadia.1.f:0 "Мы переживем бурю вместе."
 flavor_arcadia.1.g:0 "Только Мегалополь обладает силой, чтобы защитить нас."
 flavor_arcadia.1.MTE.TT:0 "#Y #E Мантинея#!#! становится #T Независимой#!"
 flavor_arcadia.1.AZA.TT:0 "#Y #E Азания#!#! становится #T Независимой#!"
 flavor_arcadia.1.HRA.TT:0 "#Y #E Герея#!#! становится #T Независимой#!"
 flavor_arcadia.1.TPA.TT:0 "#Y #E Трифилия#!#! становится #T Независимой#!"
 flavor_arcadia.1.STP.TT:0 "#Y #E Стимфал#!#! становится #T Независимым#!"

