l_russian:
# Events
 dhe_dde_pyrrhus.1.t:0 "Молосский ультиматум"
 dhe_dde_pyrrhus.1.desc_1:1 "В Эпире власть зависит от поддержки молоссов — сильнейшего эпиротского племени.\n\nОтец Пирра, царь Эакид, поддержал детей Александра Великого против Кассандра, но был свергнут молоссами, недовольными войной. Они заменили Эакида его двоюродным братом Неоптолемом III, а младенец Пирр был увезен ко двору соседнего тавлантского царя Главкия ради его безопасности.\n\nПозже Эакид ненадолго вернул трон, но пал в битве с Македонией в 441 году. Его брат Алкет II затем взял власть, но в конце концов был казнен молоссами за свои провалы и излишества, после чего Главкий воспользовался возможностью и короновал Пирра в 447 году.\n\nМолоссы по-прежнему поддерживают Неоптолема III, а не Пирра; царя, навязанного им иностранной державой..."
 dhe_dde_pyrrhus.1.desc_2:1 "В Эпире власть зависит от поддержки молоссов — сильнейшего эпиротского племени.\n\nОтец Пирра, царь Эакид, поддержал детей Александра Великого, но был свергнут молоссами, недовольными войной. Они заменили Эакида его двоюродным братом Неоптолемом III, а младенец Пирр был увезен ко двору соседнего тавлантского царя Главкия ради его безопасности.\n\nПозже Эакид ненадолго вернул трон, но пал в битве с Македонией в 441 году. Его брат Алкет II затем взял власть, но в конце концов был казнен молоссами за свои провалы и излишества, после чего Главкий воспользовался возможностью и короновал Пирра в 447 году.\n\nМолоссы предпочли бы правителя, которого они поддерживают, а не Пирра; царя, навязанного им иностранной державой..."
 dhe_dde_pyrrhus.1.a:0 "Возвести [SCOPE.sChar('neoptolemus').GetPraenomen], чтобы сохранить мир."
 dhe_dde_pyrrhus.1.at:0 "#R Пирр будет свергнут и обратится к одному из диадохов за поддержкой своих притязаний.#!"
 dhe_dde_pyrrhus.1.b:0 "Притязания Пирра законны."
 
 dhe_dde_pyrrhus.2.t:0 "Пирр Эпирский"
 dhe_dde_pyrrhus.2.desc_1:0 "Юный царь Пирр Эпирский, недавно возведенный на престол нашим царем Главкием, был свергнут эпиротским племенем молоссов и заменен [SCOPE.sChar('neoptolemus').GetName].\n\nС тех пор Пирр ищет поддержки одного из диадохов, чтобы отстоять свои притязания на трон в обмен на свою службу и дружбу, но никаких предложений пока не поступало.\n\nПризнавая нашу давнюю дружбу с Пирром и его долг перед нами, мы должны позволить ему служить нашему делу."
 dhe_dde_pyrrhus.2.desc_2:0 "Юный царь Пирр, недавно возведенный на трон Эпира своим приемным отцом, царем тавлантов Главкием, был свергнут могущественным эпиротским племенем молоссов и заменен [SCOPE.sChar('neoptolemus').GetName].\n\nЭто уже второй раз, когда Пирр вынужден бежать из своей страны, и на этот раз он просит нашей поддержки. Он посвятил себя нашему делу, чтобы мы могли использовать его таланты, которые, как говорят, соперничают с величайшими царями Эпира и Македонии, пока он не сможет вернуться в Эпир как наш вечно благодарный друг."
 dhe_dde_pyrrhus.2.desc_3:0 "Юный царь Пирр, недавно возведенный на трон Эпира своим приемным отцом, царем тавлантов Главкием, был свергнут могущественным эпиротским племенем молоссов и заменен [SCOPE.sChar('neoptolemus').GetName].\n\nЭто уже второй раз, когда Пирр вынужден бежать из своей страны, и он ищет поддержки могущественного союзника для возвращения трона Эпира. Он приходит к нам как родственник через брак с династией [SCOPE.GetRootScope.GetCountry.GetRuler.GetFamilyDisplayAdjective].\n\nОн посвятил себя нашему делу, чтобы мы могли использовать его таланты, которые, как говорят, соперничают с великими царями Эпира и Македонии, пока он не сможет вернуться в Эпир как наш вечно благодарный друг."
 dhe_dde_pyrrhus.2.desc_4:0 "Юный царь Пирр, недавно возведенный на трон Эпира своим приемным отцом, царем тавлантов Главкием, был свергнут могущественным эпиротским племенем молоссов и заменен [SCOPE.sChar('neoptolemus').GetName].\n\nЭто уже второй раз, когда Пирр вынужден бежать из своей страны, и он ищет поддержки могущественного союзника для возвращения трона Эпира.\n\nОн посвятил себя нашему делу, чтобы мы могли использовать его таланты, которые, как говорят, соперничают с великими царями Эпира и Македонии, пока он не сможет вернуться в Эпир как наш вечно благодарный друг."
 dhe_dde_pyrrhus.2.a:0 "Он получит нашу поддержку."
 dhe_dde_pyrrhus.2.b:0 "Мы не благотворительная организация."
 dhe_dde_pyrrhus.2.yes.ct:0 "Пирр будет в нашем распоряжении, пока не обеспечит себе поддержку для возвращения в Эпир.\nЭпир потеряет #R -50#! к мнению о нас."
 dhe_dde_pyrrhus.2.no.ct:0 "#R Пирр будет искать поддержки у другого диадоха.#!"
 
 dhe_dde_pyrrhus.3.t:0 "Подвиги Пирра"
 dhe_dde_pyrrhus.3.desc_1:0 "С момента своего прибытия Пирр сумел впечатлить государственных чиновников и солдат alike своим воинским мастерством и острым умом. Его способности во главе армии не вызывают сомнений, но именно его талант завоевывать любовь своих войск, соперничающий даже с Александром Завоевателем, принес ему славу. Трудно отвергнуть его заявленное происхождение от героя Ахилла.\n\nМы можем гордиться качеством воспитания, которое дали ему царь Главкий и Бероя, даже если он был вынужден снова вернуться в Тавлантию.\n\nУ Пирра также была возможность провести время со старыми друзьями и завести новых, и он уже на пути к тому, чтобы обеспечить себе сторонников для запланированного возвращения в Эпир."
 dhe_dde_pyrrhus.3.desc_2:0 "Пирр проявил себя при дворе замечательно, впечатляя мужчин и женщин alike своим воинским мастерством и атлетизмом. У него природный талант очаровывать нужных людей, и в столице у него множество поклонниц. Трудно отвергнуть его заявленное происхождение от героя Ахилла.\n\nМы можем гордиться качеством воспитания, которое дали ему царь Главкий и Бероя, даже если он был вынужден снова вернуться в Тавлантию.\n\nУ него была возможность провести время со старыми друзьями и завести новых, и он уже на пути к тому, чтобы обеспечить себе сторонников для запланированного возвращения в Эпир, хотя до его отъезда пройдет еще некоторое время."
 dhe_dde_pyrrhus.3.desc_3:2 "С момента своего прибытия Пирр сумел впечатлить государственных чиновников и солдат alike своим воинским мастерством и острым умом. Его способности во главе армии не вызывают сомнений, но именно его талант завоевывать любовь своих войск, соперничающий даже с Александром Завоевателем, принес ему славу.\n\nОднако Пирр согласился отправиться в [SCOPE.sC('pyrrhus_second_country_scope').GetName] в рамках нашего мирного договора, в знак нашей доброй воли и для поддержания перемирия."
 dhe_dde_pyrrhus.3.desc_4:1 "Пирр проявил себя при дворе замечательно, впечатляя мужчин и женщин alike своим воинским мастерством и атлетизмом. У него природный талант очаровывать нужных людей, и в столице у него множество поклонниц. Трудно отвергнуть его заявленное происхождение от героя Ахилла.\n\nОднако Пирр согласился отправиться в [SCOPE.sC('pyrrhus_second_country_scope').GetName] в рамках нашего мирного договора, в знак нашей доброй воли и для поддержания перемирия."
 dhe_dde_pyrrhus.3.desc_5:0 "С момента своего прибытия Пирр сумел впечатлить государственных чиновников и солдат alike своим воинским мастерством и острым умом. Его способности во главе армии не вызывают сомнений, но именно его талант завоевывать любовь своих войск, соперничающий даже с Александром Завоевателем, принес ему известность. Трудно отвергнуть его заявленное происхождение от героя Ахилла.\n\nУ Пирра также была возможность завести много друзей, и он уже на пути к тому, чтобы обеспечить себе сторонников для запланированного возвращения в Эпир."
 dhe_dde_pyrrhus.3.desc_6:0 "Пирр проявил себя при дворе замечательно, впечатляя мужчин и женщин alike своим воинским мастерством и атлетизмом. У него природный талант очаровывать нужных людей, и в столице у него множество поклонниц. Трудно отвергнуть его заявленное происхождение от героя Ахилла.\n\nУ Пирра также была возможность завести много друзей, и он уже на пути к тому, чтобы обеспечить себе сторонников для запланированного возвращения в Эпир."
 dhe_dde_pyrrhus.3.a:0 "Зевс будет хранить его."
 dhe_dde_pyrrhus.3.at:0 "Пирр переедет ко двору [SCOPE.sC('pyrrhus_second_country_scope').GetName]."
 
 dhe_dde_pyrrhus.4.t:0 "Отъезд Пирра"
 dhe_dde_pyrrhus.4.desc_1:0 "Пришло время Пирру покинуть Тавлантию, вернуться домой и вновь отвоевать трон Эпира. По нему будут сильно скучать все: от молодых воинов, с которыми он тренировался, до прекрасных дев, что наблюдали за ним, и, конечно же, всех тех, кого он развлекал на пирах своим острым умом и рассудительностью. К сожалению, переубедить его невозможно; Пирр знает, где его судьба.\n\nЕму удалось заручиться поддержкой воинов, с которыми он подружился, и обеспечить финансовую помощь от заинтересованных сторон.\n\nПоддержав Пирра напрямую, мы могли бы обеспечить хорошие отношения с Эпиром после того, как он займет трон, и укрепить его силы..."
 dhe_dde_pyrrhus.4.desc_2:0 "Пришло время Пирру покинуть Тавлантию, вернуться домой и вновь отвоевать трон Эпира. По нему будут сильно скучать все, особенно солдаты, которыми он командовал и которых должен оставить, и, конечно же, все те, кого он развлекал на пирах своим острым умом и рассудительностью. К сожалению, переубедить его невозможно; Пирр знает, где его судьба.\n\nЕму удалось заручиться поддержкой воинов, с которыми он подружился, и обеспечить финансовую помощь от заинтересованных сторон.\n\nПоддержав Пирра напрямую, мы могли бы обеспечить хорошие отношения с Эпиром после того, как он займет трон, и укрепить его силы..."
 dhe_dde_pyrrhus.4.desc_3:0 "С момента своего прибытия Пирр чудесным образом завоевал расположение почти всего двора. Мы не можем отрицать его грацию, остроумие и обаяние, а также влияние, которое он имеет на всех, кого встречает, — от молодых воинов, с которыми он тренируется, до прекрасных дев, что наблюдают за ним.\n\nВ свете складывающейся политической ситуации у него мало причин оставаться в [SCOPE.sC('pyrrhus_second_country_scope').GetName], и он собрал достаточно поддержки, чтобы вернуться домой и вновь отвоевать трон Эпира. Переубедить его невозможно; Пирр знает, где его судьба.\n\nОн склонил на свою сторону воинов, с которыми подружился, и обеспечил финансовую помощь от заинтересованных сторон. Поддержав Пирра напрямую, мы могли бы обеспечить хорошие отношения с Эпиром после того, как он займет трон, и укрепить его силы..."
 dhe_dde_pyrrhus.4.desc_4:0 "Пришло время Пирру вернуться домой и отвоевать трон Эпира. По нему будут сильно скучать все: от молодых воинов, с которыми он тренировался, до прекрасных дев, что наблюдали за ним, и, конечно же, всех тех, кого он развлекал на пирах своим острым умом и рассудительностью. Переубедить его невозможно; Пирр знает, где его судьба.\n\nЕму удалось заручиться поддержкой воинов, с которыми он подружился, и обеспечить финансовую помощь от заинтересованных сторон.\n\nПоддержав Пирра напрямую, мы могли бы обеспечить хорошие отношения с Эпиром после того, как он займет трон, и укрепить его силы..."
 dhe_dde_pyrrhus.4.desc_5:0 "Пришло время Пирру вернуться домой и вновь отвоевать трон Эпира. По нему будут сильно скучать все, особенно солдаты, которыми он командовал и которых должен оставить, и, конечно же, все те, кого он развлекал на пирах своим острым умом и рассудительностью. К сожалению, переубедить его невозможно; Пирр знает, где его судьба.\n\nЕму удалось заручиться поддержкой воинов, с которыми он подружился, и обеспечить финансовую помощь от заинтересованных сторон.\n\nПоддержав Пирра напрямую, мы могли бы обеспечить хорошие отношения с Эпиром после того, как он займет трон, и укрепить его силы..."
 dhe_dde_pyrrhus.4.a:0 "Он станет могущественным союзником."
 dhe_dde_pyrrhus.4.at:0 "Пирр вернется в Эпир с дополнительными войсками и средствами.\nЭпир получит #G 100#! к мнению о [SCOPE.sC('pyrrhus_second_country_scope').GetName]\n[SCOPE.sC('pyrrhus_second_country_scope').GetName] получит #G 100#! к мнению об Эпире"
 dhe_dde_pyrrhus.4.b:0 "Оказать ему полную поддержку."
 dhe_dde_pyrrhus.4.bt:0 "Пирр вернется в Эпир с дополнительными войсками и средствами.\nЭпир получит #G 100#! к мнению о [SCOPE.sC('pyrrhus_second_country_scope').GetName]\n[SCOPE.sC('pyrrhus_second_country_scope').GetName] получит #G 100#! к мнению об Эпире."
 dhe_dde_pyrrhus.4.c:0 "Его амбиции нас не касаются..."
 dhe_dde_pyrrhus.4.ct:0 "Пирр вернется в Эпир без нашей поддержки, что ухудшит наши отношения с новым царем Эпира."

 dhe_dde_pyrrhus.5.t:0 "Возвращение Пирра"
 dhe_dde_pyrrhus.5.desc_1:0 "После многих лет за границей свергнутый царь Пирр, сын Эакида, вернулся в Эпир с позором. Он отрекается от трона, украденного у него молоссами, при условии, что сможет вернуться ко двору как член эпиротской царской семьи.\n\nПохоже, не сумев заручиться поддержкой иностранной державы, Пирр некоторое время провел при дворе [SCOPE.sC('pyrrhus_fallback_scope').GetName], но решил покинуть чужие земли и вернуться домой, когда стало ясно, что собрать поддержку ему не удалось.\n\nУ него сильные притязания, и он определенно не глупец; возможно, его коронация подходит нашей ситуации..."
 dhe_dde_pyrrhus.5.desc_2:0 "После многих лет за границей свергнутый царь Пирр, сын Эакида, вернулся в Эпир. Он требует трон, украденный у него молоссами.\n\nПохоже, не сумев заручиться поддержкой ни одного из диадохов, Пирр во второй раз нашел убежище у тавлантов, где обрел сторонников и средства.\n\nУ нас нет иного выбора, кроме как уступить его требованиям; даже молоссы согласны, что он станет гораздо лучшим правителем, а армия стоит за ним."
 dhe_dde_pyrrhus.5.desc_3:0 "После многих лет за границей свергнутый царь Пирр, сын Эакида, вернулся в Эпир. Он требует трон, украденный у него молоссами.\n\nПохоже, несмотря на неспособность заручиться прямой поддержкой какого-либо диадоха, Пирр провел время при многих дворах, собирая средства и вдохновляя последователей.\n\nУ нас нет иного выбора, кроме как уступить его требованиям; даже молоссы согласны, что он станет гораздо лучшим правителем, а армия стоит за ним."
 dhe_dde_pyrrhus.5.desc_4:1 "После многих лет за границей свергнутый царь Пирр, сын Эакида, вернулся в Эпир. Он требует трон, украденный у него молоссами.\n\nПохоже, Пирру удалось заручиться прямой поддержкой диадоха [SCOPE.sC('pyrrhus_second_country_scope').GetName], который предоставил ему средства и войска для экспедиции в Эпир.\n\nУ нас нет иного выбора, кроме как уступить его требованиям; даже молоссы согласны, что он станет гораздо лучшим правителем, а армия стоит за ним."
 dhe_dde_pyrrhus.5.a:0 "Слава царю Пирру."
 dhe_dde_pyrrhus.5.b:0 "Слава царю Пирру."
 dhe_dde_pyrrhus.5.c:0 "Он не будет царем."
 dhe_dde_pyrrhus.5.d:0 "Заприте предателя."
 dhe_dde_pyrrhus.5.at:0 "Эпир и [SCOPE.sC('pyrrhus_second_country_scope').GetName] получат #G 100#! к мнению друг о друге.\nЭпир получит несколько отрядов #Y Тяжелой пехоты#!."
 dhe_dde_pyrrhus.5.bt:0 "Эпир и [SCOPE.sC('pyrrhus_second_country_scope').GetName] получат #G 100#! к мнению друг о друге.\nЭпир получит несколько отрядов #Y Тяжелой пехоты#! и один отряд #Y Боевых слонов#!."
 dhe_dde_pyrrhus.5.ct:1 "Эпир получит несколько отрядов #Y Тяжелой пехоты#! и #R -50#! к мнению о [SCOPE.sC('pyrrhus_second_country_scope').GetName]."
 
 dhe_dde_pyrrhus.6.t:0 "[SCOPE.sC('dhe_dde_pyrrhus_rome_scope').GetAdjective] агрессия"
 dhe_dde_pyrrhus.6.desc:1 "Нас всегда теснили наши италийские соседи, но до сих пор мы, греки, могли удерживаться в Великой Греции. [SCOPE.sC('dhe_dde_pyrrhus_rome_scope').GetName] становится всё более агрессивным по мере своего расширения, и мы неизбежно оказались втянуты в конфликт. Это государство гораздо сильнее нашего, и силы, которые они могут собрать, представляют серьезную угрозу, даже с помощью союзников.\n\nМного лет назад Александр I Эпирский отплыл в Великую Грецию с армией и едва не разгромил бруттиев и луканов, терзавших Тарент, прежде чем пал в бою. Его внучатый племянник Пирр, по всем отзывам, способный правитель, и, возможно, нам удастся соблазнить его пойти по стопам предков..."
 dhe_dde_pyrrhus.6.a:1 "Пирр — наша единственная надежда против [SCOPE.sC('dhe_dde_pyrrhus_rome_scope').GetName]."
 dhe_dde_pyrrhus.6.at:0 "[SCOPE.sC('dhe_dde_pyrrhus_epirus_scope').GetRuler.GetName] из [SCOPE.sC('dhe_dde_pyrrhus_epirus_scope').GetName] получит нашу просьбу о помощи."
 dhe_dde_pyrrhus.6.b:0 "Эпироты будут лишь стремиться подчинить нас..."
 
 dhe_dde_pyrrhus.7.t:0 "Возможность в Великой Греции"
 dhe_dde_pyrrhus.7.desc:1 "Мы получили посланника от эллинского государства [SCOPE.sC('dhe_dde_pyrrhus_tarentum_scope').GetName] в Великой Греции. Они просят нашей помощи против [SCOPE.sC('dhe_dde_pyrrhus_rome_scope').GetAdjective], которые агрессивно расширяются в греческие земли Южной Италии. Мы находимся в уникальном положении, чтобы помочь нашим греческим братьям, и это дает нам предлог для включения Великой Греции в сферу нашего влияния или её прямого завоевания.\n\nЦарь Александр I Эпирский, двоюродный дядя Пирра, последовал схожей судьбе, когда попытался повторить восточные завоевания своего племянника Александра Великого на западе и пересек Ионическое море, чтобы помочь Таренту против бруттиев и луканов.\n\nСитуация сегодня значительно изменилась; [SCOPE.sC('dhe_dde_pyrrhus_rome_scope').GetName] настроил против себя весь регион, и наше вмешательство наверняка найдет множество сторонников по всему полуострову. Хотя Александр I пал в битве с италийцами, это может стать нашим великим шансом на славу."
 dhe_dde_pyrrhus.7.a:0 "Тихе благоволит смелым."
 dhe_dde_pyrrhus.7.at:1 "Каждое государство материковой Великой Греции, не состоящее в союзе с [SCOPE.sC('dhe_dde_pyrrhus_rome_scope').GetName], получит #G 50#! к мнению об Эпире.\nЭпир получит #Y претензию#! на каждую провинцию в Великой Греции, принадлежащую [SCOPE.sC('dhe_dde_pyrrhus_rome_scope').GetName] или её союзникам."
 
 dhe_dde_pyrrhus.8.t:0 "Амбиции Пирра"
 dhe_dde_pyrrhus.8.desc_1:1 "До нас дошли вести о том, что по настоянию эллинов Великой Греции царь Пирр Эпирский, как говорят, планирует вторгнуться в Южную Италию, чтобы защитить греческие государства от нашей агрессии. Прецедент царя Александра I Эпирского, двоюродного дяди Пирра, который пришел на помощь грекам и едва не разгромил луканов и бруттиев, вызывает, мягко говоря, беспокойство.\n\nРастет недовольство нашим расширением, и у него наверняка будет много сторонников в регионе. Посмотрим, как это будет развиваться."
 dhe_dde_pyrrhus.8.desc_2:1 "До нас дошли вести о том, что царь Пирр Эпирский, как говорят, планирует вторгнуться в Южную Италию, чтобы защитить греческие государства, услышав нашу просьбу. Существует прецедент царя Александра I Эпирского, двоюродного дяди Пирра, который пришел на помощь грекам и едва не разгромил луканов и бруттиев.\n\nРастет недовольство римской экспансией, и у него наверняка будет много сторонников в регионе. Будем надеяться, что он нас не разочарует."
 dhe_dde_pyrrhus.8.desc_3:1 "До нас дошли вести о том, что по настоянию эллинов Великой Греции царь Пирр Эпирский, как говорят, планирует вторгнуться в Южную Италию, чтобы защитить греческие государства. Существует прецедент царя Александра I Эпирского, двоюродного дяди Пирра, который пришел на помощь грекам и едва не разгромил луканов и бруттиев.\n\nРастет недовольство римской экспансией, и у него наверняка будет много сторонников в регионе. Это может стать уникальной возможностью для нас."
 dhe_dde_pyrrhus.8.a:1 "[SCOPE.sC('dhe_dde_pyrrhus_rome_scope').GetName] не боится никого."
 dhe_dde_pyrrhus.8.at:2 "#R Эпиру была предоставлена #Y Претензия#! на каждую [SCOPE.sC('dhe_dde_pyrrhus_rome_scope').GetAdjective] территорию в регионе #Y Великая Греция#!#!."
 dhe_dde_pyrrhus.8.b:0 "Будем надеяться, что это была хорошая идея..."
 dhe_dde_pyrrhus.8.bt:2 "Эпиру была предоставлена #Y Претензия#! на каждую [SCOPE.sC('dhe_dde_pyrrhus_rome_scope').GetAdjective] территорию в регионе #Y Великая Греция#!."
 
 dhe_dde_pyrrhus.10.t:0 "Смерть Пирра"
 dhe_dde_pyrrhus.10.desc:0 "До нас дошла весть о том, что свергнутый царь Пирр скончался в каком-то отдаленном уголке мира при неизвестных обстоятельствах. Наследник Ахилла пал, и весь Эпир будет оплакивать своего погибшего сына.\n\nЛишь Зевсу известно, чего он мог бы достичь, если бы не зависть и злоба ничтожных людей."
 dhe_dde_pyrrhus.10.a:0 "Покойся с миром, милый принц..."
 
 dhe_dde_pyrrhus.11.t:0 "Дружба с Фракией"
 dhe_dde_pyrrhus.11.desc:0 "Царство Македония давно вмешивается в дела Эпира и ограничивает наши возможности для роста и влияния в Элладе. Фракийцы, находящиеся на противоположной стороне Македонии, находятся в схожем положении; они завидуют мощи соперника, который загнал их в угол на протяжении поколений.\n\nМы могли бы договориться с диадохом [SCOPE.sChar('dhe_dde_pyrrhus_thrace_scope').GetName] во Фракии, учитывая наши общие интересы против македонян и наше уникальное положение вокруг царства Александра."
 dhe_dde_pyrrhus.11.a:0 "Они увидят выгоды."
 dhe_dde_pyrrhus.11.at:0 "Фракия решит, принять ли наши условия дружбы."
 dhe_dde_pyrrhus.11.b:0 "Мы можем использовать это в своих интересах."
 dhe_dde_pyrrhus.11.c:0 "Наши интересы лежат в другом месте..."
 
 dhe_dde_pyrrhus.12.t:0 "Дружба с Эпиром"
 dhe_dde_pyrrhus.12.desc:0 "Царство Эпир обратилось к нам с предложением дружбы. Македония давно вмешивается в дела Фракии и ограничивает наши возможности для роста и влияния в Элладе. Эпироты, находящиеся на противоположной стороне Македонии, находятся в схожем положении; они завидуют мощи соперника, который загнал их в угол на протяжении поколений.\n\nУчитывая наши общие интересы против македонян и наше уникальное положение вокруг царства Александра, они могут стать очень полезным союзником."
 dhe_dde_pyrrhus.12.a:0 "Мы окружим Македонию."
 dhe_dde_pyrrhus.12.at:0 "Эпир получит #G 75#! к мнению о Фракии\nФракия получит #G 75#! к мнению об Эпире"
 dhe_dde_pyrrhus.12.b:0 "Наши интересы лежат в другом месте..."
 
 dhe_dde_pyrrhus.14.t:0 "Оракул Додоны"
 dhe_dde_pyrrhus.14.desc:0 "Реставрация храмов Додоны наконец завершена, вместе со строительством большого амфитеатра и подготовкой площадок для ежегодных игр и фестивалей. Святилища Зевса Найоса, священный дуб и храмы Геракла и Дионы были укреплены окружающей стеной и теперь едва узнаваемы, великолепно отделанные новым камнем и украшенные рельефами и фризами.\n\nВоистину, Додона вновь сможет соперничать с другими знаменитыми религиозными центрами Греции и явит миру богатство и благочестие Эпира."
 dhe_dde_pyrrhus.14.a:0 "Это великолепно."

 dhe_dde_pyrrhus.15.t:0 "Доходы от Додоны"
 dhe_dde_pyrrhus.15.desc:0 "Успех реставрации оракула Додоны, в особенности количество посетителей, привлеченных фестивалями и гаданиями по перезвону ветряных колокольчиков священного дуба, оказался поразительным.\n\nИгры неизменно хорошо посещаемы наряду с театральными представлениями, привлекая множество торговцев и богатых покровителей к храмовому комплексу.\n\nЭпир вновь стал важным религиозным центром Эллады, и нет сомнений в том, что Зевс Найос благоволит нам."
 dhe_dde_pyrrhus.15.a:0 "Это для всего Эпира."
 dhe_dde_pyrrhus.15.b:0 "Мы устроим фестиваль, достойный олимпийцев."

 dhe_dde_pyrrhus.16.t:0 "Предложение для Эпира"
 dhe_dde_pyrrhus.16.desc:0 "Царство Эпир занимает стратегическое положение между греческим сердцем и юго-восточной оконечностью Италии. Их царь Пирр создал себе громкое имя, и под его правлением Эпир мог бы стать полезным союзником с влиянием в Элладе и Великой Греции.\n\nНаше положение подвергается нападению со всех сторон, и Пирр, потомок Ахилла, может склонить чашу весов в нашу пользу.\n\nЧтобы обеспечить прочную дружбу, мы можем предложить ему в жены [SCOPE.sChar('pyrrhus_betrothed_scope').GetName] с солидным приданым..."
 dhe_dde_pyrrhus.16.a:0 "Сделать необходимые приготовления."
 dhe_dde_pyrrhus.16.at_1:0 "Если Эпир согласится, Сиракузы передадут Эпиру острова #Y Коркира и Левкада#! в качестве приданого."
 dhe_dde_pyrrhus.16.at_2:0 "Если Эпир согласится, Сиракузы передадут Эпиру остров #Y Коркира#! в качестве приданого."
 dhe_dde_pyrrhus.16.at_3:0 "Если Эпир согласится, Сиракузы передадут Эпиру #R 100#! @gold! в качестве приданого."
 dhe_dde_pyrrhus.16.b:0 "Это не в наших интересах..."

 dhe_dde_pyrrhus.17.t:0 "Сиракузы предлагают брак"
 dhe_dde_pyrrhus.17.desc:0 "Мы получили предложение от Сиракуз; их правитель [SCOPE.sChar('agathocles').GetName] предлагает нам выдать [SCOPE.sChar('pyrrhus_betrothed_scope').GetName] замуж за царя Пирра с щедрым приданым в обмен на дружбу.\n\nСиракузы занимают стратегическое положение на острове Сицилия; расположенные между богатыми карфагенскими землями и Апеннинским полуостровом, их города являются важными торговыми узлами. Они всегда были сильно стеснены с обеих сторон и явно ищут могущественного союзника, чтобы обезопасить свое положение.\n\nТакже вероятно, что такой брак может дать нам законные основания для экспансии на Сицилию, если наступит подходящий момент..."
 dhe_dde_pyrrhus.17.a:0 "Мы не можем упустить эту возможность."
 dhe_dde_pyrrhus.17.at_1:0 "Это возможность." #not used
 dhe_dde_pyrrhus.17.at_2:0 "Мы получим #G 100#! @gold! в качестве приданого от Сиракуз."
 dhe_dde_pyrrhus.17.b:0 "Пирр не бросит свою жену."
 dhe_dde_pyrrhus.17.c:0 "Это нас не интересует..."
 
 dhe_dde_pyrrhus.18.t:0 "Отчаянное решение"
 dhe_dde_pyrrhus.18.desc_1:1 "$dhe_dde_pyrrhus.18.desc_block$\n\nВ качестве последнего средства было предложено предложить [me_epirus_scope.GetRuler.GetPraenomen] из Эпира возглавить нас. Однако кто знает, где на самом деле лежат его интересы..."
 dhe_dde_pyrrhus.18.desc_2:1 "$dhe_dde_pyrrhus.18.desc_block$\n\nВ качестве последнего средства было предложено предложить [me_epirus_scope.GetRuler.GetPraenomen] из Эпира возглавить нас. Его брак с нашей правящей династией дает ему solid claim, и он может быть нашей лучшей надеждой на сохранение греческого правления над Сиракузами. Однако кто знает, где на самом деле лежат его интересы..."
 dhe_dde_pyrrhus.18.desc_3:0 "$dhe_dde_pyrrhus.18.desc_block$\n\n[me_epirus_scope.GetRulerTitle] [me_epirus_scope.GetRuler.GetPraenomen] из Эпира обратился к нам в эти трудные времена с предложением союза, чтобы [me_epirus_scope.GetRuler.GetSheHe] мог помочь избавить сицилиотов от угрозы варваров, но какой ценой?"
 dhe_dde_pyrrhus.18.desc_block:0 "Нам вновь грозит уничтожение от вероломных карфагенян. Они, как и многие другие, давно желают завоевать богатый остров Сицилию для себя, и мы всегда отбрасывали их назад. Сегодня мы столкнулись, возможно, с самой большой угрозой, с которой когда-либо сталкивались, и многие считают наше положение безнадежным."
 dhe_dde_pyrrhus.18.a:0 "Мы должны попросить помощи у Пирра."
 dhe_dde_pyrrhus.18.at:0 "#R Если Эпир согласится, мы станем их клиентским государством, а Эпир получит претензии на всю Сицилию и объявит войну Карфагену."
 dhe_dde_pyrrhus.18.b:0 "Нам не нужна его помощь..."
 dhe_dde_pyrrhus.18.bt:0 "Эпиру будет предоставлена #Y претензия#! на каждую провинцию на Сицилии."
 dhe_dde_pyrrhus.18.c:0 "Нам нужна их помощь."
 dhe_dde_pyrrhus.18.d:0 "Оппортунистические псы."
 dhe_dde_pyrrhus.18.tt:0 "#Y [me_epirus_scope.GetName]#! получил претензии на все #Y $carthaginian$#! территории на Сицилии."

 dhe_dde_pyrrhus.19.t:0 "Возможность на Сицилии"
 dhe_dde_pyrrhus.19.desc_1:0 "К нам обратились сиракузяне с предложением...\n\nНа них напали могущественные карфагеняне, стремящиеся к господству над островом Сицилия. Опасаясь, что они не смогут сохранить свою независимость против столь мощного врага, они предложили официально короновать Пирра царем Сицилии.\n\nПохоже, они с большим интересом следят за нашей экспансией в Великой Греции и скорее пригласят греческого царя, имеющего долю в этом регионе, чем падут перед иностранными захватчиками.\n\nМы должны тщательно обдумать это, принятие их предложения означает открытую войну с Карфагеном."
 dhe_dde_pyrrhus.19.desc_2:0 "К нам обратились сиракузяне с предложением...\n\nНа них напали могущественные карфагеняне, стремящиеся к господству над островом Сицилия. Опасаясь, что они не смогут сохранить свою независимость против столь мощного врага, они предложили официально короновать Пирра царем Сицилии.\n\nПохоже, они с большим интересом следят за успехами Пирра, и учитывая его брачные связи, у него есть реальное право на трон.\n\nМы должны тщательно обдумать это, принятие их предложения означает открытую войну с Карфагеном."
 dhe_dde_pyrrhus.19.a:0 "Сицилия созрела для взятия"
 dhe_dde_pyrrhus.19.at:0 "Эпир вассализирует Сиракузы как #Y клиентское государство#!, получит претензии на всю Сицилию и объявит войну Карфагену.\nКаждое эллинское государство на Сицилии и в Великой Греции получит #G 50#! к мнению об Эпире."
 dhe_dde_pyrrhus.19.b:0 "Это дело дураков. Но хорошо знать..."
 dhe_dde_pyrrhus.19.bt:0 "Эпир получит претензии на всю Сицилию."
 
 dhe_dde_pyrrhus.20.t:0 "Замечательный человек"
 dhe_dde_pyrrhus.20.desc:0 "В результате окончания военных действий с [SCOPE.sC('pyrrhus_first_country_scope').GetName] был согласован обмен заложниками, как обычно, чтобы способствовать доброй воле и обеспечить прочность согласованного перемирия.\n\nОдним из этих заложников оказался никто иной, как Пирр Эпирский, дальний родственник Александра Великого и потомок самого Ахилла.\n\nОн ищет поддержки, чтобы отстоять свои притязания на трон Эпира, с которого он недавно был свергнут."
 dhe_dde_pyrrhus.20.a:0 "Посмотрим, как это будет развиваться..."
 dhe_dde_pyrrhus.20.at:0 "Пирр останется при нашем дворе некоторое время, прежде чем вернуться в Эпир."

 dhe_dde_pyrrhus.21.t:0 "Претензии на Сицилию"
 dhe_dde_pyrrhus.21.desc_1:0 "До нас дошли вести о том, что сиракузяне рассматривали возможность попросить нашей помощи в их войне с Карфагеном, учитывая наше присутствие в Великой Греции и интересы в сицилиотских колониях.\n\nВместо этого они решили продолжать свою безнадежную войну самостоятельно. Однако мы все еще можем воспользоваться их слабостью в своих интересах..."
 dhe_dde_pyrrhus.21.desc_2:0 "До нас дошли вести о том, что сиракузяне рассматривали возможность попросить нашей помощи в их войне с Карфагеном, учитывая наши брачные связи и интересы в Великой Греции.\n\nВместо этого они решили продолжать свою безнадежную войну самостоятельно. Однако мы все еще можем воспользоваться их слабостью в своих интересах..."
 dhe_dde_pyrrhus.21.a:0 "Сицилия будет нашей."
 dhe_dde_pyrrhus.21.at:0 "Эпир получит претензии на всю Сицилию."
 
 dhe_dde_pyrrhus.22.t:0 "Пирр под защитой [SCOPE.sC('pyrrhus_first_country_scope').GetName]"
 dhe_dde_pyrrhus.22.desc_1:0 "В беспорядке, последовавшем за его свержением молоссами и коронацией [SCOPE.sChar('neoptolemus').GetName], Пирр смог бежать из Эпира с помощью придворных и слуг, прежде чем наши солдаты смогли его найти.\n\nДо нас дошли вести о том, что ему снова предложили убежище тавланты, и он, несомненно, плетет какую-то схему, чтобы вернуть трон."
 dhe_dde_pyrrhus.22.desc_2:0 "В беспорядке, последовавшем за его свержением молоссами и коронацией [SCOPE.sChar('neoptolemus').GetName], Пирр смог бежать из Эпира с помощью придворных и слуг, прежде чем наши солдаты смогли его найти.\n\nДо нас дошли вести о том, что ему предложил убежище диадох [SCOPE.sC('pyrrhus_first_country_scope').GetRuler.GetName], родственник через королевский брак, и он, несомненно, плетет какую-то схему, чтобы вернуть трон с помощью [SCOPE.sC('pyrrhus_first_country_scope').GetAdjective]."
 dhe_dde_pyrrhus.22.desc_3:0 "В беспорядке, последовавшем за его свержением молоссами и коронацией [SCOPE.sChar('neoptolemus').GetName], Пирр смог бежать из Эпира с помощью придворных и слуг, прежде чем наши солдаты смогли его найти.\n\nДо нас дошли вести о том, что ему предложил убежище диадох [SCOPE.sC('pyrrhus_first_country_scope').GetRuler.GetName], и он, несомненно, плетет какую-то схему, чтобы вернуть трон с помощью [SCOPE.sC('pyrrhus_first_country_scope').GetAdjective]."
 dhe_dde_pyrrhus.22.desc_4:0 "В беспорядке, последовавшем за его свержением молоссами и коронацией [SCOPE.sChar('neoptolemus').GetName], Пирр смог бежать из Эпира с помощью придворных и слуг, прежде чем наши солдаты смогли его найти.\n\nДо нас дошли вести о том, что ему предложил убежище [SCOPE.sC('pyrrhus_first_country_scope').GetRuler.GetName] из [SCOPE.sC('pyrrhus_first_country_scope').GetName], и он, несомненно, плетет какую-то схему, чтобы вернуть трон с помощью [SCOPE.sC('pyrrhus_first_country_scope').GetAdjective]."
 dhe_dde_pyrrhus.22.a:0 "Пусть бежит."

 dhe_dde_pyrrhus.23.t:0 "Пирр exchanged как заложник"
 dhe_dde_pyrrhus.23.desc:0 "До нас дошли вести о том, что свергнутый претендент Пирр стал не более чем пешкой в политических маневрах диадохов.\n\nОн был передан в [SCOPE.sC('pyrrhus_second_country_scope').GetName] в качестве заложника после их конфликта с его [SCOPE.sC('pyrrhus_first_country_scope').GetAdjective] покровителями."
 dhe_dde_pyrrhus.23.a:0 "Он не сможет это исправить..."

 dhe_dde_pyrrhus.25.t:0 "Ответ Фракии"
 dhe_dde_pyrrhus.25.desc:0 "Наше посольство во Фракию вернулось с новостью о том, что им удалось достичь понимания с [SCOPE.sChar('dhe_dde_pyrrhus_thrace_scope').GetName].\n\nПохоже, их недоверие к Македонии отражает наше собственное, и союз может быть на карте..."
 dhe_dde_pyrrhus.25.a:0 "Превосходно."
 
 dhe_dde_pyrrhus.26.t:0 "Ответ Фракии"
 dhe_dde_pyrrhus.26.desc:0 "Наше посольство во Фракию вернулось с новостью о том, что им не удалось убедить [SCOPE.sChar('dhe_dde_pyrrhus_thrace_scope').GetName].\n\nПохоже, у фракийцев есть другие идеи о том, как сдержать македонян..."
 dhe_dde_pyrrhus.26.a:0 "Стоило попробовать..."
 
 dhe_dde_pyrrhus.27.t:0 "Пирр достиг совершеннолетия"
 dhe_dde_pyrrhus.27.desc:0 "Свергнутый царь Пирр достиг возраста, когда его способности могут быть нам полезны. Хотя он, возможно, не планирует оставаться навсегда, он не возражает применять свои значительные военные и иные таланты в наших целях, пока наслаждается нашим гостеприимством."
 dhe_dde_pyrrhus.27.a:0 "Он может выиграть для нас несколько битв за наши хлопоты..."
 
 dhe_dde_pyrrhus.28.t:0 "Пирр принимает предложение"
 dhe_dde_pyrrhus.28.desc:0 "До нас дошли вести о том, что царь Пирр принял наше предложение жениться на [SCOPE.sChar('pyrrhus_betrothed_scope').GetName].\n\n[SCOPE.sChar('pyrrhus_betrothed_scope').GetName] отправилась в Эпир к своему новому мужу вместе с подтверждением нашего щедрого приданого. Будем надеяться, что это выгодная договоренность..."
 dhe_dde_pyrrhus.28.a:0 "Отлично."
 
 dhe_dde_pyrrhus.29.t:0 "Пирр отвергает предложение"
 dhe_dde_pyrrhus.29.desc_1:0 "До нас дошли вести о том, что царь Пирр отверг наше предложение жениться на [SCOPE.sChar('pyrrhus_betrothed_scope').GetName]. Похоже, Пирр не хотел бросать свою нынешнюю жену.\n\nНам придется найти кого-то другого для [SCOPE.sChar('pyrrhus_betrothed_scope').GetName]..."
 dhe_dde_pyrrhus.29.desc_2:0 "До нас дошли вести о том, что царь Пирр отверг наше предложение жениться на [SCOPE.sChar('pyrrhus_betrothed_scope').GetName]. Похоже, Пирр, несмотря на отсутствие супруги, не соблазнился нашим предложением...\n\nНам придется найти кого-то другого для [SCOPE.sChar('pyrrhus_betrothed_scope').GetName]..."
 dhe_dde_pyrrhus.29.a:0 "Стоило попробовать..."
 
 dhe_dde_pyrrhus.30.t:0 "Пирр на Сицилии"
 dhe_dde_pyrrhus.30.desc_1:0 "До нас дошли вести о том, что царь Пирр Эпирский принял нашу просьбу о помощи! Мы короновали Пирра царем Сицилии, и теперь мы de facto его подданные, но он присоединился к нашей войне против Карфагена!\nДа улыбнется нам Ника!"
 dhe_dde_pyrrhus.30.desc_2:0 "До нас дошли вести о том, что по настоянию сиракузян царь Пирр Эпирский был коронован царем Сицилии, чтобы защитить её от нашего вторжения.\nСиракузы стали вассалом Эпира, в то время как все греческие государства Южной Италии смотрят на Пирра, чтобы он защитил их независимость."
 dhe_dde_pyrrhus.30.desc_3:0 "До нас дошли вести о том, что по настоянию сиракузян царь Пирр Эпирский был коронован царем Сицилии, чтобы защитить её от карфагенского вторжения.\nСиракузы стали вассалом Эпира, в то время как все греческие государства Южной Италии смотрят на Пирра, чтобы он защитил их независимость."
 dhe_dde_pyrrhus.30.a:0 "Будем надеяться, он прибудет быстро..."
 dhe_dde_pyrrhus.30.b:0 "Глупцы меняют одного захватчика на другого."
 dhe_dde_pyrrhus.30.c:0 "Интересно..."
 dhe_dde_pyrrhus.30.tooltip:1 "Эпир получил претензии на всю Сицилию и объявил войну Карфагену.\nКаждое эллинское государство на Сицилии и в Великой Греции получило #G 50#! к мнению об Эпире."
 
 dhe_dde_pyrrhus.31.t:0 "Пирр отказывает"
 dhe_dde_pyrrhus.31.desc:0 "Мы получили ответ от царя Пирра Эпирского, и он отказал в нашей просьбе о помощи в обмен на подчинение...\n\nКроме того, раскрыв наше бедственное положение этому беспринципному авантюристу, мы, возможно, дали Пирру информацию, необходимую ему, чтобы воспользоваться нашей слабостью. Он, несомненно, имеет виды на Сицилию как на спутник Великой Греции..."
 dhe_dde_pyrrhus.31.a:0 "Стоило попробовать..."
 
 dhe_dde_pyrrhus.32.t:1 "$epirus_2_magna$"
 dhe_dde_pyrrhus.32.desc:1 "Много лет назад Александр I Эпирский, [SCOPE.Custom('epirus_2_alexandros_relation')]брат Олимпиады Македонской, стремился переправиться в Италию и завоевать полуостров, ободряемый завоеваниями своего племянника Александра Великого на востоке.\n\nТам он провел remarkable кампанию против луканов и бруттиев в помощь греческой колонии Тарас, аннексировав Сипонт, Гераклею и Терину, и даже заключив договор с Римом. Однако судьбы имели другие идеи, и через предательство он был втянут в неравный бой при Пандосии. Там он пал, но не прежде чем посетовать, что легкие успехи его племянника Александра были результатом «ведения войны против женщин» в Персии, тогда как ему пришлось столкнуться с настоящими мужчинами в Италии.\n\nЭпир потерял свои итальянские владения в последующие годы, но теперь, возможно, настал её шанс исполнить destiny вечной линии Ахилла, породившей величайших завоевателей мира."
 dhe_dde_pyrrhus.32.a:0 "Тихе благоволит смелым."
 dhe_dde_pyrrhus.32.at:1 "Эпир получит претензию на каждую материковую территорию в регионе #Y Великая Греция#!."

 epirus_2_alexandros_relation_1:1 "двоюродный брат Пирра и "
 epirus_2_alexandros_relation_2:0 "отец Неоптолема III и "
 epirus_2_alexandros_relation_3:0 ""

 dhe_dde_pyrrhus_molossians_angered_cm:0 "Молоссы разгневаны"
 desc_dhe_dde_pyrrhus_molossians_angered_cm:0 "Отказавшись свергнуть царя Пирра, мы разгневали могущественное племя молоссов, поддержка которого жизненно важна для легитимности эпиротских правителей."
 dhe_dde_pyrrhus_readiness_for_war_cm:0 "Готовность к войне"
 desc_dhe_dde_pyrrhus_readiness_for_war_cm:0 "Подготовленный конфликт с Карфагеном вынудил нас мобилизовать наш полный военный потенциал."
 dhe_dde_pyrrhus_blessings_of_dodona_cm:0 "Благословения Додоны."
 desc_dhe_dde_pyrrhus_blessings_of_dodona_cm:0 "Реставрация Оракула Додоны поставила нас в хорошее положение перед олимпийцами."
 dhe_dde_pyrrhus_dodona_boon_cm:0 "Любимец богов"
 desc_dhe_dde_pyrrhus_dodona_boon_cm:0 "Преданность эпиротов олимпийцам известна; они truly blessed во всех своих начинаниях."
 
 dhe_dde_pyrrhus_dodona_pm:0 "Оракул Додоны"
 desc_dhe_dde_pyrrhus_dodona_pm:0 "Реставрация оракула Додоны и учреждение игр и фестивалей привели steady flow посетителей и торговцев в Додону."
 
 dhe_dde_pyrrhus_angered_macedon_op:0 "Поддержал Пирра"
 dhe_dde_pyrrhus_lysimachus_op:0 "Интересы Эакидов-Алкиахидов"
 dhe_dde_pyrrhus_syracuse_op:1 "Королевский брак"
 dhe_dde_pyrrhus_deposed_pyrrhus_op:0 "Сверг царя Пирра"
 dhe_dde_pyrrhus_intervention_op:0 "Вмешательство против соседних агрессоров"
 dhe_dde_pyrrhus_refused_syracuse_op:0 "Отказал в помощи"
 dhe_dde_pyrrhus_no_support_op:0 "Отказался поддержать"
 dhe_dde_pyrrhus_supports_pyrrhus_op:0 "Поддерживает Пирра"
 dhe_dde_pyrrhus_supported_op:0 "Оказал поддержку"

 dhe_dde_pyrrhus_dodona_decision:0 "Расширить Оракул Додоны"
 dhe_dde_pyrrhus_dodona_decision_desc:0 "Оракул Додоны является старейшим во всем греческом мире и когда-то был одним из важнейших религиозных центров Эллады. Храмовый комплекс centered вокруг древнего священного дуба Зевса Найоса, святилище которого покрывает holy spring. С годами храмовый комплекс пришел в ветхость и запустение, так как другие, более известные оракулы затмили его.\nПостроив амфитеатр, отреставрировав храм Зевса и учредив регулярные фестивали в Додоне, это место может вновь занять свое rightful place среди священных обителей богов."
 dhe_dde_pyrrhus_dodona_decision_tooltip:0 "Начинается реставрация Додоны."

 dhe_dde_pyrrhus.33.t:0 "Пирр Орел"
 dhe_dde_pyrrhus.33.desc:0 "Пришли новости из нашего недавнего столкновения с армиями [target.GetCountry.GetName], где сообщается, что вражеский генерал [target.GetCommander.GetPraenomen], раздутый гордостью или отвагой, вызвал [actor.GetCountry.GetRulerTitle] [actor.GetCommander.GetPraenomen] на единоборство перед assembled armies.\n\nБудучи distinguished fighter, [actor.GetCommander.GetSheHe] принял вызов и, хотя и получил рану, в итоге сумел превзойти [target.GetCommander.GetPraenomen], который был вытащен окровавленным с поля боя своими офицерами.\n\nВоодушевленные glorious victory своего царя, наши войска полностью разгромили противостоящую армию, и солдаты начали называть Пирра «Орлом» в знак своей любви и уважения."
 dhe_dde_pyrrhus.33.a:0 "Потомок Ахилла, indeed."

 dhe_dde_pyrrhus.34.desc:0 "Наши посланники принесли весть из битвы с [actor.GetCountry.GetName], сообщая, что сокрушительное поражение было отчасти due to recklessness нашего генерала [target.GetCommander.GetPraenomen].\n\nГорячка вызвала [actor.GetCommander.GetPraenomen], [actor.GetCountry.GetAdjective] царя и генерала, на единоборство перед gathered armies, несмотря на renown [actor.GetCommander.GetPraenomen] как бойца.\n\n[target.GetCommander.GetHerHis|U] поражение было позорным, хотя [target.GetCommander.GetSheHe] нанес в ответ small wound, и contributed to ferocity эпиротских сил, которые были much impressed своим царем."
 dhe_dde_pyrrhus.34.a:0 "О глупый [target.GetCommander.GetPraenomen]..."

 dhe_dde_pyrrhus.35.t:0 "Памятная жизнь"
 dhe_dde_pyrrhus.35.desc:0 "Наш царь Пирр наконец упокоился. Bold strategist и magnificent fighter, он будет долго remembered эпиротами, которые приходят издалека, чтобы принести offerings и выразить благодарность у его могилы."
 dhe_dde_pyrrhus.35.a:0 "Он будет honored for all time."

 dhe_dde_pyrrhus.36.t:0 "Храбрый Опалк"
 dhe_dde_pyrrhus.36.desc:0 "Как обычно, Пирр bravely вел свою армию с фронта, въезжая в thick of the action со своей bodyguard, но сегодня, похоже, он был singled out determined foe, желавшим gain glory, убив такую prestigious figure.\n\n"
 dhe_dde_pyrrhus.36.desc_1:0 "Никогда не отступая от вызова, Пирр charged maddened rider, прежде чем его guard could respond. В chaos, оба men fell с their horses с great wounds, и succumbed to the chaos of the melee..."
 dhe_dde_pyrrhus.36.desc_2:1 "Пренебрегая advice of his guard and generals, Пирр paid little heed to ravening Italian, bearing down on him, until it was too late. Horse Пирра была ran through spear Frentanian just at the moment his own bodyguard returned the favor, hacking the man to pieces while the king was carried to safety."
 dhe_dde_pyrrhus.36.a:0 "«Как это могло произойти?!»"
 dhe_dde_pyrrhus.36.b:0 "«Вы должны быть осторожнее, мой царь!»"
 dhe_dde_pyrrhus.36.c:0 "«Вам не следует брать на себя такие риски!»"

 dhe_dde_pyrrhus.37.t:0 "Трон шакалов"
 dhe_dde_pyrrhus.37.desc:1 "Чтобы успокоить certain members of the aristocracy, Пирр правил как joint king sorts, sharing power с [neoptolemus.GetName] — хотя это fast became untenable. Оба see themselves as the rightful ruler of Epirus, и schemes have begun to unravel.\n\nUltimately influence rests with the Molossians, for without their support a king cannot hope to rule, even now..."
 dhe_dde_pyrrhus.37.a:0 "Пирр — истинный царь."
 dhe_dde_pyrrhus.37.at:0 "#R [neoptolemus.GetPraenomen] будет убит, чтобы уладить спор.#!"
 dhe_dde_pyrrhus.37.b:0 "У Неоптолема кровь Александра."
 dhe_dde_pyrrhus.37.bt:0 "#R Пирр будет убит, чтобы уладить спор.#!\n[neoptolemus.GetPraenomen] станет правителем."
 dhe_dde_pyrrhus.37.c:0 "[neoptolemus.GetPraenomen] — наш [neoptolemus.GetWomanMan]."
 dhe_dde_pyrrhus.38.t:0 "Необходимое зло"
 dhe_dde_pyrrhus.38.desc:0 "В последние дни при дворе developed plot involving friends of both claimants, arising from a dispute at the festival of Ares.\n\n"
 dhe_dde_pyrrhus.38.desc_1:0 "The overriding loyalty to Pyrrhos won out, allowing his friends to shrewdly implicate [depose_target.GetPraenomen] in a plot to murder Pyrrhos which they had mendaciously encouraged among friends of the claimant, and of course had to be met with a pre-emptive strike in turn."
 dhe_dde_pyrrhus.38.desc_2:0 "Despite his qualities, Pyrrhos was unable to inspire the same loyalty as [depose_target.GetPraenomen] and was outmanueveured in a court plot which implicated him in a plan to murder his rival for the throne."
 dhe_dde_pyrrhus.38.desc_3:0 "\n\nWith [depose_target.GetHerHis] treasonous plans revealed and the assent of the council, [depose_target.GetPraenomen] was arrested and put to death for the good of [depose_target.GetEmployer.GetName]..."
 dhe_dde_pyrrhus.38.tt:0 "Задача миссии '#Y $epirus_1_epirus_11$#!' теперь может быть выполнена."
 dhe_dde_pyrrhus.38.a:0 "Наконец-то мы можем двигаться дальше по жизни."
 dhe_dde_pyrrhus.38.b:0 "Пф, всего лишь arrogant dreamer..."
 dhe_dde_pyrrhus_dodona_holy_site_tt:0 "Поскольку #Y [GetProvince('(int32)425').GetName]#! не является Святым местом и у #Y Зевса Найоса#! нет Святого места:"