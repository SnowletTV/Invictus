 patronize_greek_literature_and_arts:0 "Покровительство греческой литературе и искусствам"
 patronize_greek_literature_and_arts_desc:0 "Эта культура обладает богатым и древним наследием, огромной сокровищницей литературы и эстетики, которая пленяет многих в столице. Давайте покровительствовать их учёным, писателям, поэтам и художникам, сближая наши два народа."
