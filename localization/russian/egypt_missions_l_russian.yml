 egypt_mission_1_sea_task_1_foundry_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_1_foundry_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_1_foundry_total')|0]#!)"
 egypt_mission_1_sea_task_1_trigger_1:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_1_trade_total')|0]#! торговых путей, импортирующих древесность в регион $western_delta_area$. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_1_sea_task_1_trade_counter')]"
 egypt_mission_1_sea_task_1_trade_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_1_sea_task_1_current_trade')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_1_trade_total')|0]#!)"
 egypt_mission_1_sea_task_1_trade_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_1_current_trade')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_1_trade_total')|0]#!)"
 egypt_mission_1_sea_task_2:0 "Безопасные пути"
 egypt_mission_1_sea_task_2_DESC:0 "Слишком долго пираты терроризировали Нил и всё египетское побережье. Пришло время обеспечить безопасность путешественников и торговцев."
 egypt_mission_1_sea_task_2.tt:0 "Ни одна подконтрольная территория не имеет модификатора #Y $pirate_haven_modifier$#!. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_1_sea_task_2_pirates_counter')]"
 egypt_mission_1_sea_task_2_pirates_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_1_sea_task_2_pirates_current')|0]#!)"
 egypt_mission_1_sea_task_2_pirates_counter_2:0 ""
 egypt_mission_1_sea_task_3:0 "Лига островитян"
 egypt_mission_1_sea_task_3_DESC:0 "Острова Эгейского моря слишком долго страдали от угроз, исходящих из Азии, Фракии и Македонии. Пришло время обрести мир под нашим благосклонным правлением!"
 egypt_mission_1_sea_task_4:0 "Морская мощь"
 egypt_mission_1_sea_task_4_DESC:0 "Чтобы доминировать на море, нам нужен достойный флот!"
 egypt_mission_1_sea_task_4_ship_trigger:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_4_ship_total')|0]#! кораблей. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_1_sea_task_4_ship_counter')]"
 egypt_mission_1_sea_task_4_galley_trigger:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_4_galley_total')|0]#! мега-полирем. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_1_sea_task_4_galley_counter')]"
 egypt_mission_1_sea_task_4_liburnian_trigger_1:0 "Доля либурн во флоте составляет менее #Y 25%#!."
 egypt_mission_1_sea_task_4_ship_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_1_sea_task_4_ship_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_4_ship_total')|0]#!)"
 egypt_mission_1_sea_task_4_ship_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_4_ship_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_4_ship_total')|0]#!)"
 egypt_mission_1_sea_task_4_galley_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_1_sea_task_4_galley_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_4_galley_total')|0]#!)"
 egypt_mission_1_sea_task_4_galley_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_4_galley_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_4_galley_total')|0]#!)"
 egypt_mission_1_sea_task_5:0 "Защитник Эгейского моря"
 egypt_mission_1_sea_task_5_DESC:0 "Контроль над Эгейским морем — vital шаг к тому, чтобы превзойти других диадохов в Средиземноморье."
 egypt_mission_1_sea_task_5.tt.1:0 "[GetCountry('PRY').GetName] или его вассалы не владеют провинциями [GetProvince('(int32)356').GetName|Y] и [GetProvince('(int32)420').GetName|Y]. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_1_sea_task_5_province_counter')]"
 egypt_mission_1_sea_task_5_province_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_1_sea_task_5_province_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_5_province_total')|0]#!)"
 egypt_mission_1_sea_task_5_province_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_5_province_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_5_province_total')|0]#!)"
 egypt_mission_1_sea_task_5.tt.2:0 "Ни одна территория в регионах [GetProvince('(int32)357').GetArea.GetName|Y], [GetProvince('(int32)407').GetArea.GetName|Y] и [GetProvince('(int32)416').GetArea.GetName|Y] не принадлежит [GetCountry('PRY').GetName] или его вассалам. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_1_sea_task_5_area_counter')])"
 egypt_mission_1_sea_task_5_area_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_1_sea_task_5_area_current')|0]#!"
 egypt_mission_1_sea_task_5_area_counter_2:0 ""
 egypt_mission_1_sea_task_5.tt.3:0 "[GetProvince('(int32)344').GetName] является портом."
 egypt_mission_1_sea_task_6:0 "Азиатские гавани"
 egypt_mission_1_sea_task_6_DESC:0 "Установление нашего контроля над главными островами Восточного Средиземноморья и некоторыми портами Малой Азии значительно укрепит нашу власть в регионе и поддержит перемещение наших флотов."
 egypt_mission_1_sea_task_7:0 "Плацдарм в Греции"
 egypt_mission_1_sea_task_7_DESC:0 "Со смерти Александра Греция находится в смятении. Афины, обедневшие и разочарованные чередой правителей, теперь смотрят на нас как на своего нового спасителя."
 egypt_mission_1_sea_task_8:0 "Родосский двор"
 egypt_mission_1_sea_task_8_DESC:0 "Родос находится в идеальном положении, чтобы стать культурным и экономическим центром наших морских владений — второй столицей вдали от Египта."
 egypt_mission_1_sea_task_9:0 "Кипрские доки"
 egypt_mission_1_sea_task_9_DESC:0 "На протяжении веков Кипр был плавильным котлом, где греческая культура встречалась с Востоком и Египтом, где рождались боги и впервые появлялись торговые товары. \nКипр и его glorious прошлое теперь находятся под нашим влиянием, но если мы хотим сделать его жизненно важным центром нашей экономики, нам нужно инвестировать в его инфраструктуру."
 egypt_mission_1_sea_task_10:0 "Азиатская лига"
 egypt_mission_1_sea_task_10_DESC:0 "Контроль над Карией — важный шаг для обеспечения нашего господства над Эгейским морем. Однако внутренние просторы Карии и её положение на дальних границах нашей империи могут стать вызовом для нашей власти."
 egypt_mission_1_sea_task_11:0 "Новый Эллинский союз"
 egypt_mission_1_sea_task_11_DESC:0 "После смерти Александра Греция стала раздробленной и слабой, каждый город пытался угодить то одному македонскому повелителю, то другому. Пришло время Освободителю вновь объединить Грецию и даровать греческому народу вкус (хорошо контролируемой) свободы."
 egypt_mission_1_sea_task_12:0 "Греческие опорные пункты"
 egypt_mission_1_sea_task_12_DESC:0 "Установление нашей защиты над Афинами обеспечило нам их порты. Однако Афины слишком изолированы, и наше положение в регионе далеко не безопасно. Нам нужно расширить наш контроль над Сароническим заливом и укрепить там свои позиции."
 egypt_mission_1_sea_task_12_trigger_1:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_7902_total')|0]#! крепостей в провинции [GetProvince('(int32)7902').GetName|Y]. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_1_sea_task_12_7902_counter')]"
 egypt_mission_1_sea_task_12_7902_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_7902_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_7902_total')|0]#!)"
 egypt_mission_1_sea_task_12_7902_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_7902_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_7902_total')|0]#!)"
 egypt_mission_1_sea_task_12_trigger_2:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_442_total')|0]#! крепостей в провинции [GetProvince('(int32)442').GetName|Y]. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_1_sea_task_12_442_counter')]"
 egypt_mission_1_sea_task_12_442_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_442_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_442_total')|0]#!)"
 egypt_mission_1_sea_task_12_442_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_442_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_442_total')|0]#!)"
 egypt_mission_1_sea_task_12_trigger_3:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_451_total')|0]#! крепостей в провинции [GetProvince('(int32)451').GetName|Y]. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_1_sea_task_12_451_counter')]"
 egypt_mission_1_sea_task_12_451_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_451_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_451_total')|0]#!)"
 egypt_mission_1_sea_task_12_451_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_451_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_12_451_total')|0]#!)"
 egypt_mission_1_sea_task_12.tt:0 "Каждая подконтрольная территория в регионах #Y $arcadia_area$#!, #Y $central_greece_area$#! и #Y $achaea_area$#! получит эффект #Y $greek_stronghold_secured$#!."
 egypt_mission_1_sea_task_13:0 "Хремонидова война"
 egypt_mission_1_sea_task_13_DESC:0 "Ради свободы всех греков пришло время изгнать всех (прочих) диадохов из Греции!"
 egypt_mission_1_sea_task_13.tt.1:0 "Ни одна территория в регионе [GetProvince('(int32)416').GetArea.GetRegion.GetName|Y] или [GetProvince('(int32)391').GetArea.GetName|Y] не принадлежит ни [GetCountry('PRY').GetName], ни [GetCountry('MAC').GetName], ни [GetCountry('SEL').GetName], ни [GetCountry('TRE').GetName]. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_1_sea_task_13_diadochi_counter')]"
 egypt_mission_1_sea_task_13_diadochi_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_1_sea_task_13_diadochi_current')|0]#!)"
 egypt_mission_1_sea_task_13_diadochi_counter_2:0 ""
 egypt_mission_1_sea_task_14:0 "Трон Александра"
 egypt_mission_1_sea_task_14_DESC:0 "Чтобы узаконить претензии [ROOT.GetCountry.GetRuler.GetName] на роль истинного преемника Александра, нам нужно контролировать исходную_seat_ власти Александра."
 egypt_mission_1_sea_task_15:0 "Родосский вопрос"
 egypt_mission_1_sea_task_15_DESC:0 "Родос всегда имел тесные связи с Египтом, но его положение в районе, давно оспариваемом диадохами, оставило остров в деликатной ситуации. Родосцы стойко сопротивлялись осаде Деметрия несколько лет назад, и последующий мирный договор обеспечил их нейтралитет. Однако, если мы не хотим потерять такую formidable базу, нам нужно действовать первыми и как можно скорее формализовать наши отношения с Родосом. Мы должны отправить посольство с предложением нашей защиты."
 egypt_mission_1_sea_task_15.tt:0 "В зависимости от политической ситуации на Родосе, мы получим ответ на наше предложение о защите. Помните, что если Родос принадлежит другой стране, может начаться война."
 egypt_mission_1_sea_task_final:0 "Владыка Средиземноморья"
 egypt_mission_1_sea_task_final_DESC:0 "[ROOT.GetCountry.GetRuler.GetName] теперь является единственным и бесспорным правителем всего Восточного Средиземноморья!"
 egypt_mission_2_pharaoh:0 "Македонский фараон"
 egypt_mission_2_pharaoh_DESCRIPTION:0 "Фараоны правили Египтом тысячелетиями. Будучи заместителями богов среди смертных и носителями божественного сана, фараоны владели всеми землями Египта, проводили религиозные церемонии, издавали законы и несли прямую ответственность за поддержание космического баланса. Во время своего правления Александр всё больше проявлял интерес к восточной идее божественной королевской власти, которая была чужда и ненавистна его македонским соратникам. Среди них был и Птолемей I. \n\nОднако времена меняются. Теперь мы правим страной, богатой древними традициями, и народом, состоящим преимущественно из коренных египтян.\n\nМакедонским повелителям придётся найти баланс между ожиданиями своего народа и реальностью македонского царства, чтобы создать решение, которое будет по-настоящему и уникально их собственным: Птолемеевский Египет."
 egypt_mission_2_pharaoh_CRITERIA_DESCRIPTION:0 "Эта миссия будет считаться выполненной, когда процветание [SCOPE.GetRootScope.GetCountry.GetName] будет обеспечено, а также будут учреждены специфически птолемеевские культы и фестивали."
 egypt_mission_2_pharaoh_BUTTON_TOOLTIP:0 "Сделав [SCOPE.GetRootScope.GetCountry.GetName] сильной и процветающей, а наших царей представив как божественных фараонов, мы обеспечим счастье и лояльность нашего народа."
 egypt_mission_2_pharaoh_BUTTON_DETAILS: ""
 egypt_mission_2_pharaoh_task_1:0 "Столица царей"
 egypt_mission_2_pharaoh_task_1_DESC:0 "Александр основал Александрию как маяк греческой цивилизации на египетской земле. Наш долг — реализовать его мечту и превратить город в столицу, достойную фараонов и богов."
 egypt_mission_2_pharaoh_task_2:0 "Дары Нила"
 egypt_mission_2_pharaoh_task_2_DESC:0 "Египетская цивилизация была построена на регулярных разливах Нила, которые делали землю плодородной. Однако можно сделать гораздо больше для улучшения производства пищи в этой земле."
 egypt_mission_2_pharaoh_task_2_al.tt:0 "Все территории с продовольственными торговыми товарами в регионе #Y $heptanomis_area$#! имеют здание $basic_settlement_infratructure_building$. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_2_pharaoh_task_2_farm_counter')]"
 egypt_mission_2_pharaoh_task_2_farm_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_2_farm_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_2_farm_total')|0]#!)"
 egypt_mission_2_pharaoh_task_2_farm_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_2_farm_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_2_farm_total')|0]#!)"
 egypt_mission_2_pharaoh_task_2_al_2.tt:0 "Все территории без продовольственных или добываемых торговых товаров в регионе #Y $heptanomis_area$#! имеют здание $latifundia_building$. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_2_pharaoh_task_2_slave_counter')]"
 egypt_mission_2_pharaoh_task_2_slave_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_2_slave_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_2_slave_total')|0]#!)"
 egypt_mission_2_pharaoh_task_2_slave_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_2_slave_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_2_slave_total')|0]#!)"
 egypt_mission_2_pharaoh_task_3:0 "Врата Средиземноморья"
 egypt_mission_2_pharaoh_task_3_DESC:0 "Дельта Нила — это место, где египетская глубинка встречается с греческим Средиземноморьем. Для нашей экономики жизненно важно превратить этот район в платформу для международной торговли, начиная с портов вокруг Александрии."
 egypt_mission_2_pharaoh_task_3_trigger_1:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_3_total_commerce_building')|0]#! зданий рынка. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_2_pharaoh_task_3_commerce_building_counter')]"
 egypt_mission_2_pharaoh_task_3_commerce_building_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_3_current_commerce_building')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_3_total_commerce_building')|0]#!)"
 egypt_mission_2_pharaoh_task_3_commerce_building_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_3_current_commerce_building')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_3_total_commerce_building')|0]#!)"
 egypt_mission_2_pharaoh_task_3_trigger_2:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_3_total_town_hall_building')|0]#! зданий налоговой службы. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_2_pharaoh_task_3_town_hall_building_counter')]"
