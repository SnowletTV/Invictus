 egypt_mission_2_pharaoh_task_8:0 "Нильская торговля"
 egypt_mission_2_pharaoh_task_8_DESC:0 "Македонское происхождение и средиземноморские интересы [ROOT.GetCountry.GetRuler.GetName] ориентировали наше внимание в основном на Дельту. Однако фараон является царём как Нижнего, так и Верхнего Египта, а граница с Нубией всегда была зоной особого коммерческого (и военного) интереса для Египта."
 egypt_mission_2_pharaoh_task_8.tt.a:0 "Каждый подконтрольный город в регионе [GetProvince('(int32)569').GetArea.GetName|Y] должен иметь здание #Y $commerce_building$#! [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_2_pharaoh_task_8_luxor_commerce_counter')] и здание #Y $town_hall_building$#! [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_2_pharaoh_task_8_luxor_hall_counter')]."
 egypt_mission_2_pharaoh_task_8_luxor_commerce_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_8_luxor_commerce_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_8_luxor_commerce_total')|0]#!)"
 egypt_mission_2_pharaoh_task_8_luxor_commerce_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_8_luxor_commerce_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_8_luxor_commerce_total')|0]#!)"
