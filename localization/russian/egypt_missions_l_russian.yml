l_russian:
### Egypt ###
 egypt_mission_1_sea:0 "Талассократия"
 egypt_mission_1_sea_DESCRIPTION:0 "На протяжении тысячелетий [SCOPE.GetRootScope.GetCountry.GetName] существовала и процветала как континентальная держава. Папирусные лодки и деревянные корабли перевозили людей и товары вверх и вниз по Нилу, но открытое море редко интересовало фараонов. Но всё это скоро изменится.\n\nВооружившись вековым греческим опытом мореплавания, [ROOT.GetCountry.GetRuler.GetName] может превратить Египет в морскую державу и получить абсолютный контроль над Восточным Средиземноморьем. Это станет нашим путём к установлению египетского господства над всеми эллинистическими царствами!"
 egypt_mission_1_sea_CRITERIA_DESCRIPTION:0 "Эта миссия будет считаться выполненной, когда Египет получит контроль над Эгейским морем и Восточным Средиземноморьем."
 egypt_mission_1_sea_BUTTON_TOOLTIP:0 "Господство над наследниками Александра требует от Египта укрепить свои позиции на море!"
 egypt_mission_1_sea_BUTTON_DETAILS: ""
 egypt_mission_1_sea_task_1:0 "Александрийские верфи"
 egypt_mission_1_sea_task_1_DESC:0 "Благодаря двум своим гаваням, [GetProvince('(int32)516').GetName] была основана в идеальном месте для контроля над морем. Мы должны максимизировать её потенциал, развивая портовую инфраструктуру."
 egypt_mission_1_sea_task_1.tt:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_1_sea_task_1_foundry_total')|0]#! портов в провинции [GetProvince('(int32)516').GetName|Y]. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_1_sea_task_1_foundry_counter')]"
