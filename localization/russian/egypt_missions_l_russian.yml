 egypt_mission_2_pharaoh_task_8.tt.b:0 "Каждый подконтрольный город в регионе [GetProvince('(int32)576').GetArea.GetName|Y] должен иметь здание #Y $commerce_building$#! [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_2_pharaoh_task_8_aswan_commerce_counter')] и здание #Y $town_hall_building$#! [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_2_pharaoh_task_8_aswan_hall_counter')]."
