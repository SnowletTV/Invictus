 egypt_mission_2_pharaoh_task_9:0 "Город богов"
 egypt_mission_2_pharaoh_task_9_DESC:0 "Благочестие — основа нашей страны. Мы должны чтить наших богов и, в частности, основателя нашего царства, Александра."
 egypt_mission_2_pharaoh_task_9.tt.1:0 "Культ [SCOPE.sCharacter('lagid_goddess_candidate').GetName]-Афродиты Эуплои введён в наш пантеон."
 egypt_mission_2_pharaoh_task_9.tt.2:0 "Культ #Y Афродиты Эуплои#! введён в наш пантеон."
 egypt_mission_2_pharaoh_task_10:0 "Город чудес"
 egypt_mission_2_pharaoh_task_10_DESC:0 "Чтобы наполнить сердца как наших подданных, так и врагов благоговением, мы построим в Александрии чудо, которое переживёт века!"
 egypt_mission_2_pharaoh_task_10.tt:1 "Завершено строительство либо #Y Фаросского маяка#!, либо #Y Храма Муз#! через решения страны."
 egypt_mission_2_pharaoh_task_10.tt.2:0 "Завершено строительство #Y Фаросского маяка#! через решения страны."
 egypt_mission_2_pharaoh_task_11:0 "Фестиваль Птолемеев"
 egypt_mission_2_pharaoh_task_11_DESC:0 "Мы должны отметить glorious наследие, оставленное Птолемеем I нашей стране, фестивалем, способным соперничать с Олимпийскими играми!"
 egypt_mission_2_pharaoh_task_12:0 "Синкретизм"
 egypt_mission_2_pharaoh_task_12_DESC:0 "Религиозные различия между нашими македонскими правителями и подавляющим большинством египетского народа всегда были проблемой для нашего царства. Нам следует рассмотреть решение, которое объединит наш народ."
 egypt_mission_2_pharaoh_task_final:0 "Апофеоз"
 egypt_mission_2_pharaoh_task_final_DESC:0 "Птолемей I Сотер оставил неизгладимый след в нашей стране и народе, и его наследие достойно высочайшего прославления."
 egypt_mission_3_empire:0 "Великая империя"
 egypt_mission_3_empire_DESCRIPTION:0 "Пока войны диадохов бушуют, [SCOPE.GetRootScope.GetCountry.GetName] находится в относительно безопасном положении — защищённая пустынями, морями и нейтральными странами. Наш основатель, Птолемей, был мудр в своём выборе. \n\nОднако [SCOPE.GetRootScope.GetCountry.GetName] может предложить гораздо больше. Мы — последние наследники тысячелетней империи, и мы унаследовали их мечты и потенциал. В частности, у Египта всегда была бурная и неоднозначная история с ближайшими соседями — нубийцами и киренейцами. Они не представляют непосредственной угрозы нашему выживанию, но эти границы нужно усмирить, прежде чем мы сможем безопасно двигаться дальше, а приобретение богатств их земель обеспечит долгосрочное процветание нашего народа. Смелый басилевс может даже использовать эту возможность как трамплин для воссоединения западных греков!"
 egypt_mission_3_empire_CRITERIA_DESCRIPTION:0 "Эта миссия будет считаться выполненной, когда мы утвердим своё доминирование над соседними народами Нубии и Киренаики, используем возможности, предлагаемые нашими южными границами, и определим наши отношения с державами Западного Средиземноморья."
 egypt_mission_3_empire_BUTTON_TOOLTIP:0 "Обеспечьте безопасность [SCOPE.GetRootScope.GetCountry.GetName], завоевав Нубию и Киренаику."
 egypt_mission_3_empire_BUTTON_DETAILS: ""
 egypt_mission_3_empire_task_1:0 "Предприятия Красного моря"
 egypt_mission_3_empire_task_1_DESC:0 "Красное море: мало кто из греков плавал по нему, но богатства, поступающие через него из удивительных земель Аравии и Индии, известны и желанны повсюду. Расширение наших портов — первый шаг к монополизации торговли, текущей в сторону Средиземноморья."
 egypt_mission_3_empire_task_1.tt:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_3_empire_task_1_port_total')|0]#! портовых зданий в провинции [GetProvince('(int32)505').GetName|Y]. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_3_empire_task_1_port_counter')]"
 egypt_mission_3_empire_task_1_port_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_3_empire_task_1_port_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_3_empire_task_1_port_total')|0]#!)"
 egypt_mission_3_empire_task_1_port_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_3_empire_task_1_port_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_3_empire_task_1_port_total')|0]#!)"
 egypt_mission_3_empire_task_2:0 "Торговые станции"
 egypt_mission_3_empire_task_2_DESC:0 "Дружественные отношения с людьми, контролирующими ключевые районы Персидского залива, являются важным шагом для обеспечения нашей торговой мощи в регионе. Мы также должны обеспечить себе безопасный эмпорион."
 egypt_mission_3_empire_task_2.tt.1:0 "Владелец провинции [GetProvince('(int32)4631').GetName|Y] ([GetProvince('(int32)4631').GetOwner.GetName]) имеет мнение о нас не ниже #Y 120#!."
 egypt_mission_3_empire_task_2.tt.2:0 "Владелец провинции [GetProvince('(int32)7502').GetName|Y] ([GetProvince('(int32)7502').GetOwner.GetName]) имеет мнение о нас не ниже #Y 120#!."
 egypt_mission_3_empire_task_3:0 "Отважные мореплаватели"
 egypt_mission_3_empire_task_3_DESC:0 "Торговцы из далёких земель приходят к нам через Красное море и Средиземноморье, но многие из этих земель для нас не более чем легенды. Александр научил нас, что единственным пределом является наша готовность путешествовать до самого края света, и исследователи и интеллектуалы нашего двора жаждут пойти туда, куда не ступала нога грека."
 egypt_mission_3_empire_task_3.tt:0 "Наши исследователи вернутся из далёких земель с сокровищами и информацией."
 egypt_mission_3_empire_task_4:0 "Земля эбенового дерева"
 egypt_mission_3_empire_task_4_DESC:0 "Отношения между Египтом и Нубией восходят к древнейшим временам и всегда были бурными. Пришло время усмирить этот район и утвердить наше господство."
 egypt_mission_3_empire_task_5:0 "Торговля слонами"
 egypt_mission_3_empire_task_5_DESC:0 "Народы Африки давно торговали слоновой костью, но войны Александра в Индии научили нас, что слоны также являются formidable оружием, монополию на которое мы не можем позволить нашим rivals."
 egypt_mission_3_empire_task_6:0 "Сицилийские предприятия"
 egypt_mission_3_empire_task_6_DESC:0 "Западное Средиземноморье, не завоёванное Александром, в основном оставалось вне сферы влияния его преемников. Создание нашего местного присутствия может стать первым шагом к получению доступа к новым землям и богатствам."
 egypt_mission_3_empire_task_6.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] владеет как минимум одним портом в регионе $magna_graecia_region$."
 egypt_mission_3_empire_task_7:0 "Народ Киренаики"
 egypt_mission_3_empire_task_7_DESC:0 "Отношения Египта с его западным соседом всегда были проблематичными; теперь, когда на троне сидит эллинистический фараон, пришло время взять этих заблудших греков под нашу защиту."
 egypt_mission_3_empire_task_7.tt:0 "В зависимости от нашего подхода и ответа Кирены, мы сможем обезопасить Киренаику или, по крайней мере, добиться значительного прогресса в этом направлении."
 egypt_mission_3_empire_task_8:0 "Киренский вопрос"
 egypt_mission_3_empire_task_8_DESC:0 "Киренаика является постоянным источником беспокойства для нас. Пришло время, чтобы она официально стала частью нашего царства."
 egypt_mission_3_empire_task_9:0 "Железный кулак"
 egypt_mission_3_empire_task_9_DESC:0 "Мы не можем доверять киренейцам — они слишком много раз предавали нас раньше. Мы будем действовать с ними железной рукой и убедимся, что они больше никогда не посмеют нам перечить."
 egypt_mission_3_empire_task_9.tt:0 "Принять культурное решение #Y Основать колонию#! на территории культуры киренейцев."
 egypt_mission_3_empire_task_9.tt.2:0 "Правитель региона $cyrenaica_region$ является членом правящей семьи."
 egypt_mission_3_empire_task_10:0 "Интеграция"
 egypt_mission_3_empire_task_10_DESC:0 "Киренейцы — такие же греки, как и мы, и наши ближайшие соседи. Мы должны создать предпосылки для взаимного доверия."
 egypt_mission_3_empire_task_10.tt:0 "Киренейская культура является интегрированной."
 egypt_mission_3_empire_task_11:0 "Западная торговля"
 egypt_mission_3_empire_task_11_DESC:0 "Наши основные интересы расположены в Восточном Средиземноморье. Обеспечение мирного сосуществования с нашим самым могущественным западным соседом greatly benefit нашей торговле и безопасности наших границ."
 egypt_mission_3_empire_task_12:0 "Король западных морей"
 egypt_mission_3_empire_task_12_DESC:0 "Западное Средиземноморье слабо, хаотично и раздроблено. Мы должны воспользоваться возможностью, чтобы агрессивно pursue наши торговые интересы и захватить несколько удобно расположенных портов. Волны станут нашим царством и основой нашей власти."
 egypt_mission_3_empire_task_13:0 "Западные греки"
 egypt_mission_3_empire_task_13_DESC:0 "Одного торгового поста нам недостаточно — не тогда, когда наши братья и сестры-греки живут под постоянной угрозой варварского завоевания как с суши, так и с моря!"
 egypt_mission_3_empire_task_final:0 "Правитель Африки"
 egypt_mission_3_empire_task_final_DESC:0 "Когда наши последние завоевания будут усмирены, наша власть над Африкой станет непревзойдённой."
 egypt_mission_4_border:0 "Восточная граница"
 egypt_mission_4_border_DESCRIPTION:0 "С древнейших времён земли за Синаем представляли собой дальний рубеж египетских интересов. Самые glorious фараоны прошлого вели здесь много битв и расширяли своё господство на север, вдоль побережья. В последнее время все захватчики приходили с этой стороны: сначала персы, затем сам Александр. \n\nПосле смерти Александра этот район был разделён и оспаривался, пока не был объединён под властью Антигона. Птолемей стоял в стороне и ждал; однако эта политика оказалась слишком рискованной, когда Деметрий, сын Антигона, вторгся в Египет и был с трудом отбит. \n\nПришло время встретить врагов с Востока сильной, упреждающей инициативой, чтобы показать египетское превосходство и усмирить самую опасную границу нашей страны."
 egypt_mission_4_border_CRITERIA_DESCRIPTION:0 "Эта миссия будет считаться выполненной, когда восточная граница Египетского царства будет обеспечена путём завоевания Палестины, Финикии, Сирии и побережья Малой Азии, долго оспариваемых диадохами."
 egypt_mission_4_border_BUTTON_TOOLTIP:0 "Отвоюйте Палестину, Финикию, Сирию и побережье Малой Азии у других диадохов."
 egypt_mission_4_border_BUTTON_DETAILS: ""
 egypt_mission_4_border_task_1:0 "Царь сидонян"
 egypt_mission_4_border_task_1_DESC:0 "Сидон является фундаментальной частью нашего плана восточных завоеваний. Установив вассальную монархию, мы обеспечим контроль над её великим портом и знаменитыми кедрами."
 egypt_mission_4_border_task_1.tt:0 "Мы создаём вассальную монархию в Сидоне."
 egypt_mission_4_border_task_2:0 "Финикийские моряки"
 egypt_mission_4_border_task_2_DESC:0 "Финикийцы известны своими кораблями и мореходными талантами. Контролируя основные финикийские порты, мы непременно получим преимущество перед нашими противниками в борьбе за господство в Средиземноморье."
 egypt_mission_4_border_task_3:0 "Безопасность границы"
 egypt_mission_4_border_task_3_DESC:0 "Филистия исторически является сильно оспариваемой территорией. Утверждение нашего господства над её городами и крепостями даст нам более прочную плацдарм для наших восточных завоеваний."
 egypt_mission_4_border_task_3.tt:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_4_border_task_3_fortress_total')|0]#! фортификационных зданий в провинции [GetProvince('(int32)659').GetName|Y]. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_4_border_task_3_fortress_counter')]"
 egypt_mission_4_border_task_3_fortress_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_4_border_task_3_fortress_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_4_border_task_3_fortress_total')|0]#!)"
 egypt_mission_4_border_task_3_fortress_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_4_border_task_3_fortress_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_4_border_task_3_fortress_total')|0]#!)"
 egypt_mission_4_border_task_4:0 "Иудейский вопрос"
 egypt_mission_4_border_task_4_DESC:0 "В нашем расширении на север иудейские царства могут быть полезными союзниками — и подданными — против других диадохов, но нам может быть проще и безопаснее установить прямой контроль над этим районом."
 egypt_mission_4_border_task_5:0 "Пурпурные доки"
 egypt_mission_4_border_task_5_DESC:0 "Прибрежные города Финикии обладают одними из крупнейших и богатейших торговых гаваней в Средиземноморье. Если мы поддержим их рост и торговлю, они придадут нашей экономике и морской мощи значительный импульс."
 egypt_mission_4_border_task_5.tt:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_4_border_task_5_s_trade_total')|0]#! торговых путей в регионе [GetProvince('(int32)743').GetArea.GetName]. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_4_border_task_5_s_trade_counter')]"
 egypt_mission_4_border_task_5_s_trade_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_4_border_task_5_s_trade_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_4_border_task_5_s_trade_total')|0]#!)"
 egypt_mission_4_border_task_5_s_trade_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_4_border_task_5_s_trade_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_4_border_task_5_s_trade_total')|0]#!)"
 egypt_mission_4_border_task_5.tt.2:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_4_border_task_5_n_trade_total')|0]#! торговых путей в регионе [GetProvince('(int32)779').GetArea.GetName]. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_4_border_task_5_n_trade_counter')]"
 egypt_mission_4_border_task_5_n_trade_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_4_border_task_5_n_trade_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_4_border_task_5_n_trade_total')|0]#!)"
 egypt_mission_4_border_task_5_n_trade_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_4_border_task_5_n_trade_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_4_border_task_5_n_trade_total')|0]#!)"
 egypt_mission_4_border_task_6:0 "Антигонидский враг"
 egypt_mission_4_border_task_6_DESC:0 "Когда Антигон находился на пике своей власти в Сирии, его сын Деметрий повёл армию против [GetCountry('EGY').GetName], и его с трудом отбили прежде, чем он смог маршировать на Александрию. В качестве акта символической мести за это бесчестье мы теперь завоюем историческую столицу Антигона — Антигонию!"
 egypt_mission_4_border_task_7:0 "Телмессос"
 egypt_mission_4_border_task_7_DESC:0 "Телмессос — самый богатый порт Ликии. Контролируя этот город, мы обеспечим сильную позицию для наших войск и флотов в сердце Малой Азии, одновременно внимательно наблюдая за Эгейским морем."
 egypt_mission_4_border_task_7.tt:0 "Мы создаём клиентское государство в провинции [GetProvince('(int32)1992').GetName]."
 egypt_mission_4_border_task_8:0 "Киликийские торговцы"
 egypt_mission_4_border_task_8_DESC:0 "Слава киликийских пиратов давно затмила любые хорошие качества Киликии. Как только мы установим контроль над регионом, мы должны искоренить всех пиратов и направить традиционные мореходные навыки киликийцев в русло торговли."
 egypt_mission_4_border_task_8.tt:0 "Ни одна территория в регионах [GetProvince('(int32)796').GetArea.GetName] или [GetProvince('(int32)1892').GetArea.GetName] не имеет модификатора '#Y $pirate_haven_modifier$#!'. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_4_border_task_8_pirates_counter')]"
 egypt_mission_4_border_task_8_pirates_counter_1:0 "(В настоящее время #R [SCOPE.ScriptValue('egypt_mission_4_border_task_8_pirates_current')|0]#!)"
 egypt_mission_4_border_task_8_pirates_counter_2:0 ""
 egypt_mission_4_border_task_9:0 "Киликийские пираты"
 egypt_mission_4_border_task_9_DESC:0 "Киликийские пираты были бичом любой державы, плавающей по Восточному Средиземноморью, включая нас самих. К настоящему времени должно стать ясно, что пиратство в этом районе невозможно искоренить; если вы не можете победить их, вы можете хотя бы сделать их своими друзьями."
 egypt_mission_4_border_task_10:0 "Северные доки"
 egypt_mission_4_border_task_10_DESC:0 "Памфилия является сильно оспариваемой территорией благодаря своим плодородным равнинам, богатым лесам и, в частности, древнему порту Сиде. Наш фокус на Восточном Средиземноморье требует контроля над этим районом для обеспечения безопасного перехода из Александрии на юге к нашим северным владениям."
 egypt_mission_4_border_task_10.tt:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_4_border_task_10_port_total')|0]#! портовых зданий в провинции [GetProvince('(int32)1910').GetName]. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_4_border_task_10_port_counter')]"
 egypt_mission_4_border_task_10_port_counter_1:0 "(#R [SCOPE.ScriptValue('egypt_mission_4_border_task_10_port_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_4_border_task_10_port_total')|0]#!)"
 egypt_mission_4_border_task_10_port_counter_2:0 "(#Y [SCOPE.ScriptValue('egypt_mission_4_border_task_10_port_current')|0]#!/#Y [SCOPE.ScriptValue('egypt_mission_4_border_task_10_port_total')|0]#!)"
 egypt_mission_4_border_task_11:0 "Греки Азии"
 egypt_mission_4_border_task_11_DESC:0 "Иония и Эолида являются домом для некоторых из самых древних и богатых греческих колоний. Они также представляют собой естественную точку доступа к Эгейскому морю, которую нам необходимо контролировать."
 egypt_mission_4_border_task_11.tt:0 "Мы можем пополнить нашу казну или создать вассальное царство."
 egypt_mission_4_border_task_12:0 "Фракийская угроза"
 egypt_mission_4_border_task_12_DESC:0 "Наша экспансия вдоль побережий Азии привела нас к воротам Фракии. Если нам удастся создать несколько сильных баз в Европе, наша позиция в Эгейском море станет значительно более прочной."
 egypt_mission_4_border_task_12.tt.1:0 "[GetProvince('(int32)1774').GetName] принадлежит [SCOPE.GetRootScope.GetCountry.GetName] и имеет либо портовое, либо фортификационное здание."
 egypt_mission_4_border_task_12.tt.2:0 "[GetProvince('(int32)354').GetName] принадлежит [SCOPE.GetRootScope.GetCountry.GetName] и имеет либо портовое, либо фортификационное здание."
 egypt_mission_4_border_task_12.tt.3:0 "[GetProvince('(int32)357').GetName] принадлежит [SCOPE.GetRootScope.GetCountry.GetName] и имеет либо портовое, либо фортификационное здание."
 egypt_mission_4_border_task_13:0 "Умиротворение Иудеи"
 egypt_mission_4_border_task_13_DESC:0 "Земли евреев известны своей беспокойностью. Мы не можем позволить себе оставить потенциально бунтарский район сразу за нашей наступающей восточной границей, поэтому нам нужно обеспечить их лояльность, прежде чем продолжать наши завоевания."
 egypt_mission_4_border_task_13.tt:0 "Все египетские вассалы в регионе [GetProvince('(int32)687').GetArea.GetRegion.GetName] имеют лояльность не менее 60 и мнение о сюзерене не менее 150."
 egypt_mission_4_border_task_13.tt.2:0 "Лояльность провинции в регионе [GetProvince('(int32)687').GetArea.GetName] равна 100."
 egypt_mission_4_border_task_13.tt.3:0 "Лояльность провинции в регионе [GetProvince('(int32)680').GetArea.GetName] равна 100."
 egypt_mission_4_border_task_13.tt.4:0 "Лояльность провинции в регионе [GetProvince('(int32)670').GetArea.GetName] равна 100."
 egypt_mission_4_border_task_final:0 "Прибрежное господство"
 egypt_mission_4_border_task_final_DESC:0 "Наше продвижение вдоль побережий Средиземноморья было неудержимым, подобно Александру. Однако наши соперники, другие диадохи, являются более серьёзным противником, чем персы, и наша мечта о воссоединённой империи Александра всё ещё далека, хотя сегодня мы стали на шаг ближе к ней."