 egypt_mission_2_pharaoh_task_4:0 "Клерухи"
 egypt_mission_2_pharaoh_task_4_DESC:0 "Со времён Александра всё больше греков и македонян нанимались на долгосрочную службу в армии диадохов вдали от своих родных земель. Выделение участка земли в новой стране, где они провели большую часть своей жизни, является хорошим решением для нужд наших ветеранов."
 egypt_mission_2_pharaoh_task_5:0 "Город мудрецов"
 egypt_mission_2_pharaoh_task_5_DESC:0 "Однажды Александрия станет культурной столицей мира! \nЭто первый шаг: сделать её привлекательным местом для греческих интеллектуалов со всего нашего царства."
 egypt_mission_2_pharaoh_task_5.tt:0 "Поэт Каллимах теперь проживает в [GetProvince('(int32)516').GetName|Y]."
 egypt_mission_2_pharaoh_task_6:0 "Город бюрократии"
 egypt_mission_2_pharaoh_task_6_DESC:0 "Для функционирования такой страны, как [SCOPE.GetRootScope.GetCountry.GetName], требуется огромная бюрократическая система. Реформирование нашей администрации сделает систему более эффективной и менее расточительной."
 egypt_mission_2_pharaoh_task_7:0 "Центр мировой торговли"
 egypt_mission_2_pharaoh_task_7_DESC:0 "Дельта — это место встречи египетских и средиземноморских товаров и торговцев. Александрия — её бьющееся сердце, но есть и другие порты и города, которые можно развить для увеличения нашего торгового потенциала."
 egypt_mission_2_pharaoh_task_7_trigger_1:0 "Иметь не менее #Y [SCOPE.ScriptValue('egypt_mission_2_pharaoh_task_7_total_trade_routes_wda')|0]#! входящих торговых путей. [SCOPE.GetRootScope.GetCountry.Custom('egypt_mission_2_pharaoh_task_7_trade_routes_counter_wda')]"
