 #### From Mod - Added Wonders
 
 ### Hellenic ###
 wonder_greek_academy:0 "Платоновская академия"
 wonder_greek_academy_DESC:0 "Основанная Платоном, Афинская школа сохранялась на протяжении всего эллинистического периода как центр обучения и греческой философии. Среди известных членов академии были Спевсипп, Ксенократ, Аристотель, Гераклид, Евдокс Книдский и Гераклид Понтийский."
 wonder_knossos_palace:0 "Дворец в Кноссе"
 wonder_knossos_palace_DESC:0 "Один из старейших городов Европы, Кносс в конечном итоге стал церемониальным и политическим центром древней минойской цивилизации, ныне являющейся лишь тенью самого себя. В греческих легендах царь Минос жил во дворце, построившем лабиринт для легендарного Минотавра."
 wonder_athenian_acropolis:0 "Афинский акрополь"
 wonder_athenian_acropolis_DESC:0 "Древний храмовый цитадель, доминирующий над городом Афины, Акрополь является физическим воплощением афинской славы и мощи."
 wonder_athena_ilias_temple:0 "Храм Афины Илиас"
 wonder_athena_ilias_temple_desc:0 "Расположенный на руинах Трои, храм Афины Илиас вызывает зависть у всего известного мира."
 wonder_delphi_oracle:0 "Дельфийский оракул"
 wonder_delphi_oracle_desc:0 "В Дельфах, пупе мира, где священный камень Омфалос отмечает его центр, находится Оракул, известный как Пифия. Великие цари и простые фермеры отправляются в Дельфы, чтобы услышать указания Аполлона, произнесённые устами смертных."
 wonder_asklepion_epidauros:0 "Асклепион в Эпидавре"
 wonder_asklepion_epidauros_desc:0 "Асклепион в Эпидавре давно является самым прославленным центром исцеления в греческом мире. Его значимость как главного культового места соперничает с такими местами, как святилище храма Зевса в Олимпии и Дельфийский оракул."

 wonder_apadana_susa:0 "Ападана в Сузах"
 wonder_apadana_susa_desc:0 "Построенная Дарием I в церемониальной столице империи Ахеменидов, Ападана в Сузах была величественным аудиторным залом, воплощающим персидский авторитет и архитектурное мастерство."

 wonder_media_temple:0 "Великий храм огня"
 wonder_media_temple_desc:0 "Великий храм огня в Хагматане прошёл через три этапа роста. Первый этаж при мидийском правлении, второй — при персах, и третий — при парфянах. Расположенный в великом городе мидян, он представлял расцветающую мощь иранского народа, который навсегда изменил траекторию Плодородного полумесяца и его богатую историю."
 gw_effect_fire_temple:0 "Великий храм огня"


 ### Punic ###
 wonder_cothon:0 "Великий Кофон Карфагена"
 wonder_cothon_DESC:0 "Великий Кофон в Карфагене был разделён на прямоугольную торговую гавань, за которой следовала внутренняя защищённая гавань и верфь, зарезервированные для флота. Эта внутренняя гавань была круглой и окружена кольцом сухих доков, способных вместить двести двадцать кораблей. В центре находился командный дом, поднятый вверх, чтобы капитан порта мог обозревать всю бухту."
 wonder_numidian_tomb:0 "Нумидийская гробница"
 wonder_numidian_tomb_DESC:0 "Эта гробница была построена как мавзолей для останков великой нумидийской королевской династии."
 wonder_punic_tomb:0 "Пуническая гробница"
 wonder_punic_tomb_DESC:0 "Древняя пуническая гробница, знак уважения к мертвым."
 ### Egyptian ###
 wonder_abu_simbel:0 "Абу-Симбел"
 wonder_abu_simbel_DESC:0 "Два массивных храма, вырубленных в скале в Абу-Симбеле, посвящены солнечным богам Амону-Ра и Ра-Хорахти, в память о битве при Кадеше. В древние времена их колоссальные статуи охраняли южную границу Египта при Рамзесе II."
 ### Mesopotamian ###
 wonder_ur_ziggurat:0 "Великий зиккурат Ура"
 wonder_ur_ziggurat_DESC:0 "Этот ступенчатый храм возвышается до царства богов, построенный шумерами и восстановленный вавилонянами."
 ### Arabian ###
 wonder_marib_dam:0 "Плотина Мариб"
 wonder_marib_dam_DESC:0 "Между тремя горами была построена Великая плотина Мариб сабеями для сбора муссонных дождей."
 ### Judaic ###
 wonder_second_temple_ezra:0 "Второй храм"
 wonder_second_temple_ezra_DESC:0 "Хотя он не может сравниться с Храмом Соломона и лишён многих святых артефактов, таких как Ковчег Завета, этот Второй храм служит местом еврейского поклонения и приношений в соответствии с Торой."
 wonder_second_temple_herod:0 "Второй храм"
 wonder_second_temple_herod_DESC:0 "Реконструированный, пока ещё использовался, этот Второй храм покрывает всю территорию Храмовой горы. Второй храм служит местом еврейского поклонения и приношений в соответствии с Торой."
 gw_effect_second_temple:0 "Церемония Песаха"
 gw_effect_second_temple_DESC:0 "Израильтяне празднуют Песах в течение недели фестивалей, ритуалов и пересказа своего исхода из Египта."
 
 #gw effects
 gw_effect_athenian_acropolis:0 "Афинский акрополь"
 gw_effect_athenian_acropolis_DESC:0 "Древний храмовый цитадель, доминирующий над городом Афины, Акрополь является физическим воплощением афинской славы и мощи."
 gw_effect_athena_ilias_temple:0 "Воля Александра"
 gw_effect_athena_ilias_temple_DESC:0 "Александр планировал расширить храм Афины Илиас до масштабов, которые превзошли бы любой другой храм в известном мире, но умер, прежде чем его видение могло осуществиться. Мы исправили ошибки его наследников и сделали храм Афины Илиас объектом зависти для всех."
 gw_effect_delphi_oracle:0 "Пуп мира"
 gw_effect_delphi_oracle_DESC:0 "Зевс послал двух орлов, чтобы найти пуп мира, и отметил место их встречи, Дельфы, камнем, омфалосом — «пупом Земли». С тех пор греки считали Дельфы центром мира."
 gw_effect_asklepion_epidauros:0 "Медицинское мастерство"
 gw_effect_asklepion_epidauros_DESC:0 "" 
 gw_effect_apadana_susa:0 "Царь царей"
 gw_effect_apadana_susa_DESC:0 "" 
 #######################################
 gw_effect_marib_dam:0 "Плотина Мариб"
 gw_effect_marib_dam_DESC:0 "Плотина Мариб была древним чудом инженерии. Построенная в VIII веке до н.э., она удобряла большую часть регионов на протяжении веков."
 gw_effect_cothon:0 "Великий Кофон"
 gw_effect_cothon_DESC:0 "Великий Кофон Карфагена вмещал большой карфагенский флот."
 gw_effect_knossos:0 "Дворец в Кноссе"
 gw_effect_knossos_DESC:0 "Древний дворец в Кноссе является свидетельством минойской культуры и цивилизации бронзового века."
 gw_effect_punic_tomb:0 "Пуническая гробница"
 gw_effect_punic_tomb_DESC:0 "Древняя пуническая гробница, знак уважения к мертвым."
 gw_effect_abu_simbel:0 "Абу-Симбел"
 gw_effect_abu_simbel_DESC:0 "Абу-Симбел commemorates битву при Кадеше и вдохновляет на новые, подобные подвиги под руководством обожествлённого Рамзеса II."
 gw_effect_ur_ziggurat:0 "Зиккурат Ура"
 gw_effect_ur_ziggurat_DESC:0 "Старый зиккурат месопотамских народов, посвящённый богу луны Нанне. Многие приносили сюда свою еду, чтобы сохранить её."
 gw_effect_hippodrome_barce:0 "Ипподром Барки"
 gw_effect_hippodrome_barce_DESC:0 "Ипподром Барки является домом для великих гоночных событий, привлекающих все африканские народы. Он находится под покровительством покровителя соревнований и покровительницы Барки, леди Барки."
 
