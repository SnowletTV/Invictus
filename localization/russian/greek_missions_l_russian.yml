l_russian:
### Missions
# Black Sea
 greek_1_black_sea:0 "Гостеприимное море"
 greek_1_black_sea_BUTTON_TOOLTIP:0 "Эллины севера нуждаются в лидерстве."
 greek_1_black_sea_BUTTON_DETAILS:0 ""
 greek_1_black_sea_DESCRIPTION:0 "События последних ста лет доказали необходимость объединения разрозненных колоний Понта Эвксинского, добровольно или силой, если они хотят выжить перед лицом возвышения диадохов, иностранных подражателей и варваров."
 greek_1_black_sea_CRITERIA_DESCRIPTION:0 "Установить гегемонию в Понте Эвксинском."
 greek_1_black_sea_REWARD_DESCRIPTION:0 "Контроль над эллинскими колониями Черного моря и их возрождение."
 greek_1_loyalty_reward_tt:0 "Каждый член семьи #Y [gm_family_head_1.GetFamilyDisplayAdjective]#! получит #G 10#! лояльности @loyalty_icon!"
 greek_1_4:0 "Наше море"
 greek_1_4_DESC:0 "Хотя у нас может не быть прямого доступа к богатым портам запада, мы всё ещё можем много выиграть, обеспечив полный контроль над восточной торговлей в Понте Эвксинском."
 greek_1_4_allow_tt:1 "Владеть как минимум #Y 10#! портами на Черном море с культурой #Y $hellenic$#!. ([SCOPE.Custom('gre_mission_1_4_custom_loc')]/#Y 10#!)"
 gre_mis_1_4_allow_sv_ongoing:0 "#R [SCOPE.ScriptValue('gre_mis_1_4_current')|0]#!"
 gre_mis_1_4_allow_sv_complete:0 "#Y [SCOPE.ScriptValue('gre_mis_1_4_current')|0]#!"
 greek_1_2:0 "Приют аргонавтов"
 greek_1_2_DESC:0 "Мифы о Геракле и Ясоне показывают, как далеко эти земли ушли от темных дней прошлого; мы можем продвинуть их еще дальше, создав бастион культуры, способный соперничать с любым западным центром."
 greek_1_2_allow_tt:1 "Владеть портом на Черном море, который:\n * Имеет статус #Y Город#!\n * Доминирующая культура входит в группу #Y $hellenic$#! \n * Имеет значение цивилизации не менее #Y 40#!\n * Имеет #Y Рынок#!\n * Не имеет текущего строительства\n * Имеет не менее #Y 20#! населения\n * Доля рабов @slaves! составляет менее #Y 33%#!\n * Доля племенников @tribesmen! составляет менее #Y 33%#!"
 greek_1_2_reward_tt1:1 "Город [me_gre_1_argo_scope.GetName] получит поселенцев и выбор постоянного бонуса."
 greek_1_2_reward_tt2:1 "Самый населенный соответствующий город получит поселенцев и выбор постоянного бонуса."
 greek_1_3:0 "Обеспечить проход Быка"
 greek_1_3_DESC:0 "Ио, возлюбленная Зевса, родившая линию Геракла, пересекла здесь Азию в бычьей форме, дав ему название Боспор. Этот пролив контролирует большую часть торговли в регионе, и его обеспечение стало бы большим благом."
 greek_1_3_allow_tt:1 "По крайней мере одна из вышеуказанных территорий:\n * Имеет статус #Y Город#!\n * Имеет не менее #Y 2#! крепостей"
 greek_1_3_reward_tt:0 "Крупнейшая соответствующая территория получит бонус и поселенцев."
 greek_1_5:0 "Подход к колонии"
 greek_1_5_DESC:0 "Наши соотечественники-греки разделены, соперничая за свои мелкие торговые связи и местный экспорт. Мы должны убедить их мечтать о большем и помочь делу всех северных греков."
 greek_1_5_allow_tt:0 "Существуют любые свободные греческие государства с менее чем #Y 5#! территориями вокруг побережья Черного моря."
 greek_1_5_reward_tt:0 "Может получить эллинского вассала."
 greek_1_6:0 "Эллинское возвращение"
 greek_1_6_DESC:0 "Удача греческих колонистов пошла на спад в Понте Эвксинском, теснимая со всех сторон мигрирующими варварскими ордами. Нам следует вернуть один из этих старых приютов."
 greek_1_6_allow_tt:0 "Завоевать исторически греческий порт на Черном море, удерживаемый не-греками.\n\n#Y Возможные цели выделены на карте.#!"
 greek_1_6_reward_tt:0 "Территория может быть освобождена как вассал."
 greek_1_7:0 "Побережье Вифинии"
 greek_1_7_DESC:0 "Мы должны искать новые рынки и расширять наше влияние на новую часть моря, если хотим обеспечить гегемонию над нашими конкурентами."
 greek_1_7_reward_tt:0 "Государства этих территорий получат"
 greek_1_8:0 "Взломать Херсонес"
 greek_1_8_DESC:0 "$greek_1_7_DESC$"
 greek_1_9:0 "Сад Ээта"
 greek_1_9_DESC:0 "$greek_1_7_DESC$"
 greek_1_10:0 "Побережье гетов"
 greek_1_10_DESC:0 "$greek_1_7_DESC$"
 greek_1_13:0 "Милетская мечта"
 greek_1_13_DESC:0 "Почти все эллинское присутствие в Понте Эвксинском происходит от сотен лет усилий наших торговцев и колонистов. Мы должны вернуть то, что существует только благодаря нашим усилиям."
 greek_1_13_reward_tt:0 "Граждане поселятся в каждой из возвращенных территорий."
 greek_1_12:0 "Мегарская мечта"
 greek_1_12_DESC:0 "$greek_1_13_DESC$"
 greek_1_12_reward_tt:0 "$greek_1_13_reward_tt$"
 greek_1_11:0 "Патрулирование Эвксина"
 greek_1_11_DESC:0 "Если мы хотим максимально использовать нашу торговлю в Понте Эвксинском, мы должны убедиться, что его воды относительно безопасны для торговцев и путешественников."
 greek_1_11_allow_tt:0 "Флот с не менее чем #Y 30#! либурнами @liburnian! возглавляется адмиралом из семьи #Y [gm_family_head_1.GetFamilyDisplayAdjective]#!."
 greek_1_11_reward_tt:0 "Назначенный адмирал получит #G 15#! лояльности @loyalty_icon!\nВыбор морского бонуса."
 greek_1_14:0 "Варварский бартер"
 greek_1_14_DESC:0 "Мирное расширение торговых возможностей — это старая греческая традиция, и действительно, не всегда необходимо прибегать к копью и щиту, чтобы получить доступ к рынку."
 greek_1_14_allow_tt_1:0 "#Y [gm_1_greek_scope.GetRulerTitle] [gm_1_greek_scope.GetRuler.GetPraenomen]#! имеет не менее #Y 6#! харизмы @oratory_icon!"
 greek_1_14_allow_tt_2:1 "Любой порт на Черном море в пределах досягаемости контроля принадлежит не-#Y $hellenic$#! стране, с которой мы находимся в мире, и которая имеет мнение о нас выше #R -50#!."
 greek_1_14_reward_tt:1 "Может купить эвксинский порт у не-$hellenic$ страны."
 greek_1_15:0 "Искоренить пиратство"
 greek_1_15_DESC:0 "Единственный способ защитить наши торговые пути и интересы наших граждан — положить конец пиратским бродягам, которые паразитируют на их усилиях."
 greek_1_15_allow_tt:1 "Нет #Y Пиратских логовищ#! вокруг Понта Эвксинского, удерживаемых не-вассалами. (В настоящее время: #R [SCOPE.ScriptValue('gre_mis_1_haven_ongoing_unowned_target')|0]#!)\n$greek_1_haven_tt$"
 greek_1_haven_tt:0 "\n#Y Пиратские логовища#! можно увидеть на картах дипломатии, торговых путей, торговых товаров, варварской силы и регионов."
 greek_1_16:0 "Пасти корсаров"
 greek_1_16_DESC:0 "Избавление от пиратов не обязательно должно быть кровавым делом; в конце концов, они охотятся только за богатством и могут быть готовы уйти при правильном стимуле."
 greek_1_16_allow_tt:0 "Удерживает не менее 3 #Y Пиратских логовищ#! вокруг Понта Эвксинского. ([SCOPE.Custom('gre_mission_1_haven_3_custom_loc')]/#Y [SCOPE.ScriptValue('gre_mis_1_haven_target_3')|0]#!)\n$greek_1_haven_tt$"
 greek_1_16_reward_tt:0 "Удерживаемые пиратские логовища в Понте Эвксинском будут оплачены за перемещение в другую часть мира."
 greek_2_16_mod_tt:1 "Все $hellenic$ вассалы получат"
 greek_1_17:0 "Повелевать пиратами"
 greek_1_17_DESC:0 "Наши купцы смотрят на пиратов неправильно; они были бы отличным ресурсом опытных моряков прямо у нашего порога, если бы их только можно было обуздать."
 greek_1_17_allow_tt:1 "Удерживает все, и не менее 3, #Y Пиратских логовищ#! вокруг Понта Эвксинского, не удерживаемых вассалами. ([SCOPE.Custom('gre_mission_1_haven_all_custom_loc')]/#Y [SCOPE.ScriptValue('gre_mis_1_haven_ongoing_all_target')|0]#!)\n$greek_1_haven_tt$"
 gre_mis_1_haven_all_allow_sv_ongoing:0 "#R [SCOPE.ScriptValue('gre_mis_1_17_count')|0]#!"
 gre_mis_1_haven_all_allow_sv_complete:0 "#Y [SCOPE.ScriptValue('gre_mis_1_17_count')|0]#!"
 greek_1_18:0 "Безопасность [SCOPE.Custom('skythoi_security_title')]"
 greek_1_18_DESC:0 "Наша экономика зависит от поддержания торговых постов вдоль побережья Эвксина, но варварские внутренние районы не обязательно должны находиться под прямым правлением. Обеспечение союзника для отражения враждебных племен пошло бы нам на пользу."
 skythoi_security_title_1:0 "Скифов"
 skythoi_security_title_2:0 "Анатолийских"
 skythoi_security_title_3:0 "Колхидских"
 greek_1_18_allow_tt_1:2 "Союзная племенная страна входит в культурную группу #Y $scythia$#!, имеет не менее #Y 8#! территорий, не менее #Y 100#! мнения о нас и столицу в регионе #Y $taurica_region$#!, #Y $scythia_region$#! или #Y $sarmatia_asiatica_region$#!."
 greek_1_18_allow_tt_2:3 "Союзная племенная страна входит в культурную группу #Y $anatolian$#! или #Y $caucasian$#!, имеет не менее #Y 8#! территорий, не менее #Y 100#! мнения о нас и столицу в регионе #Y $bithynia_region$#!, #Y $galatia_region$#!, #Y $cappadocia_region$#!, #Y $colchis_region$#!, #Y $armenia_region$#! или #Y $albania_region$#!."
 greek_1_19:0 "Меотийские амбиции"
 greek_1_19_DESC:0 "Самая удаленная часть Понта Эвксинского лежит за Киммерийским Боспором и через Меотийские болота — там ждет торговый пост Танаис со своими экзотическими скифскими прелестями."
 greek_1_19_allow_tt:2 "[gm_1_greek_scope.GetName] владеет #Y [GetProvince('(int32)4557').GetName]#!, который:\n * Имеет статус #Y Город#!\n * Доминирующая культура входит в группу #Y $hellenic$#! \n * Имеет #Y $temple_building$#!\n * Не имеет текущего строительства\n * Имеет не менее #Y 10#! населения\n * Доля рабов @slaves! составляет менее #Y 33%#!\n * Доля племенников @tribesmen! составляет менее #Y 33%#!"
 # Greece
 greek_2_greece:0 "Панэллинское правительство"
 greek_2_greece_BUTTON_TOOLTIP:0 "Эллины повсюду взывают к свободе и лидерству."
 greek_2_greece_BUTTON_DETAILS:0 ""
 greek_2_greece_DESCRIPTION:0 "Со времен персидского вторжения становится всё более очевидным, что силы эллинской цивилизации растрачиваются впустую, когда разделение делает нас легкой добычей для иностранных захватчиков. Если Греция хочет процветать в эти странные времена, её народ должен объединиться под руководством сильной фигуры."
 greek_2_greece_CRITERIA_DESCRIPTION:0 "Установить гегемонию над Грецией."
 greek_2_greece_REWARD_DESCRIPTION:0 "Формирование Эллинского союза."
 me_gre_2_abort_block_tt:0 "#Y Эллинский союз#! не сможет быть сформирован в течение 20 лет."
 greek_2_1:0 "Гегемон эллинов"
 greek_2_1_DESC:0 "Пришло время для истинного греческого лидерства в эллинском мире, объединяющего разрозненные голоса Греции в новое, мощное единое государство — под нашим руководством."
 greek_2_2:0 "Панэллинское освобождение"
 greek_2_2_DESC:0 "Слишком долго эллины страдали под принудительными гарнизонами, навязанными иностранными повелителями. Пришло время вернуть нашу свободу и свободу всей Греции."
 greek_2_3:0 "Освободить город"
 greek_2_3_DESC:0 "Свободные эллины Греции стали жертвами наступающей македонской монархии и преемников тщеславных амбиций Александра. Мы должны защитить наших братьев от этого иностранного влияния."
 greek_2_3_allow_tt:0 "Отвоевать греческую территорию у диадоха, иностранного захватчика или их вассалов."
 greek_2_3_reward_tt:1 "Может освободить территорию как вассала #Y feudatory#!.\nСтраны $hellenic$ в Греции улучшат мнение о [gm_2_greek_scope.GetName]."
 greek_2_4:0 "Восстановить олигархию"
 greek_2_4_DESC:0 "Демократы Эллады слишком долго ослабляли и сбивали с пути греческий народ; пришло время распространить разумное правление на эллинский мир."
 greek_2_4_reward_tt:1 "[gm_2_greek_scope.GetName] получит претензии на все не-олигархические республики $hellenic$ в Греции."
 greek_2_5:0 "Восстановить демократию"
 greek_2_5_DESC:0 "Олигархи, монархи и тираны Греции слишком долго подрывали свободу нашего народа; пришло время привести наших братьев к свободе и самоуправлению."
 greek_2_5_reward_tt:1 "[gm_2_greek_scope.GetName] получит претензии на все олигархии и монархии $hellenic$ в Греции."
 greek_2_6:0 "Подход к родственным"
 greek_2_6_DESC:0 "Есть другие греческие государства, которые разделяют наши традиции и форму правления; мы должны попытаться убедить их, что подчинение нашему руководству — единственный способ обеспечить нашу дальнейшую свободу."
 greek_2_6_reward_tt:1 "[gm_2_greek_scope.GetName] может убедить другие similarly governed страны $hellenic$ стать их вассалами.\nБудут approached только те, которые существуют на момент завершения этой задачи."
 greek_2_6_allow_tt_1:1 "Существует по крайней мере одна независимая монархия или олигархия $hellenic$ $me_greek_2_regions_tt$ (В настоящее время: #Y [SCOPE.ScriptValue('gm_2_kindred_counter_svalue')|0]#!)"
 greek_2_6_allow_tt_2:1 "Существует по крайней мере одна независимая не-олигархическая республика $hellenic$ $me_greek_2_regions_tt$ (В настоящее время: #Y [SCOPE.ScriptValue('gm_2_kindred_counter_svalue')|0]#!)"
 me_greek_2_regions_tt:2 "в регионе #Y $greece_region$#! или провинции #Y $thessaly_area$#!, исключая области #Y $crete_area$#! и #Y $epirus_area$#!, которая меньше и находится в мире с [gm_2_greek_scope.GetName]."
 greek_2_7:0 "Панэллинская столица"
 greek_2_7_DESC:0 "За века в Греции было много престижных и многолюдных городов, но если мы хотим построить новое государство для всех греков, наша столица должна быть готова к этой задаче."
 greek_2_7_allow_tt:1 "Столица [gm_2_greek_scope.GetName] находится в регионе #Y $greece_region$#! и имеет статус #Y Метрополия#!."
 greek_2_7_reward_tt:0 "Все эллинские страны улучшат мнение о [gm_2_greek_scope.GetName] на #G 20#!."
 greek_2_8:0 "Вдохновляющий эллин"
 greek_2_8_DESC:0 "Чтобы объединить эллинский народ, нам нужно вдохновить их лидерством героической фигуры, объединяющим символом, вокруг которого они смогут собраться против диадохов, реакционеров и захватчиков."
 greek_2_8_allow_tt_1:0 "#Y [gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen]#! является генералом или адмиралом, возглавляющим не менее #Y 15#! когорт или кораблей."
 greek_2_8_allow_tt_2:0 "#Y [gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen]#! является назначенным #Y Диктатором#!."
 greek_2_8_allow_tt_3:0 "#Y [gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen]#! имеет не менее #Y 70#! популярности @popularity_icon!"
 greek_2_8_allow_tt_4:0 "#Y [gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen]#! выиграл битву за последние #Y 720#! дней."
 greek_2_8_reward_tt:0 "Командуемое подразделение получит бонус к морали."
 greek_2_9:0 "Великие города"
 greek_2_9_DESC:0 "Хотя все эллины Греции внесли свой вклад в её величие, есть несколько городов, которые лежат в основе её успеха. Эти центры должны быть объединены под нашим правлением, если мы хотим представлять эллинское наследие."
 greek_2_9_allow_tt:1 "#Y [GetProvince('(int32)416').GetName]#!, #Y [GetProvince('(int32)427').GetName]#!, #Y [GetProvince('(int32)426').GetName]#!, #Y [GetProvince('(int32)418').GetName]#! и #Y [GetProvince('(int32)424').GetName]#! принадлежат [gm_2_greek_scope.GetName] или её $hellenic$"
 greek_2_9_allow_tt_1:0 "$greek_2_9_allow_tt$ не-олигархическим республиканским вассалам."
 greek_2_9_allow_tt_2:0 "$greek_2_9_allow_tt$ олигархическим или монархическим вассалам."
 greek_2_10:0 "Делийские устремления"
 greek_2_10_DESC:0 "Афинская модель доминирования в Греции избегала открытых конфликтов и насилия, сосредотачиваясь на привлечении союзников через торговлю и объединении против внешних угроз."
 greek_2_10_allow_tt:1 "[gm_2_greek_scope.GetName] имеет не менее #Y 6#! $hellenic$ #Y данников#! с не-олигархическим #Y Республиканским#! правительством, которые владеют хотя бы одним портом."
 greek_2_11:0 "Лаконские замыслы"
 greek_2_11_DESC:0 "Спартанская модель расширения контроля над Грецией избегала дипломатии или торговли, сосредотачиваясь на силовом захвате городов и установке дружественных правительств, поддерживаемых гарнизонами."
 greek_2_11_allow_tt:1 "[gm_2_greek_scope.GetName] имеет не менее #Y 6#! $hellenic$ #Y вассалов#! с правительством #Y Олигархическая республика#! или #Y Монархия#!."
 greek_2_12:0 "Империя [gm_2_greek_scope.GetAdjective]"
 greek_2_12_DESC:0 "Только когда все эллины Греции будут объединены под общим правительством, она сможет должным образом защитить себя от растущих угроз с запада и востока."
 greek_2_12_allow_tt:2 "Весь регион #Y $greece_region$#! и провинция #Y $thessaly_area$#!, исключая области #Y $epirus_area$#! и #Y $crete_area$#!, принадлежат [gm_2_greek_scope.GetName] или её вассалам."
 greek_2_12_reward_tt_1:1 "Все $hellenic$ данники в Греции станут вассалами.\n[gm_2_greek_scope.GetName] решит, как управлять Грецией."
 greek_2_12_reward_tt_2:1 "Все $hellenic$ вассалы в Греции будут #Y аннексированы#!.\n[gm_2_greek_scope.GetName] решит, как управлять Грецией."
 greek_2_12_reward_tt:0 "[gm_2_greek_scope.GetName] получит #Y претензии#! на эллинские области near Греции."
 greek_2_13:0 "Эллинский освободитель"
 greek_2_13_DESC:0 "Только когда границы Греции будут защищены, а её утраченные владения возвращены, наши умы смогут успокоиться. Больше ни один грек не будет жить в тени Македонии, как долго страдали фессалийцы."
 greek_2_13_allow_tt_1:2 "Нет территорий в регионе #Y $greece_region$#! или провинции #Y $thessaly_area$#!, исключая области #Y $epirus_area$#! и #Y $crete_area$#!, принадлежащих царствам диадохов, иностранным захватчикам или их вассалам."
 greek_2_13_allow_tt_2:0 "[gm_2_greek_scope.GetName] или вассал отвоевал территорию у вышеупомянутых."
 greek_2_13_reward_tt:0 "$me_greek_2_20_op_tt$"
 greek_2_14:0 "Удар по Македонии"
 greek_2_14_DESC:0 "Эллины пережили многочисленные вторжения со стороны македонских варваров; пришло время показать им, каково это — оказаться на острие наших копий, хоть раз."
 greek_2_14_allow_tt:0 "[gm_2_greek_scope.GetName] владеет или оккупировал #Y [GetProvince('(int32)428').GetName].#!"
 greek_2_14_reward_tt:0 "Эллинские страны в Греции улучшают мнение о [gm_2_greek_scope.GetName] на #G 50#!\nВсе диадохи ухудшают мнение о [gm_2_greek_scope.GetName] на #R 50#!."
 greek_2_15:0 "Панэллинские ополчения"
 greek_2_15_DESC:0 "Мы дадим понять, что, независимо от города происхождения солдата, армии [gm_2_greek_scope.GetName] приветствуют любых эллинских добровольцев, готовых сражаться против врагов Греции и защищать её границы."
 greek_2_15_allow_tt:1 "[gm_2_greek_scope.GetName] имеет не менее #Y 1#! $hellenic$ #Y вассала#! с правительством #Y Олигархическая республика#! или #Y Монархия#!."
 greek_2_15_reward_tt:1 "Все $hellenic$ данники с не-олигархическим республиканским правительством потеряют доход и лояльность в пользу [gm_2_greek_scope.GetName]."
 greek_2_16:0 "Стандартизация мер"
 greek_2_16_DESC:0 "Афины извлекли большую выгоду из своего положения лидера Делосского союза, частично поощряя стандартную систему весов и мер для облегчения торговли и увеличения своего влияния на окружающие территории."
 greek_2_16_allow_tt:1 "[gm_2_greek_scope.GetName] имеет не менее #Y 1#! $hellenic$ #Y данника#! с не-олигархическим #Y Республиканским#! правительством, который владеет хотя бы одним портом."
 greek_2_16_reward_tt:1 "Все $hellenic$ вассалы с монархией или олигархической республикой потеряют людские ресурсы и лояльность в пользу [gm_2_greek_scope.GetName]."
 greek_2_18:0 "Талассократия"
 greek_2_18_DESC:0 "Сила Эллады всегда заключалась в её легком доступе к морю, а через него — к рынкам и побережьям мира. Подобно Афинам, мы будем использовать преимущества морской мощи, чтобы обеспечить защиту греков повсюду."
 me_gre_2_league_reward:0 "[gm_2_greek_scope.GetName] сформирует #Y Эллинский союз#!."
 # Magna Graecia
 greek_3_italiote:0 "Великая Греция"
 greek_3_italiote_BUTTON_TOOLTIP:0 "Эллины Великой Греции должны быть объединены."
 greek_3_italiote_BUTTON_DETAILS:0 ""
 greek_3_italiote_DESCRIPTION:0 "Города италиотов Великой Греции спорили о региональном доминировании и позволили себе стать добычей италийских племен. В грядущие дни наш город должен взять на себя бремя лидерства италиотов, если Великая Греция хочет выжить."
 greek_3_italiote_CRITERIA_DESCRIPTION:0 "Установить лидерство среди италийских греков."
 greek_3_1:0 "Обрести свободу"
 greek_3_1_DESC:0 "Если мы хотим сбросить оковы иностранного господства и восстановить гордость нашего города, мы должны сплотить народ вокруг дела свободы и побудить его к действию."
 greek_3_1_reward_tt:0 "[gm_3_greek_scope.GetName] может обеспечить свою свободу или средства для её возвращения."
 greek_3_1_claim_tt:0 "[gm_3_greek_scope.GetName] получит претензии на соседние территории, принадлежащие [gm_3_greek_scope.GetOverlord.GetName]."
 greek_3_2:0 "Вдохновить население"
 greek_3_2_DESC:0 "Если мы хотим преодолеть наше положение незначительного города, мы должны проявить инициативу и приобрести ресурсы наших соседей. Сплочение населения города — первый шаг к достижению наших амбиций."
 greek_3_2_allow_tt:0 "[gm_3_greek_scope.GetName] не является вассалом."
 greek_3_3:0 "$greek_3_10$"
 greek_3_3_DESC:0 "$greek_3_10_DESC$"
 greek_3_3_allow_tt:1 "Столица [gm_3_greek_scope.GetName] находится в регионе #Y $central_italy_region$#! или материковой части #Y $magna_graecia_region$#! и имеет статус #Y Метрополия#!."
 greek_3_4:0 "Лига италиотов"
 greek_3_4_DESC:0 "В прошлом города италиотов объединялись в лигу, защищая друг друга от италийских захватчиков и дерзких соседей. Нам следует возродить эту федерацию как средство заявления о лидерстве италиотов."
 greek_3_4_allow_tt_1:0 "[gm_3_greek_scope.GetName] и её вассалы-италиоты владеют не менее #Y 5#! территориями италиотов. ([SCOPE.Custom('gre_mission_3_4_custom_loc')]/#Y 5#!)"
 greek_3_4_allow_tt_2:1 "Существует по крайней мере одна страна италиотов в регионах #Y $magna_graecia_region$#! или #Y $central_italy_region$#! с меньшим количеством территорий, чем у [gm_3_greek_scope.GetName]."
 greek_3_4_reward_tt:0 "Вассалы-италиоты будут аннексированы.\nЕсли они существуют, города-государства италиотов могут добровольно присоединиться к нашей лиге."
 gre_mis_3_4_allow_sv_ongoing:0 "#R [SCOPE.ScriptValue('me_gre_3_4_svalue')|0]#!"
 gre_mis_3_4_allow_sv_complete:0 "#Y [SCOPE.ScriptValue('me_gre_3_4_svalue')|0]#!"
 greek_3_5:0 "Эллинская месть"
 greek_3_5_DESC:0 "Возвышение италийских племен брутиев и луканов подвергло города италиотов варварским вторжениям, грабежам и порабощению. Мы должны отомстить за эти оскорбления."
 greek_3_5_allow_tt_1:0 "#Y [GetCountry('BRT').GetName]#! является вассалом [gm_3_greek_scope.GetName] ИЛИ не существует, и [gm_3_greek_scope.GetName] владеет частью её бывшей территории (#Y [GetProvince('(int32)51').GetName]#!, #Y [GetProvince('(int32)77').GetName]#!, #Y [GetProvince('(int32)79').GetName]#!, #Y [GetProvince('(int32)74').GetName]#! или #Y [GetProvince('(int32)76').GetName]#!)."
 greek_3_5_allow_tt_2:0 "#Y [GetCountry('LCA').GetName]#! является вассалом [gm_3_greek_scope.GetName] ИЛИ не существует, и [gm_3_greek_scope.GetName] владеет частью её бывшей территории (#Y [GetProvince('(int32)53').GetName]#!, #Y [GetProvince('(int32)71').GetName]#!, #Y [GetProvince('(int32)70').GetName]#!, #Y [GetProvince('(int32)59').GetName]#! или #Y [GetProvince('(int32)60').GetName]#!)."
 greek_3_5_allow_tt_3:0 "#Y [GetCountry('SAM').GetName]#! является вассалом [gm_3_greek_scope.GetName] ИЛИ не существует, и [gm_3_greek_scope.GetName] владеет частью её бывшей территории (#Y [GetProvince('(int32)33').GetName]#!, #Y [GetProvince('(int32)44').GetName]#!, #Y [GetProvince('(int32)45').GetName]#!, #Y [GetProvince('(int32)42').GetName]#!, [GetProvince('(int32)46').GetName]#!, #Y [GetProvince('(int32)43').GetName]#!, #Y [GetProvince('(int32)10').GetName]#!, #Y [GetProvince('(int32)1716').GetName]#!, [GetProvince('(int32)1718').GetName]#!, #Y [GetProvince('(int32)41').GetName]#! или #Y [GetProvince('(int32)32').GetName]#!)."
 greek_3_6:1 "Стабильность [gm_3_greek_scope.GetAdjective]"
 greek_3_6_DESC:0 "Наш город имеет долгую историю и за годы был вовлечен во многие войны. Эти споры были улажены, вплоть до настоящего момента."
 greek_3_7:0 "Запросить помощь"
 greek_3_7_DESC:0 "Если мы хотим пережить натиск наших греческих соперников и италийских соседей, мы не должны быть слишком горды, чтобы просить помощи у тех, кто может её оказать."
 greek_3_7_allow_tt_1:1 "[gm_3_greek_scope.GetName] находится в войне с не-$hellenic$ странами и имеет менее #Y 50%#! от своей сухопутной силы."
 greek_3_7_allow_tt_2:1 "Любая #Y $hellenic$#! страна в регионах #Y $magna_graecia_region$#!, #Y $central_italy_region$#! или #Y $greece_region$#! имеет большее население, мнение выше #R -25#! и не воюет с [gm_3_greek_scope.GetName]."
 greek_3_8:0 "Зависимость от наемников"
 greek_3_8_DESC:0 "Постоянные войны и общий исход заставили нас полагаться на италийских наемников для большинства наших оборонительных нужд. Они окажутся полезными в грядущие дни."
 greek_3_9:0 "Италийские обновления"
 greek_3_9_DESC:0 "Наш город столкнулся с упадком в последнем столетии, подвергаясь нападениям со стороны роста наших соседей, как греческих, так и иностранных. Если мы хотим стать доминирующими игроками в регионе, мы должны сначала восстановить нашу столицу."
 greek_3_9_allow_tt:1 "[gm_3_greek_scope.GetCapital.GetName]:\n * Имеет статус #Y Город#!\n * Доминирующая культура входит в группу #Y $hellenic$#! \n * Доминирующая религия — #Y $roman_pantheon$#!\n * Имеет не менее #Y 20#! населения\n * Не имеет свободных слотов для зданий\n * Имеет значение цивилизации не менее #Y 40#!\n * Доля рабов @slaves! составляет менее #Y 33%#!\n * Доля племенников @tribesmen! составляет менее #Y 33%#!"
 greek_3_10:0 "Соперничать с метрополией"
 greek_3_10_DESC:0 "Великая Греция когда-то хвасталась самыми изысканными городами эллинского мира, до разрушения Сибариса и италийских войн. Мы сделаем так, чтобы это стало реальностью вновь."
 greek_3_10_allow_tt:1 "Столица [gm_3_greek_scope.GetName] находится в материковом регионе #Y $magna_graecia_region$#! и имеет статус #Y Метрополия#!."
 greek_3_11:0 "Освобожденные италиоты"
 greek_3_11_DESC:0 "Эллинские города в Великой Греции слишком долго терпели италийское подчинение. Старые дни эллинского превосходства должны вернуться."
 greek_3_11_allow_tt:1 "Нет #Y $hellenic$#! стран в материковом регионе #Y $magna_graecia_region$#!, являющихся вассалами не-$hellenic$ стран."
 greek_3_12:0 "Греческая Италия"
 greek_3_12_DESC:0 "Наши предки сражались с коренными жителями Италии и вышли победителями. Если мы хотим确保, чтобы Великая Греция оставалась греческой, мы должны привести все её земли под эллинское влияние."
 greek_3_12_allow_tt_1:1 "Нет не-#Y $hellenic$#! стран в материковом регионе #Y $magna_graecia_region$#!, или если они есть, то все они являются вассалами $hellenic$ стран."
 greek_3_12_allow_tt_2:1 "Если какие-либо не-#Y $hellenic$#! страны существуют в материковом регионе #Y $magna_graecia_region$#!, [gm_3_greek_scope.GetName] является сюзереном по крайней мере одной из них. (Текущее: #Y [SCOPE.ScriptValue('me_gre_3_12_svalue')|0]#!)"
 greek_3_13:0 "Отношения с метрополией"
 greek_3_13_DESC:0 "Как и все города италиотов, наши первоначальные поселенцы прибыли из Греции. Демонстрация наших исторических связей может завоевать нам благодарное расположение нашего материнского города."
 greek_3_13_allow_tt_1:0 "#Y [SCOPE.Custom('get_gre_3_metropolis_1')]#! существует и владеет [SCOPE.Custom('get_gre_3_metropolis_2')] ИЛИ владелец #Y [SCOPE.Custom('get_gre_3_metropolis_2')]#! — это [SCOPE.Custom('get_gre_3_metropolis_3')]."
 greek_3_13_allow_tt_2:0 "Владелец #Y [SCOPE.Custom('get_gre_3_metropolis_2')]#! — это [SCOPE.Custom('get_gre_3_metropolis_3')]."
 greek_3_13_allow_tt_3:0 "Владелец #Y [SCOPE.Custom('get_gre_3_metropolis_2')]#! — это [SCOPE.Custom('get_gre_3_metropolis_3')] ИЛИ #Y [SCOPE.Custom('get_gre_3_metropolis_1')]#! существует."
 greek_3_13_allow_tt_4:0 "#Y [SCOPE.Custom('get_gre_3_metropolis_1')]#! имеет землю массалиотов ИЛИ существует любая другая страна массалиотов."
 greek_3_13_reward_tt:0 "Может получить союз или подарок от нашей колониальной метрополии."
