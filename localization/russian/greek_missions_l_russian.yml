 get_gre_3_metropolis_3_1:0 "Лакедемонская"
 get_gre_3_metropolis_3_2:0 "Афинская"
 get_gre_3_metropolis_3_3:0 "Сицилийская"
 get_gre_3_metropolis_3_4:0 "Ахейская"
 get_gre_3_metropolis_3_5:0 "Локрийская"
 get_gre_3_metropolis_3_6:0 "Эвбейская"
 get_gre_3_metropolis_3_7:0 "Массалийская"
 greek_3_15:0 "Конец тиранам"
 greek_3_15_DESC:0 "Цикл кровопролития и тирании никогда не закончится; сицилийцы должны перейти под лидерство италиотов."
 greek_3_15_allow_tt:0 "#Y Сиракузы#! не существуют."
 greek_3_17:0 "Мегале Эллас"
 greek_3_17_DESC:0 "Только когда большинство городов италиотов будет объединено под общим лидерством, наследие греческих колоний на западе будет safeguarded, а его будущее обеспечено."
 greek_3_17_allow_tt:0 "#Y Великая Греция#! не существует."
 greek_3_18:0 "[SCOPE.Custom('get_greek_3_18_title')]"
 greek_3_18_DESC:0 "На границах наших земель есть большие возможности, и мы должны предпринять каждый шаг, чтобы ensure our survival."
 get_greek_3_18_title_1:0 "Сцилла и Харибда"
 get_greek_3_18_title_2:0 "Претензии даунов"
 get_greek_3_18_title_3:0 "Иллирийские предприятия"
 greek_3_18_allow_tt_1:1 "[gm_3_greek_scope.GetName] владеет не менее #Y 3#! прибрежными территориями в регионе #Y $illyria_region$#! ([SCOPE.Custom('gre_mission_3_18_custom_loc_1')]/#Y 3#!)"
 gre_mis_3_18_1_allow_sv_ongoing:0 "#R [SCOPE.ScriptValue('me_gre_3_18_1_target_svalue')|0]#!"
 gre_mis_3_18_1_allow_sv_complete:0 "#Y [SCOPE.ScriptValue('me_gre_3_18_1_target_svalue')|0]#!"
 greek_3_19:0 "Разрозненные традиции"
 greek_3_19_DESC:0 "Города италиотов когда-то считались ведущими греческими центрами, сочетая влияния разнообразных колоний и становясь богатыми торговыми городами с процветающей философской жизнью."
 greek_3_19_reward_tt:0 "Выберите постоянную специализацию страны."


 #Far From Home

 #modifiers
 me_gre_4_32_pmod: "Побережье Массилиотов"
 me_gre_4_32_pmod_desc: "Теперь, когда мы заявили права на побережье для Массилии, пришло время инвестировать в местные города."
 me_gre_4_33_pmod: "Рынки Массилиотов"
 me_gre_4_33_pmod_desc: "Мы heavily invested в города на юге Галлии, превратив регион в area, which is colloquially known as the 'Silver Coast'."
 me_gre_4_34_pmod: "Горные крепости Массилиотов"
 me_gre_4_34_pmod_desc: "Мы построили strong fortresses near the mountains that secure the passages, ensuring that no one travels through these harsh lands without our permission."
 me_gre_4_35_pmod: "Торговый пост Алалии"
 me_gre_4_35_pmod_desc: "Благодаря личной дружбе между нашими народами, жители корсиканского города Алалия имеют особые торговые привилегии в порту Массилии."
 me_gre_4_37_pmod: "Военно-морская академия"
 me_gre_4_37_pmod_desc: "Мы убедили пиратов Магона обучать здесь наших моряков, делясь своим опытом и знаниями о Сардинском море с нашими новобранцами."
 me_gre_4_13_pmod: "Сарданские администраторы"
 me_gre_4_13_pmod_desc: "Мы работаем рука об руку с местными сарданскими администраторами, чтобы восстановить города на юге Сардинии."
 me_gre_4_39_pmod: "Варварская тренировка"
 me_gre_4_39_pmod_desc: "Поскольку мы приняли присутствие варварских воинов в нашем ополчении, наши силы тренируются alongside fierce savages и learn their martial techniques."
 me_gre_4_41_pmod: "Иберийские города"
 me_gre_4_41_pmod_desc: "Поскольку мы завоевали побережье восточной Иберии, ushering in a period of peace and prosperity, the local cities are flourishing."
 me_gre_4_42_pmod: "Мастерские по производству стекла Массилиотов"
 me_gre_4_42_pmod_desc: "Мастера-ремесленники из Эмпориона построили здесь мастерские по производству стекла, которые производят exceptional work."
 me_gre_4_43_pmod: "Известные экспортеры стекла"
 me_gre_4_43_pmod_desc: "Наш народ известен тем, что производит finest glass to be found anywhere."
 me_gre_4_44_pmod: "Южные города"
 me_gre_4_44_pmod_desc: "Наши прибрежные города blessed with a temperate climate and an easy way of life."
 tarraconensis_masiliot_manpower_mod: "Призыв в Тарраконенсисе"
 tarraconensis_masiliot_manpower_mod_desc: "Мы разослали слово по всей провинции Тарраконенсис, что ищем солдат для наших армий."
 tarraconensis_training_final_mod: "Обучение в Тарраконенсисе"
 tarraconensis_training_final_mod_desc: "Наша тяжелая пехота и кавалерия тренируются alongside regular soldiers all throughout the military encampments we have built in Tarraconensis."
 masiliot_control_of_gibraltar_mod: "Контроль Массилиотов над проливом"
 masiliot_control_of_gibraltar_mod_desc: "Хотя некоторые nations might foolishly claim the Mediterranean as their own sea, we control who can and cannot enter the body of water."
 pleased_nobility_moving_to_southern_gaul_mod: "Довольная знать"
 pleased_nobility_moving_to_southern_gaul_mod_desc: "Наши высшие классы have been building properties and holdings for themselves throughout Transalpine Gaul."
 final_masiliot_modifier_hurray_mod: "Великий рынок"
 final_masiliot_modifier_hurray_mod_desc: "В нашей столице построен magnificent marketplace, perhaps the largest in the Western Mediterranean."
 masiliot_cheaper_slaves_cost: "Корсиканские колонисты"
 desc_masiliot_cheaper_slaves_cost: "Мы предпринимаем согласованные усилия по колонизации Корсики, так как западная половина острова заселена редко."
 greek_4_west: "Вдали от дома"
 greek_4_west_BUTTON_TOOLTIP: "Выживание фокейских колоний требует сильного и энергичного руководства."
 greek_4_west_BUTTON_DETAILS: ""
 greek_4_west_DESCRIPTION: "#E Массалия#!, #E Эмпорион#!, #E Элея#! и #E Гемероскопейон#! были основаны сотни лет назад изгнанниками, бежавшими из Азии; их дома и мечты были отняты #E персами#!, разграбившими их метрополию #E Фокею#! в Ионии.\n\nИзвестные своей любовью к морским странствиям, они сели на корабли и плыли много месяцев, пока не построили новую жизнь в далёких землях #E Галлии#! и #E Иберии#!.\n\nЗдесь они были в безопасности от опустошительных армий Персии, но вскоре столкнулись с другой растущей державой, которая не потерпит соперников в своём стремлении доминировать в торговле Западным Средиземноморьем — #E Карфагеном#!. Настали тяжёлые времена, и выживание самых западных греков висит на волоске."
 greek_4_west_CRITERIA_DESCRIPTION: "Защитить эллинские интересы в Западном Средиземноморье, постепенно строя славную торговую империю, что даст нам средства и авторитет для создания #E Фокейской лиги#!."
 greek_4_west_REWARD_DESCRIPTION: "Установить лидерство над массалийскими греками."
 greek_4_loyalty_reward_tt:0 "Каждый член семьи #Y [gm_family_head_4.GetFamilyDisplayAdjective]#! получит #G 10#! лояльности @loyalty_icon!"

 greek_4_1: "[ROOT.GetCountry.GetAdjective] побережье"
 greek_4_1_DESC: "$greek_4_7_DESC$"

 greek_4_2: "Фокейский центр"
 greek_4_2_DESC: "Греческие города на западе остаются небольшими анклавами, окружёнными с одной стороны океаном, а с другой — морем варварских племён. Чтобы выжить, мы должны построить сильный город, способный поддерживать сам себя."
 greek_4_2_allow_tt:1 "Владеть портом в южной Галлии или восточной Иберии, который:\n * Имеет статус #Y Город#!\n * Доминирующая культура входит в группу #Y $hellenic$#! \n * Доминирующая религия — #Y $roman_pantheon$#!\n * Имеет значение цивилизации не менее #Y 40#!\n * Имеет #Y Рынок#!\n * Не имеет текущего строительства\n * Имеет не менее #Y 20#! населения\n * Доля рабов @slaves! составляет менее #Y 33%#!\n * Доля племенников @tribesmen! составляет менее #Y 33%#!"
 greek_4_2_reward_tt1: "[me_gre_4_2_temp.GetName] получит поселенцев и выбор постоянного бонуса."
 greek_4_2_reward_tt2: "Самая населённая соответствующая территория получит поселенцев и выбор постоянного бонуса."

 greek_4_3: "Столпы Геракла"
 greek_4_3_DESC: "Великие Столпы, охраняющие вход во внутреннее море, слишком долго находились в пунических руках, блокируя нашим купцам доступ к северной торговле и мешая исследованиям."
 greek_4_3_allow_tt:1 "По крайней мере одна из вышеуказанных территорий:\n * Имеет статус #Y Город#!\n * Имеет не менее #Y 2#! крепостей\n * Имеет не менее #Y 2#! рынков"
 greek_4_3_reward_tt: "Крупнейшая соответствующая территория получит бонус и поселенцев."

 greek_4_4: "Торговый блок"
 greek_4_4_DESC: "Мы должны продолжать расширяться, подчиняя нашему влиянию всё больше городов, если хотим конкурировать с обширной пунической торговой империей и её соперниками."
 greek_4_4_allow_tt:1 "Владеть не менее #Y 8#! портами с культурой #Y $hellenic$#!. ([SCOPE.Custom('gre_mission_4_4_custom_loc')]/#Y 8#!)"
 greek_4_4_allow_tt_2: "Столичный штат (#Y [gm_4_greek_scope.GetCapital.GetState.GetShortName]#!) имеет не менее #Y 10#! активных импортных путей. ([SCOPE.Custom('gre_mission_4_4_2_custom_loc')]/#Y 10#!)"
 gre_mis_4_4_allow_sv_ongoing: "#R [SCOPE.ScriptValue('gre_mis_4_4_current')|0]#!"
 gre_mis_4_4_allow_sv_complete: "#Y [SCOPE.ScriptValue('gre_mis_4_4_current')|0]#!"
 gre_mis_4_4_2_allow_sv_ongoing: "#R [SCOPE.ScriptValue('gre_mis_4_4_2_current')|0]#!"
 gre_mis_4_4_2_allow_sv_complete: "#Y [SCOPE.ScriptValue('gre_mis_4_4_2_current')|0]#!"

 greek_4_5: "Подход к фокейской колонии"
 greek_4_5_DESC: "Обретя новое влияние, мы сможем убедить одну из наших соседних колоний присоединиться к нам или хотя бы принять нашу защиту в обмен на дань."
 greek_4_5_allow_tt: "Существуют любые свободные прибрежные государства #Y Массалиотов#! с менее чем #Y 5#! территориями."
 greek_4_5_reward_tt: "Может получить вассала #Y Массалиотов#!."

 greek_4_6: "$greek_1_6$"
 greek_4_6_DESC: "Многие греческие колонии на западе пали от рук варваров, будь то пунийцы или местные племена. Мы должны вернуть утраченное законным владельцам."
 greek_4_6_allow_tt: "Завоевать исторически греческий порт в западном Средиземноморье, удерживаемый не-греками.\n\n#Y Возможные цели выделены на карте.#!"
 greek_4_6_reward_tt: "Территория может быть освобождена как вассал."

 greek_4_7: "Побережье [SCOPE.GetRootScope.GetCountry.GetAdjective]"
 greek_4_7_DESC: "Наш контроль над окружающей территорией ослабевает, и уже многие фокейские торговые посты пали или пришли в упадок. Мы должны утвердить свою власть с новым рвением. \n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 greek_4_7_reward_tt: "Государства этих территорий получат"

 greek_4_8: "$greek_4_7$"
 greek_4_8_DESC: "$greek_4_7_DESC$ \n\n\n\n\n\n\n\n\n\n@egypt_mil13!"

 greek_4_9: "$greek_4_7$"
 greek_4_9_DESC: "$greek_4_7_DESC$"

 greek_4_10: "$greek_4_7$"
 greek_4_10_DESC: "$greek_4_7_DESC$"

 greek_4_11: "Средиземноморские патрули"
 greek_4_11_DESC: "Наш доход зависит от поддержания потока торговли в наши порты, постоянно нарушаемого пиратами и завистливыми соперниками. Необходимо создать силы для защиты артерий нашей казны."
 greek_4_11_allow_tt: "Флот с не менее чем #Y 30#! либурнами @liburnian! возглавляется адмиралом из семьи #Y [gm_family_head_4.GetFamilyDisplayAdjective]#!."
 greek_4_11_allow_tt_fallback: "Флот с не менее чем #Y 30#! либурнами @liburnian! возглавляется адмиралом."

 greek_4_12: "Вернуть [GetProvince('(int32)3515').GetName]"
 greek_4_12_DESC: "Фокейская колония [GetProvince('(int32)3515').GetName] пала в результате совместной атаки флотов #E Этрурии#! и #E Карфагена#!, хотя и не без ожесточённого сопротивления.\n\nПоскольку до сих пор мы преследовали мирные цели в регионе, наши враги ошибочно полагают, что мы забыли о совершённом против нас преступлении — пришло время вернуть потерянный город и отомстить нашим недостойным соперникам."

 greek_4_13: "Фокейская месть"
 greek_4_13_DESC: "Карфагеняне должны заплатить за своё отвратительное обращение с нашими предками; пришло время островам запада вновь перейти под эллинский контроль.\n\nРазозлённые своими потерями от наших рук, карфагеняне подкупили местных наёмников, чтобы те взвинтили цены, но это лишь показывает их бессилие — ничто не остановит нас в нашем желании отомстить!"
 greek_4_13_allow_tt: "[gm_4_greek_scope.GetName] или её вассалы #Y Массалиоты#! полностью владеют областями #Y $balearides_area$#!, #Y $sardinia_meridionalis$#! и #Y $sardinia_septentrionalis$#!."
 greek_4_13_reward_tt_1: "#Y $balearides_area$#!, #Y $sardinia_meridionalis$#! и #Y $sardinia_septentrionalis$#! получают"
 greek_4_13_reward_tt_2: "#Y $balearides_area$#!, #Y $sardinia_meridionalis$#! и #Y $sardinia_septentrionalis$#! получат бонус к скорости ассимиляции."

 greek_4_14: "Варварский бартер"
 greek_4_14_DESC: "Местные племена всегда были готовы позволить грекам селиться на побережье, пока те не вмешивались в их дела, и сами охотно получали доступ к богатым товарам, которые мы импортируем из других мест."
 greek_4_14_allow_tt_1: "#Y [gm_4_greek_scope.GetRulerTitle] [gm_4_greek_scope.GetRuler.GetPraenomen]#! имеет не менее #Y 6#! харизмы @oratory_icon!"
 greek_4_14_allow_tt_2:1 "Любой порт в пределах досягаемости контроля в южной Галлии или восточной Иберии принадлежит племенной не-#Y $hellenic$#! стране, с которой мы в мире и которая имеет мнение о нас выше #R -50#!."
 greek_4_14_reward_tt:1 "Может купить порт в южной Галлии или восточной Иберии у племенной не-$hellenic$ страны."

 greek_4_15: "Агрессивные рынки"
 greek_4_15_DESC: "Карфагенское доминирование на западных торговых путях больше нельзя терпеть; мы должны выбить их с их торговых постов и создать на их месте собственную торговую империю."
 greek_4_15_allow_tt: "Нет #Y Пиратских логовищ#! вокруг Понта Эвксинского. (В настоящее время: #R [SCOPE.ScriptValue('gre_mis_1_haven_ongoing_all_target')|0]#!)\n$greek_4_haven_tt$"

 greek_4_16: "Фокейская лига"
 greek_4_16_DESC: "Разрозненные остатки изгнанного населения Фокеи остаются слабыми, пока они разделены. Они должны объединиться под единым руководством — а именно под нашим."
 greek_4_16_allow_tt:1 "Если какие-либо из вышеуказанных территорий удерживаются вассалами, они должны иметь культуру #Y $hellenic$#!."
 greek_4_16_reward_tt: "Удерживаемые пиратские логовища в Понте Эвксинском будут оплачены за перемещение в другую часть мира."
 form_phokaean_league_claims_tooltip:0 "Получить претензии на все фокейские колонии."

 greek_4_17: "Возрождённая Фокея"
 greek_4_17_DESC: "Наш народ был вынужден бежать от персов, оставив наш город в огне. Обретя новую силу, мы могли бы вернуть родину и залечить раны прошлого."

 greek_4_18: "Спиной к земле"
 greek_4_18_DESC: "Мы — морской народ и стремимся прежде всего к приобретению портов и расширению коммерческих интересов. Нам следует обеспечить безопасность наших сухопутных границ, заключив союз с одним из местных туземных племён."
 greek_4_18_allow_tt_1: "Союзная племенная страна входит в культурную группу #Y Галлов#!, имеет не менее #Y 8#! территорий, не менее #Y 100#! мнения о нас и столицу в регионе #Y $transalpine_gaul_region$#!."
 greek_4_18_allow_tt_2: "Союзная племенная страна входит в культурную группу #Y Иберийцев#!, имеет не менее #Y 8#! территорий, не менее #Y 100#! мнения о нас и столицу в регионе #Y $tarraconensis_region$#!."
 greek_4_18_allow_tt_3: "Союзная племенная страна входит в культурную группу #Y Иберийцев#!, имеет не менее #Y 8#! территорий, не менее #Y 100#! мнения о нас и столицу в регионе #Y $contestania_region$#!."
 greek_4_18_allow_tt_4: "Союзная племенная страна входит в культурную группу #Y Иберийцев#!, имеет не менее #Y 8#! территорий, не менее #Y 100#! мнения о нас и столицу в регионе #Y $baetica_region$#!."
 greek_4_18_allow_tt_5: "Союзная племенная страна входит в культурную группу #Y Италийцев#!, имеет не менее #Y 8#! территорий, не менее #Y 100#! мнения о нас и столицу в регионе #Y Италия#! или #Y Великая Греция#!."


 greek_4_19: "Олисипонские амбиции"
 greek_4_19_DESC: "Легендарный торговый пост Олисипо — это ворота к далёким торговым путям севера. Завладев им, мы преумножим как престиж его прошлого, так и ценность его расположения."
 greek_4_19_allow_tt:3 "[gm_4_greek_scope.GetName] владеет #Y [GetProvince('(int32)1319').GetName]#!, который:\n * Имеет статус #Y Город#!\n * Доминирующая культура входит в группу #Y $hellenic$#! \n * Имеет #Y $temple_building$#!\n * Не имеет текущего строительства\n * Имеет не менее #Y 10#! населения\n * Доля рабов @slaves! составляет менее #Y 33%#!\n * Доля племенников @tribesmen! составляет менее #Y 33%#!"
 #Other
 me_gre_1_culture_warning_tt:1 "Миссия '#Y Гостеприимное море#!' будет #R больше недоступна#!."
 masiliot_claims_on_lusitania_tt: "#Y Мы получим претензии на все провинции в регионе#! #T Лузитания#!."

 greek_4_32: "Обеспечение безопасности #E Галльского залива#!"
 greek_4_32_DESC: "Мы подчинили прибрежных галлов, заставив их признать наше верховенство — ситуация, которую мы находим весьма приятной. Особой похвалы заслуживает [ROOT.GetCountry.GetRuler.GetName], которого начинают признавать грозным стратегом."
 integrate_them_salluvians_please_tt: "#Y Нам нужно интегрировать#! #T Культуру саллувиев#!."

 greek_4_33: "Массалийские рынки Галлии"
 greek_4_33_DESC: "Одно дело — завоевать регион, и совсем другое — прослыть добрым и мудрым правителем земли. Давайте посвятим себя почётной задаче вести этих галлов к свету цивилизации... и к нашим рынкам."

 greek_4_34: "Заделывание трещин"
 greek_4_34_DESC: "Хотя наше внимание сосредоточено на побережье, мы должны помнить об опасности, исходящей от галлов, живущих глубже на материке. Благоразумие диктует, что нам следует обратить внимание на усиление обороны в [GetProvince('(int32)2311').GetName]."
 masiliot_claims_up_in_gaul_time_tt: "#Y Мы получим претензии на все провинции в регионе #T Трансальпийская Галлия#!."

 greek_4_35: "Дела в [GetProvince('(int32)3515').GetName]"
 greek_4_35_DESC: "Теперь, когда мы собрали флот, достойный плавать под знаменами [ROOT.GetCountry.GetAdjective], нам следует посетить близлежащие острова и попытаться установить торговые связи.\n\nОживлённый порт [GetProvince('(int32)3515').GetName] на #E Корсике#! — наша бывшая колония, и путь туда занимает всего около месяца — нам стоит навести справки среди местных магистратов, но только после того, как мы смажем некоторые ладони."
 send_dem_alalians_a_gift_cuh: "#Y Мы должны отправить подарок#! #T городу#! #Y Алалия#!."
 befriend_governor_of_alalia_tt: "#Y Наш правитель должен быть#! #T Другом#! #Y с правителем#! #T Алалии#!."

 greek_4_36: "Леса Корсики"
 greek_4_36_DESC: "Поскольку у нас есть деловые интересы, связанные с островом [GetProvince('(int32)3515').GetArea.GetName], мы решили заготавливать древесину в их нетронутых лесах на государственном уровне — какая удача для [ROOT.GetCountry.GetName]!"

 greek_4_37: "Гости из гимнасиев"
 greek_4_37_DESC: "Репутация ужасных #E Пиратов Магона#! не нуждается в представлении в [ROOT.GetCountry.GetName], ибо наши торговые суда хорошо знакомы с этими грабящими буканьерами и их склонностью к насилию в #E Сардинском море#!.\n\n[ROOT.GetCountry.GetRuler.GetName] устал слышать об их вторжениях в наши воды и предложил просто завоевать остров. Возможно, мы сможем договориться с местными — захотят ли они оставить свой прежний образ жизни, если цена будет подходящей?"

 greek_4_38: "Объединение островов"
 greek_4_38_DESC: "[ROOT.GetCountry.GetRuler.GetName] добился невозможного, изгнав наших врагов с островов #E Сардинского моря#! и захватив их для [ROOT.GetCountry.GetName]. Пришло время отпраздновать успех нашего [ROOT.GetCountry.GetRulerTitle], который обратил свой взор на гораздо более ценный приз — #E Сиракузы#!."

 greek_4_39: "Сражаться как варвар"
 greek_4_39_DESC: "Приток варваров в наши города породил интригующую идею в уме [ROOT.GetCountry.GetRuler.GetName] — почему бы нашему ополчению [ROOT.GetCountry.GetAdjective] не тренироваться вместе с этими племенными бойцами? Возможно, есть тактики, которые пригодятся нашим генералам? Мы не узнаем этого, пока не будем муштровать солдат вместе."
 masiliot_claims_on_transalpine_gaul_tt: "#Y Мы получим претензии на все провинции в регионе #T Аквитания#!."
 masiliot_unlocks_gallic_trads_tt: "#Y Мы получим доступ к#! #G Кельтским военным традициям#!."

 greek_4_40: "Освободить Великую Грецию"
 greek_4_40_DESC: "Наши недавно завоёванные граждане, живущие в #E Сиракузах#!, попросили нас освободить #E Великую Грецию#!. Слишком много угроз нависло над бедными греческими колониями в #E Италии#!, и возрождение [ROOT.GetCountry.GetName] сделало нас защитником угнетённых эллинов."

 greek_4_41: "Восточное побережье Иберии"
 greek_4_41_DESC: "Это творит чудеса для региональной безопасности, если мы сможем завоевать племена, живущие вдоль восточного побережья #E Иберии#!. Если мы сможем гарантировать безопасный проезд для путешествующих купцов, потребуется надлежащее расширение наших военно-морских объектов из-за увеличения объёма торговли."

 greek_4_42: "Стеклодувы [GetProvince('(int32)1468').GetName]"
 greek_4_42_DESC: "Хотя ремесленники, работающие в [GetProvince('(int32)1000').GetName], прочно обосновались в стеклодувном деле, они всегда ищут возможности расширить своё мастерство. Хотя [GetProvince('(int32)1468').GetName] сейчас может быть глухим уголком, у острова есть потенциал однажды производить изысканное стекло."

 greek_4_43: "Массалийское стекло"
 greek_4_43_DESC: "Те, у кого есть деньги на роскошные товары, знают, что нужно спрашивать #Y Массалийское стекло#! по названию, ведь наши мастерские [ROOT.GetCountry.GetAdjective] известны непревзойдёнными шедеврами, которые они производят."
 masiliot_glass_tt: "Нам нужно производить не менее #Y 10#! @glass! Стекла. (#R [SCOPE.ScriptValue('masiliot_trade_goods_svalue')|0]#!/#Y 10#!)"

 greek_4_44: "Южные пляжи Иберии"
 greek_4_44_DESC: "Города южной #E Иберии#! — одни из самых красивых земель, которыми мы владеем — тёплые бризы и спокойные воды зовут наш народ [ROOT.GetCountry.GetAdjective] к своим воротам."

 greek_4_45: "Захват Тарраконенсиса"
 greek_4_45_DESC: "Наше победоносное ополчение завоевало большие участки земли по всему #E Тарраконенсису#!, предоставив нам богатые территории, которые сослужат службу как нашей казне, так и армии."
 we_will_get_tarraconensis_claims_tt: "#Y Мы получим претензии на все провинции в регионе#! #T Тарраконенсис#!."

 greek_4_46: "Обучение в Тарраконенсисе"
 greek_4_46_DESC: "Теперь, когда мы контролируем равнины северо-восточной Иберии, было решено повысить военную готовность провинции.\n\nНам приходится беспокоиться не только об иберийских кельтах, но и о беспокойных галлах на севере и западе, за которыми всегда стоит следить."
 have_barracks_tarraconensis_tt: "Нам нужно построить #G 5 Казарм#! в регионе #Y Тарраконенсис#!."
 masiliot_claims_on_gallaecia_tt: "#Y Мы получим претензии на все провинции в регионе#! #T Галлеция#!."	

 greek_4_47: "Контроль над проливом"
 greek_4_47_DESC: "Контроль над #E Геркулесовыми столпами#! даёт множество экономических и военных преимуществ, но [ROOT.GetCountry.GetRuler.GetName], безусловно, наслаждается престижем, сопровождающим столь смелые заявления."
 masiliot_claims_on_baetica_tt: "#Y Мы получим претензии на все провинции в регионе#! #T Бетика#!."	

 greek_4_48: "Наша провинция"
 greek_4_48_DESC: "Хотя мы, безусловно, владеем многими продуктивными землями, [GetProvince('(int32)2320').GetArea.GetRegion.GetName] быстро становится одной из любимых провинций среди элиты, живущей в [ROOT.GetCountry.GetCapital.GetName]. Богатейшие из нас соревнуются за недвижимость на юге Галлии, надеясь построить латифундии и расширить свои и без того впечатляющие владения."

 greek_4_49: "Великий рынок [ROOT.GetCountry.GetCapital.GetName]"
 greek_4_49_DESC: "Наши обширные деловые владения по всему Средиземноморью и Иберии приносят в казну [ROOT.GetCountry.GetName] столько золота и серебра, что мы не знаем, что с ним делать.\n\nПочувствовав возможность оставить наследие, [ROOT.GetCountry.GetRuler.GetName] приказал построить великий рынок в [ROOT.GetCountry.GetCapital.GetName] — храм богатства народа [ROOT.GetCountry.GetAdjective]."