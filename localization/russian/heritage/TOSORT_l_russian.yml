l_russian:
 fezzani_heritage:0 "Феззанское наследие"
 fezzani_heritage_desc:0 "Племена Феззана были мастерами пустынной войны и покорителями многочисленных оазисов Ливии. Хотя они с трудом противостояли должным образом обученным легионам в открытом бою, их партизанская тактика в пустыне и использование более мобильных отрядов представляли вечную проблему как для греков, так и для финикийцев и римлян."
 macrobian_heritage:0 "Сомалийское наследие"
 macrobian_heritage_desc:0 "То, чего народам современного Сомали не хватало в сухопутной войне, они с лихвой компенсировали на море. Они были плодовитыми торговцами экзотическими товарами, пиратами и прибрежными рейдерами, пользуясь преимуществом над теми, кто уступал им в морском деле. Их торговая сеть простиралась от Индии до Средиземноморья и вдоль восточного побережья Африки, обеспечивая им дипломатические контакты по всему известному миру."

 # Maldives Heritage
 Mahiladvipikan_heritage:0 "Наследие Махиладвипики"
 Mahiladvipikan_heritage_desc:0 "Крупная совокупность природных атоллов и островков, архипелаг, окружающий легендарный остров Махиладвипика, был домом для довольно изолированных популяций, первоначально состоявших из смеси народов юго-западной Индии и северо-запада Шри-Ланки, но позже испытавших влияние предполагаемого прибытия сингальского народа в VI веке до н.э. в качестве изгнанников из Магадхи. Цепь островов расположена на важном перекрестке, пересекающем индийско-красноморский маршрут, и способствовала общей связности Эритрейского моря. Буддизм вскоре овладел несколькими атоллами, вдохновив культурное обновление и инновации для создания мальдивской идентичности."
