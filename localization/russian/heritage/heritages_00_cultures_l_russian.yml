l_russian:
 #Vanilla
 achaean_heritage:0 "Ахейское наследие"
 achaean_heritage_desc:0 "Ахейцы предпочли избегать крупных политических игр последних лет, сохраняя свой небольшой союз, но готовые защищаться, если их суверенитет окажется под угрозой."
 arcadian_heritage:0 "Аркадское наследие"
 arcadian_heritage_desc:0 "Внутренняя часть Пелопоннеса удалена и сельска, это первозданное место, о котором фантазирует урбанизированная элита Греции; регион выживает в основном за счет сельского хозяйства и сохранения дистанции от внешних дел."
 siceliote_heritage:0 "Сицилийско-греческое наследие"
 siceliote_heritage_desc:0 "Греческие города Сицилии столкнулись с ростом популизма сильнее, чем где-либо еще в эллинском мире, что является симптомом комфортной жизни, посвященной философии и культуре, которую ведут их жители."
 italiote_heritage:0 "Италийско-греческое наследие"
 italiote_heritage_desc:0 "Когда-то богатые и могущественные италийские города пришли в упадок из-за собственной лени, предпочитая полагаться на местных наемников и иностранную помощь для ведения войн, пока сами обсуждают философию."
 cretan_heritage:0 "Критское наследие"
 cretan_heritage_desc:0 "Изолированные города Крита упорно вовлечены в собственные войны мести и доминирования, оставаясь в неведении относительно великих политических потрясений эллинского мира."
 graeco_pontic_heritage:0 "Греко-понтийское наследие"
 graeco_pontic_heritage_desc:0 "Греческие колонисты южного Понта Эвксинского веками жили в тесном соседстве с коренными анатолийскими народами, торгуя и ведя переговоры с варварскими царями."
 bosporan_heritage:0 "Боспорское наследие"
 bosporan_heritage_desc:0 "Греческие колонисты северо-западного Понта Эвксинского происходят в основном из Мегары и Милета и основали процветающие торговые узлы, предпочитая не вмешиваться в дела материка."
 euboean_heritage:0 "Эвбейское наследие"
 euboean_heritage_desc:0 "Остров Эвбея не особенно богат или густонаселен, но его жители всегда были превосходными моряками и отстаивали свою независимость, используя стратегическое положение острова и его пересеченный рельеф с максимальной выгодой."
 bithynian_heritage:0 "Вифинское наследие"
 bithynian_heritage_desc:0 "Среди старейших колоний, основанных греками, вифинские города выжили, соглашаясь с требованиями варварских царей и императоров, сосредоточившись вместо этого на развитии своих городов."
 persian_heritage:0 "Персидское наследие"
 persian_heritage_desc:0 "Кир Великий возвысился из Персиды и разгромил гегемонические державы своего времени, что привело к официальному установлению новой имперской политики под властью его собственной династии Ахеменидов. На пике могущества Персидская империя простиралась от Балкан и Египта на западе, через Западную Азию как основу, до большей части Центральной Азии на северо-востоке и долины Инда на юго-востоке."
 egyptian_heritage:0 "Египетское наследие"
 egyptian_heritage_desc:0 "Египет является не только житницей Средиземноморья, но и носителем наследия, уходящего корнями в тысячелетия. Чрезвычайное богатство этой земли, благословленное и поддерживаемое дарующей жизнь рекой Нил, привлекает претендентов так же, как мед привлекает мух. Когда Александр умер, Птолемей Сотер позаботился о том, чтобы ему досталась самая богатая и процветающая сатрапия в империи. Эта величайшая награда, ставшая предметом ожесточенных споров, ускользнула из рук Птолемеев..."
 syrian_heritage:0 "Сирийское наследие"
 syrian_heritage_desc:0 "Термин «Сирия» был впервые применен Геродотом в V веке до н.э. для обозначения региона, простирающегося в основном между Анатолией и Египтом. С наступлением эллинистического периода греки и их династия Селевкидов использовали термин «Сирия» для обозначения региона между Средиземным морем и Евфратом. После сокращения империи Селевкидов и потери их восточных владений во II веке до н.э. последующие правители Селевкиды стали титуловать себя «царями Сирии», управляя остатками государства вплоть до превращения его в римскую провинцию Помпеем в 63 году до н.э."

# Barbarian Heritages Palando
 ingvaeonic_heritage:0 "Ингвеонское наследие"
 ingvaeonic_heritage_desc:0 "Сыновья Ингви живут вдоль болотистого побережья Северного моря, занимаясь торговлей, доходящей даже до острова Альбион, а также пиратством..."
 aremorican_heritage:0 "Аремориканское наследие"
 aremorican_heritage_desc:0 "Эти прославленные мореплаватели создали корабли из дуба с большими транцами, скрепленными железными гвоздями, и парусами из кожи, что позволило им выдерживать суровый климат Атлантического океана и открыть торговые пути в Британию. Они чувствуют себя неуютно вдали от моря, поэтому строят свои дома на прибрежных возвышенностях, превращая их в неприступные острова во время прилива."
 scandian_heritage:0 "Скандийское наследие"
 scandian_heritage_desc:0 "Народ Скандии адаптировался к суровому зимнему климату, черпая силы иногда из твердой веры в то, что они живут там, где обитают боги."
 suebic_heritage:0 "Свевское наследие"
 suebic_heritage_desc:0 "Страшные своей яростью в битве и неустанной резней, сыны Ирмина стали образцом для подражания для многих молодых германских воинов, что привело к тому, что всё больше людей перенимали их отличительную прическу — свевский узел. Цивилизация считается причиной того, почему все их враги становятся мягкотелыми, возможно, вполне обоснованно."
 istvaeonic_heritage:0 "Иствеонское наследие"
 istvaeonic_heritage_desc:0 "Народ, живущий на стыке более развитого кельтского юга и других германцев севера, поклоняется своему легендарному предку Истио. Заимствование идей с юга компенсирует их малочисленность."
 lugian_heritage:0 "Лугийское наследие"
 lugian_heritage_desc:0 "Янтарный путь проходит через обширные и сельские территории вандалов, но часто перекрывался из-за внешних угроз или внутренних раздоров. Таким образом, после многих распрей была основана Лугийская конфедерация под эгидой бога Лугуса, чтобы защитить этот ценный источник дохода."
 gothonic_heritage:0 "Готоническое наследие"
 gothonic_heritage_desc:0 "Хотя жители южного побережья Балтики не могут понять ненасытный аппетит средиземноморского мира к янтарю, они все равно эксплуатируют это желание. Однако накопленное таким образом богатство привело к возникновению системы патронажа со стороны генералов, подобных царям."
 treverian_heritage:0 "Треверское наследие"
 treverian_heritage_desc:0 "Треверы являются одними из самых искусных галльских всадников и управляются аристократической элитой, что выражается в экстравагантных погребениях на колесницах."
 norican_heritage:0 "Норикское наследие"
 norican_heritage_desc:0 "Ferrum Noricum, норикская сталь, хвалят и ищут по всей Центральной Европе благодаря её уникальному качеству, поэтому неудивительно, что она обеспечивает норикам доступ к мощному стратегическому военному ресурсу, а также к огромным богатствам. Однако такие богатства развратили их общество расточительностью и мотовством."
 vindelician_heritage:0 "Винделикийское наследие"
 vindelician_heritage_desc:0 "Проживая в предгорьях Альп, винделики становились жертвами набегов германцев и других кельтов. Поэтому они начали строить крупные города, окружая их высочайшими стенами и используя рельеф местности в своих интересах, невзирая на затраты."
 rhaetian_heritage:0 "Ретийское наследие"
 rhaetian_heritage_desc:0 "Реты живут изолированной жизнью в заснеженных Альпах, вдали от своих этрусских родственников. Столкнувшись с ранними зимами и поздними летами, реты усовершенствовали плотницкое ремесло, чтобы быстро строить дома высокого качества."
 helvetian_heritage:0 "Гельветское наследие"
 helvetian_heritage_desc:0 "Институционализированные золотые рудники современной Швейцации сделали вождей гельветов богатыми, но ценой повсеместной коррупции из-за соперничества вождей за королевскую власть. Гельветы также очень благочестивый народ, так как они с пылким усердием приносят в жертву свои богатства, бросая их в различные водоемы."
 lepontic_heritage:0 "Лепонтийское наследие"
 lepontic_heritage_desc:0 "Кельты generally не были известны склонностью к письму, но не лепонтии, которые начали делать надписи этрусским алфавитом в VI веке до н.э. Эта практика продолжалась до тех пор, пока они не были завоеваны римлянами, так как даже использование искусных гезатов, кельтского отряда наемников из Альп, не смогло остановить военную машину Рима."
 baltic_heritage:0 "Балтийское наследие"
 baltic_heritage_desc:0 "На протяжении веков земля, населенная балтами, была усеяна погребальными курганами, что проявляло стабильность их поселений, длившуюся с начала Железного века и вплоть до позднего периода Римской империи. Так что с течением лет балты стали искусными в добыче столь востребованного янтаря."
 sporic_heritage:0 "Спорическое наследие"
 sporic_heritage_desc:0 "Эти люди жили широко разбросанными по земле, из-за чего греки называли их спориоями. Позже они вместе с другими народами станут склавенами."
 belgic_heritage:0 "Наследие белгов"
 belgic_heritage_desc:0 "Их смесь германского и галльского наследия, похоже, породила закаленных в боях мужчин благодаря дисциплине белгов сражаться до последнего человека. Общий культ используется для удержания вместе этих двух разных групп."
 # Vasconian Heritage
 vasconian_heritage:0 "Васконское наследие"
 vasconian_heritage_desc:0 "Васконы обосновались на пересеченной местности, расположенной между Пиренейскими горами и Иберийской цепью. Они живут на полях near рек, но стратегически готовы перебраться в горы при необходимости. Естественная оборонительная позиция, которую обеспечивает их местоположение, позволила васконам пережить многие попытки завоевания (или вынужденное переселение мигрирующими кельтами) и сохранить свои традиционные обычаи. Васконы имеют много общего со своими северными братьями, аквитанами: оба народа говорят на языке, известном как васконский или аквитанский, отличном от окружающих галльских и иберийских языков, и оба поклоняются многим одним и тем же доиндоевропейским божествам."
 # Pyrenean Heritage
 pyrenean_heritage:0 "Пиренейское наследие"
 pyrenean_heritage_desc:0 "«Как по высоте, так и по размерам эти горы (Пиренеи) превосходят все остальные; ибо они тянутся от Южного моря практически до Северного океана и простираются примерно на три тысячи стадий, разделяя Галлию от Иберии и Кельтиберии. И поскольку они содержат много густых и глубоких лесов, в древние времена, как нам сообщают, некоторые пастухи оставили огонь, и вся область гор была полностью сожжена; и из-за этого огня, поскольку он бушевал непрерывно день за днем, поверхность земли также выгорела, и горы из-за произошедшего были названы Пиренеями; кроме того, поверхность выгоревшей земли изобиловала серебром, и, поскольку элементарное вещество, из которого добывается серебро, расплавилось, образовалось много потоков чистого серебра».\n— Диодор Сицилийский"
# Aquitanian Heritage
 aquitani_heritage:0 "Аквитанское наследие"
 aquitani_heritage_desc:0 "Аквитаны обитают на землях между рекой Гарумна и возвышающимися Пиренеями. Страбон отмечает, что аквитаны сильно отличались от окружающих галльских народов как внешностью, так и речью. Примечательно, что аквитаны имеют много общего со своими южными братьями, васконами: оба народа говорят на одном и том же distinctly негалльском языке, который отмечает Страбон, известном как васконский или аквитанский, и оба поклоняются многим одним и тем же доиндоевропейским божествам."
 # Volcaean Heritage
 volcaean_heritage:0 "Наследие волкаенов"
 volcaean_heritage_desc:0 "Волки выделились в отдельную племенную группу во время кельтских миграций III века до н.э., вероятно, сформировавшись из населения, вытесненного прибытием боев в Богемию. Археологические данные помещают их в Моравию, где они строили оппидумы и развивали экономику, основанную на ресурсах. Около 279 года до н.э. некоторые волки участвовали в кельтской экспедиции, разграбившей Дельфы. После этого события одна группа мигрировала в Малую Азию, став частью галатской конфедерации. Другая группа проникла в южную Галлию около 270–260 годов до н.э., где разделилась на волкаенов-тектозагов (с центром в Толозе) и волкаенов-арекомиков (вокруг Немавса). В I веке до н.э. Юлий Цезарь столкнулся с обеими группами во время своих галльских кампаний. Цезарь описывал Толозу как богатый город с большими количествами золота, якобы взятого из Дельф во время более ранней балканской экспедиции."
 cypriot_heritage:0 "Кипрское наследие"
 cypriot_heritage_desc:0 "Остров Кипр давно служил основным источником меди для Леванта и всего Средиземноморья. Действительно, многие города-государства, как греческие, так и финикийские, основывали на острове колонии, чтобы извлекать прибыль из чрезвычайно выгодной торговли медью. Кипр состоял из множества городов-царств, пока они не были упразднены во время войн диадохов: Марион, Солои, Карпасия, Лапетос, Ледра, Хитрои, Саламин, Китион, Идалион, Тамассос, Амафус, Курион и Пафос."
 celtiberian_heritage:0 "Кельтиберийское наследие"
 celtiberian_heritage_desc:0 "Кельтиберы были особенно воинственным народом даже для своего времени. Они применяли свои металлургические навыки для создания разнообразного оружия: мечей, копий, уздечек и многого другого. Самым примечательным из этого оружия был невероятно эффективный двусторонний меч, который римляне стали называть Gladius Hispanus. Ярко независимые кельтиберы поставляли наемников, прославившихся по всему западному краю Средиземноморья, и в конечном итоге сыграли решающую роль в Пунических войнах."


 olcadian_heritage:0 "Олькадское наследие"
 olcadian_heritage_desc:0 "Будучи родственны соседним кельтиберам, олькады известны как наемники и защитники своей независимости."

 hispano_celtic_heritage:0 "Испано-кельтское наследие"
 hispano_celtic_heritage_desc:0 "Наши предки показали нам путь вперед."

# From Ben Heritages
 ## PUNIC
 punic_heritage:0 "Пуническое наследие"
 punic_heritage_desc:0 "Основанные финикийскими торговцами в далеком прошлом, пунические города усеивают Средиземноморье. От великого города Карфагена до малых городов Ливии — все они могут надеяться однажды освободить свою прародину от диадохов и вновь обрести господство на море."
 ## SCYTHIA
 ### Sarmatia heritage is also country specific
 sarmatian_heritage:0 "Сарматское наследие"
 sarmatian_heritage_desc:0 "В то время как их скифские сородичи на западе начали оседать, сарматы продолжали следовать своему общему кочевому наследию. Имея мало контактов с чужаками, они полагались на собственный ум и хитрость, став страшными и уважаемыми врагами не одной империи."
 ## DACIA
 getian_heritage:0 "Наследие гетов"
 getian_heritage_desc:0 "Близкородственные дакам на западе, геты пользовались уважением за свое наследие свирепых, но честных воинов. Когда Лисимах был ими пленен, их царь Дромихет отпустил его, убедив, что геты будут лучшими союзниками, чем врагами."
 dacian_heritage:0 "Дакийское наследие"
 dacian_heritage_desc:0 "Даки были близкородственны гетам на востоке и в конечном итоге объединили свой народ под властью одного царя. Известные своими грозными воинами и мощными горными укреплениями, они создали наследие, которого боялись даже римляне."
 ## Illyria
 illyrian_heritage:0 "Иллирийское наследие"
 illyrian_heritage_desc:0 "Различные иллирийские племена наиболее известны своим морским наследием, хотя некоторые завистливые соседи могут считать их просто пиратами."
 ## Iberia
 carpetani_heritage:0 "Карпетанское наследие"
 carpetani_heritage_desc:0 "Карпетаны — племя со скромным наследием в самом центре полуострова, часто остающееся незамеченным соседями. То, что может показаться слабостью, на деле является их силой: пока другие бесконечно препираются между собой, карпетаны предпочитают процветать в мире и создавать могущественные коалиции, способные нанести удар, когда неизбежно наступит время войны."
 celtician_heritage:0 "Кельтицийское наследие"
 celtician_heritage_desc:0 "Кельтиции были одним из немногих племен полуострова, считавшихся цивилизованными греками, хотя и в меньшей степени, чем соседние турдетаны. Многие другие племена строили свое собственное наследие после миграции с территории кельтициев."
 vaccaeian_heritage:0 "Вакцейское наследие"
 vaccaeian_heritage_desc:0 "Вакцеи были мастерами земледелия. Их сильное эгалитарное наследие позволяло им эксплуатировать плодородные районы западного плато через коллективистскую систему ведения сельского хозяйства."
 ## HIBERNIA
 hibernian_heritage:0 "Гибернийское наследие"
 hibernian_heritage_desc:0 "Народ, чья культура была определена войной, морскими традициями и предубеждениями против них."
 ## Nilotic
 nilotic_heritage:0 "Нилотическое наследие"
 nilotic_heritage_desc:0 "Наши предки показали нам путь вперед."
 ## From Dustin - DoA in Ben Heritages
 assyrian_heritage:0 "Ассирийское наследие"
 assyrian_heritage_desc:0 "Древняя Ассирийская империя просуществовала почти 2000 лет в регионе Верхней Месопотамии и Сирии. Древние ассирийцы были мастерами инженерного дела и создавали сложные осадные машины. Кроме того, они первыми имели профессиональную армию."
 # From Thracian Invictus
 thracian_heritage:0 "Фракийское наследие"
 thracian_heritage_desc:0 "Геродот описывал фракийцев как самый могущественный народ в мире, за исключением индийцев, если бы только они смогли объединиться. Однако это кажется невозможным достичь для любого одного вождя..."
 # Iberian Flavor Heritages
 turdetanian_heritage:0 "Турдетанское наследие"
 turdetanian_heritage_desc:0 "Много веков назад цивилизация Тартесса была важнейшим торговым и политическим центром Иберийского полуострова. Обширные сельскохозяйственные угодья региона и залежи металлов создали богатую элиту, которая извлекала выгоду из торговых обменов с финикийскими и греческими купцами со всего Средиземноморья. Регион продолжает оставаться главным экономическим центром Иберии благодаря основанию постоянных поселений финикийцами, которые обеспечивают живой и обогащающий культурный обмен. Культурные обмены создали самобытную культуру, отмеченную смешением пунических и местных обычаев, превратив турдетанов в одну из самых цивилизованных культур Иберии."
 lusitanian_heritage:0 "Лузитанское наследие"
 lusitanian_heritage_desc:0 "Лузитанский народ с незапамятных времен нанимали в качестве наемников другие державы, такие как карфагеняне, из-за их славы свирепых воинов и мощи их легкой пехоты."
 vettonian_heritage:0 "Веттонское наследие"
 vettonian_heritage_desc:0 "Веттоны — религиозный народ, родственный лузитанам. Они были известны как строители внешних храмов и зооморфных гранитных памятников."
 cantabrian_heritage:0 "Кантабрийское наследие"
 cantabrian_heritage_desc:0 "Изолированные земли Кантабрийского хребта являются домом для различных народов. Хотя горы служат естественной защитой, население менее связано со своим окружением."
 asturian_heritage:0 "Астурийское наследие"
 asturian_heritage_desc:0 "География Астурии оказалась почти непреодолимым барьером против внешних опасностей, но в то же время изолировала астурийский народ."
 gallaecian_heritage:0 "Галлекийское наследие"
 gallaecian_heritage_desc:0 "Сельские и горные земли Галлеции позволяют галлекам жить дикой жизнью, питаясь тем, что они собирают в природе, и совершая набеги на соседние земли."
 # Some more random heritages
 carnian_heritage:0 "Карнийское наследие"
 carnian_heritage_desc:0 "Карны были народом, жившим на краю Восточных Альп. Будучи запертыми в относительно скудной альпийской родине, они часто зимовали на более плодородных равнинах долины реки По на востоке, в конечном итоге переселившись в самые восточные низменности этих равнин, где они основали поселение Аквилея в начале II века до н.э. Однако их успех оказался недолгим: ближе к концу века они были разбиты римлянами в битве, их Аквилея стала римской колонией, а народ романизировался. По сей день их идентичность кажется несколько сомнительной, вероятно, из-за культурного смешения с их венетскими и иллирийскими соседями."
 chrysaoric_heritage:0 "Карийское наследие"
 chrysaoric_heritage_desc:0 "Побережье Карии было заселено греческими поселенцами на протяжении веков, и возникшие сообщества смешанной культуры, как греческой, так и карийской, часто организовывались в федерации."
 cilicia_heritage:0 "Киликийское наследие"
 cilicia_heritage_desc:0 "Известные своим морским мастерством и fierce независимостью, киликийцы некогда прославились как печально известные пираты, державшие в тисках торговые пути восточного Средиземноморья. Их горная родина обеспечивала естественные укрепления против захватчиков, в то время как их прибрежные города, такие как Тарс, стали центрами торговли и культуры. Несмотря на подчинение таким империям, как Ассирия, Персия и Македония, киликийцы сохраняли свою самобытную идентичность, сочетая местные традиции с влиянием греческой и ближневосточной цивилизаций."
 characene_heritage:0 "Харакенское наследие"
 characene_heritage_desc:0 "Название Харакена происходит от древнего крепостного города Харака, что означает «палисад» или «укрепленное ограждение», изначально построенного для защиты важных торговых путей региона. Первый правитель царства, Гиспасин, был назначен сатрапом Эритрейского моря, которое включало остров Тилос. В этой роли Гиспасин управлял прибыльной торговлей в заливе и командовал мощным селевкидским флотом Вавилонии. Поскольку империя Селевкидов страдала от гражданских распрей и парфянских вторжений, Гиспасин объявил о независимости, создав Харакену как автономное царство. Известные как опытные торговцы, харакенцы контролировали ворота между индийскими и арабскими торговыми путями и рынками Запада, продолжая oversee как торговлю, так и морские дела под властью своих новых парфянских повелителей после краха империи Селевкидов."
 elymais_heritage:0 "Элимайское наследие"
 elymais_heritage_desc:0 "Название Элимаида может происходить от «Малого Элама», ссылки на «Великий Элам», который ранее состоял из Суз и Аншана. Расположенная в голове Персидского залива в Сузиане (современный Хузестан, Иран), Элимаида славилась богатством серебром и золотом, а ее храмы хранили сокровища, которые, согласно древним источникам, содержали золотые покрытия, нагрудники и даже оружие, якобы оставленное Александром Великим. Армия Элимаиды обладала искусными лучниками. Провинции Элимаиды — Массабатика, Корбиана и Габиана — были стратегически расположены между Сузами и парфянскими территориями, что позволяло Элимаиде выживать и процветать вплоть до ее завоевания Сасанидами в начале III века до н.э."
 # Androphagia
 androphagia_heritage:0 "Наследие людоедов"
 androphagia_heritage_desc:0 "Загадочный народ, чей язык сбивал с толку всех, кто не говорил на нем с рождения, андрофаги, как говорили, были единственным из тех племен в Скифии и вокруг нее, где ритуальный каннибализм был обычной практикой. Эти варварские мужчины и женщины поедали своих соплеменников с гарниром из меховых существ. Не имея прочных связей с царскими скифами или любыми другими скифскими племенами — что проявилось, когда они отказались помочь скифам против вторжения Дария, — они остаются отстраненными и ненадежными, материалом для кошмаров."
 # Bastarnaen Tribes
 bastarnae_heritage:0 "Наследие бастарнов"
 bastarnae_heritage_desc:0 "Ранние греко-римские историки подразумевали, что бастарны были кельтским народом. Поздние римские авторы утверждают, что они говорили на германских языках и сами были германцами. Тацит утверждал, что бастарны переняли некоторые сарматские традиции. Независимо от их происхождения, первое историческое упоминание об этих людях относится к 179 году до н.э., когда по просьбе своего союзника, Филиппа V Македонского, они в большом количестве перешли реку Дунай. Позже эти люди стали союзниками гетов и сражались против римской экспансии. Бастарны сталкивались с Римом вплоть до своего исчезновения как народа в III веке н.э."
 # Ubian Tribes
 ubian_heritage:0 "Убийское наследие"
 ubian_heritage_desc:0 "Имя, означающее «над, выше», убии буквально находились выше своих соседей, проживая на северо-восточном берегу Рейна, но также и в социальном смысле — убии считали себя превосходным народом. Во время завоеваний Цезаря убии быстро заключили союз с Римом, стремясь к защите от воинственных свебов, которые стали угрожать им."
 # Cotinii
 cotinii_heritage:0 "Котинское наследие"
 cotinii_heritage_desc:0 "Котины — народ, живущий в горах, который в основном добывает богатые рудные залежи своей родины. Они занимаются добычей, к своему унижению. Позже они стали подчиняться вторгающимся сарматским племенам."
 eravisci_heritage:0 "Эравискское наследие"
 eravisci_heritage_desc:0 "Будучи необычно цивилизованным народом среди других племен региона, эрависки чеканили монеты, создавали керамику и украшения, а также работали с железом. Несмотря на свои достижения, они оставались незначительной и маловажной силой, и в 12 году до н.э. Рим завоевал эрависков, а их основное поселение стало римским городом Аквинкум."
 # Scordisci
 scordisci_heritage:0 "Наследие ящеролюдей"
 scordisci_heritage_desc:0 "Группа кельтского происхождения, скордиски (Ящеролюди) переселились в регион near гор Скордус в III веке, в рамках более широкого кельтского вторжения в Иллирию и Паннонию. В конечном итоге смешавшись с фракийским и иллирийским народами, которых они завоевали, скордиски были известны своей агрессивностью и жаждой битвы, sentiment, которое не ценилось их соседями."
 # Pannonian
 pannonian_heritage:0 "Паннонское наследие"
 pannonian_heritage_desc:0 "Разрозненные паннонские племена проживают на богатых и плодородных землях, области, которую вторгшиеся кельтские племена завоевали в IV веке до н.э. Извлекая выгоду из даров своей родины, паннонцы часто ведут войны, особенно против кельтов."