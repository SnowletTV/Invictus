l_russian:
# Gadir Negotiating a Truce Event Chain
 flavor_gad.2.t: "Трудная ситуация"
 flavor_gad.2.desc: "Война складывается для Гадира неудачно, и магистраты отчаянно ищут решение, которое позволит им сохранить свои привилегии. Они просят [ROOT.GetCountry.GetRuler.GetName] отправить послание с предложением выплатить захватчикам сумму золота в качестве дани, если те согласятся на белый мир."
 flavor_gad.2.a: "Возможно, немного золота поможет."
 flavor_gad.2.b: "Мы не сдадимся без боя!"
 flavor_gad.3.t: "Посол из Гадира"
 flavor_gad.3.desc: "Сегодня утром посол от [GetCountry('GAD').GetName] подошел к нашему лагерю с посланием от их лидеров; они хотят, чтобы мы заключили с ними белый мир в обмен на сумму золота, которую они обещают доставить после прекращения боевых действий.\n\nХотя в переговорах с трусами нет славы, казне всегда не помешает немного больше золота."
 flavor_gad.3.a: "Справедливая сделка!"
 flavor_gad.3.b: "Ха! Как смешно! Мы не будем вести переговоры!"
 flavor_gad.3.tooltip: "Наша текущая война с [GetCountry('GAD').GetName] закончится белым миром."
 flavor_gad.4.t: "Белый мир!"
 flavor_gad.4.desc: "Чудо, [ROOT.GetCountry.GetRuler.GetName]! Наши враги приняли наше предложение и согласились даровать нам мир. Цена, которую мы заплатили, была высока, но по крайней мере боевые действия прекратятся."
 flavor_gad.4.a: "Мы выживем, чтобы сражаться в другой день..."
 flavor_gad.4.tooltip: "Наша текущая война с [gadir_turdetanian_opponent.GetName] закончится белым миром."
 flavor_gad.5.t: "Мир отвергнут!"
 flavor_gad.5.desc: "К сожалению для нас, наши враги отказались удовлетворить наши предложения о белом мире и отправили наших дипломатов ни с чем. Чтобы усугубить ситуацию, они велели нам примириться с богами, ибо наш час расплаты близок — нам придется сражаться до горького конца."
 flavor_gad.5.a: "О нет!"
 # Turdetanian Coalition of 237 BCE Event Chain
 flavor_turdetanian.2.t: "Иностранное вторжение!"
 flavor_turdetanian.2.desc: "У нас ужасные новости, мой [ROOT.GetCountry.GetRulerTitle]. [GetCountry('CAR').GetName] официально объявил войну [ROOT.GetCountry.GetName] — похоже, что жадный шофет [GetProvince('(int32)3256').GetName] не успокоится, пока вся Иберия не будет заявлена как собственность [GetCountry('CAR').GetAdjective]. Паника охватила [ROOT.GetCountry.GetCapital.GetName], так как многие считают, что конец близок — у нас впереди битва всей нашей жизни, [ROOT.GetCountry.GetRuler.GetName].\n\nМы можем послать крик о помощи нашим братьям #E Турдетанам#!, апеллируя к нашим культурным связям, или столкнуться с угрозой в одиночку и произнести речь перед нашими армиями, которую они не скоро забудут.\n\n#E Исторический контекст#!:\nВ 516 году от основания города (237 г. до н.э.) #E Гамилькар#! [turdetanian_coalition_barcid_scope.GetName], [GetCountry('CAR').GetAdjective] полководец и патриарх семьи [turdetanian_coalition_barcid_scope.GetName], начал вторжение в #E Турдетанию#!. Его целью было захватить богатые земли и рудники региона, а также получить контроль над рынками [GetCountry('GAD').GetName], ключевого экономического соперника [GetCountry('CAR').GetName] на Иберийском полуострове.\nЭта кампания была направлена на укрепление африканского города путем обеспечения vast pool наемников и ресурсов для будущих конфликтов, особенно на Апеннинском полуострове и в африканских сердцевинах [GetCountry('CAR').GetName].\nНесмотря на первоначальные успехи, #E Гамилькар#! в итоге погиб во время кампании от рук конфедерации иберийских армий. Однако его усилия закрепили [GetCountry('CAR').GetAdjective] контроль в регионе, проложив путь его семье продолжить завоевание Иберийского полуострова семьей [turdetanian_coalition_barcid_scope.GetName] во время Второй Пунической войны."
 flavor_turdetanian.2.a: "Послать за помощью и молиться, чтобы наш призыв был услышан!"
 flavor_turdetanian.2.b: "Не бойтесь, мы справимся в одиночку!"
 flavor_turdetanian.2.tooltip: "Мы отправим сообщения каждой стране #Y Турдетанов#!, призывая их присоединиться к нашей войне на нашей стороне."
 flavor_turdetanian.2.tooltip.b: "#R Если не существует других стран турдетанов, то никто не ответит на призыв.#!"
 flavor_turdetanian.3.t: "Турдетанская коалиция"
 flavor_turdetanian.3.desc: "Мы получили frantic message от соседа — похоже, они воюют с dread армиями [GetCountry('CAR').GetName] и отчаянно надеются, что мы поможем им в их войне.\n\nИх дипломаты утверждают, что мы должны стоять вместе сейчас, потому что если мы не объединим силы, наши армии будут уничтожены одна за другой. В этих словах есть доля правды, но может ли [ROOT.GetCountry.GetName] рискнуть присоединиться к коалиции? Решение за [ROOT.GetCountry.GetRuler.GetName].\n\n#E Исторический контекст#!:\nВ 516 году от основания города (237 г. до н.э.) #E Гамилькар#! [turdetanian_coalition_barcid_scope.GetName], [GetCountry('CAR').GetAdjective] полководец и патриарх семьи [turdetanian_coalition_barcid_scope.GetName], начал вторжение в #E Турдетанию#!. Его целью было захватить богатые земли и рудники региона, а также получить контроль над рынками [GetCountry('GAD').GetName], ключевого экономического соперника [GetCountry('CAR').GetName] на Иберийском полуострове.\nЭта кампания была направлена на укрепление африканского города путем обеспечения vast pool наемников и ресурсов для будущих конфликтов, особенно на Апеннинском полуострове и в африканских сердцевинах [GetCountry('CAR').GetName].\nНесмотря на первоначальные успехи, #E Гамилькар#! в итоге погиб во время кампании от рук конфедерации иберийских армий. Однако его усилия закрепили [GetCountry('CAR').GetAdjective] контроль в регионе, проложив путь его семье продолжить завоевание Иберийского полуострова семьей [turdetanian_coalition_barcid_scope.GetName] во время Второй Пунической войны."
 flavor_turdetanian.3.a: "Конечно, мы присоединимся!"
 flavor_turdetanian.3.b: "Нас это не интересует."
 flavor_turdetanian.3.tooltip: "Мы присоединимся к коалиции против #Y Карфагенской агрессии#!!" 
 flavor_turdetanian.4.t: "Протянутая рука помощи!"
 flavor_turdetanian.4.desc: "Некоторые говорят, что [ROOT.GetCountry.GetRuler.GetName] едва не заплакал от радости, когда посланники прибыли в [ROOT.GetCountry.GetCapital.GetName].\n\n«Мы можем не всегда сходиться во взглядах, [ROOT.GetCountry.GetRuler.GetFirstName], но мы не будем бездействовать и смотреть, как пунийцы сжигают ваши города — сегодня это вы, но завтра это можем быть мы. Давайте вести войну вместе, такую, которая запомнится на века!»"
 flavor_turdetanian.4.a: "Благословение богов!"
 flavor_turdetanian.5.t: "Неблагодарный сосед"
 flavor_turdetanian.5.desc: "Мы получили леденящий кровь ответ от наших соседей, которые злорадно насмехаются над нашим текущим положением с [GetCountry('CAR').GetName].\n\n«Нам следует поблагодарить карфагенян за выполнение задачи, которую мы сами желали видеть исполненной. Как только [ROOT.GetCountry.GetCapital.GetName] падет, мы с нетерпением ждем возможности купить ваших жен и дочерей в рабство — обещаем обращаться с ними очень хорошо, действительно.»"
 flavor_turdetanian.5.a: "Да уничтожат их боги!"
 flavor_turdetanian.6.t: "Турдетанская коалиция!"
 flavor_turdetanian.6.desc: "Похоже, наш прогресс в регионе #E Турдетания#! встретил сопротивление. Турдетаны сформировали коалицию, чтобы попытаться остановить нас. Но их усилия будут разгромлены могучей армией [GetCountry('CAR').GetAdjective]!\n\n#E Исторический контекст#!:\nВ 516 году от основания города (237 г. до н.э.) #E Гамилькар#! [turdetanian_coalition_barcid_scope.GetName], [GetCountry('CAR').GetAdjective] полководец и патриарх семьи [turdetanian_coalition_barcid_scope.GetName], начал вторжение в #E Турдетанию#!. Его целью было захватить богатые земли и рудники региона, а также получить контроль над рынками [GetCountry('GAD').GetName], ключевого экономического соперника [GetCountry('CAR').GetName] на Иберийском полуострове.\nЭта кампания была направлена на укрепление африканского города путем обеспечения vast pool наемников и ресурсов для будущих конфликтов, особенно на Апеннинском полуострове и в африканских сердцевинах [GetCountry('CAR').GetName].\nНесмотря на первоначальные успехи, #E Гамилькар#! в итоге погиб во время кампании от рук конфедерации иберийских армий. Однако его усилия закрепили [GetCountry('CAR').GetAdjective] контроль в регионе, проложив путь его семье продолжить завоевание Иберийского полуострова семьей [turdetanian_coalition_barcid_scope.GetName] во время Второй Пунической войны."
 flavor_turdetanian.6.a: "Ну давай!"
 # Misc Events
 flavor_turdetanian.7.t: "В пунических руках"
 flavor_turdetanian.7.desc: "В новых приобретениях, сделанных [ROOT.GetCountry.GetRulerTitle] в регионе, мы контролируем один из многочисленных аванпостов, основанных нашим народом в землях Турдетании. Новое управление означает новые руководящие принципы. Эти аванпосты были переоборудованы в центр пунического культурного и демографического расширения."
 flavor_turdetanian.7.a: "Хорошо знать!"
 flavor_turdetanian.7.tooltip: "Модификатор '#Y $turdetanian_punic_outpost_mod$#!' был развит до '#Y $turdetanian_large_punic_outpost_mod$#!'."
 # Country Modifiers
 turdetanian_coalition_alone_modifier: "Один против Титана!"
 desc_turdetanian_coalition_alone_modifier: "Наши армии сильно мотивированы защищать свои земли от Карфагена благодаря речи нашего правителя."
 # Opinion Modifiers
 turdetanian_helped_on_coalition_opmod: "Присоединился к коалиции"
 turdetanian_not_helped_on_coalition_opmod: "Бросил нас"