 # Bloodline Related Localization
 scheme.11.desc_1:0 "Королевская библиотека [ROOT.GetCharacter.GetEmployer.GetCapital.GetName] оказалась invaluable source of knowledge over the years — похоже, что этот год не исключение. Исследуя гордое наследие своей bloodline, [ROOT.GetCharacter.GetEmployer.GetRulerTitle] [ROOT.GetCharacter.GetPraenomen] обнаружил small tablet, tucked into an alcove, long thought forgotten.\n\nВ почти неразборчивом письме она подробно описывала ветвь Дома [ROOT.GetCharacter.GetFamilyDisplayName], которая, похоже, связана с легендарным царем Арганфонием через [SCOPE.sChar('ancestor').GetName].\n\nЭти знания не пропадут даром."
 # Starting Events
 iberian_starting_country_events.tut.t:0 "Наследники Тартесса"
 iberian_starting_country_events.tut.desc:0 "Земля турдетанов в прошлом носила много имен; наиболее широко используемым было #E Тартесс#!. Это государство лежит along diffuse line of myth, и легенды говорят о богатстве и процветании королевства, которым правил сам Серебряный Человек, Арганфоний. Хотя #E Турдетания#! никогда не была объединена под одним королевством.\n\nФиникийцы и греки пытались колонизировать этот район с dawn of time, чтобы получить доступ к богатым рудникам и плодородным землям #E Турдетании#!. Легенды говорят о падении культуры #E Тартесса#! два века назад в конце битвы при [GetProvince('(int32)3515').GetName] между коалицией [GetCountry('ETR').GetAdjective] и [GetCountry('CAR').GetAdjective] и фокейскими греками из [GetProvince('(int32)3515').GetName], но правда сложнее, являясь смесью экономического замедления, изменений климата и социального кризиса, среди прочего.\n\nЗемля #E Турдетании#! разделена на три части. Западный регион в основном посвящен добыче богатых металлов из рудников [GetProvince('(int32)1414').GetName] и [GetProvince('(int32)1356').GetName], а два других — это #E Нижняя Бетика#! и #E Средняя Бетика#!. В то время как регион #E Нижней Бетики#! основывает свое богатство на lucrative flow торговых путей из западного региона и реки [GetProvince('(int32)7772').GetName], #E Средняя Бетика#! выигрывает от обширных и богатых сельскохозяйственных угодий, которые снабжают весь регион и beyond, экспортируя излишки в пунические колонии Иберии и Северной Африки.\n\nФиникийское влияние было постоянным в регионе и привело к ситуации, в которой ханаанские боги почитались так же часто, как и местные боги, особенно богиня Астарта и бог Мелькарт. Высшие классы сделали шаг вперед и приняли пунические обычаи как свои собственные. Эта ситуация создала rich melting pot, который породил уникальную культуру.\n\nНестабильность galvanizes регион в то время, когда [GetCountry('CAR').GetAdjective] стоят у ворот #E Турдетании#!, ища её богатства. Только время покажет, выживут ли турдетаны."
 iberian_starting_country_events.tut.a:0 "Время творить историю..."
 iberian_starting_country_events.crm.t:0 "Кармойя"
 iberian_starting_country_events.crm.desc:0 "Во внутренней Турдетании, near реки [GetProvince('(int32)7772').GetName], расположен город [GetProvince('(int32)1374').GetName]. Этот город когда-то жил quiet life, живя за счет торговли и специализируясь на металлургии, но политическая нестабильность, опустошившая #E Турдетанию#! после кризиса культуры #E Тартесса#!, изменила [GetCountry('CRM').GetAdjective].\n\nМастерство [GetCountry('CRM').GetName] в использовании металлов, их центральное положение на реке [GetProvince('(int32)7772').GetName], пуническое поселение [GetProvince('(int32)1355').GetName] и богатые сельскохозяйственные земли, окружающие город, делают [GetCountry('CRM').GetName] привилегированным государством в регионе. Но их соседи имеют similar advantages, и поддерживать их подчинение будет нелегко, если легитимность [GetCountry('CRM').GetName] окажется под вопросом.\n\nСможет ли [GetCountry('CRM').GetName] использовать все эти преимущества, чтобы стать гегемоном #E Турдетании#!, или останется второстепенным поселением, как это было раньше?"
 iberian_starting_country_events.crm.a:0 "Время творить историю..."
 iberian_starting_country_events.onu.t:0 "Онубайя"
 iberian_starting_country_events.onu.desc:0 "Прибрежный город [GetProvince('(int32)1339').GetName] был inhabited since immemorial times. Расположенный на полуострове в устье рек [GetProvince('(int32)1414').GetName] и #E Уриус#!, [GetProvince('(int32)1339').GetName] выигрывает от defendable location, а также является основным торговым узлом для commerce металлов, extracted from rich mines of [GetProvince('(int32)1414').GetName].\n\nХотя ранее богатые рудники [GetProvince('(int32)1414').GetName] начинают истощаться из-за чрезмерной эксплуатации и consequent change основной добычи на богатые рудники [GetCountry('ORT').GetName], [GetCountry('ONU').GetName] все еще является одним из самых богатых турдетанских государств и выигрывает от close ties с пуническим населением Иберии. [GetCountry('ONU').GetName] также известен производством #E Гарума#! благодаря своей thriving fishing industry, являясь одним из крупнейших производителей behind nearby Punic city of Gadir.\n\nДемографически [GetCountry('ONU').GetName] является довольно diverse state. С тех пор как первые финикийцы отправились за Столпы Геркулеса, ханаанеи торговали и селились в [GetCountry('ONU').GetName], составляя significant minority в таких городах, как [GetProvince('(int32)1339').GetName] или [GetProvince('(int32)1335').GetName]. Два века назад, во время кризиса культуры #E Тартесса#!, кельтские племена мигрировали с #E Центрального плато#! в земли, называемые [GetCountry('BDL').GetName] и [GetProvince('(int32)1337').GetArea.GetName]. Теперь, как и пунийцы, кельтиберские поселенцы мигрируют в [GetCountry('ONU').GetName], делая регион настоящим melting pot."
 iberian_starting_country_events.onu.a:0 "Время творить историю..."
 iberian_starting_country_events.asa.t:0 "Хастайя"
 iberian_starting_country_events.asa.desc:0 "За островом Картаре, в устье [GetProvince('(int32)7665').GetName], лежит [GetProvince('(int32)1342').GetName], prosperous city, чье богатство происходит от торговли металлами и товарами с пунийцами и fellow турдетанами. Near natural mouth of the [GetProvince('(int32)7665').GetName] и beside channel that ends just in front of [GetProvince('(int32)1344').GetName], [GetProvince('(int32)1342').GetName] вырос как один из крупнейших турдетанских городов, с prosperous market, full of life.\n\n[GetCountry('ASA').GetAdjective] — не только торговцы. Стремясь расширить свое влияние, [GetCountry('LSC').GetName] был подчинен и теперь живет под правилами [GetCountry('ASA').GetAdjective]. Расположенные в #E Нижнем Бетисе#!, земли вокруг [GetProvince('(int32)1342').GetName] состоят из river deposits и не так плодородны, как земли #E Среднего Бетиса#!, но их strategic location сделала их одним из greatest trade hubs #E Турдетании#!, на рынке которого торговец мог найти от металлов [GetCountry('ORT').GetAdjective] и [GetCountry('IPT').GetAdjective] до зерна и вина [GetCountry('CRM').GetAdjective] и [GetCountry('ASG').GetAdjective].\n\nСтанет ли [GetCountry('ASA').GetName] гегемоном #E Турдетании#!, или его свет будет extinguished another power?"
 iberian_starting_country_events.asa.a:0 "Время творить историю..."
 iberian_starting_country_events.gad.t:0 "Гадир"
 iberian_starting_country_events.gad.desc:0 "Давным-давно, за Столпами Геркулеса, поселенцы из [GetProvince('(int32)743').GetName] основали город на острове Эрифeia. Они назвали его [GetCountry('GAD').GetName], «Крепость». Как одна из oldest Phoenician Colonies in Western Mediterranean, богатство города происходит от его доступа к атлантическим оловянным путям и турдетанским рудникам.\n\n[GetCountry('GAD').GetName] хорошо известно и по другой причине; гарум из [GetProvince('(int32)1344').GetName] enjoys wide recognition as the best seasoning in the Mediterranean world, потребляемый от Иберии до Анатолии и beyond.\n\nКонец битвы при [GetProvince('(int32)3515').GetName] два века назад и падение греческого влияния в Западном Средиземноморье сначала были good news. [GetCountry('GAD').GetName] reinvented itself from an extractive colony to become the main trading hub beyond the Pillars. [GetCountry('GAD').GetName] возглавляет Лигу, integrated by other Punic colonies that fell into [GetCountry('GAD').GetAdjective] influence, developing and controlling the Atlantic trade from the Cassiterides to Arambys.\n\nНо преобладание [GetCountry('GAD').GetAdjective] оспаривается rise of [GetCountry('CAR').GetName]. Наследники Дидоны хотят позиции [GetCountry('GAD').GetName], однако [GetCountry('GAD').GetAdjective] пользуются покровительством самого бога Мелькарта и его Оракула. [GetCountry('GAD').GetName] должно подготовиться, если хочет выдержать [GetCountry('CAR').GetAdjective] экспансию."
 iberian_starting_country_events.gad.a:0 "Время творить историю."
 iberian_starting_country_events.sgs.t:0 "Арсека"
 iberian_starting_country_events.sgs.desc:0 "На восточном побережье Иберии лежит [GetProvince('(int32)1029').GetName], известный римлянам как Сагунт. Эдетаны flock to the Massalian harbor of Sagointium on the Levantine Coast to sell their wares, moving en masse to a series of hills overlooking the trading post. Там они основали город, который назвали Арсе. Эдетанское поселение начало расти, торгуя товарами, coming from the hinterlands of Iberian Peninsula and as well of those of their own manufacture. Good relations with the Greeks of [GetCountry('MAS').GetName], [GetCountry('HMK').GetName], and [GetCountry('EPO').GetName] created a fluent stream of cultural and economic exchanges.\n\nСоставной город [GetProvince('(int32)1029').GetName] разделен на два ядра. Сначала идет сам город, окруженный sturdy walls, защищающими основные правительственные здания государства. Снаружи лежит порт, называемый «Сагоинтиум», где живет большинство греческих купцов. Порт Сагоинтиум видит ships docking from different places, и стены [GetProvince('(int32)1029').GetName] защищают его жителей от external threats. [GetCountry('SGS').GetName] имеет честь быть первым иберийским городом, выпустившим свои собственные монеты.\n\nВремя покажет, будет ли [GetCountry('SGS').GetName] продолжать расти или perish under a stronger enemy, просто помните, будьте осторожны, если у ваших ворот появится парень по имени Ганнибал."
 iberian_starting_country_events.sgs.a:0 "Время творить историю..."
 # Province Modifiers
 turdetanian_punic_outpost_mod:0 "Пунический аванпост"
 desc_turdetanian_punic_outpost_mod:0 "Пунические поселенцы построили аванпост на этой территории."
 turdetanian_large_punic_outpost_mod:0 "Крупное пуническое поселение"
 desc_turdetanian_large_punic_outpost_mod:0 "На этой территории когда-то был пунический аванпост. Поскольку пунийцы взяли прямой контроль над ним, аванпост был развит в proper settlement, поощряя ассимиляцию коренного населения."
 iberian_pyrite_belt:0 "Иберийский пиритовый пояс"
 desc_iberian_pyrite_belt:0 "На юго-западе Иберийского полуострова находится Иберийский пиритовый пояс, самые богатые залежи пирита в регионе, эксплуатируемые с незапамятных времен. Хотя и не такие продуктивные, как раньше, эти рудники все еще довольно богаты."
 mines_of_castulo:0 "Рудники Кастуло"
 desc_mines_of_castulo:0 "Вокруг Кастуло лежит большое месторождение металлов, которое сделало эту землю главным центром эксплуатации Южной Иберии."
 iberian_pyrite_belt_restored:0 "Иберийский пиритовый пояс"
 desc_iberian_pyrite_belt_restored:0 "На юго-западе Иберийского полуострова находится Иберийский пиритовый пояс, самые богатые залежи пирита в регионе, эксплуатируемые с незапамятных времен. Эти рудники были restored to their old glory."
 the_gadeiras_modifier:0 "Гадирейские острова"
 desc_the_gadeiras_modifier:0 "Гадирейские острова — это архипелаг, образованный островами Эрифeia (где расположен город Гадир), Котиноусса и Антиполис. Это расположение делает территорию difficult to invade from land."