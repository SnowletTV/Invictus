l_russian:
# New Heritages to be implemented
 arganthonios_heritage:0 "Наследие Арганфония"
 arganthonios_heritage_desc:0 "Арганфоний был последним известным царем Тартесса до краха королевства под натиском финикийского завоевания после битвы при Алалии, где карфагенско-этрусский флот разбил фокейских греков. Теперь их преемники восстановили былое величие и богатое наследие, став новым и более сильным государством, которое бросит вызов времени."
 # New Iberian Deities
 deity_nabia:0 "$omen_nabia$"
 omen_nabia:0 "Набия"
 omen_nabia_desc:0 "Набия — иберийская богиня воды и плодородия, имеющая особое значение для северных культур полуострова; её святилища находятся near рек и озер.\n\nНабию часто ассоциируют с эллинской богиней Артемидой.\n\n#! Эффект апофеоза: $naval_apotheosis_effect_tt_description$"
 deity_neto:0 "$omen_neto$"
 omen_neto:0 "Нето"
 omen_neto_desc:0 "Нето — бог войны и один из немногих общеполуостровных богов, которому поклоняются как иберы, так и кельтиберы. Его считают адским солнечным богом, властелином хаотичного мира.\n\nНето ассоциируется с римским Марсом или эллинским Аресом.\n\n#! Эффект апофеоза: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_borvo:0 "$omen_borvo$"
 omen_borvo:0 "Борво"
 omen_borvo_desc:0 "Борво — бог минералов и исцеления, связанный с родниковой водой. Ему поклоняются за пределами Иберийского полуострова, находя религиозные центры в Галлии и южной Германии.\n\nБорво обычно отождествляется с эллинским богом Аполлоном.\n\n#! Эффект апофеоза: $economy_income_effect_tt_description$"
 deity_arganthonios:0 "$omen_arganthonios$"
 omen_arganthonios:0 "Арганфоний"
 omen_arganthonios_desc:0 "Арганфоний — мифический царь Тартесса, известный грекам своим богатством и щедростью. Он дал деньги фокейцам на восстановление стен города Фокея, когда узнал, что мидяне становятся доминирующей силой в Малой Азии.\n\n#! Эффект апофеоза: $economy_income_effect_tt_description$"
 deity_aqueloo:0 "$omen_aqueloo$"
 omen_aqueloo:0 "Акелоо"
 omen_aqueloo_desc:0 "$achelous_description$\n\n#Y Акелоо#!: Акелоо, иберийская интерпретация эллинского бога Ахелоя, является богом рек и плодородия. Акелоо имеет тело овцебыка и бородатое лицо человека, увенчанное внушительными бычьими ушами.\n\nКак и его эллинский counterpart, Акелоо почитается как даритель процветания полям, обеспечивая плодородие почвы и sustenance жизни. Статуя Ахелоя или Акелоо, предположительно вырезанная из блоков известняка в середине VI века до н.э., была excavated в начале XX века near кургана бастетанов и получила название «Бича из Балазоте».\n\n#! Эффект апофеоза: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_astarte_turdetani:0 "$omen_astarte_turdetani$"
 omen_astarte_turdetani:0 "Астарта Турдетани"
 omen_astarte_turdetani_desc:0 "Астарта Турдетани — местная интерпретация знаменитой ханаанской богини войны, красоты и любви Астарты. Введение этого божества произошло от первых финикийских поселенцев в начале железного века, и оно quickly стало одним из самых любимых божеств среди коренных народов Иберийского полуострова. Её изображения можно найти повсюду на иберийских и древних тартессийских землях, где ей посвящено множество святынь и храмов.\n\n#! Эффект апофеоза: $fertility_apotheosis_capital_effect_tt_description$"
 # New Druidic Deities
 deity_trebaruna:0 "$omen_trebaruna$"
 omen_trebaruna:0 "Требаруна"
 omen_trebaruna_desc:0 "Требаруна — лузитанская богина с неясными атрибутами. Её культ широко распространен в Галлеции и Лузитании.\n\n#! Эффект апофеоза: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_ares_lusitani:0 "$omen_ares_lusitani$"
 omen_ares_lusitani:0 "Арес Лузитани"
 omen_ares_lusitani_desc:0 "Арес Лузитани — бог лошадей и всадников лузитанов. Как следует из названия, Арес Лузитани — бог эллинского происхождения, который нашел свое место в местных пантеонах благодаря культурному обмену с греческими торговцами Средиземноморья.\n\n#! Эффект апофеоза: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_vaelicus:0 "$omen_vaelicus$"
 omen_vaelicus:0 "Ваэликус"
 omen_vaelicus_desc:0 "Ваэликус — веттонский бог загробной жизни и природы. Его обычно ассоциируют с богом Эндоуэлликосом, которому поклоняются лузитаны и каллаэки.\n\n#! Эффект апофеоза: $fertility_apotheosis_capital_effect_tt_description$"
 # New Canaanite Deity
# deity_babai:0 "$omen_babai$"
# omen_babai:0 "Бабаи"
# omen_babai_desc:0 "Бабаи — Бог-Отец нурагической и корсиканской культур #Корсики и Сардинии. Сильно подверженный влиянию финикийской религии и обычаев, к этому #времени его поклонение ограничено внутренними районами островов, где коренные #общины продолжают следовать своим традициям."
# deity_mother_goddess_nuragic:0 "$omen_mother_goddess_nuragic$"
# omen_mother_goddess_nuragic:0 "Богиня-Мать"
# omen_mother_goddess_nuragic_desc:0 "Богиня-Мать нурагической и корсиканской #культур связана со средиземноморскими Богинями-Матерями. Как и Бабаи, её поклонение #теперь ограничено внутренними районами островов, ожидающими возвращения её земель."
# deity_sardus_can:0 "$omen_sardus$"
# omen_sardus_can:0 "Сард"
# omen_sardus_can_desc:0 "Сард, иногда называемый эллинами Сардус Патер, — #мифический герой-основатель сардинцев. Сын Геракла или Макериса, он жил #в Ливии, пока не возглавил экспедицию по колонизации острова Ихнуса, позже названного #Сардинией в его честь. Его ассоциируют с Богом-Отцом Бабаи."
 # New Marite Religion
 pre_indo_european_religion:0 "Марите"
 desc_pre_indo_european_religion:0 "Доиндоевропейская вера, маритский язычество включает сочетание верований, включая почитание демонов, духов и богов. Самой важной фигурой является богиня Мари, которой поклоняются как Верховной Богине."
 # New Marite Deity
 deity_sugaar:0 "$omen_sugaar$"
 omen_sugaar:0 "Сугаар"
 omen_sugaar_desc:0 "Мы принесем наши молитвы богу Сугаару, мужу Мари и богу штормов и грома. Пусть его змеиная фигура терроризирует наших врагов и вдохновляет наших воинов.\n\n#! Эффект апофеоза: $military_apotheosis_manpower_effect_tt_description$"
 deity_eate:0 "$omen_eate$"
 omen_eate:0 "Эате"
 omen_eate_desc:0 "Мы будем поклоняться Эате, богу штормов, чья борода состоит из огня и льда. С его поддержкой ни один враг не сможет нас завоевать.\n\n#! Эффект апофеоза: $military_apotheosis_defensive_effect_tt_description$"
 deity_amalur:0 "$omen_amalur$"
 omen_amalur:0 "Амалур"
 omen_amalur_desc:0 "Мы будем поклоняться Амалур, богине земли, другому лицу Мари и матери богинь Эки и Иларги. Её благословение заставит наш народ ликовать.\n\n#! Эффект апофеоза: $fertility_apotheosis_food_effect_tt_description$"
 deity_basajaun:0 "$omen_basajaun$"
 omen_basajaun:0 "Басахауны"
 omen_basajaun_desc:0 "Мы принесем наши молитвы Басахаунам, Владыкам Леса. Пусть их мудрость просвещает наших мыслителей и защищает наших пастухов.\n\n#! Эффект апофеоза: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_aatxe:0 "$omen_aatxe$"
 omen_aatxe:0 "Аатше"
 omen_aatxe_desc:0 "Мы будем поклоняться Аатше, духу-оборотню, работающему в тени. Пусть преступники боятся его гнева, ведь Аатше защищает наш народ.\n\n#! Эффект апофеоза: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_ilargi:0 "$omen_ilargi$"
 omen_ilargi:0 "Иларги"
 omen_ilargi_desc:0 "Мы принесем наши молитвы Иларги, богине луны и дочери Амалур. Пусть её ежедневное путешествие к встрече с Матерью будет успешным.\n\n#! Эффект апофеоза: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_lurraberri:0 "$omen_lurraberri$"
 omen_lurraberri:0 "Лурраберри"
 omen_lurraberri_desc:0 "Имя Лурраберри означает «новая почва», и перед ним часто стоял эпитет «Андереши», что означает «цветущий». Возможно, это указывает на то, что Лурраберри мог быть богом плодородия или, возможно, даже богом деревьев или цветов. Это также может означать, что он был богом возрождения. Имя Лурраберри было указано в надписи, где оно читалось как Илурриберриксус Андереши, романизированная версия Лурраберри.\n\n#! Эффект апофеоза: $military_apotheosis_manpower_effect_tt_description$"
 deity_orko:0 "$omen_orko$"
 omen_orko:0 "Орко"
 omen_orko_desc:0 "Орко был богом грома. Его имя использовалось в баскском слове для обозначения четверга, Оркогуна, связывая его с такими богами, как Тунараз/Тор и Юпитер/Зевс. Возможно, этот бог был второстепенным божеством до римского влияния, но значимость naming a day after him показывает, что он, возможно, имел большое значение для басков.\n\n#! Эффект апофеоза: $military_apotheosis_military_experience_effect_tt_description$"
 deity_lobegi:0 "$omen_lobegi$"
 omen_lobegi:0 "Лобеги"
 omen_lobegi_desc:0 "Имя Лобеги происходит от надписи, гласящей «Лакобегий», которая, похоже, является романизированной версией имени баскского бога. Поскольку корень «лако» явно происходит от латинского «lacus (озеро)», возможно, оригинальный корень был чем-то closer к «ло», баскскому слову для озера, или, возможно, чему-то другому. В любом случае, вторая часть его имени, беги, означает глаза. Так что его имя переводится как «Глаза Озера». Это может указывать на то, что Лобеги был своего рода водным божеством мудрости.\n\n#! Эффект апофеоза: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_sorginak:0 "$omen_sorginak$"
 omen_sorginak:0 "Соргинак"
 omen_sorginak_desc:0 "Соргинаки были не одним божеством или божествами вообще. Вместо этого они были мистическими существами и людьми, которых в более поздние периоды часто называли ведьмами. Они практиковали магию и могли вызывать все sorts of boons or banes. Некоторые соргинаки также считались ламинаками, которые были нимфами плодородия.\n\n#! Эффект апофеоза: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_inguma:0 "$omen_inguma$"
 omen_inguma:0 "Ингума"
 omen_inguma_desc:0 "Ингума — бог снов и кошмаров. Хотя иногда злобный, этот бог оказал lasting impact на баскскую религию, и возможно, ему поклонялись еще в до-римские времена.\n\n#! Эффект апофеоза: $culture_apotheosis_characters_effect_tt_description$"
 deity_aiko:0 "$omen_aiko$"
 omen_aiko:0 "Айко"
 omen_aiko_desc:0 "Айко — сын Мари и герой баскского народа. Его легенда гласит, что именно он established баскскую культуру и религию и был героем многих подвигов. Такой персонаж, которому приписывают происхождение самих басков, мог почитаться еще в до-римские времена, если не раньше.\n\n#! Эффект апофеоза: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_laminak:0 "$omen_laminak$"
 omen_laminak:0 "Ламинаки"
 omen_laminak_desc:0 "Ламинаки были женскими духами или нимфами секса и плодородия. Говорили, что они помогали женщинам при родах, с плодородием и хорошим здоровьем. Ламинаки не всегда изображались как добрые духи, так как в одном из мифов они захватывают богиню Мари.\n\n#! Эффект апофеоза: $fertility_apotheosis_food_effect_tt_description$"
 deity_urtzi:0 "$omen_urtzi$"
 omen_urtzi:0 "Уртци"
 omen_urtzi_desc:0 "Уртци представляет собой интересный case for existence. Многие утверждают, что Уртци должен был быть небесным богом, так как многие имена, места и слова, похоже, несут корень Уртци, а также некоторые внешние источники утверждают, что религия маритов была home to such a sky god, однако некоторые ученые считают, что Уртци — это просто слово для неба. Возможно, обе гипотезы верны, однако мы также можем никогда не узнать истину behind this mystery.\n\n#! Эффект апофеоза: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 # New Treasures
 treasure_stone_verracos:0 "Зооморфные статуи"
 treasure_stone_verracos_desc:0 "Зооморфные мегалитические памятники из гранита, представляющие четырехногих животных, таких как быки, медведи и свиньи, с неясным назначением."
 treasure_tarshish_stelae:0 "Стелы Таршиша"
 treasure_tarshish_stelae_desc:0 "Эта стела незапамятной древности повествует о победе Милкатона над сардинцами в земле Таршиш и благодарит богов за то, что они позволили им благополучно вернуться домой."
 treasure_mausoleum_of_the_lions_iberic:0 "Мавзолей Львов"
 treasure_mausoleum_of_the_lions_iberic_desc:0 "Этот мавзолей, сильно influenced neo-hittite art, охраняется четырьмя каменными львами, расположенными по углам. Богатые рельефы изображают сцены природы и мифологии, такие как Двенадцать подвигов Геракла и Чудовищный Пир."
 treasure_warrior_statue_iberic:0 "Статуя иберийского воина"
 treasure_warrior_statue_iberic_desc:0 "Эта статуя из калькаренитового камня изображает иберийского воина аристократического происхождения, готового к бою, в полном доспехе, с кайтрой и фалькатой. Она украшена металлическими и другими съемными орнаментами."
 #treasure_turdetanian_bull:0 "Турдетанский бык"
 #treasure_turdetanian_bull_desc:0 "Известняковая статуя быка, sculpted турдетанами, с целью защиты душ мертвых на их пути в загробную жизнь."
 treasure_callaecian_ornated_axe:0 "Украшенный топор"
 treasure_callaecian_ornated_axe_desc:0 "Этот votive axe каллаэкского происхождения, украшенный торквами, долгое время использовался для совершения жертвоприношений."
 treasure_tartessian_ceremonial_bit:0 "Церемониальное удило"
 treasure_tartessian_ceremonial_bit_desc:0 "Реликт давно исчезнувшей тартессийской культуры. Это церемониальное удило изображает ханаанскую богиню Астарту с прической египетской богини Хатор, в сопровождении двух птиц и лилий."
 treasure_ilercavonian_vessel:0 "Серебряные сосуды"
 treasure_ilercавonian_vessel_desc:0 "Набор серебряных и золотых сосудов, чаш и ожерелий илеркавонского производства."
 treasure_edetanian_censer:0 "Курильница с головой богини"
 treasure_edetanian_censer_desc:0 "Эта богатая курильница эдетанского происхождения изображает голову ханаанской богини Таннит или, возможно, эллинской богини Деметры."
 treasure_olcadian_necklace:0 "Олкадийское ожерелье"
 treasure_olcadian_necklace_desc:0 "Это ожерелье, используемое олкладийской жрицей и сделанное из глины, украшено утками и лебедями."
 treasure_celtiberian_plaques:0 "Четыре таблички"
 treasure_celtiberian_plaques_desc:0 "Четыре таблички, написанные на кельтиберском языке и сделанные из бронзы, содержат правовой корпус кельтиберского народа."
 treasure_lusitanian_fibula:0 "Золотая фибула"
 treasure_lusitanian_fibula_desc:0 "Золотая фибула, сделанная греческим золотых дел мастером по заказу кельтского принца. Она украшена сценой, где обнаженный воин с кельтским щитом и шлемом сражается со львом."
 treasure_offerer_lady_statue_iberic:0 "Статуя дамы с подношением"
 treasure_offerer_lady_statue_iberic_desc:0 "Полихромная статуя высокопоставленной дамы, делающей подношение одному из многочисленных божеств, которым поклонялись иберы. Дама держит сосуд в обеих руках и богато одета в три накладывающиеся друг на друга робы, скрепленные фибулой у шеи."
 treasure_turdetanian_reliefs_iberic:0 "Турдетанские рельефы"
 treasure_turdetanian_reliefs_iberic_desc:0 "Серия высоких рельефов из известняка из турдетанского города Урсо, изображающих значительный диапазон сцен. Все они связаны с funerary monuments, рельефы представляют большое разнообразие людей и животных."
 # Aquitania Claims
 form_aquitania_claims_tooltip:0 "Аквитания получит претензии на регион #Y Аквитания#!."
 # Greater Aquitania Formable
 form_greater_aquitania_claims_tooltip:0 "Великая Аквитания получит претензии на регионы #Y Галлеция#!, #Y Тарраконенсис#! и #Y Арморика#!."
 form_greater_aquitania:0 "Сформировать Великую Аквитанию"
 form_greater_aquitania_desc:0 "Наши пути древни, мы сохраняли и чтили обычаи наших предков с незапамятных времен; однако, если ими неправильно управлять, мы можем исчезнуть в анналах истории, как и многие другие до нас. Если мы сможем сохранить угольки аквитанской культуры, их можно раздуть в мощное пламя и использовать для создания чего-то extraordinary."
 formable_greater_aquitania:0 "Великая Аквитания"
 AQ2: "$GREATER_AQUITANIA_NAME$"
