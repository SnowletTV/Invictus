 celtiberian_plaques_treasure:0 "Заказать бронзовые таблички"
 celtiberian_plaques_treasure_desc:0 "С более централизованным государством нам нужно установить clear canon наших законов, а не зависеть от устной передачи, которая может привести к недопониманию и несправедливости."
