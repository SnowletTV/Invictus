 ### Beyond the Rhodopes
 # Mission
 macedon_05_rhodopes:0 "За Родопами"
 macedon_05_rhodopes_BUTTON_TOOLTIP:0 "Македония теперь готова возобновить великие завоевания; мы должны начать занимать позиции на Востоке."
 macedon_05_rhodopes_BUTTON_DETAILS:0 ""
 macedon_05_rhodopes_DESCRIPTION:0 "По мере консолидации македонских владений наши взоры обратились к восточным диадохам — Лисимаху. Этот тиран контролирует стратегический доступ к Босфору, хотя его земли малонаселены, и большая часть экономической силы сосредоточена в трёх городах. Мы убеждены, что это лишь вопрос времени, прежде чем между нашими народами вспыхнет война."
 macedon_05_rhodopes_CRITERIA_DESCRIPTION:0 "Миссия будет выполнена, когда мы завоюем Фракию и земли ниже реки Истр, на западной стороне Босфора."
 # Tasks
 macedon_05_rhodopes_1:0 "Предложение из Пеллы"
 macedon_05_rhodopes_1_DESC:0 "Государства Понта Эвксинского проявляют растущую враждебность к своему фракийскому повелителю; возможно, мы сможем использовать их ненависть, чтобы заставить их присоединиться к нам и ослабить нашего соседа."
 macedon_05_rhodopes_1.tt.1:0 "Фракийским подданным на Понте Эвксинском будет предложено перейти на нашу сторону и присоединиться к нам.\nЕсли они #G согласятся#!:"
 macedon_05_rhodopes_1.tt.2:0 "Если они #R откажутся#!:"
 macedon_05_rhodopes_2:0 "Завоевание Фракии"
 macedon_05_rhodopes_2_DESC:0 "Земли Лисимаха наконец-то наши! Мы будем использовать эти территории как базу для наших следующих завоеваний, возможно, в Азии или где-то на Севере."
 macedon_05_rhodopes_3:0 "Бывшая фракийская столица"
 macedon_05_rhodopes_3_DESC:0 "Город [GetProvince('(int32)350').GetName] хорошо расположен для создания столицы, и у нас есть средства и возможности воплотить эту мечту в реальность. Сообщите, что должно быть сделано."
 macedon_05_rhodopes_3_trigger_tt:0 "#Y [THIS.GetProvince.GetName]#! имеет население как минимум #Y [SCOPE.ScriptValue('mac_rhodopes_task_3_pop_total')|0]#!. (#R [SCOPE.ScriptValue('mac_rhodopes_task_3_pop')|0]#!/#Y [SCOPE.ScriptValue('mac_rhodopes_task_3_pop_total')|0]#!)"
 macedon_05_rhodopes_4:0 "Город чеканки монет"
 macedon_05_rhodopes_4_DESC:0 "Абдера имеет важное экономическое значение, так как это город, где большинство эллинских государств чеканят свои деньги. Изменчивые потоки судьбы сделали нас новыми хозяевами Абдеры, и таким образом мы получили преимущество; мы должны воспользоваться ситуацией и использовать её в своих интересах."
 macedon_05_rhodopes_5:0 "Антипатрея на Эвре"
 macedon_05_rhodopes_5_DESC:0 "Южная Фракия располагает несколькими плодородными землями и обширными равнинами, которые мы могли бы использовать для основания городов; наши разведчики заметили одно такое место между сельскохозяйственными угодьями и рекой."
 macedon_05_rhodopes_6:0 "Дарданское иго"
 macedon_05_rhodopes_6_DESC:0 "Дарданские племена являются занозой в нашем боку. Наши приграничные города и деревни часто подвергаются набегам этих диких варваров, и они продолжают игнорировать наши предупреждения; мы должны действовать, чтобы наказать этих глупцов."
 macedon_05_rhodopes_7:0 "Вопрос Одрисии"
 macedon_05_rhodopes_7_DESC:0 "Северная Фракия населена одрисскими варварами, чьи земли довольно богаты и плодородны по сравнению с остальной частью Фракии. Мы должны стремиться захватить эти территории, пока это не сделал кто-то другой."
 macedon_05_rhodopes_8:0 "К Истру"
 macedon_05_rhodopes_8_DESC:0 "Мы отбросили одрисские племена, но мы можем пойти дальше, до реки Истр; земли на южном берегу реки могут дать нам надёжный щит против варварских набегов. Мы возьмём их силой, если потребуется, ради безопасности нашего народа."
 mac_05_task_8_allow_tt:0 "Вы должны владеть всеми провинциями на южном берегу Истра"
 macedon_05_rhodopes_9:0 "Византийские переговоры"
 macedon_05_rhodopes_9_DESC:0 ""
 macedon_05_rhodopes_task_9.tt:1 "[GetCountry('MAC').GetName] граничит с [GetCountry('BYZ').GetName|Y]."
 macedon_05_rhodopes_10:0 "Мезийские колонии"
 macedon_05_rhodopes_10_DESC:0 ""
 macedon_05_rhodopes_11:0 "Поселение в Дардании"
 macedon_05_rhodopes_11_DESC:0 ""
 macedon_05_rhodopes_12:0 "Морское господство"
 macedon_05_rhodopes_12_DESC:0 ""
 mac_05_rhodopes_task_12_tt:0 "Адмирал #Y Никанор#! явится на службу со своим флотом возле #Y Пеллы#!."
 mac_mission_05_rhodopes_ship_val:0 "Иметь как минимум #Y [SCOPE.ScriptValue('mac_rhodopes_task_12_ship_total')|0]#! кораблей"
 mac_mission_05_rhodopes_liburnian_total_val:0 "Иметь как минимум #Y [SCOPE.ScriptValue('mac_rhodopes_task_12_liburnian_total')|0]#! либурн"
 mac_mission_05_rhodopes_mega_galley_total_val:0 "Иметь как минимум #Y [SCOPE.ScriptValue('mac_rhodopes_task_12_mega_galley_total')|0]#! мега-полирем"
 macedon_05_rhodopes_13:0 "Западная сторона Босфора"
 macedon_05_rhodopes_13_DESC:0 ""
 macedon_05_rhodopes_14:0 "Вторжение в Мезию"
 macedon_05_rhodopes_14_DESC:0 ""
 mac_05_invade_moesia_tt:0 "#C Претензии#! на регион Мезии.\n#Y Македония#! сможет получить небольшой военный бонус."