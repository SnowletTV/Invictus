l_russian:
### Antipater's Legacy
 # Mission
 macedon_01_legacy:0 "Наследие [GetCharacter('(int32)9').GetPraenomen]"
 macedon_01_legacy_BUTTON_TOOLTIP:0 "Из всех диадохов именно Антипатриды владеют исконной родиной македонян и занимают трон [GetCharacter('(int32)35').GetPraenomen] и [GetCharacter('(int32)39').GetPraenomen] — наследники [GetCharacter('(int32)32').GetPraenomen] являются законными преемниками династии Аргеадов!"
 macedon_01_legacy_BUTTON_DETAILS:0 ""
 macedon_01_legacy_DESCRIPTION:0 "Наследники мудрого [GetCharacter('(int32)9').GetPraenomen] по праву обязаны этому королевству трудом и жертвами, которые [GetCharacter('(int32)9').GetSheHe] принес, чтобы удержать его вместе, пока [GetCharacter('(int32)39').GetPraenomen] гнался за [GetCharacter('(int32)39').GetHerHis] фантазиями на востоке — наследники Аргеадов от [GetCharacter('(int32)32').GetPraenomen] являются лишь венцом."
 macedon_01_legacy_CRITERIA_DESCRIPTION:0 "Защитить наследие [GetCharacter('(int32)9').GetPraenomen], обороняя [GetCountry('MAC').GetName] от других диадохов и обеспечив её сферу влияния."
 macedon_01_legacy_REWARD_DESCRIPTION:0 "Сковать новую Македонию под руководством Антипатридов, чье доминирование над Грецией не может быть оспорено."
 # Tasks
 macedon_01_legacy_1:0 "$antigonid_02_aspiration_2$"
 macedon_01_legacy_1_DESC:0 "Дерзкие эпироты стремятся использовать войны диадохов и свои связи с династией Аргеадов, чтобы бросить вызов нашей власти в регионе [GetProvince('(int32)418').GetArea.GetRegion.GetName], чего нельзя допустить."
 macedon_01_legacy_1_allow_conquest_subject_tt:0 "@[GetCountry('EPI').GetFlag]! [GetCountry('EPI').GetName|Y] не существует или является вассалом @[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y]."
 macedon_01_legacy_2:0 "Пеония Македонская"
 macedon_01_legacy_2_DESC:0 "Экспансия [GetCharacter('(int32)35').GetPraenomen] в южную часть региона [GetProvince('(int32)4304').GetArea.GetName] была лишь началом. Северные племена всё ещё питают к нам resentment, поэтому вся Пеония должна стать македонской."
 macedon_01_legacy_2_reward_tt:0 "@[GetCountry('MAC').GetFlag]! [GetCountry('MAC').GetName|Y] может аннексировать или возвысить @[GetCountry('PAA').GetFlag]! [GetCountry('PAA').GetAdjective|Y] и @[GetCountry('MAD').GetFlag]! [GetCountry('MAD').GetAdjective|Y] племена."
 macedon_01_legacy_3:0 "Агрианские рекруты"
 macedon_01_legacy_3_DESC:0 "При [GetCharacter('(int32)35').GetPraenomen] и [GetCharacter('(int32)39').GetPraenomen] элитные метатели дротиков из агрианов использовались с разрушительным эффектом в skirmish lines македонской армии — ресурс, который мы можем снова пустить в дело."
 macedon_01_legacy_3_reward_tt:1 "Легион нашего столичного наместничества ([THIS.GetCountry.GetCapital.GetArea.GetRegion.GetName]) получит бонус к легкой пехоте и сопротивлению истощению."
 macedon_01_legacy_3_reward_2_tt:0 "Племя @[GetCountry('SDI').GetFlag]! [GetCountry('SDI').GetAdjective|Y] станет вассалом @[GetCountry('MAC').GetFlag]! [GetCountry('MAC').GetName|Y]"
 macedon_01_legacy_5:0 "Безрассудство Деметрия"
 macedon_01_legacy_5_DESC:0 "Захват [GetCharacter('(int32)38').GetPraenomen] важного стратегического города [GetProvince('(int32)407').GetName] отбросил назад наши усилия по восстановлению влияния Антипатридов в регионе [GetProvince('(int32)407').GetArea.GetRegion.GetName]. Мы должны отбить его у [GetCountry('PRY').GetAdjective]ов."
 macedon_01_legacy_6:0 "Коринфский союз"
 macedon_01_legacy_6_DESC:0 "Пришло время официально восстановить Коринфский союз; ответ Македонии на требования непокорных греческих городов-государств об автономии."
 macedon_01_legacy_6_allow_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] имеет не менее [SCOPE.ScriptValue('macedon_01_legacy_6_target')|Y0] вассалов культуры #Y $hellenic$#!, имеющих не менее #Y 3#! территорий каждый, со столицами в вышеуказанных провинциях. [SCOPE.Custom('mac_mis_01_6_cus_loc')]"
 mac_mis_01_6_allow_sv_ongoing:0 "([SCOPE.ScriptValue('macedon_01_legacy_6_counter')|R0]/[SCOPE.ScriptValue('macedon_01_legacy_6_target')|Y0])"
 mac_mis_01_6_allow_sv_complete:0 "([SCOPE.ScriptValue('macedon_01_legacy_6_counter')|Y0]/[SCOPE.ScriptValue('macedon_01_legacy_6_target')|Y0])"
 macedon_01_legacy_6_2_allow_tt:0 "Ни один другой диадох $macedon_01_legacy_6_diad_tt$"
 macedon_01_legacy_6_diad_tt:0 "$mac_other_diadochi_tooltip$ владеет или имеет вассалов в $ant_hellas_list_tt$. [me_macedon_scope.Custom('ant_mis_01_12_pre_cus_loc')]"
 mac_other_diadochi_tooltip:0 "(@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetName|Y], @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName|Y], @[GetCountry('EGY').GetFlag]! [GetCountry('EGY').GetName|Y], @[GetCountry('SEL').GetFlag]! [GetCountry('SEL').GetName|Y])"
 macedon_01_legacy_7:0 "Афинские интриги"
 macedon_01_legacy_7_DESC:0 "Афинские фарсы повиновения македонскому правлению — будь то Антипатридам или Антигонидам — прозрачны, но outrages [GetCharacter('(int32)38').GetPraenomen] могут позволить нам однажды сыграть роль освободителя."
 macedon_01_legacy_7_allow_tt:0 "Государство @[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetName|Y] распалось после смерти [GetCharacter('(int32)37').GetPraenomen], и бежало в регион [GetProvince('(int32)418').GetArea.GetRegion.GetName]."
 macedon_01_legacy_7_allow_tt2:0 "@[GetCountry('ATH').GetFlag]! [GetCountry('ATH').GetName|Y] является вассалом @[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetName|Y]."
 macedon_01_legacy_7_reward_tt:0 "@[GetCountry('ATH').GetFlag]! [GetCountry('ATH').GetName|Y] будет склонено к defection от @[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetName|Y] и станет нашим олигархическим вассалом."
 macedon_01_legacy_7_allow_tt_2:0 "@[GetCountry('ATH').GetFlag]! [GetCountry('ATH').GetName|Y] существует."
 macedon_01_legacy_8:0 "Формализовать монархию"
 macedon_01_legacy_8_DESC:0 "Антипатриды избегали диадемы и титула басилевса, пока наши rivals провозглашали свою королевскую власть и божественность. Пришло время нам принять более regal outlook."
 macedon_01_legacy_8_allow_tt:0 "[me_macedon_scope.GetRulerTitle] [me_macedon_scope.GetName] ([me_macedon_scope.GetRuler.GetName|Y]) имеет черту '#Y $antipatrid$#!' и не является [GetCharacter('(int32)32').GetName]."
 macedon_01_legacy_9:0 "Фессалийская цепь"
 macedon_01_legacy_9_DESC:0 "Новый бастион в Фессалии, между македонским сердцем и непокорными греческими городами, обеспечит strong fallback position в случае повторения Ламийской войны или вторжения диадохов."
 macedon_01_legacy_10:0 "Западная гегемония"
 macedon_01_legacy_10_DESC:0 "Дикая Этолия и окружающая часть западной Греции имеют integral значение для нашего удержания Эллады и являются естественной целью из-за их союзов с Антигонидами."
 macedon_01_legacy_11:0 "Остатки Пангеона"
 macedon_01_legacy_11_DESC:0 "Рудники горы Пангей финансировали кампании Филиппа и Александра, но ясно, что их плоды иссякают. Их последние подношения профинансируют уничтожение незаконных преемников."
 macedon_01_legacy_11_allow_tt:0 "[GetProvince('(int32)365').GetName] больше не производит [GetProvince('(int32)365').GetTradeGoods.GetName|Y]"
 macedon_01_legacy_12:0 "Последние из Аргеадов"
 macedon_01_legacy_12_DESC:0 "Поскольку сыновья [GetCharacter('(int32)39').GetPraenomen] больше не представляют угрозы, линия [GetCharacter('(int32)287').GetPraenomen], его сводной сестры, является ближайшей связью с династией Аргеадов и легитимностью, которую дарует их кровь."
 macedon_01_legacy_12_allow_tt:0 "Наш [me_macedon_scope.GetRulerTitle] ([me_macedon_scope.GetRuler.GetName]) имеет черту '#Y $argeads$#!'."
 macedon_01_legacy_13:0 "Иллирийский вопрос"
 macedon_01_legacy_13_DESC:0 "Тавлантии продолжают представлять угрозу на нашей западной границе, строя козни вместе с эпиротами и дарданцами, чтобы отомстить за свои поражения от [GetCharacter('(int32)35').GetPraenomen] и [GetCharacter('(int32)39').GetPraenomen]; их нужно поставить на место."
 macedon_01_legacy_13_allow_tt:0 "@[GetCountry('TLN').GetFlag]! [GetCountry('TLN').GetName|Y] больше не существует или является вассалом @[GetCountry('MAC').GetFlag]! [GetCountry('MAC').GetName|Y]."
 macedon_01_legacy_14:0 "Иллирийский аванпост"
 macedon_01_legacy_14_DESC:0 "После нашего завоевания земель тавлантиев мы должны establish a strong presence в регионе, основав город для защиты наших коммерческих интересов в Адриатике."
 macedon_01_legacy_14_allow_tt:0 "Мы должны владеть провинциями [GetProvince('(int32)422').GetName], [GetProvince('(int32)415').GetName] и [GetProvince('(int32)2336').GetName]."
 macedon_colony_reward_tt:0 "Вы сможете основать колонию на завоеванных землях."
 #Modifiers
 mac_01_11_pmod:0 "$macedon_01_legacy_11$"
 desc_mac_01_11_pmod:0 "Рудники, которые когда-то финансировали наемников и пенсии великой армии Македонии, steadily drying up."
 mac_01_13_cmod:0 "$macedon_01_legacy_13$"
 desc_mac_01_13_cmod:0 "Доказательство нашего доминирования над иллирийцами, которые долго угрожали нашим западным границам, обеспечит поддержку нашему лидерству."
 mac_01_13_culmod:0 "Подчинение тавлантиев"
 desc_mac_01_13_culmod:0 "Гордые иллирийцы презирают поражение и servitude, они сделают всё возможное, чтобы thwart our governance."
 mac_01_13_2_cmod:0 "Иллирийское милосердие"
 desc_mac_01_13_2_cmod:0 "Милосердие часто является недооцененным курсом действий, ибо страх заставляет людей искать peace of mind через кровопролитие."
 mac_01_12_cmod:0 "$macedon_01_legacy_12$"
 desc_mac_01_12_cmod:0 "Нельзя отрицать, что Антипатриды являются наиболее законными наследниками линии Аргеадов, а следовательно, и права нашей династии на правление."
 me_mac_01_9_pmod:0 "$me_ant_02_10_pmod$"
 desc_me_mac_01_9_pmod:0 "Город Антипатрея, названный в честь отца Кассандра [GetCharacter('(int32)9').GetPraenomen], стал известен как одна из «Цепей Греции» вместе с Коринфом и Халкидой, securing Thessaly и путь в Грецию."
 me_mac_1_cmod:0 "Наследие Антипатра"
 desc_me_mac_1_cmod:0 "[GetCharacter('(int32)9').GetPraenomen] всё ещё уважаем нашими remaining subjects, меры [GetCharacter('(int32)32').GetPraenomen] больше не кажутся столь шокирующими."
 mac_01_5_cmod:0 "$macedon_01_legacy_5$"
 desc_mac_01_5_cmod:0 "Мы обезопасили один из самых хорошо защищенных городов Греции, lending our military a buoyed confidence in their abilities and our leadership."
 mac_01_8_cmod:0 "Королевская власть Антипатридов"
 desc_mac_01_8_cmod:0 "Официально приняв титул басилевса как по имени, так и по делу, мы established our claim to royalty."
 mac_01_2_pmod:0 "Подчинение пеонцев"
 desc_mac_01_2_pmod:0 "Пеонцы неохотно принимают наше лидерство, но со временем они увидят преимущества македонского управления."
 mac_01_10_cmod:0 "$macedon_01_legacy_10$"
 desc_mac_01_10_cmod:0 "Наши армии непобедимы, defeating the much vaunted allies of our enemies и объединяя земли северной Греции."
 mac_01_3_umod:0 "Агрианский отряд"
 desc_mac_01_3_umod:0 "Меткие метатели дротиков из агрианов provide this army with a peerless force of skirmishers and hunters."
 #Opinions
 mac_01_2_opmod:0 "Македонское вмешательство"
 mac_01_2_2_opmod:0 "Статус-кво"
 ### Hellenic Mastery
 # Mission
 macedon_02_mastery:0 "Эллинское мастерство"
 macedon_02_mastery_BUTTON_TOOLTIP:0 "Македония должна продолжать расти, если хочет превзойти греческие города, которыми она правит — как в военном, так и в культурном плане, — тем самым обеспечивая лидирующую роль в греческом мире."
 macedon_02_mastery_BUTTON_DETAILS:0 ""
 macedon_02_mastery_DESCRIPTION:0 "Восточные царства диадохов могут править vast and rich lands, но Македония всё ещё является культурным домом нашего народа. Мы обеспечим, чтобы наше правление отмечалось развитием столько же, сколько и экспансией, и чтобы греческий мир смотрел на нас как на истинных наследников аргеадского лидерства и cultivation."
 macedon_02_mastery_CRITERIA_DESCRIPTION:0 "Обеспечить первенство Македонии на западе, развивая её инфраструктуру и расширяя её влияние."
 macedon_02_mastery_REWARD_DESCRIPTION:0 "Утвердить Македонию как культурного и военного гегемона западного греческого мира."
 # Tasks
 macedon_02_mastery_1:0 "Цветущая Македония"
 macedon_02_mastery_1_DESC:0 "Восточные части империи Александра славятся богатством и размером своих древних городов; они являются рогами изобилия знаний и богатства. Македонии не обязательно уступать им в этом."
 macedon_02_mastery_1_allow_tt_1:0 "[GetProvince('(int32)373').GetName] имеет не менее [SCOPE.ScriptValue('me_mac_2_1_1_target_svalue')|0Y] населения. ([SCOPE.Custom('mac_mis_02_1_1_cus_loc')]/[SCOPE.ScriptValue('me_mac_2_1_1_target_svalue')|0Y])"
 macedon_02_mastery_1_allow_tt_2:0 "[GetProvince('(int32)379').GetName] имеет не менее [SCOPE.ScriptValue('me_mac_2_1_1_target_svalue')|0Y] населения. ([SCOPE.Custom('mac_mis_02_1_2_cus_loc')]/[SCOPE.ScriptValue('me_mac_2_1_1_target_svalue')|0Y])"
 macedon_02_mastery_1_allow_tt_3:0 "[GetProvince('(int32)373').GetName] не имеет свободных слотов для зданий или текущего строительства. (В настоящее время [SCOPE.ScriptValue('me_mac_2_1_3_ongoing_svalue')|0R])"
 macedon_02_mastery_1_allow_tt_4:0 "[GetProvince('(int32)379').GetName] не имеет свободных слотов для зданий или текущего строительства. (В настоящее время [SCOPE.ScriptValue('me_mac_2_1_4_ongoing_svalue')|0R])"
 me_mac_2_1_1_complete:0 "[SCOPE.ScriptValue('me_mac_2_1_1_target_svalue')|0Y]"
 me_mac_2_1_1_ongoing:0 "[SCOPE.ScriptValue('me_mac_2_1_1_ongoing_svalue')|0R]"
 me_mac_2_1_2_ongoing:0 "[SCOPE.ScriptValue('me_mac_2_1_2_ongoing_svalue')|0R]"
 macedon_02_mastery_2:0 "Устоявшаяся фрурархия"
 macedon_02_mastery_2_DESC:0 "По мере того как более прямое македонское правление над регионом [GetProvince('(int32)418').GetArea.GetRegion.GetName] становится нормой, наша администрация становится более приемлемой и, следовательно, эффективной."
 macedon_02_mastery_2_allow_tt:0 "@[GetCountry('MAC').GetFlag]! [GetCountry('MAC').GetName|Y] владеет всем материковым регионом [GetProvince('(int32)418').GetArea.GetRegion.GetName|Y], исключая [GetProvince('(int32)476').GetArea.GetName|Y], напрямую или через вассалов."
 macedon_02_mastery_2_reward_tt:0 "Все принадлежащие нам и вассалам #Y $hellenic$#! провинции в материковом регионе [GetProvince('(int32)418').GetArea.GetRegion.GetName|Y], исключая [GetProvince('(int32)476').GetArea.GetName|Y], также получат эффект '#Y $me_mac_2_2_smod$#!'."
 macedon_02_mastery_3:0 "Подчинение Крита"
 macedon_02_mastery_3_DESC:0 "Остров Крит был обойден вниманием диадохов, несмотря на его большое население и стратегическое положение, защищающее Эгейское море."
 macedon_02_mastery_3_reward_tt:0 "Можно создать критского вассала."
 macedon_02_mastery_5:0 "Города Греции"
 macedon_02_mastery_5_DESC:0 "Старые эллинские города все еще славятся своей культурной изысканностью и богатством, поэтому мы должны обеспечить контроль над этими местами, если хотим по-настоящему называть себя правителями Эллады."
 macedon_02_mastery_6:0 "Блестящий двор"
 macedon_02_mastery_6_DESC:0 "С тех пор как [GetCharacter('(int32)35').GetPraenomen] II пригласил Аристотеля обучать юного [GetCharacter('(int32)39').GetPraenomen], диадохи поддерживали традицию привлечения философов и художников, а также ведения войн."
 macedon_02_mastery_6_reward_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] будет периодически получать skilled courtiers."
 macedon_02_mastery_6_reward_tt_1:0 "Прибудет талантливый философ."
 macedon_02_mastery_7:0 "Бог среди людей"
 macedon_02_mastery_7_DESC:0 "Апофеоз стал неотъемлемой частью политической жизни Македонии во всех царствах-преемниках; но мы будем относиться к божественности нашего правителя более серьезно."
 macedon_02_mastery_7_allow_dei:0 "[me_macedon_scope.GetRuler.GetName|Y] не был обожествлен."
 macedon_02_mastery_7_allow_pop:0 "[me_macedon_scope.GetRuler.GetName|Y] имеет не менее @popularity_icon! [SCOPE.ScriptValue('me_mac_2_7_pop_target_svalue')|Y0] популярности. ([SCOPE.Custom('mac_mis_02_7_pop_cus_loc')]/[SCOPE.ScriptValue('me_mac_2_7_pop_target_svalue')|Y0])"
 me_mac_2_7_pop_ongoing:0 "[SCOPE.ScriptValue('me_mac_2_7_pop_ongoing_svalue')|R0]"
 me_mac_2_7_pop_complete:0 "[SCOPE.ScriptValue('me_mac_2_7_pop_ongoing_svalue')|Y0]"
 macedon_02_mastery_7_allow_pre:0 "Семья [me_macedon_scope.GetRuler.GetFamily.GetName|Y] имеет не менее @prestige! [SCOPE.ScriptValue('me_mac_2_7_pre_target_svalue')|Y0] престижа. ([SCOPE.Custom('mac_mis_02_7_pre_cus_loc')]/[SCOPE.ScriptValue('me_mac_2_7_pre_target_svalue')|Y0])"
 me_mac_2_7_pre_ongoing:0 "[SCOPE.ScriptValue('me_mac_2_7_pre_ongoing_svalue')|R0]"
 me_mac_2_7_pre_complete:0 "[SCOPE.ScriptValue('me_mac_2_7_pre_ongoing_svalue')|Y0]"
 macedon_02_mastery_8:0 "Оракульное превосходство"
 macedon_02_mastery_8_DESC:0 "Хотя восточная империя могла принять богов завоеванных народов, [GetProvince('(int32)424').GetName] и [GetProvince('(int32)425').GetName] остаются важнейшими религиозными центрами и местами общения с божественным для нашего народа."
 macedon_02_mastery_8_allow_tt:0 "[GetOffice('office_high_priest_monarchy').GetCulturalName(me_macedon_scope)] @[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] имеет не менее [SCOPE.ScriptValue('me_mac_2_8_target_svalue')|Y0] лояльности @loyalty_icon! ([SCOPE.Custom('mac_mis_02_8_cus_loc')]/[SCOPE.ScriptValue('me_mac_2_8_target_svalue')|Y0])"
 me_mac_2_8_ongoing:0 "[SCOPE.ScriptValue('me_mac_2_8_svalue')|0R]"
 me_mac_2_8_complete:0 "[SCOPE.ScriptValue('me_mac_2_8_svalue')|0Y]"
 macedon_02_mastery_8_reward_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] будет периодически получать оракульные события, пока контролируется [GetProvince('(int32)424').GetName] или [GetProvince('(int32)425').GetName]."
 macedon_02_mastery_9:0 "Четвертая цепь"
 macedon_02_mastery_9_DESC:0 "$antigonid_02_aspiration_12_DESC$"
 macedon_02_mastery_10:0 "Расширить комплекс Диона"
 macedon_02_mastery_10_DESC:0 "Святилище [GetProvince('(int32)380').GetName] всегда было важнейшим религиозным местом для македонян — его следует обновить, чтобы оно могло соперничать с другими религиозными центрами."
 macedon_02_mastery_10_reward_tt:0 "Открывает доступ к #Y Божеству культуры#! '[zeus_olympios_scope.GetName|Y]'."
 macedon_02_mastery_10_reward_tt_1:0 "#Y Спутники Лисиппа#! появляются в казне [me_macedon_scope.GetName|Y]."
 macedon_02_mastery_11:0 "Эллинская столица"
 macedon_02_mastery_11_DESC:0 "Македония является лидером греческого мира, и её слава должна соответствовать этому статусу во всем, не в последнюю очередь в месте пребывания нашего королевства."
 macedon_02_mastery_13:1 "Наше Эгейское море"
 macedon_02_mastery_13_DESC:0 "Эгейское море объединяет разрозненное эллинское население, которое торгует, общается и управляется его водами. Македония будет иметь влияние на его важнейшие якорные стоянки."
 # Modifiers
 me_mac_2_cmod:0 "$macedon_02_mastery$"
 desc_me_mac_2_cmod:0 "Мы стремимся к лидерству среди южных греческих городов и будем вести себя соответственно для достижения этой цели."
 me_mac_2_1_smod:0 "$macedon_02_mastery_1$"
 desc_me_mac_2_1_smod:0 "Македонские города стали важнейшими в греческом мире и соперничают со старыми городскими центрами юга."
 me_mac_2_5_cmod:0 "Эллинский диалог"
 desc_me_mac_2_5_cmod:0 "Хотя южные греческие города были побеждены нашей превосходящей военной силой, они могут многому научить нас в устройстве мира."
 me_mac_2_2_smod:0 "$macedon_02_mastery_2$"
 desc_me_mac_2_2_smod:0 "Македонское правление над греческими городами становится для их жителей все более привычным с каждым днем."
 me_mac_2_6_charmod:0 "Выдающийся мыслитель"
 desc_me_mac_2_6_charmod:0 "Этот персонаж известен своими проницательностью и интеллектом."
 me_mac_2_5_2_cmod:0 "$me_mac_2_5_opmod$"
 desc_me_mac_2_5_2_cmod:0 "Артефакты, свитки и трофеи Греции указывают на glorious past, но укажут нам на еще более великое будущее."
 me_mac_2_5_pmod:0 "$me_mac_2_5_opmod$"
 desc_me_mac_2_5_pmod:0 "Изъятие культурных артефактов возмутило образованные классы этого города."
 me_mac_2_6_cmod:0 "$macedon_02_mastery_6$"
 desc_me_mac_2_6_cmod:0 "Богатая интеллектуальная жизнь, культивируемая при нашем дворе, пользуется большой популярностью у образованной элиты."
 me_mac_2_8_cmod:0 "$macedon_02_mastery_8$"
 desc_me_mac_2_8_cmod:0 "Контроль над оракулами Греции сделал нас религиозным защитником и фигурой в греческом мире."
 me_mac_2_3_pmod:0 "Критская цепь"
 desc_me_mac_2_3_pmod:0 "Порт Ираклион был укреплен для использования в качестве стратегического бастиона македонянами."
 me_mac_2_3_culmod:0 "$macedon_02_mastery_3$"
 desc_me_mac_2_3_culmod:0 "Ни один народ не любит господства иностранцев, но критяне особенно сильно."
 me_mac_2_13_cmod:0 "$macedon_02_mastery_13$"
 desc_me_mac_2_13_cmod:0 "Контроль над портами Эгейского моря приносит прибыль от его торговцев нашим чиновникам, где бы они ни швартовались."
 me_mac_2_11_pmod:0 "$macedon_02_mastery_11$"
 desc_me_mac_2_11_pmod:0 "Истинная эллинская столица, этот оживленный город известен во всем греческом мире своим размером и величием."
 me_mac_2_7_cmod:0 "$macedon_02_mastery_7$"
 desc_me_mac_2_7_cmod:0 "Практика апофеоза была искренне принята правящей семьей и македонским народом."
 me_mac_2_end_cmod:0 "Повелитель Греции"
 desc_me_mac_2_end_cmod:0 "Македонский контроль и культурное доминирование над западным греческим миром были обеспечены нашими царями."
 me_mac_2_8_1_cmod:0 "Божественное послание"
 desc_me_mac_2_8_1_cmod:0 "Боги говорили через своих оракульных посредников, предоставляя руководство нашему народу."
 me_mac_2_8_2_cmod:0 "$me_mac_2_8_1_cmod$"
 desc_me_mac_2_8_2_cmod:0 "$desc_me_mac_2_8_1_cmod$"
 me_mac_2_8_3_cmod:0 "$me_mac_2_8_1_cmod$"
 desc_me_mac_2_8_3_cmod:0 "$desc_me_mac_2_8_1_cmod$"
 me_mac_2_8_4_charmod:0 "$me_mac_2_8_1_cmod$"
 desc_me_mac_2_8_4_charmod:0 "$desc_me_mac_2_8_1_cmod$"
 # Opinions
 me_mac_2_5_opmod:0 "Культурное грабительство"
 me_mac_2_2_opmod:0 "$macedon_02_mastery_2$"
 ### Adriatic Dominion
 # Mission
 macedon_03_adriatic:0 "Адриатическое доминирование"
 macedon_03_adriatic_BUTTON_TOOLTIP:0 "Хаос на востоке, оставленный рушащейся империей Александра, является непривлекательной перспективой; гораздо лучше расширить наши владения ближе к дому и против более слабых врагов."
 macedon_03_adriatic_BUTTON_DETAILS:0 ""
 macedon_03_adriatic_DESCRIPTION:0 "За пределами иллирийских племен и гор старые колонии греков вдоль и по другую сторону Адриатического моря ждут, чтобы быть добавленными к нашему домену, предоставляя пути для торговли и экспансии, которые были упущены из виду во время правления обращенных на восток Аргеадов."
 macedon_03_adriatic_CRITERIA_DESCRIPTION:0 "Расшириться на запад и подчинить нашему правлению побережье Адриатики."
 macedon_03_adriatic_REWARD_DESCRIPTION:0 "Доминировать в торговле Адриатического моря и утвердить македонское присутствие на его берегах."
 # Tasks
 macedon_03_adriatic_1:0 "Адриатический узел"
 macedon_03_adriatic_1_DESC:0 "Наши западные амбиции требуют стабильной базы, с которой мы сможем осуществлять нашу власть, не огибая весь греческий полуостров."
 macedon_03_adriatic_1_allow_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] владеет портом уровня города с населением не менее [SCOPE.ScriptValue('me_mac_3_1_target_svalue')|Y0] в провинции [GetProvince('(int32)422').GetArea.GetName]. [SCOPE.Custom('mac_mis_03_1_vis_cus_loc')]"
 macedon_03_adriatic_1_reward_tt:0 "Выбранный порт получит бонус к миграции, торговле и кораблестроению.\nМежду выбранным портом и [GetProvince('(int32)379').GetName] будет построена дорога."
 me_mac_3_1_ongoing:0 "[SCOPE.ScriptValue('me_mac_3_1_ongoing_svalue')|R0]"
 me_mac_3_1_complete:0 "[SCOPE.ScriptValue('me_mac_3_1_ongoing_svalue')|Y0]"
 me_mac_3_1_tooltip_vis:0 "([SCOPE.Custom('mac_mis_03_1_cus_loc')]/[SCOPE.ScriptValue('me_mac_3_1_target_svalue')|Y0])"
 me_mac_3_1_tooltip_invis:0 ""
 macedon_03_adriatic_2:0 "Северные гавани"
 macedon_03_adriatic_2_DESC:0 "Прибрежные племена Иллирии терроризируют торговые пути Адриатики из своих укрытых портов вдоль далматинского побережья — аванпосты, которые будут бесценны для контроля над этим районом."
 macedon_03_adriatic_2_allow_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] владеет не менее [SCOPE.ScriptValue('me_mac_3_2_target_svalue')|Y0] портами в регионе [GetProvince('(int32)4085').GetArea.GetRegion.GetName]. ([SCOPE.Custom('mac_mis_03_2_cus_loc')]/[SCOPE.ScriptValue('me_mac_3_2_target_svalue')|Y0])"
 macedon_03_adriatic_2_reward_tt:0 "Все принадлежащие нам провинции с портами в регионе [GetProvince('(int32)422').GetArea.GetRegion.GetName], за исключением провинции [GetProvince('(int32)422').GetArea.GetName], получат бонус к стоимости торговли, торговым путям и производству рабов."
 macedon_03_adriatic_2_reward_tt1:0 "Часть населения культуры [me_macedon_scope.GetPrimaryCulture.GetName] мигрирует в наши иллирийские порты."
 me_mac_3_2_ongoing:0 "[SCOPE.ScriptValue('me_mac_3_2_ongoing_svalue')|R0]"
 me_mac_3_2_complete:0 "[SCOPE.ScriptValue('me_mac_3_2_ongoing_svalue')|Y0]"
 macedon_03_adriatic_3:0 "Торговые патрули"
 macedon_03_adriatic_3_DESC:0 "Пираты региона [GetProvince('(int32)4054').GetArea.GetName] и [GetProvince('(int32)4084').GetArea.GetRegion.GetName] являются nuisance, которое необходимо искоренить, если мы хотим гарантировать верховенство закона и плоды торговли в регионе."
 macedon_03_adriatic_3_allow_tt:0 "Нет территорий с модификатором '#Y $pirate_haven_modifier$#!' на Адриатическом море. [SCOPE.Custom('mac_mis_03_3_cus_loc')]"
 me_mac_3_3_ongoing:0 "(В настоящее время [SCOPE.ScriptValue('me_mac_3_3_svalue')|R0])"
 me_mac_3_3_complete:0 ""
 macedon_03_adriatic_4:0 "Варварские корсары"
 macedon_03_adriatic_4_DESC:0 "Моряки региона [GetProvince('(int32)4054').GetArea.GetName] по праву feared за их мастерство в прибрежных и торговых рейдах; мы должны foster their expertise, наняв их напрямую."
 macedon_03_adriatic_4_allow_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] владеет не менее [SCOPE.ScriptValue('me_mac_3_4_target_svalue')|Y0] территориями с модификатором '#Y $pirate_haven_modifier$#!' на Адриатическом море. ([SCOPE.Custom('mac_mis_03_4_cus_loc')]/[SCOPE.ScriptValue('me_mac_3_4_target_svalue')|Y0])"
 macedon_03_adriatic_4_reward_tt:0 "Адмирал культуры #Y $liburnian_culture$#! присоединится к нашему двору."
 me_mac_3_4_ongoing:0 "[SCOPE.ScriptValue('me_mac_3_4_ongoing_svalue')|R0]"
 me_mac_3_4_complete:0 "[SCOPE.ScriptValue('me_mac_3_4_ongoing_svalue')|Y0]"
 macedon_03_adriatic_5:0 "Западный плацдарм"
 macedon_03_adriatic_5_DESC:0 "Пусть другие диадохи довольствуются востоком; на западе есть expanses of bounteous wealth, ripe for the plunder, если мы сможем пересечь море."
 macedon_03_adriatic_5_reward_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] получает претензии на все прибрежные территории в регионе [GetProvince('(int32)4084').GetArea.GetRegion.GetName]."
 macedon_03_adriatic_6:0 "Италийский аванпост"
 macedon_03_adriatic_6_DESC:0 "Напротив племен иллирийского littoral лежит Италийский полуостров, населенный воинственными аборигенами и греческими колонистами — все они одинаково готовы к подчинению."
 macedon_03_adriatic_6_allow_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] владеет не менее [SCOPE.ScriptValue('me_mac_3_6_target_svalue')|Y0] портами в провинции [GetProvince('(int32)57').GetArea.GetName]. ([SCOPE.Custom('mac_mis_03_6_cus_loc')]/[SCOPE.ScriptValue('me_mac_3_6_target_svalue')|Y0])"
 macedon_03_adriatic_6_reward_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] получает претензии на восточные побережья регионов [GetProvince('(int32)108').GetArea.GetRegion.GetName] и материковой части [GetProvince('(int32)55').GetArea.GetRegion.GetName]."
 macedon_03_adriatic_6_reward_tt1:0 "Выбранный порт станет нашей провинциальной столицей в [GetProvince('(int32)57').GetArea.GetName] и городом, если еще не является таковым, а также получит крепость и бонус к местной обороне, торговым путям и привлекательности для миграции."
 me_mac_3_6_ongoing:0 "[SCOPE.ScriptValue('me_mac_3_6_ongoing_svalue')|R0]"
 me_mac_3_6_complete:0 "[SCOPE.ScriptValue('me_mac_3_6_ongoing_svalue')|Y0]"
 macedon_03_adriatic_7:0 "Иллирийский гегемон"
 macedon_03_adriatic_7_DESC:0 "Создав западную империю вокруг Адриатики, мы могли бы извлекать богатства Иллирии, не поднимаясь в варварские горы, открывая путь в Италию."
 macedon_03_adriatic_7_allow_tt:0 "Все побережье региона [GetProvince('(int32)4084').GetArea.GetRegion.GetName] принадлежит @[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] или их вассалам."
 macedon_03_adriatic_7_allow_tt1:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] владеет портовым городом с населением не менее #Y 20#! и доминирующей культурой [me_macedon_scope.GetPrimaryCulture.GetName] в регионе [GetProvince('(int32)4084').GetArea.GetRegion.GetName]."
 macedon_03_adriatic_7_reward_tt:1 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] получает претензии на регион [GetProvince('(int32)4084').GetArea.GetRegion.GetName]."
 macedon_03_adriatic_9:0 "Иллирийские клиенты"
 macedon_03_adriatic_9_DESC:0 "Использование враждебности местных племен может ускорить наше завоевание региона и избавить нас от хлопот по управлению его более rugged localities."
 macedon_03_adriatic_9_allow_tt:0 "Свободное племя культуры #Y $illyrian_group$#! существует на побережьях Адриатического или Ионического морей или граничит с @[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y]."
 macedon_03_adriatic_9_reward_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] может приобрести племенного вассала #Y $illyrian_group$#! в регионах [GetProvince('(int32)4084').GetArea.GetRegion.GetName], [GetProvince('(int32)65').GetArea.GetRegion.GetName] или [GetProvince('(int32)108').GetArea.GetRegion.GetName]."
 macedon_03_adriatic_10:0 "Гражданская дипломатия"
 macedon_03_adriatic_10_DESC:0 "Греки отправились на запад столетия назад, основав колонии и торговые посты near and far across the internal sea. Некоторые из их потомков остались и могут принять нашу защиту."
 macedon_03_adriatic_10_allow_tt:0 "Свободная республика культуры #Y $hellenic$#! существует на побережьях Адриатического или Ионического морей."
 macedon_03_adriatic_10_allow_tt1:0 "[GetOffice('office_foreign_minister').GetCulturalName(me_macedon_scope)] @[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] имеет не менее [SCOPE.ScriptValue('me_mac_2_8_target_svalue')|Y0] лояльности @loyalty_icon! ([SCOPE.Custom('mac_mis_03_10_cus_loc')]/[SCOPE.ScriptValue('me_mac_2_8_target_svalue')|Y0])"
 macedon_03_adriatic_10_allow_tt2:0 "[GetOffice('office_foreign_minister').GetCulturalName(me_macedon_scope)] @[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] имеет не менее [SCOPE.ScriptValue('me_mac_3_10_1_target_svalue')|Y0] харизмы @oratory_icon! ([SCOPE.Custom('mac_mis_03_10_1_cus_loc')]/[SCOPE.ScriptValue('me_mac_3_10_1_target_svalue')|Y0])"
 macedon_03_adriatic_10_reward_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] может приобрести вассала-феодатора #Y $hellenic$#! в регионах [GetProvince('(int32)4084').GetArea.GetRegion.GetName], [GetProvince('(int32)65').GetArea.GetRegion.GetName] или [GetProvince('(int32)108').GetArea.GetRegion.GetName]."
 me_mac_3_10_ongoing:0 "[SCOPE.ScriptValue('me_mac_3_10_svalue')|0R]"
 me_mac_3_10_complete:0 "[SCOPE.ScriptValue('me_mac_3_10_svalue')|0Y]"
 me_mac_3_10_1_ongoing:0 "[SCOPE.ScriptValue('me_mac_3_10_1_ongoing_svalue')|0R]"
 me_mac_3_10_1_complete:0 "[SCOPE.ScriptValue('me_mac_3_10_1_ongoing_svalue')|0Y]"
 macedon_03_adriatic_11:0 "Италийское побережье"
 macedon_03_adriatic_11_DESC:0 "Если мы заявим права на все италийское побережье, наша позиция в регионе будет обеспечена на поколения — foundations of a new sphere of Macedonian trade and colonization."
 macedon_03_adriatic_11_allow_tt:0 "Все адриатическое побережье регионов [GetProvince('(int32)1').GetArea.GetRegion.GetName] и [GetProvince('(int32)6').GetArea.GetRegion.GetName] принадлежит @[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] или их вассалам."
 macedon_03_adriatic_11_reward_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] получает претензии на регионы [GetProvince('(int32)117').GetArea.GetRegion.GetName], [GetProvince('(int32)38').GetArea.GetRegion.GetName] и [GetProvince('(int32)3598').GetArea.GetRegion.GetName]."
 macedon_03_adriatic_13:0 "Региональное превосходство"
 macedon_03_adriatic_13_DESC:0 "Чтобы обеспечить наш контроль над торговыми путями Адриатики, мы должны убедиться, что никто не сможет бросить вызов нашему локальному военно-морскому преимуществу."
 macedon_03_adriatic_13_allow_tt:0 "@[me_macedon_scope.GetFlag]! [me_macedon_scope.GetName|Y] имеет как минимум вдвое больше кораблей, чем любая другая страна, владеющая адриатическим портом. [SCOPE.Custom('mac_mis_03_13_cus_loc')]"
 macedon_03_adriatic_13_allow_tt1:0 "Любая другая не союзная и не вассальная страна на адриатическом побережье имеет не менее #Y 20#! кораблей."
