 # Modifiers
 me_mac_3_cmod:0 "$macedon_03_adriatic$"
 desc_me_mac_3_cmod:0 "Планы удара на запад дали армиям Македонии новую цель против старых врагов."
 me_mac_3_end_cmod:0 "Западная экспансия"
 desc_me_mac_3_end_cmod:0 "Наши завоевания на западе доказали достойность нашей правящей династии и создали источник новых рекрутов для нашей армии."
 me_mac_3_1_pmod:0 "$macedon_03_adriatic_1$"
 desc_me_mac_3_1_pmod:0 "Этот город является центром региональной экспансии Македонии, связанный со старым македонским сердцем."
 me_mac_3_5_cmod:0 "$macedon_03_adriatic_5$"
 desc_me_mac_3_5_cmod:0 "Наша экспансия на запад доказала, что наши армии могут справиться с любой угрозой."
 me_mac_3_13_cmod:0 "$macedon_03_adriatic_13$"
 desc_me_mac_3_13_cmod:0 "Наше явное доминирование над водами Адриатики instilled naval confidence and professionalism among our fleets."
 me_mac_3_2_smod:0 "$macedon_03_adriatic_2$"
 desc_me_mac_3_2_smod:0 "Заселение newly acquired Illyrian ports было поощрено в надежде spark development."
 me_mac_3_4_cmod:0 "$macedon_03_adriatic_4$"
 desc_me_mac_3_4_cmod:0 "Хотя пираты могут быть nuisance, их навыки могут быть put to good use за правильную цену."
 me_mac_3_3_cmod:0 "$macedon_03_adriatic_3$"
 desc_me_mac_3_3_cmod:0 "Очистка Адриатического моря от пиратов benefited merchant classes of Macedon и, следовательно, наши доходы через них."
 me_mac_3_6_pmod:0 "$macedon_03_adriatic_6$"
 desc_me_mac_3_6_pmod:0 "Этот город был превращен в local stronghold как региональную столицу Македонии на Италийском полуострове."
 me_mac_3_11_cmod:0 "$macedon_03_adriatic_11$"
 desc_me_mac_3_11_cmod:0 "Контроль над Адриатическим морем opens the way for free flowing commerce и обеспечивает constant source of experienced sailors."
# Opinions
 me_mac_3_10_rejected_opmod:0 "Отклонённое предложение"
 ### Lighthouse of Greece
 # Mission
 macedon_04_lighthouse:0 "Маяк Греции"
 macedon_04_lighthouse_BUTTON_TOOLTIP:0 "Несмотря на падение империи Александра, Македония всё ещё контролирует важную часть Северной Греции; мы должны укрепить и развить наши города и показать путь к процветанию."
 macedon_04_lighthouse_BUTTON_DETAILS:0 ""
 macedon_04_lighthouse_DESCRIPTION:0 "Владения Кассандра включают старую македонскую столицу и важные города. Мы должны работать над развитием нашей страны, чтобы вернуть ей былое величие, и тогда мы сможем сравняться с великими державами мира."
 macedon_04_lighthouse_CRITERIA_DESCRIPTION:0 "Миссия будет выполнена, когда сердце Македонии превратится в крупный экономический центр."
 # Tasks
 macedon_04_lighthouse_1:0 "Развить Фессалоники"
 macedon_04_lighthouse_1_DESC:0 "Город, который Кассандр построил для своей жены Фессалоники, является одним из важнейших в Македонии — мы должны спланировать его расширение и превратить в динамичный и процветающий центр населения."
 macedon_04_lighthouse_2:0 "Основать Аиани"
 macedon_04_lighthouse_2_DESC:0 "Недавно приобретённая провинция Пелагония всё ещё является сельской местностью; здесь нет ни одного важного города или торгового пути. Нам нужно приложить усилия для урбанизации и развития этого региона, так как он может служить связующим звеном между [GetProvince('(int32)379').GetName] и нашими западными владениями."
 macedon_04_lighthouse_3:0 "Город Филиппа"
 macedon_04_lighthouse_3_DESC:0 "Город [GetProvince('(int32)364').GetName] был основан как горнодобывающая колония Филиппом II Македонским, и за прошедшие годы он вырос из поселения в региональный город определённой важности. Мы должны обратить на него внимание и улучшить то, что можем, чтобы сделать это место центром эллинского мира."
 macedon_04_lighthouse_4:0 "Восточные горы"
 macedon_04_lighthouse_4_DESC:0 "На дальнем западе страны лежат неприступные и гористые земли, которые затрудняют связь между нашей столицей и Иллирией. Эту проблему необходимо решить; мы основали город и начнём работы по улучшению связей с адриатической стороной Македонии."
 macedon_pelagonia_road_tt:0 "Мы построим дорогу между [GetProvince('(int32)412').GetName] и [GetProvince('(int32)379').GetName]"
 macedon_04_lighthouse_4_allow_tt:0 "Вы должны владеть всеми горными провинциями области [GetProvince('(int32)393').GetArea.GetName]"
 macedon_04_lighthouse_5:0 "Гордость Кассандра"
 macedon_04_lighthouse_5_DESC:0 "Город [GetProvince('(int32)376').GetName] был основан совсем недавно Кассандром. Первоначально он, возможно, должен был стать новой столицей Македонии, но эта грандиозная идея была оставлена, и вместо этого он был превращён в главную военно-морскую базу македонского флота."
 macedon_04_lighthouse_6:0 "Афинская колония"
 macedon_04_lighthouse_6_DESC:0 "Амфиполь когда-то был афинской колонией, служившей важной военно-морской базой; сегодня это великий город в нашем государстве, известный своей местной культурой. Наши архитекторы предложили расширить его и уже составили планы по преобразованию центра города и порта, как только мы утвердим их проекты."
 macedon_amphipolis_road_tt:0 "Мы построим дорогу между [GetProvince('(int32)365').GetName] и [GetProvince('(int32)379').GetName]"
 macedon_04_lighthouse_7:0 "Консолидировать македонскую торговлю"
 macedon_04_lighthouse_7_DESC:0 "Македония уже имеет хорошие торговые отношения с эллинским миром, но мы можем улучшить некоторые налоги и законы, чтобы сделать коммерческие выгоды более эффективными и собирать больше денег."
 macedon_04_lighthouse_8:0 "Сельскохозяйственные улучшения"
 macedon_04_lighthouse_8_DESC:0 "Нашу способность строить великие города невозможно превзойти, но по мере того как наше население растёт быстрее, нам нужно обеспечивать его продовольствием — мы слишком зависим от египетского зерна, мы должны быть способны прокормить себя сами, необходимы некоторые инвестиции."
 macedonia_produce_food_tt:0 "Все территории, принадлежащие [me_macedon_scope.GetName], производящие #Y Продовольственные товары#!, должны иметь здание #Y Сельскохозяйственное поселение#!"
 mac_settle_farms_tt:0 "Мы начнём создавать новые фермы near столицы, и если в [GetProvince('(int32)379').GetName] есть свободный слот для здания, мы построим #Y Амбар#!"
 macedon_04_lighthouse_9:0 "Восстановить Фессалийский союз"
 macedon_04_lighthouse_9_DESC:0 "Фессалийский союз когда-то был конфедерацией фессалийских племён и городов-государств и в некоторые моменты истории становился мощным — мы могли бы использовать его снова, чтобы завоевать лояльность фессалийского народа и восстановить некоторые из их институтов, предоставив им небольшую автономию, но это увеличит их сотрудничество с нами."
 macedon_thessalian_league_tt:0 "Вы получите цепочку событий для получения некоторых модификаторов"
 macedon_04_lighthouse_10:0 "Расширить Фарсал"
 macedon_04_lighthouse_10_DESC:0 "Фарсал лежит на Фессалийской равнине как великий город, на перекрёстке путей между южногреческими государствами и Македонией — его полезность и лояльность были доказаны неоднократно, нам следует подумать о восстановлении города в процветающий и мощный экономический центр, перекрёсток между Северной и Южной Грецией."
 macedon_04_lighthouse_11:0 "Пригороды Пеллы"
 macedon_04_lighthouse_11_DESC:0 "По мере того как население нашей столицы [GetProvince('(int32)379').GetName] растёт всё быстрее, мы начинаем видеть вредные последствия, такие как перенаселение, — чтобы облегчить нагрузку на столицу, мы должны расшириться и построить новые пригороды."
 mac_04_task_11_tt:0 "Территории [GetProvince('(int32)6399').GetName], [GetProvince('(int32)380').GetName] и [GetProvince('(int32)382').GetName] должны:\n- Принадлежать вам.\n- Быть городами.\n- Иметь здание #Y Форум#! и #Y Тренировочный лагерь#!.\n- Использовать 5 слотов для зданий."
 macedon_04_lighthouse_12:0 "Македонская администрация"
 macedon_04_lighthouse_12_DESC:0 "Македонская административная система является одной из самых успешных в мире, но она демонстрирует свои недостатки — мы должны начать масштабную административную реформу, чтобы сохранить её эффективность и обеспечить большой контроль над нашими территориями."
 macedon_04_lighthouse_13:0 "Королевская метрополия"
 macedon_04_lighthouse_13_DESC:0 "Старая македонская столица [GetProvince('(int32)379').GetName] утратила большую часть своего великолепия со времён раздела империи Александра, став лишь тенью самой себя — мы должны подтвердить нашу волю вернуть Македонии её силу, нам нужно вернуть это и нашей столице, начнутся великие работы, чтобы вновь утвердить Пеллу как маяк эллинского мира."
 macedon_04_lighthouse_14:0 "Развить рудники"
 macedon_04_lighthouse_14_DESC:0 "Македония обладает богатыми залежами металлов, обеспечивая хорошее снабжение армии и гражданского сектора — мы должны попытаться найти новые месторождения, а также инвестировать в технологии металлообработки, что даст нам несколько преимуществ перед нашими врагами, а также технологические достижения."
 mac_metals_prospection_tt:0 "Мы начнём кампанию по разведке в областях [GetProvince('(int32)365').GetArea.GetName] и [GetProvince('(int32)393').GetArea.GetName]"
 # Scripted Value
