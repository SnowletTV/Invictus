dove_of_flowing_waters: "Голубь Владычицы текучих вод"
dove_of_flowing_waters_desc: "Этот кулон в виде голубя символизирует птичью форму одной из дочерей Владычицы текучих вод, чей мраморно-белый дом покоится на дне Меотиды."

statue_of_flowing_waters: "Статуя Владычицы текучих вод"
statue_of_flowing_waters_desc: "Эта статуя служит напоминанием жителям побережья об их божественной Владычице, ожидающей в своем бледном доме на дне моря."

red_white_apple: "Красно-белое яблоко Золотого дерева"
red_white_apple_desc: "Сохраненное с Золотого дерева нартов, наполовину красное, наполовину белое яблоко олицетворяет как силу, так и искушение божественного."

