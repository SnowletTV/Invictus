l_russian:

zygia_missions: "Эпоха Высших"
zygia_missions_DESCRIPTION: "Долгое время считавшиеся незначительной группой племен, совершающие набеги и занимающиеся пиратством зигии предвещают великое будущее завоеваний, экспансии и объединения со своими меотийскими сородичами, чтобы сформировать великую nation tribal folk в горах Северного Кавказа. Предки адыгов, черкесы, они предпримут необходимые шаги, чтобы превратить свою горную глушь в надежный маяк надежды для племен севера."
zygia_missions_CRITERIA_DESCRIPTION: "Миссия будет выполнена, когда зигии сформируют великую державу племен или станут покровителями культа нартов — великих героев мифов и легенд."
zygia_missions_BUTTON_TOOLTIP: "Вниз с гор!"
zygia_missions_BUTTON_DETAILS: ""

 #Missions

zygia_missions_task_1: "Понтийское пиратство"
zygia_missions_task_1_DESC: "Наиболее известные своей пиратской тактикой, зигии обретут горы богатства лишь грабя близлежащие порты и создавая безопасные убежища для судов без опознавательных знаков."

zygia_missions_task_2: "Отношения с гениохами"
zygia_missions_task_2_DESC: "Племя, равное по традициям и свирепости, будущие связи гениохов с зигиями должны быть определены дипломатическим путем до того, как война примет реальные очертания."
zygia_missions_task_2_tt: "Переговоры с #Y гениохами#! определят наши будущие отношения с ними."

zygia_missions_task_3: "Зигийские аванпосты"
zygia_missions_task_3_DESC: "Имея за рубежом пиратские убежища, поддерживающие корабли зигиев, морские разбойники смогут более прочно закрепиться в малых портах."

zygia_missions_task_4: "Торговля в Никописе"
zygia_missions_task_4_DESC: "Порт Торикос, известный другим под иным именем, должен стать процветающим торговым узлом, чтобы стимулировать экономический рост и экспансию зигиев."

zygia_missions_task_5: "Регион Зикс"
zygia_missions_task_5_DESC: "Известная старейшинам племен как ядро региона древних зигийских народов, Зикс представляет собой забытую родину, которую необходимо вернуть."
zygia_missions_task_5_tt: " #Y Зигия#! должна #E владеть#! всеми #T выделенными#! территориями, составляющими регион #T Зикс#!, или иметь #E субъекта, владеющего#! ими."

zygia_missions_task_6: "Хабзизм"
zygia_missions_task_6_DESC: "Честь. Сострадание. Безвозмездная помощь. Эти три культурные ценности вызывают уважение наших старейшин и определяют роли в зигийском обществе. Чтобы сохранить традиции, эти ценности хабзизма должны быть освящены поклонением Тешхуэ."
#zygia_missions_task_6_tt: "____."

zygia_missions_task_7: "Набег на Гипанис"
zygia_missions_task_7_DESC: "Расположенный на восточной стороне Киммерийского Боспора город Фанагория кажется ripe for plunder and enslavement. Проследите за тем, чтобы наш «пиратский» флот не был замечен входящим в его воды, пока не станет слишком поздно."
zygia_missions_task_7_tt1: " #Y Зигия#! должна иметь #E флот#! численностью не менее #Y 15 либурн#! и #T командира#!."
zygia_missions_task_7_tt2: " #Y Зигия#! включила режим #Y Повышенной оплаты#! для #T Содержания флота#!."

zygia_missions_task_8: "Выносливые горные кони"
zygia_missions_task_8_DESC: "Среди многих племен гор от Зигии до Албании лошади северо-запада являются выносливыми тягловыми животными и самыми крепкими боевыми конями, о которых можно только мечтать. Обучите отряд таких коней, и силы зигиев станут непобедимыми."

zygia_missions_task_9: "Восточная Меотида"
zygia_missions_task_9_DESC: "Болота Меотиды, хотя и мистические, и топкие, являются домом для многих божественных существ, а также предоставляют торговые возможности. Пусть зигии захватят их себе и prosper."

zygia_missions_task_10: "Зигийская федерация"
zygia_missions_task_10_DESC: "С притоком новых племен и кланов управление землями зигиев стало сложным делом при нынешней слабой и простой структуре политической иерархии. Чтобы обеспечить стабильность, мы должны пригласить многих вождей кланов и взаимодействовать с ними для создания большей федерации племен."

zygia_missions_task_11: "Поклонение нартam"
zygia_missions_task_11_DESC: "Нарты, герои старины, служат нашим ориентиром для лучших мужчин и женщин во времена, когда по земле бродили божества. Чтобы придать смелости нашим воинам и нашему народу, мы должны лелеять истории и воспоминания о нартах."
zygia_missions_task_11_tt:0 "Государственный пантеон должен содержать #Y 4#! божества нартической религии, чьи Священные места находятся под нашим контролем."

zygia_missions_task_12: "Владычица текучих вод"
zygia_missions_task_12_DESC: "Легенды о героях нартов Пия и Пизигаше повествуют о времени, когда братья отправились к побережью Меотиды и там нашли проход под волнами в бледный дом Владычицы текучих вод. Подобно героям старины, зигии должны совершить такое путешествие или, по крайней мере, предоставить верующим такую возможность."
zygia_missions_task_12_tt: "#E Священное место Владычицы текучих вод#! находится в #Y Патаруэ#!."

zygia_missions_task_13: "Зихия"
zygia_missions_task_13_DESC: "Чтобы выжить не как марионетка, а как независимый народ, зигии должны создать прочное царство, которое запечатлеет их историю и традиции в историях, рассказываемых из поколения в поколение. Тихие голоса говорят о большей «Зихии», мифической границе, окутывающей родные земли наших племен. Это должно стать realm нашего народа."

zygia_missions_task_14: "Царство нартов"
zygia_missions_task_14_DESC: "Чтобы проецировать образ силы и объединить идентичность народа, легенды о наших предках-нартах должны стать основой для правовой системы и традиций. Таким образом, зигии создадут царство, управляемое ."
#zygia_missions_task_14_tt: "____."

zygia_missions_task_15: "Золотое дерево"
zygia_missions_task_15_DESC: "Легенды гласят о золотом дереве, которое охраняли нарты; его яблоки, наполовину белые, наполовину красные, производили фантастических детей, мужчин нартовского рода. Слухи говорят о таком дереве в горах — зигии должны взять на себя защиту этого дерева, чтобы рожать более сильных детей и претендовать на наследие героев."
zygia_missions_task_15_tt: "#E Священное место Дише Жига#! находится в #Y Скарине#!."
 
 
 #Tooltips
 
 
 
 #Modifiers

zygian_ambitions: "Зигийские амбиции"
desc_zygian_ambitions: "Зигии отказываются оставаться запертыми в своей узкой полоске прибрежной горной долины!"

zygian_piracy: "Зигийское пиратство"
desc_zygian_piracy: "Зигийские пираты создали роскошную торговую сеть в Понте Эвксинском."

zygian_pirates: "Зигийские пираты"
desc_zygian_pirates: "Наш порт кишит зигийскими пиратами"

zygian_pirate_haven_modifier: "Убежище зигийских пиратов"
desc_zygian_pirate_haven_modifier: "Зигийские пираты возвращаются сюда, чтобы пополнить запасы и закупить товары перед тем, как отправиться грабить Понт Эвксинский."

nikposis_merchants: "Торговцы Никописа"
desc_nikposis_merchants: "С ростом торговой экономики купцы начали прибывать в зигийский торговый узел."

zygian_mountain_horses: "Зигийские горные кони"
desc_zygian_mountain_horses: "Выносливые лошади зигиев выращиваются с любовью и традиционными методами."

zygian_cavalry: "Зигийская кавалерия"
desc_zygian_cavalry: "Выносливые лошади зигиев, хотя и великолепны на полях, также доказывают свою надежность как боевые кони."

building_east_maeotis: "Развитие Восточной Меотиды"
desc_building_east_maeotis: "Навязанный мир на землях восточнее Меотиды привел к буму численности населения и производства."

lady_of_the_lake: "Владычица озера"
desc_lady_of_the_lake: "Легенды о владычице озера привлекают многих людей к побережью и укрепляют их веру."

lake_legends: "Озерные легенды"
desc_lake_legends: "Легенды о текучей владычице Меотиды привели к большей вере в нартов и духов."

zygian_confederacy: "Зигийская конфедерация"
desc_zygian_confederacy: "Конфедерация зигиев и других кавказских племен сделала регион приветливым для новых народов."

rule_of_narts: "Власть нартов"
desc_rule_of_narts: "Совет нартов теперь почитается во всем его величии."

khabzism_instated: "Установленный закон хабзизма"
desc_khabzism_instated: "Народ Зигии централизовал свою веру вокруг монистического поклонения Закону Тха."

nart_worship: "Поклонение нартam"
desc_nart_worship: "Зигии решили посвятить свои молитвы и веру героям-нартам древней памяти."

golden_nart_tree: "Золотое дерево нартов"
desc_golden_nart_tree: "Дише Жиг, золотое дерево нартов, дарует здоровье и новых детей потомкам древних героев."

maeotic_marsh_grain: "Меотийские заболоченные зерновые земли"
desc_maeotic_marsh_grain: "Часть меотийских болот была расчищена, чтобы открыть обширные естественные зернохранилища."

zygian_port_raiding_technique: "Техника набегов зигиев на порты"
desc_zygian_port_raiding_technique: "Набег на Фанагорию многому научил зигиев тому, как успешно проникать в защищенную гавань и преодолевать её оборонительные стены."

phanagoria_raided: "Фанагория разграблена"
desc_phanagoria_raided: "Зигийские пираты разграбили город Фанагорию!"

zygii_stolen_lands: "Земли, украденные зигиями"
desc_zygii_stolen_lands: "Зигийские рейдеры захватили надлежащие прибрежные колхидские земли."

phanagoria_jewish_quarter: "Еврейский квартал Фанагории"
desc_phanagoria_jewish_quarter: "Приток еврейских граждан, мигрирующих в Фанагорию, оживил торговлю города."

zygian_outpost: "Зигийские аванпосты"
desc_zygian_outpost: "Зигии захватили эти земли и сделали их центром торговли."

zygian_frontier: "Приграничные порты зигиев"
desc_zygian_frontier: "Среди суровых приграничных земель порты зигиев хорошо защищены."

zygian_hero_fame: "Слава зигийского героя"
desc_zygian_hero_fame: "Герой из Патаруэ своим рассказом о приключениях сделал город главной темой разговоров в стране."

aggressive_zygian_pasture: "Агрессивная реакция на зигийских пастбищах"
desc_aggressive_zygian_pasture: "Зигии совершили набег на наши приграничные пастбища."

zygian_pasture_negotiation: "Переговоры о зигийских пастбищах"
desc_zygian_pasture_negotiation: "Зигии были готовы должным образом пересмотреть границы наших пастбищных угодий на границе."

 
 #Events

me_zygia_1_title: "Пиратское государство"
me_zygia_1_desc: "Успех набегов на чужие порты превзошел все ожидания. По сути, множество пиратских кораблей создали обширные сети вдоль побережья моря. Двигаясь дальше, моряки, участвовавшие в пиратстве, высказали мнение, что зигиям следует сосредоточиться либо на строительстве большего флота пиратских кораблей, либо на создании убежищ для пиратства по всему морю, чтобы можно было организовать черный рынок. Что мы предпримем?"
me_zygia_1.a: "Пиратский рынок будет процветать."
me_zygia_1.b: "Построить зигийский флот!"
#me_zygia_1_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_1$#!' $mission_completed_tooltip_2$"

me_zygia_2_title: "Споры о пастбищах"
me_zygia_2_desc: "Гонцы сообщили нам, что несколько пастухов из племен гениохов в последнее время перегоняют своих животных на наши земли. Наши соплеменники жалуются, что это равносильно краже. Должны ли мы что-то предпринять в отношении этого нарушения общественного договора?"
me_zygia_2.a: "Преподадим им вечный урок о недопустимости посягательства на наши земли."
me_zygia_2.b: "Мы можем заключить сделку о совместном использовании земли."
me_zygia_2.c: "Эти неприятности пройдут со временем."

me_zygia_3_title: "Война с гениохами"
me_zygia_3_desc: "Разгневанные нашей прежней агрессией, гениохи собрали воинские отряды у нашей границы. Если мы не попытаемся снизить напряженность и не продемонстрируем свою добрую волю, война окажется всего лишь за горизонтом. Какой курс действий мы изберем?"
me_zygia_3.a: "Их нечего бояться."
me_zygia_3.b: "Отправить щедрое мирное подношение."

me_zygia_4_title: "Партнерство с гениохами"
me_zygia_4_desc: "В развитие наших предыдущих знаков доброй воли к переговорам, племена гениохов хотели бы установить более тесную связь. Их вождь прислал нам небольшой подарок — трудолюбивого воина, который, по их мнению, мог бы хорошо нам советовать. Следует ли нам оформить настоящий союз с этими людьми?"
me_zygia_4.a: "Братья по оружию!"
me_zygia_4.b: "Мы будем держать дистанцию."

me_zygia_5_title: "Интеграция гениохов"
me_zygia_5_desc: "Спустя некоторое время многие отряды гениохов признали мощь и превосходство наших воинов и экономики. Их старейшины пришли к выводу, что более тесное присоединение к нам будет в их наилучших интересах — как ради их безопасности, так и для сохранения их традиций в среде соплеменников. Дадим ли им этот последний толчок, чтобы они вступили в наши ряды?"
me_zygia_5.a: "Приветствуем наших братьев и сестер-гениохов."
me_zygia_5.b: "Наш зигийский род должен оставаться чистым."

me_zygia_6_title: "Статус-кво с гениохами"
me_zygia_6_desc: "Хотя были и взлеты, и падения, особенно в приграничных районах между нами и гениохами, ничего кардинального не произошло. По крайней мере, сейчас они довольны жизнью в своих горных деревнях, а мы — в своих. Однако волны неспокойны, и времена вокруг нас быстро меняются. В будущем эта проблема может вновь всплыть на поверхность."
me_zygia_6.a: "Пусть времена будут мирными для грядущих поколений."

me_zygia_7_title: "Ответ колхов"
me_zygia_7_desc: "Понятно, что колхи недовольны тем, что мы захватили несколько их ценных портов. Они отправили делегации, чтобы узнать, как долго мы планируем оставаться в этом районе и что нужно сделать, чтобы мы ушли в наши собственные воды. Что мы предпримем?"
me_zygia_7.a: "Продать колхские порты обратно им."
me_zygia_7.b: "Они могут позволить нам оставить порты за собой."
me_zygia_7.c: "Не посылать им ни посланий, ни гонцов!"

me_zygia_8_title: "Опорные пункты зигиев"
me_zygia_8_desc: "Теперь, когда зигии навсегда захватили контроль над чужими портами, пришло время превратить их в постоянные станции для торговли и процветания. Как мы инвестируем в нашу новую территорию?"
me_zygia_8.a: "Из этих портов мы будем покорять дальние и ближние земли."
me_zygia_8.b: "Пусть они расширяют охват нашего рынка."
me_zygia_8.c: "Она будет развиваться органически."

me_zygia_9_title: "Оборона аванпостов зигиев"
me_zygia_9_desc: "Гонцы передают, что войска колхов появились на горизонте и направляются прямо к нашим портам — защитить наши новообретенные земли будет непросто. Мы должны сделать все, что в наших силах."
me_zygia_9.a: "К оружию!"

me_zygia_10_title: "Торговцы Никописа"
me_zygia_10_desc: "Греко-зигийские торговые группы на зигийских берегах смогли превратить захолустный грубый порт в оплот торговли, как легальной, так и не очень. Торикос превзошел свою стигму застойного пиратского убежища и теперь удовлетворяет торговые потребности всего восточного Понта Эвксинского, получив новое имя — Никопис."
me_zygia_10.a: "Пусть текут богатства!"
me_zygia_10_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_4$#!' $mission_completed_tooltip_2$"

me_zygia_11_title: "Гордость Зикса"
me_zygia_11_desc: "Вернув себе культурное имя, зигии обрели уверенность в своей способности проецировать силу во всем регионе и стать поистине доминирующим народом среди всех племен, живущих на вершинах Кавказа."
me_zygia_11.a: "За Зикс!"
me_zygia_11_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_5$#!' $mission_completed_tooltip_2$"

me_zygia_12_title: "Закон Тха"
me_zygia_12_desc: "Руководство Тешхуэ и звук приближения его глашатая будут направлять зигиев на протяжении многих поколений."
me_zygia_12.a: "Вера в Тешхуэ!"
me_zygia_12_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_6$#!' $mission_completed_tooltip_2$"

me_zygia_13_title: "Судьба Фанагории"
me_zygia_13_desc: "Поскольку наши пираты и воины ворвались в город через гавань и захватили все важные административные здания, город Фанагория по сути принадлежит зигиям в этот день. Однако, если мы уйдем, солдаты Боспорского царства, скорее всего, отобьют его в течение нескольких дней, а их обида на нас станет еще сильнее. Какова будет судьба этого города?"
me_zygia_13.a: "Забрать лучшее, оставить остальное."
me_zygia_13.b: "Разрушить город!"
me_zygia_13.c: "Боспорцы, вероятно, пойдут на сделку, чтобы позволить нам оставить его себе."
me_zygia_13.d: "Он станет нашей марионеткой."
me_zygia_13.d.t: "Город #Y Фанагория#! станет #Y городом лиги#! #E Зигии#!."

me_zygia_14_title: "Еврейский квартал Фанагории"
me_zygia_14_desc: "По мере того как Фанагория медленно восстанавливается, в порт прибыл флот еврейских купцов, заявляющих, что они бегут от хаоса диадохов и политики на родине — они хотят начать все сначала. Следует ли нам пригласить их поселиться в портовом городе?"
me_zygia_14.a: "Построить для них приветливый район города."
me_zygia_14.b: "Управление нашим новым городом и так достаточно сложно."
me_zygia_14_tooltip: "$mission_completed_tooltip_1$ '#Y $blemmia_missions_task_1$#!' $mission_completed_tooltip_2$"

me_zygia_15_title: "Кавалерия зигиев"
me_zygia_15_desc: "Опираясь на божественное мастерство верховой езды, кавалерия зигиев стала неподражаемой в поле."
me_zygia_15.a: "В атаку!"
me_zygia_15_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_8$#!' $mission_completed_tooltip_2$"

me_zygia_16_title: "Осушение меотийских болот"
me_zygia_16_desc: "Хотя создание городов на меотийском побережье помогло развить этот район и очистить его от болотных топей, большая часть земель по-прежнему лишена жителей или пригодных сельскохозяйственных угодий. Должны ли соплеменники потратить дополнительные ресурсы, чтобы расчистить эти земли под посев зерна?"
me_zygia_16.a: "Осушить болота."
me_zygia_16.b: "Оставить природу в покое."

me_zygia_17_title: "Единство вождей зигиев"
me_zygia_17_desc: "Имея большее влияние на будущее кланов, каждый зигийский вождь чувствует себя частью единого целого, а не разрозненной группы фракций. Однако доступ к большему количеству ресурсов и более динамичной племенной политической сцене заставит их задуматься об огромной власти, которая находится в их руках, если они заведут друзей в высших кругах..."
me_zygia_17.a: "Надеяться на стабильную федерацию."
me_zygia_17_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_10$#!' $mission_completed_tooltip_2$"

me_zygia_18_title: "Страна нартов"
me_zygia_18_desc: "Поскольку поклонение нартam проникло во все горы, зигии превратились в народ с большей решимостью и совместным стремлением подражать сказаниям о нартах древности. Дети мечтают, чтобы однажды их самих запомнили как следующее поколение нартов."
me_zygia_18.a: "Их поклонение укрепит нас."
me_zygia_18.b: "Мы станем истинной землей нартов!"

me_zygia_19_title: "Легенда или вымысел"
me_zygia_19_desc: "Хотя святилища #E Владычицы текучих вод#! были возведены по всему городу #E Патаруэ#, история о Пия и Пизигаше продолжает будить интерес многих посетителей и жителей. Среди народа нет единого мнения, можно ли считать эту историю правдой. Среди них восстал местный герой по имени [zygian_hero.GetName], который решил пройти по следам #E Пизигаша#! и просто нуждается в финансировании для своего путешествия. Если мы не поддержим его, он, скорее всего, все равно отправится сам, но может никогда не вернуться, таков он глупый мальчишка."
me_zygia_19.a: "Отправить героя в путь!"
me_zygia_19.b: "Истории о нашей Владычице будет достаточно для этого города."

me_zygia_20_title: "Странная пещера"
me_zygia_20_desc: "Во время своего путешествия, чтобы раскрыть правду легенды о Пизигаше и белых голубях, которые стали девами на дне Меотийского моря, [zygian_hero.GetName] набрел на подходящее место на берегу, где воздух и легкий ветерок окружили его ароматом и аурой божественного. Именно здесь он ударил мечом о землю, как это делал герой древности, и стал ждать, пока волны расступятся. \n\nХотя сама Меотида не сдвинулась для него, вспугнутое гнездо птиц зашелестело листьями ближайшей рощи и поспешно взлетело, привлечя его внимание к старой норе, зеву пещеры, который вел вниз в темную землю; он услышал эхо звука воды, плещущейся о земляные стены, доносящееся из пещеры."
me_zygia_20.a: "Это тот самый путь — герой отправится дальше!"
me_zygia_20.b: "В сказаниях говорилось о пути в море, а не об этой пещере в подземный мир; бежим!"

me_zygia_21_title: "Сокровище текучих вод"
me_zygia_21_desc: "Спустя некоторое время герой, долгожданный, вернулся к воротам #E Патаруэ#, ведя за руку беловласую деву. Все дамы, господа и крестьяне смотрели на них с изумлением. Они были поражены, увидев [zygian_hero.GetName] целым и в компании столь божественной женщины. Многие пытались расспросить его. Некоторые считали его наполовину божеством, поскольку он якобы совершил подвиг нартов, самих богов. \n\nОн отмахнулся от всех и направился прямиком в храм #E Владычицы текучих вод#!. В пределах ее святилища, ее священной вотчины, он преклонил колени и принес как жертву, так и дар: белый кулон с изображением голубя. Исполнив свой долг, он весело вернулся к народу и женился на своей девице перед лицом всех богов."
me_zygia_21.a: "Славьте нового героя эпохи!"

me_zygia_22_title: "Потерянный герой"
me_zygia_22_desc: "Герой зигиев, ставивший перед собой возвышенную цель раскрыть небылицы о Пизигаше, к сожалению, так и не вернулся, оставив свое наследство и имущество храму Владычицы текучих вод. Его память, скорее всего, будет забыта."
me_zygia_22.a: "Увы, история умирает вместе с ним."

me_zygia_23_title: "Легендарный туризм"
me_zygia_23_desc: "Недавний ажиотаж вокруг храма Владычицы текучих вод и местные пересказы ее древней истории начали привлекать значительный приток туристов и коммерческую активность в порт. Советники считают, что инвестиции в саму легенду могут оказаться весьма прибыльными. В частности, жрецы храма Владычицы настаивают на том, чтобы ученый скульптор создал мастерскую статую их Владычицы в ее честь и чтобы она служила ориентиром для стекающихся путешественников."
me_zygia_23.a: "Нанять величайших греческих мастеров!"
me_zygia_23.b: "Этот тренд пройдет, прибережем монеты на черный день."

me_zygia_24_title: "Статуя Владычицы"
me_zygia_24_desc: "Статуя была торжественно открыта [zygian_sculptor.GetName] и [ROOT.GetCountry.GetRuler.GetName] на площади у порта #E Патаруэ# к восторгу всех присутствующих. Это был поистине великолепный шедевр, запечатлевший дивные черты божества, которое он изображал. Все посещали это величественное святилище Владычицы текучих вод, отдавали дань уважения и дарили подарки."
me_zygia_24.a: "Слава Владычице текучих вод!"

me_zygia_25_title: "Народ Зихии"
me_zygia_25_desc: "Расширив зону своего контроля, зигии объединились под одним знаменем, чтобы войти в будущее под именем, которое долгое время было забыто."
me_zygia_25.a: "За Зихию!"
me_zygia_25_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_13$#!' $mission_completed_tooltip_2$"

me_zygia_26_title: "Царь нартов"
me_zygia_26_desc: "Подражая героям древности, таким как Варзамег, зигии будут следовать закону Тешхуэ, wielding клинки древних воинов, чтобы покорить вершины Кавказа и его окрестности."
me_zygia_26.a: "Сказания о героизме и завоеваниях ждут нас!"
me_zygia_26_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_14$#!' $mission_completed_tooltip_2$"

me_zygia_27_title: "Двуцветное яблоко"
me_zygia_27_desc: "Вокруг дерева, которое зигии охраняли, самый молодой из стражей обнаружил странное яблоко, висящее на самой высокой ветке. Взобравшись на великое, божественное дерево, он поближе рассмотрел сияющую поверхность яблока, только чтобы понять, что его лицо отражается в его мраморной поверхности. Он повернул плод вокруг его плодоножки и понял, что, хотя это и не твердый белый камень, в его желтой половине был молочный отблеск. Другая сторона яблока казалась почти окрашенной в кроваво-алый цвет, глубокий и тревожный оттенок. \n\nПрежде чем он успел опомниться, оно выскользнуло из его рук и оторвалось от дерева. Мальчик упал и разбился насмерть, но странное яблоко было принесено другим ближайшим стражем ко двору, где его представили [ROOT.GetCountry.GetRuler.GetName]. Все знали сказание о дереве нартов и его божественных плодах, но увидеть и испытать — это дело, требующее осторожности. [ROOT.GetCountry.GetRuler.GetName] быстро передал его служанке и велел ей испытать божественную природу плода."
me_zygia_27.a: "Съесть всё яблоко за один раз."
me_zygia_27.b: "Съесть только бледную половину."
me_zygia_27.c: "Съесть только багряную половину."
me_zygia_27.d: "Не пожирать яблоко; пусть оно останется почитаемым даром богов."


