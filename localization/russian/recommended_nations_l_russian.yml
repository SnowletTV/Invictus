  #India
  maurya_start:0 "#t Маурья#!\nСложность: #Y Легкая#!\n\n$maurya_heritage_desc$"
  anuradhpura_start: "#t Анурадхапура#!\nСложность: #y Нормальная#!\n\nАнурадхапура доминирует над островом Ланка во многих отношениях; мало того, что это ближайшая к материковой части страна, пользующаяся возможностями для торговли и дипломатии, которых просто нет у ее соседей, но Анурадхапура также имеет счастье быть местом, где Сигирия, древняя крепость огромной силы и чуда, доминирует и защищает весь ландшафт под собой."
  chola_start: "#t Чола#!\nСложность: #y Нормальная#!\n\nТамильские короли Чола, Чера и Пандья доминировали на юге Индии во времена правления Маурьев. Нестабильная и склонная к войнам, триумвират слишком долго разделял тамильский народ. Объединив их под одним правлением, мы займем свое место как законные правители Тамилакама."
