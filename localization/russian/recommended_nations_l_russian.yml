  siculia_start: "#t Сикулия#!\nСложность: #y Очень тяжелая#!\n\nСпустя 150 лет после поражения в битве при Номах от рук Сиракуз, племя сикулов — всё, что осталось от великой империи сицелов Дукетия, цепляющееся за жизнь в отдаленных внутренних районах Сицилии. Из-за непрекращающейся колонизации жаждущими власти греками и карфагенянами кажется, что вся надежда для Сикулии потеряна, и ей суждено исчезнуть в истории вместе с остальными её сородичами. Действительно ли судьба Сикулии предрешена, или великий лидер в духе Дукетия сможет восстать из сумеречного забвения, чтобы бросить вызов непреодолимым шансам и принести новый рассвет сицелов над Сицилией?"
  armenia_start: "#t Армения#!\nСложность: #Y Нормальная#!\n\n$armenian_heritage_desc$"
  ionia_start: "#t Иония#!\nСложность: #Y Тяжелая#!\n\n$ionian_heritage_desc$"
  miletos_start: "#t Милет#!\nСложность: #Y Тяжелая#!\n\n$milesian_heritage_desc$"                                                                               
  salluvia_start: "#t Саллувия#!\nСложность: #Y Нормальная#!\n\n$salluvia_heritage_desc$"

  #Northern Europe
  scythia_start: "#t Скифия#!\nСложность: #y Легкая#!\n\nСкифия переживает глубокий упадок после гибели царя Атея от рук Филиппа II Македонского. Несмотря на шаткие отношения с греками, некоторые начинают видеть в их городах оплоты силы и стабильности. Изменится ли Скифия вместе с эпохой или останется верна своему кочевому образу жизни?"
  bosporan_start: "#t Боспорское царство#!\nСложность: #Y Нормальная#!\n\nСпарток I был предводителем наемников, связанным родством с правителями Одрисского царства. Будучи нанятым тираном Пантикапея, Археанактидом, царем Боспора, исключительное военное мастерство и стратегическая проницательность Спартока позволили ему steadily расширить свое влияние и завоевать лояльность войск, служивших вместе с ним. В конце концов, он совершил переворот против Археанактидов, захватил Пантикапей для себя и основал на его месте династию Спартокидов.\n\nЗа три столетия своего правления Спартокиды расширили владения Боспорского царства от горстки слабо связанных городов, жавшихся вокруг Керченского полуострова, до полноценного эллинского королевства, способного стать бастионом против скифской и сарматской экспансии."
  boihaemia_start: "#t Бойогемум#!\nСложность: #Y Легкая#!\n\n$boihaemia_heritage_desc$"
  treveria_start: "#t Треверия#!\nСложность: #Y Легкая#!\n\n$treverian_heritage_desc$"
  haria_start: "#t Хария#!\nСложность: #Y Нормальная#!\n\n$lugian_heritage_desc$"
  semnonia_start: "#t Семнония#!\nСложность: #Y Нормальная#!\n\n$suebic_heritage_desc$"
  marcomannia_start: "#t Маркомания#!\nСложность: #Y Тяжелая#!\n\n$suebic_heritage_desc$"
  frisia_start: "#t Фрисия#!\nСложность: #Y Нормальная#!\n\n$ingvaeonic_heritage_desc$"
  guthonia_start: "#t Гутония#!\nСложность: #Y Нормальная#!\n\n$gothonic_heritage_desc$"
  bastarnia_start: "#t Бастарния#!\nСложность: #Y Нормальная#!\n\nИстория нашего народа, кочевых племен бастарнов, длинна и богата событиями, она уходит корнями за пределы памяти в туман Времени; даже наши Старейшины не уверены, где находилась наша первоначальная родина. Сколько мы себя помним, мы странствовали, мечтая о времени, когда наши скитания прекратятся..."
  osismia_start: "#т Осимия#!\nСложность: #Y Нормальная#!\n\n$aremorican_heritage_desc$"
  chattia_start: "#t Хаттия#!\nСложность: #Y Нормальная#!\n\n$istvaeonic_heritage_desc$"
  insubria_start: "#t Инсубрия#!\nСложность: #Y Нормальная#!\n\n$lepontic_heritage_desc$"
  androphagia_start: "#t Андрофагия#!\nСложность: #Y Тяжелая#!\n\n$androphagia_heritage_desc$"
  eburonia_start: "#t Эбурония#!\nСложность: #Y Нормальная#!\n\nВоинственные кланы Эбуронии живут near реки Рейн, обитая на равнинах и в лесах, которые они считают своими. Торговцы с цивилизованного юга избегают путешествий по этим темным лесам, опасаясь репутации свирепого бельгийского племени, которое, как известно, сопротивляется попыткам чужаков посетить их деревни."
  icenia_start: "#t Ицения#!\nСложность: #Y Нормальная#!\n\n$icenian_heritage_desc$"
  caledonia_start: "#t Каледония#!\nСложность: #Y Тяжелая#!\n\nБлизлежащие страны с культурой #Y Каледонская#! имеют доступ к этому дереву.\n\n$caledonia_heritage_desc$"
  ivernia_start: "#t Иверния#!\nСложность: #Y Нормальная#!\n\nБлизлежащие страны с культурой #Y Ивернийская#! или #Y Волунтийская#! имеют доступ к этому дереву.\n\n$ivernia_heritage_desc$"
  arvernia_start: "#t Арверния#!\nСложность: #Y Нормальная#!\n\n$arvernia_heritage_desc$"

  #Africa
  egypt_start: "#t Египет#!\nСложность: #y Очень легкая#!\n\n$ptolemys_heritage_desc$"
  cyrenaica_start: "#t Киренаика#!\nСложность: #y Тяжелая#!\n\nКиренаика долгое время была игрушкой в руках других империй; сначала ахемениды наложили на нее свое ненавистное ярмо рабства, а затем варварские армии Александра принесли еще больше хаоса и принудительного servitude в эту плодородную и пышную часть Африки. Киренаика, некогда бывшая домом для свободного и гордого народа, теперь номинально управляется Птолемеем, македонским генералом, который захватил власть и провозгласил себя басилевсом."
  kush_start: "#t Куш#!\nСложность: #y Легкая#!\n\nНарод Куша почти полностью исчез в небытии после падения 25-й династии. Пришло время изменить судьбу и стать сильнейшим фараоном, которого когда-либо видел мир!"
  aksum_start: "#t Аксум#!\nСложность: #Y Нормальная#!\n\n$Axumite_heritage_desc$"
  garamantia_start: "#t Гарамантия#!\nСложность: #Y Легкая#!\n\nБлизлежащие страны с культурой #Y Феццанская#! имеют доступ к этому дереву.\n\n$garamantes_heritage_desc$"
  massaesylia_start: "#t Массесилия#!\nСложность: #Y Тяжелая#!\n\n$Massaesylian_heritage_desc$"
  nuragic_start: "#t Гимнесия#!\nСложность: #Y Тяжелая#!\n\n$balearic_heritage_desc$"
  mosylon_start: "#t Мосилон#!\nСложность: #Y Тяжелая#!\n\nБлизлежащие страны с культурой #Y Макробийская#! имеют доступ к этому дереву.\n\n$mosylon_heritage_desc$"
  blemmia_start: "#t Блеммия#!\nСложность: #Y Тяжелая#!\n\n$Blemmian_heritage_desc$"
  scandia_start: "#t Гоутия#!\nСложность: #Y Тяжелая#!\n\nБлизлежащие страны с культурой #Y Скандийская#! имеют доступ к этому дереву.\n\n$scandian_heritage_desc$"

  #Asia
  antigonid_start: "#T Антигонидское царство#!\nСложность: #y Нормальная#!\n\n$antigonid_heritage_desc$"
  seleukid_start: "#T Империя Селевкидов#!\nСложность: #y Легкая#!\n\n$seleucus_heritage_desc$"
  bithynia_start: "#T Вифиния#!\nСложность: #y Тяжелая#!\n\n$bithynia_heritage_desc$"
  rhodes_start: "#t Родос#!\nСложность: #y Тяжелая#!\n\nПрекрасный остров Родос является воротами в Эгейское море, стратегически расположен и благословлен трудолюбивым и благородным народом, и именно эти неоспоримые факты заставили многие иностранные державы возжелать этот остров для себя. Родос недавно осаждали в течение года, и он все еще восстанавливается после пагубных последствий, но не будет сломлен!"
  judea_start: "#t Иудея#!\nСложность: #y Тяжелая#!\n\nНа протяжении веков евреи были ограничены Палестиной и некоторыми уголками Аравии, их святые места и древние места захоронений находятся в руках узурпаторов. Пришло время вернуть то, что по праву принадлежит еврейскому народу!"
  samaria_start: "#t Самария#!\nСложность: #y Тяжелая#!\n\n$samaria_heritage_desc$"
  bactria_start: "#t Бактрия#!\nСложность: #y Тяжелая#!\n\nБактрия остается под железной хваткой Империи Селевкидов, которая оказалась вовлечена в многочисленные конфликты на Западе, оставив свою сатрапию незащищенной от орд Скифии. Бактрия богата, урбанизирована и плодородна, и может стать великой нацией, если сможет обрести свободу."
  persis_start: "#t Персида#!\nСложность: #y Нормальная#!\n\n$heritage_of_persis_desc$"
  atropatene_start: "#t Атропатена#!\nСложность: #y Нормальная#!\n\n$atropatenian_heritage_desc$"
  sogdia_start: "#t Согдиана#!\nСложность: #y Очень тяжелая#!\n\n$sogdian_heritage_desc$"
  tasm_start:0 "#t Тасм#!\nСложность: #y Тяжелая#!\n\nВ самом сердце Аравийского полуострова племена тасмов с трудом выживают среди безлюдных песчаных дюн, цепляясь за животворные воды немногих оазисов, разбросанных по их территориям. Часто игнорируемые республиками и монархиями побережий, которые считают народ тасмов дикарями, пригодными лишь для найма в качестве наемников для их региональных войн, это станет их погибелью..."
  nabatea_start:0 "#t Набатея#!\nСложность: #y Тяжелая#!\n\nМалка Набатеи, как называют их царя, правит стратегически важной землей, которую широко пересекают торговцы, дипломаты и армии, поскольку владения набатеев граничат с Азией, Африкой и Аравией. Войны диадохов вывели этот жизненно важный регион в центр внимания, так как рушащийся политический статус-кво представил амбициозным набатеям возможность для экспансии. "
  iberia_start:0 "#t Иберия#!\nСложность: #y Нормальная#!\n\n$iberian_heritage_desc$"
  cappadocia_start:0 "#t Каппадокия#!\nСложность: #y Нормальная#!\n\n$cappadocian_heritage_desc$"
  saba_start:0 "#t Саба#!\nСложность: #Y Легкая#!\n\n$saba_heritage_desc$"
  qataba_start:0 "#t Катаба#!\nСложность: #Y Легкая#!\n\n$qataba_heritage_desc$"
  ach_heraclea_persica_start:0 "#t Гераклея Понтийская#!\nСложность: #Y Очень тяжелая#!\n\n$heraclea_pontican_heritage_desc$"
  tylos_start:0 "#t Тилос#!\nСложность: #Y Очень тяжелая#!\n\n$tylosian_heritage_desc$"
  caria_start:0 "#t Кария#!\nСложность: #y Тяжелая#!\n\n"Линия Гекатомнидов однажды привела Карию к величию. Из своей ancestral резиденции в Миласах Гекатомниды возвысились как сатрапы Карии, властители как ее высокогорий, так и побережий. При Мавсоле и Артемисии Галикарнас стал знаменит своим колоссальным Мавзолеем, его флоты командовали Эгейским морем, а при дворе принимали поэтов, ученых и солдат со всего эллинского мира. Даже в свой закат династия сохраняла честь: царица Ада, последняя из Гекатомнидов, усыновила Александра Великого как своего сына.\n\nТеперь Кария стоит на распутье. Восстановите старые порядки под возрожденными Гекатомнидами или создайте царство Преемников под властью Плейстарха и заявите свои права на империю Александра!"
  phoenicia_start:0 "#t Тир#!\nСложность: #y Тяжелая#!\n#E Финикийские миссии#! также доступны для Арада, Библа, Сидона и Триполи\n\nОт островной крепости Арад до bustling гаваней Сидона и Тира, финикийцы были renowned как торговцы, кораблестроители и исследователи непревзойденного качества. Именно мы научили мир тайнам моря, построили могущественный Карфаген и соединили далекие земли через сети торговли и культуры. Но эпоха подчинения империям и повелителям должна закончиться. Волны, которые несли наши корабли в каждый уголок известного мира, теперь понесут нас к господству, как на суше, так и на море. Пришло время объединить города Финикии и вернуть славу, которая является нашим birthright."
  #kios_start:0 "#t Хиос#!\nСложность: #Y Тяжелая#!\n\n$kian_heritage_desc$"
  mithridatid_start:0 "#t Владения Митридатов#!\nСложность: #Y Нормальная#!\n\nДом Митридата ведет свое происхождение от Дария через благородного Гобрия, и его влияние распространяется от лесистых холмов Мариандении до омываемых штормами берегов Мисии. Однако судьба нашей династии трепещет на ветру, поскольку так называемые друзья жаждут наших владений, в то время как Войны диадохов перемалывают lesser realms под македонскими сапогами.\n\nМы должны быть смелыми. Если опасность окружит наши пергамские земли, нам следует покинуть их, пусть и временно, и взглянуть на восток, в сторону укрытия высот Пафлагонии и Понтийской Каппадокии. Понтийское царство, нет, Понтийская империя, лежит перед нами, если только Митридат Ктист возьмет диадему и оставит диадохов препираться между собой!"
  albania_start:0 "#t Албания#!\nСложность: #Y Нормальная#!\n\n$caucasia_albania_heritage_desc$"
  colchis_start:0 "#t Колхида#!\nСложность: #Y Нормальная#!\n\n$colchis_heritage_desc$"
  paphlagonia_start:0 "#t Пафлагония#!\nСложность: #Y Тяжелая#!\n\n$paphlagonia_heritage_desc$"
  parthia_start: "#t Парфия#!\nСложность: #Y Нормальная#!\n\n$satrapy_parthia_heritage_desc$"
  dahae_start: "#t Парния#!\nСложность: #Y Нормальная#!\n\n$parnia_heritage_desc$"
  legia_start: "#t Легия#!\nСложность: #Y Тяжелая#!\n\n$legia_heritage_desc$"
  zygia_start: "#t Зигия#!\nСложность: #Y Тяжелая#!\n\n$zygia_heritage_desc$"
