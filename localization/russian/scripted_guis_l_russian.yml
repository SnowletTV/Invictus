### Republic Assembly
 assembly.1.t:0 "Куриатные комиции"
 summon_curiate_assembly:0 "Созвать Куриатные комиции"
 assemble_curiate_assembly_title_tt:0 "#T Созвать Куриатные комиции#!"
 assemble_curiate_assembly_desc_tt:1 "#TF Призывает некоторых из наших самых уважаемых патрициев, чтобы легитимизировать назначения [SCOPE.GetRootScope.GetCountry.Custom('get_court_type')]. Это действие может повысить возможности наших назначенных наместников, и его можно использовать только один раз каждые 10 лет."
 not_summoned_curiate_assembly_recently_tt:0 "Вы не можете снова созвать #Y Куриатные комиции#! до [SCOPE.GetRootScope.GetCountry.GetVariableExpiry('summoned_curiate_assembly')|Y]."
 any_non_ruler_governor_character:0 "Любой персонаж является #Y Наместником#!, но не #Y Правителем#!."
 curiate_assembly_para_1_1:0 "В относительном комфорте городских стен любимые граждане [SCOPE.GetRootScope.GetCountry.GetName] собираются, чтобы выразить свое одобрение или неодобрение нашим назначенным магистратам."
 curiate_assembly_para_1_campus_martius:0 "В этом году Куриатные комиции собираются на расширенных полях Марсова поля: количество участников просто слишком велико, чтобы проводить мероприятие внутри стен Рима.\n\nИней все еще покрывает траву, пока патриции устало входят внутрь, с заспанными глазами, но полные желания внести свой вклад в Республику."
 curiate_assembly_para_2_three_possible_candidates:0 "\n\nАссамблее было предложено поддержать кандидатуру одного из трех уважаемых наместников в этом году: [SCOPE.sChar('magistrate_1').GetName], [SCOPE.sChar('magistrate_1').Custom('get_council_1_descriptor')]; [SCOPE.sChar('magistrate_2').GetName], [SCOPE.sChar('magistrate_2').Custom('get_council_2_descriptor')] и [SCOPE.sChar('magistrate_3').GetName], [SCOPE.sChar('magistrate_3').Custom('get_council_3_descriptor')]."
 curiate_assembly_para_2_one_and_two:0 "\n\nПо этому случаю ассамблее были представлены два кандидата, ищущие поддержки и помощи в их роли. [SCOPE.sChar('magistrate_1').GetName], [SCOPE.sChar('magistrate_1').Custom('get_council_1_descriptor')] и [SCOPE.sChar('magistrate_2').GetName], [SCOPE.sChar('magistrate_2').Custom('get_council_2_descriptor')] терпеливо сидят, ожидая неизбежного одобрения патрициев."
 curiate_assembly_para_2_one_and_three:0 "\n\n[SCOPE.sChar('magistrate_1').GetName], [SCOPE.sChar('magistrate_1').Custom('get_council_1_descriptor')] и [SCOPE.sChar('magistrate_3').GetName], [SCOPE.sChar('magistrate_3').Custom('get_council_3_descriptor')] тревожно вглядываются в собравшихся патрициев, каждый, вероятно, надеясь, что их взятки и услуги сыграли им на руку."
 curiate_assembly_para_2_two_and_three:0 "\n\n[SCOPE.sChar('magistrate_2').GetName], [SCOPE.sChar('magistrate_2').Custom('get_council_3_descriptor')] и [SCOPE.sChar('magistrate_3').GetName], [SCOPE.sChar('magistrate_3').Custom('get_council_1_descriptor')] оба отправили посланников из своих провинций, будучи уверены, что их вклад в славу [SCOPE.GetRootScope.GetCountry.GetName] гарантирует им поддержку."
 curiate_assembly_para_2_only_one:0 "\n\nВ этом году для одобрения представлен только один кандидат — [SCOPE.sChar('magistrate_1').GetName]. Хотя это некоторое нарушение правил, ассамблея согласилась собраться и рассмотреть вопрос об одобрении [SCOPE.sChar('magistrate_1').GetPraenomen] несмотря ни на что."
 assembly.1.a:0 "Давайте заступимся за [SCOPE.sChar('magistrate_1').GetPraenomen]."
 assembly.1.b:0 "[SCOPE.sChar('magistrate_2').GetPraenomen], возможно, нужна помощь."
 assembly.1.c:0 "Давайте подтолкнем ассамблею в сторону [SCOPE.sChar('magistrate_3').GetPraenomen]."
 assembly.option.tooltip:1 "Благодаря #G Изяществу#! и #R Коррупции#! нашего правителя, у нас есть #Y [SCOPE.ScriptValue('curiate_endorsement_chance_svalue')|1]%#! шанс на успех."
 assembly.1.d:0 "Мы доверяем ассамблее сделать мудрый выбор."
 assembly.option.tooltip_deal_magistrate_1:1 "Если мы выберем этот вариант, шанс на успех увеличится до #Y [SCOPE.ScriptValue('curiate_endorsement_result_chance_svalue_magistrate_1')|1]%#!."
 assembly.option.total_magistrate_1:1 "Если мы выберем этот вариант, наш шанс на успех составит #Y [SCOPE.ScriptValue('curiate_endorsement_already_endorsed_chance_svalue_magistrate_1')|1]%#!."
 assembly.option.tooltip_already_endorsed_1:1 "Из-за предыдущей поддержки этого кандидата шанс #R снижен#! до #Y [SCOPE.ScriptValue('curiate_endorsement_already_endorsed_chance_svalue_magistrate_1')|1]%#!."
 assembly.option.tooltip_deal_magistrate_2:1 "Если мы выберем этот вариант, шанс на успех увеличится до #Y [SCOPE.ScriptValue('curiate_endorsement_result_chance_svalue_magistrate_2')|1]%#!."
 assembly.option.tooltip_already_endorsed_2:1 "Из-за предыдущей поддержки этого кандидата шанс #R снижен#! до #Y [SCOPE.ScriptValue('curiate_endorsement_already_endorsed_chance_svalue_magistrate_2')|1]%#!."
 assembly.option.tooltip_deal_magistrate_3:1 "Если мы выберем этот вариант, шанс на успех увеличится до #Y [SCOPE.ScriptValue('curiate_endorsement_result_chance_svalue_magistrate_3')|1]%#!."
 assembly.option.tooltip_already_endorsed_3:1 "Из-за предыдущей поддержки этого кандидата шанс #R снижен#! до #Y [SCOPE.ScriptValue('curiate_endorsement_already_endorsed_chance_svalue_magistrate_3')|1]%#!."
 magistrate_1_picked_for_consideration:0 "\n#Y [SCOPE.sChar('magistrate_1').GetName]#! будет рассмотрен для одобрения."
 magistrate_2_picked_for_consideration:0 "\n#Y [SCOPE.sChar('magistrate_2').GetName]#! будет рассмотрен для одобрения."
 magistrate_3_picked_for_consideration:0 "\n#Y [SCOPE.sChar('magistrate_3').GetName]#! будет рассмотрен для одобрения."
 random_magistrate_picked:0 "Ассамблея сама выберет наместника для поддержки.\nШанс на успех будет зависеть от того, какой наместник будет выбран."
 potential_endorsement_rewards:0 "Результаты одобрения могут включать @military_icon! @civic_icon! @oratory_icon! @religious_icon! или @gold!\n\n"
 assembly.1.e:0 "Давайте не будем вмешиваться, ассамблея примет правильное решение."
 assembly.2.t:0 "Ассамблея одобряет [SCOPE.sChar('selected_candidate').GetPraenomen]"
 assembly.3.t:0 "Ассамблея отказывает в одобрении"
 assembly.2.desc:0 "Под бурные аплодисменты спикер Куриатных комиций одобряет продолжение назначения [SCOPE.sChar('selected_candidate').GetName], прославленного [SCOPE.sChar('selected_candidate').GetTitleName].\n\nС этой newfound поддержкой ассамблея собирается утвердить создание нескольких малых постов, чтобы помочь [SCOPE.sChar('selected_candidate').GetPraenomen] в [SCOPE.sChar('selected_candidate').GetHerHis] обязанностях. К счастью, они предложили несколько вариантов и просят нас решить, какой из них наиболее подходит для [SCOPE.sChar('selected_candidate').GetPraenomen]."
 assembly.2.a:0 "Выбор военных советников."
 assembly.2.b:0 "Ряд младших магистратов."
 assembly.2.c:0 "Священнослужитель в качестве советника."
 assembly.2.d:0 "Известный мастер риторики."
 assembly.2.e:0 "Наверняка [SCOPE.sChar('selected_candidate').GetPraenomen] нашел бы более полезное применение золоту?"
 assembly.2.f:0 "Мягкая игрушка."
 multiple_endorsements_corruption:0 "\nПоскольку этот кандидат уже был одобрен ранее:\n"
 traits.2.b:0 "Призовите мудрейшие умы земли!"
 enables_unusual_event_options:0 "Черта #Y Безумец#! открывает некоторые особенно необычные варианты событий."
 assembly.3.desc:0 "Куриатные комиции заседали до самого жаркого полдня, с мрачными лицами и неодобрительными взглядами. Наконец, спикер встает и произносит язвительную критику наших кандидатов.\n\nПохоже, в этом году мы не получим одобрения."
 assembly.3.a:0 "Проклятье!"
 assembly.3.b:0 "Нам придется загладить вину перед [SCOPE.sChar('selected_candidate').GetPraenomen]."
 assembly.3.c:0 "Да будет так. Немедленно упразднить Куриатные комиции."
