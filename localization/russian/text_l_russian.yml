 ######RELIGIONS######:0 ""
 roman_pantheon:0 "Эллинская"
 desc_roman_pantheon:0 "Распространившись из греческого сердца, олимпийский пантеон почитается многими. Имена, аспекты и иерархия многих богов могут сильно варьироваться от региона к региону, однако Зевс, или Юпитер, как его знают римляне, считается главой олимпийского пантеона."
 egyptian_pantheon:0 "Кеметская"
 desc_egyptian_pantheon:0 "История исконной египетской религии насчитывает многие тысячи лет. Проявляясь как политеистическая вера, поклонение Ра, Атуму, Сехмет и другим демонстрирует глубокое почтение к фундаментальным аспектам природного мира."
 carthaginian_pantheon:0 "Ханаанейская"
 desc_carthaginian_pantheon:0 "Ханаанейская религия почитает множество богов и их аспектов в политеистической манере. Баал считается главным божеством в сложной иерархии младших богов, которым часто поклонялись в святилищах, расположенных на горах или холмах."
 shamanism:0 "Залмоксианская"
 desc_shamanism:0 "Был ли Залмоксис изначально пророком или богом, неизвестно. Однако даки и геты почитают Залмоксиса как божественное существо, приписывая ему множество чудесных деяний."
 druidism:0 "Друидическая"
 desc_druidism:0 "Друиды представляли для кельтов отдельный социальный класс. Часто выступая в роли магистратов и законодателей, они также диктовали местные религиозные обычаи и верования."
 animism:0 "Иберийская"
 desc_animism:0 "По сути являясь гибридной политеистической религией, иберийские религиозные практики включают почитание духов животных, а также культ предков. Иберы поклонялись различным эллинским и финикийским богам, а также местным божествам, таким как Бетатун или Атаэцина."
 judaism:0 "Израильская"
 desc_judaism:0 "Необычно для современных верований, израильская религия является монотеистической. Следуя за серией пророков и учителей, священная книга израильтян содержит детали завета, созданного между Богом и детьми Израиля."
 zoroaster:0 "Зороастрийская"
 desc_zoroaster:1 "Пророк Зороастр учил вере в Бога-Творца Ахура Мазду и его противника Ахримана. Развившись из раннего индо-иранского политеизма, великое почтение проявляется к «вечному закону», или Даэне, которая проповедует доброе и праведное поведение."
 matrist_religion:0 "Ве'ра'"
 desc_matrist_religion:0 "О балтийских племенах и их религии известно мало. Тем не менее, сохранились археологические данные, рассказывающие о культах, поклоняющихся нескольким натуралистическим богам вдоль побережья Балтики. Скорее всего, основываясь на реконструкциях прабалто-славянского языка, их название для веры было Ве'ра', от которого произошли современные слова víra на чешском, wiara на польском и véra на русском."
 berber_religion:0 "Амазигская"
 desc_berber_religion:0 "Древняя культура и религия были плавильным котлом традиционных египетских верований, звездопоклонничества и почитания предков. Многие мегалиты — каменные сооружения, воздвигнутые в честь богов, — до сих пор существуют, разбросанные по африканскому ландшафту."
 germanic_religion:0 "Туистская"
 desc_germanic_religion:0 "Древнегерманский бог Твисто, Туисто, Тиус или Тейвс почитался ранними кочевыми племенами из современной Скандинавии. Многие источники предполагают, что германские народы практиковали преимущественно анимистическую религию, почитая землю и небо, а также жизненную силу всех живых существ."
 arabian_pantheon:0 "Арабская"
 desc_arabian_pantheon:0 "Религия в Аравии представляла собой политеистическую смесь божеств, аспектов и демонов, практикуемую в местных очагах и анклавах по всему региону. Аллах, Бог-Творец, возможно, почитался как глава пантеона в этот период в некоторых местах."
 buddhism:0 "Буддийская"
 desc_buddhism:0 "Относительно молодая религия, буддизм возник в Северной Индии вслед за жизнью Сиддхартхи Гаутамы, или просто Будды. Будда был аскетичным учителем, который проповедовал Средний путь по всей Индии."
 hindu:0 "Ведическая"
 desc_hindu:0 "Ведические верования сформировали то, что стало индуизмом Северной Индии. Они пришли от индо-арийских поселенцев Индии и стали широко распространены по всей Индии, за исключением земель дравидов."
 agama:0 "Агамическая"
 desc_agama:0 "Агамические верования сформировали то, что стало индуизмом Южной Индии. Это была исконная религия Индии до того, как индо-арийские завоеватели заселили Север."
 bon_religion:0 "Бон"
 desc_bon_religion:0 "Бон представляет собой совокупность народных религий, первоначально практиковавшихся на Тибетском нагорье. Часто встречаются аспекты культа предков и анимизма, а также зарождающийся политеизм."
 indo_iranian_religion:0 "Гептадическая"
 desc_indo_iranian_religion:0 "Возникнув на скифских землях, эта пантеистическая вера поклонялась семи главным богам, которых часто отождествляли с богами греческого пантеона. Элементы более ранней политеистической народной религии скифов все еще сохраняются, как и практика жертвоприношения лошадей и захоронения колесниц, похожие на кельтские."
 anatolian_religion:0 "Анатолийская"
 desc_anatolian_religion:0 "Фригийский культ Кибелы связан с доисторическим поклонением Богине-Матери. Развиваясь на протяжении тысячелетий, культ Кибелы часто заявлял о родстве с мифическими фигурами и героями и практиковал свою религию через почитание идолов."
 armenian_religion:0 "Халдская"
 desc_armenian_religion:0 "Халдский пантеон представляет собой религию, выросшую из урартской культуры много веков назад. Будучи преимущественно политеистической верой, главный бог был известен как Халди и почитался как бог войны."
 anahitic_religion:0 "Армянская"
 desc_anahitic_religion:0 "Армянский пантеон находится на перекрестке эллинского, зороастрийского, анатолийского и даже ханаанейского и арабского пантеонов. Во главе пантеона стоит Анаит, вместе с ней в этой религии-плавильном котле стоят несколько других божеств, включая тех, кто имеет древнее армянское происхождение."
 caucasian_religion:0 "Армазская"
 desc_caucasian_religion:0 "Возможно, связанная с близлежащими анатолийскими религиями, пантеон региона Кавказской Иберии находился под властью бога Армаза."
 circassian_pantheon:0 "Нартская"
 desc_circassian_pantheon:0 "Происходит от слова «Нарт», означающего «Герой», которое описывает так называемые Нартские саги — сборник сказаний о титульных огромных героях-всадниках. Северокавказская религия отличается от своих южных аналогов, отвергая греческие и персидские влияния в пользу скифских и других иранских племенных групп."
 mesopotamian_religion:0 "Халдейская"
 desc_mesopotamian_religion:0 "История халдейского пантеона насчитывает многие тысячи лет. Поклоняясь таким богам, как Ану, Энки и Нанна, приверженцы халдейской религии строят внушительные храмы в честь своего избранного Бога."
 jainism:1 "Джайнская"
 desc_jainism:0 "Джайнизм — это индийская вера, история которой насчитывает много лет, восходя к ранним учителям религии. Последователи джайнизма твердо верят в аскетизм и ненасилие и поддерживают дружеские отношения с другими индийскими традициями."
 ajivika:1 "Адживика"
 desc_ajivika:0 "Адживика — это шраманская индийская вера, которая была очень популярна до того, как её вытеснили буддизм и джайнизм. Последователи адживики твердо верят в Нияти — убеждение в том, что жизнь предопределена и судьбоносна."
 nuragic_pantheon:0 "Нурагическая"
 desc_nuragic_pantheon:0 "Нурагическая вера уходит корнями в бронзовый век Корсики и Сардинии. Наполненная культами животных и колодцев, наиболее центральной для нурагической веры является генотеистическая вера в Бога-Отца, известного под многими именами, включая Сардо, Сид Аддир и другие."

 puntic_religion:0 "Вааки"
 desc_puntic_religion:0 "Ваак, всемогущий Бог-Творец и Отец нам всем, верно почитался народами, живущими на Африканском Роге, на протяжении тысячелетий, причем их непоколебимая преданность Верховному Существу обеспечивала его всеобъемлющий мир и гармоничные благословения. Древняя монотеистическая религия со сложной иерархией и набором верований, Ваак превосходит всё и повелевает многочисленными ангельскими посредниками, которых он посылает к своему народу, осыпая своих последователей удачей и защищая их от врагов своей силой и славой."

 illyrian_pantheon:0 "Иллирийская"
 desc_illyrian_pantheon:0 "Иллирийские народы верили вdistinctный иллирийский пантеон с влияниями италийского и эллинского пантеонов. В иллирийской религии не было единого главного бога, вместо этого почиталось множество местных божеств. У них также было два важных культа: Культ Солнца у пеонийских иллирийцев и Культ Змея у южных иллирийцев."

 burmese_religion:0 "Натская"
 desc_burmese_religion:0 "Поклонение духам, называемым Натами, было распространено среди многих австро-азиатских народов, включая нынешних коренных жителей Бирмы. Натская вера впоследствии стала полноценной политеистической религией, но пока она считалась скорее анимистической, с начинающими формироваться элементами политеизма."

 italic_pantheon:0 "Италийская"
 desc_italic_pantheon:0 "Народы Италии поклонялись разнообразию богов до принятия эллинских. От доиндоевропейских верований этрусков и ретов до иллиро-италийских верований венетов, южно-италийских богов сабинян, латинов, умбров и других, италийский пантеон обширен и разнообразен среди своих последователей."
 vaksh_religion:0 "Вокситская"
 desc_vaksh_religion:0 "Сочетая верования народов реки Вахш (Окс), гептадическую религию Степи и зороастрийские верования персов, вокситская религия обретает собственную идентичность как культурный и религиозный плавильный котел, почитающий своих местных богов среди более знакомых богов других народов."

 nilotic_pantheon:0 "Ньяликская"
 desc_nilotic_pantheon:0 "Нилотские народы имели distinctный пантеон богов, которые вдохновляли и влияли на народы вокруг них по мере их миграции через Сахару и Нил. От прото-Хатор, богини-коровы, до верховного существа самого Ньяла, этот пантеон наполнен влиятельными и уникальными божествами."

 eastern_animism:0 "Сванко"
 desc_eastern_animism:0 "Представляя религию тохаров в Таримском бассейне, Сванко почитает богиню Солнца Сванчо среди других изолированных богов. Религия тохаров наиболее тесно связана с древней хеттской религией; разделенные сотнями лет, это настоящий изолят древней индоевропейской религии."

 mithra_religion:0 "Митраистская"
 desc_mithra_religion:0 "Религия мидийцев фокусируется преимущественно на боге Митре, а не на Ахура Мазде. Она является прямым потомком древних дозороастрийских верований Персии. Возвышение Ахеменидов ознаменовало как взлеты, так и падения, часто благоприятствуя зороастризму маздаизма, но по сей день она остается с народом мидийцев."

 hurrian_pantheon:0 "Хурритская"
 desc_hurrian_pantheon:0 "Хурритская вера вращается вокруг могущественного Тешуба в его бесконечной борьбе цикла Кумарби. Хурритская религия — это древняя религия, которая в это время исчезла в небытии, но все еще остается в недавней памяти. Не так давно хурритская религия влияла на хеттов, хурритов и финикийцев alike. Возможно, истории о Тешубе еще не потеряны навсегда."

 uralic_pantheon:0 "Илмарическая"
 desc_uralic_pantheon:0 "Илмарическая религия представляет собой религию финно-угорской культурной группы. Она включает в себя широкий спектр культур и верований, все из которых вращаются вокруг главного бога Илмы, которому, несомненно, поклонялись во всех финно-угорских культурах. Вместе с Илмой, илмарические верования включают акцент на свете ночного и дневного небес — Луне и Солнце."

 hatti_religion:0 "Хаттская"
 desc_hatti_religion:0 "Древняя вера хаттов была когда-то забыта народами, живущими в Анатолии, хотя недавно она была возрождена теми, кто живет в Пафлагонии. Верные хатты находятся в гармонии с природными циклами сезонов и самой Земли; подношения и возлияния готовятся и преподносятся Богине-Матери, чтобы сохранить поля плодородными и предотвратить небесные катаклизмы, способные опустошить землю."

