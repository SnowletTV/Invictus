 flavor_germanics.900.t:0 "Recuperación de la Patria"
 flavor_germanics.900.desc:0 "Hace generaciones, nuestro pueblo logró lo impensable: viajó a través de medio mundo a través de mantos de nieve, matorrales de bosques, un vasto mar de llanuras, duros desiertos y las montañas más altas que el mundo tenía para ofrecer, logrando una migración legendaria sin paralelo a ninguna anterior. Sin embargo, después de acostumbrarse al clima más agradable del subcontinente, lograr prosperidad en sus tierras fértiles y adquirir riquezas más allá de la imaginación, muchos de nuestro pueblo todavía anhelaban su hogar y a los que quedaron atrás, un enorme vacío dejado en sus corazones no colmado por la riqueza y la aventura.\n\nPor lo tanto, decidimos hacer el igualmente insondable viaje de regreso a casa, y aunque fue increíblemente largo, costoso y difícil, hemos logrado recuperar lo que una vez fue nuestro y reunirnos con nuestros parientes perdidos; Nacido de las cicatrices de la separación entre el Este y el Oeste, el camino hacia la reconciliación será desafiante, pero ahora estamos unidos como una Germania unificada, lista para enfrentar cualquier desafío de frente y sin vacilación. \n\nMientras estábamos fuera, aprendimos una variedad de técnicas orientales y nos acostumbramos bastante a nuestros exóticos compañeros animales que traíamos en el camino. ¿Deberíamos intentar criar aquí estas grandes bestias de carga e introducirlas en este continente, o volvemos a las costumbres tradicionales?"
 flavor_germanics.900.a:0 "¡Habrá elefantes en Europa!"
 flavor_germanics.900.b:0 "Debemos volver a nuestras tradiciones."
 
 flavor_germanics.901.t:0 "¿Un viaje de regreso?"
 flavor_germanics.901.desc:0 "Hace generaciones, las tribus de Germania lograron lo impensable: viajaron por medio mundo a través de mantos de nieve, matorrales de bosques, un vasto mar de llanuras, duros desiertos y las montañas más altas que el mundo tenía para ofrecer, logrando una migración legendaria sin paralelo a ninguna anterior. Sin embargo, después de haberse acostumbrado al clima más agradable del subcontinente, haber logrado prosperidad dentro de sus tierras fértiles y haber adquirido riquezas más allá de la imaginación, muchos de ellos todavía anhelaban su hogar y a los que quedaron atrás, un enorme vacío dejado en sus corazones sin llenar por la riqueza y la aventura. \n\nPor lo tanto, a pesar de las probabilidades, un grupo de indogermánicos decidió hacer el igualmente insondable viaje de regreso a casa, y aunque fue increíblemente largo, costoso y difícil, aparentemente lograron recuperar lo que una vez fue suyo y reunirse con sus parientes perdidos; Nacidos de las cicatrices de la separación entre el Este y el Oeste, el camino hacia la reconciliación será desafiante, pero ahora están unidos como una Germania unificada, lista para enfrentar cualquier desafío de frente. Sólo el tiempo dirá qué resulta de este peculiar desarrollo."
 flavor_germanics.901.a:0 "Nunca lo hubiera imaginado..."
 flavor_germanics.901.b:0 "¡Un aliado perfecto!"
 flavor_germanics.901.c:0 "¡Bien por nuestros primos!"
 flavor_germanics.901.d:0 "¡Es hora de huir a Egipto!"
 has_indo_germanic_culture_tooltip:0 "Esta opción está disponible debido a la cultura primaria #Y indogermánica#! de nuestro país."
 igk_gee_has_belgae_culture_tooltip:0 "Esta opción está disponible porque la cultura principal de nuestro país pertenece al grupo cultural #Y belga#!."
 indo_germanic_germania_insane_opmod:0 "Diplomacia lunática"
 indo_germanic_germania_kin_opmod:0 "Orgullosos de nuestros primos"
 indo_germanic_germania_kin_reverse_opmod:0 "Feliz de ser apreciado"
 indo_germanic_germania_belgae_opmod:0 "No."
 indo_germanic_germania_belgae_reverse_opmod:0 "Huyendo a Egipto"

 #Startup events
 startup_events.10.t:0 "Los Frisios"
 startup_events.10.desc:0 "Hace unos tres siglos, nuestros antepasados arrebataron al mar el suelo en el que vivimos. Amontonaron capa tras capa de barro hasta que se crearon los llamados terps.\n\nNuestra gente se dedica a la cría y el comercio de animales a través del mar, lo que ha llevado a que cada vez más inmigrantes vengan a vivir aquí y, literalmente, a construir su propia fortuna junto a nuestra propia gente.\n\nEs difícil decir lo que depara el futuro, pero tal vez podamos echar un vistazo a la misteriosa isla de #E Albión#!..."
 startup_events.10.a:0 "¡Nosotros, Frisios, somos hombres libres!"

 startup_events.11.t:0 "Los Suevos"
 startup_events.11.desc:0 "Los #E suevos#!, también #E irminones#!, se desarrollaron a partir de la población local de la Edad del Bronce alrededor del #E río Albis#!, el moderno Elba. La llegada de la Edad del Hierro estuvo acompañada de una transformación de la sociedad; de ahora en adelante todos eran iguales en la muerte, ya que todos eran enterrados en una urna fabricada localmente después de que sus restos hubieran sido cremados. \n\nSin embargo, la destreza militar comenzó a desempeñar un papel cada vez más importante, lo que culminó con el hecho de que los suevos se convirtieran en el modelo de la cultura germánica. Los hombres jóvenes de otras tribus se peinaban al estilo suevo, conocido como el #E 'nudo suevo'#!. \n\nSus vecinos vigilan constantemente con miedo sus redadas. Pero tal vez, un líder popular pueda romper la tradición de igualdad en la muerte..."
 startup_events.11.a:0 "¡Deja que [GetDeityDefinition('omen_irmin').GetName] nos guíe!"

 startup_events.12.t:0 "Los Vándalos"
 startup_events.12.desc:0 "El fenómeno del uso de urnas faciales comenzó en la Pomerania moderna y se extendió hacia el sur, hasta lo que se convertiría en la Polonia continental. Estas urnas faciales tenían tapas en forma de sombreros, rostros supuestamente modelados según los dibujos enterrados e incisos.\n\nLa divergencia entre los pueblos del norte de la costa báltica y los pueblos continentales se ha intensificado con el paso del tiempo, y ambos tomarán direcciones diferentes en el futuro.\n\nEl último siglo ha visto una afluencia de #E Migrantes suevos#! que viven en asentamientos separados entre nuestro pueblo y han conservado sus tradiciones y tradiciones guerreras. Las interacciones que surjan entre nuestra cultura y la de ellos dependen de nosotros."
 startup_events.12.a:0 "¡Deja que [GetDeityDefinition('omen_alcis').GetName] nos guíe!"

 startup_events.13.t:0 "Los Germánicos de la Costa Sur del Báltico"
 startup_events.13.desc:0 "La cultura, las creencias y también los pueblos de la patria original de la Edad del Bronce Nórdica, la Península Escandinava, llegaron a la tierra de Pomerania en los tiempos modernos, donde se fusionaron con el sustrato local. Estas fueron las raíces de los #E germánicos#! que vivían en esta zona y potencialmente también de mitos y leyendas registrados posteriormente.\n\nMás tarde, el fenómeno del uso de urnas faciales comenzó en esta zona y se extendió hacia el sur, hasta lo que hoy es Polonia continental. Estas urnas faciales tenían tapas en forma de sombreros, rostros supuestamente modelados a partir de los dibujos enterrados e incisos.\n\nLa divergencia entre los #E vándalos#! del sur y la gente de la costa báltica se ha intensificado con el paso del tiempo y, sin embargo, algunas tradiciones compartidas, como las urnas faciales, permanecen, revelando una tenue conexión que continúa deshilachándose a lo largo de los años."
 startup_events.13.a:0 "¡Deja que [GetDeityDefinition('omen_gautr').GetName] nos guíe!"

 startup_events.14.t:0 "Los Ingvaeónicos"
 startup_events.14.desc:0 "Como parte de las rutas comerciales activas que se extienden desde Pritannia hasta Escandia, los Ingvaeónicos han tenido fácil acceso a productos de cualquiera de los dos y se han beneficiado como intermediarios, siendo capaces de hablar tanto celta como germánico.\n\nSu hogar es la costa oriental del Mar del Norte, caracterizada por playas principalmente arenosas, estuarios de ríos y el Mar de Frisia. Son maestros de este mar agreste en sus robustos barcos, y pronto podrían fijar su mirada en nuevas tierras."
 startup_events.14.a:0 "El Mar del Norte nos espera."

 startup_events.15.t:0 "Los Istvaónicos"
 startup_events.15.desc:0 "En el cruce de caminos entre los #E celtas#! y los #E suevos germánicos#!, entre los ríos Rhenus y Visurgis, viven los #E istvaónicos#!. Influenciados por todos sus vecinos en diversos grados, su cultura y creencias son una amalgama que difiere de una tribu a otra, ya que una tribu se inclina más hacia un lado y la otra tribu hacia el otro.\n\nSin embargo, erigir fuertes en las colinas para una fuerte defensa es una tradición compartida por todos los istvaónicos hasta el día de hoy; No se puede subestimar la cantidad de coordinación social y trabajo involucrado en esta tradición.\n\nQué camino tomarán estas tribus es una incógnita. ¿Se unirán o se verán absorbidos por potencias extranjeras? Sólo el tiempo lo dirá."
 startup_events.15.a:0 "¡Deja que [GetDeityDefinition('omen_istaevo').GetName] nos guíe!"

 #Gaulish events
 flavor_gaul.1.t:0 "Las Gallizenae"
 flavor_gaul.1.desc:0 "Has viajado lejos, y sin embargo las mujeres no te dejarán avanzar más. 'Ninguno con un eje entre las piernas puede cruzar el agua', cackeó una anciana. 'Rey, jefe o campesino, solo una mujer puede visitar la isla sagrada'.\n\nMiras hacia el agua brumosa, solo viendo el contorno tenue de la isla bendita más allá de las olas. Las nueve sacerdotisas de las Gallizenae habitaban en esa isla, y si se ha de creer a las ancianas, podrían transformarse en bestias y comandar los vientos. Viniste aquí porque necesitabas su ayuda.\n\n'Entonces vete, anciana', gritas a la anciana. 'Tengo asuntos con las Gallizenae, pero honraré a los dioses y no iré más allá'. La anciana sonríe ampliamente, sin mostrar ningún diente, y extiende su palma abierta expectante. Sus ojos apagados se mueven de un lado a otro de manera loca, mirando todo menos a ti.\n\nA regañadientes, colocas una bolsa de monedas, que suenan suavemente, en su mano. '¿Qué querrá mi jefe con las sacerdotisas sagradas?' pregunta en tono burlón, sus ojos de repente fijos en ti, sin parpadear."
 flavor_gaul.1.descf:0 "Miras a través del estrecho, más allá del cual reinan las místicas Gallizenae. Una anciana encorvada y amable está a tu lado, señalando débilmente hacia un contorno oscuro en el horizonte. 'Allí es donde mi señora debe ir, para encontrar a las doncellas oraculares' dice débilmente.\n\nLa isla más allá está envuelta en brumas, y solo se permite la entrada a mujeres. 'Busco un paso, y traigo moneda' le dices a la anciana, a lo que ella se ilumina. 'Entonces vamos ahora' dice con entusiasmo y con una energía sobrenatural se aleja corriendo.\n\nSabes bien que debes seguirla, y pronto encuentras a la anciana gesticulando a unos pescadores para que salgan de su bote. Está equipado con una gran linterna en su proa y un par de remos, pero la mujer te asegura que ella te llevará a la isla sola. 'No necesitamos hombres, y además no pueden ir' murmura mientras los pescadores se alejan de mala gana.\n\nTe encuentras en el pequeño bote, y la débil mujer parece no estar tan débil ya. Ella rema con fuerza, y a mitad del estrecho te pregunta '¿Cuál es el propósito de la señora con las sacerdotisas?'. Sus ojos están fijos en ti, y parecen pertenecer a una joven, no a una anciana."
 flavor_gaul.1.a:0 "He enfermado y busco la curación de Mullo."
 flavor_gaul.1.b:0 "Requiero de su oráculo para encender una antorcha, pues el futuro es incierto."
 flavor_gaul.1.c:0 "Deseo la buena fortuna de Toutatis en el mar."
 flavor_gaul.1.d:0 "Debo ganar el favor de Smertrios en las batallas venideras."
 flavor_gaul.1.e:0 "He cambiado de opinión, anciana, ¡devuélveme mi moneda!"
 flavor_gaul.2.t:0 "Los Poderes Sanadores de las Gallizenae"
 flavor_gaul.2.desc:0 "Los días pasan contigo acampado impaciente en la orilla, pero una tarde, cuando la luna está baja y la niebla se eleva sobre la playa, aparece una luz sobre las aguas oscuras. Distingues una linterna naranja fijada a la proa de un pequeño barco y, una vez varada, la anciana se acerca corriendo con una joven doncella a cuestas. \n\nLa doncella está vestida con una fina capa de lino fijada con un broche adornado sobre su pecho. \"La doncella sacerdotisa ha aconsejado a los dioses\", dijo la anciana irreverentemente y se adentró en el bosque, dejando a la doncella sola contigo. La joven que tienes ante ti es asombrosamente hermosa y sientes un impulso prohibido. \n\nElla se acerca a ti y habla en voz baja: \"Mi jefe, ¿buscaste el consejo de Mullo?\" Miras sus ojos oscuros y las fragancias de múltiples hierbas flotan en el aire. Su respiración se vuelve más pesada y el broche de metal presiona contra tu pecho. \"Es mejor dar el regalo de Mullo en privado\", murmura y coloca su mano en la tuya.\n\n"
 flavor_gaul.2.descf:0 "Al día siguiente estás en una arboleda en el centro de la isla. La luna proyecta sombras oscuras sobre la arboleda y en su centro se encuentra una gran piedra tallada. Lo rodean nueve figuras esbeltas y envueltas en capas, cada una susurrando a una entidad invisible, pero cada susurro parece tener la fuerza de diez. \n\nJuntas, las voces son una cacofonía de murmullos en lugar de las voces suaves de las nueve doncellas presentes. Una de las criadas se alerta por tu presencia y se acerca a ti. \"Mi señora sufre una enfermedad, sacerdotisa, y necesita la bendición de Mullo\", dice débilmente la anciana, habiendo desaparecido repentinamente la energía que se manifestó durante el viaje. \n\n \"Ya veo\", dice la sacerdotisa vacilante. 'Venga conmigo'. Te das la vuelta para despedirte de la anciana, pero ella ha desaparecido y decides alcanzar a la sacerdotisa. Los dos llegan a un arroyo un poco más tarde, donde la sacerdotisa se detiene.\n\n'Mullo es un dios bondadoso, pero nada se da gratuitamente' casi susurra, y de dentro de su capa saca una pequeña olla que te entrega. \"Bebe\" es todo lo que dice mientras se aleja cinco largos pasos de ti.\n\nBebes profundamente y pronto el mundo comienza a girar violentamente. \"Duerme\", escuchas la voz silenciosa de la sacerdotisa, pero el mundo se ha vuelto oscuro y se ha puesto patas arriba, y todo lo que ves es la luna baja arriba, fuera de tu alcance.\n\n"
 flavor_gaul.2.da:0 "Despiertas al día siguiente, solo. No recuerdas la noche pasada, pero un aroma peculiar llena tu tienda."
 flavor_gaul.2.a:0 "No me he sentido mejor en mucho tiempo."
 flavor_gaul.2.db:0 "Cuando despiertas por la mañana, te sientes como si hubieras bebido en honor a los dioses diez veces la noche anterior. La sacerdotisa no está a la vista."
 flavor_gaul.2.b:0 "¿Dónde se ha ido esa mujer?"
 flavor_gaul.2.dc:0 "Despiertas con picazón y sin memoria de la noche pasada. ¿Qué te pasó?"
 flavor_gaul.2.c:0 "Pica mucho, ¿dónde está la anciana?"
 flavor_gaul.2.daf:0 "Despiertas al sonido del arroyo al día siguiente, con un recipiente roto en la mano. Te levantas y te sientes mareado, pero de alguna manera tu ánimo se ha levantado."
 flavor_gaul.2.af:0 "Me siento extrañamente bien."
 flavor_gaul.2.dbf:0 "Despiertas con solo un vago recuerdo del día anterior. La anciana está junto al arroyo, lavándose los pies, y se gira para saludarte con una sonrisa sin dientes."
 flavor_gaul.2.bf:0 "¿Cómo llegué aquí?"
 flavor_gaul.2.dcf:0 "Un fuerte ulular te despierta al día siguiente, y te encuentras en una playa rodeada de gaviotas. Sientes de inmediato un dolor punzante en el estómago y tienes que acostarte de nuevo."
 flavor_gaul.2.cf:0 "¿Qué había en ese tazón?"
 flavor_gaul.3.t:0 "El Oráculo de las Gallizenae"
 flavor_gaul.3.desc:0 "Los días pasan mientras acampas en la orilla, ansiosamente esperando el regreso de la vieja bruja. Una tarde, con la luna colgando baja y la niebla envolviendo las playas, aparece una luz sobre las oscuras aguas.\n\nPronto distingues una linterna naranja fijada en la proa de una pequeña embarcación, y una vez que llega a la orilla, la anciana se apresura hacia ti con una joven a su lado. La joven está vestida con una fina capa de lino fijada con un broche ornamental sobre su pecho.\n\n'Una sacerdotisa, como mi jefe ordenó' pronuncia la anciana con falsa reverencia. Mientras la anciana reúne a otros que portan antorchas en la playa, la sacerdotisa se acerca a ti. 'Buscas una audiencia con los dioses' dice en un tono solemne. Intentas hablar, pero ella te calla con un dedo blanco en tus labios.\n\n'Los dioses saben' dice, y te obliga a arrodillarte mientras las antorchas comienzan a danzar a tu alrededor en la oscuridad. La sacerdotisa empieza a cantar en un tono aterrador, primero hablando claramente, luego en lenguas, mientras las mujeres y hombres que rodean a los dos murmuran y bailan, los fuegos girando en la oscuridad. La sacerdotisa ahora tiembla, luego se retuerce como si una fuerza sobrenatural estuviera sobre ella, y sus cánticos se rompen en gritos de terror y reverencia por igual.\n\nDe repente, los fuegos se detienen en silencio, y la doncella se derrumba ante ti, empapada en sudor. Temblorosa, se arrastra lentamente hacia ti, y la joven habla."
 flavor_gaul.3.descf:0 "Al día siguiente te tumbarás en una arboleda en el centro de la isla. La luna proyecta sombras oscuras sobre la arboleda y en su centro se encuentra una gran piedra tallada. Lo rodean nueve figuras esbeltas y envueltas en capas, cada una susurrando a una entidad invisible, pero cada susurro parece tener la fuerza de diez. \n\nJuntas, las voces son una cacofonía de murmullos en lugar de las voces suaves de las nueve doncellas presentes. Una de las criadas se alerta por tu presencia y se acerca a ti. 'Mi señora solicita la guía de los dioses' dice la mujer encorvada con un intento de hacer una reverencia, pero ha vuelto a ser la misma antigua y débil persona.\n\n'Quiero saber qué tienen los dioses reservados para mí' aclaras, pero la sacerdotisa ya te agarró la mano y comenzó a moverse hacia la piedra. Los otros ocho se dispersan en el bosque oscuro a medida que te acercas, y el que queda te pide que te arrodilles ante la piedra. \n\nElla toma un cuenco de madera, lo levanta hacia la luna y comienza a cantar. El canto cambia de intensidad, pero permaneces arrodillado, hasta que la sacerdotisa se detiene de repente y el contenido del cuenco se vierte sobre ti. Hueles a hierro y la doncella se arrodilla ante ti, coloca sus manos alrededor de tu oreja y habla en voz baja."
 flavor_gaul.3.a:0 "Has honrado a los dioses, ellos iluminarán tu camino."
 flavor_gaul.3.b:0 "Espera lo inesperado, el futuro es difícil de adivinar."
 flavor_gaul.3.c:0 "Ten miedo, porque los dioses ven mala suerte en tu camino."
 flavor_gaul.4.desc:0 "Los días pasan contigo acampado en la orilla, esperando ansiosamente el regreso de la vieja bruja. Una tarde, con la luna baja y la niebla ondeando sobre las playas, aparece una luz sobre las aguas oscuras.\n\nPronto distingues una linterna naranja fijada a la proa de un pequeño bote, y una vez varada, la anciana se apresura hacia ti con una joven doncella a cuestas. La doncella está vestida con una fina capa de lino sujeta con un broche adornado sobre su pecho.\n\nA pesar de estallar en una risa histérica, la anciana logra hablar. 'Los mares me parecen hermosos, ¡pero qué sabe esa vieja!' Riéndose, te deja con la joven. '¿Buscas la guía de Toutatis?' pregunta, antes de alejarse de ti hacia el mar sin esperar respuesta.\n\nExtiende su mano hacia ti y tú la agarras con incertidumbre. Ella te arrastra al agua fría y su canto tembloroso es todo lo que puedes escuchar por encima del ruido de las olas que te envuelven. Sostienes con fuerza la mano de la sacerdotisa, temiendo que la oleada la arrastre al mar.\n\nLas olas frías ahora están sumergiendo su cabeza dorada, pero ella sigue adelante mientras tú la sigues. Lo último que ves son las oscuras aguas del frío mar, y lo último que oyes es una respuesta profunda y rugiente desde debajo del mar.\n\n"
 flavor_gaul.4.descf:0 "Al día siguiente te tumbarás en una arboleda en el centro de la isla. La luna proyecta sombras oscuras sobre la arboleda y en su centro se encuentra una gran piedra tallada. Lo rodean nueve figuras esbeltas y envueltas en capas, cada una susurrando a una entidad invisible, pero cada susurro parece tener la fuerza de diez. \n\nJuntas, las voces son una cacofonía de murmullos en lugar de las voces suaves de las nueve doncellas presentes. Una de las doncellas es alertada por tu presencia y se acerca a ti.\n\n'Mi señora busca el consejo de-' comenzó la anciana, pero la sacerdotisa la interrumpe. 'Toutatis. Sí, lo sabemos. La anciana se ríe y te lanza una mirada extraña mientras abandona la arboleda.\n\nLa sacerdotisa te insta a que la sigas al bosque y caminas en silencio. Cuando sales a la orilla, la luna todavía está baja y el sol aún no ha salido. \"Toutatis requiere su prueba\", dice solemnemente y toma tu mano. \n\nContigo a cuestas, ella camina hacia las frías y negras olas y comienza a cantar un himno divino. Te preocupa que la oleada los arrastre a ambos y nunca más los vuelvas a ver, pero la sacerdotisa continúa sin cesar.\n\nMientras las olas envuelven tus cabezas, aprietas el agarre y solo puedes escuchar el canto débilmente sobre el ruido del océano. Lo último que ves son las oscuras aguas del frío mar superándote, y lo último que escuchas es una respuesta profunda y rugiente desde debajo del mar.\n\n"
 flavor_gaul.4.da:0 "Despiertas en la playa bañada por el sol, tosiendo violentamente con un dolor ardiente en el pecho. Sobre ti se encuentra la anciana, aparentemente habiéndote salvado de las profundidades. Te sonríe sin dientes."
 flavor_gaul.4.a:0 "Odio a esa anciana."
 flavor_gaul.4.db:0 "La sacerdotisa te despierta, sonriendo débilmente mientras el sol parece encender su cabello dorado. 'Morideus Toutatis' dice suavemente mientras te quita la arena del pecho."
 flavor_gaul.4.b:0 "¡El viento del dios me favorece!"
 flavor_gaul.4.dc:0 "De repente, abrumado por el más profundo miedo, arrastras a la sacerdotisa de vuelta hacia la tierra firme a pesar de sus protestas. Una vez a salvo en la playa, ella te mira vacíamente."
 flavor_gaul.4.c:0 "¿Qué estaba haciendo ella?!"
 flavor_gaul.5.desc:0 "Los días pasan con el campamento en la orilla, esperando ansiosamente el regreso de la vieja bruja. Una noche, con la luna baja y la niebla cubriendo las playas, aparece una luz sobre las aguas oscuras.\n\nPronto distingues un farol naranja fijado a la proa de un pequeño bote, y cuando llega a la orilla, la bruja corre hacia ti con una joven doncella a su lado. La doncella está vestida con una fina capa de lino, sujeta con un broche ornamentado sobre su pecho. 'Aquí está quien necesita una lanza', dice la vieja bruja alegremente, señalando tus regiones inferiores con una sonrisa aterradora que divide su rostro arrugado.\n\nTemblando, te giras hacia la sacerdotisa que se aproxima lentamente. 'Smertrios requiere un sacrificio', murmura. 'Sabes lo que necesita', continúa, y tú lo sabes. Sacas tu espada y le extiendes la empuñadura. Ella la toma, coloca el frío hierro sobre tu mano y comienza a cantar mientras juega con la espada.\n\nEl canto es suave al principio, pero crece en intensidad a medida que corta tu mano, la sangre empapando la arena abajo. Te sientes débil, y cuando la sacerdotisa comienza a gritar, caes de rodillas mientras la oscuridad te envuelve.\n\n"
 flavor_gaul.5.descf:0 "Al día siguiente, yaces en un claro en el centro de la isla. La luna proyecta sombras oscuras sobre el claro, y en su corazón se encuentra una gran piedra tallada. Nueve figuras esbeltas con capas rodean la piedra, cada una susurrando a una entidad invisible, pero cada susurro parece tener la fuerza de diez.\n\nJuntas, las voces eran una cacofonía de murmullos en lugar de las suaves voces de las nueve doncellas presentes. Una de las doncellas se alerta por tu presencia y se acerca a ti. 'Sacerdotisa, nuestra señora desea la ayuda de Smertrios', croa la anciana.\n\n'Y él requerirá un sacrificio', responde la doncella antes de mirar a la anciana. 'Déjanos', dice, no sin amabilidad, y la anciana se aleja rápidamente. Te unes a la sacerdotisa en la piedra del claro, y las otras ocho ya se han marchado.\n\nLa sacerdotisa desabrocha un puñal de su cinturón y coloca la hoja en tu mano, mientras te mira a los ojos. Comienza a cantar, y poco a poco el puñal corta tu carne, dejando caer sangre sobre la hierba.\n\nEl canto de la sacerdotisa se intensifica a medida que corta más profundo, y en el clímax, está gritando con aparente éxtasis mientras el dolor en tu mano se vuelve insoportable. Tus ojos se oscurecen y te desplomas de rodillas mientras las sombras te envuelven.\n\n"
 flavor_gaul.5.da:0 "Resistes el dolor y la sacerdotisa te ayuda a levantarte. Con una voz ronca dice: 'Smertrios está complacido con tu valor', y te muestra la hoja roja, brillando bajo la luz de la luna."
 flavor_gaul.5.a:0 "Smertrios guiará mi mano."
 flavor_gaul.5.db:0 "Despiertas horas después, cuando la luz comienza en el este. La sacerdotisa está de pie sobre ti, inexpresiva. Cuando intentas sentarte, ella se aleja."
 flavor_gaul.5.b:0 "No me siento más fuerte."
 flavor_gaul.5.dc:0 "Despiertas al día siguiente, con un dolor punzante en la mano. Está manchada con tu sangre, y te sientes débil."
 flavor_gaul.5.c:0 "Esto no se ve nada bien."
 flavor_gaul.6.t:0 "La Liga Lugia - Una Propuesta Amistosa"
 flavor_gaul.6.desc:0 "Ahora que nos sentimos seguros en nuestras posesiones, se ha decidido que deberíamos buscar relaciones amistosas con las tribus vecinas, para garantizar la futura prosperidad de Boihaemia. Hay tribus al norte, los Vándalos, que serían buenos aliados. Quizás podamos enviar emisarios y determinar si hay interés en formar una liga. Hay fuerza en los números."
 flavor_gaul.6.a:0 "Envía a nuestros mejores diplomáticos y diles que sean generosos."
 flavor_gaul.7.t:0 "La Liga Lugia - Una Oferta Sugerente"
 flavor_gaul.7.desc:0 "Embajadores de Boihaemia han venido a nosotros con una oferta. El gobernante boihemio, [GetCountry('BOA').GetRuler.GetName], sugiere que nos unamos a una liga bajo su protección, ya que hay fuerza en los números.\n\nLa propuesta es indignante, pero quizás no tengamos otra opción. El estado perpetuo de conflicto e incertidumbre causado por las interminables luchas entre las tribus vándalas ha empobrecido enormemente a Vandalia, por lo que no tenemos ninguna posibilidad contra el poder boihemio."
 flavor_gaul.7.a:0 "Únete a la liga."
 flavor_gaul.7.b:0 "¡Defiende nuestra soberanía!"
 flavor_gaul.8.t:0 "La Liga Lugia - Respuestas"
 flavor_gaul.8.desc:0 "Hace poco enviamos emisarios por toda Vandalia. Su tarea era persuadir a tantos poderes locales como fuera posible de unirse a una liga bajo nuestra guía para garantizar su seguridad en estos tiempos turbulentos. Hoy, todos nuestros emisarios finalmente han regresado.\n\n"
 flavor_gaul.8.a:0 "Muy bien..."
 flavor_gaul.8.desc_1:0 "¡Un buen número de estados han aceptado!\n\n[GetCountry('BOA').GetRuler.GetPraenomen] está honrado y agradecido por la confianza que los Vándalos han puesto en [GetCountry('BOA').GetRuler.GetHerHim]. Nuestro gobernante proclama el nacimiento de la Liga Lugia, encargada de defender a los comerciantes de la Ruta del Ámbar bajo la benevolente y protectora mirada de [GetCountry('BOA').GetName]."
 flavor_gaul.8.desc_2:0 "Desafortunadamente, traen malas noticias; ningún país ha aceptado nuestra oferta.\n\nNo hay manera de razonar con ellos ahora."
 flavor_gaul.8.tt:0 "La tarea de la misión ha sido completada."
 flavor_gaul.8.tt1:0 "Ninguna tribu vándala acepta nuestra oferta."
 flavor_gaul.8.at:0 "[THIS.GetCountry.MakeScope.GetVariable('bohemian_league_counter_var').GetValue|0Y] estados vándalos han aceptado y se han unido como nuestro nuevo súbdito, el @[lugian_league_head_scope.GetFlag]! [lugian_league_head_scope.GetName]."
 flavor_gaul.9.t:0 "Una Federación Boia"
 flavor_gaul.9.desc:0 "Desde que nuestro pueblo puede recordar, hemos vagado a voluntad; aunque temporalmente echemos raíces, los Boii siempre han migrado a nuevas tierras cuando les conviene, así es como se han hecho las cosas. Este estado de cosas ha sido satisfactorio, pero se avecina un tiempo de cambio, y aunque algunos resisten los esfuerzos de centralización propuestos por [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], pronto cederán. Al unirnos en una tribu federada, los beneficios potenciales son muchos: todos lo veremos a su debido tiempo."
 flavor_gaul.9.a:0 "No olvidaré la confianza que han depositado en mí."

 flavor_gaul.10.t:0 "El Estandarte Boihemio"
 flavor_gaul.10.desc:0 "Una mañana, [ROOT.GetCountry.GetRuler.GetName] estaba desayunando [ROOT.GetCountry.GetRuler.GetHerHis] con un poco de carne fría, restos de la comida de anoche, cuando un asesor entró en la [ROOT.GetCountry.GetRuler.GetHerHis] habitación resoplando ruidosamente y prácticamente arrastrando detrás de ellos un pesado saco de arpillera. Haciendo un gesto con un hueso de conejo en [ROOT.GetCountry.GetRuler.GetHerHis] mano, [ROOT.GetCountry.GetRuler.GetFirstName] preguntó qué llevaban y, para [ROOT.GetCountry.GetRuler.GetHerHis] sorpresa, les ofrecieron un puñado de monedas de oro. \"Ah, ahora lo recuerdo\". [ROOT.GetCountry.GetRuler.GetFirstName] dijo entre mordiscos.\n\n'Hemos recibido el primer lote de monedas que usted mandó fabricar. Estos serán el nuevo estándar utilizado en todas nuestras tierras.'\n\nDando un largo golpe a la [ROOT.GetCountry.GetRuler.GetHerHis] taza, el [ROOT.GetCountry.GetRulerTitle] tomó una de las monedas y la levantó a la luz, donde el oro centelleaba como fuego, y fue inmediatamente golpeado por el temible rostro en el anverso."
 flavor_gaul.10.a:0 "Así es como me veo, ¿eh? No he visto una moneda más guapa."
 flavor_gaul.10.tt:0 "¡La tarea de la misión '#Y El estándar boihamiano#!' ya ha sido #G completada#!!"

 flavor_gaul.11.t:0 "El Gran Templo de Baemia"
 flavor_gaul.11.desc:0 "[ROOT.GetCountry.GetRuler.GetName] tiene edad suficiente para recordar cuando [GetProvince('(int32)3937').GetName] era un simple asentamiento, un lugar que no vale la pena mencionar en el interior de la capital, pero las cosas han cambiado bajo el liderazgo de [ROOT.GetCountry.GetRuler.GetHerHis]. Una verdadera ciudad no sólo ha reemplazado las destartaladas chozas y cobertizos que alguna vez salpicaron el paisaje boscoso, sino que se ha logrado un logro aún mayor; En el corazón de la nueva ciudad de Baemia se ha construido un #E Gran Templo#!, como nunca se ha visto tan al norte."
 flavor_gaul.11.a:0 "Finalmente, un lugar adecuado de culto, uno digno de los poderosos Boihaemios."
 flavor_gaul.11.tt:0 "¡La tarea de la misión '#Y El Gran Templo de Baemia#!' ya ha sido #G completada#!!"

 flavor_gaul.12.t:0 "Aplastando a los Germanos"
 flavor_gaul.12.desc:0 "Hemos recibido noticias de que nuestros antiguos enemigos, las despreciables tribus de los #E Quadi#! y #E Marcomanni#!, han sido completamente destruidos por nuestros hombres y están dispersos como perros en los bosques de sus antiguas patrias. Han quedado completamente arruinados y nunca más podrán cuestionar nuestra hegemonía; Este es un logro notable, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]."
 flavor_gaul.12.a:0 "No hemos terminado, solo estamos comenzando nuestro trabajo."
 flavor_gaul.12.tt:0 "¡La tarea de la misión '#Y Aplastar a los alemanes#!' ya ha sido #G completada#!!"

 flavor_gaul.13.t:0 "Destrucción Dacia"
 flavor_gaul.13.desc:0 "Antaño teníamos mucho que temer de los feroces #E dacios#!, y algunos de nuestra propia tribu se atrevían a decir que éramos inferiores a nuestros rivales orientales en todos los sentidos, especialmente en el aspecto militar. Mientras que [ROOT.GetCountry.GetRuler.GetName] se enfureció ante estas críticas, considerándolas ataques apenas disimulados contra el liderazgo [ROOT.GetCountry.GetRuler.GetHerHis], el [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] ha asegurado la victoria contra [ROOT.GetCountry.GetRuler.GetHerHis] enemigos una vez más, silenciando las lenguas de aquellos que cuestionan la autoridad de [ROOT.GetCountry.GetRuler.GetHerHis]. ¡Al final, el Dacian Falx no fue rival para la Boian Spear!"
 flavor_gaul.13.a:0 "Ya no tendremos que preocuparnos por los Dacios."
 flavor_gaul.13.tt:0 "¡La tarea de misión '#Y Destrucción daciana#!' ya ha sido #G completada#!!"

 flavor_gaul.14.t:0 "Migraciones Boihaemias"
 flavor_gaul.14.desc:0 "Hemos enviado a algunos de nuestros mejores hombres al norte con el propósito expreso de encontrar territorios que sean adecuados para nuestra expansión, y sus informes iniciales son prometedores. Nuestros exploradores avanzaron a través de vastas extensiones de tierra, deteniéndose solo en las estribaciones de las montañas, y regresaron con historias de bosques prístinos, campos herbosos que serían perfectos para la cría de ganado, e incluso grandes depósitos de arcilla están presentes; podríamos comenzar a producir vasijas de barro. Por supuesto, habrá costos asociados con este esfuerzo de colonización, pero ¿acaso no te preparaste para eso de antemano?"
 flavor_gaul.14.a:0 "Tenemos el dinero para financiar esto"
 flavor_gaul.14.b:0 "Nuestras finanzas están ajustadas, pero sí tenemos la mano de obra"
 flavor_gaul.14.c:0 "Pensándolo bien, he cambiado de opinión - diles que se detengan"
 flavor_gaul.14.tt:0 "¡La tarea de la misión '#Y Migraciones de Boihaemian#!' ahora ha sido #G completada#!!"

 flavor_gaul.15.t:0 "Las Tierras Entre Montañas"
 flavor_gaul.15.desc:0 "Mi jefe, nuestro pueblo está floreciendo en las provincias recién colonizadas a las que tan sabiamente nos has guiado, y las historias de los campos fértiles y los bosques vírgenes están inspirando a más de nuestra gente a dejar sus hogares y asentarse lejos. Hay reinos entre las montañas que aún no hemos colonizado, pero deberíamos redoblar nuestros esfuerzos y asegurarlos de inmediato - ¿por qué, podrías preguntar? Hay buena caza en esos lugares, con muchos animales salvajes para atrapar por sus pieles, y la piedra y el glasto abundan en estas regiones."
 flavor_gaul.15.a:0 "Los costos son insignificantes - ordeno que se haga"
 flavor_gaul.15.b:0 "Estaremos un poco dispersos, pero vale la pena el contratiempo temporal"
 flavor_gaul.15.c:0 "La prisa es mala consejera - conformémonos con lo que tenemos"

 flavor_gaul.16.t:0 "Cuenca Boihaemia"
 flavor_gaul.16.desc:0 "Ahora que hemos asentado las tierras al norte, viene a la mente un viejo adagio; cuanto más tienes, más problemas parecen haber. Estamos seguros de nuestras habilidades para defender nuestra patria contra cualquier desafío, sin embargo, en comparación con nuestras otras posesiones, nuestro flanco oriental está vergonzosamente expuesto. No hay duda de que las tribus del sur, una vez que se enteren de nuestro crecimiento, podrían intentar acercarse a nosotros, con la esperanza de detener nuestra expansión. Dicho esto, deberíamos considerar expandirnos hacia el este; algunos de los ríos locales serían un buen límite natural. ¿Qué opinas?"
 flavor_gaul.16.a:0 "Tenemos la voluntad y la mano de obra - será como dices"
 flavor_gaul.16.b:0 "Envía colonos inmediatamente, sin importar el costo"
 flavor_gaul.16.c:0 "Todo a su debido tiempo...el momento no es ahora"

 flavor_gaul.17.t:0 "La Cuenca Boihaemia"
 flavor_gaul.17.desc:0 "Oh, Jefe, necesitamos tu permiso para una nueva iniciativa. Parece que tenemos un pequeño problema de hacinamiento, pero afortunadamente, es algo fácil de solucionar. Simplemente, nuestro pueblo clama por nuevas tierras para habitar; nuestros números crecen diariamente, y los pastizales que actualmente ocupamos no serán suficientes para sostener nuestro futuro crecimiento. Y sin embargo, estamos rodeados de tierras atractivas, con buenos campos y abundantes recursos naturales para tomar, y si das la orden, enviaremos partidas de exploración. Si encuentran territorios satisfactorios para nuestras necesidades, serás el primero en saberlo."
 flavor_gaul.17.a:0 "Esto me agrada - doy mi bendición"

 flavor_gaul.18.t:0 "Más allá de las Montañas"
 flavor_gaul.18.desc:0 "Jefe, cuando te cuente esta noticia, sin duda estarás tan emocionado como nosotros. Es cierto que nos hemos extendido por todas las tierras que ahora controlas, pero hemos encontrado aún más territorios que vale la pena tomar. Justo al norte de las Montañas Sudetes, las provincias están llenas de vida silvestre, y las canteras de piedra de Gothinia prácticamente suplican ser vaciadas. Honestamente, nuestra gente ya está allí... solo necesitas hacerlo oficial."
 flavor_gaul.18.a:0 "Esto es excelente - haz que suceda"
 flavor_gaul.18.b:0 "¿Por qué me molestas con esto? ¿No he hecho ya lo suficiente?"

 flavor_gaul.19.t:0 "La Mancomunidad Boihaemia"
 flavor_gaul.19.desc:0 "¡Por fin ha llegado la hora de nuestra victoria completa y total! Gracias a [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], quien ha guiado nuestro camino en cada paso del camino, hemos logrado muchas cosas; la expansión de nuestros territorios, el crecimiento de nuestros ingresos comerciales. Nunca antes en nuestra historia los #E Boii#! habían tenido tanto éxito, nunca habíamos estado tan altos como ahora; ¡Que los dioses continúen bendiciendo nuestros esfuerzos!"
 flavor_gaul.19.a:0 "¡Nos esperan grandes tiempos!"

 flavor_gaul.199.t:0 "El Ascenso de Boihaemia"
 flavor_gaul.199.desc:0 "Temprano esta mañana, tuvo lugar una simple y modesta ceremonia en [ROOT.GetCountry.GetCapital.GetName], y aunque el sol apenas había salido en el horizonte, había cientos de asistentes presentes para la trascendental ocasión. [ROOT.GetCountry.GetRuler.GetName] había convocado a todos los #E Ancianos Tribales#! para reunirse en la capital, ya que el [ROOT.GetCountry.GetRulerTitle] no deseaba atraer atención innecesaria hacia [ROOT.GetCountry.GetRuler.GetHerHim] mismo. La razón de esta reunión era simple; ahora que nos hemos convertido en una poderosa nación, el pueblo clama por una nueva forma de gobierno.\n\nGracias al estatus preeminente de [ROOT.GetCountry.GetRuler.GetFirstName] en nuestra nación, la elección recae en última instancia en [ROOT.GetCountry.GetRuler.GetHerHim]."
 flavor_gaul.199.a:0 "Prometo ejercer mi autoridad como Monarca de manera responsable"
 flavor_gaul.199.b:0 "Todo el poder en [ROOT.GetCountry.GetName] reside en el pueblo"
 BOHEMIAN_REPUBLIC_FINAL_NAME:0 "República Boihaemia"


 flavor_gaul.20.t:0 "Las Costas de Cantabria"
 flavor_gaul.20.desc:0 "Esta mañana, recibimos la noticia de que las primeras importaciones de la provincia Cantabria, nuestra última conquista, llegaron a [SCOPE.GetRootScope.GetCountry.GetCapital.GetName], causando gran conmoción en los mercados mientras todos se apresuran a comprar lo que pueden. Mientras que las gemas preciosas de esta región solo son vendidas a los más ricos, el fino cuero cántabro es deseado por todos, ricos y pobres, sin duda debido a su particular finura. \n\nMientras reflexionas sobre el alboroto en las calles, te recuerdan que hay otros asuntos relacionados con Cantabria que requieren tu atención. ¿Qué le depara el futuro a esta provincia?"
 flavor_gaul.20.a:0 "Mantengamos a los cántabros bajo control"
 flavor_gaul.20.a.tt:0 "Liberaremos la provincia en cuestión como un estado cliente."
 flavor_gaul.20.b:0 "Nuestros territorios centrales se expanden y prosperan bajo nuestro dominio"
 flavor_gaul.20.b.tt:0 "Conservaremos nuestras tierras y aceleraremos la asimilación de los recién subyugados."
 flavor_gaul.21.t:0 "El Futuro de Lusitania"
 flavor_gaul.21.desc:0 "En un día particularmente ocupado, lleno de reuniones con terratenientes locales y sus asistentes que ocuparon la mayor parte de la mañana, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] fue recordado por un asesor sobre asuntos alejados de las tierras interiores de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]; la provincia de Lusitania. Después de posponer el asunto, sin duda debido a nuestra apretada agenda, debemos tomar una decisión sobre cómo se administrará este territorio."
 flavor_gaul.21.a:0 "No todas las provincias son dignas de considerarse nuestra patria"
 flavor_gaul.21.a.tt:0 "Liberaremos la provincia en cuestión como un estado cliente."
 flavor_gaul.21.b:0 "Los lusitanos adoptarán eventualmente nuestras costumbres"
 flavor_gaul.21.b.tt:0 "Mantendremos nuestras tierras y aceleraremos la asimilación de los recién sometidos."
 flavor_gaul.22.t:0 "Mons Calpe"
 flavor_gaul.22.desc:0 "Nuestros ejércitos victoriosos han conquistado extensas regiones, convirtiendo en cenizas y miseria a aquellas ciudades lo suficientemente necias como para resistir. No solo hemos dominado a las tribus que nos rodean, sino que también hemos enfrentado a poderes mayores y mantenido nuestra posición, demostrando que no somos bárbaros sino el igual de cualquier otro. Ahora, en este breve momento de respiro, mientras celebramos nuestros éxitos, decidamos el futuro de algunas de nuestras posesiones más nuevas."
 flavor_gaul.22.a:0 "La propiedad absoluta es tentadora, pero es una cuestión de nuestra reputación"
 flavor_gaul.22.a.tt:0 "Liberaremos la provincia en cuestión como un estado cliente."
 flavor_gaul.22.b:0 "Al absorber estas ciudades antiguas, nuestra leyenda crece"
 flavor_gaul.22.b.tt:0 "Mantendremos nuestras tierras y aceleraremos la asimilación de los recién sometidos."
 flavor_gaul.23.t:0 "Decisiones Frisias"
 flavor_gaul.23.desc:0 "Mientras los ancianos se reunían para un consejo hoy, uno de los temas más urgentes en la agenda era ciertamente el asunto de Frisia, y específicamente lo que pensamos hacer con la región ahora que hemos establecido el control total."
 flavor_gaul.23.a:0 "Tener otro estado cliente se ajusta a nuestros intereses"
 flavor_gaul.23.a.tt:0 "Liberaremos la provincia en cuestión como un estado cliente."
 flavor_gaul.23.b:0 "Mantendremos este territorio como propio"
 flavor_gaul.23.b.tt:0 "Mantendremos nuestras tierras y aceleraremos la asimilación de los recién sometidos."
 flavor_gaul.24.t:0 "Las Lejanas Orcadas"
 flavor_gaul.24.desc:0 "Cuando reflexionamos sobre nuestros humildes orígenes y los comparamos con nuestras circunstancias actuales, nos sentimos humildes ante las vastas responsabilidades que los dioses nos han otorgado; ¿quién podría haber previsto cuán expansivo se volvería nuestro dominio? Incluso las tierras lejanas de los mitos de los marineros se han convertido en una realidad que abrazamos con entusiasmo. Ahora debemos tomar una decisión; ¿absorbemos estas islas distantes o creamos otro estado cliente?"
 flavor_gaul.24.a:0 "Servirán a nuestros intereses pero conservarán ciertos privilegios"
 flavor_gaul.24.a.tt:0 "Liberaremos la provincia en cuestión como un estado cliente."
 flavor_gaul.24.b:0 "Las Orcadas siempre serán parte de nuestra patria"
 flavor_gaul.24.b.tt:0 "Mantendremos nuestras tierras y aceleraremos la asimilación de los recién sometidos."
 flavor_gaul.25.t:0 "Los Señores del Atlántico"
 flavor_gaul.25.desc:0 "Hace unas semanas, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ordenó a sus asesores reunirse en [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] para una reunión importante. Cuando llegó el día señalado, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] se puso solemnemente ante la asamblea reunida y habló con valentía, recordando nuestra reciente historia y los éxitos inimaginables con los que nuestro pueblo ha sido bendecido. Terminando su discurso con 'El día ha llegado en que el mundo debe reconocer que somos los Señores del Atlántico', la sala estalló en vítores descontrolados. \n\nLevantando una mano y exigiendo silencio, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] se preguntó en voz alta si deberíamos cambiar nuestro sistema de gobierno para reflejar nuestro cambio de circunstancias."
 flavor_gaul.25.a:0 "Nuestra riqueza nos ha llevado a estas alturas y sigue siendo nuestra prioridad"
 flavor_gaul.25.b:0 "¡Proclamemos al mundo que nuestra era ha llegado!"
 flavor_gaul.26.t:0 "Un Triunfo Romano"
 flavor_gaul.26.desc:0 "Hemos humillado a uno de los grandes poderes de Italia, los romanos belicistas, al expulsar a estos tiranos de su propia capital - seguramente una amarga ironía para ellos, ya que lo que han hecho despiadadamente a tantos otros les ha sido hecho a ellos. Las historias sobre el Asedio de Roma se han extendido por todo nuestro ejército, con la destreza de nuestros hombres alcanzando un estatus casi mítico. Incluso ahora, en tribunales distantes fuera de nuestras esferas de influencia, reyes nerviosos reúnen a sus asesores, preguntándose ansiosos sobre la fuerza de nuestros ejércitos y flotas; ¿somos un peligro? \n\nBien - que todos nos teman."
 flavor_gaul.26.a:0 "¡Celebremos a los soldados! Ellos fueron los que hicieron esto"
 flavor_gaul.27.t:0 "Un Gusto por el Lujo"
 flavor_gaul.27.desc:0 "Aunque nuestros enredos extranjeros han sido sin duda un beneficio para el estado, hay otros cambios, a veces imperceptibles, que acompañan a cualquier cosa nueva; así ha sido y siempre será. \n\nPara ser francos, nuestra gente se está acostumbrando a las cosas más finas de la vida, importando bienes lujosos de los Reyes del Este y gastando una cantidad asombrosa de monedas para pagar estos artículos. Día tras día, nuestros puertos están llenos de comerciantes, ofreciendo cargamentos de seda y aromáticos de desiertos que se encuentran al final del mundo, y nuestra gente simplemente no puede tener suficiente. Pero ¿quiénes son estos extranjeros, exactamente, que nos traen cosas extrañas como 'azúcar'? Nadie ha oído hablar de tales cosas. Con la esperanza de entender mejor estas regiones distantes y tal vez establecer más conexiones comerciales en el proceso, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ha decidido enviar un grupo de aventureros hacia el este, pidiéndoles que descubran todo lo que puedan."
 flavor_gaul.27.a:0 "Me pregunto qué encontrarán estos aventureros..."
 flavor_gaul.28.t:0 "Influencias Cosmopolitas"
 flavor_gaul.28.desc:0 "Hace semanas, se ordenó que un grupo de aventureros, guerreros robustos seleccionados de nuestros reclutas, se dirigieran al este en una misión de reconocimiento, ¡y finalmente han regresado! Ordenando que los hombres sean llevados de inmediato, exclamando que tendrán la oportunidad de descansar después de presentar sus informes, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] bajó corriendo a encontrarlos, ansioso por escuchar lo que habían aprendido. \n\nPermitiendo que los soldados exhaustos se reclinen, se sirve vino y comienzan a fluir las historias. Nuestros hombres navegaron hacia el este, siguiendo las aguas del Mediterráneo hasta que se acabaron, vagando a lo largo de las costas y deteniéndose en cada ciudad importante en el camino. Con voces elevándose en emoción, se dice que incluso visitaron la antigua tierra de [GetProvince('(int32)7691').GetArea.GetRegion.GetName]. Nuestros hombres hablan de las hospitalidades que se les brindaron, diciendo que hay muchas maravillas por ver en estas tierras distantes, pero que guerras graves han asolado la región durante siglos; la disputa de los reyes mientras destruyen la paz por sus propias ambiciones. \n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] pregunta si los hombres han regresado con algo, y sonríe al escuchar que hay un verdadero tesoro de información en las bodegas de nuestros barcos; no solo tenemos excelentes mapas de la región, sino que nuestros aventureros tuvieron la previsión de comprar tantos pergaminos y textos como pudieron encontrar - textos filosóficos, tratados médicos, historias y genealogías. Nuestra gente valora la sabiduría, y aprenderemos mucho de los escritos de los extranjeros."
 flavor_gaul.28.a:0 "¡Un brindis por su exitosa misión!"
 flavor_gaul.29.t:0 "Una Tierra Agradable"
 flavor_gaul.29.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], ahora que hemos derrotado a nuestros enemigos, debemos tomar una decisión. Como saben, es nuestra costumbre construir una ciudad en territorios recién conquistados, ya que consideramos que es lo mejor para la administración local. ¿Dónde comenzaremos la construcción ahora? He oído que hay múltiples ubicaciones disponibles para nosotros, todas buenas candidatas para nuestros futuros planes."
 flavor_gaul.30.t:0 "Expansión del Sur"
 flavor_gaul.30.desc:0 "Las montañas y colinas al sur no fueron un impedimento para nuestras fuerzas, que están acostumbradas a atravesar terrenos difíciles; si nuestros enemigos pensaron que podían ocultarse de nosotros en los bosques y laderas, estaban muy equivocados. Ahora que hemos sometido la región, debemos elegir un lugar para construir una ciudad; habiendo luchado por reclamar estas tierras para nosotros, no las dejaremos nunca más."
 flavor_gaul.31.t:0 "Ganancias Genovesas"
 flavor_gaul.31.desc:0 "Hemos conquistado la costa de Génova, extendiendo nuestras posesiones a las aguas del Sinus Genuensis, lo cual es un motivo de orgullo para [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. Una vez, nuestro pueblo se mantenía en los costados de las montañas, pero ahora, descendemos como un río hacia el mar. Hay mucho que celebrar en [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] esta noche, pero primero debemos tomar decisiones sobre qué hacer con nuestras nuevas tierras."
 flavor_gaul.32.t:0 "Victoria Sobre Veneto"
 flavor_gaul.32.desc:0 "Caballos, aceitunas, pescado, sal; las tierras que los venecianos una vez habitaron están realmente bendecidas por los dioses, llenas de recursos que tomaremos con gusto. No es de extrañar que hayan luchado tan ferozmente, ¿quién querría renunciar a esta riqueza natural? Afortunadamente, no pudieron evitar nuestra expansión...ahora, se presenta una nueva pregunta. Debemos elegir un lugar para construir, con el fin de consolidar nuestro poder en esta región."
 flavor_gaul.33.t:0 "Fin de los Etruscos"
 flavor_gaul.33.desc:0 "Durante muchos años, hemos conocido a los etruscos; sus ciudades fortificadas, llenas de riquezas como las que nunca hemos visto, han tentado a nuestros soldados, que deseaban nada más que escalar sus formidables murallas y apoderarse de ellas. Nunca se nos ha negado lo que nuestros hombres de combate desean, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] dio la orden, enviando a nuestros soldados al corazón de Etruria. Todo lo que se les pidió, lo lograron, y ahora toda nuestra nación celebra. Ahora tenemos la agradable tarea de determinar el futuro de esta área."
 flavor_gaul.34.t:0 "El Futuro de Córcega"
 flavor_gaul.34.desc:0 "Hoy es un gran día para nuestro pueblo, pues hemos expandido hasta la isla de Córcega y la hemos tomado para nosotros. ¡Cuán orgullosos estarían nuestros ancestros de nosotros! Ver a sus orgullosos descendientes, surcando las olas, conquistando islas lejanas, los indiscutidos Maestros de la Tierra y el Mar...ciertamente bendecirían nuestros esfuerzos. Vamos, decidamos qué hacer con Córcega; ¿qué opinas, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]?"
 flavor_gaul.35.t:0 "Cenizas Romanas"
 flavor_gaul.35.desc:0 "Nuestra última guerra ha llegado a su fin, y la noticia de nuestra victoria se ha extendido lejos y ancho, viajando mucho más allá de las costas de [GetProvince('(int32)4').GetArea.GetRegion.GetName]. Hay quienes no pueden creer que hayamos derrotado a los romanos, alegando que una República tan poderosa nunca caería ante simples 'bárbaros'. \n\nA todos los escépticos, extendemos una invitación; vengan a la ciudad a orillas del Tíber y vean quién controla las puertas de la ciudad. Ahora que hemos reducido a cenizas la República Romana, tenemos decisiones que tomar."
 flavor_gaul.35.a:0 "La ciudad de Rómulo."
 flavor_gaul.35.b:0 "Capua nos viene bien."
 flavor_gaul.35.c:0 "La antigua ciudad de Neápolis podría necesitar nuevos habitantes."
 flavor_gaul.35.d:0 "Ostia es el lugar."
 flavor_gaul.35.e:0 "¿Buca, eh? Me gusta ese nombre."
 flavor_gaul.36.t:0 "Magna Grecia Se Rinde"
 flavor_gaul.36.desc:0 "A medida que hemos conquistado a lo largo de [GetProvince('(int32)4').GetArea.GetRegion.GetName], hemos encontrado muchos pueblos extraños, pero ahora que hemos llegado al final de la península, ponemos nuestros ojos en ciudades antiguas, erigidas mucho antes de que nuestro pueblo cruzara los Alpes. \n\nA pesar de su supuesta superioridad, hemos masacrado a los habitantes de las ciudades, destruyendo su poder y reemplazándolo con el nuestro. [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ha despreciado durante mucho tiempo las suaves ciudades de Magna Grecia, sabiendo que nos consideran simples bárbaros; qué día tan amargo debe ser para ellos. Ahora que controlamos la región, decidamos su futuro."
 flavor_gaul.37.t:0 "Mediolanum Surge"
 flavor_gaul.37.desc:0 "Aunque tomó una considerable cantidad de recursos, hemos recibido noticias de que nuestro trabajo en la provincia de [GetProvince('(int32)3571').GetName] está, al fin, completo; nuestra ciudad ha estado terminada durante un tiempo y hay una cantidad respetable de personas viviendo allí, con la esperanza de que vengan muchas más. [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ha enfatizado durante mucho tiempo la importancia de esta región, previendo un tiempo en que nuestra ciudad dominará a todas las demás. El tiempo dirá si esta profecía se cumple."
 flavor_gaul.37.a:0 "Estamos orgullosos de lo que hemos logrado aquí."
 flavor_gaul.38.t:0 "Cultura Italiana"
 flavor_gaul.38.desc:0 "Llevando un rítmico a [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] los labios, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] prueba algo del vino que se ofrece. —¿Dices que estas uvas se cultivan cerca del monte Falernus? Creo que ya había oído hablar de este tipo de vino antes. \n\n'Sí, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]. El monte Falernus no está muy lejos de aquí... ¿Lo encuentras de tu agrado? La asistente, una bailarina de veinte veranos, baja la mirada recatadamente mientras da un paso atrás. \n\nRiendo, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] drena el cuerno [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] en un instante, haciendo un gesto para que lo vuelvan a llenar. \"Me siento partidario del vino Rhaetian, que es el mejor que he tenido el placer de probar hasta ahora, pero hay cosas sobre la cultura aquí que me están convenciendo\". \n\n'Me gusta la bebida...', susurra para sí la empleada mientras [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] vacía otra taza."
 flavor_gaul.38.a:0 "Nuestros modos son mejores, pero podríamos aprender una cosa o dos de los italianos"
 flavor_gaul.39.t:0 "Una República Aristocrática"
 flavor_gaul.39.desc:0 "'Y llamaré su atención, [ROOT.GetCountry.GetRuler.GetFirstName], sobre el hecho de que nuestra forma actual de gobierno es insostenible; lo que alguna vez funcionó para nuestros antepasados no puede funcionar para sus nietos, que son los Maestros de mucho más que las montañas. Sin embargo, no se presenta una solución fácil para nosotros.' \n\nEl aire es sofocante y caliente donde se está reuniendo el Consejo; una realidad desagradable a la que los nobles reunidos dentro se han acostumbrado. Hay un palpable alivio en la sala cuando [ROOT.GetCountry.GetRuler.GetName] mueve una mano, señalando que el debate ha terminado. \n\n'Quizás ha llegado el momento de un cambio.' Levantándose de [ROOT.GetCountry.GetRuler.GetHerHis] asiento, [ROOT.GetCountry.GetRuler.GetFirstName] dice en voz baja 'Podríamos emular las formas de aquellos que nos rodean...'"
 flavor_gaul.39.a:0 "La nobleza continuará guiándonos hacia la gloria"
 flavor_gaul.40.t:0 "La Seguridad es Rara en Este Mundo"
 flavor_gaul.40.desc:0 "No solo hemos concluido nuestras iniciativas de construcción en las montañas, fortaleciendo nuestras fortificaciones ancestrales con todo el poder de nuestro poderoso estado detrás de ellas, sino que también hemos reforzado nuestras relaciones con la verdadera fuente de defensa de nuestra nación: el pueblo. Todas las familias líderes creen en la visión que [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ha establecido para nuestro país, y nadie cuestiona los planes futuros de [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] en este momento. Todo está seguro; nadie desafía nuestro dominio."
 flavor_gaul.40.a:0 "Protegeremos a quienes creen en nosotros"
 flavor_gaul.41.t:0 "Todos los Caminos Llevan a Mediolanum"
 flavor_gaul.41.desc:0 "Cuando vimos por primera vez [GetProvince('(int32)3571').GetName], era apenas una fortificación, una torre medio rota en medio de una hermosa llanura. A lo largo de los años, nuestros gobernantes han hecho mucho por la ciudad, y no hay ciudades en [GetProvince('(int32)4').GetArea.GetRegion.GetName] que puedan rivalizar con su elegancia y encanto. No importa de dónde se viaje - ya sea desde Roma, Kroton, Neápolis o cualquier otra ciudad - lo que dicen es cierto; todos los caminos llevan a [GetProvince('(int32)3571').GetName], ya que no hay otra razón para dejar el hogar salvo para ver esta ciudad de sueños."
 flavor_gaul.41.a:0 "Se nos llenan los ojos de lágrimas al ver Mediolanum, el hogar de nuestro pueblo"
 flavor_gaul.42.t:0 "Invitados de los Gaesati"
 flavor_gaul.42.desc:0 "Aunque el precio que se exige es alto - algunos dirían que es exorbitante - ¿quién puede ponerle valor a la experiencia? Aquellos que desean las mejores cosas de la vida a menudo deben pagar primas, y este asunto con los Gaesati no es diferente de otros.\n\nCon estos adagios en mente, [ROOT.GetCountry.GetRuler.GetName] ha accedido a pagar las cuatrocientas monedas requeridas para contratar a un asesor de los Gaesati, los feroces mercenarios galos de las montañas. Aunque el precio es alto, tenemos grandes expectativas de nuestro nuevo huésped, creyendo que la sabiduría impartida a nuestras tropas valdrá bien la pena el costo."
 flavor_gaul.42.a:0 "Necesitamos toda la ayuda que podamos obtener... el dinero va y viene"
 flavor_gaul.43.t:0 "Los Costos Asociados"
 flavor_gaul.43.desc:0 "Como bien sabes, [ROOT.GetCountry.GetRuler.GetName], tu último mandato para convocar colonos no puede hacerse gratis, y enviar viajeros por toda la tierra será costoso. Tenemos caballos que comprar para nuestros emisarios, y hombres y caballos necesitarán estar adecuadamente equipados...hay una gran cantidad de costos asociados con los que debemos lidiar, desafortunadamente."
 flavor_gaul.43.a:0 "Esto es todo lo que podemos permitirnos ahora mismo"
 flavor_gaul.43.b:0 "Tenemos más que podríamos dar"
 flavor_gaul.44.t:0 "Colonos Lepontios"
 flavor_gaul.44.desc:0 "Hace unas semanas, [ROOT.GetCountry.GetRuler.GetName] tomó la decisión de llamar a colonos para que vengan e inhabiten nuestros territorios menos poblados, enviando un mensaje por nuestras tierras de que aquellos valientes que deseen comenzar sus vidas en un lugar nuevo tendrían el apoyo del estado. Nuestro pueblo es ambicioso y robusto, sin miedo a los desafíos, y pronto tuvimos todos los hombres libres que necesitábamos - somos afortunados más allá de medida, de estar bendecidos como estamos. Estos colonos se están reuniendo cerca de las estribaciones de [GetProvince('(int32)3617').GetArea.GetName], esperando noticias de adónde serán enviados."
 flavor_gaul.44.a:0 "Dile a nuestro pueblo que viaje lejos y ancho, asentándose donde deseen"
 flavor_gaul.45.t:0 "Papiro Lepontio"
 flavor_gaul.45.desc:0 "Tenemos noticias emocionantes para informar desde la Biblioteca Real, o [ROOT.GetCountry.GetRuler.GetName]. Reconociendo que nuestras necesidades eran mucho mayores que lo disponible localmente, comenzamos a importar papiro, con la esperanza de complementar nuestros propios materiales de escritura con esta maravilla egipcia. El flujo constante de papiro ha permitido a nuestros escribas hacer copias de los diversos textos que hemos adquirido, y nuestro conocimiento ha crecido exponencialmente debido a ello - veremos los resultados casi de inmediato, [ROOT.GetCountry.GetRuler.GetFirstName]."
 flavor_gaul.45.a:0 "Esto es lo mejor que he escuchado todo el día"

 flavor_gaul.46.t:0 "Honrando a Nuestros Antepasados"
 flavor_gaul.46.desc:0 "Creyendo firmemente que el líder sabio reconoce sus deudas, [ROOT.GetCountry.GetRuler.GetName] ha hecho saber que [ROOT.GetCountry.GetRuler.GetSheHe] honrará a nuestros antepasados con las ceremonias religiosas adecuadas, incluida una de nuestras prácticas más sagradas y antiguas: el entierro en carro, cuando llegue el momento. Aunque obtener un ingreso estable es difícil para una tribu pequeña, [ROOT.GetCountry.GetRuler.GetFirstName] ha declarado que no se escatimarán esfuerzos y cada gasto será pagado sin cuestionar.\n\nMientras algunos lamentan las enormes sumas involucradas en tales asuntos, la mayoría de nuestro pueblo alaba la piedad de [ROOT.GetCountry.GetRuler.GetFirstName] como un ejemplo para nuestras generaciones más jóvenes."
 flavor_gaul.46.a:0 "No estamos aquí para regatear con los dioses, sino para honrarlos"
 flavor.gaul.46.tt:0 "¡La tarea de la misión '#Y Honrando a los Ancestros#!' ya ha sido #G completada#!!"

 flavor_gaul.47.t:0 "Preparativos para el Entierro"
 flavor_gaul.47.desc:0 "A medida que comienza el período de luto por nuestro líder anterior, [ROOT.GetCountry.GetRuler.GetName] ha sido abordado en privado por los Sabios y los Ancianos, quienes insisten en que honremos nuestras antiguas costumbres dando al difunto un adecuado Entierro en Carro [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName]. Este es un gran honor, reservado solo para los más élite de nuestra sociedad, pero si procedemos o no depende completamente de [ROOT.GetCountry.GetRuler.GetFirstName].\n\nAunque es desagradable discutir asuntos financieros mientras nuestra nación está de luto, hay costos sustanciales asociados con los entierros en carro y [ROOT.GetCountry.GetRuler.GetFirstName] debe aprobar las compras."
 flavor_gaul.47.a:0 "Sí, todo se preparará de acuerdo con la tradición"
 flavor_gaul.47.b:0 "Simplemente no podemos permitirnos esto en este momento - no habrá carro"

 flavor_gaul.48.t:0 "Enterrando El Carro"
 flavor_gaul.48.desc:0 "Se está llevando a cabo una procesión sombría a unas horas de viaje fuera de [ROOT.GetCountry.GetCapital.GetName] mientras se realizan los últimos preparativos para una de nuestras tradiciones más antiguas: el entierro en carro de una élite cultural.\n\nTodo tipo de bienes funerarios son enterrados - platos de comedor suntuosos fabricados en plata, torques de oro y capas ceremoniales de piel, cuernos para beber y bandejas enmarcadas con gemas - mientras los animales y esclavos requeridos son sacrificados cerca. Todo se ha hecho con estándares exactos, y los augurios muestran que los dioses están muy complacidos con nuestra atención a los detalles más finos.\n\nHay un silencio respetuoso mientras la última de la tierra cae sobre el carro, y uno por uno, todos se vuelven hacia [ROOT.GetCountry.GetRuler.GetName], quien ofrece unas palabras."
 flavor_gaul.48.a:0 "Mientras recordamos nuestras obligaciones con los muertos, que nos den sus bendiciones"

 flavor_gaul.49.t:0 "Sobornar al Consejo"
 flavor_gaul.49.desc:0 "[ROOT.GetCountry.GetRuler.GetName] tiene una reputación por no permitir que nada se interponga en el cumplimiento de los planes de [ROOT.GetCountry.GetRuler.GetHerHis]; cada asunto militar que [ROOT.GetCountry.GetRuler.GetFirstName] ha enfrentado, por ejemplo, ha sido manejado de manera rápida y despiadada, con una eficiencia que podría confundirse con frialdad.\n\nNo debería sorprender a quienes están atentos que [ROOT.GetCountry.GetRuler.GetFirstName] recurra al soborno político para mover los engranajes del estado. Cada bolsa de plata entregada, cada torque de oro, fue entregada con una amenaza tácita para cerrar el trato."
 flavor_gaul.49.a:0 "Si mis enemigos no aceptan mis monedas, que reciban mis dagas..."
 flavor.gaul.49.tt:0 "¡La tarea de misión '#Y Sobornar al consejo#!' ya ha sido #G completada#!!"

 flavor_gaul.50.t:0 "Ambición Monárquica"
 flavor_gaul.50.desc:0 "Aunque no todos están contentos hoy - hay quienes creen ridículamente que son mejores candidatos para el trono - se nos presenta una ocasión trascendental; bajo la atenta mirada de nuestros Ancianos y el Sabio, [ROOT.GetCountry.GetRuler.GetName] está sometiéndose a la purificación ritual para la ceremonia de coronación más tarde hoy en [ROOT.GetCountry.GetCapital.GetName]. Cuando el sol se ponga en unas pocas horas y los sacrificios estén completos, tendremos una nueva forma de gobierno.\n\nAunque nuestro pueblo nunca ha sido gobernado por un verdadero soberano antes, se ha reconocido que el momento ha llegado. Que los dioses continúen otorgando a [ROOT.GetCountry.GetRuler.GetFirstName] la sabiduría e inteligencia para llevar a nuestra nación hacia adelante."
 flavor_gaul.50.a:0 "No los defraudaré, ¡pero haré todo por Treveria siempre!"
 flavor.gaul.50.tt:0 "¡La tarea de misión '#Y Ambición monárquica#!' ya ha sido #G completada#!!"

 flavor_gaul.51.t:0 "Triunfo en Treveria"
 flavor_gaul.51.desc:0 "Cuando todo esté dicho y hecho, hay mucho de lo que nuestro pueblo puede estar orgulloso. No solo hemos destruido las tribus inferiores que nos rodeaban, absorbiendo su fuerza y poder en el nuestro, sino que también hemos comenzado a crear una civilización que realmente merece respeto. También hemos elevado una línea de Reyes para gobernarnos, y nuestros ingenieros han sometido los bosques salvajes, construyendo ciudades y magníficos edificios que deslumbran con su ingenio.\n\nAunque el pueblo ha hecho mucho para merecer estos honores, muchos admiten que no estaríamos tan avanzados como estamos sin [ROOT.GetCountry.GetRuler.GetName] - incluso los detractores de [ROOT.GetCountry.GetRuler.GetFirstName] admiten que hemos sido bendecidos con [ROOT.GetCountry.GetRuler.GetHerHis] liderazgo."
 flavor_gaul.51.a:0 "¡Viva Treveria!"
 flavor.gaul.51.tt:0 "¡La tarea de misión '#Y Triunfo en Treveria#!' ya ha sido #G completada#!!"

 flavor_gaul.52.t:0 "Treveria"
 flavor_gaul.52.desc:0 "Si bien [ROOT.GetCountry.GetCapital.GetName] ciertamente ha servido bien a nuestra gente, últimamente hay un coro creciente que exige que traslademos nuestra capital a [GetProvince('(int32)3690').GetName], la nueva ciudad que ha cautivado los corazones de nuestros parientes. La ciudad de Treveria no sólo tiene acceso al río, lo cual es vital para su éxito económico, sino que también está ubicada en las llanuras, lo que le da a nuestra gente espacio para expandirse en el futuro. Los bosques cerca de Caranusca están demostrando ser un obstáculo para el desarrollo, ya que construir todo cuesta más y la ciudad de [GetProvince('(int32)3690').GetName] parece tener todo lo que nuestra capital actual no tiene."
 flavor_gaul.52.a:0 "Usemos nuestra capital - no hay razones para quedarnos en un sitio inferior"
 flavor_gaul.52.b:0 "No estamos abandonando nuestras tierras ancestrales"
 flavor.gaul.52.tt:0 "¡La tarea de misión '#Y Treveria#!' ahora ha sido #G completada#!!"

 flavor_gaul.53.t:0 "Bélgica Treveriana"
 flavor_gaul.53.desc:0 "Ahora que hemos sometido a las tribus que habitan [GetProvince('(int32)3029').GetArea.GetRegion.GetName], [ROOT.GetCountry.GetRuler.GetName] ha solicitado visitar la provincia para tomar cuenta de la región. Habiendo pasado por tales dificultades para asegurar el territorio, todos pueden entender la necesidad de verificar personalmente nuestros logros.\n\nLos belgas parecen humildes, por una vez - no hay miradas desafiantes ofrecidas a nuestro pueblo mientras la procesión real avanza por las calles. Su espíritu de resistencia parece haber sido quebrado; una noticia que nuestros asesores militares estarán felices de escuchar.\n\nCuando el carro de [ROOT.GetCountry.GetRuler.GetFirstName] gira por el camino hacia casa, un zorro cruza la carretera, desapareciendo en el bosque."
 flavor_gaul.53.a:0 "Tomaremos esto como un buen augurio - volvamos a [ROOT.GetCountry.GetCapital.GetName]"
 flavor.gaul.53.tt:0 "¡La tarea de misión '#Y Treverian Bélgica#!' ya ha sido #G completada#!!"

 flavor_gaul.54.t:0 "Expansión Occidental"
 flavor_gaul.54.desc:0 "¡Finalmente! Nuestros generales informan que el esperado avance ha llegado; después de guerras devastadoras, finalmente hemos incorporado las regiones de [GetProvince('(int32)2418').GetArea.GetName], [GetProvince('(int32)2499').GetArea.GetName] y [GetProvince('(int32)2489').GetArea.GetName] a nuestro dominio.\n\nHay una gran celebración en [ROOT.GetCountry.GetCapital.GetName] esta noche, mientras los jefes reunidos compiten para ver quién puede emborrachar a [ROOT.GetCountry.GetRuler.GetName] más rápido."
 flavor_gaul.54.a:0 "Cualquiera que haya dudado de mi habilidad es un tonto... eructo"
 flavor_gaul.54.b:0 "Bueno, tal vez uno o dos no harían daño"
 flavor.gaul.54.tt:0 "¡La tarea de misión '#Y Expansión occidental#!' ya ha sido #G completada#!!"

 flavor_gaul.55.t:0 "Crisol de culturas"
 flavor_gaul.55.desc:0 "Si bien algunos jefes tribales son conocidos por aislar a su gente de las tribus que viven a su alrededor, [ROOT.GetCountry.GetRuler.GetName] siempre ha creído que sólo los tontos se alejarían del resto del mundo; hay mucho que aprender de culturas extranjeras que podrían resultar beneficiosas.\n\nCon esta creencia en mente, [ROOT.GetCountry.GetRuler.GetFirstName] ha decidido que [ROOT.GetCountry.GetName] invitaría a nuestros primos a compartir la calidez y la seguridad de nuestros hogares, y la Se sabe que las tierras gobernadas por las tribus [ROOT.GetCountry.GetRuler.GetFamily.GetName] dan la bienvenida al extraño; verdaderamente, todos elogian nuestra generosidad."
 flavor_gaul.55.a:0 "Todos pueden encontrar un hogar dentro de [ROOT.GetCountry.GetName]"
 flavor.gaul.55.tt:0 "¡La tarea de la misión '#Y Crisol de culturas#!' ya ha sido #G completada#!!"

 flavor_gaul.56.t:0 "Minas de hierro"
 flavor_gaul.56.desc:0 "Fue una grata sorpresa cuando llegaron a [ROOT.GetCountry.GetCapital.GetName] informes que indicaban que se habían descubierto grandes vetas de hierro @iron! en algunos de nuestros territorios, una bendición que sólo podría haber venido del propio dios [GetDeityDefinition('omen_gobannus').GetName]. Nuestra gente ha ido dominando lentamente los procesos relacionados con la herrería del hierro y ya producimos una cantidad decente de mineral, pero parece que Gobannus ve lo que estamos haciendo y quiere que incrementemos nuestros esfuerzos."
 flavor_gaul.56.a:0 "Necesitamos todo el hierro que podamos conseguir"
 flavor.gaul.56.tt:0 "¡La tarea de misión '#Y Minas de hierro#!' ya ha sido #G completada#!!"
 flavor.gaul.56.tt2:0 "Dos asentamientos aleatorios que producen #Y metales básicos#! @base_metals! y #Y piedra#! @stone! producirán #Y hierro#! @iron! en su lugar."
 
 flavor_gaul.57.t:0 "Iniciativa Hill Fort"
 flavor_gaul.57.desc:0 "Gracias a las lecciones que nuestros arquitectos han aprendido al construir [GetProvince('(int32)3687').GetArea.GetName] y los numerosos #E castros#! que protegen el campo, nuestros trabajadores prácticamente dominan su oficio y pueden erigir rápidamente fortificaciones o diseñar un oppidum con un mínimo de esfuerzo. Con ingenieros tan capacitados a mano, podremos construir nuevas ciudades de manera mucho más eficiente que nunca."
 flavor_gaul.57.a:0 "Entonces construyamos donde podamos a lo largo de [ROOT.GetCountry.GetName]"
 flavor.gaul.57.tt:0 "¡La tarea de misión '#Y Iniciativa Hill Fort#!' ya ha sido #G completada#!!"

 flavor_gaul.58.t:0 "Afluentes belgas"
 flavor_gaul.58.desc:0 "Aunque hay muchos que viven dentro de [ROOT.GetCountry.GetName] que temen a los #E belgas#! y su temible reputación, el victorioso [ROOT.GetCountry.GetRuler.GetName] ha demostrado de una vez por todas que estos salvajes son tan fáciles de tratar como cualquier otra tribu.\n\nAl [ROOT.GetCountry.GetRulerTitle] le gusta repetir a menudo un viejo axioma que le viene a la mente; aquellos que no se sometan a la [ROOT.GetCountry.GetAdjective] diplomacia serán finalmente castigados con [ROOT.GetCountry.GetAdjective] armas. Y ahora que nuestras fronteras abarcan tierras que alguna vez fueron gobernadas por los feroces belgas, [ROOT.GetCountry.GetRuler.GetFirstName] debe decidir cuál será su estatus; ¿Los trataremos como a nuestros hermanos o como a nuestros esclavos?"
 flavor_gaul.58.a:0 "Que todo nuestro pueblo viva juntos en armonía."
 flavor.gaul.58.tt:0 "¡La tarea de la misión '#Y Afluentes belgas#!' ya ha sido #G completada#!!"

 flavor_gaul.59.t:0 "Un entierro en carreta"
 flavor_gaul.59.desc:0 "Desde el reciente #E Entierro del vagón#!, la mente de [ROOT.GetCountry.GetRuler.GetName] ha estado preocupada por cuestiones de vida y muerte, y ha pasado muchas horas en profunda contemplación ante el incendio en su hogar en [ROOT.GetCountry.GetCapital.GetName].\n\nNuestro mismo nombre, #E '[ROOT.GetCountry.GetAdjective]'#!, recuerda el cruce. De los ríos, y el [ROOT.GetCountry.GetRulerTitle] a menudo se pregunta si los días de nuestra vida se miden de forma similar al fluir del agua. ¿Con qué propósito nos han dado los dioses una vida tan corta, en la que se espera que logremos tanto? ¿Y cuál es la naturaleza de los dioses mismos? ¿Permanecen inmunes a los estragos del tiempo, o ellos también sucumben eventualmente, como seguramente todo debe suceder? Y si se ven afectados por el paso de los años, ¿son realmente dioses?\n\nNo hace falta decir que [ROOT.GetCountry.GetRuler.GetFirstName] no ha estado durmiendo bien, pues [ROOT.GetCountry.GetRuler.GetSheHe] no puede dejar de pensar en esas cosas."
 flavor_gaul.59.a:0 "Debo confiar en la voluntad de los dioses."
 flavor_gaul.59.b:0 "Nada de esto tiene sentido... ¿por qué hacemos las cosas que hacemos?"
 flavor_gaul.59.c:0 "No hay ninguna razón por la que deba preocuparme tanto."
 flavor.gaul.59.tt:0 "¡La tarea de misión '#Y Un entierro en vagón#!' ya ha sido #G completada#!!"
 treverian_ruler_contemplates_gods_tt:0 "Nuestro Gobernante contemplará serios asuntos de vida o muerte..."

 flavor_gaul.60.t:0 "Relaciones comerciales"
 flavor_gaul.60.desc:0 "En la historia de nuestro pueblo, hay pocos que puedan estar al lado de [ROOT.GetCountry.GetRuler.GetName], quien no solo ha conseguido muchas victorias ganadas con esfuerzo en el campo de batalla para [ROOT.GetCountry.GetName], sino que también ha mejorado la vida cotidiana de las tribus importando artículos lujosos a sus mercados.\n\nMientras que algunos #E Ancianos#! han denunciado el flujo de bienes comerciales exóticos como Afeminante y degradante para nuestras formas de vida tradicionales, [ROOT.GetCountry.GetRuler.GetFirstName] ha criticado públicamente a [ROOT.GetCountry.GetRuler.GetHerHis] a sus oponentes, argumentando que nos impedirían volvernos más poderosos."
 flavor_gaul.60.a:0 "Hay muchos beneficios al permitir que el comercio florezca"
 flavor_gaul.60.b:0 "El sabio invierte su dinero para obtener mayores ganancias."
 flavor.gaul.60.tt:0 "¡La tarea de la misión '#Y Relaciones comerciales#!' ya ha sido #G completada#!!"

 flavor_gaul.61.t:0 "Treveran Oppida"
 flavor_gaul.61.desc:0 "Nuestros arquitectos e ingenieros han dominado el fino arte de la construcción, perfeccionando su oficio a lo largo de muchos años difíciles de arduo trabajo. [ROOT.GetCountry.GetRuler.GetName] se apresuró a elogiar su trabajo, presentando sus esfuerzos como un ejemplo de [ROOT.GetCountry.GetAdjective] brillantez en su máxima expresión, y ha declarado una y otra vez que necesitamos hombres así.\n\nSe enviaron mensajeros por todo [ROOT.GetCountry.GetName] pidiendo trabajadores que vinieran a [ROOT.GetCountry.GetCapital.GetName], donde siempre había trabajo que encontrar, y no pasó mucho tiempo para muchos. Libertos llegaran a la capital."
 flavor_gaul.61.a:0 "Nuestra civilización en crecimiento requiere más ciudades: manos a la obra"
 flavor.gaul.61.tt:0 "¡La tarea de misión '#Y Treveran Oppida#!' ya ha sido #G completada#!!"

 flavor_gaul.62.t:0 "El Rhenus"
 flavor_gaul.62.desc:0 "Durante muchas horas, se ha estado celebrando un [ROOT.GetCountry.GetAdjective] #E Consejo de Guerra#! en [ROOT.GetCountry.GetCapital.GetName], y los guerreros más experimentados que viven en [ROOT.GetCountry.GetName] - [ROOT.GetCountry.GetRuler.GetName], [SCOPE.sCharacter('clan_chief_one').GetName] y [SCOPE.sCharacter('clan_chief_two').GetName] - se han reunido para discutir estrategia y tácticas. Desafortunadamente para todos los presentes, hay desacuerdos sobre cómo debemos proceder.\n\n[SCOPE.sCharacter('clan_chief_one').GetFirstName] cree que los densos bosques de [GetProvince('(int32)2428').GetArea.GetName] serían la mejor provincia para invadir, pero [SCOPE.sCharacter('clan_chief_two').GetFirstName] jura que esto es una tontería y que la primera opción para nuestros ejércitos deben ser las colinas rocosas de [GetProvince('(int32)3627').GetArea.GetName]. [ROOT.GetCountry.GetRuler.GetFirstName] está frustrado por ambos y su comportamiento obstinado y no espera tomar la decisión final, sabiendo que uno de los [ROOT.GetCountry.GetRuler.GetHerHis] mejores luchadores estará profundamente molesto."
 flavor_gaul.62.a:0 "Estoy de acuerdo con [SCOPE.sCharacter('clan_chief_one').GetFirstName] y no escucharé otros argumentos."
 flavor_gaul.62.b:0 "[SCOPE.sCharacter('clan_chief_two').GetName] ha hablado con sinceridad"
 flavor_gaul.62.c:0 "Ustedes dos, tontos, discuten como niños mimados: ¡callen!"
 flavor.gaul.62.tt:0 "¡La tarea de misión '#Y El Rhenus#!' ya ha sido #G completada#!!"

 flavor_gaul.63.t:0 "Sometimiento de los eburones"
 flavor_gaul.63.desc:0 "Ahora que los #E Eburones#! han sido sometidos por el impresionante [ROOT.GetCountry.GetRuler.GetName], el famoso [ROOT.GetCountry.GetRulerTitle] que ha liderado a las tribus de [ROOT.GetCountry.GetName] de una victoria a otra, [ROOT.GetCountry.GetRuler.GetSheHe] ha prometido a [ROOT.GetCountry.GetRuler.GetHerHis] guerreros que les esperan aún más glorias."
 flavor_gaul.63.a:0 "¡Nuestras levas pronto marcharán hacia nuevas tierras que por la presente reclamo!"
 flavor_gaul.63.b:0 "Realmente subyugaré a Eburonia... ¡esclavizaré a los belgas!"
 flavor.gaul.63.tt:0 "¡La tarea de misión '#Y Subyugación de los Eburones#!' ya ha sido #G completada#!!"

 flavor_gaul.64.t:0 "Fortificar el Rhenus"
 flavor_gaul.64.desc:0 "Desde [ROOT.GetCountry.GetRuler.GetHerHis] los primeros días de [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName] siempre había temido una invasión desde el otro lado del #E río Rhenus#! pero no pudo hacer mucho al respecto: los problemas que enfrentaba [ROOT.GetCountry.GetName] eran apremiantes y graves, y los imaginarios #E asaltantes germánicos#! serían un problema para otro. Día.\n\nPero ese día finalmente llegó, y [ROOT.GetCountry.GetRuler.GetFirstName] estaba listo para el momento, alabados sean los dioses. Después de explorar nuestras fortificaciones y defensas, se decidió que los #E vigías renanos#! se colocarían en puntos cruciales a lo largo del río y servirían como guardias. Estos soldados serían nuestra primera línea de defensa, controlarían los pasos a través del Rhenus y, con suerte, darían al resto de nuestras tropas tiempo suficiente para acudir en su ayuda."
 flavor_gaul.64.a:0 "Valientes guardianes de Treveria, ¡que los dioses luchen a vuestro lado!"
 flavor.gaul.64.tt:0 "¡La tarea de misión '#Y Fortificar el Rhenus#!' ahora ha sido #G completada#!!"

 flavor_gaul.65.t:0 "Montañas del Jura"
 flavor_gaul.65.desc:0 "Ahora que las tropas de [ROOT.GetCountry.GetName] controlan las estribaciones y los pasos de las #E montañas del Jura#!, el [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] ha anunciado a nuestro pueblo que nuestra expansión no ha terminado, sino que continuará mientras los dioses nos concedan la victoria."
 flavor_gaul.65.a:0 "Habrá un tiempo para la paz, pero ese día no ha llegado"
 flavor.gaul.65.tt:0 "¡La tarea de la misión '#Y Montañas Jura#!' ya ha sido #G completada#!!"

 flavor_gaul.66.t:0 "Asegure nuestra costa"
 flavor_gaul.66.desc:0 "Durante muchos años, nuestras tribus estuvieron confinadas en las llanuras y bosques de la #E Galia#!, pero las cosas cambian, y en nuestro caso, las cosas han cambiado rápidamente; Ya no nos quedamos en tierra, pero nuestros valientes hijos han construido barcos que navegan en aguas lejanas.\n\nAunque todavía estamos encontrando nuestras piernas en el mar, nuestra gente ha afrontado la tarea con entusiasmo y ha puesto sus espaldas en el trabajo de construir barcos fuertes para nuestros marineros."
 flavor_gaul.66.a:0 "Debemos proteger nuestros intereses en el mar y en la tierra."
 flavor.gaul.66.tt:0 "¡La tarea de la misión '#Y Proteger nuestra costa#!' ya ha sido #G completada#!!"

 # NEW BOIHAEMIA
 flavor_gaul.67.t:0 "Colonizar la tierra más allá de los Sudetes"
 flavor_gaul.67.desc:0 "Los Sudetes son una tierra no tan distinta a la nuestra, aunque con muchas más llanuras que bosques. Somos sabios al reclamar una tierra así para nosotros mismos; ha quedado claro para [ROOT.GetCountry.GetRuler.GetName] que las tierras fértiles que se encuentran más allá de nuestra patria es donde encontraremos verdadera prosperidad y riqueza."
 flavor_gaul.67.a:0 "Nuestro hogar lejos de casa."
 flavor.gaul.67.tt:0 "¡La tarea de misión '#Y Colonizar la tierra más allá de los Sudetes#!' ya ha sido #G completada#!!"

 flavor_gaul.68.t:0 "Desarrollar nuestra tierra transudetana"
 flavor_gaul.68.desc:0 "En los años transcurridos desde que nos expandimos a las Tierras Transudetanas, se ha transformado en una provincia bastante trabajadora, llena de muchos pequeños pueblos y granjas. Ha llegado a parecerse a las tierras natales de Boihamian, algo de lo que [ROOT.GetCountry.GetRuler.GetName] está muy orgulloso.\n\nAhora que hemos convertido un lugar que alguna vez estuvo escasamente habitado en una tierra ahora viva y civilizada, ¿quién puede decir adónde nos llevarán nuestras conquistas?"
 flavor_gaul.68.a:0 "Primero, deberíamos mirar a nuestras propias tierras..."
 flavor.gaul.68.tt:0 "¡La tarea de la misión '#Y Desarrollar nuestra tierra transudetana#!' ya ha sido #G completada#!!"

 flavor_gaul.69.t:0 "Alianza Taurisciana"
 flavor_gaul.69.desc:0 "[ROOT.GetCountry.GetRuler.GetName] partió con los jefes de su clan de confianza, ansiosos por finalizar el pacto que se ha discutido entre [GetCountry('BOA').GetName] y [GetCountry('TSC').GetName]. A su llegada a la capital taurisca, [GetProvince('(int32)4029').GetName], [ROOT.GetCountry.GetRuler.GetName] fue recibido con música, un festín y bailarines.\n\nLas cosas no podrían haber ido mejor, y ahora [GetCountry('BOA').GetName] tiene un aliado de confianza y puede comenzar su expansión en las tierras que se encuentran al este de nosotros."
 flavor_gaul.69.a:0 "Tengo amigos en todas partes."
 flavor.gaul.69.tt:0 "¡La tarea de misión '#Y Alianza Taurisciana#!' ya ha sido #G completada#!!"

 flavor_gaul.70.t:0 "Comercio Taurisciano"
 flavor_gaul.70.desc:0 "Nuestra alianza con [GetCountry('TSC').GetName] fue tan beneficiosa que era de sentido común abrirles nuestras relaciones comerciales. Ahora, no sólo las mercancías fluyen por nuestras tierras, sino que también han prometido enviar a algunos de sus mejores soldados para que actúen como guardia personal de [ROOT.GetCountry.GetRuler.GetName]."
 flavor_gaul.70.a:0 "En verdad, esta fue una decisión acertada."
 flavor.gaul.70.tt:0 "¡La tarea de misión '#Y Comercio Taurisciano#!' ahora ha sido #G completada#!!"

 flavor_gaul.71.t:0 "En la Alta Panonia"
 flavor_gaul.71.desc:0 "Las tierras de #E Alta Panonia#! están escasamente habitadas, pero siguen siendo de interés estratégico para nosotros. Nuestra toma y subyugación de territorios alguna vez controlados por los cotinianos que habitaban las montañas y los astutos eraviscianos ha conducido a un área desde la cual podemos organizar nuevas invasiones. Parece que los celtas del sur han comenzado a moverse tras nuestras conquistas, y los dacios del este no parecen dignos de confianza..."
 flavor_gaul.71.a:0 "Debemos estar alerta ante cualquier amenaza."
 flavor.gaul.71.tt:0 "¡La tarea de misión '#Y En Panonia#!' ya ha sido #G completada#!!"

 flavor_gaul.72.t:0 "Dominio panónico"
 flavor_gaul.72.desc:0 "Después de muchas victorias muy reñidas, finalmente podemos decir que #E Panonia#! ¡es ahora territorio de Boihemia! Esta tierra fértil se convertirá en una parte crucial de nuestra nueva federación. Después de todo, un ejército sólo puede luchar con el estómago lleno."
 flavor_gaul.72.a:0 "Nuestros rendimientos serán abundantes."
 flavor.gaul.72.tt:0 "¡La tarea de misión '#Y Dominio de Panonia#!' ya ha sido #G completada#!!"

 flavor_gaul.73.t:0 "Costa Ámbar"
 flavor_gaul.73.desc:0 "Nuestros repetidos tratos con los germánicos nos han llevado a darnos cuenta de las vastas riquezas que poseen. No en oro o plata, sino en esta extraña sustancia parecida a una roca llamada ámbar. Aunque no estamos muy seguros de qué hacer con él, los pueblos ricos del sur no se cansan de él. Fue por este motivo que [ROOT.GetCountry.GetRuler.GetName] organizó una conquista de esta región. Ahora, con este precioso recurso exclusivamente bajo nuestro control, nos haremos ricos más allá de nuestros sueños más locos."
 flavor_gaul.73.a:0 "Parece que Amber vale más que el oro."
 flavor.gaul.73.tt:0 "¡La tarea de misión '#Y Costa Ámbar#!' ya ha sido #G completada#!!"

 flavor_gaul.74.t:0 "Sal de Laciacum"
 flavor_gaul.74.desc:0 "Después de nuestra conquista de las tierras alaunas, sus preciosos @salt! lagos salados ahora han caído bajo nuestro control. Los alaunos aparentemente no aprovecharon al máximo esta zona productora de sal, pero ahora podemos hacerlo. Aunque no necesitamos sal en grandes cantidades, hay mercados en otros lugares donde podemos venderla con grandes ganancias, como los germánicos en el norte."
 flavor_gaul.74.a:0 "Un bien tan valioso siempre tiene una gran demanda."
 flavor.gaul.74.tt:0 "¡La tarea de misión '#Y Sal de Laciacum#!' ya ha sido #G completada#!!"

 flavor_gaul.75.t:0 "Ferro Noricum"
 flavor_gaul.75.desc:0 "El hierro @iron! no es lo único interesante de [GetProvince('(int32)3672').GetName].\n\nEstos pasos de montaña son fácilmente defendibles, incluso con una fuerza pequeña, y el abundante hierro de la zona es algo que podemos utilizar para forjar nuevas armas, herramientas y armaduras. Aunque por naturaleza no somos un pueblo montañés, podremos hacer uso de este estrangulamiento estratégico. Será nuestro bastión del sur desde el cual podremos mantener alejado a cualquier enemigo que intente penetrar en nuestras ricas tierras del norte."
 flavor_gaul.75.a:0 "Nuestras espadas serán tan afiladas como nuestro ingenio."
 flavor.gaul.75.tt:0 "¡La tarea de misión '#Y Ferrum Noricum#!' ya ha sido #G completada#!!"

 flavor_gaul.76.t:0 "Zarpar"
 flavor_gaul.76.desc:0 "Lejos de nuestro sur, en las cálidas aguas del #E mar Mediterráneo#!, se sabe que hay miles de barcos que navegan de puerto en puerto, de ciudad en ciudad, transportando valiosos cargamentos de artículos de lujo o escuadrones enteros de unidades militares de élite: aspiraciones que [ROOT.GetCountry.GetRuler.GetName] tiene para [ROOT.GetCountry.GetName] un día.\n\nNuestra flota es humilde en comparación con las vastas armadas de esos poderosos. Reinos, pero todo el mundo tiene que empezar por algún lado, y [ROOT.GetCountry.GetRuler.GetFirstName] está orgulloso de lo que hemos logrado hasta ahora."
 flavor_gaul.76.a:0 "Nuestra marina está destinada a grandes cosas, ya verás"
 flavor.gaul.76.tt:0 "¡La tarea de misión '#Y Zarpar#!' ya ha sido #G completada#!!"

 flavor_gaul.77.t:0 "Comercio del Mar del Norte"
 flavor_gaul.77.desc:0 "Gracias al aumento del comercio que fluye hacia [ROOT.GetCountry.GetCapital.GetName], nuestros comerciantes y comerciantes están obteniendo más ganancias de las que imaginaban posibles. En su agradecimiento, han enviado una gran suma de dinero a [ROOT.GetCountry.GetRuler.GetName] como forma de mostrar su agradecimiento por el [ROOT.GetCountry.GetRulerTitle].\n\nLa visión de un barco comercial desafiando las agitadas aguas del #E Mare Germanicum#! para llegar a nuestros puertos se está volviendo común, y muchos de nuestros jóvenes sueñan con convertirse en marineros algún día."
 flavor_gaul.77.a:0 "Agradezco el gesto. Le daré un buen uso al oro."
 flavor.gaul.77.tt:0 "¡La tarea de misión '#Y Comercio del Mar del Norte#!' ya ha sido #G completada#!!"

 flavor_gaul.78.t:0 "Ofrenda de pantano"
 flavor_gaul.78.desc:0 "Uno de nuestros rituales religiosos más antiguos consiste en sacrificar a una víctima ahogándola en un pantano y dejando su cuerpo en aguas turbias, junto con obsequios de comida y ropa. Esta antigua práctica ha asegurado [ROOT.GetCountry.GetAdjective] la victoria en la batalla, así como abundantes cosechas cada año, y por lo tanto ha habido presión sobre [ROOT.GetCountry.GetRuler.GetName] para que cumpla [ROOT.GetCountry.GetRuler.GetHerHis] deberes sagrados.\n\nAhora que tenemos prisioneros encadenados en [ROOT.GetCountry.GetCapital.GetName], los #E Ancianos tribales#! han traído una víctima adecuada al [ROOT.GetCountry.GetRulerTitle] y exigió que se pidiera a los dioses."
 flavor_gaul.78.a:0 "Que el poder de los dioses sea dado a [ROOT.GetCountry.GetRuler.GetFirstName]"
 flavor_gaul.78.b:0 "Pedir a los dioses que bendigan [ROOT.GetCountry.GetName] con la victoria sobre nuestros enemigos."
 flavor_gaul.78.c:0 "Mostraré misericordia a la víctima: no todos los frisones son monstruos"
 flavor.gaul.78.tt:0 "¡La tarea de misión '#Y Ofrenda de pantano#!' ya ha sido #G completada#!!"
 frisians_decide_bog_offering_tt:0 "Nuestro [ROOT.GetCountry.GetRulerTitle|Y] decidirá el destino de nuestro prisionero..."
 frisian_victim_moves_to_bar_tt:0 "El prisionero será #T liberado#! en el desierto de Frisia..."

 flavor_gaul.79.t:0 "Costa del Mar del Norte"
 flavor_gaul.79.desc:0 "En los últimos meses, la visión de [ROOT.GetCountry.GetAdjective] barcos de asalto navegando arriba y abajo por las costas del norte se ha convertido en un presagio aterrador para los lugareños que viven junto al mar, porque saben que nuestros barcos transportan asaltantes y esclavistas y que nuestros guerreros no mostrarán piedad hacia nadie que viva en su tribu.\n\n[ROOT.GetCountry.GetRuler.GetName] a menudo ha supervisado personalmente muchas de estas incursiones, ganándose una temible reputación como saqueador y asesino. De los hombres."
 flavor_gaul.79.a:0 "Este es sólo el comienzo de tus miserias"
 flavor.gaul.79.tt:0 "¡La tarea de misión '#Y Costa del Mar del Norte#!' ya ha sido #G completada#!!"

 flavor_gaul.80.t:0 "Marineros sajones"
 flavor_gaul.80.desc:0 "Nuestros marineros se han vuelto expertos en atacar y capturar barcos enemigos en la batalla, llevando nuestro dominio frisón del robo y nuestro amor por el saqueo a mar abierto. [ROOT.GetCountry.GetRuler.GetName] ha elogiado estos esfuerzos de nuestros hombres, animándolos a tomar tantos barcos extranjeros como sea posible; nuestras armadas han crecido en los últimos años, eso es cierto, pero siempre hay espacio para crecer."
 flavor_gaul.80.a:0 "¡Gloriosa será nuestra marina!"
 flavor.gaul.80.tt:0 "¡La tarea de misión '#Y Marineros sajones#!' ya ha sido #G completada#!!"

 flavor_gaul.81.t:0 "Fortificar nuestra capital"
 flavor_gaul.81.desc:0 "Aunque es posible que nuestras fortificaciones no se comparen con los poderosos muros de piedra que rodean las antiguas ciudades del sur, [ROOT.GetCountry.GetRuler.GetName] ha hecho el mejor trabajo posible [ROOT.GetCountry.GetRuler.GetSheHe] para garantizar que las defensas de [ROOT.GetCountry.GetCapital.GetName] sean adecuadas. Nuestras guarniciones han estado bien equipadas con suministros y nuestros defensores han prometido luchar hasta el último hombre."
 flavor_gaul.81.a:0 "Con nuestra capital protegida, no tememos a nadie, belga o no."
 flavor.gaul.81.tt:0 "¡La tarea de misión '#Y Fortificar nuestra capital#!' ya ha sido #G completada#!!"

 flavor_gaul.82.t:0 "Sacrificio a [GetDeityDefinition('omen_yngvi').GetName]"
 flavor_gaul.82.desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha pedido ayuda y asistencia a [GetDeityDefinition('omen_yngvi').GetName], pidiendo que el poderoso hijo de [GetDeityDefinition('omen_mannus').GetName] destroce a nuestros enemigos hasta el olvido. Al escuchar nuestras oraciones de súplica, Ingwaz ha vuelto su rostro hacia [ROOT.GetCountry.GetName] y nos ha bendecido con fuerza y ​​poder divinos."
 flavor_gaul.82.a:0 "¡Desataremos la furia de [GetDeityDefinition('omen_yngvi').GetName] sobre nuestros enemigos!"
 flavor.gaul.82.tt:0 "¡La tarea de misión '#Y Sacrificar a [GetDeityDefinition('omen_yngvi').GetName]#!' ahora ha sido #G completada#!!"

 flavor_gaul.83.t:0 "Incursión Pritannia"
 flavor_gaul.83.desc:0 "Ahora que nos encontramos en medio de una guerra con los #E Pritannianos#!, [ROOT.GetCountry.GetRuler.GetName] ha ordenado a nuestros reclutas que no muestren amabilidad hacia los isleños durante estas batallas iniciales. \"Llegará el momento de tomar esclavos, pero no ha llegado el momento: debemos destruir a aquellos capaces de luchar contra nosotros, y luego tomaremos lo que queramos\"."
 flavor_gaul.83.a:0 "¡No toméis prisioneros! ¡Todos deben morir!"
 flavor.gaul.83.tt:0 "¡La tarea de misión '#Y Raid Pritannia#!' ahora ha sido #G completada#!!"

 flavor_gaul.85.t:0 "Compartir la riqueza"
 flavor_gaul.85.desc:0 "Debido a que los dioses de la guerra han sido generosos con las levas de [ROOT.GetCountry.GetName] y nos han bendecido con innumerables victorias y riquezas sin medida, [ROOT.GetCountry.GetRuler.GetName] ha decidido compartir la riqueza con los líderes que viven en [ROOT.GetCountry.GetCapital.GetName].\n\nDespués de repartir obsequios de oro al [ROOT.GetCountry.GetRuler.GetHerHis] #E Consejo Tribal#!, [ROOT.GetCountry.GetRuler.GetFirstName] alentó [ROOT.GetCountry.GetRuler.GetHerHis] hombres utilizaran las ganancias de esta inesperada ganancia inesperada para armarse con armas de hierro @iron! - una petición que estuvieron felices de cumplir."
 flavor_gaul.85.a:0 "¡Así equipados, estamos preparados para lo que se nos presente!"
 flavor.gaul.85.tt:0 "¡La tarea de la misión '#Y Compartir la riqueza#!' ya ha sido #G completada#!!"

 flavor_gaul.86.t:0 "La caza del zorro"
 flavor_gaul.86.desc:0 "¡Noticias increíbles desde la frontera! Durante nuestra reciente incursión en [GetCountry('EBS').GetName], nuestros guerreros lograron capturar a un grupo de guerreros liderados por el notorio bandido [SCOPE.sChar('rups_belgae').GetName], un hombre buscado por sus brutales ataques en territorio frisón, en su camino de regreso a [ROOT.GetCountry.GetCapital.GetName].\n\nEste sinvergüenza eburoniano, conocido como #E 'El Zorro'#! por la facilidad con la que Se deslizó a través de nuestra frontera sin ser detectado, ha saqueado nuestras tierras más ricas durante años, por lo que su captura es nada menos que un milagro."
 flavor_gaul.86.a:0 "¡Esta es la justicia del pueblo frisón!"
 flavor.gaul.86.tt:0 "¡La tarea de misión '#Y La caza del zorro#!' ya ha sido #G completada#!!"

 flavor_gaul.87.t:0 "Los sajones"
 flavor_gaul.87.desc:0 "En un curioso giro de los acontecimientos, parece que los #E lugareños pritannianos#! han empezado a llamarnos los #E 'sajones'#!, porque temen los cuchillos que llevamos en nuestras crueles misiones en sus territorios. Rápidamente se corrió la voz por toda la isla del peligro que representamos nosotros, los 'sajones', y muchos jefes tribales esperan formar algún tipo de liga defensiva contra nosotros.\n\nRiéndose de sus patéticos esfuerzos por frenarnos, [ROOT.GetCountry.GetRuler.GetName] ha prometido quemar personalmente los barcos y asentamientos de cualquiera que se oponga a nosotros."
 flavor_gaul.87.a:0 "Si los hombres nos llaman sajones, entonces abrazamos el nombre"
 flavor.gaul.87.tt:0 "¡La tarea de misión '#Y Los sajones#!' ya ha sido #G completada#!!"

 flavor_gaul.88.t:0 "Punto de apoyo pritanniano"
 flavor_gaul.88.desc:0 "Nuestros ejércitos victoriosos, después de haber asegurado para nuestros parientes un punto de apoyo en la isla de #E Pritania#!, ahora dirigen sus ojos hambrientos hacia el horizonte, donde las tierras de los lugareños claman por ser conquistadas. [ROOT.GetCountry.GetRuler.GetName], nunca satisfecho con la paz, ha ordenado a las tropas de [ROOT.GetCountry.GetName] que se preparen para la batalla."
 flavor_gaul.88.a:0 "¡No descansaremos hasta haber destruido a nuestros enemigos!"
 flavor.gaul.88.tt:0 "¡La tarea de misión '#Y Punto de apoyo Pritannian#!' ya ha sido #G completada#!!"

 flavor_gaul.89.t:0 "La costa norte"
 flavor_gaul.89.desc:0 "Los guerreros de [ROOT.GetCountry.GetName] son verdaderamente extraordinarios; nunca rehuyen el llamado de la batalla, sino que corren hacia la muerte sin miedo en sus ojos. Marchan a través de las marismas pantanosas de #E Pritannia#! sin ninguna queja, y ni la lluvia incesante que azota la isla ni el viento cortante de sus tierras baldías salvajes provocan ninguna queja por parte de nuestros hombres.\n\nCuando nuestros soldados ganan una campaña, no piden descanso ni el derecho a regresar a casa con sus familias, sino que instan [ROOT.GetCountry.GetRuler.GetName] a llevarlos hacia adelante hacia gloriosos batalla."
 flavor_gaul.89.a:0 "Con luchadores así a mi lado, ¿cómo pueden perder las tribus [ROOT.GetCountry.GetAdjective]?"
 flavor.gaul.89.tt:0 "¡La tarea de misión '#Y La costa norte#!' ya ha sido #G completada#!!"

 flavor_gaul.90.t:0 "La costa sur"
 flavor_gaul.90.desc:0 "Nuestros ejércitos continúan aplastando a aquellos enviados contra ellos, tomando nuevas tierras y territorios para [ROOT.GetCountry.GetName] que nos permiten un mayor acceso a toda #E Pritania#! - una situación que [ROOT.GetCountry.GetRuler.GetName] está dispuesto a explotar."
 flavor_gaul.90.a:0 "Nuestros ejércitos marchan por #E Durotrigia#! - envían un mensaje a sus líderes"
 flavor.gaul.90.tt:0 "¡La tarea de misión '#Y La costa sur#!' ya ha sido #G completada#!!"

 flavor_gaul.91.t:0 "La costa este"
 flavor_gaul.91.desc:0 "Durante tres horribles meses, mientras se preparaban reclamaciones sobre las tierras de sus vecinos, las levas de [ROOT.GetCountry.GetName] saquearon y devastaron la ciudad de [GetProvince('(int32)2032').GetName] a su antojo. Se llevaron todo lo de valor de la ciudad y sus calles quedaron sembradas de cadáveres de personas asesinadas indiscriminadamente. Nunca antes en la historia de los #E icenos#! se había desatado sobre ellos una tragedia así, y su pueblo nunca olvidaría los crímenes cometidos por los soldados de [ROOT.GetCountry.GetRuler.GetName]."
 flavor_gaul.91.a:0 "Agradece que todavía tienes una ciudad."
 flavor_gaul.91.b:0 "¿Quieres ver de lo que soy realmente capaz?"
 flavor.gaul.91.tt:0 "¡La tarea de misión '#Y La costa este#!' ya ha sido #G completada#!!"

 flavor_gaul.92.t:0 "Puerto Occidental"
 flavor_gaul.92.desc:0 "Según todos los indicios, el puerto construido en [GetProvince('(int32)2047').GetName] sigue superando las elevadas expectativas de [ROOT.GetCountry.GetRuler.GetName], el que más había abogado por las inversiones en la región. Las aguas del #E Mare Hibernicum#! están repletas de vida y los pescadores que salen en sus barcos capturan constantemente capturas récord; una bendición que ha traído seguridad alimentaria a los lugareños."
 flavor_gaul.92.a:0 "Un miembro de una tribu bien alimentado es feliz, apuesto"
 flavor.gaul.92.tt:0 "¡La tarea de misión '#Y Puerto Occidental#!' ahora ha sido #G Completada#!!"

 flavor_gaul.93.t:0 "Northumbria"
 flavor_gaul.93.desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha desviado temporalmente [ROOT.GetCountry.GetRuler.GetHerHis] la atención de la planificación de guerras al diseño de ciudades, abriendo el tesoro de [ROOT.GetCountry.GetName] a iniciativas de construcción masiva, un esfuerzo que ha sido un éxito rotundo.\n\nEl sabio [ROOT.GetCountry.GetRulerTitle] ha razonado correctamente que la mejor manera de extender [ROOT.GetCountry.GetAdjective] por las tierras que hemos conquistado es construyendo las comunidades locales. Infraestructura, que ha complacido a nuestro pueblo y ha aliviado sus corazones cansados de la guerra."
 flavor_gaul.93.a:0 "Mis ciudades de Northumbria están mostrando a todos que planeamos quedarnos."
 flavor.gaul.93.tt:0 "¡La tarea de misión '#Y Northumbria#!' ya ha sido #G completada#!!"

 flavor_gaul.94.t:0 "Wessex"
 flavor_gaul.94.desc:0 "Nuestra cadena ininterrumpida de éxitos continúa sin cesar, y a [ROOT.GetCountry.GetRuler.GetName] no se le informan más que buenas noticias; la victoria en el campo de batalla es nuestra, nuestros guerreros se fortalecen día a día y muchos miembros de tribus están migrando de sus territorios devastados por la guerra y estableciéndose en nuestras tierras, lo que aumenta nuestros ingresos fiscales, así como la cantidad de soldados disponibles para nuestras levas."
 flavor_gaul.94.a:0 "¡Que los dioses nos sigan bendiciendo así!"
 flavor.gaul.94.tt:0 "¡La tarea de misión '#Y Wessex#!' ya ha sido #G completada#!!"

 flavor_gaul.95.t:0 "sussex y essex"
 flavor_gaul.95.desc:0 "Después de inspeccionar personalmente algunos lugares prometedores, [ROOT.GetCountry.GetRuler.GetName] dio la orden de construir nuevas ciudades en las regiones del sudeste de #E Pritania#!. Estas nuevas ciudades están destinadas a ser hogares para nuestros parientes al otro lado del agua, muchos de los cuales han abandonado sus asentamientos tradicionales con la esperanza de construir una nueva vida en nuestra isla.\n\nA medida que se corre la voz en nuestras propiedades continentales sobre las oportunidades disponibles en [GetProvince('(int32)2028').GetName] y [GetProvince('(int32)2020').GetName], los barcos que transportan colonos sajones cruzan el #E Mare Britannicum#! cada día."
 flavor_gaul.95.a:0 "Este es un desarrollo excelente."
 flavor.gaul.95.tt:0 "¡La tarea de la misión '#Y Sussex y Essex#!' ya ha sido #G completada#!!"

 flavor_gaul.96.t:0 "El corazón de Pritannia"
 flavor_gaul.96.desc:0 "Con la provincia de [GetProvince('(int32)2045').GetArea.GetName] firmemente en su poder, las levas de [ROOT.GetCountry.GetName] han tomado el control del corazón de la isla. Nuestros asaltantes y guerreros podrán emprender incursiones en cualquier dirección que elijan, y nadie podrá esconderse de la ira de [ROOT.GetCountry.GetRuler.GetName]."
 flavor_gaul.96.a:0 "Esta es una buena noticia para las tribus [ROOT.GetCountry.GetAdjective]"
 flavor.gaul.96.tt:0 "¡La tarea de misión '#Y El corazón de Pritannia#!' ya ha sido #G completada#!!"

 flavor_gaul.97.t:0 "Anglia Oriental"
 flavor_gaul.97.desc:0 "La situación en [GetProvince('(int32)2035').GetArea.GetName] continúa mejorando para nuestra gente, que ha crecido en número suficiente como para ser considerados los principales habitantes de la región. La adoración de nuestros dioses ha reemplazado los rituales locales de los nativos, muchos de los cuales han abrazado nuestra fe con la esperanza de emular nuestra grandeza. Considerándolo todo, [ROOT.GetCountry.GetRuler.GetName] está bastante satisfecho con todo lo que [ROOT.GetCountry.GetRuler.GetSheHe] escucha de [ROOT.GetCountry.GetRuler.GetHerHis] asesores."
 flavor_gaul.97.a:0 "En verdad, somos afortunados; nunca olvidemos esto."
 flavor.gaul.97.tt:0 "¡La tarea de la misión '#Y East Anglia#!' ya ha sido #G completada#!!"

 flavor_gaul.98.t:0 "El mar de Hibernia"
 flavor_gaul.98.desc:0 "Nuestros poderes navales han crecido considerablemente en los últimos años, lo que nos permite proyectar poder lejos de nuestras propias costas, una necesidad para las tribus [ROOT.GetCountry.GetAdjective], que gobiernan un extenso reino. Las aguas que rodean #E Pritannia#! son nuestras y ninguno de nuestros vecinos tiene esperanzas de desafiar nuestro dominio en el mar; se cree que incluso podríamos infligir graves daños a las armadas de las poderosas #E potencias mediterráneas#!, aunque [ROOT.GetCountry.GetRuler.GetName] ha declarado que [ROOT.GetCountry.GetRuler.GetSheHe] no tiene prisa por ver si esta teoría es cierta."
 flavor_gaul.98.a:0 "Dejemos que nuestras armadas se queden en el Mar de Hibernia por ahora."
 flavor.gaul.98.tt:0 "¡La tarea de misión '#Y El mar de Hibernian#!' ya ha sido #G completada#!!"

 flavor_gaul.99.t:0 "londinio"
 flavor_gaul.99.desc:0 "Cuando nuestros barcos invasores cruzaron por primera vez las aguas del #E Mare Germanicum#! con la esperanza de saquear los asentamientos costeros de #E Pritania#! hace muchos años, ¿cómo pudieron nuestros marineros haber previsto que, un día, nuestro [ROOT.GetCountry.GetRuler.GetName] construiría para sí [ROOT.GetCountry.GetRuler.GetHerHim] una ciudad capital a orillas del río #E Tamesis#!?\n\nNuestros parientes han abandonado sus países de origen tradicionales para siempre, porque [ROOT.GetCountry.GetRuler.GetFirstName] ha declarado que [GetProvince('(int32)2022').GetName] es la nueva capital de [ROOT.GetCountry.GetName]: una ruptura irrevocable con nuestro pasado y una señal clara de que ha llegado un momento de cambio para el pueblo [ROOT.GetCountry.GetAdjective]."
 flavor_gaul.99.a:0 "Nuestro futuro está aquí, en la isla de Albion..."
 flavor.gaul.99.tt:0 "¡La tarea de misión '#Y Londinium#!' ahora ha sido #G completada#!!"

 flavor_gaul.100.t:0 "Las minas de Belerion"
 flavor_gaul.100.desc:0 "Todo va según lo previsto, [ROOT.GetCountry.GetRuler.GetName] - las minas que nuestro pueblo ha construido en las estribaciones rocosas de [GetProvince('(int32)2006').GetArea.GetName] ya están demostrando ser inversiones inteligentes, que nos pagan dividendos que ni siquiera los más optimistas habían previsto."
 flavor_gaul.100.a:0 "Esta es una excelente noticia. Gracias por hacérmelo saber."
 flavor.gaul.100.tt:0 "¡La tarea de misión '#Y Las minas de Belerion#!' ya ha sido #G completada#!!"

 flavor_gaul.101.t:0 "kent"
 flavor_gaul.101.desc:0 "Durante muchas noches, [ROOT.GetCountry.GetRuler.GetName] siguió teniendo el mismo sueño: un ser de luz aparecería en los dormitorios de [ROOT.GetCountry.GetRulerTitle] y prometería recompensas si se construía un #E lugar sagrado#! cerca del asentamiento de [GetProvince('(int32)2021').GetName]. Esta criatura luminosa se negó a divulgar su nombre, pero prometió que la gente podría sentir la presencia de los dioses si se construyera un lugar sagrado en un bosque sagrado cerca de la costa. Aunque algunos en [ROOT.GetCountry.GetCapital.GetName] se resistieron a los costos de construir un santuario religioso, [ROOT.GetCountry.GetRuler.GetFirstName] ordenó que se construyera de inmediato, creyendo en el [ROOT.GetCountry.GetRuler.GetHerHis] corazón que los beneficios serían inmediatamente obvios... y lo fueron."
 flavor_gaul.101.a:0 "Sabía que esto sucedería... debemos ofrecer sacrificios de acción de gracias."
 flavor.gaul.101.tt:0 "¡La tarea de misión '#Y Kent#!' ahora ha sido #G completada#!!"

 flavor_gaul.102.t:0 "Fortificar Mercia"
 flavor_gaul.102.desc:0 "Cuando los lugareños que viven en [GetProvince('(int32)2054').GetArea.GetName] se acercaron a [ROOT.GetCountry.GetRuler.GetName] pidiendo ayuda, [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] no dudó, sino que acudió en su ayuda de inmediato. Las tribus que vivían allí estaban cansadas de ser atacadas por los #E celtas#! salvajes que vivían más al norte y estaban dispuestas a hacer lo que fuera necesario para garantizar su seguridad, pero no podían protegerse.\n\nPara detener la amenaza tribal, [ROOT.GetCountry.GetRuler.GetFirstName] envió a algunos de nuestros mejores guerreros a la región, ordenándoles patrullar los bosques y atacar a cualquier extranjero que vieran. La fortaleza construida en Dobunnia se convertiría en la base de operaciones de estos soldados, que estaban dispuestos a imponer la [ROOT.GetCountry.GetAdjective] paz con sus vidas."
 flavor_gaul.102.a:0 "Un día conquistaré las tierras de esas tribus por completo."
 flavor.gaul.102.tt:0 "¡La tarea de misión '#Y Fortificar Mercia#!' ahora ha sido #G completada#!!"

 flavor_gaul.103.t:0 "Reino anglosajón"
 flavor_gaul.103.desc:0 "La incomparable popularidad de [ROOT.GetCountry.GetRuler.GetName] ha permitido a [ROOT.GetCountry.GetRuler.GetHerHim] hacer lo que [ROOT.GetCountry.GetRuler.GetSheHe] quiera en las tierras gobernadas por los [ROOT.GetCountry.GetAdjective], porque sin el liderazgo dinámico y brillante del #E [ROOT.GetCountry.GetRuler.GetFamily.GetName] Clan#!, muchos de los gloriosos logros de [ROOT.GetCountry.GetRuler.GetHerHim] parientes nunca se habrían sucedió.\n\nY así, cuando el poderoso conquistador anunció que se proclamaría un nuevo reino, uno que gobernaría desde una nueva capital que extendería su dominio por toda #E Albión#!, las tribus de [ROOT.GetCountry.GetName] estaban más que felices de aceptar el cambio."
 flavor_gaul.103.a:0 "¡Todos saluden al #E Reino anglosajón#!!"
 flavor.gaul.103.tt:0 "¡La tarea de misión '#Y Reino anglosajón#!' ya ha sido #G completada#!!"

 flavor_gaul.104.t:0 "Reino juto-sajón"
 flavor_gaul.104.desc:0 "La incomparable popularidad de [ROOT.GetCountry.GetRuler.GetName] ha permitido a [ROOT.GetCountry.GetRuler.GetHerHim] hacer lo que [ROOT.GetCountry.GetRuler.GetSheHe] quiera en las tierras gobernadas por los [ROOT.GetCountry.GetAdjective], porque sin el liderazgo dinámico y brillante del #E [ROOT.GetCountry.GetRuler.GetFamily.GetName] Clan#!, muchos de los gloriosos logros de [ROOT.GetCountry.GetRuler.GetHerHim] parientes nunca se habrían sucedió.\n\nY así, cuando el poderoso conquistador anunció que se proclamaría un nuevo reino, uno que gobernaría desde una nueva capital que extendería su dominio por toda #E Albión#!, las tribus de [ROOT.GetCountry.GetName] estaban más que felices de aceptar el cambio."
 flavor_gaul.104.a:0 "¡Todos saluden al #E Reino Juto-Sajón#!!"
 flavor.gaul.104.tt:0 "¡La tarea de misión '#Y Reino Juto-Sajón#!' ahora ha sido #G completada#!!"

 flavor_gaul.105.t:0 "Reino sajón"
 flavor_gaul.105.desc:0 "La incomparable popularidad de [ROOT.GetCountry.GetRuler.GetName] ha permitido a [ROOT.GetCountry.GetRuler.GetHerHim] hacer lo que [ROOT.GetCountry.GetRuler.GetSheHe] quiera en las tierras gobernadas por los [ROOT.GetCountry.GetAdjective], porque sin el liderazgo dinámico y brillante del #E [ROOT.GetCountry.GetRuler.GetFamily.GetName] Clan#!, muchos de los gloriosos logros de [ROOT.GetCountry.GetRuler.GetHerHim] parientes nunca se habrían sucedió.\n\nY así, cuando el poderoso conquistador anunció que se proclamaría un nuevo reino, uno que gobernaría desde una nueva capital que extendería su dominio por toda #E Albión#!, las tribus de [ROOT.GetCountry.GetName] estaban más que felices de aceptar el cambio."
 flavor_gaul.105.a:0 "¡Todos saluden al #E Reino Sajón#!!"
 flavor.gaul.105.tt:0 "¡La tarea de misión '#Y Reino Sajón#!' ahora ha sido #G completada#!!"

 #Aremorica Mission Events

 flavor_gaul.106.t:0 "¡Los regalos de Toutatis!"
 flavor_gaul.106.desc:0 "¡En su divina munificencia, Toutatis ha manifestado un objeto sagrado mediante el cual invocar sus bendiciones!\n\nForjado por las manos de nuestros mejores metalúrgicos y supervisado por la intervención divina, los esfuerzos de los [SCOPE.GetRootScope.GetCountry.GetAdjective] más hábiles y justos han producido un caldero negro elaborado y extravagante, rebosante de poder bendito. ¡Con esto, debemos realizar sacrificios, pociones y hechizos del mayor significado para nuestro dios sagrado!\n\nHoy, al habernos ayudado a obtener este caldero, los dioses han ennoblecido aún más al pueblo de [SCOPE.GetRootScope.GetCountry.GetName]. ¡Y mediante el uso de nuestro nuevo instrumento, nuestra fortuna se multiplicará por diez!"
 flavor_gaul.106.a:0 "¡Por Toutatis, qué poder!"
 flavor_gaul.106.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_20$#! ya ha sido #G completada!#!"

 flavor_gaul.107.t:0 "Centro de Comercio Aremoricano"
 flavor_gaul.107.desc:0 "Desde las costas donde antaño veíamos pasar a lo lejos los barcos cartagineses rumbo a las tierras de Britannia, ahora saludamos a los marineros púnicos que atracan en nuestros propios puertos, pagando justos peajes por la estancia en la que pretenden aprovechar al máximo la floreciente actividad comercial de la zona.\n\nSi bien nuestra posición en el mar siempre nos ha facilitado el comercio y los viajes al extranjero, nuestras propias tierras estuvieron durante mucho tiempo desatendidas como centros para tal actividad, obligando a nuestros comerciantes a hacer viajes a Dumnonia y más allá al extranjero, para poder ganarse la vida. ¡Con las grandes inversiones realizadas por [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] en la región, finalmente hemos convertido a nuestro país en un centro de negocios que enriquecerá a nuestros comerciantes aquí en casa!"
 flavor_gaul.107.a:0 "Hemos ganado mucha relevancia entre los pueblos galos."
 flavor_gaul.107.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_1$#! ya ha sido #G completada!#!"

 flavor_gaul.108.t:0 "Flota de los [SCOPE.GetRootScope.GetCountry.GetAdjective]"
 flavor_gaul.108.desc:0 "Ha sido una necesidad básica para [SCOPE.GetRootScope.GetCountry.GetName] mantener una fuerza naval respetable para proteger su comercio con los Pritannianos, pero una combinación de aumento del comercio a lo largo de nuestras costas, junto con una divergencia de nuestros buques protectores del comercio con el fin de ayudar a la expansión de nuestras fronteras, había agotado nuestra capacidad naval. \n\nAhora, sin embargo, finalmente hemos logrado construir nuestra flota para cubrir nuestras necesidades ampliadas. Una vez más, estamos bien equipados para defender nuestro comercio de la piratería, así como para proyectar nuestra voluntad a través de nuestras costas de una manera que hasta ahora rara vez hemos imaginado."
 flavor_gaul.108.a:0 "¡Nuestra gran flota dominará los mares!"
 flavor_gaul.108.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_3$#! ya ha sido #G completada!#!"

 flavor_gaul.109.t:0 "Defensa de las costas aremoricanas"
 flavor_gaul.109.desc:0 "A pesar de nuestras tradiciones navales, nuestros asentamientos costeros han estado durante mucho tiempo sujetos a los caprichos de los merodeadores. Al ser un pueblo tan estrechamente vinculado al mar, nuestras casas, por numerosas que sean, están demasiado dispersas como para quedar indefensas ante aquellos que deseen hacernos daño.\n\nPor lo tanto, con gran sabiduría, [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] se encargó [ROOT.GetCountry.GetRuler.GetHerHim] de comenzar la fortificación de todas nuestras ciudades y pueblos más importantes que salpican la costa de Aermorican. Una vez completado este proyecto, nuestra gente finalmente podrá dormir tranquilamente por la noche."
 flavor_gaul.109.a:0 "Los [SCOPE.GetRootScope.GetCountry.GetAdjective] no volverán a ser presa"
 flavor_gaul.109.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_2$#! ya ha sido #G completada!#!"

 flavor_gaul.110.t:0 "Una Aremorica unida"
 flavor_gaul.110.desc:0 "¡Las Galias de nuestra península llevan demasiado tiempo divididas! Aunque solos sólo hemos podido extender nuestras manos de forma limitada, es juntos como el pueblo de Aremorica puede realmente aspirar al poder. Desde los fríos mares del Norte, hasta más allá de las montañas alpinas, ¡que todos los celtas sepan que en Aremorica vive un pueblo indomable, que buscará mayores ambiciones que nunca!"
 flavor_gaul.110.a:0 "¡Ningún hombre puede conquistar a los inflexibles aremoricanos!"
 flavor_gaul.110.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_5$#! ya ha sido #G completada!#!"

 flavor_gaul.111.t:0 "Toma de la costa belga"
 flavor_gaul.111.desc:0 "Los feroces belgas finalmente se inclinan ante nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle], y nuestros maltrechos ejércitos salen victoriosos.\n\nLos belgas son famosos por su valentía y resistencia a la batalla, por lo que sabíamos en lo que nos estábamos metiendo desde el principio. Sin embargo, a pesar del enemigo que teníamos delante, pudimos demostrar nuestra propia intromisión y hemos demostrado que los aremoricanos son supremos.\n\nAhora no tendremos oposición en nuestro comercio en el Mar del Norte."
 flavor_gaul.111.a:0 "¡Victoria para [SCOPE.GetRootScope.GetCountry.GetName]!"
 flavor_gaul.111.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_9$#! ya ha sido #G completada!#!"

 flavor_gaul.112.t:0 "Gran Aremorica"
 flavor_gaul.112.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] apenas puede respirar [ROOT.GetCountry.GetRuler.GetHerHis]. Agotado, [ROOT.GetCountry.GetRuler.GetSheHe] reúne toda la [ROOT.GetCountry.GetRuler.GetHerHis] fuerza para levantar [ROOT.GetCountry.GetRuler.GetHerHis] la mirada hacia el campo de batalla. Los cuerpos están esparcidos por todos lados, pero se puede ver que la mayoría son del enemigo.\n\nSe produjo a un gran costo, y después de interminables marchas y luchas, pero las tierras de estas tribus, tan lejos de nuestra península, finalmente están bajo el mando indiscutible de nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle]. Con la conquista final del área en el área, hemos llevado [SCOPE.GetRootScope.GetCountry.GetAdjective] el gobierno a un nivel inimaginable en los tiempos de nuestros antepasados.\n\nAunque pueden llegar pruebas mayores a nuestro país, hoy podemos estar seguros de que es [SCOPE.GetRootScope.GetCountry.GetName] quien se mantiene supremo."
 flavor_gaul.112.a:0 "¡Gloria a [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]!"
 flavor_gaul.112.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_12$#! ya ha sido #G completada!#!"

 flavor_gaul.113.t:0 "Tributo dumnónico"
 flavor_gaul.113.desc:0 "Uno de los reinos más importantes de los Pritannianos, los Dumnoni son los que comparten la mayor parte de nuestras costumbres entre los pueblos de las islas del Norte. Es apropiado, por lo tanto, que nuestra primera incursión a través del Norte nos permita controlar un pueblo tan familiar. Aunque por ahora sus sentimientos pueden ser de traición, llegarán a ver el valor de la paz y la protección que brindamos a cambio de su estaño y tributo."
 flavor_gaul.113.a:0 "¡Dumnonia es nuestra ahora!"
 flavor_gaul.113.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_6$#! ya ha sido #G completada!#!"

 flavor_gaul.114.t:0 "A través de Pritannia"
 flavor_gaul.114.desc:0 "Nos hemos adentrado profundamente en las tierras de los reinos Pritánicos, no sólo traspasando las vitales costas occidentales de Cambria, sino que también hemos establecido un punto de apoyo a través del mar hasta Hibernia.\n\nAunque hace tiempo que venimos a estas tierras con el fin de ganarnos la vida, ahora ampliamos nuestra familiaridad con esta tierra hasta convertirla en una posesión firme. Con las costas de Pritannian bajo nuestro dominio, el mar que nos rodea no es más que nuestro campo de juego."
 flavor_gaul.114.a:0 "¡Nadie más excepto [SCOPE.GetRootScope.GetCountry.GetName] dominará estos mares!"
 flavor_gaul.114.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_10$#! ya ha sido #G completada!#!"

 flavor_gaul.115.t:0 "Un pueblo del mar"
 flavor_gaul.115.desc:0 "Somos un pueblo nacido junto al océano para morir también en él. Subsistimos de sus frutos, viajamos por él para buscar ganancias comerciales en el extranjero y lo cabalgamos en nuestro camino hacia guerras con reinos opuestos.\n\nEsta larga dependencia que los [SCOPE.GetRootScope.GetCountry.GetAdjective] han tenido de nuestros mares circundantes solo se ha intensificado recientemente, con nuevas aldeas y asentamientos costeros apareciendo por todo [SCOPE.GetRootScope.GetCountry.GetName]. ¡Celebramos esta herencia nuestra, en nuestras historias, poemas y manualidades!"
 flavor_gaul.115.a:0 "Ah, las olas nos llaman más allá del horizonte..."
 flavor_gaul.115.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_4$#! ya ha sido #G completada!#!"

 flavor_gaul.116.t:0 "Comercio con las islas"
 flavor_gaul.116.desc:0 "Los pueblos de Pritannia, con los frecuentes contactos que hacen nuestros reinos, han llegado a compartir mucho con nosotros en cuanto a costumbres. Sin embargo, lo que radica en los intereses de [SCOPE.GetRootScope.GetCountry.GetName] es más que la familiaridad que tenemos con los pritannianos, sino los valiosos productos que provienen sólo del otro lado de las costas del norte.\n\nCon los vínculos comerciales intensificados que nuestros comerciantes han asegurado, todos estos valiosos bienes están llegando a nuestro país en mayores cantidades que nunca."
 flavor_gaul.116.a:0 "¡Deberíamos esforzarnos por profundizar aún más nuestros vínculos con los Pritanni!"
 flavor_gaul.116.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_7$#! ya ha sido #G completada!#!"

 flavor_gaul.117.t:0 "Una nueva ruta del ámbar"
 flavor_gaul.117.desc:0 "La preciosa piedra naranja conocida como lyngourion por los griegos, que alguna vez solo salió del comercio oriental en cantidades minúsculas, se ha vuelto más abundante como resultado de la envidia de nuestros comerciantes más ambiciosos. \n\nHabiendo tratado de aprovechar al máximo los beneficios potenciales que puede generar el comercio de este bien, nuestros comerciantes han viajado a las tierras del noroeste donde se puede encontrar la piedra, haciendo tratos con las diversas tribus que viven a lo largo de la costa del mar Suebic. \n\nAunque siguen siendo un bien caro, los collares y otros artículos elaborados que contienen ámbar se han vuelto cada vez más omnipresentes entre aquellos [SCOPE.GetRootScope.GetCountry.GetAdjective] que pueden permitírselo, ya que nuestras nuevas rutas comerciales directas permiten que una mayor cantidad de ese material llegue a nuestras tierras."
 flavor_gaul.117.a:0 "Y las ganancias traen mayores ingresos a nuestras manos..."
 flavor_gaul.117.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_17$#! ya ha sido #G completada!#!"

 flavor_gaul.118.t:0 "Comercio ampliado del noroeste"
 flavor_gaul.118.desc:0 "Si bien las tierras de las Islas del Norte han estado bajo [SCOPE.GetRootScope.GetCountry.GetAdjective] control desde hace algún tiempo, se había hecho evidente el límite en la cantidad de bienes que podíamos extraer de esas tierras. Desde metales, cerámica, carnes, lana y similares, los puertos existentes se llenarían de mercancías, solo para que nuestros alimentos se pudrieran y los objetos preciosos se perdieran en manos de los bandidos, y solo una pequeña cantidad se enviaría a Aremorica.\n\nSin embargo, nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle] comenzó la construcción de asentamientos y puertos a lo largo de la costa de Pritannian en un intento por remediar este problema. Ahora pueden llegar a nuestra metrópoli mercancías de una magnitud mucho mayor, procedentes de aquellas islas del noroeste."
 flavor_gaul.118.a:0 "¡La importancia de nuestra posesión de Pritania crece inmensamente!"
 flavor_gaul.118.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_23$#! ya ha sido #G completada!#!"

 flavor_gaul.119.t:0 "Mayor que Cartago"
 flavor_gaul.119.desc:0 "Los alcances de nuestras flotas comerciales se han vuelto enormes y nuestra armada ha crecido cada vez más. Si bien alguna vez vimos a los comerciantes de Cartago simplemente como extranjeros amistosos, el aumento del poder de nuestro país los obligó a entablar hostilidades contra nosotros. Y así los cartagineses intentaron cortar nuestras rutas, sabotear nuestras relaciones con otros países y realizar todas las acciones dañinas que uno podría hacer para disminuir a un rival potencial. Sin embargo, todo esto ha quedado en nada.\n\nAhora está claro que nuestro poder comercial y naval ha superado ampliamente al del Imperio de los cartagineses, y nos hemos elevado como tal que ahora estamos perfectamente equipados para llevar nuestra voluntad e influencia a ese mar del Sur que Cartago llama sus aguas de origen."
 flavor_gaul.119.a:0 "¡Nuestra influencia se sentirá más allá de las costas de la Bética!"
 flavor_gaul.119.tt:0 "¡La tarea de misión #Y $barbaricum_aremorica_mission_task_19$#! ya ha sido #G completada!#!"

 #

 flavor_gaul.120.t: "Un guerrero surge de la oscuridad"
 flavor_gaul.120.desc: "[ROOT.GetCountry.GetRuler.GetName] ha hecho saber que [ROOT.GetCountry.GetRuler.GetSheHe] desea conquistar territorios para [ROOT.GetCountry.GetName] - en verdad, no hay nadie que viva cerca de la casa de [ROOT.GetCountry.GetRulerTitle] en [ROOT.GetCountry.GetCapital.GetName] que no haya escuchado los gritos de los guerreros que se entrenan para la batalla, día tras día, pero [ROOT.GetCountry.GetRuler.GetSheHe] ha creído durante mucho tiempo que no estamos del todo preparados para una guerra total contra nuestros vecinos.\n\nPero un día, mientras [ROOT.GetCountry.GetRuler.GetFirstName] se preparaba para salir a cazar, un joven fuertemente armado apareció en la puerta de [ROOT.GetCountry.GetRuler.GetHerHis] y pidió audiencia con [ROOT.GetCountry.GetRuler.GetHerHim].\n\n'¿Quién eres, muchacho, y por qué buscas el [ROOT.GetCountry.GetRulerTitle]?'\n\nColocando su mano sobre su corazón, el soldado se inclinó y habló con una voz ahogada por la emoción. 'Me conocen como [SCOPE.sChar('chattia_character_appears_scope').GetName] y me dijeron que viniera aquí.'\n\nEnarcando una ceja, [ROOT.GetCountry.GetRuler.GetFirstName] gruñó en respuesta. '¿Ven aquí? ¿Quién te envió?'\n\n'Puede que te resulte difícil de creer, pero juro ante todos los dioses que lo que digo es verdad: [GetDeityDefinition('omen_istaevo').GetName] se me apareció en un sueño y me dijo que estaba destinado a luchar en el séquito de [ROOT.GetCountry.GetRuler.GetFirstName].'"
 flavor_gaul.120.a: "¿Es así, joven [SCOPE.sChar('chattia_character_appears_scope').GetFirstName]? Eso ya lo veremos..."
 flavor.gaul.120.tt: "¡La tarea de misión '#Y Un guerrero se levanta de la oscuridad#!' ya ha sido #G completada#!!"

 flavor_gaul.121.t: "Comercio germano-celta"
 flavor_gaul.121.desc: "El flujo comercial entre los #E alemanes#! y los #E galos#! se ha ido acelerando, con muchas caravanas de comerciantes abriéndose paso a través de territorios controlados por [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetRuler.GetName], siempre buscando formas de aumentar la riqueza y el prestigio de las tribus [ROOT.GetCountry.GetAdjective], ha aplicado un pequeño impuesto a las cargas que se transportan a través de nuestro reino; una tarifa que la mayoría está feliz de pagar, al darse cuenta de que un paso seguro por nuestra tierra vale más que el oro."
 flavor_gaul.121.a: "Todo el mundo se beneficia del buen comercio... esto me agrada"
 flavor.gaul.121.tt: "¡La tarea de misión '#Y Comercio germano-celta#!' ya ha sido #G completada#!!"
 chattia_germano_celt_trade_mod: "Comercio germano-celta"
 desc_chattia_germano_celt_trade_mod: "Gracias a nuestra posición fortuita entre las tierras de los alemanes y los galos, nos estamos beneficiando de las rutas comerciales."

 flavor_gaul.122.t: "trabajar los hornos"
 flavor_gaul.122.desc: "Los hornos hambrientos de los [ROOT.GetCountry.GetAdjective] herreros nunca se sacian, porque sus ejércitos siempre necesitan hierro @iron! para sus armas y sus guerreros necesitan metales preciosos @precious_metals! para torques de oro y plata. [ROOT.GetCountry.GetRuler.GetName] ha invertido sabiamente en la construcción de minas en tierras que puedan sustentarlas, y los informes que llegan a [ROOT.GetCountry.GetCapital.GetName] de nuestros ocupados trabajadores son alentadores."
 flavor_gaul.122.a: "¡Dile a los esclavos que trabajen más duro! Tenemos cuotas que cumplir"
 flavor.gaul.122.tt: "¡La tarea de misión '#Y Trabajar los hornos#!' ya ha sido #G completada#!!"
 barbaricum_form_francia_mission_task_8_tt: "Necesitamos poseer al menos #T 1 mina#! en la provincia #G Sicambria#!."

 flavor_gaul.123.t: "Los muchos hijos de Istijo"
 flavor_gaul.123.desc: "Las tribus [ROOT.GetCountry.GetAdjective] han desatado su ira contra sus vecinos, surgiendo de los bosques cercanos a [ROOT.GetCountry.GetCapital.GetName] y conquistando vastas extensiones de territorio en un corto período de tiempo. Incluso [ROOT.GetCountry.GetRuler.GetName] está sorprendido por el nivel de éxito de los ejércitos [ROOT.GetCountry.GetRuler.GetHerHis]. ¿Había subestimado [ROOT.GetCountry.GetRulerTitle] la fuerza de las levas [ROOT.GetCountry.GetRuler.GetHerHis]?\n\nLas numerosas batallas libradas contra los #E galos#! han perfeccionado las habilidades de [ROOT.GetCountry.GetRuler.GetFirstName] hasta el filo de una navaja, y ahora eso Los ejércitos han probado la victoria y claman por la oportunidad de saquear aún más tierras, un deseo que pronto se cumplirá."
 flavor_gaul.123.a: "¡Los triunfantes hijos de [GetDeityDefinition('omen_istaevo').GetName] se darán un festín esta noche!"
 flavor.gaul.123.tt: "¡La tarea de misión '#Y Los muchos hijos de Istijo#!' ya ha sido #G completada#!!"

 flavor_gaul.124.t: "Una capital digna"
 flavor_gaul.124.desc: "A medida que se corre la voz por [ROOT.GetCountry.GetName] sobre las numerosas mejoras realizadas en la capital, miembros de tribus de todo el reino se han dirigido a [ROOT.GetCountry.GetCapital.GetName] con la esperanza de servir personalmente en los ejércitos de [ROOT.GetCountry.GetRuler.GetName]. Se sabe que el [ROOT.GetCountry.GetRulerTitle] es un líder de hombres, uno que cuida de aquellos bajo el mando [ROOT.GetCountry.GetRuler.GetHerHis], y nuestros hermanos, con la esperanza de enriquecerse y hacerse un nombre, han acudido en masa al estandarte [ROOT.GetCountry.GetRuler.GetHerHis]."
 flavor_gaul.124.a: "Hay lugar para todos aquí en [ROOT.GetCountry.GetCapital.GetName]"
 flavor.gaul.124.tt: "¡La tarea de la misión '#Y Una capital digna#!' ya ha sido #G completada#!!"

 flavor_gaul.125.t: "Una fortaleza comercial"
 flavor_gaul.125.desc: "A medida que crece la importancia del comercio dentro de [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetName] ha dado el paso sin precedentes de construir fuertes fortificaciones para proteger el principal [ROOT.GetCountry.GetAdjective] mercado que se encuentra en la capital. Los comerciantes que viajan a través de [ROOT.GetCountry.GetCapital.GetArea.GetName] esperan cruzar nuestras murallas antes del anochecer, sabiendo que el lugar más seguro para ellos y sus mercancías será dentro de la ciudad. Para dar cabida a su creciente número, en [ROOT.GetCountry.GetCapital.GetName] se están construyendo nuevos distritos, lo que en definitiva es un signo de tiempos de prosperidad."
 flavor_gaul.125.a: "Ven, vende tus productos aquí y disfruta del tiempo que pasas con nosotros."
 flavor.gaul.125.tt: "¡La tarea de misión '#Y Una fortaleza comercial#!' ahora ha sido #G completada#!!"
 chattia_trade_fort_mod: "Fortaleza Comercial"
 desc_chattia_trade_fort_mod: "Para proteger sus valiosos ingresos comerciales, se construyó una fortaleza en la principal ciudad comercial de Istvaonics."

 flavor_gaul.126.t: "Derramando sangre gala"
 flavor_gaul.126.desc: "Para muchas de las tribus que viven en la #E Galia#!, el ascenso de [ROOT.GetCountry.GetRuler.GetName] ha sido nada menos que una pesadilla; el atrevido [ROOT.GetCountry.GetRulerTitle] ha reunido a muchos guerreros feroces y los ha desatado en tierras no utilizadas para la guerra, y las fronteras de [ROOT.GetCountry.GetName] se han expandido a un ritmo que ha hecho saltar las alarmas en las aldeas asentadas del interior. Muchos ancianos tribales han convocado reuniones apresuradamente, preguntándose unos a otros con voces temerosas si estaban a salvo de la [ROOT.GetCountry.GetAdjective] amenaza.\n\nPara algunas tribus galas, la respuesta fue no."
 flavor_gaul.126.a: "¡Adelante a la gloria eterna!"
 flavor.gaul.126.tt: "¡La tarea de misión '#Y Derramar sangre gala#!' ya ha sido #G completada#!!"

 flavor_gaul.127.t: "Centralizar el Estado"
 flavor_gaul.127.desc: "Los éxitos disfrutados por [ROOT.GetCountry.GetName] no se deben únicamente a las muchas victorias que sus ejércitos han obtenido en el campo de batalla, aunque estas ciertamente han contribuido, sino que la fuerza política de su gobierno ha asegurado que los [ROOT.GetCountry.GetAdjective] sean capaces de administrar las tierras que han tomado. [ROOT.GetCountry.GetRuler.GetName] ha pasado largas horas discutiendo asuntos con el #E Consejo Tribal#!, asegurándose de que todas las voces dentro de [ROOT.GetCountry.GetCapital.GetName] sean escuchadas y respetadas, y esta cuidadosa atención a los asuntos internos ha dado sus frutos a medida que la tribu continúa centralizándose."
 flavor_gaul.127.a: "Nuestros éxitos futuros están garantizados por lo que hemos logrado hoy."
 flavor.gaul.127.tt: "¡La tarea de la misión '#Y Centralizar estado#!' ya ha sido #G completada#!!"
 chattia_political_influence_modifier: "Chattia centralizada"
 desc_chattia_political_influence_modifier: "Gracias a nuestros esfuerzos por reformar internamente, nuestra influencia política se ha fortalecido."

 flavor_gaul.128.t: "Estándar de barra de hierro"
 flavor_gaul.128.desc: "Gracias a nuestra economía en crecimiento, la necesidad de estandarizar los tipos de hierro @iron! utilizados por nuestros comerciantes y herreros se ha convertido en una necesidad, y [ROOT.GetCountry.GetRuler.GetName] ha estado a la altura de la tarea admirablemente. Aunque era una tarea costosa, [ROOT.GetCountry.GetRuler.GetFirstName] vio la necesidad y supo que tenía que hacerse, y ningún costo impedirá que [ROOT.GetCountry.GetRulerTitle] realice [ROOT.GetCountry.GetRuler.GetHerHis] tareas.\n\nAfortunadamente para nosotros, esta iniciativa ha tenido un éxito tremendo y la producción en todo el ámbito ha aumentado. Nuestros esclavos con exceso de trabajo no están contentos con estos cambios, pero todos los demás disfrutan de los beneficios."
 flavor_gaul.128.a: "Todos los que viven dentro de [ROOT.GetCountry.GetName] deben hacer su parte"
 flavor.gaul.128.tt: "¡La tarea de misión '#Y Estándar de barra de hierro#!' ya ha sido #G completada#!!"

 flavor_gaul.129.t: "Los francos"
 flavor_gaul.129.desc: "Cuando los representantes del #E Consejo Tribal#! se acercaron a [ROOT.GetCountry.GetRuler.GetName] con la noticia, el [ROOT.GetCountry.GetRulerTitle] quedó atónito. Naturalmente, [ROOT.GetCountry.GetRuler.GetSheHe] había anticipado este momento, pero el hecho de que los jefes tribales hubieran llegado a las mismas conclusiones fue inesperado.\n\nFue toda una sorpresa, entonces, cuando los jefes tribales se reunieron en [ROOT.GetCountry.GetCapital.GetName] para pedir que cambiáramos el nombre de nuestro reino. ¿Éramos realmente la tribu [ROOT.GetCountry.GetName] o éramos algo más grande? Nuestras tierras habían prosperado, nuestros ejércitos habían conquistado y nuestras fronteras se habían hecho más grandes de lo que cualquiera de nuestros antepasados ​​hubiera podido soñar. ¿Era hora de deshacerse del antiguo nombre y abrazar uno nuevo, uno que reflejara la grandeza de nuestro pueblo y la gloria de nuestro futuro? La respuesta fue sí: ya no somos [ROOT.GetCountry.GetName], pero somos algo más grande.\n\nY así se decidió que abrazaríamos una nueva identidad. Como principal arquitecto del éxito de nuestro reino durante estos tiempos de transformación, [ROOT.GetCoutnry.GetRuler.GetFirstName] tuvo el honor de elegir el color de nuestro nuevo estandarte. Existen dos bandos, firmemente arraigados en sus opiniones: aquellos que desean ver un #COLOR:{0.25,0.30,0.73} azul#! fresco erguido fuerte y orgulloso en el viento, y aquellos que preferirían un clásico #COLOR:{0.55,0.05,0.05} rojo#! sobre la capital, similar a la brillante luz del sol. ¿Qué color elegirás?"
 #flavor_gaul.129.a: "You are our natural King...[GetDeityDefinition('omen_istaevo').GetName] grants you this title, not us"
 flavor_gaul.129.a: "Una bandera azul y el color nacional azul, los colores de nuestro río."
 flavor_gaul.129.b: "Una bandera roja y el color nacional rojo, los colores de una llama dorada."
 flavor_gaul.129.c: "Una bandera roja con el color nacional azul, lo mejor de ambos mundos."
 flavor_gaul.129.d: "¡Verde pútrido, mi color favorito!"
 flavor.gaul.129.tt: "¡La tarea de misión '#Y Los francos#!' ya ha sido #G completada#!!"
 flavor.gaul.129.red_tt: "Adoptaremos una bandera #COLOR:{0.80,0.20,0.20} roja#! y un color de mapa #COLOR:{0.80,0.20,0.20} rojo#!."
 flavor.gaul.129.blue_tt: "Adoptaremos una bandera #COLOR:{0.30,0.55,0.93} azul#! y un color de mapa #COLOR:{0.30,0.55,0.93} azul#!."
 flavor.gaul.129.red_blue_tt: "Adoptaremos una bandera #COLOR:{0.80,0.20,0.20} roja#! y un color de mapa #COLOR:{0.30,0.55,0.93} azul#!."
 flavor.gaul.129.green_tt: "Adoptaremos un... #COLOR:{0.5,0.66,0.21} verde pútrido#! color de bandera y mapa."

 flavor_gaul.130.t:0 "Sallandia"
 flavor_gaul.130.desc:0 "El castro de [SCOPE.sProvince('batavian_city_scope').GetName] finalmente ha sido terminado, y algunos de nuestro pueblo, ahora llamados #COLOR:{0.207,0.301,1} francos salianos#!, han comenzado a colonizarlo y los pantanos alrededor del delta del #E Rinaz#!, que forman la ''isla'' de #E Batavia#!.\n\nAl ser un lugar tan pantanoso, plagado de enfermedades y de difícil acceso, provocó que muchos buenos esclavos murieran en la construcción, y las condiciones de vida en [SCOPE.sProvince('batavian_city_scope').GetName] no son las mejores, con suministros difíciles de encontrar y otros problemas de ese tipo. Muchos de los que se establecieron en esta nueva tierra están empezando a hablar de nuevo de reasentamiento en un lugar más habitable..."
 flavor_gaul.130.a:0 "Veremos a dónde les lleva esto."
 flavor.gaul.130.tt:0 "¡La tarea de misión '#Y Salland#!' ahora ha sido #G completada#!!"

 flavor_gaul.131.t:0 "Ripuaria"
  flavor_gaul.131.desc:0 "Mientras que al norte nuestros primos se asentaron en tierras baldías, los pastos en [GetProvince('(int32)3726').GetArea.GetName] son muy disputados; Hay muchas incursiones por aquí cada primavera y verano, y la violencia entre las tribus celtas solo se ve exacerbada cuando nosotros llegamos de vez en cuando.\n\nAhora, los #COLOR:{0.361,0.807,0.525} ripuarios#! se están asentando en el área. Mucho antes de cruzar el #E Rinaz#! hacia sus nuevos hogares habían planeado venir aquí, tierra de vida fácil y cielos azules. Aún así, muchas amenazas acechan a esta gente, mientras las tribus río arriba se preparan para roer a los que no están preparados..."
 flavor_gaul.131.a:0 "¡Siempre hay algo que hacer, un enemigo que aplastar!"
 flavor.gaul.131.tt:0 "¡La tarea de misión '#Y Ripuaria#!' ahora ha sido #G completada#!!"

 flavor_gaul.132.t:0 "Resolver Toxandría"
 flavor_gaul.132.desc:0 "Los altos y oscuros árboles de Toxandria ocultaron sus secretos hasta el punto en que nuestros ejércitos cruzaron el #E Rinaz#!; Lo que se presentaba como una tierra fértil y abundante vuelve a ser húmeda, húmeda y fangosa. Algunos ancianos que los acompañaron castigan a sus líderes, como [SCOPE.sChar('salian_chieftain_scope').GetName] por las dos migraciones forzadas y, en última instancia, decepcionantes, fuera de la tierra donde reinaban nuestros antiguos.\n\nSin embargo, eso ya es el pasado, y los #COLOR:{0.207,0.301,1} francos salianos#! ahora deben trabajar muy duro para establecerse una vida en estas antiguas tierras celtas; han decidido tener sus consejos en un lugar que ahora llaman #E Tohsandrjo Bairgaz#!."
 flavor_gaul.132.a:0 "¡Déjate encoger de hombros y luego ponte a trabajar!"
 flavor.gaul.132.tt:0 "¡La tarea de misión '#Y Liquidar Toxandria#!' ya ha sido #G completada#!!"

 flavor_gaul.133.t:0 "El valle de Moginos"
 flavor_gaul.133.desc:0 "La bucólica llanura de Mogino es extensa y muy acogedora para la vida; Nuestros hombres descubrieron que la mayoría de las industrias aquí provienen de los bosques y los animales, es un lugar feliz para vivir, uno del que una vez más hemos desalojado a los debilitados celtas sin grandes problemas.\n\nBajo [GetDeityDefinition('omen_istaevo').GetName] nosotros #COLOR:{0.361,0.807,0.525} los ripuarios#! hemos conocido victorias en países que nunca habíamos soñado, tal es el poder de su bendición."
 flavor_gaul.133.a:0 "Otro refugio seguro para las familias."
 flavor.gaul.133.tt:0 "¡La tarea de misión '#Y El valle de Moginos#!' ya ha sido #G completada#!!"

 flavor_gaul.134.t:0 "A lo largo del Rinaz"
 flavor_gaul.134.desc:0 "Los #COLOR:{0.361,0.807,0.525} francos ribereños#! han dejado que sus espadas desafíen el curso del río, río arriba hacia tierras desconocidas, con sus escudos bloquearon los ataques de los feroces [GetCulture('ubian').GetName]#E celtas#!, y con sus pies corrieron colinas, bosques y empalizadas, desafiando la fatiga a la que están sujetos los hombres menores, en una marcha hacia tierras hasta ahora desconocidas para ellos. Ahora controlan la mayor parte del flujo del gran Rinaz, lo que no es una tarea fácil."
 flavor_gaul.134.a:0 "Valor y hierro."
 flavor.gaul.134.tt:0 "¡La tarea de misión '#Y A lo largo del Rinaz#!' ya ha sido #G completada#!!"

 flavor_gaul.135.t:0 "Toxandria, la otrora estéril"
 flavor_gaul.135.desc:0 "Se han hecho muchos esfuerzos para hacer esta región más habitable; algunos canales menores excavados entre tierras de cultivo, algunos bosques talados para convertirlos en campos, y lo que era un entorno hostil ahora es un lugar razonable para vivir.\n\nDesde entonces, muchas aldeas han sido construidas por gente nueva que se estableció al otro lado del río, ya que no hay suficiente comida para todos allí, y las antiguas costumbres celtas han sido desplazadas por [GetReligion('germanic_religion').GetName] santuarios y festivales, ahora se adora a verdaderos dioses aquí. ¡La caza salvaje ha cruzado el #E Rinaz#!!"
 flavor_gaul.135.a:0 "¡Un logro enorme!"
 flavor.gaul.135.tt:0 "¡La tarea de misión '#Y Toxandria, la otrora estéril#!' ya ha sido #G completada#!!"

 flavor_gaul.136.t:0 "Empujar hacia el oeste"
 flavor_gaul.136.desc:0 "''Nunca hemos estado acostumbrados a un clima como este, veranos cálidos, inviernos con poca nieve y campos tan verdes como las piedras preciosas más raras. Nosotros, los #COLOR:{0.207,0.301,1} Salian Franks#!, hemos realizado nuestro destino: encontrar un hogar donde vivir no sea una dificultad, sino un placer'' volviéndose hacia los guerreros reunidos a la izquierda del montículo, [SCOPE.sChar('salian_chieftain_scope2').GetName] se rió y dijo;\n\n''Y en el último mes he visto a los guerreros de mi banda desnudos en el campo una cantidad extraña de veces (lo admito). El calor es insoportable aquí), y todos parecemos haber desarrollado un extraño apetito por los caracoles y los pájaros pequeños durante estos difíciles meses de campaña, pero ahora estamos aquí y nos hemos asentado en una tierra divina. ¡Todos los aplausos para nosotros y para la banda de guerra de [SCOPE.sChar('salian_warband_leader_scope').GetName]!"
 flavor_gaul.136.a:0 "¡Hurra!"
 flavor.gaul.136.tt:0 "¡La tarea de misión '#Y Empujar hacia el oeste#!' ahora ha sido #G completada#!!"

 flavor_gaul.137.t:0 "Conversión germánica"
 flavor_gaul.137.desc:0 "Los carros que subían por el Rinaz, con sus ruedas rozando el agua y lanzando salpicaduras por todas partes, ahora han asentado sus atronadoras ruedas y han golpeado el martillo de nuestros dioses en esta tierra virgen.\n\nLas #COLOR:{0.356,0.141,0} Fraujaz#! celebran nuevas ceremonias en estas tierras, unas que respetan a nuestros dioses tradicionales."
 flavor_gaul.137.a:0 "Nosotros, los portadores de nuestros dioses en este mundo, somos dignos de alabanza."
 flavor.gaul.137.tt:0 "¡La tarea de misión '#Y Conversión germánica#!' ahora ha sido #G completada#!!"

 flavor_gaul.138.t:0 "Turnacum y camaracum"
 flavor_gaul.138.desc:0 "Es una suerte que dos grupos de #COLOR:{0.207,0.301,1} francos salianos#! colonizaran de forma independiente dos lugares tan atractivos para establecerse. Estas dos nuevas ciudades sirven a la parte occidental del territorio [ROOT.GetCountry.GetAdjective] como sus centros administrativos y, como tales, no han tenido muchos problemas para expandirse más allá de sus muros originales. Tuvimos que mejorar nuestras habilidades de construcción de burgos y demolimos muchas de las casas originales, ya que la miseria en algunos de los vecindarios se volvió casi insoportable."
 flavor_gaul.138.a:0 "Ganancias inesperadas de la vida."
 flavor.gaul.138.tt:0 "¡La tarea de misión '#Y Turnacum y Camaracum#!' ya ha sido #G completada#!!"

 flavor_gaul.139.t:0 "Fortalecer nuestras fronteras occidentales"
 flavor_gaul.139.desc:0 "Algunos decían que la civilización y sus costumbres ociosas suavizarían los [GetCulture('istvaeonic').GetName]#E s#! y olvidaríamos la dureza con la que nacimos. Sin embargo, con los rumores del conflicto en la Galia, esto ha sido refutado, ya que se han erigido muchos nuevos fuertes en las colinas, una estructura que no se había construido durante bastante tiempo, a lo largo del [GetProvince('(int32)9168').GetName], ahora modernizado para el nuevo tipo de guerra.\n\nNo hay duda de que este río es ahora una línea defensiva con una organización como pocos en el norte han visto jamás."
 flavor_gaul.139.a:0 "No hay piedad para aquellos que se atrevan a intentar cruzar."
 flavor.gaul.139.tt:0 "¡La tarea de misión '#Y Fortificar nuestras fronteras occidentales#!' ya ha sido #G completada#!!"

 flavor_gaul.140.t:0 "Salianos triunfantes"
 flavor_gaul.140.desc:0 "La prosperidad posible en las #COLOR:{0.207,0.301,1} tierras salianas#! hizo que estos francos ganaran rápidamente influencia en el gobierno, lo que ahora ha culminado con el traslado de toda la corte y todos los jefes a [GetProvince('(int32)3045').GetName], una tierra tan distinta de la nuestra, pero tan hermosa, junto al mar y naturalmente defendible, y en un solo puñado de suelo se encuentran un millón de posibilidades.\n\nNo sólo esto, sino que en él hay campos yace el presagio de una nueva era para los [GetCulture('istvaeonic').GetName]#E s#!, lejos de nuestras tierras originales pero aún con la fuerza interior que nos permitió llegar hasta aquí. Se acabaron los belicosos suevos, los inviernos mortíferos y los campos cultivables. Ahora somos imparables."
 flavor_gaul.140.a:0 "¡Al oeste!"
 flavor.gaul.140.tt:0 "¡La tarea de misión '#Y Salians Triumphant#!' ahora ha sido #G completada#!!"

 flavor_gaul.141.t:0 "Ripuarios triunfantes"
 flavor_gaul.141.desc:0 "La vida posible en los ríos que fluyen a través de las tierras #COLOR:{0.207,0.301,1} Salian#! los convirtió en el principal objetivo de la migración de los demás, y algunos ya sueñan con grandes [GetCulture('istvaeonic').GetName] ciudades en estos lugares, un sueño lejano pero no del todo imposible.\n\nUna gran procesión del jefe, seguida por su tribu muy leal, de [GetProvince('(int32)3831').GetName] a [GetProvince('(int32)3690').GetName], y justo al lado la procesión avanza, invisible, presagiando una nueva era para el [GetCulture('istvaeonic').GetName]#E s#!, lejos de nuestras tierras originales pero aún con la fuerza interior que nos permitió llegar hasta aquí. Se acabaron los belicosos suevos, los inviernos mortíferos y los campos cultivables. Ahora somos imparables."
 flavor_gaul.141.a:0 "¡A las orillas del río!"
 flavor.gaul.141.tt:0 "¡La tarea de misión '#Y Ripuarios triunfantes#!' ya ha sido #G completada#!!"

 flavor_gaul.142.t:0 "La revuelta de los suevos"
 flavor_gaul.142.desc:0 "Con tanta gente migrando hacia el oeste, los [GetCulture('irminonic').GetName] pueblos del este de nuestro reino, con cada vez menos miembros de nuestras tribus en el área, han decidido abandonar su subjetividad y escupir en la cara de quienes alguna vez fueron sus señores, nosotros.\n\nLas diferentes tribus suevas ahora se reúnen alrededor del viejo y ambicioso jefe [SCOPE.sCountry('cheruscia_revolt_scope').GetRuler.GetName] del #E Cheruscii#! tribu, que ha enviado mensajeros ofreciéndonos paz (que vendrá con ofrendas de gratitud) o una guerra de sangre, fuego y muerte.\n\nMuchos en las bandas de guerra han comenzado a irritar a sus hermanos por la próxima aniquilación de esos belicistas. La verdad es que la estampida hacia el oeste ha dejado nuestros antiguos territorios bastante vacíos y tendríamos que estirar seriamente nuestros ejércitos para poder siquiera luchar, y la mayoría en el oeste no tiene intención de luchar por los antiguos territorios que dejaron."
 flavor_gaul.142.a:0 "No nos importan esas chozas embarradas, déjalas en paz."
 flavor_gaul.142.b:0 "¡No tenemos otra opción, debemos marchar por nuestro honor!"
 flavor.gaul.142.tt:0 "¡La tarea de la misión '#Y La revuelta de los suevos#!' ya ha sido #G completada#!!"
