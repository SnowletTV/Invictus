l_spanish:
 flavor_germanics.1.t:0 "La Gran Inundación"
 flavor_germanics.1.desc:0 "Días de lluvia y tormentas hicieron que nuestra gente en [germanics_1_target.GetName] temiera que el fin de los días estaba cerca. Sin embargo, estos no anunciaban el final, sino una gran inundación que se tragó casas, animales y humanos por igual, todos destinados a no volver a ver la luz del día.\n\nDespués de que todo terminó, los sobrevivientes alabaron a los dioses, pero ahora se enfrentan al gran desafío de reconstruir lo que una vez fue. La tierra aún se inunda dos veces al día, creando miles de pequeñas islas completamente rodeadas de agua, pero el agua está retrocediendo lentamente...\n\nNuestra gente espera que apartemos algunos de nuestros fondos para intentar ayudar a los necesitados y aprovechar al máximo la situación."
 flavor_germanics.1.a:0 "Gastar dinero."
 flavor_germanics.1.b:0 "Utilizar el ejército como mano de obra."
 flavor_germanics.1.c:0 "Están solos."
 flavor_germanics.1.tt:0 "Hasta el #Y 20%#! de la población de #Y [THIS.GetProvince.GetName]#! es asesinada por la inundación."
 flavor_germanics.2.t:0 "Asentamiento de Terps"
 flavor_germanics.2.desc:0 "El reciente aumento de la población ha llevado a una mayor demanda de tierra habitable. Algunos de nuestros hombres han propuesto imitar los asentamientos de terps frisios, que ellos erigieron hace varios siglos. La costa de Amsivaria parece un buen lugar para acumular barro y crear terps y construir casas sobre estos para protegerlas de las inundaciones. Sin embargo, necesitaríamos enviar a algunos de nuestros hombres para ayudarlos."
 flavor_germanics.2.a:0 "Construir tal asentamiento."
 flavor_germanics.2.b:0 "Hay otros asuntos más importantes."
 flavor_germanics.4.t:0 "Muerte de un Ser Querido"
 flavor_germanics.4.desc:0 "Después de la muerte de [SCOPE.sChar('rip_dead_dog').GetName], la gente ha intentado consolarme, pero nunca sentí que realmente entendieran. Ahora tiendo a evitarlos y su charla ociosa. Sin embargo, hay un alma cuya compañía no he despreciado: un perro marrón que participó en el ritual de encarnación del cuerpo de [SCOPE.sChar('rip_dead_dog').GetName] y muestra un comportamiento similar. Tal vez el sacerdote me aconsejó correctamente y nuestros seres queridos realmente viven en los perros después de una ceremonia apropiada."
 flavor_germanics.4.a:0 "Bonito perrito, me entiendes mejor que nadie."
 flavor_germanics.5.t:0 "Muerte de Tu Perro"
 flavor_germanics.5.desc:0 "Tu fiel y confiable perro finalmente ha dado su último suspiro. Te ha servido durante mucho tiempo desde que reconociste a tu ser querido fallecido en su comportamiento, pero ahora es momento de enterrar a tu viejo amigo."
 flavor_germanics.5.a:0 "Lo enterraré en silencio."
 flavor_germanics.6.t:0 "El Bosque Sagrado de Mannus"
 flavor_germanics.6.desc:0 "Una vez más ha llegado el momento, el sacrificio a Mannus ocurrirá esta noche. Como siempre estamos encadenados, mostrando nuestra sumisión a nuestro gran Dios. Por suerte, nadie cayó esta vez, un buen augurio. El año pasado, el hijo del chamán tuvo que rodar por el suelo, después de haber caído. El año pasado nos trajo muchas tormentas y la cosecha fue mala. Esto fue seguramente causado por el joven torpe.\n\nEl sacrificio de este año se encuentra orgulloso en el medio del terreno sagrado, atado al viejo roble detrás de él. Sus rasgos son apenas reconocibles, ya que los últimos rayos del sol del día me ciegan, la voluntad de Mannus lo oculta de mi vista. Ya el chamán se acerca a la víctima, presionando el filo del cuchillo contra su pecho, provocando que las primeras gotas de sangre caigan sobre el retoño de roble debajo de él. Su sangre renovará los bosques y la tierra. Para proteger a nuestras comunidades y mejorar nuestras cosechas, se le ofrece a Mannus. Ahora, la hoja está perforando su corazón, su último aliento nos maldice, pero enciende el fuego de la vida.\n\nYa, los pájaros han comenzado a cantar y regocijarse, llenando el vacío dejado por la muerte del sacrificio."
 flavor_germanics.6.a:0 "¡Mannus, concédenos fuerza!"
 flavor_germanics.6.b:0 "Oponerse al ritual."
 flavor_germanics.7.t:0 "El Carro de Nerthuz hacia las Profundidades"
 flavor_germanics.7.desc:0 "Es hora de que nuestro sacerdote vuelva a montar el carro de Nerthuz, el tiempo de guerra ha terminado. La espada será reemplazada por el arado, la fértil tierra sembrada con granos. Cuando Nerthuz visita nuestros hogares, habrá más niños, la fertilidad de las mujeres es mayor que antes. Todos están bendecidos por su viaje sobre la tierra, hasta que se cansa de él. Su primer siervo seguirá a su señora hacia su dominio en el océano. Allí, el sacerdote volverá a encerrar el carro, después de que los esclavos lo hayan lavado y lo hayan adornado con flores y oro. Luego, los esclavos son devorados por el océano, el último sacrificio a Nerthuz, hasta que despierte una vez más y bendiga la tierra con su presencia."
 flavor_germanics.7.a:0 "¡Nerthuz, bendícenos!"
 flavor_germanics.7.b:0 "¡Detén al sacerdote!"
 
 flavor_germanics.8.t:0 "Ariovisto"
 flavor_germanics.8.desc:0 "En los últimos años, hay un hombre en nuestras filas que poco a poco se ha ido labrando un nombre y una reputación: [SCOPE.sCharacter('ariovistus_character').GetName]. Un veterano de muchas de las guerras de [ROOT.GetCountry.GetRuler.GetName] que también ha pasado muchos años luchando en # Galia#!, donde obtuvo el título honorífico de #E 'Ariovisto'#! - un apodo que sólo se otorga a los grandes líderes militares.\n\n[SCOPE.sCharacter('ariovistus_character').GetFirstName] es un verdadero guerrero suebio que ha luchado y ganado muchas batallas, y durante estas campañas, ha aprendió el idioma #E galo#!; una habilidad que, junto con sus contactos con los #E Vangiones#!, #E Nemetes#! y #E Tribocci#!, podría ayudarnos a formar una alianza con estas tribus.\n\nEntre nuestras tribus, cada vez más voces piden su liderazgo, como Los logros de [ROOT.GetCountry.GetRuler.GetFirstName] palidecen en comparación con los logros de Ariovistus."
 flavor_germanics.8.a:0 "Hacer de Ariovisto nuestro nuevo gobernante."
 flavor_germanics.8.b:0 "¡Es solo un advenedizo!"

 NICKNAME_ARIOVISTUS:0 "Ariovisto"
 FAMILY_ARIOVISTID:0 "Ariovistid"
 ariovistid:0 "Sangre de Ariovisto"
 ariovistid_desc:0 "Ariovistus es un título honorífico galo para un gran líder militar. Se concedió a un guerrero suebio que luchó y ganó muchas batallas, a veces junto a sus parientes y otras entre los galos. Durante estas campañas en el extranjero, aprendió el idioma galo y forjó alianzas con varias tribus galas. Aunque su nombre original desapareció, sus hazañas aún se recuerdan hasta el día de hoy.\n\n#G Este rasgo será heredado por la descendencia de [CHARACTER.GetPraenomen].#!"
 flavor_germanics.9.t:0 "Los Aliados de Ariovisto"
 flavor_germanics.9.desc:0 "Los contactos de Ariovisto con los galos que viven al sur nos han asegurado 'alianzas' con ellos, ya que obviamente son subordinados a nosotros, los suevos, en forma de tributarios."
 flavor_germanics.9.a:0 "Serán unos «aliados» formidables."

 flavor_germanics.10.t:0 "El Matrimonio Norico"
 flavor_germanics.10.desc:0 "Una vez que [ROOT.GetCountry.GetRuler.GetName] decidió que [ROOT.GetCountry.GetRuler.GetSheHe] buscaría una novia de las #E tribus noricanas#! que vivían en nuestro sur, los mensajeros partieron de [ROOT.GetCountry.GetCapital.GetName] al cabo de una semana. A estos diplomáticos tribales se les asignó la tarea de encontrar una pareja adecuada, una que fuera beneficiosa políticamente, aunque [ROOT.GetCountry.GetRuler.GetFirstName] también dejó en claro que estaba especialmente interesado en tener una esposa que también fuera hermosa.\n\nAl cabo de un mes, nuestros diplomáticos regresaron y [ROOT.GetCountry.GetRuler.GetFirstName] conocieron a [SCOPE.sChar('noric_princess').GetName], la hija de un poderoso jefe noricano."
 flavor_germanics.10.a:0 "[SCOPE.sChar('noric_princess').GetFirstName], es un placer conocerte"
 flavor_germanics.10.b:0 "Hay mejores partidos esperando."

 flavor_germanics.11.t:0 "La Liga Lugiana"
 flavor_germanics.11.desc:0 "Los #E Vándalos#! están notoriamente divididos en varias tribus diferentes y son extremadamente conflictivos: no les gusta renunciar a sus lealtades tribales y honrarán sus votos. Si queremos que los vándalos prosperen, debemos unirlos en una confederación bajo los auspicios de [GetDeityDefinition('omen_lugus').GetName], el #E dios celta#! de los herreros, ya que los dioses celtas son aparentemente superiores a nuestras antiguas creencias.\n\nSi lográramos organizar a nuestros aliados dispersos y las facciones menores e independientes, nuestra hegemonía sería indiscutible."
 flavor_germanics.11.a:0 "Enviar las invitaciones."

 flavor_germanics.12.t:0 "La Liga Lugiana"
 flavor_germanics.12.desc:0 "Los embajadores de [SCOPE.sC('mission_country_lugia').GetName] han venido a nosotros con una oferta. Las tribus vándalas son débiles mientras permanecen solas, y Europa Central ha sido el campo de batalla de los celtas durante demasiado tiempo. Afirman que si los vándalos han de prosperar, debemos unirnos en una confederación bajo la égida de Lugus, el dios celta de los herreros, ya que los dioses celtas parecen ser superiores a nuestras viejas creencias. \n\nLa propuesta es escandalosa, pero quizás no tengamos elección, ya que una liga fuerte bajo la protección de un líder fuerte podría ser nuestra única oportunidad de supervivencia."
 flavor_germanics.12.a:0 "Unirse a la liga."
 flavor_germanics.12.b:0 "¡Defender nuestra soberanía!"
 flavor_germanics.13.t:0 "El Barco de Nehalennia"
 flavor_germanics.13.desc:0 "Nehalennia, te agradecemos por un año de suelo fértil, mujeres y cosechas. Nacieron muchos niños, bendecidos con miembros y espíritu saludables. Los cultivos crecieron en abundancia, por esto agradecemos a tu sacerdote, que te trajo a nosotros hace muchas estaciones. Te agradecemos por la protección de los vivos contra los espíritus malignos y la protección de los muertos hasta que lleguen a la otra vida. Este peligroso camino hacia el reino de los muertos, tú lo proteges. Tu barco los transporta a todos y lleva a los recién nacidos al seno de sus madres. Te agradecemos, Nehalennia, por escuchar nuestras súplicas y por cumplirlas."
 flavor_germanics.13.a:0 "¡Alabada sea Nehalennia!"

 flavor_germanics.14.t:0 "El Desierto Helvetio"
 flavor_germanics.14.desc:0 "Aunque nuestros #E guerreros suevos#! tienen fama de dejar un rastro de destrucción desenfrenada a su paso, la brutal invasión y conquista de los #E asentamientos helvéticos#! serían recordados durante los siglos venideros por su impactante violencia y crueldad. Nuestros ejércitos quemaron decenas de asentamientos helvéticos, mataron a cientos y esclavizaron a miles y devastaron el campo en el proceso.\n\nEn los años venideros, los restos dispersos de las tribus helvéticas llamarían a esta tierra desierto, un lugar maldito por los dioses, y recordarían los terribles ejércitos de [ROOT.GetCountry.GetRuler.GetName] y se estremecerían de horror."
 flavor_germanics.14.a:0 "¡El mundo arderá!"

 flavor_germanics.15.t:0 "La Caída de los Aedui"
 flavor_germanics.15.desc:0 "Los soldados de [ROOT.GetCountry.GetRuler.GetName] han triunfado una vez más, destruyendo a todos los que fueron lo suficientemente tontos como para enfrentarse a ellos. El #E oppidum eduo#! está en ruinas, los eduos están dispersos y nuestros guerreros saquearon todo lo que pudieron encontrar.\n\nEn medio de esta agitación, los eduos enviaron #E druidas#! emisarios a través de la #E Galia#! rogando por ayuda, pero su misión no tuvo éxito, porque nadie quiere ayudar a los arrogantes heduos contra nuestro poder."
 flavor_germanics.15.a:0 "¡El mundo arderá!"

 flavor_germanics.16.t:0 "La Caída de los Ubii"
 flavor_germanics.16.desc:0 "Finalmente, el oppidum #E Ubian#! ha caído. La batalla fue bastante feroz, ya que nuestros guerreros tuvieron que luchar cuesta arriba y romper tres murallas circulares, y aunque innumerables guerreros cayeron en ambos lados, el resultado de la batalla nunca estuvo en duda. Una vez que nuestros guerreros finalmente lograron romper sus defensas, saquearon todo lo que pudieron encontrar: cualquier cosa de valor fue sacada de las ruinas humeantes de la ciudad.\n\nDespués de sufrir una pérdida tan devastadora, los Ubii ya no podrán ayudar a los #E galos#! al oeste del Rhenus."
 flavor_germanics.16.a:0 "¡El mundo arderá!"

 flavor_germanics.17.t:0 "Rex Germanorum"
 flavor_germanics.17.desc:0 "Sólo seis pasos. Entonces [ROOT.GetCountry.GetRuler.GetName] estaría en el destino final de sus ambiciosos planes; sentado en el trono como ungido #E Rex Germanorum#!, el título que los #E romanos#! llamaban [ROOT.GetCountry.GetRuler.GetHerHim] incluso antes de este día.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] habría cargado preferiblemente los últimos seis escalones, un feroz [ROOT.GetCountry.GetAdjective] grito de batalla en [ROOT.GetCountry.GetRuler.GetHerHis] labios, pero fuera de Deferencia a la majestuosidad del momento, [ROOT.GetCountry.GetRuler.GetSheHe] caminaba paso a paso con dignidad. Cuando [ROOT.GetCountry.GetRuler.GetSheHe] se paró ante el trono sin pretensiones, [ROOT.GetCountry.GetRuler.GetFirstName] hizo una pausa momentánea, [ROOT.GetCountry.GetRuler.GetHerHis] de espaldas a la audiencia. Respirando profundamente, [ROOT.GetCountry.GetRuler.GetSheHe] se giró y se detuvo nuevamente, mientras miraba triunfante y severamente a la asamblea dispersa y arrodillada en el suelo.\n\nUn sentimiento embriagador fluyó a través de [ROOT.GetCountry.GetRuler.GetHerHim] en ese momento... una curiosa mezcla de omnipotencia, infalibilidad y orgullo. Después de lo que pareció una eternidad, [ROOT.GetCountry.GetRuler.GetFirstName] finalmente habló ante la asamblea reunida, pronunciando palabras que pronto se volverían inmortales en la [ROOT.GetCountry.GetAdjective] historia."
 flavor_germanics.17.a:0 "¡Inclínate ante mí!"
 flavor_germanics.17.b:0 "Agradezco el honor, pero no es el momento adecuado..."
 flavor_germanics_17_tt: "#Y Si rechazas ahora la monarquía, tendrás acceso a más contenido del#! #T árbol «El ascenso de Germania»#!#Y .#!"

 flavor_germanics.18.t:0 "Al otro lado de los Albis"
 flavor_germanics.18.desc:0 "Ahora que nuestro #E Consejo Tribal#! ha decidido que abandonaremos la seguridad de [ROOT.GetCountry.GetCapital.GetName] para vadear las aguas impetuosas del #E río Albis#!, ha surgido una discusión entre los #E jefes tribales#! sobre quién será el primero en cruzar a la otra orilla.\n\n[SCOPE.sCharacter('clan_chief_one').GetName], un guerrero feroz que es conocido por salirse con la suya, afirma que su experiencia en el campo de batalla le ha valido el derecho, mientras que su hermano Chieftain, el valiente [SCOPE.sCharacter('clan_chief_two').GetName], argumenta que las levas de los [SCOPE.sCharacter('clan_chief_two').GetFamily.GetName] merecen la oportunidad de demostrar que son iguales a los #E [SCOPE.sCharacter('clan_chief_one').GetFamily.GetName]#!.\n\n[ROOT.GetCountry.GetRuler.GetName], que está claramente molesto porque las luchas internas entre los Chieftains ya han comenzado, tiene que tomar una decisión."
 flavor_germanics.18.a:0 "Pongo mi fe en [SCOPE.sCharacter('clan_chief_one').GetFirstName] - un guerrero probado"
 flavor_germanics.18.b:0 "Te seguiremos, [SCOPE.sCharacter('clan_chief_two').GetFirstName], así que no nos decepciones"
 flavor_germanics.18.c:0 "¡El honor de guiar a nuestros guerreros a través del río es mío!"
 flavor_germanics.18.tooltip:0 "¡La tarea de misión '#Y A través de los Albis#!' ya ha sido #G completada#!!"

 flavor_germanics.19.t:0 "Aliados del Norte"
 flavor_germanics.19.desc:0 "Ahora que hemos resuelto la cuestión de los belicosos norteños que han amenazado nuestras fronteras, [ROOT.GetCountry.GetRuler.GetName] se complace al saber que muchos de los #E guerreros escandinavos#! han hecho juramentos de lealtad al #E [ROOT.GetCountry.GetRuler.GetFamily.GetName] clan#!. En lugar de conspirar contra nosotros, buscan unir sus fuerzas a las nuestras con la esperanza de destruir a nuestros enemigos mutuos, porque los escandios han visto el botín y el botín que hemos adquirido y desean enriquecerse.\n\nLo único que [ROOT.GetCountry.GetRulerTitle] necesita decidir es cómo deben luchar estos guerreros escandinavos; ¿Deberían centrarse en destruir a nuestros enemigos, o deberían [ROOT.GetCountry.GetRuler.GetFirstName] darles permiso para atacar a su gusto?"
 flavor_germanics.19.a:0 "Aplastemos a nuestros enemigos y luego saqueemos sus tierras después del hecho."
 flavor_germanics.19.b:0 "¡Una moneda de oro para el soldado que capture más esclavos!"
 flavor_germanics.19.tooltip:0 "¡La tarea de misión '#Y Aliados del Norte#!' ya ha sido #G completada#!!"
 suebians_choose_military_bonus_tt:0 "Podremos seleccionar un #R Bono militar#! para nuestros ejércitos."

 flavor_germanics.20.t:0 "Expulsar a los usipetes y tencteri"
 flavor_germanics.20.desc:0 "Nuestros guerreros victoriosos han aplastado a los débiles ejércitos de los #E Usipetes#! y los #E Tencteri#!. Los esclavos fueron encadenados y arrastrados de regreso a [ROOT.GetCountry.GetCapital.GetName], y a cualquiera que fuera lo suficientemente tonto como para resistir los esfuerzos de nuestros ejércitos se le quitó la cabeza del cuerpo; el salvaje [ROOT.GetCountry.GetRuler.GetName] no tolerará ningún desafío al gobierno de [ROOT.GetCountry.GetRuler.GetHerHis]."
 flavor_germanics.20.a:0 "¡Toda gloria y alabanza a [GetDeityDefinition('omen_mannus').GetName]!"
 flavor_germanics.20.tooltip:0 "¡La tarea de misión '#Y Expulsar a los Usipetes y Tencteri#!' ya ha sido #G completada#!!"

 flavor_germanics.21.t:0 "En teurioquemia"
 flavor_germanics.21.desc:0 "En los últimos años, nuestros parientes se han mudado constantemente a la provincia de [GetProvince('(int32)3951').GetArea.GetName], especialmente después de que nuestros guerreros expulsaron a cualquiera que pudiera oponerse a nuestra migración hacia los bosques.\n\nA medida que se corre la voz entre las tribus sobre la buena caza que se puede encontrar en el sur, cada vez más miembros de nuestra gente emprenden el arduo viaje con la esperanza de construir una vida mejor para ellos mismos."
 flavor_germanics.21.a:0 "Que esta tierra sea de bendición para [ROOT.GetCountry.GetName]"
 flavor_germanics.21.tooltip:0 "¡La tarea de misión '#Y Into Teuriochaemia#!' ya ha sido #G completada#!!"

 flavor_germanics.22.t:0 "Aliados galos"
 flavor_germanics.22.desc:0 "Cuando la noticia de la devastadora destreza de batalla de [ROOT.GetCountry.GetRuler.GetName] se extendió por [ROOT.GetCountry.GetName] y más allá, fue una sorpresa cuando una #E delegación gala#! llegó una mañana a [ROOT.GetCountry.GetCapital.GetName] con una solicitud urgente.\n\nNuestros espías informan que los galos están luchando entre sí para ver quién se convertirá en el poder predominante, y en un esfuerzo. Para dominar a sus rivales de una vez por todas, se hizo una oferta a [ROOT.GetCountry.GetRuler.GetFirstName] que [ROOT.GetCountry.GetRuler.GetSheHe] no pudo rechazar. 'Invadid las tierras de nuestros enemigos y despojadlos, os lo rogamos. ¡Lo que quieras será tuyo!'"
 flavor_germanics.22.a:0 "Estos galos lamentarán el día en que nos invitaron aquí..."
 flavor_germanics.22.tooltip:0 "¡La tarea de misión '#Y Aliados galos#!' ahora ha sido #G completada#!!"

 flavor_germanics.23.t:0 "Los siete aliados"
 flavor_germanics.23.desc:0 "Nunca antes en nuestra historia los ejércitos de [ROOT.GetCountry.GetName] habían tenido tanto éxito como lo son; Bajo el liderazgo inspirado de [ROOT.GetCountry.GetRuler.GetName], nuestros guerreros han destrozado a cualquier oponente lo suficientemente tonto como para enfrentarnos en el campo de batalla, y las embajadas enviadas desde [ROOT.GetCountry.GetCapital.GetName] generalmente regresan a la capital [ROOT.GetCountry.GetAdjective] con buenas noticias.\n\nCon nuestras levas hinchadas con combatientes extranjeros que buscan gloria y riqueza, nuestro [ROOT.GetCountry.GetRulerTitle] debe decidir cómo deben entrenar estos soldados, un buen problema que [ROOT.GetCountry.GetRuler.GetSheHe] está feliz de tenerlo."
 flavor_germanics.23.a:0 "La infantería ligera de [ROOT.GetCountry.GetName] es la parte más importante de nuestro ejército."
 flavor_germanics.23.b:0 "Nuestros arqueros deben estar preparados para lo que se les presente."
 flavor_germanics.23.c:0 "Todos nuestros guerreros deberían entrenar en los bosques de nuestra patria."
 flavor_germanics.23.tooltip:0 "¡La tarea de misión '#Y Los siete aliados#!' ya ha sido #G completada#!!"

 flavor_germanics.24.t:0 "A través del Rhenus"
 flavor_germanics.24.desc:0 "Según todos los indicios, las tierras al otro lado del #E río Rhenus#! son fértiles y acogedoras, con suaves colinas e interminables campos de cereales: un buen territorio para el pastoreo de animales y el cultivo. Animado por estos informes, [ROOT.GetCountry.GetRuler.GetName] está dispuesto a enviar nuestros [ROOT.GetCountry.GetAdjective] impuestos a través del Rhenus."
 flavor_germanics.24.a:0 "Los hijos de mis hijos cultivarán estas tierras..."
 flavor_germanics.24.tooltip:0 "¡La tarea de misión '#Y A través del Rhenus#!' ahora ha sido #G completada#!!"

 flavor_germanics.25.t:0 "Domar al lobo romano"
 flavor_germanics.25.desc:0 "Las fuerzas invencibles de [ROOT.GetCountry.GetRuler.GetName] han humillado a las #E legiones romanas#!, enviándolas de regreso a su península maldita con la cola metida entre las piernas. En su arrogancia, los romanos asumieron que serían capaces de tratar con nosotros como lo han hecho con cualquier otra llamada 'tribu bárbara', y nuestros exploradores informan que el enemigo no se molestó en explorar el campo local.\n\nSu pereza ha demostrado ser su perdición, porque nuestros [ROOT.GetCountry.GetAdjective] parientes se abalanzaron sobre los desprevenidos romanos una y otra vez, causando una sensación de pánico y desesperación en los campos romanos. Incluso se ha informado que sus #E cónsules#! han sido reprendidos públicamente por el #E Senado romano#! por permitir derrotas tan vergonzosas: noticias que son música para los oídos de [ROOT.GetCountry.GetRuler.GetFirstName]."
 flavor_germanics.25.a:0 "¡Un día arrasaré [GetProvince('(int32)1').GetName]!"
 flavor_germanics.25.tooltip:0 "¡La tarea de misión '#Y Domar al lobo romano#!' ya ha sido #G completada#!!"

 flavor_germanics.26.t:0 "Integrar aliados"
 flavor_germanics.26.desc:0 "Aunque [ROOT.GetCountry.GetRuler.GetName] escuchó las sugerencias de aquellos que hemos conquistado, el feroz [ROOT.GetCountry.GetRulerTitle] ha rechazado sus propuestas de convivencia y ha tomado la decisión de que todos los que viven dentro de nuestra hegemonía se integren directamente."
 flavor_germanics.26.a:0 "¡Un pueblo unido es el único camino a seguir para [ROOT.GetCountry.GetName]!"
 flavor_germanics.26.tooltip:0 "¡La tarea de misión '#Y Integrar aliados#!' ahora ha sido #G completada#!!"

 flavor_germanics.27.t:0 "Asimilar aliados"
 flavor_germanics.27.desc:0 "En lugar de integrar por la fuerza a quienes han jurado fidelidad a [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetName] ha decidido que un esfuerzo por asimilar a nuestros compatriotas será suficiente. Como ha reflexionado [ROOT.GetCountry.GetRulerTitle] ante los [ROOT.GetCountry.GetRuler.GetHerHis] asesores: '¿Cómo puede alguien resistirse a nuestras [ROOT.GetCountry.GetAdjective] formas superiores? Dentro de una generación no podrás distinguir a ninguno de nosotros."
 flavor_germanics.27.a:0 "Espero haber elegido sabiamente"
 flavor_germanics.27.tooltip:0 "¡La tarea de misión '#Y Asimilar aliados#!' ahora ha sido #G completada#!!"

 flavor_germanics.28.t:0 "heredero real"
 flavor_germanics.28.desc:0 "Nunca antes en [ROOT.GetCountry.GetCapital.GetName] ha habido una celebración como la que organizó [ROOT.GetCountry.GetRuler.GetName] por el nacimiento del niño [ROOT.GetCountry.GetRuler.GetHerHis], un bebé sano y robusto llamado [SCOPE.sChar('but_thats_my_baby_scope').GetName]. El vino fluye en la capital como el #E río Rhenus#! mismo, y el baile y el banquete continúan desde hace más de una semana sin señales de detenerse.\n\nLa madre de la niña, la sonrojada [ROOT.GetCountry.GetConsort.GetName], es la invitada de honor del evento, y la claramente borracha [ROOT.GetCountry.GetRuler.GetFirstName] ha brindado por su salud prácticamente cada hora, alabando a los dioses por su donación. El pueblo de Semnonia un nuevo heredero. Sosteniendo al niño en el aire para que todos los presentes puedan admirar a [SCOPE.sChar('but_thats_my_baby_scope').GetHerHim], el orgulloso [ROOT.GetCountry.GetRulerTitle] no puede dejar de sonreír; verdaderamente, [ROOT.GetCountry.GetRuler.GetFirstName] era lo más feliz que [ROOT.GetCountry.GetRuler.GetSheHe] había sido en [ROOT.GetCountry.GetRuler.GetHerHis] vida."
 flavor_germanics.28.a:0 "¡Que mis descendientes reine sobre [ROOT.GetCountry.GetName] durante diez mil años!"
 flavor_germanics.28.b:0 "En verdad, ¿existe una mujer más bella en cualquier lugar del mundo?"
 flavor_germanics.28.tooltip:0 "¡La tarea de misión '#Y Heredero real#!' ya ha sido #G completada#!!"

 flavor_germanics.29.t:0 "La cuenca de Boiohemia"
 flavor_germanics.29.desc:0 "Las tierras de nuestro sur no han sido reclamadas por ninguna tribu durante mucho tiempo, y son el hogar solo de ermitaños y aquellos que han sido abandonados por su gente; uno puede viajar a través de los bosques oscuros durante días sin encontrar otra alma viviente.\n\nSin embargo, nuestros parientes están comenzando a explorar estos territorios y se han alejado cada vez más de [ROOT.GetCountry.GetCapital.GetName] en busca de buena caza. Fue en ese viaje que nuestros exploradores descubrieron la #E Cuenca de Boiohemian#!, una vasta y prístina región que encierra muchas promesas.\n\nCuando [ROOT.GetCountry.GetRuler.GetName] supo de estas tierras vírgenes que no conocían amo, se decidió en ese momento que nuestros ejércitos seguirían los pasos de nuestros cazadores y se desplazarían hacia el sur."
 flavor_germanics.29.a:0 "Me pregunto qué más encontraremos en la Cuenca Boiohemian..."
 flavor_germanics.29.tooltip:0 "¡La tarea de la misión '#Y La cuenca de Boiohemian#!' ya ha sido #G completada#!!"

 flavor_germanics.30.t:0 "Comercio Moenus"
 flavor_germanics.30.desc:0 "La conquista de nuevas tierras trae consigo muchas oportunidades; algunos buenos y otros malos. Afortunadamente para las tribus de [ROOT.GetCountry.GetName], nuestra gente solo ha encontrado riquezas desde que cruzó el #E río Moenus#!. Nuestros contactos con los lugareños no sólo han aumentado el flujo comercial hacia [ROOT.GetCountry.GetCapital.GetName], sino que los impuestos cobrados por nuestros comerciantes han inundado el tesoro con riquezas nunca antes vistas entre los [ROOT.GetCountry.GetAdjective]."
 flavor_germanics.30.a:0 "Rezo para que le demos buen uso a este dinero."
 flavor_germanics.30.tooltip:0 "¡La tarea de misión '#Y Moenus Trade#!' ahora ha sido #G completada#!!"

 flavor_germanics.31.t:0 "Invadir Boiohemia"
 flavor_germanics.31.desc:0 "Afortunadamente para nuestros guerreros, no hemos encontrado ninguna resistencia digna de mención, ya que nuestras tropas se han trasladado en masa a #E Boiohemia#!; cualquiera que haya sido lo suficientemente tonto como para cruzar espadas con nosotros se está pudriendo en el campo de batalla, y un flujo constante de esclavos se dirige hacia el norte, a [ROOT.GetCountry.GetCapital.GetName].\n\nAlentado por estos resultados estelares, [ROOT.GetCountry.GetRuler.GetName] ha ordenó a [ROOT.GetCountry.GetRuler.GetHerHis] soldados que continuaran con sus saqueos y asaltos."
 flavor_germanics.31.a:0 "¡Los dioses de la guerra están con nosotros! ¡Debemos presionar el ataque!"
 flavor_germanics.31.tooltip:0 "¡La tarea de misión '#Y Invadir Boiohemia#!' ya ha sido #G completada#!!"

 flavor_germanics.32.t:0 "Palacio de Maroboduus"
 flavor_germanics.32.desc:0 "Si bien [ROOT.GetCountry.GetRuler.GetName] es conocido principalmente por su [ROOT.GetCountry.GetRuler.GetHerHis] experiencia en guiar a los guerreros a la batalla, el [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] también desea ser reconocido como un constructor, y a menudo reflexiona ante los [ROOT.GetCountry.GetRuler.GetHerHis] asesores sobre el siguiente sentimiento; 'Cualquier hombre puede matar a otro, pero si deseo dejar un legado permanente, entonces los hijos de mis nietos deben contemplar las obras que he dejado atrás. Estas manos nudosas, tan cómodas sosteniendo una lanza o una espada, también deben levantar piedra sobre piedra...'\n\nGuiados por tales visiones, pronto comenzó la construcción de un magnífico palacio en el campo, y cuando estuvo terminado, miembros de tribus de todas partes [ROOT.GetCountry.GetName] hicieron el arduo viaje a través del difícil terreno para contemplar la estructura por sí mismos. Impresionados por su tamaño y grandeza, muchos decidieron quedarse, y así fue como [ROOT.GetCountry.GetRuler.GetFirstName] se hizo conocido como un maestro arquitecto."
 flavor_germanics.32.a:0 "¡Que este gran edificio permanezca en pie durante los siglos venideros!"
 flavor_germanics.32.tooltip:0 "¡La tarea de misión '#Y Palacio de Maroboduus#!' ya ha sido #G completada#!!"

 flavor_germanics.33.t:0 "El refugio seguro para los traidores"
 flavor_germanics.33.desc:0 "En los últimos años, las tierras de [GetCountry('GTH').GetName] se hicieron conocidas como un lugar donde [ROOT.GetCountry.GetAdjective] rebeldes y descontentos podían encontrar refugio del largo brazo de [ROOT.GetCountry.GetRuler.GetName] y [ROOT.GetCountry.GetRuler.GetHerHis] la justicia inquebrantable, pero el vengativo [ROOT.GetCountry.GetRulerTitle] finalmente ha puesto fin a esta flagrante violación de nuestras leyes sometiendo a los guthonianos. Rotundamente.\n\nAhora, aquellos que se ganan la ira de nuestro pueblo sólo pueden esperar encontrar la salvación en la muerte, porque [ROOT.GetCountry.GetRuler.GetFirstName] ha dejado muy claro que no hay refugio seguro para los traidores bajo [ROOT.GetCountry.GetRuler.GetHerHis] vigilancia."
 flavor_germanics.33.a:0 "¿De verdad pensaste que te dejaría salirte con la tuya?"
 flavor_germanics.33.b:0 "Mi palabra es la autoridad final dentro de [ROOT.GetCountry.GetName]..."
 flavor_germanics.33.tooltip:0 "¡La tarea de la misión '#Y El refugio seguro para los traidores#!' ya ha sido #G completada#!!"


 flavor_germanics.34.t:0 "Cruzar el río Marus"
 flavor_germanics.34.desc:0 "Los dioses realmente han bendecido nuestros esfuerzos por colonizar las tierras de la #E Cuenca Boiohemian#!, porque no hemos encontrado nada más que éxito a través de las aguas del #E Río Marus#!. Incluso ahora, nuestros parientes están domesticando las tierras salvajes, plantando cultivos y permitiendo que sus rebaños deambulen libremente por las colinas bajo la atenta mirada de sus pastores.\n\nNuestras tribus están muy satisfechas con [ROOT.GetCountry.GetRuler.GetName], quien ha hecho más que nadie para hacer esto posible, y el nombre de [ROOT.GetCountry.GetRulerTitle] es elogiado por la gente común."
 flavor_germanics.34.a:0 "Esta tierra será nuestra para siempre... me aseguraré de ello."
 flavor_germanics.34.tooltip:0 "¡La tarea de misión '#Y Cruzar el río Marus#!' ya ha sido #G completada#!!"


 flavor_germanics.35.t:0 "Defender la cuenca"
 flavor_germanics.35.desc:0 "Recientemente, [ROOT.GetCountry.GetRuler.GetName] ha pasado mucho tiempo entrenando personalmente a los reclutas que deben actuar como guardianes en los puntos de estrangulamiento que conducen a la #E Cuenca de Boiohemian#!, y después de semanas de práctica agotadora en los bosques, el [ROOT.GetCountry.GetRulerTitle] finalmente está satisfecho con los esfuerzos de nuestros [ROOT.GetCountry.GetAdjective] parientes y ha regresado a [ROOT.GetCountry.GetCapital.GetName].\n\nEstos valientes guerreros, que actuarán como la primera línea de defensa a la hora de proteger nuestros nuevos territorios, están más que preparados para la tarea que se les ha confiado y patrullan las fortificaciones erigidas por nuestro pueblo con un propósito sombrío."
 flavor_germanics.35.a:0 "¡Que vuestras flechas vuelen rectas y vuestras espadas acierten!"
 flavor_germanics.35.tooltip:0 "¡La tarea de misión '#Y Defender la cuenca#!' ya ha sido #G completada#!!"

 flavor_germanics.36.t:0 "Corre la voz sobre Twisto"
 flavor_germanics.36.desc:0 "Cuando se le pregunte quién es el mayor responsable de traer la victoria a nuestro pueblo, [ROOT.GetCountry.GetRuler.GetName] será el primero en alabar a [GetDeityDefinition('omen_tuisto').GetName], porque el piadoso [ROOT.GetCountry.GetRulerTitle] siempre ha reconocido la supremacía de los dioses en los asuntos del hombre.\n\nNo contento con simplemente ofrecer un servicio de labios a nuestro poderoso dios, [ROOT.GetCountry.GetRuler.GetFirstName] ha construido un santuario para [ROOT.GetCountry.GetRuler.GetHerHis] deidad protectora con esperanzas. De difundir nuestra fe en las tierras en las que nos hemos asentado."
 flavor_germanics.36.a:0 "No me sorprende saber que Twisto ha ganado nuevos adeptos."
 flavor_germanics.36.tooltip:0 "¡La tarea de la misión '#Y Difundir la palabra de Twisto#!' ya ha sido #G completada#!!"

 flavor_germanics.37.t:0 "Guerras marcomanas"
 flavor_germanics.37.desc:0 "Desde sus humildes comienzos, los esfuerzos de [ROOT.GetCountry.GetRuler.GetName] han llevado a las tribus de [ROOT.GetCountry.GetName] a la cima del poder; la palabra y la voluntad del poderoso [ROOT.GetCountry.GetRulerTitle] se hacen cumplir mediante los devastadores impuestos que [ROOT.GetCountry.GetRuler.GetSheHe] comanda. Nunca antes en nuestra historia nuestros jefes habían comandado una fuerza militar tan grande, una señal de que nuestra gloria está en ascenso y de que nadie puede interponerse en nuestro camino.\n\nLa mera mención de nuestro nombre infunde terror en los corazones de nuestros enemigos, y nuestros enemigos ofrecen oraciones diarias con la esperanza de que la ira del [ROOT.GetCountry.GetAdjective] no los destruya."
 flavor_germanics.37.a:0 "¡Con tales fuerzas a mi disposición, podría conquistar el mundo!"
 flavor_germanics.37.tooltip:0 "¡La tarea de misión '#Y Guerras Marcomannic#!' ahora ha sido #G completada#!!"

 flavor_germanics.38.t:0 "Esclavos cotinianos"
 flavor_germanics.38.desc:0 "Los #E [GetCountry('OTN').GetName]#! solían vivir en sus pasos de montaña, evitando interacciones con extranjeros siempre que era posible y esperando poder pasar sus días solos, un sueño destrozado por el todopoderoso [ROOT.GetCountry.GetRuler.GetName], que ha enviado [ROOT.GetCountry.GetRuler.GetHerHis] ejércitos a las grietas rocosas y colinas para esclavizar y saquear.\n\nAhora que el Los cotinianos débiles han sido aplastados, [ROOT.GetCountry.GetRulerTitle] se pregunta qué les deparará el futuro."
 flavor_germanics.38.a:0 "Poner a los lugareños a trabajar en su tierra natal."
 flavor_germanics.38.b:0 "Encadena a los Cotini y envíalos a los campos y minas."
 flavor_germanics.38.tooltip:0 "¡La tarea de misión '#Y Esclavos cotinianos#!' ya ha sido #G completada#!!"

 flavor_germanics.39.t:0 "Un nuevo hogar germánico"
 flavor_germanics.39.desc:0 "Mucho ha cambiado para nuestro pueblo en los últimos años; Hemos surgido de la oscuridad y nos hemos convertido en una fuerza a tener en cuenta. Según todos los indicios, nuestra migración hacia el sur, hacia la #E Cuenca de Boiohemian#!, ha sido un éxito sorprendente, pagando dividendos y recompensas que ni siquiera el poderoso [ROOT.GetCountry.GetRuler.GetName] podría haber previsto realmente. Hace mucho tiempo, muchas cosas eran inciertas para nosotros, y ahora, el futuro es nuestro."
 flavor_germanics.39.a:0 "Que este nuevo hogar sirva de refugio para nuestras tribus en los días venideros."
 flavor_germanics.39.tooltip:0 "¡La tarea de misión '#Y Un nuevo hogar germánico#!' ya ha sido #G completada#!!"

 flavor_germanics.40.t:0 "La Arboleda Sagrada Del Alhiz"
 flavor_germanics.40.desc:0 "Aunque la tierra santa de [GetProvince('(int32)4005').GetName] está distante de [ROOT.GetCountry.GetCapital.GetName], [ROOT.GetCountry.GetRuler.GetName] no perdió el tiempo en asegurar este importante territorio para las tribus de [ROOT.GetCountry.GetName]. No contento con ser simplemente un administrador de lo sagrado, nuestro [ROOT.GetCountry.GetRulerTitle] gastó una gran suma para construir un #E Lugar Sagrado#! en Stragona cerca de una arboleda que los lugareños afirman está bendecida por [GetDeityDefinition('omen_alcis').GetName], una deidad que [ROOT.GetCountry.GetRuler.GetSheHe] cree que vela por [ROOT.GetCountry.GetRuler.GetHerHim] personalmente.\n\nCon el santuario construido y la reputación de [ROOT.GetCountry.GetRuler.GetFirstName] creciendo, el orgulloso guerrero ha anunciado que nuestros ejércitos pronto conquistarán nuevos territorios."
 flavor_germanics.40.a:0 "¡La provincia Elísea nos pertenece y la reclamaremos! [GetDeityDefinition('omen_alcis').GetName] lo quiere"
 flavor_germanics.40.tooltip:0 "¡La tarea de la misión '#Y La Arboleda Sagrada de Alhiz#!' ya ha sido #G completada#!!"

 flavor_germanics.41.t:0 "Urna facial"
 flavor_germanics.41.desc:0 "Uno de los honores más importantes jamás concedidos a un [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] es un entierro en una #E Urna con cara de vándalo#!; con sus restos mortales sepultados en un estado tan magníficamente ornamentado, el nombre y la reputación de los caídos estaban prácticamente asegurados para vivir para siempre.\n\nY aunque [ROOT.GetCountry.GetRuler.GetFirstName] aún no ha pasado de este reino al más allá, ya se ha preparado una urna con el rostro de [ROOT.GetCountry.GetRuler.GetHerHim] en señal de respeto y admiración por el impresionante guerrero. Nuestros #E Ancianos tribales#! quieren asegurarse de que nunca olvidemos todas las cosas tremendas que el poderoso [ROOT.GetCountry.GetRuler.GetFirstName] ha hecho por todos nosotros."
 flavor_germanics.41.a:0 "¡Que mis obras sean dignas de este don que he recibido!"
 flavor_germanics.41.tooltip:0 "¡La tarea de misión '#Y Urna facial#!' ya ha sido #G completada#!!"

 flavor_germanics.42.t:0 "El camino del ámbar"
 flavor_germanics.42.desc:0 "Aunque estamos perfectamente contentos de ocuparnos de nuestros asuntos y limitar el contacto con nuestras tribus vecinas, [ROOT.GetCountry.GetRuler.GetName] nos ha alentado a ampliar nuestras conexiones con el resto del mundo, especialmente si eso significa vender ámbar @amber!, un artículo de lujo que tenemos en abundancia y que es muy deseado por los comerciantes extranjeros.\n\nCon los años, las redes comerciales se han hecho cada vez más fuertes, y nuestras conexiones con nuestros #E celtas#! Los vecinos son mucho mayores que antes. Afortunadamente, esta situación parece beneficiar a todos los involucrados."
 flavor_germanics.42.a:0 "Prometo hacer un buen uso de las ganancias que obtengamos."
 flavor_germanics.42.tooltip:0 "¡La tarea de misión '#Y The Amber Road#!' ya ha sido #G completada#!!"

 flavor_germanics.43.t:0 "Ámbar propio"
 flavor_germanics.43.desc:0 "Últimamente parece que nuestra gente se ha vuelto loca por el ámbar @amber!, ya que todo el mundo desea un trozo de 'glesum' para sí mismo. Nuestros artesanos dan forma a la valiosa savia en formas de animales como osos o ciervos, y un santuario [ROOT.GetCountry.GetAdjective] no se considera sagrado sin un trozo de ámbar sagrado en algún lugar de su interior. Hay algunos miembros de tribus que viven entre nosotros que han hecho pequeñas fortunas comerciando ámbar con extranjeros, y una vez [ROOT.GetCountry.GetRuler.GetName] supo cuánto dinero estaba intercambiando manos, [ROOT.GetCountry.GetRulerTitle] decidió hacer de la producción de ámbar una prioridad para [ROOT.GetCountry.GetName]."
 flavor_germanics.43.a:0 "¡Debemos recolectar tanto ámbar como podamos!"
 flavor_germanics.43.tooltip:0 "¡La tarea de misión '#Y Ámbar propio#!' ya ha sido #G completada#!!"
 barbaricum_vandalia_lugia_mission_task_4_tt:0 "Una liquidación aleatoria cambiará su #T Bien comercial#! a #T Ámbar#! @amber!, y una liquidación aleatoria que produzca #T Ámbar#! recibirá una #G Bonificación especial#!."

 flavor_germanics.44.t:0 "Contacto con los celtas"
 flavor_germanics.44.desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha cultivado durante mucho tiempo conexiones comerciales con los #E celtas#! que viven cerca de nosotros y, con el tiempo, las relaciones entre nosotros y muchas otras tribus se han vuelto bastante amistosas. Nuestro pueblo se lleva bastante bien, todo hay que decirlo; compartimos el amor por muchas cosas similares, como las glorias de la caza, y hay muchos que viven entre nosotros que se han casado con nuestros primos celtas.\n\nEn lugar de desalentar que tales cosas sucedan, [ROOT.GetCountry.GetRuler.GetFirstName] ha dado [ROOT.GetCountry.GetRuler.GetHerHis] bendición, porque [ROOT.GetCountry.GetRuler.GetSheHe] también tiene amigos entre los celtas, y a menudo se le encuentra conversando con sus sabios y #E tribales. Ancianos#! con la esperanza de adquirir sabiduría."
 flavor_germanics.44.a:0 "Por los dioses, creo que realmente está dando sus frutos."
 flavor_germanics.44.tooltip:0 "¡La tarea de misión '#Y Contacto con celtas#!' ya ha sido #G completada#!!"

 flavor_germanics.45.t:0 "Un ritual celta"
 flavor_germanics.45.desc:0 "Aunque muchos de los #E ancianos tribales#! vieron las acciones de [ROOT.GetCountry.GetRuler.GetName] con abierta sospecha, nadie pudo impedir que [ROOT.GetCountry.GetRulerTitle] llevara a cabo un #E ritual religioso celta#! en el corazón de [ROOT.GetCountry.GetCapital.GetName]. Algunos argumentaron que los ritos eran demasiado caros, mientras que otros se aferraron a la afirmación comprobada de que tales acontecimientos eran blasfemos y susceptibles de provocar la ira de nuestras deidades tradicionales, y sin embargo ninguno de nuestros dioses se mostró para quejarse.\n\nPor el contrario, los presagios fueron más favorables que nunca; nuestras colmenas rebosaban de miel, los peces prácticamente saltaban de los ríos a nuestras redes y manadas de ciervos gordos y lentos pasaban por nuestros bosques."
 flavor_germanics.45.a:0 "¡Hay poder en el panteón celta!"
 flavor_germanics.45.tooltip:0 "¡La tarea de misión '#Y Un ritual celta#!' ya ha sido #G completada#!!"

 flavor_germanics.46.t:0 "La Confederación Lugia"
 flavor_germanics.46.desc:0 "La deidad celta [GetDeityDefinition('omen_lugus').GetName] ha bendecido a nuestro pueblo con innumerables victorias, situándonos por encima de todos los demás a pesar de que nuestros antepasados desconocían su nombre, y no sorprende saber que [ROOT.GetCountry.GetRuler.GetName] ha decidido formar una confederación que honre al gran dios.\n\n'A partir de este día, seremos conocidos como #E Lugia#!; un hogar para guerreros #E germánicos#! y #E celtas#!. Como dos grandes ríos que han unido sus aguas, así también la fuerza de nuestros pueblos forjará una nueva cultura. Celebremos este momento sagrado con sacrificios y alabanza a Lugus, que ha hecho todo esto posible.'"
 flavor_germanics.46.a:0 "¡Todos saluden #E Lugia#! y todos saluden [ROOT.GetCountry.GetRuler.GetFirstName]!"
 flavor_germanics.46.tooltip:0 "¡La tarea de misión '#Y La Confederación Lugian#!' ahora ha sido #G completada#!!"
 lugus_added_to_lugia_pantheon_tt:0 "La deidad #T Lugus#! se agregará a nuestro #T Panteón#!."

 flavor_germanics.47.t:0 "Nuestra minoría sueva"
 flavor_germanics.47.desc:0 "Hay muchos residentes dentro de [ROOT.GetCountry.GetName] que ven a los #E Irminones#! que viven junto a nosotros con profunda sospecha, pero [ROOT.GetCountry.GetRuler.GetName] les ha dicho a nuestros parientes que deben aceptar a la minoría entre nosotros... o si no.\n\n'Dale tiempo a los Irminones para que se demuestren tu valía y verás que son dignos de los elogios que les he otorgado. Ellos. Nuestros impuestos se llenan de combatientes audaces, nuestros ingresos comerciales están creciendo y nuestros enemigos nos temen... no hay desventajas aquí.'\n\nQueda por ver si estas palabras serán ciertas o no, pero todos están dispuestos a confiar en el [ROOT.GetCountry.GetRulerTitle] por ahora."
 flavor_germanics.47.a:0 "Todo lo que hago, lo he hecho por [ROOT.GetCountry.GetName]"
 flavor_germanics.47.tooltip:0 "¡La tarea de la misión '#Y Nuestra minoría sueva#!' ya ha sido #G completada#!!"

 flavor_germanics.48.t:0 "Invitar a más inmigrantes tribales"
 flavor_germanics.48.desc:0 "Mientras se corre la voz de que las tribus de [ROOT.GetCountry.GetName] están alentando a los inmigrantes a establecerse dentro de sus fronteras, un rico comerciante #E Irminonic#! se ha acercado a [ROOT.GetCountry.GetRuler.GetName]; un hombre de estatus noble llamado [SCOPE.sCharacter('irminonic_nobleman_scope').GetName], rico y ambicioso que busca vivir en [ROOT.GetCountry.GetCapital.GetName].\n\nCuando se le pregunta por qué quiere vivir junto a los [ROOT.GetCountry.GetAdjective], [SCOPE.sCharacter('irminonic_nobleman_scope').GetFirstName] afirma que hay buenas oportunidades de negocios en nuestra tierra natal y que está interesado en ayudar a hacer crecer el ámbar @amber!. Comercio.\n\nEl noble irminónico está dispuesto a pagar por el privilegio de quedarse aquí, pero pide que sus derechos sean consagrados en la ley; una medida que resultará impopular si [ROOT.GetCountry.GetRuler.GetFirstName] decide seguir adelante."
 flavor_germanics.48.a:0 "Daremos la bienvenida a cualquiera que quiera vivir junto a nosotros."
 flavor_germanics.48.b:0 "Haz lo que te pide [SCOPE.sCharacter('irminonic_nobleman_scope').GetFirstName], al diablo con las consecuencias"
 flavor_germanics.48.tooltip:0 "¡La tarea de la misión '#Y Invitar a más inmigrantes tribales#!' ya ha sido #G completada#!!"

 flavor_germanics.49.t:0 "Con lanza y espada"
 flavor_germanics.49.desc:0 "A lo largo de [ROOT.GetCountry.GetName] y más allá, [ROOT.GetCountry.GetRuler.GetName] está ganando una reputación de ser un guerrero feroz que no tiene igual para nadie que esté vivo actualmente, y muchos incluso creen que [ROOT.GetCountry.GetRuler.GetFirstName] podría ser el luchador más grande que jamás haya caminado sobre la Tierra.\n\nCada enemigo que ha provocado la ira de [ROOT.GetCountry.GetRulerTitle] ha sido enviado a cualquier dios del inframundo en el que crean, y uno de los logros más aclamados de [ROOT.GetCountry.GetRuler.GetFirstName] es la subyugación de todas las demás #E tribus vándalas#!.\n\nEl olor de las aldeas y los cuerpos quemados se ha vuelto como un incienso ofrecido a los dioses de la guerra, y el mundo tiembla de miedo, preguntándose dónde atacarán a continuación los ejércitos del mortífero caudillo."
 flavor_germanics.49.a:0 "¡Todo lo que deseo para mí, lo tomaré!"
 flavor_germanics.49.tooltip:0 "¡La tarea de misión '#Y Con lanza y espada#!' ya ha sido #G completada#!!"

 flavor_germanics.50.t:0 "La unificación de los vándalos"
 flavor_germanics.50.desc:0 "'A partir de este día, abrazamos un nuevo nombre; Ya no seremos conocidos como #E Harian#!, sino que seremos llamados #E Vandal#!. Hemos unido a todos nuestros parientes bajo una sola bandera y, desde nuestros humildes comienzos, rápidamente nos hemos convertido en la potencia dominante en #E Germania#!. ¡Que los dioses nos bendigan mientras continuamos avanzando contra nuestros enemigos!'\n\nAl oír estas palabras, estallan fuertes vítores en el campamento militar donde [ROOT.GetCountry.GetRuler.GetName] se dirige a las [ROOT.GetCountry.GetRuler.GetHerHis] tropas. Siempre en movimiento, [ROOT.GetCountry.GetRuler.GetFirstName] apenas tuvo tiempo de recuperarse de la última batalla antes de que [ROOT.GetCountry.GetRuler.GetSheHe] decidiera anunciar la emocionante noticia a los valientes guerreros que habían hecho posible ese día."
 flavor_germanics.50.a:0 "No es momento de descansar, aún queda mucho trabajo por hacer"
 flavor_germanics.50.tooltip:0 "¡La tarea de la misión '#Y La unificación de los vándalos#!' ya ha sido #G completada#!!"

 flavor_germanics.51.t:0 "Colonización del este"
 flavor_germanics.51.desc:0 "Hace mucho tiempo, había muchos territorios hacia nuestro este que estaban en su mayoría despoblados, pero nuestros intrépidos parientes han ido migrando lentamente a los bosques y llanuras y construyendo asentamientos. La colonización del Este parece ir muy bien; nuestra gente está prosperando, los ingresos fiscales son más altos que nunca y nuestras tribus tienen suficiente espacio para crecer sin interponerse entre sí."
 flavor_germanics.51.a:0 "Esto me agrada mucho...He elegido sabiamente."
 flavor_germanics.51.tooltip:0 "¡La tarea de la misión '#Y Colonización del Este#!' ya ha sido #G completada#!!"

 flavor_germanics.52.t:0 "Las llanuras de Panonia"
 flavor_germanics.52.desc:0 "Los extensos territorios de las #E llanuras de Panonia#! se encuentran ante nosotros, sin que nadie se interponga en nuestro camino para reclamarlos por completo para nosotros. Mientras que algunos que viven en [ROOT.GetCountry.GetCapital.GetName] cuestionan la profundidad de las ambiciones de [ROOT.GetCountry.GetRuler.GetName], pocos no están dispuestos a hablar en contra de [ROOT.GetCountry.GetRulerTitle]; Todo lo que le ha pasado a [ROOT.GetCountry.GetName] se debe a las cosas que ha hecho [ROOT.GetCountry.GetRuler.GetSheHe]."
 flavor_germanics.52.a:0 "Las llanuras de Panonia son un trampolín hacia mayores glorias..."
 flavor_germanics.52.tooltip:0 "¡La tarea de misión '#Y Las llanuras de Panonia#!' ya ha sido #G completada#!!"

 flavor_germanics.53.t:0 "Manufacturas celtas"
 flavor_germanics.53.desc:0 "Aunque nuestro pueblo es conocido principalmente como guerreros y conquistadores, [ROOT.GetCountry.GetRuler.GetName] se ha asegurado de que no hayamos descuidado nuestra infraestructura; todo lo contrario. Se han reservado grandes sumas de dinero para construir minas en nuestras provincias, y los herreros de [ROOT.GetCountry.GetName] necesitan desesperadamente hierro @iron!, un metal valioso del que parece que nunca tenemos suficiente.\n\nSi bien todavía hay mucho espacio para que nuestra capacidad de fabricación crezca, los esfuerzos de [ROOT.GetCountry.GetRuler.GetFirstName] ya están dando dividendos, lo cual es otra pluma en el sombrero del famoso [ROOT.GetCountry.GetRulerTitle]."
 flavor_germanics.53.a:0 "Nuestra economía necesita una base sólida si queremos sobresalir de todas las demás."
 flavor_germanics.53.tooltip:0 "¡La tarea de misión '#Y Manufacturas celtas#!' ya ha sido #G completada#!!"

 flavor_germanics.54.t:0 "glesum"
 flavor_germanics.54.desc:0 "Aunque [ROOT.GetCountry.GetRuler.GetName] ha expresado un curioso desconcierto por la popularidad del ámbar @amber! entre los comerciantes ambulantes, el [ROOT.GetCountry.GetRulerTitle] no 'mirará el diente a un caballo regalado', como dice el refrán.\n\nLos extranjeros están felices de pagar grandes sumas por este raro material, así que ¿por qué las tribus de [ROOT.GetCountry.GetName] deberían dejar su dinero sobre la mesa? En todo caso, la gente [ROOT.GetCountry.GetAdjective] debería hacer lo que pueda para recolectar tanto ámbar como sea humanamente posible."
 flavor_germanics.54.a:0 "¿Quieres más glesum, dices? Tengo algunos a la venta"
 flavor_germanics.54.tooltip:0 "¡La tarea de misión '#Y Glesum#!' ahora ha sido #G completada#!!"

 flavor_germanics.55.t:0 "Reclamando la costa"
 flavor_germanics.55.desc:0 "Aunque nuestra tierra está bien irrigada por ríos cercanos, actualmente no tenemos acceso ilimitado a las costas, algo que [ROOT.GetCountry.GetRuler.GetName] está dispuesto a cambiar, incluso si eso significa provocar una guerra con nuestros vecinos."
 flavor_germanics.55.a:0 "¡Por la presente reclamo las costas por [ROOT.GetCountry.GetName]!"
 flavor_germanics.55.tooltip:0 "¡La tarea de misión '#Y Reclamar la costa#!' ya ha sido #G completada#!!"

 flavor_germanics.56.t:0 "Nudo suebio"
 flavor_germanics.56.desc:0 "Una de las formas más sencillas de identificar a un #E suevo#! es por su peinado; Se sabe que sus guerreros recogen sus mechones a los lados de sus cabezas, atándolos en un haz - el llamado #E 'Nudo Suebio'#!.\n\nAunque nuestro pueblo tradicionalmente no ha usado el nudo, las conexiones amistosas entre nosotros y los suevos cercanos han aumentado los contactos entre nuestras tribus, y cada vez más de nuestros parientes están comenzando a adoptar este extraño look.\n\nAunque [ROOT.GetCountry.GetRuler.GetName] prefiere un look diferente [ROOT.GetCountry.GetRuler.GetHerHim], con [ROOT.GetCountry.GetRuler.GetHerHis] pelo corto por delante y largo y salvaje por detrás, incluso el [ROOT.GetCountry.GetRulerTitle] admite que el nudo de Suebia es impresionante."
 flavor_germanics.56.a:0 "Me alegra ver que nuestros guerreros están adoptando el estilo."
 flavor_germanics.56.tooltip:0 "¡La tarea de la misión '#Y Nudo suebio#!' ya ha sido #G completada#!!"

 flavor_germanics.57.t:0 "Puertos bálticos"
 flavor_germanics.57.desc:0 "Ahora que controlamos tierras que bordean las aguas del #E Oceanus Sarmaticus#!, nuestra necesidad de una armada poderosa, capaz de proteger nuestros intereses económicos y militares, se ha convertido en una necesidad imperiosa; un llamado de atención que [ROOT.GetCountry.GetRuler.GetName] ha escuchado alto y claro.\n\nCon un suministro constante de madera @wood! almacenada en [ROOT.GetCountry.GetCapital.GetName] y un pequeño ejército de trabajadores trabajando en nuestros puertos recién construidos, nuestros compatriotas se han lanzado a la tarea de construir una armada con abandono."
 flavor_germanics.57.a:0 "No podemos descansar hasta que tengamos una flota adecuada"
 flavor_germanics.57.tooltip:0 "¡La tarea de la misión '#Y Puertos Bálticos#!' ya ha sido #G completada#!!"

 flavor_germanics.58.t:0 "Un artefacto precioso"
 flavor_germanics.58.desc:0 "Aunque la cantidad de oro necesaria para comprar el #E Caldero Nudo de Suebia#! no era nada despreciable, una vez que [ROOT.GetCountry.GetRuler.GetName] lo vio y admiró su fina artesanía con [ROOT.GetCountry.GetRuler.GetHerHis] propios ojos, [ROOT.GetCountry.GetRuler.GetSheHe] supo que [ROOT.GetCountry.GetRuler.GetSheHe] estaría dispuesto a pagar cualquier precio que le pidieran, porque nunca antes el [ROOT.GetCountry.GetRulerTitle] había admirado una obra de arte tan magnífica en persona.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] sabía que [ROOT.GetCountry.GetRuler.GetHerHis] [ROOT.GetCountry.GetAdjective] sus compatriotas sentirían lo mismo e hicieron los preparativos necesarios para comprar el caldero. La corazonada del [ROOT.GetCountry.GetRulerTitle] resultó ser correcta, ya que las tribus quedaron impresionadas por su esplendor."
 flavor_germanics.58.a:0 "¡La gente viajará por todas partes para presenciar esta maravilla!"
 flavor_germanics.58.tooltip:0 "¡La tarea de misión '#Y Un artefacto precioso#!' ya ha sido #G completada#!!"

 flavor_germanics.59.t:0 "Servicio militar obligatorio de hierro"
 flavor_germanics.59.desc:0 "Una de las decisiones más controvertidas jamás promulgada por [ROOT.GetCountry.GetRuler.GetName] fue el plan [ROOT.GetCountry.GetRuler.GetHerHis] para confiscar todo el hierro @iron! de [ROOT.GetCountry.GetRuler.GetHerHis] personas. A pesar de las fuertes quejas y el rechazo de algunos segmentos de la [ROOT.GetCountry.GetAdjective] sociedad, [ROOT.GetCountry.GetRuler.GetSheHe] insistió en que ser [ROOT.GetCountry.GetRulerTitle] no era un concurso de popularidad; todo lo que fuera necesario para el éxito continuo de [ROOT.GetCountry.GetName] sucedería, incluso si todos odiaran a [ROOT.GetCountry.GetRuler.GetHerHim] por ello. Sí, nuestras tribus estaban extrayendo hierro, pero necesitábamos más y tendría que venir de alguna parte.\n\nAunque las ramificaciones de esta decisión causarían tensión durante años, [ROOT.GetCountry.GetRuler.GetFirstName] sabía en el fondo [ROOT.GetCountry.GetRuler.GetHerHis] que los impuestos se fortalecerían durante al menos una generación, y esto era suficiente para [ROOT.GetCountry.GetRuler.GetHerHim]."
 flavor_germanics.59.a:0 "Entierra a tus parientes con productos de ámbar y guarda el hierro para nuestro ejército."
 flavor_germanics.59.tooltip:0 "¡La tarea de misión '#Y Servicio militar obligatorio#!' ya ha sido #G completada#!!"

 flavor_germanics.60.t:0 "Camino ámbar"
 flavor_germanics.60.desc:0 "Una vez, [ROOT.GetCountry.GetRuler.GetName] preguntó al [ROOT.GetCountry.GetRuler.GetHerHis] #E Consejo Tribal#! qué pasó con el ámbar @amber! que se vendía a los #E comerciantes celtas#! que acudían a los mercados en [ROOT.GetCountry.GetCapital.GetName], y [ROOT.GetCountry.GetRuler.GetSheHe] no podía creer la respuesta.\n\nSe informó que los celtas viajaron muy hacia el sur, visitando tierras nunca antes vistas o imaginadas por nadie que viviera en [ROOT.GetCountry.GetName], donde se encontrarían con comerciantes que hablaban lenguas ininteligibles. Nuestro precioso ámbar luego sería intercambiado por especias @spices! o bienes raros como marfil @elephants!, o tal vez incluso intercambiado por piedras preciosas @gems!, aunque se sabía que el oro y la plata @precious_metals! eran altamente preferidos.\n\nSi bien esto era difícil de creer por sí solo, la siguiente parte dejó a [ROOT.GetCountry.GetRuler.GetFirstName] alucinado; Nuestro ámbar se cargaría en barcos y se llevaría a través del agua, donde los ricos cargamentos se descargarían en ciudades portuarias a miles de kilómetros de distancia."
 flavor_germanics.60.a:0 "El mundo es verdaderamente un lugar desconcertante..."
 flavor_germanics.60.tooltip:0 "¡La tarea de misión '#Y Amber Road#!' ya ha sido #G completada#!!"

 flavor_germanics.61.t:0 "Cultivo de centeno"
 flavor_germanics.61.desc:0 "Nuestros hermanos son cazadores y guerreros, inigualables cuando se trata de acechar ciervos @wild_game! en los bosques, y nuestros parientes saben dónde recolectar bayas @dates! y frutas @fruits! de los bosques salvajes: nuestra dieta es rica y variada, capaz de sustentar a nuestra población hambrienta.\n\nY aunque [ROOT.GetCountry.GetRuler.GetName] prefiere comer carne asada a cualquier cosa. Además, el [ROOT.GetCountry.GetRulerTitle] está feliz de ver a las tribus plantar más y más centeno @grain! en las tierras de cultivo que limpiamos. El pan es uno de nuestros alimentos básicos, y nuestros astutos agricultores incluso saben cómo fermentar el grano y preparar bebidas embriagantes que son muy populares entre la gente que vive en [ROOT.GetCountry.GetCapital.GetName]."
 flavor_germanics.61.a:0 "Pan, cerveza y carne… ¿qué más se puede pedir?"
 flavor_germanics.61.tooltip:0 "¡La tarea de la misión '#Y Cultivo de centeno#!' ya ha sido #G completada#!!"

 flavor_germanics.62.t:0 "Relaciones cimbrias"
 flavor_germanics.62.desc:0 "En lugar de declarar la guerra a todas las tribus que viven a nuestro alrededor, [ROOT.GetCountry.GetRuler.GetName] ha decidido establecer relaciones amistosas con algunos de nuestros vecinos con la esperanza de asegurar nuevas oportunidades para la gente de [ROOT.GetCountry.GetName] - un experimento que ha demostrado ser un éxito rotundo hasta ahora.\n\nNuestros contactos entre los #E escandinavos#! han resultado en que algunos de los norteños emigren a [ROOT.GetCountry.GetCapital.GetName] con la esperanza de vivir junto a nuestros parientes. Nuestra reputación como potencia en crecimiento ha atraído a muchos que desean vincular su destino al nuestro; una innovación que [ROOT.GetCountry.GetRuler.GetFirstName] ha recibido con agrado."
 flavor_germanics.62.a:0 "Todos los que deseen adoptar nuestras costumbres son bienvenidos a vivir aquí."
 flavor_germanics.62.tooltip:0 "¡La tarea de la misión '#Y Relaciones cimbrias#!' ya ha sido #G completada#!!"

 flavor_germanics.63.t:0 "Costa Báltica"
 flavor_germanics.63.desc:0 "Con la fuerza naval de las tribus [ROOT.GetCountry.GetAdjective] creciendo año tras año, el ambicioso [ROOT.GetCountry.GetRuler.GetName] ha hecho saber que los barcos de [ROOT.GetCountry.GetName] no dudarían en transportar nuestras tropas a costas lejanas; dondequiera que podamos navegar es presa fácil para nuestros asaltantes. Incluso ahora, una flota recién construida se ha reunido en [GetProvince('(int32)4752').GetName] en preparación para aventuras en el extranjero."
 flavor_germanics.63.a:0 "¡Atacaremos por tierra y mar!"
 flavor_germanics.63.tooltip:0 "¡La tarea de la misión '#Y Costa Báltica#!' ya ha sido #G completada#!!"

 flavor_germanics.64.t:0 "La tierra de los dioses"
 flavor_germanics.64.desc:0 "Durante los últimos meses, nuestra armada se ha tomado un descanso de los ataques a nuestros vecinos y ha emprendido una misión de investigación, llevando a nuestros parientes a tierras extrañas, pero no en busca de una batalla gloriosa. Cuando un raro cese de hostilidades abrió una breve ventana de oportunidad para que nuestras tribus navegaran hacia el norte con la esperanza de encontrar la rumoreada #E Tierra de los Dioses#!, [ROOT.GetCountry.GetRuler.GetName] supo que [ROOT.GetCountry.GetRuler.GetSheHe] se arrepentiría de haber dejado pasar esta oportunidad y dio la orden de comenzar la exploración.\n\nNuestra expedición no decepcionó; Nuestros intrépidos exploradores afirman que descubrieron una tierra donde el sol permanece bajo en el cielo durante todo el día, apenas se pone bajo el horizonte antes de salir nuevamente. En este reino de luz eterna, donde extrañas ruinas salpicaban el paisaje, se podía sentir la presencia de los dioses, y nuestros hombres juran que un aura de buena fortuna se aferraba a ellos y los protegía mientras exploraban."
 flavor_germanics.64.a:0 "Se siente como si hubieras traído esta poderosa energía a casa contigo, bien hecho."
 flavor_germanics.64.tooltip:0 "¡La tarea de la misión '#Y La tierra de los dioses#!' ya ha sido #G completada#!!"

 flavor_germanics.65.t:0 "Círculos de piedra"
 flavor_germanics.65.desc:0 "La presencia de extranjeros que viven entre las tribus de [ROOT.GetCountry.GetName] es un espectáculo que apenas vale la pena mencionar en estos días, ya que muchos extraños han construido sus chozas con techo de paja y asentamientos dentro de nuestras fronteras, algo que [ROOT.GetCountry.GetRuler.GetName] ha alentado. Estos recién llegados han traído consigo sus tradiciones y prácticas culturales, y no es raro ver monumentos que han construido, como sus #E círculos de piedra#!, en el campo.\n\nSi bien esto habría sido inaudito hace un par de generaciones, ahora nadie se inmuta."
 flavor_germanics.65.a:0 "A medida que pasa el tiempo, el cambio sigue sus pasos"
 flavor_germanics.65.tooltip:0 "¡La tarea de misión '#Y Círculos de piedra#!' ya ha sido #G completada#!!"

 flavor_germanics.66.t:0 "gothiscandia"
 flavor_germanics.66.desc:0 "Desde los comienzos más humildes, nuestro pueblo ha ascendido rápidamente a las vertiginosas alturas del poder; Nuestras levas victoriosas han conquistado tierras que sólo conocían nuestros antepasados ​​y hemos silenciado las lenguas de quienes se oponen a nuestros diseños. Incluso ahora, nuestras fronteras abarcan territorios remotos que están alejados de nuestra patria tradicional; un testimonio del liderazgo dinámico de [ROOT.GetCountry.GetRuler.GetName], que nos ha llevado de victoria en victoria.\n\nY así, cuando el ambicioso [ROOT.GetCountry.GetRulerTitle] decretó que nuestras tribus serían aclamadas por un nuevo nombre, uno que reflejara nuestro nuevo estatus en el mundo, esta declaración fue recibida con una aprobación casi unánime por parte de las tribus."
 flavor_germanics.66.a:0 "¡Todos saluden a #E Gothiscandia#! y al clan [ROOT.GetCountry.GetRuler.GetFamily.GetName]!"
 flavor_germanics.66.tooltip:0 "¡La tarea de misión '#Y Gothiscandia#!' ahora ha sido #G completada#!!"

 flavor_germanics.67.t:0 "Migración hacia el este"
 flavor_germanics.67.desc:0 "Aunque las fronteras de [ROOT.GetCountry.GetName] son actualmente más grandes que nunca, el intrigante [ROOT.GetCountry.GetRuler.GetName] ha puesto [ROOT.GetCountry.GetRuler.GetHerHis] la vista hacia el este, donde los territorios no reclamados claman por [ROOT.GetCountry.GetAdjective] colonos.\n\nPara asegurar el futuro de nuestras tribus, el [ROOT.GetCountry.GetRulerTitle] ha hecho saber que enviaremos a nuestra gente al este."
 flavor_germanics.67.a:0 "Que los dioses caminen contigo hacia tu nueva patria."
 flavor_germanics.67.tooltip:0 "¡La tarea de la misión '#Y Migración al Este#!' ya ha sido #G completada#!!"

 flavor_germanics.68.t:0 "a los alpes"
 flavor_germanics.68.desc:0 "Si bien hay quienes viven en [ROOT.GetCountry.GetName] que deseaban ver a nuestras tribus viajar hacia el este, las decisiones finales con respecto a cualquier cosa las toma [ROOT.GetCountry.GetRuler.GetName], y se hizo saber que nos dirigiríamos hacia el sur.\n\nLa cadena montañosa que los lugareños llamaron los #E 'Alpes'#! ha captado la atención de [ROOT.GetCountry.GetRulerTitle]; los pasos que entran y salen de las tierras altas rocosas son fácilmente defendibles, y hay muchos países ricos en #E Italia#! que serían excelentes objetivos para las incursiones."
 flavor_germanics.68.a:0 "He tomado la decisión correcta... ¡a los Alpes y más allá!"
 flavor_germanics.68.tooltip:0 "¡La tarea de misión '#Y A los Alpes#!' ya ha sido #G completada#!!"

 flavor_germanics.69.t:0 "Al Mar Negro"
 flavor_germanics.69.desc:0 "Reforzados por nuestro éxito en el #E Oceanus Sarmaticus#!, el poderoso [ROOT.GetCountry.GetRuler.GetName] ha informado a nuestros #E Ancianos tribales#! que nuestro pueblo se desplazará hacia el este con la esperanza de reclamar territorios en la costa del #E Pontus Euxinus#!. Nuestros parientes se han convertido en marineros expertos y [ROOT.GetCountry.GetRuler.GetFirstName] ha visto de primera mano los esclavos y el botín que nuestros guerreros han traído del extranjero. Hay muchas colonias #E griegas#! ricas en el Pontus Euxinus, y [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] no pueden esperar para desatar a nuestros asaltantes contra los desprevenidos habitantes de la ciudad."
 flavor_germanics.69.a:0 "¡Un día controlaré todo el Pontus Euxinus!"
 flavor_germanics.69.tooltip:0 "¡La tarea de misión '#Y Al Mar Negro#!' ya ha sido #G completada#!!"

