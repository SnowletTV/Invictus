 form_bastetania:0 "Unir Bastetania"
 form_bastetania_desc:0 "Las distintas tribus de los bastetanos siempre han existido separadas unas de otras. Pero unir nuestras tierras aseguraría la prosperidad de nuestro pueblo y nos llevaría a una prosperidad, tal vez incluso mayor que la de los púnicos con quienes tan a menudo estamos en contacto."
