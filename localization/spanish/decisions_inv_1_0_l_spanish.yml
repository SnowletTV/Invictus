 #Change religion decisions:
 convert_to_pre_indo_european_religion:0 "Adoptar la fe marita"
 convert_to_pre_indo_european_religion_desc:0 "Cada vez más de nuestra gente busca el consejo de los sacerdotes de Mari, la Diosa de la montaña, y ofrecen regalos a Aatxe a cambio de protección. Es hora de que adoptemos oficialmente su culto."
 convert_to_puntic_religion:0 "Adoptar el culto a Waaq"
 convert_to_puntic_religion_desc:0 "Durante años, los comerciantes en nuestros puertos han hablado del dios supremo conocido como Waaq, que no tiene igual, y las historias de su amor eterno y autoridad divina han resonado con nuestra gente, que busca convertirse en sus hijos. Quizás todos podríamos buscar el abrazo reconfortante de Waaq."
 convert_to_italic_pantheon:0 "Adoptar la fe itálica"
 convert_to_italic_pantheon_desc:0 "La fe de los pueblos itálicos procede de las antiguas tradiciones latinas y se ha extendido por toda la península. Adoptemos uno de estos cultos como propio."
 convert_to_illyrian_pantheon:0 "Adoptar la fe ilírica"
 convert_to_illyrian_pantheon_desc:0 "La fe de los ilirios proviene de las antiguas creencias paleo-balcánicas. Una vez parte de las mismas creencias que las de Zalmoxis y Anatolia, Illyric es distinto en sus cultos descentralizados: el Culto del Sol en el norte, el Culto de la Serpiente en el sur, y el nuevo Culto del Jinete Tracio que proviene del este. Quizás deberíamos adoptar las creencias ilirias y seguir uno de estos cultos como propio."
 convert_to_hinduism:0 "Adoptar la fe védica"
 convert_to_hinduism_desc:0 "Que los Vedas y las antiguas enseñanzas de la vieja India sean la política oficial de nuestro estado, promovamos el Védico entre nuestros súbditos y en nuestra corte."
 convert_to_agama:0 "Adoptar la fe agámica"
 convert_to_agama_desc:0 "La fe Agama de los drávidas es antigua, que se remonta al amanecer de la civilización. Promovamos la fe Agama entre nuestros súbditos y en nuestra corte."
 convert_to_ajivika:0 "Adoptar la fe ajivika"
 convert_to_ajivika_desc:0 "El gran Makkhali Gosala predicó sus enseñanzas a su secta Ajivika. Predica que el destino es absoluto, que todo está predestinado. Sométamonos a nuestro destino de abrazar el Ajivika."
 convert_to_burmese_religion:0 "Adoptar el culto nat"
 convert_to_burmese_religion_desc:0 "La religión de los pueblos del sudeste del mundo se ha extendido a nosotros. Dicen que dentro de cada ser viviente hay Nats, y los Nats están en cada ser viviente. Quizás deberíamos abrazar oficialmente el culto a los Nats."
 convert_to_anahitic_religion:0 "Adoptar la fe anahítica"
 convert_to_anahitic_religion_desc:0 "Los adoradores de Anahit se han extendido por todo nuestro país. Ha demostrado ser una religión popular debido a su adaptabilidad a nuestras deidades locales. Puede que sea hora de adoptar oficialmente esta religión armenia y llamarla nuestra."
 convert_to_berber_religion:0 "Adoptar las tradiciones amaziges"
 convert_to_berber_religion_desc:0 "Aunque la fe Amazigh fue una vez influenciada por sus vecinos, ahora, a su vez, ellos nos han influenciado. Nuestra gente ha comenzado a adoptar las creencias de las tribus del desierto, mirando tanto a Nanna Tala y Shaheded como a cualquier deidad local."
 convert_to_eastern_animism:1 "Adoptar el culto swanco"
 convert_to_eastern_animism_desc:1 "Las diosas Swancho y Menya son adoradas en todas nuestras tierras. Los ídolos de Kem y Kom se encuentran en todos sus hogares. El estado también debería aceptar ahora a los dioses de Tocharia y la Cuenca del Tarim como propios."
 convert_to_nilotic_pantheon:0 "Adoptar la fe nhiálica"
 convert_to_nilotic_pantheon_desc:0 "El culto a Kowth Nhial y muchos Colwics del pueblo nilótico se ha extendido por nuestras tierras. Quizás es hora de aceptar a los dioses del Alto Nilo como los dioses de nuestra propia gente."
 convert_to_vaksh_religion:0 "Adoptar la fe voxita"
 convert_to_vaksh_religion_desc:0 "La religión del río Vakhsh se ha extendido en las tierras que administramos. La gente adora al dios del sol Mihr Oir por la mañana con el amanecer y nombra a sus hijos en honor a Ramset, el dios de las personas. Que el Señor Vish nos lleve a la iluminación, y adoremos a Vakhsh y su sagrado panteón de deidades."
 convert_to_nuragic_pantheon:0 "Adoptar la fe nurágica"
 convert_to_nuragic_pantheon_desc:0 "La religión nativa de los pueblos nurágicos de Cerdeña y Córcega es una tradición que se remonta mil años. El gran padre de los nurágicos nos invita a adorarlo. Abracemos el culto y las creencias de esta religión."
 convert_to_mithra_religion:0 "Adoptar el mitraísmo"
 convert_to_mithra_religion_desc:0 "Hemos notado la prevalencia del glorioso dios del sol, Mithra, junto con su fe mitraica. Los sacerdotes magos que provienen de Medos ciertamente son una entidad convincente. Nuestro estado podría beneficiarse al aceptar a Mithra y las prácticas del mitraísmo como propias."
 convert_to_uralic_pantheon:0 "Adoptar el ilmarismo"
 convert_to_uralic_pantheon_desc:0 "El dios supremo del cielo, Ilma, ha sido adoptado por muchos de nuestro pueblo. Hablan de la vibrante luz del primer amanecer y la ensordecedora oscuridad del último rayo del sol. Desde los finlandeses hasta los úgricos, y ahora también nosotros, las luces brillan. Es hora de abrir las cortinas de la nación y adoptar la religión ilamrica."
 convert_to_anatolian_religion:0 "Adoptar la fe anatolia"
 convert_to_anatolian_religion_desc:0 "Durante mucho tiempo, hemos creído con fervor en la diosa madre y en las demás deidades de nuestra fe. No obstante, en los últimos tiempos, el interés por estos otros dioses ha disminuido significativamente. Cibeles, la diosa madre, se ha convertido en la figura más importante de nuestras tradiciones y prácticas religiosas."
 convert_to_circassian_pantheon:0 "Abraza el Panteón Nártico"
 convert_to_circassian_pantheon_desc:0 "Los héroes y dioses de las Nart Sagas han encapsulado los corazones de nuestro pueblo. Su naturaleza poderosa, engañosa y compleja nos inspira a adoptarlos como nuestra religión oficial."
 convert_to_hurrian_pantheon:0 "Adoptar las creencias hurritas"
 convert_to_hurrian_pantheon_desc:0 "Las creencias hurritas-hititas son las de mil dioses. Como el antiguo Imperio de la Edad del Bronce se declaró la tierra de los mil dioses, quizás nuestros propios dioses pertenecen a ese panteón."
 convert_to_hatti_religion:0 "Adopta el Panteón hatti"
 convert_to_hatti_religion_desc:0 "Una vez, en las tierras que ahora conocemos como Anatolia, la llamábamos la tierra de los hatti. Y como el destino lo ha dispuesto, las tierras de los hatti han vuelto una vez más a la fe del antiguo pueblo. ¿Deberíamos también aceptar el resurgente panteón hatti?"

 form_scandia:0 "Formar Scandia"
 form_scandia_desc: ""
 SCANDIA_NAME:0 "Scandia"
 SCANDIA_ADJECTIVE:0 "Scandia"
 SCN:0 "Scandia"
 inherit_scandia_provinces_tooltip:0 "Conquistar todos los territorios en las áreas de $herulia_area$, $east_gothia_area$, $west_gothia_area$ y $ultima_thule_area$."
 
 turan_must_not_exist:0 "#T Turan#! #Y no debe existir#!."
 
 restore_argead_dynasty:0 "Restaurar la Dinastía Argea"
 restore_argead_dynasty_desc:0 "[COUNTRY.GetRuler.GetName], gobernante de Macedonia, sede de los reyes macedonios, ha decidido restaurar la dinastía Argea, ya que tiene sangre Argea, proveniente de la esposa de Casandro, Tesalónica, media hermana de Alejandro Magno."
 argead_restoration_tt:1 "Restauraremos la antigua dinastía Argea."

 formable_not_duna_exists:0 "#Y Duna#! no existe."
 DUN:0 "$DUNA_NAME$"
 DUNA_NAME:0 "duna"
 DUNA_ADJECTIVE:0 "Dunian"
 form_duna:0 "Forma Duna"
 form_duna_desc:0 "La ciudad conocida por los romanos como Duna Urbs recibe este nombre por su ubicación en el punto más occidental del río que lleva su mismo nombre, el río Duna. Su ubicación es ideal para acceder a las rutas comerciales internas de la franja oriental de Europa y aprovechar la rica red comercial del mar Báltico. Si bien el asentamiento sigue siendo pequeño en este momento, simplemente está destinado a la grandeza... y nosotros somos el primer paso de ese legado."

 become_gallus:0 "Castrarse"
 become_gallus_desc:0 "Debido a la naturaleza devota de nuestro gobernante, puede castrarse como si fuera un sacerdote santo de Cibeles para mostrar reverencia al consorte de Cibeles, Atis."
 make_gallus:0 "Ordenar al Sacerdote Convertirse en Galo"
 make_gallus_desc:0 "Los Galli eran sacerdotes o santos del culto de Cibeles. Como el consorte de la diosa, Atis, quien se castró en un frenesí divino, un Galo también se castraría y vestiría exclusivamente ropa de mujer. Continuemos esta práctica haciendo que nuestro sumo sacerdote se castre.\n\nPuedes hacer esto una vez cada 25 años."

 egypt_mission_3_empire_task_1a:0 "Refundando las Ciudades"
 egypt_mission_3_empire_task_1a_DESC:0 ""
 cyr_libyan_influences:0 "La Ciudad Greco-Libia"
 desc_cyr_libyan_influences:0 "Esta ciudad tiene una larga historia de colonos griegos y nativos libios viviendo lado a lado."
 cyr_treasure_serpent_of_slonta:0 "La Gran Serpiente Libia"
 cyr_treasure_serpent_of_slonta_desc:0 "Un magnífico relieve de piedra de una serpiente, creado por antiguos libios en adoración a sus dioses serpientes."
 cyr_silted_harbour:0 "Puerto Aterrado"
 desc_cyr_silted_harbour:0 "La laguna natural que sirve como puerto de esta ciudad está atestada de sedimentos, lo que dificulta el desembarque de los barcos."

 embellish_suebi_grave_fields:0 "Embellecer los Campos de Tumbas Suebios"
 embellish_suebi_grave_fields_desc:0 "Muchos guerreros muertos fueron enterrados en las tumbas de #Y Laciburaium#!, sus familias junto a ellos, y sus espíritus fueron liberados al más allá en elaboradas ceremonias de cremación. Todos nos sirvieron bien, cada uno a su manera. Sus lugares de descanso final han sido abandonados durante décadas y ahora están en un estado deplorable. \nSus espíritus liberados pueden mirarnos benevolentemente desde el más allá - si embellecemos y restauramos sus tumbas. Los muertos merecen ser recordados por las hazañas que lograron."
 chaukia_terp:0 "El Terp de Amsivaria"
 chaukia_terp_desc:0 "Las condiciones para construir un terp en [GetProvince('(int32)3836').GetName] basadas en el ejemplo de los frisones son ideales. Esto dará a nuestro pueblo más tierra para vivir, ya que es un montículo artificial de vivienda creado para proporcionar terreno seguro durante las tormentas, mareas altas e inundaciones de mar o río."

 # Rutabega Random Stuff

 form_salluvian_confederacy:0 "Formar la Confederación Saluviana"
 form_salluvian_confederacy_desc:0 "La Confederación Saluviana, que surgió en el siglo II a. C., era una organización tribal flexible de varias tribus saluvianas. Esta confederación se formó en parte para protegerse de la invasión de asentamientos masalianos. Sin embargo, esto no duraría mucho, ya que en 121 a. C., los romanos intervinieron entre los saluvianos y los masalianos, saquearon la capital de los primeros y subyugaron a sus líderes."
