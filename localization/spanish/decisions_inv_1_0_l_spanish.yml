 form_suania:0 "Suania"
 form_suania_desc:0 "Desde las alturas imponentes del Cáucaso, plantaremos nuestra bandera, la bandera de Suania, en la cima de los picos más altos: ¡proclamemos al mundo que una nación de conquistadores ha triunfado!"

 LIG:0 "$LIGURIA_NAME$"
 LIGURIA_NAME:0 "Liguria"
 LIGURIA_ADJECTIVE:0 "Ligurio"

# Lesser Scythia
 LES:0 "$LESSER_SCYTHIA_NAME$"
 LESSER_SCYTHIA_NAME:0 "Escitia Menor"
 LESSER_SCYTHIA_ADJECTIVE:0 "Escita"
 form_scythia:0 "Forma Escitia"
 form_scythia_desc:0 "Los escitas son un pueblo feroz e independiente, conocidos por sus proezas como guerreros y amos de las estepas. Ha llegado el momento de unir a las tribus de Escitia bajo una misma bandera, aportando fuerza y ​​estabilidad a estas tierras. A partir de aquí, protegeremos nuestra forma de vida y, si es necesario, la ampliaremos para proteger nuestras fronteras de posibles amenazas en todas direcciones."
 formable_not_scythia_exists:0 "#Y Escitia#! no existe."
 form_lesser_scythia_claims_tooltip:0 "#E Scythia#! obtendrá derechos sobre las áreas de #Y $borysthenia_minor_area$#! y #Y $borysthenia_area$#!."

 form_hellespontine_phrygia:0 "Forma Frigia Helespontina"
 form_hellespontine_phrygia_desc:0 "Establecida a principios del siglo V a. C., la Frigia Helespontina estaba gobernada por descendientes de Farnaces, un tío del rey Darío I el Grande, con su capital ubicada en Dascylium. Durante la campaña de Alejandro Magno en 334 a. C., el sátrapa de Frigia helespontina, Arsites, sufrió una derrota decisiva en la batalla del río Gránico, tras la cual se suicidó. Alejandro nombró a Calas como su sucesor. Tras la muerte de Alejandro en 323 a. C., la satrapía fue otorgada a Leonato, miembro de la casa real de Lyncestis en Macedonia y uno de los guardaespaldas de confianza de Alejandro. Leonato albergaba ambiciones más allá de su satrapía; buscó casarse con Cleopatra, la hermana de Alejandro, una medida que podría haber fortalecido su reclamo de poder. Si hubiera derrotado a los atenienses, es muy posible que Leonato hubiera intentado apoderarse del trono macedonio. Su carrera se vio truncada durante la Guerra de Lamian, donde dirigió una fuerza de 20.000 soldados de infantería y 1.500 de caballería para relevar a Antípatro durante el asedio de Lamia. Leonato murió en la batalla, dejando sus aspiraciones incumplidas. El control de la satrapía pasó luego a Arrideo, quien lo mantuvo hasta la partición de Triparadisus (321 a. C.), después de lo cual Clito el Blanco fue asignado como sátrapa. El gobierno de Clitus fue breve. Fue derrotado y asesinado en 317 a. C. Por Arrideo. Su sucesor, Ardys, gobernó durante un período incierto antes de que el poder volviera a cambiar. Fénix de Tenedos, un subordinado leal de Antígono, gobernó la región durante un tiempo, seguido por el sobrino de Antígono, Polemaio, otro de los generales de Antígono. Sin embargo, tras el suicidio forzado de Polemaio, la satrapía ha desaparecido."
 hellespontine_phrygia_claims_tooltip:0 "La Frigia Helespontina obtendrá derechos sobre las regiones de #Y $asia_region$#! y #Y $bithynia_region$#!."
 formable_not_hellespontine_phrygia_exists:0 "#Y Frigia helespontina#! NO debe existir."
