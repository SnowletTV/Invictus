 form_attica:0 "Forma Ática"
 form_attica_desc:0 "Durante siglos, la península del Ática y las islas circundantes han estado dominadas por Atenas, que durante un tiempo fue la más poderosa e influyente de todas las ciudades griegas. Pero este no fue siempre el caso; Recordamos una época en la que Ática todavía estaba dividida entre muchas ciudades, Eleusis, Thorikos, Rhamnous y Megara, por nombrar algunas. Dadas las cambiantes fortunas de las ciudades griegas desde el surgimiento de los Diadochi, sería prudente tratar de unir a nuestros parientes, incluso si es posible que hayamos estado divididos en el pasado."
 form_attica_claims_tooltip:0 "Attica obtendrá derechos sobre la provincia de #Y Attica#!."
