 form_greater_paeonia_claims_tooltip:0 "Recibiremos reclamaciones sobre las regiones de #Y Macedonia#! y #Y Tracia#!"
 form_greater_paeonia: "Forma la Gran Paeonia"
 form_greater_paeonia_desc: "Los peonios alguna vez controlaron tierras tan al este como Perinthus en Tracia, y supuestamente toda Migdonia y Crestonia estaban sujetas a ellos. El poder de Peonia declinó rápidamente como resultado de la expansión macedonia, y su otrora poderoso reino se redujo a algunos territorios pequeños. Recuperar estas tierras sería toda una hazaña, y quien lo hiciera sería digno del título de \"Gran Paeonia\"."
 
