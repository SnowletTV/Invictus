l_spanish:
 chinese_religions:0 "Shenismo"
 desc_chinese_religions:0 "Una tierra tan vasta como China contiene muchas filosofías y tradiciones que se entrelazan para crear un rico tapiz de vida espiritual; los preceptos de los grandes maestros, como Kong Fuzi, se respetan y mantienen junto con las antiguas prácticas rituales de los clanes locales. Se venera a los antepasados ​​y se ofrecen regalos sagrados a los caprichosos espíritus guardianes que protegen el hogar."
 convert_to_chinese_religions:0 "Adoptar el shenismo"
 convert_to_chinese_religions_desc:0 "Como una gran luz que brilla en lo alto de una elevada torre, la Fe Shenic proyecta largas sombras sobre nuestra gente, que se ha vuelto como girasoles para enfrentar el resplandor proveniente de dioses extraños. Y, sin embargo, ¿son tan extraños? ¿Son sus caminos tan diferentes a los nuestros? ¿No son mayores las similitudes?"
 # Shenic
 deity_chinese_sheshen:0 "$omen_chinese_sheshen$"
 omen_chinese_sheshen:1 "Sheshen"
 omen_chinese_sheshen_desc:3 "#Y Dios chino#!\nSheshen es el dios a cargo de la tierra.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_chinese_jishen:0 "$omen_chinese_jishen$"
 omen_chinese_jishen:1 "Jishen"
 omen_chinese_jishen_desc:3 "#Y Dios chino#!\nJishen es el título del dios de la agricultura y del dios de los cereales.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_chinese_tianzhu:0 "$omen_chinese_tianzhu$"
 omen_chinese_tianzhu:1 "Tianzhu"
 omen_chinese_tianzhu_desc:3 "#Y Dios chino#!\nTianzhu es uno de los ocho dioses adorados en Qi.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_chinese_dizhu:0 "$omen_chinese_dizhu$"
 omen_chinese_dizhu:1 "Dizhu"
 omen_chinese_dizhu_desc:3 "#Y Dios chino#!\nDizhu es uno de los ocho dioses adorados en Qi.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_chinese_bingzhu:0 "$omen_chinese_bingzhu$"
 omen_chinese_bingzhu:1 "Bingzhu"
 omen_chinese_bingzhu_desc:3 "#Y Dios chino#!\nBingzhu es uno de los ocho dioses adorados en Qi.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_chinese_yinzhu:0 "$omen_chinese_yinzhu$"
 omen_chinese_yinzhu:1 "Yinzhu"
 omen_chinese_yinzhu_desc:3 "#Y Dios chino#!\nYinzhu es uno de los ocho dioses adorados en Qi.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_chinese_yangzhu:0 "$omen_chinese_yangzhu$"
 omen_chinese_yangzhu:1 "yangzhu"
 omen_chinese_yangzhu_desc:3 "#Y Dios chino#!\nYangzhu es uno de los ocho dioses adorados en Qi.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_chinese_yuezhu:0 "$omen_chinese_yuezhu$"
 omen_chinese_yuezhu:1 "Yuezhu"
 omen_chinese_yuezhu_desc:3 "#Y Dios chino#!\nYuezhu es uno de los ocho dioses adorados en Qi.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_chinese_rizhu:0 "$omen_chinese_rizhu$"
 omen_chinese_rizhu:1 "Rizhu"
 omen_chinese_rizhu_desc:3 "#Y Dios chino#!\nRizhu es uno de los ocho dioses adorados en Qi.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_chinese_sishizhu:0 "$omen_chinese_sishizhu$"
 omen_chinese_sishizhu:1 "Sishizhu"
 omen_chinese_sishizhu_desc:3 "#Y Dios chino#!\nSishizhu es uno de los ocho dioses adorados en Qi.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_chinese_fengshi:0 "$omen_chinese_fengshi$"
 omen_chinese_fengshi:1 "Fengshi"
 omen_chinese_fengshi_desc:3 "#Y Dios chino#!\nFengshi, también llamado Fei Lian, es el dios del viento en la mitología china, transmite los ocho vientos de las noticias, a través de los cinco climas.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_chinese_yushi:0 "$omen_chinese_yushi$"
 omen_chinese_yushi:1 "yushi"
 omen_chinese_yushi_desc:3 "#Y Dios chino#!\nYushi, derivado de la mitología china, está a cargo de la lluvia.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_chinese_dasiming:0 "$omen_chinese_dasiming$"
 omen_chinese_dasiming:1 "Da Siming"
 omen_chinese_dasiming_desc:3 "#Y Dios chino#!\nDa Siming gobierna la vida y la muerte de las personas.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_chinese_shaosiming:0 "$omen_chinese_shaosiming$"
 omen_chinese_shaosiming:1 "shao siming"
 omen_chinese_shaosiming_desc:3 "#Y Dios chino#!\nShao Siming es el dios que está a cargo de los herederos en la tierra.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_chinese_houtu:0 "$omen_chinese_houtu$"
 omen_chinese_houtu:1 "Houtu"
 omen_chinese_houtu_desc:3 "#Y Dios chino#!\nHoutu es un representante de las deidades chinas de la tierra (un término genérico para todos los dioses de la naturaleza de la tierra) y tiene dominio sobre toda la tierra, similar a Gaia, la Madre Tierra de la mitología occidental.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_chinese_daizong:0 "$omen_chinese_daizong$"
 omen_chinese_daizong:1 "Daizong"
 omen_chinese_daizong_desc:3 "#Y Dios chino#!\nDaizong es el monte Tai, la montaña oriental. En la mitología y la leyenda, después de la muerte de Pan Gu, su cabeza se transformó en el Monte Tai.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_chinese_graangsreen:0 "$omen_chinese_graangsreen$"
 omen_chinese_graangsreen:1 "heengshan"
 omen_chinese_graangsreen_desc:3 "#Y Dios chino#!\nHuangdi estableció el Monte Heng como las Montañas del Sur, uno de los objetos del culto montañés.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_chinese_huashan:0 "$omen_chinese_huashan$"
 omen_chinese_huashan:1 "Huashan"
 omen_chinese_huashan_desc:3 "#Y Dios chino#!\nEl Monte Hua (también conocido como Monte Taihua), una de las Cinco Montañas, también se conoce como las Montañas Occidentales.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_chinese_gyyngsreen:0 "$omen_chinese_gyyngsreen$"
 omen_chinese_gyyngsreen:1 "Hengshan"
 omen_chinese_gyyngsreen_desc:3 "#Y Dios chino#!\nHengshan es el norte de las Cinco Montañas.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_chinese_songshan:0 "$omen_chinese_songshan$"
 omen_chinese_songshan:1 "Songshan"
 omen_chinese_songshan_desc:3 "#Y Dios chino#!\nSongshan es la montaña media de las Cinco Montañas.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_chinese_he:0 "$omen_chinese_he$"
 omen_chinese_he:1 "él bo"
 omen_chinese_he_desc:3 "#Y Dios chino#!\nHe Bo, el dios del río He, vive en el río He (ahora río Amarillo) y monta una tortuga blanca, usando los cinco peces rayados como guía para recorrer e inspeccionar el área, o subir al Monte Kunlun para reunirse con los dioses.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_chinese_huai:0 "$omen_chinese_huai$"
 omen_chinese_huai:1 "Huai Shen"
 omen_chinese_huai_desc:3 "#Y Dios chino#!\nEl dios del río Huai Shen. Uno de los Sidu.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"
 deity_chinese_ji:0 "$omen_chinese_ji$"
 omen_chinese_ji:1 "Ji Shen"
 omen_chinese_ji_desc:3 "#Y Dios chino#!\nEl dios del río de Ji Shen. Uno de los Sidu.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_chinese_jiang:0 "$omen_chinese_jiang$"
 omen_chinese_jiang:1 "Jiang Shen"
 omen_chinese_jiang_desc:3 "#Y Dios chino#!\nEl dios del río de Jiang Shen. Uno de los Sidu.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_chinese_xihe:0 "$omen_chinese_xihe$"
 omen_chinese_xihe:1 "Xihe"
 omen_chinese_xihe_desc:3 "#Y Dios chino#!\n Xihe, el nombre de la madre del dios sol en la mitología. Cuenta la leyenda que fue esposa de Di Jun, con quien dio a luz a diez hijos, todos ellos soles (cuervos dorados), que vivían en el mar oriental en el árbol Fusang y se turnaban para estar de servicio en el cielo.\n\n#! Efecto Apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_chinese_shangdi:0 "$omen_chinese_shangdi$"
 omen_chinese_shangdi:1 "Haotian Shangdi"
 omen_chinese_shangdi_desc:3 "#Y Dios chino#!\nShangdi, Emperador Celestial o Dios Hao Tian, comúnmente conocido como Cielo, Dios Celestial, Señor Celestial, Dios Celestial, es el dios supremo adorado por los hijos del cielo, emperadores y monarcas. Tiene su origen en la adoración de la cultura china al cielo (Cangtian, Haotian) y a la Estrella Polar (Beichen, Di Xing). Por un lado, el \"cielo superior\" se llama Hao Tian debido a su vasta energía. La visión de futuro del cielo se llama Cangtian. Nadie es más respetado que el emperador, y está encomendado al cielo, por eso se le llama Shangdi. Por otro lado, Shangdi reside en la Estrella Polar y es llamado el Emperador del Cielo, la Estrella de la Estrella Polar.\n\n#! Efecto Apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_chinese_qingdi:0 "$omen_chinese_qingdi$"
 omen_chinese_qingdi:1 "Qingdi Taihao"
 omen_chinese_qingdi_desc:3 "#Y Dios chino#!\nQingdi, uno de los cinco emperadores de la leyenda, está a cargo del este del mundo y es uno de los principales objetos de culto de los emperadores y los templos. También se le llama \"Cang Di\" y \"Mu Di\". En el concepto de \"Cinco Emperadores del Primer Cielo\", Qingdi es Taihao. Corresponde a la madera en los cinco elementos, a la primavera en las estaciones y al cian en los cinco colores.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_chinese_yandi:0 "$omen_chinese_yandi$"
 omen_chinese_yandi:1 "Yandi Shennong"
 omen_chinese_yandi_desc:3 "#Y Dios chino#!\nYandi, llamado Shennong porque era bueno cultivando fuego, fue llamado Yandi porque era el rey de la virtud del fuego y era el señor común del mundo en los tiempos antiguos legendarios.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_chinese_huangdi:0 "$omen_chinese_huangdi$"
 omen_chinese_huangdi:1 "Huangdi Xuanyuan"
 omen_chinese_huangdi_desc:3 "#Y Dios chino#!\nHuangdi es el primero de los Cinco Emperadores, a cargo del mundo. La leyenda mítica es que su padre Shaodian es el rey del oso, debido a que vive en la colina de Xuan Yuan, por lo que el nombre Xuan Yuan, viva el agua Ji, por el apellido Ji, el país del oso, también conocido como el oso.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_chinese_baidi:0 "$omen_chinese_baidi$"
 omen_chinese_baidi:1 "Baidi Shaohao"
 omen_chinese_baidi_desc:3 "#Y Dios chino#!\nSe dice que el Emperador Blanco, uno de los Cinco Emperadores, está a cargo del oeste del mundo y era uno de los principales objetos de adoración en los imperios y templos antiguos. En el concepto de los \"Cinco Emperadores del Primer Cielo\", Bai Di es Shao Hao. Corresponde al oro en los cinco elementos, al otoño en las estaciones y al blanco en los cinco colores.\n\n#! Efecto Apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_chinese_heidi:0 "$omen_chinese_heidi$"
 omen_chinese_heidi:1 "Heidi Zhuanxu"
 omen_chinese_heidi_desc:3 "#Y Dios chino#!\nZhuan Xu, uno de los cinco emperadores, vivía en el Xuan Gong, un palacio del norte, que es de color negro y tiene cinco elementos de agua, por lo que se decía que era un emperador con virtud del agua, también conocido como Xuan Di.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_chinese_xiangjun:0 "$omen_chinese_xiangjun$"
 omen_chinese_xiangjun:1 "xiangjun"
 omen_chinese_xiangjun_desc:3 "#Y Dios chino#!\nEl dios de Xiang Shui.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_chinese_xiangfuren:0 "$omen_chinese_xiangfuren$"
 omen_chinese_xiangfuren:1 "Xiangfuren"
 omen_chinese_xiangfuren_desc:3 "#Y Dios chino#!\nEl dios de Xiang Shui.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"

 # Tengri
 deity_hu_ulgen:0 "$omen_hu_ulgen$"
 omen_hu_ulgen:1 "ulgen"
 omen_hu_ulgen_desc:3 "#Y Deidades de Hu#!\nUlgen es la más sagrada de todas las criaturas de los cielos, reside en los dieciséis cielos, y ocupa el segundo lugar después del Arado (a veces incluso igual al Arado), el protector de todos los seres de las manos de Yin Yi, el dios de la incertidumbre y la muerte. Los chamanes suelen sacrificar caballos blancos durante los rituales de Miguel."
 deity_hu_qayra:0 "$omen_hu_qayra$"
 omen_hu_qayra:1 "Qayra"
 omen_hu_qayra_desc:3 "#Y Deidades de Hu#!\nQayra reside en el decimoséptimo cielo. Se dice que en la antigüedad vagó en el río del tiempo y se convirtió en el amo de los tres mundos del aire, el agua y la tierra después del nacimiento de la tierra, así como el creador de muchas cosas y seres humanos, y además, enseñó a la gente a hacer vino."
 deity_hu_tengri:0 "$omen_hu_tengri$"
 omen_hu_tengri:1 "tengri"
 omen_hu_tengri_desc:3 "#Y Deidades Di#!\nTengri era la deidad principal y dios supremo de Di, a menudo equiparado con el emperador celestial del Reino Medio. A medida que pasó el tiempo, su imagen comenzó a diferenciarse gradualmente, como Wo Tengri, que estaba a cargo del tiempo, y Fu Tengri, que estaba a cargo de la tierra."
 deity_hu_aqana:0 "$omen_hu_aqana$"
 omen_hu_aqana:1 "Aqana"
 omen_hu_aqana_desc:3 "#Y Deidades de Hu#!\nAqana es la hija de Qayra, el dios de la fertilidad y la vida de la tierra en la mitología de los Di, quien instó a Qayra a comenzar la creación a partir del río del tiempo."
 deity_hu_qizagan:0 "$omen_hu_qizagan$"
 omen_hu_qizagan:1 "Qizagán"
 omen_hu_qizagan_desc:3 "#Y Deidades de Hu#!\n Qizagan reside en los Nueve Cielos y se le representa con un arco en una mano y una trompeta en la otra, montado en un gran caballo rojo, y es un poderoso dios de la guerra en las creencias de los Di."
 deity_hu_erlik:0 "$omen_hu_erlik$"
 omen_hu_erlik:1 "Erlik"
 omen_hu_erlik_desc:3 "#Y Deidades de Hu#!\n Erlik reside en el infierno y es un símbolo de la muerte, el inframundo, la enfermedad y la mala suerte como la deidad Di. Como creador de los espíritus malignos, la gente a menudo le hace ofrendas para evitar las calamidades que envía."
 deity_hu_mergen:0 "$omen_hu_mergen$"
 omen_hu_mergen:1 "fusionar"
 omen_hu_mergen_desc:3 "#Y Deidades de Hu#!\n Mergen, el dios de la sabiduría y el pensamiento, reside en el cielo 17 y es conocido como un guerrero con casco y arco montado en un caballo blanco."
 deity_hu_umay:0 "$omen_hu_umay$"
 omen_hu_umay:1 "Umay"
 omen_hu_umay_desc:3 "#Y Deidades de Hu#!\n Umay es el dios de la fertilidad, el protector de las mujeres y los niños, y la esposa del cielo, y su imagen también está asociada con el sol. La diáspora del Norte le rezó por la bendición de muchos niños."

 # Baiyue
 deity_baiyue_warrior_worship:0 "$omen_baiyue_warrior_worship$"
 omen_baiyue_warrior_worship:1 "Adoración al guerrero"
 omen_baiyue_warrior_worship_desc:3 "#Y Deidades de Baiyue#!\n Adoración guerrera de Baiyue"
 deity_baiyue_weapon_worship:0 "$omen_baiyue_weapon_worship$"
 omen_baiyue_weapon_worship:1 "Adoración de armas"
 omen_baiyue_weapon_worship_desc:3 "#Y Deidades de Baiyue#!\n Adoración de armas de Baiyue"
 deity_baiyue_land_worship:0 "$omen_baiyue_land_worship$"
 omen_baiyue_land_worship:1 "Adoración de la tierra"
 omen_baiyue_land_worship_desc:3 "#Y Deidades de Baiyue#!\n Adoración a la tierra de Baiyue"
 deity_baiyue_forest_worship:0 "$omen_baiyue_forest_worship$"
 omen_baiyue_forest_worship:1 "Adoración del bosque"
 omen_baiyue_forest_worship_desc:3 "#Y Deidades de Baiyue#!\n Adoración del bosque de Baiyue"
 deity_baiyue_ancestor_worship:0 "$omen_baiyue_ancestor_worship$"
 omen_baiyue_ancestor_worship:1 "Adoración de los antepasados"
 omen_baiyue_ancestor_worship_desc:3 "#Y Deidades de Baiyue#!\n Adoración de los antepasados de Baiyue"
 deity_baiyue_elder_worship:0 "$omen_baiyue_elder_worship$"
 omen_baiyue_elder_worship:1 "Adoración a ancianos"
 omen_baiyue_elder_worship_desc:3 "#Y Deidades de Baiyue#!\n Adoración de ancianos de Baiyue"
 deity_baiyue_river_worship:0 "$omen_baiyue_river_worship$"
 omen_baiyue_river_worship:1 "Adoración del río"
 omen_baiyue_river_worship_desc:3 "#Y Deidades de Baiyue#!\n Adoración fluvial de Baiyue"
 deity_baiyue_fertility_cult:0 "$omen_baiyue_fertility_cult$"
 omen_baiyue_fertility_cult:1 "Culto a la fertilidad"
 omen_baiyue_fertility_cult_desc:3 "#Y Deidades de Baiyue#!\n Culto a la fertilidad de Baiyue"

 # Muisic
 deity_yi_god_of_wind:0 "$omen_yi_god_of_wind$"
 omen_yi_god_of_wind:1 "Sinjang"
 omen_yi_god_of_wind_desc:3 "El espíritu de los generales militares se llama sinjang. Estos espíritus se pueden encontrar en las almas de muchos grandes generales a lo largo de la historia. Estos generales militares incluyen incluso generales históricos más recientes."
 deity_yi_god_of_thunder:0 "$omen_yi_god_of_thunder$"
 omen_yi_god_of_thunder:1 "jowangshin"
 omen_yi_god_of_thunder_desc:3 "Jowangshin es la diosa muísta del fuego. También puede ser el \"dios de la cocina\" al que se hace referencia en las fuentes chinas. Jowangshin es la diosa no sólo del fuego, sino también del hogar y de los rituales tabú. Estos tabúes estarían prohibidos a las amas de casa, que seguían siendo las principales adoradoras de Jowangshin. Los rituales tabú son los siguientes.\n\nNo maldigas en casa.\nNo te sientes en el hogar.\nNo apoyes los pies en el hogar.\nLa cocina debe mantenerse limpia.\nDebes adorar a las deidades en la cocina.\n\nJonwangshin es uno de los coreanos más populares. Deidades, y castigaría a todos aquellos que cometieran cualquiera de los cinco tabúes. De hecho, se sabía que era bastante vengativa con quienes hacían esto, lo que le otorgaba un papel en la mitología como diosa vengativa."
 deity_yi_god_of_mountain:0 "$omen_yi_god_of_mountain$"
 omen_yi_god_of_mountain:1 "Sansillyong"
 omen_yi_god_of_mountain_desc:3 "Sansillyong, o Sansin, son espíritus de la montaña. Por lo general, se los representa como hombres con barba blanca, vestidos azules y acompañados de tigres. Protegen a los lugareños con su poderoso control sobre la naturaleza."
 deity_yi_god_of_grass:0 "$omen_yi_god_of_grass$"
 omen_yi_god_of_grass:1 "ch'ilsong"
 omen_yi_god_of_grass_desc:3 "La deidad cosmológica, Ch'ilsong, es el espíritu de las siete estrellas de la Osa Mayor. Ch'ilsong eventualmente se asociaría con el budismo, pero originalmente se asoció con el chamanismo coreano. Se sabe que el espíritu cuida a los niños."
 deity_yi_god_of_wine:0 "$omen_yi_god_of_wine$"
 omen_yi_god_of_wine:1 "Bari Gongju"
 omen_yi_god_of_wine_desc:3 "La diosa patrona de los chamanes, conductora de las almas de los difuntos y diosa de la Osa Mayor, Bari Gongju, o Princesa Bari, es una de las deidades más conocidas y veneradas del chamanismo coreano. Su historia es bastante antigua y se ha contado en varias versiones hasta la actualidad.\n\nHay varias versiones de la historia, pero los detalles básicos hablan del matrimonio entre un rey y una reina. La Reina da a luz a seis hijas, todas ellas tratadas con lujo. En el séptimo embarazo, la Reina recibe un sueño y lo toman como una señal de que el séptimo hijo finalmente sería un varón. Sin embargo, este séptimo hijo volvería a ser una hija. El rey, decepcionado, ordena que se deseche a la hija, o en coreano, 'beori'. De aquí vendría el nombre de Bari. Ella emprendería un viaje que finalmente la llevaría a alcanzar la divinidad."
 deity_yi_god_of_medicine:0 "$omen_yi_god_of_medicine$"
 omen_yi_god_of_medicine:1 "Hwanin"
 omen_yi_god_of_medicine_desc:3 "Hwanin o Haneunim, también llamado Haneul-nim o Sang-je, es el dios de los cielos. Él es el gobernante del reino celestial, él manda sabiduría y autoridad. Adquiriría gran prominencia durante la época del Reino de Gojoseon y ganaría aún más prominencia en el siglo XIX. Probablemente todavía era un dios importante durante este período. Hwanin es también el abuelo del Rey Dios Dangun."
 deity_yi_god_of_sea:0 "$omen_yi_god_of_sea$"
 omen_yi_god_of_sea:1 "Hogu Pyolsong"
 omen_yi_god_of_sea_desc:3 "Hogu Polsong es una diosa muísta de la viruela, sin embargo, es posible que antes haya sido una diosa de la enfermedad general. En el muismo coreano moderno, Hogu Polsong fue reinterpretada como una diosa de la varicela en lugar de la viruela. Esto muestra la naturaleza flexible y duradera del muismo."
 deity_yi_god_of_river:0 "$omen_yi_god_of_river$"
 omen_yi_god_of_river:1 "Yeongdeung"
 omen_yi_god_of_river_desc:3 "La diosa del viento, Yeongdeung Halman, también llamada Yongdong, controla los vientos marinos, especialmente en la isla de Jeju (Tamna), la isla más grande en la parte sur de la península de Corea. \n\nSu leyenda dice que vino del este de Tamna, pero una vez al año venía a la isla para proporcionarle vida, semillas y otras cosas similares para sustentar a la gente de la isla."
 deity_dalnim:0 "$omen_dalnim$"
 omen_dalnim:0 "Dálnim"
 omen_dalnim_desc:0 "Dalnim, hermana del dios sol Haemosu, es la diosa muísta de la luna. Tiene muchos mitos sobre el origen de cómo alcanzó su estatura divina. Un mito afirma que era tan hermosa que cautivó a los mismos cielos, otorgándole la divinidad. Otro mito afirma que subió tan alto que llegó a la luna. Y otro mito más plantea que ella y su hermano fueron capturados, por lo que ella oró al cielo. Del cielo surgió una cuerda, y ella y su hermano treparon por ella para ponerse a salvo y se convirtieron en las deidades del sol y la luna respectivamente."
 deity_haemosu:0 "$omen_haemosu$"
 omen_haemosu:0 "Haemosu"
 omen_haemosu_desc:0 "Hermano del dios de la luna Dalnim, Haemosu es el dios muísta del sol. Se decía que montaba un carro tirado por cinco dragones hasta la tierra para escuchar a los humanos antes de regresar a los cielos, haciendo referencia a la salida y puesta del sol."
 deity_seokga:0 "$omen_seokga$"
 omen_seokga:0 "Seokga"
 omen_seokga_desc:0 "Se sabe que el travieso dios embaucador, Seokga, bromea y se mete con los mortales constantemente. A pesar de ser una de las deidades creadoras de todo, Seokga deseaba ser el único gobernante del mundo. Retaría a Mireuk, la otra deidad creadora del universo, a un duelo de poder. Al que pueda crear más flores se le permitirá quedarse, mientras que al otro se le expulsará. Seokga robaría en secreto las flores cultivadas por Mireuk y, por lo tanto, Mireuk desaparecería. Sin embargo, este acto injusto provocó que ocurriera el primer pecado, lo que resultó en la primera muerte, y se crearía el ciclo constante de nacimiento y muerte, haciendo del mundo un lugar imperfecto lleno de momentos de alegría y sufrimiento."
 deity_mireuk:0 "$omen_mireuk$"
 omen_mireuk:0 "Mireuk"
 omen_mireuk_desc:0 "El dios principal de la creación y creador del universo, es quien separó el plano mortal del resto del cosmos. Se crearon 5 insectos dorados y 5 insectos plateados, y estas 5 parejas serían los antepasados ​​de todos los seres humanos que jamás hayan existido. Gobernó a la humanidad en una época sin pecado, sin dolor y sin muerte, pero todo eso cambiaría cuando el dios creador, Seokga, quisiera ser el único gobernante de la humanidad. Seokga, siendo un dios tramposo, haría trampa en una competencia que decidía quién gobernaría a la humanidad. Mireuk desaparecería al perder, dejando el mundo lleno de pecado, dolor y muerte en su ausencia."

 # Kodo
 deity_wa_god_kaze:0 "$omen_wa_god_kaze$"
 omen_wa_god_kaze:1 "fujin"
 omen_wa_god_kaze_desc:3 "#Y Deidades de Kodo#!\nUno de los Kami más antiguos, Fujin fue uno de los dos Kami nacidos de Izanami que escaparon de Yomi antes de que Izanagi lo sellara. Es el Kami del viento y a veces se le llama Kaze o Ryobo. Se le representa comúnmente con su hermano, Raijin, el Kami de los relámpagos, los truenos y las tormentas."
 deity_wa_god_kaminari:0 "$omen_wa_god_kaminari$"
 omen_wa_god_kaminari:1 "Raijin"
 omen_wa_god_kaminari_desc:3 "#Y Deidades de Kodo#!\nA veces conocido como Kaminari, Raijin era el Kami de los relámpagos, los truenos y las tormentas. Fue uno de los dos Kami nacidos de Izanami que escaparon de Yomi antes de que Izanagi lo sellara. A menudo se le representa con su hermano Fujin, el Kami del viento."
 deity_wa_god_hi:0 "$omen_wa_god_hi$"
 omen_wa_god_hi:1 "Kagu Tsuchi"
 omen_wa_god_hi_desc:3 "#Y Deidades de Kodo#!\nKagu Tsuchi, la fuerza brillante, nació de Izanami. Sin embargo, al ser un Kami de fuego, Kagu Tsuchi quema a Izanami hasta matarlo mientras ella lo da a luz. Izanagi, afligido por el dolor, decapita a Kagu Tsuchi, lo que resulta en la creación de varios Kami. Con el tiempo se le asociaría con los herreros. A Kagu Tsuchi a veces se le llama Hola."
 deity_wa_god_ame:0 "$omen_wa_god_ame$"
 omen_wa_god_ame:1 "Amaterasu"
 omen_wa_god_ame_desc:3 "#Y Deidades de Kodo#!\nAmaterasu es una diosa de las artes y del sol. También se la conoce como diosa de la fertilidad debido a que la luz del sol aporta crecimiento a la agricultura. Tiene una relación tumultuosa con su hermano, un Kami de las tormentas llamado Susano'o, que arruinó sus campos de arroz. Esto hizo que se enojara y negara al mundo su luz por un tiempo."
 deity_wa_god_kawa:0 "$omen_wa_god_kawa$"
 omen_wa_god_kawa:1 "kawa"
 omen_wa_god_kawa_desc:3 "#Y Deidades de Kodo#!\nEl rey del río Kami, el nombre de Kawa es tan sinónimo del río Kami que se convirtió en un término genérico para todos los ríos Kami. A veces también se le conoce como Kahaku."
 deity_wa_god_inazuma:0 "$omen_wa_god_inazuma$"
 omen_wa_god_inazuma:1 "Izanagi"
 omen_wa_god_inazuma_desc:3 "#Y Deidades de Kodo#!\nIzanagi fue una de las primeras 7 generaciones de Kami que surgieron de la creación de los cielos. Él y su hermana y esposa Izanami crearon juntos muchos kami. Sin embargo, un Kami, Kagu Tsuchi, era el Kami del fuego e Izanami murió quemado hasta morir mientras lo daba a luz. Izanagi estaba desconsolada y viajó a Yomi para recuperarla. Sin embargo, al llegar allí, rechazó a Izanami porque su carne estaba verde y podrida por la muerte. Selló a Izanami con una roca, bloqueando la tierra de los vivos de la tierra de los muertos."
 deity_wa_god_ama:0 "$omen_wa_god_ama$"
 omen_wa_god_ama:1 "Izanami"
 omen_wa_god_ama_desc:3 "#Y Deidades de Kodo#!\nIzanami fue una de las primeras 7 generaciones de Kami que surgieron de la creación de los cielos. Ella y su hermano y marido Izanagi juntos crearon muchos kami. Sin embargo, un Kami, Kagu Tsuchi, era el Kami del fuego e Izanami murió quemado hasta morir mientras lo daba a luz. Izanagi estaba desconsolada y viajó a Yomi para recuperarla. Sin embargo, al llegar allí, rechazó a Izanami porque su carne estaba verde y podrida por la muerte. Selló a Izanami con una roca, bloqueando la tierra de los vivos de la tierra de los muertos."
 deity_wa_god_yama:0 "$omen_wa_god_yama$"
 omen_wa_god_yama:1 "Oyamatsumi"
 omen_wa_god_yama_desc:3 "#Y Deidades de Kodo#!\nOyamatsumi era un Kami de montaña, que también se llama Yama-no-Kami. Oyamatsumi era hermano mayor de Amaterasu e hijo de Izanami e Izanagi. Continuaría produciendo ocho hijos Kami propios con No-Zuchi, así como dos Kami más que no tienen figura materna."
 deity_wa_god_umi:0 "$omen_wa_god_umi$"
 omen_wa_god_umi:1 "Okuninushi"
 omen_wa_god_umi_desc:3 "#Y Deidades de Kodo#!\nOkuninushi era un Kami de la construcción de naciones, los negocios y la agricultura. Es descendiente del Kami Susano'o. Okuninushi eventualmente se asociaría con Western Wa."
 deity_wa_god_tsuki:0 "$omen_wa_god_tsuki$"
 omen_wa_god_tsuki:1 "Tsuki yomi"
 omen_wa_god_tsuki_desc:3 "#Y Deidades de Kodo#!\nTsuki-Yomi es el Kami la luna. Es el hermano gemelo de la diosa del sol Amaterasu. Tuvo una pelea con Amaterasu porque mató a un Kami de comida, y desde entonces, Amaterasu no quiso verlo más, dando origen al concepto de día y noche."
 deity_wa_god_tsuchi:0 "$omen_wa_god_tsuchi$"
 omen_wa_god_tsuchi:1 "Kuninotokotachi"
 omen_wa_god_tsuchi_desc:3 "#Y Deidades de Kodo#!\nKuninotokotachi fue uno de los dos de la primera generación de Kami. Llegó a la Tierra primordial y a veces se le considera el Kami primordial del universo."
 deity_wa_god_sorei:0 "$omen_wa_god_sorei$"
 omen_wa_god_sorei:1 "Sorei"
 omen_wa_god_sorei_desc:3 "#Y Deidades del Kodo#!\nSorei es el concepto de adoración a los antepasados en el kodoísmo temprano. Sorei podría convertirse no sólo en espíritus y protectores, sino incluso elevados al estado de Kami. Muy específicamente, Sorei se refiere a aquellos espíritus ancestrales que se recuerdan en una fecha específica del calendario, como un día festivo o un día conmemorativo."
 deity_minakanushi:0 "$omen_minakanushi$"
 omen_minakanushi:0 "Ame-no-Minakanushi"
 omen_minakanushi_desc:0 "#Y Deidades de Kodo#!\nAme-no-Minakanushi es la primera deidad que se manifiesta después de la creación de los cielos. Son una de las 5 deidades anteriores a las 7 generaciones de Kami. Eran el Maestro Central de las tres primeras deidades."
 deity_takamimusubi:0 "$omen_takamimusubi$"
 omen_takamimusubi:0 "takamimusubi"
 omen_takamimusubi_desc:0 "#Y Deidades de Kodo#!\nTakamimusubi fue la segunda de las deidades en manifestarse después de la creación de los cielos. Existieron antes de las 7 generaciones de Kami. Eran el Alto Creador y un Kami de la agricultura."
 deity_kamimusubi:0 "$omen_kamimusubi$"
 omen_kamimusubi:0 "kamimusubi"
 omen_kamimusubi_desc:0 "#Y Deidades de Kodo#!\nKamimusubi fue la tercera de las deidades en manifestarse después de la creación de los cielos. Son anteriores a las 7 generaciones de Kami. Ellos eran el Creador Divino."
 deity_mizuhanome:0 "$omen_mizuhanome$"
 omen_mizuhanome:0 "Mizuhanome"
 omen_mizuhanome_desc:0 "#Y Deidades de Kodo#!\nMizuhanome era un Kami de agua. Era hija de Izanami, nacida de su orina y, a veces, se la conoce como la diosa del dragón de agua."
 deity_inari:0 "$omen_inari$"
 omen_inari:0 "Inari"
 omen_inari_desc:0 "#Y Deidades de Kodo#!\nInari es el Kami de los zorros. También se la llama Inari-Okami. Inari es considerado un dios de la fertilidad y asociado con mensajes, ya que se decía que los zorros podían entregar mensajes a los mortales desde la propia Inari."
