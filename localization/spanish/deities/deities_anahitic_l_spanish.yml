l_spanish:

 deity_zeus_oromasdes:0 "$omen_zeus_oromasdes$"
 omen_zeus_oromasdes:0 "Zeus-Oromasdes"
 omen_zeus_oromasdes_desc:0 "Zeus-Oromasdes, una deidad de Commagane, combina influencias armenias, griegas y persas. Un dios de la cultura, Zeus-Oromasdes habría sido un dios supremo del panteón comageniano.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"

 deity_zeus_oromasdes_par:0 "$omen_zeus_oromasdes$"
 omen_zeus_oromasdes_par:0 "Zeus-Oromasdes"
 omen_zeus_oromasdes_par_desc:0 "Zeus-Oromasdes, una deidad de Commagane, combina influencias armenias, griegas y persas. Un dios de la cultura, Zeus-Oromasdes habría sido un dios supremo del panteón comageniano.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"

 deity_apollo_mithras:0 "$omen_apollo_mithras$"
 omen_apollo_mithras:0 "Apolo-Mitra"
 omen_apollo_mithras_desc:0 "Apolo-Mitra, deidad de Comagene, combina influencias armenias, griegas y persas. Un dios de la economía, Apolo-Mitra combina las artes de Apolo con la luz de Mitra.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"

 deity_herakles_artagnes:0 "$omen_herakles_artagnes$"
 omen_herakles_artagnes:0 "Heracles-Artagnes"
 omen_herakles_artagnes_desc:0 "El poderoso Heracles-Artagnes, forjado en las montañas de Comagene a partir de la influencia anahítica, zoroástrica y helénica. Es un dios de la guerra.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_kommagene:0 "$omen_kommagene$"
 omen_kommagene:0 "Kommagene"
 omen_kommagene_desc:0 "Kommagene, la diosa de la fortuna, la suerte y el pueblo de Commagene. Esta deidad patrona era adorada entre otras deidades comagenianas. Es una diosa de la fertilidad.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_tork_angegh:0 "$omen_tork_angegh$"
 omen_tork_angegh:0 "Tork Angegh"
 omen_tork_angegh_desc:0 "Tork Angegh, originalmente un dios sincrético, es adorado en la fe armenia de Anahitic. Uno de los antepasados ​​del legendario fundador del pueblo armenio, Hayk, Tork Angegh es un dios de fuerza, coraje y poder antinaturales. Se dice que es un hombre feo, pero un gran guerrero.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_vanatur:0 "$omen_vanatur$"
 omen_vanatur:0 "Vanatur"
 omen_vanatur_desc:0 "Posiblemente un epíteto de la diosa Astlik, o posiblemente del dios Aanor, Vanatur era el señor de Van, que significaba \"dar asilo\". Era un dios de la hospitalidad.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"

 deity_amanor:0 "$omen_amanor$"
 omen_amanor:0 "Amanor"
 omen_amanor_desc:0 "Amanor, posiblemente el mismo dios que Vanatur, o que significa el más divino, Amanor era el portador de nuevos frutos y se asociaba como el dios del nuevo año.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"

 deity_barshamin:0 "$omen_barshamin$"
 omen_barshamin:0 "Barshamín"
 omen_barshamin_desc:0 "El dios anahítico del cielo, las tormentas y el clima proviene de múltiples influencias de las religiones circundantes. La influencia griega en la región, junto con las creencias de los pueblos seméticos y su dios Bal Shamin, contribuyeron al nacimiento del poderoso dios de la guerra del trueno, Barshamin.\n\n#! Efecto apoteósico: $military_apotheosis_capital_freemen_effect_tt_description$"

 deity_hayk:0 "$omen_hayk$"
 omen_hayk:0 "Hayk"
 omen_hayk_desc: "Hayk, el legendario fundador semidivino del pueblo armenio. Se decía que había liderado a los armenios en una rebelión contra el malvado rey babilónico Bel. Con sus asombrosas habilidades de tiro con arco, mató a Bel en el campo de batalla, ganando la autonomía de Armenia de los babilonios.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"

 deity_astlik:0 "$omen_astlik$"
 omen_astlik:0 "Astlik"
 omen_astlik_desc:0 "Astlik se asoció fuertemente con la diosa griega Afrodita. Probablemente originalmente provenía de la misma raíz que Inanna y era una importante diosa del amor. Su papel disminuyó a medida que pasaba el tiempo, pero siguió siendo una diosa importante hasta la época cristiana.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_omanos:0 "$omen_omanos$"
 omen_omanos:0 "Omanos"
 omen_omanos_desc:0 "Un dios de buen pensamiento y buenos propósitos, Omanos es la variante anahítica deificada del concepto zoroástrico Vohu Manah. Vohu Manah era una faceta de Azurha Mazda asociada especialmente con el ganado. Por lo tanto, Omanos era un dios del ganado.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"

 deity_anadatus:0 "$omen_anadatus$"
 omen_anadatus:0 "Andato"
 omen_anadatus_desc:0 "Andatus es una versión deificada del concepto zoroástrico de inmortalidad, o Ameretat. En anahítico, es un dios que representa la divinidad y la divinidad.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"

 omen_anahit_desc:3 "Anahit, la diosa del amor, la fertilidad, el nacimiento y uno de los dioses más importantes del pueblo armenio. Los cognados de Anahit incluyen Inanna, Astlik y Anunit. Anahit a menudo se identifica con Artemisa y, a veces, con Afrodita. Tenía muchos templos repartidos por tierras armenias y puede haber sido su divinidad más venerada. Ella era la esposa de Armazd y hermana de Mihr y Nane.\n\nEsperamos que la cariñosa Anahit bendiga a nuestra nación con protección para nuestros jóvenes, sus seguidores viven cómodamente con el conocimiento de que sus hijos ahora pueden traer al mundo de manera segura.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"

 deity_vahagn:0 "$omen_vahagn$"
 omen_vahagn:1 "Vahagn"
 omen_vahagn_desc:3 "Vahagn era la deidad solar y guerrera armenia a la que se rezaba por coraje, fuerza y valor, y su culto solo era superado por el de Aramazd. Era el matador de dragones y conocido como el valiente y el de los mechones de fuego. Su templo principal estaba en Ashtishat, un importante templo-estado gobernado por una familia sacerdotal, los Vahevuni, que afirmaban ser descendientes de Vahagn. \n\nRogamos a Vahagn, el Dragón Segador del cabello llameante, que conceda a nuestros guerreros una medida de su valentía. Préstanos tu fuerza para las próximas batallas, para que nuestros guerreros puedan reinar victoriosos en el campo de batalla.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
