l_spanish:

 #New Arabian deities
 deity_hubal:0 "$omen_hubal$"
 omen_hubal:0 "Hubal"
 omen_hubal_desc:0 "Hubal es un dios de la luna o del cielo adorado en la Ka'aba en La Meca, en el oeste de Arabia, y originalmente era un dios de la lluvia y la guerra adorado por los nabateos. Se cree que el ídolo del dios en la Ka'aba es un oráculo que puede ayudar a los humanos en la adivinación, que se realiza arrojando flechas ante la estatua y haciendo preguntas sobre las acciones a tomar en el futuro. La dirección en la que apuntan las flechas caídas proporciona respuestas a sus preguntas.\n\n#! Efecto Apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_wadd:0 "$omen_wadd$"
 omen_wadd:0 "Wadd"
 omen_wadd_desc:0 "Wadd es la deidad nacional de los minas del sur de Arabia y está asociada con la serpiente. Los minaeos que vivían en la isla griega de Delos le construyeron un altar que contenía inscripciones tanto en minaeo como en griego. También es adorado en un templo por los colonos minaeos en Dedán, bajo el dominio lihyanita. Wadd era también la deidad nacional del antiguo reino de Awsan. Durante la era helenística, un rey de Awsan sería deificado como el \"hijo de Wadd\". Su imagen estaría vestida al estilo griego en lugar de árabe y recibiría ofrendas como si fuera un dios.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_athtar:0 "$omen_athtar$"
 omen_athtar:0 "Attar"
 omen_athtar_desc:0 "'Athtar es una antigua deidad semítica cuyo papel, nombre e incluso género varía según la cultura. El nombre aparece como 'Attar (arameo), 'Athtar (Arabia del Sur), 'Astar (Aksum), 'Ashtar (Moab) e Ishtar en Mesopotamia. En ambos sexos, 'Athtar está asociado con el planeta Venus, la estrella de la mañana y la tarde. La deidad también está relacionada con la diosa fenicia 'Ashtart. En el sur de Arabia, es adorado como dios de la guerra y a menudo se le conoce como \"El que es valiente en la batalla\". Uno de sus símbolos es la punta de lanza y el antílope es su animal sagrado. Tiene poder sobre Venus, la estrella de la mañana, y se cree que proporciona agua a la humanidad. Como tal, Athtar también es un dios de las tormentas y la lluvia, el agua que fluye, el riego y la fertilidad a través del agua.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"

 deity_shams:0 "$omen_shams$"
 omen_shams:0 "Shams"
 omen_shams_desc:0 "Shams es una diosa del sol del sur de Arabia y la diosa patrona del Reino Himyarita. Su contraparte en el norte de Arabia es la diosa del sol Nuha. La antigua religión árabe se centra en los dioses locales, y cada tribu y reino tiene sus deidades protectoras específicas. Sin embargo, también existen dioses comunes a todos los árabes, como la trinidad que representa el Sol, la Luna y el planeta Venus, aunque sus nombres, género y culto difieren según las regiones. Por eso, Shams se llama Nuha en el norte. En Mesopotamia, Shams se identifica con el dios sol masculino Shamash, del mismo modo que el dios árabe masculino Athtar está vinculado con la diosa mesopotámica Ishtar. Shams se presenta a menudo como la esposa de Athtar.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_almaqah:0 "$omen_almaqah$"
 omen_almaqah:0 "Almaqah"
 omen_almaqah_desc:0 "'Almaqah es el dios del sol del Reino de Saba, en el sur de Arabia, y del Reino de Aksum, en África oriental. La dinastía gobernante de Saba se consideraba su descendiente directa. 'Almaqah está representada pictóricamente por un grupo de relámpagos que rodean un arma curva como una guadaña. Los toros son sagrados para él. El Templo de Barran y Mahram Bilqis están dedicados a él.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"

 deity_maher:0 "$omen_maher$"
 omen_maher:0 "Maher"
 omen_maher_desc:0 "Maher es el dios de la guerra de los Aksumitas y los Himyaritas. Es hijo del dios principal 'Ashtar ('Athtar en el sur de Arabia) y la contraparte de Beher, el dios del mar.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"

 deity_beher:0 "$omen_beher$"
 omen_beher:0 "Beher"
 omen_beher_desc:0 "Beher es el dios aksumita del mar. Él es parte de una trinidad de deidades junto con 'Ashtar (el 'Athtar del sur de Arabia), el dios supremo, y el hijo de 'Astar, Maher, el dios de la guerra.\n\n#! Efecto de apoteosis: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"

 deity_amm:0 "$omen_amm$"
 omen_amm:0 "Amm"
 omen_amm_desc:0 "'Amm es la deidad de la luna y el clima en Qataba. 'Amm es también la palabra árabe para tío paterno. Los habitantes del reino se refieren a sí mismos como Banu 'Amm, o los 'Hijos de' Amm. Al igual que Almaqah y otras deidades del sur de Arabia, está simbolizado, al menos en parte, por rayos. Su esposa es la diosa 'Asherat, que es la misma que la diosa ugarítica 'Athiratu. Cuenta con el apoyo de la deidad oráculo legalista 'Anbay.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"

 deity_sayin:0 "$omen_sayin$"
 omen_sayin:0 "Sin"
 omen_sayin_desc:0 "El pecado es el dios de la luna en las antiguas religiones mesopotámicas de Sumer, Acad, Asiria y Babilonia. Ahora también es adorado en Hadramaut como el dios de la luna y la riqueza, donde recibe el nombre de Sayin.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_dhushara:0 "$omen_dhushara$"
 omen_dhushara:0 "Dhushara"
 omen_dhushara_desc:0 "Dhu-Shara es un dios venerado por los nabateos en Petra y Madain Saleh (donde es el patrón). Comparte el liderazgo del panteón nabateo con Dioniso. Se esperaba que Dhu-Shara administrara justicia si se invocaba con el ritual adecuado.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_ruda:0 "$omen_ruda$"
 omen_ruda:0 "Rue"
 omen_ruda_desc:0 "Ruda se encuentra entre las deidades más importantes del norte de Arabia. Mencionado por primera vez en los anales de Esarhaddon a principios del siglo VII a. C., es un dios protector asociado con la luna. Su nombre significa 'bien dispuesto'.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_atarsamain:0 "$omen_atarsamain$"
 omen_atarsamain:0 "Atarsamain"
 omen_atarsamain_desc:0 "Atarsamain, la estrella de la mañana del cielo. Son una deidad astral, sin género. A menudo se asocian con Al-lat o Attar.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_rekem:0 "$omen_rekem$"
 omen_rekem:0 "Rekem"
 omen_rekem_desc:0 "Rekem, la deidad patrona de Petra, una de las ciudades más grandes de la región. Que Rekem bendiga la ciudad y a todos los que crean en él durante cien años y luego cien más.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"

 deity_dushara_ara:0 "$omen_dushara_ara$"
 omen_dushara_ara:0 "Dushara-A`ra"
 omen_dushara_ara_desc:0 "Dushara-A`ra, el Señor de la Montaña, es el gran dios de los nabateos. Más tarde se le asoció con personajes como Zeus, Helios y Dioniso."

 deity_anbay:0 "$omen_anbay$"
 omen_anbay:0 "Anbay"
 omen_anbay_desc:0 "Anbay es una deidad de la justicia adorada en el Reino de Qataba. A menudo se le invoca junto con Haukim, otro dios de la ley.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_sumhu:0 "$omen_sumhu$"
 omen_sumhu:0 "Sumhu"
 omen_sumhu_desc:0 "Sumhu es la deidad patrona de la ciudad Samharam, que significa \"Sumhu es Alto\". La ciudad fue fundada en el siglo III a. C. Por colonos hadrami, lo que indica que Sumhu probablemente formaba parte de la fe local. Una única inscripción, descifrada en junio de 2025, dice: \"Que la mano de Sumhu esté sobre él\".\n\n#! Efecto de apoteosis: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
