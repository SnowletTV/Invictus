l_spanish:
 ## Generic Arabic Deities ##
 deity_alilat:0 "$omen_alilat$"
 omen_alilat:1 "Alilat"
 omen_alilat_desc:3 "El gran Aililat estará entre nuestros hombres y los bendecirá con conocimiento de la guerra, para asegurar su lealtad y moral. Con su disciplina fortalecida, estamos seguros de ganar muchas guerras y encontrar victorias donde nunca antes pudimos.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_al_uzza:0 "$omen_al_uzza$"
 omen_al_uzza:1 "Al-Uzza"
 omen_al_uzza_desc:3 "Con las bendiciones de Al-Uzza, nuestros jóvenes se prepararán fácilmente para la guerra sabiendo que la diosa los cuidará y protegerá. Con estos nuevos reclutas, nuestros ejércitos seguramente rebosarán de hombres para conquistar a nuestros enemigos.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_al_kutbay:0 "$omen_al_kutbay$"
 omen_al_kutbay:1 "Al-Kutbay"
 omen_al_kutbay_desc:3 "El escriba enseñará a nuestros eruditos en materia de profecía y escritura. A medida que se nos enseñan cosas nuevas, seguramente se utilizarán para mejorar y beneficiar a nuestra sociedad en su conjunto.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"
 deity_talab:0 "$omen_talab$"
 omen_talab:1 "Ta'lab"
 omen_talab_desc:3 "Ta'lab es una deidad lunar que tiene cierta influencia sobre la tierra, la fertilidad y la cosecha. A menudo invocamos su oráculo para que nos dé consejos sobre cómo proceder en tiempos de necesidad.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_ailiah:0 "$omen_ailiah$"
 omen_ailiah:1 "Ailiah"
 omen_ailiah_desc:3 "El dios supremo nos cuidará y ayudará en las guerras, justificando nuestra expansión a tierras extranjeras. Sólo nuestros rivales más feroces se opondrán a nuestras continuas campañas ahora que tenemos a Ailiah de nuestro lado, aprobando nuestras guerras.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_al_qaum:0 "$omen_al_qaum$"
 omen_al_qaum:1 "Al-Qaum"
 omen_al_qaum_desc:3 "Le pedimos al dios de las caravanas que cuide a nuestros comerciantes mientras viajan por el mundo por el bien de nuestra nación. Cuanto más ricos se vuelvan nuestros comerciantes y caravanas, más prosperidad traerán a nuestra comunidad.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_manat:0 "$omen_manat$"
 omen_manat:1 "Manat"
 omen_manat_desc:3 "Ofrecemos nuestras bendiciones a la gran Manat, con la esperanza de que mejore el destino de nuestro pueblo. Con la gran diosa a nuestro lado, seguramente veremos menos luchas y desacuerdos internos por el momento.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
 deity_orotalt:0 "$omen_orotalt$"
 omen_orotalt:1 "Orotalt"
 omen_orotalt_desc:3 "Se harán sacrificios a Orotalt para convencer al dios de que bendiga nuestras cosechas con vida durante muchos años más. Nuestros cultivos seguramente crecerán con fuerza siempre que tengamos el apoyo y la ayuda del dios.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
