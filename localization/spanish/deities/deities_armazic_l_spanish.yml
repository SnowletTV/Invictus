l_spanish:
 ## Generic Deities ##
 deity_zadeni:0 "$omen_zadeni$"
 omen_zadeni:1 "Zadeni"
 omen_zadeni_desc:2 "Zadeni es el dios patrón de la guerra y la fecundidad al que nuestros hombres suelen invocar antes de ir a la batalla. Suele verse con una flor o un hacha en las manos, acompañado de un león alado. Es conocido entre los griegos como Heracles.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_armazi:0 "$omen_armazi$"
 omen_armazi:1 "Armazi"
 omen_armazi_desc:2 "Armazi es el dios patrón de la lluvia, los truenos, el clima y la abundancia. Vestido con una armadura y espada en mano, es una inspiración para quienes lo siguen. Entre los zoroastrianos se le conoce como Ahura Mazda, mientras que entre los griegos se le conoce como Zeus.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"
 deity_kopala:0 "$omen_kopala$"
 omen_kopala:1 "Kopala"
 omen_kopala_desc:2 "Un gran héroe que es venerado por un gran número de nuestro pueblo por sus grandes hazañas heroicas. El mayor de ellos fue su derrota de los devebi del reino, sellándolos bajo tierra después de vencerlos tanto en un concurso como en una batalla.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_gacim:0 "$omen_gacim$"
 omen_gacim:1 "Gacim"
 omen_gacim_desc:2 "Gacim es el compañero de Ga y un dios de la fertilidad por derecho propio. Los dos son vistos a menudo como deidades que gobiernan todos los misterios del mundo, así como también como tejedores del destino. Algunos equiparan a Gacim con los Attis de Anatolia.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_ghmerti:0 "$omen_ghmerti$"
 omen_ghmerti:1 "Ghmerti"
 omen_ghmerti_desc:2 "Ghmerti es el jefe de nuestro panteón, ante todo nuestras deidades y señor del universo. Es el padre del sol y la luna, además de varias de las otras deidades de nuestro panteón. Como creador de todo, la vida de los hombres y los animales descansa en sus manos.\n\n#! Efecto Apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_ga:0 "$omen_ga$"
 omen_ga:1 "Ga"
 omen_ga_desc:2 "Ga es la compañera de Gacim y una diosa madre por derecho propio. Los dos son vistos a menudo como deidades que gobiernan todos los misterios del mundo, así como también como tejedores del destino. Algunos equiparan a Ga con la Cibeles de Anatolia.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_adgilis_deda:0 "$omen_adgilis_deda$"
 omen_adgilis_deda:1 "Adgilis Deda"
 omen_adgilis_deda_desc:2 "Adgilis Deda es una diosa de la fertilidad y la ganadería. Ella guía la cosecha y el ganado de nuestros agricultores, y protege a los viajeros que llegan a nuestras tierras. A menudo se la ve como la diosa principal de la gente que vive en las duras tierras montañosas de Iberia.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_dali:0 "$omen_dali$"
 omen_dali:1 "Dali"
 omen_dali_desc:2 "Dalí es la diosa patrona de la caza, una hermosa deidad que habita en las montañas del Cáucaso. Entre los cazadores, ella es la diosa principal a la que invocan para poder entrar en su reino, y sólo con su ayuda encontrarán la presa que buscan.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"

 ## Ainina and Danina, event made omens ##
 deity_ainina_and_danina:0 "$omen_ainina_and_danina$"
 omen_ainina_and_danina:1 "Ainina y Danina"
 omen_ainina_and_danina_desc:2 "Ainina y Danina son un par de diosas introducidas en el panteón armazic en una fecha posterior. A menudo se asocian con la fertilidad, la curación y la sabiduría, y tienen seguidores de culto. Ocasionalmente se los equipara con Anahit o Inanna.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
