l_spanish:
 ## Default ##
 deity_gekho:0 "$omen_gekho$"
 omen_gekho:0 "Gekhö"
 omen_gekho_desc:0 "Gekhö es la principal de las muchas $tibetan$ deidades, un dios de los cielos y las estrellas. La mayoría de los demás dioses invocados por los lugareños se inclinan ante él, y él es conocido por vencer a los espíritus malignos que podrían perturbar a sus fieles. Se le suele venerar con el sacrificio de yaks, ovejas u oro, obsequios ofrecidos como agradecimiento por su ayuda.\n\n#! Efecto apoteósico: $military_apotheosis_capital_freemen_effect_tt_description$"

 deity_tingnam_gyalmo:0 "$omen_tingnam_gyalmo$"
 omen_tingnam_gyalmo:0 "Tingnam Gyalmo"
 omen_tingnam_gyalmo_desc:0 "Tingnam Gyalmo es una diosa del océano vestida de azul y consorte de Kuchi Mangke. Como protectora de océanos y ríos, desempeña un papel importante para los $bon_religion$ fieles y es profundamente venerada.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"

 deity_drablai_gyalmo:0 "$omen_drablai_gyalmo$"
 omen_drablai_gyalmo:0 "Drablai Gyalmo"
 omen_drablai_gyalmo_desc:0 "Drablai Gyalmo es una de las deidades más importantes de la fe $bon_religion$, la consorte de Gekhö y una diosa de los cielos por derecho propio. La diosa adopta muchos aspectos, ya sea una tranquila diosa blanca de la vida o una aterradora bruja negra de la muerte, y a menudo se la asocia con los cuerpos celestes y los fenómenos naturales.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"

 deity_kuchi_mangke:0 "$omen_kuchi_mangke$"
 omen_kuchi_mangke:0 "Kuchi Mangke"
 omen_kuchi_mangke_desc:0 "Kuchi Mangke es un dios de la fertilidad asociado con Gekhö y consorte de Tingnam Gyalmo. Generalmente se le representa como un dios pequeño, algunos dicen que su cuerpo es tan pequeño como un huso, y tiene la tarea de proteger a los niños de los espíritus malignos que podrían dañarlos.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"

 deity_ati_muwer:0 "$omen_ati_muwer$"
 omen_ati_muwer:0 "Ati Muwer"
 omen_ati_muwer_desc:0 "Ati Muwer es un dios de la guerra por derecho propio y un miembro importante del círculo de deidades asociadas con Gekhö; en algunas tradiciones, se la considera su consorte. A menudo se la representa con una armadura dorada o dorada, con un arco en la mano, cabalgando por el cielo.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_phuwer:0 "$omen_phuwer$"
 omen_phuwer:0 "Phuwer"
 omen_phuwer_desc:0 "Phuwer es un dios de la adivinación y la astrología, y miembro del círculo de Gekhö. La deidad suele representarse como una figura impresionante vestida con túnicas blancas, junto con tres compañeras. Los fieles $bon_religion$ veneran al dios con vellón de cordero, cintas de colores y corazones secos de murciélago, grulla y cuco.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_traphu:0 "$omen_traphu$"
 omen_traphu:0 "Traphu"
 omen_traphu_desc:0 "Traphu es una deidad más pequeña entre los $bon_religion$ fieles, generalmente asociada con las regiones más al norte de donde proviene originalmente: las tierras míticas de Drugu. Se dice que nació en un castillo de cristal, rodeado de pájaros, rayos de luna y rayos de sol.\n\n#! Efecto Apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"

 deity_the_elements:0 "$omen_the_elements$"
 omen_the_elements:0 "Los elementos"
 omen_the_elements_desc:0 "Los cinco elementos (o Ngayab para los lugareños) juegan un papel importante en la fe $bon_religion$, incluso estando personificados como deidades menores. De los cinco elementos: viento, tierra, agua, fuego y espacio; el aire era normalmente el más importante y se representaba montando un ciervo blanco a través de la tierra.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 ##Invictus##
 deity_shenlha_okar:0 "$omen_shenlha_okar$"
 omen_shenlha_okar:0 "Shenlha Ökar"
 omen_shenlha_okar_desc:0 "A menudo se representa a Shenlha Okar montando un león blanco y sosteniendo un arco y una flecha, lo que representa su capacidad para proteger a sus seguidores de influencias negativas. También se le asocia con el sol, y su adoración a menudo se vincula con la agricultura y la cosecha.\n\n#! Efecto apoteósico: $military_apotheosis_capital_freemen_effect_tt_description$"

 deity_sidpa_gyalmo:0 "$omen_sidpa_gyalmo$"
 omen_sidpa_gyalmo:0 "Sidpa Gyalmo"
 omen_sidpa_gyalmo_desc:0 "Sidpa Gyalmo es el principal protector de la tradición Bon tibetana; ella es la manifestación feroz de la Gran Madre Amorosa.\n\n#! Efecto Apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"

 deity_lha_mo:0 "$omen_lha_mo$"
 omen_lha_mo:0 "Lha-mo"
 omen_lha_mo_desc:0 "Lha-mo es una diosa Bon asociada con la tierra, el agua, la suerte, la riqueza y la fertilidad. A menudo se la representa como una mujer hermosa con una expresión pacífica, sosteniendo un espejo, una flor de loto o un niño. Lha-mo se considera una deidad protectora y se cree que trae fertilidad, prosperidad y buena fortuna a quienes la adoran. A veces se la considera la esposa de Tonpa Shenrab. Su adoración a menudo implica ofrendas de leche, mantequilla y cereales.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_yeshe_walmo:0 "$omen_yeshe_walmo$"
 omen_yeshe_walmo:0 "Sí, Walmo"
 omen_yeshe_walmo_desc:0 "Yeshe Walmo es considerado el aspecto de sabiduría de Sipe Gyalmo. A menudo se la representa como una hermosa mujer vestida con una túnica blanca y sosteniendo un mala o rosario de cristal. Se cree que tiene el poder de otorgar realización espiritual e iluminación a sus devotos.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"

 deity_sherab_chamma:0 "$omen_sherab_chamma$"
 omen_sherab_chamma:0 "Sherab Chamma"
 omen_sherab_chamma_desc:0 "Sherab Chamma es una deidad femenina prominente en la religión Bon, a menudo denominada \"Madre de la Sabiduría\". Está asociada con las prácticas de curación y longevidad y se dice que enseñó al pueblo Bonpo cómo realizar ciertos rituales y prácticas. También se la considera protectora y fuente de inspiración para los practicantes espirituales. Sherab Chamma es representada como una diosa radiante, a menudo mostrada con una expresión pacífica y sosteniendo un espejo, un libro o un conjunto de cuentas de oración.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_tonpa_shenrab:0 "$omen_tonpa_shenrab$"
 omen_tonpa_shenrab:0 "Tonpa Shenrab"
 omen_tonpa_shenrab_desc: "Tonpa Shenrab es considerado el fundador de la religión Bon. Según la tradición Bon, nació hace más de 18.000 años en la tierra de Tagzig Olmo Lung Ring. Se cree que enseñó las enseñanzas Bon a los humanos y ayudó a establecer la religión. Tonpa Shenrab es a menudo representado como un maestro pacífico y compasivo, que mostró a sus seguidores el camino hacia la liberación a través de las enseñanzas Bon. También se le asocia con la curación y se cree que enseñó a sus seguidores cómo utilizar plantas medicinales para curar enfermedades.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_sangpo_bumtri:0 "$omen_sangpo_bumtri$"
 omen_sangpo_bumtri:0 "Sangpo Bumtri"
 omen_sangpo_bumtri_desc:0 "Sangpo Bumtri es una deidad Bon asociada con la curación y la medicina. Se cree que tuvo cuatro hijos, cada uno de los cuales representa diferentes aspectos de su poder. A menudo se representa a Sangpo Bumtri sosteniendo un cuenco o una taza, que representa los poderes curativos que posee. También está asociado con el Sol y su nombre se traduce como \"Rey de las buenas cualidades\".\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_satrig_ersang:0 "$omen_satrig_ersang$"
 omen_satrig_ersang:0 "Satrig Ersang"
 omen_satrig_ersang_desc:0 "Satrig Ersang es considerado como una de las deidades Bon más elevadas y se le brinda gran reverencia y adoración en la tradición Bon. Sherab Chamma es otra forma de Satrig Ersang y puede considerarse como una manifestación de actividad de Satrig Ersang donde asume el papel de una deidad meditativa, una deidad de la curación como Yeshe Walmo, y en su más horrible de las apariencias, Sidpa Gyalmo, el principal protector de la Religión Bon.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
