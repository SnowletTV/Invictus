l_spanish:
  ## Default ##
 deity_viriya_parami:0 "$omen_viriya_parami$"
 omen_viriya_parami:0 "Viriya Pāramī"
 omen_viriya_parami_desc:4 "El pueblo de nuestra nación encontrará su vigor, fuerza y diligencia en la batalla. Aunque la batalla en sí misma no es aconsejable, algunas veces uno debe luchar por el bien común, y es importante que lo haga con honor y disciplina.\n\nViriya Parami es una de nuestras perfecciones budistas, con un enfoque en enseñar a las personas a ser obedientes, observantes y mostrar esfuerzo en su trabajo.\n\n#! Efecto apoteósico: $military_apotheosis_military_experience_effect_tt_description$"
 deity_adhitthana_parami:0 "$omen_adhitthana_parami$"
 omen_adhitthana_parami:0 "Adhiṭṭhāna Pāramī"
 omen_adhitthana_parami_desc:4 "Aunque es normal estar preocupado ante la adversidad, inspiramos determinación en nuestros jóvenes en estos momentos de necesidad. Es importante que la comunidad se una y una sus esfuerzos para alcanzar sus objetivos, ya sea la guerra u otros proyectos comunitarios.\n\nAdhitthana Parami es una de nuestras perfecciones budistas, con un enfoque en enseñar a las personas a ser resueltas y determinadas en sus acciones.\n\n#! Efecto apoteósico: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_panna_parami:0 "$omen_panna_parami$"
 omen_panna_parami:0 "Paññā Pāramī"
 omen_panna_parami_desc:4 "Nuestros académicos y eruditos, así como nuestro pueblo en su conjunto, encontrarán sabiduría y perspicacia en sus vidas. Con este conocimiento, estaremos mejor asesorados para tomar decisiones que beneficien y apoyen a nuestra gente.\n\nPañña Parami es una de nuestras perfecciones budistas, con un enfoque en enseñar a las personas a ser sabias y tener una visión de cosas más grandes que ellos mismos.\n\n#! Efecto apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_dana_parami:0 "$omen_dana_parami$"
 omen_dana_parami:0 "Dāna Pāramī"
 omen_dana_parami_desc:4 "Es importante que todos los sectores de nuestra sociedad contribuyan por el bien de todos. Juntos podemos crear algo más allá de nosotros mismos, si todos están dispuestos a desprenderse de parte de su riqueza. La caridad es un concepto importante para encontrar el valor interior real, al dejar de lado la riqueza material.\n\nDana Parami es una de nuestras perfecciones budistas, con un enfoque en enseñar a las personas a ser generosas y entregarse tanto física como espiritualmente.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
 deity_upekkha_parami:0 "$omen_upekkha_parami$"
 omen_upekkha_parami:0 "Upekkhā Pāramī"
 omen_upekkha_parami_desc:4 "Necesitamos estar tranquilos y serenos mientras el caos de la guerra hace estragos a nuestro alrededor, y encontrar el camino correcto que nuestro pueblo debe seguir. Incluso durante las dificultades de la guerra y la fatiga, es importante que la sociedad logre llegar a un acuerdo sobre los caminos que tomarán como colectivo, ya sea continuar la guerra o no.\n\nUpekkha Parami es una de nuestras perfecciones budistas, con un enfoque en enseñar a las personas a estar serenas y purificar sus estados mentales.\n\n#! Efecto apoteósico: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_khanti_parami:0 "$omen_khanti_parami$"
 omen_khanti_parami:0 "Khanti Pāramī"
 omen_khanti_parami_desc:4 "Nuestro pueblo necesita soportar las dificultades y tener paciencia con quienes vienen de lejos. Sólo entonces podremos llegar a conocer sus secretos y aceptar su diferencia, en lugar de enfrentarlos con afrentas o juicios. Al llegar a entenderlos, podemos encontrar valor en su compañía y traer riqueza a todos nosotros.\n\nKhanti Parami es una de nuestras perfecciones budistas, con un enfoque en enseñar a las personas a ser pacientes, tolerantes y aceptar a los demás.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_sila_parami:0 "$omen_sila_parami$"
 omen_sila_parami:0 "Sīla Pāramī"
 omen_sila_parami_desc:4 "Inspiraremos en nuestro pueblo el camino correcto a seguir, con la virtud y la conducta adecuada en el modo de hacer las cosas. Al actuar con virtud, nuestra gente podrá unirse en colectivos más grandes que puedan cooperar y trabajar juntos.\n\nSila Parami es una de nuestras perfecciones budistas, con un enfoque en enseñar a las personas a ser virtuosas, armoniosas y actuar con autocontrol.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_metta_parami:0 "$omen_metta_parami$"
 omen_metta_parami:0 "Mettā Pāramī"
 omen_metta_parami_desc:4 "Es un objetivo para nuestra nación ser conocida por su actitud solidaria y amable. Es una forma de que nuestra gente y nuestra cultura crezcan y se expandan más allá de nuestras limitaciones actuales.\n\nMetta Parami es una de nuestras perfecciones budistas, con un enfoque en enseñar a las personas a ser amables y amigables entre sí.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_trapusa_and_bahalika:0 "$omen_trapusa_and_bahalika$"
 omen_trapusa_and_bahalika:0 "Tarpusa y Bahlika"
 omen_trapusa_and_bahalika_desc:2 "Los primeros discípulos laicos de Buda, los comerciantes Trapusa y Bahalika, llevaron sus enseñanzas al Hindu Kush y al oeste, donde construyeron la primera estupa en Baktra.\nRepresentan la sabiduría universal de sus enseñanzas en todo el mundo y la facilidad vindicadora con la que se difundieron.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"
 deity_sigiriya:0 "$omen_sigiriya$"
 omen_sigiriya:0 "El ascetismo de Buda"
 omen_sigiriya_desc:2 "Si bien Buda evitó el ascetismo extremo porque lo debilita a uno hasta el punto de perder de vista el mundo, la paz y la tranquilidad son necesarias para contemplar sus enseñanzas.\nLa gran roca de Sigiraya ha albergado a monjes budistas que buscan el nirvana en sus cuevas durante muchos años. Buddhatapas significa 'Ascetismo de Buda'.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"
 deity_bamyan:0 "$omen_bamyan$"
 omen_bamyan:0 "Andanzas de Buda"
 omen_bamyan_desc:2 "El Buda fue generoso en sus enseñanzas y viajó por todo el país para difundir su sabiduría divina entre la gente.\nLas estupas de los monasterios alejados del lugar de nacimiento de Buda son un testimonio de la tradición de difundir sus enseñanzas. Buddhacharita significa 'Los vagabundeos de Buda'.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_bodh:0 "$omen_bodh$"
 omen_bodh:0 "Iluminación de Buda"
 omen_bodh_desc:2 "Las sabias enseñanzas de Buda guiarán a nuestra gente a vivir una vida ética y placentera, libre de las distracciones y doctrinas erróneas de otras religiones.\nLa ciudad de Gaya es conocida como el lugar donde Gautama Buda alcanzó la iluminación bajo el árbol Bodhi en el Buda Purnima después de renunciar tanto al lujo como al ascetismo, desarrollando el camino intermedio. Buddhatvam significa la Iluminación de Buda.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_kusinagara:0 "$omen_kusinagara$"
 omen_kusinagara:0 "Parnirvana de Buddha"
 omen_kusinagara_desc:2 "Sólo siguiendo la sabia y santa forma de vida de Gautama Buda se puede alcanzar el Parinirvana y liberarse del castigo del eterno ciclo de la reencarnación.\nBuda alcanzó este estado a su muerte en la ciudad de Kusinagara, que se ha convertido en lugar de peregrinación para todos los que comprueban la verdad de sus enseñanzas."

# Deity loc TODO

 deity_mitreya:0 "$omen_mitreya$"
 omen_mitreya:0 "Mitreya"
 omen_mitreya_desc:0 "En los días oscuros, cuando los hombres olviden las enseñanzas de Gautama Buda, es entonces cuando Mitreya, el Buda Final de esta era y Aquel que está Prometido, aparecerá para restaurar el Dharma. Aunque ahora no está aquí con nosotros, se puede suplicar a Mitreya a través de la oración.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_manjushri:0 "$omen_manjushri$"
 omen_manjushri:0 "Manjushri"
 omen_manjushri_desc:0 "Manjushri, aclamado como Gloria Gentil, un antiguo Bodhisattva que paradójicamente mantiene aspectos de la juventud, reside en la Tierra Pura de Vimala, meditando sobre la sabiduría y todas las cosas buenas.\n\n#! Efecto Apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_avalokitesvara:0 "$omen_avalokitesvara$"
 omen_avalokitesvara:0 "Avalokitesvara"
 omen_avalokitesvara_desc:0 "Avalokitesvara, Bodhisattva y poderoso Señor que contempla el mundo, no es sordo a los gritos de los que sufren, pero está lleno de compasión y amor por los oprimidos, una característica por la que es amado por las masas.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"
 deity_samantabhadra:0 "$omen_samantabhadra$"
 omen_samantabhadra:0 "Samantabhadra"
 omen_samantabhadra_desc:0 "Samantabhadra, el Universalmente Digno y Todo Bien, Portavoz de los Diez Votos y ejemplo para todos los que buscan alcanzar la Budeidad por sí mismos, guía a nuestro pueblo con sus rectas enseñanzas tanto en tiempos de paz como de guerra.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_samantabhadri:0 "$omen_samantabhadri$"
 omen_samantabhadri:0 "Samantabhadri"
 omen_samantabhadri_desc:0 "Samantabhadri, la Gran Madre Buda Primordial, que es la Consorte Eterna y Compañera de Samantabhadra, es una diosa poderosa y sabia cuya presencia divina se representa mejor por la tranquilidad de una mente tranquila.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_sakra:0 "$omen_sakra$"
 omen_sakra:0 "Sakra"
 omen_sakra_desc:0 "A Sakra el Poderoso, Señor de los Devas y Poderoso Gobernante del Cielo Trayastrimsa, se le ha confiado la protección del centro del mundo desde su morada celestial en el Monte Meru de cinco picos, luchando por la paz y, sin embargo, siempre preparado para la guerra.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_mahesvara:0 "$omen_mahesvara$"
 omen_mahesvara:0 "Mahesvara"
 omen_mahesvara_desc:0 "Mahesvara, el Gran Señor, de ocho brazos y tres ojos y al que se le ha confiado una sabiduría que está más allá de la comprensión mortal, es el eterno amigo de aquellos que hacen el bien y un enemigo implacable de aquellos que propagan la miseria y la disensión.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_vajrapani:0 "$omen_vajrapani$"
 omen_vajrapani:0 "Vajrapani"
 omen_vajrapani_desc:0 "Los relámpagos y el aullido del viento anuncian la llegada de Vajrapani, Señor de los Secretos y Poseedor del Rayo, que apenas es capaz de contener su ira que todo lo consume. Su bendición es un arma temible para ser usada contra los enemigos de la justicia.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_marici:0 "$omen_marici$"
 omen_marici:0 "Marici"
 omen_marici_desc:0 "Es en los momentos previos al amanecer, cuando la oscuridad se aferra inútilmente a la Tierra antes de ser destruida por Marici, la Diosa de la Luz, que sus adoradores se reúnen para saludar al Sol con oraciones de acción de gracias.\n\n#! Efecto Apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$\n $deadly_apotheosis_effect_tt_description$"

# Invictus
 deity_buddha_mazda:0 "$omen_buddha_mazda$"
 omen_buddha_mazda:0 "Buda-Mazda"
 omen_buddha_mazda_desc:0 "Buda-Mazda, que se encontró por primera vez pintado en la pared de una cueva que data del siglo I d.C. En la actual Uzbekistán, sirve como prueba de una interacción budista de larga data con la esfera Persianate. Se descubrió que el sitio era probablemente el sitio de Alejandría en el Oxus, y la pintura muestra una deidad con rasgos tanto de Ahura Mazda como de Buda.\n\nEl budismo en Persia probablemente existió incluso antes del siglo I, durante la época parta, donde es posible que muchos de los miembros de la baja nobleza en las partes orientales del imperio se hayan convertido al budismo; sin embargo, se registra mejor durante la época sasánida posterior, cuando el imperio tradicionalista Mazdayasnan derribó las prácticas budistas en Irán.\n\n#! Efecto apoteósico: $military_apotheosis_military_experience_effect_tt_description$"
 
 deity_mithra_mitreya:0 "$omen_mithra_mitreya$"
 omen_mithra_mitreya:0 "Mitra-Mitreya"
 omen_mithra_mitreya_desc:0 "En las tierras donde sale el sol, tanto en la meseta iraní como en las llanuras indias, surgió la visión de un futuro salvador. Para algunos, era Mitra, Señor de la Alianza y Guardián de la Verdad, que observa con mil ojos y castiga a quienes incumplen juramentos sagrados. Para otros, él era Mitreya, el Prometido, que regresará cuando las enseñanzas del Iluminado se hayan desvanecido, para restaurar el Dharma y despertar la compasión en una era oscura. \n\nMithra-Mitreya es un símbolo de esta unión, un ser de pureza solar, justicia divina y esperanza mesiánica, nacido de las interacciones culturales dentro del imperio budista-parto. En tiempos de desesperación, su llama dual nos recuerda que debemos caminar por el camino intermedio con disciplina, pero hacerlo con valentía, como guardianes tanto de la virtud interior como de la responsabilidad mundana.\n\n#! Efecto apoteósico: $culture_apotheosis_characters_effect_tt_description$\n $add_legitimacy_apotheosis_effect_tt_description$"

# Helleno-Buddhism 
 deity_dhammarakkhita:0 "$omen_dhammarakkhita$"
 omen_dhammarakkhita:0 "Yonaka Dhammarakkhita"
 omen_dhammarakkhita_desc:0 "Yonaka Dhammarakkhita en pali y Yonaka Dharmaraksita en sánscrito, su nombre se traduce directamente como \"El griego protegido por el Dharma\". Era un griego, probablemente de Bactria o del valle del Indo, y fue empleado por Ashoka el Grande para predicar el budismo como misionero en la región de Aparanta (y probablemente incluía la costa de Sindh a Gujarat). Se dice que logró convertir a 37.000 personas en la región, 1.000 de las cuales se unieron a la Orden (Pabbajja).\n\nMás tarde, el monje budista cingalés, Punabbasukutumbikaputta Tissa Thera, se trasladaría a las tierras maurya del norte para estudiar con el Yonaka Dhammarakkhita. Otra historia describe al monje Nagasena como estudiante de Dhammarakkhita y alcanzando la iluminación en Pataliputra bajo su guía.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_herakles_vajpranios:0 "$omen_herakles_vajpranios$"
 omen_herakles_vajpranios:0 "Heracles Vajpranios"
 omen_herakles_vajpranios_desc:0 "Herakles Vajpranios es una forma de Herakles sincretizada con la idea budista de Vajprani. Vajprani significa literalmente \"el poseedor del rayo\" y generalmente representa un protector y guía de Gautama Buda, así como un símbolo del poder de Buda. Herakles Vajpranios se representa comúnmente con un garrote Heraclean o un rayo (o un vajra), y a veces también se lo ve con cualidades más parecidas a las de Zeus (de hecho, la deidad tomó cualidades de Zeus y de Heracles). Además, las representaciones lo muestran peludo y musculoso, una visión que influenciaría a las deidades budistas en todo el mundo del este asiático, con la idea de que un 'luchador-guardián' se hiciera popular.\n\n#! Efecto apoteósico: $military_apotheosis_military_experience_effect_tt_description$"

 deity_wardo:0 "$omen_wardo$"
 omen_wardo:0 "Wardo"
 omen_wardo_desc:0 "Wardo, también escrito como Oardo, es mejor conocido por los griegos occidentales como Bóreas, el dios de los fríos vientos y tormentas del norte. Muy inspirado por las deidades bactrianas y helénicas, Wardo se convertiría en una característica recurrente en todo el mundo budista posterior, influyendo tanto en la religión china como en la japonesa (Feng Po en chino, que significa tío viento, y Fujin en japonés, que significa viento celestial). A lo largo de las diferentes formas del dios, mantuvo su característica charlatana y su apariencia desordenada y desaliñada, mostrando una evolución muy clara desde el grecobudismo hasta el budismo del este de Asia.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_wardo_10_bactrian_pops_required_tt: "La cultura #Y [GetCulture('bactrian').GetName]#! necesita al menos #Y 10#! pops."

 deity_hegesias:0 "$omen_hegesias$"
 omen_hegesias:0 "Hegesias Peisitánatos"
 omen_hegesias_desc:0 "El filósofo cirenaico Hegesias fue un defensor de la idea de que la Eudaimonia (felicidad) era casi imposible de lograr y, por lo tanto, el objetivo de la vida debería ser liberarse del dolor y la tristeza. Los valores convencionales eran todos indiferentes y no producían más placer que dolor. Lo más interesante es que también dijo que tanto la muerte como la vida eran deseables. Estas ideas, así como su época, llevan a muchos a creer que fue influenciado por las filosofías indias. Una idea familiar aparece en su infame libro, 'Muerte por inanición', que aparentemente había convencido a tanta gente en Alejandría de que la Muerte es más deseable que la Vida, que Ptolomeo II Filadelfo le prohibiría enseñar en la gran ciudad."
