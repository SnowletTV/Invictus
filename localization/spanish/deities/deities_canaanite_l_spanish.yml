l_spanish:
 ### Nation specific ###
 ## Carthage ##
 deity_baal_qarnaim:0 "$omen_baal_qarnaim$"
 omen_baal_qarnaim:1 "Baal Qarnaim"
 omen_baal_qarnaim_desc:3 "Haremos grandes ofrendas al Señor de los Dos Cuernos, asegurando su bendición y aceptación de nuestras recientes guerras. Con su guía, fácilmente podremos justificar nuestra expansión a tierras enemigas, ante nuestro pueblo que se cansa de las batallas y los conflictos.\n\nComo otra cara del gran Ba'l, adoramos a Ba'l Qarnem en tiempos de necesidad y guerra, y él inspira a nuestro pueblo.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 ## Arabian (south_levantine) ##
 deity_attar:0 "$omen_attar$"
 omen_attar:1 "Attar"
 omen_attar_desc:3 "Aquel que es Valiente en la Batalla ayudará y protegerá a nuestros hermanos de armas, asegurando su disciplina y moral. Con nuestros soldados luchando para demostrar su valía, es mucho más probable que la victoria sea nuestra.\n\n#! Efecto apoteósico: $military_apotheosis_defensive_effect_tt_description$"

 ## Carthaginian ##
 deity_tanit:0 "$omen_tanit$"
 omen_tanit:1 "Tanit"
 omen_tanit_desc:3 "Nuestra señora diosa nos cuidará en la batalla, asegurando nuestra victoria mientras conquistamos a nuestros enemigos. Hay pocas deidades que inspiran a nuestros soldados como Tannit, y se demostrará una vez más el impacto que tiene en nuestras guerras.\n\nA diferencia del Panteón fenicio en su conjunto, Tannit es más bien una diosa cartaginesa local. Ella juega un papel importante en nuestros ritos como diosa lunar y diosa de la guerra. Tannit es tan favorable que incluso algunos libios y mauritanos han comenzado a adorarla, siguiendo nuestro ejemplo.\n\n#! Efecto apoteósico: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_baal_hammon:0 "$omen_baal_hammon$"
 omen_baal_hammon:1 "Baal Hammon"
 omen_baal_hammon_desc:3 "Los jóvenes de nuestra nación acudirán en masa a nuestros estandartes sabiendo que Ba'l Hammon ha bendecido nuestras guerras. Con más reclutas en nuestras manos, seguramente podremos obligar a nuestros enemigos a aceptar nuestras demandas con nuestra mano de obra superior.\n\nA diferencia del culto más genérico a Ba'l en otras áreas fenicias, contamos con el favor del propio Ba'l Hammon, el principal miembro del panteón en tierras cartaginesas. Como dios de la cosecha, en ocasiones se le compara con el Kronos griego, aunque desempeña un papel activo más importante que su versión griega.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"

 ## Generic ##
 deity_anat:0 "$omen_anat$"
 omen_anat:1 "Anat"
 omen_anat_desc:3 "La diosa guerrera salvaje luchará junto a nuestros hombres, guiando sus manos en la batalla y fortaleciendo su moral. 'Anat es conocida por la brutal matanza de sus enemigos; es más probable que ganemos nuestras guerras con ella a nuestro lado.\n\nComo diosa de la guerra, 'Anat era bien conocida entre muchas culturas cananeas a lo largo del Levante. Ella jugó un papel importante en vengar a su hermano y amante Ba'l después de su supuesta muerte a manos de Mot.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_el:0 "$omen_el$"
 omen_el:1 "El"
 omen_el_desc:3 "Todos los jóvenes acudirán a nuestros estandartes bajo la guía del dios supremo. Estamos seguros de que podremos ganar nuestras guerras ahora que tenemos un mayor número de reclutas potenciales que antes.\n\nA la cabeza del panteón, 'El es el primero entre iguales en lo que a la mayoría respecta. Es el rey y padre de la mayoría de las deidades, y es el creador de la tierra.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_kothar:0 "$omen_kothar$"
 omen_kothar:1 "Jotar"
 omen_kothar_desc:3 "El gran conocimiento de Kushor-wa-Hasis brillará sobre nuestros artesanos, bendiciéndolos con perspicacia. A medida que avancemos bajo su guía, seguramente podremos competir con nuestros vecinos y superar las capacidades de nuestros enemigos.\n\nKushor es bien conocido como el patrón de la metalurgia y la magia, y ha fabricado muchas armas y regalos notables para las otras deidades con sus habilidades únicas. Las historias dicen que incluso los egipcios conocieron al dios y lo llamaron Ptah en su propio idioma.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_yam:0 "$omen_yam$"
 omen_yam:1 "Yam"
 omen_yam_desc:3 "Yam es uno de los dioses del mar, en su forma más salvaje. Desde su palacio en las oscuras profundidades del océano, controla las furiosas olas y los tumultuosos vientos con los que nuestros barcos tienen que lidiar mientras navegan a través de los mares.\n\nAunque es uno de los campeones elegidos por 'El, es un peligro para aquellos que se atreven a ofenderlo, y muchos marineros han sentido su ira cuando son aplastados contra los arrecifes o sus barcos destrozados sin piedad por el ondas.\n\n #! Efecto de apoteosis: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_melqart:0 "$omen_melqart$"
 omen_melqart:1 "Melkart"
 omen_melqart_desc:3 "El gran Señor errante Melqart traerá riqueza a todo nuestro reino. Con mayores riquezas viene una mayor prosperidad para nuestro pueblo; garantizando nuestra seguridad por el momento.\n\nAunque el dios era originalmente el dios patrón de la ciudad fenicia de Tiro, se ha hecho muy conocido en todo el mundo fenicio, así como entre todos sus socios comerciales y relaciones.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_baal:0 "$omen_baal$"
 omen_baal:1 "Baal"
 omen_baal_desc:3 "El gran Ba'l justificará nuestra expansión hacia tierras enemigas y asegurará el éxito continuo de tales campañas. Hay algunos que se han cansado de la guerra, esta bendición los convencerá de la necesidad de continuar la guerra.\n\nComo patrón de las cosechas, las tormentas, el clima y los marineros, el Gran Ba'l es la más adorada de nuestras deidades. En tiempos de lucha y necesidad, Ba'l es la deidad que trae salvación y ayuda.\n\n#! Efecto Apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_dagon:0 "$omen_dagon$"
 omen_dagon:1 "Dagón"
 omen_dagon_desc:3 "Dagon proporcionará a nuestros comerciantes grandes cantidades de recursos para comerciar. Con su ayuda, nuestros comerciantes ven una mayor abundancia y seguramente podrán expandir sus operaciones y continuar su búsqueda de riqueza durante mucho tiempo.\n\nConocido por los griegos como Zeus Arotrios, Dagón es el padre de Ba'l y un dios de la economía por derecho propio.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_shapash:0 "$omen_shapash$"
 omen_shapash:1 "Shapash"
 omen_shapash_desc:3 "La justicia de Shamsh brillará sobre nuestra nación como el sol, bendiciendo a nuestro pueblo con paz e integridad. Bajo su escrutinio, sólo las personas más rebeldes continuarán su lucha contra nuestra sociedad, y finalmente pondremos fin a cualquier amenaza interna.\n\nComo una de las hijas de El, es conocida como una diosa del sol y juez entre los dioses. Su justicia decide el destino de otros dioses y puede obstaculizar sus acciones si es necesario.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_astarte:0 "$omen_astarte$"
 omen_astarte:1 "Astarté"
 omen_astarte_desc:3 "Nuestro pueblo crecerá y se expandirá bajo la mirada amorosa de la diosa. Con su bendición sobre nuestra gente, nuestros jóvenes seguramente crecerán sanos y nuestras cosechas serán abundantes durante muchos años.\n\n'Ashtart es conocida como una diosa de la fertilidad en todas las tierras fenicias, ocasionalmente celebrada junto con el dios sanador 'Eshmun. Los griegos a menudo la comparan con su Afrodita.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"
 deity_eshmun:0 "$omen_eshmun$"
 omen_eshmun:0 "Eshmún"
 omen_eshmun_desc:1 "La sabiduría y benevolencia de 'Eshmun traerán salud y felicidad a nuestro pueblo. Con su vasto conocimiento de los regalos salvajes y variados de la naturaleza, el dios protegerá a nuestro pueblo de los estragos de la enfermedad y el tiempo.\n\nAdorado desde Fenicia hasta Cartago y llamado por los griegos Asklepios, 'Eshmun es un dios famoso y muy apreciado en todo el mundo cananeo.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_atargatis:0 "$omen_atargatis$"
 omen_atargatis:0 "Atargatis"
 omen_atargatis_desc:2 "Conocida como Atargatis en griego, la tres veces bendita portadora de la abundancia y protectora de los necesitados se encargará de que las necesidades de nuestro pueblo permanezcan saciadas.\n\n'Atar'ata es una combinación de las tres grandes diosas cananeas: 'Asherat, 'Anat y 'Ashtart', cuyo culto siguió siendo popular durante siglos después de la helenización de Siria, particularmente en Bambyke.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_baalat:0 "$omen_baalat$"
 omen_baalat:0 "Baalat"
 omen_baalat_desc:0 "Ba'lat es una deidad proveniente de la ciudad-estado de Biblos en Fenicia, y ha tenido un santuario impresionante en la ciudad desde tiempos inmemoriales. \n\n La deidad a menudo se asocia con la tierra y otras diosas de la fertilidad como Ashtart e Ishtar, mientras que los egipcios la conocen como Hathor y los griegos se refieren a ella como Baaltis.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"

 # Heirs of Alexander #
 deity_gad:0 "$omen_gad$"
 omen_gad:0 "Gad"
 omen_gad_desc:0 "Gad es un dios antiguo, u ocasionalmente una diosa, de la fortuna y el azar. A diferencia de muchas de las otras deidades de Fenicia y Palestina, Gad es universalmente invocado y honrado en toda la zona oriental del Mediterráneo. Ocasionalmente también se invocan otras deidades con el nombre de Gad, más como un título que como una deidad específica en sí misma.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_hadad:0 "$omen_hadad$"
 omen_hadad:0 "Hadad"
 omen_hadad_desc:0 "Hadad es una deidad de la tormenta originaria del norte de Siria y la baja Armenia, donde a menudo era adorado al unísono con la deidad sincrética 'Atar'ata. A pesar de sus orígenes, uno de sus mayores templos se levantó en Askalon, ciudad donde se le consideraba la deidad más importante de todas.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
