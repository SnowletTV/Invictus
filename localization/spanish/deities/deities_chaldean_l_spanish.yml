l_spanish:
 ## Default ##
 deity_ashshur:0 "$omen_ashshur$"
 omen_ashshur:1 "Ashshur"
 omen_ashshur_desc:3 "Ashur, también conocido como Ashshur, era la deidad principal del panteón asirio. Era un dios del cielo asociado con la adivinación, y se creía que tenía el poder de traer tanto buena como mala fortuna. Ashshur también era considerado el dios de la guerra, y su símbolo era un disco alado, que representaba su poder para volar por los cielos y proteger a su pueblo de cualquier daño. La ciudad de Ashur, situada a orillas del río Tigris, era el centro de culto a este dios, y era considerada una de las ciudades más sagradas del antiguo Cercano Oriente. Los asirios creían que Ashshur era la fuente de su poder y éxito, y le dedicaron muchos templos y estatuas en todo su imperio. \n\nLos reyes asirios reclamaban legitimidad divina a través de su relación con Ashshur, y sus campañas militares a menudo se llevaban a cabo en su nombre. El ejército asirio marchaba bajo su estandarte, que representaba un disco solar alado con una estrella de cuatro puntas y flechas apuntando en las cuatro direcciones. Ashshur a menudo era representado como un hombre barbudo que llevaba un tocado con cuernos y sostenía un arco y una flecha, simbolizando su papel como dios guerrero.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_ninurta:0 "$omen_ninurta$"
 omen_ninurta:1 "Ninurta"
 omen_ninurta_desc:3 "Ninurta era una deidad mesopotámica asociada con la guerra, la caza, la agricultura y el clima. Se creía que era un guerrero feroz, montado en el lomo de un águila o dragón gigante y empuñando una poderosa maza llamada Sharur. Ninurta también era venerada como patrona de cazadores y guerreros, y a menudo era invocada en tiempos de guerra. En períodos posteriores, a veces fue sincretizado con el dios Nergal. Ninurta era a menudo representada como un héroe y campeón de los dioses, luchando contra varios monstruos y enemigos del orden divino. Su culto fue particularmente prominente en la ciudad de Nippur, donde fue adorado como una deidad importante junto con Enlil y otros dioses importantes.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_ishtar:0 "$omen_ishtar$"
 omen_ishtar:1 "Ishtar"
 omen_ishtar_desc:3 "Ishtar, también conocida como Inanna, era una diosa importante en el panteón mesopotámico. Se la asociaba con el amor, la fertilidad, la guerra y el sexo, y se creía que tenía el poder de otorgar bendiciones y maldiciones a la humanidad. Ishtar también era una diosa del planeta Venus y estaba asociada con la estrella de la mañana y la tarde. Se creía que había tenido muchos amantes y su sexualidad era vista como un símbolo de su poder y fertilidad. Ishtar era una de las deidades más prominentes y veneradas del panteón mesopotámico.\n\nIshtar era a menudo representada como una diosa hermosa, poderosa y, a veces, incluso peligrosa. A veces se la llamaba la \"Reina del Cielo\". Como diosa de la fertilidad, se creía que tenía el poder de conceder hijos y proteger a las mujeres durante el parto. Como diosa del amor, fue invocada tanto por hombres como por mujeres que buscaban relaciones románticas o curarse de un desamor. Y como diosa de la guerra, se la asociaba con la victoria y la protección de las ciudades y su gente.\n\nIshtar también era conocida por sus relaciones dramáticas y a veces violentas con otros dioses, incluidos su amante Dumuzid y su hermana Ereshkigal, la diosa del inframundo. Sus historias se utilizaban a menudo para explicar fenómenos naturales o costumbres sociales, y sus centros de culto eran algunos de los más importantes y concurridos de Mesopotamia. En general, Ishtar jugó un papel central en las prácticas religiosas y culturales de la antigua Mesopotamia.\n\n#! Efecto apoteósico: $military_apotheosis_manpower_effect_tt_description$"
 deity_ea:0 "$omen_ea$"
 omen_ea:1 "Ea"
 omen_ea_desc:4 "Ea, también conocida como Enki, era una deidad importante en el panteón mesopotámico, particularmente en las tradiciones sumeria y babilónica. Se le consideraba el dios de la sabiduría, la magia y el agua dulce, y también se le asociaba con la creación, la fertilidad y las artes. Ea era hijo de Anu, el dios del cielo, y Nammu, la diosa primordial del mar. A menudo se representaba a Ea sosteniendo un jarrón o un balde rebosante de agua, simbolizando su asociación con el agua dulce. También se le mostraba a menudo con barba y un gorro con cuernos, similar a otras deidades mesopotámicas.\n\nEn la mitología sumeria, Ea jugó un papel destacado en la creación de la humanidad, modelando a los primeros humanos a partir de arcilla con la ayuda de su hijo, Marduk. También se le asoció con la ciudad de Eridu, que se creía que era la primera ciudad del mundo.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_nabu:0 "$omen_nabu$"
 omen_nabu:1 "Nabu"
 omen_nabu_desc:3 "Nabu (también escrito Nebo) era un dios babilónico de la sabiduría, la alfabetización y la escritura, que fue especialmente popular durante el primer milenio a.C. Se le consideraba hijo de Marduk, la deidad patrona de Babilonia, y su consorte Sarpanitum. A menudo se representaba a Nabu como un hombre barbudo que llevaba un gorro con cuernos y sostenía un lápiz en la mano derecha y una tablilla de arcilla en la izquierda. Como dios de la escritura y la alfabetización, Nabu se asoció con el desarrollo de la escritura cuneiforme, la forma de escritura más antigua conocida en Mesopotamia. También estuvo asociado con actividades académicas, incluidas las artes, las ciencias y las matemáticas. Como dios de la sabiduría, se creía que tenía el poder de otorgar inteligencia y perspicacia a sus devotos. Durante el período neobabilónico, también fue adorado como deidad patrona de los reyes asirios.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_enlil:0 "$omen_enlil$"
 omen_enlil:1 "Enlil"
 omen_enlil_desc:3 "Enlil era conocido como el dios del aire, el viento y las tormentas y estaba asociado con el elemento tierra. Enlil era visto como una deidad suprema y a menudo se le llamaba el \"rey de los dioses\". Se creía que Enlil había creado el mundo, junto con su consorte Ninlil, y era responsable de poner orden en el cosmos. También se le asociaba con la agricultura y la fertilidad, y a menudo se le representaba sosteniendo una herramienta agrícola en la mano. El templo de Enlil en Nippur era uno de los sitios religiosos más importantes de la región y se creía que se estableció a principios del tercer milenio a.C. A menudo se representaba a Enlil con un tocado con cuernos, que simbolizaba su asociación con el mundo natural. A veces también se le mostraba sosteniendo una tablilla, que representaba su papel como dios de la escritura y la sabiduría.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_shamash:0 "$omen_shamash$"
 omen_shamash:1 "Shamash"
 omen_shamash_desc:3 "Shamash, también conocido como Utu, era el dios mesopotámico del sol, la justicia, la adivinación y el patrón de la verdad. Era una de las deidades más importantes del panteón mesopotámico y fue adorado en toda la antigua Mesopotamia desde el año 3000 a. C. Shamash también se asociaba con la adivinación y se creía que tenía el poder de revelar la verdad a quienes la buscaban. Como tal, a menudo se le invocaba durante los procedimientos judiciales para garantizar un resultado justo. Además, a veces era adorado como patrón de la medicina, ya que se creía que el sol tenía propiedades curativas.\n\nShamash a menudo era representado como un hombre barbudo que sostenía un cuchillo con dientes de sierra y una piña, y de pie sobre un trono escalonado o en la cima de una montaña. Estaba asociado con el sol y se creía que viajaba por el cielo todos los días, trayendo luz y calor al mundo. También era visto como un dios de la justicia, que castigaría a los malvados y recompensaría a los virtuosos. Como tal, a menudo se le representaba sosteniendo una balanza, que simbolizaba el peso de los hechos de una persona en la vida.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_marduk:0 "$omen_marduk$"
 omen_marduk:1 "Marduk"
 omen_marduk_desc:3 "Marduk era el dios patrón de Babilonia y, por tanto, desempeñó un papel destacado en la mitología caldea, especialmente durante la época del dominio babilónico. Según la mitología babilónica, Marduk fue el responsable de crear el mundo y derrotar a las fuerzas del caos en una gran batalla. Se le consideraba el dios más poderoso del panteón y a menudo se lo representaba como un guerrero o rey, sosteniendo un cetro y un rayo. \n\nEl culto a Marduk se volvió particularmente prominente durante el reinado de Hammurabi, quien promovió al dios como un símbolo de su propio poder y legitimidad. El templo de Marduk en Babilonia, el Esagila, fue el centro religioso más importante de Mesopotamia y uno de los edificios más grandes e impresionantes del mundo antiguo. En el período neobabilónico, Marduk era adorado como el dios supremo en todo el imperio, y su nombre se convirtió en sinónimo del estado babilónico y sus gobernantes.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_sin:0 "$omen_sin$"
 omen_sin:1 "Sin"
 omen_sin_desc:3 "Sin, también conocido como Nanna, era el dios de la luna. Se consideraba que Sin era una de las deidades más poderosas del panteón mesopotámico y se pensaba que controlaba los ciclos de la luna. En ocasiones, se le consideraba igual a Shamash y Enlil. Su culto jugó un papel importante en el desarrollo de la astronomía y la astrología en la antigua Mesopotamia. Sin suele representarse como un anciano con una larga barba y un tocado con forma de luna creciente. A menudo se le asociaba con la sabiduría, la fertilidad y las mareas del mar.\n\nUno de los más famosos es el mito del dios de la luna y la diosa del sol (estrella), que habla de los intentos de Sin de cortejar a Ishtar y la eventual reconciliación entre las dos deidades.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_nintur:0 "$omen_nintur$"
 omen_nintur:0 "Nintur"
 omen_nintur_desc:0 "Nintur, también conocida como Ninhursag, era una diosa prominente en la mitología sumeria y acadia. Ella era la diosa madre y una diosa de la fertilidad asociada con la tierra y la crianza de la vida. Su nombre significa \"Dama de las Montañas\", lo que refleja su conexión con el mundo natural. A menudo se la representaba como una figura maternal, amamantando y cuidando a sus hijos. Nintur también estaba asociada con la diosa Ki, que era la personificación de la tierra. Como diosa de la agricultura, Nintur era venerada por los agricultores y sus centros de culto a menudo estaban ubicados en zonas rurales. También se la asociaba con la curación y las mujeres a menudo la invocaban durante el parto.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_dumuzid:0 "$omen_dumuzid$"
 omen_dumuzid:0 "Dumuzid"
 omen_dumuzid_desc:0 "Dumuzid, también conocido como Tammuz, era un dios pastor de la fertilidad y la vegetación. Era comúnmente adorado en toda la antigua Mesopotamia, incluso en las culturas sumeria, acadia y babilónica. Se creía que Dumuzid era el consorte de Ishtar y sus cuentos mitológicos a menudo giraban en torno a su tumultuosa relación. Además de su asociación con la fertilidad y la agricultura, Dumuzid también estaba conectado con el inframundo y el más allá, ya que su muerte y resurrección anuales representaban el ciclo de la vida y la muerte en la naturaleza. A menudo se le representaba como un joven pastor, y sus imágenes y simbolismo se incorporaban comúnmente a los rituales y ceremonias religiosas mesopotámicas.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_bau:0 "$omen_bau$"
 omen_bau:0 "Bau"
 omen_bau_desc:0 "Bau era una diosa de la fertilidad, la curación y los perros. A menudo se la representa con un perro a su lado, simbolizando su estrecha relación con estos leales animales. Bau era a menudo representada como una mujer con cabeza de perro o como un perro mismo. Se la asociaba con la curación tanto de humanos como de animales, y también se creía que tenía el poder de generar fertilidad y abundancia. Como diosa de los perros, a veces se la invocaba como protectora de los perros y otros animales domesticados.\n\nAdemás de su papel como diosa de la curación y la fertilidad, Bau también se asociaba con el inframundo y los muertos. Se creía que tenía el poder de otorgar acceso al reino de los muertos y, a veces, se la invocaba en rituales funerarios.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_nanaya:0 "$omen_nanaya$"
 omen_nanaya:0 "Nanaya"
 omen_nanaya_desc:0 "Nanaya, también conocida como Nania o Nanyai, era una diosa de la fertilidad y la guerra en el panteón mesopotámico. Era particularmente venerada en la ciudad de Uruk, donde se la consideraba hija de la diosa patrona Inanna (Ishtar). Nanaya estaba asociada con el amor y la procreación, y se creía que protegía a las mujeres durante el parto. Además, también se la asociaba con la guerra y se creía que ayudaba a los soldados en la batalla. \n\nNanaya era típicamente representada como una hermosa joven que llevaba un tocado con cuernos y sostenía un arco y flechas, un símbolo de su conexión con la guerra. A veces también se la representaba de pie sobre un león, otro símbolo de su fuerza y ​​poder. Nanaya era una diosa popular en la antigua Mesopotamia y su adoración continuó durante el período helenístico.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_ereshkigal:0 "$omen_ereshkigal$"
 omen_ereshkigal:0 "Ereshkigal"
 omen_ereshkigal_desc:0 "Ereshkigal era uno de los dioses más poderosos del panteón mesopotámico. Ella era la reina del inframundo y la gran dama de la tierra de los muertos. Se pensaba que había gobernado el reino de los muertos con una autoridad absoluta que duró incluso cuando los gobernantes babilónicos y asirios preferían las deidades masculinas.\n\nUn buen ejemplo de la naturaleza poderosa de Ereshkigal es el mito del descenso de Ishtar al inframundo. Ishtar decide visitar a su hermana Ereshkigal en su reino del inframundo para ir al funeral del marido de Ershkigal. Ershkigal, enfurecida porque la muerte de su marido fue en parte culpa de Ishtar, decide castigar a Ishtar. Ereshkigal hace que Ishtar pase a través de siete puertas donde debe quitarse una prenda de vestir en cada puerta hasta que esté completamente desnuda. Ereshkigal luego juzga y avergüenza a Ishtar, y ordena a sus sirvientes que maten a Ishtar, colgando su cadáver en un gancho como advertencia a otros dioses. Si bien Ishtar fue resucitada y rescatada, todavía muestra el poder que se pensaba que tenía Ereshkigal sobre su reino.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_adad:0 "$omen_adad$"
 omen_adad:0 "adad"
 omen_adad_desc:0 "Adad era un dios de la tormenta y una deidad poderosa que gobierna el cielo y controla los elementos. Se le representaba con una voz con sonido de trueno, pasos de relámpago y ira como una tempestad. En la naturaleza típica de las deidades mesopotámicas, él tenía dos caras y representa bien a Tigres y Éufrates, ambos representando la vida y la agricultura, así como la naturaleza voluble y violenta. Como tal, si bien Adad es un poderoso dios de la guerra de las tormentas y los cielos, y a menudo se lo equipara con personajes como Thor y Zeus, también se pensaba que era un dios de la fertilidad que ayudaría a que las cosechas crecieran.\n\nA menudo se representa a Adad sosteniendo una maza o un hacha, símbolos de su poder y fuerza. También se le suele mostrar con alas o de pie sobre el lomo de un toro, lo que enfatiza aún más sus asociaciones con el poder y la realeza.\n\n #! Efecto apoteósico: $naval_apotheosis_effect_tt_description$"
 deity_zababa:0 "$omen_zababa$"
 omen_zababa:0 "Zababa"
 omen_zababa_desc:0 "Zababa era un dios de la guerra y la deidad patrona de la ciudad de Kish. También era conocido como Zamama y era considerado hijo del dios Enlil. En la mitología sumeria, Zababa estaba asociado con el dios Ninurta y se creía que había luchado junto a él en batallas contra demonios y otras fuerzas malignas. \n\nZababa era típicamente representado como un guerrero feroz que llevaba un casco con cuernos y portaba una maza o una lanza. Zababa era ampliamente venerado en toda Mesopotamia y se creía que ofrecía protección y asistencia a sus devotos en tiempos de guerra y conflicto. En períodos posteriores de la historia mesopotámica, Zababa fue a menudo comparado con otros dioses de la guerra, como el dios acadio Adad y el dios babilónico Marduk. Siguió siendo una figura importante en la religión y la mitología mesopotámica durante miles de años, y su culto sobrevivió hasta bien entrado el período helenístico.\n\n#! Efecto apoteósico: $military_apotheosis_manpower_effect_tt_description$"
 deity_ninazu:0 "$omen_ninazu$"
 omen_ninazu:0 "Ninazu"
 omen_ninazu_desc:0 "Ninazu, también conocida como Ningishzida, era una deidad en la antigua mitología mesopotámica. Era hijo de la poderosa diosa del inframundo, Ereshkigal. Un dios de la curación, el inframundo y la muerte, que guiaba a las almas a su lugar de descanso final, era representado con un perro o un león, los cuales se creía que tenían propiedades medicinales. Ninazu también era considerado un dios de la justicia, y los reyes a menudo lo invocaban para traer justicia y orden a sus reinos. Su nombre significa \"Señor de las profundidades\", enfatizando su conexión con el inframundo. Además, es un dios de gran fuerza y un dios guerrero.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_nergal:0 "$omen_nergal$"
 omen_nergal:0 "Nergal"
 omen_nergal_desc:0 "Nergal era el dios de la guerra, la pestilencia y el inframundo. Era conocido por su gran fuerza, ferocidad en la batalla y temibilidad. Nergal era representado a menudo con cabeza y cuerpo de león, lo que simbolizaba su fuerza y ​​ferocidad. También se le asociaba con el fuego y a menudo se le representaba con llamas o sosteniendo un arma de fuego. Se creía que Nergal era el marido de la diosa Ereshkigal, que gobernaba el inframundo, y a menudo se lo representaba como un poderoso guerrero que la acompañaba en sus viajes. A pesar de su asociación con la muerte y el inframundo, Nergal también era considerado un dios de la agricultura y la fertilidad, y en ocasiones era invocado para obtener bendiciones en esas áreas.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_gula:0 "$omen_gula$"
 omen_gula:0 "Gula"
 omen_gula_desc:0 "Gula, también conocida como Ninkarrak, era una diosa importante en el panteón mesopotámico, asociada principalmente con la curación y la medicina. Se creía que tenía el poder de curar enfermedades, especialmente aquellas relacionadas con el embarazo y el parto. A menudo se la representaba como una hermosa mujer sosteniendo un perro, símbolo de sus poderes curativos. A veces también se la representaba con un león o un dragón, que representaba su poder y fuerza. Su asociación con perros y otros animales la llevó a ser considerada también una protectora de los animales.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"
 deity_nisaba:0 "$omen_nisaba$"
 omen_nisaba:0 "Nisaba"
 omen_nisaba_desc:0 "Nisaba era una diosa mesopotámica de la escritura, el aprendizaje y la cosecha. A menudo se la representaba con un lápiz y una tablilla de arcilla, simbolizando su asociación con la escritura y la educación. Nisaba también estaba estrechamente asociada con la agricultura y la cosecha. Se creía que ella era quien otorgaba cosechas abundantes y tierras fértiles y, como tal, era venerada por agricultores y cultivadores. En algunos mitos, incluso se la consideraba la madre de la vegetación y la diosa del grano. Como diosa del aprendizaje, Nisaba también se asociaba con la sabiduría y el conocimiento. A menudo se la representaba como una maestra, instruyendo a escribas y eruditos en el arte de la escritura y los misterios del universo.\n\nNisaba era típicamente representada como una mujer con un tocado de grano, sosteniendo un lápiz y una tablilla. A veces la acompañaba un símbolo de su marido Haya, un dios del arado, en forma de toro. En algunas representaciones, también sostenía una vara de medir y una bolsa de grano, enfatizando su papel como diosa de la fertilidad y la abundancia.\n\n#! Efecto Apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_anu:0 "$omen_anu$"
 omen_anu:0 "anu"
 omen_anu_desc:0 "Anu fue originalmente el dios preeminente de Mesopotamia al comienzo de su civilización. A pesar de la disminución de los poderes relativos de Anu en favor de otros dioses importantes, siguió siendo una de las deidades más importantes del panteón mesopotámico, a menudo representado como el dios del cielo y el antiguo rey de los dioses. Fue el padre de los dioses y el creador del universo, según la mitología mesopotámica. Anu estaba asociado con el poder, la autoridad y la realeza, y se creía que tenía control sobre el destino de los mortales. A menudo se representaba a Anu con un tocado con cuernos y sosteniendo un cetro, símbolos de su poder y autoridad. A veces también se le mostraba con una esfera celestial o la \"tabla de los destinos\", que representaba su control sobre los cielos y los destinos de los mortales.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_istaran:0 "$omen_istaran$"
 omen_istaran:0 "Istarán"
 omen_istaran_desc:0 "Istaran era un dios poderoso, adorado como el patrón divino de la antigua ciudad-estado sumeria de Der. Era reverenciado por su sabio juicio, e incluso se decía que los reyes consideraban a Istaran como un ejemplo a la hora de impartir justicia. Su esposa, la diosa Šarrat-Dēri, era venerada como la reina de Der, mientras que su sukkal era el dios serpiente Nirah.\n\nEn los kudurrus (límites), Istaran a menudo estaba representado por una serpiente, que podía ser Nirah o el propio Istaran. También era conocido por ser un dios moribundo, e incluso se le equiparaba con Dumuzid en ciertos rituales asociados con el templo de Ekur en Nippur. \n\nAunque su culto nacional disminuyó gradualmente durante el período Babilónico Medio, Istaran todavía era adorado en Der en períodos posteriores. De hecho, el rey Gudea de Lagash incluso instaló un santuario para Istaran en el templo de Ningirsu en Girsu. Incluso hoy en día, sigue siendo una figura importante en la mitología y la religión de la antigua Mesopotamia.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_nanshe:0 "$omen_nanshe$"
 omen_nanshe:0 "Nanshe"
 omen_nanshe_desc:0 "Nanshe era una diosa de la antigua religión mesopotámica, particularmente asociada con la ciudad de Lagash. Era adorada como diosa del agua, la fertilidad, la profecía y la justicia social, y a menudo se la representaba sosteniendo una vara de medir y un balde, representando su papel en la regulación de los recursos hídricos. Como diosa de la justicia social, se creía que brindaba orientación a gobernantes y jueces, y sus templos servían como centros para actividades legales y económicas. También se la asociaba con la adivinación y los sueños, y sus festivales incluían rituales de purificación y ofrendas para asegurar cosechas abundantes. Si bien su adoración decayó después del período babilónico, siguió siendo una deidad importante en la región sur de Mesopotamia.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_ninlil:0 "$omen_ninlil$"
 omen_ninlil:0 "Ninlil"
 omen_ninlil_desc:0 "Ninlil, también conocida como Sud, era una diosa importante en el panteón sumerio. Era la esposa del dios Enlil, la deidad principal del panteón sumerio, y la madre del dios luna Nanna (Sin). Su nombre significa \"Dama del Aire\" y estaba asociada con el viento y la cosecha.\n\nNinlil también era conocida como la diosa de la fertilidad y era adorada por las mujeres que querían concebir o asegurar un parto exitoso. Además, se creía que tenía el poder de curar enfermedades, proteger contra espíritus malignos y traer buena fortuna.\n\nNinlil era muy respetada en la sociedad sumeria y sus templos eran algunos de los más importantes de la región. La ciudad de Nippur era considerada su principal santuario y su culto tuvo influencia en toda Mesopotamia. Los reyes de Sumer a menudo afirmaban haber sido elegidos por Ninlil y le dedicaban ofrendas y oraciones con la esperanza de ganar su favor.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_awal:0 "$omen_awal$"
 omen_awal:0 "Awal"
 omen_awal_desc:0 "Awal era una deidad adorada en la isla de Tylos. Era conocido como el dios de los tiburones y del mar, y a menudo se lo representaba como un hombre con cabeza de tiburón. Como deidad patrona de los marineros y pescadores, se creía que los protegía del peligro y garantizaba una pesca abundante. Awal también se asociaba con la curación y se creía que sus templos eran lugares de refugio para los enfermos y heridos. Sus adoradores le hacían ofrendas de pescado, perlas y otros tesoros con la esperanza de ganarse su favor. Awal era una de las deidades más importantes de la región de Tylos y su influencia se extendió también a otras partes de la Península Arábiga. De hecho, el nombre de Awal significa 'el primero' o 'prima', mostrando claramente su importancia especialmente para los tylosianos.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_ashtaroot:0 "$omen_ashtaroot$"
 omen_ashtaroot:0 "astaroíz"
 omen_ashtaroot_desc:0 "Ashtaroot, también conocido como Asteroth o Tarot, era una deidad de la fertilidad y el sexo. Es posible que haya comenzado como la versión cananea de Ishtar, Astarte, sin embargo, Ashtaroot llegaría a convertirse en una deidad distinta con algunos cultos que la adorarían como la diosa principal de la fertilidad. \n\nMás adelante en la historia, el cristianismo adoptaría una versión masculina de Ashtaroot a la que llamarían Asteroth y la tratarían como uno de los miembros de la trinidad malvada. A pesar de esta malvada interpretación de Asteroth, está bastante claro que en términos de su adoración como diosa caldea, ella era más afín a los temas del sexo, el amor y la guerra, muy parecido a sus contrapartes en Astarte e Ishtar\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_nusku:0 "$omen_nusku$"
 omen_nusku:0 "Nusku"
 omen_nusku_desc:0 "Nusku era un dios asirio del fuego. Nusku también era conocido como el dios probable que los judíos tendrían en todo Nisroch. Por esto, sabemos que Nusku también era un dios de las águilas y que alguna vez tuvo un papel destacado en la religión asiria. Si bien los judíos verían a Nisroc como un demonio del infierno, está bastante claro que en la religión caldea se mencionaba a Nusku en términos de salud. De hecho, Nusku también era un dios de la agricultura y el crecimiento, y es probable que la variación de Nusku que llegaría a ser conocida por los judíos como Nisroch fuera un dios principal de la agricultura, tal vez por eso se ganaría el epíteto en la religión cristiana como \"Jefe de cocina del infierno\".\n\nEn los mitos caldeos más tradicionales, Nusku era una deidad protectora contra los demonios y era conocido por ser el sukkal, o visir divino, de Enlil. Algunas fuentes incluso afirman que era hijo de Enlil.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_ashima:0 "$omen_ashima$"
 omen_ashima:0 "Ashima"
 omen_ashima_desc:0 "Ashima era una diosa adorada principalmente por las poblaciones del Levante de habla aramea y siríaca. A veces se la identifica como la diosa del destino y a menudo se la representa sosteniendo un arco y flechas. A Ashima se le invocaba a menudo en oraciones y encantamientos personales. La gente le pedía protección y bendiciones para ellos y sus seres queridos, y para protegerse de la mala suerte y la desgracia. En algunas tradiciones, Ashima también se asociaba con la curación, y la gente le rezaba pidiendo ayuda para curar enfermedades y lesiones.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_inzak:0 "$omen_inzak$"
 omen_inzak:0 "Inzak"
 omen_inzak_desc:0 "Inzak, también conocido como Enzag, Enzak o Anzak, era un dios de los dátiles, adorado principalmente por la civilización Dilmun. Era una de las dos deidades principales del panteón Dilmunic, la otra era su consorte Meskilak. Los Dilmunitas se referían a Inzak como el Señor de Agarum. A pesar de estar asociado principalmente con los dilmunitas, Inzak era adorado en el extranjero, en Mesopotamia e incluso posiblemente en Asiria. También fue adorado en la ciudad de Susa en Elam.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_belatu:0 "$omen_belatu$"
 omen_belatu:0 "belatu"
 omen_belatu_desc:0 "Belatu es la esposa del dios Hadabal. Al igual que las otras esposas del panteón eblaíta, no se sabe mucho sobre ella. Su nombre se traduce como \"La Dama\". Ella era uno de los ocho dioses asociados con los reyes muertos, junto con su marido.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_hadabal:0 "$omen_hadabal$"
 omen_hadabal:0 "Hadabal"
 omen_hadabal_desc:0 "Hadabal ocupaba el segundo lugar después de Kura entre los antiguos residentes de Ebla. A pesar de esto, sabemos muy poco sobre su personaje. Actualmente existe la teoría de que pudo haber sido un dios de la luna y de la agricultura. También es uno de los ocho dioses de los reyes muertos, y sin duda el más destacado de ellos.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_adamma:0 "$omen_adamma$"
 omen_adamma:0 "Adama"
 omen_adamma_desc:0 "En los textos de Eblaita, Adamma era la consorte de Resheph. Ella era parte de un grupo de 8 deidades eblaítas asociadas con los antiguos reyes, junto con su marido. Adamma era una de las deidades conocidas por ser adorada después de la destrucción de Ebla. Fue adorada por los hurritas que extendieron su culto por sus tierras.\n\n#! Efecto apoteósico: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_agu:0 "$omen_agu$"
 omen_agu:0 "Agu"
 omen_agu_desc:0 "Agu fue mencionado como parte de una pareja divina dentro de la lista de ocho deidades de los reyes muertos. La consorte de Agu era la diosa Guladu. No se sabe mucho más sobre él, sin embargo, probablemente fue adorado con el resto de los dioses de los reyes muertos en Darib.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_guladu:0 "$omen_guladu$"
 omen_guladu:0 "Guladu"
 omen_guladu_desc:0 "Guladu fue mencionado como parte de una pareja divina de la lista de ocho deidades de los reyes muertos. Su consorte era el igualmente misterioso dios Agu. Tanto Guladu como Agu se mencionan muy brevemente y no se sabe mucho sobre ellos.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_dariba:0 "$omen_dariba$"
 omen_dariba:0 "Dariba"
 omen_dariba_desc:0 "Una deidad apenas mencionada cuyo verdadero nombre se ha perdido en el tiempo, lo que sabemos de él lo relaciona con el pueblo de Darib, que era el lugar de un culto a los reyes muertos. Es una de las 8 deidades asociadas con los reyes muertos y una de las dos que no se mencionan como pareja divina. Es posible que haya sido el consorte de Ishara, convirtiendo a los 8 dioses de los reyes muertos en parejas divinas, pero hay muy poca evidencia para estar seguro.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_kura:0 "$omen_kura$"
 omen_kura:0 "kura"
 omen_kura_desc:0 "Kura era el dios más prominente de la antigua ciudad-estado de Ebla, así como el dios patrón de Ebla. Se le consideraba un dios de los reyes y estaba muy asociado a la monarquía. De todos los dioses, Kura era el mejor atestiguado de todos ellos. Su culto decayó por completo después de la caída de Ebla.\n\n#! Efecto apoteósico: $military_apotheosis_military_experience_effect_tt_description$"
 deity_barama:0 "$omen_barama$"
 omen_barama:0 "Barama"
 omen_barama_desc:0 "Barama era la esposa del dios Kura y por tanto formaba parte de la pareja divina de Ebla. Fue adorada extensamente junto con Kura hasta la caída de Ebla. Su nombre significa multicolor y puede que se haya referido a ella, o más bien a su ropa.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"
 deity_meskilak:0 "$omen_meskilak$"
 omen_meskilak:0 "meskilak"
 omen_meskilak_desc:0 "Meskilak era la esposa de Inzak y una de las dos deidades principales de Dilmun junto con su marido. Su nombre para los mesopotámicos era Ninsikila, traducida como \"Dama de los Puros\". En la mitología mesopotámica, Meskilak, como diosa de Dilmun, acude al dios Enki en busca de ayuda, ya que su tierra no es más que un desierto. Enki obliga y regala las tierras de Dilmun con agua dulce. /n/nEl nombre Ninsikila puede parecer familiar ya que también se usa para un dios completamente diferente con el mismo nombre. Este dios Ninsikila era el cónyuge de la diosa Lisin, y eventualmente sería visto como una diosa, en parte debido a este nombre compartido incidental con Meskilak.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_gordys:0 "$omen_gordys$"
 omen_gordys:0 "Gordys"
 omen_gordys_desc:0 "Se dice que Gordys, uno de los hijos de Triptolemos, fue uno de los muchos argonautas que viajaron en el famoso Argo alrededor de los Pontos Euxinos y se asentaron en tierras indómitas. Como muchos de los otros argonautas, Gordys no regresó a Grecia y, en cambio, exploró el interior del este. Al establecerse entre las montañas Gordyaean, le dio su nombre a la ubicación geográfica y fundó la civilización del pueblo Gordyaean.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_ninshubur: "$omen_ninshubur$"
 omen_ninshubur: "Ninshubur"
 omen_ninshubur_desc: "Ninshubur, la diosa que sirve a la majestuosa Inanna y está a su lado, ha sido adorada durante mucho tiempo por derecho propio. Un Asistente Sagrado que intercede ante la corte divina en nombre de los mortales, el culto a Ninshubur comenzó en la provincia de Akkil y rápidamente se extendió a las regiones vecinas.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
