l_spanish:
 deity_agdistis:0 "$omen_agdistis$"
 omen_agdistis:1 "Agdistis"
 omen_agdistis_desc:3 "El dios salvaje y andrógino Agdistis llevará a nuestros hombres y guerreros a la batalla con su frenesí. Con el dios a nuestro lado, nuestro pueblo será invencible en la batalla.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_dactyl:0 "$omen_dactyl$"
 omen_dactyl:1 "Dáctilos"
 omen_dactyl_desc:3 "Ofrecemos nuestros sacrificios a los diez Dáctilos, con la esperanza de que bendigan a nuestros artesanos con su conocimiento y perspicacia. A medida que avanzamos, esperamos que esta sabiduría ayude a nuestra sociedad a competir con los enemigos en nuestras fronteras y a proteger a nuestros amigos y aliados.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
 deity_dindymene:0 "$omen_dindymene$"
 omen_dindymene:1 "Dindimena"
 omen_dindymene_desc:3 "Este rostro de gran madre nos ayudará a reunir los recursos de la nación, fortaleciendo nuestras capacidades. Con una nueva prosperidad en nuestras manos, estamos seguros de que podremos expandirnos de manera eficiente.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_cybele:0 "$omen_cybele$"
 omen_cybele:1 "Cibeles"
 omen_cybele_desc:4 "$cybele_description$\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 cybele_description:0 "La madre de nuestro pueblo aprueba los planes de expandir nuestro imperio e incorporar más personas a nuestra nación. Con la mirada de Cibeles guiándonos, solo nuestros habitantes más agotados se opondrán a más guerras."
 deity_kakasbos:0 "$omen_kakasbos$"
 omen_kakasbos:1 "Kakasbos"
 omen_kakasbos_desc:3 "Ofrecemos nuestra adoración al Licio Kakasbos, esperando su bendición para mantener seguros a nuestros comerciantes mientras viajan por el mundo. En su búsqueda de riqueza, nuestros comerciantes seguramente traerán más riquezas a nuestras comunidades.\n\n#! Efecto apoteósico: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_men:0 "$omen_men$"
 omen_men:1 "Men"
 omen_men_desc:4 "$men_description$\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 men_description:0 "Manes probablemente se originó como una deidad frigia, asociada con el descendiente local del dios lunar hitto-luvita Arma, y solo fue helenizado por la traducción de su nombre nativo al griego 'Men'. El simbolismo lunar domina su iconografía. Generalmente se muestra al dios con los cuernos de una media luna emergiendo detrás de sus hombros, y se lo describe como el dios que preside los meses (lunares).\n\nPedimos al dios lunar que bendiga a nuestro pueblo con seguridad y protección. Bajo su atenta mirada, los disidentes serán sofocados."
 deity_attis:0 "$omen_attis$"
 omen_attis:1 "Atis"
 omen_attis_desc:3 "El Attis castrado esparcirá su sangre por nuestra cosecha y la bendecirá con un crecimiento como nunca antes se había visto. A medida que las cosechas florezcan gracias a su regalo, estamos seguros de que veremos a nuestra gente crecer enormemente una vez más.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_ma_aniketos:0 "$omen_ma_aniketos$"
 omen_ma_aniketos:1 "Ma Aniketos"
 omen_ma_aniketos_desc:3 "$ma_description$\n\nDebido a sus características guerreras, la diosa Ma Aniketos ha sido identificada con Enyo y Bellona, llevando el epíteto de 'Aniketos' (la Invencible) en Comana Capadocia y en varias inscripciones.\n\nLa invencible Ma bendecirá a nuestros soldados con la disciplina de los titanes, asegurándose de que nuestros soldados no huirán de batalla. Con Ma Aniketos a nuestro lado, no es posible que perdamos ninguna guerra.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 # Heirs of Alexander #
 deity_sandon:0 "$omen_sandon$"
 omen_sandon:0 "Sandon"
 omen_sandon_desc:0 "Sandon es un dios del tiempo de Anatolia, a menudo asociado e invocado en tiempos de guerra. Como uno de los dioses más importantes de Cilicia, tiene varios santuarios y templos en su honor, particularmente alrededor de Tarso.\n\nLa deidad está asociada con armas, flores y leones. Los griegos relacionan al dios con su propio Heracles, el dios de los héroes.\n\n#! Efecto Apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_bagaios:0 "$omen_bagaios$"
 omen_bagaios:0 "Bagaios"
 omen_bagaios_desc:0 "Bagaios es un dios de la tormenta y el clima de Frigia, generalmente se cree que es el dador de buenos momentos y cosas. También asociado con la fertilidad, el dios es a menudo invocado en tiempos de necesidad y problemas, para proteger a nuestro pueblo.\n\nEntre los griegos solía asociarse con su propio Zeus, el primero en su panteón.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

# Invictus #
 deity_sebdios:0 "$omen_sebdios$"
 omen_sebdios:0 "Sebdios"
 omen_sebdios_desc:0 "Sebdios, o Sabazis, es el jinete y dios padre del cielo de los frigios y tracios. En la mitología frigia, Sebdios era identificado con Midas, el legendario rey de Frigia que se decía que era un devoto de la diosa Cibeles. \n\nSabdios a menudo era retratado como una figura barbuda y con cuernos montada en un caballo o un toro, y a veces se le mostraba sosteniendo un bastón o una serpiente. También se le asoció con la constelación de Aries, a la que a veces se hacía referencia como el ''carnero de Sabdios''.\n\n#! Efecto apoteósico: $military_apotheosis_manpower_effect_tt_description$"
 deity_sipylene:0 "$omen_sipylene$"
 omen_sipylene:0 "Sipileno"
 omen_sipylene_desc:0 "''Sipileno'' es un epíteto de Cibeles. Se deriva del monte Sípilo, una montaña en el oeste de Anatolia donde se decía que se originó Cibeles. La montaña era considerada sagrada y estaba asociada a varios mitos y leyendas relacionadas con la diosa. El epíteto de Cibeles de ''Sipileno'' enfatiza su conexión con esta montaña sagrada y su importancia en la mitología y la adoración de la diosa.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_idaea:0 "$omen_idaea$"
 omen_idaea:0 "Idaea"
 omen_idaea_desc:0 "El epíteto \"Idaea\" fue uno de los títulos más importantes de la diosa frigia Cibeles. Se deriva del monte Ida, una montaña sagrada en Frigia donde se creía que nació Cibeles. El título ''Idaea'' se refiere a la asociación de Cibeles con la montaña y la idea de que ella era la madre de todos los dioses y diosas.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_berecyntia:0 "$omen_berecyntia$"
 omen_berecyntia:0 "Berecyntia"
 omen_berecyntia_desc:0 "El epíteto \"Berecyntia\" de Cibeles se refiere a la conexión de la diosa con la montaña de Berecinto, que estaba ubicada en Frigia, la antigua región de Anatolia central (actual Turquía) donde se adoraba a Cibeles. La montaña se consideraba sagrada para la diosa y era el lugar de importantes festivales y rituales dedicados a ella.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_pessinuntica:0 "$omen_pessinuntica$"
 omen_pessinuntica:0 "Pesinuntica"
 omen_pessinuntica_desc:0 "Pessinuntica es un epíteto de Cibeles, la diosa madre frigia. Se refiere a su asociación con la ciudad de Pessinus, que era un importante centro de culto a Cibeles en Frigia. El nombre Pessinus se deriva de la palabra de Anatolia \"pissa\", que significa \"roca\" o \"peñasco\", y se cree que la piedra sagrada de la ciudad, el meteorito que era adorado como imagen de la diosa, se encontró originalmente en las montañas cercanas. \n\nEl epíteto Pessinuntica resalta la conexión de Cibeles con la ciudad y su piedra sagrada, que se creía que encarnaba su presencia divina. También enfatiza su papel como deidad protectora de la ciudad y su gente. El culto a Cibeles en Pessinus fue muy influyente en la antigüedad y su culto se extendió a partes del Imperio Romano.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_nana:0 "$omen_nana$"
 omen_nana:0 "Nana"
 omen_nana_desc:0 "Nana es hija del dios del río Sangarios y una ninfa llamada Metope. Se dice que quedó embarazada de una almendra y dio a luz a un hijo llamado Atis, que más tarde se convirtió en amante de Cibeles. Algunas fuentes sugieren que Nana y Cibeles pueden haber sido vistas como aspectos diferentes de la misma diosa.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_sangarios:0 "$omen_sangarios$"
 omen_sangarios:0 "Sangarios"
 omen_sangarios_desc:0 "Sangarios era un dios del río e hijo de la diosa Cibeles. El río que llevaba su nombre se consideraba sagrado y fluía a través de la ciudad de Pessinus, que era un importante centro de culto a Cibeles.\n\nSangarios también se asociaba con la fertilidad y la agricultura, ya que el río que llevaba su nombre era esencial para irrigar los cultivos que sustentaban a la gente de la región. A menudo se le invocaba en oraciones y ofrendas para asegurar una cosecha abundante y la continua fertilidad de la tierra.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
 deity_broteas:0 "$omen_broteas$"
 omen_broteas:0 "Broteas"
 omen_broteas_desc:0 "Broteas era una figura de la mitología frigia que a veces se asociaba con la diosa Cibeles. Se decía que era rey de la ciudad de Troya e hijo del dios del río Escamando. Según algunas tradiciones, Broteas era sacerdote o devoto de Cibeles y ayudó a difundir su culto en la región.\n\n#! Efecto Apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_nicaea:0 "$omen_nicaea$"
 omen_nicaea:0 "Nicea"
 omen_nicaea_desc:0 "Nicea proviene del mito de Atis, de quien se decía que nació de Nana, una virgen, fecundada por una almendra que cayó en su regazo de un árbol que crecía donde estaban los restos castrados de Agdistis. Nana dio a luz a Attis en el monte Agdos y el niño fue abandonado en la montaña. El niño Atis fue encontrado y criado por un macho cabrío, y más tarde creció hasta convertirse en sacerdote de Cibeles. Y Nicea es descrita como la esposa de Attis. Algunos eruditos sugieren que Nicea pudo haber sido una diosa local o una deidad menor asociada con la región alrededor de Nicea, una ciudad en Bitinia, que más tarde recibió su nombre.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_midas:0 "$omen_midas$"
 omen_midas:0 "Midas"
 omen_midas_desc:0 "Las leyendas hablan del toque de Midas. El rey Midas de Frigia, hijo del rey Gordías de la famosa ciudad de Gordion, gobernó en el Período Arcaico. Supuestamente dio hospitalidad al mayor de los sátiros, Sileno, y el dios Dioniso le dio un toque dorado, como era su deseo. Todos conocen la historia y su elemento trágico, en el que el rey convirtió en oro demasiadas cosas y no encontró alegría, sustento ni saciedad en su oro. Su lección y su gobierno (en la historia real) sirven para enseñar a los futuros líderes los dolores de la codicia.\n\n#! Efecto apoteósico: $midas_apotheosis_effect_tt_description$"
 deity_pylaemenes:0 "$omen_pylaemenes$"
 omen_pylaemenes:0 "Pylaemenes de los Eneti"
 omen_pylaemenes_desc:0 "Rey de Eneti y relacionado con el antiguo rey Príamo de Ilión a través de Fineo de Tracia. Él y su hijo, Harpalion, lucharon en Ilión contra los micénicos y su líder, Menelao. Derribado por el propio Menelao, el rey trajo muchos guerreros enetoi/paflagonios para defender los muros sagrados de Ilión y dejó un gran legado guerrero para el pueblo de Anatolia central.\n\n#! Efecto de apoteosis: $pylaemenes_apotheosis_effect_tt_description$"
 deity_gordias:0 "$omen_gordias$"
 omen_gordias:0 "Gordias"
 omen_gordias_desc:0 "Padre del rey Midas y supuesto fundador del famoso Gordion, creador del nudo gordiano que Alejandro Magno cortó en pedazos, Gordias fue un gobernante histórico. Los historiadores dicen que una vez vino de Macedonia, o incluso de Tracia, pero llegó a Frigia como el último de la tribu Bryges (ese pueblo que se convertiría en los frigios en Anatolia). Un pobre granjero y carretero, los oráculos adivinaron que se convertiría en rey y construiría un reino fuerte, y así lo hizo cuando la gente que rodeaba a Gordion lo aceptó como su gobernante. Algunos dicen que su hijo, Midas, fue producto de él mismo y de la deidad madre de Anatolia, la propia Cibeles.\n\n#! Efecto apoteósico: $gordias_apotheosis_effect_tt_description$"
