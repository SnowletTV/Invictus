l_spanish:
 ## Nemeti ##
 deity_nemetona:0 "$omen_nemetona$"
 omen_nemetona:1 "Nemetona"
 omen_nemetona_desc:3 "Nuestra diosa patrona bendecirá a nuestros hombres con su favor, asegurando nuestra victoria en la guerra. Con ella a nuestro lado nuestros hombres seguramente lucharán más disciplinadamente para proteger a nuestra tribu y a la diosa, que nos mira con buenos ojos.\n\nNemetona es la diosa del panteón más importante para los Nemeti, pero menos conocida entre el Panteón Celta en su conjunto. Es adorada como una diosa en arboledas sagradas y áreas religiosas.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 ## Aedui ##
 deity_sucellus:0 "$omen_sucellus$"
 omen_sucellus:1 "Sucellus"
 omen_sucellus_desc:3 "Nuestro dios patrón Sucellus bendecirá a nuestro pueblo con protección en estos tiempos de necesidad, garantizando la seguridad y la concordia entre nuestros pares. Con este dios a nuestro lado, sólo los peores y más problemáticos estarían dispuestos a continuar con sus disturbios.\n\n#! Efecto Apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 ## Aquitani ##
 deity_eki:0 "$omen_eki$"
 omen_eki:1 "Eki"
 omen_eki_desc:3 "Ofreceremos nuestra adoración a la diosa del sol con la esperanza de que ella continúe protegiéndonos. Con su bendición a nuestro lado, nuestra gente ciertamente se calmará y sofocará a los disidentes antes de que puedan causar más problemas a nuestra sociedad.\n\n#! Efecto apoteósico: $culture_apotheosis_characters_effect_tt_description$"
 deity_mari:0 "$omen_mari$"
 omen_mari:1 "Mari"
 omen_mari_desc:3 "Adoraremos a la Señora de las Tormentas con la esperanza de que traiga tormentas de fertilidad en lugar de devastación a nuestros campos. Con nuestras cosechas cobrando vida y crecimiento, estamos seguros de que nuestra gente crecerá de forma segura durante muchos años.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"

 ## Pretani ##
 deity_andraste:0 "$omen_andraste$"
 omen_andraste:0 "Andraste"
 omen_andraste_desc:0 "Andraste es una deidad de la guerra local generalmente venerada por las tribus Pretani que viven en $britain_region$, y los Iceni en particular la invocan como diosa de la victoria. Supuestamente la liebre es un animal sagrado para Andraste, ya que juega un papel importante en los ritos y rituales religiosos en su honor.\n\nEntre los romanos se la conoce como Victoria, y los griegos la llaman Nike.\n\n#! Efecto apoteósico: $military_apotheosis_military_experience_effect_tt_description$"
 deity_belatucadros:0 "$omen_belatucadros$"
 omen_belatucadros:0 "Belatucadros"
 omen_belatucadros_desc:0 "Esta deidad es un dios de la guerra con cuernos de las tribus Pretani del norte, con varias variantes invocadas por las tribus locales de los Votadini en particular. Aunque es un dios de la guerra, la deidad también está asociada con la naturaleza, la flora y los alisos.\n\nEntre los griegos y romanos se le conoce como Ares y Marte, y ocasionalmente es venerado como Toutatis entre las tribus galas.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_coventina:0 "$omen_coventina$"
 omen_coventina:0 "Coventina"
 omen_coventina_desc:0 "Coventina es una diosa de los pozos y manantiales alrededor de un pequeño bosque sagrado en las tierras de las tribus Briganti. Supuestamente la diosa ha traído vida a las duras tierras de la zona, y su adoración ha comenzado a migrar más allá del área inmediata donde fue venerada originalmente.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_nodens:0 "$omen_nodens$"
 omen_nodens:0 "Nodens"
 omen_nodens_desc:0 "Nodens es una deidad de la guerra y la curación de las tribus Pretani, centrada en la guerra en el mar y la caza. Como deidad cazadora, su animal sagrado es el perro, el cual juega un papel importante en el día a día de quienes lo adoran así como en los rituales que lo veneran.\n\nSu culto ha comenzado a aparecer fuera de las fronteras de $britain_region$, y se le ha relacionado con el culto de otras deidades como Silvanus entre los romanos y Papposilenus entre los Griegos.\n\n #! Efecto de apoteosis: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_sulis:0 "$omen_sulis$"
 omen_sulis:0 "Sulis"
 omen_sulis_desc:0 "Sulis es una diosa local de las aguas termales del sur de $britain_region$, en parte como figura de una diosa madre y en parte como protección contra las maldiciones. Incluso gente de lejos ha comenzado a viajar a los manantiales para ofrecer sus oraciones a la diosa, pidiendo ayuda contra las maldiciones que podrían haberlos afligido.\n\nEn tierras extranjeras la han llamado Minerva o Atenea, relacionándola con su Diosa de la Sabiduría.\n\n#! Efecto Apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 ## Belgae ##
 deity_camulus:0 "$omen_camulus$"
 omen_camulus:0 "Camulus"
 omen_camulus_desc:0 "Camulus es un dios de la guerra de los belgas de la Galia, venerado entre todas sus tribus. Suele asociarse con un jabalí, que en ocasiones es considerado un animal sagrado entre quienes honran a la deidad.\n\nEntre los griegos se le conoce como Ares, y Marte entre los romanos.\n\n#! Efecto apoteósico: $military_apotheosis_manpower_effect_tt_description$"

 ## Treveri ##
 deity_lenus:0 "$omen_lenus$"
 omen_lenus:0 "Lenus"
 omen_lenus_desc:0 "Lenus es un dios de la guerra entre algunas de las tribus tréveros más pequeñas en las fronteras entre Germania y la Galia. A menudo se le asocia con el dios galo más común Toutatis, como protector de las tribus, pero también tiene muchos elementos únicos propios.\n\nAdemás de ser una deidad protectora de la guerra, es venerado como un dios de los manantiales y la salud entre los tréveros. En muchos casos, se le representa con la diosa Ancamna, normalmente como su marido.\n\n#! Efecto apoteósico: $military_apotheosis_manpower_effect_tt_description$"
 deity_intarabus:0 "$omen_intarabus$"
 omen_intarabus:0 "Intarabus"
 omen_intarabus_desc:0 "Intarabus es una de las deidades más importantes para algunas de las tribus Treveri de la Galia, como uno de sus muchos protectores. Por lo general, se lo retrata como un hombre en la flor de su vida, con una piel de lobo sobre sus hombros y una lanza en la mano.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_ancamna:0 "$omen_ancamna$"
 omen_ancamna:0 "Ancamna"
 omen_ancamna_desc:0 "Entre las tribus Treveri, Ancamna es una diosa de la fertilidad de los manantiales y una de las principales deidades de su panteón local. A menudo se la retrata con su marido, Lenus, como protectores divinos de las tribus locales.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 ## Default ##
 deity_taranis:0 "$omen_taranis$"
 omen_taranis:1 "Taranis"
 omen_taranis_desc:4 "Nuestros hombres necesitan mantenerse firmes ante la adversidad, sabiendo que el dios del cielo mira nuestra causa con favor. Con su bendición y ayuda, nuestro pueblo seguramente vencerá a enemigos y vecinos mientras luchamos por la supremacía.\n\nTaranis es uno de la Tríada Sagrada, junto con Esus y Toutatis, y es bien conocido como un dios del trueno. Cuando se reúnen con comerciantes latinos y comerciantes de la península italiana, el dios a menudo se interpreta como su Júpiter.\n\n#! Efecto apoteósico: $military_apotheosis_defensive_effect_tt_description$"
 deity_toutatis:0 "$omen_toutatis$"
 omen_toutatis:1 "Teutates"
 omen_toutatis_desc:3 "El protector de la tribu inspirará a nuestros hombres a tomar las armas y luchar por la tribu en tiempos de necesidad. Con todos estos nuevos reclutas potenciales, estamos seguros de que podremos traer más hombres a la guerra de los que hemos tenido el potencial de hacer en mucho tiempo.\n\nToutatis es uno de los tres de la Tríada Sagrada, junto con Esus y Taranis, y es bien conocido como un dios de la guerra. Además, suele ser visto como un gran protector de las tribus, asumiendo un papel más defensivo que muchos de los dioses de la guerra de otras naciones. A menudo se interpreta como el Marte romano, aunque los dos tienen naturalezas bastante diferentes.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_gobannus:0 "$omen_gobannus$"
 omen_gobannus:1 "Gobannus"
 omen_gobannus_desc:3 "El patrón de los herreros nos traerá el conocimiento y la tecnología necesarios para hacer avanzar nuestra sociedad más allá de nuestras limitaciones actuales. A medida que superemos a nuestros antepasados, seguramente podremos competir con nuestros vecinos y enemigos.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_cernunnos:0 "$omen_cernunnos$"
 omen_cernunnos:1 "Cernunnos"
 omen_cernunnos_desc:3 "Rogamos al dios Astado que comparta parte de la riqueza que lleva con nuestro pueblo. Con nuevas riquezas en nuestras manos, nuestra gente seguramente prosperará durante mucho tiempo.\n\nCernunnos es el cuidador de los muertos y un dios de la vida, los animales y la riqueza. A pesar de su aspecto algo salvaje y su elemento de muerte, el dios suele ser visto como pacífico y como una parte importante del panteón.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_ogmios:0 "$omen_ogmios$"
 omen_ogmios:1 "Ogmios"
 omen_ogmios_desc:3 "Ogmios une a nuestro pueblo a su causa y justifica las acciones necesarias de sus seguidores. A medida que nuestro pueblo esté convencido de las necesidades de las guerras en las que hemos participado, también estará más dispuesto a tomar las armas para futuras batallas.\n\nEl gran héroe guerrero Ogmios es conocido por sus numerosos viajes por nuestras tierras, uniendo a las personas que conoce con sus causas. Además, se le conoce como un psicopompo que guía las almas de los muertos al más allá. A menudo se interpreta como el Hércules romano o el Heracles griego, aunque las historias de los héroes son diferentes entre sí.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_lugus:0 "$omen_lugus$"
 omen_lugus:1 "Lugus"
 omen_lugus_desc:3 "Las tres caras del dios nos traerán riqueza e implorarán a los comerciantes de todas partes que abran sus arcas para nuestros productos. A medida que nuestros comerciantes reciben la ayuda del gran dios, nuestra gente seguramente verá más riqueza pasando por nuestro reino.\n\nComo uno de los dioses principales de nuestra fe, Lugus juega un papel importante en lo que respecta a las artes, además de ser considerado un compuesto de la Tríada Sagrada; Taranis, Toutatis y Esus. Ocasionalmente interpretado como el Mercurio romano a pesar de sus diferencias.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_icovellauna:0 "$omen_icovellauna$"
 omen_icovellauna:1 "Icovelauna"
 omen_icovellauna_desc:3 "Los ríos de la tierra serán guiados de manera que provean a nuestro pueblo y traigan paz y prosperidad a aquellos que siguen a la diosa. Con la deidad a nuestro lado, solo los disidentes más problemáticos seguirán causando problemas en nuestra sociedad, permitiéndonos centrar más nuestra atención en los enemigos en nuestras fronteras.\n\n#! Efecto apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_rosmerta:0 "$omen_rosmerta$"
 omen_rosmerta:1 "Rosmerta"
 omen_rosmerta_desc:3 "La diosa de la Fertilidad bendecirá a nuestro pueblo con una cosecha abundante y vida para nuestros jóvenes. A medida que nuestra gente sea bendecida, seguramente veremos menos años de malas cosechas y más personas crecerán saludables en los años venideros.\n\nElla es la diosa de la fertilidad y la abundancia, así como la consorte de Lugus.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"

 deity_brigantia:0 "$omen_brigantia$"
 omen_brigantia:0 "Brigantia"
 omen_brigantia_desc:1 "Nuestros valientes guerreros alcanzarán la victoria bajo la guía de la diosa de la batalla y la gloria, inspirados para mejorar sus hazañas de armas y confiar en el triunfo inevitable de nuestro pueblo.\nBrigantia es una diosa guerrera celta atestiguada principalmente en las Islas Británicas, y que fue interpretada por los romanos como un paralelo de Nike o Victoria en el panteón helénico.\n\n#! Efecto apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_glanis:0 "$omen_glanis$"
 omen_glanis:0 "Glanis"
 omen_glanis_desc:1 "El divino poder curativo del dios de la primavera fluye a través de los numerosos peregrinos que acuden en masa para compartir su buena voluntad y bañarse en los estanques sagrados. Es alentador saber que hay esperanza para los enfermos siempre y cuando presenten el debido respeto a los dioses.\nGlanis era una deidad curativa gala asociada con los manantiales de Glanum, cuyo culto duró hasta el surgimiento del cristianismo.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_berobreo:0 "$omen_berobreo$"
 omen_berobreo:0 "Berobreo"
 omen_berobreo_desc:1 "En el extremo occidental del mundo, el dominio del inframundo de Berobreo se traga los lugares desconocidos y los misterios de la tierra. Debemos recordar la naturaleza fugaz de la vida y la inmensidad de nuestra ignorancia si queremos vivir felices y apreciar las bendiciones de los dioses en este mundo.\nUn famoso santuario que se adentra en el mar en el oeste de Galicia fue dedicado a Berobreo.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
 deity_cichol:0 "$omen_cichol$"
 omen_cichol:0 "Cichol"
 omen_cichol_desc:0 "Esta deidad es una de las deidades de la guerra adorada en la mayor parte del mundo galo, desde los belgas en el norte hasta los pueblos de la Galia Transalpina en el sur. A diferencia de muchas de las otras deidades de la guerra veneradas en la Galia, generalmente no se lo retrata como un protector, sino más bien como un guerrero fuerte independiente de ninguna tribu.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_nantosuelta:0 "$omen_nantosuelta$"
 omen_nantosuelta:0 "Nantosuelta"
 omen_nantosuelta_desc:0 "Nantosuelta es una deidad misteriosa adorada en todas partes de la Galia, Britania e Iberia, a menudo asociada con la guerra o la abundancia. La diosa suele ser representada como un cuervo, o con un cuervo a su lado, un animal que se considera sagrado entre quienes la veneran.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_maponos:0 "$omen_maponos$"
 omen_maponos:0 "Maponos"
 omen_maponos_desc:0 "Maponos es un dios de la juventud adorado tanto en la Galia como en Britania, a menudo representado con algún tipo de instrumento. La deidad se asocia con la poesía o el amor, dos atributos que suelen mostrarse en la mayoría de las historias en las que participa.\n\nEntre los griegos y romanos se le conoce como Apolo, lo más parecido que tienen a un dios de la juventud propio.\n\n#! Efecto apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_belisama:0 "$omen_belisama$"
 omen_belisama:0 "Belisama"
 omen_belisama_desc:0 "Belisama es una diosa solar adorada en toda la Galia y Britania. Ella es la forma femenina del aún más famoso Belinus, un dios que ocasionalmente se dice que es su esposo, ambos conocidos como el que mueve el sol a través del cielo.\n\nEntre los romanos, ocasionalmente se la asocia con su diosa de la sabiduría, Minerva.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_belinus:0 "$omen_belinus$"
 omen_belinus:0 "Belinus"
 omen_belinus_desc:0 "Belinus es un dios solar entre el pueblo de la Galia y Britania, y varios mitos notables lo convierten en el portador del sol. Es una de las deidades más veneradas en toda la Galia, ocasionalmente también como la variante femenina conocida como Belisama, que algunos dicen que es su esposa.\n\nEntre la gente del Mediterráneo generalmente se le conoce como Helios o Apolo, sus propias deidades solares.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_artio:0 "$omen_artio$"
 omen_artio:0 "Artio"
 omen_artio_desc:0 "Artio es una diosa de la fertilidad, la vida y la abundancia, adorada en todas partes. El oso se considera uno de sus animales sagrados, y esta asociación es profunda, hasta el punto de que algunos la llaman diosa oso y la representan con una cabeza o piel de oso.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_cissonius:0 "$omen_cissonius$"
 omen_cissonius:0 "Cissonius"
 omen_cissonius_desc:0 "Cissonius es un dios de los viajeros y el comercio para muchas de las tribus de la Galia y Bretaña, único y bastante diferente de las muchas deidades guerreras y curativas que suelen ser veneradas en estas tierras. Generalmente se le representa como un hombre mayor montado en un carnero y bebiendo vino, y se le considera un equivalente del Hermes griego o del Mercurio romano.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
