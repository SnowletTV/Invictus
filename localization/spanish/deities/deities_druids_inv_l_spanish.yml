l_spanish:
 #Gauls

 deity_leucetius:0 "$omen_leucetius$"
 omen_leucetius:1 "Leucetius"
 omen_leucetius_desc:3 "La tribu Trévero en la Galia está asombrada ante el atronador espectáculo en los cielos oscuros, porque Leucecio está jugando ante ellos. Como dios del rayo, Leucetius es un símbolo de fuerza y velocidad, y venerado por los guerreros.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"

 deity_mogons:0 "$omen_mogons$"
 omen_mogons:1 "Mogons"
 omen_mogons_desc:3 "Los Vangiones del este de la Galia han encontrado a su dios principal en Mogons, a quien llaman «el grande». Piden su ayuda antes de la batalla, ya que su símbolo es una espada blandida en sangre.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"

 deity_condatis:0 "$omen_condatis$"
 omen_condatis:1 "Condatis"
 omen_condatis_desc:3 "Los celtas de Gran Bretaña adoran a Condatis, el dios de los ríos y la curación. Sus seguidores se reúnen en las confluencias de los ríos donde colocan regalos y sacrificios en su honor.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_segomo:0 "$omen_segomo$"
 omen_segomo:1 "Segomo"
 omen_segomo_desc:3 "Antes de la batalla, el guerrero haeduiano rezaba a Segomo, su dios de la guerra y la victoria. Conocido como el 'poderoso', Segomo recibe una gran parte del botín de guerra como propio, como muestra de reverencia y agradecimiento de sus guerreros victoriosos.\n\n#! Efecto apoteósico: $military_apotheosis_defensive_effect_tt_description$"

 deity_sirona:0 "$omen_sirona$"
 omen_sirona:1 "Sirona"
 omen_sirona_desc:3 "Sirona es ampliamente conocida y adorada entre los celtas, pero especialmente entre los tréveros del norte de la Galia. Es la principal diosa de la curación y está asociada con manantiales y aguas cristalinas. Por lo general, se la representa acunando un cuenco de huevos con una serpiente verde enrollada alrededor de su brazo.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_visucius:0 "$omen_visucius$"
 omen_visucius:1 "Visucius"
 omen_visucius_desc:3 "En la Galia oriental, a caballo entre el Rhenus, las tribus adoran a Visucio. Es un dios del conocimiento y, por lo tanto, es venerado tanto entre los viejos como entre los jóvenes que se sacrifican a él por el éxito y la habilidad. Su símbolo es el pájaro más inteligente, el cuervo, negro como el hollín y siempre con un truco esperando a ser mostrado.\n\n#! Efecto Apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_alaunius:0 "$omen_alaunius$"
 omen_alaunius:1 "Alaunius"
 omen_alaunius_desc:3 "El dios patrón de la tribu Alauni es conocido por sus aguas puras y curativas. También es conocido como un dios de las profecías, ya que aquellos que buscan orientación para el futuro vienen a Alaunus.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_rudianos:0 "$omen_rudianos$"
 omen_rudianos:1 "Rudianos"
 omen_rudianos_desc:3 "En el sureste de la Galia los pueblos adoran a Rudianos, su dios de la guerra. Es una amenaza roja montada a caballo, participando en la caza de cabezas ritual que tanto aprecian los galos. Sus seguidores se pintan de rojo cuando entran en batalla, listos para recoger las cabezas de sus enemigos.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"

 deity_damona:0 "$omen_damona$"
 omen_damona:1 "Damona"
 omen_damona_desc:3 "Damona es conocida por los celtas como la \"vaca divina\" y es un símbolo de generosidad y fertilidad. A menudo se la ve como la consorte de Borvo o Moritasgus, y sus seguidores le rezan en varias fuentes termales que salpican la Galia.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"

 deity_cocidius:0 "$omen_cocidius$"
 omen_cocidius:1 "Cocidius"
 omen_cocidius_desc:3 "Los pueblos del norte de Britannia prestan atención a Cocidio en muchas cosas. Es el dios de los árboles y las arboledas, pero también de la espada y el escudo. Los británicos lo celebran con tallas de madera de este dios auspicioso y las pintan de rojo para ganarse su favor.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 #deity_borvo:0 "$omen_borvo$"
 #omen_borvo:1 "Borvo"
 #omen_borvo_desc:3 "Borvo is the water deity of the Lusitanians, and a symbol of healing. The Lusitanians offer gifts to him at sacred mountain springs, and celebrate him for spiritual guidance."

 #deity_nabia:0 "$omen_nabia$"
 #omen_nabia:1 "Nabia"
 #omen_nabia_desc:3 "Nabia is the goddess of rivers and waters in north-western Iberia, and many rivers hold her name. Especially the Bracari tribe reveres her, and they plan festivities along the river banks in her honor."

 deity_arvernus:0 "$omen_arvernus$"
 omen_arvernus:1 "Arvernus"
 omen_arvernus_desc:3 "En el centro de la Galia, la tribu arverna sigue al dios Arverno, ejemplo de su pueblo. Los romanos lo interpretaron como un paralelo a Mercurio y, por lo tanto, se asocia con el comercio y las habilidades en la artesanía.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"

 deity_smertrios:0 "$omen_smertrios$"
 omen_smertrios:1 "Smertrios"
 omen_smertrios_desc:3 "Smertrios el Proveedor es venerado como dios de la guerra por los celtas de la Galia y Noricum. Los herreros rezan por su fuerza en su hierro, y a menudo se lo representa como un hombre fuerte y barbudo que lucha contra un aterrador wyrm.\n\n #! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_sionna:0 "$omen_sionna$"
 omen_sionna:0 "Sionna"
 omen_sionna_desc:0 "Sionna, la diosa de los zorros, puede transformarse en diferentes criaturas y cambiar de forma misteriosamente. La diosa es bastante hermosa e ingeniosa e inspira a nuestra gente a cazar. El pueblo belga específicamente ha encontrado reverencia por ella. Algunos junto al mar incluso adoran a su misterioso marido, el dios de los Zorros, que se dice que proviene de Feliciacum.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_snowlet:0 "$omen_snowlet$"
 omen_snowlet:0 "Snowlet"
 omen_snowlet_desc:0 "Snowlet, el dios de los Zorros, la consorte de Sionna. Se sabe que Snowlet lidera ejércitos en los cielos con feroces acciones disciplinarias. Su liderazgo es supremo, su mando es absoluto, los disidentes son castigados. Ni siquiera el mar puede detenerlo mientras hace marchar a su ejército a través de las aguas más profundas.\n\n#! Efecto Apoteosis: $war_apotheosis_martial_tech_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"

 deity_severed_head:0 "$omen_severed_head$"
 omen_severed_head:0 "Dios de la cabeza cortada"
 omen_severed_head_desc:0 "Tomando muchos nombres, incluso hasta el de Bran de la lejana Hibernia, el Dios de la Cabeza Cortada, a quien los muchos galos del sur rinden homenaje con pilares con calaveras, copas de calaveras y otras estructuras, se dice que llegó al mundo humano como una cabeza parlante por sí sola, apareciendo como una cabeza caída en la batalla, o como la menos afortunada de dos vecinos en una disputa por los campos; a veces aparece como una cabeza de cuervo. Su sabiduría es incognoscible e impulsa a muchos miembros de la tribu a tomar las cabezas de sus enemigos en la batalla.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
