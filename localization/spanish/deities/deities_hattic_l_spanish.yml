l_spanish:

 deity_taru:0 "$omen_taru$"
 omen_taru:0 "Taru"
 omen_taru_desc:0 "Taru, que era el dios original del dios hitita Tarhunna o Tarhunz, es un dios del clima y las tormentas, a menudo representado como toros o asociado con ellos. Se creía que controlaba los relámpagos, los truenos y el crecimiento de personas y plantas. Taru parece haber dejado una gran impresión en los conquistadores hititas y sirvió de inspiración para los dioses de las ciudades de Nerik, Zippalanda e incluso para el dios principal de los palaicos: Ziparwa. \n\nTaru estaba emparejado con quizás la deidad más venerada de todo el panteón hatico; Wurunshemu o Arinna. Juntos, la divina pareja tuvo tres hijos: Telipinu, Inara y Mezulla, así como un linaje adicional que involucra a la diosa Zintuhi.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"

 deity_talipinu:0 "$omen_talipinu$"
 omen_talipinu:0 "Talipinu"
 omen_talipinu_desc:0 "El llamado 'Hijo Exaltado', Talipinu, era quizás un dios de la tormenta relacionado con la agricultura o la fertilidad. A diferencia de su padre, Taru, Talipinu parece haber tenido un papel más pasivo. Los hititas ampliaron enormemente este papel, con su versión, 'Telipinu', surgió un mito bastante famoso conocido como el Mito Telepinu.\n\nLa niebla se apoderó de las ventanas. El humo se apoderó de la casa. En el hogar los leños estaban sofocados. En los altares los dioses fueron sofocados. En el redil las ovejas fueron sofocadas. En el corral las vacas fueron asfixiadas. La oveja rechazó a su cordero. La vaca rechazó a su cría. Telipinu se fue y se llevó el grano, la fertilidad de los rebaños, el crecimiento, la abundancia y la saciedad al desierto, a la pradera y al páramo... Los hombres y los dioses perecen de hambre.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"

 deity_estan:0 "$omen_estan$"
 omen_estan:0 "Estan Wurunshemu"
 omen_estan_desc:0 "Mucho más conocida como Arinna, o incluso como su epíteto 'Wurunshemu' (Madre de la Tierra), Estan es quizás la deidad Hattic más importante. Su consorte es el poderoso dios de la tormenta, Taru, que serviría de inspiración para muchas deidades hititas, e incluso serviría como diosa principal del Antiguo Reino Hitita. Su centro de culto era la ciudad de Arinna, donde obtuvo su nombre más popular de Arinna (sin embargo, este epíteto fue adoptado durante el Reino hitita medio). Más tarde, durante el Nuevo Reino Hitita, sería sincretizada con la diosa hurrio-hitita Hepat.\n\nJunto con su prominencia en la ciudad homónima de Arinna, la diosa del sol estaba asociada con la ciudad de Hattusha, donde era representada como un disco solar. Por lo general, se le ofrecía un toro como sacrificio (quizás en referencia a su consorte Taru) junto con tres ovejas. También estaba profundamente asociada con los ciervos, y la reina Puduhepa le prometió a Estan (Ishtanu en hitita) que le daría a la diosa muchos ciervos.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_hatepinu:0 "$omen_hatepinu$"
 omen_hatepinu:0 "Hatepinu"
 omen_hatepinu_desc:0 "La hija del mar, el nombre de Hatepinu significa literalmente eso, \"Hija del Mar\". Ella es la consorte del hijo de Taru y Esthan, Talipinu, y ambos estaban generalmente asociados con la agricultura. Se volvió importante en el sistema de creencias hitita y parecía ocupar un lugar bastante destacado en el panteón del pueblo Kaska.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_katahzipuri:0 "$omen_katahzipuri$"
 omen_katahzipuri:0 "Katahzipuri"
 omen_katahzipuri_desc:0 "Más conocida por su forma hittie, Kamrusepa, Katahzipuri era la diosa hatiana de las medicinas y la magia. Ella desempeñaría un papel fundamental en el mito de Talipinu, actuando como pacificador para el enojado dios \"desaparecido\" de la vegetación. También tenía muchos otros roles, incluido el de partera divina y deidad doméstica del hogar. Curiosamente, se la consideraba residente del cielo y los hititas y luvitas la representaban y la llamaban \"espíritu de humo\". También parecía tener una conexión especial con la ciudad de Kanesh, fortalecida por los rituales hititas posteriores de la zona.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"

 deity_triple:0 "$omen_triple$"
 omen_triple:0 "Estan-Tappinu-Zintuhi"
 omen_triple_desc:0 "Las tres generaciones de diosas; Estan la madre, Tappinu la hija y Zintuhi la nieta; Los tres eran adorados como una triple deidad. Esto ejemplifica particularmente la importancia de Estan (Arinna/Arinniti) en la ciudad santa de Arinna. Tappinu, a quien los hititas también llaman Mezulla, fue utilizada como intermediaria de su madre también durante las campañas militares. Desafortunadamente, no sabemos mucho sobre 'la nieta', Zintuhi, y parece que no tuvo una función especial. Se sabe que tiene un epíteto peculiar de 'Pinza de ropa en el pecho', sin embargo, el significado de esto se pierde en el tiempo.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_inaras:0 "$omen_inaras$"
 omen_inaras:0 "Inaras"
 omen_inaras_desc:0 "Inaras, o Inara, es una diosa fundamental en el festival de primavera de Puruli en Hattian. El festival está dedicado a la diosa que conocemos sólo por el nombre hitita Hannahanna, y parece ser un festival contemporáneo del festival Akitu de las creencias mesopotámicas. El papel de Inaras es darle ayuda al dios de la tormenta (Tarhunna en hitita, pero probablemente Taru en las creencias haticas originales) en forma de trampa. Inara utiliza el ardid de un festín para atraer y derrotar al dragón-serpiente Illuyanka (nombre hitita, pero se origina en el mito hatico). Como parte de su plan, seduce al mortal conocido como Hupasiyas de Zigaratta para conseguir su ayuda cuando llegue el momento. Cuando el dragón-seprant está lo suficientemente borracho, Hupasiyas ata una cuerda alrededor de Illuyanka, lo que permite al padre de Inaras, presumiblemente Taru, destruir al ser malvado.\n\nAdemás, hay una especie de epílogo tanto para Inaras como para Hupasiyas. Primero, Inaras construye una casa para su amante mortal, en lo alto de un acantilado. Su única instrucción fue que Hupasiyas nunca mirara por la ventana, porque si ve a su familia, le causará un gran dolor. Desafortunadamente, mientras Inaras estaba fuera, esto es exactamente lo que hizo Hupasiyas, y le rogó a Inaras que lo dejara volver a casa con su familia. Inaras se enfurece con este acto de la llamada arrogancia de Hupasiyas, sin embargo, se desconocen las consecuencias y sólo podemos especular.\n\nMientras tanto, el epílogo de Inaras implica otro mito. La diosa madre Hannahanna le promete a Inaras un hombre y una tierra. Sin embargo, Inaras desaparecería, iniciando un famoso mito de Taru (o un Dios de la Tormenta sin nombre) para buscar a Inaras con la ayuda de Hannahanna y una abeja. Los estudiosos se apresuran a señalar las similitudes entre esta historia y la del mito griego de Perséfone y Deméter.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_hannahanna:0 "$omen_hannahanna$"
 omen_hannahanna:0 "Hannahanna"
 omen_hannahanna_desc:0 "Sin duda, Hannahanna no es el nombre original de la famosa diosa madre, sino más bien el nombre hitita, que describe su papel de \"abuela\". Tenía todo un festival dedicado a ella, el importantísimo festival Puruli, así como una serie de mitos supervivientes; indicando su importancia para el pueblo Hatti antes de los hititas.\n\nEl papel de Hannahanna en la mitología parece implicar una serie de desapariciones misteriosas. Primero, el famoso mito de Talipinu, donde el dios de la tormenta Taru solicita la ayuda de Hannahanna para encontrar a Talipinu. Ella envía una abeja para encontrar a Talipinu, y la abeja efectivamente lo encuentra. En otro mito, Inaras desaparece y una vez más Hannahanna envía al asistente de abejas a buscarla. Finalmente, en el tercer mito, la propia Hannahanna desaparece, aunque esa era su intención. Ella se enojó y se fue, causando que toda la tierra sufriera. El ganado se asfixia, las madres dejan de cuidar a sus hijos (tanto animales como humanos), y sólo cuando ella regresa se restablece el orden.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"

 deity_illuyanka:0 "$omen_illuyanka$"
 omen_illuyanka:0 "Illuyanka"
 omen_illuyanka_desc:0 "El dragón-serpiente, Illuyanka, una vez amenazó al gran dios de la tormenta Taru, sin embargo, a través del poder de la amistad y su propio poder, Taru venció a Illuyanka, venciéndolo mediante la muerte. La narrativa original de Hattic implica que él es atado por el amante mortal de Inaras y luego asesinado por Taru (o un dios de la tormenta sin nombre).\n\nAdorar a este diabólico dragón serpentino sería bastante poco ortodoxo, sin embargo, tal vez su tentación de poder haga que valga la pena.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_kasku:0 "$omen_kasku$"
 omen_kasku:0 "Kasku"
 omen_kasku_desc:0 "Kasku, o 'La Estrella Brillante', es el dios de la luna en el panteón Hattic. En su mito, 'La caída de la luna del cielo', dice que Kasku desciende (o cae) a la ciudad comercial de Lahzan. Sin embargo, esto enfurece al poderoso Taru, que empapa a Kasku con feroces lluvias y vientos. Katahziwuri se da cuenta del alboroto y realiza un ritual para calmar al enojado dios de las tormentas. En la versión hitita y luvita del mito, Katahziwuri hace esto con la ayuda de Hapantali.\n\n#! Efecto de apoteosis: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"

 deity_zaparwa:0 "$omen_zaparwa$"
 omen_zaparwa:0 "Zaparwa"
 omen_zaparwa_desc:0 "Zaparwa era el jefe del panteón palaico, sin embargo, el pueblo palaico adoraba un panteón adyacente al de los Hatti, más cerca de ellos que del panteón luvita-hurrio-hitita. Su centro de culto era la ciudad de Pala, más tarde conocida como Paflagonia. Debido a sus orígenes, a Zaparwa se le comparaba a menudo con el dios de origen hatico, Talipinu, que también era un dios de la tormenta y desempeñaba un papel en el mito de la desaparición de Talipinu. También era considerado un dios de la vegetación. Además, su conexión con el resto del panteón principal de Hattic viene en la forma de su consorte, la Reina de la Tierra, Katahzipuri.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_shulinkatte:0 "$omen_shulinkatte$"
 omen_shulinkatte:0 "Shulinkatte"
 omen_shulinkatte_desc:0 "Shulinkatte era conocido como el rey de 'Shuli'. Se sabe que la palabra hatic katte significa rey, sin embargo, se desconoce shuli. Algunos creen que la palabra significa espada, sin embargo, esto aún no se puede demostrar. Sin embargo, tendría sentido, ya que Shulinkatte era conocido como el dios de la guerra de Nerik. Shulinkatte en realidad era considerado el padre del dios de la tormenta Nerik, probablemente una versión epitetal local de Taru, y también era adorado en Hattusha. Su principal lugar de culto era la ciudad de Tamarmara, aunque los orígenes y la ubicación de la zona están escasamente documentados. Se le representa con una espada y montando un león.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_hapantali:0 "$omen_hapantali$"
 omen_hapantali:0 "Hapantali"
 omen_hapantali_desc:0 "Hapantali, o Hapantaliya, es en realidad una diosa de origen luvita, no de origen hatico. Este es uno de los pocos dioses que ingresaron a las creencias haticas desde Luwian y no al revés. Cabe señalar que algunos estudiosos han sugerido un origen hatico, pero la mayoría rechaza esta idea de plano. En su adoración, era vista como una diosa pastora, responsable del rebaño de ovejas asociado con el dios del sol de Luvita, Tiwaz. En la mitología hatic, es probable que ella haya desempeñado un papel en calmar a Talipinu y Hannahanna en dos ocasiones diferentes durante la Desaparición de Talipinu y la Desaparición de Hannahanna respectivamente. A menudo aparece junto a Inaras o como asistente de Hannahanna.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
