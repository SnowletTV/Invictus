l_spanish:
 #From Torugu
 deity_athena_tritogeneia: "$omen_athena_tritogeneia$"
 omen_athena_tritogeneia: "Atenea Tritogenia"
 omen_athena_tritogeneia_desc: "$athena_description$\n\n#Y Tritogeneia#!: En la tierra santa de Libia, es allí donde encontrarás las aguas vivificantes del lago Tritonis, y es cerca de estas aguas sagradas donde nació la diosa Atenea Tritogeneia, la que fue engendrada por los tres. Alábala, mortal, y recibe sus bendiciones si te encuentra digno.\n\n#! Efecto Apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 ## Dionysos Indikos
 deity_dionysos_indikos:0 "$omen_dionysos_indikos$"
 omen_dionysos_indikos:0 "Dionisio Indikos"
 omen_dionysos_indikos_desc:0 "$dionysus_description$\n\n#Y Indikos#!: Dionysos Indikos es la manifestación griega del dios agámico Shiva. Lo hemos introducido en el panteón greco-budista. Ofreceremos nuestras oraciones a Shiva con la esperanza de que guíe a nuestros hombres en la batalla y fortalezca su moral. Con la disciplina y la determinación de nuestros soldados reforzadas, estamos seguros de que lograremos muchas victorias en los próximos años.\n\n#! Efecto apoteósico: $military_apotheosis_capital_freemen_effect_tt_description$"

 ## Imperator Invictus ##
 deity_aphrodite_areia:0 "$omen_aphrodite_areia$"
 omen_aphrodite_areia:0 "Afrodita Areia"
 omen_aphrodite_areia_desc:0 "$aphrodite_description$\n\n#Y Areia#!: este epíteto significa 'Afrodita la guerrera' y comúnmente adorado en Esparta y Taras. A menudo representada con una armadura completa como el dios de la guerra Ares, se cree que esta representación guerrera de Afrodita pertenece a sus primeros acólitos y cultos en Chipre y Citera, donde hubo una fuerte influencia oriental durante el Período de Orientalización.\n\nEsta representación puede rastrear la ascendencia de Afrodita de diosas más antiguas del Medio Oriente, como la sumeria Inanna, la mesopotámica Ishtar y la fenicia 'Ashtart.\n\nEn Chipre, también se hacía referencia a Afrodita con el epíteto 'Afrodita Encheios' (Afrodita con una lanza), y se ha sugerido que el culto fue traído de Chipre a Esparta.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_enyo:0 "$omen_enyo$"
 omen_enyo:0 "Enío"
 omen_enyo_desc:0 "Enyo, una diosa de la guerra frecuentemente asociada con el dios griego Ares, ya sea como su amante o su hermana, es responsable de orquestar la destrucción de ciudades, y a menudo acompaña a Ares en la batalla.\n\nDurante la caída de Troya, Enyo infligió terror y derramamiento de sangre en la guerra, junto con Eris ('Conflicto'), Fobos ('Miedo') y Deimos ('¿Temor?), siendo estos dos últimos hijos de Ares. Según el mito, Enyo estuvo involucrado en la guerra de los Siete contra Tebas, y también en la guerra de Dioniso contra los indios.\n\nSe dice que Enyo estaba tan encantada con la guerra que incluso se negó a tomar partido en la batalla entre Zeus y el monstruo Tifón.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_bellona:0 "$omen_bellona$"
 omen_bellona:0 "Belona"
 omen_bellona_desc:0 "Bellona, la diosa romana de la guerra, la destrucción y la devastación, era la consorte de Marte, el dios romano de la guerra.\n\nEn la tradición romana, Bellona es responsable de orquestar la destrucción de las ciudades, y a menudo acompaña a Marte en la batalla. En el culto militar de Bellona, se la asociaba más a menudo con Virtus, la personificación del valor.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_hestia:0 "$omen_hestia$"
 omen_hestia:0 "Hestia"
 omen_hestia_desc:0 "Hestia, una diosa virgen del hogar, el orden correcto de la domesticidad, la familia, el hogar y el estado, fue la primogénita de los titanes Cronos y Rea. \n\n Habitualmente, en la cultura griega, Hestia recibía la primera ofrenda en cada sacrificio en el hogar. \n\n En el dominio público, el hogar del pritaneum funcionaba como su funcionario. Santuario y, cuando se estableciera una nueva colonia, una llama del hogar público de Hestia en la ciudad madre sería llevada al nuevo asentamiento.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_vesta:0 "$omen_vesta$"
 omen_vesta:0 "Vesta"
 omen_vesta_desc:0 "Vesta, diosa virgen del hogar, el orden correcto de la domesticidad, la familia, el hogar y el estado, fue la primogénita de los titanes Saturno y Ops. Rara vez se la representaba en forma humana y, a menudo, se la representaba mediante el fuego de su templo en el Foro Romano.\n\nLa entrada a su templo solo estaba permitida a sus sacerdotisas, las vestales, quienes cuidaban el fuego sagrado en el hogar de su templo. Como se la consideraba guardiana del pueblo romano, su fiesta, Vestalia (7-15 de junio), se consideraba una de las fiestas romanas más importantes.\n\nDurante Vestalia, las matronas caminaban descalzas por la ciudad hasta el santuario de la diosa, donde presentaban ofrendas de comida.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_proserpina:0 "$omen_proserpina$"
 omen_proserpina:0 "Proserpina"
 omen_proserpina_desc:0 "Proserpina es una antigua diosa romana cuyo culto, mitos y misterios se combinaron con los de Libera, una de las primeras diosas romanas del vino. En Grecia, era conocida como Perséfone y su madre es Deméter, diosa del grano y la agricultura.\n\nAsí como se pensaba que Perséfone era hija de Deméter, Proserpina era hija del equivalente romano de Deméter, Ceres.\n\nAl igual que Perséfone, Proserpina está asociada con el reino del inframundo y su gobernante, gobernando como Reina del inframundo; y junto con su madre Ceres, con el crecimiento primaveral de los cultivos y el ciclo de vida, muerte y renacimiento o renovación.\n\n#! Efecto Apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_luna:0 "$omen_luna$"
 omen_luna:0 "Luna"
 omen_luna_desc:0 "Luna es la diosa de la luna y hermana del dios sol Sol. Todos los días él viaja por los cielos, y cada noche ella hace lo mismo.\n\nSe dice que sentía tanto por su amante Endimión, que hizo que su padre Júpiter le concediera la inmortalidad, la eterna juventud y el sueño eterno, para poder visitarlo todas las noches.\n\n Luna no siempre es una diosa distinta, sino a veces más bien un epíteto que especializa a una diosa, ya que tanto Diana como Juno se identifican como luna. Diosas.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_kronos:0 "$omen_kronos$"
 omen_kronos:0 "Cronos"
 omen_kronos_desc:0 "Kronos era el líder y el más joven de la primera generación de Titanes, los divinos descendientes de Urano (Padre Cielo) y Gaia (Madre Tierra). Derrocó a su padre y gobernó durante la mitológica Edad de Oro, hasta que fue derrocado por su propio hijo Zeus y encarcelado en el Tártaro.\n\nSin embargo, según Platón, las deidades Forcis, Cronos y Rea eran los hijos mayores de Océano y Tetis. Suele representarse con un arpa, una guadaña o una hoz, que fue el instrumento que utilizó para castrar y deponer a Urano, su padre.\n\nA menudo se confunde a Kronos, o quizás se le identifica conscientemente con, el Dios del Tiempo Cronos en la antigüedad debido a la similitud de sus nombres.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_saturn:0 "$omen_saturn$"
 omen_saturn:0 "Saturno"
 omen_saturn_desc:0 "Saturno era el dios de la generación, la disolución, la abundancia, la riqueza, la agricultura, la renovación periódica y la liberación. El reinado mitológico de Saturno fue descrito como una Edad de Oro de abundancia y paz. Después de la conquista romana de Grecia, se lo fusionó con el titán griego Kronos.\n\nLa consorte de Saturno era su hermana Ops, con quien engendró a Júpiter, Neptuno, Plutón, Juno, Ceres y Vesta. \nSaturno se celebraba especialmente durante el festival de Saturnalia cada diciembre, quizás el más famoso de los festivales romanos, una época de banquetes, cambios de roles, libertad de expresión, entrega de regalos y juerga.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"
 deity_eris:0 "$omen_eris$"
 omen_eris:0 "Eris"
 omen_eris_desc:0 "Eris era la diosa griega de la lucha y la discordia. La historia más famosa de Eris relata que ella inició la Guerra de Troya provocando el Juicio de Paris.\n\nLas diosas Hera, Atenea y Afrodita habían sido invitadas junto con el resto del Olimpo a la boda forzada de Peleo y Tetis, quienes se convertirían en los padres de Aquiles, pero Eris había sido desairada debido a su carácter problemático. Inclinaciones.\n\nPor lo tanto (como se mencionó en Kypria según Proclo como parte de un plan ideado por Zeus y Themis) arrojó a la fiesta la Manzana de la Discordia, una manzana dorada con la inscripción: \"Para la Más Bella\", provocando que las diosas comenzaran a pelear sobre el recipiente apropiado.\n\nEl desventurado Paris, Príncipe de Troya, fue nombrado para seleccionar la más bella por Zeus. Después de esto, las diosas intentaron sobornar a París para que las eligiera.\n\nHera ofreció poder político; Atenea prometió sabiduría infinita; y Afrodita lo tentó con la mujer más bella del mundo: Helena, esposa de Menelao de Esparta.\n\nMientras la cultura griega ponía mayor énfasis en la destreza y el poder, París optó por otorgar la manzana a Afrodita, condenando así a su ciudad, que fue destruida en la guerra que siguió.\n\n#! Efecto Apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_discordia:0 "$omen_discordia$"
 omen_discordia:0 "Discordia"
 omen_discordia_desc:0 "Discordia era la diosa romana de la lucha y la discordia, y es la contraparte de Eris. Al igual que Eris, es conocida por iniciar la Guerra de Troya después de haber sido desairada por los dioses del Olimpo, por lo que presentó la Manzana de la Discordia.\n\nEsto llevó a Júpiter a elegir al príncipe troyano Paris para seleccionar a la Diosa más bella de todas, para lo cual elegiría a Venus, después de que ella le ofreciera a Helena, esposa de Menelao de Esparta, un acto que encendería el troyano. Guerra.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_artemis_tauropolos:0 "$omen_artemis_tauropolos$"
 omen_artemis_tauropolos:0 "Artemisa Táuride"
 omen_artemis_tauropolos_desc:0 "$artemis_description$\n\n#Y Tauropolos#!: La historia de Ifigenia, una doncella que casi fue sacrificada por su padre antes de ser rescatada por la diosa Artemisa, es especial para nuestro pueblo. Porque Ifigenia fue llevada a la tierra de los Taurios, y cuando finalmente regresó, trajo consigo una estatua de su protectora Artemisa, una que veneramos hasta el día de hoy. Recordar las misericordias de Artemisa Tauropolos es nuestro deber sagrado.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_hecate_iphemide:0 "$omen_hecate_iphemide$"
 omen_hecate_iphemide:0 "Ifigenia Hécate"
 omen_hecate_iphemide_desc:0 "$hecate_description$\n\n#Y Iphemide#!: Hécate, un nombre susurrado a los niños traviesos por las noches; una misteriosa diosa de la magia y el misterio, de la luz y la oscuridad, La que espera en la encrucijada y permanece fuera de las puertas. En nuestras tierras la conocemos como Hécate Iphemide, recordando hechos que otros devotos menos piadosos han olvidado hace mucho tiempo.\n\n#! Efecto Apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_heraklean_targitaos:0 "$omen_heraklean_targitaos$"
 omen_heraklean_targitaos:0 "Targitaos Herácleo"
 omen_heraklean_targitaos_desc:0 "$targitaos_description$\n\n#Y Heraklean#!: Una interpretación helénica del dios Targitaos, representa una mezcla de culturas. La fuerza combinada del abuelo griego y escita de la línea de nuestros reyes nos otorgará un poder inconmensurable en la guerra.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_hylaian_drakaina:0 "$omen_hylaian_drakaina$"
 omen_hylaian_drakaina:0 "Hilaia Dracanea"
 omen_hylaian_drakaina_desc:0 "$drakaina_description$\n\n#Y Drakaina#!: Mitad serpiente mitad mujer como la otra Drakaina del mito griego, la Hylaian Drakaina sirve como representación de la tierra fértil. En un esfuerzo por explicar el mito del origen tradicional escita desde su propia perspectiva, los griegos la utilizaron para transmitir la idea de la tierra que dio origen a los tres grandes hijos de Heracles que poblarían la tierra de Escitia.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_drakon_kholchikos:0 "$omen_drakon_kholchikos$"
 omen_drakon_kholchikos:0 "Drakon Kholchikos"
 omen_drakon_kholchikos_desc:0 "$kholchikos_description$\n\n#Y Kholkikos#!: El dragón que guardaba el roble donde originalmente se colgaba el Vellocino de Oro antes de que Iason de los Argonautas lo tomara y huyera con la ayuda de Medea, hija del rey Eetes. El drakon, una serpiente gigante y vigilante, era el protector sagrado del bosque que, según los griegos, pertenecía a Ares. De sus dientes, sembrados en la tierra, surgieron guerreros feroces y curtidos en la batalla, listos para luchar hasta el amargo final. Era una criatura terrible pero asombrosa con un propósito singular diseñado por los dioses.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_aeetes:0 "$omen_aeetes$"
 omen_aeetes:0 "Aetes"
 omen_aeetes_desc:0 "Hijo del dios Sol Helios y la Oceánida (ninfa del agua) Perseida, Aeëtes era el rey de la Cólquida en la mitología griega. Ocupó un lugar destacado en la increíble historia de Iason y los argonautas, en la que Aeëtes le prometió a Iason el legendario vellocino de oro si Iason podía completar ciertas tareas. Es posible que Eetes también haya sido una figura real de la historia, o quizás una representación de un rey histórico real. Muchos gobernantes de la Cólquida afirman ser descendientes de esta figura semimítica."
 deity_iason:0 "$omen_iason$"
 omen_iason:0 "Iason"
 omen_iason_desc:0 "Iason es un héroe griego antiguo y el líder de los argonautas. Iason reunió una tripulación para su barco, el Argo, que incluía muchos héroes griegos, incluidos Heracles, los Dioscuri, Argus, Orfeo y muchas más figuras prominentes. Su objetivo era encontrar el legendario vellocino de oro y así emprender la aventura. Primero a la isla de Lemnos, en la que todos los hombres excepto Heracles participaron en muchas aventuras con las mujeres locales, lo que dio como resultado una nueva \"raza\" de los Minyae. Luego se aventuraron a Cyzicus, donde se encontrarían con un ataque sorpresa de los gigantes terrestres llamados Gegeines. Luego, Iason y los Argonautas zarparon hacia la corte de Fineo donde fueron atacados por arpías. Finalmente, para llegar a Cólquida, navegaron a través de las traicioneras Simplegadas, que eran acantilados aplastantes y chocantes que apuntaban a cualquier cosa que pasara a través de ellos. Finalmente llegaron a Cólquida donde tendrían que enfrentarse a Eetes y sus pruebas imposibles para conseguir el Vellocino de Oro."
 deity_leukothea:0 "$omen_leukothea$"
 omen_leukothea:0 "Leucotea"
 omen_leukothea_desc:0 "Leukothea, o Leukothoe, era una diosa con muchos mitos de origen ligeramente diferentes. En una versión, ella era la reina de Athamas, que entonces se llamaba Ino. Hera volvería loca a Ino como castigo por cuidar al dios recién nacido Dioniso. Ino saltó al mar con su hijo Melicertes en brazos. Por compasión, los dioses transformaron a los dos en dioses del mar. Ino se convirtió en Leucotea y su hijo se convirtió en Palaemón.\n\nEn una versión del mito de Rodas se trata de Halia, una ninfa (o diosa menor). Era hija de los titanes Thalassa y Pontus. Halia se convertiría en la esposa de Poseidón y de la unión nacieron seis hijos y la diosa Rodas. Sin embargo, los hijos le negaron a Afrodita el acceso a su isla, por lo que ella maldijo a los hijos que agredirían sexualmente a su propia madre, Halia. Desesperada, Halia se sumergió en el océano y se convirtió en Leucotea.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"
 deity_prometheus:0 "$omen_prometheus$"
 omen_prometheus:0 "Prometeo"
 omen_prometheus_desc:0 "Prometeo, el titán griego del fuego. Prometeo desafió a los dioses griegos al darle a la humanidad el secreto del fuego. Fue anunciado como una gran deidad para la humanidad, que les regaló no sólo el fuego, sino también la esencia del avance tecnológico y la civilización. Sin embargo, debido a que desafió a los dioses, Prometeo fue castigado por la eternidad. Estaba atado a una roca gigante en una montaña al borde de la Cólquida. Allí, un águila vendría todos los días a comerse el hígado de su cuerpo. Cada noche su hígado volvía a crecer, sólo para ser devorado nuevamente por el águila.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_apsyrtus:0 "$omen_apsyrtus$"
 omen_apsyrtus:0 "Apsirto"
 omen_apsyrtus_desc:0 "Apsirto, príncipe de la Cólquida y descendiente de Helios, fue fundamental en la historia de Jasón y los argonautas. Él y su hermana, Medea, huirían con Jasón lejos de la Cólquida con el legendario vellocino de oro. Sin embargo, Medea, para frenar a su padre que la habría alcanzado, mata a Apsyrtus y arroja partes de su cuerpo detrás de ella para que su padre se vea obligado a recoger todos los pedazos de su hijo, ralentizándolo así.\n\n#! Efecto de apoteosis: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_apollo_hegemon:0 "$omen_apollo_hegemon$"
 omen_apollo_hegemon:0 "Apolo hegemón"
 omen_apollo_hegemon_desc:0 "La forma vengadora y conquistadora del dios de la luz Apolo, el que no muestra piedad, que gobierna a los reyes y emperadores del mundo. Apollo Hegemon es muy querido por los ciudadanos de nuestras ciudades, quienes ven a Apolo como inspiración en tiempos de paz y guerra, porque la misma mano que toca la lira lleva la espada."
 deity_ge:0 "$omen_ge$"
 omen_ge:0 "Ge"
 omen_ge_desc:0 "Ge es la representación armazic de la deidad griega Gaia. Uno de los cuatro seres inmortales originales que surgieron cuarto después de Khaos, ella era la encarnación de la tierra misma. Ella crearía Ouranos, los cielos, antes de dar a luz a más hijos. Ourea, las montañas; Pontos, el mar; y los cíclopes; todo sin la ayuda de una consorte. Ouranos se convertiría en su primera consorte. De esta unión, Ge quedó embarazada de tres hijos. Sin embargo, Urano, temiendo por su posición, se negó a permitir que nacieran los niños. Por lo tanto, Ge sufriría inmensamente ya que Ouranos le impediría dar a luz. Finalmente, Kronos la ayudaría a vengarse de Ouranos cortándole el miembro masculino. De ahí nacieron muchos seres: Erinys, los gigantes, Ninfas del Fresno (Meliae), y de la mayor parte de la carne surgió la diosa Afrodita. Finalmente, los niños dentro de Ge nacieron como los Titanes Briareos, Kottos y Gyes.\n\n#! Efecto Apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_phrixus:0 "$omen_phrixus$"
 omen_phrixus:0 "Frixo"
 omen_phrixus_desc:0 "Frixo era hijo del rey de Beocia, Atamante. Su madre era la diosa de las nubes, Nephele. Frixo, junto con su gemela Helle, debían ser sacrificados para salvar las cosechas de Beocia. Su madrastra, Ino (más tarde la diosa Leucotea), los odiaba y por eso tostaba en secreto todas las semillas de grano en Beocia. Los granjeros preguntaban al oráculo qué había sucedido y qué hacer, sin embargo, Ino sobornó a los hombres que debían pronunciar las palabras del oráculo para que mintieran y dijeran al resto de los beocios que el oráculo afirmaba que Frixo y Helle debían ser sacrificados. Antes de que pudieran ser sacrificados, fueron salvados por un carnero nadador con el vellón dorado. Desafortunadamente, durante los viajes en el carnero, Helles se caería y sería arrojada a las aguas que en adelante se llamarían Helesponto. Mientras tanto, Frixo iría a Cólquida, donde el rey Eetes lo trató bien e incluso se casó con la hija de Eetes, Calciope. De su unión nacieron Argus, Phrontis, Melas y Cytisorus.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_hydaspes:0 "$omen_hydaspes$"
 omen_hydaspes:0 "Hidaspo"
 omen_hydaspes_desc:0 "Hydaspos es el poderoso dios del río Hydaspes, también llamado río Jhelum. Cuando Alejandro marchó con sus ejércitos hacia el Indo y el rey Porus luchó contra él, los dioses también lucharon. En un cuento épico, se describió a Hidaspos luchando contra Dioniso como una representación de Porus contra Alejandro. Si bien esta epopeya se produjo en el siglo V d.C., es probable que los orígenes del dios Hidaspo comenzaran en el siglo I a.C. Es una encarnación del río que lleva el mismo nombre. También se le llama el dios de la Pentapotamia.\n\n#! Efecto de apoteosis: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_zeus_dacieus:0 "$omen_zeus_dacieus$"
 omen_zeus_dacieus:0 "Zeus Dacio"
 omen_zeus_dacieus_desc:0 "$zeus_description$\n\n#Y Dacieus#!: Zeus Dacieus era adorado en Capadocia por muchos, y su sacerdote era el cuarto sacerdote más importante del reino.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_cataonian_apollo:0 "$omen_cataonian_apollo$"
 omen_cataonian_apollo:0 "Apolo cataoniano"
 omen_cataonian_apollo_desc:0 "$apollo_description$\n\n#Y Cataonian#!: El templo de Apolo Cataonian en Dastarcum fue el modelo para todos los demás templos en Capadocia.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_orpheus:0 "$omen_orpheus$"
 omen_orpheus:0 "Orfeo"
 omen_orpheus_desc:0 "Orfeo fue un héroe griego legendario con un talento musical que superaba la capacidad humana. Era hijo de Calíope y Eagrus, el rey de Tracia. Se decía que el propio Apolo le había regalado su lira. Orfeo se uniría a los Argonautas y rivalizaría con la música de las sirenas con su propia música. Al regresar se casó con Eurídice, sin embargo, ella moriría por mordedura de serpiente. Estaba tan desconsolado que utilizó su destreza musical para encantar y conmover a Hades, quien permitiría a Eurídice regresar al mundo de los vivos siempre que ni ella ni Orfeo le dieran la espalda al abandonar su reino. Orfeo lograría salir del todo y luego regresaría, sin embargo, Eurídice aún no saldría y desaparecería instantáneamente de regreso al inframundo.\n\n #! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_hermes_trumsiates:0 "$deity_hermes_trumsiates$"
 omen_hermes_trumsiates:0 "Hermes Trumsiate"
 omen_hermes_trumsiates_desc:0 "Hermes Trumsiate, una fusión espartana de la deidad helénica de Hermes con el dios veneciano existente Trumsiate, es venerado tanto por viajeros como por comerciantes dentro de la esfera helénica del noreste de Italia. Protector de las caravanas, los Enetoi lo identifican especialmente, quienes a menudo dependen del comercio para ganarse la vida.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_apollo_altinos:0 "$omen_apollo_altinos$"
 omen_apollo_altinos:0 "Altinos Apollo"
 omen_apollo_altinos_desc:0 "Dado que el antiguo dios veneciano de Altino era visto como uno y el mismo Apolo griego continental, se ha convertido en una de las deidades más importantes de los Enetoi, con sacrificios de caballos realizados periódicamente en sus templos.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_artemis_reitia:0 "$omen_artemis_reitia$"
 omen_artemis_reitia:0 "Reitia Artemis"
 omen_artemis_reitia_desc:0 "Al ser una de las deidades más veneradas por los vénetos locales, los invasores espartanos equipararon a Reitia con Artemisa. Se dice que Reitia Artemis, diosa de la naturaleza y de las mujeres, protege al pueblo enetoiano, brindándoles un profundo respeto por el mundo natural y fomentando la alfabetización de la ciudadanía a través de sus rituales religiosos.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_ares_einaios:0 "$omen_ares_einaios$"
 omen_ares_einaios:0 "Ares Einaios"
 omen_ares_einaios_desc:0 "Einaio, que anteriormente era sólo un dios patavo local, fue elevado por los invasores espartanos y equiparado con su gran dios de la guerra, Ares. Ahora Ares Einaios es el principal dios de la guerra de los Enetoi y se cree que lidera todas sus victorias.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 #omen_orpheus_desc:0 "Orpheus was a legendary Greek hero of musical talent beyond human capability. He was the son of Calliope and Oeagrus, the King of Thrace. He was said to have been given his lyre by Apollo himself. Orpheus would go on to join the Argonauts and rivaled the music of sirens with his own music. Upon returning he married Eurydice, however, she would die to snakebite. He was so grief stricken that he used his musical prowess to charm and move Hades, who would allow Eurydice to come back to the world of the living provided neither she nor Orpheus turned their back while leaving his realm. Orpheus would make it all the way out and then turn back, however, Eurydice would not be out yet and instantly vanished back to the Underworld."
 deity_hera_kandarene:0 "$omen_hera_kandarene$"
 omen_hera_kandarene:0 "Hera Kandarene"
 omen_hera_kandarene_desc:0 "$hera_description$\n\n#Y Kandarene#!: Escondida en las montañas Olgassys en el norte de Anatolia, Hera vigila la ciudad de Kandara con una cálida mirada. Hera, una diosa madre como Cibeles Mater, se convirtió en álamo en la gran Anatolia tras la colonización jónica de su costa occidental y las islas cercanas. Para los Paflagonios, ella existe como protectora de su cultura, su línea real y su forma de vida.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_kytioros:0 "$omen_kytioros$"
 omen_kytioros:0 "Kytioros"
 omen_kytioros_desc:0 "Hijo de Frixo, aquel hombre que huyó de Beocia y de la muerte al acogedor hogar de los Colquidos Eetes montando el vellón de oro, Kytioros no acabó en ninguna de las tierras de su padre. En cambio, tomó su hogar en los picos de la cordillera Olgassys de Paflagonia, en un santuario de pico detrás del puerto de Kytoros, y le dio su nombre a esa ciudad... o eso es lo que Éforo de Kyme quería hacer creer a la gente.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_glycon:0 "$omen_glycon$"
 omen_glycon:0 "Glycon"
 omen_glycon_desc:0 "La supuesta encarnación del dios sanador Asclepios, la serpiente Glycon, reside en Abonuteichos, manejada por el oráculo de Glycon. Serpiente con cabeza humana, se dice que pronuncia acertijos y adivina la buenaventura. La criatura oráculo recuerda a los muchos cultos a serpientes que se encuentran en el corazón de Macedonia en Hellas. En todas partes, la gente ha llegado a tener en alta estima a la serpiente, creyendo que todos sus dichos son su luz guía.\n\n#! Efecto apoteósico: $glycon_apotheosis_effect_tt_description$"
 deity_zeus_chrysaoreus:0 "$omen_zeus_chrysaoreus$"
 omen_zeus_chrysaoreus:0 "Zeus Chrysaoreus"
 omen_zeus_chrysaoreus_desc:0 "$zeus_description$\n\n#Y Chrysaoreus#!: Zeus Chrysaoreus, estrechamente asociado con Zeus Labrandos, fue el producto de la fusión de la cultura helénica y caria, actuando como una forma helenizada del dios del tiempo hurrita Teshub. \n\nEl dios de los cielos bendice nuestros avances en el campo de batalla. Con la guía del portador de la tormenta, nuestra gente perfeccionará sus habilidades con el hacha y la espada.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_achelous:0 "$omen_achelous$"
 omen_achelous:0 "Aqueloo"
 omen_achelous_desc:0 "$achelous_description$\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 achelous_description:0 "Hijo de los Titanes Océano y Tetis, Aqueloo fue la personificación del río epónimo Aqueloo, el río más largo de Grecia. Aqueloo fue adorado como el dios del agua dulce. Algunos creían que 'las aguas de Aqueloo, remolinando de plata' eran la fuente de todo el Mediterráneo. Famosamente luchó con Heracles por la mano de Deyanira y fue vencido tres veces: primero en forma de hombre, luego como serpiente y finalmente como toro. Este conflicto se representó a menudo en cerámica en todo el mundo helénico. Después de derrotar a su enemigo, Heracles arrancó uno de los cuernos de toro de Aqueloo y lo dio a las Hespérides, quienes llenaron el cuerno con frutas y flores, transformándolo en la Cornucopia o Cuerno de la Abundancia. Se decía que Aqueloo engendró a las sirenas con una de las Musas, generalmente Terpsícore o Melpómene.\n\nLa evidencia arqueológica indica que Aqueloo fue un dios fluvial importante, quizás el más importante de todos los dioses fluviales griegos, desde un período temprano. Pero su influencia comenzó a decaer a finales del siglo IV a.C., y Aqueloo fue gradualmente relegado al estatus de un dios menor del agua."
 deity_mithras:0 "$omen_mithras$"
 omen_mithras:0 "Mitra"
 omen_mithras_desc:0 "Especialmente popular en los ejércitos romanos del este, el culto de Mitra está envuelto en ritos misteriosos y reverencia al dios titular, Mitra. La iconografía más destacada de este extraño culto es la del toro y las corridas de toros. Algunos dicen que es un héroe griego de la antigüedad, mientras que otros lo comparan con el propio Apolo. Es difícil decir cuando el dios tiene tan pocas celebraciones, aparte del día 25 del mes de diciembre. En los pocos festivales que celebran, se llenan de grandes fiestas dentro de templos subterráneos llamados Mithraeum.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"

 
 deity_demetrios:0 "$omen_demetrios$"
 omen_demetrios:0 "Demetrios Poliorcetes"
 omen_demetrios_desc:0 "Demetrios Poliorcetes fue un noble y líder militar griego macedonio que se convirtió en rey de Macedonia entre 294 y 288 a.C. Miembro de la dinastía Antigónida, era hijo de su fundador, Antígono I Monóftalmos, y su esposa Estratonice, así como el primer miembro de la familia en gobernar Macedonia en la Grecia helenística.\nDespués de que Demetrios arrebatara el control de Atenas a Casandro, fue adorado como un dios viviente por el agradecido pueblo de Atenas, quien le otorgó honores religiosos y estatus divino con el himno itifálico, incluyendo la atribución de ascendencia divina al nombrar a Demetrios como hijo de Poseidón y Afrodita. Demetrios recibió el opisthodomos del Partenón como su residencia personal y fue hecho oráculo, colocando a Demetrios en una posición de suprema autoridad religiosa y elevándolo a un rango prácticamente inviolable. Durante este período, Demetrios Poliorcetes recibió honores propios del dios Dionisio. Entre muchos cambios, el festival llamado Dionisia fue reconstituido como la Demetria."

 deity_aphrodite_hoplimense:0 "$omen_aphrodite_hoplimense$"
 omen_aphrodite_hoplimense:0 "Afrodita Hoplismene"
 omen_aphrodite_hoplimense_desc:0 "$aphrodite_description$\n\n#Y Hoplismene#!: que significa 'equipado' es el epíteto de Afrodita que se adora en Corinto. Su templo se encuentra en la cima del Akrokorinth, la gran estructura rocosa que se cierne sobre la ciudad. Representa el contacto físico íntimo, sexual y marcial. El templo es famoso por su práctica de prostitución. Aunque es una visión más peculiar de la diosa, en la Ilíada, Afrodita entró ella misma en la batalla, salvando a Eneas de la muerte. Los espartanos adoran una versión similar de la diosa, Afrodita Areia.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_bellerophon:0 "$omen_bellerophon$"
 omen_bellerophon:0 "Belerofonte"
 omen_bellerophon_desc:0 "Belerofonte, hijo de Poseidón y la mortal Eurínome, fue uno de los mayores héroes y asesino de monstruos, antes de la época de Heracles. Entre sus hazañas se encuentran la matanza de la Quimera que escupe fuego y la domesticación del legendario caballo Pegaso. Su arrogancia se apoderó de él, y mientras intentaba volar al Monte Olimpo en Pegaso, Zeus provocó que un tábano picara a Belerofonte, lo que le hizo caer al suelo y morir. Belerofonte es el héroe más estimado de Corinto, y su adoración es especialmente popular allí.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
