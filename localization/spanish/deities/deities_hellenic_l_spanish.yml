l_spanish:
 ## Rome ##
 omen_mars_desc_ROM:5 "El dios patrón de Roma inspirará y bendecirá a nuestros hombres con la fuerza para enfrentarse a cualquier enemigo, mientras nuestro pueblo permanezca fiel. Con Marte a nuestro lado, nuestros soldados seguramente lucharán más duro que nunca. Después de todo, ¿quién querría actuar de manera vergonzosa delante de un dios?\n\nMarte ha sido el dios patrón de Roma desde tiempos inmemoriales. Desde el Campo de Marte y los numerosos santuarios y templos dedicados en honor del dios, hasta las historias de sus hijos Remo y Rómulo, quienes fundaron la ciudad; Marte es uno de los dioses más importantes de nuestro panteón.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$\""

 ## Cappadocia ##
 deity_ma:0 "$omen_ma$"
 omen_ma:1 "Ma"
 omen_ma_desc:3 "El invencible Ma bendecirá a nuestros soldados con la disciplina de los titanes, asegurándose de que nuestros soldados no huirán de la batalla. Con Ma a nuestro lado, no es posible que perdamos ninguna guerra.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 ## Locri ## 
 deity_persephone:0 "$omen_persephone$"
 omen_persephone:1 "Perséfone"
 omen_persephone_desc:2 "$persephone_description$\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 persephone_description:0 "Perséfone se convirtió en la reina del Inframundo luego de ser raptada por Hades cuando este quedó cautivado por su belleza. Su madre la buscó durante años, antes de suplicarle a Zeus que regresara a su hija del reino de los muertos. Al final, lograron llegar a un acuerdo de dejarla salir en partes del año, lo que llevó a la creación de las estaciones.\n\nPerséfone aparece en muchas historias y suele ponerse del lado de los héroes que entran al Inframundo buscando algo del señor de los muertos. En algunas partes del mundo helénico también se le conoce como Kore, la doncella. Se le suele celebrar junto con su madre Deméter."

 ## Boeotia ##
 deity_eros:0 "$omen_eros$"
 omen_eros:1 "Eros"
 omen_eros_desc:2 "$eros_description$\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 eros_description:0 "Es un dios menor del amor. Se encuentra por debajo de su madre Afrodita, quien es la diosa del amor más conocida en el mundo helénico. En la mayoría de historias se le describe como un joven o un artista que hace que las personas se enamoren.\n\nEros suele asociarse con relaciones ilícitas y hay quienes afirman que el mismo dios es fruto de una de estas entre Afrodita y su amante Ares."

 ### Hellenistic Omens (Pontus) ###
 deity_zeus_stratios:0 "$omen_zeus_stratios$"
 omen_zeus_stratios:0 "Zeus Estratio"
 omen_zeus_stratios_desc:1 "$zeus_description$\n\nEntre los pónticos se le conoce como Zeus Stratios, una especie de mezcla sincrética helenística entre el Zeus helénico y el zoroástrico Ahura Mazda.\n\n#! Efecto apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 ### Serapis Cult (Egypt) ###
 deity_serapis:0 "$omen_serapis$"
 omen_serapis:1 "Serapis"
 omen_serapis_desc:4 "El culto a Serapis es el punto de encuentro entre los cultos egipcio y helénico. El nombre Serapis proviene de \"Osorapis\", bajo el cual los griegos egipcios conocían al Osiris-Apis local. Serapis debe reunir tantas funciones divinas (tanto egipcias como griegas) como sea posible: hereda el poder de legitimar al faraón de Apis y Osiris en el lado egipcio, pero también muestra rasgos griegos que lo asemejan a Zeus Soter, el dios de la fertilidad Dioniso, el dios curativo Asklepios y, en particular, el dios del inframundo. Hades/Plouton.\n\n\n\nEl culto a Serapis garantiza el éxito y la buena fortuna al faraón Basileus y al país, pero también es una deidad oracular con matices de Misterios, que concede fertilidad a la tierra.\n\nComo marido de Isis y cuidador del más allá, Se dice que las almas de los muertos son llevadas a Serapis por el psicopompo greco-egipcio Hermanubis, donde enfrentarán el juicio.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_zeus_amun:0 "$omen_zeus_amun$"
 omen_zeus_amun:2 "Zeus Amón"
 omen_zeus_amun_desc:5 "El culto a Zeus Amón se hizo popular después de que Alejandro acudió al oráculo de Amón en lo profundo del desierto egipcio, en busca de orientación y ayuda después de la campaña por Anatolia y Siria. Amón era originalmente un dios del antiguo Egipto adorado principalmente en Tebas; en Cirene, fue identificado por primera vez con Zeus y llamado Amón (en griego, la palabra arena). Desde entonces, se han construido santuarios más pequeños en todo el mundo griego.\n\nSe le considera el Rey del Cielo y la mayoría de las demás deidades se inclinan ante su voluntad. Como Zeus, es conocido por sus actividades promiscuas y las numerosas leyendas y mitos que surgieron en torno a los héroes que nacieron de estas actividades equivocadas.\n\n#! Efecto apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_harpocrates:0 "$omen_harpocrates$"
 omen_harpocrates:2 "Harpócrates"
 omen_harpocrates_desc:4 "Harpokrates es hijo de Serapis e Isis, tomando elementos de la deidad egipcia Horus el Niño. Es el dios patrón del silencio, los secretos y la esperanza, y simboliza la victoria del sol sobre la oscuridad de la noche.\n\nLos griegos han integrado casi por completo a Harpócrates en su panteón como dios de los secretos, mientras que los egipcios miran más a su herencia como el Horus Joven. Para ambas partes desempeña el papel de portador de esperanza para sus seguidores.\n\n#! Efecto apoteósico: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_hermanubis:0 "$omen_hermanubis$"
 omen_hermanubis:3 "Hermanubis"
 omen_hermanubis_desc:5 "Como el gran psicopompo del mundo greco-egipcio, Hermanubis hereda elementos del dios embaucador griego Hermes, así como del chacal egipcio Anubis. Aunque originalmente las dos deidades tenían tareas bastante diferentes, ambas desempeñaban un papel como guías de almas, llevando las almas de los enfermos a la otra vida. A los greco-egipcios les muestra el camino hacia el inframundo controlado por Serapis.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"

