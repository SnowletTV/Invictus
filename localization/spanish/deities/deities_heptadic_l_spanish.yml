l_spanish:
  ## Default ##
 deity_targitaos:0 "$omen_targitaos$"
 omen_targitaos:1 "Targitao"
 omen_targitaos_desc:3 "Targitaos es el progenitor de todas nuestras tribus y un antepasado al que todavía reverenciamos. Además de su papel como antepasado de nuestro pueblo, también desempeña un papel como patrón de los cielos y en parte como deidad de la fertilidad.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_goitosyrus:0 "$omen_goitosyrus$"
 omen_goitosyrus:1 "Goitosyrus"
 omen_goitosyrus_desc:3 "Le pediremos al dios perspicacia y conocimiento sobre asuntos desconocidos. Al recibir el don de la sabiduría, esperamos que nuestros eruditos y escribas puedan llevar a nuestra nación a una mayor prosperidad y fortaleza.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_papaios:0 "$omen_papaios$"
 omen_papaios:1 "Papaios"
 omen_papaios_desc:3 "Los grandes Papaios traerán a nuestro pueblo la riqueza y los recursos que necesitamos. Esta nueva afluencia de riqueza traerá felicidad y fortuna a nuestra gente.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_thagimasadas:0 "$omen_thagimasadas$"
 omen_thagimasadas:1 "Thagimasadas"
 omen_thagimasadas_desc:3 "Los Thagimasadas reales aprobarán nuestra expansión a tierras extranjeras. Con este dios a nuestro lado, nuestro pueblo seguramente tomará sus armas y estará listo para la guerra una vez más, porque ¿quién puede negar la sabiduría de los dioses?\n\n#! Efecto de apoteosis: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_api:0 "$omen_api$"
 omen_api:1 "Api"
 omen_api_desc:3 "Api bendecirá a nuestros comerciantes con abundantes recursos para el comercio. Los nuevos bienes comerciales, nacionales y extranjeros, seguramente enriquecerán a nuestros mecánicos en todos sus esfuerzos.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
 deity_tabiti:0 "$omen_tabiti$"
 omen_tabiti:1 "Tabiti"
 omen_tabiti_desc:3 "Suplicaremos con nuestro culto a la reina de los dioses, pidiendo bendiciones de paz y prosperidad para nuestro pueblo. Con Tabiti a nuestro lado, nuestras tierras quedarán pacificadas y tranquilas, permitiéndonos centrar nuestros esfuerzos y recursos hacia el exterior.\n\n#! Efecto Apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_argimpasa:0 "$omen_argimpasa$"
 omen_argimpasa:1 "Argimpasa"
 omen_argimpasa_desc:3 "La gran diosa de los cielos bendecirá nuestras cosechas y a nuestra gente con vida y crecimiento. A medida que recibamos el regalo de la vida, nuestras cosechas florecerán y nuestras crías seguramente crecerán fuertes y saludables.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"
