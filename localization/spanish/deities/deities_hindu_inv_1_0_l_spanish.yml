l_spanish:

 deity_yama:0 "$omen_yama$"
 omen_yama:0 "Yama"
 omen_yama_desc:0 "En las tierras del sur, el reino donde preside y reina la muerte despiadada, el sombrío señor Yama, dios de los muertos, tiene su corte. Porque es él quien fue el primero en saborear las amargas cenizas de la mortalidad, y debido a que fue el primero en atravesar el velo que separa los mundos, a él le han sido dados los poderes infernales. Muy por debajo de la tierra, el dios Yama, Señor de los Pitrs, espera pacientemente su momento, esperando las almas que no pueden escapar de su inevitable alcance.\n\n#! Efecto apoteósico: $military_apotheosis_capital_freemen_effect_tt_description$"

 deity_brhaspati:0 "$omen_brhaspati$"
 omen_brhaspati:0 "Brhaspati"
 omen_brhaspati_desc:0 "En la oscuridad primordial, brilló una Gran Luz. Mientras las sombras del caos fueron atravesadas por su brillo celestial, Brhaspati, el Señor de la Sagrada Palabra que se reclina en un asiento triple, nació en medio de su brillo divino y disipó todo lo que tenía ante él solo con su aliento. Guerrero y sabio, Brhaspati está estrechamente vinculado al fuego, un recordatorio físico de sus poderes devoradores.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_rudra:0 "$omen_rudra$"
 omen_rudra:0 "Rudra"
 omen_rudra_desc:0 "Rudra es la suave brisa que susurra a través del campo de trigo, pero también es el viento aullante, el gemido penetrante y el chillido del ciclón. Rudra, una poderosa deidad de las tormentas, también es un dios de la caza, que impulsa tanto al hombre como a los animales a buscar refugio de las tempestades que él ordena.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_varuna:0 "$omen_varuna$"
 omen_varuna:0 "Varuna"
 omen_varuna_desc:0 "Cuando sólo existía el cielo, existía Varuna, y donde los cielos se extienden para tocar el océano infinito, allí también lo encontrarás a él, la Autoridad Divina, porque él da forma al agua y al viento tan fácilmente como uno respira. Occidente está protegido por su amplio dominio, y el mundo se deja llevar por su moralidad recta y firme.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_mitra:0 "$omen_mitra$"
 omen_mitra:0 "Mitra"
 omen_mitra_desc:0 "Mitra, el señor de los cielos de la mañana, el amanecer, la primera luz; es él quien manda el orden del mundo. Aunque es un Ashura, debe ser tratado como un Deva, ya que es el guardián de los contratos, el hacedor de amistades y la pareja de Varuna.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_chandra:0 "$omen_chandra$"
 omen_chandra:0 "Chandra"
 omen_chandra_desc:0 "Cuando Surya, dios del Sol, se retira a su morada nocturna, el resplandeciente dios de la luna Chandra asciende a su reino, con su carro de loto de tres ruedas tirado por corceles de un blanco cegador. Las plantas y los árboles también levantan el rostro para saludar a Chandra, porque él es su Señor, y su luminosa belleza es una bendición para quienes sienten su suave toque.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"

 deity_shani:0 "$omen_shani$"
 omen_shani:0 "Shani"
 omen_shani_desc:0 "Un cuervo vuela a través de la vasta extensión del Universo, y sobre su espalda está Shani, quien conoce las mentes de los hombres y les imparte justicia divina basándose en la pureza de sus corazones. Amado por el pueblo, el poder y el dominio de Shani tocan todo y nada; tristeza, los estragos de la vejez, agudeza mental, sentido de propósito: el dios Shani lo controla todo.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_asvins:0 "$omen_asvins$"
 omen_asvins:0 "Asvins"
 omen_asvins_desc:0 "Los Asvins, hijos gemelos del divino Sol, consagrados en la eterna juventud y guiándonos hacia la salud y la prosperidad, continúan bendiciendo a quienes los invocan, los Jinetes no devastados por el Tiempo. Abarcando la paradoja de la realidad dentro de su unidad separada, conducen a los fieles hacia campos de dicha sanguínea.\n\n#! Efecto apoteósico: $culture_apotheosis_rel_tech_effect_tt_description$"

 ###NEW
 deity_pattini:0 "$omen_pattini$"
 omen_pattini:0 "Pattini"
 omen_pattini_desc:0 "Guardiana de la isla de Sri Lanka, la diosa Pattini protege a sus seguidores y los bendice con niños, protegiendo a sus devotos de los estragos de la enfermedad mientras vierte ríos de curación sobre sus cabezas inclinadas. Sus rituales son observados anualmente por los fieles, quienes sin duda quieren asegurarse los regalos de una diosa tan poderosa y majestuosa.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_isakki:0 "$omen_isakki$"
 omen_isakki:0 "Isakki"
 omen_isakki_desc:0 "Hay dioses poderosos y distantes que residen en templos celestiales lejos de los hogares del hombre, preocupados por asuntos que se acercan al infinito y son incomprensibles para las mentes mortales; Isakki es una diosa de la casa, que evita los salones sagrados en favor de los humildes hogares de las aldeas. Debido a que está tan cerca de casa, vigilando atentamente los hechos de la familia, la gente común la venera y la ama mucho.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_bhadrakali:0 "$omen_bhadrakali$"
 omen_bhadrakali:0 "Bhadrakali"
 omen_bhadrakali_desc:0 "La diosa protectora Bhadrakali, de múltiples miembros y ojos, capta y ve todo, llamas sagradas brotan de su rostro y consumen todo lo que es lo suficientemente tonto como para desafiarla. Una maestra de las armas, sin duda debido a sus brazos y manos aparentemente interminables, Bhadrakali es una inspiración para los guerreros que desean emular su destreza en la batalla.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"

 deity_iravan:0 "$omen_iravan$"
 omen_iravan:0 "Iravan"
 omen_iravan_desc:0 "El dios Iravan, el obediente hijo del héroe Arjuna, bendecido por Krishna con los tres dones, es reverenciado por muchos que buscan emular su ejemplo sagrado, uno que brilla a través de los siglos como un ejemplo de piedad celestial; al sacrificarse ritualmente a la diosa Kali, innumerables personas se salvaron, un regalo que resuena por toda la eternidad hasta el día de hoy.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"

 deity_meenakshi:0 "$omen_meenakshi$"
 omen_meenakshi:0 "Meenakshi"
 omen_meenakshi_desc:0 "Consorte divina de Sundareswarar que instruye y protege a su amado, Meenakshi también es adorada como la Bella de Ojos de Pez, un apodo que refleja su primera encarnación como diosa de los pescaderos que buscaba las bendiciones de su mirada incesante.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"

 deity_ankalamma:0 "$omen_ankalamma$"
 omen_ankalamma:0 "Ankalamma"
 omen_ankalamma_desc:0 "Entre los nombres de las Siete Madres se encuentra el de Ankalamma, una diosa que guarda y protege a sus devotos tan apasionadamente como cualquier madre lo haría con su propio hijo, con un poder omnicomprensivo informado por el amor maternal, lo que la hace invencible.\n\n#! Efecto apoteósico: $culture_apotheosis_civic_tech_effect_tt_description$"

 deity_mariamman:0 "$omen_mariamman$"
 omen_mariamman:0 "Mariamman"
 omen_mariamman_desc:0 "En el verano, cuando los terrenos están agrietados y secos por el calor abrasador que mina la voluntad misma de vivir de los hombres, muchos desean las bendiciones de Mariamman, diosa de la Lluvia, cuyo toque y beso por sí solos son lo suficientemente poderosos para curar todo tipo de enfermedades horrendas. La continua observancia de sus rituales asegura que las pesadas nubes de tormenta continúen cayendo sobre nuestras granjas y arboledas.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_periyachi:0 "$omen_periyachi$"
 omen_periyachi:0 "Periyachi"
 omen_periyachi_desc:0 "Periyachi, Madre, diosa misericordiosa cuya mano cuidadosa guía a través del traicionero paso del parto antes de dispersar a los demonios hambrientos que rodean a los jóvenes; gentil y cariñosa con los niños, y aún así es el enemigo más feroz y odioso para cualquiera que pueda dañarlos.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_devasena:0 "$omen_devasena$"
 omen_devasena:0 "Devasena"
 omen_devasena_desc:0 "Tan grande y poderoso es el dios Kartikeya que incluso su divina consorte, la diosa Devasena, es adorada como una deidad menor por los fieles que buscan su bendición.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_korravai:0 "$omen_korravai$"
 omen_korravai:0 "Korravai"
 omen_korravai_desc:0 "Aquellos que buscan triunfar en la batalla harían bien en adorar a Korravai, la diosa que controla la Victoria en una mano y ata la Guerra en la otra; nadie puede reclamar cualquiera de los dos sin su bendición explícita. Antigua e incognoscible, ella trae vida a la tierra en barbecho, pero observa sin piedad cómo los cuerpos de los soldados caídos se reúnen en los campos de batalla.\n\n#! Efecto apoteósico: $military_apotheosis_military_experience_effect_tt_description$"

 deity_kartikeya:0 "$omen_kartikeya$"
 omen_kartikeya:0 "Kartikeya"
 omen_kartikeya_desc:0 "Kartikeya, uno de los dioses más antiguos de una tierra antigua, es un dios de la guerra que comanda legiones victoriosas y las lleva a alturas imprevistas con su sabiduría divina. Historias y leyendas se adhieren a él como el rocío de la mañana; un asesino de demonios de seis cabezas, el Portador de los Ciento Ocho Nombres - nadie puede enfrentarse a él.\n\nMurugan es el dios principal del pueblo #E Tamil#!, y también era conocido por otros como #E Kartikeya#!. Eventualmente se volvieron uno y lo mismo a través del sincretismo.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_murugan:0 "$omen_murugan$"
 omen_murugan:0 "Murugan"
 omen_murugan_desc:0 "Murugan, uno de los dioses más antiguos de una tierra antigua, es un dios de la guerra que comanda legiones victoriosas y las lleva a alturas imprevistas con su sabiduría divina. Historias y leyendas se adhieren a él como el rocío de la mañana; un asesino de demonios de seis cabezas, el Portador de los Ciento Ocho Nombres - nadie puede enfrentarse a él.\n\nMurugan es el dios principal del pueblo #E Tamil#!, y también era conocido por otros como #E Kartikeya#!. Eventualmente se volvieron uno y lo mismo a través del sincretismo.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_karuppu_sami:0 "$omen_karuppu_sami$"
 omen_karuppu_sami:0 "Karuppu Sami"
 omen_karuppu_sami_desc:0 "Hay ocasiones en las que un héroe local trasciende sus orígenes humildes, está a la altura del momento y libera a su pueblo de problemas y aflicciones, y luego es adorado como manifestaciones de los dioses después de su fallecimiento; La leyenda popular Karuppu Sami es una de estas figuras heroicas, muy querida por los tamiles del sur.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_pavadairayan:0 "$omen_pavadairayan$"
 omen_pavadairayan:0 "Pavadairayan"
 omen_pavadairayan_desc:0 "Hijo de la feroz diosa Ankalamma, el héroe popular Lord Pavadairayan se reclina junto a la rodilla derecha de su madre, con el brazo de la espada siempre listo; cuando se trata de proteger su divina majestad, no hay ninguno que sea capaz de resistir el derramamiento de su piedad filial.\n\n#! Efecto Apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_agni:0 "$omen_agni$"
 omen_agni:0 "Agni"
 omen_agni_desc:0 "Es él quien trae luz y vida a toda la creación. Porque él es Agni, la fuerza ardiente que enciende las llamas del sol y las estrellas. Aquel cuya calidez brinda consuelo y protección a todos los que la buscan. Es Agni quien conecta la tierra de lo divino con la tierra de los mortales. Su poder radiante ilumina el amanecer de cada nuevo día, y su fuerza y pureza guían al mundo hacia el camino de la rectitud.\n\n#! Efecto Apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_raja_porus:0 "$omen_raja_porus$"
 omen_raja_porus:0 "Raja Porus"
 omen_raja_porus_desc:0 "El legendario Raja Porus nos bendice. El Rey que se enfrentó valientemente al gran conquistador Iksander, e incluso en la derrota, se mantuvo firme. Iksander, el gobernante de todo el oeste, que había derrotado a innumerables reyes y monstruos por igual, se había ganado el respeto por el rey Porus y lo trataba como a un rey merecedor. Y así, el legendario Raja Porus gobernó su propio dominio como rey igual al propio Iksander el Grande. El traidor Eudemo mancha su honor al asesinar al gran rey con métodos cobardes. Sin embargo, el legado de Raja Porus permanece con nosotros y nuestra adoración hacia él."
 deity_durga:0 "$omen_durga$"
 omen_durga:0 "Durga"
 omen_durga_desc: "Durga el invencible, el impasible. Es la diosa de la protección, la fuerza, la maternidad y la destrucción. Ella combatirá los males de este mundo y usará su ira divina para castigar a los malvados.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"

 deity_bangaramma:0 "$omen_bangaramma$"
 omen_bangaramma:0 "Bangaramma"
 omen_bangaramma_desc:0 "La diosa Bangaramma, la propia diosa dorada. Ella regala dulces a los jóvenes y proporciona riqueza a los mayores. La dorada es la más apacible de las 7 diosas hermanas.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"

 deity_mathamma:0 "$omen_mathamma$"
 omen_mathamma:0 "Mathamma"
 omen_mathamma_desc:0 "Mathamma, una diosa de la comunidad. Todas las castas la temen, pero es más venerada por los más pobres entre los pobres, por lo que sus templos y ofrendas son bastante pequeños en comparación con las otras diosas.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_renuka:0 "$omen_renuka$"
 omen_renuka:0 "Renuka"
 omen_renuka_desc:0 "Renuka es la madre del universo. Su maternidad divina le dio muchos hijos poderosos, incluido el poderoso dios Rama. Que la madre universal nos bendiga a todos.\n\n#! Efecto Apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"

 deity_dili_polasi:0 "$omen_dili_polasi$"
 omen_dili_polasi:0 "Dili Polasi"
 omen_dili_polasi_desc:0 "Dili Polasi, la diosa del hogar. Ella nos ayudará en las pequeñas tareas del día a día. Ella es una de las siete diosas hermanas, y se ocupa específicamente de las necesidades de los acontecimientos mortales cotidianos.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"

 deity_poleramma:0 "$omen_poleramma$"
 omen_poleramma:0 "Poleramma"
 omen_poleramma_desc:0 "Poleramma, la consorte de Shiva. Diosa de la peste y de la viruela, venerémosla para que no queramos sufrir los múltiples males que tiene a su disposición.\n\n#! Efecto Apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"

#Mitanni
 deity_ruta:0 "$omen_ruta$"
 omen_ruta:0 "Ruta"
 omen_ruta_desc:0 "Ruta es la variante #Y Mitanni#! del dios védico Rudra. Ruta es, pues, un dios de la caza y de los vientos. Que el pueblo Neo-Mitanni sea bendecido con los animales divinos de Ruta para cosechar y cazar.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_svar:0 "$omen_svar$"
 omen_svar:0 "Svar"
 omen_svar_desc:0 "Svar, el dios del sol. Que el sol salga por su orden cada mañana y se ponga cada noche, manteniendo el equilibrio en el universo. Svar influyó en la palabra persa para sol y permanece en las lenguas indo-arias como una antigua palabra para dios. #Y Este dios es exclusivo de Mitanni#!.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_vayu:0 "$omen_vayu$"
 omen_vayu:0 "Vayu"
 omen_vayu_desc:0 "Vayu, el dios de los vientos. Está estrechamente asociado con Indra y a veces se le llama el \"aliento vital del mundo\". Se dice que siempre que Vishnu reencarna, Vayu también lo hace para acompañarlo y ayudarlo.\n\nVayu era uno de los dioses principales de los #Y Mittani#!, mostrando sus raíces védicas e índicas.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_nasatyanna:0 "$omen_nasatyanna$"
 omen_nasatyanna:0 "Nasatyanna"
 omen_nasatyanna_desc:0 "Los Nasatyanna, los dioses gemelos salvadores. Que tanto Nasatya como Dasra nos bendigan con armas para viajar seguros a nuestros hogares. Que nos salven de la muerte en nuestros tiempos más difíciles. #Y Este dios es exclusivo de Mitanni#!.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
