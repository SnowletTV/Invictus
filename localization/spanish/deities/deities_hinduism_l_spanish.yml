l_spanish:
  ## Generic ##
 deity_shiva:0 "$omen_shiva$"
 omen_shiva:1 "Shiva"
 omen_shiva_desc:3 "Ofreceremos nuestras oraciones a Shiva con la esperanza de que guíe a nuestros hombres en la batalla y fortalezca su moral. Con la disciplina y la determinación de nuestros soldados reforzadas, estamos seguros de que lograremos muchas victorias en los próximos años.\n\n#! Efecto apoteósico: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_prajapati:0 "$omen_prajapati$"
 omen_prajapati:1 "Prajapati"
 omen_prajapati_desc:3 "Esperamos que Prajapati inspire y cuide a nuestros jóvenes mientras se preparan para dar sus vidas por nuestro pueblo. Con nuestro ejército reforzado por tantos nuevos reclutas, es poco probable que veamos algún problema por falta de mano de obra en el corto plazo.\n\n#! Efecto apoteósico: $military_apotheosis_manpower_effect_tt_description$"
 deity_saraswati:0 "$omen_saraswati$"
 omen_saraswati:1 "Saraswati"
 omen_saraswati_desc:3 "Nuestros académicos, académicos y artistas tienen mucho que aprender de Saraswati. Esperamos que mire a nuestra gente con favor y nos regale sus conocimientos. Con este regalo, nos aseguraremos de difundir nuevas maravillas tecnológicas en nuestra sociedad, para que toda nuestra gente se beneficie.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_kubera:0 "$omen_kubera$"
 omen_kubera:1 "Kubera"
 omen_kubera_desc:3 "Le pedimos ayuda a Kubera para reunir la mayor riqueza posible para nuestra nación. Después de todo, ¿qué otro dios podría ayudarnos en tal esfuerzo?\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_brahma:0 "$omen_brahma$"
 omen_brahma:1 "Brahma"
 omen_brahma_desc:3 "Las verdades universales de Brahma guían a nuestro pueblo a medida que se expanden por las tierras. Con Brahma a nuestro lado, nuestros adversarios seguramente cederán ante su oposición, permitiendo que nuestros hombres se preparen para la guerra una vez más.\n\n#! Efecto apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_samudra:0 "$omen_samudra$"
 omen_samudra:1 "Samudra"
 omen_samudra_desc:3 "Recurrimos a la gran deidad en busca de ayuda para proteger a nuestros comerciantes y comerciantes mientras navegan a través de océanos distantes en busca de riqueza. Con estas nuevas riquezas, seguramente construirán la red comercial necesaria para aumentar sustancialmente nuestra riqueza.\n\n#! Efecto apoteósico: $naval_apotheosis_effect_tt_description$"
 deity_vishnu:0 "$omen_vishnu$"
 omen_vishnu:1 "Vishnu"
 omen_vishnu_desc:3 "Se ofrecerán oraciones a Vishnu sabiendo que él cuidará de nuestro pueblo, guiará a los que están perdidos y protegerá a los que estén en tiempos de dificultad y necesidad. Con su ayuda, nuestra sociedad seguramente será más segura y leal que nunca, lo que nos permitirá concentrar algunos de nuestros recursos en enemigos externos en lugar de hacerlo en el interior.\n\n#! Efecto apoteósico: $military_apotheosis_defensive_effect_tt_description$"
 deity_indra:0 "$omen_indra$"
 omen_indra:1 "Indra"
 omen_indra_desc:3 "Recurrimos a Indra en busca de la lluvia y el agua necesarias para dar vida a nuestras cosechas. A medida que nuestros cultivos crecen de manera más segura y robusta que nunca, nuestra gente seguramente también prosperará.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
 deity_soma:0 "$omen_soma$"
 omen_soma:0 "Soma"
 omen_soma_desc:1 "El hermoso y brillante preside el cielo nocturno y traerá salud y felicidad a nuestra gente incluso mientras duerme.\nEl antiguo templo de Prabhasa marca el lugar donde el dios lunar se bañó para recuperar su brillo después de una maldición, creando los ciclos de la luna.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_kanya_devi:0 "$omen_kanya_devi$"
 omen_kanya_devi:0 "Kanya Devi"
 omen_kanya_devi_desc:1 "La diosa adolescente de la penitencia y la virginidad templará las pasiones de nuestro pueblo y los conducirá a la divinidad de la renuncia y la calma.\nKanya Devi es una encarnación de la diosa Parvati y ha sido adorada en el extremo sur del subcontinente indio desde los primeros tiempos.\n\n#! Efecto apoteósico: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_samba:0 "$omen_samba$"
 omen_samba:0 "Samba"
 omen_samba_desc:1 "El travieso hijo de Krishna, concedido a cambio de penitencia, es un recordatorio de los peligros del despilfarro y la pasión, que provocaron la destrucción de la dinastía Yavada y la herida de su padre.\nSamba construyó el gran templo del sol de Mulasthanapura, donde adoró durante doce años para redimir su maldición de la lepra.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_krishna:0 "$omen_krishna$"
 omen_krishna:0 "Krishna"
 omen_krishna_desc:1 "El avatar oscuro de Vishnu bendecirá a nuestra gente, le brindará amor y compasión y los guiará por el camino hacia la santidad.\nKrishna es una de las principales deidades hindúes y nombró el sitio sagrado indio de Dvaraka.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_vishwanath:0 "$omen_vishwanath$"
 omen_vishwanath:0 "Vishweshwara"
 omen_vishwanath_desc:1 "El señor del universo velará por nuestra gente y los librará de los males del mundo.\nEl templo de Vishweshwara, una de las formas de Shiva, se encuentra en el Ganges y se encuentra entre los lugares más sagrados del hinduismo.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_rama:0 "$omen_rama$"
 omen_rama:0 "Rama"
 omen_rama_desc:1 "El héroe Ramachandra, avatar de Vishnu, inspirará a nuestro pueblo con las historias épicas de sus hazañas y actos morales.\nEl Ramayana habla de su construcción del puente a la isla Lanka para rescatar a su esposa Sita del demonio Ravana.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_lakshmi:0 "$omen_lakshmi$"
 omen_lakshmi:0 "Lakshmi"
 omen_lakshmi_desc:1 "La diosa de las metas guiará a nuestro pueblo hacia el conocimiento divino, la riqueza en todas las cosas y la paciencia necesaria para alcanzarlas.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_bhrigu:0 "$omen_bhrigu$"
 omen_bhrigu:0 "Bhrigu"
 omen_bhrigu_desc:1 "El gran sabio, engendrado por Brahma, es uno de los más sabios que jamás haya existido, y su aprendizaje ha traído un gran progreso a toda la India.\nLa importancia del sabio Bhrigu eclipsó incluso a Lakshmi, reemplazándola como el principal objeto de las peregrinaciones a Barygaza.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
