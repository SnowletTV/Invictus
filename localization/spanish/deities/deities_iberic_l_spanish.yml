l_spanish:
 ## Default ##
 deity_semnocosus:0 "$omen_semnocosus$"
 omen_semnocosus:1 "Semnocosus"
 omen_semnocosus_desc:4 "Semnocosus es un dios de la guerra íbero adorado por muchas de las tribus de la zona. Es particularmente popular entre los soldados y guerreros, quienes ocasionalmente sacrifican prisioneros y esclavos en su honor.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_candamius:0 "$omen_candamius$"
 omen_candamius:1 "Candamius"
 omen_candamius_desc:4 "Candamius es un dios del cielo local entre las tribus íberas y una de sus deidades principales. Entre los romanos a menudo se le asocia o combina con su propio dios del cielo, Júpiter, y en algunos casos incluso se utiliza como epíteto para crear el sincrético Júpiter Candamius.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_endouellicus:0 "$omen_endouellicus$"
 omen_endouellicus:1 "Endouellicus"
 omen_endouellicus_desc:4 "$endouellicus_description$\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 endouellicus_description:0 "El dios es conocido como una deidad de la tierra que tiene visiones proféticas del futuro que en ocasiones comparte con sus muchos seguidores. Además, muchos piden su bendición cuando esperan tener mejor salud, una cosecha abundante o una mejor vida después de la muerte con sus seres queridos.\n\nLa deidad es asociada en ocasiones con el dios greco-egipcio Serapis o el romano Asclepio."
 deity_dercetius:0 "$omen_dercetius$"
 omen_dercetius:1 "Dercetius"
 omen_dercetius_desc:4 "Dercecio es un dios de la montaña adorado por algunas de las tribus de Iberia, particularmente las de Gallaecia y Lusitania. A menudo se le asocia con minerales ricos y la riqueza que uno puede encontrar en la tierra.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_eacus:0 "$omen_eacus$"
 omen_eacus:1 "Eacus"
 omen_eacus_desc:4 "Eacus es un dios del tiempo entre las muchas tribus de Iberia, invocado por la lluvia y la abundancia. A menudo se le asocia con los dioses del tiempo de otras religiones, ya sea Júpiter, Zeus o Ba'al.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_ataecina:0 "$omen_ataecina$"
 omen_ataecina:1 "Ataecina"
 omen_ataecina_desc:4 "Ataecina es considerada la diosa del inframundo por los pueblos de Iberia y está estrechamente relacionada con las estaciones. A menudo se la invoca cuando se acerca la primavera, ya que las tribus creen que ella es quien aporta vitalidad al comienzo de cada año. Entre los griegos se la conoce como Perséfone, su propia diosa de las estaciones y del inframundo.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"
 deity_duillae:0 "$omen_duillae$"
 omen_duillae:1 "Las Duillae"
 omen_duillae_desc:4 "Estas deidades son varias diosas madres veneradas juntas por el pueblo de Iberia. Las diosas están asociadas con la fertilidad, las hojas y la vegetación y, a menudo, se las representa como varias mujeres sentadas juntas. A veces se les asocia con las diosas madres de la Galia y Germania.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_cariocecus:0 "$omen_cariocecus$"
 omen_cariocecus:0 "Cariocecus"
 omen_cariocecus_desc:0 "Cariocecus es un dios de la guerra adorado por muchas de las tribus ibéricas. Se le asocia con sacrificios humanos y animales, y se dice que sus sacerdotes pueden hacer predicciones basadas en la forma en que los intestinos caen del cuerpo.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_betatun:0 "$omen_betatun$"
 omen_betatun:0 "Betatun"
 omen_betatun_desc:0 "Betatun es una de las muchas diosas del pueblo íbero, venerada en toda la península. Ella es una deidad curativa con sus propios oráculos, que supuestamente puede ver el futuro de sus adoradores y es popular incluso fuera de sus tierras nativas.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
