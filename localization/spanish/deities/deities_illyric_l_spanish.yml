l_spanish:
 #Illyrians
 deity_deipatros:0 "$omen_deipatros$"
 omen_deipatros:1 "Deipaturos"
 omen_deipatros_desc:3 "$omen_zeus_desc$\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_tadenus:0 "$omen_tadenus$"
 omen_tadenus:1 "Tadenus"
 omen_tadenus_desc:3 "$omen_helios_desc$\n\n#Y Tadenus#!: El extendido culto ilirio al dios de la luz y el sol a menudo implicaba un pequeño disco en la parte superior de un largo poste que representaba la presencia del dios. Tadeno, como lo llamaban algunos ilirios, a menudo era representado con (o por los liburnios y sus vecinos solo estilizado como) un barco solar o un carro tirado por caballos como en el mito griego del carro de Faetón, pero también se le asociaba a menudo con aves acuáticas y caballos.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"

 omen_evileye:0 "Ojo Maligno"
 omen_evileye_desc:3 "Los antiguos ilirios creían en el 'Ojo Maligno'. Si sufrías de una maldición o simplemente mala suerte, se debían hacer sacrificios para ganar el favor de los dioses y espíritus que luego removerían los efectos del 'Ojo Maligno'."

 deity_anzotica:0 "$omen_anzotica$"
 omen_anzotica:1 "Anzotica"
 omen_anzotica_desc:3 "$omen_aphrodite_desc$\n\n#Y Anzotica#!: Era la diosa iliria del amor, la belleza y la procreación y era retratada como una mujer atractiva acompañada a menudo de palomas, cisnes o gansos; al igual que su afín griega Afrodita o la Venus romana. Especialmente los liburnios la veneraban con mucho fervor.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"

 deity_vidasus:0 "$omen_vidasus$"
 omen_vidasus:1 "Vidasus"
 omen_vidasus_desc:3 "A Vidasus se le invocaba a menudo antes de las cosechas y se le reverenciaba junto con Thana; Algunos de sus santuarios en el norte de Iliria estaban ubicados cerca de fuentes termales para invocar sus poderes curativos combinados. La contraparte romana fue Liber en el sur de Iliria o Silvanus, aunque su representación como sátiro en Dalmacia y Panonia era más parecida al Pan romano que a Silvanus.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$\n $harsh_deadly_apotheosis_effect_tt_description$"

 deity_armatus:0 "$omen_armatus$"
 omen_armatus:1 "Armatus"
 omen_armatus_desc:3 "$omen_mars_desc$\n\n#Y Armatus#!: Los ilirios tenían muchos dioses de la guerra de los cuales solo han sobrevivido unos pocos nombres, como el Armatus de los delmatas. Debido a la influencia tracia, esos dioses a menudo eran representados como jinetes al galope con una capa corta ondeando detrás y portando una lanza. Más tarde, durante el Imperio Romano, el Meudauro tracio se volvió dominante.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_bindus:0 "$omen_bindus$"
 omen_bindus:1 "Bindus"
 omen_bindus_desc:3 "$omen_neptune_desc$\n\n#Y Bindus#!: Bindus era el protector de los marineros y dios de todos los cuerpos de agua. Los comerciantes oraban por su favor para garantizar un paso seguro, particularmente los Iapodes enfatizaban su adoración.\n\n#! Efecto apoteósico: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"

 deity_dracondracaena:0 "$omen_dracondracaena$"
 omen_dracondracaena:1 "Dracon zhe Dracaena"
 omen_dracondracaena_desc:3 "Dracon y Dracaena eran una divina pareja de cetáceos. Los cetus eran dragones marinos con un cuerpo serpentino, mandíbulas de cocodrilo y un par de cuernos en la cabeza y ocupaban un lugar destacado en la mitología iliria. A menudo se pueden encontrar en barcos, joyas y chalecos antibalas para proteger y fortalecer el barco o al portador de dichos artículos.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"

 deity_thana:0 "$omen_thana$"
 omen_thana:1 "Thana"
 omen_thana_desc:3 "$omen_diana_desc$\n\n#Y Thana#!: Los cazadores a menudo sacrificaban a Thana para una caza exitosa, pero también era venerada junto con Vidasus como diosa de la naturaleza; algunos de sus santuarios en el norte de Iliria estaban ubicados cerca de aguas termales para invocar sus poderes curativos combinados.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_boria:0 "$omen_boria$"
 omen_boria:1 "Boria"
 omen_boria_desc:3 "En el interior montañoso de Histria, los habitantes locales construyen sus ciudades en la cima de las montañas, por lo que no es de extrañar que la diosa de la montaña Boria tenga un lugar especial en su panteón como protectora de sus hogares. Esta diosa podría haber expresado su disgusto a través de vientos katábicos, ya que todavía llevan su nombre en croata (Bura) y esloveno (Burja) modernos.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_ica:0 "$omen_ica$"
 omen_ica:1 "Ica"
 omen_ica_desc:3 "Se cree que la ninfa Ica reside en las aguas termales cercanas a Flanonia, la actual Plomin, otorgando curación y descanso a todos los visitantes. Incluso este lugar lleva su nombre.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"

 deity_sentona:0 "$omen_sentona$"
 omen_sentona:0 "Sentona"
 omen_sentona_desc:0 "La diosa Sentona, patrona de los viajeros, era la principal diosa de los liburnios. Era una diosa muy extendida entre los liburnios y probablemente también se encontraba en otras culturas. Sentona también persistió más allá de la conquista romana.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_medaurus:0 "$omen_medaurus$"
 omen_medaurus:0 "Medaurus"
 omen_medaurus_desc:0 "Medauro, el dios jinete de los tracios, estaba muy extendido en el mundo paleobáltico. Medaurus adquirió prominencia más tarde entre los ilirios durante la época romana hasta el punto de que Medaurus está más asociado con Ilírico que con Zalmoxiano.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_redon:0 "$omen_redon$"
 omen_redon:0 "Redon"
 omen_redon_desc:0 "Redon es un dios muy extendido asociado con el dinero, los viajes y la navegación. A menudo se le representaba en monedas llevando petasos. Se encontraron monedas de Redon en varias ciudades a lo largo de la costa del Adriático, incluida Messapia.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"

 deity_andinus:0 "$omen_andinus$"
 omen_andinus:0 "Andinus"
 omen_andinus_desc:0 "Andinus era una deidad dardaniana, a menudo venerada por tracios e ilirios de la zona. Su nombre puede haber significado \"extranjero\", probablemente haciendo referencia a este hecho. Hubo muchas deidades de la fe zalmoxiana que eventualmente fueron adoradas en las tierras de los ilirios. El nombre de Andinus también era un nombre común entre los ilirios de la zona.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"

 deity_trita:0 "$omen_trita$"
 omen_trita:0 "Trita"
 omen_trita_desc:0 "Trita era una diosa de la salud. Aunque asociada con los istrianos, el origen de su nombre proviene de la costa sur del Adriático de Iliria. Es posible que Trita también tuviera influencias de los pueblos druídicos originalmente antes de convertirse completamente en una diosa lírica.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"

 deity_dualos:0 "$omen_dualos$"
 omen_dualos:0 "Dualos"
 omen_dualos_desc:0 "Dualos era posiblemente un equivalente ilirio del dios Dioniso de los griegos. La etimología parece leerse como \"borracho\" o \"loco\". Dualos era principalmente una deidad Paeoniana.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"

 deity_aecorna:0 "$omen_aecorna$"
 omen_aecorna:0 "Aecorna"
 omen_aecorna_desc:0 "Aecorna era una diosa adorada exclusivamente por los panonios y los pueblos circundantes. Era una diosa del agua, asociada con lagos o ríos. Probablemente era una diosa de la protección, especialmente para los barqueros y marineros.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_nebres:0 "$omen_nebres$"
 omen_nebres:0 "Nebres"
 omen_nebres_desc:0 "Nebres era una deidad adorada principalmente en Liburnia e Istra. No se sabe mucho sobre ella y hay muy pocas referencias o inscripciones, sin embargo, probablemente estaba en un nivel similar al de los otros dioses de Liburnia e Istria.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_enji:0 "$omen_enji$"
 omen_enji:0 "Enji"
 omen_enji_desc:0 "Dios del trueno y el fuego, Enji era un dios poderoso, especialmente de los ilirios del norte. Los romanos lo veían como un dios similar a Júpiter y esto se refleja en que Enji finalmente se convirtió en la raíz de la palabra jueves en albanés moderno. Enji también se conoce como En, y este nombre se asoció más tarde con una fuerza demoníaca.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 
 #Histrians
 deity_histria:0 "$omen_histria$"
 omen_histria:1 "Histria"
 omen_histria_desc:3 "La diosa suprema de la península de Histria gobierna la tierra de Histria y a todos sus habitantes, por lo que corresponde a ella otorgar su protección e inspiración a todos los que se sacrifican en su nombre.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_melosocus:0 "$omen_melosocus$"
 omen_melosocus:1 "Melosocus"
 omen_melosocus_desc:3 "Melosocus es la única deidad masculina transmitida de la península de Histria, lo que parece ser una expresión del papel destacado de la mujer en la sociedad de Histria. Como tal, probablemente era el dios patrón de los hombres entre los histrianos.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_latra:0 "$omen_latra$"
 omen_latra:1 "Latra"
 omen_latra_desc:3 "Había muchos cultos religiosos locales de diosas femeninas entre los liburnios como Iutossica, Sentona y también Latra. Latra fue representada con un sombrero ilirio puntiagudo, así como tres altares sobre ofrendas para buscar su favor y buena fortuna.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_iria:0 "$omen_iria$"
 omen_iria:0 "Iria"
 omen_iria_desc:0 "Iria, una de las muchas diosas de Istria. No es muy conocida, pero al igual que otros dioses de Istria, estaba muy extendida entre la gente de Istria.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"

 deity_eia:0 "$omen_eia$"
 omen_eia:0 "Eia"
 omen_eia_desc:0 "Eia era una diosa de Istria que luego se sincretizó con Bona Dea. Fue adorada al menos hasta la costa dálmata, por lo que debe haberse extendido entre los ilirios de la costa.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"

 #Messapians
 deity_zis:0 "$omen_zis$"
 omen_zis:1 "Zis"
 omen_zis_desc:3 "$omen_zeus_desc$\n\nA pesar de sus similitudes con Zeus, Zis en realidad proviene de creencias iliricas nativas de una deidad indoeuropea de raíz similar.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_damater:0 "$omen_damater$"
 omen_damater:1 "Damater"
 omen_damater_desc:3 "$omen_demeter_desc$\n\nA pesar de sus similitudes con Deméter, Damater en realidad proviene de creencias iliricas nativas de una deidad indoeuropea de raíz similar.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"

 deity_lahona:0 "$omen_lahona$"
 omen_lahona:1 "Aprodita Lahona"
 omen_lahona_desc:3 "$omen_aphrodite_desc$\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_damatira:0 "$omen_damatira$"
 omen_damatira:1 "Damatira"
 omen_damatira_desc:3 "$omen_demeter_desc$\n\nA pesar de sus similitudes con Deméter, Damatira en realidad proviene de creencias iliricas nativas de una deidad indoeuropea de raíz similar.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"

 deity_athana:0 "$omen_athana$"
 omen_athana:1 "Athana"
 omen_athana_desc:3 "$omen_demeter_desc$\n\nA pesar de sus similitudes con Atenea, Athana en realidad proviene de creencias iliricas nativas de una deidad indoeuropea de raíz similar.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"

 deity_taotor:0 "$omen_taotor$"
 omen_taotor:1 "Taotor"
 omen_taotor_desc:3 "Taotor, una diosa misteriosa, no es muy conocida. La etimología sugiere que era una especie de diosa del pueblo, siendo Teuta(na) la palabra iliria para señora del pueblo, o incluso reina (famosa por su uso en el nombre de la reina Teuta). Otras etimologías relacionadas en palabras celtas, itálicas y góticas parecen implicar lo mismo: una palabra asociada con la unidad tribal o del pueblo en general. Así, al menos se puede concluir que Taotor es una diosa del pueblo.\n\n#! Efecto apoteósico: $culture_apotheosis_characters_effect_tt_description$"

 deity_illyrius:0 "$omen_illyrius$"
 omen_illyrius:1 "Illyrius"
 omen_illyrius_desc:3 "Ilirio es hijo de Cadmo y Harmonia, quienes eventualmente gobernaron Iliria y se convirtieron en el antepasado epónimo de los ilirios. Se dice que de él proviene el nombre de Iliria y de él proceden los ilirios. También se decía que tuvo seis hijos y tres hijas, cada uno asociado con una tribu iliria diferente. Los nombres de los hijos son Encheleus, Autarieus, Dardanus, Maedus, Taulus, Perrhaebus; mientras que las hijas son Partho, Daortho y Dassaro.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"

 deity_juppiter_menzanas:0 "$omen_juppiter_menzanas$"
 omen_juppiter_menzanas:1 "Juppiter Menzanas"
 omen_juppiter_menzanas_desc:3 "Juppiter Menzanas es una deidad epitetal que se traduce aproximadamente como Padre Cielo, el dios de los caballos. A veces también se le llama Zis Menzanas. Menzanas es un dios mesápico nativo de los caballos que no se encuentra en otras culturas, pero con frecuencia se lo emparejaba como epíteto con otras deidades para mostrar su fuerza o poder.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_venas:0 "$omen_venas$"
 omen_venas:1 "Venas"
 omen_venas_desc:3 "$omen_aphrodite_desc$\n\nA pesar de sus similitudes con Venus, Venas en realidad proviene de creencias iliricas nativas de una deidad indoeuropea de raíz similar.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
