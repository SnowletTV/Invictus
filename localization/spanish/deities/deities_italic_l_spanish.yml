l_spanish:
 ## Generic ##
 deity_laran:0 "$omen_laran$"
 omen_laran:0 "Laran"
 omen_laran_desc:0 "Laran, o Larun, era un dios de la guerra que residía en el inframundo. A menudo equiparado con Ares y Marte, Laran era un guardián de las fronteras y un mantenedor de la paz. Es uno de los nueve dioses itálicos que pueden convocar rayos conocidos como los Novensiles. A menudo se le representaba como un joven que no tenía más que un casco, un escudo y una lanza.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_turms:0 "$omen_turms$"
 omen_turms:0 "Turms"
 omen_turms_desc:0 "El dios Turms era un dios del pueblo, el comercio y los mensajeros. A menudo comparado con Mercurio y Hermes, Turms generalmente también se muestra con características similares a ellos, incluidas sandalias aladas. Turms también ayudó a guiar a las almas al inframundo, como lo demuestran sus representaciones o sarcófagos etruscos.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_aita:0 "$omen_aita$"
 omen_aita:0 "Aita"
 omen_aita_desc:0 "Aita era un dios del inframundo y de los lobos. Estuvo fuertemente influenciado por el dios griego Hades, pero es posible que haya existido antes de la influencia griega y luego se haya adaptado para parecerse más a Hades. Originalmente, probablemente tenía una relación cercana con el dios lobo Calu.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_tinia:0 "$omen_tinia$"
 omen_tinia:0 "Tinia"
 omen_tinia_desc:0 "Uno de los principales dioses de los etruscos, Tinia (Tin, Tinh, Tins o Tina) es de gran importancia. Es el dios del cielo y a menudo se le compara con Júpiter y Zeus. Algunos eruditos afirman que estaba en segundo lugar después de Veltha o Veltumna, y es posible que haya ganado más importancia en Etruria debido a la comparación con Zeus y Júpiter. Tinia también era uno de los nueve dioses (los Novensils) que podían empuñar un rayo. Su consorte es la diosa Uni y fue padre de las deidades de Heracles y Menrva (probablemente por influencia de los griegos).\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_nortia:0 "$omen_nortia$"
 omen_nortia:0 "Nortia"
 omen_nortia_desc:0 "Nortia, la diosa del destino, el tiempo y la suerte, era una deidad poderosa extendida por las tierras itálicas. Es famoso que los romanos observaran su ritual como el ritual del clavo en el que se clavaba un clavo en las paredes de su templo en Volsinii para marcar el Año Nuevo.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_sethlans:0 "$omen_sethlans$"
 omen_sethlans:0 "Sethlans"
 omen_sethlans_deity:0 "Sethlans era un dios del fuego, la forja y el trabajo en metal. Sethlans es un dios antiguo que a menudo se compara con dioses como Ptah, Vulcano y Hefesto, aunque es evidente que es de origen itálico o etrusco."
 deity_turan:0 "$omen_turan$"
 omen_turan:0 "Turan"
 omen_turan_desc:0 "La diosa Turan era claramente una diosa importante. Patrona de la ciudad de Velch, la diosa alada gobernaba los dominios del amor, la vitalidad y la fertilidad. A menudo se la comparaba con Afrodita, lo que habla de su prominencia en el panteón. Turan también tenía un séquito masivo de Lasa, Genii y otras deidades menores. Turan también tenía un mes etrusco que lleva su nombre, conocido en latín como Traneus, y es el equivalente a julio. Sus símbolos consisten en pájaros blancos como palomas y gansos, pero los más reconocibles son cisnes.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_usil:0 "$omen_usil$"
 omen_usil:0 "Usil"
 omen_usil_desc:0 "Usil era un dios o diosa del sol. Es posible que haya comenzado como una diosa, pero luego se sincretizó con el Sol romano y el Helios griego, y probablemente debido a la ambigüedad de los géneros de los dioses itálicos, cambió a un dios masculino. A pesar de esta sincretización, siguió siendo distinto en su carácter y sus relaciones, particularmente su estrecha asociación con la diosa del Amanecer, Thesan. También estaba asociado con la diosa Catha, que tenía afiliaciones solares similares a Usil. La representación más famosa de Usil es aquella en la que emerge del mar con un halo y bolas de fuego emergiendo de cualquiera de sus manos.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_zerene:0 "$omen_zerene$"
 omen_zerene:0 "Zerene"
 omen_zerene_desc:0 "Zerene era una diosa conocida principalmente por ser hermana de Uni. No se sabe mucho sobre ella aparte de esta asociación, sin embargo se supone que era un dios similar a Uni, aunque menos notable.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_fufluns:0 "$omen_fufluns$"
 omen_fufluns:0 "Fufluns"
 omen_fufluns_desc:0 "Fufluns era un dios de mucha importancia. A menudo equiparado con Dioniso o el Liber romano, Fufluns era un dios de la salud, la felicidad y, por supuesto, el vino. Es posible que la asociación con el vino fuera una característica directamente influenciada por los griegos. A veces se decía que era uno de los muchos dioses del inframundo. Fufluns posiblemente también tuvo una relación íntima o romántica con su madre, Semla. Además de Semla, Fufluns tenía asociaciones con Catha.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_angitia:0 "$omen_angitia$"
 omen_angitia:0 "Angitia"
 omen_angitia_desc:0 "Angitia era una diosa para el pueblo Marsi, así como para muchos pueblos osco-umbros de Italia. Angitia era una diosa muy prominente y estaba asociada con serpientes y encantadores de serpientes. También se la asoció con la música, la magia y la curación. Es posible que tuviera orígenes en la mitología griega, pero la extensión de su culto en Italia puede demostrar lo contrario. Posiblemente era la deidad nacional del pueblo Marsi y se decía que vivía cerca del lago Fucine donde curaba mordeduras de serpiente.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_feronia:0 "$omen_feronia$"
 omen_feronia:0 "Feronia"
 omen_feronia_desc:0 "Feronia era una diosa de la vida silvestre, la fertilidad y la salud. También era conocida por liberar esclavos, otorgar derechos cívicos y ser una patrona de los sectores humildes de la sociedad. Por lo tanto, era más venerada por los libertos y los plebeyos. Era una diosa antigua que probablemente era adorada antes de la influencia griega en Italia.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_sancus:0 "$omen_sancus$"
 omen_sancus:0 "Sancus"
 omen_sancus_desc:0 "Sancus era un dios de confianza, a menudo asociado con Fides. También era señor de los juramentos, el matrimonio, las leyes y los contratos. Sancus era un dios muy antiguo venerado en Roma y probablemente provenía de una influencia prehelenística en Italia. Es posible que Sancus provenga de la influencia de los umbros.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_marica:0 "$omen_marica$"
 omen_marica:0 "Marica"
 omen_marica_desc:0 "Marica era una diosa de la fertilidad asociada a la diosa romana Venus. Para los romanos, Marica vendría a representar a la madre de Latino, un héroe de la guerra de Troya, sin embargo es muy probable que su origen sea anterior a la influencia helenística en la zona. El concepto de diosa madre era muy común entre los pueblos itálicos.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_maphitis:0 "$omen_maphitis$"
 omen_maphitis:0 "Maphitis"
 omen_maphitis_desc:0 "Maphitis o Mafitis era la diosa itálica de los gases venenosos. Probablemente originalmente una diosa de los sabelianos, Maphitis difundiría su culto a pesar de ser una diosa menor en general. Se la asoció con los volcanes debido a los peligrosos gases que arrojaban de ellos e incluso fue adorada en Pompeya.\n\n#! Efecto apoteósico: $military_apotheosis_defensive_effect_tt_description$"
 deity_letha:0 "$omen_letha$"
 omen_letha:0 "Letha"
 omen_letha_desc:0 "Letha, también conocida como Letham, Lethns, Lethms o Leta, era una diosa del inframundo. Era conocida como una diosa infernal, lo que significa que era una de las muchas deidades del inframundo.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_mae:0 "$omen_mae$"
 omen_mae:0 "Mae"
 omen_mae_desc:0 "Mae era una diosa de la fertilidad que estaba fuertemente combinada con la diosa griega Maia. Dicho esto, es probable que existiera antes de las influencias helenísticas y luego fuera equiparada. Pudo haber sido una diosa prominente y sirvió de inspiración para el mes de mayo para los romanos. Mae también podría haber sido una diosa de la tierra como lo fue Maia para los romanos.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_tece:0 "$omen_tece$"
 omen_tece:0 "Tece"
 omen_tece_desc:0 "Tece o Tecum era un dios de los nobles y la clase dominante. No se sabe mucho más sobre esta deidad, pero fue mencionado en el Hígado de Piacenza, lo que implica que pudo haber tenido seguidores de culto.\n\n #! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"
 deity_culalp:0 "$omen_culalp$"
 omen_culalp:0 "Culalp"
 omen_culalp_desc:0 "Culalp es un dios misterioso que estaba asociado con el dios Culsans, tal vez siendo una cara del dios Culsans. Algunos eruditos sugieren que Culalp también pudo haber estado asociado con Alpan, siendo una combinación de Culsans y Culalp, sin embargo, también puede ser que Culalp sea independiente de ambos.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_vanth:0 "$omen_vanth$"
 omen_vanth:0 "Vanth"
 omen_vanth_desc:0 "Vanth era una demonio alada del inframundo. A menudo se la asociaba con el dios Charun del inframundo y guiaba a las almas allí. Si bien se la describe como un demonio alado, esta podría ser la visión de los extraños o de los espectadores helénicos del ser, como tal, es posible que originalmente fuera percibida como una diosa del inframundo.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_tlusc:0 "$omen_tlusc$"
 omen_tlusc:0 "Tlusc"
 omen_tlusc_desc:0 "Tlusc es una deidad que pudo haber estado cercana a Sancus. Se decía que el dominio de Sancus era la siguiente razón después de la región gobernada por Tlusc, por lo que puede haber habido similitudes entre los dos dioses.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_summanus:0 "$omen_summanus$"
 omen_summanus:0 "Summanus"
 omen_summanus_desc:0 "Summanus es el dios del trueno nocturno. Por esta razón, a veces se le considera el gemelo o el gemelo opuesto de Zeus. Esta fue probablemente una comparación hecha más tarde y la naturaleza de Summanus es generalmente desconocida, sin embargo, es posible que fuera venerado considerando la comparación con el dios griego.\n\n #! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_turnu:0 "$omen_turnu$"
 omen_turnu:0 "Turnu"
 omen_turnu_desc:0 "Turnu es un dios del amor e hijo de la diosa Turan. Fue comparado con el dios griego Eros y posiblemente con el dios romano Cupido. También estaba dentro de la multitud de deidades en el séquito de Turan y puede haber jugado un papel en ayudar a su madre.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_thesan:0 "$omen_thesan$"
 omen_thesan:0 "Thesan"
 omen_thesan_desc:0 "Thesan era la diosa del amanecer. Fue identificada con la diosa romana Aurora y la griega Eos. Representaba la adivinación, el parto y la vida. A menudo se la representaba como una diosa desnuda con alas.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_aminch:0 "$omen_aminch$"
 omen_aminch:0 "Aminch"
 omen_aminch_desc:0 "Aminch o Aminth era un dios infantil del amor, asociado al erotismo y los deseos sexuales. Fue comparado con el dios romano Amor, que luego sería conocido como Cupido. Aminch también fue uno de los genios que eran poderosos espíritus masculinos bajo la diosa Turan.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_svutaf:0 "$omen_svutaf$"
 omen_svutaf:0 "Svutaf"
 omen_svutaf_desc:0 "Svutaf es uno de los miembros del séquito de la diosa Turan. Sólo se le conoce como genio, que representaba a los espíritus masculinos bajo Turan. A los genios también se les asociaba a veces como espíritus del inframundo. A los genios también se les asociaba a veces como espíritus del inframundo o se los consideraba lo contrario o la antítesis de los Lasa.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_pulchisf:0 "$omen_pulchisf$"
 omen_pulchisf:0 "Pulchisf"
 omen_pulchisf_desc:0 "Pulchisf, uno de los genios, parte del séquito de la diosa Turan, estaba acompañado por otros genios y Lasa, así como por diversas deidades. A los genios también se les asociaba a veces como espíritus del inframundo o se los consideraba lo contrario o la antítesis de los Lasa.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_lasa_sitmica:0 "$omen_lasa_sitmica$"
 omen_lasa_sitmica:0 "Lasa Sitmica"
 omen_lasa_sitmica_desc:0 "Lasa era un término utilizado para referirse a una clase de deidades. Eran partes importantes de la corte de la Diosa Turan y a menudo representaban rostros de ella. Lasa Sitmica fue uno de estos seres. No se sabe mucho más sobre este misterioso Lasa.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_lasa_racuneta:0 "$omen_lasa_racuneta$"
 omen_lasa_racuneta:0 "Lasa Racuneta"
 omen_lasa_racuneta_desc:0 "Lasa era un término utilizado para referirse a una clase de deidades. Eran partes importantes de la corte de la Diosa Turan y a menudo representaban rostros de ella. Lasa Racuneta fue uno de estos seres. No se sabe mucho más sobre esta misteriosa Lasa.\n\n#! Efecto apoteósico: $naval_apotheosis_effect_tt_description$"
 deity_lasa_achunanu:0 "$omen_lasa_achunanu$"
 omen_lasa_achunanu:0 "Lasa Achunanu"
 omen_lasa_achunanu_desc:0 "Lasa era un término utilizado para referirse a una clase de deidades. Eran partes importantes de la corte de la Diosa Turan y a menudo representaban rostros de ella. Lasa Achunanu fue uno de estos seres. No se sabe mucho más sobre esta misteriosa Lasa.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_lasa_vecu:0 "$omen_lasa_vecu$"
 omen_lasa_vecu:0 "Lasa Vecu"
 omen_lasa_vecu_desc:0 "Lasa era un término utilizado para referirse a una clase de deidades. Eran partes importantes de la corte de la Diosa Turan y a menudo representaban rostros de ella. Lasa Vecu fue uno de estos seres. También es la única Lasa de la que conocemos más detalles debido a su asociación con un autor profético conocido como Vegoia. Se decía que tenía una gran influencia en los libros y escritos sagrados etruscos.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_achaviser:0 "$omen_achaviser$"
 omen_achaviser:0 "Achaviser"
 omen_achaviser_desc:0 "Achaviser era un dios misterioso asociado con la diosa Turan como parte de su séquito, sin embargo, no era un genio. Los genios son los espíritus masculinos que estaban relacionados con Lasa, que eran ninfas femeninas de la fertilidad. Como Achaviser era considerado una deidad propiamente dicha, es posible que haya desempeñado un papel más importante de lo que se sabe.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_zipna:0 "$omen_zipna$"
 omen_zipna:0 "Zipna"
 omen_zipna_desc:0 "Zipna era un dios misterioso asociado con la diosa Turan como parte de su séquito. Es posible que Zipna también haya estado asociado con novias, ya que una representación lo muestra trabajando para preparar una novia junto con muchas otras deidades de Turan.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_leinth:0 "$omen_leinth$"
 omen_leinth:0 "Leinth"
 omen_leinth_desc:0 "Leinth era un dios asociado con Turan como parte de su séquito. A diferencia de otras deidades menores, existen más teorías sobre qué tipo de dios era. Debido a la raíz etimológica de su nombre, es probable que Leinth estuviera asociado con la muerte o el morir. También es muy posible que fuera una diosa; es imposible saberlo con seguridad debido a la ambigüedad de los sexos de los dioses etruscos e itálicos.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_snenath:0 "$omen_snenath$"
 omen_snenath:0 "Snenath"
 omen_snenath_desc:0 "Snenath era una diosa entre muchas del séquito de Turan. Si bien no se sabe mucho sobre ella, la etimología de su nombre se identifica como sirvienta o sirvienta, por lo que es probable que su propósito como diosa fuera servir a Turan. Su nombre también podría identificarse como compañero, lo que lleva a una probable asociación con ideas de amor y amistad.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
 deity_reschual:0 "$omen_reschual$"
 omen_reschual:0 "Reschual"
 omen_reschual_desc:0 "Reschual era una diosa del séquito de Turan. No se sabe mucho sobre ella, sin embargo, no era una Lasa, lo que implica que era una deidad algo notable.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_evan:0 "$omen_evan$"
 omen_evan:0 "Evan"
 omen_evan_desc:0 "Evan era una diosa del séquito de Turan. Aunque a veces se la identifica como Lasa, probablemente ella misma era más una deidad y era vista como una compañera cercana de Turan. Su nombre se relaciona etimológicamente con la palabra etrusca para tiempo, que puede aludir a que ella es una diosa del tiempo.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_meanpe:0 "$omen_meanpe$"
 omen_meanpe:0 "Meanpe"
 omen_meanpe_desc:0 "Meanpe, también conocida como Mean, era una diosa del séquito de Turan. A menudo también se la asociaba con la diosa Nike del panteón griego. Es posible que haya sido venerada especialmente en tiempos de guerra o especialmente después de obtener la victoria después de una guerra.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_hinthia:0 "$omen_hinthia$"
 omen_hinthia:0 "Hinthia"
 omen_hinthia_desc:0 "Hinthia era una diosa del séquito de Turan. Si bien no se sabe mucho sobre ella, probablemente era una diosa del inframundo y especialmente de los fantasmas. De hecho, su nombre parece indicar que pudo haber representado específicamente fantasmas en lugar del concepto de \"muertos\" en general.\n\n#! Efecto apoteósico: $naval_apotheosis_effect_tt_description$"
 deity_hercle:0 "$omen_hercle$"
 omen_hercle:0 "Hercle"
 omen_hercle_desc:0 "Hercle es claramente una versión etrusca del dios griego Hércules. A pesar de la clara inspiración, los dioses etruscos tendieron a adoptar sus propias representaciones separadas de las interpretaciones griegas. Fue representado como una figura musculosa con un garrote. Se decía que Hercle era hijo de Tinia y Uni. Más que su homólogo griego, Hercle era visto como un dios tipo oráculo.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_artume:0 "$omen_artume$"
 omen_artume:0 "Artume"
 omen_artume_desc:0 "Artume era una diosa etrusca de las asambleas, dueña de los animales y deidad de la caza. Probablemente se inspiró en la diosa Artimis, o al menos se combinó con ella.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_artimit:0 "$omen_artimit$"
 omen_artimit:0 "Artimit"
 omen_artimit_desc:0 "Artimit era una diosa etrusca estrechamente relacionada con Artume, y puede haber sido incluso una versión de Artume o una variante local. De todos modos, está claro que, al igual que Artume, Artimit estuvo fuertemente influenciado o inspirado por Artimis y representó ideas similares.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_latun:0 "$omen_latun$"
 omen_latun:0 "Latun"
 omen_latun_desc:0 "Latun era una diosa etrusca inspirada o influenciada por el dios griego de Latona, también conocido como Leto. Si bien no sabemos mucho acerca de en qué se diferenciaba Latun de Leto, es probable que Letun fuera la madre de Apulu como Leto era la madre de Apolo.\n\n#! Efecto apoteósico: $culture_apotheosis_characters_effect_tt_description$"
 deity_phersipnei:0 "$omen_phersipnei$"
 omen_phersipnei:0 "Phersipnei"
 omen_phersipnei_desc:0 "Phersipnei es una diosa fuertemente influenciada por la griega Perséfone. Al igual que Perséfone, Phersipnei era una diosa consorte de un dios del inframundo, Aita. Juntos gobernarían el inframundo.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_charum:0 "$omen_charum$"
 omen_charum:0 "Charu"
 omen_charum_desc:0 "Charu, o Charun, era un dios basado en Caronte de la mitología griega. A menudo se le asociaba con Vanth, una diosa o demonio del inframundo. A pesar del nombre similar a Caronte, Charu se había desarrollado de manera muy singular a partir de su versión griega. Tenía orejas puntiagudas, un martillo, piel azul, pelo de serpiente y alas gigantes.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
 deity_castur:0 "$omen_castur$"
 omen_castur:0 "Castur"
 omen_castur_desc:0 "Castur era un dios relacionado con la versión griega Castor. Estaba asociado con su hermano gemelo Pultuce. Los dioses gemelos estaban asociados con los vientos en el mar. Ambos gemelos también eran conocidos como grandes jinetes y aparecieron en la historia griega de Troya.\n\n#! Efecto de apoteosis: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_pultuce:0 "$omen_pultuce$"
 omen_pultuce:0 "Pultuce"
 omen_pultuce_desc:0 "Pultuce era un dios relacionado con la versión griega Pollux. Estaba asociado con su hermano gemelo Castur. Los dioses gemelos estaban asociados con los vientos en el mar. Ambos gemelos también eran conocidos como grandes jinetes y aparecieron en la historia griega de Troya.\n\n#! Efecto de apoteosis: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_atunis:0 "$omen_atunis$"
 omen_atunis:0 "Atunis"
 omen_atunis_desc:0 "Atunis era un dios de la fertilidad de gran importancia. Su homólogo griego y probable inspiración fue Adonis. Atunis estaba fuertemente asociada con Turan y pudo haber sido su consorte o amante. Aunque mortal en su versión griega, los etruscos deificaron a Atunis y, como resultado, Atunis puede haber desempeñado un papel más importante en los mitos etruscos.\n\n #! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_apulu:0 "$omen_apulu$"
 omen_apulu:0 "Apulu"
 omen_apulu_desc:0 "Apulia era claramente una versión etrusca del dios grecorromano de Apolo. Apulu está asociado con el sol y la salud, especialmente la salud de la peste. También pudo haber sido un dios de la música y la poesía como lo fue Apolo.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_aril:0 "$omen_aril$"
 omen_aril:0 "Aril"
 omen_aril_desc:0 "Aril era un dios etrusco identificado con el titán griego Atlus. No se sabe mucho sobre en qué se diferenciaba Aril de Atlus, y es posible que Aril desempeñara un papel similar en la mitología etrusca, aunque más como un dios que como un titán.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_athrpa:0 "$omen_athrpa$"
 omen_athrpa:0 "Athrpa"
 omen_athrpa_desc:0 "Athrpa era una diosa etrusca identificada con la diosa griega Atropos. Ella era una diosa del destino y el destino. También era una de las Hermanas Grises del Destino de la mitología griega y habría estado fuertemente asociada con sus dos hermanas, también diosas del destino.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_enie:0 "$omen_enie$"
 omen_enie:0 "Enie"
 omen_enie_desc:0 "Enie era la versión etrusca de la diosa Enyo. Enie, una diosa de la guerra, probablemente era similar a su homóloga griega. También fue una de las Hermanas Grises de la mitología griega. Esto significa que ella era una diosa del destino fuertemente asociada con sus dos hermanas, quienes también habrían sido diosas del destino.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_pemphetru:0 "$omen_pemphetru$"
 omen_pemphetru:0 "Pemphetru"
 omen_pemphetru_desc:0 "Pemphetru era la diosa etrusca equivalente a Pemphredo, una de las Hermanas Grises del destino de la mitología griega. Esto significa que ella era una diosa del destino fuertemente asociada con sus dos hermanas, quienes también habrían sido diosas del destino.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_culsans:0 "$omen_culsans$"
 omen_culsans:0 "Culsans"
 omen_culsans_desc:0 "Culsans era un dios de dos caras que pudo haber sido similar al dios romano Janus. Representó la dualidad y las transiciones. Algunos estudiosos proponen que los culsans pueden tener una raíz etimológica de una palabra etrusca que significa \"puerta\".\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"
 deity_calu:0 "$omen_calu$"
 omen_calu:0 "Calu"
 omen_calu_desc:0 "Calu era un dios infernal de los lobos. Probablemente fue el gobernante original del inframundo antes de que ella fuera equiparada con Aitu, una versión etrusca de Hades, o posiblemente un dios menos importante del inframundo que se fusionó con Hades y, por lo tanto, ganó una importancia equivalente a la de Aitu.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_perthan:0 "$omen_perthan$"
 omen_perthan:0 "Pethan"
 omen_perthan_desc:0 "Pethan o Perthan era una diosa fuertemente asociada con el dios Calu, que era uno de los dioses supremos del inframundo. Es posible que Pethan fuera efectivamente la mano derecha de Calu, o posiblemente la consorte de Calu.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_catha:0 "$omen_catha$"
 omen_catha:0 "Catha"
 omen_catha_desc:0 "Catha o Cathas era una diosa etrusca de la maternidad. Podría haber sido una diosa lunar o solar, así como una diosa del inframundo. También estaba asociada con el sol. Catha también era conocida por tener una hija a la que solo se conoce como 'Cathas Sech', que significa 'la hija de Catha'.\n\n#! Efecto apoteósico: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_cathas_sech:0 "$omen_cathas_sech$"
 omen_cathas_sech:0 "Cathas Sech"
 omen_cathas_sech_desc:0 "Cathas Sech significa hija de Sech. Podría haber sido una diosa similar al Sol Invictus del panteón romano, de hecho, puede ser que Cathas Sech se refiera directamente a una versión etrusca de la deidad. Esto implica que Cathas Sech probablemente estaba asociado con el sol y la luz.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_tiv:0 "$omen_tiv$"
 omen_tiv:0 "Tiv"
 omen_tiv_desc:0 "Tiv, también llamada Tivr o Tiur, era una diosa de la noche y la luna. A menudo se la comparaba con la diosa griega Selene y la diosa romana Luna. El nombre de Tiv podría significar mes o brillante, posiblemente refiriéndose al seguimiento mensual de las fases de la luna.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_cels:0 "$omen_cels$"
 omen_cels:0 "Cel"
 omen_cels_desc:0 "Cels, también llamada Cel, era la madre de los gigantes. Podría haber representado la Tierra como lo hizo Gaia para los griegos. Se la representa protegiendo a Celsclan del dios de la guerra Laran. Celsclan es un gigante y su nombre significa hijo de Cel.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_manth:0 "$omen_manth$"
 omen_manth:0 "Manth"
 omen_manth_desc:0 "Manth es la consorte de Mania, uno de los gobernantes del inframundo. A veces también se le equipara con el dios Suris, o la versión latina Sorano. Como pareja divina del inframundo, Manth y Mania eran responsables de los espíritus de los muertos.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_mania:0 "$omen_mania$"
 omen_mania:0 "Mania"
 omen_mania_desc:0 "Mania, o Manea, era una diosa de la muerte, así como una diosa de los espíritus y el caos. Se decía que era una de las gobernantes del inframundo. También se dice que es la madre de las Lasa, las ninfas femeninas de la fertilidad.\n\n#! Efecto apoteósico: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_mlacuch:0 "$omen_mlacuch$"
 omen_mlacuch:0 "Mlacuch"
 omen_mlacuch_desc:0 "Mlacuch fue representada como una diosa de las mujeres y la feminidad. Su mito más popular incluye su secuestro, que fue precedido por el dios Hercle salvándola. Su nombre posiblemente proviene de la palabra etrusca para agradable o placentero y de la palabra etrusca para noble o hermoso.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"
 deity_cupra:0 "$omen_cupra$"
 omen_cupra:0 "Cupra"
 omen_cupra_desc:0 "Cupra es una diosa de la fertilidad del inframundo, especialmente adorada por los umbros y los picenios, pero probablemente era una diosa en muchas creencias itálicas. Pudo haber sido una forma de la diosa Uni. También puede tener orígenes en la diosa griega Afrodita a través de un nombre de Afrodita: 'Kupria'. Otra teoría es que su nombre proviene de la misma raíz que la deidad romana Cupido.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"
 deity_rath:0 "$omen_rath$"
 omen_rath:0 "Rath"
 omen_rath_desc:0 "Rath es un dios joven que a menudo se identifica con Apolo. Probablemente tenía atributos similares a los de Apolo. Cabe destacar que tenía un santuario en Tarchuna. Si bien Rath se menciona en varias inscripciones, no se sabe mucho sobre él aparte de su comparación con Apolo.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_alpan:0 "$omen_alpan$"
 omen_alpan:0 "Alpan"
 omen_alpan_desc:0 "Alpan es una diosa etrusca cuyo nombre es la misma palabra que la palabra etrusca significa \"de buena gana\". Como muchas deidades etruscas que no eran de origen griego, Alpan era una deidad citónica, es decir, del inframundo. Por lo general, se la representa completamente desnuda para indicar su condición de diosa de las actividades sexuales.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_cilen:0 "$omen_cilen$"
 omen_cilen:0 "Cilen"
 omen_cilen_desc:0 "Cilen, o Celens, era una diosa etrusca de la noche. No se sabe mucho sobre esta misteriosa diosa y su única referencia es una estatua a la que se le cayó la cabeza. Debido a su amplio tema, es posible que haya sido una deidad más antigua con una popularidad cada vez menor, lo que puede significar que también era adorada en el panteón rético.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_ati:0 "$omen_ati$"
 omen_ati:0 "Ati"
 omen_ati_desc:0 "Ati era el dios de los padres y cuyo nombre se traduce directamente como padre en etrusco. Está directamente asociado con la diosa de las madres, Apa, cuyo nombre se traduciría como madre. Es posible que este par de deidades fueran las más antiguas de todas en su panteón, lo que resultó en la asociación de sus nombres en palabras simples, palabras comunes.\n\n#! Efecto Apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_apa:0 "$omen_apa$"
 omen_apa:0 "Apa"
 omen_apa_desc:0 "Apa era una diosa de las madres y cuyo nombre se traduce directamente como madre en etrusco. Está directamente asociada con el dios de los padres, Ati, cuyo nombre se traduciría como padre. Es posible que este par de deidades fueran las más antiguas de todas en su panteón, lo que resultó en la asociación de sus nombres en palabras simples, palabras comunes.\n\n#! Efecto Apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_thalna:0 "$omen_thalna$"
 omen_thalna:0 "Thalna"
 omen_thalna_desc:0 "Thalna era una diosa fuertemente asociada con el parto. Probablemente se pensaba que estaba presente en muchas prácticas religiosas relacionadas con el parto. En la mitología estuvo presente en el nacimiento de varias deidades importantes. También pudo haber estado en un set con la deidad Thanr, quien estuvo en el nacimiento de muchas deidades importantes en las que Thalna no estuvo.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_thanr:0 "$omen_thanr$"
 omen_thanr:0 "Thanr"
 omen_thanr_desc:0 "Thanr era una diosa que era principalmente diosa del parto. Probablemente se pensaba que estaba presente en muchas prácticas religiosas relacionadas con el parto. En la mitología estuvo presente en el nacimiento de varias deidades importantes. También pudo haber estado en un set con la deidad Thalna, quien estuvo en el nacimiento de muchas deidades importantes en las que Thanr no estuvo.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_ethausva:0 "$omen_ethausva$"
 omen_ethausva:0 "Ethausva"
 omen_ethausva_desc:0 "Ethausva era una deidad menor asociada con el parto. Se la conoce principalmente por una representación con otras dos deidades del parto; Thalna y Thanr. También apareció como partera en una representación del nacimiento de Apulu. A pesar de su aparente oscuridad, lo más probable es que tuviera seguidores de culto.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_pacha:0 "$omen_pacha$"
 omen_pacha:0 "Pacha"
 omen_pacha_desc:0 "Pacha era un dios que a menudo se equiparaba con el dios Baco o el griego Dioniso. También estuvo vinculado a Cathas y Fufluns. Teniendo en cuenta la cantidad de deidades con las que se combina, es probable que originalmente fuera una deidad independiente antes de asociarse con otras.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_malavisch:0 "$omen_malavisch$"
 omen_malavisch:0 "Malavisch"
 omen_malavisch_desc:0 "Malavisch era una diosa del séquito de Turan. Malavisch era la diosa del amor y la belleza, además de la diosa de las novias. Probablemente era venerada principalmente durante las bodas y se la representaba, junto con muchas otras deidades de Turan, ayudando a preparar a una mujer que pronto se casaría. El nombre Malavisch proviene de las palabras etruscas que significan suavidad y feminidad.\n\n#! Efecto apoteósico: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_voltumna:0 "$omen_voltumna$"
 omen_voltumna:0 "Voltumna"
 omen_voltumna_desc:0 "Voltumna, también conocida como Veltha, se convirtió en la deidad suprema de los etruscos en algún momento, posiblemente precediendo, o más probablemente suplantando, a la Tríada Capitolina de Tinia, Uni y Menrva. Esto está respaldado por el hecho de que los romanos se referían a la diosa como Voltumna, que era la deidad patrona de la capital etrusca de Velzna. Voltumna también era una diosa ctónica, es decir, un dios del inframundo, ya que las deidades etruscas que eran independientes de la influencia griega tendían a ser dioses del inframundo.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_vea:0 "$omen_vea$"
 omen_vea:0 "Vea"
 omen_vea_desc:0 "Vea, Veyes, era la deidad patrona de la ciudad de Veyes. Veyes era la más rica de las ciudades etruscas y su deidad patrona, Vea, ganó mucha prominencia durante esta época. Debido a la riqueza de Veyes, Vea puede haber sido una deidad involucrada en el buen comercio y el comercio, así como una deidad general del pueblo.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_tages:0 "$omen_tages$"
 omen_tages:0 "Tages"
 omen_tages_desc:0 "Tages es una deificación de la leyenda del asentamiento del pueblo etrusco. También se le considera un profeta de los etruscos. A veces se le considera nieto de Tinia. Cuenta la leyenda que Tages llegó a la tierra, encontrado por un granjero etrusco. Tages regala al granjero el conocimiento de la adivinación.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_nethus:0 "$omen_nethus$"
 omen_nethus:0 "Nethuns"
 omen_nethus_desc:0 "Nethuns era el dios de los pozos, el agua y el mar. Es muy posible que el nombre Nethuns esté relacionado con el dios celta Nechtan. De hecho, los Nethuns pueden ser de origen indoeuropeo, de la palabra IE para sobrino. Esto muestra claramente que Nethuns no era originalmente etrusco, por lo que es probable que fuera uno de los muchos dioses adoptados entre los etruscos y los pueblos itálicos centrales. Actualmente, se cree que los nethuns procedían de Umbría. Nethuns se convirtió en Neptuno para los romanos, que se fusionó con el dios griego Poseidón.\n\n#! Efecto de apoteosis: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_uni:0 "$omen_uni$"
 omen_uni:0 "Uni"
 omen_uni_desc:0 "Uni, la diosa del matrimonio, la fertilidad y las mujeres, era una de las deidades más destacadas de Etruria. Se la considera la versión etrusca de la diosa Juno o de la diosa griega Hera. A veces se la considera una de las tres deidades supremas dentro de la \"Tríada Capitolina\", que está formada por ella misma, su marido Tinia y su hija Menrva. Uni también es la deidad patrona de Persna.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_menrva:0 "$omen_menrva$"
 omen_menrva:0 "Menrva"
 omen_menrva_desc:0 "Menrva era un dios de la sabiduría y la guerra que era visto como una diosa similar a la griega Atenea. Es posible que originalmente fuera de origen etrusco antes de ser adoptada por muchos pueblos itálicos que fueron influenciados por los etruscos. Se la consideraba hija de Uni y Tinia, dos de las deidades más destacadas del panteón etrusco. También contribuyó mucho a la diosa heleno-romana Menerva.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_satre:0 "$omen_satre$"
 omen_satre:0 "Satre"
 omen_satre_desc:0 "Satre o Satres era un dios que probablemente tenía un origen similar al del dios heleno-romano de Saturno. Satre era un dios aterrador y peligroso que podía empuñar un rayo. Satre fue probablemente uno de los muchos dioses intercambiados entre los etruscos y los pueblos itálicos centrales de la zona, incluidos los romanos.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_vediovis:0 "$omen_vediovis$"
 omen_vediovis:0 "Vediovis"
 omen_vediovis_desc:0 "Vediovis es un dios, probablemente de origen etrusco, de la curación. A menudo se le comparaba con el dios griego Asclepio. Los romanos también interpretaron a este dios como un dios anti-Júpiter. Los etruscos se referían a Vediovis como Veiove; sin embargo, a pesar del origen etrusco, parece que los romanos lo veneraban más que todos los pueblos itálicos que adoraban al dios. Los romanos incluso construyeron un templo entre dos picos de la colina Capitolina en Roma.\n\n#! Efecto apoteósico: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_veiove:0 "$omen_veiove$"
 omen_veiove:0 "Veiove"
 omen_veiove_desc:0 "Veiove es un dios, probablemente de origen etrusco, de la curación. A menudo se le comparaba con el dios griego Asclepio. Los romanos también interpretaron a este dios como un dios anti-Júpiter. Los romanos se referían a Veiove como Vediovis y a menudo lo comparaban con Apolo. A pesar del origen etrusco, parece que los romanos lo veneraban más que todos los pueblos itálicos que adoraban al dios.\n\n#! Efecto apoteósico: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_ani:0 "$omen_ani$"
 omen_ani:0 "Ani"
 omen_ani_desc:0 "Ani es un dios de muchas caras. Por esta razón, a menudo se le compara con el dios romano Jano. También se le compara con el dios mesopotámico Anu, quien también comparte este interesante rasgo. Ani es uno de los muchos dioses que se intercambiaron entre los etruscos y los pueblos itálicos del centro de Italia.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_maris:0 "$omen_maris$"
 omen_maris:0 "Maris"
 omen_maris_desc:0 "Maris, también llamado Mamers por los sabelianos, es un dios de la guerra que muy posiblemente era una versión del dios romano Marte, sin embargo esto no es universalmente aceptado. A Maris se la representa a menudo como un bebé o una niña. Los etruscos también decían que era hijo de Heracles. Probablemente fue uno de los muchos dioses que se intercambiaron durante el período en el que Etruria gobernó e influyó en gran parte de Italia central.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_selvanus:0 "$omen_selvanus$"
 omen_selvanus:0 "Selvanus"
 omen_selvanus_desc:0 "Selvanus, también conocido como Selvans, era un dios de las fronteras y quizás de la integridad de las fronteras políticas. Teniendo en cuenta su representación tanto en fuentes etruscas como romanas, es posible que Selvanus fuera uno de los muchos dioses compartidos entre la gente del centro de Italia y los etruscos durante el siglo VI a.C. Selvanus en las representaciones romanas suele ser retratado como un hombre barbudo, lo que contrasta fuertemente con la representación etrusca de Selvans como un joven desnudo.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_orcus:0 "$omen_orcus$"
 omen_orcus:0 "Orcus"
 omen_orcus_desc:0 "Orcus, uno de los muchos dioses que pueden haber sido intercambiados entre los etruscos y los pueblos itálicos cercanos a ellos, Orcus era un dios importante del inframundo. Orcus también pudo haber sido una deidad que representaba a todo el inframundo, sin embargo no parece ser que fuera el dios supremo del inframundo. Más tarde, Orcus se combinó con Hades o Plutón, así como con Dis Pater, Soranus y Suris. Parece ser un dios de la muerte si no es el dios del inframundo mismo.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_suris:0 "$omen_suris$"
 omen_suris:0 "Suris"
 omen_suris_desc:0 "Suris, o Suri, era una deidad curativa del inframundo. Es muy posible que fuera una versión de Sorano o al menos una combinación con Sorano, por lo que también se combinó más tarde con el dios Apolo. Es muy posible que Soranus y Suris sean lo mismo, y puede haber venido de la época del dominio etrusco en el centro de Italia, cuando se intercambiaron muchos dioses, incluido el dios faliscano Soranus o el dios etrusco Suris.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_soranus:0 "$omen_soranus$"
 omen_soranus:0 "Soranus"
 omen_soranus_desc:0 "Sorano era un dios de la tierra y de la curación, así como un dios del inframundo. Los romanos también lo asociaban a veces con el dios Apolo. Fue adoptado en el antiguo panteón romano a partir de orígenes itálicos generales, posiblemente de los sabinos o faliscos. Más tarde, cuando su culto fue suplantado por el de Apolo, Apolo Sorano fue asociado con los lobos, lo que puede haber provenido de una característica del Sorano original.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_vesuna:0 "$omen_vesuna$"
 omen_vesuna:0 "Vesuna"
 omen_vesuna_desc:0 "Vesuna era una diosa adorada principalmente por los sabinos y los pueblos circundantes. Se la menciona dos veces en las tablillas de Iguvine y parece ser una diosa de la protección y quizás de la fertilidad. También se extendió a la tradición etruriana, así como a las mitologías de Umbría y Romana, desde el dominio etrusco del siglo VI a.C. Durante este tiempo, se intercambiaron muchas deidades entre los etruscos, latinos, faliscos, sabinos, umbros y varias culturas más en cursiva.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_egeria:0 "$omen_egeria$"
 omen_egeria:0 "Egeria"
 omen_egeria_desc:0 "Egeria era una diosa ninfa del mundo natural en la antigua mitología romana. Ella proporcionaría orientación y ayudaría a los peregrinos. A menudo la invocaban mujeres que deseaban concebir hijos o garantizar la seguridad de sus recién nacidos. A veces se la representaba como una hermosa joven que llevaba una canasta de frutas, flores u otros símbolos de abundancia y prosperidad.\n\nSegún la leyenda, Egeria era la amante de Numa Pompilio, un legendario rey de Roma conocido por su piedad y sabiduría. Se dice que aconsejó a Numa sobre cuestiones de estado y prácticas religiosas, y que le enseñó los rituales sagrados de las vírgenes vestales.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_fides:0 "$omen_fides$"
 omen_fides:0 "Fides"
 omen_fides_desc:0 "Fides era una antigua diosa romana de la confianza y la honestidad. De hecho, se la consideraba una de las deidades más importantes del antiguo panteón romano e inculcó los valores de lealtad y confiabilidad en la cultura romana. Su festival se llamaba Fidesia y también se la invocaba a menudo en contratos legales.\n\nFides estaba estrechamente asociada con el estado romano y su templo estaba ubicado cerca del Foro Romano en Roma. Sus sacerdotes, conocidos como los \"Fideles\", eran responsables de mantener la confianza pública y garantizar que se cumplieran los juramentos y tratados.\n\nFides era a menudo representada como una mujer joven sosteniendo un cuerno de la abundancia, o como una doncella con su mano derecha colocada sobre su corazón y su mano izquierda extendida, con la palma hacia arriba. A veces también se la representaba sosteniendo una balanza, que simboliza el equilibrio entre la confianza y la desconfianza.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
 deity_qurinus:0 "$omen_qurinus$"
 omen_qurinus:0 "Qurinus"
 omen_qurinus_desc:0 "Qurinus era un antiguo dios de la guerra romano prehelenístico. Probablemente fue originalmente un dios sabelio, sin embargo, su popularidad creció más en Roma. Los romanos también veían a Qurinus como la versión deificada de Rómulo, el famoso fundador de Roma. Como tal, Qurinus era un protector del pueblo romano y celebró un festival de Quirinalia el 17 de febrero en su honor. Con el tiempo, Qurinus sería absorbido por el dios heleno-romano de Marte, aunque a veces se lo equiparó con Júpiter.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_sacni_triumpi_ais:0 "$omen_sacni_triumpi_ais$"
 omen_sacni_triumpi_ais:0 "Sacni Triumpi Ais"
 omen_sacni_triumpi_ais_desc:0 "Sacni Triumpi Ais se traduce como \"Dios oculto de la victoria\". Los dioses ocultos, o Dii Involutii, eran un grupo de dioses que no eran adorados directamente pero que se sabía que eran los dioses principales que gobernaban a todos los demás dioses. Sacni Triumpi Ais es por lo tanto un representante de los Dii Involutii como dios de la guerra.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_sacni_zichi_eis:0 "$omen_sacni_zichi_eis$"
 omen_sacni_zichi_eis:0 "Sacni Zichi Eis"
 omen_sacni_zichi_eis_desc:0 "Sacni Zichi Eis se traduce como \"Diosa oculta de la sabiduría\". Los dioses ocultos, o Dii Involutii, eran un grupo de dioses que no eran adorados directamente pero que se sabía que eran los dioses principales que gobernaban a todos los demás dioses. Sacni Zichi Eis por lo tanto es un representante de Dii Involutii como diosa de la Cultura.\n\n#! Efecto Apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_sacni_zamthi_ais:0 "$omen_sacni_zamthi_ais$"
 omen_sacni_zamthi_ais:0 "Sacni Zamthi Ais"
 omen_sacni_zamthi_ais_desc:0 "Sacni Zamthi Ais se traduce como \"Dios oculto del oro\". Los dioses ocultos, o Dii Involutii, eran un grupo de dioses que no eran adorados directamente pero que se sabía que eran los dioses principales que gobernaban a todos los demás dioses. Sacni Zamthi Ais, por lo tanto, es un representante de Dii Involutii como dios de la riqueza.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_sacni_nithi_eis:0 "$omen_sacni_nithi_eis$"
 omen_sacni_nithi_eis:0 "Sacni Nithi Eis"
 omen_sacni_nithi_eis_desc:0 "Sacni Nithi Eis se traduce como \"amante oculta de las mujeres\". Los dioses ocultos, o Dii Involutii, eran un grupo de dioses que no eran adorados directamente pero que se sabía que eran los dioses principales que gobernaban a todos los demás dioses. Sacni Nithi Eis es por lo tanto un representante de Dii Involutii como diosa de la Fertilidad.\n\n#! Efecto Apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_diana_nemorensis:0 "$omen_diana_nemorensis$"
 omen_diana_nemorensis:0 "Diana Nemorensis"
 omen_diana_nemorensis_desc:0 "La Diana itálica es bastante distinta de la diosa heleno-romana Diana. También conocida por los romanos como Diana Nemorensis, era una diosa de la caza, de las mujeres y de los animales. A menudo se la consideraba una diosa de la luna y se la equiparaba con la diosa griega Artimis.\n\nLos romanos se refieren a Diana como Diana Nemorensis debido a su santuario en el bosque cerca del lago Nemi. El lago Nemi es el lugar más importante de su culto.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
 deity_anterstatai:0 "$omen_anterstatai$"
 omen_anterstatai:0 "Anterstatai"
 omen_anterstatai_desc:0 "Se conoce a la diosa Anterstatai por la tablilla de Agnone que se encontró en la actual Agnone, ubicada cerca de la antigua ciudad de Bovanium. Anterstatai figuraba entre importantes deidades itálicas como Maris y Apulu. \n\nSe teoriza que Anterstatai fue una diosa de la protección fronteriza, deducida de su nombre. Otra teoría es que ella de alguna manera representó el concepto de \"medio\", nuevamente, proveniente de su nombre como \"anter\" o \"inter\" que significa medio. Independientemente de su naturaleza, probablemente fue venerada por los sabelianos y varias otras culturas del centro y sur de Italia.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_anaceta:0 "$omen_anaceta$"
 omen_anaceta:0 "Anaceta"
 omen_anaceta_desc:0 "Anaceta era una diosa de la fertilidad, los cereales y las relaciones maternales. Los sabelianos la adoraban y la equiparaban con la diosa romana Ceres. Anaceta pudo haber sido una deidad compuesta entre Ceres y Angitia. Otra teoría propone que Anaceta era simplemente un rostro de Angitia. Aún así, es posible que Anaceta no haya sido ninguna de las dos cosas y permaneció como una deidad local de los sabelianos independiente de Ceres o Angitia.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_reitia:0 "$omen_reitia$"
 omen_reitia:0 "Reitia"
 omen_reitia_desc:0 "La diosa Reitia es la diosa mejor documentada del norte del mar Adriático. Ella era adorada principalmente por el pueblo veneciano, pero también por las tribus circundantes. Reitia era muy venerada y posiblemente era la deidad principal del pueblo veneciano. Era una diosa que representaba para los venéticos diversos temas como la escritura, la fertilidad, la guerra y la maternidad. A menudo se la representaba con un escudo y una lanza. Su culto siguió siendo relevante hasta bien entrado el período romano, lo que demuestra su importancia en la región.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_uni_astarte:0 "$omen_uni_astarte$"
 omen_uni_astarte:0 "Uni-Astarte"
 omen_uni_astarte_desc:0 "La diosa compuesta de Uni-Astarte era ampliamente venerada en regiones con influencia púnica. La diosa combinó los elementos de Uni y Astarte como la fertilidad, el parto, el amor, la guerra y el planeta Venus. Las dos diosas fueron comparadas a menudo por separado, por lo que no sorprende que fueran veneradas juntas como una única deidad sincrética.\n\n #! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_munthuch:0 "$omen_munthuch$"
 omen_munthuch:0 "Munthuch"
 omen_munthuch_desc:0 "Munthuch era una diosa del amor en el panteón etrusco. Ella era una de las muchas deidades que atendían a la diosa Turan. Munthuch parece haber estado familiarizado con los temas del amor y la salud. Su nombre se deriva de la palabra etrusca para nacimiento, que es 'Munthu', y es probable que fuera uno de los muchos dioses asociados con el parto. También pudo haber sido protectora de los jóvenes y de los bebés.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"
 deity_aesernia:0 "$omen_aesernia$"
 omen_aesernia:0 "Aesernia"
 omen_aesernia_desc:0 "Aesernia era una diosa itálica adorada en el centro y sur de Italia. Se la asociaba principalmente con la agricultura, la fertilidad y la cosecha. Es probable que Aesernia fuera originalmente una diosa samnita, o posiblemente de tribus al sur de los samnitas; sin embargo, parecería que para las personas que la adoraban, ella era una diosa importante. La ciudad de Aesernia lleva su nombre y es probable que fuera la diosa patrona de la ciudad.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_trumsiate:0 "$omen_trumsiate$"
 omen_trumsiate:0 "Trumsiate"
 omen_trumsiate_desc:0 "El dios veneciano Trumsiate se asociaba a menudo con aguas curativas y también era una deidad particularmente masculina, ya que no se ha contabilizado ningún culto femenino al dios (aunque cabe señalar que esto podría deberse a la falta de información sobre el dios). Más tarde, Trumsiate fue equiparado con Apolo durante las conquistas romanas, pero localmente siguió siendo una deidad distinta. Dicho esto, probablemente compartía una importancia cultural similar a la de Apolo al ser comparado con él.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"
 deity_altinos:0 "$omen_altinos$"
 omen_altinos:0 "Altinos"
 omen_altinos_desc:0 "Altinos era un dios adorado principalmente en la ciudad de Altinum por los pueblos venéticos de la zona. Era un dios sanador y probablemente la deidad patrona de Altinum. Debido a esto, probablemente era un dios importante para los venecianos, pero no hay mucha evidencia de que fuera adorado mucho más allá de eso.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_fladukia:0 "$omen_fladukia$"
 omen_fladukia:0 "Fladukia"
 omen_fladukia_desc:0 "En una batalla contra la tribu venética y una tribu de Umbría, un guerrero venético disparó una flecha. En la punta de la flecha se leía una descripción que pedía a la diosa Fladukia de los Marisi que bendijera el disparo. Marisi probablemente se refería a los umbros de la zona en lugar de a la Marisi real, pero la inscripción parece implicar que la diosa Fladukia era adorada por los umbros y probablemente también una diosa adoptada por los venéticos. Debido a la naturaleza de la inscripción, Fladukia era probablemente una diosa de la guerra y posiblemente también una diosa de la suerte.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_mater_matuta:0 "$omen_mater_matuta$"
 omen_mater_matuta:0 "Mater Matuta"
 omen_mater_matuta_desc:0 "La diosa de la luz de la mañana o del amanecer. Mater Matuta era una antigua diosa romana cuyo nombre significa Madre Mañana. Además de esto, Mater Matuta finalmente ganó mucha reverencia por parte de los marineros y también se convirtió en una diosa de los marineros, aunque esto fue limitado. Mater Matuta era una diosa universal en el panteón itálico y era venerada en todas partes.\n\n#! Efecto apoteósico: $naval_apotheosis_effect_tt_description$"
 deity_damia:0 "$omen_damia$"
 omen_damia:0 "Damia"
 omen_damia_desc:0 "Damia es uno de los muchos nombres propuestos para la diosa más conocida como Bona Dea, también conocida como Buena Diosa. Diosa de la fertilidad y la castidad, era venerada principalmente por las mujeres. Sus ritos permitirían a las mujeres beber vino fuerte y realizar sacrificios de sangre, que de otro modo les estaría prohibido. En Roma, sus cultos eran realizados por las vírgenes vestales. Una de las razones por las que su verdadero nombre es tan difícil de determinar es que a los hombres se les prohibió saberlo por completo. A pesar de esto, 1/3 de sus dedicatorias fueron de hombres.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_citizens_effect_tt_description$"
