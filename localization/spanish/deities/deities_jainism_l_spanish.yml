l_spanish:
  ## Generic ##
 deity_diwali:0 "$omen_diwali$"
 omen_diwali:0 "Festival Diwali"
 omen_diwali_desc:4 "Habrá un gran Festival de la Luz para inspirar a nuestras tropas y soldados a medida que avanzan hacia la guerra. Aunque es desfavorable verse obligado a entrar en conflicto y violencia, es un mal necesario para proteger nuestra forma de vida.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_satya:0 "$omen_satya$"
 omen_satya:0 "Satya"
 omen_satya_desc:4 "La verdad es un voto importante en el jainismo, y seremos honestos y veraces al reclutar a los jóvenes de la nación para que apoyen nuestras luchas en la guerra. A medida que acudan en masa a nuestros estandartes, tendremos una mayor mano de obra potencial de la que hemos tenido en mucho tiempo.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_paryushana:0 "$omen_paryushana$"
 omen_paryushana:0 "Festival Paryushana"
 omen_paryushana_desc:4 "Celebraremos un gran Festival Paryushana, inspirando a nuestra gente a hacer votos de estudio para que toda nuestra sociedad pueda obtener una mayor comprensión y sabiduría. Nuestra nación y comunidad seguramente lograrán avances a medida que avancemos con un nuevo enfoque.\n\n#! Efecto apoteósico: $culture_apotheosis_characters_effect_tt_description$"
 deity_aparigraha:0 "$omen_aparigraha$"
 omen_aparigraha:0 "Aparigraha"
 omen_aparigraha_desc:4 "La no posesión es un voto importante en el jainismo y transmitiremos la importancia de este juramento a nuestro pueblo. A medida que nuestra gente se acostumbre más a desprenderse de su riqueza material, podremos recaudar mayores impuestos para el bien de nuestra nación.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
 deity_ahimsa:0 "$omen_ahimsa$"
 omen_ahimsa:0 "Ahimsa"
 omen_ahimsa_desc:4 "La no violencia es un voto importante en el jainismo y realizaremos una gran ceremonia para conmemorar el fin de este salvajismo para nuestra nación. Es hora de que nuestro pueblo encuentre la paz y deje atrás las luchas de la guerra.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"
 deity_roth_teej:0 "$omen_roth_teej$"
 omen_roth_teej:0 "Roth Teej"
 omen_roth_teej_desc:4 "Se llevará a cabo una gran ceremonia Roth Teej para transmitir la importancia de la no posesión entre nuestros seguidores. El oro fluirá entre los diferentes partidos a medida que dejen atrás su codicia por las cosas materiales y en su lugar se preocupen por lo que es bueno para nuestra gente.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_arghya:0 "$omen_arghya$"
 omen_arghya:0 "Ritual Arghya"
 omen_arghya_desc:4 "El Ritual Arghya es aquel en el que nuestros seguidores adoran con diferentes elementos para liberarse del ciclo de renacimiento. Nuestra gente vivirá segura sabiendo que se están acercando cada vez más al Nirvana y a liberarse del Samsara.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
 deity_mahavir_jayanti:0 "$omen_mahavir_jayanti$"
 omen_mahavir_jayanti:1 "Mahavira"
 omen_mahavir_jayanti_desc:5 "Las sabias enseñanzas de Mahavira demostraron las dificultades de contemplar las complejidades de la realidad, y la necesidad de evitar la violencia y los placeres mundanos para comprender sus misterios.\nMahavira fue el vigésimo cuarto Tirthankara y un contemporáneo de Buda que reorganizó el jainismo. Se dice que alcanzó Moksha, la salvación, cerca de la ciudad de Malini."
 deity_bhadrabahu:0 "$omen_bhadrabahu$"
 omen_bhadrabahu:0 "La sabiduría de Bhadrabahu"
 omen_bhadrabahu_desc:2 "Bhadrabahu, el último en recibir indirectamente las enseñanzas del jainismo a través de los Tirthankaras, ha dado forma al jainismo contemporáneo.\nBhadrabahu emigró con miles de seguidores a Belgola desde el norte y estableció una escuela y un templo importantes. Bhadrabahu ka Gyan significa 'Sabiduría de Bhadrabahu'.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_rishabhanatha:0 "$omen_rishabhanatha$"
 omen_rishabhanatha:0 "Rishabhanatha"
 omen_rishabhanatha_desc:2 "La guía del gran Ford-Maker continúa ayudando a nuestra gente a escapar de la reencarnación interminable, inspirando la adhesión a sus sabias enseñanzas y disciplina.\nSe dice que el primer Tirthankara, Rishabhanatha, pronunció su primer sermón en la colina de Shatrunjaya.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_rishabhanatha_moksha:0 "$omen_rishabhanatha_moksha$"
 omen_rishabhanatha_moksha:0 "Rishabhanatha"
 omen_rishabhanatha_moksha_desc:2 "El sorprendente ejemplo de renuncia de Rishabhanatha para adquirir sabiduría y Moksha inspira a nuestra gente a vivir una vida buena y pacífica.\nSe dice que el primer Tirthankara, Rishabhanatha alcanzó Moksha, la salvación, en el Monte Kailash.\n\n#! Efecto de apoteosis: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_neminatha:0 "$omen_neminatha$"
 omen_neminatha:0 "Neminatha"
 omen_neminatha_desc:2 "El primo de Krishna nos muestra que incluso lo divino debe seguir las enseñanzas del jainismo si quieren liberarse del ciclo de la muerte.\nSe dice que el vigésimo segundo Tirthankara, Neminatha, alcanzó Moksha, la salvación, en el monte Girnar.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_parshvanatha:0 "$omen_parshvanatha$"
 omen_parshvanatha:0 "Parshvanatha"
 omen_parshvanatha_desc:2 "Parshvanatha nos enseña que se requiere moderación para vivir una buena vida, así como evitar poseer posesiones, robar y mentir. \n Se dice que Parshvanatha, el vigésimo cuarto Tirthankara, alcanzó Moksha, la salvación, en la colina Parasnath en Jharkhand. \n\n#! Efecto apoteósico: $culture_apotheosis_civic_tech_effect_tt_description$"

