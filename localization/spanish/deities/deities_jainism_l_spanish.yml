 omen_ajitanatha_desc:0 "Ajitanatha, el Segundo de los Veinticuatro Jinas, es un poderoso conquistador tanto en el reino material como en el espiritual; sus símbolos, incluidos la lanza, la maza y el elefante, el animal más regio asociado con la autoridad real, son un recordatorio de su gran fuerza.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 omen_sambhavanatha_desc:0 "Aunque actualmente estamos atados a Avasarpini, la Era Descendente en la que los corazones de los hombres están llenos de debilidad y tendencia hacia el mal, los Tirthankara, o Dioses Enseñadores, como el Señor Sambhavanatha, están aquí con nosotros, para ayudar a guiar nuestros pasos hacia el Samsara.\n\n#! Efecto Apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 omen_abhinandananatha_desc:0 "Abhinandananatha, Ford-Maker, Instructor de las Sagradas Enseñanzas que pueden conducir a la liberación de los interminables estragos del Samsara, quien una vez se sentó a contemplar debajo del árbol priyangu antes de obtener la Sabiduría Suprema, es un Siddha o Alma Liberada.\n\n#! Efecto Apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 omen_sumatinatha_desc:0 "Sumatinatha, el quinto de los veinticuatro Tirthankara, 'cuyas uñas de los pies están afiladas con la piedra de afilar de las diademas de los dioses' según el poema épico Trishashti Shalaka Purusha Charita, está dotado de una inteligencia incomparable y, como el ganso rojo que le es sagrado, es leal, protector y tenaz.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 omen_padmaprabha_desc:0 "Padmaprabha, cuyo mismo nombre evoca imágenes del loto rojo fuego que es su símbolo, nació una vez en el regazo del lujo, gobernando como Rey antes de ser liberado de los placeres ilusorios del mundo después de haber sido expuesto a la Verdad, una salvación que es alcanzable para todos.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 omen_suparshvanatha_desc:0 "Aunque el Séptimo Tirthankara nació de una madre con lepra, ella se curó de su enfermedad mortal antes de su nacimiento, y así Él de los 'Lados Bellos', como llegó a ser conocido, entró al mundo bajo signos auspiciosos, una predicción de su grandeza futura.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 omen_chandraprabha_desc:0 "Cuando la madre de Chandraprabha estaba embarazada del futuro Octavo Tirthankara, fue poseída por el deseo más extraño, uno que no pudo ser disipado a pesar de su imposibilidad; deseaba beber la luna, y, meses después, cuando nació el niño, su aspecto luminoso confirmó su portentoso destino.\n\n#! Efecto Apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 omen_pushpadanta_desc:0 "Pushpadanta, cuya llegada fue predicha por los Dieciséis Sueños Auspiciosos y es cariñosamente conocido como Diente de Flor debido a los antojos peculiares de su madre durante su infancia, evitó los peligros espirituales que su riqueza y estatus mundial le brindaban, negando su carne y abrazando las Enseñanzas Sagradas que lo liberan del Ciclo al que estamos atados.\n\n#! Efecto Apoteosis: $naval_apotheosis_effect_tt_description$\n $deadly_apotheosis_effect_tt_description$"
 omen_shitalanatha_desc:0 "Shitalanatha, el Décimo Tirthankara, fue bendecido con un poder milagroso; cuando alguien consumido por la fiebre o la enfermedad era llevado a la presencia del Dorado, Shitalanatha podía romper la pirexia ardiente con un simple toque. Así como el árbol peepal, su símbolo sagrado, proporciona una sombra refrescante en el calor del día, también los poderes de Shitalanatha ofrecen alivio del horno de este mundo.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 omen_chakreshvari_desc:0 "Chakreshvari, o Apraticakra como a veces se la conoce, es una Vidyadevi, una diosa que instruye a sus seguidores en los santos preceptos. Con cuatro brazos y montada sobre el sagrado Garuda, se eleva por encima de toda la Creación sin esfuerzo, llevando mensajes de esperanza a todos los que tienen oídos para escuchar.\n\n#! Efecto apoteósico: $culture_apotheosis_rel_tech_effect_tt_description$"
 omen_naigamesha_desc:0 "Se cree que Naigamesha, el Protector de los Niños con cabeza de cabra que otorga fertilidad a aquellos que invocan su nombre, está relacionado con el dios de la guerra Kartikeya, lo que subyace a la ferocidad con la que esta deidad puede proteger a quienes ha aceptado proteger. Otro aspecto querido de Naigamesha es su habilidad general para protegerse del mal, lo que lo hace querer por aquellos que buscan su ayuda.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_kalanos:0 "$omen_kalanos$"
 omen_kalanos:0 "Kalanos"
 omen_kalanos_desc:0 "El gimnosofista de Taxila, Kalanos, era un asceta indio que acompañaría a Alejandro a Pérsis, antes de debilitarse por la vejez y optar por morir autoinmolado; suicidio por fuego. Se dice que durante su muerte no se inmutó mientras ardía, e incluso se despidió de sus alumnos griegos, aunque a Alejandro le dijo que se volverían a encontrar en Babilonia al cabo de un año. Alejandro moriría exactamente un año después de malaria en la gran ciudad de Babilonia. Los conquistadores macedonios lo respetaban mucho y cuando se conocieron, Kalanos le ordenó a Alejandro que se desnudara o no le hablaría. En general, Kalanos aprobó muchos aspectos de la filosofía griega, aunque criticó el uso de la ropa. \n\n Algunos pensaban que Kalanos había sido un sabio jainista debido a su actitud, gimnosofismo (desnudez) y partes de sus filosofías, sin embargo, eso se rechaza hoy en día debido a la naturaleza de su muerte que viola Sallekhana, el juramento de morir de hambre, así como el hecho de que la presencia shramánica en Taxila era bastante raro en ese momento.\n\nSu nombre puede estar más cerca de Sphines, según Plutarco, con Kalanos proveniente de 'Kale' (Kallana mitta), que significa 'Saludos, amigo'."

 deity_dandamis:0 "$omen_dandamis$"
 omen_dandamis:0 "Dandamis"
 omen_dandamis_desc:0 "Dandamis, también llamado Mandanes, y quizás originalmente llamado Dandi-Svami (Maestro Dandi), fue un gimnosofista maestro de Kalanos, el gimnosofista que acompañó a Alejandro a Pérsis y profetizó su muerte. Los gimnosofistas que vivían desnudos en la jungla, tumbados sobre las hojas junto a un manantial, eran un problema para Alejandro, y envió a Onescratus para que trajera al líder, Dandamis, ante Alejandro. Onescratus ofreció oro y recompensas si cumplía; de lo contrario, prometió la muerte a manos de Alejandro, el hijo de Zeus. Sin embargo, Dandamis replicó que el Gran Dios del Universo es un proveedor de vida, no un portador de muerte, y se negó incluso a levantar la cabeza. Luego, Alejandro fue personalmente al Svami, y después de mucho negarse a ofrecerle nada, Alejandro mencionó el nombre de Kalanos, el que alguna vez fue estudiante de Dandamis. La conversación que siguió se conoce como el Coloquio Alejandro-Dandamis y se dice que humilló profundamente al gran rey."

 deity_philozoia:0 "$omen_philozoia$"
 omen_philozoia:0 "pitagorismo"
 omen_philozoia_desc:0 "El pitagorismo puede haber sido influenciado por las filosofías sramánicas indias, y muchos conceptos clave sirven como ramas clave de la filosofía. Más directamente para el jainismo, la idea de la dieta pitagórica es bastante adecuada, en la que el consumo de animales viola la santidad de la vida misma. La idea pitagórica de la metempsicosis también es muy similar a la idea india del samsara, donde los humanos y los animales están conectados a través de la reencarnación. Además, aunque no es directamente lo mismo, en el pitagorismo se considera que la violencia representa una fuerza disruptiva del 'Kosmos' o el Universo, que guarda similitud con la idea de Karma negativo. Finalmente, ambas tradiciones vinculan la no violencia con la pureza.\n\n#! Efecto apoteósico: $military_apotheosis_defensive_effect_tt_description$"
