l_spanish:
 ## Vanilla Rewrites ##
 deity_sobek:0 "$omen_sobek$"
 omen_sobek:0 "Sobek"
 omen_sobek_desc:0 "Sobek era una deidad del antiguo Egipto asociada con el cocodrilo del Nilo, así como con la fertilidad, el poder faraónico y la destreza militar. A menudo se le representaba como un hombre con cabeza de cocodrilo o como un cocodrilo completo. Como animal poderoso y temible, el cocodrilo era visto como un símbolo de la fuerza y ​​ferocidad del dios, al mismo tiempo que representaba la fertilidad y las cualidades vivificantes del río Nilo.\n\nSegún el mito, al principio, el Nilo era sólo un pequeño arroyo que fluía a través del desierto. Un día, Sobek se apareció a la gente que vivía a lo largo del río y se ofreció a ayudarlos. Usó su inmensa fuerza para cavar un canal profundo en el lecho del río, permitiendo que el Nilo fluyera libremente y proporcionara agua para los cultivos de la gente. En agradecimiento por su ayuda, el pueblo de Egipto comenzó a adorar a Sobek como un dios poderoso que podía controlar las aguas del Nilo. Con el tiempo, Sobek se convirtió en una deidad popular y se construyeron muchos templos en su honor. Se creía que protegía a la gente de los peligros del Nilo y les traía buena fortuna y prosperidad.\n\n#! Efecto apoteósico: $military_apotheosis_manpower_effect_tt_description$"
 deity_resheph:0 "$omen_resheph$"
 omen_resheph:1 "Reshef"
 omen_resheph_desc:3 "Hombres de todas nuestras tierras se reunirán bajo la bendición de Resheph. Con estos hombres recién descubiertos acudiendo en masa a nuestros estandartes, estamos seguros de que podremos ganar más guerras, ya que nunca nos quedaremos sin soldados para lanzar a nuestros enemigos.\n\nResheph originalmente vino de las tierras de los cananeos y ahora ha sido completamente abrazado por la fe kemética. Alguna vez fue un dios preocupado por las plagas y enfermedades, y ahora se ha convertido en el patrón de los carros y los caballos.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 ## Invictus ##
 deity_wadjet:0 "$omen_wadjet$"
 omen_wadjet:0 "Uadyet"
 omen_wadjet_desc:0 "La deidad Uadjet era adorada en el antiguo Egipto como personificación del norte y matrona y protectora del Bajo Egipto. Tras la unificación con el Alto Egipto, se convirtió en protectora conjunta y patrona de todo Egipto. A menudo representado como una cobra encabritada, Wadjet era especialmente visto como el protector del faraón, listo para atacar y matar a sus enemigos, así como el protector de las mujeres en el parto, habiendo, según la leyenda, amamantado al dios infantil Horus. \n\nWadjet a menudo se representaba como una cobra con cabeza de mujer, una cobra alada, una mujer con cabeza de león o una mujer que llevaba la corona roja del Bajo Egipto.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_bastet:0 "$omen_bastet$"
 omen_bastet:0 "Bastet"
 omen_bastet_desc:0 "Bastet, o Bast como a veces se la conocía, era la antigua diosa egipcia de la protección, los gatos, los perfumes/ungüentos, la fertilidad, el embarazo, los niños, la música, las artes y la guerra, que era adorada ya en la Segunda Dinastía (2890 a. C.). \n\nHija de Ra e Isis, Bastet era adorada en Bubastis, en el Bajo Egipto, originalmente como una diosa leona, un papel que compartía con otras deidades como Sekhmet. \n\nCon el tiempo, Bastet y Sekhmet se caracterizaron como hermanas o dos aspectos de la misma diosa, con Sekhmet representando el aspecto guerrero poderoso y protector y Bastet, que cada vez más era representado como un gato, representando un aspecto más gentil.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_shu:0 "$omen_shu$"
 omen_shu:0 "Shu"
 omen_shu_desc:0 "Shu era uno de los dioses egipcios primordiales, cónyuge y hermano de la diosa Tefnut, y una de las nueve deidades de la Enéada de la cosmogonía de Heliópolis. Era el dios de la paz, los leones, el aire y el viento. \n\nEn la teología heliopolitana, Atum creó la primera pareja de la Enéada, Shu y Tefnut y ellos a su vez se convirtieron en el padre de Nut y Geb y en los abuelos de Osiris, Isis, Set y Neftis. Los bisnietos de Shu son Horus y Anubis.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_atum:0 "$omen_atum$"
 omen_atum:0 "Atum"
 omen_atum_desc:0 "Atum, a veces denominado Atem o Tem, es una deidad importante en la mitología egipcia, que actúa como el padre y fin de toda la creación. \n\nAtum era una deidad autocreada, el primer ser en emerger de la oscuridad y el interminable abismo acuático que existía antes de la creación. Producto de la energía y la materia contenidas en este caos, creó a sus hijos, las primeras deidades, a partir de la soledad. Produjo de su propio estornudo, o en algunos relatos, semen, Shu, el dios del aire, y Tefnut, la diosa de la humedad. \n\nEl hermano y la hermana, curiosos por las aguas primitivas que los rodeaban, fueron a explorar las aguas y desaparecieron en la oscuridad. Incapaz de soportar su pérdida, Atum envió un mensajero de fuego, el Ojo de Ra, a buscar a sus hijos. Las lágrimas de alegría que derramó a su regreso fueron las de los primeros seres humanos.\n\n#! Efecto Apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_thoth:0 "$omen_thoth$"
 omen_thoth:0 "Thot"
 omen_thoth_desc:0 "Thoth era el dios egipcio de la sabiduría, la escritura, los jeroglíficos, la ciencia, la magia, el arte, el juicio y los muertos. En el arte, a menudo se le representaba como un hombre con cabeza de ibis o de babuino, animales sagrados para él. Su contraparte femenina era Seshat y su esposa era Ma'at. \n\nLa mitología egipcia atribuye a Thoth la creación del calendario de 365 días. Originalmente, según el mito, el año duraba sólo 360 días y Nut era estéril durante esos días, incapaz de tener hijos. Thoth apostó con la Luna por 1/72 de su luz (360/72 = 5), o 5 días, y ganó. Durante estos 5 días, Nut y Geb dieron a luz a Osiris, Set, Isis y Neftis. \n\nEn el mito central de Osiris, Thoth le da a Isis las palabras para restaurar a su marido, permitiéndole a la pareja concebir a Horus. Después de una batalla entre Horus y Set, Thoth ofrece consejos y proporciona sabiduría.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_neith:0 "$omen_neith$"
 omen_neith:0 "Neith"
 omen_neith_desc:0 "Neith era una de las primeras deidades del antiguo Egipto. Se decía que ella era la primera y principal creadora, que creó el universo y todo lo que contiene, y que ella gobierna su funcionamiento. Era la diosa del cosmos, del destino, de la sabiduría, del agua, de los ríos, de las madres, del parto, de la caza, del tejido y de la guerra. \n\n En algunos mitos de la creación del antiguo Egipto, Neith fue identificada como la madre de Ra y Apep. Cuando fue identificada como una diosa del agua, fue vista como la madre de Sobek, el cocodrilo. Fue debido a esta asociación con el agua, es decir, el Nilo, que durante el emparejamiento de deidades a veces se la consideraba la esposa de Khnum y otras veces se la asociaba con la fuente del río Nilo. \n\nEn ese centro de culto, ella también estaba asociada con la Perca del Nilo, además de ser la diosa de la tríada.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_nephthys:0 "$omen_nephthys$"
 omen_nephthys:0 "Neftis"
 omen_nephthys_desc:0 "Miembro de la Gran Enéada de Heliópolis en la mitología egipcia, Neftis era hija de Nut y Geb, esposa de Set y madre de Anubis. Por lo general, se la emparejaba con su hermana Isis en los ritos funerarios debido a su papel como protectoras de la momia y el dios Osiris y como hermana y esposa de Set. \n\nSe la asociaba con el luto, la noche/oscuridad, el servicio (específicamente los templos), el parto, los muertos, la protección, la magia, la salud, el embalsamamiento y la cerveza.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_tefnut:0 "$omen_tefnut$"
 omen_tefnut:0 "Tefnut"
 omen_tefnut_desc:0 "Tefnut es una deidad egipcia de la humedad, el aire húmedo, el rocío y la lluvia en la religión del Antiguo Egipto, y es hermana y consorte del dios del aire Shu y madre de Geb y Nut, así como hija de Atum. \n\n Tefnut es una deidad leonina y aparece como humana con cabeza de leona cuando se la representa como parte de la Gran Enéada de Heliópolis. La otra representación frecuente es la de una leona, pero Tefnut también puede representarse como completamente humana. En su forma total o semi antropomórfica, se la representa con una peluca, rematada con una serpiente uraeus o un uraeus y un disco solar, y a veces se la representa como una serpiente con cabeza de león.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_geb:0 "$omen_geb$"
 omen_geb:0 "Geb"
 omen_geb_desc:0 "Geb era el dios egipcio de la tierra y miembro mitológico de la Enéada de Heliópolis. También podría considerarse el padre de las serpientes. En el antiguo Egipto se creía que la risa de Geb creaba terremotos y permitía que crecieran los cultivos. \n\nConsorte de Nut e hijo de Shu y Tefnut, Geb es también padre de Osiris, Isis, Set, Neftis y Horus. Debido a sus roles similares en los mitos, a menudo se le ha equiparado con el dios griego/Titán Kronos.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_nut:0 "$omen_nut$"
 omen_nut:0 "Nut"
 omen_nut_desc:0 "Nut es la diosa del cielo, las estrellas, el cosmos, las madres, la astronomía y el universo en la antigua religión egipcia. Se la veía como una mujer desnuda cubierta de estrellas arqueándose sobre la Tierra, o como una vaca. Fue representada con el cartel del cántaro de agua que la identifica. \n\n Nut es hija de Shu y Tefnut, mientras que su hermano y esposo es Geb. Tuvo cuatro hijos: Osiris, Set, Isis y Neftis, a los que se suma Horus en una versión greco-egipcia del mito de Nut y Geb. Se la considera una de las deidades más antiguas del panteón egipcio, y su origen se encuentra en la historia de la creación de Heliópolis.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_mut:0 "$omen_mut$"
 omen_mut:0 "Mut"
 omen_mut_desc:0 "Mut, también conocida como Maut y Mout, era una diosa madre adorada en el antiguo Egipto. Su nombre significa literalmente madre en el antiguo idioma egipcio. Mut tenía muchos aspectos y atributos diferentes que cambiaron y evolucionaron mucho a lo largo de los miles de años de la cultura del antiguo Egipto. \n\nMut era considerado una deidad primordial, asociada con las aguas primordiales de Nu de las cuales nació todo en el mundo. A veces se decía que Mut había dado origen al mundo mediante partenogénesis, pero más a menudo se decía que tenía un marido, el dios creador solar Amón-Ra. Aunque sus seguidores creían que Mut era la madre de todo en el mundo, se la asociaba particularmente como la madre del niño dios lunar Khonsu. En el templo de Karnak en Tebas, la capital de Egipto, la familia de Amón-Ra, Mut y Khonsu eran adoradas juntas como la Tríada Tebana. \n\nEn el arte, Mut generalmente era representada como una mujer que llevaba la doble corona de los reyes de Egipto, representando su poder sobre toda la tierra.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_maat:0 "$omen_maat$"
 omen_maat:0 "Ma'at"
 omen_maat_desc:0 "Maat o Maʽat se refiere a los conceptos del antiguo Egipto de verdad, equilibrio, orden, armonía, ley, moralidad y justicia. Maat era también la diosa que personificaba estos conceptos y regulaba las estrellas, las estaciones y las acciones de los mortales y las deidades que habían traído el orden del caos en el momento de la creación. Su opuesto ideológico era Isfet, que significa injusticia, caos, violencia o hacer el mal. \n\nDespués de su papel en la creación y de impedir continuamente que el universo volviera al caos, su papel principal en la religión del antiguo Egipto tenía que ver con el Pesaje del Corazón que tenía lugar en la Duat. Su pluma era la medida que determinaba si las almas (consideradas que residen en el corazón) de los difuntos alcanzarían con éxito el paraíso de la otra vida.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"
 deity_khonsu:0 "$omen_khonsu$"
 omen_khonsu:0 "Jonsu"
 omen_khonsu_desc:0 "Khonsu es el antiguo dios egipcio de la Luna. Su nombre significa \"viajero\", y esto puede estar relacionado con el viaje nocturno percibido de la Luna a través del cielo. Junto con Thoth marcó el paso del tiempo. Khonsu jugó un papel decisivo en la creación de nueva vida en todos los seres vivos. En Tebas formó parte de una tríada familiar (la 'Tríada Tebana') con Mut como madre y Amón como padre. \n\n En el arte, Khonsu se representa típicamente como una momia con el símbolo de la infancia, un mechón de cabello, así como el collar de menat con cayado y mayal. Tiene estrechos vínculos con otros niños divinos como Horus y Shu. A veces se le muestra llevando una cabeza de águila o de halcón como Horus, con quien está asociado como protector y sanador, adornado con el disco solar y la luna creciente.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_set:0 "$omen_set$"
 omen_set:0 "Seth"
 omen_set_desc:0 "Set es un dios de los desiertos, las tormentas, el desorden, la violencia y los extranjeros en la religión del antiguo Egipto. Era marido y hermano de Neftis, e hijo de Geb y Nut. Set tuvo un papel positivo al acompañar a Ra en su barca para repeler a Apep, la serpiente del Caos. Set tuvo un papel vital como combatiente reconciliado. Él era el señor de la tierra roja (desierto), donde era el equilibrio del papel de Horus como señor de la tierra negra (suelo). \n\nEn el mito de Osiris, el mito egipcio más importante, Set es retratado como el usurpador que mató y mutiló a su propio hermano, Osiris. La esposa de Osiris, Isis, volvió a montar su cadáver y resucitó a su marido muerto con la ayuda de la diosa Neftis. \n\nLa resurrección duró lo suficiente como para concebir a su hijo y heredero, Horus. Horus buscó vengarse de Set y muchos de los antiguos mitos egipcios describen sus conflictos.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_hapi:0 "$omen_hapi$"
 omen_hapi:0 "Hapi"
 omen_hapi_desc:0 "Hapi era el dios de la inundación anual del Nilo en la religión del antiguo Egipto. La inundación depositó un rico limo (suelo fértil) en las orillas del río, lo que permitió a los egipcios cultivar. Hapi fue muy celebrado entre los egipcios. Algunos de los títulos de Hapi eran \"Señor de los peces y pájaros de las marismas\" y \"Señor del río que trae la vegetación\". \n\nHapi se representa típicamente como una figura andrógina con un gran vientre y grandes pechos caídos, vestido con un taparrabos y una barba postiza ceremonial.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 omen_anuket:0 "Anuket"
 omen_anuket_desc:0 "Anuket era una antigua diosa egipcia adorada en la región del río Nilo. Era la diosa de las cataratas del Nilo, particularmente de los rápidos de Asuán, y estaba asociada con la inundación anual del Nilo. Anuket también era considerada una deidad protectora del parto y proveedora de agua vivificante. En el arte, Anuket a menudo era representada como una mujer que llevaba un alto tocado de plumas y sostenía un cetro o el símbolo ankh de la vida.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"
 deity_heka:0 "$omen_heka$"
 omen_heka:0 "Heka"
 omen_heka_desc:0 "Heka era el antiguo dios egipcio de la magia, representado como un hombre que llevaba una gran corona con una cobra en la frente. Heka era considerada una de las deidades egipcias más antiguas y poderosas, asociada con la creación del mundo y la capacidad de controlar las fuerzas de la naturaleza. Heka generalmente era representado como un hombre sosteniendo el ankh, el símbolo de la vida, o un cetro que representa su poder.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_seshat:0 "$omen_seshat$"
 omen_seshat:0 "Seshat"
 omen_seshat_desc:0 "Seshat era una antigua diosa egipcia de la sabiduría, el conocimiento y la escritura. A menudo se la representaba con un vestido de piel de leopardo y un tocado hecho de una estrella con un arco y una flecha, simbolizando su papel como diosa de la escritura y el mantenimiento de registros. Se creía que Seshat era responsable de registrar los logros de los faraones y otras personas importantes, y estaba estrechamente asociado con la construcción de templos y otras estructuras monumentales. También se creía que era la diosa de las matemáticas, la astronomía y la arquitectura, y se la asociaba con la medición del tiempo y el mantenimiento de calendarios. A veces se representaba a Seshat como la consorte del dios Thoth, que también estaba asociado con la escritura y el conocimiento. También estaba estrechamente asociada con el faraón y se creía que era su escriba y registradora personal.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_apis:0 "$omen_apis$"
 omen_apis:0 "Apis"
 omen_apis_desc:0 "Apis era una deidad importante en la religión del antiguo Egipto, específicamente asociada con la ciudad de Menfis. Apis era un dios toro, representado como un toro viviente que se creía que era una manifestación del dios Ptah. El toro fue identificado por marcas específicas, incluido un triángulo blanco en su frente, símbolo de la diosa Hathor. Apis era considerado un dios muy importante de la fertilidad y la fuerza, y estaba asociado con la realeza y la renovación de la vida. Se creía que el toro era un conducto del poder divino y era tratado con gran reverencia y respeto. Cuando un toro Apis moría, era momificado y se le daba un gran entierro, completo con todos los adornos del funeral de un faraón.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_min:0 "$omen_min$"
 omen_min:0 "mín."
 omen_min_desc:0 "Min era un dios de la fertilidad del antiguo Egipto, a menudo representado como un hombre con un falo erecto y con una corona de plumas. Se le asociaba con la cosecha y el crecimiento de los cultivos, así como con la potencia sexual masculina. Min también era un dios del desierto y se creía que tenía el poder de proteger a los viajeros de cualquier daño. A menudo se le representaba sosteniendo un mayal, símbolo de su poder sobre la tierra y los cultivos. Min era adorado en todo el antiguo Egipto, pero su centro de culto estaba ubicado en la ciudad de Akhmim en el Alto Egipto, donde era conocido como \"Min de Akhmim\". Su festival anual, conocido como el \"festival del falo\", se celebraba en su honor con mucha fanfarria y juerga.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
 deity_heqet:0 "$omen_heqet$"
 omen_heqet:0 "Heqet"
 omen_heqet_desc:0 "Heqet era una diosa de la fertilidad, el parto y la renovación en la religión del antiguo Egipto. A menudo se la representaba en forma de rana, que se asociaba con el Nilo y sus propiedades vivificantes. Se creía que Heqet ayudaba a las mujeres durante el parto y también se asociaba con el proceso de renacimiento y regeneración. En algunos mitos, se decía que ella ayudó a crear el mundo y era vista como una poderosa fuerza de creación. A menudo se representaba a Heqet con la cabeza de una rana, a veces sosteniendo una flor de loto o una varita de papiro, y a veces se le mostraba junto al dios Khnum, de quien se creía que daba forma a los seres humanos en un torno de alfarero.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_satis:0 "$omen_satis$"
 omen_satis:0 "Satisface"
 omen_satis_desc:0 "Satis era una antigua diosa egipcia del Nilo, la fertilidad y la guerra. Era adorada como la personificación de la inundación del río Nilo, que trajo agua y fertilidad a la tierra. Como diosa de la guerra, a Satis se la representaba a menudo sosteniendo un arco y flechas y llevando la corona roja del Bajo Egipto. Satis también estaba asociada con la diosa Hathor, que a veces era representada como su hija. Se creía que juntos eran responsables de las inundaciones anuales del Nilo y de la fertilidad de la tierra. Satis era particularmente adorada en la ciudad sureña de Elefantina, donde se creía que protegía la frontera de Egipto y al pueblo de la invasión. En el arte, Satis a menudo era representada como una mujer con cabeza de leona o de halcón. A veces también se la mostraba usando la corona blanca del Alto Egipto, que simbolizaba su conexión con la parte sur del país.\n\n#! Efecto apoteósico: $military_apotheosis_defensive_effect_tt_description$"
 deity_wepwawet:0 "$omen_wepwawet$"
 omen_wepwawet:0 "Wepwawet"
 omen_wepwawet_desc:0 "Wepwawet era un dios chacal del antiguo Egipto asociado con la guerra, la caza y los difuntos. A menudo se le representaba como un chacal o un hombre con cabeza de chacal, llevando una corona de plumas o un disco solar. Wepwawet era considerado un guía y protector de los faraones y sus ejércitos, y a menudo se lo representaba guiándolos en la batalla o actuando como explorador. También se le asoció con la apertura del camino hacia el más allá y a veces se le conocía como el \"Abridor de los Caminos\". Wepwawet fue particularmente importante en la ciudad de Asyut en el Alto Egipto, donde era adorado como la deidad patrona. Su culto se extendió por todo Egipto y a menudo se sincretizaba con otros dioses, como Anubis y Horus.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_meretseger:0 "$omen_meretseger$"
 omen_meretseger:0 "Meretseger"
 omen_meretseger_desc:0 "Meretseger era una diosa adorada en el antiguo Egipto, principalmente en la región de Tebas. Su nombre significa \"La que ama el silencio\" o \"La que ama la paz\". Meretseger se asociaba principalmente con la montaña sagrada de la necrópolis tebana, conocida como \"el pico del oeste\" y \"la montaña del oeste\". Meretseger fue representada como una cobra o como una mujer con cabeza de cobra, a menudo usando un tocado con el disco solar y cuernos de Hathor. Se la consideraba protectora de las tumbas reales en la Necrópolis Tebana y también se la asociaba con la justicia, el castigo y el más allá.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_qetesh:0 "$omen_qetesh$"
 omen_qetesh:0 "Qetesh"
 omen_qetesh_desc:0 "Qetesh era una diosa que provenía de influencias de los antiguos cananeos que emigraron a Egipto durante la edad del bronce. A pesar de su influencia cananea, era principalmente una diosa egipcia nacida de ideas cananeas e incluso considerada como la consorte de Baal. Fue ampliamente adorada en todo el Levante y Siria, así como en el delta del Nilo. Se la asocia comúnmente con el amor, la fertilidad, la belleza, el sexo y el placer. A veces también se la asociaba con la guerra y la caza. Qetesh fue representada como una mujer joven y hermosa que llevaba un vestido largo y suelto y un tocado con dos plumas. En algunas representaciones, se la muestra montada sobre el lomo de un león o parada sobre una serpiente.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_apedmak:0 "$omen_apedmak$"
 omen_apedmak:0 "Apedmak"
 omen_apedmak_desc:0 "Apedmak era un dios adorado principalmente en la antigua Nubia. Apedemak se entiende principalmente como un dios de la guerra. Por extensión, también se le considera un dios de la conquista y la destreza militar. Durante los períodos del Imperio Nuevo, los nubios adoptaron al dios egipcio Amón como dios principal del imperio. Después de los primeros testimonios de Apedemak durante el período meroítico, parece que Amón tenía la misma importancia o fue superado por el indígena Apedemak. Las asociaciones de Amón con el agua y la fertilidad (relacionadas con la inundación del Nilo) también pertenecían a Apedemak. Lleva una armadura de cuero o una coraza y lleva un arco y una flecha en la mano, armas que estuvieron asociadas con los nubios a lo largo de su historia.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_arensuphis:0 "$omen_arensuphis$"
 omen_arensuphis:0 "Arensuphis"
 omen_arensuphis_desc:0 "Arensnuphis es una deidad adorada en el antiguo reino nubio de Kush. Fue representado como un hombre con cabeza de carnero o simplemente como un carnero. Los orígenes de Arensnuphis no están bien documentados, pero probablemente estaba asociado con la fertilidad y era adorado como protector de la agricultura y la cosecha. También se le asoció con el más allá y, en ocasiones, se le representó en contextos funerarios. Arensnuphis fue particularmente importante en el sitio de Meroe. En Meroe, Arensnuphis era una de las principales deidades adoradas junto con otros dioses nubios y egipcios, como Amón, Mut e Isis.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_sebiumeker:0 "$omen_sebiumeker$"
 omen_sebiumeker:0 "Sebiumeker"
 omen_sebiumeker_desc:0 "Sebiumeker era un dios de Nubia cuyo nombre significa \"el que hace feliz al Ka\". El ka era un concepto que se refería a la fuerza vital o esencia espiritual de un individuo. En algunas representaciones, Sebiumeker es representado como un babuino sentado sosteniendo un cetro, mientras que en otras es representado como un hombre de pie con un tocado de plumas y sosteniendo un cayado y un mayal, que eran símbolos de la realeza y la fertilidad agrícola.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_mandulis:0 "$omen_mandulis$"
 omen_mandulis:0 "Mandulis"
 omen_mandulis_desc:0 "Mandulis (también escrito Mandoulis o Mandolaus) era una deidad solar nubia asociada con el sol, la luz y el poder de la realeza, y a menudo se le representaba como una figura humana que llevaba una corona o un tocado rematado con un disco solar. A veces se le compara con el dios Horus. Mandulis estaba estrechamente asociado con la familia real de Meroë, y se cree que los reyes nubios se veían a sí mismos como sus representantes terrenales. También se le asociaba con la fertilidad y se creía que tenía el poder de asegurar el crecimiento de las cosechas y la prosperidad del reino.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"
 deity_amesemi:0 "$omen_amesemi$"
 omen_amesemi:0 "Amesemi"
 omen_amesemi_desc:0 "Amesemi era una antigua deidad nubia asociada con el parto, la fertilidad, pero también con la protección. El culto a Amesemi estaba estrechamente ligado al templo de Min, una importante deidad de la fertilidad que era adorada en Akhmim. Se cree que Amesemi era considerada una forma de la diosa Isis, que también estaba asociada con el parto y la fertilidad. Se creía que la diosa tenía el poder de proteger a las mujeres durante el parto y garantizar el crecimiento saludable de los bebés. También se decía que era la consorte del dios nubio Apedemak.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_heryshaf:0 "$omen_heryshaf$"
 omen_heryshaf:0 "Heryshaf"
 omen_heryshef_desc:0 "Heryshaf, el gran dios de Henen-Nesut. El Gobernante de las Riberas era un dios creador y de la fertilidad que provenía directamente de las aguas primordiales de Nun. Era uno de los dioses más antiguos del panteón egipcio; sin embargo, en ese momento, tanto su ciudad como Aquel que está en su lago estaban comenzando a ser reemplazados por Heracles del panteón helénico. Henen-Nesut se convirtió en Heracleópolis y Heryshef en Heracles. Atrás quedaron los días en los que Henen-Nesut y Heryshaf encabezaban las dinastías egipcias del vigésimo Nomo. Fue representado como un carnero o un hombre con cabeza de carnero.\n\nLo hiciste, encontraste la deidad más específica de todo el juego. Gracias por prestar atención a las deidades en este juego ~ Izn\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$\n $sandstorm_apotheosis_effect_tt_description$"
