l_spanish:
 deity_osiris:0 "$omen_osiris$"
 omen_osiris:1 "Osiris"
 omen_osiris_desc:3 "Osiris ha sido durante mucho tiempo una de las deidades más importantes de nuestro panteón. Es conocido como \"El Hermoso\", \"Rey de la Vida\", \"El Señor del Amor\" y \"Señor Eterno\", y es el dios patrón del inframundo, así como de la otra vida y el renacimiento. \n\nEl dios está asociado con el Nilo vivificante, la cosecha y la vida eterna. Se dice que algún día resucitará, trayendo consigo a todos los dignos, ya sean plebeyos o los antiguos reyes egipcios.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_sekhmet:0 "$omen_sekhmet$"
 omen_sekhmet:1 "Sekhmet"
 omen_sekhmet_desc:3 "Sekhmet, la leona de Memphis y Leontopolis, es nuestra diosa patrona de la guerra, la caza y la curación. En tiempos del pasado antiguo, a menudo se la veía como una de las principales deidades de los antiguos faraones, y se dice que los llevó a la guerra.\n\nAunque se le han dado muchos nombres, incluidos \"La que mutila\" y \"Señora del pavor\", Sekhmet ha sido una diosa que ha protegido a nuestro pueblo durante siglos. Al menos cuando hayamos calmado su ira y la hayamos persuadido a nuestro lado.\n\n#! Efecto apoteósico: $military_apotheosis_defensive_effect_tt_description$"
 deity_anhur:0 "$omen_anhur$"
 omen_anhur:1 "Anhur"
 omen_anhur_desc:3 "Con su bendición, nuestros hombres mostrarán tan poca piedad como la que muestra el 'Asesino de enemigos'. La bendición de Anhur fortalecerá la disciplina de nuestros soldados y les permitirá lograr las victorias que buscamos.\n\nAnhur ha sido el patrón de los ejércitos egipcios durante mucho tiempo y, en muchos sentidos, es la personificación de la fuerza de Egipto. Los griegos equiparan al gran dios con su propio dios guerrero Ares.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_resheph:0 "$omen_resheph$"
 omen_resheph:1 "Reshef"
 omen_resheph_desc:3 "Hombres de todas nuestras tierras se reunirán bajo la bendición de Resheph. Con estos hombres recién descubiertos acudiendo en masa a nuestros estandartes, estamos seguros de que podremos ganar más guerras, ya que nunca nos quedaremos sin soldados para lanzar contra nuestros enemigos.\n\nAunque Resheph originalmente vino de las tierras de los cananeos, ha sido completamente aceptado en nuestra propia fe. Alguna vez fue un dios preocupado por las plagas y enfermedades, y ahora se ha convertido en el patrón de los carros y los caballos.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_ptah:0 "$omen_ptah$"
 omen_ptah:1 "Ptah"
 omen_ptah_desc:3 "Con Ptah dirigiendo las manos de nuestros artesanos, podrán obtener sabiduría y conocimiento a los que de otro modo no podrían aspirar.\n\nPtah fue una vez quien creó la vida y, por lo tanto, a todos los mortales. Tiene un culto muy conocido en su honor y, a menudo, ha desempeñado un papel importante para la propia familia real.\n\nLos fenicios y cananeos son conocidos por llamar al dios Kothar cuando es adorado en sus tierras.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_anubis:0 "$omen_anubis$"
 omen_anubis:1 "Anubis"
 omen_anubis_desc:3 "El gran protector de las tumbas y guía de las almas traerá a nuestras manos las riquezas de la nación. Con nueva prosperidad y riqueza, nuestra gente seguramente verá crecer y expandirse como nunca antes.\n\nAnubis es bien conocido como el guía de las almas, así como también como guardián de las tumbas y de los propios muertos. Últimamente, algunos macedonios han comenzado a referirse al dios como Hermanubis, combinando el dios antiguo con el del griego Hermes.\n\n #! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_amun:0 "$omen_amun$"
 omen_amun:1 "Amón"
 omen_amun_desc:3 "Amón bendecirá y justificará a nuestra nación con su presencia, concediéndonos permiso para expandirnos como queramos. Aunque son los más cansados ​​de nuestras largas guerras, incluso ellos quedarán convencidos con la ayuda de esta deidad.\n\nAmón se ha vuelto recientemente más popular tanto entre las tribus vecinas como entre los griegos de Cirenaica y el extranjero. Esto se volvió particularmente notable después de que el gran conquistador Alexandros detuviera sus campañas contra los persas para viajar hasta el oráculo en Siwah para recibir su bendición.\n\nAlgunos macedonios han comenzado a llamarlo Zeus Ammon, combinando al dios con su Zeus griego.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"
 deity_hathor:0 "$omen_hathor$"
 omen_hathor:1 "Hathor"
 omen_hathor_desc:3 "La gran diosa del cielo Hathor bendecirá a nuestros comerciantes y mercaderes con abundantes recursos, bienes extranjeros y nuevos contactos fructíferos. Con riqueza en sus manos, nuestros comerciantes seguramente podrán expandir sus operaciones y traer tesoros aún mayores a casa.\n\nAunque ella vive y reside en tierras extranjeras, todavía adoramos y le pedimos a Hathor su guía. Es bien conocida como consorte y madre de varios dioses importantes, y ha sido objeto de adoración por sus diferentes dones: música, danza, alegría, sexualidad, feminidad y la propia luz del sol.\n\nLos helénicos a menudo la comparan con su propia Hera.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_horus:0 "$omen_horus$"
 omen_horus:1 "Horus"
 omen_horus_desc:3 "Horus mira a nuestro pueblo y nos concede su bendición, y la paz una vez más envolverá nuestras tierras. Con el dios mismo protegiendo a nuestra nación, solo los más resentidos continuarán con sus caminos problemáticos.\n\nHorus, que alguna vez fue una deidad patrona de la ciudad de Nekhen, ha crecido hasta convertirse en uno de los dioses más importantes del panteón. Conocido como dios del cielo, se dice que es el responsable del sol, los cielos y la luna, y es el dios del propio Egipto.\n\nHay muchas historias de las luchas entre Horus y su hermano Set, el patrón del desierto. En épocas posteriores, a Horus se le ha comparado a menudo con el Apolo griego.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_isis:0 "$omen_isis$"
 omen_isis:1 "Isis"
 omen_isis_desc:3 "La gran diosa Isis bendecirá a nuestro pueblo con fertilidad y cosechas como nunca antes se habían visto. Finalmente podremos dejar atrás los años de hambruna y ver a nuestra gente crecer una vez más para ser fuerte y saludable.\n\nIsis es una de las diosas más conocidas, y algunos de nuestros vecinos también la han compartido y acogido. Han surgido cultos y devotos en su honor en todo el mundo helénico, y ella se ha convertido en parte de sus panteones.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
 deity_ra:0 "$omen_ra$"
 omen_ra:0 "Ra"
 omen_ra_desc:0 "Ra es una de las deidades más antiguas e importantes del panteón egipcio, como creador de la vida y dios del orden y los reyes. Fue adorado en particular por los primeros faraones de Egipto, y sus sacerdotes y ceremonias a menudo estaban estrechamente vinculados a los propios monarcas.\n\nComo creador de todo, Ra es considerado el origen del universo, así como la mayoría de las otras deidades adoradas en tierras egipcias, y el portador de vida a las tierras fértiles alrededor del Nilo. Entre los griegos, Ra se asocia a menudo con Helios o Apolo.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 # Heirs of Alexander #
 deity_sobek:0 "$omen_sobek$"
 omen_sobek:0 "Sobek"
 omen_sobek_desc:0 "Sobek es una deidad del antiguo Egipto que ha sido adorada desde los primeros días del reino, y el dios tutelar de Shedet, la ciudad conocida como Krokodilopolis entre los griegos. La deidad es honrada como protectora contra los peligros del Nilo y generalmente se la asocia con los faraones de Egipto.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_banebdjedet:0 "$omen_banedbjedet$"
 omen_banebdjedet:0 "Banebdyedet"
 omen_banebdjedet_desc:0 "Es una deidad importante que a menudo se ha asociado con varios de los faraones y es el dios tutelar de Mendes. Banebdjed generalmente se asocia estrechamente con Osiris, el dios patrón de la otra vida, y algunos afirman que es la personificación del poder y el espíritu de Osiris.\n\nEntre los griegos, a Banebdjed a menudo se le conoce como la \"Cabra de Mendes\", aunque generalmente se le representa con cabeza de carnero.\n\n#! Apoteosis Efecto: $culture_apotheosis_characters_effect_tt_description$"
 deity_thoth_hermes:0 "$omen_thoth_hermes$"
 omen_thoth_hermes:0 "Thot-Hermes"
 omen_thoth_hermes_desc:0 "Se trata de una deidad sincrética entre el Hermes griego y el Thoth egipcio, que se ha vuelto particularmente popular entre los griegos que se trasladaron a Egipto después de la invasión de Alejandro y la dinastía ptolemaica tomó el control de la zona. Al igual que sus dos deidades originales, se le asocia con el más allá, con la escritura y, en parte, como un dios de la sabiduría.\n\nEn los cuentos donde aparecen, a menudo asumen el papel de un consejero sabio o, en algunos casos raros, un embaucador.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"
