l_spanish:
 ## Generic Deities ##
 deity_theispas:0 "$omen_theispas$"
 omen_theispas:1 "Theispas"
 omen_theispas_desc:3 "Nuestros hombres se inspirarán en el propio Theispas, y su disciplina y moral estarán infundidas con la fuerza de las tormentas. Mientras nuestros soldados luchan por la supremacía contra nuestros enemigos, estamos seguros de que obtendremos más victorias que nunca.\n\n#! Efecto apoteósico: $military_apotheosis_military_experience_effect_tt_description$"
 deity_shivini:0 "$omen_shivini$"
 omen_shivini:1 "Shivini"
 omen_shivini_desc:3 "Todos nuestros jóvenes acudirán en masa a nuestros estandartes mientras invocamos a Shivini para que ilumine a nuestros ejércitos. Con nuestros ejércitos llenos de nuevos reclutas, estamos seguros de que tendremos la mano de obra necesaria para nuestras guerras durante bastante tiempo.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_arubani:0 "$omen_arubani$"
 omen_arubani:1 "Arubani"
 omen_arubani_desc:3 "La esposa del dios Supremo iluminará el camino de nuestros eruditos y sabios en su búsqueda de la sabiduría. A medida que nuestros académicos traigan a casa este don de sabiduría, seguramente trabajarán de manera más efectiva para lograr los avances tecnológicos que nuestra gente ha estado buscando.\n\n#! Efecto apoteósico: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_epaninaue:0 "$omen_epaninaue$"
 omen_epaninaue:1 "Epaninaue"
 omen_epaninaue_desc:3 "Suplicamos a la diosa de la tierra que nos conceda ricos minerales y nos ayude en nuestra búsqueda de más riqueza. A medida que nuestra gente acumule riquezas incalculables, estamos seguros de que podremos traer prosperidad y beneficios a toda nuestra sociedad.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
 deity_khaldi:0 "$omen_khaldi$"
 omen_khaldi:1 "Jaldi"
 omen_khaldi_desc:3 "El dios supremo, el más destacado de todos ellos, bendecirá a nuestro pueblo a medida que nos expandamos por las tierras. Con el propio Khaldi a nuestro lado, nuestro pueblo seguramente dejará de lado sus recelos y tomará sus armas para nuestra nación una vez más.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"
 deity_dsvininaue:0 "$omen_dsvininaue$"
 omen_dsvininaue:1 "Dsvininaue"
 omen_dsvininaue_desc:3 "Le pedimos a la diosa del mar y los ríos que proteja a nuestros comerciantes mientras viajan por las tierras en cumplimiento de sus deberes. Con Dsvininaue ayudando a nuestros comerciantes, esperamos ver florecer sus habilidades y redes comerciales, trayendo riqueza y riqueza a casa.\n\n #! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_bagvarti:0 "$omen_bagvarti$"
 omen_bagvarti:1 "Bagvarti"
 omen_bagvarti_desc:3 "La esposa del dios supremo traerá paz y prosperidad a nuestra nación, resolviendo los conflictos de nuestros compatriotas. Sólo los tontos se atreverían a oponerse a la gran Bagvarti y su justicia, y los disidentes seguramente depondrán sus armas y dejarán atrás su resentimiento a medida que avancemos.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_huba:0 "$omen_huba$"
 omen_huba:1 "Huba"
 omen_huba_desc:3 "La madre de todos los vivientes traerá vida y prosperidad a nuestra nación, asegurando nuestras cosechas y partos seguros. Con su bendición, estamos seguros de que veremos el fin de los años de desolación y que nuestros jóvenes crezcan sanos y salvos.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_nane:0 "$omen_nane$"
 omen_nane:1 "Nane"
 omen_nane_desc:3 "Pedimos al sabio Nane que bendiga a nuestros soldados con disciplina en la batalla, para que podamos ganar nuestras guerras y proteger nuestra nación. Con ella a nuestro lado, estamos seguros de que nuestros hombres se sentirán inspirados a llegar más lejos que nadie antes.\n\n#! Efecto apoteósico: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_mihr:0 "$omen_mihr$"
 omen_mihr:1 "Mihr"
 omen_mihr_desc:3 "Con la luz y la verdad a nuestro lado, la bendición de Mihr inspirará a nuestros jóvenes a defender nuestras tierras de enemigos extranjeros. A medida que acuden en masa a nuestros estandartes, habrá más reclutas de los que posiblemente necesitaremos durante bastante tiempo.\n\n#! Efecto de apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_tir:0 "$omen_tir$"
 omen_tir:1 "Tir"
 omen_tir_desc:3 "Suplicamos al místico Tir que bendiga a nuestros artistas y artesanos con dones de conocimiento y perspicacia. Habiendo recibido este don de sabiduría, nuestro país florecerá como nunca antes.\n\n#! Efecto apoteósico: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_vahagn:0 "$omen_vahagn$"
 omen_vahagn:1 "Vahagn"
 omen_vahagn_desc:3 "Ofrecemos nuestra adoración a Vahagn con la esperanza de que proteja a nuestra nación. Con su protección, podremos reunir la riqueza de nuestro pueblo y expandirnos hacia una mayor prosperidad que antes.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_aramazd:0 "$omen_aramazd$"
 omen_aramazd:1 "Aramazd"
 omen_aramazd_desc:3 "El gran Aramazd apoyará a nuestro pueblo mientras nos expandimos hacia territorio extranjero para la gloria de nuestros dioses. Nuestro pueblo aceptará las necesidades de la guerra, ya que pocos pueden oponerse a la voluntad de los dioses.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"
 deity_tsovinar:0 "$omen_tsovinar$"
 omen_tsovinar:1 "Tsovinar"
 omen_tsovinar_desc:3 "Le pedimos al feroz Tsovinar que proteja a nuestros comerciantes mientras viajan por los mares en busca de fortuna para nuestro pueblo. Cuando esa riqueza lejana regrese a casa, nuestra gente seguramente prosperará en abundancia.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_anahit:0 "$omen_anahit$"
 omen_anahit:1 "Anahit"
 omen_anahit_desc:3 "Esperamos que la bondadosa Anahit bendiga a nuestra nación con protección para nuestros jóvenes; sus seguidores viven cómodamente sabiendo que sus hijos ahora pueden traer al mundo de manera segura.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
 deity_spandaremet:0 "$omen_spandaremet$"
 omen_spandaremet:1 "Spandaramet"
 omen_spandaremet_desc:3 "Spandaramet traerá nueva vida a nuestras cosechas, asegurando alimentos y suministros para nuestra gente. Como diosa de la muerte, le pedimos que nos dé un respiro de sus poderes para que podamos crecer y expandirnos una vez más.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
