 omen_baltic_bird:1 "Putnos"
 omen_baltic_bird_desc:3 "El aleteo de alas y el melodioso canto de los pájaros anuncian la llegada del regio Putnos, quien muchas veces toma la forma de un águila volando. Extendiendo sus alas y flotando en las corrientes a la deriva, es favorecido por la clase dominante, que espera emular su autoridad natural.\n\n #! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_baltic_oak:0 "$omen_baltic_oak$"
 omen_baltic_oak:1 "On'zolos"
 omen_baltic_oak_desc:3 "Perkunos, un dios como el roble que le es sagrado, deambula por los bosques primitivos y los bosques sombreados; bajo el amplio dosel de sus ramas, uno puede encontrar estabilidad y crecimiento, entrando en un estado de paz propicio para la meditación.\n\n#! Efecto Apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_baltic_sun:0 "$omen_baltic_sun$"
 omen_baltic_sun:1 "Sa'ula'"
 omen_baltic_sun_desc:3 "Sa'ula', cuyo poder es como el del Sol, nunca abandona verdaderamente a quienes lo aman; flotando cerca del horizonte durante meses, destierra la oscuridad tanto tiempo como puede, descansando sólo brevemente antes de reanudar la eterna lucha contra la noche.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_citizens_effect_tt_description$"
