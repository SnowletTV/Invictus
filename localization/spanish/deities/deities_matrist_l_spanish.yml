l_spanish:
 ## Generic ##
 deity_medeine:0 "$omen_medeine$"
 omen_medeine:1 "Medeiné"
 omen_medeine_desc:3 "Medeiné es conocida como la diosa patrona de todo lo relacionado con la caza, los bosques y la vida silvestre. Nuestros guerreros a menudo piden su ayuda cuando salen de casa para que los proteja mientras permanecen en sus dominios, ya sea para buscar comida o porque van a la guerra."
 deity_mother_goddess:0 "$omen_mother_goddess$"
 omen_mother_goddess:2 "Diosa Madre"
 omen_mother_goddess_desc:4 "La Diosa Madre es la deidad por excelencia de nuestro panteón, siendo la tierra en la que vivimos, así como la progenitora de nuestras tribus. Nuestra gente busca su guía, así como protección y sustento, esperando cosechas abundantes y ayuda."
 deity_perkunas:0 "$omen_perkunas$"
 omen_perkunas:2 "Perkunas"
 omen_perkunas_desc:4 "Valentía, los cielos y el fuego, todos ellos pertenecen al reino de Perkunas. Es una inspiración para nuestros héroes y soldados, con las muchas historias de sus actos. Las otras deidades de nuestro panteón le miran como juez y árbitro y confían en sus decisiones."
 deity_divine_twins:0 "$omen_divine_twins$"
 omen_divine_twins:1 "Gemelos Divinos"
 omen_divine_twins_desc:3 "Los Gemelos Divinos arrastran a Saulia a través del cielo mientras la mañana se convierte en día y el día en noche. Ellos juegan un papel importante en nuestra cosmología y protegen los hogares y a nuestra gente."
 deity_deivas:0 "$omen_deivas$"
 omen_deivas:1 "Deivas"
 omen_deivas_desc:3 "Deivas es uno de los dioses supremos de nuestro panteón, el padre del cielo que transmitió sus tareas a los que vinieron después de él. Progenitor de todos, todavía le rezamos para que nos guíe y nos ayude por ser el más fuerte de nuestro panteón."
 deity_governing_goddesses:0 "$omen_governing_goddesses$"
 omen_governing_goddesses:1 "Diosas Gobernantes"
 omen_governing_goddesses_desc:3 "Se dice que las siete Diosas Gobernantes elaboran el destino mismo. Haciendo girar los hilos de la vida, entretejiendo las guerras y la paz, así como el destino de nuestro pueblo. Esperamos que conozcan el futuro y sepan lo que será bueno."
 deity_televelis:0 "$omen_televelis$"
 omen_televelis:1 "Televelis"
 omen_televelis_desc:3 "Televelis es un mecenas de herreros y artesanos, que fabrica los objetos más bellos y las armas más destructivas que uno pueda imaginar. Las historias dicen que una vez creó el Sol mismo y lo arrojó al cielo para iluminar el mundo."
 deity_saulia:0 "$omen_saulia$"
 omen_saulia:1 "Saulia"
 omen_saulia_desc:3 "Saulia ilumina el mundo al pasar por el cielo. Alguna vez se casó con la Luna, pero los dos se separaron para crear el día tal como lo conocemos. Todos los días los Gemelos Divinos la ayudan a cruzar el cielo para visitar a su hija."
 deity_pbs_bear:0 "$omen_pbs_bear$"
 omen_pbs_bear:1 "Medwedios"
 omen_pbs_bear_desc:3 "Mientras recorre los bosques en busca de miel, Medwedios, el Devorador de Dulces, suele mantenerse reservado y encontrar refugio sólo en sus propias fuerzas. Lento para la ira y, sin embargo, un enemigo mortal cuando lo encuentra, el Oso es sagrado para él.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_pbs_dragon:0 "$omen_pbs_dragon$"
 omen_pbs_dragon:1 "Zmijis"
 omen_pbs_dragon_desc:3 "Cuando uno se ha encontrado con Askeriki el Dragón, la hora de la muerte está cerca, porque no hay esperanza de resistir la ira del Wyrm; soldados y esclavistas abrazan los potentes dones de Askerikis, sabiendo que el Dragón se deleita en la destrucción y la miseria.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_pbs_wolf:0 "$omen_pbs_wolf$"
 omen_pbs_wolf:1 "Wilkos"
 omen_pbs_wolf_desc:3 "En las noches más frías, cuando Me'neskios la Luna ha ascendido y arroja su manto sobre la faz de la tierra, es entonces cuando Wilkos, el Lobo, vuelve su rostro hacia el cielo, llenando la oscuridad con su penetrante gemido, un sonido que agita la sangre con promesas de cacerías futuras.\n\n#! Efecto Apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_pbs_horse:0 "$omen_pbs_horse$"
 omen_pbs_horse:1 "Kamnios"
 omen_pbs_horse_desc:3 "Kamnios, Dios-Caballo, cuyos atronadores cascos pisotean a los malvados, destrozando sus huesos y triturándolos hasta convertirlos en polvo; cómo se esfuerza por las riendas, con los ojos muy abiertos y relinchando, desesperado por destruir a sus enemigos.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_pbs_hare:0 "$omen_pbs_hare$"
 omen_pbs_hare:1 "Zájinkos"
 omen_pbs_hare_desc:3 "Pocos pueden aspirar a igualar la velocidad de la Liebre Zajinkos, que corre bajo sus pies y desaparece entre la hierba alta antes de que se note su presencia; tiene los ojos abiertos y ve todo y, moviendo la nariz, desaparece.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
 deity_pbs_bee:0 "$omen_pbs_bee$"
 omen_pbs_bee:1 "Bikela'"
 omen_pbs_bee_desc:3 "Son muchos los que adoran a Bikela', dios de las abejas que vigila las colmenas y protege a sus incansables trabajadoras. Cuando sale el sol, Bikela' se esfuerza sin cesar en llenar los panales con la miel más dulce y, sin embargo, su tacto, como la picadura de una abeja, puede provocar la muerte.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_pbs_sheep:0 "$omen_pbs_sheep$"
 omen_pbs_sheep:1 "Ovinos"
 omen_pbs_sheep_desc:3 "Nuestro pueblo ama verdaderamente a Ovinos, Dios Oveja, por sus abundantes dones; leche nutritiva de las ovejas, pieles gruesas para calentar nuestros cuerpos y carne deliciosa para llenar nuestras barrigas.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_pbs_snake:0 "$omen_pbs_snake$"
 omen_pbs_snake:1 "Angios"
 omen_pbs_snake_desc:3 "Si bien a algunos les puede parecer extraño que un dios de las serpientes esté asociado con la fertilidad y la seguridad, los seguidores de Angios no ven nada fuera de lo común; conocen su deidad serpentina para traer todas estas cosas y más.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_pbs_ox:0 "$omen_pbs_ox$"
 omen_pbs_ox:1 "Wálos"
 omen_pbs_ox_desc:3 "Mugiendo poderosamente mientras se esfuerza contra el yugo, Walos el Buey se apoya pesadamente en sus cargas, jadeando mientras persevera; el trabajo es difícil y largo, pero Walos es fiel y no descansará hasta estar satisfecho.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_pbs_sun:0 "$omen_pbs_sun$"
 omen_pbs_sun:1 "Sulnikios"
 omen_pbs_sun_desc:3 "Sulnikios, cuyo poder es como el del Sol, nunca abandona verdaderamente a quienes lo aman; flotando cerca del horizonte durante meses, destierra la oscuridad tanto tiempo como puede, descansando sólo brevemente antes de reanudar la eterna lucha contra la noche.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_pbs_fish:0 "$omen_pbs_fish$"
 omen_pbs_fish:1 "Ru'ba'"
 omen_pbs_fish_desc:3 "Las aguas heladas del océano son el patio de recreo de Zu's the Fish, quien mira con frialdad y sin pestañear los asuntos del hombre antes de regresar a las oscuras profundidades. Los marineros esperan verlo cuando regresan del extranjero, ya que trae suerte y promesas de riqueza a aquellos que tienen la suerte de verlo.\n\n#! Efecto apoteósico: $naval_apotheosis_effect_tt_description$"
 deity_pbs_deer:0 "$omen_pbs_deer$"
 omen_pbs_deer:1 "Sír'na'"
 omen_pbs_deer_desc:3 "Antes del amanecer, en la orilla del lago, donde la niebla todavía se enrosca sobre la superficie del agua y la hierba está cargada de rocío, Sir'na' el Venado bebe profundamente. Hay un ruido en el bosque y, sin previo aviso, Sir'na' desaparece.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_pbs_moon:0 "$omen_pbs_moon$"
 omen_pbs_moon:1 "Me'neskios"
 omen_pbs_moon_desc:3 "Los cielos nocturnos están iluminados por la gloria resplandeciente de Me'neskios, la Luna, y su reluciente manto tejido con estrellas. Volviendo un rostro pálido pero compasivo hacia la Tierra, escucha las oraciones de los cansados.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_pbs_bird:0 "$omen_pbs_bird$"
 omen_pbs_bird:1 "Putokos"
 omen_pbs_bird_desc:3 "El aleteo de alas y el melodioso canto de los pájaros anuncian la llegada del regio Putokos, quien muchas veces toma la forma de un águila volando. Extendiendo sus alas y flotando en las corrientes a la deriva, es favorecido por la clase dominante, que espera emular su autoridad natural.\n\n #! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_pbs_oak:0 "$omen_pbs_oak$"
 omen_pbs_oak:1 "Perunos"
 omen_pbs_oak_desc:3 "Perunos, el sorprendente dios de la iluminación, como el roble que le es sagrado, deambula por los bosques primitivos y los bosques sombreados; bajo el amplio dosel de sus ramas, uno puede encontrar estabilidad y crecimiento, entrando en un estado de paz propicio para la meditación.\n\n#! Efecto Apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"
 deity_pbs_lime:0 "$omen_pbs_lime$"
 omen_pbs_lime:1 "Léi'pa'"
 omen_pbs_lime_desc:3 "Hay un estado de alegría desenfrenada en el que se encuentran los seguidores de Lei'pa'; un deleite entusiasta se apodera de los fieles, y las celebraciones duran hasta bien entrada la noche; hay pocos que puedan resistir la llamada al éxtasis.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_baltic_bear:0 "$omen_baltic_bear$"
 omen_baltic_bear:1 "Lakis"
 omen_baltic_bear_desc:3 "Lakis, el pisador, llamado eufemísticamente por su paso lento, generalmente se mantiene reservado y sólo encuentra refugio en su propia fuerza. Lento para la ira y, sin embargo, un enemigo mortal cuando lo encuentra, el Oso es sagrado para él.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_baltic_horse:0 "$omen_baltic_horse$"
 omen_baltic_horse:1 "Zir'gos"
 omen_baltic_horse_desc:3 "Zir'gos, Dios-Caballo, cuyos atronadores cascos pisotean a los malvados, destrozando sus huesos y triturándolos hasta convertirlos en polvo; cómo se esfuerza por las riendas, con los ojos muy abiertos y relinchando, desesperado por destruir a sus enemigos.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_baltic_bee:1 "$omen_baltic_bee$"
 omen_baltic_bee:1 "Bita'"
 omen_baltic_bee_desc:3 "Son muchos los que aman a Bita', dios de las abejas que vigila las colmenas y protege a sus incansables trabajadoras. Cuando sale el sol, Bita' se esfuerza sin cesar en llenar los panales con la miel más dulce y, sin embargo, su tacto, como la picadura de una abeja, puede provocar la muerte.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
