l_spanish:
 #From Torugu
 deity_lamia: "$omen_lamia$"
 omen_lamia: "Lamia"
 omen_lamia_desc: "La diosa serpiente libia, llamada Lamia por los griegos. \n\nUna de las deidades más importantes de la religión nativa de Libia, Lamia gobierna las numerosas serpientes y escorpiones venenosos del desierto, protegiendo a sus seguidores contra sus mordeduras mortales.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"
 deity_antaeus: "$omen_antaeus$"
 omen_antaeus: "Anteo"
 omen_antaeus_desc: "Anteo, también conocido como Anti, es una deidad gigante adorada por los nativos de Libia. \n\nSegún la mitología griega, Anteo era invencible mientras permaneciera en contacto con la tierra. Finalmente murió cuando el héroe griego Heracles lo levantó del suelo y lo aplastó en el aire. \n\nAnteo es comúnmente visto como la personificación del pueblo libio. Su lucha contra Heracles representa entonces la lucha de los nativos libios contra los colonos griegos.\n\n#! Efecto Apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_tritonis: "$omen_tritonis$"
 omen_tritonis: "Tritón"
 omen_tritonis_desc: "Tritonis es el nombre griego de la deidad que gobierna el lago Tritonis, un gran lago de agua salada que los griegos creen que es el lugar de nacimiento de la diosa Atenea. \n\nTritonis parece haber sido la madre de una importante diosa libia que puede haber sido el origen de la diosa egipcia Neith y que los griegos identificaron con Atenea.\n\n#! Efecto apoteosis: $economy_income_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"
 deity_ammon: "$omen_ammon$"
 omen_ammon: "Amón"
 omen_ammon_desc: "Ammón es el dios libio del Oasis de Ammoneion. Los egipcios lo identificaron como su dios supremo, Amón. \n\nEl oráculo de Amón en Ammoneion se encuentra entre los oráculos más prestigiosos del mundo: fueron los sacerdotes de Amón quienes declararon que Alejandro Magno era hijo de Amón y faraón legítimo de Egipto. \n\nEl culto a Amón se ha extendido mucho más allá del desierto de Libia, y sus adoradores ahora se extienden desde Grecia hasta el Levante.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_cyre: "$omen_cyre$"
 omen_cyre: "Cirene"
 omen_cyre_desc: "Cirene es la legendaria cazadora asesina de leones venerada por los nativos libios de Cirenaica. \n\nCuando los primeros colonos griegos llegaron a Cirenaica, eligieron a Cirene como protectora de su nueva ciudad, adorándola junto a su otro dios patrón, Apolo.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
