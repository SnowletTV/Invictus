l_spanish:
 ## Generic ##
 deity_sinifere:0 "$omen_sinifere$"
 omen_sinifere:1 "Sinifere"
 omen_sinifere_desc:3 "Bajo la guía de Sinifere, nuestros guerreros recibirán fuerza y disciplina. A medida que el dios ayuda a nuestra causa, nuestros hombres seguramente conquistarán y vencerán a nuestros enemigos, brindándonos la victoria.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_gurzil:0 "$omen_gurzil$"
 omen_gurzil:1 "Gurzil"
 omen_gurzil_desc:3 "Bajo el bendito dios guerrero Gurzil, nuestros jóvenes y viejos acudirán en masa a los estandartes para luchar contra nuestros enemigos. Con todos estos hombres viniendo repentinamente para ayudar a nuestro pueblo en la guerra, estamos seguros de que reforzaremos nuestras filas más allá de lo imaginable. Estaremos preparados para cualquier peligro potencial que se nos presente.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_tannit:0 "$omen_tannit$"
 omen_tannit:1 "Tannit"
 omen_tannit_desc:3 "La gran tejedora Tannit nos bendecirá con su sabiduría, otorgando dones de perspicacia a nuestros sabios, académicos y eruditos. Con este nuevo conocimiento, estamos seguros de que podremos progresar y traer a nuestra gente mayores innovaciones e ideas.\n\nAunque originalmente era una diosa de ascendencia cartaginesa, se ha convertido en una parte importante de la religión desde Libia hasta Mauritania.\n\n#! Efecto apoteósico: $culture_apotheosis_characters_effect_tt_description$"
 deity_shaheded:0 "$omen_shaheded$"
 omen_shaheded:1 "Shaheded"
 omen_shaheded_desc:3 "La gran diosa del mar protegerá y velará por nuestros mercaderes y comerciantes cuando abandonen nuestro hogar en busca de riquezas para nuestro pueblo. Con nuevas riquezas y tesoros en tierras lejanas, seguramente traerán mayor riqueza a nuestra nación.\n\nShahaded es una diosa del mar originalmente adorada en Libia, pero sus devotos han difundido su nombre con el paso del tiempo.\n\n#! Efecto apoteósico: $naval_apotheosis_effect_tt_description$"
 deity_nanna_tala:0 "$omen_nanna_tala$"
 omen_nanna_tala:1 "Nanna Tala"
 omen_nanna_tala_desc:3 "La gran diosa Primavera traerá salvación y prosperidad a nuestro pueblo, calmando nuestros conflictos y desacuerdos internos. A medida que nuestras tierras se pacifican, podemos centrar nuestros esfuerzos en los enemigos de nuestras fronteras en lugar de en los enemigos internos. \n\nHay muchos mitos sobre la mujer que ahora se conoce como la diosa Nanna Tala. Las historias dicen que ella y sus hijos sacrificaron sus vidas para encontrar agua para su gente, y que las personas justas todavía pueden recurrir a ella para que les dé agua en momentos de necesidad.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"
