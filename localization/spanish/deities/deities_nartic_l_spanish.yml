l_spanish:

 deity_sawaserqua:0 "$omen_sawaserqua$"
 omen_sawaserqua:0 "Sawaserqua"
 omen_sawaserqua_desc:0 "Quizás más comúnmente conocido como Sosruko, el nombre de Sawaserqua puede significar literalmente \"el hijo del golpe de espada de fuego\". Considerado el siervo de los dioses, Nart Sawaserqua es el responsable de robarle el fuego al gigante. Sawaserqua es el más pequeño de los Nart y, a menudo, se lo describe como un Nart del engaño.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_batraz:0 "$omen_batraz$"
 omen_batraz:0 "Batraz"
 omen_batraz_desc:0 "El mayor guerrero de los Narts, además de su líder. Su papel es comparable al del 'Amirani' del sur del Cáucaso. Su espada es un símbolo importante del hierro y su poder, aunque su asociación principal es la de dios de las tormentas.\n\nEn una versión del mito, Bartaz nació de un Khami, cuya esposa le daría a Khami una burbuja ardiente parecida a un quiste en su espalda para que Bartaz creciera antes de irse. Una vez que Bartaz naciera, todavía en llamas, Nart Syrdon lo arrojaría al mar donde crecería. Más tarde, Bartaz visitaría al dios herrero Kurdalaegon, quien calienta a Bartaz, le da poderes y luego lo arroja al mar con unas tenazas. Bartaz pasa de allí a vivir en los cielos, lanzando rayos para ayudar a los Nart. Él lograría muchas grandes hazañas en la vida, incluida la realización de una gloriosa venganza contra el gigante torcido que estaba causando violencia entre los jóvenes de los Narts. También se le encuentra en juegos de fanfarronería, en los que suele ganar. Bartaz finalmente moriría en busca de venganza por la muerte de su padre, que resultó en la muerte de muchos otros Narts.\n\n #! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$ \n $heart_attack_apotheosis_effect_tt_description$"

 deity_satanaya:0 "$omen_satanaya$"
 omen_satanaya:0 "satanaya"
 omen_satanaya_desc:0 "Madre de los Narts, Satanaya dio a luz a muchos héroes principales, como Sawaserqua, a quien ayudó a robar el fuego del gigante. Como mujer sabia y matriarca entre los Narts, ella dio el ejemplo a la familia, como valorar el agua en la historia donde recoge una flor cerca del río Hypanis y no puede verla crecer hasta que cae una gran lluvia. Ella fue lo suficientemente astuta como para hacer un trato con el sol para extender la duración del día.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"

 deity_theshkhue:0 "$omen_theshkhue$"
 omen_theshkhue:0 "Theshkhue"
 omen_theshkhue_desc:0 "Considerado como el ser supremo, Theshkhue adivinó el universo y estableció las leyes primordiales de la existencia. Los hombres que buscan la iluminación buscan seguir sus leyes cósmicas, la ley de Tha. Un unificador, es el destinatario de todas las preguntas, pero no pide nada a cambio de su creación.\n\n#! Efecto de apoteosis: $theshkhue_apotheosis_effect_tt_description$"

 deity_lady_of_flowing_waters:0 "$omen_lady_of_flowing_waters$"
 omen_lady_of_flowing_waters:0 "Señora de las aguas corrientes"
 omen_lady_of_flowing_waters_desc:0 "La Dama de las Aguas que Fluyen, diosa del agua, reside en una hermosa casa blanca que se encuentra dentro de un barranco brumoso en las profundidades del lago Maeotis. Allí cuida de sus tres hijas, las mujeres que visten pieles de paloma, y ​​de sus siete hijos. Sólo Nart Pizighash pudo acceder a su casa cuando golpeó el lago con su espada y las olas se separaron para él.\n\n#! Efecto de apoteosis: $lady_of_flowing_waters_apotheosis_effect_tt_description$"

 deity_tlepsh:0 "$omen_tlepsh$"
 omen_tlepsh:0 "tlepsh"
 omen_tlepsh_desc:0 "Tlepsh, el herrero de los Narts, creó el primer enfermizo para la cosecha del mundo, así como una hoja afilada capaz de moverse por sus propios medios y luchar por él en su avanzada edad. Tlepsh, un chamán con dominio sobre el fuego y el metal, tejió el hilo entre la magia y la ciencia. Incluso buscó todo el conocimiento del mundo, llevando la Vía Láctea con la diosa que representa los cuatro rincones del cosmos.\n\n#! Efecto Apoteosis: $tlepsh_apotheosis_effect_tt_description$"

 deity_pkharmat:0 "$omen_pkharmat$"
 omen_pkharmat:0 "Pharmat"
 omen_pkharmat_desc:0 "Pkharmat, otro de los Narts que buscaba robar fuego para beneficio de la humanidad, se aventuró a la cima del monte Bashlam para llevarse el fuego que el cruel dios Sela dominaba sobre los Narts y sus compatriotas humanos. Con la ayuda de la diosa Sata (la esposa de Sela), el héroe caballo Turpal y su propio hermano, tomó fuego y se lo llevó a los Narts para que ya no tuvieran que comer alimentos crudos ni beber leche fría. Por sus actos heroicos, el cruel dios Sela lo encadenó a una roca en la cima del Monte Balsham usando su secuaz, Uja el cíclope, y Sela hizo que el halcón Ida le picara el hígado por toda la eternidad.\n\n#! Efecto de apoteosis: $pkharmat_apotheosis_effect_tt_description$"

 deity_turpal:0 "$omen_turpal$"
 omen_turpal:0 "Turpal"
 omen_turpal_desc:0 "Turpal, el caballo héroe que monta Pkharmat para escapar de la ira del dios Sela con fuego robado en sus manos, podía escapar incluso de los rayos. Su nombre simplemente significa \"héroe\" y su nombre ha sido adoptado por los hijos de los Narts desde tiempos inmemoriales.\n\n#! Efecto de apoteosis: $turpal_apotheosis_effect_tt_description$"

 deity_dische_zhig:0 "$omen_dische_zhig$"
 omen_dische_zhig:0 "Dische Zhig"
 omen_dische_zhig_desc:0 "También conocido como el Árbol Dorado, este famoso árbol de los Narts representa la antigua veneración de los árboles en el norte del Cáucaso y los espíritus que viven en ellos. Además de su tono dorado, el árbol produce manzanas mitad blancas como la nieve y mitad carmesí. Si una mujer come del lado blanco, le nacerá una hija con cabello blanco como la nieve. Si come del lado rojo, nacería un niño heroico con el mismo cabello pálido. El árbol otorga renovación, conocimiento y magia.\n\n#! Efecto Apoteosis: $dische_zhig_apotheosis_effect_tt_description$"

 deity_pija:0 "$omen_pija$"
 omen_pija:0 "pija"
 omen_pija_desc:0 "Pija, el mayor de los dos hijos de Tatemquo, era un gran guerrero, conocido como \"el que lanza\". En La historia de cómo surgieron Warzameg y Timis, Pija se queda dormida bajo el árbol dorado, Dische Zhig, y no se da cuenta del robo de las manzanas rojas y blancas de sus ramas doradas. Es famoso por tener flechas que no fallan y cortes de espada que consistentemente cortan su objetivo, pero no es conocido por ser un excelente guardia.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_pizighash:0 "$omen_pizighash$"
 omen_pizighash:0 "Pizighash"
 omen_pizighash_desc:0 "Pizighash, el menor de los dos hijos de Tatemquo, es un gran guerrero, conocido como \"el que corta\". En La historia de cómo surgieron Warzameg y Timis, Pizighash sigue siendo un guardia fiel y vigilante bajo el Árbol Dorado, Dische Zhig, y se encuentra con las tres palomas que roban las manzanas rojas y blancas para llevarlas al oeste, al lago Maeotis. Con su hermano, cabalga para perseguir y dispararle una flecha a una de las palomas. Después de darse cuenta de que la paloma es en realidad una hija (Meghazash) de la Dama del Agua que Fluye disfrazada, la cura y se casa con ella y tienen tres hijas y tres hijos propios, incluido el héroe Warzameg.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_zhaqa:0 "$omen_zhaqa$"
 omen_zhaqa:0 "Zhaqa"
 omen_zhaqa_desc:0 "El caballo montado por el malvado gigante Arkhon Arkhozh, la velocidad de Zhaqa no tiene comparación con ningún corcel vivo. En realidad, el caballo representa la transición entre la vida y la muerte, llevándose a la doncella Psatina ('Madre vivificante'). El propio nombre de Zhaqa significa \"montículo funerario\", por lo que simboliza la transición en el ciclo de la vida y la muerte. Ningún ser vivo puede alcanzarlo ni superarlo, ya que ningún ser vivo puede derrotar a la muerte.\n\n#! Efecto Apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_tetertup:0 "$omen_tetertup$"
 omen_tetertup:0 "Tetertup"
 omen_tetertup_desc:0 "Dios de la guerra y el derramamiento de sangre, Tetertup era el equivalente de la deidad Ghalghai/Gelaean Molyz-Yerdi o el Marte romano. Llenó una banda de guerra con fuerza y vigor, igual en poder y estatura a los héroes Nart, pero fue adorado más ampliamente por las tribus abasgias de la cordillera noroeste de los picos de Kavkasos.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_theqwafeshu:0 "$omen_theqwafeshu$"
 omen_theqwafeshu:0 "Theqwafeshu"
 omen_theqwafeshu_desc:0 "Heraldo del unificador, el gran creador del cosmos, Theshkhue, Theqwafeshu actúa como portador de su ley cósmica, portador de su gran plan. En los pasos del dios creador, Theqwafeshu es visto por los Abasgoi como un signo de juicio divino y guía inminente del maestro del heraldo.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"

 deity_thageledj:0 "$omen_thageledj$"
 omen_thageledj:0 "Thageledj"
 omen_thageledj_desc:0 "Thageledj, dios de la flora y los cultivos, se dedicó a buscar cultivos saludables que los Narts y otros dioses de las montañas pudieran cultivar, incluso en condiciones duras o gélidas. Los agricultores, tanto los que cultivan para el sustento como los que cultivan para la exportación, le rezan por una buena cosecha y por el descubrimiento de nuevos y mejores cultivos en las próximas temporadas.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"

 deity_merise:0 "$omen_merise$"
 omen_merise:0 "Merisa"
 omen_merise_desc:0 "Se dice que Merise, una deidad menor y protectora de las abejas, salvó a la última abeja superviviente durante un terrible evento entre los dioses. Al recuperar la salud dentro de su manga, renovó las especies de abejas, por lo que cada verano se la celebra por su trabajo, que afecta la vida de las flores, los árboles y todo tipo de naturaleza. Mientras ella protegía a las abejas, sus tres hermanas protegían la vida familiar, los guerreros y los campesinos.\n\n#! Efecto apoteósico: $merise_apotheosis_effect_tt_description$"

 deity_arkhon_arkhozh:0 "$omen_arkhon_arkhozh$"
 omen_arkhon_arkhozh:0 "Arkhon Arkhozh"
 omen_arkhon_arkhozh_desc:0 "Arkhon Arkhozh, gobernante de los muertos y del inframundo, es un gigante escamoso que monta el caballo Zhaqa. A veces representado como una serpiente o un dragón, su nombre significa \"viejo\", \"venerable\", \"feo\" o \"malvado\". Representa la naturaleza salvaje de la humanidad y su forma más animal. En las historias, roba a la doncella Psatina, de quien Warzameg está enamorado.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_theshu:0 "$omen_theshu$"
 omen_theshu:0 "teshu"
 omen_theshu_desc:0 "Dios y protector de los jinetes, Theshu es la deidad patrona de los jinetes de montaña, pastores de pastos y guerreros nómadas, para quienes los caballos son un medio de vida: protege a los caballos en la batalla de la misma manera que mantiene sus piernas fuertes mientras tiran de un carro o arrastran una azada por el campo.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_psetha:0 "$omen_psetha$"
 omen_psetha:0 "Psetha"
 omen_psetha_desc:0 "Diosa de la vida y las almas, Psetha carece de una representación humanoide, o incluso física, en el pensamiento y la oración. Ella es una de las deidades cosmogónicas y se la considera parte de cada individuo y su entorno en lugar de controlar una porción compartimentada del mundo natural. Mantiene la vida sustentada por las leyes cósmicas de Theshkhue.\n\n#! Efecto apoteósico: $culture_apotheosis_civic_tech_effect_tt_description$"

 deity_sozrech:0 "$omen_sozrech$"
 omen_sozrech:0 "Sozrech"
 omen_sozrech_desc:0 "Dios de la fertilidad, la familia, el bienestar y la enfermedad, Sozrech tenía el mando sobre las fuerzas naturales del viento y el agua, y era capaz de curar enfermedades y transmitirlas a través de líquidos. Rezar a Sozrech daría como resultado una familia feliz, cálida y en crecimiento sin enfermedades. Ponerse en su lado malo arruinaría incluso la casa mejor construida.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_schyble:0 "$omen_schyble$"
 omen_schyble:0 "Schyble"
 omen_schyble_desc:0 "Dios de los truenos y los relámpagos, Schyble era una deidad a la que había que temer y asombrar por su poder abrumador y su dominio sobre los cielos. Sus habilidades dan forma a la naturaleza de la batalla y la guerra tan fácilmente como el destino de los cultivos y sus cosechas. Los mismos bosques ceden ante él, ardiendo hasta convertirse en chimeneas a su antojo.\n\n#! Efecto apoteósico: $military_apotheosis_capital_freemen_effect_tt_description$"

 deity_hedrixe:0 "$omen_hedrixe$"
 omen_hedrixe:0 "Hedrixe"
 omen_hedrixe_desc:0 "Hedrixe, la protectora de los muertos, es vista, al igual que el Hades griego, como el reino y la naturaleza que abarca el mundo más allá, hacia donde se dirigen todas las almas de los difuntos, tanto los héroes como la gente común. Es una deidad conceptual y tiene una forma abstracta, a diferencia de una figura antropomórfica, y existe en oposición a Theshkhue, el creador del universo y las leyes que gobiernan la vida.\n\n#! Efecto apoteósico: $hedrixe_apotheosis_effect_tt_description$"

 deity_zchithe:0 "$omen_zchithe$"
 omen_zchithe:0 "Zchithe"
 omen_zchithe_desc:0 "Maestro de los vientos, Zchithe hizo viajar la voz y la palabra, conectando a los seres humanos y a todas las criaturas a través del sonido. Debido a que la gente cree que las enfermedades y dolencias se congregan alrededor del aire viciado corrompido por las fuerzas del mal, se le suplica que elimine las maldiciones y enfermedades.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 
