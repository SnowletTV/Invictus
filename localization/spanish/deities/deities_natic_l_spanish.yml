l_spanish:

#Universal Deities, made with proto-monic
 deity_kroon:0 "$omen_kroon$"
 omen_kroon:0 "Kro'on Nat"
 omen_kroon_desc:0 "Kro'on Nat, el Nat de los ríos. Los ríos sustentan la vida y dan la esencia de Nat a todos los seres vivos. Que el Kro'on Nat dé a nuestros animales, cultivos y a nosotros mismos el componente necesario de la vida que es el agua.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"

 deity_tii:0 "$omen_tii$"
 omen_tii:0 "Ti'i Nat"
 omen_tii_desc:0 "Ti'i Nat, el Nat del suelo y del terreno en el que nos encontramos. El suelo es lo que da vida y Nats a nuestras plantas. Que el Ti'i Nat permita que nuestros cultivos florezcan y sean fértiles.\n\n#! Efecto Apoteosis: $fertility_apotheosis_food_effect_tt_description$"

 deity_kuntuu:0 "$omen_kuntuu$"
 omen_kuntuu:0 "Kuntu'u Nat"
 omen_kuntuu_desc:0 "Kuntu'u Nat, el Nat de la Luna. La gran luz del cielo nocturno, cada vez más cambiante, pero consistente, nos permite seguir el tiempo. Que el Kuntu'u Nat nos guíe.\n\n#! Efecto Apoteosis: $culture_apotheosis_civic_tech_effect_tt_description$"

 deity_gerger:0 "$omen_gerger$"
 omen_gerger:0 "Nat Ger-Ger"
 omen_gerger_desc:0 "Ger-Ger Nat, el Nat del trueno. Un destello de luz fue precedido por el poderoso sonido de Ger-Ger. Que el Ger-Ger Nat ruga y haga temblar a nuestros enemigos.\n\n#! Efecto Apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"

 deity_chuu:0 "$omen_chuu$"
 omen_chuu:0 "Chu'u Nat"
 omen_chuu_desc:0 "Chu'u Nat, el Nat de los árboles. Árboles con los que construimos nuestras casas y nuestras herramientas. Los árboles que llenan nuestros bosques y selvas. Que el Chu'u Nat nos fortalezca.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_puur:0 "$omen_puur$"
 omen_puur:0 "Pu'ur Nat"
 omen_puur_desc:0 "Pu'ur Nat, el Nat de las palomas. La delicada y hermosa paloma vuela graciosamente sobre nuestras cabezas. Seamos bendecidos con el Pu'ur Nat para que podamos volar con gracia a través de nuestras vidas.\n\n#! Efecto Apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"

 deity_sloon:0 "$omen_sloon$"
 omen_sloon:0 "Slo'on Nat"
 omen_sloon_desc:0 "Slo'on Nat, el Nat de los hombres que se alzan como montañas. Que alcancemos los cielos y las cimas de las montañas y seamos agraciados con Slo'on Nat.\n\n#! Efecto apoteósico: $military_apotheosis_military_experience_effect_tt_description$"

 deity_thar:0 "$omen_thar$"
 omen_thar:0 "Thar Nat"
 omen_thar_desc:0 "Thar Nat, el Nat del oro. El oro enriquece nuestra sociedad y nos permite crear belleza y joyas. Que se nos dé mucho Thar Nat.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"

#Specific Geography
 deity_irrawaddy:0 "$omen_irrawaddy$"
 omen_irrawaddy:0 "Irrawaddy Nat"
 omen_irrawaddy_desc:0 "Irrawaddy Nat, el Nat del gran río Irrawaddy. El Irrawaddy es poderoso, es el río más grande de la región y llena el valle de Nat y vida.\n\n#! Efecto Apoteosis: $culture_apotheosis_capital_effect_tt_description$"

#Pu group
 deity_kujii:0 "$omen_kujii$"
 omen_kujii:0 "Kuji'i Nat"
 omen_kujii_desc:0 "Kuji'i Nat, el Nat de los árboles Upas. El árbol Upas es peligroso. Nadie puede subir hasta la cima sin caer muerto. Que el Kuji'i Nat nos proteja de nuestros enemigos.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"

#Bon-Natic
 deity_mahagiri:0 "$omen_mahagiri$"
 omen_mahagiri:0 "Min Mahagiri"
 omen_mahagiri_desc:0 "El Nat supremo de Min Mahagiri. En vida fue adonde fue con el nombre de Muang Tintdei. Se decía que era tan fuerte que podía romper un colmillo de elefante. Si bien se contaron más detalles de su historia cientos de años después, es probable que la forma Nat original de Min Mahagiri fuera mucho más simplemente una persona de gran fuerza. Se convertiría en el codirector del Panteón de 37 Nat, pero durante este período, es simplemente parte del Culto de 37 Nat. Es importante tener en cuenta que estas figuras aún no eran deidades y se creían más bien como espíritus, también conocidos como Nats.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_shwemyethna:0 "$omen_shwemyethna$"
 omen_shwemyethna:0 "Shwemyethna"
 omen_shwemyethna_desc:0 "La Nat de la princesa dorada Shwemyethna, que también era hermana de Min Mahagiri, fue codirectora con su hermano en el Panteón de 37 Nat que se formaría cientos de años después. Sin embargo, en este período, ella probablemente era simplemente la Nat de una mujer real que era venerada. Por ahora, ella es parte del Culto de 37 Nat junto con su hermano. Es importante tener en cuenta que estas figuras aún no eran deidades y se creían más bien como espíritus, también conocidos como Nats.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"

 deity_shwenabay:0 "$omen_shwenabay$"
 omen_shwenabay:0 "Shwenabay"
 omen_shwenabay_desc:0 "Shwenabay, hija de un dragón de agua, era hermana reina de Shwemyethna y consorte de Muang Tintdei. Moriría de un ataque al corazón creyendo que Min Mahagiri había muerto. Los detalles de la historia probablemente se formaron más tarde cuando el Culto de 37 Nat se transformó gradualmente en un panteón. Es probable que Shwenabay fuera originalmente un Nat de un río o agua, tal vez mezclado con un ancestro Nat. En ese momento, ella era simplemente una Nat, y todavía no una diosa. Es importante tener en cuenta que estas figuras aún no eran deidades y se creían más bien como espíritus, también conocidos como Nats.\n\n#! Efecto de apoteosis: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"

 deity_thirty_seven:0 "$omen_thirty_seven$"
 omen_thirty_seven:0 "Pi'ichewaz Tmpah Nat"
 omen_thirty_seven_desc:0 "Pi'ichewaz Tmpah Nat significa vagamente \"El culto de los Treinta y Siete Nat\". El Culto de los Treinta y Siete Nat era un culto religioso prepanteónico surgido de las migraciones Pyu, pero también lo creían los pueblos locales Mon del sur. El culto eventualmente crecería hasta convertirse en un panteón propiamente dicho, siendo referido en su lugar como el \"Panteón de 37 Nat\", sin embargo, esto no ocurriría hasta el siglo VIII d.C. Por ahora, el Culto de los Treinta y Siete Nat existe como un término medio entre las creencias politeístas y animistas.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_tuangmagyishinnyo:0 "$omen_tuangmagyishinnyo$"
 omen_tuangmagyishinnyo:0 "Tuang Magyi Shwenyo"
 omen_tuangmagyishinnyo_desc:0 "Tuang Magyi Shwenyo fue uno de los dos hijos concebidos por Shwenabay y Maung Tintdei. Al igual que su padre, Tuang Magyi Shwenyo, junto con su hermano, eran muy fuertes. Esto causó miedo entre el gobernador del país, quien engañó a los dos para que pelearan entre sí. La batalla resultó primero en la muerte del hermano menor antes de que también muriera Tuang Magyi Shwenyo. Los detalles de la historia probablemente se formaron más tarde cuando el Culto de 37 Nat se transformó gradualmente en un panteón. Es importante tener en cuenta que estas figuras aún no eran deidades y se creían más bien como espíritus, también conocidos como Nats.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_minshinmyaukphyu:0 "$omen_minshinmyaukphyu$"
 omen_minshinmyaukphyu:0 "Myauk Min Shwenphyu"
 omen_minshinmyaukphyu_desc:0 "Myauk Min Shwenphyu fue uno de los dos hijos concebidos por Shwenabay y Maung Tintdei. Al igual que su padre, Myauk Min Shwenphyu, junto con su hermano, eran muy fuertes. Esto causó miedo entre el gobernador del país, quien engañó a los dos para que pelearan entre sí. La batalla resultó en la muerte del primer Myauk Min Shwenphyu antes de que el hermano mayor también muriera. Los detalles de la historia probablemente se formaron más tarde cuando el Culto de 37 Nat se transformó gradualmente en un panteón. Es importante tener en cuenta que estas figuras aún no eran deidades y se creían más bien como espíritus, también conocidos como Nats.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"

 deity_maungtintdei:0 "$omen_maungtintdei$"
 omen_maungtintdei:0 "Maung Tintdei"
 omen_maungtintdei_desc:0 "Maung Tintdei era la forma original de Min Mahagiri. Se le consideraba increíblemente fuerte, hasta el punto de que el rey de la tierra lo consideró una amenaza. El rey del país se casaría con su hermana, Shwemyethna, e invitaría a Maung Tintdei a su corte. Aquí fue traicionado y ahogado en el agua. Su hermana hizo lo mismo, desconsolada por la traición y muerte de su hermano. Maung Tintdei renació como Min Mahagiri Nat. Los detalles de la historia probablemente se formaron más tarde cuando el Culto de 37 Nat se transformó gradualmente en un panteón. Es importante tener en cuenta que estas figuras aún no eran deidades y se creían más bien como espíritus, también conocidos como Nats.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_shwemhtwehla:0 "$omen_shwemhtwehla$"
 omen_shwemhtwehla:0 "Shwenhetwehla Thonepanhla"
 omen_shwemhtwehla_desc:0 "Shwenhetwehla Thonepanhla era la hermana menor de Maung Tintdei. Tras la muerte de su hermano mayor y su hermana mayor, ella y su familia escaparon con el rey de Rhakine. Allí, Shwenhetwehla fue adoptada por la familia gobernante y casada con otro rey. Eventualmente moriría a causa de una fiebre alta y en adelante sería adorada como Nat. Los detalles de la historia probablemente se formaron más tarde cuando el Culto de 37 Nat se transformó gradualmente en un panteón. Es importante tener en cuenta que estas figuras aún no eran deidades y se creían más bien como espíritus, también conocidos como Nats.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_oasis_nat:0 "$omen_oasis_nat$"
 omen_oasis_nat:0 "Hekon Nat"
 omen_oasis_nat_desc:0 "Nuestra capital está rodeada por el Nat del Oasis, que Hekon Nat bendiga nuestras ciudades.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"

 deity_jungle_nat:0 "$omen_jungle_nat$"
 omen_jungle_nat:0 "Tam Nat"
 omen_jungle_nat_desc:0 "Nuestra capital está rodeada por el Nat de la Selva, que Tam Nat bendiga nuestras ciudades.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_forest_nat:0 "$omen_forest_nat$"
 omen_forest_nat:0 "Chik'o'o Nat"
 omen_forest_nat_desc:0 "Nuestra ciudad capital está rodeada por el Nat del Bosque, que Chick'o'o Nat bendiga nuestras ciudades.\n\n#! Efecto Apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_farmland_nat:0 "$omen_farmland_nat$"
 omen_farmland_nat:0 "P'kow Nat"
 omen_farmland_nat_desc:0 "Nuestra ciudad capital está rodeada por el Nat de las tierras de cultivo, que P'kow Nat bendiga nuestras ciudades.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"

 deity_marsh_nat:0 "$omen_marsh_nat$"
 omen_marsh_nat:0 "K'sok Nat"
 omen_marsh_nat_desc:0 "Nuestra ciudad capital está rodeada por el Nat del Pantano, que K'sok Nat bendiga nuestras ciudades.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_desert_nat:0 "$omen_desert_nat$"
 omen_desert_nat:0 "Pimtuul Nat"
 omen_desert_nat_desc:0 "Nuestra capital está rodeada por el Nat del Desierto, que Pimtuul Nat bendiga nuestras ciudades.\n\n#! Efecto Apoteosis: $culture_apotheosis_characters_effect_tt_description$"

 deity_hills_nat:0 "$omen_hills_nat$"
 omen_hills_nat:0 "Bna'a Nat"
 omen_hills_nat_desc:0 "Nuestra ciudad capital está rodeada por el Nat de las Colinas, que Bna'a Nat bendiga nuestras ciudades.\n\n#! Efecto Apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_mountain_nat:0 "$omen_mountain_nat$"
 omen_mountain_nat:0 "Trè Nat"
 omen_mountain_nat_desc:0 "Nuestra capital está rodeada por el Nat de la Montaña, que Trè Nat bendiga nuestras ciudades.\n\n#! Efecto Apoteosis: $military_apotheosis_defensive_effect_tt_description$"

 deity_plains_nat:0 "$omen_plains_nat$"
 omen_plains_nat:0 "Kunkok Nat"
 omen_plains_nat_desc:0 "Nuestra ciudad capital está rodeada por el Nat de las Llanuras, que Kunkok Nat bendiga nuestras ciudades.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_steppes_nat:0 "$omen_steppes_nat$"
 omen_steppes_nat:0 "K'seh Nat"
 omen_steppes_nat_desc:0 "Nuestra capital está rodeada por el Nat de la Estepa, que K'seh Nat bendiga nuestras ciudades.\n\n#! Efecto apoteósico: $military_apotheosis_manpower_effect_tt_description$"

 deity_flood_plain_nat:0 "$omen_flood_plain_nat$"
 omen_flood_plain_nat:0 "Diin Nat"
 omen_flood_plain_nat_desc:0 "Nuestra ciudad capital está rodeada por el Nat de la llanura aluvial, que Diin Nat bendiga nuestras ciudades.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_desert_hills_nat:0 "$omen_desert_hills_nat$"
 omen_desert_hills_nat:0 "Bnapimtuul Nat"
 omen_desert_hills_nat_desc:0 "Nuestra ciudad capital está rodeada por el Nat de las Colinas del Desierto, que Bnapimtuul Nat bendiga nuestras ciudades.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_noble_effect_tt_description$"

 deity_kingdom_nat:0 "$omen_kingdom_nat$"
 omen_kingdom_nat:0 "Nikem Nat"
 omen_kingdom_nat_desc:0 "Nikem Nat, el Nat del Reino y el Imperio que protege las fronteras y los deseos después de la guerra, se ha revelado a la gente.\n\n#! Efecto apoteósico: $culture_apotheosis_civic_tech_effect_tt_description$"
