l_spanish:

 deity_merre:0 "$omen_merre$"
 omen_merre:0 "Merré"
 omen_merre_desc:0 "En los tiempos en que nuestro pueblo está afligido por enfermedades o calamidades, podemos pedir a nuestro Padre que venza las enfermedades y sane nuestros cuerpos, el que es luz.\n\nUno de los epítetos del Padre de los sardos, ligado a las cualidades curativas del dios, pedía a menudo ayuda en caso de enfermedades. La palabra 'Merre' significa 'Señor' y los extranjeros suelen asociarla con la figura del griego Asclepios y el romano Esculapio.\n\n#! Efecto Apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_iolaus:0 "$omen_iolaus$"
 omen_iolaus:0 "Yolao"
 omen_iolaus_desc:0 "El sol, símbolo de nuestro Padre, bendecirá a nuestro pueblo con la luz de aquel que no puede ser nombrado. El disco y el Tauro, su poder vencerá a nuestros enemigos.\n\nEntre los títulos del Padre de los Sardos, Usil se refiere al sol, símbolo de relevancia ligado a la antigua figura del Tauro de la Luz. Este último es una parte inseparable del dios, representado y tallado en piedra desde la época prenurágica dentro de la Domus de Janas y dentro de la era nurágica, dentro de los Nuraghes y los Pozos Sagrados.\n\n#! Efecto Apoteosis: $military_apotheosis_defensive_effect_tt_description$"

 deity_bakis:0 "$omen_bakis$"
 omen_bakis:0 "bakis"
 omen_bakis_desc:0 "Una deidad ampliamente conocida, derivada de los Fufluns etruscos y relacionada con el Baco romano. El dios del vino, asociado a la tierra y la fertilidad de los campos; patrón de la felicidad, la salud y el crecimiento.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"

 deity_norax:0 "$omen_norax$"
 omen_norax:0 "Norax"
 omen_norax_desc:0 "Un héroe de antaño, una vez rey de Tarsis en los tiempos de su antigua gloria, fundador de Nura. ¿Su legado y su fuerza guiarán a nuestro pueblo en estos tiempos?\n\nUn héroe elevado a deidad entre los sardos, una vez rey de Tarsis y fundador de Nura. A pesar de los conflictos dentro de las fuentes antiguas extranjeras, la Tarsis a la que está vinculado Norax, puede no referirse a la debatida Tartesso, sino a la ciudad de Tarsis, o Tarsis (la actual Tharros), una importante ciudad-estado que había perdido su prominencia después de la guerra contra Cartago alrededor del año 500 a.C.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"

 deity_orgia:0 "$omen_orgia$"
 omen_orgia:0 "Orgia"
 omen_orgia_desc:0 "El agua sagrada de los santos pozos traerá prosperidad y sabiduría a nuestro pueblo. Que nuestro Padre proteja a nuestros marineros y marineros, que el agua sagrada defina quién es justo y quién no.\n\nDentro de los numerosos rostros y funciones del Padre de los sardos, uno destacado está dedicado al culto de las fuentes de agua sagradas (Orga/Orgia = fuente, agua), abordadas dentro de los complejos arquitectónicos Santos Pozos y Templos de Megaron, o las Santas cuevas ligadas a la figura ctónica del dios.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"

 deity_daedalos:0 "$omen_daedalos$"
 omen_daedalos:0 "Samas"
 omen_daedalos_desc:0 "El disco solar, manifestación de nuestro Padre, puede otorgarnos la fuerza para vencer la oscuridad y el mal. El que es Justicia y Equidad entre los hombres.\n\nUn epíteto del Padre de los Sardos, que muy probablemente se refiere al Sol, o al disco solar, símbolo importante del dios vinculado con las prominentes representaciones del tauro solar. Este rostro del dios habría estado vinculado con la cualidad de Justicia y Equidad entre los hombres, asociada a su posición como Juez de los Muertos.\n\n#! Efecto Apoteosis: $economy_income_effect_tt_description$"

 deity_aristeo:0 "$omen_aristeo$"
 omen_aristeo:0 "Aristeo"
 omen_aristeo_desc:0 "Podemos pedirte ayuda, tú que fundaste la ciudad de Kalari, que nuestros olivos y uvas crezcan en número, que nuestra tierra produzca los frutos que necesitamos en abundancia.\n\nUn héroe, elevado a deidad venerada por los sardos. Fundador de Kalari, una importante ciudad estado en el sur, el culto a Aristanes estaba ligado a la fertilidad de los campos, la miel, los olivos y las uvas.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"

 deity_maimone:0 "$omen_maimone$"
 omen_maimone:0 "Maimón"
 omen_maimone_desc:0 "Que nuestro Padre responda a nuestros llamados y bendiga nuestros campos con lluvias y agua en justa cantidad. Sus truenos y nubes vencerán a aquellos que no cumplan sus mandamientos.\n\nUn epíteto importante del padre de los sardos, específicamente relacionado con el clima y la lluvia. A menudo recordado a través de oraciones individuales, asociadas también al nombre de \"Mamusi\" y a sus formas diminutas 'Mamuthones', el nombre de las figuras enmascaradas de los ritos sardos.\n\n#! Efecto apoteósico: $naval_apotheosis_effect_tt_description$\n $storm_of_the_century_effect_tt_description$"

 deity_manorvae:0 "$omen_manorvae$"
 omen_manorvae:0 "Manorgai"
 omen_manorvae_desc:0 "Una deidad derivada de la etrusca Menrva, diosa de la estrategia y la guerra similar a la griega Atenea. También mecenas del arte, el comercio y la educación, con poderes para influir en el clima.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_urgus:0 "$omen_urgus$"
 omen_urgus:0 "Urgus"
 omen_urgus_desc:0 "Nuestro Padre, el juez del inframundo, dejará que el demonio antiguo devore el alma de aquellos que traicionan a nuestro pueblo, aquellos que no han sido justos en la vida, aquellos que han roto el juramento sagrado.\n\nEntre los ritos ligados al Padre de los Sardos, la figura de Urgus está a menudo presente en los rituales como una bestia rebelde, cubierta de piel, que es encadenada, golpeada y luego asesinada por los sirvientes de el Dios, para garantizar la fertilidad de los campos durante el año. Urgus es por lo tanto una figura ctónica, o un demonio, al que también tienen derecho varios Nuraghes, es también el que garantiza la solidez de los juramentos sagrados, ya que aquellos que romperían sus juramentos en vida serían devorados por el propio Urgus.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_assemini:0 "$omen_assemini$"
 omen_assemini:0 "assemini"
 omen_assemini_desc:0 "Una deidad asociada con la Lidia Arthemides, diosa de la fertilidad, de la naturaleza y los bosques; patrono de los animales salvajes y de la caza. Vinculado con el símbolo del ciervo, este último está muy presente en la iconografía nurágica, especialmente en forma de protomos de ciervo colocados en la proa de los barcos.\n\n#! Efecto apoteósico: $lustful_fertility_apotheosis_effect_tt_description$"

 deity_murgurio:0 "$omen_murgurio$"
 omen_murgurio:0 "Murgurio"
 omen_murgurio_desc:0 "Mensajero entre los hombres y los dioses, protector de los comerciantes y psicopompo, Murguriò conduce las almas de los muertos al más allá. Probablemente relacionado con el culto a los Turms etruscos.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"

 deity_babai:0 "$omen_babai$"
 omen_babai:0 "Babai"
 omen_babai_desc:0 "El Señor de la Luz bendecirá a nuestro pueblo, el que es el Cazador, el Poderoso, Adon Sid Addir Bab. Una de las manifestaciones del Padre de los Sardos, venerada en el templo de Sardopatoris, construido sobre las ruinas de un antiguo lugar sagrado. Muchos vinieron en peregrinación para buscar su ayuda, pero muchos temerán sus maldiciones.\n\nUna de las manifestaciones del Padre de los sardos, adorada en el templo de Sardopatoris, construido por los cartagineses sobre un antiguo lugar sagrado sardo. Se le conoce como Adon Sid Addir Bab, un conjunto de títulos que se traduce como \"el Señor, Cazador, Poderoso, Padre\". En particular, los seguidores de esta cara del dios se dirigirían indirectamente a la entidad a través de otras deidades cananeas, consideradas intermedias, como Melqart y Shadrapa.\n\n#! Efecto Apoteosis: $military_apotheosis_defensive_effect_tt_description$"

 deity_mother_goddess_nuragic:0 "$omen_mother_goddess_nuragic$"
 omen_mother_goddess_nuragic:0 "Diosa Madre"
 omen_mother_goddess_nuragic_desc:0 "La Diosa Madre de las culturas nurágica y corsa están relacionadas con las Diosas Madres del Mediterráneo. Al igual que Sid Addir, su culto ahora se limita al interior de las islas, a la espera de recuperar su tierra.\n\nUna deidad femenina relacionada con la etrusca Manturna, diosa del matrimonio, la fertilidad y patrona del cónyuge.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_sardus_can:0 "$omen_sardus_can$"
 omen_sardus_can:0 "Sardus"
 omen_sardus_can_desc:0 "Luz de Il, Padre, Tauro de Luz, Yah y Yahw. El que puso nombre a nuestra Isla y a nuestro pueblo. Te pedimos tu sabiduría, que nos des la fuerza para resistir a nuestros enemigos. Los Nuraghes, nuestras torres, construidas sobre tu nombre, nos permitirán recordar tu herencia para siempre.\n\nUna deidad antigua, epónima tanto de Cerdeña como de su gente. El dios nacional de los sardos es una continuación directa de los cultos prenurágicos autóctonos anteriores. Un dios sin nombre, al que sólo se hace referencia mediante epítetos, sobre todo \"Padre\", incluso Luz de Il, Yah y Yahw. Durante mil años, los sardos construyeron miles de torres de piedra, llamadas Nurac (hoy Nuraghes), en su nombre.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"

 deity_horon:0 "$omen_horon$"
 omen_horon:0 "Horón"
 omen_horon_desc:0 "Horon, también escrito como Hauron o Hawran, es una antigua deidad egipcia de Giza. Los eruditos coinciden en que Horon es un dios relacionado con Harmachis, también llamado Horus, en etimología. Y su origen está precisamente en Canaán. En Egipto, se le conoce como Hawran, pero la ortografía cananea es Horon. También puede ser el modelo de la Gran Esfinge de Giza. En la tradición cananea, se le considera un dios de la perdición, mientras que en la tradición egipcia se le considera un dios de los pastores y del desierto; particularmente, un dios de la protección del desierto.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_shadrapa:0 "$omen_shadrapa$"
 omen_shadrapa:0 "shadrapa"
 omen_shadrapa_desc:0 "Shadrapa, también llamado Shadrafa, es un dios púnico poco conocido de la curación y la medicina. A veces se le representa como un joven empuñando un escorpión o una serpiente. Shadrapa probablemente surgió del sincretismo heleno-púnico, posiblemente incluso del sincretismo romano-púnico. Puede que incluso se trate de la interpretación púnica de una deidad helénica. Desafortunadamente, la deidad no está bien atestiguada, por lo que es difícil saber la naturaleza exacta de Shadrapa.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
