l_spanish:
 #Germanics
 deity_mannus:0 "$omen_mannus$"
 omen_mannus:1 "Mannuz"
 omen_mannus_desc:3 "Llamado Mannus por Tácito, Mannuz era el hijo de nuestro antepasado Twisto y él mismo dio a luz a tres hijos que luego se extenderían y colonizarían el mundo. Por lo tanto, es también el antepasado de todos los pueblos germánicos, aunque algunas tribus sostienen que hubo más hijos suyos, es decir, sus propios antepasados. Como el primer ser en poseer la virilidad humana, como tal es venerado como su símbolo y patrón.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_yngvi:0 "$omen_yngvi$"
 omen_yngvi:1 "Ingwaz"
 omen_yngvi_desc:3 "Nuestro señor, en germánico Frawjaz (convirtiéndose en Freyr en nórdico antiguo), Ingwaz es uno de los hijos de Mannuz y progenitor de los Ingvaeones. Más tarde, los reyes noruegos rastrearían su linaje hasta el dios de la prosperidad al que llamaron Yngvi.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"

 deity_irmin:0 "$omen_irmin$"
 omen_irmin:1 "Ermunaz"
 omen_irmin_desc:3 "El gran pilar que sostiene el mundo es el Ermunasuliz que está relacionado con el dios Ermunaz, uno de los hijos de Mannuz y antepasado de los Irminones. Carlomagno más tarde destruiría un árbol llamado Irminsul, provocando a los sajones bajo Widukind.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_istaevo:0 "$omen_istaevo$"
 omen_istaevo:1 "Istijo"
 omen_istaevo_desc:3 "No se sabe mucho sobre el tercer hijo de Mannus, Istijo. Los Istvaeones se unirían más tarde como los francos, quienes afirmaron que ellos y los romanos eran descendientes de Istijo para integrar a los romanos en la historia franca.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"

 deity_gautr:0 "$omen_gautr$"
 omen_gautr:1 "Gautaz"
 omen_gautr_desc:3 "Gautaz, verter, es uno de los muchos nombres de Wodenaz (conocido por los nórdicos como Odin) y el primer nombre mencionado de fuentes romanas. A menudo se le representa junto con dos cuervos que le cuentan todos los acontecimientos de la Tierra (llamados Huginn y Muninn en nórdico antiguo), y con un solo ojo, ya que lo sacrificó para obtener aún más sabiduría.\n\n#! Efecto de apoteosis: $culture_apotheosis_rel_tech_effect_tt_description$"

 deity_thunraz:0 "$omen_thunraz$"
 omen_thunraz:1 "Thunraz"
 omen_thunraz_desc:3 "Donar, un dios que empuñaba un martillo y estaba asociado con los relámpagos, los truenos, las tormentas, los bosques y árboles sagrados, la fuerza, la protección de la humanidad y también la santificación y la fertilidad, fue conocido siglos más tarde por los vikingos nórdicos como Thor, era un dios germánico de gran importancia. \n\nHistóricamente, los registros más antiguos de los pueblos germánicos fueron registrados por los romanos, y en estas obras se hace referencia con frecuencia a Donar/Thor, a través de un proceso conocido como interpretatio romana (donde las características percibidas como similares por los romanos dan como resultado la identificación de un dios no romano como una deidad romana), como el dios grecorromano Hércules. \n\n Donar/Thor es un dios destacado a lo largo de la historia registrada de los pueblos germánicos, desde la ocupación romana de las regiones de Germania hasta las expansiones germánicas del período de migración y su gran popularidad durante la era vikinga.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_tiwaz:0 "$omen_tiwaz$"
 omen_tiwaz:1 "Tiwaz"
 omen_tiwaz_desc:3 "Tiwaz, una forma temprana de lo que más tarde sería el dios nórdico Tyr, fue un dios de la guerra germánico de gran importancia. En la mitología nórdica, de la que provienen la mayoría de las narrativas sobrevivientes sobre dioses entre los pueblos germánicos, sacrifica su mano al monstruoso lobo Fenrir, quien le muerde la extremidad mientras los dioses atan al animal, y se predice que será consumido por el igualmente monstruoso perro Garmr durante los eventos de Ragnarök.\n\nMientras que la herencia etimológica de Tiwaz se remonta al Período protoindoeuropeo, que lo conecta con Zeus y Júpiter, sobreviven muy pocas referencias directas al dios antes del período nórdico antiguo. Como muchas otras deidades no romanas, Tiwaz recibe mención en los textos latinos a través del proceso de interpretatio romana, en el que los textos latinos se refieren al dios a través de una contraparte percibida en la mitología romana, a través de la cual se lo identifica con Marte.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"

 deity_wodenaz:0 "$omen_wodenaz$"
 omen_wodenaz:1 "Wodenaz"
 omen_wodenaz_desc:3 "Wodenaz, una forma temprana del dios nórdico Odin, era un dios ampliamente venerado en la mitología germánica. La mitología nórdica, la fuente de la mayor parte de la información que se conserva sobre él, lo asocia con la sabiduría, la curación, la muerte, la realeza, la horca, el conocimiento, la guerra, la batalla, la victoria, la hechicería, la poesía, el frenesí y el alfabeto rúnico, y lo proyecta como el esposo de la diosa Frigg. \n\nLos primeros registros de los pueblos germánicos fueron registrados por los romanos, y en estas obras se hace referencia con frecuencia a él, a través de un proceso conocido como interpretatio romana (donde las características percibidas como similares por los romanos dan como resultado la identificación de un dios no romano como una deidad romana), como el dios romano Mercurio. \n\nEl primer ejemplo claro de esto ocurre en la obra Germania, de finales del siglo I, del historiador romano Tácito, donde, al escribir sobre la religión de los suevos (una confederación de pueblos germánicos), comenta que \"entre los dioses, Mercurio es a quien adoran principalmente\". Consideran que es un deber religioso ofrecerle, en días determinados, víctimas humanas y de otro tipo para el sacrificio.''\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"

 deity_wulthuz:0 "$omen_wulthuz$"
 omen_wulthuz:1 "Wulthuz"
 omen_wulthuz_desc:3 "Wulthuz, o Ullr en la mitología nórdica, era un dios germánico de notable importancia. Era un dios asociado con el invierno, la caza y el tiro con arco. Se decía que era un excelente esquiador y a menudo se le representaba con esquís y portando un arco. Algunas fuentes también lo conectan con prestar juramento y hacer justicia a su nombre, Wulthuz, que significa gloria y justicia.\n\nSi bien se ha perdido mucho conocimiento del dios en cuestión, debido a que la memoria de Wulthuz se había desvanecido cuando se compusieron las fuentes existentes (posiblemente indicando que pudo haber sido más antiguo que los otros dioses nórdicos, por lo que podría haber venido de versiones anteriores del mitos.)\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"

 deity_frijjo:0 "$omen_frijjo$"
 omen_frijjo:1 "Frijjo"
 omen_frijjo_desc:3 "Frijjo, una diosa germánica asociada con la previsión y la sabiduría, o como más tarde la conocerían los nórdicos, Frigg era la esposa de Odín. \n\nExiste una posible mención histórica temprana de ella a partir de las interacciones de los romanos con los pueblos germánicos a través del proceso de interpretatio romana, en el que los textos latinos se refieren al dios a través de una contraparte percibida en la mitología romana, comparándola con la diosa Isis, aunque debe tenerse en cuenta que esta mención histórica puede haberse referido a la diosa Frawjo, conocida más tarde por los nórdicos como Freyja. \n\nLos estudiosos debaten si Freyja y la diosa Frigg en última instancia provienen de una única diosa común entre los pueblos germánicos. Si bien esto es posible y comparten muchos atributos, es solo una teoría y otros plantean que efectivamente se originaron a partir de dos diosas diferentes.\n\n #! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"

 deity_frawjo:0 "$omen_frawjo$"
 omen_frawjo:1 "Frawjo"
 omen_frawjo_desc:3 "Frawjo, una diosa germánica asociada con el amor, la belleza, la fertilidad, el sexo, la guerra, el oro y el seiðr, fue conocida más tarde por los nórdicos como Freyja, y la mayor parte de la información que se conserva sobre ella proviene de estos mitos posteriores. Freyja gobierna su campo celestial, Fólkvangr, donde recibe la mitad de los que mueren en la batalla y la otra mitad va al salón del dios Odín, Valhalla. \n\nExiste una posible mención histórica temprana de ella a partir de las interacciones de los romanos con los pueblos germánicos a través del proceso de interpretatio romana, en el que los textos latinos se refieren al dios a través de una contraparte percibida en la mitología romana, comparándola con la diosa Isis, aunque debe tenerse en cuenta que esto podría haberse referido a la diosa Frijjo, conocida más tarde por los nórdicos como Frigg. \n\nLos eruditos debaten si la diosa Freyja y Frigg en última instancia provienen de una única diosa común entre los pueblos germánicos. Si bien esto es posible y comparten muchos atributos, es solo una teoría y otros plantean que efectivamente se originaron a partir de dos diosas diferentes.\n\n #! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"

 deity_halja:0 "$omen_halja$"
 omen_halja:1 "Halja"
 omen_halja_desc:3 "Halja, conocida más tarde por los nórdicos como Hel, era una diosa germánica de la muerte y gobernante del inframundo, que comparte su nombre. Si bien la única información histórica superviviente se deriva de su posterior encarnación nórdica de Hel, existe posible evidencia temprana de que se remonta a la época romana siglos antes. \n\nSe ha sugerido que varios medallones y bracteates de imitación del período de migración germánica (ca. El primer siglo d.C.) presentan representaciones de ella. En particular, las bracteadas IK 14 e IK 124 representan a un jinete que baja por una pendiente y se encuentra con una mujer que sostiene un cetro o un bastón. La pendiente descendente puede indicar que el jinete está viajando hacia el reino de los muertos y la mujer con el cetro puede ser una gobernante de ese reino, correspondiente a Halja.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"

 deity_haimadallaz:0 "$omen_haimadallaz$"
 omen_haimadallaz:0 "Haimadallaz"
 omen_haimadallaz_desc:0 "Haimadallaz es el nombre de la antigua deidad del antiguo paganismo germánico que era el equivalente al dios nórdico Heimdallr. Si bien no sabemos cómo habrían llamado los germánicos a este dios, hay evidencia que sugiere que Heimdallr era un dios venerado desde mucho antes de que el panteón nórdico se separara del panteón germánico. \n\nBasado en suposiciones de la mitología nórdica, Haimadallaz estaba asociado con guardar y proteger el hogar de los dioses. Su nombre, de hecho, parece arraigar en esta idea ya que 'haimaz' significa hogar y 'dallaz' significa árbol, por lo que es el protector del hogar de los dioses y del árbol del mundo.\n\nAunque no todos los estudiosos están de acuerdo, se ha puesto en cuarto lugar que Haimadallaz también podría haber sido un dios de la sexualidad y la fertilidad. Esto se basa en su asociación con el símbolo fálico del carnero y su asociación con el árbol del mundo, que es un árbol de la vida. Esto se complementa además con la palabra 'dallr' que a veces se asocia con la diosa de la fertilidad, Frijjo.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"

 deity_luk:0 "$omen_luk$"
 omen_luk:1 "Luko"
 omen_luk_desc:3 "Una muy posible encarnación temprana del dios nórdico Loki, el dios germánico Luko (aunque la etimología del nombre Loki ha sido ampliamente debatida, se cree que su origen está en la raíz germánica Luk ''lock''), un dios cuyos orígenes y papel en la mitología han sido ferozmente debatidos por los eruditos, algunos de los cuales lo han descrito como un dios embaucador, mientras que otros han teorizado que pudo haber servido como un dios del Hogar/Fuego, similar al dios griego. Diosa Hestia. \n\nSi bien se ha encontrado poca evidencia sólida de su existencia germánica temprana durante este período de la historia, al igual que con otros dioses nórdicos, algunos eruditos creen que probablemente pudo haber existido en este momento, debido a su importancia posterior en la mitología nórdica.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"

 deity_baloraz:0 "$omen_baloraz$"
 omen_baloraz:1 "Baldraz"
 omen_baloraz_desc:3 "Baldraz, un dios de la mitología germánica, fue una encarnación temprana del dios nórdico Baldr, hijo de Odín y Frigg y dios de la luz, la alegría, la pureza y el sol de verano. En el mito nórdico posterior, la muerte de Baldr fue a la vez una gran tragedia para los Æsir y un presagio del Ragnarök. \n\nA veces se le ha comparado con el Apolo grecorromano, para quien existen características similares. \n\nSi bien se ha encontrado poca evidencia sólida de su existencia germánica temprana durante este período de la historia, al igual que con otros dioses nórdicos, algunos eruditos creen que probablemente pudo haber existido en este momento, debido a su importancia posterior en la mitología nórdica.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_brodenaz:0 "$omen_brodenaz$"
 omen_brodenaz:0 "Brodenaz"
 omen_brodenaz_desc:0 "Hemos identificado al dios Brahma de los hindúes con el poderoso Wodenaz. En nuestras creencias combinadas, el gran Brodenaz es el ser supremo. El dios de la sabiduría y la magia creó el mundo; también es la deidad patrona de la hermandad. Un culto popular llamado 'Los hermanos de Brodenaz' ha surgido en nuestra nación.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"

 deity_wishnuaz:0 "$omen_wishnuaz$"
 omen_wishnuaz:0 "Wishtunraz"
 omen_wishnuaz_desc:0 "El dios Wishnu de los indios nativos es el dios del pueblo, muy parecido al poderoso Thunraz. Por lo tanto, nuestra creencia combinada da origen a Wishtunraz. Wishtunraz aparece en muchas formas y en la forma de nuestro pueblo ejerce el poder del trueno. Él es la conexión que tenemos con el reino divino. A veces se le conoce como una deidad indecisa por alguna extraña razón.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"

 deity_frijjoshmi:0 "$omen_frijjoshmi$"
 omen_frijjoshmi:0 "Frijjoshmi"
 omen_frijjoshmi_desc:0 "La diosa de la belleza, Frijjo, y la diosa de la fortuna, Lakshmi, se han vuelto una como Frijjoshmi. El amor y la suerte son una combinación mortal, aunque a algunos les resulta extraño que Frijjoshmi esté casado con Brodenaz y Wishtunraz en nuestra fe híbrida.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"

 deity_freyrudra:0 "$omen_freyrudra$"
 omen_freyrudra:0 "Freyrudra"
 omen_freyrudra_desc:0 "Freyr y Rudra se combinan en nuestras creencias para formar Freyrudra. Freyr representa el buen tiempo y la cosecha, mientras que Rudra representa vientos y tormentas. Juntos forman una deidad suprema del clima, y ​​además, es el erradicador supremo de los problemas y la divinidad de los reyes. Freyrudra también es llamado \"Señor de los Once\" debido a que las raíces de su nombre significan precisamente eso. Se dice que 7 cultos de los 11 están repartidos por nuestras tierras.\n\n#! Efecto Apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"
