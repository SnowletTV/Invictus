l_spanish:
 ## Generic ##
 deity_tuisto:0 "$omen_tuisto$"
 omen_tuisto:1 "Tuisto"
 omen_tuisto_desc:3 "Tuisto es la deidad suprema de nuestro panteón y el antepasado de nuestra tribu y nuestro pueblo. Nacido de la tierra, tuvo varios hijos que se convirtieron en gobernantes de lo que más tarde se convertirían en las tribus germánicas. Nuestro pueblo acude a él en busca de guía y ayuda en todas las cosas, y lo celebra profundamente en nuestras ceremonias.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_alcis:0 "$omen_alcis$"
 omen_alcis:1 "Alcis"
 omen_alcis_desc:3 "A pesar de todas las apariencias, Alcis es en realidad el nombre de dos deidades hermanas contadas como una sola, un conjunto de Divinos Gemelos. Venerados por su juventud y su amor fraternal, en ocasiones se les representa como caballos o carros que arrastran el sol por el cielo.\n\n#! Efecto apoteósico: $culture_apotheosis_characters_effect_tt_description$"
 deity_tamfana:0 "$omen_tamfana$"
 omen_tamfana:1 "Tamfana"
 omen_tamfana_desc:3 "Tamfana es venerada en algunos de los lugares más sagrados de Germania y es una deidad importante para los bosques sagrados de allí. Además como es una de las diosas patronas de la cosecha, muchas veces dejamos sus ofrendas cuando nuestros hombres están a punto de salir al campo.\n\n#! Efecto Apoteosis: $economy_apotheosis_capital_citizens_effect_tt_description$"
 deity_baduhenna:0 "$omen_baduhenna$"
 omen_baduhenna:1 "Baduhenna"
 omen_baduhenna_desc:3 "Como una de las matronas de nuestro panteón, Baduhhenna es a menudo invocada e invocada cuando va a la guerra. Nuestros hombres y soldados la buscan en busca de guía y esperan que ella guíe su mano mientras luchan por las tribus.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_vagdavercustis:0 "$omen_vagdavercustis$"
 omen_vagdavercustis:1 "Vagdavercustis"
 omen_vagdavercustis_desc:3 "Para algunos de nuestro pueblo, Vagdavercustis es la deidad principal de la guerra, la perspicacia militar y la virtud. Sus muchas historias inspiran a nuestros hombres y soldados sobre cómo actuar, y algunos afirman que ella guía sus manos en la batalla después de ofrecerle sus oraciones.\n\n #! Efecto apoteósico: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_hludana:0 "$omen_hludana$"
 omen_hludana:1 "Hludana"
 omen_hludana_desc:3 "Hludana es conocida como la protectora del bosque, así como la deidad patrona de la agricultura. Hludana suele asociarse con la fidelidad, la lealtad y se la retrata como una figura comprensiva. En tiempos difíciles, nuestra gente recurre a ella en busca de protección.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 deity_nehalennia:0 "$omen_nehalennia$"
 omen_nehalennia:1 "Nehallenia"
 omen_nehalennia_desc:3 "Nehallenia, la diosa patrona del comercio, la horticultura y el comercio. Por lo general, se la representa como una deidad sentada con un perro a su lado, así como mercancías que caen bajo su dominio. Los comerciantes y mercaderes a menudo la invocan cuando hacen tratos en tierras extranjeras o con personas provenientes de culturas extrañas y exóticas, al igual que las personas que desean su ayuda en la producción de mercancías y bienes.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
 deity_nerthus:0 "$omen_nerthus$"
 omen_nerthus:1 "Nerthus"
 omen_nerthus_desc:3 "Como una de nuestras principales diosas de la fertilidad, así como una de las deidades de la fertilidad más populares entre las tribus germánicas en general, Nerthus es una vista familiar y una deidad admirada en nuestra nación. Las historias dicen que Nerthus tiene un interés particular en los asuntos humanos y, a menudo, viaja entre sus seguidores y su gente.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"
