l_spanish:

 deity_ilma:0 "$omen_ilma$"
 omen_ilma:0 "Ilma"
 omen_ilma_desc:0 "Ilma es la deidad suprema del aire y el cielo. Es conocido por muchos nombres, desde Inmar, Ilmarinen, Num-Ilem y más. Ilmaric lleva el nombre de esta gran deidad. En las lenguas finno-ugrias, la raíz Ilma se encuentra en muchos de los dioses, lo que sugiere fuertemente que Ilma es la deidad suprema finno-ugria.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_kuje:0 "$omen_kuje$"
 omen_kuje:0 "Kuu"
 omen_kuje_desc:0 "Los Ilmarics creen firmemente en el cielo, la luna y las estrellas, y Kuu representa a la luna como la diosa de la luna. Se dice que posee el oro de la luna y es capaz de tejer ropa dorada con los hilos lunares.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_akka:0 "$omen_akka$"
 omen_akka:0 "Akka"
 omen_akka_desc:0 "Akka es la diosa de la fertilidad. Representa la menestración, el amor, la sexualidad, el embarazo y el parto. Ella es la máxima representación de la feminidad en forma divina.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"

 deity_mareta:0 "$omen_mareta$"
 omen_mareta:0 "Mana"
 omen_mareta_desc:0 "Mana es la diosa de la muerte, que controla el paso y la casa de los muertos, la manala. En algunas culturas, se la ve como el dios de la muerte y la enfermedad, que ataca a las personas con enfermedades y muerte.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"

 deity_jumla:0 "$omen_jumla$"
 omen_jumla:0 "Jumla"
 omen_jumla_desc:0 "Jumla es el dios del pueblo y, a menudo, se le conoce simplemente como \"el dios\". Es posible que haya sido más bien un término genérico para dios, sin embargo, también es posible que en realidad fuera un dios independiente antes de convertirse en un término genérico.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_jada:0 "$omen_jada$"
 omen_jada:0 "Jada"
 omen_jada_desc:0 "Jada era una diosa, o potencialmente un dios, de la magia y los chamanes. Capaz de conjurar y maldecir a las personas, esta peligrosa deidad no debe tenerse en cuenta.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"

 deity_pajewa:0 "$omen_pajewa$"
 omen_pajewa:0 "Pajewa"
 omen_pajewa_desc:0 "Los imaricos veneraban el sol, la luna y el cielo, y la diosa del sol era Pajewa. Se dice que posee la plata del sol y es capaz de tejer ropa plateada con la tela solar.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"

 deity_vesa:0 "$omen_vesa$"
 omen_vesa:0 "Visi"
 omen_vesa_desc:0 "Visi es el espíritu del agua. A veces llamada la Madre de las Aguas, controla las heladas aguas del norte. Se la representa con cabello largo, pechos grandes y la parte inferior del cuerpo de un pez; muy parecido a una sirena.\n\n#! Efecto de apoteosis: $war_apotheosis_martial_tech_effect_tt_description$"

 deity_metsa:0 "$omen_metsa$"
 omen_metsa:0 "Metsa"
 omen_metsa_desc:0 "Mesta es el espíritu del bosque. A veces llamada la Madre del Bosque, controla los bosques nevados del norte. También controla los animales salvajes de los bosques como osos, serpientes y lobos.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"

 deity_wajni:0 "$omen_wajni$"
 omen_wajni:0 "Wajni"
 omen_wajni_desc:0 "El wajni es el alma viviente de cada persona. Esto a veces se conoce como \"aliento del alma\". El wajni está designado a un cuerpo, y sólo lo abandona en el momento de la muerte.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"

 deity_esi:0 "$omen_esi$"
 omen_esi:0 "Esi"
 omen_esi_desc:0 "El esi es el alma viajera que alguna vez fue el wajni, el alma viviente. El esi es conocido como el \"alma de la sombra\". Existe más notablemente después de la muerte, sin embargo, el esi también puede existir durante la inconsciencia, como los sueños.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"

 deity_koudorso:0 "$omen_koudorso$"
 omen_koudorso:0 "Koudorso"
 omen_koudorso_desc:0 "Koudorso, el dios del Trueno. Es un dios poderoso, capaz de golpear a sus enemigos con sus poderosos rayos. Koudorso se sincronizaría más tarde con Tuistic Thunraz, o Thor, pero originalmente era independiente de él.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
