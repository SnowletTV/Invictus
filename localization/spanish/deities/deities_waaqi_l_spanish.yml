l_spanish:

 deity_nidar:0 "$omen_nidar$"
 omen_nidar:0 "Nidar"
 omen_nidar_desc:0 "Cuando los oprimidos claman por venganza, es Nidar, el Corrector de los Errores, quien atiende el llamado, porque es él quien rectificará los errores cometidos contra los justos. \n\nNidar es un Ayaanle, un ser celestial que obedece la voluntad del omnisciente Waaq e intercede ante la humanidad en su nombre.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 
 deity_wiilwaal:0 "$omen_wiilwaal$"
 omen_wiilwaal:0 "Wiilwaal"
 omen_wiilwaal_desc:0 "Wiilwaal, un antiguo rey de grandes hazañas y renombre, trascendió su estructura mortal por el valor de sus acciones heroicas y finalmente se acercó a algo parecido a la divinidad. \n\nWiilwaal es adorado por los seguidores de la fe Waaq que recuerdan sus acciones poderosas y audaces, quienes rezan para que su espíritu de lucha y su santa sabiduría continúen guiando a su pueblo.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 
 deity_habbad_ina_kamas:0 "$omen_habbad_ina_kamas$"
 omen_habbad_ina_kamas:0 "Habbad Ina Kamas"
 omen_habbad_ina_kamas_desc:0 "En los días en que los dioses vagaban por la tierra, al terrible y cruel gigante Habbad Ina Kamas se le dio dominio sobre la mitad de los reinos del hombre, gobernando a sus esclavos como un tirano y déspota. Cuando la gente ya no pudo soportar más sus malvados caminos y sus almas clamaron en voz alta pidiendo misericordia, Habbad Ina Kamas finalmente fue derrocado por su par, el gigante Biriir Ina Barqo, poniendo fin a su oscuro reinado.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 
 deity_waaq:0 "$omen_waaq$"
 omen_waaq:0 "Waaq"
 omen_waaq_desc:0 "¿Quién entre los dioses es como Waaq, Creador y Protector que bendice a su pueblo con lluvia dadora de vida? ¿Hay algo que sucede que no esté dictado y guiado por su benevolencia? \n\nWaaq es la deidad suprema de la religión que lleva el nombre apropiado de su adoración, que es capaz de controlar las tormentas y enviar el agua de Dios a sus devotos. Es Waaq quien comanda a los Ayaanle, los mediadores celestiales que velan directamente por sus devotos.\n\n#! Efecto Apoteosis: $culture_apotheosis_characters_effect_tt_description$"
 
 deity_biriir_ina_barqo:0 "$omen_biriir_ina_barqo$"
 omen_biriir_ina_barqo:0 "Biriir Ina Barqo"
 omen_biriir_ina_barqo_desc:0 "El-Que-Usa-El-Anillo-Ningún-Hombre-Puede-Levantar, o el bueno y justo gigante Biriir Ina Barqo, descansa seguro en la Cueva de los Pájaros, su hogar sagrado. Una vez gobernante de la mitad del mundo, Biriir derrotó al malvado gigante Habbad Ina Kamas que había esclavizado a la otra mitad, rompiendo su gobierno tiránico para siempre. Aquellos que sufren injustamente sólo necesitan llamar a Biriir Ina Barqo, que no puede soportar presenciar el mal, para derrotar a los gigantes en sus propias vidas.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
 
 deity_qori_ismaris:0 "$omen_qori_ismaris$"
 omen_qori_ismaris:0 "Qori Ismaris"
 omen_qori_ismaris_desc:0 "A medida que la noche cae sobre la tierra, Qori Ismaris, que cambia de forma, se despoja de su forma humana y se vuelve como la Hiena, deslizándose entre las sombras y merodeando por las tierras de los hombres. Al frotar contra su cuerpo el talismán que porta, un bastón mágico dotado de poderes misteriosos, Qori Ismaris puede volver a asumir la forma de un hombre.\n\n#! Efecto Apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 
 deity_huur:0 "$omen_huur$"
 omen_huur:0 "Huur"
 omen_huur_desc:0 "Los malvados huyen antes de la llegada del Ayaanle conocido como Huur, el veloz dios pájaro que vuela rápidamente para promulgar la sagrada justicia de los Waaq. Temido como presagio de la ira divina y mensajero de la muerte, Huur es muy temido por los malhechores, quienes se marchitan al ver sus crueles garras y tiemblan ante sus gritos de ira.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 
 deity_arraweelo:0 "$omen_arraweelo$"
 omen_arraweelo:0 "Arraweelo"
 omen_arraweelo_desc:0 "Arraweelo fue una célebre reina de antaño, que gobernó en una época anterior a que se escribieran nuestros registros, aunque quienes tienen memoria todavía hablan y cantan sus hazañas. Negándose a ser dominada por las crueles órdenes de su marido, que buscaba restringir los roles de las mujeres al de servidumbre tradicional, Arraweelo cambió la situación e instruyó a las mujeres a hacer todo lo contrario, liberándolas de esta tiranía dominada por los hombres. Creyendo que el sexo justo era verdaderamente el más sabio de los dos y, por lo tanto, el líder nato, su ejemplo divino todavía inspira a nuestra gente.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"
 
 deity_buuti:0 "$omen_buuti$"
 omen_buuti:0 "Buuti"
 omen_buuti_desc:0 "Hija del demonio Dhegdheer, la criatura malvada que habita en los bosques y devora a los niños asustados y perdidos, Buuti decidió evitar los caminos de su madre y, en cambio, optó por ayudar a proteger a la gente. Maldita por su traición, la forma de Buuti cambió a la de una bestia caníbal, y ahora acecha en los bosques junto a otras criaturas de la oscuridad.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"
 
 deity_wagar:0 "$omen_wagar$"
 omen_wagar:0 "Wagar"
 omen_wagar_desc:0 "Prácticamente en todos los hogares de aquellos que obedecen la voluntad del dios del cielo Waaq, se puede encontrar la estatua de madera de Wagar, cuyo papel en los ritos de fertilidad es bien conocido. Así como un árbol conecta el cielo y la tierra, actuando como un puente entre ambos, así también el Wagar conecta a los fieles con la voluntad de Waaq, quien bendice a sus adoradores con fecundidad y fuerza.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_effect_tt_description$"
 
 deity_amel_ali:0 "$omen_amel_ali$"
 omen_amel_ali:0 "Amel Ali"
 omen_amel_ali_desc:0 "Amel Ali fue una vez una Reina de nuestro pueblo, una de gran renombre que mostró ternura hacia aquellos que tuvieron la suerte de llamarla Madre, cuidando a su pueblo como si fueran sus propios hijos. Aunque se la recuerda con cariño por su gobierno benevolente, Amel Ali también fue aclamada como la mujer más rápida de su tiempo, humillando a cualquiera que se atreviera a competir contra ella; seguramente, esto es un testimonio de su estatus divino.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 
 deity_ayaanle:0 "$omen_ayaanle$"
 omen_ayaanle:0 "Ayaanle"
 omen_ayaanle_desc:0 "Algunas personas podrían referirse a ellos como ángeles, intercediendo ante la humanidad en nombre del supremo y todopoderoso Waaq, pero los Ayaanle no pueden limitarse a palabras o meras descripciones. La buena fortuna sigue los pasos de los Ayaanle, quienes llevan los dones divinos del Waaq desde los cielos para compartirlos con los pueblos de abajo.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 deity_waaq_brahma:0 "$omen_waaq_brahma$"
 omen_waaq_brahma:0 "Waaq-Brahma"
 omen_waaq_brahma_desc:0 "Influenciado por las enseñanzas budistas y védicas, Waaq se ha sincretizado con Brahma y el budismo. Visto como el gran protector del Cielo y Brahmaloka, se dice que Waaq-Brahma controla los mismos vientos del mundo para ser un protector del Dharma. Al igual que Brahma Sahampati, se dice que Waaq-Brahma instó al Buda a compartir sus enseñanzas de iluminación con el mundo, llevando las palabras del Buda en los vientos a la gente.\n\n#! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
# Preserved Spanish-only entries
deity_wiilwaal_desc:0 "Antiguo rey de grandes hazañas y renombre, Wiilwaal trascendió su marco mortal por el valor de sus acciones heroicas y acabó acercándose a algo parecido a la divinidad. \nWiilwaal es venerado por los seguidores de la fe Qaaq que recuerdan sus poderosas y audaces acciones, que rezan para que su espíritu de lucha y su sagrada sabiduría sigan guiando a su pueblo."
