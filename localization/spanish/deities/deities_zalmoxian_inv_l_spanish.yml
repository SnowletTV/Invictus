l_spanish:
 deity_zichos:0 "$omen_zichos$"
 omen_zichos:0 "Zichosa"
 omen_zichos_desc:0 "Zichosa es una palabra tracia reconstruida para representar a la diosa tracia con patas de serpiente. Los tracios adoraban a esta diosa con patas de serpiente, pero no dejaron restos de su verdadero nombre. Probablemente era una diosa heredada de los escitas, quienes también tenían una diosa con patas de serpiente sin nombre. Zichosa es a menudo representada como una mujer alta con zarcillos en forma de serpiente en la cabeza y el cabello.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_kandaon:0 "$omen_kandaon$"
 omen_kandaon:0 "Kandaón"
 omen_kandaon_desc:0 "Kandaon es una diosa adorada por los tracios crestonianos, según los griegos, y es posible que también haya sido adorada por otros tracios. Los griegos la describían como una diosa \"extraña\". Algunos la identifican con Ares y derivan su nombre en el sentido de \"en llamas\". Esto también puede relacionarla con Hefesto.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_kotyto:0 "$omen_kotyto$"
 omen_kotyto:0 "Kotyttia"
 omen_kotyto_desc:0 "Kotytia, también conocida como Cotytia y Kotyto, era una diosa del sexo y estaba asociada con rituales orgásmicos. Es posible que provenga de una celebración del rapto de Perséfone, celebrada por los tracios de Edoni, antes de extenderse a los griegos. Para los griegos, su culto se extendió lo suficiente como para que la frase 'Compañera de Kotyttia' se convirtiera en sinónimo de 'puta'.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
 deity_tis:0 "$omen_zis$"
 omen_tis:0 "Tis"
 omen_tis_desc:0 "Tis, también llamado Zis, era hijo de Bendis y posiblemente la versión dacia del dios del cielo presente en los panteones de muchos pueblos indoeuropeos. Tis fue equiparado con muchos, muchos dioses extranjeros (Dioniso, Hermes, Apolo, Ares), lo que posiblemente indica que Tis era un dios antiguo del pueblo y, por lo tanto, lo suficientemente simple como para relacionarlo con cualquier dios nuevo. De hecho, es probable que Tis fuera el dios universal entre los pueblos tracios y dacios. También era conocido como un dios de muchas caras (normalmente tres) y un dios jinete.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_thrax:0 "$omen_thrax$"
 omen_thrax:0 "Thrax"
 omen_thrax_desc:0 "Thrax el Tracio, dios griego del pueblo tracio, era uno de los hijos de Ares. Algunas fuentes dicen que Thrax es un epíteto o un nombre primordial del propio Ares como patrón de los tracios. Por esta razón, el templo de Bistonia en Tracia guardaba en su interior el escudo dorado de Ares.\n\n#! Efecto apoteósico: $culture_apotheosis_oratory_tech_effect_tt_description$"
