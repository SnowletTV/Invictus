l_spanish:

 ## Dacian Deities ##
 deity_pleistoros:0 "$omen_pleistoros$"
 omen_pleistoros:1 "Pleistoros"
 omen_pleistoros_desc:4 "Pleistoros es un dios de la guerra brutal venerado y adorado por las tribus de Dacia. Regularmente sacrifican esclavos y prisioneros de guerra en su honor, esperando su bendición continua mientras libran sus muchas guerras.\n\n#! Efecto de apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_zalmoxis:0 "$omen_zalmoxis$"
 omen_zalmoxis:1 "Zalmoxis"
 omen_zalmoxis_desc:4 "Zalmoxis, o Gebeleizis como algunos lo llaman, fue un hombre sabio que convenció a los dacios a seguir sus creencias y su fe. Aunque supuestamente fue un humano en algún momento, las tribus ahora lo adoran como un ser divino que guía a los muertos, funcionando efectivamente como su psicopompo.\n\n #! Efecto de apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"

 ## Thracian Deities ##
 deity_sabazios:0 "$omen_sabazios$"
 omen_sabazios:1 "Sabazius"
 omen_sabazios_desc:4 "Sabazios es una de las muchas deidades de la guerra veneradas por las tribus de Tracia, pero es la única deidad tracia que se ha vuelto popular lejos de su tierra natal, ya que también han surgido cultos en su honor en las tierras de los frigios y lidios. En algunas historias, Sabazios es retratado como el jinete tracio, una figura famosa mucho más allá de las costas de Tracia.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_derzelas:0 "$omen_derzelas$"
 omen_derzelas:1 "Derzelas"
 omen_derzelas_desc:4 "Derzelas es una deidad venerada entre los tracios, quienes creen que es el dios del inframundo, la abundancia y la salud. A menudo se le representa con una cornocupia a su lado, símbolo de su papel como proveedor de las tribus. Sus adoradores celebran juegos en su honor, similares a los juegos más famosos de los griegos.\n\n#! Efecto de apoteosis: $economy_income_effect_tt_description$"
 deity_zibelthiurdos:0 "$omen_zibelthiurdos$"
 omen_zibelthiurdos:1 "Zibelthiurdos"
 omen_zibelthiurdos_desc:4 "Zibelthiurdos es un dios de los cielos, los relámpagos y la lluvia, y muchos griegos lo perciben como el Zeus tracio. A menudo se le representa con rayos a su lado y es una de las principales deidades de las tribus de Tracia.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 deity_bassareus:0 "$omen_bassareus$"
 omen_bassareus:1 "Bassareus"
 omen_bassareus_desc:4 "$dionysus_description$\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_bendis:0 "$omen_bendis$"
 omen_bendis:1 "Bendis"
 omen_bendis_desc:4 "Bendis es una diosa tracia de la caza y la abundancia, generalmente acompañada y retratada con sátiros o ménades. Entre los griegos se la asocia ocasionalmente con su diosa Artemisa, otra deidad cazadora, pero últimamente Bendis se ha convertido en una diosa popular por derecho propio en sus tierras. Hay un festival en su honor llamado Bendideia.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_semele:0 "$omen_semele$"
 omen_semele:1 "Sémele"
 omen_semele_desc:4 "Sémele es una diosa madre venerada en toda Tracia y la madre de Basareus. Algunos dicen que su culto se originó en Frigia, pero desde entonces ha adoptado muchos más elementos griegos y tracios, tierras en las que ahora es popular. Generalmente es adorada junto con su hijo, Basareus entre los tracios o Dioniso entre los griegos, como focos de su propio culto.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
