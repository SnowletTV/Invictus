l_spanish:
 ### Invictus ###
 
 deity_ahura_mazda:0 "$omen_ahura_mazda$"
 omen_ahura_mazda:0 "Ahura Mazda"
 omen_ahura_mazda_desc:0 "Oromasdes, Señor de la Sabiduría, el Espíritu Increado que Crea, que une el cosmos con su voluntad y emana pura bondad por todo el Universo; Hay muchos epítetos para la poderosa deidad Ahura Mazda, la deidad suprema de la religión zoroástrica. Todo lo que es santo y beneficioso proviene de Ahura Mazda, un brillante e inmutable faro de esperanza en un mundo de oscuridad y miseria.\n\n#! Efecto apoteósico: $military_apotheosis_military_experience_effect_tt_description$"
 
 deity_vohu:0 "$omen_vohu$"
 omen_vohu:0 "Vohu"
 omen_vohu_desc:0 "En su sabiduría omnicomprensiva, Ahura Mazda creó a los seis seres inmortales conocidos como 'Amesha Spenta' para que actuaran como ejecutores de su voluntad divina, y Vohu es el principal de estos sirvientes. Porque es Vohu quien encarna el amor divino de Ahura Mazda, llevando las almas de los difuntos a los reinos de bienaventuranza que esperan a los fieles.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 
 deity_vahista:0 "$omen_vahista$"
 omen_vahista:0 "Vahista"
 omen_vahista_desc:0 "Mira fijamente el fuego sagrado, oh mortal, y contempla la naturaleza siempre cambiante de la realidad dentro de sus llamas danzantes. Sepa que es a Vahista a quien Ahura Mazda le ha confiado la defensa de los caminos de la rectitud, y cuando se convoca el Día del Juicio al Fin de los Tiempos para pesar y medir las almas, es Vahishta quien estará presente junto a su Creador, juzgando los hechos y las motivaciones del hombre.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 
 deity_kshatra_vairya:0 "$omen_kshatra_vairya$"
 omen_kshatra_vairya:0 "Kshatra Vairya"
 omen_kshatra_vairya_desc:0 "Guiado por su infinita sabiduría, Ahura Mazda aseguró y asignó los dominios de la tierra a sus creaciones, asignando a Kshatra Vairya poder sobre los metales como manifestación de su poder divino. La personificación de la fuerza y ​​la rectitud, Kshatra Vairya vence a los tontos que buscan practicar el mal.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 
 deity_armaiti:0 "$omen_armaiti$"
 omen_armaiti:0 "Armaiti"
 omen_armaiti_desc:0 "Armaiti, la amada hija del poderoso Ahura Mazda, representa y amplifica muchas de las facetas de la personalidad de su Padre, incluido el dominio del mundo espiritual. Se sabe que los seguidores de Armaiti son gentiles en su bondad amorosa, sabiendo que servir a los demás agrada al Padre Divino y asegura su propia recompensa eterna.\n\n#! Efecto apoteósico: $culture_apotheosis_capital_effect_tt_description$"
 
 deity_spenta_mainyu:0 "$omen_spenta_mainyu$"
 omen_spenta_mainyu:0 "Spenta Mainyu"
 omen_spenta_mainyu_desc:0 "Al darse cuenta de que el odioso espíritu de Angra Mainyu sólo busca la destrucción de todo lo que es bueno y santo, Ahura Mazda ha dado autoridad a Spenta Mainyu, el Más Santo de los Espíritus, para combatir la oscura voluntad del mal y traer luz y bondad a los seguidores de la fe zoroástrica.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 
 deity_haurvatat:0 "$omen_haurvatat$"
 omen_haurvatat:0 "Haurvatat"
 omen_haurvatat_desc:0 "Todo en la creación tiene su opuesto; esto ha sido decretado y ordenado por el glorioso Ahura Mazda en sus infinitas capacidades. Mientras que Vahista es el Portador del Fuego, la femenina Amesha Spenta Haurvatat controla el flujo y reflujo del agua, aprovechando sus poderes curativos para bendecir y proteger a sus devotos de las dolencias físicas de este mundo condenado.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 
 deity_vishtaspa:0 "$omen_vishtaspa$"
 omen_vishtaspa:0 "Vishtaspa"
 omen_vishtaspa_desc:0 "Vishtaspa fue un seguidor anterior de Zoroastro a quien se considera \"su aliado\". Vishtaspa es celebrado como el patrón de Zoroastro y el fundador de la primera comunidad zoroástrica. En la tradición grecorromana, a Vishtaspa se le llama 'Hystaspes' y lo consideraban un sabio de gran antigüedad. También pertenece a la legendaria línea noble de la dinastía Kayanian.\n\n#! Efecto de apoteosis: $culture_apotheosis_capital_effect_tt_description$"
 
 deity_husravah:0 "$omen_husravah$"
 omen_husravah:0 "Kavi Husravá"
 omen_husravah_desc:0 "El legendario rey Kavi Husravah de la dinastía Kayanian, también aparece en la epopeya persa 'Shahnameh'. Su nombre significa literalmente \"el poeta/vidente que tiene buena fama/reputación\". No sólo aparece en Avesta, sino también en textos pahlavi. Incluso parece ser mencionado en los Vedas.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 
 deity_darius:0 "$omen_darius$"
 omen_darius:0 "Darío el grande"
 omen_darius_desc:0 "Shah Darius fue un importante defensor de la religión zoroástrica. Si bien sus predecesores eran más vagos en sus creencias y preferían seguir la línea entre las religiones zoroástricas y persas más antiguas como la mitraica, el Rey de Reyes consideró que su reinado le había sido otorgado directamente por el propio Ahura Mazda. Y con ese derecho divino, su reinado legendario lo dejaría inmortalizado como \"Darío el Grande\", superando a todos los shas persas excepto al propio Ciro."
 
 deity_aphrodite_anaitis:0 "$omen_aphrodite_anaitis$"
 omen_aphrodite_anaitis:0 "Afrodita-Anaitis"
 omen_aphrodite_anaitis_desc:0 "$anahita_description$\n\nEl zoroastrismo durante la época helenística desarrolló muchos sincretismos, entre ellos, Afrodita-Anaitis se erige como un ejemplo brillante. Como resultado de la diosa indoiraní Anahita con la diosa griega Afrodita, Afrodita-Anaitis en realidad es anterior a la invasión helenística de Alejandro Magno y su culto solo se fortaleció aún más después.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 
 deity_mithra_baga:0 "$omen_mithra_baga$"
 omen_mithra_baga:0 "Baga Mitra"
 omen_mithra_baga_desc:0 "Baga Mithra, es una deidad indoiraní popular en muchas religiones, y está asociada con la verdad, la cosecha y desempeña un papel en las ceremonias para el fortalecimiento del agua. \n\nAunque Zoroastro nunca la menciona, la divinidad juega un papel importante en la fe zoroástrica y, por lo tanto, su versión 'Mithra Baga' es específicamente para su versión zoroástrica. No varía mucho de Mitra en la fe mitraica, sin embargo, es notablemente menos central para el zoroastrismo, que se centra en Azura Mazda, relegando a Baga Mithra a un papel secundario.\n\n#! Efecto de apoteosis: $mithra_baga_apotheosis_effect_tt_description$"
