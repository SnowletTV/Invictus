l_spanish:
 ## Generic ##
 deity_verethragna:0 "$omen_verethragna$"
 omen_verethragna:1 "Verethragna"
 omen_verethragna_desc:5 "Nuestro pueblo recitará el Yasht por Verethragna, inspirándolos a unirse a nuestros estandartes de victoria. Con estos cambios recientes, seguramente tendremos una gran cantidad de reclutas que nos ayudarán en nuestras guerras.\n\nVerethragna es una divinidad conocida por su fuerza y ​​por sus batallas contra los daeva de Angra Mainyu. Verdaderamente un gran ejemplo a seguir para nuestra gente, si queremos estar a la altura de las expectativas de Ahuramazda.\n\n#! Efecto apoteósico: $military_apotheosis_military_experience_effect_tt_description$"
 deity_sraosha:0 "$omen_sraosha$"
 omen_sraosha:1 "Sraosha"
 omen_sraosha_desc:5 "Influiremos en nuestro pueblo con la obediencia de Sraosha y recolectaremos su riqueza para el mejoramiento de nuestra nación. Después de reunir todas las riquezas necesarias, las usaremos para emprender grandes obras y garantizar la seguridad de nuestro pueblo, en beneficio de todos.\n\nSraosha es conocida por su obediencia y sus buenas obras, una de las grandes divinidades de nuestra fe. Ha sentado muchos buenos precedentes para que nosotros, los seguidores de Zoroastro, los sigamos.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_zoroaster:0 "$omen_zoroaster$"
 omen_zoroaster:1 "Zoroastro"
 omen_zoroaster_desc:5 "Nuestro pueblo hará realidad las visiones de Zoroastro y difundirá la fe más allá del horizonte. ¿Quién más podría detener a Angra Mainyu y sus daevas?\n\nZoroastro fue el primero que enseñó la verdad sobre el mundo y fue profeta de Vohu Manah. Desde el momento de la revelación, ha difundido la palabra sobre el buen propósito y la verdad de las cosas, así como sobre el libre albedrío. Ha sido fundamental para que nuestra religión llegue al ámbito de influencia persa durante más de un milenio."
 deity_tishtrya:0 "$omen_tishtrya$"
 omen_tishtrya:1 "Tishtrya"
 omen_tishtrya_desc:5 "Llamaremos a Tishtrya para que bendiga a nuestro pueblo con su lluvia que trae vida, asegurando cosechas y crecimiento durante mucho tiempo. Con nuestras cosechas aseguradas, nuestro pueblo florecerá y se expandirá, seguro bajo la mano protectora de la divinidad.\n\nTishtrya es una de las muchas divinidades benévolas que luchan contra las fuerzas de Angra Mainyu. Es conocido por compartir lluvias y bendiciones fértiles con las personas y regiones bajo su protección. Está involucrado en una lucha contra el demonio Apaosha.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_ameretat:0 "$omen_haurvatat$"
 omen_ameretat:0 "Ameretat"
 omen_ameretat_desc:1 "Invocamos a Ameretat, el Yazata de la inmortalidad. Junto con su aliado Haurvatat, le dará a nuestro pueblo la resistencia y la fuerza que necesita para prosperar.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_asha:0 "$omen_asha$"
 omen_asha:0 "Asha"
 omen_asha_desc:2 "Invocamos a Asha, a la verdad y al fuego para detectar la verdad y la justicia.\n\n#! Efecto Apoteosis: $economy_income_effect_tt_description$"
 deity_anahita:0 "$omen_omen_anahita$"
 omen_anahita:0 "Anahita"
 omen_anahita_desc:1 "Anahita, uno de los Yazatas más poderosos, está asociado con la curación, la fertilidad y la sabiduría. Ha sido adorada durante mucho tiempo en todo el antiguo Imperio persa de los aqueménidas. Hacemos un llamado a Anahita para que proteja a nuestros jóvenes y supervise los ríos sagrados de nuestra nación.\n\n#! Efecto apoteósico: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_atar:0 "$omen_atar$"
 omen_atar:0 "Atar"
 omen_atar_desc:0 "El jefe de los Yazatas Atar es el dios del fuego. La justicia se administra a través del calor de Atar, el ardiente, que es capaz de detectar la culpa y purificar al hombre. El culto a Atar es anterior al propio zoroastrismo con la prueba del fuego.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_saoshyant:0 "$omen_saoshyant$"
 omen_saoshyant:0 "Profecía de la Saoshyant"
 omen_saoshyant_desc:2 "Las profecías de Zoroastro revelan que Aquel que trae beneficios está destinado a guiar a los fieles en la renovación final del mundo, donde el mal será destruido y el mundo será traído a la unidad eterna con lo divino.\n\nCuando se acerquen los días finales, las doncellas justas entrarán al Oasis en Aris y darán a luz a los salvadores de la humanidad."

 ### Hellenistic Omens ###
 deity_mithra:0 "$omen_mithra$"
 omen_mithra:0 "Mithra"
 omen_mithra_desc:2 "Mitra es una divinidad zoroástrica abrazada por ciertos elementos de la sociedad helenística, y se le asocia con la verdad, la cosecha y desempeña un papel en las ceremonias para el fortalecimiento del agua. \n\nAl extenderse mucho más allá de su tierra natal persa, el culto a Mitra específicamente ha sido adoptado por aquellos fuera de la fe. Aunque Zoroastro nunca la menciona, la divinidad juega un papel importante en la fe zoroástrica.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$\n $add_legitimacy_apotheosis_effect_tt_description$"
