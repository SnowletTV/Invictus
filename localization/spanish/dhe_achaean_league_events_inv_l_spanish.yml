l_spanish:
 ### DHE Achaean League
 # Events

 dhe_achaean_league.1.t:0 "Invitaciones a la Liga Aquea"
 dhe_achaean_league.1.desc:0 "Flavor text."
 dhe_achaean_league.1.a:0 "¡Enviad a los emisarios! Informad a los nuevos miembros para que abran sus tesorerías."
 dhe_achaean_league.1.at:0 "Todas las naciones de #Y Acaya#! y la vecina #Y Arcadia#! serán invitadas a unirse a nuestra liga; Pueden proporcionar oro para financiar nuestro cofre de guerra."
 dhe_achaean_league.1.b:0 "¡Enviad a los emisarios! Informad a los nuevos miembros para que envíen guerreros para engrosar nuestras filas."
 dhe_achaean_league.1.bt:0 "Todas las naciones de #Y Acaya#! y la vecina #Y Arcadia#! serán invitadas a unirse a nuestra liga; Pueden proporcionar mano de obra para defender nuestros intereses."

 dhe_achaean_league.2.t:0 "Invitaciones a la Liga Aquea"
 dhe_achaean_league.2.desc:0 "Flavor text."
 dhe_achaean_league.2.a:0 "Durante demasiado tiempo, el legado de Filipo y Alejandro se ha cernido sobre nosotros. ¡Unamos a todos los Griegos para oponernos a los Diádocos!"
 dhe_achaean_league.2.at:0 ""
 dhe_achaean_league.2.b:0 "La liga nunca representará a nuestros intereses. Mantendremos nuestra independencia."
 dhe_achaean_league.2.bt:0 "No se producirán cambios importantes."
 dhe_achaean_league.2.c:0 "¡La liga es una misión absurda! ¡Sólo con el patronazgo de un generoso protector como Ptolomeo podremos esperar sobrevivir a la opresión Macedonia!"
 dhe_achaean_league.2.ct:0 "Buscamos protección de los egipcios en el sur."
 dhe_achaean_league.2.d:0 "¿Una liga aquea? ¡Qué idea tan maravillosa!"
 dhe_achaean_league.2.dt:0 "#G Anexaremos todas las tierras que actualmente pertenecen a #E Achea#! y heredaremos todos los #E súbditos#! de Achea#!"

 dhe_achaean_league.3.t:0 "Asuntos de la Liga Aquea"
 dhe_achaean_league.3.desc:0 "Después de una cuidadosa deliberación, las ciudades de Acaya y Arcadia han respondido a nuestra invitación. Muchos han elegido voluntariamente unirse a nuestra Liga, reconociendo la fuerza de la unidad frente a las amenazas extranjeras. Los delegados de estas ciudades han llegado a [ROOT.GetCountry.GetCapital.GetName], ansiosos por formalizar su membresía en la #E Liga Aquea#! y discutir el futuro de nuestra defensa compartida. Su contribución garantiza que defenderemos mejor las guarniciones de nuestras ciudades contra nuestros enemigos compartidos en tiempos difíciles."
 dhe_achaean_league.3.a:0 "Esta recompensa garantizará que podamos pagar ampliamente a nuestros soldados y mercenarios en tiempos de penuria."
 dhe_achaean_league.3.tt:0 "#E Achea#! gana una serie de sujetos que buscan liderazgo en nosotros"

 dhe_achaean_league.4.t:0 "[aratus_scope.GetName] de [GetProvince('(int32)8003').GetName]"
 dhe_achaean_league.4.desc:0 "Cuando su marido, [GetCharacter('(int32)522').GetName], fue asesinado, [GetCharacter('(int32)523').GetName] asumió el mando de sus fuerzas, entre quienes su amabilidad la había hecho extremadamente popular. Cuando los sicionios, esperando una conquista fácil sobre una mujer, atacaron la guarnición para intentar establecer un gobierno independiente, ella sofocó la sedición y crucificó a treinta de los rebeldes. [GetCharacter('(int32)523').GetPraenomen] gobernaría [GetProvince('(int32)8003').GetName] y [GetProvince('(int32)418').GetName] durante seis años hasta que entregó las ciudades a Ptolomeo. A partir de entonces, [GetProvince('(int32)8003').GetName] lucharía por liberarse de los tiranos.\n\n[aratus_scope.GetName] de [GetProvince('(int32)8003').GetName], un renombrado estadista y general, ha incorporado su ciudad a la Liga Aquea. Conocido por su astuta diplomacia y perspicacia militar, [aratus_scope.GetPraenomen] ha liberado a [GetProvince('(int32)8003').GetName] de la tiranía y es aclamado como un defensor de la libertad griega. Con un líder tan distinguido ahora entre nuestras filas. Muchos en [ROOT.GetCountry.GetCapital.GetName] piden que se convierta en el #E Strategos#! de la #E Liga Aquea#!."
 dhe_achaean_league.4.a:0 "[aratus_scope.GetName] nació para gobernar."
 dhe_achaean_league.4.b:0 "Un estrategos debería tener más experiencia."
 dhe_achaean_league.4.bt:0 "No pasa nada"

 dhe_achaean_league.5.t:0 "[former_subject.GetName] Se une a la Liga Aquea"
 dhe_achaean_league.5.desc:0 "[former_subject.GetName], anteriormente bajo nuestra protección, ha elegido unirse a la #E Liga Aquea#!. Han roto sus vínculos con nosotros y se han comprometido con esta nueva alianza, buscando seguridad en la unidad con sus compañeros del Peloponeso."
 dhe_achaean_league.5.a:0 "Muy desafortunado."
 dhe_achaean_league.5.b:0 "¡[former_subject.GetName] debe estar libre de demagogia!"
 dhe_achaean_league.5.tt:0 "#R [former_subject.GetName] ya no es nuestro tema#!"

 dhe_achaean_league.6.t:0 "Captura de Corinto"
 dhe_achaean_league.6.desc:0 "[GetProvince('(int32)418').GetName] solía ser una de las ciudades-estado más grandes de Grecia, situada en la frontera entre el Ática y el Peloponeso. Cuando las otras ciudades-estado formaron ligas y alianzas para luchar entre sí, Corinto se mantuvo obstinadamente en su independencia. Durante las guerras de los Diadochi, la antigua ciudad-estado se convirtió en poco más que una fortificación glorificada para las tropas macedonias, convirtiéndose en la posición defensiva más estratégica de la región.\n\nNuestra lucha con los descendientes de [GetCharacter('(int32)9').GetPraenomen]' por el control de Grecia continúa, pero [aratus_scope.GetName] finalmente ha expulsado a la guarnición macedonia de la ciudad de [GetProvince('(int32)418').GetName] y nuestras tropas ahora marchan por sus calles."
 dhe_achaean_league.6.a:0 "¡El Agrocorinto enarbolará el estandarte aqueo!"

### EVENT: The Achaean League in Abeyance  ###

 dhe_achaean_league.7.t:0 "Liga Aquea en suspenso"
 dhe_achaean_league.7.desc:0 "Son días de profunda incertidumbre. Desde la muerte de Alejandro, los reyes macedonios y los hombres fuertes locales han asfixiado al Peloponeso con guarniciones y tiranías. Incluso nuestra propia Keryneia y Bura están ahora en manos de demagogos. Los consejos de la liga ya no alcanzan el quórum y, por lo tanto, sus decretos no pueden ser ratificados.\n\n Algunos argumentan que el koinon debería dejarse en suspenso por un tiempo. Dicen que es más prudente preservar lo que queda de unidad que permitir que títeres extranjeros corrompan nuestra liga. Otros insisten en que la koinon debe perdurar, cueste lo que cueste. Si suspendemos nuestras instituciones, cada ciudad libre debe valerse por sí misma hasta que llegue una hora mejor."
 dhe_achaean_league.7.tt:0 "La decisión de #E Restaurar la #Y Liga Aquea#!#! estará disponible en #G #E 10 años#!#!"
 dhe_achaean_league.7.a:0 "Deja que Aigion tome su propio rumbo."
 dhe_achaean_league.7.b:0 "Patrae parece prometedora."
 dhe_achaean_league.7.c:0 "Dyme servirá."
 dhe_achaean_league.7.d:0 "Hay fuerza en Sición"
 dhe_achaean_league.7.e:0 "¡El trono de Pelene es mío!"
 dhe_achaean_league.7.f:0 "Juntos capearemos la tormenta."
 dhe_achaean_league.7.AIG.TT:0 "¡#Y #E Aigion#!#! se convierte en un #T Feudatorio#! de #E @[AIG_overlord.GetFlag]!  [AIG_overlord.GetAdjective]#!"
 dhe_achaean_league.7.PTA.TT:0 "#Y #E Patrae#!#! se convierte en #T Independiente#!"
 dhe_achaean_league.7.DYM.TT:0 "#Y #E Dyme#!#! se convierte en #T Independiente#!"
 dhe_achaean_league.7.SIC.TT:0 "#Y #E Sicyon#!#! se convierte en #T Independiente#!"
 dhe_achaean_league.7.PLE.TT:0 "#Y #E Pellene#!#! se convierte en #T Independiente#!"

 # Modifiers
 resisting_diadochi_modifier:0 "Resistir a los sucesores"
 desc_resisting_diadochi_modifier:0 "Derrocar a los señores macedonios y expulsar sus guarniciones es un poderoso grito de guerra para los griegos."
 beleaguered_achaea:0 "Acaya asediada"

 joined_achaean_league:0 "Liga Aquea"


### EVENT: The Arcadian League in Abeyance  ###

 flavor_arcadia.1.t:0 "Liga Arcadia en suspenso"
 flavor_arcadia.1.desc:0 "Son días de profunda incertidumbre. Desde la muerte de Alejandro, los reyes macedonios y los hombres fuertes locales han asfixiado al Peloponeso con guarniciones y tiranías. Incluso nuestro propio Orcómenos está ahora en manos de Strombichos. Los consejos de la liga ya no alcanzan el quórum y, por lo tanto, sus decretos no pueden ser ratificados.\n\n Algunos argumentan que el koinon debería dejarse en suspenso por un tiempo. Dicen que es más prudente preservar lo que queda de unidad que permitir que títeres extranjeros corrompan nuestra liga. Otros insisten en que la koinon debe perdurar, cueste lo que cueste. Si suspendemos nuestras instituciones, cada ciudad libre debe valerse por sí misma hasta que llegue una hora mejor."
 flavor_arcadia.1.tt:0 "La decisión de #E Restaurar la #Y Liga Arcadia#!#! estará disponible en #G #E 10 años#!#!"
 flavor_arcadia.1.a:0 "Dejemos que Mantineia siga su propio rumbo."
 flavor_arcadia.1.b:0 "Azania parece prometedora."
 flavor_arcadia.1.c:0 "Heraia servirá."
 flavor_arcadia.1.d:0 "En Trifilia triunfaremos."
 flavor_arcadia.1.e:0 "Stymphalos será nuestro santuario."
 flavor_arcadia.1.f:0 "Juntos capearemos la tormenta."
 flavor_arcadia.1.g:0 "Sólo Megalópolis tiene la fuerza para protegernos."
 flavor_arcadia.1.MTE.TT:0 "#Y #E Mantineia#!#! se convierte en #T Independiente#!"
 flavor_arcadia.1.AZA.TT:0 "#Y #E Azania#!#! se convierte en #T Independiente#!"
 flavor_arcadia.1.HRA.TT:0 "#Y #E Heraia#!#! se convierte en #T Independiente#!"
 flavor_arcadia.1.TPA.TT:0 "#Y #E Triphylia#!#! se convierte en #T Independiente#!"
 flavor_arcadia.1.STP.TT:0 "#Y #E Stymphalos#!#! se convierte en #T Independiente#!"

