 flavor_sel.1.t:0 "Las satrapías orientales"
 flavor_sel.1.desc:0 "Hace décadas, [GetCharacter('(int32)39').GetPraenomen] invadió la India y extendió su imperio hasta el #E Indo#!, pero las numerosas guerras entre los reyes sucesores han dejado a estas satrapías orientales aisladas y débiles.\n\nEn el último año, [GetCharacter('(int32)22').GetName] ha unido el norte de la India, aplastando el #E Imperio Nanda#!, mientras arrasaba el territorio griego. Sátrapas en el valle del Indo.\n\nSe ha sugerido que deberíamos reducir nuestras pérdidas y entregar las últimas satrapías orientales a los #E Mauryas#!, o este conflicto podría prolongarse durante años. Una tregua también nos daría el tiempo que necesitamos para consolidar nuestro propio imperio y derrotar a los demás sucesores."
 flavor_sel.1.a:0 "Vamos a negociar con los mauryanos."
 flavor_sel.1.b:0 "¡No les ofreceremos eso!"
 seleucid_maurya_start.1.a.tt:0 "Si los mauryanos aceptan, sucederá lo siguiente:\n"
 seleucid_maurya_start.1.b.tt:2 "#R La guerra con los mauryanos (@[GetCountry('MRY').GetFlag]!) probablemente se reanudará de inmediato.#!\nSi la guerra continúa, ocurrirá lo siguiente: $seleucid_maurya_start.5.b.tt$"
 seleucid_maurya_war_deets_tt:0 "#R Si se reanuda la guerra con los Mauryas (@[GetCountry('MRY').GetFlag]!), anexaremos partes de Gandhara (@[GetCountry('GHA').GetFlag]!) y Arachosia (@[GetCountry('ARS').GetFlag]!)."
 seleucid_maurya_start.5.b.tt:0 "#Y Maurya#! recibirá:\n"
 seleucid_land_transfer_tooltip:1 "Las Provincias de #R Bamyan#!, #R Sattagydia#!, #R Arachosia#!, #R Gedrosia#! y #R Parecania#!, serán transferidas a los Mauryas (@[GetCountry('MRY').GetFlag]!)."
 seleucid_land_transfer_mauryan_tooltip:0 "Las Provincias de #G Bamyan#!, #G Sattagydia#!, #G Arachosia#!, #G Gedrosia#! y #G Parecania#!, serán transferidas a los Mauryas (@[THIS.GetCountry.GetFlag]!)."

 flavor_sel.2.t:0 "¿El fin de la amenaza griega?"
 flavor_sel.2.desc:0 "Hace décadas, [GetCharacter('(int32)39').GetName] invadió nuestro subcontinente y derrotó a los gobernantes locales del valle del Indo. Sin embargo, muchas cosas han cambiado desde entonces. La muerte del gran conquistador ha visto su imperio dividido entre sucesores en disputa y el meteórico ascenso de Chandragupta Maurya ha transformado el norte de la India.\nEn el último año, los ejércitos Maurya se han apoderado del valle del Indo y están avanzando hacia las posiciones del rey sucesor Seleukos.\nUn emisario de Seleukos ahora ofrece renunciar a esta región, a cambio de un tratado de amistad con nuestro imperio."
 flavor_sel.2.a:0 "Aceptemos esta oferta."
 flavor_sel.2.b:0 "¡No, Persia será nuestra!"
 flavor_sel.3.t:0 "La amenaza griega"

 flavor_sel.3.desc:0 "Hace décadas, [GetCharacter('(int32)39').GetName] invadió nuestro subcontinente y derrotó a los gobernantes locales del valle del Indo. Sin embargo, muchas cosas han cambiado desde entonces. La muerte del gran conquistador ha visto su imperio dividido entre sucesores en disputa y el meteórico ascenso de Chandragupta Maurya ha transformado el norte de la India.\nEl año pasado, los ejércitos maurianos se apoderaron del valle del Indo y están avanzando hacia las posiciones del rey sucesor Seleukos.\nUn emisario de Seleukos nos ofrece ahora una tregua. Dándonos tiempo para consolidar nuestros logros y tal vez dirigir nuestra atención a otra parte."
 flavor_sel.3.a:0 "¡Debemos seguir adelante!"
 flavor_sel.3.b:0 "Intentemos hacer las paces y esperar un mejor momento."
 seleucid_maurya_start.3.b.tt:0 "Si los seléucidas aceptan, sucederá lo siguiente:\n"

 flavor_sel.4.t:0 "Paz en nuestros días"
 flavor_sel.4.desc:0 "Los mauryanos aceptaron nuestra oferta. Como muestra de gratitud, nos enviaron una gran cantidad de elefantes de guerra para que los usemos en la batalla contra otros estados sucesores de Macedonia."
 flavor_sel.4.a:0 "¡Fantástico!"

 flavor_sel.401.t:0 "Anexión de Gandhara"
 flavor_sel.401.desc:0 "Con la nueva paz establecida entre los seléucidas y nosotros, podremos decidir cómo repartir la tierra en la región de Gandhara. Si bien podemos mantener el mismo vasallo que nos fue transferido, también podemos optar por gobernar directamente las partes importantes de la tierra y dejar el resto a la tribu de la montaña, aunque esto molestaría mucho a los lugareños."
 flavor_sel_401.a:0 "¿A quién le importa? Es nuestra tierra ahora."
 flavor_sel_401.b:0 "Es mejor mantenerlos como nuestros vasallos."

 flavor_sel.5.t:0 "Una tregua inestable"
 flavor_sel.5.desc:0 "Los mauryanos aceptaron una tregua. Así, nuestro estado y el de ellos tendrán un oportuno respiro. Es hora de reconstruir y consolidar nuestro joven imperio.\nAunque esto significaría darle la espalda a la ciudades griegas del valle del Indo, por ahora probablemente sea la acción más prudente."
 flavor_sel.5.a:0 "¡Hora de encargarse de Antígono!"
 flavor_sel.5.b:0 "¡Al Indo!"

 flavor_sel.6.t:0 "¡Guerra!"
 flavor_sel.6.desc:0 "En lugar de enviarnos una respuesta formal, los mauryanos nos mandaron la cabeza de nuestro mensajero.\nNuestras guarniciones en las fronteras avistaron tropas exploradoras de los mauryanos. Ahora la guerra es inevitable."
 flavor_sel.6.a:0 "Hora de morir."
 flavor_sel.6.b:0 "Anexar una ruta terrestre por nuestros sujetos."

 flavor_sel.7.t:0 "¡Guerra!"
 flavor_sel.7.desc:1 "Los seléucidas rechazaron nuestra generosa oferta de tregua. Sus ejércitos están avanzando hacia nosotros.\nEl apoyo a los seléucidas también está en aumento en los territorios griegos a lo largo del Indo."

 flavor_sel.10.t:0 "La desolación de Gedrosia"
 flavor_sel.10.desc:0 "Gedrosia, la tierra que robó un tercio del ejército de Alejandro mientras marchaba de regreso a casa, hacia su muerte, es una roca casi árida poblada por montañas y desiertos, un marcado contraste con el gran Mar Eritreo que se encuentra debajo de ella, que navegó Nearchus mientras igualaba a Alejandro en su fatídico viaje. Aunque es una tierra muerta, allí viven unas pocas almas: los comedores de pescado, como se les conoce, los ictífagos. Deben ser un pueblo maldito para vivir sus vidas en un lugar tan duro e implacable. Estos Ichthyophagoi de extrañas costumbres no ofrecen ningún tributo que valga la pena, y la desolación de la tierra sólo sirve para cobrar las vidas de aquellos que se atreven a pisarla. Los asesores de [gedrosia_old_overlord.GetRuler.GetPraenomen] sugieren que puede que haya llegado el momento de dejar que el desierto reclame lo que es suyo, de abandonar Gedrosia a su naturaleza salvaje y de redirigir nuestros esfuerzos hacia tierras más prósperas. Si nos retiramos, lo haremos con cuidado y lentamente para asegurarnos de que nuestros enemigos no tomen la tierra y que las tribus locales sigan siendo amigas de [gedrosia_old_overlord.GetName]."
 flavor_sel.10.a:0 "Retírate y deja que el desierto se apodere de Gedrosia."
 flavor_sel.10.at:0 "#E #Y Gedrosia#!#! se lanzará como [gedrosia_old_overlord.GetAdjective] #E Vasallo de prueba#! dentro de dos años."
 flavor_sel.10.b:0 "No cederemos ni un granito de arena."
 flavor_sel.10.b.effect: "Aumenta los disturbios y los costos de mantenimiento en Gedrosia, pero gana una pequeña bonificación de prestigio."
 flavor_sel.11.t:0 "Gedrosia abandonada"
 flavor_sel.11.desc:0 "El desierto de Gedrosia ha quedado abandonado a su suerte. Las últimas fuerzas [gedrosia_old_overlord.GetAdjective] han abandonado la región. En verdad, las tribus Ichthyophagoi ahora no responden ante nadie, pero nominalmente reconocen a [gedrosia_old_overlord.GetAdjective] como su señor supremo. Las arenas movedizas de este desierto permanecen indómitas..."
 flavor_sel.11.a:0 "Por fin estamos libres de esta carga."
 flavor_sel.11.b:0 "Me pregunto qué le deparará el futuro a [gedrosia_tribal.GetName]..."
 flavor_sel.11.bt:0 "#R ¡Etiquetaremos el cambio a @[gedrosia_tribal.GetFlag]!  #Y [gedrosia_tribal.GetName]#!#!"


#Seleukid Syria
 SELEUKID_SYRIA:0 "Siria seléucida"
 form_seleukid_syria:0 "Un reino sirio"
 form_seleukid_syria_desc:0 "El corazón de Babilonia, la antigua Satrapía de Seleuco, se ha perdido para nosotros, al menos en el futuro previsible. Gracias a su posición estratégica que abarca el este y el oeste, sus defensas naturales y su amplio acceso al mar, Siria podría convertirse en un trampolín útil para futuras incursiones contra los demás sucesores, proporcionando un camino para que eventualmente recuperemos lo que nos fue robado. Quizás deberíamos consolidar nuestras posesiones restantes e instalarnos como los reyes de Siria."
 form_seleukid_syria_tooltip:0 "Nos declararemos Reyes de Siria."
 syriote_nobles_tooltip:0 "La familia real y todos los personajes de la cultura principal adoptarán la #Y cultura siríaca#!"
 syriote_converts_tooltip:0 "Algunas poblaciones de nuestra cultura principal y todas las poblaciones que siguen la fe helénica adoptarán la #Y cultura siríaca#!"
 form_seleukid_syria_claims_tooltip:0 "#E El Reino Sirio#! ganará Reclamaciones sobre las Regiones de #Y Cilicia#!, #Y Siria#!, #Y Asiria#! y #Y Canaán#!."
 formable_not_syria_exists:0 "#Y Siria#! debe NO existir."
 seleukid_syria_capital_region:0 "La #E Capital#! de #E [THIS.GetCountry.GetName]#! debe estar ubicada en la región de #Y Siria#!, #Y Mespotamia#! o #Y Canaán#!."
 create_characene_tooltip:0 "#E #Y Characene#!#! será liberado como [THIS.GetCountry.GetAdjective] #E Satrapía#! y heredará todas las [THIS.GetCountry.GetAdjective] tierras en las Áreas de #Y Characene#!, #Y Sumer#!, #Y Caldea#!, #Y Sittacene#!, #Y Babilonia#! y #Y Qara'ah#!"
 create_elymais_tooltip:0 "#E #Y Elymais#!#! será liberada como [THIS.GetCountry.GetAdjective] #E Satrapía#! y heredará todas las [THIS.GetCountry.GetAdjective] tierras en las Áreas de #Y Susiana#! y #Y Mardiene#!"
 seleucid_syria_babylon_control_tooltip:0 "Menos de 50 provincias en las Áreas de #Y Susiana#!, #Y Mardiene#!, #Y Characene#!, #Y Sumer#!, #Y Chaldea#! y #Y Qara'ah#! están controlados por #E [THIS.GetCountry.GetName]#! (Actual: [SCOPE.ScriptValue('seleucid_syria_babylon_control_current')|0Y]/#Y 50#!)."
 seleucid_syria_eastern_control_tooltip:0 "Menos de 75 provincias en las regiones de #Y Ariana#!, #Y Partia#! y #Y Media#! están controladas por #E [THIS.GetCountry.GetName]#! (Actual: [SCOPE.ScriptValue('seleucid_syria_eastern_control_current')|0Y]/#Y 75#!)"


