 diadochi_flavor.70.t:0 "¿Una boda real?"
 diadochi_flavor.70.desc:0 "¡Con el colapso del @[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetName] el equilibrio de poder entre los Diadochi ha vuelto a cambiar. Si bien obtuvimos gran parte de las antiguas posesiones de Antigonid, [GetCharacter('(int32)24').GetPraenomen], uno de nuestros principales aliados parece estar preparado para intentar reunificar por la fuerza el imperio de [GetCharacter('(int32)39').GetPraenomen]. Ha llegado el momento de actuar. Actualmente, @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName] no es una amenaza para nosotros, por lo que sería prudente llamarlos amigos, por ahora. Quizás con la ayuda de [GetCountry('TRE').GetRuler.GetName], podamos expulsar al 'Amo de los Elefantes' de [GetProvince('(int32)743').GetArea.GetRegion.GetName|E] y [GetProvince('(int32)1887').GetArea.GetRegion.GetName|E] y dividir las regiones entre nuestros reinos aliados.\n\nPara cimentar este vínculo, se ha sugerido que ofrezcamos nuestra amistad en forma de una alianza matrimonial entre [arsinoe_ii_scope.GetName] y [GetCountry('TRE').GetRuler.GetPraenomen]."
 diadochi_flavor.70.a:0 "¡Qué idea tan maravillosa!"
 diadochi_flavor.70.at:0 "¡Propondremos un matrimonio entre [arsinoe_ii_scope.GetName] y [GetCountry('TRE').GetRuler.GetName], y con ello una alianza entre @[arsinoe_ii_scope.GetEmployer.GetFlag]! [arsinoe_ii_scope.GetEmployer.GetName|Y] y @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName|Y]"
 diadochi_flavor.70.b:0 "No necesitamos su ayuda ni su amistad."
#opinion malus
 scorned_marriage_alliance_offer:0 "Alianza de matrimonio rechazado"
 agreed_marriage_alliance_offer:0 "Atado por la sangre"
 diadochi_flavor.71.t:0 "¿Una boda real?"
 diadochi_flavor.71.desc:0 "¡Con el colapso del @[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetName] el equilibrio de poder entre los Diadochi ha vuelto a cambiar. Si bien obtuvimos gran parte de las antiguas posesiones de Antigonid, [GetCountry('SEL').GetRuler.GetName] parece estar preparado para intentar reunificar por la fuerza el imperio de [GetCharacter('(int32)39').GetPraenomen]. Ha llegado el momento de actuar. Actualmente, @[GetCountry('EGY').GetFlag]! [GetCountry('EGY').GetName] no es una amenaza para nosotros, por lo que sería prudente llamarlos amigos, por ahora. Con la ayuda de [GetCountry('EGY').GetRuler.GetName], podemos expulsar al 'Amo de los Elefantes' de [GetProvince('(int32)743').GetArea.GetRegion.GetName|E] y [GetProvince('(int32)1887').GetArea.GetRegion.GetName|E] para que las regiones puedan dividirse entre nuestros reinos aliados.\n\nParece que las grandes mentes piensan igual porque [GetCountry('EGY').GetRuler.GetPraenomen] ha enviado embajadores a [GetCountry('TRE').GetCapital.GetName] ofreciendo una alianza matrimonial entre [arsinoe_ii_scope.GetName] y [GetCountry('TRE').GetRuler.GetPraenomen]."
 diadochi_flavor.71.a:0 "Muy bien. ¡Juntos lo celebraremos!"
 diadochi_flavor.71.at:0 "¡Acordaremos un matrimonio entre [arsinoe_ii_scope.GetName] y [GetCountry('TRE').GetRuler.GetName] en un futuro próximo, y con ello una alianza entre @[arsinoe_ii_scope.GetEmployer.GetFlag]! [arsinoe_ii_scope.GetEmployer.GetName|Y] y @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName|Y]"
 diadochi_flavor.71.b:0 "No necesitamos su ayuda ni su amistad."

 arsionoe.desc_0:0 "Después de largos meses de deliberación, el matrimonio de [GetCountry('TRE').GetRuler.GetPraenomen] y [arsinoe_ii_scope.GetPraenomen] finalmente salió adelante.\n\n¡A su llegada a @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName|E], el carro de [arsinoe_ii_scope.GetPraenomen] fue escoltado en una opulenta procesión a través de [GetCountry('TRE').GetRuler.GetEmployer.GetCapital.GetName] hasta el palacio real, donde mordió la manzana ceremonial presentada por [GetCountry('TRE').GetRuler.GetPraenomen].\n\nLuego se casaron en una fastuosa ceremonia a la que asistieron cientos de invitados y una lluvia de regalos, seguida de un banquete real con banquetes y juergas hasta bien entrada la noche..."

