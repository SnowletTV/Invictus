 diadochi_liberation.2.ct:0 "#Y $CHALKIS_NAME$#! será liberado como un sujeto #Y Tributario#!."
 diadochi_liberation.2.c.t2:0 "Cada #Y $hellenic$#! país continental [GetProvince('(int32)418').GetArea.GetRegion.GetName] obtendrá #G 15#! opinión sobre nosotros."
