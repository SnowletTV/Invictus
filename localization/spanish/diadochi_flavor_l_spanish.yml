 colonize_dioskourides:0 "La isla de la dicha"
 colonize_dioskourides_desc:0 "El contacto con las Islas Benditas se ha perdido desde que los bárbaros se apoderaron de Patala, el puerto que Alejandro construyó en la desembocadura del Mar Rojo, fundado para unir el este y el oeste. Se rumorea incluso que Alejandro tenía la intención de establecer a los griegos en Dioskoridos antes de que su prematura desaparición detuviera tan grandiosas visiones de unificar el mundo. Rodeada de monzones azotadores y aguas caóticas, la Isla de los Dioscuros es una tierra extraña y ajena a cualquier otra. Posee varias especies endémicas, como el árbol de sangre de dragón, cuya preciada savia fue buscada en todos los continentes por sus propiedades medicinales. La Isla Bendita podría facilitar el comercio transeritreo entre los pueblos indoi y mediterráneo. Además de su mirra, incienso, savia de árboles y aloe, la isla también es famosa por sus caparazones de tortuga, ya que incluso los vientres de las tortugas eran lo suficientemente gruesos como para hacer mesas con ellos. Aunque remoto y escasamente poblado, Dioskoridos es un lugar inmensamente prometedor y podría convertirse en un eje de las grandes rutas comerciales de Eritrea. Al establecer el control sobre esta tierra olvidada, podemos trabajar para hacer realidad lo que el propio Alejandro había soñado: la creación de un mundo único e interconectado donde no haya costas más allá de la luz de la civilización helénica."
 colonize_dioskourides_requirement_tt:0 "Tener una flota de al menos #G 20#! barcos por #Y Soqotra#! en el #T Mare Erythraeum#!"
 colonize_dioskourides_reward_tt:0 "Intentaremos comprar la isla de #Y [GetProvince('(int32)7530').GetName]#!."
 DIOSKOURIDES_NAME:0 "dioscóridos"
 DIOSKOURIDES_ADJ:0 "Dioskoridiano"

#Modifiers
kyinda_modifier:0 "Oro de Kyinda"
desc_kyinda_modifier:0 "Desde la época de los asirios, Kyindia, entonces conocida como Kundi, actuó como tesoro imperial. El gazophylakion (tesoro real) macedonio, que sirvió como importante centro de recolección durante la era de Alejandro Magno, contenía una gran riqueza reunida en el interior de Asia para enviarla a Macedonia. A pesar de ser saqueado periódicamente, el contenido del tesoro, \"el oro de Kyinda\", siguió siendo famoso durante todo el período helenístico."

