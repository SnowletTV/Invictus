 diadochi_liberation.2002.t:0 "[flipping_subject.GetName] Bajo [subject_flipper.GetAdjective] Ocupación"
 diadochi_liberation.2002.desc:0 "[flipping_subject.GetName] resistió todo lo que pudo, pero [subject_flipper.GetName] ha tomado [flipping_subject.GetCapital.GetName]. Ahora hay división entre la élite [flipping_subject.GetAdjective], algunos han declarado su apoyo a la causa [subject_flipper.GetAdjective], mientras que otros esperan que [current_overlord.GetName] alivie la ocupación [subject_flipper.GetAdjective] antes de que sea demasiado tarde."
 diadochi_liberation.2002.a:0 "Debemos actuar rápidamente para evitar la deserción."
 diadochi_liberation.2002.at:0 "[flipping_subject.GetName] #R desertará#! a los [subject_flipper.GetAdjective] si no recuperamos el control de [flipping_subject.GetCapital.GetName] o de cualquier provincia vecina [flipping_subject.GetAdjective] en los próximos meses."

 diadochi_liberation.2003.t:0 "El destino de [flipping_subject.GetName]"
 diadochi_liberation.2003.desc:0 "Los leales a [current_overlord.GetName] han resistido tanto como han podido, pero no ha llegado ningún alivio. Con [subject_flipper.GetName] en control de [flipping_subject.GetCapital.GetName], algunos ahora argumentan que continuar la resistencia es inútil. Quizás haya llegado el momento de apoyar la causa [subject_flipper.GetAdjective]."
 diadochi_liberation.2003.a:0 "¡Salve [subject_flipper.GetRulerTitle] [subject_flipper.GetRulerTitle.GetName]!"
 diadochi_liberation.2003.at:0 "Nos uniremos #G a #! todas las guerras actuales de [subject_flipper.GetName]."
 diadochi_liberation.2003.b:0 "Aguantaremos un poco más."

 diadochi_liberation.2004.t:0 "[flipping_subject.GetName] Únase a nosotros"
 diadochi_liberation.2004.desc:0 "Sin ayuda de [current_overlord.GetName], los leales a [current_overlord.GetAdjective] se han visto obligados a capitular. Después de resistir durante meses, [flipping_subject.GetName] ha declarado a favor de [subject_flipper.GetName]."
 diadochi_liberation.2004.a:0 "Han tomado la decisión correcta."

 diadochi_liberation.2005.t:0 "[flipping_subject.GetName] Defectos"
 diadochi_liberation.2005.desc:0 "Sin ayuda de [current_overlord.GetName], los leales a [current_overlord.GetAdjective] se han visto obligados a capitular. Después de resistir durante meses, [flipping_subject.GetName] ha declarado a favor de [subject_flipper.GetName]."
 diadochi_liberation.2005.a:0 "Malditos sean esos traidores."

#NEw
 diadochi_liberation.2006.t:0 "[flipping_subject.GetName] cae bajo [subject_flipper.GetAdjective] ocupación"
 diadochi_liberation.2006.desc:0 "Resistimos todo el tiempo que pudimos, pero las calles de [flipping_subject.GetCapital.GetName] ahora resuenan con el paso de los soldados [subject_flipper.GetAdjective]. Entre nuestra propia élite, algunos se han arrodillado ante [subject_flipper.GetRuler.GetPraenomen], buscando ventaja bajo el gobierno de [subject_flipper.GetRuler.GetHerHis]. Otros, sin embargo, esperan el momento oportuno en secreto, poniendo sus esperanzas en [current_overlord.GetName] para expulsar a los [subject_flipper.GetAdjective] de [flipping_subject.GetCapital.GetName] y restaurar nuestra independencia."
 diadochi_liberation.2006.a:0 "Aguantaremos hasta que llegue la liberación."
 #diadochi_liberation.2006.b:0 "Some see only opportunity in defeat."

 diadochi_liberation.2007.t:0 "[flipping_subject.GetName] cae bajo [subject_flipper.GetAdjective] ocupación"
 diadochi_liberation.2007.desc:0 "Los [flipping_subject.GetAdjective] resistieron todo lo que pudieron, pero ahora las tropas [subject_flipper.GetAdjective] caminan por las calles de [flipping_subject.GetCapital.GetName]. Ciertos miembros de la élite [flipping_subject.GetAdjective] han declarado su apoyo a la causa [subject_flipper.GetAdjective], deseosos de asegurarse el favor del nuevo régimen. Sin embargo, otros conspiran silenciosamente en las sombras, con la esperanza de que [current_overlord.GetName] algún día expulse a los [subject_flipper.GetAdjective] de la ciudad y confíe su gobierno en manos leales."
 diadochi_liberation.2007.a:0 "Por fin, [flipping_subject.GetCapital.GetName] reconoce nuestro poder."
 diadochi_liberation.2007.b:0 "[flipping_subject.GetName] debería haberse rendido cuando tuvo la oportunidad."
 diadochi_liberation.2007.c:0 "Nos ocuparemos de [flipping_subject.GetName] una vez que los [current_overlord.GetAdjective] hayan sido derrotados."
 diadochi_liberation.2007.ct:0 "#T No pasa nada#!"

 diadochi_liberation.2008.t:0 "[flipping_subject.GetName] Cae ante [subject_flipper.GetAdjective] Fuerzas"
 diadochi_liberation.2008.desc:0 "Los [flipping_subject.GetAdjective] resistieron todo lo que pudieron, pero ahora las tropas [subject_flipper.GetAdjective] caminan por las calles de [flipping_subject.GetCapital.GetName]. Los colaboradores entre los [flipping_subject.GetAdjective] ahora tienen el control de [flipping_subject.GetName]. Sin embargo, sus oponentes conspiran silenciosamente en las sombras, con la esperanza de que [current_overlord.GetName] algún día regrese para expulsar a los [subject_flipper.GetAdjective] de [flipping_subject.GetCapital.GetName]."
 diadochi_liberation.2008.a:0 "¿Cómo pudo pasar esto?"
 diadochi_liberation.2008.b:0 "Es mejor tener a [subject_flipper.GetRuler.GetPraenomen] como amigo que como enemigo."
 diadochi_liberation.2008.c:0 "Interesante..."

 #Diadochi Flavor
 diadochi_flavor.1.a.antigonus.death:2 "#R Si no logras conquistas Corinto, o si pierdes Ascalon, Antigonia, Chalcis o Salamis, tu imperio se separará cuando muera Antígono.#! \n\n"
 diadochi_flavor.1.a.tt:2 "Podemos usar el objetivo militar #G Legado de Alejandro#! sobre otros diádocos.\n#G Ganamos reclamos sobre el antiguo Imperio de Alejandro#!:\nGrecia, Tracia, Macedonia, Siria, Asia, Cilicia, Frigia, Asiria, Persia, Palestina, Mesopotamia, y Egipto Inferior y Superior.\n\n#R Estos reclamos y el objetivo militar desaparecerán con la muerte de nuestro segundo gobernante.#!"
 diadochi_flavor.2.a.tt:3 "Podemos usar el objetivo militar #G Legado de Alejandro#! sobre otros diádocos.\n#G Ganamos reclamos sobre el antiguo Imperio de Alejandro#!:\nGrecia, Tracia, Macedonia, Siria, Asia, Cilicia, Frigia, Asiria, Persia, Palestina, Mesopotamia, y Egipto Inferior y Superior.\n#R Estos reclamos y el objetivo militar desaparecerán con la muerte de nuestro gobernante.#!"
 legacy_of_alexander_wargoal_tt:0 "Podemos usar el objetivo militar #G Legado de Alejandro#! sobre otros diádocos.\n#G Ganamos reclamos sobre el antiguo Imperio de [GetCharacter('(int32)39').GetPraenomen]#!:\n[GetProvince('(int32)418').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)350').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)379').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)1883').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)1936').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)4799').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)516').GetArea.GetRegion.GetName|Y] y [GetProvince('(int32)569').GetArea.GetRegion.GetName|Y]."
 diadochi_flavor.6.a.tt:0 "#R Todos los reclamos sobre el Imperio de Alejandro están perdidos para nosotros.#!\n#R Ya no podemos usar el objetivo militar 'Legado de Alejandro' al declarar la guerra.#!"
 diadochi_flavor.1.t:0 "Las guerras de los diádocos"
 diadochi_flavor.1.a:0 "¡El imperio pertenece a los más fuertes!"
 diadochi_flavor.1.b:0 "Antígono sobrevivirá a todos, ¡cueste lo que cueste!"
 diadochi_flavor.1.b.tt:0 "Todas las habilidades de [GetCountry('PRY').GetRuler.GetPraenomen] se reducirán a #R 7#!."
 diadochi_flavor_1_desc_intro:1 "Tras haber construido el imperio más grande que el mundo haya visto, [GetCharacter('(int32)39').GetPraenomen] Magno murió repentinamente hace dieciocho años. Sin un claro sucesor del imperio, sus generales, quienes son conocidos como 'diádocos' o sucesores, luchan desde entonces por el botín.\n\n"
 diadochi_flavor_1_desc_outro:1 "[GetCharacter('(int32)37').GetPraenomen] es quizás el diádoco más exitoso, pero el éxito genera enemigos y ahora está solo y es vulnerable."
 diadochi_flavor.1.desc:3 "$diadochi_flavor_1_desc_intro$Como sátrapa de [GetProvince('(int32)1936').GetArea.GetRegion.GetName], nuestro gobernante [GetCharacter('(int32)37').GetPraenomen] no formó parte de la mayoría de las grandes campañas de [GetCharacter('(int32)39').GetPraenomen], pero en los conflictos de la última década se ha convertido en el más poderoso de los sucesores. En otros lugares, [GetCharacter('(int32)24').GetPraenomen] ha logrado recuperar [GetProvince('(int32)918').GetName] y unir el imperio oriental, y la lucha por [GetProvince('(int32)418').GetArea.GetRegion.GetName] continúa contra [GetCharacter('(int32)32').GetPraenomen] en Macedonia.\n\nNuestra reputación como protectores de las ciudades griegas libres nos ha ganado muchos amigos entre los estados griegos más pequeños, pero por lo demás, ahora estamos solos..."
 diadochi_flavor.2.desc:4 "$diadochi_flavor_1_desc_intro$Nuestro gobernante [GetCharacter('(int32)32').GetPraenomen] de Macedonia es hijo de [GetCharacter('(int32)9').GetPraenomen], quien era el mayor de los generales de [GetCharacter('(int32)39').GetPraenomen] y, después del asesinato del anterior regente Pérdicas, tuvo el honor de proteger a los herederos de [GetCharacter('(int32)39').GetPraenomen] hasta que su hijo cumpliera la mayoría de edad. Tras la muerte de su propio padre, [GetCharacter('(int32)32').GetPraenomen] derrocó a su sucesor designado [GetCharacter('(int32)521').GetPraenomen] con la ayuda de los enemigos de su padre, y finalmente mató a los herederos de [GetCharacter('(int32)39').GetPraenomen] y a sus madres.\n\n$diadochi_flavor_1_desc_outro$ Su intromisión con los estados griegos continúa y ahora ha arrebatado el control del estratégico [GetProvince('(int32)407').Custom('get_city_type_loc')] de [GetProvince('(int32)407').GetName]."
 diadochi_flavor.3.desc:3 "$diadochi_flavor_1_desc_intro$Como amigo cercano de [GetCharacter('(int32)39').GetPraenomen] y general experimentado, nuestro gobernante [GetCharacter('(int32)41').GetPraenomen] aparentemente justificaría una provincia más rica que Tracia. Aunque frecuentemente involucrado en los conflictos de los Antipatridas en Macedonia y [GetCharacter('(int32)37').GetPraenomen], el ex Sátrapa de [GetProvince('(int32)1936').GetArea.GetRegion.GetName], [GetCharacter('(int32)41').GetPraenomen] aún no ha podido expandir su gobierno más allá de la región que le fue encomendado proteger.\n\n$diadochi_flavor_1_desc_outro$ Esta es una gran oportunidad, si solo podemos conseguir aliados para oponerse a él..."
 diadochi_flavor.4.desc:3 "$diadochi_flavor_1_desc_intro$Nuestro gobernante [GetCharacter('(int32)42').GetPraenomen], uno de los amigos más antiguos de [GetCharacter('(int32)39').GetPraenomen], se ha asegurado Egipto, la provincia más rica del imperio. Sin embargo, la expansión a [GetProvince('(int32)418').GetArea.GetRegion.GetName] y [GetProvince('(int32)790').GetArea.GetRegion.GetName] se ha visto frustrada por [GetCharacter('(int32)37').GetPraenomen] Monophtalmos, el antiguo sátrapa de [GetProvince('(int32)1936').GetArea.GetRegion.GetName], cuyo hijo [GetCharacter('(int32)38').GetPraenomen] 'el sitiador' recientemente aplastó a toda nuestra flota en la batalla de Salamina frente a [GetProvince('(int32)331').GetArea.GetName].\n\n$diadochi_flavor_1_desc_outro$ Esta es una gran oportunidad, si podemos sólo tiene aliados seguros para oponerse a él..."
 diadochi_flavor.5.desc:3 "Alejandro Magno murió repentinamente hace dieciocho años, luego de haber construido el mayor imperio que el mundo haya visto. Como no hay un sucesor claro del imperio, sus generales, los \"diádocos\" o sucesores, se disputan desde entonces el botín.\n\nDurante ese tiempo, nuestro gobernante Seleuco ha ascendido gracias a su propia capacidad, y ahora controla todo el imperio oriental. Este imperio fue capturado recientemente por Antígono Monóftalmos, el antiguo sátrapa de Frigia.\n\nAntígono es tal vez el más exitoso de los sucesores, pero el éxito genera enemigos, y ahora está solo y vulnerable.\n\nEs una gran oportunidad, si logramos asegurar la paz en nuestra frontera oriental..."

 diadochi_flavor.6.t:0 "Los epígonos"
 diadochi_flavor.6.desc:2 "Los reyes que prestaron servicio a Alejandro han comenzado a fallecer. Con ellos, también muere cualquier reclamo inmediato sobre su imperio. Los hombres conocidos como \"los sucesores\" ahora son sucedidos por sus vástagos, los \"epígonos\".\n\nAunque son líderes poderosos por derecho propio, con reclamos válidos sobre los reinos de sus padres, estos \"epígonos\" forman parte de dinastías regionales y no pueden restaurar un imperio que se ha visto manchado por una generación de luchas internas."
 diadochi_flavor.6.a:0 "El mundo nos conocerá por nuestras propias hazañas."

 diadochi_flavor.7.t:0 "La capital de un imperio"
 diadochi_flavor.7.desc:1 "Como sucesores del imperio de Alejandro, debemos considerar si [ROOT.GetCountry.GetCapital.GetName] es realmente el mejor lugar para gobernar el mundo helenístico. Algunos afirman que existen otras ciudades más aptas para esta tarea.\n\nPor supuesto, todas las posibles ubicaciones tienen su ventajas, así que debemos elegir cuidadosamente."
 diadochi_flavor.7.a:1 "Pella, la sede de los reyes argéadas."
 diadochi_flavor.7.b:1 "Alejandría en el Nilo, el corazón de Egipto."
 diadochi_flavor.7.c:1 "Babilonia, donde se fundó el imperio."
 diadochi_flavor.7.d:1 "Alejandría en el Indo, en el fin del mundo."
 diadochi_flavor.7.e:0 "[ROOT.GetCountry.GetCapital.GetName] seguirá siendo nuestra capital."

 diadochi_flavor.8.t:3 "La causa antigónida está desapareciendo"
 diadochi_flavor.8.desc:3 "Con el fallecimiento de Antígono, el estado que creó a partir de su satrapía frigia se encuentra, por primera vez, sin su fundador. El ascenso meteórico de Antígono provocó la envidia y la admiración de una generación, pero las derrotas en Egipto y Babilonia resultaron demasiado difíciles de revertir antes de que muriera el anciano general.\n\nDebido al fallecimiento de su primer rey, el reino antigónida está más desunido de lo que ha estado por mucho tiempo. En las ciudades de Asia Menor sobre todo, la lealtad está menguando y toda la región ahora está en riesgo de desertar de la autoridad central. Seguramente podríamos aferrarnos a ella, pero a cambio de alienar aún más a los súbditos leales que nos quedan..."
 diadochi_flavor.8.a:0 "Volveremos para recuperar lo que perdimos."
 diadochi_flavor.8.at:0 "Todos los territorios Antigonid fuera de [GetProvince('(int32)418').GetArea.GetRegion.GetName|Y] y [GetProvince('(int32)331').GetArea.GetName|Y] pueden ser #R divididos entre otros Diadochi#!."
 diadochi_flavor.8.at1:1 "#R [GetProvince('(int32)244').GetArea.GetRegion.GetName|Y] $diadochi_flavor_will_be_seized$ #Y [GetCountry('TRE').GetName]#! @[GetCountry('TRE').GetFlag]!#!"
 diadochi_flavor.8.at2:1 "#R [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y] $diadochi_flavor_will_be_seized$ #Y [GetCountry('EGY').GetName]#! @[GetCountry('EGY').GetFlag]!#!"
 diadochi_flavor.8.at3:1 "#R [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y] y [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y], $diadochi_flavor_will_be_seized$ #Y [GetCountry('SEL').GetName]#! @[GetCountry('SEL').GetFlag]!#!"
 diadochi_flavor.8.at31:1 "#R [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y] $diadochi_flavor_will_be_seized$ #Y [GetCountry('SEL').GetName]#! @[GetCountry('SEL').GetFlag]!#!"
 diadochi_flavor.8.at32:1 "#R [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y] $diadochi_flavor_will_be_seized$ #Y [GetCountry('SEL').GetName]#! @[GetCountry('SEL').GetFlag]!#!"
 diadochi_flavor.8.at33:1 "#R [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y], $diadochi_flavor_will_be_seized$ #Y [GetCountry('SEL').GetName]#! @[GetCountry('SEL').GetFlag]!#!"
 diadochi_flavor.8.at4:1 "#R #Y Caria#! y el continente oriental [GetProvince('(int32)1883').GetArea.GetRegion.GetName|Y] $diadochi_flavor_will_be_seized$ #Y [GetCountry('MAC').GetName]#! @[GetCountry('MAC').GetFlag]!#!"
 diadochi_flavor.8.at5:2 "#R [GetProvince('(int32)244').GetArea.GetRegion.GetName|Y] $diadochi_flavor_will_be_seized$ #Y [GetCountry('TRE').GetName]#! @[GetCountry('TRE').GetFlag]!#!"
 diadochi_flavor.8.tt:1 "#R [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y] y [GetProvince('(int32)1936').GetArea.GetRegion.GetName|Y] desertarán como sátrapas de #Y [GetCountry('TRE').GetName]#! @[GetCountry('TRE').GetFlag]!#!"
 diadochi_flavor_will_be_seized:0 "será tomada por"
 diadochi_flavor.8.at6:1 "#R Continente oriental [GetProvince('(int32)1883').GetArea.GetRegion.GetName|Y] $diadochi_flavor_will_be_seized$ #Y [GetCountry('TRE').GetName]#! @[GetCountry('TRE').GetFlag]!#!"
 diadochi_flavor.8.b:0 "¡No renunciaremos a una sola ciudad!"
 diadochi_flavor.8.bt:1 "Los territorios antigónidas en [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)244').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)418').GetArea.GetRegion.GetName|Y] y [GetProvince('(int32)331').GetArea.GetName|Y] se podrán #R dividir entre otros diádocos#!."
 diadochi_flavor.8.bt1:1 "#R [GetProvince('(int32)331').GetArea.GetName|Y] $diadochi_flavor_will_be_seized$ #Y [GetCountry('EGY').GetName]#! @[GetCountry('EGY').GetFlag]!#!"
 diadochi_flavor.8.bt2:1 "#R [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y] y [GetProvince('(int32)331').GetArea.GetName|Y] y $diadochi_flavor_will_be_seized$ #Y [GetCountry('EGY').GetName]#! @[GetCountry('EGY').GetFlag]!#!"
 diadochi_flavor.8.bt4:2 "#R [GetProvince('(int32)418').GetArea.GetRegion.GetName|Y] y #Y Caria#! $diadochi_flavor_will_be_seized$ #Y [GetCountry('MAC').GetName]#! @[GetCountry('MAC').GetFlag]!#!"
 diadochi_flavor.8.c:0 "¡Los antigónidas están acabados, el resto tiene un plan!"
 diadochi_flavor.8.ct:0 "Jugaremos como #Y Pérgamo#!, liderada por [attalid_head.GetName|Y]."
 diadochi_flavor.8.ct2:0 "Pérgamo se convertirá en una satrapía de @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName|Y]"

 diadochi_flavor.9.t:1 "La causa antigónida"
 diadochi_flavor.9.desc:1 "Con el fallecimiento de [GetCharacter('(int32)37').GetPraenomen] el Tuerto, el estado que se construyó a partir de una oscura satrapía frigia ahora se encuentra sin su fundador por primera vez. El meteórico ascenso de [GetCharacter('(int32)37').GetPraenomen] ha atraído la envidia y la admiración de una generación y este legado seguirá beneficiando a nuestros gobernantes durante las generaciones venideras."
 diadochi_flavor.9.a:0 "¡Larga vida al rey!"
 claims_on_trans_indus_tooltip:1 "El Imperio Argéada reclamará la región de Madhyadesa."

 diadochi_flavor.10.t:0 "La coronación de [ROOT.GetCountry.GetRuler.GetPraenomen]"
 diadochi_flavor.10.desc:1 "Luego de que [ROOT.GetCountry.GetSuccession.GetPrimaryHeir.GetPraenomen] aplastó a la flota egipcia en Salamina, [ROOT.GetCountry.GetSuccession.GetPrimaryHeir.GetSheHe] envió a su oficial de más confianza, Aristodemos de Miletos, con la noticia de nuestra gran victoria. Aristodemos nombró [ROOT.GetCountry.GetRulerTitle] a [ROOT.GetCountry.GetRuler.GetPraenomen] frente a una multitud reunida y el pueblo se regocijó. De inmediato, se llevó a cabo la coronación. Ahora todo el mundo llamará [ROOT.GetCountry.GetRulerTitle] a [ROOT.GetCountry.GetRuler.GetPraenomen].\n\nSin embargo, [ROOT.GetCountry.GetRuler.GetPraenomen] se enteró de que [ROOT.GetCountry.GetSuccession.GetPrimaryHeir.GetPraenomen], quien recibió el cargo de cogobernante, se burla de otros diádocos y les pone apodos insultantes: Seleuco \"el comandante de elefantes\", Ptolomeo \"el almirante\", Lisímaco \"el tesorero\" y hasta Agatocles \"el gobernador de Sicilia\", aunque no es uno de los nuestros. Cuando se enteren de esto, se enojarán..."
 diadochi_flavor.10.a:0 "'¡De todas formas se arrodillarán!'"
 diadochi_flavor.10.b:1 "\"Le diremos a [ROOT.GetCountry.GetSuccession.GetPrimaryHeir.GetPraenomen] que se concentre en la victoria\"."

 diadochi_flavor.11.t:1 "Llegan noticias de las Antigónidas"
 diadochi_flavor.11.desc:1 "Nuestro maestro de espías entra a la sala del trono y hace un gesto de que le gustaría hablar con nuestro gobernante. Traen noticias de los Antigónidas. La batalla de Salamina fue una pérdida desastrosa para nosotros y la mayor parte de nuestra flota fue hundida frente a las costas de Chipre. Además, aparentemente [GetCharacter('(int32)37').GetPraenomen] se hizo coronar Basileus después de su victoria en Salamina sobre la flota egipcia. Cualquier pretensión de una línea de sucesión #E Argead#! ha sido oficialmente dejada de lado, y el trono del imperio de [GetCharacter('(int32)39').GetPraenomen] está listo para ser tomado.\n\nSin embargo, el maestro de espías tiene más noticias. Parece que el heredero de [GetCharacter('(int32)37').GetPraenomen] [GetCharacter('(int32)38').GetPraenomen] ha estado difamando a los otros Diadochi y les ha dado títulos poco halagadores. [GetCharacter('(int32)24').GetPraenomen] 'el Maestro de los Elefantes', [GetCharacter('(int32)41').GetPraenomen] 'el Tesorero' e incluso [GetCharacter('(int32)56').GetPraenomen] 'el Gobernador de Sicilia', aunque no es uno de nosotros. [ROOT.GetCountry.GetRuler.GetPraenomen] pregunta a su maestro de espías qué título le ha otorgado. El jefe de espías guarda silencio por un momento y luego responde \"Almirante\". La risa de [ROOT.GetCountry.GetRuler.GetPraenomen] resuena en toda la sala del trono."
 diadochi_flavor.11.a:0 "'En respuesta, me coronaré rey-dios'."
 diadochi_flavor.11.b:0 "'Almirante, ¿eh?'"

 diadochi_flavor.12.t:1 "Llegan noticias de las Antigónidas"
 diadochi_flavor.12.desc:1 "Nuestro maestro de espías entra a la sala del trono y hace un gesto de que le gustaría hablar con nuestro gobernante. Traen noticias de los Antigónidas. Aparentemente [GetCharacter('(int32)37').GetPraenomen] se hizo coronar Basileus después de su victoria en Salamina sobre la flota egipcia. Cualquier pretensión de una línea de sucesión #E Argead#! ha sido oficialmente dejada de lado, y el trono del imperio de [GetCharacter('(int32)39').GetPraenomen] está listo para ser tomado.\n\nSin embargo, el maestro de espías tiene más noticias. Parece que el heredero de [GetCharacter('(int32)37').GetPraenomen] [GetCharacter('(int32)38').GetPraenomen] ha estado difamando a los otros Diadochi y les ha dado títulos poco halagadores. [GetCharacter('(int32)24').GetPraenomen] 'el Maestro de los Elefantes', [GetCharacter('(int32)42').GetPraenomen] 'el Almirante' y [GetCharacter('(int32)41').GetPraenomen] 'el Tesorero'. Parece, sin embargo, que hemos sido honrados con un epíteto propio, debido a nuestro reciente reclamo del título de rey de Sicilia. [ROOT.GetCountry.GetRuler.GetName] pregunta a su maestro de espías qué título le ha otorgado. El jefe de espías guarda silencio por un momento y luego responde: \"Gobernador de Sicilia\". La risa de [ROOT.GetCountry.GetRuler.GetPraenomen] resuena en toda la sala del trono."
 diadochi_flavor.12.a:0 "'Soy el REY de Sicilia'"
 diadochi_flavor.12.b:0 "'Gobernador, ¿eh?'"

 diadochi_flavor.13.t:1 "Llegan noticias de las Antigónidas"
 diadochi_flavor.13.desc:1 "Nuestro maestro de espías entra a la sala del trono y hace un gesto de que le gustaría hablar con nuestro gobernante. Traen noticias de los Antigónidas. Aparentemente [GetCharacter('(int32)37').GetPraenomen] se hizo coronar Basileus después de su victoria en Salamina sobre la flota egipcia. Cualquier pretensión de una línea de sucesión #E Argead#! ha sido oficialmente dejada de lado, y el trono del imperio de [GetCharacter('(int32)39').GetPraenomen] está listo para ser tomado.\n\nSin embargo, el maestro de espías tiene más noticias. Parece que el heredero de [GetCharacter('(int32)37').GetPraenomen] [GetCharacter('(int32)38').GetPraenomen] ha estado difamando a los otros Diadochi y les ha dado títulos poco halagadores. [GetCharacter('(int32)42').GetPraenomen] 'el Almirante', [GetCharacter('(int32)41').GetPraenomen] 'el Tesorero' e incluso [GetCharacter('(int32)56').GetPraenomen] 'el Gobernador de Sicilia', aunque no es uno de nosotros. [ROOT.GetCountry.GetRuler.GetPraenomen] pregunta a su maestro de espías qué título le ha otorgado. El maestro de espías guarda silencio por un momento y luego responde: \"Maestro de los elefantes\". La risa de [ROOT.GetCountry.GetRuler.GetPraenomen] resuena en toda la sala del trono."
 diadochi_flavor.13.a:0 "'Seré el gobernante de toda Asia'."
 diadochi_flavor.13.b:0 "'Elefantes, ¿eh?'"

 diadochi_flavor.14.t:1 "Malas noticias de los antigónidas"
 diadochi_flavor.14.desc:1 "Nuestro maestro de espías entra a la sala del trono y hace un gesto de que le gustaría hablar con nuestro gobernante. Traen noticias de los Antigónidas. Aparentemente [GetCharacter('(int32)37').GetPraenomen] se hizo coronar Basileus después de su victoria en Salamina sobre la flota egipcia. Cualquier pretensión de una línea de sucesión #E Argead#! ha sido oficialmente dejada de lado, y el trono del imperio de [GetCharacter('(int32)39').GetPraenomen] está listo para ser tomado.\n\nSin embargo, el maestro de espías tiene más noticias. Parece que el heredero de [GetCharacter('(int32)37').GetPraenomen] [GetCharacter('(int32)38').GetPraenomen] ha estado difamando a los otros Diadochi y les ha dado títulos poco halagadores. [GetCharacter('(int32)24').GetPraenomen] 'el Maestro de los Elefantes', [GetCharacter('(int32)42').GetPraenomen] 'el Almirante' e incluso [GetCharacter('(int32)56').GetPraenomen] 'el Gobernador de Sicilia', aunque no es uno de nosotros. [ROOT.GetCountry.GetRuler.GetPraenomen] pregunta a su maestro de espías qué título le ha otorgado. El rostro del maestro de espías se vuelve tan blanco como la nieve recién caída en las montañas de Odrysia, pero sube las escaleras y le susurra al oído a [ROOT.GetCountry.GetRuler.GetPraenomen]. [ROOT.GetCountry.GetRuler.GetPraenomen] él mismo se pone rojo de rabia y le ruge a su maestro de espías. '¿¡Tesorero!? ¿¡Cómo se atreve a llamarme tesorero!? un puñado de risitas y risas llenan la sala del trono."
 diadochi_flavor.14.a:0 "'¡NO soy un eunuco!'"
 diadochi_flavor.14.b:0 "'Le mostraré lo viriles que somos'."

 diadochi_flavor.15.t:1 "La guerra en Grecia"
 diadochi_flavor.15.desc:2 "Después del esfuerzo herakleo que caracterizó el asedio de [GetProvince('(int32)266').GetName], los [GetCountry('PRY').GetAdjective] volvieron sus ojos hacia el oeste. Las ciudades-estado libres de [GetProvince('(int32)418').GetArea.GetRegion.GetName] fueron reunidas en una liga disciplinada, con el único objetivo de encerrar al despiadado [GetCharacter('(int32)32').GetPraenomen] y los restos de sus fuerzas aún presentes en Macedonia.\n\nDespués de una breve pausa en los combates, los generales [GetCountry('PRY').GetAdjective] liderados por [GetCharacter('(int32)38').GetPraenomen] ahora insisten en que es el momento adecuado para provocar una ofensiva del [GetCountry('MAC').GetAdjective] amenaza, independientemente de la amenaza que se está gestando por parte de los sucesores de [GetCharacter('(int32)39').GetPraenomen] en otros lugares."
 diadochi_flavor.15.a:1 "Casandro lamentará el día."
 diadochi_flavor.15.b:0 "Debemos centrarnos en otro lugar."
 diadochi_flavor.15.b.tooltip:2 "#R Los $PRY_DYN_ADJ$ se retirarán de Grecia:#!\n"
 no_longer_champion_of_free_greeks:0 "Al abandonar a los griegos libres, podemos enfrentarnos a los disturbios que tenemos en casa en el futuro."
 macedon_war_choice:0 "#R Esto podría terminar en guerra.#!"
 macedon_back_down:0 "#R Nuestra gente tendrá mala opinión de nosotros por dar marcha atrás.#!"

 diadochi_flavor.16.t:2 "Velas $PRY_DYN_ADJ$"
 diadochi_flavor.16.desc:2 "Nuestros soldados en la costa han comenzado a reportar una gran masa de velas $PRY_DYN_ADJ$ en el horizonte. Los $PRY_DYN_ADJ$ se vieron obligados a dirigir su atención a Macedonia una vez más después del asedio de Rodas, y nuestros generales nos instan a actuar con rapidez.\n\nLos miembros más moderados de nuestro consejo, sin embargo, sugieren que se podría ganar un poco de tiempo concediendo nuestra última participación en el Peloponeso; hay que abandonar efectivamente cualquier esperanza de recuperar el dominio sobre la llamada Liga Helénica."
 diadochi_flavor.16.a:0 "No podemos aplazar la guerra para siempre."
 diadochi_flavor.16.b:0 "¡Debemos ganar tiempo para prepararnos!"

 diadochi_flavor.17.t:2 "Emisario de paz $PRY_DYN_ADJ$"
 diadochi_flavor.17.desc:2 "En un sorprendente giro de los acontecimientos, un embajador [GetCountry('PRY').GetAdjective] apareció bajo una bandera de tregua, en nuestras fronteras.\n\nAfirma que la causa [GetCountry('PRY').GetAdjective] no se beneficia con la guerra con el Reino [GetCountry('MAC').GetAdjective], y que todos sus ejércitos están siendo retirados de [GetProvince('(int32)418').GetArea.GetRegion.GetName].\n\nNuestros generales están de acuerdo unánimemente en que un corto La tregua es una opción viable, esto permitirá que los [GetCountry('PRY').GetAdjective] se retiren, dejando el resto de [GetProvince('(int32)418').GetArea.GetRegion.GetName] abierto para que lo reclamemos nosotros. Seguiremos con interés los acontecimientos."
 diadochi_flavor.17.a:0 "Que así sea."
 diadochi_flavor.17.a.tt:3 "@[antigonids_scope.GetFlag]! [antigonids_scope.GetName|Y] ya no tiene ningún territorio ni estado súbdito en la región de [GetProvince('(int32)418').GetArea.GetRegion.GetName]."

 diadochi_flavor.18.t:1 "Concesión de Corinto"
 diadochi_flavor.18.desc:2 "En un movimiento muy inusual, el inútil en la cima del trono [GetCountry('MAC').GetAdjective] ofreció la [GetProvince('(int32)418').Custom('get_city_type_loc')] de [GetProvince('(int32)418').GetName] a cambio de un periodo de tregua garantizado.\n\nNuestro diplomático aprovechó correctamente esta oferta sin esperar la confirmación. Nuestro dominio en [GetProvince('(int32)418').GetArea.GetRegion.GetName] se hace cada vez más fuerte."
 diadochi_flavor.18.a:0 "Excelente."

 diadochi_flavor.19.t:1 "La guerra en Grecia"
 diadochi_flavor.19.desc:2 "Los [GetCountry('PRY').GetAdjective], en su arrogancia y locura, han elegido reanudar una vez más las hostilidades con [GetCharacter('(int32)32').GetName] de Macedonia, en un vano intento de demostrar su dominio sobre los conocidos como los Diadochi.\n\nSolo podemos esperar a ver qué efecto tendrá esto en la política del mundo conocido, y cuántos hijos deben morir para saciar los apetitos sanguinarios de los reyes tiranos."
 diadochi_flavor.19.a:0 "Noticias preocupantes."

 diadochi_flavor.20.t:1 "En defensa de Casandro"
 diadochi_flavor.20.desc:2 "La larga guerra continúa, y nuestros generales nos aseguran que es hora de que nos unamos contra la amenaza $PRY_DYN_ADJ$.\n\nUna voz pensativa al fondo del consejo de guerra, sin embargo, sugiere que tal vez se podría llegar a un acuerdo con los $PRY_DYN_ADJ$, que parecen estar muy preocupados por tratar con Casandro en el Peloponeso."
 diadochi_flavor.20.a:0 "Nuestras promesas deben ser honradas."
 diadochi_flavor.20.b:0 "Veamos qué resulta de esto..."
 offer_will_be_sent_egy:2 "¡Una oferta para el intercambio de @[GetCountry('PRY').GetFlag]! Se enviará [GetCountry('PRY').GetAdjective|Y] territorio.#!\nSi #R se niegan#!:"
 diadochi_flavor.20.c:0 "Mejor esperar y ver."
 passive_egypt_tt:0 "Nos abstendremos de unirnos a esta ronda de las guerras diádocas por ahora."

 diadochi_flavor.21.t:1 "Ptolomeo se agita"
 diadochi_flavor.21.desc:2 "Ya sea en defensa del frágil pacto entre el Reino [GetCountry('MAC').GetAdjective] y [GetCountry('EGY').GetAdjective], o por motivos egoístas, no podemos decirlo; todo lo que sabemos es que el Reino [GetCountry('EGY').GetAdjective] ha comenzado a marchar sobre los [GetCountry('PRY').GetAdjective] desde el sur.\n\nEl futuro del otrora gran imperio de [GetCharacter('(int32)39').GetName] parece cada vez más incierto."
 diadochi_flavor.21.a:0 "Qué arrogancia..."

 diadochi_flavor.22.t:0 "Ultimátum ptolemaico"
 diadochi_flavor.22.desc:2 "Mientras la guerra en [GetProvince('(int32)418').GetArea.GetRegion.GetName] continúa, el cobarde [GetCountry('EGY').GetRuler.GetPraenomen] hace su movimiento. Llega un enviado del reino del sol y el águila, poniendo sobre la mesa una tentadora oferta.\n\nPara la concesión de algunos de nuestros territorios en [GetProvince('(int32)790').GetArea.GetRegion.GetName] y [GetProvince('(int32)714').GetArea.GetRegion.GetName], el Reino [GetCountry('EGY').GetAdjective] está dispuesto a firmar una tregua formalizada, dándonos la oportunidad de acabar con los miserables [GetCountry('MAC').GetRuler.GetPraenomen] de una vez por todas."
 diadochi_flavor.22.a:0 "No podemos permitirnos otro frente en esta guerra."
 diadochi_flavor.22.b:0 "¡Nunca! ¡Nuestra causa es justa!"

 diadochi_flavor.23.t:2 "Concesiones $PRY_DYN_ADJ$"
 diadochi_flavor.23.desc:2 "En un sorprendente giro de los acontecimientos, los [GetCountry('PRY').GetAdjective] parecen estar demasiado preocupados con [GetProvince('(int32)418').GetArea.GetRegion.GetName] como para poder rechazar nuestras escandalosas demandas.\n\nSu enviado acepta a regañadientes ceder el control de #E Megara#!, #E las islas#! y #E Coele. Siria#!, a cambio de una tregua, mientras sus ejércitos se dedican a combatir al insidioso [GetCharacter('(int32)32').GetName] y sus parientes."
 diadochi_flavor.23.a:0 "¡Excelentes noticias!"

 diadochi_flavor.24.t:2 "[GetCountry('PRY').GetAdjective] Concesiones al Reino [GetCountry('EGY').GetAdjective]"
 diadochi_flavor.24.desc:2 "Los vientos alisios traen noticias preocupantes. Los [GetCountry('PRY').GetAdjective] han cedido muchos de sus territorios en [GetProvince('(int32)687').GetArea.GetRegion.GetName] y [GetProvince('(int32)790').GetArea.GetRegion.GetName] a los Lagids; con la esperanza, presumiblemente, de asegurar una larga tregua para acabar con [GetCharacter('(int32)32').GetName] y sus aliados en Macedonia.\n\nLos Diadochi continúan apuñalándose unos a otros por la espalda con habilidad practicada."
 diadochi_flavor.24.a:0 "Qué alarmante."
 transfer_phrygian_lands_egy_tt:3 "Las tierras #Y$PRY_DYN_ADJ$#! en #Y Palestina#!, #Y Chipre#!, #Y Siria Coele#! y #Y Fenicia Sur#! se ceden a #Y Egipto#!."
 transfer_antigonid_lands_egy_tt:3 "Los #Y [GetCountry('PRY').GetAdjective]#! han cedido el control de #E Megara#!, #E las islas#! y #E Coele Siria#! al #Y Reino Ptolemaico#!."

 diadochi_flavor.25.t:1 "La guerra por Grecia"
 diadochi_flavor.25.desc:1 "Con su estilo típicamente arrogante, [GetCharacter('(int32)32').GetName] ha elegido la guerra antes que la razón. El Reino [GetCountry('MAC').GetAdjective] se está preparando para ir a la guerra con nosotros."
 diadochi_flavor.25.a:0 "Acabaremos con él."
 diadochi_flavor.25.at:1 "#Y [GetCountry('PRY').GetName]#! @[GetCountry('PRY').GetFlag] ahora está en guerra con #Y [GetCountry('MAC').GetName]#! @[GetCountry('MAC').GetFlag]."
 diadochi_flavor.26.t:0 "Ultimátum rechazado"
 diadochi_flavor.26.desc:2 "Los $PRY_DYN_ADJ$ rechazaron nuestra oferta y la guerra por el Levante ahora es inminente una vez más."
 diadochi_flavor.26.a:0 "Qué arrogancia..."

 diadochi_flavor.27.t:0 "Un momento para atacar"
 diadochi_flavor.27.desc:3 "Los $PRY_DYN_ADJ$s están envueltos en un conflicto en el oeste. Esta es quizás la oportunidad que hemos estado buscando para terminar finalmente con su lastimosa dinastía. Nuestros consejeros recomiendan que ataquemos ahora y que invadamos Siria con todo el poder que podamos reunir.\n\nPor otro lado, también tenemos problemas más cerca de casa, quizás un ultimátum sea suficiente para asegurar el acceso al mar Mediterráneo. Se pueden planear más conquistas para un momento posterior."
 diadochi_flavor.27.a:0 "¡Debemos atacar ahora!"
 diadochi_flavor.27.b:1 "Enviemos un mensajero a Antígono"
 offer_will_be_sent_to_pry:2 "¡Una oferta para el intercambio de @[GetCountry('PRY').GetFlag]! Se enviará [GetCountry('PRY').GetAdjective|Y] territorio, solicitándoles que entreguen sus tierras en las Provincias de [GetProvince('(int32)818').GetArea.GetName|Y], [GetProvince('(int32)790').GetArea.GetName|Y], [GetProvince('(int32)810').GetArea.GetName|Y], [GetProvince('(int32)777').GetArea.GetName|Y], [GetProvince('(int32)754').GetArea.GetName|Y] y [GetProvince('(int32)779').GetArea.GetName|Y].\nSi #R se niegan#!:"
 diadochi_flavor.27.c:0 "Somos más fuertes en paz..."
 passive_seleukids_tt:0 "Por ahora nos abstendremos de participar en esta ronda de guerras de los Diádocos."

 diadochi_flavor.28.t:1 "Un mensajero del imperio seléucida"
 diadochi_flavor.28.desc:1 "Nuestro conflicto en el oeste no ha pasado desapercibido en el imperio seléucida. Un mensajero llegó hoy proclamando que los seléucidos están listos para apoyar a los que se opongan a nuestro reclamo del imperio de Alejandro y una vez más ir a la guerra en el Este.\n\nSin embargo, el emisario también trae una oferta:\n Si cedemos nuestro control sobre Siria, ellos aceptan retirarse por ahora y dejar que resolvamos nuestras diferencias con los otros diádocos sin su participación directa.\nEl emisario fue muy claro en el hecho de que esto significa renunciar a nuestra gran capital: Antigonia. No está claro si los seléucidos esperan que consideremos esto como algo más que un insulto."
 diadochi_flavor.28.a:0 "Debemos evitar la guerra en el este a toda costa."
 diadochi_flavor.28.b:0 "¡Esto no es más que un insulto!"

 diadochi_flavor.29.t:1 "Invasión seléucida"
 diadochi_flavor.29.desc:3 "El conflicto entre los Diadochi está estallando de nuevo con [GetCountry('SEL').GetAdjective] ejércitos cruzando la frontera hacia [GetCountry('PRY').GetAdjective] [GetProvince('(int32)790').GetArea.GetRegion.GetName]. Los elefantes de \n\n[GetCountry('SEL').GetRuler.GetName] tal vez puedan derribar al gigante tuerto gobernante [GetCountry('PRY').GetName]."
 diadochi_flavor.29.a:0 "¿Alguna vez terminará?"
 diadochi_flavor.29.b:0 "¡Si quieren nuestra tierra, tendrán que tomarla!"

 diadochi_flavor.30.t:1 "Guerra con el imperio seléucida"
 diadochi_flavor_30.desc:1 "Sin duda, al notar nuestro conflicto en el oeste, Seleuco reunió a sus ejércitos y, según se informa, está marchando sobre nuestras fronteras. Ahora estamos obligados a luchar en una guerra de dos frentes una vez más."
 diadochi_flavor_30.a:0 "¡Se arrepentirán de esto!"
 diadochi_flavor_30.at:1 "#Y [GetCountry('PRY').GetName]#! @[GetCountry('PRY').GetFlag] ahora está en guerra con #Y [GetCountry('SEL').GetName]#! @[GetCountry('SEL').GetFlag]."
 diadochi_flavor.31.t:1 "Guerra con el Reino [GetCountry('EGY').GetAdjective]"
 diadochi_flavor.31.desc:1 "Mientras la guerra en Grecia continúa, los cobardes Ptolomeos hacen su jugada. Los ejércitos egipcios se están cerrando en nuestras fronteras y está claro que el conflicto creció para incluir un teatro del sur una vez más."
 diadochi_flavor.31.a:0 "¡Insolencia!"
 diadochi_flavor_31.at:1 "#Y [GetCountry('PRY').GetName]#! @[GetCountry('PRY').GetFlag] ahora está en guerra con #Y [GetCountry('EGY').GetName]#! @[GetCountry('EGY').GetFlag]."

 diadochi_flavor.32.t:2 "Los $PRY_DYN_ADJ$ se niegan"
 diadochi_flavor.32.desc:2 "Un mensajero $PRY_DYN_ADJ$ llegó hoy desafiando nuestra generosa oferta de evitar el derramamiento de sangre. Los antigónidas se preparan para ir a la guerra para defender su preciado imperio..."
 diadochi_flavor.32.a:0 "Esto solo puede significar la guerra."

 diadochi_flavor.33.t:2 "Concesiones $PRY_DYN_ADJ$"
 diadochi_flavor.33.desc:2 "Sorprendentemente, parece que los $PRY_DYN_ADJ$ eligieron plegarse a nuestras demandas.\n\nAceptan de mala gana ceder el territorio de Siria y Mesopotamia que pedimos a cambio de una tregua."
 diadochi_flavor.33.a:0 "¡Excelentes noticias!"
 transfer_phrygian_lands_sel_tt:3 "Las tierras #Y$PRY_DYN_ADJ$#! en #Y Osroene#!, #Y Siria#!, #Y Siria Cyrrestice#!, #Y Apamene#!, #Y Palmira#! y #Y Fenicia Norte#! se ceden a #Y$SEL$#!."

 diadochi_flavor.34.t:2 "Concesiones $PRY_DYN_ADJ$ a los seléucidas"
 diadochi_flavor.34.desc:3 "Los $PRY_DYN_ADJ$s concedieron muchos de sus territorios en Siria y Mesopotamia al imperio seléucida; esperan, presumiblemente, evitar el conflicto en el este mientras luchan su guerra en el oeste.\n\nParece que Seleuco volvió a apuñalar a un amigo por la espalda."
 diadochi_flavor.34.a:0 "Qué alarmante."

 diadochi_flavor.35.t:0 "¿Libertad?"
 diadochi_flavor.35.desc:3 "Nuestro señor se alejó de esta región y entregó sus fortalezas a una facción de diádocos opuesta. Un emisario llegó hoy de la corte de los $PRY_DYN_ADJ$s, casi como una consecuencia de esta retirada apresurada del general, para comunicarnos que ya no disfrutaremos de ninguna protección ni se espera que paguemos ningún tipo de tributo."
 diadochi_flavor.35.a:0 "Somos libres, pero ¿estamos a salvo?"
 freedom_tooltip:2 "Ya no somos un estado súbdito del #Y reino $PRY_DYN_ADJ$#!."

 diadochi_flavor.36.t:0 "¿Protector de los griegos?"
 diadochi_flavor.36.desc:3 "Por la retirada de los $PRY_DYN_ADJ$s de Grecia, y el hecho de que no están a la altura de sus demandas de protección de las ciudades griegas libres contra los otros diádocos, un número cada vez mayor dentro de nuestro propio gobierno está pidiendo que reconsideremos nuestro propio apoyo a la causa de $PRY_DYN_ADJ$.\n\nAlgunos argumentan que los $PRY_DYN_ADJ$s demostraron ser débiles y que sería mejor que buscáramos nuestra propia fortuna como entidad independiente. Como griegos libres, deberíamos tener el derecho de dirigir nuestro propio destino."
 diadochi_flavor.36.a:0 "No. Nunca lo tolerarían."
 diadochi_flavor.36.a.tt:2 "Seguiremos siendo leales a los $PRY_DYN_ADJ$."
 diadochi_flavor.36.b:0 "Seamos verdaderamente libres."
 diadochi_flavor.36.b.tt:2 "#R Esto puede llevar a la guerra con los $PRY_DYN$.#!"

 diadochi_flavor.37.t:0 "¿Protector de los griegos?"
 diadochi_flavor.37.desc:1 "Nuestra retirada de Grecia hizo que muchos ya no nos consideren el protector de las ciudades griegas libres que pretendemos ser.\nLa gente de [freedom_tag.GetName] declaró ahora que como griegos libres se les debe permitir dirigir su propio destino y que ya no necesitan nuestra protección."
 diadochi_flavor.37.a:0 "¡Esto significa guerra!"
 diadochi_flavor.37.b:0 "Son libres de irse."
 diadochi_flavor.38.t:0 "¡Guerra!"
 diadochi_flavor.38.desc:2 "Parece que todo lo que se ha dicho sobre la protección de los griegos libres no ha sido más que palabras vacías. Los $PRY_DYN_ADJ$ enviaron noticias de que están preparando sus ejércitos para forzarnos a la obediencia."
 diadochi_flavor.38.a:0 "¡El mundo se enterará de esta traición!"

 diadochi_flavor.39.t:0 "Traición a los ideales"
 diadochi_flavor.39.desc:2 "Los $PRY_DYN_ADJ$ traicionaron el sueño de un mundo griego libre al entrar en guerra con [freedom_tag.GetName], en lugar de dejar que busquen su propio destino como país libre.\n\nEsto es muy preocupante."
 diadochi_flavor.39.a:0 "En efecto, es preocupante."

 diadochi_flavor.40.t:2 "Vulnerabilidades $PRY_DYN_ADJ$"
 diadochi_flavor.40.desc:2 "Las riñas de los demás diádocos continúan y vuelven a sumir al mundo helénico en el caos.\n\nHasta ahora hemos elegido distanciarnos, pero nuestros generales están de acuerdo en que podríamos aprovechar la atención dividida de los $PRY_DYN_ADJ$. Incluso tal vez podamos llegar a algún acuerdo con los $PRY_DYN_ADJ$ mientras están ocupados en Grecia."
 diadochi_flavor.40.a:2 "Tendremos que enseñarles a los $PRY_DYN_ADJ$ cuál es su lugar."
 diadochi_flavor.40.b:0 "Traigan a los escribas."
 offer_will_be_sent_tre:2 "Se enviará una oferta para el intercambio de [GetCountry('PRY').GetAdjective|Y] territorio.#!\nSi #R se niegan#!:"
 diadochi_flavor.40.c:0 "Somos más fuertes cuando estamos en paz..."

 diadochi_flavor.41.t:1 "Lisímaco hace su jugada"
 diadochi_flavor.41.desc:2 "A pesar de ser el más débil de los estados diádocos, la satrapía tracia lanzó una invasión bastante sorpresiva sobre las posesiones $PRY_DYN_ADJ$ en el noroeste de Asia, lo que abrió un frente en el norte para la dinastía $PRY_DYN$.\n\nNo hay duda de que el mismo Alejandro estaría sorprendido de ver lo mucho que han durado sus juegos funerarios."
 diadochi_flavor.41.a:0 "Los hombres somos unos seres miserables."

 diadochi_flavor.42.t:1 "Guerra con Tracia"
 diadochi_flavor.42.desc:1 "Ahora que nuestra atención está dividida, los traicioneros alkimachides aprovecharon la oportunidad para volverse a unir al conflicto. Los ejércitos de Tracia marchan sobre Asia y complican mucho más circunstancias ya difíciles..."
 diadochi_flavor.42.a:0 "Cobardes."
 diadochi_flavor.42.at:1 "#Y [GetCountry('PRY').GetName]#! @[GetCountry('PRY').GetFlag] ahora está en guerra con #Y [GetCountry('TRE').GetName]#! @[GetCountry('TRE').GetFlag]."
 diadochi_flavor.43.t:0 "Trato alkimachide"
 diadochi_flavor.43.desc:1 "Ahora que nuestra atención está dividida entre los otros sucesores, la insignificante satrapía de Lisímaco tuvo el descaro de exigir que les trasfiriéramos nuestras tierras en el oeste de Bitinia o que nos atengamos a una invasión desde el norte.\n\nA cambio de que les permitamos dominar el norte, ellos acordarán una generosa tregua, lo que nos dará tiempo de concentrarnos en derrotar Casandro..."
 diadochi_flavor.43.a:0 "Ya nos estamos ocupando de demasiados asuntos a la vez."
 diadochi_flavor.43.b:0 "¡Buitres miserables!"

 diadochi_flavor.44.t:2 "Concesiones $PRY_DYN_ADJ$"
 diadochi_flavor.44.desc:2 "Para sorpresa de todos, ¡nuestro trato con los [GetCountry('PRY').GetAdjective] ha sido aceptado! Deben estar desesperados por ceder tan fácilmente a nuestras amenazas.\n\nSu sombrío enviado ha aceptado ceder su territorio en el noroeste [GetProvince('(int32)290').GetArea.GetRegion.GetName], a cambio de una tregua, mientras ellos acaban con [GetCharacter('(int32)32').GetPraenomen] y los de su calaña en Macedonia."
 diadochi_flavor.44.a:0 "¡Increíble!"

 diadochi_flavor.45.t:0 "Trato rechazado"
 diadochi_flavor.45.desc:2 "Los $PRY_DYN_ADJ$ rechazaron nuestra oferta, lo que hace que la guerra en Asia sea inminente una vez más."
 diadochi_flavor.45.a:0 "No es ninguna sorpresa."

 diadochi_flavor.46.t:0 "¿Libertad?"
 diadochi_flavor.46.desc:0 "Nuestro señor supremo se alejó de esta región y entregó sus fortalezas a una facción opuesta de Diadochi. Un emisario llegó hoy de la corte de los [GetCountry('PRY').GetAdjective], casi como una ocurrencia tardía en esta apresurada retirada general, para hacernos saber que ya no disfrutaremos de ninguna protección ni se espera que paguemos ningún tipo de tributo."
 diadochi_flavor.46.a:0 "Somos libres, pero ¿estamos a salvo?"

 diadochi_flavor.47.t:2 "Concesiones $PRY_DYN_ADJ$ a Tracia"
 diadochi_flavor.47.desc:2 "Los murmullos en el ágora han confirmado que los [GetCountry('PRY').GetAdjective], presionados por todos lados, han abandonado sus posesiones en el noroeste [GetProvince('(int32)290').GetArea.GetRegion.GetName] para [GetCharacter('(int32)41').GetPraenomen] intercambiar una larga tregua.\n\nLos [GetCountry('PRY').GetAdjective] deben estar en apuros para aceptar un trato tan humillante con el Diadochi más débil de todos..."
 diadochi_flavor.47.a:0 "Eso sí que es inesperado."
 transfer_phrygian_lands_tre_tt:3 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetAdjective|Y] tierras y súbditos en [GetProvince('(int32)283').GetArea.GetName|Y], [GetProvince('(int32)292').GetArea.GetName|Y], [GetProvince('(int32)254').GetArea.GetName|Y], [GetProvince('(int32)278').GetArea.GetName|Y], [GetProvince('(int32)244').GetArea.GetName|Y] y [GetProvince('(int32)329').GetArea.GetName|Y], y [GetProvince('(int32)207').GetArea.GetName|Y] son cedidos a @[GetCountry('TRE').GetFlag]! [GetCountry('TRE').GetName|Y]."

 diadochi_flavor.48.t:0 "Concesiones a Tracia"
 diadochi_flavor.48.desc:0 "[GetCountry('PRY').GetAdjective] los reveses han permitido al Reino [GetCountry('TRE').GetAdjective] reclamar Asia Menor, apoderándose de las ciudades a lo largo del Propontis en el proceso...\n\nLa Liga Eólica fue una vez una confederación flexible de ciudades unidas por una historia compartida y una defensa mutua. Sin embargo, con las guerras de los Diadochi asolando el continente, el vínculo que conecta nuestras ciudades se ha debilitado. Mitilene, protegida por el mar, sigue siendo más segura que Elaia, que se encuentra expuesta a las ambiciones de los conquistadores.\n\nMientras los grandes sucesores compiten por la supremacía, está claro que el continente seguirá envuelto en un conflicto durante mucho tiempo. Quizás haya llegado el momento de que Lesbos se distancie formalmente de las luchas de Aeolis. Si actuamos con rapidez, podremos convencer a nuestros señores alkimachid de que reafirmen la autonomía de Lesbos antes de que el caos de la guerra nos envuelva por completo."
 diadochi_flavor.48.a:0 "Protectores en serio..."
 diadochi_flavor.48.at:0 "#G ¡Nuestra propuesta será enviada a @[GetCountry('TRE').GetFlag]!  [GetCountry('TRE').GetCapital.GetName|Y] en las próximas semanas#!\nSi tenemos éxito, sucederá lo siguiente:\n #G Desbloquear#! #E Lesbianas#! tareas para el #E #T Resurgimiento Jónico#! Árbol de misiones#!"
 diadochi_flavor.48.b:0 "No podemos abandonar Aeolis."

 LESBOS_NAME:0 "Lesbos"
 LESBOS_ADJ:0 "Lesbino"
 opinion_phrygia_despotic:0 "La tiranía contra los griegos"

 diadochi_flavor_49_intro:1 "La muerte de [GetCharacter('(int32)37').GetPraenomen], sumada a unos recientes contratiempos, fracturó la estabilidad del reino del cíclope."
 diadochi_flavor.49.desc_1:0 "$diadochi_flavor_49_intro$ Sin embargo, [antigonids_scope.GetRuler.GetPraenomen], su heredero y cogobernante, prometió mantener el reino unido, incluso a pesar de la deserción de los gobiernos locales de los diádocos más próximos y el desmoronamiento del apoyo en sus propiedades restantes."
 diadochi_flavor.49.desc_2:0 "$diadochi_flavor_49_intro$ [antigonids_scope.GetRuler.GetPraenomen], su heredero y cogobernante, incapaz de mantener las moribundas lealtades de sus súbditos, abandonó gran parte del reino por los reclamos de los otros diádocos y se retiró para lamerse las heridas junto a sus amigos griegos."
 diadochi_flavor.49.desc_3:0 "\n\n Nuestras fuerzas han avanzado hacia Canaán, asegurando el control de la región en disputa y sus potentados locales hasta Siria - lo que sin duda irritará [GetCountry('SEL').GetAdjective] los ánimos - aunque las ciudades fenicias y la guarnición de la ciudad isleña de Tyros siguen siendo leales a los Antigónidas por ahora...\n\nTambién están llegando informes de que las fuerzas Antigónidas guarnecen el largo la disputada isla de Chipre, que Antígono defendió tan obstinadamente de nuestros avances, han huido y que varios chipriotas leales están aprovechando la distracción para restablecer el control de la isla."
 diadochi_flavor.49.desc_4:0 "\n\nNuestras fuerzas avanzaron en Palestina y aseguraron el control de la región en disputa y de sus potentados hasta Siria, lo cual sin duda alguna calentará los ánimos [GetCountry('SEL').GetAdjective]. Sin embargo, las ciudades fenicias y la guarnición de la ciudad isleña de Tiro siguen siendo leales a los antigónidas, por ahora..."
 diadochi_flavor.49.a:0 "Deja que huyan."
 diadochi_flavor.49.bt:0 "Los territorios antigónidos en [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)244').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)418').GetArea.GetRegion.GetName|Y] y [GetProvince('(int32)331').GetArea.GetName|Y] pueden dividirse #R entre otros Diadochi#!."
 diadochi_flavor.49.tt1:1 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetAdjective] [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y] $diadochi_flavor_have_been_seized$"
 diadochi_flavor.49.tt2:1 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetAdjective] [GetProvince('(int32)331').GetArea.GetName|Y] $diadochi_flavor_have_been_seized$"
 diadochi_flavor.49.tt3:2 "@[antigonids_scope.GetFlag]! #E [antigonids_scope.GetAdjective]#! sujetos en [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y] $diadochi_flavor_become_our_subjects$"

 diadochi_flavor.50.desc_3:1 "\n\nSu determinación no vale de mucho frente a las deserciones de aquellos que [GetCharacter('(int32)37').GetPraenomen] designó para vigilar la satrapía que [GetCharacter('(int32)39').GetPraenomen] estableció hace tantos años. Está claro que [GetCountry('TRE').GetRuler.GetPraenomen] es quien unirá a los macedonios de occidente."
 diadochi_flavor.50.desc_4:1 "\n\nEn medio del caos, los notarios provinciales asiáticos nos juraron su lealtad, y, por lo tanto, también el dominio sobre las propiedades originales de [GetCharacter('(int32)37').GetPraenomen] en [GetProvince('(int32)1936').GetArea.GetRegion.GetName] concedidas por [GetCharacter('(int32)39').GetPraenomen] Magno. De esta manera, extendimos nuestra influencia a través del Bósforo hasta [GetProvince('(int32)244').GetArea.GetRegion.GetName] y más allá."
 diadochi_flavor.50.a:0 "Al fin, el Bósforo es nuestro."
 diadochi_flavor.50.tt1:1 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetAdjective] [GetProvince('(int32)244').GetArea.GetRegion.GetName|Y] $diadochi_flavor_have_been_seized$"
 diadochi_flavor.50.tt2:1 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetAdjective] [GetProvince('(int32)1799').GetArea.GetRegion.GetName|Y] $diadochi_flavor_have_been_seized$"
 diadochi_flavor.50.tt3:1 "Continente oriental @[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetAdjective] [GetProvince('(int32)1883').GetArea.GetRegion.GetName|Y] $diadochi_flavor_have_been_seized$"
 diadochi_flavor.50.tt4:1 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetAdjective] [GetProvince('(int32)1799').GetArea.GetRegion.GetName|Y] se liberará como satrapía."
 diadochi_flavor.50.tt5:2 "@[antigonids_scope.GetFlag]! Se publicarán #E [antigonids_scope.GetAdjective]#! sujetos en [GetProvince('(int32)1799').GetArea.GetRegion.GetName|Y]."
 diadochi_flavor.50.tt6:2 "@[antigonids_scope.GetFlag]! #E [antigonids_scope.GetAdjective]#! sujetos en [GetProvince('(int32)244').GetArea.GetRegion.GetName|Y] y [GetProvince('(int32)252').GetArea.GetName|Y], excepto [GetCountry('IOA').GetName|Y], $diadochi_flavor_become_our_subjects$"
 diadochi_flavor.50.tt7:2 "#E Sardis#! se convierte en una #Y Satrapía#! de [THIS.GetCountry.GetName]."
 diadochi_flavor.50.tt8:2 "#E Frigia#! se convierte en una #Y Satrapía#! de [THIS.GetCountry.GetName]."
# diadochi_flavor.50.tt7:2 "#Y Sardis#! satrapy forms in [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y], led by [phoenix_scope.GetName|Y]."
# diadochi_flavor.50.tt8:2 "#Y Phrygia#! satrapy forms in [GetProvince('(int32)1936').GetArea.GetRegion.GetName|Y], led by [dokimos_scope.GetName|Y]."
 diadochi_flavor.50.tt9:0 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetAdjective] [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y] $diadochi_flavor_have_been_seized$"
 diadochi_flavor.51.desc_3:0 "\n\nLa terquedad de los antigónidas frente a las abrumadoras probabilidades es lamentable, pero nuestras fuerzas ya se están moviendo para asegurar las antiguas tierras interiores del Éufrates."
 diadochi_flavor.51.desc_4:1 "\n\nEn las negociaciones con los otros diádocos dejamos claro nuestro reclamo de [GetProvince('(int32)790').GetArea.GetRegion.GetName] y de la nueva capital de [GetCharacter('(int32)37').GetPraenomen], y nuestros administradores ya se están asegurando de que los gobernantes locales de estas tierras acepten la autoridad [GetCountry('SEL').GetAdjective]."
 diadochi_flavor.51.tt1:1 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetAdjective] [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y] $diadochi_flavor_have_been_seized$"
 diadochi_flavor.51.tt2:1 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetAdjective] [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y] $diadochi_flavor_have_been_seized$"
 diadochi_flavor.51.tt3:2 "@[antigonids_scope.GetFlag]! #E [antigonids_scope.GetAdjective]#! sujetos en [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y] y [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y] $diadochi_flavor_become_our_subjects$"
 diadochi_flavor.51.tt4:1 "@[GetCountry('PRY').GetFlag]! [GetCountry('PRY').GetAdjective] [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y] $diadochi_flavor_have_been_seized$"
 diadochi_flavor.51.tt5:3 "@[antigonids_scope.GetFlag]! #E [antigonids_scope.GetAdjective]#! sujetos en [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y] y [GetProvince('(int32)1799').GetArea.GetRegion.GetName|Y] $diadochi_flavor_become_our_subjects$"
 diadochi_flavor.51.a:0 "Se está apostando mucho en el juego del imperio."
 diadochi_flavor_become_our_trib:0 "se convirtieron en nuestros tributarios."
 diadochi_flavor_become_our_subjects:0 "se transferirá a nosotros."

 #diadochi_flavor.52 =  diadochi_flavor.60 (Macedon post Ipsos)
 diadochi_flavor_have_been_seized:0 "será tomada."

 diadochi_flavor.53.a:0 "La suerte es una amiga caprichosa..."
 diadochi_flavor.53.at:1 "Otros estados diádocos dividieron @[antigonids_scope.GetFlag]! [antigonids_scope.GetName|Y]."

 diadochi_flavor.54.t:0 "[pleistarchus_scope.GetPraenomen] de [pleistarchus_satrapy.GetName]"
 diadochi_flavor.54.desc_01:0 "Aunque Macedonia lleva mucho tiempo reclamando #E Caria#!, se ha decidido que el gobierno de Caria y Cilicia se pondrá en manos de un tercero aparentemente neutral para que actúe como estado tapón entre los sucesores del norte y del este.\n\n"
 diadochi_flavor.54.desc_02:0 "¡Macedonia reclamó @[pleistarchus_satrapy.GetFlag]! [pleistarchus_satrapy.GetName|Y] en la reciente división del [GetCountry('PRY').GetAdjective] botín, abriendo una brecha entre los sucesores del norte y del este.\n\n"
 diadochi_flavor.54.desc_1:1 "Parece que [GetCharacter('(int32)32').GetPraenomen] fue convencido o presionado por [pleistarchus_scope.GetPraenomen], su leal hermano y general, para que le concediera su gobierno para sí mismo, con casi total independencia."
 diadochi_flavor.54.desc_2:0 "La provincia ahora ha sido reservada para que [pleistarchus_scope.GetPraenomen], un notable cortesano macedonio y un general leal con experiencia en la región, gobierne [pleistarchus_satrapy.GetName] con amplia autonomía."
 diadochi_flavor.54.a:0 "Seguiremos la carrera de [pleistarchus_scope.GetPraenomen] con gran interés..."
 diadochi_flavor.54.at:1 "@[pleistarchus_satrapy.GetFlag]!  [pleistarchus_satrapy.GetName|Y] se ha alineado con [GetCountry('MAC').GetName|Y]"
 diadochi_flavor.54.b:0 "Me pregunto qué le deparará el futuro a [pleistarchus_scope.GetPraenomen]..."
 diadochi_flavor.54.bt:0 "#R ¡Etiquetaremos el cambio a @[pleistarchus_satrapy.GetFlag]!  #Y [pleistarchus_satrapy.GetName]#!#!"


 diadochi_flavor.55.t:0 "Vientos de cambio"
 diadochi_flavor.55.desc:0 "El avance de la lucha entre los reinos diádocos, incluyendo a nuestros amos en el reino [antigonids_scope.GetAdjective], nos dejó sin nuestros antiguos benefactores.\n\n"
 diadochi_flavor.55.desc_1:0 "Los administradores [transferred_subject.GetOverlord.GetAdjective] aseguraron rápidamente nuestro sometimiento siguiendo las líneas de nuestra anterior relación de subordinación..."
 diadochi_flavor.55.desc_2:0 "Ahora debemos encargarnos de nuestra propia supervivencia y debemos tener cuidado al maniobrar por el nuevo paisaje político..."
 diadochi_flavor.55.a:0 "Los débiles deben hacer lo que se les ordena."
 diadochi_flavor.55.at:0 "Ya no somos súbditos de [antigonids_scope.GetName|Y] @[antigonids_scope.GetFlag]!"

 diadochi_flavor.56.t:0 "Deserción del pueblo [attalid_head.GetFamilyDisplayAdjective]"
 diadochi_flavor.56.desc:0 "Parece que nuestros últimos contratiempos provocaron que incluso los nobles de confianza reconsideren sus lealtades y planes para el futuro.\n\n"
 diadochi_flavor.56.desc_1:1 "Los ambiciosos atálidos, que consiguieron un gran protagonismo en el reino [GetCharacter('(int32)37').GetPraenomen] gracias el eunuco de [GetCharacter('(int32)385').GetPraenomen], abandonaron [thrace_scope.GetName] y ofrecieron su lealtad a [thrace_scope.GetRuler.GetPraenomen]..."
 diadochi_flavor.56.desc_2:0 "La importante dinastía [attalid_head.GetFamilyDisplayAdjective] huyó a la corte de [thrace_scope.GetRuler.GetPraenomen] en [thrace_scope.GetName] para jurar lealtad a nuestros enemigos..."
 diadochi_flavor.56.desc_3:1 "La importante dinastía [attalid_head.GetFamilyDisplayAdjective] despertó el apoyo popular en [GetProvince('(int32)290').GetArea.GetRegion.GetName] para fundar su propio reino en [pergamon_scope.GetCapital.GetName]!"
 diadochi_flavor.56.a:0 "¿Y qué? No se van a enterar de nada."
 diadochi_flavor.56.at1:0 "[attalid_head.GetName|Y] y su familia se mudaron a [GetCountry('TRE').GetName|Y].\nSe les puede conceder tierras para que las gobiernen."
 diadochi_flavor.56.at2:0 "[attalid_head.GetName|Y] fundó el reino de [pergamon_scope.GetName|Y]."

 diadochi_flavor.57.t:0 "[attalid_head.GetFamilyDisplayAdjective] Defección"

 diadochi_flavor.57.desc:1 "[GetCountry('PRY').GetAdjective] los reveses han fomentado la deserción de muchos notables frigios que ven la escritura en la pared para el reino de Antígono.\n\nUno de ellos [attalid_head.GetWomanMan] es [attalid_head.GetName], un miembro muy respetado de la antigua corte. Aprovechando la turbulenta situación, [attalid_head.GetPraenomen] busca aprovechar las fuertes conexiones locales de los [attalid_head.GetFamilyDisplayAdjective] para establecer [attalid_head.GetHerselfHimself] en Asia como gobernador, o incluso rey, de la antigua ciudad de Pérgamo.\n\n Pérgamo está bien posicionado para gobernar toda Asia Menor, gran parte de la cual permanece en manos de generales advenedizos con lealtades inciertas. [attalid_head.GetPraenomen] sostiene que sería conveniente consolidar la gobernanza de Asia en un solo par de manos. Un gobernante aliado y nominalmente independiente cuyas lealtades sean seguras podría servir como baluarte contra las ambiciones seléucidas en Anatolia."
 diadochi_flavor.57.a:0 "Basileos [attalid_head.GetPraenomen] suena muy bien."
 diadochi_flavor.57.at:0 "El #E [attalid_head.GetFamilyDisplayAdjective] Reino de #Y Pegamon#!#! ganará todos nuestros Territorios en #T Anatolia#!.\n#Y Pegamon#! se convertirá en #T Independiente#! y en un #Y El aliado#! de #Y [THIS.GetCountry.GetName]#!.\n#Y [attalid_head.GetName]#! se convertirá en el gobernante de #Y Pegamon#!"
 diadochi_flavor.57.sardis_1_tt:0 "#Y [sardis_scope.GetName]#! se incorporará al dominio de [attalid_head.GetPraenomen]."
 diadochi_flavor.57.phrygia_1_tt:0 "#Y [galatia_satrapy.GetName]#! se incorporará al dominio de [attalid_head.GetPraenomen]."
 diadochi_flavor.57.b:0 "[attalid_head.GetPraenomen] administrará Mysia y Lydia en nuestro nombre."
 diadochi_flavor.57.bt:0 "#Y Pérgamo#! ganará todos nuestros Territorios en [GetProvince('(int32)278').GetArea.GetName], [GetProvince('(int32)257').GetArea.GetName] y [GetProvince('(int32)254').GetArea.GetName].\n#Y Pérgamo#! se convertirá en una #Y Satrapía#! de #Y [THIS.GetCountry.GetName]#!.\n#Y [attalid_head.GetName]#! se convertirá en el gobernante de #Y Pérgamo#!"
 diadochi_flavor.57.c:0 "Será una herramienta útil, pero [attalid_head.GetPraenomen] no es un rey."
 diadochi_flavor.57.ct:0 "#Y [attalid_head.GetName]#! se convertirá en el gobernante de #Y Pérgamo#! y sus alrededores inmediatos\n#Y Pérgamo#! se convertirá en una #Y Satrapía#! de #Y [THIS.GetCountry.GetName]#!."
 diadochi_flavor.57.sardis_tt:0 "Reemplazaremos a [sardis_scope.GetRuler.GetFullName] en la satrapía de #Y $asia_region$#!."
 diadochi_flavor.57.d:0 "Esto me ha dado la idea más maravillosa..."
 diadochi_flavor.57.dt:0 "En los próximos meses, [THIS.GetCountry.GetRuler.GetPraenomen] elegirá si designa una #Y Satrapía#! de la Frigia Helespontina"
 diadochi_flavor.57.e:0 "Una buena sugerencia, pero no se puede confiar en [attalid_head.GetPraenomen]."
 diadochi_flavor.57.tt:0 "¡La familia [attalid_head.GetFamilyDisplayAdjective] ha llegado a @[THIS.GetCountry.GetFlag]! [THIS.GetCountry.GetName|Y]."

 diadochi_flavor.58.t:0 "Reino [attalid_head.GetFamilyDisplayAdjective]"
 diadochi_flavor.58.desc:1 "Como ratas que huyen de un trirreme que se hunde, la dinastía atálida, antes leal sirviente de los antigónidas, se estableció en [GetProvince('(int32)278').GetName] y se comprometió a gobernar la zona en nuestro nombre."
 diadochi_flavor.58.a:0 "¡Ja!"

 diadochi_flavor.59.t:1 "El ascenso de Pérgamo"
 diadochi_flavor.59.desc:2 "En la caótica lucha por [GetProvince('(int32)290').GetArea.GetRegion.GetName], la familia [attalid_head.GetFamilyDisplayAdjective] (nobles que anteriormente estaban al servicio de los Antigónidas) ha establecido un nuevo reino con base alrededor de Pérgamo en [GetProvince('(int32)278').GetArea.GetName]."
 diadochi_flavor.59.desc_subject:0 "\n\nParece que su presencia fue autorizada por [attalid_head.GetEmployer.GetOverlord.GetRuler.GetName] de [attalid_head.GetEmployer.GetOverlord.GetName], a quien la familia [attalid_head.GetFamilyDisplayAdjective] se supone que está sirviendo como gobernadora de la zona."
 diadochi_flavor.59.a:0 "Pérgamo, ¿eh?"
 diadochi_flavor.59.at:1 "Se ha creado #Y Pérgamo#!."

#New Diadochi Events
 diadochi_flavor.60.desc_1:1 "\n\nAunque no hemos podido aprovechar tanto estos acontecimientos como sus vecinos directos, nuestros soldados y partisanos aprovecharon la oportunidad para tomar el control de las [GetCountry('PRY').GetAdjective] guarniciones en el continente [GetProvince('(int32)418').GetArea.GetRegion.GetName] mientras se recuperaban de la noticia de la muerte de su rey..."
 diadochi_flavor.60.desc_2:1 "\n\n¡Ahora, con el tallado del cadáver del Reino Antigónida, las satrapías de @[caria_satrapy.GetFlag]! #E Caria#! y @[cilicia_satrapy.GetFlag]! [GetProvince('(int32)1883').GetArea.GetRegion.GetName] se encuentran en un estado liminal y quizás podrían caer bajo nuestra influencia. Sin embargo, dada su posición geográfica, estas satrapías suponen una zona difícil de controlar para nuestro reino. [pleistarchus_scope.GetName] ha estado citando obstinadamente [pleistarchus_scope.GetHerHis] historial de lealtad y la distancia de las provincias para justificar su nombramiento como nuestro sátrapa en la región... Si se le diera todo lo que [pleistarchus_scope.GetSheHe] desea, [pleistarchus_scope.GetPraenomen] estaría en condiciones de forjar [pleistarchus_scope.GetHerHis] su propio reino. Una alianza con un reino tapón estratégicamente ubicado ciertamente ayudaría a estabilizar nuestra posición en la región y al mismo tiempo mitigaría la mayor parte de nuestro riesgo personal, aunque podemos llegar a arrepentirnos de haber cedido estos logros."
 diadochi_flavor.60.desc_3:0 "\n\nAunque no hemos podido sacar provecho terrestre directamente de este giro de los acontecimientos, la llegada de la desgracia a las Antigónidas siempre es bienvenida..."
 diadochi_flavor.60.desc_4:0 "\n\nNuestros soldados y partisanos aprovecharon la oportunidad para tomar el control de las [GetCountry('PRY').GetAdjective] guarniciones en el continente [GetProvince('(int32)418').GetArea.GetRegion.GetName] mientras se recuperaban de la noticia de la muerte de su rey..."
 diadochi_flavor.60.desc_5:0 "\n\nAunque no pudimos expulsar a las [GetCountry('PRY').GetAdjective] guarniciones en el continente [GetProvince('(int32)418').GetArea.GetRegion.GetName], la llegada de la desgracia a las Antigónidas siempre es bienvenida..."
 diadochi_flavor.60.desc_6:0 ""
# diadochi_flavor.60.a:0 "Caria will be reorganized into the Chrysaoric League."
# diadochi_flavor.60.at:0 "[pleistarchus_scope.GetName] will be granted autonomous rule of @[caria_satrapy.GetFlag]!  #Y Caria#! as the Megas Hierophant of the #Y Chrysaoric League#!."
 diadochi_flavor.60.b:0 "Bueno, Caria necesita un sátrapa..."
 diadochi_flavor.60.bt:0 "¡A [pleistarchus_scope.GetName] se le concederá la regla de @[caria_satrapy.GetFlag]!  #Y Caria#! como [THIS.GetCountry.GetAdjective] sátrapa"
 diadochi_flavor.60.c:0 "[pleistarchus_scope.GetPraenomen] tendrá Cililica."
 diadochi_flavor.60.ct:0 "¡A [pleistarchus_scope.GetName] se le concederá la regla de @[cilicia_satrapy.GetFlag]!  #Y Cilicia#! como [THIS.GetCountry.GetAdjective] sátrapa"
 diadochi_flavor.60.d:0 "[pleistarchus_scope.GetPraenomen] sería más útil como aliado que como súbdito."
 diadochi_flavor.60.dt:0 "¡[pleistarchus_scope.GetName] se convertirá en el sátrapa independiente de ambos @[caria_satrapy.GetFlag]! #Y Caria#! y @[cilicia_satrapy.GetFlag]! #Y Cilicia#!."
 diadochi_flavor.60.e:0 "¡Ay de los vencidos!"

 #Superceeded by .68 and .69
 diadochi_flavor.61.t:0 "Satrapía de [ptolemy_new_satrapy.GetName]"
 diadochi_flavor.61.desc:0 "Con la contracción del Reino Antigónida, innumerables pretendientes, como buitres ante un cadáver, han intentado dimensionar el título de Sátrapa de [ptolemy_new_satrapy.GetName]. Afortunadamente para nosotros, [ptolemy_new_satrapy.GetRuler.GetName], un fiel seguidor de [ROOT.GetCountry.GetRuler.GetName], ha salido victorioso. [ptolemy_new_satrapy.GetRuler.GetPraenomen] parece dispuesto, pero reacio, a entregar sus recién adquiridas ganancias a [ROOT.GetCountry.GetRuler.GetPraenomen], después de haber enviado enviados a [ROOT.GetCountry.GetCapital.GetName], pidiendo a [ROOT.GetCountry.GetRuler.GetPraenomen] que confirme la posición de [ptolemy_new_satrapy.GetRuler.GetHerHis] como sátrapa de [ptolemy_new_satrapy.GetName]. Los embajadores, obstinadamente citan [ptolemy_new_satrapy.GetRuler.GetHerHis] la lealtad y la distancia de las provincias para justificar [ptolemy_new_satrapy.GetRuler.GetPraenomen] el nombramiento de nuestro sátrapa en [ptolemy_new_satrapy.GetName]. Su propuesta no carece de mérito ya que, dada su posición geográfica, [ptolemy_new_satrapy.GetName] plantea ser un área difícil de controlar para nuestro imperio."
 diadochi_flavor.61.a:0 "@[ptolemy_new_satrapy.GetFlag]!  [ptolemy_new_satrapy.GetName] será suyo para tenerlo y conservarlo."
 diadochi_flavor.61.b:0 "@[ptolemy_new_satrapy.GetFlag]!  [ptolemy_new_satrapy.GetName] no necesita un sátrapa."
 diadochi_flavor.61.bt:0 "@[ptolemy_new_satrapy.GetFlag]!  [ptolemy_new_satrapy.GetName] será #R anexado#! y [ptolemy_new_satrapy.GetRuler.GetName] se unirá a nuestro tribunal."

 #Not used
 diadochi_flavor.62.t:0 "Concesiones a [GetCountry('TRE').GetName]"
 diadochi_flavor.62.desc:0 "Hogar de las ruinas de la legendaria ciudad de Troya, las ciudades griegas de Tróade han prosperado durante mucho tiempo gracias a su posición estratégica a lo largo del Helesponto, con fuertes raíces mercantiles y acceso a rutas comerciales clave entre Europa y Asia. Las principales ciudades de la región, Ilion, Dardanos, Skepsis, Assos, Alejandría de Troas, Abydos y Lampsakos, han estado tradicionalmente unidas en el Koinon de Atenea Ilias, una liga religiosa y política formada bajo la dirección de Antígono I Monoftalmos. Esta liga se estableció para administrar el festival anual Panathenaia en el santuario sagrado de Atenea Ilias en Troya, un poderoso símbolo de unidad y herencia compartida para las ciudades de la región.\n\n Ahora, los enviados [GetCountry('PRY').GetAdjective] nos han informado que, como parte de un acuerdo con el reino Alkimachid de Tracia, han acordado que [ROOT.GetCountry.GetName] se convierta en un #E Dependencia de Alkimachid#!."
 diadochi_flavor.62.a:0 "¡Parece que tenemos un nuevo dios-rey!"

 nearchos_description:0 "Aunque #E cretense#! de nacimiento, [GetCharacter('(int32)71').GetPraenomen], creció en [GetCountry('MAC').GetName] y fue uno de los amigos de la infancia de [GetCharacter('(int32)32').GetPraenomen], siendo exiliado junto con Ptolomeo y otros después de presionar a Alexandros para que intentara casarse con la hija de #E Pixodarus#! en violación de #E Phillip#! deseos. [GetCharacter('(int32)71').GetPraenomen] y los demás fueron retirados después de la muerte de Phillip. Poco después, #E Alexandros#! nombró a [GetCharacter('(int32)71').GetPraenomen] #E sátrapa#! de #E Licia#! y #E Panfilia#!. En 326 a. C., [GetCharacter('(int32)71').GetPraenomen] fue nombrado almirante de la flota que Alejandro había construido en el #E Hidaspes#!. La flota avanzó triunfalmente por el #E Hydaspes#!, acompañada por el ejército de [GetCharacter('(int32)32').GetPraenomen] durante un tiempo antes de continuar sin las fuerzas terrestres y capturar innumerables pueblos indios. Finalmente, [GetCharacter('(int32)71').GetPraenomen] fue enviado a Arabia en preparación para futuras conquistas antes de volverse para contarle a Alexandros lo que había aprendido. [GetCharacter('(int32)71').GetPraenomen] probablemente habría tenido en cuenta los planes de [GetCharacter('(int32)32').GetPraenomen] para conquistar #E Arabia#! y #E Cartago#!, pero estos planes quedaron truncados por la muerte del rey. Quizás más que cualquier otro, [GetCharacter('(int32)71').GetPraenomen] sufrió una gran disminución de estatus tras la muerte de #E Alexandros#!, uniéndose a la corte de [GetCharacter('(int32)37').GetPraenomen] después de invocar la ira de #E Perdiccas#!."

 diadochi_flavor.63.t:0 "Nearchos de Creta"
 diadochi_flavor.63.desc:0 "$nearchos_description$\n\nIt appears that [GetCharacter('(int32)71').GetPraenomen] kept a detailed accounting of his experiences. Now that he has retired from his role as #E Demetrius'#! advisor, [GetCharacter('(int32)71').GetPraenomen] has had time to compile them into a text detailing #E India's#! frontiers, size, population, castes, fauna, flora, cultures, and militaries.\n\n[GetCharacter('(int32)71').GetPraenomen] ha sugerido que la versión que los escribas macedonios han copiado omite detalles clave que serían invaluables para cualquiera que busque reunir el imperio de [GetCharacter('(int32)39').GetPraenomen]. Estos secretos podrían ser nuestros, pero tienen un alto costo. [GetCharacter('(int32)71').GetPraenomen] desea ser 'justamente compensado' por el arduo trabajo que ha supuesto la elaboración de este texto, de esta #E Indike.#!"
 diadochi_flavor.63.a:0 "[GetCharacter('(int32)71').GetPraenomen] merece ser recompensado por sus esfuerzos."
 diadochi_flavor.63.b:0 "¿Qué utilidad le daríamos a una obra así?"
 diadochi_flavor.63.bt:0 "#R Nearchos puede desertar y unirse a otro de nuestros compañeros Diadochi en busca de un benefactor#!"

 diadochi_flavor.64.t:0 "Nearchos de Creta"
 diadochi_flavor.64.desc:0 "$nearchos_description$\n\nParece que Antígono ha entrado en conflicto con Nearcos, descartando el valor de '#E Indike,#!' de Nearthos, un relato de sus experiencias que Nearchos escribió después de retirarse de su papel como asesor de #E Demetrius#!. El '#E Indike,#!' detalla información sobre #E las #! fronteras, tamaño, población, castas, fauna, flora, culturas y ejércitos de la India.\n\n[GetCharacter('(int32)71').GetPraenomen] ha sugerido que la versión que los escribas macedonios han copiado omite detalles clave que serían invaluables para cualquiera que busque reunir el imperio de [GetCharacter('(int32)39').GetPraenomen]. Estos secretos podrían ser nuestros, pero tienen un alto costo. [GetCharacter('(int32)71').GetPraenomen] desea ser 'justamente compensado' por el arduo trabajo que ha supuesto la elaboración de este texto, de esta #E Indike.#!"
 diadochi_flavor.64.a:0 "[GetCharacter('(int32)71').GetPraenomen] merece ser recompensado por sus esfuerzos."
 diadochi_flavor.64.at:0 "Nearchos entrará a nuestro servicio"
 diadochi_flavor.64.b:0 "¿Qué utilidad le daríamos a una obra así?"
 diadochi_flavor.64.bt:0 "#R Nearchos puede intentar encontrar otro benefactor entre nuestros compañeros Diadochi#!"

 treasure_indike_manuscript:0 "Manuscrito indio"
 treasure_indike_manuscript_desc:0 "Este sencillo pergamino es el relato original escrito a mano del almirante Nearchos, su arduo viaje desde la desembocadura del río Indo en la India hasta el Golfo Pérsico. El almirante Nearchus, en quien Alexandros confiaba, escribió una historia de sus grandes viajes y una descripción del subcontinente indio tal como lo experimentó. Se han difundido ampliamente copias de su obra el 'Indike', pero este manuscrito original contiene detalles omitidos en estas réplicas."

 iasos_description:0 "Fundada por colonos griegos de Argos en el siglo IX a. C., [GetProvince('(int32)275').GetName] está estratégicamente situada en una pequeña isla frente a la costa de Caria, que más tarde se conectó con el continente. Conocido por su puerto estratégico y sus ricos caladeros, [GetProvince('(int32)275').GetName] prosperó, ganando riqueza y prominencia por su distintivo \"mármol isiano\" rojo y blanco, extraído de las colinas cercanas. \n\nEn 309 a. C., [GetProvince('(int32)275').GetName] firmó un tratado que estipula que [GetProvince('(int32)275').GetName] tendrá buena disposición para Ptolemaio y será un aliado para él. Y sus descendientes para siempre, siendo libres y autónomos y sin guarnición y exentos de tributo. Esto proporcionó al Reino Ptolemaico un punto de apoyo crucial en Caria. Sin embargo, las relaciones entre [GetProvince('(int32)275').GetName] y el Reino Ptolemaico se vieron interrumpidas por la intervención de Demetrios en la zona y la desastrosa derrota naval en Salamina."

 diadochi_flavor.65.t:0 "La isla de mármol"
 diadochi_flavor.65.desc:0 "$iasos_description$\n\nAhora el representante ptolemaico recién instalado en la región, [aristoboulos_scope.GetName] ha exigido que renunciemos a nuestro control sobre [GetProvince('(int32)275').GetName] y nos aliemos para convertirnos en un 'aliado independiente' del Reino ptolemaico una vez más."
 diadochi_flavor.65.a:0 "¡No cederemos ni un centímetro!"
 diadochi_flavor.65.at:0 "El #Y Reino Ptolemaico#! obtendrá derechos sobre #E Iasos#! y #E Caria#!."
 diadochi_flavor.65.b:0 "Los débiles deben hacer lo que se les dice."
 diadochi_flavor.65.bt:0 "¡La autoridad sobre [GetProvince('(int32)275').GetName] se entregará al #Y Reino Ptolemaico#! @[GetCountry('EGY').GetFlag]!"

 IAS: "$IASOS_NAME$"
 IASOS_NAME:0 "Iasos"
 IASOS_ADJECTIVE:0 "isiano"
 free_iasos_bad:0 "Subyugación de Iasos"
 free_iasos_good:0 "Liberación de Iasos"

 diadochi_flavor.66.t:0 "La isla de mármol"
 diadochi_flavor.66.desc:0 "$iasos_description$\n\nAhora que el poder antigónida en la región ha disminuido, nuestro representante en Caria, [aristoboulos_scope.GetName], ha hecho arreglos para que [GetProvince('(int32)275').GetOwner.GetName] nos ceda la autoridad sobre [GetProvince('(int32)275').GetName] para que pueda convertirse en un \"aliado independiente\" del Reino Ptolemaico una vez más."
 diadochi_flavor.66.tt:0 "El #Y Reino Ptolemaico#! obtiene derechos sobre #E Iasos#! y #E Caria#!."
 diadochi_flavor.66.a:0 "Nuestra alianza será restaurada."
 diadochi_flavor.66.at:0 "#Y $IASOS_NAME$#! será liberado como un sujeto #Y Feudatorio#!."
 diadochi_flavor.66.b:0 "'Independiente', ¡qué chiste!"
 diadochi_flavor.66.bt:0 "Cada #Y $hellenic$#! país en las regiones de #Y Grecia#! y #Y Asia#! perderá #R -25#! Opinión sobre nosotros."
 diadochi_flavor.66.c:0 "[GetProvince('(int32)275').GetName] pertenece a sus hermanos carios."
 diadochi_flavor.66.ct:0 "Esta opción es #Y exclusiva#! porque Caria es nuestra satrapía."

 diadochi_flavor.67.t:0 "La isla de mármol"
 diadochi_flavor.67.desc:0 "$iasos_description$\n\nAhora que el poder antigónida en la región ha disminuido, nuestro representante en Caria, [aristoboulos_scope.GetName], negoció con [GetProvince('(int32)275').GetOwner.GetName] para cedernos la autoridad sobre [GetProvince('(int32)275').GetName] para que pueda convertirse en un \"aliado independiente\" del Reino Ptolemaico una vez más. Sin embargo, los viles [GetProvince('(int32)275').GetOwner.GetAdjective] han rechazado nuestros avances. Parece que Caria debe ser liberada a la fuerza..."
 diadochi_flavor.67.a:0 "Esperaremos nuestro momento."
 diadochi_flavor.67.at:0 "El #Y Reino Ptolemaico#! obtiene derechos sobre #E Iasos#! y #E Caria#!."

#Used in .68 and .69 as the generic description
 diadochi_flavor.68.desc_0:0 "Con la contracción del Reino Antigónida, innumerables pretendientes, como buitres ante un cadáver, han intentado dimensionar el título de Sátrapa de [ptolemy_new_satrapy.GetName]. Afortunadamente para nosotros, [ptolemy_new_satrapy.GetRuler.GetName], un fiel seguidor de [ROOT.GetCountry.GetRuler.GetName], ha salido victorioso. [ptolemy_new_satrapy.GetRuler.GetPraenomen] parece dispuesto, pero reacio, a entregar sus recién adquiridas ganancias a [ROOT.GetCountry.GetRuler.GetPraenomen], después de haber enviado enviados a [ROOT.GetCountry.GetCapital.GetName], pidiendo a [ROOT.GetCountry.GetRuler.GetPraenomen] que confirme la posición de [ptolemy_new_satrapy.GetRuler.GetHerHis] como sátrapa de [ptolemy_new_satrapy.GetName]. Los embajadores, obstinadamente citan [ptolemy_new_satrapy.GetRuler.GetHerHis] la lealtad y la distancia de las provincias para justificar [ptolemy_new_satrapy.GetRuler.GetPraenomen] el nombramiento de nuestro sátrapa en [ptolemy_new_satrapy.GetName]. Su propuesta no carece de mérito ya que, dada su posición geográfica, [ptolemy_new_satrapy.GetName] plantea ser un área difícil de controlar para nuestro imperio."
 loyalty_very_grateful_governor:0 "Gobernador agradecido"
 loyalty_rewarded_supporter:0 "Partidario recompensado"

 diadochi_flavor.68.t:0 "Sátrapa de Caria"
 diadochi_flavor.68.desc:0 "Con la contracción del Reino Antigónida, innumerables pretendientes, como buitres ante un cadáver, han intentado dimensionar Caria. Afortunadamente para nosotros, [ptolemy_new_satrapy.GetRuler.GetName], un fiel partidario de [ROOT.GetCountry.GetRuler.GetName], ha salido victorioso. [ptolemy_new_satrapy.GetRuler.GetPraenomen] ha servido durante mucho tiempo a nuestra causa como diplomático, consiguiendo términos favorables durante la Paz de 311 con los Antigónidas y manteniendo buenas relaciones con nuestros aliados, pero ahora busca un nuevo papel.\n\nSu historial de fidelidad y la distancia de la región de [ROOT.GetCountry.GetCapital.GetName] pueden ser suficientes para justificar el nombramiento de [ptolemy_new_satrapy.GetRuler.GetPraenomen] nuestro sátrapa en Caria."
 diadochi_flavor.68.a:0 "@[ptolemy_new_satrapy.GetFlag]!  [ptolemy_new_satrapy.GetName] será suyo para tenerlo y conservarlo."
 diadochi_flavor.68.b:0 "@[ptolemy_new_satrapy.GetFlag]!  [ptolemy_new_satrapy.GetName] necesita mano firme."
 diadochi_flavor.68.bt:0 "#E Caria#! será #R anexada#! y [aristoboulos_scope.GetName] se convertirá en el [ROOT.GetCountry.GetAdjective] gobernador de #Y Asia#!."

 diadochi_flavor.69.t:0 "Sátrapa de Cilicia"
 diadochi_flavor.69.desc:0 "Con la contracción del Reino Antigónida, innumerables pretendientes, como buitres ante un cadáver, han intentado apoderarse de Cilicia. Afortunadamente para nosotros, [ptolemy_new_satrapy.GetRuler.GetName], un fiel partidario de [ROOT.GetCountry.GetRuler.GetName], ha salido victorioso. [ptolemy_new_satrapy.GetRuler.GetPraenomen] lideró una campaña fallida contra las fuerzas antigónidas en Cilicia entre 310 y 309 a.C. Después de ser rechazado, sirvió como comandante de las posesiones de Ptolemaio en Grecia como comandante de sus posesiones, Sikyon y Corinto hasta que fue llamado.\n\nSu historial de fidelidad y la distancia de Caria de [ROOT.GetCountry.GetCapital.GetName] pueden ser suficientes para justificar el nombramiento de [ptolemy_new_satrapy.GetRuler.GetPraenomen] nuestro sátrapa en Cilicia."
 diadochi_flavor.69.a:0 "@[ptolemy_new_satrapy.GetFlag]!  [ptolemy_new_satrapy.GetName] será suyo para tenerlo y conservarlo."
 diadochi_flavor.69.b:0 "@[ptolemy_new_satrapy.GetFlag]!  [ptolemy_new_satrapy.GetName] necesita mano firme."
 diadochi_flavor.69.bt:0 "#E Cilicia#! será #R anexada#! y [ptolemy_new_satrapy.GetRuler.GetName] se convertirá en el [THIS.GetCountry.GetAdjective] gobernador de #Y Cilicia#!."

