 flavor_sel.8.t:0 "Un reino sirio"
 flavor_sel.8.desc:0 "Los vientos del destino se han vuelto contra nosotros, obligándonos a abandonar el antiguo corazón de Babilonia. Sin embargo, incluso en la adversidad, surgen oportunidades. Siria, con su ubicación estratégica y sus fortificaciones naturales, nos ofrece la oportunidad de reconstruir y fortalecer nuestro reino. Al establecernos como reyes de Siria, anclamos nuestro gobierno en la encrucijada del este y el oeste, asegurando nuestra supervivencia y preparando el camino para la futura recuperación de nuestros territorios perdidos. Hoy, en medio de una gran ceremonia, el [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName] ha sido coronado como Rey de Siria.\n\nLa coronación fue un gran evento, al que asistieron dignatarios, generales y emisarios de todos los dominios restantes. Con la colocación de la diadema sobre la cabeza de [ROOT.GetCountry.GetRuler.GetName], se hizo un juramento solemne: salvaguardar Siria, fortalecer sus defensas y algún día levantarse lo suficientemente fuerte como para retomar el este. Aunque nuestro dominio se ha reducido, el espíritu de la casa [ROOT.GetCountry.GetRuler.GetFamily.GetName] permanece intacto.\n\nComo parte de esta reorganización, nuestros territorios a lo largo del Mar Rojo se consolidarán para garantizar una administración más eficaz. La pérdida del control directo sobre las tierras a lo largo del Sinus Persicus es un trago amargo, pero requiere una mayor dependencia de nuestros sátrapas, que ahora gobernarán como dinastías casi independientes. Esta descentralización, aunque arriesgada, nos permitirá centrar nuestros recursos en las tierras centrales de Siria y prepararnos para futuros esfuerzos."
 flavor_sel.8.a:0 "¡Salve al Rey de Siria!"


 dhe_thrace_flavor.1.t:0 "La educación de Alejandro"
 dhe_thrace_flavor.1.desc:0 "[SCOPE.sChar('onesikritos_historian').GetPraenomen], [SCOPE.sChar('onesikritos_historian').GetOffice.GetName], ha solicitado una audiencia para leer su nuevo relato histórico sobre la vida y la obra de Alejandro Magno. Como antiguo guardaespaldas de Alejandro, Lisímaco estuvo presente en la mayoría de los momentos importantes de su vida. Por eso, ansiaba mucho esta ocasión. Todo empieza bien, pero a medida que avanza la lectura, Lisímaco nota que hay cada vez más acontecimientos que no recuerda.\n\nComienza a sospechar que [SCOPE.sChar('onesikritos_historian').GetOffice.GetName] se inventó hechos. Sin duda, no puede tener tan mala memoria. Finalmente, [SCOPE.sChar('onesikritos_historian').GetPraenomen] deleita a la corte con el relato del momento en el que Alejandro tuvo una audiencia con la reina de las amazonas, un suceso que Lisímaco sin duda debería recordar."
 dhe_thrace_flavor.1.a:0 "'¿Y dónde estaba yo en ese momento?'"
 dhe_thrace_flavor.1.b:0 "'¡Ah, sí! Lo recuerdo muy bien'"
 dhe_thrace_flavor.2.t:0 "Historia de un león"
 dhe_thrace_flavor.2.desc:0 "A nuestro Basileus, por grandioso que sea, le encanta contar historias y recordar sus días de juventud como guardaespaldas de Alexandros. Su historia favorita es aquella en la que salvó la vida de Alexandros del ataque de un león durante un incidente de caza. Lisímaco contará esta historia a cualquiera que esté dispuesto a escuchar, normalmente algún cortesano desprevenido, además de mostrar la gran cicatriz que le dejó el león.\n\nEsta vez ha conseguido arrinconar a [SCOPE.sChar('lion_tale_audience').GetPraenomen]. [SCOPE.sChar('lion_tale_audience').GetSheHe|U] mira a Lysimachos con temor, sin darse cuenta de lo que está por suceder. Lisímaco mira [SCOPE.sChar('lion_tale_audience').GetHerHim] directamente a los ojos y comienza: \"Cuando el león ruge con furia más salvaje\"."
 dhe_thrace_flavor.2.a:0 "¡Oh, no! No otra vez."
 dhe_thrace_flavor.2.a.tt:0 "[SCOPE.sChar('lion_tale_audience').GetPraenomen] intenta escaparse, pero Lisímaco le agarra el brazo y se levanta la túnica para mostrar su cicatriz.\n "
 dhe_thrace_flavor.2.b:0 "¡Oh! Me encanta esta anécdota."
 dhe_thrace_flavor.2.b.tt:0 "[SCOPE.sChar('lion_tale_audience').GetPraenomen] se sienta con Lisímaco y escucha atentamente su relato.\n "




###Parthia
 diadochi_flavor.100.t:0 "Una oportunidad para atacar"
 diadochi_flavor.100.desc:0 "La débil dinastía [SCOPE.sC('origin').GetRuler.GetFamilyDisplayAdjective] se encoge al oeste y reclama el dominio nominal de grandes extensiones de tierra.\n\nEn realidad, somos los únicos que se atreven a decir la verdad: la legitimidad del gobierno seléucid terminó.\n\nPor lo tanto, es interesante que uno de nuestros grupos de búsqueda de alimento haya vuelto a casa apenas con vida recientemente tras haber sido desviado por una patrulla fronteriza acompañada por [SCOPE.sC('origin').GetRuler.GetName], [SCOPE.sC('origin').GetRulerTitle] de [SCOPE.sC('origin').GetName]. Con una respuesta lo suficientemente rápida, podríamos ser capaces de darles un duro golpe, aunque esto seguramente sería una declaración abierta de guerra."
 diadochi_flavor.100.a:0 "¡Nuestro momento es ahora!"
 diadochi_flavor.100.b:0 "No podemos alterar el frágil equilibrio de poder."

 diadochi_flavor.101.t:0 "Hordas partias"
 diadochi_flavor.101.desc:0 "Sintiendo un momento de debilidad, las hordas de los desechos [SCOPE.sC('target').GetAdjective] descendieron sobre las tierras [SCOPE.sC('origin').GetRuler.GetFamilyDisplayAdjective] como una manada de lobos salvajes a un cordero.\n\nEl ataque se produjo sin previo aviso, con el/la [SCOPE.sC('origin').GetRulerTitle] [SCOPE.sChar('sel_rul').GetPraenomen] como una de las primeras víctimas, mientras recorría la región fronteriza cuando se produjo el ataque.\n\nAparentemente no contentos con este apocalíptico giro de los acontecimientos, los nobles del reino [SCOPE.sC('origin').GetAdjective] se han enfrentado entre sí mientras discuten para determinar un legítimo sucesor. ¿El titán del este caerá en la ruina?"
 diadochi_flavor.101.a:0 "¡Infortunio!"
 seleucid_struggles:0 "¡Conflicto!"
 desc_seleucid_struggles:0 "Provocado por el ataque de las hordas partias, el imperio está en un estado de agitación."


 egypt_cypriot_kings:0 "Reyes chipriotas"
 egypt_cypriot_kings_desc:0 "Antes de la muerte de Pérdicas (321 a. C.), Ptolemaio había conseguido una alianza con Nikokreon, el más destacado de los reyes chipriotas. En el año 316 a. C., Chipre se convirtió en un campo de batalla entre Ptolemaio y Antígono por el control del Mediterráneo. Junto a Nikokreon había otros tres reyes vasallos leales: Nicokles de Paphos, Androkles de Amathus y Pasikrates de Soli. Los otros reyes de Chipre se aliaron con Antígono. La intervención militar de Ptolemaio bajo el mando de su hermano Menelao resultó exitosa en sofocar a los reyes rebeldes. En 312, Ptolemaio derrocó a todos los reyes chipriotas con la excepción de Nikokreon de [GetProvince('(int32)331').GetName] (y quizás Eunostos de [GetProvince('(int32)333').GetName]). Ptolemaio casó a su hija Eirene con Eunostos poco después de la muerte del padre de Eunostos para garantizar que el nuevo rey de un importante reino chipriota permaneciera leal. Los dominios de Nikokreon se ampliaron enormemente; fue designado como el principal oficial ptolemaico en la isla y nombrado estratega de Chipre.\n\nAunque Nikokreon fue favorecido por Ptolemaio, su muerte (potencialmente por suicidio forzado) en 309 a. C. Condujo a una administración ptolemaica directa de Chipre y a la abolición de los reinos chipriotas independientes restantes. Menealos, el hermano de Ptolemaio, asumió el papel de Nikokreon; fue nombrado rey de [GetProvince('(int32)331').GetName] y sátrapa de Chipre."
 egypt_cypriot_kings_reward_tt:0 "Determinaremos cómo se administrará #E #Y Chipre#!#!"

#Cyprus Events
 flavor_cyprus.1.t:0 "[eunostos_of_soloi.GetPraenomen] de [GetProvince('(int32)333').GetName]"
 flavor_cyprus.1.desc:0 "Antes de la muerte de #E Pérdicas#! (321 a. C.), [GetCharacter('(int32)42').GetPraenomen] había asegurado una alianza con Nikokreon, el más prominente de los reyes chipriotas. En el año 316 a. C., Chipre se convirtió en un campo de batalla entre [GetCharacter('(int32)42').GetPraenomen] y #E Antígono#! por el control del Mediterráneo. Junto a #E Nikokreon#! había otros tres reyes vasallos leales: #E Nicokles#! de Pafos, #E Androcles#! de Amathus y #E Pasikrates#! de Soli. Los otros reyes de Chipre se aliaron con Antígono. La intervención militar de [GetCharacter('(int32)42').GetPraenomen] bajo el mando de su hermano Menelao resultó exitosa en sofocar a los reyes rebeldes. En 312 [GetCharacter('(int32)42').GetPraenomen] derrocó a todos los reyes chipriotas con la excepción de Nikokreon de [GetProvince('(int32)331').GetName] (y quizás Eunostos de [GetProvince('(int32)333').GetName]). [GetCharacter('(int32)42').GetPraenomen] casó a su hija Eirene con Eunostos poco después de que el padre de Eunostos muriera para garantizar que el nuevo rey de un importante reino chipriota permaneciera leal. Los dominios de Nikokreon se ampliaron enormemente a medida que se le dio el dominio sobre los territorios arrebatados a los reyes leales a la causa Antigónida. Fue nombrado principal oficial ptolemaico en la isla y nombrado estratega de Chipre.\n\nAunque Nikokreon fue favorecido por [GetCharacter('(int32)42').GetPraenomen], su muerte (potencialmente por suicidio forzado) en 309 a. C. Condujo a una administración ptolemaica directa de Chipre y a la abolición de los reinos chipriotas independientes restantes. El hermano de [GetCharacter('(int32)42').GetPraenomen], Menealos, asumió el papel de Nikokreon; fue nombrado rey de [GetProvince('(int32)331').GetName] y sátrapa de Chipre.\n\nAhora que Chipre ha caído fuera del control antigónida, [menelaos_lagid.GetPraenomen] ha establecido control sobre la isla en nuestro nombre; sin embargo, [eunostos_of_soloi.GetPraenomen], el supuesto gobernante legítimo de [GetProvince('(int32)333').GetName], ha estado molestando incesantemente a [ROOT.GetCountry.GetRuler.GetPraenomen] para que restaure las tierras de la familia [eunostos_of_soloi.GetHerHis]. Ofreciendo importantes sumas de oro y argumentando que [ROOT.GetCountry.GetRuler.GetPraenomen] nunca debe temer dónde residen [eunostos_of_soloi.GetHerHis] las lealtades. Sin embargo, está claro para [ROOT.GetCountry.GetRuler.GetPraenomen] que [eunostos_of_soloi.GetPraenomen] no busca simplemente gobernar [eunostos_of_soloi.GetHerHis] asiento ancestral, sino subyugar a todo Chipre..."
 flavor_cyprus.1.a:0 "Deja que [eunostos_of_soloi.GetPraenomen] regrese a Soloi."
 flavor_cyprus.1.at:0 "[eunostos_of_soloi.GetPraenomen] se otorgará [GetProvince('(int32)333').GetName] cuando un #E [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!\n[GetProvince('(int32)6431').GetName] pase a ser propiedad de #E Soloi#!"
 flavor_cyprus.1.b:0 "[eunostos_of_soloi.GetPraenomen] será recompensado por su fidelidad."
 flavor_cyprus.1.bt:0 "[eunostos_of_soloi.GetPraenomen] recibirá la mitad occidental de #E Chipre#! mientras que [menelaos_lagid.GetPraenomen] conservará la mitad oriental"
 flavor_cyprus.1.c:0 "Debemos recuperar [menelaos_lagid.GetPraenomen] de inmediato."
 flavor_cyprus.1.ct:0 ""
 flavor_cyprus.1.d:0 "Toda la isla será de [menelaos_lagid.GetPraenomen]."
 flavor_cyprus.1.dt:0 ""
 flavor_cyprus.1.e:0 "Ninguno de los dos es apto para gobernar en nuestro nombre."
 flavor_cyprus.1.et:0 "#R Todos los territorios de Chipre serán anexados#!"
 flavor_cyprus_soloi_feudatory_1.tt:0 "#E Soloi#! se convierte en un #Y Feudatorio#! de [SCOPE.GetRootScope.GetCountry.GetName]"
 flavor_cyprus_salamis_feudatory_1.tt:0 "#E Salamina#! se convierte en un #Y Feudatorio#! de [SCOPE.GetRootScope.GetCountry.GetName]"
 refused_kingship_loyalty:0 "Demandante despreciado"

 flavor_cyprus.2.t:0 "[cyprus_country.GetRulerTitle] de [cyprus_country.GetName]"
 flavor_cyprus.2.desc:0 "Antes de la muerte de #E Pérdicas#! (321 a. C.), [GetCharacter('(int32)42').GetPraenomen] había asegurado una alianza con #E Nikokreon#! de Salamina, el más destacado de los reyes chipriotas. En el año 316 a. C., Chipre se convirtió en un campo de batalla entre [GetCharacter('(int32)42').GetPraenomen] y #E Antígono#! por el control del Mediterráneo. Junto a #E Nikokreon#! había otros tres reyes vasallos leales: #E Nicokles#! de Pafos, #E Androcles#! de Amathus y #E Pasikrates#! de Soli. Los otros reyes de Chipre se aliaron con Antígono. La intervención militar de [GetCharacter('(int32)42').GetPraenomen] bajo el mando de su hermano Menelao resultó exitosa en sofocar a los reyes rebeldes. En 312 [GetCharacter('(int32)42').GetPraenomen] derrocó a todos los reyes chipriotas con la excepción de Nikokreon de [GetProvince('(int32)331').GetName] (y quizás Eunostos de [GetProvince('(int32)333').GetName]). [GetCharacter('(int32)42').GetPraenomen] casó a su hija Eirene con Eunostos poco después de que Pasikrates, el padre de Eunostos, muriera para garantizar que el nuevo rey de un importante reino chipriota permaneciera leal. Los dominios de Nikokreon se ampliaron enormemente a medida que se le dio el dominio sobre los territorios arrebatados a los reyes leales a la causa Antigónida. Fue nombrado jefe ptolemaico de la isla y nombrado estratega de Chipre. Aunque Nikokreon fue favorecido por [GetCharacter('(int32)42').GetPraenomen], su muerte (potencialmente por suicidio forzado) en 309 a. C. Condujo a una administración ptolemaica directa de Chipre y a la abolición de los reinos chipriotas independientes restantes. Ahora que Chipre ha caído fuera del control de Antigonid, parece que [GetCountry('EGY').GetRuler.GetName] ha nombrado a [cyprus_country.GetRuler.GetName] rey de [cyprus_country.GetCapital.GetName] y sátrapa de [cyprus_country.GetName]."
 flavor_cyprus.2.a:0 "Seguiremos su carrera con gran interés."
 flavor_cyprus.2.at:0 "No pasa nada"
 flavor_cyprus.2.b:0 "Me pregunto qué le deparará el futuro a [cyprus_country.GetRuler.GetPraenomen]..."
 flavor_cyprus.2.bt:0 "#R ¡Etiquetaremos el cambio a @[cyprus_country.GetFlag]!  #Y [cyprus_country.GetName]#!#!"

 egypt_philokles_sidon:0 "Restauración de Baalshillemi"
 egypt_philokles_sidon_desc:0 "La dinastía #E Baalshillemi#! reinó una vez como reyes de [GetProvince('(int32)747').GetName]. #E Filocles#!, el último descendiente de Baalshillem, nos sirvió fielmente durante muchos años. Descendiente de #E Estratón#! (Abdashtart), el famoso helinizador, Filocles era culturalmente más griego que sidonio. Los eruditos creen que su nombre es una traducción griega del fenicio '#E Hiram#!'. Dotado de poderes considerables, Filocles protegió incansablemente los intereses ptolemaicos tanto en el Egeo como en el Mediterráneo oriental. Su lealtad debería ser recompensada. Quizás ha llegado el momento de restaurar a los verdaderos reyes de Sidón y elevar al último linaje de Baalshillem a su legítima posición de poder..."
 egypt_philokles_sidon_reward_tt:0 "El heredero legítimo de #E Baalshillem#! será restituido al #E #Y Sidónio#!#! Trono"

 flavor_cyprus.3.t:0 "Restauración de Baalshillemi"
 flavor_cyprus.3.desc:0 "La dinastía #E Baalshillemi#! reinó una vez como reyes de [GetProvince('(int32)747').GetName]. #E Filocles#!, el último descendiente de Baalshillem, nos sirvió fielmente durante muchos años. Descendiente de #E Estratón#! (Abdashtart), el famoso helinizador, Filocles era culturalmente más griego que sidonio. Los eruditos creen que su nombre es una traducción griega del fenicio '#E Hiram#!'. Dotado de poderes considerables, Filocles protegió incansablemente los intereses ptolemaicos tanto en el Egeo como en el Mediterráneo oriental. Su lealtad debe ser recompensada.\n\nAhora el último miembro del linaje de Baalshillem ha sido restaurado a su posición legítima; [philokles_baalshillemi.GetName] ha sido instalado como rey de una Sidón subordinada."
 flavor_cyprus.3.a:0 "¡Que reine por mucho tiempo!"
 flavor_cyprus.3.b:0 "Sus propiedades ancestrales serán restauradas."

 flavor_cyprus.8.t:0 "Un nuevo rey"
 flavor_cyprus.8.desc_1:0 "[GetCharacter('(int32)39').GetName] depuso a nuestro #E Straton#! y levantó a [GetCharacter('(int32)95').GetName], un descendiente empobrecido de la familia real, para gobernar [ROOT.GetCountry.GetCapital.GetName]. [GetCharacter('(int32)39').GetPraenomen], muy impresionado por el carácter de este hombre, dio órdenes de que no sólo el equipamiento real de Straton fuera asignado al nuevo rey, sino que también ampliara el territorio de [ROOT.GetCountry.GetCapital.GetName].\n\nEn un intento por asegurar su influencia sobre la región, [new_overlord.GetRuler.GetName] ha instalado a [philokles_baalshillemi.GetName], un miembro de la línea depuesta de la dinastía Baalshillemi, como nuevo rey de [ROOT.GetCountry.GetCapital.GetName]. Descendiente de Estratón (Abdashtart), el famoso helenizador, [philokles_baalshillemi.GetName] es culturalmente más griego que sidonio. Su nombre, que se cree que es una traducción griega del fenicio \"Hiram\", refleja esta doble herencia."
 flavor_cyprus.8.desc_2:0 "[GetCharacter('(int32)39').GetName] depuso a nuestro #E Straton#! y levantó a [GetCharacter('(int32)95').GetName], un descendiente empobrecido de la familia real, para gobernar [ROOT.GetCountry.GetCapital.GetName]. [GetCharacter('(int32)39').GetPraenomen], muy impresionado por el carácter de este hombre, dio órdenes de que no sólo el equipamiento real de Straton fuera asignado al nuevo rey, sino que también ampliara el territorio de [ROOT.GetCountry.GetCapital.GetName].\n\nEn un intento por asegurar su influencia sobre la región, [new_overlord.GetRuler.GetName] ha instalado a [philokles_baalshillemi.GetName], un miembro de la línea depuesta de la dinastía Baalshillemi, como nuevo rey de [ROOT.GetCountry.GetCapital.GetName]. Descendiente de Estratón (Abdashtart), el famoso helenizador, [philokles_baalshillemi.GetName] es culturalmente más griego que sidonio. Su nombre, que se cree que es una traducción griega del fenicio 'Hiram', refleja esta doble herencia.\n\nAntes de las #E Guerras de los Diadochi#!, nuestra gran ciudad alguna vez poseyó amplias propiedades en el sur, otorgadas como recompensa por nuestra lealtad y ayuda en la conquista de #E Egipto#!. El Señor de Reyes #E el rey Cambises II#! añadió [GetProvince('(int32)667').GetName], [GetProvince('(int32)663').GetName] y las poderosas tierras de #E Dagón#! a nuestro dominio, en reconocimiento al invaluable apoyo brindado por nuestro #E rey Eshmun'azar II#! durante su campañas.\n\nAhora, en un gesto de buena voluntad, [new_overlord.GetRuler.GetName] ha anunciado la devolución de estas tierras a nuestra gran ciudad."
 flavor_cyprus.8.a:0 "¡Que reine por mucho tiempo!"

 flavor_cyprus.12.t:0 "¿Un rey sidonio para Tiro?"
 flavor_cyprus.12.desc:0 "El rey de Sidón, [sidon_king.GetPraenomen], nos ha brindado un servicio fiel y ejemplar, tanto protegiendo los intereses ptolemaicos en el Egeo y el Mediterráneo oriental como en su tierra natal. Tal dedicación merece reconocimiento. La tradición nos dice que Tiro y Sidón alguna vez estuvieron unidas bajo los reyes sidonios. Algunos dicen que [sidon_king.GetPraenomen] es más griego que sidonio, pero en verdad, su línea representa los primeros #E sirios#! verdaderos, una mezcla de tradiciones fenicias y helenísticas que cierra la brecha entre Oriente y Occidente. Elevar a [sidon_king.GetPraenomen] al gobierno de Tiro y Sidón honraría adecuadamente sus contribuciones y también sentaría las bases para una Fenicia más unificada y helenizada. Si fuera elevado a tal posición, se esperaría, por supuesto, que integrara la cultura helénica en su gobierno en una escala que superara incluso a su antepasado Straton (Abdashtart), el famoso helinizador."
 flavor_cyprus.12.a:0 "Deja las cosas como están."
#SIDON AND TYRE GET 5 STABILITY
 flavor_cyprus.12.b:0 "Une Tiro y Sidón bajo [sidon_king.GetPraenomen]."
 flavor_cyprus.12.bt:0 "[sidon_king.GetPraenomen] se convierte en rey de #E Tiro#!\n#E Tiro#! se anexa a #E Sidón#! y se helenizará rápidamente."
 flavor_cyprus.12.c:0 "[sidon_king.GetPraenomen] será más que un rey de las costas."
 flavor_cyprus.12.ct:0 "[sidon_king.GetPraenomen] se convierte en rey de #E Tiro#!\n#E Tiro#! anexa #E Sidón#! y todas las [THIS.GetCountry.GetAdjective] tierras de las áreas de #Y Galilea#! y #Y Sur Fenicia#! y se helenizará rápidamente"
#Trigger if own right land


flavor_cyprus.13.t:0 "¿Un rey sidonio para Tiro?"
flavor_cyprus.13.desc:0 "[overlord.GetRuler.GetPraenomen] ha hecho una propuesta para unificar Tiro y Sidón bajo un solo gobernante: [sidon_king.GetPraenomen], el rey de Sidón. Tal unión se remonta a los primeros días del milenio, cuando los reyes sidonios gobernaban desde Tiro. Algunos dicen que [sidon_king.GetPraenomen] es más griego que sidonio, pero en verdad, su línea representa los primeros #E sirios#! verdaderos, una mezcla de tradiciones fenicias y helenísticas que tiende un puente entre Oriente y Occidente. El propio [sidon_king.GetPraenomen] promete marcar el comienzo de una nueva era de prosperidad.\n\nLos emisarios del [overlord.GetRuler.GetPraenomen] nos aseguran que esta unión traería inmensas recompensas para Tiro. Los miembros del consejo pronto habrán prometido riqueza e influencia similares a las de los reyes de estados menores, y el poder combinado de Tiro y Sidón aseguraría nuestro lugar como fuerza dominante en la región. Sin embargo, [sidon_king.GetPraenomen] ha recibido el mandato de integrar la cultura helénica en su gobierno a una escala que supere incluso a su antepasado Straton (Abdashtart), el famoso helinizador. Gran parte de nuestra herencia tiria puede perderse en el proceso..."
flavor_cyprus.13.a:0 "¡Salve Rey [sidon_king.GetPraenomen]!"
flavor_cyprus.13.at1:0 "[sidon_king.GetPraenomen] se convierte en el rey de #E Tiro#!\n#E Tiro#! se anexa #E Sidón#!"
flavor_cyprus.13.at2:0 "[sidon_king.GetPraenomen] se convierte en rey de #E Tiro#!\n#E Tiro#! anexa #E Sidón#! y todas las [overlord.GetAdjective] tierras de las áreas de #Y Galilea#! y #Y Sur Fenicia#!"
flavor_cyprus.13.at3:0 "¡Las tareas de misión '#Y $phoenicia_missions_task_21$#!,' #Y $phoenicia_missions_task_22$#! y '#Y $phoenicia_missions_task_23$#!' se #G completadas#! en los próximos meses!"
flavor_cyprus.13.b:0 "Debemos preservar nuestra independencia."


flavor_cyprus.14.t:0 "¿Un rey sidonio para Tiro?"
flavor_cyprus.14.desc:0 "[sidon_king.GetPraenomen], ha prestado durante mucho tiempo a [overlord.GetRuler.GetPraenomen] un servicio fiel y ejemplar, tanto protegiendo los intereses de [overlord.GetAdjective] en el Egeo y el Mediterráneo oriental como en su tierra natal. Parece que [overlord.GetRuler.GetPraenomen] siente que tal dedicación merece reconocimiento. [overlord.GetRuler.GetPraenomen] ha hecho una propuesta para unificar Tiro y Sidón bajo un solo gobernante: [sidon_king.GetPraenomen]. Esta unión propuesta se remonta a los primeros días del milenio, cuando la tradición nos dice que los reyes sidonios gobernaban desde Tiro. Algunos dicen que [sidon_king.GetPraenomen] es más griego que sidonio, pero en verdad, su línea representa los primeros #E sirios#! verdaderos, una mezcla de tradiciones fenicias y helenísticas que tiende un puente entre Oriente y Occidente. Aceptar esta propuesta sentaría las bases para una Fenicia más unificada y helenizada. Sin embargo, los enviados de [overlord.GetRuler.GetPraenomen] han dejado claro que, si fuera elevado a tal posición, se esperaría que [sidon_king.GetPraenomen] integrara la cultura helénica en su gobierno en una escala que superaría incluso a su antepasado Straton (Abdashtart), el famoso helinizador. Gran parte de nuestra herencia sidonia puede perderse en el proceso..."
flavor_cyprus.14.a:0 "¡Una buena propuesta!"
flavor_cyprus.14.at1:0 "[sidon_king.GetPraenomen] se convierte en el rey de #E Tiro#!\n#E Tiro#! se anexa #E Sidón#!"
flavor_cyprus.14.at2:0 "[sidon_king.GetPraenomen] se convierte en rey de #E Tiro#!\n#E Tiro#! anexa #E Sidón#! y todas las [overlord.GetAdjective] tierras de las áreas de #Y Galilea#! y #Y Sur Fenicia#!"
flavor_cyprus.14.at3:0 "¡Las tareas de misión '#Y $phoenicia_missions_task_21$#!,' #Y $phoenicia_missions_task_22$#! y '#Y $phoenicia_missions_task_23$#!' se #G completadas#! en los próximos meses!"
flavor_cyprus.14.b:0 "Sidón aún no está preparada para una helenización generalizada."


 antigonid_cypriot_kings:0 "Príncipes chipriotas"
 antigonid_cypriot_kings_desc:0 "Durante la Tercera Guerra de los Diadochi, Antígono encontró aliados entusiastas entre los reyes chipriotas (y fenicios) que resentían la tiranía ptolemaica. Mientras Nikokreon de [GetProvince('(int32)331').GetName] se puso del lado de Ptolemaio, otras ciudades como Kition, Marion y Lapethos se aliaron con Antígono y más desertaron mientras la guerra asolaba la isla. En 312 a. C., Ptolemaio reprimió violentamente a los reyes chipriotas leales a Antígono. Su ira solo salvó a Nikokreon de [GetProvince('(int32)331').GetName] y quizás a Eunostos de [GetProvince('(int32)333').GetName], a quienes aseguró mediante matrimonios políticos calculados y subyugación forzada. Menelao, envalentonado por las órdenes de Ptolemaio, continuó apretando más, convirtiendo la isla, una vez libre, en una fortaleza ptolemaica. Nikokreon, aunque alguna vez fue favorecido, no fue inmune a la paranoia y la intriga de la corte ptolemaica. En 309 a. C., se vio obligado a suicidarse.\n\nA raíz de la muerte de Nikokreon, Ptolemaio abolió los últimos vestigios de la independencia chipriota e instaló a Menelao como rey de [GetProvince('(int32)331').GetName] y sátrapa de Chipre. El usurpador, sin embargo, no mantendría su poder por mucho tiempo. En 306 a. C., Antígono envió a su hijo, Demetrio Poliorcetes, para arrebatar la isla del control ptolemaico. Las fuerzas navales de Demetrio aniquilaron la flota de Menelao, asestando un golpe devastador a Ptolemaio. Menelao, superado y acorralado, se vio obligado a rendirse y Chipre fue liberado de la ocupación ptolemaica. \n ¿Tal vez una vez que nuestra posición se haya estabilizado, podríamos considerar corregir los errores de Ptolomeo y considerar restaurar la autonomía de los chipriotas?"
 antigonid_cypriot_kings_reward_tt:0 "Determinaremos cómo administrar #E #Y Chipre#!#!"
 antigonid_cypriot_kings_combo_tt:0 "Hemos tomado la #Y Posición Antigónida Segura#! #E Decisión#! o #E Antigonos Monopthalmos#! ha estado #Y Muerto#! durante al menos un año"
 antigonid_stabilize_tt:0 "Hemos tomado la #Y Posición Antigónida Segura#! #E Decisión#!"
 antigonid_death_tt:0 "#E Antigonos Monopthalmos#! ha estado #Y muerto#! durante al menos un año"
 antigonid_regional_power_tt:0 "Somos una #E Potencia Regional#! o mayor"


 flavor_cyprus.4.t:0 "Príncipes chipriotas"
 flavor_cyprus.4.desc:0 "Durante la Tercera Guerra de los Diadochi, Antígono encontró aliados entusiastas entre los reyes chipriotas (y fenicios) que resentían la tiranía ptolemaica. Mientras Nikokreon de [GetProvince('(int32)331').GetName] se puso del lado de Ptolemaio, otras ciudades como Kition, Marion y Lapethos se aliaron con Antígono y más desertaron mientras la guerra asolaba la isla. En 312 a. C., Ptolemaio reprimió violentamente a los reyes chipriotas leales a Antígono. Su ira solo salvó a Nikokreon de [GetProvince('(int32)331').GetName] y quizás a Eunostos de [GetProvince('(int32)333').GetName], a quienes aseguró mediante matrimonios políticos calculados y subyugación forzada. Menelao, envalentonado por las órdenes de Ptolemaio, continuó apretando más, convirtiendo la isla, una vez libre, en una fortaleza ptolemaica. Nikokreon, aunque alguna vez fue favorecido, no fue inmune a la paranoia y la intriga de la corte ptolemaica. En 309 a. C., se vio obligado a suicidarse.\n\nA raíz de la muerte de Nikokreon, Ptolemaio abolió los últimos vestigios de la independencia chipriota, instalando a Menelao como rey de [GetProvince('(int32)331').GetName] y sátrapa de Chipre. El usurpador, sin embargo, no mantendría su poder por mucho tiempo. En 306 a. C., Antígono envió a su hijo, Demetrio Poliorcetes, para arrebatar la isla del control ptolemaico. Las fuerzas navales de Demetrio aniquilaron la flota de Menelao, asestando un golpe devastador a Ptolemaio. Menelao, superado y acorralado, se vio obligado a rendirse y Chipre fue liberado de la ocupación ptolemaica.\n\nAhora que nuestra posición se ha estabilizado, sería prudente decidir el futuro de Chipre. Nos han llegado noticias de que pretendientes de reinos desaparecidos y varios aristócratas chipriotas están en camino a [ROOT.GetCountry.GetCapital.GetName], buscando una audiencia con [ROOT.GetCountry.GetRuler.GetName]: [salamis_guy.GetName] de [GetProvince('(int32)331').GetName], [paphos_guy.GetName] de [GetProvince('(int32)334').GetName], [kition_guy.GetName] de [GetProvince('(int32)332').GetName], [lapethos_guy.GetName] de [GetProvince('(int32)335').GetName], y [marion_guy.GetName] de [GetProvince('(int32)6431').GetName]. Claramente tienen la intención de abogar por la restauración de la autonomía de su isla."
 flavor_cyprus.4.a:0 "Los escucharemos."
 flavor_cyprus.4.at:0 "Los diplomáticos llegarán en las próximas semanas"
 flavor_cyprus.4.b:0 "¡Ptolemaio ya resolvió el asunto de Chipre!"
 #flavor_cyprus.4.b1t:0 "#R The Cypriot princes will be denied audience and become greatly offended, losing #E 30 loyalty#! for 5 years#!"
 flavor_cyprus.4.b2t:0 "#R Esto puede tener consecuencias desastrosas#!"
 scorned_claimant_loyalty:0 "Demandante despreciado"

 flavor_cyprus.5.t:0 "Príncipes chipriotas: audiencia"
 flavor_cyprus.5.desc:0 "Príncipes autodenominados de Chipre, descendientes de monarcas depuestos y algunos magnates influyentes han llegado a [ROOT.GetCountry.GetCapital.GetName]. [salamis_guy.GetName] de [GetProvince('(int32)331').GetName], [paphos_guy.GetName] de [GetProvince('(int32)334').GetName], [kition_guy.GetName] de [GetProvince('(int32)332').GetName], [lapethos_guy.GetName] de [GetProvince('(int32)335').GetName] y [marion_guy.GetName] de [GetProvince('(int32)6431').GetName] nos recuerdan el terrible precio que pagaron sus ciudades por su lealtad a la causa Antigónida. Se perdieron innumerables vidas chipriotas resistiendo la tiranía ptolemaica; Los reyes y sus familias fueron ejecutados incluso cuando sus ciudades fueron incendiadas. Como Antígono ha afirmado ser el defensor de la libertad griega, argumentan que ha llegado el momento de restaurar la independencia de Chipre, no de mantenerla como un territorio conquistado.\n\n[kition_guy.GetName] de [GetProvince('(int32)332').GetName] recuerda [ROOT.GetCountry.GetRuler.GetPraenomen] que hay más de 15.000 tropas guarnecidas en toda la isla. Algunas de estas tropas, sugiere [kition_guy.GetSheHe], seguramente se utilizarían mejor en otras partes del imperio de [ROOT.GetCountry.GetRuler.GetPraenomen], en lugar de ocupar ociosamente sus ciudades. Finalmente, [marion_guy.GetName] de Marion habla y nos recuerda que su ciudad fue arrasada por su lealtad a Antígono. Espera que honremos este sacrificio comprometiendo fondos para reconstruir Marion, como señal de gratitud por su apoyo inquebrantable.\n\nMientras los demás príncipes abandonan la sala de audiencias, [paphos_guy.GetName] se queda atrás. Se acerca a [ROOT.GetCountry.GetRuler.GetName] y le ofrece un soborno apenas disimulado: un anticipo de los ingresos fiscales de todos sus dominios junto con una sugerencia de que [ROOT.GetCountry.GetRuler.GetPraenomen] dé a los príncipes chipriotas una independencia nominal, pero que [ROOT.GetCountry.GetRuler.GetSheHe] los haga responsables ante [paphos_guy.GetPraenomen], el sátrapa de Chipre. Sugiere que si se le concediera autoridad sobre todo Chipre como su sátrapa, la suma sería mucho mayor. Con más tierra bajo jurisdicción de [paphos_guy.GetHerHis], el avance en los ingresos fiscales se convertiría en una suma considerablemente mayor..."
 flavor_cyprus.5.a:0 "Chipre volverá a ser libre."
 flavor_cyprus.5.b:0 "Algunos príncipes serán más iguales que otros..."
 flavor_cyprus.5.bt:0 "[paphos_guy.GetPraenomen] de [GetProvince('(int32)334').GetName] tendrá autoridad sobre #Y Chipre#! como #E [THIS.GetCountry.GetAdjective]#! #Y Satrapía#!"
 flavor_cyprus.5.c:0 "¿Por qué renunciaríamos a un premio tan valioso?"
 #flavor_cyprus.5.ct:0 "#R The Cypriot princes will become greatly offended, losing #E 30 loyalty#! for 5 years\nThis may lead to disastrous consequences#!"
 flavor_cyprus_salamis_feudatory.tt:0 "[salamis_guy.GetPraenomen] se otorgará [GetProvince('(int32)331').GetName] como #E [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!"
 flavor_cyprus_paphos_temple_state.tt:0 "[paphos_guy.GetPraenomen] recibirá [GetProvince('(int32)334').GetName] como #E [THIS.GetCountry.GetAdjective]#! #Y Estado del Templo#!"
 flavor_cyprus_paphos_feudatory.tt:0 "[paphos_guy.GetPraenomen] se otorgará [GetProvince('(int32)334').GetName] como #E [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!"
 flavor_cyprus_marion_feudatory.tt:0 "[marion_guy.GetPraenomen] se otorgará [GetProvince('(int32)6431').GetName] como #E [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!"
 flavor_cyprus_kition_tributary.tt:0 "[kition_guy.GetPraenomen] se otorgará [GetProvince('(int32)332').GetName] como #E [THIS.GetCountry.GetAdjective]#! #Y Afluente#!"
 flavor_cyprus_lapethos_tributary.tt:0 "[lapethos_guy.GetPraenomen] se otorgará [GetProvince('(int32)335').GetName] como #E [THIS.GetCountry.GetAdjective]#! #Y Afluente#!"

 cyprus_satrapy_modifier:0 "Satrapía chipriota"
 cyprus_satrapy_modifier.tt:0 "#Y #E Chipre#!#! obtendrá el #Y Satrapía chipriota#! #E Modificador#!"

 flavor_cyprus.6.t:0 "Príncipes chipriotas: crisis en Chipre"
 flavor_cyprus.6.desc:0 "Los enviados de Chipre han llegado a [ROOT.GetCountry.GetCapital.GetName], temblando mientras se preparan para entregar noticias sombrías a [ROOT.GetCountry.GetRuler.GetPraenomen]. Hablan en nombre de los príncipes chipriotas, que están cada vez más desilusionados con el gobierno [ROOT.GetCountry.GetAdjective]. A pesar de las audaces afirmaciones de [ROOT.GetCountry.GetRuler.GetPraenomen] de ser el campeón de la libertad griega, los gobernantes de Chipre sólo ven la sombra de la tiranía.\n\nTemerosos de la ira de [ROOT.GetCountry.GetRuler.GetPraenomen], los enviados explican vacilantes que los príncipes chipriotas, liderados por [salamis_guy.GetName] de Salamina y [paphos_guy.GetName] de Paphos, han tomado medidas drásticas. Las [ROOT.GetCountry.GetAdjective] guarniciones estacionadas por toda la isla han sido expulsadas. Ya no dispuestos a tolerar la ocupación, los príncipes han reclamado sus ciudades. Pero este acto de rebelión, insisten, no supone una ruptura total. Los príncipes todavía desean jurar lealtad a [ROOT.GetCountry.GetRuler.GetPraenomen], reconociendo a [ROOT.GetCountry.GetRuler.GetHerHim] como su soberano, siempre que se confirmen sus posiciones como reyes y se respete su autonomía.\n\nAdemás, los príncipes no carecen de lealtad. Ofrecen el servicio de tropas chipriotas para reforzar nuestros ejércitos y fortalecer la causa de [ROOT.GetCountry.GetRuler.GetPraenomen] en todo el Mediterráneo. Sin embargo, los príncipes lo han dejado claro: si [ROOT.GetCountry.GetRuler.GetPraenomen] se niega a reconocer su soberanía, se verán obligados a luchar por su libertad. De una forma u otra, el status quo en Chipre se verá alterado..."
 flavor_cyprus.6.a:0 "Chipre volverá a ser libre."
 flavor_cyprus.6.b:0 "Estos pequeños príncipes no son rival para [ROOT.GetCountry.GetRuler.GetName]."
 flavor_cyprus.6.bt:0 "#R Las ciudades chipriotas iniciarán una #E Guerra de Independencia#!#!"

 flavor_cyprus.7.t:0 "[cyprus_country.GetRulerTitle] de [cyprus_country.GetName]"
 flavor_cyprus.7.desc:0 "La isla de Chipre ha sido durante mucho tiempo la principal fuente de cobre para el Levante y el Mediterráneo en general. De hecho, muchas ciudades-estado, tanto griegas como fenicias, establecieron colonias en la isla para beneficiarse del enormemente lucrativo comercio del cobre. Chipre estaba compuesto por innumerables ciudades-reino hasta que fueron abolidas durante las guerras de los Diadochi: Marion, Soloi, Karpaseia, Lapethos, Ledrai, Chythroi, Salamis, Kition, Idalion, Tamassos, Amathus, Kourion y Paphos.\n\nParece que [GetCountry('PRY').GetRuler.GetName] reavivaría el dominio nativo sobre Chipre. [cyprus_country.GetName] ha sido designado sátrapa de Chipre con el control de todos los antiguos reinos ahora unidos bajo una sola administración."
 flavor_cyprus.7.a:0 "Seguiremos su carrera con gran interés."
 flavor_cyprus.7.at:0 "No pasa nada"
 flavor_cyprus.7.b:0 "Me pregunto qué le deparará el futuro a [cyprus_country.GetRuler.GetPraenomen]..."
 flavor_cyprus.7.bt:0 "#R ¡Etiquetaremos el cambio a @[cyprus_country.GetFlag]!  #Y [cyprus_country.GetName]#!#!"

 flavor_cyprus.9.t:0 "Élite chipriota"
 flavor_cyprus.9.desc:0 "[cyprus_country.GetRuler.GetName], recientemente coronado rey de [cyprus_country.GetCapital.GetName] y sátrapa de [cyprus_country.GetName], se sienta en la gran sala de audiencias del palacio. Entre la multitud de dignatarios destacan dos figuras: [kition_guy.GetName], un príncipe comerciante de Kition, y [salamis_guy.GetName], un descendiente de la dinastía Teukrid de Salamina. Ambas familias, aunque despojadas de sus tronos ancestrales durante las guerras de los Diadochi, conservan una influencia sustancial sobre sus respectivas ciudades y la aristocracia chipriota en general.\n\nLa pareja se acerca al trono y se arrodilla en señal de respeto, jurando lealtad a [cyprus_country.GetRuler.GetName] como gobernante legítimo de Chipre. Sus palabras son formales y obedientes, pero su promesa suena vacía. [kition_guy.GetName] es el primero en hablar, recordando al nuevo rey la necesidad de mantener la lealtad de las antiguas élites chipriotas. \"[cyprus_country.GetRuler.GetPraenomen]\", dice, \"un Chipre unido debe basarse en los pilares de su pasado\". Sin nuestro apoyo, los cimientos de su gobierno pueden tambalearse.'\n\n[salamis_guy.GetName] asiente con la cabeza y agrega: 'El pueblo chipriota nos considera símbolos de su gloria pasada. Mi linaje se remonta a Teucro, el gran arquero de la guerra de Troya y fundador de Salamina. Presta atención a nuestro consejo y nos aseguraremos de que tu reinado perdure. Si no lo haces caso, la isla podría verse dividida una vez más."
 flavor_cyprus.9.a:0 "Nuestras líneas estarán unidas en sangre."
 flavor_cyprus.9.at:0 "[kition_guy.GetName] y [salamis_guy.GetName] se casarán con miembros de la familia de [cyprus_country.GetRuler.GetPraenomen]"
 flavor_cyprus.9.b:0 "Encontrarán su lugar en el nuevo orden."

 flavor_cyprus.10.t:0 "La cuestión chipriota"
 flavor_cyprus.10.desc:0 "Tras la retirada de los Antigónidas, el caos reina en Chipre. Mientras que [eunostos_of_soloi.GetPraenomen] y [menelaos_lagid.GetPraenomen], hermano de [GetCharacter('(int32)42').GetPraenomen] y ex sátrapa de Chipre, han recuperado con éxito sus respectivos escaños de Soloi y Salamina, el vacío de poder ha permitido a príncipes autodenominados y magnates ambiciosos hacerse con el control de Marion, Kition y Lapethos. Estos ambiciosos renegados, descendientes de monarcas depuestos y aristócratas oportunistas, se han declarado reyes de reinos difuntos, para gran frustración de [eunostos_of_soloi.GetPraenomen] y [menelaos_lagid.GetPraenomen].\n\nAunque [menelaos_lagid.GetPraenomen] alberga pocos deseos de gobernar como un simple rey insignificante, incluso en una ciudad tan próspera como Salamina, hará lo que le ordene [ROOT.GetCountry.GetRuler.GetPraenomen]. Junto a [eunostos_of_soloi.GetPraenomen], ha elaborado planes para subyugar a estos pretendientes, proponiendo un movimiento de pinza desde el este y el oeste para aplastarlos rápidamente. Sin embargo, los enviados de los nuevos reyes se han acercado a [ROOT.GetCountry.GetRuler.GetPraenomen] y se han ofrecido a jurar lealtad a [ROOT.GetCountry.GetRuler.GetPraenomen] si se confirma que están en posesión de sus territorios. [eunostos_of_soloi.GetPraenomen] y [menelaos_lagid.GetPraenomen], con experiencia en el trato con chipriotas resbaladizos, advierten que estas promesas pueden resultar vacías a menos que se tomen medidas para garantizar la lealtad. [eunostos_of_soloi.GetPraenomen] aconseja tomar como rehenes a familiares destacados de las dinastías chipriotas para garantizar su obediencia, mientras que [menelaos_lagid.GetPraenomen] prefiere resolver el asunto por la fuerza."
 flavor_cyprus.10.a:0 "Esos traidores me obligaron... Quizás esta vez sea diferente."
#tributary and feudatory
 flavor_cyprus.10.b:0 "Rehenes, ¡qué maravillosa sugerencia!"
# flavor_cyprus.10.bt:0 "[marion_guy.GetPraenomen], [kition_guy.GetPraenomen], and [lapethos_guy.GetPraenomen] will surrender prominent family members to [THIS.GetCountry.GetRuler.GetPraenomen] as hostages."
 cypriot_hostages_modifier:0 "Heredero rehén"
 flavor_cyprus.10.c:0 "La cuestión de Chipre ya ha sido resuelta."
 flavor_cyprus.10.ct:0 "#R Los reyes chipriotas rebeldes declararán una #E Guerra de Independencia#!#!"
 flavor_cyprus_salamis_feudatory_MEN.tt:0 "#E Salamina#! se convierte en un #E [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#! y #E [menelaos_lagid.GetPraenomen]#! se convierte en el rey de #E Salamina#!"
 flavor_cyprus_soloi_feudatory.tt:0 "#E Soloi#! se convierte en #E [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#! y #E [eunostos_of_soloi.GetPraenomen]#! se convierte en el rey de #E Soloi#!"

#Alternate
 flavor_cyprus.11.t:0 "El destino de Chipre"
 flavor_cyprus.11.desc:0 "Antes de la muerte de #E Pérdicas#! (321 a. C.), [GetCharacter('(int32)42').GetPraenomen] había asegurado una alianza con Nikokreon, el más prominente de los reyes chipriotas. En el año 316 a. C., Chipre se convirtió en un campo de batalla entre [GetCharacter('(int32)42').GetPraenomen] y #E Antígono#! por el control del Mediterráneo. Junto a #E Nikokreon#! había otros tres reyes vasallos leales: #E Nicokles#! de Pafos, #E Androcles#! de Amathus y #E Pasikrates#! de Soli. Los otros reyes de Chipre se aliaron con Antígono. La intervención militar de [GetCharacter('(int32)42').GetPraenomen] bajo el mando de su hermano Menelao resultó exitosa en sofocar a los reyes rebeldes. En 312 [GetCharacter('(int32)42').GetPraenomen] derrocó a todos los reyes chipriotas con la excepción de Nikokreon de [GetProvince('(int32)331').GetName] (y quizás Eunostos de [GetProvince('(int32)333').GetName]). [GetCharacter('(int32)42').GetPraenomen] casó a su hija Eirene con Eunostos poco después de que el padre de Eunostos muriera para garantizar que el nuevo rey de un importante reino chipriota permaneciera leal. Los dominios de Nikokreon se ampliaron enormemente a medida que se le dio el dominio sobre los territorios arrebatados a los reyes leales a la causa Antigónida. Fue nombrado principal oficial ptolemaico en la isla y nombrado estratega de Chipre.\n\nAunque Nikokreon fue favorecido por [GetCharacter('(int32)42').GetPraenomen], su muerte (potencialmente por suicidio forzado) en 309 a. C. Condujo a una administración ptolemaica directa de Chipre y a la abolición de los reinos chipriotas independientes restantes. El hermano de [GetCharacter('(int32)42').GetPraenomen], Menealos, asumió el papel de Nikokreon; fue nombrado rey de [GetProvince('(int32)331').GetName] y sátrapa de Chipre.\n\nCon los reyes chipriotas rebeldes derrotados, la paz ha regresado a Chipre. [menelaos_lagid.GetPraenomen] gobierna el este, con su sede en Salamina, mientras que [eunostos_of_soloi.GetPraenomen] gobierna el oeste desde Soloi. Ambos hombres han demostrado ser gobernantes capaces en sus propios dominios, pero cada uno busca subyugar a todo Chipre...\n\n[menelaos_lagid.GetPraenomen], como el hermano de [GetCharacter('(int32)42').GetPraenomen] y ex sátrapa de Chipre, aboga por la consolidación de la isla bajo su liderazgo. [eunostos_of_soloi.GetPraenomen], por otro lado, insiste en que la división actual es justa y garantiza la paz al equilibrar el poder entre los dos gobernantes. Otros en la corte susurran que ninguno de los dos debería dominar la isla, sugiriendo una administración real directa y la abolición de los reinos por completo."
 flavor_cyprus.11.a:0 "La isla permanecerá dividida."
 flavor_cyprus.11.at:0 "[menelaos_lagid.GetPraenomen] conservará el control sobre el este y [eunostos_of_soloi.GetPraenomen] gobernará el oeste."
 flavor_cyprus.11.b:0 "[eunostos_of_soloi.GetPraenomen] debería estar satisfecho con Soloi."
 flavor_cyprus.11.bt:0 "A [menelaos_lagid.GetPraenomen] se le concederá el control de todos los territorios de Chipre que no estén en manos de [eunostos_of_soloi.GetPraenomen]."
 flavor_cyprus.11.c:0 "Dejemos que [eunostos_of_soloi.GetPraenomen] retenga Chipre, [menelaos_lagid.GetPraenomen] es necesario para asuntos más importantes."
 flavor_cyprus.11.ct:0 "A [eunostos_of_soloi.GetPraenomen] o [menelaos_lagid.GetPraenomen] se le concederá el control sobre todo Chipre."
 flavor_cyprus.11.d:0 "Los reinos serán abolidos una vez más."
 flavor_cyprus.11.dt:0 "#R Todos los territorios de Chipre serán anexados#!"

