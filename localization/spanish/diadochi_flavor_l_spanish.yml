 diadochi_flavor.74.t:0 "[GetCountry('TRE').GetRuler.GetFamilyDisplayAdjective] Respuesta"
 diadochi_flavor.74.desc:0 "Los malditos [GetCountry('TRE').GetRuler.GetFamilyDisplayAdjective] han rechazado nuestra propuesta de aliarnos contra los seléucidas a través de una alianza matrimonial entre [arsinoe_ii_scope.GetName] y [GetCountry('TRE').GetRuler.GetPraenomen], citando la agitación política como causa de incertidumbre.\n\nHabíamos contado con su apoyo en los inevitables conflictos que vendrían en [GetProvince('(int32)743').GetArea.GetRegion.GetName|E] y [GetProvince('(int32)1887').GetArea.GetRegion.GetName|E]. Habrá que hacer balance una vez más..."
 diadochi_flavor.74.a:0 "¡Tontos!"

 diadochi_flavor.75.t:0 "Nacimiento de [ptolemy_epigonos.GetPraenomen]"
 diadochi_flavor.75.desc:0 "¡Los dioses han bendecido el reino [GetCountry('TRE').GetAdjective] con el nacimiento de un nuevo príncipe! [arsinoe_ii_scope.GetPraenomen], la amada esposa del noble [GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetPraenomen], ha dado a luz a un hijo sano. Este niño, [ptolemy_epigonos.GetName], promete ser un símbolo de esperanza y prosperidad para nuestra dinastía. Tanto los cortesanos como los ciudadanos se regocijan por este auspicioso evento, ya que el futuro de nuestra dinastía se vuelve cada vez más brillante con esta nueva incorporación."
 diadochi_flavor.75.a:0 "¡Qué día tan alegre!"
 diadochi_flavor.75.tt:0 "[ptolemy_epigonos.GetPraenomen] ha nacido de [GetCountry('TRE').GetRuler.GetPraenomen] y [arsinoe_ii_scope.GetPraenomen]"

 diadochi_flavor.76.t:0 "Nacimiento de [ptolemy_epigonos.GetPraenomen]"
 diadochi_flavor.76.desc:0 "¡Los dioses han bendecido el reino [GetCountry('TRE').GetAdjective] con el nacimiento de un nuevo príncipe! [arsinoe_ii_scope.GetPraenomen], la amada esposa del noble [GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetPraenomen], ha dado a luz a un hijo sano. Este niño, [ptolemy_epigonos.GetName], promete ser un símbolo de esperanza y prosperidad para nuestra dinastía. Tanto los cortesanos como los ciudadanos se regocijan por este auspicioso evento, ya que el futuro de nuestra dinastía se vuelve cada vez más brillante con esta nueva incorporación."
 diadochi_flavor.76.a:0 "¡Qué día tan alegre!"
 diadochi_flavor.76.b:0 "Envíale un regalo al joven príncipe."
 diadochi_flavor.76.tt:0 "[ptolemy_epigonos.GetPraenomen] ha nacido de [GetCountry('TRE').GetRuler.GetPraenomen] y [arsinoe_ii_scope.GetPraenomen]"

 diadochi_flavor.77.t:0 "Un llamado a las armas"
 diadochi_flavor.77.desc:0 "Después del esfuerzo herakleo que caracterizó el asedio de [GetProvince('(int32)266').GetName], los [GetCountry('PRY').GetAdjective] volvieron sus ojos hacia el oeste. Las ciudades-estado libres de [GetProvince('(int32)418').GetArea.GetRegion.GetName] fueron reunidas en una liga disciplinada, con el único objetivo de encerrar al despiadado [GetCharacter('(int32)32').GetPraenomen] y a los restos de sus fuerzas aún presentes en Macedonia.\n\nInicialmente aliada con los [GetCountry('PRY').GetAdjective], Beocia se vio posteriormente obligada a aceptar el dominio de [GetCharacter('(int32)32').GetPraenomen]; sin embargo, cuando surgió la oportunidad con la campaña de [GetCharacter('(int32)38').GetName] en el año 304 a. C., aprovechamos la oportunidad para renovar nuestra alianza con los [GetCountry('PRY').GetAdjective]. Ahora, mientras las fuerzas [GetCountry('PRY').GetAdjective] lideradas por [GetCharacter('(int32)38').GetPraenomen] provocan una ofensiva contra la amenaza [GetCountry('MAC').GetAdjective], debemos decidir si honrar nuestra alianza y unirnos a la lucha, o quedarnos solos y capear la tormenta de las ambiciones macedonias."
 diadochi_flavor.77.a:0 "¡Nuestra palabra es nuestro vínculo!"
 diadochi_flavor.77.at:0 "@[GetCountry('BOE').GetFlag]!  ¡[GetCountry('BOE').GetName|Y] se unirá a la #E Cuarta Guerra de los Diadochi#! del lado de los @[GetCountry('PRY').GetFlag]!  [GetCountry('PRY').GetName|Y]"
 diadochi_flavor.77.b:0 "¡Nuestra palabra es nuestro vínculo!"
 diadochi_flavor.77.bt:0 "@[GetCountry('PRY').GetFlag]!  ¡Los ejércitos [GetCountry('PRY').GetAdjective|Y] podrán pasar por @[GetCountry('BOE').GetFlag]!  [GetCountry('BOE').GetAdjective|Y] tierras"
 diadochi_flavor.77.c:0 "¿Por qué deberían morir nuestros hijos para saciar la sed de sangre de los reyes tiranos?"
 opinion_broke_treaty:0 "Fe rota"
 opinion_kept_treaty:0 "Fe mantenida"

 diadochi_flavor.78.t:0 "Frigia helespontina: premio de [agathocles_scope.GetPraenomen]"
 diadochi_flavor.78.desc:0 "Establecida a principios del siglo V a. C., la Frigia Helespontina estaba gobernada por descendientes de Farnaces, un tío del rey Darío I el Grande, con su capital ubicada en Dascylium. Durante la campaña de Alejandro Magno en 334 a. C., el sátrapa de Frigia helespontina, Arsites, sufrió una derrota decisiva en la batalla del río Gránico, tras la cual se suicidó. Alejandro nombró a Calas como su sucesor. Tras la muerte de Alejandro en 323 a. C., la satrapía fue otorgada a Leonato, miembro de la casa real de Lyncestis en Macedonia y uno de los guardaespaldas de confianza de Alejandro. La hermana de Alejandro, Cleopatra, viuda del rey Alejandro I de Epiro, ofreció su mano en matrimonio a Leonato, una unión que habría fortalecido su derecho al poder. Si hubiera derrotado a los atenienses, es muy posible que Leonato hubiera intentado apoderarse del trono macedonio. Su carrera se vio truncada durante la Guerra de Lamian, donde dirigió una fuerza de 20.000 soldados de infantería y 1.500 de caballería para relevar a Antípatro durante el asedio de Lamia. A pesar de sus probables ambiciones de desafiar la autoridad de Antípatro y potencialmente casarse con Cleopatra, la hermana de Alejandro, Leonato murió en batalla, dejando sus aspiraciones sin cumplir.\n\nEl control de la satrapía pasó luego a Arrideo, quien lo mantuvo hasta la partición de Triparadisus (321 a. C.), después de lo cual Clito el Blanco fue asignado como sátrapa. El gobierno de Clitus fue breve. Fue derrotado y asesinado en 317 a. C. Por Arrideo. Su sucesor, Ardys, gobernó durante un período incierto antes de que el poder volviera a cambiar. Fénix de Tenedos, un subordinado leal de Antígono, gobernó la región durante un tiempo, seguido por el sobrino de Antígono, Polemaio, otro de los generales de Antígono. Sin embargo, después del suicidio forzado de Polemaio, la satrapía ha desaparecido.\n\nAhora el control de la Frigia helespontina ha caído a [ROOT.GetCountry.GetRuler.GetPraenomen]. Si bien podríamos seguir el ejemplo de Antígono y simplemente absorber la satrapía, tenemos la oportunidad de establecer una nueva base de poder para nuestra dinastía. La propuesta de [attalid_head.GetPraenomen] de que Asia fuera gobernada por un gobernador o incluso un rey con fuertes conexiones locales fue inspirada, pero [attalid_head.GetPraenomen] claramente no era adecuado para tal tarea. [agathocles_scope.GetPraenomen] es increíblemente popular entre nuestros súbditos asiáticos y es sin duda uno de nuestros administradores más hábiles. [agathocles_scope.GetPraenomen] siempre ha sido un firme partidario de [ROOT.GetCountry.GetRuler.GetPraenomen]. Dado que la sangre de Alkimachus corre por sus venas, su lealtad a nuestra dinastía está fuera de toda duda. Los hombres afirman que [agathocles_scope.GetPraenomen] conquistó Frigia Helespontina casi sin ayuda de nadie, expulsándolos. Y tal vez lo hizo. ¿No merece tal hombre el manto de Leonato?"
 diadochi_flavor.78.a:0 "No hay mejor hombre para gobernar la Frigia helespontina."
 diadochi_flavor.78.at:0 "#Y Frigia helespontina#! ganará todos nuestros territorios en Eolia, Mysia Superioris, Mysia Inferioris, Sangarios, Bitinia y Mariandynia.\n#Y Frigia helespontina#! se convertirá en una #Y Satrapía#! de #Y [THIS.GetCountry.GetName]#!.\n#Y [agathocles_scope.GetName]#! se convertirá en el gobernante de #Y Frigia helespontina#!"
 diadochi_flavor.78.b:0 "La Frigia helespontina se disolvió por una razón."

 diadochi_flavor.79.t:0 "La cuestión lesbiana"
 diadochi_flavor.79.desc:0 "Los enviados de Mitilene en Lesbos han enviado un llamamiento a [THIS.GetCountry.GetCapital.GetName], solicitando que reconozcamos su autonomía de la Liga Eólica. Argumentan que el continente seguirá envuelto en las luchas de los Diadochi durante los próximos años y que Mitilene, segura en su isla, estaría mejor si se separara formalmente del resto de Aeolis.\n\nA cambio de nuestro reconocimiento, Lesbos proporcionará un tributo escaso pero constante. Sin embargo, otorgar dicha autonomía podría alentar a otros a exigir concesiones similares."
 diadochi_flavor.79.a:0 "Lesbos tendrá su autonomía."
 diadochi_flavor.79.at:0 "¡#E Lesbos#! se convierte en #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Afluente#!"
 diadochi_flavor.79.b:0 "La Liga Eólica debe permanecer unida."

diadochi_flavor.80.t:0 "Lésbos autónomos"
diadochi_flavor.80.desc:0 "Ha llegado noticia de [GetCountry('TRE').GetCapital.GetName] de que los Alkimachids han acordado reconocer formalmente la autonomía de Lesbos. A cambio de este reconocimiento, se espera que brindemos un tributo magro pero constante."
diadochi_flavor.80.a:0 "Un precio necesario por nuestra libertad."
diadochi_flavor.80.at:0 "#G Desbloquear#! #E Tareas lesbianas#! para el #E #T Resurgimiento jónico#! Árbol de misiones#!"

diadochi_flavor.81.t:0 "La Liga se mantiene firme"
diadochi_flavor.81.desc:0 "Ha llegado noticia de [GetCountry('TRE').GetCapital.GetName] de que los Alkimachids decretaron que la Liga Eólica debe permanecer unida, sin tener en cuenta nuestras preocupaciones sobre los peligros que enfrenta el continente. Por ahora, Mitilene sigue ligada a la Liga y debemos seguir compartiendo sus cargas. Aunque el futuro es incierto, no hay duda de que nuestro pueblo recordará este desaire."
diadochi_flavor.81.a:0 "Debemos aguantar por ahora."

 diadochi_flavor.82.t:0 "Al otro lado del Egeo"
 diadochi_flavor.82.desc:0 "Ha llegado la noticia a [ROOT.GetCountry.GetCapital.GetName] de que nuestras tropas asiáticas restantes se están concentrando en Éfeso, preparándose para navegar de regreso a [ROOT.GetCountry.GetCapital.GetName]. Sin embargo, quedan fuerzas simbólicas en Quíos y Éfeso, ciudades que siguen siendo leales a nuestra causa. Si les permitimos partir también, perderemos por completo nuestro dominio sobre Asia; El tesoro y el templo de Éfeso seguramente serán saqueados por nuestros enemigos. Quizás en lugar de dirigirse a [ROOT.GetCountry.GetCapital.GetName], nuestras tropas asiáticas deberían quedarse y reforzar las guarniciones de Quíos y Éfeso, garantizando que estas ciudades leales y ricas permanezcan seguras. Algunos en [ROOT.GetCountry.GetCapital.GetName] sugieren que se enviarían más tropas a través del Egeo para guarnecer todas las ciudades de Jonia."
 diadochi_flavor.82.a:0 "Éfeso debe permanecer inviolable."
 diadochi_flavor.82.at:0 "¡#E Éfeso#! se convierte en un #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Estado del templo#!"
 diadochi_flavor.82.b:0 "Deja una fuerza simbólica en Quíos y Éfeso."
 diadochi_flavor.82.bt:0 "¡#E Quíos#! se convierte en #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Afluente#!\n#E Éfeso#! se convierte en un #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Estado del templo#!"
#Ephesus and Chios (token force to ensure the wealthiest cities are not left for our enemies) temple state and tributary (30)
 diadochi_flavor.82.c:0 "Las tropas asiáticas deben complementar las guarniciones locales."
 diadochi_flavor.82.ct:0 "¡#E Quíos#! se convierte en #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!\n#E ¡Éfeso#! se convierte en un #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!"
#Feudatories (30)
diadochi_flavor.82.d:0 "Envía más tropas a la guarnición de Jonia."
#All of IOnia (40)
 diadochi_flavor.82.e:0 "Volveremos, para recuperar lo perdido."
 
 EPHESUS_NAME:0 "Éfeso"
 EPHESUS_ADJECTIVE:0 "Efesio"
 CHIOS_NAME:0 "Quíos"
 CHIOS_ADJECTIVE:0 "Chián"


 diadochi_flavor.83.t:0 "La causa antigónida vacila"
 diadochi_flavor.83.desc_1:1 "\n\nAunque no hemos podido aprovechar tanto estos acontecimientos como sus vecinos directos, nuestros soldados y partisanos aprovecharon la oportunidad para tomar el control de las [GetCountry('PRY').GetAdjective] guarniciones en el continente [GetProvince('(int32)418').GetArea.GetRegion.GetName] mientras se recuperaban de la noticia de la muerte de su rey..."
 diadochi_flavor.83.desc_2:0 "\n\nAunque no pudimos expulsar a las [GetCountry('PRY').GetAdjective] guarniciones en el continente [GetProvince('(int32)418').GetArea.GetRegion.GetName], la llegada de la desgracia a las Antigónidas siempre es bienvenida..."
 diadochi_flavor.83.desc_3:0 "[pleistarchus_scope.GetPraenomen] es a la vez un amigo de confianza de [GetCountry('TRE').GetRuler.GetPraenomen] y un pariente de [GetCountry('MAC').GetRuler.GetPraenomen]. En reconocimiento a su papel instrumental en la orquestación de la caída de las Antigónidas, se ha decidido que se le concederá la satrapía de #E @[GetCountry('CIA').GetFlag]. [GetCountry('CIA').GetName]#! como recompensa.\n\nPara calmar las preocupaciones de [GetCountry('EGY').GetRuler.GetPraenomen] y [GetCountry('SEL').GetRuler.GetPraenomen], a [pleistarchus_scope.GetPraenomen] se le concederá un gobierno independiente sobre su nueva provincia, sin estar sujeto a ningún hombre. Sin embargo, dados sus vínculos personales, seguramente cultivará una relación cercana tanto con [GetCountry('TRE').GetRuler.GetName] como con [GetCountry('MAC').GetRuler.GetName]."
 diadochi_flavor.83.desc_4:0 ""
 diadochi_flavor.83.a:0 "¡Ay de los vencidos...!"
 diadochi_flavor.83.at:0 "[pleistarchus_scope.GetPraenomen] se unirá en #Y Caria#! a sus oficiales de confianza [eupolemos_scope.GetPraenomen] y [perilaos_scope.GetPraenomen]"
 chalkis_transfer.tt:0 "@[chalkis_country.GetFlag]!  ¡[chalkis_country.GetName] se convierte en #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!"
 aigina_transfer.tt:0 "@[chalkis_country.GetFlag]!  ¡[chalkis_country.GetName] se convierte en #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!"


 diadochi_flavor.84.t:0 "La causa antigónida vacila"
 diadochi_flavor.84.desc:0 "[pleistarchus_scope.GetPraenomen] es a la vez un amigo de confianza de [GetCountry('TRE').GetRuler.GetPraenomen] y un pariente de [GetCountry('MAC').GetRuler.GetPraenomen]. En reconocimiento a su papel instrumental en la orquestación de la caída de las Antigónidas, se ha decidido que se le concederá la satrapía de #E @[GetCountry('CIA').GetFlag]. [GetCountry('CIA').GetName]#! como recompensa.\n\nPara calmar las preocupaciones de [GetCountry('EGY').GetRuler.GetPraenomen] y [GetCountry('SEL').GetRuler.GetPraenomen], a [pleistarchus_scope.GetPraenomen] se le concederá un gobierno independiente sobre su nueva provincia, sin estar sujeto a ningún hombre. Sin embargo, dados sus vínculos personales, seguramente cultivará una relación cercana tanto con [GetCountry('TRE').GetRuler.GetName] como con [GetCountry('MAC').GetRuler.GetName]. \n\n[old_caria_ruler.GetName] se apaciguará con honoríficos y gestos ceremoniales, pero [old_caria_ruler.GetSheHe] seguramente se irritará bajo el régimen de [pleistarchus_scope.GetPraenomen]."
 diadochi_flavor.84.a:0 "¡Ay de los vencidos...!"
 diadochi_flavor.84.at:0 "#E [pleistarchus_scope.GetPraenomen]#! se unirá en #Y Caria#! a sus oficiales de confianza #E [eupolemos_scope.GetPraenomen]#! y #E [perilaos_scope.GetPraenomen]#!"
 loyalty_new_management:0 "Nueva Gerencia"

 diadochi_flavor.85.t:0 "Vientos de cambio"
 diadochi_flavor.85.desc:0 "Las mareas de poder entre los Diadochi han cambiado una vez más. A raíz del colapso de Antigonid, nuestro destino se ha visto arrastrado por las ambiciones de [pleistarchus_scope.GetPraenomen].\n\nUn aliado leal de [GetCountry('TRE').GetRuler.GetPraenomen] y pariente de [GetCountry('MAC').GetRuler.GetPraenomen], ¡a [pleistarchus_scope.GetPraenomen] se le ha concedido la satrapía de #E @[GetCountry('CIA').GetFlag]! [GetCountry('CIA').GetName]#! como recompensa por su leal servicio. Nuestras tierras han sido adscritas formalmente a su nueva satrapía, y sus agentes ahora supervisan nuestra administración."
 diadochi_flavor.85.a:0 "Los débiles deben hacer lo que se les dice."
 diadochi_flavor.85.at:0 "¡Ahora somos sujeto de [new_overlord.GetName|Y] @[new_overlord.GetFlag]!"

 diadochi_flavor.86.t:0 "Esquilo de Rodas"
 diadochi_flavor.86.desc:0 "La traición de los atenienses duele aún más por los símbolos que ahora aferran: las islas de Lemnos e Imbros, regalos que alguna vez fueron devueltos en forma de amistad cuando Demetrio liberó Atenas en 307 a.C. Parece que la gratitud dura poco en Hellas. Ahora, esas mismas islas se han vuelto a escapar de nuestras manos, reclamadas por aquellos que escupen en nuestro nombre.\n\n#E Esquilo de Rodas#!, el antiguo comandante de la guarnición de la isla, todavía inspira respeto entre los aristoi y capitanes de puerto locales. Él cree que con una fuerza modesta, puede regresar y reunir apoyo para expulsar a nuestros enemigos de las islas."
 diadochi_flavor.86.a:0 "Esquilo recuperará lo que es nuestro."
 diadochi_flavor.86.at:0 "#E Lemnos#! se convierte en un #Y Feudatorio#! de [SCOPE.GetRootScope.GetCountry.GetName]"
 diadochi_flavor.86.b:0 "¿Por qué no guarnecer también Skyros?"
 diadochi_flavor.86.bt:0 "#E Lemnos#! se convierte en un #Y Feudatorio#! de [SCOPE.GetRootScope.GetCountry.GetName]\n#E Skyros#! pasa a ser propiedad de #Y Lemnos#!"
 diadochi_flavor.86.c:0 "Que se pudran con sus amigos atenienses."
 diadochi_flavor.86.ct:0 "#R No pasa nada#!"
 LEMNOS_NAME:0 "lemnos"
 LEMNOS_ADJECTIVE:0 "lemniano"

 diadochi_flavor.87.t:0 "Esquilo de Rodas"
 diadochi_flavor.87.desc:0 "Ha llegado [ROOT.GetCountry.GetCapital.GetName] la noticia de que #E Esquilo de Rodas#!, el antiguo comandante de la guarnición antigónida de Lemnos e Imbros, ha retomado las islas. Con la ayuda de gente local comprensiva y de viejos contactos, ha logrado desalojar nuestra presencia allí."
 diadochi_flavor.87.a:0 "Malditos sean todos."
 diadochi_flavor.87.at:0 "#E Lemnos#! se convierte en un #Y Feudatorio#! de [GetCountry('PRY').GetName]"
 diadochi_flavor.87.at1:0 "E Skyros#! pasa a ser propiedad de #Y Lemnos#!"

 diadochi_flavor.88.t:0 "Intimidación de Beocia"
 diadochi_flavor.88.desc:0 "Felipe II rompió el poder de Tebas en Queronea en 338 a. C. Y Onchesto se erigió como nueva capital de la Liga Beocia. En 335 a. C., Alejandro arrasó Tebas en represalia por su revuelta, y aunque Casandro comenzó su reconstrucción en 316, las cicatrices de la conquista persistieron. Desde la restauración de las murallas de Tebas, ésta sirvió como fortaleza macedonia bajo su influencia. Polemaio expulsó a la guarnición de la ciudad en 312 a. C., y durante su rebelión contra Antígono Monoftalmos, Tebas, junto con el resto de Beocia, sin duda formó parte de su breve dominio. Después de la muerte de los traidores, Casandro rápidamente reafirmó el control de la ciudad.\n\nEn el vacío que siguió a la caída de Polemaio, la Liga Beocia se extralimitó. Chalkis y Eretria, ciudades que quedaron expuestas sin un protector, se unieron a su koinon, dando a la Liga un punto de apoyo en Euboia y el control de Euripus. Aunque se consideran aliados de la Casa de Antígonos, nuestros informantes dicen que, de hecho, se han confabulado con Cassandros. Debe haber un ajuste de cuentas por su comportamiento. Demetrio ha desembarcado con un ejército en Aulis, a pocos estadios de Chalkis..."
 diadochi_flavor.88.a:0 "La Liga Eubea contrarrestará el poder de los Beocios."
 diadochi_flavor.88.at:0 "¡Una demanda para el @[GetCountry('BOE').GetFlag]! Se enviarán #Y [GetCountry('BOE').GetAdjective]#! para retirarse de Eubea.#!\nSi #G aceptan:#!\n#E Eubea#! se convierte en un #Y Feudatorio#! de [GetCountry('PRY').GetName]\nSi #R se niegan#!:"
 diadochi_flavor.88.b:0 "¡Los traidores deben aceptar guarniciones!"
 diadochi_flavor.88.bt:0 "¡Una demanda para el @[GetCountry('BOE').GetFlag]! Se enviarán #Y [GetCountry('BOE').GetAdjective]#! a someterse a guarniciones.#!\nSi #G aceptan:#!\n#E Beocia#! se convierte en un #Y Feudatorio#! de [GetCountry('PRY').GetName]\nSi #R se niegan#!:"
 diadochi_flavor.88.c:0 "Deben repudiar a Kassandros."
 diadochi_flavor.88.ct:0 "¡Una demanda para el @[GetCountry('BOE').GetFlag]! Se enviarán #Y [GetCountry('BOE').GetAdjective]#! para desautorizar a Cassandros.#!\nSi #G aceptan:#!\n#E Beocia#! deja de ser #Y Aliado#! de [GetCountry('MAC').GetName]"

 diadochi_flavor.89.t:0 "El regreso de los antigónidas: retirada de Eubea"
 diadochi_flavor.89.desc:0 "Demetrio desembarcó en Áulide con un ejército y envió enviados exigiendo que retiremos nuestras guarniciones de Calcis y Eretria. Estas ciudades, declaradas libres por los Antigónidas, han sido ocupadas por nuestra Liga sin autorización. Los embajadores dejan claro que nuestros tratos secretos con Cassandros y la ocupación ilegal de Eubea nos han hecho sospechosos ante los ojos del rey. Demetrio tiene la intención de restaurar la independencia de los eubeos bajo una Liga Eubea reconstituida."
 diadochi_flavor.89.a:0 "Nos retiraremos."
 diadochi_flavor.89.at:0 "Todas las #E provincias beocias#! de Eubea pasan a ser propiedad de #E Eubea#!\n#E Eubea#! se convierte en un #Y Feudatorio#! de [GetCountry('PRY').GetName]"
 diadochi_flavor.89.b:0 "¡No cederemos a Eubea!"

 diadochi_flavor.90.t:0 "El regreso de las Antigónidas: Beocia encadenada"
 diadochi_flavor.90.desc:0 "Demetrio ha desembarcado en Áulide con un ejército y ha enviado enviados exigiendo que admitamos guarniciones antigónidas en nuestras ciudades. Nuestros tratos secretos con Kassandros y la ocupación ilegal de Eubea nos han hecho sospechosos ante los ojos del Rey..."
 diadochi_flavor.90.a:0 "Con mucho gusto aceptaremos guarniciones."
 diadochi_flavor.90.b:0 "Beocia seguirá siendo libre."

 diadochi_flavor.91.t:0 "El regreso de las Antigónidas: ruptura con Cassandros"
 diadochi_flavor.91.desc:0 "Demetrio ha desembarcado en Áulide con un ejército y ha enviado enviados exigiendo que admitamos guarniciones antigónidas en nuestras ciudades. Nuestros tratos secretos con Cassandros y la ocupación ilegal de Eubea nos han hecho sospechosos ante los ojos del rey. Sus embajadores han dejado claro que si queremos evitar represalias, debemos renunciar públicamente a todos los vínculos con Kassandros."
 diadochi_flavor.91.a:0 "Una oferta razonable."
 diadochi_flavor.91.b:0 "Podemos jugar en ambos lados..."

 diadochi_flavor.92.t:0 "Liga de los Eubeos"
 diadochi_flavor.92.desc:0 "Durante mucho tiempo divididas entre grandes potencias, las ciudades de Eubea a menudo han carecido de la unidad necesaria para hacer frente a las ambiciones de sus vecinos. Se ha proclamado una nueva koinon, la Liga de los Eubeos, con sede en Chalkis y gobernada por un consejo federal. Al declarar lealtad a la Casa de Antígonos y el principio de autonomía, la Liga ofrece una visión de defensa y prosperidad compartidas en Eubea. Queda por ver si esta frágil unidad podrá perdurar bajo la presión de la política macedonia."
diadochi_flavor.92.desc_DEL:0 "\nKeos tiene tratados isopolitea tanto con Oreos como con Eritrea, tal vez le iría mejor en un Koinon eubeo que en uno nessiótico."
 diadochi_flavor.92.a:0 "Eubea se eleva una vez más."
 diadochi_flavor.92.tt:0 "#E Eubea#! se convierte en un #Y Feudatorio#! de [GetCountry('PRY').GetName]"
 diadochi_flavor.92.b:0 "Las galletas Oreo se unirán al koinon."
 diadochi_flavor.92.c:0 "Keos se unirá a su koinon."

 diadochi_flavor.93.t:0 "El destino de Salamina"
 diadochi_flavor.93.desc:0 "La isla de Salamina, que se dice que lleva el nombre de la ninfa Salamina y que una vez estuvo gobernada por el mítico rey Cicreo, fue disputada por Megara y Atenas durante el período Arcaico tardío. Después de una guerra prolongada, atribuida indistintamente a Solón o Peisistratos, Atenas aseguró el control, y un arbitraje espartano confirmó más tarde su reclamo. Desde finales del siglo VI a. C., Salamina estuvo habitada por klerouchoi atenienses que debían tributo y servicio militar a la ciudad madre. Los salamininos nativos nunca obtuvieron la ciudadanía ateniense plena, pero mantuvieron su propio demos junto al ateniense en la isla. Salamina sirvió como base naval vital para Atenas y puerta de entrada al Golfo Sarónico. Fue el lugar de la decisiva victoria griega sobre Persia en el año 480 a.C.\n\nEn la última lucha, [GetCharacter('(int32)38').GetPraenomen] expulsó la guarnición de Casandro y puso el orden Antigónida en la isla. Con el fin de esta ronda de combates, ha llegado el momento de reevaluar el estatus de los salaminianos."
 diadochi_flavor.93.a:0 "De ahora en adelante, Salamina será libre y autónoma."
 diadochi_flavor.93.at:0 "#E Salamina#! se convierte en un #Y Feudatorio#! de [GetCountry('PRY').GetName]\nCada #Y país helénico#! en el continente [GetProvince('(int32)418').GetArea.GetRegion.GetName] ganará #G 15#! opinión de [GetCountry('PRY').GetName]."
 diadochi_flavor.93.b:0 "Que los atenienses gobiernen a los salaminios."
 diadochi_flavor.93.bt:0 "#E Salamina#! pasa a ser gobernada por #E Atenas#!"
 diadochi_flavor.93.c:0 "Instalaremos una guarnición pesada en la llave del Sarónico."
 diadochi_flavor.93.ct:0 "Cada #Y país helénico#! del continente [GetProvince('(int32)418').GetArea.GetRegion.GetName] perderá #R -15#! opinión de [GetCountry('PRY').GetName]."

#Aristodemos - mercenary captain - Theangela


 chronos.1.a:0 "La gloria nos espera con Filadelfo al mando."
 chronos.1.b:0 "Permaneceremos con Keraunos."
 chronos.1.desc:0 "Durante mucho tiempo Ptolomeo Keraunos ha sido nuestro favorito, pero recientemente Ptolomeo Filadelfo ha demostrado que sería más adecuado para el trono. A medida que pasan los años, sería mejor abdicar ahora en favor del verdadero heredero y pasar nuestros últimos días en paz."
 chronos.1.t:0 "El mejor Ptolomeo"
 chronos.2.a:0 "Arsínoe jura que su hermano sería un gran activo."
 chronos.2.b:0 "Esto solo causará problemas; mándalo de vuelta."
 chronos.2.desc:0 "Ha llegado un visitante por mar: nada menos que Ptolomeo Keraunos, el antiguo heredero del trono egipcio. Ha huido de las tierras del Nilo después de que su padre eligiera a su hermano por encima de él. Ahora debemos tomar una decisión."
 chronos.2.t:0 "El rayo cae"
 chronos.3.a:0 "Ya no está en nuestras manos."
 chronos.3.desc:0 "Ptolomeo Keraunos ha huido a Lisímaco, que le ha dado refugio. Quizá él y su hermana estén tramando algo contra nosotros."
 chronos.3.t:0 "El sonido del trueno"
 chronos.4.a:0 "Que la misericordia nos reconcilie."
 chronos.4.b:0 "Hiciste bien en huir la primera vez, hermano."
 chronos.4.desc:0 "Ptolomeo Keraunos ha sido devuelto tras huir a Lisímaco, que parece habernos hecho un favor. Algún día se lo devolveremos, pero por ahora tenemos un posible usurpador con el que lidiar."
 chronos.4.t:0 "Un hermano regresa"
 flavor_krk_pry_marriage_op:0 "Matrimonio Antigónida-Agathoklid"
 flavor_krk_pry_rejected_op:0 "Matrimonio Antigónida-Agathoklid rechazado"
 flavor_syr_epi_marriage_op:0 "Matrimonio Aiakidai-Agathoklid"
 flavor_syr_epi_rejected_op:0 "Matrimonio Aiakidai-Agathoklid rechazado"
 
 icarus.1.a:0 "Que los tracios regresen al Mármara."
 icarus.1.desc:0 "Ha llegado un informe de que Lisímaco ha mandado matar a su propio hijo y heredero, Agatocles. Parece que Arsínoe quiere que su propia descendencia reine en el reino del norte. Pero en lugar de este tirano filicida, es nuestra línea la que unirá toda Asia bajo un solo gobierno."
 icarus.1.t:0 "La locura de Lisímaco"
 icarus.2.a:0 "Los tambores de guerra suenan."
 icarus.2.desc:0 "Hemos reclamado nuestro derecho y ordenado a nuestros ejércitos. Pronto nuestro reino volverá a mirar al Egeo y nosotros, como Dédalo e Ícaro, creceremos alas y perseguiremos el sol al ponerse en Occidente."
 icarus.2.t:0 "Ícaro vuela"


 epigoni.1.t:0 "Keraunos: la ambición del rayo"
 epigoni.1.desc:0 "A medida que [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen] envejece, la cuestión de la sucesión se vuelve cada vez más apremiante. El heredero de [ROOT.GetCountry.GetRuler.GetPraenomen], [ptolemy_keraunos_scope.GetName], ha presionado agresivamente para obtener una mayor responsabilidad, citando el precedente de co-gobierno establecido por Antigonos y Seleukos.\n\nSin embargo, el temperamento infame y la disposición despiadada de [ptolemy_keraunos_scope.GetName] llevaron a que los miembros de la corte lo llamaran 'Keraunos' o 'el Rayo'. Muchos de los asesores de [ROOT.GetCountry.GetRuler.GetPraenomen] han expresado en privado su preocupación sobre la idoneidad de [ptolemy_keraunos_scope.GetPraenomen] como futuro líder de [ROOT.GetCountry.GetName]. Incluso algunos funcionarios hablan tranquilamente de que [ptolemy_other_heir_scope.GetPraenomen] es más adecuado para el trono. Es probable que estalle un conflicto entre los dos si la cuestión de la sucesión no se resuelve pronto. Lo mejor sería abdicar ahora en favor del verdadero heredero y pasar nuestros últimos días en paz."
 epigoni.1.a:0 "Keraunos compartirá la carga del gobierno."
 epigoni.1.b:0 "La gloria espera a [ptolemy_other_heir_scope.GetPraenomen] al mando."
 epigoni.1.bt:0 "#R Esto puede tener consecuencias desafortunadas#!"
 epigoni.1.c:0 "No es necesario modificar todavía la sucesión."
 epigoni.1.ct:0 "No pasa nada"
 the_thunderbolt_modifier:0 "Keraunos"

 epigoni.2.t:0 "Ascensión de [former_ruler.GetPraenomen]: Matrimonio Faraónico"
 epigoni.2.desc:0 "Los Textos de las Pirámides describen la naturaleza del Faraón en diferentes personajes, como Horus y Osiris. El Faraón como Horus en vida se convierte en el Faraón como Osiris en la muerte, donde se une a los demás dioses. Nuevas encarnaciones de Horus sucedieron al faraón fallecido en la tierra en forma de nuevos faraones. Mientras [former_ruler.GetName] se prepara para descender al inframundo, [ROOT.GetCountry.GetRuler.GetName] debe ascender para cumplir el papel de un verdadero faraón egipcio.\n\nSegún los [ROOT.GetCountry.GetRuler.GetHerHis] sacerdotes, muchos de los [ROOT.GetCountry.GetRuler.GetHerHis] predecesores faraónicos participaron en la práctica del matrimonio familiar para mantener la pureza de su línea real y honrar el matrimonio consanguíneo entre Osiris y su hermana, Isis. Casarse con [pharaonic_wife_scope.GetName] sería seguir los pasos de los propios dioses. Una medida así sin duda nos congraciaría a nosotros mismos y a los [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] posteriores con los egipcios nativos, pero podría poner nerviosos a nuestros súbditos griegos..."
 epigoni.2.a:0 "Seguiremos el ejemplo de Osiris."
 epigoni.2.b:0 "No se tolerará semejante barbaridad."
 refused_barbaric_practices:0 "Prácticas incestuosas rechazadas"
 embraced_barbaric_practices:0 "Prácticas incestuosas"
 embraced_local_customs:0 "Adoptó las costumbres locales"
 flouted_local_customs:0 "Se burlaron de las costumbres locales"

 epigoni.3.t:0 "Keraunos: La furia del rayo"
 epigoni.3.desc:0 "Tras la abdicación de su padre, [ptolemy_other_heir_scope.GetPraenomen] asumió el título de faraón, dejando a [ptolemy_keraunos_scope.GetName] furioso y sintiéndose traicionado. En un ataque de ira, #E Keraunos#! irrumpe en el tribunal gritando: '¡Me has robado mi derecho de nacimiento!'\n\nSu temperamento asegura a los miembros de la corte que decidieron no apoyar la ascensión del 'Thunderbolt'. Sin embargo, a pesar de su ira, hay un rayo de razón en sus ojos, lo que sugiere que aún puede apaciguarse. Demasiado orgulloso para pedir algo directamente, #E Keraunos#! advierte que si no se le da un trono donde sentarse, viajará al extranjero para solicitar apoyo a los demás herederos de Alejandro para reclamar el trono de su padre. Quizás una satrapía podría satisfacerlo, otorgándole una apariencia de la autoridad que busca mientras mantiene segura la corona."
 epigoni.3.a:0 "[ptolemy_keraunos_scope.GetSheHe] tendrá un trono, pero no el mío."
 epigoni.3.at:0 "#E Cyrenacia#! se apoderará de todos nuestros territorios en las Áreas de #Y Cyrenacia#!, #Y Barka#! y #Y Syrtica#!."
 epigoni.3.b:0 "No podemos mostrar debilidad."
 epigoni.3.bt:0 "#R Keraunos viajará al extranjero#!"
 epigoni.3.c:0 "¿Quizás [ptolemy_keraunos_scope.GetName] podría ser nombrado mi heredero?"
 epigoni.3.ct:0 "#E Keraunos#! será nombrado heredero y #E podrá#! ser aplacado"
 #50% chance that he attempts to poison the ruler in the next year. 50% chance it works. if it doesn't he will flee


        #trigger event where Keraunos demands an autonomous satrapy (check to see if we hold anything valid)
        #if we say know, he flee to another state and ask for help prosecuting a civil war
        #Unknown wife of Ceranus, possibly a daughter of Lysimachus2, probably married to Ptolemy Ceraunus3 c300/2954, by whom she probably had a daughter. - probably happened when arsione ii did, but I'll leave it to happen with these events
        #The diadochi (will be thrace if they are big enough) will have an option to mary him to their daughter (make a relative if need be) and offfer
        #this gives his new home a decision to support his claims, starting a civil war and joining on his side
        #they can instead choose to reward his loyal service by giving him a satrapy if they have a valid 

#Agathokles ruled the asian part of the kingdom

 epigoni.4.t:0 "Caída de [agathocles_scope.GetPraenomen]: Conspiración"
 epigoni.4.desc:0 "En el tribunal de [ROOT.GetCountry.GetRuler.GetPraenomen], las tensiones aumentan cuando su ambiciosa esposa, [thrace_wife_scope.GetPraenomen], se acerca al [ROOT.GetCountry.GetRulerTitle] con graves acusaciones. '¡Tu heredero [agathocles_scope.GetPraenomen] conspira con Seleukos para usurpar tu trono!' ella declara, su voz mezclada con ambición. 'Busca aprovechar su base de poder en Asia para montar una guerra civil y asesinar a sus herederos, ¡mis hijos!' El tribunal bulle de murmullos mientras [ROOT.GetCountry.GetRuler.GetPraenomen] sopesa las implicaciones de sus palabras. [agathocles_scope.GetPraenomen] no ha sido más que un hijo obediente, pero seguramente [thrace_wife_scope.GetPraenomen] no haría tales acusaciones sin pruebas."
 epigoni.4.a:0 "El trono debe permanecer seguro para mis verdaderos herederos."
 loyalty_heir_disinherited:0 "Desheredado"
#change heir + agathocles loses loyalty
#unrest event
 epigoni.4.b:0 "[agathocles_scope.GetPraenomen] no es un traidor."
 loyalty_plot_ignored_advice:0 "Consejos ignorados"
 #Arisonoe loses loyalty  accusations happensn in two years if agathocles isnt ruler and arsinoe is still alive
 epigoni.4.c:0 "La Frigia helespontina contentaría a cualquier príncipe."
#change heir 
#create satrapy
#unrest event
#The historian Louis Robert has suggested that 300 era coins bearing the letters ΑΓΑΘ originate from Agathocleia, a city in Mysia founded by Agathocles.


 epigoni.5.t:0 "Caída de [agathocles_scope.GetPraenomen]: disturbios"
 epigoni.5.desc:0 "Tras la decisión de [ROOT.GetCountry.GetRuler.GetPraenomen] de eliminar a [agathocles_scope.GetPraenomen] de la sucesión de [ROOT.GetCountry.GetAdjective], el descontento crece entre los partidarios de [agathocles_scope.GetPraenomen] en la Frigia Helespontina. Según los informes, se reúnen en las calles gritando: \"¡Nuestro príncipe ha sido agraviado!\". Mientras tanto, [thrace_wife_scope.GetPraenomen] conspira más allá, susurrando a [ROOT.GetCountry.GetRuler.GetPraenomen] sobre los supuestos peligros que [agathocles_scope.GetPraenomen] representa para la estabilidad del reino. \"Él es una amenaza para su legado\", insiste. 'Hay que ocuparse de él...'"
 epigoni.5.a:0 "[agathocles_scope.GetPraenomen] merece [agathocles_scope.GetHerHis] el lugar que le corresponde."
 epigoni.5.at:0 "Todas las provincias de propiedad en las regiones de Asia y Bitinia ganarán lealtad."
 epigoni.5.at1:0 "#E [agathocles_scope.GetPraenomen]#! regresa a [ROOT.GetCountry.GetCapital.GetName] y será nombrado heredero"
 epigoni.5.b:0 "Unas gotas de veneno podrían acabar con esta crisis."
 epigoni.5.bt:0 "#E [agathocles_scope.GetPraenomen]#! sobrevive al intento"
#chance he dies / or he will spit out the poison and launcch a war to claim his throne. he circulates proclamations saying that his father has gone mad under the influence of his wife
#50/50 Manikos or Abdication event
 epigoni.5.c:0 "Las cosas se calmarán con el tiempo."
#25% of manikos


 epigoni.6.t:0 "Caída de [agathocles_scope.GetPraenomen]: Acusaciones"
 epigoni.6.desc:0 "En un sorprendente giro de los acontecimientos, [thrace_wife_scope.GetPraenomen] acusó públicamente a [agathocles_scope.GetPraenomen] de agredirla después de un gran banquete en [ROOT.GetCountry.GetCapital.GetName], afirmando: '¡Ha traído vergüenza a la casa de [ROOT.GetCountry.GetRuler.GetName]!' Ella exige justicia permanente e inmediata, insistiendo en que [ROOT.GetCountry.GetRuler.GetPraenomen] debe actuar para proteger el honor de su familia. Esto suena muy fuera de lugar para [agathocles_scope.GetPraenomen] y [thrace_wife_scope.GetPraenomen] tiene mucho que ganar si muere..."
 epigoni.6.a:0 "Un poco de veneno nunca hace daño a nadie..."
 epigoni.6.at:0 "#E [agathocles_scope.GetPraenomen]#! sobrevive al intento"
 #death
#manikos event in 20 - 40 days
 epigoni.6.b:0 "¡[agathocles_scope.GetPraenomen] es inocente y no debe sufrir por sus mentiras!"
#[thrace_wife_scope.GetPraenomen] (and her children) losses a ton of loyalty
 loyalty_plot_ignored_allegations:0 "Acusaciones ignoradas"


 epigoni.7.t:0 "Caída de [ROOT.GetCountry.GetRuler.GetPraenomen]: Manikos"
 epigoni.7.desc:0 "Tras el asesinato de [agathocles_scope.GetPraenomen], las provincias de Asia estallan en el caos. Los leales acuden a su memoria gritando: '¡[ROOT.GetCountry.GetRuler.GetPraenomen] ha matado a nuestro príncipe!' Mientras las ciudades arden y el malestar se extiende, el pueblo denuncia a [ROOT.GetCountry.GetRuler.GetPraenomen] por su decisión tiránica. '¡Tu gobierno es una maldición!' lloran. La familia \n\n[agathocles_scope.GetPraenomen], temiendo por sus vidas, ha huido a [GetCountry('SEL').GetRuler.GetName], buscando refugio y apoyo potencial contra [ROOT.GetCountry.GetRuler.GetPraenomen]. Muchos en [ROOT.GetCountry.GetName] creen que [ROOT.GetCountry.GetRuler.GetPraenomen] se ha vuelto loco y se refieren a él como 'Manikos'. Antiguos aliados de [agathocles_scope.GetPraenomen] se movilizan en busca de venganza contra [ROOT.GetCountry.GetRulerTitle] que ha abandonado su propia sangre."
 epigoni.7.a:0 "¡NO ESTOY LOCO!"
#manikos
#all subjects in asia rebel
#Hellespontine phrygia is created if it doesnt exist and rebels

 epigoni.8.t:0 "Caída de [ROOT.GetCountry.GetRuler.GetPraenomen]: Abdicación"
 epigoni.8.desc:0 "Un mensajero irrumpe en la corte de [ROOT.GetCountry.GetRuler.GetPraenomen], pálido y sin aliento. '¡Mi [ROOT.GetCountry.GetRulerTitle]! ¡Se ha realizado un intento de asesinato en [agathocles_scope.GetPraenomen]!' exclama. '[agathocles_scope.GetPraenomen] sobrevivió escupiendo el veneno, pero está claro que corre grave peligro. La tensión en el reino ha llegado a un punto de ebullición y los partidarios de su hijo se han unido detrás de él, instando a [agathocles_scope.GetPraenomen] a luchar por su trono. Afirman que te has vuelto loco bajo la influencia de [thrace_wife_scope.GetPraenomen] y exigen justicia por los males cometidos contra su príncipe."
 epigoni.8.a:0 "Las cosas han ido demasiado lejos; Abdicaré en favor de [agathocles_scope.GetPraenomen]."
# Abdication occurs, [agathocles_scope.GetPraenomen] becomes the ruler.
 epigoni.8.b:0 "[thrace_wife_scope.GetPraenomen] tenía razón, [agathocles_scope.GetPraenomen] debe eliminarse."
# civil war



