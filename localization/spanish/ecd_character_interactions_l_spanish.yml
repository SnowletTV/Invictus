 tribal_duel.3.t:0 "Arma Elegida"
 tribal_duel.3.desc:0 "Cada hombre debe llegar a un acuerdo sobre un arma para el duelo. ¿De qué manera [target.GetName] enfrentará [target.GetHerHis] la perdición?"
 tribal_duel.3.a:0 "¡Un hacha para partir a [target.GetFirstName] en pedazos!"
 tribal_duel.3.b:0 "¡Una lanza para atravesar el corazón de [target.GetFirstName]#E 's#!!"
 tribal_duel.3.b_2:0 "¡Una espada para cortar a [target.GetFirstName] en pedazos!"
 tribal_duel.3.c:0 "¡Lucharemos a caballo!"
 tribal_duel.3.d:0 "¡Mataré a [target.GetFirstName] con mis propias manos!"
 tribal_duel.3.e:0 "Retroceder del duelo, como un cobarde."
 tribal_duel_3_hands_tooltip:0 "[fighter_of_duel.GetFirstName] tendrá una menor probabilidad de éxito, pero el prestigio que conlleva matar a un rival con las manos desnudas superará con creces los riesgos."
 tribal_duel_3_horse_tooltip:0 "[target.GetFirstName] ha propuesto que luchemos a caballo... ¿acordamos?"


 tribal_duel.4.t:0 "Un Fin para la Pelea"
 tribal_duel.4.desc:0 "Un resultado que nadie podría haber predicho ha ocurrido; de alguna manera, el duelo terminó en empate. Aún así, nadie puede afirmar que tu honor ha sido mancillado, ya que has luchado valientemente ante dioses y hombres. Admitidamente, tienes un nuevo respeto por [target.GetName]; no muchos han cruzado armas contigo y viven para contarlo después."
 tribal_duel.4.a:0 "[target.GetFirstName] vivirá... por ahora"

 force_divorce:0 "Divorcio Forzado"
 force_divorce_past:0 "Su Unión Debe Ser Disuelta"
 force_divorce_act:0 "Usa el poder del estado para obligar a esta persona a dejar a su cónyuge"
 force_divorce_act_past:0 "¡Serán mucho más felices por ello!"
 force_divorce_tt:0 "Obligas a esta persona a divorciarse de su cónyuge, causando que ellos y sus familias te odien."
 force_divorce_loyalty_tt:0 "Este personaje es demasiado desleal para divorciarse de su cónyuge por orden del estado."
 force_divorce_invention_needed:0 "La invención de oratoria #Y Familia Aprobada#! permitirá el divorcio forzado de personajes fuera de la familia gobernante."
 force_divorce_cooldown_tooltip:0 "El divorcio solo se puede forzar una vez cada #Y 2#! años."

 character_interactions_inv_1_title:0 "Divorcio Forzado"
 character_interactions_inv_1_desc:0 "Como has ordenado, el matrimonio de [target.GetName] y [target_spouse.GetName] ha sido forzado a separarse."
 character_interactions_inv_1.a:0 "Así será"
 character_interactions_1_tooltip:0 "Todos los miembros de la familia #Y [target.GetFamily.GetName]#! recibirán lo siguiente:"

 character_interactions_inv_2_title:0 "Un Divorcio Real"
 character_interactions_inv_2_desc:0 "[target.GetName] no fue suficiente para alguien como [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], y como tal, ha sido informado de que cualquier arreglo previo simplemente ya no existe."
 character_interactions_inv_2.a:0 "Adiós [target.GetName]"

 character_interactions_inv_3_title:0 "Forzar la Jubilación"
 character_interactions_inv_3_desc:0 "[target.GetName] ha sido durante mucho tiempo una espina en el costado de [SCOPE.GetRootScope.GetCountry.GetName]. Forzar a [target.GetName] a la jubilación sería de gran beneficio para todo el pueblo de [SCOPE.GetRootScope.GetCountry.GetName]."
 character_interactions_inv_3.a:0 "[target.GetName] se retirará de la vida pública."
 character_interactions_inv_3.b:0 "Pensándolo bien, esto no es una buena idea."
 character_interactions_inv_3_A_tooltip:0 "Si [target.GetName] #G Acepta#! recibirá lo siguiente:\n"
 character_interactions_inv_3_B_tooltip:0 "\nSi [target.GetName] #R Rechaza#! recibirá lo siguiente:\n"

 character_interactions_4_title:0 "Jubilación"
 character_interactions_4_desc_1:0 "[target.GetName] ha aceptado retirarse. Ya no tendremos que lidiar con sus travesuras."
 character_interactions_4_desc_2:0 "[target.GetName] ha rechazado retirarse. Todavía debemos lidiar con su presencia...por ahora."
 character_interactions_4.a:0 "¡Qué bien!"
 character_interactions_4.b:0 "Qué desafortunado..."

 character_interactions_inv_5_title:0 "Un Nuevo Ciudadano"
 character_interactions_inv_5_desc:0 "[target.GetName] ha llegado a nuestra corte, pero ahora queda la pregunta: ¿debería convertirse en parte de la familia [ruler_family.GetName]?"
 character_interactions_inv_5.a:0 "[target.GetName] se unirá a la familia [ruler_family.GetName]"
 character_interactions_inv_5.b:0 "No es necesario"

 character_interactions_inv_6_title:0 "Ofrecer Apoyo"
 character_interactions_inv_6_desc_1:0 "[target.GetName] ha aceptado nuestra propuesta de convertir a [target_employer.GetName] en un súbdito feudal hasta el final del reinado de [target.GetHerHis]. Tras la muerte de [target.GetName], el pueblo de [target.GetEmployer.GetName] decidirá su destino futuro."
 character_interactions_inv_6_desc_2:0 "[target.GetName] ha rechazado nuestra propuesta...qué necio"
 character_interactions_inv_6.a:0 "Fantástico"
 character_interactions_inv_6.b:0 "¡Que se los lleve el infierno!"

 character_interactions_inv_7_title:0 "El Futuro de [supported_country.GetName]"
 character_interactions_inv_7_desc_1:0 "[supported_country.GetName] ha decidido que continuará siendo nuestro súbdito incluso después de la muerte de [dead_supported_ruler.GetName]."
 character_interactions_inv_7_desc_2:0 "Después de la muerte de [dead_supported_ruler.GetName], [supported_country.GetName] ha decidido que ya no nos necesita como gobernantes...qué necio."
 character_interactions_inv_7.a:0 "¡Glorioso!"
 character_interactions_inv_7.b:0 "¡Esos tontos!!!"

#8 is hidden

 character_interactions_inv_9_title:0 "Necesita Tutor"
 character_interactions_inv_9_desc:0 "[child_in_need_of_tutor.GetName] finalmente ha llegado a la edad en que [child_in_need_of_tutor.GetSheHe] puede comenzar [child_in_need_of_tutor.GetHerHis] estudios. Ahora sería un buen momento para dirigir [child_in_need_of_tutor.GetHerHis] estudios, con el fin de beneficiar más al estado."
 character_interactions_inv_9.a:0 "Bueno saberlo"

 character_interactions_inv_10_title:0 "Esposa Requerida"
 character_interactions_inv_10_desc:0 "[bachelor_in_need_of_wife.GetName] está soltero. Quizás se debería arreglar un matrimonio para el beneficio de la familia real y del estado."
 character_interactions_inv_10.a:0 "Bueno saberlo"

