 scheme.11.desc:0 "La biblioteca real de [ROOT.GetCharacter.GetEmployer.GetCapital.GetName] ha demostrado ser una fuente invaluable de conocimiento a lo largo de los años - parece que este año no es la excepción. Mientras investigaba el orgulloso linaje de [ROOT.GetCharacter.GetHerHis], [ROOT.GetCharacter.GetEmployer.GetRulerTitle] [ROOT.GetCharacter.GetPraenomen] descubrió una pequeña tableta escondida en un rincón, que se pensaba olvidada.\n\nEn un script casi indescifrable, detallaba una rama de la Casa [ROOT.GetCharacter.GetFamilyDisplayName], que parece estar conectada con los linajes legendarios, a través de [SCOPE.sChar('ancestor').GetName].\n\nEste conocimiento no se desperdiciará."
