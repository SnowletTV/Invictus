 tribal_duel.1.t: "Prueba de Combate"
 tribal_duel.1.desc: "La existencia continua de [target.GetName] es un insulto contra ti que exige satisfacción. ¿Desafiarás a tu rival en el campo, personalmente, espada en mano, o pedirás a [champion.GetName] que luche en tu nombre?\n\nSi seleccionas la opción para [champion.GetFirstName], participarás en el duelo desde su punto de vista."
 tribal_duel.1.a: "¡Lucharé en persona, con todo mi honor!"
 tribal_duel.1.b: "Que [champion.GetName] luche por mí."

 tribal_duel.2.t:0 "Combate Glorioso"
 tribal_duel_2_desc_loser:0 "Cuando los Ancianos Tribales se reúnan en días sagrados para recordar a nuestros antepasados, aquellos valientes hombres y mujeres que lucharon y dieron sus vidas para hacer de nuestro pueblo lo que es hoy, se agregará otro nombre estimado a la lista de héroes que cayeron; el tuyo. Aunque [ROOT.GetCountry.GetRuler.GetName] luchó lo mejor que pudo [ROOT.GetCountry.GetRuler.GetHerHis], no fue suficiente para triunfar sobre el enemigo, pero no es ninguna vergüenza morir en un combate glorioso."

 tribal_duel_2_desc_axe_killer:0 "[target.GetName] lanza un ataque final y desesperado, y cada golpe salvaje no encuentra más que aire. ¿Es esto lo mejor que puede hacer [target.GetSheHe]? Y [target.GetFirstName] se creyó capaz de enfrentarte a ti en combate...[ROOT.GetCountry.GetRuler.GetName] se llenó de lástima por un breve momento, pero pronto un gélido desprecio se apoderó de [ROOT.GetCountry.GetRuler.GetHerHim], y el [ROOT.GetCountry.GetRulerTitle] completó el sangriento asunto que debía realizarse.\n\nCon un poderoso golpe, [ROOT.GetCountry.GetRuler.GetFirstName] enterró [ROOT.GetCountry.GetRuler.GetHerHis] el hacha profundamente en el cráneo de [target.GetName], partiéndolo en dos."
 tribal_duel_2_desc_spear_killer:0 "El aire se llena con un terrible crujido de madera mientras el arma de [target.GetName] se hace añicos, incapaz de resistir el feroz torrente de golpes [ROOT.GetCountry.GetRuler.GetName] desatados sobre ella. Tu oponente, al darse cuenta de que el final estaba cerca, comenzó a gritar, llenando el aire con un gemido ronco que erizó los pelos de los brazos de [ROOT.GetCountry.GetRuler.GetFirstName]. Al caer hacia adelante, [ROOT.GetCountry.GetRulerTitle] hunde [ROOT.GetCountry.GetRuler.GetHerHis] una lanza profundamente en la garganta de [target.GetName], acabando con [target.GetHerHis] la vida junto con sus lamentables maullidos."
 tribal_duel_2_desc_horse_killer:0 "Tú y [target.GetName] estáis luchando del brazo en este punto, a pesar de que ambos estáis a caballo; todas las armas se han perdido en el combate cuerpo a cuerpo, arrojadas al suelo en momentos de ira primaria, quedando solo el deseo abrumador de matar al otro. Es más que un combate entre hombre y bestia en este momento... es una batalla de voluntades. \n\n[target.GetName] mueve sus manos de la garganta de [ROOT.GetCountry.GetRuler.GetName], tratando de alcanzar una daga escondida, y [ROOT.GetCountry.GetRuler.GetFirstName] vio una oportunidad y la aprovechó de inmediato; saltando desde [ROOT.GetCountry.GetRuler.GetHerHis] montura, [ROOT.GetCountry.GetRuler.GetSheHe] derribó al suelo a [ROOT.GetCountry.GetRuler.GetHerHis] oponente. [ROOT.GetCountry.GetRuler.GetFirstName] no recuerda exactamente lo que pasó después, pero pronto [ROOT.GetCountry.GetRuler.GetSheHe] estaba siendo levantado en el aire por los hombres de tu tribu, y el cuerpo sin vida de [target.GetFirstName] yacía inmóvil en el suelo."
 tribal_duel_2_desc_hands_killer:0 "[ROOT.GetCountry.GetRuler.GetName] sacudió la cabeza de [ROOT.GetCountry.GetRuler.GetHerHis] hacia un lado, dejando que el puño de [target.GetName] pasara por la cara de [ROOT.GetCountry.GetRuler.GetHerHis], y le devolviste el puñetazo a [target.GetHerHim], con fuerza. Después de esto con un golpe en el estómago, [ROOT.GetCountry.GetRuler.GetFirstName] los dejó sin aliento, haciendo que [target.GetFirstName] se tambaleara hacia atrás, pero ¡qué es esto! Parece que [target.GetSheHe] estaba demasiado débil para levantarse.\n\nArrodillándose, [ROOT.GetCountry.GetRuler.GetFirstName] agarró la cara hinchada de [target.GetFirstName] con ambas manos, diciéndoles que lucharon honorablemente y que no temieran lo que vendría después. Hubo un giro y un chasquido, y [ROOT.GetCountry.GetRuler.GetFirstName] dejó caer el cuerpo sin vida al suelo. Cuando se corra la voz de que has matado a tu oponente con tus propias manos, los hombres te temerán mucho."
 tribal_duel_2_desc_sword_killer:0 "Desde tus primeros años, [ROOT.GetCountry.GetRuler.GetName] ha matado hombres con espadas; el primero, un engreído mercenario con una pequeña espada de doble filo que decía provenir de #E Hispania#!, fue cuando [ROOT.GetCountry.GetRuler.GetFirstName] solo había cumplido catorce años. El valiente [ROOT.GetCountry.GetRulerTitle] ha llevado a los hombres a la batalla innumerables veces y ha saqueado personalmente los campamentos de [ROOT.GetCountry.GetRuler.GetHerHis] enemigos, y el [ROOT.GetCountry.GetRulerTitle] no tiene rival en armas entre todos los que viven en [ROOT.GetCountry.GetName].\n\nY por eso no sorprende que [ROOT.GetCountry.GetRuler.GetFirstName] haya hecho un trabajo rápido con [target.GetName], un cachorro que nunca debería haber levantado una espada contra tu propio."

 tribal_duel_2_desc_generic_killer:0 "Y, así de repente, se acabó; [target.GetName] yace muerto a tus pies."

 ##################################################################################
 tribal_duel_2_desc_1:0 "Está claro que va a ser un día precioso. La brisa es suave y el sol brilla intensamente en el cielo, un testigo imparcial de la multitud que se reúne abajo. [fighter_of_duel.GetName] está parado frente al [ROOT.GetCountry.GetRuler.GetHerHis] oponente, hacha en mano, esperando una oportunidad para atacar. Estaba claro por la mirada acerada en el rostro de [target.GetName] que [fighter_of_duel.GetFirstName] se encontraba en una dura pelea, pero esto es lo que se esperaba. De repente, se oye un grito y todo pensamiento consciente retrocede, consumido por el impulso primordial de sobrevivir. [fighter_of_duel.GetFirstName] dio un paso adelante y se balanceó poderosamente, un [ROOT.GetCountry.GetAdjective] grito de batalla brotó de los [ROOT.GetCountry.GetRuler.GetHerHis] labios."

 tribal_duel_2_desc_2:0 "Saltando hacia atrás, apenas esquivas un golpe salvaje; ese estuvo tan cerca que [fighter_of_duel.GetName] prácticamente podía saborear el silbido de la hoja. Mechones húmedos de cabello enmarañado por el sudor se adhieren a la [fighter_of_duel.GetHerHis] frente, una distracción que debe superarse mientras [fighter_of_duel.GetSheHe] detiene otro golpe.\n\nTe han rozado varias veces y te late la cabeza, pero no eres el único que sufre; [target.GetName] respira con dificultad, con motas de espuma ensangrentada cubriendo la cara de [target.GetHerHis]; estás cerca, desesperadamente cerca, de terminar con esto. Volviéndose hacia ti, mostrando los dientes, tu adversario grita y corre hacia ti. Preparándose, agarra su hacha con ambas manos y corre hacia adelante para enfrentar la carga."

 tribal_duel_2_desc_3:0 "Hay un crujido profundamente satisfactorio cuando el hacha de [fighter_of_duel.GetName] atraviesa la armadura y la carne y muerde el hueso, y por el grito espeluznante que escapa de los labios de [target.GetName], se puede decir que duele... mucho. Pero no hay tiempo para detenerse: tu enemigo de alguna manera te da una patada, te tira al suelo y levanta el [target.GetHerHis] hacha sobre su cabeza con ambas manos, atacándote con todas las fuerzas que le quedan. Parece que [target.GetFirstName] va a intentar acabar con esto ahora... el momento de la verdad está aquí."

 tribal_duel_2_desc_4:0 "Tú y [target.GetName] se rodean con cautela, ambos agarrando sus lanzas, esperando a que el otro haga un movimiento o un error. Pasan los minutos sin ninguna acción tangible; ¿Este cobarde va a atacar o qué? No viniste aquí a bailar. Golpeas la lanza de [target.GetFirstName], pruebas las defensas de [target.GetHerHis] y decides que ya es suficiente. Finta hacia tu izquierda, cambias tu peso en el último minuto y presionas el lado derecho de [target.GetFirstName]; la herida resultante es repugnante de ver."

 tribal_duel_2_desc_5:0 "Tus lanzas están trabadas entre sí y [target.GetName] está haciendo [target.GetHerHis] todo lo posible para intentar desarmarte. Cayendo de rodillas [target.GetHerHis], [target.GetFirstName] empuja hacia arriba y te ves obligado a girar violentamente para evitar una punta de lanza en tu garganta. Al perder el equilibrio, [fighter_of_duel.GetName] retrocede tambaleándose, tratando de repeler el feroz asalto mientras el enemigo avanza sin ofrecer cuartel. Un miedo aterrador comienza a invadir a [fighter_of_duel.GetFirstName]; ¿Qué pasa si [fighter_of_duel.GetSheHe] realmente pierde esto?"

 tribal_duel_2_desc_6:0 "Atacas las piernas de [target.GetName], obligándolos a retroceder mientras tú avanzas. Ambos están cansados, sin embargo, y ninguno de los dos puede aprovechar la ventaja; tu oponente bloquea tu contraataque fácilmente y aún tiene suficiente fuerza para maldecirte en voz alta. La batalla ha estado igualada hasta este momento, algo que has decidido que debe cambiar de inmediato. Bloqueas un golpe desviado del arma de tu enemigo y presionas el ataque, pero calculas mal - hay un momento de pánico ciego cuando ves un punto de lanza dirigido hacia tu rostro. ¿Podría ser este el fin?"

 tribal_duel_2_desc_7:0 "Cargas hacia [target.GetName], los cascos de tu montura tamborilean con un ritmo constante en el suelo. [target.GetFirstName] responde sombríamente a tu ataque y, momentos después, se oye un sonido horrible de metal chocando y un caballo gritando. Inclinándose hacia adelante, [fighter_of_duel.GetName] ataca con decisión, evitando con cuidado los salvajes contraataques del [fighter_of_duel.GetHerHis] rival.\n\nDe alguna manera, [target.GetFirstName] logra superar tus defensas y tu caballo recibe un golpe de refilón, enviando un chorro de sangre al suelo polvoriento. Apretando los dientes, te atrincheras y contraatacas."

 tribal_duel_2_desc_8:0 "De alguna manera lograste evitar ser golpeado en esa última carga, pero ¿dónde está [target.GetName]? Estás haciendo girar tu caballo frenéticamente, tratando de orientarte, pero tu oponente literalmente está dando vueltas a tu alrededor. Está claro que [target.GetFirstName] se está burlando de ti; Están gritando algo, pero no se escucha lo que se dice. Inclinándote hacia adelante sobre tu montura, [fighter_of_duel.GetName] se abalanza sobre [fighter_of_duel.GetHerHis] enemigo, invocando cada gramo de energía."

 tribal_duel_2_desc_9:0 "La lucha está en sus últimos momentos desesperados; Tanto el combatiente como el caballo están exhaustos hasta el punto de colapsar, creando una situación peligrosa para todos los involucrados. A [fighter_of_duel.GetName] le duele el brazo, [fighter_of_duel.GetSheHe] está mareado por la pérdida de sangre y [fighter_of_duel.GetHerHis] el corazón late con fuerza en [fighter_of_duel.GetHerHis] oídos. Se requiere toda la fuerza que le queda a [fighter_of_duel.GetSheHe] para levantar el brazo [fighter_of_duel.GetHerHis], y es un mal consuelo que [target.GetName] esté sufriendo tanto como tú. Cuando los dos combatientes se reencuentran, eres consciente de que será la última vez... alguien seguramente cometerá un error."

 tribal_duel_2_desc_10:0 "Tú y [target.GetName] habéis estado luchando ferozmente, con los brazos entrelazados mientras cada uno intenta asestar un golpe. Esquivando un débil intento de dar un cabezazo, tu puño conecta de lleno con la mandíbula de tu enemigo, provocando que escupa un diente ensangrentado en el suelo momentos después. [target.GetName] brama como un toro herido, dando un paso adelante con ambos puños en alto. [fighter_of_duel.GetName] puede ver que el ojo del enemigo está empezando a hincharse y lo alienta a [fighter_of_duel.GetHerHim]. Tu oponente hace un movimiento y [fighter_of_duel.GetFirstName] se enfrenta al ataque de frente, alentado por el cambio de rumbo de la batalla."

 tribal_duel_2_desc_11:0 "Un puñetazo sólido conecta con el estómago de [fighter_of_duel.GetName] y deja sin aliento a [fighter_of_duel.GetHerHim]; Al caer al suelo, respiras con voz ronca y tus pulmones están desesperados por respirar. Apenas agarras las manos de [target.GetName] antes de que rodeen tu garganta, y los dos luchan, cada uno luchando por lograr la supremacía sobre el otro. Es con un tremendo esfuerzo que puedes quitarte de encima a tu oponente. Gritando enojado, [fighter_of_duel.GetFirstName] cambia la situación al atacar al [fighter_of_duel.GetHerHis] oponente, y los dos guerreros caen al suelo. ¡Ahogarás la vida de este tonto y alimentarás con su hígado a las aves del campo!"

 tribal_duel_2_desc_12:0 "La lucha se vuelve cada vez más intensa y ambos están empezando a cometer errores. La cara de [fighter_of_duel.GetName] está empezando a hincharse y [fighter_of_duel.GetSheHe] no puede ver con el [fighter_of_duel.GetHerHis] ojo izquierdo. Pero el guerrero está dando golpes sólidos [fighter_of_duel.GetHerHis] y no es el único que lucha; Finos riachuelos de sangre caen por la cara de [target.GetName], que es un mosaico de moretones y cortes. Al sentir una oportunidad, tu oponente intenta abrumarte con una andanada de ataques pero no logra conectar un solo golpe; un rápido paso a un lado y apuntas a [target.GetHerHis] lados, conectando y provocando que [target.GetHerHim] gruñe."

 tribal_duel_2_desc_13:0 "El aire se llena con el ruido metálico del metal cuando una hoja choca contra otra y [target.GetName] presiona contra ti, tratando de obligarte a arrodillarte. Con un fuerte empujón, [fighter_of_duel.GetName] empuja a [target.GetFirstName] hacia atrás, recupera el equilibrio y da un paso adelante para aprovechar la ventaja. La salva inicial de tu enemigo fue un esfuerzo brutal, uno que estuvo a punto de terminar esta pelea antes de que realmente comenzara, pero ahora [target.GetFirstName] parece estar recalculando [target.GetHerHis] estrategia. Respirando tranquilamente, [target.GetFirstName] camina cautelosamente fuera del alcance de su brazo. Tus ojos se cruzan mientras tus espadas se encuentran de nuevo."

 tribal_duel_2_desc_14:0 "Dejas escapar un pequeño grito cuando la punta de la espada de [target.GetName] atraviesa tu armadura; La espada de tu enemigo está resbaladiza con tu sangre. Sintiendo tu pánico momentáneo, [target.GetSheHe] se inclina hacia adelante, esperando seguir con un golpe fatal, pero [target.GetName] logra detenerlos, dejando una herida profunda en la mejilla de [target.GetHerHis] como pago por sus esfuerzos. Nadie sale ileso en este partido, pero está demasiado igualado para saber quién tiene la ventaja. Apretando los dientes, ignoras la herida palpitante en tu costado y atacas de nuevo."

 tribal_duel_2_desc_15:0 "Girando con gracia, desvías la espada de [target.GetName] lejos de tu cabeza y golpeas hacia abajo, rozando su brazo y causando que profiera una maldición fuerte. Sigues golpeándolos, una serie de ataques que los desequilibra y los hace caer al suelo. ¡Ahora! Este es el momento que has estado esperando. Abandonas tu cautela, buscando aprovechar la ventaja, y te lanzas sobre tu enemigo. Ellos levantan débilmente [target.GetHerHis] espada, mostrando que no se rinden, y tus brazos chocan."

 tribal_duel_2_desc_16:0 "Las multitudes que miran están animando, ¿pero a quién? Limpiando el sudor de tu frente, intentas concentrarte. No puedes decir quién está ganando la ventaja. Has dado algunos buenos golpes, pero también has recibido un par. ¿Ven las multitudes algo que tú no ves? ¡¿Qué está pasando?!"

 tribal_duel_2_desc_17:0 "Fuera del pequeño ring donde ambos están luchando, hay un silencio aterrador. Hay principalmente un zumbido de moscas, un zumbido subyacente que se ve interrumpido por el grito ocasional o el sonido de la sangre siendo derramada en la tierra. El sol, desinteresado en los asuntos de los mortales, observa despiadadamente desde lo alto."

 tribal_duel_2_desc_18:0 "La lucha continúa, pero no le va bien a [fighter_of_duel.GetName]. Cada intento que ha hecho [fighter_of_duel.GetSheHe], cada estrategia de batalla compartida por los tíos o los amigos de tu padre, se puede detener fácilmente, y el [fighter_of_duel.GetFirstName] casi ha perdido el control de la situación un par de veces. [target.GetName] parece estar dentro de la cabeza de [fighter_of_duel.GetHerHis], anticipando [fighter_of_duel.GetHerHis] cada movimiento."

 tribal_duel_2_desc_19:0 "[fighter_of_duel.GetName] hace que esto parezca fácil. A menos que te suceda una terrible calamidad, no hay forma de que pierdas este partido. [target.GetName] está superado en todos los aspectos y ambos saben que el fin se acerca rápidamente."

 tribal_duel_2_desc_20:0 "Ambos estáis empezando a cansaros un poco, pero vuestro orgullo y sentido del honor impide que ninguno de los dos lo demuestre... o eso crees. Notas que [target.GetName] se balancea demasiado hacia adelante y hacia atrás, casi como si estuviera borracho. Su propia respiración suena irregular en sus oídos, que se sienten tapados y palpitantes. Gritas, pero sientes la lengua pesada en la boca y te cuesta emitir un sonido.\n\nDe repente, [target.GetFirstName] se lanza hacia adelante y no hay tiempo para pensar."

 tribal_duel_2_desc_21:0 "Ya sabéis que de esta pelea se escribirán canciones al respecto, celebrando el combate emprendido hoy aquí; Las hazañas de heroísmo demostradas tanto por usted como por [target.GetName] son dignas de ser contadas a lo largo de los siglos. Es realmente una lástima que solo uno salga vivo de aquí, porque si tú y [target.GetFirstName] unieran fuerzas y lucharan juntos, todos temblarían ante ustedes. Y sin embargo debe ser que sólo uno se alejará..."

 tribal_duel_2_desc_22:0 "¡Presiona el ataque! ¡No dejes que [target.GetName] descanse ni un momento, pero ataca! [fighter_of_duel.GetName] casi tiene esto, ¡pero [fighter_of_duel.GetSheHe] debe estar en negrita! Mira cómo [target.GetFirstName] tiembla ante ti... no pasará mucho tiempo."

