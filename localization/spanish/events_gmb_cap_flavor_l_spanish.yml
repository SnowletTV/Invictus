 # Starting Event
 flavor_cap.1.t: "¡Caos en Capadocia!"
 flavor_cap.1.desc: "Aunque durante muchos años Capadocia estuvo bajo control persa, la región ha estado firmemente en manos helénicas tras las conquistas de Alejandro Magno. Bajo el gobierno del sátrapa Eumenes de Cardia, la provincia lucharía por el control y una mayor gloria durante las Guerras de los Diadochi. \n\nEumenes comandó hábilmente a muchos soldados macedonios, incluidos los famosos Escudos de Plata, a pesar de no ser de su cultura. Fue a través del trabajo duro, la determinación y el mando inteligente que se ganó su respeto. Sin embargo, este nuevo poder de Eumenes se vería truncado.\n\nEn la batalla de Gabiene, Eumenes finalmente ganó la batalla, pero perdió el control de su ejército. Sería traicionado por los Escudos de Plata, cuyas familias fueron rehenes de Antígonos I Monoftalmos. Al final, Eumenes sería encarcelado por las fuerzas antigónidas y moriría de hambre. Sus restos fueron enviados de regreso a su familia, mientras que la familia macedonia Amyntid, siempre leal a la causa Antigonid, sería instalada como nueva Sátrapas de Capadocia. \n\nSe podría pensar que la situación se habría calmado, pero estaríamos muy equivocados. El gobierno amintido no es en modo alguno seguro; por un lado, el hijo del antiguo rey persa, Ariarates II, planea recuperar su tierra natal y expulsar a los helenos de la región, y por el otro, los hijos de Eumenes de Cardia conspiran y planean vengar a su padre. El hijo mayor, Eumenes, espera retomar el control de Capadocia y derrotar a los Antigónidas en la batalla, restaurando así el honor de su familia. Capadocia está al borde del precipicio: ¿qué camino seguirá?"
 flavor_cap.1.a: "¡Los Euménides son nuestros legítimos gobernantes!"
 flavor_cap.1.b: "¡Las reclamaciones de Ariarates son válidas!"
 flavor_cap.1.c: "¡Por derecho de conquista, servimos a los Antigónidos!"
 flavor_cap.1.d: "Qué momento tan problemático..."
 flavor_cap.2.t: "¡Golpe de estado en Capadocia!"
 flavor_cap.2.desc: "Con la derrota del infame General y Sátrapa, Éumenes de Cardia, hemos sido capaces de conquistar la Satrapía de Capadocia. ¡Desafortunadamente, parece ser que nuestra fiel satrapía Macedonia nos ha sido arrebatada! ¡Un golpe de estado ha sido realizado en Mazaca y el hijo de nuestro rival Éumenes ha tomado el control y se ha proclamado a si mismo Basileus! En estos momentos, estamos rodeados de enemigos por todos los frentes. Quizás sería lo más sensato abandonar nuestra influencia en la región y primero ocuparnos del resto de Diádocos. ¡Después de que nos hayamos ocupado de ellos, podemos volver a centrarnos en la satrapía que hemos perdido y recuperar lo que legítimamente nos pertenece!  Alternativamente, ¡podríamos centrar por completo nuestra atención en los usurpadores y golpear ahora!  ¿Deberíamos acabar con este acto de rebelión y darle el golpe de gracia a la dinastía Euménida?  Qué será, ¿guerra o paz?"
 flavor_cap.2.a: "¡La paz es nuestra única opción, estamos demasiado ocupados en otros frentes!"
 flavor_cap.2.b: "¡Aplastaremos la rebelión de un solo golpe!"
 flavor_cap.4.t: "¡Nuestro gobierno se ve reforzado en Capadocia"
 flavor_cap.4.desc: "¡Grandes noticias Basileus! Llegan noticias de Capadocia proclamando que nuestras fuerzas han ganado el enfrentamiento por el contro de la satrapía rebelde. Por fin podemos centrarnos en otros asuntos."
 flavor_cap.4.a: "¡Capadocia por fin es segura!"
 flavor_cap.5.t: "¡Golpe de estado en Capadocia!"
 flavor_cap.5.desc: "Nos llegan noticias de que el heredero del viejo rey Ariarates, Ariarates II, ha tomado el control de la Satrapía de Capadocia con el apoyo del cercano reino de Armenia. ¡Esto no puede seguir así! Podríamos presionar a los Armenios para que abandonen su apoyo por este nuevo Rey,preparando el camino para retomar nuestro control sobre la región. O podríamos llegar a un acuerdo y resolver esta disputa, abandonando Capadocia por el momento... al menos hasta que hayamos derrotado a los Diádocos restantes. ¡Una vez que los hayamos derrotado, volveremos para recuperar lo que legítimamente nos pertenece!"
 flavor_cap.5.a: "¡La solución está clara! Nos encargaremos de ellos más tarde..."
 flavor_cap.5.b: "¡Aplastaremos la rebelión de un solo golpe!"
