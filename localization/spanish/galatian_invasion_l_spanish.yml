 form_west_galatia:0 "Formar Galacia"
 form_west_galatia_desc:0 "Aunque estamos lejos de la patria ancestral de nuestro pueblo, esta sigue siendo una buena tierra. Creamos un nuevo estado aquí y enseñemos a estos pueblos locales sobre las capacidades del pueblo celta."
 form_central_galatia:0 "Formar Galacia"
 form_central_galatia_desc:0 "Aunque estamos lejos de la patria ancestral de nuestro pueblo, esta sigue siendo una buena tierra. Creamos un nuevo estado aquí y enseñemos a estos pueblos locales sobre las capacidades del pueblo celta."
 form_east_galatia:0 "Formar Galacia"
 form_east_galatia_desc:0 "Aunque estamos lejos de la patria ancestral de nuestro pueblo, esta sigue siendo una buena tierra. Creamos un nuevo estado aquí y enseñemos a estos pueblos locales sobre las capacidades del pueblo celta."
 embrace_galatian_culture:0 "Adoptar la Cultura Galacia"
 embrace_galatian_culture_desc:0 "A medida que nuestro pueblo cambia sus costumbres según sus vecinos y la distancia de nuestra patria ancestral, debemos adoptar estas costumbres a nivel estatal."
 volcae_feudatories:0 "Confederación Volcae"
 volcae_feudatories_desc:0 "Habiéndonos asentado en nuestro nuevo hogar, surge la necesidad de que nuestras tribus se unan en una nueva nación."
 invade_greece_decision_tt:0 "Permitido si el mundo helénico es inestable, es decir, si Macedonia no posee Pella o Seleuco ha invadido Anatolia o han pasado 20 años desde el inicio del juego."
