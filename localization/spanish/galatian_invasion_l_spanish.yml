 # Decisions
 start_galatian_invasion:0 "Invadir Grecia"
 start_galatian_invasion_desc:0 "Durante demasiado tiempo se nos han ocultado las riquezas de Grecia. Pagamos un alto precio por su vino y aceite mientras estos débiles se dan un festín. Ahora que el temido [GetCharacter('(int32)39').GetPraenomen] ha desaparecido, su tesoro es nuestro y podemos tomarlo, ¡sin nadie lo suficientemente fuerte como para oponerse a nosotros!"
 tromeri_peace_request:0 "Exigir Tierras para los Trocmerii"
 tromeri_peace_request_desc:0 "La lucha ha durado lo suficiente. Pedimos tierras suficientes para cultivar a cambio de estatus de súbditos."
 tolistobogia_peace_request:0 "Exigir Tierras para los Tolistobogii"
 tolistobogia_peace_request_desc:0 "La lucha ha durado lo suficiente. Pedimos tierras suficientes para cultivar a cambio de estatus de súbditos."
