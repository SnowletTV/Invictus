l_spanish:
 # Gadir Negotiating a Truce Event Chain
 flavor_gad.2.t: "Una situación difícil"
 flavor_gad.2.desc: "La guerra no le va bien a Gadir y los magistrados están desesperados por una resolución que les permita mantener sus privilegios. Piden a [ROOT.GetCountry.GetRuler.GetName] que envíe un mensaje ofreciendo una suma de oro a los invasores como tributo si aceptan concedernos una paz blanca."
 flavor_gad.2.a: "Quizás un poco de oro sirva."
 flavor_gad.2.b: "¡No nos rendiremos sin luchar!"
 flavor_gad.3.t: "Un enviado de Gadir"
 flavor_gad.3.desc: "Esta mañana, un enviado de [GetCountry('GAD').GetName] se acercó a nuestro campamento con un mensaje de sus líderes; Quieren que les concedamos una paz blanca a cambio de una suma de oro, que prometen entregar cuando cesen las hostilidades.\n\nSi bien no se puede ganar ninguna gloria negociando con cobardes, a las tesorerías siempre les vendría bien un poco más de oro."
 flavor_gad.3.a: "¡Un trato justo!"
 flavor_gad.3.b: "¡Ja! ¡Qué divertido! ¡No negociaremos!"
 flavor_gad.3.tooltip: "Nuestra guerra actual con [GetCountry('GAD').GetName] terminará en una Paz Blanca."
 flavor_gad.4.t: "¡Paz blanca!"
 flavor_gad.4.desc: "¡Un milagro, [ROOT.GetCountry.GetRuler.GetName]! Nuestros enemigos han aceptado nuestra oferta y acceden a concedernos la paz. El precio que pagamos fue alto, pero al menos la lucha terminará."
 flavor_gad.4.a: "Sobrevivimos para luchar otro día..."
 flavor_gad.4.tooltip: "Nuestra guerra actual con [gadir_turdetanian_opponent.GetName] terminará en una Paz Blanca."
 flavor_gad.5.t: "¡Paz rechazada!"
 flavor_gad.5.desc: "Desafortunadamente para nosotros, nuestros enemigos se negaron a seguir nuestras sugerencias de una paz blanca y enviaron a nuestros diplomáticos de regreso con las manos vacías. Para empeorar las cosas, nos dicen que hagamos las paces con nuestros dioses, porque el día de la verdad está casi cerca: tendremos que luchar hasta el amargo final."
 flavor_gad.5.a: "¡Ay no!"
 # Turdetanian Coalition of 237 BCE Event Chain
 flavor_turdetanian.2.t: "¡Una invasión extranjera!"
 flavor_turdetanian.2.desc: "Tenemos una noticia terrible, mi [ROOT.GetCountry.GetRulerTitle]. [GetCountry('CAR').GetName] ha declarado oficialmente la guerra a [ROOT.GetCountry.GetName]; parece que el codicioso Shopet de [GetProvince('(int32)3256').GetName] no estará satisfecho hasta que toda Iberia sea reclamada por los [GetCountry('CAR').GetAdjective]. Un estado de pánico se ha apoderado de [ROOT.GetCountry.GetCapital.GetName], ya que muchos creen que el fin está cerca: tenemos la lucha de nuestra vida en nuestras manos, [ROOT.GetCountry.GetRuler.GetName].\n\nPodríamos enviar un grito de ayuda a nuestros #E hermanos turdetanos#!, apelando a nuestras conexiones culturales, o afrontar la amenaza solos y dar a nuestros ejércitos un discurso que no pronunciarán pronto. Olvidar.\n\n#E Contexto histórico#!:\nEn 516 A.U.C. (237 a. C.), #E Amílcar#! [turdetanian_coalition_barcid_scope.GetName], el [GetCountry('CAR').GetAdjective] general y patriarca de la [turdetanian_coalition_barcid_scope.GetName] familia, lanzó una invasión de #E Turdetania#!. Su objetivo era apoderarse de las ricas tierras y minas de la región, así como obtener control sobre los mercados de [GetCountry('GAD').GetName], un rival económico clave de [GetCountry('CAR').GetName] en la Península Ibérica.\nEsta campaña tenía como objetivo fortalecer la ciudad africana asegurando una vasta reserva de mercenarios y recursos para futuros conflictos, particularmente en la Península Italiana y el corazón africano de [GetCountry('CAR').GetName].\nA pesar de los éxitos iniciales, #E Amílcar#! finalmente encontró su fin durante la campaña a manos de una confederación de ejércitos ibéricos. Sin embargo, sus esfuerzos solidificaron [GetCountry('CAR').GetAdjective] el control en la región, allanando el camino para que su familia continuara la [turdetanian_coalition_barcid_scope.GetName] conquista de la Península Ibérica durante la Segunda Guerra Púnica."
 flavor_turdetanian.2.a: "¡Envíe pidiendo ayuda y ore para que nuestro llamado de ayuda sea escuchado!"
 flavor_turdetanian.2.b: "¡No temas, porque podemos arreglárnoslas solos!"
 flavor_turdetanian.2.tooltip: "Enviaremos mensajes a todos los #Y países turdetanos#!, pidiéndoles que se unan a nuestra guerra a nuestro lado."
 flavor_turdetanian.2.tooltip.b: "#R Si no existe ningún otro país turdetano, nadie responderá a la llamada.#!"
 flavor_turdetanian.3.t: "Una coalición turdetana"
 flavor_turdetanian.3.desc: "Hemos recibido un mensaje frenético de un vecino: parece que están en guerra con los temibles ejércitos de [GetCountry('CAR').GetName] y esperan desesperadamente que los ayudemos en su guerra.\n\nSus diplomáticos argumentan que debemos permanecer unidos ahora, porque si no unimos fuerzas, nuestros ejércitos serán extinguidos, uno por uno. Estas palabras suenan a verdad, pero ¿puede [ROOT.GetCountry.GetName] arriesgarse a unirse a la coalición? La decisión la debe tomar [ROOT.GetCountry.GetRuler.GetName].\n\n#E Contexto histórico#!:\nEn 516 A.U.C. (237 a. C.), #E Amílcar#! [turdetanian_coalition_barcid_scope.GetName], el [GetCountry('CAR').GetAdjective] general y patriarca de la [turdetanian_coalition_barcid_scope.GetName] familia, lanzó una invasión de #E Turdetania#!. Su objetivo era apoderarse de las ricas tierras y minas de la región, así como obtener control sobre los mercados de [GetCountry('GAD').GetName], un rival económico clave de [GetCountry('CAR').GetName] en la Península Ibérica.\nEsta campaña tenía como objetivo fortalecer la ciudad africana asegurando una vasta reserva de mercenarios y recursos para conflictos futuros, particularmente en la Península Italiana y el corazón africano de [GetCountry('CAR').GetName].\nA pesar de los éxitos iniciales, #E Amílcar#! finalmente encontró su fin durante la campaña a manos de una confederación de ejércitos ibéricos. Sin embargo, sus esfuerzos solidificaron [GetCountry('CAR').GetAdjective] el control en la región, allanando el camino para que su familia continuara la [turdetanian_coalition_barcid_scope.GetName] conquista de la Península Ibérica durante la Segunda Guerra Púnica."
 flavor_turdetanian.3.a: "¡Por supuesto que nos uniremos!"
 flavor_turdetanian.3.b: "No estamos interesados en tal cosa."
 flavor_turdetanian.3.tooltip: "¡Nos uniremos a la coalición contra la #Y agresión cartaginesa#!!"
 flavor_turdetanian.4.t: "¡Una mano amiga!"
 flavor_turdetanian.4.desc: "Algunos dicen que [ROOT.GetCountry.GetRuler.GetName] casi podría haber llorado lágrimas de alegría cuando los mensajeros llegaron a [ROOT.GetCountry.GetCapital.GetName].\n\n'Puede que no siempre estemos de acuerdo, [ROOT.GetCountry.GetRuler.GetFirstName], pero no nos quedaremos de brazos cruzados viendo cómo los púnicos queman tus ciudades; hoy serás tú, pero mañana podríamos ser nosotros. ¡Hagamos una guerra juntos, una guerra que será recordada a lo largo de los siglos!'"
 flavor_turdetanian.4.a: "¡Una bendición de los dioses!"
 flavor_turdetanian.5.t: "Un vecino desagradecido"
 flavor_turdetanian.5.desc: "Hemos recibido una respuesta escalofriante de nuestros vecinos, que se burlan alegremente de nuestra situación actual con [GetCountry('CAR').GetName].\n\n'Debemos agradecer a los cartagineses por emprender una tarea que nosotros mismos deseábamos ver cumplida. Una vez que [ROOT.GetCountry.GetCapital.GetName] haya caído, esperamos ansiosamente comprar a sus esposas e hijas como esclavas; prometemos tratarlas muy bien, de hecho.'"
 flavor_turdetanian.5.a: "¡Que los dioses los destruyan!"
 flavor_turdetanian.6.t: "¡Una coalición turdetana!"
 flavor_turdetanian.6.desc: "Parece que nuestro progreso en la región de #E Turdetania#! ha encontrado resistencia. Los turdetanos han formado una coalición para intentar detenernos. ¡Pero sus esfuerzos serán demolidos por el poderoso [GetCountry('CAR').GetAdjective] ejército!\n\n#E Contexto histórico#!:\nEn 516 A.U.C. (237 a. C.), #E Amílcar#! [turdetanian_coalition_barcid_scope.GetName], el [GetCountry('CAR').GetAdjective] general y patriarca de la [turdetanian_coalition_barcid_scope.GetName] familia, lanzó una invasión de #E Turdetania#!. Su objetivo era apoderarse de las ricas tierras y minas de la región, así como obtener control sobre los mercados de [GetCountry('GAD').GetName], un rival económico clave de [GetCountry('CAR').GetName] en la Península Ibérica.\nEsta campaña tenía como objetivo fortalecer la ciudad africana asegurando una vasta reserva de mercenarios y recursos para conflictos futuros, particularmente en la Península Italiana y el corazón africano de [GetCountry('CAR').GetName].\nA pesar de los éxitos iniciales, #E Amílcar#! finalmente encontró su fin durante la campaña a manos de una confederación de ejércitos ibéricos. Sin embargo, sus esfuerzos solidificaron [GetCountry('CAR').GetAdjective] el control en la región, allanando el camino para que su familia continuara la [turdetanian_coalition_barcid_scope.GetName] conquista de la Península Ibérica durante la Segunda Guerra Púnica."
 flavor_turdetanian.6.a: "¡Adelante!"
 # Misc Events
 flavor_turdetanian.7.t: "En manos púnicas"
 flavor_turdetanian.7.desc: "En las nuevas adquisiciones [ROOT.GetCountry.GetRulerTitle] realizadas en la comarca, tenemos el control de uno de los numerosos puestos de avanzada que nuestro pueblo fundó en tierras de Turdetania. Una nueva gestión significa una nueva directriz. Esos puestos de avanzada han sido reutilizados como centro de expansión cultural y demográfica púnica."
 flavor_turdetanian.7.a: "¡Es bueno saberlo!"
 flavor_turdetanian.7.tooltip: "El '#Y $turdetanian_punic_outpost_mod$#!' se ha convertido en un '#Y $turdetanian_large_punic_outpost_mod$#!'."
 # Country Modifiers
 turdetanian_coalition_alone_modifier: "¡Solo contra el Titán!"
 desc_turdetanian_coalition_alone_modifier: "Nuestros ejércitos están muy motivados para defender sus tierras de Cartago gracias al discurso de nuestro gobernante."
 # Opinion Modifiers
 turdetanian_helped_on_coalition_opmod: "Se unió a la coalición"
 turdetanian_not_helped_on_coalition_opmod: "Nos abandonó"
