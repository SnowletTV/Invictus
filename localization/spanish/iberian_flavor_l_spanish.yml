l_spanish:
 # New Heritages to be implemented
 arganthonios_heritage:0 "Legado de Argantonio"
 arganthonios_heritage_desc:0 "Argantonio fue el último rey conocido de Tartessos antes del colapso del reino bajo el protagonismo fenicio tras la batalla de Alalia, en la que la armada cartaginés-etrusca derrotó a los griegos focianos. Ahora sus sucesores han recuperado su importancia perdida y retoman su rico legado con un nuevo y más fuerte estado que desafiará al pasar del tiempo."
 # New Iberian Deities
 deity_nabia:0 "$omen_nabia$"
 omen_nabia:0 "Nabia"
 omen_nabia_desc:0 "Nabia es una diosa íbera del Agua y la Fertilidad, con especial relevancia en las culturas del Norte de la Península, y santuarios cercanos a ríos y lagos.\n\nNabia ha sido asociada con la diosa helénica Artemisa.\n\n#! Efecto Apoteosis: $naval_apotheosis_effect_tt_description$"
 deity_neto:0 "$omen_neto$"
 omen_neto:0 "Netón"
 omen_neto_desc:0 "Neto es un dios de la guerra y uno de los pocos dioses panpeninsulares, adorado tanto por íberos como por celtibéricos. Visto como un dios Sol infernal, es señor del mundo caótico.\n\nNeto está asociado con el Marte romano o el Ares helénico.\n\n#! Efecto de apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_borvo:0 "$omen_borvo$"
 omen_borvo:0 "Borvo"
 omen_borvo_desc:0 "Borvo es el dios de los minerales y la curación, asociado con el agua de manantial. Es adorado fuera de la Península Ibérica, encontrando centros religiosos en la Galia y el sur de Germania.\n\nBorvo suele ser comparado con el dios helénico Apolo.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
 deity_arganthonios:0 "$omen_arganthonios$"
 omen_arganthonios:0 "Argantonio"
 omen_arganthonios_desc:0 "Arganthonios es un rey mítico de Tartessos conocido por los griegos por su riqueza y generosidad. Dio dinero a los focenses para reconstruir las murallas de la ciudad de Focea cuando supo que los medos se estaban convirtiendo en una potencia predominante en Asia Menor.\n\n#! Efecto apoteósico: $economy_income_effect_tt_description$"
 deity_aqueloo:0 "$omen_aqueloo$"
 omen_aqueloo:0 "Aqueloo"
 omen_aqueloo_desc:0 "$achelous_description$\n\n#Y Aqueloo#!: Aqueloo, una interpretación íbera del dios helénico Aqueloo, es un dios de los ríos y la fertilidad. Aqueloo luce el cuerpo de un buey almizclero y el rostro barbudo de un hombre, aunque coronado por imponentes orejas de toro.\n\n Al igual que su homólogo helénico, Aqueloo es venerado como el que otorga prosperidad a los campos, asegurando la fertilidad del suelo y el sustento de la vida. Una estatua de Aqueloo o Aqueloo, que se cree que fue tallada en bloques de piedra caliza a mediados del siglo VI a. C., fue excavada a principios del siglo XX cerca de un túmulo funerario bastetano y apodada la Bicha de Balazote.\n\n#! Efecto apoteósico: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 deity_astarte_turdetani:0 "$omen_astarte_turdetani$"
 omen_astarte_turdetani:0 "'Ashtart Turdetani"
 omen_astarte_turdetani_desc:0 "'Ashtart Turdetani es la interpretación local de la famosa diosa cananea de la guerra, la belleza y el amor 'Ashtart. La introducción de esta deidad proviene de los primeros pobladores fenicios durante el inicio de la Edad del Hierro, convirtiéndose rápidamente en una de las deidades más queridas entre los nativos de la Península Ibérica. Su imaginario se encuentra por toda la Península Ibérica y las antiguas tierras tartésicas, dedicándose a ella numerosos santuarios y templos.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 # New Druidic Deities
 deity_trebaruna:0 "$omen_trebaruna$"
 omen_trebaruna:0 "Trebaruna"
 omen_trebaruna_desc:0 "Trebaruna es una diosa lusitana de atribuciones inseguras. Su culto está ampliamente extendido en Gallaecia y Lusitania.\n\n#! Efecto apoteósico: $culture_apotheosis_oratory_tech_effect_tt_description$"
 deity_ares_lusitani:0 "$omen_ares_lusitani$"
 omen_ares_lusitani:0 "Ares Lusitano"
 omen_ares_lusitani_desc:0 "Ares Lusitani es el dios de los caballos y caballeros de los lusitanos. Como su nombre indica, Ares Lusitani es un dios de origen helénico que encontró su lugar en los panteones nativos gracias a los intercambios culturales con los comerciantes griegos del Mediterráneo.\n\n#! Efecto Apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_vaelicus:0 "$omen_vaelicus$"
 omen_vaelicus:0 "Vaélico"
 omen_vaelicus_desc:0 "Vaelicus es el dios vettoniano del más allá y de la naturaleza. Generalmente se le asocia con el dios Endouellicus, adorado por los lusitanos y los callaecios.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
 # New Canaanite Deity
# deity_babai:0 "$omen_babai$"
# omen_babai:0 "Babai"
# omen_babai_desc:0 "Babai is the God-Father of the Nuragic and Corsian cultures of #Corsica and Sardinia. Heavily influenced by Phoenician religion and customs, by this #time, his worship is limited in the Hinterland of the Islands, where indigenous #communities continue with their traditions."
# deity_mother_goddess_nuragic:0 "$omen_mother_goddess_nuragic$"
# omen_mother_goddess_nuragic:0 "Mother Goddess"
# omen_mother_goddess_nuragic_desc:0 "The Mother Goddess of the Nuragic and Corsian #cultures are related to the Mediterranean Mother Goddesses. Like Babai, her worship #is now limited to the hinterland of the islands, waiting to reclaim her land."
# deity_sardus_can:0 "$omen_sardus$"
# omen_sardus_can:0 "Sardus"
# omen_sardus_can_desc:0 "Sardus, sometimes called Sardus Pater by the Hellenics, is #the mythical founding hero of the Sardinians. Son of Herakles or Makeris, he lived #in Libya until he led an expedition to colonize the island of Ichnusa, later called #Sardinia in his honor. He has been associated with the God-Father Babai."
 # New Marite Religion
 pre_indo_european_religion:0 "Marita"
 desc_pre_indo_european_religion:0 "Una combinación de creencias en demonios, espíritus y dioses de Origen Preindoeuropeo, con influencia de las religiones vecinas. La figura más importante es la Diosa Mari, adorada como Diosa Suprema en algunas localidades."
 # New Marite Deity
 deity_sugaar:0 "$omen_sugaar$"
 omen_sugaar:0 "Sugaar"
 omen_sugaar_desc:0 "Ofreceremos nuestro culto al dios Sugaar, esposo de Mari y dios de las Tormentas y los Truenos. Que su figura serpentina aterrorice a nuestros enemigos e inspire a nuestros guerreros.\n\n#! Efecto Apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_eate:0 "$omen_eate$"
 omen_eate:0 "Eate"
 omen_eate_desc:0 "Adoraremos a Eate, dios de las tormentas, cuya barba está hecha de Fuego y Hielo. Con su apoyo, ningún enemigo nos conquistará.\n\n#! Efecto Apoteosis: $military_apotheosis_defensive_effect_tt_description$"
 deity_amalur:0 "$omen_amalur$"
 omen_amalur:0 "Amalur"
 omen_amalur_desc:0 "Adoraremos a Amalur, diosa de la Tierra, otra cara de Mari y madre de las diosas Eki e Ilargi. Su bendición hará que nuestro pueblo se regocije.\n\n#! Efecto apoteósico: $fertility_apotheosis_food_effect_tt_description$"
 deity_basajaun:0 "$omen_basajaun$"
 omen_basajaun:0 "Los Basajaunos"
 omen_basajaun_desc:0 "Ofreceremos nuestro culto a los Basajauns, los Señores de los Bosques. Que su sabiduría ilumine a nuestros pensadores y proteja a nuestros pastores.\n\n#! Efecto apoteósico: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_aatxe:0 "$omen_aatxe$"
 omen_aatxe:0 "Aatxe"
 omen_aatxe_desc:0 "Adoraremos a Aatxe, el espíritu cambiaformas que trabaja en las sombras. Que los delincuentes tengan miedo de su ira, porque Aatxe protege a nuestro pueblo.\n\n#! Efecto Apoteosis: $military_apotheosis_capital_freemen_effect_tt_description$"
 deity_ilargi:0 "$omen_ilargi$"
 omen_ilargi:0 "Ilargi"
 omen_ilargi_desc:0 "Ofreceremos nuestro culto a Ilargi, diosa de la Luna e hija de Amalur. Que su camino diario para encontrar a su Madre sea exitoso.\n\n#! Efecto Apoteosis: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_lurraberri:0 "$omen_lurraberri$"
 omen_lurraberri:0 "Lurraberri"
 omen_lurraberri_desc:0 "El nombre de Lurraberri significa \"suelo nuevo\" y a menudo iba precedido del epíteto \"Anderexi\", que significa \"floración\". Es posible que esto indique que Lurraberri pudo haber sido un dios de la fertilidad, o tal vez incluso un dios de los árboles o las flores. También puede significar que era un dios del renacimiento. Lurraberri figuraba en una inscripción que decía su nombre como Ilurriberrixus Anderexi, una versión romanizada de Lurraberri.\n\n#! Efecto de apoteosis: $military_apotheosis_manpower_effect_tt_description$"
 deity_orko:0 "$omen_orko$"
 omen_orko:0 "Orko"
 omen_orko_desc:0 "Orko era un dios del trueno. Su nombre se utilizó en la palabra vasca para jueves, Orkoguna, relacionándolo con dioses como Thunraz/Thor y Júpiter/Zeus. Es posible que el dios fuera una deidad menor antes de la influencia romana, pero el significado de nombrar un día después de él muestra que pudo haber sido de gran importancia para los vascos.\n\n#! Efecto de apoteosis: $military_apotheosis_military_experience_effect_tt_description$"
 deity_lobegi:0 "$omen_lobegi$"
 omen_lobegi:0 "Lobegi"
 omen_lobegi_desc:0 "El nombre de Lobegi proviene de una inscripción que decía 'Lacobegius', que parece ser una versión romanizada de un dios vasco. Como la raíz 'laco' proviene claramente del latín 'lacus (lago)'', es posible que la raíz original fuera algo más cercano a 'lo', la palabra vasca para lago, o quizás algo diferente. De todos modos, la segunda parte de su nombre, begi, significa ojos. Por eso su nombre se traduce como \"Ojos del lago\". Esto puede indicar que Lobegi era una especie de deidad de la sabiduría basada en el agua.\n\n#! Efecto de apoteosis: $economy_apotheosis_capital_noble_effect_tt_description$"
 deity_sorginak:0 "$omen_sorginak$"
 omen_sorginak:0 "Sorginak"
 omen_sorginak_desc:0 "Los sorginak no eran una sola deidad, ni deidades en absoluto. En cambio, eran seres místicos y personas de las que a menudo se decía que eran brujas en períodos posteriores. Practicaban magia y podían causar todo tipo de bendiciones o perdiciones. También se decía que algunos sorginak eran laminak, que eran ninfas de la fertilidad.\n\n#! Efecto de apoteosis: $economy_apotheosis_province_improvement_effect_tt_description$"
 deity_inguma:0 "$omen_inguma$"
 omen_inguma:0 "Inguma"
 omen_inguma_desc:0 "Inguma es un dios de los sueños y las pesadillas. Aunque a veces es malicioso, este dios tuvo un impacto duradero en la religión vasca y es posible que fuera adorado desde la época prerromana.\n\n#! Efecto de apoteosis: $culture_apotheosis_characters_effect_tt_description$"
 deity_aiko:0 "$omen_aiko$"
 omen_aiko:0 "Aiko"
 omen_aiko_desc:0 "Aiko es el hijo de Mari y el héroe del pueblo vasco. Su leyenda dice que fue él quien estableció la cultura y la religión vasca y fue un héroe de muchas hazañas. Un personaje así al que se le atribuye el origen de los propios vascos podría haber sido adorado desde la época prerromana, si no antes.\n\n#! Efecto apoteósico: $culture_apotheosis_assimilate_effect_tt_description$"
 deity_laminak:0 "$omen_laminak$"
 omen_laminak:0 "Laminak"
 omen_laminak_desc:0 "Los laminak eran espíritus femeninos, o ninfas, del sexo y la fertilidad. Se decía que ayudaban a las mujeres durante el parto, la fertilidad y la buena salud. Los laminak no siempre fueron retratados como buenos espíritus como en algunos mitos, sino que capturan a la diosa Mari.\n\n#! Efecto de apoteosis: $fertility_apotheosis_food_effect_tt_description$"
 deity_urtzi:0 "$omen_urtzi$"
 omen_urtzi:0 "Urtzi"
 omen_urtzi_desc:0 "Urtzi tiene interesantes argumentos a favor de su existencia. Muchos argumentan que Urtzi debe haber sido un dios del cielo, ya que muchos nombres, lugares y palabras parecen tener la raíz de Urtzi, y algunas fuentes externas afirman que la religión mariita era el hogar de dicho dios del cielo; sin embargo, algunos eruditos creen que Urtzi es en realidad solo una palabra para cielo. Es posible que ambas hipótesis sean ciertas, sin embargo, es posible que nunca sepamos la verdad detrás de este misterio.\n\n#! Efecto Apoteosis: $fertility_apotheosis_capital_slaves_effect_tt_description$"
 # New Treasures
 treasure_stone_verracos:0 "Verracos de Piedra"
 treasure_stone_verracos_desc:0 "Monumentos megalíticos zoomorfos de granito que representan animales cuadrúpedos como toros, osos y cerdos con fines inciertos."
 treasure_tarshish_stelae:0 "Estelas de Tarsis"
 treasure_tarshish_stelae_desc:0 "Ubicada originalmente en Nora, esta estela de antigüedad inmemorial narra la victoria de Milkaton contra los Sardos en la tierra de Tarsis y da las gracias a los dioses por permitirles volver a casa sanos y salvos."
 treasure_mausoleum_of_the_lions_iberic:0 "Mausoleo de los Leones"
 treasure_mausoleum_of_the_lions_iberic_desc:0 "Este mausoleo, muy influenciado por el arte Neohitita, está protegido por cuatro leones de piedra colocados en sus esquinas. Los elaborados relieves representan escenas de la naturaleza y mitológicas, como los Doce Trabajos de Hércules o un Festín Monstruoso."
 treasure_warrior_statue_iberic:0 "Estatua de Guerrero Ibérico"
 treasure_warrior_statue_iberic_desc:0 "Esta estatua de piedra de calcarenita representa a un guerrero Íberi de origen aristocrático listo para el combate, que lleva una armadura ibérica completa, una caetra y una falcata. Está decorada con adornos metálicos y otros adornos removibles."
 #treasure_turdetanian_bull:0 "Turdetanian Bull"
 #treasure_turdetanian_bull_desc:0 "A limestone statue of a bull, sculpted by the Turdetanians, with the purpose of protecting the souls of the dead on their way to the Afterlife."
 treasure_callaecian_ornated_axe:0 "Hacha Adornada"
 treasure_callaecian_ornated_axe_desc:0 "Esta hacha votiva de origen callaíno decorada con torques se ha utilizado durante mucho tiempo para realizar sacrificios."
 treasure_tartessian_ceremonial_bit:0 "Pieza Ceremonial"
 treasure_tartessian_ceremonial_bit_desc:0 "Vestigio de la desaparecida cultura Tartésica. Esta pieza ceremonial representa a la diosa Cananea Astarté con el peinado de la diosa Kemética Hathor, acompañada de lirios y dos pájaros."
 treasure_ilercavonian_vessel:0 "Vasos de Plata"
 treasure_ilercavonian_vessel_desc:0 "Conjunto de vasos, copas y collares de plata y oro de fabricación Ilercavona."
 treasure_edetanian_censer:0 "Incensario de Cabeza de Diosa"
 treasure_edetanian_censer_desc:0 "Este valioso incensario de origen Edetano utilizado en prácticas religiosas representa la cabeza de la diosa Cananea Tanit o de la diosa Helénica Deméter."
 treasure_olcadian_necklace:0 "Collar Olcade"
 treasure_olcadian_necklace_desc:0 "Este collar utilizado por una sacerdotisa Olcade, hecho de arcilla, está decorado con patos y cisnes."
 treasure_celtiberian_plaques:0 "Las Cuatro Placas"
 treasure_celtiberian_plaques_desc:0 "Las Cuatro Placas, escritas en lengua Celtíbera y realizadas en Bronce, contienen el corpus jurídico del Pueblo Celtíbero."
 treasure_lusitanian_fibula:0 "Fíbula de Oro"
 treasure_lusitanian_fibula_desc:0 "Fíbula de oro realizada por un orfebre Griego a petición de un príncipe Celta. Está decorada con una escena de un guerrero desnudo con un escudo y un casco celtas luchando contra un león."
 treasure_offerer_lady_statue_iberic:0 "Estatua de una dama oferente"
 treasure_offerer_lady_statue_iberic_desc:0 "Estatua policromada de una dama de alto rango entregando una ofrenda a una de las numerosas deidades adoradas por los íberos. La dama sostiene una vasija en sus dos manos y está ricamente vestida con tres túnicas superpuestas sujetas con un peroné al cuello."
 treasure_turdetanian_reliefs_iberic:0 "Relieves Turdetanos"
 treasure_turdetanian_reliefs_iberic_desc:0 "Serie de altos relieves en piedra caliza de la ciudad turdetana de Urso que representan una importante variedad de escenas. Todos vinculados a monumentos funerarios, los relieves representan una gran variedad de personas y animales."
 # Aquitania Claims
 form_aquitania_claims_tooltip:0 "Aquitania ganará Reclamaciones sobre la Región de #Y Aquitania#!."
 # Greater Aquitania Formable
 form_greater_aquitania_claims_tooltip:0 "Aquitania Mayor ganará Reclamaciones sobre las Regiones de #Y Gallaecia#!, #Y Tarraconensis#!, y #Y Armorica#!."
 form_greater_aquitania:0 "Formar Aquitania Mayor"
 form_greater_aquitania_desc:0 "Nuestros modos son antiguos, habiendo preservado y honrado las costumbres de nuestros ancestros desde tiempos inmemoriales; sin embargo, si no se gestionan adecuadamente, podríamos desvanecernos en los anales de la historia como tantos otros antes que nosotros. Si podemos preservar las brasas de la cultura aquitana, podrían avivarse en una llama poderosa y usarse para crear algo extraordinario."
 formable_greater_aquitania:0 "Aquitania Mayor"
 AQ2: "$GREATER_AQUITANIA_NAME$"
 GREATER_AQUITANIA_NAME:0 "Aquitania Mayor"
 greater_aquitania_not_exists:0 "#Y Aquitania Mayor#! debe NO existir."
 inherit_greater_aquitania_provinces_tooltip:0 "Cualquier provincia #Y Sujeta#! necesaria para formar Aquitania Mayor será anexionada."

 # New Culture, not implemented yet
 tartessian_culture:0 "Tartessia"
 # Tooltips
 inherit_tartessia_provinces_tooltip:1 "Se anexarán todas las provincias #Y Asunto#! necesarias para formar Tartessia."
 tartessia_not_exists:0 "#Y Tartesia#! NO debe existir."
 form_tartessia_claims_tooltip:0 "Tartesia ganará reclamaciones en la región #Y $baetica_region$#!."
 # New Decision
 celtiberian_plaques_treasure:0 "Encargar las Placas de Bronce"
 celtiberian_plaques_treasure_desc:0 "Con un estado más centralizado, necesitamos establecer un código claro para nuestras leyes y no depender de su transmisión oral, lo cual puede dar lugar a malentendidos e injusticias."
 form_tartessia:0 "Reformar Tartesia"
 form_tartessia_desc:0 "El mítico reino de Tartessos y el rey Argantonio hace tiempo que desaparecieron, pero nosotros, las Turdetanos, somos sus herederos y, como herederos, nuestro deber es seguir su legado y restaurar el poderoso reino del Hombre de Plata."
 # New Tag
 TARTESSIA_NAME:0 "Tartesia"
 TARTESSIA_ADJECTIVE:0 "Tarteso"
 #USO:0 "Ursoia"
 #USO_ADJ:0 "Ursoan"
 # Bloodline Related Localization
 scheme.11.desc_1:0 "La biblioteca real de [ROOT.GetCharacter.GetEmployer.GetCapital.GetName] ha demostrado ser una valiosa fuente de conocimiento a lo largo de los años; parece que este año no es una excepción. Mientras investigaba la orgullosa herencia del linaje [ROOT.GetCharacter.GetHerHis], [ROOT.GetCharacter.GetEmployer.GetRulerTitle] [ROOT.GetCharacter.GetPraenomen] descubrió una pequeña tablilla escondida en un nicho, que se pensaba olvidada durante mucho tiempo.\n\nEn una escritura casi indescifrable, detallaba una rama de la Casa [ROOT.GetCharacter.GetFamilyDisplayName], que parece estar conectada con el legendario rey Arganthonios, a través de [SCOPE.sChar('ancestor').GetName].\n\nEste conocimiento no se desperdiciará."
 # Starting Events
 iberian_starting_country_events.tut.t:0 "Herederos de Tartessos"
 iberian_starting_country_events.tut.desc:0 "La tierra de los turdetanos recibió muchos nombres en el pasado; el más utilizado fue #E Tartessos#!. Este estado se encuentra en la línea difusa del mito, y las leyendas hablan de las riquezas y la prosperidad del reino gobernado por el mismísimo Hombre de Plata, Arganthonios. Aunque #E Turdetania#! nunca estuvo unida bajo un solo reino.\n\nfenicios y griegos han intentado colonizar la zona desde el principio de los tiempos para tener acceso a las ricas minas y tierras fértiles de #E Turdetania#!. Las leyendas hablan de la caída de la cultura #E Tartessos#! hace dos siglos al final de la batalla de [GetProvince('(int32)3515').GetName] entre una coalición de [GetCountry('ETR').GetAdjective] y [GetCountry('CAR').GetAdjective] y los griegos focenses de [GetProvince('(int32)3515').GetName], pero la verdad es más compleja que eso, siendo una mezcla de desaceleración económica, cambios climáticos y crisis social entre otros.\n\nLa tierra de #E Turdetania#! está dividida en tres partes. La región occidental se dedica principalmente a las extracciones de metales ricos de las minas [GetProvince('(int32)1414').GetName] y [GetProvince('(int32)1356').GetName] y las otras dos son la #E Bética Baja#! y la #E Bética Media#!. Mientras que la #E región de la Baja Bética#! basa su riqueza en el lucrativo flujo de las rutas comerciales desde la región occidental y el río [GetProvince('(int32)7772').GetName] la #E Bética Media#! se beneficia de extensas y ricas tierras de cultivo que abastecen a toda la región y más allá, exportando el excedente a las colonias púnicas de Iberia y el norte de África.\n\nInfluencia fenicia había sido constante en la región y condujo a una situación en la que los dioses cananeos eran adorados con la misma frecuencia que los dioses locales, especialmente la diosa 'Ashtart y el dios Melqart. Las clases altas dieron un paso adelante y adoptaron como propias las costumbres púnicas. Esta situación creó un rico crisol que creó una cultura única.\n\nLa inestabilidad galvaniza la región en una época en la que los [GetCountry('CAR').GetAdjective] están a las puertas de #E Turdetania#! buscando su riqueza. Sólo el tiempo dirá si los turdetanos sobrevivirán."
 iberian_starting_country_events.tut.a:0 "Hora de hacer historia"
 iberian_starting_country_events.crm.t:0 "Karmo"
 iberian_starting_country_events.crm.desc:0 "En el interior de Turdetania, cerca del río [GetProvince('(int32)7772').GetName], se encuentra la ciudad de [GetProvince('(int32)1374').GetName]. Esta ciudad vivió una vida tranquila, viviendo del comercio y especializándose en la metalurgia, pero la inestabilidad política que asoló #E Turdetania#! tras la crisis de la cultura #E Tartessos#! cambió los [GetCountry('CRM').GetAdjective].\n\nEl dominio de [GetCountry('CRM').GetName] en el uso de los metales, su posición central. Sobre el río [GetProvince('(int32)7772').GetName], el asentamiento púnico de [GetProvince('(int32)1355').GetName] y las ricas tierras agrícolas que rodean la ciudad hacen de [GetCountry('CRM').GetName] un estado privilegiado en la región. Pero sus vecinos tienen ventajas similares y no será fácil mantenerlos subyugados en caso de que la legitimidad de [GetCountry('CRM').GetName] esté en duda.\n\n¿Podrá [GetCountry('CRM').GetName] utilizar todas esas ventajas para convertirse en la hegemonía de #E Turdetania#! o permanecerán como un asentamiento secundario como lo eran antes?"
 iberian_starting_country_events.crm.a:0 "Hora de hacer historia"
 iberian_starting_country_events.onu.t:0 "Onuba"
 iberian_starting_country_events.onu.desc:0 "La ciudad costera de [GetProvince('(int32)1339').GetName] ha estado habitada desde tiempos inmemoriales. Situada en una península en la desembocadura de los ríos [GetProvince('(int32)1414').GetName] y #E Urius#!, [GetProvince('(int32)1339').GetName] se beneficia de una ubicación defendible además de ser el principal centro comercial para el comercio de los metales extraídos de las ricas minas de [GetProvince('(int32)1414').GetName].\n\nAunque las anteriormente ricas minas de [GetProvince('(int32)1414').GetName] están empezando a obtener Agotado por la sobreexplotación y el consiguiente cambio de la principal extracción minera a las ricas minas de [GetCountry('ORT').GetName], [GetCountry('ONU').GetName] sigue siendo uno de los estados turdetanos más ricos y se beneficia de estrechos vínculos con la población púnica de Iberia. [GetCountry('ONU').GetName] también es famoso por su producción de #E Garum#! gracias a su próspera industria pesquera, siendo uno de los mayores productores detrás de la cercana ciudad púnica de Gadir.\n\nDemográficamente, [GetCountry('ONU').GetName] es un estado bastante diverso. Desde que los primeros fenicios viajaron más allá de las Columnas de Heracles, los cananeos tenían comercio y se asentaron en [GetCountry('ONU').GetName], siendo una importante minoría en ciudades como [GetProvince('(int32)1339').GetName] o [GetProvince('(int32)1335').GetName]. Hace dos siglos, durante la crisis de la cultura #E Tartessos#!, las tribus celtas emigraron desde la #E Meseta Central#! a las tierras llamadas [GetCountry('BDL').GetName] y [GetProvince('(int32)1337').GetArea.GetName]. Ahora, además de los púnicos, los colonos celtas están migrando a [GetCountry('ONU').GetName], lo que convierte a la región en un verdadero crisol de culturas."
 iberian_starting_country_events.onu.a:0 "Hora de hacer historia"
 iberian_starting_country_events.asa.t:0 "Asta"
 iberian_starting_country_events.asa.desc:0 "Más allá de la isla de Cartare, en la desembocadura del [GetProvince('(int32)7665').GetName], se encuentra [GetProvince('(int32)1342').GetName], una próspera ciudad cuyas riquezas provienen del comercio de metales y mercancías con los púnicos y sus compañeros turdetanos. Cerca de la desembocadura natural del [GetProvince('(int32)7665').GetName] y al lado del canal que termina justo delante de [GetProvince('(int32)1344').GetName], [GetProvince('(int32)1342').GetName] creció como una de las ciudades turtedanas más grandes, con un próspero mercado lleno de vida.\n\n[GetCountry('ASA').GetAdjective] no son sólo comerciantes. Buscando ampliar su influencia, [GetCountry('LSC').GetName] fue subyugado y ahora vive bajo las reglas [GetCountry('ASA').GetAdjective]. Al estar situadas en el #E Bajo Baetis#!, las tierras alrededor de [GetProvince('(int32)1342').GetName] están formadas por los depósitos del río y no son tan fértiles como las tierras del #E Medio Betis#!, pero su ubicación estratégica los convirtió en uno de los mayores centros comerciales de #E Turdetania#!, en cuyo mercado podía encontrar un comerciante. [GetCountry('ORT').GetAdjective] y [GetCountry('IPT').GetAdjective] metales a [GetCountry('CRM').GetAdjective] y [GetCountry('ASG').GetAdjective] cereales y vino.\n\n¿Se convertirá [GetCountry('ASA').GetName] en el hegemón de #E Turdetania#! o su luz será apagada por otra potencia?"
 iberian_starting_country_events.asa.a:0 "Hora de hacer historia"
 iberian_starting_country_events.gad.t:0 "Gadir"
 iberian_starting_country_events.gad.desc:0 "Hace mucho tiempo, más allá de las Columnas de Heracles, los colonos de [GetProvince('(int32)743').GetName] fundaron una ciudad en la isla de Erytheia. Lo llamaron [GetCountry('GAD').GetName], 'La Fortaleza'. Como una de las colonias fenicias más antiguas del Mediterráneo occidental, las riquezas de la ciudad provienen de su acceso a las rutas atlánticas del estaño y a las minas turdetanas.\n\n[GetCountry('GAD').GetName] es bien conocida por otra razón; el Garum de [GetProvince('(int32)1344').GetName] goza de un amplio reconocimiento como el mejor condimento del mundo mediterráneo y se consume desde Iberia hasta Anatolia y más allá.\n\nEl final de la Batalla de [GetProvince('(int32)3515').GetName] hace dos siglos y la caída de la influencia griega en el Mediterráneo occidental fueron buenas noticias al principio. [GetCountry('GAD').GetName] pasó de ser una colonia extractiva a convertirse en el principal centro comercial más allá de los Pilares. [GetCountry('GAD').GetName] lidera una Liga integrada por otras colonias púnicas que cayeron en [GetCountry('GAD').GetAdjective] influencia, desarrollando y controlando el comercio atlántico desde las Casiterides hasta los Arambys.\n\nPero la preeminencia de [GetCountry('GAD').GetAdjective] está disputada por el ascenso de [GetCountry('CAR').GetName]. Los herederos de Dido quieren el puesto de [GetCountry('GAD').GetName], sin embargo, los [GetCountry('GAD').GetAdjective] cuentan con el patrocinio del propio dios Melqart y su Oráculo. [GetCountry('GAD').GetName] debe prepararse si quiere soportar la expansión [GetCountry('CAR').GetAdjective]."
 iberian_starting_country_events.gad.a:0 "Hora de hacer historia"
 iberian_starting_country_events.sgs.t:0 "Arse"
 iberian_starting_country_events.sgs.desc:0 "En la costa oriental de Iberia se encuentra [GetProvince('(int32)1029').GetName], conocida como Saguntum por los romanos. Los edetanos acudieron en masa al puerto masalio de Sagointio, en la costa levantina, para vender sus mercancías, trasladándose en masa a una serie de colinas que dominaban el puesto comercial. Allí establecieron una ciudad a la que llamaron Arse. El asentamiento edetano comenzó a crecer, comerciando con bienes procedentes del interior de la Península Ibérica y también con productos de fabricación propia. Las buenas relaciones con los griegos de [GetCountry('MAS').GetName], [GetCountry('HMK').GetName] y [GetCountry('EPO').GetName] crearon un flujo fluido de intercambios culturales y económicos.\n\nLa ciudad compuesta de [GetProvince('(int32)1029').GetName] está dividida en dos núcleos. Primero está la ciudad misma, rodeada de resistentes muros que protegen los principales edificios gubernamentales del estado. En el exterior se encuentra el puerto, llamado 'Sagointium' y donde vive la mayoría de los comerciantes griegos. En el puerto de Sagointium atracan barcos de diferentes lugares y los muros de [GetProvince('(int32)1029').GetName] protegen a su gente de amenazas externas. [GetCountry('SGS').GetName] tiene el honor de ser la primera ciudad ibérica en emitir sus propias monedas.\n\nEl tiempo dirá si [GetCountry('SGS').GetName] seguirá creciendo o perecerá bajo un enemigo más fuerte, solo recuerda tener cuidado si un tipo llamado Hannibal aparece ante tus puertas."
 iberian_starting_country_events.sgs.a:0 "Hora de hacer historia"
 # Province Modifiers
 turdetanian_punic_outpost_mod:0 "Puesto avanzado púnico"
 desc_turdetanian_punic_outpost_mod:0 "Los colonos púnicos han construido un puesto de avanzada en este territorio."
 turdetanian_large_punic_outpost_mod:0 "Gran asentamiento púnico"
 desc_turdetanian_large_punic_outpost_mod:0 "En este territorio existió una vez un puesto avanzado púnico. Desde que los púnicos tomaron el control directo del lugar, el puesto de avanzada se ha convertido en un asentamiento adecuado, fomentando la asimilación de la población nativa."
 iberian_pyrite_belt:0 "Faja Ibérica de Pirita"
 desc_iberian_pyrite_belt:0 "Al suroeste de la Península Ibérica se encuentra la Faja Pirítica Ibérica, el yacimiento pirítico más rico de la región, explotado desde tiempos inmemoriales. Aunque no son tan productivas como antes, estas minas siguen siendo bastante ricas."
 mines_of_castulo:0 "Minas de Cástulo"
 desc_mines_of_castulo:0 "Alrededor de Cástulo se extiende un gran yacimiento de metales que convirtieron estas tierras en el principal centro de explotación del sur de Iberia."
 iberian_pyrite_belt_restored:0 "Faja Ibérica de Pirita"
 desc_iberian_pyrite_belt_restored:0 "Al suroeste de la Península Ibérica se encuentra la Faja Pirítica Ibérica, el yacimiento pirítico más rico de la región, explotado desde tiempos inmemoriales. Estas minas han sido restauradas a su antigua gloria."
 the_gadeiras_modifier:0 "Las Gadeiras"
 desc_the_gadeiras_modifier:0 "Las Gadeiras es un archipiélago formado por las islas de Erytheia -donde se encuentra la ciudad de Gadir-, Kotinoússa y Antípolis. Esta ubicación hace que el territorio sea difícil de invadir desde tierra."
# Preserved Spanish-only entries
 treasure_turdetanian_bull:0 "Toro Turdetano"
 treasure_turdetanian_bull_desc:0 "Una estatua de piedra caliza de un toro, esculpida por los Turdetanos, con el propósito de proteger las almas de los muertos en su camino al Más Allá."
