 # Generated localization for 00_jain_flavor.txt
 
 bhadrabahu.1.t:0 "Un suceso milagroso"
 bhadrabahu.1.desc:0 "[ROOT.GetCountry.GetRuler.GetName], hemos recibido informes de que un famoso monje jainista, un hombre llamado Bhadrabahu, ha cruzado la frontera desde las tierras de los Maurya y ha entrado en nuestro reino. Parece que la inestabilidad política de nuestros vecinos ha convertido nuestro país en una opción atractiva para los refugiados, pero no esperábamos a alguien como Bhadrabahu: su presencia ya se nota entre nuestro pueblo, que se reúne a diario para escuchar sermones y participar en meditaciones."
 bhadrabahu.1.a:0 "El pueblo ve la verdad con sus propios ojos"
 
 bhadrabahu.2.t:0 "Se reúne el Concilio Jainista"
 bhadrabahu.2.desc:0 "Disculpe por molestarle a estas horas, oh [ROOT.GetCountry.GetRuler.GetName], pero queríamos mencionar algo menor de pasada antes de que se nos olvidara. Hay noticias de un gran Concilio Jainista que se convoca en el lejano norte, con todas las luminarias de esa religión reunidas. Entre ellos está el monje Bhadrabahu que ha estado hospedándose entre nuestro pueblo; parece que se prepara para abandonar nuestro país."
 bhadrabahu.2.a:0 "Bueno, me alegro por ellos supongo. Me pregunto qué significará todo esto"
 
 bhadrabahu.3.t:0 "Noticias del Concilio Jainista"
 bhadrabahu.3.desc:0 "Como hemos estado siguiendo los viajes del monje jainista Bhadrabahu, nos pareció oportuno mencionar que, tras un breve periodo en nuestro país, ha regresado al norte, a Maurya, para unirse al Concilio Jainista que se celebra. Ya hay informes de tensiones entre las distintas sectas reunidas, que subyacen a la razón por la que se ha convocado este Concilio. Todos esperan que los resultados finales sean positivos, pero será muy difícil reconciliar puntos de vista diametralmente opuestos."
 bhadrabahu.3.desc2:0 "La noticia procedente del norte nos ha llegado, traída por comerciantes que normalmente no se interesan por este tipo de asuntos: el Concilio Jainista por fin se ha reunido y está siendo dirigido, entre otros, por Bhadrabahu, de quien ya ha oído hablar. Ya hay informes de tensiones entre las distintas sectas reunidas, que explican la razón de la convocatoria. Todos esperan que los resultados sean positivos, pero será muy difícil reconciliar posturas tan enfrentadas."
 first_jain_council_mod_desc:0 "En esta provincia se celebra una reunión del Consejo Jainista, en la que todos sus teólogos y ascetas famosos se reúnen para discutir cuestiones de política religiosa."
 bhadrabahu.3.a:0 "Esperemos que todo vaya bien; esperamos noticias"
 
 bhadrabahu.4.t:0 "La escisión jainista"
 bhadrabahu.4.desc:0 "Aunque una hambruna que duró años devastaba la zona, proporcionando un telón de fondo sombrío para la reunión, el Concilio Jainista ha concluido finalmente con un resultado desalentador para quienes deseaban mantener la paz. Aunque se avanzó en la compilación de nuestros textos sagrados, escribiéndolos para que la gente pueda recordar sus enseñanzas en esta vida y en las venideras, ha habido una ruptura en el orden de las cosas.\n\nParece que un tal Sthulabhadra, antiguo discípulo de Bhadrabahu, ha hecho una proclamación contra su maestro que ha dividido a todos en dos bandos; argumentando que la desnudez es sagrada y la forma de existencia preferible, Sthulabhadra y sus seguidores han abandonado el uso de la ropa: se llaman a sí mismos Svetembara, permitiendo solo la incorporación de hombres. Bhadrabahu discrepa enérgicamente, proclamando esto como una herejía, y quienes han tomado partido por el venerable maestro se hacen llamar Digambara.\n\nExiste presión pública para que [ROOT.GetCountry.GetRuler.GetName] elija públicamente un bando: no podremos evitar este asunto por mucho más tiempo."
 bhadrabahu.4.ttt:0 "Bhadrabahu, disgustado por este resultado, se marchará para siempre."
 bhadrabahu.4.a:0 "Apoyamos el movimiento Digambara por encima de los demás"
 bhadrabahu.4.tt:0 "Chandragupta, convencido de la verdad de las enseñanzas, se fuga y se dirige al sur con el monje Bhadrabahu."
 bhadrabahu.4.b:0 "Nuestro apoyo va a los Svetembara, pues consideramos sus enseñanzas correctas"
 
 bhadrabahu.5.t:0 "La muerte de Bhadrabahu"
 bhadrabahu.5.desc:0 "Bhadrabahu, el monje jainista y líder de la secta Digambara cuyas hazañas son ya semi‑legendarias, ha pasado finalmente de este reino mortal a un estado de dicha eterna. Sus seguidores lo han proclamado Quinto Shrutakevalin, uno que poseía un conocimiento completo de la totalidad de nuestras enseñanzas, y están difundiendo las doctrinas de Bhadrabahu por doquier. Creemos que el impacto de la vida del monje será mayor en la muerte que lo que fue en vida."
 bhadrabahu.5.a:0 "Estar vivos y haber presenciado tales cosas... somos verdaderamente afortunados"
 
 jain_flavor.1.t:0 "Hambruna en Magadha"
 jain_flavor.1.desc:0 "Hemos recibido noticias sombrías del extranjero sobre una hambruna y rezamos a los dioses de la misericordia para que tales miserias no lleguen a nuestras tierras. Parece que los dioses han abandonado la provincia de Magadha, lo cual es realmente notable; pese a toda su riqueza material y poder, los mauryanos están reducidos a arrastrarse a cuatro patas, con vientres hundidos y miembros consumidos."
 jain_flavor.1.a:0 "Hagamos todo lo posible para evitar que esto nos ocurra"
 jain_flavor.1.b:0 "Tenemos los bolsillos vacíos y pronto tendremos los graneros vacíos, al parecer"
 
 jain_flavor.2.t:0 "El fin de la hambruna"
 jain_flavor.2.desc:0 "Por fin, tras un periodo tan largo que hace que nuestros corazones se marchiten al pensar en los muertos, parece que la hambruna que asolaba Magadha ha llegado a su fin. Las cosechas son mejores que en años, y las importaciones de alimentos comienzan a mejorar, con grano y aceite volviendo a ser asequibles en los mercados. Ya no tendrán que hervir corteza de árbol ni beber caldos de hierba los que, llevados a la locura por el hambre y la desesperación, lo hacían antes: los dioses regresan y traen sus bendiciones."
 jain_flavor.2.a:0 "Nos alegra oír del fin del sufrimiento humano"
 jain_flavor.2.b:0 "..."
 
 jain_flavor.8.t:0 "Festival de Paryushana"
 jain_flavor.8.desc:0 "Se acerca el tiempo del Festival de Paryushana, cuando los pecados acumulados durante el año entre hermanos se olvidan y un espíritu contrito de perdón invade los corazones durante los días sagrados de Kshamavani y Samvatsari. La comunidad se reunirá, recordando nuestras enseñanzas sagradas, y renovará nuestros espíritus y corazones para el año venidero."
 jain_flavor.8.a:0 "¡Es hora de ayunar!"
 jain_flavor.8.b:0 "¡Se celebrará un gran festival!"
 jain_flavor.8.c:0 "Ahora no es el momento."
 
 jain_flavor.9.t:0 "Mahavir Janma Kalyanak"
 jain_flavor.9.desc:0 "Uno de los días más sagrados de nuestro calendario, Mahavir Janma Kalyanak, ha llegado; hoy debemos recordar el nacimiento del último Tirthankara de esta era. Incluso ahora, la estatua de Mahavir se prepara para su procesión ritual, donde será colocada en un carro y llevada por el corazón de la ciudad. Un espíritu de caridad y agradecimiento impregna el festival, mientras la gente muestra su gratitud abriendo sus corazones y sus bolsillos."
 jain_flavor.9.a:0 "Que el espíritu de Mahavir nos acompañe"
 jain_flavor.9.b:0 "..."
 
 jain_flavor.10.t:0 "Akshaya Tritiya"
 jain_flavor.10.desc:0 "La alegre ocasión de otro festival religioso ha llegado, con preparativos en ciudades y campos. El festival de Akshaya Tritiya recuerda las acciones y hechos del primer Tirthankara, Rishabhanatha, quien rompió su ayuno sagrado al beber jugo de caña de azúcar con manos agradecidas y extendidas. Los que puedan peregrinar lo harán, recreando los viajes de Rishabhanatha y visitando lugares sagrados para él; quienes no tengan medios honrarán al Tirthankara absteniéndose de comer. Tras el periodo de ayuno habrá celebraciones que todos esperan con ilusión."
 jain_flavor.10.a:0 "El aumento de peregrinos se traducirá en mayores ventas para nuestros comerciantes"
 jain_flavor.10.b:0 "..."
 
 ## Ajivika Flavor Events
 
 ajivika_flavor.1.t:0 "¡Monje Budista Asesinado!"
 ajivika_flavor.1.desc:0 "Nadie sabe cómo ni quién, pero la casa de una familia budista fue incendiada en Pundravardhana, y el resultado fue una muerte en su familia. La gente exige represalias. La ley del pueblo ha encontrado culpable al secta rival Ajvika, y depende de ti decidir cómo manejarás su castigo."
 ajivika_flavor.1.a:0 "¡Los Ajvika pagarán por sus transgresiones!"
 ajivika_flavor.1.b:0 "Estas son acusaciones infundadas, no haremos nada."
 
 ajivika_flavor.2.t:0 "La Purga De Pundravardhana"
 ajivika_flavor.2.desc:0 "En represalia por el asesinato e incendio de un monje budista, toda la secta Ajvika tuvo que pagar. 18,000 Ajvika fueron asesinados. Pensarán dos veces antes de sus tontos ataques a nuestra gran fe budista la próxima vez. Los ciudadanos budistas se regocijan ante esta purga de los herejes."
 ajivika_flavor_2.a:0 "Buena eliminación."
# Preserved Spanish-only entries
 blood_of_menander:0 "Linaje de Menander"
 blood_of_menander_desc:0 "Menander I Soter, de la Casa de Eutidemo, fue rey del Reino Indo-Griego. Gobernando sobre vastas extensiones de tierras en el norte de la India, Menander fue famoso por su conversión al Budismo y por sus numerosas incursiones al corazón del subcontinente Indio. De acuerdo al geógrafo Griego Estrabón, Menander 'conquistó más tribus que Alejandro Magno'.\n\n#G Este rasgo puede ser heredado matrilinialmente o patrilinialmente.#!"
 greco_indian:0 "Greco-Indio"
