 ##Buddhist Flavor Events
 
 buddhist_flavor_1_title:0 "Un nuevo Sotapanna"
 buddhist_flavor_1_desc:0 "Lo que algunos afirman que es imposible es la realidad que has elegido para ti mismo; has visto y oído el Dharma y has abandonado los caminos que te encadenaban a una vida de esclavitud incondicional. Ahora eres conocido como un Sotapanna, un Entrador en la Corriente, porque has roto las tres cadenas y has entrado en una nueva Conciencia."
 buddhist_flavor_1.a:0 "Una bendición"
 
 buddhist_flavor_2_title:0 "Un nuevo Sakadagami"
 buddhist_flavor_2_desc:0 "A diferencia de la mayoría de los mortales, que realizan los movimientos de su vida diaria sin pensar ni saber, tú has abrazado las enseñanzas del Buda, destruyendo las tres cadenas que te atan a consideraciones temporales y aflojando el control de la cuarta y la quinta. Eres un Retornado Una Vez, o Sakadagami; has alcanzado el segundo nivel de Iluminación."
 buddhist_flavor_2.a:0 "Que las cuatro bendiciones me abracen"
 
 buddhist_flavor_3_title:0 "Un nuevo Anagami"
 buddhist_flavor_3_desc:0 "Hay cinco cadenas que atan la mente del hombre, pero tú las has cortado todas, y cuando los estragos del Tiempo lleguen a reclamar finalmente tu cuerpo mortal, no nacerás de nuevo en este mundo de decadencia, sino que serás llevado al Cielo de las Moradas Puras; Eres un Anagami, el tercero del cuarto aspirante."
 buddhist_flavor_3.a:0 "Que todos estén libres de la desesperación"
 
 buddhist_flavor_4_title:0 "Arhat"
 buddhist_flavor_4_desc:0 "Tu mente ha disuelto cualquier obstrucción kármica que busque hacer tropezar tu pie; eres Arhat, el Merecedor, que comprende asuntos que requieren muchas vidas para comprenderse plenamente. Tu pensamiento es tan puro y libre que algunos creen que has obtenido poderes sagrados, y un pequeño grupo de ascetas te sigue con la esperanza de obtener algo de sabiduría de tu ejemplo."
 buddhist_flavor_4.a:0 "Espero que algún día tú también logres este entendimiento."
 
 buddhist_flavor_5_title:0 "Despertar Completado"
 buddhist_flavor_5_desc:0 "Es justo decir que has sido completamente transformado por los procesos mentales y espirituales que has experimentado en tu Camino hacia la Iluminación. En un mundo donde innumerables almas viven sin pensar, realizando los movimientos diarios sin ser conscientes de su verdadero potencial, esclavas de sus deseos, ustedes han trascendido a reinos de libertad, con sus sufrimientos llegados a su fin; tú eres el Despierto."
 buddhist_flavor_5.a:0 "La Iluminación ha llegado"
 
