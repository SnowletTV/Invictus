l_spanish:
#### Interesting Histories ####
 interesting_histories_country_events.spa.t:0 "Esparta"
 interesting_histories_country_events.spa.desc:0 "Los días de gloria ya han pasado. Hace sólo unas décadas, en la batalla de Megalópolis, una fuerza Espartana de 22.000 hombres fue derrotada por un ejército Macedonio de 40.000 hombres. El rey Espartano Agis III, herido e incapaz de mantenerse en pie, ordenó a sus hombres que le dejaran atrás para enfrentarse al ejército Macedonio que avanzaba y así poder ganar tiempo para que sus hombres se retiraran. Esparta ha quedado en una posición debilitada con los Mesenios acechando al oeste y los Argivos al noreste. Tenemos que devolver a Esparta su antigua gloria, acabar con nuestros rivales locales y combatir el ascenso de Macedonia al norte."
 interesting_histories_country_events.spa.a:0 "Hora de hacer historia"
 interesting_histories_country_events.jud.t:0 "Judea"
 interesting_histories_country_events.jud.desc:0 "Judea era hasta hace poco una provincia del Imperio persa aqueménida, aunque nominalmente independiente y gobernada por gobernadores judíos. Después de la conquista de [GetCharacter('(int32)39').GetName] hace unas décadas, Judea ha caído bajo el dominio de los imperios helenísticos. El país vuelve a encontrarse en una posición peligrosa con los generales de [GetCharacter('(int32)39').GetPraenomen] luchando por la supremacía sobre partes de su imperio."
 interesting_histories_country_events.jud.a:0 "Hora de hacer historia"
 interesting_histories_country_events.byz.t:0 "Bizancio"
 interesting_histories_country_events.byz.desc:0 "Bizancio fue colonizada en los primeros tiempos de la expansión Griega por colonos de la ciudad-estado de Mégara. La leyenda cuenta que un hombre llamado Bizas, quien lideraba el grupo de colonos de Mégara, se instaló aquí tras consultar el oráculo de Apolo en Delfos. Tras ser capturada durante la invasión Persa de Grecia, Bizancio fue liberada 34 años después por un ejército Griego dirigido por el general Espartano Pausanias. Ha disfrutado de una paz relativa y de un crecimiento constante como ciudad comercial próspera debido a su posición en la ruta terrestre de Europa a Asia y en la ruta marítima del Mar Negro al Mediterráneo."
 interesting_histories_country_events.byz.a:0 "Hora de hacer historia"
 interesting_histories_country_events.bri.t:0 "Brigantia"
 interesting_histories_country_events.bri.desc:0 "Brigantia, la mayor tribu de Britania, está formada por muchas subtribus, como los Gabrantovices, en la costa de Yorkshire, y los Textoverdi, en el valle superior del Río Tyne del Sur. El paisaje se compone de musgos, pantanos y bosques, habitados por animales salvajes como osos pardos eurasiáticos, jabalíes, lobos, ciervos y águilas. La Diosa Brigantia, que significa 'La Alta' en Celta, es venerada por las tribus Brigantes. La Diosa es representada como una deidad guardiana con corona, con una cabeza de Gorgona en su pecho, sosteniendo una lanza y un orbe de la victoria."
 interesting_histories_country_events.bri.a:0 "Hora de hacer historia"
 interesting_histories_country_events.syr.t:0 "Siracusa"
 interesting_histories_country_events.syr.desc:0 "Las fértiles tierras de Siracusa fueron colonizadas originalmente por colonos Griegos procedentes de Corinto y Tenea. Con el paso de los siglos, la pequeña colonia creció hasta convertirse en una de las ciudades Griegas más poderosas del Mediterráneo, fundando sus propias ciudades por toda la isla. El poder de Siracusa hizo inevitable el enfrentamiento con los Cartagineses, que ahora gobiernan las ciudades púnicas al oeste. La última y devastadora guerra terminó hace unos años con otro tratado de paz, pero esto no ha impedido que los poderosos Cartagineses interfieran en la política de Siracusa. Las constantes guerras y luchas internas han debilitado enormemente su poder sobre la isla."
 interesting_histories_country_events.syr.a:0 "Hora de hacer historia"
 interesting_histories_country_events.kno.t:0 "Cnosos"
 interesting_histories_country_events.kno.desc:0 "En la mitología Griega, el Rey Minos de Creta construyó un palacio en Cnosos con un laberinto para su hijo, que tenía la cabeza de un toro y el cuerpo de un hombre, ahora llamado el Minotauro. Tras la caída de los Minoicos, Creta fue colonizada por Griegos del continente y Cnosos creció hasta convertirse en una de las ciudades más importantes de la isla. La ciudad tenía dos puertos: Amniso y Heraclión. Recientemente, Cnosos se ha visto envuelta en frecuentes hostilidades con la ciudad-estado más pequeña de Licto, situada al este, lo que ha obligado a los Lictos a pedir ayuda a los Espartanos."
 interesting_histories_country_events.kno.a:0 "Hora de hacer historia"

 interesting_histories_country_events.mas.t: "Massilia"
 interesting_histories_country_events.mas.desc: "[ROOT.GetCountry.GetName] fue fundada por colonos griegos de #E Focea#! hace unos trescientos años y desde entonces se ha convertido en uno de los principales puertos comerciales del mundo conocido, con una población de más de cuarenta mil habitantes.\n\nEntre otras cosas, es conocida por exportar vino fino, cerdo salado y pescado, plantas aromáticas y medicinales, coral y corcho. La ciudad tiene un gran templo del culto de #E Apolo de#! [GetProvince('(int32)424').GetName] en una colina con vista al puerto y un templo del Culto de #E Artemisa de#! [GetProvince('(int32)290').GetName] en el otro extremo de la ciudad.\n\nMassilia sigue siendo la líder de las ciudades griegas del Oeste y el principal centro de civilización en la Galia, pero este estatus está cada vez más amenazado por los poderes en crecimiento de [GetCountry('CAR').GetName] y [GetCountry('ROM').GetName] al sur."
 interesting_histories_country_events.mas.a: "Es hora de hacer historia..."

 interesting_histories_country_events.bpk.t: "Reino del Bósforo"
 interesting_histories_country_events.bpk.desc: "Originariamente colonizada por griegos de [GetProvince('(int32)1973').GetName], durante los últimos siglos, la próspera [ROOT.GetCountry.GetName] ha establecido su dominio sobre la región #E Taurica#! en el extremo norte del #E Pontus Euxinus#!. Puede exportar trigo, pescado y esclavos durante todo el año gracias a que la ciudad de [GetProvince('(int32)4544').GetName] permanece libre de hielo durante el invierno.\n\nDespués de la muerte del rey Paerisades hace unos años, se libró una brutal guerra de sucesión entre sus hijos #E Sátiro#!, #E Eumelo#! y #E Pritanis#!, y Eumelo finalmente derrotó a sus hermanos y reclamó el poder. Sin embargo, el reinado de Eumelo duró poco, ya que Basileus murió en un trágico accidente de carruaje y el joven [ROOT.GetCountry.GetRuler.GetName] ascendió al trono hace sólo unos meses.\n\nAunque la gente espera un período de calma después de los caóticos acontecimientos de los últimos cinco años, las fronteras del Reino del Bósforo han estado expuestas a ataques cada vez más violentos por parte de los nómadas y jinetes esteparios que viven a su alrededor."
 interesting_histories_country_events.bpk.a: "Hora de hacer historia"
 interesting_histories_country_events.mry.t:0 "Maurya"
 interesting_histories_country_events.mry.desc:0 "Fundado por Chandragupta Maurya hace sólo unas décadas, el Imperio Maurya ha comenzado a dominar el subcontinente indio. Después del vacío de poder provocado por la muerte de [GetCharacter('(int32)39').GetName], Chandragupta lideró una serie de campañas para retomar las tierras controladas por los helénicos en la India. El general griego Eudemo controlaba los territorios del norte de la India de [GetCharacter('(int32)39').GetPraenomen], por lo que Chandragupta orquestó una rebelión para expulsar al gobernador griego y ahora ha puesto el valle del Indo bajo su control. Seleuco, basileus del gran Imperio Helénico Seléucida al oeste, ahora busca recuperar estos territorios de manos de Maurya."
 interesting_histories_country_events.mry.a:0 "Hora de hacer historia"
 stupid_ass_tooltip:0 "#G Tras el ascenso de Ashoka al trono, un nuevo árbol de misiones quedará disponible#!"
 interesting_histories_country_events.arm.t: "Armenia"
 interesting_histories_country_events.arm.desc: "Cuando la región fue conquistada por #E Ciro el Grande#!, el fundador del #E Imperio aqueménida#!, pasó a formar parte del sátrapa oficial de [ROOT.GetCountry.GetName].\n\nDespués de la conquista de #E Persia#! por #E [GetCharacter('(int32)39').GetName]#! y su posterior muerte, un general macedonio llamado Neoptólemo intentó controlar Armenia. Neoptólemo murió apenas dos años después, dejando que la dinastía armenia Orontid, a quien Alexandros había designado previamente para gobernar la región, tomara el trono."
 interesting_histories_country_events.arm.a: "Hora de hacer historia"
 interesting_histories_country_events.cal.t:0 "Caledonia"
 interesting_histories_country_events.cal.desc:0 "Los #E caledonios#! son una confederación tribal de habla británica en las tierras altas centrales escasamente pobladas, donde vastas cadenas montañosas y lagos de agua dulce dominan la región. Como muchas tribus celtas en Gran Bretaña, son agricultores y constructores de castros. La mayoría de los castros de piedra son circulares, con empalizadas de madera y zanjas que proporcionan una capa secundaria de defensa para las casas circulares de madera."
 interesting_histories_country_events.cal.a:0 "Hora de hacer historia"
 interesting_histories_country_events.epo.t:0 "Emporion"
 interesting_histories_country_events.epo.desc:0 "[ROOT.GetCountry.GetName] fue fundada por colonos griegos de #E Focea#! en una pequeña isla en la desembocadura del #E río Fluvià#! hace unos doscientos cincuenta años. A pesar de la fuerte presión de los fenicios [GetCountry('CAR').GetName], que han enviado sus flotas contra nosotros muchas veces, la ciudad ha logrado conservar su carácter helénico independiente, pero aún está por verse si esto es una casualidad de la historia.\n\nA lo largo de los años, se han hecho acuerdos políticos y comerciales con las tribus indígenas ibéricas, que ven a [ROOT.GetCountry.GetCapital.GetName] con una mezcla de sospecha y envidia. Sin embargo, con el creciente poder de Cartago y las tribus locales cada vez mejor organizadas, la existencia de Emporion se ve reforzada por acuerdos defensivos con las cercanas ciudades griegas de Massilia y Hemeroskopeion, pero existen dudas sobre si esto será suficiente para mantener la ciudad libre."
 interesting_histories_country_events.epo.a: "Hora de hacer historia"
 interesting_histories_country_events.hmk.t:0 "Hemeroscopio"
 interesting_histories_country_events.hmk.desc:0 "[ROOT.GetCountry.GetName], que significa #E 'Atalaya'#! en griego, fue originalmente un puesto comercial fundado por los griegos Massiliotas que quedaron encantados con la ubicación favorable de la ciudad.\n\nLas minas de hierro cercanas y su puerto natural en la costa ibérica han bendecido a la ciudad y, a lo largo de los siglos, ha evolucionado hasta convertirse en una pequeña ciudad-estado fortificada con una cultura única y floreciente.\n\nSin embargo, no todo va sobre ruedas; Los intereses comerciales rivales #E griegos#! y #E fenicios#! en el Mediterráneo occidental han dado lugar a disputas persistentes, y se teme que nuestro relativo aislamiento, especialmente en comparación con otras colonias Massiliot, pueda convertirnos en un blanco fácil."
 interesting_histories_country_events.hmk.a:0 "Hora de hacer historia"
 interesting_histories_country_events.mst.t:0 "Menesteo"
 interesting_histories_country_events.mst.desc:0 "Menesteo, originalmente una colonia de la ciudad Griega de Massalia, está situada en un islote en el estuario del Río Guadalhorce, lo que le permite defenderse de las tribus Ibéricas locales y de los asentamientos Fenicios competidores. Los habitantes producen pescado salado y diversas salsas de pescado que se venden en el ágora de la ciudad o se exportan a todo el Mediterráneo."
 interesting_histories_country_events.mst.a:0 "Hora de hacer historia"
 interesting_histories_country_events.umb.t:0 "Umbria"
 interesting_histories_country_events.umb.desc:0 "Durante los últimos siglos, los Etruscos han estado avanzando desde el litoral occidental, empujando lentamente a los Umbrios hacia las tierras altas de los Apeninos. La mayoría de los pueblos y ciudades Umbrios que quedan se encuentran ahora en cimas fácilmente defendibles situadas a lo largo de las Montañas de los Apeninos. Con la aparición de una nueva potencia regional en el sur, los viejos enemigos empiezan a reconsiderar su anterior hostilidad."
 interesting_histories_country_events.umb.a:0 "Hora de hacer historia"
 interesting_histories_country_events.myl.t:0 "Mosylon"
 interesting_histories_country_events.myl.desc:0 "Mosylon es un importante puerto comercial Puntita en la costa del Mar Rojo, desde donde se exporta mirra, especias, oro, ébano, ganado, marfil e incienso hacia Egipto y Mesopotamia. Controla gran parte del comercio de canela que llega desde los puertos de la India, y es conocida por poseer la mejor variedad de esta especia en el mundo. También importa recipientes de vidrio del Antiguo Egipto, uvas de Dióspolis y telas para los mercados Bereberes."
 interesting_histories_country_events.myl.a:0 "Hora de hacer historia"
 interesting_histories_country_events.boi.t:0 "Boyos"
 interesting_histories_country_events.boi.desc:0 "Los Boyos son una tribu Gala itinerante, conocida principalmente por sus conocimientos agrícolas y sobre la cría de ganado, quienes actualmente se han asentado en el norte de Italia. Tras cruzar los Alpes, la tribu Gala de los Boyos llegó a las fértiles y bien regadas fronteras de las naciones Itálica. Junto con otras tribus Galas expulsaron a los Itálicos Etruscos hacia el sur del Valle del Po, ocupando el antiguo asentamiento etrusco de Felsina, el cual convirtieron en su capital y rebautizaron como Bononia."
 interesting_histories_country_events.boi.a:0 "Hora de hacer historia"
 interesting_histories_country_events.byb.t:0 "Biblos"
 interesting_histories_country_events.byb.desc:0 "Biblos es uno de los cuatro reinos vasallos fenicios establecidos por los persas a lo largo de la costa del Levante, los otros son Arados, Sidón y Tiro. Cuando[GetCharacter('(int32)39').GetName] derrotó al Imperio Persa hace unas décadas, Biblos y los demás reinos fenicios cayeron bajo el dominio helénico. La ciudad se especializa en las industrias de cerámica, vidrio y tinte púrpura, mientras que su puerto contiene almacenes para productos importados de Siria, Persia e India. La prosperidad económica ha llevado a una reactivación de la construcción y el desarrollo urbano."
 interesting_histories_country_events.byb.a:0 "Hora de hacer historia"
 interesting_histories_country_events.sid.t:0 "Sidón"
 interesting_histories_country_events.sid.desc:0 "Sidón es uno de los cuatro reinos vasallos fenicios establecidos por los persas a lo largo de la costa del Levante, los otros son Arados, Biblos y Tiro. Cuando [GetCharacter('(int32)39').GetName] derrotó al Imperio persa hace unas décadas, Sidón y los demás reinos fenicios cayeron bajo el dominio helénico. La ciudad goza ahora de relativa autonomía e incluso organiza juegos a los que se invita a participar a los mejores atletas de la región."
 interesting_histories_country_events.sid.a:0 "Hora de hacer historia"
 interesting_histories_country_events.ara.t:0 "Arados"
 interesting_histories_country_events.ara.desc:0 "Arados es uno de los cuatro reinos vasallos fenicios establecidos por los persas a lo largo de la costa del Levante, los otros son Biblos, Sidón y Tiro. Cuando [GetCharacter('(int32)39').GetName] derrotó al Imperio Persa hace unas décadas, Arados y los demás reinos fenicios cayeron bajo el dominio helénico. La ciudad capital se encuentra en una isla cerca de donde el río Orontes desemboca en el Mar Mediterráneo, lo que proporciona una base segura para empresas comerciales en el valle de Orontes."
 interesting_histories_country_events.ara.a:0 "Hora de hacer historia"
 interesting_histories_country_events.ath.t:0 "Atenas"
 interesting_histories_country_events.ath.desc:0 "Durante las últimas décadas, el dominio de Macedonia en los asuntos atenienses había ido aumentando, culminando con la derrota de Felipe II de Macedonia de una alianza de ciudades-estado griegas lideradas por Atenas y Tebas en la batalla de Queronea. El estadista macedonio Antípatro disolvió el gobierno ateniense y estableció el actual sistema plutocrático, poniendo fin efectivamente a la independencia ateniense. Después de la muerte de [GetCharacter('(int32)39').GetName], Atenas se ha convertido en un Feudatorio del Reino Antigónida. La ciudad en sí sigue siendo rica y es uno de los principales centros comerciales de la región, pero ha dejado de ser el líder de las ciudades-estado griegas. Es conocido por ser un centro de artes, aprendizaje y filosofía, hogar de la Academia de Platón y el Liceo de Aristóteles."
 interesting_histories_country_events.ath.a:0 "Hora de hacer historia"
 interesting_histories_country_events.bac.t:0 "Bactria"
 interesting_histories_country_events.bac.desc:0 "Bactria, un poderoso sátrapa del reino seléucida, se encuentra en una serie de oasis fértiles a lo largo del río Amu Darya y al norte de la cordillera del Hindu Kush. Antes de la conquista de [GetCharacter('(int32)39').GetName], los ejércitos de Bactria estaban compuestos en su abrumadora mayoría por caballería y eran bien conocidos como soldados eficaces. Después de conquistar la región, [GetCharacter('(int32)39').GetPraenomen] añadió unidades de caballería bactriana a su ejército en su avance hacia el este, hacia la India, e incluso añadió unidades de caballería bactriana leales a su caballería de élite. Durante las últimas décadas, tanto [GetCharacter('(int32)39').GetPraenomen] como Seleuco I han trasladado colonos griegos a Bactria, lo que ha dado lugar a una mezcla diversa de culturas helenísticas y bactrianas."
 interesting_histories_country_events.bac.a:0 "Hora de hacer historia"
 interesting_histories_country_events.par.t:0 "Partia"
 interesting_histories_country_events.par.desc:0 "Tras la muerte de [GetCharacter('(int32)39').GetName], en el evento conocido como la #E Partición de Babilonia#!, [GetCountry('PAR').GetName] se convirtió en sátrapa del gran [GetCountry('SEL').GetName] del sur. La mayor parte del territorio parto es accidentado con grandes elevaciones, lo que conduce a un clima más severo, y #E tribus escitas#! pueblan las estepas al norte a lo largo del #E Mar Negro#!.\n\nAunque bajo el dominio helenístico, Partia es mayoritariamente #E iraní#! culturalmente, lo que genera malestar entre una población dividida que está gobernada por los extranjeros [ROOT.GetCountry.GetRuler.GetName]."
 interesting_histories_country_events.par.a:0 "Hora de hacer historia"
 interesting_histories_country_events.phi.t:0 "Fasis"
 interesting_histories_country_events.phi.desc:0 "El asentamiento de Fasis fue fundado en la costa oriental del Mar Negro hace unos siglos por colonos Griegos procedentes de Mileto. Aquí ha prosperado debido a que se encuentra en una ruta comercial desde la India, en la que se transportan grandes cantidades de mercancías Indias por rutas fluviales y terrestres a través del Mar Caspio. La región es rica en oro, hierro, madera y miel, productos que se exportan principalmente a otras ciudades-estado Helénicas."
 interesting_histories_country_events.phi.a:0 "Hora de hacer historia"
 interesting_histories_country_events.mna.t:0 "Manapia"
 interesting_histories_country_events.mna.desc:0 "Los Celtas trajeron a las Islas Británicas sus conocimientos sobre el trabajo del hierro hace muchos siglos. El hierro era muy superior a las armas de la población indígena de la Edad de Bronce, ya que era más fuerte y duradero. A lo largo de varios siglos sometieron a los habitantes locales, convirtiendo el Gaélico en la cultura dominante en la isla. La tribu Gaélica Manapia se asentó en la costa oriental de Irlanda, donde las constantes guerras tribales ofrecen a los individuos la oportunidad de mejorar su posición social."
 interesting_histories_country_events.mna.a:0 "Hora de hacer historia"
 interesting_histories_country_events.hcp.t:0 "Heraclea Póntica"
 interesting_histories_country_events.hcp.desc:0 "Fundada por la ciudad-estado griega de Megara hace más de dos siglos, Heraclea Póntica está gobernada actualmente por la Reina Amastris, última descendiente de la dinastía Persa Aqueménida. Al prosperar gracias a las ricas y fértiles tierras y a la pesca marítima de su puerto natural, Heraclea pronto extendió su control sobre varias ciudades de los alrededores."
 interesting_histories_country_events.hcp.a:0 "Hora de hacer historia"
 interesting_histories_country_events.rho.t:0 "Rodas"
 interesting_histories_country_events.rho.desc:0 "Rodas es una república plutocrática que ha mantenido tratados de neutralidad con otros imperios para proteger sus redes comerciales en todo el Egeo. Tras la muerte de [GetCharacter('(int32)39').GetName] hace 18 años, Rodas formó fuertes vínculos comerciales y culturales con el general [GetCharacter('(int32)42').GetName] de [GetCharacter('(int32)39').GetPraenomen] en Egipto. Estos lazos finalmente resultarían en que [GetCharacter('(int32)37').GetName], basileo del Reino Antigónida, enviara a su hijo [GetCharacter('(int32)38').GetName] a sitiar la isla de Rodas. \n\nCon incontables miles de hombres y cientos de barcos, [GetCharacter('(int32)38').GetName] lideraría un asedio de casi un año contra nuestra gran ciudad. El ejército antigónida construyó una gran torre de asedio como ningún hombre había visto antes; a 130 pies de altura, la torre requirió más de 3.600 hombres solo para moverla. El ejército finalmente pudo romper los muros exteriores de la ciudad después de muchos meses de intensos combates con grandes pérdidas en ambos lados.\n\nEn un esfuerzo final, el pueblo de Rodas construyó apresuradamente un segundo muro ahora conocido como la Acrópolis de Rodas. Fue dentro de la acrópolis donde el pueblo de Rodas lucharía valientemente y repelería múltiples ataques frontales de las fuerzas antigónidas. Hace sólo unas semanas [GetCharacter('(int32)38').GetName] finalmente recibió la orden de [GetCharacter('(int32)37').GetName] de detener el asedio, el pueblo de Rodas ahora sale victorioso. Sin embargo, el asedio que duró un año ha devastado nuestra otrora próspera isla y queda mucho por hacer para devolverla a su antigua gloria."
 interesting_histories_country_events.rho.a:0 "Hora de hacer historia"
 interesting_histories_country_events.ice.t:0 "Icenia"
 interesting_histories_country_events.ice.desc:0 "La tribu #E Iceni#!, cuyo nombre proviene del #E río Iken#! que fluye a través de su tierra, es conocida por su equitación y trabajo del metal. Los carros se utilizan a menudo durante la guerra y son un símbolo de poder entre la comunidad tribal. Los guerreros lanzan jabalinas desde carros en movimiento antes de abandonarlos para luchar a pie y luego regresan a ellos para redesplegarse.\n\nViven en granjas que consisten en grandes casas circulares, con altos techos de paja que capturan el calor y el humo de los fuegos interiores. Económicamente son agricultores, cultivan pequeños campos de trigo o cebada y pastan animales domésticos como ovejas."
 interesting_histories_country_events.ice.a:0 "Hora de hacer historia"
 interesting_histories_country_events.ksh.t:0 "Kush"
 interesting_histories_country_events.ksh.desc:0 "Hace milenios, la pequeña ciudad-estado de Kerma surgió como una fuerza política dominante a lo largo del valle central del Nilo, convirtiéndose finalmente en el poderoso reino de Kush. Debido a las hostilidades con Egipto al norte, la capital se trasladó al sur, a Meroe, una zona rica en mineral de hierro y madera dura para trabajar el hierro. Los productos de hierro de calidad se comercializan con el resto de países de la región, junto con el oro, el marfil y los esclavos. En la actualidad, Meroe es la sede del gobierno y del palacio real. La capital está floreciendo, hay muchos proyectos de construcción en curso, como el nuevo recinto funerario real, que cuenta con distintivas pirámides Kushitas construidas con el mejor granito y arenisca."
 interesting_histories_country_events.ksh.a:0 "Hora de hacer historia"
 interesting_histories_country_events.the.t:0 "Tebas"
 interesting_histories_country_events.the.desc:0 "Hace tres décadas, [GetCharacter('(int32)39').GetName] de Macedonia quemó la ciudad de Tebas después de un intento de rebelión contra la ocupación macedonia. Miles de personas murieron en batalla o posteriormente fueron ejecutadas, mientras que las mujeres y los niños fueron esclavizados. El sucesor de [GetCharacter('(int32)39').GetPraenomen], Casandro, en busca de buena voluntad y aliados griegos, inició la restauración de Tebas con importantes contribuciones de Atenas, Megalópolis y Mesene. Ahora, con sus murallas defensivas reconstruidas y los esfuerzos de restauración en curso en toda la ciudad, los exiliados tebanos han reubicado el sitio con la esperanza de que recupere una vez más su antigua prominencia."
 interesting_histories_country_events.the.a:0 "Hora de hacer historia"
 interesting_histories_country_events.vnt.t:0 "Vénetos"
 interesting_histories_country_events.vnt.desc:0 "Las tribus Vénetas de Italia viven entre la cordillera de los Dolomitas y el Mar Adriático, en un paisaje formado por ríos, pantanos e islas costeras. Tienen fama de ser excelentes criadores de caballos, produciendo algunos de los más fuertes y rápidos del mundo Helénico. La ciudad de Altinum es un floreciente centro comercial situado a lo largo de la Ruta del Ámbar, una ruta comercial por la que se transporta el ámbar del lejano Mar Báltico hacia el sur, hasta el Mediterráneo. Hace un año, una flota comandada por el príncipe Espartano Cleónimo intentó asaltar los prósperos asentamientos del Véneto, pero los Vénetos se defendieron destruyendo los barcos Espartanos. Los Vénetos han entrado repetidamente en conflicto con las tribus Galas, las cuales se han asentado en tierras anteriormente habitadas por las naciones Itálicas. El Véneto debe moverse rápidamente para asegurarse aliados si quiere salir airoso y aplastar todas las futuras incursiones."
