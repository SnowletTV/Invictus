l_spanish:
 
 #Mission 1
 
 aksum_mission_1_ethiopia:0 "Ascenso Aksumita"
 aksum_mission_1_ethiopia_DESCRIPTION:0 "El reino de Aksum, ubicado en las tierras altas montañosas de Etiopía, se encuentra en una encrucijada, tanto en sentido literal como figurado: hay muchos que viajan a través de nuestro reino y se maravillan ante nuestras maravillas. Sin embargo, existen grandes oportunidades para los audaces en estas tierras; Al prepararnos para conquistar a nuestros vecinos, controlaremos las ricas rutas comerciales que atraviesan estas regiones distantes."
 aksum_mission_1_ethiopia_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completada cuando hayamos asegurado nuestra hegemonía sobre las áreas etíopes circundantes."
 aksum_mission_1_ethiopia_BUTTON_TOOLTIP:0 "¡Etiopía será nuestra!"
 aksum_mission_1_ethiopia_BUTTON_DETAILS: ""
 
 aksum_mission_1_ethiopia_task_1:0 "El Reino de Aksum"
 aksum_mission_1_ethiopia_task_1_DESC:0 "Gestionaremos mejor las tierras de nuestros países vecinos, y esa es la única razón por la que necesitamos reclamarlo. Que nuestros deseos se den a conocer en toda la región y di a nuestros hombres que se preparen para la batalla. \n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 
 aksum_mission_1_ethiopia_task_2:0 "Alimentando al Pueblo"
 aksum_mission_1_ethiopia_task_2_DESC:0 "Nuestras tierras de cultivo son pocas y las laderas rocosas que componen el núcleo de nuestras tierras a menudo tienen bajos rendimientos en el momento de la cosecha. Es absolutamente necesario garantizar los alimentos disponibles para nuestro pueblo, especialmente si tenemos en cuenta el dicho de que los ejércitos marchan boca abajo. Esto se ha convertido en una cuestión de seguridad nacional. \n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 
 aksum_mission_1_ethiopia_task_3:0 "La Gran Ciudad de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]"
 aksum_mission_1_ethiopia_task_3_DESC:0 "Nuestra capital ya es la envidia de nuestros vecinos; Realmente, no hay otras ciudades cercanas que puedan presumir de ser iguales. Sin embargo, hay más que podríamos hacer; Abre el tesoro y convoca a los constructores. \n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 
 aksum_mission_1_ethiopia_task_4:0 "Dominar Aksum"
 aksum_mission_1_ethiopia_task_4_DESC:0 "Los ridículos 'Reyes' de Mai Adrasha y Daamot han reclamado partes de la provincia de Aksum como propias, pero pronto conocerán el lugar que les corresponde como escabel de tus pies. \n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 
 aksum_mission_1_ethiopia_task_5:0 "Atacar Tenesis"
 aksum_mission_1_ethiopia_task_5_DESC:0 "Hay muchas razones por las que deseas tener la provincia de Tenesis como tuya, y el acceso a las aguas del Sinus Arabus es la principal de ellas. No pasará mucho tiempo antes de que los barcos aksumitas zarpen del puerto de Adouli. \n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 
 aksum_mission_1_ethiopia_task_6:0 "Hacia Semien"
 aksum_mission_1_ethiopia_task_6_DESC:0 "Hemos decidido ampliar nuestras fronteras hacia el sur; No descansaremos hasta que nuestro reino toque las aguas del lago Tana. El rey de Gwanara pronto será derribado para siempre. \n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 
 aksum_mission_1_ethiopia_task_7:0 "Un Estado en Ascenso"
 aksum_mission_1_ethiopia_task_7_DESC:0 "No contento con dormirse en los laureles, el Reino de Aksum invierte en sí mismo, sabiendo que una patria fuerte y próspera es un requisito para futuros proyectos. \n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
 aksum_mission_1_ethiopia_task_8:0 "Unidad de Aksum"
 aksum_mission_1_ethiopia_task_8_DESC:0 "Hemos establecido un reino que es verdaderamente digno de los Aksumitas, gracias al liderazgo inspirador de nuestro Rey victorioso. El pueblo se alegra y las monedas fluyen hacia nuestras arcas; ¡Salve [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], Señor de Aksum! \n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 
 aksum_mission_1_ethiopia_task_9:0 "Incipiente Comercio de Marfil"
 aksum_mission_1_ethiopia_task_9_DESC:0 "Tenemos la suerte de tener acceso a elefantes y, como tal, también producimos marfil como bien de lujo, aunque en pequeñas cantidades. Con un poco de inversión, sin duda podríamos hacer crecer nuestro comercio de marfil, si decidimos hacerlo. \n\n\n\n\n\n\n\n\n\n@egypt_mil20!"
 
 aksum_mission_1_ethiopia_task_10:0 "Desarrollo de Infraestructura"
 aksum_mission_1_ethiopia_task_10_DESC:0 "Cuanto más construimos, mejor formados estarán nuestros arquitectos. La infraestructura de Aksumite es la mejor de nuestra región y debemos continuar financiando la construcción tan rápido como nuestros fondos lo permitan. \n\n\n\n\n\n\n\n\n\n@event_pic4!"
 
 aksum_mission_1_ethiopia_task_11:0 "Comercio Costero"
 aksum_mission_1_ethiopia_task_11_DESC:0 "Producimos una variedad de bienes comerciales que son deseados en todo el mundo, y nuestra gente también está adquiriendo gusto por las cosas finas que se venden en los mercados. Las rutas terrestres son rentables pero lentas; deberíamos reforzar nuestra capacidad de comerciar a través del Sinus Arabus. ¡Amplíe nuestros puertos! \n\n\n\n\n\n\n\n\n\n@egypt_mil22!"
 
 aksum_mission_1_ethiopia_task_12:0 "Asuntos de Mirra"
 aksum_mission_1_ethiopia_task_12_DESC:0 "La mirra, el valioso bien comercial que producimos en Matara, siempre tiene un precio atractivo en los mercados, donde la demanda siempre supera a la oferta. ¿Podría haber algo que podamos hacer para producir más? \n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 
 #Events 1
 me_aksum_nubia_1_title:0 "$aksum_mission_1_ethiopia_task_1$"
 me_aksum_nubia_1_desc:0 "Ya no hay vuelta atrás; Vuestros reclamos sobre las tierras de Semien y Tenesis se han hecho públicos, y mensajeros han entregado vuestras proclamas a los tribunales de vuestros vecinos. Aunque se le acusa de ser un belicista que atenta contra la paz en nuestra patria, no puede evitar reírse de los insultos; ¿Eso es todo lo que tus enemigos planean hacer?"
 me_aksum_nubia_1.a:0 "Si tienen algún problema con eso, que intenten detenernos."
 me_aksum_nubia_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_1_ethiopia_task_1$#!' $mission_completed_tooltip_2$"
 
 me_aksum_nubia_2_title:0 "$aksum_mission_1_ethiopia_task_2$"
 me_aksum_nubia_2_desc:0 "Todavía es temprano en la mañana; el sol apenas ha salido sobre las aguas del Sinus Arabus, pero ya el calor es opresivo y fulminante; Es bueno que no estés afuera por mucho tiempo. Usted está visitando una de las comunidades agrícolas que ha financiado y los ingenieros y arquitectos locales le ofrecen un recorrido, quienes están muy orgullosos de lo que han logrado. Mientras caminas por los canales que llevan agua a los campos, no podrás evitar quedar impresionado por el ingenio de tus trabajadores."
 me_aksum_nubia_2.a:0 "Has hecho una gran cosa por Aksum; estoy contento"
 me_aksum_nubia_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_1_ethiopia_task_2$#!' $mission_completed_tooltip_2$"
 
 me_aksum_nubia_3_title:0 "$aksum_mission_1_ethiopia_task_3$"
 me_aksum_nubia_3_desc:0 "'¿Y qué pasa con esto?' preguntas, señalando el dibujo frente a ti. Después de meses de construcción, el trabajo finalmente se completó y usted está examinando los informes finales presentados por sus ingenieros. 'Ah sí, Señor [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName].' responde el arquitecto, inclinándose levemente. Creo que esto le agradará muchísimo. Hemos completado diseños que ampliaron enormemente nuestro distrito comercial; Ahora gente de todas partes acudirá en masa a los mercados de Aksum.' \n\nDe pie, aplaudes. \"Quiero ir a ver lo que has construido con mis propios ojos, y luego presentaremos nuestros respetos a los dioses por bendecirnos\"."
 me_aksum_nubia_3.a:0 "Haremos ofrendas en el Templo de Maher."
 me_aksum_nubia_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_1_ethiopia_task_3$#!' $mission_completed_tooltip_2$"
 
 me_aksum_nubia_4_title:0 "$aksum_mission_1_ethiopia_task_4$"
 me_aksum_nubia_4_desc:0 "Después de una guerra sangrienta, tus enemigos han sido derrotados, su poder ha sido destruido para siempre y la provincia de Aksum se ha reunido bajo un solo gobernante: tú. Es lamentable que tantas personas hayan tenido que morir para que llegue este día, pero ustedes saben en su corazón que hubo que tomar decisiones difíciles. Incluso ahora, los reinos vecinos os ofrecen un respeto que antes no os ofrecían; las glorias del futuro valdrán el costo pagado hoy."
 me_aksum_nubia_4.a:0 "Aksum me pertenece. Solo he hecho lo que debo"
 me_aksum_nubia_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_1_ethiopia_task_4$#!' $mission_completed_tooltip_2$"
 
 me_aksum_nubia_5_title:0 "$aksum_mission_1_ethiopia_task_5$"
 me_aksum_nubia_5_desc:0 "Las fortificaciones de la ciudad de Adouli ofrecen una vista imponente del Sinus Arabus; estás parado sobre las almenas abrasadas por la batalla, contemplando las escenas caóticas debajo de ti. Las guerras que habéis concluido recientemente han dejado cicatrices en esta tierra, pero el daño causado por vuestros ejércitos se solucionará con el tiempo. Incluso ahora, equipos de hombres están trabajando para reparar las paredes; silbas suavemente mientras observas a cientos de trabajadores colocando los enormes bloques de piedra en su lugar. En poco tiempo, el puerto quedará vacío de equipos de construcción y los barcos mercantes ocuparán su lugar; no se puede esperar."
 me_aksum_nubia_5.a:0 "Un nuevo capítulo en nuestra historia comienza este día."
 me_aksum_nubia_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_1_ethiopia_task_5$#!' $mission_completed_tooltip_2$"
 
 me_aksum_nubia_6_title:0 "$aksum_mission_1_ethiopia_task_6$"
 me_aksum_nubia_6_desc:0 "Tus campañas en las tierras de Semien han terminado y has decidido celebrar tu victoria con un crucero de placer por el lago Tana ahora que tienes acceso a esta masa de agua. Mientras observas a los trabajadores cargar vino y alimentos en tu barcaza, no puedes evitar reflexionar sobre el sinuoso camino que te ha traído hasta este momento. Aksum alguna vez fue solo una tierra de montañas y barrancos, pero ahora controlamos ríos y valles; la vida puede ser muy extraña a veces, con sus giros y vueltas. Llevando un suculento dátil a tu boca, lo masticas lentamente, disfrutando de este momento; Es posible que surjan problemas con el amanecer, pero por ahora estás satisfecho."
 me_aksum_nubia_6.a:0 "Nos bañaremos en las aguas del Nilo Azul."
 me_aksum_nubia_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_1_ethiopia_task_6$#!' $mission_completed_tooltip_2$"
 
 me_aksum_nubia_7_title:0 "$aksum_mission_1_ethiopia_task_7$"
 me_aksum_nubia_7_desc:0 "Gracias a las inversiones provinciales que usted ha ordenado, Aksum está disfrutando de un período como ningún otro en su histórica historia. Parece que la previsión de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] está dando sus frutos, y el impulso resultante en nuestra investigación nos llevará incluso más lejos de lo que ya hemos llegado. ¡Este es un día que vale la pena celebrar!"
 me_aksum_nubia_7.a:0 "Un rey sabio se preocupa por su pueblo"
 me_aksum_nubia_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_1_ethiopia_task_7$#!' $mission_completed_tooltip_2$"
 
 me_aksum_nubia_8_title:0 "$aksum_mission_1_ethiopia_task_8$"
 me_aksum_nubia_8_desc:0 "Cuando se escriban las historias de Aksum, habrá un nombre que se recordará por encima de todos los demás; el de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], el gobernante que unificó tierras que nadie más había tenido antes, que destruye a los pretendientes y establece ciudades majestuosas para nuestro pueblo. ¿Quién más es como nuestro Rey? ¡Toda gloria a [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], toda gloria a Aksum!"
 me_aksum_nubia_8.a:0 "Sólo estoy empezando; Verás lo que te depara el futuro."
 me_aksum_nubia_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_1_ethiopia_task_8$#!' $mission_completed_tooltip_2$"
 
 me_aksum_nubia_9_title:0 "$aksum_mission_1_ethiopia_task_9$"
 me_aksum_nubia_9_desc:0 "Recientemente, ordenaste que se triplicara la producción de marfil en tu reino, sabiendo mejor que nadie lo valiosos que son los colmillos de los elefantes, especialmente después de haber sido trabajados por un maestro artesano. Después de un período de inversión, le complace enormemente saber que Aksum se está volviendo conocido como un centro de comercio de marfil. Algunos de los productos que se producen en sus talleres son sorprendentes por su calidad; Le tienes especial cariño a un cetro de marfil que te regalaron los comerciantes, como agradecimiento por tu cuidadosa administración de esta floreciente industria."
 me_aksum_nubia_9.a:0 "¡Qué regalo tan bonito y reflexivo!"
 me_aksum_nubia_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_1_ethiopia_task_9$#!' $mission_completed_tooltip_2$"
 
 me_aksum_nubia_10_title:0 "$aksum_mission_1_ethiopia_task_10$"
 me_aksum_nubia_10_desc:0 "La experiencia es la mejor maestra y nadie puede afirmar que los arquitectos de Aksum sean principiantes en lo que respecta a la construcción de ciudades. Aunque es difícil trabajar en las tierras cálidas y polvorientas que llamamos hogar, nuestros hombres están a la altura de la tarea admirablemente y han aprendido un par de trucos en el camino; Podemos utilizar estas técnicas en el resto de nuestro reino."
 me_aksum_nubia_10.a:0 "Asegúrate de darles a los trabajadores mucha cerveza como forma de agradecimiento."
 me_aksum_nubia_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_1_ethiopia_task_10$#!' $mission_completed_tooltip_2$"
 
 me_aksum_nubia_11_title:0 "$aksum_mission_1_ethiopia_task_11$"
 me_aksum_nubia_11_desc:0 "Aunque nuestras costas son desiertos, duros y poco acogedores para los extraños, hemos hecho lo que ningún otro pudo hacer; Al construir puertos en los páramos, hemos creado verdaderos oasis, donde se congregan comerciantes y viajeros antes de aventurarse a otros lugares lejanos. Nuestro comercio costero está prosperando y nuestras tesorerías se hinchan con los ingresos fiscales; los dioses nos sonríen."
 me_aksum_nubia_11.a:0 "Poco a poco nos vamos haciendo ricos..."
 me_aksum_nubia_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_1_ethiopia_task_11$#!' $mission_completed_tooltip_2$"
 
 me_aksum_nubia_12_title:0 "$aksum_mission_1_ethiopia_task_12$"
 me_aksum_nubia_12_desc:0 "Se dice que puedes oler la ciudad de Matara antes de verla. Siguiendo las carreteras que salen de Aksum, uno se dirige al noreste, siguiendo las colinas que se endurecen hasta convertirse en picos montañosos. El camino se vuelve más difícil cuanto más se avanza, y justo cuando parece que hombres y animales de carga van a desmayarse del cansancio, sus fosas nasales se animan; Los vientos polvorientos transportan una dulce fragancia, la primera señal de que Matara está a poca distancia. La mirra producida en sus talleres y molinos es el alma de la ciudad, asegurando la prosperidad de esta lejana región."
 me_aksum_nubia_12.a:0 "Bienaventurados los Aksumitas, porque ¿quién más tiene tanta riqueza?"
 me_aksum_nubia_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_1_ethiopia_task_12$#!' $mission_completed_tooltip_2$"
 
 #Tooltips 1
 
 aksum_mission_1_ethiopia_task_1_tt:0 "Obtén reclamaciones sobre las provincias de #Y $aksum_area$#!, #Y $tana_area$#! y #Y $ona_area$#!."
 aksum_mission_1_ethiopia_task_2_tt:0 "Cualquier provincia productora de alimentos produce al menos #Y 2#! bienes."
 
 aksum_mission_1_ethiopia_task_6_tt:0 "La provincia de #Y $aksum_area$#! tiene al menos dos #Y Inversiones Provinciales#! diferentes de cualquier tipo."
 
 aksum_mission_1_ethiopia_task_8_tt:0 "Gana acceso a múltiples decisiones únicas."
 
 aksum_mission_1_ethiopia_task_9_tt:0 "Cualquier provincia productora de #Y Elefante#! produce al menos #Y 2#! bienes y tiene al menos #Y 15#! poblaciones."
 
 aksum_mission_1_ethiopia_task_10_tt:0 "Al menos #Y 3#! territorios en la provincia de #Y $aksum_area$#! tienen al menos #Y 3#! edificios."
 
 aksum_mission_1_ethiopia_task_11_tt:0 "Cualquier territorio tiene al menos #Y 2#! edificios portuarios."
 
 
 #Mission 2
 
 aksum_mission_2_nubia:0 "Río abajo"
 aksum_mission_2_nubia_DESCRIPTION:0 "Llevaremos nuestro reino a la grandeza"
 aksum_mission_2_nubia_CRITERIA_DESCRIPTION:0 "Ha llegado el momento de expandirnos, empujando nuestras fronteras hacia el oeste mientras consolidamos las tierras de nuestros vecinos en nuestro reino. Esta misión se considerará completada cuando hayamos asegurado nuestra hegemonía sobre las regiones de Nubia."
 aksum_mission_2_nubia_BUTTON_TOOLTIP:0 "¡Nubia será nuestra!"
 aksum_mission_2_nubia_BUTTON_DETAILS: ""
 
 aksum_mission_2_nubia_task_1:0 "Empuje hacia Nubia"
 aksum_mission_2_nubia_task_1_DESC:0 "Es importante para nuestros éxitos futuros que absorbamos la tierra de nuestros vecinos; No podemos darnos el lujo de tener a nadie cerca de nosotros que pueda amenazar nuestros planes para la región. \n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 
 aksum_mission_2_nubia_task_2:0 "Asegurar Gash"
 aksum_mission_2_nubia_task_2_DESC:0 "Hacia el oeste, las tierras conocidas por los lugareños como Gash son algo desoladas y solitarias, escasamente pobladas por miembros de tribus errantes que no deberían representar una amenaza real para nosotros una vez que los hayamos subyugado. \n\n\n\n\n\n\n\n\n\n@egypt_mil3!"
 
 aksum_mission_2_nubia_task_3:0 "Atacar Atbaras"
 aksum_mission_2_nubia_task_3_DESC:0 "Se sabe que la ciudad de Abliata en tierras de Atbaras es una parada importante para las rutas comerciales que se dirigen al norte y al sur. Quien controle esta ciudad, controla la región; sabemos lo que hay que hacer. \n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 
 aksum_mission_2_nubia_task_4:0 "Hacia Kumuzia"
 aksum_mission_2_nubia_task_4_DESC:0 "Kumuzia es una región boscosa, repleta de una variedad de bienes valiosos que aumentarían nuestros ya considerables recursos. Al trasladarnos al sur y establecernos, sentamos las bases para un futuro exitoso. \n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 
 aksum_mission_2_nubia_task_5:0 "Conflictos con Kush"
 aksum_mission_2_nubia_task_5_DESC:0 "A medida que nuestra influencia crece, nos encontramos en curso de colisión con el poder de Kush, que ya está mostrando su descontento con nuestro crecimiento. Tenemos razones para creer que el conflicto entre nuestros pueblos es inevitable. \n\n\n\n\n\n\n\n\n\n@india_mil23!"
 
 aksum_mission_2_nubia_task_6:0 "El Fin de Meroe"
 aksum_mission_2_nubia_task_6_DESC:0 "¡La isla de Meroe es nuestra! Hemos humillado completamente a Kush al quitarle su preciado capital; Para ellos no hay vuelta atrás. ¡Nuestros ejércitos avanzan! \n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 
 aksum_mission_2_nubia_task_7:0 "Tierra del Arco"
 aksum_mission_2_nubia_task_7_DESC:0 "Los extranjeros han dado a nuestras tierras un apodo que refleja nuestra temible destreza militar: la \"Tierra del Arco\". Es cierto que hemos conquistado mucho por la cuerda del arco, por eso este título es bien merecido, acorde con nuestra elegancia. \n\n\n\n\n\n\n\n\n\n@egypt_mil3!"
 
 aksum_mission_2_nubia_task_8:0 "Persuadiendo a Alut"
 aksum_mission_2_nubia_task_8_DESC:0 "Hemos decidido que lo mejor para Alut es alinear su futuro con el nuestro; si esto se logra diplomática o militarmente depende enteramente de ellos. \n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 
 aksum_mission_2_nubia_task_9:0 "Expansión hacia el Oeste"
 aksum_mission_2_nubia_task_9_DESC:0 "Si bien algunos nos acusan de librar guerras de conquista indiscriminadas, sabemos que el verdadero propósito de nuestra expansión hacia el oeste es garantizar la paz en la región. \n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
 aksum_mission_2_nubia_task_10:0 "Choques Keméticos"
 aksum_mission_2_nubia_task_10_DESC:0 "Si bien existen algunas influencias religiosas extranjeras en nuestras tierras, la fe kemética tiene las raíces más fuertes, algo que nos gustaría que cambiara. \n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 
 aksum_mission_2_nubia_task_11:0 "Influencia Árabe"
 aksum_mission_2_nubia_task_11_DESC:0 "La fe árabe crece en nuestras tierras, llevada por los mercaderes ambulantes y difundiéndose entre nuestros pueblos. Sin embargo, hay medidas que el Estado podría tomar para garantizar que este proceso se acelere. \n\n\n\n\n\n\n\n\n\n@egypt_mil25!"
 
 aksum_mission_2_nubia_task_12:0 "Infraestructura Aksumita"
 aksum_mission_2_nubia_task_12_DESC:0 "Para difundir adecuadamente nuestra cultura, necesitamos difundir nuestra infraestructura lo más ampliamente posible, particularmente en las provincias más vacías que hemos obtenido. Todos nuestros territorios deberían tener la oportunidad de prosperar. \n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 
 aksum_mission_2_nubia_task_13:0 "Llanuras de Abundancia"
 aksum_mission_2_nubia_task_13_DESC:0 "Son buenas tierras las que tenemos aquí, aunque actualmente están subutilizadas, y esto se debe a que carecemos de los recursos y la mano de obra adecuados para aprovechar los regalos de la naturaleza. Construyamos ciudades, con la esperanza de que la gente venga a vivir aquí. \n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 
 aksum_mission_2_nubia_task_14:0 "Maquinaciones Meroíticas"
 aksum_mission_2_nubia_task_14_DESC:0 "La isla de Meroe es verdaderamente extraordinaria; Sus anteriores maestros, la Kush, deberían estar orgullosos de lo que fueron capaces de conseguir. Sin embargo, Aksum hará más por esta ciudad que nadie antes que nosotros; cuenta con ello. \n\n\n\n\n\n\n\n\n\n@event_pic10!"
 
 #Events 2
 me_aksum_upper_nubia_1_title:0 "$aksum_mission_2_nubia_task_1$"
 me_aksum_upper_nubia_1_desc:0 "Como usted ha ordenado, o [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], hemos tomado las medidas necesarias para preparar reclamos sobre nuestros territorios vecinos, brindándonos la justificación legal necesaria para continuar nuestras guerras. ¡No pasará mucho tiempo hasta que las arenas del desierto se tiñen de rojo con la sangre de nuestros enemigos!"
 me_aksum_upper_nubia_1.a:0 "Cualquiera que hubiera prestado atención habría previsto este momento."
 me_aksum_upper_nubia_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_1$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_2_title:0 "$aksum_mission_2_nubia_task_2$"
 me_aksum_upper_nubia_2_desc:0 "Si bien algunos de nuestros asesores militares fruncieron el ceño ante la perspectiva de asegurarnos las tierras de Gash, ahora que nuestras campañas militares están completas, incluso los más indecisos tienen que admitir la sabiduría de los planes de [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. Es cierto que estos páramos actualmente no están a la altura de nuestros estándares, pero nos ofrecen un punto de vista estratégico; ¡No pasará mucho tiempo antes de que nuestras fuerzas abandonen estas llanuras polvorientas, formando una auténtica tormenta de arena que envolverá a nuestros enemigos!"
 me_aksum_upper_nubia_2.a:0 "Nuestros enemigos nunca nos verán venir..."
 me_aksum_upper_nubia_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_2$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_3_title:0 "$aksum_mission_2_nubia_task_3$"
 me_aksum_upper_nubia_3_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] estuvo allí personalmente para presenciar el asedio de [GetProvince('(int32)7589').GetName]; habiendo deseado durante tanto tiempo tomar la ciudad, era lógico que nuestro Rey estuviera físicamente presente en nuestra hora de triunfo. \n\nLos ciudadanos de Atbaras lucharon bien y duraron más de lo que nadie les hubiera dado crédito; Sin duda, fueron sus ricos ingresos comerciales los que reforzaron su defensa mientras duró. Superándolos en el campo de batalla, logramos derrotar a sus miserables levas e incluso a los mercenarios que contrataron tontamente. Es una pena que no nos hayan abierto sus puertas; podrían haber evitado a su pueblo los horrores de un asedio. Sin embargo, todo eso algún día será un recuerdo lejano."
 me_aksum_upper_nubia_3.a:0 "El sol sale esta mañana en Abliata, una ciudad de Aksum."
 me_aksum_upper_nubia_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_3$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_4_title:0 "$aksum_mission_2_nubia_task_4$"
 me_aksum_upper_nubia_4_desc:0 "Debido a que nuestra patria está salpicada de montañas y colinas, es con gran alegría que [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] anuncia que las provincias boscosas de Kumuzia ahora se han unido a Aksum. Además de conseguir los valiosos bienes comerciales que se encuentran en esta región, nuestro Rey ha estado pidiendo a gritos ir a cazar a los bosques; Los bosques que rodean el lago Tana están llenos de vida."
 me_aksum_upper_nubia_4.a:0 "¿Crees que veremos un hipopótamo?"
 me_aksum_upper_nubia_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_4$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_5_title:0 "$aksum_mission_2_nubia_task_5$"
 me_aksum_upper_nubia_5_desc:0 "Hace unas semanas, recibimos un enviado de nuestros vecinos en [GetCountry('KSH').GetName], uno con un mensaje que era tan grosero que hizo falta toda la moderación que tiene [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] para no derribar al imprudente mensajero, en ese mismo momento. 'Tus crímenes contra el pueblo no pasan desapercibidos, [GetCountry('AXM').GetName]; en lugar de aceptar tu lugar, enojas a los dioses con tus tontas pretensiones. Consideren esto como una advertencia, no sea que sus palacios reales sean derribados, ladrillo a ladrillo, para usarlos como letrinas. Piensa en tus esposas e hijos, porque no mostraremos misericordia cuando regresemos con nuestros ejércitos. \n\nCon el rostro ahogado por la ira, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] se pone de [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] pies, pronunciando palabras temblorosas de ira: '¡Déjanos ahora! ¡Y dile a tu Rey que no somos responsables de lo que pase!"
 me_aksum_upper_nubia_5.a:0 "¡Pagaremos estos insultos con brutalidad!"
 me_aksum_upper_nubia_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_5$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_6_title:0 "$aksum_mission_2_nubia_task_6$"
 me_aksum_upper_nubia_6_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] se alza triunfante sobre las almenas de los muros de [GetProvince('(int32)641').GetName], lanzando [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] miradas hacia el horizonte. Incluso ahora, horas después de que hayan concluido los combates, largas estelas de humo negro y acre continúan serpenteando por la ciudad, como las sombras de los soldados kushitas muertos que parten hacia el inframundo. Nuestros soldados han dejado a un lado sus armas temporalmente y están haciendo todo lo posible para apagar los incendios... no debería pasar mucho más tiempo hasta que tengamos todo bajo nuestro control. \n\n''Meroe...'' [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] susurra, con los ojos húmedos por las lágrimas, aunque nadie puede decir si esto se debe a las emociones o al irritante humo. ''Tanta devastación y ruina te has traído a ti mismo... sin embargo, lo haré todo mejor, con el tiempo.''"
 me_aksum_upper_nubia_6.a:0 "Les mostraremos misericordia donde no nos ofrecieron ninguna."
 me_aksum_upper_nubia_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_6$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_7_title:0 "$aksum_mission_2_nubia_task_7$"
 me_aksum_upper_nubia_7_desc:0 "Cuando se acordó por primera vez que fijaríamos nuestro rumbo hacia el corazón de Nubia, sin saber cómo lograríamos finalmente el éxito pero entendiendo que nuestra supervivencia futura lo requería, hubo muchos que dudaron de nuestra capacidad para continuar esta guerra. 'Nuestros enemigos son demasiado fuertes', se quejaron estos cobardes, permitiendo que el miedo nublara su razón, y sus palabras despectivas hicieron que los corazones de muchos cuestionaran el camino trazado por [SCOPE.GetRootScope.GetCountry.GetRuler.GetName].\n\nNo negaremos que hubo momentos en los que todo parecía perdido, pero perseveramos, encontrando reservas de fuerza que no sabíamos que teníamos. Ahora, en nuestra hora de gloria, nadie puede cuestionar que [GetCountry('AXM').GetName] ha cumplido su destino."
 me_aksum_upper_nubia_7.a:0 "¡Salve a los nuevos Maestros de Nubia!"
 me_aksum_upper_nubia_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_7$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_8_title:0 "$aksum_mission_2_nubia_task_8$"
 me_aksum_upper_nubia_8_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] está asistiendo a una fiesta y está bebiendo [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] tazas cuando un mensajero interrumpe las festividades para compartir una feliz noticia; las tierras de [GetCountry('AUT').GetName] ahora se consideran parte integrante de [GetCountry('AXM').GetName] sí mismo, un resultado que nuestro pueblo ha deseado durante mucho tiempo."
 me_aksum_upper_nubia_8.a:0 "¡Trae más vino!"
 me_aksum_upper_nubia_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_8$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_9_title:0 "$aksum_mission_2_nubia_task_9$"
 me_aksum_upper_nubia_9_desc:0 "Después de años de lucha, parece que finalmente hemos logrado traer la calma a las tierras de Gezira y Qadarif. Los ejércitos en guerra ya no marcharán sin obstáculos a través de estas llanuras aluviales, sembrando semillas de destrucción a su paso. Una nueva era, de prosperidad desenfrenada bajo los auspicios de [GetCountry('AXM').GetName], reemplazará los días de rapiña y hambruna."
 me_aksum_upper_nubia_9.a:0 "La Muerte nunca más acechará estas tierras"
 me_aksum_upper_nubia_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_9$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_10_title:0 "$aksum_mission_2_nubia_task_10$"
 me_aksum_upper_nubia_10_desc:0 "La fe kemética tiene raíces antiguas en estas tierras, a pesar de los esfuerzos de varios Reyes y Tiranos por eliminar estas malas hierbas y plantar sus propias semillas de fe. Si bien respetamos estas observancias, no podemos aceptar la disensión religiosa entre nuestro pueblo, y se ha decidido que aplicaremos presión suave en la región, con la esperanza de lograr que algunos de los últimos rezagados abandonen sus prácticas para abrazar las nuestras."
 me_aksum_upper_nubia_10.a:0 "¡Los dioses bendigan a los fieles!"
 me_aksum_upper_nubia_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_10$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_11_title:0 "$aksum_mission_2_nubia_task_11$"
 me_aksum_upper_nubia_11_desc:0 "¡Qué bendición tenemos en [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] como nuestro Rey! Nuestras tropas no sólo continúan dominando el campo de batalla, sino que incluso en tiempos de paz somos bendecidos sin medida. Gracias a las condiciones que hemos creado, la fe árabe continúa creciendo y no pasará mucho tiempo antes de que toda nuestra sociedad adore como una sola. ¡Tenemos mucho que celebrar hoy!"
 me_aksum_upper_nubia_11.a:0 "Es nuestro deber mostrarle al pueblo los caminos de los dioses."
 me_aksum_upper_nubia_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_11$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_12_title:0 "$aksum_mission_2_nubia_task_12$"
 me_aksum_upper_nubia_12_desc:0 "Parece que nuestra iniciativa de construcción, ordenada y financiada por la indomable voluntad de [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], está empezando a dar frutos. No solo hemos ampliado drásticamente la cantidad de edificios en la región, sino que también empezamos a ver los beneficios fiscales de esa visión a largo plazo. Nuestro Mayordomo Real nos informa que hemos recaudado un gran ingreso extraordinario, y que ha sido depositado en nuestro tesoro."
 me_aksum_upper_nubia_12.a:0 "¡Habrá mucho más de donde vino esto!"
 me_aksum_upper_nubia_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_12$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_13_title:0 "$aksum_mission_2_nubia_task_13$"
 me_aksum_upper_nubia_13_desc:0 "Aunque contamos con abundantes recursos y agradecemos los dones de los dioses, hay ciertas cosas que nos faltan, y la buena tierra cultivable es una de ellas. A pesar de este problema, hemos aprovechado al máximo nuestra situación construyendo la infraestructura donde podemos. Nos complace informar que empezamos a ver los resultados de nuestra planificación cuidadosa."
 me_aksum_upper_nubia_13.a:0 "Y aun los desiertos darán frutos..."
 me_aksum_upper_nubia_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_13$#!' $mission_completed_tooltip_2$"
 
 me_aksum_upper_nubia_14_title:0 "$aksum_mission_2_nubia_task_14$"
 me_aksum_upper_nubia_14_desc:0 "[GetProvince('(int32)641').GetName] ha caído, a pesar de los desesperados intentos de los kushitas por retrasar lo inevitable. Hubo momentos al principio de nuestra guerra en los que temimos lo peor, preguntándonos si nuestra arrogancia nos había llevado por un camino de destrucción, pero los dioses nos entregaron la victoria en nuestra hora de necesidad. La lucha fuera de Meroe fue especialmente feroz, cuando los ejércitos de Kush comprendieron que darían su última resistencia ante nuestras fuerzas fuera de los muros de Meroe. Esperaban relevar su guarnición, pero al final todo se redujo a la moral, a la pura fuerza de voluntad... y nuestros ejércitos lo desearon más. \n\nSin embargo, no planeamos solo someter Meroe, sino embellecerla. Retirando nuestras máquinas de asedio de sus murallas, trajimos equipos de arquitectos e ingenieros, formados al modo aksumita, para reconstruir esta ciudad a nuestra imagen. Ahora que nuestro trabajo está completo, una Meroe reimaginada, que supera a su antiguo yo en todos los sentidos imaginables, ha asumido su lugar como la ciudad preeminente de la región."
 me_aksum_upper_nubia_14.a:0 "Seremos recordados por esto durante generaciones"
 me_aksum_upper_nubia_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $aksum_mission_2_nubia_task_14$#!' $mission_completed_tooltip_2$"
