 #Decisions
 
 aksum_development_decision_1:0 "Centro Etíope de Civilización"
 aksum_development_decision_1_desc:0 "Hemos hecho lo que algunos erróneamente creían imposible; al construir una gran metrópoli en nuestra ciudad de Aksum, somos indiscutiblemente el Centro Etíope de Civilización."
 aksum_development_decision_1_tt:0 "La provincia de #Y Aksum#! tiene un territorio con una metrópolis y al menos #Y 5#! territorios con al menos #Y 5#! edificios."
 
 aksum_development_decision_2:0 "Gran Templo de Maher"
 aksum_development_decision_2_desc:0 "Maher, el dios de la guerra que dispersa sin piedad a nuestros enemigos como la paja en el viento, ha bendecido a Aksum con la victoria y merece un Gran Templo. Comencemos la construcción para que podamos observar debidamente los ritos."
