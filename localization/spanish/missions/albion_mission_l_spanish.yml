l_spanish:
 
 albion_mission:0 "El Auge de Albión"
 albion_mission_DESCRIPTION:0 "Desde los comienzos más humildes, el pueblo de [ROOT.GetCountry.GetName] ha superado cada obstáculo que se les ha presentado y ha demostrado ser la potencia más fuerte en la isla que es su hogar.\n\nSin embargo, simplemente conquistar una isla llena de tribus y ciudades lluviosas no será su destino final; ni mucho menos. El incomparable [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] ha jurado unir las islas del norte bajo el estandarte de #E Albión#!, afirmando que nuestros compatriotas algún día desafiarán a las poderosas potencias del Mediterráneo por el control de los mares."
 albion_mission_CRITERIA_DESCRIPTION:0 "Esta misión se completará cuando [ROOT.GetCountry.GetName] se haya convertido en un verdadero contendiente para ser la mayor civilización del mundo, sin rival en el Norte y más poderoso que los Imperios del Mediterráneo."
 albion_mission_BUTTON_TOOLTIP:0 "¡Que el mismo espíritu que llevó a nuestro pueblo a este momento los guíe hacia victorias aún mayores!"
 albion_mission_BUTTON_DETAILS: ""
 
 #Mission Tasks
 
 albion_conquest_mission_start:0 "Hermanos en la Desesperación"
 albion_conquest_mission_start_DESC:0 "Ahora que hemos asegurado nuestro propio patio trasero, [ROOT.GetCountry.GetRuler.GetName] ha argumentado convincentemente que no podemos permitirnos seguir siendo introspectivos si deseamos convertirnos en una gran potencia, sino que debemos hacer lo posible por ayudar a aquellos que puedan necesitar ayuda en el extranjero. Con esta misión altruista en mente, nuestros ejércitos se preparan para cruzar las olas...\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 
 albion_conquest_mission_1_1:0 "Albión en Armorica"
 albion_conquest_mission_1_1_DESC:0 "Hay muchos asentamientos a través de las aguas del #E Mare Britannicum#! en #E Armorica#! que prosperarían bajo el gobierno de [ROOT.GetCountry.GetRuler.GetName]. Debemos tomar las medidas necesarias para asegurar estas tierras costeras para [ROOT.GetCountry.GetName].\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 
 albion_conquest_mission_1_2:0 "Capturando la Costa de Bélgica"
 albion_conquest_mission_1_2_DESC:0 "Aunque la temible reputación de los fieros #E Belgae#! ha hecho dudar a algunos de nuestros asesores militares, [ROOT.GetCountry.GetRuler.GetName] no teme invadir sus costas.\n\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 
 albion_conquest_mission_2_1:0 "Armorica Restaurada"
 albion_conquest_mission_2_1_DESC:0 "Una por una, las tribus de #E Armorica#! han sido empujadas hacia atrás ante las imbatibles levies de [ROOT.GetCountry.GetName]. Después de un período de derramamiento de sangre y miseria, pronto volverán la paz y la prosperidad a estas tierras.\n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 
 albion_conquest_mission_2_2:0 "Rompimiento de los Belgae"
 albion_conquest_mission_2_2_DESC:0 "Las llanuras, bosques y pantanos de los violentos Belgae han sido capturados por los victoriosos ejércitos de [ROOT.GetCountry.GetRuler.GetName], quien ha jurado ante los dioses que [ROOT.GetCountry.GetRuler.GetSheHe] civilizará algún día a estos salvajes.\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 
 albion_conquest_mission_3_1:0 "El Canal de Albión"
 albion_conquest_mission_3_1_DESC:0 "Ahora que hemos pacificado ambos lados del #E Mare Britannicum#!, los barcos mercantes pueden viajar libremente entre nuestras costas y el continente sin temor a los piratas. Con la fuerza de las armas, [ROOT.GetCountry.GetRuler.GetName] ha traído paz al #E Canal de Albión#!.\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 
 albion_conquest_mission_4_1:0 "Sumisión Aquitana"
 albion_conquest_mission_4_1_DESC:0 "Aunque sus ciudades y asentamientos están lejos de [ROOT.GetCountry.GetCapital.GetName], las indomables levies [ROOT.GetCountry.GetAdjective] han vuelto a conquistar un ejército extranjero. Al darse cuenta de que no pueden esperar enfrentarse a nosotros, las fuerzas derrotadas de la #Y Galia Aquitana#! han bajado sus lanzas y han jurado lealtad.\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 
 albion_conquest_mission_4_2:0 "Expedición a la Galia Central"
 albion_conquest_mission_4_2_DESC:0 "Poco a poco, nuestros dominios continúan expandiéndose a lo largo de #E Galia#! - [ROOT.GetCountry.GetRuler.GetName] está creando un vasto imperio de ultramar para que el pueblo de [ROOT.GetCountry.GetName] lo gobierne.\n\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 
 albion_conquest_mission_5_1:0 "Puertos en el Mediterráneo"
 albion_conquest_mission_5_1_DESC:0 "Aunque pocos pueden competir con nosotros en las aguas que rodean nuestra bella isla, somos actores secundarios en lo que respecta al #E Mar Mediterráneo#!... pero esto también cambiará - [ROOT.GetCountry.GetName] está destinado a ser el Amo de los Mares.\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 
 albion_conquest_mission_6_1:0 "Trato con los Romanos"
 albion_conquest_mission_6_1_DESC:0 "Los belicosos romanos son una amenaza para nuestros planes a largo plazo para #E Galia#! y más allá. Si tenemos esperanzas de mantener nuestras posesiones de ultramar, debemos tomar medidas para tratar con el lobo romano lo antes posible.\n\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 
 
 albion_conquest_mission_6_2:0 "Dos Reinos, Un Imperio"
 albion_conquest_mission_6_2_DESC:0 "[ROOT.GetCountry.GetRuler.GetName] ha liderado triunfalmente a nuestras fuerzas de victoria en victoria, asegurando extensas posesiones a ambos lados del #E Mare Britannicum#!. Aunque las frías aguas del #E Canal de Albion#! puedan dividir nuestros dos reinos en dos, #E Britannia#! y #E Galia#! son igualmente importantes para nuestro creciente imperio.\n\n\n\n\n\n\n\n\n\n\n@italic_mil13!"
 
 albion_conquest_mission_7_1:0 "Una Capital Gala"
 albion_conquest_mission_7_1_DESC:0 "La importancia de #E Galia#! para [ROOT.GetCountry.GetName] no puede ser subestimada; sus bienes comerciales se encuentran en tiendas de toda nuestra isla y sus auxiliares luchan junto a nuestros levies en tiempos de guerra.\n\nPara administrar mejor nuestras posesiones en el extranjero, [ROOT.GetCountry.GetRuler.GetName] está considerando la idea de establecer una segunda capital en el continente.\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 
 albion_side_mission_start:0 "Un Poder Centralizado"
 albion_side_mission_start_DESC:0 "Si esperamos superar los logros de nuestros vecinos civilizados, entonces debemos romper por completo con nuestro pasado migratorio y adoptar un estado de centralización; no puede haber otra forma de avanzar.\n\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 
 albion_side_mission_1:0 "Una Cuestión Política"
 albion_side_mission_1_DESC:0 "Los esfuerzos de [ROOT.GetCountry.GetRuler.GetName] por centralizar rápidamente nuestro país han causado fracturas políticas y disensión dentro de [ROOT.GetCountry.GetName], y ahora nuestro [ROOT.GetCountry.GetRulerTitle] debe calmar los sentimientos de nuestros Ancianos Tribales escuchando sus peticiones.\n\n#Y Decidiremos el futuro político de nuestros compatriotas#!.\n\n\n\n\n\n\n\n\n\n\n@italic_mil1!"
 
 albion_side_mission_2:0 "Apoyo de las Élites"
 albion_side_mission_2_DESC:0 "[ROOT.GetCountry.GetRuler.GetName] ha hecho saber que [ROOT.GetCountry.GetRuler.GetSheHe] pronto decidirá el estatus de las élites que viven dentro de [ROOT.GetCountry.GetName], porque a menos que el [ROOT.GetCountry.GetRulerTitle] haya resuelto este espinoso problema de una vez por todas, sufriremos de inestabilidad política que podría arruinar todo lo que hemos logrado hasta ahora.\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 
 albion_side_mission_3_1:0 "¡Poder Absoluto!"
 albion_side_mission_3_1_DESC:0 "Un nuevo día exige una nueva forma de hacer las cosas, y [ROOT.GetCountry.GetRuler.GetName] no es alguien que deje pasar una buena oportunidad. [ROOT.GetCountry.GetName] no es la misma pequeña tribu que conocieron nuestros bisabuelos, entonces, ¿por qué deberíamos llevar a cabo nuestros asuntos políticos de la misma manera? ¡Nuestro pueblo merece un monarca, y lo tendrá!\n\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 
 albion_side_mission_3_2:0 "Respeto por los Ancianos"
 albion_side_mission_3_2_DESC:0 "[ROOT.GetCountry.GetRuler.GetName], no siendo alguien que rompa con la tradición a la ligera, ha decretado que las costumbres de nuestros antepasados serán honradas dentro de [ROOT.GetCountry.GetName]; que todo el poder sea dado a los Ancianos, que nunca han desviado a nuestro pueblo del camino correcto.\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 
 albion_side_mission_4_1:0 "Regalia Real de Albion"
 albion_side_mission_4_1_DESC:0 "Desde la ciudadela de [ROOT.GetCountry.GetCapital.GetName], los ensordecedores sonidos del carnyx llenan el aire mientras un trono de mármol es colocado dentro del palacio. ¡Todos aclamen a [ROOT.GetCountry.GetRuler.GetName], el fundador de una dinastía inmortal! #Y Nuestro [ROOT.GetCountry.GetRulerTitle] desbloqueará una#! #G Línea de Sangre#! #Y podrá elegir uno de tres artefactos legendarios.#!\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 
 albion_side_mission_4_2:0 "Gran República de Albion"
 albion_side_mission_4_2_DESC:0 "¡Envía barcos con mensajes a los rincones de la Tierra! Desde este día en adelante, que se sepa que una #E Gran República#!, una que honra el estado de derecho y defiende los principios de justicia, ha sido establecida en las islas del norte.\n\n\n\n\n\n\n\n\n\n\n@italic_mil18!"
 
 albion_main_mission_start:0 "Comienzos Auspiciosos"
 albion_main_mission_start_DESC:0 "Nuestro capital político está asegurado y un período de estabilidad y crecimiento ha regresado a [ROOT.GetCountry.GetName] después de un período de guerra y violencia: comienzos auspiciosos para el ambicioso pueblo [ROOT.GetCountry.GetAdjective].\n\n\n\n\n\n\n\n\n\n\n@italic_mil5!"
 
 albion_main_mission_1_1:0 "Conquista del Oeste"
 albion_main_mission_1_1_DESC:0 "Se rumorea que la isla occidental de #E Hibernia#! es un lugar de misterio y magia, pero [ROOT.GetCountry.GetRuler.GetName] no permitirá que las supersticiones y los mitos mantengan a nuestras fuerzas a raya. Ha llegado el momento de enviar a nuestros ejércitos al otro lado del agua: ¡no mostraremos piedad a nadie que se interponga en nuestro camino!\n\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 
 albion_main_mission_1_2:0 "Conquista del Norte"
 albion_main_mission_1_2_DESC:0 "Ha llegado el momento de avanzar hacia el norte, en el terreno difícil habitado por los salvajes caledonios, porque aquellos que no se sometan ante [ROOT.GetCountry.GetRuler.GetName] están destinados a la destrucción.\n\n\n\n\n\n\n\n\n\n\n@italic_mil12!"
 
 albion_main_mission_1_3:0 "Conquista del Sur"
 albion_main_mission_1_3_DESC:0 "No debemos cesar en nuestra guerra, sino continuar hacia el sur, tomando cualquier asentamiento y territorio que no se rinda pacíficamente a [ROOT.GetCountry.GetName]. Debemos tener una sumisión total.\n\n\n\n\n\n\n\n\n\n\n@italic_mil20!"
 
 albion_main_mission_2_1:0 "Puerto del Oeste"
 albion_main_mission_2_1_DESC:0 "La isla de #E Hibernia#! sería un lugar excelente para construir puertos; deberíamos invertir fuertemente en la región con este propósito. Podríamos transformar esta zona remota en el corazón de nuestra marina, utilizando los recursos naturales de la isla para construir flotas para [ROOT.GetCountry.GetName].\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 
 albion_main_mission_2_2:0 "Fortaleza del Norte"
 albion_main_mission_2_2_DESC:0 "Las montañas y colinas del norte son el hogar de tribus beligerantes y bárbaros salvajes que no dudarían en rebelarse si pensaran que podrían asegurar su libertad mientras estamos distraídos. Es importante construir fortificaciones en el norte para pacificar a nuestros compatriotas y disuadir invasiones enemigas.\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 
 albion_main_mission_2_3:0 "Perla del Sur"
 albion_main_mission_2_3_DESC:0 "Las ciudades del sur de #E Britannia#! son conocidas por sus conexiones comerciales con el continente y su orgullo en sus culturas, que son realmente impresionantes. Trabajemos juntos con los lugareños para aumentar el valor de nuestras exportaciones y los ciudadanos trabajadores que hacen todo esto posible.\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 
 albion_main_mission_3:0 "Victoria Sobre la Isla"
 albion_main_mission_3_DESC:0 "Después de muchos años, hemos logrado grandes hazañas en las tierras que poseemos: [ROOT.GetCountry.GetRuler.GetName] ha transformado [ROOT.GetCountry.GetName] de maneras que serán recordadas durante cientos de años. ¡El pueblo [ROOT.GetCountry.GetAdjective] ha logrado la victoria total sobre nuestra isla!\n\n\n\n\n\n\n\n\n\n\n@italic_mil11!"
 
 albion_main_mission_4:0 "Proclamando un Nuevo Poder"
 albion_main_mission_4_DESC:0 "La incontestable fuerza de #E Albion#! surge desde el norte, dando paso a una nueva era en la que los isleños gobiernan un imperio que abarca tanto la tierra como el mar. ¡Toda la gloria para [ROOT.GetCountry.GetName]!\n\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 
 albion_main_mission_5_1:0 "El Mar Pertenece a Albion"
 albion_main_mission_5_1_DESC:0 "Hay muchas grandes potencias navales que compiten por la supremacía sobre las olas, pero ninguna se compara en ambición con #E Albion#! y sus orgullosos marineros [ROOT.GetCountry.GetAdjective]. Los isleños intrépidos envían sus flotas a lo largo y ancho, comerciando y conquistando tierras extranjeras con impunidad.\n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 
 albion_main_mission_5_2:0 "Comercio y País Estabilizados"
 albion_main_mission_5_2_DESC:0 "Aunque se sabe que los mercaderes prefieren períodos de paz al caos de la guerra, las últimas décadas han visto su parte de derramamiento de sangre y hambruna, lo que a su vez ha impactado la economía [ROOT.GetCountry.GetAdjective]. [ROOT.GetCountry.GetRuler.GetName] ha prometido fortalecer las finanzas de [ROOT.GetCountry.GetName], prometiendo mejorar la estabilidad de nuestro país por cualquier medio necesario.\n\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 
 albion_main_mission_6_1:0 "Marinos Profesionales"
 albion_main_mission_6_1_DESC:0 "A medida que nuestra armada se vuelve cada vez más importante para los éxitos militares de [ROOT.GetCountry.GetName], se ha sugerido que implementemos estándares profesionales para nuestros marinos. No podemos depender de reclutas no entrenados para tripular nuestras flotas, ya que nuestra seguridad y economía requieren que tengamos la capacidad de proyectar poder lejos de nuestras costas.\n\n\n\n\n\n\n\n\n\n\n\n\n\n@greek_por1!"
 
 albion_main_mission_6_2:0 "Una Nueva Aventura Espera"
 albion_main_mission_6_2_DESC:0 "Ahora que tenemos los medios financieros para hacerlo, deberíamos considerar financiar una aventura en el extranjero - quizás podríamos equipar una expedición para viajar hasta los confines de la Tierra en nombre de [ROOT.GetCountry.GetName] y sus ciudadanos.\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 
 albion_main_mission_6_3:0 "¿Una Nueva Capital?"
 albion_main_mission_6_3_DESC:0 "Se ha sugerido educadamente a [ROOT.GetCountry.GetRuler.GetName] que podría haber una mejor ubicación para nuestra capital que [ROOT.GetCountry.GetCapital.GetName] - ¿seguramente #E Albion#! merece una nueva sede de poder? La elección será dejada a [ROOT.GetCountry.GetRuler.GetFirstName], quien tendrá la oportunidad de reubicar el gobierno.\n\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 
 albion_main_mission_6_4:0 "Enfoque en el Desarrollo"
 albion_main_mission_6_4_DESC:0 "A [ROOT.GetCountry.GetRuler.GetName] nada le encantaría más que centrar [ROOT.GetCountry.GetRuler.GetHerHis] la atención en las iniciativas de construcción en [ROOT.GetCountry.GetName], pero antes de que [ROOT.GetCountry.GetRulerTitle] pueda centrarse en el desarrollo, debemos ser pacíficos y hacer avanzar prósperamente nuestra economía; no es fácil. Tarea.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 
 albion_main_mission_6_5:0 "Aventura Colonial"
 albion_main_mission_6_5_DESC:0 "La promesa de gloria eterna y tesoros llama a nuestros marinos a llevar sus barcos y sus almas al límite, siguiendo la canción de sirena de la aventura hacia donde ella los lleve. Las tierras heladas de #E Scandia#! al este llaman a los más valientes para visitar sus costas, y [ROOT.GetCountry.GetRuler.GetName] desea establecer una colonia [ROOT.GetCountry.GetAdjective] al otro lado del mar.\n\n#Y Esto iniciará una cadena de eventos#!.\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"
 
 albion_main_mission_7_1:0 "Reformar El País"
 albion_main_mission_7_1_DESC:0 "Después de un largo período de contemplación, en el que el futuro de [ROOT.GetCountry.GetName] pesaba enormemente en la mente de [ROOT.GetCountry.GetRuler.GetName], el [ROOT.GetCountry.GetRulerTitle] ha llegado a una conclusión importante, una que tendrá ramificaciones a lo largo de los siglos venideros; debemos romper irrevocablemente con el pasado para forjar nuestras nuevas identidades.\n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 
 albion_main_mission_7_2:0 "Invertir En Nuestra Tradición"
 albion_main_mission_7_2_DESC:0 "¿Por qué debería [ROOT.GetCountry.GetRuler.GetName] abandonar la cultura que nos llevó a la cima del poder? Desestimando estas sugerencias como el colmo de la necedad, el sabio [ROOT.GetCountry.GetRulerTitle] ha abrazado nuestras raíces y se compromete a enseñar nuestras tradiciones a los diversos pueblos que viven bajo nuestra bandera.\n\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 
 albion_main_mission_7_3:0 "Crecimiento Poblacional"
 albion_main_mission_7_3_DESC:0 "Nuestra capital de [ROOT.GetCountry.GetCapital.GetName] ha estado desbordada con ciudadanos y hombres libres, ya que personas de todo [ROOT.GetCountry.GetName] viajan al corazón palpitante de nuestro imperio para buscar fortuna en la ciudad más grande de todas. Aunque esto es una bendición para el país, deben tomarse medidas si esperamos acomodar a toda la gente que vive allí.\n\n\n\n\n\n\n\n\n\n\n@italic_mil24!"
 
 albion_main_mission_7_4:0 "Infraestructura Capitalina"
 albion_main_mission_7_4_DESC:0 "La gente trabajadora de [ROOT.GetCountry.GetAdjective] ha estado pidiendo educadamente a [ROOT.GetCountry.GetRuler.GetName] que gaste algunos fondos estatales para mejorar la infraestructura de nuestra capital. [ROOT.GetCountry.GetCapital.GetName] ya es una potencia económica, pero aún queda mucho por hacer para mejorar su abundancia natural.\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 
 albion_main_mission_7_5:0 "Suministros De Hierro"
 albion_main_mission_7_5_DESC:0 "Si tenemos esperanzas de dominar a nuestros enemigos en el campo de batalla, un ejército que esté adecuadamente equipado con armas de hierro es una necesidad - podríamos tener los números, pero a menos que estén equipados para el éxito, este seguirá siendo esquivo.\n\n\n\n\n\n\n\n\n\n\n@italic_mil15!"
 albion_main_mission_7_5tt:0 "Necesitamos poseer #T 3 asentamientos#! dentro de las regiones #T Caledonia#! o #T Britannia#! que produzcan al menos #Y 3 hierro#! @iron! y que tengan una #T mina#! o una #T Fundición#!."
 
 albion_main_mission_7_6:0 "Alimentar A La Gente"
 albion_main_mission_7_6_DESC:0 "Las tribus robustas de [ROOT.GetCountry.GetName] han sufrido períodos de hambre y devastación durante las guerras de antaño, pero ha llegado el momento de retribuir su fidelidad asegurando que sus estómagos permanezcan llenos. Construyamos granjas en todo nuestro territorio para garantizar que nuestras cosechas sean abundantes.\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 
 albion_main_mission_7_7:0 "Colonia Próspera"
 albion_main_mission_7_7_DESC:0 "Hemos recibido un informe halagador de nuestra colonia en [GetProvince('(int32)6043').GetName]; los habitantes locales están prosperando y agradecidos por la oportunidad de forjar nuevas vidas en el borde del mundo. Si podemos continuar ayudándolos a construir sus fortificaciones y puerto, pronto tendremos una ciudad adecuada en nuestras manos.\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 
 albion_main_mission_7_8:0 "Planificación Urbana"
 albion_main_mission_7_8_DESC:0 "Aunque los distritos más antiguos dentro de [ROOT.GetCountry.GetCapital.GetName] fueron construidos sin un diseño general, los nuevos vecindarios y suburbios de la Ciudad Vieja han sido diseñados desde cero por los mejores arquitectos que viven en la capital.\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 
 albion_main_mission_8_1:0 "Un Ejército Moderno"
 albion_main_mission_8_1_DESC:0 "No podemos permitirnos depender de reclutas no entrenados de campesinos y sus hijos como nuestras fuerzas principales - debemos invertir en un ejército moderno, uno que pueda competir cara a cara con las fuerzas profesionales de los imperios mediterráneos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 
 albion_main_mission_8_2:0 "Nuevas Infraestructuras"
 albion_main_mission_8_2_DESC:0 "Aunque [ROOT.GetCountry.GetRuler.GetName] siempre tendrá una debilidad por la arquitectura y el diseño [ROOT.GetCountry.GetAdjective], si #T Albion#! ha de convertirse en un pueblo unificado en cultura y tradición, adoptar nuevos estilos de construcción es una forma inteligente de asegurar que esto suceda.\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 
 albion_main_mission_8_3:0 "Un Nuevo Alfabeto"
 albion_main_mission_8_3_DESC:0 "Las runas y grabados de nuestros antepasados parecen torpes y primitivas en comparación con los flujos de escritura y cuerpos de literatura que algunos de nuestros pares tienen - una vergüenza que ha preocupado a [ROOT.GetCountry.GetRuler.GetName], quien siente que nuestra falta de avance refleja negativamente en [ROOT.GetCountry.GetRuler.GetHerHis] liderazgo.\n\nCon una vista hacia la reforma, el [ROOT.GetCountry.GetRulerTitle] ha convocado a los escribas para ayudar en la creación de un nuevo alfabeto para nuestro pueblo.\n\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 
 albion_main_mission_8_4:0 "Ejércitos Celtas"
 albion_main_mission_8_4_DESC:0 "Los mismos soldados celtas que conquistaron las montañas boscosas y los pantanos congelados de #E Pritania#! serán los mismos que pisarán las calles de mármol de Reyes y Cónsules - nuestras excepcionales tradiciones militares triunfarán contra todo.\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 
 albion_main_mission_8_5:0 "Mantener Nuestras Raíces"
 albion_main_mission_8_5_DESC:0 "Algunos que viven dentro de [ROOT.GetCountry.GetCapital.GetName] han permitido que los placeres de la vida urbana contaminen sus mentes, ya que algunos han sugerido que abandonemos nuestras formas tradicionales para abrazar influencias cosmopolitas. Sin embargo, [ROOT.GetCountry.GetRuler.GetName] no tolerará esta necedad, y ha declarado que nunca abandonaremos nuestras raíces.\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 
 albion_main_mission_8_6:0 "Tradiciones Orales"
 albion_main_mission_8_6_DESC:0 "Durante el tiempo en que el sol se ha dignado a salir en los cielos, nuestro pueblo ha transmitido mitos de boca en boca - no escribimos nuestras historias, sino que entrenamos a bardos y cantores de historias para narrar los audaces actos de nuestros antepasados.\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"
 
 albion_main_mission_8_7:0 "Asimilación En Albion"
 albion_main_mission_8_7_DESC:0 "Nuestra cultura superior ha atraído a muchos admiradores - se dice que nuestros actos y logros masculinos son alabados en ciudades tan lejanas como [GetProvince('(int32)516').GetName]. No es sorprendente, entonces, escuchar que muchos que viven dentro de nuestras fronteras se están asimilando a [ROOT.GetCountry.GetAdjective].\n\n\n\n\n\n\n\n\n\n\n@egypt_mil12!"
 
 albion_main_mission_8_8:0 "Una Nueva Justicia"
 albion_main_mission_8_8_DESC:0 "Las crecientes complejidades del código legal [ROOT.GetCountry.GetAdjective] requirieron una burocracia especializada para navegar sus giros y vueltas. Los ciudadanos litigiosos de [ROOT.GetCountry.GetCapital.GetName] son algunos de los peores infractores que viven dentro de [ROOT.GetCountry.GetName], y desde el amanecer hasta el atardecer, los magistrados se sientan en juicio ante el pueblo.\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 
 albion_main_mission_8_9:0 "Grandes Mercados De Albion"
 albion_main_mission_8_9_DESC:0 "Los negocios están en auge dentro de [ROOT.GetCountry.GetCapital.GetName], y cualquier cosa que uno desee puede encontrarse en los muchos mercados que se encuentran junto a las plazas y calles que rodean las principales avenidas.\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 
 albion_main_mission_8_10:0 "Una Montaña De Madera"
 albion_main_mission_8_10_DESC:0 "Incesantes en su trabajo, los hachas de los leñadores [ROOT.GetCountry.GetAdjective] nunca reciben un momento de descanso, sino que pasan horas interminables derribando árboles en los bosques salvajes de su isla. Las enormes flotas de [ROOT.GetCountry.GetName] requieren un suministro constante de madera @wood!, haciendo que un excedente de madera a mano sea una necesidad.\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 albion_main_mission_8_10tt:0 "Necesitamos poseer al menos #T 6 asentamientos#! que produzcan al menos #Y 2 madera#! @wood!."
 
 albion_main_mission_8_11:0 "Caballos De Bremenium"
 albion_main_mission_8_11_DESC:0 "[GetProvince('(int32)2090').GetName] es conocido por la alta calidad de los caballos que se crían en sus llanuras, y [ROOT.GetCountry.GetRuler.GetName] ha buscado capitalizar este regalo de la naturaleza invirtiendo en la región.\n\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 
 albion_main_mission_8_12:0 "Fiestas De Caza"
 albion_main_mission_8_12_DESC:0 "Aunque nuestro pueblo tiene una dieta rica y variada - un testimonio de la riqueza aumentada que [ROOT.GetCountry.GetRuler.GetName] ha traído a [ROOT.GetCountry.GetName] - muchos de nuestros tribus todavía anhelan carne de caza @wild_game!, y grandes fiestas de caza recorriendo los bosques en busca de ciervos no son una vista poco común.\n\n\n\n\n\n\n\n\n\n\n@italic_mil7!"
 
 albion_main_mission_8_13:0 "Conservación De Sal"
 albion_main_mission_8_13_DESC:0 "Tener acceso a un suministro constante de sal @salt! es importante por múltiples razones; no solo lo usamos como conservante para carnes, sino que los gastos asociados con el mantenimiento de legiones militares se alivian cuando hay un excedente a mano.\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 
 albion_main_mission_8_15:0 "Colonia Escandinava Exitosa"
 albion_main_mission_8_15_DESC:0 "Nuestra aventura colonial en la región de #E Scandia#! ha traído mucho renombre a la gente de [ROOT.GetCountry.GetName], que es aclamada por todas partes como exploradores intrépidos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 
 albion_main_mission_9_1:0 "Amanecer De Una Nueva Era"
 albion_main_mission_9_1_DESC:0 "Por fin, una nueva cultura se ha forjado para nuestro pueblo, gracias a los esfuerzos reformistas de [ROOT.GetCountry.GetRuler.GetName] para erradicar las huellas persistentes de nuestros modos anteriores de nuestra sociedad. Hoy marca el amanecer de una nueva era - ¡todos saluden al nuevo Albion!\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 
 albion_main_mission_9_2:0 "Unificar Las Tradiciones"
 albion_main_mission_9_2_DESC:0 "Después de emprender esfuerzos para asegurar que nuestras formas tradicionales mantengan su lugar central en nuestra cultura, [ROOT.GetCountry.GetRuler.GetName] está finalmente satisfecho de que los valores [ROOT.GetCountry.GetAdjective] no serán abandonados por las generaciones venideras.\n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 
 albion_main_mission_9_3:0 "Nueva Nobleza"
 albion_main_mission_9_3_DESC:0 "A lo largo de los años, muchos de los elites que viven en toda [ROOT.GetCountry.GetName|T] han dejado sus posesiones tradicionales y se han dirigido a [ROOT.GetCountry.GetCapital.GetName|Y], ya que la capital de los [ROOT.GetCountry.GetAdjective] se ha convertido rápidamente en la ciudad más importante de toda la isla Británica. Simplemente no hay otro lugar que se compare en riqueza y poder con [ROOT.GetCountry.GetCapital.GetName], y las clases nobles han reconocido esto y abrazado la ciudad como propia.\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 
 albion_main_mission_9_4:0 "Nuevos Burócratas"
 albion_main_mission_9_4_DESC:0 "Nuestras fronteras en crecimiento han requerido un pequeño ejército de burócratas y magistrados para mantener a flote el barco del estado, y aún se necesita más escribas y oficiales para ayudar en la gestión de nuestros recursos. Afortunadamente, [ROOT.GetCountry.GetRuler.GetName] está tomando medidas para asegurar que nuestras necesidades se satisfagan.\n\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 
 albion_main_mission_9_5:0 "Centro Comercial"
 albion_main_mission_9_5_DESC:0 "Nuestra provincia de origen, [ROOT.GetCountry.GetCapital.GetArea.GetName|Y], es conocida en todo el mundo como un centro de comercio, donde se pueden encontrar bienes de exquisita artesanía y rareza en [ROOT.GetCountry.GetCapital.GetName]. [ROOT.GetCountry.GetRuler.GetName] ha prometido hacer lo necesario para convertir nuestra capital en un centro comercial.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
 albion_main_mission_9_6:0 "Mi Tesoro"
 albion_main_mission_9_6_DESC:0 "Gracias a los esfuerzos de las autoridades [ROOT.GetCountry.GetAdjective] para invertir la riqueza de [ROOT.GetCountry.GetName] en mejorar la economía del país, se ha recolectado una gran suma por parte de los tesoreros.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
 albion_main_mission_9_7:0 "Nuevo Néctar"
 albion_main_mission_9_7_DESC:0 "Aunque nuestros antepasados elaboraban hidromiel y estaban contentos con lo que podían hacer ellos mismos, sus descendientes han adquirido un gusto por el vino @wine! - simplemente no pueden obtener suficiente de él. [ROOT.GetCountry.GetRuler.GetName] debe ahora saciar la sed de [ROOT.GetCountry.GetRuler.GetHerHis] pueblo asegurando que un flujo constante de fruto de la vid llegue a [ROOT.GetCountry.GetCapital.GetName].\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 
 albion_main_mission_10_1:0 "Era Dorada"
 albion_main_mission_10_1_DESC:0 "Nunca antes el pueblo de [ROOT.GetCountry.GetName] había disfrutado de un período de paz y prosperidad como este. El pueblo abraza a [ROOT.GetCountry.GetRuler.GetName] y alaba a los dioses por el liderazgo del [ROOT.GetCountry.GetRulerTitle], y con nuestras costas protegidas por la armada más poderosa de nuestra parte del mundo, [ROOT.GetCountry.GetRuler.GetFirstName] ha proclamado el comienzo de una #T Era Dorada#!, una que las historias recordarán durante miles de años.\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 
 albion_main_mission_10_2:0 "Ciudad Imperial"
 albion_main_mission_10_2_DESC:0 "Existen muchas ciudades de renombre y esplendor en la isla de Britania, y sin embargo, [ROOT.GetCountry.GetCapital.GetName] destaca por encima de las demás como la más grande; un diamante entre rubíes. Tan grande es la capital [ROOT.GetCountry.GetAdjective] que muchos simplemente se refieren a ella como 'la #T Ciudad Imperial#!', pues no necesita otro nombre.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 
 albion_main_mission_11_1:0 "Los Juegos Celtas"
 albion_main_mission_11_1_DESC:0 "En un intento por emular los célebres juegos de las antiguas sociedades del sur, [ROOT.GetCountry.GetRuler.GetName] ha proclamado el establecimiento de los llamados #E Juegos Celtas#!.\n\nGuerreros y atletas de todo [ROOT.GetCountry.GetName] viajarán a [ROOT.GetCountry.GetCapital.GetName] para participar en el evento, y un espíritu de emoción ha invadido a la gente que vive en la ciudad mientras esperan ansiosos el comienzo de los juegos.\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 
 albion_main_mission_11_2:0 "El Camino a Futuro"
 albion_main_mission_11_2_DESC:0 "Últimamente, [ROOT.GetCountry.GetRuler.GetName] ha estado en un estado reflexivo mientras [ROOT.GetCountry.GetRuler.GetSheHe] considera preguntas importantes sobre el pasado y el futuro. Mucho ha cambiado para el pueblo de [ROOT.GetCountry.GetName] en los últimos años, más de lo que nunca antes había sucedido en nuestro país; ¿es justo decir que somos los mismos que antes, o nos hemos convertido en algo diferente? Quizás este momento es un nuevo comienzo para lo que nuestro pueblo eventualmente será.\n\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 
 albion_main_mission_11_3:0 "Destino Manifiesto"
 albion_main_mission_11_3_DESC:0 "Desde los comienzos más humildes, el improbable poder de #T Albion#! ha surgido del fango de la miseria tribal para erigir maravillas y templos que proyectan una larga sombra sobre los grandiosos edificios construidos en todo el mundo. ¡Que viva Albion! ¿Quién es su igual en el mar, y quién puede esperar perseverar contra sus ejércitos y legiones?\n\n\n\n\n\n\n\n\n\n\n@italic_mil11!"
 
 #Events
 
 me_albion_1_title:0 "Regalia Real de Albion"
 me_albion_1_desc:0 "En una ceremonia presenciada por los nobles y élites de [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetName] fue bendecido por los #E Druidas#! de [GetProvince('(int32)2012').GetName] que viajaron a [ROOT.GetCountry.GetCapital.GetName] con regalos para el nuevo [ROOT.GetCountry.GetRulerTitle].\n\nComo signo del respeto otorgado al nuevo monarca, [ROOT.GetCountry.GetRuler.GetFirstName] y [ROOT.GetCountry.GetRuler.GetHerHis] descendencia han sido aclamados por los Druidas como los fundadores de una nueva dinastía, la Casa de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]. [ROOT.GetCountry.GetRuler.GetFirstName] ha recibido el regalo de su elección; tres artefactos de poder legendario han sido colocados ante [ROOT.GetCountry.GetRuler.GetHerHim]."
 me_albion.1.a:0 "El anillo será el símbolo de mi autoridad real"
 me_albion.1.b:0 "Los viajeros vendrán de lejos para rendir homenaje ante mi trono"
 me_albion.1.c:0 "Deseo la espada legendaria del verdadero [ROOT.GetCountry.GetRulerTitle]"
 me_albion_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y Regalia Real de Albión#!' $mission_completed_tooltip_2$"
 
 me_albion_2_title:0 "Una Pregunta Política"
 me_albion_2_desc:0 "Después de un período de tranquila reflexión, las élites que viven en [ROOT.GetCountry.GetCapital.GetName] han debatido sobre el futuro de [ROOT.GetCountry.GetName] entre ellos y han presentado a [ROOT.GetCountry.GetRuler.GetName] algunas propuestas.\n\nTanto ha cambiado en los últimos años, y las clases dirigentes se preguntan qué les depara el futuro a la gente: ¿habrá más períodos de caos y conflicto, o finalmente ha llegado la paz a la tierra? Las sangrientas guerras para unir [ROOT.GetCountry.GetName] no son recuerdos lejanos, con muchos guardando rencores hacia [ROOT.GetCountry.GetRuler.GetFirstName]. El [ROOT.GetCountry.GetRulerTitle] tendrá decisiones que tomar en los días venideros que influirán en el ánimo de los días por venir."
 me_albion.2.a:0 "Debemos usar nuestra influencia para cambiar nuestras leyes"
 me_albion.2.b:0 "Enfocarnos en mejorar el estado a expensas de los dioses"
 me_albion.2.c:0 "La civilización solo ha traído conflicto a nuestro pueblo"
 me_albion_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y Una cuestión política#!' $mission_completed_tooltip_2$"
 
 me_albion_3_title:0 "Apoyo de las Élites"
 me_albion_3_desc:0 "Después de un largo período de deliberación, [ROOT.GetCountry.GetRuler.GetName] ha llegado a la conclusión de que cambios políticos definitivos se avecinan en [ROOT.GetCountry.GetName], y que es [ROOT.GetCountry.GetRuler.GetSheHe] quien será responsable de tomar la decisión - ¡qué extraña senda han trazado los dioses para [ROOT.GetCountry.GetRuler.GetHerHim]! Ser confiado con tal autoridad es una responsabilidad inmensa, y son pocos los que viven en las tierras [ROOT.GetCountry.GetAdjective] que se atreverían a desafiar la voluntad del [ROOT.GetCountry.GetRulerTitle].\n\nSin embargo, [ROOT.GetCountry.GetRuler.GetFirstName] no puede permitirse hacer todo solo; las élites políticas que viven en [ROOT.GetCountry.GetCapital.GetName] y en otros lugares no pueden ser ignoradas. Si no contamos con sus espadas durante este crucial período de cambio político, podríamos encontrarlas en nuestras espaldas si no somos cuidadosos."
 me_albion.3.a:0 "Muy pronto, tomaré una decisión importante sobre nuestro futuro"
 me_albion_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y Apoyo de las élites#!' $mission_completed_tooltip_2$"
 
 me_albion_4_title:0 "Respeto por los Ancianos"
 me_albion_4_desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha complacido a muchos con [ROOT.GetCountry.GetRuler.GetHerHis] decisión de deferir a los Ancianos Tribales en asuntos tanto grandes como pequeños en el futuro. Habría sido muy fácil para [ROOT.GetCountry.GetRuler.GetFirstName] simplemente tomar todo el poder político para [ROOT.GetCountry.GetRuler.GetHerHim] mismo, pero la decisión del [ROOT.GetCountry.GetRulerTitle] muestra una madurez y sabiduría que revela no solo el amor de [ROOT.GetCountry.GetRuler.GetHerHis] por la tradición, sino una comprensión de cómo se debe jugar el juego."
 me_albion.4.a:0 "Los sabios dictámenes de los Ancianos nunca nos han desviado del camino"
 me_albion_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y Respeto por los mayores#!' $mission_completed_tooltip_2$"
 
 me_albion_5_title:0 "¡Poder Absoluto!"
 me_albion_5_desc:0 "Durante cientos de años, nuestros Consejos Tribales fueron considerados los logros más admirables de nuestros antepasados, que vivieron vidas de disputa y miseria mientras batallaban incesantemente por el control de pantanos sombríos y charcas de barro. Y sin embargo, los objetivos triviales de estos aspirantes a tiranos fueron opuestos por los [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] y sus parientes, quienes han sido fundamentales para poner fin a las guerras de unificación que han devastado el campo de nuestra justa isla.\n\nPero ahora, para asegurar la paz y la prosperidad para nuestro agotado pueblo, nuestro gobierno se reorganizará en la primera monarquía [ROOT.GetCountry.GetAdjective] bajo el gobierno divinamente inspirado de [ROOT.GetCountry.GetRuler.GetName]. Con soldados fuertemente armados acompañando a [ROOT.GetCountry.GetRuler.GetFirstName] mientras [ROOT.GetCountry.GetRuler.GetSheHe] entra en los salones de gobierno en [ROOT.GetCountry.GetCapital.GetName], el nuevo monarca del pueblo [ROOT.GetCountry.GetAdjective] promete que todo será mejor en los días venideros."
 me_albion.5.a:0 "Hemos sido puestos a prueba, ¡pero hemos salido más fuertes!"
 me_albion_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y ¡Poder absoluto!#!' $mission_completed_tooltip_2$"
 
 me_albion_6_title:0 "Un Poder Centralizado"
 me_albion_6_desc:0 "Aunque tomó muchos años de crecimiento para que nuestra joven civilización encontrara su estabilidad, estamos orgullosos de decir que los habitantes de [ROOT.GetCountry.GetName] finalmente se han convertido en algo parecido a un verdadero poder civilizado. [ROOT.GetCountry.GetCapital.GetName] se ha convertido en una ciudad visitada por comerciantes griegos y mercaderes cartagineses, ya que la noticia de nuestra sabiduría y poder ha llegado a los oídos de estos lejanos navegantes, que tienen curiosidad por ver nuestras tierras por sí mismos.\n\nY aunque nuestros logros hasta ahora son realmente impresionantes, [ROOT.GetCountry.GetRuler.GetName] ha prometido que esto es solo el comienzo para el pueblo [ROOT.GetCountry.GetAdjective] y ha jurado respaldar [ROOT.GetCountry.GetRuler.GetHerHis] promesas con acciones. Ya no somos una nación de nómadas pintados con woad vagando entre los páramos, sino una verdadera civilización - ¡una a la que se debe respetar y temer!"
 me_albion.6.a:0 "Dejemos que nuestro pueblo construya ciudades a lo largo de las costas y junto a los ríos"
 me_albion.6.b:0 "Decidiré personalmente dónde [ROOT.GetCountry.GetName] hará sus inversiones..."
 me_albion_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y Una energía centralizada#!' $mission_completed_tooltip_2$"
 
 me_albion_7_title:0 "Comercio y País Estabilizados"
 me_albion_7_desc:0 "Nuestros tesoros están en buen estado, el país se siente estable y, en general, la gente está contenta con el trabajo que está realizando [ROOT.GetCountry.GetRuler.GetName]. El comercio está creciendo como nunca antes, con comerciantes viajando a nuestras costas para obtener nuestras mercancías directamente de los talleres de nuestros compatriotas - nunca hemos visto tales sumas contadas en [ROOT.GetCountry.GetCapital.GetName].\n\nMientras nuestro valiente [ROOT.GetCountry.GetRulerTitle] continúe guiando al pueblo de [ROOT.GetCountry.GetName] con sabiduría y moderación - y si los dioses están con nosotros - entonces no tendremos nada que temer en los días venideros."
 me_albion.7.a:0 "Gravamos a estos nuevos ricos"
 me_albion.7.b:0 "El comerciante nos pagará un peaje"
 me_albion_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y Comercio y país estabilizados#!' $mission_completed_tooltip_2$"
 
 me_albion_8_title:0 "El Mar Pertenece a Albion"
 me_albion_8_desc:0 "Ahora que hemos construido una flota adecuada que es digna de [ROOT.GetCountry.GetName], nuestros valientes navegantes han anunciado audazmente que navegarán más lejos de lo que alguien ha navegado antes - ¡afirman que los mares abiertos les pertenecen a ellos, y todo para la gloria del pueblo [ROOT.GetCountry.GetAdjective]!"
 me_albion.8.a:0 "¡Navegaremos a donde nos plazca!"
 me_albion_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y El mar pertenece a Albion#!' $mission_completed_tooltip_2$"
 
 me_albion_9_title:0 "Marineros Profesionales"
 me_albion_9_desc:0 "Las ambiciones en el extranjero de [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] requieren que el pueblo de [ROOT.GetCountry.GetName] no solo tenga una flota extensa de barcos de guerra listos para el combate, sino una clase profesional de marineros que conozcan sus liburnios como la palma de su mano.\n\nAhora que hemos decidido invertir en nuestra armada, debemos decidir en qué debemos enfocar nuestros esfuerzos."
 me_albion.9.a:0 "Debemos tomar todas las medidas disponibles para proteger a nuestros hombres"
 me_albion.9.b:0 "Enfocarnos en el cuerpo de oficiales y decirles que hagan estragos"
 me_albion_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y Marineros profesionales#!' $mission_completed_tooltip_2$"
 
 me_albion_11_title:0 "Un Nuevo Poder"
 me_albion_11_desc:0 "Después de muchos años de guerras y conflictos que han asolado la isla que conquistamos, el inmortal [ROOT.GetCountry.GetRuler.GetName] ha traído la paz al pueblo de [ROOT.GetCountry.GetName]. Los reyes en disputa de las pequeñas tribus han inclinado sus cabezas y presentado sus coronas ante los pies enjoyados de [ROOT.GetCountry.GetRuler.GetFirstName], quien ha prometido conducir a [ROOT.GetCountry.GetRuler.GetHerHis] gente a la gloria eterna en los días venideros."
 me_albion.11.a:0 "¡Esto es solo el comienzo!"
 me_albion.11.b:0 "¡Esto es solo el comienzo!"
 me_albion_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y Un nuevo poder#!' $mission_completed_tooltip_2$"
 me_perfidious_albion:0 "Esta opción está disponible porque completamos estas misiones antes de #Y 500 AUC#!."
 
 me_albion_12_title:0 "Gran República de Albion"
 me_albion_12_desc:0 "Lejos y ancho se alaban nuestras hazañas, y todo es gracias al liderazgo desinteresado de [ROOT.GetCountry.GetRuler.GetName] que tales cosas han sucedido. La lista de glorias es interminable; nuestras fronteras se han expandido y crecido en consonancia con nuestros ejércitos que luchan por preservar la justicia, nuestros productos comerciales son muy deseados en los mercados de todo el mundo, y nuestros ciudadanos educados viven en ciudades de lujo y civilización que reflejan el prestigio y poder de nuestra nación."
 me_albion.12.a:0 "Mis antepasados estarían orgullosos de mí..."
 me_albion_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y Gran República de Albion#!' $mission_completed_tooltip_2$"
 
 me_albion_13_title:0 "Victoria Sobre la Isla"
 me_albion_13_desc:0 "¡Que este día sea celebrado por nuestros hijos e hijas hasta el fin de los tiempos! Después de muchos años difíciles de batallas incesantes y devastaciones tras devastaciones, [ROOT.GetCountry.GetRuler.GetName] finalmente ha llevado la paz a una tierra que está tristemente demasiado familiarizada con la guerra.\n\nY no solo se han derrotado a los ejércitos de nuestros enemigos, sino que la tierra misma ha sido conquistada - hemos construido ciudades y barcos, puertos y fortalezas. Muchos incluso han dicho que [ROOT.GetCountry.GetRuler.GetFirstName] ha logrado la victoria sobre la isla misma, pero el [ROOT.GetCountry.GetRulerTitle] ha minimizado humildemente estas afirmaciones."
 me_albion.13.a:0 "Solo he cumplido con mi deber - el elogio debe ser dado solo a los dioses"
 me_albion_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y Victoria sobre la isla#!' $mission_completed_tooltip_2$"
 
 me_albion_14_title:0 "Puerto del Oeste"
 me_albion_14_desc:0 "Después de un largo período de cuidadosa inversión, los esfuerzos del pueblo [ROOT.GetCountry.GetAdjective] para construir un puerto adecuado en la isla de #E Hibernia#! finalmente han tenido éxito, y [ROOT.GetCountry.GetRuler.GetName] está satisfecho con los informes que [ROOT.GetCountry.GetRuler.GetSheHe] ha estado leyendo sobre su progreso.\n\nMuchos de nuestros mejores marineros y constructores de barcos han hecho su hogar en el oeste, y como resultado de nuestra disposición a pagar oro por su experiencia, hemos podido construir barcos de guerra a un ritmo asombroso en esta ciudad. Nunca antes en nuestra historia hemos tenido una capital provincial que sea un importante puerto militar - los tiempos están cambiando para todos los que viven en Hibernia y dentro de [ROOT.GetCountry.GetName], y todo es gracias a [ROOT.GetCountry.GetRuler.GetFirstName]."
 me_albion.14.a:0 "Construiré puertos donde los necesitemos"
 me_albion_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y Puerto del Oeste#!' $mission_completed_tooltip_2$"
 
 me_albion_15_title:0 "Fortaleza del Norte"
 me_albion_15_desc:0 "Las murallas de la fortaleza del norte que se completaron recientemente son como ninguna otra construida en [ROOT.GetCountry.GetName]; un testimonio de la habilidad de nuestros buenos arquitectos [ROOT.GetCountry.GetAdjective] que fueron capaces de trabajar en condiciones difíciles para completar esta tarea.\n\nDesde este día en adelante, nuestro poder está asegurado en esta región, pues siempre podremos retirarnos a la seguridad de esta fortaleza si lo incomprensible llegara a suceder."
 me_albion.15.a:0 "Que los dioses mantengan a los enemigos alejados de nuestras costas - pero estamos listos"
 me_albion_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y Fortaleza del Norte#!' $mission_completed_tooltip_2$"
 
 me_albion_16_title:0 "Perla del Sur"
 me_albion_16_desc:0 "Hay pocos lugares como la llamada #E 'Perla del Sur'#!, como se le conoce a todos los que viven dentro de [ROOT.GetCountry.GetName] y prácticamente no tiene otro nombre. Sus mercados están llenos de comerciantes y mercenarios del continente, y espadas, especias y sedas están al alcance de cualquiera que pueda pagar el precio.\n\nLas calles mismas son un borrón de color y sonido; ríos de oro y plata derramándose de cada bolsillo, una mezcla vertiginosa de lenguas extranjeras y maneras de vestir nadando a través de un mar de riqueza inimaginable - hay un aire embriagador de emoción y peligro en sus mercados y callejones, una mezcla que muchos encuentran embriagadora, si no mortal. El dinero ha traído muchas cosas a esta ciudad en la costa, y quizás no todas son para admirar."
 me_albion.16.a:0 "Lo que sucede dentro de la 'Perla' debe permanecer allí, se dice"
 me_albion_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y Perla del Sur#!' $mission_completed_tooltip_2$"
 
 me_albion_17_title:0 "Una Nueva Capital"
 me_albion_17_desc:0 "Ahora que somos un poderoso imperio y ya no un reino o confederación de jefes tribales, algunos han propuesto que movamos la sede del gobierno de [ROOT.GetCountry.GetCapital.GetName] a un nuevo lugar. Una nueva capital podría representar un futuro nuevo para el pueblo de [ROOT.GetCountry.GetName] mientras nos unimos para establecer un nuevo hogar - una idea que atrae a [ROOT.GetCountry.GetRuler.GetName] - pero [ROOT.GetCountry.GetRuler.GetSheHe] tomará la decisión final sobre lo que se haga."
 me_albion.17.a:0 "Nuestra perla se convertirá en la capital"
 me_albion.17.b:0 "La ciudad con las mejores fortificaciones es mi elección"
 me_albion.17.c:0 "Hibernia es nuestro hogar y siempre lo será"
 me_albion.17.d:0 "Colocaremos nuestra capital en una isla y la haremos un paraíso"
 me_albion.17.e:0 "Invierte estas energías en nuestro hogar tradicional"
 me_albion_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y Una nueva capital#!' $mission_completed_tooltip_2$"
 
 me_albion_18_title:0 "Fuente de Inspiración"
 me_albion_18_desc:0 "Nuestro viaje organizado por [ROOT.GetCountry.GetRuler.GetName] fue un gran éxito y se descubrieron muchos lugares. Ha llegado nuestro momento de #Y Elegir#! una manera de modernizar nuestro país para convertirnos en una nueva #G Gran Potencia#!!"
 me_albion.18.a:0 "Alejandro podría haber sido celta"
 me_albion.18.b:0 "Tácticas romanas contra tácticas romanas"
 me_albion.18.c:0 "Hemos oído hablar de un tal Aníbal"
 me_albion_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y Fuente de inspiración#!' $mission_completed_tooltip_2$"
 hellenic_ways_tt:0 "La siguiente tarea y recompensas se centrarán en crear una #T Sociedad Helénica#!"
 italic_ways_tt:0 "La siguiente tarea y recompensas se centrarán en crear una #T Sociedad Romana#!"
 punic_ways_tt:0 "La siguiente tarea y recompensas se centrarán en crear una #T Sociedad Púnica#!"
 
 me_albion_19_title:0 "Comienzos Auspiciosos"
 me_albion_19_desc:0 "Durante muchos meses, se han llevado a cabo conversaciones serias dentro de [ROOT.GetCountry.GetCapital.GetName] sobre el futuro de la isla que habitamos. No es ningún secreto que el pueblo de [ROOT.GetCountry.GetName] se ha fortalecido en los últimos años, y se acerca rápidamente un tiempo en el que podremos moldear nuestro propio destino.\n\nAunque algunas voces disidentes se hicieron escuchar, estaban en la minoría y fueron ignoradas por quienes pensaban igual; para que la verdadera paz y prosperidad visiten nuestra isla, debemos ser los amos de todo."
 me_albion.19.a:0 "Un futuro brillante espera a los habitantes de nuestra isla"
 me_albion_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y Comienzos auspiciosos#!' $mission_completed_tooltip_2$"
 AIO_unification_opinion:0 "Todos los países británicos que no sean nuestro tema perderán #R una fuerte opinión#! sobre nosotros."
 
 me_albion_20_title:0 "Suministros de Hierro"
 me_albion_20_desc:0 "Gracias a los esfuerzos de nuestros esclavos, hemos recolectado mucho hierro @iron! de las minas y montañas de [ROOT.GetCountry.GetName] en los últimos meses. Una vez que el valioso mineral ha sido llevado a la superficie, carretada tras carretada se llena hasta el borde por nuestros trabajadores que luego realizan el largo viaje por tierra a [ROOT.GetCountry.GetCapital.GetName] para entregar las materias primas a nuestros herreros que esperan impacientes en sus forjas.\n\nNo pasará mucho tiempo antes de que nuestros guerreros tengan las mejores espadas y lanzas jamás fabricadas en nuestra isla."
 me_albion.20.a:0 "¡Requerimos nada menos que lo mejor para nuestros ejércitos!"
 me_albion_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y Suministros de hierro#!' $mission_completed_tooltip_2$"
 
 me_albion_21_title:0 "¿Inmigración o Asimilación?"
 me_albion_21_desc:0 "Nuestra creciente capital [ROOT.GetCountry.GetCapital.GetName] comienza a atraer a muchas personas de todo el mundo celta. Es a la vez un #R peligro#! y una #G Oportunidad#!.\nPara proteger a nuestros ciudadanos y continuar nuestra ascensión. ¿Deberíamos #Y Fomentar#! aún más la inmigración o centrarnos en #Y integrar#! a los existentes?"
 me_albion.21.a:0 "¡Bienvenidos!"
 me_albion.21.b:0 "Pueden quedarse si intentan aprender nuestro idioma."
 me_albion_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y #!' $mission_completed_tooltip_2$"
 
 me_albion_22_title:0 "Una Historia de Justicia"
 me_albion_22_desc:0 "Desde el momento en que éramos una sola tribu, los Druidas eran los maestros, sacerdotes y jueces de la sociedad. Ahora, tenemos una capital en crecimiento con gente que pide una infraestructura y administración más modernas, y los ciudadanos dentro de [ROOT.GetCountry.GetCapital.GetName] quieren una voz para la justicia y tener juicios justos. Los Druidas han pedido a [ROOT.GetCountry.GetRuler.GetName] que confirme que la justicia debe permanecer en manos de quien tenga más conocimiento; en otras palabras, los Druidas.\n\nEsto está creando un gran dolor de cabeza para el [ROOT.GetCountry.GetRulerTitle], quien se da cuenta de que la decisión de [ROOT.GetCountry.GetRuler.GetHerHis] impactará el futuro de muchos [ROOT.GetCountry.GetAdjective] por generaciones."
 me_albion.22.a:0 "Los druidas deben seguir a cargo"
 me_albion.22.b:0 "Los dioses nos vigilarán bajo la supervisión de jueces"
 me_albion_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y Una historia de justicia#!' $mission_completed_tooltip_2$"
 
 me_albion_23_title:0 "Aventuras Coloniales"
 me_albion_23_desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha ordenado a los marineros de [ROOT.GetCountry.GetName] que se preparen para navegar a través de las aguas sombrías y amenazantes del #E Mare Septentrionale#! hacia las lejanas costas de #E Scandia#!. El valiente [ROOT.GetCountry.GetRulerTitle] no se contentará con saquear las ricas y prósperas tierras de los #E Galos#!, parece, sino que debe tener cada roca helada y costa azotada por el viento en el mundo para los ejércitos de Albion."
 me_albion.23.a:0 "¡Karmasunda será nuestra!"
 me_albion.23.b:0 "Klempaz es el sitio de colonización más atractivo"
 me_albion.23.c:0 "Por la presente reclamo Soknidala para Albion!"
 me_albion.23.d:0 "Arnidala ha captado mi interés"
 me_albion.23.e:0 "Me gusta el nombre de Thelimarko"
 me_albion.23.f:0 "Westrafaludaz es mi única elección"
 me_albion_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y Aventuras coloniales#!' $mission_completed_tooltip_2$"
 
 me_albion_24_title:0 "Demasiado Tarde..."
 me_albion_24_desc:0 "Lo que podría ser un lugar perdido e inhóspito es ahora una región completamente ocupada que está bajo otro poder. Si queremos nuestra parte del pastel, ¡tendremos que cortarla con la espada!"
 me_albion.24.a:0 "¡Será mío!"
 me_albion_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y Demasiado tarde...#!' $mission_completed_tooltip_2$"
 
 me_albion_25_title:0 "Colonias Nórdicas"
 me_albion_25_desc:0 "[ROOT.GetCountry.GetRuler.GetName], hemos recibido informes de las colonias que nuestros valientes colonos han establecido en las malditas tierras de #E Scandia#!, que parecen ser un lugar abandonado por el dios del sol.\n\nLas cosas van bien - un testimonio de la robustez y fortaleza de nuestros compatriotas [ROOT.GetCountry.GetAdjective], que pueden prosperar en cualquier lugar al que se les envíe. Pero el gobernador local ha enviado un mensaje, informando que estamos encontrando cada vez más tribus nativas. No podemos ocultar nuestra presencia ante ellos, y parece que las cosas podrían ir en cualquier dirección: podrían convertirse en nuestros amigos o enemigos rápidamente. ¿Cómo deberíamos tratar a los bárbaros a través del océano?"
 me_albion.25.a:0 "Ordena a los colonos que sean justos en sus tratos con los nativos"
 me_albion.25.b:0 "¡Estas colonias son puntos de apoyo para los ejércitos conquistadores de [ROOT.GetCountry.GetName]!"
 me_albion_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y Colonias nórdicas#!' $mission_completed_tooltip_2$"
 claim_scandinavia:0 "#Y Reclamaremos toda#! #T Escandinavia#!."
 
 me_albion_26_title:0 "El Llamado de Nuestros Hermanos"
 me_albion_26_desc:0 "El comercio y el aislamiento siempre han sido nuestra política prioritaria para el pueblo [ROOT.GetCountry.GetAdjective], sirviéndoles bien durante siglos. Pero los recientes informes desde el continente son muy alarmantes; el sur de la Galia está perdido, los Belgas ahora son una facción separada y los alemanes están saqueando con más frecuencia. Incluso hemos oído hablar de una posible invasión de nuestra isla por parte de los sajones a través del agua.\n\nLos presagios no son buenos, y tendremos que actuar; necesitamos recuperar las tierras de nuestros hermanos para salvar tanto de nuestro patrimonio como podamos. Y si algunas tribus celtas no están contentas de que estemos imponiendo nuestra voluntad sobre nuestros primos y parientes lejanos, entonces los haremos arrodillarse con cadenas alrededor de sus gargantas."
 me_albion.26.a:0 "Hijo mío, prepara mi espada - ¡vamos a la guerra!"
 me_albion_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y El llamado de nuestros hermanos#!' $mission_completed_tooltip_2$"
 claims_costal_gaul_belgica:0 "#Y Tenemos Reclamos sobre#! #G Armorica y Belgica#!."
 AIO_foreign_conqueror_opinion:0 "Todos los países celtas y belgas dentro de #Y Armorica y Belgica#! perderán #R gran opinión#! sobre nosotros."
 
 me_albion_27_title:0 "Verdad y Reconciliación"
 me_albion_27_desc:0 "Comer o ser comido; eso es lo que la mayoría de nuestros [ROOT.GetCountry.GetAdjective] soldados creen, pero incluso nuestros soldados curtidos en la batalla pueden admitir cuando han cometido un error, y muchos que viven en [ROOT.GetCountry.GetName} han reevaluado nuestra relación con los romanos.\n\nNuestro pueblo solía ver a los romanos como bárbaros asesinos, pero gracias a los esfuerzos de nuestros diplomáticos, nos hemos hecho amigos de los italianos; ahora afirman vernos como socios, y han expresado con entusiasmo su deseo de colaborar en el futuro.\n\nMientras las elites que viven dentro de [ROOT.GetCountry.GetCapital.GetName] esperan públicamente lo mejor, hay quienes creen cínicamente que la concordia entre nuestros pueblos es temporal, y que un día pronto, las brasas de la discordia arderán nuevamente en los corazones de los hombres y hundirán nuestro reino en la guerra... pero ese es el problema de mañana, por hoy, nos hemos unido y caminamos hacia abajo. El camino juntos."
 me_albion.27.a:0 "Que esta amistad perdure."
 me_albion_27_tooltip:0 "$mission_completed_tooltip_1$ '#Y Verdad y reconciliación#!' $mission_completed_tooltip_2$"
 
 me_albion_28_title:0 "Trato con los Romanos"
 me_albion_28_desc:0 "Mientras muchos afirman que los ejércitos de #E Roma#! deben ser temidos, [ROOT.GetCountry.GetRuler.GetName] ha llevado a nuestros soldados contra los suyos y encuentra que su reputación está exagerada. El [ROOT.GetCountry.GetRulerTitle] ha perdido la cuenta de las veces que nuestros hombres han saqueado sus ciudades y templos, llevándose sus vasos de plata y oro mientras incendiamos sus hogares. ¿Por qué todo el mundo tiene tanto miedo del lobo que ladra?"
 me_albion.28.a:0 "Los romanos no durarán mucho en este mundo, creo..."
 me_albion_28_tooltip:0 "$mission_completed_tooltip_1$ '#Y Tratar con los romanos#!' $mission_completed_tooltip_2$"
 
 me_albion_29_title:0 "Dos Reinos, Un Imperio"
 me_albion_29_desc:0 "[ROOT.GetCountry.GetRuler.GetName] es temido en las capitales de nuestros enemigos como un guerrero feroz y general de renombre; todos los elogios que [ROOT.GetCountry.GetRuler.GetSheHe] merece, pues el [ROOT.GetCountry.GetRulerTitle] ha conquistado muchas naciones, rompiendo las coronas y cetros de numerosos monarcas que se atrevieron a oponerse a la voluntad del pueblo [ROOT.GetCountry.GetAdjective].\n\nY mientras las extensas posesiones de [ROOT.GetCountry.GetName] abarcan dominios en las islas y en el continente, separados por miles de millas de bosques y océano, son una unión inquebrantable, unida en propósito y destino - el cohesivo imperio forjado por [ROOT.GetCountry.GetRuler.GetFirstName] es uno que debe ser admirado, de hecho."
 me_albion.29.a:0 "¡El pueblo de [ROOT.GetCountry.GetName] es imparable!"
 me_albion_29_tooltip:0 "$mission_completed_tooltip_1$ '#Y Dos reinos, un imperio#!' $mission_completed_tooltip_2$"
 
 me_albion_30_title:0 "Una Capital Gala"
 me_albion_30_desc:0 "Tan vastas son las fronteras de [ROOT.GetCountry.GetName] que se ha establecido una segunda capital imperial en #E Galia#!, que servirá como un asiento regional de poder y centro de comercio para los mercaderes [ROOT.GetCountry.GetAdjective].\n\nPara conmemorar la ocasión, una procesión de sacerdotes salió de [ROOT.GetCountry.GetCapital.GetName] y navegó hacia el continente, donde continuaron adelante. Dondequiera que fueran, bendijeron a la gente y pidieron que los dioses velaran por la nueva capital, ofreciéndole protección contra nuestros enemigos."
 me_albion.30.a:0 "¡La legitimidad de mi dinastía no puede ser cuestionada!"
 me_albion_30_tooltip:0 "$mission_completed_tooltip_1$ '#Y Una capital gala#!' $mission_completed_tooltip_2$"
 
 me_albion_31_title:0 "Patria Unida"
 me_albion_31_desc:0 "Durante décadas e incluso siglos, nadie podía aspirar a unir nuestra región natal, porque si tales cosas fueran posibles, se habrían logrado en los días previos al surgimiento de [ROOT.GetCountry.GetName]. Pero los ancestros [ROOT.GetCountry.GetRuler.GetName] y [ROOT.GetCountry.GetRuler.GetHerHis] lograron realizar esta tarea imposible, reuniendo a las tribus de nuestra patria en un solo pueblo mediante el uso juicioso de la espada.\n\nAl darse cuenta de que hay un tiempo para la guerra y un tiempo para la paz, nuestro [ROOT.GetCountry.GetRulerTitle] ha enviado jinetes por todo el reino con un mensaje de [ROOT.GetCountry.GetCapital.GetName]. Las guerras de unificación tuvieron que librarse por el bien mayor del reino, pero ahora debemos dejar de lado los recuerdos amargos y unirnos como uno solo."
 me_albion.31.a:0 "¡Os ordeno que festejéis, bebáis y os unáis!"
 me_albion_31_tooltip:0 "$mission_completed_tooltip_1$ '#Y Patria Unida#!' $mission_completed_tooltip_2$"
 
 me_albion_32_title:0 "Sumisión Hiberniana"
 me_albion_32_desc:0 "Los hibernianos siempre han estado aislados y se han negado a unirse en guerras en Britania o Caledonia, y esta desunión ha demostrado ser su perdición final. No son guerreros particularmente fuertes, pero sus habilidades en la caza y las técnicas de corte de madera son impresionantes a su manera.\n\n¿Debería [ROOT.GetCountry.GetRuler.GetName] aceptar su cultura principal como hermanos de sangre? Hay muchos que viven con [ROOT.GetCountry.GetName] que preferirían que fuera así."
 me_albion.32.a:0 "Hermano, ven a la tienda."
 me_albion.32.b:0 "Los hibernianos no deberían ser aceptados como uno de nosotros"
 me_albion.32.c:0 "Los hibernianos son gusanos y deben quedarse a nuestros pies"
 me_albion_32_tooltip:0 "$mission_completed_tooltip_1$ '#Y Presentación hiberniana#!' $mission_completed_tooltip_2$"
 hibernian_domination:0 "Todas las culturas #Y Hibernianas#! recibirán:"
 hibernian_slavery:0 "Todas las culturas #Y Hibernianas#! recibirán:"
 
 me_albion_33_title:0 "Preguntas Caledonias"
 me_albion_33_desc:0 "Los caledonios, manteniéndose fieles a su reputación de amantes de la libertad, hicieron todo lo posible para resistirnos, pero finalmente fracasaron, y ahora deben aprender a vivir con sus nuevas circunstancias.\n\nY, sin embargo, no es necesario visitar el Oráculo para ver que es sólo cuestión de tiempo hasta que los bárbaros intenten molestarnos nuevamente. Algunas voces dentro de nuestro consejo de guerra abogan por su integración en nuestra sociedad, mientras que otras quieren saquearlos y explotarlos; la decisión final será [ROOT.GetCountry.GetRuler.GetName]."
 me_albion.33.a:0 "Capitán, libere a los cautivos de sus cadenas"
 me_albion.33.b:0 "Capitán, envíe a los cautivos a la mina"
 me_albion.33.c:0 "Capitán, ¡maten a los cautivos y esclavicen a sus familias!"
 caledonian_domination:0 "Todas las culturas #Y Caledonias#! recibirán:"
 caledonian_slavery:0 "Todas las culturas #Y Caledonias#! recibirán:"
 
 me_albion_34_title:0 "Riquezas de Pritannia"
 me_albion_34_desc:0 "Históricamente, Pritannia fue el centro comercial de la Isla Británica. Muchas ciudades empezaron a crecer y la gente estaba conectada con la tierra principal de la Galia.\nPero ahora nuestros soldados bajo el mando de [ROOT.GetCountry.GetRuler.GetName] están listos para tomar todo para ellos.\n\nPara mantener un gobierno largo y estable, deberíamos integrar a algunos de ellos en nuestra corte, pero sería un desperdicio de dinero no saquear todo ahora."
 me_albion.34.a:0 "No los toques. Son nuestros hermanos"
 me_albion.34.b:0 "Hombres, están libres de todo"
 me_albion.34.c:0 "¡Quemen todo!"
 prittania_domination:0 "Todas las culturas #Y Pritánicas#! recibirán:"
 prittania_slavery:0 "Todas las culturas #Y Pritánicas#! recibirán:"
 me_albion_34_tooltip:0 "$mission_completed_tooltip_1$ '#Y Riqueza de Pritannia#!' $mission_completed_tooltip_2$"
 
 me_albion_35_title:0 "Controlando El Canal"
 me_albion_35_desc:0 "Desde ambos lados del canal, nuestra bandera está sobre cada torre de vigilancia, y nuestros hombres están listos para disparar flechas a los piratas que se acerquen a los muros del mar. Gracias a nuestra capacidad para repeler a los saqueadores de los puertos y refugios de [ROOT.GetCountry.GetName], los beneficios para el comercio y la prosperidad han sido sorprendentes."
 me_albion.35.a:0 "Pueden viajar en paz, viajeros."
 me_albion_35_tooltip:0 "$mission_completed_tooltip_1$ '#Y Controlando el canal#!' $mission_completed_tooltip_2$"
 
 me_albion_36_title:0 "Mi Precioso"
 me_albion_36_desc:0 "Desde temprana edad, [ROOT.GetCountry.GetRuler.GetName] escuchó un poco de sabiduría compartida por [ROOT.GetCountry.GetRuler.GetHerHis] padre, y las palabras de [ROOT.GetCountry.GetRuler.GetHerHis] sire siempre han permanecido en la mente del [ROOT.GetCountry.GetRulerTitle].\n\n'Haz felices a los nobles y soldados, y todos los problemas dentro de un país se resolverán por sí mismos... ¿y qué hace a un hombre más feliz? El oro - mientras todos estén ganando dinero juntos, entonces las amenazas a tu reinado se minimizarán.'\n\nY a medida que se colocan sumas vastas en las tesorerías en [ROOT.GetCountry.GetCapital.GetName] - el resultado directo de los esfuerzos de [ROOT.GetCountry.GetRuler.GetFirstName] para construir la economía, el consejo compartido por el padre de [ROOT.GetCountry.GetRuler.GetHerHis] viene a la mente."
 me_albion.36.a:0 "Prefiero que cuentes monedas de plata en lugar de tus quejas..."
 me_albion_36_tooltip:0 "$mission_completed_tooltip_1$ '#Y Mi Precioso#!' $mission_completed_tooltip_2$"
 
 me_albion_37_title:0 "Nuevo Néctar"
 me_albion_37_desc:0 "Con los años, los vinicultores que viven en los viñedos de [ROOT.GetCountry.GetName] han perfeccionado su arte, y en una prueba a ciegas, es difícil distinguir el vino hecho en casa de las famosas variedades producidas en [GetProvince('(int32)1').GetArea.GetRegion.GetName] - un testimonio de su habilidad, que es realmente de clase mundial.\n\nGracias a estas felices circunstancias, nuestros kinsmen [ROOT.GetCountry.GetAdjective] se han vuelto bastante aficionados a beber vino, y aunque actualmente producimos una cantidad sustancial, se ha sugerido a [ROOT.GetCountry.GetRuler.GetName] que reservemos fondos para construir más instalaciones de producción de vino en casa."
 me_albion.37.a:0 "[prov_1.GetName] merece tales cosas"
 me_albion.37.b:0 "[prov_2.GetName] es un candidato natural"
 me_albion.37.c:0 "El 'Viñedo de [prov_3.GetName]' tiene un sonido encantador, ¿no?"
 me_albion.37.d:0 "Con un nombre como [prov_4.GetName], ¿cómo podría elegir otro lugar?"
 me_albion.37.e:0 "[prov_5.GetName] es el lugar que he elegido"
 me_albion.37.f:0 "Pensándolo bien, nos quedaremos con el dinero - tenemos suficiente vino"
 
 me_albion_38_title:0 "Los Juegos Celtas"
 me_albion_38_desc:0 "Es conocido en [ROOT.GetCountry.GetName] que hay muchos festivales celebrados en las tierras del sur, siendo los #E Juegos Olímpicos#! los más famosos. Cuando [ROOT.GetCountry.GetRuler.GetName] escuchó que algunos de los nobles que viven en [ROOT.GetCountry.GetCapital.GetName] estaban viajando al distante Mediterráneo para asistir a estos eventos, [ROOT.GetCountry.GetRuler.GetSheHe] decidió que el pueblo celta debía tener sus propios juegos. Ahora, el [ROOT.GetCountry.GetRulerTitle] debe decidir qué tipo de concursos principales tendremos para la primera edición."
 me_albion.38.a:0 "Propongo que corramos sobre las aguas en un espectáculo para la posteridad"
 me_albion.38.b:0 "Debemos ver una demostración de fuerza y poder en tierra"
 me_albion.38.c:0 "Tengamos una prueba de asuntos relacionados con la fe"
 me_albion.38.d:0 "Nuestros Juegos se centrarán en el intelecto y la sabiduría"
 me_albion_38_tooltip:0 "$mission_completed_tooltip_1$ '#Y Los juegos celtas#!' $mission_completed_tooltip_2$"
 
 me_albion_39_title:0 "Un Guerrero Surge"
 me_albion_39_desc:0 "Este año para los #Y [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#!, los competidores estaban codo a codo, con todos rindiendo al máximo. Las multitudes que observaban los Juegos Olímpicos estaban muy entretenidas con los eventos del día hasta ahora, pero poco sabían que lo mejor estaba por venir.\n\nLa última serie de eventos olímpicos fueron respectivamente el lanzamiento de jabalina, el duelo y las carreras a pie.\nUn alboroto casi ocurrió cuando [warrior_champion.GetName] lanzó la jabalina a toda la longitud del estadio, casi empalando a un noble que miraba en las gradas. En el evento del duelo, [warrior_champion.GetFirstName] una vez más llegó a la final y ganó la pelea mientras miles de voces vitoreaban como una sola.\nDespués de toda esta expectación, nuestro aspirante a campeón terminó el trabajo y completó un maratón en menos de dos horas y media, logrando un récord histórico que pocos creían que se podría batir.\n\nToda la multitud comenzó a cantar el nombre del nuevo victorioso - [warrior_champion.GetFirstName], [warrior_champion.GetFirstName], quien fue coronado directamente por nuestro [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName]. Fue un momento que se recordará por edades."
 me_albion.39.a:0 "[warrior_champion.GetFirstName] debería convertirse en mi nueva espada..."
 celt_martial_olympics_champion:0 "[warrior_champion.GetName] con un #G Alto#! @military_icon! #Y Se unió a tu Corte#!."
 
 me_albion_40_title:0 "Discurso del Genio"
 me_albion_40_desc:0 "Este año, para los #Y [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#!, los competidores estuvieron codo a codo y todos dieron lo mejor de sí. Las multitudes que presenciaban los Juegos Olímpicos se divirtieron mucho con los acontecimientos del día hasta el momento, pero no sabían que lo mejor estaba por llegar.\n\nEl último evento olímpico del día fue la #Y prueba de Filosofía#!. Esta disciplina, importada de los Juegos Olímpicos originales, es muy misteriosa.\n¿El objetivo? Convencer a un jurado compuesto por cinco personas sobre el punto de vista de un competidor sobre un tema filosófico. Cada participante tendrá que convencerse de que su argumento y razón es la mejor.\n\nEste año, el tema de debate fue '¿se puede transferir el amor de un dios a un humano?' Cada concursante tuvo dos horas de preparación y comenzó uno a uno dando sus argumentos en menos de diez minutos.\n\nPero cuando llegó el turno de [scientific_champion.GetName], el ambiente en la sala empezó a cambiar. [scientific_champion.GetFirstName] comenzó su discurso explicando el [scientific_champion.GetHerHis] punto de vista con palabras extremadamente simples.\n\N[scientific_champion.GetName] logró hacer llorar a un miembro del jurado y el público comenzó a aplaudir en señal de que [scientific_champion.GetSheHe] será el nuevo campeón.\n\n[scientific_champion.GetFirstName] puede que no sea el mejor guerrero o navegante, pero [scientific_champion.GetSheHe] todavía se ganó el amor de la multitud. Y es por esta razón que [scientific_champion.GetFirstName] fue coronado por el mismo [ROOT.GetCountry.GetRuler.GetName] como ganador de los #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#!."
 me_albion.40.a:0 "¡La pluma es más poderosa que la espada!"
 celt_charisma_olympics_champion:0 "[scientific_champion.GetName] con un #G Alto#! @oratory_icon! ¡#Y Se unió a tu Corte#!."
 
 me_albion_41_title:0 "La Carrera Naval"
 me_albion_41_desc:0 "Este año, los #Y [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#! abrieron la competencia con una #Y regata de botes#!.\nEl objetivo era alcanzar una serie de puntos navales antes de que tus oponentes pudieran hacerlo, algo bastante fácil que todos pudieran entender. Sin embargo, no estaba permitido matar oponentes ni hundir los barcos de otros jugadores, y las sanciones para cualquiera que violara estas reglas estaban claras.\n\n[naval_champion.GetName] ya era conocido entre tus marineros como un guerrero audaz, listo en cualquier momento para lanzarse a la pelea sin importar las probabilidades. Cuando comenzó la carrera, [naval_champion.GetFirstName] rápidamente tomó la delantera y pudo burlarse de [naval_champion.GetHerHis] oponentes que intentaban desesperadamente alcanzarlo sin éxito.\n\nLa multitud que esperaba en la orilla gritaba por [naval_champion.GetFirstName], esperando que los dioses le trajeran a [naval_champion.GetHerHim] la victoria. Al final, [naval_champion.GetName] ganó la carrera con un enorme margen: ¡más de dos horas!\n\NDespués de completar esta carrera inaugural, [naval_champion.GetFirstName] continuó con muchos éxitos, ganando muchos otros eventos para convertirse en el vencedor de los [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#!.\n\nNuestro [ROOT.GetCountry.GetRulerTitle] dio una rama de olivo y la multitud codiciosa lloró. Busca más carreras y más entretenimiento."
 me_albion.41.a:0 "¡Serás mi navegador personal!"
 celt_finesse_olympics_champion:0 "[naval_champion.GetName] con un #G Alto#! @civic_icon! ¡#Y Se unió a tu Corte#!."
 
 me_albion_42_title:0 "La Boca de los Dioses"
 me_albion_42_desc:0 "Este año, en los #Y [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#!, el evento finalizó con un ritual de adivinación religiosa.\nEsta tarea pidió a los participantes que intentaran lograr una 'visión' de los dioses, pidiéndoles que entraran en un estado meditativo para recibir una revelación divina. Esta prueba es muy misteriosa, y muchos no logran alcanzar sus objetivos previstos, ya que los dioses son caprichosos y no siempre se preocupan por las penurias de los hombres.\nPero este año, [religious_champion.GetName] no estaba dispuesto a dejar este evento sin resultados. Después de dos horas de meditación, [religious_champion.GetFirstName] despertó con los ojos vacíos, como si [religious_champion.GetSheHe] estuviera poseído. Mientras [religious_champion.GetSheHe] comenzaba a moverse y bailar lentamente y de manera extraña, la multitud silenciosa observaba con mucha atención, tratando de entender qué sucedería a continuación. Luego, [religious_champion.GetFirstName] comenzó a hablar en una voz fuerte y sobrenatural que fue escuchada por todos los presentes.\n\n'Brigantia habla a través de mí y hace sus demandas conocidas. Ella está pidiendo cien guerreros que vivan en [ROOT.GetCountry.GetCapital.GetName] para bailar en círculo. Cuando se haya hecho, ella aparecerá y hablará un presagio'. Después de escuchar esta extraña voz que salía de la boca de [religious_champion.GetFirstName], la multitud quedó asombrada y pidió que se reunieran los guerreros de inmediato, incluso si la participación del público en el evento estaba estrictamente prohibida. Para evitar un motín, [ROOT.GetCountry.GetRuler.GetName] aceptó la solicitud de la multitud y llevó a los soldados al centro del evento, donde comenzaron a bailar en círculo como lo pidió Brigantia. El cielo estaba despejado, pero todos los presentes oyeron un fuerte trueno que hizo que muchos gritaran de miedo y saltaran en sus asientos.\n\n'Es el signo de Brigantia - ¡nuestra caballería será más rápida que el trueno!' dijo un hombre en la multitud. Después de tal demostración asombrosa de fe, estaba claro que [religious_champion.GetFirstName] sería el campeón del año. Sin embargo, algunos de nuestros [ROOT.GetCountry.GetRulerTitle] creen que hubo trucos para manipular a todos, pero el hecho es que la multitud está con [religious_champion.GetName], que por ahora es intocable. ¿Se convertirá [religious_champion.GetFirstName] en un Alto Druida o en alguien a ser desterrado como alborotador? Solo el tiempo lo dirá."
 me_albion.42.a:0 "Felicitaciones, [religious_champion.GetFirstName]..."
 celt_religious_olympics_champion:0 "[religious_champion.GetName] con un #G Más Alto#! @religious_icon! ¡#Y Se unió a tu Corte#!."
 
 me_albion_43_title:0 "Juegos Clásicos"
 me_albion_43_desc:0 "Este año, en los #Y [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#!, los eventos fueron bastante disputados pero nadie destacó entre la multitud - todos los atletas fueron poco impresionantes e inspiradores.\nMientras los juegos fueron disfrutados por la multitud en [ROOT.GetCountry.GetCapital.GetName], al final del día, la falta de un hombre o mujer por encima del otro hace que esta #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y]#! iteración de los Juegos Olímpicos no sea digna de recordar.\n\n[ROOT.GetCountry.GetRuler.GetName] coronó a un participante que se negó a unirse a tu corte después de eso, pidiendo regresar a casa en su lugar. La jubilación a veces es la mejor opción."
 me_albion.43.a:0 "Al menos un vencedor fue coronado"
 
 me_albion_44_title:0 "Juego Peligroso"
 me_albion_44_desc:0 "Este año, los #Y [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#! fueron considerados los peores en una generación, y la gente regresó a casa decepcionada con las festividades.\nHubo muchos eventos que no se llevaron a cabo este año debido a la falta de fondos, y los rumores sobre la corrupción de [ROOT.GetCountry.GetRuler.GetName] se culpaban como la probable razón del pobre espectáculo.\n\nSe coronó a un victorioso, pero fue abucheado por la multitud, y los soldados tuvieron que dispersar a las multitudes desordenadas que se negaban a irse.\nPuede ser mejor no celebrar los juegos si no tenemos los fondos para financiarlos."
 me_albion.44.a:0 "¿Qué he hecho? Creé un monstruo..."
 
 me_albion_45_title:0 "Los [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos"
 me_albion_45_desc:0 "Hoy es el día de organizar unos nuevos #Y Juegos Olímpicos#! en [ROOT.GetCountry.GetName], cuatro años después de la última oportunidad.\n[ROOT.GetCountry.GetRuler.GetName] decidirá ahora si los organizaremos y, si es así, quién pagará el costo."
 me_albion.45.a:0 "[ROOT.GetCountry.GetName] se hará cargo de todo y lo liberará."
 me_albion.45.b:0 "Dividiremos el costo entre nosotros y nuestra gente."
 me_albion.45.c:0 "¡Es un juego para [ROOT.GetCountry.GetAdjective] así que les pagarán el total!"
 me_albion.45.d:0 "Lamentablemente no podemos organizarlos."
 
 #me_albion_46_title:0 ""
 #me_albion_46_desc:0 ""
 #me_albion.46.a:0 ""
 
 me_albion_47_title:0 "Enfoque en el desarrollo"
 me_albion_47_desc:0 "La falta de infraestructura en [ROOT.GetCountry.GetName] se ha convertido en un problema que debe abordarse para responder a las expectativas de la gente de [ROOT.GetCountry.GetAdjective]. Para abordar esta situación, [ROOT.GetCountry.GetRuler.GetName] acaba de lanzar un plan de desarrollo que durará muchos años y nos mantendrá ocupados.\n\nCuando todo esté dicho y hecho, tendremos un país que estaremos orgullosos de mostrar al mundo: ¡una tierra de ciudades, carreteras, templos y academias!"
 me_albion.47.a:0 "Cada hombre y mujer a su cargo: pronto comenzará una nueva era"
 
 #me_albion_48_title:0 ""
 #me_albion_48_desc:0 ""
 #me_albion.48.a:0 ""
 
 me_albion_49_title:0 "Una Resistencia Contra el Progreso"
 me_albion_49_desc:0 "La modernización que se está llevando a cabo en [ROOT.GetCountry.GetName] y que ha sido implementada por nuestro gobernante [ROOT.GetCountry.GetRuler.GetName] no es del gusto de todos. [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('traditionnalist_leader').GetCharacter.GetName|0Y] y su familia han objetado airadamente los costos asociados con el proyecto, y son voces consistentemente ruidosas de oposición.\nRecientemente, [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('traditionnalist_leader').GetCharacter.GetName|0Y] nos dio un ultimátum; si no ralentizamos algunas de las reformas, corremos el riesgo de una #R Guerra Civil#!."
 me_albion.49.a:0 "Observaremos cuidadosamente a este [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('traditionnalist_leader').GetCharacter.GetName|0Y]"
 me_albion.49.b:0 "No podemos arriesgar el destino de [ROOT.GetCountry.GetName] ahora"
 AIO_Traditionnalist_civil_war_incomming:0 "[SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('traditionnalist_leader').GetCharacter.GetName|0Y] comenzará una #R Guerra Civil#! al completar la misión."
 AIO_Traditionnalist_lose_loyalty:0 "La familia [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('traditionnalist_leader').GetCharacter.GetFamily.GetName|0Y] perderá #R 45#! Lealtad"
 AIO_civil_war_prevent:0 "¡La #R Guerra Civil#! será #G evitada#!."
 
 me_albion_50_title:0 "Amanecer de una Nueva Era"
 me_albion_50_desc:0 "Tan consumido estaba [ROOT.GetCountry.GetRuler.GetName] con hacer el buen trabajo de gobernar sobre el pueblo de [ROOT.GetCountry.GetName] que [ROOT.GetCountry.GetRuler.GetSheHe] fue sorprendida por la proclamación de guerra civil por un noble descontento. Mientras las nubes de tormenta amenazaban [ROOT.GetCountry.GetCapital.GetName], fue entonces que [ROOT.GetCountry.GetRuler.GetFirstName] se dio cuenta de que una nueva era solo comenzaría cuando toda oposición hubiera sido completamente destruida; este momento estaba predestinado por los dioses, y la victoria estaba casi asegurada desde este momento."
 me_albion.50.a:0 "¡Destruiré a todos los que se opongan a mí!"
 me_albion.50.b:0 "¡Mi rival está muerto y su legado seguro que seguirá el mismo camino!"
 me_albion_50_tooltip:0 "$mission_completed_tooltip_1$ '#Y El amanecer de una nueva era#!' $mission_completed_tooltip_2$"
 
 me_albion_51_title:0 "Observando a un Rival"
 me_albion_51_desc:0 "Sin querer detenerse en la agitación política, [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('traditionnalist_leader').GetCharacter.GetName|0Y] continúa intentando reunir apoyo para derrocar a [ROOT.GetCountry.GetRuler.GetName], y se dice que mantiene relaciones con muchos miembros de la familia [family_leader.GetFamily.GetName] para obtener acceso a los recursos y la amistad de [family_leader.GetName].\n\nGracias a la vigilancia de los espías de [ROOT.GetCountry.GetRuler.GetFirstName] que reportan estos movimientos, [ROOT.GetCountry.GetRuler.GetSheHe] puede contrarrestar estos intentos de ganar amigos al repartir oro para comprar influencia.\n\n¿Pero es esta la elección correcta?"
 me_albion.51.a:0 "¡Primero compraré a la familia [family_leader.GetFamily.GetName]!"
 me_albion.51.b:0 "No me importa"
 AIO_family_bought_tt:0 "La familia [family_leader.GetFamily.GetName] ganará #G 20#! Lealtad."
 AIO_family_conviced_tt:0 "La familia [family_leader.GetFamily.GetName] perderá #R 25#! Lealtad."
 
 me_albion_52_title:0 "Paz y Modernización"
 me_albion_52_desc:0 "La oposición a [ROOT.GetCountry.GetRuler.GetName] ha terminado, y ninguna voz detendrá nuestro esfuerzo por agregar el toque final para crear la sociedad perfecta.\n\nAhora podemos recoger los frutos de nuestro esfuerzo."
 me_albion.52.a:0 "Roma nos espera"
 me_albion.52.b:0 "Nuestro conocimiento púnico es el mejor"
 me_albion.52.c:0 "Los celtas tendrán ciudades-estado como las griegas."
 AIO_unlock_roman_tradition:0 "¡Desbloquearemos la #Y tradición romana#!."
 AIO_unlock_punic_tradition:0 "¡Desbloquearemos la #Y tradición púnica#!."
 AIO_unlock_greek_city_tradition:0 "¡Desbloquearemos la #Y tradición de ciudad-estado griega#!."
 
 me_albion_53_title:0 "Edad Dorada"
 me_albion_53_desc:0 "A medida que la paz, la fuerza y la prosperidad han llegado para quedarse permanentemente en las tierras del pueblo [ROOT.GetCountry.GetAdjective], [ROOT.GetCountry.GetRuler.GetName] ha hecho una proclamación desde [ROOT.GetCountry.GetCapital.GetName] - [ROOT.GetCountry.GetName] ha entrado en una #E Era Dorada#! y estamos viviendo días que quizás nunca volveremos a ver.\n\nPara celebrar este logro, se ha propuesto que celebremos de alguna manera, pero ha sido imposible decidir exactamente cómo debe hacerse. [ROOT.GetCountry.GetRuler.GetFirstName] tendrá una decisión importante que tomar."
 me_albion.53.a:0 "El capital político siempre es importante tener"
 me_albion.53.b:0 "Nada de esto habría sido posible sin mí!"
 me_albion.53.c:0 "Todos deben unirse y celebrar juntos"
 me_albion.53.d:0 "La estabilidad dentro de nuestro reino es lo que deseo"
 me_albion.53.e:0 "¿Qué es más dorado que las monedas?"
 AIO_loyalty_of_everyone:0 "Todos los personajes ganarán #G 5#! Lealtad y perderán #G 10# Corrupción."
 me_albion_53_tooltip:0 "$mission_completed_tooltip_1$ '#Y Edad de Oro#!' $mission_completed_tooltip_2$"
 
 me_albion_54_title:0 "El Camino a Seguir"
 me_albion_54_desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha pasado muchas noches en vela durante las últimas semanas reflexionando sobre el futuro de [ROOT.GetCountry.GetName] - solo un tonto no podría ver cuánto han cambiado las cosas en nuestro país en los últimos años. Muchos extranjeros viven entre nuestro pueblo, y es muy común que nuestros compatriotas conozcan algunas palabras en un par de idiomas; ya no somos una sociedad aislada, sino una potencia importante, un centro de gravedad en nuestra esquina del mundo.\n\nLos pensamientos que han mantenido a [ROOT.GetCountry.GetRuler.GetFirstName] despierta involucran el futuro del pueblo [ROOT.GetCountry.GetAdjective]; ¿cuál será su legado? ¿Permanecerán como siempre han sido, o serán las fuerzas del cambio demasiado grandes e inevitables? Y si este es el caso, ¿es necesariamente algo malo? El cambio es crecimiento, después de todo, y nuestro pueblo necesitará adaptarse a un mundo en constante cambio si esperan sobrevivir.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] cree que [ROOT.GetCountry.GetRuler.GetSheHe] sabe la respuesta a estas preguntas."
 me_albion.54.a:0 "Nuestros orígenes no pueden cambiarse."
 me_albion.54.b:0 "Debemos emular las formas de los #E Griegos#!."
 me_albion.54.c:0 "¿Las formas de los #E Italianos#! son las más parecidas a las nuestras?"
 me_albion.54.d:0 "¿Los comerciantes de Cartago son nuestro ejemplo?"
 me_albion.54.e:0 "No somos un títere de una cultura extranjera, sino algo nuevo y más fuerte."
 me_albion_54_tooltip:0 "$mission_completed_tooltip_1$ '#Y El camino a seguir#!' $mission_completed_tooltip_2$"
 
 me_albion_55_title:0 "Invertir en Nuestra Tradición"
 me_albion_55_desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha proclamado un período de celebración, en el cual se llevarán a cabo festivales que honran a nuestros dioses, acompañados de banquetes y juegos. El [ROOT.GetCountry.GetRulerTitle] de [ROOT.GetCountry.GetName] ha jurado mantener las prácticas tradicionales de nuestros ancestros [ROOT.GetCountry.GetAdjective], especialmente ahora que nuestra influencia ha atraído a muchos extraños a nuestras costas. No podemos permitirnos descuidar la fuente de fuerza que nos trajo hasta este momento, cree [ROOT.GetCountry.GetRuler.GetFirstName], y ningún gasto es demasiado grande cuando se trata de honrar a nuestros antepasados."
 me_albion.55.a:0 "Nuestras tradiciones celtas nunca deben abandonarse"
 me_albion_55_tooltip:0 "$mission_completed_tooltip_1$ '#Y Invierta en nuestra tradición#!' $mission_completed_tooltip_2$"
 
 me_albion_56_title:0 "Ejércitos Celtas"
 me_albion_56_desc:0 "[ROOT.GetCountry.GetRuler.GetName] debe tomar ahora una decisión respecto a nuestras fuerzas militares - una tarea que al [ROOT.GetCountry.GetRulerTitle] le interesa mucho, pues [ROOT.GetCountry.GetRuler.GetSheHe] ha mostrado un gran interés en proteger la vida de los levies [ROOT.GetCountry.GetAdjective]. Gracias a nuestra fuerza militar y económica, podemos invertir en nuestro ejército; ¿quién debe recibir entrenamiento y nuevo equipo, nuestros carros o nuestros arqueros? Ambas opciones tienen sus méritos, y es una pregunta difícil que [ROOT.GetCountry.GetRuler.GetFirstName] debe responder."
 me_albion.56.a:0 "Nuestros audaces carros, al chocar contra el enemigo, deben volverse más poderosos."
 me_albion.56.b:0 "Fortalezcamos a nuestros arqueros, que atacan a distancia."
 me_albion_56_tooltip:0 "$mission_completed_tooltip_1$ '#Y Ejércitos celtas#!' $mission_completed_tooltip_2$"
 
 me_albion_57_title:0 "Tradiciones Orales"
 me_albion_57_desc:0 "Desde que nuestro pueblo tiene memoria, nuestros Ancianos Tribales han mantenido una tradición oral de transmitir nuestras historias y registros, cantando canciones y recitando largos poemas que alaban a nuestros ancestros y guerreros legendarios. Los mercaderes y comerciantes han traído pergaminos y textos griegos a nuestros mercados, y estamos familiarizados con los alfabetos y métodos de escritura de muchas naciones, pero hemos decidido seguir confiando en la forma tradicional de hacer las cosas.\n\nSin embargo, el contacto con los pueblos conquistados de nuestra nación nos ha mostrado que hay beneficios en escribir las cosas - si [ROOT.GetCountry.GetRuler.GetName] así lo desea, podríamos adoptar este método para ciertas cosas importantes."
 me_albion.57.a:0 "Lo que fue bueno para mis padres es suficientemente bueno para mí."
 me_albion.57.b:0 "Integremos algunas de las nuevas formas; ¿Cuál es el daño?"
 me_albion.57.c:0 "Modernizaremos todo y crearemos nuestro propio Alfabeto."
 me_albion_57_tooltip:0 "$mission_completed_tooltip_1$ '#Y Tradiciones orales#!' $mission_completed_tooltip_2$"
 AIO_oratory_tech:0 "Esta opción está disponible porque tenemos #Y Tecnología de Oratoria 8#! o más."
 
 me_albion_58_title:0 "Un Nuevo Alfabeto"
 me_albion_58_desc:0 "Después de unos meses muy ocupados, un grupo de los escribas más eruditos que viven en [ROOT.GetCountry.GetCapital.GetName] se acercó a [ROOT.GetCountry.GetRuler.GetName] con los resultados de su arduo trabajo; un nuevo alfabeto para que el pueblo [ROOT.GetCountry.GetAdjective] use. Para celebrar este admirable logro, el [ROOT.GetCountry.GetRulerTitle] ha convocado a enviar proclamaciones por todo [ROOT.GetCountry.GetName].\nPero, ¿cuál fue su inspiración?"
 me_albion.58.a:0 "A partir de este día, todos deben utilizar este nuevo script #Y celta#!"
 me_albion.58.b:0 "A partir de este día, todos deben utilizar esta nueva escritura #Y latina#!"
 me_albion.58.c:0 "A partir de este día, todos deben utilizar este nuevo script #Y púnico#!"
 me_albion.58.d:0 "A partir de este día, todos deben utilizar esta nueva escritura #Y griega#!"
 me_albion_58_tooltip:0 "$mission_completed_tooltip_1$ '#Y Un nuevo alfabeto#!' $mission_completed_tooltip_2$"
 
 me_albion_59_title:0 "La Arquitectura Extranjera"
 me_albion_59_desc:0 "La inversión en [ROOT.GetCountry.GetName] no pasó desapercibida entre la población, y en muchas ciudades comenzó a aparecer un nuevo tipo de estilo arquitectónico. Mientras que algunas personas expresaron abiertamente su descontento al ver estructuras extrañas erigidas en sus ciudades, otras no se preocuparon mientras sus vidas y medios de subsistencia permanecieran seguros."
 me_albion.59.a:0 "Los acueductos se elevarán."
 me_albion.59.b:0 "Necesitamos más ciudades costeras."
 me_albion.59.c:0 "¡Más paredes!"
 
 me_albion_60_title:0 "Elefantes en [ROOT.GetCountry.GetName]"
 me_albion_60_desc:0 "Hace mucho tiempo, animales maravillosos como los elefantes @elephants! eran desconocidos en el mundo celta.\nPero después del viaje organizado por [ROOT.GetCountry.GetRuler.GetName], nuestra visión del mundo, con sus muchas maravillas, cambió completamente. Con elefantes a la mano, ahora podemos adoptar la estrategia de Cartago.\n\n¿Deberíamos aprender a usar los elefantes en batalla? ¿O tal vez deberíamos mejorar nuestras tácticas entrenando nuestras fuerzas terrestres y militares juntas, con todas las unidades desde el elefante hasta el liburnio luchando como una sola?"
 me_albion.60.a:0 "¡Vienen los elefantes!"
 me_albion.60.b:0 "¡Combinaremos todo y nuestras fuerzas serán invencibles!"
 
 me_albion_61_title:0 "Invictus Britannicus"
 me_albion_61_desc:0 "Nuestra reciente fascinación por Roma y sus ejércitos nos ha llevado a crear nuestra propia fuerza romana, una que será equivalente a cualquier levantada cerca de la Ciudad de las Siete Colinas junto al Tíber. [ROOT.GetCountry.GetRuler.GetName] ha hecho maravillas para lograr esto, pero aún queda una pregunta por responder.\n\nLos romanos son famosos por sus legiones, pero también por su ingeniería militar, que muchos afirman es la mejor del mundo. ¿Qué decidirá [ROOT.GetCountry.GetRuler.GetName] priorizar para nuestras propias formas?"
 me_albion.61.a:0 "¡Nuestros ejércitos serán aclamados como verdaderas legiones!"
 me_albion.61.b:0 "Tráenos a sus matemáticos y soldados."
 
 me_albion_62_title:0 "El Nuevo Escudo de Plata"
 me_albion_62_desc:0 "Alejandro fue el mejor comandante del mundo, conquistando Persia, Egipto y una parte de la India en una ola de gloria. Pero no habría logrado sus hazañas sin el entrenamiento y técnica excepcionales de sus hombres, algo que incluso el orgulloso guerrero sabía en su corazón.\n\n[ROOT.GetCountry.GetRuler.GetName], al haber oído hablar de los logros de Alejandro y desear superar al macedonio en gloria, ha decidido crear una fuerza que será conocida en todo el mundo como la mejor. Pero ¿cuál debería ser la prioridad principal de los ejércitos [ROOT.GetCountry.GetAdjective]? ¿Dominar la lanza o crear un nuevo Bucéfalo para el ejército?"
 me_albion.62.a:0 "Nuestros hombres serán verdaderos Escudos de Plata."
 me_albion.62.b:0 "Alejandro amaba a su caballo más que a nada."
 
 me_albion_63_title:0 "Manteniendo Nuestras Raíces"
 me_albion_63_desc:0 "Un período ocupado de inversión y crecimiento ha barrido [ROOT.GetCountry.GetName], y uno apenas puede viajar a una ciudad en la isla sin ver las evidentes señales de construcción; grandes grúas que se elevan sobre las calles, pilas de ladrillos custodiadas por soldados y un flujo constante de animales de carga llevando suministros por doquier.\n\nA pesar de que claramente se respira un cambio en el aire, el pueblo ha prometido recordar sus formas tradicionales, prometiéndose a sí mismos que los efectos de la civilización no cambiarán el núcleo de quienes son. Y por cada palacio o jardín exquisito que se construyó, también se erigió un templo o un santuario; los dioses deben mantener su lugar en la sociedad [ROOT.GetCountry.GetAdjective]."
 me_albion.63.a:0 "¡No podemos abandonar las virtudes de nuestros antepasados!"
 me_albion_63_tooltip:0 "$mission_completed_tooltip_1$ '#Y Manteniendo nuestras raíces#!' $mission_completed_tooltip_2$"
 
 me_albion_64_title:0 "Unificar Las Tradiciones"
 me_albion_64_desc:0 "Para garantizar que nuestras tradiciones se salvaguarden en los años venideros, [ROOT.GetCountry.GetRuler.GetName] ha decidido invertir una suma real para que esto suceda. Los [ROOT.GetCountry.GetRuler.GetHerHis] asesores han tenido dos opiniones; a algunos les gustaría que [ROOT.GetCountry.GetRulerTitle] se centrara en el ejército, mientras que otros creen que la gente común de [ROOT.GetCountry.GetName] debería ser la receptora de estos fondos."
 me_albion.64.a:0 "Nuestro ejército es el protector de nuestro modo de vida"
 me_albion.64.b:0 "El pueblo mismo es responsable de mantener la tradición"
 me_albion_64_tooltip:0 "$mission_completed_tooltip_1$ '#Y Unificar las tradiciones#!' $mission_completed_tooltip_2$"
 
 me_albion_65_title:0 "Nuevos Burócratas"
 me_albion_65_desc:0 "A lo largo de los años, se han construido muchas pequeñas bibliotecas y oficinas en [ROOT.GetCountry.GetCapital.GetName] para acomodar a los numerosos escribas y magistrados que trabajan en la capital [ROOT.GetCountry.GetAdjective], pero las cosas han cambiado ciertamente dentro de [ROOT.GetCountry.GetName]. Debido a nuestro tamaño creciente, ahora hay muchos más edificios dedicados a la administración y los asuntos cívicos en nuestras ciudades, y muchos de nuestros ministros tienen múltiples distritos de los que son responsables.\n\nAlgunos de estos funcionarios han pedido a [ROOT.GetCountry.GetRuler.GetName] que se les permita vivir en sus ciudades natales, alegando que estarán mejor capacitados para manejar nuestros asuntos si están en las provincias, mientras que otros han solicitado que se les proporcione alojamiento dentro de la capital."
 me_albion.65.a:0 "Envía a los burócratas a través de las provincias"
 me_albion.65.b:0 "Concentra a nuestros ministros en [ROOT.GetCountry.GetCapital.GetName]"
 me_albion_65_tooltip:0 "$mission_completed_tooltip_1$ '#Y Nuevos burócratas#!' $mission_completed_tooltip_2$"
 
 me_albion_66_title:0 "Nueva Nobleza"
 me_albion_66_desc:0 "[ROOT.GetCountry.GetName] es una tierra llena de villas y residencias de las nuevas clases nobles, muchos de los cuales eran las élites de los países conquistados anexados por el [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName]. No es ningún secreto que [ROOT.GetCountry.GetRuler.GetFirstName] es amigo de las clases adineradas, y muchos de los nobles que viven en [ROOT.GetCountry.GetCapital.GetName] creen que [ROOT.GetCountry.GetRuler.GetSheHe] ha enriquecido personalmente a muchos de ellos. Debido a esto, las élites han ofrecido su apoyo a [ROOT.GetCountry.GetRuler.GetFirstName]."
 me_albion.66.a:0 "El dinero siempre es preferido, como dicen"
 me_albion.66.b:0 "Preferiría ganar experiencia en lugar de monedas - ¿qué podemos aprender?"
 me_albion.66.c:0 "Esto debería ser para mí."
 me_albion_66_tooltip:0 "$mission_completed_tooltip_1$ '#Y Nueva nobleza#!' $mission_completed_tooltip_2$"
 
 me_albion_67_title:0 "Centro Comercial"
 me_albion_67_desc:0 "Como un arroyo burbujeante, corrientes de ingresos están fluyendo a las arcas de los recaudadores de impuestos que viven en la provincia de [ROOT.GetCountry.GetCapital.GetArea.GetName] - nunca antes hemos recibido tanto dinero. Se ha sugerido a [ROOT.GetCountry.GetRuler.GetName] que deberíamos tomar estas sumas récord y hacer algo importante con ellas."
 me_albion.67.a:0 "Tomaremos el dinero ahora, ya que lo necesitamos"
 me_albion.67.b:0 "Hagamos una inversión a largo plazo con este viento de fortuna"
 me_albion_67_tooltip:0 "$mission_completed_tooltip_1$ '#Y Centro comercial#!' $mission_completed_tooltip_2$"
 
 me_albion_68_title:0 "Destino Manifiesto"
 me_albion_68_desc:0 "Después de incontables años de guerra y paz y muchas temporadas de festines y hambrunas, muchos aprendizajes fueron adquiridos por nuestros parientes, quienes sacaron lo mejor de cada situación que enfrentaron y perseveraron cuando todos los demás hubieran fracasado. El pueblo de [ROOT.GetCountry.GetName] ha perseguido su destino deseado y lo ha capturado con ambas manos, y ahora el mundo entero conoce nuestros actos y nuestros logros.\n\nAunque el [ROOT.GetCountry.GetRulerTitle] humildemente niega que [ROOT.GetCountry.GetRuler.GetSheHe] sea la principal razón de nuestros éxitos acumulados, el pueblo que vive en [ROOT.GetCountry.GetCapital.GetName] no puede ser convencido de otra manera y canta las alabanzas de [ROOT.GetCountry.GetRuler.GetFirstName] a todos los que escuchen."
 me_albion.68.a:0 "Me siento honrado de recibir el amor del hombre común"
 me_albion_68_tooltip:0 "$mission_completed_tooltip_1$ '#Y Destino manifiesto#!' $mission_completed_tooltip_2$"
 
 me_albion_69_title:0 "Capital Celestial"
 me_albion_69_desc:0 "[ROOT.GetCountry.GetCapital.GetName] es, con diferencia, la ciudad más desarrollada del mundo, y los esplendores de #E Alejandría#!, #E Roma#! o #E Cartago#! no pueden competir con el lugar que llamamos hogar. Todo el tiempo dedicado por [ROOT.GetCountry.GetRuler.GetName] y su familia será recordado durante siglos. Todos los ciudadanos de [ROOT.GetCountry.GetCapital.GetName] saludan al [ROOT.GetCountry.GetRulerTitle] y prepararon una ceremonia especial para él."
 me_albion.69.a:0 "Festín, bebida y amor, compatriota mío."
 
 me_albion_70_title:0 "Trabajadores Belgas"
 me_albion_70_desc:0 "La creciente economía de [ROOT.GetCountry.GetName] requiere legiones de trabajadores y esclavos para funcionar normalmente y, afortunadamente para nosotros, hay muchos esclavos #E belgas#! con espaldas fuertes y mentes simples viviendo en nuestras ciudades. [ROOT.GetCountry.GetRuler.GetName], lleno de amargos recuerdos de la conquista de ultramar, ha prometido dar a los belgas el destino que se merecen."
 me_albion.70.a:0 "¡A las minas con ustedes!"
 
 me_albion_71_title:0 "Comercio Armoricano"
 me_albion_71_desc:0 "No hace mucho, Amorica era un punto de apoyo para el comercio con el continente, aunque las tribus locales nos cobraban una buena suma por actuar como intermediarios. Esta situación no era ideal pero era tolerable, ya que las conexiones comerciales del continente valían el costo por múltiples razones.\n\nDesafortunadamente para nosotros, una combinación mortal de inestabilidad política y largos inviernos detuvo el comercio, y muchas rutas comerciales antiguas fueron abandonadas. Pero esto cambiará, ya que [ROOT.GetCountry.GetRuler.GetName] ha prometido restaurarlas para el bien de [ROOT.GetCountry.GetName] y sus habitantes."
 me_albion.71.a:0 "Los mercaderes y los impuestos fluirán de nuevo."
 
 me_albion_72_title:0 "Sumisión Aquitana"
 me_albion_72_desc:0 "Después de nuestra reciente conquista al norte de la #E Galia#!, nuestro ejército triunfante marchó hacia Aquitania, ansioso por aprovechar la ventaja. En el camino, [ROOT.GetCountry.GetRuler.GetName] recibió una solicitud para reunirse con el jefe de Aquitania y la aristocracia local.\n\n'Estamos listos para rendirnos, siempre y cuando protejas la tierra de la ira de tu ejército.' Aceptar su sumisión y abstenerse de saquear es una estrategia inteligente, pero impopular entre las bases. Podríamos absorber a sus soldados en nuestras propias levas, pero nuestros soldados están desesperados por tener la oportunidad de enriquecerse personalmente y están implorando la oportunidad de saquear sus asentamientos."
 me_albion.72.a:0 "Aceptar su capitulación"
 me_albion.72.b:0 "Necesitamos más hombres en nuestro ejército"
 me_albion.72.c:0 "¡Nadie impedirá al ejército [ROOT.GetCountry.GetAdjective] su derecho!"
 
 me_albion_73_title:0 "Últimos Pasos de la Conquista"
 me_albion_73_desc:0 "Marchar dentro de la Galia Central fue una tarea fácil, pero lograr la sumisión total de las tribus locales restantes, numerosas pero débiles, es mucho más difícil.\n\nY ahora, la elección. Podemos saquear las escasas posesiones de estas tribus como señal de victoria de nuestro ejército, pero también podemos perdonar a los lugareños y ver si sus mejores guerreros quieren luchar junto a nosotros.\n\nTodos adoran el dinero y no hay nada que no se pueda lograr con su brillo."
 me_albion.73.a:0 "La victoria a menudo rima con saqueo - que los hombres se diviertan"
 me_albion.73.b:0 "¿Talento local y caballos? ¿Por qué no?"
 me_albion.73.c:0 "¡Dinero, dinero, dinero!"
 
 #me_albion_74_title:0 ""
 #me_albion_74_desc:0 ""
 #me_albion.74.a:0 ""
 
 me_albion_75_title:0 "Puertos Mediterráneos"
 me_albion_75_desc:0 "Hace mucho tiempo, el sur de la Galia era conocido por nuestro pueblo como el punto de entrada al Mediterráneo y a Italia. Pero ahora, los colonos helénicos y los ejércitos de la República Itálica han usurpado estas tierras a la influencia celta.\n\nAhora que [ROOT.GetCountry.GetName] ha recuperado estas tierras, ¡recrearemos los antiguos puertos y rutas comerciales navales que los celtas tenían hace mucho tiempo!"
 me_albion.75.a:0 "El Mar será nuestro."
 
 me_albion_76_title:0 "Caballos de Bremenium"
 me_albion_76_desc:0 "Cuando se ofrece la opción de montura, la mayoría de los guerreros que viven en [ROOT.GetCountry.GetName] solicitarán un caballo @horses! de la región de [GetProvince('(int32)2090').GetName], pues la temible reputación de los corceles del norte ha capturado la imaginación de nuestro pueblo.\n\nLos caballos de Bremenium miden al menos tres palmos más que cualquier caballo de tiro importado del continente, y nuestros animales no temen al estrépito de la batalla - todas cualidades importantes que se requieren para la caballería [ROOT.GetCountry.GetAdjective]."
 me_albion.76.a:0 "Mi caballo personal fue tomado de una granja cerca de Bremenium, en realidad"
 me_albion_76_tooltip:0 "$mission_completed_tooltip_1$ '#Y Caballos de Bremenium#!' $mission_completed_tooltip_2$"
 
 me_albion_77_title:0 "Partidas de Caza"
 me_albion_77_desc:0 "Aunque las tierras de cultivo y las pesquerías de [ROOT.GetCountry.GetName] proporcionan variedad más que suficiente para que nuestros [ROOT.GetCountry.GetAdjective] miembros de la tribu tengan una dieta sustancial y nutritiva, a nuestros guerreros les gusta llevar sus arcos y flechas al bosque y buscar ciervos cuando tienen algo de tiempo libre para ellos. Hay pocos placeres mayores en la vida que cazar un ciervo enorme con tus hermanos y asarlo en el campo, y [ROOT.GetCountry.GetRuler.GetName] a menudo te encuentras [ROOT.GetCountry.GetRuler.GetHerHim] soñando despierto con acechar a un ciervo enorme en las profundidades del país."
 me_albion.77.a:0 "¡Espero el día en que pueda unirme a ustedes en la caza!"
 me_albion_77_tooltip:0 "$mission_completed_tooltip_1$ '#Y Partidas de caza#!' $mission_completed_tooltip_2$"
 
 me_albion_78_title:0 "Agricultura en Auge"
 me_albion_78_desc:0 "Las Islas Británicas son lugares pobres en cuanto a agricultura a gran escala, pues no ven tanto sol como lugares como Italia o Galia. Los inviernos son duros, dejando a muchas personas morir de hambre o frío cada año. [ROOT.GetCountry.GetRuler.GetName] decidió que tales tragedias eran evitables, y tras un período de inversión, nuestras tierras agrícolas se expandieron para sustentar a la población [ROOT.GetCountry.GetAdjective]. ¡Nadie morirá de hambre bajo el gobierno de [ROOT.GetCountry.GetRuler.GetFirstName]!"
 me_albion.78.a:0 "¡Pan para todos, o nada!"
 
 me_albion_79_title:0 "Colonia Próspera"
 me_albion_79_desc:0 "Por todos los informes, nuestra colonia está prosperando de maneras inesperadas, y todo gracias al liderazgo y visión del incomparable [ROOT.GetCountry.GetRuler.GetName]. Los locales que viven en el extranjero han domesticado la tierra, construyendo granjas y asentamientos que crecen como flores en un campo. Cada vez más de nuestro pueblo está intrigado por las posibilidades de viajar a las colonias, y muchos están haciendo el viaje a través del traicionero mar para comenzar una nueva vida."
 me_albion.79.a:0 "Me alegra saber que mi gente está contenta"
 me_albion_79_tooltip:0 "$mission_completed_tooltip_1$ '#Y Colonia próspera#!' $mission_completed_tooltip_2$"
 
 me_albion_80_title:0 "El Elefante"
 me_albion_80_desc:0 "Desde el momento en que nuestro capitán vio al elefante bebé, se podría haber escrito una nueva historia de amor y sueños, y ningún precio habría sido demasiado alto.\n\nEl comerciante que nos vendió el elefante prometió traer más para nosotros, ¡y construiremos campamentos para ellos donde puedan ser entrenados para circos o campos de batalla! Nuestro Consejo ha sugerido varias provincias que serían lugares prometedores para los elefantes, permitiendo a [ROOT.GetCountry.GetRuler.GetName] el honor de elegir dónde vivirán estos ilustres animales."
 me_albion.80.a:0 "Será nuestra capital [ROOT.GetCountry.GetCapital.GetName] la que lo recibirá."
 me_albion.80.b:0 "Él será alimentado con el mejor grano de [prov_1.GetName]."
 me_albion.80.c:0 "Las fértiles llanuras de [prov_2.GetName] serán suficientes."
 me_albion.80.d:0 "[prov_3.GetName] parece interesante."
 me_albion.80.e:0 "Los elefantes viven en bosques y selvas. Necesitaremos [prov_4.GetName]."
 
 me_albion_81_title:0 "Los Elefantes"
 me_albion_81_desc:0 "El comerciante cartaginés pidió a [ROOT.GetCountry.GetRuler.GetName] que lo siguiera a su barco capital, pues había muchos establos y jaulas llenos de animales exóticos a bordo. 'Aquí está una familia completa de elefantes @elephants!, y por un precio modesto son suyos.'\n\nLa pregunta ahora es, si compramos esta familia, ¿cuál sería el mejor lugar para que se queden? Podría ser una buena oportunidad para la economía local a largo plazo, ya que muchos de nuestros compatriotas querrán ver estas criaturas por sí mismos."
 me_albion.81.a:0 "Será nuestra capital [ROOT.GetCountry.GetCapital.GetName] la que los recibirá."
 me_albion.81.b:0 "Serán alimentados con el mejor grano de [prov_1.GetName]."
 me_albion.81.c:0 "Las fértiles llanuras de [prov_2.GetName] serán suficientes."
 me_albion.81.d:0 "[prov_3.GetName] parece interesante."
 me_albion.81.e:0 "Los elefantes viven en bosques y selvas; necesitaremos [prov_4.GetName]."
 me_albion.81.f:0 "Por ahora prefiero no comprometerme; muéstrame algo más."
 
 me_albion_82_title:0 "Los Tintes"
 me_albion_82_desc:0 "Durante siglos, los tintes @dye! se han utilizado para crear patrones y colores más complejos para la ropa, y se usan principalmente para reconocer las diferentes clases que componen la sociedad.\n\nEl comerciante metió la mano en un saco pesado y sacó un puñado de granos delicados que dejó caer entre sus dedos. 'Estas son semillas. Las plantas que producen los mejores tintes crecen principalmente en áreas cálidas con mucha agua. Personalmente seleccioné una variedad que podría crecer en su fría y lluviosa isla.'\n\nConsiderando lo que ha dicho el comerciante, su Consejo ofrece cuatro ubicaciones que parecen ser buenos lugares para producir tintes."
 me_albion.82.a:0 "La exposición al sol es la mejor en nuestras tierras agrícolas en [prov_1.GetName]."
 me_albion.82.b:0 "Las fértiles llanuras de [prov_2.GetName] serán suficientes."
 me_albion.82.c:0 "[prov_3.GetName] tiene acceso a una buena cantidad de agua."
 me_albion.82.d:0 "[prov_4.GetName] tiene el espacio justo para lo que necesitamos."
 me_albion.82.e:0 "Prefiero no comprar semillas de tinte."
 
 me_albion_83_title:0 "Olla de Miel"
 me_albion_83_desc:0 "La miel no es desconocida en [ROOT.GetCountry.GetName], pero no ha sido explotada por nuestro pueblo y es difícil de obtener sin la ayuda de muchas manos. El comerciante trajo consigo algunas abejas, con colmenas de piedra y los materiales necesarios para explotarlas.\n\nEl comerciante hizo un gesto hacia un esclavo, quien rompió una gran colmena con las manos, enviando un chorro de oro fundido hacia el suelo. Capturando un poco de esta miel con un fragmento de cerámica, el comerciante se la entregó a [ROOT.GetCountry.GetRuler.GetName] con una sonrisa y le pidió que la probara.\n\nEl comerciante se rió cuando los ojos de [ROOT.GetCountry.GetRuler.GetFirstName] se abrieron unos segundos después. 'Imagina lo que podrías cocinar con eso. Los rumores dicen que es una forma de alcanzar la juventud eterna, y después de probarlo por mí mismo, lo creo.'\n\nDespués de probar esta miel, [ROOT.GetCountry.GetRuler.GetFirstName] está completamente convencido de la idea, y cuatro asesores han propuesto cuatro provincias diferentes para nosotros."
 me_albion.83.a:0 "Las abejas producirán bajo la tierra del sol de [prov_1.GetName]."
 me_albion.83.b:0 "Las fértiles llanuras de [prov_2.GetName] serán suficientes."
 me_albion.83.c:0 "A las abejas les encantará [prov_3.GetName]."
 me_albion.83.d:0 "Deberíamos probar la zona de [prov_4.GetName] como candidata."
 me_albion.83.e:0 "Las abejas tendrán que esperar."
 
 me_albion_84_title:0 "El Comerciante Cartaginés"
 me_albion_84_desc:0 "Después de tres largos meses en el mar, el comerciante cartaginés finalmente llegó a las costas de [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetRuler.GetName] bajó al puerto, acompañado de cortesanas y ministros, para dar la bienvenida al estimado viajero, quien no perdió tiempo en bromas sino que se lanzó inmediatamente a un discurso de venta.\n\n'Puedo ofrecerle muchos productos exóticos que podrían instalarse en su isla. Puedes comprar mis elefantes @elephants! y construirles campamentos, entrenándolos en el arte de la guerra. ¿O tal vez prefieres construir talleres para la producción de tinte @dye!? Pero no se pueden comer elefantes ni tintes, y tengo conmigo abejas que producen la mejor miel del mundo. También tengo muchos tipos de bienes que puedes comprar para tus nobles; la última moda de las cortes de los Emperadores y Emperatrices, así como joyas y obras de arte raras para deslumbrar la vista y deleitar la mente.'\n\nInteresado por todo, no puedes comprarlo todo a la vez debido a su alto precio. ¡Además, no sería prudente transformar todas sus tierras en un zoológico lleno de elefantes y abejas!\n\nEs por eso que, para el éxito de la instalación de estos nuevos productos, limitaremos la producción de cada uno a #G 2 territorios#! en nuestra isla; A la gente no le gustaría que perturbamos demasiado sus tierras tradicionales.\n\nAnte tentaciones deslumbrantes, [ROOT.GetCountry.GetRuler.GetFirstName] tendrá que decidir qué comprar antes de la partida del comerciante."
 me_albion.84.a:0 "Deberíamos ver los elefantes."
 me_albion.84.b:0 "Los tintes serán muy importantes para una sociedad moderna."
 me_albion.84.c:0 "¿Abejas, eh? Podríamos crear una historia con eso."
 me_albion.84.d:0 "Los bienes clásicos serán suficientes para la alta sociedad."
 me_albion.84.e:0 "Lo siento por la molestia. No estoy listo para comprar algo."
 AIO_reset_import_cooldown:0 "¡Tendrás que esperar #Y 5 Years#! para el regreso del comerciante."
 
 celtic_albion_heritage:0 "Herencia Celta de Albion"
 celtic_albion_heritage_desc:0 "Durante siglos, nuestra isla estuvo en desorden, con nuevas tecnologías y ceremonias religiosas de la Galia o Italia interfiriendo con nuestra forma de vida tradicional. Sin embargo, ha llegado el momento de asumir nuestra identidad y unir la nación bajo dioses como Brigantia, Caturix o Erecura. ¡Cualquier extranjero fuera de nuestra religión debe ser visto como una amenaza potencial!"
 hellenic_albion_heritage:0 "Herencia Celta Helenística"
 hellenic_albion_heritage_desc:0 "Alejandro fue un tirano y un conquistador, pero también fue el hombre más grande que los dioses hayan creado: una paradoja para todos los tiempos. Con nuestra modernización, estamos más cerca que nunca de lograr un país celta-helénico donde los soldados y los ciudadanos querrán vivir. Las antiguas ceremonias de nuestro pueblo seguirán siendo locales y no afectarán nuestro sistema político."
 italic_albion_heritage:0 "Herencia Celta Romana"
 italic_albion_heritage_desc:0 "Roma es eterna e invencible. ¡Es con su fuerza que mejoraremos nuestro país y conseguiremos los ejércitos más poderosos del mundo!\nCon este nuevo conocimiento, nuestros generales llevarán a nuestro pueblo a la victoria eterna: ¡Invictus Albion!"
 punic_albion_heritage:0 "Herencia Celta Púnica"
 punic_albion_heritage_desc:0 "La República más antigua y más grande que conocemos tiene un nombre que es sinónimo de riqueza y prosperidad. Gracias a nuestros esfuerzos por emular a los púnicos, el mar y el comercio ya no nos ocultan ningún secreto. Nuestro futuro ahora será radiante con este sistema político importado que resistirá la prueba del tiempo."
 
 #modifiers
 
 albion_mod_2:0 "Motivación Política"
 desc_albion_mod_2:0 "Estamos dedicados a la vida cívica de nuestro país, incluso a expensas de la religión."
 albion_mod_3:0 "Un Retorno a las Viejas Costumbres"
 desc_albion_mod_3:0 "Hemos decidido regresar a los modos de nuestros antepasados en una firme reprimenda a la influencia corruptora de la civilización."
 albion_mod_4:0 "Esfuerzos de Reforma Legal"
 desc_albion_mod_4:0 "Estamos enfocando nuestros esfuerzos internos en reformar nuestro sistema legal."
 albion_mod_5:0 "Gran República de Albion"
 desc_albion_mod_5:0 "Nuestra próspera República, una tierra de ley y honor, es respetada por todas partes como un lugar de vida virtuosa."
 albion_mod_6:0 "Tierra Próspera"
 desc_albion_mod_6:0 "Nuestro pueblo y campo están prosperando, pues los dioses nos han bendecido."
 albion_mod_7:0 "Espadas de los Jefes"
 desc_albion_mod_7:0 "Las clases nobles que viven dentro de nuestro reino han brindado su apoyo a nosotros."
 albion_mod_8:0 "Una Isla de Ciudades"
 desc_albion_mod_8:0 "Hemos decidido que debemos construir ciudades en toda nuestra posesión."
 albion_mod_9:0 "Tiempos de Prosperidad"
 desc_albion_mod_9:0 "Nuestro país está disfrutando de una era muy próspera, todo gracias a nuestras políticas comerciales y económicas."
 albion_mod_10:0 "Barcos Protegidos"
 desc_albion_mod_10:0 "Hemos tomado medidas para fortalecer la defensa de nuestros barcos."
 albion_mod_11:0 "Almirantes de Élite"
 desc_albion_mod_11:0 "Nuestros almirantes son excepcionales, especialmente en comparación con los de nuestros pares."
 albion_mod_12:0 "Murallas de Madera"
 desc_albion_mod_12:0 "Nuestra doctrina de defender nuestro hogar no se basa en tierra, sino en el mar. Necesitamos reclutar más marineros a expensas de nuestro ejército."
 albion_mod_13:0 "Puerto Hiberniano"
 desc_albion_mod_13:0 "Esta ciudad no solo es la sede provincial de poder, sino también un importante puerto militar. Muchos de los mejores constructores de barcos que viven en nuestro país tienen su hogar aquí."
 albion_mod_14:0 "La Fortaleza del Norte"
 desc_albion_mod_14:0 "La importancia de esta fortaleza eclipsa a todas las demás en el norte, pues sus defensas son casi inigualables y su guarnición está llena de guerreros experimentados."
 albion_mod_15:0 "La Perla del Sur"
 desc_albion_mod_15:0 "Esta capital regional es conocida como un lugar de romance y peligro, donde uno tiene las mismas probabilidades de enamorarse o perder la vida: la ciudad de aventuras conocida en todas partes como la 'Perla del Sur'."
 albion_mod_16:0 "Capital Expansiva"
 desc_albion_mod_16:0 "Hemos hecho maravillas para expandir la infraestructura de nuestra capital."
 albion_mod_17:0 "Ciudad de Nobles"
 desc_albion_mod_17:0 "Esta ciudad está llena de villas y residencias de las élites, que se han agolpado en masa a la ciudad."
 albion_mod_18:0 "Ciudades de Albion"
 desc_albion_mod_18:0 "Nuestros ingenieros están trabajando más duro y más rápido que nunca mientras se apresuran a construir nuevas ciudades en nuestros territorios."
 albion_mod_19:0 "Destino Manifiesto"
 desc_albion_mod_19:0 "Nuestro pueblo ha tomado su destino con ambas manos, negándose a dejar pasar la oportunidad: el futuro que deseamos no nos será dado como un regalo, sino que debe ser forjado."
 albion_mod_20:0 "Almirante Despreciado"
 desc_albion_mod_20:0 "Nuestra voluntad de terminar con la doctrina de las Murallas de Madera no fue apreciada en nuestra marina."
 albion_mod_21:0 "Apoyo de los Almirantes"
 desc_albion_mod_21:0 "Nuestra Muralla de Madera es una prueba de nuestro apoyo a ellos y, a cambio, ellos apoyan nuestros objetivos."
 albion_mod_22:0 "Una Era Propicia"
 desc_albion_mod_22:0 "Está comenzando una era dorada para nuestro pueblo, y los dioses nos revelan que aún quedan por lograr cosas mayores."
 albion_mod_23:0 "Infraestructura Mejorada"
 desc_albion_mod_23:0 "La infraestructura de nuestras ciudades y carreteras ha aumentado considerablemente desde lo que era antes."
 albion_mod_24:0 "Hierro de Albion"
 desc_albion_mod_24:0 "Gracias a los casi interminables suministros de hierro que hemos acumulado, nuestras levies y legiones estarán equipadas con el mejor equipo militar que se pueda fabricar."
 albion_mod_25:0 "Campos de Albion"
 desc_albion_mod_25:0 "Los campos y granjas de la isla que llamamos hogar son productivos lo suficiente como para alimentar a las miles de personas que viven en nuestras ciudades."
 albion_mod_26:0 "Migrantes Bienvenidos"
 desc_albion_mod_26:0 "Nuestra capital está lista para recibir migrantes de todo el mundo."
 albion_mod_27:0 "Restricción de Migrantes"
 desc_albion_mod_27:0 "Para preservar la cultura y las tradiciones, reduciremos los migrantes entrantes a nuestra capital y ayudaremos a los otros a asimilarse."
 albion_mod_28:0 "Sede de los Druidas"
 desc_albion_mod_28:0 "Nuestra capital está gestionada por nuestros druidas en detrimento de nuestros ciudadanos élite."
 albion_mod_29:0 "Justicia Ciudadana"
 desc_albion_mod_29:0 "Nuestra justicia cuenta con jueces profesionales. Agradando a la aristocracia local pero preocupando a los druidas locales."
 albion_mod_30:0 "Gran Mercado"
 desc_albion_mod_30:0 "El mercado que se encuentra dentro de esta ciudad es famoso por su lujo."
 albion_mod_31:0 "Reclamando el Mar Abierto"
 desc_albion_mod_31:0 "Los audaces marineros de Albion navegarán a través del Océano a cualquier lugar que elijan."
 albion_mod_32:0 "Colonia Próspera"
 desc_albion_mod_32:0 "Nuestra colonia está prosperando y creciendo, capaz de mantenerse por sí misma."
 albion_mod_33:0 "Colonia Floreciente"
 desc_albion_mod_33:0 "Esta colonia está prosperando en un país duro, todo gracias a los esfuerzos de aquellos en casa."
 albion_mod_34:0 "Sabiduría Romana"
 desc_albion_mod_34:0 "Hemos estudiado las cosas en las que los romanos sobresalen, y su conocimiento militar y cívico se ha convertido en el nuestro."
 albion_mod_35:0 "Botín Romano"
 desc_albion_mod_35:0 "Hemos demostrado a los orgullosos romanos que somos guerreros superiores, y ellos han admitido a regañadientes que nuestras armadas son de excelente calidad - un verdadero oponente, y uno que temen."
 albion_mod_36:0 "Dos Reinos, Un Imperio"
 desc_albion_mod_36:0 "Nuestro poderoso imperio abarca no solo las islas británicas, sino también extensas posesiones en la Galia y el continente europeo."
 albion_mod_37:0 "Una Capital Conectada"
 desc_albion_mod_37:0 "Esta ciudad tiene conexiones extensas con el comercio en tierras extranjeras, y muchos mercaderes y mercados se pueden encontrar dentro de sus murallas."
 albion_mod_38:0 "Una Capital Reimaginada"
 desc_albion_mod_38:0 "Hemos permitido que las mentes arquitectónicas más grandes que viven en nuestro país reorganicen y remodelen nuestra ciudad capital."
 albion_mod_39:0 "Aserraderos Bien Abastecidos"
 desc_albion_mod_39:0 "Tenemos abundantes suministros de madera a mano, lo cual es una bendición para nuestros astilleros y constructores de barcos."
 albion_mod_40:0 "Leñadores de Gangania"
 desc_albion_mod_40:0 "Los leñadores que trabajan en el asentamiento de Gangania son expertos en derribar árboles, con muchos de los trabajadores más robustos de toda la tierra viviendo a orillas del Río Sionna."
 albion_mod_41:0 "Caballos de Bremenium"
 desc_albion_mod_41:0 "Los caballos de guerra que se crían en Bremenium son algunos de los animales más feroces de todo el país: estas bestias anhelan la guerra y la batalla tanto como nuestras levies."
 albion_mod_42:0 "Yeguadas de Bremenium"
 desc_albion_mod_42:0 "Nuestras autoridades han centrado sus esfuerzos en construir yeguadas en todo el asentamiento de Bremenium con el intento de criar la mayor cantidad posible de monturas agresivas."
 albion_mod_43:0 "Madereros de Albion"
 desc_albion_mod_43:0 "Nuestros cazadores complementan su dieta cazando ciervos y otros animales en los bosques de Pritania."
 albion_mod_44:0 "Comercio con los Nativos"
 desc_albion_mod_44:0 "Nuestra decisión de cohabitar con los nativos en Scandia añade prosperidad y reputación entre el mundo celta."
 albion_mod_45:0 "Suministrado con Sal"
 desc_albion_mod_45:0 "Tenemos abundantes suministros de uno de los bienes comerciales más valiosos a los que tenemos acceso, la sal."
 albion_mod_46:0 "Un Hambre de Conquista"
 desc_albion_mod_46:0 "Nuestro pueblo no desea nada más que expandir nuestras fronteras y conquistar nuevas tierras y naciones."
 albion_mod_47:0 "Celtas Aceptados"
 desc_albion_mod_47:0 "Ellos son reconocidos como nuestros hermanos, dignos de participar en nuestra sociedad."
 albion_mod_48:0 "Amigos Hibernios"
 desc_albion_mod_48:0 "Los hibernios están de nuestro lado y compartirán su herencia con nosotros."
 albion_mod_49:0 "Afluencia Tribal Caledonia"
 desc_albion_mod_49:0 "Los fieros caledonios ahora se están moviendo dentro de nuestro reino, compartiendo conocimientos y vigilando contra incursiones."
 albion_mod_50:0 "Oro Pritaniano"
 desc_albion_mod_50:0 "Los pritanianos están listos para mejorar la riqueza de nuestro reino con su oro."
 albion_mod_51:0 "Dominación"
 desc_albion_mod_51:0 "Nuestro líder decidió que esta cultura no debería ser nuestra igual y debe ser dominada y asimilada."
 albion_mod_52:0 "Dominación Extrema"
 desc_albion_mod_52:0 "Esta cultura es apta para limpiar establos y trabajar en minas - los esclavos más bajos."
 albion_mod_53:0 "A la Esclavitud"
 desc_albion_mod_53:0 "Con la reciente conquista y decisión, nuestro país está listo para esclavizar a los celtas renegados."
 albion_mod_54:0 "Puertos Mediterráneos"
 desc_albion_mod_54:0 "Nuestros puertos mediterráneos se han convertido rápidamente en partes importantes de nuestra presencia militar y económica dentro de la región de la Galia."
 albion_mod_55:0 "Canal Asegurado"
 desc_albion_mod_55:0 "Gracias a nuestro control de los mares, el comercio se mueve fácilmente entre nuestra isla y el continente."
 albion_mod_56:0 "Apoyo de la Clase Noble"
 desc_albion_mod_56:0 "Nuestra nobleza, que ha estado obteniendo grandes sumas gracias a los esfuerzos de la familia gobernante para mejorar nuestra economía, está encantada con las iniciativas y las apoya totalmente."
 albion_mod_57:0 "Los Vinos de las Islas del Norte"
 desc_albion_mod_57:0 "Los vinos producidos por nuestros viñedos realmente rivalizan con cualquier cosa que se pueda encontrar en el continente - un logro sorprendente para nuestros maestros viticultores."
 albion_mod_58:0 "Terraformación"
 desc_albion_mod_58:0 "Esta provincia está siendo renovada y adaptada para producir un nuevo bien dentro de este territorio."
 albion_mod_59:0 "Juegos Maravillosos"
 desc_albion_mod_59:0 "El recuerdo de nuestros últimos juegos grandiosos aún está presente en la mente de nuestros compatriotas."
 albion_mod_60:0 "Buenos Juegos"
 desc_albion_mod_60:0 "Aunque no sean los mejores juegos del mundo, sigue siendo algo que el pueblo apreció."
 albion_mod_61:0 "Juegos Corrompidos"
 desc_albion_mod_61:0 "Estos juegos fueron extremadamente malos, con muchos diciendo que estaban malditos."
 albion_mod_62:0 "No Se Celebraron Juegos"
 desc_albion_mod_62:0 "Aunque no es una tradición larga en nuestro país, negarse a celebrar los juegos no fue bien recibido por el pueblo."
 albion_mod_63:0 "Esfuerzos de Espectadores"
 desc_albion_mod_63:0 "Nuestros compatriotas financiaron los juegos en su totalidad."
 albion_mod_64:0 "Juegos Olímpicos Gratuitos"
 desc_albion_mod_64:0 "Financiado por nuestro gran líder, quien prometió que cada hombre, mujer y niño viviendo en nuestro país debería ver los juegos."
 albion_mod_65:0 "Felicidad en la Tradición"
 desc_albion_mod_65:0 "Nuestro pueblo está feliz de abrazar y mantener nuestras antiguas prácticas culturales, incluso en un mundo de cambio."
 albion_mod_66:0 "Guerra Civil en Preparación"
 desc_albion_mod_66:0 "Nuestro país será devastado por las manos de nuestro propio pueblo - ¡prepárate!"
 albion_mod_67:0 "Compromiso"
 desc_albion_mod_67:0 "Para salvar a nuestro país desde adentro, nuestro líder llegó a un compromiso con la oposición."
 albion_mod_68:0 "Nueva Era"
 desc_albion_mod_68:0 "Nuestro pueblo comenzará a beneficiarse de la modernización."
 albion_mod_69:0 "Influencia Romana"
 desc_albion_mod_69:0 "Con nuestra modernización completada por la sabiduría romana, ahora estamos influenciados por ellos para siempre."
 albion_mod_70:0 "Influencia Púnica"
 desc_albion_mod_70:0 "Con nuestra modernización completada gracias al comercio púnico, ahora estamos influenciados por ellos para siempre."
 albion_mod_71:0 "Influencia Helénica"
 desc_albion_mod_71:0 "Con nuestra modernización fortalecida por el conocimiento helénico, ahora estamos influenciados por ellos para siempre."
 albion_mod_72:0 "La Herencia Eterna"
 desc_albion_mod_72:0 "Nuestro pueblo ha abrazado sus tradiciones y herencia, negándose a permitir que un mundo de caos cambie quiénes somos."
 albion_mod_73:0 "Cambios Crecientes"
 desc_albion_mod_73:0 "Nuestra modernización de la tradición no es del gusto de todos."
 albion_mod_74:0 "Carros Celtas"
 desc_albion_mod_74:0 "Nuestros carros son excepcionalmente poderosos, infundiendo terror en los corazones de aquellos que los enfrentan."
 albion_mod_75:0 "Arqueros de Albion"
 desc_albion_mod_75:0 "Nuestros arqueros son maestros en luchar desde los bosques, aprovechando la naturaleza para protegerse del enemigo."
 albion_mod_76:0 "Una Nueva Forma de Hacer las Cosas"
 desc_albion_mod_76:0 "Nuestro pueblo no tiene miedo de incorporar nuevas formas de hacer las cosas, especialmente cuando beneficiará a la nación."
 albion_mod_77:0 "Registros Orales"
 desc_albion_mod_77:0 "Nuestro pueblo sigue confiando en nuestros Ancianos Tribales para relatar nuestras historias e historias."
 albion_mod_78:0 "Alfabeto de Albion"
 desc_albion_mod_78:0 "Nuestros escribas han desarrollado un lenguaje escrito para que nuestro pueblo lo use."
 albion_mod_79:0 "Alfabeto Latino"
 desc_albion_mod_79:0 "Importamos y adaptamos el alfabeto de Roma."
 albion_mod_80:0 "Alfabeto Púnico"
 desc_albion_mod_80:0 "Importamos y adaptamos el alfabeto de Cartago."
 albion_mod_81:0 "Alfabeto Griego"
 desc_albion_mod_81:0 "Importamos y adaptamos el alfabeto de Grecia."
 albion_mod_82:0 "Infraestructura Romana"
 desc_albion_mod_82:0 "Nuestra ciudad brillará con la arquitectura romana."
 albion_mod_83:0 "Infraestructura Griega"
 desc_albion_mod_83:0 "Nuestra ciudad brillará con la arquitectura helénica."
 albion_mod_84:0 "Infraestructura Púnica"
 desc_albion_mod_84:0 "Nuestra ciudad brillará con la arquitectura púnica."
 albion_mod_85:0 "Tácticas de Elefantes Púnicos"
 desc_albion_mod_85:0 "Nuestra fascinación por Cartago y sus maravillas nos llevó a tener nuestro propio ejército de elefantes."
 albion_mod_86:0 "Tácticas Combinadas Púnicas"
 desc_albion_mod_86:0 "Fuertes y bien disciplinados en tierra y mar, la estrategia púnica nos llevará a la victoria."
 albion_mod_87:0 "Tácticas Itálicas"
 desc_albion_mod_87:0 "¡El poder de Roma es nuestro ahora!"
 albion_mod_88:0 "Ingeniero Itálico"
 desc_albion_mod_88:0 "¡La logística de Roma es nuestra ahora!"
 albion_mod_89:0 "Maestría en Lanza"
 desc_albion_mod_89:0 "Podemos asumir que nuestro ejército es tan fuerte, si no más fuerte, que los célebres Escudos de Plata de Alejandro."
 albion_mod_90:0 "Caballería Helénica"
 desc_albion_mod_90:0 "¡Bucefalo está con nosotros!"
 albion_mod_91:0 "Manteniendo Nuestras Raíces"
 desc_albion_mod_91:0 "Incluso a medida que nuestras ciudades se expanden, nuestro pueblo no olvida de dónde viene."
 albion_mod_92:0 "Un Pueblo Unido"
 desc_albion_mod_92:0 "Nuestros compatriotas están unidos en propósito, trabajando juntos para el bien común."
 albion_mod_93:0 "Festival Religioso"
 desc_albion_mod_93:0 "Para mostrar nuestra independencia cultural, creamos un festival que las generaciones recordarán."
 albion_mod_94:0 "Administración Educativa"
 desc_albion_mod_94:0 "Estamos orgullosos de nuestros ciudadanos, ya que son excelentes maestros para sus hijos, tomando su educación muy en serio."
 albion_mod_95:0 "Inversión en el Mercado"
 desc_albion_mod_95:0 "Las ganancias obtenidas de los mercados han sido reinvertidas en la infraestructura de nuestras áreas comerciales."
 albion_mod_96:0 "Gran Ciudad Imperial"
 desc_albion_mod_96:0 "Nuestra capital está finalmente lista para ser el paraíso en la tierra."
 albion_mod_97:0 "Antiguo Centro de Comercio"
 desc_albion_mod_97:0 "Recuperar Armorica nos permitió reconstruir antiguas rutas comerciales en la Galia que habían sido abandonadas durante siglos."
 albion_mod_98:0 "Trabajadores Belgas"
 desc_albion_mod_98:0 "Los belgas no son más que esclavos para nuestros campos y minas."
 albion_mod_99:0 "Tradiciones Ecuestres Galas"
 desc_albion_mod_99:0 "Con el conocimiento de la Galia, nuestra caballería es más fuerte ahora."
 albion_mod_100:0 "Inversión Nacional"
 desc_albion_mod_100:0 "En lugar de financiar expediciones peligrosas, nuestro país y los ciudadanos se benefician de un plan nacional de desarrollo."
 albion_mod_101:0 "Bienes Exóticos de Tiro"
 desc_albion_mod_101:0 ""
 albion_mod_102:0 "Bienes de exportación de Tiro"
 desc_albion_mod_102:0 ""
 albion_mod_103:0 "Tradiciones de Jerusalén"
 desc_albion_mod_103:0 ""
 albion_mod_104:0 "Conocimientos de defensa de Sidón"
 desc_albion_mod_104:0 ""
 albion_mod_105:0 "Libros de Alejandría"
 desc_albion_mod_105:0 ""
 albion_mod_106:0 "Conquista de Alejandro"
 desc_albion_mod_106:0 ""
 albion_mod_107:0 "Secreto de las Pirámides"
 desc_albion_mod_107:0 ""
 albion_mod_108:0 "Entrenamiento de los Escudos de Plata"
 desc_albion_mod_108:0 ""
 albion_mod_109:0 "Espectáculo Olímpico"
 desc_albion_mod_109:0 ""
 albion_mod_110:0 "Escuela de Filosofía"
 desc_albion_mod_110:0 ""
 albion_mod_111:0 "Métodos de entrenamiento juvenil"
 desc_albion_mod_111:0 ""
 albion_mod_112:0 "La visión del conquistador"
 desc_albion_mod_112:0 ""
 albion_mod_113:0 "Visión del Conquistador"
 desc_albion_mod_113:0 ""
 albion_mod_114:0 "Visión del Constructor"
 desc_albion_mod_114:0 ""
 albion_mod_115:0 "Visión del Diplomático"
 desc_albion_mod_115:0 ""
 albion_mod_116:0 "Ropa Púnica"
