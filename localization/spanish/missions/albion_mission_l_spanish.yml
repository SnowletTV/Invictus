me_albion_40.a: "¡La pluma es más poderosa que la espada!"
me_albion_41.a: "¡Serás mi navegador personal!"
me_albion_42.a: "Felicidades, [religious_champion.GetFirstName]..."
me_albion_43.a: "Al menos se coronó un victorioso"
me_albion_44.a: "¿Qué he hecho? He creado un monstruo..."
me_albion_45.a: "¡[ROOT.GetCountry.GetName] se encargará de todo y los hará gratuitos."
me_albion_45.b: "Dividiremos el costo entre nosotros y nuestra gente."
me_albion_45.c: "Es un juego para el [ROOT.GetCountry.GetAdjective] así que lo pagarán enteramente."
me_albion_45.d: "No podemos organizarlos, tristemente."
me_albion_55.a: "Nuestras tradiciones celtas nunca deben ser abandonadas"
me_albion_56.a: "Nuestros audaces carros, que chocan contra el enemigo, deben volverse más poderosos"
me_albion_56.b: "Fortalezcamos a nuestros arqueros, que atacan desde la distancia"
me_albion_57.a: "Lo que fue bueno para mis padres es bueno para mí"
me_albion_57.b: "Integraremos algunas de las nuevas formas; ¿qué daño hay?"
me_albion_57.c: "Modernizaremos todo y crearemos nuestro propio alfabeto."
me_albion_58.a: "A partir de hoy, todos deben usar este nuevo alfabeto #Y Celta#!"
me_albion_58.b: "A partir de hoy, todos deben usar este nuevo alfabeto #Y Latino#!"
me_albion_58.c: "A partir de hoy, todos deben usar este nuevo alfabeto #Y Púnico#!"
me_albion_58.d: "A partir de hoy, todos deben usar este nuevo alfabeto #Y Griego#!"
me_albion_59.a: "Se levantarán acueductos."
me_albion_59.b: "Necesitamos más ciudades costeras."
me_albion_59.c: "¡Más murallas!"
me_albion_60.a: "¡Los elefantes están llegando!"
me_albion_60.b: "¡Combinaremos todo y nuestras fuerzas serán invencibles!"
me_albion_61.a: "Nuestras legiones serán aclamadas como verdaderas legiones"
me_albion_61.b: "Traigan a sus matemáticos y soldados"
me_albion_62.a: "Nuestros hombres serán verdaderos Escudos de Plata."
me_albion_62.b: "Alejandro amaba a su caballo más que a nada"
me_albion_63.a: "¡No podemos abandonar las virtudes de nuestros antepasados!"
blood_of_albion_kings: "Sangre de los Reyes de Albion"
blood_of_albion_kings_desc: "Aquellos que nacen con la sangre de los Reyes de Albion son descendientes de los poderosos guerreros que conquistaron la isla de Britannia para formar el poderoso y eterno reino de Albion."
me_albion_travel_61.a: "Compra los esclavos para el bien de [ROOT.GetCountry.GetName] (-50)."
me_albion_travel_61.b: "Siempre necesitamos buenas armas - ¡mira esa espada! (-100)."
me_albion_travel_61.c: "Nunca he tenido ropa de seda antes... (-100)?"
me_albion_travel_61.d: "No nos queda nada que hacer aquí."
me_albion_travel_62.a: "Compra solo un elefante por ahora."
me_albion_travel_62.b: "Paga el precio que pide y abre una nueva relación comercial (-250)."
me_albion_travel_63.a: "Deberíamos abastecernos de suministros mientras podamos."
me_albion_travel_63.b: "Más mercenarios para nosotros (-100)."
me_albion_travel_64.a: "Podemos observar este interminable debate."
me_albion_travel_64.b: "Todo tiene su precio - dinos qué está pasando (-100)."
me_albion_travel_7.a: "Dirígete hacia los mercados de Atenas."
me_albion_travel_7.b: "¿Una Escuela de Filosofía? ¿Qué es eso (-50)?"
me_albion_travel_7.c: "Olimpia y los Juegos Olímpicos (-100)."
me_albion_travel_7.d: "¡Esto es Esparta! (-50)."
me_albion_travel_7.e: "Apolo nos espera en Delfos (-50)."
me_albion_travel_7.f: "Poseidón nos llama una vez más (dejar la ciudad)."
