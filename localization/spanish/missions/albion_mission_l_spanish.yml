 me_albion_travel_1_title:0 "La Llamada del Mar"
 me_albion_travel_1_desc:0 "Hace mucho tiempo, nuestra isla era frecuentemente visitada por extranjeros de tierras lejanas que traían bienes comerciales, monedas y tecnologías extrañas que eran desconocidas para nosotros. Aunque estos visitantes se iban para regresar a casa, sus visitas dejaron una gran impresión en la sociedad de [ROOT.GetCountry.GetAdjective] - ¿cómo no iba a ser así? Aprendimos tanto de ellos en tan poco tiempo.\n\nRecientemente, [ROOT.GetCountry.GetRuler.GetName] tuvo la brillante idea de devolverles el favor - ha llegado el momento de enviar nuestras propias expediciones al mundo. ¿Qué se descubrirá allí? ¿Ciudades doradas? ¿Animales gigantes? ¿Quizás los mismos dioses? Nadie lo sabe aún, pero [ROOT.GetCountry.GetRuler.GetFirstName] está ansioso por averiguarlo.\n\nSin embargo, algunas voces racionales del Consejo de [ROOT.GetCountry.GetName] se han opuesto, diciendo que prefieren gastar el dinero reservado para esta expedición en mejorar la vida de nuestros ciudadanos en casa."
 me_albion_travel.1.a:0 "¡Todos a bordo y zarpen, Capitán!"
 me_albion_travel.1.b:0 "El mar siempre es un lugar peligroso; el Consejo tiene razón."
 
 me_albion_travel_2_title:0 "Explicación de Reglas"
 me_albion_travel_2_desc:0 "Ave Imperator; es hora de romper un poco la cuarta pared. Para hacer posible y razonable esta aventura, hay algunas reglas especiales en juego durante esta cadena de eventos.\n\nPara que cada elección se sienta limitada e impactante como un RPG, tu flota de aventuras tendrá #Y Oro#! @gold! para administrar. Tu flota comenzará con #Y 1000#! @gold!.\n\nSerá #R imposible#! ganar más oro durante tus viajes y cada elección solo se puede tomar una vez, así que ten cuidado con lo que decides hacer.\n\nFinalmente, todas las recompensas mostradas en cada opción solo se recibirán al final de tu viaje.\n\nEl oro que quede al final de tus viajes se dispersará como donativos para los valientes marineros que hicieron posible el viaje, por lo que no quedará nada para volver al tesoro.\n\n#G ¡Buena suerte y diviértete#!."
 me_albion_travel.2.a:0 "Entendido; podemos partir ahora."
 me_albion_travel.2.b:0 "Esto es demasiado complicado, Maestro de Juegos; he cambiado de opinión."
 
 me_albion_travel_3_title:0 "El Impuesto del Viajero"
 me_albion_travel_3_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold!\n\nCelebraciones y regocijo acompañaron a la flota de aventureros mientras zarpaban de las seguras costas de [ROOT.GetCountry.GetName] hacia lo desconocido. Después de semanas de viaje llenas de mares tranquilos y vientos agradables, la armada llegó cerca de Gibraltar, donde se dio la orden de hacer una pausa mientras nuestros barcos se acercaban al estrecho. Una gran torre dominaba el paisaje, y las banderas que ondeaban en su aguja eran cartaginesas. Pronto se entregó un mensaje al buque insignia.\n'Bienvenidos extraños; si desean pasar sin que les ocurra daño a ustedes o a sus barcos, tendrán que pagar el peaje.'\n\n#Y ¿Qué hará tu flota?#!"
 me_albion_travel.3.a:0 "Pagar el impuesto (-100 oro)."
 me_albion_travel.3.b:0 "Te desafío a intentar detenernos - ¡zarpamos!"
 
 me_albion_travel_32_title:0 "¡Victoria!"
 me_albion_travel_32_desc:0 "Momentos después de que se recibiera tu respuesta, una antigua flota deteriorada apareció de la nada y se movió rápidamente hacia los barcos de [ROOT.GetCountry.GetAdjective]. Nuestros marineros se apresuraron a los cubiertas y tomaron posiciones defensivas, notando que nuestros enemigos no parecían pertenecer a una flota oficial - parecían más bien piratas.\n\nDando la orden de lanzarles flechas, se disparó la primera descarga como una advertencia para ellos, pero no captaron la indirecta y continuaron acercándose a nuestra flota - han decidido luchar.\n\nDespués de una breve batalla que vio morir a algunos buenos hombres, nuestra flota logró destruir todos los barcos piratas."
 me_albion_travel.32.a:0 "¡Que nadie se atreva a desafiarme!"
 
 me_albion_travel_33_title:0 "Más Perro Que Ladrido"
 me_albion_travel_33_desc:0 "Después de tu respuesta, el mensajero se quedó en silencio rápidamente y regresó a la costa, entregando las audaces palabras de los marineros de [ROOT.GetCountry.GetAdjective]. Nuestra flota avanzó sin peligro bajo la atenta mirada del Capitán, quien podía ver que los bandidos escondidos en la torre ni siquiera tenían una flota para desafiarnos.\n'¿Ves? Los desmantelaste, ¿verdad?' se rieron los marineros mientras lanzaban una canción de victoria de [ROOT.GetCountry.GetAdjective]."
 me_albion_travel.33.a:0 "La intimidación no funciona contra nosotros."
 
 me_albion_travel_34_title:0 "Una Verdadera Amenaza"
 me_albion_travel_34_desc:0 "Después de que nuestras palabras avinagradas fueron echadas en los oídos del mensajero, él se quedó en silencio y regresó a la costa sin decir una palabra más. Poco sabíamos que todo estaba a punto de estallar.\n\nUna gran armada de barcos de guerra cartagineses apareció de la nada, y en la costa, nuestros marineros juraron que podían ver una ballesta siendo armada - ¡hemos cometido un grave error!\n\nAfortunadamente para nosotros, somos muy fuertes y decididos a no ser derrotados, y tenemos más barcos que nuestros enemigos - será una prueba de determinación de ambos lados.\n\nAl final del día, nuestra flota fue victoriosa, pero algunos de nuestros barcos fueron hundidos y otros gravemente dañados, por lo que al final, el costo fue mayor de lo que estábamos dispuestos a soportar.\n\n#R Tu flota perderá 200 oro #! @gold!."
 me_albion_travel.34.a:0 "Rezaremos por los muertos mientras seguimos navegando."
 
 me_albion_travel_4_title:0 "Opciones de Viaje"
 me_albion_travel_4_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\n'Buenos días, Capitán.' dice el primer oficial alegremente mientras se acerca a tu escritorio con una caja de pergaminos llenos de mapas. 'Es hora de navegar a un lugar que ningún celta ha visitado antes, y tienes el honor de decidir adónde iremos.'"
 me_albion_travel.4.a:0 "Invicta Roma siempre he deseado ver (-50)"
 me_albion_travel.4.b:0 "¡Cartago, la Ciudad de los Elefantes! (-50)"
 me_albion_travel.4.c:0 "La patria de Alejandro debería estar bien (-50)"
 me_albion_travel.4.d:0 "¡Alejandría es la única ciudad que importa! (-50)"
 me_albion_travel.4.e:0 "¡La ciudad del tinte púrpura, Tiro! (-50)"
 me_albion_travel.4.f:0 "Hogar, dulce hogar."
 
 me_albion_travel_5_title:0 "Aeterna Roma"
 me_albion_travel_5_desc:0 "Su flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold!\n\nDejando nuestra flota cerca de [GetProvince('(int32)15').GetName], nuestros marineros se dirigieron a [GetProvince('(int32)1').GetName]; un lugar que nunca se imaginaron visitar. Las primeras impresiones de la gran capital fueron abrumadoras para nuestros chicos de [ROOT.GetCountry.GetCapital.GetName]; Roma es una ciudad extremadamente bulliciosa, una verdadera zona de prosperidad y peligro donde ni siquiera la noche pone fin a su incesante alboroto. Todo lo que uno pueda desear se encuentra aquí en Roma, y ​​nuestros hombres se sienten tentados por mil actividades diferentes, cada una de las cuales suena mejor que la anterior. \n Los mercados de Roma son conocidos por sus tesoros y bienes raros. ¿Es ahí donde gastaremos nuestra [ROOT.GetCountry.GetAdjective] moneda? También nos aconsejaron visitar los templos y presentar nuestros respetos a los dioses, entonces, ¿deberíamos ir allí? Algunos de nuestros marineros también han notado que, no muy lejos de donde se encuentran, los sonidos de la arena son fuertes y amigables. ¿Qué tal un poco de entretenimiento?\n\nItalia tampoco se limita a Roma; ¿Podríamos movernos?"
 me_albion_travel.5.a:0 "Gastemos el dinero en el mercado."
 me_albion_travel.5.b:0 "Podríamos aprender mucho de sus sacerdotes (-50)."
 me_albion_travel.5.c:0 "¡La arena suena divertido! Vamos a verlo (-50)."
 me_albion_travel.5.d:0 "Consigamos algunos suministros y exploremos Italia (-100)."
 me_albion_travel.5.e:0 "Eterno es el mar (salir de la ciudad)."
 
 me_albion_travel_51_title:0 "Foro de Roma"
 me_albion_travel_51_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nAl llegar al mercado, cada calle y callejón parece ocupado, lleno de miles de personas, algunas llevando ánforas y otras sacos de bienes a las tiendas. Los carteristas no son difíciles de encontrar, y tampoco lo son los vendedores de productos de mala calidad, que esperan hacer sus beneficios y desaparecer en las multitudes antes de que sus víctimas se den cuenta de que lo que compraron no vale nada. Pero estos casos son pocos y distantes entre sí, pues hay guardias aquí, vigilando para asegurarse de que todo esté en orden.\n\nHay muchos mercados de esclavos aquí y [ROOT.GetCountry.GetName] siempre necesita más esclavos - ¿deberíamos ir allí?\nCerca de una plaza, algunos arquitectos están discutiendo un dibujo que están mirando. Después de hacer algunas consultas, parece que estos arquitectos venderían sus planos a nosotros - ¿tal vez una villa romana en [ROOT.GetCountry.GetCapital.GetName] sería buena?\n\nEl relinchar de un caballo interrumpe este sueño. Hay muchos maestros de caballos aquí, listos para vender los mejores caballos del mundo conocido.\n\nHay tantas opciones - ¿qué queremos hacer?"
 me_albion_travel.51.a:0 "Compra los esclavos para el bien de [ROOT.GetCountry.GetName] (-50)."
 me_albion_travel.51.b:0 "[ROOT.GetCountry.GetCapital.GetName] tendrá su primera villa (-100)."
 me_albion_travel.51.c:0 "Saludos, amigo mío, ¿tienes a Bucéfalo (-100)?"
 me_albion_travel.51.d:0 "Sigamos adelante sin comprar nada."
 
 me_albion_travel_52_title:0 "Templo de Marte"
 me_albion_travel_52_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nDespués de dos buenas horas de marcha por las abarrotadas calles de la ciudad, tu expedición llega al gran Templo de Marte. Columnas hermosas de mármol y estatuas pintadas adornan el lugar, y la escena llena a los marineros de [ROOT.GetCountry.GetName] con asombro y reverencia por los romanos - realmente honran a sus dioses de la guerra.\nUna buena noticia alegra a los hombres; pronto comenzará una ceremonia pública y será gratuita para ver. El Capitán anuncia que nos quedaremos a observar los ritos romanos, y un pequeño grito de júbilo recorre la multitud.\n\nPero alguien se acerca, un anciano con la nariz mocosa, y estornuda fuerte y despectivamente. 'Pssh, estas ceremonias públicas son para los plebeyos ¡Veo que eres mejor que esto; eres un hombre de gusto, claramente. Si pagas una simple tarifa, organizaré algo grandioso en nombre de los dioses - ¡un verdadero espectáculo digno de ver!' \n#E ¿Aceptarás la oferta de este extraño hombre#!?"
 me_albion_travel.52.a:0 "No, la ceremonia pública está bien."
 me_albion_travel.52.b:0 "¡Hagámoslo, amigo mío! ¡Estoy aquí para divertirme y aprender algunas cosas! (-250)."
 
 me_albion_travel_53_title:0 "Una Visita a la Arena"
 me_albion_travel_53_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nMientras tus hombres pasan por los pasillos de mármol que conducen a la arena, el sonido de la multitud vitoreando arriba les hace caminar más rápido en anticipación. Ver a los hombres luchar por sus vidas siempre es entretenido para el público, y los viajeros de [ROOT.GetCountry.GetName] no son diferentes a los romanos en ese aspecto.\n\nUna feroz batalla entre tres gladiadores y diez tigres acaba de terminar, pero otra pelea está a punto de comenzar. A medida que el suelo de la arena se limpia de los muertos, un grupo de espectadores se está moviendo hacia sus asientos. Frente a ellos, una larga fila se está formando ante una mesa con tesoreros, y se están haciendo apuestas. 'Podríamos comprar un gladiador - ¿no crees que sería divertido? ¿Qué quieres hacer, Capitán?'"
 me_albion_travel.53.a:0 "Simplemente siéntate y mira la pelea."
 me_albion_travel.53.b:0 "¡Compramos un gladiador! (-100)."
 
 me_albion_travel_54_title:0 "Campania"
 me_albion_travel_54_desc:0 "Después de dejar la ciudad de Roma, nuestra expedición compró algunos suministros y se dirigió a la región de Campania en el sur de Italia.\n\nEl viaje hacia el sur no fue desagradable; todo el paisaje es maravilloso, estas colinas combinadas con campos de cultivo. El clima es perfecto, y el aire está impregnado con la fragancia de romero que crece junto a la carretera. Los caminos están en buen estado, bien construidos, y los soldados patrullan regularmente, listos para proteger a comerciantes y viajeros. A lo lejos, se puede ver una gran finca, y cientos de esclavos están trabajando en los viñedos que rodean las latifundias.\n\nAl apartarse de esta escena, uno de los soldados comenta: 'Las granjas y campos son buenos, pero un guerrero prefiere caminos - son buenos para el ejército y buenos para mis pies.' Este comentario juguetón causó una discusión amistosa entre los hombres, y el Capitán se pronunció con una opinión sobre qué era mejor, granjas o caminos."
 me_albion_travel.54.a:0 "La agricultura es la base de la sociedad."
 me_albion_travel.54.b:0 "¡Si tan solo tuviéramos caminos como estos en [ROOT.GetCountry.GetName]!"
 
 me_albion_travel_6_title:0 "La Ciudad de los Elefantes"
 me_albion_travel_6_desc:0 "Tu flota ha #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold!\n\nNuestros marineros han llegado a [GetProvince('(int32)3256').GetName], la sede de renombre mundial de comerciantes, marineros y comerciantes que controlan una poderosa red comercial en el Mediterráneo. Dentro de la propia ciudad, el mercado adquiere una importancia central, como se podría imaginar, y nuestros marineros se sienten tentados a dirigirse allí de inmediato. Porque es bien sabido que en estos mercados se pueden encontrar productos exóticos, y nuestros hombres han oído muchos rumores sobre qué es exactamente lo que está a la venta.\n\nEl distrito portuario también es una opción tentadora, ya que al Capitán le encantaría tener la oportunidad de ver el #E Gran Cotón#! de los cartagineses en persona. Pero tal vez sería inspirador un recorrido por los edificios cívicos del centro: hay mucho que podríamos aprender de su Senado."
 me_albion_travel.6.a:0 "Gastemos el dinero en el mercado."
 me_albion_travel.6.b:0 "Busquemos algo un poco más exótico (-50)?"
 me_albion_travel.6.c:0 "El distrito portuario es a donde vamos (-50)."
 me_albion_travel.6.d:0 "Hacia el centro de poder de la república más antigua (-50)."
 me_albion_travel.6.e:0 "Eterna es el mar (dejar la ciudad)."
 
 me_albion_travel_61_title:0 "Los Mercados de Cartago"
 me_albion_travel_61_desc:0 "Su flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nAl llegar al mercado, cada puesto, cada edificio, cada tienda de la esquina está lleno de gente entrando y saliendo. Los carteristas no son difíciles de encontrar, como tampoco lo son los vendedores de productos de mala calidad, que esperan obtener ganancias y desaparecer entre la multitud antes de que sus víctimas se den cuenta de que lo que han comprado no tiene valor. Pero estos casos son pocos y espaciados, porque aquí hay guardias, vigilando para asegurarse de que todo esté en orden.\n\nUna de las calles más populares es donde están los mercados de esclavos, y se sabe que [ROOT.GetCountry.GetName] podría hacer buen uso de ellos. Sin embargo, el brillo de la luz sobre el metal llama la atención del Capitán; aquí están los armeros, mostrando algunas de las mejores espadas jamás forjadas. ¿Deberíamos gastar parte de nuestra moneda ganada con tanto esfuerzo en una espada legendaria?\n\nComo si esto no fuera suficiente, al lado del comerciante de armas hay un emporio de ropa, donde se exhiben finas túnicas de seda junto a zapatos de cuero con oro tejido. ¡Podríamos pasar mucho tiempo paseando por las tiendas!"
 me_albion_travel.61.a:0 "Compra los esclavos por el bien de [ROOT.GetCountry.GetName] (-50)."
 me_albion_travel.61.b:0 "Siempre necesitamos buenas armas. ¡Mira esa espada! (-100)."
 me_albion_travel.61.c:0 "Nunca antes había tenido ropa de seda... (-100)?"
 me_albion_travel.61.d:0 "No nos queda nada que hacer aquí."
 
 me_albion_travel_62_title:0 "Primera Regla de la Economía"
 me_albion_travel_62_desc:0 "Su flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\n¿Qué es esto? ¿Qué encontraremos aquí? El Capitán apartó una gran cortina de tela y entró en una gran carpa, donde se exhibía un mercado abierto. Sorprendentemente, hoy está casi desierto. ¿Dónde están todos?\n\nAlguien, tumbado sobre una estera, llamó a los marineros con voz aburrida. 'El martes es la llegada de mercancías extranjeras; mañana. No hay nada nuevo aquí.'\n\nAun así, algo atrajo a los aventureros de [ROOT.GetCountry.GetName]: un bebé elefante sano dentro de una jaula. El vendedor notó su interés inmediatamente y comenzaron las negociaciones. Los vendedores prometieron que podría conseguir muchos más elefantes y enviarlos a nuestra capital con regularidad."
 me_albion_travel.62.a:0 "Solo compra un elefante por ahora."
 me_albion_travel.62.b:0 "Paga el precio que te pide y abre una nueva relación comercial (-250)."
 
 me_albion_travel_63_title:0 "Puertos Apestosos"
 me_albion_travel_63_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nEl distrito portuario es absolutamente enorme y está lleno de actividad, pero el aire está cargado con el hedor a pescado podrido y los gritos de las gaviotas en el aire. Desafortunadamente para nosotros, los guardias armados no nos permitieron acercarnos al #E Grand Cothon#!, lo que redirigió a nuestros marineros a los numerosos mercados instalados alrededor del puerto. Aquí hay muchos suministros de viaje disponibles a precios excelentes, pero la otra cosa a la venta son espadas: hay docenas de compañías de mercenarios que buscan empleo, con la esperanza de un contrato que los saque de la ciudad con la marea."
 me_albion_travel.63.a:0 "Deberíamos abastecernos de suministros mientras podamos."
 me_albion_travel.63.b:0 "Más mercenarios para nosotros (-100)."
 
 me_albion_travel_64_title:0 "El Senado"
 me_albion_travel_64_desc:0 "Su flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nAcercándose al centro de la ciudad, nuestros marineros pueden observar un gigantesco edificio con una arquitectura única; columnas de mármol, puertas de entrada realizadas en metales preciosos como oro y plata y con el símbolo de la diosa Tanit en su superficie. Todo en este distrito está ahí para mostrar el poder del Senado cartaginés; Hay guardias armados en posición de firmes cada pocos cientos de pasos.\n\nA nuestra llegada, estos guardias nos detuvieron y nos dijeron que no podíamos continuar, porque se estaba celebrando un debate. Sin embargo, los debates se pueden observar desde el estrado público y nuestros hombres toman asiento, pero pronto se sienten confundidos por las maquinaciones legales que se exhiben. Junto al Capitán estaba sentado un hombre, vestido con una elaborada toga que tenía un león cosido. Por cómo otros trataron a esta figura, se desprende claramente que este hombre es alguien importante y podría explicarnos el debate y el sistema político de Cartago."
 me_albion_travel.64.a:0 "Podemos ver este debate interminable."
 me_albion_travel.64.b:0 "Cada uno tiene su precio: cuéntanos qué está pasando (-100)."
 
 me_albion_travel_7_title:0 "La Entrada a Grecia"
 me_albion_travel_7_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold!\n\nDespués de semanas de navegación, llegas al puerto del Pireo y estás listo para explorar el resto de Grecia. Nuestros hombres, que han oído historias de este hermoso país durante toda su vida, están muy emocionados de poder probar Hellas por sí mismos. ¿Estará todo a la altura de sus elevadas expectativas? Nuestro primer paso puede ser Atenas con su mercado y su Escuela de Filosofía, pero son posibles otros destinos, como la ciudad olímpica, el hogar de los espartanos o quizás incluso el oráculo de Delfos."
 me_albion_travel.7.a:0 "Dirígete hacia los mercados de Atenas."
 me_albion_travel.7.b:0 "¿Una escuela de filosofía? ¿Qué es (-50)?"
 me_albion_travel.7.c:0 "Olimpia y los Juegos Olímpicos(-100)."
 me_albion_travel.7.d:0 "¡Esto es Esparta! (-50)."
 me_albion_travel.7.e:0 "Apolo nos espera en Delfos (-50)."
 me_albion_travel.7.f:0 "Poseidón nos llama una vez más (salimos de la ciudad)."
 
 me_albion_travel_71_title:0 "Ágora"
 me_albion_travel_71_desc:0 "Su flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nAunque el mercado de Atenas no es tan grande como algunos de los otros que se encuentran en el Mediterráneo, siempre hay oportunidades y cosas interesantes que se pueden descubrir. Se presenta al Capitán una lista de opciones para la tarde; Podemos encontrar esclavos a buen precio, ir a ver los debates filosóficos en la Academia o simplemente movernos por las calles del ágora. ¿Necesitamos siempre una agenda? Podría ser agradable simplemente pasear un rato. En un rincón sombreado de la calle, un artista dibuja un paisaje urbano."
 me_albion_travel.71.a:0 "Guardar a los esclavos para el bien de [ROOT.GetCountry.GetName] (-50)."
 me_albion_travel.71.b:0 "Un poco de filosofía nunca nos hará daño (-100)."
 me_albion_travel.71.c:0 "Debería mostrar esta obra de arte a mi madre (-50)?"
 me_albion_travel.71.d:0 "Deberíamos irnos."
 
 me_albion_travel_72_title:0 "¿Ser o No Ser?"
 me_albion_travel_72_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nLa famosa Academia de Atenas; Este lugar te lo indicó un guía local y, después de pagarle una dracma, te dejará en este lugar donde alguna vez residieron muchos maestros famosos, incluido Aristóteles. El Capitán se da cuenta de que la escuela es principalmente un gran anfiteatro con una lección en curso entre algunos profesores y estudiantes. Al acercarnos, se puede oír que la discusión se centra en Heracles; ¿Era un humano o un dios? ¿Quizás deberíamos quedarnos y escuchar, o podríamos pagar a un tutor para que nos enseñe filosofía ateniense... o quizás una de estas cabezas marchitas querrá volver a casa con nosotros?"
 me_albion_travel.72.a:0 "La filosofía es aburrida; vámonos."
 me_albion_travel.72.b:0 "Todo lo que vale la pena saber tiene un precio (-50)."
 me_albion_travel.72.c:0 "¿Alguien interesado en mudarse a [ROOT.GetCountry.GetName] (-250)?"
 
 me_albion_travel_74_title:0 "¡Espartano! ¿Cuál es tu profesión?"
 me_albion_travel_74_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nDespués de algunos días de viaje, los compañeros lograron llegar al pueblo que está considerado como el hogar de los mejores soldados del mundo. Una ciudad que atrae a los mejores guerreros, un lugar donde las mujeres son elegidas no por su belleza sino por su destreza física; Lo único que importa aquí es la fuerza. Nuestros hombres, agotados por el calor del día, se toman un descanso en lo que parece una taberna para viajeros. La conversación se detiene en el albergue una vez que nuestros hombres entran, pero después de comprar las bebidas, la charla se reanuda, un murmullo bajo que compite con el zumbido de las moscas.\n\nAparentemente mañana se llevarán a cabo dos actividades dentro de la ciudad; Está programado un espectáculo de entrenamiento militar, para mostrar el dominio espartano de la lanza a todos los que deseen observar. Curiosamente también se va a producir un juego mezclando niños y algunos adultos. Esta contienda consiste en que un equipo intenta robar un queso mientras el rival lo defiende a toda costa. Se acepta la participación de extranjeros, pero sólo por una determinada tarifa."
 me_albion_travel.74.a:0 "Ver un entrenamiento normal será suficiente."
 me_albion_travel.74.b:0 "¡Vamos a tomar este queso y ganar (-100)!"
 
 me_albion_travel_75_title:0 "¿Un Regalo Para Apolo?"
 me_albion_travel_75_desc:0 "Su flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nDelphi; todos los hombres, desde Sócrates hasta Alejandro, iban aquí en busca de una bendición o un presagio. La ciudad está llena de invitados, líderes y generales extranjeros de todo el Mediterráneo que buscan el consejo de los dioses. Sin embargo, el Capitán está empezando a arrepentirse de haber venido aquí, ya que parece que este lugar es más una trampa para turistas que otra cosa. Todos los productos en el mercado están bien, pero nada que quisiéramos llevarnos a casa; la única razón para viajar aquí es buscar la voluntad de Apolo. Nuestra petición para visitar Pythia ha sido aceptada, pero costará un buen centavo por el honor."
 me_albion_travel.75.a:0 "¿Por qué pagar por algo así?"
 me_albion_travel.75.b:0 "Paga lo que se pide, porque para eso estamos aquí (-100)."
 
 me_albion_travel_76_title:0 "¡A La Guerra!"
 me_albion_travel_76_desc:0 "Una vez que entras en el templo, la alta sacerdotisa nos recibe por nombre, aunque no se hicieron presentaciones. 'He visto a muchos hombres y algunas mujeres en mi tiempo aquí, pero ustedes son los primeros visitantes de [ROOT.GetCountry.GetName]. Por esta razón sola, el dios Apolo ha aceptado su solicitud para escuchar sus palabras.'\n\nLlamando a un sirviente, la sacerdotisa comienza a desnudarse, deslizándose fuera de su sencilla toga.\n\n'¡Oh Apolo, por favor escucha mi voz y permite que vea el futuro de los huéspedes [ROOT.GetCountry.GetAdjective].'\n\nElla comienza a bailar al ritmo de una música inaudible y mueve los brazos como si estuviera poseída. Luego su voz comienza a cambiar, volviéndose más fuerte y profunda, como la de un hombre.\n\nArrojando la cabeza hacia atrás, sus ojos comienzan a girar en su cabeza y la voz grave habla.\n\n'¡La muerte y el rapto te esperan! Los niños son masacrados y dejados en las calles, y la virtud de sus madres llorosas es violada por soldados que no muestran misericordia. Desde la ciudadela, se oyen los gritos de los hombres y el choque del metal contra el metal; la batalla aún no ha terminado y el fuego se está extendiendo por todas partes.'\n\nEl Capitán parece visiblemente incómodo mientras la sacerdotisa continúa recitando. Ella balbucea tonterías, sus ojos se vuelven pálidos, y se desploma de su trípode. Los sirvientes se apresuran a revisarla, pero ha expirado - su alma ha dejado su cuerpo. Mientras se cubre con un sudario, los marineros salen del templo, confundidos y perplejos. ¿De qué trataba la visión? ¿Somos los conquistadores, o será [ROOT.GetCountry.GetCapital.GetName] la ciudad que será destruida por el invasor?\n\nComo si respondiera a las preguntas no formuladas de sus hombres, el Capitán anunció que esto era un buen presagio."
 me_albion_travel.76.a:0 "[ROOT.GetCountry.GetRuler.GetName] ¡nos llevará a la victoria!"
 
 me_albion_travel_77_title:0 "Constructor de Legados"
 me_albion_travel_77_desc:0 "Una vez que entras en el templo, la alta sacerdotisa nos da la bienvenida por nombre, a pesar de que no se hicieron presentaciones. 'He visto a muchos hombres y algunas mujeres en mi tiempo aquí, pero ustedes son los primeros visitantes de [ROOT.GetCountry.GetName]. Por esta razón sola, el dios Apolo ha aceptado su solicitud para escuchar sus palabras.'\n\nLlamando a un sirviente, la sacerdotisa comienza a desvestirse, deslizándose fuera de su sencilla toga.\n\n'Oh Apolo, por favor escucha mi voz, y déjame contemplar el futuro de los huéspedes [ROOT.GetCountry.GetAdjective]'.\n\nComienza a danzar al ritmo de una música inaudible y mueve sus brazos como si estuviera poseída. Luego su voz comienza a cambiar, volviéndose más fuerte y profunda, como la de un hombre.\n\nArrojando su cabeza hacia atrás, sus ojos empiezan a girar en su cabeza y la voz pesada habla.\n\n'Una ciudad distinta a todas las demás, la Joya de las Islas del Norte. Los mercaderes vienen de todo el mundo a tus costas con la esperanza de obtener tus mercancías, y grandes sumas quedan en las tesorerías. El nombre de [ROOT.GetCountry.GetRuler.GetName] será recordado como el que creó un paraíso que un día superará a Alejandría en gloria'. La sacerdotisa se desploma de su taburete, pero es ayudada de nuevo por un asistente.\n\nCon una voz débil y temblorosa, con su tono normal, anuncia a los marineros que el dios Apolo ha hablado."
 me_albion_travel.77.a:0 "¡[ROOT.GetCountry.GetRuler.GetName] nos llevará a la prosperidad!"
 
 me_albion_travel_78_title:0 "El Don de la Profecía"
 me_albion_travel_78_desc:0 "Una vez que entras en el templo, la alta sacerdotisa nos da la bienvenida por nombre, a pesar de que no se hicieron presentaciones. 'He visto a muchos hombres y algunas mujeres en mi tiempo aquí, pero ustedes son los primeros visitantes de [ROOT.GetCountry.GetName]. Por esta razón sola, el dios Apolo ha aceptado su solicitud para escuchar sus palabras.'\n\nLlamando a un sirviente, la sacerdotisa comienza a desvestirse, deslizándose fuera de su sencilla toga.\n\n'Oh Apolo, por favor escucha mi voz, y déjame contemplar el futuro de los huéspedes [ROOT.GetCountry.GetAdjective]'.\n\nComienza a danzar al ritmo de una música inaudible y mueve sus brazos como si estuviera poseída. Luego su voz comienza a cambiar, volviéndose más fuerte y profunda, como la de un hombre.\n\nArrojando su cabeza hacia atrás, sus ojos empiezan a girar en su cabeza y la voz pesada habla. 'Preveo una reunión, donde se ha preparado una mesa de banquete. Todos los gobernantes de todo el mundo vendrán a rendir homenaje a [ROOT.GetCountry.GetRuler.GetName]. Todos temblarán ante los poderosos de las islas del norte y esperarán alianzas; todo lo que [ROOT.GetCountry.GetRuler.GetName] desee se le concederá.'\n\nLa sacerdotisa se desploma al suelo, y el sirviente se mueve para cubrir su cuerpo inerte con un sudario antes de girarse hacia el Capitán. 'Apolo ha hablado y ahora deben irse.'"
 me_albion_travel.78.a:0 "¡[ROOT.GetCountry.GetRuler.GetFirstName] nos llevará a la paz!"
 
 me_albion_travel_8_title:0 "Alejandría"
 me_albion_travel_8_desc:0 "Su flota ha #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nEl viento estuvo en calma los últimos días, un buen augurio mientras nuestros barcos navegan hacia el puerto de Alejandría. Incluso antes de que nuestros hombres pusieran un pie en la orilla, se podían escuchar los sonidos de lenguas exóticas y se podía ver a hombres vestidos con muchos estilos de ropa extraños caminando por los muelles: esta es una verdadera ciudad cosmopolita.\n\nAhora que estamos aquí, ¿qué debemos hacer? Podemos intentar visitar la tumba del gran macedonio. Algunos de nuestros hombres nos han pedido que viajemos hacia el sur para ver las pirámides, ya que estamos lo más cerca posible de los monumentos antiguos. Y si bien estas atracciones culturales tienen sus méritos, el brillo de la luz del sol reflejado en los escudos plateados también ha llamado la atención de nuestros soldados: hay guerreros egipcios entrenando fuera de la ciudad."
 me_albion_travel.8.a:0 "Compremos un souvenir en el mercado."
 me_albion_travel.8.b:0 "La Tumba de Alejandro nos llama (-50)"
 me_albion_travel.8.c:0 "¿Debo ver las Pirámides antes de morir (-150)?."
 me_albion_travel.8.d:0 "Podríamos aprender algo de estos veteranos (-50)."
 me_albion_travel.8.e:0 "El mar sigue siendo nuestro amigo (sal de la ciudad)."
 
 me_albion_travel_81_title:0 "Ágora Helénica"
 me_albion_travel_81_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nEl mercado de Alejandría está lleno de sonidos y olores; pan recién horneado y carnes asadas, el hedor de los animales de carga trabajando en las sombreadas columnatas, el repugnante olor de las alcantarillas cociéndose en el calor. Un escultor trabaja cuidadosamente con un cincel, dando los toques finales a una elaborada estatua de una diosa alada y, como siempre, el traficante de esclavos nunca está lejos de aquí. El Capitán también nota una tienda llena de pergaminos y escribas; Parece que aquí también hay textos a la venta."
 me_albion_travel.81.a:0 "Compra los esclavos por el bien de [ROOT.GetCountry.GetName] (-50)."
 me_albion_travel.81.b:0 "Deberíamos leer un poquito (-100)."
 me_albion_travel.81.c:0 "¿La escultura es una marca de alta civilización (-50)?"
 me_albion_travel.81.d:0 "No tenemos nada que hacer aquí."
 
 me_albion_travel_82_title:0 "Legado de una Leyenda"
 me_albion_travel_82_desc:0 "Su flota ha #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nAl llegar a la gran Tumba de Alejandro, este lugar es probablemente la zona más vigilada que hemos visto en nuestros viajes: la cantidad de guardias aquí es asombrosa; fácilmente un pequeño ejército. Una falange de soldados fuertemente armados custodia la entrada a la tumba y nadie puede ver lo que hay dentro, aunque algunas personas están deslizando monedas de oro en manos de los centinelas para que les permitan la entrada. ¿Deberíamos hacer lo mismo?"
 me_albion_travel.82.a:0 "Presentaremos nuestros respetos desde lejos."
 me_albion_travel.82.b:0 "Soborna a los guardias para obtener acceso (-250)."
 
 me_albion_travel_84_title:0 "¡Murallas de Escudos!"
 me_albion_travel_84_desc:0 "Su flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nHoy es un día para entrenamiento estándar. Los soldados se dividen en dos equipos; a uno se le asigna la tarea de defenderse, y los hombres entrelazan sus brazos y forman un muro de escudos. El bando contrario recibe lanzas y se le ordena atacar a sus hermanos. Un general nota que nuestros hombres están mirando y le pregunta al Capitán si queremos entrenar con sus hombres. Por supuesto, nada es gratis."
 me_albion_travel.84.a:0 "Ver el entrenamiento es suficiente para aprender."
 me_albion_travel.84.b:0 "Démosles una muestra de la valentía celta (-100)."
 
 me_albion_travel_9_title:0 "Tiro, el Fénix Púrpura."
 me_albion_travel_9_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold!\n\nTiro no es la ciudad que originalmente esperabas visitar, pero un comerciante te aconsejó ir allí para descubrir el Levante y sus tradiciones y nuestro Capitán no pudo negarse. Este comerciante juró que los mercados de Tiro rivalizaban con los de Cartago y Roma, y ​​que su distrito portuario era uno de los mejores del Mediterráneo. Si las tentaciones de Tiro no son de nuestro agrado, entonces hay otros destinos en el Levante que podríamos explorar. Sin embargo, los hombres están cansados ​​de deambular y no les importaría tomarse la tarde para explorar la ciudad."
 me_albion_travel.9.a:0 "El mercado, hogar de cada oportunidad."
 me_albion_travel.9.b:0 "¿Qué sorpresas podemos encontrar en este puerto (-50)?"
 me_albion_travel.9.c:0 "Deberíamos explorar el Levante."
 me_albion_travel.9.d:0 "Comprar está bien (-100)."
 me_albion_travel.9.e:0 "Adiós, Tiro (dejar la ciudad)."
 
 me_albion_travel_91_title:0 "¿Oportunidad?"
 me_albion_travel_91_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nComo comentó una vez un hombre sabio que vivía en [ROOT.GetCountry.GetCapital.GetName], cada mercado es como una moneda, con dos caras. Lo bueno es que podemos ver una tienda que vende productos exóticos de la India y Persia, y nuestros hombres quedan cautivados: nunca antes habían visto marfil ni olido el fragante incienso que sólo se puede encontrar en el este. Y, sin embargo, el mercado tiene un punto vulnerable, ya que los traficantes de esclavos siempre están ahí: es un espectáculo lamentable ver a un esclavo desnudo sentado en una estera con una pesada cadena alrededor del cuello. Incluso hay tiendas donde los artesanos trabajan en extraños artilugios, inventos que, según afirman, pueden sustituir el trabajo esclavo en determinadas tareas. En verdad, todo lo que uno pueda imaginar se encuentra aquí."
 me_albion_travel.91.a:0 "Compra a los esclavos para su libertad (-50)."
 me_albion_travel.91.b:0 "Los bienes exóticos nunca son una mala idea (-100)."
 me_albion_travel.91.c:0 "Deberíamos probar estos inventos (-100)?"
 me_albion_travel.91.d:0 "Mi negociación ha terminado."
 
 me_albion_travel_92_title:0 "Puerto Púrpura"
 me_albion_travel_92_desc:0 "Su flota ha #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nAunque su reputación sigue siendo dorada, los buenos días de Tiro han quedado atrás, un hecho obvio para nuestros marineros visitantes. Este puerto fue una vez el más famoso del mundo y ahora está en ruinas gracias a Alejandro y los Diadochi. Hay más mendigos aquí que en otros lugares, y el Capitán tuvo que decirles a los hombres que no dieran limosna a ninguna de las pobres almas desplomadas contra las paredes de los edificios; nos quedaríamos sin oro incluso antes de llegar a la plaza.\n\nMientras caminaba por las calles polvorientas, un hombre vestido con armadura salió de una puerta y nos llamó para que escucháramos sus palabras. Varado aquí después de que su compañía mercenaria se disolviera tras una campaña desastrosa, este soldado afirma que tiene conocimientos para la venta y que, por una tarifa \"modesta\", se unirá a tu grupo y te revelará los secretos militares que aprendió."
 me_albion_travel.92.a:0 "Solo sigue caminando; nada que ver excepto la gloria de los viejos tiempos."
 me_albion_travel.92.b:0 "¿Por qué no? Estás contratado (-250)."
 
 me_albion_travel_93_title:0 "¿A dónde vamos?"
 me_albion_travel_93_desc:0 "Su flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nEl Levante es un lugar enorme y lamentablemente no tenemos tiempo para visitar todo lo que nos gustaría. Podría ser aconsejable contratar un guía local, uno que pueda ayudarnos a navegar hasta Tiro o Jerusalén, o incluso hasta ambas. Si tenemos el dinero, todo es posible."
 me_albion_travel.93.a:0 "Llévanos a Jerusalén y al Templo."
 me_albion_travel.93.b:0 "¡Sidón puede enseñarnos cómo defender una ciudad!"
 me_albion_travel.93.c:0 "Eh, terminemos nuestro viaje dentro del Levante."
 
 me_albion_travel_94_title:0 "Trampas para turistas"
 me_albion_travel_94_desc:0 "Tu flota tiene #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('total_money').GetValue|0Y]#! @gold! \n\nMoviéndose entre calles, encuentras muchas cosas interesantes que podrías comprar, y si nuestros hombres pudieran llevarse todo lo que desearan, entonces la ciudad misma quedaría vacía de mercancías. El Capitán ha indicado que se hace tarde y nuestros hombres deben regresar a sus barcos, pero hay algunas pequeñas tiendas cerca de las puertas de la ciudad que tienen chucherías y otros recuerdos a la venta. \n\n'¡Estatuas del dios del mar para proteger tus barcos sobre las olas!' grita un vendedor mientras ajusta su mercancía, saca fardos de ropa doblados y los coloca junto a una mesa. \"Túnicas para mantenerte abrigado por la noche... Trae aquí pan y queso frescos, pan caliente y queso\"."
 me_albion_travel.94.a:0 "Esta última estatuilla será tan maravillosa."
 me_albion_travel.94.b:0 "Esas pesadas túnicas parecen que serán buenas."
 
 me_albion_travel_11_title:0 "Todo lo bueno tiene su fin"
 me_albion_travel_11_desc:0 "La espera para que los valientes marineros regresaran a [ROOT.GetCountry.GetName] parecía durar años, y muchos en [ROOT.GetCountry.GetCapital.GetName] empezaron a temer lo peor. ¿Se destruyó la flota, estrellada contra las crueles rocas de alguna playa desconocida? ¿O los hombres eligieron nunca volver? ¿Se enojaron los dioses con nuestra arrogancia y decidieron enviar nuestra flota al fondo de los mares?\n\nPor supuesto, todas estas opciones eran posibles, pero con determinación y buenas decisiones, nuestra flota finalmente regresó a casa. [ROOT.GetCountry.GetRuler.GetName] convocó un período de festines y celebraciones para dar la bienvenida a los intrépidos exploradores, y los ciudadanos que viven en la capital [ROOT.GetCountry.GetAdjective] les dieron una bienvenida de héroes."
 me_albion_travel.11.a:0 "Estás a salvo de vuelta a casa, guerreros - ¿qué historias tienes?"
 
 #Other (decision , loyalty ...)
 
 decision_add_albion_wood_wall:0 "Implementar El Muro de Madera"
 decision_add_albion_wood_wall_desc:0 "Si queremos proteger nuestra isla, necesitamos la marina más fuerte con más marineros disponibles. Podemos llevar a cabo una serie de acciones para mejorarla."
 decision_remove_albion_wood_wall:0 "Abolir El Muro de Madera"
 decision_remove_albion_wood_wall_desc:0 "El Muro de Madera ha cumplido bien su deber, pero no puede luchar por nosotros en tierra; ahora necesitamos el ejército más fuerte."
 decision_AIO_import_wine:0 "Crear Un Nuevo Viñedo"
 decision_AIO_import_wine_desc:0 "Para continuar con el crecimiento del gusto y la cultura de nuestra civilización, construiremos viñedos en territorios que sean buenos candidatos para la producción de vino."
 decision_AIO_place_elephant:0 "La Familia de Elefantes"
 decision_AIO_place_elephant_desc:0 "Mientras vagaba por los mercados de una tierra extraña y exótica, nuestro capitán conoció a un comerciante que le ofreció el trato de su vida: un elefante real por exactamente la cantidad de monedas que quedaban en su saco. Un espíritu impulsivo se apoderó del hombre, y aceptó comprar la bestia, pero solo después de que el comerciante prometiera que nos traería más elefantes, para completar y hacer crecer la familia que podríamos adquirir.\n\nPero, ¿por qué no llevar esto más allá? ¡Ahora necesitamos crear un lugar para elefantes si queremos explotar esta increíble posibilidad!"
 AIO_elepphants_placing:0 "Seleccionaremos una provincia para producir #Y Elefantes#!."
 decision_AIO_import_ressource_carthage:0 "Llamar al comerciante de Cartago"
 decision_AIO_import_ressource_carthage_desc:0 "Con el contrato de derecho de comercio exclusivo que tenemos. Importaremos y modernizaremos aún más nuestra gran isla.\nEnvía un mensaje y espera su llegada."
 AIO_import_carthage:0 "El comerciante cartaginés llegará en #Y 3 meses#! con bienes para transformar nuestra tierra."
 AIO_import_cooldown_tt:0 "El comerciante #R no#! ha visitado y ha pasado al menos #Y 5 años#! desde la última visita."
 AIO_can_province_import_wine:0 "Cualquier terreno agrícola dentro de las Islas Británicas está disponible para transformar en Viñedo."
 AIO_recent_wine_import_cooldown:0 "Esta decisión tiene un tiempo de espera de #Y 1 año#!."
 AIO_importing_wine_province:0 "Elegiremos un territorio para transformar en un #G Viñedo#!."
 
 
