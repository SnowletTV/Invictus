l_spanish:
 
 androphagia:0 "Día de los caníbales"
 androphagia_DESCRIPTION:0 "Son pocos los vivos que conocen el camino a las tierras donde las tribus de los #E andrófagos#! migratorios tienen su hogar, y el puñado de comerciantes #E escitas#! que conocen el camino a sus campamentos a menudo se niegan a divulgar esta información, incluso si se les ofrecen grandes cantidades de plata y oro.\n\nEsta renuencia a viajar por el #E río Borístenes#! tal vez pueda rastrearse hasta las historias compartidas entre las dos tribus; Hace cientos de años, cuando los ejércitos de #E Darío el Persa#! invadieron Escitia con su renombrado general #E Megazabo#! a su lado, los andrófagos se negaron a salir en defensa de los miembros de la tribu cuando los escitas pidieron ayuda, y estos amargos recuerdos de traición no han sido olvidados.\n\nQuizás otra razón por la que los andrófagos se ven abandonados a su suerte es su inclinación por devorar carne humana; el nombre que les dieron los griegos significa literalmente \"devoradores de hombres\". Si bien el canibalismo se utiliza ocasionalmente en sus prácticas religiosas, se han ganado injustamente la reputación de ser caníbales salvajes que desollan la carne de los vivos y beben la sangre de sus víctimas, una distinción dudosa que está mal informada, pero que no parece importarles."
 androphagia_CRITERIA_DESCRIPTION:0 "Esta misión se completará cuando los andrófagos migratorios, después de atacar y destruir las tierras de sus enemigos, hayan establecido una poderosa #E Horda esteparia#! que gobernará sin oposición."
 androphagia_BUTTON_TOOLTIP:0 "¡Ha llegado el momento de revelarnos al mundo!"
 androphagia_BUTTON_DETAILS: ""
 
 #Missions
 
 androphagia_task_1:0 "Reunión de los devoradores de hombres"
 androphagia_task_1_DESC:0 "Mientras los suaves días del otoño comienzan a entregar su luz y calidez al duro abrazo del invierno, nuestro [ROOT.GetCountry.GetRulerTitle] ha convocado a los jefes de las Grandes Familias a [ROOT.GetCountry.GetCapital.GetName|Y] para discutir el futuro de las tribus [ROOT.GetCountry.GetAdjective].\n\nSe ha elegido un terreno neutral para esta reunión entre los tres Jefes Tribales, y los gobernantes andrófagos se reunirán en [GetProvince('(int32)9346').GetName|Y] para haga un plan para los días venideros.\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 
 androphagia_task_2:0 "Una capital occidental"
 androphagia_task_2_DESC:0 "Se sabe desde hace mucho tiempo que hay ámbar valioso @amber! en los bosques primitivos del lejano oeste, pero no hay muchos que vivan en lugares tan distantes. Se dice que la tierra es dura e implacable, con inviernos amargos y duros y días cortos: el rostro de [GetDeityDefinition('omen_pajewa').GetName|G] permanece oculto a la gente durante muchos meses seguidos.\n\nY, sin embargo, es aquí donde nuestra gente debe ir: ha llegado el momento de apoderarnos de la #T Costa Ámbar#! y su riqueza para nosotros mismos. Incluso podríamos consagrar una capital occidental...\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 
 androphagia_task_3:0 "Bosques de Illmandu"
 androphagia_task_3_DESC:0 "Los rumores eran ciertos: el ámbar @amber! encontrado en esta región es de una calidad excepcional y ha superado las elevadas expectativas de [ROOT.GetCountry.GetRuler.GetName|Y]. Los miembros de nuestra tribu han estado trabajando diligentemente para recolectar la mayor cantidad de ámbar posible, pero todos los jefes están de acuerdo en que debemos buscar más.\n\nSin embargo, hay que hacer una cosa a la vez, y será necesario limpiar el campo densamente boscoso antes de que podamos siquiera pensar en expandir el ámbar @amber! producción.\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 
 androphagia_task_4:0 "Asentando Soodak"
 androphagia_task_4_DESC:0 "Aunque nuestra capital está bien abastecida de ámbar @amber!, queda más por tomar y [ROOT.GetCountry.GetRuler.GetName|Y] está dispuesto a hacer lo que sea necesario para asegurar la prosperidad futura de nuestro pueblo.\n\nLas islas de [GetProvince('(int32)9371').GetName|Y] son ricas y nos pertenecen, y aunque están lejos de nuestras tierras tradicionales, muchos de nuestros miembros de la tribu se han asentado allí. [ROOT.GetCountry.GetRuler.GetFirstName|Y] ha enviado un mensaje a los miembros de nuestras tribus que viven a lo largo de las costas, pidiendo aún más voluntarios que estén dispuestos a abandonar sus asentamientos y migrar a través del agua para dar un paso. Adelante.\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 
 androphagia_task_5:0 "Luchando contra los mantos negros"
 androphagia_task_5_DESC:0 "Aunque [ROOT.GetCountry.GetRuler.GetName|Y] tiene plena fe en la fuerza de nuestras levas, sería tonto negar que los #E #G [GetCountry('MLN').GetName] ns#!#! son una tribu fuerte y son más que capaces de defender sus territorios.\n\nAntes de entrar en batalla con cualquiera de nuestros vecinos, debemos hacer lo que podamos para buscar un aliado en el extranjero: las guerras venideras serán mucho más fáciles si tenemos amigos que nos protejan las espaldas.\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 
 androphagia_task_6:0 "Gestionando nuestras conquistas"
 androphagia_task_6_DESC:0 "En los últimos años, hemos ampliado rápidamente nuestras fronteras, algo que ha enorgullecido a [ROOT.GetCountry.GetRuler.GetName|Y], pero [ROOT.GetCountry.GetRulerTitle] teme que las rebeliones provinciales nos quiten todos los logros que tanto nos costó ganar. Para evitar que suceda lo impensable, se ha decidido que deberíamos dedicar algo de tiempo a desarrollar la tierra.\n\n\n\n\n\n\n\n\n\n\n@italic_mil24!"
 
 androphagia_task_7:0 "Maestros de los melanchlenios"
 androphagia_task_7_DESC:0 "Ahora que hemos conquistado a los #Y [GetCountry('MLN').GetName] ns#!, debemos decidir el estatus de estos extranjeros dentro de la [ROOT.GetCountry.GetAdjective] sociedad; ¿Deberíamos extenderles la mano de la amistad o encerrarlos en grilletes y enviarlos a las minas? [ROOT.GetCountry.GetRuler.GetName|Y] tiene una decisión importante que tomar.\n\n#Y Decidiremos los#! #G Derechos cívicos#! #Y para los#! #T [GetCountry('MLN').GetName] ns#!.\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 
 androphagia_task_8:0 "Cultivando los bosques"
 androphagia_task_8_DESC:0 "Aunque se sabe que nuestro pueblo consume ocasionalmente carne de humanos, nuestra dieta es variada; A pesar de lo que nuestros muchos enemigos dicen sobre nosotros, cultivamos y cuidamos nuestros rebaños, tal como lo hace todo el mundo.\n\nPara mantener nuestros graneros bien abastecidos y nuestra gente alimentada, [ROOT.GetCountry.GetRuler.GetName|Y] ha pedido que se construyan granjas en todo nuestro tierras.\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 
 androphagia_task_9:0 "Jinetes de los bosques sin fin"
 androphagia_task_9_DESC:0 "Aprender a luchar a caballo y guiar tu montura a través del bosque no es una tarea fácil, pero los dioses no nos han dejado otra opción: o nos adaptamos al terreno que nos han dado o perecemos. [ROOT.GetCountry.GetRuler.GetName|Y] ha ordenado a nuestros jinetes entrenar como si estuvieran poseídos por los dioses de la guerra, para que cuando llegue el momento de atacar a nuestros enemigos, sean abrumados por la velocidad y la furia de nuestros agresiones.\n\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 
 androphagia_task_10:0 "Herreros andrófagos"
 androphagia_task_10_DESC:0 "A medida que crece nuestra experiencia en metalurgia y herrería, las oportunidades que antes no estaban disponibles para nosotros se han vuelto inevitables.\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 
 androphagia_task_11:0 "El Puerto De Anoppi"
 androphagia_task_11_DESC:0 "Hay muchas buenas razones para construir un puerto en [GetProvince('(int32)9373').GetName|Y]; está cerca de las rentables fuentes de ámbar @amber! en nuestros bosques, lo que será maravilloso para nuestro comercio, y hay un pequeño puerto natural allí que sería fácil de expandir para nuestros ingenieros. \n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 
 androphagia_task_12:0 "Navegando el Sarmaticus"
 androphagia_task_12_DESC:0 "A medida que nuestros compatriotas se han ido familiarizando cada vez más con las traicioneras aguas del #Y Oceanus Sarmaticus#!, hemos aprendido de muchos asentamientos productores de ámbar @amber! en nuestro sur. Se dice que la calidad de las joyas finas producidas allí rivaliza con la nuestra, algo que [ROOT.GetCountry.GetRuler.GetName|Y] se niega a creer.\n\nEn lugar de permitir que rivales en el comercio de ámbar existan junto a nosotros, nuestro indomable [ROOT.GetCountry.GetRulerTitle] ha declarado que someteremos la costa para la gente de [ROOT.GetCountry.GetName|G].\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 
 androphagia_task_13:0 "ciudad caníbal"
 androphagia_task_13_DESC:0 "A medida que nuestro nombre y fama se extendieron por todo el mundo civilizado, nos enteramos de que los cartógrafos griegos han llamado con desdén a nuestro asentamiento principal '#G Androphagopolis#!', o '#R Ciudad Caníbal#!', en sus mapas. Es obvio que piensan que somos bárbaros, y a menudo somos el blanco de muchas de sus bromas: hay muchas obras representadas en los teatros de [GetProvince('(int32)416').GetName|Y] que retratan a los andrófagos como salvajes ignorantes. \n\n[ROOT.GetCountry.GetRuler.GetName|Y] no le molestan estos insultos, sino que, por el contrario, ha prometido construir una ciudad que rivalice con cualquiera que se encuentre en los reinos de los altivos. Griegos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 
 androphagia_task_14:0 "El circuito ámbar"
 androphagia_task_14_DESC:0 "Para facilitar el transporte fluido de ámbar @amber! hacia y desde nuestro puerto en [GetProvince('(int32)9372').GetName|T], [ROOT.GetCountry.GetRuler.GetName|Y] está tratando de recaudar los fondos necesarios para construir una carretera que conectará los asentamientos de la #T Costa Ámbar#! entre sí.\n\nSi somos capaces de lograr este importante primer paso de construcción de carreteras, entonces seguramente seguirán otros proyectos de infraestructura. Despertar - los ambiciosos sueños [ROOT.GetCountry.GetRuler.GetFirstName] de transportar algún día nuestro ámbar hasta el #Y Ponto Euxinus#!.\n\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 
 androphagia_task_15:0 "Riquezas sin medida"
 androphagia_task_15_DESC:0 "Poco a poco, nos hemos convertido en los amos indiscutibles del comercio del ámbar @amber!; los precios que se fijan en los mercados de [ROOT.GetCountry.GetCapital.GetName|Y] se han convertido en el estándar en todo el mundo civilizado. Barcos de lugares tan lejanos como [GetProvince('(int32)516').GetName|Y] han navegado hasta nuestras aguas para realizar trueques directamente con nuestros comerciantes; un testimonio del prestigio del pueblo [ROOT.GetCountry.GetAdjective].\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
 androphagia_task_16:0 "Santuario de Plata del Sol"
 androphagia_task_16_DESC:0 "Para atraer a la diosa [GetDeityDefinition('omen_pajewa').GetName|G] a que nos recuerde y nos bendiga con su rostro en esta tierra gris y sombría, [ROOT.GetCountry.GetRuler.GetName|Y] ha pedido que se construya un #E Gran Templo#! dentro de [ROOT.GetCountry.GetCapital.GetName|Y] - un #T Santuario de Plata de la Sol#!.\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 
 androphagia_task_17:0 "Dientes de hierro"
 androphagia_task_17_DESC:0 "Hay una frustrante falta de hierro @iron! en los grandes bosques del norte que cubren gran parte de nuestros territorios, y esto hace que el metal que se encuentra en [GetProvince('(int32)8466').GetName|Y] sea aún más valioso.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] tiene visiones de equipar a nuestros soldados con nuevas armas para darles ventaja en la batalla, pero debemos asegurarnos de tener los suministros necesarios. Mano.\n\n\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 
 androphagia_task_18:0 "Un poco del viejo Smash and Grab"
 androphagia_task_18_DESC:0 "La vida de una tribu migratoria nunca es fácil; Nuestros vecinos suelen vernos con una mezcla de miedo y odio, y una vez que se enteran de que comemos carne de humanos, resulta bastante difícil ganarse su confianza, su amistad y su comercio. Los comerciantes harán todo lo posible para evitar nuestros campamentos y tomarán rutas más largas para evitar pasar por nuestro territorio.\n\nCuando se les presentan circunstancias tan difíciles, nuestra gente generalmente ha recurrido a... formas menos sabrosas de ganar dinero. Y los tiempos nunca han sido tan difíciles para los miembros de la tribu de [ROOT.GetCountry.GetName|R]. Afortunadamente para nosotros, hemos oído hablar de muchas ciudades ricas en el sur, ciudades que son fabulosamente ricas, pero que no han invertido en murallas.\n\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 
 androphagia_task_19:0 "Asaltos de Anatolia"
 androphagia_task_19_DESC:0 "Nuestras incursiones exitosas en #T Taurica#! han dado a nuestros reclutas el gusto por las ganancias y el saqueo mal habidos, y las historias contadas por nuestros esclavos del Bósforo sobre las riquezas encontradas en #G Anatolia#! casi han vuelto locos de deseo a nuestros hombres.\n\nPara saciar la sed de sangre de [ROOT.GetCountry.GetRuler.GetHerHis] hombres, [ROOT.GetCountry.GetRuler.GetName|Y] ha dado permiso a nuestras bandas para saquear las ciudades indefensas del sur, al diablo con las consecuencias.\n\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 
 androphagia_task_20:0 "Hambre de cerebros"
 androphagia_task_20_DESC:0 "Aunque hemos construido ilustres #G Academias#! dentro de nuestra capital, existe una notable falta de profesores calificados que trabajen y enseñen en [ROOT.GetCountry.GetCapital.GetName|T], para nuestra eterna vergüenza.\n\nAhora que tenemos una marina adecuada y los medios para hacer algo al respecto, [ROOT.GetCountry.GetRuler.GetName|Y] ha convocado una expedición a las grandes ciudades del Mediterráneo - [GetProvince('(int32)3256').GetName|T], [GetProvince('(int32)416').GetName|T] y [GetProvince('(int32)516').GetName|T] - para ver si podemos reclutar grandes mentes para que vengan a vivir a nuestro reino.\n\n#Y Esto iniciará un evento. Cadena.#!\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 
 androphagia_task_21:0 "Una cuestión de honor"
 androphagia_task_21_DESC:0 "Algunos de nuestros parientes están insinuando que [ROOT.GetCountry.GetRuler.GetName|Y] ha vivido una vida mimada durante los últimos años, pasando [ROOT.GetCountry.GetRuler.GetHerHis] tiempo emitiendo órdenes y decretos de [ROOT.GetCountry.GetCapital.GetName|G] en lugar de luchar junto a nuestros soldados como un verdadero guerrero andrófago.\n\nPara silenciar a estos detractores y demostrar que [ROOT.GetCountry.GetRuler.GetSheHe] no se ha ablandado, [ROOT.GetCountry.GetRuler.GetFirstName|Y] ha prometió batirse en duelo con un rival en combate personal.\n\n\n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 
 androphagia_task_22:0 "La Horda Carmesí"
 androphagia_task_22_DESC:0 "Las antiguas civilizaciones del mundo tiemblan ante la mera mención de nuestro nombre: nuestros guerreros son los destructores de ciudades y los sanguinarios devoradores de inocentes. ¡Que el humo de los templos y pueblos en llamas y el hedor de la carne asada llenen el aire mientras #E #R ¡La Horda Carmesí#!#! consume todo lo que se nos presenta! \n\n\n\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 
 androphagia_task_23:0 "La caza salvaje"
 androphagia_task_23_DESC:0 "Las tensiones de gobernar a nuestros parientes han comenzado a llegar a [ROOT.GetCountry.GetRuler.GetName|Y], así que cuando un grupo de amigos pasó por [ROOT.GetCountry.GetRuler.GetHerHis] alojamiento sin previo aviso con una propuesta, [ROOT.GetCountry.GetRulerTitle] decidió que unos días de relajación eran urgentemente necesarios.\n\n#Y Esto iniciará un evento. Cadena.#!\n\n\n\n\n\n\n\n\n\n\n\n\n@italic_mil7!"
 
 androphagia_task_24:0 "Devoradores de civilización"
 androphagia_task_24_DESC:0 "Los miembros de nuestra tribu conocen los logros de los #G griegos#!, a pesar de que nuestra patria está a miles de kilómetros de distancia de sus ciudades distantes. Se dice que nadie es igual en materia de civilización y, habiendo escuchado esto, [ROOT.GetCountry.GetRuler.GetName|Y] deseó desatar a nuestros asaltantes sobre ellos y destruir todo lo que alguna vez habían tenido. Logrado.\n\n\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 
 androphagia_task_25:0 "Trono de marfil de la luna"
 androphagia_task_25_DESC:0 "[GetDeityDefinition('omen_kuje').GetName|G] ha visitado a [ROOT.GetCountry.GetRuler.GetName|Y] en un sueño con una petición urgente; Para asegurar el futuro de [ROOT.GetCountry.GetName|G] y asegurar que nuestra gente gobierne el reino durante los próximos mil años, el [ROOT.GetCountry.GetRulerTitle] debe construir una fortaleza especial que servirá como el #T Trono de Marfil de la Luna. Diosa#!.\n\n\n\n\n\n\n\n\n\n\n\n\n@italic_mil23!"
 
 androphagia_task_26:0 "La invasión de Escitia"
 androphagia_task_26_DESC:0 "Ahora que hemos destrozado el poder de los #Y [GetCountry('MLN').GetName] ns#!, nuestros jefes se han fijado en destruir los #E #G [GetCountry('SCY').GetName] ns#!#! que viven al sur. Aunque no queríamos involucrarnos en sus asuntos, no podemos permitir que exista una poderosa confederación tribal en nuestro país. Periferia.\n\n\n\n\n\n\n\n\n\n\n\n\n@persia_mil17!"
 
 androphagia_task_27:0 "jefe de jefes"
 androphagia_task_27_DESC:0 "Mientras las ciudades y templos de los #Y griegos#! se reducen a cenizas, [ROOT.GetCountry.GetRuler.GetName|Y] ha convocado una #E #R Gran Invasión de la Estepa#!#! para demostrar la supremacía andrófaga de una vez por todas. Todo.\n\n\n\n\n\n\n\n\n\n\n\n\n@persia_mil20!"
 
 androphagia_task_28:0 "Hijos y soldados escitas"
 androphagia_task_28_DESC:0 "Con la subyugación y destrucción de los #E #G [GetCountry('SCY').GetName] ns#!#! casi asegurada, [ROOT.GetCountry.GetRuler.GetName|Y] ha ordenado que su nobleza se traslade a [ROOT.GetCountry.GetCapital.GetName|T] de inmediato. La reubicación de las familias principales ha ayudado a los andrófagos [ROOT.GetCountry.GetRulerTitle] en [ROOT.GetCountry.GetRuler.GetHerHis] próximo esfuerzo por usurpar el poder escita; Los mejores guerreros de sus tribus serán reunidos en un ejército y obligados a luchar por nosotros.\n\n\n\n\n\n\n\n\n\n\n\n\n@persia_mil15!"
 
 androphagia_task_29:0 "Empuje tracio"
 androphagia_task_29_DESC:0 "#Y [GetCountry('SCY').GetName] ns#!, [ROOT.GetCountry.GetRuler.GetName|Y] ha desatado los ejércitos de #R [ROOT.GetCountry.GetName]#! sobre las ciudades costeras del #Y Ponto. Euxinus#!.\n\n\n\n\n\n\n\n\n\n\n\n\n@persia_mil4!"
 
 androphagia_task_30:0 "Esclavos de la estepa"
 androphagia_task_30_DESC:0 "Mientras empezamos a familiarizarnos con los asuntos de las tribus que viven en las llanuras, hemos oído hablar de una ciudad llamada [GetProvince('(int32)4557').GetName|T] donde se venden esclavos de las estepas. Tiene curiosidad por estos rumores y [ROOT.GetCountry.GetRuler.GetName|Y] se pregunta si hay buenas ofertas que se puedan hacer. Realizado.\n\n\n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 
 androphagia_task_31:0 "Reemplazar a los fennicos"
 androphagia_task_31_DESC:0 "Las tribus #T Fennic#! que viven a lo largo de las costas del #Y Oceanus Sarmaticus#! y las marismas heladas de la #T Hiperbórea#! occidental están adoptando lenta pero seguramente nuestras costumbres y tradiciones, y su número cada vez menor es un signo de la creciente supremacía andrófaga en el región.\n\n\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 
 androphagia_task_32:0 "Herramientas de hierro excedentes"
 androphagia_task_32_DESC:0 "Lo que alguna vez fue escaso en nuestro reino ahora se ha convertido en algo común, y [ROOT.GetCountry.GetRuler.GetName|Y] tiene el placer de decidir cómo se utilizará nuestro excedente de implementos de hierro @iron! con [ROOT.GetCountry.GetName|T].\n\n\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"

 androphagia_task_33:0 "Deleitándose con la carne"
 androphagia_task_33_DESC:0 "Para honrar a nuestros antepasados y defender las antiguas tradiciones de nuestros parientes, [ROOT.GetCountry.GetRuler.GetName|Y] ha decretado que se celebrará una #R Gran Fiesta#! en [ROOT.GetCountry.GetCapital.GetName|T], enviando ondas de terror por todo nuestro país. Reino.\n\n\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 
 #Tooltips
 androphagia_tt3:0 "Debemos tener #Y 2#! #T Jefes de clan#! con una lealtad de al menos #E 75#!."
 importing_capital_wood_tt:0 "Necesitamos importar #bold #Y Madera#!#! @wood! a nuestra capital."
 importing_capital_leather_tt:0 "Necesitamos importar #bold #Y Cuero#!#! @leather! a nuestra capital."
 we_need_fast_sea_raid_tt:0 "#Y Necesitamos la#! #T Tradición militar báltica#! #G Incursiones rápidas en el extranjero.#!"
 androphagian_amber_total_svalue_tt:0 "Debemos producir al menos #Y #bold 10 ámbar#!#! @amber! en nuestra nación. (#R [SCOPE.ScriptValue('androphagian_amber_total_svalue')|0]#!/#Y 10#!)"
 importing_capital_stone_tt:0 "Necesitamos importar #bold #Y Piedra#!#! @stone! a nuestra capital."
 importing_capital_glass_tt:0 "Necesitamos importar #bold #Y Vidrio#!#! @glass! a nuestra capital."
 importing_capital_precious_metals_tt:0 "Necesitamos importar #bold #Y Metales preciosos#!#! @precious_metals! a nuestra capital."
 importing_capital_marble_tt:0 "Necesitamos importar #bold #Y Mármol#!#! @marble! a nuestra capital."
 androphagia_1_ally_tt:0 "Necesitamos tener al menos #Y 1#! aliado."
 pajewa_omen_active_tt:0 "La androfagia tiene el #Y Pajewa Omen#! #T Activo#!."
 build_4_farms_in_androphagia_tt:0 "Necesitamos poseer #Y 4#! granjas dentro de nuestro país."
