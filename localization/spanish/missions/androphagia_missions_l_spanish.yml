 #Events
 androphagian_1_title:0 "$androphagia_task_1$"
 androphagian_1_desc:0 "Cuando [ROOT.GetCountry.GetRuler.GetName] envió un mensaje por primera vez a [ROOT.GetCountry.GetRuler.GetHerHis] sus homólogos solicitando una reunión, [SCOPE.sCharacter('clan_chief_one').GetName] y [SCOPE.sCharacter('clan_chief_two').GetName] sospechaban de las intenciones de [ROOT.GetCountry.GetRulerTitle] y pidieron reunirse en el desierto, lejos de los impuestos que vivían cerca de [ROOT.GetCountry.GetCapital.GetName]. Cuando llegó el día señalado, los tres cabalgaron hasta los límites de [ROOT.GetCountry.GetName] y se encontraron en el bosque. Todos permanecieron a caballo, cada uno mirando cautelosamente a los demás.\n\n'¿Por qué nos has convocado aquí, o [ROOT.GetCountry.GetRuler.GetFirstName]?' gruñó [SCOPE.sCharacter('clan_chief_one').GetFirstName]. 'Hay mucho trabajo por hacer preparándose para el invierno: los días se acortan, al igual que mi paciencia para este tipo de reuniones.'\n\n'Cállate y recuerda tu lugar, hijo de los [SCOPE.sCharacter('clan_chief_one').GetFamilyDisplayAdjective], y escucha mis palabras. No te llamé aquí sin un propósito.'\n\nÚltimamente, [ROOT.GetCountry.GetRuler.GetFirstName] había estado recibiendo extrañas visiones en [ROOT.GetCountry.GetRuler.GetHerHis] sueños, y después de consultar con el Sabio, el significado de estas pesadillas fue revelado. Pronto se desataría sobre el mundo un período de caos; Los imperios se harían añicos y nacerían de nuevo, y los andrófagos, olvidados por todos en los márgenes del mundo, prosperarían en los días venideros, pero sólo si se tomaban medidas audaces.\n\n'Como líderes de nuestro pueblo, somos responsables de lo que le sucede a la androfagia. Los dioses nos han ordenado aprovechar el momento y, sin embargo, no veo qué es lo que debemos lograr.'\n\n'Guerra.' graznó [SCOPE.sCharacter('clan_chief_one').GetFirstName] con voz sombría, escupiendo en el suelo. 'Cabalguemos hacia el sur y quememos las ciudades de [GetCountry('MLN').GetName] y esclavicemos a sus mujeres y niños.'\n\nSacudiendo la cabeza en señal de desacuerdo, [SCOPE.sCharacter('clan_chief_two').GetFirstName] habló por primera vez. \"Yo también he tenido visiones de aguas interminables hacia el oeste, en una tierra donde riquezas inimaginables esperan a nuestras tribus\". Buscando a tientas en su túnica, [SCOPE.sCharacter('clan_chief_two').GetFirstName] sacó una pequeña baratija de color ámbar @amber!; una imagen grabada de un pequeño oso que colgaba de su cuello. \"Se sabe que el ámbar se puede encontrar en los bosques occidentales; debemos descubrir la fuente por nosotros mismos.\"\n\nEn ese mismo momento, un viento helado sopló a través del bosque sombreado y los primeros copos de nieve de la temporada comenzaron a caer. Temblando a pesar de [ROOT.GetCountry.GetRuler.GetHerHim] yo mismo, [ROOT.GetCountry.GetRuler.GetFirstName] miró al cielo y habló en voz baja."
 androphagian_1.a:0 "Entonces, migremos hacia el noroeste y colonicemos primero la Costa Ámbar."
 androphagian_1.b:0 "Nos quedamos donde estamos y nos preparamos para la batalla contra los melanchlenios."
 androphagian_1.c:0 "Este invierno promete ser difícil; deberíamos agacharnos"
 androphagian_1.d:0 "Ofrecer un sacrificio a los dioses y dejar que nos digan qué hacer."
 androphagian_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_1$#!' $mission_completed_tooltip_2$"
 androphagian_1a_tooltip:0 "#Y Nuestro jefe tribal ofrecerá un sacrificio y solicitará#! #T Visi#! #Y para pedir guía divina. Dentro de un mes recibiremos una respuesta.#!"
 
 androphagian_2_title:0 "$androphagia_task_2$"
 androphagian_2_desc:0 "Aunque la larga migración hacia el oeste fue difícil para las tribus, especialmente para los más jóvenes, [ROOT.GetCountry.GetRuler.GetName] se enorgulleció de ver que los cordiales andrófagos no se quejaron, sino que aceptaron las órdenes de los [ROOT.GetCountry.GetRulerTitle] sin cuestionar. Su obediencia fue recompensada, porque la gente pronto descubrió grandes cantidades de ámbar @amber!, y una avalancha de oro se vertió en las tesorerías.\n\nEstas nuevas tierras no eran muy diferentes de los bosques que habían dejado, después de todo, y con el tiempo, [ROOT.GetCountry.GetRuler.GetFirstName] no tenía ninguna duda de que [ROOT.GetCountry.GetRuler.GetHerHis] sus parientes abrazarían sus nuevos hogares. Cuando las tribus vieron por primera vez las interminables aguas del #E Oceanus Sarmaticus#!, algunos se aterrorizaron y otros quedaron extrañamente fascinados; tales misterios eran desconocidos para sus antepasados, y muchos no podían creer lo que veían... ¿cómo podría ser posible algo así?\n\nCuando los parientes [ROOT.GetCountry.GetRuler.GetHerHis] comenzaron a construir refugios, [ROOT.GetCountry.GetRuler.GetFirstName] recordó un asesor de un tema espinoso: la ubicación de la capital. ¿Estaba [ROOT.GetCountry.GetRuler.GetSheHe] contento con el status quo o le gustaría a [ROOT.GetCountry.GetRulerTitle] elegir otro sitio? Sería imposible complacer a todos, pero habría que tomar esas decisiones."
 androphagian_2.a:0 "¡Parna será el sitio de nuestra nueva capital!"
 androphagian_2.b:0 "Los bosques de Saicen serán donde nos asientemos."
 androphagian_2.c:0 "No me molestes con esas cosas ahora mismo."
 androphagian_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_2$#!' $mission_completed_tooltip_2$"
 
 androphagian_3_title:0 "$androphagia_task_3$"
 androphagian_3_desc:0 "Desde el primer momento en que llegaron al oeste, los andrófagos enviaron cientos de trabajadores a los bosques con hachas y sierras, y la quietud de los bosques helados resonaba día tras día con el estruendo de los árboles que caían. Necesitaban domesticar los bosques si querían recolectar más ámbar de manera eficiente @amber!.\n\nLos miembros de la tribu trabajaron incansablemente, pero ni siquiera su entusiasmo desenfrenado podía igualar la enormidad de la tarea en cuestión; simplemente había demasiadas cosas que las tribus podían asumir por sí solas y algunas personas, como [SCOPE.sCharacter('clan_chief_one').GetName], comenzaron a quejarse de que se estaba perdiendo demasiado tiempo. Los andrófagos eran guerreros y no carpinteros, [SCOPE.sCharacter('clan_chief_one').GetFirstName] se quejó, y muchos empezaban a escuchar las quejas. Y, sin embargo, [ROOT.GetCountry.GetRuler.GetFirstName] prometió que todos verían los beneficios de tales iniciativas.\n\nLa pregunta que preocupaba a [ROOT.GetCountry.GetRuler.GetFirstName] era qué se debía hacer con todo el exceso de madera extraída del bosque. La idea de [SCOPE.sCharacter('clan_chief_two').GetFirstName] era construir ciudades temporales de madera para albergar a los trabajadores, cada vez más numerosos. Los andrófagos normalmente eran reacios a construir estructuras permanentes y, sin embargo, no había otra manera, subrayó [SCOPE.sCharacter('clan_chief_two').GetFirstName]. Por otro lado, [SCOPE.sCharacter('clan_chief_one').GetFirstName] quería que la madera se transformara en barcos, ideales para nuevas incursiones contra nuestros vecinos."
 androphagian_3.a:0 "Esta difícil labor construirá ciudades para nuestro pueblo."
 androphagian_3.b:0 "Recojamos la madera @wood! de la tierra y expandámonos sobre los mares."
 androphagian_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_3$#!' $mission_completed_tooltip_2$"
 
 androphagian_4_title:0 "$androphagia_task_4$"
 androphagian_4_desc:0 "Aunque actualmente tenemos un excedente de ámbar @amber!, los ingresos que obtenemos de su comercio han demostrado ser demasiado adictivos.\n\nLa colonización de [GetProvince('(int32)9371').GetName] solo alimentó aún más las ambiciones de [ROOT.GetCountry.GetRuler.GetFirstName], quien decidió redoblar sus esfuerzos para encontrar más ámbar. A pesar de la falta de voluntad de algunos, [ROOT.GetCountry.GetRuler.GetFirstName] convirtió gran parte de nuestras reservas de mano de obra en un cuerpo masivo de exploradores. A estos hombres se les ha encomendado la tarea de peinar cada centímetro de la frontera, para garantizar que cuando construyamos nuestros próximos asentamientos, sean tan lucrativos como los anteriores."
 androphagian_4.a:0 "El tiempo es esencial cuando se puede ganar dinero"
 androphagian_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_4$#!' $mission_completed_tooltip_2$"
 
 androphagian_5_title:0 "$androphagia_task_5$"
 androphagian_5_desc:0 "Con la batalla contra los #E [GetCountry('MLN').GetName] ns#! siendo una conclusión inevitable, los andrófagos comenzaron a prepararse para el inevitable choque con un enemigo superior que claramente superaba en número a sus fuerzas. El [ROOT.GetCountry.GetRulerTitle] creía que la victoria sería [ROOT.GetCountry.GetRuler.GetHerHis] de todos modos, pero comenzó a preguntarse si sería prudente buscar aliados.\n\nConsciente de nuestra temible reputación, [ROOT.GetCountry.GetRuler.GetName] decidió hacer todo lo necesario para asegurar la amistad de [ROOT.GetCountry.GetName], y estas propuestas diplomáticas fueron recompensadas a tiempo.\n\nDesafortunadamente para nuestro Socios recién descubiertos, no sabían que [ROOT.GetCountry.GetRuler.GetFirstName] esperaba ver sus fuerzas aplastadas por nuestros enemigos mientras nuestras propias tropas saqueaban los asentamientos de nuestros enemigos."
 androphagian_5.a:0 "Prefiero ver a un amigo muerto que a un andrófago caído..."
 androphagian_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_5$#!' $mission_completed_tooltip_2$"
 
 androphagian_6_title:0 "$androphagia_task_6$"
 androphagian_6_desc:0 "Los dioses de la guerra han bendecido a [ROOT.GetCountry.GetRuler.GetName] con la victoria, y las fronteras de [ROOT.GetCountry.GetName] se han hinchado como el estómago de una yegua preñada; nunca en nuestra historia hemos gobernado un dominio tan grande.\n\nPrometiendo dar a nuestras tropas endurecidas por la batalla algo de tiempo para descansar y disfrutar de sus triunfos, [ROOT.GetCountry.GetRuler.GetFirstName] ha pasado los últimos meses gestionando los asuntos de estado. Conquistar y someter es una cosa y gobernar un reino estable es otra, y el [ROOT.GetCountry.GetRulerTitle] deseaba ser conocido como el mayor gobernante en la historia de las tribus."
 androphagian_6.a:0 "Seré un fiel administrador de la tierra."
 androphagian_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_6$#!' $mission_completed_tooltip_2$"
 
 androphagian_7_title:0 "$androphagia_task_7$"
 androphagian_7_desc:0 "Una vez que los alborotadores que vivían entre los #E [GetCountry('MLN').GetName] ns#! conquistados fueron ejecutados y devorados, quedó la pregunta de cuál debería ser el estatus cívico de los miembros de las tribus vencidos.\n\nNaturalmente, el temible [SCOPE.sCharacter('clan_chief_one').GetName] tenía una opinión y exigió que todos fueran enviados a las minas, proclamando en voz alta que [SCOPE.sCharacter('clan_chief_one').GetSheHe] y Los parientes [SCOPE.sCharacter('clan_chief_one').GetHerHis] nunca aceptarían a un melanchleniano como igual.\n\n[SCOPE.sCharacter('clan_chief_two').GetName] sugirió un curso más prudente, argumentando que sería mejor para nuestros ejércitos si concediéramos la ciudadanía a los orgullosos guerreros."
 androphagian_7.a:0 "Nuestras propias fuerzas se verían enormemente fortalecidas si nos uniéramos"
 androphagian_7.b:0 "El estado natural de los melanchlenianos es la esclavitud."
 androphagian_7.c:0 "Pensándolo bien, dejaré todo como está."
 androphagian_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_7$#!' $mission_completed_tooltip_2$"
 
 androphagian_8_title:0 "$androphagia_task_8$"
 androphagian_8_desc:0 "Cultivar cultivos en el bosque es una tarea difícil en el mejor de los casos y, sin embargo, nuestros parientes andrófagos han sobresalido donde todos los demás han fracasado. Se han limpiado grandes extensiones de tierra para poder construir granjas y, mientras se recogen las cosechas por primera vez, todos aplauden la sabiduría de [ROOT.GetCountry.GetRuler.GetName] por financiar la iniciativa de construcción."
 androphagian_8.a:0 "Los verdaderos héroes aquí son nuestros agricultores; alábalos a ellos, no a mí"
 androphagian_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_8$#!' $mission_completed_tooltip_2$"
 
 androphagian_9_title:0 "$androphagia_task_9$"
 androphagian_9_desc:0 "Durante los últimos meses, nuestros jinetes han estado entrenando más duro que nunca. Nuestros guerreros abandonan sus chozas mucho antes de que salga el sol, guiando sus monturas a través de los bosques oscuros y trabajando para perfeccionar técnicas de batalla que otros considerarían imposibles de ejecutar. Los resultados hablan por sí solos; Nuestros guerreros se mueven rápidamente a través de los densos bosques, atravesando el difícil terreno tan fácilmente como lo harían por la estepa vacía.\n\nPor la noche, cuando los cansados ​​soldados regresan a casa en sus exhaustas monturas, pasan las horas restantes discutiendo cómo pueden mejorar sus tácticas: sus mentes están completamente concentradas en ser los mejores jinetes posibles."
 androphagian_9.a:0 "Nuestros enemigos nunca podrán seguir el ritmo de nuestra caballería."
 androphagian_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_9$#!' $mission_completed_tooltip_2$"
 
 androphagian_10_title:0 "$androphagia_task_10$"
 androphagian_10_desc:0 "Nuestros herreros se mantienen ocupados mientras el Orbe de [GetDeityDefinition('omen_pajewa').GetName|E] brilla en el cielo, y el humo de sus forjas mantiene los cielos arriba [ROOT.GetCountry.GetCapital.GetName] llenos de hollín y ceniza. A medida que su experiencia y conocimiento del trabajo con metal han aumentado, también ha aumentado su capacidad para producir artículos de calidad excepcional, y todo [ROOT.GetCountry.GetName] se ha beneficiado."
 androphagian_10.a:0 "Somos los afortunados beneficiarios de su talento."
 androphagian_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_10$#!' $mission_completed_tooltip_2$"
 
 androphagian_11_title:0 "$androphagia_task_11$"
 androphagian_11_desc:0 "Hace unas generaciones, algunos de nuestro pueblo nunca antes habían visto el océano, pero hoy, los primeros marineros andrófagos de nuestra historia zarpan en el viaje inaugural de nuestra armada. Siempre dispuesto a adaptarse a cualquier situación que se presente, [ROOT.GetCountry.GetRuler.GetName] considera que este momento es fundamental para nuestro futuro. El puerto construido en [GetProvince('(int32)9373').GetName] marca un nuevo día en nuestra historia, un día en el que ya no estamos atados a la tierra, sino que somos dueños de nuestro propio destino."
 androphagian_11.a:0 "Que la Madre de las Aguas navegue junto a nosotros"
 androphagian_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_11$#!' $mission_completed_tooltip_2$"
 
 androphagian_12_title:0 "$androphagia_task_12$"
 androphagian_12_desc:0 "Nuestros parientes estudian rápido y se han convertido en marineros decentes desde que construimos nuestro primer puerto, y a medida que su confianza ha aumentado, también lo ha hecho su voluntad de asumir riesgos.\n\n Cuando nos enteramos de que había ricos depósitos de ámbar @amber! en la región [GetProvince('(int32)4865').GetArea.GetRegion.GetName], a nuestras armadas se les asignó la tarea de transportar tropas para tomar estos territorios costeros para [ROOT.GetCountry.GetName]. A decir verdad, a [ROOT.GetCountry.GetRuler.GetName] no le importaba a quién atacaran nuestras fuerzas, siempre y cuando un flujo constante de oro y esclavos siguiera fluyendo hacia [ROOT.GetCountry.GetCapital.GetName]."
 androphagian_12.a:0 "¡Pronto seremos los Señores del Sarmaticus!"
 androphagian_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_12$#!' $mission_completed_tooltip_2$"
 
 androphagian_13_title:0 "$androphagia_task_13$"
 androphagian_13_desc:0 "En un gesto benevolente que sería recordado en los Anales de los Andrófagos para siempre, [ROOT.GetCountry.GetRuler.GetName] se ofreció como voluntario para pagar él solo la construcción de una ciudad, una verdadera capital andrófaga, que rivalizaría con las ciudades ricas y prósperas del mundo mediterráneo.\n\nNunca antes en su historia un [ROOT.GetCountry.GetRulerTitle] había hecho algo así por las tribus; Los andrófagos estaban acostumbrados a asaltar y saquear ciudades y no construirlas, pero [ROOT.GetCountry.GetRuler.GetFirstName] decidieron que esto debía cambiar.\n\nCuando los Ancianos nos preguntaron si deberíamos llamar a la ciudad [ROOT.GetCountry.GetRuler.GetFirstName] polis, [ROOT.GetCountry.GetRuler.GetSheHe] simplemente se rió y dijo que nuestra capital sería conocida por el nombre insultante que le dieron los griegos."
 androphagian_13.a:0 "La majestuosa ciudad de Androphagopolis será mi verdadero legado."
 androphagian_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_13$#!' $mission_completed_tooltip_2$"
 
 androphagian_14_title:0 "$androphagia_task_14$"
 androphagian_14_desc:0 "Aunque nuestros indomables parientes sobresalen en muchas cosas, podemos admitir que nuestros ingenieros no son tan avanzados como los demás; simplemente no sabemos tanto sobre técnicas de construcción como otros reinos o repúblicas.\n\nEste hecho innegable hace que la construcción de una carretera a lo largo de la provincia de [GetProvince('(int32)9373').GetArea.GetName] sea aún más notable. Aunque fue costoso y llevó nuestra experiencia al límite, una vez más logramos lo imposible."
 androphagian_14.a:0 "Nuestros arquitectos realmente se han superado esta vez"
 androphagian_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_14$#!' $mission_completed_tooltip_2$"
 
 androphagian_15_title:0 "$androphagia_task_15$"
 androphagian_15_desc:0 "El floreciente comercio de ámbar @amber! ha hecho que nuestro pueblo sea más rico que nunca, y algunos de los más ancianos entre nosotros lamentan este hecho. Afirman que la afluencia de riqueza hará que nuestro pueblo olvide las virtudes andrófagas apropiadas, haciéndonos suaves y débiles como las naciones que hemos destruido.\n\nEstas voces son ahogadas por un creciente coro de juerga y decadencia; Se consumen vinos extranjeros, se leen pergaminos y aparecen prendas de seda en los mercados de [ROOT.GetCountry.GetCapital.GetName]."
 androphagian_15.a:0 "Las cosas buenas de la vida están hechas para disfrutarlas."
 androphagian_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_15$#!' $mission_completed_tooltip_2$"
 
 androphagian_16_title:0 "$androphagia_task_16$"
 androphagian_16_desc:0 "Aunque nuestros compatriotas han vivido en [ROOT.GetCountry.GetCapital.GetName] durante bastante tiempo, muchos de los nuestros, especialmente aquellos que recuerdan la vida antes de nuestras migraciones, nunca se han adaptado a los días más cortos aquí. El Orbe de [GetDeityDefinition('omen_pajewa').GetName|E] no ilumina el cielo por mucho tiempo durante los inviernos, y nuestra gente a veces teme que la Diosa del Sol nos abandone para morir en estos sombríos páramos del norte.\n\nEn un esfuerzo por tranquilizar las mentes de la gente, [ROOT.GetCountry.GetRuler.GetName] ha pedido que se construya un gran templo dentro de nuestra capital, un #E Santuario de Plata del Sol#! que servirá como hogar para Pajewa.\n\nUna vez que se completó el templo, ocurrió algo milagroso, algo que nuestros ancestros dudarían pero que realmente sucedió; El día de la consagración del Santuario, el Sol nunca se ponía, sino que permanecía brillando intensamente sobre la capital."
 androphagian_16.a:0 "¡Nuestros esfuerzos aquí son recompensados por Pajewa! ¡Salve a la Diosa del Sol!"
 androphagian_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_16$#!' $mission_completed_tooltip_2$"
 
 androphagian_17_title:0 "$androphagia_task_17$"
 androphagian_17_desc:0 "El hierro @iron! es increíblemente difícil de conseguir en los bosques del norte, por lo que se siente como una obligación para [ROOT.GetCountry.GetRuler.GetName] aprovechar lo que los dioses han proporcionado a la gente de [ROOT.GetCountry.GetName].\n\n Rápidamente se construyó una mina y se enviaron esclavos a sus profundidades, enviando flujos constantes del valioso mineral a los herreros de [ROOT.GetCountry.GetCapital.GetName]. Gracias a la disponibilidad de este valioso bien comercial, nuestras forjas avanzan a un ritmo que habría sido inimaginable hace una generación."
 androphagian_17.a:0 "¿Quién puede hacer frente a nuestros hombres, equipados como están?"
 androphagian_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_17$#!' $mission_completed_tooltip_2$"
 
 androphagian_18_title:0 "$androphagia_task_18$"
 androphagian_18_desc:0 "Cuando [ROOT.GetCountry.GetRuler.GetName] se enfrentó a un difícil dilema (el [ROOT.GetCountry.GetRulerTitle] necesitaba grandes cantidades de oro para financiar las [ROOT.GetCountry.GetRuler.GetHerHis] ambiciones) [ROOT.GetCountry.GetRuler.GetSheHe] recurrió a un viejo pasatiempo andrófago; el saqueo de ciudades.\n\nPor una vez, todos los jefes estaban de acuerdo, y las ciudades indefensas de los #E griegos del Bósforo#! eran blancos fáciles. Nuestros asaltantes victoriosos saquearon y quemaron a su antojo, y se depositaron sumas considerables en las tesorerías de [ROOT.GetCountry.GetCapital.GetName]."
 androphagian_18.a:0 "¡Toma todo lo que puedas llevar y mata todo lo que no puedas!"
 androphagian_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_18$#!' $mission_completed_tooltip_2$"
 
 androphagian_19_title:0 "$androphagia_task_19$"
 androphagian_19_desc:0 "Al principio, los miembros de nuestra tribu no creían las historias de los #E esclavos griegos del Bósforo#! que habían tomado de sus ciudades costeras, descartando sus historias como mentiras desesperadas destinadas a llevar a nuestros asaltantes a una trampa. Y, sin embargo, las noticias del puñado de comerciantes que viajaban a nuestros mercados parecían confirmar la noticia; guerras devastadoras habían traído miseria y caos a la rica tierra de #E Anatolia#! en el sur.\n\nCon el tiempo, la verdad se fue revelando gradualmente, en todo su grotesco esplendor; el imperio de los #E aqueménidas#! había sido destruido por los #E macedonios#!, y la guerra civil y la ruina habían sumido al mundo helénico y persa en el caos: música para los oídos codiciosos de nuestras levas, que deseaban aumentar la miseria de los anatolios lanzando una incursión devastadora en su ciudades.\n\n[ROOT.GetCountry.GetRuler.GetName] ni siquiera tuvo que preguntar a [ROOT.GetCountry.GetRuler.GetHerHis] los jefes si estaban preparados para aprovechar esta situación; Por supuesto que lo eran, y las canciones que se cantaron sobre su glorioso ataque por toda Anatolia se convirtieron en leyendas."
 androphagian_19.a:0 "¡Nadie puede impedirnos tomar lo que queremos!"
 androphagian_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_19$#!' $mission_completed_tooltip_2$"
 
 androphagian_20_title:0 "$androphagia_task_20$"
 androphagian_20_desc:0 "En un esfuerzo por aumentar la sabiduría de nuestro pueblo, se ha decidido que enviaremos nuestros barcos a las famosas ciudades del Mediterráneo - [GetProvince('(int32)3256').GetName], [GetProvince('(int32)416').GetName] y [GetProvince('(int32)516').GetName] - para buscar el consejo de sus sabios. Si tenemos suerte, encontraremos algunos tutores que estén dispuestos a dejar sus ciudades y venir a vivir entre nuestra gente, pero sólo los dioses saben lo que nos deparará este viaje."
 androphagian_20.a:0 "Mañana zarpamos hacia [GetProvince('(int32)3256').GetName]"
 androphagian_20_tooltip:0 "#Y La cadena de eventos continuará.#!"
 
 androphagian_24_title:0 "$androphagia_task_24$"
 androphagian_24_desc:0 "Y así sucedió lo inevitable; los asaltantes de [ROOT.GetCountry.GetName] no estaban satisfechos con sus muchas victorias sobre los pueblos asentados, y los jefes tribales bajo [ROOT.GetCountry.GetRuler.GetName] agitaron por medidas más drásticas que cimentarían nuestra reputación como destructores. Después de haber incendiado muchas ciudades de #E Anatolia#!, los guerreros andrófagos hicieron otra petición audaz a [ROOT.GetCountry.GetRuler.GetFirstName], una que [ROOT.GetCountry.GetRuler.GetSheHe] aprobó rápidamente.\n\nDesde hace muchos años, hemos tenido contactos comerciales con los #E helenos#!, y aunque hay algunos en nuestra sociedad que los admiran, la mayoría de Nuestro pueblo piensa que los griegos son engreídos. Creen que su cultura es superior a la de todos los demás y, a menudo, miran con desprecio a quienes viven a su alrededor como los llamados #E Barbaroi#!, o 'bárbaros'.\n\nSe convirtió en obligación de [ROOT.GetCountry.GetName], entonces, enseñar a estos altivos habitantes de las ciudades una o dos lecciones, y nuestros ejércitos lanzaron una invasión de su tierra natal, arrasando ciudades y matando a decenas de personas. De miles de personas.\n\nEn los siglos venideros, los andrófagos serían recordados como #E 'La perdición de Hellas'#!, y ningún otro invasor causaría tanta destrucción sin sentido como lo había hecho nuestro pueblo."
 androphagian_24.a:0 "Soy el azote de los dioses, enviado para causar estragos en ti."
 androphagian_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_24$#!' $mission_completed_tooltip_2$"
 
 androphagian_25_title:0 "$androphagia_task_25$"
 androphagian_25_desc:0 "El gran edificio que llegó a ser conocido como #E 'El Trono de Marfil de la Luna'#!, construido en el corazón de [ROOT.GetCountry.GetCapital.GetName], pronto se convirtió en una estructura icónica asociada con nuestra capital de la feria. Los andrófagos creen que este edificio es el hogar terrenal de [GetDeityDefinition('omen_kuje').GetName|E], y se sabe que la Diosa de la Luna duerme ocasionalmente en la cámara central de la fortificación. No se permiten mortales dentro del edificio por esta misma razón, y los guardias patrullan los parámetros del edificio todas las horas del día para asegurarse de que nadie moleste a la diosa mientras duerme."
 androphagian_25.a:0 "[GetDeityDefinition('omen_kuje').GetName|E] tendrá su descanso"
 androphagian_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_25$#!' $mission_completed_tooltip_2$"
 
 androphagian_26_title:0 "La Horda Carmesí"
 androphagian_26_desc:0 "Aunque [ROOT.GetCountry.GetRuler.GetName] ha tenido [ROOT.GetCountry.GetRuler.GetHerHis] una buena cantidad de detractores, muchas de las voces que más se quejaron de las órdenes del temible guerrero ahora yacen postradas en el suelo mientras el sonido del tambor llena el aire. Todos han sido convocados a [ROOT.GetCountry.GetCapital.GetName] para prestar juramentos de lealtad a la familia gobernante.\n\nNunca antes en nuestra historia nadie había logrado lo que [ROOT.GetCountry.GetRuler.GetFirstName] ha logrado, y bajo el gobierno de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective], hemos conquistado y destruido todo lo que se nos presentó. Ya no somos una tribu atrasada que vive en las afueras del mundo; Somos una horda con un nombre temido incluso en lugares tan lejanos como #E India#!. Hemos quemado las ciudades de nuestros enemigos y saqueado sus campamentos, y nuestro pueblo se ha dado un festín con la carne de sus enemigos. El mundo tiembla ante los jinetes de #E The Crimson Horde#! y su [ROOT.GetCountry.GetRulerTitle]."
 androphagian_26.a:0 "Inclínate ante mí y besa el suelo, yo lo ordeno."
 androphagian_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y La Horda Carmesí#!' $mission_completed_tooltip_2$"
 
 androphagian_29_title:0 "Piratas en los pilares"
 androphagian_29_desc:0 "Después de muchas semanas de navegación sin incidentes, nuestra flota finalmente llegó a los famosos #E Pilares de Heracles#! - la entrada al #E Mediterráneo#!. Cuando la escarpada costa apareció a la vista, se escucharon gritos de emoción a bordo de los barcos mientras nuestros marineros vitoreaban, pero segundos después, estos gritos de alegría se convirtieron en aullidos de miedo cuando una enorme #E Armada Pirata#! rodeó los Pilares.\n\nLos veloces piratas liburnios pronto rodearon nuestra flota y se envió un mensaje al buque insignia: si deseábamos un paso seguro dentro y fuera de el Mediterráneo, entonces tendríamos que pagar por ese privilegio."
 androphagian_29.a:0 "No morderemos el anzuelo, sigue navegando"
 androphagian_29.b:0 "¡Si quieren sangre, la conseguirán!"
 androphagian_29.c:0 "Paga su 'peaje' y sigue moviéndote"
 androphagian_29_tooltip:0 "#Y La cadena de eventos continuará.#!"
 androphagian_29a_tooltip:0 "#R Los piratas mataron a muchos de nuestros marineros, pero logramos zarpar.#!"
 androphagian_29b_tooltip:0 "#R Nuestros marineros lucharon valientemente contra el ataque pirata, a pesar de que muchos de nuestros hombres resultaron heridos.#!"
 
 androphagian_30_title:0 "La gran ciudad de Qart Hadasht"
 androphagian_30_desc:0 "Por fin, después de meses de navegación, nuestra armada finalmente llegó a su primer puerto de escala; [GetProvince('(int32)3256').GetName]. Cuando nuestra flota llegó a las afueras del #E Grand Cothon#!, un barco cartaginés zarpó para encontrarse con el nuestro, y una vez que supieron que éramos de [ROOT.GetCountry.GetName], nos negaron la entrada a su puerto, para disgusto de [ROOT.GetCountry.GetRuler.GetName], quien tuvo que calmar a las [ROOT.GetCountry.GetRuler.GetHerHis] tropas para que no se amotinaran en ese momento y allí.\n\nUna lección que [ROOT.GetCountry.GetRuler.GetFirstName] había aprendido hacía mucho tiempo resultó aplicable en esta situación, y después de que se les ofreció un saludable soborno, los púnicos permitieron que un pequeño grupo de nuestros hombres entraran a su mercado, pero tendríamos que abandonar la ciudad antes de que se pusiera el sol.\n\nAsí, con una mano en [ROOT.GetCountry.GetRuler.GetHerHis] el monedero, el [ROOT.GetCountry.GetRulerTitle] deambulaba entre la multitud. Calles junto a un intérprete que se les había proporcionado. Fue una bendición tener a alguien mostrando el camino a nuestros hombres, porque la conmoción en el centro era abrumadora. Había cientos de talleres llenos de empresarios intrigantes, cada uno de los cuales elogiaba sus propios productos como el pináculo del logro humano y juraba que tenían los mejores precios de toda África.\n\nAl notar las baratijas de ámbar @amber! que llevaban nuestros hombres, algunos nobles pidieron a [ROOT.GetCountry.GetRuler.GetFirstName] que firmara contratos comerciales en ese momento, prometiendo pagar generosamente por el derecho a comprarnos directamente a nosotros. Ahuyentando a estos buitres, el guía llevó a nuestro grupo al #E Templo de Tanit#! para que pudieran hacer ofrendas, y mientras estaban allí, [ROOT.GetCountry.GetRuler.GetFirstName] notó que llegaba un gran grupo de jinetes, mercenarios que acababan de terminar su contrato y estaban en la ciudad para presentar sus respetos a la diosa por traerlos a casa sanos y salvos.\n\nEl calor abrasador del sol del mediodía era un recordatorio de que tendrían que irse pronto, y [ROOT.GetCountry.GetRuler.GetFirstName] se frotó la [ROOT.GetCountry.GetRuler.GetHerHis] barbilla pensativamente mientras [ROOT.GetCountry.GetRuler.GetSheHe] reflexionaba sobre los siguientes pasos."
 androphagian_30.a:0 "Contrata a estos mercenarios para entrenar a nuestros jinetes"
 androphagian_30.b:0 "¿Parece que los púnicos adoran a Kuu? Esto no es una coincidencia"
 androphagian_30.c:0 "Busquemos empresarios dispuestos a firmar contratos comerciales"
 androphagian_30.d:0 "Intérprete, ¿dónde están los burdeles?"
 androphagian_30.e:0 "¡Qué decepción es esta ciudad! Nos vamos con las manos vacías."
 androphagian_30a_tooltip:0 "#Y Contrataremos#! #T Caballería númida#! #Y para entrenar a nuestros propios jinetes.#!"
 androphagian_30b_tooltip:0 "#Y Compraremos una#! #T Estatua de Tanit#! #Y en el barrio religioso.#!"
 androphagian_30c_tooltip:0 "#Y Estableceremos#! #T Conexiones comerciales#! #Y con los cartagineses.#!"
 androphagian_30d_tooltip:0 "#Y Nuestros marineros gastan una pequeña fortuna en juergas.#!"
 
 androphagian_31_title:0 "Discutiendo con los atenienses"
 androphagian_31_desc:0 "Los siguientes meses transcurrieron sin incidentes y nuestros barcos atracaron en el puerto de #E El Pireo#! sin problemas. Mientras nuestro grupo se abría camino hacia las polvorientas calles de [GetProvince('(int32)416').GetName], nuestros hombres se sorprendieron al ver una gran multitud dando vueltas en el Ágora; había gritos y voces enojadas en el aire, pero nadie podía decir lo que estaba pasando. \n\nEmpujando a [ROOT.GetCountry.GetRuler.GetHerHis] entre la multitud, [ROOT.GetCountry.GetRuler.GetName] se sorprendió por lo que [ROOT.GetCountry.GetRuler.GetSheHe] vio a continuación; ¡Había un grupo de filósofos discutiendo en las calles, y en el centro del grupo había un hombre vestido con ropa tradicional andrófaga! Levantando las manos y pidiendo silencio, el andrófago habló con una voz firme que se pudo escuchar entre el murmullo de la multitud. Desafortunadamente para [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetSheHe] se había perdido la primera parte de la conversación y no entendió la respuesta que dio el andrófago.\n\n'Pero nuestros retóricos son atormentados por otra especie de Furias cuando gritan: 'Recibí estas heridas mientras luchaba por la libertad pública; Perdí este ojo en tu defensa... ¡dame un guía que me lleve hasta mis hijos, porque mis miembros están paralizados y no me sostienen!' '\n\nAnte esta respuesta, hubo aplausos dispersos antes de que continuara el debate. Tirando de la túnica de un hombre que estaba al lado de [ROOT.GetCountry.GetRuler.GetHerHim], [ROOT.GetCountry.GetRuler.GetFirstName] preguntó qué estaba pasando.\n\n'Ese hombre, un esclavo llamado [SCOPE.sCharacter('shiny_tutor').GetName], es un bárbaro entrenado en las artes de la retórica por su amo. Hace mucho tiempo, un grupo de asalto del extremo norte intentó atacar nuestra ciudad, pero pudimos derrotar a los salvajes y encadenar a muchos de ellos. Si bien la mayoría de los prisioneros fueron enviados a las minas, la brillante mente de Lamperos aseguró que se salvaría y se ha convertido en uno de los maestros más famosos que viven en Atenas."
 androphagian_31.a:0 "Consigamos los servicios de investigadores griegos y dejemos"
 androphagian_31.b:0 "¡Un filósofo andrófago! Compra su libertad"
 androphagian_31.c:0 "Estos 'sabios' son tontos, y les diré por qué"
 androphagian_31.d:0 "Trabajo demasiado para que mi dinero lo gaste de esta manera."
 androphagian_31a_tooltip:0 "#Y Contrataremos#! #T Tutores atenienses#! #Y para ayudar con nuestra investigación.#!"
 androphagian_31b_tooltip:0 "#Y Lamperos agradece efusivamente a nuestro Gobernante y se une a la fiesta.#!"
 androphagian_31c_tooltip:0 "#Y Nuestro Gobernante entra en el debate, deslumbrando a todos los presentes con ingenio y encanto.#!"
 
 
 androphagian_32_title:0 "Agresión alejandrina"
 androphagian_32_desc:0 "Una tormenta inesperada azotó por completo a la flota andrófaga mientras cruzaban el #E Mare Aegyptium#!, y nuestros hombres se encontraban en circunstancias desesperadas cuando sus barcos llegaron cojeando al puerto de [GetProvince('(int32)516').GetName]. Nuestros marineros se habían visto obligados a deshacerse de sus cargamentos durante la tempestad para mantener sus barcos fuera del agua, y prácticamente se habían quedado sin comida y agua cuando la costa egipcia apareció a la vista. Con lenguas espesas e hinchadas y estómagos gruñendo, los marineros rogaron a los alejandrinos permiso para atracar.\n\nSin embargo, nuestros hombres fueron cruelmente rechazados y los soldados alejandrinos se burlaron de nosotros, llamándonos bárbaros y salvajes. 'Si tenéis sed y hambre, entonces bebed la sangre de los demás y comed la carne de los demás, devoradores de hombres.'\n\nAl darse cuenta de que todos morirían sin sustento, [ROOT.GetCountry.GetRuler.GetName] se ofreció a pagar precios escandalosos por el pan y el agua, y los codiciosos alejandrinos se llevaron nuestro oro. Sin embargo, las ánforas que nuestros barcos enviaron al extranjero estaban en mal estado; el agua que nos dieron olía a animales y el pan estaba duro como una piedra y mohoso. Cuando [ROOT.GetCountry.GetRuler.GetFirstName] se quejó en voz alta de esta violación de confianza, los alejandrinos abrieron fuego contra nuestros barcos, obligando a nuestros hombres a zarpar.\n\nVolviéndose hacia el famoso #E Faro#! mientras la ciudad se perdía en la distancia, los [ROOT.GetCountry.GetRulerTitle] hicieron un poderoso juramento y prometieron vengar el honor de los andrófagos."
 androphagian_32.a:0 "Nunca perdonaré la forma en que nos trataste..."
 
 androphagian_33_title:0 "Regresar a casa"
 androphagian_33_desc:0 "Desanimados por la recepción que recibieron en [GetProvince('(int32)516').GetName], nuestros marineros decidieron regresar a casa y el resto del viaje lo pasaron hirviéndose de rabia. Naturalmente, nuestros hombres hicieron algunas paradas a lo largo de las costas de África en su camino de regreso: los alimentos pútridos y el agua que nos vendían los pérfidos alejandrinos no eran comestibles, y nuestros marineros se vieron obligados a atacar y saquear los asentamientos egipcios a lo largo de las costas para reponer nuestros suministros.\n\nLa ira de [ROOT.GetCountry.GetRuler.GetName] fue algo digno de contemplar, e incluso aquellos más cercanos al [ROOT.GetCountry.GetRulerTitle] quedaron atónitos por la agresividad con la que [ROOT.GetCountry.GetRuler.GetSheHe] atacó a las personas que viven a lo largo de la costa africana. Pueblos enteros fueron hechos prisioneros y arrojados a las profundidades de los barcos andrófagos, y cualquiera que hablara con acento alejandrino fue devorado vivo por [ROOT.GetCountry.GetRuler.GetFirstName] - no se mostró piedad hacia nadie, sin importar su edad o condición.\n\nUna vez que supieron lo que los andrófagos estaban haciendo en sus tierras interiores, los atónitos alejandrinos intentaron montar una contradefensa y enviaron una flota de guerra con la esperanza de atraparnos, pero nuestra armada pudo desviarlos de su rastro y logró escapar. Los piratas que vivían cerca de las #E Columnas de Heracles#! no volvieron a molestarnos en el viaje a casa, y un par de años después de zarpar por primera vez, nuestra armada regresó a las fronteras controladas por [ROOT.GetCountry.GetName].\n\nSin embargo, el largo viaje a casa no hizo nada para calmar la ira de [ROOT.GetCountry.GetRuler.GetFirstName], e incluso después de que habían pasado muchas semanas, [ROOT.GetCountry.GetRuler.GetSheHe] no podía creer todo lo que había pasado."
 androphagian_33.a:0 "Qué viaje tan largo y extraño ha sido..."
 androphagian_33_tooltip:0 "#Y Esto finalizará la cadena de eventos.#!"
 
 
 dhe_body.5.o:0 "Ya no adoraremos más la memoria de un tirano."
 dhe_body.5.p:0 "Nunca más adoraremos el cuerpo de un tirano"
 to_the_hungriest_tooltip:0 "#Y Esta opción está disponible porque tu gobernante tiene el #! #R rasgo caníbal#!.\n#Y Cada país con#! #G cultura helénica#! #Y perderá#! #R 100 Opinión#! #Y sobre nosotros.#!"
 cannibal_ate_alexander:0 "Devoró el cadáver de Alejandro Magno"
 
 androphagian_21_title:0 "Migración hacia el oeste"
 androphagian_21_desc:0 "Una mañana, [ROOT.GetCountry.GetRuler.GetName] se despertó de un sueño inquieto con un profundo escalofrío en [ROOT.GetCountry.GetRuler.GetHerHis] huesos y una tos seca sacudió [ROOT.GetCountry.GetRuler.GetHerHis] el pecho. Temblando, [ROOT.GetCountry.GetRuler.GetSheHe] se dio la vuelta en la cama y cerró los [ROOT.GetCountry.GetRuler.GetHerHis] ojos.\n\nDesafortunadamente para [ROOT.GetCountry.GetRuler.GetHerHim], el sueño fue difícil de alcanzar y el resto de la noche la pasó en la contemplación: [ROOT.GetCountry.GetRuler.GetHerHis] los sueños se habían llenado de visiones inquietantes de un camino sinuoso a través de las montañas, oscurecido por una ventisca arremolinada que era implacable en su furia. Mientras el Jefe Tribal luchaba por [ROOT.GetCountry.GetRuler.GetHerHis] abrirse camino a través de vientos aullantes y bancos de nieve que ahora llegaban hasta el [ROOT.GetCountry.GetRuler.GetHerHis] pecho, [ROOT.GetCountry.GetRuler.GetFirstName] se apoderó de un extraño miedo a lo desconocido. En ese momento, [ROOT.GetCountry.GetRuler.GetSheHe] intentó dar la vuelta y regresar a [ROOT.GetCountry.GetCapital.GetName], pero la nevada interminable había cubierto [ROOT.GetCountry.GetRuler.GetHerHis] huellas: el camino a casa se perdió.\n\nEn ese mismo momento, un viento helado sopló a través del dormitorio de [ROOT.GetCountry.GetRuler.GetHerHis], y [ROOT.GetCountry.GetRuler.GetFirstName] estaba seguro de que [GetDeityDefinition('omen_vesa').GetName] había hecho saber su testamento."
 androphagian_21.a:0 "Ha llegado el momento de hacer un viaje de invierno..."
 androphagian_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y Migración hacia el Oeste#!' $mission_completed_tooltip_2$"
 
 androphagian_22_title:0 "¡Prepárate para la guerra!"
 androphagian_22_desc:0 "Una mañana, [ROOT.GetCountry.GetRuler.GetName] despertó de un sueño inquieto empapado en sudor, con un corazón palpitante que se sentía como tambores de guerra en el pecho de [ROOT.GetCountry.GetRuler.GetHerHis] - [ROOT.GetCountry.GetRuler.GetHerHis] los sueños habían estado llenos de visiones inquietantes de muerte y destrucción ineludibles.\n\nUna voz suave susurró en el oído de [ROOT.GetCountry.GetRuler.GetFirstName], describiendo escenas de crueldad inimaginable en los días por venir. Los soldados andrófagos pronto saquearían las tiendas de los #E [GetCountry('MLN').GetName]#! al sur, pero sólo si atacábamos sin miedo a nuestros enemigos. El mensajero divino reveló que el coste de la guerra sería elevado y que muchos hombres buenos morirían en ambos bandos, pero que la victoria final estaba asegurada para [ROOT.GetCountry.GetName]. Estas promesas fueron garantizadas nada menos que por [GetDeityDefinition('omen_vesa').GetName], una diosa muy querida por [ROOT.GetCountry.GetRuler.GetFirstName] y objeto de [ROOT.GetCountry.GetRuler.GetHerHis] devoción de por vida."
 androphagian_22.a:0 "¡La Madre de las Aguas tiene sed de sangre!"
 androphagian_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y ¡Prepárense para la guerra!#!' $mission_completed_tooltip_2$"
 
 androphagian_23_title:0 "Guiado por la prudencia"
 androphagian_23_desc:0 "Una mañana, [ROOT.GetCountry.GetRuler.GetName] despertó de un sueño profundo e inmediatamente se llenó de un espíritu de gratitud: [ROOT.GetCountry.GetRuler.GetHerHis] el sueño había estado lleno de visiones pacíficas de hogares crepitantes y compañerismo ante los fuegos rugientes de [ROOT.GetCountry.GetCapital.GetName], y el sabio [ROOT.GetCountry.GetRulerTitle] lo tomó como una señal de cosas buenas por venir.\n\nEn [ROOT.GetCountry.GetRuler.GetHerHis] sueños, [ROOT.GetCountry.GetRuler.GetFirstName] pudo descansar sabiendo que todo el trabajo del año había sido completado; las cosechas habían sido recolectadas y almacenadas, los animales habían sido traídos de los bosques, y la llegada de músicos e intérpretes ambulantes a la capital prácticamente anunció que la temporada de festines había llegado a nuestro pueblo."
 androphagian_23.a:0 "[GetDeityDefinition('omen_vesa').GetName] quiere que nos quedemos donde estamos"
 androphagian_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y Guiado por la prudencia#!' $mission_completed_tooltip_2$"
 
 androphagian_28_title:0 "La invasión de Escitia"
 androphagian_28_desc:0 "Por alguna razón, los #E [GetCountry('SCY').GetName] ns#! una vez pensaron en nosotros como sus amigos, y cuando los ejércitos de #E Darío el persa#! invadieron Escitia con su general #E Megazabus#!, nos pidieron que fuéramos en su defensa, una solicitud que ignoramos por completo. Es a causa de este incidente que los escitas nos ven con sospecha y, desde ese día, han tratado de limitar sus tratos con nosotros, un sentimiento que estamos felices de corresponder.\n\nPero los tiempos cambian, y [ROOT.GetCountry.GetRuler.GetName] ha decidido que [ROOT.GetCountry.GetRuler.GetHerHim] administrará mejor su tierra natal que cualquier otra persona, y ha informado a las levas que pronto marcharán hacia el [GetProvince('(int32)7186').GetArea.GetRegion.GetName] región."
 androphagian_28.a:0 "¡Aquellos a los que una vez pediste ayuda serán tu perdición definitiva!"
 androphagian_28_tooltip:0 "$mission_completed_tooltip_1$ '#Y La invasión de Escitia#!' $mission_completed_tooltip_2$"
 
 androphagian_34_title:0 "Los andrófagos"
 androphagian_34_desc:0 "No se sabe mucho en el mundo civilizado sobre los #E [GetCountry('ANP').GetName] ns#! migratorios, aparte de algunas referencias hechas por #E Herodoto#! en sus Historias que sólo conocen las élites alfabetizadas que viven alrededor del #E Mediterráneo#!.\n\nEl #E [GetCountry('SCY').GetName] n#! las tribus que viven cerca de sus fronteras los ven como cobardes y traidores; sin embargo, hace unos doscientos años, cuando los ejércitos de #E Darío el Grande#!, Rey de Reyes, invadieron Escitia, los andrófagos se negaron a unirse a una alianza defensiva contra los #E #COLOR:{0.51,0.31,0.75} persas#!#! y observaron y se rieron mientras las tierras al sur ardían. No hace falta decir que no hay amor entre los andrófagos y sus vecinos.\n\nSi bien los territorios controlados por las tribus andrófagas son pequeños, su temible reputación como #E caníbales#! ha protegido sus fronteras casi mejor que sus ejércitos, ya que no hay muchos que deseen terminar sus días siendo devorados vivos en una ceremonia religiosa andrófaga. Aislados así del mundo, los andrófagos pasan sus días como les place, vagando por los bosques mucho más allá de los confines del mundo civilizado."
 androphagian_34.a:0 "Es hora de hacer historia..."
 androphagian_34_tooltip:0 "#Y Los#! #G andrófagos#! #Y pueden usar la #! #R Devorar#! #T Interacción de personajes#! #Y con cualquier persona que tengan#! #T Encarcelado#!, #Y pero existen #R riesgos para la salud#! #Y asociados con el consumo de carne humana; tu#! #T gobernante#! #Y podría contraer una enfermedad incurable.#!"
 
 androphagian_35_title:0 "jefe de jefes"
 androphagian_35_desc:0 "Ahora que los poderosos #E [GetCountry('SCY').GetName] ns#! han sido completamente destruidos por los ejércitos del invencible [ROOT.GetCountry.GetRuler.GetName], el audaz líder de los andrófagos ha prometido a [ROOT.GetCountry.GetRuler.GetHerHis] ejércitos que les espera un premio aún mayor.\n\nEn un esfuerzo por seguir los pasos de los grandes conquistadores, [ROOT.GetCountry.GetRulerTitle] ha enviado jinetes a las confederaciones tribales que viven en el lejano oriente para anunciar que reclamamos sus tierras como nuestras. [ROOT.GetCountry.GetRuler.GetFirstName] demostrará al mundo que [ROOT.GetCountry.GetName] es la tribu más poderosa de todas y que [ROOT.GetCountry.GetRuler.GetSheHe] es el verdadero #E Jefe de jefes#!: el jefe más grande que jamás haya existido."
 androphagian_35.a:0 "¡Invadiré y destruiré las tribus de la estepa!"
 androphagian_35_tooltip:0 "$mission_completed_tooltip_1$ '#Y Jefe de jefes#!' $mission_completed_tooltip_2$"
 
 androphagian_36_title:0 "$androphagia_task_28$"
 androphagian_36_desc:0 "Con la esperanza de evitar que las #E élites escitas#! se reúnan en el exilio para conspirar contra nuestro pueblo, sus nuevos amos, [ROOT.GetCountry.GetRuler.GetName] ha enviado a sus nobles a vivir dentro de los muros de [ROOT.GetCountry.GetCapital.GetName], donde permanecerán bajo la atenta mirada del [ROOT.GetCountry.GetRulerTitle].\n\nSe han tomado más medidas para garantizar el cumplimiento, y Los principales jinetes de las tribus escitas se han organizado en un grupo de asalto, donde se espera que no se metan en problemas. [ROOT.GetCountry.GetRuler.GetFirstName] guiará personalmente a estos guerreros a la batalla."
 androphagian_36.a:0 "Los escitas están bajo mi mando"
 androphagian_36_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_28$#!' $mission_completed_tooltip_2$"
 
 androphagian_37_title:0 "$androphagia_task_29$"
 androphagian_37_desc:0 "Las numerosas ciudades de #E Tracia#! han caído, una a una, en manos de nuestros soldados hambrientos, que no han tenido piedad con los griegos que viven a lo largo de las costas. Se dice que distritos enteros de ciudades, algunas elogiadas por su belleza y antigüedad, han sido quemados hasta los cimientos tras una incursión andrófaga, con tesoros invaluables reducidos a cenizas y obras de arte famosas destrozadas por los cascos de nuestra caballería.\n\nLas murallas de la ciudad tampoco fueron un impedimento para los miembros de nuestra tribu, porque nuestros asaltantes eran pacientes y estaban dispuestos a erigir obras de asedio y matar de hambre a los habitantes de la ciudad si era necesario."
 androphagian_37.a:0 "¡Ninguno sobrevivirá!"
 androphagian_37_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_29$#!' $mission_completed_tooltip_2$"
 
 androphagian_38_title:0 "$androphagia_task_30$"
 androphagian_38_desc:0 "Aunque a nuestros hombres les llevó varios meses de duro viaje llegar a la ciudad de [GetProvince('(int32)4557').GetName], fueron bien recibidos por los comerciantes locales allí. Nuestra reputación como caníbales no importaba dentro de sus abarrotados muros, porque lo único que cuenta en los mercados de esclavos de Tanais es la solidez de vuestro oro y plata, algo que teníamos en abundancia.\n\nLas historias que nos contaron los habitantes de Tanais fueron interesantes, por decir lo menos: profecías que insinuaban el ascenso y la caída de imperios, la destrucción de antiguos linajes y la división del mundo bajo los cascos de los nómadas tribales. De hecho, en ese mismo momento los corrales de esclavos estaban llenos hasta reventar de cautivos tomados de la estepa; Las tribus más débiles huían de las poderosas confederaciones de los Señores de los Caballos en el este, y muchos de estos refugiados estaban siendo esclavizados una vez que llegaron a Tanais."
 androphagian_38.a:0 "Quizás algún día nosotros mismos saqueemos esclavos de la estepa."
 androphagian_38_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_30$#!' $mission_completed_tooltip_2$"

 androphagian_39_title:0 "$androphagia_task_32$"
 androphagian_39_desc:0 "Nuestros productivos esfuerzos mineros han inundado nuestros mercados con hierro en bruto @iron!, y nuestros numerosos trabajadores calificados transforman el mineral en cosas que nuestra gente puede usar. Las herramientas de hierro reforzado ahora rompen los terrones de tierra semicongelados en nuestras obras de construcción, y muchos de nuestros guerreros han gastado grandes sumas de dinero en mejorar sus armas.\n\n[ROOT.GetCountry.GetRuler.GetName] ahora debemos decidir cómo lidiar con este excedente de hierro; ¿Quién debería beneficiarse de estos cambios en la sociedad andrófaga?"
 androphagian_39.a:0 "Deberíamos utilizar nuestras herramientas para construir ciudades y mejorar nuestra infraestructura."
 androphagian_39.b:0 "Reúne un ejército de #G zapadores#! para ayudar a nuestros reclutas en tiempos de guerra."
 androphagian_39_tooltip:0 "El #bold #R mantenimiento#!#! de dicha fuerza podría exceder #R 5,0#! @gold! por mes."

 androphagian_40_title:0 "$androphagia_task_33$"
 androphagian_40_desc:0 "En las semanas previas a la #E Gran Fiesta#! que se celebró en [ROOT.GetCountry.GetCapital.GetName], nuestros guerreros viajaron por todo [ROOT.GetCountry.GetName] en busca de víctimas, provocando un terror masivo en el campo. Sólo los andrófagos nativos se salvaron de los horrores de lo que estaba por venir, y el extranjero que pudo abandonar todas sus posesiones terrenales y escapar con vida fue considerado el afortunado.\n\nMiles de personas fueron llevadas encadenadas a la capital, donde les esperaban escenas de horror inimaginable; las ejecuciones masivas continuaron durante todo el día y toda la noche, con altares cubiertos de sangre erigidos junto a calderos gigantes llenos de cuerpos hirviendo. Los gritos de los moribundos eran una hermosa cacofonía que hizo que lágrimas de piadosa alegría aparecieran en el rostro de [ROOT.GetCountry.GetRuler.GetName], y el [ROOT.GetCountry.GetRulerTitle] sabía que los dioses bendecirían a nuestro pueblo por honrarlos de esa manera."
 androphagian_40.a:0 "¡Nos daremos un festín hasta que no podamos más!"
 androphagian_40_tooltip:0 "$mission_completed_tooltip_1$ '#Y $androphagia_task_33$#!' $mission_completed_tooltip_2$"
 androphagian_41_title:0 "Depósitos de ámbar encontrados"
 androphagian_41_desc:0 "Los grupos de exploración desplegados en [ROOT.GetProvince.GetName] han regresado, no con informes de enemigos, sino con sacos cargados de ámbar en bruto @amber!. Encontraron depósitos en lo profundo de la taiga que los colonos comunes habrían pasado por alto. La mano de obra que sacrificamos ha dado un rendimiento mucho mayor que el que podría proporcionar cualquier incursión; La infraestructura local ya se está reutilizando para explotar este hallazgo, reemplazando los bienes comerciales locales con el precioso ámbar @amber!."
 androphagian_41.a:0 "¡Nuestras arcas pronto rebosarán de oro!"

 #Decisions
 androphagia_show_amber_circuit:0 "Mostrar circuito ámbar"
 androphagia_show_amber_circuit_desc:0 ""
 androphagia_amber_circuit_wide_decision_1:0 "Ampliar los caminos ámbar a Joki"
 androphagia_amber_circuit_wide_decision_1_desc:0 "Es hora de impulsar nuestra infraestructura hacia el interior. Al ampliar la red de carreteras hasta #Y Joki#!, conectamos la Costa de Ámbar con los grandes ríos interiores, reduciendo drásticamente el tiempo de viaje de nuestros comerciantes y acercándonos un paso más a los mares del sur."
 androphagia_amber_circuit_wide_decision_2:0 "Ampliar las Carreteras del Ámbar hasta Neuria"
 androphagia_amber_circuit_wide_decision_2_desc:0 "Es hora de impulsar nuestra infraestructura hacia el interior. Al ampliar la red de carreteras hasta #Y Neuria#!, conectamos la Costa de Ámbar con los grandes ríos interiores, reduciendo drásticamente el tiempo de viaje de nuestros comerciantes y acercándonos un paso más a los mares del sur."
 androphagia_amber_circuit_wide_decision_3:0 "Ampliar las Carreteras Ámbar a Hypania"
 androphagia_amber_circuit_wide_decision_3_desc:0 "Es hora de impulsar nuestra infraestructura hacia el interior. Al ampliar la red de carreteras a #Y Hypania#!, conectamos la Costa Ámbar con los grandes ríos interiores, reduciendo drásticamente el tiempo de viaje de nuestros comerciantes y acercándonos un paso más a los mares del sur."
 androphagia_amber_circuit_wide_decision_4:0 "Ampliar las carreteras del ámbar a Sarmatia"
 androphagia_amber_circuit_wide_decision_4_desc:0 "Es hora de impulsar nuestra infraestructura hacia el interior. Al ampliar la red de carreteras a #Y Sarmatia#!, conectamos la Costa de Ámbar con los grandes ríos interiores, reduciendo drásticamente el tiempo de viaje de nuestros comerciantes y acercándonos un paso más a los mares del sur."
 androphagia_amber_circuit_wide_decision_5:0 "Ampliar las carreteras del ámbar a Olbia"
 androphagia_amber_circuit_wide_decision_5_desc:0 "El camino ahora termina donde comienza el mar. Al establecer esta conexión final con el centro comercial de #Y Olbia#!, [ROOT.GetCountry.GetRuler.GetFirstName] ha hecho realidad el sueño de una ruta comercial unificada. Nuestras caravanas y ejércitos ahora pueden viajar sin obstáculos desde los profundos bosques de Hiperbórea hasta el Ponto Euxinus."
