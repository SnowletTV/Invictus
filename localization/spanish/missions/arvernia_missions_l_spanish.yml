 #Events
 me_arvernia_1_title:0 "$01_arvernia_missions_task_1$"
 me_arvernia_1_desc:0 "En el momento en que [ROOT.GetCountry.GetRuler.GetName] pidió que la capital de [ROOT.GetCountry.GetName] se trasladara a la ciudad de [GetProvince('(int32)2284').GetName], había muchos dentro del #E Consejo Tribal#! que estaban de acuerdo con la propuesta de [ROOT.GetCountry.GetRulerTitle]. Los poderosos arvernos, los autoproclamados #E 'Protectores de la Galia'#!, habían ampliado rápidamente sus fronteras en los últimos años, y el traslado a Gergovia se consideró acorde con su creciente estatus."
 me_arvernia_1.a:0 "¡Esta ciudad está destinada a ser la capital de un reino poderoso!"
 me_arvernia_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_1$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_2_title:0 "$01_arvernia_missions_task_2$"
 me_arvernia_2_desc:0 "Hace unas semanas, [ROOT.GetCountry.GetAdjective] los jefes tribales fueron convocados por [ROOT.GetCountry.GetRuler.GetName], quienes pidieron a [ROOT.GetCountry.GetRuler.GetHerHis] sus homólogos que se reunieran en [ROOT.GetCountry.GetCapital.GetName] dentro de un mes, una petición que cumplieron a regañadientes, porque las primeras heladas del invierno ya estaban en el aire.\n\nCuando los tres guerreros finalmente se encontraron, la atmósfera era tensa y [SCOPE.sCharacter('clan_chief_one').GetName] no se mordió la lengua [SCOPE.sCharacter('clan_chief_one').GetHerHis], pero habló libremente. '¿Por qué nos has convocado, [ROOT.GetCountry.GetRuler.GetFirstName]? Ya es demasiado tarde para este tipo de reuniones; Ya hay frío en el aire y debería estar de vuelta en casa a [GetProvince('(int32)2284').GetName] preparándome para el invierno.'\n\nSi el ambicioso [ROOT.GetCountry.GetRulerTitle] de [ROOT.GetCountry.GetName] estaba molesto por este grosero arrebato, [ROOT.GetCountry.GetRuler.GetSheHe] no lo demostró. Aclarándose la garganta [ROOT.GetCountry.GetRuler.GetHerHis] en voz alta, [ROOT.GetCountry.GetRuler.GetFirstName] se encontró con la mirada enojada de [SCOPE.sCharacter('clan_chief_one').GetFirstName] y respondió a su descarado homólogo. 'Si el Jefe del [SCOPE.sCharacter('clan_chief_one').GetFamily.GetName] no desea abandonar la comodidad de su hogar, puede regresar a la suavidad de su cama y dejar las discusiones sobre la guerra a los hombres, porque ahora es el momento de atacar a nuestros enemigos.'\n\nLas siguientes horas estuvieron llenas de discusiones productivas sobre los planes de [ROOT.GetCountry.GetRuler.GetFirstName] para conquistar el sur, pero un intenso desacuerdo amenazó con interrumpir todo el asunto; el testarudo [SCOPE.sCharacter('clan_chief_one').GetFirstName] quería que nuestras tropas se centraran en saquear y asaltar los asentamientos de nuestros enemigos, mientras que el prudente [SCOPE.sCharacter('clan_chief_two').GetFirstName], un veterano de muchas campañas exitosas contra los #E saluvianos#! y #E elesycios#!, argumentó que nuestros hombres deberían avanzar cuidadosa y metódicamente a través de las tierras boscosas y salvajes, incluso si eso significaba perder valiosos botín."
 me_arvernia_2.a:0 "¡Por una vez, [SCOPE.sCharacter('clan_chief_one').GetFirstName] tiene la idea correcta!"
 me_arvernia_2.b:0 "La sabiduría de [SCOPE.sCharacter('clan_chief_two').GetFirstName] nos guiará en los días venideros."
 me_arvernia_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_2$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_3_title:0 "$01_arvernia_missions_task_3$"
 me_arvernia_3_desc:0 "Con la provincia de [GetProvince('(int32)2285').GetArea.GetName] firmemente en manos de los [ROOT.GetCountry.GetAdjective], el orgulloso [ROOT.GetCountry.GetRuler.GetName] ha dado a conocer [ROOT.GetCountry.GetRuler.GetHerHis] verdaderos planes; Estos nuevos territorios serían un escenario perfecto para una invasión de las tierras de los #E Saluvianos#! y #E Elesycios#! al sur."
 me_arvernia_3.a:0 "Uniré la #E Galia Transalpina#! bajo nuestra bandera: nuestro destino es gobernar"
 me_arvernia_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_3$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_4_title:0 "$01_arvernia_missions_task_4$"
 me_arvernia_4_desc:0 "Ahora que hemos conquistado tierras pobladas por #E miembros de la tribu elesycia#!, [ROOT.GetCountry.GetRuler.GetName] ha estado complaciendo la idea de liberar a nuestros esclavos del sur como un #E Feudatorio#! de [ROOT.GetCountry.GetName].\n\nEsto resolvería un par de problemas de [ROOT.GetCountry.GetRulerTitle]. Perspectiva. En pocas palabras, los elesycios estarían mucho más felices gobernando sus propios asuntos, y administrar sus territorios directamente sin duda causaría fricciones entre nuestros pueblos; algo que [ROOT.GetCountry.GetRuler.GetFirstName] quisiera evitar a toda costa.\n\nEsta idea tiene sus partidarios, pero también sus detractores: hay muchos que argumentan que liberar a los elesycios, incluso si sus líderes están obligados por juramentos de lealtad, sería una traición a los guerreros arvernos que lucharon y murieron para tomar sus tierras. Naturalmente, [SCOPE.sCharacter('clan_chief_one').GetName] tiene una opinión y ha pedido que los elesycios sean liberados inmediatamente, pero [SCOPE.sCharacter('clan_chief_two').GetName] frustrantemente ha tomado en serio la postura opuesta, y ambos líderes se han obstinado y se niegan a ceder.\n\nPero, como lo ve [ROOT.GetCountry.GetRuler.GetFirstName], los elesycios estaban unidos por ejércitos [ROOT.GetCountry.GetRuler.GetHerHis], por lo que Por lo tanto, [ROOT.GetCountry.GetRuler.GetSheHe] puede hacer lo que [ROOT.GetCountry.GetRuler.GetSheHe] quiera, incluso si eso enfurece a uno de los jefes."
 me_arvernia_4.a:0 "Para mantener nuestras tribus separadas, liberaré a #E Elesycia#! como nuestro feudatario."
 me_arvernia_4.b:0 "¡Nunca renunciaré a lo que tanto luchamos por lograr!"
 me_arvernia_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_4$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_5_title:0 "$01_arvernia_missions_task_5$"
 me_arvernia_5_desc:0 "Hay buenas tierras de pastoreo a lo largo del #E Rhodanus#! y tierras de cultivo bien regadas por pequeños arroyos y ricas y productivas durante muchos meses del año; los dioses realmente han bendecido esta tierra. Sin embargo, [ROOT.GetCountry.GetRuler.GetName] desea las ciudades de esta próspera región más que nada, y ha prometido que [ROOT.GetCountry.GetRuler.GetSheHe] algún día conquistará [GetProvince('(int32)2325').GetName] para las tribus de [ROOT.GetCountry.GetName].\n\nY ahora que [ROOT.GetCountry.GetRulerTitle] controla los importantes vados que permiten el acceso a través de las rápidas olas del Rhodanus, entonces nada detendrá los impuestos de [ROOT.GetCountry.GetRuler.GetFirstName] de invadir."
 me_arvernia_5.a:0 "¡Arverno, protector de nuestro pueblo, estará con nosotros!"
 me_arvernia_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_5$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_6_title:0 "$01_arvernia_missions_task_6$"
 me_arvernia_6_desc:0 "El hierro @iron! es uno de los metales más valiosos, es indispensable en tiempos de paz y de guerra, y desafortunadamente para [ROOT.GetCountry.GetRuler.GetName], nuestra gente necesita más de lo que la mina de [GetProvince('(int32)2298').GetName] proporciona actualmente.\n\nMientras reflexionaba sobre el difícil problema de la asignación de recursos, el [ROOT.GetCountry.GetRulerTitle] decidió visitar los mercados de [ROOT.GetCountry.GetCapital.GetName], y el Las siguientes horas transcurrieron agradablemente mientras [ROOT.GetCountry.GetRuler.GetSheHe] admiraba los numerosos y valiosos bienes comerciales expuestos. Había comerciantes que comerciaban exclusivamente con espadas, lanzas y escudos de hierro, e incluso había corazas pesadas disponibles, aunque había que ser fabulosamente rico para permitírselo todo. Además de las armas, había todo tipo de enseres y herramientas disponibles; implementos agrícolas, sartenes, clavos... cualquier cosa que un arverniano pudiera pedir.\n\nCon la cabeza llena de ideas, [ROOT.GetCountry.GetRuler.GetFirstName] caminó de regreso a [ROOT.GetCountry.GetRuler.GetHerHis] casa, soñando despierto con el futuro de [ROOT.GetCountry.GetRuler.GetHerHis] personas; ¿Quién debería beneficiarse del excedente de hierro?"
 me_arvernia_6.a:0 "Nuestra civilización necesita una base sólida, así que dejemos que la tengan los constructores."
 me_arvernia_6.b:0 "Enriquece a los soldados y desprecia a todos los demás."
 me_arvernia_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_6$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_7_title:0 "$01_arvernia_missions_task_7$"
 me_arvernia_7_desc:0 "El camino boscoso que atraviesa las #E Tierras Altas Arvernas#! ha sido fuertemente fortificado por los ingenieros de [ROOT.GetCountry.GetRuler.GetName], quienes han ordenado que se construyan murallas y guarniciones a lo largo del paso.\n\nAdemás de mejorar la infraestructura local, una cohorte de guerreros armados patrulla los bosques, asegurándose de que ninguna fuerza enemiga pueda entrar en nuestro territorio sin que se dé la alarma. Cuando se completaron las llamadas #E 'Puertas de Brivas'#!, [ROOT.GetCountry.GetRuler.GetFirstName] convocó a una semana de banquetes en todo el territorio."
 me_arvernia_7.a:0 "¡Honremos y alabemos a quienes defienden nuestra libertad!"
 me_arvernia_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_7$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_8_title:0 "$01_arvernia_missions_task_8$"
 me_arvernia_8_desc:0 "Los asesores de [ROOT.GetCountry.GetRuler.GetName] se divirtieron al ver al famoso [ROOT.GetCountry.GetRulerTitle], el audaz guerrero que había liderado los ejércitos de [ROOT.GetCountry.GetName] a innumerables victorias, nervioso por la inminente llegada de los #E Druidas#!.\n\n[ROOT.GetCountry.GetRuler.GetFirstName], que había mirado a la Muerte a la cara innumerables veces y se negaba a parpadear, estaba preocupado por la resultado del Consejo Druídico que se iba a celebrar en [ROOT.GetCountry.GetCapital.GetName] - ¿los dioses continuarían mostrando favor a la #E Casa de [ROOT.GetCountry.GetRuler.GetFamily.GetName]#!, o retirarían sus bendiciones?\n\nDejando escapar un profundo suspiro, [ROOT.GetCountry.GetRuler.GetFirstName] se dio cuenta de que preocuparse no haría nada...[ROOT.GetCountry.GetRuler.GetSheHe] solo tendría que esperar a ver qué sucede."
 me_arvernia_8.a:0 "Debo tener paciencia...todo estará bien."
 me_arvernia_8_tooltip:0 "#Y En un mes, los #E druidas#! llegarán a nuestra capital.#!"
 
 me_arvernia_9_title:0 "$01_arvernia_missions_task_9$"
 me_arvernia_9_desc:0 "Desde [ROOT.GetCountry.GetRuler.GetHerHis] los primeros días en el poder, [ROOT.GetCountry.GetRuler.GetName] siempre ha atendido los asuntos religiosos de [ROOT.GetCountry.GetName] con dignidad, y ahora que los dioses han recompensado a [ROOT.GetCountry.GetRuler.GetHerHim] con un éxito sin precedentes, [ROOT.GetCountry.GetRuler.GetSheHe] ha garantizado que la fiel observación de nuestras ceremonias y ritos druidas en nuestra capital continúe sin cesar. Incluso en tiempos de conflicto, cuando el precio del trigo se triplica en el mercado debido a los rumores de guerra, los #E druidas#! siempre fueron atendidos y nuestros templos permanecieron abiertos.\n\nLo que sucedió después en los días siguientes sorprendió incluso a los piadosos [ROOT.GetCountry.GetRuler.GetFirstName], que durante mucho tiempo habían deseado tales cosas; el dios de los arvernios se apareció a [ROOT.GetCountry.GetRuler.GetHerHim] en un sueño y le habló directamente al [ROOT.GetCountry.GetRulerTitle].\n\n'No tengas miedo, hijo mío. Durante las próximas doce lunas, caminaré junto a vosotros y la gente sentirá mi presencia. Mis manos abrirán cada puerta cerrada que se ponga en tu camino, y ningún hombre se opondrá a ti, ya sea en el campo de batalla o en los pasillos de mi ciudad, [ROOT.GetCountry.GetCapital.GetName].'\n\nEn ese momento, la tierra tembló, arrancando a [ROOT.GetCountry.GetRuler.GetFirstName] del [ROOT.GetCountry.GetRuler.GetHerHis] ensueño y dejando a [ROOT.GetCountry.GetRuler.GetHerHim] tirado en la cama durante horas, mirando al techo aturdido."
 me_arvernia_9.a:0 "Arvernus, ¡gracias por todo lo que has hecho por nosotros!"
 me_arvernia_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_9$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_10_title:0 "$01_arvernia_missions_task_10$"
 me_arvernia_10_desc:0 "Asegurado en el trono [ROOT.GetCountry.GetRuler.GetHerHis] en la resplandeciente capital de [ROOT.GetCountry.GetCapital.GetName], [ROOT.GetCountry.GetRuler.GetName] decretó que, a partir de ese día, la #E Casa de [ROOT.GetCountry.GetRuler.GetFamily.GetName]#! sería conocida para siempre como los #E Protectores de la Galia#! - un honorífico que el noble [ROOT.GetCountry.GetRulerTitle] sentía con derecho a.\n\nSi surgiera alguna amenaza a la paz gala, interna o externamente, entonces las levas de los arvernos saldrían de sus ciudadelas y fortalezas para poner fin a la perturbación de inmediato. [ROOT.GetCountry.GetRuler.GetFirstName] se había ganado el amor y el afecto de la gente común, que veía a [ROOT.GetCountry.GetRuler.GetHerHim] como su campeón, y el poderoso Gobernante prometió garantizar su libertad hasta el fin de los días."
 me_arvernia_10.a:0 "Nada sucede en la Galia sin mi conocimiento o bendición."
 me_arvernia_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_10$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_11_title:0 "$01_arvernia_missions_task_11$"
 me_arvernia_11_desc:0 "En los días transcurridos desde que los ejércitos de [ROOT.GetCountry.GetName] conquistaron las tierras de las tribus #E saluvianas#!, ha habido fricciones entre nuestro pueblo y el de ellos, y muchos creen que nuestras formas de vida son incompatibles entre sí. Hay demasiada #E influencia helénica#! en las ciudades costeras, un punto de controversia que plantea constantemente [SCOPE.sCharacter('clan_chief_one').GetName], quien teme que el lujoso estilo de vida de los #E griegos#!, con sus extravagantes filosofías y teatros de mármol, haga que nuestros propios parientes se vuelvan suaves y débiles.\n\nEn lugar de ver su presencia Como problema, [SCOPE.sCharacter('clan_chief_two').GetName] ha argumentado que podríamos aprender un par de cosas de los habitantes de la ciudad y cree que eventualmente se convertirán a nuestras costumbres con el tiempo, tiempo que nunca tendremos, [SCOPE.sCharacter('clan_chief_one').GetFirstName] ha insistido.\n\nQueda en manos de [ROOT.GetCountry.GetRuler.GetName] determinar qué se hará, pero, como siempre, alguien estará descontento con cualquier decisión que se tome."
 me_arvernia_11.a:0 "Liberar a la #E Confederación Saluviana#! como feudatorio de Arvernia"
 me_arvernia_11.b:0 "Los arvernianos gobernarán directamente a los saluvianos."
 me_arvernia_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_11$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_12_title:0 "$01_arvernia_missions_task_12$"
 me_arvernia_12_desc:0 "Aunque la mayoría de las #E tribus arvernianas#! viven dentro de las regiones de [GetProvince('(int32)2300').GetArea.GetRegion.GetName] y [GetProvince('(int32)2303').GetArea.GetRegion.GetName], hay algunos de nuestros primos que viven en [GetProvince('(int32)2283').GetArea.GetRegion.GetName] hacia nuestro oeste.\n\n[ROOT.GetCountry.GetRuler.GetName], quien con razón se considera [ROOT.GetCountry.GetRuler.GetHerHim] autoridad sobre todos los arvernianos, independientemente de dónde se encuentren, tiene envió diplomáticos a todos los asentamientos y ciudades de las tribus occidentales con un mensaje que no podrán ignorar."
 me_arvernia_12.a:0 "Los ejércitos de [ROOT.GetCountry.GetName] marchan hacia tu capital."
 me_arvernia_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_12$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_13_title:0 "$01_arvernia_missions_task_13$"
 me_arvernia_13_desc:0 "Por una vez, los jefes tribales estuvieron de acuerdo y ambos líderes apoyaron incondicionalmente la decisión de [ROOT.GetCountry.GetRuler.GetName] de anunciar la formación de la #E Liga Arverniana#!. Todos estaban de tan buen humor que incluso escucharon con entusiasmo el discurso improvisado pronunciado por [ROOT.GetCountry.GetRulerTitle] en la fiesta de celebración sin poner los ojos en blanco: una hazaña histórica en sí misma.\n\nLevantándose con paso vacilante, [ROOT.GetCountry.GetRuler.GetFirstName] esperó el silencio antes de dirigirse a todos los presentes. 'Se acerca una nueva era, una en la que nuestros roles como #E Guardianes de la Galia#! han quedado grabados en piedra. Que nuestros enemigos nos teman, que nuestros amigos nos amen, pero, sobre todo, que los dioses continúen bendiciendo nuestros esfuerzos en los días venideros.'\n\nUn fuerte grito surgió de los presentes en la fiesta, y el gemido de las flautas se elevó a un crescendo cacofónico mientras hermosas esclavas giraban y bailaban al son de los tambores."
 me_arvernia_13.a:0 "Tres hurras por la #E Liga Arverna#! - ¡Hurra!"
 me_arvernia_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_13$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_14_title:0 "$01_arvernia_missions_task_14$"
 me_arvernia_14_desc:0 "Durante muchos años, ha habido tensiones entre nuestro pueblo y las tribus de [GetCountry('AED').GetName], y nuestros guerreros se han enfrentado en el campo de batalla más veces de las que cualquier hombre podría contar. A raíz de uno de esos enfrentamientos, se firmaron tratados y se estableció la paz entre nuestros pueblos, pero todos los presentes sabían que sólo sería cuestión de tiempo antes de que nuestros ejércitos volvieran a luchar; así ha sido y siempre será.\n\nHace unos días, un robo de ganado lanzado por los #E Haedui#! se convirtió en un asalto en toda regla contra un #E aldea tribal arverna#!, lo que provocó la muerte de muchos de nuestros parientes. Cuando [ROOT.GetCountry.GetRuler.GetName] se enteró de que el [GetCountry('AED').GetRulerTitle] de [GetCountry('AED').GetName], [GetCountry('AED').GetRuler.GetName], había liderado personalmente el asalto a nuestro territorio, [ROOT.GetCountry.GetRuler.GetHerHis] la ira no pudo ser contenida y esa misma noche se hicieron planes para saquear su capital.\n\nHa pasado una generación desde que se promulgó la tregua entre nuestros padres, y todos los que presenciaron los juramentos sagrados han fallecido. De este reino mortal: no queda nadie que pueda evitar la devastación y destrucción que la guerra traerá a nuestro pueblo."
 me_arvernia_14.a:0 "Cuando todo esto termine, sólo uno de nosotros estará vivo..."
 me_arvernia_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_14$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_15_title:0 "$01_arvernia_missions_task_15$"
 me_arvernia_15_desc:0 "[ROOT.GetCountry.GetRuler.GetName] no estaba en casa en [ROOT.GetCountry.GetCapital.GetName] cuando [ROOT.GetCountry.GetRuler.GetSheHe] tomó la fatídica elección que decidió el futuro de los conquistados #E tribus haedui#! que vivían en [ROOT.GetCountry.GetName]. En lugar de estar atrapado en casa respondiendo correspondencia oficial y presidiendo en persona reuniones tribales, el [ROOT.GetCountry.GetRulerTitle] estaba en el desierto con [ROOT.GetCountry.GetRuler.GetHerHis] amigos, disfrutando de los placeres rústicos de la caza, y estaba bebiendo [ROOT.GetCountry.GetRuler.GetHerHis] tazas cuando alguien mencionó en broma a los haedui.\n\nDejando escapar un fuerte eructo y arrojando [ROOT.GetCountry.GetRuler.GetHerHis] cuerno para beber a las llamas, [ROOT.GetCountry.GetRuler.GetFirstName] se volvió hacia un esclavo cercano y le dio una orden en voz alta, para que todos los presentes pudieran escuchar [ROOT.GetCountry.GetRuler.GetHerHis] palabras."
 me_arvernia_15.a:0 "Envía guerreros a Bibracte y destruye todo."
 me_arvernia_15.b:0 "Esclavizar a los haedui en su antigua ciudad: un buen uso para Bibracte"
 me_arvernia_15.c:0 "Destruye todo lo que tienen y envíalos a las minas."
 me_arvernia_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_15$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_16_title:0 "$01_arvernia_missions_task_16$"
 me_arvernia_16_desc:0 "Informes inquietantes sobre el creciente poder de la #E República Romana#! están llegando a [ROOT.GetCountry.GetCapital.GetName] desde #E Italia#!. Los belicosos romanos han destrozado las fuerzas enviadas contra ellos, aniquilándolos ya sean etruscos, cartagineses o griegos, y en el proceso, han sometido muchas ciudades en toda la península mientras destruyen por completo cualquier lugar que se les resista.\n\nPreocupados por la eventual amenaza de que los romanos crucen los pasos de montaña de la #E Galia Transalpina#!, [ROOT.GetCountry.GetRuler.GetName] ha convocado a [ROOT.GetCountry.GetRuler.GetHerHis] asesores más cercanos, preguntando qué se debe hacer para proteger a las tribus de [ROOT.GetCountry.GetName] en los próximos días. Como de costumbre, el consejo ofrecido al [ROOT.GetCountry.GetRulerTitle] fue contradictorio, pero todos permanecían unidos en su propósito; La amenaza existencial de los romanos era demasiado grande y los jefes se dieron cuenta."
 me_arvernia_16.a:0 "Empezaremos a preparar nuestras defensas para lo inevitable."
 me_arvernia_16.b:0 "Lo único que Roma entiende es la violencia."
 me_arvernia_16.c:0 "Recluta mano de obra de las tribus y apuntala nuestros ejércitos."
 me_arvernia_16.d:0 "No nos apresuremos a actuar: envíemos diplomáticos al sur"
 me_arvernia_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_arvernia_16_tooltip2:0 "#Y Enviaremos una embajada a Roma, preguntando sobre sus intenciones en la Galia.#!"
 
 me_arvernia_17_title:0 "$01_arvernia_missions_task_17$"
 me_arvernia_17_desc:0 "[GetProvince('(int32)3543').GetName] ya era uno de los puertos más activos de todo [GetProvince('(int32)3543').GetArea.GetRegion.GetName], pero su actividad anterior palidece en comparación con el frenesí que se ha apoderado de la ciudad y sus habitantes, muchos de los cuales han sido reclutados por [ROOT.GetCountry.GetRuler.GetName] para ayudar a construir los enormes #E movimientos de tierra#! fuera de sus muros.\n\nMientras las fortalezas arvernas protegen el Las rutas terrestres son indudablemente impresionantes, los realistas [ROOT.GetCountry.GetRuler.GetFirstName] en privado creían que ni siquiera esto sería suficiente para detener a los romanos por mucho tiempo, pero públicamente hablaron con audacia para elevar la moral de las [ROOT.GetCountry.GetRuler.GetHerHis] tropas nerviosas."
 me_arvernia_17.a:0 "¡La vista de nuestras fortificaciones los hará correr a casa!"
 me_arvernia_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_17$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_18_title:0 "$01_arvernia_missions_task_18$"
 me_arvernia_18_desc:0 "Todos los que viven en un radio de mil millas de [GetProvince('(int32)3256').GetName] han oído hablar de la poderosa armada que zarpa desde su #E Grand Cothon#!, una poderosa armada que protege los intereses económicos y militares de su gente en todo el extenso #E Mediterráneo#!. Por lo tanto, cuando [ROOT.GetCountry.GetRuler.GetName] necesitó la experiencia de los mejores marineros del mundo, [ROOT.GetCountry.GetRuler.GetSheHe] no dudó, sino que envió una embajada al sur de inmediato con la esperanza de que pudiéramos llegar a algún tipo de entendimiento.\n\nCuando los lugareños supieron la razón por la que habíamos navegado una gran distancia para llegar a ellos, estuvieron más que felices de compartir algunas de sus tecnologías navales, especialmente cuando supieron que estábamos fortaleciendo nuestras defensas contra el #E Romanos#!."
 me_arvernia_18.a:0 "No olvidaré lo que has hecho por nosotros este día."
 me_arvernia_18.b:0 "¡Firmaré todos los tratados que quieras si vienes en nuestra ayuda!"
 me_arvernia_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_18$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_19_title:0 "$01_arvernia_missions_task_19$"
 me_arvernia_19_desc:0 "En toda la #E Galia#! y más allá, el nombre y la reputación del [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] arverno son respetados por todos los hombres, independientemente de su posición social. No sólo el valiente [ROOT.GetCountry.GetRuler.GetFirstName] es amado por el pueblo arverniano, muchos de los cuales darían sus vidas si [ROOT.GetCountry.GetRuler.GetSheHe] se lo pidiera, sino que incluso los jefes tribales están impresionados por las hazañas y hazañas logradas por [ROOT.GetCountry.GetRuler.GetFirstName]."
 me_arvernia_19.a:0 "Hay aún más que espero lograr en los días que me han sido dados."
 me_arvernia_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_19$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_20_title:0 "$01_arvernia_missions_task_20$"
 me_arvernia_20_desc:0 "Después de hacer lo que [ROOT.GetCountry.GetRuler.GetSheHe] pudo para preparar a los arvernos y sus aliados contra los #E romanos#!, [ROOT.GetCountry.GetRuler.GetName] comenzó a ponerse ansioso esperando el inevitable ataque; [ROOT.GetCountry.GetRuler.GetHerHis] Los sueños estaban llenos de visiones de legionarios romanos que salían de los pasos de montaña, haciendo llover muerte y destrucción a su alrededor. \n\nY, sin embargo, cada día pasaba sin noticias del sur; Nuestros exploradores informaron que todo seguía como de costumbre y no se estaban materializando ejércitos en nuestras fronteras. Al darse cuenta de que este elevado estado de tensión estaba volviendo loco a [ROOT.GetCountry.GetRuler.GetHerHim], [ROOT.GetCountry.GetRuler.GetFirstName] decidió que [ROOT.GetCountry.GetRuler.GetSheHe] ya no podía quedarse de brazos cruzados [ROOT.GetCountry.GetRuler.GetHerHis], sino que debía tomar medidas: los arvernos invadirían #E Italia#!."
 me_arvernia_20.a:0 "Debemos aplastar a los romanos antes de que nos ataquen: ¡cabalgamos al amanecer!"
 me_arvernia_20.b:0 "¡Espera! ¡Fue una idea terrible! ¡¿Qué estaba pensando?!"
 me_arvernia_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_20$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_21_title:0 "Ambiciones arvernianas"
 me_arvernia_21_desc:0 "Mis [ROOT.GetCountry.GetRulerTitle], los diabólicos #E [GetCountry('AVN').GetName] ns#!, nuestros implacables enemigos y rivales por el poder, recientemente han preparado reclamos sobre [ROOT.GetCountry.GetCapital.GetName], y nuestros espías informan que sus levas se están entrenando para la guerra.\n\nCuando llegó a la capital la noticia de la traición arverniana, también lo hizo un contingente de #E Mercenarios germánicos#! de lugares lejanos [GetCountry('SMN').GetName]. Estos guerreros, liderados por un renombrado general llamado [SCOPE.sCharacter('ariovistus_scope').GetName], estaban migrando lejos de [GetCountry('SMN').GetCapital.GetName] con la esperanza de encontrar sus propias tierras inestables para establecerse, pero [ROOT.GetCountry.GetRuler.GetName] sabía en el fondo [ROOT.GetCountry.GetRuler.GetHerHis] que [GetDeityDefinition('omen_taranis').GetName] había enviado a estos combatientes a [ROOT.GetCountry.GetName] para ayudar a nuestros guerreros en los días venideros."
 me_arvernia_21.a:0 "Ariovisto, lucha junto a nosotros y podrás instalarte en [GetCountry('AVN').GetCapital.GetName]..."
 me_arvernia_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y Ambiciones arvernianas#!' $mission_completed_tooltip_2$"
 
 me_arvernia_22_title:0 "Auxiliares eduos"
 me_arvernia_22_desc:0 "[ROOT.GetCountry.GetRuler.GetName], nuestros espías informan que los cobardes #E [GetCountry('AED').GetName] ns#! han buscado la ayuda de #E mercenarios germánicos#! del otro lado del #E río Rhenus#!. Se cree que un hombre llamado [SCOPE.sCharacter('ariovistus_scope').GetName], un temible guerrero que fue expulsado de su propia patria, lidera un feroz contingente de alemanes que desean saquear y atacar nuestros territorios.\n\nDebemos ser conscientes de esta amenaza en los días venideros, para que no seamos aplastados en el campo de batalla."
 me_arvernia_22.a:0 "Los impuestos de [ROOT.GetCountry.GetName] pueden hacer frente a cualquier amenaza"
 me_arvernia_22.b:0 "Envía diplomáticos por toda la Galia y busca guerreros propios."
 me_arvernia_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y Auxiliares eduos#!' $mission_completed_tooltip_2$"
 
 me_arvernia_23_title:0 "El llamado de ayuda"
 me_arvernia_23_desc:0 "Aunque nuestros diplomáticos viajaron durante meses a través de los territorios boscosos habitados por las #E tribus germánicas#!, sus esfuerzos por reclutar guerreros se vieron frustrados por la aterradora reputación de [SCOPE.sCharacter('ariovistus_scope').GetName]: no había muchos viviendo al otro lado del #E Rhenus#! que desearan enfrentarse al temible suebio en la batalla. Sintiéndose abatidos y nerviosos por la reacción de [ROOT.GetCountry.GetRuler.GetName] ante la amarga noticia de que ningún alemán ayudaría en nuestros esfuerzos para luchar contra los #E [GetCountry('AED').GetName] ns#!, nuestros emisarios se tomaron su tiempo para regresar a [ROOT.GetCountry.GetCapital.GetName].\n\nEn un extraño giro del destino, un grupo de #E arvernos Los guerreros#! llegaron a la capital antes de que regresaran nuestros diplomáticos. Estos guerreros ruidosos, liderados por un general canoso llamado [SCOPE.sCharacter('celtillus_scope').GetName] y acompañados por su hijo #E [SCOPE.sCharacter('vercingetorix_scope').GetFirstName]#!, se habían enterado de los esfuerzos para reclutar mercenarios extranjeros y, ansiosos por reclamar el honor y el botín de la batalla, reunieron a sus parientes y partieron hacia la capital de Arvernia.\n\nUn [ROOT.GetCountry.GetRuler.GetFirstName] lleno de alegría. Agradeció a [ROOT.GetCountry.GetRuler.GetHerHis] los diplomáticos por este éxito y se declaró un período de fiesta en [ROOT.GetCountry.GetCapital.GetName]."
 me_arvernia_23.a:0 "¡Derrotaremos a todos los que se oponen a nosotros!"
 me_arvernia_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y La llamada de ayuda#!' $mission_completed_tooltip_2$"
 
 me_arvernia_24_title:0 "El que sería rey"
 me_arvernia_24_desc:0 "[ROOT.GetCountry.GetRuler.GetName], tus agentes han descubierto pruebas irrefutables de un complot de traición: [SCOPE.sCharacter('celtillus_scope').GetName], el poderoso guerrero que acudió en nuestra ayuda en un momento desesperado, ha estado intentando en secreto reunir apoyo para intentar apoderarse de [ROOT.GetCountry.GetCapital.GetName].\n\nEl fanfarrón Celtillus, que se considera un líder de hombres, ha estado diciendo a sus seres más cercanos que está destinado a ser #E Rey de los galos#!, y nuestros agentes confirman que ha estado acumulando en secreto un cofre de guerra. Nuestros espías también nos han dicho que su hijo, #E [SCOPE.sCharacter('vercingetorix_scope').GetFirstName]#!, no estuvo involucrado en la conspiración de su padre."
 me_arvernia_24.a:0 "Celtillus tendrá que pagar esto con su vida."
 me_arvernia_24.b:0 "Desterrar a padre e hijo a una tierra bárbara y maldita"
 me_arvernia_24.c:0 "No puedo darme el lujo de actuar contra el dúo, así que debo perdonarlos."
 me_arvernia_24_tooltip:0 "#Y Esto finalizará el evento actual.#!"
 
 me_arvernia_25_title:0 "$01_arvernia_missions_task_21$"
 me_arvernia_25_desc:0 "Incluso con todo lo que [ROOT.GetCountry.GetRuler.GetName] ha logrado, cuando las personas más cercanas a [ROOT.GetCountry.GetRuler.GetHerHim] le preguntaron, [ROOT.GetCountry.GetRuler.GetSheHe] siempre dijo que el momento de mayor orgullo en la vida de [ROOT.GetCountry.GetRuler.GetHerHis] fue cuando [ROOT.GetCountry.GetRuler.GetSheHe] dedicó un lugar sagrado en [ROOT.GetCountry.GetCapital.GetName] a [GetDeityDefinition('omen_arvernus').GetName].\n\nEn los meses y años venideros, la sagrada #E Arboleda de Arverno#! sería un lugar de tranquila contemplación y refugio para los fieles, y muchos creerían en sus corazones que la presencia del propio Arverno se podría sentir allí."
 me_arvernia_25.a:0 "El legado de un hombre está escrito en el agua, pero los dioses viven para siempre"
 me_arvernia_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_21$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_26_title:0 "$01_arvernia_missions_task_22$"
 me_arvernia_26_desc:0 "Cuando llegó el momento de construir el #E Gran Mercado#! en [ROOT.GetCountry.GetCapital.GetName], [ROOT.GetCountry.GetRuler.GetName] no escatimó en gastos a la hora de construir sus impresionantes edificios y sus amplias arcadas, e incluso llegó a importar el mejor mármol @marble! para sus edificios.\n\nComplacidos con los esfuerzos de nuestros ingenieros y arquitectos para ampliar el distrito financiero, [ROOT.GetCountry.GetRuler.GetFirstName] llamó a mensajeros que recorrieran las calles de la capital, anunciando con orgullo a la gente que el mercado estaba terminado y finalmente abierto al público."
 me_arvernia_26.a:0 "Los arvernios serán la tribu más rica de toda la Galia"
 me_arvernia_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_arvernia_missions_task_22$#!' $mission_completed_tooltip_2$"
 
 me_arvernia_27_title:0 "$01_arvernia_missions_task_23$"
 me_arvernia_27_desc:0 "En una sorprendente derrota que será recordada tanto por los #E arvernos#! como por los #E romanos#! durante los siglos venideros, los ejércitos de [ROOT.GetCountry.GetRuler.GetName] tendieron una emboscada y derrotaron a un #E ejército consular romano#! en las estribaciones de la #E Galia Transalpina#!. No solo las fuerzas enemigas fueron completa y absolutamente destruidas, sino que el cónsul romano, [SCOPE.sCharacter('scheme_target').GetName], fue capturado vivo y arrastrado encadenado a [ROOT.GetCountry.GetCapital.GetName].\n\nPresos del pánico y conmocionados por este desastre, los romanos inmediatamente pidieron la paz, que fue concedida por [ROOT.GetCountry.GetRuler.GetFirstName], quien se alegró de ver a las Legiones retirarse de los pasos de montaña en desgracia. Mientras que algunos residentes en casa criticaron este movimiento como cobarde, [ROOT.GetCountry.GetRulerTitle] no se molestó en absoluto, ya que [ROOT.GetCountry.GetRuler.GetSheHe] tenía la deliciosa tarea de decidir qué hacer con [SCOPE.sCharacter('scheme_target').GetFirstName]."
 me_arvernia_27.a:0 "El honor de juzgar será todo mío, se lo aseguro."
 me_arvernia_27_tooltip:0 "#Y Nuestro gobernante decidirá el destino del cónsul romano...#!"
 
 me_arvernia_28_title:0 "Triunfo de los arvernios"
 me_arvernia_28_desc:0 "Incluso la mañana gris y sombría, envuelta en nubes de tormenta y un viento helado, no pudo evitar que la multitud se reuniera en las calles y plazas de [ROOT.GetCountry.GetCapital.GetName]. Todos los que vivían en un radio de diez millas de la capital de Arvernia se habían reunido para presenciar el espectáculo del día, que prometía ser inolvidable; el invencible [ROOT.GetCountry.GetRuler.GetName] iba a juzgar al #E cónsul romano#! capturado y que actualmente languidecía en una celda de prisión.\n\nHubo un estridente sonido de trompeta y un murmullo rompió entre las masas mientras el [SCOPE.sCharacter('scheme_target').GetName] magullado y maltratado era arrastrado ante [ROOT.GetCountry.GetRuler.GetFirstName], que estaba sentado en una plataforma elevada rodeado de guardias.\n\nLevantando una mano para pedir silencio, el arverno [ROOT.GetCountry.GetRulerTitle] miró al lamentable y tembloroso [SCOPE.sCharacter('scheme_target').GetFirstName] y habló en voz alta y firme."
 me_arvernia_28.a:0 "Estrangular a [SCOPE.sCharacter('scheme_target').GetFirstName] hasta morir delante de la mafia"
 me_arvernia_28.b:0 "Desollarlo vivo por sus crímenes contra nuestro pueblo."
 me_arvernia_28.c:0 "La crucifixión es la muerte más apropiada para un romano"
 me_arvernia_28.d:0 "Mostraré [SCOPE.sCharacter('scheme_target').GetFirstName] misericordia y les daré una lección a los romanos."
 me_arvernia_28.e:0 "¿Cuánto están dispuestos a pagar los romanos por la vida de un patricio?"
 me_arvernia_28.f:0 "¡Sacrificaré ritualmente a [SCOPE.sCharacter('scheme_target').GetFirstName] y me lo comeré vivo!"
 me_arvernia_28_tooltip:0 "$mission_completed_tooltip_1$ '#Y Triunfo de los arvernos#!' $mission_completed_tooltip_2$"
 
 me_arvernia_29_title:0 "Audiencia con el cónsul"
 me_arvernia_29_desc:0 "Cuando los diplomáticos llegaron a [GetProvince('(int32)1').GetName], fueron tratados con honor y respeto dado a cualquier embajada y no expulsados de las puertas de la ciudad como bárbaros galos, lo que nuestros hombres tomaron como una buena señal y una promesa de lo que vendría.\n\nUna vez que quedó claro el propósito de nuestra visita, nuestros mensajeros realizaron un gran recorrido por su impresionante ciudad, donde observaron una emocionante carrera de carros que los dejó al borde de sus asientos: ¿cómo podían los romanos permitirse el lujo de montar espectáculos tan deslumbrantes cada semana? Este era realmente el hogar de un país grande y poderoso.\n\nMás tarde esa noche, después de una pequeña fiesta celebrada en nuestro honor donde se vertieron ánforas tras ánforas de vino hasta la última gota, el #E Cónsul#! [SCOPE.sCharacter('roman_consul').GetName], un hombre de alto rango y clase noble, nos dijo que tenía esperanzas de que pudiéramos llegar a un acuerdo. Acuerdo.\n\nCuando se presentaron los términos, nuestros hombres se atragantaron con sus bebidas."
 me_arvernia_29.a:0 "¿Aceptará [ROOT.GetCountry.GetName] el estatus oficial de #E Amigo de Roma#!?"
 me_arvernia_29.b:0 "Seguramente permitirás que las #E Legiones#! accedan a tu territorio..."
 me_arvernia_29.c:0 "Nos darás una parte de tu comercio para evitar la guerra, ¿verdad?"
 me_arvernia_29.d:0 "¡Qué! ¿Rechazas la generosidad del Senado y del pueblo romanos?"
 me_arvernia_29_tooltip:0 "$mission_completed_tooltip_1$ '#Y Audiencia con el cónsul#!' $mission_completed_tooltip_2$"
 me_arvernia_29_tooltip2:0 "#R Nuestros diplomáticos abandonarán Roma sin prometer nada.#!"
 
 me_arvernia_30_title:0 "Regalos del Consejo Druídico"
 me_arvernia_30_desc:0 "Después de lo que pareció una eternidad, dos druidas de alto rango, [SCOPE.sCharacter('diviciacus_scope').GetName] y su hermano menor, [SCOPE.sCharacter('dumnorix_arvernia_scope').GetName], llegaron a [ROOT.GetCountry.GetCapital.GetName], y los dos hombres no perdieron el tiempo en llevar a cabo ritos y ceremonias religiosas destinadas a purificar la capital. \n\n[ROOT.GetCountry.GetRuler.GetName] pasaron muchas horas conversando tranquilamente con los dos druidas, compartiendo [ROOT.GetCountry.GetRuler.GetHerHis] miedos e inquietudes sobre el futuro, y con el paso de los días, los lazos de amistad unieron a los tres. Entonces, fue un gran alivio cuando los druidas dieron su bendición a [ROOT.GetCountry.GetRuler.GetFirstName] y le dijeron a [ROOT.GetCountry.GetRuler.GetHerHim] que apoyarían gustosamente la idea de que [ROOT.GetCountry.GetRulerTitle] se coronara [ROOT.GetCountry.GetRuler.GetHerHim] como #E Rey de los Arvernios#!.\n\nEl día antes de que los dos hombres se suponía que debían partir hacia su casa, [SCOPE.sCharacter('diviciacus_scope').GetFirstName] se acercó al [ROOT.GetCountry.GetRulerTitle] e informó a [ROOT.GetCountry.GetRuler.GetHerHim] que los druidas bendecirían a los arvernianos como así lo desearan; la elección quedaría en manos de [ROOT.GetCountry.GetRuler.GetFirstName]."
 me_arvernia_30.a:0 "Reservaré los fondos para construir un #E Templo a Arverno#!"
 me_arvernia_30.b:0 "Enséñame la Sabiduría Secreta de los Druidas..."
 me_arvernia_30.c:0 "¿Estás dispuesto a quedarte aquí y compartir tu sabiduría con [ROOT.GetCountry.GetName]?"
 me_arvernia_30.d:0 "Amigos míos, su visita aquí fue bastante buena, pero gracias."
 me_arvernia_30_tooltip:0 "$mission_completed_tooltip_1$ '#Y Regalos del Consejo Druídico#!' $mission_completed_tooltip_2$"
 
 me_arvernia_31_title:0 "$01_arvernia_missions_task_24$"
 me_arvernia_31_desc:0 "Aunque los asuntos de guerra siempre tienen prioridad sobre todo lo demás, [ROOT.GetCountry.GetRuler.GetName] ha sido consciente de las necesidades de la capital, y cuando se hizo evidente que nuestra creciente población necesitaría una fuente confiable de alimentos, [ROOT.GetCountry.GetRulerTitle] dedicó tiempo y esfuerzo a invertir en la región de [GetProvince('(int32)2348').GetName].\n\nAhora que este proyecto de infraestructura se ha completado, los arvernianos pueden almacenar grano en su capital, una innovación que ha encantado [ROOT.GetCountry.GetRuler.GetFirstName]."
 me_arvernia_31.a:0 "El granero en [ROOT.GetCountry.GetCapital.GetName] era muy necesario"
 me_arvernia_31_tooltip:0 "$mission_completed_tooltip_1$ '#Y Triunfo de los arvernos#!' $mission_completed_tooltip_2$"
 
 me_arvernia_32_title:0 "¡Cónsul capturado!"
 me_arvernia_32_desc:0 "Oh [ROOT.GetCountry.GetRuler.GetName], te horrorizarás al saber que los ejércitos de [GetCountry('AVN').GetName], liderados por el feroz [GetCountry('AVN').GetRuler.GetName], de alguna manera han logrado capturar a uno de nuestros #E cónsules#!. Se cree que [SCOPE.sCharacter('scheme_target').GetName], que los dioses tengan piedad de él, ha sido llevado a una prisión arverna en [GetCountry('AVN').GetCapital.GetName], donde se pudre bajo tierra mientras espera la llamada \"justicia\" de los bárbaros galos.\n\nSi bien existe una pequeña posibilidad de que el cruel [GetCountry('AVN').GetRuler.GetFirstName] muestre [SCOPE.sCharacter('scheme_target').GetFirstName] misericordia, debemos asumir que los salvajes lo ejecutará..."
 me_arvernia_32.a:0 "¿Cómo pudo haber sucedido tal cosa?"
 me_arvernia_32_tooltip:0 "$mission_completed_tooltip_1$ '#Y ¡Cónsul capturado!#!' $mission_completed_tooltip_2$"

 me_arvernia_34_title: "Feudatarios arvernos"
 me_arvernia_34_desc: "Aunque [ROOT.GetCountry.GetRuler.GetName] estaba haciendo [ROOT.GetCountry.GetRuler.GetHerHis] todo lo posible para celebrar el establecimiento del [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetSheHe] se irritó al saber que los diplomáticos de los #E elesycios#! y los #E saluvianos#! habían llegado a [ROOT.GetCountry.GetCapital.GetName] anoche con aún más solicitudes. Los embajadores tribales ofrecieron sus felicitaciones, pero no estaban aquí para compartir su buena voluntad; se preguntaban si el generoso [ROOT.GetCountry.GetRuler.GetFirstName] estaría dispuesto a liberarlos como #E feudatarios#!."
 me_arvernia_34.a: "Esos días se acabaron... ¡Soy el [ROOT.GetCountry.GetRulerTitle] de toda Arvernia!"
 me_arvernia_34.b: "Permitir que las tribus del sur dirijan sus propios asuntos."
 me_arvernia_34_tooltip: "$mission_completed_tooltip_1$ '#Y Feudatarios arvernos#!' $mission_completed_tooltip_2$"
