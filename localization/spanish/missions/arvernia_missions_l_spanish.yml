l_spanish:
 
 01_arvernia_missions:0 "Protectores de la Galia"
 01_arvernia_missions_DESCRIPTION:0 "Las tribus asentadas de [ROOT.GetCountry.GetName] controlan los territorios que conectan las regiones de [GetProvince('(int32)2284').GetArea.GetRegion.GetName] y [GetProvince('(int32)2380').GetArea.GetRegion.GetName], y como administradores de la importante ruta terrestre que atraviesa las #E Tierras Altas Arvernas#!, a menudo se ven involucrados en los asuntos de sus vecinos, independientemente de si quieren o no estarlo.\n\nSu ubicación central, mientras muchas veces una bendición, trae consigo problemas y complicaciones; las odiadas tribus #E haedui#! del este han ejercido presión en sus fronteras, mientras que los #E elesycios#! y los #E saluvianos#! del sur, enredados con las ciudades #E griegas#! de la costa, han considerado abandonar sus territorios en disputa y ahora Ojos codiciosos hacia las productivas tierras arvernas.\n\nA pesar de los desafíos que enfrenta [ROOT.GetCountry.GetRuler.GetName], [ROOT.GetCountry.GetRuler.GetSheHe] imagina un futuro en el que [ROOT.GetCountry.GetRuler.GetHerHis] parientes gobiernen un reino poderoso que protegerá a toda la #E Galia#! de potencias extranjeras y amenazas internas a la estabilidad..."
 01_arvernia_missions_CRITERIA_DESCRIPTION:0 "Esta misión se completará cuando los #E arvernos#! hayan unido a sus parientes bajo un mismo estandarte, hayan sometido a sus enemigos y hayan cimentado su reputación como líderes naturales en toda la #E Galia#!."
 01_arvernia_missions_BUTTON_TOOLTIP:0 "Es hora de hacer historia..."
 01_arvernia_missions_BUTTON_DETAILS: ""
 
 #Missions
 
 01_arvernia_missions_task_1:0 "La sede del poder"
 01_arvernia_missions_task_1_DESC:0 "La importancia de la ciudad de [GetProvince('(int32)2284').GetName|T] la convierte en una candidata natural para convertirse en la capital de [ROOT.GetCountry.GetName|G]. Aunque llevará algún tiempo convencer a los Ancianos de que es prudente abandonar [ROOT.GetCountry.GetCapital.GetName|T], [ROOT.GetCountry.GetRuler.GetName|Y] ha prometido que [ROOT.GetCountry.GetRuler.GetSheHe] hará que esta tarea se lleve a cabo. Hecho.\n\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 
 01_arvernia_missions_task_2:0 "El magistrado ambicioso"
 01_arvernia_missions_task_2_DESC:0 "¡Ha llegado el momento de apoderarse de toda la provincia en la que vivimos! [ROOT.GetCountry.GetRuler.GetName|Y] ha hecho saber que debemos atravesar las montañas del sur y reclamar las tierras que dieron nombre a nuestro pueblo, y muchos que viven dentro de [ROOT.GetCountry.GetCapital.GetName|T] están comenzando a escuchar las persuasivas palabras del [ROOT.GetCountry.GetRulerTitle].\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 
 01_arvernia_missions_task_3:0 "Avanzando hacia el sur"
 01_arvernia_missions_task_3_DESC:0 "Ahora que las levas victoriosas de [ROOT.GetCountry.GetName|G] han aplastado a los lamentables ejércitos enviados contra ellos, nuestro audaz [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName|Y] busca subyugar los territorios a nuestro sur.\n\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 
 01_arvernia_missions_task_4:0 "Unir a los elesycios"
 01_arvernia_missions_task_4_DESC:0 "Las tribus #G elesycias#! de nuestro sur han sido unidas por los ejércitos conquistadores de [ROOT.GetCountry.GetRuler.GetName|Y], una hazaña que nuestros parientes celebrarán durante siglos.\n\nLos arvernos [ROOT.GetCountry.GetRulerTitle] están considerando actualmente una solicitud de sus élites, una que tendría ramificaciones para nuestro futuro: ¿deberíamos liberar a las tribus como nuestros feudatarios, o deberíamos gobernar sus tierras directamente?\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 
 01_arvernia_missions_task_5:0 "Cruzando el Rodano"
 01_arvernia_missions_task_5_DESC:0 "Las tierras que se encuentran entre los #G Alpes Grises#! y los #G Alpes Marítimos#! son prósperas, fértiles y bien defendidas: un desafío para el que [ROOT.GetCountry.GetRuler.GetName|Y] creemos que estamos preparados. Para.\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 
 01_arvernia_missions_task_6:0 "El Hierro De Brivas"
 01_arvernia_missions_task_6_DESC:0 "Hay hierro valioso @iron! en los bosques de [GetProvince('(int32)2298').GetName|T] que nuestra gente necesita, y [ROOT.GetCountry.GetRuler.GetName|Y] tiene decisiones difíciles que tomar en los próximos días.\n\n#Y Decidiremos entre usar nuestro hierro para aumentar nuestra#! #T Infraestructura cívica#! #Y o mejorar nuestra#! #R Fuerza militar.#!\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 
 01_arvernia_missions_task_7:0 "Las puertas de Brivas"
 01_arvernia_missions_task_7_DESC:0 "Para proteger la ciudad de [GetProvince('(int32)2284').GetName|T], [ROOT.GetCountry.GetRuler.GetName|Y] ha decretado que los bosques cercanos a [GetProvince('(int32)2298').GetName|T] sean fortificado.\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 
 01_arvernia_missions_task_8:0 "Reunión de los druidas"
 01_arvernia_missions_task_8_DESC:0 "Ahora que las fronteras gobernadas por los [ROOT.GetCountry.GetName|G] han crecido y el respeto mostrado a nuestras tribus ha aumentado, [ROOT.GetCountry.GetRuler.GetName|Y] confía en la [ROOT.GetCountry.GetRuler.GetHerHis] capacidad de convocar una #G Reunión de los druidas#! en [ROOT.GetCountry.GetCapital.GetName|T].\n\n#Y Esto iniciará un evento. Cadena.#!\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 
 01_arvernia_missions_task_9:0 "Guía de los dioses"
 01_arvernia_missions_task_9_DESC:0 "Consciente de que los dioses han protegido a las tribus de [ROOT.GetCountry.GetName|G], [ROOT.GetCountry.GetRuler.GetName|Y] desea adorar en [ROOT.GetCountry.GetCapital.GetName|T] y ha pedido que se construya un #Y Gran Templo#! en el capital.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 
 01_arvernia_missions_task_10:0 "Protectores de la Galia"
 01_arvernia_missions_task_10_DESC:0 "Por fin, [ROOT.GetCountry.GetRuler.GetName|Y] reclamará para [ROOT.GetCountry.GetName|G] un título que [ROOT.GetCountry.GetRuler.GetSheHe] realmente merece, uno ganado por nuestros hermanos en el campo de batalla innumerables veces: los #T Protectores de la Galia#!. Que todos los que piensen que pueden entrometerse en los asuntos galos se den cuenta de que los celtas tienen un poderoso campeón que luchará por ellos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 
 01_arvernia_missions_task_11:0 "Formar la Confederación Saluviana"
 01_arvernia_missions_task_11_DESC:0 "[ROOT.GetCountry.GetRuler.GetName|Y] está contemplando la solicitud de los #G diplomáticos saluvianos#! que llegaron recientemente a [ROOT.GetCountry.GetCapital.GetName|T], preguntándose si es el momento adecuado para liberar a los saluvianos como nuestros #T Feudatorio#!.\n\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 
 01_arvernia_missions_task_12:0 "Expansión occidental"
 01_arvernia_missions_task_12_DESC:0 "Con la provincia de [GetProvince('(int32)2286').GetArea.GetName|T] bajo nuestro control y nuestras fronteras en un tamaño respetable, [ROOT.GetCountry.GetRuler.GetName|Y] ha informado a los jefes tribales de las #G tribus arvernianas#! que viven al oeste que planeamos tomar sus tierras y agregar su fuerza a nuestra propio.\n\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 
 01_arvernia_missions_task_13:0 "Proclamar la Liga Arverna"
 01_arvernia_missions_task_13_DESC:0 "Ahora que los ejércitos de [ROOT.GetCountry.GetName|G] han obligado a nuestros parientes dispersos a vivir juntos como uno solo, [ROOT.GetCountry.GetRuler.GetName|Y] tiene que proclamar una nueva era, una en la que la #T Liga Arverniana#! garantice la paz y la prosperidad de la #G Galia#! y más allá.\n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 
 01_arvernia_missions_task_14:0 "Asaltos eduos"
 01_arvernia_missions_task_14_DESC:0 "Los #E #R eduos#!#!, nuestros implacables enemigos y rivales por el poder, representan una amenaza para nuestra forma de vida. Si tenemos esperanzas de un futuro pacífico para las tribus de [ROOT.GetCountry.GetName|G], entonces [GetCountry('AED').GetName|R] debe ser completamente destruido. Una vez que la tregua entre nuestras tribus haya terminado, será el momento de tomar su capital.\n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 
 01_arvernia_missions_task_15:0 "Destino de los haedui"
 01_arvernia_missions_task_15_DESC:0 "¡Las fuerzas invencibles de [ROOT.GetCountry.GetRuler.GetName|Y] han destrozado los patéticos ejércitos de [GetCountry('AED').GetName|R] y han quemado sus asentamientos!\n\n#E #R Decidiremos el destino de los traicioneros haedui que tenemos. Conquistado.#!#!\n\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 
 01_arvernia_missions_task_16:0 "Grito del lobo"
 01_arvernia_missions_task_16_DESC:0 "El creciente poder de [GetCountry('ROM').GetName|R] está empezando a poner nerviosos a los #G Ancianos arvernos#!; nuestros espías informan que están uniendo lenta pero seguramente la península italiana bajo su hegemonía.\n\nPreocupado por los crecientes acontecimientos, [ROOT.GetCountry.GetRuler.GetName|Y] ha convocado un #Y Consejo Tribal#! que se reunirá en [ROOT.GetCountry.GetCapital.GetName|T] para planificar el futuro.\n\n#R Decidiremos cómo prepararnos para una potencial invasión romana.#!\n\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 
 01_arvernia_missions_task_17:0 "Las murallas de Antípolis"
 01_arvernia_missions_task_17_DESC:0 "[GetProvince('(int32)3543').GetName|T] es la puerta de entrada a [GetProvince('(int32)3543').GetArea.GetRegion.GetName|T] y es nuestra primera, y potencialmente la última, línea de defensa cuando se trata de una invasión terrestre.\n\nConsciente de que el futuro de [ROOT.GetCountry.GetName|G] sube y baja con Antipolis, [ROOT.GetCountry.GetRuler.GetName|Y] ha tomado la costosa decisión de invertir en el ejército de la ciudad. Infraestructura.\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 
 01_arvernia_missions_task_18:0 "Armada Arverniana"
 01_arvernia_missions_task_18_DESC:0 "Si bien asegurar las rutas terrestres es un primer paso importante, no debemos descuidar el mar: sería algo trivial para nuestros enemigos desembarcar un ejército en nuestras costas.\n\nAl darnos cuenta de que estamos superados en lo que respecta a la guerra naval, [ROOT.GetCountry.GetRuler.GetName|Y] está buscando amigos en el extranjero que puedan enseñar algo a nuestros marineros. Dos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 
 01_arvernia_missions_task_19:0 "Fuerza creciente"
 01_arvernia_missions_task_19_DESC:0 "El poderoso [ROOT.GetCountry.GetRuler.GetName|Y] ha subyugado a los enemigos de [ROOT.GetCountry.GetName|G] y ha forjado nuevas amistades que han llevado a las tribus [ROOT.GetCountry.GetAdjective] a las alturas de su poder; una fuerza a tener en cuenta.\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 
 01_arvernia_missions_task_20:0 "Invadiendo Italia"
 01_arvernia_missions_task_20_DESC:0 "A pesar de los mejores esfuerzos de [ROOT.GetCountry.GetRuler.GetName|Y] para asegurar una paz duradera para [ROOT.GetCountry.GetName|G], esto seguirá siendo una ilusión mientras se permita a los pérfidos #R romanos#! prosperar en nuestra periferia.\n\nHa llegado el momento de poner fin a su intromisión de una vez por todas, pero para mejorar nuestras posibilidades en el campo de batalla, los arvernos [ROOT.GetCountry.GetRulerTitle] quiere invadir cuando las #R legiones romanas#! están distraídas en otra parte.\n\n\n\n\n\n\n\n\n\n\n@italic_mil30!"
 
 01_arvernia_missions_task_21:0 "La arboleda de Arverno"
 01_arvernia_missions_task_21_DESC:0 "Gracias a las bendiciones de nuestro divino Protector, [GetDeityDefinition('omen_arvernus').GetName|T], las tribus de [ROOT.GetCountry.GetName|G] han podido florecer cuando todas las que nos rodean han fracasado. Para honrar al dios que nos ha bendecido, [ROOT.GetCountry.GetRuler.GetName|Y] ha prometido construir un #T Lugar Santo#! en la capital. Ciudad.\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 
 01_arvernia_missions_task_22:0 "Gran Mercado De Gergovia"
 01_arvernia_missions_task_22_DESC:0 "Ahora que los odiados [GetCountry('AED').GetName|R] han sido pisoteados hasta convertirlos en polvo bajo los cascos de las monturas de guerra de [ROOT.GetCountry.GetRuler.GetName|Y], el [ROOT.GetCountry.GetRulerTitle] puede dirigir [ROOT.GetCountry.GetRuler.GetHerHis] la atención a los asuntos monetarios: [ROOT.GetCountry.GetRuler.GetSheHe] quiere construir el mayor mercado dentro del #T Sur. Galia#!.\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 
 01_arvernia_missions_task_23:0 "Triunfo de los arvernios"
 01_arvernia_missions_task_23_DESC:0 "En un desastre sin precedentes para [GetCountry('ROM').GetName|R], los ejércitos de [ROOT.GetCountry.GetRuler.GetName|Y] han capturado a uno de sus cónsules, [GetCountry('ROM').GetRuler.GetName|Y], en batalla. El prisionero languidece en una celda húmeda en [ROOT.GetCountry.GetCapital.GetName|T], donde espera la justicia del pueblo arverniano...\n\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 
 01_arvernia_missions_task_24:0 "Agricultura ambarina"
 01_arvernia_missions_task_24_DESC:0 "Es bien sabido que la provincia de [GetProvince('(int32)2348').GetName|G] tiene buenas tierras para la agricultura y, para asegurar el suministro de alimentos a la capital de Arvernia, [ROOT.GetCountry.GetRuler.GetName|Y] ha invertido en la construcción de granjas en todo el región.\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 
 
