 crown_shaped_neckrings:0 "Collares en Forma de Corona"
 desc_crown_shaped_neckrings:0 "Nuestros collares en forma de corona son una joya que nos distingue de las tribus vecinas."
 cheap_move_slaves_cost:0 "Esfuerzos de Colonización"
 desc_cheap_move_slaves_cost:0 "Estamos experimentando un auge en nuestro crecimiento y debemos aprovechar nuestro impulso."

 #Lugia Vandalia
 barbaricum_vandalia_lugia_mission:0 "Las Ligas Germánicas Orientales"
 barbaricum_vandalia_lugia_mission_BUTTON_TOOLTIP:0 "¡Debemos unir a nuestras tribus vecinas bajo la bandera de [ROOT.GetCountry.GetName|G] por cualquier medio necesario!"
 barbaricum_vandalia_lugia_mission_BUTTON_DETAILS:0 ""
 barbaricum_vandalia_lugia_mission_DESCRIPTION:0 "Pertenecemos a los #E Vándalos#!, un nutrido grupo de personas con las que compartimos ritos, creencias y nuestra lengua. Un líder fuerte que nos una en estos tiempos oscuros es primordial para nuestra supervivencia continua.\n\nNosotros, los vándalos, somos un pueblo fuerte con costumbres tan antiguas como el tiempo mismo. Pero gente extraña que porta armas superiores está llegando a nuestras tierras desde el sur. \n\nTenemos que decidir qué camino tomará nuestra sociedad; ¿Seremos fieles a nuestra cultura o intentaremos igualar a esos extranjeros?"
 barbaricum_vandalia_lugia_mission_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completa cuando unamos a los germánicos orientales, ya sea formando #E Vandalia#! o #E Lugia#!."
 barbaricum_vandalia_lugia_mission_REWARD_DESCRIPTION:0 "Hacernos más poderosos uniendo a todos los Vándalos ya sea formando Vandalia o Lugia."

 # Tasks
 barbaricum_vandalia_lugia_mission_task_1:0 "La Arboleda Sagrada de las Alhiz"
 barbaricum_vandalia_lugia_mission_task_1_DESC:0 "Uno de nuestros sacerdotes tuvo una visión de los [GetDeityDefinition('omen_alcis').GetName|T] #E #T Gemelos#! #! en la cima de las montañas en [GetProvince('(int32)4005').GetName|G]. Todos los que han visitado el lugar juran poder sentir la presencia de los dioses gemelos. Proclamar oficialmente este bosque como sagrado apaciguará a nuestros sacerdotes, y ciertamente también a los Alhiz.\n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 barbaricum_vandalia_lugia_mission_task_2:0 "Urna con Rostro"
 barbaricum_vandalia_lugia_mission_task_2_DESC:0 "Como si el sacerdote sólo hubiera vivido para cumplir su sagrada misión, falleció poco después de que se estableciera oficialmente la #G Arboleda Sagrada#!. La devoción de este hombre será inspiradora para las generaciones futuras, y no escatimaremos esfuerzos para depositar sus restos mortales en la urna facial más impresionante jamás fabricada por nuestro pueblo, como estas urnas han sido habituales durante varios siglos en nuestro sociedad.\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 barbaricum_vandalia_lugia_mission_task_3:0 "La Ruta del Ámbar"
 barbaricum_vandalia_lugia_mission_task_3_DESC:0 "Las sociedades mediterráneas añoran el ámbar @amber!, conocido como #T 'Glesum'#! en nuestra lengua, de nuestros vecinos del norte. Por lo tanto, la ruta comercial que pasa por nuestras tierras también es muy lucrativa para nosotros y [ROOT.GetCountry.GetRuler.GetName|Y] ha insistido en que podríamos hacer aún mayores ganancias.\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"

 barbaricum_vandalia_lugia_mission_task_4:0 "Nuestro propio Ámbar"
 barbaricum_vandalia_lugia_mission_task_4_DESC:0 "Poseer ámbar @amber! nosotros mismos aumentaría nuestro margen de beneficio al eliminar a un intermediario codicioso de nuestras transacciones; ¿Por qué deberíamos molestarnos en importar esas cosas cuando podemos conquistar las tierras donde se encuentran en abundancia?\n\n\n\n\n\n\n\n\n\n@celt_mil2!"

 barbaricum_vandalia_lugia_mission_task_5:0 "Contacto con los Celtas"
 barbaricum_vandalia_lugia_mission_task_5_DESC:0 "Hacia el sur han aparecido tribus del oeste; se llaman #G celtas#! y son muy interesantes. Parecen tener un conocimiento superior al nuestro, por lo que deberíamos obtener acceso a él apaciguándolos.\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_vandalia_lugia_mission_task_6:0 "Un Ritual Celta"
 barbaricum_vandalia_lugia_mission_task_6_DESC:0 "Los #G celtas#! tienen rituales completamente diferentes a los nuestros. Afirman que sus dioses sólo les concederán sus bendiciones si depositan objetos de valor, como @iron! espadas de hierro o @precious_metals! joyas de oro, cerca de ríos u otras masas de agua. Podría valer la pena intentarlo para ver si estos rituales funcionan para nosotros.\n\n\n\n\n\n\n\n\n\n@celt_mil12!"

 barbaricum_vandalia_lugia_mission_task_7:0 "La Sociedad Guerrera de Lugus"
 barbaricum_vandalia_lugia_mission_task_7_DESC:0 "La #G destreza sueva#! combinada con el espíritu de las #G sociedades guerreras celtas#! darán origen a la nuestra con el tiempo. Y una cosa es segura; Los dioses de los celtas son superiores a los nuestros, ya que les han concedido el poder de conquistar grandes extensiones de tierra en un par de décadas. Pongamos nuestra sociedad guerrera bajo la protección de [GetDeityDefinition('omen_lugus').GetName|T], el dios celta de los herreros, con la esperanza de lograr grandes hazañas nuestras.\n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 barbaricum_vandalia_lugia_mission_task_8:0 "La Confederación Lugia"
 barbaricum_vandalia_lugia_mission_task_8_DESC:0 "Para que nuestro pueblo prospere, debemos unirnos en una confederación bajo los auspicios de [GetDeityDefinition('omen_lugus').GetName|T], el #G dios celta#! de los herreros, para que nosotros también podamos llevar sus brazos a batalla.\n\n\n\n\n\n\n\n\n\n@celt_mil11!"

 barbaricum_vandalia_lugia_mission_task_9:0 "Nuestra Minoría Sueva"
 barbaricum_vandalia_lugia_mission_task_9_DESC:0 "Nuestra región escasamente poblada ha visto una afluencia de inmigrantes #G suevos#! desde principios del siglo IV a.C. En adelante. Viven en aldeas apartadas y han traído consigo sus propias costumbres, muchas de las cuales son muy diferentes a las nuestras.\n\nAparte de rarezas ocasionales, se les considera un modelo a seguir de destreza militar; Si integráramos más de esta cultura en la nuestra, podríamos inspirar a nuestro propio pueblo a realizar hazañas de heroísmo, como bien.\n\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

 barbaricum_vandalia_lugia_mission_task_10:0 "Invitar a más Migrantes Suevos"
 barbaricum_vandalia_lugia_mission_task_10_DESC:0 "Ahora que nuestro propio pueblo reverencia la cultura Sueva y ya no tiene supersticiones, podemos acoger activamente a estos inmigrantes.\n\n\n\n\n\n\n\n\n\n@celt_mil7!"

 barbaricum_vandalia_lugia_mission_task_11:0 "Con Lanza y Espada"
 barbaricum_vandalia_lugia_mission_task_11_DESC:0 "¡Debemos someter a todos los demás #G vándalos#! a nosotros! ¡Dile a nuestros guerreros que una batalla gloriosa espera a los más valientes!\n\n\n\n\n\n\n\n\n\n@celt_mil1!"

 barbaricum_vandalia_lugia_mission_task_12:0 "La Unificación de los Vándalos"
 barbaricum_vandalia_lugia_mission_task_12_DESC:0 "Ahora que somos la tribu #G vándalo#! suprema y también controlamos la tierra natal de los colonos vándalos dispersos, nuestro nombre y el nombre vándalo se han convertido en uno y el mismo.\n\n\n\n\n\n\n\n\n\n@celt_mil9!"

 barbaricum_vandalia_lugia_mission_task_13:0 "Colonización del Este"
 barbaricum_vandalia_lugia_mission_task_13_DESC:0 "Al este de nuestro país se encuentran tierras casi no reclamadas que podrían ser pobladas por nuestra propia gente, y [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido que ha llegado el momento de cambiar esto.\n\n\n\n\n\n\n\n\n\n@greek_mil7!"

 barbaricum_vandalia_lugia_mission_task_14:0 "Las Llanuras Panónicas"
 barbaricum_vandalia_lugia_mission_task_14_DESC:0 "Las fértiles llanuras #G Panonia#! están a nuestro alcance, sólo hace falta extender el brazo para reclamarlas. ¡Nadie podrá impedirnos apoderarnos de sus tierras! \n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

 barbaricum_vandalia_lugia_mission_task_15:0 "Manufactorías Celtas"
 barbaricum_vandalia_lugia_mission_task_15_DESC:0 "Los #G celtas#! han progresado en la fabricación de cerámica @earthware!, así como en la extracción y fundición de mineral de hierro @iron!. Después de consultar con algunos de sus expertos, hemos encontrado lugares agradables para aplicar estas tecnologías en nuestras tierras.\n\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"

