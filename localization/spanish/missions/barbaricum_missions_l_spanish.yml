l_spanish:
 #Form Francia mission
 barbaricum_form_francia_mission:0 "¡Por la Gloria y el Honor!"
 barbaricum_form_francia_mission_BUTTON_TOOLTIP:0 "Las gentes del noroeste de Germania claman por un líder fuerte que una a los clanes. Nuestro derecho de nacimiento es evidente para todos: seremos los que guíen a nuestro pueblo hacia mayores glorias."
 barbaricum_form_francia_mission_BUTTON_DETAILS:0 ""
 barbaricum_form_francia_mission_DESCRIPTION:0 "Las gentes del noroeste de Germania claman por un líder fuerte que una a los clanes. Nuestro derecho de nacimiento es evidente para todos: seremos los que guíen a nuestro pueblo hacia mayores glorias."
 barbaricum_form_francia_mission_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completa después de que unamos a los Istvaones bajo nuestro estandarte y formemos el #E Reino franco#!."
 barbaricum_form_francia_mission_REWARD_DESCRIPTION:0 "Crear Francia bajo vuestro liderazgo, cuyo dominio sobre los Istvaeones no puede ser cuestionado."
 # Tasks

 barbaricum_form_francia_mission_task_1:0 "Un Líder Surge de la Oscuridad"
 barbaricum_form_francia_mission_task_1_DESC:0 "Muchas tribus #G germánicas#! diferentes viven entre el #Y Rin#! y el #Y Weser#!, pero ninguna de ellas tiene una posición predominante. Sólo alguien con la fuerza suficiente puede aspirar a unir a estas personas tan diversas.\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_form_francia_claims_1_tt:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)3778').GetArea.GetName|G], [GetProvince('(int32)3976').GetArea.GetName|G] y [GetProvince('(int32)3699').GetArea.GetName|G]."

 barbaricum_form_francia_mission_task_2:0 "Los muchos Hijos de Istio"
 barbaricum_form_francia_mission_task_2_DESC:0 "Como hijo más fuerte de [GetDeityDefinition('omen_istaevo').GetName|G], estamos predestinados a unir a todos nuestros hermanos bajo nuestro estandarte.\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_form_francia_claims_2_tt:0 "Obtenemos reclamos en todos los territorios en el Área de [GetProvince('(int32)3728').GetArea.GetName|G]."

 barbaricum_form_francia_mission_task_3:0 "Una Capital Digna"
 barbaricum_form_francia_mission_task_3_DESC:0 "Nuestra capital ha experimentado graves problemas de crecimiento. Si se le diera el apoyo adecuado, podría convertirse en una ciudad próspera.\n\n\n\n\n\n\n\n\n\n@greek_mil1!"

 barbaricum_form_francia_mission_task_4:0 "Sangre y Hierro"
 barbaricum_form_francia_mission_task_4_DESC:0 "No mostraremos piedad a los #G galos#!, pero continuaremos matándolos y subyugandolos.\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 invade_gaul_francia:0 "Estar en guerra con un país #G galo#!."

 barbaricum_form_francia_mission_task_5:0 "Centralizar el Estado"
 barbaricum_form_francia_mission_task_5_DESC:0 "Ha llegado el momento de que nuestro gran país se transforme en un estado sedentario más civilizado.\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_form_francia_mission_task_6:0 "El Reino Franco"
 barbaricum_form_francia_mission_task_6_DESC:0 "Es hora de darle a nuestro pueblo una nueva identidad común bajo un solo gobernante. Somos los #G Franks#!, los valientes.\n\n\n\n\n\n\n\n\n\n@celt_mil12!"

 barbaricum_form_francia_mission_task_7:0 "Comercio Germano-Celta"
 barbaricum_form_francia_mission_task_7_DESC:0 "Como mediadores e intermediarios entre los #G celtas#! y los #G suevos germánicos#!, podemos sacar provecho de nuestra posición, algo que [ROOT.GetCountry.GetRuler.GetName|Y] tiene toda la intención de hacer.\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 barbaricum_form_francia_mission_task_8:0 "Encended los Hornos"
 barbaricum_form_francia_mission_task_8_DESC:0 "Nuestros buscadores informan con júbilo haber encontrado hierro @iron! en [GetProvince('(int32)3790').GetName|T]. Necesitaríamos gastar una buena cantidad de dinero para poner en funcionamiento una mina, pero los depósitos parecen lo suficientemente grandes como para justificar la inversión.\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 barbaricum_form_francia_mission_task_8_tooltip:0 "Cada territorio con una #T Mina#! en la provincia de #G $sicambria_area$#! gana lo siguiente:\n"

 barbaricum_form_francia_mission_task_9:0 "Un Fuerte Comercial"
 barbaricum_form_francia_mission_task_9_DESC:0 "Tenemos que proteger nuestras rutas comerciales construyendo un castro en [GetProvince('(int32)3831').GetName|T], donde se cruzan dos rutas comerciales.\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 barbaricum_form_francia_mission_task_10:0 "Barra de Hierro Estándar"
 barbaricum_form_francia_mission_task_10_DESC:0 "Actualmente, nuestros herreros utilizan un estándar de barra de hierro @iron! extranjero, pero esto debería cambiar. Deberíamos codificar el uso de nuestro estándar nacional, adoptando un diseño que sea más alto que el extranjero y que también tenga forma de espada, para facilitar el comercio y proporcionar circunstancias claras para nuestros comerciantes y artesanos.\n\n\n\n\n\n\n\n\n\n@celt_mil1!"

 FRANCIA_NAME:0 "Francia"
 FRANCIA_ADJECTIVE:0 "Franco"


 #Francia - Salians and Ripuarians
 barbaricum_francia_austria_mission:0 "Salios y Ripuarios"
 barbaricum_francia_austria_mission_BUTTON_TOOLTIP:0 ""
 barbaricum_francia_austria_mission_BUTTON_DETAILS:0 ""
 barbaricum_francia_austria_mission_DESCRIPTION:0 "Aunque todas nuestras tribus se autodenominan #E francos#!, han aparecido dos facciones importantes que amenazan la precaria paz de [ROOT.GetCountry.GetRuler.GetName]. Los #E salianos#! que viven en el norte alrededor del río Isala, el moderno IJsel, y los #E ripuarios#! que viven alrededor del río Rhenus, el moderno Rin, están discutiendo sobre la dirección hacia dónde deberíamos expandirnos a continuación. ¿Deberíamos seguir a los salianos a las tierras de los #E belgas#! o acompañar a los ripuarios a través del Rhenus?"
 barbaricum_francia_austria_mission_CRITERIA_DESCRIPTION:0 "Conquistar y desarrollar las tierras a lo largo de los ríos de Germania y la tierra de los Belgae."
 barbaricum_francia_austria_mission_REWARD_DESCRIPTION:0 "Adquirir reclamaciones sobre áreas en Germania y Bélgica y beneficios para vuestro país."

 # Tasks
 barbaricum_francia_austria_mission_task_1:0 "Salland"
 barbaricum_francia_austria_mission_task_1_DESC:0 "Los #COLOR:{0.207,0.301,1} francos salianos#! están comenzando a reasentarse al norte de nuestro territorio, alrededor del río #Y Isala#!, que da nombre a esta tierra y a su pueblo. Esta región está cubierta por espesos bosques, lo que dificulta su desarrollo posterior.\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

 barbaricum_francia_austria_mission_task_2:0 "Asentarse en Toxandria"
 barbaricum_francia_austria_mission_task_2_DESC:0 "Al sur, al otro lado del río #Y Rinaz#!, se encuentra una tierra inestable y llena de oportunidades. Llamada #G Toxandria#! en nuestra lengua, significa literalmente \"tierra de la margen derecha\" o 'tierra del sur'.\n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 barbaricum_francia_austria_mission_task_3:0 "Desarrolar Toxandria"
 barbaricum_francia_austria_mission_task_3_DESC:0 "Al crear condiciones de vida adecuadas en #G Toxandria#!, muchos de los nuestros seguramente vendrán y se convertirá en un lugar adecuado. Terreno.\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 barbaricum_francia_austria_mission_task_4:0 "Avanzar Hacia el Oeste"
 barbaricum_francia_austria_mission_task_4_DESC:0 "El fértil y próspero corazón #G galo#! nos espera al oeste.\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 barbaricum_francia_austria_mission_task_5:0 "Turnacum y Camaracum"
 barbaricum_francia_austria_mission_task_5_DESC:0 "Los asentamientos llamados [GetProvince('(int32)3041').GetName|T] y [GetProvince('(int32)3045').GetName|T] serían espléndidos centros de administración, comercio y cultura.\n\n\n\n\n\n\n\n\n\n@celt_mil2!"

 barbaricum_francia_austria_mission_task_6:0 "Fortificar nuestra Frontera Occidental"
 barbaricum_francia_austria_mission_task_6_DESC:0 "Aunque el río #Y Sequana#! es una línea de defensa natural, por lo que debemos erigir fortificaciones en caso de que nuestros enemigos nos ataquen desde el oeste en gran medida números.\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 barbaricum_francia_austria_mission_task_7:0 "Ripuaria"
 barbaricum_francia_austria_mission_task_7_DESC:0 "Los #COLOR:{0.361,0.807,0.525} Francos Ripuarios#! desean vivir en el sur de nuestro territorio, a orillas del río #Y Rinaz#!. Quieren poseer la mayor cantidad posible de Rinaz y sus confluencias.\n\n\n\n\n\n\n\n\n\n@greek_mil2!"

 barbaricum_francia_austria_mission_task_8:0 "El Valle del Moenus"
 barbaricum_francia_austria_mission_task_8_DESC:0 "El serpenteante río #Y Moginos#! fluye desde el oeste hasta el #Y Rinaz#! y es el más largo. Afluente.\n\n\n\n\n\n\n\n\n\n@celt_mil9!"

 barbaricum_francia_austria_mission_task_9:0 "A lo Largo del Rhenus"
 barbaricum_francia_austria_mission_task_9_DESC:0 "El #Y Rinaz#! es un río tan grande que ningún otro con el que nos hemos topado se compara. Si lo controlamos, estaremos libres de preocupaciones por la vida y las riquezas que nos traerá.\n\n\n\n\n\n\n\n\n\n@celt_mil11!"

 barbaricum_francia_austria_mission_task_10:0 "Conversión Germánica"
 barbaricum_francia_austria_mission_task_10_DESC:0 "Muchos pueblos diferentes viven en nuestras tierras recién conquistadas, ¡deberíamos mostrarles la luz de nuestros dioses!\n\n\n\n\n\n\n\n\n\n@celt_mil12!"

 barbaricum_francia_austria_mission_task_11:0 "Triunfo de los Salios"
 barbaricum_francia_austria_mission_task_11_DESC:0 "Es hora de que la rama #COLOR:{0.207,0.301,1} Salian#! de nuestro pueblo declare su dominio y resuelva la disputa entre ir al oeste o reclamar el poder. Riberas.\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_francia_austria_mission_task_12:0 "Triunfo de los Ripuarios"
 barbaricum_francia_austria_mission_task_12_DESC:0 "Es hora de que la rama #COLOR:{0.361,0.807,0.525} Ripuaria#! de nuestro pueblo declare su dominio y resuelva la disputa entre ir al oeste o reclamar el territorio. Riberas.\n\n\n\n\n\n\n\n\n\n@celt_mil7!"

 barbaricum_francia_austria_claims_1_tt:0 "Obtenemos reclamos en todos los territorios en el Área de [GetProvince('(int32)3718').GetArea.GetName|G]."
 barbaricum_francia_austria_claims_2_tt:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)3026').GetArea.GetName|G], [GetProvince('(int32)2493').GetArea.GetName|G] y [GetProvince('(int32)2468').GetArea.GetName|G]."
 barbaricum_francia_austria_claims_3_tt:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)3041').GetArea.GetName], [GetProvince('(int32)3054').GetArea.GetName|G], [GetProvince('(int32)3055').GetArea.GetName|G], [GetProvince('(int32)3802').GetArea.GetName|G] y [GetProvince('(int32)3806').GetArea.GetName|G]."
 favor_salians:0 "Favorecer a los #COLOR:{0.207,0.301,1} salianos#! haciendo que un miembro de la familia gobernante gobierne la provincia de [GetProvince('(int32)3045').GetArea.GetName|G]."
 favor_ripuarians:0 "Favorecer a los #COLOR:{0.361,0.807,0.525} ripuarios#! haciendo que un miembro de la familia gobernante gobierne la provincia de [GetProvince('(int32)3728').GetArea.GetName|G]."
 barbaricum_francia_austria_mission_task_1_tt:0 "Poseer una ciudad en el Área de [GetProvince('(int32)3851').GetArea.GetName|G]."
 barbaricum_francia_austria_mission_task_6_tt:0 "Poseer al menos #T 3 provincias Fort#! en cada una de las Áreas de [GetProvince('(int32)3038').GetArea.GetName] y [GetProvince('(int32)3035').GetArea.GetName|G]."
 barbaricum_saxonia_form_bog_offering_tt:0 "Tener al menos #T 1 personaje#! #R encarcelado#!."
 frisian_bog_offering_mod:0 "Ofrenda de pantano"
 desc_frisian_bog_offering_mod:0 "Los dioses se complacen con la ofrenda de nuestros Caciques."


 #Saxonia - formation
 barbaricum_saxonia_form_mission:0 "El Vasto Mar del Norte"
 barbaricum_saxonia_form_mission_BUTTON_TOOLTIP:0 "Las #E tribus sajonas#! claman por un líder fuerte para unir a los clanes, un llamado que [ROOT.GetCountry.GetRuler.GetName] ha escuchado alto y claro. Nuestro derecho de nacimiento está claro para que todos lo vean: seremos nosotros quienes conduzcamos a nuestro pueblo hacia mayores glorias."
 barbaricum_saxonia_form_mission_BUTTON_DETAILS:0 ""
 barbaricum_saxonia_form_mission_DESCRIPTION:0 "Las #E tribus sajonas#! claman por un líder fuerte para unir a los clanes, un llamado que [ROOT.GetCountry.GetRuler.GetName] ha escuchado alto y claro. Nuestro derecho de nacimiento está claro para que todos lo vean: seremos nosotros quienes conduzcamos a nuestro pueblo hacia mayores glorias."
 barbaricum_saxonia_form_mission_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completa después de que construyamos una armada en el Mar del Norte, unamos a los #E germánicos#! del Mar del Norte y formemos #E Sajonia#!."
 barbaricum_saxonia_form_mission_REWARD_DESCRIPTION:0 "Conducir a los Germanos del Mar del Norte a mayores glorias formando Sajonia."

 # Tasks
 barbaricum_saxonia_form_mission_task_1:0 "Zarpar "
 barbaricum_saxonia_form_mission_task_1_DESC:0 "Hay muchas oportunidades esperándonos al otro lado de las aguas: construyamos o tomemos un puerto para poder reclamar el #Y Mar del Norte#! como nuestro propio.\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"

 barbaricum_saxonia_form_mission_task_2:0 "Costa del Mar del Norte"
 barbaricum_saxonia_form_mission_task_2_DESC:0 "La costa del #Y Mar del Norte#!, habitada por los #G Ingvaeonics#!, se compone principalmente de playas de arena, estuarios de ríos y el #Y Mar de Wadden#!. Ciertamente no será una tarea fácil conquistarlos y unirlos bajo nuestro liderazgo, pero eso es exactamente lo que [ROOT.GetCountry.GetRuler.GetName|Y] debe hacer.\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 barbaricum_saxonia_form_mission_task_3:0 "Expandir la Armada"
 barbaricum_saxonia_form_mission_task_3_DESC:0 "Deberíamos aprovechar la ampliación de nuestros puertos y astilleros para construir más barcos, lo que nos permitiría proyectar nuestro poder en el extranjero con mayor eficacia.\n\n\n\n\n\n\n\n\n\n@greek_mil4!"

 barbaricum_saxonia_form_mission_task_4:0 "Saquear Pritania"
 barbaricum_saxonia_form_mission_task_4_DESC:0 "Como isla aislada, #G Pritania#! será presa fácil para nuestros asaltantes, ya que varias generaciones no han visto una marina. Invasión.\n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 barbaricum_saxonia_form_mission_task_5:0 "Poder Militar"
 barbaricum_saxonia_form_mission_task_5_DESC:0 "Debido a que los dioses de la guerra están con [ROOT.GetCountry.GetRuler.GetName|T], nuestros asaltantes y guerreros han traído innumerables victorias a las tribus de [ROOT.GetCountry.GetName|G]. Ha llegado el momento de compartir la riqueza con las élites que viven dentro de [ROOT.GetCountry.GetCapital.GetName|T]; nuestros parientes utilizarán esta ganancia inesperada para fortalecer nuestras levas con armas de hierro @iron!.\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 barbaricum_saxonia_form_mission_task_6:0 "Los Sajones"
 barbaricum_saxonia_form_mission_task_6_DESC:0 "Los pequeños puñales, llamados 'sax' o 'seax' en nuestro idioma, utilizados durante nuestras incursiones nos han valido el exónimo de #G sajones#!. ¡Enviemos un mensaje claro a todos los débiles que tiemblan ante nuestra fuerza unida!\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_saxonia_form_mission_task_7:0 "Comercio del Mar del Norte"
 barbaricum_saxonia_form_mission_task_7_DESC:0 "El #T comercio marítimo#! ha sido el sustento del pueblo #G ingvaeónico#! durante generaciones. Con el estímulo adecuado de [ROOT.GetCountry.GetCapital.GetName|T], podríamos aumentar nuestras ganancias.\n\n\n\n\n\n\n\n\n\n@celt_mil2!"

 barbaricum_saxonia_form_mission_task_8:0 "Ofrenda al Pantano"
 barbaricum_saxonia_form_mission_task_8_DESC:0 "Nuestras mazmorras están llenas de criminales que podríamos sacrificar en una ofrenda al pantano para apaciguar a los dioses.\n\n\n\n\n\n\n\n\n\n@celt_mil15!"

 barbaricum_saxonia_form_mission_task_9:0 "Sacrificio a [GetDeityDefinition('omen_yngvi').GetName]"
 barbaricum_saxonia_form_mission_task_9_DESC:0 "Nuestro señor, [GetDeityDefinition('omen_yngvi').GetName|T], requiere un sacrificio antes de bendecirnos. ¡Ha llegado el momento de desatar su furia divina contra nuestros enemigos!\n\n\n\n\n\n\n\n\n\n@celt_mil9!"

 barbaricum_saxonia_form_mission_task_10:0 "Fortificar Nuestra Capital"
 barbaricum_saxonia_form_mission_task_10_DESC:0 "Como sede de nuestra autoridad, no es tolerable que [ROOT.GetCountry.GetCapital.GetName|T] carezca de las fortificaciones adecuadas. Necesitamos erigir nuevos muros, un foso y montículos de tierra para proteger a quienes dependen de nosotros para su protección.\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 barbaricum_saxonia_form_mission_task_11:0 "La caza del zorro"
 barbaricum_saxonia_form_mission_task_11_DESC:0 "Las astutas tribus de [GetCountry('EBS').GetName|G] son demasiado inteligentes para su propio bien y se les debe enseñar una valiosa lección de humildad, una tarea que [ROOT.GetCountry.GetRuler.GetName|T] espera emprender. [ROOT.GetCountry.GetRuler.GetHerHim] auto.\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 frisians_must_raid_into_eburonia:0 "Nuestro jefe tribal debe utilizar #R Go Raiding#! #T Interacción de personajes#! en #G Eburonia#!."

 barbaricum_saxonia_form_claims_1_tt:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)3834').GetArea.GetName|G], [GetProvince('(int32)3862').GetArea.GetName|G] y [GetProvince('(int32)3839').GetArea.GetName|G]."
 barbaricum_saxonia_form_claims_2_tt:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)3867').GetArea.GetName|G] y [GetProvince('(int32)3848').GetArea.GetName|G]."
 invade_britain_saxonia:0 "Estar en guerra con un país #G Pritanniano#!."

 barbaricum_saxon_owns_port_tt:0 "Necesitamos poseer al menos #T 1 puerto#!."
 saxon_barbaricum_ship_mod:0 "Marineros sajones"
 desc_saxon_barbaricum_ship_mod:0 "Los miembros de nuestra tribu se han vuelto expertos en apoderarse de barcos enemigos en el mar."
 saxon_pritannia_modifier_1:0 "Pritannianos complacidos"
 desc_saxon_pritannia_modifier_1:0 "Las tribus sajonas están satisfechas con sus líderes por conquistar y mejorar la infraestructura dentro de Pritania."
 saxon_pritannia_modifier_2:0 "Ciudades sajonas"
 desc_saxon_pritannia_modifier_2:0 "Este asentamiento se ha convertido en una opción popular para los sajones migratorios que desean establecer sus hogares dentro de Pritannia."
 frisian_ship_building_mod:0 "Constructores de barcos frisones"
 desc_frisian_ship_building_mod:0 "Nuestros miembros de la tribu están trabajando diligentemente en la tarea de construir una armada adecuada para Frisia."

 #Saxonia - Pritannia
 barbaricum_saxonia_anglia_mission:0 "La Isla Soberana de Pritania"
 barbaricum_saxonia_anglia_mission_BUTTON_TOOLTIP:0 "Este trono real de reyes, esta isla soberana, \nEsta tierra de majestad, esta sede de Tyr, \nEste otro Valhöl, el semiparaíso,\nEsta fortaleza construida por la Naturaleza para sí misma\nContra la enfermedad y la mano de la guerra,\nEsta feliz raza de hombres, este pequeño mundo,\nEsta piedra preciosa colocada en el mar de plata,\nQue le sirve en la sala de una pared,\nO como un foso defensivo a una casa,\nContra la envidia de tierras menos felices,\nEsta bendita parcela, esta tierra, este reino, es Pritania."
 barbaricum_saxonia_anglia_mission_BUTTON_DETAILS:0 ""
 barbaricum_saxonia_anglia_mission_DESCRIPTION:0 "Este trono real de reyes, esta isla soberana, \nEsta tierra de majestad, esta sede de Tyr, \nEste otro Valhöl, el semiparaíso,\nEsta fortaleza construida por la Naturaleza para sí misma\nContra la enfermedad y la mano de la guerra,\nEsta feliz raza de hombres, este pequeño mundo,\nEsta piedra preciosa colocada en el mar de plata,\nQue le sirve en la sala de una pared,\nO como un foso defensivo a una casa,\nContra la envidia de tierras menos felices,\nEsta bendita parcela, esta tierra, este reino, es Pritania."
 barbaricum_saxonia_anglia_mission_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completa cuando [ROOT.GetCountry.GetName] gobierne la isla de #E Pritania#!."
 barbaricum_saxonia_anglia_mission_REWARD_DESCRIPTION:0 "Invadir y conquistar la isla de Pritania bajo un rey fuerte."

 # Tasks
 barbaricum_saxonia_anglia_mission_task_1:0 "Posicionarse en Pritania"
 barbaricum_saxonia_anglia_mission_task_1_DESC:0 "Primero tenemos que establecer un punto de apoyo en #G Pritania#! antes de reclamar más tierras.\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 barbaricum_saxonia_anglia_mission_task_1_tooltip:0 "Sea propietario de cualquier territorio en la región de [GetProvince('(int32)2009').GetArea.GetRegion.GetName|G]."

 barbaricum_saxonia_anglia_mission_task_2:0 "La Costa Sur"
 barbaricum_saxonia_anglia_mission_task_2_DESC:0 "[GetProvince('(int32)2021').GetArea.GetName|G], cuyas costas se encuentran tan cerca de la nuestra, sería un objetivo ideal para una fuerza invasora; hagamos lo que podamos para establecer una cabeza de playa para futuras invasiones del continental.\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 barbaricum_saxonia_anglia_mission_task_3:0 "La Costa Oriental"
 barbaricum_saxonia_anglia_mission_task_3_DESC:0 "[GetProvince('(int32)2029').GetArea.GetName|G] sería un primer objetivo fácil: nuestras tropas no deberían tener problemas para aplastar y destruir a los débiles icenios. Una vez que hayamos capturado su ciudad de [GetProvince('(int32)2032').GetName|G], ¡la saquearemos y robaremos todo lo valioso!\n\n\n\n\n\n\n\n\n\n@celt_mil7!"

 barbaricum_saxonia_anglia_mission_task_4:0 "La Costa Norte"
 barbaricum_saxonia_anglia_mission_task_4_DESC:0 "Al otro lado del #Y río Humber#! nos esperan nuevas tierras no conquistadas, y nuestros soldados claman por ¡batalla!\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

 barbaricum_saxonia_anglia_mission_task_5:0 "Wessex"
 barbaricum_saxonia_anglia_mission_task_5_DESC:0 "La zona occidental de #G Pritannia#! aún no es de nuestra propiedad, pero pronto se convertirá en un nuevo hogar para nuestra gente.\n\n\n\n\n\n\n\n\n\n@celt_mil9!"

 barbaricum_saxonia_anglia_mission_task_6:0 "Sussex y Essex"
 barbaricum_saxonia_anglia_mission_task_6_DESC:0 "Deberíamos establecer un nuevo hogar para nuestro pueblo en el sur y sureste.\n\n\n\n\n\n\n\n\n\n@celt_mil11!"

 barbaricum_saxonia_anglia_mission_task_7:0 "El Corazon de Pritania"
 barbaricum_saxonia_anglia_mission_task_7_DESC:0 "Ahora que controlamos su costa, es hora de avanzar hacia el interior de #G Pritania#!.\n\n\n\n\n\n\n\n\n\n@celt_mil12!"

 barbaricum_saxonia_anglia_mission_task_8:0 "Anglia Oriental"
 barbaricum_saxonia_anglia_mission_task_8_DESC:0 "La zona plana, baja y pantanosa es reclamada por la fuerte facción #G anglos#!; algo que no podemos negarles, aunque esperábamos que las antiguas lealtades tribales desaparecieran.\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 barbaricum_saxonia_anglia_mission_task_8_tt:0 "Necesitamos poseer al menos #T 7 territorios#! dentro del área #G Icenia#! que tenga #G cimbria#! o #G ingvaeónica#! como #T cultura#! dominante, y su religión debe ser #Y Turístico#!."

 barbaricum_saxonia_anglia_mission_task_9:0 "Northumbria"
 barbaricum_saxonia_anglia_mission_task_9_DESC:0 "Nuestra tierra al norte de #Y Humber#! necesita urgentemente mejoras; No sólo debemos conquistar territorios, sino hacer lo que podamos para desarrollar la infraestructura local. Si dedicamos tiempo y esfuerzo a mejorar las condiciones dentro de #G Northumbria#!, entonces todas nuestras tribus estarán satisfechas.\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_saxonia_anglia_mission_task_9_tt:0 "Necesitamos al menos #T 1 ciudad#! en el área #G Brigantia#! o #G Coritania#! que tenga un puerto #T#!. #G Brigantia#! y #G Coritania#! también necesitarán tener #T 1 inversión provincial#! cada una, como #Y fortificaciones provinciales#!, #Y infraestructura estatal#!, #Y dirigida Inversiones#! o #Y Complejos religiosos#!."

 barbaricum_saxonia_anglia_mission_task_10:0 "Puerto Occidental"
 barbaricum_saxonia_anglia_mission_task_10_DESC:0 "Deberíamos establecer un puerto en la costa oeste de #G Pritania#!; [GetProvince('(int32)2047').GetName|G] parece ser un lugar ideal. No solo controla una ubicación estratégica, sino que el área está repleta de peces @fish!.\n\n\n\n\n\n\n\n\n\n@greek_mil4!"

 barbaricum_saxonia_anglia_mission_task_11:0 "Las Minas de Belerion"
 barbaricum_saxonia_anglia_mission_task_11_DESC:0 "La fama de las minas de Belerion es conocida incluso en lugares tan lejanos como el mundo Mediterráneo. No podemos permitirnos no explotar estas minas nosotros mismos.\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 barbaricum_saxonia_anglia_mission_task_11_tt:0 "Necesitamos construir #T 2 minas#! dentro de la provincia de #G Dumnonia#!."
 dumnonian_saxon_mines_receive_bonus_tt:0 "#Y Al completar esta tarea, las minas que hayamos construido recibirán una bonificación especial.#!"

 barbaricum_saxonia_anglia_mission_task_12:0 "Fortificar Mercia"
 barbaricum_saxonia_anglia_mission_task_12_DESC:0 "#G Mercia#!, nuestra marcha, necesita fortificaciones contra nuestro #G celta occidental#! vecinos.\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 barbaricum_saxonia_anglia_mission_task_12_tt:0 "Necesitamos poseer #T 1 fuerte#! en la provincia de #G Dobunnia#!."

 barbaricum_saxonia_anglia_mission_task_13:0 "Londinium"
 barbaricum_saxonia_anglia_mission_task_13_DESC:0 "Las orillas del #Y Tamesis#! son un lugar agradable para fundar un centro en #G Pritannia#!.\n\n\n\n\n\n\n\n\n\n@greek_mil1!"

 barbaricum_saxonia_anglia_mission_task_13b:0 "Kent"
 barbaricum_saxonia_anglia_mission_task_13b_DESC:0 "#G Cantium#!, o, en nuestro idioma, #G 'Kent'#!, ha sido habitado por los #G Cantiaci#!. Allí, en [GetProvince('(int32)2021').GetName|G], nuestros sacerdotes sienten la presencia de los dioses, por lo que es nuestro deber embellecer este lugar.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"

 barbaricum_saxonia_anglia_mission_task_14:0 "El Mar de Hibernia"
 barbaricum_saxonia_anglia_mission_task_14_DESC:0 "El #Y Mar de Hibernia#! separa las islas de #G Hibernia#! y #G Pritania#!. Controlarlo es primordial para detener cualquier tipo de amenaza hiberniana o subyugar esta isla salvaje.\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"

 barbaricum_saxonia_anglia_mission_task_15:0 "Reino Sajón"
 barbaricum_saxonia_anglia_mission_task_15_DESC:0 "La orgullosa herencia de nuestro pueblo ha perdurado durante generaciones y, sin embargo, nuestros dominios y nuestra población en constante crecimiento han aportado un mayor conocimiento del mundo y de las personas que nos rodean.\n\n Para garantizar la seguridad y la prosperidad continua, es hora de que reorganicemos nuestra estructura tribal en el #G sajón. Reino#!.\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_saxonia_anglia_mission_task_16:0 "Reino Anglo-Sajón"
 barbaricum_saxonia_anglia_mission_task_16_DESC:0 "La orgullosa herencia de nuestro pueblo ha perdurado durante generaciones, y sin embargo nuestros dominios y población, cada vez más numerosos, nos han aportado un mayor conocimiento del mundo y de los pueblos que nos rodean.\n\nPara garantizar que nuestra seguridad y prosperidad continúen, ha llegado el momento de reorganizar nuestra estructura tribal y formar un Reino que base su fuerza en nuestra élite Anglia.\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"

 barbaricum_saxonia_anglia_mission_task_17:0 "Reino Juto-Sajón"
 barbaricum_saxonia_anglia_mission_task_17_DESC:0 "La orgullosa herencia de nuestro pueblo ha perdurado durante generaciones, y sin embargo nuestros dominios y población, cada vez más numerosos, nos han aportado un mayor conocimiento del mundo y de los pueblos que nos rodean.\n\nPara garantizar que nuestra seguridad y prosperidad continúen, ha llegado el momento de reorganizar nuestra estructura tribal y formar un Reino que base su fuerza en nuestra élite Eudosia.\n\n\n\n\n\n\n\n\n\n@event_pic13!"

 barbaricum_saxonia_anglia_claims_1_tt:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)2018').GetArea.GetName|G], [GetProvince('(int32)2029').GetArea.GetName|G], [GetProvince('(int32)2057').GetArea.GetName|G] y [GetProvince('(int32)2076').GetArea.GetName|G]."
 barbaricum_saxonia_anglia_claims_2_tt:0 "Obtenemos reclamos en todos los territorios en el Área de [GetProvince('(int32)2011').GetArea.GetName|G]."
 barbaricum_saxonia_anglia_claims_3_tt:0 "Obtenemos reclamos en todos los territorios en el Área de [GetProvince('(int32)2029').GetArea.GetName|G]."
 barbaricum_saxonia_anglia_claims_4_tt:0 "Obtenemos reclamos en todos los territorios en el Área de [GetProvince('(int32)2046').GetArea.GetName|G]."
 barbaricum_saxonia_anglia_claims_5_tt:0 "Obtenemos reclamos en todos los territorios en el Área de [GetProvince('(int32)2000').GetArea.GetName|G]."
