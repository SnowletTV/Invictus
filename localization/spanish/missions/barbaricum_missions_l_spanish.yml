 vandal_boihaemian_relations_tt:0 "Cualquier #G tribu de cultura gala#! que viva en el #G área de Boiohaeum#! o en la #G región de Panonia#! tiene al menos #T 15 opiniones#! sobre nosotros."

 vandal_face_urn:0 "Urna de Rostro Vándalo"
 vandal_face_urn_desc:0 "Uno de los mayores honores otorgados a nuestras élites culturales es el enterramiento en una Urna de Rostro."

 #Goths
 barbaricum_gothonia_mission:0 "Manantial de nuestro Pueblo"
 barbaricum_gothonia_mission_BUTTON_TOOLTIP:0 ""
 barbaricum_gothonia_mission_BUTTON_DETAILS:0 ""
 barbaricum_gothonia_mission_DESCRIPTION:0 "En nuestras canciones e historias, se cuenta cómo se decía que nuestro pueblo, los #E godos#!, surgieron de una isla que llamaron #E Escandia#!, y como las abejas que abandonan su colmena cuando ésta se ha vuelto superpoblada, nuestros antepasados abandonaron sus hogares para buscar nuevas tierras. Nuestro mundo nunca ha sido el mismo desde entonces.\n\nLas personas que fueron testigos de esos acontecimientos que marcaron época hace mucho tiempo deben haber tenido dudas sobre su futuro, al igual que nosotros ahora, pero, como un arroyo burbujeante que serpentea a través de un bosque oscuro, encontraremos nuestro camino, y esta esperanza se ha convertido en una fuente para nuestro pueblo, que nos sostiene durante los tiempos difíciles.\n\nY mientras el sonido de El torrente de agua se ha callado, se profetizó que algún día esta fuente volvería a ser escuchada, y su sonido llamaría a nuestro pueblo a la búsqueda de la #E Tierra Prometida#!."
 barbaricum_gothonia_mission_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completa cuando controlemos el #E Báltico#! o hayamos migrado a otras tierras."
 barbaricum_gothonia_mission_REWARD_DESCRIPTION:0 "Ganar reclamaciones sobre las tierras del Báltico o las tierras que tenemos al sur y al este."

 # Tasks

 barbaricum_gothonia_mission_task_16:0 "Reclamando la costa"
 barbaricum_gothonia_mission_task_16_DESC:0 "Ha llegado el momento de expandirnos hacia el norte; Hay muchas oportunidades disponibles para las naciones marineras que una tribu sin salida al mar nunca tendría, y [ROOT.GetCountry.GetRuler.GetName|T] desea acceso al agua para las tribus de [ROOT.GetCountry.GetName|G].\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 barbaricum_gothonia_mission_task_1:0 "Puertos Bálticos"
 barbaricum_gothonia_mission_task_1_DESC:0 "Si queremos tener acceso al #Y Mar Báltico#!, necesitamos controlar y establecer puertos propios en su costa.\n\n\n\n\n\n\n\n\n\n@greek_mil4!"

 barbaricum_gothonia_mission_task_2:0 "Relaciones Cimbrias"
 barbaricum_gothonia_mission_task_2_DESC:0 "La península #G Cimbria#! es una parada intermedia ideal para futuras expediciones, un hecho en el que coinciden todos los que viven en [ROOT.GetCountry.GetCapital.GetName|T]. Pluma o espada, es decisión de [ROOT.GetCountry.GetRuler.GetName|Y] cómo accedemos a esta base de operaciones; lo único seguro es que hay que hacerlo.\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_gothonia_mission_task_3:0 "La Tierra de los Dioses"
 barbaricum_gothonia_mission_task_3_DESC:0 "#G Escandia#!, la supuesta tierra de los dioses, se encuentra en algún lugar al norte. Con nuestra armada a mano y nuestra base de operaciones de Cimbria como plataforma de lanzamiento, podríamos iniciar una expedición y examinar la verdad detrás de los mitos.\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

 barbaricum_gothonia_mission_task_4:0 "Glesum"
 barbaricum_gothonia_mission_task_4_DESC:0 "El ámbar @amber!, llamado #T 'Glesum'#! por los #G germánicos#!, se produce a partir de la médula excretada por árboles pertenecientes al género de los pinos, como la goma de la cereza y la resina del pino común. Al principio es un líquido que brota en cantidades considerables y se endurece gradualmente. - #Y Plinio#!, #T Naturalis Historia#!\n\n\n\n\n\n\n\n\n\n@greek_mil16!"

 barbaricum_gothonia_mission_task_5:0 "Agricultura del Centeno"
 barbaricum_gothonia_mission_task_5_DESC:0 "El centeno, un cereal @grain!, se introdujo en nuestras tierras hace unos siglos y rápidamente se ha convertido en un alimento básico de nuestra dieta. Debido al extenso cultivo y consumo de este sabroso cereal, los #G rugianos#!, que significa agricultores de centeno, recibieron el nombre con el que se les conoce en este lugar. Día.\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"

 barbaricum_gothonia_mission_task_6:0 "Costa Báltica"
 barbaricum_gothonia_mission_task_6_DESC:0 "Controlar la costa sur del #G Báltico#! es el primer paso para establecer un imperio báltico, y [ROOT.GetCountry.GetRuler.GetName|Y] ha dicho a nuestros guerreros que se preparen para guerra.\n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 barbaricum_gothonia_mission_task_7:0 "Nudo Suevo"
 barbaricum_gothonia_mission_task_7_DESC:0 "Al oeste, los #G suevos#! son legendarios por su destreza militar, ganándose el respeto de nuestros #T jefes tribales#! y especialmente de [ROOT.GetCountry.GetRuler.GetName|Y]. Si tuviéramos relaciones amistosas con estos poderosos combatientes, podrían permitir que nuestros propios guerreros estudiaran su cultura e incluso podrían recibir entrenamiento.\n\n\n\n\n\n\n\n\n\n@event_pic13!"

 barbaricum_gothonia_mission_task_8:0 "Embargo del Hierro"
 barbaricum_gothonia_mission_task_8_DESC:0 "La escasez de hierro @iron! nos plantea un problema. Una posible solución sería que todo el hierro y los objetos de hierro ya no fueran propiedad de cada individuo, de modo que ya no pudieran depositarse en tumbas ni usarse en levantamientos, pero hay muchos miembros de tribus que viven dentro de [ROOT.GetCountry.GetName|G] que no están contentos con esta propuesta. Cambio.\n\n\n\n\n\n\n\n\n\n@celt_mil1!"

 barbaricum_gothonia_mission_task_9:0 "Un Valioso Artefacto"
 barbaricum_gothonia_mission_task_9_DESC:0 "Un comerciante nos ha obsequiado un pequeño caldero de bronce de fabricación extranjera que se inspiró en la cultura #G Suebia#!. Tiene un asa que representa a un guerrero suebio barbudo, fácilmente reconocible por su nudo suevo. Deberíamos adquirir este precioso artefacto y exhibirlo en algún lugar de nuestros reinos, para que toda nuestra gente pueda venir y maravillarse con su maravillosa artesanía.\n\n\n\n\n\n\n\n\n\n@celt_mil2!"

 barbaricum_gothonia_mission_task_10:0 "Círculos de Piedra"
 barbaricum_gothonia_mission_task_10_DESC:0 "Nuestros contactos con los #G germánicos#! del norte han provocado la migración a nuestras tierras de pequeños grupos de extranjeros que trajeron consigo algunas de sus tradiciones funerarias. Sin embargo, estos recién llegados adoptaron muy pronto la cultura espiritual y material de nuestra población local, y esta amalgama de su cultura y la nuestra ahora también se está extendiendo entre nuestra propia gente. Gracias a esta mezcla, ya no es raro encontrar círculos de piedra cerca de los túmulos que se utilizan en rituales y como lugares de reunión.\n\n\n\n\n\n\n\n\n\n@india_mil2!"

 barbaricum_gothonia_mission_task_11:0 "Migración hacia el Este"
 barbaricum_gothonia_mission_task_11_DESC:0 "Hay tierras escasamente pobladas al este de nuestro país donde nuestros hijos posteriores podrían construir su propia fortuna. Aunque el camino por delante será difícil de recorrer, las tribus de [ROOT.GetCountry.GetName|G] seguirán a [ROOT.GetCountry.GetRuler.GetName|Y] hasta los confines de la tierra si el [ROOT.GetCountry.GetRulerTitle] lo exige. It.\n\n\n\n\n\n\n\n\n\n@greek_mil7!"

 barbaricum_gothonia_mission_task_12:0 "Hacia los Alpes"
 barbaricum_gothonia_mission_task_12_DESC:0 "Hay una disputa entre nuestro pueblo, ya que algunos quieren que dirijamos nuestros esfuerzos hacia los #G Alpes#!, más cerca de las riquezas de #G Italia#!, y otros hacia el #Y Mar Negro#!, más cerca de las riquezas de las #G colonias griegas#!. Después de mucha deliberación, [ROOT.GetCountry.GetRuler.GetName|Y] ha resuelto esta disputa eligiendo los #G Alpes#!.\n\n\n\n\n\n\n\n\n\n@celt_mil7!"

 barbaricum_gothonia_mission_task_13:0 "Hacia el Mar Negro"
 barbaricum_gothonia_mission_task_13_DESC:0 "Hay una disputa entre nuestro pueblo, ya que algunos quieren que dirijamos nuestros esfuerzos hacia los #G Alpes#!, más cerca de las riquezas de Italia, y otros hacia el #Y Mar Negro#!, más cerca de las riquezas de las colonias #G griegas#!. Después de considerar los argumentos de todos y debatir los méritos de sus propuestas, [ROOT.GetCountry.GetRuler.GetName|Y] ha resuelto esta disputa eligiendo el #Y Negro Mar#!.\n\n\n\n\n\n\n\n\n\n@persia_mil17!"

 barbaricum_gothonia_mission_task_14:0 "Gothiscandia"
 barbaricum_gothonia_mission_task_14_DESC:0 "Cuentos, mitos y leyendas sobre #R Gothiscandia#!, la supuesta tierra de origen de nuestro pueblo hace incontables generaciones, fueron contados de generación en generación y aún están vivos en la memoria de nuestro pueblo. Controlar #G Scandia#! nosotros mismos haría que se hicieran realidad nuevamente.\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 barbaricum_gothonia_mission_task_15:0 "Ruta del Ámbar"
 barbaricum_gothonia_mission_task_15_DESC:0 "Las sociedades mediterráneas anhelan nuestro ámbar @amber!, al que llamamos #T Glesum#!, y les cambiamos nuestras joyas de color dorado por sus monedas de oro y plata, un arreglo que encaja perfectamente con [ROOT.GetCountry.GetRuler.GetName|Y]. La valiosa ruta comercial, que comienza en nuestras tierras, es muy lucrativa para nosotros y nos da acceso a lujos exóticos.\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"


 barbaricum_gothonia_mission_task_6_tooltip:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)3862').GetArea.GetName|G], [GetProvince('(int32)3867').GetArea.GetName|G], [GetProvince('(int32)3881').GetArea.GetName|G], [GetProvince('(int32)6000').GetArea.GetName|G], [GetProvince('(int32)6008').GetArea.GetName|G], [GetProvince('(int32)6016').GetArea.GetName|G] y [GetProvince('(int32)6037').GetArea.GetName|G]."
