#Bohemia (Gaul)
 barbaricum_bohemia_mission:0 "El Hogar de los Boii"
 barbaricum_bohemia_mission_BUTTON_TOOLTIP:0 ""
 barbaricum_bohemia_mission_BUTTON_DETAILS:0 ""
 barbaricum_bohemia_mission_DESCRIPTION:0 "Las tribus salvajes que habitan las montañas escarpadas y los valles forestales de [ROOT.GetCountry.GetName] son temidas en todo el mundo civilizado por su ferocidad, y con razón. Periódicamente, hordas de estos salvajes errantes emigran de sus asentamientos, tentados por los tesoros de las ciudades blandas que están listas para ser tomadas, pero hay quienes en nuestra tribu desean desarrollar nuestra tierra natal antes de que nos aventuremos a salir de ella."
 barbaricum_bohemia_mission_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completa cuando los #E Boii#! hayan consolidado el control sobre los territorios que rodean su tierra ancestral."
 barbaricum_bohemia_mission_REWARD_DESCRIPTION:0 ""

 # Tasks
 barbaricum_bohemia_mission_task_1:0 "Federación Boii"
 barbaricum_bohemia_mission_task_1_DESC:0 "Las luchas internas entre nuestros jefes tribales están dañando nuestro verdadero potencial al causar divisiones innecesarias. No sólo estamos separados por pequeñas rivalidades, sino que la geografía de nuestro territorio, con sus colinas alegres, bosques densos y montañas imponentes, también divide a nuestro pueblo; todos los impedimentos para establecer nuestro comando centralizado.\n\nSi aumentamos la autoridad absoluta de [ROOT.GetCountry.GetRuler.GetName|Y], solo nos beneficiará en el futuro. \n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_bohemia_mission_task_2:0 "Nuevo Estándar Monetario"
 barbaricum_bohemia_mission_task_2_DESC:0 "Una de tantas cosas que nos diferencia de otras tribus #G celtas#! es nuestro uso de monedas de oro, que acuñamos con orgullo en nuestros propios territorios. Deberíamos considerar estandarizar nuestra moneda; Estampar las imágenes de nuestros jefes en nuestras monedas, a la manera de los grandes reyes, sin duda aumentaría nuestra posición en casa y en el extranjero. \n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 barbaricum_bohemia_mission_task_3:0 "Acrópolis de Baemia"
 barbaricum_bohemia_mission_task_3_DESC:0 "Los bosques primitivos de [GetProvince('(int32)3937').GetName|G], situados cerca de nuestra capital y sagrados para nuestro pueblo, son un lugar ideal para una nueva ciudad; Deberíamos considerar invertir en construcción cuando podamos permitírnoslo. Incluso podríamos construir un #T Gran Templo#! donde se encuentran nuestros bosques sagrados, para que los dioses estén complacidos con nosotros. \n\n\n\n\n\n\n\n\n\n@greek_mil16!"

 barbaricum_bohemia_mission_task_4:0 "Colonizar la Cuenca Boihaemiana"
 barbaricum_bohemia_mission_task_4_DESC:0 "Las tierras de la #G Cuenca de Boihemian#!, repletas de recursos y nominalmente pobladas por nuestra gente, claman por ser colonizadas por completo; Después de nuestra reciente serie de éxitos, finalmente estamos en condiciones de hacerlo. Envíe un mensaje a los miembros de nuestra tribu y vea quién está dispuesto a mudarse allí. \n\n\n\n\n\n\n\n\n\n@greek_mil7!"

 barbaricum_bohemia_mission_task_5:0 "Comercio Taurisciano"
 barbaricum_bohemia_mission_task_5_DESC:0 "Aunque siempre hemos tenido relaciones cálidas con nuestros vecinos los #G tauriscianos#!, deberíamos considerar llevar esto un paso más allá y comenzar a comerciar con ellos; tal vez una verdadera amistad crezca si estamos conectados por vínculos económicos. \n\n\n\n\n\n\n\n\n\n@greek_mil13!"

 barbaricum_bohemia_mission_task_6:0 "Alianza Taurisciana"
 barbaricum_bohemia_mission_task_6_DESC:0 "Aunque los #G Boii#! no temen a nadie, extendemos nuestra oferta de amistad a aquellos que piensan y actúan como nosotros. Los #G tauriscianos#!, animados por la riqueza comercial que generamos juntos, podrían ser buenos aliados contra las tribus de nuestro sur. \n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 barbaricum_bohemia_mission_task_7:0 "Hacia Panonia"
 barbaricum_bohemia_mission_task_7_DESC:0 "Toda #G Panonia#! está ante nosotros, lista para someterse a nuestras armas, y si seguimos los sinuosos arroyos a través de los valles y bosques de #G Celemantia#! y #G Quadia#!, incluso podríamos extender nuestras posesiones a las tierras de #G Cotinia#!, si así lo deseamos. Suerte. \n\n\n\n\n\n\n\n\n\n@celt_mil6!"

 barbaricum_bohemia_mission_task_8:0 "Colonizar la Tierra Más Allá de los Sudetes"
 barbaricum_bohemia_mission_task_8_DESC:0 "Desde que nuestros Antiguos tienen uso de razón, nunca nos hemos asentado al norte de las #G Montañas de los Sudetes#!, y en años pasados nos contentábamos con simplemente realizar incursiones. Sin embargo, las cosas cambian y los #G Boii#! no son de los que se quedan quietos. Envía a nuestro miembro de la tribu a través de los valles hacia esta tierra virgen. \n\n\n\n\n\n\n\n\n\n@celt_mil7!"

 barbaricum_bohemia_mission_task_9:0 "Desarrollar nuestras Tierras Transsudéticas"
 barbaricum_bohemia_mission_task_9_DESC:0 "Deberíamos considerar la posibilidad de emprender un programa de construcción en los terrenos entre las #G Montañas de los Sudetes#!; cosa curiosa, ser testigo del crecimiento de nuestra floreciente civilización. No somos simples bárbaros que vivimos de la rapiña y el saqueo: somos constructores con una visión a largo plazo. \n\n\n\n\n\n\n\n\n\n@celt_mil14!"

 barbaricum_bohemia_mission_task_10:0 "Amenaza Germánica"
 barbaricum_bohemia_mission_task_10_DESC:0 "Las feroces #R tribus germánicas#! de nuestro norte, si bien no son rivales para los #G boii#! cuando se trata de armas o hazañas de valentía, son sin duda una amenaza que no debemos ignorar. A largo plazo nos beneficia asegurar nuestra frontera con estos salvajes sedientos de sangre, para que no nos atrapen mientras no nos damos cuenta. \n\n\n\n\n\n\n\n\n\n@celt_mil9!"

 barbaricum_bohemia_mission_task_11:0 "Liga Lugia"
 barbaricum_bohemia_mission_task_11_DESC:0 "Deberíamos considerar enviar propuestas a los #G Vándalos#!, sugiriendo que formemos una Liga mutuamente beneficiosa, encabezada por [ROOT.GetCountry.GetRuler.GetName|Y], por supuesto. Esperemos que se den cuenta de que lo mejor para ellos sería trabajar con los #G Boii#!, para que no cambiemos nuestra opinión sobre ellos... \n\n\n\n\n\n\n\n\n\n@celt_mil11!"

 barbaricum_bohemia_mission_task_12:0 "Costa del Ámbar"
 barbaricum_bohemia_mission_task_12_DESC:0 "El ámbar @amber! es un bien comercial muy deseado en las ciudades del sur, utilizado para fabricar joyas y otras baratijas deslumbrantes. Ganaríamos bastante dinero si dejáramos de ser intermediarios de #G Varinia#!, #G Rugia#! y #G Lemovia#! y controlaramos los recursos directamente. \n\n\n\n\n\n\n\n\n\n@celt_mil2!"

 barbaricum_bohemia_mission_task_13:0 "Dominio Pannonio"
 barbaricum_bohemia_mission_task_13_DESC:0 "Las numerosas tribus de #G Panonia#! finalmente han depuesto las armas, dándose cuenta de la inutilidad de desafiar el poder de los #G Boii#!. Confiados en nuestra victoria, ponemos nuestros ojos en las tierras de los #R dacios#! amantes de la guerra. \n\n\n\n\n\n\n\n\n\n@celt_mil15!"

 barbaricum_bohemia_mission_task_14:0 "Amenaza Dacia"
 barbaricum_bohemia_mission_task_14_DESC:0 "El status quo se ha vuelto insostenible; Los problemáticos #R dacios#!, envidiosos de nuestro creciente poder, han estado provocando fricciones en nuestras fronteras y han ignorado nuestras pacientes peticiones de respetar nuestra integridad territorial. Nos acercamos rápidamente al punto en el que sería mejor conquistarlos directamente. \n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 barbaricum_bohemia_mission_task_15:0 "Mancomunidad Boihaemiana"
 barbaricum_bohemia_mission_task_15_DESC:0 "Cuando emprendimos el ambicioso camino que teníamos por delante, no teníamos idea de los grandes avances que nuestro pueblo daría en su conjunto. Nadie puede afirmar que somos simples habitantes de las colinas, que llevamos una existencia miserable en las laderas de montañas azotadas por el viento. Somos los fundadores de una #T Commonwealth boihamiana#!, y es sobre esta base firme que se construirá nuestro majestuoso futuro. \n\n\n\n\n\n\n\n\n\n@greek_mil10!"

 barbaricum_bohemia_mission_task_16:0 "Hierro de Noricum"
 barbaricum_bohemia_mission_task_16_DESC:0 "Deberíamos plantearnos apoderarnos de los puertos de montaña de #G Noreia#! por dos motivos. No sólo tendríamos un paso sin restricciones a través de los #G Alpes Carniae#!, lo que nos permitiría derramarnos al sur de las montañas cada primavera, sino que también tendríamos acceso al mineral de hierro @iron! que se encuentra en las colinas rocosas. \n\n\n\n\n\n\n\n\n\n@india_mil6!"

 barbaricum_bohemia_mission_task_17:0 "Sal de Laciacum"
 barbaricum_bohemia_mission_task_17_DESC:0 "La sal @salt! es un bien preciado que se utiliza para condimentar y almacenar alimentos, y parece que a los #G Boii#! les ha cogido gusto. Deberíamos trasladarnos a #G Laciacum#!; Los pequeños lagos de la región, si bien no son los mejores para beber, podrían producir suficiente sal para satisfacer nuestras escasas necesidades. \n\n\n\n\n\n\n\n\n\n@celt_mil1!"

 barbaricum_bohemia_mission_task_18:0 "El ascenso de [ROOT.GetCountry.GetName]"
 barbaricum_bohemia_mission_task_18_DESC:0 "Nuestro pueblo ha estado clamando por una nueva forma de gobierno político, alegando que hemos superado los sistemas de gobierno actuales. Para sorpresa de nadie, [ROOT.GetCountry.GetRuler.GetName|Y] está totalmente de acuerdo con esta sugerencia.\n\n#Y Se nos dará la opción de reclamar la #! #T Monarquía#! #Y o encontrar una#! #T República#!.\n\n\n\n\n\n\n\n\n\n@celt_mil4!"

 barbaricum_bohemia_mission_task_4_tt:0 "Podremos integrar a la gente de la cuenca Boihaemiana."
 barbaricum_bohemia_mission_task_9_tt:0 "Al menos tres provincias en [GetProvince('(int32)4012').GetArea.GetName|G] no tienen espacios de construcción libres."
 bohemia_lugian_league_reward_tt:0 "Cada estado Vándalo libre recibirá una oferta para unirse a la Liga Lugia bajo nuestra protección."
 barbaricum_bohemia_mission_task_5_claims_tt:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)3919').GetArea.GetName|G], [GetProvince('(int32)4144').GetArea.GetName], [GetProvince('(int32)4852').GetArea.GetName|G] y [GetProvince('(int32)4876').GetArea.GetName|G]."
 barbaricum_bohemia_mission_task_7_claims_tt:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)4149').GetArea.GetName|G], [GetProvince('(int32)4158').GetArea.GetName], [GetProvince('(int32)4849').GetArea.GetName|G], [GetProvince('(int32)4856').GetArea.GetName|G] y [GetProvince('(int32)4831').GetArea.GetName]."
 barbaricum_bohemia_mission_task_8_claims_tt:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)3995').GetArea.GetName|G], [GetProvince('(int32)3988').GetArea.GetName], [GetProvince('(int32)4010').GetArea.GetName|G], [GetProvince('(int32)4773').GetArea.GetName|G] y [GetProvince('(int32)4777').GetArea.GetName]."
 barbaricum_bohemia_mission_task_13_claims_tt:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)4285').GetArea.GetName|G], [GetProvince('(int32)4291').GetArea.GetName], [GetProvince('(int32)4299').GetArea.GetName|G] y [GetProvince('(int32)4275').GetArea.GetName|G]."
 barbaricum_bohemia_mission_task_7_tt:0 "Necesitamos poseer al menos #T cuatro territorios#! en las áreas #G Celemantia#!, #G Quadia#! y #G Cotinia#!."

 ## Extra 
 pannonian_farmlands:0 "Tierras agrícolas de Panonia"
 desc_pannonian_farmlands:0 "Las ricas tierras de Panonia nos darán abundante excedente agrícola."

 #Aremorica (Gaul)
 barbaricum_aremorica_mission:0 "Frente al Mar Atlántico"
 barbaricum_aremorica_mission_BUTTON_TOOLTIP:0 "Con el mar a nuestras espaldas, volvemos la mirada hacia el interior y hacia nuestros enemigos..."
 barbaricum_aremorica_mission_BUTTON_DETAILS:0 ""
 barbaricum_aremorica_mission_DESCRIPTION:0 "Ya sea por circunstancia o favor divino, nuestros pueblos han sido bendecidos con territorios que tocan el Océano, las vastas e interminables aguas que acunan la tierra seca. Que nuestra tribu sea como las olas, implacable e incesante, mientras extendemos nuestro dominio a las tierras que miran al Atlántico."
 barbaricum_aremorica_mission_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completada cuando hayamos establecido y mejorado nuestro poderoso reino en la costa."
 barbaricum_aremorica_mission_REWARD_DESCRIPTION:0 ""
 # Tasks

 barbaricum_aremorica_mission_task_1:0 "Comercio Aremoricano"
 barbaricum_aremorica_mission_task_1_DESC:0 "Nuestra provincia de #G Osismia#!, que se adentra en las aguas del #Y Atlántico#!, se encuentra en una posición privilegiada para establecer contactos económicos con vecinos de todo el mundo. Reforzar nuestras rutas comerciales seguramente nos brindará el respeto que naturalmente merecemos. \n\n\n\n\n\n\n\n\n\n\n@event_pic1!"

 barbaricum_aremorica_mission_task_2:0 "Construir Fortalezas Marítimas"
 barbaricum_aremorica_mission_task_2_DESC:0 "La prudencia exige que construyamos una red de fortificaciones, para protegernos no sólo de las amenazas interiores, sino también para evitar que las flotas enemigas ataquen nuestros territorios con impunidad. \n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 barbaricum_aremorica_mission_task_3:0 "Construir una Flotilla"
 barbaricum_aremorica_mission_task_3_DESC:0 "Cualquier potencia marítima que se precie requiere armadas que proyecten su voluntad en el extranjero y eviten que los piratas se vuelvan locos. Envía un mensaje a nuestros astilleros y ordena que se construya una flotilla. \n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"

 barbaricum_aremorica_mission_task_4:0 "Canalizar el Poder del Mar"
 barbaricum_aremorica_mission_task_4_DESC:0 "Seremos como el mar mismo, barriendo a nuestros enemigos y ahogándolos. ¿Quién podrá resistir la inundación que desataremos? Incluso ahora, nuestras fuerzas aumentan, como siniestras nubes de lluvia que se acumulan en el horizonte...\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"

 barbaricum_aremorica_mission_task_5:0 "Unificación de la Península Aremoricana"
 barbaricum_aremorica_mission_task_5_DESC:0 "Nos hemos dado la tarea de unir la #G Península Aremoricana#!, y la hora de nuestra victoria total se acerca. Con nuestra patria segura a nuestro alcance, podemos dirigir nuestra atención a tierras distantes que nunca antes nos hubiéramos atrevido a atacar. \n\n\n\n\n\n\n\n\n\n\n@celt_mil12!"

 barbaricum_aremorica_mission_task_6:0 "Tributo de Dumnonia"
 barbaricum_aremorica_mission_task_6_DESC:0 "Si bien nuestras relaciones con nuestros vecinos del norte, los #G Dumnonianos#!, han sido amistosas en el pasado, nuestros ancianos tribales han declarado que deberíamos poseer la propia Dumnonia; su pueblo es más débil que el nuestro y exige subyugación. \n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_aremorica_mission_task_7:0 "Red de Comercio del Noroeste"
 barbaricum_aremorica_mission_task_7_DESC:0 "Hay bienes a través de las aguas del #Y Mare Britannicum#! que son muy deseados por nuestro pueblo; simplemente no se pueden encontrar los mismos artículos en el continente. Sería bueno para nosotros ampliar nuestras redes comerciales en el norte; Incluso podríamos instalarnos en la isla de Hibernia. \n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

 barbaricum_aremorica_mission_task_8:0 "Hacia las Orcadas"
 barbaricum_aremorica_mission_task_8_DESC:0 "Nuestros soldados han conquistado todo lo ancho y ancho de #G Pritannia#!, destrozando las fuerzas reunidas contra nosotros y uniendo las islas por primera vez que alguien pueda recordar. Si bien la hora de la victoria está cerca, tenemos decisiones importantes que tomar con respecto al futuro... \n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"

 barbaricum_aremorica_mission_task_9:0 "Reclamar la Costa Oriental"
 barbaricum_aremorica_mission_task_9_DESC:0 "Ahora que nuestra península está firmemente bajo control, podemos avanzar hacia el norte, hacia las tierras de los sanguinarios #G belgas#!. Prepárate para una guerra difícil, ya que estos enemigos son realmente feroces y no entregarán sus tierras fácilmente. \n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"

 barbaricum_aremorica_mission_task_10:0 "A Través del Estrecho"
 barbaricum_aremorica_mission_task_10_DESC:0 "Las aguas que separan #G Pritania#! y el continente son bastante estrechas; En un día despejado, los amantes de la vista de águila pueden incluso ver las islas desde nuestro mirador en la costa. ¡Reúne nuestras flotas y prepárate para desatar nuestras hordas! ¡Pritannia será nuestra! \n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 barbaricum_aremorica_mission_task_11:0 "Costa Frisia"
 barbaricum_aremorica_mission_task_11_DESC:0 "Nuestras guerras de conquista nos han llevado a reinos habitados por extraños bárbaros, ignorantes de los dioses y bestiales en su crueldad. Deseamos las tierras costeras que habitan estos salvajes, lo que significa que la guerra pronto llegará sobre nosotros; sin embargo, triunfaremos, tomando sus pantanos y sus campos como propios. \n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

 barbaricum_aremorica_mission_task_12:0 "Mayor Aremorica"
 barbaricum_aremorica_mission_task_12_DESC:0 "Es innegable que el impulso está con nosotros; Todos nuestros enemigos son tomados con la guardia baja y no pueden frenarnos. ¡Sigue a sus ejércitos en retirada y avanza hacia el sur, hacia las montañas! ¡Que nadie escape! \n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"

 barbaricum_aremorica_mission_task_13:0 "La Costa Cántabra"
 barbaricum_aremorica_mission_task_13_DESC:0 "Las montañas de #G Iberia#! ofrecen impresionantes fortificaciones naturales para las tribus que viven en la península, pero esas alturas escarpadas no son lo suficientemente imponentes como para mantener alejados a nuestros hombres. ¡La #G Costa Cantábrica#! será nuestra! \n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"

 barbaricum_aremorica_mission_task_14:0 "La Costa Lusitana"
 barbaricum_aremorica_mission_task_14_DESC:0 "Habiendo establecido un punto de apoyo firme en #G Cantabria#!, nuestras fuerzas han comenzado a acosar a los #G lusitanos#!; ha quedado muy claro que consideramos esta tierra como parte de nuestro dominio natural y que tomaremos las medidas necesarias para dominarla. \n\n\n\n\n\n\n\n\n\n\n@event_pic13!"

 barbaricum_aremorica_mission_task_15:0 "El Mons Calpe"
 barbaricum_aremorica_mission_task_15_DESC:0 "¿Has oído hablar de #G Baetica#!, mi cacique? Es una tierra muy al sur, extremadamente rica debido a su ubicación auspiciosa y sus redes comerciales bien establecidas. Aunque es una propuesta difícil, algunos han afirmado que podríamos poseer la provincia si estamos dispuestos a luchar por ella. \n\n\n\n\n\n\n\n\n\n\n@event_pic9!"

 barbaricum_aremorica_mission_task_16:0 "Dominio Atlántico"
 barbaricum_aremorica_mission_task_16_DESC:0 "¿Quién es tan tonto como para afirmar que no somos los #T dueños indiscutibles del Atlántico?#! ¿Hay alguien que, al contemplar nuestras posesiones, no sienta asombro por lo que hemos logrado? ¿Hay alguien tan tonto como para desafiar nuestra hegemonía? \n\n\n\n\n\n\n\n\n\n\n@event_pic12!"

 barbaricum_aremorica_mission_task_17:0 "Una Nueva Ruta del Ámbar"
 barbaricum_aremorica_mission_task_17_DESC:0 "El ámbar @amber! es un bien comercial sin el que su gente no puede vivir; No se verá a ningún guerrero o cacique que se precie sin joyas de ámbar adornando sus muñecas o su cuello. Teniendo en cuenta que siempre tenemos demanda, deberíamos considerar la posibilidad de importar más. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"

 barbaricum_aremorica_mission_task_18:0 "Lujo Mediterráneo"
 barbaricum_aremorica_mission_task_18_DESC:0 "Las monedas de nuestras tesorerías siguen creciendo, inundando nuestras arcas con el diluvio de prosperidad. A medida que nuestro reino ha crecido, también ha crecido nuestro gusto por las cosas buenas; Qué afortunados somos de poder darnos el gusto de hacer todo lo que deseamos. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"

 barbaricum_aremorica_mission_task_19:0 "Superar a Cartago"
 barbaricum_aremorica_mission_task_19_DESC:0 "Recibimos informes casi a diario de incidentes en el mar con #G Cartago#!, que no nos brinda el respeto que merecemos y cree que pueden intimidar a nuestros comerciantes. Aunque son una gran potencia marítima, tenemos la voluntad y la ambición de vencerlos en su propio juego. \n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"

 barbaricum_aremorica_mission_task_20:0 "¡Por Toutatis!"
 barbaricum_aremorica_mission_task_20_DESC:0 "En una demostración de [ROOT.GetCountry.GetRuler.GetHerHis] devoción, [ROOT.GetCountry.GetRuler.GetName|Y] ha apelado a [GetDeityDefinition('omen_toutatis').GetName|T] para pedirle las bendiciones del dios, con la esperanza de que los dones de la #T Tríada Sagrada#! se manifiesten. \n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"

 barbaricum_aremorica_mission_task_21:0 "Oráculo de los Gallizenae"
 barbaricum_aremorica_mission_task_21_DESC:0 "Se ha dicho que si preparamos el camino, construimos los lugares sagrados y hacemos que los celosos nos guíen en la adoración, seremos lo suficientemente dignos de consultar el #T Oráculo de las Gallizenas#!. ¿Qué nos revelarán los dioses? \n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"

 barbaricum_aremorica_mission_task_22:0 "Los Romanos Están Locos"
 barbaricum_aremorica_mission_task_22_DESC:0 "Si bien se ha dicho mucho sobre los belicosos #R romanos#!, tenemos nuestras propias palabras para agregar, basadas en nuestras experiencias personales con ellos; están locos. El mundo sería un lugar más seguro si fueran castigados, de una vez por todas...\n\n\n\n\n\n\n\n\n\n\n@celt_mil4!"

 barbaricum_aremorica_mission_task_23:0 "Expandir la Red Comercial"
 barbaricum_aremorica_mission_task_23_DESC:0 "Si bien ciertamente tenemos el control de las operaciones comerciales en las islas del norte, podríamos tomar medidas para expandir nuestra red actual. La construcción de puertos es un paso crucial para asegurar el flujo de mercancías, dentro y fuera de nuestros territorios. \n\n\n\n\n\n\n\n\n\n\n@event_pic8!"

 aremorica_permanent_ending_mod:0 "Dominio Atlántico"
 desc_aremorica_permanent_ending_mod:0 "Desde nuestros humildes comienzos, nos hemos expandido hasta dominar toda la #Y costa atlántica#!."

 barbaricum_aremorica_claims_1_tt:0 "Obtenemos reclamaciones sobre cada #E territorio costero#! en las Áreas de [GetProvince('(int32)2141').GetArea.GetName|G], [GetProvince('(int32)2137').GetArea.GetName|G], [GetProvince('(int32)2152').GetArea.GetName|G] y [GetProvince('(int32)3308').GetArea.GetName|G]."
