 suebi_gallia_Rome:0 "Gana una guerra contra #R Roma#! teniendo al menos 25 puntos de guerra, y Roma no debe poseer tierras en #G Galia#! o #G Germania#!."

 suebi_gallia_move_tribes_cost_mod:0 "Suevos migratorios"
