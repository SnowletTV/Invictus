 barbaricum_gothonia_mission_task_15_tooltip:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)4752').GetArea.GetName|G], [GetProvince('(int32)7298').GetArea.GetName|G], [GetProvince('(int32)7808').GetArea.GetName|G], [GetProvince('(int32)3896').GetArea.GetName|G] y [GetProvince('(int32)3970').GetArea.GetName|G]."
 gothonia_suebian_knot_vase:0 "Caldero de Nudos Suevos"
 gothonia_suebian_knot_vase_desc:0 "Este es un pequeño caldero de bronce de fabricación extranjera que se inspira en la cultura sueva. Tiene una empuñadura que representa a un guerrero Suevo con barba, fácilmente reconocible por su nudo Suevo."
 GOTHISCANDIA_NAME:0 "Gothiscandia"
 GOTHISCANDIA_ADJECTIVE:0 "Gothiscandio"

 gothonia_claims_on_rugia_tt:0 "Recibiremos reclamaciones en el área #Y Rugia#!."
 guthonia_integrates_irminonic_tt:0 "#Y Irminonic#! debe ser una de nuestras #T Culturas Integradas#!."

 barbaricum_gothonia_mission_task_2_tt:0 "Cualquier #G país cimbrio#! en la región de [GetProvince('(int32)3870').GetArea.GetRegion.GetName|G] tiene una #T opinión#! de al menos #T 15#! de nosotros."
 barbaricum_gothonia_mission_task_3_tt:0 "Cualquier #G país escandinavo#! en la región de [GetProvince('(int32)3870').GetArea.GetRegion.GetName|G] tiene una #T opinión#! de al menos #T 15#! de nosotros."
 barbaricum_gothonia_mission_task_4_tt:0 "Posee una provincia que produce #T Ámbar#! @amber!."
 barbaricum_gothonia_mission_task_5_tt:0 "Cualquier provincia en el Área de [GetProvince('(int32)4766').GetArea.GetName|G] productora de cereales @grain! tiene un #T Asentamiento agrícola#!."
 barbaricum_gothonia_mission_task_6_tt:0 "Todas las provincias costeras en las Áreas de [GetProvince('(int32)3898').GetArea.GetName|G] y [GetProvince('(int32)3891').GetArea.GetName|G] y en la Región de [GetProvince('(int32)4756').GetArea.GetRegion.GetName|G] son de nuestra propiedad."
 barbaricum_gothonia_mission_task_7_tt:0 "Cualquier país #G Irminonic#! en la Región de [GetProvince('(int32)3969').GetArea.GetRegion.GetName|G] tiene una #T Opinión#! de al menos #T 15#! de nosotros."
 barbaricum_gothonia_mission_task_15_tt:0 "Importar o exportar a un país #G vandálico#! en la región de [GetProvince('(int32)6288').GetArea.GetRegion.GetName|G]."

 #Bastarnians
 barbaricum_bastarnia_mission:0 "Historias de las Riquezas Orientales"
 barbaricum_bastarnia_mission_BUTTON_TOOLTIP:0 "Debemos #E migrar#! a la costa sur del Mar Negro, cerca del Danubio, desde donde construiremos una federación que se extienda desde Tracia hasta Maeocia."
 barbaricum_bastarnia_mission_BUTTON_DETAILS:0 ""
 barbaricum_bastarnia_mission_DESCRIPTION:0 "Durante muchos años nuestro pueblo ha vagado por los bosques de Vistulia, llevando una vida sencilla. Sin embargo, últimamente el clima se ha vuelto cada vez más duro, y muchos de nuestros cultivos, y personas, mueren durante los meses de invierno. Si queremos sobrevivir a los próximos años, tendremos que reasentarnos en una región más próxima a los mares del sur. Hemos oído hablar de tierras ricas y fértiles al este. Los habitantes de estas tierras viven en grandes ciudades llenas de mármol y oro. Pero nosotros somos mucho más fuertes que ellos y sería fácil saquear sus ricas ciudades y tomarlas para nosotros."
 barbaricum_bastarnia_mission_CRITERIA_DESCRIPTION:0 "Este árbol de misiones se completará una vez que hayamos emigrado al este y conquistado las ricas tierras al oeste del Mar Negro."
 barbaricum_bastarnia_mission_REWARD_DESCRIPTION:0 "Ganar reclamaciones sobre algunos territorios al oeste del Mar Negro y reclamas sus riquezas."

 # Tasks
 barbaricum_bastarnia_mission_task_1:0 "Prepararse para Migrar"
 barbaricum_bastarnia_mission_task_1_DESC:0 "La marcha hacia el este será larga y llena de dificultades. Debemos asegurarnos de tener suficiente comida para el camino a nuestro nuevo hogar.\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_bastarnia_mission_task_2:0 "Seguir las Historias"
 barbaricum_bastarnia_mission_task_2_DESC:0 "Nuestros exploradores hablan de una tierra poco poblada cerca del mar. Esta tierra ya tiene un clima mucho más agradable que nuestro hogar ancestral en Vistulia. Un asentamiento temporal allí podría servirnos como primera base para nuestras futuras incursiones.\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 barbaricum_bastarnia_mission_task_3:0 "El Delta del Danubio"
 barbaricum_bastarnia_mission_task_3_DESC:0 "El #Y Danubio#! forma la frontera entre los pueblos fuertes del norte y los débiles pero ricos del sur. El control sobre el área alrededor del Delta del Danubio facilitará nuestras expediciones a las ricas tierras de estos pomposos #G griegos#!.\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 barbaricum_bastarnia_mission_task_4:0 "Aliado del Sur"
 barbaricum_bastarnia_mission_task_4_DESC:0 "Más al sur se encuentran los reinos de los reyes #G macedonios#!. Se dice que hace muchos años uno de ellos conquistó casi todo el mundo. Pero ahora mismo su imperio está en ruinas. Podríamos utilizar el caos de la situación para ganar un aliado valioso.\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_bastarnia_mission_task_5:0 "Olbia en Cenizas"
 barbaricum_bastarnia_mission_task_5_DESC:0 "Más al este se encuentra la gran ciudad de #T Olbia#!. Hemos escuchado muchas historias maravillosas sobre la ciudad de boca de nuestros cautivos y de la población local. Se dice que la ciudad es una de las más ricas de toda la costa del #Y Mar Negro#! y contiene tesoros tan grandes como [GetDeityDefinition('omen_gautr').GetName|T] él mismo!\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_bastarnia_mission_task_6:0 "El Mar de Azov"
 barbaricum_bastarnia_mission_task_6_DESC:0 "Más allá de la ciudad de #T Olbia#!, en el extremo norte del #Y Mar Negro#!, se encuentran las ciudades del #G Reino del Bósforo#!. Sus tierras producen alimentos en abundancia, permitiendo incluso su exportación. ¿Cuántos tesoros más se esconden tras sus muros, esperando a que los pongamos bajo nuestra custodia?\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
 barbaricum_bastarnia_mission_task_7:0 "Defender nuestro Nuevo Hogar"
 barbaricum_bastarnia_mission_task_7_DESC:0 "Nuestra nueva posición nos abre muchos caminos hacia la gloria y la riqueza, pero nuestro nuevo hogar no es nada seguro. Los lugareños hostiles y otras tribus ávidas de poder acechan en cada esquina. Debemos reforzar nuestra capacidad defensiva antes de atacar.\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 barbaricum_bastarnia_mission_task_8:0 "Federación Bastarnia"
 barbaricum_bastarnia_mission_task_8_DESC:0 "Las recientes migraciones, conquistas e incursiones han provocado la afluencia de una gran cantidad de personas y culturas diferentes dentro de nuestro reino. Nuestros objetivos y éxitos comunes son lo que nos mantiene a todos unidos, pero sería beneficioso para nuestro futuro instituir una figura de identificación común, por lo que el #T Anillo para el cuello en forma de corona#!, el verdadero torque de un guerrero, se ha convertido en el símbolo universal del [ROOT.GetCountry.GetAdjective|G] miembro de la tribu.\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 barbaricum_bastarnia_mission_task_9:0 "Asentamiento de Moesia"
 barbaricum_bastarnia_mission_task_9_DESC:0 "Al sur del #Y Danubio#! viven los #G tracios#!. Son un pueblo semicivilizado, ni verdaderamente griegos ni verdaderamente bárbaros. Como tales, no son más que una combinación débil de los dos. Conquistar sus tierras será tan fácil como rentable.\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 barbaricum_bastarnia_mission_task_10:0 "Nuestro Antiguo Hogar"
 barbaricum_bastarnia_mission_task_10_DESC:0 "Todavía hay gente que vive en la región que dejamos atrás, así que podemos venderles nuestro botín para obtener grandes beneficios, ya que nuestros vecinos del este no son muy proclives a comerciar con nosotros después de que los hayamos asaltado.\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 barbaricum_bastarnia_mission_task_11:0 "Una flota bastarniana"
 barbaricum_bastarnia_mission_task_11_DESC:0 "Gracias a nuestros éxitos recientes, hemos llegado a dominar las ciudades a lo largo de la costa Euxine. Sin embargo, mientras permanezcamos en tierra, cualquier oponente marítimo podría fácilmente arrebatarnos nuestras ganancias en cualquier momento. Debemos aprender las costumbres marineras de nuestros nuevos #G vecinos griegos del Bósforo#! y comenzar la construcción de una flota de nuestros propio.\n\n\n\n\n\n\n\n\n\n@greek_mil21!"

# Bastarnian mission events

 me_bastarnia.1.t:0 "Buscar un nuevo hogar"
 me_bastarnia.1.desc:0 "Nuestras tierras boscosas y gélidas nos dejan poco en cuanto a productos y hombres. Continuar aquí es dejar poco a nuestros sucesores. Es con el consejo de nuestros gudjas que nuestro [SCOPE.GetRootScope.GetCountry.GetName] ha comenzado los preparativos para partir, de modo que podamos encontrar mejores pastos en otros lugares.\n\nSi bien es muy doloroso separarnos del hogar de nuestros antepasados, quedarnos aquí dejaría a nuestros hijos siempre necesitados."
 me_bastarnia.1.a:0 "Debemos empezar una nueva vida lejos de aquí."
 me_bastarnia_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $barbaricum_bastarnia_mission_task_1$#!' $mission_completed_tooltip_2$"

 me_bastarnia.2.t:0 "Las llanuras escitas"
 me_bastarnia.2.desc:0 "El viaje ha sido doloroso, no por el tiempo invertido en el camino, sino por el sacrificio de dejar atrás todo lo que hemos conocido. Sin embargo, los dioses parecen recompensarnos enormemente.\n\nLas tierras aquí son abiertas y abundantes, listas para ser utilizadas para producir lo suficiente para alimentar a innumerables de nuestros parientes, y muchos más bienes pasan por aquí, con ciudades comerciales griegas a pocos días de distancia. Verdaderamente esta tierra presenta una gran oportunidad para los Bastarnae."
 me_bastarnia.2.a:0 "Esta tierra fértil permitirá a nuestros parientes un futuro mejor."
 me_bastarnia_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $barbaricum_bastarnia_mission_task_2$#!' $mission_completed_tooltip_2$"

 me_bastarnia.3.t:0 "Boca del Danubio"
 me_bastarnia.3.desc:0 "'Y ahora', anuncia el victorioso [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen], '¡estamos preparados para dominar las tierras que bañan este río, en el comercio y en la guerra!'\n\nFue la tierra de Peuce, una isla en la desembocadura del río Danubio, la que más tarde daría a las tribus bastarnias el nombre de 'Peucini'. Al ser un punto focal del asentamiento bastarno, les dio un trampolín para las incursiones en Tracia."
 me_bastarnia.3.a:0 "¡Que nuestros miembros de la tribu establezcan asentamientos permanentes en Peuce!"
 me_bastarnia_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $barbaricum_bastarnia_mission_task_3$#!' $mission_completed_tooltip_2$"

 me_bastarnia.5.t:0 "El saqueo de Olbia"
 me_bastarnia.5.desc:0 "Nuestros valientes guerreros lograron irrumpir en la Acrópolis de la ciudad, y la guarnición superviviente se rindió y fue encadenada. Con la última línea de defensa de Olbia rota, la ciudad ahora está completamente a merced de nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle].\n\nCon la ciudad dentro de nuestra ambición de expansión, puede ser mejor reducirla aún más para que los olbianos se vuelvan humildes bajo nuestro gobierno. No importa el botín que obtendremos de esta rica ciudad."
 me_bastarnia.5.a:0 "Pon la ciudad a la antorcha"
 me_bastarnia_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $barbaricum_bastarnia_mission_task_5$#!' $mission_completed_tooltip_2$"

 me_bastarnia.6.t:0 "El mar del Bósforo"
 me_bastarnia.6.desc:0 "A pesar de mucha valentía y ferocidad inquebrantable, hemos sometido tanto a los Bósforos como a los escitas, tomando el control de gran parte de la tierra alrededor del mar de Maeotis. ¡Ahora las ciudades de los griegos del Bósforo servirán de ahora en adelante a los [SCOPE.GetRootScope.GetCountry.GetRulerTitle] de los Bastarnae!\n\nCon nuestra base en el borde del Mar Euxino asegurada, podremos tomar mejor control de las rutas marítimas a través de la región, catalizando el crecimiento de nuestro poder naval para empezar."
 me_bastarnia.6.a:0 "¡Las proezas bastarnianas cruzarán los mares!"
 me_bastarnia_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $barbaricum_bastarnia_mission_task_6$#!' $mission_completed_tooltip_2$"

 me_bastarnia.7.t:0 "La defensa de nuestro hogar"
 me_bastarnia.7.desc:0 "Con nuestras fortificaciones completas, podemos estar seguros de que las tierras alrededor de Peuce son mucho menos tentadoras para nuestros enemigos.\n\nCon la sangre que derramamos para tomar esta tierra extranjera y el sudor que hemos gastado para hacerla nuestra, es impensable que a su vez seamos expulsados de ella. Por lo tanto, es una gran suerte que podamos contemplar nuestro hogar como si ahora estuviera defendido por la fortaleza del hombre, así como por la de los dioses."
 me_bastarnia.7.a:0 "¡El [SCOPE.GetRootScope.GetCountry.GetAdjective] control aquí nunca cederá!"
 me_bastarnia_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $barbaricum_bastarnia_mission_task_7$#!' $mission_completed_tooltip_2$"

 me_bastarnia.8.t:0 "Alianza de los Bastarni"
 me_bastarnia.8.desc:0 "Grande es la extensión del reino [SCOPE.GetRootScope.GetCountry.GetAdjective], y abundantes son las personas que residen en él. Nuestros guerreros visten una mezcla de equipos y vestimentas, desde celtas hasta sármatas, y algunos de los hombres más importantes de nuestro país llevan los nombres de los celtas escordiscianos y los getas. Siendo esta la realidad de nuestro país, nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle] reconoce con gran sabiduría las proezas de los muchos pueblos de los Bastarni, y brinda muchos elogios y honores a nuestros soldados invictos, que han conquistado tierras distantes en nuestro nombre.\n\n¡Que los indomables guerreros de [SCOPE.GetRootScope.GetCountry.GetName] expandan nuestro alcance a lo largo de Tracia y Escitia!"
 me_bastarnia.8.a:0 "¡El mundo entero caerá en manos de nuestros ejércitos!"
 me_bastarnia_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $barbaricum_bastarnia_mission_task_8$#!' $mission_completed_tooltip_2$"

 me_bastarnia.9.t:0 "El asentamiento de Moesia"
 me_bastarnia.9.desc_1:0 "Dado que muchos bastarnianos se han vuelto inquietos por estar restringidos a nuestro lado del Danubio, las tierras del norte de Tracia y Dardania se han convertido en el principal objetivo de la ambición de nuestro pueblo. Por lo tanto, fue en gran número que marchamos a través del Danubio hacia Tracia para luchar contra los tracios y los ilirios que controlaban estas tierras, ¡y es una gran suerte que nuestra valentía y nuestra causa hayan quedado demostradas!\n\nNuestros hombres ya comienzan a traer a sus familias para establecer sus nuevos hogares en Moesia."
 me_bastarnia.9.desc_2:0 "Dado que muchos bastarnianos estaban inquietos por estar restringidos a nuestro lado del Danubio, la propuesta de nuestros aliados macedonios de que tomáramos y colonizáramos por la fuerza las tierras de sus enemigos, los dardanianos, convirtió esta frustración en fijación en nuestro nuevo objetivo de conquista. ¡En esto, los dioses han traído gran fortuna en nuestra campaña a través del Danubio, y nuestra valentía nos ha traído una gran victoria!\n\nYa nuestros hombres comienzan a traer a sus familias para construir sus nuevos hogares en Moesia."
 me_bastarnia_9_migration_tooltip:0 "#Y 4#! #E $bastarnae$#! las culturas pop migran al territorio de [SCOPE.sP('bstrn_moesian_migration_p_destination').GetName]"
 me_bastarnia.9.a:0 "¡Estas tierras se convertirán en un nuevo hogar para nuestros miembros de la tribu Bastarnae!"
 me_bastarnia_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $barbaricum_bastarnia_mission_task_9$#!' $mission_completed_tooltip_2$"
 me_bastarnia.9.b:0 "¡Deberíamos hacer de esta tierra nuestra nueva Capital!"

 me_bastarnia.10.t:0 "Lazos con nuestro antiguo hogar"
 me_bastarnia.10.desc:0 "Es una gran felicidad que nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle] pueda enviar saludos a los [SCOPE.sC('vandal_country_trading_with_bastarnia').GetRulerTitle] de nuestros familiares, los [SCOPE.sC('vandal_country_trading_with_bastarnia').GetAdjective]. Aunque nuestra antigua patria era un lugar duro, echamos mucho de menos los vínculos que teníamos allí.\n\nNo rompamos nuevamente la conexión que mantenemos con nuestros parientes lejanos y mantengamos firmes las relaciones fraternales que tenemos con [SCOPE.sC('vandal_country_trading_with_bastarnia').GetName]."
 me_bastarnia.10.a:0 "¡Siempre es un placer saludar a nuestros viejos parientes!"
 me_bastarnia_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $barbaricum_bastarnia_mission_task_10$#!' $mission_completed_tooltip_2$"

 me_bastarnia.11.t:0 "Alianza con los macedonios"
 me_bastarnia.11.desc:0 "En nuestro ascenso al suroeste de Escitia, nuestros éxitos habían elevado nuestra posición ante el reino helénico de los macedonios. Mucho más allá de los días de su antiguo imperio, el Rey buscó correspondencia con nosotros, viendo potencial en nuestro éxito inicial. Con nuestro mayor poder en la región y las amenazas mutuas que plagan a ambos países, una alianza entre nuestros reinos fue un obvio paso adelante.\nTan entusiasta está [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRulerTitle] [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRuler.GetPraenomen] de [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName], que incluso se ha planteado la idea de un vínculo de sangre."
 me_bastarnia.11.a:0 "¡Qué socio tan poderoso hemos ganado!"
 me_bastarnia_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $barbaricum_bastarnia_mission_task_4$#!' $mission_completed_tooltip_2$"
 me_bastarnia.11.b:0 "¡Solidifiquemos nuestra alianza a través de la sangre!"
 me_bastarnia_11_b_tooltip:0 "Decidiremos organizar un matrimonio real con [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName]"
 me_bastarnia_11_b_tooltip_2:0 "El éxito mejorará las relaciones entre nuestros dos países."

 me_bastarnia.12.t:0 "Una propuesta de matrimonio"
 me_bastarnia.12.desc_1:0 "A la luz de nuestra correspondencia con los [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRulerTitle] de los [SCOPE.sC('macedonia_tag_bastarnia_ally').GetAdjective], se presenta una oportunidad para mejorar los vínculos con nuestro aliado y una solución para un agravio personal de nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle]\n\nSin esposa para [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen], tenemos la oportunidad única de establecer vínculos familiares con los macedonios a través del matrimonio de nuestro gobernante con uno de sus princesas. Aunque antes de proponer nuestro plan a [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName], primero debemos decidir para quién es mejor nuestro [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRulerTitle]."
 me_bastarnia.12.desc_2:0 "A la luz de nuestra correspondencia con los [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRulerTitle] de los [SCOPE.sC('macedonia_tag_bastarnia_ally').GetAdjective], se presenta una oportunidad para mejorar los vínculos con nuestro aliado y una solución para un agravio personal de nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle]\n\nCon el hijo de [SCOPE.GetRootScope.GetCountry.GetName] [SCOPE.sCharacter('bastarnae_son_selected_for_marriage').GetName] sin esposa, tenemos la oportunidad única de establecer vínculos familiares con los macedonios a través del matrimonio de nuestro príncipe. A una de sus princesas. Aunque antes de proponer nuestro plan a [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName], primero debemos decidir para quién [SCOPE.sCharacter('bastarnae_son_selected_for_marriage').GetName] es más adecuado."
 me_bastarnia.12.a:0 "Propongamos matrimonio a [SCOPE.sCharacter('bst_macedorian_princess_1').GetName]"
 me_bastarnia_12_a_tooltip:0 "Le pediremos a [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] la mano de [SCOPE.sCharacter('bst_macedorian_princess_1').GetName]."
 me_bastarnia.12.b:0 "¡[SCOPE.sCharacter('bst_macedorian_princess_2').GetName] sería una combinación más adecuada!"
 me_bastarnia_12_b_tooltip:0 "Le pediremos a [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] la mano de [SCOPE.sCharacter('bst_macedorian_princess_2').GetName]."
 me_bastarnia.12.c:0 "La princesa [SCOPE.sCharacter('bst_macedorian_princess_3').GetName] es considerada la más justa"
 me_bastarnia_12_c_tooltip:0 "Le pediremos a [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] la mano de [SCOPE.sCharacter('bst_macedorian_princess_3').GetName]."

 me_bastarnia.13.t:0 "Los Bastarnae piden una novia macedonia"
 me_bastarnia.13.desc_1:0 "Después de que nuestros diplomáticos lograron asegurar nuestra alianza con los Bastarnae, regresaron con su propio diplomático con una propuesta para nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle], para fortalecer los lazos entre nuestros dos países enviando a [SCOPE.sCharacter('bst_macedonian_princess_chosen_for_proposal').GetName] a casar a su [SCOPE.sC('bastarnian_country').GetRulerTitle] [SCOPE.sC('bastarnian_country').GetRuler.GetPraenomen].\n\nCon gran entusiasmo, los [SCOPE.sC('bastarnian_country').GetAdjective] esperan ansiosamente nuestra respuesta."
 me_bastarnia.13.desc_2:0 "Después de que nuestros diplomáticos lograron asegurar nuestra alianza con los Bastarnae, han regresado con su propio diplomático con una propuesta para nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle], fortalecer los lazos entre nuestros dos países enviando a [SCOPE.sCharacter('bst_macedonian_princess_chosen_for_proposal').GetName] a casarse con el hijo de su [SCOPE.sC('bastarnian_country').GetRulerTitle], [SCOPE.sCharacter('bastarnae_son_selected_for_marriage').GetName].\n\nCon gran entusiasmo, los [SCOPE.sC('bastarnian_country').GetAdjective] esperan ansiosamente nuestra responder."
 me_bastarnia.13.a:0 "¡Por supuesto que nuestros vínculos deberían ser sangrientos!"
 me_bastarnia_13_marriage_tooltip:0 "\"Acordaremos enviar [SCOPE.sCharacter('bst_macedonian_princess_chosen_for_proposal').GetName] a [SCOPE.sC('bastarnian_country').GetName]"
 me_bastarnia_13_marriage_tooltip_2:0 "Esto mejorará las relaciones entre nuestros dos países."
 me_bastarnia.13.b:0 "¡No puedo permitir que una princesa macedonia sea relegada a un lugar así!"
 me_bastarnia_13_b_tooltip:0 "Rechazaremos la propuesta de matrimonio."

 me_bastarnia.14.t:0 "Una boda real"
 me_bastarnia.14.desc_1:0 "Con el [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRulerTitle] de [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] aceptando nuestra propuesta, [SCOPE.sCharacter('bst_macedonian_princess_chosen_for_proposal').GetName] ha finalizado su viaje a nuestro país. Ya se han hecho los preparativos y el [SCOPE.GetRootScope.GetCountry.GetRulerTitle] está listo para casarse de inmediato.\n\n¡Que los dioses traigan favor a la unión de [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetName] y [SCOPE.sCharacter('bst_macedonian_princess_chosen_for_proposal').GetName]!"
 me_bastarnia.14.desc_2:0 "Con el [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRulerTitle] de [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] aceptando nuestra propuesta, [SCOPE.sCharacter('bst_macedonian_princess_chosen_for_proposal').GetName] ha finalizado su viaje a nuestro país. Ya se han hecho los preparativos [SCOPE.sCharacter('bastarnae_son_selected_for_marriage').GetName] está listo para casarse de inmediato.\n\n¡Que los dioses traigan favor a la unión de [SCOPE.sCharacter('bastarnae_son_selected_for_marriage').GetName] y [SCOPE.sCharacter('bst_macedonian_princess_chosen_for_proposal').GetName]!"
 me_bastarnia_14_tooltip:0 "Las relaciones entre [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] y [SCOPE.GetRootScope.GetCountry.GetName] han aumentado."
 me_bastarnia.14.a:0 "¡Nuestros vínculos con los macedonios son cada vez más fuertes!"
 me_bastarnia_14_a_tooltip:0 "$mission_completed_tooltip_1$ '#Y $barbaricum_bastarnia_mission_task_4$#!' $mission_completed_tooltip_2$"
 me_bastarnia.14.b:0 "¡Nuestros vínculos con los macedonios son cada vez más fuertes!"
 me_bastarnia_14_b_tooltip:0 "$me_bastarnia_14_a_tooltip$"

 me_bastarnia.15.t:0 "Los macedonios rechazan nuestra propuesta."
 me_bastarnia.15.desc:0 "Aunque habría fortalecido mucho nuestros lazos, parece que el [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRulerTitle] de Macedonia no está dispuesto a separarse de sus queridos parientes por nuestro bien. Dado que la protección mutua es nuestra prioridad actual, esto no supone un gran revés para nuestra política, pero sí un pequeño golpe para nuestras relaciones."
 me_bastarnia_15_tt:0 "[SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] no está dispuesto a enviar a [SCOPE.sCharacter('bst_macedorian_princess_3').GetName] a nuestro país para casarse."
 me_bastarnia.15.a:0 "Una gran pena."

 me_bastarnia.16.t:0 "Una flota bastarniana"
 me_bastarnia.16.desc:0 "El último barco sale de nuestro puerto y nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle] está lleno de orgullo. \n\nHa llevado mucho tiempo entrenar a nuestros hombres en el arte de navegar, ya que durante mucho tiempo nos hemos sentido cómodos viviendo en el interior, sin embargo, nuestros nuevos intereses en proteger las rutas marítimas locales y las posesiones costeras han requerido un cambio hacia el mar en nuestras prioridades marciales.\n\nGracias a la ayuda de nuestros vecinos griegos, finalmente hemos logrado comenzar una flota propia decente."
 me_bastarnia.16.a:0 "Nuestro alcance algún día se extenderá a través de este mar..."
 me_bastarnia_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $barbaricum_bastarnia_mission_task_11$#!' $mission_completed_tooltip_2$"

 me_bastarnia.17.t:0 "Una propuesta de matrimonio"
 me_bastarnia.17.desc_1:0 "Conociendo el estado civil de [SCOPE.sC('macedonia_tag_bastarnia_ally').GetAdjective] [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRulerTitle], nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle] ha decidido que la perspectiva de lazos reales entre nuestros dos países podría servir para fortalecer aún más los vínculos que mantienen unida la Alianza Bastarni-Macedonia.\n\nSi bien [SCOPE.GetRootScope.GetCountry.GetName] está más dispuesto a enviar a uno de [ROOT.GetCountry.GetRuler.GetHerHis] propia carne y sangre por este motivo, la pregunta ahora ¿Quién se convertirá en nuestro vínculo familiar con los reyes de Macedonia?"
 me_bastarnia.17.desc_2:0 "Conociendo el estado civil del hijo de [SCOPE.sC('macedonia_tag_bastarnia_ally').GetAdjective] [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRulerTitle], [SCOPE.sCharacter('bst_macedonia_son_selected_for_marriage').GetName], nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle] ha decidido que la perspectiva de lazos reales entre nuestros dos países podría servir para fortalecer aún más los vínculos que mantienen unida la Alianza Bastarni-Macedonia.\n\nMientras que [SCOPE.GetRootScope.GetCountry.GetName] está muy dispuesto a despedir a uno de [ROOT.GetCountry.GetRuler.GetHerHis] propia carne y sangre por este motivo, ahora surge la pregunta de quién se convertirá en nuestro vínculo familiar con los reyes de Macedonia."
 me_bastarnia.17.a:0 "Ofrezcamos un matrimonio con [SCOPE.sCharacter('bastarnian_princess_1').GetName]"
 me_bastarnia_17_a_tooltip:0 "Ofrecemos [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] [SCOPE.sCharacter('bst_macedorian_princess_1').GetName] como novia para [SCOPE.sCharacter('bst_macedonian_royal_who_will_marry').GetName]."
 me_bastarnia.17.b:0 "¡[SCOPE.sCharacter('bastarnian_princess_2').GetName] sería una combinación más adecuada!"
 me_bastarnia_17_b_tooltip:0 "Ofrecemos [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] [SCOPE.sCharacter('bst_macedorian_princess_2').GetName] como novia para [SCOPE.sCharacter('bst_macedonian_royal_who_will_marry').GetName]"
 me_bastarnia.17.c:0 "La princesa [SCOPE.sCharacter('bastarnian_princess_3').GetName] podría conectarnos mejor con [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName]"
 me_bastarnia_17_c_tooltip:0 "Ofrecemos [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] [SCOPE.sCharacter('bst_macedorian_princess_3').GetName] como novia para [SCOPE.sCharacter('bst_macedonian_royal_who_will_marry').GetName]"

 me_bastarnia.18.t:0 "Una novia para Macedonia"
 me_bastarnia.18.desc_1:0 "La falta de un cónyuge para nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] había presentado, hasta este momento, [ROOT.GetCountry.GetRuler.GetHerHim] una gran preocupación. Sin embargo, ha surgido una solución como resultado de nuestras negociaciones de alianza con los [SCOPE.sC('bastarnian_country').GetAdjective]. Como una forma de fortalecer mejor nuestra alianza, el [SCOPE.sC('bastarnian_country').GetRulerTitle] de [SCOPE.sC('bastarnian_country').GetName] ha ofrecido a su princesa [SCOPE.sCharacter('bastarnian_princess_chosen_for_proposal').GetName] en matrimonio.\n\nEsto no solo soluciona los problemas de nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle], sino que los [SCOPE.sC('bastarnian_country').GetAdjective] seguramente serán firmes en adherirse a nuestros términos de ayuda y defensa mutuas."
 me_bastarnia.18.desc_2:0 "La falta de una esposa para nuestro príncipe [SCOPE.sCharacter('bst_macedonian_royal_who_will_marry').GetName] había presentado, hasta este momento, [SCOPE.GetRootScope.GetCountry.GetRulerTitle] [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] una gran preocupación. Sin embargo, ha surgido una solución como resultado de nuestras negociaciones de alianza con los [SCOPE.sC('bastarnian_country').GetAdjective]. Como una forma de fortalecer mejor nuestra alianza, el [SCOPE.sC('bastarnian_country').GetRulerTitle] de [SCOPE.sC('bastarnian_country').GetName] ha ofrecido a su princesa [SCOPE.sCharacter('bastarnian_princess_chosen_for_proposal').GetName] en matrimonio.\n\nEsto no solo soluciona los problemas de nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle], sino que los [SCOPE.sC('bastarnian_country').GetAdjective] seguramente serán firmes en adherirse a nuestros términos de ayuda y defensa mutuas."
 me_bastarnia.18.a:0 "¡Gracias a este vínculo nuestra alianza será aún más fuerte!"
 me_bastarnia_18_marriage_tooltip_1:0 "Las relaciones entre nuestros dos países mejorarán."
 me_bastarnia.18.b:0 "No podemos tomar a un bárbaro como novia."
 me_bastarnia_18_b_tooltip:0 "Rechazaremos la propuesta de matrimonio."

 me_bastarnia.19.t:0 "Una boda real"
 me_bastarnia.19.desc_1:0 "[SCOPE.sC('macedonia_tag_bastarnia_ally').GetRulerTitle] [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRuler.GetPraenomen] de [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] estaba eufórico ante la perspectiva de matrimonio entre [ROOT.GetCountry.GetRuler.GetHerHim] self y [SCOPE.sCharacter('bastarnian_princess_chosen_for_proposal').GetName], feliz de asegurar aún más nuestra alianza y de remediar la falta de [ROOT.GetCountry.GetRuler.GetHerHis] de un cónyuge.\n\nCon [SCOPE.sCharacter('bastarnian_princess_chosen_for_proposal').GetName] habiendo sido enviado a [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName], ahora recibimos noticias de que ella y [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRuler.GetPraenomen] se han casado. Con esta feliz noticia, estamos seguros de que los reyes de [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] seguirán siendo nuestros firmes aliados, habiéndose convertido ahora en nuestros propios parientes."
 me_bastarnia.19.desc_2:0 "[SCOPE.sC('macedonia_tag_bastarnia_ally').GetRulerTitle] [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRuler.GetPraenomen] de [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] estaba eufórico ante la perspectiva de matrimonio entre [SCOPE.sCharacter('bastarnian_princess_chosen_for_proposal').GetName] y [ROOT.GetCountry.GetRuler.GetHerHis] su propio hijo, feliz de asegurar nuestra alianza aún más y de asegurar mejor la continuación de la línea real [SCOPE.sC('macedonia_tag_bastarnia_ally').GetAdjective].\n\nCon [SCOPE.sCharacter('bastarnian_princess_chosen_for_proposal').GetName] habiendo sido enviado a [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName], ahora recibimos noticias. Que ella y [SCOPE.sCharacter('bst_macedonian_royal_who_will_marry').GetName] han abrazado. Con esta feliz noticia, estamos seguros de que los reyes de [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] seguirán siendo nuestros firmes aliados, habiéndose convertido ahora en nuestros propios parientes."
 me_bastarnia_19_tooltip:0 "Las relaciones entre [SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] y [SCOPE.GetRootScope.GetCountry.GetName] han aumentado #G significativamente#!."
 me_bastarnia.19.a:0 "¡Nuestros vínculos con los macedonios ahora son inquebrantables!"

 me_bastarnia.20.t:0 "Los macedonios rechazan nuestra propuesta."
 me_bastarnia.20.desc:0 "Aunque habría fortalecido mucho nuestros lazos, parece que [SCOPE.sC('macedonia_tag_bastarnia_ally').GetRulerTitle] de Macedonia duda excesivamente ante la perspectiva de aceptar a una de nuestras hijas como pretendiente real. Dado que la protección mutua es nuestra prioridad actual, esto no supone un gran revés para nuestra política; sin embargo, esta ofensa es un pequeño golpe a nuestras relaciones."
 me_bastarnia_20_tt:0 "[SCOPE.sC('macedonia_tag_bastarnia_ally').GetName] no está dispuesto a aceptar a [SCOPE.sCharacter('bastarnian_princess_chosen_for_proposal').GetName] como novia."
 me_bastarnia.20.a:0 "Una gran pena."

