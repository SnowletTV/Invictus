 #Fall of Boiohaemium
 barbaricum_suebi_boiohaemia_mission:0 "La Caída de Boyohemia"
 barbaricum_suebi_boiohaemia_mission_BUTTON_TOOLTIP:0 "Las ricas y fértiles tierras de Boyohemia son más adecuadas para establecerse y cultivar que los fríos páramos del norte. Además, Boyohemia es más fácil de defender. El Danubio protege el sur y las montañas del norte impiden el paso de los intrusos."
 barbaricum_suebi_boiohaemia_mission_BUTTON_DETAILS:0 ""
 barbaricum_suebi_boiohaemia_mission_DESCRIPTION:0 "Las tierras ricas y fértiles de #E Boiohaemium#! al sur de nuestro país son más adecuadas para la colonización y la agricultura que los fríos páramos del norte que habitamos. Además, Boiohaemium es más fácil de defender: no hay tantas tribus hostiles viviendo en la región, especialmente si se compara con nuestra patria.\n\nLas aguas impetuosas del poderoso #E Danubio#! protegen el sur y las montañas del norte impiden a los intrusos - todo esto agrada a [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName], que ha comenzado preparativos para una invasión."
 barbaricum_suebi_boiohaemia_mission_CRITERIA_DESCRIPTION:0 "Conquistar las ricas y fértiles tierras del sur y convertirlas en vuestro nuevo hogar."
 barbaricum_suebi_boiohaemia_mission_REWARD_DESCRIPTION:0 "Ganar reclamaciones sobre Boyohemia y desarrollar sus tierras."

 # Tasks
 barbaricum_suebi_boiohaemia_mission_task_1:0 "La Cuenca de Boyohemia"
 barbaricum_suebi_boiohaemia_mission_task_1_DESC:0 "Nuestros exploradores han informado de que hay tierras fértiles al sur. Es hora de enviar una expedición para asegurar el acceso a ellas.\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

 barbaricum_suebi_boiohaemia_mission_task_2:0 "Invadir Boyohemia"
 barbaricum_suebi_boiohaemia_mission_task_2_DESC:0 "Estas tierras son fértiles y ricas, y sus habitantes débiles; sus campos están listos para ser tomados. [ROOT.GetCountry.GetRuler.GetName|Y] ha convocado a [ROOT.GetCountry.GetRuler.GetHerHis] bandas de guerra a [ROOT.GetCountry.GetCapital.GetName|T] para prepararse para una invasión.\n\n\n\n\n\n\n\n\n\n@celt_mil9!"

 barbaricum_suebi_boiohaemia_mission_task_3:0 "Cruzar el Río Marus"
 barbaricum_suebi_boiohaemia_mission_task_3_DESC:0 "Al otro lado del #Y río Marus#! se encuentran las mejores tierras para cultivar @vegetables! y criar animales @cattle!, ¡y nuestros miembros de la tribu deben tenerlas para ellos! Nada se interpondrá en nuestro camino y nos impedirá adquirir estos territorios para [ROOT.GetCountry.GetName|G].\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 barbaricum_suebi_boiohaemia_mission_task_4:0 "El Palacio de Marbod"
 barbaricum_suebi_boiohaemia_mission_task_4_DESC:0 "En #G Boiohaemium#!, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido construir un magnífico palacio, uno que se elevará sobre las tierras [ROOT.GetCountry.GetAdjective|G]. Se cree que esta nueva sede de poder inspirará miedo y asombro entre muchos, exactamente lo que [ROOT.GetCountry.GetRuler.GetFirstName] quiere.\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 barbaricum_suebi_boiohaemia_mission_task_5:0 "El Refugio de los Traidores"
 barbaricum_suebi_boiohaemia_mission_task_5_DESC:0 "Algunos de nuestros traidores, huyendo sabiamente de la justicia de [ROOT.GetCountry.GetRuler.GetName|Y], abandonaron sus hogares y huyeron a #G Guthonia#!. Cuidado, mi [ROOT.GetCountry.GetRulerTitle], porque podrían causar problemas en el futuro.\n\n\n\n\n\n\n\n\n\n@celt_mil1!"

 barbaricum_suebi_boiohaemia_mission_task_6:0 "Defender la Cuenca"
 barbaricum_suebi_boiohaemia_mission_task_6_DESC:0 "El único acceso a nuestro nuevo hogar es a través de puntos de estrangulamiento que serían fácilmente defendibles, especialmente si invertimos recursos en la construcción de la infraestructura local. [ROOT.GetCountry.GetRuler.GetName|Y] cree que si [ROOT.GetCountry.GetRuler.GetSheHe] los fortificara, nadie con malas intenciones podría pasar a nuestras tierras.\n\n\n\n\n\n\n\n\n\n@greek_mil1!"

 barbaricum_suebi_boiohaemia_mission_task_7:0 "Guerras Marcomanas"
 barbaricum_suebi_boiohaemia_mission_task_7_DESC:0 "Ahora que tenemos las fortificaciones, necesitamos hombres para defender #G Boiohaemium#!. ¡Debemos enseñar a todos nuestros parientes en edad de luchar el camino de la lanza!\n\n\n\n\n\n\n\n\n\n@celt_mil7!"

 barbaricum_suebi_boiohaemia_mission_task_8:0 "Esclavos Cotinios"
 barbaricum_suebi_boiohaemia_mission_task_8_DESC:0 "Los #G Cotinii#! no son el pueblo más inteligente, pero son buenos trabajadores: sus espaldas son fuertes y están acostumbrados a trabajar desde el amanecer hasta el atardecer sin quejarse. Recientemente, hemos necesitado más mineros y seguramente cumplirán los requisitos.\n\n\n\n\n\n\n\n\n\n@celt_mil15!"

 barbaricum_suebi_boiohaemia_mission_task_9:0 "Corre la voz de [GetDeityDefinition('omen_tuisto').GetName]"
 barbaricum_suebi_boiohaemia_mission_task_9_DESC:0 "'Un hogar es tan bueno como el espíritu que lo gobierna': estas sabias palabras fueron pronunciadas hace mucho tiempo por uno de nuestros Ancianos Tribales y siguen siendo un principio rector para [ROOT.GetCountry.GetRuler.GetName|Y]. ¡El único espíritu verdadero es el nuestro!\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_suebi_boiohaemia_mission_task_10:0 "Un Nuevo Hogar Germano"
 barbaricum_suebi_boiohaemia_mission_task_10_DESC:0 "Una manada sólo se mueve tan rápido como sus animales más viejos y débiles. ¿Las personas son diferentes? Como ha demostrado [ROOT.GetCountry.GetRuler.GetName|Y], ¡las tribus de [ROOT.GetCountry.GetName|G] son las más poderosas que existen! Para ser más fuertes, todos deben ser como nosotros y, por lo tanto, los locales que hemos subyugado deben adoptar nuestras costumbres superiores.\n\n\n\n\n\n\n\n\n\n@event_pic13!"

 barbaricum_suebi_boiohaemia_mission_task_11:0 "Comercio del Moenus"
 barbaricum_suebi_boiohaemia_mission_task_11_DESC:0 "Sobre el #Y río Moenus#!, hay muchas personas con las que podríamos comerciar. Seguramente sería beneficioso si tuviéramos que iniciar el contacto...\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 barbaricum_suebi_boiohaemia_claims_1_tt:0 "Obtenemos reclamaciones en todos los territorios en las áreas de [GetProvince('(int32)3815').GetArea.GetName|G], [GetProvince('(int32)3936').GetArea.GetName|G] y [GetProvince('(int32)3943').GetArea.GetName|G]."
 barbaricum_suebi_boiohaemia_claims_2_tt:0 "Obtenemos reclamaciones en todos los territorios en las áreas de [GetProvince('(int32)3921').GetArea.GetName|G], [GetProvince('(int32)3936').GetArea.GetName|G] y [GetProvince('(int32)3918').GetArea.GetName|G]."
 barbaricum_suebi_boiohaemia_mission_task_7_trigger_tt:0 "Tener un ejército de al menos #T 40 cohortes#!."
 barbaricum_suebi_boiohaemia_claims_7_tt:0 "Obtenemos reclamaciones en todos los territorios en las áreas de [GetProvince('(int32)3758').GetArea.GetName|G], [GetProvince('(int32)4172').GetArea.GetName|G], [GetProvince('(int32)4173').GetArea.GetName|G] y [GetProvince('(int32)4852').GetArea.GetName|G]."
 convert_10_tt_a:0 "Convierte hasta #T 10 Pops#! en el área de [GetProvince('(int32)3818').GetArea.GetName|G]."
 convert_10_tt_b:0 "Convierte hasta #T 10 Pops#! en el área de [GetProvince('(int32)3938').GetArea.GetName|G]."
 convert_10_tt_c:0 "Convierte hasta #T 10 Pops#! en el área de [GetProvince('(int32)3942').GetArea.GetName|G]."
 barbaricum_suebi_boiohaemia_mission_task_5_tt:0 "El país de #G Guthonia#! debe ser nuestro #T Asunto#! o #R No existe#!."
 barbaricum_suebi_boiohaemia_mission_task_8_tt:0 "El país de #G Cotinia#! debe ser nuestro #T Asunto#! o #R No existe#!."
 barbaricum_suebi_boiohaemia_mission_task_10_tt1:0 "Necesitamos poseer al menos #T 5 asentamientos#! en la provincia #G Marcomannia#! que sean predominantemente #G cultura irminónica#!."
 barbaricum_suebi_boiohaemia_mission_task_10_tt2:0 "Necesitamos poseer al menos #T 5 asentamientos#! en la provincia de #G Boioa#! que sean predominantemente #G cultura irminónica#!."
 barbaricum_suebi_boiohaemia_mission_task_10_tt3:0 "Necesitamos poseer al menos #T 5 asentamientos#! en la provincia de #G Naharvalia#! que sean predominantemente #G cultura irminónica#!."

 #Ariovistus campaign
 barbaricum_suebi_gallia_mission:0 "Campaña de Ariovisto"
 barbaricum_suebi_gallia_mission_BUTTON_TOOLTIP:0 ""
 barbaricum_suebi_gallia_mission_BUTTON_DETAILS:0 ""
 barbaricum_suebi_gallia_mission_DESCRIPTION:0 "En su sociedad, todos los #E suevos#! son iguales y la destreza militar juega un papel cada vez mayor, lo que convierte a los suevos en los modelos de la cultura germánica.\n\nSus constantes ataques a sus vecinos no solo infunden miedo en los corazones de sus víctimas, sino que también los buenos líderes hacen contribuciones destacadas durante estos. Es sólo cuestión de tiempo que un líder popular pueda romper la tradición de igualdad.\n\nDe todos modos, nuestros jefes tribales han planeado una incursión en las tierras a lo largo del #E Rhenus#! durante mucho tiempo, y ahora es el momento de atacar mientras la #E Galia#! está en crisis."
 barbaricum_suebi_gallia_mission_CRITERIA_DESCRIPTION:0 "Esta misión se completará cuando [ROOT.GetCountry.GetName] reclame y establezca las tierras al este del Rhenus para los suevos."
 barbaricum_suebi_gallia_mission_REWARD_DESCRIPTION:0 "Ganar reclamaciones sobre las tierras al este del Rhenus y potencialmente forjar una nueva línea de sangre real."
 # Tasks
 barbaricum_suebi_gallia_mission_task_1:0 "Expulsar a los Usípetes y Tencteri"
 barbaricum_suebi_gallia_mission_task_1_DESC:0 "Los #G Usipetes#! y #G Tencteri#! han negado a nuestras bandas de asalto cruzar sus tierras para acceder a sus #G vecinos galos#! en el pasado: comportamiento escandaloso para los hijos de [GetDeityDefinition('omen_mannus').GetName|T], que deben ser ¡castigado!\n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 barbaricum_suebi_gallia_mission_task_2:0 "Aliados del Norte"
 barbaricum_suebi_gallia_mission_task_2_DESC:0 "En el Norte, los #G Eudoses#! y los #G Charudes#! son famosos por sus redadas eficientes y exitosas. Sin duda, serían grandes aliados en las batallas venideras.\n\n\n\n\n\n\n\n\n\n@celt_mil11!"

 barbaricum_suebi_gallia_mission_task_3:0 "Hacia Teurioquemia"
 barbaricum_suebi_gallia_mission_task_3_DESC:0 "#G Teuriochaemia#! es la puerta al sur galo y debemos tomarla si tenemos esperanzas de invadir #G Galia#! mismo.\n\n\n\n\n\n\n\n\n\n@celt_mil9!"

 barbaricum_suebi_gallia_mission_task_4:0 "Ariovistus"
 barbaricum_suebi_gallia_mission_task_4_DESC:0 "En nuestras filas hay un hombre conocido por los #G galos#! como #T 'Ariovisto'#!, un título honorífico para un gran líder militar. Es un auténtico #G guerrero suevo#! que ha luchado y ganado muchas batallas, a veces incluso junto a los galos bajo su mando. Su destreza y sus contactos podrían resultar invaluables.\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 barbaricum_suebi_gallia_mission_task_4_tt:0 "#Y Tendremos la opción de elegir un nuevo gobernante#!."

 barbaricum_suebi_gallia_mission_task_5:0 "Los Siete Aliados"
 barbaricum_suebi_gallia_mission_task_5_DESC:0 "Parece que hacia nuestro sur también podemos encontrar aliados interesados en atacar y establecerse en las ricas y fértiles tierras de #G Galia#!.\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_suebi_gallia_mission_task_6:0 "Destruir a los Ubios"
 barbaricum_suebi_gallia_mission_task_6_DESC:0 "Los #G Ubii#! viven en la orilla oriental del #Y Rhenus#!. Tenemos que destruirlos debido a sus relaciones amistosas con los #G galos#! del otro lado.\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 barbaricum_suebi_gallia_mission_task_7:0 "Aliados Galos"
 barbaricum_suebi_gallia_mission_task_7_DESC:0 "Los galos #G arvernos#! y #G sequani#! quieren conseguir nuestra ayuda en su guerra contra sus #G heduos#! enemigos. No está del todo claro [ROOT.GetCountry.GetRuler.GetName|Y] cuál es el motivo de este conflicto, aunque normalmente este tipo de guerras se libran por la supremacía sobre un vecino.\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"

 barbaricum_suebi_gallia_mission_task_8:0 "Derrotar a los Aedui"
 barbaricum_suebi_gallia_mission_task_8_DESC:0 "Podemos utilizar la guerra contra los #G eduos#! como pretexto para afianzarnos en la #G Galia#! para nosotros mismos.\n\n\n\n\n\n\n\n\n\n@celt_mil7!"

 barbaricum_suebi_gallia_mission_task_9:0 "Cruzar el Rhenus"
 barbaricum_suebi_gallia_mission_task_9_DESC:0 "Es hora de cruzar el #Y Rhenus#! y reclamar esta tierra fértil para nuestro pueblo.\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

 barbaricum_suebi_gallia_mission_task_10:0 "Domar al Lobo Romano"
 barbaricum_suebi_gallia_mission_task_10_DESC:0 "#R Roma#! ha manifestado interés en los #G asuntos galos#!. Depende de nosotros defender y asegurar nuestros logros contra esta amenaza extranjera.\n\n\n\n\n\n\n\n\n\n@celt_mil10!"

 barbaricum_suebi_gallia_mission_task_11:0 "Integrar Aliados"
 barbaricum_suebi_gallia_mission_task_11_DESC:0 "Es hora de decidir cómo queremos tratar a nuestros aliados y sus costumbres. Han demostrado su valía y enriquecido nuestra sociedad. Por lo tanto, deberíamos integrarlos completamente.\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_suebi_gallia_mission_task_12:0 "Asimilar Aliados"
 barbaricum_suebi_gallia_mission_task_12_DESC:0 "[ROOT.GetCountry.GetRuler.GetName|Y] ha decidido qué hacer con nuestros aliados y sus peculiares formas de hacer las cosas. Aunque han demostrado su valía y enriquecido nuestra sociedad, es evidente que la cultura #G Suebia#! es superior. Por lo tanto, debemos asimilarlos plenamente.\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 barbaricum_suebi_gallia_mission_task_13:0 "Rex Germanorum"
 barbaricum_suebi_gallia_mission_task_13_DESC:0 "Cuando comenzó nuestra campaña, nadie había soñado siquiera con tales éxitos y logros. [ROOT.GetCountry.GetRuler.GetName|Y] es venerado entre nuestro pueblo como un dios y su sangre se considera bendita, otorgándole prerrogativas de rey. Se trata, por tanto, sólo de una formalidad para declarar oficialmente su realeza, algo que no ocurre en el #G mundo suevo#! desde hace mucho tiempo. Hora.\n\n\n\n\n\n\n\n\n\n@celt_mil12!"

 barbaricum_suebi_gallia_mission_task_14:0 "Matrimonio Norico"
 barbaricum_suebi_gallia_mission_task_14_DESC:0 "#G Noricum#! se encuentra al sur de nuestro país, y un matrimonio real con una princesa norica resolvería dos problemas a la vez: aseguraría nuestro flanco sur y [ROOT.GetCountry.GetRuler.GetName|Y] un cónyuge.\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 barbaricum_suebi_gallia_mission_task_14_tt:0 "#Y Nuestro gobernante tendrá la opción de un matrimonio.#!"

 barbaricum_suebi_gallia_mission_task_15:0 "Herederos Reales"
 barbaricum_suebi_gallia_mission_task_15_DESC:0 "Para asegurar el gobierno de los #Y [ROOT.GetCountry.GetRuler.GetFamily.GetName]#! para las generaciones venideras, [ROOT.GetCountry.GetRuler.GetName|Y] necesita un heredero que pueda continuar con el reinado real. Linaje.\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_suebi_gallia_mission_task_16:0 "Desierto Helvetio"
 barbaricum_suebi_gallia_mission_task_16_DESC:0 "Como es costumbre #G suevos#!, no podemos tolerar la presencia de #G helvéticos#! viviendo cerca de nosotros; deben ser completamente destruidos. ¡Esta tierra será conocida como #R 'Desierto Helvético'#! en los siglos venideros!\n\n\n\n\n\n\n\n\n\n@celt_mil11!"

 barbaricum_suebi_gallia_mission_task_17:0 "Al otro lado de los Albis"
 barbaricum_suebi_gallia_mission_task_17_DESC:0 "Nuestro feroz [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName|Y] ha puesto [ROOT.GetCountry.GetRuler.GetHerHis] ojos en los territorios de nuestro oeste, al otro lado del #Y río Albis#! - las tribus allí son débiles y serán fáciles de derrotar. Someter.\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"

 barbaricum_suebi_gallia_task_5_tooltip:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)3733').GetArea.GetName|G] y [GetProvince('(int32)3775').GetArea.GetName|G]."
 barbaricum_suebi_gallia_task_7_tooltip:0 "Obtenemos reclamos en todos los territorios en las Áreas de [GetProvince('(int32)3015').GetArea.GetName|G], [GetProvince('(int32)3054').GetArea.GetName|G], [GetProvince('(int32)3011').GetArea.GetName|G], [GetProvince('(int32)2440').GetArea.GetName|G] y [GetProvince('(int32)2300').GetArea.GetName|G]."

