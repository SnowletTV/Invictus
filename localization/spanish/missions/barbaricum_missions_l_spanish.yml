 #Treveria (Gaul)
 barbaricum_treveria_mission:0 "Reino del Rhenus"
 barbaricum_treveria_mission_BUTTON_TOOLTIP:0 "Ha llegado el momento de que los Treverios expandan sus humildes fronteras..."
 barbaricum_treveria_mission_BUTTON_DETAILS:0 ""
 barbaricum_treveria_mission_DESCRIPTION:0 "Nosotros, los #E Treverianos#! somos un pueblo poderoso y temible, uno de los más fuertes de la #E Galia#!, y vivimos cómodamente junto a las aguas del #E Rhenus#!, rodeados de tribus competidoras que ocasionalmente nos desafían por los recursos: esta es la forma de vida que conocieron nuestros padres, y muchos están felices de vivir sus vidas siguiendo su pasos.\n\nY, sin embargo, algunos han propuesto que mayores glorias nos esperan; ven la debilidad de nuestros enemigos y conocen el potencial de nuestro pueblo..."
 barbaricum_treveria_mission_CRITERIA_DESCRIPTION:0 "Esta misión estará completa cuando #E Treveria#! haya construido un poderoso y poderoso #E Reino de Rhenus#!."
 barbaricum_treveria_mission_REWARD_DESCRIPTION:0 ""
 # Tasks
 barbaricum_treveria_mission_task_1:0 "Honrar a los Antepasados"
 barbaricum_treveria_mission_task_1_DESC:0 "¿Cómo podemos planear nuestro futuro sin reconocer las deudas del pasado? Nuestros antepasados merecen ser debidamente venerados para que continúen bendiciéndonos. \n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_treveria_mission_task_2:0 "Un Entierro en Carro"
 barbaricum_treveria_mission_task_2_DESC:0 "Desde tiempos inmemoriales, hemos enterrado a nuestros líderes en tumbas elaboradas, asegurándonos de que nuestros guerreros tengan todo lo que necesitarán para el próximo mundo. Continuar con estas prácticas traerá estabilidad a nuestro pueblo y legitimidad a [ROOT.GetCountry.GetRuler.GetName|Y]. \n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

 barbaricum_treveria_mission_task_3:0 "Sobornar al Consejo"
 barbaricum_treveria_mission_task_3_DESC:0 "Nuestros asuntos administrativos avanzan a un ritmo frustrantemente lento, sin duda debido a las disputas de nuestros #T jefes de clan#!. Si repartimos algo de moneda, estamos seguros de que podemos conseguir resultados favorables... \n\n\n\n\n\n\n\n\n\n\n@event_pic12!"

 barbaricum_treveria_mission_task_4:0 "Ambición Monárquica"
 barbaricum_treveria_mission_task_4_DESC:0 "Ahora que hemos asegurado nuestro flanco político, ha llegado el momento de un audaz empuje: es hora de dejar de lado nuestras antiguas formas de gobierno y abrazar una monarquía. \n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"

 barbaricum_treveria_mission_task_5:0 "Triunfo en Treveria"
 barbaricum_treveria_mission_task_5_DESC:0 "¡La hora de la victoria está sobre nosotros! Hemos tenido éxito en todos nuestros esfuerzos y hemos establecido un reino que es la envidia de quienes nos rodean, uno que es poderoso, rico y protegido. Sólo el tiempo dirá qué glorias futuras nos esperan, pero por ahora celebramos nuestro triunfo. \n\n\n\n\n\n\n\n\n\n\n@greek_mil6!"

 barbaricum_treveria_mission_task_6:0 "Iniciativa Hill Fort"
 barbaricum_treveria_mission_task_6_DESC:0 "La construcción de fortalezas en terrenos elevados ha sido durante mucho tiempo prerrogativa de nuestros militares; Desde nuestras posiciones de mando en nuestros fuertes de las colinas, descansamos confiados en nuestro poder. \n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 barbaricum_treveria_mission_task_7:0 "Treveran Oppida"
 barbaricum_treveria_mission_task_7_DESC:0 "No podemos ignorar la construcción de ciudades centrándonos únicamente en nuestro ejército, ya que esto iría en detrimento de nuestros éxitos futuros. Debemos hacer todo lo que podamos para aumentar nuestra infraestructura civil. \n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

 barbaricum_treveria_mission_task_8:0 "Treveria"
 barbaricum_treveria_mission_task_8_DESC:0 "Las llanuras de #G Treveria#! serían una capital excelente, dada su auspiciosa ubicación cerca de un río. Deberíamos dejar nuestro hogar en los bosques e instalarnos en algún lugar donde podamos expandirnos. \n\n\n\n\n\n\n\n\n\n\n@event_pic13!"

 barbaricum_treveria_mission_task_9:0 "Afluentes belgas"
 barbaricum_treveria_mission_task_9_DESC:0 "Las tribus de nuestro norte siempre han sido una fuente de irritación, pero tal vez podamos convertir este obstáculo en una ventaja convirtiéndolas en nuestros súbditos. \n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 barbaricum_treveria_mission_task_10:0 "Sometimiento de los eburones"
 barbaricum_treveria_mission_task_10_DESC:0 "Los #G Eburones#! han declarado abiertamente que son hostiles a nuestra expansión y que harán todo lo posible para detenernos. Desafortunadamente para ellos, esto significa su perdición. No descansaremos hasta que estén completamente subyugados. \n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"

 barbaricum_treveria_mission_task_11:0 "Bélgica treveriana"
 barbaricum_treveria_mission_task_11_DESC:0 "Ahora que nos hemos enfrentado repetidamente con los #G belgas#!, estamos familiarizados con sus métodos de guerra; pongamos fin a sus pretensiones y apoderemos de la totalidad de #G Bélgica#!. \n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"

 barbaricum_treveria_mission_task_12:0 "El Rhenus"
 barbaricum_treveria_mission_task_12_DESC:0 "Hemos decidido ampliar nuestras fronteras a las poderosas aguas del poderoso #Y Rhenus#!, sabiendo que el río será una excelente fortificación natural. ¡Será una tarea ardua, pero nuestros impuestos están listos! \n\n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 barbaricum_treveria_mission_task_13:0 "Fortificar el Rhenus"
 barbaricum_treveria_mission_task_13_DESC:0 "Sólo hay un puñado de lugares que permiten cruzar fácilmente el #Y Rhenus#!, y a nuestros asesores militares les gustaría que estos lugares estuvieran fortificados; una tarea que [ROOT.GetCountry.GetRuler.GetName|Y] está feliz de ver completada. \n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"

 barbaricum_treveria_mission_task_14:0 "Crisol de culturas"
 barbaricum_treveria_mission_task_14_DESC:0 "Si bien algunos de nuestros pueblos conquistados temen que los mantengamos como una subclase esclava permanente, no tenemos ningún deseo de humillar a nuestros hermanos; Preferiríamos integrar a todos nuestros súbditos en nuestra familia feliz. \n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"

 barbaricum_treveria_mission_task_15:0 "Minas de hierro"
 barbaricum_treveria_mission_task_15_DESC:0 "La creciente fuerza de nuestros ejércitos se basa en el hierro @iron!, que es la columna vertebral de nuestro ejército. Necesitamos producir la mayor cantidad posible de este mineral, porque tenemos enemigos poderosos a nuestro alrededor. ¡Preparad a nuestros animales de tiro y a nuestros trabajadores para despojar a las montañas de sus riquezas! \n\n\n\n\n\n\n\n\n\n\n@celt_mil13!"

 barbaricum_treveria_mission_task_16:0 "Relaciones comerciales"
 barbaricum_treveria_mission_task_16_DESC:0 "Han llegado tiempos de auge a [GetProvince('(int32)3687').GetArea.GetName|G], sin duda debido al crecimiento del comercio en esta región vital. Hay cosas que podríamos hacer para aumentar estos ingresos, si así lo deseamos. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 barbaricum_treveria_mission_task_17:0 "Montañas del Jura"
 barbaricum_treveria_mission_task_17_DESC:0 "Las #G Montañas del Jura#! al sur son la puerta de [GetProvince('(int32)3537').GetArea.GetName|T], y una zona tan importante no se puede dejar sola. Deberíamos hacer todo lo que podamos para conquistar esta zona, no sea que otros nos ganen. \n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"

 barbaricum_treveria_mission_task_18:0 "Expansión occidental"
 barbaricum_treveria_mission_task_18_DESC:0 "Los bosques occidentales están llenos de tribus hostiles que resienten el crecimiento de nuestro pueblo y, sin duda, nos atacarían en un momento de debilidad si les diéramos la oportunidad. No podemos permitir que esto suceda. \n\n\n\n\n\n\n\n\n\n\n@celt_mil11!"

 barbaricum_treveria_mission_task_19:0 "Asegure nuestra costa"
 barbaricum_treveria_mission_task_19_DESC:0 "Tenemos la suerte de haber conquistado regiones muy alejadas de nuestra patria y, por primera vez desde que tenemos memoria, ahora poseemos una larga costa, algo que es nuevo para nuestro pueblo. Si bien esto es una gran bendición, debemos tomar medidas para garantizar que nuestra costa esté segura. \n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"

 coast_treveria_19_tt:0 "Debemos construir un #Y Puerto#! y una #Y Fortaleza#! en el mismo lugar, en algún lugar de una de estas provincias; #G Veliocassia#!, #G Morinia#! o #G Ganuenta#!. Necesitaremos construir una ciudad o tener la tecnología de #Y Planificación Rural#!."

 #Cisalpine Gaul
 barbaricum_gallia_cisalpina_mission:0 "Italia celta"
 barbaricum_gallia_cisalpina_mission_BUTTON_TOOLTIP:0 "Los valles de Italia se encuentran ante nosotros indefensos, listos para ser conquistados si tenemos la voluntad..."
 barbaricum_gallia_cisalpina_mission_BUTTON_DETAILS:0 ""
 barbaricum_gallia_cisalpina_mission_DESCRIPTION:0 "Durante muchos años, nuestro pueblo ha vagado, atravesando montañas y bosques en busca de una patria que podamos llamar nuestra. Después de muchas décadas difíciles, nos hemos asentado en [GetProvince('(int32)4').GetArea.GetRegion.GetName], expulsando a quienes nos precedieron y haciendo de esta tierra un lugar de refugio. Y, sin embargo, mientras miramos hacia el valle desde nuestras viviendas montañosas, reconocemos que esto es sólo el comienzo de lo que hemos planeado..."

 barbaricum_gallia_cisalpina_mission_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completa cuando hayamos extendido nuestro control a lo largo de la totalidad de [GetProvince('(int32)4').GetArea.GetRegion.GetName], desde las montañas del norte hasta las ciudades del sur."
 barbaricum_gallia_cisalpina_mission_REWARD_DESCRIPTION:0 ""

 # Tasks
 barbaricum_gallia_cisalpina_mission_task_1:0 "Conquista padana"
 barbaricum_gallia_cisalpina_mission_task_1_DESC:0 "Hay buena tierra al norte; todo el mundo sabe que la región de #G Padania#! es fértil, con abundantes recursos que deseamos mucho. Sigamos el río #Y Padus#! hacia el interior y conquistemos a quienes viven allí ahora. \n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"

 barbaricum_gallia_cisalpina_mission_task_2:0 "Expandirse hacia el sur"
 barbaricum_gallia_cisalpina_mission_task_2_DESC:0 "Las tribus del sur son débiles y no pueden defenderse de nosotros si decidimos apoderarnos de sus tierras. Incluso ahora, permanecen sin dormir en sus camas, preguntándose si pronto vendremos a destruirlos; tal vez sea hora de que hagamos realidad sus peores pesadillas. \n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 barbaricum_gallia_cisalpina_mission_task_3:0 "Costa de Génova"
 barbaricum_gallia_cisalpina_mission_task_3_DESC:0 "La #G Costa de Génova#! es una franja de tierra muy transitada, llena de piratas que se aprovechan de las flotas mercantes que bordean la costa en su camino hacia #G Iberia#! y sus riquezas. Es hora de que alguien ponga fin a esta plaga de bandidos... o al menos exija que recibamos nuestra parte justa de las ganancias. \n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"

 barbaricum_gallia_cisalpina_mission_task_4:0 "Tierras venecianas"
 barbaricum_gallia_cisalpina_mission_task_4_DESC:0 "El territorio al sur de los #G Alpes Carnicae#!, con tierras actualmente habitadas por los #G venecianos#!, está listo para ser tomado; La batalla será feroz, pero nos apoderaremos de sus campos y bosques y los expulsaremos a las montañas. \n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"

 barbaricum_gallia_cisalpina_mission_task_5:0 "Acabar con los etruscos"
 barbaricum_gallia_cisalpina_mission_task_5_DESC:0 "Tenemos motivos para temer al extraño pueblo conocido como #G etruscos#!, porque sus ciudades son muchas y su poder militar es considerable. Sólo un tonto no reconocería su fuerza, pero es cierto que también tienen motivos para temernos... \n\n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 barbaricum_gallia_cisalpina_mission_task_6:0 "Planes de construcción naval"
 barbaricum_gallia_cisalpina_mission_task_6_DESC:0 "Las aguas del #Y Mare Tyrrhenum#! nos brindan oportunidades que antes no estábamos en condiciones de aprovechar, pero todo eso ha cambiado. Nuestro pueblo debe construir barcos si queremos ser vistos como iguales a nuestros vecinos. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"

 barbaricum_gallia_cisalpina_mission_task_7:0 "La isla de Córcega"
 barbaricum_gallia_cisalpina_mission_task_7_DESC:0 "Tenemos motivos para sentir un especial cariño por la isla de #G Córcega#!, especialmente si consideramos que fue una de las primeras de nuestras posesiones en ultramar. Como tal, debemos cuidar bien lo que se nos ha confiado. \n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"

 barbaricum_gallia_cisalpina_mission_task_8:0 "El saqueo de Roma"
 barbaricum_gallia_cisalpina_mission_task_8_DESC:0 "Hemos oído de otros asaltantes #G celtas#! que los #R romanos#! son ricos y cobardes, con ciudades y pueblos de magnífica riqueza que difícilmente pueden defender. La promesa de la gloria eterna los llama: les quitaremos sus hogares. \n\n\n\n\n\n\n\n\n\n\n@celt_mil10!"

 barbaricum_gallia_cisalpina_mission_task_9:0 "sur de italia"
 barbaricum_gallia_cisalpina_mission_task_9_DESC:0 "Las ciudades del sur de #G Italia#! son antiguas e históricas, con raíces que se remontan a una época más allá de la memoria; su conexión con esta tierra es profunda. Seremos respetuosos de su antigüedad, siempre y cuando reconozcan nuestra autoridad en todo asunto. \n\n\n\n\n\n\n\n\n\n\n@event_pic9!"

 barbaricum_gallia_cisalpina_mission_task_10:0 "mediolano"
 barbaricum_gallia_cisalpina_mission_task_10_DESC:0 "Perfectamente situada en una posición privilegiada con vistas a todo el campo, la fortaleza de #G Mediolanum#! merece los elogios que recibe. Tenemos una visión para esta región, pero más importante aún, la voluntad de hacerla realidad. \n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

 barbaricum_gallia_cisalpina_mission_task_11:0 "Desarrollar Padania"
 barbaricum_gallia_cisalpina_mission_task_11_DESC:0 "Es importante que sigamos invirtiendo en #G Padania#!; Ahora que tenemos #G Mediolanum#! en nuestro poder, debemos utilizarlo como base de operaciones y planificar el crecimiento cívico y económico de la región circundante. \n\n\n\n\n\n\n\n\n\n\n@event_pic11!"

 barbaricum_gallia_cisalpina_mission_task_12:0 "La riqueza de Italia"
 barbaricum_gallia_cisalpina_mission_task_12_DESC:0 "A medida que llegan los últimos informes económicos, una cosa queda muy clara; Gracias a nuestras últimas adquisiciones en #G Italia#!, estamos ganando mucho dinero. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 barbaricum_gallia_cisalpina_mission_task_13:0 "Cultura italiana"
 barbaricum_gallia_cisalpina_mission_task_13_DESC:0 "Hemos decidido emprender una gran iniciativa de construcción, con el propósito expreso de impulsar y fortalecer la cultura en nuestras ciudades. Contamos con los medios económicos para hacerlo, lo que hace que esto sea una cuestión imperativa para el mejoramiento de nuestra sociedad. \n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"

 barbaricum_gallia_cisalpina_mission_task_14:0 "Anhelos republicanos"
 barbaricum_gallia_cisalpina_mission_task_14_DESC:0 "Hay voces, particularmente entre los más ricos de nuestra sociedad, que claman por un cambio de gobierno. Al afirmar que hemos superado nuestras raíces humildes, argumentan que podemos reconocer de dónde venimos y al mismo tiempo confiar a los mejores entre nosotros para que nos conduzcan a glorias futuras. \n\n\n\n\n\n\n\n\n\n\n@event_pic12!"

 barbaricum_gallia_cisalpina_mission_task_15:0 "Asegure nuestra regla"
 barbaricum_gallia_cisalpina_mission_task_15_DESC:0 "Hemos ampliado enormemente nuestras fronteras en los últimos años, quizás excediendo lo que prudentemente podíamos manejar en nuestro ansia de ver a nuestros enemigos destruidos. Ahora que estamos en una posición de fortaleza, consolidemos lo que ya hemos adquirido; se lo agradeceremos en el futuro. \n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 barbaricum_gallia_cisalpina_mission_task_15_tt:0 "Todos los líderes de partido deben tener más de #T 70 puntos de lealtad#!."

 barbaricum_gallia_cisalpina_mission_task_16:0 "Todos los caminos conducen a Mediolanum"
 barbaricum_gallia_cisalpina_mission_task_16_DESC:0 "La creciente importancia de #G Mediolanum#! eclipsa nuestras elevadas expectativas; Nadie podría haber previsto en qué magnífica ciudad se convertiría. \n\n\n\n\n\n\n\n\n\n\n@event_pic1!"

 barbaricum_gallia_cisalpina_mission_task_17:0 "gaesati"
 barbaricum_gallia_cisalpina_mission_task_17_DESC:0 "Nuestros ambiciosos planes para la región requerirán manos experimentadas, algo de lo que actualmente carecemos, pero conocemos a hombres que están familiarizados con la guerra y dispuestos a compartir sus conocimientos, especialmente si el precio es adecuado; el #G Gaesati#!. \n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 barbaricum_gallia_cisalpina_mission_task_18:0 "Aliados transalpinos"
 barbaricum_gallia_cisalpina_mission_task_18_DESC:0 "Un gobernante sabio tiene amigos cercanos y lejanos, sabiendo que es prudente combinar fortunas en tiempos de problemas, porque ¿quién sabe qué miserias trae consigo el nuevo día? Con este sabio consejo en mente, hemos decidido buscar un aliado. \n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"

 barbaricum_gallia_cisalpina_mission_task_19:0 "Fortificar los pases"
 barbaricum_gallia_cisalpina_mission_task_19_DESC:0 "La seguridad de nuestra nación depende de nuestra capacidad de controlar quién entra y sale de los #G Alpes#!; nadie debería poder entrar impunemente en nuestras tierras. Tomaremos medidas para garantizar que esta invasión nunca ocurra. \n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"

 barbaricum_gallia_cisalpina_mission_task_20:0 "Invitar colonos"
 barbaricum_gallia_cisalpina_mission_task_20_DESC:0 "Después de un período de reflexión, hemos decidido invitar a los colonos a venir a vivir junto a nuestro pueblo. Si bien algunos cuestionan la conveniencia de permitir que estos colonos vivan dentro de nuestras ciudades, es importante que tengamos una fuente adecuada de mano de obra para nuestras guerras futuras. \n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"

 barbaricum_gallia_cisalpina_mission_task_21:0 "Escritura lepóntica"
 barbaricum_gallia_cisalpina_mission_task_21_DESC:0 "Durante años, hemos dependido de las inscripciones en piedra, creyendo que escribir a la manera de nuestros antepasados sería suficiente para guiar a nuestro pueblo hacia un futuro próspero. Sin embargo, nuestras nuevas responsabilidades administrativas exigen que importemos papiro; difícilmente podemos mantenernos al día con lo que se requiere para administrar adecuadamente nuestro estado. \n\n\n\n\n\n\n\n\n\n\n@india_mil17!"

 barbaricum_gallia_cisalpina_mission_task_22:0 "Estrecho de Mesene"
 barbaricum_gallia_cisalpina_mission_task_22_DESC:0 "Desde hace años, somos conscientes de la importancia estratégica del #Y Estrecho de Messene#!, sabiendo que el Maestro de esa bella ciudad controla el flujo del tráfico marítimo en la región. Teniendo en cuenta lo que hemos logrado en #G Italia#!, este es el siguiente paso lógico. \n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"

