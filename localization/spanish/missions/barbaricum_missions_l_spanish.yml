 #Treverian Tooltips
 barbaricum_treveria_mission_task_1_tt:0 "Cuando un gobernante ha muerto, #G Treveria#! podrá darle al líder caído un #T Entierro en vagón#! a través de una cadena de eventos."
 barbaricum_treveria_mission_task_2_variable:0 "Necesitamos observar los #G ritos funerarios treverianos#! para un #Y jefe tribal#! caído dándole un #T entierro en carro#!, pero nadie digno de ese honor ha perecido.\n\n(#Y Cuando tu gobernante actual ha muerto, se activa un evento que permitirá que los entierres apropiadamente.#!)"
 barbaricum_treveria_mission_task_3_tt:0 "Todos los #T Jefes de clan#! deben tener una Lealtad mayor o igual a # 70#!."
 barbaricum_treveria_claims_9_tt:0 "Recibiremos reclamaciones sobre muchas de las regiones que nos rodean: #G Menapia, Nervia, Ganuenta, Mediomatricia, Tribocia, Raurica#! y #G Vangionia #!."
 barbaricum_treveria_mission_task_9_tt:0 "Necesitamos tener al menos #T 2 sujetos#! que sean #G cultura eburoniana#! que sean #R NO#! el país #G Eburonia#!."
 barbaricum_treveria_claims_12_tt:0 "Recibiremos reclamaciones sobre las regiones #G Sequania y Verbigenia#!."
 barbaricum_treveria_claims_10_tt:0 "Recibiremos reclamaciones en las regiones #G Remia, Morinia, Bellovacia y Parisia#!."
 barbaricum_treveria_claims_17_tt:0 "Recibiremos reclamaciones sobre las regiones #G Senonia#!, #G Leucia#! y #G Haeduia#!."
 barbaricum_treveria_mission_task_14_belgianculture:0 "Necesitaremos integrar una de las siguientes #Y culturas belgas#!; #G Aduataciano#!, #G Eburoniano#!, #G Nerviano#!, #G Moriniano#!, #G Veliocasiano#!, #G Bellovaciano#!."
 barbaricum_treveria_mission_task_14_germanicculture:0 "Necesitaremos integrar una de las siguientes culturas #Y germánicas#!; #G Cimbrio#!, #G Istvaeónico#!, #G Ingvaeónico#!, #G Irminónico#!, #G Gótico#!, #G Vándalo#!, #G Bastarnae#!."
 barbaricum_treveria_mission_task_15_tt:0 "Necesitamos poseer un territorio que produzca al menos #T 2 Hierro#! @iron!."
 barbaricum_aremorica_mission_task_17_tt:0 "Necesitamos poseer un territorio que produzca al menos #T 2 ámbar#! @amber!."
