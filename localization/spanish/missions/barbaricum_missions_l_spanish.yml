 barbaricum_aremorica_event_14:0 "Podremos decidir cómo gobernar #G Lusitania#!."
 barbaricum_aremorica_event_15:0 "Podremos decidir cómo gobernar #G Bética#!."
 barbaricum_aremorica_event_18:0 "Enviaremos aventureros al centro de civilización del Mediterráneo, la tierra de las Pirámides."
 barbaricum_aremorica_event_21:0 "Nuestro gobernante podrá consultar el #T Oráculo de las Gallizenas#!."
 barbaricum_aremorica_mission_task_19_naval_parity_tooltip:0 "Tener al menos paridad naval con #G Cartago#!."
 barbaricum_aremorica_mission_task_2_tt:0 "Tener al menos un fuerte costero en cada una de las Áreas de [GetProvince('(int32)2159').GetArea.GetName|G], [GetProvince('(int32)2146').GetArea.GetName|G] y [GetProvince('(int32)2216').GetArea.GetName|G]."
 barbaricum_aremorica_mission_task_4_tt:0 "Posee una provincia costera con al menos 15 habitantes, cultura #G aremorica#! dominante y religión #T druídica#! dominante."
 barbaricum_aremorica_mission_task_9_tt:0 "Poseer un puerto en cada una de las Áreas de [GetProvince('(int32)2471').GetArea.GetName|G], [GetProvince('(int32)3028').GetArea.GetName|G] y [GetProvince('(int32)3844').GetArea.GetName|G]."
 barbaricum_aremorica_event_16:0 "Podremos convertirnos en una #Y República Plutocrática#!."
 barbaricum_aremorica_mission_task_6_tt:0 "Debemos poseer el #G Área de Dumnonia#! directamente, o #G Dumnonia#! debe ser nuestro #T Sujeto#!."
 barbaricum_aremorica_mission_task_20_allow_tt_1:0 "[SCOPE.GetRootScope.GetCountry.GetName|E] está invocando el presagio #Y $Toutatis$#!, con $Toutatis$ como deidad en su panteón."

