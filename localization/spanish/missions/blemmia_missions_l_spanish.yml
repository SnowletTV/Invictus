l_spanish:
 
 blemmia_missions:0 "El ascenso de las Tierras Rojas"
 blemmia_missions_DESCRIPTION:0 "Las tribus Blemmyan, envueltas en mitos, misterios y conceptos erróneos, siempre han sido una banda de asaltantes vagamente reunida. Sin embargo, detrás de cada incursión había un propósito. Más allá de las orillas del Nilo, en lo más profundo de las colinas y acantilados del desierto, un estado en ascenso de tribus Blemmyan-Beja se estaba consolidando bajo lo que se convertiría en una línea real de grandes reyes que gobernaban a los reyes ordinarios y, bajo ellos, a los jefes tribales. Con la vista puesta en la isla de Philae y los centros culturales y religiosos del Alto Egipto, los Blemmyae se convertirán en grandes rivales de las principales potencias del Nilo."
 blemmia_missions_CRITERIA_DESCRIPTION:0 "Esta misión quedará completada cuando las tribus Blemmyan controlen los desiertos de Libia y el tramo medio del Nilo."
 blemmia_missions_BUTTON_TOOLTIP:0 "¡Levántate de la tierra roja!"
 blemmia_missions_BUTTON_DETAILS: ""
  
  #Missions
  
 blemmia_missions_task_1:0 "Obligaciones adabulianas"
 blemmia_missions_task_1_DESC:0 "Comúnmente considerados una subtribu del gran grupo blemmiano, se debe abordar a los adabulianos en relación con su integración en nuestro sistema federado de pueblos seminómadas."
 blemmia_missions_task_1_tt:0 "Todos los personajes que ocupen un #E cargo#! deben tener una #E lealtad#! mayor que #Y 65#!."
  
 blemmia_missions_task_2:0 "Estratificación política"
 blemmia_missions_task_2_DESC:0 "Para gobernar mejor un reino tan vasto, las familias blemmyas más antiguas y ricas han optado por implementar un sistema tripartito, dividiendo la jerarquía de gobierno en jefes tribales, señores de clan y el gran jefe."
  
 blemmia_missions_task_3:0 "Mons Smaragdus"
 blemmia_missions_task_3_DESC:0 "Las minas de olivino y esmeralda de Mons Smaragdus, famosas desde los tiempos de los faraones más antiguos, deben volver a ser explotadas por los pueblos del desierto: es un recurso natural de Blemmya."
 blemmia_missions_task_3_tt:0 "#Y Blemmia#! ha promulgado la #Y Decisión Cultural#! denominada #Y Derechos territoriales protegidos#! para la cultura #Y Blemmyan#!."
  
 blemmia_missions_task_4:0 "Blemmyan Oro"
 blemmia_missions_task_4_DESC:0 "Para impulsar la creciente federación Blemmyan y asegurar su soberanía contra gente como los Ptolomeos y la realeza de Kush, se debe lograr el crecimiento económico a través de la minería de oro."
  
 blemmia_missions_task_5:0 "Recordemos el Medjay"
 blemmia_missions_task_5_DESC:0 "Muchos nobles y ciudades egipcios utilizan a los blemmianos como policías, remontándose a los viejos tiempos cuando muchos de los de nuestra especie eran conocidos como los Medjay. ¡Estos guerreros deberían proteger nuestras aldeas y nuestra gente!"
 blemmia_missions_task_5_tt1:0 "#Y Blemmia#! ha promulgado la #Y Decisión Cultural#! denominada #Y Facilitación de Restricciones a la Ciudadanía#! para la cultura #Y Blemmyan#!."
 blemmia_missions_task_5_tt2:0 "#E Blemmyan#! guerreros medjay que residen en los #E territorios#! resaltados de #Y Dodekaschoinos#! y #Y Egipto#! #G migrarán#! a #Y La capital#! #E de Blemmia#!."
  
 blemmia_missions_task_6:0 "Vínculos con los Megabaroi"
 blemmia_missions_task_6_DESC:0 "A menudo considerados primos de los blemmianos, los Megabaroi han aprendido a cultivar y prosperar a lo largo de las orillas nubias del Nilo. Se les debe recordar sus vínculos con nuestras tribus."
  
 blemmia_missions_task_7:0 "Regla segmentada"
 blemmia_missions_task_7_DESC:0 "Los blemmianos son un pueblo móvil y, para controlar una gran cantidad de tierra, los gobernantes deben tener muchos puntos de control políticamente estables entre los cuales viajar, al igual que los pastores que migran para seguir los patrones de la lluvia."
  
 blemmia_missions_task_8:0 "La ciudad totalmente dorada"
 blemmia_missions_task_8_DESC:0 "Berenike Panchrysos es un testimonio del pueblo, el poder y la estabilidad política de Blemmyan. Utilice sus reservas de oro para honrar a su homónimo y construir un refugio en el desierto."
  
 blemmia_missions_task_9:0 "El comercio de esmeraldas"
 blemmia_missions_task_9_DESC:0 "Con las minas de olivino en funcionamiento, los blemmianos deben aprovechar al máximo esta bendición para establecer ricas rutas comerciales y enriquecer nuestras tierras áridas."
 blemmia_missions_task_9_tt:0 "#Y Blemmia#! #E colonizará#! la provincia de #Y Ictiofagia#! y conectará su ruta comercial terrestre con el puerto de #Y Adouli#!."
  
 blemmia_missions_task_10:0 "Redes terrestres rojas"
 blemmia_missions_task_10_DESC:0 "Al este del Nilo, pocos pueblos pueden viajar con confianza por las dunas, los estrechos áridos y los campos vacíos de la Tierra Roja que se encuentra entre el río y el mar. Utilizando camellos, caballos bien educados y los trucos de los nómadas, los blemmianos convertirán estos páramos vacíos en vías de comercio e influencia cultural."
  
 blemmia_missions_task_11:0 "Talleres de tabot"
 blemmia_missions_task_11_DESC:0 "En las tierras de los Adabuli, el sitio de Tabot se encuentra inactivo como un lugar perfecto para fabricar grandes artículos de lujo para la exportación con las numerosas minas de gemas en las colinas cercanas. La gente debería tomar las tierras y convertir este lugar desolado en un emporio."
  
 blemmia_missions_task_12:0 "Hombres sin cabeza"
 blemmia_missions_task_12_DESC:0 "Los de tierras lejanas no saben nada del verdadero pueblo blemmiano y han llegado a confundir a los habitantes del desierto con hombres monstruosos y sin cabeza que llevan caras en el pecho. Dejemos que las tribus exploten esta idea errónea para atemorizar a nuestros enemigos y oscurecer la verdadera belleza de la tierra."
 blemmia_missions_task_12_tt1:0 "#Y Blemmia#! verá un resurgimiento de mitos, rumores e informes sobre los #Y Blemmyes#! sin cabeza, que podrían significar #G fortuna#! o #R perdición#! para las tribus."
 blemmia_missions_task_12_tt2:0 "Con #R hordas#! de #Y Blemmyes#! sin cabeza vagando ahora por las arenas ante la provocación de los #Y Blemmyans#!, los #T desiertos#! de Libia se han vuelto más #R peligrosos#!."
  
 blemmia_missions_task_13:0 "Los trogoditas"
 blemmia_missions_task_13_DESC:0 "Los trogoditas, una tribu entre los blemmianos, son otro pueblo confundido. Debido a la complejidad de su lengua y a su comportamiento aislado, a los ojos de los extranjeros han quedado reducidos a simples habitantes de las cavernas. Dejemos que su verdadero potencial y sus técnicas de combate se utilicen para inspirar asombro a los egipcios y kushitas."
 blemmia_missions_task_13_tt:0 "#Y Blemmia#! tiene una #E deidad de guerra#! en su #T panteón#!, posee el #T sitio sagrado#! de esa deidad y ha #E activado#! el #T de esa deidad. Presagio#!."
  
 blemmia_missions_task_14:0 "Asaltando Dodekaschoinos"
 blemmia_missions_task_14_DESC:0 "Las veinte ciudades a lo largo del tramo medio del Nilo, que conduce a la isla de Filae, siempre se han destacado por ser prósperas y dignas de ganado, cereales, esclavos y riquezas. Los espías blemmianos han informado del valor de apoderarse de la llamada Isla Final por la riqueza de su complejo de templos."
  
 blemmia_missions_task_15:0 "El reino blemmiano"
 blemmia_missions_task_15_DESC:0 "El reino de Blemmyan ya no es un simple pueblo de pastores, sino que ha elegido una familia real para liderar al pueblo como un gran rey de todas las tribus."
  
 blemmia_missions_task_16:0 "Controlando a Berenike"
 blemmia_missions_task_16_DESC:0 "Berenike en el mar ilumina la tierra como un faro de prosperidad, el principal nodo de comunicación y comercio entre el desierto y el vasto mundo más allá del alcance de los blemmianos. Se debe invertir en él para que la gente pueda disfrutar de los lujos y beneficios de la creación del mundo."
 blemmia_missions_task_16_tt:0 "#Y Blemmia#! tiene un #E ejército#! con un #E comandante#! y al menos #Y 10 unidades#!."
  
 blemmia_missions_task_17:0 "El comercio de camellos"
 blemmia_missions_task_17_DESC:0 "A lo largo del Nilo, los camellos de los desiertos del otro lado del mar se han convertido en sinónimo de comercio y viajes, superando y durando más que el típico caballo. Para los comerciantes que todavía claman por estas bestias de carga, las tribus blemmyas deberían proporcionar un suministro constante."
  
 blemmia_missions_task_18:0 "Comercio de esclavos blemmianos"
 blemmia_missions_task_18_DESC:0 "De las muchas incursiones que han realizado las bandas tribales, tenemos muchos esclavos excedentes para entregar a los comerciantes que vienen del otro lado del mar. Los mercados de los nabateos deberían resultar rentables."
 blemmia_missions_task_18_tt1:0 "Un #T país árabe#! o #T yemení#! cultural #E#! debe tener una #E opinión#! de #Y Blemmia#! superior a #T 50#!. #Y El gobernante de Blemmia#! debe ser #G amigo#! de su #E gobernante#!."
 blemmia_missions_task_18_tt2:0 "#Y El gobernante#! tiene una #T explotación#! con al menos #Y 10 esclavos#! y un #T edificio de finca de esclavos#! o un edificio #T molino#!."
 blemmia_missions_task_18_tt3:0 "#Y Blemmia#! tiene al menos #Y 1#! cultura con #T derechos de esclavo#!."
  
 blemmia_missions_task_19:0 "Asaltando Tebas"
 blemmia_missions_task_19_DESC:0 "Los egipcios, unos matones en el norte, siempre han amenazado e invadido las tierras blemmyas. Para garantizar nuestra prosperidad y reclamar parte del rico Nilo, los guerreros de los blemmianos deberían llevar la lucha a su corazón."
  
 blemmia_missions_task_20:0 "Adoración de Mandulis"
 blemmia_missions_task_20_DESC:0 "Mandulis, el dios del sol, preside el amplio panteón que adoran los blemmianos. Para sus templos a lo largo del Nilo, es nuestro deber darles servicio y mantenerlos bajo nuestro propio gobierno."
 blemmia_missions_task_20_tt:0 "#Y El #! #T lugar sagrado#! de Mandulis está en #T Talmes#!."
  
 blemmia_missions_task_21:0 "La isla final"
 blemmia_missions_task_21_DESC:0 "Filae, la isla sagrada de Isis y los dioses del Nilo, debe convertirse en la capital cultural de los blemmianos para establecer una historia duradera y una educación de la fe entre las tribus."
 blemmia_missions_task_21_tt:0 "#Y Blemmia#! ha #E integrado#! una #E cultura#! de los grupos culturales #T aksumita#!, #T nubia#! y #T egipcia#!."
  
 blemmia_missions_task_22:0 "Gobernando el Nilo Medio"
 blemmia_missions_task_22_DESC:0 "Extendiéndose más allá del desierto, los blemmianos deben arar el suelo fértil del Nilo y hacer crecer nuestro reino antes de desaparecer lentamente en la oscuridad."
  
 blemmia_missions_task_23:0 "La regla de oro"
 blemmia_missions_task_23_DESC:0 "Omboi ha sido conocida como la \"Tierra del Oro\", igualando la riqueza de Luxor y las otras grandes ciudades del faraónico Alto Egipto. Los blemmianos tienen el potencial de reconstruir su opulencia y convertir la región en una gran metrópoli de riqueza que impulse el crecimiento en el desierto."
  
 blemmia_missions_task_24:0 "Un imperio blemmiano"
 blemmia_missions_task_24_DESC:0 "Para dominar las tierras negras y rojas de Libia, los blemmianos deben subyugar a todas las grandes potencias del país y formar un gran estado del pueblo."
 
  
  
  #Tooltips
  
  
  
  #Modifiers
 
 blemmyan_red_cities:0 "Ciudades Rojas"
 desc_blemmyan_red_cities:0 "Se avecina una tormenta en las tierras rojas al este del Nilo, y grandes ciudades se levantan de las arenas, fundadas por las tribus blemmya."
 
 blemmyan_negotiations:0 "Negociaciones blemmianas"
 desc_blemmyan_negotiations:0 "Trabajar con la integración de las tribus Blemmyan relacionadas ha enseñado a los jefes cómo resolver mejor los conflictos y entablar amistades."
 
 blemmyan_gold_mining:0 "Minería de oro en Blemmyan"
 desc_blemmyan_gold_mining:0 "Las doradas colinas y acantilados del desierto al este del Nilo contienen vetas de oro aparentemente ilimitadas."
 
 segmented_blemmyan_capitals:0 "Capitales segmentadas"
 desc_segmented_blemmyan_capitals:0 "Al distribuir la administración del estado de Blemmyan entre múltiples capitales estacionales, la burocracia se vuelve más flexible y los constructores de Blemmyan adquieren más experiencia."
 
 blemmyan_all_golden_city:0 "La ciudad totalmente dorada"
 desc_blemmyan_all_golden_city:0 "Brillando como una joya en el desierto, Berenike Panchrysos se destaca entre todas las ciudades, elevando el estatus y el respeto de su gente y su gobernante."
 
 blemmyan_mine_construction:0 "Construcción de la mina Blemmyan"
 desc_blemmyan_mine_construction:0 "Los resistentes trabajadores de Blemmyan se han acostumbrado regularmente a fabricar nuevos pozos y equipos mineros."
 
 medjay_training:0 "Entrenamiento Medjay"
 desc_medjay_training:0 "Los policías medjay que regresaron de tierras egipcias han enseñado a los guerreros blemmyanos costumbres de lucha extranjeras y sofisticadas, potenciando su efecto en la batalla."
 
 blemmyan_emerald_mining:0 "Minas de esmeraldas de Blemmyan"
 desc_blemmyan_emerald_mining:0 "Las piedras preciosas de olivino de Mons Smaragdus son ahora un pilar de la economía del estado de Blemmayan."
 
 red_lands_trade:0 "Comercio de tierras rojas"
 desc_red_lands_trade:0 "Las sólidas rutas comerciales establecidas a lo largo de los desiertos al este del Nilo han creado un rico refugio para los comerciantes."
 
 tabot_workshops:0 "Los talleres de Tabot"
 desc_tabot_workshops:0 "Los artesanos de Tabot producen artículos de lujo a un ritmo nunca visto en el continente libio."
 
 headless_men_rumors:0 "Hombres sin cabeza"
 desc_headless_men_rumors:0 "Otros pueblos han llegado a temer las tierras de los Blemmyes, monstruosidades sin cabeza."
 
 trogodyte_speed:0 "Velocidad trogodita"
 desc_trogodyte_speed:0 "Con entrenamiento trogodita, los ejércitos de los blemmianos se mueven a la velocidad del rayo."
 
 subjugating_berenike:0 "Subyugar a Berenike"
 desc_subjugating_berenike:0 "Asediar ligeramente y dominar políticamente la ciudad portuaria costera de Berenike ha enseñado mucho a las fuerzas y líderes blemmianos sobre negociaciones agresivas."
 
 blemmyan_caravans:0 "Caravanas Blemmyan"
 desc_blemmyan_caravans:0 "La expansión de las redes de camellos ha hecho que las Tierras Rojas estén más conectadas y sean más prósperas, reforzando la economía y la infraestructura de Blemmyan."
 
 blemmyan_dromedary_cavalry:0 "Caballería de dromedarios blemmianos"
 desc_blemmyan_dromedary_cavalry:0 "Trabajar con criadores de camellos y la generalización de los propios camellos ha llevado a una competencia masiva en el uso de camellos para la guerra."
 
 blemmyan_slave_trade:0 "Comercio de esclavos blemmianos"
 desc_blemmyan_slave_trade:0 "El comercio de esclavos a través del mar con los pueblos árabes se ha convertido en una bendición para los blemmianos."
 
 blemmyan_golden_rule:0 "Regla de oro de Blemmyan"
 desc_blemmyan_golden_rule:0 "Los ciudadanos de Omboi han invertido y están cosechando los beneficios del comercio del oro."
 
 mandulis_worship:0 "Adoración de Mandulis"
 desc_mandulis_worship:0 "Adorar al dios sol que todo lo ve, Mandulis, ha traído prosperidad y claridad a la gente."
 
 mandulis_effect:0 "El efecto Mandulis"
 desc_mandulis_effect:0 "El culto central a Mandulis ha llevado a una centralización del pueblo y a un gran apoyo para la realeza que adora al dios."
 
 philae_expansion:0 "Expansión de Filae"
 desc_philae_expansion:0 "La inversión en la isla de File, así como en su complejo de templos, ha dado lugar a un lugar próspero en el Nilo."
 
 blemmyan_aswan:0 "Blemmyan Asuán"
 desc_blemmyan_aswan:0 "El papel de Blemmyan en el área de Asuán en el Nilo ha llevado al crecimiento de muchas ciudades a orillas del gran río."
 
 troglodytica_uprising:0 "Levantamiento troglodita"
 desc_troglodytica_uprising:0 "Los blemmianos han forzado un levantamiento en una de las regiones que bordean el Mar Rojo."
 
 blemmyan_sub_capital:0 "Subcapital de Blemmyan"
 desc_blemmyan_sub_capital:0 "Los blemmianos gobiernan a través de una serie de capitales menores en todo el reino."
 
 emerald_port:0 "Puerto Esmeralda"
 desc_emerald_port:0 "Ptolemais Theron se ha convertido en un importante centro de exportación para el suministro de esmeraldas de Blemmyan, un faro verde de riqueza en la costa de las Tierras Rojas."
 
 red_roads:0 "Caminos rojos"
 desc_red_roads:0 "La prevalencia de caminos básicos transitados por caballos entre las tierras rojas ha proporcionado más experiencia a los constructores para desarrollar nuevas redes comerciales."
 
 gems_for_tabot:0 "Gemas para Tabot"
 desc_gems_for_tabot:0 "Las minas de Sinkat alimentan los centros de producción dentro de los muros de Tabot."
 
  
  
  #Events
 me_blemmia_1_title:0 "Agregando a los adulianos"
 me_blemmia_1_desc:0 "Al reunirse con el consejo de Adul, los blemmianos pudieron demostrar una herencia compartida y defender la integración de los adulianos en la sociedad blemmiana en general. Sin embargo, muchos ancianos de Adula se sienten nerviosos ante la idea de abandonar su autonomía y convertirse en parte de un todo mayor. ¿Cómo resolverán los blemmianos esta situación?"
 me_blemmia_1.a:0 "Proporcionar fondos para calmar sus preocupaciones."
 me_blemmia_1.b:0 "Envía guerreros para ayudar en la transición."
 me_blemmia_1.c:0 "Saben que ejercemos la mayor influencia."
  
 me_blemmia_2_title:0 "Reyes, jefes y señores"
 me_blemmia_2_desc:0 "Para gobernar un Blemmya en expansión y móvil, el mayor y más sabio de las familias blemmyan ha sido denominado \"Gran Jefe\", mientras que a los que están debajo de él se les han hecho regionales sus roles: los señores de los clanes y los jefes tribales. Ahora, el Gran Jefe puede dictar términos y políticas a sus subordinados gobernantes."
 me_blemmia_2.a:0 "¡Deja que la estructura cree una Blemmya más fuerte!"
 me_blemmia_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $blemmia_missions_task_2$#!' $mission_completed_tooltip_2$"
  
 me_blemmia_3_title:0 "El levantamiento esmeralda"
 me_blemmia_3_desc:0 "Alrededor de la región troglodita, los campamentos blemmianos respondieron al llamado del Gran Jefe y recuperaron su soberanía de manos de los egipcios, rechazando el yugo del Nilo. Ahora, los funcionarios de Alejandría y Memphis están furiosos y maldicen su suerte por haber vivido en la época de los blemmianos. Las obras egipcias han sido expulsadas de las minas de Mons Smaragdus."
 me_blemmia_3.a:0 "¡Ahora a las minas!"
  
 me_blemmia_4_title:0 "Prospección de Oro Rojo"
 me_blemmia_4_desc:0 "Una fiebre del oro se ha apoderado de las tierras rojas de Blemmya. Con todas las nuevas minas que se construyen en montañas, acantilados y cuevas, los más ambiciosos entre los jefes tribales desean explorar incluso una veta de oro más. ¿Debería realmente el pueblo blemmiano perseguir una perspectiva tan codiciosa?"
 me_blemmia_4.a:0 "Búsqueda de nuevos pastos minerales."
 me_blemmia_4.b:0 "Tenemos suficiente oro."
  
 me_blemmia_5_title:0 "Experiencia Medjay"
 me_blemmia_5_desc:0 "Entre los muchos guerreros Medjay que regresaron a tierras Blemmyan, un hombre entre ellos afirma ser un líder de la guardia policial egipcia. Dice además que su experiencia sería invaluable para entrenar a los guerreros blemmianos en la forma egipcia o para entrenar a los líderes con mentes militares sobre las tácticas egipcias; cualquiera de las dos opciones otorgaría a los blemmianos una gran ventaja contra sus adversarios."
 me_blemmia_5.a:0 "Ponlos a prueba."
 me_blemmia_5.b:0 "Haga que enseñe a los estrategas."
  
 me_blemmia_6_title:0 "Fusionando los Megabarii"
 me_blemmia_6_desc:0 "Con los vínculos entre los principales clanes Megabarii y los Blemmyans demostrados a través de las tradiciones orales, las propuestas amistosas entre los dos han logrado avances. Sin embargo, aún quedan algunos miembros renuentes y tradicionalistas de la jerarquía del clan Megabarian: sienten que convertirse en parte del reino Blemmyan reducirá la identidad Magabarian."
 me_blemmia_6.a:0 "Sobornar a los funcionarios inquebrantables."
 me_blemmia_6.b:0 "Utilice una demostración de fuerza con nuestros guerreros."
 me_blemmia_6.c:0 "Presionar sus obligaciones tribales."
  
 me_blemmia_7_title:0 "Una serie de capitales"
 me_blemmia_7_desc:0 "Las rutas regularmente patrulladas y mantenidas entre las varias capitales menores establecidas por los blemmianos han terminado su construcción y ahora se puede dejar que crezcan y extiendan su influencia local."
 me_blemmia_7.a:0 "¡Que estas ciudades prosperen!"
  
 me_blemmia_8_title:0 "$blemmia_missions_task_8$"
 me_blemmia_8_desc:0 "El desarrollo y la expansión de la principal capital de Blemmyan han provocado un auge de la economía y un interés migratorio en el corazón de los Blemmyan."
 me_blemmia_8.a:0 "¡Que fluya el oro!"
 me_blemmia_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $blemmia_missions_task_8$#!' $mission_completed_tooltip_2$"
  
 me_blemmia_9_title:0 "Apertura de minas de esmeralda adicionales"
 me_blemmia_9_desc:0 "Si bien la apertura de minas de gemas de olivino se ha convertido en una bendición para las rutas comerciales de Blemmya y las negociaciones con potencias extranjeras, algunos miembros codiciosos de la burocracia de Blemmya creen que Mons Smaragdus puede volverse aún más rentable. En el lado opuesto del hito geográfico, existen rumores de que la parte trasera de la montaña también contiene una gran cantidad de vetas verdes. El único peligro es que posibles excavaciones en esta nueva parte de la montaña puedan colapsar parte de la mina original, arruinando todas nuestras operaciones a la vez, es decir, si es que encontramos esmeraldas en la parte trasera de la montaña. ¿Qué se debe hacer?"
 me_blemmia_9.a:0 "¡Sumérgete en la montaña!"
 me_blemmia_9.b:0 "Disfrutemos de nuestro botín inicial."
  
 me_blemmia_10_title:0 "Olivino Ptolemaida Terón"
 me_blemmia_10_desc:0 "El comercio a lo largo de la costa salada de las Tierras Rojas se ha convertido en un río de gemas de olivino procedentes de las minas de Mons Smaragdus. Sin embargo, por muy rápido que podamos extraer estas gemas, no tenemos la infraestructura para exportarlas a la mayor velocidad. El magistrado de Blemmyan ha señalado el potencial de Ptolemais Theron como un puerto clave desde el cual enviar todo el exceso de esmeraldas, solucionando el problema. ¿Se resolverá el asunto ahora?"
 me_blemmia_10.a:0 "Sí, invertir en el futuro de la ciudad."
 me_blemmia_10.b:0 "Berenike, al norte, parece ser un objetivo de inversión futuro."
  
 me_blemmia_11_title:0 "Caminos rojos"
 me_blemmia_11_desc:0 "Las redes de carreteras de las Tierras Rojas han cosechado un gran beneficio por la regularidad y diversidad del comercio entre los blemmianos y los extranjeros. La afluencia de nuevos comerciantes ha aportado nuevos conocimientos y conciencia a las mentes blemmianas. El magistrado del Gran Jefe cree que los nuevos comerciantes económicos pueden utilizarse para desarrollar aún más las tierras y las políticas de Blemmyan. ¿Se hará?"
 me_blemmia_11.a:0 "Los caminos nos han permitido traer nuevos bienes a nuestras tierras."
 me_blemmia_11.b:0 "Debemos mejorar aún más la calidad de las carreteras."
 me_blemmia_11.c:0 "Haz que el magistrado aprenda de los comerciantes."
 me_blemmia_11.d:0 "Cosechemos los beneficios de nuestras nuevas carreteras."
  
 me_blemmia_12_title:0 "Las gemas de Tabot"
 me_blemmia_12_desc:0 "Con los talleres de Tabot funcionando sólo a la mitad de su capacidad, los trabajadores y joyeros han suplicado al magistrado de Blemmyan que aumente la producción de materias primas mediante la construcción de la ciudad alrededor de Sinkat. ¿Invertirán los blemmianos en este lugar?"
 me_blemmia_12.a:0 "Convertir a Sinkat en una operación nacional."
 me_blemmia_12.b:0 "Deja las minas en paz."
  
 me_blemmia_13_title:0 "Algo en las colinas del desierto"
 me_blemmia_13_desc:0 "Han comenzado a circular rumores de que algo está sucediendo en los desiertos, a la sombra de los acantilados y en las profundidades de las cuevas polvorientas. Los comerciantes se están poniendo nerviosos. Los nobles desconfían de sus casas de vacaciones privadas en la costa. Más personas han comenzado a buscar refugio en las ciudades de Blemmyan."
 me_blemmia_13.a:0 "Mantenga los ojos en el horizonte."
  
 me_blemmia_14_title:0 "Aparecen los sin cabeza"
 me_blemmia_14_desc:0 "Mensajeros acudieron apresuradamente al gran jefe de los blemmianos para informarle que las aldeas de Duweb habían sido atacadas, algunas incluso desalojadas de su gente y que no se habían encontrado cadáveres. Ha surgido el pánico entre la población: \"Blemmyes\" es la única palabra que se está difundiendo. El pueblo maldito parece haber aparecido una vez más, y se cree que sólo existe dentro de los mitos y leyendas de los tiempos antiguos."
 me_blemmia_14.a:0 "¡Duplica las patrullas en las ciudades y en las carreteras!"
  
 me_blemmia_15_title:0 "¡Habla!"
 me_blemmia_15_desc:0 "La cena del Gran Jefe Blemmyan fue bruscamente interrumpida por gritos y ruidos de choques afuera en las calles de la capital. Todo cobró sentido cuando una criatura espantosa, baja, robusta, fornida y coja, entró en el gran salón. Todos los ojos se dirigieron a sus anchos pies, su tosca lanza pero, sobre todo, el rostro horriblemente inhumano que llevaba en su pecho, una boca con dientes centrada en su torso. Luego vinieron las palabras: una serie de clics y ruidos gorgoteantes, ciertamente de un estilo extraño. Lo más parecido a esto era la lengua distintiva de los trogloditas, que emiten ruidos parecidos a clics en sus cuevas. Mientras se garantizaba la seguridad del Gran Jefe, se reunió un ejército de traductores. Pasando los mensajes, uno por uno, el Gran Jefe se acercó para escuchar las demandas de los Blemmye: 'Comida. Agua. Riqueza. Dad por lanzas. Tales eran sus comprensibles deseos, las minucias de su significado se perdían en la interminable traducción. ¿Se ocupará el gobernante blemmiano de esta criatura?"
 me_blemmia_15.a:0 "Ofrece un regalo de hospitalidad e invita a su jefe."
 me_blemmia_15.b:0 "Echa al monstruo; no son bienvenidos aquí."
 me_blemmia_15_tooltip1:0 "Aunque sean rechazados al principio, los #Y Blemmyes#! pueden olvidarse de su gente y molestar a otros."
 me_blemmia_15_tooltip2:0 "Es posible que los #Y Blemmyes#! no tomen amablemente su despido y respondan #R violentamente#!."
  
 me_blemmia_16_title:0 "El ataque de los Blemmyes"
 me_blemmia_16_desc:0 "Los jinetes del sur han traído noticias de que hordas de asaltantes Blemmye han cruzado el Nilo y están saqueando las tierras Blemmyan cercanas, matando a todos los saqueadores a voluntad. La pesadilla de los Blemmyes se ha vuelto demasiado real."
 me_blemmia_16.a:0 "Marshall los guerreros blemmianos"
 me_blemmia_16_tooltip:0 "¡Los #Y Blemmyes de Baruda#! se apoderarán de parte del #Y territorio#! de Blemmia y librarán una #R guerra#! contra #Y Blemmia#! y #Y Kush#!!"
  
 me_blemmia_17_title:0 "Las blemmies plagan Libia"
 me_blemmia_17_desc:0 "Los mensajes del extranjero traen noticias de que los clanes Blemmye han invadido y surgido por todos los desiertos de Libia, atacando y librando guerras donde les plazca, provocando el caos. Debemos navegar por este difícil entorno si queremos sobrevivir a la incursión de estas criaturas supuestamente legendarias."
 me_blemmia_17.a:0 "Tomar medidas defensivas."
 me_blemmia_17_tooltip:0 "Los clanes #Y Blemmye#! aparecerán a lo largo del Nilo y #R amenazarán#! las potencias vecinas."
  
 me_blemmia_18_title:0 "El jefe Blemmye"
 me_blemmia_18_desc:0 "Después de un largo período, el jefe de los Blemmyes apareció en el salón del Gran Jefe de los Blemmyans. Una vez más, la horda de traductores se reunió para hacer comprensible su gorgoteo. Su mensaje quedó claro: los Blemmyes podían comprarse o convertirse en un problema; había poco espacio para relaciones pasivas. ¿Contratarán los blemmianos a los monstruos?"
 me_blemmia_18.a:0 "Ofréceles todo lo que sea necesario."
 me_blemmia_18.b:0 "Hazles una oferta decente."
 me_blemmia_18.c:0 "No ofrecemos nada."
 me_blemmia_18_tooltip1:0 "Los #Y Blemmyes#! se convertirán en #T súbditos#! de los #Y Blemmyans#!."
 me_blemmia_18_tooltip2:0 "Los clanes #Y Blemmye#! aparecerán a lo largo del Nilo y #R amenazarán#! las potencias vecinas."
 me_blemmia_18_tooltip3:0 "Los clanes #Y Blemmye#! atacarán #R directamente#! #Y las tierras de Blemmyan#!."
  
 me_blemmia_19_title:0 "Sujetos Blemmye"
 me_blemmia_19_desc:0 "Se han enviado misivas del clan Blemmye, aunque toscas, para reconocer su sumisión al Gran Jefe Blemmyan. Proporcionarán grandes guerreros y causarán caos a los enemigos de los blemmianos, en lugar de ser una molestia para las Tierras Rojas."
 me_blemmia_19.a:0 "Que amplíen nuestra esfera de influencia."
 me_blemmia_19_tooltip:0 "Los #Y Blemmyans#! #G ganan#! #Y 3#! #T Clan Blemmye#! #Y súbditos#! a lo largo del Nilo."
  
 me_blemmia_20_title:0 "Guerreros trogloditas"
 me_blemmia_20_desc:0 "Muchos hombres destacados entre los trogloditas han ascendido en estatura y han ganado influencia dentro del ejército blemmiano. Los guardaespaldas y estrategas militares del Gran Jefe han sugerido incluir a estos hombres en la jerarquía militar o hacer que se involucren en el proceso de entrenamiento, aunque muchos blemmyanos los parecen extraños y ajenos: su lenguaje basado en clics es difícil de abordar y tienen hábitos extraños. ¿Cómo deberían incorporarse estos hombres?"
 me_blemmia_20.a:0 "Dejemos que los trogloditas entrenen a la próxima generación de guerreros."
 me_blemmia_20.b:0 "Haz que los trogloditas lideren nuestras fuerzas."
 me_blemmia_20.c:0 "No traigas a los bárbaros habitantes de las cavernas."
  
 me_blemmia_21_title:0 "Incursión en Dodekaschoinos"
 me_blemmia_21_desc:0 "A medida que nuestros guerreros llegan al Nilo y al territorio de las 20 ciudades, se han extendido algunos rumores de que los magistrados de cada ciudad del colectivo preferirían vender su ciudad antes que aceptar un asedio. ¿Quizás se pueda razonar con ellos? Al menos podrán asustarse con una incursión temprana y algunos pequeños incendios."
 me_blemmia_21.a:0 "Envía exploradores para quemar las primeras aldeas a su paso."
 me_blemmia_21.b:0 "Intente sobornar a los funcionarios de la ciudad para que entreguen sus ciudades."
 me_blemmia_21.c:0 "Dejemos que la guerra continúe como está."
 me_blemmia_21_tooltip:0 "Los exploradores #Y Blemmyan#! saquearán y robarán algunos asentamientos en #T Dodekaschoinos#!."
  
 me_blemmia_22_title:0 "El gran rey blemmiano"
 me_blemmia_22_desc:0 "El Gran Jefe de los Blemmyans se ha convertido en un Gran Rey del reino. Debajo de él se encuentran los reyes de los antiguos clanes, y debajo de ellos los grandes jefes de las numerosas tribus. Un sistema así propagará el poder y la influencia de las tradiciones blemmianas."
 me_blemmia_22.a:0 "¡Viva el rey!"
  
 me_blemmia_23_title:0 "Intimidación Berenike"
 me_blemmia_23_desc:0 "Rodeados por nuestras fuerzas, los funcionarios de Berenike Troglodytike han enviado mensajeros para iniciar negociaciones con los líderes blemmianos, buscando una solución pacífica. Según lo ven los líderes blemmianos, Berenike podría capitular o convertirse en una marioneta del reino blemmiano. ¿Qué haremos?"
 me_blemmia_23.a:0 "Berenike debería unirse al pueblo blemmiano."
 me_blemmia_23.b:0 "Berenike sólo necesita cooperar con nuestros comerciantes."
 me_blemmia_23.c:0 "Berenike caerá en manos de nuestros guerreros."
 me_blemmia_23_tooltip:0 "#Y Berenike Troglodytike#! se convertirá en #T League City#! #G sujeto#! de #Y Blemmia#!."
  
 me_blemmia_24_title:0 "Camellos blemmianos"
 me_blemmia_24_desc:0 "Los nuevos caravasares (modelados a la manera nabatea) en los mercados de las ciudades de Blemmyan han traído un nuevo nivel de prosperidad y una naturaleza bulliciosa a las calles."
 me_blemmia_24.a:0 "Dejemos que el comercio a camello impulse la economía."
 
 me_blemmia_25_title:0 "Esclavos blemmianos"
 me_blemmia_25_desc:0 "Embarcados en el puerto de Ptolemais Theron, los esclavos obtenidos de la guerra se convirtieron en una exportación habitual del pueblo blemmiano, ya que los árabes disfrutaban de estos grupos de trabajo manual."
 me_blemmia_25.a:0 "La trata de esclavos proporcionará financiación adicional..."
 
 me_blemmia_26_title:0 "Incursión tebana"
 me_blemmia_26_desc:0 "La tierra de Luxor y Thebai es rica y vulnerable, y las propias ciudades a menudo se rebelan abiertamente contra el régimen de Alejandría. Sin embargo, no son amigos de los blemmianos y creen que los de su especie son superiores y más avanzados. Por lo tanto, mediante el poder militar debemos mostrarles el poder de las tribus blemmya."
 me_blemmia_26.a:0 "Envíe una unidad avanzada."
 me_blemmia_26.b:0 "Invadir como de costumbre."
 me_blemmia_26_tooltip:0 "Los exploradores #Y Blemmyan#! saquearán y robarán algunos asentamientos cerca de #T Latopolis#!."
 
 me_blemmia_27_title:0 "El templo de Kalabsha"
 me_blemmia_27_desc:0 "En la tierra de Talmes se encuentra el terreno abandonado de lo que una vez fue un antiguo y humilde lugar de adoración del dios sol Mandulis, a quien todos los blemmianos adoran con fervor. Muchos de los miembros religiosos de la sociedad blemmiana están instando a que se reconstruya un gran templo en esta tierra, conocido por los fieles blemmianos como Kalabsha. ¿Se emprenderá esta gran obra?"
 me_blemmia_27.a:0 "Que a Mandulis se le conceda el mayor de los templos."
 me_blemmia_27.b:0 "No se iniciará ningún proyecto de construcción de este tipo."
 
 me_blemmia_28_title:0 "filae"
 me_blemmia_28_desc:0 "Philae, un centro cultural para todos los que vinculan sus vidas al Nilo y sus alrededores, se destaca como un faro de unidad, mezcla cultural y adoración santa para todos los pueblos de la gran extensión de Libia. Para muchos habitantes de Blemmya, el lugar es más sagrado que cualquiera de las capitales actuales o cualquier lugar sagrado en el desierto. Quizás haya llegado el momento de trasladar el trono a este magnífico lugar y gobernar desde un nodo central en el río más grande del mundo."
 me_blemmia_28.a:0 "La isla Philae se convertirá en el centro del reino Blemmyan."
 me_blemmia_28.b:0 "Las Tierras Rojas son donde siempre saludaremos."
 
 me_blemmia_29_title:0 "$blemmia_missions_task_22$"
 me_blemmia_29_desc:0 "Con los tramos más duros del Nilo bajo el control de Blemmyan, los límites inferior y superior del mismo se dejan a voluntad. El poder de Egipto y Kush, divididos en dos por nuestra incursión, está frenado por el poder de las tribus de la Tierra Roja."
 me_blemmia_29.a:0 "Los reyes del Nilo serán Blemmyan."
 me_blemmia_29_tooltip:0 "$mission_completed_tooltip_1$ '#Y $blemmia_missions_task_22$#!' $mission_completed_tooltip_2$"
 
 me_blemmia_30_title:0 "$blemmia_missions_task_23$"
 me_blemmia_30_desc:0 "Las calles de Omboi brillan con la presencia de polvo de oro y ladrillos brillantes de metales preciosos que recubren las paredes y pasillos de los templos. Un lugar rico, se erige como un faro literal y metafórico de las riquezas que los blemmianos traerán a todas las tierras a lo largo del Nilo."
 me_blemmia_30.a:0 "Los salones dorados dan la bienvenida a los funcionarios blemmianos."
 me_blemmia_30_tooltip:0 "$mission_completed_tooltip_1$ '#Y $blemmia_missions_task_23$#!' $mission_completed_tooltip_2$"
 
 me_blemmia_31_title:0 "El emperador blemmiano"
 me_blemmia_31_desc:0 "Mandulis brilla sobre [ROOT.GetCountry.GetRuler.GetName] en el glorioso día de su coronación. Con este último paso, los blemmianos se convierten en dueños del Nilo, de la sede de Libia, y demuestran su poder para conquistar todo lo que se les presente. Ha comenzado una nueva era."
 me_blemmia_31.a:0 "Inclínate ante el emperador Blemmyan."
 me_blemmia_31_tooltip:0 "$mission_completed_tooltip_1$ '#Y $blemmia_missions_task_31$#!' $mission_completed_tooltip_2$"
 
