l_spanish:
 
 01_bosporan_kingdom:0 "Los hijos de Spartokos"
 01_bosporan_kingdom_DESCRIPTION:0 "Descendientes de colonos griegos que originalmente vinieron de [GetProvince('(int32)1973').GetName], los [ROOT.GetCountry.GetName] han prosperado en las colinas y bosques de #E Taurica#! durante los últimos siglos. Una familia conocida como los #E Archaeanactids#! gobernó a los Bósforos durante unos cincuenta años antes de que nuestro antepasado, el mercenario #E Spartokos I#!, los derrocara y estableciera su propia dinastía.\n\nDos fuertes Basileis, #E Leukon#! y #E Paerisades#!, nos gobernaron durante siete prósperas décadas, pero los últimos cinco años no han traído más que devastación y una ruinosa guerra civil al reino, ya que los tres hijos de los Paerisades ignoraron sus deseos en el lecho de muerte y decidieron luchar entre ellos por el trono. Sin embargo, la lucha entre los hermanos fue breve y el hijo del medio, #E Eumelo#!, derrotó a #E Sátiro#!, el heredero elegido, y al tonto #E Prytanis#! en un año.\n\nEumelo había perdido la #E Batalla del río Thatis#!, un enfrentamiento importante en el que murieron decenas de miles de hombres de ambos bandos, pero superó este revés y finalmente salió victorioso, sin mostrar piedad hacia sus hermanos ni sus amigos. Eumelus gobernó unos breves cinco años antes de morir en un trágico accidente que afectó a su carruaje, cumpliendo la profecía de una bruja sobre los peligros de las \"casas que se mueven\", y su sucesor, el joven [ROOT.GetCountry.GetRuler.GetName], sólo lleva unos meses en el poder.\n\nRodeados de salvajes #E escitas#! y otros bárbaros, los bosporanos se han encontrado luchando junto y contra sus vecinos en varios momentos de su historia (Eumelo nunca habría ganado su guerra sin la ayuda de los #E sármatas#! aliados) y su presencia inminente, como la vasta e interminable estepa que se extiende más allá de los bosques de Taurica, sigue siendo una realidad que los aislados Los habitantes del Bósforo tendrán que enfrentarse a ello. Las incursiones de las tribus del norte están aumentando con una frecuencia alarmante, y las #E Guerras de los Diadochi#! que se han apoderado del sur han hecho de las aguas del #E Pontus Euxinus#! un lugar peligroso para estar."
 01_bosporan_kingdom_CRITERIA_DESCRIPTION:0 "Esta misión se completará cuando el [ROOT.GetCountry.GetName] haya derrotado a sus enemigos en casa y en el extranjero y haya asegurado la paz en el #E Ponto Euxino#!."
 01_bosporan_kingdom_BUTTON_TOOLTIP:0 "¿Puedo seguir los pasos de Spartokos?"
 01_bosporan_kingdom_BUTTON_DETAILS: ""
 
 #Missions
 
 01_bosporan_kingdom_task_1:0 "Tomando Taurica"
 01_bosporan_kingdom_task_1_DESC:0 "Hacia nuestro oeste se encuentran dos enemigos implacables; los hijos de [GetCountry('CHS').GetName|Y], que son nuestros parientes descarriados, y los amenazantes #G escitas#!, que son una poderosa amenaza que no debe subestimarse.\n\nSea como sea, no podemos permitir que ningún rival se apodere de territorios dentro de la provincia de #T Taurica#!, por lo que es un tiempo de guerra. Casi sobre nosotros.\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 
 01_bosporan_kingdom_task_2:0 "Tyras y Olbia"
 01_bosporan_kingdom_task_2_DESC:0 "Ahora que las ciudades de Bosporan de [GetProvince('(int32)4544').GetName|Y] y [GetProvince('(int32)4536').GetName|Y] están gobernadas por la Casa #G de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#!,, ha llegado el momento de aprovechar estos éxitos tomando los territorios restantes al oeste que tienen una gran población de Bosporan.\n\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 
 01_bosporan_kingdom_task_3:0 "La batalla por el Borístenes"
 01_bosporan_kingdom_task_3_DESC:0 "Aunque los guerreros de los #G escitas#! y los #G iazigios#! nos resistirán ferozmente, no podemos permitir que la abrumadora mayoría de las tribus bárbaras nos impida asegurar nuestro reino. [ROOT.GetCountry.GetRuler.GetName] hará saber que consideramos que nuestras fronteras naturales se extienden hasta el #T río Borístenes#!.\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 
 01_bosporan_kingdom_task_4:0 "Sumisión de los jefes"
 01_bosporan_kingdom_task_4_DESC:0 "Con los escitas en retirada y nuestro flanco occidental asegurado, ahora podemos centrar nuestra atención en las tribus #E caucásicas#! al este y sus jefes tribales que gobiernan como pequeños reyes.\n\nNuestro gran gobernante #Y Leukon#! conquistó a los orgullosos #E sindios#! una vez antes, y si los caucásicos no desean la guerra con sus sucesores, entonces tendrán que someterse a nosotros pacíficamente.\n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 
 01_bosporan_kingdom_task_5:0 "Ampliar el puerto de agua caliente"
 01_bosporan_kingdom_task_5_DESC:0 "La ciudad portuaria de [GetProvince('(int32)4544').GetName|Y], gloriosamente capturada por nuestro gobernante #E Leukon I#! hace un par de generaciones, es una de nuestras posesiones más preciadas, ya que sus aguas no se congelan durante los duros inviernos del norte. Al expandir la infraestructura de Theodosia, nos aseguraremos de que los barcos mercantes del resto del mundo sigan visitando nuestras ciudades durante todo el año.\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 
 01_bosporan_kingdom_task_6:0 "La batalla de Gorgippia"
 01_bosporan_kingdom_task_6_DESC:0 "Desafortunadamente para nosotros, las aguas del #G Pontus Euxinus#! están infestadas de piratas. Estos audaces bandidos incluso operan libremente desde uno de nuestros territorios, [GetProvince('(int32)4565').GetName|Y], y se dice que hay mucho botín escondido detrás de los muros de la ciudad.\n\n[ROOT.GetCountry.GetRuler.GetName] ha decidido que esta situación ha durado demasiado. Necesitamos proteger nuestros intereses económicos de estos cobardes asaltantes que no respetan nuestras leyes. El [ROOT.GetCountry.GetRulerTitle] ha ordenado que se construya una gran flota, ya que [ROOT.GetCountry.GetRuler.GetSheHe] planea lanzar un atrevido ataque contra los piratas de Gorgippia con la esperanza de apoderarse de su riqueza.\n\n#Y Esto iniciará una cadena de eventos donde nuestro [ROOT.GetCountry.GetRulerTitle] liderará un ataque personal contra los piratas.#!\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 
 01_bosporan_kingdom_task_7:0 "Exportaciones atenienses"
 01_bosporan_kingdom_task_7_DESC:0 "Hace mucho tiempo, nuestro líder #E Leukon I#! concedió a los ciudadanos de [GetProvince('(int32)416').GetName|Y] ciertos privilegios comerciales, ya que los habitantes del Ática no tienen la suerte de contar con un excedente de grano @grain! como nosotros y sus comerciantes siempre buscan un suministro constante de alimentos.\n\nAhora que tenemos la infraestructura en [GetProvince('(int32)4544').GetName|Y] para exportar todo el año, [ROOT.GetCountry.GetRuler.GetName] desea renovar el entendimiento que una vez disfrutamos con los atenienses.\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 
 01_bosporan_kingdom_task_8:0 "Los piratas de Pitius"
 01_bosporan_kingdom_task_8_DESC:0 "En la misión de [ROOT.GetCountry.GetRuler.GetHerHis] para expulsar a los bandidos y asaltantes del #G Pontus Euxinus#!,, el [ROOT.GetCountry.GetRulerTitle] del [ROOT.GetCountry.GetName|F] ha jurado eliminar el refugio pirata ubicado en [GetProvince('(int32)1743').GetName|Y]. Los piratas de Pitiusa han amenazado durante mucho tiempo las costas que conducen a [GetProvince('(int32)4563').GetName|Y], pero su hora está cerca.\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 
 01_bosporan_kingdom_task_9:0 "Bósforo cimerio"
 01_bosporan_kingdom_task_9_DESC:0 "Con ambos lados del #Y Bósforo de Cimmeria#! firmemente bajo control, [ROOT.GetCountry.GetRuler.GetName] ahora ha centrado [ROOT.GetCountry.GetRuler.GetHerHis] la atención en la construcción de las ciudades a ambos lados de este importante cuerpo de agua.\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 
 01_bosporan_kingdom_task_10:0 "El Hierro De [GetProvince('(int32)4549').GetName]"
 01_bosporan_kingdom_task_10_DESC:0 "La ciudad de [GetProvince('(int32)4549').GetName|Y] produce hierro de excelente calidad @iron!, y sería prudente hacer todo lo posible para ampliar nuestra producción. Nuestros ejércitos merecen estar equipados únicamente con lo mejor, y los herreros del [ROOT.GetCountry.GetName|F] están listos y esperando para forjar las armas que nos conquistarán. ¡victoria!\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 
 01_bosporan_kingdom_task_11:0 "La cadena de plata"
 01_bosporan_kingdom_task_11_DESC:0 "Nuestros ingenieros militares han propuesto que construyamos una enorme cadena a lo largo del #G Bósforo cimerio#!, que controlará el flujo de tráfico que entra y sale del #Y Palus Maeotica#!.\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 
 01_bosporan_kingdom_task_12:0 "Domando a Tanais"
 01_bosporan_kingdom_task_12_DESC:0 "Ubicada dentro de las aguas fétidas de las #G Marismas de Maeotiana#! al norte, [GetProvince('(int32)4557').GetName|Y] ha seguido siendo durante mucho tiempo un faro de luz y civilización en la región, a pesar de su clima insalubre. Pero no podemos permitir que la oscuridad y el fango mantengan alejados a nuestros ingenieros; debemos construir sobre sus sólidos cimientos y crear la ciudad más importante dentro de la provincia de #G Bosproranum#! - un lugar digno de Bosporan colonos.\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 
 01_bosporan_kingdom_task_13:0 "El mar en paz"
 01_bosporan_kingdom_task_13_DESC:0 "Completemos el buen trabajo que #E Leukon I#! comenzó y acabemos con el flagelo del bandolerismo dentro del #G Pontus Euxinus#! de una vez por todas. No importa dónde se encuentren, destruiremos los refugios de piratas a lo largo de las costas y traeremos paz y prosperidad a las rutas comerciales.\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 
 01_bosporan_kingdom_task_14:0 "Arqueros a caballo escitas"
 01_bosporan_kingdom_task_14_DESC:0 "En la memoria reciente, ha habido muchas ocasiones en las que hemos tenido que depender de la mano de obra de los #Y escitas#! y los #Y sármatas#! para resolver nuestras disputas. ¿Quién de los que viven entre nosotros no recuerda las guerras civiles de #E Eumelo#! y la carnicería que causaron sus arqueros a caballo? La ayuda de los guerreros bárbaros resultó indispensable en nuestro momento de necesidad.\n\nAhora que [GetProvince('(int32)4557').GetName|Y] se ha convertido en una auténtica ciudad del Bósforo, se han enviado mensajeros al norte, a las estepas, por orden de [ROOT.GetCountry.GetRuler.GetName]. Nuestro [ROOT.GetCountry.GetRulerTitle] necesita arqueros a caballo y está dispuesto a pagar una buena suma para obtener los servicios de dichos jinetes.\n\n\n\n\n\n\n\n\n\n@persia_mil11!"
 
 01_bosporan_kingdom_task_15:0 "La ira del tirano"
 01_bosporan_kingdom_task_15_DESC:0 "#R Este evento iniciará una #E Guerra Civil#!.#!\n\nUn hombre que dice ser hijo de #Y Prytanis Spartokides#!, el hermano rebelde que fue derrotado por #Y Eumelus Spartokides#! hace algunos años en la #G Batalla del lago Maeotis#!, ha reunido clandestinamente apoyo y está intentando derrocar a [ROOT.GetCountry.GetRuler.GetName|Y]!\n\nPrytanis ha salido del exilio al frente de un ejército #T siraciano#! y promete a sus hombres que podrán saquear [ROOT.GetCountry.GetCapital.GetName|Y] si pueden ayudarlo a derrotar. [ROOT.GetCountry.GetRuler.GetFirstName|Y].\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 
 01_bosporan_kingdom_task_16:0 "Bósforo tracio"
 01_bosporan_kingdom_task_16_DESC:0 "Aunque los [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] han tenido éxito en sus esfuerzos por expulsar a los piratas del #G Pontus Euxinus#!,, todavía hay algunos sinvergüenzas que están causando problemas en nuestras aguas, y se sabe que están lanzando sus incursiones desde [GetProvince('(int32)248').GetName|Y].\n\nAunque las ciudades en las costas del #G Propontis#! están enojadas por nuestra presencia en sus aguas, [ROOT.GetCountry.GetRuler.GetName] no se ha dejado intimidar por sus amenazas y ha prometido prender fuego a la guarida pirata de Myrleia.\n\n\n\n\n\n\n\n\n\n@italic_mil22!"
 
 01_bosporan_kingdom_task_17:0 "El Imperio del Bósforo"
 01_bosporan_kingdom_task_17_DESC:0 "¿Quién puede negar que los #Y [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#! son los amos indiscutibles del #G Ponto Euxino#!? Gobernando desde su majestuosa capital de [ROOT.GetCountry.GetCapital.GetName|T], han traído una era de paz y prosperidad al #T Mar Hospitalario#!.\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 
 01_bosporan_kingdom_task_18:0 "Granero del Bósforo"
 01_bosporan_kingdom_task_18_DESC:0 "Hay muchos barcos griegos que viajan a nuestro reino para obtener alimentos para sus hambrientos ciudadanos, ya que los habitantes de [ROOT.GetCountry.GetName|F] tienen la suerte de contar con una abundancia de grano y pescado. No solo debemos proporcionar maíz y carne a nuestra propia gente, sino que debemos asegurarnos de que haya un excedente para exportar al extranjero.\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 
 01_bosporan_kingdom_task_19:0 "Ciudadanos de las estepas"
 01_bosporan_kingdom_task_19_DESC:0 "Aunque hemos cruzado espadas con los #Y escitas#! y los #Y sármatas#! muchas veces en nuestra historia, no se puede negar que muchos de ellos viven dentro del [ROOT.GetCountry.GetName|F]: son nuestros vecinos y socios, así como enemigos ocasionales.\n\nLa pregunta para [ROOT.GetCountry.GetRuler.GetName] es si estos son o no. Los barbaroi merecen integrarse en nuestra sociedad; muchos que viven dentro de [ROOT.GetCountry.GetCapital.GetName|Y] ven la coexistencia como inevitable, mientras que otros instan a [ROOT.GetCountry.GetRuler.GetFirstName] a resistir estas presiones y conservar las virtudes tradicionales del Bósforo.\n\n#Y Nuestro [ROOT.GetCountry.GetRulerTitle] decidirá si concede o no a los escitas y sármatas#! #T Ciudadano Derechos.#!\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 
 01_bosporan_kingdom_task_20:0 "Traerlo todo de vuelta a casa"
 01_bosporan_kingdom_task_20_DESC:0 "Es bien sabido que nuestros antepasados ​​vinieron de la ciudad de [GetProvince('(int32)1973').GetName|Y] en las costas del #G Mare Icarium#!,, ya que los milesios alguna vez fueron muy activos en el establecimiento de colonias a lo largo de todo el #G Pontus Euxinus#!.\n\nPolitical. La agitación y las oportunidades económicas enviaron a nuestros abuelos al norte hace mucho tiempo, pero ha llegado el momento de que recuperemos nuestra antigua patria.\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 
 01_bosporan_kingdom_task_21:0 "Asegurando el paso del buey"
 01_bosporan_kingdom_task_21_DESC:0 "La amante de Zeus, Ío, que engendró el linaje de Hércules, cruzó aquí hacia Asia en forma bovina, y por ello le dio el nombre de #E Bósforo#!. Este estrecho controla gran parte del comercio en la región, y asegurarlo sería una gran bendición para la gente del [ROOT.GetCountry.GetName].\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
 01_bosporan_kingdom_task_22:0 "Hegemón del mar hospitalario"
 01_bosporan_kingdom_task_22_DESC:0 "Económica y políticamente, el [ROOT.GetCountry.GetName] puede convertirse en una potencia invencible si controlara todo el #G Pontus Euxinus#!,, siendo el único que decide sobre los envíos, el tráfico de personal y los asuntos militares. Si el mar se convirtiera en el lago personal de [ROOT.GetCountry.GetRuler.GetName|Y], el trono y el legado de #G Eumelus#! serían superados por el poderoso [ROOT.GetCountry.GetRulerTitle].\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 
 01_bosporan_kingdom_task_23:0 "Puertos del Ponto Euxino"
 01_bosporan_kingdom_task_23_DESC:0 "Ahora que los piratas han sido expulsados ​​del #E Pontus Euxinus#! como los perros que son, ha llegado el momento de que construyamos puertos y bahías en nuestras ciudades y asentamientos. Ahora somos los amos indiscutibles del mar y deberíamos tener la infraestructura para respaldar tan audaces afirmaciones.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 
 01_bosporan_kingdom_task_24:0 "Comercio teodosiano"
 01_bosporan_kingdom_task_24_DESC:0 "Nuestra ciudad de [GetProvince('(int32)4544').GetName|Y] es la ciudad comercial más grande de todo el #G Pontus Euxinus#!, y los comerciantes extranjeros navegarán a nuestros puertos desde lugares tan lejanos como [GetProvince('(int32)516').GetName|T] y [GetProvince('(int32)3256').GetName|T] en busca de acuerdos. Este es el resultado directo de los esfuerzos de [ROOT.GetCountry.GetRuler.GetName|Y] para aumentar la infraestructura naval del famoso puerto de Theodosia, y en los últimos años se ha llevado a cabo una campaña de construcción masiva para apoyar el crecimiento explosivo de comercio.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 
 01_bosporan_kingdom_task_25:0 "La Liga del Bósforo"
 01_bosporan_kingdom_task_25_DESC:0 "En los días antes de que nuestro antepasado #Y Spartokos#! tomara el poder de los débiles y corruptos #R Archaeanactids#!, las diversas ciudades-estado libres de #G Taurica#! se unieron en ligas defensivas para protegerse entre sí. [ROOT.GetCountry.GetRuler.GetName|Y] está rumiando la idea de proclamar otra #T 'Liga del Bósforo'#! en un intento de atraer a otros a nuestra causa.\n\nNo se equivoquen, el Bósforo [ROOT.GetCountry.GetRulerTitle] no tiene planes de renunciar a ningún poder, pero usar el nombre de la antigua liga nos otorgará prestigio y honor.\n\n#Y Nuestra#! #G Bandera#! #Y#! #G Patrimonio Nacional#! #Y cambiarán.#!\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 
 01_bosporan_kingdom_task_26:0 "Esclavos de las estepas"
 01_bosporan_kingdom_task_26_DESC:0 "En la desembocadura del #E Palus Maeotica#!, se encuentra la ciudad de [GetProvince('(int32)4557').GetName|Y] en sus pantanos fríos y lluviosos, y es el último puesto de avanzada de la civilización antes de encontrarse con la estepa interminable. Como tal, es un lugar natural para que los #E griegos#! y los #E escitas#! realicen negocios, y se ha hecho conocido como un centro comercial donde uno puede adquirir esclavos.\n\n\n\n\n\n\n\n\n\n\n@italic_mil23!"
 
 
 #Tooltips
 
 bosporan_needs_civic_investments_tt:0 "Necesitamos la #T Inversiones Empresariales Atractivas#! Provincia Inversión en la provincia de #Y Taurica#!."
 bosporan_needs_military_investments_tt:0 "Necesitamos la #T Fortificar la Provincia#! Inversión Provincial en la provincia de #Y Bosproranum#!."
 bosporan_kingdom_task_4_tt:0 "#G Maeotia#! #Y#! #G Sindica#! #Y debe tener al menos#! #T 75 Opinión#! #Y de nosotros.#!"
 bosporan_missions_task_6_tt:0 "Ten una única pila naval con al menos #Y 30#! barcos ubicados en la casilla marítima resaltada #Y Pontus Euxinus#!."
 bosporan_missions_task_15_tt:0 "Tener una sola pila naval con al menos #Y 50#! barcos ubicados en la casilla marina #Y Propontis#! resaltada."
 bosporan_missions_task_18_tt:0 "Necesitamos construir al menos #T 5 Asentamientos Agrícolas#! dentro de nuestros territorios."
 randomized_rewards_for_sacking_pirate_havens_tt:0 "Cada vez que una unidad utilice la habilidad #Y Root Out Pirates#!, recibiremos una cantidad aleatoria de #T Oro#! y 1 #! #G Esclavo@slaves!#! en nuestra capital."
 leader_receives_good_military_trait_tt2:0 "Nuestro Gobernante recibirá #G 2#! y #G 6#! marcial."
 me_bosporan_6_tooltip2:0 "#R ¡Nuestro gobernante lanzará un atrevido ataque contra el campamento pirata!#!"
 bosporan_claims_on_pirates_worldwide_tt:0 "Recibiremos reclamos en cada territorio que tenga un #! #Y Pirate Haven#!."
 
 
 #Modifiers
 BPK2_FLAG:0 "El glorioso estandarte púrpura del Imperio del Bósforo"
 theodosia_warm_water_port_mod:0 "Puerto de Teodosia"
 desc_theodosia_warm_water_port_mod:0 "El puerto de aguas cálidas de Theodosia garantiza que los envíos puedan llegar a nuestro país durante todo el año, incluso cuando el frío del invierno azota la tierra."
 bosporan_antipiracy_mod:0 "El legado de Eumelus"
 desc_bosporan_antipiracy_mod:0 "Eumelo, uno de los mayores basileos del Bósforo, no toleraba la piratería en el Ponto Euxino y libraba guerras contra piratas y bandidos. Los habitantes del Bósforo han adoptado esta filosofía y se guían por sus principios."
 BOSPORAN_EMPIRE_NAME:0 "Imperio del Bósforo"
 BARBARIAN_NICKNAME:0 "'El Bárbaro'"
 bosporan_iron_of_pantikapaion_mod:0 "Hierro de Pantikapaion"
 desc_bosporan_iron_of_pantikapaion_mod:0 "El hierro producido en la ciudad de Pantikapaion es de una calidad exquisita, y muchos viajeros vienen del mundo civilizado y de las estepas incivilizadas a las fundiciones de los herreros del Bósforo con la esperanza de comprar el metal refinado para sí mismos."
 silver_chain_cimmerian_bosporus_mod:0 "La cadena de plata del Bósforo de Cimeria"
 desc_silver_chain_cimmerian_bosporus_mod:0 "Los bosporanos han construido una sólida cadena que conecta los territorios de Pantikapaion y Phanagoria a través del Bósforo cimerio."
 bosporan_big_farms_mod:0 "Gran Granero"
 desc_bosporan_big_farms_mod:0 "Los esfuerzos de los habitantes del Bósforo por ampliar su producción agrícola se han centrado en las ciudades portuarias de Táurica, donde se han construido grandes graneros."
 bosporan_statue_in_athens_mod:0 "Estatua de un basileus del Bósforo"
 desc_bosporan_statue_in_athens_mod:0 "Como forma de honrar a los habitantes del Bósforo que alimentan su ciudad con granos, los ciudadanos de Atenas han erigido una estatua de su gobernante en el ágora principal."
 bosporan_revolter_name:0 "República del Bósforo de Cimeria"
 bosporan_big_iron_mod:0 "Fundiciones de Pantikapaion"
 desc_bosporan_big_iron_mod:0 "Los habitantes del Bósforo han hecho grandes esfuerzos para aumentar la producción de hierro en su ciudad de Pantikapaion, y el metal que se produce en las fundiciones de aquí es el mejor de la región."
 cimmerian_bosporus_mod:0 "Bósforo cimerio"
 bosporan_scythian_citizens_mod:0 "Arqueros a caballo escitas"
 desc_bosporan_scythian_citizens_mod:0 "Los habitantes del Bósforo luchan con arqueros a caballo junto con sus levas tradicionales, combinando tácticas helénicas con la movilidad del jinete estepario con un efecto devastador."
 bosporan_sarmatian_citizens_mod:0 "Caballería pesada sármata"
 desc_bosporan_sarmatian_citizens_mod:0 "Los sármatas son dueños de la estepa y controlan vastas franjas de territorio que se extienden mucho más allá de nuestros mapas y conocimientos, y su control de sus caballos no tiene rival."
 bosporan_scythian_and_sarmatian_citizens_mod:0 "Jinetes bárbaros"
 desc_bosporan_scythian_and_sarmatian_citizens_mod:0 "Los bosporanos han adoptado las tradiciones militares de los nómadas con efectos devastadores, utilizando tanto arqueros a caballo escitas como caballería pesada sármata en sus ejércitos."
 bosporan_civil_war_good_modifier:0 "Espíritu de los Spartakids"
 desc_bosporan_civil_war_good_modifier:0 "El pueblo del Bósforo se ha unido para defender el país frente al desastre y la guerra."
 tanais_jewish_district_mod:0 "Barrio Judío"
 desc_tanais_jewish_district_mod:0 "La ciudad de Tanais tiene un famoso barrio judío que es un faro de su cultura en el extremo norte."
 create_merc_state_price_cost_modifier:0 "Crear modificador de costo de precio de estado de Merc"
 black_sea_bosporan_hegemon:0 "Hegemón del Mar Hospitalario"
 desc_black_sea_bosporan_hegemon:0 "Los incomparables bosporanos controlan el vasto Ponto Euxino como si fuera suyo, y son, sin lugar a dudas, el Hegemón del Mar Hospitalario."
 
 #Treasures
 treasure_pirate_barbarian_skull:0 "Cráneo pirata bárbaro Rhyton"
 treasure_pirate_barbarian_skull_desc:0 "El cráneo de un pirata bárbaro que luchó contra el gobernante del Bósforo se convirtió en un ritón y se utiliza en ceremonias que honran los logros marciales de la dinastía Espartokid."
 
 #Events
 me_bosporan_1_title:0 "$01_bosporan_kingdom_task_1$"
 me_bosporan_1_desc:0 "Mi [ROOT.GetCountry.GetRulerTitle], hemos reclamado oficialmente la provincia de [ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName] como nuestra. Todo lo que te queda por hacer es dar la orden y nuestros soldados expulsarán a nuestros enemigos del campo de batalla. Un día, gobernaremos toda la región de Taurica, pero lo primero es lo primero: la provincia debe ser nuestra."
 me_bosporan_1.a:0 "Tomar Taurica es solo el comienzo de lo que debemos hacer"
 me_bosporan_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_1$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_2_title:0 "$01_bosporan_kingdom_task_2$"
 me_bosporan_2_desc:0 "Las ricas ciudades de [GetProvince('(int32)4536').GetName] y [GetProvince('(int32)4538').GetName] han caído en nuestras manos, aportando una experiencia militar muy necesaria a [ROOT.GetCountry.GetRuler.GetName] y ganándose [ROOT.GetCountry.GetRuler.GetHerHim] el respeto de nuestras tropas.\n\nSin embargo, los asedios de las ciudades costeras no estuvieron exentos de contratiempos. Armas y alimentos que se rumoreaba que provenían de [GetProvince('(int32)207').GetName], los antiguos fundadores de la colonia que se convirtió en [GetProvince('(int32)4538').GetName], fueron introducidos de contrabando en la ciudad en varios puntos, extendiendo el asedio por semanas, y buenos hombres del Bósforo murieron luchando tratando de tomar las murallas.\n\nCon la costa occidental de [ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName] ahora en nuestras manos, algunos de nuestros asesores militares han presionado a la [ROOT.GetCountry.GetRulerTitle] para lanzar una invasión de las ciudades helénicas del noroeste. [GetProvince('(int32)4529').GetName], [GetProvince('(int32)4525').GetName] y [GetProvince('(int32)4526').GetName] son los nombres que más se han mencionado en los consejos de guerra, pero [ROOT.GetCountry.GetRuler.GetFirstName] tiene otros planes en [ROOT.GetCountry.GetRuler.GetHerHis] mente."
 me_bosporan_2.a:0 "Preparemos nuestras levas y barcos para la invasión occidental."
 me_bosporan_2.b:0 "Debemos castigar a la ciudad madre de [GetProvince('(int32)4538').GetName] - navegamos hacia el sur"
 me_bosporan_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_2$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_3_title:0 "$01_bosporan_kingdom_task_3$"
 me_bosporan_3_desc:0 "En los últimos años, los #E escitas#! se han convertido en una verdadera amenaza para la gente de [ROOT.GetCountry.GetName] y los enemigos jurados de [ROOT.GetCountry.GetRuler.GetName], que ha prometido empujar a sus ejércitos hacia el norte y lejos de nuestras ciudades.\n\nAhora que [ROOT.GetCountry.GetRuler.GetSheHe] ha demostrado a nuestros soldados que podemos expulsar fácilmente a los escitas del bosques de #E Taurica#!, el [ROOT.GetCountry.GetRulerTitle] quiere seguir atacando - [ROOT.GetCountry.GetRuler.GetFirstName] no estará satisfecho hasta que los habitantes del Bósforo hayan tomado tierras hasta el #E río Borístenes#!, y tal vez incluso más allá, una tarea trascendental que refleja el alcance de la [ROOT.GetCountry.GetRuler.GetHerHis] ambición."
 me_bosporan_3.a:0 "Las aguas del Borysthenes constituirán una buena frontera natural."
 me_bosporan_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_3$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_4_title:0 "$01_bosporan_kingdom_task_4$"
 me_bosporan_4_desc:0 "A medida que se corre la voz por [ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName] de los ejércitos triunfantes de [ROOT.GetCountry.GetRuler.GetName], las #E tribus caucásicas#! de nuestro este ciertamente se han dado cuenta y han tratado de cultivar relaciones amistosas con los [ROOT.GetCountry.GetName]. Se han intercambiado obsequios y cortesías mutuamente, y cuando un día los mensajeros del Bósforo de [ROOT.GetCountry.GetCapital.GetName] cabalgaron hasta sus campamentos y los invitaron a reunirse con los [ROOT.GetCountry.GetRulerTitle], los jefes tribales de [GetCountry('MAE').GetName] y [GetCountry('SND').GetName] acordaron abandonar sus hogares y visitarlos.\n\nLos bárbaros quedaron asombrados cuando entraron en la ciudad de los Espartokids, y se dice que caminaron por las calles boquiabiertos, mirando con asombro los magníficos edificios de mármol y las amplias avenidas de la capital. Abrumados por el poder y la fuerza del pueblo del Bósforo, se sintieron honrados cuando se reunieron con [ROOT.GetCountry.GetRuler.GetFirstName] esa misma noche y receptivos a las [ROOT.GetCountry.GetRuler.GetHerHis] palabras.\n\nHa habido muchas ocasiones en el pasado en las que nuestros soldados han marchado por las tierras de nuestro este y hemos atacado sus asentamientos en los bosques y pantanos de #E Maeocia#! innumerables veces; no les tememos y todos sabemos este hecho. Y así, cuando se propuso el vasallo como una forma de asegurar una paz eterna entre nuestros pueblos, los Jefes no dudaron, sino que se inclinaron ante [ROOT.GetCountry.GetRuler.GetFirstName] de inmediato. Los [ROOT.GetCountry.GetRulerTitle] del Bósforo los coronaron como #E Reyes Clientes#! a partir de ese momento, y prometieron que les esperaba un futuro glorioso como súbditos del [ROOT.GetCountry.GetName]."
 me_bosporan_4.a:0 "Será como dices, mi Señor."
 me_bosporan_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_4$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_5_title:0 "$01_bosporan_kingdom_task_5$"
 me_bosporan_5_desc:0 "Aunque los fuertes vientos del norte traen nieve y hielo a muchas de las ciudades de [ROOT.GetCountry.GetName] durante el invierno, los puertos de [GetProvince('(int32)4544').GetName] nunca se congelan, y este regalo divino de los dioses del mar permite que los barcos comerciales atraquen en nuestros puertos durante todo el año.\n\nNuestro pueblo no solo tiene acceso a los mejores productos comerciales de los famosos mercados y emporios de los poderosos imperios del sur, sino que nuestros cofres están llenos de monedas de oro y plata que nos traen los mercaderes que buscan comprar nuestros propios productos. Las hambrientas ciudades de los griegos compran nuestro grano y pescado, de los que tenemos en abundancia, y también pagan sumas extravagantes por nuestras pieles. La mayor parte del comercio de los bárbaros de la estepa también pasa en algún momento por nuestras manos, por lo que la idea de expandir el puerto de Theodosia fue del agrado de todos y nadie se opuso."
 me_bosporan_5.a:0 "Un puerto ampliado nos traerá oportunidades que nunca antes tuvimos"
 me_bosporan_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_5$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_6_title:0 "$01_bosporan_kingdom_task_6$"
 me_bosporan_6_desc:0 "Ahora que [ROOT.GetCountry.GetRuler.GetName] ha decidido cumplir los juramentos sagrados hechos por #E Eumelus#! y destruir a los piratas que interrumpen el comercio dentro del #E Pontus Euxinus#!, el [ROOT.GetCountry.GetRulerTitle] ha reunido una flota para atacar un campamento ilegal en las costas cerca de [GetProvince('(int32)4565').GetName].\n\nEn pocas horas Al salir del puerto, la marina del Bósforo descubrió el #E refugio de los piratas#!; los sinvergüenzas se habían instalado cerca de la frontera con [GetProvince('(int32)4566').GetName]. [ROOT.GetCountry.GetRuler.GetFirstName] inmediatamente pidió [ROOT.GetCountry.GetRuler.GetHerHis] armas y armaduras y les dijo a los hombres que se prepararan."
 me_bosporan_6.a:0 "¡Los atacaremos ahora! ¡Adelante, valientes guerreros, hacia la victoria!"
 me_bosporan_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_6$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_7_title:0 "$01_bosporan_kingdom_task_7$"
 me_bosporan_7_desc:0 "Durante muchos años, [GetCountry('PRY').GetName] gobernó al pueblo de [GetProvince('(int32)416').GetName] con puño de hierro, llegando incluso a controlar qué tipos de comercio y transacciones estaban permitidas dentro de los emporios de esa famosa ciudad. [GetCharacter('(int32)38').GetName], hijo de [GetCharacter('(int32)37').GetName], estaba personalmente a cargo de la importación de grano y la administró al azar durante muchos años, sin permitir que otros vendieran su comida a los ciudadanos, pero ahora está muerto.\n\nHace siglos, se sabía que el antepasado de [ROOT.GetCountry.GetRuler.GetName], #E Leukon#!, era amigo de los atenienses, amado por enviar grandes cantidades de grano a la ciudad y ganarse la eterna admiración de su gente, pero esta relación fue rota por los Antígonidas. Pero con Demetrio fuera de la ecuación, la cuestión de dónde comprará Atenea la harina para hornear su pan es nuestra, y los mensajeros de [ROOT.GetCountry.GetRuler.GetFirstName] lograron devolver nuestro grano a su mercado después de negociar con los magistrados de la ciudad.\n\nLos barcos atenienses parten de nuestros puertos cada pocos meses, sus bodegas abarrotadas a rebosar de ánforas llenas de trigo y miel, elementos vitales, y se informa que se ha erigido una estatua de [ROOT.GetCountry.GetRuler.GetFirstName] en el ágora de Atenea como una forma de honrar a nuestro [ROOT.GetCountry.GetRulerTitle]."
 me_bosporan_7.a:0 "Me siento honrado de escuchar esto y agradecido por la amistad de los atenienses."
 me_bosporan_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_7$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_8_title:0 "$01_bosporan_kingdom_task_8$"
 me_bosporan_8_desc:0 "Después de haber aprendido importantes lecciones en la #E Batalla de Gorgippia#!, [ROOT.GetCountry.GetRuler.GetName] acabó rápidamente con los piratas que vivían en una fortaleza abandonada en las costas de [GetProvince('(int32)1743').GetName]. No hubo resistencia digna de mención; los guerreros curtidos en batalla bajo el mando de los [ROOT.GetCountry.GetRulerTitle] no mostraron piedad hacia los bucaneros, sino que mataron hasta el último de ellos y prendieron fuego a sus destartaladas chozas.\n\nEn sus cortos años en el trono, #E Eumelo#! había tratado de limpiar el #E Pontus Euxinus#! de su plaga. De bandidos que deambulan por sus aguas, pero [ROOT.GetCountry.GetRuler.GetFirstName] ya ha superado los esfuerzos de [ROOT.GetCountry.GetRuler.GetHerHis] desafortunado predecesor. A pesar de [ROOT.GetCountry.GetRuler.GetHerHis] la creciente fama, el gobernante del Bósforo se apresura a elogiar a otros por sus esfuerzos para erradicar el flagelo de la piratería, afirmando que los impuestos son los que realmente merecen nuestro agradecimiento."
 me_bosporan_8.a:0 "Que el legado de Eumelo nos impulse a lograr grandes cosas"
 me_bosporan_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_8$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_9_title:0 "$01_bosporan_kingdom_task_9$"
 me_bosporan_9_desc:0 "[GetProvince('(int32)4549').GetName] y [GetProvince('(int32)4563').GetName] se encuentran a ambos lados del #E Bósforo Cimmerio#!, la masa de agua que separa las provincias de #E Taurica#! y #E Maeocia#!, y estas dos ciudades se han beneficiado durante mucho tiempo de su posición fortuita en el llamado #E Bósforo de Cimeria#!.\n\nCon puertos que pueden acceder fácilmente al #E Pontus Euxinus#! así como al #E Palus Maeotica#!, el comercio fluye naturalmente hacia los puertos de los Bósforos, y hacen fortuna comprando y vendiendo a griegos y escitas por igual. Gracias a los esfuerzos de los [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] para ampliar la infraestructura a ambos lados del cruce, ambas ciudades han crecido en riqueza y prestigio, lo que ha permitido a [ROOT.GetCountry.GetRuler.GetName] realizar más inversiones en el bienestar del país."
 me_bosporan_9.a:0 "Es mi deber como [ROOT.GetCountry.GetRulerTitle] construir grandes ciudades en el Bósforo."
 me_bosporan_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_9$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_10_title:0 "$01_bosporan_kingdom_task_10$"
 me_bosporan_10_desc:0 "El hierro de buena calidad @iron! es difícil de conseguir cuando se vive en las afueras del mundo civilizado, lo que hace que el metal producido en la ciudad de [GetProvince('(int32)4549').GetName] sea aún más raro y deseable para quienes viven en [ROOT.GetCountry.GetName].\n\nObtener hierro de alta calidad para los ejércitos siempre ha sido importante para [ROOT.GetCountry.GetRuler.GetName], quien se aseguró de que se reservaran fondos para construir molinos y fundiciones dentro de los muros de la ciudad. Los herreros del Bósforo trabajan muchas horas todos los días, y las armas letales que fabrican se entregan a los soldados o se cargan en barcos y se venden por una gran ganancia en el mercado."
 me_bosporan_10.a:0 "Debo asegurarme de que nuestros soldados estén preparados para la batalla."
 me_bosporan_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_10$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_11_title:0 "$01_bosporan_kingdom_task_11$"
 me_bosporan_11_desc:0 "Quienes visitan por primera vez las aguas del #E Bósforo Cimmerio#! suelen ser recibidos por una visión que al principio les confunde; una poderosa red de fortificaciones construidas en los diques a ambos lados del estrecho, con una enorme #E Cadena de Plata#! unida entre ellas. Esta llamada 'Cadena de Plata' que brilla intensamente bajo el sol en realidad está hecha de hierro de los molinos y fundiciones de [GetProvince('(int32)4549').GetName], y todos los barcos que intentan ingresar a los puertos de los Bósforos deben recibir permiso para pasar a los puertos que están bloqueados por esta cadena. \n\nNo hace falta decir que el contrabando de mercancías dentro y fuera de la región es casi imposible, aunque algunos tontos periódicamente lo intentan y fracasan. Miserablemente. Sin embargo, la mayoría de los comerciantes son hombres honorables y están dispuestos a pagar un poco más de impuestos para tener acceso a los mercados del #E Bósforo de Cimmerio#!."
 me_bosporan_11.a:0 "Pondré fin a la piratería y al contrabando en todo el [ROOT.GetCountry.GetName]"
 me_bosporan_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_11$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_12_title:0 "$01_bosporan_kingdom_task_12$"
 me_bosporan_12_desc:0 "Los esfuerzos de los habitantes del Bósforo por mejorar la ciudad de [GetProvince('(int32)4557').GetName] han sido un éxito rotundo, y han servido como puerta de entrada natural entre nuestro mundo y el de la estepa. Es habitual ver a los #E escitas#! y a los #E sármatas#! en nuestros mercados y lugares públicos, y aunque la ciudad está situada en el mismísimo borde del mundo civilizado, tiene una atmósfera cosmopolita que acoge a todos, independientemente de su religión, idioma o lugar de nacimiento.\n\nRecientemente, algunas de las principales familias judías que viven en [GetProvince('(int32)4565').GetName] presentaron una petición pidiendo que se les permitiera construir un distrito en Tanais. [ROOT.GetCountry.GetName] siempre ha mostrado amabilidad con los hebreos que viven en sus ciudades y, con el paso de los años, las comunidades judías en nuestras ciudades costeras han crecido."
 me_bosporan_12.a:0 "No se concederán privilegios"
 me_bosporan_12.b:0 "Concederé la petición de mis hermanos judíos: tenéis mi bendición."
 me_bosporan_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_12$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_13_title:0 "$01_bosporan_kingdom_task_13$"
 me_bosporan_13_desc:0 "Guiados por el #E Legado de Eumelus#! y su deseo de ver al #E Pontus Euxinus#! libre de piratas, los victoriosos [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] pueden finalmente afirmar que la tarea ha terminado. Los refugios piratas más notorios de la región han sido aniquilados, sus flotas quemadas hasta las cenizas y cualquier bandido que fue capturado vivo por los soldados de [ROOT.GetCountry.GetRuler.GetFirstName] fue crucificado: los bosporanos han dejado muy en claro que no tolerarán la piratería en sus aguas.\n\nLa fama de [ROOT.GetCountry.GetRuler.GetFirstName] sigue creciendo, a medida que se extiende la noticia de las audaces incursiones de [ROOT.GetCountry.GetRuler.GetHerHis] en los campamentos piratas en el extranjero. [ROOT.GetCountry.GetRulerTitle] se está ganando la reputación de ser un maestro marinero, uno que lucha por la justicia y la estabilidad."
 me_bosporan_13.a:0 "Todo lo que has oído sobre mí es verdad."
 me_bosporan_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_13$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_14_title:0 "$01_bosporan_kingdom_task_14$"
 me_bosporan_14_desc:0 "Desde nuestro punto de observación en la ciudad de [GetProvince('(int32)4557').GetName], que sirve como bastión de la cultura del Bósforo en una región por lo demás bárbara, [ROOT.GetCountry.GetRuler.GetName] ha ampliado nuestras conexiones con los #E sármatas#! que viven al norte más que nunca antes en nuestra historia.\n\nCuando se escuchó en la estepa el llamado de que los ejércitos de los [ROOT.GetCountry.GetName] pagarían buen oro por arqueros a caballo dispuestos a luchar junto a nuestras levas, un hombre llamado [SCOPE.sCharacter('conan_the_barbarian').GetName], un nómada cimerio con espada en mano, cabello oscuro y expresión hosca, un destructor y asesino, llegó a Tanais al frente de un ejército.\n\nEste cimerio reveló que su deidad, un dios sombrío de las montañas que ama la batalla y desdeña la debilidad, se apareció en un sueño y le dijo que trajera a su ejército a Tanais, porque el destino de [SCOPE.sCharacter('conan_the_barbarian').GetFirstName] se encontraría dentro de los [ROOT.GetCountry.GetName]."
 me_bosporan_14.a:0 "Por fin, un hombre que entiende el enigma del acero..."
 me_bosporan_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_14$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_15_title:0 "$01_bosporan_kingdom_task_15$"
 me_bosporan_15_desc:0 "Terribles noticias llegaron a [ROOT.GetCountry.GetCapital.GetName]: hay un usurpador que dice ser el hijo bastardo de #E Prytanis#!, uno de los hijos de #E Paerisades#! que luchó contra #E Eumelus#! por el trono del Bósforo, y ha iniciado una guerra civil dentro de [ROOT.GetCountry.GetName].\n\nHay muchos que secretamente envidian los éxitos de [ROOT.GetCountry.GetRuler.GetName] y [ROOT.GetCountry.GetRuler.GetHerHis], y así, cuando un tirano emergió del desierto a la cabeza de un masivo ejército #E Sarmatian#! y clamó justicia contra su padre asesinado, encontró una audiencia receptiva.\n\nNadie sabe con certeza si este rebelde Prytanis es en realidad un #E Spartokid#! o no, pero muchos creen que es cierto, por lo que el punto es discutible. - muchos de nuestros parientes han apoyado a este guerrero y se han declarado a favor de la #E República del Bósforo Cimerio#!."
 me_bosporan_15.a:0 "¡Entonces los mataré a todos! ¡No habrá piedad para los traidores!"
 me_bosporan_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_15$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_16_title:0 "$01_bosporan_kingdom_task_16$"
 me_bosporan_16_desc:0 "Los piratas de [GetProvince('(int32)248').GetName] no intentaron huir cuando las flotas del Bósforo entraron en la #E Propontis#!,, sino que salieron con valentía a enfrentarse a nuestros barcos y murieron con honor.\n\nNuestros marineros destruyeron su puerto, pero los informes que trajeron de vuelta a [ROOT.GetCountry.GetRuler.GetName] fueron inquietantes. Parece que los funcionarios que vivían en las ciudades de [GetProvince('(int32)1453').GetName] y [GetProvince('(int32)240').GetName] habían pagado grandes sumas a estos bandidos para que hostigaran a nuestros barcos; estos piratas entraron en nuestras aguas con la bendición de los #E griegos propónticos#!, que han tratado de sacar provecho a nuestras expensas."
 me_bosporan_16.a:0 "Si tenemos que tomar el Bósforo para darles una lección, ¡lo haremos!"
 me_bosporan_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_16$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_17_title:0 "$01_bosporan_kingdom_task_17$"
 me_bosporan_17_desc:0 "Desde orígenes humildes, el pueblo del #E Reino de Bósforo#! ascendió a alturas inimaginables bajo el liderazgo de la dinastía Espartokida, que no sólo ha expulsado el flagelo de la piratería de las aguas del #E Ponto Euxinus#!, sino que ha establecido un poderoso imperio en el norte que abarca tanto a griegos como a escitas. Los [ROOT.GetCountry.GetRulerTitle] indiscutibles de un reino que se extiende a caballo entre el mundo civilizado y el bárbaro, los bosporanos han logrado encontrar su propio camino, recorriendo un camino intermedio que se mantiene fiel a sus propias tradiciones e ideales.\n\nLa gran metrópolis de [ROOT.GetCountry.GetCapital.GetName] atrae a hombres de todos los rincones de la tierra, que viajan por tierra y mar para visitar los mercados y emporios del [ROOT.GetCountry.GetName], y todos se maravillan al saber que estas magníficas hazañas fueron logradas por los descendientes de un usurpador mercenario. Los [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] son una de las familias más famosas y poderosas del mundo, y su Imperio es incomparable en fuerza y ​​gloria."
 me_bosporan_17.a:0 "¡Si Espartaco pudiese ver lo que sus hijos eran capaces de lograr!"
 me_bosporan_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_17$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_18_title:0 "$01_bosporan_kingdom_task_18$"
 me_bosporan_18_desc:0 "Los dioses han concedido a nuestro pueblo muchos regalos, y tenemos la bendición de tener aguas repletas de peces, campos de cereales maduros y rebaños de ganado, lujos que no todos comparten. Al darse cuenta de la importancia de ser buenos administradores de la tierra, [ROOT.GetCountry.GetRuler.GetName] construyó muchas granjas por todo [ROOT.GetCountry.GetName] y un granero grande en la importante ciudad de [GetProvince('(int32)4544').GetName], y ahora nuestras cosechas son las mejores que jamás han sido.\n\nNo solo tendremos más que suficiente comida para nuestros propios compatriotas, sino que incluso podríamos vender nuestro excedente en mercados extranjeros; somos verdaderamente afortunados."
 me_bosporan_18.a:0 "Daremos un buen uso a estos graneros."
 me_bosporan_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_18$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_19_title:0 "$01_bosporan_kingdom_task_19$"
 me_bosporan_19_desc:0 "Las tribus que viven a nuestro alrededor han sido parte de la vida de Bosporan durante mucho tiempo; nuestros pueblos se han casado entre sí, han compartido comidas juntos y algunos incluso adoran a los mismos dioses; a pesar de nuestras diferencias, hay mucho que tenemos en común y los #E escitas#!,, para bien o para mal, son sin duda parte del tejido de nuestra sociedad.\n\nA la luz de este hecho, algunos de los asesores de [ROOT.GetCountry.GetRuler.GetName] han propuesto que extendamos los derechos de ciudadanía a algunas de las diferentes culturas que viven junto a nosotros. Hay algunos de nuestros parientes que albergan odio en sus corazones hacia los miembros de las tribus y no quieren esto, alegando que los norteños han asesinado a nuestra gente y han asaltado nuestras tierras, pero para ser justos, nosotros les hemos hecho lo mismo a ellos; esta podría ser una oportunidad para un nuevo comienzo entre nosotros y la gente que hemos subyugado."
 me_bosporan_19.a:0 "Concederé a los escitas los derechos de los ciudadanos."
 me_bosporan_19.b:0 "Los sármatas merecen privilegios dentro del [ROOT.GetCountry.GetName]"
 me_bosporan_19.c:0 "Tanto los escitas como los sármatas son dignos de este honor."
 me_bosporan_19.d:0 "¡Esta tierra siempre pertenecerá a los bosporanos y sólo a los bosporanos!"
 me_bosporan_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_19$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_20_title:0 "$01_bosporan_kingdom_task_20$"
 me_bosporan_20_desc:0 "Una vez que se supo que [ROOT.GetCountry.GetRuler.GetName] planeaba conquistar [GetProvince('(int32)1973').GetName] para [ROOT.GetCountry.GetName], miles de hombres llegaron a [ROOT.GetCountry.GetCapital.GetName] en los meses siguientes: voluntarios de las provincias que deseaban unirse a nuestras guerras y cambiar su fortuna personal. Estos soldados estaban motivados por el lucro, el saqueo y el deseo de saquear ciudades sin importar quién viviera allí, griego o escita: la riqueza y la historia de Mileto son conocidas por todos, y hay muchos que arriesgarían sus vidas por la oportunidad de saquear sus ricos hogares y templos."
 me_bosporan_20.a:0 "Si no se someten pacíficamente, ¡tomaré [GetProvince('(int32)1973').GetName] por la fuerza!"
 me_bosporan_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_bosporan_kingdom_task_20$#!' $mission_completed_tooltip_2$"
 
 me_bosporan_21_title:0 "Atacando a los piratas"
 me_bosporan_21_desc:0 "Los soldados del Bósforo pudieron desembarcar sin que nadie los desafiara, ya que la armada pirata se encontraba en una incursión y no pudo defender el desembarco. Mientras los soldados se reunían alrededor de [ROOT.GetCountry.GetRuler.GetName], [ROOT.GetCountry.GetRulerTitle] agarró la espada de [ROOT.GetCountry.GetRuler.GetHerHis] y la levantó muy por encima de la cabeza de [ROOT.GetCountry.GetRuler.GetHerHis]."
 me_bosporan_21.a:0 "Ruego a los dioses que nos concedan la victoria."
 me_bosporan_21.b:0 "¡Destruiré a todos los que se me opongan!"
 me_bosporan_21_tooltip:0 "#Y La cadena de eventos continuará.#!"
 
 me_bosporan_22_title:0 "¡Emboscado!"
 me_bosporan_22_desc:0 "Cuando los soldados de Bosporan entraron en el #E refugio pirata#!, estaba sorprendentemente vacío: ¿estaban todos los bandidos en una redada? ¿Por qué habrían dejado su campamento indefenso?\n\nEl zumbido de una flecha que pasó silbando por la cabeza de [ROOT.GetCountry.GetRuler.GetName] respondió a esa pregunta, y el sonido del carnyx dividió el aire cuando otra andanada de misiles siguió a la primera.\n\n'¡Es una emboscada!' gritó el [ROOT.GetCountry.GetRulerTitle], sacando el arma [ROOT.GetCountry.GetRuler.GetHerHis] y agachándose detrás de una pared para cubrirse. Escudriñando desesperadamente el horizonte, [ROOT.GetCountry.GetRuler.GetFirstName] vio desde dónde atacaban los asaltantes y maldijo: estaban en la cima de una colina cercana."
 me_bosporan_22.a:0 "¡Ordenen a los hombres que carguen! ¡Luchamos por Eumelus!"
 me_bosporan_22.b:0 "¡Nadie puede superarme en maniobras en el campo de batalla!"
 me_bosporan_22_tooltip:0 "La opción está disponible debido al alto puntaje marcial de nuestro Gobernante."
 
 me_bosporan_23_title:0 "El duelo"
 me_bosporan_23_desc:0 "A pesar de estar sorprendidos y desorientados al principio, los soldados de Bosporan pudieron rápidamente tomar el control de la situación, lanzando valientemente un ataque que dispersó a los cobardes piratas. El aire se llenó con los gritos de los hombres moribundos, y la espada de [ROOT.GetCountry.GetRuler.GetName] estaba mojada con la sangre de asaltantes y sinvergüenzas.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] acababa de entrar en la puerta de un gran edificio, cuando un gran bárbaro apareció con un hacha de guerra enorme. Se intercambiaron golpes, y ambos guerreros terminaron en el suelo, con los brazos entrelazados en una lucha desesperada mientras cada uno intentaba ganar influencia sobre el otro.\n\nPor primera vez en mucho tiempo, [ROOT.GetCountry.GetRuler.GetFirstName] recordó cómo se sentía el miedo."
 me_bosporan_23.a:0 "Estoy casi superado: ¡que los dioses me ayuden!"
 me_bosporan_23.b:0 "Ya basta de juegos: beberé del cráneo de este bárbaro."
 me_bosporan_23_tooltip:0 "La opción está disponible debido al alto puntaje de finura de nuestro Gobernante."
 
 me_bosporan_24_title:0 "Destrucción del refugio de los piratas"
 me_bosporan_24_desc:0 "Al final, la batalla contra los piratas de [GetProvince('(int32)4565').GetName] fue una victoria total para los valientes guerreros de [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetRuler.GetName] pudo derrotar fácilmente al retador [ROOT.GetCountry.GetRuler.GetHerHis] después de recuperar la espada [ROOT.GetCountry.GetRuler.GetHerHis] del suelo, y [ROOT.GetCountry.GetRulerTitle] cortó la cabeza del bárbaro con un solo golpe que dejó a los soldados cercanos atónitos ante la habilidad marcial de su gobernante.\n\nEl refugio pirata fue completamente destruido por los entusiastas soldados y mucho botín fue tomado a bordo de la flota de Bosporan. Todos los asaltantes que no murieron en batalla o fueron crucificados después fueron enviados a [ROOT.GetCountry.GetCapital.GetName] encadenados, y [ROOT.GetCountry.GetRuler.GetFirstName] decretó que el castigo por la piratería siempre sería la esclavitud."
 me_bosporan_24.a:0 "Honramos la memoria de Eumelus destruyendo a los piratas en el #E Pontus Euxinus!#!"
 me_bosporan_24.b:0 "Envía el cráneo de su jefe a [ROOT.GetCountry.GetCapital.GetName] y conviértelo en mi taza."
 me_bosporan_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y La batalla de Gorgippia#!' $mission_completed_tooltip_2$"
 
 me_bosporan_25_title:0 "Puertos del Ponto Euxino"
 me_bosporan_25_desc:0 "El [ROOT.GetCountry.GetName] es la mayor potencia naval que navega por el #E Pontus Euxinus#!,, especialmente después de que [ROOT.GetCountry.GetRuler.GetName] se propusiera como misión personal destruir los numerosos #E Pirate Havens#! que contaminaban sus aguas.\n\nSin la amenaza de una invasión naval que se cierne sobre los ciudadanos de las numerosas ciudades portuarias del Bósforo, los carpinteros de barcos locales ahora tienen la libertad de experimentar con diferentes técnicas de construcción que ya están demostrando ser más eficientes que nuestra forma anterior de hacer las cosas: una bendición para los buques de guerra de los conquistadores [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetFirstName]."
 me_bosporan_25.a:0 "¡Nuestros barcos dominarán los mares!"
 me_bosporan_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y Puertos del Ponto Euxinus#!' $mission_completed_tooltip_2$"
 
 me_bosporan_26_title:0 "Comercio teodosiano"
 me_bosporan_26_desc:0 "La proximidad de [GetProvince('(int32)4544').GetName] a [GetProvince('(int32)4549').GetName] no ha desanimado a los visitantes de ninguna de las dos ciudades, que siguen siendo las #E Joyas Gemelas de la Cultura del Bósforo#!. Un viaje al [ROOT.GetCountry.GetName] no se considera completo a menos que uno haya pasado tiempo en ambas ciudades, pues tal es su importancia; muchos de los eventos que definieron una era en el siglo pasado tuvieron lugar cerca del #E Bósforo Cimmerio#!, y la Casa de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] ha infestado fuertemente ambos lados del estrecho, erigiendo fortificaciones y puertos y dejando su marca en el paisaje físico para siempre."
 me_bosporan_26.a:0 "#E Theodosia#! es una de las ciudades más importantes dentro del [ROOT.GetCountry.GetName]"
 me_bosporan_26_tooltip:0 "La tarea de la misión '#Y Comercio teodosiano#!' ya se ha #G completado#!!"
 
 me_bosporan_27_title:0 "Esclavos de la estepa"
 me_bosporan_27_desc:0 "En la desembocadura del #E Palus Maeotica#!, se encuentra la ciudad de [GetProvince('(int32)4557').GetName|Y] en sus pantanos fríos y lluviosos, y es el último puesto de avanzada de la civilización antes de encontrarse con la estepa interminable. Como tal, es un lugar natural para que los #E griegos#! y los #E escitas#! realicen negocios, y se ha hecho conocido como un centro comercial donde se pueden conseguir esclavos."
 me_bosporan_27.a:0 "¡Estos escitas venden esclavos a precio de ganga!"
 me_bosporan_27_tooltip:0 "$mission_completed_tooltip_1$ '#Y Esclavos de la estepa#!' $mission_completed_tooltip_2$"
