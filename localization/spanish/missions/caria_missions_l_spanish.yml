l_spanish:
 
 caria_missions:0 "Herederos de Hekatomnos"
 caria_missions_DESCRIPTION:0 "El linaje de Hekatomnos una vez llevó a Caria a la grandeza. Desde su asiento ancestral en Mylasa, los Hekatomnids surgieron como sátrapas de Caria, dueños tanto de sus tierras altas como de sus costas. Bajo Mausolos y Artemisia, Halikarnassos se hizo famosa por su colosal mausoleo, sus flotas dominaban el Egeo y su corte acogió a poetas, eruditos y soldados de todo el mundo helénico. Incluso en su ocaso, la dinastía sobrevivió con honor: la reina Ada, última de los Hekatomnids, adoptó a Alejandro el Grande como su hijo.\n\nAhora Caria se encuentra en una encrucijada. ¡Restaura las viejas costumbres bajo un Hekatomnid resurgente o forja un reino sucesor bajo Pleistarco y reclama tu derecho al imperio de Alejandro!"
 caria_missions_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completa cuando hayamos establecido un reino poderoso en Caria y extendido nuestro dominio por todo el Egeo."
 caria_missions_BUTTON_TOOLTIP:0 ""
 caria_missions_BUTTON_DETAILS: ""

 #Missions
 
 caria_missions_task_1:0 "Fortaleza en el servicio"
 caria_missions_task_1_DESC:0 "El futuro de Caria está claramente entrelazado con el de nuestros poderosos señores supremos, los #E [ROOT.GetCountry.GetOverlord.GetAdjective]#!. Si bien puede resultar tentador afirmar una mayor independencia, ahora no es el momento para tales acciones. Sólo invitaría al conflicto y a la sospecha.  En cambio, la sabiduría dicta un rumbo diferente, uno que fortalece nuestra posición y asegura nuestra prominencia dentro de su dominio."

 caria_missions_task_2:0 "Demostrando nuestro valor"
 caria_missions_task_2_DESC:0 "Caria ha demostrado desde hace tiempo su valor para las grandes potencias del Egeo y el Cercano Oriente. Bajo el dominio persa, nuestros hábiles marineros y mercenarios desempeñaron papeles vitales en sus campañas, mientras que los Hekatomnids elevaron a Caria a alturas de riqueza e influencia sin precedentes. Alejandro Magno confió a la reina Ada el gobierno de Caria como un aliado leal en lugar de un simple súbdito. Ahora, debemos demostrar una vez más a los #E [ROOT.GetCountry.GetOverlord.GetAdjective]#! que [ROOT.GetCountry.GetName] sería más valioso para ellos no simplemente como un sujeto a ser gobernado sino como un aliado indispensable."

 caria_missions_task_3:0 "Academia Naval"
 caria_missions_task_3_DESC:0 "Los carianos tienen una larga e histórica tradición naval, sirviendo como comandantes, constructores navales y guerreros en las flotas de poderosos imperios. Incluso en los días de la Edad del Bronce, nuestros antepasados ​​vagaban por los mares como mercenarios y comerciantes. Bajo Lygdamis, Artemisia, Mausolo y Ada, Caria reunió flotas formidables, asegurando el dominio sobre gran parte del Egeo. Sin embargo, durante demasiado tiempo, nuestra fuerza marinera se ha utilizado al servicio de otros.\n\nConstruiremos una academia naval en [ROOT.GetCountry.GetCapital.GetName] para capacitar a nuestra próxima generación de marineros y comandantes navales."

 caria_missions_task_4:0 "flota de guerra"
 caria_missions_task_4_DESC:0 "Los carianos tienen una larga e histórica tradición naval, sirviendo como comandantes, constructores navales y guerreros en las flotas de poderosos imperios. Incluso en los días de la Edad del Bronce, nuestros antepasados ​​vagaban por los mares como mercenarios y comerciantes. Bajo Lygdamis, Artemisia, Mausolo y Ada, Caria reunió flotas formidables, asegurando el dominio sobre gran parte del Egeo. Sin embargo, durante demasiado tiempo, nuestra fuerza marítima se ha utilizado al servicio de otros.\n\nAhora ha llegado el momento de construir una [ROOT.GetCountry.GetAdjective] flota de guerra, ¡no para las ambiciones de nuestros amos, sino para asegurar nuestro propio destino sobre las olas!"

 caria_missions_task_5:0 "La artemisia"
 caria_missions_task_5_DESC:0 "Alejandro Magno empleó por primera vez barcos con diez remeros o más por lado, pero se volvieron aún más comunes después de que las armadas antigónidas los usaron en el asedio de Tiro y más allá. Un barco así siempre tendrá una maniobrabilidad extremadamente limitada en una batalla naval campal. Sin embargo, para la guerra de asedio, estos 'Mega Polyremes' son ideales, ya que pueden romper los muros costeros y luego actuar como plataformas para la artillería, al tiempo que permiten el desembarco de un gran número de tropas. Es justo que construyamos estos barcos para nosotros mismos, porque ¿qué armada real está completa sin un buque insignia poderoso?"
 caria_missions_task_5_tt:0 "Ganaremos un #E Mega Polyreme#! en el #Y Mare Icarium#! con un #E almirante#! altamente competente para comandarlo."

 caria_missions_task_6:0 "Ponerse la diadema"
 caria_missions_task_6_DESC:0 "Los más grandes de los Diadochi ahora se autodenominan reyes, 'Basileis', no sátrapas. Caria ha conocido reinas y dinastías, señores de la guerra y visionarios. Ahora gobernamos no como meros servidores de potencias distantes sino como soberanos por derecho propio.\n\nY aún así, algunos llaman a nuestro gobernante 'Sátrapes', un título de subordinación. Eso no servirá. Nos espera la diadema y con ella el reconocimiento del lugar que nos corresponde entre los sucesores de Alejandro."

 caria_missions_task_7:0 "El reino pleistarquida"
 caria_missions_task_7_DESC:0 "El padre de Pleistarco, Antípatro, gobernó Macedonia como regente de los reyes, y su hermano Casandro dejó de lado los antiguos títulos de subordinación para declararse Basileus, fundando su propia dinastía. ¿Debemos ser menos audaces que Cassandros?\n\nAunque los confederados nos legaron [ROOT.GetCountry.GetName], ya no estamos atados a sus estrechas fronteras. Nuestras ambiciones van mucho más allá. Ocupemos nuestro lugar entre los Sucesores de Alejandro y reorganicemos [ROOT.GetCountry.GetName] en '¡El Reino Pleistarquida!'"
 caria_missions_task_7_tt:0 "Ahora podremos usar el #G Legado de Alejandro#! Objetivo de Guerra en otros Diadochi.\n#G Reclamaremos el antiguo Imperio de [GetCharacter('(int32)39').GetPraenomen]#!:\n[GetProvince('(int32)418').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)350').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)379').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)1883').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)1936').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)4799').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)516').GetArea.GetRegion.GetName|Y] y [GetProvince('(int32)569').GetArea.GetRegion.GetName|Y].\n#R Estos reclamos, y el objetivo de guerra, desaparecerán con la muerte o abdicación de [THIS.GetCountry.GetRuler.GetName].#!."

 caria_missions_task_8:0 "Corrigiendo Quíos"
 caria_missions_task_8_DESC:0 "Tucídides llamó una vez a los de Quíos \"los griegos más ricos\", y no sin razón. Con casi 900 kilómetros cuadrados de tierra fértil, picos elevados y acceso a los mares orientales, la isla es un mundo en sí misma y demasiado valiosa para dejarla a los caprichos de la democracia.\n\nEn los días de Mausolos, los oligarcas de Chian sabiamente expulsaron a los demócratas y se alinearon con Caria, formando una liga con Rodas, Kos y Bizancio. Pero como ocurre con todas las cosas inestables, la democracia regresó con las conquistas de Alejandro. Ahora ha llegado el momento de corregir ese error. Ayudaremos a los líderes naturales de la isla a reclamar su lugar y, al hacerlo, pondremos a Quíos una vez más bajo la égida de Caria. Resolveremos sus disputas territoriales con los eritraianos mediante un tratado o con una lanza...\""
 caria_missions_task_8_allow_tt:0 "Tener una flota de al menos #G 30#! barcos frente a la costa de #E Quíos#!"
 caria_missions_task_8_tt:0 "¡#E Quíos#! se convierte en #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!"

 caria_missions_task_9:0 "Príncipe de Priene"
 caria_missions_task_9_DESC:0 "Hieron, uno de los nobles más destacados de Priene, no ha intentado ocultar su deseo de poder hereditario. Aunque la ciudad se aferra a los símbolos de la democracia, su gente está cansada de las luchas entre facciones y los enredos extranjeros. Si ofrecemos el apoyo de incluso una parte de nuestras fuerzas, Hieron podría tomar el control y gobernar como un príncipe, marcando el comienzo de un nuevo orden bajo nuestra égida.\n\nHogar del venerado Santuario de Atenea Polias y lugar de reunión de la Liga Jónica, nPriene posee un inmenso valor simbólico y estratégico. Arrebatar el control de Priene supondría un golpe devastador para la Liga Jónica dominada por los Antigónidas y abriría la puerta al dominio cariano en toda Jonia."
 caria_missions_task_9_tt:0 "¡#E Priene#! se convierte en #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!"

#diasble tasks 14 and 17
#AI ONLY
 caria_missions_task_10:0 "El precio de la paz"
 caria_missions_task_10_DESC:0 "La era de los reyes está sobre nosotros. Los herederos de Alejandro, que ya no se contentan con llamarse sátrapas, ahora se autodenominan Basileis, y cada uno construye su imperio a imagen de su fundador. El mundo ya no está gobernado únicamente por hombres, sino por bestias feroces.\n\nAl sur, los Ptolomeos vuelan como águilas: distantes, imperiales y rápidos para atacar. Hacia el este, los seléucidas avanzan a pasos de elefantes: inmensos, deliberados e imparables. Al norte, los Lisimáquidos rugen como leones, siempre hambrientos de territorio y gloria.\n\nCada uno vigila a Caria y cada uno alberga silenciosos designios en nuestras costas. Pero tal vez no necesitemos enfrentarlos en la batalla. Por supuesto, la paz tiene un precio. Un matrimonio real, acompañado de la dote de Halikarnassus, aún puede convertir al depredador en socio."
 caria_missions_task_10_tt:0 "Se enviará una propuesta de matrimonio a uno de los #E Reyes Sucesores#!\nSi #G aceptan#!, ocurrirá lo siguiente:\n#E @[GetCountry('CIA').GetFlag]!  ¡[GetCountry('CIA').GetName]#! se alia con el #E #T Rey Sucesor#!#!\n@[GetCountry('CIA').GetFlag]!  [GetCountry('CIA').GetName] gana #G 250#! @gold! como dote\nUn descendiente del #E #T linaje del Rey Sucesor#!#! se casará con un miembro de nuestra casa\n#E Halikarnsos#! se convierte en un #Y Feudatorio#! del #E #T Reino Sucesor#!#!"

