 me_caria_1_title:0 "$caria_missions_task_1$"
 me_caria_1_desc:0 "El futuro de Caria está claramente entrelazado con el de nuestros poderosos señores supremos, los #E [ROOT.GetCountry.GetOverlord.GetAdjective]#!. Si bien puede resultar tentador afirmar una mayor independencia, ahora no es el momento para tales acciones. Sólo invitaría al conflicto y a la sospecha.  En cambio, la sabiduría dicta un rumbo diferente, uno que fortalece nuestra posición y asegura nuestra prominencia dentro de su dominio."
 me_caria_1.a:0 "Más bien amigos que enemigos."
 me_caria_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_1$#!' $mission_completed_tooltip_2$"

 me_caria_2_title:0 "$caria_missions_task_2$"
 me_caria_2_desc:0 "Caria ha demostrado desde hace tiempo su valor para las grandes potencias del Egeo y el Cercano Oriente. Bajo el dominio persa, nuestros hábiles marineros y mercenarios desempeñaron papeles vitales en sus campañas, mientras que los Hekatomnids elevaron a Caria a alturas de riqueza e influencia sin precedentes. Alejandro Magno confió a la reina Ada el gobierno de Caria como un aliado leal en lugar de un simple súbdito.\n\nAhora, el sátrapa de Caria, citando el precedente histórico de la autonomía de Caria bajo Persia y la confianza otorgada por Alejandro Magno, pide que formalicemos el estatus de Caria como aliado. Conceder esta solicitud aseguraría su lealtad y fortalecería sus contribuciones, pero también sentaría un precedente para una mayor autonomía entre nuestros súbditos. ¿Deberíamos reconocerlos como socios y no como simples provincias?"
 me_caria_2.a:0 "Formalicemos una alianza con [caria_ally_country.GetName]."
 me_caria_2.b:0 "Caria seguirá siendo una provincia bajo nuestro gobierno."

 me_caria_201_title:0 "Demostrando nuestro valor"
 me_caria_201_desc:0 "Ha llegado noticia del tribunal de los #E [caria_old_overlord.GetAdjective]#! sobre nuestra solicitud. Después de una cuidadosa deliberación, acordaron reconocernos como un socio en lugar de una simple provincia, otorgándonos la autonomía para servir mejor tanto a sus intereses como a los nuestros."
 me_caria_201.a:0 "Nos sentimos honrados de que confíen en nosotros como socios."
 me_caria_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_2$#!' $mission_completed_tooltip_2$"

 me_caria_202_title:0 "Demostrando nuestro valor"
 me_caria_202_desc:0 "El tribunal de los #E [caria_old_overlord.GetAdjective]#! ha rechazado nuestra solicitud de reconocimiento como socio. Lamentablemente, debemos actuar con cuidado y seguir demostrando nuestro valor, hasta el día en que podamos asegurar el estatus que merecemos."
 me_caria_202.a:0 "Muy desafortunado."

 me_caria_3_title:0 "$caria_missions_task_3$"
 me_caria_3_desc:0 "Los carianos tienen una larga e histórica tradición naval, sirviendo como comandantes, constructores navales y guerreros en las flotas de poderosos imperios. Incluso en los días de la Edad del Bronce, nuestros antepasados ​​vagaban por los mares como mercenarios y comerciantes. Bajo Lygdamis, Artemisia, Mausolo y Ada, Caria reunió flotas formidables, asegurando el dominio sobre gran parte del Egeo. Sin embargo, durante demasiado tiempo, nuestra fuerza marinera se ha utilizado al servicio de otros.\n\n¡En verdad, hemos establecido una de las mejores academias navales del mundo! Las costas de #E Caria#! están adornadas por los marineros de #E [ROOT.GetCountry.GetCapital.GetName]#!, que pronto serán los más grandes de toda Asia."
 me_caria_3.a:0 "Seremos gloriosos."
 me_caria_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_3$#!' $mission_completed_tooltip_2$"

 me_caria_4_title:0 "$caria_missions_task_4$"
 me_caria_4_desc:0 "Los carianos tienen una larga e histórica tradición naval, sirviendo como comandantes, constructores navales y guerreros en las flotas de poderosos imperios. Incluso en los días de la Edad del Bronce, nuestros antepasados ​​vagaban por los mares como mercenarios y comerciantes. Bajo Lygdamis, Artemisia, Mausolo y Ada, Caria reunió flotas formidables, asegurando el dominio sobre gran parte del Egeo. Sin embargo, durante demasiado tiempo, nuestra fuerza marítima se ha utilizado al servicio de otros.\n\nAhora, con la finalización de la [ROOT.GetCountry.GetAdjective] flota de guerra-no, ¡nuestro destino estará asegurado sobre las olas!"
 me_caria_4.a:0 "¡Asia temblará ante nuestro poder!"
 me_caria_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_4$#!' $mission_completed_tooltip_2$"

 me_caria_5_title:0 "$caria_missions_task_5$"
 me_caria_5_desc:0 "Alejandro Magno empleó por primera vez barcos con diez remeros o más por lado, pero se volvieron aún más comunes después de que las armadas antigónidas los usaron en el asedio de Tiro y más allá. Un barco así siempre tendrá una maniobrabilidad extremadamente limitada en una batalla naval campal. Sin embargo, para la guerra de asedio, estos 'Mega Polyremes' son ideales, ya que pueden romper los muros costeros y luego actuar como plataformas para la artillería, al tiempo que permiten el desembarco de un gran número de tropas. Es justo que construyamos tales barcos para nosotros y el primero de ellos, el 'Artemisia' capitaneado por [sailor_man.GetName], servirá como buque insignia de la armada de Caria."
 me_caria_5.a:0 "La 'Artemisia' es solo la primera de muchas..."
 me_caria_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_5$#!' $mission_completed_tooltip_2$"

 me_caria_6_title:0 "$caria_missions_task_6$"
 me_caria_6_desc:0 "Los más grandes de los Diadochi ahora se autodenominan reyes, 'Basileis', no sátrapas. Caria ha conocido reinas y dinastías, señores de la guerra y visionarios. Ahora gobernamos no como meros servidores de potencias distantes sino como soberanos por derecho propio.\n\nY aún así, algunos llaman a nuestro gobernante 'Sátrapes', un título de subordinación. Eso no servirá. Nos espera la diadema y con ella el reconocimiento del lugar que nos corresponde entre los sucesores de Alejandro."
 me_caria_6.a:0 "¡Salve [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName] de [ROOT.GetCountry.GetName]!"
 me_caria_6.b:0 "[ROOT.GetCountry.GetRuler.GetPraenomen] enriquecerá a los militares y despreciará a todos los demás."
 me_caria_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_6$#!' $mission_completed_tooltip_2$"

 me_caria_7_title:0 "$caria_missions_task_7$"
 me_caria_7_desc:0 "El padre de Pleistarco, Antípatro, gobernó Macedonia como regente de los reyes, y su hermano Casandro dejó de lado los antiguos títulos de subordinación para declararse Basileus, fundando su propia dinastía. ¿Debemos ser menos audaces que Cassandros?\n\nAunque los confederados nos legaron [ROOT.GetCountry.GetName], ya no estamos atados a sus estrechas fronteras. Nuestras ambiciones van mucho más allá. Ocupemos nuestro lugar entre los Sucesores de Alejandro y reorganicemos [ROOT.GetCountry.GetName] en '¡El Reino Pleistarquida!'"
 me_caria_7.a:0 "¡De ahora en adelante [ROOT.GetCountry.GetName] será conocido como El Reino Pleistarquida!"
 me_caria_7.b:0 "El status quo servirá."
 me_caria_7_tooltip:0 "Ahora podemos usar el #G Legado de Alejandro#! Objetivo de Guerra en otros Diadochi.\n#G Obtenemos derechos sobre el antiguo Imperio de [GetCharacter('(int32)39').GetPraenomen]#!:\n[GetProvince('(int32)418').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)350').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)379').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)290').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)1883').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)1936').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)830').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)4799').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)687').GetArea.GetRegion.GetName|Y], [GetProvince('(int32)516').GetArea.GetRegion.GetName|Y] y [GetProvince('(int32)569').GetArea.GetRegion.GetName|Y].\n#R Estos reclamos, y el Objetivo de Guerra, desaparecerán con la muerte o abdicación de [THIS.GetCountry.GetRuler.GetName].#!\nLa tarea de misión '#Y $caria_missions_task_7$#!' ahora ha sido #G completada#!"

 me_caria_8_title:0 "$caria_missions_task_8$"
 me_caria_8_desc:0 "Tucídides llamó una vez a los de Quíos \"los griegos más ricos\", y no sin razón. Con casi 900 kilómetros cuadrados de tierra fértil, picos elevados y acceso a los mares orientales, la isla es un mundo en sí misma y demasiado valiosa para dejarla a los caprichos de la democracia.\n\nEn los días de Mausolos, los oligarcas de Chian sabiamente expulsaron a los demócratas y se alinearon con Caria, formando una liga con Rodas, Kos y Bizancio. Pero como ocurre con todas las cosas inestables, la democracia regresó con las conquistas de Alejandro.\n\nEste error ha sido corregido. Con la ayuda de nuestra flota, los líderes naturales de la isla han reclamado su lugar y han puesto a Quíos una vez más bajo la égida de Caria. Su líder, [chios_country.GetRuler.GetName], pide que resolvamos una disputa territorial con los eritraianos por la fuerza de las armas."
 me_caria_8.a:0 "Cualquier cosa por nuestros leales amigos."
 me_caria_8.b:0 "No debemos esforzarnos demasiado."
 me_caria_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_8$#!' $mission_completed_tooltip_2$"

 me_caria_8001_title:0 "Los oligarcas se apoderan de Quíos"
 me_caria_8001_desc:0 "Se corre la voz por todo el Egeo: el régimen democrático de Quíos ha caído. Respaldada por [chios_new_master.GetAdjective] oro y barcos, la facción oligárquica de la isla derrocó a la asamblea y restableció el control bajo un consejo de \"líderes naturales\".\n\nLa medida se hace eco de los días de Mausolos, cuando Quíos expulsó al demos y se unió a una liga liderada por Caria junto con Rodas, Cos y Bizancio. Ahora, una vez más, la rica isla se inclina hacia la oligarquía y hacia [chios_new_master.GetName]."
 me_caria_8001.a:0 "Interesante..."
 me_caria_8001.b:0 "¡Esta afrenta no permanecerá!"
 me_caria_8001.c:0 "¡Esta afrenta no permanecerá!"

 me_caria_9_title:0 "$caria_missions_task_9$"
 me_caria_9_desc:0 "La ciudad jónica de [priene_country.GetName], conocida desde hace mucho tiempo por sus templos dignos y sus orgullosas tradiciones democráticas, ha guardado silencio... salvo por el estampación de las botas [ROOT.GetCountry.GetAdjective]. Con el discreto apoyo de las [ROOT.GetCountry.GetAdjective] armas, [hieron_scope.GetName] se ha declarado 'Príncipe de Priene', disolviendo la asamblea de la ciudad y asumiendo la diadema. El Santuario de Atenea Polias permanece intacto, pero sus administradores ahora responden ante un príncipe en lugar de un pueblo.\n\nLa Liga Jónica ya se agita con inquietud. Hace apenas unas semanas, Priene era el lugar de reunión de la Liga; ahora, es un vasallo [ROOT.GetCountry.GetAdjective] en todo menos en el nombre."
 me_caria_9.a:0 "¡El camino a Jonia está abierto!"
 me_caria_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_9$#!' $mission_completed_tooltip_2$"

 me_caria_9001_title:0 "Príncipe de Priene"
 me_caria_9001_desc:0 "La ciudad jónica de [priene_country.GetName], conocida desde hace mucho tiempo por sus templos dignos y sus orgullosas tradiciones democráticas, ha guardado silencio... salvo por el ruido de las botas carias. Con el discreto apoyo de las armas carianas, [hieron_scope.GetName], uno de los nobles más destacados de Priene, se ha declarado \"Príncipe de Priene\", disolviendo la asamblea de la ciudad y asumiendo la diadema. El Santuario de Atenea Polias permanece intacto, pero sus administradores ahora responden ante un príncipe en lugar de un pueblo.\n\nToda Jonia se agita con inquietud. Hace apenas unas semanas, Priene era el lugar de reunión de la Liga Jónica; ahora es vasallo de Caria en todo menos en el nombre."
 me_caria_9001.a:0 "Interesante..."
 me_caria_9001.b:0 "¡Esta afrenta no permanecerá!"

 me_caria_10_title:0 "$caria_missions_task_10$"
 me_caria_10_desc:0 "La era de los reyes está sobre nosotros. Los herederos de Alejandro, que ya no se contentan con llamarse sátrapas, ahora se autodenominan Basileis, y cada uno construye su imperio a imagen de su fundador. El mundo ya no está gobernado únicamente por hombres, sino por bestias feroces.\n\nAl sur, los Ptolomeos vuelan como águilas: distantes, imperiales y rápidos para atacar. Hacia el este, los seléucidas avanzan a pasos de elefantes: inmensos, deliberados e imparables. Al norte, los Lisimáquidos rugen como leones, siempre hambrientos de territorio y gloria.\n\nCada uno vigila a Caria y cada uno alberga silenciosos designios en nuestras costas. Pero tal vez no necesitemos enfrentarlos en la batalla. Por supuesto, la paz tiene un precio. Un matrimonio real, acompañado de la dote de Halikarnassus, aún puede convertir al depredador en socio."
 me_caria_10.a:0 "Una hija de [GetCountry('EGY').GetRuler.GetPraenomen] servirá."
 me_caria_10.at:0 "Se enviará una propuesta de matrimonio a [GetCountry('EGY').GetCapital.GetName]#!\nSi [GetCountry('EGY').GetRuler.GetPraenomen] #G acepta#!, ocurrirá lo siguiente:\n\nUn vástago de la línea de #E #T [GetCountry('EGY').GetRuler.GetPraenomen]#!#! casarse con un miembro de nuestra casa"
 me_caria_10.b:0 "[GetCountry('TRE').GetRuler.GetPraenomen] serán nuestros parientes."
 me_caria_10.bt:0 "Se enviará una propuesta de matrimonio a [GetCountry('TRE').GetCapital.GetName]#!\nSi [GetCountry('TRE').GetRuler.GetPraenomen] #G acepta#!, ocurrirá lo siguiente:\n\nUn vástago de la línea de #E #T [GetCountry('TRE').GetRuler.GetPraenomen]#!#! casarse con un miembro de nuestra casa"
 me_caria_10.c:0 "[GetCountry('SEL').GetRuler.GetPraenomen] es un hombre razonable."
 me_caria_10.ct:0 "Se enviará una propuesta de matrimonio a [GetCountry('SEL').GetCapital.GetName]#!\nSi [GetCountry('SEL').GetRuler.GetPraenomen] #G acepta#!, ocurrirá lo siguiente:\n\nUn vástago de la línea de #E #T [GetCountry('SEL').GetRuler.GetPraenomen]#!#! casarse con un miembro de nuestra casa"
 me_caria_10.d:0 "No nos rebajaremos con regalos y halagos."
 me_caria_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_10$#!' $mission_completed_tooltip_2$"



 me_caria_1001_title:0 "La propuesta de matrimonio caria"
 me_caria_1001_desc:0 "Ahora llegan enviados de Caria trayendo halagos, plata y algo más peligroso: una oferta. Proponen una unión entre nuestras dos casas, sellada con una dote de Halikarnassos. Esperan comprar la paz con puertos y parentesco.\n\nUna estratagema inteligente. Caria no busca resistirnos; busca sobrevivirnos. Podemos acceder a su petición y atarlos con sangre... o negarnos y dejar que los chacales caigan sobre sus muros."
 me_caria_1001.a:0 "Una oferta muy bienvenida."
 me_caria_1001.b:0 "Qué petición tan ridícula."

 me_caria_1002_title:0 "$caria_missions_task_10$: Éxito"
 me_caria_1002_desc:0 "Ha llegado la noticia del tribunal de [sucessor_kingdom.GetCapital.GetName]. Se ha acordado una unión real. Uno de los nuestros se casará con su línea y, a cambio, se nos concederá protección, alianza y reconocimiento. Por supuesto, la paz nunca deja de tener un coste, Halikarnassos pasará ahora a [sucessor_kingdom.GetAdjective] manos como dote."
 me_caria_1002.a:0 "Que comiencen las festividades de la boda."

 me_caria_1003_title:0 "$caria_missions_task_10$: Fallo"
 me_caria_1003_desc:0 "La respuesta [sucessor_kingdom.GetAdjective] ha llegado y es fría. Nuestra embajada fue despedida, nuestros obsequios fueron rechazados, nuestra propuesta fue rechazada de plano. No habrá matrimonio, ni alianza, ni paz comprada con dotes."
 me_caria_1003.a:0 "Entonces nos quedamos solos."

 me_caria_11_title:0 "$caria_missions_task_11$"
 me_caria_11_desc:0 "El mundo es un lugar turbulento. Alejandro se ha ido y, en su ausencia, los Diadochi destrozan el mundo en su búsqueda de dominio. Las flotas arden, las ciudades caen y ninguna tierra escapa al alcance de la guerra. En una época así, estar solo es estar al filo de una espada. Muchos ahora piden que pasemos formalmente bajo la égida de nuestros buenos y fieles amigos, los Ptolomeos."
 me_caria_11.a:0 "Saludo [GetCountry('EGY').GetRuler.GetTitle] [GetCountry('EGY').GetRuler.GetName]"
 me_caria_11.b:0 "Seguiremos siendo un pueblo libre."
 me_caria_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_11$#!' $mission_completed_tooltip_2$."

 me_caria_12_title:0 "$caria_missions_task_12$"
 me_caria_12_desc:0 "El mundo es un lugar turbulento. Alejandro se ha ido y, en su ausencia, los Diadochi destrozan el mundo en su búsqueda de dominio. Las flotas arden, las ciudades caen y ninguna tierra escapa al alcance de la guerra. En una época así, estar solo es estar al filo de una espada. Muchos ahora piden que pasemos formalmente bajo la égida de nuestros buenos y fieles amigos, los Alkimachids."
 me_caria_12.a:0 "Saludo [GetCountry('TRE').GetRuler.GetTitle] [GetCountry('TRE').GetRuler.GetName]"
 me_caria_12.b:0 "Seguiremos siendo un pueblo libre."
 me_caria_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_12$#!' $mission_completed_tooltip_2$"

 me_caria_13_title:0 "$caria_missions_task_13$"
 me_caria_13_desc:0 "El mundo es un lugar turbulento. Alejandro se ha ido y, en su ausencia, los Diadochi destrozan el mundo en su búsqueda de dominio. Las flotas arden, las ciudades caen y ninguna tierra escapa al alcance de la guerra. En una época así, estar solo es estar al filo de una espada. Muchos ahora piden que pasemos formalmente bajo la égida de nuestros buenos y fieles amigos, los seléucidas."
 me_caria_13.a:0 "Saludo [GetCountry('SEL').GetRuler.GetTitle] [GetCountry('SEL').GetRuler.GetName]"
 me_caria_13.b:0 "Seguiremos siendo un pueblo libre."
 me_caria_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_13$#!' $mission_completed_tooltip_2$"

 me_caria_14_title:0 "$caria_missions_task_14$"
 me_caria_14_desc:0 "Halikarnassos, una vez desafió al mayor conquistador de la época. Cuando Alejandro sitió la ciudad en 334 a. C., se mantuvo firme durante meses bajo el mando de Memnón de Rodas y, aunque al final cayó, sus defensas se ganaron el respeto de toda Hellas. Desde entonces, Halikarnassos ha cambiado de manos más de una vez, mientras los Diadochi luchaban como lobos por el botín del imperio.\n\nPero ya no. Que los reyes y los sátrapas planeen lo que quieran, Halikarnassos no será su premio. Hemos reconstruido sus murallas, reforzado sus puertos y restaurado sus torres. La ciudad se erige ahora como un bastión inexpugnable del poder cario, y aquellos que quieran tomarla deben pagar un precio terrible."
 me_caria_14.a:0 "¡El escudo de Caria, irrompible y eterno, está completo!"
 me_caria_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_14$#!' $mission_completed_tooltip_2$"

 me_caria_15_title:0 "$caria_missions_task_15$"
 me_caria_15_desc:0 "El linaje de Hekatomnos llevó a Caria a la grandeza. Desde su asiento ancestral en Mylasa, los Hekatomnids ascendieron al poder como sátrapas de Caria y amos de sus tierras altas y costas por igual. Bajo Mausolos y Artemisia, Halikarnassos saltó a la fama, sus monumentos rivalizaban con los de las antiguas dinastías, sus flotas dominaban los mares y su corte albergaba a poetas, eruditos y soldados. Incluso en su ocaso, la dinastía sobrevivió con honor: la reina Ada, última de los Hekatomnids, adoptó a Alejandro Magno como su hijo. Ahora, con Halikarnassos una vez más asegurado, es lógico que confiemos su gobierno a [hecatomnid_heir.GetName], un descendiente de una rama menor de la Casa de Hekatomnos de Mylassa."
 me_caria_15.a:0 "¡Salve Basileos [hecatomnid_heir.GetPraenomen]!"
 me_caria_15.b:0 "[hecatomnid_heir.GetPraenomen] será el primer hombre en Halikarnassos."
 me_caria_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_15$#!' $mission_completed_tooltip_2$"

 me_caria_16_title:0 "$caria_missions_task_16$"
 me_caria_16_desc:0 "Durante demasiado tiempo, Caria se ha arrodillado ante los persas, los macedonios y los reyes autodenominados sin raíces en nuestro suelo. No más, recuerda Caria. En los santuarios montañosos de Mylasa, en las tabernas del puerto, de Halikarnassos, en los corazones de la gente, perduran las viejas lealtades. Susurran sobre un levantamiento, sobre venganza, sobre restauración.\n\nUno de esos susurros ha tomado forma en la persona de un [hekatomnid_assasain.GetName], un hombre de carisma y ambición de la línea de Hekatomnos, que se ganó la confianza de [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName] con fingida lealtad y halagos. [hekatomnid_assasain.GetPraenomen] cree que es hora de que los herederos de Hekatomnos reclamen lo que les corresponde por derecho, no como sátrapas, sino como soberanos.\n\nPero esta noche, en los oscuros pasillos del palacio, [hekatomnid_assasain.GetHerHis] la traición queda al descubierto. Los guardias de [ROOT.GetCountry.GetRuler.GetPraenomen] han sorprendido a [hekatomnid_assasain.GetHerHim] en el acto de envenenar el vino de [ROOT.GetCountry.GetRuler.GetPraenomen]. Una palabra del capitán de la guardia puede encadenar a [hekatomnid_assasain.GetPraenomen] y salvar a [ROOT.GetCountry.GetRuler.GetPraenomen]. Sin embargo, hay otro camino abierto, el silencio..."
 me_caria_16.a:0 "¡Que tiemble el usurpador!"
 me_caria_16.at:0 "Adoptaremos la bandera de #T Halikarnassos#!"
 me_caria_16.b:0 "Caria para los carianos."
 me_caria_16.c:0 "¡Encarcelar [hekatomnid_assasain.GetPraenomen]!"
 me_caria_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_16$#!' $mission_completed_tooltip_2$"

 me_caria_17_title:0 "$caria_missions_task_17$"
 me_caria_17_desc:0 "Si bien los restos materiales de Kaunos datan su fundación o uso temprano del sitio como máximo en el siglo IX a. C., la historia tradicional de la ciudad se remonta a su homónimo, Kaunos, el hijo del rey cario Mileto y la náyade Kyane. Se dice que Kaunos y su hermana Byblis se enamoraron y que, para evitar el incesto, Kaunos huyó de su compañía hasta Licia en Anatolia. Aquí Byblis lo siguió pero cayó en la tristeza y la locura y murió, convirtiéndose en un manantial, llorando sus incesantes lágrimas sobre la tierra y creando con sus ojos llorosos el río Calbys. En Asia, Kaunos se casó con la ninfa Pronoe y tuvo un hijo, Aegialus, quien fundó una ciudad cercana, que lleva el nombre de su padre. La ciudad en sí era un excelente puerto comercial, con dos puertos en funcionamiento, y Heródoto señala que la gente de la ciudad luchó con resistencia contra el general persa Harpagus; después de un tiempo, perdieron. El historiador también señala que, si bien personalmente no está de acuerdo con su afirmación de su propio origen extranjero, porque hablan un idioma similar al de su propia casa, no puede negar que actúan de una manera peculiar, diferente de todos los demás carios y licios. Todos los hombres, mujeres e incluso los niños beben vino juntos.\n\nSi albergamos ambiciones de estar entre los herederos de Alejandro, debemos hacer lo que ellos hacen. Estableceremos una casa de moneda real en Kaunos, acuñando monedas en nuestro nombre."
 me_caria_17.a:0 "Un Kaunos autónomo conviene a nuestros intereses."
 me_caria_17.at:0 "¡#E Kaunos#! se convierte en #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!"
 me_caria_17.b:0 "¡Todo el mundo conocerá el rostro de [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName]!"
 me_caria_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_17$#!' $mission_completed_tooltip_2$"

 me_caria_18_title:0 "$caria_missions_task_18$"
 me_caria_18_desc:0 "Mausolos, el gran arquitecto del poder cario, sabía que el imperio no se construye con una sola mano. Para asegurar su frontera sur, confió el gobierno de Licia a su hermano Pixodaros. Haríamos bien en seguir su ejemplo. Las ciudades licias, desde Xanthos hasta Patara, son orgullosas y rebeldes, pero estratégicamente vitales."
 me_caria_18.a:0 "¡Licia en adelante será gobernada por un sátrapa!"
 me_caria_18.b:0 "Los límites de Licia se extenderán a lo largo y ancho."
 me_caria_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_18$#!' $mission_completed_tooltip_2$"

 me_caria_19_title:0 "$caria_missions_task_19$"
 me_caria_19_desc:0 "El hiparca Condalos, enviado a gobernar Licia, comentó una vez que los lugareños llevaban el pelo largo, a diferencia de los carios bien afeitados. Sintiendo una oportunidad, Condalos proclamó al pueblo que el gran rey Artajerjes exigía pelo para las pelucas de caballo, y que todo licio debía afeitarse la cabeza y enviar los recortes a la corte real. Aquellos que se negaran podrían pagar en plata. Nunca salió ningún pelo de la provincia, pero el plan de Condalos aumentó considerablemente los ingresos."
 me_caria_19.a:0 "Mausolos seguro que sabía cómo elegirlos..."
 me_caria_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_19$#!' $mission_completed_tooltip_2$"

 me_caria_20_title:0 "$caria_missions_task_20$"
 me_caria_20_desc:0 "La costa occidental de Asia Menor es un mosaico de ciudades-estado, ligas y satrapías en decadencia. Muchas de estas ciudades alguna vez rindieron homenaje a Mausolos o lucharon junto a Artemisia. Algunos han caído bajo el dominio de los generales macedonios o se aferran a libertades vacías detrás de muros que se desmoronan. La costa asiática es nuestra herencia. Ha llegado el momento de lanzar una expedición para asegurar nuestro dominio sobre Asia para las generaciones venideras."
 me_caria_20.a:0 "¡Pronto Asia será nuestra!"
 me_caria_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_20$#!' $mission_completed_tooltip_2$"

 me_caria_21_title:0 "$caria_missions_task_21$"
 me_caria_21_desc:0 "No hace mucho, las tierras altas de Licaonia estaban fracturadas y no reclamadas, una tierra salvaje de ciudades fortificadas, jefes tribales y fortalezas montañosas. Nuestra expedición a Derbe ha dado sus frutos. [derbe_ruler.GetPraenomen] ahora gobierna estas tierras como dinastía, habiendo asegurado la lealtad de sus castros y ciudades con la ayuda de [ROOT.GetCountry.GetAdjective] oro. Al lado [derbe_ruler.GetHerHis] se encuentra [derbe_heir.GetPraenomen], el heredero de esta nueva línea Derbean."
 me_caria_21.a:0 "Por fin, Derbe tiene dinastía."
 me_caria_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_21$#!' $mission_completed_tooltip_2$"

 me_caria_22_title:0 "$caria_missions_task_22$"
 me_caria_22_desc:0 "Aunque nuestras ciudades costeras brillan con mármol, el verdadero cuerpo de [ROOT.GetCountry.GetName] se encuentra tierra adentro, en los valles, colinas y pueblos dispersos que alimentan nuestras ciudades y tripulan nuestros ejércitos. Debemos volver la mirada hacia los pastores, agricultores y colonos que sustentan nuestra fuerza. Con subvenciones modestas y una supervisión constante, hemos transformado el interior en el corazón palpitante del [ROOT.GetCountry.GetAdjective] poder. Se han construido carreteras a través de las colinas de Mylasa y se han excavado pastos en el suelo pedregoso."
 me_caria_22.a:0 "Cuidamos de los nuestros."
 me_caria_22.at:0 "Cada territorio de rango #Y Asentamiento#! obtendrá #G #E 2#!#! @freemen! #Y Hombres libres#! pops y #G #E 1#!#! @citizen! #Y Ciudadano#! pop"
 me_caria_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_22$#!' $mission_completed_tooltip_2$"

 me_caria_23_title:0 "$caria_missions_task_23$"
 me_caria_23_desc:0 "Los barones de Macedonia siempre han favorecido a los fuertes y capaces sobre los débiles y débiles. Si jugamos bien nuestra mano, nuestra línea aún puede resultar ser la más fuerte de todas. [ROOT.GetCountry.GetRuler.GetName] se ha apoderado de lo que queda del Reino de Alejandro, sacándolo del alcance de quienes lo llevan a la ruina y creando en su lugar un estado nuevo y más robusto bajo el cual sirvan los macedonios diseminados por los restos destrozados del Imperio Argead."
 me_caria_23.a:0 "[ROOT.GetCountry.GetRuler.GetPraenomen] es el [ROOT.GetCountry.GetRulerTitle] de Macedonia"
 me_caria_23.at:0 "Adoptaremos la bandera y los colores de Macedonia."
 me_caria_23.b:0 "Gobernamos Macedonia, pero no es la Macedonia de antaño."
 me_caria_23.bt:0 "#R No pasa nada.#!"
 me_caria_23.c:0 "Este es un nuevo capítulo en la historia de los macedonios."
 me_caria_23.ct:0 "Adoptaremos los símbolos de Macedonia pero conservaremos nuestros colores."
 me_caria_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_23$#!' $mission_completed_tooltip_2$\n#G Desbloquea#! #T Misiones macedonias#!\nCompletar #T Maestría helénica#! #G Desbloquea#! #T Imperio Helenístico#!"

 me_caria_24_title:0 "$caria_missions_task_24$"
 me_caria_24_desc:0 "El mundo helenístico está plagado de enseñanzas de filosofía, arte, historia y aprendizaje, desde las obras de Platón hasta las Historias de Heródoto.\n\nCon la construcción de bibliotecas públicas en todo el país, [ROOT.GetCountry.GetName] se ha convertido en un faro del helenismo en el este, con el sonido de grandes debates resonando en las calles, lo que atrae a muchos estudiosos a viajar desde la Grecia continental. Un académico en particular, [hellenic_scholar.GetName], ha demostrado una mente excepcionalmente aguda y sería un investigador perfecto si le permitiéramos trabajar."
 me_caria_24.a:0 "Excelente."
 me_caria_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $caria_missions_task_24$#!' $mission_completed_tooltip_2$"

