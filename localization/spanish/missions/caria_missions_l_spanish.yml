 caria_missions_task_11:0 "Bajo las alas del águila"
 caria_missions_task_11_DESC:0 "El mundo se vuelve más oscuro cada año. Los Diadochi chocan sin cesar, los piratas infestan los mares y las ambiciones de los rudos generales aumentan con cada temporada que pasa. En esos tiempos, la prudencia debe anteponerse al orgullo.\n\nNuestra reciente alianza con los Ptolomeos ha aportado riqueza y reconocimiento, pero ahora debemos preguntarnos si se necesita un vínculo más profundo. Al convertirnos formalmente en sátrapes ptolemaicos, podemos cambiar una medida de soberanía por una seguridad duradera. El águila egipcia proyectará su sombra sobre nuestras tierras, pero bajo sus alas resistiremos."
 caria_missions_task_11_tt:0 "¡[THIS.GetCountry.GetName] tendrá la opción de convertirse en #E @[GetCountry('EGY').GetFlag]!  [GetCountry('EGY').GetAdjective]#! #Y Satrapía#!. Lo siguiente ocurrirá si #G aceptamos#!:\n\n"

 caria_missions_task_12:0 "A la sombra del león"
 caria_missions_task_12_DESC:0 "El mundo se vuelve más oscuro cada año. Los Diadochi chocan sin cesar, los piratas infestan los mares y las ambiciones de los rudos generales aumentan con cada temporada que pasa. En esos tiempos, la prudencia debe anteponerse al orgullo.\n\nNuestra reciente alianza con Lysimachos nos ha aportado fuerza y ​​estatus, pero el león no se satisface fácilmente. Su hambre de territorio y dominio es bien conocida, y ya mira con cautela hacia el Egeo. Al convertirnos formalmente en un Sátrapes Lisimáquida, podemos cambiar una medida de soberanía por una seguridad duradera. El León de Tesalia proyectará su sombra sobre nuestras tierras, pero bajo su melena resistiremos."
 caria_missions_task_12_tt:0 "¡[THIS.GetCountry.GetName] tendrá la opción de convertirse en #E @[GetCountry('TRE').GetFlag]!  [GetCountry('TRE').GetAdjective]#! #Y Satrapía#!. Lo siguiente ocurrirá si #G aceptamos#!:\n\n"

 caria_missions_task_13:0 "Al lado del elefante"
 caria_missions_task_13_DESC:0 "El mundo se vuelve más oscuro cada año. Los Diadochi chocan sin cesar, los piratas infestan los mares y las ambiciones de los rudos generales aumentan con cada temporada que pasa. En esos tiempos, la prudencia debe anteponerse al orgullo.\n\nNuestra reciente alianza con los seléucidas nos ha traído riqueza y amigos poderosos, pero el #E Maestro de los Elefantes#! no se deja satisfacer fácilmente. Su hambre de territorio y dominio es bien conocida, y ya mira con cautela hacia el Egeo. Al convertirnos formalmente en sátrapes seléucidas, podemos cambiar una medida de soberanía por una seguridad duradera. Es mejor caminar junto a la bestia que ser aplastado por ella."
 caria_missions_task_13_tt:0 "¡[THIS.GetCountry.GetName] tendrá la opción de convertirse en #E @[GetCountry('SEL').GetFlag]!  [GetCountry('SEL').GetAdjective]#! #Y Satrapía#!. Lo siguiente ocurrirá si #G aceptamos#!:\n\n"

 caria_missions_task_14:0 "Murallas de Halikarnassos"
 caria_missions_task_14_DESC:0 "Halikarnassos, una vez desafió al mayor conquistador de la época. Cuando Alejandro sitió la ciudad en 334 a. C., se mantuvo firme durante meses bajo el mando de Memnón de Rodas y, aunque al final cayó, sus defensas se ganaron el respeto de toda Hellas. Desde entonces, Halikarnassos ha cambiado de manos más de una vez, mientras los Diadochi luchaban como lobos por el botín del imperio.\n\nPero ya no. Que los reyes y los sátrapas planeen lo que quieran, Halikarnassos no será su premio. Reconstruiremos sus murallas, reforzaremos sus puertos y restauraremos sus torres. La ciudad se mantendrá como un bastión inexpugnable del poder cario, y aquellos que intenten tomarla deberán pagar un precio terrible."

 caria_missions_task_15:0 "Herederos de Hekatomnos"
 caria_missions_task_15_DESC:0 "El linaje de Hekatomnos llevó a Caria a la grandeza. Desde su asiento ancestral en Mylasa, los Hekatomnids ascendieron al poder como sátrapas de Caria y amos de sus tierras altas y costas por igual. Bajo Mausolos y Artemisia, Halikarnassos saltó a la fama, sus monumentos rivalizaban con los de las antiguas dinastías, sus flotas dominaban los mares y su corte albergaba a poetas, eruditos y soldados. Incluso en su ocaso, la dinastía sobrevivió con honor: la reina Ada, última de los Hekatomnids, adoptó a Alejandro Magno como su hijo. Ahora, con Halikarnassos una vez más asegurado, es lógico que confiemos su gobierno a una rama cadete de esa casa noble."
 caria_missions_task_15_tt:0 "¡Un #E Hekatomnid#! se convierte en el gobernante de #E @[GetCountry('HKS').GetFlag]!  [GetCountry('HKS').GetName]#!"

 caria_missions_task_16:0 "Restauración hekatomnida"
 caria_missions_task_16_DESC:0 "Durante demasiado tiempo, Caria se ha arrodillado ante los persas, los macedonios y los reyes autodenominados sin raíces en nuestro suelo. No más, recuerda Caria. En los santuarios montañosos de Mylasa, en las tabernas del puerto, de Halikarnassos, en los corazones de la gente, perduran las viejas lealtades. Susurran sobre un levantamiento, sobre venganza, sobre restauración.\n\nEs el momento. Caria será gobernada por carianos una vez más. Los herederos de Hekatomnos reclamarán lo que les corresponde por derecho, no como sátrapas, sino como soberanos. Que tiemble el usurpador. ¡La revolución está cerca! Ya nos llega noticia de un complot contra [ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetName]. En los pasillos del [ROOT.GetCountry.GetRuler.GetHerHis] palacio, las dagas están desenvainadas en las sombras y el veneno aguarda en copas doradas."
 caria_missions_task_16_tt:0 "Podemos optar por intervenir y salvar a [THIS.GetCountry.GetRuler.GetName], o permitir que el asesinato continúe.\n\nSi el complot #G tiene éxito#!, ocurrirá lo siguiente:\nUn #Y Hekatomnid#! se convierte en el gobernante de [THIS.GetCountry.GetName]"

 caria_missions_task_17:0 "Monedas kaunianas"
 caria_missions_task_17_DESC:0 "Si bien los restos materiales de Kaunos datan su fundación o uso temprano del sitio como máximo en el siglo IX a. C., la historia tradicional de la ciudad se remonta a su homónimo, Kaunos, el hijo del rey cario Mileto y la náyade Kyane. Se dice que Kaunos y su hermana Byblis se enamoraron y que, para evitar el incesto, Kaunos huyó de su compañía hasta Licia en Anatolia. Aquí Byblis lo siguió pero cayó en la tristeza y la locura y murió, convirtiéndose en un manantial, llorando sus incesantes lágrimas sobre la tierra y creando con sus ojos llorosos el río Calbys. En Asia, Kaunos se casó con la ninfa Pronoe y tuvo un hijo, Aegialus, quien fundó una ciudad cercana, que lleva el nombre de su padre. La ciudad en sí era un excelente puerto comercial, con dos puertos en funcionamiento, y Heródoto señala que la gente de la ciudad luchó con resistencia contra el general persa Harpagus; después de un tiempo, perdieron. El historiador también señala que, si bien personalmente no está de acuerdo con su afirmación de su propio origen extranjero, porque hablan un idioma similar al de su propia casa, no puede negar que actúan de una manera peculiar, diferente de todos los demás carios y licios. Todos los hombres, mujeres e incluso los niños beben vino juntos.\n\nSi albergamos ambiciones de estar entre los herederos de Alejandro, debemos hacer lo que ellos hacen. Estableceremos una casa de moneda real en Kaunos, acuñando monedas en nuestro nombre."
 caria_missions_task_17_tt:0 "¡#E Kaunos#! puede publicarse como #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!"

 caria_missions_task_18:0 "Señor de Licia"
 caria_missions_task_18_DESC:0 "Mausolos, el gran arquitecto del poder cario, sabía que el imperio no se construye con una sola mano. Para asegurar su frontera sur, confió el gobierno de Licia a su hermano Pixodaros. Haríamos bien en seguir su ejemplo. Las ciudades licias, desde Xanthos hasta Patara, son orgullosas y rebeldes, pero estratégicamente vitales."
 caria_missions_task_18_tt:0 "[THIS.GetCountry.GetName] obtendrá reclamaciones sobre las áreas de #Y Licia#!, #Y Milyas#!, #Y Pisidia#! y #Y Panfilia#!"

 caria_missions_task_19:0 "El impuesto al cabello"
 caria_missions_task_19_DESC:0 "El hiparca Condalos, enviado a gobernar Licia, comentó una vez que los lugareños llevaban el pelo largo, a diferencia de los carios bien afeitados. Sintiendo una oportunidad, Condalos proclamó al pueblo que el gran rey Artajerjes exigía pelo para las pelucas de caballo, y que todo licio debía afeitarse la cabeza y enviar los recortes a la corte real. Aquellos que se negaran podrían pagar en plata. Nunca salió ningún pelo de la provincia, pero el plan de Condalos aumentó enormemente los ingresos.\n\nReviviremos esta tradición, con los ajustes adecuados a nuestro tiempo. Llámelo tributo, llámelo costumbre, de cualquier manera, se espera que los pueblos súbditos de nuestro reino paguen su parte, en plata o en hebras."
 caria_missions_task_19_tt:0 "Cada cultura #R no integrada#! obtiene el siguiente modificador:"

 caria_missions_task_20:0 "Expedición asiática"
 caria_missions_task_20_DESC:0 "La costa occidental de Asia Menor es un mosaico de ciudades-estado, ligas y satrapías en decadencia. Muchas de estas ciudades alguna vez rindieron homenaje a Mausolos o lucharon junto a Artemisia. Algunos han caído bajo el dominio de los generales macedonios o se aferran a libertades vacías detrás de muros que se desmoronan. La costa asiática es nuestra herencia.\n\nHa llegado el momento de preparar una expedición para asegurar nuestro dominio sobre Asia para las generaciones venideras."

 caria_missions_task_21:0 "Dinastía de Derbe"
 caria_missions_task_21_DESC:0 "Las tierras altas de Licaonia siguen fracturadas y sin reclamar, una tierra salvaje de ciudades fortificadas, jefes tribales y fortalezas montañosas. Entre ellas se encuentra la ciudad de Derbe, situada cerca de los pasos entre Isauria y la llanura de Cilicia. Se equipará y financiará a un miembro de nuestra casa para una expedición a Derbe. Con suficiente oro, armas y [ROOT.GetCountry.GetAdjective] respaldo, puede hacerse un lugar como dinastía y unir la región a nuestra línea."
 caria_missions_task_21_tt:0 "#E ¡Derbe#! se convierte en un #E @[THIS.GetCountry.GetFlag]!  [THIS.GetCountry.GetAdjective]#! #Y Feudatorio#!"

 caria_missions_task_22:0 "Cultivando las tierras del interior"
 caria_missions_task_22_DESC:0 "Aunque nuestras ciudades costeras brillan con mármol, el verdadero cuerpo de [ROOT.GetCountry.GetName] se encuentra tierra adentro, en los valles, colinas y pueblos dispersos que alimentan nuestras ciudades y tripulan nuestros ejércitos. Debemos volver la mirada hacia los pastores, agricultores y colonos que sustentan nuestra fuerza. Con subvenciones modestas y una supervisión constante, podemos transformar el interior en el corazón palpitante del [ROOT.GetCountry.GetAdjective] poder. Que se construyan caminos a través de las colinas de Mylasa y se excaven pastos en el suelo pedregoso."
 caria_settlement_svalue_tt:0 "Tener al menos #Y 15#! edificios en #Y asentamientos#!. ([SCOPE.ScriptValue('caria_settlement_svalue')|R0]/#Y 10#!)"
 caria_missions_task_22_tt:0 "Cada #Y Asentamiento#! territorio de rango dentro de [GetProvince('(int32)1992').GetArea.GetRegion.GetName] o [GetProvince('(int32)1977').GetArea.GetRegion.GetName] obtendrá #G #E 2#!#! @freemen! #Y Hombres libres#! pops y #G #E 1#!#! @citizen! #Y Ciudadano#! pop"

 caria_missions_task_23:0 "El trono de Macedonia"
 caria_missions_task_23_DESC:0 "Los barones de Macedonia siempre han favorecido a los fuertes y capaces sobre los débiles y débiles. Si jugamos bien nuestra mano, nuestra línea aún puede resultar ser la más fuerte de todas. Sin embargo, si alguna vez queremos recuperar el legado de Alejandro, primero debemos apoderarnos de lo que queda de su reino, sacándolo de las garras de quienes lo llevaron a la ruina y crear en su lugar un estado nuevo y más robusto bajo el cual sirvan los macedonios diseminados por los restos destrozados del Imperio Argead."
 caria_missions_task_23_tt:0 "#G Desbloquea#! #T Misiones macedonias#!\nCompletar #T Maestría helénica#! #G Desbloquea#! #T Imperio helenístico#!"

 caria_missions_task_24:0 "Depósitos de conocimiento"
 caria_missions_task_24_DESC:0 "El mundo helenístico está plagado de enseñanzas de la filosofía, el arte, la historia y el aprendizaje, desde las obras de Platón hasta las Historias de Heródoto; Al otorgar financiación pública a las bibliotecas de nuestras principales ciudades, podemos establecer [ROOT.GetCountry.GetName] como un bastión para el conocimiento y el avance científico griego."
 caria_missions_task_24_tt:0 "Un experto estudioso viajará a nuestro país."

 caria_missions_task_25:0 "Estado de la marcha de la demanda"
 caria_missions_task_25_DESC:0 "La riqueza, el poder y el prestigio de [ROOT.GetCountry.GetName|G] nos sitúan por encima de otros #T sátrapas#!, y aunque ninguno de los bandos se sentiría cómodo admitiéndolo, los impuestos [ROOT.GetCountry.GetAdjective] podrían defenderse de los de su #T Señor Supremo#!.\n\nPorque somos fuertes, [ROOT.GetCountry.GetRuler.GetName|Y] considera que merecemos un estatuto especial y exigirá que se nos reconozca como tal; una provocación audaz."
 caria_missions_task_25_tt:0 "Podremos negociar un trato con nuestro #T Overlord#! #Y [THIS.GetCountry.GetOverlord.GetName]#! para convertirnos en #T #E Marche#!#!. [THIS.GetCountry.GetRuler.GetPraenomen] solicitará que se nos concedan privilegios especiales y recibiremos diferentes recompensas, dependiendo de cómo vayan las negociaciones."

