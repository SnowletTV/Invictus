l_spanish:

# Events

 me_dahae.1.t:0 "Reunión de clanes - Inicio"
 me_dahae.1.desc:0 "Con los líderes de los clanes ahora presentes, debemos hacernos una pregunta fundamental: ¿cómo debemos abordar la cuestión de la expansión? Hay muchas cosas que [ROOT.GetCountry.GetRuler.GetName] debe contemplar, ya que un movimiento en falso o un paso en falso ciertamente podría resultar contraproducente y hacer que [ROOT.GetCountry.GetRulerTitle] se convierta en un enemigo de por vida.\n\nNuestras elecciones aquí conducirán a diferentes bonificaciones que beneficiarán nuestro enfoque preferido."
 me_dahae.1.a:0 "Favorecer el enfoque diplomático."
 me_dahae.1.b:0 "Favorecer el enfoque contundente."

 me_dahae.2.t:0 "Reunión de clanes - Progreso"
 me_dahae.2.desc:0 "Mientras continúa la reunión, [ROOT.GetCountry.GetRuler.GetName] está satisfecho con la dirección que están tomando las conversaciones. Después de escuchar atentamente las últimas propuestas de los otros clanes, [ROOT.GetCountry.GetRuler.GetSheHe] se reúne con [ROOT.GetCountry.GetRuler.GetHerHis] asesores más cercanos y comparte instrucciones para el siguiente paso."
 me_dahae.2.a:0 "Debemos esforzarnos por tener una buena imagen."
 me_dahae.2.b:0 "¡Que todos sepan que vamos a ir!"

 me_dahae.3.t:0 "Reunión de clanes - Resultado"
 me_dahae.3.desc:0 "Una vez concluida la reunión de los clanes, nuestros [ROOT.GetCountry.GetAdjective] diplomáticos se han reunido con [ROOT.GetCountry.GetRuler.GetName] en [ROOT.GetCountry.GetCapital.GetName] para compartir los resultados."
 me_dahae.3.a:0 "Parece que las tribus quieren la guerra."
 me_dahae.3.b:0 "Parece que las tribus quieren una unificación cordial."
 me_dahae.3.tt:0 "Obtendremos #R reclamaciones sobre todas las demás tribus Dahae.#!"

 me_dahae.4.t:0 "Caballos de estepa"
 me_dahae.4.desc:0 "Los caballos esteparios @steppe_horses! son famosos por su tamaño y mansedumbre, y comerciantes de todo el mundo viajan a nuestros mercados con la esperanza de conseguir estas poderosas bestias para sus propios fines. Es bien sabido que [ROOT.GetCountry.GetName] tiene los mejores caballos de estepa disponibles en cualquier lugar, y tenemos la suerte de decir que tenemos manadas enteras de estos preciosos animales a nuestra disposición. \n\nComo tal, con tantos caballos preparados, lo apropiado es entrenarlos y utilizarlos de la manera que consideremos adecuada. Nuestros maestros de caballos han pedido a [ROOT.GetCountry.GetRuler.GetName] que decida cómo se educarán a nuestros animales; ¿Deberían centrarse en atacar a nuestros enemigos o defender nuestras formaciones de batalla?"
 me_dahae.4.a:0 "Debemos centrarnos en la ofensiva: ¡el único camino es avanzar!"
 me_dahae.4.b:0 "Sería prudente centrarse en tácticas defensivas."

 me_dahae.6.t:0 "Defender las tierras de Dahae"
 me_dahae.6.desc:0 "Esta madrugada llegaron noticias desalentadoras a [ROOT.GetCountry.GetCapital.GetName], llevadas por mensajeros que cabalgaron durante toda la noche para llegar a nuestra capital. Parece que [friendly_neighbor_target.GetName] fue atacado por [dahae_aggressor_target.GetName] y la amenaza de una guerra regional es mayor de lo que ha sido en la memoria reciente.\n\n[ROOT.GetCountry.GetRuler.GetName] tiene una decisión que tomar; ¿Deberíamos cabalgar para ayudar a nuestros vecinos amigos o deberíamos dejar esta situación en manos de los dioses?"
 me_dahae.6.a:0 "Este momento requiere nuestros cascos en el suelo."
 me_dahae.6.b:0 "Bueno... que peleen."

 me_dahae.7.t:0 "Cetrería Esteparia - Principio"
 me_dahae.7.desc:0 "Cazar con halcones es uno de los mayores placeres que disfruta un guerrero [ROOT.GetCountry.GetAdjective], además de demostrar su valía en el combate. [ROOT.GetCountry.GetRuler.GetName] ha decidido organizar tal desafío para elevar nuestra posición diplomática ante los demás jefes tribales. Y si [ROOT.GetCountry.GetRuler.GetFirstName] logra ganar este evento, entonces la fama de nuestro jefe se extenderá por todas partes: una bendición para los miembros de la tribu de [ROOT.GetCountry.GetName]."
 me_dahae.7.a:0 "¡Organizamos el mayor desafío de cetrería!"

 me_dahae.8.t:0 "Cetrería Esteparia - Invitaciones"
 me_dahae.8.desc:0 "Antes de embarcarnos en la caza del halcón, obviamente necesitamos enviar invitaciones. ¿Cuánto esfuerzo deberíamos poner en ello? Es bien sabido que ofrecer un pequeño obsequio junto con nuestra solicitud hará que sea más difícil rechazarlo, pero todo depende de si [ROOT.GetCountry.GetRuler.GetName] tiene ganas de echar mano del tesoro."
 me_dahae.8.a:0 "Enviar invitaciones periódicas"
 me_dahae.8.b:0 "Enviar invitaciones con regalos."
 me_dahae.8.b.tt:0 "Es mucho más probable que otros líderes tribales acepten."

 me_dahae.8000.t:0 "[dahae_host.GetEmployer.GetName] Actividad de cetrería"
 me_dahae.8000.desc:0 "[ROOT.GetCountry.GetRuler.GetName], hemos recibido un mensaje de [dahae_host.GetName] - parece que [dahae_host.GetAdjective] [dahae_host.GetRulerTitle] está planeando una #E caza de halcones#! y quiere que te unas a las festividades. ¿Deberíamos aceptar la invitación de [dahae_host.GetFirstName]?"
 me_dahae.8000.a:0 "¡Preparémonos entonces!"
 me_dahae.8000.a.tt:0 "Aceptaremos la invitación."
 me_dahae.8000.b:0 "Diles que se diviertan."
 me_dahae.8000.b.tt:0 "Rechazaremos la invitación."

 me_dahae.9.t:0 "Cetrería esteparia - Respuestas"
 me_dahae.9.desc:0 "Los enviados enviados por [ROOT.GetCountry.GetRuler.GetName] han comenzado a regresar a [ROOT.GetCountry.GetCapital.GetName], y ahora veremos quién está dispuesto a unirse a nuestro [ROOT.GetCountry.GetRulerTitle] en la caza del halcón."
 me_dahae.9.a:0 "A ver quién aceptó..."
 me_dahae.9.a.1t:0 "[attendee_1.GetName] de [attendee_1.GetCountry.GetName] @[attendee_1.GetCountry.GetFlag]! invitación aceptada."
 me_dahae.9.a.2t:0 "[attendee_2.GetName] de [attendee_2.GetCountry.GetName] @[attendee_2.GetCountry.GetFlag]! invitación aceptada."
 me_dahae.9.a.3t:0 "[attendee_3.GetName] de [attendee_3.GetCountry.GetName] @[attendee_3.GetCountry.GetFlag]! invitación aceptada."
 me_dahae.9.a.4t:0 "[attendee_4.GetName] de [attendee_4.GetCountry.GetName] @[attendee_4.GetCountry.GetFlag]! invitación aceptada."
 me_dahae.9001.t:0 "Cetrería esteparia - Fracaso"
 me_dahae.9001.desc:0 "Bueno, parece que nadie estaba interesado en presentarse a la caza del halcón. Las excusas ofrecidas a [ROOT.GetCountry.GetRuler.GetName] fueron patéticas y nuestros parientes se ríen de nuestro [ROOT.GetCountry.GetRulerTitle] a [ROOT.GetCountry.GetRuler.GetHerHis] espaldas. Entonces tal vez queramos repensar si la diplomacia es una opción aquí."
 me_dahae.9001.a:0 "Esto es vergonzoso..."
 me_dahae.9001.a.tt:0 "La #Y Caza del Halcón#! será #R Cancelada#!."
 me_dahae.9002.t:0 "Cetrería esteparia - Llegada de los invitados"
 me_dahae.9002.desc:0 "Ay que delicia ver a todos reunidos y unidos en el amor por el kumis y la caza. Lo único que queda es entretener a la multitud, lo que debería dar dividendos en el futuro."
 me_dahae.9002.a:0 "¡Celebremos esta ocasión trascendental!"
 me_dahae.9002.a.tt:0 "La #Y Caza del halcón#! comenzará en un par de semanas."

 me_dahae.1001.t:0 "Cetrería esteparia - Amigo en el campamento"
 me_dahae.1001.desc:0 "Durante los últimos días, [attendee_1.GetCountry.GetRuler.GetName] se hizo buen amigo de [ROOT.GetCountry.GetRuler.GetName], participando en la diplomacia en su máxima expresión. A menudo se los ve caminando juntos, intercambiando historias de guerra y riéndose de los chistes del otro, y ambos líderes han estado brindando por la salud del otro con leche de yegua fermentada cada vez que se presenta la ocasión."
 me_dahae.1001.a:0 "¡Levantemos nuestras copas de deliciosos Kumis!"
 me_dahae.1002.t:0 "Cetrería esteparia - Broma desafortunada"
 me_dahae.1002.desc:0 "Esta mañana hubo un incidente que [ROOT.GetCountry.GetRuler.GetName] quisiera olvidar lo antes posible; Cuando todos escuchaban [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetSheHe] hizo una broma que no llegó a entender la audiencia. Otros líderes tienen suficiente tacto para no ofenderse demasiado, pero esto no mejora nuestra posición entre ellos de todos modos."
 me_dahae.1002.a:0 "Bueno, esto es vergonzoso..."

 me_dahae.11.t:0 "Cetrería esteparia: avanzando"
 me_dahae.11.desc:0 "Ha llegado el momento de abandonar la comodidad del campamento y comenzar lo que todos estaban esperando; la #E Caza del Halcón#!. [ROOT.GetCountry.GetRuler.GetName] ha reunido [ROOT.GetCountry.GetRuler.GetHerHis] séquito y se está preparando para liderar a los guerreros a la vasta estepa.\n Nuestras posibilidades de éxito actuales: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.11.a:0 "¡Sigamos adelante!"
 me_dahae.11.a.t:0 "#T Se iniciará la actividad de cetrería.#!"

 me_dahae.12.t:0 "Cetrería esteparia - Campamento de construcción"
 me_dahae.12.desc:0 "Después de horas de cabalgar a través de la interminable extensión de la estepa, [ROOT.GetCountry.GetRuler.GetName] ha decidido que hemos encontrado un buen lugar desde el cual podemos localizar presas, y [ROOT.GetCountry.GetRulerTitle] dio órdenes de construir un campamento aquí.\n\nNuestra actual probabilidad de éxito: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.12.a:0 "Descansemos un rato y miremos a nuestro alrededor."

 me_dahae.1301.t:0 "Cetrería esteparia - Accidente de caza"
 me_dahae.1301.desc:0 "El cuerpo del niño de [ROOT.GetCountry.GetRuler.GetName] ha sido envuelto en una tela blanca que ahora está teñida de rojo con su sangre vital. Dicen que [heir_scope.GetName] fue encontrado junto a su caballo, en un pequeño claro con algunos árboles dispersos; [ROOT.GetCountry.GetRuler.GetFirstName] conoce el lugar del que hablan. En la muerte, el rostro de [heir_scope.GetFirstName] está tranquilo, casi sereno, y el devastado [ROOT.GetCountry.GetRulerTitle] extendió una mano temblorosa para acariciar la pálida frente de [heir_scope.GetHerHis].\n\nDe repente, la terrible realidad de la situación se dio cuenta de [ROOT.GetCountry.GetRuler.GetFirstName], y [ROOT.GetCountry.GetRuler.GetSheHe] comenzó a llorar. Silenciosamente.\n\nNuestra probabilidad de éxito actual: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1301.a:0 "El dolor te alcanza."
 me_dahae.1301.b:0 "Ah bueno..."

 me_dahae.1302.t:0 "Cetrería esteparia - Tienda del chamán"
 me_dahae.1302.desc:0 "Mientras estábamos de caza, [ROOT.GetCountry.GetRuler.GetName] encontró la tienda de un ermitaño, [hermit_scope.GetName], un hombre profundamente religioso conocido por los lugareños por su devoción a los dioses. ¿Cómo debemos acercarnos a él? Quizás podamos convencer al ermitaño para que nos otorgue una bendición.\n\nNuestra probabilidad de éxito actual: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1302.a:0 "Entremos y pidamos el favor divino."
 me_dahae.1302.b:0 "Invítalo a unirse a nuestra corte."
 me_dahae.1302.b.tt:0 "[hermit_scope.GetName] se unirá a su corte."

 me_dahae.1303.t:0 "Cetrería esteparia - Cazadores furtivos"
 me_dahae.1303.desc:0 "Una mala noticia rompe el silencio de la mañana; mientras se arrastraba entre la hierba alta, [ROOT.GetCountry.GetRuler.GetName] encontró algunos cazadores furtivos; viles criminales que van contra las leyes de la estepa. Se sabe que estos terrenos de caza son un lugar sagrado, reservado para el uso de los jefes tribales, y nuestros parientes saben que no deben recorrer estos territorios con la esperanza de encontrar presas. Se debe aplicar un castigo de inmediato.\n\nNuestra probabilidad de éxito actual: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1303.a:0 "Cuélgalos."
 me_dahae.1303.b:0 "Pregúnteles qué saben sobre las aves por aquí."

 me_dahae.1304.t:0 "Cetrería esteparia - Misión secundaria del pájaro"
 me_dahae.1304.desc:0 "Mientras el halcón de [ROOT.GetCountry.GetRuler.GetName] estaba volando, parece que el pájaro de [ROOT.GetCountry.GetRuler.GetHerHis] encontró una presa valiosa. Esta es una buena señal: debemos estar cada vez más cerca de nuestro objetivo. \n\nNuestra probabilidad de éxito actual: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1304.a:0 "¡Genial!"

 me_dahae.1305.t:0 "Cetrería esteparia: envía tu pájaro"
 me_dahae.1305.desc:0 "Para aumentar [ROOT.GetCountry.GetRuler.GetHerHis] las posibilidades de encontrar presas dignas, [ROOT.GetCountry.GetRuler.GetName] puede enviar a [ROOT.GetCountry.GetRuler.GetHerHis] pájaro a explorar. \n\nNuestra probabilidad de éxito actual: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1305.a:0 "¡Envía al halcón con oraciones por el éxito!"
 me_dahae.1305.tt:0 "El resultado depende de la suma de las habilidades marciales@military_icon! y delicadeza@civic_icon! de tu gobernante."
 me_dahae.1305.b:0 "Deberíamos centrarnos en el seguimiento en lugar de perseguir la vanagloria."

 me_dahae.1306.t:0 "Cetrería esteparia - [attendee_1.GetName] Atrapado"
 me_dahae.1306.desc:0 "¡Parece que [attendee_1.GetName] quedó atrapado debajo de un caballo y debemos ayudarlo de inmediato! ¿Pero cómo? \n\nNuestra probabilidad de éxito actual: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1306.a:0 "No hay tiempo para parar: [attendee_1.GetFirstName] está solo [attendee_1.GetHerHis]"
 me_dahae.1306.b:0 "¡Llame a su boticario!"
 me_dahae.1306.tt:0 "El resultado depende de la habilidad@civic_icon! de tu #T boticario#!."

 me_dahae.1307.t:0 "Cetrería Esteparia - Pavo real"
 me_dahae.1307.desc:0 "Mientras el grupo de caza vadea un pequeño río, otros participantes en la caza quieren mostrar sus habilidades y han pedido una distracción momentánea; típica grandilocuencia de los [ROOT.GetCountry.GetAdjective] guerreros, que constantemente intentan superarse unos a otros en hazañas de gloria. [ROOT.GetCountry.GetRuler.GetName] no puede darse el lujo de perder; [ROOT.GetCountry.GetRuler.GetSheHe] debe ganar esta prueba o ser humillado ante todos. El objetivo es que un halcón arrebate un pez de las aguas turbulentas. \n\nNuestra probabilidad de éxito actual: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1307.a:0 "Envía a mi pájaro a cazarlo."
 me_dahae.1307.tt:0 "El resultado depende de la suma de carisma@oratory_icon! y celo@religious_icon! habilidades de tu gobernante."
 me_dahae.1307.b:0 "Intenta agarrar el pescado tú mismo."

 me_dahae.1308.t:0 "Cetrería esteparia: el pájaro quiere volar"
 me_dahae.1308.desc:0 "El cielo está nublado y una tormenta que avanza rápidamente amenaza con desatar su furia sobre la partida de caza. Es un momento poco propicio para dejar salir a tu pájaro, pero parece estar inquieto y graznando constantemente. Si el halcón no encuentra nada, podría dañar la reputación de [ROOT.GetCountry.GetRuler.GetName]. ¿Debería [ROOT.GetCountry.GetRuler.GetSheHe] liberarlo? \n\nNuestra probabilidad de éxito actual: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1308.a:0 "Déjalo volar a los cielos"
 me_dahae.1308.b:0 "Centrarse en el seguimiento"

 me_dahae.1309.t:0 "Cetrería esteparia: ¿tu pájaro es estúpido?"
 me_dahae.1309.desc:0 "El halcón de [ROOT.GetCountry.GetRuler.GetName] ha encontrado un árbol alto y se está posando en sus ramas más altas, y nada convence al pájaro de volver al brazo de [ROOT.GetCountry.GetRuler.GetFirstName]; Ni siquiera los regalos de carne seca pueden convencer al necio animal. Todo el mundo se ríe del mal comportamiento de [ROOT.GetCountry.GetRulerTitle] y [ROOT.GetCountry.GetRuler.GetHerHis], lo que hace que las mejillas de [ROOT.GetCountry.GetRuler.GetFirstName] se pongan de un rojo brillante.\n\nSi [ROOT.GetCountry.GetRuler.GetName] intenta agarrar al halcón de su percha y falla, [ROOT.GetCountry.GetRuler.GetSheHe] parecerá un tonto, pero dejar al pájaro en paz dañará la reputación de [ROOT.GetCountry.GetRulerTitle]. \n\nNuestra probabilidad de éxito actual: #Y [ROOT.GetCountry.MakeScope.GetVariable('dahae_hunt_success_chance').GetValue|0]%#!"
 me_dahae.1309.a:0 "Subiré e intentaré agarrar esa maldita cosa yo mismo."
 me_dahae.1309.b:0 "Tal vez regrese por sí solo."

 me_dahae.1601.t:0 "Cetrería esteparia - Resultados"
 me_dahae.1601.desc:0 "La #E Caza del Halcón#! ha llegado a su fin y el pájaro de [ROOT.GetCountry.GetRuler.GetName] logró capturar un gran halcón, ¡un animal sagrado para nuestro pueblo! El luchador halcón del [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] de alguna manera mató a un pájaro del doble de su tamaño y llevó su cadáver a [ROOT.GetCountry.GetRuler.GetFirstName], provocando oleadas de agradecimiento por todo el anfitrión reunido. Esta cacería seguramente será recordada por todos."
 me_dahae.1601.a:0 "¡Gran éxito!"
 me_dahae.1601.a.t:0 "La #Y caza del halcón#! termina."

 me_dahae.1602.t:0 "Cetrería esteparia - Resultados"
 me_dahae.1602.desc:0 "A pesar de cabalgar por la estepa durante horas y enviar al halcón media docena de veces, [ROOT.GetCountry.GetRuler.GetName] no logró atrapar ninguna presa. Algunos miembros de la banda afirmaron que esta falta de éxito era un mal presagio, pero [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] descartó esto como una charla inútil y les dijo a todos que era hora de regresar a [ROOT.GetCountry.GetCapital.GetName]."
 me_dahae.1602.a:0 "Oh bueno... ganar no era la prioridad aquí."
 me_dahae.1602.a.t:0 "La #Y caza del halcón#! termina."

 me_dahae.18.t:0 "La Cumbre de la Estepa - Inicio"
 me_dahae.18.desc:0 "Ahora, con la caza completa y las relaciones diplomáticas firmemente establecidas entre [ROOT.GetCountry.GetName] y nuestros vecinos, ha llegado el momento de centrarse en la tarea más importante: convencer a todos de que #E Dahae#! debe ser una #E Confederación tribal#!."
 me_dahae.18.a:0 "enviar invitaciones"

 me_dahae.1800.t:0 "[dahae_host.GetEmployer.GetName] Cumbre Diplomática"
 me_dahae.1800.desc:0 "[ROOT.GetCountry.GetRuler.GetName], recibimos otra invitación de nuestros vecinos, que convocan una cumbre diplomática en su capital."
 me_dahae.1800.a:0 "Aceptar"
 me_dahae.1800.b:0 "Rechazar"

 me_dahae.19.t:0 "La Cumbre de la Estepa - Respuestas"
 me_dahae.19.desc:0 "Los emisarios que enviamos a otras tribus han regresado a [ROOT.GetCountry.GetCapital.GetName] con noticias importantes y [ROOT.GetCountry.GetRuler.GetName] está ansioso por ver quién está dispuesto a reunirse con nuestros diplomáticos para discutir nuestro futuro compartido."
 me_dahae.19.a:0 "A ver quién quiere entrar."

 me_dahae.1901.t:0 "La Cumbre de la Estepa - El fracaso"
 me_dahae.1901.desc:0 "Bueno, parece que la diplomacia fracasó y nadie fuera de [ROOT.GetCountry.GetName] quiere una #E Confederación Dahae#! unida y fuerte... así que ahora le corresponde a [ROOT.GetCountry.GetRuler.GetName] asegurarse de que esta iniciativa se haga realidad."
 me_dahae.1901.a:0 "Ah bueno..."
 me_dahae.1901.a.tt:0 "It seems we have to unify # Dahae#! by force."

 me_dahae.1902.t:0 "La Cumbre de la Estepa: debate sobre la formación común"
 me_dahae.1902.desc:0 "Ahora que los anfitriones reunidos se han reunido en [ROOT.GetCountry.GetCapital.GetName] para discutir nuestro futuro juntos, la primera discusión se centra en la cuestión de si nuestros impuestos deben entrenar juntos o no. Esto también aumentará el sentimiento de hermandad entre las tribus, pero hay quienes creen que se trata de una estratagema de [ROOT.GetCountry.GetRuler.GetName] para hacerse con el control de los impuestos [ROOT.GetCountry.GetRuler.GetHerHim] auto."
 me_dahae.1902.a:0 "Solicite su aceptación."
 me_dahae.1902.att:0 "Intentaremos persuadir a todos con delicadeza."
 me_dahae.1902.b:0 "Dedique un poco de esfuerzo a esto."
 me_dahae.1902.btt:0 "Les ejerceremos presión, lo que aumentará las posibilidades de aceptación."

 me_dahae.2000.t:0 "Discutir la capacitación común"
 me_dahae.2000.desc:0 "El primer orden del día es sencillo, pero nuestra decisión tendrá importantes ramificaciones para el futuro. ¿Deberíamos aceptar un entrenamiento común con las otras tribus #E Dahae#!?"
 me_dahae.2000.a:0 "No veo nada malo en esto...si"
 me_dahae.2000.b:0 "¡Nunca aceptaremos tales términos!"

 me_dahae.20.t:0 "La Cumbre de la Estepa - Respuestas de capacitación"
 me_dahae.20.desc:0 "Las asambleas reunidas han discutido en privado las propuestas expuestas por [ROOT.GetCountry.GetRuler.GetName], y ha llegado el momento de ver si nuestros esfuerzos diplomáticos darán algún fruto. Dependiendo de cuántos países aceptaron la formación unificada, [ROOT.GetCountry.GetName] recibirá una bonificación progresiva."
 me_dahae.20.a:0 "Veamos cuántos de nuestros vecinos son sabios."
 me_dahae.20.a.tt1:0 "[attendee_1.GetName] de [attendee_1.GetCountry.GetName] @[attendee_1.GetCountry.GetFlag]! aceptado."
 me_dahae.20.a.tt2:0 "[attendee_2.GetName] de [attendee_2.GetCountry.GetName] @[attendee_2.GetCountry.GetFlag]! aceptado."
 me_dahae.20.a.tt3:0 "[attendee_3.GetName] de [attendee_3.GetCountry.GetName] @[attendee_3.GetCountry.GetFlag]! aceptado."
 me_dahae.20.a.tt4:0 "[attendee_4.GetName] de [attendee_4.GetCountry.GetName] @[attendee_4.GetCountry.GetFlag]! aceptado."
 me_dahae.20.b:0 "Esto fue un fracaso total, porque nadie aceptó"

 me_dahae.21.t:0 "La Cumbre de la Estepa - Debate sobre la cultura común"
 me_dahae.21.desc:0 "A continuación tenemos que discutir cuánto hay en común entre nuestras tribus con la esperanza de convencer a todos de que, ante todo, todos somos Dahae."
 me_dahae.21.a:0 "Solicite su aceptación."
 me_dahae.21.att:0 "Intentaremos persuadir a todos con delicadeza."
 me_dahae.21.b:0 "Dedique un poco de esfuerzo a esto."
 me_dahae.21.btt:0 "Ejerceremos presión, lo que aumentará las posibilidades de aceptación."

 me_dahae.2100.t:0 "Discutir la cultura común"
 me_dahae.2100.desc:0 "El siguiente punto del orden del día tiene que ver con nuestros vínculos culturales; ¿Deberíamos aceptar que existe una identidad #E Dahae#! común?"
 me_dahae.2100.a:0 "¡Por supuesto que sí!"
 me_dahae.2100.b:0 "No somos las mismas personas; tenemos diferencias"

 me_dahae.22.t:0 "La Cumbre de la Estepa - Respuestas culturales comunes"
 me_dahae.22.desc:0 "Una por una, las respuestas de los jefes reunidos se informan a [ROOT.GetCountry.GetRuler.GetName]."
 me_dahae.22.a:0 "A ver quién quiere participar en eso."

 me_dahae.23.t:0 "La Cumbre de la Estepa - Discute la Confederación"
 me_dahae.23.desc:0 "Después de días de cuidadosa deliberación y festines casi interminables, los jefes reunidos se enfrentan a la cuestión final, la verdadera razón por la que han sido convocados a [ROOT.GetCountry.GetCapital.GetName]: ¿se debe permitir que exista la #E Confederación Dahae#!?"
 me_dahae.23.a:0 "Pide su aceptación"
 me_dahae.23.a.tt:0 "Trataremos gentilmente de persuadir a todos para que sigan nuestro ejemplo."
 me_dahae.23.b:0 "¡Dedica un poco de esfuerzo a esto! es muy importante"
 me_dahae.23.b.tt:0 "Presionaremos a los Chieftains, lo que aumentará las posibilidades de aceptación."

 me_dahae.2300.t:0 "Discutir la unificación"
 me_dahae.2300.desc:0 "Hemos recibido una solicitud impetuosa del #E Consejo Tribal#!, una solicitud que dará forma al destino de [ROOT.GetCountry.GetName] para las generaciones venideras. ¿Deberíamos aceptar formar parte de la #E Confederación Dahae#! o deberíamos rechazar la invitación de unir fuerzas con nuestros vecinos?"
 me_dahae.2300.a:0 "¿Quiénes somos nosotros para interponernos en el camino de la historia? si"
 me_dahae.2300.a.tt:0 "#R El juego terminará para nosotros.#!"
 me_dahae.2300.b:0 "¡Absolutamente no!"
 me_dahae.2300.b.tt:0 "¡#R [dahae_host.GetEmployer.GetName] obtendrá derechos sobre nosotros!#!"

 me_dahae.24.t:0 "La Cumbre de la Estepa - Respuestas de unificación"
 me_dahae.24.desc:0 "Y con el último problema resuelto, la reunión de las #E Tribus Dahae#! está llegando a su fin. Los Ancianos que viven en [ROOT.GetCountry.GetCapital.GetName] no recuerdan haber presenciado nunca una #E Conferencia#! como la que acaba de concluir, y muchos creen que [ROOT.GetCountry.GetRuler.GetName] acaba de hacer [ROOT.GetCountry.GetAdjective] historia."
 me_dahae.24.a:0 "Estoy destinado a hacer cosas aún mayores..."
 me_dahae.24.a.tt:0 "Las tribus que hayan aceptado se convertirán en nuestros #T vasallos tribales#!.\nObtendremos #R reclamaciones#! sobre las tribus que nos rechazaron o no participaron en la #Y Conferencia.#!"
 me_dahae.24.b:0 "Se trata de un revés, pero sólo temporal."
 me_dahae.24.b.tt:0 "La conferencia #R falló#!; nadie estuvo de acuerdo. Por desgracia, parece que tenemos que convencer a todos de nuestra causa a través de arcos y cascos..."

 me_dahae.25.t:0 "Ascenso de Arsaces"
 me_dahae.25.desc:0 "Con la unificación de las tribus #E Dahae#! completada, también se avecinan grandes cambios sociales, y [ROOT.GetCountry.GetRuler.GetName] está completamente preparado para aprovechar estos tiempos caóticos. Nuestra [ROOT.GetCountry.GetRulerTitle], junto con [ROOT.GetCountry.GetRuler.GetHerHis] toda la familia, tomará nuevos nombres, para que puedan quedar grabados en los anales de la historia para que todos los recuerden.\n\nA medida que los miembros de la tribu de [ROOT.GetCountry.GetName] se están aclimatando a los muchos cambios que se les imponen, también podemos aprovechar esta oportunidad para mejorar en gran medida nuestra capital para convertirla en un campamento adecuado desde el cual gobernaremos, o podemos acercarnos a los asentamientos. Provincias con la esperanza de hacer avanzar nuestra agenda."
 me_dahae.25.a:0 "Acerquemos la capital a nuestra próxima presa."
 me_dahae.25.a.tt:0 "Parthaunisa ganará #T 3 ciudadanos#!."
 me_dahae.25.b:0 "Nuestra capital se convertirá en un centro para controlarlo todo."
 me_dahae.25.b.tt:0 "Nuestra capital obtendrá un modificador #G que anulará la penalización por terreno#! por la capacidad de población y otorgará una #G bonificación adicional del 10 %#! a la #Y capacidad de población#!."
 me_dahae.25.b.tt2:0 "Nuestra capital ganará #T 3 ciudadanos#!."
 me_dahae.27.t:0 "Invertir en aliados"
 me_dahae.27.desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha propuesto la posibilidad de que nuestros ingenieros construyan una #E finca de esclavos#! junto con nuestro aliado; Cubriremos solo la mitad del costo y compartiremos nuestra experiencia técnica y conocimientos con nuestros amigos, y este acto de emprendimiento y compromiso seguramente mejorará nuestra posición entre las tribus #E Dahae#!."
 me_dahae.27.a:0 "¡[dahae_jv1.GetName] seguramente estará satisfecho!"
 me_dahae.27.a.tt:0 "[dahae_jv1.GetName] obtendrá una #T finca de esclavos#! en una provincia aleatoria."

 me_dahae.100.t:0 "$dahae_missions_1$"
 me_dahae.100.desc:0 "Si bien nuestro estilo de vida puede ser duro, no somos monstruos; Si bien nuestra ambición puede ser grande, no es incontrolable.\n\nSi bien [ROOT.GetCountry.GetRuler.GetName] puede querer unir a nuestras tribus vecinas para lograr cosas mayores para todos nosotros, [ROOT.GetCountry.GetRuler.GetSheHe] primero debe pensar seriamente si el camino a seguir implica derramar la sangre de nuestros parientes. Por lo que sabe [ROOT.GetCountry.GetRuler.GetFirstName], nuestros vecinos miran las mismas estrellas por la noche y tienen los mismos sueños que nosotros; no somos los únicos que deseamos una vida más allá de la silla de montar y la estepa.\n\nSin embargo, lo contrario también puede ser cierto, y nuestros primos pueden no ser dignos de confianza: una espina clavada en nuestra espalda donde esperamos encontrar una mano amiga. Si este es el caso, entonces [ROOT.GetCountry.GetRuler.GetFirstName] será mejor aplastarlos como humildes ratones bajo [ROOT.GetCountry.GetRuler.GetHerHis] cascos. Debemos descubrir sus verdaderas intenciones antes de que sea demasiado tarde."
 me_dahae.100.a:0 "Un verdadero dilema..."

 me_dahae.101.t:0 "Conquista [c1_scope.GetName]"
 me_dahae.101.desc:0 "Las secuelas de las batallas entre nuestros [ROOT.GetCountry.GetAdjective] jinetes y los patéticos [c1_scope.GetAdjective] pony-men serán recordadas en canciones para las generaciones venideras. Aunque se reunieron valientemente con la esperanza de conservar su libertad, los ejércitos de [ROOT.GetCountry.GetRuler.GetName] se estrellaron contra las fuerzas de [c1_scope.GetName|E] y las dispersaron como cenizas al viento.\n\nTan grande fue la matanza que muchos de los enemigos cayeron muertos de la parte trasera de sus monturas, y se dice que se podía ver galopando a estos caballos sin jinete, con los ojos muy abiertos por el terror y los pelajes salpicados de espuma. A través de las extensas praderas de la estepa, arrastrando sus alforjas detrás de ellos."
 me_dahae.101.a:0 "¡Aquellos que se opongan a mí sufrirán un destino peor que la muerte!"

 me_dahae.102.t:0 "Poseer todas las [c2_scope.GetAdjective] tierras"
 me_dahae.102.desc:0 "[c2_scope.GetName] cae en manos de nuestros ejércitos, y una procesión de los conquistados se presenta ante [ROOT.GetCountry.GetRuler.GetName]. El aire se llena con el sonido de los lamentos de los prisioneros, y el [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] los observa hacer sus súplicas de clemencia con frío desinterés, sin impresionarse por la lamentable exhibición.\n\nMomentos después, hay una fuerte conmoción desde el final de la fila, y nuestros soldados enojados dispersan la multitud reunida y arrastran a un prisionero ante [ROOT.GetCountry.GetRuler.GetFirstName]. Este alborotador, un hombre llamado [SCOPE.sChar('dahae_warrior_scope').GetFirstName], un ex soldado de los ejércitos [c2_scope.GetAdjective], ofrece una gran suma de oro a cambio de protección para su familia.\n\nA decir verdad, a [ROOT.GetCountry.GetRuler.GetFirstName] no le importa un comino el destino de otro grupo de personas vencidas, pero el dinero ofrecido ha levantado [ROOT.GetCountry.GetRuler.GetHerHis] las cejas."
 me_dahae.102.a:0 "Hoy es tu día de suerte, [SCOPE.sChar('dahae_warrior_scope').GetFirstName]..."
 me_dahae.102.b:0 "No tengas piedad del perro dahaeano"
 me_dahae.102.tt:0 "¡La tarea ha sido completada!"

 me_dahae.103.t:0 "$dahae_missions_4$"
 me_dahae.103.desc:0 "Mientras nuestros ejércitos avanzaban por las tierras que anteriormente estaban en manos de los #E [c3_scope.GetName] ns#!, nuestros caballos estaban bien alimentados y nuestros hombres fueron recibidos con un espíritu de generosidad y brazos abiertos; todo lo que sus corazones deseaban les era dado, sin expectativa de recompensa.\n\nParece que no todos entre los #E Dahae#! las tribus están ciegas a nuestra visión, y los miembros de las tribus de [c3_scope.GetName] parecen reconocer que sólo los poderosos [ROOT.GetCountry.GetAdjective] tienen los medios necesarios para pasar de beber leche de yegua a ser alimentados por los sirvientes más bellos; Quizás, después de nuestras futuras conquistas, recompensemos más a [c3_scope.GetAdjective] entre las otras tribus..."
 me_dahae.103.a:0 "Nos encanta ver esto"

 me_dahae.104.t:0 "$dahae_missions_5$"
 me_dahae.104.desc:0 "El ejército [ROOT.GetCountry.GetAdjective] derrota a sus enemigos una vez más. Somos más rápidos, más ágiles y más organizados que nuestros vecinos, a pesar de ser más numerosos, y las otras [GetCulture('derbiccan').GetName] tribus no son rival para nosotros. [ROOT.GetCountry.GetRuler.GetName] está demostrando [ROOT.GetCountry.GetRuler.GetHerHim] rápidamente ser el verdadero líder de nuestra confederación, y las ambiciones de los jefes menores yacen en el suelo entre la sangre y los miembros de sus partidarios más leales.\n\nNuestras victorias son tan impresionantes que los extranjeros de estas tierras inmediatamente nos respetan y adoptan nuestras costumbres, y hay un gran número de colonos que siguen los pasos de nuestros ejércitos, confiados en que nuestras victorias les traerán oportunidades en las tierras que sometemos."
 me_dahae.104.a:0 "Hacia la próxima conquista..."

 me_dahae.105.t:0 "$dahae_missions_7$"
 me_dahae.105.desc:0 "[ROOT.GetCountry.GetCapital.GetName] estos días parece un centro comercial; tantas caras despedidas y tantas llegando. Pero no somos comerciantes, y los que se van son enviados y desterrados, mientras que los que llegan son leales a la Confederación que ahora gobierna todas las [GetCulture('derbiccan').GetName] tierras. [SCOPE.sChar('dahae_arbitrator').GetName], el #E Árbitro#! encargado de garantizar que nuestros planes se implementaran sin problemas, parece bastante orgulloso del trabajo [SCOPE.sChar('dahae_arbitrator').GetHerHis].\n\nPolíticamente, lograr que nuestro Consejo Tribal gobierne de manera efectiva no es una tarea fácil, ya que hemos ampliado nuestras tierras más de tres veces y las personas que gobernamos no esperan pastar en los mismos pastos por mucho tiempo. A pesar de las dificultades inherentes que conlleva la gestión de hordas migratorias, hemos logrado grandes avances en la unión de las tribus y [ROOT.GetCountry.GetRuler.GetFirstName] está satisfecho con [SCOPE.sChar('dahae_arbitrator').GetFirstName]."
 me_dahae.105.a:0 "Realmente te has superado esta vez."

 me_dahae.106.t:0 "$dahae_missions_8$"
 me_dahae.106.desc:0 "Si bien el cocinero está muy satisfecho con la cantidad de trabajo que ha tenido últimamente, la factura astronómica de todos los banquetes de [ROOT.GetCountry.GetRuler.GetName] haría llorar a cualquiera. La atroz cantidad de animales muertos que han tenido que ser cazados para estas pequeñas fiestas ha dejado algunos lugares completamente despoblados de vida: un logro notable.\n\nAun así, además de estos pequeños detalles, parece que [ROOT.GetCountry.GetRuler.GetFirstName] está satisfecho, y [ROOT.GetCountry.GetRuler.GetHerHis] sus compañeros abandonan las tiendas de fiesta no sólo tropezando, sino riendo a carcajadas y cantando canciones de batalla. Estos guerreros pasarán el resto de la noche ante el fuego, bebiendo más vino y alabando el nombre del generoso [ROOT.GetCountry.GetRuler.GetFirstName]. Muestras de opulencia como esta están arraigadas en las mentes de nuestros compañeros de tribu que [ROOT.GetCountry.GetName] serán capaces de tratarlos adecuadamente y llevarlos lejos."
 me_dahae.106.a:0 "Estamos intensificando"

 me_dahae.107.t:0 "$dahae_missions_9$"
 me_dahae.107.desc:0 "Si bien es bastante fácil obsequiar a nuestros parientes con alcohol y hermosas bailarinas para comprar su lealtad, lograr que las otras tribus confíen en nosotros por completo es un proceso mucho más delicado. Convencer a nuestros vecinos para que cambien de opinión acerca de nosotros no es una tarea fácil, especialmente cuando cada tribu tiene muchos clanes, y nuestro árbitro principal [SCOPE.sChar('dahae_arbitrator2').GetName] ha estado trabajando largas jornadas y está agotado por los [SCOPE.sChar('dahae_arbitrator2').GetHerHis] esfuerzos, prefiriendo quedarse en la tienda cuando no discute los detalles de los tratados que estamos celebrando.\n\nEntre las visitas de nuestros enviados, la recepción y la entrega de regalos y supervisión de sacrificios a [GetDeityDefinition('omen_patampasa').GetName], los diplomáticos de [ROOT.GetCountry.GetName] han ido más allá para garantizar que una paz duradera se establezca en las estepas."
 me_dahae.107.a:0 "¡Cualquier precio que tengamos que pagar vale su peso en oro!"

 me_dahae.108.t:0 "$dahae_missions_14$"
 me_dahae.108.desc:0 "[ROOT.GetCountry.GetRuler.GetName] es ahora el amo indiscutible de un vasto reino, con muchas tribus divididas que se someten al gobierno de [ROOT.GetCountry.GetCapital.GetName]. Nuestros antiguos enemigos ahora son esclavos de nuestros proyectos más importantes, todo porque se negaron a aceptar la clemencia de [ROOT.GetCountry.GetRuler.GetFirstName] y ahora yacen postrados a [ROOT.GetCountry.GetRuler.GetHerHis] pies, suplicando clemencia. Los caprichos de [ROOT.GetCountry.GetRuler.GetFirstName] son sus órdenes, y los miembros de las tribus de los clanes rebeldes [GetCulture('derbiccan').GetName], en su alboroto e ignorancia, han perdido su libertad al intentar oponerse a [ROOT.GetCountry.GetName].\n\n[SCOPE.sChar('dahae_warman').GetName], nuestro incomparable #E Jefe de Guerra#!, fue el mayor responsable de contener a los conquistados. Tribus e integrarlas en nuestro ejército más grande; una tarea difícil, y la forma en que debía realizarse le valió a [SCOPE.sChar('dahae_warman').GetHerHim] un apodo bastante desagradable. Aunque los esfuerzos de [SCOPE.sChar('dahae_warman').GetFirstName] no han ganado [SCOPE.sChar('dahae_warman').GetHerHim] muchos amigos, debemos asegurarnos de que la ira de estos ciclistas se dirija al enemigo al que se enfrentan y no a nosotros."
 me_dahae.108.a:0 "Acepta el título, [SCOPE.sChar('dahae_warman').GetFirstName]: tu nombre será recordado en el futuro"

 me_dahae.109.t:0 "$dahae_missions_15$"
 me_dahae.109.desc:0 "La buena voluntad no es algo que nos guste; Somos asaltantes, el azote de la civilización, y no queremos tener fama de ser bondadosos. Como hemos decidido no matar a nuestros propios parientes, nos hemos visto obligados a untarlos: [ROOT.GetCountry.GetRuler.GetName] recuerda la forma incómoda en que un amante sin experiencia intenta encantar a su nueva novia.\n\nAún así, logramos encontrar una manera de combinar lo que se nos da bien con lo que necesitamos hacer, y patrocinamos la construcción de una #E finca de esclavos#! en [dahae_jv1.GetName], le hemos regalado a nuestro aliado un lugar donde residirán las almas saqueadas de sus conquistas. ¡Qué feliz combinación! Deberíamos intentar combinar más a menudo nuestros intereses y nuestros objetivos."
 me_dahae.109.a:0 "Estoy feliz de trabajar contigo, [dahae_jv1.GetRuler.GetName]"

 me_dahae.110.t:0 "$dahae_missions_16$"
 me_dahae.110.desc:0 "Como antiguos rivales disfrutando de una comida juntos, los [GetCulture('derbiccan').GetName]#E s#! han logrado dejar de lado sus pequeñas diferencias y agravios, y ahora sus caballos están uno al lado del otro, listos para pisotear el mayor de los imperios.\n\nEs un espectáculo conmovedor ver cómo crecen los lazos de parentesco entre nuestro pueblo; una fuerte conexión forjada a partir de la adversidad que los holgazanes de la civilización nunca podrían lograr en su comodidad."
 me_dahae.110.a:0 "¡Adelante cabalgamos!"
 
# Tasks

 dahae_missions:0 "Confederación Dahae"
 dahae_missions_DESCRIPTION:0 "Al este del [GetProvince('(int32)4571').GetName], se encuentra una vasta pero desolada [GetTerrainType('steppes').GetName] habitada por personas que hablan #E idiomas del este de Irán#!. Nuestro reino es difícil de atravesar; Es más difícil encontrar agua que una cara amiga, y las interminables estepas no ofrecen refugio contra el calor abrasador del sol. Por lo tanto, es apropiado que la dureza de este entorno haya producido las tribus #E [ROOT.GetCountry.GetAdjective]#! orgullosas y resistentes.\n\nEn los textos de los pueblos civilizados, está escrito que nacemos a lomos de nuestros caballos con un arco en la mano, y nuestro entrenamiento se detiene sólo cuando lo hace nuestra respiración, una noción que [ROOT.GetCountry.GetRuler.GetName] no tiene ningún deseo de disipar.\n\nMuchos que viven en [ROOT.GetCountry.GetCapital.GetName] creen que, si las tribus esteparias pudieran de alguna manera unirse, podrían cambiar el mundo que quedó tras la muerte de #E Alejandro Magno#!, y el audaz [ROOT.GetCountry.GetRuler.GetFirstName] ha jurado que [ROOT.GetCountry.GetRuler.GetSheHe] verá que esto suceda."
 dahae_missions_CRITERIA_DESCRIPTION:0 "Esta misión estará completa cuando unifiquemos las [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName|E] tribus, ya sea por la fuerza o por la diplomacia."
 dahae_missions_BUTTON_TOOLTIP:0 "¡Uniré a los clanes Dahae bajo mi estandarte!"
 dahae_missions_BUTTON_DETAILS: ""

 dahae_missions_1:0 "Reunión de los clanes"
 dahae_missions_1_DESC:0 "Nuestra tribu está formada por muchos clanes que tienen diferentes ideas sobre cómo abordar el objetivo de #E unificación#!. Debemos reunirnos con ellos para determinar nuestro próximo curso de acción. \n\n\n\n\n\n\n\n\n\n@persia_mil17!"
 dahae_missions_1.tt:0 "Tener la opción de determinar nuestro enfoque de #Y Unificación#!: #R Fuerza#! o #G Diplomacia#!."

 dahae_missions_2:0 "Conquista [c1_scope.GetName]"
 dahae_missions_2_DESC:0 "[c1_scope.GetName|G] debe caer para que podamos dar nuestro primer paso hacia la #Y unificación#!. ¡Reúne a nuestros valientes guerreros y hazles saber que la hora de la batalla se acerca!\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
 dahae_missions_2.tt:0 "Posee todas las [c1_scope.GetAdjective|G] tierras."

 dahae_missions_3:0 "Poseer todas las #E [c2_scope.GetAdjective]#! Tierras"
 dahae_missions_3_DESC:0 "Debemos continuar nuestra búsqueda de #Y unificación#! y subyugar a cualquiera que se interponga en nuestro camino, porque esta es la voluntad de los dioses. Ha llegado el momento de destruir a los altivos guerreros de [c2_scope.GetName|G]. \n\n\n\n\n\n\n\n\n\n@persia_mil15!"
 dahae_missions_3.tt:0 "Posee todas las [c2_scope.GetAdjective|G] tierras."

 dahae_missions_4:0 "Conquista [c3_scope.GetName]"
 dahae_missions_4_DESC:0 "A medida que nos acercamos a la finalización de nuestro objetivo, todavía necesitamos mostrarle a los #E #G [c3_scope.GetName] ns#!#! su lugar. \n\n\n\n\n\n\n\n\n\n@persia_mil16!"
 dahae_missions_4.tt:0 "Posee todas las [c3_scope.GetAdjective|G] tierras."

 dahae_missions_5:0 "Fin [c4_scope.GetName]"
 dahae_missions_5_DESC:0 "Los [c4_scope.GetAdjective] miembros de la tribu siguen en nuestro camino y no serán ellos quienes detengan nuestra unificación: ha llegado el momento de acabar con ellos. \n\n\n\n\n\n\n\n\n\n@persia_mil20!"
 dahae_missions_5.tt:0 "Posee todas las [c4_scope.GetAdjective|G] tierras."

 dahae_missions_6:0 "Caballos de estepa"
 dahae_missions_6_DESC:0 "Para tener éxito en nuestros planes, debemos asegurarnos de tener un stock adecuado de nuestra arma más poderosa; #Y Caballos de estepa#! @steppe_horses! . \n\n\n\n\n\n\n\n\n\n@persia_mil13!"
 dahae_missions_6.att:0 "Produce al menos 2 #Y caballos esteparios @steppe_horses!#! en cualquier provincia que tengas."
 dahae_missions_6.btt:0 "Decide entre una bonificación #R Ofensiva#! o #G Defensiva#! a tus unidades de caballos durante #Y 10#! años."

 dahae_missions_7:0 "Estabilizar las tribus"
 dahae_missions_7_DESC:0 "Una vez completada nuestra misión, debemos garantizar la estabilidad para que nuestra todavía joven #Y Confederación#! pueda perdurar. \n\n\n\n\n\n\n\n\n\n@persia_mil2!"

 dahae_missions_8:0 "Forjar conexiones"
 dahae_missions_8_DESC:0 "Para comenzar nuestros grandes diseños sobre la #E unificación#! del pueblo [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName|E], debemos forjar conexiones con nuestros pares. ¡La primera impresión es importante, después de todo! \n\n\n\n\n\n\n\n\n\n@persia_mil11!"

 dahae_missions_9:0 "Hazte amigo de tus tribus pares"
 dahae_missions_9_DESC:0 "Las relaciones entre las tribus [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName|G] deben ser lo más cordiales posible si queremos lograr nuestro objetivo de unificación. \n\n\n\n\n\n\n\n\n\n@persia_mil19!"

 dahae_missions_10:0 "Defender las tierras de Dahae"
 dahae_missions_10_DESC:0 "Para convertirnos en el líder de los orgullosos #E Dahae#!, debemos demostrar nuestra fuerza y compromiso defendiendo a otras tribus. \n\n\n\n\n\n\n\n\n\n@persia_mil12!"
 dahae_missions_10.tt:0 "#R Cebaremos a una tribu de la región para que ataque a una de nuestras inocentes tribus hermanas Dahae#!, y es posible que las defendamos."

 dahae_missions_11:0 "Cetrería esteparia"
 dahae_missions_11_DESC:0 "La creación de redes puede ser de gran ayuda para que todos compartan nuestro punto de vista, así que, ¿por qué no organizar #Y Falconry Hunt#!.\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 dahae_missions_11.tt:0 "Comenzaremos una #Y cacería de cetrería#!, a la que invitaremos a otros [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName|G] líderes tribales.\nEsto mejorará nuestras relaciones y nuestra reputación con otros líderes tribales y, si ganamos la cacería, es posible que obtengamos recompensas adicionales."

 dahae_missions_12:0 "La cumbre de la estepa"
 dahae_missions_12_DESC:0 "Con la diplomacia puesta en todos los frentes, lo único que queda por hacer es reunir a otros líderes para escuchar nuestra propuesta para el futuro.\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 dahae_missions_12.tt1:0 "Necesitamos tener al menos 5 #G Dahae Hegemony #!(Actualmente: #Y [root_scope.MakeScope.GetVariable('dahae_hegemony').GetValue|0]#!)"
 dahae_missions_12.tt2:0 "Iniciaremos una reunión en la que intentaremos convencer a otras tribus para que acepten formar la #G Confederación Dahae#!.\n\nSus posibilidades de aceptación se basan en su opinión sobre nosotros y si los gobernantes son amigos.\n#E Todas las tribus deben estar de acuerdo#!, de lo contrario la Conferencia fracasará y tendremos que #R conquistarlos#!."

 dahae_missions_13:0 "Confederación Dahae"
 dahae_missions_13_DESC:0 "Por fin, los ejércitos de [ROOT.GetCountry.GetName|G] han realizado la tarea que alguna vez se pensó imposible de unificar las poderosas tribus #G Dahae#!. ¡Salve [ROOT.GetCountry.GetRuler.GetName|Y], el poderoso [ROOT.GetCountry.GetRulerTitle] que ha aplastado a todos los que se oponen al [ROOT.GetCountry.GetAdjective|G]!\n\n\n\n\n\n\n\n\n\n@persia_mil21!"
 dahae_missions_13.tt:0 "Hemos formado la #G Confederación Dahae.#!"
 dahae_missions_13.tt1:0 "Necesitamos tener al menos 10 #G Dahae Hegemony #!(Actualmente: #Y [root_scope.MakeScope.GetVariable('dahae_hegemony').GetValue|0]#!)"
 dahae_missions_13.tt2:0 "La familia de nuestro jefe, el #G [root_scope.GetRuler.GetFamily.GetName] Clan#!, de ahora en adelante será conocida como la #BOLD;COLOR:{0.6,0.13,0.98} Dinastía Arsakid#!.\nObtendremos un modificador permanente para nuestra capital y se nos dará la opción de reubicarla."

 dahae_missions_14:0 "Explotar a los conquistados"
 dahae_missions_14_DESC:0 "¡Ay de los vencidos! Ellos proporcionarán mano de obra para nuestros esfuerzos futuros. \n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 dahae_missions_14.tt:0 "Todos los territorios que anteriormente pertenecían a otras tribus #G Dahae#! recibirán un modificador [GetModifier('dahae_squeezed_ter').GetName|Y], que otorgará a esos territorios [GetModifier('dahae_squeezed_ter').GetDesc] durante #Y 10 años#!."

 dahae_missions_15:0 "Inversiones comunes"
 dahae_missions_15_DESC:0 "Puede que merezca la pena patrocinar un [GetBuilding('latifundia_building').GetName|Y] en una tribu aliada como muestra de amistad, en el que cubriremos la mitad del coste. \n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 dahae_missions_15.tt:0 "Tomamos la decisión de crear una empresa conjunta con otra tribu Dahae."

 dahae_missions_16:0 "Igualdad de Dahae"
 dahae_missions_16_DESC:0 "Todos los #E Dahae#! están unidos a través de la #G diplomacia#! - ¡un hecho que sin duda complacerá a todos bajo nuestras nuevas fronteras! \n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 


