 alx_ic_war:0 "Si nuestro gobernante tiene #Y $argeads$#! o #Y $lunatic$ rasgo#! o #R 10 habilidades marciales @military_icon!#!, y podemos declarar guerras de Desafío Imperial, tendremos la opción de en su lugar #BOLD;COLOR:{0.86,0.21,0.8} declarar guerra de Desafío Imperial a todos los que tengan capital en el área resaltada. Área#!, por un costo adicional de Influencia Política."
 
