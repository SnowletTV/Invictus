 metics_administration:0 "Administradores de Metics"
 metics_administration_desc:0 "Hemos optado por confiar en las métricas para que nos ayuden a la hora de gestionar nuestra burocracia."
 emporos_focused_administration:0 "Emporos recaudadores de impuestos"
 emporos_focused_administration_desc:0 "Hemos confiado a los recaudadores de impuestos la administración en nuestro nombre."
