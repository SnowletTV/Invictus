 # Mission Tasks
 diadochi_invictus_1:0 "Tracia en el Imperio"
 diadochi_invictus_1_DESC:0 "Tenemos decisiones que tomar con respecto a #E Tracia#!;, debemos decidir qué hacer con los antiguos dominios de Lysimachos. Esta región tan importante, la conexión vital entre Europa y Asia, merece nuestra máxima atención."
 diadochi_invictus_2:0 "Administración de un imperio"
 diadochi_invictus_2_DESC:0 "El vasto tamaño de nuestro reino requiere que capacitemos a los representantes para que actúen en nuestro nombre, pero la pregunta persiste; ¿Quién es el más adecuado para ser un instrumento de [ROOT.GetCountry.GetAdjective] autoridad?"
 diadochi_invictus_3:0 "Restaurando Persépolis"
 diadochi_invictus_3_DESC:0 "La quema de #E Persépolis#! después de una orden dada por Alexandros mientras estaba borracho es una mancha en nuestra reputación, pero es posible que finalmente podamos hacer algo al respecto."
 diadochi_invictus_4:0 "Tras los pasos de Alexandros"
 diadochi_invictus_4_DESC:0 "Si bien es cierto que hemos reconstruido las fronteras establecidas por Alexandros, aún quedan asuntos pendientes que debemos atender; poseyendo cada #Y Alejandría#! construida por el Conquistador."
 diadochi_invictus_5:0 "Alejandro en Anatolia"
 diadochi_invictus_5_DESC:0 "Es cierto que Alexandros tuvo una visión para #E Alexandreia Issos#!, pero no vivió lo suficiente para verla hacerse realidad. Sigamos los pasos de los macedonios y construyamos el acuerdo hasta alcanzar su verdadero potencial."
 diadochi_invictus_6:0 "Alexandros en Egipto"
 diadochi_invictus_6_DESC:0 "Ha llegado el momento de ampliar la ciudad más grande del mundo mediterráneo: [GetProvince('(int32)516').GetName]. Superaremos incluso a Alexandros con lo que imaginamos..."
 diadochi_invictus_7:0 "Alejandro en Persia"
 diadochi_invictus_7_DESC:0 "Alexandros fundó muchas ciudades en las antiguas tierras de los aqueménidas y ahora es nuestro turno de mejorar lo que él empezó."
 diadochi_invictus_8:0 "Alexandros en Aracosia"
 diadochi_invictus_8_DESC:0 "No podemos darnos el lujo de descuidar la región seca y polvorienta de Arachosia, sino que debemos construir los lugares que Alexandros consideró dignos."
 diadochi_invictus_9:0 "Alexandros en Bactria"
 diadochi_invictus_9_DESC:0 "Las ciudades de los bactrianos, por ricas y fuertes que sean, podrían mejorarse, un testimonio de nuestra capacidad."
 diadochi_invictus_10:0 "Alexandros en la India"
 diadochi_invictus_10_DESC:0 "Seguimos los pasos de Alexandros, hasta llegar a #E India#!; aseguremos tanto su legado como el nuestro en estas tierras."
 diadochi_invictus_11:0 "Alejandro en Babilonia"
 diadochi_invictus_11_DESC:0 "Debemos centrar nuestra atención en Alejandría, fundada en el río Tigris, y asegurar nuestra posición en la tierra de Mesopotamia."
 diadochi_invictus_12:0 "La Real Hacienda de [GetProvince('(int32)946').GetName]"
 diadochi_invictus_12_DESC:0 "Los tesoros de la antigua ciudad conocida una vez como #E Susa#! sirvieron bien a Alexandros en su momento de necesidad, pero ha llegado el momento de pagar las deudas del pasado."
 diadochi_invictus_13:0 "Fortaleza-Tesorería de Alejandro en [GetProvince('(int32)7968').GetName]"
 diadochi_invictus_13_DESC:0 "La fortaleza de [GetProvince('(int32)7968').GetName] era uno de los tesoros más grandes de Alejandro, con muchos diadocos al servicio de sus inconmensurables riquezas. Deberíamos fortificar la ciudadela para evitar más robos."
 diadochi_invictus_14:0 "El imperio de Alejandro"
 diadochi_invictus_14_DESC:0 "Ahora que la oposición interna se ha resuelto, podemos dirigir nuestra atención hacia el exterior y recuperar todas las tierras que son legítimamente nuestras, mientras continuamos el trabajo de Basileus Alexander."
 diadochi_invictus_14.t:0 "Somos dueños de todas las tierras del antiguo Imperio de Alejandro."
 diadochi_invictus_15:0 "Sinecismo"
 diadochi_invictus_15_DESC:0 "Uno de los objetivos de Alejandro, como dice la tradición, era lograr el sinoecismo, es decir, la fusión de asentamientos más pequeños. Como tal, es lógico que con el Imperio reunido nos centremos en la urbanización y el alojamiento de nuestra gente, con la esperanza de que algún día todos sean uno."
 diadochi_invictus_15.t1:0 "Todas nuestras ciudades de propiedad en el Imperio de Alejandro tienen al menos 20 habitantes y un Gran Templo y un Gran Teatro."
 diadochi_invictus_15.t2:0 "Cada ciudad obtendrá #Y $alx_melting_pot$#! durante 20 años: Velocidad de asimilación #Y +1#!, Modificador de velocidad de asimilación #Y +20%#!, Atracción de migración local #Y +5#!."
 diadochi_invictus_16:0 "Líneas de suministro indias"
 diadochi_invictus_16_DESC:0 "Antes de adentrarnos más en la India, debemos reconocer las dificultades logísticas de esta empresa que surge de las montañas del Hindu Kush. Por ello, debemos apaciguar y civilizar a los habitantes del valle del río Indo."
 diadochi_invictus_16.t1:0 "Somos propietarios totales del valle del río Indo y tenemos allí al menos 5 ciudades con al menos 40 habitantes y un: Gran Templo, Gran Teatro y 3 campos de entrenamiento."
 diadochi_invictus_16.t2:0 "Todos nuestros territorios en el valle del río Indo obtendrán #Y 10% #! valor de civilización, #G -1 disturbios #! y #G 15% de producción de alimentos #! durante 10 años."
 diadochi_invictus_17:0 "Regreso a la India"
 diadochi_invictus_17_DESC:0 "Ahora, con nuestros ejércitos listos, no nos queda nada que hacer más que avanzar hacia la desconocida y exótica tierra de la India y cumplir lo que Alejandro tanto anhelaba, pero que sólo lo detuvo la debilidad de sus hombres."
 diadochi_invictus_17.t1:0 "Hemos estacionado al menos 3 ejércitos de al menos 40 unidades en el valle del río Indo."
 diadochi_invictus_17.t2:0 "Tendremos reclamaciones en todas las áreas que nos limitan en la India."
 diadochi_invictus_18:0 "Empuje del norte"
 diadochi_invictus_18_DESC:0 "La región del Cáucaso era una parte integral del Imperio aqueménida, pero Alejandro no la subyugó, ya que se había propuesto prioridades más lucrativas en la Gran Campaña. Ahora, con su herencia asegurada en nuestras manos, lo único que queda es que cumpliremos su voluntad de absorber todas las antiguas tierras persas."
 diadochi_invictus_18.tt:0 "Obtendremos reclamos sobre #Y Capadocia Pontica, Armenia, Cólquida, Albania y Asiria#! regiones que, por derecho de conquista, deberían ser nuestras."
 diadochi_invictus_19:0 "Griegos euxinos"
 diadochi_invictus_19_DESC:0 "Puesto que ahora estamos en condiciones de llevar a cabo nuestro proyecto panhelénico, no podemos dejar atrás a nuestros hermanos del extremo norte."
 diadochi_invictus_19.tt:0 "Reclamaremos todas las zonas de la costa del Ponto Euxinus."
 diadochi_invictus_20:0 "preparaciones mediterráneas"
 diadochi_invictus_20_DESC:0 "Los griegos estaban siempre presentes en las costas del Gran Mar. Por lo tanto, debemos prepararnos para absorberlos, cumplir los deseos de Alejandro de conquistar el Mediterráneo y superar incluso a los grandes persas, que hace muchos años tuvieron que abstenerse de expandirse en esta dirección."
 diadochi_invictus_21:0 "campaña africana"
 diadochi_invictus_21_DESC:0 "Naveguemos y continuemos el trabajo de los Aqueménidas y Alejandro en el Mediterráneo."
 diadochi_invictus_21.t1:0 "Necesitamos estacionar al menos 3 ejércitos de 40 unidades en preparación para ir al oeste en las regiones de Cirenaica o Grecia."
 diadochi_invictus_21.t2:0 "Tendremos derechos sobre Cartago y ambos lados del estrecho de Gibraltar."
 diadochi_invictus_22:0 "campaña europea"
 diadochi_invictus_22_DESC:0 "Sicilia es un rico centro comercial. Lo único que se deduce es que debería ser nuestro y, a partir de ahí, es lógico ir más allá para frenar a algunos advenedizos italianos."
 diadochi_invictus_22.t1:0 "Necesitamos estacionar al menos 3 ejércitos de 40 unidades en preparación para avanzar hacia el oeste en las regiones de Macedonia o Grecia."
 diadochi_invictus_22.t2:0 "Tendremos derechos sobre Sicilia, Roma y todos los territorios de Europa que tengan una cultura dominante griega."
 diadochi_invictus_23:0 "campaña árabe"
 diadochi_invictus_23_DESC:0 "Lamentablemente, Alejandro murió antes de poder realizar todos sus planes. Se dice que partió hacia el Olimpo justo antes de que se pudiera lanzar la invasión de Arabia, por lo que en honor a su memoria concluiremos este negocio."
 diadochi_invictus_23.t1:0 "Necesitamos estacionar al menos 20 barcos en Ormuz y hemos preparado al menos 20 unidades terrestres tanto en Ormuz como en Alexandreia Sousias."
 diadochi_invictus_23.t2:0 "Tendremos reclamaciones en la costa de la Península Arábiga frente al Golfo Pérsico."
 
 # Events 
 
 me_diadochi_empire_events.300.t:0 "Satrapía de Tracia"
 me_diadochi_empire_events.300.desc:0 "Ahora que finalmente hemos traído la paz a la conflictiva región de #E Tracia#! - un logro que debería avergonzar eternamente a Lisímaco, quien fue incapaz de castigar a las tribus odrisias que constantemente amenazaban con derrocarlo - debemos tomar decisiones a largo plazo. Futuro de esta importante provincia.\n\nSe nos ha propuesto que instalemos a un candidato, [SCOPE.sCharacter('candidate').GetName], como nuestro sátrapa. Hay muchos testigos de carácter que pueden dar fe personalmente de la posición moral de [SCOPE.sCharacter('candidate').GetFirstName], pero la elección final sigue siendo [ROOT.GetCountry.GetRuler.GetName]."
 me_diadochi_empire_events.300.a:0 "Una #E Satrapía de Tracia#! protegerá mejor nuestros intereses aquí"
 me_diadochi_empire_events.300.b:0 "Es mejor para nosotros gobernar a todos directamente."
 
 me_diadochi_empire_events.301.t:0 "Administrar un imperio"
 me_diadochi_empire_events.301.desc:0 ""
 me_diadochi_empire_events.301.a:0 "Sólo los funcionarios designados garantizarán que todo funcione."
 me_diadochi_empire_events.301.b:0 "Sólo los capaces podrán ocupar el cargo."
 me_diadochi_empire_events.301.c:0 "La posición de uno en la vida está definida por el nacimiento."
 
 me_diadochi_empire_events.302.t:0 "Administrar un imperio"
 me_diadochi_empire_events.302.desc:0 ""
 me_diadochi_empire_events.302.a:0 "Lo que necesitamos es una burocracia centralizada."
 me_diadochi_empire_events.302.att:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y] ganará #Y $appointed_bureaucracy$#!, #Y $meritocratic_bureaucracy$ #! o #Y $noble_bureaucracy$ #!."
 me_diadochi_empire_events.302.att1:0 "#Y $appointed_bureaucracy$#! otorga #G 10 % de influencia política mensual#! y #G 15 % de reducción de los salarios de los gobernadores#! a costa de #R lealtad provincial reducida (en -0,05 mensual)#!."
 me_diadochi_empire_events.302.att2:0 "#Y $meritocratic_bureaucracy$ #! otorga #G 0,06 lealtad estatal mensual#! y #G 5 % de felicidad popular#! a costa de #R -10 % de ingresos fiscales mensuales#!."
 me_diadochi_empire_events.302.att3:0 "#Y $noble_bureaucracy$#! otorga #G 0,03 de estabilidad mensual#! y #G 8% de felicidad pop noble#! a costa de #R aumentar los salarios de los gobernadores en un 20%#!."
 me_diadochi_empire_events.302.b:0 "La administración local es la más estable."
 me_diadochi_empire_events.302.btt:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y] ganará #Y $local_nobility_administration$#!, #Y $metics_administration$ #! o #Y $emporos_focused_administration$ #!."
 me_diadochi_empire_events.302.btt1:0 "#Y $local_nobility_administration$ #! otorga #G 8% de felicidad de grupo cultural no integrado#! y #G 12% de mano de obra nacional#! a costa de #R -20% de producción pop de Noble#!."
 me_diadochi_empire_events.302.btt2:0 "#Y $metics_administration$ #! otorga #G 10% de producción pop de Citizen#! y #G 10% de producción pop de Freeman#! a un costo de #R 0,05 de corrupción mensual#!."
 me_diadochi_empire_events.302.btt3:0 "#Y $emporos_focused_administration$ #! otorga #G 15 % de ingresos comerciales#! y #G 1 ruta comercial adicional para cada provincia#! a costa de un #R 25 % de aumento en los salarios de los personajes#!."
 
 me_diadochi_empire_events.303.t:0 "Administrar un imperio"
 me_diadochi_empire_events.303.desc:0 "Aunque el [ROOT.GetCountry.GetRuler.GetName] lleva tiempo postergando la decisión final, todo el mundo sabe que el [ROOT.GetCountry.GetRulerTitle] tendrá que tomar una decisión, ya que el status quo es insostenible y nuestra administración de las provincias ya está empezando a sufrir.\n\nNosotros Tenemos algunas opciones, cada una de las cuales tiene ventajas y desventajas, y aunque la posición en la que se encuentra [ROOT.GetCountry.GetRuler.GetFirstName] no es envidiable, tendremos que decidir quién administrará los asuntos cotidianos a nivel local en el [ROOT.GetCountry.GetName]. ."
 me_diadochi_empire_events.303.a:0 "La nobleza local lo tiene bajo control."
 me_diadochi_empire_events.303.b:0 "Las métricas son administradores útiles."
 me_diadochi_empire_events.303.c:0 "Los emporos son nuestro futuro."
 
 me_diadochi_empire_events.304.t:0 "La restauración de Persépolis"
 me_diadochi_empire_events.304.desc:0 "A [ROOT.GetCountry.GetRuler.GetName] no le gusta que le recuerden el vergonzoso episodio en el que #E Persépolis#! fue incendiada, ya que [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] estuvo presente en el simposio que tendría terribles ramificaciones para la antigua ciudad.\n\nEn lugar de insistir en los errores del pasado, [ROOT.GetCountry.GetRuler.GetFirstName] ha prometido devolver la ciudad a un estado prístino y ha ordenado que se construya un monumento que superará todo lo jamás visto antes en la región."
 me_diadochi_empire_events.304.a:0 "Embelleceré lo que Alexandros intentó destruir..."
 
 me_diadochi_empire_events.305.t:0 "Persépolis restaurada"
 me_diadochi_empire_events.305.desc:0 "Por fin, ha llegado a [ROOT.GetCountry.GetRuler.GetName] la noticia de que #E Persépolis#! finalmente ha sido reconstruida. Nuestros arquitectos de [ROOT.GetCountry.GetAdjective] realmente se superaron a sí mismos, porque nunca se ha construido un monumento así en ningún lugar del mundo.\n\nAunque los negocios en [ROOT.GetCountry.GetCapital.GetName] impiden que [ROOT.GetCountry.GetRuler.GetFirstName] asista personalmente a las ceremonias y festivales que acompañarán la restauración, [ROOT.GetCountry.GetRuler.GetSheHe] está contento sabiendo que los pecados del pasado han sido expiados."
 me_diadochi_empire_events.305.a:0 "Que este monumento borre la vergüenza de lo que una vez pasó aquí."
 
 me_diadochi_empire_events.306.t:0 "Las muchas alejandrinas"
 me_diadochi_empire_events.306.desc:0 "Un vanidoso proyecto de [ROOT.GetCountry.GetRuler.GetName] finalmente se ha completado, informan nuestros asesores militares.\n\nAunque somos los claros herederos del imperio de #E Alexandros#!,, se sabía que el macedonio construyó ciudades con su nombre en prácticamente todas partes en un intento por difundir la cultura y la civilización. Nuestras fuerzas triunfantes de [ROOT.GetCountry.GetAdjective] finalmente han reclamado cada #Y Alejandría#! establecida por nuestro antiguo maestro, y ahora son parte del [ROOT.GetCountry.GetName]."
 me_diadochi_empire_events.306.a:0 "Esto no es poca cosa que yo, [ROOT.GetCountry.GetRuler.GetFirstName], he logrado"
 
 me_diadochi_empire_events.307.t:0 "El camino de Alexandros por Anatolia"
 me_diadochi_empire_events.307.desc:0 "[GetProvince('(int32)795').GetName] es una elección inspirada para una ciudad [ROOT.GetCountry.GetAdjective], y [ROOT.GetCountry.GetRuler.GetName] puede ver claramente la razón detrás de la decisión de Alexandros de fundar una #E Alejandría#! aquí.\n\nLa ubicación estratégica del sitio sirve para múltiples propósitos; su puerto natural no sólo es un nodo importante en nuestra red naval, sino que también nos proporciona control de las cercanas #E Puertas Sirias#!, permitiéndonos acceder a las llanuras del este. Lo hemos hecho bien al fortalecer nuestra presencia en la región."
 me_diadochi_empire_events.307.a:0 "Siempre actuaré en el mejor interés del estado."
 
 me_diadochi_empire_events.308.t:0 "El viaje de Alexandros a Egipto"
 me_diadochi_empire_events.308.desc:0 "Quizás el mayor logro que Alexandros haya logrado como fundador de una ciudad es la incomparable [GetProvince('(int32)516').GetName], la ciudad más grande del Mediterráneo, pero el gran general ha sido derrotado por [ROOT.GetCountry.GetRuler.GetName], quien ha elevado la ciudad a alturas nunca antes imaginadas.\n\nEn En señal de gran humildad, cuando los nobles locales se acercaron a [ROOT.GetCountry.GetRuler.GetFirstName] con la oferta de cambiar el nombre de la metrópoli a #E [ROOT.GetCountry.GetRuler.GetFirstName] opolis#! como señal de lo que se había logrado, los [ROOT.GetCountry.GetRulerTitle] se rieron de esta sugerencia y agradecieron a [ROOT.GetCountry.GetRuler.GetHerHis] ciudadanos por su amabilidad mientras rechaza el honor."
 me_diadochi_empire_events.308.a:0 "Dejemos todo como está por ahora, pero gracias."
 
 me_diadochi_empire_events.309.t:0 "La estancia de Alexandros en Babilonia"
 me_diadochi_empire_events.309.desc:0 "Los recuerdos de los ejércitos saqueadores macedonios que destruyeron la autoridad #E Aqueménida#! en#E Mesopotamia#! no están tan lejanos como para que los lugareños hayan olvidado los crímenes cometidos por los invasores, pero hoy, [ROOT.GetCountry.GetRuler.GetName] ha hecho todo lo que [ROOT.GetCountry.GetRuler.GetSheHe] puede hacer en la región para intentar restaurar lo perdido.\n\nAl construir tierras al norte, así como en la desembocadura del #E río Tigris#!, el [ROOT.GetCountry.GetRulerTitle] espera que las nuevas oportunidades económicas ayuden a aliviar la carga de las personas que han sufrido."
 me_diadochi_empire_events.309.a:0 "No puedo cambiar tu pasado, pero déjame ayudarte en tu futuro."
 
 me_diadochi_empire_events.310.t:0 "La Real Hacienda de [GetProvince('(int32)946').GetName]"
 me_diadochi_empire_events.310.desc:0 "[ROOT.GetCountry.GetRuler.GetName] nunca pierde la oportunidad de elogiarse [ROOT.GetCountry.GetRuler.GetHerHim] a sí mismo a expensas de [ROOT.GetCountry.GetRuler.GetHerHis] rivales, particularmente los otros #E Diadochi#!, por lo que ha habido mucha fanfarria acompañando la restauración del Tesoro Real en [GetProvince('(int32)946').GetName], que ha sido maltratado por los caprichos de demasiados invasores, Alexandros y, más recientemente, Antígonos, entre otros. Ellos.\n\nAhora que el Tesoro ha sido reconstruido, con una nueva y magnífica fachada de mármol que proyecta [ROOT.GetCountry.GetAdjective] autoridad, todos pueden ver por qué [ROOT.GetCountry.GetRuler.GetFirstName] se jacta: el edificio es espectacular."
 me_diadochi_empire_events.310.a:0 "Otros traen miseria, pero yo restauro y sano"
 
 me_diadochi_empire_events.311.t:0 "Los viajes de Alexandros por Persia"
 me_diadochi_empire_events.311.desc:0 "Si bien Alejandro fundó muchas ciudades en las tierras de #E Persia#!,, el crédito por convertirlas en lo que son hoy pertenece enteramente a [ROOT.GetCountry.GetRuler.GetName]. Si no fuera por la atención personal de [ROOT.GetCountry.GetRulerTitle], entonces los antiguos dominios de los #E Aqueménidas#! se habrían marchitado en la vid, pero ahora tenemos cinco ciudades más que se han ampliado, cumpliendo su misión como faros de [ROOT.GetCountry.GetAdjective] cultura."
 me_diadochi_empire_events.311.a:0 "Es mi deber ver este trabajo completado."
 
 me_diadochi_empire_events.312.t:0 "En los pasos de Alexandros a través de Arachosia"
 me_diadochi_empire_events.312.desc:0 "Hay muchas razones por las que Alexandros estableció ciudades y fortificaciones en las tierras que viajó; Seguramente llevar la civilización macedonia a regiones bárbaras, pero también extender su control a través de territorios en disputa que podrían rebelarse una vez que los ejércitos macedonios cruzaran el horizonte. \n\nAl darse cuenta de que un país difícil puede conducir a problemas difíciles si no se maneja con cuidado, [ROOT.GetCountry.GetRuler.GetName] ha tomado la decisión de invertir en las provincias de #E Arachosia#!, tratando de domar una tierra ruidosa de colinas polvorientas y desierto cruel."
 me_diadochi_empire_events.312.a:0 "Y según todos los indicios, lo he logrado."
 
 me_diadochi_empire_events.313.t:0 "Hasta el fin del mundo"
 me_diadochi_empire_events.313.desc:0 "Aunque [ROOT.GetCountry.GetRuler.GetName] ha sido informado de que las iniciativas de construcción que se han llevado a cabo en #E Bactria#! están por fin terminadas, [ROOT.GetCountry.GetRulerTitle] no parece contento con la noticia. Cuando sus confidentes más cercanos le preguntan por qué [ROOT.GetCountry.GetRuler.GetSheHe] parece preocupado, la respuesta sorprende por su franqueza.\n\n'¿Has estado alguna vez en Bactria? Tengo... es un país hermoso, uno que está bendecido con los dones de la naturaleza, pero esta es una fuente de fortaleza que podría ser explotada por los malvados. La gente allí es de tipo valiente y rebelde, y una vez que encuentran su equilibrio, podrían tratar de gobernarse a sí mismos; es como si una parte de la polémica #E Hellas#!, con todos sus hombres ambiciosos buscando la gloria, hubiera sido colocada cerca de los confines del mundo conocido.'"
 me_diadochi_empire_events.313.a:0 "Debemos vigilar a Bactria para que no se vuelva demasiado poderosa."
 
 me_diadochi_empire_events.314.t:0 "Más allá del Hidaspes"
 me_diadochi_empire_events.314.desc:0 "No hay muchos ciudadanos de [ROOT.GetCountry.GetCapital.GetName] que alguna vez lleguen a las ciudades que parecen una lista de lugares imaginados, tan grande es la distancia desde la capital de [ROOT.GetCountry.GetAdjective]. Aunque no mucha gente ha oído hablar de lugares como #E Sodal#! o #E Manikyal#!, pueden estar seguros de que [ROOT.GetCountry.GetRuler.GetName] mejora la vida de [ROOT.GetCountry.GetRuler.GetHerHis] compatriotas, tanto de los que viven cerca de los centros de poder como de los que viven en las ciudades distantes más allá del Hidaspes."
 me_diadochi_empire_events.314.a:0 "Es cierto que nuestro imperio es vasto..."
 
 me_diadochi_empire_events.316.t:0 "Campaña india"
 me_diadochi_empire_events.316.desc:0 "Es hora de completar la tarea de Alejandro en la India, cuyo cumplimiento lamentablemente le fue arrebatado por sus débiles tropas y poco después de su muerte. Podemos conquistar y destruir a nuestros enemigos de manera clásica, o hacerlo sin matices y saludar a todos los presentes con nuestros ejércitos."
 me_diadochi_empire_events.316.a:0 "Conquistemos a todos metódicamente."
 me_diadochi_empire_events.316.b:0 "No hay necesidad de medias tintas."
 me_diadochi_empire_events.316.bt:0 "#COLOR:{0.86,0.21,0.8} Declararemos la guerra Imperial Challenge a todos los habitantes del subcontinente indio.#!"
 
 me_diadochi_empire_events.318.t:0 "Campaña africana"
 me_diadochi_empire_events.318.desc:0 "Necesitamos decidir cómo manejar la tarea de conquistar la costa africana: si conquistaremos uno por uno a nuestros enemigos o conquistaremos a todos a medida que avanzamos."
 me_diadochi_empire_events.318.a:0 "Constante gana la carrera"
 me_diadochi_empire_events.318.b:0 "Saludemos a todos con lanzas."
 me_diadochi_empire_events.318.tt:0 "#COLOR:{0.86,0.21,0.8} Declararemos la guerra al Desafío Imperial contra todos en África.#!"
 
 me_diadochi_empire_events.319.t:0 "Campaña europea"
 me_diadochi_empire_events.319.desc:0 "Necesitamos decidir entre la conquista metódica de la costa europea o simplemente podemos entrar."
 me_diadochi_empire_events.319.a:0 "Constante gana la carrera"
 me_diadochi_empire_events.319.at:0 "Tendremos derechos sobre Sicilia, Roma y todos los territorios de Europa que tengan una cultura mayoritariamente griega."
 me_diadochi_empire_events.319.b:0 "Saludemos a todos con lanzas."
 me_diadochi_empire_events.319.bt:0 "#COLOR:{0.86,0.21,0.8} Declararemos la guerra Imperial Challenge a todos los que se encuentren en la costa mediterránea europea.#!"
 
 me_diadochi_empire_events.320.t:0 "Campaña árabe"
 me_diadochi_empire_events.320.desc:0 "Cumplamos quizás la tarea más cercana en la lista de Alejandro, ya sea asegurando la costa del Golfo Pérsico o la pacificación total de Arabia."
 me_diadochi_empire_events.320.a:0 "La costa es suficiente."
 me_diadochi_empire_events.320.at:0 "Tendremos derechos sobre todas las áreas que miran hacia el Golfo Pérsico."
 me_diadochi_empire_events.320.b:0 "Nunca estaremos realmente seguros hasta que toda Arabia sea griega."
 me_diadochi_empire_events.320.bt:0 "#COLOR:{0.86,0.21,0.8} Declararemos la guerra del Desafío Imperial a todos en Arabia.#!"
 
 diadochi_flavor.200.t:0 "Un verdadero heredero de Alejandro"
 diadochi_flavor.200.desc:0 "Ahora que el Imperio se ha reunido bajo nuestro liderazgo, podemos seguir siendo conocidos bajo nuestro nombre contemporáneo. O podemos proclamar un nuevo nombre, para invocar una asociación más estrecha con el sueño de Alejandro de una monarquía helenística que gobernara sobre todo."
 diadochi_flavor.200.a:0 "¡Sí, por favor!"
 diadochi_flavor.200.b:0 "No podemos abandonar nuestras raíces."
 hel_empire_tooltip:0 "Tendremos derechos sobre todas las tierras del antiguo imperio de Alejandro."
 
 # unused atm
 me_diadochi_empire_events.315.t:0 "La Real Hacienda de [GetProvince('(int32)7968').GetName]"
 me_diadochi_empire_events.315.desc:0 "En [GetProvince('(int32)7968').GetName], se almacenó una gran parte del botín de la campaña de Alejandro, y muchos diádocos se sirvieron allí para financiar sus actividades, como Eumenes, que se llevó 500 talentos, ¡muy lejos del desertor antigónido que robó 10.000! Ahora hemos asegurado esta importante fortaleza y nadie podrá tomar lo que es nuestro por derecho."
 me_diadochi_empire_events.315.a:0 "Ahora está a salvo de todas las amenazas."
 
