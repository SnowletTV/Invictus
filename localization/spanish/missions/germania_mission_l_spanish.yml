l_spanish:

germania_mission: "El ascenso de Germania"
germania_mission_DESCRIPTION: "Emergiendo como un lobo hambriento de los bosques oscuros y salvajes del norte azotado por el viento, nuestros [ROOT.GetCountry.GetAdjective] ancestros devoraron a sus vecinos y obligaron a sus líderes a someterse a nosotros de rodillas. Nuestros guerreros victoriosos sacaron a los derrotados de las cenizas ardientes de sus asentamientos antes de enviarlos a los rediles de esclavos de [ROOT.GetCountry.GetCapital.GetName], y después de años de muchas conquistas exitosas, nos ganamos una temible reputación como destructores de hombres.\n\nEn un mundo lleno de posibilidades, el ambicioso [ROOT.GetCountry.GetRuler.GetName], [ROOT.GetCountry.GetRulerTitle] de [ROOT.GetCountry.GetName], ha prometido superar las hazañas legendarias de nuestro predecesores."
germania_mission_CRITERIA_DESCRIPTION: "Esta misión estará completa cuando [ROOT.GetCountry.GetName] haya formado #E Germania#!."
germania_mission_BUTTON_TOOLTIP: "¡Que el mismo espíritu que trajo a nuestro pueblo hasta este momento los lleve a victorias aún mayores!"
germania_mission_BUTTON_DETAILS: ""

#Mission Tasks

germania_conquest_mission_start: "Atacar a nuestros enemigos"
germania_conquest_mission_start_DESC: "[ROOT.GetCountry.GetRuler.GetName|Y] ha liderado muchos grupos de asalto a las tierras de nuestros enemigos a lo largo de [ROOT.GetCountry.GetRuler.GetHerHis] vida y ha prometido hacerlo hasta que [ROOT.GetCountry.GetRuler.GetSheHe] ya no pueda empuñar una lanza en [ROOT.GetCountry.GetRuler.GetHerHis] manos.\n\n\n\n\n\n\n\n\n\n\n@celt_mil17!"
germania_conquest_mission_start_tt: "Nuestro gobernante debe utilizar la interacción de personaje #T Ir a asaltar#!."

germania_conquest_mission_1_1: "¡Esclavízalos a todos!"
germania_conquest_mission_1_1_DESC: "¡No hay razón para que debamos mostrar misericordia a nuestros enemigos! ¡Quemaremos sus aldeas, masacraremos a sus hombres y arrojaremos a sus mujeres y niños a corrales de esclavos!\n\n\n\n\n\n\n\n\n\n\n@italic_mil17!"

germania_conquest_mission_1_2: "Conquistando las costas"
germania_conquest_mission_1_2_DESC: "Nuestros ejércitos nos brindan éxito en tierra y mar, y nuestras fronteras crecen para abarcar muchos nuevos asentamientos y territorios. Para fortalecer la [ROOT.GetCountry.GetAdjective] marina y alentar a los barcos extranjeros a visitar nuestros mercados, [ROOT.GetCountry.GetRuler.GetName|Y] ha pedido la construcción de puertos a lo largo de nuestra costas.\n\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
germanic_ports_tt: "Necesitamos poseer al menos #Y 10#! #T Puertos#!. (#R [SCOPE.ScriptValue('germanic_ports_current')|0]#!/#Y 10#!)"

germania_conquest_mission_2_1: "Una cuestión de honor"
germania_conquest_mission_2_1_DESC: "Algunos de nuestros parientes están insinuando que [ROOT.GetCountry.GetRuler.GetName|Y] ha vivido una vida mimada durante los últimos años, pasando [ROOT.GetCountry.GetRuler.GetHerHis] tiempo emitiendo órdenes y decretos de [ROOT.GetCountry.GetCapital.GetName|G] en lugar de luchar junto a nuestros soldados como un verdadero [ROOT.GetCountry.GetAdjective] guerrero.\n\nPara silenciar a estos detractores y demostrar que [ROOT.GetCountry.GetRuler.GetSheHe] no se ha ablandado, [ROOT.GetCountry.GetRuler.GetFirstName|Y] ha prometido batirse en duelo con un rival en combate personal.\n\n\n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"

germania_conquest_mission_2_2: "Tomando prestado a los belgas"
germania_conquest_mission_2_2_DESC: "Nuestras armadas están saqueando las costas de las tribus #T belgas#! muy al oeste, y muchos esclavos han sido capturados por los asaltantes victoriosos de [ROOT.GetCountry.GetRuler.GetName|Y], quienes han jurado a los dioses que [ROOT.GetCountry.GetRuler.GetSheHe] humillarán a estos salvajes.\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

germania_conquest_mission_3_1: "Piratas profesionales"
germania_conquest_mission_3_1_DESC: "Argumentando que no hay razón para que nuestros asaltantes se limiten a saquear la tierra, el feroz guerrero [ROOT.GetCountry.GetRuler.GetName|Y] ha dado permiso a nuestros ejércitos para construir #R refugios piratas#! dondequiera que estemos. Por favor.\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"

germania_conquest_mission_4_1: "Sumisión germánica"
germania_conquest_mission_4_1_DESC: "Aunque sus ciudades y asentamientos están lejos de [ROOT.GetCountry.GetCapital.GetName|T], los indomables [ROOT.GetCountry.GetAdjective] impuestos han conquistado una vez más un anfitrión extranjero. Al darse cuenta de que no pueden esperar enfrentarse a nosotros, las maltrechas tribus de #G Germania Superior#! han bajado sus lanzas y han prestado juramento de envío.\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

germania_conquest_mission_4_2: "Infraestructura de capital"
germania_conquest_mission_4_2_DESC: "La gente trabajadora [ROOT.GetCountry.GetAdjective|G] ha estado pidiendo cortésmente a [ROOT.GetCountry.GetRuler.GetName|Y] que gaste algunos fondos estatales para construir la infraestructura de nuestra capital. [ROOT.GetCountry.GetCapital.GetName|T] está creciendo y sigue siendo un lugar del que estar orgulloso, pero aún queda mucho por hacer para mejorar su abundancia natural.\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"

germania_conquest_mission_5_1: "Explorando la cuenca"
germania_conquest_mission_5_1_DESC: "Muy al sur se encuentra la #G Cuenca de Bohemia#!; las traicioneras estribaciones al pie de las montañas dan paso a una amplia llanura. ¡Esta es una buena tierra, una que debemos reclamar como nuestra!\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
germania_conquest_mission_5_1_tt: "Tendremos la opción de enviar # colonos#! a la #G cuenca de Boihemian#!."

germania_conquest_mission_6_1: "Boihemia occidental"
germania_conquest_mission_6_1_DESC: "A medida que se corre la voz entre las tribus sobre la riqueza que se puede encontrar en la #G Cuenca de Boihemian#!, cada vez más personas de nuestra gente están desarraigando sus vidas y asentándose en la sur.\n\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
germania_conquest_mission_6_1_tt: "Podemos colonizar cualquier territorio no reclamado en la #G Cuenca Boihemian#! occidental."

germania_conquest_mission_6_2: "Boihemia Oriental"
germania_conquest_mission_6_2_DESC: "A medida que se corre la voz entre las tribus sobre la riqueza que se puede encontrar en la #G Cuenca de Boihemian#!, cada vez más personas de nuestra gente están desarraigando sus vidas y asentándose en la sur.\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
germania_conquest_mission_6_2_tt: "Podemos colonizar cualquier territorio no reclamado en la #G cuenca oriental de Boihemia#!."

germania_conquest_mission_7_1: "¿Amigos galos?"
germania_conquest_mission_7_1_DESC: "A estas alturas, nuestros [ROOT.GetCountry.GetAdjective] parientes sienten que la #G Cuenca Boihemian#! nos pertenece en su totalidad, y hay muchos #G boianos#! nativos que también están de acuerdo con esto, y en lugar de desafiar nuestro gobierno, estos miembros de la tribu están clamando por más derechos dentro de nuestra sociedad.\n\nSe han hecho promesas a la [ROOT.GetCountry.GetRulerTitle], ofreciendo derechos sobre la región a cambio del regalo de la ciudadanía.\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
germania_conquest_mission_7_1_tt: "#Y Elegiremos los#! #G Derechos Cívicos#! #Y para los#! #T Boianos#!."

germania_side_mission_start: "Favor de los dioses"
germania_side_mission_start_DESC: "Ahora que [ROOT.GetCountry.GetName|Y] está disfrutando de un raro momento de paz, nuestro #G Sumo Sacerdote#! ha sugerido que [ROOT.GetCountry.GetRuler.GetName|Y] realice un sacrificio especial en honor de [ROOT.GetCountry.Custom('get_harvest_goddess')|G] para obtener favores divinos; una sugerencia que es popular entre la gente.\n\n#Y En un mes, se llevará a cabo un ritual en#! [ROOT.GetCountry.GetCapital.GetName|T] #Y nuestro [ROOT.GetCountry.GetRulerTitle] podrá elegir un recompensa.#!\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
germania_side_mission_start_tt: "El #T Sumo Sacerdote#! funcionario necesita al menos 10 @religious_icon! #Y Celo#!."

germania_side_mission_1: "El pozo de #E Wodenaz#!"
germania_side_mission_1_DESC: "El #G Sumo Sacerdote#! ha regresado a [ROOT.GetCountry.GetCapital.GetName|T] con más visiones extrañas que divulgar; la voz del dios [GetDeityDefinition('omen_wodenaz').GetName|G] llama desde el norte azotado por el viento, instando nada menos que a [ROOT.GetCountry.GetRuler.GetName|Y] [ROOT.GetCountry.GetRuler.GetHerHim] a aventurarse en las tierras salvajes en busca de un santuario sagrado.\n\n#Y Esto iniciará un evento. Cadena#!.\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

germania_side_mission_2: "Reprimir a las élites"
germania_side_mission_2_DESC: "Envalentonado por todo lo que [ROOT.GetCountry.GetRuler.GetSheHe] ha visto y logrado, [ROOT.GetCountry.GetRuler.GetName|Y] ha hecho saber que [ROOT.GetCountry.GetRuler.GetSheHe] tiene poder y autoridad supremos sobre todas las demás élites que gobiernan dentro de [ROOT.GetCountry.GetName|T], y todos los que viven dentro de nuestras fronteras deben someterse a [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle]. \n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"

germania_side_mission_3_1: "Rex germanorum"
germania_side_mission_3_1_DESC: "Un nuevo día exige una nueva forma de hacer las cosas, y [ROOT.GetCountry.GetRuler.GetName|Y] no es alguien que deje pasar una buena oportunidad por el camino. [ROOT.GetCountry.GetName|T] no es la misma pequeña tribu que conocieron nuestros bisabuelos, entonces ¿por qué deberíamos conducir nuestros asuntos políticos de la misma manera? ¡Nuestro pueblo merece un monarca y lo recibirá!\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

germania_side_mission_3_2: "Respeto por los mayores"
germania_side_mission_3_2_DESC: "Sin romper con la tradición a la ligera, [ROOT.GetCountry.GetRuler.GetName|Y] ha decretado que las costumbres de nuestros antepasados serán honradas dentro de [ROOT.GetCountry.GetName|T] - que todo el poder se entregue a los #G Ancianos#!, que nunca han liderado a nuestro pueblo. Extraviado.\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

germania_side_mission_4_1: "Regalía real"
germania_side_mission_4_1_DESC: "#Y Nuestro [ROOT.GetCountry.GetRulerTitle|T] podrá elegir uno de los tres artefactos legendarios para que sirva como #G [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] Royal Regalia#!#!.\n\nDesde la ciudadela de [ROOT.GetCountry.GetCapital.GetName|T], los sonidos desafiantes del carnyx llenan el aire mientras se coloca un trono de mármol dentro del palacio: ¡salvemos a [ROOT.GetCountry.GetRuler.GetName|Y], el fundador de una dinastía inmortal!\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"

germania_side_mission_4_2: "Gran República Germánica"
germania_side_mission_4_2_DESC: "¡Envía barcos llevando mensajes a los rincones de la Tierra! A partir de hoy, que se sepa que se ha establecido una #T Gran República#!, que honra el estado de derecho y defiende los principios de la justicia, dentro de las llamadas tierras \"bárbaras\" habitadas por los germánicos. ¡tribus!\n\n\n\n\n\n\n\n\n\n\n@italic_mil5!"

germania_main_mission_start: "consejo de guerra"
germania_main_mission_start_DESC: "[ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName|Y] ha convocado un #T Consejo de Guerra#! que se celebrará en [ROOT.GetCountry.GetCapital.GetName|T], ya que la hora de la guerra contra nuestros enemigos se acerca cada vez más. Más cerca.\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"

germania_main_mission_1_1: "Conquista de Occidente"
germania_main_mission_1_1_DESC: "Hay muchas tribus amenazadoras que viven en las orillas orientales del #Y río Rhenus#!, pero ellas también se someterán a [ROOT.GetCountry.GetRuler.GetName|Y] de una forma u otra. ¡El sonido del carnyx llama a nuestras tropas a prepararse para la invasión de [GetProvince('(int32)3830').GetArea.GetRegion.GetName|G]!\n\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
germania_main_mission_1_tt: "Al menos #E #Y 50%#!#! de la región [GetProvince('(int32)3830').GetArea.GetRegion.GetName|G] es propiedad de #E [SCOPE.GetRootScope.GetCountry.GetName|T]#!."
germania_main_mission_1_tt2: "Recibiremos reclamaciones sobre toda #G Germania Magna#!."

germania_main_mission_1_2: "Conquista del norte"
germania_main_mission_1_2_DESC: "Ha llegado el momento de avanzar hacia el norte, hacia el difícil terreno habitado por los salvajes #G escandinavos#!. [ROOT.GetCountry.GetRuler.GetName|Y] ha tomado una [ROOT.GetCountry.GetRuler.GetHerHis] decisión; debemos cruzar las aguas del #Y Oceanus Sarmaticus#! y destruir la amenaza que representan para nuestro flanco norte las tribus #G escandinavas#! y #G cimbrias#!. \n\n\n\n\n\n\n\n\n\n\n@italic_mil12!"
germania_main_mission_1_2_tt: "Al menos #E #Y 50%#!#! de la región [GetProvince('(int32)3857').GetArea.GetRegion.GetName|G] es propiedad de #E [SCOPE.GetRootScope.GetCountry.GetName|T]#!."
germania_main_mission_1_2_tt2: "Recibiremos reclamaciones sobre todo #G Scandia#!."

germania_main_mission_1_3: "Conquista del Este"
germania_main_mission_1_3_DESC: "Los bosques al este son oscuros y vastos, y tribus hostiles a nuestras intenciones acechan en las sombras lúgubres de los bosques primitivos. Ha llegado el momento de reunir nuestras fuerzas y derrotar a estos salvajes estéticos hasta someterlos.\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
germania_main_mission_1_3_tt: "Al menos #E #Y 50%#!#! de la región [GetProvince('(int32)4768').GetArea.GetRegion.GetName|G] es propiedad de #E [SCOPE.GetRootScope.GetCountry.GetName|T]#!."
germania_main_mission_1_3_tt2: "Recibiremos reclamaciones sobre toda #G Venedia#!."

germania_main_mission_2_1: "Gran puerto germánico"
germania_main_mission_2_1_DESC: "Aunque nuestros parientes prefieren ampliamente la estabilidad de la tierra firme a los estados de ánimo impredecibles del océano, si tenemos esperanzas de convertirnos en una civilización poderosa, entonces debemos dirigir nuestra atención hacia el norte y dominar las aguas. [ROOT.GetCountry.GetRuler.GetName|Y] está explorando actualmente la costa con la esperanza de encontrar el lugar ideal para construir nuestro gran puerto germánico.\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"

germania_main_mission_2_2: "Levantar las murallas"
germania_main_mission_2_2_DESC: "Nuestra bella capital [ROOT.GetCountry.GetCapital.GetName|T] es verdaderamente la ciudad más grande de todo [ROOT.GetCountry.GetName|G] y, sin embargo, el cauteloso [ROOT.GetCountry.GetRuler.GetName|Y] teme que una invasión inoportuna de nuestros enemigos pueda arruinar todo el arduo trabajo que nuestro pueblo ha puesto en la construcción de nuestra civilización.\n\nPara proteger nuestra floreciente sociedad, el [ROOT.GetCountry.GetRulerTitle] ha decretado que la capital se fortifique lo mejor que podamos. En lugar de pasar el verano en campaña, a nuestros guerreros se les pedirá que ayuden con un proyecto de construcción.\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"

germania_main_mission_2_3: "La Costa de Ámbar"
germania_main_mission_2_3_DESC: "La mayoría de los comerciantes extranjeros que arriban a nuestros puertos realizan consultas sobre un bien comercial principalmente; ámbar @amber!. Los dioses nos han dado abundancia de esta rareza y debemos aprovechar esta bendición y producir tanto como podamos.\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
germania_amber_total_svalue_tt: "Debemos producir al menos #Y 10#! #T Ámbar#! @amber! en nuestra nación. (#R [SCOPE.ScriptValue('androphagian_amber_total_svalue')|0]#!/#Y 10#!)"

germania_main_mission_3: "Echando raíces"
germania_main_mission_3_DESC: "En los últimos años, nuestra tribu ciertamente ha recorrido un largo camino; edificios de ladrillo y piedra han reemplazado las chozas destartaladas que no debían durar más de una temporada o dos, y en lugar de migrar anualmente en busca de buenas tierras de pastoreo, nuestra gente está optando por quedarse en los asentamientos que han despejado. Lento pero seguro, [ROOT.GetCountry.GetAdjective] la sociedad se está transformando en algo nuevo....\n\n\n\n\n\n\n\n\n\n\n@italic_mil9!"

germania_main_mission_4: "Llamada de lo salvaje"
germania_main_mission_4_DESC: "Salgamos de nuestros asentamientos y migremos a tierras que actualmente son salvajes e ingobernables; Los bosques vírgenes y las suaves llanuras que rodean nuestro corazón piden un maestro.\n\n\n\n\n\n\n\n\n\n\n@italic_mil24!"

germania_main_mission_5_1: "Guerra sobre las aguas"
germania_main_mission_5_1_DESC: "El intrépido [ROOT.GetCountry.GetRuler.GetName|Y], que nunca se sienta en [ROOT.GetCountry.GetRuler.GetHerHis] manos, ha formado una gran armada con la esperanza de atacar las costas de nuestra enemigos.\n\n\n\n\n\n\n\n\n\n\n@italic_mil4!"

germania_main_mission_5_2: "Sangre de los reyes germánicos"
germania_main_mission_5_2_DESC: "Bajo la dirección de [ROOT.GetCountry.GetRuler.GetName|Y] y el clan [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective], el pueblo [ROOT.GetCountry.GetAdjective] ha alcanzado alturas inimaginables para sus antepasados. Destinada a seguir siendo una de las familias más prestigiosas en la historia de [ROOT.GetCountry.GetName|Y], se considera el mayor de los honores ser pariente consanguíneo de los [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective], quienes se cuentan entre los primeros y más grandes #T germánicos. Reyes#!.\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"

germania_main_mission_6_1: "Asaltantes profesionales"
germania_main_mission_6_1_DESC: "Como la tradición de las incursiones se ha convertido en parte de la vida dentro de [ROOT.GetCountry.GetName|Y], se ha sugerido que implementemos tácticas profesionales para nuestras fuerzas saqueadoras. Así como no podemos depender de impuestos no capacitados para proteger nuestras fronteras, no deberíamos enviar reclutas novatos a las tierras de nuestros enemigos.\n\n\n\n\n\n\n\n\n\n\n\n\n\n@celt_mil19!"

germania_main_mission_6_2: "ejércitos germánicos"
germania_main_mission_6_2_DESC: "Los mismos [ROOT.GetCountry.GetAdjective|G] soldados que conquistaron las montañas boscosas y los pantanos helados de nuestros países de origen serán los mismos que un día pisarán las calles de mármol de Reyes y Cónsules: nuestras excepcionales tradiciones militares triunfarán contra ¡Todos!\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"

germania_main_mission_6_3: "Población en crecimiento"
germania_main_mission_6_3_DESC: "Nuestra capital de [ROOT.GetCountry.GetCapital.GetName|T] ha estado repleta de ciudadanos y hombres libres, mientras hombres de todas partes [ROOT.GetCountry.GetName|T] viajan al corazón palpitante de nuestro imperio para buscar fortuna en la ciudad más grande de todas. Si bien esto es una bendición para el país, se deben tomar medidas si esperamos acomodar a todas las personas que viven allí.\n\n\n\n\n\n\n\n\n\n\n@italic_mil24!"

germania_main_mission_6_4: "Una sociedad civil"
germania_main_mission_6_4_DESC: "A [ROOT.GetCountry.GetRuler.GetName|Y] nada le encantaría más que centrar [ROOT.GetCountry.GetRuler.GetHerHis] la atención en las iniciativas de construcción en [ROOT.GetCountry.GetName|T], pero antes de que [ROOT.GetCountry.GetRulerTitle] pueda centrarse en el desarrollo, nuestra #T Tecnología Cívica#! debe ser mejor de lo que es actualmente; no es una tarea fácil.\n\nPara ayudar a facilitar nuestro crecimiento tecnológico, [ROOT.GetCountry.GetRuler.GetFirstName] ha reservado una suma principesca para adquirir los servicios de los más sabios de nuestra tierra con la esperanza de que compartan sus conocimientos con nosotros.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"

germania_main_mission_6_5: "Ambición colonial"
germania_main_mission_6_5_DESC: "La promesa de gloria eterna y tesoros llama a nuestros marineros a llevar sus barcos y sus almas al límite, siguiendo el grito de batalla de la aventura a dondequiera que los lleven los dioses de la guerra.\n\nLas islas heladas del extremo norte son lugares habitables que ningún guerrero [ROOT.GetCountry.GetAdjective] ha visitado jamás y, sin embargo, estas tierras desesperadas exigen que las almas más valientes las visiten. Costas.\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"

germania_main_mission_7_1: "Reformar el país"
germania_main_mission_7_1_DESC: "Después de un largo período de contemplación, en el que el futuro de [ROOT.GetCountry.GetName] pesaba mucho en la mente de [ROOT.GetCountry.GetRuler.GetName], [ROOT.GetCountry.GetRulerTitle] ha llegado a una conclusión importante, que tendrá ramificaciones a lo largo de los siglos venideros; debemos hacer una ruptura irrevocable con el pasado para forjar nuestras nuevas identidades.\n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"

germania_main_mission_7_2: "Invierta en nuestra tradición"
germania_main_mission_7_2_DESC: "¿Por qué [ROOT.GetCountry.GetRuler.GetName] abandonaría la misma cultura que nos llevó a la cima del poder? Descartando estas sugerencias como el colmo de la tontería, el sabio [ROOT.GetCountry.GetRulerTitle] ha abrazado nuestras raíces y ha prometido enseñar nuestras tradiciones a los diferentes pueblos que viven bajo nuestro control. Banner.\n\n\n\n\n\n\n\n\n\n\n@celt_mil4!"

germania_main_mission_7_3: ""
germania_main_mission_7_3_DESC: ""

germania_main_mission_7_4: ""
germania_main_mission_7_4_DESC: ""

germania_main_mission_7_5: "Excedente de piedra"
germania_main_mission_7_5_DESC: "Por mucho que duela [ROOT.GetCountry.GetRuler.GetName|Y] admitirlo, nuestros [ROOT.GetCountry.GetAdjective] parientes necesitan comenzar a erigir estructuras permanentes de piedra @stone! dentro de [ROOT.GetCountry.GetName|T]. ¡Una base hecha de palos y paja no será lo suficientemente fuerte para sostener nuestras ambiciones en los años venideros!\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
germania_main_mission_7_5tt: "Necesitamos poseer #T 3 asentamientos#! dentro de la región #T Germania Magna#! que produzcan al menos #Y 3 piedras#! @stone! y tenga una #T mina#!."

germania_main_mission_7_6: "Alimentar a la gente"
germania_main_mission_7_6_DESC: "Los valientes miembros de la tribu de [ROOT.GetCountry.GetName|T] han sufrido períodos de hambruna y devastación durante las guerras de antaño, pero ha llegado el momento de pagar su fidelidad asegurándose de que sus estómagos permanezcan llenos. Construyamos granjas en todas nuestras explotaciones para garantizar que nuestras cosechas sean abundantes.\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

germania_main_mission_7_7: "Asentando Soodak"
germania_main_mission_7_7_DESC: "Hemos oído que hay una gran isla llamada [GetProvince('(int32)9371').GetName|T] en el #Y Oceanus Sarmaticus#! que está cerca de nuestra colonia y es rica en ámbar @amber!; Los habitantes locales son amigables y están agradecidos por la oportunidad de forjar conexiones con un pueblo poderoso como el nuestro. Si podemos seguir ayudando a nuestras colonias con alimentos y mano de obra, entonces podremos apoderarnos de esta isla rica en ámbar.\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

germania_main_mission_7_8: "Cinco ciudades"
germania_main_mission_7_8_DESC: "En comparación con otros, tenemos una vergonzosa escasez de ciudades; Nuestro pueblo se ha mostrado más inclinado a saquear y saquear pueblos en lugar de construir los nuestros, pero esto debe cambiar.\n\nAl comprender que esto nos pone en desventaja, especialmente cuando se consideran cuestiones de comercio e investigación, [ROOT.GetCountry.GetRuler.GetName|Y] ha anunciado que los [ROOT.GetCountry.GetAdjective] compensarán esto construyendo no menos de cinco ciudades dentro de nuestro territorio. Corazón.\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"

germania_main_mission_8_1: "Un ejército moderno"
germania_main_mission_8_1_DESC: "No podemos darnos el lujo de depender de reclutas de agricultores no capacitados y de sus hijos como nuestras fuerzas principales; debemos invertir en un ejército moderno, uno que pueda enfrentarse cara a cara con las fuerzas profesionales del Mediterráneo. Imperios.\n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"

germania_main_mission_8_2: "Nuevas infraestructuras"
germania_main_mission_8_2_DESC: "Aunque [ROOT.GetCountry.GetRuler.GetName] siempre tendrá debilidad por la arquitectura y el diseño [ROOT.GetCountry.GetAdjective], si #T germania#! quiere convertirse en un pueblo unificado en cultura y tradición, entonces adoptar nuevos estilos de construcción es una forma inteligente de garantizar que esto sucede.\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"

germania_main_mission_8_3: "Un nuevo alfabeto"
germania_main_mission_8_3_DESC: "Las runas y grabados de nuestros antepasados parecen torpes y primitivos en comparación con las fluidas escrituras y cuerpos de literatura que tienen algunos de nuestros pares, una vergüenza que ha preocupado a [ROOT.GetCountry.GetRuler.GetName], quien siente que nuestro atraso refleja mal el liderazgo de [ROOT.GetCountry.GetRuler.GetHerHis].\n\nCon miras a la reforma, el [ROOT.GetCountry.GetRulerTitle] ha pedido escribas para ayudar en el creación de un nuevo alfabeto para nuestro pueblo.\n\n\n\n\n\n\n\n\n\n\n@india_mil17!"

germania_main_mission_8_4: "Ningún lugar es seguro"
germania_main_mission_8_4_DESC: "Nuestros guerreros claman por la oportunidad de atacar territorios distantes por mar, y [ROOT.GetCountry.GetRuler.GetName|Y] está listo para acceder a su petición.\n\n\n\n\n\n\n\n\n\n\n@italic_mil11!"

germania_main_mission_8_5: "Mantengamos nuestras raíces"
germania_main_mission_8_5_DESC: "Algunos que viven dentro de [ROOT.GetCountry.GetCapital.GetName|G] han permitido que los placeres de la vida urbana contaminen sus mentes, ya que algunos han sugerido que abandonemos nuestras costumbres tradicionales para abrazar las influencias cosmopolitas. [ROOT.GetCountry.GetRuler.GetName|Y] sin embargo, no aceptará esta tontería y ha declarado que nunca abandonaremos nuestras raíces.\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"

germania_main_mission_8_6: "Tradiciones orales"
germania_main_mission_8_6_DESC: "Desde que el sol ha considerado oportuno elevarse en los cielos, nuestro pueblo ha transmitido mitos por vía oral: no escribimos nuestras historias, sino que entrenamos a bardos y cantantes de cuentos para que cuenten las hazañas audaces de nuestros antepasados.\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"

germania_main_mission_8_7: "Asimilación en Germania"
germania_main_mission_8_7_DESC: "Nuestra cultura superior ha atraído a muchos admiradores: se dice que nuestros actos y logros varoniles son aclamados en ciudades tan lejanas como [GetProvince('(int32)516').GetName|T], aunque [ROOT.GetCountry.GetRuler.GetName|Y] cree que esto es un halago. No sorprende, entonces, escuchar que muchos de los que viven dentro de nuestras fronteras se están asimilando a [ROOT.GetCountry.GetAdjective|G].\n\n\n\n\n\n\n\n\n\n\n@egypt_mil12!."

germania_main_mission_8_9: "Grandes Mercados De Germania"
germania_main_mission_8_9_DESC: "Los negocios están en auge en [ROOT.GetCountry.GetCapital.GetName|T], y todo lo que uno desee se puede encontrar en los numerosos mercados que se encuentran a lo largo de las plazas que rodean la calle principal. Vías públicas.\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"

germania_main_mission_8_10: "un montón de madera"
germania_main_mission_8_10_DESC: "Incesantes en su tarea de cortar, las hachas de los [ROOT.GetCountry.GetAdjective] leñadores nunca tienen un momento de descanso, sino que pasan incontables horas talando árboles en las tierras boscosas del campo.\n\n[ROOT.GetCountry.GetName|T] tiene la suerte de tener más madera @wood! de la que sabe qué hacer, y su gente es hábil cuando se trata de construir madera. Implementos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
germania_main_mission_8_10tt: "Necesitamos poseer al menos #T 6 asentamientos#! que produzcan al menos #Y 2 madera#! @wood!."

germania_main_mission_8_11: "Sementales salvajes"
germania_main_mission_8_11_DESC: "Cuando se trata de criar caballos, los miembros de nuestra tribu pueden defenderse: poseemos muchas tierras que están bendecidas con fuertes manadas de caballos salvajes @horses!, y hemos entrenado a estas magníficas bestias para llevar a nuestros guerreros a ¡batalla!\n\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
germania_horses_total_svalue_tt: "Debemos producir al menos #Y 10#! @horses! #T Caballos#! en nuestro país. (#R [SCOPE.ScriptValue('germania_horses_total_svalue')|0]#!/#Y 10#!)"

germania_main_mission_8_12: "Fiestas de caza"
germania_main_mission_8_12_DESC: "Las tierras en las que vivimos son salvajes y salvajes, pero hay una sorprendente falta de caza silvestre @wild_game! en nuestros bosques y llanuras: hay que viajar mucho hacia el este antes de encontrar las manadas más grandes. Sin embargo, nuestro pueblo tiene gusto por la caza y no estará satisfecho a menos que pueda ir al bosque para acechar ciervos, y [ROOT.GetCountry.GetRuler.GetName|Y] ha prometido hacer de este sueño realidad.\n\n\n\n\n\n\n\n\n\n\n@italic_mil7!"
germania_main_mission_8_12_tt: "Necesitamos poseer #T 3 asentamientos#! que produzcan #Y caza salvaje#! @wild_game! y tener un edificio de #T asentamiento tribal#!."

germania_main_mission_8_13: "Conservación de la sal"
germania_main_mission_8_13_DESC: "Tener acceso a un suministro constante de sal @salt! es importante por múltiples razones, especialmente porque la usamos como conservante. A menos que queramos que se eche a perder toda la comida que tanto nos ha costado cultivar, será mejor que consigamos mucha sal y rápidamente.\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
germania_main_mission_8_13_tt1: "Necesitamos poseer al menos #T 3 asentamientos#! que produzcan #Y sal#! @salt! y tener un edificio #T finca de esclavos#!."
germania_main_mission_8_13_tt2: "Nuestro #T Alcance de capital#! tiene un #G Superávit#! de al menos #T 2#! #Y Sal#! @salt!."

germania_main_mission_8_15: "Colonia fennica exitosa"
germania_main_mission_8_15_DESC: "Nuestras propiedades en [GetProvince('(int32)9371').GetName|T] han traído mucho renombre a la gente de [ROOT.GetCountry.GetName|T], que es aclamada en todas partes por la calidad del ámbar @amber! que se produce dentro de nuestra talleres.\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
germania_amber_total_svalue_tt2: "Debemos producir al menos #Y 15#! @amber! #T Ámbar#! en nuestra nación. (#R [SCOPE.ScriptValue('androphagian_amber_total_svalue')|0]#!/#Y 15#!)"

germania_main_mission_9_1: "El amanecer de una nueva era"
germania_main_mission_9_1_DESC: "Por fin, se ha forjado una nueva cultura para nuestro pueblo, gracias a los esfuerzos reformistas de [ROOT.GetCountry.GetRuler.GetName] para erradicar los rastros persistentes de nuestras costumbres anteriores de nuestra sociedad. Hoy marca el amanecer de una nueva era: ¡salvemos todos a la nueva germania!\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"

germania_main_mission_9_2: "Recompensar a la gente"
germania_main_mission_9_2_DESC: "Después de realizar esfuerzos para garantizar que nuestras costumbres tradicionales conserven su lugar central dentro de nuestra cultura, [ROOT.GetCountry.GetRuler.GetName|Y] finalmente está satisfecho de que [ROOT.GetCountry.GetAdjective] la moral no será abandonada por las generaciones venideras y desea derrochar a las masas en un gesto de fondo de comercio.\n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"

germania_main_mission_9_3: "Nueva nobleza"
germania_main_mission_9_3_DESC: "A lo largo de los años, muchas de las élites que viven en [ROOT.GetCountry.GetName|T] han abandonado sus propiedades tradicionales y se han dirigido a [ROOT.GetCountry.GetCapital.GetName|T], ya que la ciudad capital del pueblo [ROOT.GetCountry.GetAdjective] se ha convertido rápidamente en la ciudad más importante de todas las tierras germánicas.\n\nSimplemente no hay otro lugar que se compare en riqueza y poder con [ROOT.GetCountry.GetCapital.GetName|T], y las clases nobles se han dado cuenta de esto y abrazar la ciudad como propia. \n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"

germania_main_mission_9_5: "Centro de comercio germánico"
germania_main_mission_9_5_DESC: "Nuestra provincia natal de [ROOT.GetCountry.GetCapital.GetArea.GetName|T] es conocida en todas partes como un centro de comercio, donde se pueden encontrar productos de exquisita artesanía y rareza en [ROOT.GetCountry.GetCapital.GetName|T]. [ROOT.GetCountry.GetRuler.GetName|Y] se ha comprometido a hacer lo necesario para hacer de nuestra capital un centro comercial.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

germania_main_mission_9_6: "Ciudades en los bosques"
germania_main_mission_9_6_DESC: "Se dice que, muy al sur, hay ciudades construidas a lo largo de las costas bañadas por la brisa del #Y Mediterráneo#!, donde el sol quema las playas durante todo el día y los peces saltan del agua a las redes de los pescadores. ¿Es sorprendente que las personas \"civilizadas\" sean tan suaves como ellos?\n\nVivimos en un reino peligroso, donde el lobo hambriento aúlla en los bosques y los dioses cubren el suelo de escarcha y sangre; Si vamos a construir ciudades, muchas de ellas estarán en estos bosques que llamamos hogar.\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"

germania_main_mission_9_7: "Sed de vino"
germania_main_mission_9_7_DESC: "Aunque nuestros antepasados elaboraban hidromiel y se contentaban con lo que podían hacer ellos mismos, sus mimados descendientes han adquirido el gusto por el vino @wine! - simplemente no podemos tener suficiente de él.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] ahora debemos saciar la sed de [ROOT.GetCountry.GetRuler.GetHerHis] personas asegurándonos de que un flujo constante de fruta de la vid llegue a [ROOT.GetCountry.GetCapital.GetName|T]. Pero ¿quién en nuestra sociedad es digno de recibir el mejor vino?\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
germania_main_mission_9_7_tt: "#Y Decidiremos qué hacer con el mejor vino que estamos importando.#!"

germania_main_mission_10_1: "Edad de Oro"
germania_main_mission_10_1_DESC: "Nunca antes el pueblo de [ROOT.GetCountry.GetName] había disfrutado de períodos semejantes de paz y prosperidad. El pueblo abraza [ROOT.GetCountry.GetRuler.GetName] y alaba a los dioses por el liderazgo del [ROOT.GetCountry.GetRulerTitle], y con nuestras costas protegidas por la marina más poderosa de nuestra parte del mundo, [ROOT.GetCountry.GetRuler.GetFirstName] ha proclamado el comienzo de una #T Edad de Oro#!, una que las historias recordarán durante miles de años hasta venir.\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"

germania_main_mission_10_2: "la ciudad"
germania_main_mission_10_2_DESC: "Hay muchas ciudades de renombre y esplendor que se encuentran dentro de [ROOT.GetCountry.GetName|T] y, sin embargo, [ROOT.GetCountry.GetCapital.GetName|T] se destaca por encima de las demás como la más grande; un diamante entre rubíes. La capital [ROOT.GetCountry.GetAdjective|G] es tan grande que muchos simplemente se refieren a ella como '#Y La ciudad#!', ya que no necesita otra nombre.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"

germania_main_mission_11_1: "Los juegos celtas"
germania_main_mission_11_1_DESC: "En un intento de emular los juegos históricos celebrados por las sociedades antiguas del sur, [ROOT.GetCountry.GetRuler.GetName] ha proclamado el establecimiento de los llamados #E Juegos Celtas#!.\n\nGuerreros y atletas de todo [ROOT.GetCountry.GetName] viajarán a [ROOT.GetCountry.GetCapital.GetName] para participar en el evento, y un espíritu de emoción se ha apoderado de las personas que viven en la ciudad mientras esperan ansiosamente que comiencen los juegos.\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"

germania_main_mission_11_2: "El camino a seguir"
germania_main_mission_11_2_DESC: "Últimamente, [ROOT.GetCountry.GetRuler.GetName|Y] ha estado de humor pensativo mientras [ROOT.GetCountry.GetRuler.GetSheHe] considera cuestiones importantes del pasado y el futuro. Mucho ha cambiado para la gente de [ROOT.GetCountry.GetName|T] en los últimos años, más de lo que le ha sucedido a nuestro país antes. ¿Es justo decir que somos los mismos que éramos antes o nos hemos convertido en otra cosa? Quizás este momento sea un nuevo comienzo para lo que nuestro pueblo eventualmente llegará a ser.\n\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
you_need_to_form_germania_tt: "Necesitamos tomar la decisión de #Y formar Germania#!."

germania_main_mission_11_3: ""
germania_main_mission_11_3_DESC: ""

#Events

me_germania_1_title: "Regalía real"
me_germania_1_desc: "En un día que pocos creían que sucedería, [ROOT.GetCountry.GetRuler.GetName], [ROOT.GetCountry.GetRulerTitle] de [ROOT.GetCountry.GetName], fue bendecido por #E druidas#! de [GetProvince('(int32)2012').GetName] que habían viajado hasta [ROOT.GetCountry.GetCapital.GetName] con regalos para el nuevo monarca.\n\nEn señal de su respeto y afecto por el famoso gobernante del [ROOT.GetCountry.GetAdjective] pueblo, [ROOT.GetCountry.GetRuler.GetFirstName] y [ROOT.GetCountry.GetRuler.GetHerHis] progenie han sido aclamados por los druidas como los fundadores de una nueva dinastía; la #E Casa de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#!. Los dioses han bendecido a la familia [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] sin medida y los han establecido como los gobernantes divinamente designados de las tribus germánicas, y para consolidar su autoridad entre sus parientes a lo largo de los siglos venideros, los druidas han traído tres artefactos de poder legendario y los han presentado como regalos; [ROOT.GetCountry.GetRuler.GetFirstName] ahora debe elegir qué servirá como [ROOT.GetCountry.GetRuler.GetHerHis] regalía imperial."
me_germania.1.a: "El anillo será el símbolo de mi autoridad real."
me_germania.1.b: "Viajeros vendrán de lejos para rendir homenaje ante mi trono."
me_germania.1.c: "Fabricaré una lanza utilizada por verdaderos [ROOT.GetCountry.GetAdjective] guerreros."
me_germania_1_tooltip: "¡La tarea de misión '#Y Royal Regalia#!' ahora ha sido #G completada#!!"

me_germania_2_title: "El pozo de Wodenaz"
me_germania_2_desc: "La llegada de [SCOPE.sCharacter('priest').GetName] a la casa [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] siempre pone a [ROOT.GetCountry.GetRuler.GetName] en vilo, ya que el #E Sumo Sacerdote#! nunca se digna visitarlo a menos que haya algún asunto grave entre manos, y el encuentro inesperado de hoy desafortunadamente demostró que este dicho es cierto una vez más.\n\nEsta vez, [ROOT.GetCountry.Custom('get_harvest_goddess')] no molestó [SCOPE.sCharacter('priest').GetFirstName], pero en cambio, el dios [GetDeityDefinition('omen_wodenaz').GetName] aparecía en [SCOPE.sCharacter('priest').GetHerHis] sueños con una orden urgente.\n\nLos dioses de [ROOT.GetCountry.GetName] habían escudriñado el corazón y el alma de [ROOT.GetCountry.GetRuler.GetFirstName] y habían descubierto las verdaderas profundidades de las ambiciones de [ROOT.GetCountry.GetRuler.GetHerHis], y si [ROOT.GetCountry.GetRulerTitle] deseaba verlo todo que [ROOT.GetCountry.GetRuler.GetSheHe] desea que se haga realidad, entonces [ROOT.GetCountry.GetRuler.GetSheHe] debe dejar [ROOT.GetCountry.GetCapital.GetName] y dirigirse al extremo norte en una santa peregrinación. Si se descubriera que [ROOT.GetCountry.GetRuler.GetFirstName] era digno, entonces se le revelaría un gran regalo a [ROOT.GetCountry.GetName], pero [ROOT.GetCountry.GetRulerTitle] tendría que hacer un gran sacrificio."
me_germania.2.a: "Interesante...me embarcaré en esta aventura."
me_germania.2.b: "[ROOT.GetCountry.GetName] necesita mi mano firme para guiarlo; no puedo irme"
me_germania_2_tooltip: "¡La tarea de misión '#Y El pozo de Wodenaz#!' ya ha sido #G completada#!!"

me_germania_3_title: "Reprimir a las élites"
me_germania_3_desc: "Se ha hecho ampliamente conocido en [ROOT.GetCountry.GetName] que los dioses comulgan con [ROOT.GetCountry.GetRuler.GetName] y han dado sus bendiciones divinas a la casa [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]; Después de todo lo que [ROOT.GetCountry.GetRuler.GetFirstName] ha logrado, ¿quién puede negar lo que es tan obvio de ver? Oponerse a [ROOT.GetCountry.GetRuler.GetFirstName] es oponerse a los mismos dioses.\n\nConfiado en la capacidad de [ROOT.GetCountry.GetRuler.GetHerHis] para hacer cumplir la voluntad de [ROOT.GetCountry.GetRuler.GetHerHis], [ROOT.GetCountry.GetRuler.GetFirstName] ha declarado que [ROOT.GetCountry.GetRuler.GetSheHe] desea establecer una dinastía real en [ROOT.GetCountry.GetCapital.GetName] que gobernará a nuestro pueblo hasta el fin de los días."
me_germania.3.a: "Muy pronto tomaré una decisión importante sobre nuestro futuro."
me_germania_3_tooltip: "¡La tarea de misión '#Y Suprimir a las élites#!' ya ha sido #G completada#!!"

me_germania_4_title: "Respeto por los mayores"
me_germania_4_desc: "[ROOT.GetCountry.GetRuler.GetName] ha complacido a muchos con la [ROOT.GetCountry.GetRuler.GetHerHis] decisión de ceder a los Ancianos Tribales en asuntos grandes y pequeños en el futuro.\n\nHubiera sido muy fácil para [ROOT.GetCountry.GetRuler.GetFirstName] simplemente haberse apoderado de todo el poder político [ROOT.GetCountry.GetRuler.GetHerHim], pero la decisión del nuevo [ROOT.GetCountry.GetRulerTitle|E], un líder poderoso en el #E [ROOT.GetCountry.GetAdjective] Senado#!, muestra una madurez y sabiduría que revela no sólo [ROOT.GetCountry.GetRuler.GetHerHis] amor por la tradición, sino también una comprensión de cómo se debe jugar el juego."
me_germania.4.a: "Las sabias decisiones de los Ancianos nunca nos han desviado"
me_germania_4_tooltip: "¡La tarea de la misión '#Y Respeto por los mayores#!' ya ha sido #G completada#!!"

me_germania_5_title: "Rex germanorum"
me_germania_5_desc: "En retrospectiva, debería haber sido obvio para los #E jefes tribales#! que servían bajo el [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] clan y sus parientes, pero cuando aquellos con poder dentro de [ROOT.GetCountry.GetName] se dieron cuenta de lo que estaba sucediendo, ya era demasiado tarde para hacer algo al respecto.\n\n [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName], el jefe hambriento de poder de la mayoría poderosa familia que vivía dentro de [ROOT.GetCountry.GetCapital.GetName], había consolidado suficiente autoridad personal y había comprado suficientes compinches para apoderarse de la corona [ROOT.GetCountry.GetRuler.GetHerHim], y [ROOT.GetCountry.GetRuler.GetFirstName] pasaría a ser conocido en la historia como el fundador de la primera dinastía de #E reyes germánicos#!.\n\nA partir de este día, los Consejos de Ancianos ya no se reunirían bajo la atenta mirada de los #E Druidas#! para interpretar los presagios y la voluntad de los dioses, ya que toda la autoridad había sido puesta en los brazos de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] Reyes y Reinas que gobernaban desde su hogar ancestral en [ROOT.GetCountry.GetCapital.GetName]."
me_germania.5.a: "¡Todos saluden [ROOT.GetCountry.GetName] y a la familia real!"
me_germania_5_tooltip: "¡La tarea de misión '#Y Rex Germanorum#!' ya ha sido #G completada#!!"

me_germania_6_title: "Favor de los dioses"
me_germania_6_desc: "El carnyx ha cesado en sus lamentos sedientos de sangre y nuestras levas, cansadas de la guerra, permanecen en casa con sus tribus, agradecidas por una rara temporada de paz para atender a sus familias y sus asuntos. No pasará mucho tiempo antes de que [ROOT.GetCountry.GetRuler.GetName] los llame a la batalla, pero por ahora, pueden dormir junto a sus propios hogares y no en el duro suelo de un [ROOT.GetCountry.GetAdjective] campamento de guerra. Se proclamó en la capital una fiesta religiosa en honor del botín de guerra que nos ha asegurado la victoria; tenemos muchas cosas por las que estar agradecidos.\n\nFue durante este momento de respiro en [ROOT.GetCountry.GetCapital.GetName] que [SCOPE.sCharacter('priest').GetName] reveló a [ROOT.GetCountry.GetRuler.GetFirstName] el secreto de las extrañas visiones que plagaban los sueños del Sumo Sacerdote; el dios de la cosecha, [ROOT.GetCountry.Custom('get_harvest_goddess')], caminaba por los bosques de [ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName] esparciendo puñados de semillas en el suelo. Cuando cada grano tocó la tierra húmeda del interior [ROOT.GetCountry.GetAdjective], un edificio de piedra surgió de la tierra como una flor en ciernes, y siguiendo los pasos del Protector de las Cosechas, ciudades brotaron en los bosques oscuros como hongos después de la lluvia. \n\nAEl mensaje de [ROOT.GetCountry.Custom('get_harvest_goddess')] fue claro; debemos plantar y construir ciudades en todo [ROOT.GetCountry.GetName]."
me_germania.6.a: "Si [ROOT.GetCountry.Custom('get_harvest_goddess')] desea que construyamos ciudades, entonces hay que hacerlo."
me_germania.6.b: "Yo personalmente decidiré cómo [ROOT.GetCountry.GetName] hace sus inversiones..."
me_germania_6_tooltip: "¡La tarea de la misión '#Y Un poder centralizado#!' ahora ha sido #G completada#!!"

me_germania_7_title: "Sangre de los reyes germánicos"
me_germania_7_desc: "En las décadas y siglos venideros, el nombre del #E [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] Clan#! seguiría siendo importante en las historias del pueblo [ROOT.GetCountry.GetAdjective] y sus #E descendientes germánicos#!, ya que los logros de los [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] habían sentado las bases para las glorias futuras.\n\nPor Al unificar las muchas tribus más pequeñas en una sola e invertir fuertemente en la infraestructura del reino, los [ROOT.GetCountry.GetAdjective] habían creado lentamente algo parecido a una identidad nacional en el proceso, y las canciones y poemas de la gente común inmortalizarían las hazañas de [ROOT.GetCountry.GetRuler.GetName], quien sería conocido como un héroe popular.\n\nEstar relacionado con la familia [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] era uno de los más altos honores en la sociedad germánica, y llevar el prestigioso linaje se consideraba la marca de la verdadera nobleza."
me_germania.7.a: "En todas partes se venera el nombre de la familia [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]"
me_germania_7_tooltip: "¡La tarea de misión '#Y Sangre de los reyes germánicos#!' ya ha sido #G completada#!!"

me_germania_8_title: "El mar nos pertenece"
me_germania_8_desc: "Ahora que hemos construido una flota adecuada que es digna de [ROOT.GetCountry.GetName], nuestros intrépidos marineros han anunciado audazmente que navegarán más lejos que nadie antes: ¡reclamamos mar abierto para nosotros mismos, y todo para la gloria del pueblo [ROOT.GetCountry.GetAdjective]!\n\nDebido a que somos relativamente inexpertos cuando se trata de construir flotas, [ROOT.GetCountry.GetRuler.GetName] ha ordenado a nuestras fuerzas navales que entrenar duro para compensar este déficit."
me_germania.8.a: "La tarea que tienes por delante es difícil, pero ¿la harías de otra manera?"
me_germania_8_tooltip: "¡La tarea de misión '#Y El mar nos pertenece#!' ya ha sido #G completada#!!"

me_germania_9_title: "Asaltantes profesionales"
me_germania_9_desc: "No se puede subestimar el amor que tiene [ROOT.GetCountry.GetRuler.GetName] por asaltar las tierras indefensas de nuestros enemigos; [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] pasaría [ROOT.GetCountry.GetRuler.GetHerHis] todo el tiempo quemando aldeas y masacrando a los débiles si [ROOT.GetCountry.GetRuler.GetSheHe] pudiera.\n\nCuando algunos de los asesores más cercanos de [ROOT.GetCountry.GetRuler.GetHerHis] sugirieron que tomáramos medidas para aumentar la efectividad letal de nuestros asaltantes, [ROOT.GetCountry.GetRuler.GetFirstName] aceptó incondicionalmente y prometió dedicar todos los recursos de [ROOT.GetCountry.GetName] a resolviendo el problema que nos ocupa."
me_germania.9.a: "Debemos tomar todas las medidas disponibles para proteger a nuestros hombres."
me_germania.9.b: "Concéntrate en los jefes tribales y diles que hagan lo que quieran."
me_germania_9_tooltip: "¡La tarea de misión '#Y Asaltantes profesionales#!' ahora ha sido #G completada#!!"

me_germania_11_title: "Llamada de lo salvaje"
me_germania_11_desc: "Aunque [ROOT.GetCountry.GetRuler.GetName] es el principal responsable de los cambios en nuestra sociedad, [ROOT.GetCountry.GetRuler.GetSheHe] reconoce que no todos los que viven en [ROOT.GetCountry.GetName] están encantados de ver estructuras permanentes construidas en los bosques y campos que criaron a nuestros antepasados. ¿Cómo puede un hombre dormir por la noche sin ver el dosel de estrellas sobre él? ¿Realmente estamos destinados a pasar nuestros días trabajando duro en el campo, rompiendo terrones de tierra con nuestras manos e implementos de hierro?\n\nMuchos dicen que no. El susurro del viento y el murmullo del arroyo han llenado sus cabezas de promesas de una vida más sencilla, como la que disfrutaron sus padres, y muchas tribus han enviado a sus Ancianos a [ROOT.GetCountry.GetCapital.GetName] para pedir permiso para migrar a territorios no reclamados. Una vez que [ROOT.GetCountry.GetRuler.GetFirstName] se dio cuenta de que algunos de nuestros compatriotas estaban dispuestos a abandonar todo lo que sabían para atender el llamado de la naturaleza, se hicieron todos los esfuerzos posibles para apoyarlos, a pesar de que los costos involucrados eran sustanciales."
me_germania.11.a: "No hay precio para la felicidad - ve con mi bendición"
me_germania_11_tooltip: "¡La tarea de misión '#Y Call Of The Wild#!' ya ha sido #G completada#!!"

me_germania_12_title: "Gran República Germánica"
me_germania_12_desc: "Nuestros hechos son aclamados en todas partes y es gracias al liderazgo desinteresado de [ROOT.GetCountry.GetRuler.GetName] que nuestra reputación se ha hecho conocida en todo el mundo civilizado. La lista de glorias es interminable; nuestras fronteras se han expandido y crecido, nuestros guerreros nos han traído innumerables victorias y nuestros productos comerciales son muy deseados en mercados alejados de los talleres que los producen. Los hijos y nietos de humildes miembros de tribus han construido algo de lo que realmente deberían estar orgullosos."
me_germania.12.a: "Puedo sentir a mis ancestros sonriéndome..."
me_germania_12_tooltip: "¡La tarea de la misión '#Y Gran República Germánica#!' ya ha sido #G completada#!!"

me_germania_13_title: "Echando raíces"
me_germania_13_desc: "[ROOT.GetCountry.GetRuler.GetName] no puede evitar quedar impresionado por la tenacidad de la gente [ROOT.GetCountry.GetRuler.GetHerHis], ya que cualquier tarea que [ROOT.GetCountry.GetRulerTitle] les plantea se realiza con una facilidad que avergüenza a las tribus vecinas.\n\nNo solo hemos expulsado a nuestros enemigos del campo de batalla una y otra vez, sino que nuestros parientes se han destacado a la hora de construir nuestra infraestructura, especialmente en [ROOT.GetCountry.GetCapital.GetName]. Estamos construyendo estructuras permanentes de piedra en nuestra capital, plantando cultivos en el interior y limpiando los campos de maleza y maleza. Como un árbol que brota en primavera, nuestra civilización está comenzando lentamente a brotar."
me_germania.13.a: "Un árbol es tan fuerte como sus raíces: crezcamos"
me_germania_13_tooltip: "¡La tarea de la misión '#Y Echar raíces#!' ya ha sido #G completada#!!"

me_germania_14_title: "Gran puerto germánico"
me_germania_14_desc: "Cuando llegó a la capital la noticia de que el llamado #E 'Gran Puerto Germánico'#! acababa de terminar su construcción, [ROOT.GetCountry.GetRuler.GetName] personalmente hizo el viaje a la costa para presenciar el viaje inaugural de la primera [ROOT.GetCountry.GetAdjective] armada construida en su dique seco.\n\nAunque hubo algunas dificultades técnicas al principio, el capitán del barco tuvo dificultades para lidiar con el fuerte viento del norte y no pudo salir del puerto: nuestros marineros recién bautizados pudieron navegar hacia el #E Oceanus Sarmaticus#!, lo que provocó que la multitud reunida vitoreara al unísono. Nuestros barcos hicieron algunas maniobras en el mar, ejecutando formaciones de batalla con una habilidad que contradecía su relativa inexperiencia, y [ROOT.GetCountry.GetRuler.GetFirstName] quedó impresionado por la rapidez con la que los [ROOT.GetCountry.GetAdjective] marineros se lanzaban a las aguas."
me_germania.14.a: "¡Esto es un buen augurio para nuestro éxito futuro en el mar!"
me_germania_14_tooltip: "¡La tarea de misión '#Y Gran puerto germánico#!' ya ha sido #G completada#!!"

me_germania_15_title: "Levantar las murallas"
me_germania_15_desc: "Aunque llevó muchos meses de trabajo agotador, nuestros cansados guerreros tribales pudieron dejar a un lado sus lanzas para una temporada de lucha y reforzar las fortificaciones que protegían [ROOT.GetCountry.GetCapital.GetName]. A [ROOT.GetCountry.GetRuler.GetName] le preocupaba que nuestros soldados se resistieran a que les pidieran que sirvieran [ROOT.GetCountry.GetName] de esta manera, pero, sorprendentemente, no hubo quejas; Nuestros ejércitos renunciaron a la oportunidad de atacar a nuestros enemigos durante los meses más calurosos y, en cambio, pasaron muchas semanas miserables cavando fosos alrededor de la capital y levantando la tierra alrededor de las murallas de nuestra ciudad.\n\nCuando finalmente se terminó el trabajo de extracción, [ROOT.GetCountry.GetRuler.GetFirstName] se sintió abrumado por la emoción y pronunció un discurso público agradeciendo a nuestros parientes por lo que habían logrado."
me_germania.15.a: "Los sacrificios hechos aquí protegerán a los hijos de sus nietos..."
me_germania_15_tooltip: "¡La tarea de misión '#Y Levantar las murallas#!' ya ha sido #G completada#!!"

me_germania_16_title: "La Costa de Ámbar"
me_germania_16_desc: "Gracias a los esfuerzos combinados de nuestros miembros de la tribu que recolectan ámbar @amber! de los bosques y de nuestros artesanos y comerciantes que lo venden a extranjeros, las tesorerías de [ROOT.GetCountry.GetName] están aumentando; cambiamos nuestra savia de oro por monedas de oro, lo cual es un acuerdo que le sienta bastante bien a nuestra gente.\n\nFrente a un excedente saludable, [ROOT.GetCountry.GetRuler.GetName] tiene que tomar una decisión; ¿Cómo se deben utilizar estos fondos?"
me_germania.16.a: "Guardemos este dinero para un día lluvioso..."
me_germania.16.b: "Deberíamos reinvertir nuestro dinero en el comercio del ámbar."
me_germania_16_tooltip: "¡La tarea de misión '#Y La Costa Ámbar#!' ya ha sido #G completada#!!"

me_germania_17_title: "Una nueva capital"
me_germania_17_desc: "Ahora que somos un imperio poderoso y ya no un reino o una confederación de jefes tribales, algunos han propuesto que traslademos la sede del gobierno de [ROOT.GetCountry.GetCapital.GetName] a un nuevo lugar. Una nueva capital podría representar un nuevo futuro para la gente de [ROOT.GetCountry.GetName] mientras nos reunimos para establecer un nuevo hogar - una idea que atrae a [ROOT.GetCountry.GetRuler.GetName] - pero [ROOT.GetCountry.GetRuler.GetSheHe] tendrá la decisión final sobre lo que finalmente se haga."
me_germania.17.a: "Nuestra perla se convertirá en la capital."
me_germania.17.b: "La ciudad con más fortificaciones es mi elección."
me_germania.17.c: "Hibernia es nuestro hogar y siempre lo será."
me_germania.17.d: "Colocaremos nuestra capital en una isla y la convertiremos en un paraíso."
me_germania.17.e: "Invertir estas energías en nuestra casa tradicional"
me_germania_17_tooltip: "¡La tarea de la misión '#Y Una nueva capital#!' ya ha sido #G completada#!!"

me_germania_18_title: "Fuente de inspiración"
me_germania_18_desc: "Nuestro viaje organizado por [ROOT.GetCountry.GetRuler.GetName] fue un gran éxito y se descubrieron muchos lugares. ¡Ha llegado el momento de #Y Elegir#! una forma de modernizar nuestro país para convertirnos en una nueva #G Gran Potencia#!!"
me_germania.18.a: "Alejandro podría haber sido celta"
me_germania.18.b: "Tácticas romanas versus tácticas romanas"
me_germania.18.c: "Hemos oído hablar de un tal Aníbal."
me_germania_18_tooltip: "¡La tarea de la misión '#Y Fuente de inspiración#!' ya ha sido #G completada#!!"
hellenic_ways_tt: "La siguiente tarea y recompensas se centrarán en crear una #T Sociedad Helénica#!"
italic_ways_tt: "La siguiente tarea y recompensas se centrarán en crear una #T Sociedad Romana#!"
punic_ways_tt: "La siguiente tarea y recompensas se centrarán en crear una #T Sociedad Púnica#!"

me_germania_19_title: "consejo de guerra"
me_germania_19_desc: "Desde hace muchos meses, en [ROOT.GetCountry.GetCapital.GetName] se llevan a cabo conversaciones serias sobre el futuro de las tribus [ROOT.GetCountry.GetAdjective]. No es ningún secreto que el pueblo de [ROOT.GetCountry.GetName] se ha fortalecido en los últimos años, y rápidamente se acerca un momento en el que ninguna confederación tribal o liga defensiva podrá frustrar nuestros esfuerzos por unificar todo el norte. Debido a que nadie puede esperar oponerse a nosotros, [ROOT.GetCountry.GetRuler.GetName] ha argumentado que esto nos da el derecho de subyugar a nuestros vecinos - que aquellos que se oponen a nosotros lo hagan militarmente, porque nuestras mentes no cambiarán.\n\nEl nombre del infame [ROOT.GetCountry.GetRuler.GetFirstName] es conocido a mil millas en todas direcciones, y hay muchos hombres que temen las levas de [ROOT.GetCountry.GetName] debido a nuestra reputación salvaje en el campo de batalla. Algunos de estos jefes, con la esperanza de mantener su propio poder frente a nuestro dominio, han enviado emisarios a [ROOT.GetCountry.GetCapital.GetName] con la esperanza de ganarse nuestra amistad, pero [ROOT.GetCountry.GetRuler.GetFirstName] les dice a todos lo mismo, una y otra vez."
me_germania.19.a: "El destino del clan [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] es unir #E Germania#!..."
me_germania_19_tooltip: "¡La tarea de la misión '#Y Consejo de Guerra#!' ya ha sido #G completada#!!"
GEE_unification_opinion: "Todos los países germánicos que no son nuestros súbditos estarán #R enojados#! por nuestra postura bélica."

me_germania_20_title: "Excedente de piedra"
me_germania_20_desc: "Gracias a los esfuerzos de nuestros trabajadores miembros de la tribu, hemos reunido mucha piedra @stone! de las minas y montañas de [ROOT.GetCountry.GetName] durante los últimos meses. Aunque las quejas de nuestros parientes han sido feroces, se han resignado a la difícil tarea.\n\nUna vez que el valioso mineral ha sido extraído de las canteras, nuestros gimientes trabajadores llenan hasta el borde un carro tras otro, quienes luego hacen el largo viaje por tierra hasta [ROOT.GetCountry.GetCapital.GetName] para entregar las materias primas al lugar de trabajo que más las necesite. Nuestros arquitectos creen que los excedentes que estamos acumulando harán que su trabajo avance más rápido de lo que pensaban originalmente: música para los oídos de [ROOT.GetCountry.GetRuler.GetName]."
me_germania.20.a: "¡Que nuestros edificios recién construidos resistan la prueba del tiempo!"
me_germania_20_tooltip: "¡La tarea de misión '#Y Excedente de piedra#!' ya ha sido #G completada#!!"

me_germania_21_title: "Asimilación en Germania"
me_germania_21_desc: "Gracias a los esfuerzos realizados por las iniciativas [ROOT.GetCountry.GetRuler.GetName] y [ROOT.GetCountry.GetRuler.GetHerHis] para hacer de [ROOT.GetCountry.GetName] una potencia en ascenso, nuestra capital [ROOT.GetCountry.GetCapital.GetName] ha comenzado a atraer a mucha gente de todo el mundo tribal, e incluso a veces recibimos visitantes de ciudades lejanas del #E Mediterráneo#! y más allá.\n\nMientras continúa la afluencia de recién llegados a nuestra sociedad Aunque ha traído oportunidades, también ha causado cierta tensión entre nuestro pueblo y estos extraños que en gran medida ignoran nuestras costumbres. La nobleza ha solicitado [ROOT.GetCountry.GetRuler.GetFirstName] que emita un edicto sobre el estatus de los extranjeros que viven dentro de nuestras fronteras."
me_germania.21.a: "Aquí todos son bienvenidos: vengan como sean, pero traigan oro."
me_germania.21.b: "Puedes quedarte si adoptas nuestras costumbres y vives como nosotros."
me_germania_21_tooltip: "¡La tarea de misión '#Y #!' ahora ha sido #G completada#!!"

me_germania_22_title: "Una historia de justicia"
me_germania_22_desc: "Desde que éramos una sola tribu, los druidas eran conocidos como los maestros, sacerdotes y jueces de nuestra sociedad. Ahora tenemos una capital en crecimiento con gente que pide infraestructura y administración más modernas, y los ciudadanos dentro de [ROOT.GetCountry.GetCapital.GetName] quieren que sus voces sean escuchadas en los tribunales y han exigido juicios justos. Los druidas han presionado a [ROOT.GetCountry.GetRuler.GetName] para que confirme que la justicia debe permanecer en manos de quienes tienen más conocimientos; en otras palabras, los propios druidas.\n\nEsto está creando un terrible dolor de cabeza para el [ROOT.GetCountry.GetRulerTitle], quien se da cuenta de que la [ROOT.GetCountry.GetRuler.GetHerHis] decisión afectará el futuro de muchas [ROOT.GetCountry.GetAdjective] personas durante las generaciones venideras."
me_germania.22.a: "Los druidas deben seguir a cargo"
me_germania.22.b: "Los dioses velarán por nosotros bajo la vigilancia de los jueces."
me_germania_22_tooltip: "¡La tarea de la misión '#Y Una historia de justicia#!' ya ha sido #G completada#!!"

me_germania_23_title: "Ambición colonial"
me_germania_23_desc: "Nuestro pueblo sabe desde hace mucho tiempo que las aguas heladas del #E Oceanus Sarmaticus#! eventualmente se encuentran con las costas barridas por el viento de una vasta tierra boscosa, un lugar inhóspito que es hogar de morsas y osos hostiles, y hay buenas razones para que ninguna [ROOT.GetCountry.GetAdjective] tribu se haya asentado en sus costas... y sin embargo, incluso esto ha cambiado bajo el liderazgo de [ROOT.GetCountry.GetRuler.GetName].\n\nConfiado en las capacidades de [ROOT.GetCountry.GetName] para sostener una colonia a través de las aguas, el [ROOT.GetCountry.GetRulerTitle] ha ordenado a nuestra marina que prepare el camino para nuestros colonos."
me_germania.23.a: "Es hora de hacer historia..."
me_germania_23_tooltip: "¡La tarea de misión '#Y Ambición colonial#!' ya ha sido #G completada#!!"

me_germania_24_title: "Demasiado tarde..."
me_germania_24_desc: "Lo que podría ser un lugar perdido e inhóspito es ahora una región totalmente ocupada que está en manos de otra potencia. Si queremos nuestra parte del pastel, ¡tendremos que cortarlo con la espada!"
me_germania.24.a: "¡Será mío!"
me_germania_24_tooltip: "¡La tarea de misión '#Y Demasiado tarde...#!' ya ha sido #G completada#!!"

me_germania_25_title: "Colonia fennica exitosa"
me_germania_25_desc: "[ROOT.GetCountry.GetRuler.GetName], hemos recibido buenas noticias de la ciudad de [GetProvince('(int32)9371').GetName] de que nuestros valientes colonos se han establecido en las tierras malditas de #E Hiperbórea#!, un lugar abandonado por el dios sol.\n\nLas cosas van bien, un testimonio de la cordialidad y la fuerza de nuestros [ROOT.GetCountry.GetAdjective] parientes, que pueden prosperar en cualquier lugar donde se encuentren. Son enviados. Pero el gobernador local ha pedido orientación sobre los miembros de la tribu local #E Fennic#!, que aparecen con mayor frecuencia en nuestros mercados. Sus extrañas costumbres han llamado la atención de muchos de nuestros parientes, e incluso se dice que algunos de nuestros hermanos están recurriendo a los dioses #E Ilmaric#! - ¡realmente, una cosa extraña!"
me_germania.25.a: "Lo mejor para todos es que vivamos juntos en armonía."
me_germania.25.b: "Extorsionar a los lugareños y quitarles todo lo que podamos."
me_germania.25.d: "Quizás sea mejor dejarlos solos."
me_germania.25.c: "¡Qué vida deben llevar... una ciudad al borde de la civilización!"
soodak_ai_subject_tt: "Liberaremos a la #T ciudad de Soodak#! como #G vasallo colonial#! especial."
soodak_tagswitch_tt: "Etiquetaremos a Switch y jugaremos como la #G influenciada por Fennic#! #T Ciudad de Soodak#!."
me_germania_25_tooltip: "¡La tarea de misión '#Y Colonia fennica exitosa#!' ahora ha sido #G completada#!!"

me_germania_26_title: "Atacar a nuestros enemigos"
me_germania_26_desc: "Cuando nuestros codiciosos #E jefes tribales#! se enteraron de los grupos de asalto liderados por los valientes [ROOT.GetCountry.GetRuler.GetName], solicitaron a [ROOT.GetCountry.GetCapital.GetName] el derecho a hacer lo mismo; un privilegio que [ROOT.GetCountry.GetRuler.GetFirstName] estaba feliz de otorgar, con el entendimiento de que la mayor parte de la riqueza sería llevada a la [ROOT.GetCountry.GetAdjective] capital como tributo.\n\nUn mes después, los grandes Caciques aparecieron en persona para entregar el oro y los esclavos tomados de las tierras de nuestros enemigos, y [ROOT.GetCountry.GetRuler.GetFirstName] pasó muchas largas horas escuchando las historias de sus hazañas."
me_germania.26.a: "Hay mucho botín que sacar de las tierras de los débiles..."
me_germania_26_tooltip: "¡La tarea de misión '#Y Atacar a nuestros enemigos#!' ya ha sido #G completada#!!"

me_germania_27_title: "Verdad y reconciliación"
me_germania_27_desc: "Comer o ser comido; eso es lo que la mayoría de nuestros [ROOT.GetCountry.GetAdjective] soldados creen, pero incluso nuestros soldados curtidos en la batalla pueden admitir cuando han cometido un error, y muchos que viven en [ROOT.GetCountry.GetName} han reevaluado nuestra relación con los romanos.\n\nNuestro pueblo solía ver a los romanos como bárbaros asesinos, pero gracias a los esfuerzos de nuestros diplomáticos, nos hemos hecho amigos de los italianos; ahora afirman vernos como socios, y han expresado con entusiasmo su deseo de colaborar en el futuro.\n\nMientras las elites que viven dentro de [ROOT.GetCountry.GetCapital.GetName] esperan públicamente lo mejor, hay quienes creen cínicamente que la concordia entre nuestros pueblos es temporal, y que un día pronto, las brasas de la discordia arderán nuevamente en los corazones de los hombres y hundirán nuestro reino en la guerra... pero ese es el problema de mañana, por hoy, nos hemos unido y caminamos hacia abajo. El camino juntos."
me_germania.27.a: "Que esta amistad dure."
me_germania_27_tooltip: "¡La tarea de la misión '#Y Verdad y Reconciliación#!' ya ha sido #G completada#!!"

me_germania_28_title: "Tratar con los romanos"
me_germania_28_desc: "Mientras que muchos afirman que hay que temer a los ejércitos de #E Roma#!, [ROOT.GetCountry.GetRuler.GetName] ha llevado a nuestros soldados contra los suyos y considera que su reputación es exagerada. El [ROOT.GetCountry.GetRulerTitle] ha perdido la cuenta de las veces que nuestros hombres han saqueado sus ciudades y templos, llevándose sus vasijas de plata y oro mientras incendiábamos sus hogares. ¿Por qué todo el mundo le tiene tanto miedo al lobo que ladra?"
me_germania.28.a: "Creo que los romanos no tardarán mucho en este mundo..."
me_germania_28_tooltip: "¡La tarea de misión '#Y Tratar con los romanos#!' ya ha sido #G completada#!!"

me_germania_29_title: "Dos reinos, un imperio"
me_germania_29_desc: "[ROOT.GetCountry.GetRuler.GetName] es temido en las capitales de nuestros enemigos como un guerrero feroz y general de renombre; todos los elogios que [ROOT.GetCountry.GetRuler.GetSheHe] merece, porque [ROOT.GetCountry.GetRulerTitle] ha conquistado muchas naciones, rompiendo las coronas y cetros de innumerables monarcas que se atrevieron a oponerse a la voluntad del pueblo [ROOT.GetCountry.GetAdjective].\n\nY si bien las extensas posesiones de [ROOT.GetCountry.GetName] abarcan dominios en las islas y en el continente, separados por miles de kilómetros de bosque y océano, son un unión inquebrantable, unidos en propósito y destino: el imperio cohesivo forjado por [ROOT.GetCountry.GetRuler.GetFirstName] es digno de admiración, de hecho."
me_germania.29.a: "¡La gente de [ROOT.GetCountry.GetName] es imparable!"
me_germania_29_tooltip: "¡La tarea de misión '#Y Dos reinos, un imperio#!' ya ha sido #G completada#!!"

me_germania_30_title: "Una capital gala"
me_germania_30_desc: "Las fronteras de [ROOT.GetCountry.GetName] son tan amplias que se ha establecido una segunda capital imperial dentro de la #E Galia#!, que servirá como sede regional de poder y centro comercial para los [ROOT.GetCountry.GetAdjective] comerciantes.\n\nPara conmemorar la ocasión, una procesión de sacerdotes partió de [ROOT.GetCountry.GetCapital.GetName] y navegó hacia el continente, desde donde continuaron. Dondequiera que iban, bendecían al pueblo y pedían que los dioses velaran por la nueva capital, ofreciéndole protección de nuestros enemigos."
me_germania.30.a: "¡No se puede cuestionar la legitimidad de mi dinastía!"
me_germania_30_tooltip: "¡La tarea de misión '#Y Una capital gala#!' ya ha sido #G completada#!!"

me_germania_31_title: "Germania Magna"
me_germania_31_desc: "Las tribus #E Ingvaeonic#! e #E Istvaeonic#! lucharon valientemente para conservar sus territorios, pero al final todo fue en vano, ya que su destino se decidió en el momento en que los [ROOT.GetCountry.GetAdjective] impuestos entraron en sus fronteras. Y ahora que nos hemos apoderado de una gran parte de su tierra, debemos aprovechar nuestra ventaja y expulsar toda resistencia a nuestro gobierno dentro de [GetProvince('(int32)3830').GetArea.GetRegion.GetName].\n\n[ROOT.GetCountry.GetRuler.GetName], el impresionante arquitecto de estas victorias, sabe que no debe dejar que estos recientes éxitos se le lleguen a la cabeza a [ROOT.GetCountry.GetRuler.GetHerHis], pero ha dado toda la gloria de nuestros éxitos a los valientes guerreros de [ROOT.GetCountry.GetName]."
me_germania.31.a: "La victoria tiene muchos padres, pero la derrota es huérfana..."
me_germania_31_tooltip: "¡La tarea de misión '#Y Germania Magna#!' ya ha sido #G completada#!!"

me_germania_32_title: "Conquista del norte"
me_germania_32_desc: "A pesar de su reputación de asesinos sedientos de sangre, [ROOT.GetCountry.GetRuler.GetName] ha dispersado las levas de los #E cimbrios#! y #E escandinavos#! ante nuestros ejércitos. Nuestros hombres, ansiosos por cimentar su propia estatura como poderosos conquistadores, no han mostrado piedad hacia los norteños, pero han roto su espíritu de resistencia, un asentamiento incendiado a la vez.\n\nAl darse cuenta de que oponerse a nosotros significa la muerte, hay incluso algunos señores de la guerra cimbrios que han decidido que su futuro está en [ROOT.GetCountry.GetName], y uno de sus jefes más fuertes, [SCOPE.sCharacter('mighty_cimbrian_warlord_scope').GetName], ha llegado a someterse a [ROOT.GetCountry.GetRuler.GetFirstName] en persona. 'Mi espada es tuya si la quieres, [ROOT.GetCountry.GetRulerTitle]... sólo por favor deja de masacrar a mis parientes.'\n\n¿Debería [ROOT.GetCountry.GetRuler.GetName] aceptar su cultura principal como hermanos de sangre? Hay muchas personas que viven con [ROOT.GetCountry.GetCapital.GetName] y que lo considerarían así, pero hay otras que ven este curso de acción como la debilidad personificada."
me_germania.32.a: "Los cimbrios serían una valiosa adición a nuestra sociedad..."
me_germania.32.b: "Los extranjeros no tienen cabida en [ROOT.GetCountry.GetName]"
me_germania.32.c: "Toma el botín de guerra pero no cambies las leyes."
me_germania_32_tooltip: "¡La tarea de la misión '#Y Conquista del Norte#!' ya ha sido #G completada#!!"

me_germania_33_title: "Conquista del Este"
me_germania_33_desc: "Cuando nuestros ejércitos regresaron de las guerras en el este, [ROOT.GetCountry.GetRuler.GetName] ordenó que cada uno de nuestros soldados trajera trofeos del campo de batalla para que nuestros parientes que vivían en casa pudieran ver por sí mismos los frutos de su trabajo; una tarea que nuestros guerreros aceptaron felizmente.\n\nCuando nuestros hombres regresaron a [ROOT.GetCountry.GetCapital.GetName], con sus brazos y cuellos cargados con torques dorados y sus bolsas llenas de botín, comenzaron a dejar los escudos de los guerreros #E góticos#! y #E vandálicos#! asesinados en una gran pila en el centro de la ciudad. Un sombrío monumento que mostró a todos los que viven en la [ROOT.GetCountry.GetAdjective] capital el verdadero costo de la guerra."
me_germania.33.a: "Soy el asesino de miles, de decenas de miles..."
me_germania_33_tooltip: "¡La tarea de la misión '#Y Conquista del Este#!' ya ha sido #G completada#!!"

me_germania_34_title: "Riqueza de Pritannia"
me_germania_34_desc: "Históricamente, Pritania fue el centro comercial de la isla germánica. Muchas ciudades comenzaron a crecer y la gente se conectó con la tierra principal de la Galia.\nPero ahora nuestros soldados con el mando de [ROOT.GetCountry.GetRuler.GetName] están listos para tomar todo por ellos.\n\nPara mantener un gobierno largo y estable deberíamos integrar a algunos de ellos a nuestra corte, pero sería una pérdida de dinero no saquearlo todo ahora."
me_germania.34.a: "No los toques. Ellos son nuestros hermanos"
me_germania.34.b: "Hombres, ustedes son libres de todo."
me_germania.34.c: "¡Quémame todo!"
prittania_domination: "Todas las culturas #Y Pritánicas#! recibirán:"
prittania_slavery: "Todas las culturas #Y Pritánicas#! recibirán:"
me_germania_34_tooltip: "¡La tarea de misión '#Y #!' ahora ha sido #G completada#!!"

me_germania_35_title: "Piratas profesionales"
me_germania_35_desc: "La amenaza de [ROOT.GetCountry.GetAdjective] barcos piratas que acosan las rutas comerciales se ha convertido en una cuestión de la vida diaria de los barcos mercantes que atraviesan los mares del norte, y muchos empresarios extranjeros pagan voluntariamente por el privilegio de un paso seguro a los lucrativos mercados de ámbar y pieles bajo nuestra protección.\n\nEn el pasado, otros jefes habían permitido discretamente que existiera la piratería dentro de [ROOT.GetCountry.GetName], pero ninguno la ha aceptado. Como [ROOT.GetCountry.GetRuler.GetName] tiene; Es justo decir que, bajo la regla [ROOT.GetCountry.GetRuler.GetHerHis], los [ROOT.GetCountry.GetAdjective] son los mayores patrocinadores de la piratería fuera del #E Mediterráneo#!."
me_germania.35.a: "¿Y qué hay de eso?"
me_germania_35_tooltip: "¡La tarea de misión '#Y Piratas profesionales#!' ya ha sido #G completada#!!"

me_germania_36_title: "Ciudades en el bosque"
me_germania_36_desc: "Alguna vez, la extensión tranquila de nuestros bosques fue un impedimento para la invasión de la civilización, pero esto ha cambiado en los últimos años a medida que nuestra comprensión de la arquitectura ha crecido. [ROOT.GetCountry.GetName] a menudo se ha encontrado en una encrucijada, dividida entre el anhelo de mantener nuestras antiguas tradiciones y al mismo tiempo reconocer que necesitamos cambiar en ciertos aspectos.\n\nAfortunadamente, hemos descubierto que podemos tener lo mejor de ambos mundos construyendo ciudades en los bosques; podemos conservar nuestra conexión con la naturaleza y los seres salvajes mientras construimos los centros de civilización que fortalecerán a nuestra gente..."
me_germania.36.a: "Esto lo cambia todo..."
me_germania_36_tooltip: "¡La tarea de la misión '#Y Ciudades en el bosque#!' ya ha sido #G completada#!!"

me_germania_37_title: "Sed de vino"
me_germania_37_desc: "Para bien o para mal, a nuestros compatriotas les gusta beber y se han aficionado increíblemente a los vinos importados del extranjero. Ya no se contenta con solo una pequeña cerveza y hidromiel, el [ROOT.GetCountry.GetAdjective] promedio desea vino para cada ocasión, y las mejores cosechas se venden a precios deslumbrantes en [ROOT.GetCountry.GetCapital.GetName], y solo los verdaderamente ricos pueden permitirse el mejor.\n\n[ROOT.GetCountry.GetRuler.GetName] ha hecho un par de amigos en el negocio de importación a lo largo de los años, y el [ROOT.GetCountry.GetRulerTitle] ha oído hablar de una oportunidad que [ROOT.GetCountry.GetRuler.GetSheHe] no puede dejar pasar; la posibilidad de comprar un exquisito lote de vino a precio reducido. Algunos de los asesores de [ROOT.GetCountry.GetRuler.GetFirstName] han sugerido que este regalo podría compartirse con la gente común."
me_germania.37.a: "Nuestros hombres libres ciertamente disfrutan de una buena bebida, ¿no?"
me_germania.37.b: "No somos nada sin nuestros miembros de la tribu: se merecen lo mejor."
me_germania.37.c: "¡Ja! Tomar el mejor vino y reservarlo para mi uso personal."
me_germania.37.d: "No me importa quién lo beba mientras recaudemos nuestros impuestos."
me_germania.37.e: "¡Construiré la infraestructura para producir nuestros propios vinos locales!"
me_germania.37.f: "Hmm... No quiero tener nada que ver con esto, en realidad."

me_germania_38_title: "Los juegos celtas"
me_germania_38_desc: "Es sabido por [ROOT.GetCountry.GetName] que hay muchos festivales que se celebran en las tierras del extremo sur, siendo los #E Juegos Olímpicos#! los más famosos. Cuando [ROOT.GetCountry.GetRuler.GetName] escuchó que algunos de los nobles que vivían dentro de [ROOT.GetCountry.GetCapital.GetName] viajaban al lejano Mediterráneo para asistir a estos eventos, [ROOT.GetCountry.GetRuler.GetSheHe] decidió que el pueblo celta debía tener sus propios juegos. Ahora, el [ROOT.GetCountry.GetRulerTitle] debe decidir qué tipo de concursos principales tendremos para la primera edición."
me_germania.38.a: "Propongo que corramos sobre las aguas en un espectáculo para siempre."
me_germania.38.b: "Debemos ver una demostración de fuerza y fortaleza en tierra."
me_germania.38.c: "Hagamos una prueba de asuntos relacionados con la fe."
me_germania.38.d: "Nuestros Juegos se centrarán en el intelecto y la sabiduría."
me_germania_38_tooltip: "¡La tarea de misión '#Y Los Juegos Celtas#!' ya ha sido #G completada#!!"

me_germania_39_title: "Surge un guerrero"
me_germania_39_desc: "Este año, para los #Y [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#!, los competidores estuvieron codo a codo y todos dieron lo mejor de sí. Las multitudes que presenciaban los Juegos Olímpicos se divirtieron mucho con los acontecimientos del día hasta el momento, pero no sabían que lo mejor estaba aún por llegar.\n\nLa última serie de eventos olímpicos fueron, respectivamente, el lanzamiento de jabalina, el duelo y las carreras a pie.\nCasi se produjo un disturbio cuando [warrior_champion.GetName] arrojó la jabalina a lo largo de todo el estadio, casi empalando a un noble que miraba desde las gradas. En el evento de duelo, [warrior_champion.GetFirstName] una vez más llegó a la final y ganó la pelea mientras miles de voces aclamaban al unísono.\nDespués de todo este revuelo, nuestro aspirante a campeón terminó el trabajo y completó un maratón en menos de dos horas y media, logrando un récord histórico que pocos creían que pudiera superarse.\n\nToda la multitud comenzó a cantar el nombre del nuevo vencedor: [warrior_champion.GetFirstName], [warrior_champion.GetFirstName], quien fue coronado directamente por nuestro [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName]. Fue un momento que sería recordado por siglos."
me_germania.39.a: "[warrior_champion.GetFirstName] debería convertirse en mi nueva espada..."
celt_martial_olympics_champion: "[warrior_champion.GetName] con un #G Alto#! @military_icon! #Y Se unió a tu Corte#!."

me_germania_40_title: "Discurso del genio"
me_germania_40_desc: "Este año, para los #Y [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#!, los competidores estuvieron codo a codo y todos dieron lo mejor de sí. Las multitudes que presenciaban los Juegos Olímpicos se divirtieron mucho con los acontecimientos del día hasta el momento, pero no sabían que lo mejor estaba por llegar.\n\nEl último evento olímpico del día fue la #Y prueba de Filosofía#!. Esta disciplina, importada de los Juegos Olímpicos originales, es muy misteriosa.\n¿El objetivo? Convencer a un jurado compuesto por cinco personas sobre el punto de vista de un competidor sobre un tema filosófico. Cada participante tendrá que convencerse de que su argumento y razón es la mejor.\n\nEste año, el tema de debate fue '¿se puede transferir el amor de un dios a un humano?' Cada concursante tuvo dos horas de preparación y comenzó uno a uno dando sus argumentos en menos de diez minutos.\n\nPero cuando llegó el turno de [scientific_champion.GetName], el ambiente en la sala empezó a cambiar. [scientific_champion.GetFirstName] comenzó su discurso explicando el [scientific_champion.GetHerHis] punto de vista con palabras extremadamente simples.\n\N[scientific_champion.GetName] logró hacer llorar a un miembro del jurado y el público comenzó a aplaudir en señal de que [scientific_champion.GetSheHe] será el nuevo campeón.\n\n[scientific_champion.GetFirstName] puede que no sea el mejor guerrero o navegante, pero [scientific_champion.GetSheHe] todavía se ganó el amor de la multitud. Y es por esta razón que [scientific_champion.GetFirstName] fue coronado por el mismo [ROOT.GetCountry.GetRuler.GetName] como ganador de los #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#!."
me_germania.40.a: "¡La pluma es más poderosa que la espada!"
celt_charisma_olympics_champion: "[scientific_champion.GetName] con un #G Alto#! @oratory_icon! ¡#Y Se unió a tu Corte#!."

me_germania_41_title: "La carrera naval"
me_germania_41_desc: "Este año, los #Y [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#! abrieron la competencia con una #Y regata de botes#!.\nEl objetivo era alcanzar una serie de puntos navales antes de que tus oponentes pudieran hacerlo, algo bastante fácil que todos pudieran entender. Sin embargo, no estaba permitido matar oponentes ni hundir los barcos de otros jugadores, y las sanciones para cualquiera que violara estas reglas estaban claras.\n\n[naval_champion.GetName] ya era conocido entre tus marineros como un guerrero audaz, listo en cualquier momento para lanzarse a la pelea sin importar las probabilidades. Cuando comenzó la carrera, [naval_champion.GetFirstName] rápidamente tomó la delantera y pudo burlarse de [naval_champion.GetHerHis] oponentes que intentaban desesperadamente alcanzarlo sin éxito.\n\nLa multitud que esperaba en la orilla gritaba por [naval_champion.GetFirstName], esperando que los dioses le trajeran a [naval_champion.GetHerHim] la victoria. Al final, [naval_champion.GetName] ganó la carrera con un enorme margen: ¡más de dos horas!\n\NDespués de completar esta carrera inaugural, [naval_champion.GetFirstName] continuó con muchos éxitos, ganando muchos otros eventos para convertirse en el vencedor de los [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#!.\n\nNuestro [ROOT.GetCountry.GetRulerTitle] dio una rama de olivo y la multitud codiciosa lloró. Busca más carreras y más entretenimiento."
me_germania.41.a: "¡Serás mi navegador personal!"
celt_finesse_olympics_champion: "[naval_champion.GetName] con un #G Alto#! @civic_icon! ¡#Y Se unió a tu Corte#!."

me_germania_42_title: "La boca de los dioses"
me_germania_42_desc: "Este año, para los #Y [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#!, el evento terminó con un ritual de adivinación religiosa.\nEsta tarea pedía a los participantes que intentaran lograr una \"visión\" de los dioses, pidiéndoles que entraran en un estado de meditación para recibir una revelación divina. Esta prueba es muy misteriosa y muchos no logran los objetivos previstos, porque los dioses son caprichosos y no siempre se preocupan por la difícil situación de los hombres.\nPero este año, [religious_champion.GetName] no estaba dispuesto a dejar que este evento quedara sin terminar y sin resultados. Después de dos horas de meditación, [religious_champion.GetFirstName] se despertó con los ojos en blanco, como si [religious_champion.GetSheHe] estara poseído. Mientras [religious_champion.GetSheHe] comenzaba a moverse y bailar lenta y extrañamente, la multitud silenciosa observaba con mucha atención, tratando de entender qué sucedería a continuación. Luego [religious_champion.GetFirstName] comienza a hablar en voz alta y sobrenatural que fue escuchada por todos los presentes.\n\n'Brigantia habla a través de mí y da a conocer sus demandas. Pide que cien guerreros que viven en [ROOT.GetCountry.GetCapital.GetName] bailen en círculo. Cuando esté hecho, ella aparecerá y pronunciará un presagio. Después de escuchar esta extraña voz saliendo de la boca de [religious_champion.GetFirstName], la multitud quedó asombrada y pidió que se reuniera a uno de los guerreros de inmediato, incluso si la participación de la multitud en el evento estaba estrictamente prohibida. Para evitar un disturbio, [ROOT.GetCountry.GetRuler.GetName] aceptó la petición de la multitud y llevó a los soldados al centro del evento, donde comenzaron a bailar en círculo como lo pidió Brigantia. El cielo estaba despejado, pero todos los presentes escucharon un fuerte trueno que hizo que muchos gritaran de miedo y saltaran de sus asientos.\n\n'Es la señal de Brigantia: ¡nuestra caballería será más rápida que el trueno!' dice un hombre entre la multitud. Después de una demostración de fe tan asombrosa, quedó claro que [religious_champion.GetFirstName] sería el campeón del año. Aún así, algunos de nuestros [ROOT.GetCountry.GetRulerTitle] creen que algunas travesuras estaban en acción para manipular a todos, pero el hecho es que la multitud está con [religious_champion.GetName], quien por ahora es intocable. ¿Se convertirá [religious_champion.GetFirstName] en un Alto Druida o en alguien a quien desterrar por ser un alborotador? Sólo el tiempo lo dirá."
me_germania.42.a: "Felicitaciones, [religious_champion.GetFirstName]..."
celt_religious_olympics_champion: "[religious_champion.GetName] con un #G Más Alto#! @religious_icon! ¡#Y Se unió a tu Corte#!."

me_germania_43_title: "Juegos clásicos"
me_germania_43_desc: "Este año, para los #Y [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#!, los eventos fueron bastante disputados pero nadie destacó entre la multitud: todos los atletas fueron mediocres y aburridos.\nSi bien la multitud disfrutó de los juegos en [ROOT.GetCountry.GetCapital.GetName], al final del día, la falta de un hombre o una mujer por encima del otro hace que este #T [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y]#! iteración de los Juegos Olímpicos nada digno de recordar.\n\n[ROOT.GetCountry.GetRuler.GetName] coronó a un participante que se negó a unirse a su corte después de eso, pidiendo regresar a casa. La jubilación es a veces la mejor opción."
me_germania.43.a: "Al menos un vencedor fue coronado"

me_germania_44_title: "Juego peligroso"
me_germania_44_desc: "Este año, se dijo que los #Y [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos#! fueron los peores en una generación, y la gente regresó a casa decepcionada por las festividades.\nHubo muchos eventos que no se llevaron a cabo este año debido a la falta de fondos, y se achacó a los rumores de corrupción de [ROOT.GetCountry.GetRuler.GetName] como la razón probable del mal desempeño.\n\nUno El vencedor fue coronado pero la multitud lo abucheó y los soldados tuvieron que dispersar a la multitud rebelde que se negaba a irse.\nQuizás sea mejor no celebrar juegos si no tenemos los fondos para financiarlos."
me_germania.44.a: "¿Qué he hecho? Creé un monstruo..."

me_germania_45_title: "Los [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('num_celt_olympics_game').GetValue|0Y] Juegos Olímpicos"
me_germania_45_desc: "Hoy es la fecha para organizar unos nuevos #Y Juegos Olímpicos#! en [ROOT.GetCountry.GetName], cuatro años después de la última oportunidad.\n[ROOT.GetCountry.GetRuler.GetName] ahora decidiremos si los organizaremos y, de ser así, quién pagará el coste."
me_germania.45.a: "[ROOT.GetCountry.GetName] se hará cargo de todo y lo liberará."
me_germania.45.b: "Dividiremos el costo entre nosotros y nuestra gente."
me_germania.45.c: "¡Es un juego para [ROOT.GetCountry.GetAdjective] así que les pagarán el total!"
me_germania.45.d: "Lamentablemente no podemos organizarlos."

#me_germania_46_title: ""
#me_germania_46_desc: ""
#me_germania.46.a: ""

me_germania_47_title: "Enfoque de desarrollo"
me_germania_47_desc: "La falta de infraestructura dentro de [ROOT.GetCountry.GetName] se ha convertido en un problema que debe abordarse para responder a las expectativas de la gente de [ROOT.GetCountry.GetAdjective]. Para hacer frente a esta situación, [ROOT.GetCountry.GetRuler.GetName] acaba de lanzar un plan de desarrollo que durará muchos años y nos mantendrá ocupados.\n\nCuando todo esté dicho y hecho, tendremos un país que estaremos orgullosos de mostrar al mundo: ¡una tierra de ciudades, caminos, templos y academias!"
me_germania.47.a: "Cada hombre y mujer cumple con su deber: pronto comenzará una nueva era"

#me_germania_48_title: ""
#me_germania_48_desc: ""
#me_germania.48.a: ""

me_germania_49_title: "Un retroceso contra el progreso"
me_germania_49_desc: "La modernización que se está llevando a cabo dentro de [ROOT.GetCountry.GetName] y que ha sido implementada por nuestro gobernante [ROOT.GetCountry.GetRuler.GetName] no es del gusto de todos. [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('traditionnalist_leader').GetCharacter.GetName|0Y] y su familia se han opuesto airadamente a los costos involucrados con el proyecto, y son consistentemente fuertes voces de oposición.\nRecientemente [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('traditionnalist_leader').GetCharacter.GetName|0Y] nos dio un ultimátum; Si no desaceleramos algunas de las reformas, corremos el riesgo de una #R Guerra Civil#!."
me_germania.49.a: "Observaremos esto [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('traditionnalist_leader').GetCharacter.GetName|0Y] con atención."
me_germania.49.b: "No podemos arriesgar el destino de [ROOT.GetCountry.GetName] ahora"
GEE_Traditionnalist_civil_war_incomming: "[SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('traditionnalist_leader').GetCharacter.GetName|0Y] iniciará una #R guerra civil#! al finalizar la misión."
GEE_Traditionnalist_lose_loyalty: "[SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('traditionnalist_leader').GetCharacter.GetFamily.GetName|0Y] La familia perderá #R 45#! Lealtad"
GEE_civil_war_prevent: "La #R Guerra Civil#! será #G evitada#!."

me_germania_50_title: "El amanecer de una nueva era"
me_germania_50_desc: "[ROOT.GetCountry.GetRuler.GetName] estaba tan consumido por hacer el buen trabajo de gobernar al pueblo de [ROOT.GetCountry.GetName] que [ROOT.GetCountry.GetRuler.GetSheHe] fue sorprendido por la proclamación de la guerra civil por parte de un noble descontento. Mientras las nubes de tormenta de la guerra amenazaban a [ROOT.GetCountry.GetCapital.GetName], fue entonces cuando [ROOT.GetCountry.GetRuler.GetFirstName] se dio cuenta de que una nueva era sólo comenzaría cuando toda la oposición hubiera sido completamente destruida; Este momento estaba predeterminado por los dioses, y la victoria estaba prácticamente asegurada a partir de ese momento."
me_germania.50.a: "¡Destruiré a todos los que se me opongan!"
me_germania.50.b: "¡Mi rival está muerto y su legado seguramente seguirá!"
me_germania_50_tooltip: "¡La tarea de misión '#Y El amanecer de una nueva era#!' ya ha sido #G completada#!!"

me_germania_51_title: "Observando a un rival"
me_germania_51_desc: "No dispuesto a dejar de agitar políticamente, [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('traditionnalist_leader').GetCharacter.GetName|0Y] continúa intentando reunir apoyo para derrocar a [ROOT.GetCountry.GetRuler.GetName], y se dice que se asocia con muchos miembros de la familia [family_leader.GetFamily.GetName] para obtener acceso a los recursos y la amistad de [family_leader.GetName].\n\nGracias a la vigilancia de los espías de [ROOT.GetCountry.GetRuler.GetFirstName] al informar sobre estos movimientos, [ROOT.GetCountry.GetRuler.GetSheHe] puede anular estos intentos de ganar amigos distribuyendo oro para comprar influencia.\n\nPero, ¿es la elección correcta?"
me_germania.51.a: "¡Compraré la familia [family_leader.GetFamily.GetName] primero!"
me_germania.51.b: "no me importa"
GEE_family_bought_tt: "La familia [family_leader.GetFamily.GetName] ganará #G 20#! Lealtad."
GEE_family_conviced_tt: "La familia [family_leader.GetFamily.GetName] perderá #R 25#! lealtad."

me_germania_52_title: "Paz y modernización"
me_germania_52_desc: "La oposición de [ROOT.GetCountry.GetRuler.GetName] está terminada y ninguna voz nos impedirá añadir el toque final para crear la sociedad perfecta. \n\nAhora podemos recoger los frutos de nuestro esfuerzo."
me_germania.52.a: "Roma nos espera"
me_germania.52.b: "Nuestro conocimiento púnico es el mejor."
me_germania.52.c: "Los celtas tendrán ciudades-estado como el griego."
GEE_unlock_roman_tradition: "Desbloquearemos la #Y tradición romana#!."
GEE_unlock_punic_tradition: "Desbloquearemos la #Y tradición púnica#!."
GEE_unlock_greek_city_tradition: "Desbloquearemos la #Y tradición de la ciudad-estado griega#!."

me_germania_53_title: "Edad de Oro"
me_germania_53_desc: "Como la paz, la fuerza y la prosperidad han llegado permanentemente para quedarse dentro de las tierras del pueblo [ROOT.GetCountry.GetAdjective], [ROOT.GetCountry.GetRuler.GetName] ha hecho una proclamación desde [ROOT.GetCountry.GetCapital.GetName] - [ROOT.GetCountry.GetName] ha entrado en una #E Era Dorada#! y estamos viviendo días que tal vez nunca volvamos a ver.\n\nPara celebrar este logro, se ha propuesto que lo celebremos de alguna manera, pero es ha sido imposible decidir exactamente cómo debería hacerse esto. [ROOT.GetCountry.GetRuler.GetFirstName] tendrá que tomar una decisión importante."
me_germania.53.a: "Siempre es importante tener capital político"
me_germania.53.b: "¡Nada de esto hubiera sido posible sin mí!"
me_germania.53.c: "Todos deben unirse y celebrar juntos."
me_germania.53.d: "La estabilidad dentro de nuestro reino es lo que deseo."
me_germania.53.e: "¿Qué es más dorado que las monedas?"
GEE_loyalty_of_everyone: "Todos los personajes ganarán #G 5#! lealtad."
me_germania_53_tooltip: "¡La tarea de misión '#Y Edad de Oro#!' ya ha sido #G completada#!!"

me_germania_54_title: "El camino a seguir"
me_germania_54_desc: "[ROOT.GetCountry.GetRuler.GetName] ha pasado muchas noches sin dormir durante las últimas semanas reflexionando sobre el futuro de [ROOT.GetCountry.GetName] - sólo un tonto no podría ver cuánto han cambiado las cosas en nuestro país en los últimos años. Muchos extranjeros viven entre nuestro pueblo, y es muy común que nuestros parientes sepan algunas palabras en un par de idiomas; ya no somos una sociedad aislada, sino una gran potencia, un centro de gravedad en nuestro rincón del mundo.\n\nLos pensamientos que han mantenido despierto a [ROOT.GetCountry.GetRuler.GetFirstName] involucran el futuro del pueblo [ROOT.GetCountry.GetAdjective]; ¿Cuál será su legado? ¿Seguirán siendo como siempre han sido o las fuerzas del cambio serán demasiado grandes e ineludibles? Y si este es el caso, ¿es necesariamente algo malo? Después de todo, el cambio es crecimiento y nuestra gente necesitará adaptarse a un mundo en constante cambio si espera sobrevivir.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] cree que [ROOT.GetCountry.GetRuler.GetSheHe] conoce la respuesta a estas preguntas."
me_germania.54.a: "¡Nuestra herencia [ROOT.GetCountry.GetAdjective] nos ha llevado a las alturas de la gloria!"
me_germania.54.b: "El poder de nuestra fe es la razón por la que hemos triunfado."
me_germania.54.c: "[ROOT.GetCountry.GetName] es fuerte gracias a nuestras ciudades y ejércitos"
me_germania.54.d: "¡Nuestra riqueza debería usarse para contratar ejércitos para someter al mundo!"
me_germania.54.e: "Preveo un futuro en el que nuestro reino será líder en investigación..."
me_germania_54_tooltip: "¡La tarea de misión '#Y El camino a seguir#!' ya ha sido #G completada#!!"

me_germania_55_title: "Invierta en nuestra tradición"
me_germania_55_desc: "[ROOT.GetCountry.GetRuler.GetName] ha proclamado un período de celebración, en el que se llevarán a cabo festivales que honren a nuestros dioses, acompañados de fiestas y juegos. El [ROOT.GetCountry.GetRulerTitle] de [ROOT.GetCountry.GetName] ha jurado defender las prácticas tradicionales de nuestros [ROOT.GetCountry.GetAdjective] ancestros, especialmente ahora que nuestra influencia ha traído a muchos extraños a nuestras costas. [ROOT.GetCountry.GetRuler.GetFirstName] cree que no podemos darnos el lujo de descuidar la fuente de fortaleza que nos trajo hasta este momento, y ningún gasto es demasiado grande cuando se trata de honrar a nuestros antepasados."
me_germania.55.a: "Nuestras tradiciones celtas nunca deben abandonarse"
me_germania_55_tooltip: "¡La tarea de la misión '#Y Invertir en nuestra tradición#!' ya ha sido #G completada#!!"

me_germania_56_title: "ejércitos germánicos"
me_germania_56_desc: "[ROOT.GetCountry.GetRuler.GetName] ahora debe tomar una decisión con respecto a nuestras fuerzas militares, una tarea en la que [ROOT.GetCountry.GetRulerTitle] está muy interesado, ya que [ROOT.GetCountry.GetRuler.GetSheHe] lleva mucho tiempo interesado en comandar las levas [ROOT.GetCountry.GetAdjective].\n\nGracias a nuestra fuerza militar y económica, finalmente podemos invertir en nuestro ejército, y ahora debemos decidir quién debe recibir entrenamiento y nuevo equipo; ¿Nuestros jinetes o nuestros arqueros? Ambas opciones tienen sus ventajas y es una pregunta difícil que [ROOT.GetCountry.GetRuler.GetFirstName] debe responder."
me_germania.56.a: "Nuestra audaz caballería, al chocar contra el enemigo, debe volverse más poderosa."
me_germania.56.b: "Fortalezcamos a nuestros arqueros, que atacan a distancia."
me_germania_56_tooltip: "¡La tarea de misión '#Y Ejércitos germánicos#!' ahora ha sido #G completada#!!"

me_germania_57_title: "Tradiciones orales"
me_germania_57_desc: "Desde que nuestro pueblo lo sabe, nuestros Ancianos Tribales han mantenido una tradición oral de transmitir nuestras historias y registros, cantando canciones y recitando largos poemas que alaban a nuestros antepasados y guerreros legendarios. Comerciantes y comerciantes han traído pergaminos y textos griegos a nuestros mercados, y estamos familiarizados con los alfabetos y las formas de escritura de muchas naciones, pero hemos decidido continuar confiando en la forma tradicional de hacer las cosas.\n\nY, sin embargo, el contacto con los pueblos conquistados de nuestra nación nos ha demostrado que escribir las cosas tiene beneficios: si [ROOT.GetCountry.GetRuler.GetName] así lo deseamos, podríamos adoptar este método para ciertas cosas que son importantes."
me_germania.57.a: "Lo que fue bueno para mis padres es suficientemente bueno para mí."
me_germania.57.b: "Integremos algunas de las nuevas formas; ¿Cuál es el daño?"
me_germania.57.c: "Modernizaremos todo y crearemos nuestro propio Alfabeto."
me_germania_57_tooltip: "¡La tarea de la misión '#Y Tradiciones orales#!' ya ha sido #G completada#!!"
GEE_oratory_tech: "Esta opción está disponible porque tenemos #Y Oratory tech 8#! o más."

me_germania_58_title: "Un nuevo alfabeto"
me_germania_58_desc: "Después de unos meses muy ocupados, un grupo de los escribas más eruditos que vivían en [ROOT.GetCountry.GetCapital.GetName] se acercaron a [ROOT.GetCountry.GetRuler.GetName] con los resultados de su arduo trabajo; un nuevo alfabeto para que lo use la gente [ROOT.GetCountry.GetAdjective]. Para celebrar este admirable logro, el [ROOT.GetCountry.GetRulerTitle] ha pedido que se envíen proclamas a todo [ROOT.GetCountry.GetName].\nPero, ¿cuál fue su inspiración?"
me_germania.58.a: "A partir de este día, todos deben utilizar este nuevo script #Y celta#!"
me_germania.58.b: "A partir de este día, todos deben utilizar esta nueva escritura #Y latina#!"
me_germania.58.c: "A partir de este día, todos deben utilizar este nuevo script #Y púnico#!"
me_germania.58.d: "A partir de este día, todos deben utilizar esta nueva escritura #Y griega#!"
me_germania_58_tooltip: "¡La tarea de la misión '#Y Un nuevo alfabeto#!' ya ha sido #G completada#!!"

me_germania_60_title: "Elefantes en [ROOT.GetCountry.GetName]"
me_germania_60_desc: "Hace mucho tiempo, animales maravillosos como los elefantes @elephants! eran desconocidos dentro del mundo celta.\nPero después del viaje organizado por [ROOT.GetCountry.GetRuler.GetName], nuestra visión del mundo, con sus muchas maravillas, cambió por completo y ya no podemos vivir como antes. Con los elefantes a mano, ahora podemos adoptar la estrategia de la poderosa Cartago: su pueblo utiliza a los gentiles gigantes de maneras que serían muy beneficiosas para nuestros ejércitos.\n\n¿Deberíamos aprender a usar los elefantes en la batalla? ¿O tal vez deberíamos mejorar nuestras tácticas entrenando juntas a nuestras fuerzas terrestres y militares, con todas las unidades, desde el elefante hasta el liburnio, luchando como una sola?"
me_germania.60.a: "¡Vienen los elefantes!"
me_germania.60.b: "¡Combinaremos todo y nuestras fuerzas serán invencibles!"

me_germania_61_title: "Invictus germánico"
me_germania_61_desc: "Nuestra reciente fascinación por Roma y sus ejércitos nos ha llevado a crear nuestra propia fuerza romana, una que será igual a cualquiera levantada cerca de la Ciudad de las Siete Colinas junto al Tíber. [ROOT.GetCountry.GetRuler.GetName] ha hecho maravillas para lograrlo, pero aún queda una pregunta por responder.\n\nLos romanos son famosos por sus legiones pero también por su ingeniería militar, que muchos afirman que es la mejor del mundo. ¿Qué decidirá [ROOT.GetCountry.GetRuler.GetName] priorizar a nuestra manera?"
me_germania.61.a: "¡Nuestros ejércitos serán aclamados como verdaderas legiones!"
me_germania.61.b: "Tráenos a sus matemáticos y soldados."

me_germania_62_title: "Un ejército moderno"
me_germania_62_desc: "Alejandro fue el mejor comandante del mundo, conquistó Persia, Egipto y una parte de la India en un resplandor de gloria, y su nombre es conocido incluso en [ROOT.GetCountry.GetCapital.GetName]. Por muy legendarios que fueran los logros de Alejandro, no habría logrado sus hazañas sin el entrenamiento y la técnica excepcionales de sus hombres, algo que incluso el orgulloso guerrero sabía en su corazón. \n\n[ROOT.GetCountry.GetRuler.GetName], habiendo aprendido de las hazañas de Alejandro y deseando superar al macedonio en gloria, ha decidido crear una fuerza que será conocida en todo el mundo como la mejor del mundo. Pero ¿cuál debería ser la principal prioridad de los soldados [ROOT.GetCountry.GetAdjective]? ¿Dominar la lanza o crear un nuevo Bucéfalo para el ejército?"
me_germania.62.a: "Nuestros hombres serán verdaderos maestros de la lanza."
me_germania.62.b: "Alejandro amaba a su caballo más que a nada."
me_germania_62_tooltip: "¡La tarea de misión '#Y Un ejército moderno#!' ya ha sido #G completada#!!"

me_germania_63_title: "Manteniendo nuestras raíces"
me_germania_63_desc: "Ha atravesado [ROOT.GetCountry.GetName] un período intenso de inversión y crecimiento, y uno difícilmente puede viajar a una ciudad dentro del [ROOT.GetCountry.GetAdjective] país de origen sin ver los signos obvios de construcción; grandes grúas que se elevan sobre las calles, pilas de ladrillos custodiadas por soldados y un flujo constante de animales de carga que transportan suministros y gimen bajo sus cargas son algo que se ve a diario.\n\nAunque el cambio está claramente en el aire, la gente ha prometido recordar sus costumbres tradicionales, prometiéndose a sí mismos que los efectos de la civilización no cambiarían la esencia de quiénes son. Y por cada palacio o jardín exquisito que se construyó, también se construyó un templo o un santuario; los dioses deben conservar su lugar en la [ROOT.GetCountry.GetAdjective] sociedad."
me_germania.63.a: "¡No podemos abandonar las virtudes de nuestros antepasados!"
me_germania_63_tooltip: "¡La tarea de la misión '#Y Mantener nuestras raíces#!' ya ha sido #G completada#!!"

me_germania_64_title: "Recompensar a la gente"
me_germania_64_desc: "Para garantizar que nuestras tradiciones se salvaguarden en los años venideros, [ROOT.GetCountry.GetRuler.GetName] ha decidido invertir una suma real para que esto suceda. Naturalmente, los [ROOT.GetCountry.GetRuler.GetHerHis] asesores han tenido dos opiniones; A algunos les gustaría que [ROOT.GetCountry.GetRulerTitle] se centrara en recompensar a los militares, mientras que otros creen que la gente común de [ROOT.GetCountry.GetName] debería ser recompensada con un festival glorioso."
me_germania.64.a: "Deberíamos recompensar a nuestras tropas, porque han hecho todo esto posible."
me_germania.64.b: "El propio pueblo es responsable de mantener la tradición."
me_germania_64_tooltip: "¡La tarea de la misión '#Y Recompensar a la gente#!' ya ha sido #G completada#!!"

me_germania_66_title: "Nueva nobleza"
me_germania_66_desc: "[ROOT.GetCountry.GetName] es una tierra conquistada y sometida a punta de lanza, y las clases dominantes de los países anexados por el [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] han sido presionadas a vivir en la capital [ROOT.GetCountry.GetAdjective].\n\nNo es ningún secreto que [ROOT.GetCountry.GetRuler.GetFirstName] desea mantener los intereses de las élites alineados con los propios deseos de [ROOT.GetCountry.GetRuler.GetHerHis], y no Se han escatimado esfuerzos para asegurar su respaldo a lo largo de los años. Por suerte para [ROOT.GetCountry.GetRulerTitle], la nobleza ha dado su apoyo a [ROOT.GetCountry.GetRuler.GetHerHim] y ahora intenta devolverle el favor."
me_germania.66.a: "Siempre se prefiere el dinero, como dicen."
me_germania.66.b: "Prefiero adquirir experiencia que monedas. ¿Qué podemos aprender?"
me_germania.66.c: "Esto debería llegar a mí."
me_germania_66_tooltip: "¡La tarea de misión '#Y Nueva nobleza#!' ya ha sido #G completada#!!"

me_germania_67_title: "Centro de comercio germánico"
me_germania_67_desc: "Como un arroyo burbujeante, corrientes de ingresos fluyen hacia las arcas de los recaudadores de impuestos que viven en la provincia de [ROOT.GetCountry.GetCapital.GetArea.GetName]; nunca antes habíamos recibido tanto dinero. A [ROOT.GetCountry.GetRuler.GetName] se le ha sugerido que deberíamos tomar estas sumas récord y hacer algo importante con ellas. Los asesores de \n\n[ROOT.GetCountry.GetRuler.GetFirstName] están pidiendo que se realicen inversiones dentro del capital, pero nadie criticaría a [ROOT.GetCountry.GetRulerTitle] por usar los fondos para algo diferente."
me_germania.67.a: "Quiero ahorrar el dinero para un día lluvioso."
me_germania.67.b: "Hagamos una inversión a largo plazo con esta ganancia inesperada."
me_germania_67_tooltip: "¡La tarea de la misión '#Y Centro de comercio germánico#!' ya ha sido #G completada#!!"

me_germania_68_title: "Ningún lugar es seguro"
me_germania_68_desc: "Después de incontables años de guerra y paz y muchas temporadas de festines y hambrunas, nuestros parientes aprendieron muchas lecciones, quienes sacaron lo mejor de cada situación que enfrentaron y perseveraron cuando todas las demás habrían fracasado. \n\nY cuando nuestra debilidad se convirtió en fuerza, nuestros guerreros no tuvieron miedo de viajar grandes distancias para saquear las tierras de nuestros enemigos, porque su amor por el oro y la gloria los enviaría a tierras desconocidas para nuestros antepasados."
me_germania.68.a: "¡Pon rumbo abierto hacia el mar virgen!"
me_germania_68_tooltip: "¡La tarea de misión '#Y Ningún lugar es seguro#!' ya ha sido #G completada#!!"

me_germania_69_title: "la ciudad"
me_germania_69_desc: "[ROOT.GetCountry.GetCapital.GetName] es con diferencia la ciudad más desarrollada al norte del #E Mediterráneo#!, y se dice que los esplendores de #E Alejandría#!, #E Roma#! o #E Cartago#! no pueden competir con el lugar que llamamos home.\n\nLos logros arquitectónicos de la familia [ROOT.GetCountry.GetRuler.GetName] y [ROOT.GetCountry.GetRuler.GetHerHis] serán recordados durante siglos, y sus nombres nunca serán olvidados mientras viva la gente [ROOT.GetCountry.GetAdjective]. Todos los habitantes de [ROOT.GetCountry.GetCapital.GetName], deseando agradecer al [ROOT.GetCountry.GetRulerTitle] por [ROOT.GetCountry.GetRuler.GetHerHis] la cuidadosa administración de su ciudad, han preparado una ceremonia especial en la capital en honor al clan #E [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective].#!"
me_germania.69.a: "¡Que los dioses salven y protejan a [ROOT.GetCountry.GetRuler.GetFirstName]!"
me_germania_69_tooltip: "¡La tarea de misión '#Y La ciudad#!' ya ha sido #G completada#!!"

me_germania_70_title: "Tomando prestado a los belgas"
me_germania_70_desc: "El creciente alcance de las [ROOT.GetCountry.GetAdjective] armadas ha llevado a nuestros traficantes de esclavos a costas lejanas, lejos del alcance de nuestros ejércitos terrestres, y afortunadamente para nosotros, hay muchos #E aldeanos belgas#! indefensos y con espaldas fuertes que viven a lo largo de las costas de estas nuevas tierras que hemos descubierto.\n\n [ROOT.GetCountry.GetRuler.GetName] ha alentado a nuestros grupos de asalto a traer tantos como sea posible. Esclavos como sea posible en casa; una tarea que han emprendido con sombrío abandono."
me_germania.70.a: "¡Abajo a las minas contigo!"
me_germania_70_tooltip: "¡La tarea de misión '#Y Tomar prestado a los belgas#!' ya ha sido #G completada#!!"

me_germania_71_title: "Comercio Armoricano"
me_germania_71_desc: "No hace mucho, Armórica era un punto de apoyo para el comercio con el continente, incluso si las tribus locales nos cobraban una buena cantidad por actuar como intermediarios. Esta situación no era ideal, pero era tolerable, ya que las conexiones comerciales del continente valían la pena por múltiples razones.\n\nDesafortunadamente para nosotros, una combinación mortal de inestabilidad política y largos inviernos paralizó el comercio y muchas antiguas rutas comerciales fueron abandonadas para siempre. Pero esto cambiará, porque [ROOT.GetCountry.GetRuler.GetName] ha prometido restaurarlos por el bien de [ROOT.GetCountry.GetName] y sus habitantes."
me_germania.71.a: "Los comerciantes y los impuestos fluirán una vez más"

me_germania_72_title: "Sumisión germánica"
me_germania_72_desc: "Después de nuestras recientes conquistas en #E Germania Superior#!, nuestros guerreros triunfantes habían incendiado muchas #E aldeas y asentamientos germánicos#!, matando a miles y esclavizando a cualquiera que pudieran atrapar. Nuestros soldados se divirtieron demasiado después de nuestra campaña, tal vez, y las historias de [ROOT.GetCountry.GetAdjective] crueldad hacia los nativos se extendieron rápidamente por todo el campo.\n\nCuando nuestras tropas regresaron a casa cargadas con el botín de guerra, [ROOT.GetCountry.GetRuler.GetName] recibió una solicitud de reunión de un señor de la guerra istvaónico, un hombre llamado [SCOPE.sCharacter('defeated_celtic_chief').GetName] que una vez había sido jefe de algunos renombre pero ahora vivía como un bandido en las montañas.\n\n'Nos has quitado todo, [ROOT.GetCountry.GetRuler.GetName], como es tu derecho. No he venido a disputar lo que se ganó en el campo de batalla, sino a suplicar clemencia. Las guerras han terminado y, sin embargo, tus hombres continúan destruyendo mi patria. ¿Qué debemos hacer para poner fin al derramamiento de sangre?"
me_germania.72.a: "Te dejaremos en paz, pero debes hacer juramentos de servicio."
me_germania.72.b: "Tus hombres deben poner fin a tus hábitos de ladrón y servir en mis ejércitos."
me_germania.72.c: "¿Cómo te atreves a acercarte a mí, perro? ¡Te mostraré la verdadera ira!"
more_german_raids_oh_no: "#R Nuestros guerreros saquearán los asentamientos de los germánicos locales.#!"

me_germania_73_title: "Últimos pasos de la conquista"
me_germania_73_desc: "Marchar dentro de la Galia Central fue una tarea fácil, pero lograr la sumisión total de las tribus locales restantes, numerosas pero débiles, es mucho más difícil.\n\nY ahora, la elección. Podemos saquear las escasas posesiones de estas tribus como señal de victoria de nuestro ejército, pero también podemos perdonar a los lugareños y ver si sus mejores guerreros quieren luchar junto a nosotros.\n\nTodos adoran el dinero y no hay nada que no se pueda lograr con su brillo."
me_germania.73.a: "Victoria a menudo rima con saqueo: deja que los hombres se diviertan"
me_germania.73.b: "¿Talento local y caballos? Por qué no."
me_germania.73.c: "¡Dinero, dinero, dinero!"

#me_germania_74_title: ""
#me_germania_74_desc: ""
#me_germania.74.a: ""

me_germania_75_title: "Explorando la cuenca"
me_germania_75_desc: "Después de muchos meses de espera impaciente y oraciones de súplica, los exploradores enviados por [ROOT.GetCountry.GetRuler.GetName] a la salvaje y boscosa #E Cuenca de Boihemia#! finalmente regresaron a [ROOT.GetCountry.GetCapital.GetName] y, según todos los informes, su viaje fue un éxito. Nuestros guerreros hablan de un reino bueno y agradable, escasamente poblado por las tribus locales #E Boian#! que no aprecian los regalos de la naturaleza que se encuentran en sus tierras. Cuando se les preguntó si la cuenca es un lugar adecuado para que se establezcan los colonos [ROOT.GetCountry.GetAdjective], los hombres están de acuerdo unánimemente.\n\nSi [ROOT.GetCountry.GetRuler.GetFirstName] está dispuesto a ahorrar oro y mano de obra, entonces no habrá problemas para establecer los confines del norte del bosque con nuestros miembros de la tribu."
me_germania.75.a: "Envía colonos a cualquier territorio no reclamado."
me_germania.75.b: "No podemos darnos el lujo de hacer esto en este momento."

me_germania_76_title: "Sementales salvajes"
me_germania_76_desc: "Cuando se les ofrece la opción de montar, la mayoría de los guerreros que viven dentro de [ROOT.GetCountry.GetName] solicitarán un caballo @horses! de la región de [GetProvince('(int32)3950').GetArea.GetRegion.GetName], porque la temible reputación de los corceles de las tierras salvajes germánicas ha capturado la imaginación de nuestro pueblo al tiempo que infunde terror abyecto en los corazones de nuestros enemigos.\n\nLos caballos de nuestras granjas son al menos tres manos más altos que cualquier otro caballo de tiro traído a los mercados, y nuestro Los animales robustos están entrenados en el arte de la guerra desde sus primeros días y no temen el estruendo de la batalla: todas cualidades importantes que se requieren para la caballería [ROOT.GetCountry.GetAdjective]."
me_germania.76.a: "Mi caballo personal fue tomado de una pequeña granja cerca de [ROOT.GetCountry.GetCapital.GetName]"
me_germania_76_tooltip: "¡La tarea de misión '#Y Sementales salvajes#!' ya ha sido #G completada#!!"

me_germania_77_title: "Fiestas de caza"
me_germania_77_desc: "Aunque las tierras de cultivo y las pesquerías de [ROOT.GetCountry.GetName] proporcionan variedad más que suficiente para que nuestros [ROOT.GetCountry.GetAdjective] miembros de la tribu tengan una dieta sustantiva y nutritiva, a nuestros guerreros les gusta llevar a sus perros al bosque y buscar ciervos cuando tienen algo de tiempo libre para ellos mismos.\n\nHay pocos placeres mayores en la vida que talar un ciervo enorme con tus hermanos y asar al animal en el campo. Y aunque nuestros guerreros deben viajar grandes distancias para llegar a los bosques primitivos donde se encuentra la mejor caza, [ROOT.GetCountry.GetRuler.GetName] a menudo se encuentra [ROOT.GetCountry.GetRuler.GetHerHim] agarrando [ROOT.GetCountry.GetRuler.GetHerHis] el arco cada vez que surge la oportunidad con la esperanza de acechar a un macho enorme en las profundidades del país."
me_germania.77.a: "No importa lo que esté haciendo, casi preferiría estar cazando..."
me_germania_77_tooltip: "¡La tarea de misión '#Y Grupos de caza#!' ya ha sido #G completada#!!"

me_germania_78_title: "La agricultura en auge"
me_germania_78_desc: "Los bosques germánicos son lugares pobres cuando se trata de implementar una agricultura a gran escala, ya que nuestros bosques son densos y esto hace que trabajar la tierra sea excepcionalmente difícil. Además de esto, nuestro clima es implacable y brutal, ya que los inviernos que vivimos son duros, dejando a muchas personas muriendo de hambre y frío cada año.\n\nPero nuestra gente es más fuerte que la tierra que nos vio nacer, especialmente con el fuerte liderazgo de nuestro [ROOT.GetCountry.GetRulerTitle] guiándonos hacia adelante. [ROOT.GetCountry.GetRuler.GetName] ha decidido que estas tragedias son evitables y, después de un período de inversión, nuestras tierras de cultivo se han ampliado para sustentar a la [ROOT.GetCountry.GetAdjective] población durante todas las estaciones. ¡Nadie morirá de estómago vacío bajo la regla [ROOT.GetCountry.GetRuler.GetFirstName]!"
me_germania.78.a: "Pan para todos, ¡o si no!"

me_germania_80_title: "El elefante"
me_germania_80_desc: "Desde el momento en que nuestro capitán vio al bebé elefante, se podría haber escrito una nueva historia de amor y sueños, y ningún precio habría sido demasiado alto.\n\nEl comerciante que nos vendió el elefante prometió traernos más, ¡y construiremos campamentos para ellos donde puedan ser entrenados para circos o campos de batalla! Nuestro Consejo ha sugerido varias provincias que serían lugares prometedores para las granjas de elefantes, permitiendo [ROOT.GetCountry.GetRuler.GetName] el honor de elegir dónde vivirán los gentiles gigantes."
me_germania.80.a: "Será nuestra capital [ROOT.GetCountry.GetCapital.GetName] la que les dará la bienvenida"
me_germania.80.b: "Se alimentará con el mejor grano de [prov_1.GetName]."
me_germania.80.c: "Las fértiles llanuras de [prov_2.GetName] serán suficientes."
me_germania.80.d: "[prov_3.GetName] parece interesante."
me_germania.80.e: "Los elefantes viven dentro de los bosques y la jungla; necesitaremos [prov_4.GetName]."

me_germania_81_title: "los elefantes"
me_germania_81_desc: "El comerciante cartaginés pidió a [ROOT.GetCountry.GetRuler.GetName] que lo siguiera hasta su barco capital, ya que a bordo había muchos puestos y jaulas llenas de animales exóticos. 'Aquí tienes una familia completa de elefantes @elephants!, y por un módico precio son tuyos.'\n\nLa pregunta ahora es, si compramos esta familia, ¿cuál será el mejor lugar para que se queden? Podría ser una buena oportunidad para la economía local a largo plazo, ya que muchos de nuestros compatriotas querrán ver estas criaturas con sus propios ojos."
me_germania.81.a: "Será nuestra capital [ROOT.GetCountry.GetCapital.GetName] la que les dará la bienvenida."
me_germania.81.b: "Serán alimentados con el mejor grano de [prov_1.GetName]."
me_germania.81.c: "Las fértiles llanuras de [prov_2.GetName] serán suficientes"
me_germania.81.d: "[prov_3.GetName] parece interesante."
me_germania.81.e: "Los elefantes viven dentro de bosques y selvas; necesitaremos [prov_4.GetName]."
me_germania.81.f: "Por ahora prefiero no comprometerme; muéstrame algo más."

me_germania_82_title: "Los tintes"
me_germania_82_desc: "Durante siglos, los tintes @dye! se han utilizado para crear patrones y colores más complejos para la ropa, y se utilizan principalmente en nuestro ámbito para reconocer las diferentes clases que componen la sociedad.\n\nEl comerciante metió la mano en un saco pesado y sacó un puñado de delicados granos que dejó caer entre sus dedos. 'Estas son semillas. Las plantas que producen los mejores tintes crecen principalmente en zonas cálidas y con mucha agua. Sin embargo, personalmente he seleccionado una variedad que podría crecer en tu isla fría y lluviosa y que te hará un trato increíble.'\n\nConsiderando lo que ha dicho el comerciante, tu Consejo ofrece cuatro posiciones que parecen ser buenos lugares para hacer tintes."
me_germania.82.a: "La exposición al sol es la mejor en nuestras tierras de cultivo en [prov_1.GetName]."
me_germania.82.b: "Las fértiles llanuras de [prov_2.GetName] serán suficientes"
me_germania.82.c: "[prov_3.GetName] tiene acceso a una buena cantidad de agua"
me_germania.82.d: "[prov_4.GetName] tiene suficiente espacio para lo que necesitamos"
me_germania.82.e: "Prefiero no comprar semillas colorantes."

me_germania_83_title: "Olla de miel"
me_germania_83_desc: "La miel no es desconocida dentro de [ROOT.GetCountry.GetName], pero nuestra gente no la explotó y es difícil de conseguir sin la ayuda de muchas manos. Consciente de esto, el comerciante trajo consigo algunas abejas, con colmenas de piedra y los materiales necesarios para explotarlas.\n\nEl comerciante hizo un gesto a un esclavo, quien abrió un gran panal con sus manos, lanzando un chorro de oro fundido hacia el suelo. Cogiendo un poco de esta miel con un trozo de cerámica, el comerciante se la dio a [ROOT.GetCountry.GetRuler.GetName] con una sonrisa y le pidió que la probara.\n\nEl comerciante se rió cuando los ojos de [ROOT.GetCountry.GetRuler.GetFirstName] se abrieron como platos unos segundos después.'Imagínese lo que podría cocinar con eso. Los rumores dicen que comer miel todos los días es una forma de alcanzar la eterna juventud, y después de probarlo por mí mismo, les creo.'\n\nDespués de probar esta miel, [ROOT.GetCountry.GetRuler.GetFirstName] está completamente convencido de la idea y cuatro asesores nos han propuesto cuatro provincias diferentes."
me_germania.83.a: "Las abejas producirán bajo la tierra del sol de [prov_1.GetName]."
me_germania.83.b: "Las fértiles llanuras de [prov_2.GetName] serán suficientes"
me_germania.83.c: "A las abejas les encantará [prov_3.GetName]."
me_germania.83.d: "Deberíamos probar el área de [prov_4.GetName] como candidata."
me_germania.83.e: "Las abejas tendrán que esperar."

me_germania_84_title: "El comerciante cartaginés"
me_germania_84_desc: "Después de tres largos meses en el mar, el comerciante cartaginés finalmente llegó a las costas de [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetRuler.GetName] bajó al puerto, acompañado de cortesanas y ministros, para dar la bienvenida al estimado viajero, quien no perdió tiempo en bromas sino que se lanzó inmediatamente a un discurso de venta.\n\n'Puedo ofrecerle muchos productos exóticos que podrían instalarse en su isla. Puedes comprar mis elefantes @elephants! y construirles campamentos, entrenándolos en el arte de la guerra. ¿O tal vez prefieres construir talleres para la producción de tinte @dye!? Pero no se pueden comer elefantes ni tintes, y tengo conmigo abejas que producen la mejor miel del mundo. También tengo muchos tipos de bienes que puedes comprar para tus nobles; la última moda de las cortes de los Emperadores y Emperatrices, así como joyas y obras de arte raras para deslumbrar la vista y deleitar la mente.'\n\nInteresado por todo, no puedes comprarlo todo a la vez debido a su alto precio. ¡Además, no sería prudente transformar todas sus tierras en un zoológico lleno de elefantes y abejas!\n\nEs por eso que, para el éxito de la instalación de estos nuevos productos, limitaremos la producción de cada uno a #G 2 territorios#! en nuestra isla; A la gente no le gustaría que perturbamos demasiado sus tierras tradicionales.\n\nAnte tentaciones deslumbrantes, [ROOT.GetCountry.GetRuler.GetFirstName] tendrá que decidir qué comprar antes de la partida del comerciante."
me_germania.84.a: "Deberíamos ver los elefantes."
me_germania.84.b: "El tinte será muy importante para una sociedad moderna."
me_germania.84.c: "Abejas, ¿eh? Podríamos crear una historia con eso."
me_germania.84.d: "Los bienes clásicos serán suficientes para la alta sociedad"
me_germania.84.e: "Perdón por la molestia. No estoy listo para comprar algo."
GEE_reset_import_cooldown: "Tendrás que esperar #Y 5 años#! para la devolución del comerciante."

me_germania_85_title: "¿Amigos galos?"
me_germania_85_desc: "Ahora que nuestra presencia permanente en la #E Cuenca de Boihemian#! es un hecho indudable, hay muchos miembros de tribus locales que han estado solicitando [ROOT.GetCountry.GetRuler.GetName] más derechos dentro de la [ROOT.GetCountry.GetAdjective] sociedad.\n\nDurante los últimos meses, la [ROOT.GetCountry.GetRulerTitle] ha estado considerando su solicitud pero ha retrasado la toma de una decisión, pero ha llegado el momento de resolver la cuestión. Importa de una vez por todas.\n\nSi bien a muchos que viven dentro de [ROOT.GetCountry.GetName] no les gusta la idea de otorgar derechos cívicos a los boianos, [ROOT.GetCountry.GetRuler.GetFirstName] ha argumentado que aceptarlos entre nuestra gente tiene sentido estratégicamente; Esto no sólo aliviará las tensiones en la región, sino que también ganaremos derechos sobre el resto de la región."
me_germania.85.a: "Tiene sentido tratarlos como a nuestros hermanos."
me_germania.85.b: "¡Los #E boianos#! sólo sirven para ser nuestros esclavos!"
me_germania.85.c: "El status quo es aceptable en este momento"
me_germania_85_tooltip: "¡La tarea de misión '#Y Amigos galos?#!' ahora ha sido #G completada#!!"
me_germania_85_tooltip_2: "Recibiremos reclamaciones sobre la región #T Boiohaemum#!."

me_germania_86_title: "Los bosques en el fin del mundo"
me_germania_86_desc: "Después de un mes de navegación hacia el norte a través de los mares amargos del #E Oceanus Sarmaticus#!, [ROOT.GetCountry.GetRuler.GetName] y [SCOPE.sCharacter('priest').GetName] viajaron mucho más allá de [GetProvince('(int32)6032').GetName], llegando a una tierra donde las nieves nunca abandonaban el suelo y el sol permanecía en el cielo durante todo el año.\n\nUna vez seguros de que habían llegado a las tierras de los dioses, el mismo lugar que [SCOPE.sCharacter('priest').GetSheHe] había visto en [SCOPE.sCharacter('priest').GetHerHis] sueños, [SCOPE.sCharacter('priest').GetFirstName] reveló el motivo de este viaje; [ROOT.GetCountry.GetRulerTitle] debe buscar en las tierras salvajes un pozo que sea sagrado para [GetDeityDefinition('omen_wodenaz').GetName]. [ROOT.GetCountry.GetRuler.GetFirstName] era consciente de que una ausencia prolongada de [ROOT.GetCountry.GetCapital.GetName] podría desestabilizar el reino, pero [SCOPE.sCharacter('priest').GetOffice.GetName] instó a [ROOT.GetCountry.GetRuler.GetHerHim] a ignorar los deberes de [ROOT.GetCountry.GetRuler.GetHerHis].\n\n'Incluso si lleva un año deambulando por el campo, ¡valdrá la pena!' [SCOPE.sCharacter('priest').GetFirstName] siseó entre dientes apretados, colocando [SCOPE.sCharacter('priest').GetHerHis] capa alrededor de [SCOPE.sCharacter('priest').GetHerHis] hombros mientras comenzaba a llover. 'Cada noche mis sueños me dicen que nos estamos acercando...'"
me_germania.86.a: "Haré lo que dices, pero tengo un mal presentimiento sobre esto."
me_germania.86.b: "Esto suena a locura... debemos regresar a casa."
me_germania_86_tooltip: "#Y Esto finalizará la cadena de eventos#!."

me_germania_87_title: "El pozo de Mimir"
me_germania_87_desc: "Los días y las semanas pasaron sin ser contados por los dos exploradores, porque el sol se negaba a ponerse por completo y seguir el paso del tiempo se volvió imposible. Los suministros que habían sido traídos de [ROOT.GetCountry.GetCapital.GetName] se habían usado hace mucho tiempo, y el [ROOT.GetCountry.GetRulerTitle] de [ROOT.GetCountry.GetName] se vio reducido a comer raíces hervidas y bellotas en un intento por sobrevivir. Los vientos fueron tan despiadados y crueles como las tierras que atravesaron, cortando el hueso y dejando los labios de [ROOT.GetCountry.GetRuler.GetName] azules de frío. Inexorablemente, el hambre y la deshidratación provocaron que un extraño delirio se apoderara de los dos viajeros, y lo que sucedió a continuación se sintió como una alucinación.\n\nMientras gateaban sobre manos y rodillas por una colina empinada, [SCOPE.sCharacter('priest').GetName] soltó un grito ronco que hizo que a [ROOT.GetCountry.GetRuler.GetFirstName] se le erizaran los pelos de la nuca. '¡Allá! Ahí está el manantial que [GetDeityDefinition('omen_wodenaz').GetName] me muestra mientras duermo.'\n\nHaciendo un gesto con una mano temblorosa, [SCOPE.sCharacter('priest').GetFirstName] señaló hacia un pozo de piedra en la base de un gran fresno. \"Debes beber el agua, [ROOT.GetCountry.GetRuler.GetFirstName], pero eso no es todo: si realmente deseas ver lo que los dioses quieren revelado, entonces debes darles uno de tus ojos\"."
me_germania.87.a: "Yo... Supongo que obedeceré la orden de [GetDeityDefinition('omen_wodenaz').GetName]..."
me_germania.87.b: "¿Qué? No voy a hacer eso, debemos regresar a casa."
priest_kills_self_in_shame_tt: "Avergonzado por la decisión de abandonar el pozo sin beber de sus aguas, el Sacerdote huyó al desierto y nunca más se le volvió a ver."

me_germania_88_title: "El árbol sagrado"
me_germania_88_desc: "El regreso de [ROOT.GetCountry.GetRuler.GetName] y [SCOPE.sCharacter('priest').GetName] a [ROOT.GetCountry.GetCapital.GetName] provocó conmociones en las élites [ROOT.GetCountry.GetAdjective], ya que muchos habían supuesto que los dos habían fallecido en su viaje. Su apariencia demacrada tampoco ayudó mucho a inspirar confianza, ya que ambos habían perdido una cantidad sustancial de peso, pero con el tiempo, la vida normal se reanudó en la capital. Un mes después de su regreso, era como si nunca se hubieran ido.\n\nEra avanzada la tarde y [ROOT.GetCountry.GetRuler.GetFirstName] estaba ocupado dictando correspondencia a un escriba cuando [ROOT.GetCountry.GetRuler.GetSheHe] fue interrumpido por la llegada inesperada de [SCOPE.sCharacter('priest').GetFirstName] - como siempre, un presagio contradictorio.\n\n'No te entretendré mucho, o [ROOT.GetCountry.GetRuler.GetFirstName], pero Vengo a deciros que he soñado por última vez. Tu sacrificio a [GetDeityDefinition('omen_wodenaz').GetName] fue digno, y el gran dios pronto revelará una gran maravilla entre nosotros; sigue siendo paciente, mi [ROOT.GetCountry.GetRulerTitle].'"
me_germania.88.a: "Espero ansiosamente que los dioses cumplan su parte de este trato."

me_germania_89_title: "Irminsul"
me_germania_89_desc: "Al principio, [ROOT.GetCountry.GetRuler.GetName] no creía los mensajes enviados a [ROOT.GetCountry.GetCapital.GetName], pero cada día llegaban nuevos informes a la capital [ROOT.GetCountry.GetAdjective]. Las historias contadas por los espías de [ROOT.GetCountry.GetRuler.GetFirstName] fueron compartidas por los comerciantes ambulantes semanas después, y al poco tiempo, todos no podían dejar de hablar de lo mismo; el descubrimiento de un árbol gigante, uno que desafiaba toda descripción, en las colinas boscosas de [GetProvince('(int32)3792').GetName].\n\nLos visitantes de este extraño lugar afirmaron que podían sentir la presencia de los dioses al estar de pie junto al enorme árbol que se alzaba en el bosque como un gran pilar, y rápidamente se ha convertido en un lugar de peregrinación para los miembros de las tribus que viven en la región."
me_germania.89.a: "¿Podría ser esto... debe serlo? El regalo prometido por [GetDeityDefinition('omen_wodenaz').GetName]"
me_germania_89_tooltip: "La #Y Gran Maravilla#! #G Irminsul#! ha sido descubierta en el asentamiento de #T Sicambria#!."

#modifiers

germania_mod_2: "Motivados políticamente"
desc_germania_mod_2: "Estamos dedicados a la vida cívica de nuestro país, incluso a expensas de la religión."
germania_mod_3: "Un regreso a las viejas costumbres"
desc_germania_mod_3: "Hemos elegido volver a las costumbres de nuestros antepasados en una firme reprimenda a la influencia corruptora de la civilización."
germania_mod_4: "Esfuerzos de reforma legal"
desc_germania_mod_4: "Estamos centrando nuestros esfuerzos internos en reformar nuestro sistema legal."
germania_mod_5: "Gran República de Germania"
desc_germania_mod_5: "Nuestra próspera República, una tierra de ley y honor, es respetada en todas partes como un lugar de vida virtuosa."
germania_mod_6: "Tierra Próspera"
desc_germania_mod_6: "Nuestra gente y nuestro campo están prosperando, porque los dioses nos han bendecido."
germania_mod_7: "Espadas de las élites"
desc_germania_mod_7: "Las clases nobles que viven en nuestro reino se han visto obligadas a mantener a la casa real."
germania_mod_8: "Ciudades en el desierto"
desc_germania_mod_8: "Los dioses de la cosecha nos han otorgado sus bendiciones y han alentado a nuestro pueblo a construir ciudades en el desierto."
germania_mod_9: "Tiempos de auge"
desc_germania_mod_9: "Nuestro país está disfrutando de una era muy próspera, todo gracias a nuestras políticas comerciales y económicas."
germania_mod_10: "Asaltantes blindados"
desc_germania_mod_10: "Nos hemos esforzado por mejorar la calidad de las armaduras que nuestros guerreros usan en la batalla."
germania_mod_11: "Asaltantes de élite"
desc_germania_mod_11: "Los hombres elegidos entre nuestras filas para realizar incursiones punitivas son guerreros excepcionales, inigualables en la batalla."
germania_mod_12: "pared de madera"
desc_germania_mod_12: "Nuestra doctrina para defender nuestro hogar no viene por tierra sino por mar. Necesitamos reclutar más marineros a expensas de nuestro ejército."
germania_mod_13: "Gran puerto germánico"
desc_germania_mod_13: "Esta ciudad no es sólo la sede del poder provincial, sino también un importante puerto militar. Muchos de los mejores armadores que viven en nuestro país tienen aquí sus casas."
germania_mod_14: "Capital fortificada"
desc_germania_mod_14: "Esta ciudad ha sido fuertemente fortificada por los lugareños, con enormes movimientos de tierra levantados a lo largo de su perímetro para desalentar los ataques."
germania_mod_16: "Capital ampliado"
desc_germania_mod_16: "Hemos hecho maravillas para ampliar la infraestructura de nuestra capital."
germania_mod_17: "Ciudad de los nobles"
desc_germania_mod_17: "Esta ciudad está llena de villas y propiedades de las élites, que han acudido en masa a la ciudad."
germania_mod_18: "Ciudades de Germania"
desc_germania_mod_18: "Nuestros ingenieros están trabajando más duro y más rápido que nunca mientras compiten por construir nuevas ciudades en nuestros territorios."
germania_mod_19: "Ningún lugar es seguro"
desc_germania_mod_19: "Nuestros audaces asaltantes navegarán hasta los confines de la Tierra, si es necesario, para saquear las tierras indefensas de nuestros enemigos."
germania_mod_20: "Almirante despreciado"
desc_germania_mod_20: "Nuestra voluntad de poner fin a la doctrina del muro de Wood no fue apreciada en nuestra marina."
germania_mod_21: "Apoyo de almirantes"
desc_germania_mod_21: "Nuestro muro de madera es una prueba de nuestro apoyo hacia ellos y, a cambio, ellos apoyan nuestros objetivos."
germania_mod_22: "Asaltantes germánicos"
desc_germania_mod_22: "Nuestros asaltantes sedientos de sangre han saqueado las tierras de nuestros vecinos, provocando que nos teman y odien."
germania_mod_23: "Infraestructura mejorada"
desc_germania_mod_23: "La infraestructura de nuestras ciudades y carreteras ha aumentado considerablemente con respecto a lo que alguna vez fueron."
germania_mod_24: "Piedra de Germania"
desc_germania_mod_24: "Gracias a los suministros casi infinitos de piedra que hemos acumulado, nuestras levas y legiones estarán equipadas con el mejor equipo militar que se pueda fabricar."
germania_mod_25: "Tierras agrícolas de Germania"
desc_germania_mod_25: "Los campos y granjas de nuestros territorios centrales son lo suficientemente productivos como para alimentar a los miles de miembros de tribus que viven dentro de nuestras fronteras."
germania_mod_26: "Extranjeros bienvenidos"
desc_germania_mod_26: "Nuestra capital está lista para recibir a inmigrantes de todo el mundo."
germania_mod_27: "Restricción de migración"
desc_germania_mod_27: "Para preservar nuestra cultura y tradiciones, hemos impuesto restricciones a los extranjeros."
germania_mod_28: "Sede de los druidas"
desc_germania_mod_28: "Nuestro capital es administrado por nuestros druidas en detrimento de nuestros ciudadanos de élite."
germania_mod_29: "Justicia ciudadana"
desc_germania_mod_29: "Nuestro sistema de justicia tiene jueces profesionales, lo que agrada a la aristocracia local pero enoja a los druidas locales."
germania_mod_30: "Gran Mercado"
desc_germania_mod_30: "El mercado que se encuentra dentro de esta ciudad es famoso por su lujo."
germania_mod_31: "Reclamando el mar abierto"
desc_germania_mod_31: "Nuestros audaces marineros han reclamado los mares para nuestro pueblo."
germania_mod_32: "Capital próspera"
desc_germania_mod_32: "Nuestra capital está prosperando y creciendo, capaz de sostenerse por sí misma."
germania_mod_33: "Colonia próspera"
desc_germania_mod_33: "Esta colonia está prosperando en un país duro, todo gracias a los esfuerzos de quienes están en casa."
germania_mod_34: "Sabiduría romana"
desc_germania_mod_34: "Hemos estudiado las cosas en las que sobresalen los romanos, y su conocimiento cívico y militar se ha convertido en el nuestro."
germania_mod_35: "Saqueo romano"
desc_germania_mod_35: "Hemos demostrado a los orgullosos romanos que somos guerreros superiores, y ellos han admitido a regañadientes que nuestros ejércitos son de excelente calidad: un verdadero oponente al que temen."
germania_mod_36: "Dos reinos, un imperio"
desc_germania_mod_36: "Nuestro poderoso imperio abarca no sólo las islas germánicas, sino también extensas posesiones dentro de la Galia y el continente de Europa."
germania_mod_37: "Una capital conectada"
desc_germania_mod_37: "Esta ciudad tiene amplias conexiones con el comercio en tierras extranjeras, y dentro de sus muros se pueden encontrar muchos comerciantes y mercados."
germania_mod_38: "Próspera ciudad germánica"
desc_germania_mod_38: "La atención prestada a esta ciudad por parte de la clase dominante ha traído crecimiento económico."
germania_mod_39: "Aserraderos bien abastecidos"
desc_germania_mod_39: "Disponemos de abundantes suministros de madera, lo que supone una gran ayuda para nuestros astilleros y constructores de embarcaciones."
germania_mod_40: "Madereros de Germania"
desc_germania_mod_40: "Nuestra gente es experta en la tala de árboles y recolección de madera."
germania_mod_41: "Caballos germánicos"
desc_germania_mod_41: "Los caballos de guerra que se crían en Germania son algunos de los animales más feroces de toda Europa: estas bestias salvajes anhelan la guerra y la batalla tanto como nuestras tropas."
germania_mod_42: "Yeguadas de Bremenium"
desc_germania_mod_42: "Nuestras autoridades han centrado sus esfuerzos en construir ganaderías por todo el asentamiento de Bremenium en un intento de criar la mayor cantidad posible de monturas agresivas."
germania_mod_43: "Leñadores de Germania"
desc_germania_mod_43: "Nuestros cazadores complementan su dieta cazando ciervos y otros animales en los bosques de Pritania."
germania_mod_44: "Comercio nativo"
desc_germania_mod_44: "Disfrutamos de relaciones pacíficas con las tribus fénnicas de Hiperbórea, lo que ha dado renombre a nuestro nombre."
germania_mod_44a: "Esclavistas fénicos"
desc_germania_mod_44: "Disfrutamos de relaciones pacíficas con las tribus fénnicas de Hiperbórea, lo que ha dado renombre a nuestro nombre."
germania_mod_45: "Se suministra con sal"
desc_germania_mod_45: "Disponemos de abundantes suministros de uno de los bienes comerciales más valiosos a los que tenemos acceso: la sal."
germania_mod_46: "Un hambre de conquista"
desc_germania_mod_46: "Nuestro pueblo no desea nada más que ampliar nuestras fronteras y conquistar nuevas tierras y naciones."
germania_mod_47: "Celtas aceptados"
desc_germania_mod_47: "Son reconocidos como nuestros hermanos, dignos de participar en nuestra sociedad."
germania_mod_48: "Amigos hibernianos"
desc_germania_mod_48: "Los hibernianos están de nuestro lado y compartirán su herencia con nosotros."
germania_mod_49: "Afluencia tribal de Caledonia"
desc_germania_mod_49: "Los feroces caledonianos se están moviendo ahora dentro de nuestro reino, compartiendo conocimientos y protegiendo contra incursiones."
germania_mod_50: "Oro pritaniano"
desc_germania_mod_50: "Los pritannianos están dispuestos a mejorar la riqueza de nuestro reino con su oro."
germania_mod_51: "dominación"
desc_germania_mod_51: "Nuestro líder decidió que esta cultura no debería ser nuestra igual y debería ser dominada y asimilada."
germania_mod_52: "Dominación extrema"
desc_germania_mod_52: "Esta cultura es apta para limpiar establos y trabajar en minas: los esclavos más bajos."
germania_mod_53: "a la esclavitud"
desc_germania_mod_53: "Con conquista y decisión recientes, nuestro país está listo para esclavizar a los celtas renegados."
germania_mod_54: "Puertos del Mediterráneo"
desc_germania_mod_54: "Nuestros puertos mediterráneos se han convertido rápidamente en partes importantes de nuestra presencia militar y económica dentro de la región de la Galia."
germania_mod_55: "Canal seguro"
desc_germania_mod_55: "Gracias a nuestro control de los mares, el comercio se mueve fácilmente entre nuestra isla y el continente."
germania_mod_56: "Ciudades en el bosque"
desc_germania_mod_56: "Nuestro indomable pueblo ha dominado el arte de construir grandes ciudades en regiones densamente boscosas."
germania_mod_57: "Hombres libres importando vino extranjero"
desc_germania_mod_57: "Nuestros hombres libres gastan una cantidad desagradable de dinero importando vinos finos de países extranjeros."
germania_mod_57a: "Tribus que importan vino extranjero"
desc_germania_mod_57a: "Los miembros de nuestra tribu gastan una cantidad desagradable de dinero importando vinos finos de países extranjeros."
germania_mod_58: "Terraformación"
desc_germania_mod_58: "Esta provincia está en proceso de renovación y adaptación para producir un nuevo bien dentro de este territorio."
germania_mod_59: "Juegos maravillosos"
desc_germania_mod_59: "El recuerdo de nuestros últimos grandes partidos todavía está presente en la mente de nuestros compatriotas."
germania_mod_60: "Buenos juegos"
desc_germania_mod_60: "Si bien no son los mejores juegos del mundo, sigue siendo algo que la gente aprecia."
germania_mod_61: "Juegos corruptos"
desc_germania_mod_61: "Estos juegos eran extremadamente malos y muchos decían que estaban malditos."
germania_mod_62: "No se celebraron juegos"
desc_germania_mod_62: "Aunque no es una tradición antigua en nuestro país, negarse a celebrar los juegos no fue bien recibido por la gente."
germania_mod_63: "Esfuerzos del espectador"
desc_germania_mod_63: "Nuestros compatriotas financiaron los juegos en su totalidad."
germania_mod_64: "Olimpiadas libres"
desc_germania_mod_64: "Financiado por nuestro gran líder, quien prometió que todos los hombres, mujeres y niños que viven en nuestro país deberían ver los juegos."
germania_mod_65: "Felicidad en la tradición"
desc_germania_mod_65: "Nuestro pueblo está feliz de abrazar y defender nuestras antiguas prácticas culturales, incluso en un mundo de cambios."
germania_mod_66: "Guerra civil en preparación"
desc_germania_mod_66: "Nuestro país será devastado por las manos de nuestro propio pueblo: ¡prepárense!"
germania_mod_67: "Hambre de conocimiento"
desc_germania_mod_67: "Nuestra gente, siempre ansiosa por aumentar sus conocimientos, se ha dedicado a estudios académicos con la esperanza de hacer crecer nuestras tecnologías."
germania_mod_68: "Nueva Era"
desc_germania_mod_68: "Nuestro pueblo empezará a beneficiarse de la modernización."
germania_mod_69: "Influencia romana"
desc_germania_mod_69: "Con nuestra modernización completada por la sabiduría romana, ahora estamos influenciados por ella para siempre."
germania_mod_70: "Influencia mercenaria"
desc_germania_mod_70: "La riqueza que generamos a menudo encuentra su hogar en los bolsillos de un mercenario."
germania_mod_71: "Influencia urbana"
desc_germania_mod_71: "Con nuestra modernización fortalecida por el conocimiento de la construcción de ciudades, nuestros ejércitos pueden conquistar el mundo."
germania_mod_72: "El Patrimonio Supremo"
desc_germania_mod_72: "Nuestro pueblo ha abrazado sus tradiciones y herencia, negándose a permitir que un mundo de caos cambie quiénes somos."
germania_mod_73: "Cambios crecientes"
desc_germania_mod_73: "Nuestra modernización de la tradición no es del gusto de todos."
germania_mod_74: "Jinetes salvajes"
desc_germania_mod_74: "Nuestra caballería ligera es excepcionalmente poderosa y siembra el terror en los corazones de quienes la enfrentan."
germania_mod_75: "Arqueros de Germania"
desc_germania_mod_75: "Nuestros arqueros son maestros en luchar desde los bosques, aprovechando la naturaleza para protegerse del enemigo."
germania_mod_76: "Una nueva forma de hacer las cosas"
desc_germania_mod_76: "Nuestro pueblo no tiene miedo de incorporar nuevas formas de hacer las cosas, especialmente cuando ello redunde en beneficio de la nación."
germania_mod_77: "Registros orales"
desc_germania_mod_77: "Nuestra gente continúa confiando en nuestros Ancianos Tribales para contar nuestras historias e historias."
germania_mod_78: "Alfabeto de Germania"
desc_germania_mod_78: "Nuestros escribas han desarrollado un lenguaje escrito para que lo utilice nuestro pueblo."
germania_mod_79: "Alfabeto latino"
desc_germania_mod_79: "Importamos y adaptamos el alfabeto de Roma."
germania_mod_80: "Alfabeto púnico"
desc_germania_mod_80: "Importamos y adaptamos el alfabeto de Cartago."
germania_mod_81: "Alfabeto griego"
desc_germania_mod_81: "Importamos y adaptamos el alfabeto de Grecia."
germania_mod_82: "Infraestructura romana"
desc_germania_mod_82: "Nuestra ciudad brillará por la arquitectura romana."
germania_mod_83: "Infraestructura griega"
desc_germania_mod_83: "Nuestra ciudad brillará con la arquitectura helénica."
germania_mod_84: "Infraestructura púnica"
desc_germania_mod_84: "Nuestra ciudad brillará desde la arquitectura púnica."
germania_mod_85: "Tácticas de los elefantes púnicos"
desc_germania_mod_85: "Nuestra fascinación por Cartago y sus maravillas nos ha animado a tener nuestro propio ejército de elefantes."
germania_mod_86: "Tácticas combinadas púnicas"
desc_germania_mod_86: "Fuertes y disciplinados en tierra y mar, la estrategia púnica nos llevará a la victoria."
germania_mod_87: "Tácticas en cursiva"
desc_germania_mod_87: "¡El poder de Roma es nuestro ahora!"
germania_mod_88: "Ingeniero en cursiva"
desc_germania_mod_88: "¡La logística de Roma ahora es nuestra!"
germania_mod_89: "Dominio de la lanza"
desc_germania_mod_89: "Podemos asumir que nuestro ejército es tan fuerte, si no más fuerte, que los famosos Escudos de Plata de Alejandro."
germania_mod_90: "Maestros del caballo"
desc_germania_mod_90: "Nuestra caballería se encuentra entre las más mortíferas del mundo."
germania_mod_91: "Manteniendo nuestras raíces"
desc_germania_mod_91: "Incluso cuando nuestras ciudades se expanden, nuestra gente no olvida de dónde viene."
germania_mod_93: "Fiesta Religiosa"
desc_germania_mod_93: "Para mostrar nuestra independencia cultural, creamos un festival que las generaciones futuras recordarán."
germania_mod_94: "Administración Docente"
desc_germania_mod_94: "Estamos orgullosos de nuestros ciudadanos, porque son excelentes maestros para sus hijos y se toman muy en serio su educación."
germania_mod_95: "Invertir en el mercado"
desc_germania_mod_95: "Los beneficios obtenidos en los mercados se han reinvertido en la infraestructura de nuestras áreas comerciales."
germania_mod_96: "Gran Ciudad Imperial"
desc_germania_mod_96: "Nuestra capital finalmente está lista para ser el paraíso en la tierra."
germania_mod_97: "Antiguo Centro de Comercio"
desc_germania_mod_97: "La recuperación de Armórica nos permitió reconstruir antiguas rutas comerciales en la Galia que habían estado abandonadas durante siglos."
germania_mod_98: "Trabajadores belgas"
desc_germania_mod_98: "Los belgas no son más que esclavos de nuestros campos y minas."
germania_mod_99: "Tradiciones del caballo galo"
desc_germania_mod_99: "Con el conocimiento de la Galia, nuestra caballería ahora es más fuerte."
germania_mod_100: "Inversión Nacional"
desc_germania_mod_100: "En lugar de financiar expediciones peligrosas, nuestro país y nuestros ciudadanos se benefician de un plan nacional de desarrollo."
germania_mod_124: "Bienes de la alta sociedad"
desc_germania_mod_124: "Los comerciantes cartagineses visitan nuestras tierras y venden productos a los más ricos que viven dentro de nuestras ciudades, y si bien esto es bueno para ellos, los de baja cuna no aceptan fácilmente la desigualdad."
germania_mod_125: "Espíritu germánico"
desc_germania_mod_125: "Todos nuestros compatriotas están unidos en alegría, manteniendo nuestras tradiciones en sus familias y clanes."
germania_mod_126: "¡Esclavízalos a todos!"
desc_germania_mod_126: "Se ha alentado a nuestros guerreros a tomar tantos esclavos como sea posible."
germania_finland_colony_mod: "Colonia Fénica"
desc_germania_finland_colony_mod: "Nuestro pueblo ha establecido una colonia en las lejanas regiones fennicas."
germania_mod_127: "Apoyando a la colonia extranjera"
desc_germania_mod_127: "Esta provincia mantiene una colonia en el extranjero, lo que supone una presión considerable para sus recursos."
germania_mod_128: "Amado por los dioses"
desc_germania_mod_127: "Esta provincia mantiene una colonia en el extranjero, lo que supone una presión considerable para sus recursos."
germania_ring: "Yelmo de los reyes germánicos"
germania_ring_desc: "Este imponente casco fue forjado y regalado al primer monarca del Trono Germánico y es un símbolo de la autoridad real sobre todo."
germania_ring_power: "$germania_ring$"
germania_ring_power_desc: "$germania_ring_desc$"
germania_throne: "Trono de los reyes germánicos"
germania_throne_desc: "Este magnífico trono, tallado en el más fino mármol, fue entregado a los primeros reyes que gobernaron las tribus germánicas."
germania_sword: "Gaizaz dorado"
germania_sword_desc: "Esta lanza arrojadiza dorada fue elaborada por los primeros reyes germánicos como símbolo de fuerza militar."
alexander_foot_armor: "Armadura de Pie de Alejandro"
alexander_foot_armor_desc: "Se dice que poseer la armadura de pie que perteneció a Alejandro trae éxito en batalla."
delphi_statue: "Estatua de Delfos"
delphi_statue_desc: "Esto parece una estatua inofensiva, pero podría contener un gran poder en su interior."

germania_migratory_settler_mod: "llamada de lo salvaje"
desc_germania_migratory_settler_mod: "Nuestros parientes están ansiosos por colonizar territorios no reclamados."

