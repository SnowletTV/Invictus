l_spanish:

 ####################
 # Title
 ####################

 greek_6_crete:0 "La Unificación de Creta"
 greek_6_crete_DESCRIPTION:0 "¡Guerra! Su inconfundible mano negra ha contaminado todo a nuestro alrededor; hoy en día, ya sea en el ágora, el templo o la taberna, no se habla de otra cosa que no sea guerra y devastación. Los macedonios, liderados por Alejandro y sus Sucesores, han llevado la guerra al mundo en general, pero las ciudades-estado de la isla de Creta de algún modo han logrado evitar verse arrastradas por la locura. Y, sin embargo, una nueva generación de hombres ambiciosos ha desoído los peligros que sus padres les advirtieron con desesperación, buscando dominar la isla por la fuerza y trastornando el precario statu quo.\n\nLos poetas, perdidos en sus ensoñaciones, suspiran profundamente en sus versos y en sus copas, proclamando que todo lo bueno debe llegar a su fin...\n\nPor ahora, la guerra ha encontrado a Creta."
 greek_6_crete_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completada cuando Creta haya sido unificada en un solo estado."
 greek_6_crete_BUTTON_TOOLTIP:0 ""
 greek_6_crete_BUTTON_DETAILS: ""

 ####################
 # Mission Tasks
 ####################


 crete_mission_inv_1_task:0 "Disciplina en los campamentos"
 crete_mission_inv_1_task_DESC:0 "Si pensamos en conquistar toda Creta para nosotros, necesitaremos un ejército disciplinado y profesional, muy distinto al que poseemos ahora. Puede que no sea una noticia popular entre las filas, pero decid a los soldados que es hora de ejercitarse sin descanso. \n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 crete_mission_inv_2_task:0 "Espada de hierro y coraza de cuero"
 crete_mission_inv_2_task_DESC:0 "Debemos equipar correctamente a nuestros soldados con el mejor armamento que podamos obtener, porque no podemos permitir enviar hombres al campo contra un enemigo con mejor equipo. Los tesoros de las ciudades cretenses son profundos, y los nuestros deben serlo aún más. \n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 crete_mission_inv_3_task:0 "Un estado de cosas indómito"
 crete_mission_inv_3_task_DESC:0 "Durante demasiado tiempo, Creta ha existido en un estado de casi parálisis, con cada hombre actuando por su propio interés. Como un barco debe tener un solo capitán, así también nuestra isla debe tener un solo señor. ¡Prepara nuestras reclamaciones y reúne nuestras levas, porque la guerra está en el horizonte! \n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 crete_mission_inv_4_task:0 "Trabajos de asedio y zapadores"
 crete_mission_inv_4_task_DESC:0 "El caótico estado político de nuestra isla, sin un hegemon claro que ejerza autoridad sobre las numerosas ciudades-estado, ha dado lugar a una situación en la que casi cada provincia está fortificada. Nuestros soldados, especialmente los que manejan las máquinas de asedio, tienen mucho trabajo por delante.\n\nNo hace falta decir que mantener una unidad militar de élite conlleva sus costes...\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 crete_mission_inv_5_task:0 "Una moneda de oro para el primero"
 crete_mission_inv_5_task_DESC:0 "Por cada nueva ciudad que tomemos, se ha hecho saber que el primer soldado que logre escalar las murallas de una ciudad enemiga recibirá una moneda de oro, pagada del tesoro del Estado. Ahora todos ansían ese honor, luchando como poseídos por espíritus infernales. \n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 crete_mission_inv_6_task:0 "Exprimir hasta la última gota"
 crete_mission_inv_6_task_DESC:0 "Nuestras guerras de conquista han sido devastadoras para nuestras comunidades, eso se sabe, pero nuestras circunstancias actuales nos obligan a extraer aún más de este pozo, exprimiendo toda la mano de obra disponible en aldeas y ciudades. Nunca olvidaremos este regalo inestimable dado por nuestras madres y hermanas, y prometemos luchar por el sueño de Creta. \n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 crete_mission_inv_7_task:0 "Implantar el racionamiento"
 crete_mission_inv_7_task_DESC:0 "No solo necesitamos importar cereales para alimentar a nuestros soldados, sino que lamentablemente debemos introducir un sistema de racionamiento en nuestras provincias; en estos tiempos, cada cabeza de grano, cada pizca de harina debe ser contabilizada. \n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 crete_mission_inv_8_task:0 "Conquistando lo inconquistable"
 crete_mission_inv_8_task_DESC:0 "Algunos han afirmado que Creta era una tierra llena de ciudades inexpugnables, pobladas por ladrones, mentirosos y piratas. Como han demostrado nuestros éxitos recientes, la primera parte de ese adagio es claramente falsa. \n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 thicc_crete_tt:0 "Debes poseer directamente al menos ocho provincias en la isla de Creta."
 crete_mission_inv_9_task:0 "Los saltadores del toro"
 crete_mission_inv_9_task_DESC:0 "Nuestros exploradores han terminado de cartografiar la provincia de [GetProvince('(int32)358').GetName] y afirman que debemos visitar las antiguas ruinas nosotros mismos. \n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 crete_mission_inv_10_task:0 "Como fue, así será de nuevo"
 crete_mission_inv_10_task_DESC:0 "En tiempos antiguos, Creta estuvo bajo el dominio de un solo poder, y estamos listos para anunciar al mundo que esos días han vuelto. El periodo desordenado que dio lugar a nuestro ascenso, lleno de peligro y miseria para la gente de nuestra isla, ha llegado a su fin.\n\nComo nuestros predecesores en la gloria, los minoicos, una vez gobernaron Creta desde [GetProvince('(int32)358').GetName], es apropiado que lo hagamos nosotros mismos. \n\n\n\n\n\n\n\n\n\n@greek_mil10!"


 ####################
 # Events
 ####################

 me_crete_1_title:0 "Disciplina en los campamentos"
 me_crete_1_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] podría ser el hombre más impopular en los campamentos militares en este momento, una distinción que el ardiente líder soporta con estoica indiferencia. La razón por la que [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] está provocando tantas quejas es simple; nuestros soldados están entrenando tres o cuatro veces más duro que antes, y aunque las raciones se han aumentado ligeramente para compensar el ritmo agotador, hay muchos alistados que no están contentos.\n\nCuando algunos de los [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] asesores militares más cercanos se acercaron, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] rechazó cualquier intento de reducir la carga de trabajo, el mismo estribillo en [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] labios."
 me_greek_6_crete_1.a:0 "Si queremos sobrevivir, y mucho menos ganar, debemos luchar como uno solo."
 me_crete_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y Disciplina en los campos#!' $mission_completed_tooltip_2$"

 me_crete_2_title:0 "Espada de hierro y coraza de cuero"
 me_crete_2_desc:0 "Aunque prácticamente nos arruinó la decisión, al final decidimos escuchar las advertencias de [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], quien aconsejó firmemente no enviar a nuestros hombres al campo sin el mejor equipo disponible. Aunque todos coinciden en que nuestros guerreros lucen espléndidos, algunos de nuestros principales ciudadanos se han quejado del gasto exorbitante.\n\n'¿Cómo esperamos enfrentarnos a alguien si confiamos en que nuestros hombres traigan sus propias armas?' había argumentado persuasivamente [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]. 'La honda de tu abuelo no servirá si nuestros enemigos tienen espadas de hierro. Si queremos unir Creta, debemos hacer lo que nadie antes ha hecho, ¡cueste lo que cueste!'"
 me_greek_6_crete_2.a:0 "Hay mérito en las palabras de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]..."
 me_crete_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y Espada de hierro y coraza de cuero#!' $mission_completed_tooltip_2$"

 me_crete_3_title:0 "Un estado de cosas indómito"
 me_crete_3_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ha convocado a las principales familias de nuestra ciudad, aprovechando profundamente la [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] red de clientes para garantizar que una audiencia receptiva esté presente para el [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] discurso: cada favor y deuda que [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] se debe ha sido recordado.\n\nCuando llega la hora señalada, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] levanta la [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] mano, pidiendo silencio como [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] se lanza a orar y pronuncia un magnífico discurso titulado \"Un estado de cosas rebelde\". Argumentar que el sistema político cretense fracturado está condenado a la destrucción a menos que nos reunamos como uno solo, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] pinta elocuentemente un cuadro de fatalidad inminente. Al prometer que [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] tiene una visión para evitar este futuro calamitoso, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] nos advierte que nos esperan tiempos oscuros y, sin embargo, algún día saldrá el sol, pero esto requerirá la confianza y el apoyo de nuestro pueblo en los días oscuros que se avecinan.\n\nHoras más tarde, cuando la multitud se dispersaba de la asamblea, el ambiente era sombrío. No todo el mundo se dejó convencer por las palabras de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], pero existe la creencia unánime de que la guerra pronto envolverá nuestra región."
 me_greek_6_crete_3.a:0 "Aun así, traeré la paz a este reino desordenado."
 me_crete_3_tooltip:0 "Ahora tenemos derechos sobre la totalidad de Creta. $mission_completed_tooltip_1$ '#Y Una situación ingobernable#!' $mission_completed_tooltip_2$"

 me_crete_4_title:0 "Trabajos de asedio y zapadores"
 me_crete_4_desc:0 "Nuestros contables han presentado quejas oficiales al conocer los costes asociados al entrenamiento y equipamiento de nuestras unidades de zapadores. A pesar de las advertencias sobre lo ajustadas que quedan nuestras arcas, nuestros ingenieros han comenzado a construir obras de asedio, un gasto adicional que ha levantado cejas en la ciudad. [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] escuchó las quejas sin decir nada al principio, pero pronto zanjó cualquier discusión con un comentario seco antes de volver a observar la construcción.\n\n'Dime cuánto costaría tener a nuestro ejército fuera de las murallas de una ciudad durante dos años, y verás que te he ahorrado una fortuna.'"
 me_greek_6_crete_4.a:0 "Os aseguro que estas tropas altamente entrenadas nos darán la victoria."
 me_crete_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y Obras de asedio y zapadores#!' $mission_completed_tooltip_2$"

 me_crete_5_title:0 "Una moneda de oro para el primero"
 me_crete_5_desc:0 "¡Qué cambio de cosas! Verdaderamente el hombre es una criatura caprichosa. Hace no sólo unos meses, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] era regularmente maldecido por el mismo soldado que ahora canta alabanzas [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]. ¿A qué se debe el repentino cambio de tono?, cabría preguntarse. La semana pasada, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] se dirigió a las tropas en el campamento y prometió entregar personalmente una moneda de oro al primer hombre que escalara las murallas de una ciudad enemiga.\n\nNuestros soldados claman por la oportunidad de lograr este honor, y muchos sueñan con asegurarse esta ganancia inesperada para ellos. ¡Qué estrategia tan brillante ha puesto [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]!"
 me_greek_6_crete_5.a:0 "No hay nada malo en...animar...a los hombres a cumplir con su deber."
 me_crete_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y Una moneda de oro para el primer hombre#!' $mission_completed_tooltip_2$"

 me_crete_6_title:0 "Exprimir hasta la última gota"
 me_crete_6_desc:0 "Nuestras recientes victorias han sido asombrosas, pero han costado vidas. Se reconoce que escasea la mano de obra, y sin más cuerpos para cubrir las filas, podemos perder todo lo ganado.\n\nConsciente de la gravedad, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] tomó la impopular decisión de enviar soldados a los mercados, reclutando a cualquiera que pareciera capaz de empuñar una lanza e incorporándolos al servicio militar.\n\nUna acción sin precedentes, pero estos son los tiempos que vivimos."
 me_greek_6_crete_6.a:0 "Capturad a todo hombre apto y enviadlo a los campos de entrenamiento ahora mismo."
 me_crete_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y Exprimiendo hasta la última gota#!' $mission_completed_tooltip_2$"

 me_crete_7_title:0 "Un sistema de racionamiento"
 me_crete_7_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] está adquiriendo reputación de tomar decisiones difíciles, incluso a expensas de la popularidad de [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]. Afirmando que es casi imposible alimentar tanto a nuestros ejércitos como a nuestros ciudadanos, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] ha ordenado que se racione el pan en las ciudades. Si bien muchos todavía ponen su fe en [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], hay algunos que susurran que [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] no es más que un tirano, buscando la primera oportunidad de tomar el poder de una población hambrienta.\n\nSin embargo, uno tendrá que aguzar el oído para escuchar estos murmullos traidores, especialmente entre los gruñidos de los estómagos vacíos."
 me_greek_6_crete_7.a:0 "Algún día habrá pan gratis para todos, pero por ahora debemos sacrificarnos."
 me_crete_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y Implementar racionamiento#!' $mission_completed_tooltip_2$"

 me_crete_8_title:0 "Conquistando lo inconquistable"
 me_crete_8_desc:0 "Aunque muchas de las políticas promulgadas por [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] han tenido una buena cantidad de detractores, nadie puede afirmar que [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] no haya cumplido lo prometido. Por primera vez en años, hay una potencia en ascenso en Creta; nuestros ingresos, territorios e influencia crecen, mientras que nuestros logros son reconocidos en todo el mundo.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] nos lleva hacia la victoria; ¡Ponemos toda nuestra fe en [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHim]!"
 me_greek_6_crete_8.a:0 "Aún queda mucho por hacer."
 me_crete_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y Conquistando lo invencible#!' $mission_completed_tooltip_2$"

 me_crete_9_title:0 "Los saltadores del toro"
 me_crete_9_desc:0 "El Palacio de [GetProvince('(int32)358').GetName], que alguna vez fue hogar de reyes legendarios, todavía existe en un estado semi-ruinado, y aunque hay innumerables tareas que requieren todo el tiempo libre de [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] ha decidido realizar una visita personal a la zona, creyendo que algunas visitas turísticas a la antigua usanza podrían hacer maravillas para los niveles de estrés de [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis].\n\nEra media mañana cuando [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], después de desayunar en el terreno montañoso que dominaba los terrenos, decidió aventurarse dentro del palacio. Allí, en la oscuridad y el silencio, un fresco en una de las paredes orientales dejó [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] sin aliento. Pintada sobre paneles de estuco había una escena que mostraba a un toro embistiendo, magnífico y terrible, amenazando con destruir todo lo que se encontraba ante sus cascos furiosos, y sin embargo había acróbatas, riendo y sin miedo, saltando ágilmente sobre la bestia.\n\nCon una voz ahogada por la emoción, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] dice: \"Me veo a mí mismo y a nuestra lucha en estas pinturas... nunca alguien que elude el peligro, sino valientemente mirando hacia adelante, agarrando al toro por los cuernos y flotando sobre el caos con elegancia y gracia\". Dejemos este lugar, pero llevemos esta lección con nosotros.'"
 me_greek_6_crete_9.a:0 "Qué inspiración fueron estos minoicos..."
 me_crete_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y Los saltadores de toros#!' $mission_completed_tooltip_2$"

 me_crete_10_title:0 "Como fue, así será de nuevo"
 me_crete_10_desc:0 "Ha amanecido un nuevo día para [GetProvince('(int32)358').GetArea.GetName]; Ya no es un campo de lucha para ciudades-estado en disputa y mercenarios despiadados, la isla ha sido pacificada por primera vez en la memoria gracias al liderazgo divinamente inspirado de [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. Durante años, nuestro líder tuvo que lidiar con las estrategias despiadadas de los generales enemigos, mientras navegaba por el tenso clima político y las apretadas finanzas en el frente interno, una hazaña que parecía imposible antes de que [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] demostrara que podía lograrse. Las calles están llenas de estridentes celebraciones, con voces que alguna vez acusaron a [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] de ser un déspota y ahora cantan [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] alabanzas eternas.\n\nIncluso ahora, mientras el elogio casi universal cae sobre [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] permanece inusualmente taciturno... en la hora del triunfo, ¿parece que todavía hay algo en [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] mente?"
 me_greek_6_crete_10.a:0 "Gobernaremos una isla unida desde la antigua sede del poder minoico."
 me_greek_6_crete_10.b:0 "Algunos me han llamado tirano... no tenían idea de lo que soy capaz."
 me_crete_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y Como era, así será otra vez#!' $mission_completed_tooltip_2$"
 me_crete_11_tooltip:0 "¡Los partidarios #R [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] y [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] tomarán el trono!#!' $mission_completed_tooltip_1$ '#Y Como era, así será otra vez#!' $mission_completed_tooltip_2$"

 grumbling_soldiers:0 "Soldados quejumbrosos"
 desc_grumbling_soldiers:0 "Nuestros soldados se han quejado por la estricta disciplina militar en los campamentos."
 grumbling_bellies:0 "Barrigas quejumbrosas"
 desc_grumbling_bellies:0 "Aunque el racionamiento es necesario para el esfuerzo bélico, ha resultado extremadamente impopular."
 iron_weapons:0 "Armas de hierro"
 desc_iron_weapons:0 "Equipar a un ejército con el mejor armamento es un gasto que rinde frutos en el campo de batalla."
 cretan_sappers:0 "Zapadores cretenses"
 desc_cretan_sappers:0 "Esta unidad de élite está entrenada en la demolición de murallas; así es la vida en nuestra isla."
 motivated_soldiers:0 "Soldados motivados"
 desc_motivated_soldiers:0 "Nuestros soldados luchan por la gloria y el honor, y la promesa de una moneda de oro para el primero que escale una muralla es un poderoso incentivo."
 mighty_crete:0 "Hegemón de Creta"
 desc_mighty_crete:0 "Habiendo conquistado la isla por la fuerza, nos proclamamos Hegemón de Creta."





