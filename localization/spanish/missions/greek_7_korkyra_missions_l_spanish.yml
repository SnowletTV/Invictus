l_spanish:
 
 greek_7_korkyra:0 "Korkyra, la Isla Negra"
 greek_7_korkyra_DESCRIPTION:0 "Korkyra, la isla en la que vivimos, ha sido hogar de muchos pueblos antes que nosotros; ilirios, feacios y griegos se han proclamado dueños de la Isla Negra, un apodo derivado de la riqueza de su suelo y de los densos bosques que cubren el interior de la isla. Durante muchos años, nuestros asuntos han estado entrelazados con los de los epirotas, y sin embargo hay cierta esperanza de que pronto podamos separarnos de lo que ocurre en el continente."
 greek_7_korkyra_CRITERIA_DESCRIPTION:0 "Esta misión se completará cuando Korkyra haya desarrollado su infraestructura y capacidades militares y haya creado fronteras seguras para sus compatriotas."
 greek_7_korkyra_BUTTON_TOOLTIP:0 "Korkyra no se someterá a sus enemigos, sino que sorprenderá al mundo con sus logros."
 greek_7_korkyra_BUTTON_DETAILS: ""
 
 #Missions
 
 greek_7_korkyra_task_1:0 "Aprovechar lo que tenemos"
 greek_7_korkyra_task_1_DESC:0 "Aunque las tierras a nuestra disposición son pequeñas, eso no significa que no debamos desarrollarlas al máximo. Cuanto mejor sea nuestra infraestructura, más espacio habrá para nuestros ciudadanos. \n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 
 greek_7_korkyra_task_2:0 "Seguros tras muros de madera"
 greek_7_korkyra_task_2_DESC:0 "Confiando en nada más que en nuestra propia fuerza, debemos hacer todo lo posible para asegurarnos frente a una invasión extranjera. Fortalecer nuestra marina debe ser una prioridad alta. \n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 
 greek_7_korkyra_task_3:0 "Un hogar para combatientes extranjeros"
 greek_7_korkyra_task_3_DESC:0 "Como no podemos fiarnos solo de nuestros propios soldados para defender la isla, hemos hecho saber por todas partes que los mercenarios encontrarán empleo a largo plazo con nosotros. Llevará tiempo y dinero difundir la noticia, pero estamos seguros de que la inversión merecerá la pena. \n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 
 greek_7_korkyra_task_4:0 "Afilar la guadaña"
 greek_7_korkyra_task_4_DESC:0 "Como te dirá cualquier arquitecto competente, si esperas construir un gran edificio necesitarás una base sólida; cualquier atajo tomado en las etapas preliminares solo invita al desastre más adelante. Afortunadamente, no somos tontos y nos aseguraremos de que [GetProvince('(int32)470').GetName] esté preparada para su futuro. \n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 
 greek_7_korkyra_task_5:0 "Elogiados por su piedad"
 greek_7_korkyra_task_5_DESC:0 "Nuestra isla ha sido durante mucho tiempo un hogar donde los dioses deambulan; incluso nuestro nombre proviene de la leyenda, pues Korkyra fue una ninfa que Poseidón raptó y trajo a nuestras costas. Como nuestro pueblo siempre ha mantenido su devoción a los dioses, piden que construyamos un santuario sagrado. \n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 religious_piety_tt:0 "Necesitamos la inversión provincial de #Y Dotaciones Religiosas#! en nuestra capital."
 
 greek_7_korkyra_task_6:0 "Nuestro lado del Pindo"
 greek_7_korkyra_task_6_DESC:0 "Aunque hay muchos intereses extranjeros en la provincia de [GetProvince('(int32)459').GetArea.GetName], debemos controlar toda la tierra de nuestro lado de las montañas; permitir a un enemigo tan cerca de nuestro hogar insular es buscar problemas. \n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 
 greek_7_korkyra_task_7:0 "Entrar en Epiro"
 greek_7_korkyra_task_7_DESC:0 "Aunque nuestros vecinos en [GetProvince('(int32)421').GetArea.GetName] son más fuertes que nosotros, no debemos permitir que nos intimiden como hasta ahora. Si han ignorado a nuestros diplomáticos, quizá escuchen a nuestros soldados. \n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 
 greek_7_korkyra_task_8:0 "Dirige tus flotas a otro lado"
 greek_7_korkyra_task_8_DESC:0 "Hemos oído rumores de que el déspota de [GetProvince('(int32)84').GetName] ha puesto la vista en naciones más pequeñas para devorarlas; no nos encontrará débiles; al contrario. \n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 
 greek_7_korkyra_task_9:0 "Algo con lo que podemos trabajar"
 greek_7_korkyra_task_9_DESC:0 "Quizá nuestro ejército sea pequeño comparado con otros, pero nuestras tropas están curtidas en batalla y acostumbradas a luchar en el terreno más difícil que puedas imaginar... en asuntos militares, definitivamente podemos sacar partido a lo que tenemos.  \n\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 twelve_troops_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y] tiene un ejército de al menos #Y 12#!."
 
 greek_7_korkyra_task_10:0 "Sabuesos molosios"
 greek_7_korkyra_task_10_DESC:0 "Las agrestes tierras altas y los valles montañosos de Epiro albergan una feroz raza de mastines conocida como molosios, perros formidables aptos para el entrenamiento en la guerra. Estamos adiestrando a estas bestias para que luchen junto a nuestros hombres y actúen como perros guardianes... ¡ay del pobre que se encuentre frente a uno de estos sabuesos infernales! \n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 
 greek_7_korkyra_task_11:0 "Maestros de las montañas"
 greek_7_korkyra_task_11_DESC:0 "Si somos capaces de asegurar la provincia de [GetProvince('(int32)422').GetArea.GetName], particularmente las estribaciones que conducen a los pasos de montaña, controlaremos el camino hacia el corazón de la propia Macedonia. Esta será la mejor manera de vigilar a nuestros vecinos rebeldes.\n\nDígales a nuestros soldados que es hora de que se entrenen en el Pindo, ya que nuestro objetivo es convertirnos en los amos indiscutibles de estas montañas. \n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 
 greek_7_korkyra_task_12:0 "Detener a los espartanos"
 greek_7_korkyra_task_12_DESC:0 "¿Acaso nos librarán alguna vez de las ambiciones de generales intrigantes? Ahora recibimos noticias de que [GetProvince('(int32)427').GetName] se cree superior y piensa que caeremos ante sus ejércitos, convirtiéndonos en un puerto extranjero para un imperio ultramarino en ciernes. Estableceremos nuestra reputación en el campo de batalla humillando a los orgullosos lacedemonios. \n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 
 greek_7_korkyra_task_13:0 "Una riqueza de conocimiento"
 greek_7_korkyra_task_13_DESC:0 "Parte de los términos que impusimos a [GetProvince('(int32)84').GetName] tras nuestra victoria incluían acceso a los escritos de sus filósofos y sabios, pues hemos oído muchas historias sobre los famosos ingenieros que trabajan dentro de sus murallas.\n\nAunque tardarán en llegar, nos han asegurado que una cohorte de eruditos vendrá a nuestra capital para instruir a nuestros propios estudiosos. También traerán las indemnizaciones de guerra que nos deben, así que esperamos su llegada con impaciencia. \n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 
 greek_7_korkyra_task_14:0 "Un regalo de un dios"
 greek_7_korkyra_task_14_DESC:0 "Lo más peculiar se informa desde [GetProvince('(int32)470').GetName], donde los ciudadanos afirman que un dios marino visita el santuario que construimos por las mañanas, permanece un rato y luego se marcha con la marea. Deberíamos visitar personalmente el lugar, que la leyenda sitúa en el emplazamiento de una antigua colonia feacia, y hacer una ofrenda. \n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 
 greek_7_korkyra_task_15:0 "Una relación tensa"
 greek_7_korkyra_task_15_DESC:0 "Todos los que conocen nuestras historias saben que fuimos colonia de [GetProvince('(int32)418').GetName]. Aunque antaño tuvimos una relación cordial con nuestra antigua metrópoli, últimamente se ha vuelto irreparablemente tensa... \n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 
 greek_7_korkyra_task_16:0 "Agarrar el talón"
 greek_7_korkyra_task_16_DESC:0 "Las ricas ciudades portuarias al otro lado del Fretum Hydruntis nos llaman como las sirenas legendarias, prometiendo riqueza y gloria si expandimos nuestra presencia. \n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 
 #Treasures
 rudder_of_alcinous:0 "Timón de Alcínoo"
 rudder_of_alcinous_desc:0 "El rey Alcínoo, señor de los feacios, poseía una nave extraordinaria, veloz como un halcón, que surcaba el agua como si fuera un ave en el cielo."
 
 
 #Modifiers
 
 sharp_scythe:0 "Guadaña afilada"
 desc_sharp_scythe:0 "En la antigüedad, los primeros cartógrafos apodaron a nuestra isla por su forma geográfica, llamándonos 'Guadaña'. Al utilizar cada palmo de tierra disponible para fines cívicos y domésticos, hemos afilado ciertamente la hoja."
 korkyra_mercs:0 "Mercenarios korkyranos"
 desc_korkyra_mercs:0 "Porque nuestro liderazgo está dispuesto a gastar oro libremente para contratar soldados, los mercenarios acuden a nuestro estandarte."
 molossian_hounds:0 "Sabuesos molosios"
 desc_molossian_hounds:0 "El sabueso molosio, por su aspecto feroz y constitución robusta, se emplea con gran eficacia como perro guardián, patrullando campamentos y guarniciones."
 mountain_master:0 "Maestro del Pindo"
 desc_mountain_master:0 "Porque nuestras tropas entrenan duro en nuestras tierras escarpadas, escalando las alturas con la facilidad de las cabras, somos aclamados como los Maestros de las Montañas del Pindo."
 
 
 #Events
 me_greek_7_korkyra_1_title:0 "$greek_7_korkyra_task_1$"
 me_greek_7_korkyra_1_desc:0 "Desde las primeras horas del día, cuando el Sol apenas asoma en el horizonte, hasta la noche, cuando nuestros ingenieros trabajan a la luz de las antorchas, los obreros han estado ocupados en [GetProvince('(int32)470').GetName] con construcciones incesantes. Ahora que nos llega la noticia de que los proyectos finales se completan, nadie en la ciudad puede contener la emoción. Pasear por las calles recién embellecidas de Korkyra, con sus pórticos sombreados y guirnaldas, se ha convertido en una forma encantadora de pasar la tarde."
 me_greek_7_korkyra_1.a:0 "Tanto potencial sin explotar..."
 me_greek_7_korkyra_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_1$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_2_title:0 "$greek_7_korkyra_task_2$"
 me_greek_7_korkyra_2_desc:0 "Nuestra proximidad a la costa siempre ha sido un arma de doble filo; ganamos mucho por estar tan cerca del continente, especialmente en el comercio con los epirotas, pero los estrechos de Korkyra son tan angostos que un niño de diez años podría nadar hasta nuestra isla desde [GetProvince('(int32)421').GetName]. Aunque recibimos pacíficamente a quienes vienen en son de paz, hemos invertido en una marina que puede zarpar de nuestros puertos en cualquier momento para detener a quien venga con propósitos nefastos."
 me_greek_7_korkyra_2.a:0 "Nuestros barcos son nuestra primera línea de defensa"
 me_greek_7_korkyra_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_2$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_3_title:0 "$greek_7_korkyra_task_3$"
 me_greek_7_korkyra_3_desc:0 "Conscientes de la situación precaria, especialmente por la escasez de hombres para defender [GetProvince('(int32)470').GetName], nuestro liderazgo decidió abrazar plenamente los ejércitos mercenarios. [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] fue la voz persuasiva que convenció a los elementos conservadores de abrir las arcas e invitar a los veteranos de [GetProvince('(int32)421').GetArea.GetRegion.GetName] a unirse a nuestras filas. Ordenando que el anuncio se difunda, tardará unos meses, pero creemos que pronto tendremos abundantes guerreros en nuestros campos de entrenamiento."
 me_greek_7_korkyra_3.a:0 "Enviaremos pregoneros a todas las capitales y pintores marcarán las paredes de las ágoras"
 me_greek_7_korkyra_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_3$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_4_title:0 "$greek_7_korkyra_task_4$"
 me_greek_7_korkyra_4_desc:0 "Los últimos meses han sido estresantes y costosos, una combinación que ha puesto de mal humor a [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], pero finalmente hemos logrado lo que nos propusimos y nuestras fuerzas están entrenadas y en alerta. Al mejorar nuestras capacidades ofensivas y defensivas mientras reforzamos la infraestructura de la capital, por fin estamos listos para mirar más allá de la ciudad, si así lo decidimos..."
 me_greek_7_korkyra_4.a:0 "¡Ay del agresor que intente escalar nuestras murallas!"
 me_greek_7_korkyra_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_4$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_5_title:0 "$greek_7_korkyra_task_5$"
 me_greek_7_korkyra_5_desc:0 "Desde que el hombre se reúne alrededor del fuego para contar historias, los poetas han cantado sobre nuestro hogar, [GetProvince('(int32)470').GetName], pues vivimos en una tierra bendecida donde incluso los dioses deambulan de vez en cuando. Se dice que Poseidón trajo a una ninfa, Korkya, a nuestro hogar, y nuestro pueblo nunca ha olvidado sus orígenes, recordándolos con oraciones de agradecimiento.\n\nPor nuestra piedad, es justo que se erija un santuario dentro de nuestras murallas para que la gente pueda ofrecer sacrificios."
 me_greek_7_korkyra_5.a:0 "Nos uniremos a las ofrendas matinales y pediremos bendiciones"
 me_greek_7_korkyra_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_5$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_6_title:0 "$greek_7_korkyra_task_6$"
 me_greek_7_korkyra_6_desc:0 "Las montañas del Pindo son una fortificación natural que nos protege de los ejércitos del Este, una pequeña bendición por la que estamos agradecidos. Sin embargo, si no controlamos los pasos montañosos, corremos un grave riesgo. Consciente de lo delicada que es nuestra seguridad, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ha impulsado la preparación de reclamaciones sobre la provincia de [GetProvince('(int32)459').GetArea.GetName]; no solo deseamos los puertos de la costa del Sinus Patraicus, sino que no podemos permitir acceso sin trabas a través de las montañas."
 me_greek_7_korkyra_6.a:0 "Solo buscamos asegurar nuestras fronteras naturales"
 me_greek_7_korkyra_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_6$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_7_title:0 "$greek_7_korkyra_task_7$"
 me_greek_7_korkyra_7_desc:0 "Algunos consideran nuestra historia una nota al pie en la gran historia de [GetProvince('(int32)419').GetArea.GetName], viendo nuestra isla como un apéndice o dote intercambiada entre nobles lejanos, pero rechazamos categóricamente esa narrativa. Conscientes de que los epirotas son fieros y belicosos, no reclamamos sus tierras a la ligera, pero no permitiremos que el enemigo escriba nuestro futuro."
 me_greek_7_korkyra_7.a:0 "Marchamos hacia la gloria o la destrucción; que los dioses nos acompañen!"
 me_greek_7_korkyra_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_7$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_8_title:0 "$greek_7_korkyra_task_8$"
 me_greek_7_korkyra_8_desc:0 "Nuestros espías informan que el tirano de [GetProvince('(int32)84').GetArea.GetName] observa nuestros progresos y, viendo un premio rico, habla abiertamente de invadirnos cuando el mar lo permita. Lo insultante es que los siracusanos no ocultan sus planes; ¿seremos tan impotentes como para permitir que alguien trama nuestra ruina? Creyendo que la sorpresa será una ventaja, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ha jurado hacer que el agresor se trague sus palabras..."
 me_greek_7_korkyra_8.a:0 "El aspirante a agresor pronto tendrá que proteger sus propias murallas"
 me_greek_7_korkyra_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_8$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_9_title:0 "$greek_7_korkyra_task_9$"
 me_greek_7_korkyra_9_desc:0 "Aunque no solemos compararnos con otros, y creemos seguir nuestro propio camino, no podemos ignorar el tamaño de nuestro ejército frente a potencias vecinas. Tras depender de mercenarios durante mucho tiempo, hoy nos complace informar que nuestras propias levas han alcanzado un tamaño respetable."
 me_greek_7_korkyra_9.a:0 "Podemos trabajar con un ejército así"
 me_greek_7_korkyra_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_9$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_10_title:0 "$greek_7_korkyra_task_10$"
 me_greek_7_korkyra_10_desc:0 "Inspirados por el sabueso molosio, el perro guardián feroz sin igual, hemos comenzado a adiestrar a estos animales para que luchen junto a nuestros soldados. No solo vigilan campamentos y palacios, sino que marchan con nuestras tropas, elevando la moral en terrenos difíciles. Y cuando suena la orden de batalla, nuestros perros cargan, su aullido y gruñido resultan aterradores.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], que no deja pasar una oportunidad, incluso ha adoptado un perro como mascota. Llamado Hierax, o 'Halcón', el mastín gigante se ha convertido en una suerte de mascota en los campamentos, siguiendo a su amo y siendo querido por la tropa."
 me_greek_7_korkyra_10.a:0 "¿Quién es buen chico?"
 me_greek_7_korkyra_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_10$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_11_title:0 "$greek_7_korkyra_task_11$"
 me_greek_7_korkyra_11_desc:0 "Los miembros de la tribu taulantiana que viven en las montañas de [GetProvince('(int32)415').GetArea.GetName] no son extraños para nuestro pueblo; alternativamente hemos intercambiado bienes económicos y lanzamos con ellos, una danza que hemos llegado a conocer muy bien. Decidiendo que ya es suficiente, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], al enterarse de que los taulantianos están buscando hacer una alianza con cualquiera en [GetProvince('(int32)415').GetArea.GetRegion.GetName] dispuesto a enfrentarse a nosotros, ha dado la orden de que se preparen las reclamaciones."
 me_greek_7_korkyra_11.a:0 "No podemos quedarnos de brazos cruzados mientras nuestros enemigos sueñan conspiraciones"
 me_greek_7_korkyra_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_11$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_12_title:0 "$greek_7_korkyra_task_12$"
 me_greek_7_korkyra_12_desc:0 "Ha habido numerosas ocasiones en la memoria reciente en las que [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] se ha visto obligado a declarar una guerra preventiva para asegurar la paz; una situación terrible para un líder concienzudo, particularmente uno que no tiene grandes deseos de ver morir a los soldados de [GetProvince('(int32)470').GetName] en guerras sin sentido. Desafortunadamente para [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] tiene que tomar una decisión difícil; Parece que los espartanos quieren apoderarse de nuestra isla y han comenzado a preparar una fuerza invasora. Haremos que los lacedemonios se arrepientan de haberse alejado del Peloponeso."
 me_greek_7_korkyra_12.a:0 "¡Los escudos de Esparta llevarán a sus hijos a Hades!"
 me_greek_7_korkyra_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_12$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_13_title:0 "$greek_7_korkyra_task_13$"
 me_greek_7_korkyra_13_desc:0 "Finalmente, los siracusanos han enviado lo que les arrancamos en nuestras últimas guerras; no solo han accedido a pagar una indemnización de guerra, que aliviará los costes, sino que hemos exigido algo más valioso que el oro. Conscientes de que [GetProvince('(int32)84').GetArea.GetName] alberga científicos y sabios, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] ha exigido copias de todos los textos de sus bibliotecas. No se consideró insignificante ningún documento: tratados, planos arquitectónicos, libros de cocina reales y correspondencia personal.\n\nNuestros bibliotecarios tendrán trabajo, y lo esperan con entusiasmo."
 me_greek_7_korkyra_13.a:0 "Tengo curiosidad por los escritos de Arquímedes de los que todos hablan..."
 me_greek_7_korkyra_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_13$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_14_title:0 "$greek_7_korkyra_task_14$"
 me_greek_7_korkyra_14_desc:0 "Aunque nuestros ojos y oídos en [GetProvince('(int32)470').GetName] informan todo tipo de chismes a las autoridades, la siguiente historia ha estado en boca de todos y finalmente ha captado la atención personal de [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. Parece que, sólo un par de meses después de que se completara el santuario [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] que había ordenado construir en Korkyra, un dios misterioso llegaría con las mareas de la mañana, inundando el lugar sagrado cuando entraba al santuario, solo para salir unas horas más tarde. Nuestros sacerdotes han estado proclamando que esto es un milagro y han invitado a [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] a venir personalmente al sacrificio, con la esperanza de presenciar el espectáculo divino que muchos creen que está relacionado con los antiguos fecios que una vez vivieron aquí.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] llegó una mañana con [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] séquito, trayendo una ofrenda del mejor incienso que el dinero puede comprar. Al entrar al lugar sagrado, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] encendió el incienso, enviando el dulce humo hacia el cielo y cayó de rodillas [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]. A medida que la fragancia de la mirra llenaba el santuario, el agua comenzó a entrar en el templo, cubriendo a todos con espuma de mar. El sol se oscureció en el firmamento, y una voz fantasmal suspiró fuerte y profundamente cuando apareció una presencia brillante, llenando de terror a todos los presentes.\n\nPero, tan pronto como comenzó la conmoción, todo volvió a cambiar con la misma rapidez; la sombra desapareció, las aguas de la inundación retrocedieron y el cielo se llenó nuevamente de luz del sol y cantos de pájaros. Dirigiéndose a un consejero, con el rostro pálido como una sábana, fue entonces cuando [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] notó el regalo en el altar..."
 me_greek_7_korkyra_14.a:0 "¿Qué demonios puede ser esto?"
 me_greek_7_korkyra_14_tooltip:0 "El #Y Timón de Alcinous#! se ha añadido a tu inventario. $mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_14$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_15_title:0 "$greek_7_korkyra_task_15$"
 me_greek_7_korkyra_15_desc:0 "Aunque los primeros colonos de [GetProvince('(int32)470').GetName] procedían de [GetProvince('(int32)418').GetName], no hay amor entre nosotros y nuestros progenitores. Aunque ocurrió hace más de un siglo, el Incidente de Epidamno aún escuece a quienes lo recuerdan, y a veces se oye en Korkyra a un orador lanzando invectivas contra Corinto, clamando que nuestro honor exige castigar a la ciudad madre militarmente.\n\nAunque [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] considera esas ansias revanchistas una distracción, hay beneficio político en abrazar esas reclamaciones, y así la meta de conquistar Korinthos se convierte en política oficial."
 me_greek_7_korkyra_15.a:0 "Que nuestra 'Madre' sepa que estudiamos la leyenda de Orestes con deleite..."
 me_greek_7_korkyra_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_15$#!' $mission_completed_tooltip_2$"
 
 me_greek_7_korkyra_16_title:0 "$greek_7_korkyra_task_16$"
 me_greek_7_korkyra_16_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], hemos finalizado los planes para invadir Italia y preparado las reclamaciones necesarias. Nuestras tropas están entusiasmadas por la oportunidad de enriquecerse en las ciudades y villas de [GetProvince('(int32)64').GetArea.GetName] y no les culpamos: parece una tierra rica que llenará nuestras arcas."
 me_greek_7_korkyra_16.a:0 "No le tememos a nadie en Italia..."
 me_greek_7_korkyra_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $greek_7_korkyra_task_16$#!' $mission_completed_tooltip_2$"


###Kleonymos in Korkyra
kleonymos_korkyra_event.1.t:0 "Kleonymos en Korkyra"
kleonymos_korkyra_event.1.desc:0 "Parece que mientras #E [GetCharacter('(int32)176').GetPraenomen]#! hacía campaña contra los italianos, la isla de [GetProvince('(int32)470').GetName] se le escapó de las manos. Ahora que #E [GetCharacter('(int32)176').GetPraenomen]#! ha tenido tiempo de reorganizar a sus hombres, partirá para reconquistar la isla y restaurar su kleos perdido.\n\nCon #E [GetCharacter('(int32)176').GetPraenomen]#! y sus tropas abandonan las tierras de #E [GetCountry('SPA').GetName]#!, en Al menos por el momento, #E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] #! estará libre de cualquier amenaza causada por la influencia maliciosa del pretendiente, pero uno debe preguntarse qué sucederá si #E [GetCharacter('(int32)176').GetPraenomen] #! realmente tenga éxito..."
kleonymos_korkyra_event.1.a:0 "Esperemos que no vuelva."
kleonymos_korkyra_event.1_tt:0 "#E [GetCharacter('(int32)176').GetPraenomen]#! intentará conquistar #E Korkyra#!"

kleonymos_korkyra_event.2.t:0 "Llegada del ejército de Kleonymos"
kleonymos_korkyra_event.2.desc:0 "En 303 a. C., el príncipe espartano, #E [GetCharacter('(int32)176').GetPraenomen]#! de #E Esparta#! llegó a las costas de [GetProvince('(int32)470').GetName], conquistó fácilmente la isla y estableció una tiranía allí. #E [GetCharacter('(int32)176').GetPraenomen]#! abandonó [GetProvince('(int32)470').GetName] con la esperanza de encontrar mayores riquezas y gloria en Italia, pero sus campañas dieron poco resultado y perdió el control de la isla. Parece que ahora el príncipe de las ambiciones tiene la intención de retomar [GetProvince('(int32)470').GetName], sin importar el costo.\n\nDebemos preparar nuestros ejércitos y aplastar las fuerzas de Cleonymos, no sea que el tirano convierta nuestra isla en cenizas..."
kleonymos_korkyra_event.2.a:0 "¡Kleonymos lamentará haber puesto un pie en [GetProvince('(int32)470').GetName]!"
kleonymos_korkyra_event.2_tt:0 "Tendremos #Y 1#! #E Año#! para derrotar al ejército de #E [GetCharacter('(int32)176').GetPraenomen]#! antes de negociar con él."

kleonymos_korkyra_event.3.t:0 "La derrota de Kleonymos"
kleonymos_korkyra_event.3.desc:0 "Nuestras fuerzas han derrotado a los ejércitos del traidor #E [GetCharacter('(int32)176').GetPraenomen]#!!\nLa mayoría de sus barcos han sido hundidos y las tropas restantes dispersadas. #E [GetCharacter('(int32)176').GetPraenomen]#! ha huido de regreso a #E Esparta#!, poco probable que vuelva.\n\nAunque [GetProvince('(int32)470').GetName] sufrió saqueos, nuestra derrota del ejército espartano es una gran victoria para [ROOT.GetCountry.GetName]."
kleonymos_korkyra_event.3.a:0 "¡Que Kleonymos sea maldito por la eternidad!"

kleonymos_korkyra_event.4.t:0 "Victoria de Kleonymos"
kleonymos_korkyra_event.4.desc:0 "A pesar de nuestros esfuerzos, #E [GetCharacter('(int32)176').GetPraenomen]#! ha tomado #E [GetProvince('(int32)470').GetName]#! y ha quemado la antigua colonia #E Corintia#! hasta los cimientos; nuestros ejércitos no han podido recuperar la ciudad.\n\nLo que ocurra dependerá de los términos que acordemos con el terrible príncipe; cualquier resultado traerá grandes pérdidas a [SCOPE.GetRootScope.GetCountry.GetName]."
kleonymos_korkyra_event.4.a:0 "Démosle a Kleonymos la riqueza que desea."
kleonymos_korkyra_event.4.b:0 "¡Salve, rey Cleonimos!"

kleonymos_korkyra_event.5.t:0 "Kleonymos sufre derrota en Korkyra"
kleonymos_korkyra_event.5.desc:0 "#E [GetCharacter('(int32)176').GetPraenomen]#! parece haber sufrido una derrota total en #E [GetProvince('(int32)470').GetName]#!, habiendo perdido la mayoría de sus fuerzas tratando de tomar la ciudad-isla.\n\nAhora, ha regresado a #E Esparta#! con el rabo entre las piernas, sin perspectivas de montar jamás una expedición así. Otra vez. Aunque seguirá siendo un actor relevante en la política espartana, esta derrota final manchará para siempre su imagen entre el resto de la población espartana."
kleonymos_korkyra_event.5.a:0 "Un final vergonzoso para la expedición."

kleonymos_korkyra_event.6.t:0 "Kleonymos muerto en Korkyra"
kleonymos_korkyra_event.6.desc:0 "Parece que #E [GetCharacter('(int32)176').GetPraenomen]#! fue asesinado en batalla durante su expedición para retomar [GetProvince('(int32)470').GetName].\n\nCon la mayor parte de sus fuerzas destruidas, no está claro cómo recibió el golpe final; solo sabemos que ni él ni sus soldados volverán a #E $SPA$#!, lo que supone un gran alivio para nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle] #E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#!."
kleonymos_korkyra_event.6.a:0 "Un final violento para un hombre violento."

kleonymos_korkyra_event.7.t:0 "¡Kleonymos Regresa a Casa en Gloria!"
kleonymos_korkyra_event.7.desc:0 "#E [GetCharacter('(int32)176').GetPraenomen]#! ha regresado de su expedición para retomar la isla de [GetProvince('(int32)470').GetName], trayendo oro y gloria, para consternación de nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle] #E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#!.\n\nHabiendo saqueado #E [GetProvince('(int32)470').GetName]#! y puso la isla de rodillas, ha extraído cantidades exorbitantes de tributo de la antigua #E colonia corintia#! y ha regresado a [ROOT.GetCountry.GetName] con su nueva fortuna. Ya era un peligroso pretendiente contra [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen], pero su repentino aumento de popularidad entre la élite espartana, junto con su riqueza, lo convierte ahora en uno de los principales actores de la política espartana y en una amenaza inminente para nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle]."
kleonymos_korkyra_event.7.a:0 "Esto ciertamente complica las cosas..."

kleonymos_korkyra_event.8.t:0 "Tirano de Korkyra"
kleonymos_korkyra_event.8.desc:0 "#E [GetCharacter('(int32)176').GetPraenomen]'#! La expedición para retomar la isla de [GetProvince('(int32)470').GetName] ha dado grandes resultados tanto para él como para #E [GetCountry('SPA').GetName]#! en su conjunto.\n\nHabiendo aplastado las fuerzas de la antigua #E colonia corintia#!, ha declarado él mismo #E [GetCharacter('(int32)176').GetCountry.GetRulerTitle]#! de #E Korykra#!, y ha jurado lealtad a [GetCountry('SPA').GetRuler.GetName], a cambio de colonos.\nEste es un desarrollo muy favorable para nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle] #E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#!, porque además de promover [GetCountry('SPA').GetAdjective] intereses en la región, el exilio autoimpuesto de [GetCharacter('(int32)176').GetPraenomen] a [GetProvince('(int32)470').GetName] también beneficia a nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle] al eliminar a un pretendiente peligroso de la política espartana."
kleonymos_korkyra_event.8.a:0 "¡Damos la bienvenida a nuestra nueva colonia espartana!"

#9 is used to check success
