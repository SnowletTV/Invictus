l_spanish:
 
 ####################
 # Title
 ####################
 gymnaesian_mission_01:0 "Los Baleares"
 gymnaesian_mission_01_BUTTON_TOOLTIP:0 "Nuestros enemigos ignoran nuestra existencia a su propio riesgo..."
 gymnaesian_mission_01_BUTTON_DETAILS:0 ""
 gymnaesian_mission_01_DESCRIPTION:0 "Los Baleares, las islas que nuestro pueblo llama hogar, están lejos de las perturbaciones y guerras que devastan el Mediterráneo Oriental; ocasionalmente, escuchamos noticias de estos incendios por los comerciantes que pasan, y agradecemos a los dioses que estos desastres han evitado nuestra tierra hasta ahora. Aunque nuestras islas se ven como un rincón tranquilo, difícilmente digno de mención, eso no significa que no albergamos ambiciones propias."
 gymnaesian_mission_01_CRITERIA_DESCRIPTION:0 "La misión se considerará completa una vez que los habitantes de los Baleares creen una hegemonía naval sobre las islas cercanas."
 gymnaesian_mission_01_REWARD_DESCRIPTION:0 ""
 
 
 ####################
 # Mission Tasks
 ####################
 
 gymnaesian_mission_01_task_01:0 "La Corona Balearide"
 gymnaesian_mission_01_task_01_DESC:0 "Nosotros, como pueblo, hemos recorrido un largo camino y este cambio en nuestros asuntos estaría mejor representado por un cambio de gobierno. En lugar de ser gobernado por magistrados, nuestro pueblo desea un Rey. \n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 
 gymnaesian_mission_01_task_02:0 "El Primer Paso"
 gymnaesian_mission_01_task_02_DESC:0 "Hemos descubierto una pequeña isla al oeste de nuestra capital, [GetProvince('(int32)1464').GetName], que parece ser vasalla de alguna nación más grande. Quizás mientras su señor supremo está ocupado con la guerra, podamos anexar rápidamente sus tierras... \n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 
 gymnaesian_mission_01_task_03:0 "La Conquista de Ibasim"
 gymnaesian_mission_01_task_03_DESC:0 "Hemos recibido informes de que [GetProvince('(int32)3256').GetArea.GetName] está ahora involucrado en una guerra. ¡Debemos actuar rápidamente mientras sus ejércitos están ocupados! Necesitamos todas las ventajas que podamos conseguir. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil21!"
 
 gymnaesian_mission_01_task_04:0 "La Armada de Gymnaesia"
 gymnaesian_mission_01_task_04_DESC:0 "Habiendo visto los beneficios de poseer una poderosa flota de barcos, también debemos expandir nuestra armada si esperamos desembarcar con éxito nuestras tropas en tierras enemigas. Además, la ampliación de nuestra capacidad naval generará beneficios cívicos, por lo que hay una razón más para empezar. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 gymnaesian_mission_01_task_04_tt:0 "Tener una marina de al menos 12 barcos"
 
 gymnaesian_mission_01_task_05:0 "La Ciudad de Palma"
 gymnaesian_mission_01_task_05_DESC:0 "Si bien estamos ciertamente orgullosos de nuestra capital [GetProvince('(int32)1465').GetName], sabiendo que nuestros antepasados eligieron sabiamente al construir las primeras viviendas, deberíamos considerar la posibilidad de mejorar nuestra infraestructura. Afortunadamente, hay muchos estilos arquitectónicos con los que estamos familiarizados; reemplacemos nuestras estructuras de madera con algo más permanente. \n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 
 gymnaesian_mission_01_task_06:0 "Expedición al Este"
 gymnaesian_mission_01_task_06_DESC:0 "Preparad a nuestros colonos; Los enviaremos a [GetProvince('(int32)3515').GetArea.GetName], con la esperanza de establecer una nueva vida para ellos y nuestra gente. ¡Qué valiente es nuestro pueblo al dejar la seguridad de nuestro hogar hacia costas lejanas! \n\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 
 gymnaesian_mission_01_task_07:0 "La Vida de Pirata"
 gymnaesian_mission_01_task_07_DESC:0 "No es deshonroso tomar cosas por la fuerza; Después de todo, el poder hace lo correcto. Ahora que tenemos una gran armada y un comandante competente, podemos comenzar a atacar a nuestros vecinos. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 gymnaesian_mission_01_task_07_tt:0 "Tener una marina de al menos 35 barcos y un comandante con un nivel de marcial de al menos 10."
 gymnaesian_mission_01_task_07_tt_a:0 "#Y ¡Habilidad de Rapiña de Esclavos#! será habilitada."
 
 gymnaesian_mission_01_task_08:0 "La Ciudad de Ibasim"
 gymnaesian_mission_01_task_08_DESC:0 "Después de la conquista de [GetProvince('(int32)1464').GetName] al poder local púnico, debemos reconstruir esta isla y mejorar la infraestructura para integrar más rápidamente a nuestra nueva población. Tenemos una gran visión para la ciudad de Ibasim... \n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 
 gymnaesian_mission_01_task_09:0 "Expansión en Córcega"
 gymnaesian_mission_01_task_09_DESC:0 "La totalidad de la isla de [GetProvince('(int32)3515').GetArea.GetName] hacia nuestro este sería una adición increíble a nuestro dominio; es mucho más grande que nuestra patria, con abundantes recursos naturales que deseamos mucho. Incluso hay ciudades allí, como [GetProvince('(int32)3515').GetName], que algún día pronto poseeremos. \n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 
 gymnaesian_mission_01_task_10:0 "Abrazando la Piratería"
 gymnaesian_mission_01_task_10_DESC:0 "Durante mucho tiempo, los Piratas de [GetProvince('(int32)1469').GetName] han asaltado el Mare Sardoum con impunidad; nadie ha estado a salvo de estos corsarios, ni siquiera nuestra propia gente. Y sin embargo... ¿tal vez en lugar de expulsarlos de la isla, podríamos abrazarlos? Estos piratas son gente muy conocedora, han ejercido su comercio en la región durante mucho tiempo y definitivamente podrían enseñarnos un par de cosas. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 
 gymnaesian_mission_01_task_11:0 "Paraíso Insular"
 gymnaesian_mission_01_task_11_DESC:0 "Es ampliamente reconocido que nuestros países de origen se encuentran entre los lugares más bellos que uno puede esperar ver; Realmente vivimos en una isla paradisíaca. Sería beneficioso para nosotros mejorar nuestras propiedades en las islas; Si aumentamos la cantidad de edificios, estamos plenamente seguros de que nuestra reputación seguirá creciendo. \n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 
 gymnaesian_mission_01_task_12:0 "Consolidación de Córcega"
 gymnaesian_mission_01_task_12_DESC:0 "Ahora que hemos colonizado todo lo que podemos en [GetProvince('(int32)3515').GetArea.GetName], deberíamos considerar la posibilidad de conquistar los territorios restantes de [GetProvince('(int32)3504').GetArea.GetName]. Pero estas tierras están en disputa acalorada entre potencias fuertes, lo que complica nuestros planes. Nadie dijo que esto sería una tarea sencilla, pero los augurios hablan favorablemente... \n\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 
 gymnaesian_mission_01_task_13:0 "Puertos Fortificados"
 gymnaesian_mission_01_task_13_DESC:0 "Ahora que hemos anexado estas ciudades, sería inteligente fortificar estos puertos para que puedan actuar como un buen baluarte contra nuestros enemigos, que se vuelven celosos de nuestros éxitos y esperan arrebatarnos nuestras victorias. \n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 
 gymnaesian_mission_01_task_14:0 "Victoria en Cerdeña"
 gymnaesian_mission_01_task_14_DESC:0 "Ahora que hemos ejercido control sobre la isla de [GetProvince('(int32)3515').GetArea.GetName] y terminado de eliminar la resistencia en [GetProvince('(int32)3483').GetArea.GetName], miramos con ojos hambrientos como un pescador con sus redes, recorriendo los mares y buscando nuestras próximas conquistas. ¡Sólo los dioses saben hacia dónde navegaremos a continuación! \n\n\n\n\n\n\n\n\n\n\n@egypt_mil18!"
 
 gymnaesian_mission_01_task_15:0 "Exceso de Madera"
 gymnaesian_mission_01_task_15_DESC:0 "Podemos proyectar nuestro poder en el extranjero gracias a nuestras flotas, lo que hace que tener suministro de madera sea una de nuestras necesidades más cruciales. Nuestro futuro exige que importemos suficiente madera para asegurar un suministro constante para nuestra marina. \n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 gymnaesian_mission_01_task_15_tt:0 "La Provincia de Balearides necesita importar al menos 1 Madera y 1 Cedro."
 
 gymnaesian_mission_01_task_16:0 "Ejercer Nuestra Influencia"
 gymnaesian_mission_01_task_16_DESC:0 "Desde nuestro punto de vista en [ROOT.GetCountry.GetCapital.GetName], vemos un mundo que necesita y clama desesperadamente por nuestra influencia. Hagamos lo que sea necesario para crear una metrópolis insular que sea un faro de todas las cosas [ROOT.GetCountry.GetAdjective]. \n\n\n\n\n\n\n\n\n\n\n@event_pic12!"
 
 gymnaesian_mission_01_task_17:0 "Panera del Mediterráneo"
 gymnaesian_mission_01_task_17_DESC:0 "Aunque tenemos la suerte de contar con campos fértiles en [GetProvince('(int32)1466').GetName], las tierras de cultivo de nuestra isla natal no proporcionarán lo suficiente para alimentar a todas las bocas; debemos tomar medidas para desarrollar parte de la agricultura en nuestras posesiones de ultramar. \n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 
 ####################
 # Events
 ####################
 
 
 me_gymnaesian_1_title:0 "La Corona Balearide"
 me_gymnaesian_1_desc:0 "El día finalmente ha llegado, uno que parecía tan lejano y distante que podría haberse confundido con un sueño; la ascensión de nuestro monarca, [ROOT.GetCountry.GetRuler.GetName], como el nuevo gobernante del glorioso Reino de Balearides. Después de incontables años siendo una tribu federada, se ha decidido recompensar a [ROOT.GetCountry.GetRuler.GetFirstName], quien es el más responsable de nuestro estado actual, con la corona. Ya no seremos gobernados por consejos de magistrados y ancianos, sino que finalmente tendremos un verdadero soberano que nos guiará.\n\nNo se escatimó ningún gasto para la ceremonia de coronación, ya que los mejores vinos y alimentos de lujo fueron importados desde el extranjero, complementando los platos tradicionales de nuestro pueblo. Llevado en una litera de plata y marfil, [ROOT.GetCountry.GetRuler.GetFirstName] fue desfilado por las calles de [ROOT.GetCountry.GetCapital.GetName], lanzando regalos de monedas de oro a las multitudes reunidas que esperaban ver el desfile real. La fiesta y la celebración durarán bien entrada la noche, quizás incluso hasta las primeras horas de la mañana. ¡Un día que será recordado para siempre por nuestros compatriotas!"
 me_gymnaesian_1.a:0 "¡Larga vida a [ROOT.GetCountry.GetRuler.GetName]!"
 
 me_gymnaesian_2_title:0 "Los Primeros Pasos"
 me_gymnaesian_2_desc:0 "Hemos descubierto una pequeña isla vasalla al oeste de nuestra capital; no tenemos idea de cuánto tiempo han sido siervos, pero esto no nos importa. Sin embargo, estamos ciertamente más cerca de ellos que sus señores, lo que nos da una ventaja; si atacamos en el momento estratégico, podemos anexarlos rápidamente antes de que su Maestro se dé cuenta."
 me_gymnaesian_2.a:0 "Convoca a los Líderes Tribales"
 
 me_gymnaesian_3_title:0 "La Conquista Inicial"
 me_gymnaesian_3_desc:0 "Después de deliberaciones solemnes, en las que se levantaron muchas discusiones acaloradas, los líderes tribales han tomado una decisión y no hay vuelta atrás. Aunque los Ancianos estaban igualmente divididos en sus opiniones, fue [ROOT.GetCountry.GetRuler.GetName] quien emitió el voto decisivo, argumentando elocuentemente en nombre de lo que debe hacerse. Es el miedo lo que guía nuestras manos, pues vemos cómo nuestros vecinos son esclavos de un poder distante, y no deseamos convertirnos en siervos de algún señor extranjero. Para proteger nuestro futuro, debemos expulsar a estos enemigos, no sea que seamos los siguientes en caer.\n\nEl elemento sorpresa será nuestro mayor aliado. Atacaremos a nuestros vecinos insulares una vez que su señor esté involucrado en una guerra."
 me_gymnaesian_3.a:0 "¡Debemos prepararnos!"
 
 me_gymnaesian_4_title:0 "Se Acerca el Momento"
 me_gymnaesian_4_desc:0 "Parece que los cartagineses se han involucrado en una guerra. Si podemos atacar ahora mientras están ocupados, esperamos anexar su vasallo antes de que se den cuenta. Aunque estamos ansiosos por hacer un movimiento tan audaz, especialmente cuando consideramos las posibles implicaciones de enfurecer a Cartago, esta podría ser nuestra única oportunidad."
 me_gymnaesian_4.a:0 "Atacaremos en un mes"
 
 me_gymnaesian_5_title:0 "La Conquista de Ibasim"
 me_gymnaesian_5_desc:0 "Después de semanas de nerviosa preparación, todo está listo. Hemos preparado nuestras tropas tribales, que han estado practicando sus formaciones de batalla diariamente, y hemos preparado nuestra flota lo mejor posible. Incluso ahora, nuestros barcos están siendo llenos de provisiones como alimentos, y solo es cuestión de tiempo antes de que [ROOT.GetCountry.GetRuler.GetName] dé la orden de que la flota zarpe.\n\nPrepárate, porque el momento de atacar es ahora. No enviaremos aviso previo a [GetProvince('(int32)3256').GetOwner.GetName], que estará demasiado distraído para acudir en su ayuda... pronto, todos sabrán lo que hemos hecho."
 me_gymnaesian_5.a:0 "¡A la guerra!"
 
 me_gymnaesian_6_title:0 "La Armada de Gymnaesia"
 me_gymnaesian_6_desc:0 "[ROOT.GetCountry.GetRuler.GetName], hemos recibido un informe de nuestros comandantes navales, uno que te agradará mucho. Parece que, debido a que hemos invertido tiempo y dinero en mejorar nuestras flotas, nuestros ingenieros han dominado algunas técnicas de construcción que podemos aplicar en todo nuestro reino. ¡Hoy es verdaderamente nuestro día de suerte!"
 me_gymnaesian_6.a:0 "No nos quejaremos de este giro de los acontecimientos"
 
 me_gymnaesian_7_title:0 "La Ciudad de Palma"
 me_gymnaesian_7_desc:0 "Las colinas de [GetProvince('(int32)1465').GetName] alguna vez fueron el hogar de chozas y chozas dispersas, pero los cobertizos y chozas de antaño que protegieron a nuestros antepasados de los elementos son ahora un recuerdo que se desvanece, una reliquia de una época en la que nuestros poderes aún estaban creciendo. Guiado por las visiones cívicas de [ROOT.GetCountry.GetRuler.GetName], que exigían que el coste no fuera una contraprestación para el cumplimiento de los planes [ROOT.GetCountry.GetRuler.GetHerHis], el asentamiento de Palma ha sido sustituido por una ciudad magnífica. No pasará mucho tiempo antes de que la gloria de nuestra capital recientemente mejorada sea conocida en todas partes."
 me_gymnaesian_7.a:0 "Palma es el lugar perfecto para una ciudad; bien hecho."
 
 me_gymnaesian_8_title:0 "Expedición al Este"
 me_gymnaesian_8_desc:0 "Ha llegado el momento de preparar a nuestros colonos para un viaje al Este, a la isla de Córcega. Nuestros exploradores informan que hay otros territorios ocupados en la isla, y aunque las costas orientales de la isla no están reclamadas, debemos tener cuidado de no sobrepasar los límites. No se necesita ser un genio militar para prever que podríamos tener que luchar para proteger a nuestros colonos, pero siempre defenderemos a los nuestros."
 me_gymnaesian_8.a:0 "Envíalos con nuestra bendición"
 
 me_gymnaesian_9_title:0 "¡Nuestra Colonia es Autosuficiente!"
 me_gymnaesian_9_desc:0 "A medida que se corrió la voz por las tierras de [ROOT.GetCountry.GetName] de que [ROOT.GetCountry.GetRuler.GetName] estaba planeando una invasión de la isla de #E Córcega#!, muchos de nuestros parientes viajaron a [ROOT.GetCountry.GetCapital.GetName] con la esperanza de sacar provecho de las guerras venideras. Es sabido en todas nuestras islas que en Córcega se pueden encontrar buenas tierras de cultivo, y muchos de nuestros hermanos arriesgarían sus vidas para reclamar un trozo de costa para ellos y sus parientes."
 me_gymnaesian_9.a:0 "¿Acaso había alguna duda de que triunfaríamos?"
 
 me_gymnaesian_10_title:0 "Incursiones Navales"
 me_gymnaesian_10_desc:0 "Es verdaderamente un día negro para nuestros vecinos, pues hemos recibido noticias de que nuestra armada es lo suficientemente grande como para comenzar a saquear puertos cercanos. Antes de mucho, todos nos temerán, ¡esperando nunca despertar al ver nuestros barcos de saqueo navegando en el horizonte! ¡Dile a los hombres que pueden llevarse todo lo que puedan cargar!"
 me_gymnaesian_10.a:0 "Levanta la bandera de los piratas..."
 me_gymnaesian_10_tt:0 "#Y Saqueo de Esclavos#! La habilidad será habilitada."
 
 me_gymnaesian_11_title:0 "Ibasim"
 me_gymnaesian_11_desc:0 "Aunque se han requerido costos considerables para construir [GetProvince('(int32)1464').GetName], finalmente hemos sido informados de que las iniciativas de construcción han llegado a su fin. Agradecidos más allá de las palabras por lo que hemos logrado, los lugareños están abrazando con entusiasmo nuestras costumbres, con la esperanza de convertirse en participantes a parte completa en nuestra cultura. Hay mucho que celebrar esta mañana, [ROOT.GetCountry.GetRuler.GetFirstName]."
 me_gymnaesian_11.a:0 "Los dioses cuidan de los suyos"
 
 me_gymnaesian_12_title:0 "Expansión en Córcega"
 me_gymnaesian_12_desc:0 "Te alegrará, [ROOT.GetCountry.GetRuler.GetName], saber que a nuestra gente que vive en #E Córcega#! le está yendo bastante bien. Incluso ahora, nuestros agricultores están trabajando la tierra, haciendo que los campos silvestres sean fructíferos de manera lenta pero segura, y los ingresos fiscales que envían a casa crecen cada temporada. No tenemos ninguna duda de que, dentro de unos años, nadie podrá distinguir entre nuestras nuevas colonias en el extranjero y nuestras ciudades establecidas en casa.\n\n#E Saona#! en particular está floreciendo, con su famoso #E 'Distrito Gymnaesian'#! siendo un segundo hogar para nuestra gente cuando visitan la isla. Quizás algún día tengas el placer de ver a Saone con tus propios ojos, mi [ROOT.GetCountry.GetRulerTitle]."
 me_gymnaesian_12.a:0 "Esto es excelente, pero deseamos la totalidad de Córcega..."
 
 me_gymnaesian_13_title:0 "Guardias Negros y Bandidos"
 me_gymnaesian_13_desc:0 "Recientemente hemos concluido nuestras negociaciones con los piratas que viven en la isla de [GetProvince('(int32)1469').GetName]. No nos tomó mucho convencerlos de la sabiduría de lo que estábamos proponiendo, ya que los piratas parecían demasiado ansiosos por aceptar nuestras propuestas diplomáticas. Ellos, sin duda, se dieron cuenta de que trabajar con nosotros es lo mejor para ellos, ya que tenemos mucho que aprender unos de otros."
 me_gymnaesian_13.a:0 "Es una vida de pirata para mí..."
 
 me_gymnaesian_14_title:0 "Un Paraíso Insular"
 me_gymnaesian_14_desc:0 "Algunas personas viven en cuevas en las montañas, azotadas por los crueles caprichos de la furia de la Naturaleza, y otras hacen sus hogares en el desierto, desesperadas por unas pocas gotas de agua. Sin embargo, nuestro pueblo vive en el paraíso; brisas suaves, aguas cálidas y una abundancia de alimentos son nuestros compañeros constantes. Importamos los mejores bienes de todo el mundo, y los viajeros de lejos vienen a nuestros puertos para maravillarse de lo que hemos logrado."
 me_gymnaesian_14.a:0 "No hay lugar en el que preferiríamos estar que en casa"
 
 me_gymnaesian_15_title:0 "Puertos Fortificados"
 me_gymnaesian_15_desc:0 "Nuestras flotas son la fuente de nuestra fuerza; quitar nuestras flotas sería quitar nuestro poder. Dándose cuenta de que la clave de nuestro éxito radica en tener suficiente poder naval, [ROOT.GetCountry.GetRuler.GetName] decretó que se abrieran las arcas y se renovara la infraestructura de nuestros puertos. No deseamos ser sorprendidos por nuestros enemigos, y asegurar nuestras vías fluviales garantizará que esta calamidad nunca ocurra. ¡Nuestros puertos fortalecidos se convertirán en la base para nuestra futura gloria!"
 me_gymnaesian_15.a:0 "¡Ay del enemigo que sueñe con tomar nuestros puertos!"
 
 me_gymnaesian_16_title:0 "Victorias en Cerdeña"
 me_gymnaesian_16_desc:0 "Cuando nos embarcamos por primera vez para someter la isla de Cerdeña, éramos conscientes de las posibilidades que nos esperaban, con la expansión de nuestras fronteras y nuevas oportunidades para el comercio siendo nuestros principales motivadores. Sin embargo, ¿quién podría haber previsto la riqueza que reuniríamos? El comercio ha explotado en [GetProvince('(int32)1465').GetName], ya que más y más impuestos y tributos regresan a nuestra capital. La riqueza de Cerdeña supera nuestras expectativas más codiciosas... tal vez haya otras islas que podríamos tomar."
 me_gymnaesian_16.a:0 "¡Exactamente como lo hemos planeado!"
 
 me_gymnaesian_17_title:0 "Una Abundancia de Madera"
 me_gymnaesian_17_desc:0 "Considerando la relativa importancia de nuestras flotas, es lamentable que tengamos una escasez de madera; nuestras islas simplemente no pueden cultivar suficientes árboles para abastecer a nuestros ocupados carpinteros de barcos. Afortunadamente, hemos asegurado un flujo constante de madera y cedro de aquellos que están bendecidos con un excedente; que estos lazos económicos crezcan en una amistad más grande."
 me_gymnaesian_17.a:0 "Nos complace saber que tenemos amigos en el extranjero"
 
 me_gymnaesian_18_title:0 "Ejercer Nuestra Influencia"
 me_gymnaesian_18_desc:0 "Aunque hay muchas civilizaciones extendidas por el #E Mediterráneo #!, nosotros los Gymnaesianos creemos verdaderamente que nuestra cultura ofrece algo que los otros países no tienen. Afortunadamente, ahora que hemos construido una magnífica ciudad en [GetProvince('(int32)1465').GetName], una que rivaliza con las capitales de los Reyes y Generales del Este, estamos listos para llevar la luz civilizadora de [ROOT.GetCountry.GetName] a los rincones del Mar."
 me_gymnaesian_18.a:0 "Lejos y cerca, extenderemos nuestras costumbres gymnaesianas"
 
 me_gymnaesian_19_title:0 "Cesto de Pan del Mediterráneo"
 me_gymnaesian_19_desc:0 "Los extranjeros que visitan nuestras explotaciones en [GetProvince('(int32)3497').GetArea.GetName] a menudo dicen que pueden oler el producto recién horneado de nuestros productivos [ROOT.GetCountry.GetAdjective] hornos incluso antes de poner un pie en nuestros puertos. Al ordenar que se construyan asentamientos agrícolas en toda Cerdeña, [ROOT.GetCountry.GetRuler.GetName] hemos asegurado que toda nuestra gente esté bien alimentada, lo que se ha ganado [ROOT.GetCountry.GetRuler.GetHerHim] el amor eterno de la gente común.\n\nLa próxima vez que estés en la zona, Viajero, te animamos a visitar nuestras panaderías y a probar un poco de pan tú mismo... descubrirás que es el mejor que jamás hayas tenido el placer de comer."
 me_gymnaesian_19.a:0 "Se me hace la boca agua solo de pensarlo..."
 
