 MACROBIAN_LEAGUE_ADJ:0 "macrobiano"
 erythraean_league_name:0 "Liga Eritrea"
 form_macrobian_league:0 "Proclamar la Liga Macrobiana"
 form_macrobian_league_desc:0 "Las ricas ciudades de los macrobianos, aclamadas en todas partes por la calidad de sus raros inciensos y sus deliciosas especias, se han consolidado en una liga comercial, una por una, por una potencia en ascenso en el #G Cuerno de África#!. La recién proclamada #Y Liga Macrobiana#! controla las importantes vías fluviales que fluyen de este a oeste y sus comerciantes se encuentran entre los más ricos de toda #G África#!."
 
 #Modifiers
 
 horn_of_africa_waaq_modifier:0 "Bendiciones de Waaq"
 desc_horn_of_africa_waaq_modifier:0 "Nuestro piadoso Gobernante ha buscado las bendiciones de Waaq, trayendo buena fortuna a todo nuestro país."
 waaq_thanksgiving_modifier:0 "Fiesta Irreecha"
 desc_waaq_thanksgiving_modifier:0 "La gente se ha reunido para agradecer a Waaq por los muchos regalos que nos ha otorgado."
 waaq_temple_modifier:0 "Fiestas Religiosas para el Gran Templo de Waaq"
 desc_waaq_temple_modifier:0 "Todos los fieles que viven dentro de nuestras fronteras están celebrando el magnífico templo que fue construido para Waaq."
 moundoun_harbor_modifier_waaq:0 "Puerto de Moundou"
