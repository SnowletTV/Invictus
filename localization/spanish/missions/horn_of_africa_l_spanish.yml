 #Events
 me_horn_of_africa_1_title:0 "$01_horn_of_africa_task_1$"
 me_horn_of_africa_1_desc:0 "El promontorio rocoso conocido coloquialmente como #E Cinnamon Horn#! ha sido durante mucho tiempo el hogar de ciudades-estado dispersas que hacen fortuna vendiendo especias @spices! a los barcos mercantes que pasan. Las autoridades gobernantes de estas ciudades no tienen nada mejor que hacer aparte de conspirar y planear y sus días están llenos de sueños de conquistar a sus vecinos, una hazaña que ninguna potencia macrobiana ha logrado todavía.\n\nLa preparación de reclamos en la costa es, por lo tanto, un hecho cotidiano, y cuando [ROOT.GetCountry.GetRuler.GetName] envió jinetes a #E Aromata#! y #E Zingis#! provincias con noticias de hostilidades inminentes, fueron prácticamente ignorados por la gente que vivía en las ciudades.\n\nCada temporada de campaña, el mismo drama se representaba; un ejército aparecería desde las colinas del desierto, acamparía fuera de las murallas y, en general, se convertiría en una molestia antes de escabullirse meses después con las manos vacías. ¿Por qué estas [ROOT.GetCountry.GetAdjective] afirmaciones deberían ser diferentes de las innumerables otras?"
 me_horn_of_africa_1.a:0 "No descansaré hasta haberme tomado el Cuerno de Canela para [ROOT.GetCountry.GetName]"
 me_horn_of_africa_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_1$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_2_title:0 "$01_horn_of_africa_task_2$"
 me_horn_of_africa_2_desc:0 "Durante muchos años, las ciudades costeras del #E Sinus Adenensis#! han mantenido su independencia unas de otras, y las grandes sumas de dinero que sus comerciantes ganan con la venta de mirra @myrrh! y piedras preciosas @gems! se han canalizado hacia la contratación de mercenarios y el entrenamiento de sus ejércitos. Las tensiones en la región han sido altas durante mucho tiempo, ya que las potencias que viven allí siempre están preparadas para defender sus posesiones hasta el último hombre, si es necesario.\n\nA pesar de las probabilidades en nuestra contra, los comandantes de nuestras tropas están reuniendo a nuestros guerreros y avivando su apetito de destrucción compartiendo historias de botín y esclavos que serán suyos para tomar. Aunque se perderán innumerables vidas en los próximos días, [ROOT.GetCountry.GetRuler.GetName] ha prometido liberar a los [ROOT.GetCountry.GetAdjective] soldados contra [ROOT.GetCountry.GetRuler.GetHerHis] enemigos; los [ROOT.GetCountry.GetRulerTitle] no se conformarán con nada más que el control total del área."
 me_horn_of_africa_2.a:0 "¡Los ejércitos de [ROOT.GetCountry.GetName] son imparables!"
 me_horn_of_africa_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_2$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_3_title:0 "$01_horn_of_africa_task_3$"
 me_horn_of_africa_3_desc:0 "El sol apenas había salido sobre las murallas de la ciudad cuando un golpe en la puerta de [ROOT.GetCountry.GetRuler.GetName] interrumpió el silencio de la mañana. Un guardia avergonzado se inclinó y explicó que un grupo de nobles de [GetProvince('(int32)7530').GetName] había enviado a uno de los suyos, un hombre llamado [SCOPE.sCharacter('socotran_greek_nobleman').GetName], para presentar un regalo al [ROOT.GetCountry.GetRulerTitle]. \n\n[ROOT.GetCountry.GetRuler.GetFirstName] no estaba contento de haber sido molestado tan temprano y no lo ocultó. —¿Visitas antes del desayuno? Una mano da mientras la otra intenta recibir; al final del día siempre es lo mismo.' murmuró [ROOT.GetCountry.GetRuler.GetFirstName] a nadie en particular. 'No tengo ninguna duda de que este regalo viene con condiciones. Muy bien, ¿qué es lo que quieres?'\n\nHaciendo una reverencia agradecida, [SCOPE.sCharacter('socotran_greek_nobleman').GetFirstName] se aclaró la garganta y dio un paso adelante. 'Permítame, si me lo permite, presentarle primero este #E Cetro#!, o [ROOT.GetCountry.GetRuler.GetFirstName].'\n\nMientras [ROOT.GetCountry.GetRuler.GetSheHe] examinaba el objeto, que estaba exquisitamente tallado en madera #E Sangre de dragón#! y grabado con gemas raras, [ROOT.GetCountry.GetRuler.GetFirstName] escuchó La interesante historia de [SCOPE.sCharacter('socotran_greek_nobleman').GetFirstName]. Su gente es descendiente de una colonia #E macedonia#! que se estableció en la isla hace años, pero su distrito de la ciudad necesitaba desesperadamente reparaciones: había grandes secciones de muros que se habían derrumbado y muchas casas tendrían que ser reconstruidas por completo."
 me_horn_of_africa_3.a:0 "Agradezca a los lugareños por el personal pero no les prometa nada."
 me_horn_of_africa_3.b:0 "Dale a los macedonios lo que han pedido."
 me_horn_of_africa_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_3$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_4_title:0 "$01_horn_of_africa_task_4$"
 me_horn_of_africa_4_desc:0 "Desde que [ROOT.GetCountry.GetRuler.GetSheHe] tiene memoria, [ROOT.GetCountry.GetRuler.GetName] siempre ha estado fascinado por los elefantes @warelephant!, y algunos de los primeros recuerdos de [ROOT.GetCountry.GetRulerTitle] implican ver a los gentiles gigantes trabajando en los campos fuera de [ROOT.GetCountry.GetCapital.GetName]. Al asumir el poder, la política estatal de [ROOT.GetCountry.GetName] se convirtió en mantener los mercados llenos de elefantes para la venta, un pequeño guiño a una obsesión infantil que [ROOT.GetCountry.GetRuler.GetFirstName] nunca olvidó del todo.\n\nCon el tiempo, las [ROOT.GetCountry.GetAdjective] ciudades se hicieron conocidas como el destino preeminente para la compra y venta de paquidermos, y comerciantes de todo el #E Mare Erythraeum#! viajaban a nuestros mercados con la esperanza de obtener ganancias. Un día, cuando un mercenario viajero del lejano oriente llegó a la capital con una legión de elefantes para vender, [ROOT.GetCountry.GetRuler.GetFirstName] no dudó ni regateó con el extranjero, sino que pagó la suma con alegría.\n\nSe intercambió oro y, mientras los elefantes eran descargados de sus barcos, [ROOT.GetCountry.GetRuler.GetFirstName] no pudo evitar notar la autoridad natural que exudaba su comandante, un hombre llamado [SCOPE.sCharacter('mahout_trainer').GetName]; Aquí estaba un verdadero maestro montando elefantes, y un pensamiento cruzó por la mente de [ROOT.GetCountry.GetRuler.GetFirstName]."
 me_horn_of_africa_4.a:0 "¡Dedicaremos estos elefantes al dios de la guerra [GetDeityDefinition('omen_nidar').GetName]!"
 me_horn_of_africa_4.b:0 "Contratar a Mattabhaya como mi tutor personal."
 me_horn_of_africa_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_4$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_5_title:0 "$01_horn_of_africa_task_5$"
 me_horn_of_africa_5_desc:0 "Las colinas y los desiertos de nuestra patria han ayudado durante mucho tiempo en la defensa de [ROOT.GetCountry.GetName], pero recientemente han ayudado a nuestros ejércitos en su entrenamiento; un nuevo desarrollo que ha tenido lugar bajo el liderazgo de [ROOT.GetCountry.GetRuler.GetName].\n\nDespués de muchos meses de difíciles maniobras realizadas bajo el duro sol en el árido terreno que rodea la capital, nuestros #E Elefantes de Guerra#! @elephants! han aprendido tácticas de batalla que los harán más letales que nunca."
 me_horn_of_africa_5.a:0 "¡Ay del ejército que se encuentre con mis elefantes en el desierto!"
 me_horn_of_africa_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_5$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_6_title:0 "$01_horn_of_africa_task_6$"
 me_horn_of_africa_6_desc:0 "El piadoso [ROOT.GetCountry.GetRuler.GetName] ha supervisado la construcción de un #E Gran Templo de#! [GetDeityDefinition('omen_waaq').GetName|E] en [GetProvince('(int32)7532').GetName]. Durante muchos años, los fieles waaqi han navegado hasta el puerto de Mosylon en peregrinación al lugar sagrado ubicado dentro de las murallas de la ciudad, pero [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] ha creído durante mucho tiempo que el Ser Supremo merecía una estructura que fuera más permanente.\n\nAhora que la construcción está completa, se ha llevado a cabo una ceremonia para consagrar los terrenos del templo y un espíritu de fervor religioso se ha apoderado de la gente."
 me_horn_of_africa_6.a:0 "Te honramos, oh Waaq, con este Gran Templo - ¡que te complazca!"
 me_horn_of_africa_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_6$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_7_title:0 "$01_horn_of_africa_task_7$"
 me_horn_of_africa_7_desc:0 "[GetProvince('(int32)7523').GetName], hogar de un notable santuario dedicado a [GetDeityDefinition('omen_wagar').GetName|E], ha sido durante mucho tiempo un destino importante para los barcos que navegan dentro y fuera del #E Mare Erythraeum#!, pero los esfuerzos de [ROOT.GetCountry.GetRuler.GetName] para invertir en su distrito portuario han convertido rápidamente a Moundou en la ciudad más importante para la marina [ROOT.GetCountry.GetAdjective].\n\nPara Para dar cabida a los cientos de comerciantes que ahora entran y salen del puerto de Moundou, se han construido carreteras a lo largo de la costa que conectan la ciudad con [GetProvince('(int32)7532').GetName]. Hay esperanzas de que la construcción de rutas para el comercio terrestre ayude a aliviar la presión ejercida sobre el puerto durante sus momentos de mayor actividad, pero aún está por verse si esto ayudará o no al tráfico y la congestión en las aguas de Moundou."
 me_horn_of_africa_7.a:0 "Es mi deber servir al pueblo de [ROOT.GetCountry.GetName]"
 me_horn_of_africa_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_7$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_8_title:0 "$01_horn_of_africa_task_8$"
 me_horn_of_africa_8_desc:0 "Cuando nuestros enviados llegaron a [GetCountry('BER').GetCapital.GetName], nuestros diplomáticos fueron tratados como reyes por los #E bereberes#! y no se repararon en gastos a la hora de festejar. Nuestros mensajeros tomaron esto como una señal de cosas buenas por venir, por lo que cuando se propuso que [GetCountry('BER').GetName] se convirtiera en un #E vasallo tribal#! de [ROOT.GetCountry.GetName], no hubo dudas por parte de los bereberes: aceptaron de inmediato."
 me_horn_of_africa_8.a:0 "Disfrutaremos de prosperidad y buenos momentos juntos, amigo mío."
 me_horn_of_africa_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_8$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_9_title:0 "$01_horn_of_africa_task_9$"
 me_horn_of_africa_9_desc:0 "Desde los primeros momentos del reinado de [ROOT.GetCountry.GetRuler.GetHerHis], [ROOT.GetCountry.GetRuler.GetName] juró que [GetDeityDefinition('omen_waaq').GetName|E] permanecería a la vanguardia de la vida [ROOT.GetCountry.GetAdjective], y el piadoso [ROOT.GetCountry.GetRulerTitle] tomó las medidas necesarias para garantizar que el #E Dador de lluvia#! fuera adorado dentro del panteón de [ROOT.GetCountry.GetName].\n\nEn En estos tiempos difíciles, el mundo se tambalea al borde del desastre y cosas que antes parecían imposibles se están convirtiendo en algo cotidiano, y es difícil discernir el mejor curso de acción. Sintiendo la carga de [ROOT.GetCountry.GetRuler.GetHerHis] responsabilidades, [ROOT.GetCountry.GetRuler.GetFirstName] creyó que Waaq protegería a nuestra gente en los días venideros, pero tendríamos que ser fieles a las costumbres antiguas."
 me_horn_of_africa_9.a:0 "¡Oh misterioso Waaq, trae la victoria a aquellos que te sirven!"
 me_horn_of_africa_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_9$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_10_title:0 "$01_horn_of_africa_task_10$"
 me_horn_of_africa_10_desc:0 "Ahora que las fuertes lluvias han terminado y los corazones aliviados de la gente se han vuelto hacia la alegría y la juerga, [ROOT.GetCountry.GetRuler.GetName] ha convocado una fiesta de acción de gracias, conocida por nuestro pueblo como #E 'Irreecha'#!, que será proclamada y celebrada en todo el reino.\n\nLos graneros de [ROOT.GetCountry.GetCapital.GetName] se han abierto a todos y son un verdadero océano. Del vino fluye por las calles de la capital - es como si las aguas del #E Mare Erythraeum#! hubieran inundado las plazas y plazas de la [ROOT.GetCountry.GetAdjective] ciudad. Las panaderías difícilmente pueden satisfacer las demandas que se les imponen, ya que cada día se entregan a las masas reunidas miles de hogazas de pan abundante y masa frita empapadas en un almíbar dulce.\n\nOrganizar eventos de este tipo ha hecho mella en las tesorerías y tiendas de alimentos de [ROOT.GetCountry.GetName], pero [ROOT.GetCountry.GetRuler.GetName] cree que todo vale la pena: [ROOT.GetCountry.GetRuler.GetSheHe] nunca ha visto a la gente. Más feliz."
 me_horn_of_africa_10.a:0 "Todo lo bueno llega a su fin, y Irreecha también"
 me_horn_of_africa_10.b:0 "Reservar fondos para la próxima generación y pagar para que continúe la tradición."
 me_horn_of_africa_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_10$#!' $mission_completed_tooltip_2$"
 me_horn_of_africa_10_tooltip2:0 "#Y Dentro de veinte años, el#! #G Festival Irreecha#! #Y se volverá a realizar.#!"
 
 me_horn_of_africa_11_title:0 "$01_horn_of_africa_task_11$"
 me_horn_of_africa_11_desc:0 "Aunque [ROOT.GetCountry.GetCapital.GetName] se encuentra a miles de kilómetros de las ciudades de los #E helenos#! y #E púnicos#!, los rumores viajan rápido a lo largo de las rutas comerciales, y los logros del poderoso [ROOT.GetCountry.GetRuler.GetName] son aclamados en lugares distantes como [GetProvince('(int32)516').GetName] y [GetProvince('(int32)3256').GetName].\n\nEl Los comerciantes griegos que visitan nuestros puertos han comenzado a llamar a [ROOT.GetCountry.GetRuler.GetFirstName] #E 'Poliorketes#!, o el 'Tomador de ciudades', porque [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] ha sido el primero en unir las ciudades macrobianas bajo una sola bandera: una reputación y un apodo que [ROOT.GetCountry.GetRuler.GetSheHe] ha abrazado felizmente."
 me_horn_of_africa_11.a:0 "Mi trabajo apenas comienza..."
 me_horn_of_africa_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_11$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_12_title:0 "$01_horn_of_africa_task_12$"
 me_horn_of_africa_12_desc:0 "Durante demasiado tiempo, el pueblo [ROOT.GetCountry.GetAdjective] ha tenido que competir con potencias rivales por el control de las valiosas rutas comerciales del #E Sinus Arabus#!, pero esta situación pronto llegará a su fin, especialmente si [ROOT.GetCountry.GetRuler.GetName] tiene [ROOT.GetCountry.GetRuler.GetHerHis] camino.\n\nEn los últimos años, se ha hecho evidente que el control total del [GetProvince('(int32)1489').GetName] se ha convertido en una necesidad, y nuestros generales han preparado planes de guerra para una invasión de [GetProvince('(int32)8667').GetArea.GetName] y [GetProvince('(int32)7535').GetArea.GetName]."
 me_horn_of_africa_12.a:0 "¡Nuestros ejércitos no se detendrán hasta conquistar el estrecho occidental!"
 me_horn_of_africa_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_12$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_13_title:0 "$01_horn_of_africa_task_13$"
 me_horn_of_africa_13_desc:0 "Los viajeros a [GetProvince('(int32)8704').GetName] a menudo han hablado de una ciudad distante, muy al sur, llamada #E 'Rhapta'#!, que se encuentra mucho más allá de las fronteras de nuestros mapas. Hay muchas personas que viven dentro de [ROOT.GetCountry.GetCapital.GetName] que se enorgullecen de su conocimiento de las curiosidades cartográficas, y hay muchas dudas entre los círculos macrobianos educados de que la legendaria ciudad de Rhapta exista.\n\nConsciente de que descubrir Rhapta haría maravillas para el prestigio de [ROOT.GetCountry.GetRuler.GetHerHis], [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] ha financiado personalmente una expedición que zarpará del #E 'Ciudad de los Ángeles'#! con la esperanza de descubrir los mercados de Rhapta. Una hermosa mañana, una flota de orgullosos liburnios partió de Apocopa hacia lo vasto desconocido, acompañada de oraciones de protección y las bendiciones de nuestros sacerdotes."
 me_horn_of_africa_13.a:0 "Que Waaq guíe sus barcos a través de mares tranquilos hacia puertos seguros"
 me_horn_of_africa_13_tooltip:0 "#Y La flota macrobiana navega hacia el sur, fuera del mapa...#!"
 
 me_horn_of_africa_14_title:0 "$01_horn_of_africa_task_14$"
 me_horn_of_africa_14_desc:0 "Con las dos ciudades más importantes de [GetProvince('(int32)7521')GetArea.GetName] firmemente en su poder, el victorioso [ROOT.GetCountry.GetRuler.GetName] ha vuelto [ROOT.GetCountry.GetRuler.GetHerHis] los ojos hacia el oeste, hacia los antiguos y poderosos reinos que gobiernan los interiores montañosos de las tierras altas. Ahora que [ROOT.GetCountry.GetName] controla el acceso al #E Sinus Adenensis#!, es lógico que los ejércitos [ROOT.GetCountry.GetAdjective] tomen el control de las rutas terrestres que conducen a Punt."
 me_horn_of_africa_14.a:0 "Mis ejércitos son imparables: Waaq está con nuestra gente."
 me_horn_of_africa_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_14$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_15_title:0 "$01_horn_of_africa_task_15$"
 me_horn_of_africa_15_desc:0 "A medida que nuestros [ROOT.GetCountry.GetAdjective] compatriotas se familiarizan cada vez más con las aguas del #E Mare Erythraeum#!, han comenzado a navegar cada vez más lejos de [ROOT.GetCountry.GetCapital.GetName], pasando a veces años en el mar antes de regresar a casa.\n\nOur [ROOT.GetCountry.GetRulerTitle], who has accompanied our sailors on many of their expeditions and has learned a thing or two about sailing, was present when our men discovered the island of [GetProvince('(int32)7216').GetName] at the eastern edge of #E Arabia#!. Sarapis was not only blessed with gemstones @gems!, but had a natural harbor that allowed easy access to the # E Sinus Persicus#! and its trade routes. From that moment, the only desire of [ROOT.GetCountry.GetRuler.GetName] was to take the island for [ROOT.GetCountry.GetName], realizing that the strategic potential of the location outweighed whatever costs it would take to get it."
 me_horn_of_africa_15.a:0 "Preveo un futuro para los macrobianos en Sarapis..."
 me_horn_of_africa_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_15$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_16_title:0 "$01_horn_of_africa_task_16$"
 me_horn_of_africa_16_desc:0 "Con una fuerte flota al mando de [ROOT.GetCountry.GetRuler.GetHerHis] y un ejército de soldados curtidos en la batalla listos para desatar el infierno sobre el enemigo, [ROOT.GetCountry.GetRuler.GetName] ha decidido lanzar una invasión de la cadena de islas gobernadas por [GetCountry('MDP').GetName]. Los territorios orientales serían una adición invaluable para las flotas de [ROOT.GetCountry.GetName], y nuestros exploradores militares aseguraron a nuestros generales que abrumaríamos las defensas locales. \n\nSe reunieron suministros para más de un año y los soldados se entrenaron diariamente para las batallas venideras. Lo único que el [ROOT.GetCountry.GetRulerTitle] estaba esperando era un clima favorable, y cuando los monzones finalmente amainaron en su furia y los cielos sobre el #E Mare Erythraeum#! se despejaron, se dio la orden de que se hicieran sacrificios a [GetDeityDefinition('omen_waaq').GetName|E].\n\nDesafortunadamente, el sacrificio estuvo plagado de malos augurios; los fuegos en el altar no permanecían encendidos, y después de diez intentos, se mantuvo una llama escasa, solo para ser apagada por una fuerte brisa que venía del océano. Encogiéndose de hombros, los #E Sacerdotes de Waaq#! se dirigieron a [ROOT.GetCountry.GetRuler.GetFirstName] y dijeron que no podrían completar sus deberes."
 me_horn_of_africa_16.a:0 "¡Ignora el sacrificio y zarpa hacia las Maldivas!"
 me_horn_of_africa_16.b:0 "Los augurios son desfavorables: pospondremos la invasión"
 me_horn_of_africa_16_tooltip:0 "#Y La cadena de eventos continuará...#!"
 me_horn_of_africa_16_tooltip2:0 "#Y Esto finalizará la cadena de eventos.#!"
 
 me_horn_of_africa_17_title:0 "$01_horn_of_africa_task_17$"
 me_horn_of_africa_17_desc:0 "Los ejércitos de [ROOT.GetCountry.GetName] continúan su racha de éxitos en el campo de batalla y, una a una, las ciudades ricas de #E África#! y #E Arabia#! se han convertido en posesiones macrobianas. El puerto de [GetProvince('(int32)7502').GetName] se ha vuelto indispensable para nuestros esfuerzos por abastecer a nuestros ejércitos en la región, y nuestros generales lo han elegido como su base de operaciones durante las próximas temporadas de campaña. \n\n[ROOT.GetCountry.GetRuler.GetName] ha ordenado a [ROOT.GetCountry.GetRuler.GetHerHis] asesores militares que planifiquen una invasión de [GetProvince('(int32)7506')GetArea.GetName], con la esperanza de que el interior de África caiga tan rápido como las costas."
 me_horn_of_africa_17.a:0 "¡Debo controlar todas las ciudades a lo largo de las rutas comerciales!"
 me_horn_of_africa_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_17$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_18_title:0 "$01_horn_of_africa_task_18$"
 me_horn_of_africa_18_desc:0 "Las incursiones en busca de esclavos han sido durante mucho tiempo un pasatiempo de las armadas macrobianas, pero hoy marca el comienzo de una era completamente nueva. La delgada línea entre la piratería sancionada por el Estado y los ataques improvisados ​​se ha ido desdibujando progresivamente durante la última década, y muchos de los que viven dentro de [ROOT.GetCountry.GetName] están dispuestos a sacrificar su moral en aras de las ganancias, y nuestro contacto con los mercados del Lejano Oriente no ha hecho más que empeorar el potencial de corrupción y abuso a lo largo de las rutas comerciales que gestionamos. La corrupción se está convirtiendo en una forma de vida dentro de nuestras tierras, algo que sólo puede mitigarse, nunca erradicarse.\n\nY así, a raíz de una serie de edictos que prohibían a las armadas macrobianas interferir con el paso de las flotas piratas, no fue una sorpresa descubrir que las flotas comandadas por [ROOT.GetCountry.GetRuler.GetName] estaban construyendo sus propios paraísos piratas; una decisión que conmocionó la sensibilidad política y los precios del mercado, ya que ambos se vieron afectados por esta noticia."
 me_horn_of_africa_18.a:0 "El pirata siempre ha sido amigo de [ROOT.GetCountry.GetName]"
 me_horn_of_africa_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_18$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_19_title:0 "$01_horn_of_africa_task_19$"
 me_horn_of_africa_19_desc:0 "Sostenida por un océano de oro y plata que vierte en las tesorerías, [ROOT.GetCountry.GetCapital.GetName] se ha hecho conocida como la #E 'Ciudad de las Monedas'#! debido a las extravagantes y ostentosas muestras de riqueza que se pueden encontrar en la capital macrobiana, un nombre que ha sido adoptado de todo corazón por [ROOT.GetCountry.GetRuler.GetName].\n\nAlgunos de los hoteles más lujosos del mundo. En la ciudad se pueden encontrar mercados, y la cantidad de guardias armados que patrullan sus calles podría confundirse con una fuerza invasora: la seguridad se toma muy en serio dentro de sus muros y no se escatiman gastos cuando se trata de proteger las mercancías de los vendedores macrobianos."
 me_horn_of_africa_19.a:0 "Somos la ciudad más rica de toda #E África#!"
 me_horn_of_africa_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_19$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_20_title:0 "$01_horn_of_africa_task_20$"
 me_horn_of_africa_20_desc:0 "Nuestra capital es conocida por muchos nombres; la mayoría la llama la #E 'Ciudad de las Monedas'#!, aunque hay una minoría cada vez menor que todavía se refiere a ella por su nombre tradicional y se supone que es uno de los lugares más ricos del mundo. Es difícil decir si esto es cierto o no, pero todos los que visitan sus calles de mármol suelen quedar impresionados por sus amplios bulevares y su impresionante arquitectura. Muchas de las mejoras realizadas en la ciudad se han realizado bajo los auspicios de [ROOT.GetCountry.GetRuler.GetName], y realmente se puede decir que la capital macrobiana se ha convertido en una #E Metrópolis#! en los últimos años.\n\nPero nuestra gente no conoce nuestra capital con el frívolo título de 'Ciudad de monedas', sino que prefiere llamarla #E 'Ciudad de la Dios'#! en su lugar. Es con este nombre que honramos a [GetDeityDefinition('omen_waaq').GetName|E] y recordamos que nada de esto sería posible sin su guía."
 me_horn_of_africa_20.a:0 "Que esta ciudad siga siendo la capital de [ROOT.GetCountry.GetName] durante muchas generaciones."
 me_horn_of_africa_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_20$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_21_title:0 "$01_horn_of_africa_task_21$"
 me_horn_of_africa_21_desc:0 "Debido a que nuestra gente ha sido bendecida con una gran cantidad de elefantes @elephants!, hemos podido seleccionar cuidadosamente los animales más rápidos y fuertes de nuestras manadas para nuestras fuerzas militares. Con el tiempo, estos animales de patas veloces se han convertido en una parte indispensable de nuestros ejércitos."
 me_horn_of_africa_21.a:0 "Damos gracias a Waaq y los Ayaanles por nuestra buena fortuna."
 me_horn_of_africa_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_21$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_22_title:0 "$01_horn_of_africa_task_22$"
 me_horn_of_africa_22_desc:0 "En los últimos años, los ejércitos de [ROOT.GetCountry.GetName] han logrado apoderarse de la mayor parte de la producción de mirra @myrrh! en #E África Oriental#! y #E Arabia Meridional#!, y es sabido en todo el mundo civilizado que no se puede conseguir la fragante resina a menos que se le haya pagado a un comerciante macrobiano en algún lugar del mundo. Line.\n\nEs gracias a estos impuestos pagados por la venta de mirra que las tesorerías de [ROOT.GetCountry.GetCapital.GetName] se están desbordando y el comercio continúa fluyendo hacia nuestra capital a un ritmo casi inmanejable."
 me_horn_of_africa_22.a:0 "Debemos recordar agradecer a Waaq en estos tiempos de abundancia."
 me_horn_of_africa_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_22$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_23_title:0 "$01_horn_of_africa_task_23$"
 me_horn_of_africa_23_desc:0 "La isla que los #E cartógrafos griegos#! llaman #E 'Taprobane'#! ahora se ha convertido en una provincia de [ROOT.GetCountry.GetName], y el estado de nuestras fronteras requiere que un flujo constante de barcos viaje de ida y vuelta entre las remotas capitales de nuestros holdings, algo que no es una tarea fácil.\n\nSe ha superado esta situación. Admirablemente por nuestra marina, hay que decirlo, ya que casi dominan la navegación dentro de las extensas aguas del #E Mare Erythraeum#!. Se dice que los barcos más rápidos pueden hacer el viaje de [GetProvince('(int32)7523').GetName] a [GetProvince('(int32)6971').GetName] en menos de dos meses, un logro asombroso que ha hecho que [ROOT.GetCountry.GetRuler.GetName] elogie a nuestros marineros."
 me_horn_of_africa_23.a:0 "Nuestras participaciones en #E India#! deben expandirse..."
 me_horn_of_africa_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_23$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_24_title:0 "$01_horn_of_africa_task_24$"
 me_horn_of_africa_24_desc:0 "Desde la [ROOT.GetCountry.GetCapital.GetName] imperial, la ciudad más grande de toda #E África#! y el hogar de la poderosa #E Liga Macrobiana#! que controla el comercio entrante de #E Arabia#! y #E India#!, se ha enviado un decreto a todas las principales capitales del mundo civilizado con un anuncio de [ROOT.GetCountry.GetRuler.GetName].\n\nA partir de este día, seremos conocidos como la #E Liga Erythraean#!, porque hemos trascendido nuestros orígenes humildes como una ciudad-estado macrobiana en lucha y nos hemos convertido en algo que nunca antes se había visto. Nada de esto sería posible, por supuesto, sin el liderazgo divinamente inspirado de [ROOT.GetCountry.GetRuler.GetFirstName], quien ha llevado a nuestro país a las alturas de la gloria."
 me_horn_of_africa_24.a:0 "¡Todos saluden a la Casa conquistadora de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]!"
 me_horn_of_africa_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_24$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_25_title:0 "$01_horn_of_africa_task_25$"
 me_horn_of_africa_25_desc:0 "Aunque hay algunas voces que han expresado su preocupación por el envío de nuestro ejército a #E Arabia#!, los argumentos presentados por [ROOT.GetCountry.GetRuler.GetName] han obligado a muchos a alinearse con la voluntad del poderoso [ROOT.GetCountry.GetRulerTitle].\n\nDurante demasiado tiempo, nuestro transporte marítimo ha sido acosado por piratas y bandoleros que navegan desde puertos árabes, y [ROOT.GetCountry.GetRuler.GetFirstName] ha prometieron poner fin a su tiranía conquistando las tierras desérticas que habitan."
 me_horn_of_africa_25.a:0 "Si queremos la paz, siempre debemos prepararnos para la guerra."
 me_horn_of_africa_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_25$#!' $mission_completed_tooltip_2$"
 
 
 ### Horn of Africa 2
 
