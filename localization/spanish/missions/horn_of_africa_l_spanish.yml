 desc_macrobian_capital_city_coins_mod:0 "Esta región alberga la llamada \"Ciudad de las Monedas\", conocida en todo el mundo por su esplendor y riqueza."
 soqotra_greek_district_modifier:0 "Distrito griego"
 desc_soqotra_greek_district_modifier:0 "Los macrobianos han reconstruido aquí una colonia helénica y los lugareños lo conocen como el \"distrito griego\"."
 macrobian_rhaptan_trade_route_mod:0 "Rutas comerciales de raptanes"
 desc_macrobian_rhaptan_trade_route_mod:0 "Los comerciantes de la lejana ciudad de Rhapta navegan aquí regularmente para comerciar."
 macrobian_periplus_treasure:0 "Periplo de Ezena El Navegante"
