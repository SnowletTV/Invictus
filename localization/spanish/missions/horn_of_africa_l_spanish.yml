 #Modifiers
 
 macrobian_arabian_trade_modifier:0 "Señores del lujo"
 desc_macrobian_arabian_trade_modifier:0 "Los eritreos prácticamente controlan el comercio de mirra, especias e incienso, y su nombre es sinónimo de la mejor calidad de estos lujosos productos comerciales."
 erythraean_written_script_modifier:0 "La escritura eritrea"
 desc_erythraean_written_script_modifier:0 "Los eritreos codificaron su lengua escrita y se utiliza ampliamente en África, Arabia y la India."
 erythraean_stater_modifier:0 "El estator eritreo"
 desc_erythraean_stater_modifier:0 "La pesada moneda conocida como 'Erythraen Stater' es la columna vertebral de nuestra moneda y es conocida internacionalmente por la pureza de su contenido de oro."
 port_of_sarapis_city_mod:0 "Puerto Fortificado de Sarapis"
 desc_port_of_sarapis_city_mod:0 "En esta isla se ha construido un puerto utilizado principalmente por la armada de Eritrea."
 macrobian_souq_sarapis_mod:0 "Zoco de Sarapis"
 des_macrobian_souq_sarapis_mod:0 "Uno de los mercados más famosos de toda Arabia se encuentra en la isla de Sarapis."
 arabian_presence_macrobian_modifier:0 "Arabia Eritrea"
 desc_arabian_presence_macrobian_modifier:0 "Los eritreos han conquistado vastas extensiones de Arabia y no se puede subestimar la importancia de la península para su reino."
 macrobian_indian_diamond_cities:0 "Ciudades Diamante"
 desc_macrobian_indian_diamond_cities:0 "Los eritreos han invertido mucho en esta región en sus esfuerzos por extraer más piedras preciosas para el mercado internacional."
 erythraean_trading_emporium:0 "Emporio Eritreo"
 desc_erythraean_trading_emporium:0 "Los eritreos construyeron aquí un enorme emporio, uno de los más grandes de la India."
 indian_presence_macrobian:0 "India eritrea"
 desc_indian_presence_macrobian:0 "Aunque sus costas están muy lejos de la tradicional patria africana de Eritrea, la India se ha convertido en una de las provincias más importantes de su reino."
 macrobian_port_modifier:0 "Astilleros Eritreos"
 desc_macrobian_port_modifier:0 "Como potencia marítima, los eritreos dependen de sus astilleros más que la mayoría, y sus constructores de barcos se encuentran entre los más hábiles del mundo."
 indian_macrobian_citizens_mod:0 "Ciudadanos del este"
 desc_indian_macrobian_citizens_mod:0 "Debido a que los eritreos han concedido derechos cívicos a los indios, los habitantes orientales de su reino parecen más dispuestos a abrazar las tradiciones religiosas de sus señores supremos."
 macrobian_african_mercenary_mod:0 "Espadas de África"
 desc_macrobian_african_mercenary_mod:0 "Para hacer cumplir su voluntad en todas sus esferas de interés, los eritreos dependen en gran medida de los mercenarios africanos."
 macrobian_indian_food_stores_mod:0 "Granero dravídico"
 desc_macrobian_indian_food_stores_mod:0 "Para alimentar a los habitantes de la capital de Eritrea se importan enormes cantidades de cereales del sur de la India."
 erythraean_armada_modifier:0 "Armada Eritrea"
 desc_erythraean_armada_modifier:0 "Los veloces barcos de la Armada Eritrea garantizan que podamos hacer frente a cualquier problema en nuestro reino."
 macrobian_capture_modifier:0 "Ladrones de barcos eritreos"
 desc_macrobian_capture_modifier:0 "La Armada Eritrea prácticamente captura tantos barcos como destruye, lo que hace que sus armadas sean aún más formidables."
 macrobian_ship_repair_sea_mod:0 "Maestros de las aguas inexploradas"
 desc_macrobian_ship_repair_sea_mod:0 "La armada de Eritrea ha dominado las difíciles técnicas que les permiten reparar sus barcos mientras aún están en el mar."
 macrobian_merchant_ten_year_term_mod:0 "Concesiones otorgadas a la clase mercantil"
 desc_macrobian_merchant_ten_year_term_mod:0 "Los eritreos han acordado conceder a los gremios de comerciantes una exención de impuestos de diez años."
 macrobian_merchant_five_year_term_mod:0 "Privilegios otorgados a la clase mercantil"
 desc_macrobian_merchant_five_year_term_mod:0 "Los eritreos han acordado conceder a los gremios de comerciantes una suspensión de impuestos de cinco años."
 erythraean_magnificent_trade_hub_modifier:0 "Gran Bazar Eritreo"
 desc_erythraean_magnificent_trade_hub_modifier:0 "Los eritreos han construido en esta provincia el mercado más grande del mundo, y comerciantes de todo el mundo navegan hasta su puerto."
 rebellion_against_erythraean_empire_mod:0 "Guerra civil eritrea"
 desc_rebellion_against_erythraean_empire_mod:0 "Este país está actualmente librando una lucha de vida o muerte contra el Imperio Erythyraean."
 forced_to_retire:0 "Obligado a jubilarse"
 
