 02_horn_of_africa:0 "El Imperio Eritreo"
 02_horn_of_africa_DESCRIPTION:0 "En los últimos años, la majestuosa [ROOT.GetCountry.GetCapital.GetName], conocida por los poetas como la #E Joya de [ROOT.GetCountry.GetCapital.GetArea.GetName]#! y sin duda la capital más importante de toda #E África#!, se encontró gobernando un reino que abarcaba continentes, con las salvajes y peligrosas aguas del #E Mare Erythraeum#! separándola provincias por miles de kilómetros.\n\nLa vida es próspera y buena en este nuevo reino, y la gente es feliz y rica gracias al comercio. Muchas son las lenguas que se hablan en los mercados de su ciudad, ya que se sabe que comerciantes de lugares tan lejanos como [GetProvince('(int32)3256').GetName] navegan a sus puertos en busca de bienes comerciales raros, y las tarifas impuestas a estos viajeros en busca de gangas por los recaudadores de impuestos de Eritrea han llenado las tesorerías reales.\n\nEl desarrollo a gran escala de este incipiente imperio continúa, y el estilo arquitectónico de las ciudades construidas por la #E Casa gobernante de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#! se caracteriza por su elegante fusión de motivos artísticos #E africanos#!, #E árabes#! e #E indios#!, un testimonio de las numerosas influencias culturales de los eritreos."
 02_horn_of_africa_CRITERIA_DESCRIPTION:0 "Esta misión se completará cuando la #E Casa de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#! se haya expandido por #E África#!, #E Arabia#! y #E India#! y haya desarrollado una poderosa talasocracia, que se extiende por continentes y controla las rutas comerciales: una verdadera #E Eritrea. Imperio#!."
 02_horn_of_africa_BUTTON_TOOLTIP:0 "El futuro que nos espera es nuestro para crear..."
 02_horn_of_africa_BUTTON_DETAILS: ""
 
 02_horn_of_africa_task_start:0 "Un reino dividido"
 02_horn_of_africa_task_start_DESC:0 "Los últimos años han sido caóticos y llenos de acontecimientos que marcaron una época, y [ROOT.GetCountry.GetRuler.GetName|Y], el [ROOT.GetCountry.GetRulerTitle] de [ROOT.GetCountry.GetName|G], ha dejado el [ROOT.GetCountry.GetCapital.GetName|T] para ir al campo para contemplar el futuro.\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 
 02_horn_of_africa_task_1:0 "El Puerto Fortificado De Sarapis"
 02_horn_of_africa_task_1_DESC:0 "El punto de apoyo #T Erythraean#! en la isla de [GetProvince('(int32)7216').GetName|T] se ha vuelto vital para sus esfuerzos por extender su influencia por toda #COLOR:{0.201,0.69,0.00} Arabia#!. Consciente de su importancia estratégica, [ROOT.GetCountry.GetRuler.GetName|Y] ha decretado que se construya un enorme puerto militar en la isla.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil8!"
 
 02_horn_of_africa_task_2:0 "Aprovechando el sur de Arabia"
 02_horn_of_africa_task_2_DESC:0 "No se puede negar que la #T presencia eritrea#! dentro de #COLOR:{0.201,0.69,0.00} Arabia#! es sustancial, ya que los ejércitos de [ROOT.GetCountry.GetName|G] han subyugado muchos territorios y ciudades a lo largo de las costas, especialmente en sus zonas ricas en recursos. Sur.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 
 02_horn_of_africa_task_3:0 "Pirateando el Sinus Persicus"
 02_horn_of_africa_task_3_DESC:0 "[ROOT.GetCountry.GetRuler.GetName|Y] ha recibido una solicitud de los piratas que operan cerca del #Y Sinus Persicus#! - si estamos dispuestos a ayudarlos a financiar la construcción de #R Pirate Havens#! en algunos de los puertos más importantes de la región, entonces nos ayudarán a reclamar los territorios para [ROOT.GetCountry.GetName|G].\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 
 02_horn_of_africa_task_4:0 "Carreteras árabes"
 02_horn_of_africa_task_4_DESC:0 "Es difícil viajar por la #COLOR:{0.201,0.69,0.00} Península Arábiga#! en el mejor de los casos, y la falta de infraestructura que conecte las ciudades comerciales y los oasis del desierto ha hecho que esta tarea sea más adecuada para los camellos, pero esto ha cambiado. [ROOT.GetCountry.GetRuler.GetName|Y] ha escuchado la petición de los lugareños y ha aceptado financiar la construcción de una enorme red de carreteras que conectará los centros de la civilización. Juntos.\n\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 
 02_horn_of_africa_task_5:0 "África árabe"
 02_horn_of_africa_task_5_DESC:0 "Aunque hay muchos que viven dentro de [ROOT.GetCountry.GetName|G] que desean permanecer fieles a las viejas costumbres, hay muchos de nuestros ciudadanos que están interesados en aprender más sobre los dioses de #COLOR:{0.201,0.69,0.00} Arabia#! - las deidades del #T Panteón árabe#! se han ganado los corazones de muchos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 
 02_horn_of_africa_task_6:0 "Diamantes del este"
 02_horn_of_africa_task_6_DESC:0 "Siempre ha habido una fuerte demanda internacional de las piedras preciosas finas @gems! que se producen en #COLOR:{0.83,0.53,0.3} India#!, y [ROOT.GetCountry.GetRuler.GetName|Y] ha pedido que se realicen inversiones a nivel estatal en las ciudades bajo #T Erythraean#! control.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
 02_horn_of_africa_task_7:0 "Una presencia creciente en la India"
 02_horn_of_africa_task_7_DESC:0 "Aunque #COLOR:{0.83,0.53,0.3} India#! está a miles de kilómetros de nuestra capital, el subcontinente sigue siendo una de las provincias más ricas e importantes de [ROOT.GetCountry.GetName|G]. [ROOT.GetCountry.GetRuler.GetName|Y] está interesado en aumentar la presencia #T eritrea#! en la región y ha exigido que los ejércitos [ROOT.GetCountry.GetRuler.GetHerHis] sigan ampliando la bordes.\n\n\n\n\n\n\n\n\n\n\n@india_mil8!"
 
 02_horn_of_africa_task_8:0 "Granero dravídico"
 02_horn_of_africa_task_8_DESC:0 "Alimentar a los habitantes de [ROOT.GetCountry.GetCapital.GetName|T] siempre está en la mente de los gobernantes de [ROOT.GetCountry.GetName|G], ya que un estómago lleno ayuda a mantener a raya las quejas. Para mantener llenos los graneros, se ha tomado la decisión de importar cantidades masivas de maíz de #COLOR:{0.83,0.53,0.3} India#!. Realizado.\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 
 02_horn_of_africa_task_9:0 "La verdad védica revelada"
 02_horn_of_africa_task_9_DESC:0 "Después de consultar con los principales sabios de la #COLOR:{0.83,0.53,0.3} Fe Védica#!, [ROOT.GetCountry.GetRuler.GetName|Y] ha llegado a una conclusión sorprendente; los dioses conocidos como [GetDeityDefinition('omen_waaq').GetName|G] y [GetDeityDefinition('omen_brahma').GetName|G] son el mismo ser.\n\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 erythraean_waaq_brahma_god_tt:0 "La deidad #G Waaq-Brahma#! se agregará a nuestro #T Panteón#!."
 
 02_horn_of_africa_task_10:0 "Una capital india"
 02_horn_of_africa_task_10_DESC:0 "Aunque algunos están protestando por el cambio, argumentando que trasladarse a través del #Y Mare Erythraeum#! será costoso y poco práctico, nadie puede detener a [ROOT.GetCountry.GetRuler.GetName|Y] e impedir que [ROOT.GetCountry.GetRuler.GetHerHim] implemente el [ROOT.GetCountry.GetRuler.GetHerHis] deseo de trasladar la capital de [ROOT.GetCountry.GetName|G] a #COLOR:{0.83,0.53,0.3} India#!.\n\n\n\n\n\n\n\n\n\n\n@india_mil2!"
 
 02_horn_of_africa_task_11:0 "Empresas macrobianas"
 02_horn_of_africa_task_11_DESC:0 "Si bien nadie puede negar que tenemos muchos intereses financieros en el extranjero, no debemos descuidar la infraestructura de las ciudades de #COLOR:{0.51,0.31,0.75} África#! que dieron origen a nuestra poderosa #T Liga#!. Ha llegado el momento de invertir en nuestras ciudades macrobianas.\n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 
 02_horn_of_africa_task_12:0 "El camino de las tierras altas hacia Aksum"
 02_horn_of_africa_task_12_DESC:0 "A medida que la importancia de [GetProvince('(int32)7519').GetName|T] y [GetProvince('(int32)7521').GetName|T] continúa creciendo, los arquitectos que viven en las ciudades costeras se han acercado a [ROOT.GetCountry.GetRuler.GetName|Y] con una oferta que intriga a [ROOT.GetCountry.GetRuler.GetSheHe]; Si el estado iguala sus fondos, se construirá una carretera a través de los páramos que conducirá al majestuoso [GetProvince('(int32)7506').GetName|T].\n\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 
 02_horn_of_africa_task_13:0 "hijos de dios"
 02_horn_of_africa_task_13_DESC:0 "Aunque nuestro pueblo está rodeado de muchas religiones, nunca hemos vacilado en nuestras creencias. Nuestros piadosos compatriotas reconocen que hemos logrado todo lo que tenemos gracias a la voluntad divina [GetDeityDefinition('omen_waaq').GetName|T] - somos hijos de la verdadera dios.\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 
 02_horn_of_africa_task_14:0 "Ascendencia de Aksum"
 02_horn_of_africa_task_14_DESC:0 "Si bien las costas de #COLOR:{0.51,0.31,0.75} África#! han sido parte de [ROOT.GetCountry.GetName|G] durante mucho tiempo, el oeste fue conquistado y sometido por nuestra clase dominante. Para asegurar firmemente nuestro control sobre el interior montañoso, [ROOT.GetCountry.GetRuler.GetName|Y] ha invertido enormes recursos en la ciudad de [GetProvince('(int32)7506').GetName|T], considerándola la capital no oficial del región.\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 
 02_horn_of_africa_task_15:0 "Corazón de Punt"
 02_horn_of_africa_task_15_DESC:0 "Ahora que el corazón de #COLOR:{0.51,0.31,0.75} África#! se ha visto reforzado y asegurado por las iniciativas que surgen del [ROOT.GetCountry.GetCapital.GetName|T], [ROOT.GetCountry.GetRuler.GetName|Y] se ha fijado [ROOT.GetCountry.GetRuler.GetHerHis] el objetivo de controlar una de las ciudades comerciales más importantes del #Y Sinus Arabus#!, [GetProvince('(int32)583').GetName|T].\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"
 
 02_horn_of_africa_task_16:0 "Señores del lujo"
 02_horn_of_africa_task_16_DESC:0 "[ROOT.GetCountry.GetName|G] es conocida por vender mercancías de la mejor calidad, y los comerciantes viajan de todo el mundo civilizado para realizar negocios dentro de ella. Mercados.\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 
 02_horn_of_africa_task_17:0 "Puertos de escala eritreos"
 02_horn_of_africa_task_17_DESC:0 "Como talasocracia, [ROOT.GetCountry.GetName|G] requiere una extensa red de puertos para mantener sus flotas mercantes y militares bien abastecidas y preparadas para lo que venga. Camino.\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 
 02_horn_of_africa_task_18:0 "Menta El Stater Eritreo"
 02_horn_of_africa_task_18_DESC:0 "En un esfuerzo por estandarizar la moneda utilizada en [ROOT.GetCountry.GetName|G], [ROOT.GetCountry.GetRuler.GetName|Y] ha pedido que se acuñen una serie de nuevas monedas.\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
 02_horn_of_africa_task_19:0 "Cultura eritrea"
 02_horn_of_africa_task_19_DESC:0 "Desde sus humildes comienzos a lo largo del #R Cinnamon Horn#!, el viaje de [ROOT.GetCountry.GetName|G] desde una ciudad-estado hasta un impresionante reino es una historia para todas las edades. Bajo el gobierno de los #Y [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#!, los pueblos de #COLOR:{0.51,0.31,0.75} África#!, #COLOR:{0.83,0.53,0.3} India#! y #COLOR:{0.201,0.69,0.00} Arabia#! se han unido como uno solo.\n\n#Y Esta tarea de misión desbloqueará la#! #T Cultura Eritrea#!.\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 
 02_horn_of_africa_task_20:0 "Centro de comercio indio"
 02_horn_of_africa_task_20_DESC:0 "Después de un período de reflexión, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido financiar la construcción del mercado de artículos de lujo más grande de [ROOT.GetCountry.GetName|G] en [GetProvince('(int32)6915').GetName|T].\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
 02_horn_of_africa_task_21:0 "Centro de comercio árabe"
 02_horn_of_africa_task_21_DESC:0 "Después de un período de reflexión, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido financiar la construcción del mercado de artículos de lujo más grande de [ROOT.GetCountry.GetName|G] en [GetProvince('(int32)7216').GetName|T].\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 
 02_horn_of_africa_task_22:0 "Maestros de las aguas inexploradas"
 02_horn_of_africa_task_22_DESC:0 "Nuestras armadas son enviadas constantemente a tareas peligrosas, incluida la navegación en aguas que nunca antes han sido exploradas. Sin un puerto de escala seguro al que recurrir, nuestros marineros han dominado la difícil tarea de reparar sus embarcaciones mientras aún están en el mar.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 
 02_horn_of_africa_task_23:0 "Propuestas de la clase mercantil"
 02_horn_of_africa_task_23_DESC:0 "Un consorcio de nobles que representan los distintos #T gremios de comerciantes#! que operan dentro de [ROOT.GetCountry.GetName|G] se han acercado a [ROOT.GetCountry.GetRuler.GetName|Y] con una oferta que [ROOT.GetCountry.GetRulerTitle] está considerando seriamente. \n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 
 02_horn_of_africa_task_24:0 "La Armada Eritrea"
 02_horn_of_africa_task_24_DESC:0 "Gestionar un reino marítimo requiere una gran armada, una que pueda navegar rápidamente de un rincón del #Y Mare Erythraeum#! al otro si surge la necesidad. Afortunadamente para [ROOT.GetCountry.GetName|G], su armada está preparada para la tarea.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 
 02_horn_of_africa_task_25:0 "Centro de comercio africano"
 02_horn_of_africa_task_25_DESC:0 "Después de un período de reflexión, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido financiar la construcción del mercado de artículos de lujo más grande de [ROOT.GetCountry.GetName|G] en [ROOT.GetCountry.GetCapital.GetName|T].\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 
 02_horn_of_africa_task_26:0 "Guerreros de las colinas del desierto"
 02_horn_of_africa_task_26_DESC:0 "[ROOT.GetCountry.GetName|G] tiene muchas fronteras remotas, con la posibilidad de que se produzcan disturbios en unos cuantos frentes que podrían significar un desastre para todo el reino si no se gestionan adecuadamente. Para abordar la falta de soldados cualificados que actualmente afecta a los [ROOT.GetCountry.GetRuler.GetHerHis] ejércitos, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido enviar guerreros de los desiertos de #COLOR:{0.201,0.69,0.00} Arabia#! por todo el reino.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil5!"
 
 02_horn_of_africa_task_27:0 "Mercenarios eritreos"
 02_horn_of_africa_task_27_DESC:0 "Si bien las levas y legiones de [ROOT.GetCountry.GetName|G] son ciertamente capaces de defenderse en el campo de batalla, es política estatal oficial confiar en #Y ejércitos mercenarios#! para garantizar la seguridad nacional y extranjera. Tranquilidad.\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 
 02_horn_of_africa_task_28:0 "Una capital árabe"
 02_horn_of_africa_task_28_DESC:0 "A pesar de las súplicas de nuestros mayores, muchos de los cuales no tienen ningún deseo de desarraigar sus vidas, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido que la capital de [ROOT.GetCountry.GetName|G] se trasladará a #COLOR:{0.201,0.69,0.00} Arabia#!.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 
 02_horn_of_africa_task_29:0 "Nobleza sabea"
 02_horn_of_africa_task_29_DESC:0 "Los #T sabeos#! que viven dentro de [ROOT.GetCountry.GetName|G] siempre han sido una minoría importante, con una influencia en todo el reino que eclipsa con creces su número. Recientemente, [ROOT.GetCountry.GetRuler.GetName|Y] recibió un mensaje tentador de una de sus principales familias y decidió aceptar su oferta.\n\n#Y Nuestro#! #G Gobernante#! #Y tomará un#! #T Sabaean#! #Y cónyuge#!. #Y Si su#! #G Gobernante#! #Y ya está casado, este evento provocará un#! #R Divorcio#!.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil14!"
 
 02_horn_of_africa_task_30:0 "Ciudades árabes"
 02_horn_of_africa_task_30_DESC:0 "Muchos creen erróneamente que #COLOR:{0.201,0.69,0.00} Arabia#! es un páramo desolado, desprovisto de cualquier civilización significativa, pero [ROOT.GetCountry.GetRuler.GetName|Y] ha prometido enriquecer y enriquecer sus numerosas ciudades. Potente.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 
 02_horn_of_africa_task_31:0 "Acorralando el mercado indio"
 02_horn_of_africa_task_31_DESC:0 "Una de las ciudades más importantes para las rutas comerciales que conectan #COLOR:{0.51,0.31,0.75} África#! y #COLOR:{0.83,0.53,0.3} India#! es [GetProvince('(int32)6859').GetName|T], ya que es el puerto final de escala para los barcos que no desean navegar hasta #T Taprobane#!.\n\nSi [ROOT.GetCountry.GetName|G] realmente desea dominar el comercio en la región, entonces sus ejércitos deben tomar posesión de [GetProvince('(int32)6859').GetArea.GetName|T].\n\n\n\n\n\n\n\n\n\n\n@india_por2!"
 
 02_horn_of_africa_task_32:0 "Mercados de Bharukaccha"
 02_horn_of_africa_task_32_DESC:0 "Para maximizar sus ganancias, [ROOT.GetCountry.GetRuler.GetName|Y] controla el extremo oriental de las rutas comerciales que se extienden por todo el #Y Mare Erythraeum#!, y el emporio que el poderoso [ROOT.GetCountry.GetRulerTitle] construyó en [GetProvince('(int32)6859').GetName|T] es quizás el más grande de su tipo en todo #COLOR:{0.83,0.53,0.3} India#!.\n\n\n\n\n\n\n\n\n\n\n@india_mil3!"
 
 02_horn_of_africa_task_33:0 "Destructor de flotas"
 02_horn_of_africa_task_33_DESC:0 "Nuestras flotas han dominado las técnicas necesarias para abordar un barco enemigo, dominar a sus marines y capturarlo para [ROOT.GetCountry.GetName|G], lo que le valió a nuestra armada el apodo de #E #R 'Destructor de Flotas #!#!.\n\n\n\n\n\n\n\n\n\n\n@persia_mil3!"
 
 02_horn_of_africa_task_34:0 "Dioses del desierto"
 02_horn_of_africa_task_34_DESC:0 "Después de consultar con las principales autoridades religiosas que viven en #COLOR:{0.201,0.69,0.00} Arabia#!, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido convertir.\n\n\n\n\n\n\n\n\n\n\n@italic_mil16!"
 
 02_horn_of_africa_task_35:0 "Ciudadanos del este"
 02_horn_of_africa_task_35_DESC:0 "A medida que crece el número de #COLOR:{0.83,0.53,0.3} indios#! que viven dentro de [ROOT.GetCountry.GetName|G], muchos de nuestros ciudadanos del este están haciendo campaña por los derechos cívicos, un privilegio que [ROOT.GetCountry.GetRuler.GetName|Y] ha acordado concederles, pero sólo si están dispuestos a comprometerse con nuestro santo hombres.\n\n\n\n\n\n\n\n\n\n\n@india_mil13!"
 
 02_horn_of_africa_task_36:0 "Tallar los textos sagrados"
 02_horn_of_africa_task_36_DESC:0 "La #COLOR:{0.83,0.53,0.3} Fe védica#! ha cautivado los corazones y las mentes de la #Y Casa de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#!, y los textos religiosos de los #COLOR:{0.83,0.53,0.3} indios#! han sido traducidos a los #T dialectos eritreos#! - un buen comienzo, pero [ROOT.GetCountry.GetRuler.GetName|Y] deseos que las santas palabras sean grabadas y publicadas en las principales ciudades de [ROOT.GetCountry.GetName|G] en un cartel de [ROOT.GetCountry.GetRuler.GetHerHis] fidelidad.\n\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 
 02_horn_of_africa_task_37:0 "Generales y tácticas dravídicas"
 02_horn_of_africa_task_37_DESC:0 "Aunque las técnicas de lucha y las formaciones utilizadas por los #COLOR:{0.83,0.53,0.3} indios#! nos son ajenas, [ROOT.GetCountry.GetRuler.GetName|Y] cree que los ejércitos de [ROOT.GetCountry.GetName|G] se beneficiarían de su amplia implementación.\n\n\n\n\n\n\n\n\n\n\n@india_mil12!"
 
 02_horn_of_africa_task_38:0 "Ciudades eritreas"
 02_horn_of_africa_task_38_DESC:0 "Desde los comienzos más humildes (hay quienes viven dentro de [ROOT.GetCountry.GetCapital.GetName|T] que recuerdan cuando [ROOT.GetCountry.GetName|G] era una simple ciudad-estado), nuestro reino ha crecido y se calcula que [ROOT.GetCountry.GetRuler.GetName|Y] gobierna más de cien ciudades.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 
 02_horn_of_africa_task_39:0 "Zoco de Sarapis"
 02_horn_of_africa_task_39_DESC:0 "La isla de [GetProvince('(int32)7216').GetName|T] se ha convertido en el principal destino de las armadas que viajan entre #COLOR:{0.51,0.31,0.75} África#! y la #COLOR:{0.83,0.53,0.3} India#!, y muchos de los barcos que se dirigen al sur a través del #Y Sinus Persicus#! atracan en sus aguas. Para aprovechar su importancia para las rutas comerciales, [ROOT.GetCountry.GetRuler.GetName|Y] ha pedido que se construya un #G Zoco#! gigante, el más grande de su tipo en toda #COLOR:{0.201,0.69,0.00} Arabia#!, en la isla.\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 
 02_horn_of_africa_task_40:0 "La escritura eritrea"
 02_horn_of_africa_task_40_DESC:0 "Dentro de nuestras fronteras se escriben muchas lenguas diferentes y se hablan muchas lenguas diferentes; un hecho de la vida que hace aún más difícil gobernar a nuestros diversos pueblos. Para aumentar la eficacia de nuestra burocracia, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido estandarizar el lenguaje escrito de [ROOT.GetCountry.GetName|G] y ha ordenado que las escrituras #T meroítica#! y #T sabaea#! se fusionen para crear algo que pueda entender todo.\n\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 
 02_horn_of_africa_task_41:0 "El Imperio Eritreo"
 02_horn_of_africa_task_41_DESC:0 "El Señor del #Y Mare Erythraeum#! y gobernante de un vasto reino que desafía toda descripción, [ROOT.GetCountry.GetRuler.GetName|Y] ha proclamado que, a partir de este día, seremos conocidos y temidos por un nuevo nombre: el #T Imperio Eritreo#!.\n\nY, sin embargo, no todo el mundo está contento con la idea de un imperio. #G La Casa de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#! y una camarilla de nobles descontentos han lanzado un complot para apoderarse de un rincón del Imperio.\n\n#Y Esta misión iniciará una#! #R Civil. Guerra#!.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 
 
 #Tooltips
 unlock_indian_kingdom_mil_trads_tt:0 "Desbloquearemos #Y $mauryan_philosophy$#! y #Y $mauryan_philosophy_2$#!."
 8_military_indian_macrobian_tt:0 "Necesitamos tener un personaje #COLOR:{0.83,0.53,0.3} [GetCultureGroup('indian').GetName]#! con al menos #Y 8#! @military_icon! Martial como nuestro #T Investigador de avances marciales#!."
 macrobian_integrate_indian_culture_tt:0 "Necesitamos integrar al menos una de las siguientes culturas; #T pandyán#!, #T lanka#!, #T cherán#! o #T tamil#!."
 macrobian_territories_in_southern_india_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! tiene al menos #Y [SCOPE.ScriptValue('macrobian_territories_in_southern_india_total')|0] territorios#! en áreas resaltadas. #R [SCOPE.ScriptValue('macrobian_territories_in_southern_india_current')|0]#!/#Y [SCOPE.ScriptValue('macrobian_territories_in_southern_india_total')|0]#!"
 macrobian_territories_in_southern_arabia_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! tiene al menos #Y [SCOPE.ScriptValue('macrobian_territories_in_southern_arabia_total')|0] territorios#! en áreas resaltadas. #R [SCOPE.ScriptValue('macrobian_territories_in_southern_arabia_current')|0]#!/#Y [SCOPE.ScriptValue('macrobian_territories_in_southern_arabia_total')|0]#!"
