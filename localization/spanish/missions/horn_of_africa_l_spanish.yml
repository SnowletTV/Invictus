 #Heritages
 erythraean_african_heritage:0 "Patrimonio de la talasocracia eritrea"
 erythraean_african_heritage_desc:0 "El poderoso imperio marítimo de los eritreos se centra en sus posesiones en África, pero controlan completamente las rutas comerciales del Mare Erythraeaum, así como una cantidad sustancial de territorios dentro de Arabia y la India."
 erythraean_arabian_heritage:0 "Patrimonio de la talasocracia eritrea"
 erythraean_arabian_heritage_desc:0 "El poderoso imperio marítimo de los eritreos se centra en sus posesiones en Arabia, el centro de su reino, pero controlan completamente las rutas comerciales del Mare Erythraeaum, así como una cantidad sustancial de territorios dentro de su tierra natal de África y la lejana India."
 erythraean_indian_heritage:0 "Patrimonio de la talasocracia eritrea"
 erythraean_indian_heritage_desc:0 "El poderoso imperio marítimo de los eritreos se centra en sus posesiones en la India, aunque su patria tradicional se encuentra en la lejana África. Maestros indiscutibles del comercio internacional, controlan completamente el Mare Erythraeaum, así como una cantidad sustancial de territorios dentro de su tierra natal de África y la península arábiga."
 
 me_horn_of_africa_29_title:0 "$02_horn_of_africa_task_start$"
 me_horn_of_africa_29_desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha pasado muchas noches sin dormir últimamente, porque el [ROOT.GetCountry.GetRulerTitle] de [ROOT.GetCountry.GetName] tiene demasiadas cosas en [ROOT.GetCountry.GetRuler.GetHerHis] mente. El gran [ROOT.GetCountry.GetCapital.GetName], la envidia del mundo civilizado, gobierna un reino que se extiende por dos continentes y miles de kilómetros de agua, con intereses vitales no sólo en #E África#!, la patria de los antepasados ​​de [ROOT.GetCountry.GetRuler.GetFirstName], sino también en #E Arabia#! y #E India#!. Supervisar un reino tan enorme ha traído consigo una buena cantidad de dolores de cabeza, y el cansado [ROOT.GetCountry.GetRulerTitle] tuvo que tomar muchas decisiones importantes en los días venideros. Lo peor fue que [ROOT.GetCountry.GetRuler.GetSheHe] era plenamente consciente de estas responsabilidades: el peso de la historia realmente pendía sobre [ROOT.GetCountry.GetRuler.GetHerHis] cuello, y un paso en falso podría arruinar todo por lo que los antepasados [ROOT.GetCountry.GetRuler.GetHerHis] habían luchado y muerto.\n\n'Pero todo esto puede esperar, al menos durante un mes', pensó [ROOT.GetCountry.GetRuler.GetFirstName] mientras [ROOT.GetCountry.GetRuler.GetSheHe] abandonaba la caótica capital para recibir la bienvenida. Soledad del desierto. Lo que ahora hacía falta era un respiro; un momento para despejar la mente y descansar. En un mes, cuando [ROOT.GetCountry.GetRuler.GetFirstName] finalmente decidió que [ROOT.GetCountry.GetRuler.GetSheHe] estaba listo, el juego comenzaría en serio, pero ahora era el momento de relajarse."
 me_horn_of_africa_29.a:0 "Muy pronto haré historia..."
 me_horn_of_africa_29_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_start$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_30_title:0 "$02_horn_of_africa_task_1$"
 me_horn_of_africa_30_desc:0 "[GetProvince('(int32)7216').GetName] siempre ha sido una posesión #E eritrea#! importante y es fácil ver por qué; La pequeña isla es fácil de reabastecer por mar, y antes de que [ROOT.GetCountry.GetName] tuviera una gran presencia dentro de #E Arabia#!, sus ejércitos habían utilizado Sarapis como su puerto de escala.\n\nSarapis se encuentra en medio de la ruta comercial que conecta #E India#! y #E África#!, lo que la convierte en una opción natural para el desarrollo. No sorprende, entonces, que los eritreos sigan mejorando la infraestructura de la isla, y que allí se haya construido una ciudad y un gran puerto militar."
 me_horn_of_africa_30.a:0 "¡Que la ciudad de Sarapis prospere durante mil años!"
 me_horn_of_africa_30_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_1$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_32_title:0 "$02_horn_of_africa_task_3$"
 me_horn_of_africa_32_desc:0 "Si bien nuestra esfera de influencia abarca el #E Mare Erythraeum#!, [ROOT.GetCountry.GetRuler.GetName], un verdadero amigo de las #E flotas piratas#! que operan dentro de nuestras aguas, recientemente acordó apoyar clandestinamente la construcción de #E refugios piratas#! en algunos de los puertos clave del #E Sinus. Arábica#!.\n\nSe firmaron tratados secretos con los piratas, quienes prometieron ayudarnos a conquistar los territorios algún día, si así lo decidimos."
 me_horn_of_africa_32.a:0 "Un punto de apoyo en el #E Sinus arabus#! haría maravillas en nuestros resultados"
 me_horn_of_africa_32_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_3$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_33_title:0 "$02_horn_of_africa_task_7$"
 me_horn_of_africa_33_desc:0 "Cuando [ROOT.GetCountry.GetRuler.GetHerHis] asesores militares se acercaron y les preguntaron por qué los ejércitos de [ROOT.GetCountry.GetName] habían conquistado tantos territorios dentro de #E India#!, [ROOT.GetCountry.GetRuler.GetName] les respondió de manera bastante directa."
 me_horn_of_africa_33.a:0 "Oro y mano de obra... ¿qué más vale la pena llevar?"
 me_horn_of_africa_33_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_7$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_34_title:0 "$02_horn_of_africa_task_5$"
 me_horn_of_africa_34_desc:0 "Como señal de los tiempos cambiantes, el antiguo lugar sagrado dedicado a [GetDeityDefinition('omen_waaq').GetName] ha sido desmantelado e incluso su #E Gran Templo#! en [GetProvince('(int32)7532').GetName] ha sido arrasado, un acto que hizo llorar a muchos, pero [ROOT.GetCountry.GetRuler.GetName] fue firme en su [ROOT.GetCountry.GetRuler.GetHerHis] decisión. Ya no se quemaría incienso ante una estatua de la antigua divinidad macrobiana, ni se colocarían más ofrendas de pasteles de dátiles y vino ante sus pies.\n\nLos corazones de las élites han sido conquistados por los dioses de #E Arabia#!, y aunque la palabra 'Waaq' seguiría siendo sinónimo de cualquier dios dentro de [ROOT.GetCountry.GetCapital.GetName], los ritos del #E Rain Giver#! han sido silenciosamente abandonados."
 me_horn_of_africa_34.a:0 "Nuestro pueblo debe encontrar su salvación en los desiertos."
 me_horn_of_africa_34_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_5$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_35_title:0 "$02_horn_of_africa_task_6$"
 me_horn_of_africa_35_desc:0 "[ROOT.GetCountry.GetRuler.GetName], en un esfuerzo por fortalecer el #E tesoro de Eritrea#!, ha invertido oro y dinero para aumentar la producción de #E diamantes indios#! @gems!. Cuatro ciudades que fueron cuidadosamente seleccionadas por el [ROOT.GetCountry.GetRulerTitle] vieron un pequeño ejército de ingenieros y arquitectos descender a sus calles, y después de unos meses, sus distritos comerciales se expandieron enormemente.\n\nSi bien tomará algún tiempo hasta que las ganancias regresen al [ROOT.GetCountry.GetCapital.GetName], [ROOT.GetCountry.GetRuler.GetFirstName] no tiene ninguna duda de que esta iniciativa dará dividendos con el tiempo."
 me_horn_of_africa_35.a:0 "El mundo merece experimentar el lujo de los diamantes indios..."
 me_horn_of_africa_35_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_6$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_36_title:0 "$02_horn_of_africa_task_2$"
 me_horn_of_africa_36_desc:0 "Los visitantes de [ROOT.GetCountry.GetName] a menudo tienen dificultades para discernir los orígenes de su gente; ¿Es un reino #E africano#! que ha conquistado toda #E Arabia#!, o es al revés? A lo largo de los años, los idiomas entre las dos regiones se han desdibujado, con muchos préstamos compartidos entre los dialectos comunes, e incluso el estilo de vestir es similar.\n\n[ROOT.GetCountry.GetRuler.GetName] se enorgullece de observar las similitudes entre los pueblos que viven a cientos de kilómetros de distancia uno del otro, tomándolo como prueba de que [ROOT.GetCountry.GetRuler.GetHerHis] las políticas internas que enfatizan la coexistencia pacífica están funcionando. Los excedentes de Arabia, tanto en bienes como en mano de obra, añaden fuerza al reino multifacético, uniendo a todos en la búsqueda de un bien común."
 me_horn_of_africa_36.a:0 "Todos somos eritreos, independientemente de las circunstancias de nuestro nacimiento."
 me_horn_of_africa_36_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_2$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_37_title:0 "$02_horn_of_africa_task_8$"
 me_horn_of_africa_37_desc:0 "Hace muchos años, cuando [ROOT.GetCountry.GetRuler.GetName] era niño, [ROOT.GetCountry.GetRuler.GetSheHe] recuerda una época en la que hubo una hambruna en [ROOT.GetCountry.GetCapital.GetName], y miles de ciudadanos hambrientos, incapaces de pagar el precio del pan, marcharon hacia las principales plazas de la ciudad y casi quemaron un granero vacío. Este horrible suceso causó una profunda impresión en el joven [ROOT.GetCountry.GetRulerTitle], quien prometió nunca olvidar las lecciones aprendidas ese día; una ciudad siempre está a tres comidas de la anarquía. Para evitar que sucediera lo impensable, se tomó la decisión de cultivar cantidades masivas de cultivos en el sur de #E India#! para enviar un flujo constante de cereales de regreso a la capital."
 me_horn_of_africa_37.a:0 "El pueblo nunca morirá de hambre, mientras yo gobierne [ROOT.GetCountry.GetName]"
 me_horn_of_africa_37_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_8$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_38_title:0 "$02_horn_of_africa_task_9$"
 me_horn_of_africa_38_desc:0 "Aunque los antepasados de [ROOT.GetCountry.GetRuler.GetName] permanecieron fieles a [GetDeityDefinition('omen_waaq').GetName], el [ROOT.GetCountry.GetRuler.GetName] ha sido persuadido por revelación personal de que #E Dador de lluvia#! y [GetDeityDefinition('omen_brahma').GetName] son la misma manifestación de una verdad universal singular. Bajo una inmensa presión, la casa real se convirtió a la #E Fe védica#!, para no incurrir en la ira de los piadosos [ROOT.GetCountry.GetRulerTitle], y se hacían sacrificios a los #E dioses indios#! diariamente en la capital, [ROOT.GetCountry.GetCapital.GetName]."
 me_horn_of_africa_38.a:0 "Debemos seguir la convicción de mi corazón."
 me_horn_of_africa_38_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_9$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_39_title:0 "$02_horn_of_africa_task_10$"
 me_horn_of_africa_39_desc:0 "Cuando [ROOT.GetCountry.GetRuler.GetName] dijo a las familias reales que vivían en la antigua capital que la sede del poder de [ROOT.GetCountry.GetName] se trasladaría a través del #E Mare Erythraeum#! a la lejana #E India#!, hubo una conmoción casi universal y, a decir verdad, incluso hubo algunas conspiraciones amotinadas que fueron reprimidas por los agentes del despiadado [ROOT.GetCountry.GetRulerTitle], que habían anticipado la resistencia y se habían preparado para lo peor.\n\nAunque muchos lloraron lágrimas genuinas al abandonar su patria tradicional, se vieron obligados a fingir sus sentimientos ante el exuberante [ROOT.GetCountry.GetRuler.GetFirstName], quien estaba tremendamente emocionado por lo que estaba por venir."
 me_horn_of_africa_39.a:0 "¡Nuestra verdadera historia eritrea comienza hoy!"
 me_horn_of_africa_39_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_10$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_40_title:0 "$02_horn_of_africa_task_11$"
 me_horn_of_africa_40_desc:0 "Con un gran coste, [ROOT.GetCountry.GetRuler.GetName] ha invertido en la infraestructura de las ciudades macrobianas más importantes del #E Cuerno de África#!; un gesto que ha ganado [ROOT.GetCountry.GetRulerTitle] la admiración y los elogios de las numerosas familias nobles que viven en las antiguas ciudades costeras.\n\nMuchos habían creído alguna vez que [ROOT.GetCountry.GetRuler.GetFirstName] estaba más preocupado por atender las posesiones de ultramar de [ROOT.GetCountry.GetName] y habían acusado a [ROOT.GetCountry.GetRuler.GetHerHim] de descuidar [ROOT.GetCountry.GetRuler.GetHerHis] deberes tradicionales, pero todos han sido silenciados por esta reciente demostración de generosidad real."
 me_horn_of_africa_40.a:0 "África es de donde venimos y sigue siendo la fuente de nuestra fuerza."
 me_horn_of_africa_40_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_11$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_41_title:0 "$02_horn_of_africa_task_12$"
 me_horn_of_africa_41_desc:0 "Aunque tomó cinco arduos años completarlo, cuando finalmente se terminó la carretera que conecta las ciudades costeras de [GetProvince('(int32)7519').GetName] y [GetProvince('(int32)7521').GetName] con [GetProvince('(int32)7506').GetName], hubo celebraciones en todo [ROOT.GetCountry.GetName], especialmente en el [ROOT.GetCountry.GetCapital.GetName]. Ahora, el traicionero viaje a través de la provincia [GetProvince('(int32)7542').GetArea.GetName] sería mucho más fácil de recorrer, y la robusta carretera permitiría a nuestros ejércitos un acceso rápido a las tierras altas rocosas de #E África#!."
 me_horn_of_africa_41.a:0 "África sigue siendo el corazón palpitante de nuestro reino"
 me_horn_of_africa_41_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_12$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_42_title:0 "$02_horn_of_africa_task_13$"
 me_horn_of_africa_42_desc:0 "[ROOT.GetCountry.GetRuler.GetName] nunca ha sido tentado por ninguna de las extrañas religiones que [ROOT.GetCountry.GetRuler.GetSheHe] ha encontrado en la vida, habiendo hecho juramentos a una edad temprana de permanecer fiel al único dios verdadero [GetDeityDefinition('omen_waaq').GetName]. Aunque [ROOT.GetCountry.GetRulerTitle] gobierna un reino que abarca muchos credos y deidades extranjeras, hacer cumplir la unidad religiosa siempre ha sido una prioridad para [ROOT.GetCountry.GetRuler.GetHerHim], y una vez que el poder supremo fue [ROOT.GetCountry.GetRuler.GetHerHis], [ROOT.GetCountry.GetRuler.GetSheHe] no dudó en utilizar todos los recursos de [ROOT.GetCountry.GetName] para promover esta agenda."
 me_horn_of_africa_42.a:0 "Las bendiciones de Waaq se han manifestado"
 me_horn_of_africa_42_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_13$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_43_title:0 "$02_horn_of_africa_task_14$"
 me_horn_of_africa_43_desc:0 "Si bien la gran ciudad de [GetProvince('(int32)7506').GetName] siempre ha sido una potencia regional, la influencia de la capital regional ha crecido enormemente bajo el gobierno de [ROOT.GetCountry.GetRuler.GetName].\n\nEl [ROOT.GetCountry.GetRuler.GetCulture.GetName] [ROOT.GetCountry.GetRulerTitle] de [ROOT.GetCountry.GetName] ve a Aksum como la capital no oficial de las provincias occidentales, y un pequeño ejército de burócratas y funcionarios de [ROOT.GetCountry.GetCapital.GetName] se han trasladado al oeste para ayudar a administrar la región."
 me_horn_of_africa_43.a:0 "Aksum se ha convertido verdaderamente en una ciudad de clase mundial bajo mi reinado."
 me_horn_of_africa_43_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_14$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_44_title:0 "$02_horn_of_africa_task_15$"
 me_horn_of_africa_44_desc:0 "Mientras que la mayoría de los Gobernantes estarían contentos con lo que [ROOT.GetCountry.GetRuler.GetName] ya ha logrado, el [ROOT.GetCountry.GetRuler.GetCulture.GetName] [ROOT.GetCountry.GetRulerTitle] no es alguien que se duerma en los [ROOT.GetCountry.GetRuler.GetHerHis] laureles.\n\nA medida que la mayor campaña de construcción jamás vista en #E África#! llega a su fin, el irascible [ROOT.GetCountry.GetRuler.GetFirstName] se ha estado quejando de que algunos barcos están evitando nuestros puertos con la esperanza de evitar tener que pagar tasas de importación por sus cargamentos. [GetProvince('(int32)583').GetName] en el #E Sinus Arabus#! se ha convertido en un destino popular para los comerciantes que buscan eludir sus obligaciones fiscales, y sólo queda una solución para [ROOT.GetCountry.GetName]."
 me_horn_of_africa_44.a:0 "Preparemos nuestros buques de guerra para una invasión de Troglodytica..."
 me_horn_of_africa_44_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_15$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_45_title:0 "$02_horn_of_africa_task_16$"
 me_horn_of_africa_45_desc:0 "No importa lo que uno desee, lo puede encontrar en los mercados de [ROOT.GetCountry.GetName]; Si tu cocina requiere las raras especias @spices! de la #E India#! para preparar una comida suculenta digna de un emperador, entonces tu única opción es comprarlas a un comerciante #E Erythraean#!. Y si un templo desea honrar a su dios con una ofrenda del mejor incienso @incense!, lo más probable es que proceda de un intermediario eritreo. Y lo mismo puede decirse de la mirra @myrrh!: en verdad, el nombre Erythraean es sinónimo de alta calidad y extravagancia, y sus productos se pueden encontrar en todo el mundo civilizado."
 me_horn_of_africa_45.a:0 "Los eritreos son conocidos como los #E 'Señores del lujo'#! por esta misma razón"
 me_horn_of_africa_45_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_16$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_46_title:0 "$02_horn_of_africa_task_17$"
 me_horn_of_africa_46_desc:0 "Para proteger sus posesiones en el extranjero y garantizar que el comercio fluya sin perturbaciones, [ROOT.GetCountry.GetName] controla una extensa red de puertos, que se han convertido en el hogar de algunos de los mejores marineros y armadores del mundo. Gracias a su experiencia y conocimientos náuticos, los eritreos pueden construir embarcaciones marítimas mucho más rápidamente que sus vecinos, lo que prácticamente garantiza que seguirán dominando las aguas abiertas."
 me_horn_of_africa_46.a:0 "Nuestra fuerza viene del mar: esto es una realidad"
 me_horn_of_africa_46_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_17$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_47_title:0 "$02_horn_of_africa_task_18$"
 me_horn_of_africa_47_desc:0 "La revisión del sistema de acuñación introducida por [ROOT.GetCountry.GetRuler.GetName] fue uno de los acontecimientos más importantes que tuvo lugar en la larga e histórica historia de [ROOT.GetCountry.GetName], pero esto difícilmente podía saberse en ese momento; el macrobiano [ROOT.GetCountry.GetRulerTitle] simplemente creía que [ROOT.GetCountry.GetRuler.GetSheHe] simplemente estaba haciendo la vida más fácil a los comerciantes, soldados y comerciantes que operaban dentro de [ROOT.GetCountry.GetRuler.GetHerHis] fronteras mediante la emisión de un nuevo tipo de moneda.\n\nSe introdujeron tres monedas, una para cada una de las masas de tierra gobernadas por los eternos eritreos y con motivos artísticos de todas las regiones de su dominio; la más grande y pesada, una moneda de oro conocida como #E 'Stater Erythraean'#!, pronto se convertiría en la moneda preferida para todas las transacciones a gran escala realizadas a nivel internacional. Se acuñó una moneda de plata, conocida para siempre como #E 'Sheban Shekel'#!, para pagar a las numerosas tropas estacionadas en #E Arabia#!, aunque muchas de estas monedas eventualmente se encontrarían en lugares tan lejanos como [GetProvince('(int32)2109').GetName] y [GetProvince('(int32)6749').GetName]. El más pequeño de los tres, el #E 'As indio'#!, estaba hecho de cobre y circulaba ampliamente por todo el reino de Eritrea, siendo utilizado por la gente común en la mayoría de sus compras diarias.\n\nDurante los siguientes mil años, las monedas de [ROOT.GetCountry.GetRuler.GetFirstName] se convertirían en la moneda de facto de #E África#!, #E Arabia#! y #E India#!, y fueron fundamentales en la adopción de la #E escritura eritrea#!. Aunque el nombre de [ROOT.GetCountry.GetRuler.GetHerHis] fue casi olvidado a lo largo de los siglos, el rostro de [ROOT.GetCountry.GetRuler.GetHerHis], que aparece en el anverso de cada stater, sería conocido prácticamente en todo el mundo, y se ha dicho que [ROOT.GetCountry.GetRuler.GetFirstName] tiene el rostro más famoso de la antigüedad."
 me_horn_of_africa_47.a:0 "Acuñaré monedas a mi semejanza y fortaleceré nuestra moneda."
 me_horn_of_africa_47_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_18$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_48_title:0 "$02_horn_of_africa_task_19$"
 me_horn_of_africa_48_desc:0 "Se ha dicho que aquellos que tienen la suerte de vivir dentro de las fronteras de [ROOT.GetCountry.GetName] son verdaderamente bendecidos, porque la paz y la seguridad garantizadas por la Casa gobernante de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] no se parecen a ninguna que hayan disfrutado anteriormente los habitantes de su reino.\n\nLos ingresos fiscales crecen cada año, las fronteras se expanden, nuestro conocimiento aumenta, nuestro número aumenta y los corazones de la gente se alegran."
 me_horn_of_africa_48.a:0 "¡Que siempre recordemos de dónde venimos!"
 me_horn_of_africa_48_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_19$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_49_title:0 "$02_horn_of_africa_task_20$"
 me_horn_of_africa_49_desc:0 "Debido a que [ROOT.GetCountry.GetName] es conocida por la variedad de artículos comerciales de lujo que se pueden encontrar en sus ciudades, el ambicioso [ROOT.GetCountry.GetRuler.GetName] decidió construir el emporio más grande del mundo, conocido como el #E 'Gran Bazar Eritreo'#!, en la afortunada ubicación de [GetProvince('(int32)6915.').GetName].\n\nKoti es una ciudad tan buena como cualquier otra, razonó. [ROOT.GetCountry.GetRuler.GetFirstName], y es un destino importante para el comercio que viaja por tierra y mar. El [ROOT.GetCountry.GetRulerTitle] disfrutó del rápido acceso del lugar al mar, así como de su clima templado. También había otra razón secreta, una que a [ROOT.GetCountry.GetRuler.GetFirstName] le daría vergüenza admitir pero no negaría; [ROOT.GetCountry.GetRuler.GetSheHe] prefería la cocina india por encima de todas las demás."
 me_horn_of_africa_49.a:0 "Koti es uno de mis lugares favoritos, la verdad sea dicha."
 me_horn_of_africa_49_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_20$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_50_title:0 "$02_horn_of_africa_task_21$"
 me_horn_of_africa_50_desc:0 "Debido a que [ROOT.GetCountry.GetName] es conocida por la variedad de artículos comerciales de lujo que se pueden encontrar en sus ciudades, el ambicioso [ROOT.GetCountry.GetRuler.GetName] decidió construir el emporio más grande del mundo, conocido como el #E 'Gran Bazar Eritreo'#!, en la afortunada ubicación de [GetProvince('(int32)7216.').GetName].\n\nA lo largo de los años, la isla se ha convertido en una de las más pobladas. Lugares en el #E Mare Erythraeum#!, con propiedades frente al mar en la ciudad vieja que cuestan decenas de miles de monedas de oro. Las personas más ricas del mundo han hecho de Sarapis su hogar, y todo lo que uno desee se puede encontrar en sus mercados."
 me_horn_of_africa_50.a:0 "¡He construido la ciudad más grandiosa del mundo entero!"
 me_horn_of_africa_50_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_21$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_53_title:0 "$02_horn_of_africa_task_22$"
 me_horn_of_africa_53_desc:0 "La vida en la #E Armada Eritrea#! es difícil en los mejores tiempos, ya que sus marineros son la primera línea de defensa cuando se trata de proteger los numerosos territorios de [ROOT.GetCountry.GetName]. Mucho antes de que los ejércitos de Eritrea lleguen a escena, la marina ya ha asegurado las playas y rutas marítimas de la región para garantizar que las líneas de suministro permanezcan abiertas y el comercio continúe fluyendo.\n\nNo sorprende saber que los formidables marineros han trabajado en técnicas para reparar sus embarcaciones mientras aún navegan; El tiempo es un bien preciado y se aprovechan las muchas semanas que se pasan cruzando los océanos."
 me_horn_of_africa_53.a:0 "Le debemos todo lo que somos a nuestra Armada."
 me_horn_of_africa_53_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_22$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_54_title:0 "$02_horn_of_africa_task_23$"
 me_horn_of_africa_54_desc:0 "Aunque la #E Casa de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#! es la autoridad incuestionable que gobierna [ROOT.GetCountry.GetName], los líderes de los diversos #E gremios de comerciantes#! que operan dentro del reino ejercen un poder considerable por derecho propio; muchos de ellos son personalmente más ricos que reyes y emperadores.\n\nY así, cuando los jefes de estas asociaciones solicitaron una audiencia con el [ROOT.GetCountry.GetRulerTitle], afirmando que necesitaban discutir asuntos de suma importancia, [ROOT.GetCountry.GetRuler.GetName] no dudó y accedió a reunirse con ellos de inmediato.\n\nLa llegada de [SCOPE.sCharacter('random_merchant_one').GetName] y [SCOPE.sCharacter('random_merchant_two').GetName], dos de los hombres más ricos que viven en #E África#! y #E Arabia#!, al palacio real en [ROOT.GetCountry.GetCapital.GetName] fue el evento social del año, y [ROOT.GetCountry.GetRuler.GetFirstName] no escatimó en gastos, quien quiso recordar a [ROOT.GetCountry.GetRuler.GetHerHis] invitados que [ROOT.GetCountry.GetRuler.GetSheHe] era capaz de superarlos en generosidad y esplendor.\n\nUna tarde, los tres se reunieron a solas en los jardines reales, y los dos magnates finalmente comunicaron el motivo de su visita. Los hombres tenían una petición audaz; estaban pidiendo al [ROOT.GetCountry.GetRulerTitle] que concediera una amnistía fiscal de diez años sobre todas las importaciones y exportaciones dentro del #E Mare Erythraeum#!. Su razón era simple; querían utilizar su riqueza e influencia para exprimir a los demás comerciantes y consolidar sus ya sustanciales propiedades. En esencia, los dos hombres pedían [ROOT.GetCountry.GetRuler.GetFirstName] un control económico temporal sobre sus países de origen: una petición enorme.\n\nA cambio de permitir a los comerciantes operar dentro de nuestras fronteras sin pagar ninguna tarifa, ofrecerían [ROOT.GetCountry.GetRuler.GetName] una gran suma global por adelantado, así como garantías de que apoyarían a [ROOT.GetCountry.GetRuler.GetHerHim] políticamente en los días venideros."
 me_horn_of_africa_54.a:0 "Supongo que los términos de este acuerdo son aceptables."
 me_horn_of_africa_54.b:0 "En su lugar, ofrezca una propuesta de cinco años."
 me_horn_of_africa_54.c:0 "Pensándolo bien, no haremos ninguna concesión."
 me_horn_of_africa_54_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_23$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_55_title:0 "$02_horn_of_africa_task_24$"
 me_horn_of_africa_55_desc:0 "Muchos de los armadores que trabajan en los puertos de [ROOT.GetCountry.GetName] han pasado toda su vida con martillo, cincel y sierra en mano, y algunos de los mejores trabajadores, como los que viven en [GetProvince('(int32)7523').GetName], pueden construir un barco en un tiempo récord. Contentos con lo que son capaces de hacer pero deseando llevarlos a mayores alturas, [ROOT.GetCountry.GetRuler.GetName] les ha permitido experimentar con sus técnicas de construcción con la esperanza de lograr un gran avance.\n\nGracias a su experiencia y conocimiento técnico, los trabajadores han podido introducir nuevos diseños que permiten a nuestras naves ligeras viajar más rápido que nunca, un movimiento que prácticamente ha asegurado el dominio eritreo continuo de las olas."
 me_horn_of_africa_55.a:0 "Necesitamos los barcos más rápidos, ¡así que esta es una noticia increíble!"
 me_horn_of_africa_55_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_24$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_56_title:0 "$02_horn_of_africa_task_25$"
 me_horn_of_africa_56_desc:0 "Debido a que [ROOT.GetCountry.GetName] es conocida por la variedad de artículos comerciales de lujo que se pueden encontrar en sus ciudades, el ambicioso [ROOT.GetCountry.GetRuler.GetName] decidió construir el emporio más grande del mundo, conocido como el #E 'Gran Bazar Eritreo'#!, en la afortunada ubicación de [ROOT.GetCountry.GetCapital.GetName].\n\nNo es exagerado afirmar que la capital es ahora una de las ciudades más grandes del mundo, un centro de civilización y comercio que rivaliza con todo lo que se puede encontrar en otros lugares, y los afortunados eritreos son los más ricos de todos los pueblos."
 me_horn_of_africa_56.a:0 "¡Todo esto es gracias a lo que he hecho!"
 me_horn_of_africa_56_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_25$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_57_title:0 "$02_horn_of_africa_task_26$"
 me_horn_of_africa_57_desc:0 "En #E Arabia#!, hay muchas tribus errantes de #E beduinos#! que viven en las afueras de la sociedad, visitan las ciudades cuando necesitan suministros pero prefieren pasar el tiempo en sus campamentos en el desierto. Normalmente, el status quo sería aceptable para todas las partes involucradas, pero [ROOT.GetCountry.GetRuler.GetName] tenía un problema y pidió a los miembros de la tribu una solución. \n\nAl darse cuenta de que [ROOT.GetCountry.GetName] requería unidades militares para imponer la paz en las muchas ciudades del reino (mano de obra que sería muy necesaria en otros lugares), [ROOT.GetCountry.GetRuler.GetCulture.GetName] [ROOT.GetCountry.GetRulerTitle] preguntó a los beduinos si estarían dispuestos a servir al reino. De esta manera; una propuesta que aceptaron. Esta medida siguió siendo impopular entre la gente común, a muchos de los cuales les molestaba tener una fuerza policial extranjera patrullando sus ciudades, pero [ROOT.GetCountry.GetRuler.GetFirstName] ignoró todas sus quejas."
 me_horn_of_africa_57.a:0 "Estos guerreros del desierto asegurarán nuestra tranquilidad doméstica."
 me_horn_of_africa_57_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_26$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_59_title:0 "$02_horn_of_africa_task_27$"
 me_horn_of_africa_59_desc:0 "La visión de una compañía de mercenarios marchando por los caminos polvorientos de [ROOT.GetCountry.GetName] no es un hecho poco común, ya que las autoridades que gobiernan en [ROOT.GetCountry.GetCapital.GetName] han dejado claro que prefieren utilizar soldados contratados en lugar de desplegar sus propios ejércitos.\n\nEsto no quiere decir que los eritreos no estén dispuestos a luchar por sus posesiones; todo lo contrario. A la hora de la verdad, son más que capaces de desplegar ejércitos que se encuentran entre los más fuertes del mundo, pero [ROOT.GetCountry.GetRuler.GetName] prefieren gastar dinero primero y salvar las vidas de los hombres libres que viven en el reino."
 me_horn_of_africa_59.a:0 "Nuestra gente debería trabajar en los campos y talleres, no morir en la batalla."
 me_horn_of_africa_59_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_27$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_60_title:0 "$02_horn_of_africa_task_28$"
 me_horn_of_africa_60_desc:0 "Había muchas personas que vivían dentro de [ROOT.GetCountry.GetName] que no estaban de acuerdo con la decisión de [ROOT.GetCountry.GetRuler.GetFirstName] de trasladar la capital imperial a [GetProvince('(int32)7216').GetName], a pesar de que la isla era conocida por ser un paraíso para vivir, bendecida con abundancia de comida, sol y una vida tranquila.\n\nA pesar de las protestas, [ROOT.GetCountry.GetRulerTitle] trasladó la sede oficial del poder de los eritreos a la costa árabe. Proclamando la medida como el comienzo de una nueva era."
 me_horn_of_africa_60.a:0 "¡A partir de este día comienza nuestra verdadera historia!"
 me_horn_of_africa_60_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_28$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_61_title:0 "$02_horn_of_africa_task_29$"
 me_horn_of_africa_61_desc:0 "Aunque los logros de [ROOT.GetCountry.GetRuler.GetName] se basan en sus propios méritos, algo que siempre ha molestado a [ROOT.GetCountry.GetRuler.GetCulture.GetName] [ROOT.GetCountry.GetRulerTitle] es la falta de [ROOT.GetCountry.GetRuler.GetHerHis] pedigrí real; Los antepasados de [ROOT.GetCountry.GetRuler.GetFirstName] eran notables por derecho propio, pero todo el mundo sabe que los progenitores de [ROOT.GetCountry.GetRuler.GetHerHis] eran de estirpe común.\n\nY así, cuando una rama cadete de la #E Casa de Saba#! envió un mensaje clandestino al [ROOT.GetCountry.GetCapital.GetName] con una propuesta de matrimonio, [ROOT.GetCountry.GetRuler.GetFirstName] no dudó en aceptar, sin importar las complicaciones. Que este acuerdo causaría. A pesar de las protestas de algunos de los conservadores que viven en la capital, la ceremonia nupcial se celebró de inmediato y [ROOT.GetCountry.GetRuler.GetFirstName] fue adoptada formalmente por otro miembro de la Casa Real Sabea, prácticamente asegurando que el linaje sabeo se transmitiría."
 me_horn_of_africa_61.a:0 "Que nuestros hijos gobiernen [ROOT.GetCountry.GetName] para siempre"
 me_horn_of_africa_61_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_29$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_62_title:0 "$02_horn_of_africa_task_30$"
 me_horn_of_africa_62_desc:0 "Los viajeros a #E Arabia#! a menudo se sorprenden al ver enormes ciudades aparecer aparentemente de la nada, y muchos expresan alivio al descubrir estos puestos avanzados de la civilización en una tierra de colinas arenosas y llanuras interminables que se extienden hasta donde alcanza la vista.\n\nSi bien muchos conquistadores extranjeros se contentarían con extraer la riqueza de Arabia y dejarla como un remanso, [ROOT.GetCountry.GetRuler.GetName] ha tomado lo contrario. Enfoque y ha gastado grandes sumas de dinero para garantizar que las ciudades bajo control #E Erythraean#! estén bien atendidas. Se han construido muros de piedra gigantes, pero también bibliotecas, academias, graneros y fuentes, y el agradecido pueblo de Arabia cree que [ROOT.GetCountry.GetRuler.GetFirstName] les fue enviado por sus dioses."
 me_horn_of_africa_62.a:0 "¡Arabia es una parte importante de [ROOT.GetCountry.GetName] y siempre lo será!"
 me_horn_of_africa_62_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_30$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_63_title:0 "$02_horn_of_africa_task_31$"
 me_horn_of_africa_63_desc:0 "[ROOT.GetCountry.GetRuler.GetName], te complacerá saber que nuestros reclamos sobre la región [GetProvince('(int32)6859').GetArea.GetName] se han completado, y todo lo que te queda por hacer es dar a nuestros ejércitos la orden de atacar.\n\nSin duda, podemos esperar una fuerte resistencia de los lugareños, ¡pero esto solo garantiza que nuestras tropas aguarden una batalla gloriosa!"
 me_horn_of_africa_63.a:0 "Muy bien, muy bien..."
 me_horn_of_africa_63_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_31$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_64_title:0 "$02_horn_of_africa_task_32$"
 me_horn_of_africa_64_desc:0 "El comercio está prosperando como nunca antes en la provincia de [GetProvince('(int32)6859').GetArea.GetName], impulsado no sólo por las mejoras de infraestructura erigidas bajo la supervisión de [ROOT.GetCountry.GetRuler.GetName], sino también por la presencia de #E buques de guerra erythraean#! en los puertos y #E beduinos#! patrullando las calles de la ciudad. Gracias a la llamada #E [ROOT.GetCountry.GetRulerTitle] Paz#! que se ha impuesto en la región, se ha iniciado una era de estabilidad y crecimiento."
 me_horn_of_africa_64.a:0 "Este es exactamente el resultado deseado que tenía en mente."
 me_horn_of_africa_64_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_32$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_65_title:0 "$02_horn_of_africa_task_33$"
 me_horn_of_africa_65_desc:0 "Se cree que los numerosos enemigos de [ROOT.GetCountry.GetName] luchan por llenar sus barcos con marineros competentes, ya que muchos temen encontrarse con una #E Flota de Guerra Eritrea#!, lo que es prácticamente una sentencia de muerte. Las armadas de [ROOT.GetCountry.GetRuler.GetName] han enviado miles de barcos al fondo del océano, y también son conocidas por capturar una buena cantidad de barcos enemigos, un motivo de orgullo para los marines de Erythraean, que se creen los mejores marineros vivos."
 me_horn_of_africa_65.a:0 "¿Quién puede discutir con ellos?"
 me_horn_of_africa_65_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_33$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_66_title:0 "$02_horn_of_africa_task_34$"
 me_horn_of_africa_66_desc:0 "Había muchos que vivían dentro de la [ROOT.GetCountry.GetName] que lamentaban la conversión religiosa de [ROOT.GetCountry.GetRuler.GetName], pero nadie se atrevía a criticar públicamente al todopoderoso [ROOT.GetCountry.GetRulerTitle], para no incurrir en la ira del piadoso Gobernante.\n\nAunque la #E Casa de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#! ejercía inmensas presiones sobre los que vivían dentro de la capital para convertirse en el #E Panteón Árabe#!, la mayoría de los ciudadanos que viven en el [ROOT.GetCountry.GetCapital.GetName] prometieron continuar adorando a [GetDeityDefinition('omen_waaq').GetName]."
 me_horn_of_africa_66.a:0 "¿Cómo podría [ROOT.GetCountry.GetRuler.GetFirstName] olvidarse de Waaq?"
 me_horn_of_africa_66_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_34$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_67_title:0 "$02_horn_of_africa_task_35$"
 me_horn_of_africa_67_desc:0 "Durante muchos años, las autoridades que vivían en #E India#! arrestaron a profetas y santos extranjeros, ya que los lugareños no querían oír hablar de dioses y deidades extraños, una práctica que ha sido oficialmente prohibida por [ROOT.GetCountry.GetRuler.GetName] como parte de [ROOT.GetCountry.GetRuler.GetHerHis] revisión del código cívico que gobierna las provincias indias.\n\nLos piadosos [ROOT.GetCountry.GetRulerTitle] Acordaron extender los derechos de ciudadanía a algunos de los indios que vivían dentro de [ROOT.GetCountry.GetName], pero tendrían que permitir a los sabios de #E África#! y #E Arabia#! libre acceso a sus ciudades, y ya no podrían ser encarcelados por predicar o hacer proselitismo. Para recibir estas importantes concesiones, las autoridades indias aceptaron, y ahora se ha establecido en la tierra un período de armonía religiosa y social."
 me_horn_of_africa_67.a:0 "Una solución elegante a un problema delicado"
 me_horn_of_africa_67_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_35$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_68_title:0 "$02_horn_of_africa_task_36$"
 me_horn_of_africa_68_desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha pasado muchas horas leyendo y memorizando los textos sagrados de la #E Fe Védica#!, encontrando que sus palabras son una luz en tiempos de oscuridad y una inspiración para la vida diaria. Deseando que todos los ciudadanos de [ROOT.GetCountry.GetName] puedan beneficiarse de las sagradas palabras de los #E sabios indios#!, el [ROOT.GetCountry.GetRulerTitle] ha gastado grandes sumas de dinero para que los preceptos y aforismos de los Sabios queden grabados permanentemente en enormes estelas de piedra."
 me_horn_of_africa_68.a:0 "¡Colocad los Textos Sagrados en los foros y plazas de mis ciudades!"
 me_horn_of_africa_68_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_36$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_69_title:0 "$02_horn_of_africa_task_37$"
 me_horn_of_africa_69_desc:0 "El [GetDateString], [ROOT.GetCountry.GetRuler.GetName] y [SCOPE.sCharacter('military_tech_office_holder_scope').GetName] implementaron una política que tendría ramificaciones a largo plazo para los ejércitos de [ROOT.GetCountry.GetName]; las tácticas militares de los #E Reinos indios#! y las #E Tribus indias#! fueron adoptadas oficialmente en todo el reino. A partir de ese día, nuestros soldados y levas utilizarían los estilos de lucha y las formaciones de todas las culturas que viven dentro de sus fronteras."
 me_horn_of_africa_69.a:0 "Nuestros ejércitos se hacen cada vez más fuertes: ¡somos invencibles!"
 me_horn_of_africa_69_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_37$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_70_title:0 "$02_horn_of_africa_task_38$"
 me_horn_of_africa_70_desc:0 "En una señal de su creciente poder e influencia económica y cultural, los #E Censores Reales#! que viven en la capital han informado felizmente a [ROOT.GetCountry.GetRuler.GetName] que [ROOT.GetCountry.GetName] ahora gobierna más de cien ciudades, una hazaña que no es poca cosa y que debería ser celebrada por todos los #E eritreos#!."
 me_horn_of_africa_70.a:0 "Queda mucho más trabajo por hacer"
 me_horn_of_africa_70_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_38$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_71_title:0 "$02_horn_of_africa_task_39$"
 me_horn_of_africa_71_desc:0 "Una de las islas más valiosas dentro de [ROOT.GetCountry.GetName] tiene que ser [GetProvince('(int32)7216').GetName], ya que la isla no solo sirve como puerta de entrada a #E Arabia#!, sino que también actúa como un embudo para su riqueza. Su puerto permanece activo cada hora del día y de la noche, gracias a un flujo interminable de barcos que llegan, y muchos de los comerciantes que operan en su mundialmente famoso #E Souq#! son algunos de los hombres más ricos del mundo."
 me_horn_of_africa_71.a:0 "El éxito de Sarapis es un ejemplo a emular"
 me_horn_of_africa_71_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_39$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_72_title:0 "$02_horn_of_africa_task_40$"
 me_horn_of_africa_72_desc:0 "Durante muchos años, [ROOT.GetCountry.GetRuler.GetName] se vio obligado a entrenar esclavos que fueran hábiles en la lectura no sólo de las escrituras #E meroítica#! y #E sabaea#!, sino que también tuvieran una familiaridad pasajera con los lenguajes escritos de la #E India#! - una tarea que era costosa y difícil, y requería muchos años de entrenamiento.\n\nHabiendo decidido que ya era suficiente y que la casa real ya no soportaría cargas tan onerosas, el ambicioso [ROOT.GetCountry.GetRulerTitle] decidió estandarizar los innumerables sistemas de escritura de los #E eritreos#! en uno solo, y emitió un decreto por el cual todas las correspondencias y acuerdos comerciales realizados dentro de las fronteras de nuestro reino tendrían que utilizar este nuevo script.\n\nAunque inicialmente hubo cierta resistencia a adoptarlo, con el tiempo, la #E escritura eritrea#! pasaría a ser conocida como una de las grandes lenguas del mundo, influyendo incluso en el desarrollo de otros sistemas de escritura en su amplia esfera de influencia."
 me_horn_of_africa_72.a:0 "Nuestro poderoso pueblo merece un idioma propio."
 me_horn_of_africa_72_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_40$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_73_title:0 "Emboscada en la playa"
 me_horn_of_africa_73_desc:0 "Después de muchas semanas de navegación sin incidentes, nuestra armada llegó cerca de [GetProvince('(int32)8281').GetName] e inmediatamente comenzó a desembarcar en sus costas. [ROOT.GetCountry.GetRuler.GetName] fue el primero en poner un pie en tierra y estaba en el proceso de ayudar a otros a desembarcar cuando se escuchó un fuerte grito desde el bosque. En ese momento, miles de guerreros #E Lanka#! aparecieron desde las selvas, y decenas de miles de flechas fueron lanzadas a la vez, oscureciendo los cielos.\n\nAl darse vuelta para enfrentar la conmoción, [ROOT.GetCountry.GetRuler.GetFirstName] fue inmediatamente alcanzado en la mejilla por un misil y [ROOT.GetCountry.GetRulerTitle] cayó al suelo, con la cara de [ROOT.GetCountry.GetRuler.GetHerHis] derramando sangre. Los nativos aprovecharon su ventaja y, en cuestión de minutos, los ejércitos de [ROOT.GetCountry.GetName] se enfrentaban a un desastre en toda regla.\n\nPor suerte para [ROOT.GetCountry.GetRuler.GetFirstName], los ayudantes de [ROOT.GetCountry.GetRuler.GetHerHis] pudieron sacar a [ROOT.GetCountry.GetRuler.GetHerHim] del tumulto y el cuerpo maltratado del [ROOT.GetCountry.GetRulerTitle] fue devuelto al buque insignia [ROOT.GetCountry.GetRuler.GetHerHis], donde los cirujanos reales estaban esperando. Su pronóstico era desalentador; podrían salvar el ojo de [ROOT.GetCountry.GetRuler.GetFirstName], pero solo si regresaban a casa de inmediato; si los ejércitos se quedaban y luchaban, entonces no podrían ayudar a [ROOT.GetCountry.GetRuler.GetHerHim]."
 me_horn_of_africa_73.a:0 "¡No navegué hasta aquí sólo para retirarme! Presiona el ataque"
 me_horn_of_africa_73.b:0 "¡Navega lejos! ¡Deberíamos haber escuchado los presagios!"
 
 me_horn_of_africa_74_title:0 "Invasión macrobiana"
 me_horn_of_africa_74_desc:0 "¡Mi [ROOT.GetCountry.GetRulerTitle], tenemos noticias terribles esta mañana! Un ejército africano del lejano oeste apareció de la nada y lanzó una invasión de [GetProvince('(int32)8281').GetName] y [GetProvince('(int32)8282').GetName].\n\nA pesar de haber sido tomados por sorpresa, nuestros soldados lograron tender una emboscada a su grupo de desembarco, matamos a miles de sus guerreros e incluso le quitamos un ojo a su gobernante, el tirano. [SCOPE.sCharacter('invading_macrobian_army_leader_scope').GetName].\n\nAunque luchamos honorablemente, no pudimos evitar que los macrobianos se apoderaran de dos de nuestros territorios... Lo siento, [ROOT.GetCountry.GetRuler.GetName]..."
 me_horn_of_africa_74.a:0 "¡Qué! Esto no puede estar pasando: ¡los destruiremos!"
 me_horn_of_africa_74_tooltip:0 "$mission_completed_tooltip_1$ '#Y Invasión macrobiana#!' $mission_completed_tooltip_2$"
 macrobians_stole_an_island_tt:0 "#R El ejército invasor macrobiano ha capturado#! #T Amindivi#! y #T Laquedivas.#!"
 
 me_horn_of_africa_75_title:0 "Invasión de las Maldivas"
 me_horn_of_africa_75_desc:0 "Cuando el sol empezó a hundirse en el cielo, nuestros guerreros siguieron adelante, luchando valientemente y abrumando a los defensores de [GetProvince('(int32)8281').GetName]. Cientos de isleños, viendo que una mayor resistencia sería inútil, se rindieron con la esperanza de encontrar misericordia, pero sus súplicas fueron ignoradas cuando [ROOT.GetCountry.GetRuler.GetName], maldiciendo de dolor y frustrados por el dolor punzante en [ROOT.GetCountry.GetRuler.GetHerHis] ojo dañado, dieron la orden de decapitar a cada uno de ellos.\n\nLa noticia de esta atrocidad pronto se extendió por todo el este, y hubo dos resultados imprevistos de esto. Incidente, uno bueno y otro malo. Con la moral completamente destrozada y temiendo por sus vidas, el ejército [GetCountry('MDP').GetAdjective] abandonó sus puestos para reunirse nuevamente en su capital, lo que permitió a los macrobianos apoderarse de [GetProvince('(int32)8282').GetName] sin luchar. Satisfecho con estas adquisiciones territoriales, el [ROOT.GetCountry.GetRulerTitle] macrobiano calificó la invasión como un éxito y navegó a casa en el [ROOT.GetCountry.GetCapital.GetName] después de instalar una guarnición en las islas.\n\nY sin embargo, la noticia de la llamada #E 'Masacre macrobiana'#! viajó a lo largo de las rutas comerciales, y cada #E reino indio#! que se enteró del ataque maldijo el nombre de [ROOT.GetCountry.GetRuler.GetFirstName] y [ROOT.GetCountry.GetName]."
 me_horn_of_africa_75.a:0 "¡No vine aquí para hacer amigos! Y un punto de apoyo en #E India#! merece una visita..."
 me_horn_of_africa_75_tooltip:0 "#Y Esto finalizará la cadena de eventos.#!"
 
 me_horn_of_africa_76_title:0 "Perdido en el mar"
 me_horn_of_africa_76_desc:0 "Ha pasado más de un año desde que nuestra expedición de [GetProvince('(int32)8704').GetName] zarpó de su puerto, y al principio, las personas que vivían en [ROOT.GetCountry.GetCapital.GetName] recibían actualizaciones ocasionales de los marineros, pero no hemos oído nada de los aventureros en más de seis meses.\n\nTemiendo lo peor, algunos de los nobles que vivían en la capital pidieron que otra armada se dirigiera al sur con la esperanza de descubrir qué les pasó a nuestros marineros perdidos, pero una El abatido [ROOT.GetCountry.GetRuler.GetName], creyendo que este curso de acción sólo conduciría a más angustia, les negó su solicitud."
 me_horn_of_africa_76.a:0 "No puedo perder otra flota... debemos rezar por los muertos."
 me_horn_of_africa_76_tooltip:0 "$mission_completed_tooltip_1$ '#Y Perdido en el mar#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_77_title:0 "El regreso de la armada raptana"
 me_horn_of_africa_77_desc:0 "Una mañana, tres liburnios maltratados que enarbolaban la bandera de la ciudad de [GetProvince('(int32)8704').GetName] fueron vistos en el horizonte, y mientras nuestros soldados se reunían en el distrito portuario para ver si esta extraña armada estaba comandada por amigos o enemigos, un murmullo de incredulidad se extendió entre la multitud: estos barcos eran parte de la #E Armada Raptana#! que abandonó nuestras tierras hace más de dos décadas.\n\nEl El líder de esta expedición, un anciano canoso conocido como [SCOPE.sCharacter('macrobian_rhaptan_admiral').GetName], fue convocado al [ROOT.GetCountry.GetCapital.GetName] para una audiencia con [ROOT.GetCountry.GetRuler.GetName]. La historia contada por [SCOPE.sCharacter('macrobian_rhaptan_admiral').GetFirstName] era difícil de creer, pero el almirante insistió en que cada palabra era cierta.\n\nHace veinte años, la Armada navegó hacia el sur hasta llegar a una enorme isla que los griegos llaman #E 'Menouthias'#!, y fue aquí donde se encontró la ciudad de #E Rhapta#!. Para sorpresa de [ROOT.GetCountry.GetRulerTitle], los ciudadanos de Rhapta estaban muy conscientes de [ROOT.GetCountry.GetName] y deseaban establecer conexiones comerciales permanentes con nuestra gente, algo que [SCOPE.sCharacter('macrobian_rhaptan_admiral').GetFirstName] estaba orgulloso de lograr para nuestros compatriotas. Se firmaron tratados de entendimiento mutuo entre nuestros representantes y los suyos, y cargados de regalos, nuestros barcos se prepararon para zarpar a casa.\n\nAquí es donde la historia se vuelve difícil, y [SCOPE.sCharacter('macrobian_rhaptan_admiral').GetFirstName] tuvo dificultades para compartir sus pensamientos, deteniéndose cada pocas palabras para beber vino y mirar a lo lejos mientras los amargos recuerdos eclipsaban su mente. Una terrible tormenta en el #E Mare Erythraeum#! dispersó nuestros barcos en el mar, y mientras nuestros hombres intentaban reagruparse, un gigantesco #E monstruo marino#! apareció desde las profundidades del océano y se lanzó contra nuestras embarcaciones, matando a cientos de macrobianos y rompiendo la armada en pedazos. Diez barcos apenas pudieron escapar del terrible ataque cuando todo estuvo dicho y hecho, pero los pobres supervivientes fueron marcados como hombres muertos, ya que sus barcos habían sufrido graves daños y no estaban en condiciones de navegar a casa. Durante semanas, flotaron sin vida en el océano, incapaces de encontrar el viento o la tierra, y muchos macrobianos sucumbieron a la deshidratación o la locura en esas horas desesperadas.\n\nAnte estas abrumadoras probabilidades, nuestros marineros se negaron a darse por vencidos, pero siguieron adelante con la esperanza de regresar a casa de alguna manera. Y su fe fue recompensada, porque pronto encontraron tierra firme y pudieron obtener suministros frescos, pero tuvieron que luchar contra tribus hostiles y muchos de nuestros soldados murieron en las playas de la tierra extraña en la que se encontraban. Muchos de nuestros barcos se perdieron en las rocas, y [SCOPE.sCharacter('macrobian_rhaptan_admiral').GetFirstName] se secó una lágrima de la mejilla mientras relataba haber visto a sus hermanos luchando en el agua mientras los tiburones los comían vivos. El anciano contó historias espantosas durante horas, encantando a todos los presentes con sus hazañas, y muchas de sus historias se pueden encontrar en el #E Periplo#! que lleva su nombre, un tesoro que fue presentado a [ROOT.GetCountry.GetRuler.GetFirstName].\n\nAfortunadamente para [SCOPE.sCharacter('macrobian_rhaptan_admiral').GetFirstName], su historia tuvo un buen final. Durante veinte años, un puñado de nuestros aventureros lograron sobrevivir y, en el proceso, circunnavegaron #E África#! - [SCOPE.sCharacter('macrobian_rhaptan_admiral').GetFirstName] afirma que finalmente llegaron a la entrada occidental del #E Mediterráneo#! y pudieron navegar hacia el #E Sinus Arabus#! después de sobornar al #E alejandrinos#! para permitirles un paso seguro.\n\nDando señal de que estaba demasiado cansado para compartir más detalles de la desafortunada expedición, [SCOPE.sCharacter('macrobian_rhaptan_admiral').GetFirstName] se puso de pie, con la espalda llena de cicatrices arqueada y doblada por los años difíciles, y saludó a [ROOT.GetCountry.GetRuler.GetFirstName]. 'Llegué a casa, mi [ROOT.GetCountry.GetRulerTitle]... Cumplí mi misión.'"
 me_horn_of_africa_77.a:0 "No puedo creer que hayas regresado con vida... ¡es un milagro!"
 me_horn_of_africa_77_tooltip:0 "$mission_completed_tooltip_1$ '#Y El regreso de la armada raptana#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_78_title:0 "$02_horn_of_africa_task_41$"
 me_horn_of_africa_78_desc:0 "Después de muchos años de crecimiento y lucha, finalmente había llegado el momento de que la #E Casa de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#! aceptara su destino: la razón por la que los dioses los habían puesto como gobernantes de [ROOT.GetCountry.GetName]. Ya no serían conocidos como simples reyes, sino que su familia real recibiría el respeto debido a un Emperador o una Emperatriz: los reinos que gobernaban las prósperas rutas comerciales eran un verdadero #E Imperio Eritreo#!. [ROOT.GetCountry.GetRuler.GetName] gobernaba sobre un vasto reino que se extendía desde costas rocosas hasta #E África#! y las selvas de #E India#!, y un centenar de ciudades entre ellas presentaron tributos y se inclinaron ante [ROOT.GetCountry.GetRuler.GetHerHim].\n\nPero hubo quienes se irritaron bajo el gobierno de los [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective], y cuando Se proclamó un #E Imperio#! en [ROOT.GetCountry.GetCapital.GetName], un noble llamado [SCOPE.sCharacter('civil_war_leader').GetName] decidió que había llegado el momento de la guerra civil. Al darse cuenta de que era ahora o nunca, [SCOPE.sCharacter('civil_war_leader').GetFirstName] reunió un ejército de nobles descontentos, en su mayoría ricos terratenientes que no querían ver aumentar sus cargas fiscales, y declaró su independencia."
 me_horn_of_africa_78.a:0 "¡Destruiré a los [SCOPE.sCharacter('civil_war_leader').GetFamilyDisplayAdjective] tontos!"
 me_horn_of_africa_78.b:0 "Te aplastaré, [SCOPE.sCharacter('civil_war_leader').GetFirstName] - eres hombre muerto"
 me_horn_of_africa_78.c:0 "Esto no es nada de qué preocuparse..."
 me_horn_of_africa_78_tooltip:0 "$mission_completed_tooltip_1$ '#Y $02_horn_of_africa_task_41$#!' $mission_completed_tooltip_2$"
 
 me_horn_of_africa_79_title:0 "$01_horn_of_africa_task_26$"
 me_horn_of_africa_79_desc:0 "[ROOT.GetCountry.GetRuler.GetName] descubrió el complot contra [ROOT.GetCountry.GetRuler.GetHerHim] demasiado tarde, y este retraso en darse cuenta fue una señal para [ROOT.GetCountry.GetRulerTitle] de que [ROOT.GetCountry.GetRuler.GetSheHe] estaba peligrosamente fuera de contacto: ninguno de los [ROOT.GetCountry.GetRuler.GetHerHis] supuestos amigos se había acercado a [ROOT.GetCountry.GetRuler.GetHerHim] con la noticia de la creciente conspiración para destituir al jefe de la #E Casa de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#! de poder.\n\nAunque [ROOT.GetCountry.GetRuler.GetFirstName] buscó valientemente aliados en el mes frenético después de que se encontró un pergamino escrito de forma anónima en las cámaras de [ROOT.GetCountry.GetRuler.GetHerHis], las antiguas familias de [ROOT.GetCountry.GetName] fueron vagas con sus ofertas de apoyo, y algunas incluso se negaron a reunirse en persona, y [ROOT.GetCountry.GetRulerTitle] se dio cuenta de que [ROOT.GetCountry.GetRuler.GetSheHe] era condenado.\n\nLa oferta presentada a [ROOT.GetCountry.GetRuler.GetFirstName] no fue terrible; una vida tranquila viviendo en una villa cerca de la costa, una pequeña fortuna con la que jubilarse y la garantía de que [SCOPE.sCharacter('but_thats_my_baby_scope').GetName] viviría hasta el [SCOPE.sCharacter('but_thats_my_baby_scope').GetHerHis] décimo verano. Fue esta última amenaza tácita la que convenció a [ROOT.GetCountry.GetRuler.GetFirstName] de ceder el control, y el pueblo de [ROOT.GetCountry.GetName] se salvó de los estragos de la guerra civil."
 me_horn_of_africa_79.a:0 "Que sea recordado como un guardián de la paz."
 me_horn_of_africa_79_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_horn_of_africa_task_26$#!' $mission_completed_tooltip_2$"
