l_spanish:
 
 01_horn_of_africa:0 "tierra del dios"
 01_horn_of_africa_DESCRIPTION:0 "En las costas bañadas por el sol del #E Cuerno de África#!, se pueden encontrar muchas ciudades-estado #E macrobianas#! enclavadas entre sus colinas desérticas, cada una controlando una pequeña esfera de influencia y compitiendo por el control entre sí. Lamentablemente, esta tarea se ve dificultada por la riqueza de la región, que ha financiado la construcción de fuertes fortificaciones y ha contratado innumerables ejércitos mercenarios para proteger la independencia de las obstinadas ciudades.\n\nAunque hasta ahora nadie ha logrado unir la región bajo una sola bandera, el ambicioso [ROOT.GetCountry.GetRuler.GetName], el [ROOT.GetCountry.GetRulerTitle] de [ROOT.GetCountry.GetName], insta a los [ROOT.GetCountry.GetRuler.GetHerHis] compatriotas para depositar su confianza en [ROOT.GetCountry.GetRuler.GetHerHim]. El líder de la Casa de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] afirma ser elegido por [GetDeityDefinition('omen_waaq').GetName], nuestra deidad suprema, y ha prometido unir a los fieles waaqi y dominar los intereses comerciales que hay dentro de nuestra región.\n\nComo solo hay un dios, Waaq, que solo haya una tierra, la #E 'Tierra del Dios'#!, habitada por Macrobianos que lo adoran."
 01_horn_of_africa_CRITERIA_DESCRIPTION:0 "Esta misión se completará cuando [ROOT.GetCountry.GetName] haya conquistado a sus vecinos macrobianos, haya asegurado las rutas comerciales entre #E África#!, #E Arabia#! y #E India#! y haya formado la #E Liga Eritrea#!."
 01_horn_of_africa_BUTTON_TOOLTIP:0 "¡Que la Poderosa Mano de Waaq nos proteja en los días venideros!"
 01_horn_of_africa_BUTTON_DETAILS: ""
 
 #Missions
 
 01_horn_of_africa_task_1:0 "El cuerno de canela"
 01_horn_of_africa_task_1_DESC:0 "Las ciudades de [GetProvince('(int32)7526').GetArea.GetName|Y] y [GetProvince('(int32)8704').GetArea.GetName|Y] son importantes centros comerciales, donde los embriagadores aromas de canela @spices!, incienso @incense! y mirra @myrrh! llenan las plazas del mercado con sus fragancias embriagadoras.\n\nLas disputas regionales entre los centros de poder rivales que compiten por el control de los ingresos comerciales de Eritrea no son nada nuevo en el #E #R Cinnamon Horn#!#!, y nuestros esfuerzos por reclamar las provincias difícilmente serán reconocido.\n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 
 01_horn_of_africa_task_2:0 "La costa perfumada de Mosylon"
 01_horn_of_africa_task_2_DESC:0 "Algunos de los comerciantes extranjeros que llegan a las ciudades portuarias de las provincias [GetProvince('(int32)7523').GetArea.GetName|Y] y [GetProvince('(int32)8715').GetArea.GetName|Y] se quejan de la empalagosa dulzura de sus bazares; la mirra @myrrh! y el incienso @incense! que se encuentran allí son de la más alta calidad, y cada hora se intercambian pequeñas fortunas entre hombres de negocios.\n\nSi una sola potencia uniera estas poderosas ciudades mercantiles bajo una sola bandera, los ingresos comerciales serían astronómicamente altos, y [ROOT.GetCountry.GetRuler.GetName|Y] ha prometido que [ROOT.GetCountry.GetRuler.GetSheHe] liderará los ejércitos de [ROOT.GetCountry.GetName|T] a la victoria eterna.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 
 01_horn_of_africa_task_3:0 "El cetro de sangre de dragón"
 01_horn_of_africa_task_3_DESC:0 "El raro #R Árbol de sangre de dragón#! solo se puede encontrar en la isla de [GetProvince('(int32)7530').GetArea.GetName|Y], y los bienes comerciales elaborados con su madera son muy apreciados entre las élites que viven a ambos lados del #Y Mare Erythraeum#!.\n\nComo señal de su admiración por nuestro [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName|Y], las personas que viven allí han enviado un valioso cetro a [ROOT.GetCountry.GetCapital.GetName|T].\n\n\n\n\n\n\n\n\n\n\n@italic_mil11!"
 
 01_horn_of_africa_task_4:0 "Mahout macrobiano"
 01_horn_of_africa_task_4_DESC:0 "Estamos bendecidos con tierras que tienen criaderos de elefantes @elephants!, y los mercados de [ROOT.GetCountry.GetCapital.GetName|T] están repletos de paquidermos y sus cuidadores. [ROOT.GetCountry.GetRuler.GetName|Y] recientemente se ha interesado en aprender a trabajar con los gentiles gigantes y ha gastado una gran suma en conseguir los servicios de un entrenador de elefantes del este.\n\n\n\n\n\n\n\n\n\n\n@india_mil9!"
 
 01_horn_of_africa_task_5:0 "Jinetes de elefantes del desierto"
 01_horn_of_africa_task_5_DESC:0 "El ejemplo dado por [ROOT.GetCountry.GetRuler.GetName|Y] y [ROOT.GetCountry.GetRuler.GetHerHis] #R elefantes de guerra de [GetDeityDefinition('omen_nidar').GetName]#! @elephants! ha inspirado a nuestros ejércitos a seguir los pasos de nuestro [ROOT.GetCountry.GetRulerTitle], y una legión de elefantes ha sido entrenada en el desiertos.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil20!"
 
 01_horn_of_africa_task_6:0 "Gran Templo de Waaq"
 01_horn_of_africa_task_6_DESC:0 "Durante muchos años, la gente ha viajado al humilde #G Templo de Waaq#! que se encuentra en [GetProvince('(int32)7532').GetName|T] para presentar sus respetos a nuestro gran dios, pero el santuario que existe dentro de la ciudad es muy antiguo y necesita varias reparaciones.\n\nEn una demostración de piedad que siempre será recordada por nuestros parientes, [ROOT.GetCountry.GetRuler.GetName|Y] ha prometido construir un magnífico templo en honor de [GetDeityDefinition('omen_waaq').GetName|G] en Mosylon que permanecerá en pie durante siglos.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 
 01_horn_of_africa_task_7:0 "Puerto de Moundou"
 01_horn_of_africa_task_7_DESC:0 "Los comerciantes egipcios y griegos que navegan por el #Y Sinus Arabus#! llegarán primero a la ciudad de [GetProvince('(int32)7523').GetName|T], y cuando vean la bienvenida vista de sus murallas, están desesperados por comprar suministros, una situación que es agradable para nuestros comerciantes, que están contentos con sus ganancias pero siempre desean más.\n\nPara acomodar a las flotas de los comerciantes que visitan Moundoun, [ROOT.GetCountry.GetRuler.GetName|Y] ha invertido mucho en mejorar la infraestructura del distrito portuario e incluso ha construido una carretera hacia [GetProvince('(int32)7532').GetName|T] a lo largo del costa.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil12!"
 
 01_horn_of_africa_task_8:0 "Sumisión de los bereberes"
 01_horn_of_africa_task_8_DESC:0 "[ROOT.GetCountry.GetRuler.GetName|Y] ha enviado enviados al [GetCountry('BER').GetName|T], con la esperanza de que se pueda lograr una resolución pacífica de nuestros reclamos sobre sus tierras. Alcanzado.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 
 01_horn_of_africa_task_9:0 "La voluntad de Waaq"
 01_horn_of_africa_task_9_DESC:0 "El mundo está cambiando: hay tensiones dondequiera que uno mire, ya sea al norte, al oeste, al este o al sur. En tiempos difíciles, nuestro pueblo siempre ha recurrido a [GetDeityDefinition('omen_waaq').GetName|G] para buscar la guía divina, y [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido que es hora de consultar la #G Lluvia. Donante#!.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 
 01_horn_of_africa_task_10:0 "Celebraciones de Acción de Gracias"
 01_horn_of_africa_task_10_DESC:0 "Ahora que la temporada de lluvias ha llegado a su fin, es momento de que nuestro pueblo agradezca a [GetDeityDefinition('omen_waaq').GetName|G] las bendiciones que ha derramado sobre nuestros personas.\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 
 01_horn_of_africa_task_11:0 "Conquistador de ciudades"
 01_horn_of_africa_task_11_DESC:0 "Por primera vez en nuestra historia, la gente de [ROOT.GetCountry.GetName|T] domina las ciudades de los comerciantes #G macrobianos#!; algo que hubiera sido imposible sin el liderazgo de [ROOT.GetCountry.GetRuler.GetName|Y], conocido como #R 'Conquistador de Ciudades'#! por los comerciantes griegos que navegan hacia nuestro mercados.\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 
 01_horn_of_africa_task_12:0 "Guerra por el estrecho occidental"
 01_horn_of_africa_task_12_DESC:0 "Con las ciudades ricas y poderosas de #G Macrobian#! bajo control, nuestro ambicioso [ROOT.GetCountry.GetRulerTitle] ha vuelto [ROOT.GetCountry.GetRuler.GetHerHis] los ojos hacia Occidente. Los ejércitos de [ROOT.GetCountry.GetName|T] deben controlar el flujo comercial dentro y fuera del #Y Fretum Diodorus#!, y la mejor manera de garantizar la estabilidad en la región es controlarla. Nosotros mismos.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 
 01_horn_of_africa_task_13:0 "ciudad de angeles"
 01_horn_of_africa_task_13_DESC:0 "Con curiosidad por saber qué tierras y pueblos se pueden encontrar en el extremo sur, [ROOT.GetCountry.GetRuler.GetName|Y] ha convocado una expedición para zarpar desde la #G Ciudad de los Ángeles#!, [GetProvince('(int32)8704').GetName|T]. Es la esperanza de nuestro [ROOT.GetCountry.GetRulerTitle] que descubramos cosas maravillosas, porque nadie que viva en [ROOT.GetCountry.GetName|T] sabe realmente lo que hay más allá de las fronteras de nuestros mapas...\n\n#Y Esto iniciará un evento cadena.#!\n\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 
 01_horn_of_africa_task_14:0 "Las Montañas De Punt"
 01_horn_of_africa_task_14_DESC:0 "Ahora que las poderosas ciudades de [GetProvince('(int32)7519').GetName|T] y [GetProvince('(int32)7521').GetName|T] han caído en manos de nuestras fuerzas, nuestras tropas han comenzado el proceso de exploración y mapeo de las montañas al oeste; nuestros ejércitos no se detendrán hasta que hayan tomado las montañas de [GetProvince('(int32)7519').GetArea.GetRegion.GetName|Y].\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 
 01_horn_of_africa_task_15:0 "Exploradores audaces del eritreo"
 01_horn_of_africa_task_15_DESC:0 "Nuestros valientes marineros, cada vez más confiados cada día, han navegado a lo largo de las costas del sur de #G Arabia#! en sus esfuerzos por explorar y cartografiar el #Y Mare Erythraeum#!.\n\nSus viajes a menudo han sido fructíferos, y es gracias a sus aventuras que [ROOT.GetCountry.GetRuler.GetName|Y] ha aprendido de una pequeña isla llamada [GetProvince('(int32)7216').GetName|T] frente a la costa este de la península: un lugar que sería un lugar perfecto para un puerto para nuestro [ROOT.GetCountry.GetAdjective|T] marineros.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil21!"
 
 01_horn_of_africa_task_16:0 "Maldivas macrobianas"
 01_horn_of_africa_task_16_DESC:0 "En un esfuerzo por proteger nuestros intereses económicos en #Y Mare Erythraeum#! y más allá, [ROOT.GetCountry.GetRuler.GetName|Y] ha lanzado una invasión naval sorpresa de la isla de [GetProvince('(int32)8281').GetName|T]. Si bien se ha evitado milagrosamente una guerra mayor, el impacto en nuestra reputación y posición internacional ha sido notable.\n\n#Y Esto iniciará un evento cadena.#!\n\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 
 01_horn_of_africa_task_17:0 "Adquiriendo Aksum"
 01_horn_of_africa_task_17_DESC:0 "Desde nuestra base en la isla de [GetProvince('(int32)7502').GetName|T], los generales de los ejércitos [ROOT.GetCountry.GetAdjective] planean la invasión de [GetProvince('(int32)7506').GetArea.GetName|T] - las ciudades del interior se someterán a nuestra ¡Hegemonía!\n\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 
 01_horn_of_africa_task_18:0 "Piratas de los mares del este"
 01_horn_of_africa_task_18_DESC:0 "Con las aguas del #Y Mare Erythraeum#! todas menos las nuestras bajo control, [ROOT.GetCountry.GetRuler.GetName|Y] ha emitido una orden que ha conmocionado a muchas de las élites que viven en [ROOT.GetCountry.GetCapital.GetName|T]; en lugar de expulsar a los piratas de nuestras aguas, aceptaremos su presencia y les permitiremos libre acceso al océano.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"
 
 01_horn_of_africa_task_19:0 "Ciudad de monedas"
 01_horn_of_africa_task_19_DESC:0 "Nuestra capital [ROOT.GetCountry.GetCapital.GetName|T] ha visto cambiar su suerte gracias a los ingresos fiscales recaudados por nuestros comerciantes [ROOT.GetCountry.GetAdjective], que han contratado un ejército de ingenieros para reconstruir prácticamente el centro de la ciudad; apenas se puede reconocer la ciudad que alguna vez fue, y todo gracias a la incomparable [ROOT.GetCountry.GetRuler.GetName|Y].\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
 01_horn_of_africa_task_20:0 "ciudad del dios"
 01_horn_of_africa_task_20_DESC:0 "Se sabe que los egipcios han comerciado con nuestro pueblo durante cientos de años, y sus registros antiguos hablan del poderoso pueblo de #E #G Punt#!#! que gobernó un rico reino en el este: nuestros antepasados.\n\nDesde su ciudad capital, [ROOT.GetCountry.GetCapital.GetName|T], una de las ciudades más grandes de #E #G África#!#!, la dinastía [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective|Y] gobierna sin oposición.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 
 01_horn_of_africa_task_21:0 "Maestros del comercio de marfil"
 01_horn_of_africa_task_21_DESC:0 "De manera lenta pero segura, nuestro pueblo se ha apoderado de la mayoría de los asentamientos que producen elefantes @elephants! en el #G África oriental#!, y ganamos sumas considerables controlando el marfil. Comercio.\n\n\n\n\n\n\n\n\n\n\n@india_mil19!"
 
 01_horn_of_africa_task_22:0 "Mercados de mirra macrobiana"
 01_horn_of_africa_task_22_DESC:0 "Se sabe en todo el mundo civilizado que si uno ha obtenido mirra @myrrh!, entonces sin duda proviene del reino de los macrobianos, cuyo nombre se ha convertido en sinónimo de la costosa resina de goma en el mercado. \n\n[ROOT.GetCountry.GetRuler.GetName|Y] ha consolidado silenciosamente [ROOT.GetCountry.GetAdjective] el control sobre el lucrativo comercio de mirra en los últimos años, aportando riqueza y prestigio a [ROOT.GetCountry.GetRuler.GetHerHis] compatriotas.\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 
 01_horn_of_africa_task_23:0 "Tierra de los habitantes de Lanka"
 01_horn_of_africa_task_23_DESC:0 "Nuestros ejércitos victoriosos han conquistado la isla #G Lanka#! al este, tomando sus ciudades y comerciando para la gente del [ROOT.GetCountry.GetName|T], pero nuestros guerreros no estarán satisfechos con lo que tienen y están clamando por una invasión en toda regla del continental.\n\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 
 01_horn_of_africa_task_24:0 "La Liga Eritrea"
 01_horn_of_africa_task_24_DESC:0 "Con amplias propiedades en #G África#!, #G Arabia#! y #G India#! y una armada invencible que domina el #Y Mare Erythraeum#! al mando [ROOT.GetCountry.GetRuler.GetHerHis], nuestro [ROOT.GetCountry.GetRulerTitle] ha conquistado un reino poderoso para la gente del [ROOT.GetCountry.GetName|T] y ha decretado que, a partir de este día, nuestro dominio sea reconocido con un nuevo nombre: el #E #R Erythraean. Liga#!#!.\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 
 01_horn_of_africa_task_25:0 "Ambiciones árabes"
 01_horn_of_africa_task_25_DESC:0 "Nuestro control del #Y Fretum Diodorus#! nunca estará garantizado si permitimos que las ciudades conflictivas del #G Sur de Arabia#! accedan a sus aguas y, por lo tanto, deben someterse a la autoridad de [ROOT.GetCountry.GetRuler.GetName|Y] o perecer.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 
 01_horn_of_africa_task_26:0 "Una falta de fe"
 01_horn_of_africa_task_26_DESC:0 "Aunque todo el mundo reconoce que [ROOT.GetCountry.GetRuler.GetName|Y] ciertamente tiene [ROOT.GetCountry.GetRuler.GetHerHis] méritos, [ROOT.GetCountry.GetRuler.GetSheHe] es un líder militar absolutamente terrible; esto no es un gran secreto, e incluso nuestros enemigos lo saben. Aunque será desestabilizador para [ROOT.GetCountry.GetName|T], los nobles han presionado a [ROOT.GetCountry.GetRuler.GetFirstName] para que renuncie a su cargo, no sea que seamos conquistados por un poder más fuerte.\n\n#R Si no derrocamos#! [ROOT.GetCountry.GetRuler.GetFirstName|Y] #R dentro de#! #T 5 Años#! #R , la conspiración se disolverá y esta misión desaparecer.#!\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 
 
