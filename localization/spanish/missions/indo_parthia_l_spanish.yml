l_spanish:

# Events
 me_indoparthia.1.t:0 "$indoparthia_missions_1$ - Iniciar"
 me_indoparthia.1.desc:0 "Lo primero que tendremos que hacer es elegir a nuestro futuro gobernante; veamos quién está disponible."
 me_indoparthia.1.a:0 "Esperemos."
 me_indoparthia.1.tt1:0 "Podremos elegir quién será designado como nuestro #E gobernante#! de las #E grandes casas partas#!."
 me_indoparthia.1.tt2:0 "Este modificador estará activo mientras estemos sujetos o aliados a #E Partia#!."
 me_indoparthia.2.t:0 "$indoparthia_missions_1$ - Elección"
 me_indoparthia.2.desc:0 "Parece que se han seleccionado contendientes: veamos las opciones."
 me_indoparthia.2.a:0 "Debe ser [choose_10.GetName]."
 me_indoparthia.2.b:0 "Preferiríamos ver allí [choose_11.GetName]."
 me_indoparthia.2.c:0 "[choose_12.GetName] puede velar por nuestros intereses."
 me_indoparthia.3.t:0 "$indoparthia_missions_2$"
 me_indoparthia.3.desc:0 "Para seguir adelante con nuestros diseños de conquista en el este, necesitaremos un ejército para eso. Asegurarnos de que podemos reclutar a tantas personas como sea posible parece una solución muy obvia."
 me_indoparthia.3.a:0 "Debemos fortalecernos."
 me_indoparthia.4.t:0 "$indoparthia_missions_3$"
 me_indoparthia.4.desc:0 "Gedrosia, tierra que se cobró muchas vidas y casi derrotó al ejército de Alejandro, no es conocida por ser la más hospitalaria. Dicho esto, lo hemos dominado con éxito... por ahora."
 me_indoparthia.4.a:0 "Al menos esta tierra es nuestra."
 me_indoparthia.5.t:0 "$indoparthia_missions_4$"
 me_indoparthia.5.desc:0 "Arachosia podría ser el área más desarrollada en los alrededores y, como tal, será crucial para nuestros diseños hacia el este."
 me_indoparthia.5.a:0 "Seguimos adelante con nuestros planes."
 me_indoparthia.6.t:0 "$indoparthia_missions_5$"
 me_indoparthia.6.desc:0 "Las montañas Hindu Kush albergan a muchos pueblos y religiones diferentes; también son la mejor entrada a la India. Controlar los pases a través de ellos es crucial."
 me_indoparthia.6.a:0 "Se ha abierto el segundo ángulo para la invasión."
 me_indoparthia.6.b:0 "En realidad, la capital regional parece un mejor lugar para nuestra capital que un desierto."
 me_indoparthia.7.t:0 "$indoparthia_missions_6$"
 me_indoparthia.7.desc:0 "Parece que estamos teniendo éxito con nuestra invasión de Gandhara. Sin embargo, no debemos dormirnos en los laureles: aún queda mucho trabajo por hacer, pero sin duda nos hemos convertido en parte del panorama político local."
 me_indoparthia.7.a:0 "¡Genial!"
 me_indoparthia.71.t:0 "$indoparthia_missions_6a$"
 me_indoparthia.71.desc:0 "La Universidad de [GetProvince('(int32)7314').GetName] ha sido ampliada y embellecida dramáticamente, lo que también ha llevado al crecimiento de la ciudad. Se convertirá en el mayor centro de aprendizaje de Asia."
 me_indoparthia.71.a:0 "Esto hará maravillas con nuestro progreso tecnológico."
 me_indoparthia.8.t:0 "$indoparthia_missions_7$"
 me_indoparthia.8.desc:0 "La región de Hind es rica y está bien desarrollada. Seguramente será una valiosa adición a nuestra colección de tierras."
 me_indoparthia.8.a:0 "Increíble."
 me_indoparthia.9.t:0 "$indoparthia_missions_8$"
 me_indoparthia.9.desc:0 "Nuestro control sobre la región se ha fortalecido con la introducción de fortalezas fortificadas, ahora podemos continuar conquistando el resto de la región."
 me_indoparthia.9.a:0 "Que todo el norte de la India sea nuestro."
 me_indoparthia.10.t:0 "$indoparthia_missions_9$"
 me_indoparthia.10.desc:0 "Nuestro gobierno aquí es más seguro y la marina protegerá nuestras costas. Podemos proceder con mayores ambiciones."
 me_indoparthia.10.a:0 "Cada pequeña defensa ayuda."
 me_indoparthia.11.t:0 "$indoparthia_missions_10$"
 me_indoparthia.11.desc:0 "Desde que nos establecimos como potencia regional libre e indiscutible, como #E IndoPartia#!, ahora podemos elegir libremente nuestro destino y hacer cosas que harán que nuestro nombre quede grabado en los anales de la historia."
 me_indoparthia.11.a:0 "Excelente."
 me_indoparthia.12.t:0 "Nuestra postura hacia los indopartos"
 me_indoparthia.12.desc:0 "¡Los #E indopartos#! han surgido y se han liberado de nuestro dominio! La pregunta sigue siendo: ¿cómo debemos abordar la gestión de esta situación?"
 me_indoparthia.12.a:0 "Déjalos en paz."
 me_indoparthia.12.tt1:0 "¡[root_scope.GetName] se vuelve independiente!"
 me_indoparthia.12.b:0 "Podemos llegar a un entendimiento para evitar la guerra entre hermanos."
 me_indoparthia.12.tt2:0 "¡[root_scope.GetName] se independiza!\n Los dejaremos en paz, por ceder sus tierras en #E Irán#!."
 me_indoparthia.12.c:0 "¡Esto no puede soportarse!"
 me_indoparthia.12.tt3:0 "¡Declararemos la guerra a #E IndoPartia#!!"
 me_indoparthia.1201.t:0 "Respuesta de Partia"
 me_indoparthia.1201.desc:0 "Parece que a los partos no les importan nuestros diseños, o tal vez tienen miedo de la confrontación. De cualquier manera, somos libres de hacer lo que queramos, sin la supervisión de [parthia_scope.GetCapital.GetName]."
 me_indoparthia.1201.a:0 "¡Genial!"
 me_indoparthia.1202.t:0 "Respuesta de Partia"
 me_indoparthia.1202.desc:0 "Parece que los partos patearon la pelota a nuestro campo: depende de nosotros si tendremos una guerra o no. Sin embargo, la paz nos costará todas nuestras propiedades al oeste de las montañas Hindu Kush."
 me_indoparthia.1202.a:0 "Bien, hagamos de tripas corazón."
 me_indoparthia.1202.tt:0 "Todas las tierras al oeste de las regiones #E Bactria#! y #E Aria#! serán cedidas a #E Partia#!."
 me_indoparthia.1202.b:0 "¡No cederemos ni un centímetro a las armas!"
 me_indoparthia.1203.t:0 "Respuesta de Partia"
 me_indoparthia.1203.desc:0 "Parece que [parthia_scope.GetName] no nos dejará ir fácilmente y la guerra se está gestando."
 me_indoparthia.1203.a:0 "¡A las armas!"
 me_indoparthia.13.t:0 "$indoparthia_missions_11$"
 me_indoparthia.13.desc:0 "No es productivo para los partos matarse unos a otros, mientras podemos prosperar juntos. Los demás partos también ven lo mismo, por lo que el único resultado natural es reconocernos unos a otros como iguales, junto con nuestras respectivas esferas de influencia."
 me_indoparthia.13.a:0 "Ahora hay dos Reyes de Reyes."
 me_indoparthia.14.t:0 "$indoparthia_missions_12$"
 me_indoparthia.14.desc:0 "El budismo se está extendiendo rápidamente en la provincia de Gándara, reemplazando al vedicismo y al zoroastrismo como fe predominante en muchas ciudades. Es una religión pacífica y tranquila que también ha atraído a muchos seguidores en nuestra corte. Si realmente vamos a llamarnos reyes indios, tal vez sería prudente convertirnos."
 me_indoparthia.14.a:0 "¡Sí, debemos abrazar el budismo!"
 me_indoparthia.14.b:0 "Nunca abandonaremos a nuestros dioses."
 me_indoparthia.15.t:0 "$indoparthia_missions_13$"
 me_indoparthia.15.desc:0 "Con tantos nativos integrados en el aparato de nuestro estado, podemos introducir prácticas de elefantes, tal vez incluso mejorarlas."
 me_indoparthia.15.a:0 "Nuestros enemigos serán aplastados bajo los pies de los elefantes."
 me_indoparthia.15.tt1:0 "[GetCulture('parthian').GetName] cambia su plantilla a #E plantilla indoparta#!."
 me_indoparthia.15.tt2:0 "[GetCulture('sindhi').GetName] cambia su plantilla a #E plantilla indoparta#!."
 me_indoparthia.15.tt3:0 "[GetCulture('purus').GetName] cambia su plantilla a #E plantilla indoparta#!."
 me_indoparthia.15.tt4:0 "[GetCulture('sivi').GetName] cambia su plantilla a #E plantilla indoparta#!."
 me_indoparthia.15.tt5:0 "[GetCulture('gandhari').GetName] cambia su plantilla a #E plantilla indoparta#!."
 me_indoparthia.15.b:0 "Estamos bien con las soluciones actuales."
 
 me_indoparthia.9901.t:0 "¿Jugar como [GetProvince('(int32)6552').GetOwner.GetName]?"
 me_indoparthia.9901.desc:0 "Con el establecimiento de nuestra Marcha en la región de Ariana, la [GetProvince('(int32)6552').GetOwner.GetName], puede que valga la pena considerar alinear nuestro futuro con ellos; al hacerlo, dejaremos a [ROOT.GetCountry.GetName] a su suerte y jugaremos como [GetProvince('(int32)6552').GetOwner.GetName].\nO no podríamos hacer eso."
 me_indoparthia.9901.a:0 "Mantendremos nuestro rumbo actual."
 me_indoparthia.9901.tt1:0 "¡Seguiremos jugando como #E Parthia#! @[SCOPE.GetRootScope.GetCountry.GetFlag]!."
 me_indoparthia.9901.b:0 "En realidad, sí, esto suena divertido."
 me_indoparthia.9901.tt2:0 "¡Pasaremos a jugar como #E [GetProvince('(int32)6552').GetOwner.GetName]#! @[GetProvince('(int32)6552').GetOwner.GetFlag]!.\nObtendremos un #E nuevo árbol de misiones#!, centrado en la formación del #E reino indoparto#!."
 me_indoparthia.9901.c:0 "Mantengamos nuestras opciones abiertas."
 me_indoparthia.9901.tt3:0 "Podremos cambiar más adelante a nuestra #E Marcha Ariana#! para esto a través de nuestro Árbol de Misiones."
 me_indoparthia.9902.t:0 "t"
 me_indoparthia.9902.desc:0 "t"
 me_indoparthia.9902.c:0 "Pensándolo bien, tal vez mantengamos el rumbo actual."

 # Tasks
 indoparthia_missions:0 "Misiones indopartas"
 indoparthia_missions_DESCRIPTION:0 "Hacia nuestro este, justo en el lado opuesto de la cordillera #E Hindu Kush#!, se encuentra un vasto y rico subcontinente de la #E India#!. Con la habilidad y la astucia adecuadas, podemos llevar nuestro estado más pequeño a la grandeza creando un reino allí.\n\nFormar #E IndoPartia#! nos permitirá crear sinergias entre nuestras raíces nómadas con las religiones y prácticas militares indias, lo que potencialmente hará que nuestro estado sea el más fuerte bajo el cielo."
 indoparthia_missions_CRITERIA_DESCRIPTION:0 "Hemos formado el #E Reino Indoparto#! y nos hemos expandido profundamente en la India."
 indoparthia_missions_BUTTON_TOOLTIP:0 ""
 indoparthia_missions_BUTTON_DETAILS: ""
 indoparthia_missions_1:0 "Solicitar un gobernador"
 indoparthia_missions_1_DESC:0 "Para seguir adelante con nuestros planes, lo mejor es solicitar un gobernador de una de las grandes familias de Partia, ya que seguramente traerán consigo riqueza y conocimientos.\n\n\n\n\n\n\n\n\n\n@greek_mil22!"
 indoparthia_missions_1.tt1:0 "¡Solicitaremos un gobernante de una de las #E Grandes Casas Partas#!!"
 indoparthia_missions_2:0 "preparar un ejército"
 indoparthia_missions_2_DESC:0 "Como siguiente paso, necesitamos organizar nuestras tropas para las luchas venideras.\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 indoparthia_missions_2.tt:0 "Todos los pops de estratos bajos de culturas integradas se convertirán en #E Hombres libres#!, por lo que #E serán elegibles para el servicio militar obligatorio#!."
 indoparthia_missions_3:0 "Desiertos gedrosianos"
 indoparthia_missions_3_DESC:0 "Necesitamos asegurar nuestra frontera sur. \n\n\n\n\n\n\n\n\n\n@egypt_mil5!"
 indoparthia_missions_4:0 "Expansión arachosiana"
 indoparthia_missions_4_DESC:0 "Si queremos trasladarnos a la India, Arachosia se interpone claramente en nuestro camino. \n\n\n\n\n\n\n\n\n\n@persia_mil12!"
 indoparthia_missions_5:0 "Empuje hacia el norte"
 indoparthia_missions_5_DESC:0 "Paropamisadae y Sattagydia, aunque son montañosos, al menos no son desiertos desolados y aseguran pasajes del norte hacia la India.\n\n\n\n\n\n\n\n\n\n@celt_mil17!"
 indoparthia_missions_6:0 "Conquistas gandharanas"
 indoparthia_missions_6_DESC:0 "Las exuberantes llanuras de Gandhara demostrarán ser un principio central de nuestra fuerza, si podemos establecernos allí correctamente.\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 indoparthia_missions_6a:0 "universidad de taxila"
 indoparthia_missions_6a_DESC:0 "La Universidad de [GetProvince('(int32)7314').GetName] es un antiguo e importante centro de aprendizaje que atrae a académicos de toda la India y más allá. Deberíamos ampliar los campus de la universidad y transformarla en un centro de aprendizaje que rivalice con los de Grecia y Egipto.\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 indoparthia_missions_7:0 "Conquistas posteriores"
 indoparthia_missions_7_DESC:0 "Las áreas de Hind son ricas y culturalmente homogéneas, lo que las convierte inmediatamente en una valiosa adición a nuestro estado.\n\n\n\n\n\n\n\n\n\n@celt_mil18!"
 indoparthia_missions_8:0 "Subyugar a Gandhara"
 indoparthia_missions_8_DESC:0 "Con nuestra presencia establecida en Gandhara, ahora podemos solidificar nuestro control de la región y completar su subyugación.\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 indoparthia_missions_8.tt:0 "5 territorios en [GetProvince('(int32)4349').GetArea.GetRegion.GetName] tienen un [GetBuilding('fortress_building').GetName]."
 indoparthia_missions_9:0 "Más allá de Hind"
 indoparthia_missions_9_DESC:0 "Con Hind en nuestras manos, podemos completar la conquista de la región de Maru.\n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 indoparthia_missions_9.tt1:0 "Tres territorios en #E Sindh#! (áreas fronterizas con el Indo en la región de Maru) tienen un [GetBuilding('fortress_building').GetName]."
 indoparthia_missions_9.tt2:0 "Tenemos una armada de al menos 30 barcos en [GetProvince('(int32)6821').GetName]."
 indoparthia_missions_10:0 "Indopartia"
 indoparthia_missions_10_DESC:0 "Hemos hecho algo grandioso: forjar un gran nuevo Reino en la India. Ahora sólo queda una pregunta: ¿qué haremos ahora?\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
 indoparthia_missions_10.tt1:0 "¡Hemos formado #E IndoPartia#!!"
 indoparthia_missions_10.tt2:0 "¡Podemos cambiar nuestra #E Capital#! a cualquier lugar, una vez, gratis!\nEsa nueva capital obtendrá #E 6 Nobles#!.\nObtendremos acceso a #R #E Conquista de la Horda#!#! Casus Belli para #E 25 años#!, lo que nos permite conquistar territorios ocupados."
 indoparthia_missions_11:0 "Relaciones partas"
 indoparthia_missions_11_DESC:0 "Al ser libres y establecer nuestro propio rumbo, el conflicto con nuestros hermanos no tiene por qué pasar: podemos acordar nuestras respectivas esferas de influencia, reconocernos como iguales y beneficiarnos mutuamente de it.\n\n\n\n\n\n\n\n\n\n@persia_mil4!"
 indoparthia_missions_11.tt:0 "Nosotros y #E Partia#! obtendremos y mantendremos este modificador siempre que las relaciones entre se mantengan por encima de 50."
 indoparthia_missions_12:0 "Abrazando el budismo"
 indoparthia_missions_12_DESC:0 "En la India está prosperando una nueva religión, fundada por un hombre llamado Gautama Buda hace sólo unos cientos de años. Hemos conquistado muchos lugares sagrados budistas importantes y algunos miembros de nuestra corte real se han convertido, atraídos por sus enseñanzas de paz. Si vamos a gobernar la India, tal vez será necesario abandonar [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] la religión...\n\n\n\n\n\n\n\n\n\n@india_mil4!"
 indoparthia_missions_12.tt:0 "Hasta 20 pops en cada una de nuestras ciudades se convertirán al #E budismo#!."
 indoparthia_missions_13:0 "Guerra de elefantes"
 indoparthia_missions_13_DESC:0 "Podría decirse que el mayor beneficio de mezclarnos con el paisaje y las culturas indias es que podemos utilizar más fácilmente las mayores máquinas de guerra conocidas por el hombre: #E Guerra Elefantes#!.\n\n\n\n\n\n\n\n\n\n@india_mil16!"
 indoparthia_missions_13.tt1:0 "Hemos integrado la cultura [GetCulture('sindhi').GetName], [GetCulture('purus').GetName], [GetCulture('sivi').GetName] o [GetCulture('gandhari').GetName]."
 indoparthia_missions_13.tt2:0 "Producimos al menos #E 3 bienes comerciales excedentes de elefantes#!.\nSolo contará el segundo bien comercial de elefantes o posterior producido en un territorio (Actualmente: #Y [SCOPE.ScriptValue('inp_elephant_production')|0]#!)."
 indoparthia_missions_13.tt3:0 "La cultura parta y las culturas integradas elegibles pueden cambiar la plantilla de impuesto a #E Indoparto#! que es:\n@warelephant! #E Elefantes de guerra#! 30 %\n@light_infantry! #E Infantería ligera#! 10%\n@light_cavalry! #E Caballería ligera#! 30%\n@horse_archers! #E Arqueros a caballo#! 30%"
 
 # Treasures, Decisions Etc.
 indoparthia_change:0 "Si estás viendo esto en el juego, algo salió mal."
 indoparthia_change_desc:0 "Si estás viendo esto en el juego, algo salió mal."
 indoparthia_decision.tt1:0 "No tenemos tierras al oeste de las regiones #E Bactria#! o #! Ariana#!."
 indoparthia_decision.tt2:0 "Poseer directamente todas las #Y provincias destacadas#!."
 indoparthia_decision.tt3:0 "#Y ¡Nos volveremos independientes!#! #R #E Partia#! no estará de acuerdo con esto.#!"
 indoparthia_decision.tt4:0 "#E Todas las Marchas se vuelven independientes.#!"
 levy_indoparthian:0 "indoparto"
 
 # Tooltips
 inp_claim_region_effect_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! recibe un reclamo en cada territorio en la región de #Y [THIS.GetProvince.GetArea.GetRegion.GetName]#!."
 
