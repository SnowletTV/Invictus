 ariana_capital_pmod:0 "Capital del desierto"
 indoparthia_cmod1:0 "Propiedades familiares en todo Irán"
 indoparthia_cmod2:0 "Sistema de impuestos extendido"
 northern_capital_inp_pmod:0 "Capital del Norte"
 indoparthia_cmod3:0 "Ambiciones indias"
