 #Modifiers
 
 djaamat_strength:0 "Fuerza Djamaat"
 desc_djaamat_strength:0 "Ahora unidos por sus lazos familiares compartidos y la influencia activa de los mayores, los principales clanes lezgicos rara vez entran en conflicto, y todos los clanes ahora buscan servir a la causa de los pueblos mayores."
 
 syhil_hur_communities:0 "Comunidades de Syhils y Hurs"
 desc_syhil_hur_communities:0 "Los syhils (grupos familiares) y sus hurs (aldeas) ahora comparten un objetivo común y trabajan juntos para avanzar en la causa de los pueblos lezgicos."
 
 gelaean_cooperation:0 "Cooperación Gelaeana"
 desc_gelaean_cooperation:0 "Los lezgi han aprendido el valor de cooperar con los ghalghai en lugar de involucrarse en conflictos menores."
 
 legian_daraband_network:0 "La red Legian-Daraband"
 desc_legian_daraband_network:0 "El control de Daraband ha dado a los pueblos lezgicos acceso a bienes fascinantes y el control de las rutas comerciales norte-sur."
 
 legian_hegemony:0 "Hegemonía de Legia"
 desc_legian_hegemony:0 "Los pueblos lezgicos son verdaderamente los gobernantes más poderosos y legítimos de las cadenas montañosas del norte de Kavkasos."
 
 legian_mazandaran_trade:0 "El comercio de Legian Mazandaran"
 desc_legian_mazandaran_trade:0 "Con acceso al mar de Mazandaran, los lezgi pueden importar y exportar grandes cantidades de pieles y minerales extranjeros."
 
 kayit_foreign_dyes:0 "Tinte extranjero en Kayit"
 desc_kayit_foreign_dyes:0 "El comercio a través del mar de Mazandaran ha traído una gran cantidad de tintes a las costas de Zabender y, en la orilla opuesta de su rico río, han surgido talleres de tintes y estaciones de trabajo."
 
 stolen_legian_pops:0 "Pops de Legian robados"
 desc_stolen_legian_pops:0 "Los jefes de Legia alentaron a las tribus lézgicas de tierras albanesas caucásicas a abandonar sus hogares y emigrar al norte."
 
 legian_daraband_stronghold:0 "La fortaleza legiana de Daraband"
 desc_legian_daraband_stronghold:0 "Los pueblos lezgicos han invadido las calles de Daraband, y el cuello de botella comercial se ha convertido en un baluarte de la economía y la defensa de la región."
 
 controlling_eastern_caucasus:0 "Controlando el Cáucaso Oriental"
 desc_controlling_eastern_caucasus:0 "Con control sobre los picos orientales de Kavkasos, los pueblos lezgicos controlan las relaciones a través de los pasos montañosos."
 
 horse_trained_lezgi:0 "Caballos Lezgi entrenados"
 desc_horse_trained_lezgi:0 "Entrenados por los señores de los caballos del norte, los jinetes lezgicos son ahora guerreros formidables."
 
 zabender_lapis_markets:0 "Mercados de lapislázuli de Zabender"
 desc_zabender_lapis_markets:0 "Con un comercio constante desde la ciudad de Bactra a través de caravanas de comerciantes privados, Zabender disfruta de la riqueza del comercio de lapislázuli."
 
 paying_for_lezgic_lapis:0 "Pagando por Lezgic Lapis"
 desc_paying_for_lezgic_lapis:0 "Pagar por un suministro regular de lapislázuli procedente de la lejana Bactra no es... barato."
 
 oligarchs_of_kavkasos:0 "Los oligarcas de Kavkasos"
 desc_oligarchs_of_kavkasos:0 "Los ancianos lezgicos han abierto sus círculos a los numerosos pueblos de las montañas."
 
 legian_primacy:0 "Primacía de Legia"
 desc_legian_primacy:0 "Los pueblos de nuestra patria han descubierto, se han asombrado y ahora adoran las cualidades de la cultura de Legia, reverenciando las reglas de Lezgiwal y la vida tribal de las montañas. Por lo tanto, la cultura lezgica se ha extendido aquí como un reguero de pólvora."
 
 worship_of_gal:0 "Adoración de Gal"
 desc_worship_of_gal:0 "La banda de incursiones lezgicas ha realizado los ritos adecuados para Gal y ha recibido sus bendiciones."
 
 gal_worship_assa_gorge:0 "Adoración de chicas en Assa Gorge"
 desc_gal_worship_assa_gorge:0 "La adoración del todopoderoso sol, Gal, ha llevado a la centralización de la fe, el poder y la política en este asentamiento generalmente remoto en Assa Gorge, cerca de las alturas de los picos de Kavkasos."
 
 iberi_land_knowledge:0 "Conocimiento de la Tierra Iberí"
 desc_iberi_land_knowledge:0 "El envío de exploradores les ha dado a los comandantes lezgicos la comprensión de cómo luchar mejor en tierra extranjera."
 
 lezgic_surprise_army:0 "Un ejército lezgico sorpresa"
 desc_lezgic_surprise_army:0 "Bandas de guerra lezgicas formadas por caballos surgieron de las montañas, como si aparecieran espontáneamente de la nada."
 
 iberi_raiding:0 "Asaltando el Iberi"
 desc_iberi_raiding:0 "Las incursiones de los Iberi a través de las montañas han dado lugar a un creciente comercio de esclavos."
 
 #Events
 me_legia_1_title:0 "TODO"
 me_legia_1_desc:0 "Los jefes de clan se sientan alrededor de una mesa en Zabender, hablan por turnos, hombres y mujeres por igual, disfrutando de bebidas con risas sinceras por primera vez en mucho tiempo. [ROOT.GetCountry.GetRuler.GetName] se sienta con los cuatro grandes jefes lezgicos y esboza un plan para crear un reino más estructurado y unificado de familias relacionadas."
 me_legia_1.a:0 "TODO."
 
 me_legia_2_title:0 "Comerciantes emergentes de Legian"
 me_legia_2_desc:0 "Para formar mejores comerciantes dentro de los djamaats en Zabender, nuestra gente ha comenzado a interactuar y tratar con mayor frecuencia a extranjeros del sur que residen en los grandes reinos e imperios del sur más allá de los picos de Kavkasos. Entre ellos, un gran comerciante mediano ha sido objeto de rumores e informes. Quienes lo rodean dicen que es un genio en su campo, pero que su personalidad y sus gustos dejan mucho que desear... /n/n¿Le dejaremos quedarse en la capital para formar cohortes de grandes comerciantes lezgicos?"
 me_legia_2.a:0 "¡Invita a la gran mano de plata extranjera a quedarse!"
 me_legia_2.b:0 "Un Legian con manos de cobre es mejor que un forastero."
 
 me_legia_3_title:0 "Unión Syhil"
 me_legia_3_desc:0 "Por sugerencia de [ROOT.GetCountry.GetRuler.GetName], muchas familias numerosas han comenzado a casarse entre sí para entrelazar los hilos de la ascendencia. Si bien una vez los syhils se deleitaban con su noble descendencia, ahora celebran los lazos de sangre compartidos: todos son hijos de los antiguos héroes del dominio de Kavkasos."
 me_legia_3.a:0 "La cooperación nos hace avanzar."
 
 me_legia_4_title:0 "Una audiencia lezgica-galgaiana"
 me_legia_4_desc:0 "Con un interés renovado en cooperar con el pueblo Ghalghai, el gobernante lezgico, [ROOT.GetCountry.GetRuler.GetName], invitó a una delegación de ancianos Ghalghai a Zabender para una audiencia con sus compañeros jefes. Después de una semana de viaje, la caravana Ghalghai llegó a Zabender y un trío de ancianos Ghalghai vino a visitar a los principales jefes de los Lezgi. ¿Qué hace [ROOT.GetCountry.GetRuler.GetName] al conocerlos?"
 me_legia_4.a:0 "Siéntate en una gran mesa."
 me_legia_4.b:0 "Dar la mano."
 me_legia_4.c:0 "(Sigue a Qilikhwal) Levántate cuando entren a la habitación."
 
 me_legia_5_title:0 "Los ancianos de Ghalghai"
 me_legia_5_desc:0 "Durante las conversaciones, [ROOT.GetCountry.GetRuler.GetName] conoció a cuatro ancianos de Ghalghai, entre ellos una anciana. Mientras hablaba de los sistemas fluviales que atraviesan las tierras de Ghalghai y Lezgic, confundió el nombre de algunos hurs lezgic y tropieza con sus palabras. ¿Cómo responde [ROOT.GetCountry.GetRuler.GetName] al comportamiento inadecuado de la mujer?"
 me_legia_5.a:0 "Castígala por insultar al pueblo Lezgi."
 me_legia_5.b:0 "Suspiro por su error pero sigue adelante con las conversaciones."
 me_legia_5.c:0 "(Sigue a Juvwal) Anímala calurosamente a continuar."
 
 me_legia_6_title:0 "Una intrusión caótica"
 me_legia_6_desc:0 "Justo cuando las negociaciones están concluyendo, un hombre de aspecto brutal de la caravana Ghalghai llega con un hueso que elegir. Elevándose por encima de [ROOT.GetCountry.GetRuler.GetName], dice tonterías sobre el maltrato que han sufrido los de su especie y propone un duelo físico. ¿Cómo responde [ROOT.GetCountry.GetRuler.GetName]?"
 me_legia_6.a:0 "Negarse a luchar."
 me_legia_6.b:0 "Habla con él."
 me_legia_6.c:0 "(Sigue a Khsanwal) Lucha contra él."
 
 me_legia_7_title:0 "Negociaciones fallidas de Ghalghaian"
 me_legia_7_desc:0 "Cuando terminan las conversaciones, queda claro que los ancianos del pueblo Ghalghai no están contentos. Miran fijamente a [ROOT.GetCountry.GetRuler.GetName], exudando disgusto. Los asistentes dejan claro que las acciones tomadas por los lezgi fueron consideradas indecentes y ofensivas, lo que sólo confirma un prejuicio que muchas tribus de los ghalghai ya tenían. Las relaciones en el futuro serán tensas..."
 me_legia_7.a:0 "Tendremos que ser cautelosos en el futuro."
 
 me_legia_8_title:0 "Negociaciones exitosas de Ghalghaian"
 me_legia_8_desc:0 "Las alegres sonrisas en los viejos rostros de los ancianos de Ghalghai dicen miles de palabras. [ROOT.GetCountry.GetRuler.GetName] descansa en los asientos del jefe y todos los presentes se deleitan bebiendo. Parece que la conducta de los lezgicos durante las conversaciones fue lo suficientemente respetuosa y agradable como para convencer a los ghalghai de que la cooperación era posible."
 me_legia_8.a:0 "Dejemos que los vientos amigos nos lleven hacia adelante."
 
 me_legia_9_title:0 "Entrenamiento estepario en las montañas"
 me_legia_9_desc:0 "Con la afluencia de jinetes esteparios a las tierras y pueblos de Lezgic, la gente de los hurs ha tratado de aprender lo que podían de los famosos señores de los caballos, tanto en términos de técnicas de equitación como de uso de lanzas o arcos compactos. Varios líderes de bandas de guerra se han acercado para ofrecer sus servicios como instructores oficiales para los lugareños. Costarán una bonita moneda, pero podría valer la pena."
 me_legia_9.a:0 "Los lezgi no necesitan formación extranjera."
 me_legia_9.b:0 "La experiencia con el caballo reforzará nuestras fuerzas."
 
 me_legia_10_title:0 "Lapislázuli lezgico"
 me_legia_10_desc:0 "Un comerciante exótico del sur de los picos de Kavkasos pasó por Daraband y subió a Zabender la semana pasada. Afirmando ser oriundo de la ciudad de Bactra, notó la sorprendente falta de minerales y metales ricos en nuestros mercados. Examinando el oro y la plata ordinarios, e incluso las gemas raras, parecía disgustado y poco impresionado. Solicitando audiencia con [ROOT.GetCountry.GetRuler.GetName], presentó una piedra azul y, en la otra mano, un hermoso collar azul. Un verdadero vendedor, tejió historias de reyes, princesas y emperadores que llevaban tales artículos en el este y el sur, y preguntó por qué nuestros estimados jefes no tenían nada tan sofisticado. Cuando quedó claro que no conocíamos la sustancia, él, tan generosamente, se ofreció a proporcionársela regularmente a Zabender en grandes cantidades por una tarifa regular. La mayoría de los jefes se dejaron llevar por su discurso y ahora buscan aceptar sus demandas. ¿Qué se hará?"
 me_legia_10.a:0 "Una compra única será suficiente."
 me_legia_10.b:0 "Aceptamos pagar por un suministro regular."
 me_legia_10.c:0 "Ninguna gema azul debería influir en la política de nuestras 26 tribus."
 
 me_legia_11_title:0 "Realeza lezgica"
 me_legia_11_desc:0 "Con esta transformación, los pueblos lezgicos han abandonado la era de las jefaturas y la división tribal y han entrado en la era de un Estado poderoso y centralizado. Larga vida al miresar real, la familia de linaje que liderará todo el norte de las montañas."
 me_legia_11.a:0 "¡Viva!"
 
 me_legia_12_title:0 "El Gran Teip de Durdzuks"
 me_legia_12_desc:0 "Los ancianos de los Ghalghai han enviado mensajeros oficiales para comunicar su decisión de separarse de los Lezgi. No por malicia, sino por una diferencia cultural demasiado grande, los Ghalghai desean forjar su propio camino con su propio estado. Por eso dicen que si cortamos los lazos por completo, nos compensarán. Sin embargo, se dan cuenta de que su sumisión y dependencia de Zabender es inevitable, por lo que están dispuestos a aceptar nuestro dominio independiente."
 me_legia_12.a:0 "Que busquen su libertad."
 me_legia_12.b:0 "Permanecerán en la esfera de influencia de Lezgic."
 me_legia_12.c:0 "Los Ghalghai aún pueden forjar un futuro mejor que cualquiera de los vistos en Zabender."
 me_legia_12_a_tooltip:0 "En el límite norte de las montañas del Cáucaso se forma un #Y Gran Teip de Durdzuks#! libre."
 me_legia_12_b_tooltip:0 "El #Y Gran Teip de Durdzuks#! se forma en la frontera norte de las montañas del Cáucaso como parte del reino lezgico."
 
 me_legia_13_title:0 "Ascenso de los Ghalghai"
 me_legia_13_desc:0 "Nuestra oportunidad de distinguirnos de los Lezgi, disfrutar del valor de Gal, deleitarnos con la herencia de Gha y reclamar el honor de los sagrados Narts del pasado: todas estas oportunidades finalmente nos han llegado."
 me_legia_13.a:0 "¡Los Ghalghai marcharán hacia la gloria!"
 me_legia_13_tooltip:0 "Ahora estás jugando como el #Y Gran Teip de Durdzuks#!"
 
 me_legia_14_title:0 "Dominando a los pueblos del norte del Cáucaso"
 me_legia_14_desc:0 "Ahora que hemos decidido que sólo los lezgi pueden gobernar las tierras alrededor de los picos de Kavkasos, muchas de las tribus subordinadas temen a los 26. La pregunta es hasta dónde podemos llevar nuestro dominio absoluto y disfrutar de los beneficios de los impuestos y los bienes materiales de nuestras dependencias."
 me_legia_14.a:0 "Seremos una potencia hegemónica benevolente."
 me_legia_14.b:0 "Explotar las tierras y los pueblos no lezgicos."
 me_legia_14_tooltip:0 "¡Los #E geleos#! pueden #R levantarse#! contra nosotros si somos demasiado duros!"
 
 me_legia_15_title:0 "Comercio entre el Cáucaso y Mazandaran"
 me_legia_15_desc:0 "Con acceso establecido a través de las amplias costas y las olas distantes del mar de Mazandaran, los pueblos lezgicos nunca han tenido mayor acceso a los lujos y placeres del gran mundo del más allá."
 me_legia_15.a:0 "A un mayor nivel de vida."
 
 me_legia_16_title:0 "El Kirsan Shah"
 me_legia_16_desc:0 "Ahora que el pueblo lezgico ha formado un gran reino, muchos de los ancianos, recordando los tiempos antiguos en que los aqueménidas gobernaban la cordillera de Kavkasos, afirman que un título apropiado para nuestro gran gobernante debería tomar prestado de la tradición y el prestigio del antiguo imperio que duró tantos años. De ahora en adelante, [ROOT.GetCountry.GetRuler.GetName] será conocido como Kirsan Shah."
 me_legia_16.a:0 "¡Alabado sea Kirsan Shah!"
 
 me_legia_17_title:0 "Los lezgi restantes en la Albania caucásica"
 me_legia_17_desc:0 "Si bien muchas de las tribus lezgicas de la Albania caucásica han emigrado a su verdadera patria, fortaleciendo nuestra población y economía, muchas todavía optaron por permanecer en las aldeas que habían construido durante su vida. Sin embargo, los mensajeros de los jefes tribales al sur de las montañas se han acercado a nosotros con una perspectiva peligrosa pero tentadora. Si bien las tribus que permanecieron en sus hogares no desean abandonar sus valles, se han cansado del gobierno albanés y desean levantarse y convertir las tierras en un componente de nuestro reino. ¿Continuamos con esta oferta?"
 me_legia_17.a:0 "Debemos liberar a todos los pueblos lezgicos."
 me_legia_17.b:0 "La situación con la Albania caucásica es estable; que siga así."
 
 me_legia_18_title:0 "Constructores Daraband"
 me_legia_18_desc:0 "Si bien Daraband se ha fortalecido como bastión del reino lezgico, los grandes constructores que expandieron la ciudad han presentado la perspectiva de darle a Zabender el mismo trato, por un precio, por supuesto. Muchos de los ancianos sienten que ayudar al crecimiento de Zabender y crear una situación de ciudades gemelas para la nación lezgica debería permitir una mayor prosperidad y estabilidad para todas las tribus. ¿Se llevará a cabo esta gran empresa?"
 me_legia_18.a:0 "El gasto es demasiado grande."
 me_legia_18.b:0 "¡Construiremos dos grandes juegos al norte de las montañas!"
 
 me_legia_19_title:0 "Formando una unión lezgica"
 me_legia_19_desc:0 "Dado que los picos norte y sur de la cordillera de Kavkasos bordean el mar de Mazandaran bajo nuestro dominio, el comercio, los ejercicios militares y las comunicaciones se han vuelto más fuertes que nunca. Muchos pueblos no lezgicos han quedado bajo nuestra soberanía o se han aliado con nosotros contra los invasores. Puede resultar beneficioso reorientar a nuestro pueblo hacia el exterior, presentándonos como socios en una unión de muchas tribus, para no crear enemigos innecesarios más allá de las montañas. ¿Qué dices, [ROOT.GetCountry.GetRuler.GetName]?"
 me_legia_19.a:0 "Seguiremos siendo como estábamos, ni más ni menos."
 me_legia_19.b:0 "Una unión de las montañas. Es algo bueno."
 
 me_legia_20_title:0 "Difusión cultural lezgica"
 me_legia_20_desc:0 "Con nuestros amigos y reinos súbditos adoptando nuestras tradiciones y reglas culturales, muchos nobles extranjeros han venido a presentar obsequios y buenos deseos al líder del ahora enorme reino lezgico."
 me_legia_20.a:0 "¡Sí! Regalos."
 
 me_legia_21_title:0 "Fe en Gal"
 me_legia_21_desc:0 "Cuando el grupo de asalto entra en la moderna garganta de Assa, el último pueblo al que llegan antes del paso de montaña alberga un santuario al sol, al gran dios Gal. Muchos de los guerreros, hombres fervientemente religiosos, piden esperar un día para orar en el santuario y hacer ofrendas. ¿De verdad se pospondrá la gran incursión por un momento de fe? Podría probar que las ciudades al sur de las montañas se enterarán temprano del ataque..."
 me_legia_21.a:0 "Una pequeña ofrenda será suficiente; es sólo un día."
 me_legia_21.b:0 "¡Debemos atravesar las montañas a toda prisa!"
 me_legia_21.c:0 "El pueblo lezgico conoce los ritos adecuados para Gal."
 
 me_legia_22_title:0 "Exploradores avanzados"
 me_legia_22_desc:0 "Mientras la banda avanzaba a través de los pasos de montaña, con las tierras íberas casi dentro, los comandantes del grupo de asalto se han reunido para discutir la estrategia. Algunos creen que una sorpresa completa, como la táctica de un ataque de horda, sería la más exitosa debido al factor de inminencia. Sin embargo, otros sienten que enviar exploradores para atacar, quemar y saquear el territorio inicial dejará a las guarniciones locales en pánico y proporcionará mejor información sobre el área, lo que ayudará al éxito de la incursión. ¿Qué se hará?"
 me_legia_22.a:0 "Se enviarán exploradores."
 me_legia_22.b:0 "La sorpresa es nuestro mayor aliado."
 
 me_legia_23_title:0 "Imperio del Cáucaso del Norte"
 me_legia_23_desc:0 "Ahora que la mayor parte del antiguo reino de Kavkasos, tal vez sea hora de ampliar nuestra burocracia e imitar las estructuras imperiales más grandiosas de los imperios del sur, como los antiguos aqueménidas. ¿Dará el pueblo lezgico este último e histórico paso?"
 me_legia_23.a:0 "No. Las tradiciones mantendrán nuestra historia."
 me_legia_23.b:0 "Emperador... sí, eso suena bastante bien."
 me_legia_23.c:0 "Pondremos en acción el gran Imperio del Cáucaso del Norte."
 me_legia_23.d:0 "El pueblo lezgico formará un nuevo imperio."
 me_legia_23.e:0 "El reino de Kavkasos renace como imperio."
 
 me_legia_24_title:0 "Un poco de color nunca viene mal"
 me_legia_24_desc:0 "Un nuevo imperio, un nuevo cambio de ritmo... tal vez una nueva capa de pintura. ¿Te importaría colorear un poco tu imperio?"
 me_legia_24.a:0 "Nuestro color actual será suficiente."
 me_legia_24.b:0 "Me gusta el dinero... el oro específicamente."
 me_legia_24.c:0 "El imperio debería reflejar mi lengua de plata."
