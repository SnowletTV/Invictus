 01_legia_task_8:0 "Confederaciones Vainakh"
 01_legia_task_8_DESC:0 "Los ghalgai, habiendo manifestado sus duras diferencias con los lezgi y la causa de todos esos hijos de Durdzuks y los de su calaña, buscan hacer su propio camino en la historia. Los Lezgi deben decidir si los acompañan o cortan los lazos.\n\nEsta tarea es #R mutuamente excluyente#! con #Y $01_legia_task_9$#!"
 
 01_legia_task_9:0 "Hegemonía Lezgic"
 01_legia_task_9_DESC:0 "Ha quedado claro que, para unir a todas las tribus y mantener la estabilidad en el nuevo reino, los lezgi deben tratar de dominar a todos aquellos otros pueblos que consideran hogar a las montañas del norte de Kavkasos.\n\nEsta tarea es #R mutuamente excluyente#! con #Y $01_legia_task_9$#!"
 
