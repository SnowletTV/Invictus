l_spanish:

 ####################
 # Title
 ####################

 nuragic_mission_01_inv:0 "Recuperando la patria nurágica"
 nuragic_mission_01_inv_DESCRIPTION:0 "Desde que el sol ha recorrido su camino en los reinos celestiales, nuestra gente ha vivido vidas sencillas y sin incidentes, y nuestra fortuna ha disminuido y fluido como las aguas del océano que nos rodean. Mientras algunos se burlan de nuestras costumbres y nos llaman bárbaros, nosotros estábamos contentos con lo que teníamos que llamar nuestro.\n\nEsto ha cambiado con la llegada de los #E cartagineses#!, que se han apoderado de la costa sur de nuestra isla. Sus diplomáticos han dejado muy claro que nuestros territorios montañosos no están a salvo de sus ejércitos invasores, pero tenemos una idea diferente sobre nuestro futuro."
 nuragic_mission_01_inv_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completada cuando hayamos expulsado a los extranjeros de nuestra isla y la hayamos reclamado para nosotros."
 nuragic_mission_01_inv_BUTTON_TOOLTIP:0 "Debemos expulsar a los invasores de nuestra tierra y recuperarla para nuestro pueblo."
 nuragic_mission_01_inv_BUTTON_DETAILS: ""

 ####################
 # Mission Tasks
 ####################


 nuragic_mission_01_inv_1_task:0 "Reunir a los Ancianos Tribales"
 nuragic_mission_01_inv_1_task_DESC:0 "Antes de tomar cualquier acción contra los extranjeros, primero debemos reunir un consenso entre nuestros hermanos tribales. No podemos hacerlo solos; necesitaremos unir nuestras fuerzas si tenemos alguna esperanza de tener éxito. ¡Envía un mensaje a las tribus vecinas para que se celebre un Consejo! \n\n\n\n\n\n\n\n\n\n@celt_mil3!"

 nuragic_mission_01_inv_2_task:0 "Asegurando las Reservas"
 nuragic_mission_01_inv_2_task_DESC:0 "Si tenemos alguna esperanza de ganar en el campo, nuestros soldados deben estar bien alimentados y listos para luchar en cualquier momento, pues el hambre es un enemigo siempre presente y difícil de escapar. Tan pronto como tengamos los fondos disponibles, deberíamos construir un asentamiento agrícola, así como importar tanta grano como podamos almacenar. \n\n\n\n\n\n\n\n\n\n@celt_mil14!"

 nuragic_mission_01_inv_3_task:0 "Restaurar los Nuraghes"
 nuragic_mission_01_inv_3_task_DESC:0 "En épocas pasadas, nuestro pueblo erigió #T Nuraghes#!, torres de piedra cónicas, miles de ellas. Han sido construidas por toda la isla, de basalto, granito y piedra caliza, para cumplir una serie de propósitos dentro de nuestra sociedad y para complacer a nuestro Padre. Antes de librar nuestras propias guerras, debemos honrar las antiguas tradiciones y asegurarnos de que los importantes Nuraghes para nuestras comunidades sean restaurados a su antigua gloria, así como adecuadamente abastecidos con provisiones. \n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 nuragic_mission_01_inv_4_task:0 "La Costa de [GetProvince('(int32)3504').GetName]"
 nuragic_mission_01_inv_4_task_DESC:0 "[GetProvince('(int32)3504').GetName] fue una colonia focense conocida con el nombre de Olbia, que enfrentó su desaparición apenas 20 años después de su fundación por una fuerza conjunta de etruscos y púnicos.\n\nEl asentamiento de [GetProvince('(int32)3504').GetName] y su puerto actualmente comprenden la principal base de operaciones para las acciones navales cartaginesas a lo largo de las costas orientales de Cerdeña. Su posición relativamente aislada eventualmente ayudará a nuestros esfuerzos de conquista.\n\nEsperamos usar [GetProvince('(int32)3504').GetName] para nuestros propios fines, por lo que es de vital importancia que eventualmente desarrollemos la infraestructura allí. \n\n\n\n\n\n\n\n\n\n@event_pic4!"
 
 nuragic_mission_01_inv_5_task:0 "Bloquear la Puerta Trasera"
 nuragic_mission_01_inv_5_task_DESC:0 "El estrecho de Taphros es lo que separa a Córcega de nosotros, y tomar el control de [GetProvince('(int32)3506').GetName] garantizaría un acceso seguro a esas aguas y asegurar un punto de fortaleza contra quien intente cruzarlo. \n\n\n\n\n\n\n\n\n\n@greek_mil1!"

 nuragic_mission_01_inv_6_task:0 "Un Punto de Apoyo en Phikaria"
 nuragic_mission_01_inv_6_task_DESC:0 "Encaramado en el extremo rocoso del sur de Córcega, frente a los estrechos de mar que la separan de nuestra tierra natal, el asentamiento de [GetProvince('(int32)3508').GetName] se erige como centinela y presa. Observa los vientos del sur, el flujo y reflujo de los barcos, la sombra de Cerdeña sobre las aguas. Y, sin embargo, a pesar de su posición, a pesar de su promesa, sigue expuesto.\n\nEsto debe cambiar. \n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 
 nuragic_mission_01_inv_7_task:0 "Ojos en las Colinas"
 nuragic_mission_01_inv_7_task_DESC:0 "Una ventaja clara que tenemos sobre los extranjeros es que conocemos bien estas tierras, mientras que ellos son meros intrusos. Podemos usar nuestro conocimiento del terreno a nuestro favor, enviando a nuestros hombres a través de terrenos difíciles para mantener un ojo en sus movimientos de tropas.\n\nLos bandidos que viven en las montañas son rastreadores expertos; deberíamos enviar un mensaje de amnistía, si están dispuestos a ayudarnos. \n\n\n\n\n\n\n\n\n\n@celt_mil7!"

 nuragic_mission_01_inv_8_task:0 "El Juramento Sagrado"
 nuragic_mission_01_inv_8_task_DESC:0 "Durante demasiado tiempo hemos permanecido en nuestras montañas, observando a los extranjeros consumir nuestras ricas vetas minerales, profanar nuestros sitios sagrados y cortar y quemar nuestros antiguos bosques a expensas de nuestra hermosa tierra.\n\nCada sardano deberá saber, desde los Nurrenses en el norte hasta los Galillenses en el sur, sin importar si son Balarios o Ilienses, que tomaremos nuestra venganza. ¡Honraremos a nuestros dioses y a nuestros antepasados con mares de sangre de nuestros enemigos!\n\n\n\n\n\n\n\n\n\n@celt_mil15!"

 nuragic_mission_01_inv_9_task:0 "El Puerto de [GetProvince('(int32)3494').GetName]"
 nuragic_mission_01_inv_9_task_DESC:0 "Los cartagineses consideran que el puerto de [GetProvince('(int32)3494').GetName] es vital para sus esfuerzos de reabastecimiento, y por eso no podemos permitirles controlar esta ubicación por más tiempo. \n\n\n\n\n\n\n\n\n\n@greek_mil4!"

 nuragic_mission_01_inv_10_task:0 "Marchando hacia [GetProvince('(int32)3483').GetName]"
 nuragic_mission_01_inv_10_task_DESC:0 "Como animales en un frenesí de sangre, nuestros soldados, reforzados por sus recientes éxitos en el campo, pueden sentir la perdición de los invasores y exigen que avancemos hacia [GetProvince('(int32)3483').GetName], seguramente deseosos de los ricos tesoros que se dice que se encuentran dentro de sus murallas. ¡Ha llegado el momento de dejar que nuestros soldados victoriosos disfruten de algo de saqueo! \n\n\n\n\n\n\n\n\n\n@greek_mil15!"

 nuragic_mission_01_inv_11_task:0 "Tierras Agrícolas de Karalian"
 nuragic_mission_01_inv_11_task_DESC:0 "Verdaderamente, hemos visto pocos lugares como [GetProvince('(int32)3484').GetName]; una ciudad rodeada de viñedos fértiles, besada por el sol y donde seguramente vive la verdadera felicidad. Todos los que pasan por esta ciudad desean poner fin a sus viajes, anhelando quedarse en nuestras propiedades y ver a los delfines jugar en las aguas del Mare Tyrrhenum. Cultivaremos Karali, convirtiéndola en una ciudad magnífica sin importar el costo. \n\n\n\n\n\n\n\n\n\n@greek_mil16!"

 nuragic_mission_01_inv_12_task:0 "Una Nueva Capital"
 nuragic_mission_01_inv_12_task_DESC:0 "Habiéndonos convertido en los amos indiscutibles de nuestra isla, con nuestra autoridad reconocida desde los reductos del norte hasta las ciudades más meridionales - de hecho, toda Cerdeña es nuestra - es seguro decir que ha amanecido una nueva era, una en la que el pueblo sardano tendrá una patria propia.\n\n#Y En una semana, podemos elegir trasladar nuestra capital.\n\n\n\n\n\n\n\n\n\n@greek_mil19!"

 nuragic_mission_01_inv_13_task:0 "Apoderarse de los Barcos"
 nuragic_mission_01_inv_13_task_DESC:0 "Decenas de barcos, inactivos y anclados, descansando en aguas tranquilas como bestias ajenas a la lanza. No están preparados. Sus marineros caminan cómodamente por los muelles, sus capitanes se dan un festín dentro de la ciudad. Todavía no creen que nos atrevamos a actuar contra ellos. Y esa será su perdición. \n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 
 nuragic_mission_01_inv_14_task:0 "Un Ojo Ciego a la Piratería"
 nuragic_mission_01_inv_14_task_DESC:0 "Muchos de los piratas sardos que deambulan por la costa oriental de nuestra tierra han aprovechado la oportunidad para establecerse en las pequeñas islas frente a [GetProvince('(int32)3504').GetName]... ¿quizás les gustaría venir a visitarnos por un tiempo? \n\n\n\n\n\n\n\n\n\n@egypt_mil24!"

 nuragic_mission_01_inv_16_task:0 "Los Viejos Primos"
 nuragic_mission_01_inv_16_task_DESC:0 "En épocas pasadas, cuando nuestro pueblo estaba en la cúspide de su poder en el mar y en la tierra, las tribus balarias del norte de Cerdeña tomaron el control de las islas en el oeste, a las que se dice que dieron su propio nombre. Allí construimos cientos de Nuraghes similares a los nuestros, allí llevamos nuestras formas de vida y conocimiento, hasta que los cartagineses aparecieron y tomaron control del archipiélago.\n\nDe las tres islas, la actualmente conocida como Mago fue considerada nuestra sede de poder preferida en el área, bajo el nombre de Nura. Al haber liberado nuestra isla de las manos de los descendientes de Tiro, también liberaremos a nuestros primos en el oeste. \n\n\n\n\n\n\n\n\n\n@greek_mil18!"

 nuragic_mission_01_inv_17_task:0 "Las Minas de Palma"
 nuragic_mission_01_inv_17_task_DESC:0 "Ahora que hemos conquistado [GetProvince('(int32)1465').GetName], deberíamos desmantelar los asentamientos de los #E Balearics#! y construir una mina en su lugar - esos tontos literalmente estaban sentados sobre una mina de oro. \n\n\n\n\n\n\n\n\n\n@greek_mil18!"

 nuragic_mission_01_inv_18_task:0 "Liquidar [GetProvince('(int32)3510').GetName]"
 nuragic_mission_01_inv_18_task_DESC:0 "Si somos capaces de capturar la ciudad de [GetProvince('(int32)3515').GetName], entonces podremos utilizar la riqueza de esa rica región para financiar la construcción en [GetProvince('(int32)3510').GetName]. \n\n\n\n\n\n\n\n\n\n@event_pic9!"

 nuragic_mission_01_inv_19_task:0 "Estrecho de Taphros"
 nuragic_mission_01_inv_19_task_DESC:0 "Desarrollar las ciudades alrededor de Taphros inducirá un nuevo flujo de comercio a través de nuestro estrecho, permitiendo así que nuestros mercados locales prosperen y florezcan.\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"

 nuragic_mission_01_inv_20_task:0 "El Grano de Nurrensia"
 nuragic_mission_01_inv_20_task_DESC:0 "Las llanuras de Nurrensia, situadas en la parte noroeste de Cerdeña, son famosas por la fertilidad de su suelo y su clima templado. [GetProvince('(int32)3496').GetName] es adecuado para cultivar una gran red de las mejores variedades de trigo que podamos conseguir: nuestra gente excavará suficientes canales y pozos para traer el agua que necesitamos para el futuro granero de nuestra civilización.\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

 nuragic_mission_01_inv_21_task:0 "Arrasar a los extranjeros"
 nuragic_mission_01_inv_21_task_DESC:0 "Durante generaciones, observamos desde nuestras alturas. Aguantamos. La montaña generó en nosotros la paciencia y el conocimiento de que incluso el hierro se rompe si se dobla durante mucho tiempo. Sus minas envenenan la tierra. Sus puestos de avanzada se vuelven gordos y arrogantes. Sus templos hablan lenguas falsas. Y, sin embargo, nos creen destrozados, dispersos, contentos de rondar los bosques y las alturas como fantasmas. Se han olvidado de quiénes somos.\n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 nuragic_mission_01_inv_22_task:0 "construir una flota"
 nuragic_mission_01_inv_22_task_DESC:0 "El espíritu sarda anhela no sólo la piedra bajo sus pies, sino también el sabor de la salmuera en el viento y el crujido de un mástil bajo el cielo. No nacimos para estar encerrados en las montañas, observando desde lejos cómo los extranjeros se deleitan con las riquezas de nuestra isla y dirigen sus barcos a través de nuestras aguas como si hubiéramos desaparecido del mundo.\n\nNo más.\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 
 nuragic_mission_01_inv_23_task:0 "Apunta a Córcega"
 nuragic_mission_01_inv_23_task_DESC:0 "El mar entre Cerdeña y Córcega siempre ha sido estrecho, pero nunca se sintió más estrecho que ahora. En días despejados, podemos ver los picos de nuestra isla hermana desde nuestras costas norteñas, alzándose orgullosos y desafiantes contra el cielo. Esa tierra no nos es ajena. No es extraño. Es nuestro, no por conquista, sino por sangre.\n\nPorque en las tierras altas de Córcega habitan nuestros hermanos, nuestros parientes, aquellos que comparten la lengua de las torres y los ritos del antiguo dios. Han resistido durante mucho tiempo bajo la sombra de los #E etruscos#!, un pueblo de astuto comercio que no llegó a coexistir, sino a dominar. Sus guarniciones se alinean en las llanuras de Alalia, sus comerciantes saquean los bosques, sus cadenas presionan el cuello de los hombres libres.\n\nEsto debe terminar. \n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 
 nuragic_mission_01_inv_24_task:0 "La punta de Córcega"
 nuragic_mission_01_inv_24_task_DESC:0 "En el extremo noreste de la isla, donde antes sólo había rocas, viento y puestos de avanzada etruscos dispersos, hemos sentado las bases de un gran puerto. No es simplemente un lugar para que los barcos descansen; es una espada clavada en el mar que apunta hacia el corazón mismo de Etruria. \n\n\n\n\n\n\n\n\n\n@italic_mil15!"
 
 nuragic_mission_01_inv_25_task:0 "Destino de Alalia"
 nuragic_mission_01_inv_25_task_DESC:0 "Alguna vez fue un puerto orgulloso bajo el yugo de los #E etruscos#!, ahora yace en silencio bajo los estandartes de los sardanos. Sus muros están ennegrecidos por el fuego de nuestro asedio, sus puertas arrancadas de sus bisagras por nuestros gritos de guerra, sus torres llevan las cicatrices de la libertad ganada con tanto esfuerzo. La guarnición etrusca yace rota o dispersa por las colinas. El puerto, que alguna vez estuvo lleno de elegantes barcos, ahora solo huele a humo y sal. \n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 
 nuragic_mission_01_inv_26_task:0 "Desarrollar el norte"
 nuragic_mission_01_inv_26_task_DESC:0 "Con espada y fuego, con juramento y piedra, hemos llevado la unidad al norte. Durante demasiado tiempo, las tierras del norte de Cerdeña fueron un reino fracturado, destrozado por pequeños reyes balarianos y corsos que se coronaron en la oscuridad.\n\nSin embargo, la victoria es el principio, no el final. Las costas del norte son salvajes y vacías, sus puertos olvidados y sus campos cubiertos de maleza. Un gran potencial yace enterrado bajo el abandono. Si no construimos, si no nos conformamos, si no restauramos lo que se ha perdido, entonces la sangre que hemos derramado habrá sido en vano. \n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 
 nuragic_mission_01_inv_27_task:0 "Desarrollar el sur"
 nuragic_mission_01_inv_27_task_DESC:0 "Hubo un tiempo en que el sur de Cerdeña, lo que llamamos Iliensia, era el corazón del poder de nuestro pueblo. Antes de la llegada de los cartagineses, antes de que se levantaran altares y leyes extranjeras, estas tierras eran sardanas hasta la médula. Desde la sal de Sulki hasta los profundos puertos de Karali, desde las llanuras de [GetProvince('(int32)3493').GetName] hasta las piedras sagradas de Nura, nuestros antepasados ​​gobernaron no con oro ni decretos, sino con presencia, fuerza y ​​sabiduría talladas tanto en Nuraghe como en templos. \n\n\n\n\n\n\n\n\n\n@italic_mil30!"
 
 nuragic_mission_01_inv_28_task:0 "Minas Lesitanas"
 nuragic_mission_01_inv_28_task_DESC:0 "Con [GetProvince('(int32)3502').GetName] bajo nuestra bandera una vez más, las minas deben vivir de nuevo. No sólo por oro o gloria, sino porque son nuestros. Son parte de lo que una vez hizo que Cerdeña fuera temida y respetada, desde los Pilares del Mundo hasta las tierras de Peleset. Dejarlos dormidos es traicionar lo que nos fue dado tanto por la montaña como por el inframundo. \n\n\n\n\n\n\n\n\n\n@italic_mil24!"
 
 nuragic_mission_01_inv_29_task:0 "Puerto de Karensia"
 nuragic_mission_01_inv_29_task_DESC:0 "[GetProvince('(int32)3489').GetName] ha sido durante mucho tiempo un puesto de avanzada solitario, azotado por las olas y olvidado por el tiempo. Sus acantilados alguna vez albergaron un simple puesto de vigilancia, un faro contra los asaltantes y piratas que cruzaban el mar Angosto. Pero esos días ya pasaron. El mundo está cada vez más conectado. El comercio fluye más rápido y con él vienen peligros, ambiciones y oportunidades. Si la costa oriental queda desatendida, serán otros, no nosotros, quienes definan su destino.\n\nSe debe levantar un puerto en [GetProvince('(int32)3489').GetName]. \n\n\n\n\n\n\n\n\n\n@italic_mil4!"
 
 nuragic_mission_01_inv_30_task:0 "Urbanizar Balaria"
 nuragic_mission_01_inv_30_task_DESC:0 "Ha llegado el momento de levantar una ciudad, una verdadera ciudad, en la desembocadura de los ríos nurrenos, donde los campos se encuentran con el mar y el viento lleva el aroma de la cebada y la sal. Ese lugar es [GetProvince('(int32)3500').GetName].\n\nAllí, los balarianos se reunirán no como parientes dispersos, sino como un pueblo. Allí, el comercio de los valles interiores puede fluir hacia afuera y las mercancías del otro lado del mar pueden ingresar al corazón del norte. \n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 
 nuragic_mission_01_inv_31_task:0 "Consolidar Balaria"
 nuragic_mission_01_inv_31_task_DESC:0 "No se trata simplemente de la conquista de tierras. Este es el retorno del orden, del propósito, del legado. Balaria no ha sido remodelada: ha sido restaurada a lo que siempre debió ser: fuerte, completa y nuestra. \n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 
 nuragic_mission_01_inv_32_task:0 "Llanuras de Iolean"
 nuragic_mission_01_inv_32_task_DESC:0 "Durante doscientos años, los cartagineses tomaron la llanura y desangraron su suelo con tributos interminables. Sembraron la tierra no con semillas, sino con monedas y cadenas. Y cuando lo despojaron de sus cultivos, de su gente, de su espíritu, lo dejaron pudrirse. Durante generaciones, la llanura de Iolean solo ha conocido el eco de lo que alguna vez fue.\n\nPero ahora hemos regresado. \n\n\n\n\n\n\n\n\n\n@event_pic8!"
 
 nuragic_mission_01_inv_33_task:0 "Las venas de plata"
 nuragic_mission_01_inv_33_task_DESC:0 "Durante doscientos años cavaron profundamente, extrayendo no sólo minerales, sino también vidas. Convirtieron la riqueza de Cerdeña en la riqueza de Cartago. Los túneles se ampliaron, sí, pero sólo para su beneficio. Los trabajadores fueron esclavizados y las ganancias enviadas al otro lado del mar. Cuando se rompió su gobierno, dejaron las minas heridas y vacías, marcadas pero sin curar.\n\nAhora son nuestras otra vez. \n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
 nuragic_mission_01_inv_34_task:0 "[GetProvince('(int32)3493').GetName] Reclamado"
 nuragic_mission_01_inv_34_task_DESC:0 "La llama de [GetProvince('(int32)3493').GetName], una vez apagada, vuelve a arder bajo el signo de la Sardán. Las campanas no suenan para homenaje, sino para triunfo. La gente camina libremente, no con miedo, sino con la memoria.\n\nEsto es más que una victoria: es una reivindicación. Por cada anciano que recordó a [GetProvince('(int32)3493').GetName] tal como era. Por cada niño al que se le enseña a nunca olvidar. Por cada guerrera que cayó creyendo que sería libre. \n\n\n\n\n\n\n\n\n\n@event_pic1!"
 
 nuragic_mission_01_inv_35_task:0 "Invierta en sarcapos"
 nuragic_mission_01_inv_35_task_DESC:0 "Ubicado entre colinas talladas por el viento y el azul abierto del Mar del Este, [GetProvince('(int32)3486').GetName] fue una vez un modesto puesto de avanzada del antiguo mundo sarda: una pequeña ciudad-estado de pescadores, trabajadores de la sal y humildes comerciantes. Nunca fue grande en tamaño ni imponente en paredes, pero perduró. Y ahora, después de largos años de abandono y sombra extranjera, se encuentra una vez más bajo el estandarte de Sardan.\n\nPero la mera posesión no es suficiente. [GetProvince('(int32)3486').GetName] debe aumentar. \n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 
 nuragic_mission_01_inv_36_task:0 "Consolidar Iliensia"
 nuragic_mission_01_inv_36_task_DESC:0 "Durante generaciones, las tierras del sur de Iliensia han conocido conflictos y divisiones. Una vez hogar de poderosas ciudades-estado como [GetProvince('(int32)3493').GetName], [GetProvince('(int32)3483').GetName], [GetProvince('(int32)3481').GetName] y [GetProvince('(int32)3484').GetName], las llanuras del sur fueron arrasadas por manos extranjeras y el peso de la subyugación. Los cartagineses intentaron borrar de la memoria el corazón de Cerdeña, pero la sangre de los sardos corre demasiado profundamente en estas colinas. Ahora, después de años de lucha, Iliensia sigue siendo una sola: unificada, restaurada y más fuerte que nunca. \n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 
 ####################
 # Events
 ####################

 me_nuragic_1_title:0 "Un Consejo de Gran Importancia"
 me_nuragic_1_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] sale corriendo de la tienda, una sucia corriente de maldiciones brota de la [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] boca, y momentos después se le une [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] todo el séquito. Todos los que están afuera -un número nada despreciable, ya que un gran número de soldados han estado dando vueltas durante toda la mañana- pueden comprobar por sí mismos cómo van las negociaciones. Un murmullo silencioso recorre la multitud mientras [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] se gira para dirigirse a ellos, con el rostro enrojecido por la ira.\n\n'Hace unas semanas, yo, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], envié un mensaje a los Ancianos Tribales, buscando una audiencia para discutir el peligro que los cartagineses representan para todos nosotros, y sin embargo, nadie tuvo la decencia de responderme excepto los longonenses. Esperaba que nuestros primos respondieran al llamado sagrado, considerando que tenemos muchas tribus sardanas en esta isla, pero no debería sorprenderme que todos ellos eludieran un consejo de guerra. Volviéndose hacia un [GetCountry('X47').GetRuler.GetName] con el rostro sonrojado, que está de pie con los brazos cruzados, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] extiende el dedo [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] y continúa [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] diatriba, [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] voz temblorosa de ira.\n\n'¡Creo que todos ustedes son cobardes, indignos de acostarse con cerdos! [GetCountry('X47').GetRuler.GetFirstName], te atreves a venir aquí con palabras melosas que prometen una paz falsa, con el aliento endulzado por el vino cartaginés y con los bolsillos llenos de plata: ¡basta! No eres un compañero de guerra, sino una serpiente en la hierba. ¡Vete de inmediato, no sea que rompa mi juramento de hospitalidad y te derribe donde estás! El humor entre la multitud se vuelve feo cuando [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] grita: '¡No se mostrará misericordia a nadie! ¡Cerdeña será nuestra!'"
 me_nuragic_01_inv_1.a:0 "¡Muerte a los cobardes y extranjeros! ¡Los mataremos a todos!"
 me_nuragic_1_tooltip:0 "#Y Ahora tenemos derechos sobre toda Cerdeña#!. $mission_completed_tooltip_1$ '#Y Un consejo de gran importancia#!' $mission_completed_tooltip_2$"

 me_nuragic_2_title:0 "Asegurando las Reservas"
 me_nuragic_2_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ha llegado al asentamiento agrícola que se ha completado recientemente, decidiendo no dejar nada al azar y deseando inspeccionar personalmente el trabajo de nuestros obreros. [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] recorrió los campos, inspeccionando la calidad del suelo, y pasó horas caminando por los almacenes, revisando la provisión para los animales de granja y si sus establos estaban adecuadamente limpios - ningún detalle fue considerado demasiado insignificante para la atención de [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]. Después de un día increíblemente largo, todos se sintieron aliviados cuando [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] hizo su pronunciamiento."
 me_nuragic_01_inv.2.a:0 "Podemos prepararnos para lo que vendrá, sabiendo que nuestros estómagos estarán llenos"
 me_nuragic_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y Asegurar las reservas#!' $mission_completed_tooltip_2$"
 securing_reserves_tt:0 "Construye un asentamiento agrícola en cualquier territorio productor de alimentos."

 me_nuragic_3_title:0 "Restaurar el Nuraghe"
 me_nuragic_3_desc:0 "Durante meses, hemos tenido hombres trabajando arduamente en las montañas, extrayendo la piedra necesaria para reparar las fortificaciones nurágicas en nuestras tierras. El trabajo es agotador, y los trabajadores a menudo se quejan enormemente durante el calor del día, pero todos son conscientes de que este trabajo difícil es de suma importancia.\n\nAunque tenemos plena confianza en la capacidad de nuestros soldados para proteger a nuestra gente, nuestras mentes están tranquilas, sabiendo que, si todo falla, podemos reunirnos dentro de las paredes del nuraghe para recuperar nuestras fuerzas."
 me_nuragic_01_inv.3.a:0 "Que nunca tengamos la necesidad de retirarnos a estas torres"
 me_nuragic_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y Restaurar los Nuraghes#!' $mission_completed_tooltip_2$"

 me_nuragic_4_title:0 "La Caída de [GetProvince('(int32)3504').GetName]"
 me_nuragic_4_desc:0 "Desde el punto de vista de [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] en las colinas cercanas, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] tiene una vista dominante de las llanuras abajo, con todos los ojos puestos en el grueso rastro de humo negro que se eleva desde [GetProvince('(int32)3504').GetName]. Durante meses, los cartagineses han sabido de nuestros preparativos, pero en su arrogancia, nos desestimaron como meros bárbaros, incapaces de ejecutar nuestros planes de guerra. Se pensaron seguros tras sus muros, pero claramente malinterpretaron la naturaleza del peligro en el que se encontraban.\n\nVolviéndose hacia un asesor cercano, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] da una orden seca. 'Encuentra al comandante de la ciudadela y envía su cabeza a Cartago. No perdones a nadie más que encuentres.'"
 me_nuragic_01_inv.4.a:0 "Este es un mensaje que los cartagineses entenderán..."
 me_nuragic_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y La primera ciudad en caer#!' $mission_completed_tooltip_2$"

 me_nuragic_5_title:0 "Bloqueando la Puerta Trasera"
 me_nuragic_5_desc:0 "Finalmente hemos recibido la noticia de que nuestra construcción en curso en [GetProvince('(int32)3506').GetName] está casi terminada, a pesar del acoso de los corsos locales que no desean ver nuestra presencia en la región. Aún así, los soldados en el lugar de trabajo son más que capaces de ahuyentar a estos hostigadores, por lo que el trabajo llega a su inevitable conclusión.\n\nAunque la fortaleza en [GetProvince('(int32)3506').GetName] es un logro impresionante, nuestro arquitecto jefe nos ha informado que podríamos hacer más para reforzar nuestras defensas, si tenemos el dinero para hacerlo."
 me_nuragic_01_inv.5.a:0 "Esto es más que adecuado para nuestros propósitos"
 me_nuragic_01_inv.5.b:0 "Vale la pena gastar más, para prevenir una calamidad en el futuro"
 me_nuragic_5a_tooltip:0 "$mission_completed_tooltip_1$ '#Y Bloqueo de la puerta trasera#!' $mission_completed_tooltip_2$"
 me_nuragic_5b_tooltip:0 "$mission_completed_tooltip_1$ '#Y Bloqueo de la puerta trasera#!' $mission_completed_tooltip_2$"

 me_nuragic_6_title:0 "Un Punto de Apoyo en Phikaria"
 me_nuragic_6_desc:0 "Aunque hemos hecho todo lo posible por asegurar las costas del norte de Cerdeña, nos encontramos constantemente molestos por los saqueadores corsianos y tibulatianos, quienes, incapaces de aceptar su derrota a nuestras manos, han recurrido a la bandidaje, tomando con astucia y traición lo que no pueden con la fuerza de las armas. Erróneamente creyéndose seguros en la isla de Córcega, nos hemos visto obligados a construir un puesto avanzado en la isla, con la esperanza de acosar su intento de cruzar el Mare Sardoum desde la fuente.\n\nLa situación es aceptable por ahora, pero insostenible a largo plazo... podríamos vernos obligados a pacificar la isla eventualmente."
 me_nuragic_01_inv.6.a:0 "Ahora podemos vigilar a esta maldita chusma"
 me_nuragic_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y Un punto de apoyo en Phikaria#!' $mission_completed_tooltip_2$"

 me_nuragic_7_title:0 "Ojos en las Colinas"
 me_nuragic_7_desc:0 "'¡Agáchate, idiota! ¡Están casi sobre nosotros!' [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] susurra, agarrando a [SCOPE.sCharacter('random_dude3').GetName] por la túnica y arrastrándolo hacia el matorral. Segundos después, un gran grupo de caballería ligera pasa galopando por el lugar donde estabas de pie, se evitó el desastre por poco. Dando la señal una vez que el retumbar de cascos ha desaparecido, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] reúne a los soldados de [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] y se arrastran en el suelo hasta la colina, observando a los jinetes enemigos mientras se dirigen hacia la costa.\n\nLos cartagineses han duplicado sus patrullas últimamente, y aunque están inundando nuestra isla con plata, contratando a cualquiera dispuesto a enfrentarnos, nuestros exploradores están encontrando los lugares ocultos en los valles y vigilando sus movimientos, que los dioses lo agradezcan. Con un poco de suerte, podremos mantener esta ventaja, especialmente con la ayuda de los rebeldes de montaña, que conocen estos caminos como la palma de sus manos."
 me_nuragic_01_inv.7.a:0 "Haz lo posible por permanecer invisible - necesitamos el elemento sorpresa"
 me_nuragic_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y Ojos en las colinas#!' $mission_completed_tooltip_2$"

 me_nuragic_8_title:0 "Regalos Sangrientos para Babai"
 me_nuragic_8_desc:0 "A medida que el deseo de expulsar a los extranjeros al mar continúa creciendo dentro de nuestro pueblo, nuestros sacerdotes sugirieron que deberíamos invocar los antiguos rituales para prepararnos para la próxima guerra que liberará nuestra tierra para siempre. \n\nPor lo tanto, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ha decidido que debemos apelar al juramento sagrado para ganar el favor de nuestro Padre. Se han convocado bandas de guerreros dentro de #E Nurac Nurdole#! para unir su destino a la voluntad de Sardo. Uno por uno, cada iniciado fue conducido al interior del Nuraghe; allí, las espadas sagradas en las piedras y el agua sagrada del pozo sagrado infundían miedo religioso en el alma. En el centro del recinto sagrado, los esperaban guacamayos y animales sacrificados, con guerreros con cascos con cuernos alineados y espadas desenvainadas.\n\nEl joven fue conducido ante los altares más como una víctima que como un iniciado, y cada asistente juraba que no revelaría lo que había visto u oído. Obligaron a los iniciados a jurar por una fórmula especialmente elaborada; Que haya una maldición sobre ellos, sobre sus familiares y parientes, si se negaron a luchar donde sus generales deseaban, o si huyeron del campo de batalla, o vieron a otro huir y no hicieron nada para matarlo. Algunos que se habían negado a pronunciar las palabras sagradas de esa manera fueron asesinados bárbaramente ante los altares. Sus cadáveres, abandonados entre las demás víctimas, fueron un ejemplo para otros que se negaron a jurar."
 me_nuragic_01_inv.8.a:0 "Babai no olvidará esta ofrenda... ¡el precio valdrá la pena!"
 me_nuragic_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y Juramento a los dioses#!' $mission_completed_tooltip_2$"

 me_nuragic_9_title:0 "El Puerto de Cornus"
 me_nuragic_9_desc:0 "Durante mucho tiempo, hemos sabido que el asentamiento de [GetProvince('(int32)3494').GetName] ha sido un importante lugar de paso para los mercaderes cartagineses, quienes a menudo se detienen en este puerto amigable para obtener agua fresca y suministros mientras atraviesan el Mare Sardoum plagado de piratas.\n\nNo hace falta decir que nuestra reciente victoria allí hará mucho para frustrar estos esfuerzos. Oh, sí, y el tesoro dejado atrás es una agradable adición a nuestras propias arcas."
 me_nuragic_01_inv.9.a:0 "Cada pequeño aporte cuenta"
 me_nuragic_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y El puerto de Sanaphar#!' $mission_completed_tooltip_2$"
 
 me_nuragic_900_title:0 "El juramento de Hospiton"
 me_nuragic_900_desc:0 "Dicen que llegó al anochecer, cuando el viento traía el aroma de mirto salvaje y sal marina desde la costa occidental. Sus pasos resonaron por el pasillo como si la tierra misma lo recordara. No fue un hombre el que entró aquella tarde en el tribunal, sino una sombra olvidada.\n\nVestido con una prístina armadura nurágica hecha de cuero hervido y ennegrecido, moldeada con aceites sagrados y cosida con piel extraída de bestias extintas hace mucho tiempo en la isla. Sobre su cabeza descansaba un yelmo con cuernos grabado con runas que se pensaba perdidas hace mucho tiempo: una marca que ninguna gente común se atreve a usar, y que sólo la sangre realmente gana.\n\nHospital de Sanaphar, lo llamaban.\n\nSobre su pecho corría un cinturón de cuchillos. Su cuero finamente trabajado tenía el sagrado patrón en V, cada galón era una medalla, una marca de gran honor y coraje en la batalla. El cinturón estaba cubierto con cinco galones: sólo a los del más alto orden marcial (los que podían navegar en una noche de tormenta, los que mataban a cientos de enemigos) se les permitía ese patrón. Y todos en el tribunal lo sabían. Algunos sólo habían visto esos cinturones enterrados con los muertos.\n\nUn cacique local, sí, pero más que eso. No era un hombre corriente, pero era lo que sostenía lo que acallaba incluso el susurro de la seda entre los nobles.\n\nEn su mano extendida había un escarabajo dorado, en cuya superficie estaba grabado el cartucho de Usermaatre Setepenre, el nombre de Ramsés II, el Dios Viviente de Kemet. El escarabajo brillaba con un brillo sobrenatural, como si todavía llevara el calor del sol del Nilo.\n\nHospiton alzó la voz, no fuerte, pero con tanta fuerza que silenció la sala:\n\n“Soy Hospiton, hijo de Agasin, hijo de Tar-Ammon\nDescendiente de la sardana que cruzó las arenas\nQuien estuvo al lado del Hijo de Ra\nEste escarabajo se lo regaló a mi antepasado.\nNo como una baratija, sino como un sello de parentesco.\nCon ello sello ahora mi juramento”.\n\nColocó el escarabajo en el escalón más bajo del trono, luego desenvainó su daga nurágica (la empuñadura tallada en la forma sagrada de gammadion) y clavó su punta en la piedra que había al lado.\n\n“Por la luz de Il, padre\nPor la sangre de mis antepasados,\nPor esta espada y por este escarabajo,\nPrometo mi vida al rey de Sarda,\nY al renacimiento de la gloria de Sardán”.\n\nNinguno se atrevió a hablar. Sabían lo que esto significaba. Hospiton no era un hombre; hablarían de él como de una señal.\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] descendió y, sin decir palabra, tocó el escarabajo con dos dedos y luego colocó su mano sobre el corazón de Hospiton.\n\nLa corte estalló en cánticos y el sonido de los tambores se elevó desde los pasillos inferiores. Afuera, el viento traía ahora el aroma de presagios de realeza, guerra y legado."
 me_nuragic_01_inv.900.a:0 "Sea alabado Sardo."
 me_nuragic_900_tooltip:0 "$mission_completed_tooltip_1$ '#Y El puerto de Sanaphar#!' $mission_completed_tooltip_2$"

 me_nuragic_10_title:0 "La destrucción de [GetProvince('(int32)3483').GetName]"
 me_nuragic_10_desc:0 "[GetProvince('(int32)3483').GetName], ha caído en manos de las fuerzas victoriosas de [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], y la venganza deseada por nuestros sanguinarios soldados es aterradora. Desde que tenemos uso de razón, los cartagineses han aterrorizado a nuestro pueblo detrás de los muros de [GetProvince('(int32)3483').GetName], actuando como si fueran dueños de la isla, pero ahora los dioses han abandonado a los pérfidos descendientes de Tiro y la hora del juicio está cerca.\n\nCuando los ejércitos de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] se acercaron por primera vez a [GetProvince('(int32)3483').GetName], se temía que la victoria resultaría en el odiado La capital cartaginesa está completamente destruida; sinceramente, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] podría no ser capaz de evitar que los [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] hombres quemen la ciudad.\n\nAl arrasar esta ciudad, los soldados creen que los crímenes de sus padres finalmente serán vengados, un paso simbólico hacia la purga de la odiosa presencia de los cartagineses de la tierra para siempre, pero nuestros asesores se están tirando de los pelos ante la idea de saqueando una de las pocas ciudades de nuestra isla.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] se encuentra ante las puertas de [GetProvince('(int32)3483').GetName], un ejército entero esperando la orden... con una sola palabra, miles de almas podrían perecer."
 me_nuragic_01_inv.10.a:0 "No derrames lágrimas por ellos; esto es lo que merecen. ¡Quémalo todo!"
 me_nuragic_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y La marcha hacia Nura#!' $mission_completed_tooltip_2$"
 me_nuragic_01_inv.10.b:0 "He cambiado de opinión - dile a los hombres que sparnen la ciudad"

 me_nuragic_11_title:0 "Tierras Agrícolas de Karalian"
 me_nuragic_11_desc:0 "Durante las últimas semanas, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ha estado pasando cada vez más tiempo en la provincia de [GetProvince('(int32)3484').GetName]. Estando familiarizado con toda Cerdeña en este momento, habiendo pasado la mayor parte de [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] vida adulta haciendo campaña en la isla, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] conoce bien prácticamente todos los caminos de montaña y valles que contiene nuestra isla, por lo que no debería sorprender que Karali haya recibido la mayor atención.\n\n[GetProvince('(int32)3484').GetName] está bendecida con campos fértiles y arroyos de agua dulce, con mucho espacio para nuestros animales de granja. Deambular a su voluntad. Las abejas que viven en el campo producen una miel teñida de un ligero amargor que los golosos encuentran exquisita, y los vinos producidos en los viñedos de [GetProvince('(int32)3484').GetName] son simplemente los mejores que se encuentran en Cerdeña. No es alguien que le guste la vida tranquila, incluso el poderoso [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] ha quedado cautivado por los encantos de la región y ordenó que la ciudad se construyera con estándares exigentes."
 me_nuragic_01_inv.11.a:0 "Veo un futuro aquí..."
 me_nuragic_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y Tierras agrícolas de Karalian#!' $mission_completed_tooltip_2$"
 
 me_nuragic_12_title:0 "Una Capital del Sur"
 me_nuragic_12_desc:0 "Ahora que las celebraciones en [ROOT.GetCountry.GetCapital.GetName] están empezando a amainar, es hora de centrar nuestra atención en un asunto serio: la selección de una nueva capital.\n\nComo todo el mundo sabe, hay muchos candidatos destacados entre los que podemos elegir, por lo que [ROOT.GetCountry.GetRuler.GetFirstName] tendrá [ROOT.GetCountry.GetRuler.GetHerHis] trabajo por delante. Afortunadamente, este es un dilema agradable y auspicioso para nuestra nación."
 me_nuragic_01_inv.12.a:0 "Este día marca verdaderamente el comienzo de nuestra historia"
 me_nuragic_01_inv.12.b:0 "La antigua sede del poder cartaginés, Nura, es la elección natural"
 me_nuragic_01_inv.12.c:0 "No hay otro lugar como Karalis, debe estar ahí."
 me_nuragic_01_inv.12.d:0 "Tarsis es una excelente elección, su antigua gloria volverá a brillar."
 me_nuragic_01_inv.12.e:0 "Orgulloso Luguido es mi sugerencia favorita."
 me_nuragic_01_inv.12.f:0 "Phausiane... ¿puede haber alguna otra capital?"
 me_nuragic_01_inv.12.g:0 "Mantendremos nuestro capital tradicional."
 me_nuragic_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y Una nueva capital#!' $mission_completed_tooltip_2$"

 me_nuragic_13_title:0 "Apoderarse de los Barcos"
 me_nuragic_13_desc:0 "Nuestros guerreros se deslizaron a través de las ensenadas y los bajíos llenos de juncos, remando en esquifes bajos diseñados para el silencio. Se apagaron las antorchas. Escudos envueltos en tela. No se pronunció una palabra. Las estrellas fueron testigos de lo que se convertiría en leyenda.\n\nUno a uno, llegamos a los cascos de los barcos anclados. Se subieron las escaleras. Los ganchos mordieron la madera. No con violencia, sino con precisión. A bordo, los pocos centinelas fueron abatidos antes de que pudieran gritar: les cortaron el cuello o los arrojaron al mar. En unos instantes, las cubiertas eran nuestras.\n\nEntonces llegó la señal: una única flecha de fuego se disparó hacia el cielo desde los acantilados. De inmediato, sonaron las bocinas y el puerto se puso en movimiento, no por el pánico, sino por la victoria. Nuestros hombres desplegaron nuevas velas llevando el sol de Sarda. Otros se lanzaron a los barcos restantes, cortando amarras, apoderándose de armas y arrojando provisiones y símbolos cartagineses al agua oscura. La flota de [GetProvince('(int32)3504').GetName] ahora luce los colores de Sarda."
 me_nuragic_01_inv.13.a:0 "¿Una flota, dices? Esto es ciertamente inesperado"
 me_nuragic_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y Apoderarse de los barcos#!' $mission_completed_tooltip_2$"

 me_nuragic_14_title:0 "Un Ojo Ciego al Pirata"
 me_nuragic_14_desc:0 "'¡Hermanos! ¡Que el abuelo te trate bien!'\n\nAl oír estas palabras, una brillante sonrisa ilumina el rostro de [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. Cruzando la cubierta del [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] buque insignia, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] saluda al líder de los Piratas del Parate, quien ha respondido a nuestro llamado y ha accedido a escuchar lo que le proponemos. Ciertamente es un espectáculo extraño de presenciar, ya que los Piratas han navegado con su flota justo a las afueras de [GetProvince('(int32)3504').GetName], donde [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] acordó salir y encontrarlos en el mar.\n\nLa piratería es un negocio lucrativo, y [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] ha decidido que queremos participar en el glorioso negocio.\n\n'Como puedes ver, hemos Construimos todo lo que uno podría necesitar aquí, pero nos falta gente... las guerras han sido duras para nosotros. Di la palabra y te abriremos nuestro puerto a ti y a tus hombres."
 me_nuragic_01_inv.14.a:0 "Por supuesto, establézcanse aquí; ambos ganaremos con este acuerdo"
 me_nuragic_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y Hacer la vista gorda ante la piratería#!' $mission_completed_tooltip_2$"

 me_nuragic_15_title:0 "Esclavos en Nuestra Propia Tierra"
 me_nuragic_15_desc:0 "En la antigüedad vivíamos en un estado de armonía. Durante mucho tiempo, hemos dejado que los #E fenicios#! crearan puestos comerciales en varios de nuestros asentamientos costeros, generando grandes ganancias para nuestra gente mientras nuestros asentamientos se convertían en ciudades ricas y competitivas.  Todo esto cambió con la llegada de los #E cartagineses#!, otra colonia fenicia situada en África, que, tras someter a sus rivales locales, decidió hacerse con el control de nuestra querida isla.\n\nAsí comenzó la guerra: la expedición cartaginesa estaba dirigida por Malco, un general que ya había vencido a los griegos en Sicilia. Se libraron muchas batallas de campo en nuestra llanura de Iolea, hasta que Malco y su fuerza fueron completamente aniquilados y obligados a abandonar nuestras tierras. El propio Malco, al regresar a Cartago después de la catastrófica derrota, fue ejecutado por su propio pueblo.\n\nGrandes fueron las fiestas que tuvimos para celebrar nuestra victoria, pero la paz no duró mucho. Cinco años después del intento fallido de Malco, sus hijos Amílcar y Asdrúbal regresaron nuevamente, más fuertes que antes, para conquistar nuestra tierra. Nuestras llanuras fueron aún asoladas por otro conflicto devastador. Muchos fueron los intentos de repeler a los invasores, a menudo exitosos y otras veces fracasados. Después de treinta largos años de guerra, se llegó a un punto muerto; los cartagineses no pudieron expandirse más en nuestras colinas y montañas interiores, asegurando así nuestro control de las costas norte y este, sin embargo, habíamos perdido para siempre nuestras grandes llanuras de Iole y los ricos campos minerales del sur. \n\nDurante doscientos años, Cartago ha intentado expandirse aún más en nuestras tierras, pero gracias a las duras condiciones del terreno y la fuerza indomable de nuestros antepasados, hemos logrado mantener nuestra libertad. A menudo llevamos a cabo emboscadas y escaramuzas en las llanuras que alguna vez fueron propiedad de nuestros antepasados, porque si no podemos recuperarlas, nadie se beneficiará de los frutos.\n\nAún hoy, los extranjeros se han mostrado reacios a establecerse en nuestra isla, desanimados, tanto por nosotros como por el aire venenoso que ha envuelto las llanuras perdidas de nuestros antepasados ​​desde el día que los dejamos. Sin embargo, durante demasiado tiempo hemos permitido que estos inmundos intrusos se enriquezcan a nuestras expensas, consumiendo nuestras ricas vetas minerales y empobreciendo nuestras tierras de cultivo para su propio beneficio. Ha llegado el momento de retomar la llanura de Iolea; Nuestros enemigos volverán a ser testigos de la furia de quienes construyeron las Torres. [ROOT.GetCountry.GetRuler.GetFirstName] debe demostrar a los [ROOT.GetCountry.GetRuler.GetHerHis] antepasados ​​que [ROOT.GetCountry.GetRuler.GetSheHe] es digno de su presencia en los pasillos de Norgoddoe."
 me_nuragic_01_inv.15.a:0 "Yo, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], no puedo soportar esto más..."
 me_nuragic_15_tooltip:0 "¿Cuánto tiempo puede durar esta situación?"

 me_nuragic_16_title:0 "Huests Inestables"
 me_nuragic_16_desc:0 "Aunque nuestras tribus se separaron hace cientos de años, nuestra gente ha mantenido una conexión tenue con nuestros parientes baleares, que viven en las islas del lejano oeste. Es allí, en las Baleares, donde se han establecido los temibles Piratas de Mago, aprovechando las ricas rutas comerciales que conectan Iberia y Cartago.\n\nClaramente, tienen todo nuestro respeto: les ayudaremos en el esfuerzo de expulsar a los cartagineses de su archipiélago... apoderándonos de las islas. Se dice que nuestros antepasados ​​construyeron cientos de Nuraghes en la isla de Mago, antes conocida como Nura - [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] no puede soportar el hecho de que estos otros Nuraghes estén en manos de extranjeros. 'Hay que hacer algo, pero ¿qué? Quizás el mejor curso de acción es aquel que nadie sospecharía jamás...'"
 me_nuragic_01_inv.16.a:0 "¡Zarpamos hacia Mago al amanecer! ¡Prepárense nuestros barcos!"
 me_nuragic_16_tooltip:0 "#R ¡Declararemos la guerra a Gymnaesia inmediatamente!#! $mission_completed_tooltip_1$ '#Y Invitados estancados#!' $mission_completed_tooltip_2$"
 me_nuragic_01_inv.16.b:0 "Reúne nuestras reclamaciones por ahora: navegaremos cuando los augurios sean favorables"
 me_nuragic_16_b_tooltip:0 "$mission_completed_tooltip_1$ '#Y Invitados obsoletos#!' $mission_completed_tooltip_2$"

 me_nuragic_17_title:0 "Las minas de palma"
 me_nuragic_17_desc:0 "Por fin, hemos terminado de construir una mina en la provincia de [GetProvince('(int32)1465').GetName], y no hemos perdido el tiempo en llenar la cantera con esclavos baleares.\n\nAunque muchos de los hombres que ahora trabajan en los oscuros pozos de las minas alguna vez fueron ciudadanos destacados, sus vidas anteriores son un recuerdo lejano, y no les queda nada allí excepto recuerdos agridulces de cómo eran las cosas. Ahora sólo queda el pico, hasta que finalmente llega la muerte para aliviarlos de sus labores."
 me_nuragic_01_inv.17.a:0 "Una mina es un uso mucho más inteligente de esta tierra. ¿En qué estaban pensando?"
 me_nuragic_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y Las minas de Palma#!' $mission_completed_tooltip_2$"
 
 me_nuragic_170_title:0 "Honderos Baleares"
 me_nuragic_170_desc:0 "Desde pequeños, los hijos de Baleares son entrenados con la honda, no como juego, sino como rito. Con tres trozos de cuerda (corto, mediano y largo) pueden herir a una liebre en la carrera o romper un escudo desde lejos.\n\nNo piden armadura, ni caballos, ni bronce: sólo una bolsa de piedras, mano firme y terreno abierto. Ligeros de pie y letales a distancia, los honderos baleares se han ganado su temible reputación en todo el mar, habiendo servido en guerras lejanas, desde las montañas de Iberia hasta las llanuras de África.\n\nAhora, bajo nuestros estandartes, estos hijos de piedra podrían servir a una causa superior, no como mercenarios, sino como compañeros de armas. Concedémosles honor y buenas monedas, y sus andanadas ablandarán al enemigo antes de que nuestras lanzas los alcancen."
 me_nuragic_01_inv.170.a:0 "Ignorar su valor sería una locura."
 me_nuragic_01_inv.170.b:0 "No son tan buenos."
 me_nuragic_170_tooltip.a:0 "Instituir cuerpos especiales de Honderos Baleares, integrarlos entre nuestras filas."
 me_nuragic_170_tooltip.b:0 "No son diferentes a cualquier otro hondero de nuestra gran nación."

 me_nuragic_18_title:0 "Liquidar [GetProvince('(int32)3510').GetName]"
 me_nuragic_18_desc:0 "[ROOT.GetCountry.GetRuler.GetFirstName], que nunca desperdicia una oportunidad, ha decidido sabiamente desviar parte de la riqueza material de los ciudadanos de [GetProvince('(int32)3515').GetName] para financiar la construcción de una nueva ciudad en [GetProvince('(int32)3510').GetName].\n\nMientras que algunos corsos se han quejado de tener que pagar este impuesto adicional, [ROOT.GetCountry.GetRuler.GetFirstName] ha argumentado que todos en la isla se beneficiarán, especialmente ahora que será más fácil. Para poblar la costa occidental."
 me_nuragic_01_inv.18.a:0 "Créanme, estoy pensando en el largo plazo... ¡tengan fe!"
 me_nuragic_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y Ciudades corsas#!' $mission_completed_tooltip_2$"
 
 me_nuragic_19_title:0 "Estrecho de Taphros"
 me_nuragic_19_desc:0 "Tener un control constante sobre [GetProvince('(int32)3508').GetName] y [GetProvince('(int32)3506').GetName] puede garantizar una influencia firme en el estrecho de Taphros.\n\nLos barcos que intentarán tener una ruta más rápida entre Iberia y la península italiana tendrán que pagar pequeñas tarifas marítimas para cruzar el estrecho. Según los sabios planes de [ROOT.GetCountry.GetRuler.GetFirstName], Taphros ofrecerá una ruta comercial segura bajo la protección de nuestro pueblo, exenta del peligro de los piratas, y la afluencia comercial beneficiará a nuestros mercados y puertos costeros, que recibirían la mejor artesanía naval."
 me_nuragic_01_inv.19.a:0 "Las puertas de Cerdeña y Córcega están en nuestras manos."
 me_nuragic_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y Estrecho de Taphros#!' $mission_completed_tooltip_2$"

 me_nuragic_20_title:0 "El grano de Nurrensia"
 me_nuragic_20_desc:0 "Las llanuras de Nurrensia brillan con nuestra grandeza; Se han completado los canales y se han excavado nuestros pozos de agua; todo ha sido concebido cumpliendo la sabia visión de [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]. [GetProvince('(int32)3496').GetName] se convertirá verdaderamente en el granero de Cerdeña y pronto recogeremos los frutos de nuestro duro trabajo."
 me_nuragic_01_inv.20.a:0 "¡Alabado seas, Sardo! Has bendecido nuestras espadas y nuestros campos."
 me_nuragic_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y El grano de Nurrensia#!' $mission_completed_tooltip_2$"
 
 me_nuragic_21_title:0 "Arrasar a los extranjeros"
 me_nuragic_21_desc:0 "Ya no nos limitaremos a atacar y desaparecer. Nuestra furia ya no será un susurro en el viento. Descendemos ahora, no como hostigadores, sino como fuego hecho carne. No vamos a reclamar, sino a arrasar. Ninguna bandera extranjera se mantendrá erguida. Que ningún campo dé grano para sus mesas. Que arda la llanura de Iolea, para que nadie confunda esta tierra con la suya.\n\nEl tiempo de espera ha pasado. La montaña vuelve a hablar y su voz es la guerra. \n[ROOT.GetCountry.GetRuler.GetFirstName] ahora debe descender, con la espada desenvainada, para grabar [ROOT.GetCountry.GetRuler.GetHerHis] el nombre en la piedra de la memoria. Si los antepasados ​​están mirando, que vean que la sangre de Sardán no se ha helado."
 me_nuragic_01_inv.21.a:0 "Toma cualquier cosa de valor y quema el resto."
 me_nuragic_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y Arrasar a los extranjeros#!' $mission_completed_tooltip_2$"
 
 me_nuragic_22_title:0 "construir una flota"
 me_nuragic_22_desc:0 "La montaña se agita, y también el mar. El llamado a construir de nuevo resuena en toda Cerdeña, desde las bocas de los jóvenes guerreros hasta los martillos de los últimos carpinteros navales. Levantaremos una nueva flota, no para el comercio, no para el espectáculo, sino para la guerra, para el orgullo, para reclamar nuestro nombre sobre las olas.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] ahora ve esta visión hecha realidad: hemos construido una flota con prisa y propósito: embarcaciones delgadas, rápidas y ágiles, nacidas para la persecución y el fuego. Que nuestros barcos regresen al mar como zorros a la caza. Que los comerciantes extranjeros vuelvan a temer el horizonte. Que ardan los trirremes del invasor. Que los muelles se llenen de martillos y llamas, y que las forjas ardan con la promesa de venganza. El mar también debe recordar quiénes somos."
 me_nuragic_01_inv.22.a:0 "La montaña gobierna la tierra. La flota gobernará el mar."
 me_nuragic_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y Construir una flota#!' $mission_completed_tooltip_2$"
 
 me_nuragic_23_title:0 "Apunta a Córcega"
 me_nuragic_23_desc:0 "Ya no podemos darnos el lujo de mirar al norte y ver a nuestros hermanos viviendo como extraños en su propia tierra. Los etruscos pueden volverse más audaces si no se les controla. La próxima vez mirarán a Cerdeña, como siempre lo han hecho. Debemos atacar ahora, no sólo para proteger nuestro futuro, sino también para restaurar lo que nos arrancaron del pasado.\n\nEsta no es una guerra de ambición: es un deber. Un regreso a casa. Un ajuste de cuentas.\n\nQue nuestros barcos crucen el estrecho con fuego en el corazón. ¡Que caigan las avanzadas etruscas, una a una, al grito de Utturà Utalabì! Que los montañeses corsos vean nuestras banderas al viento y sepan que los sardos no los han olvidado.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] ahora debemos actuar, no sea que la historia escriba que nos contentamos con dejar que nuestra propia carne sea gobernada por manos extranjeras. La isla del norte nos llama. Y responderemos, no con palabras, sino con la guerra."
 me_nuragic_01_inv.23.a:0 "Nuestros hermanos piden ayuda, es nuestro deber."
 me_nuragic_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y Apunta a Córcega#!' $mission_completed_tooltip_2$"
 
 me_nuragic_24_title:0 "La punta de Córcega"
 me_nuragic_24_desc:0 "Este puerto es a la vez un comienzo y una advertencia. Es la puerta de entrada al norte, el yunque sobre el que se forjarán nuestras flotas. El sonido de los martillos ya resuena en la orilla y el olor a brea y aserrín se mezcla con el de la sal. Los carpinteros trabajan incansablemente. Los montañeses corsos traen madera de los bosques del interior. Los estandartes sardanos ondean muy por encima de los acantilados, desafiando a los etruscos a mirar al otro lado del mar y recordar quién ha venido para quedarse.\n\nNo vinimos a Córcega solo por la gloria. Vinimos por justicia, por sangre, por los viejos lazos de parentesco cortados hace mucho tiempo. Y ahora, con este puerto como ancla, no seremos desalojados. Que este lugar sirva de recordatorio: los sardanos no retroceden. Cuando construimos, construimos para perdurar.\n\nDejemos que los gobernantes de Etruria miren a través de las aguas y vean su futuro, no en visiones, sino en velas.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] ha reclamado esta costa en nombre de la montaña y el mar, y desde este puerto de piedra, se escribirá el próximo capítulo de nuestro pueblo, a través de olas, a través de espadas, a través del tiempo mismo."
 me_nuragic_01_inv.24.a:0 "De norte a sur, Córcega es ahora libre."
 me_nuragic_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y La punta de Córcega#!' $mission_completed_tooltip_2$"
 
 me_nuragic_25_title:0 "Destino de [GetProvince('(int32)3515').GetName]"
 me_nuragic_25_desc:0 "Mientras caminamos por las calles de [GetProvince('(int32)3515').GetName], no vemos una ciudad extranjera: vemos un recuerdo perdido. Porque [GetProvince('(int32)3515').GetName] no siempre fue de ellos. Antes de que los etruscos llegaran con el hierro y las monedas, antes incluso de que los griegos construyeran sus fugaces puestos de avanzada, esta tierra era observada por ojos como los nuestros. \n\nAhora que está nuevamente bajo nuestras manos, debemos preguntarnos: ¿qué será de Alalia?\n\n¿La levantaremos al suelo, para que ninguna mano extranjera pueda volver a reclamarla? ¿Dejar que sus piedras caigan al mar y que el tiempo se trague su nombre? ¿O la transformaremos, piedra a piedra, pilar a pilar, en una ciudad sarda, leal a la montaña, al mar y a la memoria de nuestros antepasados? Lo que hagamos con [GetProvince('(int32)3515').GetName] resonará más allá de sus muros. \n\n[ROOT.GetCountry.GetRuler.GetFirstName] debemos elegir sabiamente. Porque Alalia no es sólo una ciudad: es un símbolo. De regreso. De ajuste de cuentas. De lo que significa ser Sardan en un mundo que durante mucho tiempo ha tratado de olvidarnos.\n\nQue la decisión quede grabada en piedra, para todos los que vengan después."
 me_nuragic_01_inv.25.a:0 "[GetProvince('(int32)3515').GetName] ya no es digno de Sardo."
 me_nuragic_01_inv.25.b:0 "Haz que [GetProvince('(int32)3515').GetName] vuelva a prosperar."
 me_nuragic_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y Destino de Alalia#!' $mission_completed_tooltip_2$"
 
 me_nuragic_26_title:0 "Desarrollar el norte"
 me_nuragic_26_desc:0 "El norte debe prosperar, no sólo por sí mismo, sino también por la fortaleza de toda Cerdeña.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] ahora debe pasar de la espada al martillo, del campo de guerra al taller. Hay que domesticar los campos, convertir los bosques en barcos y hogares, y dar a la gente razones para creer no sólo en la libertad, sino también en el futuro.\n\nDejemos que los vientos del norte lleven el sonido de la nueva vida. Que la piedra vuelva a hablar con la lengua de las torres."
 me_nuragic_01_inv.26.a:0 "Balaria debe recuperarse."
 me_nuragic_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y Desarrollar el Norte#!' $mission_completed_tooltip_2$"
 
 me_nuragic_27_title:0 "Desarrollar el sur"
 me_nuragic_27_desc:0 "Las ciudades costeras, alguna vez radiantes con nuestras costumbres, ahora usan máscaras extranjeras. Se llaman a sí mismos sardopúnicos (mitad nuestros, mitad suyos) y se inclinan ante Cartago mientras se deleitan con los frutos de la tierra sarda. Sus muros están construidos sobre los huesos de nuestros antepasados, pero sus estandartes no llevan nuestros sellos. Sus mercados hablan una lengua que no nace de la montaña ni del mar.\n\nEn el interior, las tribus iliensianas viven fragmentadas: orgullosas, feroces y obstinadas. Cada clan de las colinas reclama su propio dominio y cada jefe desconfía del siguiente. Recuerdan las viejas costumbres, pero no la fuerza que alguna vez compartimos cuando estábamos unidos. Esta división ha dejado al sur vulnerable: primero a la influencia extranjera, ahora a la decadencia.\n\nEsto debe terminar.\n\nSi Cerdeña quiere resurgir, Iliensia debe recuperarse. Las tribus deben reunirse bajo una sola bandera, no sólo por la fuerza, sino por juramento y propósito. Y las ciudades costeras deben ser recuperadas, no sólo con espadas, sino con la verdad: eran nuestras antes que de nadie.\n\nQue Tarsis vuelva a escuchar nuestros tambores. Que Sanaphar abra sus puertas al llamado de la montaña. Que Sarcapos recuerde a los constructores que levantaron sus muelles. Dejemos que Sulki, Nura y Karali sean lo que alguna vez fueron: no colonias, ni puertos comerciales, sino ciudades sardanas, orgullosas y libres."
 me_nuragic_01_inv.27.a:0 "Esta tierra era nuestra mucho antes de su llegada. Volverá a prosperar como en los viejos tiempos, de nuestra mano."
 me_nuragic_27_tooltip:0 "$mission_completed_tooltip_1$ '#Y Desarrollar el Sur#!' $mission_completed_tooltip_2$"
 
 me_nuragic_28_title:0 "Minas Lesitanas"
 me_nuragic_28_desc:0 "Deje que se limpien los ejes. Que se mapeen y refuercen los viejos túneles. Deja que las forjas quemen los minerales lesitanos. Y que aquellos que alguna vez compraron nuestros metales a gran costo recuerden que los sardanos ya no guardan silencio. La riqueza de [GetProvince('(int32)3502').GetName] no sólo está enterrada en su suelo, sino en su retorno. \n\n[ROOT.GetCountry.GetRuler.GetFirstName] ahora debe dar la orden, para que el pico y la antorcha puedan descender una vez más. Porque si las minas de [GetProvince('(int32)3502').GetName] despiertan, también lo hará el poder de Cerdeña. La montaña observa. La tierra está lista. Debemos excavar no sólo en busca de minerales, sino también para el futuro."
 me_nuragic_01_inv.28.a:0 "Las Minas de Balaria despertarán."
 me_nuragic_28_tooltip:0 "$mission_completed_tooltip_1$ '#Y Minas Lesitanas#!' $mission_completed_tooltip_2$"
 
 me_nuragic_29_title:0 "Puerto de Karensia"
 me_nuragic_29_desc:0 "No sólo un muelle para barcos pesqueros o un desembarcadero para embarcaciones cansadas, sino un verdadero puerto: fuerte, rodeado de piedras y protegido contra el mar. Un puerto donde pueden nacer flotas. Donde los comerciantes pueden atracar. Donde nuestros guerreros puedan saltar del barco a la orilla sin miedo a la marea.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] debemos actuar con rapidez. El mar no espera a nadie. Y los sardanos tampoco. Deje que el puerto de [GetProvince('(int32)3489').GetName] se eleve desde los acantilados como un desafío a las olas. Que quede como prueba de que incluso la costa más salvaje puede ser domesticada por la voluntad de nuestro pueblo."
 me_nuragic_01_inv.29.a:0 "Domina el acantilado, doma el mar."
 me_nuragic_29_tooltip:0 "$mission_completed_tooltip_1$ '#Y Puerto de Karens#!' $mission_completed_tooltip_2$"
 
 me_nuragic_290_title:0 "El mármol de [GetProvince('(int32)3489').GetName]"
 me_nuragic_290_desc:0 "En [GetProvince('(int32)3489').GetName], donde los duros acantilados se encuentran con el viento salado del mar Tirreno, la tierra ha revelado un secreto enterrado durante mucho tiempo bajo las laderas cubiertas de enredaderas: una veta de mármol pálido, fuerte, inmaculada y radiante bajo el sol de la mañana como los huesos de la Tierra misma.\n\nYa resuenan susurros en los pasillos de Sardan: ¿Deberían las colinas de Kares cambiar la prensa por el cincel?"
 me_nuragic_01_inv.290.a:0 "¡Invierta en canteras de mármol!"
 me_nuragic_01_inv.290.b:0 "No vale la pena."
 me_nuragic_01_inv.290.c:0 "Recuérdamelo dentro de 10 años."
 me_nuragic_290_tooltip.b:0 "[GetProvince('(int32)3489').GetName] seguirá produciendo vino."
 me_nuragic_290_tooltip.c:0 "El evento se repetirá dentro de 10 años, lo que será útil en caso de que no tengamos suficiente financiación."
 
 me_nuragic_291_title:0 "La Pompia"
 me_nuragic_291_desc:0 "En las arboledas del noreste, donde los vientos del mar se encuentran con el aliento de las montañas, crece una fruta como ninguna otra: una esfera dorada y retorcida cuyo aroma despierta la memoria y cuyo nombre se susurra con reverencia: Pompìa.\n\nCultivarla sería abrazar lo que es raro, lo que es exclusivamente nuestro. En un mundo de olivos, vino y trigo, distinguiría a Cerdeña, un tesoro que ningún comerciante extranjero puede reclamar como suyo.\n\nAhora, llega a la corte la noticia de que la Pompìa vuelve a prosperar: salvaje, inculta, sobreviviendo sólo en los testarudos huertos de unas pocas familias costeras. En el consejo surge la pregunta: ¿Invertiremos en esta fruta?"
 me_nuragic_01_inv.291.a:0 "¡Plantaremos granjas enteras de Pompìa!"
 me_nuragic_01_inv.291.b:0 "Es sólo un cítrico amargo."
 me_nuragic_01_inv.291.c:0 "Recuérdamelo dentro de 10 años."
 me_nuragic_291_tooltip.b:0 "[GetProvince('(int32)3503').GetName] seguirá produciendo vino."
 me_nuragic_291_tooltip.c:0 "El evento se repetirá dentro de 10 años, lo que será útil en caso de que no tengamos suficiente financiación."
 
 me_nuragic_292_title:0 "¡Los árboles de Pompìa se han vuelto productivos!"
 me_nuragic_292_desc:0 "Cuando plantamos los primeros retoños, muchos dudaron. La fruta era rara, testaruda y sólo se conocía en susurros que se transmitían de pueblo en pueblo. Había sobrevivido en los rincones salvajes de nuestra tierra, olvidado por los comerciantes e ignorado por los reyes. Pero el sardano se acordó. Vimos en Pompìa no sólo un fruto, sino un símbolo.\n\nLos árboles de Pompìa han dado sus primeros frutos. Nudosos y nobles, con hojas como bronce desgastado y raíces hundidas profundamente en el suelo de Sarda, estos árboles ahora brillan con orbes dorados.\n\n¿Qué haremos ahora?"
 me_nuragic_01_inv.292.a:0 "La primera cosecha es suficiente."
 me_nuragic_01_inv.292.b:0 "¡Confiscad esas granjas, sólo el rey comerá pompìa!"
 me_nuragic_01_inv.292.c:0 "¡Invertiremos más en estas granjas!"
 me_nuragic_292_tooltip.b:0 "Los árboles de pompìa pasarán a ser propiedad del rey."
 me_nuragic_292_tooltip.c:0 "El rey invertirá en el desarrollo de mejores tierras de cultivo para los árboles de Pompìa."
 
 me_nuragic_293_title:0 "El desarrollo de las tierras agrícolas de Pompìa"
 me_nuragic_293_desc:0 "No permitiremos que este fruto, nacido de nuestra tierra y de nuestra sangre, vuelva al olvido. Se plantarán nuevas arboledas: hileras de árboles jóvenes guiados por manos expertas y custodiados como una llama sagrada. Se excavarán canales de riego en la roca y las raíces para alimentarlos en los meses secos. Se levantarán muros de piedra para protegerlos del viento y el robo. Y alrededor de estas arboledas crecerán aldeas: hogares para aquellos cuyas vidas ahora están ligadas a la fruta, desde el agricultor hasta el perfumista, desde el conservador hasta el sacerdote."
 me_nuragic_01_inv.293.a:0 "¡Se plantarán más árboles!"
 me_nuragic_01_inv.293.b:0 "Planta árboles y cobra impuestos a los lugareños."
 me_nuragic_01_inv.293.c:0 "Seguiré personalmente los trabajos."
 
 me_nuragic_30_title:0 "Urbanizar Balaria"
 me_nuragic_30_desc:0 "Durante demasiado tiempo, la costa noroeste ha sido una frontera: rica, pero sin voz. Sus guerreros son fuertes, pero sin estandarte. Sus campos son fértiles, pero sin granero para alimentar a más de un pueblo. [GetProvince('(int32)3500').GetName] se convertirá en esa voz, ese estandarte, ese almacén de prosperidad.\n\nEsto no es una conquista, sino un regalo. A los balarianos, cuya fuerza mantuvo esta tierra mientras otros miraban hacia otra parte. A los sardanos, que ahora regresan no sólo como gobernantes, sino también como constructores. Y para las generaciones aún no nacidas, que caminarán bajo los muros de [GetProvince('(int32)3500').GetName] y lo llamarán hogar.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] sabe: un pueblo sin ciudad es viento sin vela. Con [GetProvince('(int32)3500').GetName], el norte ya no irá a la deriva: liderará."
 me_nuragic_01_inv.30.a:0 "Somos balarianos, somos ioleos. Somos sardanos."
 me_nuragic_30_tooltip:0 "$mission_completed_tooltip_1$ '#Y Urbanizar Balaria#!' $mission_completed_tooltip_2$"
 
 me_nuragic_31_title:0 "Consolidar Balaria"
 me_nuragic_31_desc:0 "En el oeste, las minas de [GetProvince('(int32)3502').GetName] truenan una vez más, arrancadas de las garras del tiempo. Su plomo canta en las forjas de nuestros artesanos y su plata viaja río abajo hasta el mar. Lo que antes era silencioso ahora es un horno de vida.\n\nEn el corazón de la llanura de Nurrensia, el agua fluye donde antes reinaba el polvo. Los canales se extienden como venas a través de los campos, y el suelo, olvidado hace mucho tiempo por los reyes, alimenta de nuevo a las aldeas y los graneros. [GetProvince('(int32)3500').GetName] se eleva con él: una ciudad de piedra y visión, un faro para todos los habitantes de Balaria.\n\nAl este, donde las olas rompen contra los acantilados, hemos construido puertos. En [GetProvince('(int32)3489').GetName], el viento ya no aúlla en soledad: lleva consigo el olor de la brea, de las velas, del movimiento. El mar, que alguna vez fue un obstáculo, ahora es nuestro camino.\n\nLa tierra recuerda a sus amos y las torres proyectan sus sombras largas una vez más."
 me_nuragic_01_inv.31.a:0 "Los enemigos de Sardan temen a los Nuraghes."
 me_nuragic_31_tooltip:0 "$mission_completed_tooltip_1$ '#Y Consolidar Balaria#!' $mission_completed_tooltip_2$"
 
 me_nuragic_32_title:0 "Llanura de Iolea"
 me_nuragic_32_desc:0 "Que se limpien los viejos canales de riego. Que los bueyes aren donde las malas hierbas han echado raíces. Dejemos que las aldeas se levanten donde las ruinas se desmoronan. Nuestro pueblo, exiliado durante mucho tiempo a las montañas y colinas, regresará a los campos que alguna vez caminaron sus antepasados. No sólo alimentaremos a los nuestros, sino que comerciaremos una vez más con el mundo, como lo hicimos cuando el nombre Sardan significaba prosperidad tanto como poder.\n\nReconstruir estas tierras de cultivo no es solo restaurar alimentos o riqueza. Es para restaurar la memoria. Dignidad. La llanura de Iolea no es simplemente un premio de guerra: es el hogar de nuestro renacimiento.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] debemos actuar con rapidez. Las estaciones no esperan a nadie. Y la llanura, durante mucho tiempo hambrienta de propósito, debe sentir el peso del arado una vez más, esta vez no para la ganancia de Cartago, sino para la gloria de Cerdeña."
 me_nuragic_01_inv.32.a:0 "Volvemos ahora a lo que un día fue nuestro. Sea alabado Sardo."
 me_nuragic_32_tooltip:0 "$mission_completed_tooltip_1$ '#Y Llanura de Iolean#!' $mission_completed_tooltip_2$"
 
 me_nuragic_320_title:0 "Las ruinas de Nurac Barumenis"
 me_nuragic_320_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] camina solo entre las ruinas de Nurac Barumenis, donde la hierba silvestre se ha arrastrado entre las losas destrozadas y las higueras arañan el cielo a través del corazón de la antigua torre. El tiempo ha desgastado sus muros, pero no su alma. Cada bloque de basalto, desgastado y oscuro, todavía sostiene el peso de quienes lo tallaron: nuestros antepasados, los constructores de torres.\n\nLos lugareños dicen que este Nurac fue la sede de un poderoso linaje, un lugar donde el cielo y la piedra alguna vez comulgaron. Dicen que el pozo todavía da agua y que el sol todavía atraviesa la puerta sagrada en el equinoccio.\n\n¿Qué haremos con este lugar?"
 me_nuragic_01_inv.320.a:0 "Reconstruye este Nurac para devolverle su antigua gloria."
 me_nuragic_01_inv.320.b:0 "No tenemos ningún interés en este lugar abandonado."
 me_nuragic_01_inv.320.c:0 "Recuérdamelo dentro de 10 años."
 me_nuragic_320_tooltip.a:0 "El gigantesco Nurac en [GetProvince('(int32)3482').GetName] será reconstruido."
 me_nuragic_320_tooltip.b:0 "Este lugar, que alguna vez fue un gran Nurac, ha sido abandonado por nuestra gente. No invertir recursos aquí es en parte apreciado por los que alguna vez fueron rivales de esta tierra."
 me_nuragic_320_tooltip.c:0 "El evento se repetirá dentro de 10 años, lo que será útil en caso de que no tengamos suficiente financiación."
 
 me_nuragic_321_title:0 "Se necesitan más recursos para Nurac Barumenis"
 me_nuragic_321_desc:0 "Lo que se pensaba que era una restauración modesta se ha revelado como una tarea de mucha mayor profundidad. Los cimientos de Nurac Barumenis, enterrados por el tiempo y el silencio, son más antiguos y complejos de lo que nuestros albañiles habían creído. Debajo de la superficie, las cámaras interiores se extienden más, los bloques de piedra son más profundos y las antiguas cisternas requieren una reparación completa. Este no es un simple puesto de avanzada. Esta es una fortaleza sagrada, una estructura destinada a perdurar siglos, y reconstruirla tal como estuvo una vez no es tarea sencilla."
 me_nuragic_01_inv.321.a:0 "Da a los albañiles más de lo que necesitan, no escatimes en gastos."
 me_nuragic_01_inv.321.b:0 "Satisfacer las demandas de los trabajadores."
 me_nuragic_01_inv.321.c:0 "Drene algunos recursos, ¡esto está costando demasiado!"
 me_nuragic_01_inv.321.d:0 "Dales algo de dinero y grava a los lugareños por la otra mitad."
 me_nuragic_01_inv.321.e:0 "Podría convencer a los clanes para que contribuyeran a los gastos."
 me_nuragic_321_tooltip.a:0 "Quedarán cubiertos todos los gastos ordinarios y extraordinarios, incluido cualquier gasto inesperado. Las obras se acelerarán enormemente."
 me_nuragic_321_tooltip.b:0 "Cubrir todos los gastos ordinarios, aunque costes inesperados puedan retrasar la construcción. Las obras se aceleran considerablemente."
 me_nuragic_321_tooltip.c:0 "Drenar recursos del proyecto reducirá el costo a expensas de un plazo de finalización del trabajo mucho más largo."
 me_nuragic_321_tooltip.d:0 "Todos los gastos ordinarios están cubiertos, en parte por nosotros y en parte por los ingresos de un nuevo impuesto impuesto a los locales. Las obras se han acelerado parcialmente."
 me_nuragic_321_tooltip.e:0 "Todos los clanes de nuestra nación contribuyen con nosotros a cubrir los gastos ordinarios, la finalización del trabajo se acelera considerablemente."
 
 me_nuragic_322_title:0 "El renacimiento de Nurac Barumenis"
 me_nuragic_322_desc:0 "Que todo Sardan sepa, cerca y lejos, que Nurac Barumenis, durante mucho tiempo centinela de nuestra antigua fuerza, ahora se levanta una vez más del polvo de los siglos.\n\nDonde antes solo había ruinas y leyendas susurradas, la gran fortaleza de Barumenis ahora se extiende nuevamente hacia los cielos. Construido de nuevo a la manera de nuestros antepasados, se levanta sobre una base de 12 metros de ancho, subiendo hasta casi 19 metros de altura, con tres niveles y una amplia terraza en su cima. Su puerta sur se abre como lo hizo una vez, y dentro, las cámaras se arquean en la forma sagrada de los tholos, haciéndose eco del alma arquitectónica del pueblo nurágico.\n\nAlrededor de este bastión central, cuatro torres, reconstruidas piedra por piedra, se mantienen firmes, cada una unida por muros cortina rectos, cada uno coronado con ménsulas salientes que ahora sostienen balcones y plataformas de defensa, listas para proteger nuestra tierra. Las aspilleras, alguna vez bloqueadas por el tiempo, ahora vigilan el reino una vez más.\n\nUna compleja red de pasadizos, escaleras talladas dentro de las paredes, corredores inclinados y puentes, tanto fijos como móviles, unen esta ciudadela en vivo movimiento. Desde los parapetos hasta las torres, desde el corazón de la torre del homenaje hasta el patio semielíptico, cada nivel habla de fuerza y ​​propósito. Ese patio, que alberga un profundo pozo de agua pura de manantial, acoge ahora nuevamente los pies de nuestro pueblo. Desde allí se abren las puertas a las cámaras de las torres este, oeste, sur y norte, así como al santuario en el corazón de la torre del homenaje.\n\nSepa esto: lo que reconstruimos no es simplemente piedra, es memoria. Porque durante la larga noche de los tiempos, cuando la tierra se movió y los muros fallaron, nuestros antepasados ​​cubrieron el bastión con nuevos y poderosos muros, de tres metros de espesor, para protegerlo del colapso. Abrieron una nueva puerta al noreste y la rodearon con siete nuevas torres. Alrededor de estos muros, el pueblo volvió a agitarse y el espíritu de la tierra no se quebró.\n\nEn estos terrenos, ahora sagrados una vez más, hemos descubierto tesoros: reliquias de los micénicos, que una vez conocieron el nombre de Barumenis. Son testigos de nuestros antiguos vínculos con el mundo más allá del mar.\n\nY ahora, al este y al sur de la fortaleza, los hogares de nuestra gente han regresado. Doscientas casas, dentro y más allá del muro exterior, se elevan de la tierra. Recordemos todos la Cabaña del Consejo, con su banco de piedra y sus nichos sagrados, donde los ancianos volverán a hablar y donde hemos encontrado un modelo del nuraghe mismo: una señal del pasado, una promesa para el futuro.\n\nQue este sea el llamado a nuestro pueblo: Nurac Barumenis se levanta de nuevo. El pasado vive en nosotros y caminamos hacia el mañana llevando la fuerza de los siglos."
 me_nuragic_01_inv.322.a:0 "Sea alabado Sardò. ¡Tendremos un festín!"
 me_nuragic_01_inv.322.b:0 "Esto nos costó demasiado..."
 me_nuragic_322_tooltip.a:0 "¡Toda la nación se regocija por la finalización de Nurac Barumenis!"
 me_nuragic_322_tooltip.b:0 "Toda la nación se alegra, menos nuestros bolsillos..."
 
 me_nuragic_33_title:0 "Las venas de plata"
 me_nuragic_33_desc:0 "Sardo nos ha devuelto esta tierra, pero no es suficiente para reclamarla. Debemos restaurar. Reconstruir. Invertir. La plata todavía duerme. El hierro todavía espera. La pista todavía brilla en la oscuridad. Que las minas se conviertan en pilares de nuestra fuerza, esta vez no para los señores extranjeros, sino para el pueblo de Cerdeña.\n\nQue se despejen los caminos hacia las minas. Que se llame a los herreros. Dejemos que los hornos vuelvan a subir en [GetProvince('(int32)3485').GetName]. Estos no son meros recursos: son la columna vertebral de nuestro futuro. Con hierro forjamos armas y muros. Con la plata acuñamos moneda y legado. Con el plomo, comerciamos y fortalecemos los vínculos más allá de nuestras costas.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] debemos ver lo que nuestros antepasados ​​vieron una vez: que la riqueza debajo de las colinas no debe ser atesorada, sino aprovechada. Las minas no son sólo el pasado de Cerdeña: son la promesa de Cerdeña."
 me_nuragic_01_inv.33.a:0 "Las venas profundas del sur pertenecen a los sardanos y volverán a latir."
 me_nuragic_33_tooltip:0 "$mission_completed_tooltip_1$ '#Y Las vetas de plata#!' $mission_completed_tooltip_2$"
 
 me_nuragic_34_title:0 "[GetProvince('(int32)3493').GetName] Reclamado"
 me_nuragic_34_desc:0 "Hace mucho tiempo, cuando el mar era joven y las torres nuevas, [GetProvince('(int32)3493').GetName] se alzaba como una joya en la costa occidental. Ella era nuestra puerta de entrada al oeste: sus puertos profundos, sus fuertes murallas, sus calles llenas de la lengua de comerciantes, sacerdotes y guerreros. De sus canteras salió la piedra. De sus herrerías salió el bronce. Y de sus salas del consejo surgió la sabiduría que dio forma a la voluntad de Cerdeña.\n\nElla no era sólo una ciudad. Ella era el espejo de quiénes éramos.\n\nY luego llegó la larga noche.\n\nLos cartagineses, hambrientos de nuestras costas, descendieron como langostas. Tomaron [GetProvince('(int32)3493').GetName] con traición y acero. Profanaron sus templos, reemplazaron sus estandartes con sellos extranjeros y convirtieron su puerto sagrado en un barco para su dominio. Durante generaciones, observamos desde las colinas y recordamos. Dijimos su nombre en susurros y juramos que volvería a ser nuestra.\n\nY ahora lo es.\n\nLos estandartes de Cartago han sido arrancados de sus torres. Las guarniciones extranjeras se dispersaron. Pero su reconquista no es el final: es el comienzo. Los templos deben ser limpiados. Los muros reconstruidos. Se restauraron sus puertos, se reabrieron sus mercados. [GetProvince('(int32)3493').GetName] debe alzarse no simplemente como una reliquia, sino como un símbolo de lo que fue y de lo que volverá a ser. Cerdeña no está completa sin ella."
 me_nuragic_01_inv.34.a:0 "Que Nuraghe resurja. Que el mar sepa una vez más el nombre de [GetProvince('(int32)3493').GetName]."
 me_nuragic_34_tooltip:0 "$mission_completed_tooltip_1$ '#Y [GetProvince('(int32)3493').GetName] Reclamado#!' $mission_completed_tooltip_2$"
 
 me_nuragic_340_title:0 "La élite cartaginesa de [GetProvince('(int32)3493').GetName]"
 me_nuragic_340_desc:0 "La élite cartaginesa de [GetProvince('(int32)3493').GetName], hijos de Tiro y herederos de la lengua púnica, pasea detrás de sus columnatas de piedra, veladas de lino y sospecha. Sus barcos ya no abarrotan el puerto. Sus guardias ya no están en las puertas. Los estandartes de Sardan ahora ondean donde una vez los sellos de Tanit ondearon orgullosos contra la brisa del mar.\n\nAlgunos de ellos todavía se aferran al orgullo: \"Trajimos monedas, trajimos la ley, trajimos a los dioses del fuego y el mar\". Pero saben, en el fondo, que ya no son el viento, sólo el polvo que levanta.\n\nOtros han comenzado a susurrar con más cuidado en la antigua lengua de las torres, han comenzado a indagar sobre las costumbres nurágicas, han comenzado a hablar de lealtad, de servicio, de adaptación.\n\n¿Qué lugar ocupan estos comerciantes púnicos en una ciudad una vez más gobernada por la sangre de los Constructores de Torres? ¿Se les pedirá a sus hijos que sirvan? ¿O los obligarán a observar cómo la ciudad se levanta sin ellos?"
 me_nuragic_01_inv.340.a:0 "Acéptalos como propios."
 me_nuragic_01_inv.340.b:0 "Esclavízalos y toma sus pertenencias."
 me_nuragic_01_inv.340.c:0 "Mátalos a todos."
 me_nuragic_01_inv.340.d:0 "Pueden atender sus costumbres, por ahora, si pagan lo suficiente."
 me_nuragic_01_inv.340.e:0 "Sé cómo arreglar esto."
 me_nuragic_340_tooltip.a:0 "Todos los cartagineses de [GetProvince('(int32)3493').GetName] abrazarán la religión nurágica y se asimilarán a nuestra cultura."
 me_nuragic_340_tooltip.b:0 "Todos los cartagineses de [GetProvince('(int32)3493').GetName] se convertirán en esclavos, los que no obedezcan serán asesinados."
 me_nuragic_340_tooltip.c:0 "Nuestros hombres entrarán casa por casa en busca de todos los cartagineses que habitan la zona, no pueden esconderse, ninguno puede escapar."
 me_nuragic_340_tooltip.d:0 "Los cartagineses se ven obligados a pagar una copiosa cantidad de oro para mantener sus costumbres, aunque esto no impide que posteriormente las asimilemos."
 me_nuragic_340_tooltip.e:0 "Todos los cartagineses de [GetProvince('(int32)3493').GetName] abrazarán la religión nurágica y se asimilarán a nuestra cultura. Para nuestro agradecimiento, las familias importantes de la ciudad nos regalarán una copiosa cantidad de oro."
 
 me_nuragic_35_title:0 "Invierta en [GetProvince('(int32)3486').GetName]"
 me_nuragic_35_desc:0 "Debemos invertir, no simplemente para restaurar, sino para transformar.\n\nQue se profundice su puerto y se refuercen sus muelles con piedra. Que se levanten los almacenes y se llame a los constructores de barcos. Que la ciudad crezca más allá de sus viejas murallas, alimentada por nuevos caminos desde el interior y custodiada por torres que miran al mar. El comercio debe fluir como agua por sus calles: no solo pescado y sal, sino también bronce, aceite, lino y letras. \n\n[GetProvince('(int32)3486').GetName] puede que nunca rivalice con el antiguo esplendor de [GetProvince('(int32)3484').GetName] o el legado sagrado de [GetProvince('(int32)3493').GetName], pero tiene un destino propio. Ella es la puerta de entrada, una puerta abierta de par en par al sol naciente y a los vientos mercantes más allá.\n\nIgnorarla ahora sería cerrar esa puerta para siempre."
 me_nuragic_01_inv.35.a:0 "El este llama. [GetProvince('(int32)3486').GetName] debe responder."
 me_nuragic_35_tooltip:0 "$mission_completed_tooltip_1$ '#Y Invierta en [GetProvince('(int32)3486').GetName]#!' $mission_completed_tooltip_2$"
 
 me_nuragic_350_title:0 "Los bienes de [GetProvince('(int32)3486').GetName]"
 me_nuragic_350_desc:0 "[GetProvince('(int32)3486').GetName], que alguna vez fue un modesto puesto de avanzada costero, ahora está preparado para convertirse en un vínculo vital en el comercio oriental de Cerdeña. Pero una ciudad es más que piedra y velas: debe producir, y lo que ofrece al mundo definirá cómo la ve el mundo.\n\n¿Será [GetProvince('(int32)3486').GetName] una ciudad de cristal?\n\nLa arena de las costas del sur es fina y clara. El sol arde y el viento del mar es constante, ideal para el antiguo oficio de soplado de vidrio. Elegir vidrio es elegir refinamiento, belleza y lujo. Los frascos, cuentas y vasijas de [GetProvince('(int32)3486').GetName] podrían alcanzar precios elevados en Etruria, Sicilia y más allá. Que se encienda el fuego en los hornos y que Sarcapos deslumbre al mundo.\n\nSerá [GetProvince('(int32)3486').GetName] una ciudad de telas\n\nLos rebaños de Iliensia engordan en las verdes llanuras, y los hiladores y tintoreros de Karali ya susurran sobre nuevos telares. Elegir tela es elegir fuerza a través del comercio. Las túnicas, el lino y las velas, tejidas en Sarcapos y enviadas hacia el este, podían vestir tanto a nobles como a marineros. Que surjan los talleres y que [GetProvince('(int32)3486').GetName] vista al mundo.\n\nO [GetProvince('(int32)3486').GetName] será una ciudad de miel\n\nLas colinas del interior zumban con abejas, sus colmenas anidan entre mirtos y tomillos silvestres. Elegir la miel es elegir el oro de la naturaleza. Buscada por curanderos y sacerdotes, comerciantes y reyes, la miel de [GetProvince('(int32)3486').GetName] podía endulzar las lenguas de las cortes extranjeras y forrar las tinajas de los templos. Dejemos que los guardianes construyan sus colmenas y dejemos que [GetProvince('(int32)3486').GetName] nutra el mundo.\n\nCada camino es prometedor. Cada uno habla de una cara diferente del espíritu sardiano: arte, industria y armonía.\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] debes elegir sabiamente. Porque una vez hecha la elección, resonará en los mercados, templos y barcos del mar oriental.\n\n¿Por qué será conocido [GetProvince('(int32)3486').GetName]?"
 me_nuragic_01_inv.350.a:0 "[GetProvince('(int32)3486').GetName] producirá telas."
 me_nuragic_01_inv.350.b:0 "¡El vidrio es la respuesta!"
 me_nuragic_01_inv.350.c:0 "La miel será la elección."
 me_nuragic_350_tooltip:0 "$mission_completed_tooltip_1$ '#Y Invierta en [GetProvince('(int32)3486').GetName]#!' $mission_completed_tooltip_2$"
 
 me_nuragic_36_title:0 "Consolidar Iliensia"
 me_nuragic_36_desc:0 "Iliensia ya no es una tierra fracturada: es la base de la nación sarda. Desde los fértiles campos de la llanura de Iolean hasta los bulliciosos mercados de [GetProvince('(int32)3484').GetName], desde las costas recuperadas de [GetProvince('(int32)3493').GetName] hasta los puertos revitalizados de [GetProvince('(int32)3486').GetName], somos un solo pueblo, más fuertes y más prósperos que nunca.\n\nPero esto es sólo el comienzo. Hemos restaurado la tierra, pero ahora debemos fortificarla. Debemos construir muros, formar ejércitos y continuar el trabajo que comenzaron nuestros antepasados. Porque el futuro de Cerdeña no lo determinarán aquellos que la conquistan desde lejos, sino los sardanos que la gobiernan como propia."
 me_nuragic_01_inv.36.a:0 "Un pueblo, una tierra. Que esto sea testimonio de la grandeza por venir."
 me_nuragic_36_tooltip:0 "$mission_completed_tooltip_1$ '#Y Consolidar Iliensia#!' $mission_completed_tooltip_2$"
 
 me_nuragic_1000_title:0 "Elija el color del país"
 me_nuragic_1000_desc:0 "Tras formar Cerdeña, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ha sido convocado para elegir el color del país. Puede optar por conservar un color único de Cerdeña o elegir los colores anteriores de las etiquetas Nuragic."
 me_nuragic_01_inv.1000.a:0 "Prefiero el color de decisión formable."
 me_nuragic_01_inv.1000.b:0 "Prefiero el azul coracensiano"
 me_nuragic_01_inv.1000.c:0 "Prefiero el verde kelsitaniano"
 me_nuragic_01_inv.1000.d:0 "Prefiero el negro rubrensiano"
 me_nuragic_01_inv.1000.e:0 "Prefiero el amarillo lugudonense"
 me_nuragic_1000_tooltip:0 "¡¡El país cambiará de color en el mapa!!"
 
 


 nuragic_sacrifice:0 "Sacrificios Nurágicos"
 desc_nuragic_sacrifice:0 "Al ofrecer almas inocentes a los dioses de la guerra, ellos nos bendecirán en batalla."
 nuragic_scouts:0 "Exploradores Nurágicos"
 desc_nuragic_scouts:0 "Nuestros hombres están bien familiarizados con el terreno, una ventaja en tiempos de guerra. Nuestros exploradores están vigilando los campamentos de nuestros enemigos y nos aconsejarán cuándo es el momento de atacar."
 nuraghe_network:0 "Red Nurágica"
 desc_nuraghe_network:0 "Los nuraghe, el sistema de fortificaciones erigidas por nuestros sabios ancestros, siguen siendo una fuente de fortaleza para nuestro pueblo."
 nuragic_power:0 "Poder Nurágico"
 desc_nuragic_power:0 "El mundo entero se maravilla con la historia de las valientes tribus Nurágicas que vencieron a sus enemigos extranjeros contra todo pronóstico."
 nuragic_fortifications:0 "Fortificaciones Nurágicas"
 desc_nuragic_fortifications:0 "Considerando que venimos de un terreno montañoso, somos expertos en construir fortificaciones que recuerdan a nuestras defensas naturales."
 shorn_sheep:0 "Recaudadores de Impuestos Celosos"
 desc_shorn_sheep:0 "Aunque no tienen derecho, los cartagineses roban los ingresos fiscales que nos corresponden, ¡una afrenta!"
 nuragic_archers:0 "Arqueros Nurágicos"
 desc_nuragic_archers:0 "Nuestros tribus son mortales con el arco, una habilidad que hemos perfeccionado en el campo de batalla."
 nuragic_farm:0 "Agricultores Nurágicos"
 desc_nuragic_farm:0 "Nuestros agricultores son maestros en su oficio, no desperdiciando nada y utilizando cada pedazo de tierra disponible para ellos."
 taphros_strait:0 "Estrecho de Taphros"
 desc_taphros_strait:0 "El estrecho entre Cerdeña y Córcega ofrece una ruta comercial más rápida entre Iberia, Gallia y la península italiana."
 sardinian_grain:0 "Grano de Cerdeña"
 desc_sardinian_grain:0 "Debido a la particular composición del suelo, el clima templado y el uso conjunto de variedades peculiares de trigo con extensas redes de riego, las llanuras de Cerdeña se caracterizan por un mayor rendimiento de la tierra."
 sardinian_silver:0 "Argyrófleps Nesos"
 desc_sardinian_silver:0 "Las minas del extremo suroeste de la isla son famosas desde la antigüedad por el tamaño de sus yacimientos, ricos en metales raros. Estas asombrosas cantidades de riqueza natural han otorgado a Cerdeña el nombre de Argyróphleps Nésos (Isla de las Vetas de Plata)."
 sardinian_lead:0 "Minas de Cerdeña"
 desc_sardinian_lead:0 "Las montañas de Cerdeña están repletas de enormes cantidades de metales. Los sardana han explotado esas vetas desde los albores de su civilización, convirtiéndose en hábiles metalúrgicos y comerciantes. Los lingotes sardos de cobre, plata y plomo han llegado a todos los lados del Mediterráneo, hasta las costas de Judea en el este y las costas de Iberia en el oeste y más allá, llegando incluso a las costas de Goutia en el mar del Norte."
 giants_of_tarshish:0 "Gigantes de Tarsis"
 desc_giants_of_tarshish:0 "Una necrópolis monumental construida en la antigüedad por los sardanos, posteriormente destruida por los invasores cartagineses y ahora reconstruida con su antiguo esplendor. Rodeado por Nuraghes y tótems que recuerdan los símbolos sagrados, el centro del complejo termina en un camino de estatuas que representan guerreros, arqueros y boxeadores, todos de tamaño mayor que el natural, con una altura de entre 2,5 y 2,7 ​​metros (aproximadamente de 8 a 9 pies). Las estatuas están hechas de arenisca local y están elaboradas con habilidad, mostrando una notable atención al detalle. Exhiben características artísticas únicas, como armaduras complejas, cascos y expresiones faciales intrincadas. Un lugar de encuentro para todos los pueblos nurágicos que aspiran a encontrarse con sus antiguos héroes."
 new_capital_sardinia:0 "La ciudad de las torres"
 desc_new_capital_sardinia:0 "La capital de la Sardana se alza majestuosa con sus maravillas arquitectónicas inspiradas en las icónicas torres nuraghe, que salpican el paisaje urbano. Estas imponentes estructuras de piedra rinden homenaje al ingenio del pueblo nurágico y al mismo tiempo sirven como faros de sabiduría e identidad cultural."
 kares_port:0 "Puerto entre el acantilado"
 desc_kares_port:0 "Un puerto protegido con instalaciones artificiales construidas para cargar y descargar buques."
 nuragic_pompia:0 "Pompia Ventures"
 desc_nuragic_pompia:0 "Entre las colinas del pueblo se ha plantado un gran campo de árboles de Pompìa. Esta fruta, autóctona de Cerdeña, es en gran parte desconocida."
 great_pompia_farms:0 "Granjas de Pompìa"
 desc_great_pompia_farms:0 "Grandes campos de árboles de Pompìa envuelven las colinas de la ciudad, cuidadosamente plantados para maximizar la producción. Se han conectado directamente canales de riego a los manantiales y cisternas subterráneas recogen el agua de lluvia para que las tierras de cultivo satisfagan siempre la demanda de agua."
 nurac_barumenis_construction:0 "Reconstrucción de Nurac Barumenis"
 desc_nurac_barumenis_construction:0 "Los habitantes de [GetProvince('(int32)3482').GetName] están invirtiendo mucho tiempo y recursos en la reconstrucción del antiguo Nurac Barumenis."
 nurac_barumenis:0 "Nurac Barumenis"
 desc_nurac_barumenis:0 "Una vez en ruinas, este Nurac polilobulado vuelve a ser magnífico. El complejo consta de cuatro torres unidas por un muro cortina con un balcón superior construido alrededor de una torre central (20 metros de altura), todas comunicadas con un patio interior servido por un profundo pozo de agua dulce. El complejo está rodeado por un muro cortina con siete torres, rodeado por un asentamiento de alrededor de 200 casas de usos múltiples."
 balearic_slingers:0 "Honderos Baleares"
 desc_balearic_slingers:0 "Entre nuestras filas se ha integrado un cuerpo especializado de Honderos Baleares."
 
# Nuragic Decisions localization
 rebuild_the_giants_of_tarshish:0 "Reconstruir a los gigantes de Tarsis"
 rebuild_the_giants_of_tarshish_desc:0 "Es nuestro deber restituir la antigua necrópolis monumental de Tarsis, una vez destruida por los cartagineses en su intento de someter a nuestro pueblo."

# Nuragic Traits
 nur_horned_warrior:0 "Guerrero con cuernos"
 nur_horned_warrior_desc:0 "[CHARACTER.GetName] obtuvo los Cuernos, un símbolo de poder y fuerza entre los guerreros."

# Items
 mycenean_holy_axe:0 "Hacha sagrada micénica"
 desc_mycenean_holy_axe:0 "Un Labrys micénico, el antiguo hacha de dos puntas. Forjado en la antigüedad y enterrado bajo las piedras derrumbadas de la torre sur, en Nurac Barumenis, no muestra ningún óxido, sólo reverencia. Sus bordes, aunque embotados por los siglos, todavía susurran guerras y rituales. Esta no es una mera arma: es un símbolo de gobierno, de fuerza divina y del vínculo sagrado entre el guerrero y Sardò."
