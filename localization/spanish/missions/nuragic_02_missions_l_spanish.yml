l_spanish:

 nuragic_mission_02_inv:0 "Retorno de los Pueblos del Mar"
 nuragic_mission_02_inv_DESCRIPTION:0 "En las bibliotecas y tesoros de los grandes Reyes, se pueden encontrar inscripciones extrañas escritas en estelas y tabletas de arcilla: baratijas y curiosidades tomadas en conquista y pronto olvidadas. Encontrar a un sabio o un escriba que descifre estos escritos difíciles sería una tarea enorme en estos días, ya que hay pocos que recuerdan las lenguas antiguas, y aún menos que puedan entender su silabario arcaico. Así, a medida que el paso de los años erosiona la capacidad del hombre para recordar su propio pasado, muchas cosas maravillosas se olvidan.\n\nSí, y muchas advertencias también."
 nuragic_mission_02_inv_CRITERIA_DESCRIPTION:0 "Esta misión se completará cuando nosotros, como nuestros míticos antepasados los Pueblos del Mar, hayamos establecido una talasocracia en el Mediterráneo, apoderándonos de las principales islas para nosotros."
 nuragic_mission_02_inv_BUTTON_TOOLTIP:0 "Los Imperios de la tierra tiemblan ante la vista de nuestras velas en el horizonte..."
 nuragic_mission_02_inv_BUTTON_DETAILS: ""

 #Missions

 nuragic_mission_02_inv_task_1:0 "Expandiendo el Distrito Portuario"
 nuragic_mission_02_inv_task_1_DESC:0 "Si queremos ser conocidos como una potencia naval, la infraestructura en nuestras ciudades, especialmente en nuestros puertos principales, necesita ser completamente renovada... en comparación con nuestros vecinos, estamos en un estado ridículo. Al invertir en nuestra capital, crearemos oportunidades para que nuestra gente empiece nuevas vidas aquí.\n\n\n\n\n\n\n\n\n\n@persia_mil17!"

 nuragic_mission_02_inv_task_2:0 "Evaluando Nuestra Navegabilidad"
 nuragic_mission_02_inv_task_2_DESC:0 "Debemos hacer un inventario de nuestra preparación militar actual, para ver en qué estado nos han dejado las guerras anteriores. Hay mucho por hacer; considerando cuánto hemos llegado a depender de nuestra armada, necesitamos asegurarnos de que esté en perfecto estado.\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"

 nuragic_mission_02_inv_task_3:0 "[GetProvince('(int32)94').GetName]"
 nuragic_mission_02_inv_task_3_DESC:0 "Ahora que hemos decidido apoderarnos de todas las principales islas del Mediterráneo, la isla de Sicilia es nuestro primer objetivo importante, y el pragmatismo dicta que debemos desembarcar nuestras fuerzas en [GetProvince('(int32)94').GetName]. Debemos atacar de manera repentina, sin advertencia; el elemento sorpresa será nuestro único aliado.\n\n\n\n\n\n\n\n\n\n@greek_mil4!"

 nuragic_mission_02_inv_task_4:0 "Explorando las Costas"
 nuragic_mission_02_inv_task_4_DESC:0 "Ahora que las amenazas inmediatas han sido tratadas, finalmente tenemos un momento para recuperar el aliento y considerar otras cosas además de cuestiones de vida o muerte. Quizás podríamos enviar una expedición exploratoria a las aguas que no conocemos. Aunque habrá costos asociados con el manejo de la flota, será beneficioso para nuestros cartógrafos conocer el terreno alrededor de nosotros.\n\n\n\n\n\n\n\n\n\n@greek_mil19!"

 nuragic_mission_02_inv_task_5:0 "Remando en las Playas"
 nuragic_mission_02_inv_task_5_DESC:0 "El hecho de que nuestros constructores de barcos estén ocupados construyendo nuestras flotas no significa que no podamos entrenar a nuestros marineros; pondremos a los hombres en las playas y los haremos practicar el remo.\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"

 nuragic_mission_02_inv_task_6:0 "Medidas de Bronce"
 nuragic_mission_02_inv_task_6_DESC:0 "Para manejar el volumen de negocios que anticipamos, debemos expandir enormemente nuestro distrito comercial. Y, sabiendo lo litigiosos que pueden ser los comerciantes extranjeros, también podría ser prudente construir algunos edificios legales más.\n\nMientras esperamos un período de caos durante la construcción, sin duda aprenderemos cosas nuevas de la experiencia.\n\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"

 nuragic_mission_02_inv_task_7:0 "El Océano Nunca Está Satisfecho"
 nuragic_mission_02_inv_task_7_DESC:0 "Los costos de mantener una poderosa flota naval están en constante aumento, con cada nuevo día pareciendo traer otra deuda que necesita ser saldada. A pesar de nuestros bolsillos abiertos, el Océano nunca está satisfecho con lo que se le da y siempre tiene hambre de más; necesitamos más marineros, más trabajadores para nuestros puertos... oh sí, y necesitaremos asegurarnos de tener suficiente tela para las velas.\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 nuragic_mission_02_inv_task_8:0 "Emperatriz de los Mares"
 nuragic_mission_02_inv_task_8_DESC:0 "Aunque hay muchas naciones marítimas navegando por las aguas, ninguna puede compararse con nosotros en habilidad y hazañas de valentía. Los hombres no exageran cuando se refieren a nuestra nación, y particularmente a nuestra capital, como la 'Emperatriz de los Mares', pues nos elevamos por encima de nuestros pares con una elegancia y un estilo que no tiene comparación.\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"

 nuragic_mission_02_inv_task_9:0 "Mercados de Esclavos"
 nuragic_mission_02_inv_task_9_DESC:0 "Si nuestra reputación ha sido ganada de manera justa o no, no es decisión de nuestra gente; lo que es cierto, sin embargo, es que todos nos creen como saqueadores y esclavistas. Nuestros barcos de esclavos se mueven rápidamente por las aguas, siguiendo los ríos tierra adentro hasta llegar a las aldeas, y luego lo que sucede a continuación queda entre nosotros y los dioses.\n\n\n\n\n\n\n\n\n\n@celt_mil15!"

 nuragic_mission_02_inv_task_10:0 "Hundiendo la Flota Italiana"
 nuragic_mission_02_inv_task_10_DESC:0 "Aunque hemos chocado muchas veces con los cartagineses hasta este punto, sigue habiendo otra molestia que se interpone en el camino de nuestros sueños de expansión. Es cierto que los italianos son luchadores feroces, incomparables en tierra, pero debemos destruir su poder en el mar antes de poder proceder de manera segura hacia costas distantes.\n\n\n\n\n\n\n\n\n\n@greek_mil11!"

 nuragic_mission_02_inv_task_11:0 "Las colinas de Sicania"
 nuragic_mission_02_inv_task_11_DESC:0 "Ahora que tenemos nuestra cabeza de playa en la isla de Siracusa, será cosa trivial fabricar reclamos sobre algunas de las provincias del interior... todo lo que necesitamos es tiempo, del cual tenemos de sobra. \n\n\n\n\n\n\n\n\n\n@greek_mil7!"

 nuragic_mission_02_inv_task_12:0 "[GetProvince('(int32)84').GetName] es la clave"
 nuragic_mission_02_inv_task_12_DESC:0 "Estamos en total acuerdo con nuestros asesores militares; si somos capaces de tomar el control de [GetProvince('(int32)84').GetName], el resto de la provincia seguramente sucumbirá rápidamente a nuestros avances. \n\n\n\n\n\n\n\n\n\n@greek_mil1!"

 nuragic_mission_02_inv_task_13:0 "Las últimas migajas"
 nuragic_mission_02_inv_task_13_DESC:0 "Aunque algunos puedan decir que es una locura ir a la guerra por una isla tan pequeña, no podemos permitir que nadie más controle [GetProvince('(int32)1470').GetName]; su ubicación estratégica es simplemente demasiado valiosa. Además, desde este punto de vista, podremos asaltar Cartago con impunidad. \n\n\n\n\n\n\n\n\n\n@greek_mil18!"

 nuragic_mission_02_inv_task_14:0 "Los pilares de Hércules"
 nuragic_mission_02_inv_task_14_DESC:0 "Nuestros exploradores han regresado del Oeste con fascinantes relatos de pueblos extraños y, lo que es más importante, información invaluable sobre las tierras que habitan. Basándonos en estos informes, creemos que nuestra futura seguridad depende de nuestra capacidad para controlar la puerta al Océano, los Pilares de Hércules. \n\n\n\n\n\n\n\n\n\n@greek_mil8!"

 nuragic_mission_02_inv_task_15:0 "Tan lejos como [GetProvince('(int32)2108').GetName]"
 nuragic_mission_02_inv_task_15_DESC:0 "Nuestros marineros se vuelven cada vez más audaces en lo que respecta a la navegación de larga distancia, explorando los reinos envueltos en niebla al borde del mundo y haciendo buenos amigos en esos lugares lejanos. Desde nuestras ciudades cerca de los Pilares de Hércules, nuestras flotas exploran el vasto Océano desconocido...\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

 nuragic_mission_02_inv_task_16:0 "La conexión de Socotra"
 nuragic_mission_02_inv_task_16_DESC:0 "¡Una historia increíble! Hace años, enviamos marineros con la misión de explorar tierras lejanas y regresar con lo que encontraron. Aunque consideramos que este asunto estaba resuelto, los barcos que llegaron al puerto esta mañana piensan lo contrario... \n\n\n\n\n\n\n\n\n\n@egypt_mil18!"

 nuragic_mission_02_inv_task_17:0 "La isla al borde del mundo"
 nuragic_mission_02_inv_task_17_DESC:0 "Nuestros amigos en [GetProvince('(int32)7530').GetName] nos han hablado de una nación insular distante, frente a la costa de la India, que da la bienvenida a los comerciantes extranjeros. Aunque no estamos familiarizados con este exótico lugar, nuestros conocedores asesores griegos nos dicen que esta tierra es conocida como '#T Taprobane#!' y sugieren que enviemos una embajada para establecer relaciones amistosas. \n\n\n\n\n\n\n\n\n\n@india_mil7!"

 nuragic_mission_02_inv_task_18:0 "Reuniendo las Cícladas"
 nuragic_mission_02_inv_task_18_DESC:0 "Parece que una considerable banda de luchadores, soldados enemigos y refugiados de [GetProvince('(int32)84').GetArea.GetName] y [GetProvince('(int32)351').GetArea.GetName] ha huido a [GetProvince('(int32)263').GetArea.GetName], con la esperanza de reagrupar sus fuerzas en estas pequeñas islas antes de intentar retomar sus tierras de nosotros. Debemos poner fin a estas ilusiones antes de que más personas se unan a sus filas. \n\n\n\n\n\n\n\n\n\n@greek_mil14!"

 nuragic_mission_02_inv_task_19:0 "Subyugando a los Shekelesh"
 nuragic_mission_02_inv_task_19_DESC:0 "Sicilia es una isla grande y montañosa, llena de una población que resiente la creciente lista de ocupantes extranjeros que codician sus abundantes tesoros para sí mismos. Aunque requerirá una cantidad notable de mano de obra y un esfuerzo de varios años para despejar los numerosos escondites de bandidos y reductos rebeldes en el interior, creemos que podemos llevarla completamente bajo nuestro control.\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 nuragic_mission_02_inv_task_20:0 "Cruzando el Mare Ionium"
 nuragic_mission_02_inv_task_20_DESC:0 "Habiendo dado pasos gigantescos para asegurar nuestras posesiones en el Oeste, fijamos con hambre nuestras miras en las ricas tierras del Este, con la isla de Creta siendo una excelente plataforma de lanzamiento desde la cual podemos asaltar todo el Mediterráneo Oriental. \n\n\n\n\n\n\n\n\n\n@greek_mil9!"

 nuragic_mission_02_inv_task_21:0 "Caphtor, Tierra de los Peleset"
 nuragic_mission_02_inv_task_21_DESC:0 "A estas alturas, hemos establecido un ritmo para nuestras operaciones; después de encontrar una ubicación favorable para que desembarquen nuestros barcos y ejércitos, nos deshacemos rápidamente de las fuerzas nativas antes de eliminar cualquier foco de resistencia. Los arqueros de Creta, a pesar de su reputación, no deberían causar mucho problema a nuestros hombres.\n\n\n\n\n\n\n\n\n\n@greek_mil6!"

 nuragic_mission_02_inv_task_22:0 "La isla de las rosas"
 nuragic_mission_02_inv_task_22_DESC:0 "La reputación de Rodas ciertamente la precede en cualquier lugar donde navegan los barcos; de hecho, las historias de su opulenta riqueza, noble ciudadanía y marineros endurecidos por la batalla son un motivo de orgullo para los ciudadanos de esa hermosa isla, quienes argumentan convincentemente que su ciudad es la más civilizada y elegante de todo el mundo. \n\nSí, sí, todo eso está bien, pero ¿pueden detenernos para que no tomemos todo para nosotros? \n\n\n\n\n\n\n\n\n\n@egypt_mil22!"

 nuragic_mission_02_inv_task_23:0 "Isla de los Denyen"
 nuragic_mission_02_inv_task_23_DESC:0 "Finalmente, nuestras flotas han navegado por todo el Mediterráneo, llegando a una isla que los lugareños conocen como [GetProvince('(int32)330').GetArea.GetName]. ¡Cuánto deseamos poseer esta isla! Tendríamos una excelente base para asaltar las regiones de [GetProvince('(int32)1883').GetArea.GetName] y [GetProvince('(int32)516').GetArea.GetName]. ¡Nuestras flotas zarpan al amanecer en busca de este magnífico premio! \n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 nuragic_mission_02_inv_task_24:0 "Esos griegos sabios"
 nuragic_mission_02_inv_task_24_DESC:0 "Hay mucho que nuestro pueblo puede aprender de los griegos, que sobresalen en las artes de la retórica y la oratoria y son conocidos como amantes de la sabiduría. Deberíamos alentar a sus sabios a establecerse entre nuestros propios ciudadanos para que podamos estudiar sus maneras eruditas. Una empresa costosa, sin duda, pero ¿acaso se puede poner precio al conocimiento? \n\n\n\n\n\n\n\n\n\n@greek_mil10!"

 nuragic_mission_02_inv_task_25:0 "El ombligo del mundo"
 nuragic_mission_02_inv_task_25_DESC:0 "Nadie puede negar que hemos causado un gran revuelo en el mundo griego. Debido a que los poderes de Hélade han expresado interés en comprender mejor a nuestro pueblo, se nos ha extendido una invitación para visitar el Oráculo de Delfos, la Pitia, como gesto de buena voluntad. Se dice que la Vidente tiene el don de la profecía y puede revelar el futuro... sin duda valdría la pena considerarlo. \n\n\n\n\n\n\n\n\n\n@greek_mil16!"

 nuragic_mission_02_inv_task_26:0 "Frontera corsiana"
 nuragic_mission_02_inv_task_26_DESC:0 "Córcega necesita ser completamente colonizada, y llenar la isla con buenos ciudadanos [ROOT.GetCountry.GetAdjective] hará maravillas para civilizar esta región. \n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 
 nuragic_mission_02_inv_task_27:0 "El puerto de Alouka"
 nuragic_mission_02_inv_task_27_DESC:0 "El territorio de [GetProvince('(int32)3511').GetName] ha sido bendecido con un puerto natural, y aunque esto fue satisfactorio para sus antiguos habitantes, tenemos una gran visión para esta región: nada menos que la completa transformación y revitalización del área. \n\n\n\n\n\n\n\n\n\n@italic_mil1!"
 
 nuragic_mission_02_inv_task_28:0 "La patria corsiana"
 nuragic_mission_02_inv_task_28_DESC:0 "¡Alabado sea Sardo! Hemos colonizado por completo #Y Córcega#!, tomándola para la mayor gloria de [ROOT.GetCountry.GetName]! \n\n\n\n\n\n\n\n\n\n@italic_mil8!"
 
 nuragic_mission_02_inv_task_29:0 "El puerto de [GetProvince('(int32)1464').GetName]"
 nuragic_mission_02_inv_task_29_DESC:0 "Debemos construir las instalaciones portuarias en la estratégica isla de [GetProvince('(int32)1464').GetName]. Si deseamos proyectar nuestro poder en Iberia y más allá, entonces debemos poder equipar adecuadamente nuestros barcos en el Mediterráneo occidental. \n\n\n\n\n\n\n\n\n\n@italic_mil4!"
 
 nuragic_mission_02_inv_task_30:0 "El retorno de los Balarios"
 nuragic_mission_02_inv_task_30_DESC:0 "En tiempos antiguos, nuestros antepasados ​​se referían a la isla de 'Mago' con un nombre diferente: #Y Nura Balara#!. Dejemos que la gloria y el honor lleguen a nuestros antepasados ​​restaurando el nombre de esta isla encantada, anunciando al mundo que este será un refugio para los pueblos [ROOT.GetCountry.GetAdjective]. \n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 
 nuragic_mission_02_inv_task_31:0 "Consolidar Gimnasia"
 nuragic_mission_02_inv_task_31_DESC:0 "Sería un golpe diplomático para [ROOT.GetCountry.GetRuler.GetName] si lográramos reunir las islas dispersas de #E Gimnasia#! bajo nuestra bandera [ROOT.GetCountry.GetAdjective] - no cabe duda de que la popularidad de nuestro [ROOT.GetCountry.GetRulerTitle] se dispararía. \n\n\n\n\n\n\n\n\n\n@italic_mil19!"

 nuragic_mission_02_inv_task_32:0 "Ojos en Iberia"
 nuragic_mission_02_inv_task_32_DESC:0 "Hay muchos puertos en la costa oriental de #E Iberia#! que serían adiciones encantadoras para nuestra creciente talasocracia. En lugar de simplemente saquear estas ciudades para esclavos, quizás ha llegado el momento de enviar una fuerza invasora. \n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 
 nuragic_mission_02_inv_task_33:0 "Conquistar Cessetania"
 nuragic_mission_02_inv_task_33_DESC:0 "Nuestros asesores militares han sugerido que tomemos la provincia de #Y Cessetania#! primero, ya que nuestros espías han infiltrado la región durante mucho tiempo y han sentado las bases para lo que está por venir. \n\n\n\n\n\n\n\n\n\n@italic_mil29!"
 
 nuragic_mission_02_inv_task_34:0 "Asentar Kese"
 nuragic_mission_02_inv_task_34_DESC:0 "La hermosa [GetProvince('(int32)1009').GetName] sería un lugar perfecto para construir una #Y Colonia Nurágica#!; está junto al mar, lo cual es importante para nuestros compatriotas, y se alimenta de agua dulce del río cercano. Reúne a nuestros trabajadores y prepáralos para las importantes tareas que tienen por delante. \n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 
 nuragic_mission_02_inv_task_35:0 "Someter a los Griegos Ibéricos"
 nuragic_mission_02_inv_task_35_DESC:0 "Unos pocos territorios dispersos en el Mediterráneo Occidental se han convertido en el hogar de muchos colonos griegos, cada uno con diferentes grados de éxito, pero se ha decidido que este pequeño experimento de colonización ha terminado.\n\nSi nos tomamos el tiempo para hacer las inversiones adecuadas en los lugares que conquistaremos, podemos aprovechar el verdadero potencial de estas ciudades aisladas: los sopladores de vidrio de [GetProvince('(int32)1000').GetName] serían perfectos para esta iniciativa.\n\n\n\n\n\n\n\n\n\n@italic_mil23!"
 
 nuragic_mission_02_inv_task_36:0 "Consolidar el Acceso a Iberia"
 nuragic_mission_02_inv_task_36_DESC:0 "Aunque el mar es la forma más rápida de viajar entre nuestras muchas posesiones, se ha sugerido que construyamos una carretera que conecte nuestras numerosas ciudades portuarias a lo largo de la costa de Iberia, una tarea que estamos felices de emprender. Esto hará maravillas para las redes comerciales en crecimiento en la región. \n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 
 nuragic_mission_02_inv_task_37:0 "Ojos en Etruria"
 nuragic_mission_02_inv_task_37_DESC:0 "Las ricas tierras de los #E Etruscos#! nos llaman, pero debemos tener en cuenta que muchos desean las ondulantes tierras de cultivo y las colinas suavemente inclinadas de esta región para sí mismos. Habrá mucha sangre derramada si desembarcamos una fuerza en sus costas. \n\n\n\n\n\n\n\n\n\n@italic_mil30!"
 
 nuragic_mission_02_inv_task_38:0 "Asentar Etruria"
 nuragic_mission_02_inv_task_38_DESC:0 "Aunque los etruscos nativos son muy similares culturalmente a nuestro propio pueblo [ROOT.GetCountry.GetAdjective], tenemos razones para creer que si establecemos colonias en el continente, eventualmente abrazarán nuestras formas superiores. \n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 
 nuragic_mission_02_inv_task_39:0 "El Puerto de los Metales"
 nuragic_mission_02_inv_task_39_DESC:0 "Nuestros ingenieros están sorprendidos por la cantidad de metales básicos que se encuentran en la provincia de [GetProvince('(int32)126').GetName], y nos recuerdan la rica riqueza mineral que tenemos en nuestras islas natales. Debemos hacer todo lo posible para desarrollar esta región y extraer su mineral.\n\nSegún fuentes romanas de esta época, esta ciudad fue fundada con la ayuda de los 'pueblos de las islas'.\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 
 nuragic_mission_02_inv_task_40:0 "El Hierro de Ilva"
 nuragic_mission_02_inv_task_40_DESC:0 "El hierro que se encuentra en las minas de [GetProvince('(int32)127').GetName], a medio camino entre nuestra tierra natal y el continente de Italia, haría maravillas para nuestra destreza económica y militar. Debemos tomar todo lo que podamos de esta isla. \n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 
 nuragic_mission_02_inv_task_41:0 "Hacia el Lacio"
 nuragic_mission_02_inv_task_41_DESC:0 "No debemos tener miedo de la reputación de nadie; los romanos son conocidos por ser feroces guerreros, pero codiciamos sus tierras de todos modos, y ahora que sus flotas han sido destruidas, podemos desembarcar en sus costas cuando queramos.\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 
 nuragic_mission_02_inv_task_42:0 "Someter a los Conquistadores"
 nuragic_mission_02_inv_task_42_DESC:0 "¡Cómo han caído los poderosos! Nuestras fuerzas [ROOT.GetCountry.GetAdjective] deambulan por el corazón de [GetProvince('(int32)1').GetName], deleitándose con las vistas y los sonidos de la antigua ciudad romana. Capital.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"

 nuragic_mission_02_inv_task_43:0 "Aplastar a los Lepónticos"
 nuragic_mission_02_inv_task_43_DESC:0 "No podemos permitir que los lepónticos crean que están a salvo detrás de sus montañas. ¿Realmente piensan que pueden lanzar incursiones en nuestros nuevos territorios sin despertar nuestra ira? Los aplastaremos, ofreciendo una lección a quienes se interpongan en nuestro camino. \n\n\n\n\n\n\n\n\n\n@italic_mil22!"

 nuragic_mission_02_inv_task_44:0 "Avanzar en la Megale Hellas"
 nuragic_mission_02_inv_task_44_DESC:0 "Los griegos que viven en el sur de Italia están destinados a sufrir el mismo destino que sus colonos en Iberia: destrucción completa y subyugación. ¡Que los dioses de la guerra nos acompañen en la batalla! \n\n\n\n\n\n\n\n\n\n@italic_mil25!"
 
 nuragic_mission_02_inv_task_45:0 "Hacia Iliria"
 nuragic_mission_02_inv_task_45_DESC:0 "Hemos determinado que las salvajes costas ilirias son el hogar de muchos piratas que esconden sus flotas saqueadoras a lo largo de la escarpada costa. No podemos permitir que una potencia naval rival crezca en fuerza, así que debemos avanzar hacia Iliria. \n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 
 nuragic_mission_02_inv_task_46:0 "Las Puertas de Histria"
 nuragic_mission_02_inv_task_46_DESC:0 "Nuestros arquitectos han notado que la región de #E Histria#! necesita desesperadamente infraestructura. Si construimos algunas ciudades y una fortaleza en [GetProvince('(int32)4018').GetName], nuestros ciudadanos se sentirán lo suficientemente seguros como para aventurarse a este lejano istmo. \n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 
 nuragic_mission_02_inv_task_47:0 "Asegurar el Acceso a Dalmacia"
 nuragic_mission_02_inv_task_47_DESC:0 "Al tomar para nosotros los mejores territorios costeros de los ilirios, aseguraremos fácilmente el acceso a Dalmacia. \n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 
 nuragic_mission_02_inv_task_48:0 "Marineros Liburnios"
 nuragic_mission_02_inv_task_48_DESC:0 "Nuestros ingenieros admiten a regañadientes que los constructores navales de #E Libernia#! han diseñado mejoras en el barco que lleva su nombre, el liburnio. Aunque nuestro pueblo es orgulloso, reconocemos la innovación cuando la vemos, y no podemos permitir que nuestros enemigos tengan barcos más rápidos que los nuestros. \n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 
 nuragic_mission_02_inv_task_49:0 "Alcanzar Epiro"
 nuragic_mission_02_inv_task_49_DESC:0 "Poco a poco, nuestro dominio se extiende por la faz de la Tierra, y tenemos en la mira a los #E Epirotas#!. Debemos preparar nuestras reclamaciones contra ellos para las guerras venideras. \n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 
 nuragic_mission_02_inv_task_50:0 "Hacia Qart Hadasht"
 nuragic_mission_02_inv_task_50_DESC:0 "Habiendo demostrado que hemos superado a las armadas de #E Cartago#! en alta mar, es hora de infligir la humillación final y tomar sus territorios centrales en #E África#!. \n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 
 nuragic_mission_02_inv_task_51:0 "Vencer a Nuestro Antiguo Enemigo"
 nuragic_mission_02_inv_task_51_DESC:0 "Se ha dicho que 'la venganza es un plato que se sirve mejor frío', y después de cuatrocientos años de combates intermitentes, hemos sorprendido al mundo al tomar la capital de los cartagineses, [GetProvince('(int32)3256').GetName]. ¡Habrá grandes celebraciones en nuestra capital de [ROOT.GetCountry.GetCapital.GetName] y en los numerosos nuragues de Cerdeña este día!\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 
 nuragic_mission_02_inv_task_52:0 "Controlar el Acceso a Numidia"
 nuragic_mission_02_inv_task_52_DESC:0 "Al tomar las valiosas tierras costeras de #E Numidia#!, impediremos que lleguen fuerzas de socorro, permitiendo que nuestras tropas trabajen en el continente sin temor a ser atacadas.\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 
 nuragic_mission_02_inv_task_53:0 "Ojos en Cirene"
 nuragic_mission_02_inv_task_53_DESC:0 "Las tierras donde la milagrosa planta #Y Silphium#! @silphium! crece en abundancia podrían ser nuestras si tomamos las medidas necesarias; solo debemos preparar nuestras reclamaciones y alistar nuestras tropas para las intensas batallas que se avecinan.\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 
 nuragic_mission_02_inv_task_54:0 "Expandir Gortina"
 nuragic_mission_02_inv_task_54_DESC:0 "Después de haber subyugado a los cretenses lo mejor que pudimos, se ha decidido que expandamos la ciudad de [GetProvince('(int32)361').GetName] y la convirtamos en una verdadera colonia [ROOT.GetCountry.GetAdjective].\n\n\n\n\n\n\n\n\n\n@italic_mil24!"
 
 nuragic_mission_02_inv_task_55:0 "Hemos Regresado"
 nuragic_mission_02_inv_task_55_DESC:0 "Hace mucho tiempo, los ejércitos del #E Levante#! lograron repeler las invasiones de los #T Pueblos del Mar#!, nuestros ilustres antepasados, con cierto éxito. Sin embargo, se han consultado los presagios, y los dioses no los protegerán una segunda vez.\n\n¡Hemos regresado para terminar el trabajo que una vez comenzó; hemos demostrado que somos los verdaderos herederos de #Y Phorcos#!, el más poderoso gobernante de nuestro pueblo.\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 
 nuragic_mission_02_inv_task_56:0 "Destruirlos Desde la Raíz"
 nuragic_mission_02_inv_task_56_DESC:0 "Nuestros recuerdos son largos, y no tenemos por costumbre perdonar a nuestros enemigos mortales: solo pregunten a los restos dispersos de #E Cartago#! qué tan bien les ha funcionado enfrentarse a nuestras fuerzas. Imaginen la alegría en nuestros rostros cuando nuestros barcos de guerra se dirigen a las antiguas tierras de los cartagineses. No basta con destruir sus colonias, ¡los destruiremos desde la raíz!\n\n\n\n\n\n\n\n\n\n@italic_mil11!"
 
 nuragic_mission_02_inv_task_57:0 "Puesto Avanzado en Filistea"
 nuragic_mission_02_inv_task_57_DESC:0 "Ahora que es seguro para nuestro pueblo vivir aquí, deberíamos construir una colonia [ROOT.GetCountry.GetAdjective] en Filistea con ese mismo propósito.\n\n\n\n\n\n\n\n\n\n@italic_mil23!"
 
 nuragic_mission_02_inv_task_58:0 "Esta es Nuestra Tierra Santa Ahora"
 nuragic_mission_02_inv_task_58_DESC:0 "Hay muchos pueblos que afirman estar bendecidos por los dioses, pero ¿dónde estaban estas divinidades en su hora de necesidad? Hemos destruido los ejércitos reunidos que intentaban mantenernos a raya, pero la dura realidad es que lo han perdido todo, y esta es nuestra tierra santa ahora, y queremos todos los tesoros dentro de los Templos.\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 
 nuragic_mission_02_inv_task_59:0 "Donde Nuestros Antepasados Fallaron"
 nuragic_mission_02_inv_task_59_DESC:0 "Los antiguos #E Egipcios#! amaban jactarse de cómo rechazaron a los #T Pueblos del Mar#!, tallando estelas por todo su país que proclamaban su victoria. ¡Ha llegado el momento de vengar este error del pasado! ¡Los destruiremos por completo de una vez por todas!\n\n\n\n\n\n\n\n\n\n@egypt_mil12!"
 
 nuragic_mission_02_inv_task_60:0 "Tu Desierto Ya No Existe"
 nuragic_mission_02_inv_task_60_DESC:0 "Es un día oscuro para los #E Egipcios#! y los invasores #E Macedonios#!, que han visto su arduo trabajo reducido a cenizas que saben amargas en sus bocas. Pero tenemos un premio mayor en mente que la destrucción de nuestros enemigos; el establecimiento de una nueva Dinastía.\n\n\n\n\n\n\n\n\n\n@egypt_mil14!"
 
 nuragic_mission_02_inv_task_61:0 "Dinastía Sardana"
 nuragic_mission_02_inv_task_61_DESC:0 "¿Quién es como [ROOT.GetCountry.GetRuler.GetName], que ha llevado a nuestro pueblo desde el borde de la destrucción y los ha colocado en los tronos más altos? ¡Que la recién establecida #T Dinastía Sardana#! gobierne el mundo hasta el fin de los días!\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 
 nuragic_mission_02_inv_task_62:0 "Hellas Será Nuestra"
 nuragic_mission_02_inv_task_62_DESC:0 "No permitiremos que los griegos desunidos nos mantengan fuera de Hellas, sino que aprovecharemos sus divisiones para tomarlo todo para nosotros.\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 
 nuragic_mission_02_inv_task_63:0 "Punto de Apoyo en Laconia"
 nuragic_mission_02_inv_task_63_DESC:0 "Se ha decidido que estableceremos una colonia en los territorios de los espartanos, con la esperanza de que algo de su legendario ethos marcial se contagie a nuestros propios hombres.\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 
 nuragic_mission_02_inv_task_64:0 "Hacia Macedonia y Tracia"
 nuragic_mission_02_inv_task_64_DESC:0 "Sigamos avanzando con nuestro impulso y empujemos hacia el norte, hacia las tierras de #E Macedonia#! y #E Tracia#!. ¡No podemos permitir que nuestros enemigos recuperen el aliento, sino que debemos mantener la presión sobre ellos!\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 
 nuragic_mission_02_inv_task_65:0 "Las Costas de Asia"
 nuragic_mission_02_inv_task_65_DESC:0 "Ha habido muchos poderosos imperios que han luchado por controlar las costas de #E Asia#!, y somos los últimos en intentarlo... la diferencia entre nosotros y los demás es que no fallaremos.\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
 
 nuragic_mission_02_inv_task_66:0 "Las Puertas del Mar Negro"
 nuragic_mission_02_inv_task_66_DESC:0 "La región que controla la entrada al #E Pontus Euxinus#! es muy deseada por nuestro pueblo, que siempre aprecia tener acceso fácil a los océanos. Si tomamos esta región para nosotros y la llenamos con nuestros colonos, en unas pocas generaciones, todos los que vivan aquí hablarán un dialecto [ROOT.GetCountry.GetAdjective].\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"

 nuragic_mission_02_inv_task_67:0 "Calcídica Pelásgica"
 nuragic_mission_02_inv_task_67_DESC:0 "Algo que el mundo siempre podría necesitar más son más colonos [ROOT.GetCountry.GetAdjective], y la hermosa península de #E Calcídica#! pronto se convertirá en las últimas tierras que servirán como una colonia Nurágica.\n\n\n\n\n\n\n\n\n\n@italic_mil15!"
 
 nuragic_mission_02_inv_task_68:0 "Hacia Táurica"
 nuragic_mission_02_inv_task_68_DESC:0 "Un noble sardo y su hijo, ambos leales ciudadanos de [ROOT.GetCountry.GetName], están reuniendo fondos para levantar una legión en [GetProvince('(int32)1453').GetName] con el único propósito de lanzar una invasión sobre las ciudades de la región de #Y Táurica#!.\n\n#T Dos personajes altamente cualificados se unirán a nuestra corte.#!\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 
 nuragic_mission_02_inv_task_69:0 "Rey de los ibéricos"
 nuragic_mission_02_inv_task_69_DESC:0 "La #E Península Ibérica#! ha sido durante mucho tiempo codiciada por muchas potencias, siendo los odiados cartagineses los últimos en intentar someter estos salvajes territorios tribales.\n\nSin embargo, hemos tenido éxito donde muchos otros han fracasado, y por derecho de conquista, [ROOT.GetCountry.GetRuler.GetName] puede proclamar que somos los nuevos #Y Reyes de Iberia#!.\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 
 nuragic_mission_02_inv_task_70:0 "Consolidar Numidia"
 nuragic_mission_02_inv_task_70_DESC:0 "Aunque somos maestros del océano, estamos muy intrigados por las posibilidades de convertirnos en mejores jinetes. Al consolidar la región de Numidia, también podríamos obtener conocimientos invaluables de estos renombrados jinetes.\n\n\n\n\n\n\n\n\n\n@india_mil18!"
 
 nuragic_mission_02_inv_task_71:0 "La espada y la corona"
 nuragic_mission_02_inv_task_71_DESC:0 "Al unir las tierras de origen de nuestro pueblo, que una vez estuvieron divididas - una tarea tan imposible que se profetizó que solo un verdadero [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] podría hacerlo - ha surgido un Anciano Tribal de las tierras interiores con artefactos sagrados para entregar a [ROOT.GetCountry.GetRuler.GetName]; la legendaria #Y Corona#! y la #Y Espada#! de #Y Phorcos#!, el primer gobernante del pueblo sardo.\n\n\n\n\n\n\n\n\n\n@celt_mil1!"

 nuragic_mission_02_inv_task_72:0 "Mar de Sardana"
 nuragic_mission_02_inv_task_72_DESC:0 "Ahora que hemos destruido la capacidad de nuestros rivales marítimos para desafiar nuestra supremacía naval, ha llegado el momento de declarar el amanecer de una nueva era, en la que seremos los indiscutibles amos del #T Mar de Sardana#!.\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 
 nuragic_mission_02_inv_task_73:0 "Un monumento a nuestra grandeza"
 nuragic_mission_02_inv_task_73_DESC:0 "Habiendo conquistado a muchos de los enemigos reunidos contra nosotros, [ROOT.GetCountry.GetRuler.GetName] ha decidido dirigir [ROOT.GetCountry.GetRuler.GetHerHis] la atención hacia adentro, habiendo decidido que ha llegado el momento de construir un monumento gigante que honrará los logros eternos de nuestra nación. \n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 
 nuragic_mission_02_inv_task_74:0 "Asalto a Massalia"
 nuragic_mission_02_inv_task_74_DESC:0 "Desde nuestra nueva ciudad en [GetProvince('(int32)3511').GetName], prepararemos una fuerza poderosa que zarpará hacia el norte con un objetivo en mente: ¡un asalto a [GetProvince('(int32)2325').GetName]! ¡Nunca nos verán venir!\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"
 
 nuragic_mission_02_inv_task_75:0 "La puerta está abierta"
 nuragic_mission_02_inv_task_75_DESC:0 "Ahora que [GetProvince('(int32)2325').GetName] está firmemente en nuestras manos, ¿qué nos impide expandirnos aún más hacia #E Galia#!? Absolutamente nada: la puerta ha quedado abierta y ya no hay nadie vigilando la entrada...\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 nuragic_mission_02_inv_task_76:0 "Un plato que se sirve frío"
 nuragic_mission_02_inv_task_76_DESC:0 "¿Qué se debe hacer con [GetProvince('(int32)3256').GetName]? ¿Podemos permitir que sus crímenes contra nuestros antepasados queden impunes, o les concederemos un respiro que nunca nos ofrecieron a nosotros? Quedan muchas decisiones por tomar...\n\n#Y Se activará un evento que permitirá a [ROOT.GetCountry.GetRuler.GetName] decidir el destino final de Qart Hadasht#!.\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 
 #Modifiers

 bustling_port:0 "Puerto Bullicioso"
 desc_bustling_port:0 "Gracias a nuestras inversiones juiciosas, nuestra principal ciudad portuaria está experimentando un auge que continuará durante los próximos años."
 slave_markets:0 "Mercados de Esclavos"
 desc_slave_markets:0 "No tenemos reparos en vender a los cautivos que tomamos en nuestras numerosas incursiones, y los negocios son prósperos en nuestros muchos mercados de esclavos."
 intrepid_explorers:0 "Exploradores Intrépidos"
 desc_intrepid_explorers:0 "Es bien sabido que nuestros marineros son intrépidos y valientes, navegando audazmente hacia donde ningún hombre ha ido antes."
 indian_trade:0 "Comercio con la India"
 desc_indian_trade:0 "Nuestros marineros, habiendo navegado hasta el borde del mundo y de vuelta, han establecido valiosas conexiones comerciales en la tierra de la India."
 greek_tutors:0 "Tutores Griegos"
 desc_greek_tutors:0 "Hemos decidido que los sabios griegos serían los mejores instructores para nuestros jóvenes, y tenemos muchos esclavos educados en nuestros hogares."
 carthage_raiders:0 "Incursiones Cartaginesas"
 desc_carthage_raiders:0 "Debido a que somos enemigos eternos de los odiados cartagineses, permitimos que nuestra marina asalte y saque sus costas con impunidad."
 roman_raiders:0 "Incursiones Romanas"
 desc_roman_raiders:0 "Como hemos combatido a los poderosos romanos en las aguas, asaltamos sus costas y puertos a nuestro antojo; no tenemos nada que temer de ellos."
 pacified_sicily:0 "Sicilia Pacificada"
 desc_pacified_sicily:0 "Aunque fue un esfuerzo difícil, logramos limpiar Sicilia de bandidos y rebeldes, trayendo paz a la problemática isla por primera vez en la memoria reciente."
 experienced_seahands:0 "Marineros Experimentados"
 desc_experienced_seahands:0 "Debido a que hemos instituido un sistema de entrenamiento riguroso para nuestros marineros, tienen mucha más experiencia que el marinero promedio."
 eastern_scourge:0 "Azote del Este"
 desc_eastern_scourge:0 "Nuestros barcos asaltan los puertos y costas de Egipto, Siria y Anatolia a su antojo, sin poder ser detenidos por los poderes locales."
 empress_seas:0 "Emperatriz de los Mares"
 desc_empress_seas:0 "Nuestra ciudad capital, gracias a la rápida expansión de nuestra infraestructura, ha ganado el apodo de 'Emperatriz de los Mares'; un testimonio de nuestra creciente influencia."
 bold_raider:0 "Asaltantes Audaces"
 desc_bold_raider:0 "Nos encanta atacar a nuestros enemigos sin previo aviso, y nuestra inclinación por el ataque repentino es temida en todo el mundo."
 nuragic_colony:0 "Colonia Nurágica"
 desc_nuragic_colony:0 "Establecida por leales servidores de nuestro pueblo, este lugar prospera con nuestra cultura y tradiciones."
 mines_of_ilva:0 "Minas de Ilva"
 desc_mines_of_ilva:0 "Una compleja red de minas cubre toda la isla; el hierro extraído allí se procesa luego en el cercano puerto de Pupluna, listo para la exportación."
 liburnian_sailors:0 "Marineros Liburnianos"
 desc_liburnian_sailors:0 "Habiendo dominado el mar Adriático durante siglos, la experiencia marítima liburniana servirá a nuestros propósitos."
 ancestors_avenged:0 "Ancestros Vengados"
 desc_ancestors_avenged:0 "Nuestro pueblo finalmente ha logrado vengar a nuestros antepasados: el sucio opresor púnico ya no existe."
 we_will_succeed:0 "Tendremos Éxito"
 desc_we_will_succeed:0 "Nuestros guerreros han sido afectados por un fervor religioso, listos para triunfar donde sus antepasados fallaron hace mucho tiempo."
 access_black_sea:0 "Propóntide Nurágica"
 desc_access_black_sea:0 "Tener el control de los puntos estratégicos en la entrada del Mar Negro nos ha dado considerables beneficios."
 iberian_king:0 "Reyes de Iberia"
 desc_iberian_king:0 "La mayoría de las tierras ibéricas ancestrales han caído en nuestras firmes manos, y los propios ibéricos ahora nos aceptan ampliamente como sus únicos gobernantes."
 numidian_auxilia:0 "Auxiliares Númidas"
 desc_numidian_auxilia:0 "La caballería númida, altamente capacitada, ahora es parte integral de nuestros ejércitos."
 tower_islands:0 "Islas de los Constructores de Torres"
 desc_tower_islands:0 "Nuestro pueblo finalmente ha logrado reunificar nuestros antiguos territorios; las cadenas de nuestros opresores se han roto y el vigor de nuestros ancestros se ha desatado."
 sardana_sea:0 "Mar de Sardana"
 desc_sardana_sea:0 "Al igual que nuestros antepasados en su apogeo, ahora controlamos la mitad occidental del 'Gran Verde', conocido nuevamente como el Mar de Sardana: El Mar de Cerdeña, Nuestro Mar."
 great_nuraghe:0 "Gran Nurac"
 desc_great_nuraghe:0 "Anidado en el paisaje capitalino, el Nuraghe Polilobulado se erige con orgullo: una maravilla antigua compuesta por veinte torres intrincadamente conectadas. Su torre central alcanza una altura imponente de treinta metros, un testimonio de la destreza en ingeniería y la importancia cultural de la civilización nurágica. La mampostería susurra historias de un pasado enigmático, invitando a los visitantes a sumergirse en los misterios de la historia de su pueblo."
 corsian_wood:0 "Bosques de Córcega"
 desc_corsian_wood:0 "Los vastos bosques vírgenes de Córcega son una fuente primordial de nuestros materiales para la construcción naval."
 into_ashes:0 "Convertido en Cenizas"
 desc_into_ashes:0 "Este antiguo asentamiento ha sido reducido a cenizas, minuciosamente desmantelado piedra por piedra. Toda el área es una vista desagradable de suelo improductivo, ruinas indistinguibles y huesos de cuerpos sin enterrar y sin nombre."
 iron_weapons_sardana:0 "El Hierro de Ilva"
 desc_iron_weapons_sardana:0 "Hemos utilizado el hierro encontrado en las minas de Ilva para equipar a nuestros reclutas con armas fuertes."
 nuragic_wineries:0 "Bodegas Nurágicas"
 desc_nuragic_wineries:0 "Los viticultores etruscos en estas provincias han construido talleres especializados - con la ayuda de los comerciantes nurágicos - que se centran en la elaboración de vinos de lujo."
 alouka_invasion_port_mod:0 "Puerto Militar"
 desc_alouka_invasion_port_mod:0 "Esta provincia tiene un puerto militar fortificado, dedicado a la construcción de barcos destinados a incursiones en tierras extranjeras."
 nuragic_laconian_farm:0 "Granjas Laconianas"
 desc_nuragic_laconian_farm:0 "Los invasores nurágicos han construido la infraestructura agrícola en esta región, con la esperanza de extraer la mayor cantidad de grano de los suelos de Helas."
 nuragic_gymnaesia_consolidation_mod:0 "Administración Nurágica"
 desc_nuragic_gymnaesia_consolidation_mod:0 "En el corazón de esta encantadora ciudad se encuentra la Sede de la Burocracia Nurágica, comprometida a garantizar una administración eficiente y con una dedicación inquebrantable a fomentar una comunidad armoniosa y próspera en la región."
 #"The city of Guium is the home of the Nuragic bureaucracy entrusted with managing the Balearides, and has rapidly become one of the most important destinations in the Western Mediterranean." OLD
 nuragic_emporie_glass_workshops:0 "Talleres de Vidrio de Emporie"
 desc_nuragic_emporie_glass_workshops:0 "Impulsados por las inversiones de los comerciantes nurágicos, los maestros vidrieros locales han construido talleres impresionantemente grandes en Emporie."
 forever_doomed:0 "Condenados para Siempre"
 desc_forever_doomed:0 "La gente local de esta región cree que esta tierra está maldita y que alguna vez fue la residencia de un gran diablo cuyo nombre ha sido borrado de la historia."
 nuragic_mining_pupluna:0 "Fundición de Metales de Pupluna"
 desc_nuragic_mining_pupluna:0 "Debido a las vastas cantidades de hierro importadas a Pupluna desde la cercana isla de Ilva, los comerciantes nurágicos han invertido en la fundición aquí para procesar el mineral."

 #Items
 dragon_blood_sceptre:0 "Cetro de Sangre de Dragón"
 dragon_blood_sceptre_desc:0 "Un bastón de marfil finamente labrado, con una gema roja del tamaño de un huevo de ganso en el pomo, enviado como regalo desde el lejano reino de Socotra."
 sword_of_forco:0 "Espada de Phorcos"
 sword_of_forco_desc:0 "Phorcos, un legendario Rey de Cerdeña y Córcega, blandió esta antigua espada nurágica, canalizando su poder místico para proteger a su pueblo de la oscuridad."

 #Names
 ISLAND_KINGDOM_NAME:0 "Confederación del Mar"
 ISLAND_KINGDOM_ADJECTIVE:0 "Confederado"
 TYRSENIA_EMPIRE_NAME:0 "tirsenia"
 TYRSENIA_EMPIRE_ADJECTIVE:0 "tirsenio"
 SARDAN_EMPIRE_NAME:0 "Imperio Sardán"
 SARDAN_EMPIRE_ADJECTIVE:0 "sarda"
 SARDAN_CONFEDERACY_NAME:0 "Confederación Sarda"
 SARDAN_CONFEDERACY_ADJECTIVE:0 "confederado"
 TYRSENIA_FLAG:0 "Estandarte Glorioso de Tirsenia"
 SARDOMAVIA_FEUDATORY_NAME:0 "Sardomavía"
 SARDOMAVIA_FEUDATORY_ADJECTIVE:0 "sardomaviano"

 #Events
 me_nuragic_02_inv_1_title:0 "$nuragic_mission_02_inv_task_1$"
 me_nuragic_02_inv_1_desc:0 "Después de muchos meses de construcción, durante los cuales parecía que nos excederíamos de nuestro presupuesto en numerosas ocasiones, recibimos hoy la noticia de que el trabajo finalmente se ha completado en [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]. Hay muchas ventajas en tener una ciudad costera como capital; nuestros barcos pueden descargar sus cargas directamente en nuestros puertos, y nuestros soldados pueden zarpar hacia tierras extranjeras en un momento dado.\n\nAunque el precio que pagamos fue considerable, parece que la visión de [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] fue acertada, ya que no tenemos duda de que [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] está destinada a la gloria eterna."
 me_nuragic_02_inv_1.a:0 "Por fin, tenemos una capital adecuada, digna de nuestra gente"
 me_nuragic_02_inv_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_1$#!' $mission_completed_tooltip_2$"
 expanded_port_tt:0 "Necesitamos la #Y Dotaciones Religiosas#! Inversión en la provincia de nuestra capital."

 me_nuragic_02_inv_2_title:0 "$nuragic_mission_02_inv_task_2$"
 me_nuragic_02_inv_2_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] ha pasado toda la mañana en los puertos de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName], acompañado por un pequeño ejército de ayudantes, asesores principales y nuestros principales generales. El negocio que realizan nuestros élites es de naturaleza sensible; nuestras fuerzas navales están siendo examinadas de arriba a abajo para asegurar que estamos en un estado de completa preparación militar. [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] está inusualmente callado, [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] mente está ocupada con la tarea en cuestión.\n\nA medida que el sol comienza a hundirse debajo del horizonte, haciendo que las aguas en el puerto de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] brillen en tonos de rosa y naranja, el trabajo se ve obligado a detenerse, para alivio de los agotados oficiales. Mientras el grupo cansado regresa a la ciudad, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] finalmente ofrece una evaluación."
 me_nuragic_02_inv_2.a:0 "Estamos en una forma decente, pero queda trabajo por hacer"
 me_nuragic_02_inv_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_2$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_3_title:0 "$nuragic_mission_02_inv_task_3$"
 me_nuragic_02_inv_3_desc:0 "Después de semanas de preparativos furtivos, nuestros diplomáticos han reunido reclamaciones adecuadas sobre [GetProvince('(int32)94').GetName]; hemos producido documentos que afirman que esta región fue arrendada a nuestros bisabuelos en perpetuidad. Con esta justificación firmemente en mano, no estamos librando una guerra de conquista extranjera, sino que estamos reclamando lo que legítimamente nos pertenece."
 me_nuragic_02_inv_3.a:0 "¡No daremos cuartel a nuestros enemigos!"
 me_nuragic_02_inv_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_3$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_4_title:0 "$nuragic_mission_02_inv_task_4$"
 me_nuragic_02_inv_4_desc:0 "Durante los últimos años, hemos estado atrapados en una lucha a vida o muerte para establecernos en el Mediterráneo Occidental; una tarea que, según todos los informes, nunca debimos haber logrado, y sin embargo, aquí estamos. Ahora que un raro período de paz ha llegado a nuestras tierras, hemos decidido enviar nuestras flotas en una misión diplomática en lugar de militar, pidiéndoles que zarpen hacia el horizonte y vayan más allá de lo que cualquiera de nuestras flotas ha hecho antes.\n\nReuniendo a mil marineros, cargamos sus barcos con provisiones, incluyendo alimentos y regalos para cualquier pueblo que puedan encontrar, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] bajó personalmente al puerto en [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] para ver partir los barcos, ofreciendo una oración por su éxito al partir. La mayoría de nuestros hombres navegarán hacia el Oeste, aunque también hemos decidido enviar un par de barcos hacia el Este."
 me_nuragic_02_inv_4.a:0 "Buen viaje a nuestros valientes marineros...nuestros sueños navegan con ustedes"
 me_nuragic_02_inv_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_4$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_5_title:0 "$nuragic_mission_02_inv_task_5$"
 me_nuragic_02_inv_5_desc:0 "Habiendo emitido la orden de que nuestras flotas aumenten de tamaño, el astillero en [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] está lleno de ingenieros, obreros y sus asistentes trabajando desde el primer resplandor de la mañana hasta bien entrada la noche. Mientras nuestros trabajadores están ocupados construyendo los barcos que llevarán a nuestros ejércitos a la victoria, nuestros futuros marineros no han estado inactivos mientras esperan a que sus embarcaciones se completen; por el contrario, nuestros hombres han estado entrenando en las playas. Cuando no están practicando maniobras de combate, nuestros hombres están montando bancos en las orillas y practicando el remo, aprendiendo a trabajar juntos como uno solo.\n\nCuando los barcos estén terminados de construir, nuestros marineros estarán más que listos."
 me_nuragic_02_inv_5.a:0 "Esperamos que este entrenamiento sea suficiente"
 me_nuragic_02_inv_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_5$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_6_title:0 "$nuragic_mission_02_inv_task_6$"
 me_nuragic_02_inv_6_desc:0 "Una de las idiosincrasias personales de [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] es [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] inclinación por escaparse del palacio y vagar por los mercados de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] disfrazado. La razón de este comportamiento curioso es que [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] le gusta mezclarse con la gente común, escuchar sus charlas y tratar de tener una idea del estado de ánimo en las calles.\n\nA medida que el sol comienza su ascenso sobre un cielo cristalino, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] se detuvo en una panadería, ofreciendo unas pocas monedas de cobre por un pan recién horneado. En la parte trasera, cerca de los hornos, un equipo de esclavos trabaja rápidamente, cortando masa y formando panes en pequeñas molduras de bronce. Durante los últimos meses, todas las herramientas de medición en la capital han sido actualizadas. Es la esperanza de [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] que la introducción de un estándar universal beneficiará a nuestros comerciantes, y hasta ahora, parece que [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] tiene razón."
 me_nuragic_02_inv_6.a:0 "Tener pesos estandarizados beneficiará a nuestra economía - ya lo verán"
 me_nuragic_02_inv_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_6$#!' $mission_completed_tooltip_2$"
 bronze_measure_tt:0 "Necesitamos la #Y Promoción de Gasto en Infraestructura#! Inversión en la provincia de nuestra capital."

 me_nuragic_02_inv_7_title:0 "$nuragic_mission_02_inv_task_7$"
 me_nuragic_02_inv_7_desc:0 "Aunque hemos perdido innumerables almas en el mar, cuyos cuerpos son un regalo acuático para los dioses de la muerte, hemos aprendido una dura lección; no importa cuántos de oro y cuántas vidas se derramen en las fauces abiertas del Océano, nunca está satisfecho, nunca se sacia. Es desalentador construir una nueva flota, equipar los aparejos y enviar a nuestros hijos a las aguas, solo para descubrir que una flota enemiga los sorprendió antes de destruirlos a todos. Aun así, a pesar de los contratiempos que vendrán, nos levantaremos a la ocasión cada vez, recordando los sacrificios hechos mientras completamos el trabajo que hemos elegido hacer."
 me_nuragic_02_inv_7.a:0 "Honramos a cada persona que murió por nuestro país"
 ocean_satisfied_tt:0 "Necesitamos la invención #Y Rostra Reforzadas#!"
 me_nuragic_02_inv_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_7$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_8_title:0 "$nuragic_mission_02_inv_task_8$"
 me_nuragic_02_inv_8_desc:0 "Las historias sobre la espléndida ciudad de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] están cautivando los oídos de hombres alrededor del mundo, y algunos incluso le han dado el título de #E 'Emperatriz de los Mares'#! Aunque es cierto que existen muchas otras ciudades insulares interesantes, algunas con historias impresionantes que rivalizan con la nuestra, hay una aura de autoridad y inevitabilidad que emana de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]; cualquiera que visite nuestra cuidadosamente planificada capital [ROOT.GetCountry.GetAdjective] ve las glorias que hemos alcanzado y pronto se da cuenta de nuestro potencial.\n\nAunque este honorífico de 'Emperatriz de los Mares' pueda ser un poco exagerado por ahora, reconocemos que es una promesa de lo que está por venir."
 me_nuragic_02_inv_8.a:0 "Afortunado es el hombre que ha visitado [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]"
 me_nuragic_02_inv_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_8$#!' $mission_completed_tooltip_2$"
 empress_seas_tt:0 "Nuestra ciudad capital necesita #Y Fortificaciones Provinciales#!"

 me_nuragic_02_inv_9_title:0 "$nuragic_mission_02_inv_task_9$"
 me_nuragic_02_inv_9_desc:0 "Aunque muchos consideran que someter a los débiles es una tarea poco atractiva, nuestra gente se ha hecho un nombre como algunos de los mejores esclavistas del mundo, refinando el acto de esclavitud en un arte elevado. Nuestros barcos llevan a nuestras partidas de saqueo a la costa, donde nuestros hombres desembarcan en barcazas fluviales antes de seguir los ríos aguas arriba. Para cuando se pueda levantar una alarma, a menudo es demasiado tarde para las almas desdichadas en sus aldeas indefensas, que pronto se encuentran encadenadas en la bodega de un trirreme. El negocio en los mercados de esclavos de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] nunca ha sido mejor y se proyecta que solo crecerá."
 me_nuragic_02_inv_9.a:0 "Somos cazadores de hombres, y nadie está a salvo de nosotros"
 slave_markets_tt:0 "Necesitamos la invención #Y Barcazas Fluviales#! y la Tradición Púnica #Y Gran Mar de Fenicia#!."
 me_nuragic_02_inv_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_9$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_10_title:0 "$nuragic_mission_02_inv_task_10$"
 me_nuragic_02_inv_10_desc:0 "Los italianos, nuestros rivales por el poder en el Mediterráneo Occidental, están abiertamente descontentos con nuestro estatus como potencia marítima y están particularmente molestos por nuestras partidas de saqueo; el número de quejas oficiales presentadas por sus diplomáticos se ha vuelto tedioso. Al principio, estas misivas nos pedían educadamente que moderáramos a nuestros hombres, ofreciéndonos un estatus oficial como 'Amigos de Italia' si accedíamos a sus peticiones, y cuando esta solicitud absurda fue ignorada como tontería, la correspondencia se volvió cada vez más agresiva.\n\nFinalmente, cuando un nuevo gobernante emitió una amenaza de invasión debido a nuestro silencio diplomático, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] se dio cuenta de que la guerra era una inevitabilidad, y en lugar de esperar a que los italianos desembarcaran en nuestras costas, decidió recortar las alas del pájaro antes de que tuviera la oportunidad de volar."
 me_nuragic_02_inv_10.a:0 "Las legiones nunca pisarán nuestras islas... destruyan su flota"
 me_nuragic_02_inv_10_tooltip:0 "#R ¡Declararemos una guerra de Superioridad Naval inmediatamente!#! $mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_10$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_11_title:0 "$nuragic_mission_02_inv_task_11$"
 me_nuragic_02_inv_11_desc:0 "Habiendo establecido con éxito una cabeza de playa en [GetProvince('(int32)94').GetName], indudablemente la parte más difícil de esta empresa, solo será cuestión de tiempo antes de que completemos nuestras reclamaciones sobre el resto de la provincia de Sicania. A medida que nuestros hombres toman posiciones en las colinas y campos de Sicilia, volvemos nuestras caras hacia las murallas de la legendaria ciudad de [GetProvince('(int32)84').GetName]... no pasará mucho tiempo antes de que nuestras tropas estén acantonadas fuera de sus muros."
 me_nuragic_02_inv_11.a:0 "Subyugaremos la provincia en breve"
 me_nuragic_02_inv_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_11$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_12_title:0 "$nuragic_mission_02_inv_task_12$"
 me_nuragic_02_inv_12_desc:0 "Aunque hemos tomado muchas ciudades en este punto, nuestros hombres sienten una ligera sensación de aprensión mientras se preparan para nuestra campaña contra [GetProvince('(int32)84').GetName]. Es una cosa bloquear un puerto cartaginés, o desembarcar hombres en una pequeña isla, pero saquear una ciudad prestigiosa como [GetProvince('(int32)84').GetName]? Nuestras reputaciones quedarán firmemente establecidas si logramos tal victoria impresionante. Lo que logremos aquí enviará ondas de choque por todo el mundo; ¡que los dioses de la guerra sonrían sobre nosotros este día!"
 me_nuragic_02_inv_12.a:0 "Nuestros enemigos nos observan, esperando vernos fracasar. Les negaremos el placer"
 me_nuragic_02_inv_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_12$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_13_title:0 "$nuragic_mission_02_inv_task_13$"
 me_nuragic_02_inv_13_desc:0 "Se ha dicho que en un día claro, se puede ver la ciudad de [GetProvince('(int32)3254').GetName] desde los lugares más altos en la isla de [GetProvince('(int32)1470').GetName] - así de cerca está el pequeño puerto de la costa de África del Norte. Aunque hemos chocado una y otra vez con los cartagineses, despojándolos cruelmente de sus posesiones, tenemos otra guerra que librar contra los ciudadanos de [GetProvince('(int32)3256').GetName]. Si logramos desalojarlos de la pequeña isla frente a su costa, nuestras partidas de saqueo podrán hostigar su navegación sin impedimentos, lo que será muy lucrativo para nuestras finanzas."
 me_nuragic_02_inv_13.a:0 "¡Oremos para que no tomemos Cartago misma!"
 me_nuragic_02_inv_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_13$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_14_title:0 "$nuragic_mission_02_inv_task_14$"
 me_nuragic_02_inv_14_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName], ¡tenemos buenas noticias que compartir! ¡Nuestros barcos han regresado después de explorar el Mediterráneo Occidental, donde fueron constantemente seguidos por barcos de guerra cartagineses! Parece que los astutos púnicos estaban ansiosos por hundir nuestra flota, pero no pudieron atraparnos, lo cual es un regalo por el que estamos agradecidos. Nuestros exploradores informan que navegaron hasta las Columnas de Hércules antes de regresar, sin deseos de adentrarse en las profundas aguas del Océano. Nuestros asesores militares han propuesto que tomemos las Columnas para nosotros; si logramos asegurar el cruce, podremos limitar severamente la capacidad de Cartago para viajar a la Península Ibérica."
 me_nuragic_02_inv_14.a:0 "Esto es muy interesante..."
 me_nuragic_02_inv_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_13$#!' $mission_completed_tooltip_2$"
 sicania_claims_tt:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_14$#!' $mission_completed_tooltip_2$"
 pillars_herc_tt:0 "Necesitamos la invención #Y Navegación Astral#!"

 me_nuragic_02_inv_15_title:0 "$nuragic_mission_02_inv_task_15$"
 me_nuragic_02_inv_15_desc:0 "¡Noticias tremendas, o [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]! ¡Nuestros exploradores han regresado de otra de sus aventuras con una historia que debe escucharse para ser creída! Navegando desde la ciudad de [GetProvince('(int32)3061').GetName], nuestras flotas siguieron la costa de Iberia, hasta el borde de la tierra de la Galia, en una región conocida como Osisimia. Deteniéndose para proveerse en el puerto de [GetProvince('(int32)2151').GetName], nuestro almirante fue informado de la existencia de la isla de [GetProvince('(int32)2000').GetArea.GetRegion.GetName] al norte, y, deseando verla personalmente, navegó más allá que nunca antes.\nUnos meses después, habiendo circunnavegado toda la isla (un logro impresionante para nuestra nación), nuestros hombres finalmente llegaron a la pequeña isla de [GetProvince('(int32)2108').GetName] en el Mare Hibernicum, donde se vieron obligados a detenerse para agua fresca. Allí conocieron a un tribuano local, un granjero llamado Norf, quien los llevó a la aldea y nos presentó al líder de la pequeña tribu. Se intercambiaron cortesías y regalos antes de que nuestros hombres tomaran nuevamente el mar, ansiosos por compartir lo que habían descubierto."
 me_nuragic_02_inv_15.a:0 "¡Hacer nuevos amigos es una razón para celebrar!"
 me_nuragic_02_inv_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_16$#!' $mission_completed_tooltip_2$"
 
 me_nuragic_02_inv_150_title:0 "Informes de [GetProvince('(int32)2108').GetName]"
 me_nuragic_02_inv_150_desc:0 "Ha llegado a nuestra corte un mensaje desde los mares del norte: uno de nuestros barcos, desviado de la flota principal, ha tomado el control de la remota isla de [GetProvince('(int32)2108').GetName]. La tripulación, ahora autoproclamada guardiana de la isla, informa de su éxito y espera nuestra orden.\n\n¿Reconoceremos este acto audaz y reclamaremos a Manavia como nuestro puesto de avanzada en el norte, un trampolín hacia aguas desconocidas? ¿O llamaremos a nuestros hombres y abandonaremos esta lejana aventura, para que no se convierta en una carga más allá de su valor?\n\nEl mar ofrece tanto promesas como peligros. La elección es nuestra."
 me_nuragic_02_inv_150.a:0 "¡Una colonia en el norte!"
 me_nuragic_02_inv_150.b:0 "Volverán a casa."
 me_nuragic_02_inv_150_tooltip.a:0 "Damos instrucciones para fundar una colonia en el recién conquistado [GetProvince('(int32)2108').GetName], considerando la distancia de nuestra patria le otorgaremos una gran autonomía. Un bastión de nuestro pueblo en el norte indómito."
 me_nuragic_02_inv_150_tooltip.b:0 "No apoyamos la fundación de una colonia en esa tierra."
 
 me_nuragic_02_inv_151_title:0 "Nuevos colonos para [GetProvince('(int32)2108').GetName]"
 me_nuragic_02_inv_151_desc:0 "Se corre la voz rápidamente: ahora más hombres y familias buscan seguir el audaz camino hacia Manavia. Entre ellos se encuentran exploradores experimentados, ansiosos por avanzar más allá de las costas conocidas y expandir el puesto de avanzada aún más. No piden riquezas, sólo herramientas, semillas y barcos para llevar sus esperanzas.\n\n¿Les concedemos esta oportunidad y plantamos nuestra bandera firmemente en el norte? ¿O debemos dar la vuelta y dejar que Manavia se desvanezca entre los vientos olvidados?"
 me_nuragic_02_inv_151.a:0 "¡Dales lo que necesitan para la gloria de Sardo!"
 me_nuragic_02_inv_151.b:0 "Esos páramos lejanos no merecen la pena."
 me_nuragic_02_inv_151.c:0 "Recuérdamelo en el futuro."
 me_nuragic_02_inv_151_tooltip.a:0 "Se envían más colonos a [GetProvince('(int32)2108').GetName], algunos de ellos pueden querer expandir aún más nuestro puesto de avanzada."
 me_nuragic_02_inv_151_tooltip.b:0 "No enviamos ningún nuevo colono a ese puesto de avanzada lejano."
 me_nuragic_02_inv_151_tooltip.c:0 "Este evento volverá a suceder dentro de 10 años."
 
 me_nuragic_02_inv_152_title:0 "Otro saludo a [GetProvince('(int32)2108').GetName]"
 me_nuragic_02_inv_152_desc:0 "Un nuevo viento sopla desde el norte: más familias, impulsadas por el coraje y la promesa de tierras no reclamadas, ahora se reúnen con un único propósito: viajar a [GetProvince('(int32)2108').GetName] y fundar nuevas colonias más allá de sus costas. Vienen con carros de grano, herramientas de comercio y corazones decididos a construir de nuevo donde el mar frío se encuentra con el horizonte salvaje.\n\nEstos no son vagabundos, sino colonos (granjeros, artesanos y soñadores) listos para llevar el espíritu [ROOT.GetCountry.GetAdjective] donde aún no vuela ningún estándar. ¿Bendeciremos su causa y enviaremos barcos para apoyar esta visión del norte? ¿O les pediremos que esperen mientras el futuro los llama a seguir adelante?"
 me_nuragic_02_inv_152.a:0 "¡Dales lo que necesitan, alabado sea Sardò!"
 me_nuragic_02_inv_152.b:0 "No estamos demasiado interesados."
 me_nuragic_02_inv_152.c:0 "Recuérdamelo en el futuro."
 me_nuragic_02_inv_152_tooltip.a:0 "Se envían más colonos a [GetProvince('(int32)2108').GetName], algunos de ellos pueden querer expandir aún más nuestro puesto de avanzada."
 me_nuragic_02_inv_152_tooltip.b:0 "No enviamos ningún nuevo colono a ese puesto de avanzada lejano."
 me_nuragic_02_inv_152_tooltip.c:0 "Este evento volverá a suceder dentro de 10 años."
 
 me_nuragic_02_inv_16_title:0 "$nuragic_mission_02_inv_task_16$"
 me_nuragic_02_inv_16_desc:0 "El puerto de [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] fue escenario de un caos total esta mañana cuando una maltrecha flota de barcos regresó al amanecer. La conmoción fue tan feroz que [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], creyendo que debíamos estar bajo ataque, corrió hacia el puerto para defender las defensas. En un extraño giro de los acontecimientos, parece que nuestras trompetas no sonaban toques de clarín, advirtiendo a nuestras guarniciones del peligro, sino que más bien celebraban la llegada de una fuerza expedicionaria, una que habíamos enviado hacía años y que durante mucho tiempo creíamos que se había perdido en el mar. Su historia es difícil de creer, y si no fuera por los regalos que trajeron consigo, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] habría descartado su historia como mentira.\n\nAl final, fue una bendición que nuestra expedición al este fuera más pequeña que la que enviamos al oeste, porque nuestros exploradores pasaron por momentos difíciles. Nuestras propuestas diplomáticas fueron rechazadas por muchas de las ciudades que encontraron en el camino, quienes se negaron a dejar atracar nuestros barcos en sus puertos, y en una ocasión, una armada de [GetProvince('(int32)516').GetArea.GetRegion.GetName] atacó a nuestros hombres sin provocación, dispersándolos sin piedad. Al encontrar bloqueado el camino a casa, nuestros marineros se vieron obligados a navegar aún más hacia el este, logrando de alguna manera escapar de los egipcios.\n\nA medida que los meses se convirtieron en años, nuestra flota descarriada navegó por el Sinus Arabus, cada vez más temerosa de no vivir nunca para regresar a [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]. Cuando se perdió toda esperanza, ocurrió un milagro absoluto; cerca de la tierra de [GetProvince('(int32)7530').GetArea.GetRegion.GetName], nuestros hombres se encontraron con una flota comercial de la isla de [GetProvince('(int32)7530').GetArea.GetName], quienes al ver nuestro lamentable estado, los invitaron a regresar a sus hogares. Después de conocer sus aventuras, los habitantes de [GetProvince('(int32)7530').GetName] quedaron maravillados, expresando su deseo de ver a nuestros marineros regresar sanos y salvos a casa. Prometiendo amistad, reabastecieron nuestros barcos y nos dieron uno de sus tesoros, invitándonos a regresar a casa y compartir su historia.\n\nY, todos estos años después, eso es exactamente lo que hicieron."
 me_nuragic_02_inv_16.a:0 "Dígales a nuestros nuevos amigos que les agradecemos profundamente su amabilidad."
 me_nuragic_02_inv_16_tooltip:0 "El #Y Cetro de sangre de dragón#! se ha añadido a nuestro tesoro. $mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_16$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_17_title:0 "$nuragic_mission_02_inv_task_17$"
 me_nuragic_02_inv_17_desc:0 "A medida que nuestra conexión con nuestros amigos rápidos en [GetProvince('(int32)7530').GetName] continúa creciendo, han invitado a algunos de nuestros comerciantes a acompañarlos en una de sus propias misiones comerciales. Esta tierra lejana, que según nuestros estudiosos es conocida por los griegos como 'Taprobane', es desconocida para nuestro pueblo, y si no fuera por nuestros guías de Soqotra, nunca hubiéramos podido encontrar su ubicación. Al principio, cuando se nos presentaron los costos, dudamos en comprometernos con tal empresa, pero [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] no quiso aceptar e impulsó la iniciativa.\n\nFue un día emocionante en [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] cuando los primeros barcos mercantes de [GetProvince('(int32)6971').GetArea.GetRegion.GetName], con sus bodegas repletas de cargas exóticas. Si bien a nuestro pueblo le agradaban especialmente las pieles, el ámbar y las piedras preciosas que llegaban al mercado, la mayor demanda son las especias traídas de aquellas costas lejanas; Nuestra nación parece estar desarrollando un apetito voraz por delicias aromáticas como el cardamomo, la pimienta, el clavo, la nuez moscada y la vainilla."
 me_nuragic_02_inv_17.a:0 "Expanding our trade connections is indeed a delightful endeavor."
 me_nuragic_02_inv_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_17$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_18_title:0 "$nuragic_mission_02_inv_task_18$"
 me_nuragic_02_inv_18_desc:0 "Las islas situadas directamente al norte de Creta, que los lugareños conocen como las Cícladas, han abierto sus puertas a los numerosos refugiados de nuestras guerras en [GetProvince('(int32)84').GetArea.GetName] y [GetProvince('(int32)351').GetArea.GetName]. Aunque hemos solicitado cortésmente que todos los elementos criminales sean entregados inmediatamente, dejando en claro que no tenemos ningún deseo de enfrentarnos militarmente a menos que nos veamos absolutamente obligados a hacerlo, los altivos isleños han tratado a nuestros enviados con una completa falta de respeto que raya en el insulto. A menos que se haga algo, tendremos un foco de resistencia en nuestro patio trasero, y esto es inaceptable."
 me_nuragic_02_inv_18.a:0 "El amigo de mi enemigo es mi enemigo...prepárate para la guerra."
 me_nuragic_02_inv_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_18$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_19_title:0 "$nuragic_mission_02_inv_task_19$"
 me_nuragic_02_inv_19_desc:0 "Aunque conquistamos directamente la isla de Sicilia, eso no significó que los habitantes se sometieran pacíficamente al nuevo status quo. Por el contrario, algunos de los siceliotas, creyendo que nuestra presencia en su isla era temporal, habían tomado posiciones en las colinas, saqueando nuestros asentamientos desde sus campamentos secretos y, en general, causando molestias. Sabiendo que este era un estado insostenible, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] envió escuadrones armados a lo largo de las montañas Sicanias, donde se llevó a cabo una guerra lenta pero decidida contra los agitadores. A pesar de que el costo tanto en tiempo como en mano de obra fue severo, finalmente logramos controlar a los perros Siceliote.\n\nAlgunos se han preguntado por qué [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] ha dedicado tanto tiempo a preparar la isla... ¿qué objetivo busca realmente [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]?"
 me_nuragic_02_inv_19.a:0 "No toleraremos que los rebeldes merodeen por el campo"
 me_nuragic_02_inv_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_19$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_19.b:0 "La gloriosa ciudad de [GetProvince('(int32)84').GetArea.GetName] será nuestra nueva capital..."

 me_nuragic_02_inv_20_title:0 "$nuragic_mission_02_inv_task_20$"
 me_nuragic_02_inv_20_desc:0 "[GetProvince('(int32)368').GetArea.GetName] es una isla llena de ciudades-estado en disputa, cada una de ellas enfrascada en una amarga lucha a muerte contra sus vecinos. Cada verano, durante la temporada de campaña, los ejércitos cretenses salen inexorablemente al campo de batalla, atacándose unos a otros antes de retirarse detrás de las murallas de sus ciudades para lamerse las heridas. Así, a un gran costo, los pequeños déspotas obtienen pequeñas ganancias, sólo para que su suerte se revierta al año siguiente cuando se lanzan los inevitables contraataques.\n\nTan consumidos están los cretenses con sus disputas internas que nunca se dieron cuenta de lo que estamos haciendo..."
 me_nuragic_02_inv_20.a:0 "La paz llegará a [GetProvince('(int32)368').GetArea.GetName] cuando la traigamos"
 me_nuragic_02_inv_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_20$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_21_title:0 "$nuragic_mission_02_inv_task_21$"
 me_nuragic_02_inv_21_desc:0 "Los Registros de los Faraones afirman que un pueblo conocido como los Caftoritas o los Peleset zarpó una vez desde [GetProvince('(int32)368').GetArea.GetName], atacando las costas de Egipto y trayendo muerte y destrucción antes de regresar a sus barcos, cargados de botín y esclavos. Los egipcios tenían tanto miedo de estos llamados 'Pueblos del Mar' que tallaron estelas alrededor de toda su tierra natal, advirtiendo contra el regreso de estos temibles asaltantes.\n\nQuizás, una vez que hayamos tomado Creta, les daremos a estos egipcios el susto de sus vidas haciendo realidad sus peores pesadillas."
 me_nuragic_02_inv_21.a:0 "No habrá escapatoria del destino que está por venir."
 me_nuragic_02_inv_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_21$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_22_title:0 "$nuragic_mission_02_inv_task_22$"
 me_nuragic_02_inv_22_desc:0 "Es un recuerdo reciente que los habitantes de [GetProvince('(int32)266').GetName] fueron asediados, con su bella isla rodeada por ejércitos antigónidas antes de verse obligados a retirarse sin haber capturado la ciudad. Parece que los rodios, ebrios de arrogancia y mareados por su éxito, aprovecharon esta oportunidad para hacer crecer sus intereses, creyendo que sus días de peligro mortal habían quedado atrás. \n\nImagínese la expresión de sus rostros, entonces, mientras nuestras máquinas de asedio ocupan los lugares que alguna vez ocuparon las temibles máquinas construidas por Demetrios, hijo de Antigonos Monophthalmos. Sin embargo, hay una diferencia entre nosotros y los Antigónidas; ¡Triunfaremos donde fracasó Poliorcetes!"
 me_nuragic_02_inv_22.a:0 "The independence of [GetProvince('(int32)266').GetName] ends now."
 me_nuragic_02_inv_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_22$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_23_title:0 "$nuragic_mission_02_inv_task_23$"
 me_nuragic_02_inv_23_desc:0 "Nuestras fuentes antiguas hablan de un misterioso Pueblo del Mar conocido como los Denyen que establecieron sus bases en las costas de [GetProvince('(int32)1883').GetArea.GetName] antes de zarpar para conquistar la isla de [GetProvince('(int32)330').GetArea.GetName]. Fue aquí donde, desde su posición privilegiada en el Mediterráneo oriental, hicieron la vida imposible a los pueblos asentados del Levante, destruyendo civilizaciones florecientes y dando fama duradera a su nombre.\n\nSí, todo eso suena encantador: es hora de revivir los días de gloria."
 me_nuragic_02_inv_23.a:0 "Desde Baleares hasta Chipre, todas las islas nos pertenecen"
 me_nuragic_02_inv_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_23$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_23.b:0 "No warning to our enemies—attack immediately!"
 me_nuragic_02_inv_23_b_tooltip:0 "#R ¡Iremos inmediatamente a la guerra!#! $mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_23$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_24_title:0 "$nuragic_mission_02_inv_task_24$"
 me_nuragic_02_inv_24_desc:0 "Nuestras guerras exteriores nos han puesto en contacto, si no en conflicto abierto, con las grandes civilizaciones del Mediterráneo, y si bien hemos sometido a cualquier enemigo que nos hayamos propuesto superar, no estamos tan deliberadamente ciegos como para no poder reconocer las áreas en las que nuestros rivales sobresalen. \n\nCuando se trata de cuestiones de filosofía, retórica y artes, hay pocos que puedan compararse con los griegos; su sabiduría es conocida en todo el mundo y debemos tener este conocimiento por nosotros mismos. Sabiendo que podemos elegir a quién queremos enseñar a nuestros hijos, nos hemos decidido por los eruditos griegos. Tenemos la esperanza de que, con el tiempo, superemos incluso a estos gigantes intelectuales con nuestras propias obras."
 me_nuragic_02_inv_24.a:0 "La próxima generación de nuestros líderes recibirá clases de los mejores tutores del mundo."
 me_nuragic_02_inv_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_24$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_25_title:0 "Return of the Sea Peoples"
 me_nuragic_02_inv_25_desc:0 "Hay una historia contada por los Ancianos de nuestro pueblo, una historia maravillosa que incluso los más jóvenes se saben de memoria: la Leyenda de los Pueblos del Mar. Hace cientos de años, en una época en la que desconocíamos el arte de escribir, una poderosa confederación de naciones marineras, incluidos nuestros ancestros lejanos, unió fuerzas con el sombrío propósito de librar una guerra contra los poderosos reinos del Este. Muchas civilizaciones fueron arrodilladas por los ejércitos devastadores de los Pueblos del Mar, que no mostraron piedad hacia los débiles, dejando a su paso las cenizas humeantes de capitales y fortalezas. \n\nTan rápido como aparecieron, los Pueblos del Mar desaparecieron de las historias, dejando una confusión total en las tierras civilizadas, que no sabían de dónde venían los salvajes ni de dónde regresaban. A medida que pasó el tiempo, los amargos recuerdos se convirtieron en fábulas y los Pueblos del Mar se convirtieron en el hombre del saco, una historia aterradora para los niños tranquilos.\n\nPero algunas historias nunca deben olvidarse; de ​​hecho, es muy peligroso hacerlo."
 me_nuragic_02_inv_25.a:0 "Time to make history..."
 me_nuragic_02_inv_25_tooltip:0 "¡Que nuestros enemigos tiemblen al ver nuestros barcos en el horizonte!"

 me_nuragic_02_inv_26_title:0 "$nuragic_mission_02_inv_task_26$"
 me_nuragic_02_inv_26_desc:0 "Hemos recibido noticias en [ROOT.GetCountry.GetCapital.GetName] de que nuestros esfuerzos para colonizar la frontera de #E Córcega#! han terminado, con muchos de nuestros [ROOT.GetCountry.GetAdjective] compatriotas dejando sus hogares ancestrales para ver si la vida será diferente en una provincia desconocida.\n\nAfortunadamente para nosotros, no anticipamos conflictos entre nuestro pueblo y los locales."
 me_nuragic_02_inv_26.a:0 "Estoy agradecido por las pequeñas bendiciones..."
 me_nuragic_02_inv_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_26$#!' $mission_completed_tooltip_2$"
 
 me_nuragic_02_inv_260_title:0 "Sistema de carreteras de Córcega"
 me_nuragic_02_inv_260_desc:0 "Córcega se alza orgullosa, con sus picos audaces y sus costas bien cuidadas, pero por dentro, sus caminos siguen siendo salvajes y dispersos. Desde Phikaria en el sur hasta Alalia en el este, nuestro dominio se extiende ampliamente, pero los viajes siguen siendo lentos e inciertos.\n\n¿Debemos invertir en una verdadera red de carreteras que une las tierras altas y las llanuras con piedra y voluntad? Una red así no sólo aceleraría a nuestros ejércitos y comerciantes, sino que uniría la isla en un solo cuerpo vivo bajo el gobierno de [ROOT.GetCountry.GetAdjective]. La cuestión no es sólo de piedra y trabajo, sino de legado."
 me_nuragic_02_inv_260.a:0 "Abriremos caminos adecuados para nuestro pueblo."
 me_nuragic_02_inv_260.b:0 "No hay necesidad de tal proyecto aquí."
 me_nuragic_02_inv_260_tooltip.a:0 "Se construirán carreteras en Córcega."
 me_nuragic_02_inv_260_tooltip.b:0 "No merece la pena invertir en una red de carreteras para esta zona."
 
 me_nuragic_02_inv_27_title:0 "$nuragic_mission_02_inv_task_27$"
 me_nuragic_02_inv_27_desc:0 "Un poco de buenas noticias llegó a [ROOT.GetCountry.GetCapital.GetName] esta mañana, enviada por los exuberantes ingenieros que trabajan en [GetProvince('(int32)3511').GetName]. Ellos informan alegremente que el #E Puerto Militar#! que [ROOT.GetCountry.GetRuler.GetName] ordenó construir finalmente está terminado, y ya el puerto es un hervidero de actividad en #E Córcega#!.\n\nSin embargo, las noticias viajan rápido en estas partes, y hay muchos espías que recorren las ciudades y asentamientos [ROOT.GetCountry.GetAdjective]. Los mensajes clandestinos que envían a casa siempre dicen lo mismo..."
 me_nuragic_02_inv_27.a:0 "Mantén un ojo en [GetProvince('(int32)3511').GetName], porque [ROOT.GetCountry.GetName] está tramando algo..."
 me_nuragic_02_inv_27_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_27$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_28_title:0 "$nuragic_mission_02_inv_task_28$"
 me_nuragic_02_inv_28_desc:0 "Por fin, hemos conquistado a aquellos que resistían nuestra presencia en la isla de #E Córcega#!.\n\nHay muchos ricos premios que hemos tomado para nosotros; ahora tenemos acceso sin restricciones a los bosques vírgenes de la isla, lo cual es una ventaja por la que [ROOT.GetCountry.GetRuler.GetName] está especialmente agradecido. El sonido de los hachas [ROOT.GetCountry.GetAdjective] y los altos árboles cayendo resonará a lo largo de los bosques, con los preciosos cargamentos de madera siendo transportados a los puertos y harbors de [ROOT.GetCountry.GetName]."
 me_nuragic_02_inv_28.a:0 "Esta madera corciana será útil cuando llegue el momento de construir flotas"
 me_nuragic_02_inv_28_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_28$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_29_title:0 "$nuragic_mission_02_inv_task_29$"
 me_nuragic_02_inv_29_desc:0 "Nuestras fuerzas victoriosas han conquistado [GetProvince('(int32)1464').GetName], trayendo gloria eterna a los guerreros [ROOT.GetCountry.GetAdjective] y haciendo mucho para aumentar la popularidad de [ROOT.GetCountry.GetRuler.GetName], quien muchos dicen es el único responsable de guiarnos hasta este momento."
 me_nuragic_02_inv_29.a:0 "Un buen líder no está solo, sino que confía en la ayuda de muchos otros"
 me_nuragic_02_inv_29_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_29$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_30_title:0 "$nuragic_mission_02_inv_task_30$"
 me_nuragic_02_inv_30_desc:0 "Es un espectáculo curioso el que se puede ver esta mañana, uno que [ROOT.GetCountry.GetRuler.GetName] no se perdería si [ROOT.GetCountry.GetRuler.GetHerHis] la vida dependiera de ello.\n\nUn flujo constante de inmigrantes, con sus posesiones mundanas cargadas en animales de carga o transportadas en sacos, se aventura desde el corazón de la isla de #E Cerdeña#! y se dirige a uno de los muchos puertos de la isla. Su destino final es el recientemente renombrado [GetProvince('(int32)1469').GetName]; una señal del resurgimiento nurágico en estas partes.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] ha hecho todo lo que está a su alcance [ROOT.GetCountry.GetRuler.GetHerHis] para garantizar que los colonos tengan una vida cómoda en sus nuevos hogares y, sin embargo, sigue siendo agridulce ver a tantos abandonar a sus familias."
 me_nuragic_02_inv_30.a:0 "Este es un día para lágrimas, pero no todas son tristes..."
 me_nuragic_02_inv_30_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_30$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_31_title:0 "$nuragic_mission_02_inv_task_31$"
 me_nuragic_02_inv_31_desc:0 "No fue la tarea más fácil, construir una ciudad lejana - hubo algunos pequeños contratiempos con la construcción de [GetProvince('(int32)1466').GetName], por ejemplo - pero ahora que todo ha terminado, la administración de los #E Baleares#! será un asunto mucho más sencillo.\n\nPara cerrar el trato, se ha instalado en el palacio local de Guium un #E Administrador Nurágico#!, seleccionado personalmente por [ROOT.GetCountry.GetRuler.GetName] para supervisar los asuntos locales. Este magistrado se asegurará de que las operaciones diarias en la isla se desarrollen sin problemas, actuando como los ojos y las manos de nuestro [ROOT.GetCountry.GetRulerTitle]."
 me_nuragic_02_inv_31.a:0 "Espero informes detallados a principios de cada mes"
 me_nuragic_02_inv_31_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_31$#!' $mission_completed_tooltip_2$"
 
 me_nuragic_02_inv_310_title:0 "Red de carreteras de Belear"
 me_nuragic_02_inv_310_desc:0 "El corazón de Baleares late fuerte, pero sus miembros siguen inconexos. La isla principal, aunque rica en aldeas, arboledas y castros, sufre de aislamiento: cada valle conoce su propio camino, pero la isla misma camina dividida. ¿No uniremos estas tierras con piedra y tierra?\n\nUna red de carreteras, atravesada por crestas y llanuras, llevaría grano al puerto, guerreros que reunir y ley a cada aldea."
 me_nuragic_02_inv_310.a:0 "Allanemos los caminos."
 me_nuragic_02_inv_310.b:0 "No vale la pena."
 me_nuragic_02_inv_310_tooltip.a:0 "Se construirán carreteras en la principal isla balear."
 me_nuragic_02_inv_310_tooltip.b:0 "No merece la pena invertir en una red de carreteras para esta zona."

 me_nuragic_02_inv_32_title:0 "$nuragic_mission_02_inv_task_32$"
 me_nuragic_02_inv_32_desc:0 "Envía un mensaje a los reyes y señores de la guerra bárbaros a lo largo de las costas orientales de #E Iberia#! que sus días de libertad están contados, y que los dioses del inframundo están abriendo la tumba para recibir los cuerpos y sombras de sus hijos.\n\n[ROOT.GetCountry.GetRuler.GetName] ha reclamado estas tierras para [ROOT.GetCountry.GetName]!"
 me_nuragic_02_inv_32.a:0 "Sería mejor que dejes las armas... piensa en los niños"
 me_nuragic_02_inv_32_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_32$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_33_title:0 "$nuragic_mission_02_inv_task_33$"
 me_nuragic_02_inv_33_desc:0 "Una vez que la región de #E Cessetania#! había sido aplastada bajo las botas de los reclutas [ROOT.GetCountry.GetAdjective], [ROOT.GetCountry.GetRuler.GetName] visitó personalmente a las tropas para agradecerles por su servicio excepcional. Con la voz llena de pasión, [ROOT.GetCountry.GetRuler.GetSheHe] comienza a dirigirse a los soldados.\n\n'Lo que han logrado aquí trae gloria a nuestra gente y nuestra sociedad - no puedo agradecerles lo suficiente por lo que han hecho. Pero debo hacerles otra pregunta... ¿aún están conmigo? ¿Montarán conmigo hasta los confines de la Tierra si así lo quiere Sardo?'\n\nEl sonido de diez mil hombres gritando sacude la tierra..."
 me_nuragic_02_inv_33.a:0 "¡Los seguiremos hasta el Inframundo y de regreso, nuestro [ROOT.GetCountry.GetRulerTitle]!"
 me_nuragic_02_inv_33_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_33$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_34_title:0 "$nuragic_mission_02_inv_task_34$"
 me_nuragic_02_inv_34_desc:0 "Nuestros exploradores han completado un exhaustivo estudio de las costas ibéricas y han sugerido que el territorio de [GetProvince('(int32)1009').GetName] sea bendecido con una nueva colonia Nurágica - una idea con la que [ROOT.GetCountry.GetRuler.GetName] está de acuerdo."
 me_nuragic_02_inv_34.a:0 "Queremos que nuestra presencia en estas tierras se sienta..."
 me_nuragic_02_inv_34_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_34$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_35_title:0 "$nuragic_mission_02_inv_task_35$"
 me_nuragic_02_inv_35_desc:0 "Te complace saber, o [ROOT.GetCountry.GetRuler.GetName], que finalmente hemos logrado someter las tendencias rebeldes de los griegos ibéricos. Es bien conocido cuánto valoran estos griegos su libertad, pero han llegado a aceptar lo inevitable - no puede haber independencia de [ROOT.GetCountry.GetName].\n\nSin embargo, no todo es desolación; hay muchas historias de éxito, como la de [GetProvince('(int32)1000').GetName], que ha abrazado la presencia de comerciantes y nobles Nurágicos. Las élites locales han trabajado con estos intereses extranjeros para construir impresionantes talleres de soplado de vidrio.\n\nMientras que la ciudad de Emporion era famosa por su vidrio antes, ahora se ha convertido en el centro preeminente en el Mediterráneo Occidental para la producción de este bien de lujo."
 me_nuragic_02_inv_35.a:0 "Mi gente está enloqueciendo por el vidrio de Emporion - no los culpo"
 me_nuragic_02_inv_35_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_35$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_36_title:0 "$nuragic_mission_02_inv_task_36$"
 me_nuragic_02_inv_36_desc:0 "Una vez que la amenaza inmediata para los trabajadores se había reducido lo suficiente, [ROOT.GetCountry.GetRuler.GetName] no perdió tiempo en impresionar a los ibéricos locales para trabajar junto con los ingenieros [ROOT.GetCountry.GetAdjective] en la construcción de una carretera en la costa oriental de la península.\n\nAhora que sus labores han sido completadas, [ROOT.GetCountry.GetRuler.GetFirstName] ha sido invitado personalmente para presenciar su trabajo - verdaderamente, un logro notable."
 me_nuragic_02_inv_36.a:0 "Todos se benefician del fácil traslado de bienes..."
 me_nuragic_02_inv_36_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_36$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_37_title:0 "$nuragic_mission_02_inv_task_37$"
 me_nuragic_02_inv_37_desc:0 "Se ha decidido, después de mucho deliberar, que vamos a preparar reclamaciones sobre las tierras #E Etruscas#! en Italia. Etruria es una tierra rica en viñedos y villas, y sería conveniente tomar este cordero engordado para nuestros propios fines.\n\nEste curso de acción no será fácil, pero [ROOT.GetCountry.GetRuler.GetName] ha insistido en que no puede haber otro camino."
 me_nuragic_02_inv_37.a:0 "¡No pasará mucho tiempo antes de que lo hayamos tomado todo!"
 me_nuragic_02_inv_37_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_37$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_38_title:0 "$nuragic_mission_02_inv_task_38$"
 me_nuragic_02_inv_38_desc:0 "Ahora que los mercados que hemos construido en las ciudades de [GetProvince('(int32)22').GetName] y [GetProvince('(int32)114').GetName] han sido construidos, hay una solicitud que [ROOT.GetCountry.GetRuler.GetName] ha exigido a los locales; que estos mercados se centren exclusivamente en la importación y exportación de los vinos locales @wine!.\n\nLos gourmets tan lejos como [GetProvince('(int32)516').GetName] e incluso [GetProvince('(int32)918').GetName] son conocidos por solicitar vinos etruscos por su nombre, y están más que dispuestos a pagar cualquier precio que pidamos."
 me_nuragic_02_inv_38.a:0 "No puedo encontrar uvas como estas en ningún otro lugar; realmente valen su peso en oro"
 me_nuragic_02_inv_38_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_38$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_39_title:0 "$nuragic_mission_02_inv_task_39$"
 me_nuragic_02_inv_39_desc:0 "Aunque claramente tenemos más metales en nuestra isla - de hecho, prevemos que nuestras minas nunca se queden sin plomo - nos sorprendió descubrir que [GetProvince('(int32)126').GetName] tiene una sorprendente cantidad de mineral en el suelo.\n\nNunca uno para ignorar una oportunidad, [ROOT.GetCountry.GetRuler.GetName] ha ordenado que la infraestructura de Pupluna se expanda para acomodar a los mineros locales."
 me_nuragic_02_inv_39.a:0 "Pupluna se hará conocida como el 'Puerto de los Metales' algún día"
 me_nuragic_02_inv_39_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_39$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_40_title:0 "$nuragic_mission_02_inv_task_40$"
 me_nuragic_02_inv_40_desc:0 "La riqueza natural de Etruria continúa dando dividendos, esta vez centrada en la isla de [GetProvince('(int32)127').GetName]. Barcos cargados de esclavos llegan desde el continente a diario, desapareciendo en las minas subterráneas donde nunca regresan.\n\nEl mineral de hierro que se encuentra en esta región es de calidad excepcional y está destinado a servir a los reclutas [ROOT.GetCountry.GetAdjective] - ya nuestros herreros han estado ocupados forjando nuevas armas para equipar a nuestros guerreros."
 me_nuragic_02_inv_40.a:0 "Equipados así, ¿quién puede esperar resistir contra nuestras fuerzas?"
 me_nuragic_02_inv_40_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_40$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_41_title:0 "$nuragic_mission_02_inv_task_41$"
 me_nuragic_02_inv_41_desc:0 "Nuestras reclamaciones sobre #E Lacio#! finalmente se han completado, y los romanos están ansiosos por enfrentar a nuestros hombres en tierra - creen ingenuamente que, aunque ya los vencimos en los mares abiertos, nos darán una lección en la lucha con ejércitos."
 me_nuragic_02_inv_41.a:0 "¡No me importa corregir a los cachorros de lobo una segunda vez!"
 me_nuragic_02_inv_41_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_41$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_42_title:0 "$nuragic_mission_02_inv_task_42$"
 me_nuragic_02_inv_42_desc:0 "Para su vergüenza eterna, hemos expulsado a los orgullosos romanos de su ciudad capital, y ahora, las tropas de [ROOT.GetCountry.GetAdjective] patrullan las murallas de [GetProvince('(int32)1').GetName]. Las historias del asedio siempre llenan el corazón de [ROOT.GetCountry.GetRuler.GetName] de orgullo, pues nuestras valientes fuerzas lucharon con valentía, abriéndose camino a través de las puertas de la ciudad y combatiendo casa por casa.\n\nDándose cuenta de que el impulso está con nosotros, [ROOT.GetCountry.GetRuler.GetName] ha exigido que sigamos presionando nuestras reclamaciones hacia el sur."
 me_nuragic_02_inv_42.a:0 "¡No permitas que los latinos tengan respiro y empújalos al mar!"
 me_nuragic_02_inv_42_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_42$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_43_title:0 "$nuragic_mission_02_inv_task_43$"
 me_nuragic_02_inv_43_desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha visto durante mucho tiempo a los #E Lepontios#! como nada más que una molestia, decidiendo enfocar [ROOT.GetCountry.GetRuler.GetHerHis] atención en el sur de Italia, pero los eventos recientes han causado un cambio en la perspectiva.\n\nLos Lepontios se han envalentonado con el caos que actualmente sacude la Península Italiana y han decidido que este es un buen momento para lanzar incursiones cuando puedan. Esperan hasta que nuestras patrullas estén aisladas o perdidas, atacando desde las sombras como cobardes y retirándose antes de que nuestras fuerzas puedan atraparlos."
 me_nuragic_02_inv_43.a:0 "Obviamente, esto no puede continuar - debemos aplastarlos"
 me_nuragic_02_inv_43_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_43$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_44_title:0 "$nuragic_mission_02_inv_task_44$"
 me_nuragic_02_inv_44_desc:0 "A medida que la resistencia italiana se desmorona ante la marcha de las tropas [ROOT.GetCountry.GetAdjective], las ciudades dispersas alrededor de #E Magna Grecia#! están pesando frenéticamente sus opciones.\n\n¿Deberíamos pedir ayuda a #E Grecia#!? ¿O deberíamos fundir nuestras estatuas de culto por monedas, con la esperanza de contratar a tantos mercenarios como podamos permitirnos? ¿Podemos de alguna manera llegar a un acuerdo con [ROOT.GetCountry.GetName]? ¿Nos perdonarán si les damos todo lo que tenemos? ¿Qué podemos hacer?\n\nY mientras los ciudadanos asustados de estas ciudades del sur se esconden dentro de sus ciudadelas, se puede ver al primer ejército Nurágico cruzando el horizonte..."
 me_nuragic_02_inv_44.a:0 "No queda esperanza para ustedes..."
 me_nuragic_02_inv_44_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_44$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_45_title:0 "$nuragic_mission_02_inv_task_45$"
 me_nuragic_02_inv_45_desc:0 "Nuestras flotas se han encontrado con los piratas ilirios errantes demasiadas veces para contar, y finalmente se ha decidido que necesitamos poner fin a sus formas de bucaneros.\n\nAunque las tribus ilirias lucharán con uñas y dientes para mantener sus costas, no tenemos mucho de elección en el asunto; tiene que ser guerra."
 me_nuragic_02_inv_45.a:0 "No podemos tolerar la anarquía en nuestros océanos"
 me_nuragic_02_inv_45_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_45$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_46_title:0 "$nuragic_mission_02_inv_task_46$"
 me_nuragic_02_inv_46_desc:0 "Aunque muchas de las tribus ilirias recientemente conquistadas parecen estar refunfuñando en los bosques, esperando una oportunidad para echarnos fuera de sus hogares, sueñan en vano - no tenemos planes de abandonar jamás el suelo sagrado sobre el cual se derramó sangre Nurágica para reclamarlo.\n\nÚltimamente, hemos hecho lo que podemos para construir colonias en #E Histria#!, habiendo dado cuenta de que la pequeña península es ideal para nuestros propósitos. Fácil acceso al agua, abundante madera y piedra disponibles localmente para la construcción, y los bosques y arroyos están llenos de vida silvestre."
 me_nuragic_02_inv_46.a:0 "Con el tiempo, los ilirios aceptarán su destino"
 me_nuragic_02_inv_46_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_46$#!' $mission_completed_tooltip_2$"
 
 me_nuragic_02_inv_47_title:0 "$nuragic_mission_02_inv_task_47$"
 me_nuragic_02_inv_47_desc:0 "Finalmente hemos destruido a los ejércitos ilirios, aunque sería una mentira decir que sus espíritus están rotos; si acaso, están esperando su tiempo, esperando el día en que las guarniciones [ROOT.GetCountry.GetAdjective] abandonen sus hogares. Pero esto nunca ocurrirá; no bajo la vigilancia de [ROOT.GetCountry.GetRuler.GetName]."
 me_nuragic_02_inv_47.a:0 "Pacificar esta región fue una tarea difícil, ¿por qué íbamos a irnos?"
 me_nuragic_02_inv_47_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_47$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_48_title:0 "$nuragic_mission_02_inv_task_48$"
 me_nuragic_02_inv_48_desc:0 "Te alegrará saber que nuestros ingenieros [ROOT.GetCountry.GetAdjective] están aprendiendo mucho de los constructores de barcos libernios, quienes están compartiendo su experiencia abiertamente. Sus Maestros Constructores son rudos pero pacientes maestros, y aunque se comparten muchas lecciones duras y bromas entre nuestros pueblos y los suyos, todos los agravios se olvidan en los campamentos nocturnos mientras se comparte buen vino [ROOT.GetCountry.GetAdjective] entre los hombres.\n\nNo pasará mucho tiempo hasta que nuestras flotas estén equipadas con las innovaciones que los ilirios han desarrollado."
 me_nuragic_02_inv_48.a:0 "¡Y que el infortunio se cernía sobre cualquier fuerza opositora que nos encuentre en el agua!"
 me_nuragic_02_inv_48_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_48$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_49_title:0 "$nuragic_mission_02_inv_task_49$"
 me_nuragic_02_inv_49_desc:0 "Nuestras reclamaciones contra #E Epiro#! se han completado, nos han informado nuestros asesores militares. Lo único que mantiene a nuestras fuerzas a raya es el mando de [ROOT.GetCountry.GetRuler.GetName], quien está ansioso por desatar nuestras fuerzas sobre el continente griego."
 me_nuragic_02_inv_49.a:0 "¡Prepárate, o tropas Nurágicas, porque no pasará mucho tiempo!"
 me_nuragic_02_inv_49_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_49$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_50_title:0 "$nuragic_mission_02_inv_task_50$"
 me_nuragic_02_inv_50_desc:0 "[ROOT.GetCountry.GetRuler.GetName] tiene una visión, una que [ROOT.GetCountry.GetRuler.GetSheHe] ha perseguido como un perro loco - no hay nada que pueda detener [ROOT.GetCountry.GetRuler.GetHerHim] de hacer realidad el sueño.\n\nEl [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] fantasea con el día en que nuestras fuerzas saqueadoras se muevan de casa en casa en la ciudad de [GetProvince('(int32)3256').GetName], llenando sus sacos con botín y poniendo a miles a la espada. ¡Cómo anhelan nuestros hombres saciar su sed con sangre cartaginesa!"
 me_nuragic_02_inv_50.a:0 "Preparar nuestras reclamaciones es el primer paso... ¡ahora, a Qart Hadasht!"
 me_nuragic_02_inv_50_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_50$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_51_title:0 "$nuragic_mission_02_inv_task_51$"
 me_nuragic_02_inv_51_desc:0 "En este día, [ROOT.GetCountry.GetRuler.GetName] ha reunido a las clases altas y familias nobles de [ROOT.GetCountry.GetCapital.GetName] y los ha traído a [GetProvince('(int32)3256').GetName] para una ceremonia especial. Volverán a casa pronto, pero por ahora, se solicita su presencia en la antigua capital de nuestro rival.\n\nUna vez que el barco personal de [ROOT.GetCountry.GetRuler.GetFirstName] llegó al #E Gran Cothon#!, el [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] se dirigió directamente a los palacios en el corazón de la ciudad. Más tarde esa noche, se ofrecerán oraciones de agradecimiento a Sardo por concedernos esta victoria inestimable sobre nuestro antiguo enemigo."
 me_nuragic_02_inv_51.a:0 "Esto es solo el principio, como verán todos..."
 me_nuragic_02_inv_51_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_51$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_52_title:0 "$nuragic_mission_02_inv_task_52$"
 me_nuragic_02_inv_52_desc:0 "Nuestras fuerzas invencibles han logrado lo imposible en otro teatro de guerra, esta vez venciendo a los fieros #E Numidios#!. Lucharon como demonios, como anticipamos, pero sus pasiones encendidas no pudieron salvarlos de nuestra elite militar.\n\nAunque nuestra caballería no es el igual de estos famosos equites, sus caballos no fueron suficientes para salvarlos."
 me_nuragic_02_inv_52.a:0 "¡Tomaremos estos caballos para nosotros, lo verán!"
 me_nuragic_02_inv_52_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_52$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_53_title:0 "$nuragic_mission_02_inv_task_53$"
 me_nuragic_02_inv_53_desc:0 "Uno por uno, los territorios costeros de #E África#! colapsan en nuestros brazos abiertos, incapaces de hacer otra cosa que caer como un trozo de fruta podrida de un árbol. La última fascinación de [ROOT.GetCountry.GetRuler.GetName] parecen ser las tierras de #E Cirene#!, y se susurra que el [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] ha comenzado a preparar reclamaciones."
 me_nuragic_02_inv_53.a:0 "Quiero un silfio latifundio para mis propios fines..."
 me_nuragic_02_inv_53_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_53$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_54_title:0 "$nuragic_mission_02_inv_task_54$"
 me_nuragic_02_inv_54_desc:0 "Te alegrará escuchar lo que el #E Administrador Nurágico#! que hemos instalado en [GetProvince('(int32)361').GetName] ha escrito, afirmando que encuentra sus alojamientos en #E Creta#! más que aceptables y ofreciendo profusas gracias a [ROOT.GetCountry.GetRuler.GetName], quien intervino personalmente para asegurar que el Administrador estuviera cómodo.\n\nCon el tiempo, esperamos que esta isla acepte nuestra presencia, ya que compartimos una historia antigua."
 me_nuragic_02_inv_54.a:0 "¿Acaso los cretenses siquiera recuerdan su glorioso pasado? Dudoso..."
 me_nuragic_02_inv_54_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_54$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_55_title:0 "$nuragic_mission_02_inv_task_55$"
 me_nuragic_02_inv_55_desc:0 "Hace casi mil años, creemos que los barcos de guerra zarparon de los puertos y refugios de #E Cerdeña#! hacia el #E Levante#!, donde los notorios #E 'Pueblos del Mar'#! buscaban conquistar y esclavizar.\n\nDesafortunadamente para nuestros antepasados, parecen haber fallado en este empeño, viéndose obligados a retirarse a sus barcos en la vergüenza... pero [ROOT.GetCountry.GetRuler.GetName] está aquí para expiar los pecados del pasado.\n\nLas historias de nuestro pueblo hablan de un poderoso rey, #E Fórcos#!, quien es recordado por el pueblo [ROOT.GetCountry.GetAdjective] como un gran guerrero que fue derrotado en una batalla naval hace mucho tiempo.\n\nY ahora, mientras [ROOT.GetCountry.GetRuler.GetName] se prepara para lanzar una de las invasiones más grandes que haya intentado nuestra nación, un rumor ha cobrado vida propia y ha cautivado los corazones de nuestros ciudadanos mientras se esparce por todas partes...\n\n[ROOT.GetCountry.GetRuler.GetFirstName] lleva la sangre de #E Fórcos#! en [ROOT.GetCountry.GetRuler.GetHerHis] corazón."
 me_nuragic_02_inv_55.a:0 "¡No fallaremos esta vez!"
 me_nuragic_02_inv_55_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_55$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_56_title:0 "$nuragic_mission_02_inv_task_56$"
 me_nuragic_02_inv_56_desc:0 "Los informes están llegando desde el #E Levante#!, donde se dice que nuestros generales han llevado a nuestras fuerzas a incontables victorias contra las fuerzas abrumadas reunidas contra nosotros.\n\nA medida que nuestros hombres toman el control de las antiguas ciudades de las costas, nuestros ingenieros y arquitectos están estudiando los rollos y registros de su elite, esperando obtener avances tecnológicos de sus más sabios."
 me_nuragic_02_inv_56.a:0 "Me alegra ver que hemos encontrado algo que vale la pena tomar!"
 me_nuragic_02_inv_56_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_56$#!' $mission_completed_tooltip_2$"
 
 me_nuragic_02_inv_560_title:0 "El destino de las ciudades fenicias"
 me_nuragic_02_inv_560_desc:0 "Las velas del [ROOT.GetCountry.GetAdjective] han llegado a las costas orientales y ahora los antiguos puertos de [GetProvince('(int32)743').GetName], [GetProvince('(int32)747').GetName], [GetProvince('(int32)748').GetName] y [GetProvince('(int32)766').GetName] están a nuestro alcance. Estas ciudades, que alguna vez fueron las joyas brillantes de la costa fenicia, enviaron a sus comerciantes y colonos a través del mar. Fue desde estas costas que una vez los barcos navegaban hacia nuestras tierras llevando bienes y codicia por igual.\n\nAhora, la marea ha cambiado. La pregunta recae sobre nosotros: ¿qué haremos con ellas?\n\n¿Tendremos misericordia de estas antiguas ciudades, permitiéndoles conservar sus nombres y reconstruir su honor bajo nuestra atenta mirada? ¿O los castigaremos, como alguna vez castigaron a nuestros antepasados: despojarlos de sus títulos, dispersar a sus élites, reducir su poder a sal y cenizas? \n\nLos estandartes de los [ROOT.GetCountry.GetAdjective] ondean en lo alto de sus muros. Pero la justicia (o la venganza) sigue indecisa. El Consejo debe hablar."
 me_nuragic_02_inv_560.a:0 "Dejaremos atrás la carga de nuestros antepasados."
 me_nuragic_02_inv_560.b:0 "Morirán en las minas."
 me_nuragic_02_inv_560.c:0 "Mátalos a todos, no tengas piedad."
 me_nuragic_02_inv_560.d:0 "Nos rendirán un homenaje."
 me_nuragic_02_inv_560.e:0 "Quizás tenga una idea."
 me_nuragic_02_inv_560_tooltip.a:0 "Elegimos no vengar a nuestros antepasados, aunque esta decisión puede no apaciguar a nuestros hombres."
 me_nuragic_02_inv_560_tooltip.b:0 "Todos los habitantes de las principales ciudades fenicias serán convertidos en esclavos y los inservibles serán asesinados."
 me_nuragic_02_inv_560_tooltip.c:0 "Destruye sus templos piedra a piedra, destruye sus hogares, decapita a los nobles, quema a los niños, mata a todos. Fenicia ya no existe."
 me_nuragic_02_inv_560_tooltip.d:0 "Necesitamos pagar un enorme tributo por parte de las elites locales, a cambio de una libertad temporal."
 me_nuragic_02_inv_560_tooltip.e:0 "Las élites locales están convencidas de rendir homenaje de buena gana por su libertad. Mientras tanto, los nobles y ciudadanos de Biblos han decidido ponerse de nuestro lado y adoptar nuestras costumbres."
 
 me_nuragic_02_inv_561_title:0 "Una colonia en Fenicia"
 me_nuragic_02_inv_561_desc:0 "Ante nosotros yacen las piedras destrozadas de Tiro, una vez una orgullosa ciudadela insular, ahora humillada por nuestra mano. El mar todavía besa sus puertos rotos, y el viento lleva los susurros de un imperio caído.\n\nAhora debemos elegir: ¿levantaremos una nueva colonia sobre sus ruinas, respirando nueva vida donde una vez estuvo la arrogancia? ¿O dejaremos que Tiro se desvanezca en polvo y silencio, borrando su nombre de la memoria de los hombres, como castigo y advertencia?\n\nDe la ruina puede surgir un nuevo amanecer, o quedar sellado para siempre en la sombra. La decisión es nuestra."
 me_nuragic_02_inv_561.a:0 "Una colonia de Sulki ocupará su lugar."
 me_nuragic_02_inv_561.b:0 "Nadie volverá a murmurar el nombre de Tiro."
 me_nuragic_02_inv_561.c:0 "Colonizaremos fuertemente toda Fenicia."
 me_nuragic_02_inv_561_tooltip.a:0 "Se construirá una colonia sulkiana sobre las ruinas de Tiro, nuestra venganza será verdaderamente eterna."
 me_nuragic_02_inv_561_tooltip.b:0 "No nos importa este lugar abandonado e inútil, desenterraremos los cuerpos de los viejos tiranos y los dejaremos pudrirse alrededor de las cenizas de su ciudad. Borraremos el nombre mismo de Tiro de los anales de la historia, a cualquiera que murmure este nombre prohibido nuevamente se le cortará la lengua y se le medirán los ojos frente a su familia. Esta será realmente nuestra venganza."
 me_nuragic_02_inv_561_tooltip.c:0 "Las costas de Fenicia son tierra algo fértil, con buen puerto y bosques de calidad para nuestros capitanes. Dejarlo abandonado o sólo parcialmente colonizado sería un desperdicio. Toda Fenicia será fuertemente poblada por nuestro pueblo, las familias serán trasladadas aquí con promesas de riqueza. Construiremos un mundo nuevo aquí sobre las cenizas y los huesos de nuestros enemigos. SEA ALABADO SARDO."
 
 me_nuragic_02_inv_57_title:0 "$nuragic_mission_02_inv_task_57$"
 me_nuragic_02_inv_57_desc:0 "No te mantendremos mucho tiempo, oh [ROOT.GetCountry.GetRuler.GetName], pero querrás saber que nuestra última colonia ha sido construida, esta vez en la ciudad de [GetProvince('(int32)660').GetName].\n\n[GetProvince('(int32)660').GetName] ha sido ampliada para hacer espacio para los colonos, y las monedas [ROOT.GetCountry.GetAdjective] se están gastando libremente en los mercados - en general, un trabajo bien hecho."
 me_nuragic_02_inv_57.a:0 "Muy bien, gracias... ahora, ¿qué estaba haciendo?"
 me_nuragic_02_inv_57_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_57$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_58_title:0 "$nuragic_mission_02_inv_task_58$"
 me_nuragic_02_inv_58_desc:0 "Si el signo de la veracidad de una religión es si sus dioses han abandonado a los fieles en su hora de necesidad, entonces, por todos los informes, los dioses del #E Levante#! han huido ante la ira de Sardo, que no reconoce otra autoridad divina más que la suya.\n\nLos templos en esta tierra abandonada por los dioses estaban llenos de plata y oro, que hemos liberado y puesto en nuestras arcas."
 me_nuragic_02_inv_58.a:0 "Nuestros dioses nos han dado tus posesiones más preciadas - te abandonaron"
 me_nuragic_02_inv_58_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_58$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_59_title:0 "$nuragic_mission_02_inv_task_59$"
 me_nuragic_02_inv_59_desc:0 "Hace mucho tiempo, los #E Egipcios#! fueron capaces de repeler las invasiones de los Pueblos del Mar mejor que nadie, y se han estado felicitando desde entonces.\n\n'Que se alimenten de cuentos de gloria perdida.' [ROOT.GetCountry.GetRuler.GetName] ha sido conocido por decir a los cercanos a [ROOT.GetCountry.GetRuler.GetHerHim]. 'Pronto, los recuerdos serán todo lo que tendrán para consolarlos.'"
 me_nuragic_02_inv_59.a:0 "¡No caeremos esta vez!"
 me_nuragic_02_inv_59_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_59$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_60_title:0 "$nuragic_mission_02_inv_task_60$"
 me_nuragic_02_inv_60_desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha reunido nuestras fuerzas fuera de [GetProvince('(int32)516').GetName] para presenciar un espectáculo que no se había visto en la memoria reciente; la coronación de un nuevo #E faraón#!.\n\nHabiendo aplastado cualquier resistencia nativa al gobierno [ROOT.GetCountry.GetRuler.GetHerHis], [ROOT.GetCountry.GetRuler.GetFirstName] ha logrado la venganza definitiva contra los egipcios de antaño al apoderarse de su corona y sus títulos. Mientras el nuevo faraón desfila ante las tropas [ROOT.GetCountry.GetRuler.GetHerHis], los hombres de [ROOT.GetCountry.GetName] gritan hasta quedarse roncos, golpeando sus lanzas contra sus escudos y llenando el desierto con el clamor de la batalla."
 me_nuragic_02_inv_60.a:0 "Este es el orden natural de las cosas... ¡ahora inclínense ante su Faraón!"
 me_nuragic_02_inv_60_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_60$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_61_title:0 "$nuragic_mission_02_inv_task_61$"
 me_nuragic_02_inv_61_desc:0 "Por fin, [ROOT.GetCountry.GetRuler.GetName] ha logrado lo que [ROOT.GetCountry.GetRuler.GetSheHe] se propuso hace mucho tiempo: nada menos que el establecimiento de una nueva Dinastía, que gobernará sobre el nuevo Imperio creado por el pueblo [ROOT.GetCountry.GetAdjective].\n\nEn toda nuestra vasta nación, desde las calles bordeadas de mármol de [ROOT.GetCountry.GetCapital.GetName] hasta las humildes chozas y fogatas de los bárbaros bajo nuestro estandarte, nuestra gente celebra este momento, secándose las lágrimas de felicidad. Se están llevando a cabo celebraciones religiosas improvisadas en todas partes, y los dioses del panteón Nurágico sonríen a su amada."
 me_nuragic_02_inv_61.a:0 "¡Viva [ROOT.GetCountry.GetRuler.GetName]! ¡Viva [ROOT.GetCountry.GetName]!"
 me_nuragic_02_inv_61_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_61$#!' $mission_completed_tooltip_2$"
 
 me_nuragic_02_inv_610_title:0 "$nuragic_mission_02_inv_task_61$"
 me_nuragic_02_inv_610_desc:0 "Se plantea una cuestión de identidad, no de territorio, sino de nombre. Un nombre que soporte el peso de nuestra historia, que lleve la voz de nuestros antepasados ​​y que presagie el curso de nuestro futuro.\n\nCuatro nombres tenemos ante nosotros:\n\n[ROOT.GetCountry.GetName]: el nombre que ahora llevamos. Habla de nuestras raíces como marinos, comerciantes y guerreros unidos por aguas en lugar de muros. Un nombre de diplomacia y propósito compartido. ¿Pero todavía captura nuestro espíritu ahora que la marea cambia a nuestro favor?\n\nConfederación Sarda: un nombre más cercano al corazón. No nos une al mar, sino a nosotros mismos. Declara que es el pueblo, los sardanos, el que está en el centro de nuestro reino, unido en consejo y causa.\n\nImperio sardano: un nombre audaz. Un nombre de fuerza. Ya no es sólo una confederación de ciudades y tribus libres, sino un imperio que surge de las cenizas de la ocupación y la división. Un nombre para aquellos que creen que nuestro destino no sólo consiste en defender lo que tenemos, sino también en reclamar lo que se perdió.\n\nTyrsenia: un nombre que se remonta a la leyenda. Es el nombre que una vez nos llamó el mundo: los Tyrsenoi, la gente del mar, los constructores de torres, el trueno del bronce en tierras extranjeras. Elegir esto es aceptar plenamente nuestro legado y exigir una vez más nuestro lugar entre las grandes potencias del mundo.\n\n¿Cómo se llamará esta tierra?"
 me_nuragic_02_inv_610.a:0 "Mantendremos nuestro nombre actual."
 me_nuragic_02_inv_610.b:0 "¡Que así sea, Confederación Sardana!"
 me_nuragic_02_inv_610.c:0 "Ahora somos un Imperio, el Imperio Sardán."
 me_nuragic_02_inv_610.d:0 "Nos llamaremos Tyrsenia, la Tierra de las Torres."
 me_nuragic_02_inv_610_tooltip.a:0 "El país mantendrá su nombre actual."
 me_nuragic_02_inv_610_tooltip.b:0 "El país cambiará de nombre a Confederación Sardan"
 me_nuragic_02_inv_610_tooltip.c:0 "El país cambiará de nombre a Imperio Sardán"
 me_nuragic_02_inv_610_tooltip.d:0 "El país cambiará de nombre a Tyrsenia"

 me_nuragic_02_inv_62_title:0 "$nuragic_mission_02_inv_task_62$"
 me_nuragic_02_inv_62_desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha declarado claramente que, de una forma u otra, toda #E Hellas#! pertenecerá al pueblo [ROOT.GetCountry.GetAdjective], y ninguna fuerza en la Tierra será capaz de detener esto."
 me_nuragic_02_inv_62.a:0 "Marca mis palabras, porque estas cosas sucederán"
 me_nuragic_02_inv_62_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_62$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_63_title:0 "$nuragic_mission_02_inv_task_63$"
 me_nuragic_02_inv_63_desc:0 "Habiendo quebrantado la voluntad de los orgullosos #E Lacedemonios#!, [ROOT.GetCountry.GetRuler.GetName] no ha sido amable con los sometidos, sino que ha obligado a los crueles espartanos a trabajar en las enormes granjas que se han construido en la provincia de [GetProvince('(int32)430').GetName].\n\nYa no vivirán a su antojo, sino que sus días se dedicarán a secarse el sudor de la frente mientras labran la dura arcilla de Grecia."
 me_nuragic_02_inv_63.a:0 "Que los espartanos se unan a sus 'Helotas' en los campos"
 me_nuragic_02_inv_63_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_63$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_64_title:0 "$nuragic_mission_02_inv_task_64$"
 me_nuragic_02_inv_64_desc:0 "Mientras nuestras fuerzas continúan abriéndose camino a través de Grecia, se preparan nuevas reclamaciones contra los territorios de los #E Macedonios#! así como los #E Tracios#! - parece que [ROOT.GetCountry.GetRuler.GetName] no descansará hasta que todos los que puedan resistir a los ejércitos de [ROOT.GetCountry.GetName] hayan sido eliminados de los campos de batalla."
 me_nuragic_02_inv_64.a:0 "No permitiré que haya 'Sucesores' merodeando, esperando apuñalarme por la espalda..."
 me_nuragic_02_inv_64_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_64$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_65_title:0 "$nuragic_mission_02_inv_task_65$"
 me_nuragic_02_inv_65_desc:0 "¡Hagan sonar los cuernos de guerra y preparen el estandarte [ROOT.GetCountry.GetAdjective], porque nuestras indomables tropas serán enviadas a las lejanas costas de #E Asia#!. ¡Muestren a los lugareños ninguna piedad, hombres de [ROOT.GetCountry.GetName]! ¡No hay victoria aquí a menos que sea total! ¡Dejen ningún sobreviviente y tomen todo para la gloria de Sardo!"
 me_nuragic_02_inv_65.a:0 "¡Desaten una lluvia de flechas cuando dé la orden!"
 me_nuragic_02_inv_65_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_65$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_66_title:0 "$nuragic_mission_02_inv_task_66$"
 me_nuragic_02_inv_66_desc:0 "Hemos recibido noticias de nuestros generales de que sus campañas en el #E Helesponto#! han llegado casi a su fin, con solo algunas levies dispersas restantes por eliminar.\n\nNuestros hombres escalaron las murallas de las ciudades de nuestros enemigos y pelearon casa por casa para hacer posibles estas victorias. Nuestra victoria total nunca estuvo en duda, y ya hay barcos llenos de colonos navegando hacia [GetProvince('(int32)1453').GetName]."
 me_nuragic_02_inv_66.a:0 "Realmente, nuestros soldados son los más feroces del mundo entero"
 me_nuragic_02_inv_66_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_66$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_67_title:0 "$nuragic_mission_02_inv_task_67$"
 me_nuragic_02_inv_67_desc:0 "Aunque las noticias de nuestros triunfos en el extranjero llegan constantemente a [ROOT.GetCountry.GetCapital.GetName], [ROOT.GetCountry.GetRuler.GetName] celebra cada pieza de correspondencia que [ROOT.GetCountry.GetRuler.GetSheHe] recibe de nuestros generales y administradores.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] ha estado siguiendo el progreso de nuestros esfuerzos de colonización en #E Calcidica#! y ha estado consistentemente complacido con el ritmo. Los lugareños eran sospechosos de nuestros colonos al principio, pero una vez que se dieron cuenta de que nuestra gente planeaba quedarse permanentemente, aceptaron a regañadientes la situación."
 me_nuragic_02_inv_67.a:0 "Quizás un día, visitaré estas colonias en persona"
 me_nuragic_02_inv_67_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_67$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_68_title:0 "$nuragic_mission_02_inv_task_68$"
 me_nuragic_02_inv_68_desc:0 "Las historias de nuestros marineros [ROOT.GetCountry.GetAdjective] nunca dejan de asombrar a [ROOT.GetCountry.GetRuler.GetName], quien se deleita escuchando las aventuras de nuestros marinos. Afortunadamente para nuestro [ROOT.GetCountry.GetRulerTitle], nunca falta noticias emocionantes, y las historias de nuestras hazañas audaces siempre sacan una sonrisa en el rostro de [ROOT.GetCountry.GetRuler.GetFirstName].\n\nÚltimamente, las hazañas de uno de nuestros capitanes, un hombre llamado [SCOPE.sCharacter('ampsicora_nuragic_chad').GetName], han captado la atención de [ROOT.GetCountry.GetRuler.GetFirstName]. [SCOPE.sCharacter('ampsicora_nuragic_chad').GetFirstName] es uno de los terratenientes más ricos de #E Cerdeña#!, y junto con su hijo, [SCOPE.sCharacter('hiostus_nuragic_chad').GetName], ambos utilizan sus fortunas para luchar por la gloria de [ROOT.GetCountry.GetName].\n\nTanto [SCOPE.sCharacter('ampsicora_nuragic_chad').GetFirstName] como [SCOPE.sCharacter('hiostus_nuragic_chad').GetFirstName] fueron de los primeros comerciantes en establecerse en [GetProvince('(int32)1453').GetName], y con buena razón: han usado sus considerables recursos financieros para levantar una #E Legión Bizantina#! en la ciudad, compuesta por los mejores mercenarios de Europa y Asia.\n\nEs la esperanza de la casa [SCOPE.sCharacter('ampsicora_nuragic_chad').GetFamilyDisplayAdjective] que se les permita liderar la invasión del norte: han hecho votos para tomar [GetProvince('(int32)4539').GetName] para la gloria de nuestro pueblo."
 me_nuragic_02_inv_68.a:0 "Voy a mantener un ojo en estos dos, ya que parecen ambiciosos..."
 me_nuragic_02_inv_68_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_68$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_69_title:0 "$nuragic_mission_02_inv_task_69$"
 me_nuragic_02_inv_69_desc:0 "Habiendo ganado una gran parte de la Península Ibérica para [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetName] ha aceptado el título de #E Rey de los Ibéricos#! de las tribus recientemente conquistadas, que miran a [ROOT.GetCountry.GetRuler.GetFirstName] con admiración desnuda en sus ojos. Nuestros tribus ibéricas no tienen deseos de deshacerse de nuestro yugo, sino de aprender todo lo que puedan de nosotros: sin duda, serán súbditos excepcionales."
 me_nuragic_02_inv_69.a:0 "Este será el comienzo de una larga 'asociación'..."
 me_nuragic_02_inv_69_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_69$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_70_title:0 "$nuragic_mission_02_inv_task_70$"
 me_nuragic_02_inv_70_desc:0 "Ahora que la región de #E Numidia#! está firmemente bajo control, no se ha perdido tiempo en asegurar sus caballos para nuestras tropas. La próxima vez que nuestras levies vayan a la guerra, estarán acompañadas por los Auxiliares Numidios.\n\nComo [ROOT.GetCountry.GetRuler.GetName] ha hecho esto personalmente, los ciudadanos de [ROOT.GetCountry.GetName] están honrando a la familia [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] por regalar a la nación con un gobernante tan estimado."
 me_nuragic_02_inv_70.a:0 "Me haces un gran honor con esto... gracias"
 me_nuragic_02_inv_70_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_70$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_71_title:0 "$nuragic_mission_02_inv_task_71$"
 me_nuragic_02_inv_71_desc:0 "[ROOT.GetCountry.GetRuler.GetName] regresaba a [ROOT.GetCountry.GetRuler.GetHerHis] habitación personal después de una celebración estruendosa que se llevó a cabo en [ROOT.GetCountry.GetCapital.GetName], ligeramente borracho pero en un estado extático. A lo largo de la ciudad, incluso a esta hora tardía, los sonidos de cantos resonaban por las calles mientras todos conmemoraban el establecimiento del [ROOT.GetCountry.GetName] - verdaderamente, este día será recordado por nuestro pueblo para siempre.\n\nTropezando por los pasillos y silbando una alegre melodía nurágica, [ROOT.GetCountry.GetRuler.GetFirstName] apenas notó la figura anciana que esperaba en el oscuro pasillo. Antes de que [ROOT.GetCountry.GetRuler.GetFirstName] pudiera emitir un sonido, la persona salió de las sombras, llevando un fardo de trapos. Incluso en estado de embriaguez, [ROOT.GetCountry.GetRuler.GetFirstName] podía notar por la actitud y vestimenta del personaje que [ROOT.GetCountry.GetRuler.GetSheHe] estaba frente a un #E Anciano Tribal#!, y el piadoso [ROOT.GetCountry.GetRulerTitle] inclinó [ROOT.GetCountry.GetRuler.GetHerHis] cabeza en respeto.\n\n'Los dioses están contigo, Hijo de Fórcos.' Tosió ásperamente, el anciano dio un paso adelante, presionando el paquete en las manos de [ROOT.GetCountry.GetRuler.GetFirstName]. 'Recibe esto, y sabe que Sardo guiará tu mano y tu corazón.'\n\nMomentos después, el Anciano desapareció en la noche, dejando al asombrado [ROOT.GetCountry.GetRulerTitle] sosteniendo una espada legendaria y un antiguo diadema."
 me_nuragic_02_inv_71.a:0 "Yo... No puedo creer esto. ¿Mis ojos me engañan?"
 me_nuragic_02_inv_71_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_71$#!' $mission_completed_tooltip_2$\n#E Nuestro Rey ahora llevará la #! #Y Corona de Forcos.#!\n"

 me_nuragic_02_inv_72_title:0 "$nuragic_mission_02_inv_task_72$"
 me_nuragic_02_inv_72_desc:0 "Cualquier barco que salga de su puerto natal sabe que los mares pertenecen a [ROOT.GetCountry.GetName] - todos los demás rivales han visto sus trirremes enviados al fondo del océano, e incluso los piratas saben que es mejor no atacar ningún barco que ondee una bandera [ROOT.GetCountry.GetAdjective].\n\nUna nueva era de paz y prosperidad se ha asentado sobre el mar, donde el comercio florece y la gente puede viajar sin temer por sus vidas."
 me_nuragic_02_inv_72.a:0 "Los dioses nos han bendecido más de lo que nunca sabremos"
 me_nuragic_02_inv_72_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_72$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_73_title:0 "$nuragic_mission_02_inv_task_73$"
 me_nuragic_02_inv_73_desc:0 "Cuando nuestros arquitectos e ingenieros decidieron que se debía construir una magnífica nueva estructura en [ROOT.GetCountry.GetCapital.GetName], todos sabían lo que sería sin necesidad de decirlo; [ROOT.GetCountry.GetRuler.GetName] no se conformaría con nada menos que un #E Gran Nurac#!, uno que se eleva por encima de todos los demás en #E Cerdeña#!.\n\nUna vez que se completó la construcción, se decía que el Nurac podía verse desde tan lejos como [GetProvince('(int32)127').GetName]. Muchos viajeros están ahora visitando la isla con la esperanza de ver esta maravilla por sí mismos."
 me_nuragic_02_inv_73.a:0 "Que los dioses se complacean con este regalo que he erigido"
 me_nuragic_02_inv_73_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_73$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_74_title:0 "$nuragic_mission_02_inv_task_74$"
 me_nuragic_02_inv_74_desc:0 "Antes de que el sol hubiera salido sobre las murallas de [GetProvince('(int32)2325').GetName], nuestros barcos de guerra habían navegado hasta su puerto. Nuestro ataque contra los Massalios llegó sin advertencia, y mientras se activaban las alarmas en toda su ciudad, sus aterrorizados soldados tomaron posiciones defensivas y rogaron por alivio, pero todos sabían que su hora de perdición estaba cerca."
 me_nuragic_02_inv_74.a:0 "Los dioses te han abandonado - solo la Muerte te espera"
 me_nuragic_02_inv_74_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_74$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_75_title:0 "$nuragic_mission_02_inv_task_75$"
 me_nuragic_02_inv_75_desc:0 "Ahora que [GetProvince('(int32)2325').GetName] ondea la bandera de [ROOT.GetCountry.GetName] desde su ciudadela, ¿qué queda para detener a las fuerzas [ROOT.GetCountry.GetAdjective] de invadir el resto de #E Galia#!?\n\n[ROOT.GetCountry.GetRuler.GetName] ha comentado sarcásticamente sobre la situación, afirmando 'Las tribus galas pensaban que los griegos eran invasores, pero nunca se dieron cuenta de que eran una puerta cerrada que mantenía a otros afuera. Pero ahora?'"
 me_nuragic_02_inv_75.a:0 "La puerta a la Galia está bien abierta..."
 me_nuragic_02_inv_75_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_75$#!' $mission_completed_tooltip_2$"

 me_nuragic_02_inv_76_title:0 "$nuragic_mission_02_inv_task_76$"
 me_nuragic_02_inv_76_desc:0 "Las visiones divinamente inspiradas de [ROOT.GetCountry.GetRuler.GetName] se han hecho realidad, y el destino de la humillada ciudad de [GetProvince('(int32)3256').GetName] está en la palma del [ROOT.GetCountry.GetRulerTitle], quien decidirá qué sucederá con esta ciudad de los orgullosos cartagineses de una vez por todas.\n\nNinguna cantidad de súplicas o ruegos ha suavizado el corazón de [ROOT.GetCountry.GetRuler.GetFirstName], quien solo tiene que pensar en los muchos crímenes cometidos por Cartago contra los [ROOT.GetCountry.GetRuler.GetHerHis] compatriotas [ROOT.GetCountry.GetAdjective] - esto nunca deja de hacer que [ROOT.GetCountry.GetRuler.GetHerHis] sangre hierva.\n\nPero ahora... ¿qué se hará con [GetProvince('(int32)3256').GetName]?"
 me_nuragic_02_inv_76.a:0 "Construiremos una colonia sobre sus ruinas."
 me_nuragic_02_inv_76_tooltip.a:0 "Qart Hadasht ya no existe; construiremos una poderosa colonia sobre las ruinas y huesos de nuestros enemigos."
 me_nuragic_02_inv_76.b:0 "Nadie recordará esa maldita tierra."
 me_nuragic_02_inv_76_tooltip.b:0 "No hay peor destino que ser olvidado, y nadie volverá a pronunciar el nombre de Qart Hadasht jamás."
# Preserved Spanish-only entries
 ISLAND_EMPIRE_NAME: "Tirsenia"
 ISLAND_EMPIRE_ADJECTIVE: "Tirsenio"
 blood_of_forcos: "Sangre de Fórcos"
 blood_of_forcos_desc: "Fórcos fue una vez un gobernante de Cerdeña y Córcega; aniquilado en una batalla naval en el Mar Tirreno y luego abatido por el Rey Atlas con gran parte de su ejército, sus compañeros lo imaginaron transformado en una deidad marina. Largamente creído perdido, su linaje ha regresado de la sombra del tiempo. \n\n#G Este rasgo será heredado por los descendientes de [CHARACTER.GetPraenomen].#!"
