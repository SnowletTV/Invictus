 me_parthia.345.t:0 "$parthia_missions_142$"
 me_parthia.345.desc:0 "Bajo el vasto cielo cubierto de estrellas, dos seguidores zoroastrianos, Kian y Mitra, hablaban en voz baja de su fe. \"En verdad, Ahura Mazda es el Señor Sabio\", reflexionó Kian, \"Su orden es evidente en el cambio de las estaciones y en las estrellas inquebrantables\". Mitra asintió y agregó: \"Y Su sabiduría nos guía a través de cada elección, iluminando el camino de la rectitud contra las sombras del engaño\"."
 me_parthia.345.a:0 "Verdaderamente sus enseñanzas son una fuente de sabiduría para todos."
 me_parthia.346.t:0 "$parthia_missions_143$"
 me_parthia.346.desc:0 "En el bullicioso mercado, un comerciante hizo un juramento sobre #E Mithra, el Yazata de los juramentos#!, con voz clara y resonante. Más tarde, en el tribunal, un juez buscó la guía de #E Rashnu, el Yazata de la Justicia#!, para discernir la verdad en medio de testimonios contradictorios. Ambos entendieron que estos seres divinos mantenían el orden cósmico, asegurando que se cumplieran las promesas y que prevaleciera la justicia en el mundo."
 me_parthia.346.a:0 "La veracidad es una virtud que hay que valorar."
