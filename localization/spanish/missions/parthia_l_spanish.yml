 aaa_pth_gov_ability:0 "#E Progreso de la centralización#!"
 aaa_pth_gov_ability_desc:0 "Progreso de centralización actual: [Player.MakeScope.Var('pth_centralization_progress').GetValue|2|Y]\nEl próximo mes obtendrá: #Y [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('parthia_centr_gain')|2] puntos#!\n [GuiScope.SetRoot( Player.MakeScope ).GetRootScope.GetCountry.Custom('pth_gov_ability_slider_loc')]\n\nFactores que cambian el progreso de centralización mensualmente:\n #R -0,02#! para cada normal Marcha;\n #R -0,01#! para cada Marcha Dinástica;\n #R -0,05#! para la ley: #E Servicio Militar#!;\n #Y +0,01#! para cada punto de Estabilidad superior 50;\n #Y +0,01#! por cada punto de delicadeza de Artabid ajustado por habilidad política;\n #Y +0,05#! para las leyes: #E Estatuto de la Divinidad#!, #E Poder de Majestad#!, #E Rey de Reyes#!.\n\nEsto da como resultado una @enact_law_cost_modifier! #E #G Promulgar una reducción de costos de ley#!#! de #E #Y [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('pth_centralization_progress_svalue')|2]%#!#!.\n(0% con 100% de centralización, 50% con 0% de centralización)"
 
# Tooltips
 pth_centralize_gui_tt:0 "Actualmente tienes: #Y [Player.MakeScope.Var('pth_centralization_progress').GetValue|2] Progreso de centralización.#!\nEl próximo mes ganarás: #Y [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('parthia_centr_gain')|2] puntos.#!\nFactores que cambian el progreso de centralización mensualmente:\n #R -0.02#! para cada normal Marcha;\n #R -0,01#! para cada Marcha Protegida (por ejemplo, Elymais);\n #R -0,01#! para cada Marcha Dinástica;\n #R -0,05#! para ley: #E Militar Servicio#!;\n #Y +0,01#! por cada punto de Estabilidad superior a 50;\n #Y +0,01#! por cada punto de delicadeza de Artabid ajustado por habilidad política;\n #Y +0,05#! para leyes: #E Estatuto de Divinidad#!, #E Poder de Majestad#!, #E Rey de Reyes#!.\n#G Esto resulta en una @enact_law_cost_modifier! Reducción del costo de promulgar ley del [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('pth_centralization_progress_svalue')|2]%.#!\n(0% con 100% de centralización, 50% con 0% de centralización)"
