 parthia_missions_12a:0 "Reyes Autónomos"
 parthia_missions_12a_DESC:0 "Aunque [ROOT.GetCountry.GetRuler.GetName|Y] no tiene problemas para administrar directamente #E territorios partos#!, [ROOT.GetCountry.GetRulerTitle] reconoce los beneficios de tener #T Reyes Clientes#! gobernando en nombre [ROOT.GetCountry.GetRuler.GetHerHis]. Mientras los tributos fluyan hacia [ROOT.GetCountry.GetCapital.GetName|T] y todos presten atención al llamado a la batalla, entonces el status quo funcionará bastante bien.\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 parthia_missions_12a.tt1:0 "Tenemos al menos 6 #G marzo#! sujetos."
 parthia_missions_12a.tt2:0 "Desbloquearemos una #T Interacción de personajes#!, sobre los respectivos gobernantes, para poner a un miembro de nuestra Dinastía en el trono de las Marcas."

 parthia_missions_13a:0 "Dominio dinástico"
 parthia_missions_13a_DESC:0 "La Casa Gobernante #Y de [Player.MakeScope.GetCountry.GetRuler.GetFamily.GetName]#! no debe contentarse con recibir favores y honores de los conquistados, sino que debe gobernar directamente sobre todos los súbditos que han jurado sumisión: estos son los partos. Camino.\n\n\n\n\n\n\n\n\n\n@persia_mil11!"
 parthia_missions_13a.tt:0 "Todos los #G sujetos de marzo#! tienen un miembro de la [Player.MakeScope.GetCountry.GetRuler.GetFamily.GetName|Y] familia como #T gobernante#!.\nLos faltantes requeridos tienen sus mayúsculas resaltadas."

 parthia_missions_14a:0 "Unidad religiosa"
 parthia_missions_14a_DESC:0 "Es evidente que [ROOT.GetCountry.GetName|G] ha sido bendecido por los dioses, y debido a que le han otorgado a [ROOT.GetCountry.GetRuler.GetName|Y] dominio sobre el mundo, el todopoderoso [ROOT.GetCountry.GetRulerTitle] ha decidido que debemos volver nuestro rostro hacia lo divino. Ya no podemos tolerar ninguna disensión religiosa entre nosotros, sino que debemos adorar con la misma voz como uno solo.\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 parthia_missions_14a.tt1:0 "Todos los #G marzo#! sujetos tienen un [GetBuilding('temple_building').GetName|G] en cualquier ciudad, si se puede construir para ellos.\nLos faltantes requeridos tienen sus capitales resaltadas."
 parthia_missions_14a.tt2:0 "Todas las #G Marchas#! se convertirán a nuestra religión. Ganaremos #Y 1 Inversión Provincia Libre#! por cada uno."

 parthia_missions_15a:0 "Unidad Cultural"
 parthia_missions_15a_DESC:0 "Nuestros súbditos no tienen otra opción: deben abrazar nuestra cultura #G parta#! superior y adoptar nuestras costumbres. [ROOT.GetCountry.GetRuler.GetName|Y] ha pedido que se imponga la unidad cultural en todas las tierras que [ROOT.GetCountry.GetRuler.GetSheHe] gobierna, y las #G Marchas#! de [ROOT.GetCountry.GetName|G] no tienen más remedio que cumplir.\n\n\n\n\n\n\n\n\n\n@persia_mil16!"
 parthia_missions_15a.tt1:0 "Todos los #G marzo#! sujetos tienen un [GetBuilding('theathre_building').GetName|G] en cualquier ciudad, si se puede construir para ellos.\nLos faltantes requeridos tienen sus capitales resaltadas."
 parthia_missions_15a.tt2:0 "Todas las #G Marchas#! cambiarán su cultura a [Player.MakeScope.GetCountry.GetPrimaryCulture.GetName|G]."

 parthia_missions_16a:0 "Centralizar el reino"
 parthia_missions_16a_DESC:0 "Aunque el sistema #Y Dastgerd#! nos ha funcionado bien en años anteriores, hay problemas con este concepto que deben abordarse. Nuestras #G Marchas#! se han vuelto demasiado poderosas por derecho propio y sus poderes deben ser restringidos.\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 parthia_missions_16a.tt1:0 "Tenemos #Y 100#! Progreso de centralización (actualmente: [Player.MakeScope.Var('pth_centralization_progress').GetValue|2|Y])."
 parthia_missions_16a.tt2:0 "#G Reformaremos#! el sistema #Y Dastgerd#!, lo que nos permitirá funcionar como cualquier otro país centralizado, poseyendo directamente toda nuestra tierra. Podemos librar una #R Guerra Civil#! para reformarnos o #Y Negociar#! con nuestros #T Patrimonios#!."

 parthia_missions_17a:0 "Expandir el reino"
 parthia_missions_17a_DESC:0 "Nuestra [ROOT.GetCountry.GetRulerTitle] ha enviado mensajes tranquilizando a nuestras #G Marchas#! de nuestros compromisos con ellas; sus alegrías son nuestras alegrías, sus tristezas son nuestras tristezas, y sus reclamos son nuestros reclamos...\n\n\n\n\n\n\n\n\n\n@persia_mil4!"
 parthia_missions_17a.tt1:0 "Ningún #G marzo#! tiene una #T lealtad#! inferior a #R 90#!."
 parthia_missions_17a.tt2:0 "Tenemos al menos #Y 25#! Progreso de centralización (actualmente: [Player.MakeScope.Var('pth_centralization_progress').GetValue|2|Y])."
 parthia_missions_17a.tt3:0 "¡Desbloquearemos una #T Decisión#! que nos permitirá #R Reclamar Áreas#! que bordean nuestras #G Marchas#!!"

 parthia_missions_18a:0 "Cuestión de atropateno de los medios"
 parthia_missions_18a_DESC:0 "Nuestra mera reputación podría ser suficiente para persuadir a [GetCountry('MAP').GetName|G] de aceptar el estatus de nuestra #G Marcha#!; la elección depende de ellos. Si quieren ver al #G ejército parto#! en acción, entonces pueden rechazar las propuestas de [ROOT.GetCountry.GetRuler.GetName|Y].\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
 parthia_missions_18a.tt:0 "Si aceptan, se convertirán en nuestra #G Marcha#! y adicionalmente obtendremos [GetModifier('parthian_atropatene').GetName|Y], que otorgará [GetModifier('parthian_atropatene').GetDesc] por #T 20 años#!."
 parthia_missions_send_ultimatum_tt:0 "Enviaremos un ultimátum exigiendo su sumisión.\nLas posibilidades de aceptación dependen de su opinión sobre nosotros.\n\n"

 parthia_missions_19a:0 "Exigir la fidelidad de Adiabene"
 parthia_missions_19a_DESC:0 "Ha llegado el momento de extender a [GetCountry('ADI').GetName|G] la misma cortesía que han recibido muchos otros Reyes y Generales; la oportunidad de vivir segura y libremente como una #G Marcha#! de [ROOT.GetCountry.GetName|G].\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 parthia_missions_19a.tt:0 "Si aceptan, se convertirán en nuestra #G Marcha#! y ganaremos [GetModifier('parthian_adiabene').GetName|Y], que otorgará [GetModifier('parthian_adiabene').GetDesc] por #T 20 años#!."

 parthia_missions_20a:0 "Valles caucásicos"
 parthia_missions_20a_DESC:0 "Mientras nuestros ejércitos continúan avanzando hacia la región montañosa del #T Cáucaso#!, [ROOT.GetCountry.GetRuler.GetName|Y] ha enviado una carta a [GetCountry('IBR').GetRuler.GetName|Y], ofreciendo a los íberos la oportunidad de deponer sus armas pacíficamente y someterse a la hegemonía de [ROOT.GetCountry.GetName|G]. Si rechazan esta generosa oferta, entonces podrán mirar las tierras de sus vecinos conquistados y ser testigos de lo que les espera.\n\n\n\n\n\n\n\n\n\n@persia_mil14!"
 parthia_missions_20a.tt1:0 "Si aceptan, se convertirán en nuestra #G Marcha#! y ganaremos [GetModifier('parthian_iberia').GetName|Y], que otorgará [GetModifier('parthian_iberia').GetDesc] por #T 20 años#!."
 parthia_missions_20a.tt2:0 "#E Recibiremos reclamaciones sobre el resto de la región del #T Cáucaso#!.#!"

 parthia_missions_21a:0 "Socavar Armenia"
 parthia_missions_21a.tt:0 "Desbloquearemos decisiones para influir en #G Sophene#! y #G Corduene#! en nuestra esfera de influencia, dándoles la bienvenida como nuestras #G Marchas#!."
 parthia_missions_21a_DESC:0 "El [GetCountry('ARM').GetRuler.GetName|Y] jactancioso se imagina [GetCountry('ARM').GetRuler.GetHerHim] un verdadero [GetCountry('ARM').GetRulerTitle], ejerciendo influencia sobre [GetCountry('ARM').GetRuler.GetHerHim] sujetos y desfilando [GetCountry('ARM').GetCapital.GetName|T] como un tonto. [ROOT.GetCountry.GetRuler.GetName|Y] está listo para demostrarle a este pretendiente cómo es la verdadera autoridad...\n\n\n\n\n\n\n\n\n\n@persia_mil9!"

 parthia_missions_22a:0 "Subyugar a Armenia"
 parthia_missions_22a_DESC:0 "Después de soportar años de una coexistencia incómoda, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido que ha llegado el momento de subyugar a [GetCountry('ARM').GetName|G] de una vez por todas. Como cortesía hacia un colega gobernante, [ROOT.GetCountry.GetRuler.GetFirstName] le pedirá a [GetCountry('ARM').GetRuler.GetName|Y] que deponga las armas [GetCountry('ARM').GetRuler.GetHerHis] pacíficamente.\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 parthia_missions_22a.tt:0 "Si aceptan, se convertirán en nuestra #G Marcha#! y ganaremos [GetModifier('parthian_armenia').GetName|Y] que otorgará [GetModifier('parthian_armenia').GetDesc] por #T 20 años#!."

 parthia_missions_23:0 "Conquistar los medios"
 parthia_missions_23_DESC:0 "La reputación de los famosos #G medos#! es conocida por todos, pero un antiguo pedigrí no será suficiente para salvar a sus ciudades de los ejércitos de [ROOT.GetCountry.GetRuler.GetName|Y] y del poder ascendente de [ROOT.GetCountry.GetName|G].\n\n\n\n\n\n\n\n\n\n@persia_mil21!"
 parthia_owns_50_percent_media_tt:0 "Debemos poseer al menos #Y 50%#! de la región de #T Medios#!."

 parthia_missions_24:0 "Conquistar Persia"
 parthia_missions_24_DESC:0 "Las ciudades y fortalezas de los #G persas#! caerán en manos de nuestros ejércitos, al igual que todos los demás que se opusieron a nosotros. [ROOT.GetCountry.GetRuler.GetName|Y] ha prometido no mostrar piedad a #G Persis#!, pero los derrotará y anexará sus provincias a [ROOT.GetCountry.GetName|G].\n\n\n\n\n\n\n\n\n\n@persia_mil12!"
 parthia_owns_50_percent_persia_tt:0 "Debemos poseer al menos #T 50%#! de la región de #G Persis#!, ya sea directamente o teniendo el #E #Y Xsayathiya#!#! de #E #G Persis#!#! como nuestro sujeto."

 parthia_missions_25:0 "Conquistar a Ariana"
 parthia_missions_25_DESC:0 "El terreno desolado, casi todo cubierto de desiertos; la región de Ariana. A pesar de ser muy pobre, se pueden encontrar algunas fuentes de riqueza. Por ejemplo, en su frontera sur, junto al mar, viven personas famosas por pescar perlas. Como tal, a pesar de ser la tumba de gran parte del ejército del gran Alejandro, aún puede resultar una valiosa adición a nuestro reino. No importa el hecho de que India con todas sus riquezas está más allá.\n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 parthia_owns_50_percent_ariana_tt:0 "Debemos poseer al menos el #Y 50%#! de la región de #T Ariana#!, ya sea directamente o a través de sujetos."

 parthia_missions_26:0 "Puertas de la India"
 parthia_missions_26_DESC:0 "Hemos conquistado los pasos terrestres hacia la #COLOR:{0.83,0.53,0.3} India#!, prácticamente asegurando que podemos invadir los territorios orientales con impunidad.\n\n\n\n\n\n\n\n\n\n@india_mil4!"

 parthia_missions_27:0 "Descendientes de Sargón"
 parthia_missions_27_DESC:0 "Los ríos Éufrates y Tigris aportan una riqueza increíble a las tierras de Mesopotamia. Como tal, este fue el hogar de los estados más fuertes del mundo desde tiempos inmemoriales. Quizás el primer rey de todos los tiempos, #E Sargón el Grande#!, nació aquí y creó el primer reino destacado del que se habla hasta el día de hoy. Es justo que sigamos con esas ambiciones y, con suerte, nosotros también hablaremos mientras viva la humanidad.\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 parthia_owns_70_percent_mesopotamia_tt:0 "Debemos poseer al menos el #Y 70%#! de la región de #T Mesopotamia#!, ya sea directamente o a través de súbditos."

 parthia_missions_28:0 "Autoridad mediana"
 parthia_missions_28_DESC:0 "$parthia_missions_23_DESC$"

 parthia_missions_29:0 "Inclinación de Armenia"
 parthia_missions_29_DESC:0 "$parthia_missions_22a_DESC$"

 parthia_missions_30:0 "Ruinas asirias"
 parthia_missions_30_DESC:0 "Si bien la gloria de los #G asirios#! hace tiempo que se alejó de la mente de los hombres, su antiguo reino se extiende ante nosotros. [ROOT.GetCountry.GetRuler.GetName|Y].\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 parthia_missions_30.tt:0 "Recibiremos reclamaciones sobre el resto de la #E [GetProvince('(int32)880').GetArea.GetRegion.GetName|G] Región#!."

 parthia_missions_31:0 "Romper los restos griegos"
 parthia_missions_31_DESC:0 "Hemos logrado grandes avances para asegurar la #T Meseta iraní#! para [ROOT.GetCountry.GetName|G], pero todavía hay focos de resistencia que aún no reconocen el gobierno de [ROOT.GetCountry.GetRuler.GetName|Y]]. ¡Ha llegado el momento de expulsar a estos intrusos y poner fin a la presencia #G helénica#! en nuestras tierras!\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 parthia_missions_31.tt1:0 "Debemos #R inspirar la deslealtad#! del #G gobernador seléucida#! de [GetProvince('(int32)1595').GetArea.GetRegion.GetName|T], [GetProvince('(int32)4799').GetArea.GetRegion.GetName|T] o [GetProvince('(int32)6552').GetArea.GetRegion.GetName|T]."
 parthia_missions_31.tt2:0 "Lo que queda del control #G seléucida#! de la #T meseta iraní#! se debilitará enormemente, lo que tal vez nos permita atraer a sus gobernadores de todo el #Y Zagros#!."

 parthia_missions_32:0 "Acuerdo con los griegos"
 parthia_missions_32_DESC:0 "En lugar de librar guerras innecesarias contra los [GetCountry('SEL').GetName|G], [ROOT.GetCountry.GetRuler.GetName|Y] cree que el curso de acción más inteligente implica hacer las paces con los helénicos... porque ahora.\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 parthia_missions_32.tt:0 "Los #G Seléucidas#! nos cederán todo lo que está al este del #Y Éufrates#! y le darán a nuestro gobernante una novia seléucida."

 parthia_missions_33:0 "Imperio parto"
 parthia_missions_33_DESC:0 "Hemos derribado a aquellos que fueron lo suficientemente tontos como para interponerse en nuestro camino, y los dioses de la guerra han bendecido a los ejércitos de [ROOT.GetCountry.GetRuler.GetName|Y] con innumerables victorias. Sin rivales reales que amenacen nuestro poder, el dios viviente [ROOT.GetCountry.GetRuler.GetFirstName] ha declarado que de ahora en adelante seremos conocidos como los #E #R partos. Imperio#!#!.\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 parthia_missions_33.tt1:0 "Tenemos #T 100 Centralización#! Progreso (Actualmente: [Player.MakeScope.Var('pth_centralization_progress').GetValue|2])."
 parthia_missions_33.tt2:0 "No tenemos ningún sujeto #G Satrapía#!."
# parthia_missions_33.tt3:0 ""
 parthia_missions_33.tt4:0 "Si tenemos un modificador [GetModifier('decentralized_administration').GetName|Y], entonces lo perderemos y durante 20 años ganaremos un modificador de país [GetModifier('pth_centralization_effort').GetName|Y] que otorga: [GetModifier('pth_centralization_effort').GetDesc]."

 parthia_missions_34:0 "Tarea vacía, ¿TODO?"
 parthia_missions_34_DESC:0 ""

 parthia_missions_35:0 "Avance hacia Anatolia"
 parthia_missions_35_DESC:0 "Nuestros ejércitos avanzan hacia el oeste, dispersando a nuestros patéticos enemigos como moscas mientras avanzan hacia #G Anatolia#!. Envalentonado por la falta de resistencia real a nuestra invasión, [ROOT.GetCountry.GetRuler.GetName|Y] ha hecho saber que las levas de [ROOT.GetCountry.GetName|G] algún día conquistarán todo península.\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 parthia_missions_35.tt1:0 "Somos propietarios de al menos el #T 75%#! de la región resaltada."
 parthia_missions_35.tt2:0 "Recibiremos reclamaciones sobre el interior de #G Anatolia#!."

 parthia_missions_36:0 "Rompiendo el interior"
 parthia_missions_36_DESC:0 "La victoria total es casi nuestra, pero no podemos reducir el ritmo ni ceder: debemos seguir ejerciendo presión sobre nuestros enemigos. El interior de #G Anatolia#! es casi nuestro, y las aguas del #Y Mare Aegaeum#! nos llaman como las famosas sirenas de los cuentos populares del #G Helenos#!.\n\n\n\n\n\n\n\n\n\n@celt_mil19!"
 parthia_missions_36.tt1:0 "Somos propietarios de al menos el #T 75%#! de la región resaltada."
 parthia_missions_36.tt2:0 "Recibiremos reclamaciones en las costas occidentales de #G Anatolia#!."

 parthia_missions_37:0 "Llegando al mar"
 parthia_missions_37_DESC:0 "Por fin, la costa #G asiática#! es nuestra: hemos dominado #G Anatolia#! y la hemos convertido en más provincias de la inigualable [ROOT.GetCountry.GetName|G]. Con las numerosas ciudades portuarias de Asia firmemente controladas, [ROOT.GetCountry.GetRuler.GetName|Y] ha pedido la construcción de una #Y Armada Mediterránea#!, que protegerá nuestros intereses en el oeste aguas.\n\n\n\n\n\n\n\n\n\n@greek_mil21!"
 parthia_missions_37.tt1:0 "Somos propietarios de al menos el #T 75%#! de la región resaltada."
 parthia_missions_37.tt2:0 "Obtendremos reclamaciones sobre la #G costa occidental del Egeo#!#!.\nCada provincia costera en [GetProvince('(int32)278').GetArea.GetRegion.GetName] obtendrá [GetModifier('pth_asia_ships_pmod').GetName|Y] que otorgará [GetModifier('pth_asia_ships_pmod').GetDesc] por #T 10 años#!."

 parthia_missions_38:0 "Pivote Sur"
 parthia_missions_38_DESC:0 "Hay muchas ciudades ricas en [GetProvince('(int32)790').GetArea.GetRegion.GetName|T] por las que se han peleado muchas grandes potencias, y ahora es nuestro turno de tomar estos territorios para [ROOT.GetCountry.GetName|G].\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 parthia_missions_38.tt:0 "Recibiremos reclamaciones en la región #E [GetProvince('(int32)790').GetArea.GetRegion.GetName|T]#!."

 parthia_missions_39:0 "Expandirse a Siria"
 parthia_missions_39_DESC:0 "En su eterna sabiduría, parece que los dioses han considerado [ROOT.GetCountry.GetRuler.GetName|Y] digno de gobernar toda la Tierra: nuestro [ROOT.GetCountry.GetRulerTitle] ha instado a nuestros ejércitos a marchar hacia el sur, hacia [GetProvince('(int32)687').GetArea.GetRegion.GetName|T], una tierra fértil donde se puede encontrar leche @cattle! y miel @honey!. Abundancia.\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 parthia_missions_39.tt1:0 "Somos propietarios de al menos el #T 75%#! de la región resaltada."
 parthia_missions_39.tt2:0 "Nos subiremos a la Región #E [GetProvince('(int32)687').GetArea.GetRegion.GetName|T]#!."

 parthia_missions_40:0 "Conquistar Canaán"
 parthia_missions_40_DESC:0 "La misteriosa #T 'Tierra de las Pirámides'#! se encuentra justo más allá de nuestras fronteras, y [ROOT.GetCountry.GetRuler.GetName|Y], sintiendo un momento del destino, ha ordenado a las [ROOT.GetCountry.GetAdjective] recaudaciones que se preparen para una gloriosa batalla.\n\n\n\n\n\n\n\n\n\n@egypt_mil1!"
 parthia_missions_40.tt1:0 "Hemos estacionado al menos #Y 2 ejércitos#! de al menos #T 40 unidades#! en la región #T [GetProvince('(int32)687').GetArea.GetRegion.GetName]#!."
 parthia_missions_40.tt2:0 "Recibiremos reclamaciones sobre el #G Delta del Nilo#!."

 parthia_missions_41:0 "Preparación india"
 parthia_missions_41_DESC:0 "[ROOT.GetCountry.GetRuler.GetName|Y] ha dicho a nuestros generales que preparen a las tropas para una invasión del #COLOR:{0.83,0.53,0.3} subcontinente indio#!, y nuestros guerreros están desesperados por tener la oportunidad de saquear y atacar a sus ricos. Ciudades.\n\n\n\n\n\n\n\n\n\n@india_mil19!"
 parthia_missions_41.tt1:0 "Hemos estacionado al menos #Y 3 ejércitos#! de al menos #T 40 unidades en provincias#! adyacentes a las provincias resaltadas."
 parthia_missions_41.tt2:0 "Recibiremos reclamaciones sobre la región resaltada."

 parthia_missions_42:0 "Conquista del Indo"
 parthia_missions_42_DESC:0 "Nuestras fuerzas triunfantes han seguido el sinuoso #Y río Indo#! hacia el sur, expulsando a las guarniciones enemigas de las fortalezas que inútilmente intentan bloquear nuestro progreso.\n\n\n\n\n\n\n\n\n\n@india_mil21!"
 parthia_missions_42.tt1:0 "Somos propietarios de al menos el #T 75%#! de la región resaltada."
 parthia_missions_42.tt2:0 "Recibiremos reclamaciones en la región #E [GetProvince('(int32)4429').GetArea.GetRegion.GetName|T]#!."

 parthia_missions_43:0 "Al otro mar"
 parthia_missions_43_DESC:0 "[ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName|Y] gobierna un #T Imperio#! que se extiende por continentes, pero el ambicioso guerrero ha puesto [ROOT.GetCountry.GetRuler.GetHerHis] sus ojos en el #Y Sinus. Gangético#!.\n\n\n\n\n\n\n\n\n\n@india_mil23!"
 parthia_missions_43.tt1:0 "Somos propietarios de al menos el #T 75%#! de la región resaltada."
 parthia_missions_43.tt2:0 "Recibiremos reclamaciones en la región #E [GetProvince('(int32)4440').GetArea.GetRegion.GetName|T]#!."

 parthia_missions_44:0 "Múdate a Bactria"
 parthia_missions_44_DESC:0 "Se sabe que los territorios alguna vez administrados por [GetCountry('BAC').GetName] se consideran las puertas de entrada a la estepa, y al controlar este pasaje vital, nuestras fuerzas tendrán un acceso más fácil a las tierras tradicionales de nuestra antepasados.\n\n\n\n\n\n\n\n\n\n@persia_mil20!"
 parthia_missions_44.tt1:0 "Somos propietarios de al menos el #T 75%#! de la región resaltada."
 parthia_missions_44.tt2:0 "Recibiremos más reclamos en la #T Estepa#!."

 parthia_missions_45:0 "Conquistar la estepa"
 parthia_missions_45_DESC:0 "Ahora que hemos conquistado las potencias civilizadas que amenazaban nuestra hegemonía, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido que es hora de invadir la #T Estepa#! y someterla para siempre. [ROOT.GetCountry.GetName|G].\n\n\n\n\n\n\n\n\n\n@persia_mil12!"
 parthia_missions_45.tt1:0 "Somos propietarios de al menos el #T 75%#! de la región resaltada."
 parthia_missions_45.tt2:0 "Recibiremos reclamaciones para la región #T Cuenca del Tarim#!."

 parthia_missions_46:0 "Cuenca del Tarim"
 parthia_missions_46_DESC:0 "Los oasis y ciudades diseminados por la #T Cuenca del Tarim#! son nodos importantes para controlar el comercio con el Lejano Oriente, y a [ROOT.GetCountry.GetName|G] le vendría bien gobernar este importante territorio. Directamente.\n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 parthia_missions_46.tt1:0 "Somos propietarios completos de la región #T Cuenca del Tarim#!."
 parthia_missions_46.tt2:0 "Tendremos la opción de publicar #G Tocharia#! como una #G Marcha#!, con un modificador de país adjunto para asegurar nuestros vínculos comerciales con #T China#!."

 parthia_missions_47:0 "Tarea vacía, ¿TODO?"
 parthia_missions_47_DESC:0 ""

 parthia_missions_48:0 "Grandes casas"
 parthia_missions_48_DESC:0 "Algunas de nuestras principales familias nobles provienen de tribus y clanes extranjeros, y aunque sus antepasados pueden estar enterrados en tierras lejanas desconocidas para nuestros Mayores, estos extraños se han unido junto a nuestros parientes con la esperanza de un futuro mejor para ellos. [ROOT.GetCountry.GetRuler.GetName|Y] ha proclamado que ahora somos un solo pueblo, los #G partos#!: debemos dejar de lado nuestras pequeñas diferencias y unirnos por el bien mayor. Bueno.\n\n\n\n\n\n\n\n\n\n@persia_mil16!"
 parthia_missions_48.tt:0 "Los miembros de nuestras #T Grandes Familias#! cambiarán la cultura a [GetCulture('parthian').GetName|G], y las familias cambiarán sus nombres para reflejar mejor esto."

 parthia_missions_49:0 "Idioma administrativo"
 parthia_missions_49_DESC:0 "Nuestros países de origen se encuentran en la encrucijada de culturas, donde comerciantes y comerciantes de los cuatro rincones de la Tierra hablan media docena de lenguas. Para agilizar la administración de nuestro reino, [ROOT.GetCountry.GetRuler.GetName|Y] ha ordenado a [ROOT.GetCountry.GetRuler.GetHerHis] [GetOffice('office_steward').GetCulturalName(SCOPE.GetRootScope.GetCountry)|T] que revise nuestro sistema administrativo y elija un funcionario. Idioma.\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 parthia_missions_49.tt1:0 "Nuestro #E [GetOffice('office_steward').GetCulturalName(SCOPE.GetRootScope.GetCountry)|T]#! tiene una habilidad de delicadeza @civic_icon! #G ajustada al arte de gobernar de #E 8#!#! o más (actualmente: #Y [SCOPE.ScriptValue('parthia_steward_effective_skill')|0]#!)."
 parthia_missions_49.tt2:0 "Podremos elegir el idioma administrativo de nuestro reino, acompañado del modificador de país."

 parthia_missions_50:0 "Convocar Magastan"
 parthia_missions_50_DESC:0 "Ahora que ha llegado un raro período de paz a lo largo de [ROOT.GetCountry.GetName|G], [ROOT.GetCountry.GetRuler.GetName|Y] ha aceptado finalmente hacer algo que [ROOT.GetCountry.GetRuler.GetSheHe] ha estado posponiendo durante bastante tiempo; convocar al #T Magastan#! y escuchar las peticiones de algunos de los principales ciudadanos de [ROOT.GetCountry.GetCapital.GetName|T].\n\n\n\n\n\n\n\n\n\n@italic_mil5!"
 parthia_missions_50.tt:0 "Conseguiremos eventos para tratar con nuestro tribunal y escuchar sus quejas."

 parthia_missions_51:0 "Oficina de Spahbed"
 parthia_missions_51_DESC:0 "Hay muchos roles prestigiosos dentro de la burocracia [ROOT.GetCountry.GetAdjective], pero pocos tienen el prestigio que tiene [GetOffice('office_master_of_the_guard').GetCulturalName(SCOPE.GetRootScope.GetCountry)|Y]. Recibir este título como favor hereditario es la máxima señal del placer de [ROOT.GetCountry.GetRulerTitle], y muchas de las #T Grandes Familias#! que viven en [ROOT.GetCountry.GetCapital.GetName|T] están compitiendo por esto. Honor.\n\n\n\n\n\n\n\n\n\n@celt_mil18!"
 parthia_missions_51.tt1:0 "Nuestro #E [GetOffice('office_master_of_the_guard').GetCulturalName(SCOPE.GetRootScope.GetCountry)|Y]#! tiene una habilidad marcial @military_icon! #R ajustada al arte de gobernar de #E 8#!#! o más (Actualmente: #Y [SCOPE.ScriptValue('parthia_spahbed_effective_skill')|0]#!)"
 parthia_missions_51.tt2:0 "Tendremos la opción de asignar el cargo de #E [GetOffice('office_master_of_the_guard').GetCulturalName(SCOPE.GetRootScope.GetCountry)|Y]#! como hereditario a una #T Gran Familia#!.\nEsto hará que los miembros de su familia ganen 5 @military_icon! #R Habilidad marcial#! al ocupar este cargo, pero hará que todos los demás pierdan 5 habilidades marciales en este post.\nNombrar a otra persona para este puesto también dañará en gran medida la lealtad de otros miembros de esta familia."

 parthia_missions_52:0 "Camellos para trenes de suministros"
 parthia_missions_52_DESC:0 "Conocido como el robusto \"barco del desierto\", el camello @camels! se ha convertido rápidamente en una parte integral de las caravanas terrestres que serpentean por las regiones montañosas que entran y salen de [ROOT.GetCountry.GetCapital.GetName|T]. Debido a que hemos llegado a depender de estas bestias para nuestro comercio, hay llamados para que [ROOT.GetCountry.GetRuler.GetName|Y] haga lo que [ROOT.GetCountry.GetRuler.GetSheHe] pueda para recaudar más animales.\n\n\n\n\n\n\n\n\n\n@egypt_mil8!"
 parthia_missions_52.tt:0 "Producimos al menos #T 15 camellos#! @camels! en nuestro territorio o en nuestras #G Marcas#!. Solo contará el segundo o posterior bien comercial #T Camel#! producido en un territorio (actualmente: [SCOPE.ScriptValue('parthia_camel_production')|0|Y])."

 parthia_missions_53:0 "Caballos Niseanos"
 parthia_missions_53_DESC:0 "Muchas de nuestras victorias en la guerra se pueden atribuir a nuestra caballería superior: se sabe que la mera visión de #G partos#! #Y arqueros a caballo#!@horse_archers! llegando al campo de batalla dispersa las fuerzas enemigas incluso antes de que comience el combate, ya que muchos de nuestros enemigos luchan por defenderse de nuestras tácticas esteparias. Para asegurar nuestra supremacía en el futuro, [ROOT.GetCountry.GetRuler.GetName|Y] ha pedido a nuestros granjeros que críen tantos sementales @horses! como sea posible.\n\n\n\n\n\n\n\n\n\n@india_mil18!"
 parthia_missions_53.tt1:0 "Producimos al menos #T 15#! Caballos @horses! en nuestro territorio o en nuestras #G Marcas#!. Solo contará el segundo o posterior bien comercial #T Caballo#! producido en un territorio (Actualmente: #Y [SCOPE.ScriptValue('parthia_horse_production')|0]#!)."
 parthia_missions_53.tt2:0 "Cualquier jefe de familia, aparte de nuestro gobernante, tiene al menos #T 6#! territorios de producción de caballos como #T explotaciones#!."
 parthia_missions_53.tt3:0 "Podremos elegir entre @horse_archers! #Y Arqueros a Caballo#!, @heavy_cavalry! #Y Caballería Pesada#! o un modificador de combate de unidad @light_cavalry! #Y Caballería Ligera#!."

 parthia_missions_54:0 "Realizar censo"
 parthia_missions_54_DESC:0 "Las guerras de [ROOT.GetCountry.GetRuler.GetName|Y] han traído a muchas personas a nuestro reino, y el [ROOT.GetCountry.GetRulerTitle] triunfante ha pedido que se lleve a cabo un #T censo#! en todo [ROOT.GetCountry.GetName|G] con la esperanza de contar una cifra exacta. Número.\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 parthia_missions_54.tt:0 "Encontraremos #T 80 Slave#! @slaves! pops en nuestra tierra de culturas y costumbres locales."

 parthia_missions_55:0 "Sistema de documentación"
 parthia_missions_55_DESC:0 "En un esfuerzo por aumentar la erudición de las ciudades de [ROOT.GetCountry.GetName|G], [ROOT.GetCountry.GetRuler.GetName|Y] ha instituido un nuevo #T Sistema de documentación#! que promete revisar nuestros métodos actuales de investigación.\n\n\n\n\n\n\n\n\n\n@india_mil17!"
# parthia_missions_55.tt:0 ""

 parthia_missions_56:0 "Qanats"
 parthia_missions_56_DESC:0 "Los inteligentes #G arquitectos iraníes#! que viven en el desierto han aprendido a construir impresionantes acueductos conocidos como #T 'Qanats'#!, y [ROOT.GetCountry.GetRuler.GetName|Y] han ordenado que esta tecnología se utilice en las regiones áridas de [ROOT.GetCountry.GetName|G].\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 parthia_missions_56.tt:0 "Nuestras ciudades actuales y futuras en #T Terreno desértico#! recibirán un modificador que niega casi por completo la penalización del terreno desértico a #T Capacidad de población#!."

 parthia_missions_57:0 "Alta alfabetización"
 parthia_missions_57_DESC:0 "La marca de una sociedad civilizada es una alta tasa de alfabetización, y [ROOT.GetCountry.GetRuler.GetName|Y] ha alentado a las clases nobles a dominar las importantes habilidades de lectura y escritura.\n\n\n\n\n\n\n\n\n\n@india_mil17!"

 parthia_missions_58:0 "ariana agua"
 parthia_missions_58_DESC:0 "Mientras que algunas personas perciben la árida región de [GetProvince('(int32)6561').GetArea.GetRegion.GetName|T] como inadecuada para la habitación humana, [ROOT.GetCountry.GetRuler.GetName|Y] está dispuesta a invertir los recursos de [ROOT.GetCountry.GetName|G] en transformar las polvorientas colinas en un lugar productivo. Provincia.\n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 parthia_missions_58.tt1:0 "Todos los territorios en las áreas [GetProvince('(int32)6561').GetArea.GetName|T], [GetProvince('(int32)6605').GetArea.GetName|T] y [GetProvince('(int32)6560').GetArea.GetName|T] tienen un [GetBuilding('basic_settlement_infratructure_building').GetName|G]."
 parthia_missions_58.tt2:0 "Cualquier provincia en las áreas anteriores es una #T Ciudad#! con al menos #T 3#! #E #G [GetBuilding('aqueduct_building').GetName]#!#!."
 parthia_missions_58.tt3:0 "Todos nuestros territorios en las áreas [GetProvince('(int32)6561').GetArea.GetName|T], [GetProvince('(int32)6605').GetArea.GetName|T] y [GetProvince('(int32)6560').GetArea.GetName|T] obtendrán el modificador [GetModifier('pth_fertile_sakastan_pmod').GetName|Y], que otorgará [GetModifier('pth_fertile_sakastan_pmod').GetDesc]."

 parthia_missions_59:0 "Capitales reales"
 parthia_missions_59_DESC:0 "Un reino que es tan poderoso y prestigioso como el nuestro necesita múltiples capitales para satisfacer las necesidades de nuestra creciente burocracia. Necesitamos una sede de poder para que reine la #Y Casa de [ROOT.GetCountry.GetRuler.GetFamily.GetName]#!, una capital que atienda nuestras @religious_icon! necesidades religiosas y ceremoniales, y una que sea responsable de mantener el #T Palacio Real. Tesorería#!.\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 parthia_missions_59.tt1:0 "3 territorios de propiedad en 3 regiones diferentes tienen 3 [GetBuilding('academy_building').GetName|T] edificios, más de #T 8 nobles#! @nobles! y más de #T 50 habitantes#!."
 parthia_missions_59.tt2:0 "Podremos elegir un lugar para nuestra capital, nuestra capital ceremonial y nuestra capital del tesoro, cada una con sus correspondientes modificadores de territorio."

 parthia_missions_60:0 "Símbolo de poder"
 parthia_missions_60_DESC:0 "[ROOT.GetCountry.GetRuler.GetName|Y] actualmente disfruta de la mayoría de los atributos del poder real: mando incuestionable sobre un poderoso ejército, control absoluto sobre las [ROOT.GetCountry.GetAdjective] tesorerías y el respeto y el amor de la gente común, pero [ROOT.GetCountry.GetRulerTitle] desea tener un signo tangible de autoridad [ROOT.GetCountry.GetRuler.GetHerHis] y ha pedido a nuestros artesanos que elaboren una obra maestra para la #Y Casa de [ROOT.GetCountry.GetRuler.GetFamily.GetName]#!.\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 parthia_missions_60.tt:0 "Crearemos un poderoso #T Tesoro#!, eligiendo entre diferentes insignias para nuestro Gobernante."

 parthia_missions_61:0 "Cuartel General Imperial"
 parthia_missions_61_DESC:0 "A medida que el poder y el prestigio de [ROOT.GetCountry.GetName|G] crecen precipitadamente bajo el liderazgo dinámico de los #E #Y [ROOT.GetCountry.GetRuler.GetFamily.GetName]#!#!, hay llamados a establecer [ROOT.GetCountry.GetCapital.GetName|T], la joya de nuestro dominio, como #T oficial Imperial. Sede central#!.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"

 parthia_missions_62:0 "arcas llenas"
 parthia_missions_62_DESC:0 "Gracias a las tesorerías llenas, [ROOT.GetCountry.GetRuler.GetName|Y] puede financiar proyectos de infraestructura a gran escala en [ROOT.GetCountry.GetName|G] sin preocuparse por quedarse sin recursos. Dinero.\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 parthia_missions_63:0 "Conectar caminos"
 parthia_missions_63_DESC:0 "El #T Camino Real#! de los #G Aqueménidas#! que se extiende desde el #Y Mediterráneo#! llega a su fin en territorios que controlamos, y el ambicioso [ROOT.GetCountry.GetRuler.GetName|Y], siempre deseoso de dejar un legado permanente para la gente de [ROOT.GetCountry.GetName|G], ha anhelado construir una carretera que conecte este antiguo sistema de carreteras con los encontrados. En #COLOR:{0.83,0.53,0.3} India#!.\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 parthia_missions_63.tt:0 "Construiremos una carretera en territorios destacados, conectando las #T autopistas del Mediterráneo#! con las redes de carreteras de #COLOR:{0.83,0.53,0.3} India#!."

 parthia_missions_64:0 "Libertades mercantiles"
 parthia_missions_64_DESC:0 "Mientras que algunos gobernantes simplemente toleran la presencia de comerciantes ambulantes dentro de sus fronteras, [ROOT.GetCountry.GetRuler.GetName|Y] los ha aceptado, dándoles ciertas libertades dentro de #G partos#! sociedad.\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 parthia_missions_64.tt1:0 "Cualquier ciudad, aparte de nuestra capital, necesita tener #T 3#! [GetBuilding('commerce_building').GetName|G] edificios."
 parthia_missions_64.tt2:0 "Podremos fundar un sujeto #T League City#! sin la invención requerida."

 parthia_missions_65:0 "Bazares partos"
 parthia_missions_65_DESC:0 "Nuestros mercados son fuentes famosas de telas @cloth! y otros textiles finos, con comerciantes que vienen de todas partes a nuestros bazares para adquirir nuestros lujosos tejidos.\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 parthia_missions_65.tt:0 "Al menos #T 4 ciudades#! tienen #T 3#! [GetBuilding('commerce_building').GetName|G] edificios (actualmente: [SCOPE.ScriptValue('parthia_mission_65_buildings')|0|Y])."

 parthia_missions_66:0 "Desarrollar el campo"
 parthia_missions_66_DESC:0 "Aunque [ROOT.GetCountry.GetRuler.GetName|Y] ha gastado generosamente en las ciudades y templos de [ROOT.GetCountry.GetName|G], [ROOT.GetCountry.GetRuler.GetSheHe] no ha descuidado el campo, sino que ha invertido sabiamente en sus tierras de cultivo.\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 parthia_missions_66.tt:0 "Nosotros (incluidas nuestras #G Marchas#!) tenemos #T 25#! [GetBuilding('basic_settlement_infratructure_building').GetName|G] edificios (Actualmente: [SCOPE.ScriptValue('parthia_mission_66_buildings')|0|Y])."

 parthia_missions_67:0 "Telas coloridas"
 parthia_missions_67_DESC:0 "Los tintes @dye! que producimos en [ROOT.GetCountry.GetName|G] son una valiosa fuente de ingresos para nuestra gente y, sin embargo, podemos hacer aún más para aumentar su producción. ¡Debemos poner a trabajar a nuestros esclavos!\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 parthia_missions_67.tt1:0 "Producimos al menos #T 8 tintes#!@dye! (Actualmente: [SCOPE.ScriptValue('parthia_dye_production')|0|Y])."
 parthia_missions_67.tt2:0 "Cada #T ciudad productora de tinte#! obtendrá un modificador [GetModifier('pth_rug_producer').GetName|Y] que otorgará [GetModifier('pth_rug_producer').GetDesc] durante #T 20 años#!."

 parthia_missions_68:0 "Ampliar la producción de alfombras"
 parthia_missions_68_DESC:0 "Uno de los artículos más valiosos que exportamos al exterior es la #T Alfombra#! @leather!, y el emprendedor [ROOT.GetCountry.GetRuler.GetName|Y] está interesado en ampliar nuestra producción de este tan deseado bien comercial.\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 parthia_missions_68.tt1:0 "Nosotros (incluidas nuestras #G Marchas#!) tenemos al menos #T 10 ciudades#! #R que no producen#! @dye! #Y Tinte#!, @cloth! #Y Tela#! o @silk! #Y Silk#!, con al menos #T 1#! [GetBuilding('commerce_building').GetName|G] edificio (Actualmente: [SCOPE.ScriptValue('parthia_cities_68')|0|Y])."
 parthia_missions_68.tt2:0 "Cualquier ciudad elegible tendrá un #T 50%#! de posibilidades de cambiar su bien comercial producido a @cloth! #Y Tela#!, #T 25%#! a @dye! #Y Tinte#! y un #T 25%#! de posibilidades de conservar su bien actual."

 parthia_missions_69:0 "Ir por la ruta de la seda"
 parthia_missions_69_DESC:0 "Los comerciantes que llegan a [ROOT.GetCountry.GetCapital.GetName|T] han hablado a [ROOT.GetCountry.GetRuler.GetName|Y] sobre un poderoso reino que se encuentra muy al este, en el borde mismo del mundo conocido, y [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] desea ver este exótico reino por [ROOT.GetCountry.GetRuler.GetHerHim] self.\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 parthia_missions_69.tt:0 "#Y Esto iniciará una cadena de eventos#!."

 parthia_missions_70:0 ""
 parthia_missions_70_DESC:0 ""

 parthia_missions_71:0 "Sedas iraníes"
 parthia_missions_71_DESC:0 "Quizás el más raro de todos los textiles sea la seda @silk!, y una prenda hecha con esta tela de gasa puede alcanzar un precio deslumbrante en los mercados y bazares de [ROOT.GetCountry.GetName|G]. Aunque la mejor seda se fabrica muy al este, [ROOT.GetCountry.GetRuler.GetName|Y] ha tomado medidas para aumentar la producción de seda dentro de nuestras fronteras.\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 parthia_missions_71.tt1:0 "Producimos al menos #T 7#! @silk! #E Seda#! (Actualmente: [SCOPE.ScriptValue('parthia_silk_production')|0|Y])."
 parthia_missions_71.tt2:0 "Cada #T ciudad productora de seda#! @silk! obtendrá un modificador [GetModifier('pth_rug_producer').GetName|Y] que otorgará [GetModifier('pth_rug_producer').GetDesc] durante #T 20 años#!."

 parthia_missions_72:0 "Alfombras y ropa persas"
 parthia_missions_72_DESC:0 "Si bien hay muchos productos comerciales producidos en [ROOT.GetCountry.GetName|G] que son mundialmente conocidos, existe una manía absoluta por la ropa #G persa#! que fabricamos: difícilmente podemos seguir el ritmo demanda.\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 parthia_missions_72.tt1:0 "Nosotros (incluidas nuestras #G Marchas#!) producimos al menos #T 30#! @dye! #Y Tinte#!, @cloth! #Y Tela#! o @silk! #Y Seda#! excedentes de bienes comerciales. (Actualmente: [SCOPE.ScriptValue('parthia_rug_production')|0|Y])"
 parthia_missions_72.tt2:0 "Todas las ciudades que produzcan #Y Tinte#!, @cloth! #Y Tela#! o @silk! #Y Seda#! obtendrán un modificador [GetModifier('pth_rug_overflow').GetName|Y] que otorgará:\n[GetModifier('pth_rug_overflow').GetDesc] durante #T 40 años#!."

 parthia_missions_73:0 "Patrocinar juglares"
 parthia_missions_73_DESC:0 "[ROOT.GetCountry.GetRuler.GetName|Y] ha decretado que las tesorerías reales ahora patrocinarán a artistas, cantantes y bailarines en [ROOT.GetCountry.GetName|G] en un esfuerzo por difundir #G la cultura y las virtudes partas#! por todo el reino.\n\n\n\n\n\n\n\n\n\n@italic_mil18!"
 parthia_missions_73.tt:0 "Usar la habilidad gubernamental #G Patrocinar las artes#! ahora costará solo #Y 50#! Influencia política#! @political_influence!."

 parthia_missions_74:0 "granero"
 parthia_missions_74_DESC:0 "Las fértiles tierras de cultivo de [GetProvince('(int32)912').GetArea.GetRegion.GetName|T] han sustentado y nutrido a muchas civilizaciones notables durante siglos, y ahora es el momento de que hagan lo mismo por [ROOT.GetCountry.GetName|G].\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 parthia_missions_74.tt1:0 "Nosotros (incluidas nuestras #G Marchas#!) producimos al menos #T 15#! excedentes @grain! #T Cereales#! en [GetProvince('(int32)912').GetArea.GetRegion.GetName|T] (Actualmente: [SCOPE.ScriptValue('parthia_wheat_production')|0|Y])."
 parthia_missions_74.tt2:0 "Todos los territorios productores de cereales elegibles en [GetProvince('(int32)912').GetArea.GetRegion.GetName|T] obtendrán un modificador de territorio [GetModifier('pth_grain_production').GetName|Y] que otorgará [GetModifier('pth_grain_production').GetDesc] durante #Y 30 años#!."

 parthia_missions_75:0 "Dátiles mesopotámicos"
 parthia_missions_75_DESC:0 "¿Existe comida más perfecta que el dátil @dates!? Ya sea que se disfrute fresco o seco, el dulce y suculento dátil ha nutrido a los habitantes de #T Mesopotamia#! durante incontables generaciones. Ahora es el momento de que el fruto de la palmera datilera sostenga las levas partas.\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 parthia_missions_75.tt1:0 "Todos los @dates! #T territorios productores de fechas#! en [GetProvince('(int32)912').GetArea.GetRegion.GetName|T] territorios tienen un edificio [GetBuilding('basic_settlement_infratructure_building').GetName|Y]."
# parthia_missions_75.tt2:0 ""

 parthia_missions_76:0 "Sal de Chehrabad"
 parthia_missions_76_DESC:0 "Las @salt! minas de sal cercanas a [GetProvince('(int32)3384').GetName|T] están demostrando ser algunas de las más productivas de todo [ROOT.GetCountry.GetName|T], y [ROOT.GetCountry.GetRuler.GetName|Y] exige que se realicen aún más inversiones en el región.\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"

 parthia_missions_77:0 "Vino persa"
 parthia_missions_77_DESC:0 "Hay mucha gente que cree erróneamente que los mejores vinos @wine! del mundo se encuentran más al oeste, pero esto es porque no han probado el vino elaborado por los #G Persas#!.\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 parthia_missions_77.tt1:0 "Todos los @wine! #Y territorios productores de vino#! en [GetProvince('(int32)4799').GetArea.GetRegion.GetName|T] territorios producen al menos 2 bienes comerciales."
# parthia_missions_77.tt2:0 ""

 parthia_missions_78:0 "Aceitunas medianas"
 parthia_missions_78_DESC:0 "El olivo @olive! ha sido durante mucho tiempo un alimento básico en muchas de las tierras que hemos conquistado, y hay llamados a plantar más olivos en territorios que sean adecuados para su cultivo.\n\n\n\n\n\n\n\n\n\n\n@event_pic8!"
 parthia_missions_78.tt:0 "Tendremos la opción de cambiar los bienes comerciales en los asentamientos en [GetProvince('(int32)4985').GetArea.GetRegion.GetName|T] a @olive! #Y Aceitunas#!."

 parthia_missions_79:0 "Prospección en Zagros"
 parthia_missions_79_DESC:0 "Se cree ampliamente que hay minerales valiosos @iron! y metales @precious_metals! ubicados en las #T Montañas Zagros#!, pero nunca antes se había realizado un estudio adecuado de la zona debido a las dificultades para atravesar el terreno. En un esfuerzo por descubrir si esto es cierto o no, [ROOT.GetCountry.GetRuler.GetName|Y] ha enviado a nuestros ingenieros a las cadenas montañosas con la esperanza de encontrar oro literal.\n\n\n\n\n\n\n\n\n\n@italic_mil32!"
 parthia_missions_79.tt:0 "Tendremos la opción de cambiar los bienes comerciales en territorios alrededor de las #T Montañas Zagros#! a #Y bienes comerciales explotables#!."

 parthia_missions_inp_task:0 "¿Pivotar hacia la India?"
 parthia_missions_inp_task_desc:0 "CORTAR TAREA NO UBICAR"
 parthia_missions_inp_task.tt2:0 "Tenemos una #E marzo#! con capital teniendo 3 [GetBuilding('aqueduct_building').GetName] en [GetProvince('(int32)6552').GetArea.GetRegion.GetName]."
 parthia_missions_inp_task.tt2:0 "Podemos pasar a jugar como nuestra #E Ariana#! Marcha, con el objetivo de formar el #E Reino Indoparto#! y expandirnos a la India."

 ## Religous Sections ##
 parthia_missions_80a:0 "Diferentes puntos de vista"
 parthia_missions_80a_DESC:0 "Nosotros, los #G partos#!, hemos adorado durante mucho tiempo el mundo natural a través de lo que los #G griegos#! llaman la fe #T 'heptádica'#!. Sin embargo, siempre hemos sido un pueblo maleable, que se inclina ante el viento como las altas hierbas de la estepa; No rechazamos ideas extranjeras basadas en prejuicios y nociones preconcebidas, sino que consideramos cuidadosamente cuáles podrían ser los beneficios si adoptamos costumbres extrañas. Demos la bienvenida a personas de notable talento y habilidad: si queremos gobernar a los pueblos sedentarios, debemos ser pragmáticos y flexibles.\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
 #parthia_missions_80a.tt:0 "#BOLD;COLOR:{0.98,0.53,0.98} Mithraic#!, #BOLD;COLOR:{0.07,0.87,0.98} Zoroastrian#! and #BOLD;COLOR:{0.45,0.5,0.98} Hellenic#! scholars of very high skill will join our court!" 
 parthia_missions_80a.tt:0 "#BOLD;COLOR:{0.98,0.53,0.98} Mitraico#!, #BOLD;COLOR:{0.07,0.87,0.98} Zoroastro#!, #BOLD;COLOR:{0.45,0.5,0.98} Helénico#! y #BOLD;COLOR:{0.98,0.93,0.51} Budista#! ¡Eruditos de muy alta habilidad se unirán a nuestra corte!"

 parthia_missions_80:0 "Un panteón parto"
 parthia_missions_80_DESC:0 "Como ahora hemos adquirido ciudades famosas como [ROOT.GetCountry.GetCapital.GetName|T], reevalúemos lo que conocemos como religión; ¿Qué tienen nuestros antiguos enemigos, y ahora súbditos, para ofrecernos en el camino de lo divino?\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 #parthia_missions_80.tt:0 "Our [GetOffice('office_high_priest_monarchy').GetCulturalName(SCOPE.GetRootScope.GetCountry)|T] is either #BOLD;COLOR:{0.98,0.53,0.98} Mithraic#!, #BOLD;COLOR:{0.07,0.87,0.98} Zoroastrian#! or #BOLD;COLOR:{0.45,0.5,0.98} Hellenic#!."
 parthia_missions_80.tt:0 "Nuestro [GetOffice('office_high_priest_monarchy').GetCulturalName(SCOPE.GetRootScope.GetCountry)] es #BOLD;COLOR:{0.98,0.53,0.98} mitraico#!, #BOLD;COLOR:{0.07,0.87,0.98} zoroástrico#!, #BOLD;COLOR:{0.45,0.5,0.98} helénico#! o #BOLD;COLOR:{0.98,0.93,0.51} budista#!."
 #Mithraic

 parthia_missions_81:0 "Mentores medianos"
 parthia_missions_81_DESC:0 "Los #E medos#! son ciertamente un grupo educado, que sirve como columna vertebral de la cabeza #E persa#!. Si bien muchos de los #E medos#! han llegado a adorar al señor #E Ahura Mazda#!, muchos todavía se aferran a la adoración del gran señor de la luz, #E Mitra#!. Aceptar su tutoría sobre la fe de los #E medos#! nos permitirá recurrir de manera eficiente a la riqueza de conocimientos registrados por la gente de #E Dioses#!.\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 parthia_missions_82:0 "Mandatos de Mazdaya"
 parthia_missions_82_DESC:0 "Mientras continuamos el camino de #E Mitra#!, sería completamente tonto por nuestra parte olvidar a los #E persas#! y su fe preferida del #E zoroastrismo#! (Mazdayasna). El Avesta y su calendario, ¡oh, y esos gloriosos templos de fuego! Sí, invirtamos no sólo en la adopción de estas innovaciones, sino también en la perfección de los conceptos.\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 parthia_missions_82.tt:0 "[GetProvince('(int32)4799').GetOwner.GetName] tiene más de 190 opiniones sobre nosotros."
 parthia_missions_83:0 "Codificación del Avesta"
 parthia_missions_83_DESC:0 "La Codificación del Avesta se refiere al proceso de recopilación y escritura de los textos sagrados del zoroastrismo, que originalmente se transmitían de forma oral. Esta empresa crucial, atribuida principalmente al Imperio Sasánida, tenía como objetivo preservar el conocimiento y las tradiciones religiosas en una forma escrita estandarizada.\n\n\n\n\n\n\n\n\n\n@persia_mil16!"
 parthia_missions_84:0 "Calendario de Ahura Mazda"
 parthia_missions_84_DESC:0 "El calendario zoroástrico es un calendario religioso utilizado por los seguidores del zoroastrismo. Es un calendario solar, que normalmente consta de 12 meses de 30 días cada uno, más cinco días adicionales \"Gatha\" al final del año, lo que hace un total de 365 días.\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 parthia_missions_85:0 "El gran templo del fuego"
 parthia_missions_85_DESC:0 "El Gran Templo del Fuego en #T Hagmatana (Ecbatana)#! en Media era un destacado centro religioso para los #G zoroastrianos#! dentro de la antigua capital meda. Su existencia subraya las profundas raíces históricas y la presencia significativa del #G zoroastrismo#! en esta región de la antigua Irán.\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 parthia_missions_86:0 "Maestros Magos Místicos"
 parthia_missions_86_DESC:0 "Quizás la entidad religiosa más grande de todo Irán, los Magos son la clase sacerdotal vinculada a la nobleza meda. Los griegos en particular hablan mucho de estas personas, diciendo que están imbuidas del poder de #E Magikos#!, palabras convincentes y conocimientos de tiempos pasados. Ser condescendiente con esta clase no sólo ganará a muchas personas, sino que también nos permitirá emplear a estos Magos para cuestiones de estabilización y armonización.\n\n\n\n\n\n\n\n\n\n@persia_mil4!"
 parthia_missions_87:0 "Exaltado es Mitra"
 parthia_missions_87_DESC:0 "Mitra, la piedra angular de nuestro panteón, se ha convertido en la deidad preeminente de nosotros #E Partos#!. Debemos asegurarnos de codificar esto en nuestro panteón oficial, para que no molestemos al señor de la luz.\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 parthia_missions_88:0 "Puerta de Mitra"
 parthia_missions_88_DESC:0 "Un Dar-e Mehr significa literalmente Puerta de Mitra, Puerta de Mitra o Patio de Mitra. Representa un templo de fuego dedicado al señor de los juramentos. Debemos establecer mucho Dar-e Mehr para honrar la primera luz.\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
 parthia_missions_89:0 "El dador de la regla"
 parthia_missions_89_DESC:0 "Uno de los epítetos de Mitra, \"el Dador de gobierno\", es muy importante para nosotros. Representa su derecho divino de dar bendiciones a los gobernantes. Debemos demostrar a quienes gobernamos que somos realmente dignos del honor del Dador de la Regla.\n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 parthia_missions_90:0 "El brillante y puro"
 parthia_missions_90_DESC:0 "El dios Apolo, adorado por muchos yauna (griegos), es notablemente similar a Mitra. Comparten iconografía y temas de la luz, el sol y la ley. Quizás sean realmente uno y el mismo, diferente sólo por el nombre que llamamos el Resplandeciente.\n\n\n\n\n\n\n\n\n\n@egypt_mil14!"
 parthia_missions_91:0 "Fuego del Rey de Reyes"
 parthia_missions_91_DESC:0 "Ubicado en el #E titular Arshak#! se encuentra el Gran Incendio de los Arsácidas.\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 parthia_missions_92:0 "Imbuido de Kharenah"
 parthia_missions_92_DESC:0 "Estar imbuido de Kharenah, o Khvarenah, es estar imbuido de gloria y esplendor divinos. El único ser en todo el Universo que puede imbuir a Kharenah es el del gran Mitra. Y por la gracia de su santa luz, nuestro líder, el gran #E Rey de Reyes [ROOT.GetCountry.GetRuler.GetName]#!, ha sido imbuido de esto potencia.\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 parthia_missions_93:0 "Arsaces, El Divino"
 parthia_missions_93_DESC:0 "El fundador de este gran imperio que hemos construido, señor #E Arsaces#!, imbuido de #E Kharenah#!, moldeado por el #E Fuego#!, y brilla como un reflejo de #E Mitra#! ha alcanzado la divinidad en su logros.\n\n\n\n\n\n\n\n\n\n@italic_mil5!"
 parthia_missions_94:0 "El gran templo de Mehri"
 parthia_missions_94_DESC:0 "Durante la época del gobierno #E Atropates#!, Phraata albergaba un gran templo del fuego. Deberíamos ampliar esto para mostrar que la luz de Mitra nunca se desvanecerá donde toca.\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

