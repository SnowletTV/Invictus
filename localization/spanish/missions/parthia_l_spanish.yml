 pth_ability_claim:0 "Reclamar zonas limítrofes"
 pth_ability_claim_desc:0 "A medida que avanzan nuestros esfuerzos de centralización y estabilización interna, debemos considerar la expansión hacia afuera. Nuestras Marchas seguramente pueden resultar útiles para conseguir reclamaciones adyacentes a los confines más lejanos de nuestro Reino."
 pth_ability_claim.tt1:0 "La habilidad no está en tiempo de reutilización (2 años)."
 pth_ability_claim.tt2:0 "Ningún territorio fronterizo con nuestras Marcas ya está reclamado."
 pth_ability_claim.tt3:0 "Obtendremos reclamos sobre áreas no reclamadas actualmente que bordean nuestros temas de marzo."
 add_allowed_region_effect.tt:0 "La región puede ser propiedad directa en lugar de ser propiedad de nuestra Marcha."
