 me_parthia.9900.t:0 "Elija Dastgerd: regiones de propiedad directa"
 me_parthia.9900.desc:0 "Nuestro éxito contra los invasores helénicos tomó incluso a [ROOT.GetCountry.GetRuler.GetName] por sorpresa: a decir verdad, [ROOT.GetCountry.GetRulerTitle] esperaban más del enemigo y se sintieron decepcionados al saber lo débiles que eran.\n\nSin embargo, como nación que recientemente fue una tribu esteparia, no tenemos la capacidad administrativa ni la legitimidad ante los ojos de los lugareños para ser vistos como un imperio adecuado. Como tal, nos vemos obligados a elegir entre tres regiones para poseer directamente, conocidas en nuestro idioma como #E Dastgerds#!, y el resto se publicará como sujetos de #E marzo#!."
 me_parthia.9900.a:0 "Elija [parthia_region_1.GetName]."
 me_parthia.9900.a.tt:0 "#E [GetProvince('(int32)3435').GetArea.GetRegion.GetName] Región#! también incluirá #Y áreas vecinas#! en Ariana."
 me_parthia.9900.b:0 "Elija [parthia_region_2.GetName]."
 me_parthia.9900.b.tt:0 "Anexaremos Marchas no protegidas en esta región."
 me_parthia.9900.c:0 "Elija [parthia_region_3.GetName]."
 me_parthia.9900.d:0 "Elija [parthia_region_4.GetName]."
 me_parthia.9900.e:0 "Elija [parthia_region_5.GetName]."
 me_parthia.9900.f:0 "Elija [parthia_region_6.GetName]."
 me_parthia.9901.t:0 "Elija Dastgerd: regiones de propiedad directa"
 me_parthia.9901.desc:0 "Nuestro éxito contra los invasores helénicos tomó incluso a [ROOT.GetCountry.GetRuler.GetName] por sorpresa: a decir verdad, [ROOT.GetCountry.GetRulerTitle] esperaban más del enemigo y se sintieron decepcionados al saber lo débiles que eran.\n\nSin embargo, como nación que recientemente fue una tribu esteparia, no tenemos la capacidad administrativa ni la legitimidad ante los ojos de los lugareños para ser vistos como un imperio adecuado. Como tal, nos vemos obligados a elegir entre tres regiones para poseer directamente, conocidas en nuestro idioma como #E Dastgerds#!, y el resto se publicará como sujetos de #E marzo#!."
 me_parthia.9901.a:0 "Elija [parthia_region_1a.GetName]."
 me_parthia.9901.b:0 "Elija [parthia_region_2a.GetName]."
 me_parthia.9901.c:0 "Elija [parthia_region_3a.GetName]."
 me_parthia.9901.d:0 "Elija [parthia_region_4a.GetName]."
 me_parthia.9901.e:0 "Elija [parthia_region_5a.GetName]."
 me_parthia.9901.f:0 "Elija [parthia_region_6a.GetName]."

 me_parthia.9903.t:0 "Cambiar Dastgerd"
 me_parthia.9903.desc:0 "Los tiempos cambian, y con ellos nuestras necesidades y oportunidades se nos presentan. Como tal, debemos seguir siendo flexibles y el enfoque de nuestra administración en lo que controlamos directamente debe centrarse en las tierras más útiles y relevantes para nuestros propósitos. A la luz de esto, ¿qué es ahora algo de lo que podemos prescindir y qué es algo que debemos poseer de inmediato?"
 me_parthia.9903.a:0 "Deje [parthia_region_1.GetName] para [march_scope.GetCapital.GetArea.GetRegion.GetName]."
 me_parthia.9903.a.tt:0 "Anexaremos [march_scope.GetName]."
 me_parthia.9903.aa.tt:0 "La evacuación de la #E región de Partia#! también dejará áreas adicionales que obtuvimos para el control directo en el interior de Irán."
 me_parthia.9903.b:0 "Deje [parthia_region_2.GetName] para [march_scope.GetCapital.GetArea.GetRegion.GetName]."
# me_parthia.9903.b.tt:0 ""
 me_parthia.9903.c:0 "Deje [parthia_region_3.GetName] para [march_scope.GetCapital.GetArea.GetRegion.GetName]."
# me_parthia.9903.c.tt:0 ""
 me_parthia.9903.e:0 "Pensándolo bien, tal vez abandone esos planes."
 
 me_parthia.9920.t:0 "Nombrar a Marzban"
 me_parthia.9920.desc:0 "Una de las mejores formas de influir en nuestras Marchas es nombrar a alguien leal para que las gobierne. ¿Y quién mejor para hacerlo que nuestros propios parientes? De ello se deduce que conseguimos que uno de los representantes de la dinastía [ROOT.GetCountry.GetRuler.GetFamily.GetName] ocupe un puesto de poder allí para velar por nuestros intereses."
 me_parthia.9920.a:0 "Debe ser [choose_10.GetName]."
 me_parthia.9920.b:0 "Preferiríamos ver allí [choose_11.GetName]."
 me_parthia.9920.c:0 "[choose_12.GetName] puede velar por nuestros intereses."
 me_parthia.9920.d:0 "[choose_13.GetName] funcionará."
 me_parthia.9920.e:0 "Quizás seamos prematuros con este paso."
 
# Tasks

 parthia_missions:0 "Ascenso de los arsácidas"
 parthia_missions_DESCRIPTION:0 "Las altas hierbas de la estepa se riegan con la sangre de los hombres y caballos muertos, y la tierra tiembla y se estremece con el sonido de nuestra caballería cargando hacia la batalla. Las tribus [ROOT.GetCountry.GetAdjective] han sido unidas por [ROOT.GetCountry.GetRuler.GetName], el atrevido Jefe de los [ROOT.GetCountry.GetName], y los salvajes señores de los caballos, los amos indiscutibles de la estepa, han vuelto sus ojos y atención hacia las ricas tierras del sur. La inestabilidad política entre los sátrapas del [GetCountry('SEL').GetName] ha abierto una pequeña grieta en las defensas del imperio; uno que [ROOT.GetCountry.GetRuler.GetFirstName] espera explotar."
 parthia_missions_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completa cuando hayamos establecido un poderoso #E Imperio Parto#!, uno que haya destruido a todos los que desafiaron su poder tanto en el este como en el oeste, y haya construido la civilización más grande del mundo en el corazón de #E Asia#!."
 parthia_missions_BUTTON_TOOLTIP:0 "Que los dioses nos acompañen en la batalla: ¡nuestro destino es nuestro!"
 parthia_missions_BUTTON_DETAILS: ""

 parthia_missions_1:0 "Encontré a Nisa"
 parthia_missions_1_DESC:0 "[ROOT.GetCountry.GetRuler.GetName|Y] ha estado jugando con la idea de fundar una nueva ciudad que sirva como capital para las tribus [ROOT.GetCountry.GetAdjective|G], y [GetProvince('(int32)6657').GetName|T] es un lugar prometedor.\n\nEl asentamiento está cerca de las puertas de [GetProvince('(int32)5437').GetName|T], lo que permitirá a nuestros ejércitos acceder fácilmente al sur, pero no está tan lejos del estepa.\n\n\n\n\n\n\n\n\n\n@greek_mil1!"

 parthia_missions_2:0 "Conexiones partas"
 parthia_missions_2_DESC:0 "El sátrapa de [GetCountry('PAR').GetName|G] se encuentra entre nuestro reino y el de [GetCountry('SEL').GetName|R] y durante mucho tiempo ha servido como un estado amortiguador entre nosotros, una situación que ha estado bien durante muchos años, pero [ROOT.GetCountry.GetRuler.GetName|Y] desea cambiar esto.\n\nSe han realizado propuestas clandestinas y se han enviado mensajes secretos a [GetCountry('PAR').GetRuler.GetName|Y] con la esperanza de que [GetCountry('PAR').GetRuler.GetSheHe] esté dispuesto a traicionar. [GetCountry('SEL').GetRuler.GetName|Y]...\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 parthia_missions_2.tt:0 "¡Tendremos oportunidades de #R romper#! Partia del [GetCountry('PAR').GetOverlord.GetAdjective] yugo!"

 parthia_missions_3:0 "Aliados escitas"
 parthia_missions_3_DESC:0 "Hay #G tribus escitas#! rodeándonos que nos servirían como buenos aliados en los días venideros. Nos corresponde celebrar tratados con nuestros vecinos, y [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido adoptar una política de coexistencia con nuestros primos migratorios.\n\n\n\n\n\n\n\n\n\n@persia_mil11!"
 parthia_missions_3.tt1:0 "Tenemos una alianza con un país de [GetCultureGroup('scythia').GetName|G] cultura."
 parthia_missions_3.tt2:0 "Al realizar la tarea #T Tomar el control de Partia#!, nuestra tierra fuera de Dahae será cedida a nuestro aliado."
 #parthia_missions_3.tt:0 "All owned areas in [GetProvince('(int32)5454').GetArea.GetRegion.GetName] will become owned by our Scythian ally when we form Parthia."

 parthia_missions_4:0 "Escaramuza bactriana"
 parthia_missions_4_DESC:0 "Las tierras de los #E #G [GetCountry('BAC').GetName] ns#!#! son ricas y están bien defendidas, que es justo el tipo de desafío por el que [ROOT.GetCountry.GetRuler.GetName|Y] vive. El temerario [ROOT.GetCountry.GetRulerTitle] se está preparando para liderar una pequeña banda de guerra en una incursión contra nuestros vecinos con la esperanza de expulsarlos de [GetProvince('(int32)6668').GetName|T].\n\n\n\n\n\n\n\n\n\n@persia_mil12!"
 parthia_missions_4.tt1:0 "Hemos insultado a [GetCountry('BAC').GetName|G]."
 parthia_missions_4.tt2:0 "Comenzaremos una #R Guerra de un año#! solo contra los #E #G [GetCountry('BAC').GetName] ns#!#!.\n\nSi controlamos [GetProvince('(int32)6668').GetName|T] al final del conflicto, tomaremos #E [GetProvince('(int32)6668').GetArea.GetName|T] El área#! y [GetCountry('BAC').GetName|G] declararán su independencia cuando ataquemos a su señor supremo."
 # parthia_missions_4.tt3:0 ""

 parthia_missions_5:0 "Materia Bactriana"
 parthia_missions_5_DESC:0 "Es bien sabido por [ROOT.GetCountry.GetRuler.GetName|Y] que los #E #G [GetCountry('BAC').GetName] ns#!#! son orgullosos y testarudos, fácilmente convencidos de su propio poder y erizados bajo el yugo de su #T Señor Supremo#!, el [GetCountry('SEL').GetName|R].\n\nQuizás nuestros vecinos estarían dispuestos a escuchar lo que propone [ROOT.GetCountry.GetRuler.GetFirstName]...\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 parthia_missions_5.tt1:0 "No hemos intentado atacar [GetCountry('BAC').GetName|G] para [GetProvince('(int32)6668').GetArea.GetName|T] en los últimos 5 años."
 parthia_missions_5.tt2:0 "[GetCountry('BAC').GetName|G] declarará su independencia de [GetCountry('BAC').GetOverlord.GetName|R] cuando hagamos una huelga."

 parthia_missions_6:0 "Tomar el control de Partia"
 parthia_missions_6_DESC:0 "Ahora que hemos expulsado con éxito a los #E griegos#! de sus ciudades montañosas en #E Partia#!, [ROOT.GetCountry.GetRuler.GetName|Y] ha propuesto una gran reorganización de nuestra población.\n\nNuestros parientes y hermanos se verán obligados a trasladarse al sur, apoderándose de los territorios que hemos conquistado a los partos, y abandonaremos el norte. Regiones esteparias a nuestros feudatarios y aliados.\n\n\n\n\n\n\n\n\n\n@persia_mil17!"
 parthia_missions_6.tt1:0 "Somos propietarios de tierras partas iniciales."
 parthia_missions_6.tt2:0 "Hemos formado #COLOR:{0.6,0.13,0.98} Partia#!."
 parthia_missions_6.tt3:0 "La mayoría de nuestros [GetCulture('derbiccan').GetName|G] pops se trasladarán al sur.\nLa tierra alrededor del área [GetProvince('(int32)5456').GetArea.GetName|T] se entregará a un #G Dahae#! vasallo tribal.\nLa tierra más al norte se dividirá en estados basados en áreas."

 parthia_missions_7:0 "Una Partia"
 parthia_missions_7_DESC:0 "[GetProvince('(int32)3434').GetArea.GetName|T], [GetProvince('(int32)6602').GetArea.GetName|T] y [GetProvince('(int32)7223').GetArea.GetName|T] están gobernados por [GetProvince('(int32)3463').GetState.GetGovernorOrRuler.GetName|Y], un hombre que es más leal al dinero que [GetCountry('SEL').GetName|R]. [ROOT.GetCountry.GetRuler.GetName|Y] cree que tenemos buenas posibilidades de persuadir al gobernador para que cambie de lealtad.\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 parthia_missions_7.tt1:0 "Hemos #T Inspirado la deslealtad#! del #G gobernador seléucida#! de #T Partia#!."
 parthia_missions_7.tt2:0 "El control #R Seleukid#! de la región #T Partia#! se verá muy debilitado, lo que nos permitirá quizás #T Atraer#! al gobernador de la región."

 parthia_missions_8:0 "Conquistar A Caballo Es Fácil..."
 parthia_missions_8_DESC:0 "Ahora es el momento de adentrarnos más en la #T Meseta iraní#! con nuestros caballos, pero [ROOT.GetCountry.GetRuler.GetName|Y] tiene que tomar una decisión importante; ¿Deberían los ejércitos de [ROOT.GetCountry.GetName|G] invadir usando el objetivo de guerra especial #E #R Conquista de la Horda#!#!, o deberíamos más bien cortar a nuestros enemigos pieza por pieza con la #E #R Conquista#!#! ¿objetivo de guerra?\n\n#E Dependiendo de nuestra elección, recibiremos diferentes #G Ramificaciones de Conquista Misiones#!#!.\n\n\n\n\n\n\n\n\n\n@persia_mil20!"
 parthia_missions_8.tt1:0 "Somos dueños de las #Gtierras partas#! iniciales."
 parthia_missions_8.tt2:0 "Hemos estacionado al menos #Y 40 unidades#! en una sola provincia en la frontera con [GetCountry('SEL').GetName|R]."
 parthia_missions_8.tt3:0 "¡Vamos a #E #R declarar la guerra#!#! contra [GetCountry('SEL').GetName|Y]!"

 parthia_missions_9:0 "Arshak encontrado"
 parthia_missions_9_DESC:0 "Aunque hay muchas ciudades prósperas dentro de las fronteras de [ROOT.GetCountry.GetName|G], el orgulloso [ROOT.GetCountry.GetRuler.GetName|Y] quiere construir una nueva ciudad que se asociará con #Y [ROOT.GetCountry.GetRuler.GetFamily.GetName] Dinastía#!.\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 parthia_missions_9.tt:0 "¡Podremos trasladar nuestro capital a [GetProvince('(int32)6656').GetName|T]!"

 parthia_missions_10:0 "...Lo difícil es desmontar"
 parthia_missions_10_DESC:0 "Una cosa es conquistar un vasto reino (muchos hombres lo han hecho), pero gobernar a los subyugados y aferrarse a un territorio rebelde es una cuestión completamente diferente. [ROOT.GetCountry.GetRuler.GetName|Y] ha prometido dejar [ROOT.GetCountry.GetRuler.GetHerHis] marca en la historia, y esto incluye ser conocido como un sabio administrador de la tierra.\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 parthia_missions_10.tt1:0 "Poseemos control sobre #Y 200 territorios#!. Las tierras de nuestras #G Marchas#! cuentan para este número (Actualmente: [SCOPE.ScriptValue('parthia_10_provinces')|0|Y])."
 parthia_missions_10.tt2:0 "Elegimos qué #G Misiones ramificadas#! tendremos al comenzar la guerra desde la tarea anterior."

 parthia_missions_11:0 "Asentando las tribus"
 parthia_missions_11_DESC:0 "A medida que hacemos la transición de nuestro pasado tribal a esta nueva existencia asentada, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido que nuestras ciudades hambrientas necesitan más ciudadanos, por lo que se ha enviado la orden a las [GetCulture('derbiccan').GetName|G] tribus de que tendrán que mudarse. Sur.\n\n\n\n\n\n\n\n\n\n@persia_mil15!"
 parthia_pop_happy_culture_convert_tt:0 "La mitad de nuestros [GetCulture('derbiccan').GetName|G] parientes se reasentarán en #G ciudades iraníes#! y se convertirán en [GetCulture('parthian').GetName|Y]."

 parthia_missions_12:0 "#E Misión de ramificación#!"
 parthia_missions_12_DESC:0 "Dependiendo de tu elección con #R #E Conquista de la Horda#!#! o #T #E Conquista normal#!#! guerra contra [GetProvince('(int32)1595').GetOwner.GetName], ¡obtendrás diferentes misiones ramificadas!"
 parthia_missions_12.tt:0 "Dependiendo de nuestra elección del #E Objetivo de guerra#! en el #Y Conquistar a caballo es fácil...#! contra [GetProvince('(int32)1595').GetOwner.GetName], conseguiremos diferentes misiones."
# parthia_missions_12.tt:0 "#E #R For Horde Conquest wargoal branch:#!#! For having more than 5 Marches, we will unlock interactions to deal with our Marches.\n#E #T For Conquest wargoal branch:#!#! We will get a reward in our conquered Median territory."

