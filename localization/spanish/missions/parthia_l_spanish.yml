l_spanish:

# Events
 me_parthia.4.a.tt:0 "(Actualmente: #Y [SCOPE.ScriptValue('parthia_battles_won_svalue')]#!)"
# me_parthia.4.a.tt:0 "(Currently: #Y [SCOPE.ScriptValue('parthia_centr_gov_dude')]#!)"
 # [SCOPE.ScriptValue('parthia_12_marches')|0Y]

 me_parthia.1.t:0 "Conexiones partas - Regalos"
 me_parthia.1.desc:0 "Nuestros esfuerzos para influir en [GetCountry('PAR').GetRuler.GetName], el [GetCountry('PAR').GetRulerTitle] de [GetCountry('PAR').GetName], están siendo discutidos entre [ROOT.GetCountry.GetRuler.GetName] y dos de los [ROOT.GetCountry.GetRuler.GetHerHis] asesores más importantes, [SCOPE.sCharacter('peaceful_politician_dahae').GetName] y [SCOPE.sCharacter('warlike_politician_dahae').GetName], pero los tres guerreros no han podido llegar a un consenso sobre la mejor manera de lograr nuestro objetivo.\n\n[SCOPE.sCharacter('peaceful_politician_dahae').GetFirstName] ha sugerido que enviemos una saludable donación a los partos con la esperanza de comprar su lealtad, mientras que [SCOPE.sCharacter('warlike_politician_dahae').GetFirstName] ha descartado este enfoque como cobarde, exigiendo que luchemos contra los [GetCountry('SEL').GetName] por lo que deseamos. \n\n[ROOT.GetCountry.GetRuler.GetFirstName] tiene una decisión que tomar, muy consciente de que no importa lo que decida [ROOT.GetCountry.GetRuler.GetSheHe], habrá sentimientos de ira con los que lidiar."
 me_parthia.1.a:0 "Seguiremos las políticas beligerantes de [SCOPE.sCharacter('warlike_politician_dahae').GetFirstName]"
 me_parthia.1.b:0 "[SCOPE.sCharacter('peaceful_politician_dahae').GetFirstName] es sabio: envía un soborno a [GetCountry('PAR').GetCapital.GetName]"

 me_parthia.2.t:0 "Conexiones partas - Apoyo político"
 me_parthia.2.desc:0 "El debate sobre [GetCountry('PAR').GetName] continúa, y una nueva discusión ha amenazado la paz una vez más. \n\n[SCOPE.sCharacter('peaceful_politician_dahae').GetName] cree que deberíamos ofrecer apoyo político a los partos, afirmando que esto los endeudará con nosotros, pero esto ha provocado una respuesta airada de [SCOPE.sCharacter('warlike_politician_dahae').GetName]. [SCOPE.sCharacter('warlike_politician_dahae').GetFirstName] sostiene que no podemos darnos el lujo de desperdiciar nuestros valiosos recursos, y que si [GetCountry('PAR').GetRuler.GetName] es lo suficientemente tonto como para rechazar la oportunidad de oro que le hemos presentado, entonces no deberíamos tener nada que ver con [GetCountry('PAR').GetRuler.GetHerHim]."
 me_parthia.2.a:0 "[SCOPE.sCharacter('warlike_politician_dahae').GetFirstName] tiene razón; No podemos permitirnos esto ahora"
 me_parthia.2.b:0 "Escuche [SCOPE.sCharacter('peaceful_politician_dahae').GetFirstName] y haga lo que sugiere [SCOPE.sCharacter('peaceful_politician_dahae').GetSheHe]"

 me_parthia.3.t:0 "Conexiones partas: apoyo militar"
 me_parthia.3.desc:0 "Ayer por la tarde, [ROOT.GetCountry.GetRuler.GetName] recibió una carta de [GetCountry('PAR').GetRuler.GetName], el [GetCountry('PAR').GetRulerTitle] de [GetCountry('PAR').GetName] - parece que los partos están intrigados por nuestra oferta y la están considerando, pero están lidiando con sus propios problemas y se preguntaban si podríamos ayudarlos.\n\nParece que el [GetCountry('SEL').GetName] ha guarnecido la capital parta de [GetCountry('PAR').GetCapital.GetName] con un cuadro de soldados leales que no responden ante nadie excepto el [GetCountry('SEL').GetRulerTitle] [GetCountry('SEL').GetRuler.GetName], y se necesitará mano de obra para dominar a estos guerreros antes de que puedan dar la alarma. Si [ROOT.GetCountry.GetName] tiene cuerpos de sobra, entonces [GetCountry('PAR').GetRuler.GetFirstName] cree que tendremos éxito en nuestros esfuerzos.\n\nComo de costumbre, no hay consenso en el Consejo. [SCOPE.sCharacter('peaceful_politician_dahae').GetName] ha instado a hacer todo lo que [GetCountry('PAR').GetRuler.GetFirstName] pida, mientras que el sospechoso [SCOPE.sCharacter('warlike_politician_dahae').GetName] cree que se trata de una estratagema seléucida para debilitar nuestras propias reservas."
 me_parthia.3.a:0 "Estoy de acuerdo con [SCOPE.sCharacter('warlike_politician_dahae').GetFirstName] - esto suena demasiado peligroso"
 me_parthia.3.b:0 "'Por un centavo, por una libra'... tenemos que enviar soldados"

 me_parthia.4.t:0 "Conexiones partas: llegando a una conclusión"
 me_parthia.4.desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha hecho todo lo que [ROOT.GetCountry.GetRuler.GetSheHe] estaba dispuesto a hacer, y ahora todo está en manos de [GetCountry('PAR').GetRuler.GetName]. Queda por ver si los partos son cobardes o no..."
 me_parthia.4.a:0 "[GetCountry('PAR').GetRuler.GetFirstName], ¡espero que hagas lo correcto!"
 me_parthia.4.b:0 "DEPURAR"
 me_parthia.4.c:0 "DEPURAR"
# me_parthia.4.tt1:0 ""

 me_parthia.4000.t:0 "Pregunta de lealtad"
 me_parthia.4000.desc:0 "Mi [ROOT.GetCountry.GetRulerTitle], hemos recibido una embajada del norte; parece que las hordas de la estepa están dispuestas a apoyar nuestra independencia contra [GetCountry('SEL').GetName] si decidimos liberarnos.\n\nEs posible que nunca tengamos otra oportunidad como esta, pero ciertamente existen peligros que debemos considerar: ¿qué debemos decirles a los señores de los caballos?"
 me_parthia.4000.a:0 "¡Ha llegado el momento de que [ROOT.GetCountry.GetName] sea libre!"
 me_parthia.4000.b:0 "Seremos fieles a [ROOT.GetCountry.GetOverlord.GetName]"
 me_parthia.4000.tt1:0 "¡Esto puede dejarnos vulnerables a nuestros vecinos del norte y a las represalias del antiguo señor supremo!"
# me_parthia.4000.tt2:0 ""

 me_parthia.4001.t:0 "Conexiones partas - Resultado"
 me_parthia.4001.desc:0 "Han llegado noticias emocionantes a [ROOT.GetCountry.GetCapital.GetName] - [GetCountry('PAR').GetRuler.GetName], el [GetCountry('PAR').GetRulerTitle] de [GetCountry('PAR').GetName], ha expulsado a la guarnición #E Seleukid#! de [GetCountry('PAR').GetCapital.GetName] y ha declarado la independencia. ¡Nuestros esfuerzos por persuadir a los partos han dado sus frutos!"
 me_parthia.4001.a:0 "¡Esta es una noticia increíble!"
 me_parthia.4001.a.tt:0 "#Y Nuestros diseños en Partia pueden continuar...#!"
 parthia_satrapy_declares_independence_tt:0 "[GetCountry('PAR').GetName|Y] ha declarado su independencia del [GetCountry('SEL').GetName|R]."

 me_parthia.4002.t:0 "¡Traición en el Norte!"
 me_parthia.4002.desc:0 "[ROOT.GetCountry.GetRuler.GetName], traemos terribles noticias desde el norte. Nuestro sátrapa, [GetCountry('PAR').GetRuler.GetName], el [GetCountry('PAR').GetRulerTitle] de [GetCountry('PAR').GetName], ha declarado [GetCountry('PAR').GetRuler.GetHerHis] independencia del [ROOT.GetCountry.GetName].\n\nEl traidor [GetCountry('PAR').GetRuler.GetFirstName] fue alentado en esta tonta empresa por [GetProvince('(int32)6657').GetOwner.GetRuler.GetName], un perro bárbaro que ha unido a las tribus esteparias en una horda formidable. Debemos vigilar nuestra frontera norte, porque una fuerza combinada de #E partos#! y #E Dahae#! representa una amenaza real."
 me_parthia.4002.a:0 "¡Debo hacer algo al respecto!"
 me_parthia.4002.a.tt:0 "Obtendremos reclamaciones sobre todas las [GetCountry('PAR').GetAdjective] tierras."

 me_parthia.4003.t:0 "Conexiones partas - Resultado"
 me_parthia.4003.desc:0 "A pesar de nuestros mejores esfuerzos para persuadirlos a nuestra causa, los #E partos#! han rechazado nuestra propuesta de una manera brutal y terrible. Los agentes de [ROOT.GetCountry.GetRuler.GetName] que viajaron entre [ROOT.GetCountry.GetCapital.GetName] y [GetCountry('PAR').GetCapital.GetName] fueron arrestados por soldados #E seleukidas#!, quienes ejecutaron sumariamente a nuestros diplomáticos en el acto por ser espías.\n\nSi bien hay razones para sospechar que [GetCountry('PAR').GetRuler.GetName] es quien nos traicionó, no hay manera de probar nada."
 me_parthia.4003.a:0 "¡Qué tragedia! ¡Haré algo al respecto!"
 me_parthia.4003.a.tt:0 "Obtendremos reclamaciones sobre todas las [GetCountry('PAR').GetAdjective] tierras."

 me_parthia.5.t:0 "Escaramuza bactriana - Inicio"
 me_parthia.5.desc:0 "Si [ROOT.GetCountry.GetRuler.GetName] esperaba que un insulto bien colocado fuera suficiente para provocar la ira del quisquilloso [GetCountry('BAC').GetRuler.GetName], entonces [ROOT.GetCountry.GetRuler.GetSheHe] tuvo un éxito que va más allá de [ROOT.GetCountry.GetRuler.GetHerHis] los sueños más descabellados. [GetCountry('BAC').GetRuler.GetFirstName], un viejo chivo conocido por ser severo y sin sentido del humor, decidió que nuestra ofensa diplomática merecía una guerra a gran escala y llamó a las levas bactrianas a marchar hacia las murallas de [ROOT.GetCountry.GetCapital.GetName].\n\n[ROOT.GetCountry.GetRuler.GetFirstName] tiene otros planes, sin embargo, y ha jurado apoderarse de las tierras de los bactrianos."
 me_parthia.5.a:0 "¡Montamos por [GetProvince('(int32)6668').GetName]!"
 me_parthia.5.a.tt:0 "Si al final de la duración de esta tarea mantenemos [GetProvince('(int32)6668').GetName|T], el área circundante pasará a ser nuestra."

 me_parthia.6.t:0 "Escaramuza bactriana - Resultado"
 me_parthia.6.desc:0 "El conflicto entre [ROOT.GetCountry.GetName] y [GetCountry('BAC').GetName] terminó tan rápido como comenzó, ya que los disturbios en el este distrajeron a [GetCountry('BAC').GetRuler.GetName] y [GetCountry('BAC').GetRulerTitle] estaba ansioso por pedir la paz. Después de consultas cuidadosas con [ROOT.GetCountry.GetRuler.GetHerHis] principales generales, [ROOT.GetCountry.GetRuler.GetName] aceptó los términos que se ofrecieron y ordenó a los reclutas regresar a casa."
 me_parthia.6.a:0 "¡Los dioses cabalgan junto a [ROOT.GetCountry.GetRuler.GetName] hacia la batalla!"
 me_parthia.6.a.tt:0 "Mantendremos el control de los territorios fronterizos."
 me_parthia.6.b:0 "Parece que no tuvimos éxito..."
 me_parthia.6.b.tt:0 "No hemos logrado ejercer control sobre [GetProvince('(int32)6668').GetArea.GetName|T]."

 me_parthia.7.t:0 "Tomar el control de Partia"
 me_parthia.7.desc:0 "Fue un momento agridulce para muchos de nuestros parientes cuando se vieron obligados a abandonar sus tierras tradicionales por las tierras recién conquistadas que alguna vez fueron gobernadas por los #E [GetCountry('PAR').GetName] ns#!, pero no tuvieron otra opción; el conquistador [ROOT.GetCountry.GetRuler.GetName] había decretado que debía hacerse, y no había nadie que pudiera oponerse a la voluntad [ROOT.GetCountry.GetRuler.GetHerHis].\n\nDurante semanas, se elaboraron y consideraron planes cuidadosos dentro de las cámaras reales en [ROOT.GetCountry.GetCapital.GetName], y después de largas horas llenas de deliberación interminable, la visión del [ROOT.GetCountry.GetRulerTitle] comenzó a tomar forma.\n\nEl Los territorios de la estepa del norte serían abandonados; dejemos que nuestros aliados luchen entre ellos por los restos en las llanuras interminables, porque los [ROOT.GetCountry.GetAdjective] se estaban moviendo hacia el sur. Nuestros primos tribales nos protegerían del interior, asegurándose de que todo permanezca en calma para nosotros."
 me_parthia.7.a:0 "¡Nuevas oportunidades esperan a aquellos lo suficientemente audaces como para aprovecharlas!"
 me_parthia.7.a.tt:0 "Nos estableceremos en #G Partia#! junto con la mayoría de nuestros hermanos.\nUn #G Dahae#! vasallo tribal asegurará nuestro flanco norte.\nLas áreas más al norte se perderán..."

 me_parthia.8.t:0 "Arshak encontrado"
 me_parthia.8.desc:0 "Pocos honores pueden recaer sobre una ciudad tan grande como la de haber sido fundada por iniciativa real. Como tal, cuando [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] concedió [GetProvince('(int32)6656').GetName] su aprobación y el nombre de nuestra dinastía, gente de todas partes no tardó en llegar, y lo que eran unas colinas vacías ahora cuentan con una ciudad adecuada, con calles palaciegas y pavimentadas, un fuego eterno y todos los lujos con los que podríamos proporcionar a nuestra ciudad."
 me_parthia.8.a:0 "Trasladar nuestra corte allí es la única opción lógica."
 me_parthia.8.b:0 "Nuestro capital actual será suficiente."
 me_parthia.8.b.tt:0 "¡Hemos completado la tarea!"

 me_parthia.9.t:0 "¡Una oportunidad de atacar!"
 me_parthia.9.desc:0 "La oportunidad, descubierta ante nosotros. El premio, desnudo en su debilidad. El momento parece haber sido elegido, la única agencia que tenemos es decidir cómo queremos destruir - una opción escasa en un crimen tan glorioso.\n\nUna guerra de esta magnitud basada en los caprichos de los pocos hombres en la tienda principal del campamento cerca de [ROOT.GetCountry.GetCapital.GetName] los volvería locos a todos. Esta es la obra de los espíritus, que inspira al hombre mortal a seguir adelante, la expresión de las infinidades de los cielos en los pocos planos de existencia que comprendemos.\n\n'Entonces, cabalgamos hacia el sur', dijo un hombre, y todos los cascos retumbaron allí. El ojo ve algunos ya moribundos, pudriéndose y otros cargados de riquezas y botín. Esta será una guerra para siempre."
 me_parthia.9.a:0 "¡Avanza para matar!"
 me_parthia.9.a.tt:0 "Declarar la guerra al #R Conquista de la Horda Casus Belli#! contra [origin.GetName|R], lo que permite tomar directamente el territorio durante la ocupación.\nLos súbditos [origin.GetAdjective] totalmente ocupados pueden solicitar convertirse en nuestras #G Marchas#!.\n#E #Y Al finalizar la guerra conclusión#!#!, solo podremos retener #E #R 3 regiones elegidas directamente#!#!; El territorio exterior siempre se liberará como #G sujetos de Marcha#!.\n#G Nuestro objetivo en misiones posteriores será reinar en Marchas y centralizar el Reino.#!"
 me_parthia.9.b:0 "Conquistemos metódicamente."
 me_parthia.9.b.tt:0 "#G Las tareas de ramificación se cambiarán a tareas de sabor, relacionadas con las conquistas posteriores de la meseta iraní y Mesopotamia.#!"

 me_parthia.10.t:0 "¡Ataques de Partia!"
 me_parthia.10.desc:0 "Las tribus #E Dahae#!, ahora unidas en una sola y de naturaleza irreverente, han puesto sus bocas babeantes y sus intelectos brutales en nuestras ciudades; Los jinetes salen de las tierras fronterizas de [GetProvince('(int32)3435').GetArea.GetRegion.GetName], polvorientos y muertos de sed, anunciando la horda de cascos, pisoteando la vida de cada centímetro de suelo que cubren en su carrera demoníaca para llegar a nuestros hogares, mientras muchos en nuestras tierras susurran sobre nuestra debilidad y husmean en cada uno de nuestros errores.\n\nMuchos los llamaron bárbaros, pero rápidamente han demostrado que tienen poder propio, y algunos de ellos Nuestros generales susurran dócilmente, para no ser llamados traidores, que puede ser una lucha de vida o muerte para nosotros. Que el cuerpo descuartizado por la espada sea suyo."
 me_parthia.10.a:0 "¡Aplastarlos!"

 # me_parthia.10.a.tt:0 ""
 me_parthia.11.t:0 "Una consideración para nuestro futuro"
 me_parthia.11.desc:0 "Una vez más, la máquina imperial en [GetCountry('SEL').GetCapital.GetName] se encuentra en una nueva guerra, una nueva matanza sin sentido sin un motivo claro para nosotros, y aunque no nos importa en absoluto, nos vemos obligados a apoyar su extraña voluntad con nuestra propia sangre. La verdad es que si antes no podían controlar directamente estas vastas tierras, entregándonoslas (y estamos agradecidos por este tesoro), ahora somos más fuertes, y seguimos postrados ante sus caprichos. ¿Es hora de un cambio?"
 me_parthia.11.a:0 "¡Fuera el [GetCountry('SEL').GetName]!"
 me_parthia.11.a.tt:0 "Nos volveremos independientes y abandonaremos las guerras de nuestro Overlord."
 me_parthia.11.b:0 "Ahora no es el momento."
 me_parthia.11.b.tt:0 "Seremos fieles a los [GetCountry('SEL').GetAdjective]."

 me_parthia.12.t:0 "Traición bactriana"
 me_parthia.12.desc:0 "Las tierras con miles de ciudades arriba están gobernadas por completos tontos. Durante generaciones, sus pueblos se han sometido a la autoridad persa, de la cual somos la continuación natural, y aún así [GetCountry('BAC').GetRuler.GetName] y su corte de #COLOR:{0.51,0.31,0.75} Eromenoi#! han decidido traicionarnos por la independencia.\n\nSi vamos a recuperar el control de [GetCountry('BAC').GetName], debemos marchar rápidamente hacia ellos, o tendrán tiempo para fortificarse."

 me_parthia.13.t:0 "Hordas partas"
 me_parthia.13.desc:0 "Sintiendo un momento de debilidad, las hordas de los páramos [GetCountry('PTH').GetName] han descendido sobre las tierras [GetCountry('SEL').GetRuler.GetFamilyDisplayAdjective] como una manada de lobos atacaría a un cordero.\n\nEn muchas ciudades del norte del dominio [GetCountry('SEL').GetRuler.GetFamilyDisplayAdjective], como [GetProvince('(int32)4997').GetName] y [GetProvince('(int32)4991').GetName], familias enteras están partiendo a toda prisa hacia el sur, tratando de, con suerte, llegar a un lugar seguro. Y las historias de jinetes salvajes que lo queman todo y usan cráneos para alimentar a sus sádicos ejércitos viajan rápido. El ejército [GetCountry('SEL').GetRuler.GetFamilyDisplayAdjective] se está reuniendo con prisas desesperadas para, con suerte, detenerlos."
 me_parthia.13.a:0 "¡Ay!"
 me_parthia.13.a.tt:0 "Se avecinan tiempos difíciles para [GetCountry('SEL').GetName]."

 me_parthia.14.t:0 "Fuera los macedonios"
 me_parthia.14.desc:0 "Un bullicio excitado ha electrizado el aire en [GetCountry('PRM').GetCapital.GetName], ya que muchos de los que viven allí han oído los rumores de que [GetCountry('PRM').GetRuler.GetName] está considerando seriamente acabar con el yugo de los [GetCountry('SEL').GetRuler.GetFamilyDisplayAdjective]#E s#!.\n\nJusto cuando se escucha al último peticionario, [ROOT.GetCountry.GetRuler.GetName] miró a la izquierda, a [ROOT.GetCountry.GetRuler.GetHerHis] niños, y hacia las puertas que salían de la habitación.\n\nLuego, se levantó y dijo:"
 me_parthia.14.a:0 "¡No habrá mejor oportunidad para liberar nuestros hogares!"
 me_parthia.14.a.tt:0 "Nos volveremos independientes y abandonaremos las guerras de nuestro Overlord."
 me_parthia.14.b:0 "Ahora no es el momento."
 me_parthia.14.b.tt:0 "Seremos fieles al [GetCountry('SEL').GetAdjective]."

 me_parthia.15.t:0 "Traición Paropamisadae"
 me_parthia.15.desc:0 "El reino de la vieja bruja en quien Alexandros confiaba tan ciegamente, la semilla que engendró a la bruja que seguramente tuvo un papel no pequeño en matarlo, ha demostrado hoy ante todos su verdadera creación. La satrapía de [GetCountry('PRM').GetName] ha rechazado a uno de nuestros enviados, declarando que no nos deben nada y nosotros no les debemos nada; como si fuéramos dos pájaros volando en direcciones respectivas.\n\nNo son pájaros libres; son perros callejeros que orinan en cerámica rota y debemos decidir qué hacer con ellos."

 me_parthia.16.t:0 "Osroene se separa"
 me_parthia.16.desc:0 "En [GetProvince('(int32)820').GetArea.GetName], un tal #E Osroes de Orhai#! y su tribu de Arabia han tomado a [GetProvince('(int32)818').GetName] como rehén y han establecido un reino allí, renegando de [GetCountry('SEL').GetRuler.GetFamilyDisplayAdjective] autoridad y controlando el área a su alrededor.\n\nEste es un magro golpe a nuestro flanco oriental, pero puede que no sea el primero y muchos pueden estar esperando a ver cómo lo afrontamos. Para poner sus planes en acción. Por lo que vale, todavía se están estableciendo en sus nuevas tierras y recientemente fueron una tribu, por lo que su ejército no debe ser nada notable."

 me_parthia.17.t:0 "Elimais se escapa"
 me_parthia.17.desc:0 "Los rabiosos [GetCulture('elamite').GetName] pueblos del otro extremo de #E Mesopotamia#! han decidido causar problemas por millonésima vez, matando a nuestros administradores y sus familias, y a cualquier persona leal a nuestra causa, en [GetProvince('(int32)945').GetArea.GetName] y establecer lo que ahora llaman su 'reino' allí.\n\nCada campaña contra ellos está destinada a ser una pesadilla, con sus métodos pérfidos y guerreros hábiles, pero debemos aplastarlos por una vez, o si no."

 me_parthia.18.t:0 "El caraceno se rompe"
 me_parthia.18.desc:0 "#E Hispaosines#!, el [GetCulture('bactrian').GetName] a quien confiamos cuidadosamente [GetProvince('(int32)940').GetArea.GetName], aparentemente ha tirado por la ventana su lealtad porque nuestra situación actual es \"insostenible\", como él mismo ha dicho, y ha hecho que su cargo de gobernador, que se compone esencialmente de pueblos completamente ajenos a él, algunas #E Marchas#! y la ciudad de [GetProvince('(int32)940').GetName], independiente.\n\nSi bien dice que se mantuvo leal a nosotros tanto tiempo como pudo, esos son meros intentos de justificar una toma de poder y alta traición. Debemos decidir si vamos a actuar contra él."

 me_parthia.1801.t:0 "Aretosa se separa"
 me_parthia.1801.desc:0 "La toma de poder por parte de los envalentonados gobernadores continúa asumiendo las proporciones de lo que es, ahora, casi una comedia envuelta dentro de nuestra tragedia.\n\nPara empezar, apenas había personas viviendo en [GetProvince('(int32)944').GetName], pero afortunadamente hemos descubierto que las vacas y los camellos finalmente se han alzado en armas contra nuestra supuesta tiranía, y ahora están en abierta rebelión en esos páramos. Depende de nosotros decidir si nos molestamos en hacer marchar a nuestros hombres hacia ese desierto."

 me_parthia.19.t:0 "Avances para la paz"
 me_parthia.19.desc:0 "Hemos logrado grandes avances en [GetProvince('(int32)6961').GetArea.GetRegion.GetName] y [GetProvince('(int32)3406').GetArea.GetRegion.GetName], superando a nuestros enemigos y subyugando tierras dignas de grandes conquistadores.\n\nAún así, algunos se cansan de esta guerra, diciendo que no es santo perderse en una ambición incesante; [SCOPE.sCharacter('pth_wiseman').GetOffice.GetName] [SCOPE.sChar('pth_wiseman').GetName], por ejemplo, sostiene que mientras la bestia helénica muere a tiros mientras jadea, debemos ser conscientes de nuestra propia situación y no extender demasiado lo que en este momento es un imperio enorme para comparativamente pocos miembros de tribus.\n\nEl tratado que él y algunos otros nombres prominentes en la corte han ideado es ofrecer el [GetCountry('SEL').GetRuler.GetFamilyDisplayAdjective]#E s#! mantener todo al este del [GetProvince('(int32)7719').GetName], es decir, [GetProvince('(int32)754').GetArea.GetRegion.GetName], y que nos quedemos con las tierras al oeste y que [ROOT.GetCountry.GetRuler.GetName] se case con una novia de su familia."
 me_parthia.19.a:0 "Debemos buscar consolidar nuestros logros"
 me_parthia.19.a.tt:0 "Si [GetCountry('SEL').GetName] acepta, ganaremos #E todo lo suyo al este del Éufrates#!.\nObtendremos el modificador de país:\n[GetModifier('parthian_appeasing_stance').GetName|Y] que otorgará [GetModifier('parthian_appeasing_stance').GetDesc] por #Y 10 años#!.\n#Y Nuestro gobernante también lo hará. Casarse con una novia seléucida.#!"
 me_parthia.19.b:0 "Sólo la conquista total será suficiente"
 me_parthia.19.b.tt:0 "Continuaremos la guerra como siempre."

 me_parthia.1900.t:0 "Avances para la paz"
 me_parthia.1900.desc:0 "'¡Mi [ROOT.GetCountry.GetRulerTitle]! ¡Noticias del Este!'\nMientras [ROOT.GetCountry.GetRuler.GetName] estaba cuidando [ROOT.GetCountry.GetRuler.GetHerHis] caballos en el patio del palacio, [ROOT.GetCountry.GetRuler.GetSheHe] miró al mensajero que llegaba cabalgando desde las tierras persas. Dejando el caballo que [ROOT.GetCountry.GetRuler.GetSheHe] estaba atendiendo con una caricia, [ROOT.GetCountry.GetRuler.GetFirstName] quedó devastado al enterarse de la derrota más reciente del ejército [ROOT.GetCountry.GetRuler.GetHerHis] en las arenas de [GetProvince('(int32)6961').GetArea.GetRegion.GetName].\n\n'¡La horda parta ha propuesto una paz para poner fin a nuestra guerra!' Ahora bien, este [ROOT.GetCountry.GetRuler.GetFirstName] no se lo esperaba. Lavando la sorpresa de [ROOT.GetCountry.GetRuler.GetHerHis] cara, [ROOT.GetCountry.GetRuler.GetSheHe] ordenó al mensajero hablar.\n\n'A cambio de mantener todas las tierras al este del [GetProvince('(int32)7719').GetName] y hacer que el señor de la guerra [SCOPE.sCountry('parthia_scope').GetRuler.GetName] se case con una de nuestras princesas, proponen el fin de la guerra.'\n\n'Bueno, por supuesto, tendría que doler peor. Que si #COLOR:{0.51,0.31,0.75} Algea#! me quisiera muerto', pensó [ROOT.GetCountry.GetRuler.GetFirstName], 'pero podría ser que no tengamos otra opción'."
 me_parthia.1900.a:0 "Debemos ser pragmáticos para vivir."
 me_parthia.1900.a.tt:0 "#E #R Cederemos todo al este del río Éufrates.#!#!"
 me_parthia.1900.b:0 "El contraataque #E [sel_steiner_scope.GetName]#! llegará en cualquier momento."
 me_parthia.1900.b.tt:0 "Lucharemos hasta la muerte, ya sea #E la nuestra#! o la #E [parthia_scope.GetName]#!."
# me_parthia.19.b:0 ""
 me_parthia.1901.t:0 "[root_scope.GetName] - ¿Bajo nueva dirección?"
 me_parthia.1901.desc:0 "Los señores de las tierras [SCOPE.sCountry('defecting_subject').GetAdjective], ahora totalmente ocupadas por nuestros ejércitos y habiéndose dado cuenta de la terrible situación de su campamento, han enviado un emisario encubierto a [GetCountry('SEL').GetRuler.GetFamilyDisplayAdjective] espaldas para renegar de su servidumbre hacia ellos y convertirse en nuestra #E Marcha#!.\n\nDado que esto es guerra, todo vale, y la #E Los griegos#!, aunque estén rabiosos, no podrán hacer nada al respecto, pero podríamos beneficiarnos más de una conquista total."
 me_parthia.1901.a:0 "Con mucho gusto los protegeremos."
 me_parthia.1901.b:0 "No tenemos tales deseos."

 me_parthia.1902.t:0 "[root_scope.GetName] ¡Defectos!"
 me_parthia.1902.desc:0 "Cuando el último de sus representantes se va [ROOT.GetCountry.GetCapital.GetName] a toda prisa, para nuestra confusión, recibimos la temida noticia de que uno de nuestros súbditos, [SCOPE.sCountry('defecting_subject').GetName], ha abandonado crudamente nuestra causa y ha matado a todos los que pertenecían a nuestra administración de sus tierras para inclinarse ante los atronadores #E señores de los caballos partos#!. Logramos matar a algunos de los hombres que abandonaron nuestra capital para escapar de nuestra ira, pero sigue siendo un pequeño consuelo."
 me_parthia.1902.a:0 "¡Ay de ellos!"
 me_parthia.1902.a.tt:0 "Hemos logrado capturar y matar a algunos de sus representantes, por lo que perderán #T 1 Pop#! en su capital."

 me_parthia.1903.t:0 "Las águilas siguen volando"
 me_parthia.1903.desc:0 "A medida que nuestras victorias aumentan, nuestra influencia se extiende mucho más allá de donde marchan nuestros hombres. Temiendo que pisotear nuestros cascos sea una amenaza existencial, [SCOPE.sCountry('defecting_subject').GetRuler.GetName] ha ordenado a sus hombres que envíen tributos en forma de oro y tesoros con la esperanza de que les permitamos convertirse en nuestros súbditos. Tal es la influencia de nuestro imperio que los reyes extranjeros, con quienes no tenemos nada en contra, se inclinan voluntariamente ante nosotros con miedo."
 me_parthia.1903.a:0 "Deberíamos prestar atención a su deseo."
 me_parthia.1903.b:0 "Aceptarán nuestra soberanía. De otra forma, a su debido tiempo."

 me_parthia.20.t:0 "Asentando las tribus"
 me_parthia.20.desc:0 "Cuando ha llegado la victoria en el campo de batalla, el mayor premio, la vida, la sigue en toda su virtud y honestidad.\n\nLas ricas ciudades de la #E meseta iraní#!, ahora sin amo y listas para prosperar bajo la dirección de [ROOT.GetCountry.GetRuler.GetName], han acogido a nuestras tribus del interior. Nuestros hermanos, habiendo abandonado los páramos del norte en una masa gigante, dejan atrás no sólo sus hogares, sino también su identidad [GetCulture('derbiccan')GetName] tradicional. Se avecinan tiempos emocionantes para nosotros y para estas personas, con grandes promesas y mayor prosperidad."
 me_parthia.20.a:0 "Esa es una forma de controlar a las tribus salvajes..."
# me_parthia.20.tt:0 ""

 me_parthia.21.t:0 "Ultimátum parto"
 me_parthia.21.desc:0 "Mi [ROOT.GetCountry.GetRulerTitle], tenemos noticias terribles que compartir contigo esta mañana; Un grupo de diplomáticos ha llegado del este, portando el estandarte de los #E Partos#!. Afortunadamente, estos hombres no eran un grupo de exploración que anunciaba una invasión, aunque bien podrían serlo... los partos nos piden que nos sometamos pacíficamente a ellos como su #E Marcha#!.\n\nDespués de entregar su mensaje, la embajada se negó a pasar la noche en [ROOT.GetCountry.GetCapital.GetName], pero pidió saber nuestra respuesta de inmediato."
 me_parthia.21.a:0 "Me temo que ya es demasiado tarde... debemos someternos o morir."
 me_parthia.21.b:0 "¡No podemos vivir de rodillas!"

 me_parthia.2101.t:0 "Asunto del atropateno mediático - Respuesta"
 me_parthia.2101.desc:0 "Excelentes noticias para informar, o [ROOT.GetCountry.GetRuler.GetName] - [GetCountry('MAP').GetRuler.GetName], el [GetCountry('MAP').GetRulerTitle] de [GetCountry('MAP').GetName], ha aceptado sabiamente enviarlo a [ROOT.GetCountry.GetName].\n\n[GetCountry('MAP').GetRuler.GetFirstName] ha escrito a [ROOT.GetCountry.GetRuler.GetFirstName] personalmente para agradecer a [ROOT.GetCountry.GetRuler.GetHerHim] por extender gentilmente esta oportunidad a los [GetCountry('MAP').GetAdjective] y promete cumplir [GetCountry('MAP').GetRuler.GetHerHis] obligaciones sin falta."
 me_parthia.2101.a:0 "Brindo por tu salud y nuestra colaboración, [GetCountry('MAP').GetRuler.GetFirstName]..."

 me_parthia.2102.t:0 "Asunto del atropateno mediático - Respuesta"
 me_parthia.2102.desc:0 "[GetCountry('MAP').GetRuler.GetName] ha enviado una respuesta a nuestros diplomáticos; en lugar de pasar [GetCountry('MAP').GetRuler.GetHerHis] los últimos días en el regazo del lujo, bebiendo vino y escuchando a los esclavos recitar historias de gloria, [GetCountry('MAP').GetRuler.GetSheHe] quiere ser testigo de la muerte de todos los que [GetCountry('MAP').GetRuler.GetSheHe] ama mientras los muros de [GetCountry('MAP').GetCapital.GetName] son derribados.\n\nNo hace falta decir que [ROOT.GetCountry.GetRuler.GetName] no se tomó bien el rechazo..."
 me_parthia.2102.a:0 "¡Acabas de firmar tu propia sentencia de muerte, [GetCountry('MAP').GetRuler.GetFirstName]!"
 me_parthia.2102.a.tt:0 "Obtendremos reclamos sobre todas las [GetCountry('MAP').GetAdjective|G] tierras."

 me_parthia.22.t:0 "Ultimátum parto"
 me_parthia.22.desc:0 "Mi [ROOT.GetCountry.GetRulerTitle], tenemos noticias terribles que compartir contigo esta mañana; Un grupo de diplomáticos ha llegado del este, portando el estandarte de los #E Partos#!. Afortunadamente, estos hombres no eran un grupo de exploración que anunciaba una invasión, aunque bien podrían serlo... los partos nos piden que nos sometamos pacíficamente a ellos como su #E Marcha#!.\n\nDespués de entregar su mensaje, la embajada se negó a pasar la noche en [ROOT.GetCountry.GetCapital.GetName], pero pidió saber nuestra respuesta de inmediato."
 me_parthia.22.a:0 "Me temo que ya es demasiado tarde... debemos someternos o morir."
 me_parthia.22.b:0 "¡No podemos vivir de rodillas!"

 me_parthia.2201.t:0 "Exigir la fidelidad de Adiabene - Respuesta"
 me_parthia.2201.desc:0 "[GetCountry('ADI').GetRuler.GetName] ha dicho a nuestros diplomáticos que [GetCountry('ADI').GetRuler.GetSheHe] se someterá pacíficamente a [ROOT.GetCountry.GetName], admitiendo amargamente que no tienen esperanzas de derrotarnos en la batalla. La única petición personal que hizo [GetCountry('ADI').GetRuler.GetFirstName] fue pedir que nuestros parientes no acosaran ni molestaran a los [GetCountry('ADI').GetAdjective] lugareños, un término que era aceptable para [ROOT.GetCountry.GetRuler.GetName]."
 me_parthia.2201.a:0 "Muy bien entonces"
 me_parthia.2201.a.tt:0 "Si Osroene es nuestra #G Marzo#! y [GetProvince('(int32)880').GetArea.GetRegion.GetName|T] no es nuestro #G Dastgerd#!, dividiremos #T [GetProvince('(int32)880').GetArea.GetRegion.GetName] Región#! entre #G Adiabane#! y #G Osroene#!."
 me_parthia.2201.b.tt:0 "Si [GetProvince('(int32)880').GetArea.GetRegion.GetName|T] no es nuestro #G Dastgerd#!, #G Adiabene#! se convertirá en el #G Marzo#! para esta región."

 me_parthia.2202.t:0 "Exigir la fidelidad de Adiabene - Respuesta"
 me_parthia.2202.desc:0 "Las viejas brujas del #E [GetCountry('ADI').GetAdjective]#! palacio son arrogantes, delirantes, ingenuas y vergonzosas. Hemos destruido el dominio seléucida, y este estado vasallo que vive en nada más que unos reductos perdidos en las colinas cree que es nuestro rival. ¡Qué locura! Nuestra horda disfrutará mucho cabalgando por sus calles y quemando sus casas y tiendas."
 me_parthia.2202.a:0 "Qué lástima. Para ellos."
 me_parthia.2202.a.tt:0 "Obtendremos reclamos sobre todas las [GetCountry('ADI').GetAdjective|G] tierras."

 me_parthia.23.t:0 "Amistad entre gobernantes"
 me_parthia.23.desc:0 "Entre banquetes, [ROOT.GetCountry.GetRuler.GetName] convocó a una reunión privada con [SCOPE.sCountry('pth_wooing_ARM_target1_scope').GetRulerTitle] [SCOPE.sCountry('pth_wooing_ARM_target1_scope').GetRuler.GetFirstName] y [SCOPE.sCountry('pth_wooing_ARM_target2_scope').GetRulerTitle] [SCOPE.sCountry('pth_wooing_ARM_target2_scope').GetRuler.GetFirstName], los dos invitados de honor.\n\nAl entrar en la sala separada del palacio, encontró a los dos hombres sentados, mirándolo. ''Así que, como ven, mis buenos amigos, yo, Rey de Reyes, he compartido con ustedes mi buena compañía y mi riqueza. La tranquilidad con la que habéis vivido estos últimos días puede extenderse a vuestro pueblo y a vosotros mismos. Toma en serio mi divina gratitud, no le sucede a cualquiera. Sus ojos oscuros miraron a los dos hombres sentados. Parecían bastante felices de aceptar."
 me_parthia.23.a:0 "¡Excelente! Ahora volvamos a las festividades."

 me_parthia.24.t:0 "Insulto diplomático"
 me_parthia.24.desc:0 "Un miembro de una tribu parta fue acusado en [GetProvince('(int32)1544').GetName] - y probablemente con razón - de practicar la blasfemia contra [GetDeityDefinition('omen_tsovinar').GetName], un dios bastante santo de esa tierra extranjera. Aún así, fue un completo accidente relacionado con las reglas francamente extrañas de adoración a ese dios menor.\n\nHemos hecho un gran escándalo con esto, ya que el hombre tenía una familia y no podía haber sabido que estaba ofendiendo a alguien, y aún así fue ejecutado. Hemos insultado a los [GetCulture('armenian').GetName]#E s#! por su hospitalidad hostil, que ha generado cierta buena voluntad hacia los súbditos armenios que buscamos poseer."
 me_parthia.24.a:0 "Todo según el plan"
 me_parthia.24.b:0 "¡Duplica el insulto!"

 me_parthia.25.t:0 "Regalos para los sujetos [GetCountry('ARM').GetAdjective]"
 me_parthia.25.desc:0 "Como prometió nuestro [ROOT.GetCountry.GetRulerTitle], un magnífico séquito partió hacia [SCOPE.sCountry('pth_wooing_ARM_target2_scope').GetName], y la gente de [SCOPE.sCountry('pth_wooing_ARM_target2_scope').GetCapital.GetName] quedó profundamente impresionada por la belleza y la pompa que tan fácilmente podemos ofrecer a su humilde nación. Este podría ser el momento adecuado para redoblar nuestra generosidad y hacer una donación aún mayor; Los elefantes, los artistas, el oro y las riquezas, los eruditos y todo lo demás seguramente harán que su afecto por nosotros se intensifique."
 me_parthia.25.a:0 "El regalo anterior fue suficiente…"
 me_parthia.25.b:0 "Bañémoslos de oro."
 me_parthia.25.c:0 "¡Encarga un gran templo en una de sus ciudades!"

 me_parthia.26.t:0 "demostración de fuerza"
 me_parthia.26.desc:0 "En el campamento, [SCOPE.sChar('parthianwaar').GetName] bromeó diciendo que estos [SCOPE.sCountry('pth_wooing_ARM_target2_scope').GetAdjective] bandidos comedores de estiércol probablemente caerían muertos en sus zapatos tan pronto como vieran el poder de nuestro ejército. Gracias a la inestabilidad causada por estos bajos fondos, que [GetCountry('ARM').GetRuler.GetName] tuvo la amabilidad de ignorar, ahora marchamos y estacionamos nuestros ejércitos a través de las colinas de [SCOPE.sCountry('pth_wooing_ARM_target1_scope').GetName] y [SCOPE.sCountry('pth_wooing_ARM_target2_scope').GetName], con el pretexto de mantener a sus poblaciones a salvo de estos ''bandidos aterradores'', algunos de los cuales podrían tener algo que ver con nosotros, pero bueno, eso importa poco. Ahora recurren a nosotros en busca de seguridad."
 me_parthia.26.a:0 "Ahora ven que hablamos en serio."

 me_parthia.27.t:0 "Patrocinio de juegos públicos"
 me_parthia.27.desc:0 "Al patrocinar juegos en las capitales [SCOPE.sCountry('pth_wooing_ARM_target1_scope').GetAdjective] y [SCOPE.sCountry('pth_wooing_ARM_target2_scope').GetAdjective], introduciremos un aspecto completamente nuevo en sus vidas civiles, que no olvidarán fácilmente. Competición, sudor, arena y cuerda; todos los elementos para llevar a la multitud al éxtasis. Justo cuando saltan a sus asientos, entra un carro cubierto con nuestros símbolos reales, un recordatorio público para todos los presentes de que la familia [ROOT.GetCountry.GetRuler.GetFamily.GetName] ha patrocinado este evento. ¡Qué espectáculo tan absoluto para todas las edades resultará ser este! Los lugareños no hablarán de otra cosa durante años."
 me_parthia.27.a:0 "Realizar los juegos en un campo fuera de la ciudad."
 me_parthia.27.b:0 "¡Construye arenas para el espectáculo!"

 me_parthia.28.t:0 "Cortejando a los sujetos [GetCountry('ARM').GetAdjective] - Momento de la verdad"
 me_parthia.28.desc:0 "[ROOT.GetCountry.GetAdjective] diplomáticos han estado trabajando incansablemente, viajando entre [GetCountry('SPH').GetCapital.GetName] y [GetCountry('CRD').GetCapital.GetName] para coordinar la integración de los dos países en nuestra esfera. [SCOPE.sChar('parthiandddiplo').GetName], por ejemplo, no ha dormido durante días y solo vio a su familia una vez, con la cantidad de informes diferentes y el comercio de influencias necesarios. Sin embargo, todavía hay mucho en juego, ya que los armenios están más cerca de ellos culturalmente, y sin duda todavía son una fuerza propia, y todavía hay muchas lealtades hacia ellos.\n\nEs hora de deshacerse de las formalidades y exigirles lo que realmente queremos: vasallaje."
 me_parthia.28.a:0 "Hazles una oferta demasiado buena para ser rechazada."
 me_parthia.28.a.tt:0 "Si los hemos impresionado lo suficiente, es posible que elijan convertirse en nuestro tema."
 me_parthia.28.b:0 "Hazles una oferta demasiado buena para ser rechazada."
# me_parthia.28.b.tt:0 ""
 me_parthia.28.c:0 "Hazles una oferta demasiado buena para ser rechazada."
# me_parthia.28.c.tt:0 ""
 me_parthia.29.t:0 "Cortejando a los sujetos [GetCountry('ARM').GetAdjective] - Protección aceptada"
 me_parthia.29.desc:0 "Después de algunos momentos tensos en los que se puso a prueba la voluntad de hierro de nuestros diplomáticos y su habilidad en el arte de gobernar fue de gran utilidad, finalmente hemos formalizado nuestro dominio sobre [GetCountry('SPH').GetCapital.GetName] y [GetCountry('CRD').GetCapital.GetName]. Esto demuestra que somos una fuerza a tener en cuenta no sólo en el campo de batalla sino también en los asuntos políticos. Poco a poco estamos estableciendo nuestro lugar como una potencia respetada en el mundo."
 me_parthia.29.a:0 "Una elección acertada."
 me_parthia.30.t:0 "Partia ofrece protección"
 me_parthia.30.desc:0 "No fue una sorpresa para [ROOT.GetCountry.GetRuler.GetSpouse.GetName], ni para muchos en la [ROOT.GetCountry.GetAdjective] casa real, que el cortejo de los partos fuera de puras intenciones. En los pasillos del poder, la buena voluntad se elimina con bastante rapidez. Como tal, simplemente desempeñamos el papel de cortejados, para ver cuánto podíamos obtener como suplicantes antes de que llegara el mensajero.\n\nY como tal, [SCOPE.sChar('prnmessenger').GetName] entró en la sala del trono y exigió severamente que nos sometiéramos al señorío de los partos."
 me_parthia.30.a:0 "La protección parta suena maravillosa."
 me_parthia.30.a.tt:0 "#R Nos convertiremos en un feudatorio de #E Partia#!. #!"
 me_parthia.30.b:0 "¡Nunca más nos someteremos a tiranos extranjeros!"
 me_parthia.31.t:0 "Cortejando a los sujetos [GetCountry('ARM').GetAdjective] - Protección rechazada"
 me_parthia.31.desc:0 "Buscamos establecernos no sólo como una fuerza militar sino también política, para ganar legitimidad y respeto entre nuestros pares. Aun así, no estábamos del todo a salvo del arrogante desprecio de los hombres menores. [GetCountry('SPH').GetCapital.GetName] y [GetCountry('CRD').GetCapital.GetName] se han negado conjuntamente a convertirse en nuestros súbditos.\n\nParece que debemos ponernos en marcha nuevamente, para no deshacernos de la imagen de conquistadores belicosos en el corto plazo."
 me_parthia.31.a:0 "¡Tontos!"

 me_parthia.32.t:0 "Ultimátum parto"
 me_parthia.32.desc:0 "Mi [ROOT.GetCountry.GetRulerTitle], tenemos noticias terribles que compartir contigo esta mañana; Un grupo de diplomáticos ha llegado del este, portando el estandarte de los #E Partos#!. Afortunadamente, estos hombres no eran un grupo de exploración que anunciaba una invasión, aunque bien podrían serlo... los partos nos piden que nos sometamos pacíficamente a ellos como su #E Marcha#!.\n\nDespués de entregar su mensaje, la embajada se negó a pasar la noche en [ROOT.GetCountry.GetCapital.GetName], pero pidió saber nuestra respuesta de inmediato."
 me_parthia.32.a:0 "Esta petición es un preludio a la guerra... la aceptamos."
 me_parthia.32.b:0 "¡No podemos vivir de rodillas!"

 me_parthia.3201.t:0 "Subyugar a Armenia - Respuesta"
 me_parthia.3201.desc:0 "Parece que los esfuerzos diplomáticos de [ROOT.GetCountry.GetRuler.GetName] fueron suficientes para doblegar la voluntad del armenio [GetCountry('ARM').GetRulerTitle], pues [GetCountry('ARM').GetRuler.GetName] se sometió inmediatamente, pidiendo sólo que se mostrara amabilidad con los habitantes de las montañas. Aunque [GetCountry('ARM').GetRuler.GetFirstName] admitió que los partos tenían todo el derecho a saquear y saquear sus tierras, [GetCountry('ARM').GetRuler.GetSheHe] pidió clemencia; un deseo que fue concedido."
 me_parthia.3201.a:0 "¡Fantásticas noticias!"

 me_parthia.3202.t:0 "Subyugar a Armenia - Respuesta"
 me_parthia.3202.desc:0 "La respuesta del [GetCountry('ARM').GetRulerTitle] armenio fue tan grosera y llena de insultos que los escribas de [ROOT.GetCountry.GetRuler.GetName] no leyeron el contenido de la carta dirigida al [ROOT.GetCountry.GetRulerTitle], alegando únicamente que [GetCountry('ARM').GetRuler.GetName] la había rechazado respetuosamente. Si [ROOT.GetCountry.GetRuler.GetFirstName] supiera lo que realmente se dijo, entonces los ejércitos de [ROOT.GetCountry.GetName] habrían marchado desde [ROOT.GetCountry.GetCapital.GetName] esa misma noche."
 me_parthia.3202.a:0 "Este reino será nuestro pronto de todos modos..."
 me_parthia.3202.a.tt:0 "Obtendremos reclamos sobre todas las [GetCountry('ARM').GetAdjective|G] tierras."

 me_parthia.33.t:0 "Ultimátum parto"
 me_parthia.33.desc:0 "Mi [ROOT.GetCountry.GetRulerTitle], tenemos noticias terribles que compartir contigo esta mañana; Un grupo de diplomáticos ha llegado del este, portando el estandarte de los #E Partos#!. Afortunadamente, estos hombres no eran un grupo de exploración que anunciaba una invasión, aunque bien podrían serlo... los partos nos piden que nos sometamos pacíficamente a ellos como su #E Marcha#!.\n\nDespués de entregar su mensaje, la embajada se negó a pasar la noche en [ROOT.GetCountry.GetCapital.GetName], pero pidió saber nuestra respuesta de inmediato."
 me_parthia.33.a:0 "Enviaremos... por ahora"
 me_parthia.33.b:0 "¡Ven a buscar tu muerte en las montañas, perro parto!"

 me_parthia.3301.t:0 "Valles del Cáucaso - Iberia Responde"
 me_parthia.3301.desc:0 "Te alegrará saber, [ROOT.GetCountry.GetRuler.GetName], que [GetCountry('IBR').GetRuler.GetName] ha enviado [GetCountry('IBR').GetRuler.GetHerHis] insignias reales a [ROOT.GetCountry.GetCapital.GetName] en señal de su sumisión... ¡otra victoria incruenta para los ejércitos de [ROOT.GetCountry.GetName]!"
 me_parthia.3301.a:0 "Este fue el único resultado natural."

 me_parthia.3302.t:0 "Valles del Cáucaso - Iberia Responde"
 me_parthia.3302.desc:0 "[GetCountry('IBR').GetRuler.GetName] ha respondido a nuestra demanda con una burla, afirmando que las #E Montañas del Cáucaso#! serán el lugar de enterramiento de [ROOT.GetCountry.GetRuler.GetName].\n\n'Ningún hombre sabrá dónde está enterrado tu cuerpo, desgraciado parto, y las nieves de nuestra patria cubrirán tu magra tumba y la borrarán de la historia.'"
 me_parthia.3302.a:0 "Yo personalmente mataré a [GetCountry('IBR').GetRuler.GetFirstName]"
 me_parthia.3302.a.tt:0 "Obtendremos reclamos sobre todas las [GetCountry('IBR').GetAdjective] tierras."

 me_parthia.36.t:0 "Centralizar el reino"
 me_parthia.36.desc:0 "Parecía que no había otra forma de proceder para [ROOT.GetCountry.GetRuler.GetName]. Después de [ROOT.GetCountry.GetRuler.GetHerHim] pensar y discutir con el Consejo suficientes veces, ahora llegó el momento de tomar una decisión.\n\nY, sin embargo, todavía había dudas y [ROOT.GetCountry.GetRuler.GetHerHis] el corazón latía con fuerza; las consecuencias de las acciones de [ROOT.GetCountry.GetRuler.GetHerHis] resonarían a lo largo del tiempo y causarían la muerte de incontables miles de personas, pero había que hacer algo con respecto a los súbditos de [ROOT.GetCountry.GetName].\n\nLa red flexible de #E Marchas#! que alguna vez permitieron que nuestro poder se proyectara en todas partes ahora amenazaba con destrozar ese mismo poder. Muchos asesores [ROOT.GetCountry.GetRuler.GetFirstName] pidieron que los muchos 'Strategoi' y Sátrapas que hicieron fortuna gracias a nosotros fueran relevados de sus puestos, pero esta ofensiva seguramente conduciría a una guerra civil... y aún así, dejar que estos exarcas regionales gobiernen por sí solos bien podría tener consecuencias permanentes, con nuestro poder disminuyendo en esas regiones poco a poco, día a día.\n\nEn la cabeza de un hombre yacía el futuro de los partos. Imperio."
 me_parthia.36.a:0 "¡No se escuchará ningún disentimiento!"
 me_parthia.36.b:0 "Si se puede evitar el derramamiento de sangre, esperemos."
 pth_civil_war_averted_tt:0 "¡Todas nuestras marchas cambiarán a Satrapías y se podrán integrar después de 10 años! \NSe nos impedirá realizar la siguiente misión, siempre y cuando tengamos Satrapías."

 me_parthia.37.t:0 "¡Guerra civil!"
 me_parthia.37.desc:0 "¡Ay! ¡El [resistance_leader.GetName] ha decidido declarar la guerra a nuestra administración central y ha establecido un nuevo tribunal en [SCOPE.sProvince('center_of_resistance').GetName]!\n\nAfirmando ser hijos de la silla y adorando la llanura y el cielo abiertos, la Horda Parta se ha reunido por última vez, en un viaje desesperado hacia la libertad; Hay rumores en el país de que nos hemos convertido en el monstruo imperial ocioso que una vez pisoteamos y que ahora también seremos pisoteados. Nuestra política de centralización de las tribus está siendo puesta ahora a su mayor prueba."
 me_parthia.37.a:0 "¡A la victoria!"

 me_parthia.38.t:0 "Conquistar Persia"
 me_parthia.38.desc:0 "La guerra y la agitación han convertido a Persia de la mayor amenaza a la soberanía griega a una región fronteriza donde habitan los traficantes de poder locales.\n\nComo este pedazo de corazón cultural de Irán, el pueblo persa y sus instituciones deben convertirse en partes integrales de nuestra esfera de influencia. Podríamos confiar la administración de estas tierras a los nobles persas que gobernaron la tierra bajo los aqueménidas y que hasta cierto punto han conservado su poder hasta el día de hoy.\nPor otro lado, hay quienes preferirían un gobierno directo y acceso a los recursos de nuestro reino."
 me_parthia.38.a:0 "Permitir el autogobierno."
 me_parthia.38.b:0 "Permitir el autogobierno."
 me_parthia.38.c:0 "Somos gobernantes de todo Irán."

 me_parthia.39.t:0 "Conquistar a Ariana"
 me_parthia.39.desc:0 "A medida que nuestros ejércitos conquistan la desolada región arriana y expulsan la influencia helenística sobre los desiertos locales, una vez más recuerdan lo extraña que es la tierra Ariana. A pesar de ser muy pobre, por ejemplo en su frontera sur, junto al mar, viven personas famosas por pescar perlas, por lo que hay oportunidades económicas, sólo hay que buscarlas y tal vez invertir algo de dinero y esfuerzo.\n\nAquí también es donde una gran parte del ejército del propio Alejandro pereció, dejando sus almas en esos desiertos para siempre."
 me_parthia.39.a:0 "Permitir el autogobierno."
 me_parthia.39.b:0 "El tema de la frontera oriental no nos conviene."
 
 me_parthia.3901.t:0 "Grandes casas"
 me_parthia.3901.desc:0 "[the_important_guy1.GetName], [the_important_guy2.GetName] y [the_important_guy3.GetName] se han integrado en las culturas #E partas#! y sus familias siguieron su ejemplo. Este es el resultado natural de que nos mezclamos cada vez más perfectamente con nuestros súbditos sedentarios y, con suerte, a su debido tiempo seremos vistos por ellos como sus legítimos amos incuestionables."
 me_parthia.3901.a:0 "Nuestras Grandes Familias seguramente dejarán una huella en los libros de historia"

 me_parthia.41.t:0 "Idioma administrativo"
 me_parthia.41.desc:0 "Con el sabio #E Artabid#! [SCOPE.sCharacter('parthian_steward_scope').GetName] al lado [ROOT.GetCountry.GetRuler.GetHerHis], [ROOT.GetCountry.GetRuler.GetName] se sintió seguro de seguir adelante con la trascendental decisión de elegir un idioma oficial para los escribas [ROOT.GetCountry.GetAdjective]. Al seleccionar uno sobre los demás, el [ROOT.GetCountry.GetRulerTitle] estaría dando forma a las tradiciones literarias de [ROOT.GetCountry.GetName] para las generaciones venideras; tales decisiones no se tomaron a la ligera y [ROOT.GetCountry.GetRuler.GetFirstName] sintió el peso de la historia sobre [ROOT.GetCountry.GetRuler.GetHerHis] hombros."
 me_parthia.41.a:0 "El lenguaje de la burocracia #E aqueménida#! es una elección obvia"
 me_parthia.41.b:0 "#E Griego#! es el nuevo idioma que todo el mundo debe saber"
 me_parthia.41.c:0 "¡Todos aprenderán #E parto#! tarde o temprano!"

 me_parthia.42.t:0 "Convocar Magastan - Inicio"
 me_parthia.42.desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha llevado a los ejércitos de [ROOT.GetCountry.GetName] a la batalla innumerables veces, enfrentándose a enemigos motivados que nos superaban en número dos a uno, pero [ROOT.GetCountry.GetRuler.GetSheHe] aún pudo lograr la victoria contra probabilidades imposibles. Y el poderoso [ROOT.GetCountry.GetRulerTitle] ha dejado [ROOT.GetCountry.GetRuler.GetHerHis] huella en la tierra misma, construyendo ciudades y edificios en todo el reino que han aumentado el nivel de vida de nuestros parientes; claramente, hay pocas cosas en las que [ROOT.GetCountry.GetRuler.GetFirstName] no sobresalga.\n\nPero hay una cosa que [ROOT.GetCountry.GetRuler.GetSheHe] detesta, y a pesar de los [ROOT.GetCountry.GetRuler.GetHerHis] repetidos esfuerzos por retrasar lo inevitable, el tiempo ha llegado. Ven a reunir un consejo local, conocido en nuestro idioma como #E 'Magastan'#!, donde [ROOT.GetCountry.GetRuler.GetFirstName] tendrá que sentarse y escuchar discusiones insignificantes durante horas..."
 me_parthia.42.a:0 "Uf...¡que los dioses hagan que las horas pasen rápido!"
 me_parthia.42.tt:0 "Se nos presentarán peticiones de nuestro tribunal."

 me_parthia.4201.t:0 "Convocar Magastan - Participaciones solicitadas"
 me_parthia.4201.desc:0 "A pesar de que las Grandes Familias son las personas más influyentes y ricas de nuestro reino, aparentemente no existe un límite para la codicia humana. El último en la fila es [target.GetName], quien ha convencido a las masas de que [target.GetSheHe] tiene derecho a algunas de nuestras tierras públicas. Otra estratagema corrupta de la nobleza, pero aún queda la pregunta de cómo debemos abordar esto. Después de todo, enojar a una Gran Familia puede no ser demasiado prudente cuando tenemos suficiente tierra o dinero para todos y satisfacer sus demandas."
 me_parthia.4201.a:0 "Dile que se vaya"
 me_parthia.4201.b:0 "No hay problema, suficiente terreno para todos."
 me_parthia.4201.c:0 "Prefiero simplemente pagarle..."

 me_parthia.4202.t:0 "Convocar a Magastan - Resolver la disputa"
 me_parthia.4202.desc:0 "Los [target1.GetName] y [target2.GetName] nunca se han llevado bien, como podría esperarse de dos Grandes Casas con intereses contrapuestos en un solo estado. Como tal, cualesquiera que sean para nosotros las trivialidades de sus diferencias, podemos obtener algunos favores fáciles de cualquiera de las familias al expresarles su apoyo. Por supuesto, esto enojará a la otra familia, pero esta es una canción y un baile con los que [ROOT.GetCountry.GetRuler.GetName] está muy familiarizado. La tercera opción obvia es decirles a todos que nos espanten y que no nos molesten con sus estúpidas riñas."
 me_parthia.4202.a:0 "Pongámonos del lado de [target1.GetName]"
 me_parthia.4202.b:0 "Nos conviene ponernos del lado de [target2.GetName]"
 me_parthia.4202.c:0 "Honestamente, ¿quién tiene tiempo para escuchar esto?"

 me_parthia.4203.t:0 "Convocar a Magastan - La difícil situación de [culture_target_scope.GetName]"
 me_parthia.4203.desc:0 "Los pueblos [culture_target_scope.GetName] son indigentes, debido a que su última cosecha fue inusualmente pequeña. Su situación obtuvo la simpatía de algunos de sus nobles locales y, como esfuerzo caritativo, [ROOT.GetCountry.GetRuler.GetName] está analizando una petición para utilizar recursos estatales para ayudar a las pobres almas. [GetOffice('office_foreign_minister').GetCulturalName(SCOPE.GetRootScope.GetCountry)] y [GetOffice('office_royal_tutor').GetCulturalName(SCOPE.GetRootScope.GetCountry)] se han convertido en los defensores del pueblo [culture_target_scope.GetName] de nuestra nación. Han argumentado pragmáticamente que nos beneficiaremos si nos aseguramos de cortar de raíz cualquier posible levantamiento, y nuestros esfuerzos ciertamente nos harán ganar algo de gratitud."
 me_parthia.4203.a:0 "Sus problemas son intrascendentes."
 me_parthia.4203.b:0 "rescatarlos"

 me_parthia.4204.t:0 "Convoca Magastan - Ostracismo"
 me_parthia.4204.desc:0 "Elementos de la nobleza han invertido mucho tiempo y recursos criticando a [target.GetName] últimamente, y se ha propuesto revocar por completo el cargo de [target.GetHerHis]. La mayoría de las partes interesadas en el debate aceptarán con entusiasmo enviar [target.GetPraenomen] de regreso a [ROOT.GetCountry.GetCapital.GetName], pero hay quienes dicen que el ostracismo es un paso demasiado lejos."
 me_parthia.4204.a:0 "Sí, no tiene sentido oponerse a nuestro tribunal en esto."
 me_parthia.4204.b:0 "No, ¿nos están enseñando sobre recursos humanos?"

 me_parthia.4205.t:0 "Convocar a Magastan - Declarar la guerra"
 me_parthia.4205.desc:0 "Últimamente, [war_target.GetName] se ha convertido en un nombre odiado en las calles de [ROOT.GetCountry.GetCapital.GetName], y los rumores e historias sobre la horrible gente [war_target.GetPrimaryCulture.GetName] se están extendiendo como la pólvora. Parece que nuestra nobleza ha intentado activamente impulsar las calumnias y mentiras esta vez, y sólo se confirma cuando [GetOffice('office_master_of_the_guard').GetCulturalName(SCOPE.GetRootScope.GetCountry)] ocupa el centro del escenario y llama a la guerra.\n\nUna gran mayoría se ha dejado llevar por la propaganda y exige la guerra a nuestro [ROOT.GetCountry.GetRulerTitle]."
 me_parthia.4205.a:0 "¡Siempre hubo algo arrogante en [war_target.GetName]!"
 me_parthia.4205.b:0 "La paz debe ser preservada"

 me_parthia.43.t:0 "Convocar a Magastan - Fin"
 me_parthia.43.desc:0 "Una vez resueltas todas las quejas, [ROOT.GetCountry.GetRuler.GetName] ahora puede ocuparse de asuntos más importantes. Sólo nos queda esperar que, al menos por ahora, nuestros nobles puedan estar satisfechos con los resultados del Consejo y que nuestro reino sea más estable, unido y más fuerte para afrontar los desafíos venideros."
 me_parthia.43.a:0 "Menos mal que no tenemos elecciones..."
 me_parthia.43.tt:0 "¡#E Magastan#! ha concluido!"

 me_parthia.44.t:0 "Oficina de Spahbed"
 me_parthia.44.desc:0 "El cargo militar de #E Spahbed#! conlleva una gran autoridad y prestigio y es muy codiciado por las principales familias que viven en [ROOT.GetCountry.GetCapital.GetName], muchas de las cuales son acérrimos rivales entre sí. El Spahbed es uno de los oficiales militares de mayor rango en todo [ROOT.GetCountry.GetName] y tiene el deber sagrado de liderar nuestros ejércitos en la batalla. Operando como una extensión del testamento de [ROOT.GetCountry.GetRuler.GetName], el Spahbed conserva el título de por vida, y el cargo permanecerá en su familia durante las generaciones venideras.\n\nHa llegado el momento de nombrar un Spahbed, y si bien tenemos suerte de tener un puñado de contendientes fuertes para el puesto, sin duda, aquellos que no sean seleccionados se sentirán heridos: [ROOT.GetCountry.GetRuler.GetFirstName] tiene que elegir sabiamente."
 me_parthia.44.a:0 "Elijo [important_guy10.GetFamily.GetName]"
 me_parthia.44.tt.a:0 "[important_guy10.GetFamily.GetName] los miembros de la familia obtendrán #R #E @military_icon! 5 habilidades marciales#!#! al asumir el cargo de #E [GetOffice('office_master_of_the_guard').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#!.\nTodos los demás perderán #R 5 puntos marciales#! si son nombrados como Spahbed.\n[important_guy10.GetFamily.GetName] Los miembros de la familia se enojarían mucho si se nombrara un Spahbed ajeno a esta familia."
 me_parthia.44.b:0 "[important_guy20.GetFamily.GetName] merece el honor"
 me_parthia.44.tt.b:0 "[important_guy20.GetFamily.GetName] los miembros de la familia obtendrán #R #E @military_icon! 5 habilidades marciales#!#! al asumir el cargo de #E [GetOffice('office_master_of_the_guard').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#!.\nTodos los demás perderán #R 5 puntos marciales#! si son nombrados como Spahbed.\n[important_guy20.GetFamily.GetName] Los miembros de la familia se enojarían mucho si se nombrara un Spahbed ajeno a esta familia."
 me_parthia.44.c:0 "Prefiero elegir [important_guy30.GetFamily.GetName]"
 me_parthia.44.tt.c:0 "[important_guy30.GetFamily.GetName] los miembros de la familia obtendrán #R #E @military_icon! 5 habilidades marciales#!#! al asumir el cargo de #E [GetOffice('office_master_of_the_guard').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#!.\nTodos los demás perderán #R 5 puntos marciales#! si son nombrados como Spahbed.\n[important_guy30.GetFamily.GetName] Los miembros de la familia se enojarían mucho si se nombrara un Spahbed ajeno a esta familia."
 me_parthia.44.e:0 "Pensándolo bien, no es necesario hacerlo hereditario."

 me_parthia.45.t:0 "Caballos Niseanos"
 me_parthia.45.desc:0 "Una de las actividades favoritas de [ROOT.GetCountry.GetRuler.GetName] es cabalgar a través de la estepa abierta, con el viento soplando entre [ROOT.GetCountry.GetRuler.GetHerHis] el cabello y un buen [ROOT.GetCountry.GetAdjective] arco en [ROOT.GetCountry.GetRuler.GetHerHis] manos. El poderoso [ROOT.GetCountry.GetRulerTitle] tiene acceso a todo lo que [ROOT.GetCountry.GetRuler.GetSheHe] desea en esta vida, pero hay pocas cosas que sean más estimulantes que los placeres de galopar a través de la interminable extensión de nuestra patria.\n\nLos caballos @horses! han servido durante mucho tiempo a nuestro pueblo en tiempos de guerra y paz, y hay un buen argumento para decir que [ROOT.GetCountry.GetName] no sería lo que es sin nuestro caballería fuerte. Consciente de lo mucho que dependemos de estas bestias de guerra, [ROOT.GetCountry.GetRuler.GetFirstName] ha hecho más que la mayoría cuando se trata de fomentar la cría de excelentes sementales, particularmente la variedad #E Nisean#! que proviene de la #E meseta iraní#!. Con un excedente de estos magníficos animales a mano, [ROOT.GetCountry.GetRuler.GetFirstName] ahora debe decidir cómo se deben entrenar estas monturas."
 me_parthia.45.a:0 "@horse_archers! #E ¡Los arqueros a caballo#! son la columna vertebral de nuestro ejército!"
 me_parthia.45.b:0 "Es aconsejable que nos especialicemos en @heavy_cavalry! #E Caballería pesada#!"
 me_parthia.45.c:0 "@light_cavalry! #E Caballería Ligera#! nos ofrece la mejor flexibilidad"

 me_parthia.46.t:0 "Sistema de documentación"
 me_parthia.46.desc:0 "Originalmente, [ROOT.GetCountry.GetRuler.GetName] solo estaba preocupado por aumentar nuestra investigación, pero la implementación del nuevo #E Sistema de documentación#! en todas las academias de [ROOT.GetCountry.GetName] tuvo un efecto secundario interesante.\n\nA medida que se corrió la voz sobre los esfuerzos partos para consagrar lugares de aprendizaje en todo el reino, un hombre sabio llamado [SCOPE.sCharacter('isidoros').GetName] viajó a [ROOT.GetCountry.GetCapital.GetName] e inmediatamente se presentó ante el tribunal, pidiendo que [ROOT.GetCountry.GetRuler.GetFirstName] le ofreciera empleo. A cambio de proporcionar alojamiento a los macedonios, [isidoros.GetFirstName] prometió ayudar a nuestros investigadores y prometió que pronto superaríamos a todos los que se nos oponían."
 me_parthia.46.a:0 "Serás de gran ayuda para nosotros en los próximos días, Isidoros."
 me_parthia.46.tt:0 "Se puede emplear [isidoros.GetName|Y]."

 me_parthia.47.t:0 "Símbolo de poder"
 me_parthia.47.desc:0 "Después de muchos meses de cuidadosa construcción, los artesanos y maestros artesanos que viven en [ROOT.GetCountry.GetCapital.GetName] finalmente han terminado de trabajar en el tesoro encargado por [ROOT.GetCountry.GetRuler.GetName] y están listos para presentar su trabajo al noble [ROOT.GetCountry.GetRulerTitle]. [ROOT.GetCountry.GetRuler.GetFirstName] tenía muchas opciones para elegir, pero cuando llegó el momento de seleccionar qué tesoro se haría, no hubo dudas."
 me_parthia.47.a:0 "El #E Arco#!, arma preferida de nuestros antepasados, es lo más apropiado"
# me_parthia.47.tt1:0 ""
 me_parthia.47.b:0 "La insignia real más obvia es una #E Corona#!"
# me_parthia.47.tt2:0 ""
 me_parthia.47.c:0 "Los [ROOT.GetCountry.GetRuler.GetFamily.GetName] requieren un #E Trono#! adecuado"
# me_parthia.47.tt3:0 ""

 me_parthia.48.t:0 "Capitales Reales - Capital de la Corte"
 me_parthia.48.desc:0 "Lo primero es lo primero: debemos decidir la ubicación de nuestra cancha. Nuestro capital actual, si bien es perfectamente utilizable para los fines actuales, en el futuro puede resultar inadecuado para nuestras necesidades. Como tal, ¿tal vez deberíamos explorar otras posibilidades? Aprovechando esta oportunidad, podemos mover la capital de nuestro reino a [city_scope_1.GetName], [city_scope_2.GetName], [city_scope_3.GetName] o contentarnos con la estación actual."
 me_parthia.48.a:0 "Elija [city_scope_1.GetName]"
 me_parthia.48.b:0 "Elija [city_scope_2.GetName]"
 me_parthia.48.c:0 "La elección obvia es [city_scope_3.GetName]"
 me_parthia.48.d:0 "Nuestro capital actual es bueno."

 me_parthia.49.t:0 "Capitales Reales - Capital Ceremonial"
 me_parthia.49.desc:0 "Aunque hemos abandonado la estepa por la ciudad, nuestras raíces nómadas no deben olvidarse y podría ser prudente establecer una ciudad capital ceremonial, donde los gobernantes sean coronados al ascender al poder; ¿en algún lugar cercano a la región de Partia podría ser una elección inteligente? Eso seguramente vincularía más estrechamente nuestra base de poder con nuestros intereses. Afortunadamente, tenemos muchas más opciones y ningún súbdito nuestro se sentiría decepcionado por estar más cerca del Rey de Reyes."
 me_parthia.49.a:0 "La elección obvia es [city_scope_10.GetName]"
 me_parthia.49.b:0 "Elija [city_scope_20.GetName]"
 me_parthia.49.c:0 "Elija [city_scope_30.GetName]"
 
 me_parthia.50.t:0 "Capitales Reales - Capital del Tesoro"
 me_parthia.50.desc:0 "Una última cosa queda por concebir en esta materia, y es ahí dónde debería ubicarse nuestro tesoro. Obviamente, lo mejor sería un lugar seguro, pero por otro lado, algunos dicen que el mejor lugar para esconder algo es a plena vista. Sin embargo, dar cuenta de nuestra riqueza requeriría una legión de burócratas por sí sola y, como tal, se debería elegir una buena ciudad para ello."
 me_parthia.50.a:0 "Elija [city_scope_100.GetName]"
 me_parthia.50.b:0 "La elección obvia es [city_scope_200.GetName]"
 me_parthia.50.c:0 "Elija [city_scope_300.GetName]"

 me_parthia.51.t:0 "Ampliar la producción de alfombras"
 me_parthia.51.desc:0 "Para facilitar la producción de alfombras finas @leather! en [ROOT.GetCountry.GetName], los asesores económicos de [ROOT.GetCountry.GetRuler.GetName] inspeccionaron muchas de nuestras ciudades en busca de mercados que pudieran explotar. Debido a la gran necesidad de tintes @dye! y telas @cloth!, muchas ciudades se vieron obligadas a producir estos bienes comerciales, abandonando su industria local por orden del [ROOT.GetCountry.GetRulerTitle]. Los comerciantes extranjeros pagaban pequeñas fortunas por las alfombras y tapices que se encontraban en nuestros bazares, y [ROOT.GetCountry.GetRuler.GetFirstName] haría cualquier cosa [ROOT.GetCountry.GetRuler.GetSheHe] para quitarles las monedas de oro y plata a los comerciantes."
 me_parthia.51.a:0 "¡De alfombras a riquezas!"

 me_parthia.52.t:0 "Alfombras y ropa persas"
 me_parthia.52.desc:0 "Nunca en un millón de años [ROOT.GetCountry.GetRuler.GetName] pensó que el nombre [ROOT.GetCountry.GetRuler.GetHerHis] se convertiría en sinónimo de alta costura, pero eso es exactamente lo que sucedió. La demanda de nuestras prendas ha crecido a un ritmo exponencial y se ha vuelto imposible encontrar precios baratos dondequiera que mires. Gracias a la paz y la prosperidad sin precedentes que trajeron los partos, sus comerciantes y artesanos han podido hacer crecer sus industrias de maneras nunca antes imaginadas y, sin embargo, todavía somos incapaces de satisfacer la demanda. Nuestros textiles se han vuelto deseados en todo el mundo y nuestra fina #E ropa y alfombras persas#! se exportan a ciudades tanto del este como del oeste."
 me_parthia.52.a:0 "¿Qué haremos con todo ese dinero...?"

 me_parthia.53.t:0 "granero"
 me_parthia.53.desc:0 "[ROOT.GetCountry.GetRuler.GetName], te alegrará saber que las tierras de cultivo de [GetProvince('(int32)912').GetArea.GetRegion.GetName] están repletas de grano @grain!. Nuestros trabajadores están en los campos antes de que el sol esté sobre ellos, y a menudo tienen que terminar sus labores a la luz de las antorchas; esta región promete ser un granero que sustentará el creciente apetito de [ROOT.GetCountry.GetName]."
 me_parthia.53.a:0 "Los dioses nos han bendecido sin medida"

 me_parthia.54.t:0 "Dátiles mesopotámicos"
 me_parthia.54.desc:0 "Si bien el viejo dicho de que \"los ejércitos marchan boca abajo\" sigue siendo cierto, la dieta del soldado parto contrasta marcadamente con la de nuestros estados vecinos.\n\nGracias a las iniciativas de construcción implementadas por [ROOT.GetCountry.GetRuler.GetName], nuestros guerreros ahora pueden disfrutar de una variedad de alimentos mientras están en el campo, y de los alimentos básicos como pan @grain!, sal @salt!, aceite de oliva. @olive! y vino @wine! ahora se han complementado con fechas @dates!. Las frutas proporcionan nutrientes y variedad muy necesarios a nuestros trabajadores soldados, y aunque la vida en el ejército nunca es fácil, al menos la hora de comer es un poco más sabrosa de lo que era antes."
 me_parthia.54.a:0 "Un bien de lujo hecho más disponible, todo gracias a mí..."

 me_parthia.55.t:0 "Sal de Chehrabad"
 me_parthia.55.desc:0 "Si bien trabajar en las minas y canteras de [ROOT.GetCountry.GetName] sigue siendo una sentencia de muerte para las pobres almas encadenadas y enviadas a las profundidades del subsuelo, no hay otra opción; sin sus sacrificios, muchos otros que viven dentro de nuestro reino perecerían. Nuestros soldados necesitan hierro @iron! para sus armas, nuestros mercados necesitan oro @precious_metals! para acuñar monedas y comerciar, y necesitamos sal @salt! para conservar y dar sabor a nuestros alimentos."
 me_parthia.55.a:0 "[ROOT.GetCountry.GetName] carece de sal; ahora falta menos."

 me_parthia.56.t:0 "Vino persa"
 me_parthia.56.desc:0 "Se produce tanto vino @wine! en [ROOT.GetCountry.GetName] que la bebida se ha vuelto omnipresente y se ha convertido en una bebida que se consume en exceso en cada comida. [ROOT.GetCountry.GetRuler.GetName], famoso amante de las [ROOT.GetCountry.GetRuler.GetHerHis] copas, a menudo tiene que controlar su ritmo [ROOT.GetCountry.GetRuler.GetHerHim] durante el día mientras realiza asuntos oficiales para que [ROOT.GetCountry.GetRuler.GetSheHe] no tome una decisión precipitada.\n\nEsta sed de buen vino persa es compartida por la gente común, muchos de los cuales levantan un rítónico todas las noches para brindar por la buena salud de nuestro amado [ROOT.GetCountry.GetRulerTitle]."
 me_parthia.56.a:0 "Ahora, para no emborracharnos demasiado con esto... ¡hic!"

 me_parthia.57.t:0 "Aceitunas medianas: ¿cambiar como bien comercial?"
 me_parthia.57.desc:0 "Mi [ROOT.GetCountry.GetRulerTitle], nos han sugerido otro asentamiento que sería ideal para cultivar olivos @olive!, ¿qué te parece?"
 me_parthia.57.a:0 "¡Vamos a tenerlos!"
 me_parthia.57.b:0 "Las aceitunas son buenas, pero no ahí."

 me_parthia.58.t:0 "Prospección en Zagros: ¿cambiar el bien comercial?"
 me_parthia.58.desc:0 "Mi [ROOT.GetCountry.GetRulerTitle], nuestros exploradores que inspeccionan las #E Montañas Zagros#! han descubierto un lugar para construir una nueva mina. ¿Qué te parece? Los informes iniciales de nuestros supervisores afirman que hay minerales valiosos en la región que potencialmente podríamos explotar."
 me_parthia.58.a:0 "Claro, hagámoslo."
 me_parthia.58.b:0 "Pensándolo bien, tal vez no."

 me_parthia.5800.t:0 "Prospección en Zagros - Resultados"
 me_parthia.5800.desc:0 "[ROOT.GetCountry.GetRuler.GetName], nuestros esfuerzos para localizar nuevas fuentes de riqueza explotable en las #E Montañas Zagros#! han finalizado y nuestros hombres están felices de informar que su expedición no ha sido en vano."
 me_parthia.5800.a:0 "[prospecting_scope.GetName] ahora producirá #E metales básicos#!."
 me_parthia.5800.b:0 "[prospecting_scope.GetName] ahora producirá #E Hierro#!."
 me_parthia.5800.c:0 "[prospecting_scope.GetName] ahora producirá #E metales preciosos#!."
 me_parthia.5800.d:0 "[prospecting_scope.GetName] ahora producirá #E piedras preciosas#!."
 me_parthia.5800.e:0 "[prospecting_scope.GetName] ahora producirá #E Mármol#!."
 me_parthia.5800.f:0 "[prospecting_scope.GetName] ahora producirá #E Ámbar#!."
 me_parthia.5800.g:0 "[prospecting_scope.GetName] ahora producirá #E Cinabrio#!."
 me_parthia.5800.h:0 "[prospecting_scope.GetName] ahora producirá #E Lapislázuli#!."

 #me_parthia.5800.tt:0 ""
 me_parthia.59.t:0 "Prospección en Zagros: ¡los lugareños se oponen!"
 me_parthia.59.desc:0 "Terribles noticias desde las #E Montañas Zagros#!, o [ROOT.GetCountry.GetRuler.GetName]: nuestros peores temores se han hecho realidad. Los lugareños que viven en la región nos han acusado de blasfemia, porque las montañas son sagradas para ellos, y afirman que hemos perturbado los huesos de sus antepasados ​​con nuestros pinchazos y pinchazos en el campo. Un grupo de rebeldes ha atacado nuestra expedición, matando a algunos [ROOT.GetCountry.GetAdjective] buenos hombres, ¡y parece que tenemos una revuelta entre manos!"
 me_parthia.59.a:0 "¡No mostraremos piedad a la escoria traidora!"
 me_parthia.59.tt:0 "¡Debemos aplastar a los rebeldes!"

 me_parthia.60.t:0 "Avance hacia Anatolia"
 me_parthia.60.desc:0 "Ahora, con nuestra conquista de #E Irán#! y estableciendo nuestra influencia directa sobre él, podemos intentar cruzar el poderoso río Éufrates y reclamar las tierras al oeste de él. La incorporación de #E Cilicia#! será un buen trampolín para futuras conquistas, y atravesar la frontera montañosa de #E Anatolia#! más hacia el interior nos proporcionará acceso a las llanuras del centro de la península."
 me_parthia.60.a:0 "¡Esa península será nuestra!"
 # me_parthia.60.tt:0 ""

 me_parthia.61.t:0 "Rompiendo el interior"
 me_parthia.61.desc:0 "Las llanuras de Anatolia central son una réplica casi perfecta del clima estepario que no hace mucho llamábamos nuestro hogar. Como tal, es muy probable que también encajemos muy bien aquí y ciertamente usaremos esta tierra como base de operaciones para impulsar nuestros planes aún más."
 me_parthia.61.a:0 "Buen trabajo"
 # me_parthia.61.tt:0 ""

 me_parthia.62.t:0 "Llegando al mar"
 me_parthia.62.desc:0 "Ahora, con nuestros caballos pastando en las costas del #E Egeo#!, hemos llegado a los límites de Asia y hemos cumplido nuestras ambiciones, al menos por el momento. Las personas que viven aquí son los dueños del mar y expertos en la construcción naval, y sus conocimientos pueden usarse si queremos intentar hacer lo que los grandes #E Aqueménidas#! no lograron: conquistar a los molestos #E Helenos#!. Eso ciertamente nos inmortalizaría en los anales de la historia, prácticamente asegurando nuestro lugar como el imperio que sucedió a la primera gran dinastía iraní."
 me_parthia.62.a:0 "Ahora debemos planear aplastar a los helenos."
# me_parthia.62.tt:0 ""

 me_parthia.63.t:0 "$parthia_missions_38$"
 me_parthia.63.desc:0 "Las tierras de #E Siria#! siempre han sido un rico centro de comercio y, como tal, es natural que caigan bajo nuestro dominio. Los ricos centros comerciales sirios en la costa aumentarán enormemente nuestros ingresos, sin importar la fuerte y unida población #E aramea#!, que, cuando se la atienda, se convertirá en uno de los pueblos más fuertes que vivirán en nuestro imperio. Su lengua era también la lengua de administración del reino #E aqueménida#!, lo que demuestra lo desarrollado e importante que es mantener aquí relaciones cordiales con los lugareños."
 me_parthia.63.a:0 "La tierra más allá del Éufrates será nuestra..."
# me_parthia.63.tt:0 ""

 me_parthia.64.t:0 "$parthia_missions_39$"
 me_parthia.64.desc:0 "Con la incorporación de #E Siria#! a [ROOT.GetCountry.GetName], nuestras oportunidades se multiplican por diez. Poseer algo de costa a lo largo del Mediterráneo resultará muy valioso cuando llegue el momento de proyectar poder en los mares.\n\nAhora debemos asegurarnos de que #E Canaán#! sea también nuestro: ese antiguo corredor en el Levante, que es una puerta de entrada a las tierras de #E Egipto#!."
 me_parthia.64.a:0 "¡Toda Siria es nuestra!"
# me_parthia.64.tt:0 ""

 me_parthia.65.t:0 "$parthia_missions_40$"
 me_parthia.65.desc:0 "#E Canaán#! ha caído bajo nuestra influencia, y la siguiente tarea de nuestros ejércitos es cruzar el peligroso desierto del Sinaí y romper las fortalezas que protegen las tierras del Nilo. #E Egipto#! demostrará ser una gran fuente de ingresos para [ROOT.GetCountry.GetName], ya que es una de las tierras más pobladas del planeta y el centro de fuerza más poderoso de las costas mediterráneas."
 me_parthia.65.a:0 "¡Adelante a la Tierra de los Faraones!"
# me_parthia.65.tt:0 ""

 me_parthia.66.t:0 "Preparación india"
 me_parthia.66.desc:0 "Los preparativos para nuestra invasión del #E subcontinente indio#! finalmente se han completado. Pronto los gobernantes locales, por numerosos y vastos que sean sus séquitos, temblarán ante el poder de nuestros ejércitos."
 me_parthia.66.a:0 "¡Superaremos las obras del mismísimo #E Alejandro#!!"
# me_parthia.66.tt:0 ""

 me_parthia.67.t:0 "Conquista del Indo"
 me_parthia.67.desc:0 "A medida que nuestros ejércitos irrumpieron en el #E continente indio#! y aseguraron su influencia sobre las llanuras de la #E Pentapotamia#!, se les mostró lo extraña y ajena que es la India. Es asombrosamente rica, densamente poblada y hogar de animales y plantas que pocos de los habitantes de las grandes estepas han visto alguna vez con sus propios ojos. También hay una gran cantidad de elefantes, hasta el punto de que los pequeños reyes a menudo presentan más de ellos en batalla que los reyes más grandes del oeste.\n\nAquí es también donde los ejércitos de Alejandro una vez regresaron a casa, dejando que los pueblos indios reclamaran estas satrapías... ¡verdaderamente, un lugar magnífico!"
 me_parthia.67.a:0 "Ganancias constantes"
# me_parthia.67.tt:0 ""

 me_parthia.68.t:0 "Al otro mar"
 me_parthia.68.desc:0 "Con el norte de #E India#! prácticamente abierto, nuestra presencia está asegurada y todos en la región saben que estamos aquí para quedarnos; no se trata de una ocupación temporal, sino permanente. Sin embargo, nuestra marcha hacia adelante no debe detenerse: hacia el este, todavía hay más territorio que conquistar, y si tenemos éxito en este sentido, seremos el primer Imperio que se extenderá desde el #E Mediterráneo#! hasta el #E Singus Gangeticus#!."
 me_parthia.68.a:0 "¡Partia se extenderá de este a oeste!"
# me_parthia.68.tt:0 ""

 me_parthia.69.t:0 "Múdate a Bactria"
 me_parthia.69.desc:0 "Durante mucho tiempo [ROOT.GetCountry.GetRuler.GetName] ha codiciado las legendarias ciudades de [GetCountry('BAC').GetName] para la gente de [ROOT.GetCountry.GetName], y aunque muchos creían que tomarlas directamente sería imposible sin equipo pesado de asedio y años de suministros, [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] ha logrado desafiar las expectativas de todos una vez más.\n\nDespués de un conflicto gloriosamente sangriento, los ejércitos bactrianos han sido destruidos. Y sus fortificaciones han sido arrasadas, y objetos de oro y plata fueron saqueados de sus templos y santuarios y enviados a [ROOT.GetCountry.GetCapital.GetName] como tributo."
 me_parthia.69.a:0 "Conquistar esta región era solo cuestión de tiempo"
# me_parthia.69.tt:0 ""

 me_parthia.70.t:0 "Conquistar la estepa"
 me_parthia.70.desc:0 "En un glorioso regreso al lugar donde empezó todo, los ejércitos triunfantes de [ROOT.GetCountry.GetName] hicieron a un lado silenciosamente cualquier potencia rival en las estepas, asumiendo el control directo del vasto territorio para los ejércitos [ROOT.GetCountry.GetRuler.GetName] y [ROOT.GetCountry.GetRuler.GetHerHis].\n\nDespués de que las levas partas se disolvieron, se dice que [ROOT.GetCountry.GetRulerTitle] visitó personalmente el interminable mar de hierba con [ROOT.GetCountry.GetRuler.GetHerHis] séquito, cabalgando durante horas sin agenda además de sentir el viento en [ROOT.GetCountry.GetRuler.GetHerHis] cabello y el sol en [ROOT.GetCountry.GetRuler.GetHerHis] cara."
 me_parthia.70.a:0 "Esto es lo más lejos que vale la pena llegar."
# me_parthia.70.tt:0 ""

 me_parthia.71.t:0 "Cuenca del Tarim"
 me_parthia.71.desc:0 "Hemos recibido una petición de las distintas ciudades de la #E Cuenca del Tarim#!, que se han unido como una sola para pedir indulgencia a los [ROOT.GetCountry.GetRuler.GetName] conquistadores tras su derrota y sumisión. Admitiendo que su gran distancia con [ROOT.GetCountry.GetCapital.GetName] hace que la comunicación regular con ellos sea, en el mejor de los casos, difícil, nos han pedido que les concedamos el estado #E Marzo#!, alegando que este privilegio es común para [ROOT.GetCountry.GetName]. A cambio de esto, prometen cumplir con sus deberes y permanecer leales a los #E [ROOT.GetCountry.GetRuler.GetFamily.GetName]#!."
 me_parthia.71.a:0 "No es necesario tratar esta región de manera diferente"
# me_parthia.71.tt1:0 ""
 me_parthia.71.b:0 "Nuestro comercio estaría mejor asegurado con una #E marcha#!"
 me_parthia.71.tt2:0 "Crearemos #E Tocharia#! como nuestra #E Marcha#! en la región."
 
 me_parthia.80.t:0 "Un panteón parto"
 me_parthia.80.desc:0 "Fue un movimiento que pocos previeron que sucedería, pero muchos finalmente se vieron impactados por la fatídica decisión; [ROOT.GetCountry.GetRuler.GetName], después de muchas horas de fructífera discusión con el #E Mobadan Mobad#! y otros asesores religiosos, estaba preparado para convertirse a una fe extranjera."
 me_parthia.80.a:0 "Seguiremos la #E Religión de Mitra#!"
 me_parthia.80.b:0 "Seguiremos la #E Religión de Ahuramazda#!"
 me_parthia.80.c:0 "Seguiremos la #E Religión de los griegos#!"
 me_parthia.80.d:0 "Seguiremos la #E Religión de Babilonia#!"
 me_parthia.80.e:0 "Seguiremos el #E Camino del Buda#!"

 me_parthia_223.t:0 "La conversión de [ROOT.GetCountry.GetRuler.GetName] Parte I"
 me_parthia_223.desc:0 "La idea de intentar convencer a #E Irán#! de que se convierta al #E budismo#! no está exenta de oponentes, incluido el propio [ROOT.GetCountry.GetRulerTitle|E]. Sin embargo, muchos sí ven la oportunidad que brinda la fe joven. Es muy popular entre las rutas de la ruta de la seda y podría fomentar un mejor comercio con las riquezas de #E Hind#!. Los nobles del este encuentran especialmente valiosa esta perspectiva. Como el [ROOT.GetCountry.GetRulerTitle|E] es cortejado por #E zoroastrianos, mitraicos#! y #E helénicos#!, los nobles orientales han enviado a buscar a un #E budista#! asceta de #E Gandhara#!."
 me_parthia.223.a:0 "Oh, él viene de una tierra, de un lugar lejano~"
 me_parthia.223_tt:0 "Los nobles orientales han enviado a buscar a un #BOLD;COLOR:{0.98,0.93,0.51} budista#! de #T Gandhara#!"

 me_parthia_2231.t:0 "La conversión de [ROOT.GetCountry.GetRuler.GetName] Parte II"
 me_parthia_2231.desc:0 "Aunque los estandartes de [ROOT.GetCountry.GetName|E] ondearon alto y sus enemigos yacían destrozados, la paz eludió a [ROOT.GetCountry.GetRuler.GetName], Rey de Reyes. Durante siete días, [ROOT.GetCountry.GetRuler.GetSheHe] no recibió enviados ni escuchó elogios. Las sombras se aferraban incluso a la victoria. Entonces, sin heraldo ni citación, llegó un viajero a [ROOT.GetCountry.GetCapital.GetName|E]. Vestido con túnicas sencillas, ojos misteriosos como agua arremolinada, fue llevado ante el trono, no por orden, sino por algo tácito que se agitó en el pecho del rey.\n\n\"Has forjado un imperio a partir del polvo de los jinetes\", comenzó el extraño. \"Has quebrantado a señores poderosos. ¿Por qué entonces tiembla tu espíritu? ¿No es la conquista lo que te aflige, sino la conciencia?\"\n\n[ROOT.GetCountry.GetRuler.GetFirstName|E] frunció el ceño. \"He hecho matar hombres por menos. ¿Por qué entonces, me pregunto, tu cabeza todavía descansa sobre tus hombros?\"\n\nEl viajero sonrió. \"Porque no vengo con la intención de insultar, sino de dar medicina. Déjame enseñarte el #E Dharma del Buda#!.\"\n\nDurante un largo rato, el Rey de Reyes guardó silencio. Luego asintió una vez. \"Habla, entonces. Porque si hay un camino más allá de la espada, me enteraré de él\"."
 me_parthia.2231.a:0 "Quizás este misterioso #E 'asceta'#! realmente tenga la respuesta..."

 me_parthia_2232.t:0 "La conversión de [ROOT.GetCountry.GetRuler.GetName] Parte III"
 me_parthia_2232.desc:0 "Han pasado muchos días desde que [SCOPE.sCharacter('buddhist_parthia').GetName] llegó por primera vez a [ROOT.GetCountry.GetCapital.GetName]. Ya no era visto como un extraño, sin embargo, todavía vestía con sencillez mientras caminaba por los pasillos del templo.\n\nUna noche, el sabio preguntó [ROOT.GetCountry.GetRuler.GetName] \"Oh, dime, [ROOT.GetCountry.GetRulerTitle|E], ¿qué pasa si pongo mi mano en esta llama?\"\n\n[ROOT.GetCountry.GetRuler.GetName] responde, intrigado por la simple pregunta. \"Te quemará.\"\n\n\"¿Incluso si no creo en el fuego?\"\n\nEl rey se burla. \"La creencia no cambia nada. El fuego arde de todos modos.\"\n\n\"Así es\", dijo la maestra. \"Y lo mismo ocurre con la violencia. Ya sea que la pensemos justa, necesaria o gloriosa, de todos modos arde. Quema la mano que golpea y el corazón que ordena el golpe\". [ROOT.GetCountry.GetRuler.GetName] no se burló más, se quedó en silencio. [SCOPE.sCharacter('buddhist_parthia').GetName] continúa: \"Empuñar la espada es fácil. Deponerla requiere mayor fuerza. La misericordia no es la ausencia de poder, sino su dominio\". [ROOT.GetCountry.GetRuler.GetFirstName] se miró las manos, encallecidas no por el trabajo, sino por la guerra. No dijo nada, pero el peso de la espada a su costado parecía más pesado que antes.\n\nMás tarde esa noche, la corte notó algo extraño: la voz del rey era más tranquila. No despidió a nadie con ira. No habló con nadie con rabia. Y recibía los insultos con misericordia en lugar de con la ira de su espada. Parecía... más en paz. El fuego todavía estaba encendido, pero ahora [ROOT.GetCountry.GetRuler.GetName|E] sintió su calor."
 me_parthia.2232.a:0 "Entonces este es el poder de #E Ahisma#!."

 me_parthia_2233.t:0 "La conversión de [ROOT.GetCountry.GetRuler.GetName] Parte IV"
 me_parthia_2233.desc:0 "Se emitió una proclama desde el palacio en [ROOT.GetCountry.GetCapital.GetName|E], llevada en seda y piedra por igual, a todos los rincones del reino. Que se sepa, [ROOT.GetCountry.GetRuler.GetName|E], Rey de Reyes, se ha refugiado en el #E Dharma#!. En este año de reinado [ROOT.GetCountry.GetRuler.GetHerHis], movido no por la conquista sino por la verdad, el Rey ha abrazado el camino del #E Buda#!. El camino de la sabiduría, la compasión y la no violencia."
 me_parthia_2233.a:0 "Así comienza una nueva era para [ROOT.GetCountry.GetName]."

 me_parthia_224.t:0 "$parthia_missions_124$"
 me_parthia_224.desc:0 "A medida que continúan las interacciones entre los #E persas#! y el #E budismo#!, la iconografía y el epíteto del señor #E Ahuramazda#! se han asociado con el #E Buda#!. La gente ha comenzado a llamarlos como uno solo, como el sabio señor #E Buda-Mazda#!. Canonizar este culto hará que sea más fácil convertir a aquellos que todavía se oponen a la fe extranjera, haciendo que la gente comprenda que no necesitan perder su relación con la religión para apreciar las enseñanzas de #E Buda-Mazda#!."
 me_parthia.224.a:0 "Maestro tanto de Asha como de Dharma."

 me_parthia_225.t:0 "$parthia_missions_125$"
 me_parthia_225.desc:0 "Durante años, las enseñanzas del #E Buda#! solo fueron estudiadas por los monjes mediante la recitación del #E Canon Pali#!. Sin embargo, el canon no está en la lengua de nuestro pueblo ni de nuestros gobernantes. Por lo tanto, la sabiduría del #E Dharma#! siguió siendo una melodía extraña para muchos. Ahora, después de mucho trabajo por parte de monjes devotos y escribas eruditos, el #E Vinaya#!, el #E Sutta#! y el #E Abhidhamma#! se han incorporado al discurso de nuestras cortes y nuestro pueblo. Con tinta y pergamino, las Tres Cestas de la Ley han cruzado un nuevo umbral, convirtiéndose en la primera traducción completa del #E Tipitaka#! a un idioma iraní."
 me_parthia_225.a:0 "Tipitaka? Te refieres a Sepitak"

 me_parthia_226.t:0 "$parthia_missions_126$"
 me_parthia_226.desc:0 "Los antiguos sistemas de calendario de #E Irán#! cuentan cada uno una historia diferente. #E Los zoroastrianos#! marcan desde el año de la revelación, los #E macedonios#! desde las #E reconquistas de Selukos#! y los #E caldeos#! desde las estrellas. Pero ahora, la rueda del #E Dharma#! ha girado. A medida que nuestra devoción al #E Buda#! se profundiza, nuestros monjes y funcionarios han llegado a un consenso: contaremos desde la Iluminación del Bendito. El año no comenzará con conquistas ni templos de fuego, sino con el momento en que #E Siddhartha#! se convirtió en el #E Buda#! bajo el árbol Bodhi."
 me_parthia_226.a:0 "Un nuevo calendario para un nuevo imperio."

 me_parthia_227.t:0 "$parthia_missions_127$"
 me_parthia_227.desc:0 "A medida que se difunden las historias de una transformación sagrada, muchas personas de todo el imperio llegan a la gran ciudad de #E Hagmatana#!. Lo que una vez fue el orgulloso #E Gran Templo del Fuego#!, un faro de la antigua fe, ahora se levantó nuevamente como la #E Gran Estupa del Fuego#!, con su cúpula brillando al sol como una llama sostenida hacia el cielo. El fuego sagrado todavía ardía, pero ahora lo hacía bajo agujas talladas con pétalos de loto y versos #E dhármicos#!. Dentro del santuario de la estupa, monjes y magos ofrecieron oraciones, no en oposición, sino en reverencia compartida por la luz que guía todos los caminos."
 me_parthia_227.a:0 "Quizás debería mudarme allí también..."

 me_parthia_230.t:0 "$parthia_missions_130$"
 me_parthia_230.desc:0 "Estar imbuido de #E Kharenah#!, o #E Khvarenah#! es estar imbuido de gloria y esplendor divinos. El único ser en todo el Universo que puede imbuir a Kharenah es el del gran #E Mithra-Mitreya#!. Y por la gracia de su santa luz, nuestro líder, el gran #E Rey de Reyes [ROOT.GetCountry.GetRuler.GetName]#!, ha sido imbuido de este poder."
 me_parthia_230.a:0 "¡Gloria a nuestra santa dinastía!"

 me_parthia_231.t:0 "$parthia_missions_131$"
 me_parthia_231.desc:0 "#E [ROOT.GetCountry.GetRuler.GetName]#!, el Rey de Reyes y protector del reino, había iniciado su retirada de los placeres cortesanos. Sentado en silencio bajo árboles tipo Bodhi plantados en los jardines del palacio, se volvió hacia adentro. Se decía que había alcanzado #E Dharana#!, la sexta perfección, donde los pensamientos no se mueven más que una llama quieta en una cámara sin viento. Los ministros presentaron peticiones; él permaneció impasible. Los enviados trajeron tributo; él simplemente asintió. Su mirada, tranquila y sin pestañear, parecía pesar no sólo a los hombres, sino a mundos enteros. Ya no es simplemente un Rey de Reyes, ha comenzado a recorrer el camino de un #E Cakravartin#!, un gobernante mundial no por la espada, sino por el Dharma."
 me_parthia_231.a:0 "El Huevo Universal será el reino de [ROOT.GetCountry.GetRuler.GetName]."

 me_parthia_232.t:0 "$parthia_missions_132$"
 me_parthia_232.desc:0 "El rey alguna vez había sido un buscador de disciplina, dominando #E Dharana#! en silencio y quietud. Pero ahora dicen que ha ido aún más allá, más allá del enfoque, hacia #E Dhyana#!, el trance meditativo donde el pensamiento se disuelve en claridad. Su corte permanece en silencio, no por miedo, sino por reverencia, mientras habla menos y ve más.\n\nCon esta nueva quietud, los sabios extranjeros han llegado para presentar sus respetos, entre ellos, #E griegos#! del este, portando pergaminos escritos en oro, hablando de los dioses que ahora caminan con el #E Dharma#!. Hablan de los llamados protectores del #E Buda#!, como #E Herakles Vajpranios#!, el protector que empuña el trueno con la fuerza de un león, y #E Wardo#!, el dios de la tormenta y el viento salvaje, renacido como guardián del silencio sagrado."
 me_parthia_232.a:0 "¡Esos griegos, siempre un grupo inventivo!"

 me_parthia_233.t:0 "$parthia_missions_133$"
 me_parthia_233.desc:0 "Al amanecer, mientras el incienso flotaba sobre las escaleras del palacio en #E [ROOT.GetCountry.GetCapital.GetName]#!, se leyó una proclama bajo pancartas que llevaban la #E Rueda del Dharma#!. Los nobles, campesinos y monjes se reunieron en silencio, esperando escuchar lo que durante mucho tiempo se había susurrado en los pasillos de los templos y monasterios. Por decreto real, los antiguos ritos ligados a la llama y al linaje debían dejarse de lado. En su lugar, el #E Dharma#! del #E Iluminado#! se convertiría en la luz guía del reino. El Rey, después de estudiar los sutras sagrados y sentarse en silencio bajo los #E árboles Bodhi#! plantados dentro de los muros del palacio, había elegido el #E Camino Medio#!.\n\nA partir de ese día, el #E budismo#! no sólo fue permitido: fue proclamado. No sólo una fe, sino el alma del reino mismo."
 me_parthia_233.a:0 "Que el sabio nos lleve al Nirvana."

 me_parthia_235.t:0 "$parthia_missions_135$"
 me_parthia_235.desc:0 "Durante días, el palacio quedó en silencio. Los ministros caminan silenciosamente por sus pasillos. No se dieron órdenes ni se resolvieron disputas. En el corazón de la capital, bajo un dosel de incienso y silencio, el rey permanecía inmóvil.\n\nLos monjes de todos los rincones del reino se reunieron maravillados, susurrando sobre un raro estado: #E Samadhi#!. Perfecta quietud mental. La puerta a la verdad más allá de la ilusión. En la séptima noche, dicen que entró en el #E Nirvana#! de la vida, #E Sopadhishesa Nirvana#!, ninguna llama lo consumió, no se pronunció ningún adiós y, sin embargo, algo en él se había desvanecido. Miedo, duda, apego. Cuando por fin se levantó, sus ojos contemplaron la inmensidad del cielo. Su voz, cuando regresó, no habló con autoridad, sino con conocimiento. Se había convertido no sólo en rey, sino en algo más. El #E Cakravartin#! en verdad, que gobierna no con espada o decreto, sino solo con presencia."
 me_parthia_235.a:0 "Mis ojos están abiertos."

 me_parthia_280.t:0 "El debate entre budistas y magos"
 me_parthia_280.desc:0 "Se corre la voz por toda la tierra de Media, se va a celebrar un debate entre la poderosa #E clase de los magos medianos#! y los #E monjes budistas#!.\n\nPara que este debate vaya bien, nuestros #E líderes de la corte budista#! solicitan una suma para transportar a un grupo de monjes desde lugares tan lejanos como [GetProvince('(int32)7314').GetName|E], [GetProvince('(int32)4440').GetName|E] e incluso [GetProvince('(int32)6950').GetName|E]."
 me_parthia_280.a:0 "Confiaremos en los #E budistas partos#!."
 we_will_have_lower_odds:0 "Confiaremos en el monje #Y parto#! más joven e inexperto."
 me_parthia_280.b:0 "No escatimaremos en gastos."
 we_will_have_good_odds:0 "Confiaremos en los monjes #Y indios#! más antiguos y sabios.\nEsto provocará un debate adicional entre las escuelas #T Mahayana#! y #T Theravada#!."
 medians_upset_mod:0 "Debate entre budistas y magos: metáforas vagas"

 me_parthia_2800.t:0 "Debate I: La cuestión del fuego"
 me_parthia_2800.a:0 "[SCOPE.sCharacter('pahlavi_buddhist_dude').GetName|E] habla."
 me_parthia_2800.b:0 "[SCOPE.sCharacter('punjabi_buddhist_dude').GetName|E] habla."
 me_parthia_2800.c:0 "[SCOPE.sCharacter('sinhali_buddhist_dude').GetName|E] habla."

 me_parthia_2801.t:0 "Debate II: La Materia del Alma"
 me_parthia_2801.desc:0 "En el patio real, donde el incienso se mezcla con el polvo, los Reyes Magos abren con firme convicción.\n\n\"El alma\", los seres [SCOPE.sCharacter('pahlavi_mithra_dude').GetName|E] es eterna. Es juzgada en el #E Puente de la Separación#!, recompensada o castigada según la verdad.\n\n\"Un #E budista#! da un paso adelante, con voz tranquila.\n\n \"Lo que llamas alma es sólo un conjunto de causas. No hay un yo para juzgar, sólo las acciones y sus ecos.\"\n\nUn murmullo se eleva desde la corte.\n\n\"¿Entonces qué es lo que renace?\" [SCOPE.sCharacter('median_mithra_dude').GetName|E] pregunta en voz alta. Otro #E budista#! responde: \"No es el yo, sino el fuego que pasó de una lámpara a otra. Otro.\"\n\n[SCOPE.sCharacter('median_mithra_dude_2').GetName|E] interviene: \"Ofreces humo en lugar de espíritu\".\n\nLa atmósfera se tensa. Este debate puede dejar más que la doctrina sin resolver... los ojos se mueven hacia [SCOPE.sCharacter('pahlavi_buddhist_dude').GetName|E], ¿cómo responderán?"

 me_parthia_2801.a:0 "Quizás el alma no sea eterna, pero aún así valga la pena honrarla."
 why_can_we_do_this_tt:0 "Esta opción está disponible gracias a la tutela de los #T monjes indios#!."
 me_parthia_2801.b:0 "Si tu alma arde de ignorancia, ¿de qué sirve su eternidad?"
 me_parthia_2801.c:0 "Incluso si diferimos, ambos buscan poner fin al sufrimiento."


 me_parthia_2802.t:0 "Debate especial: La cuestión de los caminos"
 me_parthia_2802.desc:0 "Después de días de dirigirme a los #E Reyes Magos#!, surge un momento inesperado. Los monjes de #E Gandhāra#! y #E Anurādhapura#! comienzan a debatir entre sí. [SCOPE.sCharacter('gandhara_buddhist_dude').GetName|E], el elocuente filósofo #E Mahāyāna#!, plantea una pregunta al anciano monje #E Theravāda#!, [SCOPE.sCharacter('sinhali_buddhist_dude').GetName|E]:\n\n\"¿No es mayor\", pregunta, \"retrasar el propio #E Nirvana#! por compasión hacia todos los seres?\"\n\nEl monje #E Lanka#! responde con calma:0 \"Domarse a uno mismo no es una tarea fácil. Antes de rescatar a otros de la inundación, primero hay que llegar a la orilla\".\n\nUn destello de tensión recorre el pasillo. La voz de [SCOPE.sCharacter('gandhara_buddhist_dude').GetName|E] se agudiza:0 \"¿Pero de qué sirve una costa de la que nadie regresa? El mundo se ahoga mientras los santos miran hacia otro lado\".\n\nLa mirada de [SCOPE.sCharacter('sinhali_buddhist_dude').GetName|E] se estrecha. \"¿Y qué es un voto si sólo conduce a seguir vagando?\"\n\nSu tono se eleva, no con ira, sino con firme desafío. El tribunal se agita. Algunos nobles intercambian miradas. Incluso los #E Reyes Magos#! parecen divertidos.\n\nAntes de que el momento se rompa, [SCOPE.sCharacter('pahlavi_buddhist_dude').GetName|E] da un paso adelante. Con las manos juntas, se inclina ante ambos y dice:"
 me_parthia_2802.a:0 "\"Primero cruzar, luego guiar\"."
 favors_theravada:0 "Favorece a Theravāda"
 debate_disagreement:0 "Despreciado por el debate"
 me_parthia_2802.b:0 "\"Nadie es libre hasta que todos sean libres\"."
 favors_mahayana:0 "Favorece a Mahāyāna"
 me_parthia_2802.c:0 "\"Ambos caminos conducen hacia adelante.\""

 me_parthia_2803.desc:0 "El monje [SCOPE.sCharacter('pubjabi_buddhist_dude').GetName|E], vestido con túnicas de color índigo, lleva pergaminos en #E Kharoshthi#! y #E griego#!. Él se inclina ligeramente antes de dirigirse al tribunal en un fluido #E arameo aqueménida#!.\n\n\"No rechazamos el fuego\", comienza. \"Pero nos preguntamos: ¿qué es lo que arde? ¿Es una sustancia? ¿Un símbolo? ¿O un objeto mental?\" Cruza lentamente el pasillo, \"En la escuela Yogācāra, hablamos de percepción y proyección. El fuego que ves está tanto dentro como fuera de ti. La iluminación no es escapar del mundo, sino verlo correctamente.\"\n\nLos Magos responden con certeza ritual, pero la corte está intrigada. Estos monjes hablan con acertijos, pero con el peso de la razón detrás de ellos."
 me_parthia_2803.a:0 "Debaten como los griegos, pero buscan algo más profundo."
 appeal_to_greek_thought:0 "Victoria del debate greco-budista"

 me_parthia_2804.desc:0 "El monje vestido de azafrán de #E Anudhapura#!, [SCOPE.sCharacter('sinhali_buddhist_dude').GetName|E], es sereno y preciso. Se inclina profundamente y recita una estrofa del #E Dhammapada#!, luego se dirige al tribunal:\n\n\"Ustedes hablan de un fuego que castiga. Hablamos de un fuego que purifica, no con dolor, sino con perspicacia. La nuestra es la llama de la renuncia. No exige sangre, sino disciplina\". Y continúa: \"Así como el fuego consume combustible, la sabiduría consume el anhelo. Cuando el anhelo desaparece, no es necesario que quede fuego\".\n\nSu simplicidad es sorprendente, su lógica limpia. Los Reyes Magos responden, pero su voz ya no domina la sala."
 me_parthia_2804.a:0 "No hay fuego en sus voces, pero queman todo argumento."
 appeal_to_mystic_thought:0 "Diálogo entre místicos y budistas"

 me_parthia_2805.desc:0 "[SCOPE.sCharacter('pahlavi_buddhist_dude').GetName|E] se pone nervioso mientras intentan transmitir una metáfora profunda en términos desconocidos. \"Hay... un fuego dentro del corazón\", dice uno, \"que... ¿quema el velo de la ilusión?\"\n\nSu sinceridad es clara, pero sus palabras fallan. Los Reyes Magos responden con elocuencia y ritual. Gran parte del tribunal permanece impasible."
 me_parthia_2805.a:0 "\"Tontos bien intencionados, pero tontos al fin y al cabo.\""

 me_parthia_2806.desc:0 "[SCOPE.sCharacter('pahlavi_buddhist_dude').GetName|E] da un paso adelante con silenciosa humildad. Les falta pulido, hablan desde el corazón.\n\n\"No honramos ningún fuego exterior\", dice el [SCOPE.sCharacter('pahlavi_buddhist_dude').GetName|E].\n\n\"Pero dentro de cada persona hay una luz que crece a medida que aprenden a dejarse llevar.\n\nSu sinceridad conmueve a algunos oyentes, pero sus metáforas son vagas, su lenguaje impreciso. #E Los magos#! responden con confianza, y muchos en la corte se sienten inclinados hacia lo familiar."
 me_parthia_2806.a:0 "\"Tienen buenas intenciones, pero las palabras no son suficientes\"."

 me_parthia_2807.t:0 "Debate: Conclusión"
 me_parthia_2807.desc:0 "Las últimas palabras del debate resuenan en el salón real, no en volumen sino en peso. Los #E budistas#! hablan de impermanencia; los #E Reyes Magos#!, de la eternidad. Cada uno ofrecía visiones del mundo: uno como un fuego que pasa de lámpara en lámpara, el otro como una llama que se mantiene firme en la oscuridad.\n\nEl tribunal está en silencio ahora. Sin aplausos, sin veredicto. Solo ojos pensativos, algunos se entrecerraron con duda, otros se abrieron con asombro. El rey permanece quieto, su rostro ilegible. La gente habla. Algunos encienden velas en los templos del fuego. Otros colocan pétalos de loto cerca de la estupa."
 me_parthia_2807.a:0 "Los magos son formidables y los budistas sabios."

 me_parthia_281.t:0 "El Mahayana Mitra"
 me_parthia_281.desc:0 "Nuestro pueblo siempre ha amado al dios #E Mitra#!, y con la introducción del #E budismo#!, se difunde una nueva creencia de que la luz divina #E Mitra#! y el futuro Buda #E Mitreya#! son uno. Se le llama #E Mithra-Mitreya#!, el Destructor del Nirvana. Aunque es capaz de trascender, permanece por elección propia, guardando la verdad y guiando al mundo hacia la compasión. Une el pacto de luz con la misericordia de un #E Bodhisattva#!. En él, la disciplina y la bondad caminan de la mano, esperando el momento en que el #E Dharma#! deba renacer."
 me_parthia_281.a:0 "La primera luz y el último Buda."

 compromised_debate:0 "Debate entre budistas y magos: compromiso"
 fck_you_buddha:0 "Debate entre budistas y magos: enemigos no consolables"
 debates_of_magi:0 "Debate entre budistas y magos: victoria budista"
 debate_begins_tt_tt:0 "Se llevará a cabo un #BOLD;COLOR:{0.98,0.93,0.51} Budista#!#E -#!#BOLD;COLOR:{0.98,0.53,0.98} Magi#! #E Debate#! y puede darnos varios modificadores."

 me_parthia.101.t:0 "Encontré a Nisa"
 me_parthia.101.desc:0 "Durante los últimos meses, [ROOT.GetCountry.GetRuler.GetName] ha pasado incontables horas supervisando la construcción que se lleva a cabo en [GetProvince('(int32)6657').GetName] - una hazaña sorprendente para el ocupado [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle], que a menudo siente que [ROOT.GetCountry.GetRuler.GetSheHe] necesita estar en dos lugares a la vez.\n\nY, sin embargo, de alguna manera, [ROOT.GetCountry.GetRuler.GetFirstName] ha logrado mantenerse en contacto con [ROOT.GetCountry.GetRuler.GetHerHis] ingenieros, recibiendo actualizaciones diarias sobre la nueva capital incluso cuando [ROOT.GetCountry.GetRuler.GetSheHe] no estaba físicamente presente en las colinas. Y cuando finalmente llegó la noticia a [ROOT.GetCountry.GetRuler.GetFirstName] de que la ciudad estaba lista para recibir habitantes, [ROOT.GetCountry.GetRuler.GetSheHe] ofreció una oración de acción de gracias a [GetDeityDefinition('omen_api').GetName], pidiéndole al dios de los comerciantes que bendijera nuestra capital con tiempos de prosperidad."
 me_parthia.101.a:0 "Desde hoy en adelante, esta ciudad se llamará '#E Nisa#!'..."

 me_parthia.102.t:0 "Aliados escitas"
 me_parthia.102.desc:0 "Mientras que algunos que viven en [ROOT.GetCountry.GetCapital.GetName] se burlaron de la decisión de [ROOT.GetCountry.GetRuler.GetName] de buscar aliados entre las #E tribus escitas#!, los [ROOT.GetCountry.GetRulerTitle] ignoraron sus quejas e hicieron propuestas amistosas a nuestros vecinos. [ROOT.GetCountry.GetRuler.GetFirstName] tenía [ROOT.GetCountry.GetRuler.GetHerHis] los ojos puestos en las regiones ricas de nuestro sur y no en las estepas vacías, y los [ROOT.GetCountry.GetRulerTitle] no tenían intención de permanecer permanentemente en esta región; dejen que los escitas se queden con las praderas abiertas si así lo desean.\n\nSe firmaron tratados de entendimiento y nuestros diplomáticos regresaron a casa, seguros de que habían cumplido sus objetivos de asegurar el norte."
 me_parthia.102.a:0 "Nuestro destino está en otra parte de todos modos"

 me_parthia.103.t:0 "Materia Bactriana"
 me_parthia.103.desc:0 "Después de mantener correspondencia con [GetCountry('BAC').GetRuler.GetName], el [GetCountry('BAC').GetRulerTitle] de [GetCountry('BAC').GetName], a lo largo de muchas semanas, [ROOT.GetCountry.GetRuler.GetName] descubrió que [ROOT.GetCountry.GetRuler.GetHerHis] la contraparte bactriana era sabia y agradable. Los dos líderes compartieron una visión, imaginando un momento en el que ambos países estarían libres de las garras del [GetCountry('SEL').GetName], y juraron juntos cumplir su parte del trato cuando llegara el momento de declarar la independencia."
 me_parthia.103.a:0 "Nuestro flanco está asegurado"

 me_parthia.104.t:0 "Una Partia"
 me_parthia.104.desc:0 "A lo largo de la frontera entre [ROOT.GetCountry.GetName] y [GetCountry('SEL').GetName], agentes de [ROOT.GetCountry.GetRuler.GetName] se infiltraron en las ciudades y pueblos de la región, difundiendo oro y rumores sobre los poderosos #E ejércitos partos#! que estaban listos para invadir.\n\n[GetCountry('SEL').GetRuler.GetName] en el lejano [GetCountry('SEL').GetCapital.GetName] no tenían por qué dictar los asuntos en [GetProvince('(int32)3434').GetArea.GetName] - una opinión sostenida por [ROOT.GetCountry.GetRuler.GetFirstName] de la que muchos, incluido [GetProvince('(int32)3463').GetState.GetGovernorOrRuler.GetName], el gobernador seléucida, estaban convencidos. Los espías enviados por [ROOT.GetCountry.GetRuler.GetFirstName] trabajaron durante muchas semanas en las ciudades y mercados de nuestros vecinos, y las simpatías comenzaron a girar hacia los norteños que prometían liberarlos de un tirano lejano."
 me_parthia.104.a:0 "¡Tomaremos estas tierras por la fuerza si es necesario!"

 me_parthia.105.t:0 "...Lo difícil es desmontar"
 me_parthia.105.desc:0 "[ROOT.GetCountry.GetRuler.GetName] finalmente ha dado la orden de que las tropas de [ROOT.GetCountry.GetName] descansen, temporalmente, por supuesto, pero los soldados exhaustos han superado el punto de ruptura y esperan pasar algún tiempo con sus familias.\n\nAhora, cuando nuestros parientes regresan a sus granjas y asentamientos, [ROOT.GetCountry.GetRuler.GetFirstName] se enfrenta a un nuevo enemigo, uno con el que [ROOT.GetCountry.GetRuler.GetSheHe] no ha tratado antes; las manos y mentes ociosas que vienen con la paz."
 me_parthia.105.a:0 "Preferiría mucho ir a la batalla..."

 me_parthia.106.t:0 "Reyes Autónomos"
 me_parthia.106.desc:0 "Una de las mayores alegrías que [ROOT.GetCountry.GetRuler.GetName] tiene estos días es otorgar a un nuevo #E Rey Cliente#! insignias y honores, y aunque el parto [ROOT.GetCountry.GetRulerTitle] prefiere el campo de batalla a la pompa y las circunstancias de la vida de la corte, [ROOT.GetCountry.GetRuler.GetSheHe] siempre encontrará el tiempo para coronar a un súbdito.\n\nTodos se benefician del acuerdo; nuestras #R Marchas#! pueden gobernar sus propios dominios sin la mano dura de los #E [ROOT.GetCountry.GetRuler.GetFamily.GetName]#! microgestionando sus asuntos, y [ROOT.GetCountry.GetRuler.GetFirstName] no tiene que perder un tiempo precioso lidiando con cuestiones menores que es mejor delegar. Mientras nuestros súbditos recuerden su posición en la vida, podrán compartir la paz y la prosperidad de los partos."
 me_parthia.106.a:0 "Ahora que tenemos súbditos, podemos gobernarlos."

 me_parthia.107.t:0 "Dominio dinástico"
 me_parthia.107.desc:0 "En todas las ciudades y pueblos gobernados por las #E Marchas#! partas, cohortes de soldados leales a las [Player.MakeScope.GetCountry.GetRuler.GetFamily.GetName] patrullan regularmente los mercados y las calles. Nuestros fieles guerreros guarnecen las ciudadelas, y un pequeño ejército de burócratas garantiza que todas las correspondencias sean respondidas de manera oportuna y que todos los impuestos y tributos continúen fluyendo hacia [ROOT.GetCountry.GetCapital.GetName].\n\nSi bien estos estados de March son nominalmente independientes, el hecho de que estén gobernados por miembros de sangre de la #E [Player.MakeScope.GetCountry.GetRuler.GetFamily.GetName] Dinastía#! subraya la realidad de que su independencia es una ilusión: todo el poder real pertenece a los parientes [ROOT.GetCountry.GetRuler.GetName] y [ROOT.GetCountry.GetRuler.GetHerHis]."
 me_parthia.107.a:0 "El nombre [Player.MakeScope.GetCountry.GetRuler.GetFamily.GetName] será conocido en todas partes"

 me_parthia.108.t:0 "Unidad religiosa"
 me_parthia.108.desc:0 "Algunas personas creen que la idea se le ocurrió a [ROOT.GetCountry.GetRuler.GetName] durante un sueño, mientras que otras dicen que [ROOT.GetCountry.GetRuler.GetSheHe] estaba haciendo un sacrificio a los dioses cuando decidieron colocar la idea en la mente de [ROOT.GetCountry.GetRuler.GetHerHis].\n\nY, sin embargo, las historias escritas por los historiadores de [ROOT.GetCountry.GetName] afirmaban que hacer cumplir nuestro panteón en todo el reino era el objetivo de [ROOT.GetCountry.GetRulerTitle] desde el principio. Una vez que los [ROOT.GetCountry.GetAdjective] tuvieran un control firme sobre sus #E Marchas#! y sus súbditos, entonces la religión de [ROOT.GetCountry.GetRuler.GetFirstName] se impondría sin piedad. Los santuarios y templos de los dioses prohibidos fueron quemados y sus cenizas esparcidas, y aquellos que se negaron a romper sus ídolos y renunciar a sus creencias heréticas fueron asesinados sin dudarlo."
 me_parthia.108.a:0 "¡Ay!, hay que aceptar la supremacía de nuestros dioses."

 me_parthia.109.t:0 "Unidad Cultural"
 me_parthia.109.desc:0 "Fue un gran shock para aquellos que creían tontamente que [ROOT.GetCountry.GetRuler.GetName] protegería sus identidades tradicionales cuando se anunció que todos se verían obligados a convertirse en #E partos#!; ¿Por qué los conquistadores [ROOT.GetCountry.GetRulerTitle] permitirían a [ROOT.GetCountry.GetRuler.GetHerHis] súbditos mantener las culturas de esclavos y perros falderos? ¡En lugar de vivir sus escasas vidas como gusanos, todos se convertirían en partos y herederos de un legado de conquista y gloria!"
 me_parthia.109.a:0 "Un paso más hacia el ámbito homogéneo"

 me_parthia.1090.t:0 "Expandir el reino"
 me_parthia.1090.desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha enviado cartas personales a las marchas leales de [ROOT.GetCountry.GetName] con promesas de ayudar a nuestros servidores a hacer cumplir los reclamos que tienen contra sus vecinos. No nos quedaremos de brazos cruzados, permitiendo que nuestros enemigos se fortalezcan mientras esperan un momento de debilidad para atacar nuestras fronteras; ni mucho menos.\n\nCuando llegue el momento adecuado, el conquistador [ROOT.GetCountry.GetRulerTitle] ha prometido desatar la furia de nuestras levas partas contra cualquiera que desafíe tontamente nuestra creciente hegemonía. Ningún rincón del mundo está a salvo de nuestra caballería, y ya sea que debamos cabalgar hacia #E India#!, #E Asia#!, las estepas o cualquier tierra intermedia, nuestras fuerzas asegurarán la paz donde sea que se necesiten."
 me_parthia.1090.a:0 "¡El mundo temblará al ver nuestros caballos!"

 me_parthia.110.t:0 "Asunto del atropateno mediático"
 me_parthia.110.desc:0 "Se han enviado diplomáticos a [GetCountry('MAP').GetCapital.GetName], la capital de [GetCountry('MAP').GetName], con la exigencia de que se sometan pacíficamente a [ROOT.GetCountry.GetRuler.GetName]. El aterrador [ROOT.GetCountry.GetRulerTitle] ha dejado claro que [ROOT.GetCountry.GetName] gobernará sus tierras de una manera u otra, así que si [GetCountry('MAP').GetRuler.GetName] quiere seguir disfrutando de [GetCountry('MAP').GetRuler.GetHerHis] la vida encantada como realeza, entonces la respuesta es clara."
 me_parthia.110.a:0 "Tu otra opción es la muerte, [GetCountry('MAP').GetRuler.GetFirstName]..."

 me_parthia.111.t:0 "Exigir la fidelidad de Adiabene"
 me_parthia.111.desc:0 "Los diplomáticos partos partieron [ROOT.GetCountry.GetCapital.GetName] esta mañana hacia [GetCountry('ADI').GetCapital.GetName] con la esperanza de aceptar pacíficamente la presentación de [GetCountry('ADI').GetRuler.GetName]. Los augurios fueron favorables, por lo que hay esperanzas de que los occidentales entren en razón y abandonen cualquier esperanza de resistencia."
 me_parthia.111.a:0 "Veremos si tienen ganas de morir..."

 me_parthia.112.t:0 "Valles caucásicos"
 me_parthia.112.desc:0 "Aunque [ROOT.GetCountry.GetRuler.GetName] no está muy contento con la idea de enviar los ejércitos de [ROOT.GetCountry.GetName] a las #E montañas del Cáucaso#!, el [ROOT.GetCountry.GetRulerTitle] está preparado para hacerlo si los #E íberos#! rechazan nuestra invitación formal para aceptar el estatus de #E marzo#!."
 me_parthia.112.a:0 "Esperemos una respuesta..."

 me_parthia.113.t:0 "Socavar Armenia"
 me_parthia.113.desc:0 "Ahora que [ROOT.GetCountry.GetRuler.GetName] ha decidido interferir en la esfera de influencia de [GetCountry('ARM').GetName], nuestros diplomáticos se están preparando para invitar a los súbditos de Armenia a permitir la entrada de #E guarniciones partas#! en sus ciudades. Si rechazan este honor, entonces el golpe de los cascos llenará el aire mientras nuestra caballería avanza a través de sus pasajes de montaña.\n\nNaturalmente, a los armenios no les alegrará saber que nos entrometemos en sus asuntos, pero sus opiniones no tienen importancia."
 me_parthia.113.a:0 "Debería ser bastante fácil para que los sujetos de [GetCountry('ARM').GetName] entren en razón"

 me_parthia.114.t:0 "Subyugar a Armenia"
 me_parthia.114.desc:0 "Se dice que el [GetCountry('ARM').GetRulerTitle] de [GetCountry('ARM').GetName], [GetCountry('ARM').GetRuler.GetName], está orgulloso, pero [ROOT.GetCountry.GetRuler.GetName] se pregunta si [GetCountry('ARM').GetRuler.GetFirstName] es un tonto también. La respuesta a esta pregunta se proporcionará una vez que los armenios hayan considerado si se someterán o no a [ROOT.GetCountry.GetName] pacíficamente."
 me_parthia.114.a:0 "Puedes salvar miles de vidas con un simple 'sí', [GetCountry('ARM').GetRuler.GetFirstName]..."

 me_parthia.115.t:0 "Conquistar los medios"
 me_parthia.115.desc:0 "Los ejércitos encargados de proteger el corazón de #E Media#! fracasaron en sus objetivos y los caballos de [ROOT.GetCountry.GetRuler.GetName] pisotearon los cuerpos destrozados de sus soldados. Sus ciudades fueron saqueadas y atacadas por nuestros guerreros victoriosos, y los cielos se llenaron con el humo acre de sus asentamientos en llamas."
 me_parthia.115.a:0 "Avanzamos..."

 me_parthia.116.t:0 "Puertas de la India"
 me_parthia.116.desc:0 "¿Hay algún ejército en algún lugar del mundo que pueda enfrentarse al conquistador [ROOT.GetCountry.GetRuler.GetName]? Ya sea que estén librando una guerra contra #E griegos#! o #E indios#!, los #E partos#! siempre saldrán victoriosos: nuestros patéticos enemigos se dispersan ante nuestros caballos como paja en el viento, y sus cobardes levas ni siquiera pueden retener los territorios que son vitales para su seguridad. Los pasos terrestres hacia la #E India#! están guarnecidos por soldados partos, y las ricas ciudades de los indios se encuentran indefensas ante nuestros amenazadores ejércitos."
 me_parthia.116.a:0 "Pronto seremos dueños de todo el subcontinente."

 me_parthia.117.t:0 "Descendientes de Sargón"
 me_parthia.117.desc:0 "La exuberante tierra entre los ríos Éufrates y Tigris fue el hogar del estado más fuerte del mundo desde tiempos inmemoriales. Es lógico que ahora nos convirtamos en custodios de esta gran tierra y continuemos con ese legado, aunque utilicemos su legado, legitimidad, mano de obra y recursos para nuestros propios diseños, continuando el trabajo del que quizás sea el primer Rey que jamás haya existido: #E Sargón el Grande#!."
 me_parthia.117.a:0 "La Tierra entre Dos Ríos se convertirá en parte fundamental de nuestra fortaleza"

 me_parthia.118.t:0 "Autoridad mediana"
 me_parthia.118.desc:0 "Se han enviado diplomáticos a [GetCountry('MAP').GetCapital.GetName], la capital de [GetCountry('MAP').GetName], con la exigencia de que se sometan pacíficamente a [ROOT.GetCountry.GetRuler.GetName]. El aterrador [ROOT.GetCountry.GetRulerTitle] ha dejado claro que [ROOT.GetCountry.GetName] gobernará sus tierras de una manera u otra, así que si [GetCountry('MAP').GetRuler.GetName] quiere seguir disfrutando de [GetCountry('MAP').GetRuler.GetHerHis] la vida encantada como realeza, entonces la respuesta es clara."
 me_parthia.118.a:0 "esperemos una respuesta"

 me_parthia.119.t:0 "Inclinación de Armenia"
 me_parthia.119.desc:0 "Se dice que el [GetCountry('ARM').GetRulerTitle] de [GetCountry('ARM').GetName], [GetCountry('ARM').GetRuler.GetName], está orgulloso, pero [ROOT.GetCountry.GetRuler.GetName] se pregunta si [GetCountry('ARM').GetRuler.GetFirstName] es un tonto también. La respuesta a esta pregunta se proporcionará una vez que los armenios hayan considerado si se someterán o no a [ROOT.GetCountry.GetName] pacíficamente."
 me_parthia.119.a:0 "Lo intentamos de la manera agradable"

 me_parthia.120.t:0 "Ruinas asirias"
 me_parthia.120.desc:0 "Asiria, también una de las tierras más ricas de este mundo mortal, también se ha incorporado a nuestro floreciente estado. Su rica historia y su fuerte población seguramente se convertirán en un gran activo en las luchas venideras y participarán en la construcción de un nuevo capítulo de la historia. Justo ahora para nuestros propósitos y bajo nuestra guía."
 me_parthia.120.a:0 "Avancemos por el Éufrates"

 me_parthia.121.t:0 "Romper los restos griegos"
 me_parthia.121.desc:0 "Los agentes de [ROOT.GetCountry.GetRuler.GetName] descubrieron rápidamente que los #E gobernadores helénicos#! estacionados en la #E meseta iraní#! no debían gran lealtad a alguna autoridad central distante, sino que se guiaban puramente por el interés propio y la codicia, una situación que resultaría beneficiosa para [ROOT.GetCountry.GetName] en los días siguientes.\n\nNuestro Los espías hicieron lo que pudieron para sembrar disensión y desconfianza en todas las provincias fronterizas durante muchas semanas de viajes clandestinos, y una vez que completaron su trabajo, se informó a [ROOT.GetCountry.GetRuler.GetFirstName] que los consejos griegos discutieron abiertamente la sedición contra su señor supremo y estaban listos para abrir sus puertas a nuestras guarniciones."
 me_parthia.121.a:0 "Consolidaremos la meseta por cualquier medio."

 me_parthia.122.t:0 "Acuerdo con los griegos"
 me_parthia.122.desc:0 "Hemos logrado grandes avances y grandes adquisiciones territoriales, superando a nuestros enemigos y subyugando tierras dignas de grandes conquistadores.\n\nAún así, algunos se cansan de esta guerra, diciendo que no es santo perderse en una ambición incesante; Se pueden escuchar argumentos de que mientras la bestia helénica muere a tiros mientras jadea, debemos ser conscientes de nuestra propia situación y no extender demasiado lo que en este momento es un enorme imperio para comparativamente pocos miembros de tribus.\n\nSeguramente se puede idear una solución para ofrecer a los [GetCountry('SEL').GetRuler.GetFamilyDisplayAdjective]#E s#! mantener todo al este del [GetProvince('(int32)7719').GetName], que es, [GetProvince('(int32)754').GetArea.GetRegion.GetName], y que nos quedemos con las tierras del oeste y que [ROOT.GetCountry.GetRuler.GetName] se case con una novia de su familia."
 me_parthia.122.a:0 "Es posible que podamos exprimir más a los seléucidas vivos que muertos."
 
 me_parthia.123.t:0 "Imperio parto"
 me_parthia.123.desc:0 "Con espada y silla, [ROOT.GetCountry.GetRuler.GetName] ha derrotado a los orgullosos #E helenos#! y los ha expulsado desesperados de sus ciudades. Las coaliciones de reyes y sátrapas, que se han desesperado en sus últimas horas y han arrojado todo lo que poseen para sobrevivir, no han sido suficientes para evitar que las #E hordas partas#! pisoteen hasta convertir sus imperios en polvo, y las mayores civilizaciones conocidas por el hombre han sido arrodilladas ante los dominantes #E [ROOT.GetCountry.GetRuler.GetFamily.GetName]#! - un verdadero testimonio de su ascenso divinamente inspirado y derecho a gobernar sobre todos los demás.\n\nSe llevó a cabo una gran ceremonia dentro de [ROOT.GetCountry.GetCapital.GetName], donde todos los gobernadores, nobles, casas reales, clientes y administradores de alto rango de [ROOT.GetCountry.GetName] asistieron en persona para presenciar el establecimiento de una nueva era, una en la que la Casa de [ROOT.GetCountry.GetRuler.GetFamily.GetName] gobernaría sobre el imperio más grande que el mundo haya visto jamás."
 me_parthia.123.a:0 "¡Ciro, te he superado!"

 me_parthia.124.t:0 "Camellos para trenes de suministros"
 me_parthia.124.desc:0 "Atravesar las interminables extensiones de los desiertos que rodean [ROOT.GetCountry.GetName] puede ser un trabajo infernal en el mejor de los casos, y ver una caravana de camellos @camels! abriéndose camino a través de las tierras baldías es algo común en estos días. Cuando se trata de llevar cargamentos a través de la ruta terrestre, muchos comerciantes prefieren confiar en el 'barco del desierto' en lugar de caballos por razones obvias y, con el tiempo, nuestros ejércitos han aprendido de su ejemplo y han equipado nuestros trenes de suministros con unidades de camellos.\n\nGracias a esta innovación militar, nuestros trenes de suministros se están moviendo más rápido que nunca, lo cual es una bendición para un ejército que a menudo tiene que comer mientras marcha."
 me_parthia.124.a:0 "La rapidez de nuestros camellos será su mayor fortaleza."

 me_parthia.125.t:0 "Realizar censo"
 me_parthia.125.desc:0 "Según todos los indicios, el #E Censo#! realizado por los agentes de [ROOT.GetCountry.GetRuler.GetName] fue un éxito rotundo, y los pergaminos y registros mantenidos dentro de [ROOT.GetCountry.GetCapital.GetName] fueron los más precisos que serían para la generación venidera. Cada ciudad, asentamiento y granja dentro del reino fue visitada por nuestros agentes, quienes tomaron notas meticulosas y enviaron informes semanales a la capital.\n\nPara [ROOT.GetCountry.GetRuler.GetHerHis] sorpresa, los diplomáticos partos encargados de realizar el censo informaron a [ROOT.GetCountry.GetRuler.GetName] que había muchos más esclavos @slaves! viviendo en [ROOT.GetCountry.GetName] de lo que nadie había pensado anteriormente, y que nuestros gobernadores locales habían tomado la libertad de asignar estos esclavos a varias granjas y minas en todas las provincias."
 me_parthia.125.a:0 "¡Parece que encontramos algunos activos sujetos a impuestos!"

 me_parthia.126.t:0 "No sé, ¿evento vacío?"
 me_parthia.126.desc:0 ""
 me_parthia.126.a:0 ""

 me_parthia.127.t:0 "Qanats"
 me_parthia.127.desc:0 "Gracias al uso generalizado del llamado #E 'Qanat'#!, un tipo especializado de sistema de acueducto que extrae agua de depósitos subterráneos profundos y la lleva a la superficie, nuestros parientes han podido construir asentamientos y ciudades en los terrenos más duros."
 me_parthia.127.a:0 "Nuestras ciudades desérticas se convertirán en lugares de refugio entre las interminables dunas."

 me_parthia.128.t:0 "Alta alfabetización"
 me_parthia.128.desc:0 "Tener un esclavo educado adjunto a una casa es un privilegio que pocos que viven dentro de [ROOT.GetCountry.GetName] pueden permitirse, pero muchas de las familias líderes en [ROOT.GetCountry.GetCapital.GetName] tienen tutores que enseñan el alfabeto a sus hijos. \n\n[ROOT.GetCountry.GetRuler.GetName] ha alentado suavemente esta tendencia entre la aristocracia, pidiendo que se escriban obras originales en los dialectos locales y se compartan en todo el reino parto. El [ROOT.GetCountry.GetRulerTitle] es muy consciente de las históricas tradiciones literarias de los #E griegos#! y espera que algún día nuestra producción cultural supere la de los sabios helénicos."
 me_parthia.128.a:0 "Una población educada es la clave para la supremacía intelectual"

 me_parthia.129.t:0 "ariana agua"
 me_parthia.129.desc:0 "Los ingenieros partos han pasado incontables horas bajo el cruel sol, construyendo acueductos y qanats por los desiertos de [GetProvince('(int32)6561').GetArea.GetRegion.GetName]. Si bien los días eran largos y el aire de los lugares de trabajo estaba lleno de amargas maldiciones contra el calor implacable, los esfuerzos de nuestros arquitectos dieron sus frutos y la agricultura se ha convertido en una posibilidad en lugares que alguna vez fueron el hogar de remolinos de polvo y lagartos."
 me_parthia.129.a:0 "Toqué las arenas del desierto y las flores florecieron bajo mis dedos..."

 me_parthia.130.t:0 "Cuartel General Imperial"
 me_parthia.130.desc:0 "Los viajeros que llegan a las murallas de [ROOT.GetCountry.GetCapital.GetName], una de las ciudades más grandes de [ROOT.GetCountry.GetName] y sede oficial del poder de la dinastía real #E [ROOT.GetCountry.GetRuler.GetFamily.GetName]#!, a menudo descubren que les faltan palabras cuando se trata de describir los esplendores de la capital parta.\n\nPues, ¿quién podría describir adecuadamente los placeres que se encuentran en sus numerosos mercados, con ¿Sus amplias avenidas de mármol y sus columnatas sombreadas? ¿Y quién ha escuchado el agradable sonido de la flauta y el arpa tocados por los músicos callejeros sentados cerca de las numerosas fuentes de [ROOT.GetCountry.GetCapital.GetName] y no se ha detenido para complacer sus oídos? ¿Y quién de nosotros no se ha detenido ante el imponente edificio de un gran templo o una finca palaciega y no ha admirado la obra de sus magistrales arquitectos? Todo esto y más espera al turista que ingresa por las puertas de la ciudad.\n\nTodo lo que el dinero pueda conseguir se puede encontrar dentro de la metrópolis parta; suntuosos manjares del Lejano Oriente, ritones de marfil y cascos y lanzas griegos traídos por comerciantes, esclavos y guardaespaldas helénicos a sueldo que hablan cien lenguas diferentes. Muchos dicen que llegar a [ROOT.GetCountry.GetCapital.GetName] es difícil, pero salir de esta magnífica ciudad es diez veces más difícil."
 me_parthia.130.a:0 "Nuestra capital será conocida como 'La Ciudad' ante el mundo y la historia"

 me_parthia.131.t:0 "arcas llenas"
 me_parthia.131.desc:0 "Nunca antes en nuestra historia las arcas de [ROOT.GetCountry.GetName] habían estado tan llenas como en este momento; Es un buen problema y por el que deberíamos estar agradecidos, como [ROOT.GetCountry.GetRuler.GetName] ha señalado secamente a los [ROOT.GetCountry.GetRuler.GetHerHis] asesores. Los impuestos y los saludables ingresos comerciales que fluyen hacia [ROOT.GetCountry.GetCapital.GetName] han permitido a [ROOT.GetCountry.GetRulerTitle] gastar como [ROOT.GetCountry.GetRuler.GetSheHe] quiere y, afortunadamente para la gente común, [ROOT.GetCountry.GetRuler.GetFirstName] ha insistido en invertir en nuestra infraestructura."
 me_parthia.131.a:0 "Gastemos este dinero sabiamente y construyamos nuestras ciudades."

 me_parthia.132.t:0 "Conectar caminos"
 me_parthia.132.desc:0 "Aunque nuestros #E ingenieros partos#! han construido muchas cosas notables en nuestras ciudades, sus logros arquitectónicos palidecen en comparación con la extensa red de carreteras que han construido en toda la polvorienta región de [GetProvince('(int32)6586').GetArea.GetRegion.GetName].\n\nEsta carretera, conocida por todos como la #E '[ROOT.GetCountry.GetRuler.GetFamily.GetName] Autopista#!', ha completado un circuito que permite al viajero caminar desde [GetProvince('(int32)258').GetName] hasta [GetProvince('(int32)7177').GetName], si así lo deseaban. Los hombres más sabios que viven en [ROOT.GetCountry.GetCapital.GetName] están de acuerdo en que nuestro [ROOT.GetCountry.GetRulerTitle] es responsable de crear la carretera más larga del mundo, un logro que ha hecho que [ROOT.GetCountry.GetRuler.GetFirstName] se sienta muy orgulloso."
 me_parthia.132.a:0 "Oriente y Occidente ahora están conectados"

 me_parthia.133.t:0 "Libertades mercantiles"
 me_parthia.133.desc:0 "En señal de favor real, [ROOT.GetCountry.GetRuler.GetName] ha acordado otorgar el título de #E League City#! a uno de nuestros territorios, creando un centro comercial que será el hogar de muchos de los comerciantes que viven en [ROOT.GetCountry.GetName]. Este gesto extraordinario nos ha ganado la buena voluntad de los gremios comerciales y la influencia política que [ROOT.GetCountry.GetRuler.GetFirstName] ha obtenido de este incidente es sustancial."
 me_parthia.133.a:0 "El mejor socio comercial es aquel que está subordinado."

 me_parthia.134.t:0 "Bazares partos"
 me_parthia.134.desc:0 "Impulsados por la saludable venta de telas @cloth! y otros textiles, nuestros mercados continúan atrayendo a comerciantes de tierras lejanas, un testimonio de los esfuerzos de [ROOT.GetCountry.GetRuler.GetName] para hacer crecer nuestro comercio. Los tejidos que se producen en nuestros talleres son transportados en caravanas de camellos a puertos lejanos, donde son cargados en barcos que navegan hasta los confines de la tierra, al parecer, la demanda de nuestras mercancías es tan grande que los hombres están dispuestos a hacer estos viajes para obtener ganancias."
 me_parthia.134.a:0 "¡Nuestros mercados se están llenando de comerciantes!"

 me_parthia.135.t:0 "Desarrollar el campo"
 me_parthia.135.desc:0 "Durante las temporadas en las que no son necesarios para los impuestos de [ROOT.GetCountry.GetName], nuestra gente ha pasado su tiempo en los campos trabajando bajo el sol implacable. Alentados por [ROOT.GetCountry.GetRuler.GetName] a cultivar y pastorear animales dondequiera que pudieran, los partos afrontaron este desafío con su habitual determinación sombría. Gracias a sus esfuerzos por plantar semillas y cuidar la tierra cultivable, nuestras cosechas han llenado nuestros graneros con suficiente alimento para sobrevivir en tiempos difíciles."
 me_parthia.135.a:0 "No existe el exceso de comida"

 me_parthia.136.t:0 "Telas coloridas"
 me_parthia.136.desc:0 "Nuestras arcas rebosan de oro procedente de la venta de nuestras telas de colores, obteniendo un número que llamó la atención de [ROOT.GetCountry.GetRuler.GetName]. Si bien muchos que viven dentro de [ROOT.GetCountry.GetName] prefieren ganar dinero saqueando y destruyendo los asentamientos y ciudades de nuestros enemigos, incluso ellos admiten que se puede obtener riqueza a través del comercio."
 me_parthia.136.a:0 "¡Se puede ganar tanto dinero con esto!"

 me_parthia.137.t:0 "Sedas iraníes"
 me_parthia.137.desc:0 "Si bien uno puede conseguir seda @silk! que se fabrica en tierras muy, muy lejanas al este, el tipo que elaboran nuestros artesanos que viven en el corazón de #E Irán#! rivaliza con la calidad de todos los demás. Cuando se enfrentan a los precios exorbitantes que conlleva la importación de seda oriental, muchos comerciantes nos comprarán a nosotros, sabiendo que podrán obtener mejores ganancias con nuestros textiles producidos localmente."
 me_parthia.137.a:0 "Nadie puede procesar la seda como nuestros fabricantes."

 me_parthia.138.t:0 "Patrocinar juglares"
 me_parthia.138.desc:0 "La riqueza de los #E [ROOT.GetCountry.GetRuler.GetFamily.GetName]#! ha permitido a los #E partos#! hacer cosas que otras civilizaciones inferiores no pueden permitirse, como subvencionar a los artistas que viven en las principales ciudades. [ROOT.GetCountry.GetRuler.GetName] es conocido por ser un mecenas de las artes y ha gastado grandes sumas de dinero en conseguir los servicios de los mejores bailarines, cantantes, actores y oradores que se pueden encontrar.\n\nNo tener que preocuparse por de dónde vendrá su próxima comida garantiza que nuestros animadores puedan centrarse en su misión principal; promover los valores culturales partos y honrar los logros del poderoso [ROOT.GetCountry.GetRuler.GetFirstName], muchos de los cuales han sido conmemorados en canciones."
 me_parthia.138.a:0 "¡Nuestras obras culturales serán recordadas en el futuro!"

 me_parthia.139.t:0 "Aceitunas medianas"
 me_parthia.139.desc:0 "[ROOT.GetCountry.GetRuler.GetName] puede entender realmente por qué los #E helénicos#! aman sus aceitunas @olive! tanto como ellos. Esta sabrosa fruta no sólo se puede convertir en un valioso aceite @earthware!, sino que la propia aceituna constituye una parte importante de nuestras comidas diarias: un desayuno [ROOT.GetCountry.GetAdjective] rápido incluye un puñado de aceitunas, un trozo de pan, tal vez uno o dos dátiles, y todo está regado con vino.\n\nConsciente de que siempre podemos encontrar un uso para las aceitunas, [ROOT.GetCountry.GetRuler.GetFirstName] se ha comprometido a plantar más huertos en todo el mundo. [ROOT.GetCountry.GetName]."
 me_parthia.139.a:0 "Nos faltan aceitunas y esto se solucionará"

 me_parthia.140.t:0 "Prospección en Zagros"
 me_parthia.140.desc:0 "Convocados por la voluntad del imponente [ROOT.GetCountry.GetRuler.GetName], un gran grupo de aventureros se han reunido en la plaza central de [ROOT.GetCountry.GetCapital.GetName]. A estos intrépidos exploradores se les ha encomendado la difícil tarea de inspeccionar las #E Montañas Zagros#! con la esperanza de descubrir valiosas fuentes de minerales, y aunque nuestros hombres definitivamente tienen mucho trabajo por delante, hay una sensación de emoción palpable en el aire.\n\nHay informes de que algunas tribus locales podrían ser hostiles a nuestra expedición, por lo que además de los ingenieros, arquitectos, traductores y guías que se han reunido, una cohorte de [ROOT.GetCountry.GetAdjective] guerreros acompañará a los hombres en su viaje."
 me_parthia.140.a:0 "Literalmente caminamos sobre el dinero: analicémoslo."
 
 #Albion-esque travel event chain
 me_parthia.201.t:0 "Ruta de la Seda - Comenzando el viaje"
 me_parthia.201.desc:0 "Ha surgido una rara oportunidad para [ROOT.GetCountry.GetRuler.GetName], una que promete ser la aventura de su vida: el [ROOT.GetCountry.GetRulerTitle] de [ROOT.GetCountry.GetName] ha recibido una invitación para unirse a una caravana itinerante mientras parten de [ROOT.GetCountry.GetCapital.GetName] y se dirigen hacia el este a lo largo de la #E Ruta de la Seda#!.\n\nEs bien sabido que estos países extranjeros con los que comerciamos son más ricos que nunca. Imaginación, y la mayoría de los productos exóticos que se pueden encontrar en los mercados [ROOT.GetCountry.GetAdjective] tienen su origen en estos países misteriosos que se encuentran más allá de donde terminan nuestros mapas. ¿Debería [ROOT.GetCountry.GetRuler.GetFirstName] tomarse un descanso de [ROOT.GetCountry.GetRuler.GetHerHis] deberes y viajar por las rutas comerciales? El viaje estará lleno de peligros, pero también será apasionante."
 me_parthia.201.a:0 "Lo mejor para nosotros es ver el mundo."
 me_parthia.201.b:0 "Preferimos ocuparnos de los asuntos internos."
 me_parthia.201.btt:0 "La expedición será #R cancelada#!."

 me_parthia.202.t:0 "Ruta de la Seda - Estructura del viaje"
 me_parthia.202.desc:0 "Ave Imperator; Es hora de romper un poco la cuarta pared. Para que esta aventura sea posible y razonable, hay algunas reglas especiales en juego durante esta cadena de eventos.\n\nPara que cada elección parezca limitada e impactante como un juego de rol, tu caravana de viaje tendrá #Y Oro#! @gold! para administrar. Tu gobernante y tu [ROOT.GetCountry.GetRuler.GetHerHis] séquito comenzarán con #Y 1000#! @gold!.\n\nSerá #R imposible#! ganar más oro durante tus viajes y cada elección solo se puede elegir una vez, así que ten en cuenta lo que decides hazlo!\n\nFinalmente, todas las recompensas que se muestran en cada opción #E se recibirán solo cuando finalice tu viaje#!.\n\nEl oro que quede al final de tus viajes se distribuirá como donaciones para los valientes compañeros de viaje que hicieron posible el viaje, por lo que no quedará nada para devolver al tesorería.\n\n#G Buena suerte y diviértete#!."
 me_parthia.202.a:0 "Veamos qué tiene para ofrecer China"
 me_parthia.202.b:0 "Pensándolo bien, tal vez no debería"

 me_parthia.203.t:0 "Ruta de la Seda: atacada por bandidos"
 me_parthia.203.desc:0 "Ya era tarde y nuestra caravana había pasado largas horas deambulando bajo el sol implacable cuando se produjo el ataque. No es que estar cansado y sediento debería haber sido una excusa para lo que ocurrió esa tarde en los polvorientos páramos al este de [ROOT.GetCountry.GetCapital.GetName], pero [ROOT.GetCountry.GetRuler.GetName] volvería a visitar este fatídico momento en [ROOT.GetCountry.GetRuler.GetHerHis] mente una y otra vez en los días venideros.\n\nMientras caminábamos junto a un barranco desolado, nuestra caravana fue rápidamente rodeada por bandidos a caballo. Los crueles salvajes nos gritaban en un idioma que ninguno de nosotros podía entender, pero los arcos en sus manos nos decían todo lo que necesitábamos saber."
 me_parthia.203.a:0 "pagarles"
 PTH_travel_lose_50:0 "Nuestra delegación comercial perderá #R 50#! @gold!."
 PTH_travel_lose_100:0 "Nuestra delegación comercial perderá #R 100#! @gold!."
 PTH_travel_lose_150:0 "Nuestra delegación comercial perderá #R 150#! @gold!."
 PTH_travel_lose_200:0 "Nuestra delegación comercial perderá #R 200#! @gold!."
 PTH_travel_lose_250:0 "Nuestra delegación comercial perderá #R 250#! @gold!."
 me_parthia.203.b:0 "¡Preferimos pelear!"

 me_parthia.2031.t:0 "Atacado por bandidos - Gran Batalla"
 me_parthia.2031.desc:0 "Las historias contadas sobre la batalla que tuvo lugar serían recordadas durante los siglos venideros, y los jóvenes gobernantes de [ROOT.GetCountry.GetName] crecerían escuchando la historia de los valientes [ROOT.GetCountry.GetRuler.GetName] luchando contra los bandidos.\n\nSe dice que [ROOT.GetCountry.GetRulerTitle] mató personalmente al líder de los bandidos en un combate cuerpo a cuerpo, lo que provocó que los asaltantes entraran en pánico en un caos desorganizado una vez que vieron a [ROOT.GetCountry.GetRuler.GetFirstName] de pie. Triunfante sobre el cadáver decapitado de su amo. Nuestros guerreros acabaron rápidamente con los rezagados restantes y la caravana continuó adelante."
 me_parthia.2031.a:0 "¡Nuestro valor es legendario!"
 me_parthia.2032.t:0 "Atacado por bandidos - retrocedieron"
 me_parthia.2032.desc:0 "Aunque los bandidos nos habían sorprendido, esto no les dio ninguna ventaja en la batalla que siguió: los soldados bien entrenados de [ROOT.GetCountry.GetRuler.GetName] arrasaron con una furia salvaje que los dejó tambaleantes y desorganizados. Nadie en la caravana murió, alabado sea el dios, y el grupo pudo seguir adelante."
 me_parthia.2032.a:0 "Este era el único resultado lógico para ellos."
 me_parthia.2033.t:0 "Atacado por bandidos - nada grave"
 me_parthia.2033.desc:0 "La batalla que siguió entre nuestros guerreros partos y los bandidos fue más sangrienta de lo necesario; los resultados letales de que nos tomen por sorpresa. Lo peor para [ROOT.GetCountry.GetRuler.GetName] fue que estos bandidos no eran simples chusmas acostumbradas a aterrorizar a los granjeros locales, sino guerreros experimentados que luchaban con determinación y tácticas. Muchos de nuestros hermanos cayeron bajo las flechas y algunos miembros de nuestra caravana, en su mayoría mujeres, fueron arrastrados como cautivos, pero finalmente pudimos despedir a los bandidos después de matar a algunos de ellos."
 me_parthia.2033.a:0 "...sí, eso es un revés."

 PTH_travel_another_city:0 "#Y Partiremos hacia otra ciudad.#!"
 me_parthia.204.t:0 "Ruta de la Seda - Samarcanda"
 me_parthia.204.desc:0 "Después de semanas de viajar a través de colinas secas, los imponentes muros de [GetProvince('(int32)6682').GetName] fueron una vista bienvenida para [ROOT.GetCountry.GetRuler.GetName] y [ROOT.GetCountry.GetRuler.GetHerHis] compañeros de viaje. La promesa de un baño caliente y una comida caliente impulsó sus piernas cansadas hacia adelante, y antes del mediodía estaban dentro de las extensas fortificaciones de la ciudad.\n\nLa emoción de estar en la legendaria ciudad de Samarcanda les dio [ROOT.GetCountry.GetRuler.GetFirstName] un segundo aliento una vez que se aseguraron los alojamientos para pasar la noche de la caravana, y el bullicio de las calles activas de la ciudad llamó a [ROOT.GetCountry.GetRulerTitle] a salir de la tranquila calma de la pequeña taberna en la que [ROOT.GetCountry.GetRuler.GetSheHe] entraba y salía de su brillante y ruidoso caos."
 me_parthia.204.a:0 "¡Tengo dinero para gastar! Veamos estos famosos mercados."
 me_parthia.204.b:0 "Salgamos a caminar sin un destino real en mente."
 me_parthia.204.c:0 "Deberíamos tomarnos el tiempo para familiarizarnos con nuestro vecindario."
 me_parthia.204.d:0 "Es hora de volver al camino"

 me_parthia.2041.t:0 "Ruta de la Seda - Mercado de Samarcanda"
 me_parthia.2041.desc:0 "Si [ROOT.GetCountry.GetRuler.GetName] se sorprendió por el tamaño de los mercados de esclavos en [GetProvince('(int32)6682').GetName], [ROOT.GetCountry.GetRuler.GetSheHe] no se lo confió a nadie, pero incluso [ROOT.GetCountry.GetRulerTitle] debe haberse sorprendido por la gran cantidad de esclavos disponibles para la venta. \n\nLa cantidad de cautivos disponibles para la compra garantizaba que los precios fueran muy bajos, y [ROOT.GetCountry.GetRuler.GetFirstName] rápidamente se dio cuenta de que existía la ganga de toda una vida sentado frente a [ROOT.GetCountry.GetRuler.GetHerHis] cara.\n\nPero había otros usos igualmente valiosos del dinero; Podríamos dedicar tiempo y esfuerzo a conocer a algunos de los comerciantes locales y, al hacerlo, podríamos establecer valiosas #E conexiones comerciales bactrianas#! para volver a casa. Y Samarcanda, conocida en todo el mundo como una de las ciudades más destacadas de [GetProvince('(int32)6682').GetArea.GetName], ha atraído a muchas mentes brillantes, como filósofos, matemáticos y arquitectos famosos. [ROOT.GetCountry.GetRuler.GetFirstName] podría gastar el oro y contratar a algunos de estos profesores, lo que nos daría como resultado una innovación."
 me_parthia.2041.a:0 "Comprar esclavos locales"
 PTH_15_slaves:0 "Compraremos #T 15 Slave Pops#! @slaves!de la cultura local."
 me_parthia.2041.b:0 "Comprar productos para revender en casa."
 me_parthia.2041.c:0 "Los lugareños tienen conocimientos únicos que debemos aprender."
 me_parthia.2041.d:0 "Mi trueque aquí ha terminado."

 me_parthia.2042.t:0 "Ruta de la Seda - Ver Samarcanda"
 me_parthia.2042.desc:0 "'Nikolaos...Heliodoros...Protarchos...Ptolemaios...'\n\nFue mientras deambulaba por las calles de [GetProvince('(int32)6682').GetName] que [ROOT.GetCountry.GetRuler.GetName] contempló una visión curiosa; La figura marchita de un hombre muy anciano, vestido con una #E coraza helénica#! oxidada y con un casco roto, estaba sentado en la plaza del mercado y recitando una lista de nombres #E griegos#!.\n\ncautivado por el sonido, [ROOT.GetCountry.GetRuler.GetFirstName] caminó hacia el hombre y le pidió que se explicara, recibiendo lo siguiente en respuesta.\n\n'Fui soldado, mi Señor, que marchó de [GetProvince('(int32)379').GetName] a [GetProvince('(int32)185').GetName], aunque son pocos los que aún viven que conocen el significado de esas palabras.' Levantándose con un gemido doloroso, el anciano se inclinó levemente y se encontró con la mirada del [ROOT.GetCountry.GetAdjective] Gobernante. 'Hay mucho que he visto, mi Señor, y mucho que sé. Di mi vida a la lanza y pasé diez temporadas de campaña en el campo, ¿y qué tengo que mostrar a cambio? Sólo historias de batalla y recuerdos de un mundo que ya no existe. Con un profundo suspiro, el anciano volvió a caer al suelo. —¿Quizás le gustaría escuchar una historia?"
 me_parthia.2042.a:0 "Dime la lección más grande que aprendiste en el campo de batalla."
 me_parthia.2042.b:0 "Te daré las riquezas de los reyes si enseñas a mis ejércitos"

 me_parthia.2043.t:0 "Ruta de la Seda - Área de Samarcanda"
 me_parthia.2043.desc:0 "Dejar el ajetreo y el bullicio del distrito principal de [GetProvince('(int32)6682').GetName] fue un alivio después de pasar unas horas deambulando por sus barrios más concurridos: ¡por fin, el fin de la incesante venta ambulante de comerciantes y proveedores de mercancías! [ROOT.GetCountry.GetRuler.GetName] pasó algunas horas ociosas caminando por tranquilos distritos residenciales en las afueras de la ciudad, pasando fuera de las puertas de la ciudad y dando un paseo tranquilo por los asentamientos construidos fuera de sus puertas. Había muchas chozas destartaladas construidas contra las fortificaciones, y el sonido de los niños jugando en los estrechos callejones resonaba a lo largo de los muros de piedra.\n\nLos habitantes locales aprovecharon cada oportunidad que tenían a su disposición, y el [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] quedó impresionado al ver los numerosos pequeños jardines plantados junto a los pequeños arroyos y arroyos que atravesaban el campo. Frente a las casas se cultivaban con orgullo hierbas y melones, y pequeños puestos vendían productos frescos a cualquiera que pasara por allí."
 me_parthia.2043.a:0 "La agricultura aquí parece estar bien desarrollada. ¿Qué puedo aprender?"
 me_parthia.2043.b:0 "Contrata un guía y ve a ver las ruinas de la #E Roca Sogdiana#!"
 me_parthia.2043.c:0 "Regresa a la ciudad"

 PTH_travel_unlock_bactrian_tradition_tool:0 "Desbloquearemos #Y Tradiciones militares bactrianas#!."
 PTH_travel_unlock_bactrian_tradition_tt:0 "Hemos desbloqueado #Y Tradiciones militares bactrianas#!."

 me_parthia.205.t:0 "Ruta de la Seda - Cuenca del Tarim"
 me_parthia.205.desc:0 "[ROOT.GetCountry.GetRuler.GetName], alguien que había viajado a través de las vastas estepas y los interminables desiertos, quedó desconcertado por la pura belleza de la #E Cuenca del Tarim#! una vez que la caravana parta finalmente abandonó las traicioneras #E Montañas Ferghanan#!. A decir verdad, [ROOT.GetCountry.GetRuler.GetFirstName] podría haber pasado semanas deambulando por la Cuenca, porque [ROOT.GetCountry.GetRuler.GetSheHe] quedó absolutamente cautivado por su terreno accidentado y disfrutó mucho visitando las ciudades locales. El principal de ellos fue [GetProvince('(int32)7184').GetName], y [ROOT.GetCountry.GetRulerTitle] no perdió tiempo en contratar a un guía local una vez que [ROOT.GetCountry.GetRuler.GetSheHe] hubo cruzado las puertas de la ciudad."
 me_parthia.205.a:0 "Ir directo a los mercados"
 me_parthia.205.b:0 "Paseemos por la ciudad y veamos qué podemos."
 me_parthia.205.c:0 "Hay reyes magos famosos aquí que debo buscar."
 me_parthia.205.d:0 "Volvamos al camino"

 me_parthia.2051.t:0 "Ruta de la Seda - Mercado de Tarim"
 me_parthia.2051.desc:0 "El mercado de [GetProvince('(int32)7184').GetName] no estaba menos concurrido que el de [GetProvince('(int32)6682').GetName], y [ROOT.GetCountry.GetRuler.GetName] estuvo tentado de detenerse en docenas de puestos mientras [ROOT.GetCountry.GetRuler.GetSheHe] seguía al guía por las calles sinuosas y sinuosas.\n\nMil olores y sonidos asaltaron todos los sentidos. Túnicas de lana gruesa, capas resistentes al agua, chales de seda, telas de colores brillantes, magníficas alfombras, zapatos y gorras de cuero: en los cientos de puestos que abarrotaban sus avenidas se podía encontrar todo tipo de textiles imaginables. En cada esquina había hogazas de pan recién horneado, espolvoreadas con semillas de sésamo, miel fresca y queso, y esclavos con vino caminaban por las concurridas plazas, ofreciendo una bebida refrescante a cualquiera que tuviera una pequeña moneda de cobre. Los animales de carga atestaban los caminos llenos de estiércol y charcos de agua estancada, y el zumbido constante de las moscas se mezclaba agradablemente con el sonido de una flauta distante que tocaba una melodía lenta."
 me_parthia.2051.a:0 "Ir a los mercados de esclavos de inmediato."
 me_parthia.2051.b:0 "La gente aquí tiene ropa única... ¿compramos algo?"
 me_parthia.2051.c:0 "Encuentra a sus hombres más sabios para instruirnos en sus caminos."
 me_parthia.2051.d:0 "Mi trueque aquí ha terminado."

 me_parthia.2052.t:0 "Ruta de la Seda - Zona de Tarim"
 me_parthia.2052.desc:0 "Nuestro grupo de viaje se enteró rápidamente de que había todo tipo de talentos viviendo en [GetProvince('(int32)7184').GetName] y que contratar los servicios de los lugareños no sería prohibitivamente caro. Había chamanes religiosos que podían entrar en trances profundos y comulgar con los espíritus del cielo que ofrecían sus servicios a la venta, así como viajeros experimentados que prometían ayudar a nuestros comerciantes cuando viajaban por las áridas tierras baldías de la #E Cuenca del Tarim#!. Si a [ROOT.GetCountry.GetRuler.GetFirstName] le sobraba la moneda, entonces [ROOT.GetCountry.GetName] tendría muchos recursos valiosos disponibles para tomar."
 me_parthia.2052.a:0 "Obtenga ideas filosóficas de los lugareños."
 me_parthia.2052.b:0 "Aprenda optimizaciones logísticas para viajar por la Cuenca."
 me_parthia.2052.c:0 "Regresa a la ciudad"

 me_parthia.2053.t:0 "Ruta de la Seda - Tarim Vidente"
 me_parthia.2053.desc:0 "[ROOT.GetCountry.GetRuler.GetName] había escuchado historias de los chamanes y videntes de [GetProvince('(int32)7184').GetName] que daban sermones espontáneos en sus mercados y plazas, y el [ROOT.GetCountry.GetRulerTitle] secretamente esperaba ser testigo de tal evento para [ROOT.GetCountry.GetRuler.GetHerHim] self; un sueño que se hizo realidad una vez que los viajeros partos entraron al distrito religioso del centro. Allí, de pie ante una multitud de cientos de personas, un hombre sabio estaba dando una conferencia sobre la naturaleza del tiempo."
 me_parthia.2053.a:0 "No hay necesidad de involucrarse con supersticiones"
 me_parthia.2053.b:0 "Contrata a este hombre para que escriba sus teorías para la posteridad"

 me_parthia.2056.t:0 "Ruta de la Seda - El destino del conquistador"
 me_parthia.2056.desc:0 "Mientras caminaba por las concurridas calles de [GetProvince('(int32)7184').GetName], [ROOT.GetCountry.GetRuler.GetName] escuchó acerca de un guerrero local, un hombre conocido en todo el mundo por su habilidad para liderar ejércitos en la batalla, que había renunciado a la vida de un soldado y se había retirado a una vida tranquila en el vecindario. \n\nSe hicieron averiguaciones en nombre de [ROOT.GetCountry.GetName], y el [ROOT.GetCountry.GetRulerTitle] se alegró al saber que este guerrero se mudaría a [ROOT.GetCountry.GetCapital.GetName] y enseñar a nuestros soldados todo lo que había aprendido durante su larga vida."
 me_parthia.2056.a:0 "¡[ROOT.GetCountry.GetRuler.GetName] nos llevará a la victoria!"

 me_parthia.2057.t:0 "Ruta de la Seda: el destino del constructor"
 me_parthia.2057.desc:0 "Mientras caminaba por las concurridas calles de [GetProvince('(int32)7184').GetName], [ROOT.GetCountry.GetRuler.GetName] se topó con una conferencia que estaba dando un arquitecto famoso, un hombre conocido en todo el mundo por su habilidad para restaurar templos.\n\nSe hicieron consultas silenciosas, y el [ROOT.GetCountry.GetRulerTitle] se alegró de saber que este constructor se mudaría a [ROOT.GetCountry.GetCapital.GetName] y enseñaría a nuestros parientes todo lo que había aprendido durante su larga vida."
 me_parthia.2057.a:0 "¡[ROOT.GetCountry.GetRuler.GetName] nos llevará a la prosperidad!"

 me_parthia.2058.t:0 "Ruta de la Seda: el destino del diplomático"
 me_parthia.2058.desc:0 "Mientras se detenía para tomar una copa tranquilamente durante [ROOT.GetCountry.GetRuler.GetHerHis] paseo por [GetProvince('(int32)7184').GetName], [ROOT.GetCountry.GetRuler.GetName] escuchó una conferencia que estaba dando un diplomático famoso, un hombre conocido en todo el mundo por sus muchos años como exitoso gobernador y magistrado.\n\nSe hicieron consultas silenciosas, y [ROOT.GetCountry.GetRulerTitle] se alegró de saber que este asesor retirado se mudaría a [ROOT.GetCountry.GetCapital.GetName] y enseñar a nuestros parientes todo lo que había aprendido durante su larga vida."
 me_parthia.2058.a:0 "¡[ROOT.GetCountry.GetRuler.GetFirstName] nos llevará a la paz!"

 me_parthia.206.t:0 "Ruta de la Seda: entrada a China"
 me_parthia.206.desc_1:0 "Mientras la caravana parta se aventuraba hacia el este, dirigiéndose a reinos que nunca antes habían sido visitados por alguien de la [ROOT.GetCountry.GetRuler.GetHerHis] tribu, [ROOT.GetCountry.GetRuler.GetName] pasaban las horas escuchando historias de los intérpretes locales.\n\nLas historias que compartían eran sombrías. Las tierras poderosas y ricas del este luchaban entre sí por la supremacía y ninguna había triunfado aún sobre la otra, y la guerra y la miseria estaban generalizadas en los lugares que visitaríamos. La tierra que teníamos ante nosotros estaba dividida entre varios señores de la guerra, y los precios podían fluctuar enormemente de un territorio a otro; deberíamos estar preparados para cualquier cosa que se nos presente."
 me_parthia.206.desc_2:0 "Mientras la caravana parta se aventuraba hacia el este, dirigiéndose a reinos que nunca antes habían sido visitados por alguien de la [ROOT.GetCountry.GetRuler.GetHerHis] tribu, [ROOT.GetCountry.GetRuler.GetName] pasaba las horas escuchando historias de los intérpretes locales.\n\nDespués de muchos años de batallas y guerras devastadoras, la llamada #E 'Dinastía Qin'#! había traído la paz a una tierra que había estado destrozada durante décadas. De violencia. Su nuevo #E Emperador#!, un hombre paranoico que supuestamente viajaba de una ciudad a otra todos los días, sin dormir nunca dos veces en la misma cama, estaba reformando enérgicamente el gobierno y haciendo todo lo que podía para establecer permanentemente a su familia como la clase dominante."
 me_parthia.206.desc_3:0 "Mientras la caravana parta se aventuraba hacia el este, dirigiéndose a reinos que nunca antes habían sido visitados por alguien de la [ROOT.GetCountry.GetRuler.GetHerHis] tribu, [ROOT.GetCountry.GetRuler.GetName] pasaba las horas escuchando historias de los intérpretes locales.\n\nSi bien hubo muchas guerras ruinosas y asedios devastadores que trajeron miseria, hambruna y plagas al campo, los #E 'Han lograron una paz permanente. Dynasty'#!, que ahora gobiernan sin oposición sobre un vasto territorio que rivaliza en tamaño con los mayores imperios conocidos por nuestro pueblo. Se dice que su #E Emperador#! es el monarca vivo más sabio y poderoso, con riquezas y riquezas incalculables a su disposición."
 me_parthia.206.a:0 "Interesante..."

 me_parthia.207.t:0 "Ruta de la Seda - Chang'an"
 me_parthia.207.desc_1:0 "Después de muchas semanas de vagar por tierras secas habitadas únicamente por lobos hambrientos y el aullante viento del desierto, nuestra caravana llegó a una ciudad conocida por los lugareños como #E Chang'an'#!; una ciudad de riqueza y renombre, con murallas robustas, mercados prósperos y decenas de miles de habitantes.\n\nEsta majestuosa ciudad también resultó ser el hogar de un autoproclamado #E Emperador#!, [SCOPE.sCharacter('chinese_emperor_scope').GetName], y [ROOT.GetCountry.GetRuler.GetName] quiere ver a este hombre con [ROOT.GetCountry.GetRuler.GetHerHis] propia ojos.\n\nPero también hay muchas atracciones locales cercanas que valen la pena visitar; Hay rumores de que un pequeño ejército de artesanos está pintando un #E Ejército de terracota#!, lo cual suena interesante, y una vez que [ROOT.GetCountry.GetRuler.GetSheHe] termine de examinar estas estatuas de soldados, [ROOT.GetCountry.GetRuler.GetFirstName] siempre podrá visitar la guarnición y ver la estatua real."
 me_parthia.207.desc_2:0 "Después de muchas semanas de vagar por tierras secas habitadas únicamente por lobos hambrientos y el aullante viento del desierto, nuestra caravana llegó a una ciudad conocida por los lugareños como #E Chang'an'#!; una ciudad de riqueza y renombre, con muros resistentes, mercados prósperos y decenas de miles de habitantes.\n\nEsta majestuosa ciudad también resultó ser el hogar del gobernante #E Emperador Qin#!, [SCOPE.sCharacter('chinese_emperor_scope').GetName], y [ROOT.GetCountry.GetRuler.GetName] quiere ver a este hombre con [ROOT.GetCountry.GetRuler.GetHerHis] propios ojos.\n\nPero allí También hay muchas atracciones locales cercanas que valen la pena visitar; Hay rumores de que un pequeño ejército de artesanos está pintando un #E Ejército de terracota#!, lo cual suena interesante, y una vez que [ROOT.GetCountry.GetRuler.GetSheHe] termine de examinar estas estatuas de soldados, [ROOT.GetCountry.GetRuler.GetFirstName] siempre podrá visitar la guarnición y ver la estatua real."
 me_parthia.207.desc_3:0 "Después de muchas semanas de vagar por tierras secas habitadas únicamente por lobos hambrientos y el aullante viento del desierto, nuestra caravana llegó a una ciudad conocida por los lugareños como #E Chang'an'#!; una ciudad de riqueza y renombre, con muros resistentes, mercados prósperos y decenas de miles de habitantes.\n\nEsta majestuosa ciudad también resultó ser el hogar del gobernante #E Emperador Han#!, [SCOPE.sCharacter('chinese_emperor_scope').GetName], y [ROOT.GetCountry.GetRuler.GetName] quiere ver a este hombre con [ROOT.GetCountry.GetRuler.GetHerHis] propios ojos.\n\nPero allí También hay muchas atracciones locales cercanas que valen la pena visitar; Hay rumores de que un pequeño ejército de artesanos está pintando un #E Ejército de terracota#!, lo cual suena interesante, y una vez que [ROOT.GetCountry.GetRuler.GetSheHe] termine de examinar estas estatuas de soldados, [ROOT.GetCountry.GetRuler.GetFirstName] siempre podrá visitar la guarnición y ver la estatua real."
 me_parthia.207.a:0 "ir al mercado"
 me_parthia.207.b:0 "Quiero ver el #E Ejército de Terracota#!"
 me_parthia.207.c:0 "Inspecciona silenciosamente la guarnición local."
 me_parthia.207.d:0 "Visita el palacio del Emperador"
 me_parthia.207.e:0 "Volvamos al camino"

 me_parthia.2071.t:0 "Ruta de la Seda - Mercado de Chang'An"
 me_parthia.2071.desc:0 "Las maravillas que estaban disponibles para la venta en los mercados de #E Chan'an#! hicieron que [ROOT.GetCountry.GetRuler.GetName] deseara que [ROOT.GetCountry.GetRuler.GetSheHe] no hubiera gastado nada en [GetProvince('(int32)6682').GetName] o [GetProvince('(int32)7184').GetName]. Productos que simplemente no estaban disponibles en casa en [ROOT.GetCountry.GetCapital.GetName], como intrincados platos de porcelana hechos por maestros artesanos y armas elegantes que hacían que las armas partas parecieran toscas herramientas de salvajes, se podían encontrar a precios increíblemente razonables, y había tanta seda @silk! disponible que [ROOT.GetCountry.GetRuler.GetFirstName] no podía creerlo. Se vendieron miles de pergaminos sobre una amplia variedad de temas (historia, ciencia, matemáticas, arte, poesía) junto con inventos que desafiaban toda descripción. \n\n[ROOT.GetCountry.GetRuler.GetFirstName] quedó absolutamente estupefacto por todo lo que [ROOT.GetCountry.GetRuler.GetSheHe] presenció, sin apenas creer que tales cosas fueran posibles."
 me_parthia.2071.a:0 "Comprar esclavos locales"
 me_parthia.2071.b:0 "Me pregunto qué dicen esos pergaminos..."
 me_parthia.2071.c:0 "¡Nunca hemos visto inventos como esos!"
 me_parthia.2071.d:0 "Mi trueque aquí ha terminado."

 me_parthia.2072.t:0 "Ruta de la Seda - Ejército de Terracota"
 me_parthia.2072.desc:0 "Para cuando [ROOT.GetCountry.GetRuler.GetName] logró encontrar la ubicación del #E Ejército de Terracota#!, el sol estaba bajo en los cielos occidentales: se dirigía hacia [ROOT.GetCountry.GetCapital.GetName], pensó [ROOT.GetCountry.GetRulerTitle] distraídamente para [ROOT.GetCountry.GetRuler.GetHerHim] a sí mismo, e inmediatamente fue golpeado por una punzada de nostalgia. Sin embargo, esta angustia temporal quedó casi olvidada cuando [ROOT.GetCountry.GetRuler.GetFirstName] entró en la gigantesca tumba en las afueras de la ciudad y vio por primera vez las imponentes figuras de las estatuas de terracota.\n\nSi bien [ROOT.GetCountry.GetRuler.GetSheHe] había luchado en innumerables batallas y podía estimar razonablemente los números en un grupo grande, era imposible adivinar cuántas estatuas había: ¿diez mil? ¿Veinte mil? Milagrosamente, todos los soldados eran diferentes entre sí; algunos tenían el pelo largo, otros tenían la cabeza afeitada, algunos vestían armaduras completas, otros estaban protegidos sólo por un pesado acolchado de cuero, algunos llevaban largos arcos y otros iban armados con lanzas, y cada soldado estaba pintado individualmente... ¡qué maravilla!\n\n[ROOT.GetCountry.GetRuler.GetFirstName] pasó los últimos momentos del día observando la luz del sol astillada jugando junto a los guerreros de terracota, [ROOT.GetCountry.GetRuler.GetHerHis] con la mente divagando."
 me_parthia.2072.a:0 "Respeta la tumba en silencio."
 me_parthia.2072.b:0 "Intenta 'conseguir' un souvenir cuando nadie esté mirando..."

 me_parthia.2073.t:0 "Ruta de la Seda - Guarnición de Chang'An"
 me_parthia.2073.desc:0 "[ROOT.GetCountry.GetRuler.GetName] quedó impresionado por las tácticas y la disciplina mostradas por los guerreros que entrenaban fuera de la ciudadela principal en #E Chang'an#!, y la mente [ROOT.GetCountry.GetRuler.GetHerHis] inmediatamente se preguntó cómo [ROOT.GetCountry.GetRuler.GetSheHe] podría beneficiar a las tropas de [ROOT.GetCountry.GetName] con este conocimiento. Los guerreros chinos luchaban en extrañas formaciones que eran bastante poco ortodoxas, pero el canoso [ROOT.GetCountry.GetRulerTitle], el veterano de mil campañas, podía ver cuán prácticas y efectivas eran estas tácticas extranjeras. Y las armas y tácticas de asedio que utilizaron no se parecían a ninguna que se pudiera encontrar en [ROOT.GetCountry.GetCapital.GetName]... ¡si tan solo nuestros generales estuvieran aquí!"
 me_parthia.2073.a:0 "Entrenemos con ellos mientras estemos aquí."
 me_parthia.2073.b:0 "¿Qué es ese arco automatizado?"
 me_parthia.2073.c:0 "¡Sus máquinas de asedio son impresionantes!"

 me_parthia.2074.t:0 "Ruta de la Seda - Palacio del Emperador"
 me_parthia.2074.desc:0 "En uno de los extraños episodios de la historia que suenan a mentira, sucedió que el [ROOT.GetCountry.GetRulerTitle] de [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetName], se encontró [ROOT.GetCountry.GetRuler.GetHerHim] hablando con el #E Emperador#! del #E Reino Medio#!, un poderoso señor de la guerra llamado [SCOPE.sCharacter('chinese_emperor_scope').GetName] que había conquistado una extensa reino.\n\nMientras [ROOT.GetCountry.GetRuler.GetFirstName] había viajado con la caravana comercial bajo un nombre falso, cuando [ROOT.GetCountry.GetRuler.GetSheHe] estaba en presencia del Emperador, [ROOT.GetCountry.GetRuler.GetFirstName] anunció audazmente que [ROOT.GetCountry.GetRuler.GetSheHe] era el verdadero líder de los partos, y había viajado una gran distancia para presentarse ante el estimado gobernante del Medio Oriente. Reino.\n\nAtendidos por sus ingresos individuales, los dos líderes conversaron durante muchas horas como iguales - un honor que [ROOT.GetCountry.GetRuler.GetFirstName] no dejó de observar - y luego el Emperador preguntó al [ROOT.GetCountry.GetRulerTitle] por qué [ROOT.GetCountry.GetRuler.GetSheHe] había viajado a #E Chang'an#! desde el lejano [ROOT.GetCountry.GetCapital.GetName]."
 me_parthia.2074.a:0 "Estoy aquí por el bien de la aventura y la gloria."
 me_parthia.2074.b:0 "Consiga respetuosamente un trato para el comercio de jade @jade!"
 me_parthia.2074.btt:0 "Después del final de este viaje, podremos elegir #T 1 ciudad#! para comerciar con Jade @jade!, cambiando los bienes comerciales de una ciudad de nuestra propiedad."

 me_parthia.208.t:0 "Ruta de la Seda - Luoyang"
 me_parthia.208.desc_1:0 "La siguiente ciudad en el viaje, #E 'Luoyang'#!, se encontró en una provincia que los lugareños llamaban #E 'Henan'#!, y al cruzar sus puertas, [ROOT.GetCountry.GetRuler.GetName] se dio cuenta de que esta ciudad había visto una buena cantidad de luchas. Luoyang era una ciudad próspera y su riqueza atrajo a muchos enemigos desesperados por apropiarse de ella; aparentemente un ejército enemigo acababa de abandonar el área hace menos de una semana, y la gente apenas se había recuperado del asedio de años.\n\nHabía enormes grietas en las almenas de la ciudad, y sus muros reparados apresuradamente estaban manchados de negro por el hollín y el humo. Los campos fuera de la ciudad estaban llenos de tumbas recién excavadas y no se encontraron animales en sus calles. Por suerte para los habitantes, las murallas resistieron y los defensores lograron repeler a los invasores, pero había una tensión incómoda en el aire mientras los partos se abrían paso a través de sus bulevares abandonados. Ningún lugareño salió a recibirlos y los partos comenzaron a sentirse no bienvenidos."
 me_parthia.208.desc_2:0 "La siguiente ciudad en el viaje, #E 'Luoyang'#!, se encontró en una provincia que los lugareños llamaban #E 'Henan'#!, y al cruzar sus puertas, [ROOT.GetCountry.GetRuler.GetName] se dio cuenta de que esta ciudad había visto una buena cantidad de luchas. Luoyang era una ciudad próspera y su riqueza atrajo a muchos enemigos desesperados por apropiarse de ella; aparentemente un ejército enemigo acababa de abandonar el área hace menos de una semana, y la gente apenas se había recuperado del asedio de años.\n\nHabía enormes grietas en las almenas de la ciudad, y sus muros reparados apresuradamente estaban manchados de negro por el hollín y el humo. Los campos fuera de la ciudad estaban llenos de tumbas recién excavadas y no se encontraron animales en sus calles. Por suerte para los habitantes, las murallas resistieron y los defensores lograron repeler a los invasores, pero había una tensión incómoda en el aire mientras los partos se abrían paso a través de sus bulevares abandonados. Ningún lugareño salió a recibirlos y los partos comenzaron a sentirse no bienvenidos."
 me_parthia.208.desc_3:0 "La siguiente ciudad en el viaje, #E 'Luoyang'#!, se encontró en una provincia que los lugareños llamaban #E 'Henan'#!, y al cruzar sus puertas, [ROOT.GetCountry.GetRuler.GetName] se dio cuenta de que esta ciudad había visto una buena cantidad de luchas. Luoyang era una ciudad próspera y su riqueza atrajo a muchos enemigos desesperados por apropiarse de ella; aparentemente un ejército enemigo acababa de abandonar el área hace menos de una semana, y la gente apenas se había recuperado del asedio de años.\n\nHabía enormes grietas en las almenas de la ciudad, y sus muros reparados apresuradamente estaban manchados de negro por el hollín y el humo. Los campos fuera de la ciudad estaban llenos de tumbas recién excavadas y no se encontraron animales en sus calles. Por suerte para los habitantes, las murallas resistieron y los defensores lograron repeler a los invasores, pero había una tensión incómoda en el aire mientras los partos se abrían paso a través de sus bulevares abandonados. Ningún lugareño salió a recibirlos y los viajeros comenzaron a sentirse incómodos; las únicas personas que vieron en las calles fueron guardias."
 me_parthia.208.a:0 "quiero ir al mercado"
 me_parthia.208.b:0 "Visitemos la administración local."
 me_parthia.208.c:0 "Quiero ver a los famosos tejedores de seda."
 me_parthia.208.d:0 "Se sabe que aquí hay milicias ciudadanas."
 me_parthia.208.e:0 "Ha llegado el momento de volver a casa, por fin"

 me_parthia.2081.t:0 "Ruta de la Seda - Mercado de Luoyang"
 me_parthia.2081.desc:0 "Cuando nuestra caravana entró en el mercado principal de #E Luoyang#!, nuestros hombres fueron recibidos con miradas gélidas y labios apretados. Cuando se hicieron investigaciones para determinar esta falta de hospitalidad, nos dijeron que la ciudad había sido sitiada recientemente y que los habitantes sospechaban de nuestras intenciones: ¿realmente estábamos aquí para gastar nuestro oro o éramos otro grupo de exploración realizando un reconocimiento? \n\nLas atracciones habituales que uno podía encontrar en un distrito económico estaban aquí, a pesar de la atmósfera hostil que hizo que [ROOT.GetCountry.GetRuler.GetName] quisiera reunir [ROOT.GetCountry.GetRuler.GetHerHis] grupo e irse. Se podían conseguir esclavos a precios normales y había muchos jardines de té y pequeñas tiendas que vendían pasteles de arroz y potajes."
 me_parthia.2081.a:0 "Siempre estoy interesado en comprar esclavos."
 me_parthia.2081.b:0 "Habla con los lugareños y aprende sobre sus prácticas culturales."
 me_parthia.2081.c:0 "Deberíamos tomar un poco de té y contratar a un esclavo para que nos lea."
 me_parthia.2081.d:0 "Mis bolsillos están vacíos..."

 me_parthia.2082.t:0 "Ruta de la Seda - Administradores de Luoyang"
 me_parthia.2082.desc:0 "Una de las razones por las que #E Luoyang#! logró mantener su libertad durante los días oscuros del asedio se debió sin duda al ejército de burócratas que dirigía la ciudad. Debido a que el #E Emperador#! y los ejércitos imperiales no estaban presentes en la región, la cuidadosa delegación de tareas cruciales era de absoluta importancia, y sólo los hombres de alto nivel y carácter estaban autorizados a gobernar en nombre del Emperador.\n\nPero los burócratas habían demostrado su valía, una y otra vez.\n\nDurante el reciente asedio de la ciudad, por ejemplo, el Los funcionarios locales organizaron la resistencia de muchas maneras valiosas, incluido el fomento de la formación de milicias para patrullar las calles y el racionamiento cuidadoso de los suministros de cereales almacenados. Sin estos administradores dirigiendo el barco, Luoyang habría caído en manos del enemigo hace mucho tiempo; un testimonio de sus habilidades administrativas superiores."
 me_parthia.2082.a:0 "Parece útil adquirir conocimientos sobre sus leyes"
 me_parthia.2082.b:0 "Sería mejor aprender a delegar tareas a los gobernadores."

 me_parthia.2083.t:0 "Ruta de la Seda - Tejedores de Seda"
 me_parthia.2083.desc:0 "Cuando nuestro guía local le dijo a [ROOT.GetCountry.GetRuler.GetName] que había tejedores de seda @silk! operando en un distrito en las afueras de la ciudad, el [ROOT.GetCountry.GetRulerTitle] no perdió el tiempo, sino que instó a nuestro traductor a que nos llevara allí de inmediato. Aunque [ROOT.GetCountry.GetRuler.GetFirstName] no era esclavo del lujo, como parecían serlo muchos de los nobles que vivían en [ROOT.GetCountry.GetCapital.GetName], incluso [ROOT.GetCountry.GetRuler.GetSheHe] apreciaba una prenda de seda fina de vez en cuando, ya que los veranos partos eran insoportables y usar túnicas de seda ayudaba enormemente con el calor.\n\nEl recinto donde los tejedores de seda practicaban su oficio ofrecía un agradable contraste con la atmósfera hostil de #E Luoyang#!; Aquí todo era agradable y tranquilo, y los trabajadores alegres se ocupaban de sus propios asuntos. Cuando [ROOT.GetCountry.GetRuler.GetFirstName] llegó a los talleres, los trabajadores estaban ocupados colocando nidos de seda en ollas llenas de agua hirviendo.\n\nMomentos después, desde el interior del edificio principal, se escuchó un fuerte grito y los trabajadores abandonaron sus puestos para dirigirse al interior para la comida del mediodía."
 me_parthia.2083.a:0 "Quiero establecer un acuerdo comercial, aquí y ahora"
 me_parthia.2083.att:0 "Después del final de este viaje, podremos elegir #T 1 ciudad#! para el comercio de #Y seda#! @silk!, cambiando el bien comercial de una ciudad de propiedad."
 me_parthia.2083.b:0 "¡Intentemos robar sus gusanos de seda para la producción nacional!"
 me_parthia.2083.btt:0 "#R ¡Podemos intentar robar gusanos de seda!#!"
 PTH_luoyang_silk0:0 "Podremos elegir #T 1 Ciudad#! para el comercio de #Y Seda#! @silk!, cambiando el bien comercial de una ciudad propia."
 PTH_luoyang_silk1:0 "Podremos elegir #T 1 Ciudad#! para la producción de #Y Seda#! @silk!, cambiando el bien comercial de una ciudad propia."
 PTH_luoyang_silk2:0 "Podremos elegir #T 2 ciudades#! para la producción de #Y Seda#! @silk!, cambiando los bienes comerciales de cualquier ciudad de propiedad."
 PTH_luoyang_silk3:0 "¡Desbloquearemos una #T Decisión#! que permitirá cambiar cualquier provincia a #Y Seda#! @silk! producción!"

 me_parthia.2086.t:0 "Robar seda: ¡gran éxito!"
 me_parthia.2086.desc:0 "Llevando un dedo a [ROOT.GetCountry.GetRuler.GetHerHis] los labios para pedir silencio, [ROOT.GetCountry.GetRuler.GetName] desmontó silenciosamente y se deslizó a través de la valla que separaba a los @silk! tejedores de seda de la concurrida calle. Caminando de puntillas en silencio, el [ROOT.GetCountry.GetRulerTitle] logró llegar a un banco de trabajo sin despertar sospechas y, para [ROOT.GetCountry.GetRuler.GetHerHis] deleite, encontró un paquete de grandes pergaminos escondidos debajo de una tela pesada. Metiéndolos en [ROOT.GetCountry.GetRuler.GetHerHis] capa, [ROOT.GetCountry.GetRuler.GetFirstName] se liberó [ROOT.GetCountry.GetRuler.GetHerHim] de la delicada situación y los partos pudieron escapar sin ser detectados.\n\nHoras más tarde, nuestro guía local pudo traducirnos los pergaminos y confirmó que habíamos robado un manual de capataz: ¡el secreto para hacer seda era nuestro!"
 me_parthia.2086.a:0 "¡No puedo creer que esto haya sido tan fácil!"

 me_parthia.2087.t:0 "Robar seda: ¡éxito medio!"
 me_parthia.2087.desc:0 "[ROOT.GetCountry.GetRuler.GetName] saltó la valla y se arrastró hacia los @silk! bancos de trabajo de los tejedores de seda, lo que provocó que [ROOT.GetCountry.GetRuler.GetHerHis] los compañeros de viaje se rieran al ver al parto [ROOT.GetCountry.GetRulerTitle] retorciéndose sobre manos y rodillas. [ROOT.GetCountry.GetRuler.GetFirstName] estaba inspeccionando cuidadosamente una pila de papeles encontrados dentro de una caja fuerte cuando un grito repentino desde la casa rompió el silencio: ¡alguien nos había atrapado y se dio la alarma! \n\nAgarrando todo lo que [ROOT.GetCountry.GetRuler.GetSheHe] pudo, [ROOT.GetCountry.GetRuler.GetFirstName] se lanzó hacia el [ROOT.GetCountry.GetRuler.GetHerHis] caballo, y los partos ladrones pudieron escapar sin ser seguidos. Mucho más tarde, nuestro traductor confirmó que habíamos robado un diagrama que describía cómo hacer seda a partir de nidos de gusanos."
 me_parthia.2087.a:0 "Fuimos audaces y valió la pena... ¡bien!"

 me_parthia.2088.t:0 "Robar seda: ¡pequeño éxito!"
 me_parthia.2088.desc:0 "Es cierto que las cosas podrían haber ido mejor, pero [ROOT.GetCountry.GetRuler.GetName] tuvo suerte de escapar sin provocar la ira de los @silk! tejedores de seda después de que [ROOT.GetCountry.GetRuler.GetSheHe] fracasara en el intento de robar en sus bancos de trabajo. El astuto [ROOT.GetCountry.GetRulerTitle] logró entrar al complejo sin llamar la atención, pero justo cuando [ROOT.GetCountry.GetRuler.GetSheHe] estaba colocando un pergamino robado en la capa de [ROOT.GetCountry.GetRuler.GetHerHis], un grupo de trabajadores rodeó a [ROOT.GetCountry.GetRuler.GetHerHim] y comenzó a gritar enojado.\n\nAfortunadamente, [ROOT.GetCountry.GetRuler.GetFirstName] pudo encantar a [ROOT.GetCountry.GetRuler.GetHerHis] para salir de la situación, ofreciéndole una pequeña sobornó a los esclavos para que permitieran que [ROOT.GetCountry.GetRuler.GetHerHim] se fuera, pero estaba demasiado cerca para su comodidad y el [ROOT.GetCountry.GetRulerTitle] comenzó a preguntarse si era hora de regresar a [ROOT.GetCountry.GetCapital.GetName]."
 me_parthia.2088.a:0 "Eh, esto es mejor que nada, supongo."

 me_parthia.2084.t:0 "Ruta de la Seda - Campo de entrenamiento de Luoyang"
 me_parthia.2084.desc:0 "Mientras el séquito parto se dirigía a los campos de entrenamiento donde practicaban las milicias locales, el guía contratado por [ROOT.GetCountry.GetRuler.GetName] explicó las drásticas circunstancias que llevaron a su formación. Al igual que nosotros, los #E chinos#! prohibieron a los plebeyos armarse; sólo a los jinetes y otros funcionarios de alto rango se les permitía portar abiertamente espadas o lanzas, pero el reciente #E asedio de Luoyang#! había forzado cambios incómodos.\n\nPara liberar la mano de obra necesaria para proteger las murallas, se habían formado milicias ciudadanas. Y para sorpresa de [ROOT.GetCountry.GetRuler.GetFirstName], incluso había mujeres marchando junto a los hombres. Se esperaba que todos los que vivían en la ciudad ayudaran; los niños sacaban agua de los pozos o llevaban mensajes hacia y desde las murallas, y los ciudadanos soldados patrullaban las calles para mantener la paz del Emperador."
 me_parthia.2084.a:0 "Ver el entrenamiento es suficiente para aprender, ¿no crees?"
 me_parthia.2084.b:0 "Contrata a algunos de sus mejores instructores."
 PTH_end_journey0:0 "Ya he visto suficiente... volvamos a casa."
 PTH_end_journey1:0 "Abandonaremos la expedición y regresaremos a casa.\n#Y Esto pondrá fin a la cadena de eventos.#!"
 PTH_end_journey2:0 "Por fin ha llegado el momento de volver a casa. #Y Nuestro viaje terminará#!."

 me_parthia.209.t:0 "Ruta de la Seda - De regreso a casa"
 me_parthia.209.desc:0 "Una mañana, [ROOT.GetCountry.GetRuler.GetName] dio la noticia a [ROOT.GetCountry.GetRuler.GetHerHis] compañeros de viaje; Después de pasar meses fuera de casa, llegó el momento de volver sobre nuestros pasos y regresar a la seguridad del reino parto. Hemos adquirido mucha sabiduría y conocimiento en esta aventura, pero últimamente, los sueños de [ROOT.GetCountry.GetRuler.GetFirstName] se han llenado de visiones del #E Palacio Real#! en [ROOT.GetCountry.GetCapital.GetName] y los sonidos de la familia [ROOT.GetCountry.GetRuler.GetHerHis] riendo en sus pasillos. Tomando esto como un presagio, el [ROOT.GetCountry.GetRulerTitle] está más que listo para emprender el viaje a casa.\n\nNuestros guías han informado a [ROOT.GetCountry.GetRuler.GetFirstName] que deberíamos ver las murallas de la capital parta en unos dos meses."
 me_parthia.209.a:0 "Este ha sido verdaderamente el viaje de su vida..."

 me_parthia.210.t:0 "Ruta de la Seda - Por fin en casa"
 me_parthia.210.desc:0 "Uno de los recuerdos más felices en la vida de [ROOT.GetCountry.GetRuler.GetName] fue cuando las torres de vigilancia de [ROOT.GetCountry.GetCapital.GetName] aparecieron en el horizonte; Después de meses de aventuras, finalmente la delegación comercial parta había regresado a la capital. La vista de los muros de [ROOT.GetCountry.GetCapital.GetName] provocó que estallaran vítores entre los cansados ​​viajeros, quienes de repente recuperaron el aliento y apresuraron con entusiasmo sus monturas hacia las puertas orientales de la ciudad.\n\nSe celebró una fiesta para conmemorar el regreso sano y salvo del [ROOT.GetCountry.GetRulerTitle], y se sacrificaron docenas de animales a los dioses para agradecerles por proteger a [ROOT.GetCountry.GetRuler.GetFirstName]. Mientras los platos de carne asada, vino y panes recién horneados eran llevados al salón de banquetes, [ROOT.GetCountry.GetRuler.GetFirstName] aplaudió [ROOT.GetCountry.GetRuler.GetHerHis] y pidió que todos los tesoros que los partos habían traído consigo se exhibieran ante todos los presentes."
 me_parthia.210.a:0 "¡Mira todos los tesoros que trajimos a casa!"
 PTH_travel_jade_tt:0 "Podremos cambiar el bien comercial de #Y 1 ciudad#! a @jade! Jade mediante una #T Decisión#!."
 PTH_luoyang_silk_var1.tt:0 "Podremos cambiar el bien comercial de #Y 1 ciudad#! a @silk! Seda mediante una #T Decisión#!."
 PTH_luoyang_silk_var2.tt:0 "Podremos cambiar el bien comercial de #Y 2 Ciudades#! a @silk! Seda mediante una #T Decisión#!."
 PTH_luoyang_silk_var3.tt:0 "Podremos cambiar los bienes comerciales de las provincias a @silk! Seda mediante una #T Decisión#!."

 me_parthia.211.t:0 "Establecer el emporio de jade"
 me_parthia.211.desc:0 "¿Dónde deberíamos establecer un #E Emporio de Jade#!, [ROOT.GetCountry.GetRuler.GetName]? El jade @jade! es un bien comercial verdaderamente raro, y cualquier lugar bendecido con este mercado prosperará por encima de todos los demás."
 me_parthia.211.a:0 "Elijamos hacer esto en [pth_to_change_1.GetName]."
 me_parthia.211.b:0 "Elija [pth_to_change_2.GetName]."
 me_parthia.211.c:0 "[pth_to_change_3.GetName] parece la mejor opción."
 me_parthia.211.d:0 "[pth_to_change_4.GetName] debería convertirse en un centro de comercio de jade."
 me_parthia.211.e:0 "Vaya con [pth_to_change_5.GetName]."
 me_parthia.211.f:0 "Pensándolo bien, deja esos planes para más adelante."

 me_parthia.212.t:0 "Establecer el emporio de la seda"
 me_parthia.212.desc:0 "¿Dónde le gustaría construir un #E Emporio de la seda#!, [ROOT.GetCountry.GetRuler.GetName]? La seda @silk! vale su peso en oro, y cualquier lugar bendecido con este mercado prosperará por encima de todos los demás."
 me_parthia.212.a:0 "Elijamos hacer esto en [pth_to_change_1.GetName]"
 me_parthia.212.b:0 "Elija [pth_to_change_2.GetName]"
 me_parthia.212.c:0 "[pth_to_change_3.GetName] parece la mejor opción"
 me_parthia.212.d:0 "[pth_to_change_4.GetName] debería convertirse en un centro de comercio de seda"
 me_parthia.212.e:0 "Ir con [pth_to_change_5.GetName]"
 me_parthia.212.f:0 "Pensándolo bien, deja esos planes para más tarde."

 me_parthia.213.t:0 "Establecer la producción de seda"
 me_parthia.213.desc:0 "Nuestros trabajadores han aprendido mucho de los pergaminos que [ROOT.GetCountry.GetRuler.GetName] robaron a los tejedores de seda en #E Luoyang#!, y ha llegado el momento de establecer nuestras propias instalaciones de producción de seda. ¿Dónde deberíamos construir los talleres, mi [ROOT.GetCountry.GetRulerTitle]?"
 me_parthia.213.a:0 "Elijamos hacer esto en [pth_to_change_1.GetName]"
 me_parthia.213.b:0 "Elija [pth_to_change_2.GetName]"
 me_parthia.213.c:0 "[pth_to_change_3.GetName] parece la mejor opción"
 me_parthia.213.d:0 "[pth_to_change_4.GetName] debería convertirse en un centro de fabricación"
 me_parthia.213.e:0 "Ir con [pth_to_change_5.GetName]"
 me_parthia.213.f:0 "Pensándolo bien, deja esos planes para más tarde."
 
 me_parthia.299.t:0 "Diferentes puntos de vista"
 me_parthia.299.desc:0 "Aunque algunos se quejaron de que gastar una suma tan grande para contratar profesores religiosos era un desperdicio astronómico, [ROOT.GetCountry.GetRuler.GetName] no quiso escuchar nada de eso. Nuestro dominio se encuentra en la encrucijada de la cultura y la fe, y hay muchos sistemas de creencias que nuestro pueblo favorece. Para comprender mejor las muchas corrientes que fluyen a través de [ROOT.GetCountry.GetName], el sabio [ROOT.GetCountry.GetRulerTitle] creyó que era necesario contratar a un grupo de sabios, ofreciéndoles a cada uno un gran estipendio para que pudieran enseñar en [ROOT.GetCountry.GetCapital.GetName] sin tener que preocuparse por los costos de mantenerse.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] espera que estos esfuerzos fomenten un espíritu de comprensión y hermandad entre nuestras diferentes religiones. Comunidades, y ha alentado activamente a estos filósofos a mantener diálogos públicos en la [ROOT.GetCountry.GetAdjective] capital."
 me_parthia.299.a:0 "Abran sus oídos y sus corazones y escuchen con la mente liberada."

 me_parthia.300.t:0 "$parthia_missions_81$"
 me_parthia.300.desc:0 "Los #E medos#! son numerosos, ingeniosos, ricos y educados. Como tales, sólo se deduce que deberían convertirse en la columna vertebral de cualquier imperio iraní. Si bien muchos de los #E medos#! han venido a adorar al Señor #E Ahura Mazda#!, muchos todavía se aferran a la adoración del gran Señor de la Luz, #E Mitra#!. Esto es algo que puede rectificarse fácilmente, si así lo deseamos."
 me_parthia.300.a:0 "Se utilizarán sus habilidades"

 me_parthia.301.t:0 "$parthia_missions_82$"
 me_parthia.301.desc:0 "Siguiendo el camino de #E Mitra#!, debemos aceptar la realidad de que el #E zoroastrismo#! (Mazdayasna) es la religión dominante en la #E meseta iraní#!. Debemos hacer uso de sus tradiciones e innovaciones si queremos ser vistos como Señores Supremos legítimos y benévolos."
 me_parthia.301.a:0 "La tolerancia puede ser un sólido pilar del Estado"
 me_parthia.302.t:0 "$parthia_missions_83$"
 me_parthia.302.desc:0 "En las silenciosas cámaras de los #E Templos del Fuego#!, sacerdotes con voces como ríos antiguos entonaban los versos sagrados del #E Avesta#!, y sus palabras resonaban con la sabiduría de #E Zaratustra#!. Los feligreses devotos se sentaban sobre esteras tejidas, con los ojos cerrados en señal de reverencia, absorbiendo las enseñanzas espirituales y los preceptos morales transmitidos de generación en generación. Estas recitaciones no eran meros sonidos sino tradiciones vivas que conectaban a los fieles con su herencia divina y guiaban su vida diaria."
 me_parthia.302.a:0 "Fascinante..."
 me_parthia.303.t:0 "$parthia_missions_84$"
 me_parthia.303.desc:0 "Los cambios de estaciones y llamas en los #E Templos del Fuego#! marcaban el cambio de días según el calendario #E zoroástrico#!, guiando a los agricultores sobre cuándo sembrar y cosechar. Las familias observaron meticulosamente las dedicatorias de cada día y mes, ofreciendo oraciones específicas y realizando rituales para honrar a los #E Yazatas#!. #E Nowruz#!, el equinoccio de primavera, era la ocasión más alegre, celebrada como la renovación de la creación y el triunfo de la luz, uniendo a las comunidades en festividades vibrantes."
 me_parthia.303.a:0 "De un día para el otro..."
 me_parthia.304.t:0 "$parthia_missions_85$"
 me_parthia.304.desc:0 "Desde pueblos lejanos y rutas comerciales bulliciosas, los peregrinos viajaban hacia #E Hagmatana#!, con el corazón iluminado por la anticipación de presenciar el venerado #E Gran Templo del Fuego#!. A medida que se acercaban a la capital meda, se decía que el brillo de la llama sagrada era visible a kilómetros de distancia, un faro de presencia divina. En el interior, en medio de la luz parpadeante y el fragante incienso, ofrecieron sus oraciones, sintiendo una profunda conexión con #E Ahura Mazda#! y las antiguas tradiciones."
 me_parthia.304.a:0 "Todos los seguidores deben visitar aquí alguna vez."
 me_parthia.305.t:0 "$parthia_missions_86$"
 me_parthia.305.desc:0 "Los magos, clase sacerdotal vinculada a la nobleza meda, ejercen una influencia increíble en todo el territorio iraní. Algunos dicen que están imbuidos del poder de #E Magikos#!, palabras convincentes y conocimientos de tiempos pasados. Es bastante obvio que lo mejor para nosotros es vivir bien con esta clase, ya que puede resultar crucial para la estabilidad y la armonía del reino."
 me_parthia.305.a:0 "Esperemos que no se vuelvan demasiado influyentes."
 me_parthia.306.t:0 "$parthia_missions_87$"
 me_parthia.306.desc:0 "Entre todos los dioses, #E Mitra#! es el más antiguo y el más santo. El exaltado nos ha elegido para llevar a todo nuestro pueblo a la grandeza. ¡Que esta tierra sea conocida de ahora en adelante como #E La Tierra del Señor de la Luz#!!"
 me_parthia.306.a:0 "¡Gloria a Mitra!"
 me_parthia.307.t:0 "$parthia_missions_89$"
 me_parthia.307.desc:0 "#E 'El dador de gobierno', #! - uno de los epítetos de Mitra - es indicativo de su naturaleza y central para nuestras creencias. Representa su derecho divino de dar bendiciones a los gobernantes. Debemos honrar el título #E Dador de reglas#! y mostrar que somos justos con nuestros súbditos, extendiendo la gracia de Mitra en este reino mortal."
 me_parthia.307.a:0 "Que todos conozcan su sabiduría."
 me_parthia.308.t:0 "$parthia_missions_90$"
 me_parthia.308.desc:0 "Apolo, dios de muchos yauna (griegos), es notablemente similar a Mitra. Comparten iconografía y temas de la luz, el sol y la ley. Quizás sean en realidad representantes del mismo dios verdadero, conocido sólo por un nombre diferente."
 me_parthia.308.a:0 "Esto acerca a nuestros súbditos griegos."
 me_parthia.309.t:0 "$parthia_missions_91$"
 me_parthia.309.desc:0 "Ubicado en el corazón de la tierra sagrada de #E Arshak#! se encuentra el Gran Fuego de los #E Arsácidas#!, una llama que ha ardido desde los días de nuestros antepasados, atendida sin cesar por los magos elegidos del linaje real. Más que un hogar ritual, este fuego sagrado es un símbolo viviente de nuestro pacto eterno con el gran dios #E Mitra#!, guardián de la verdad, el juramento y el orden justo.\n\nSu resplandor refleja nuestro compromiso inquebrantable de defender el divino #E Ash#! a, la verdad cósmica, y difundir la luz de #E La justicia de Mitra#! en todas las tierras bajo el cielo. Mientras arda, también brillará la voluntad de los #E arsácidas#! como faros de piedad, fuerza y ​​destino imperial."
 me_parthia.309.a:0 "Arderá para siempre"
 me_parthia.310.t:0 "$parthia_missions_92$"
 me_parthia.310.desc:0 "Estar imbuido de Kharenah, o Khvarenah, es estar imbuido de gloria y esplendor divinos. El único ser en todo el Universo que puede imbuir a Kharenah es el del gran Mitra. Y por la gracia de su santa luz, nuestro líder, el gran #E Rey de Reyes [ROOT.GetCountry.GetRuler.GetName]#!, ha sido imbuido de este poder."
 me_parthia.310.a:0 "¡Gloria a nuestra santa dinastía!"
 me_parthia.311.t:0 "$parthia_missions_93$"
 me_parthia.311.desc:0 "El fundador de este gran imperio que hemos construido, señor #E Arsaces#!, imbuido de #E Kharenah#!, moldeado por el #E Fuego#!, y brilla como un reflejo de #E Mitra#! ha alcanzado la divinidad en sus logros."
 me_parthia.311.a:0 "¡Todos saluden al piadoso [ROOT.GetCountry.GetRuler.GetName]!"
 
 me_parthia.320.t:0 "$parthia_missions_109$"
 me_parthia.320.desc:0 "Para adoptar y observar adecuadamente la adoración de los [GetReligion('roman_pantheon').GetName] dioses hemos tenido que aprender una serie de nuevos rituales y proclamar el griego, lo que podría decirse que es el idioma más de moda de nuestros tiempos, como el idioma de adoración. Esto, a su vez, ha significado que la demanda para cualquiera que hable griego ha aumentado, y muchos miembros de nuestra nueva clase sacerdotal pueden tener... una moralidad inferior a la ideal.\n\nDebemos asegurarnos de que las deficiencias de esta nueva clase sacerdotal sean sólo temporales y un mero síntoma de cambio."
 me_parthia.320.a:0 "¡Apoteosis!"
 me_parthia.321.t:0 "$parthia_missions_110$"
 me_parthia.321.desc:0 "El culto a #E Zeus-Oromasdes#! se nos ha difundido. Se ha vuelto popular en todas nuestras provincias #E zoroástricas#!, a pesar de estar asociado principalmente con las prácticas #E medianas#! y, por extensión, #E mitraicas#!. Adoptarlo ayudará en última instancia a nuestra conversión en lugar de obstaculizarla; En lugar de dioses extranjeros, nuestro pueblo los verá como variaciones de los suyos."
 me_parthia.321.a:0 "Veamos de qué se trata todo esto..."
 me_parthia.322.t:0 "$parthia_missions_111$"
 me_parthia.322.desc:0 "La codificación de las #E Avestas#! y su traducción al #E griego#! no sólo apaciguará a la enorme población #E zoroástrica#!, sino que también promoverá el entendimiento entre las tradiciones #E griega e iraní#!. ¡Quién hubiera pensado que la gente de la estepa fomentaría tales avances en el conocimiento #E heleno-persa#!!"
 me_parthia.322.a:0 "¡Traduce, codifica y unifica!"
 me_parthia.323.t:0 "$parthia_missions_112$"
 me_parthia.323.desc:0 "En los pueblos áridos de #E Persia#! la religión más practicada es, por un amplio margen, el antiguo [GetReligion('zoroaster').GetName] rito. Un precursor tanto para nosotros como para los #E Seléucidas#!, todavía tiene primacía sobre la tierra, es su propia fe nativa.\n\nComo tal, hemos decidido adoptar el calendario zoroástrico para todos los propósitos cívicos, es decir, para todo menos la práctica religiosa."
 me_parthia.323.a:0 "Un compromiso necesario."
 me_parthia.324.t:0 "$parthia_missions_113$"
 me_parthia.324.desc:0 "''Sería muy hermoso y complacería a los cielos si hiciéramos de este gran templo un espejo de la sociedad a la que sirve'', dijo [SCOPE.sChar('prnzeeeeal').GetPraenomen]. Algunos fanáticos religiosos comenzaron a causar alboroto entre la multitud, jurando herejía y tuvieron que ser llevados por guardias armados. Las cuestiones de religión siempre están destinadas a causar disensión. Inspiró y continuó.\n\n''Y como tal, este templo ahora es más grande que él mismo, es la manifestación del reino y el diálogo entre los sabios entre todos nosotros, es un santuario para todos nosotros. Un piso para [GetReligion('mithra_religion').GetName]#E s#!, un piso para [GetReligion('zoroaster').GetName]#E s#!, un piso para [GetReligion('roman_pantheon').GetName]#E s#!, ¡y una casa para todos!''"
 me_parthia.324.a:0 "¡Alabado sea vuestros dioses!"
 me_parthia.325.t:0 "$parthia_missions_114$"
 me_parthia.325.desc:0 "Se convocó así un concilio en el antiguo [GetProvince('(int32)1627').GetName], en el templo de culto a #E Zoroastro#!, entre los sacerdotes zoroástricos y los partos. Y con gran pompa llegaron allí tanto [SCOPE.sChar('prnpriiest').GetName] como [ROOT.GetCountry.GetRuler.GetName]. \n\nLos Magos, nombre de estos sacerdotes, no sólo eran sabios sino que también tenían una influencia significativa en nuestra población zoroástrica, y exigían reconocimiento por sus tradiciones, igualdad de acceso a los cargos gubernamentales y que pudieran enseñar en igualdad de condiciones con las filosofías y teologías del resto.\n\nEn uno de los intervalos entre negociaciones, [SCOPE.sChar('prnpriiest').GetFirstName] recurrió a [ROOT.GetCountry.GetRuler.GetFirstName] y se lamentó ''Cada día que pasa parece que nuestra decisión de convertirnos a [GetReligion('roman_pantheon').GetName] importa menos. También podríamos adorar a todos los dioses...'' [ROOT.GetCountry.GetRuler.GetFirstName] se encogió de hombros."
 me_parthia.325.a:0 "Al menos hay paz."
 me_parthia.326.t:0 "$parthia_missions_115$"
 me_parthia.326.desc:0 "Sobre un loto se encuentra Apolo-Mitra, siempre vigilante y omnividente gracias a la luz que de él emana, nadie lo engaña y la profecía es suya. Esta unión de dos tradiciones, del lejano occidente griego y de nuestras tierras, es una muestra del poder que tiene el contacto entre distintos dioses, y muchos lugares como [GetProvince('(int32)4993').GetName] han sido arrasados ​​por su culto."
 me_parthia.326.a:0 "¡Alabado sea!"
 me_parthia.327.t:0 "$parthia_missions_116$"
 me_parthia.327.desc:0 "A medida que los dioses zoroástricos y griegos convergen en costumbres religiosas heleno-partas más unificadas, se vuelve cada vez más evidente que no hay mucho que separe a los helenos y los nativos de las tierras iraníes. Esto debe celebrarse y alentarse aún más."
 me_parthia.327.a:0 "hasta que todos sean uno"
 me_parthia.328.t:0 "$parthia_missions_117$"
 me_parthia.328.desc:0 "Los recientes proyectos de construcción en una de las áreas menos desarrolladas de [ROOT.GetCountry.GetCapital.GetName] culminaron con una estatua entre todos los edificios nuevos; uno de [GetDeityDefinition('omen_apollo_mithras').GetName] con un arco derribando a la aterradora bestia #E Pitón#!, fue al principio elogiado por su arte (seguramente hecho con la bendición del dios), y ahora también es un lugar de adoración a la deidad. Nuestra capital ahora seguramente está protegida de la oscuridad y la ignorancia por el dios."
 me_parthia.328.a:0 "¡Una obra maestra!"
 me_parthia.329.t:0 "$parthia_missions_118$"
 me_parthia.329.desc:0 "En una ceremonia solemne para la corte y algunos dignatarios extranjeros, los soldados más experimentados de nuestro ejército se reunieron para adorar [GetDeityDefinition('omen_herakles_artagnes').GetName] en una de las experiencias más sorprendentes que jamás se haya visto.\n\nEn un campo sagrado dedicado al dios, los hombres se formaron, comenzaron a cantar tan fuerte como pudieron y marcharon sobre un batallón formado por prisioneros de guerra. Justo cuando la espada se preparaba para saciar su implacable sed, los hombres se arrodillaron y juraron a [GetDeityDefinition('omen_herakles_artagnes').GetName], pidiendo su protección en la batalla y luego hicieron ofrendas en sangre en ese mismo campo. Luego, más tarde, pintaron cada uno de sus escudos con imágenes del dios, para que en la batalla formaran un espectáculo que hiciera temblar a cualquier enemigo."
 me_parthia.329.a:0 "¡Una cantidad vertiginosa de santidad!"
 me_parthia.330.t:0 "$parthia_missions_119$"
 me_parthia.330.desc:0 "En toda nuestra tierra, y especialmente en [GetProvince('(int32)1595').GetName], la influencia de la diosa Afrodita-Anaitis se siente profundamente. Como guardiana divina del amor, la fertilidad y las aguas sagradas, su presencia adorna tanto el templo como el hogar. En esta era de aprendizaje y prosperidad, no solo la razón nos guía, sino también la suave fuerza del afecto, la belleza y la unión.\n\nSus bendiciones han ablandado los corazones, fortalecido a las familias y traído armonía donde antes persistían los conflictos."
 me_parthia.330.a:0 "No debemos descuidar el amor"
 me_parthia.331.t:0 "$parthia_missions_121$"
 me_parthia.331.desc:0 "Pocos podrían tener la visión que tuvo el [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] de conducir a [ROOT.GetCountry.GetName] hacia este nuevo y brillante futuro en el que nos encontramos; Así como eliminamos los viejos dioses y encontramos otros nuevos, esta línea real es en sí misma el espíritu que eligió a nuestro pueblo para ser guiado hacia un nuevo destino. Como tal, a partir de hoy se ha instituido un culto real al [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]; son santos y merecedores de adoración."
 me_parthia.331.a:0 "magnifico"
 #me_parthia.331.tt:0 "[deification_scope.GetName] has been deified as [GetDeityDefinition('omen_zeus_oromasdes').GetName|Y]!"
 
