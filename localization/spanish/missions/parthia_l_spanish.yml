 #Hellenic
 parthia_missions_109:0 "Clase sacerdotal helénica"
 parthia_missions_109_DESC:0 "Como el [GetReligion('indo_iranian_religion').GetName] ya no sirve para nuestros propósitos, tenemos que acabar con un sacerdocio de chamanes y rituales extraños y establecer uno de sacerdotes serios con las debidas ritos.\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 parthia_missions_110:0 "El culto a Zeus-Oromasdes"
 parthia_missions_110_DESC:0 "El culto a #Y Zeus-Oromasdes#! proviene del oeste, en una región sincrética conocida como Commagene. Aunque se asocia principalmente con las #E Medianas#!, y por extensión, el #E Mitraico#!, #Y Zeus-Oromasdes#! se ha vuelto popular en todas nuestras provincias #E Zoroastrianas#!. Adoptarlo ayudará en última instancia a nuestra conversión en lugar de obstaculizarla.\n\n\n\n\n\n\n\n\n\n@persia_mil4!"
 parthia_missions_110.tt1:0 "#E ¡Este modificador estará activo mientras #Y Zeus-Oromasdes#! esté en nuestro Panteón!#!"
 parthia_missions_110.tt2:0 "Cada ciudad que tiene una religión dominante #Y zoroástrica#! obtendrá entre un 12% y un 25% de sus habitantes convertidos al #E helenismo#!."
 parthia_missions_111:0 "Traducción del Avesta"
 parthia_missions_111_DESC:0 "Hasta finales del período parto, las #E Avestas#! permanecieron sin codificar. Traducirlos al #Y griego#! para nuestros sacerdotes y codificarlos oficialmente, seguramente será un buen augurio para nosotros y nuestros sujetos.\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 parthia_missions_112:0 "Calendario de Zoroastro"
 parthia_missions_112_DESC:0 "El #T Calendario zoroástrico#! es uno de los más antiguos en uso y está configurado en 12 ''mahs'' (meses) de 30 días, con un mes adicional aproximadamente cada 3 años. La mayoría de nuestra población todavía lo utiliza, por lo que nos vendrá bien hacerlo.\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 parthia_missions_113:0 "Un nuevo piso griego"
 parthia_missions_113_DESC:0 "El #E Gran Templo del Fuego#! en #T Hagmatana#! fue construido por los #G medos#! y ampliado por los #G persas#!. Es hora de que nosotros #G Partos#! dejemos nuestra huella ampliándolo a un tercer piso, incorporando arquitectura y columnas #G griegas#! para crear un espectáculo verdaderamente único para adoradores.\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 parthia_missions_114:0 "Negociar con los Reyes Magos"
 parthia_missions_114_DESC:0 "Con la introducción de una nueva clase sacerdotal, hay mucho malestar en la clase existente de #T Magos#!. Su poderoso uso de #T Magikos#! puede derribar todo el Estado que acabamos de construir, y es imperativo que negociemos con ellos, para que no sintamos la ira de sus dioses.\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 parthia_missions_115:0 "Exaltado es Apolo-Mitra"
 parthia_missions_115_DESC:0 "#G Apolo-Mitra#!, el exaltado, se ha convertido en uno de los dioses más poderosos, populares e influyentes de nuestra tierra. El poder y prestigio de nuestro gran reino es gracias a la acción de la #T Primera Luz#!.\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 we_have_hellenic_ct:0 "Adoramos a 2 #Y Deidades helénicas#! en nuestro Panteón."
 parthia_missions_116:0 "Interpretación parthica"
 parthia_missions_116_DESC:0 "A medida que los dioses zoroástricos y griegos convergen en costumbres religiosas heleno-partas más unificadas, se vuelve cada vez más evidente que no hay mucho que separe a los helenos y los nativos de las tierras iraníes. Esto debe celebrarse y fomentarse aún más.\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 parthia_missions_117:0 "Arco de Apolo-Mitra"
 parthia_missions_117_DESC:0 "Un aspecto exclusivo del culto #G helénico#! a #G Apolo#! es el arco del gran dios. Deberíamos trabajar para integrar estas imágenes en la adoración de #G Apolo-Mitra#! para inspirar a las futuras generaciones de guerreros que continuarán luchando en el seno del señor de la luz. Nombre.\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 parthia_missions_118:0 "Espada De Artagnes-Herakles-Ares"
 parthia_missions_118_DESC:0 "El dios #G Artagnes-Herakles-Ares#! es uno que realmente nos ayudará a hacer que nuestros enemigos se retiren con cobardía. Su poder divino sobre la guerra, la fuerza y la conquista justa acabará con todos los que se opongan al poderoso #G pie parto#! soldado.\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 parthia_missions_119:0 "Amor por Afrodita-Anaitis"
 parthia_missions_119_DESC:0 "Diosa del amor y la fertilidad, la santa #G Afrodita-Anaitis#! seguramente ayudará a nuestro poderoso líder a asegurar un futuro para este reino. Dejemos que su abrazo amoroso nos impulse a todos.\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 parthia_missions_120:0 "Apolo-Mitra-Helios-Hermes"
 parthia_missions_120_DESC:0 "CORTAR TAREA"
 parthia_missions_121:0 "Culto real de Arsaces"
 parthia_missions_121_DESC:0 "Pocos poseían la visión de [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective], quien guió a [ROOT.GetCountry.GetName|T] hacia el futuro radiante que ahora abrazamos. A medida que desechamos las viejas tradiciones y acogimos nuevas costumbres, fue esta línea real la que se convirtió en el vehículo viviente del propósito divino de nuestro pueblo.\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 parthia_missions_121.tt:0 "#E ¡Este modificador estará activo mientras #Y [deification_scope.GetName]#! esté en nuestro Panteón!#!"
 parthia_missions_122:0 "Fuego de Oromazdes"
 parthia_missions_122_DESC:0 "CORTAR TAREA"
 #Buddhism
 parthia_missions_123:0 "La conversión de [ROOT.GetCountry.GetRuler.GetName]"
 parthia_missions_123_DESC:0 "La conversión de [ROOT.GetCountry.GetRuler.GetName] será una leyenda #E budista#! legendaria de todos los tiempos...\n\n\n\n\n\n\n\n\n\n@india_mil12!"
 parthia_missions_124:0 "Aparición de Buda-Mazda"
 parthia_missions_124_DESC:0 "Con la religión de nuestra realeza convirtiéndose en #E budismo#!, otros nobles también han comenzado a convertirse. La interacción del #E budismo#! con los pueblos principalmente #E iraníes#! y #E zoroástricos#! de nuestro estado ha dado como resultado el surgimiento del #E Buda-Mazda#!, el gran señor y profesor.\n\n\n\n\n\n\n\n\n\n@india_mil13!"
 parthia_missions_125:0 "Persificación del canon pali"
 parthia_missions_125_DESC:0 "El #E Canon Pali#! es la colección autorizada de escrituras para el #E Budismo Theravada#!. También se le conoce como #E Tipitaka#!, que significa las Tres Canastas. Deberíamos traducirlos a los conceptos #E persa#! y #E perisify#! para que nuestros usuarios puedan entenderlos mejor. Personas.\n\n\n\n\n\n\n\n\n\n@persia_mil4!"
 parthia_missions_126:0 "El calendario budista"
 parthia_missions_126_DESC:0 "Presentar el #Y Calendario budista#! será difícil. El pueblo de #E Irán#! utiliza muchos calendarios, el más destacado de los cuales es el #Y Calendario zoroástrico#!, y también el #Y Calendario macedonio#!. Sin embargo, para reflejar mejor los valores de nuestro estado, deberíamos adoptar el #Y Calendario budista#!.\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 parthia_missions_127:0 "La gran estupa del fuego"
 parthia_missions_127_DESC:0 "La ciudad de #Y Hagmatana#! alberga un maravilloso #R Templo del Fuego#!, que se remonta a la época de los #Y Medianos#! y fue construido por los #E Aqueménidas#!. Deberíamos utilizar el templo y transformarlo para usarlo como #Y Stupa#!.\n\n\n\n\n\n\n\n\n\n@india_mil2!."
 parthia_missions_128:0 "Debate Los Reyes Magos"
 parthia_missions_128_DESC:0 "La poderosa clase #E Magi#! es una fuerza que no debe ser tenida en cuenta... como sea que lo hagamos. Representan la barrera definitiva hacia la conversión a una clase sacerdotal #E budista#! y, en la tradición tradicional #E sramánica#!, la mejor manera de abordarlos es ideológica. Debates.\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 parthia_missions_129:0 "El Mahayana Mitra"
 parthia_missions_129_DESC:0 "Si bien generalmente hemos adoptado las formas de #E Theravada#!, notamos que muchos de nuestros sujetos han adoptado ideologías más cercanas a #E Mahayana#!. Creemos que esto se debe a la reverencia a #Y Mitra#! que aún es prominente entre las familias nobles de nuestro gran estado. El dios de la luz parece resonar especialmente con la idea del #E Bodhisattva#!, el ideal que #E Mahayana#! dice que es alcanzable por todos. Este nuevo culto considera que #Y Mithra#! ha #E retrasado su propio Nirvana#! para ayudar otros.\n\n\n\n\n\n\n\n\n\n@india_mil11!"
 parthia_missions_130:0 "Imbuido de Khvarenah"
 parthia_missions_130_DESC:0 "$parthia_missions_92_DESC$"
 parthia_missions_131:0 "Moldeado para ser Cakravartin"
 parthia_missions_131_DESC:0 "Ser Cakravartin es ser el Maharajadhiaraja, el Shahenshah, el gobernante de todo el Huevo Universal. Hacer esto sin dominar los conceptos básicos es imposible. Sin embargo, se han dado pasos y la ambición de Cakravartin está a nuestro alcance.\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 parthia_missions_132:0 "Protectores del Buda"
 parthia_missions_132_DESC:0 "Mientras [ROOT.GetCountry.GetRuler.GetName|E] trabaja para dominar #Y Dhyana#!, los #G griegos#! del este han comenzado a llegar a la ahora legendaria corte del rey. Nos dan sus interpretaciones del #G budismo#!, incluida su creencia en los llamados protectores del #E Buda#!.\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 parthia_missions_133:0 "Conversión de Partia"
 parthia_missions_133_DESC:0 "Finalmente ha llegado el momento de proclamar oficialmente el #BOLD;COLOR:{0.98,0.93,0.51} budismo#! la fe de nuestro reino. Las leyendas de la conversión de [ROOT.GetCountry.GetRuler.GetName|E] resuenan por todas partes, y muchos nobles y campesinos por igual han adoptado las enseñanzas del #E Buda#!.\n\n\n\n\n\n\n\n\n\n@india_mil19!"
 parthia_missions_134:0 "Budismo más allá"
 parthia_missions_134_DESC:0 "TODO; ESTO ESTÁ CORTADO POR AHORA"
 parthia_missions_135:0 "Ilustración"
 parthia_missions_135_DESC:0 "#G Samadhi#! es un estado profundo de concentración meditativa donde la mente se vuelve perfectamente unificada, tranquila y enfocada, libre de distracciones. A medida que [ROOT.GetCountry.GetRuler.GetName|E] lo domine, muchos creen que podrá alcanzar una forma especial de #T Nirvana#! conocida como #T Sopadhishesa. Nirvana#!.\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 awakened_nick:0 "el despierto"
 parthia_missions_136:0 "Estupas y estelas"
 parthia_missions_136_DESC:0 "TODO; ESTO ESTÁ CORTADO POR AHORA"

 #Mazdayasna
 parthia_missions_137:0 "Apaciguar a los medianos"
 parthia_missions_137_DESC:0 "$parthia_missions_81_DESC$"
 parthia_missions_138:0 "Calendario de Ahura Mazda"
 parthia_missions_138_DESC:0 "$parthia_missions_84_DESC$"
 parthia_missions_139:0 "Codificación del Avesta"
 parthia_missions_139_DESC:0 "$parthia_missions_83_DESC$"
 parthia_missions_140:0 "El gran templo del fuego"
 parthia_missions_140_DESC:0 "$parthia_missions_85_DESC$"
 parthia_missions_141:0 "Maestros Magos De Mazdayasna"
 parthia_missions_141_DESC:0 "Quizás la entidad religiosa más grande de todo Irán, los Magos son la clase sacerdotal vinculada a la nobleza meda.\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 parthia_missions_142:0 "El sabio señor"
 parthia_missions_142_DESC:0 "Para sus seguidores, Ahura Mazda era venerado como \"El Señor Sabio\", el creador benevolente e increado de todo lo bueno y ordenado en el universo. Creían que encarnaba la sabiduría, la verdad y la luz supremas, guiando a la humanidad hacia la rectitud y oponiéndose a las fuerzas del caos y la oscuridad.\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 parthia_missions_143:0 "Yazata De Juramentos, De Justicia"
 parthia_missions_143_DESC:0 "$parthia_missions_81_DESC$"
 parthia_missions_144:0 "Mandatos de Mazdaya"
 parthia_missions_144_DESC:0 "$parthia_missions_82_DESC$"
 parthia_missions_145:0 "Dador de regla"
 parthia_missions_145_DESC:0 "$parthia_missions_89_DESC$"
 parthia_missions_146:0 "señor del cielo"
 parthia_missions_146_DESC:0 "El dios Zeus, adorado por muchos #Y Yauna (griegos)#!, es notablemente similar a Ahura Mazda. Muchos #Y Yauna#! han comenzado a adorar a una mezcla del Señor Sabio y Zeus llamada #G Zeus-Oromazdes#!. Quizás sean realmente lo mismo, diferentes sólo por el nombre que les damos.\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 parthia_missions_147:0 "101 nombres del señor"
 parthia_missions_147_DESC:0 "El Sabio Señor #G Ahuramazda#! ha permitido que nuestro gran #E Shahenshah#! gobierne. Sin embargo, para poder conservarlo debe recordar y emular cada uno de los #T 101 epítetos#! del Señor. Son los siguientes:\n\nYazat, Yarvasp-Tavãn, Harvasp-Âgâh, Harvasp-H'udhâ, Abadah, Awî-Añjâm, Bûnastah, Frâxtañtah, Jamakh, Parjahtarah, Tum-Afayah, Abravañt, Parvañdah, An-Ayâfah, Ham-Ayâfah, Âdharô, Gîrâ, Acim, Cimnâ, Safinâ, Âwzâ, Nâshâ, Parvarâ, Âyânah, Âyaîn-Âyânah, An-Âyanah, Xraoshît-Tum, Mînôtum, Vâsnâ, Harvastum, Husipâs, Har-Hemît, Harnekfareh, Beshtarnâ, Tarônîs, Anaoshak, Farashak, Pazohadhad, Xavâpar, Awaxshâyâ, Awarzâ, Â-Sitôh, Raxôh, Varûn, A-Frîpah, Awe-Frîftah, Adhvaî, Kãme-Rat, Frãmãn-Kãm, Âyextan, Â-Framôsh, Hamârnâ, Snâyâ, A-Tars, A-Bîsh, A-Frâzdum, Hamcûn, Mînô-Stîgar, A-Mînôgar, Mînô-Nahab, Âdhar-Bâtgar, Âdhar-Namgar, Bât-Âdhargar, Bât-Namgar, Bât-Gelgar, Bât-Girdtum, Âdhar-Kîbarît-Tum, Bâtgarjâi, Âwtum, Gel-Âdhargar, Gel-Vâdhgar, Gel-Namgar, Gargar, Garôgar, Garâgar, Garâgargar, A-Garâgar, A-Garâgargar, A-Gûmãn, A-Jamãn, A-H'uãn, Âmushthushyâr, Frashûtanâ, Padhamãnî, Pîrôzgar, H'udhâvañd, Ahuramazda, Abarînkuhantavãn, Abarîn-Nô-Tavã, Vaspãn, Vaspâr, H'âwar, Ahû, Âwaxsîdâr, Dâdhâr, Rayomañd, H'arehmand, Dâwar, Kerfagar, Buxtâr y Frashôgar.\n\n\n\n\n\n\n\n\n\n@egypt_mil28!"
 parthia_missions_148:0 "Fuego del Rey de Reyes"
 parthia_missions_148_DESC:0 "Ubicado en el #E Arshak#! titular se encuentra el Gran Incendio de los Arsácidas."
 parthia_missions_149:0 "Imbuido de Kharenah"
 parthia_missions_149_DESC:0 "Estar imbuido de #T Kharenah#!, o #T Khvarenah#! es estar imbuido de gloria y esplendor divinos. El único ser en todo el Universo al que #G Ahuramazda#! le ha dado la responsabilidad de imbuir a #T Kharenah#! es el de Yazata #G Mithra#!. Y por su santa luz, nuestro líder, el gran #E Rey de Reyes [ROOT.GetCountry.GetRuler.GetName]#!, puede estar imbuido de esta potencia.\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 parthia_missions_150:0 "Arsaces, El Divino"
 parthia_missions_150_DESC:0 "El fundador de este gran imperio que hemos construido, señor #E Arsaces#!, imbuido de #E Kharenah#!, moldeado por el #E Fuego#!, y brilla como un reflejo de #E Mitra#! ha alcanzado la divinidad en su logros.\n\n\n\n\n\n\n\n\n\n@italic_mil5!"
# parthia_missions_151:0 "The Great Temple Of Mehri"
# parthia_missions_151_DESC:0 "During the times of #E Atropates#! rule, Phraata was home to a great fire temple. We should expand this to show that the light of Mithra shall never fade from where it touches."

# Treasures, Decisions Etc.
 parthia_defect_to:0 "Defecto a Partia"
 parthia_defect_to_desc:0 "Con nuestras tierras ocupadas y nuestro señor supremo casi derrotado, debemos considerar cambiar de lealtad."
 parthia_defect_to.tt:0 "Desertaremos hacia el señorío parto como una Marcha."
 parthia_request_march:0 "Solicitar convertirse en marzo"
 parthia_request_march_desc:0 "Tenemos la opción de someternos a un poder más fuerte; si nos negamos, nos enfrentamos a la perspectiva de una guerra."
 parthia_request_march.tt:0 "Nos convertiremos en #G Marcha#! de los #G Partos#!."
 pth_wooing_ARM_friendship:0 "#R Sophene y Corduene#! Amistad entre gobernantes"
 pth_wooing_ARM_friendship_desc:0 "Nuestro sabio gobernante ha utilizado su estrecha amistad con reyes extranjeros para impresionarlos y mostrarles los beneficios de establecer vínculos más estrechos con nosotros. Esto acercará a los súbditos armenios a nuestra esfera de influencia."
 pth_wooing_ARM_insult:0 "#R Sophene y Corduene#! Insulto diplomático"
 pth_wooing_ARM_insult_desc:0 "El cruel insulto diplomático que recientemente infligimos a [GetCountry('ARM').GetName|R] ha tenido el efecto deseado, y la incapacidad de [GetCountry('ARM').GetRuler.GetName|Y] para montar una respuesta decisiva lo ha hecho parecer débil ante los ojos de sus súbditos. Esto acercará a #E Sophene#! y #E Corduene#! a nuestra esfera de influencia."
 pth_wooing_ARM_insult.tt:0 "Hemos insultado a #G Armenia#!."
 pth_wooing_ARM_gifts:0 "#R Sophene y Corduene#! Sobornos"
 pth_wooing_ARM_gifts_desc:0 "La gente de #E Corduene#! y #E Sophene#! quedó profundamente impresionada por los obsequios que les enviamos recientemente. Este podría ser el momento adecuado para redoblar nuestra generosidad y hacer una donación aún mayor. Independientemente de lo que hagamos, esto ciertamente acercará a la periferia armenia a nuestra esfera de influencia."
 pth_wooing_ARM_posturing:0 "#R Sophene y Corduene#! mostrando fuerza"
 pth_wooing_ARM_posturing_desc:0 "El #E ejército parto#! es ahora una fuerza considerable a tener en cuenta, mucho más grande y más fuerte que las levas desarticuladas de [GetCountry('ARM').GetName|G]. Sin tanta fuerza poderosa, a [GetCountry('ARM').GetRuler.GetName|Y] le resultará muy difícil seguir ejerciendo influencia sobre su periferia. Esto acercará a sus súbditos a nuestra esfera de influencia."
 pth_wooing_ARM_posturing.tt1:0 "Hemos estacionado al menos 1 ejército de #T 20 unidades#! cerca de las [GetCountry('SPH').GetAdjective|G] fronteras."
 pth_wooing_ARM_posturing.tt2:0 "Hemos estacionado al menos 1 ejército de #T 20 unidades#! cerca de las [GetCountry('CRD').GetAdjective|G] fronteras."
 pth_wooing_ARM_games:0 "#R Sophene y Corduene#! Juegos"
 pth_wooing_ARM_games_desc:0 "Quizás el signo más visible de [GetCountry('ARM').GetAdjective|G] autoridad sobre sus súbditos asirios son los juegos anuales en honor de la [GetCountry('ARM').GetAdjective|G] familia gobernante. Si patrocináramos nuestros propios juegos para rivalizar con los [GetCountry('ARM').GetAdjective|G], sin duda socavaríamos su dominio."
 pth_wooing_demand_loyalty:0 "#R Sophene y Corduene#! Exigen lealtad"
 pth_wooing_demand_loyalty_desc:0 "Ha llegado el momento de exigir que los súbditos periféricos armenios nos acepten como su nuevo señor. Si aceptan nuestra oferta, [GetCountry('SPH').GetName|G] y [GetCountry('CRD').GetName|G] dejarán de ser sujetos de [GetCountry('ARM').GetName|G] y pasarán a formar parte de nuestra esfera de influencia."
 pth_wooing_demand_loyalty.tt:0 "Nuestra influencia sobre [GetCountry('SPH').GetName|G] y [GetCountry('CRD').GetName|G] es suficientemente alta (al menos #R 12#!; actualmente es: #Y [Player.MakeScope.Var('wooing_ARM_progress').GetValue|Y|0])."
 pth_jade_change:0 "Establecer el emporio de jade"
 pth_jade_change_desc:0 "Podemos elegir una ciudad que se convierta en un centro de comercio de jade."
 pth_jade_change.tt1:0 "Puede establecer comercio de Jade en una ciudad."
