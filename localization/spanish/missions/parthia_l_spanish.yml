 me_parthia.349.t:0 "$parthia_missions_146$"
 me_parthia.349.desc:0 "Entre los #E Yauna#!, la línea entre Zeus y el Señor Sabio se ha desdibujado, dando lugar a una fusión divina que resuena tanto con las tradiciones #E griega#! como con la #E iraní#!. Los templos pronuncian su nombre en ambas lenguas y nuestros súbditos encuentran unidad en la reverencia compartida. En verdad, los dioses son muchos en nombre pero uno en sabiduría."
 me_parthia.349.a:0 "Esto acerca a nuestros súbditos griegos."
 me_parthia.350.t:0 "$parthia_missions_147$"
 me_parthia.350.desc:0 "El #E Shahanshah#!, visto como el gobernante divinamente elegido, mantenía una conexión profunda con #E Ahura Mazda#!, invocando a menudo los numerosos epítetos del Señor Sabio indistintamente para subrayar su autoridad legítima. Se creía que su reinado era un regalo directo de #E Ahura Mazda#!, un encargo que le obligaba a emular los 101 atributos de la deidad (como la sabiduría, la justicia y la benevolencia) en su gobierno. Al encarnar estas cualidades divinas, Shahanshah pretendía mantener el orden cósmico y garantizar la prosperidad de su reino, reflejando la voluntad de #E Ahura Mazda#! en la Tierra."
 me_parthia.350.a:0 "Ahuramazda puede tener muchos nombres; pero Rey de Reyes tiene muchos títulos"
