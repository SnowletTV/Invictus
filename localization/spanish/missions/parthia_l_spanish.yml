 pth_crown:0 "Corona parta"
 pth_crown_desc:0 "Hecha de oro macizo y con incrustaciones de piedras preciosas, la corona parta es un símbolo visible del reinante Xsayathiya."
 pth_throne:0 "Trono parto"
 pth_throne_desc:0 "Un trono tallado en un bloque sólido de mármol con fantásticos diseños de caballería pesada tallados en él, el Trono Parto inspira asombro en todos los que lo presencian."
 tarim_relict:0 "Los años y los días"
 tarim_relict_desc:0 "Este tratado filosófico, escrito por Parado de Kuche, es un texto científico brillante pero confuso que analiza un teorema sobre la naturaleza del tiempo, así como una historia imaginada de la costa asiática."
 chang_relict:0 "Estatua del guerrero de terracota"
 chang_relict_desc:0 "Esta estatua de terracota pintada de un guerrero fue robada de Chang'an por una expedición comercial parta."
 AM_march:0 "Marcha de $LIST$."
 LEAD_march:0 "#T $LIST$#!\nMarzo"
 CANCEL_march_NEWDESC:0 "¿Desea liberar [COUNTRY.GetName]?"
 CANCEL_marchTITLE:0 "Cancelar estado de marzo"
 CANCEL_march_TOOLTIP_HEADER:0 "#T Cancelar estado de marzo#!"
 CANCEL_march_DESC:0 "Poner fin a su condición de sujeto nuestro de marzo."
 CANCEL_march_FLAVOR:0 "Tal vez tengamos planes para ellos, o tal vez ya no sean necesarios para proteger nuestra frontera; de cualquier manera, podemos permitirles elegir su propio destino liberándolos de nuestro servicio."
 switch_allowed_region:0 "Cambiar región retenida directamente"
 switch_allowed_region.tt:0 "Una vez cada #E 5 años#!, puedes #E cambiar de Dastgerd#!"
 switch_allowed_region_act:0 "Una vez cada #E 5 años#!, puedes #E cambiar de Dastgerd#!"
 put_dynasty_march:0 "Nombra gobernante de tu dinastía"
 put_dynasty_march.tt:0 "Si el sujeto tiene más de #E 80 de lealtad#!, designe a un miembro de [Player.MakeScope.GetCountry.GetRuler.GetFamily.GetName] como gobernante"
 put_dynasty_march_act:0 "Nombra a un miembro de tu dinastía gobernante en su lugar."
 pops_to_subject:0 "Poblar su ciudad"
 pops_to_subject_act:0 "Mueve 5 pops a una de sus ciudades."
 city_in_subject:0 "Ciudad encontrada en una marcha"
 city_in_subject_act:0 "Elige una de sus provincias para fundar allí una ciudad."
 gathas_codified:0 "Registro de Gathas"
 gathas_codified_desc:0 "Los Gathas son los himnos más antiguos del Yasna (la liturgia central del culto Mazdayan). Se dice que son del propio Zoroastro. Durante la era parta, es probable que los Gathas se escribieran para servir como ayudas para la memoria y ayudar a los sacerdotes a recitar los himnos en rituales importantes."
 visperad_codified:0 "Registro de la Visperad"
 visperad_codified_desc:0 "Las Visperad, o la 'Ley contra los Daevas', complementan la Yasna (la liturgia central del culto de Mazdayan). Incluyen invocaciones adicionales y se transmitieron oralmente hasta finales del período parto o principios del sasánida, donde se escribieron."
 gathas_translated:0 "Traducción de Gathas"
 gathas_translated_desc:0 "Los Gathas son los himnos más antiguos del Yasna (la liturgia central del culto Mazdayan). Se dice que son del propio Zoroastro. Durante la era parta, es probable que los Gathas se escribieran para servir como ayudas para la memoria y ayudar a los sacerdotes a recitar los himnos en rituales importantes."
 visperad_translated:0 "Traducción de la Visperad"
 visperad_translated_desc:0 "Las Visperad, o la 'Ley contra los Daevas', complementan la Yasna (la liturgia central del culto de Mazdayan). Incluyen invocaciones adicionales y se transmitieron oralmente hasta finales del período parto o principios del sasánida, donde se escribieron."
 spread_mithra_religion_in_province_tt:0 "Entre el 12% y el 25% de los pops en [province_name.GetName] se convertirán a #Y mitraico#!"
 spread_zoroaster_in_province_tt:0 "Entre el 12% y el 25% de los pops en [province_name.GetName] se convertirán a #Y zoroástrico#!"
 buddhism_spread_on_convert_tt:0 "Entre el 12% y el 25% de los habitantes de cada capital estatal de propiedad se convertirán al #Y budismo#!"
 vinaya_pitaka_par:0 "Vinayagan Kadag"
 vinaya_pitaka_par_desc:0 "Una traducción del Vinaya Pitaka, la 'Canasta de la Disciplina', que describe las reglas y regulaciones de la vida monástica, que abarcan el comportamiento, el entrenamiento, la meditación y la devoción."
 sutta_pitaka_par:0 "Sutragan Kadag"
 sutta_pitaka_par_desc:0 "Una traducción del Sutta Pitaka, la 'Canasta de Discursos', que describe numerosos sermones y discursos, atribuidos al Buda y sus discípulos, explorando diversos temas doctrinales y éticos."
 abhidhamma_pitaka_par:0 "Abidarmagan Kadag"
 abhidhamma_pitaka_par_desc:0 "Una traducción del Sutta Pitaka, la 'Canasta de Enseñanzas Superiores', que describe exploraciones más analíticas y filosóficas de las enseñanzas budistas, a menudo reexaminando y reorganizando conceptos presentados en el Sutta Pitaka."
 interpretatio_parthica_compendium:0 "Compendio de dioses heleno-iraníes"
 interpretatio_parthica_compendium_desc:0 "Una recopilación de estudios que comparan los dioses iraníes con los dioses helénicos, que fomenta una mejor comprensión de la religión parta única que deriva muchas influencias de ambos."
