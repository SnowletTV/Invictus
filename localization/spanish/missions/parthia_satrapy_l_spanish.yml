 he_somehow_buys_it_par_tt:0 "[ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen]... de alguna manera está convencido a pesar de tu idiotez."
 bactria_is_warned_tt:0 "Hemos #G implementado con éxito#! la decisión #Y Sabotaje Paurava#!.\n[GetCountry('BAC').GetName] se enterará de esto."
