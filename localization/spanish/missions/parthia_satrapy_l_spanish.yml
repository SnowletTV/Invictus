l_spanish:

# Events
 me_parthia_satrapy.1.t:0 "$parthia_satrapy_missions_1$"
 me_parthia_satrapy.1.desc:0 "Una mañana temprano, mientras se retiraban los platos del desayuno, un grupo de asesores religiosos entró en las cámaras de [ROOT.GetCountry.GetRuler.GetName] con miradas tímidas en sus rostros, lo que provocó que [ROOT.GetCountry.GetRulerTitle] se sentara erguido en el asiento de [ROOT.GetCountry.GetRuler.GetHerHis] de inmediato. Tales visitas fueron inesperadas, especialmente el día después de que se había realizado un sacrificio religioso público en [ROOT.GetCountry.GetCapital.GetName], y [ROOT.GetCountry.GetRuler.GetFirstName] estaba convencido de que esta violación del protocolo presagiaba noticias terribles.\n\nLevantando una mano impaciente, [ROOT.GetCountry.GetRuler.GetFirstName] prescindió de las formalidades e hizo una señal a los sacerdotes para que se acercaran. 'Habla de inmediato - dime qué pasa.'\n\n'Esa es la cuestión, mi [ROOT.GetCountry.GetRulerTitle] - las cosas no podrían estar mejor. Después del sacrificio de ayer, los sacerdotes regresaron a su templo e hicieron un descubrimiento sorprendente; en su ausencia se habían descubierto doscientos talentos de plata y oro.'\n\n'¡Doscientos talentos!' [ROOT.GetCountry.GetRuler.GetFirstName] dejó escapar un silbido bajo. '¿Cómo se puede perder y encontrar tanto dinero?'\n\nHaciendo una profunda reverencia, un asesor dio un paso adelante, sólo para encogerse de hombros.\n\n'Quizás fue un regalo de los dioses...'"
 me_parthia_satrapy.1.a:0 "Quizás lo fue... ¡el futuro espera!"

 me_parthia_satrapy.2.t:0 "$parthia_satrapy_missions_2$"
 me_parthia_satrapy.2.desc:0 "'Me alegro de que nos entendamos, [ROOT.GetCountry.GetRuler.GetName] - de verdad, eres el hombre indicado para gobernar [ROOT.GetCountry.GetName] en mi nombre. Pero hemos hablado de negocios durante demasiado tiempo; bebe, amigo mío.'\n\nChasqueando los dedos y haciendo un gesto a un sirviente para que volviera a llenar su ritón con vino, [GetCharacter('(int32)24').GetName], el poderoso #E Basileus#! del [GetCountry('SEL').GetName], se inclinó hacia adelante y extendió su bebida hacia [ROOT.GetCountry.GetRuler.GetFirstName] en un brindis. Los dos amigos se habían reunido en [GetProvince('(int32)911').GetName] a petición de [GetCharacter('(int32)24').GetFirstName], que quería garantías personales de que la frontera norte estaba siendo vigilada.\n\nEl [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] hizo juramentos sagrados ante su Señor de que siempre sería un fiel #E Sátrapa#!, afirmando que [ROOT.GetCountry.GetRuler.GetSheHe] creía firmemente que el destino de los dos reinos estaban unidos. A cambio de cumplir con las [ROOT.GetCountry.GetRuler.GetHerHis] obligaciones, [GetCharacter('(int32)24').GetFirstName] había prometido enviar más comerciantes a [ROOT.GetCountry.GetCapital.GetName] en un gesto de buena voluntad."
 me_parthia_satrapy.2.a:0 "La cooperación con [ROOT.GetCountry.GetOverlord.GetName] seguramente dará sus frutos"

 me_parthia_satrapy.3.t:0 "$parthia_satrapy_missions_3$"
 me_parthia_satrapy.3.desc:0 "Habiendo asegurado la amistad y las bendiciones de [GetCharacter('(int32)24').GetName], [ROOT.GetCountry.GetRuler.GetName] no perdió el tiempo en pedir favores, sino que envió una petición a [GetProvince('(int32)911').GetName] pidiendo permiso para cruzar la frontera norte y asaltar las tierras de las tribus [GetCountry('PRN').GetAdjective]. El [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] quedó inmensamente satisfecho con la respuesta de [GetCharacter('(int32)24').GetFirstName]; 'Celebraremos tu inevitable victoria con vino y canciones; No decepciones.'"
 me_parthia_satrapy.3.a:0 "¡A las armas!"
# me_parthia_satrapy.3.tt:0 ""

 me_parthia_satrapy.4.t:0 "$parthia_satrapy_missions_4$"
 me_parthia_satrapy.4.desc:0 "Alentados por nuestras recientes victorias contra las tribus esteparias, [ROOT.GetCountry.GetRuler.GetName] ha ordenado a [ROOT.GetCountry.GetRuler.GetHerHis] tropas endurecidas por la guerra que tomen las famosas #E Puertas de [GetProvince('(int32)5437').GetName]#! para [ROOT.GetCountry.GetName]. Nuestras levas están en la mejor forma de lucha que han tenido en una generación, y si queremos impedir que los señores de los caballos controlen el paso, entonces debemos tomarlo por nosotros mismos y el momento de atacar es ahora."
 me_parthia_satrapy.4.a:0 "Sólo otra tribu a la que pacificar..."

 me_parthia_satrapy.5.t:0 "$parthia_satrapy_missions_5$"
 me_parthia_satrapy.5.desc:0 "Las [ROOT.GetCountry.GetAdjective] guerras contra las tribus migratorias de las estepas continúan con furia incesante, y los ejércitos de [ROOT.GetCountry.GetRuler.GetName] continúan aplastando a todos los oponentes lo suficientemente tontos como para ofrecer una batalla campal. Las levas de [ROOT.GetCountry.GetName] continúan su inexorable marcha hacia el norte."
 me_parthia_satrapy.5.a:0 "Esta es realmente una operación de limpieza glorificada."

 me_parthia_satrapy.6.t:0 "$parthia_satrapy_missions_6$"
 me_parthia_satrapy.6.desc:0 "[ROOT.GetCountry.GetRuler.GetName] tiene toda la intención de buscar beneficios del [ROOT.GetCountry.GetRuler.GetHerHis] señor supremo [GetCharacter('(int32)24').GetName], y cuando hubo un raro momento de paz y tranquilidad alrededor de [ROOT.GetCountry.GetCapital.GetName], [ROOT.GetCountry.GetRulerTitle] decidió que era hora de hacer justicia a la amistad entre [ROOT.GetCountry.GetRuler.GetHerHim] y [GetCharacter('(int32)24').GetFirstName].\n\nEn última instancia, [ROOT.GetCountry.GetRuler.GetFirstName] esperaba que el Los seléucidas algún día le darían a [ROOT.GetCountry.GetName] control sobre [GetProvince('(int32)4997').GetArea.GetName], pero [ROOT.GetCountry.GetRuler.GetSheHe] sabía que pedir ese favor directamente sería considerado grosero y de mal gusto. Primero habría que ofrecer algún tipo de homenaje, pero ¿cuál sería el mejor regalo para alguien que lo tiene todo?"
 me_parthia_satrapy.6.a:0 "Envía regalos de oro y plata."
 me_parthia_satrapy.6.b:0 "Envía a nuestros buenos combatientes."

 me_parthia_satrapy.6001.t:0 "$parthia_satrapy_missions_6$ - Enviado parto"
 me_parthia_satrapy.6001.desc:0 "Mi [ROOT.GetCountry.GetRulerTitle], hemos recibido un mensaje de uno de tus sátrapas. [GetCountry('PAR').GetRuler.GetName], tu leal servidor que gobierna en tu nombre en la ciudad de [GetCountry('PAR').GetCapital.GetName], ha pedido un favor al [ROOT.GetCountry.GetName].\n\nComo puedes ver, recordaron su lugar y le enviaron un saludable regalo a [ROOT.GetCountry.GetCapital.GetName]: trescientos talentos de oro y plata es una suma bastante sustancial. ¿Cómo debemos recompensar su buen comportamiento?"
 me_parthia_satrapy.6001.a:0 "Están rezagados en términos de desarrollo."
 me_parthia_satrapy.6001.b:0 "Ayúdelos en lo que respecta a la gobernanza"
 me_parthia_satrapy.6002.t:0 "$parthia_satrapy_missions_6$ - Respuesta"
 me_parthia_satrapy.6002.desc:0 "¡Maravillosas noticias de [GetCountry('SEL').GetCapital.GetName]! Parece que el generoso [GetCharacter('(int32)24').GetName] ha escuchado nuestras peticiones y, en su eterna sabiduría, ha correspondido nuestro regalo con uno propio. También se entregó personalmente una nota manuscrita del #E Basileus#! a [ROOT.GetCountry.GetRuler.GetName], quien no perdió tiempo en abrirla.\n\n'Confío en que harás buen uso de lo que te he dado, mi querido [ROOT.GetCountry.GetRuler.GetFirstName], y que estarás satisfecho con lo que he considerado digno de recibir.'"
 me_parthia_satrapy.6002.a:0 "¡Qué amable y amable [GetCharacter('(int32)24').GetFirstName]!"

 me_parthia_satrapy.7.t:0 "$parthia_satrapy_missions_6$ - Preparar una oferta"
 me_parthia_satrapy.7.desc:0 "[ROOT.GetCountry.GetRuler.GetName] ha estado mirando con avidez algunas de las provincias de [GetProvince('(int32)4997').GetArea.GetName], deseando que nuestra gente pudiera tener acceso sin restricciones al #E Mare Euxinus#!, y ahora que [ROOT.GetCountry.GetRuler.GetSheHe] tiene la atención de [ROOT.GetCountry.GetRuler.GetHerHis] amigo [GetCharacter('(int32)24').GetName], el audaz [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] sintió que finalmente había llegado el momento de pide [ROOT.GetCountry.GetRuler.GetHerHis] el deseo del corazón."
 me_parthia_satrapy.7.a:0 "Envíe la oferta de inmediato: ¡debemos tener #E Hycarnia#! para nosotros!"
 me_parthia_satrapy.7.b:0 "No vale la pena..."

 me_parthia_satrapy.8.t:0 "$parthia_satrapy_missions_6$ - Oferta"
 me_parthia_satrapy.8.desc:0 "Para disgusto de [ROOT.GetCountry.GetRuler.GetName], esta mañana llegó otra embajada de [GetCountry('PAR').GetRuler.GetName]. Las noticias que trajeron fueron buenas, para alivio de [ROOT.GetCountry.GetRuler.GetFirstName]; las fronteras del norte permanecían seguras y los rumores sobre movimientos en gran escala en la estepa parecían exagerados. Bien, muy bien...\n\nPero ese no fue el motivo por el que los diplomáticos de [GetCountry('PAR').GetCapital.GetName] viajaron a donde estamos; el atrevido [GetCountry('PAR').GetRuler.GetFirstName], que ciertamente es un servidor leal y digno, estaba pidiendo permiso para administrar algunos asentamientos en [GetProvince('(int32)4997').GetArea.GetName] directamente."
 me_parthia_satrapy.8.a:0 "Delegar la administración de dichas áreas"
 me_parthia_satrapy.8.b:0 "¡No, absolutamente no!"

 me_parthia_satrapy.9.t:0 "$parthia_satrapy_missions_6$ - Respuesta"
 me_parthia_satrapy.9.desc_1:0 "Hay noticias tristes de [GetProvince('(int32)911').GetName]. Nuestro Overlord, [GetCharacter('(int32)24').GetName], ha negado la petición hecha por [ROOT.GetCountry.GetRuler.GetName] y nos ha prohibido ocupar los territorios que nos fueron solicitados.\n\nPero no todo son malas noticias; Se nos ha concedido permiso para formar una #E Legión#! con la esperanza de que podamos desempeñar mejor nuestras funciones."
 me_parthia_satrapy.9.desc_2:0 "La respuesta de [GetCharacter('(int32)24').GetName] fue difícil de leer en cuanto al tono; [ROOT.GetCountry.GetRuler.GetName] no pudo decir si el seléucida #E Basileus#! estaba irritado por la pregunta, ya que la carta no tenía la calidez habitual expresada por el Overlord a su sujeto y era inusualmente directa.\n\nLo que estaba muy claro, sin embargo, era que [GetCharacter('(int32)24').GetFirstName] había aprobado el trato propuesto por [ROOT.GetCountry.GetRuler.GetFirstName]. También se pidió que formáramos una #E Legión#! inmediatamente, ya que los seléucidas quieren un ejército profesional que proteja nuestras fronteras; desafortunadamente, hoy en día no podemos depender únicamente de los impuestos."
 me_parthia_satrapy.9.tt1:0 "#Y Recuperaremos nuestro dinero.#!"
 me_parthia_satrapy.9.tt2:0 "#Y Se ha transferido la propiedad de los territorios limítrofes.#!"
 me_parthia_satrapy.9.a:0 "¡Qué maravilloso!"
 me_parthia_satrapy.9.b:0 "No puedo creer que haya dicho que no..."

 me_parthia_satrapy.10.t:0 "$parthia_satrapy_missions_7$"
 me_parthia_satrapy.10.desc:0 "Mientras la noticia de las numerosas victorias obtenidas por los [ROOT.GetCountry.GetAdjective] llega a oídos de [GetCharacter('(int32)24').GetName] en el lejano [GetProvince('(int32)911').GetName], el agradecido #E Basileus#! ha decidido recompensar a [ROOT.GetCountry.GetRuler.GetName] con obsequios de valiosas tierras para administrar.\n\nLa nota personal adjunta a la correspondencia oficial provocó una pequeña sonrisa en el [ROOT.GetCountry.GetAdjective] Los labios de [ROOT.GetCountry.GetRulerTitle]. \"Sigue haciendo lo que estás haciendo, hijo mío, y es posible que recibas regalos aún mayores en los días venideros\"."
 me_parthia_satrapy.10.a:0 "Me has honrado más allá de lo que merezco - gracias, mi Señor"

 me_parthia_satrapy.11.t:0 "$parthia_satrapy_missions_8$"
 me_parthia_satrapy.11.desc:0 "En los últimos años, [ROOT.GetCountry.GetRuler.GetName] ha invertido en la construcción de #E Academias#! en toda nuestra ciudad de [ROOT.GetCountry.GetCapital.GetName] con la esperanza de aumentar el conocimiento de nuestros hombres más sabios; un esfuerzo que [ROOT.GetCountry.GetRuler.GetSheHe] ha tenido éxito.\n\nNuestra capital justa ha adquirido una reputación como un lugar de aprendizaje y refinamiento, y muchos se refieren a ella como la #E 'Perla de [ROOT.GetCountry.GetCapital.GetArea.GetName]'#!, y viajeros de lugares tan lejanos como [GetProvince('(int32)416').GetName] han hecho el peligroso viaje por tierra a nuestra ciudad con la esperanza de escuchar las conferencias de nuestros filósofos en persona."
 me_parthia_satrapy.11.a:0 "Finalmente, ya no somos un remanso..."

 me_parthia_satrapy.12.t:0 "$parthia_satrapy_missions_9$"
 me_parthia_satrapy.12.desc:0 "[ROOT.GetCountry.GetRuler.GetName] inicialmente se sorprendió al escuchar que un hombre famoso y talentoso, un filósofo viajero llamado [SCOPE.sCharacter('char_scope').GetName], había venido a [ROOT.GetCountry.GetCapital.GetName] con la esperanza de asegurar un puesto en la corte, pero después de escuchar las razones de [SCOPE.sCharacter('char_scope').GetFirstName] para venir a [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] no pudo evitar sentirse orgulloso.\n\n'Mi Señor, seguramente usted debes conocer la reputación de tu pueblo; de tus ricas ciudades y sus innumerables riquezas, de tus plazas llenas de academias de mármol y mercados de finos ladrillos, de los lugares sombreados donde los grandes foros se cruzan con amplios bulevares construidos para albergar las procesiones victoriosas de tus ejércitos... ¿por qué no vendría a esta gran tierra? Podrías servir a otro, o [ROOT.GetCountry.GetRuler.GetFirstName], pero tu gloria y honor superan a todos los demás.'"
 me_parthia_satrapy.12.a:0 "Nos hacemos más fuertes... al menos internamente."

 me_parthia_satrapy.1301.t:0 "$parthia_satrapy_missions_10$ - Conspirando contra nuestro señor supremo"
 me_parthia_satrapy.1301.desc:0 "Después de decidir que [ROOT.GetCountry.GetName] intentaría apoderarse del reino de nuestro Señor Supremo, algunos asesores visitaron a [ROOT.GetCountry.GetRuler.GetName] con una sugerencia. Estos concejales propusieron que deberíamos intentar sobornar a algunos gobernadores que viven cerca de nuestras fronteras, pidiéndoles que se unan a nosotros una vez que declaremos la independencia.\n\nAunque este plan tiene sus méritos, debemos tener cuidado de no alarmar a [ROOT.GetCountry.GetOverlord.GetRuler.GetName]: no podemos confiar en que uno de estos gobernadores pueda informar lo que estamos haciendo a [ROOT.GetCountry.GetOverlord.GetCapital.GetName]."
 me_parthia_satrapy.1301.a:0 "Deberíamos centrarnos en [SCOPE.sChar('cap_beguile_gov_char_1').GetGovernorship.GetName]"
 me_parthia_satrapy.1301.b:0 "[SCOPE.sChar('cap_beguile_gov_char_2').GetGovernorship.GetName] es la región más importante en la que centrarse"
 me_parthia_satrapy.1301.c:0 "No necesitamos su ayuda"

 me_parthia_satrapy.1302.t:0 "Asegurando [SCOPE.sChar('cap_beguile_gov_char_1').GetGovernorship.GetName]"
 me_parthia_satrapy.1302.desc:0 "Al comprar a alguien, siempre debes estar seguro de que no te delatarán; esta es una lección que [ROOT.GetCountry.GetRuler.GetName] aprendió temprano en la vida, y [ROOT.GetCountry.GetRulerTitle] la tuvo en cuenta cuando comenzaron las negociaciones clandestinas.\n\nAdemás de no insultar a tu objetivo con una oferta baja, [ROOT.GetCountry.GetRuler.GetFirstName] también sabía que uno debe tener algo que ofrecer que su objetivo quiera, algo valioso que le impida alejarse del mercado. Trato. Esto fue cierto para [SCOPE.sChar('cap_beguile_gov_char_1').GetName], quien seguramente aceptará bien nuestra oferta, pero nunca hay una certeza total cuando se trata de cuestiones de honor de los hombres..."
 me_parthia_satrapy.1302.a:0 "El dinero es la solución a todo...¿cuál es su precio?"
 me_parthia_satrapy.1302.b:0 "Te cuidaré políticamente y te daré un trabajo fácil en alguna parte."

 me_parthia_satrapy.1303.t:0 "Asegurando [SCOPE.sChar('cap_beguile_gov_char_2').GetGovernorship.GetName]"
 me_parthia_satrapy.1303.desc:0 "Al comprar a alguien, siempre debes estar seguro de que no te delatarán; esta es una lección que [ROOT.GetCountry.GetRuler.GetName] aprendió temprano en la vida, y [ROOT.GetCountry.GetRulerTitle] la tuvo en cuenta cuando comenzaron las negociaciones clandestinas.\n\nAdemás de no insultar a tu objetivo con una oferta baja, [ROOT.GetCountry.GetRuler.GetFirstName] también sabía que uno debe tener algo que ofrecer que su objetivo quiera, algo valioso que le impida alejarse del mercado. Trato. Esto fue cierto para [SCOPE.sChar('cap_beguile_gov_char_2').GetName], quien seguramente aceptará bien nuestra oferta, pero nunca hay una certeza total cuando se trata de cuestiones de honor de los hombres..."
 me_parthia_satrapy.1303.a:0 "El dinero es la solución a todo."
 me_parthia_satrapy.1303.b:0 "Seguramente se agradecerá una bonita oficina."

 me_parthia_satrapy.1304.t:0 "Asegurando [SCOPE.sChar('cap_beguile_gov_char_1').GetGovernorship.GetName]: Respuesta"
 me_parthia_satrapy.1304.desc:0 "[SCOPE.sChar('cap_beguile_gov_char_1').GetName] ha reaccionado positivamente a nuestra 'solicitud', pero no parece muy satisfecho con el trato... parece como si tuviera hambre de más. En cualquier caso, no tiene hambre del liderazgo del [ROOT.GetCountry.GetOverlord.GetName], que es música para los oídos de [ROOT.GetCountry.GetRuler.GetName]."
 me_parthia_satrapy.1304.a:0 "maravilloso"
 me_parthia_satrapy.1304.b:0 "Vale la pena cada moneda gastada."
 me_parthia_satrapy.1304.c:0 "¡Ese sinvergüenza no recibirá ni un dracma adicional!"

 me_parthia_satrapy.1305.t:0 "Asegurando [SCOPE.sChar('cap_beguile_gov_char_2').GetGovernorship.GetName]: Respuesta"
 me_parthia_satrapy.1305.desc:0 "[SCOPE.sChar('cap_beguile_gov_char_2').GetName] ha reaccionado positivamente a nuestra 'solicitud', pero no parece muy satisfecho con el trato... parece como si tuviera hambre de más. En cualquier caso, no tiene hambre del liderazgo del [ROOT.GetCountry.GetOverlord.GetName], que es música para los oídos de [ROOT.GetCountry.GetRuler.GetName]."
 me_parthia_satrapy.1305.a:0 "Maravilloso."
 me_parthia_satrapy.1305.b:0 "Paga el precio que [SCOPE.sChar('cap_beguile_gov_char_2').GetFirstName] te pida"
 me_parthia_satrapy.1305.c:0 "¡Ese sinvergüenza no recibirá ni un dracma adicional!"

 me_parthia_satrapy.1306.t:0 "Soporte seguro"
 me_parthia_satrapy.1306.desc:0 "Ahora que hemos llegado a un acuerdo con [SCOPE.sChar('cap_beguile_gov_char_1').GetName], finalmente podemos proceder a planificar la caída de nuestro enemigo común. Con la ayuda de nuestro nuevo amigo, seguramente triunfaremos sobre todo lo que nuestro enemigo tenga para ofrecer."
 me_parthia_satrapy.1306.a:0 "Ahora para ocuparnos de [ROOT.GetCountry.GetOverlord.GetRuler.GetName]..."

 me_parthia_satrapy.1307.t:0 "Soporte seguro"
 me_parthia_satrapy.1307.desc:0 "Ahora que hemos llegado a un acuerdo con [SCOPE.sChar('cap_beguile_gov_char_2').GetName], finalmente podemos proceder a planificar la caída de nuestro enemigo común. Con la ayuda de nuestro nuevo amigo, seguramente triunfaremos sobre todo lo que nuestro enemigo tenga para ofrecer."
 me_parthia_satrapy.1307.a:0 "Ahora para ocuparnos de [ROOT.GetCountry.GetOverlord.GetRuler.GetName]..."

 me_parthia_satrapy.13.t:0 "Rival destronado"
 me_parthia_satrapy.13.desc:0 "La hora de nuestro mayor triunfo está cerca: demos la vuelta a nuestro Maestro y asumamos el lugar que nos corresponde como verdaderos gobernantes de nuestra propia tierra. [ROOT.GetCountry.GetRuler.GetName] ha dado el paso sin precedentes de declarar la guerra a Overlord, y ahora todos nuestros vecinos regionales observan ansiosamente quién emergerá de este conflicto."
 me_parthia_satrapy.13.a:0 "¡Marchamos hacia la gloria eterna!"

 me_parthia_satrapy.14.t:0 "$parthia_satrapy_missions_11$"
 me_parthia_satrapy.14.desc:0 "Como herederos de [GetCharacter('(int32)51').GetName], tenemos el mismo derecho al Imperio de Alejandro que todos los demás #E Diadochi#!, un derecho que hemos consolidado liberándonos del yugo de los Antigónidas y evitando la amenaza seléucida de una vez por todas. Para colmo, controlamos la mayoría de las primeras conquistas de Alejandro; un motivo de orgullo para el poderoso [ROOT.GetCountry.GetRuler.GetName], que ha traído a nuestro pueblo a este momento. ¿Quién, si no nosotros, puede recrear sus campañas?"
 me_parthia_satrapy.14.a:0 "¡El legado de Alejandro será nuestro!"

 me_parthia_satrapy.15.t:0 "$parthia_satrapy_missions_12$ - Comienzan las negociaciones"
 me_parthia_satrapy.15.desc:0 "Esta mañana, un embajador de nuestro señor supremo llegó a [ROOT.GetCountry.GetCapital.GetName] y solicitó una reunión con [ROOT.GetCountry.GetRuler.GetName] de inmediato. Este hombre, un hábil diplomático llamado [SCOPE.sCharacter('ambassador_char_scope').GetName], ha sido enviado para ayudarnos a negociar los términos de lo que solicitamos. Una vez que hayamos resuelto los detalles, [SCOPE.sCharacter('ambassador_char_scope').GetFirstName] nos informará cómo va todo y si los términos se han considerado aceptables o no.\n\nSin embargo, queda una pregunta importante; ¿Qué es exactamente lo que estamos pidiendo? ¿Cómo se ve para [ROOT.GetCountry.GetRuler.GetFirstName] ser una #E 'Marcha'#! del [mission_overlord_scope.GetName]? Nuestro Señor Supremo parece dispuesto a concedernos privilegios, pero siente curiosidad por saber qué teníamos en mente."
 me_parthia_satrapy.15.a:0 "Nos gustaría recibir ayuda política."
 me_parthia_satrapy.15.b:0 "El apoyo militar siempre es algo beneficioso."
 me_parthia_satrapy.15.c:0 "Su tecnología supera la nuestra... ¿estarían dispuestos a compartirla?"
 me_parthia_satrapy.15.d:0 "Un mayor desarrollo económico es algo que deseamos."
 mighty_orator_joins_parthia_tt:0 "Un #Y orador #! experto se unirá a su corte."


 me_parthia_satrapy.1501.t:0 "Las negociaciones continúan"
 me_parthia_satrapy.1501.desc:0 "Hemos recibido noticias de que nuestra solicitud de asistencia política ha sido aceptada y hay expectativas de que enviemos nuestro agradecimiento y resolvamos el asunto."
 me_parthia_satrapy.1501.a:0 "¡Qué gloriosa noticia! Envía nuestro agradecimiento."
 me_parthia_satrapy.1501.b:0 "Aprovecha nuestra suerte y envía una contraoferta pidiendo más."
 me_parthia_satrapy.1501.c:0 "¿Es esto algún tipo de broma?"
 me_parthia_satrapy.1502.t:0 "Ayuda militar"
 me_parthia_satrapy.1502.desc:0 "Ahora que hemos decidido pedir apoyo militar, todo lo que queda por hacer es encargar a nuestros diplomáticos los detalles de su misión, una tarea reservada a [ROOT.GetCountry.GetRuler.GetName]."
 me_parthia_satrapy.1502.a:0 "Envía la solicitud."
 me_parthia_satrapy.1502.b:0 "Esto no es lo que queríamos..."
 me_parthia_satrapy.1503.t:0 "Ayuda Tecnológica"
 me_parthia_satrapy.1503.desc:0 "Ahora que hemos tomado una decisión, sólo tenemos que enviar un mensajero a nuestro señor supremo; realmente esperamos que se nos considere lo suficientemente dignos para recibir sus secretos tecnológicos."
 me_parthia_satrapy.1503.a:0 "Enviemos a nuestros negociadores y esperemos lo mejor."
 me_parthia_satrapy.1503.b:0 "No enviaremos a nadie en este momento."
 me_parthia_satrapy.1511.t:0 "Las negociaciones continúan"
 me_parthia_satrapy.1511.desc_1:0 "[SCOPE.sCharacter('ambassador_char_scope').GetName] nos informa que las negociaciones van muy bien y, salvo que ocurra algún imprevisto, parece que se nos dará todo lo que hemos pedido."
 me_parthia_satrapy.1511.desc_2:0 "En lugar de aceptar ciegamente lo que hemos pedido, [SCOPE.sCharacter('ambassador_char_scope').GetName] ha regresado con una contraoferta, una que parece un poco polémica: parece que tenemos más negociaciones por hacer."
 me_parthia_satrapy.1511.desc_3:0 "Aunque nos dimos cuenta de que a [SCOPE.sCharacter('ambassador_char_scope').GetName] le daba vergüenza darnos una respuesta negativa, el resultado final es el mismo, dejando todos los sentimientos a un lado: nuestro Overlord ha negado rotundamente nuestra petición y ha interrumpido las discusiones."
 me_parthia_satrapy.1511.a:0 "¡Estamos ansiosos por escuchar la palabra \"sí\"!"
 me_parthia_satrapy.1511.b:0 "Supongo que aceptaremos los términos que nos den."
 me_parthia_satrapy.1511.c:0 "¡No aceptes su contraoferta! ¡Redoblaremos nuestros esfuerzos!"
 me_parthia_satrapy.1511.d:0 "Que decepcionante..."
 me_parthia_satrapy.1504.t:0 "Asistencia Económica"
 me_parthia_satrapy.1504.desc:0 "[ROOT.GetCountry.GetRuler.GetName], debemos enviar a nuestros mejores diplomáticos a nuestro señor supremo y esperar que tengan éxito en sus súplicas; como sabemos, nada está garantizado en la vida. ¿Vale la pena dedicar nuestro tiempo a esto?"
 me_parthia_satrapy.1504.a:0 "Enviemos a nuestros negociadores y esperemos lo mejor."
 me_parthia_satrapy.1504.b:0 "No enviaremos a nadie en este momento."
 me_parthia_satrapy.1512.t:0 "Una respuesta"
 me_parthia_satrapy.1512.desc_1:0 "Nuestro señor supremo ha respondido afirmativamente, aunque se ha señalado que ésta será la magnitud de la ayuda brindada."
 me_parthia_satrapy.1512.desc_2:0 "Nuestro señor supremo ha negado rotundamente nuestra petición y nos ha pedido que no les hagamos perder el tiempo con preguntas tontas."
 me_parthia_satrapy.1512.a:0 "Estamos agradecidos por cualquier cosa."
 me_parthia_satrapy.1512.b:0 "Qué desgracia para nosotros..."
 me_parthia_satrapy.1513.t:0 "Una mano amiga"
 me_parthia_satrapy.1513.desc_1:0 "¡Fantásticas noticias! Hemos recibido noticias de nuestro Señor Supremo de que van a enviar algunos investigadores e ingenieros a trabajar en [ROOT.GetCountry.GetCapital.GetName]. ¡Parece que están dispuestos a patrocinar nuestras iniciativas de investigación!"
 me_parthia_satrapy.1513.desc_2:0 "Nuestro Overlord ha respondido a nuestra solicitud de asistencia tecnológica con una simple palabra: no."
 me_parthia_satrapy.1513.a:0 "Estamos muy agradecidos por esto: qué bendición para [ROOT.GetCountry.GetName]."
 me_parthia_satrapy.1513.b:0 "Bueno, no tenían por qué ser groseros al respecto... hmmph."
 me_parthia_satrapy.1521.t:0 "Una respuesta recibida"
 me_parthia_satrapy.1521.desc:0 "Ha llegado la noticia a [ROOT.GetCountry.GetCapital.GetName] de que nuestras preguntas han sido respondidas por nuestro amable señor supremo, quien sostiene que deberíamos contentarnos con todo tal como está actualmente."
 me_parthia_satrapy.1521.a:0 "Deberíamos estar contentos con lo que tenemos."
 me_parthia_satrapy.1521.b:0 "Esto es inaceptable para nosotros."
 me_parthia_satrapy.1514.t:0 "Expertos económicos"
 me_parthia_satrapy.1514.desc_1:0 "¡Qué suerte para nosotros! Nuestro Señor Supremo ha enviado gentilmente a uno de sus mejores asesores económicos a nuestra Corte; supongo que esto significa que nuestra solicitud de ayuda fue bien recibida."
 me_parthia_satrapy.1514.desc_2:0 "Nuestro Señor Supremo ha negado nuestra petición, alegando que no somos dignos de tales honores."
 me_parthia_satrapy.1514.a:0 "Somos muy afortunados de recibir esto."
 me_parthia_satrapy.1514.b:0 "Qué desafortunado para nosotros... ay."
 me_parthia_satrapy.1531.t:0 "La respuesta tan esperada"
 me_parthia_satrapy.1531.desc_1:0 "Hay que decir que a veces es prudente presionar la suerte, pidiendo un favor cuando ya nos lo han negado.\n\nEn nuestro caso, hemos logrado asegurarnos un favor de nuestro #E Señor Supremo#! cuando ya nos lo habían negado: qué estadista [ROOT.GetCountry.GetRuler.GetName]."
 me_parthia_satrapy.1531.desc_2:0 "No deberíamos haber intentado pedir favores por segunda vez, porque no hemos recibido respuesta; parece que nuestro #E Overlord#! nos desprecia tanto."
 me_parthia_satrapy.1531.a:0 "Estamos agradecidos por cualquier cosa."
 me_parthia_satrapy.1531.b:0 "Que lamentable para nosotros... esto me pone triste."
 me_parthia_satrapy.16.t:0 "Contenido en la propia estación"
 me_parthia_satrapy.16.desc:0 "Gracias a nuestra fiel devoción a la causa de nuestro Maestro, [ROOT.GetCountry.GetRuler.GetName] ha sido recompensado por [ROOT.GetCountry.GetOverlord.GetRuler.GetName] con una fastuosa ceremonia que honra a la [ROOT.GetCountry.GetAdjective] nación y su gente.\n\n'Estás entre los servidores más fieles que tengo, [ROOT.GetCountry.GetRuler.GetFirstName], y por esto te alabo. Como un perro fiel, estás a mi lado y me deleito en tu obediencia: disfrutaremos juntos de muchos días soleados, amigo mío."
 me_parthia_satrapy.16.a:0 "¡Tiene razón, señor! gracias señor"
 me_parthia_satrapy.17.t:0 "$parthia_satrapy_missions_13$"
 me_parthia_satrapy.17.desc:0 "IZN - evento para Bactria que permite una lucha de poder similar a la de yauhahaha/Paurava"
 me_parthia_satrapy.17.a:0 "Necesitamos tener cuidado."
 me_parthia_satrapy.1701.t:0 "Guerreros de la política: calumnias"
 me_parthia_satrapy.1701.desc:0 "Se te concede un consejo con [ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen|E] él mismo. Esta es tu oportunidad de convencerlo de por qué deberíamos poder atacar la #E Bactria#! libremente.\n\n\"[ROOT.GetCountry.GetRuler.GetPraenomen|E], hablas mal de mis súbditos en #E Bactria#!. ¿Qué es lo que dicen?\" dice [ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen].\nUsted responde: \"Mi [ROOT.GetCountry.GetOverlord.GetRulerTitle], ellos...\""
 me_parthia_satrapy.1701.a:0 "\"¡Riqueza de la Horda que te pertenece!\""
 me_parthia_satrapy.1701.b:0 "\"¡Di que tu esposa te es infiel!\""
 me_parthia_satrapy.1701.c:0 "\"¡Di que tu cara es antiestética!\""
 me_parthia_satrapy.1701.d:0 "\"¿Dices que tú... um... eres... s-estúpido...?\""
 me_parthia_satrapy.1701.e:0 "\"¡En mis visiones, [GetCountry('BAC').GetRuler.GetPraenomen|E] te ha convertido en una rana que prefiere a los hombres!\""
 me_parthia_satrapy.1701.f:0 "\"Son malos.\""
 me_parthia_satrapy.1701.g:0 "\"They #E th#! lander you and #E th#! ay that you are '#E th#! upid' and a '#E th#! lob'.\""
 me_parthia_satrapy.1701.s:0 "\"Difundir rumores indescriptibles. Créeme, amigo mío\"."
 me_parthia_satrapy.1702.t:0 "\"Guerreros de la política: éxito"
 me_parthia_satrapy.1702.desc:0 "Hemos convencido con éxito a [ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen|E] de que [GetCountry('BAC').GetName|E] debe ser castigado. Y afortunadamente, podemos ser nosotros quienes apliquemos dicho castigo. Tenemos #E 5 años#! antes de que este incidente diplomático pase."
 me_parthia_satrapy.1702.a:0 "¡Genial! Ahora a hacer la guerra..."
 me_parthia_satrapy.1703.t:0 "Guerreros de la política: ¿éxito?"
 me_parthia_satrapy.1703.desc:0 "Hemos convencido con éxito a [ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen|E] de que [GetCountry('BAC').GetName|E] debe ser castigado... sin embargo, les dio una palmada en la muñeca en lugar de permitirnos darles una palmada con nuestras lanzas. Tendremos que ser aún más convincentes si queremos que se nos permita atacarlos."
 me_parthia_satrapy.1703.a:0 "Hmph, debemos vender mejor nuestra historia."
 me_parthia_satrapy.1704.t:0 "Guerreros de la política: castigados"
 me_parthia_satrapy.1704.desc:0 "[ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen] nos ha respondido con desdén. Estás mintiendo claramente, afirma, y exige que le envíes un tributo adicional inmediatamente para disculparte."
 me_parthia_satrapy.1704.a:0 "Bueno, eso no salió según lo planeado."
 me_parthia_satrapy.1705.t:0 "Guerreros de la política: castigados"
 me_parthia_satrapy.1705.desc:0 "[ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen] nos ha respondido con desdén. Estás mintiendo claramente, afirma, y exige que le envíes un tributo adicional inmediatamente para disculparte."
 me_parthia_satrapy.1705.a:0 "Bueno, eso no salió según lo planeado."
 me_parthia_satrapy.1720.t:0 "¡Traición! ¡Mentiras! ¡Engaño!"
 me_parthia_satrapy.1720.desc:0 "¡Hemos recibido noticias de que [ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen] cree que lo hemos insultado! Dijo que fue el maldito [GetCountry('par').GetRulerTitle] de [GetCountry('par').GetName|E] quien se lo dijo. De alguna manera, [ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen] les cree y les ha permitido atacarnos directamente si así lo desean. Debemos estar preparados."
 me_parthia_satrapy.1720.a:0 "¡Esos bárbaros mentirosos!"
 me_parthia_satrapy.1721.t:0 "¡Traición! ¡Mentiras! ¡Engaño!"
 me_parthia_satrapy.1721.desc:0 "¡Hemos recibido noticias de que [ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen] cree que lo hemos insultado! Dijo que fue el maldito [GetCountry('PAR').GetRulerTitle] de [GetCountry('PAR').GetName|E] quien se lo dijo. De alguna manera, [ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen] les cree... afortunadamente, solo nos han dado una palmada en la muñeca en lugar de permitir que los #E Yaudheyans#! ataquen."
 me_parthia_satrapy.1721.a:0 "¡Esto es insultante!"
 me_parthia_satrapy.1711.t:0 "¿Estás loco?"
 me_parthia_satrapy.1711.desc:0 "[ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen] respondió a nuestra solicitud con una respuesta confusa. Parece... em... cuestionar tu cordura con franqueza."
 me_parthia_satrapy.1711.a:0 "¡Él es el tonto, no yo!"
 me_parthia_satrapy.1710.t:0 "¿Está [ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen] loco?"
 me_parthia_satrapy.1710.desc:0 "[ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen] respondió a nuestra solicitud con una respuesta confusa. Parece... de alguna manera... ¡¿creer en la locura?! ¡Qué suerte!"
 me_parthia_satrapy.1710.a:0 "Mi lógica es absolutamente sólida."
 me_parthia_satrapy.18.t:0 "$parthia_satrapy_missions_14$"
 me_parthia_satrapy.18.desc:0 "[GetCountry('BAC').GetName|E] finalmente llegará a su fin. [ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen|E] nos ha permitido atacarlos gracias a nuestros esfuerzos diplomáticos, ¡y por eso declararemos la guerra para conquistar todo su estado! El cruel Basileus ha comparado a [ROOT.GetCountry.GetName] y [GetCountry('BAC').GetName] con sus dos perros más preciados y observa nuestra lucha entre nosotros con una curiosidad morbosa, sin estar seguro de quién saldrá victorioso al final, pero ansioso por ver sangre derramada."
 me_parthia_satrapy.18.a:0 "[GetDeityDefinition('omen_ares').GetName] ¡bendice nuestras espadas!"
# me_parthia_satrapy.18.tt:0 ""
 me_parthia_satrapy.19.t:0 "La Independencia de [ROOT.GetCountry.GetName]"
 me_parthia_satrapy.19.desc_1:0 "Con los [ROOT.GetCountry.GetOverlord.GetAdjective] exigiendo nuestra sumisión y nosotros exigiendo independencia, hemos llegado a la conclusión de que sólo hay una solución a nuestras diferencias; guerra. Nuestro destino se decidirá en las montañas y llanuras de #E Irán#!, que serán regadas con la sangre de hombres buenos."
 me_parthia_satrapy.19.desc_2:0 "Por suerte, los #E [ROOT.GetCountry.GetOverlord.GetAdjective]#! han llegado a estar de acuerdo con nuestras demandas de independencia e incluso nos ofrecieron amistad, diciendo que una alianza fortalecería a nuestras dos naciones, que de otro modo serían vulnerables a los buitres que son los otros #E Diadochi#!."
 me_parthia_satrapy.19.a:0 "Entonces la guerra es"
 me_parthia_satrapy.19.b:0 "Todo es mejor cuando lo hablas"

 me_parthia_satrapy.20.t:0 "Exigiendo Independencia"
 me_parthia_satrapy.20.desc:0 "En los últimos años, cada vez se han escuchado más voces disidentes en los mercados de nuestras ciudades, expresando su descontento al exigir la independencia de nuestra nación de los [ROOT.GetCountry.GetOverlord.GetAdjective].\n\nSin embargo, no todos desean lo mismo; algunos quieren ver [ROOT.GetCountry.GetRuler.GetName] pagar a nuestros señores por fechorías pasadas y lo ven como una forma de pago, mientras que otros se involucran en un intento por asegurar nuestra independencia pacíficamente, diciendo que ningún hombre necesita morir."
 me_parthia_satrapy.20.a:0 "La guerra es la única opción que tenemos."
 me_parthia_satrapy.20.b:0 "Primero intentaremos la diplomacia."

 me_parthia_satrapy.21.t:0 "Demanda de Independencia"
 me_parthia_satrapy.21.desc:0 "¡Día desastroso! ¡Nuestro sujeto [SCOPE.sCountry('cap_subject_country_scope').GetName] exige independencia y amenaza con la guerra si no los liberamos inmediatamente!"
 me_parthia_satrapy.21.a:0 "Entonces es la guerra."
 me_parthia_satrapy.21.b:0 "Déjalos en libertad."
 me_parthia_satrapy.2100.t:0 "Libertad concedida"
 me_parthia_satrapy.2100.desc:0 "Intimidados por nuestra fuerza militar y nuestras amenazas de guerra, nuestro señor supremo nos ha concedido nuestra libertad, temiendo la lucha en el campo de batalla."
 me_parthia_satrapy.2100.a:0 "Incluso sin derramamiento de sangre, ¡ahora somos libres! Es un día alegre."

 me_parthia_satrapy.22.t:0 "Demanda de Independencia"
 me_parthia_satrapy.22.desc:0 "Nuestro sujeto [SCOPE.sCountry('cap_subject_country_scope').GetName] anhela la independencia y nos pide que les concedamos total autonomía y que los aceptemos como aliados. Sus diplomáticos incluso tienen el descaro de discutir el llamado \"beneficio mutuo\" para ambas partes."
 me_parthia_satrapy.22.a:0 "Si quieres libertad, tendrás que luchar por ella."
 me_parthia_satrapy.22.b:0 "Un aliado es mejor que un enemigo."

 me_parthia_satrapy.23.t:0 "Hegemón de Irán"
 me_parthia_satrapy.23.desc:0 "[ROOT.GetCountry.GetRuler.GetName] tiene un ejército entrenado y bien equipado al que [ROOT.GetCountry.GetRuler.GetSheHe] puede recurrir en cualquier momento para defender las fronteras y los intereses de [ROOT.GetCountry.GetName], y nadie puede oponerse a su pueblo cuando se trata de disputar el control de #E Irán#!. No hace falta decir que el epíteto de \"Hegemón de Irán\" es merecido."
 me_parthia_satrapy.23.a:0 "Mi palabra es ley en este rincón del mundo."

 me_parthia_satrapy.25.t:0 "$parthia_satrapy_missions_16$"
 me_parthia_satrapy.25.desc:0 "En los #E Anales de los [ROOT.GetCountry.GetAdjective]#!, todo el discurso pronunciado por [ROOT.GetCountry.GetRuler.GetName] a las [ROOT.GetCountry.GetRuler.GetHerHis] tropas en el campo fue registrado palabra por palabra, ya que este momento resultaría crucial en la historia de [ROOT.GetCountry.GetName] y las generaciones futuras reflexionarían y estudiarían las palabras del líder.\n\nDespués de darse cuenta de que los crueles A [GetCountry('SEL').GetName] no le importaba si nuestros guerreros perecían o no defendiendo 'sus tierras del interior' de las tribus esteparias, el [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] dijo a [ROOT.GetCountry.GetRuler.GetHerHis] los reclutas reunidos que la elección de pagar tributo a un tirano o morir en servidumbre no era ninguna elección, y una que [ROOT.GetCountry.GetRuler.GetSheHe] no podía soportar más.\n\n'Quiero ¿Saben, entonces, oh hijos de [ROOT.GetCountry.GetName], si seguirán hablando de labios para afuera de un Basileus que no se preocupa por su bienestar, o si cabalgarán a mi lado mientras lucho por su honor? ¿No he sido como un padre para ti? Marcho junto a vosotros y duermo en las mismas tiendas que vosotros; He compartido vuestras alegrías y vuestras miserias, vuestros triunfos y derrotas. ¿Quién es entonces [GetCharacter('(int32)24').GetFirstName] para tratarnos como peones desechables? Juntos podemos cambiar el curso de la historia, pero necesito saberlo, ahora y siempre: ¿estás conmigo?'\n\nEl sonido de diez mil hombres gritando como uno solo era toda la respuesta que [ROOT.GetCountry.GetRuler.GetFirstName] necesitaba."
 me_parthia_satrapy.25.a:0 "¡Nuestro camino hacia la grandeza comienza aquí!"

 me_parthia_satrapy.26.t:0 "$parthia_satrapy_missions_17$"
 me_parthia_satrapy.26.desc:0 "Nuestra #E Legión#!, el orgullo de [ROOT.GetCountry.GetRuler.GetName], ha crecido rápidamente en tamaño, y los combatientes más experimentados que viven dentro de [ROOT.GetCountry.GetName] han encontrado su hogar en el ejército de los poderosos [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle].\n\nNuestra legión ha luchado admirablemente en el campo, adquiriendo una valiosa experiencia y perfeccionando el oficio que ha hecho su reputación. Temible. Gracias a este renovado espíritu marcial que se apoderó del corazón de nuestro pueblo, [ROOT.GetCountry.GetRuler.GetFirstName] está encantado de ver llegar cada vez más reclutas de las provincias con la esperanza de luchar en nuestra legión, y ha pronunciado muchos discursos en [ROOT.GetCountry.GetCapital.GetName] pidiendo a nuestros veteranos que entrenen a la próxima generación de luchadores."
 me_parthia_satrapy.26.a:0 "Poco a poco vamos avanzando"

 me_parthia_satrapy.27.t:0 "$parthia_satrapy_missions_18$"
 me_parthia_satrapy.27.desc:0 "Si bien [ROOT.GetCountry.GetRuler.GetName] estaba complacido por la perspectiva de ser recordado como un gran líder militar algún día, [ROOT.GetCountry.GetRuler.GetSheHe] sabía que la mayoría de los [ROOT.GetCountry.GetAdjective] se beneficiarían de la construcción de nuevas ciudades, y que esto era realmente un legado que sería recordado.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] por lo tanto, hizo todo lo necesario para adquirir nuevas ciudades para la gente de [ROOT.GetCountry.GetName], ya fuera financiando su construcción o conquistándolas. Directamente."
 me_parthia_satrapy.27.a:0 "Las ciudades son la clave para un reino fuerte"

 me_parthia_satrapy.28.t:0 "$parthia_satrapy_missions_19$"
 me_parthia_satrapy.28.desc:0 "Aunque el lenguaje intercambiado entre diplomáticos fue deliberadamente vago, [GetCountry('BAC').GetRuler.GetName] y [GetCountry('PRM').GetRuler.GetName] ambos expresaron que entendían exactamente de dónde venía [ROOT.GetCountry.GetRuler.GetName] y acordaron cumplir con las obligaciones de amistad en caso de que fueran llamados."
 me_parthia_satrapy.28.a:0 "Esta es una excelente noticia."

 me_parthia_satrapy.29.t:0 "$parthia_satrapy_missions_20$"
 me_parthia_satrapy.29.desc:0 "La noticia de la muerte de [GetCharacter('(int32)24').GetName] llegó a [ROOT.GetCountry.GetCapital.GetName] como un trueno lanzado por [GetDeityDefinition('omen_zeus').GetName], enviando a la capital [ROOT.GetCountry.GetAdjective] a un frenesí como nunca se había visto. [GetCountry('SEL').GetRuler.GetName], el nuevo [GetCountry('SEL').GetRulerTitle] del [GetCountry('SEL').GetName], estaba haciendo lo que [GetCountry('SEL').GetRuler.GetSheHe] podía para resolver el asunto de la sucesión de [GetCountry('SEL').GetRuler.GetHerHis] lo más rápido posible, pero había rumores de que no todos los que vivían en [GetCountry('SEL').GetCapital.GetName] estaban contentos con la nueva situación.\n\nFue en este momento que [ROOT.GetCountry.GetRuler.GetName] supo que la hora del destino era casi al alcance de la mano, y será mejor que [ROOT.GetCountry.GetRuler.GetSheHe] empiece a prepararse para lo que sucedería a continuación."
 me_parthia_satrapy.29.a:0 "Casi todas las piezas están colocadas en su lugar..."

 me_parthia_satrapy.30.t:0 "$parthia_satrapy_missions_21$"
 me_parthia_satrapy.30.desc:0 "Fue un alivio recibir noticias de tribus acercándose a nuestra frontera en [ROOT.GetCountry.GetCapital.GetName], porque la vista de nuestras fortificaciones recién construidas fue suficiente para alejar a los jinetes de la estepa de nuestras tierras. Al darse cuenta de que no podrían atacar nuestros territorios impunemente, se dice que las hordas fueron vistas por última vez cabalgando hacia el este en busca de presas más fáciles."
 me_parthia_satrapy.30.a:0 "Nuestro flanco norte está a salvo."

 me_parthia_satrapy.31.t:0 "$parthia_satrapy_missions_22$"
 me_parthia_satrapy.31.desc:0 "La noticia de la rebelión de [ROOT.GetCountry.GetRuler.GetName] fue recibida con frío desdén por parte de [GetCountry('SEL').GetRuler.GetName], quien prometió marchar personalmente hacia las puertas de [ROOT.GetCountry.GetCapital.GetName] y sitiar a los [ROOT.GetCountry.GetAdjective].\n\nLa carta enviada por [GetCountry('SEL').GetAdjective] [GetCountry('SEL').GetRulerTitle] fue breve y directa. 'Ya conoces la pena impuesta a los traidores, [ROOT.GetCountry.GetRuler.GetFirstName] - No te perdonaré ni a ti ni a nadie de tu familia.'"
 me_parthia_satrapy.31.a:0 "¡Vivirás para arrepentirte de esas palabras, [GetCountry('SEL').GetRuler.GetFirstName]!"

 me_parthia_satrapy.32.t:0 "$parthia_satrapy_missions_23$"
 me_parthia_satrapy.32.desc:0 "Después de una guerra brutal que dejó innumerables miles de muertos, el audaz [ROOT.GetCountry.GetRuler.GetName] finalmente ha guiado al pueblo de [ROOT.GetCountry.GetName] a través de lo peor de la crisis y de alguna manera ha logrado salir más fuerte del otro lado. Los ejércitos superiores del [ROOT.GetCountry.GetRulerTitle] ganaron la guerra de liberación contra el [GetCountry('SEL').GetName], asegurando nuestra libertad y estableciéndonos como una potencia poderosa que ha llamado la atención de nuestros vecinos. Todas las miradas en la región se han vuelto hacia [ROOT.GetCountry.GetRuler.GetFirstName], y muchos se preguntan abiertamente qué hará [ROOT.GetCountry.GetRuler.GetSheHe] a continuación."
 me_parthia_satrapy.32.a:0 "Ha llegado el momento de consolidar nuestros logros"

 me_parthia_satrapy.33.t:0 "$parthia_satrapy_missions_25$"
 me_parthia_satrapy.33.desc:0 "Si bien muchos de los peores críticos de [ROOT.GetCountry.GetRuler.GetName] acusaron a [ROOT.GetCountry.GetRulerTitle] de estar interesado solo en dos cosas: la guerra y los caballos, esto fue un insulto que tergiversó cómo era [ROOT.GetCountry.GetRuler.GetSheHe] en realidad.\n\nDe hecho, una de las principales razones por las que los ejércitos de los [ROOT.GetCountry.GetRuler.GetFamily.GetName] habían conquistado la tierra de los #E medos#! no era simplemente absorber sus fronteras, sino saquear sus conocimientos. Desde que tiene uso de razón [ROOT.GetCountry.GetRuler.GetSheHe], [ROOT.GetCountry.GetRuler.GetFirstName] había escuchado historias reverenciales sobre los sabios de #E Media#! y estaba absolutamente emocionado de haber agregado sus territorios al creciente poder de [ROOT.GetCountry.GetName]."
 me_parthia_satrapy.33.a:0 "Conquistar #E Medios#! era solo cuestión de tiempo."

 me_parthia_satrapy.34.t:0 "$parthia_satrapy_missions_26$"
 me_parthia_satrapy.34.desc:0 "Conquistar #E Persis#! ha demostrado ser beneficioso para [ROOT.GetCountry.GetName] en más de un sentido, pero el principal de ellos es la mano de obra y el prestigio. Nuestros ejércitos siempre necesitan nuevos reclutas, y las tierras históricas de este antiguo reino nos han proporcionado un gran cuerpo de soldados potenciales a los que podemos recurrir. Además de esto, está la influencia política que disfruta [ROOT.GetCountry.GetRuler.GetName], ya que la conquista de Persis le ha traído la fama a [ROOT.GetCountry.GetRulerTitle]."
 me_parthia_satrapy.34.a:0 "#E Persis#! necesita nuestra regla más que nosotros."

 me_parthia_satrapy.35.t:0 "$parthia_satrapy_missions_27$"
 me_parthia_satrapy.35.desc:0 "Al empujar a los [ROOT.GetCountry.GetRuler.GetHerHis] ejércitos hacia el este, [ROOT.GetCountry.GetRuler.GetName] ha logrado llevar las fronteras de [ROOT.GetCountry.GetName] al #E Mare Erythraeum#!, una hazaña que sólo unos pocos conquistadores en la historia pueden reclamar.\n\nNuestros soldados han atravesado interminables desiertos, sus pies cansados marchan constantemente a través de interminables dunas en busca de nuestros enemigos y los dioses de la guerra estaban a nuestro lado. Se libraron batallas campales por el futuro de esta tierra y nuestros hombres ganaron, arrasando con nuestros enemigos en las montañas y las estribaciones rocosas de [GetProvince('(int32)6524').GetArea.GetRegion.GetName]."
 me_parthia_satrapy.35.a:0 "Nuestros corazones están protegidos gracias a esta victoria."

 me_parthia_satrapy.36.t:0 "$parthia_satrapy_missions_28$"
 me_parthia_satrapy.36.desc:0 "Una y otra vez, cada vez que [ROOT.GetCountry.GetName] enfrentaba una crisis o un momento que requería gracia bajo presión, [ROOT.GetCountry.GetRuler.GetName] siempre estaba ahí para enfrentar el desafío, y es gracias a la familia [ROOT.GetCountry.GetRulerTitle] y [ROOT.GetCountry.GetRuler.GetHerHis], los #E [ROOT.GetCountry.GetRuler.GetFamily.GetName]#!, que los [ROOT.GetCountry.GetAdjective] son una opción libre. \n\nY así, sucedió que después de expandir las fronteras al máximo y construir una civilización que rivalizaba con las grandes potencias del #E Mediterráneo#!, [ROOT.GetCountry.GetRuler.GetFirstName] declaró que [ROOT.GetCountry.GetRuler.GetSheHe] era un verdadero #E sucesor de Alejandro#! en hechos y acciones, y el fundador de un nuevo imperio que soportaría [ROOT.GetCountry.GetRuler.GetHerHis] nombre: el #E [ROOT.GetCountry.GetRuler.GetFamily.GetName] Imperio#!."
 me_parthia_satrapy.36.a:0 "¡Ahora, adelante para recuperar el legado de Alejandro!"

 me_parthia_satrapy.37.t:0 "$parthia_satrapy_missions_24$"
 me_parthia_satrapy.37.desc:0 "En un esfuerzo por detener las incesantes incursiones y guerras intertribales que han plagado las estepas durante una generación, [ROOT.GetCountry.GetRuler.GetName] ha decidido volver a dibujar el mapa de nuestras regiones del norte. A la mayoría de los miembros de la tribu #E Dahae#! que vivían dentro de [ROOT.GetCountry.GetName] se les ordenó establecerse y dispersarse por nuestros territorios, y aquellos que querían permanecer en sus tribus fueron enviados a patrullar las tierras silvestres.\n\nLos [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] también tomaron la difícil decisión de abandonar algunos territorios después de visitar personalmente la región para evaluar su valor. Al final del día, [ROOT.GetCountry.GetRuler.GetFirstName] no pudo justificar los costos sustanciales asociados con conservar partes de la estepa y, después de discutir el asunto con [ROOT.GetCountry.GetRuler.GetHerHis] asesores militares más cercanos, ordenó a nuestras tropas que abandonaran sus campamentos y se dirigieran al sur. \"Dejemos que los señores de los caballos tengan su estepa para ellos solos; mientras permanezcan allí, las relaciones entre nuestro pueblo seguirán floreciendo\"."
 me_parthia_satrapy.37.a:0 "Ahora las estepas están un poco más organizadas."
 me_parthia_satrapy.37.a.tt:0 "La mayoría de los #Y Dahae#! pops se asentarán a lo largo de [ROOT.GetCountry.GetName|G].\nEl vasallo tribal de Dahae asegurará nuestro flanco norte.\nLas áreas más al norte se perderán."
 me_parthia_satrapy.999.t:0 "depurar"
 me_parthia_satrapy.999.desc:0 "depurar"
 me_parthia_satrapy.999.a:0 "depurar1"
 me_parthia_satrapy.999.b:0 "depurar2"
 
# Tasks

 parthia_satrapy_missions:0 "Satrapía de las estepas"
 parthia_satrapy_missions_DESCRIPTION:0 "Desde nuestro hogar en [ROOT.GetCountry.GetCapital.GetName], la ciudad costera enclavada a la sombra de las extensas #E Tierras Altas de Qumis#! que protegen nuestro flanco occidental como un muro inquebrantable, nuestro [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName], se encuentra [ROOT.GetCountry.GetRuler.GetHerHim] en una posición indeseable que nada tiene que ver con nuestra ubicación geográfica. Ubicación.\n\nAl sur se encuentra el reino expansivo del señor supremo de [ROOT.GetCountry.GetName], el indomable [GetCountry('SEL').GetName] gobernado por el conquistador #E Seleukos Nikator#!, y al norte se encuentran las interminables estepas habitadas por tribus nómadas. Naturalmente, los seléucidas esperan que mantengamos las carreteras libres de bandidos, que enviemos tributos hacia el sur a [GetProvince('(int32)911').GetName] a tiempo y que estemos preparados para defender las fronteras en cualquier momento; todo lo que [ROOT.GetCountry.GetRuler.GetFirstName] ha jurado defender y, sin embargo, hay muchos que susurran al oído [ROOT.GetCountry.GetRuler.GetHerHis] que este acuerdo no puede durar para siempre."
 parthia_satrapy_missions_CRITERIA_DESCRIPTION:0 "Esta misión se considerará completa cuando hayamos decidido el futuro de la satrapía parta."
 parthia_satrapy_missions_BUTTON_TOOLTIP:0 "El futuro es incierto y el final siempre está cerca..."
 parthia_satrapy_missions_BUTTON_DETAILS: ""

 parthia_satrapy_missions_1:0 "Regalo de los dioses"
 parthia_satrapy_missions_1_DESC:0 "Antes de que [ROOT.GetCountry.GetRuler.GetName|Y] se comprometa con cualquier curso de acción que involucre el futuro de [ROOT.GetCountry.GetName|G], el piadoso [ROOT.GetCountry.GetRulerTitle] desea que primero comuniquemos con los dioses para adivinar sus voluntad.\n\n\n\n\n\n\n\n\n\n@greek_mil3!"

 parthia_satrapy_missions_2:0 "Seguro como una satrapía seléucida"
 parthia_satrapy_missions_2_DESC:0 "¿Sería tan terrible permanecer leal a la #Y Casa de Seleukos#!, que prácticamente ha garantizado nuestra supervivencia en un mundo donde estamos rodeados de enemigos? Aunque hay algunos que viven dentro de [ROOT.GetCountry.GetCapital.GetName|T] que desean liberarse de los #G seléucidas#!, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido que los grilletes de la servidumbre son mejores que las cadenas de esclavitud.\n\n\n\n\n\n\n\n\n\n@persia_mil7!"

 parthia_satrapy_missions_3:0 "Permiso parniano"
 parthia_satrapy_missions_3_DESC:0 "Después de haber prometido permanecer siempre fiel a los #E #G Seléucidas#!#!, [ROOT.GetCountry.GetRuler.GetName|Y] ha recibido las bendiciones de nuestro señor supremo para llevar a cabo guerras de agresión contra los nómadas que viven a nuestro alrededor. El primer objetivo de nuestros ejércitos serán las tribus Sakan que viven en [GetCountry('PRN').GetName|G], que controlan territorios que están peligrosamente cerca de nuestra capital en [ROOT.GetCountry.GetCapital.GetName|Y].\n\n\n\n\n\n\n\n\n\n@persia_mil11!"
 parthia_satrapy_missions_3.tt:0 "Declararemos la guerra..."

 parthia_satrapy_missions_4:0 "Las puertas de Pylai Partias"
 parthia_satrapy_missions_4_DESC:0 "Los #G salvajes dahaeos#! que viven en las estribaciones rocosas de [GetCountry('PSS').GetName|G] controlan el paso a través de las montañas del norte que se conocen como las #T 'Puertas de Pylai Parthias'#!. [ROOT.GetCountry.GetRuler.GetName|Y] ha tolerado su presencia en nuestras fronteras durante demasiado tiempo, y con el poder de los #G parnianos#! destrozado por nuestros ejércitos, ha llegado el momento de avanzar hacia el montañas.\n\n\n\n\n\n\n\n\n\n@persia_mil15!"
 parthia_satrapy_missions_4.tt:0 "Declararemos la guerra..."

 parthia_satrapy_missions_5:0 "Zantía"
 parthia_satrapy_missions_5_DESC:0 "Ahora que las tribus de [GetCountry('PRN').GetName|G] y [GetCountry('PSS').GetName|G] han sido derrotadas y dispersas, ha llegado el momento de terminar el trabajo en el norte y atacar a #E #G [GetCountry('ZNT').GetName] ns#!#!.\n\n\n\n\n\n\n\n\n\n@persia_mil12!"
 parthia_satrapy_missions_5.tt:0 "Declararemos la guerra..."

 parthia_satrapy_missions_6:0 "El precio de la paz"
 parthia_satrapy_missions_6_DESC:0 "Si deseamos permanecer en el favor de [GetCountry('SEL').GetName|Y], entonces debemos pagar por el privilegio.\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 parthia_satrapy_missions_6.tt:0 "Nuestro #T Señor Supremo#! nos otorgará más territorios para gobernar."

 parthia_satrapy_missions_7:0 "Sea útil"
 parthia_satrapy_missions_7_DESC:0 "El [GetCountry('SEL').GetName|Y] ha hecho muchas exigencias a [ROOT.GetCountry.GetRuler.GetName|Y], y la principal de ellas es demostrar nuestra lealtad en el campo de batalla; nuestro #T Overlord#! desea que luchemos y obtengamos grandes victorias en su nombre.\n\n\n\n\n\n\n\n\n\n@persia_mil14!"
# parthia_satrapy_missions_7.tt1:0 "We won at least #R 5 Battles#! in our #T Overlord's#! wars. (Currently: #Y [Player.MakeScope.Var('legion_battle_counter').GetValue|0]#!)\n(Currently: #Y [SCOPE.ScriptValue('parthia_battles_won_svalue')|0]#!)."
 parthia_satrapy_missions_7.tt1:0 "Ganamos al menos #R 5 batallas#! en nuestras #T guerras de Overlord#!. (Actualmente: #Y [Player.MakeScope.Var('legion_battle_counter').GetValue|0]#!)."
 parthia_satrapy_missions_7.tt2:0 "Nuestro #T Señor Supremo#! podría transferirnos el resto de #G Hircania#!."

 parthia_satrapy_missions_8:0 "Actualizar la tecnología"
 parthia_satrapy_missions_8_DESC:0 "Aunque [ROOT.GetCountry.GetRuler.GetName|Y] se ha centrado sabiamente en derrotar a los enemigos militares de [ROOT.GetCountry.GetName|G], ha llegado el momento de librar la guerra en un frente diferente; el de la mente. Debemos volver nuestra atención hacia adentro y concentrarnos en mejorar nuestra tecnología si esperamos enfrentarnos a nuestros enemigos.\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 parthia_satrapy_missions_8.tt:0 "Obtendremos #G 1 Nivel de Tecnología#! en cada categoría."

 parthia_satrapy_missions_9:0 "Fortalecer el Estado"
 parthia_satrapy_missions_9_DESC:0 "Ha llegado el momento de invertir en nuestra infraestructura civil, y aumentar la cantidad de #T Edificios del Foro#! que tenemos dentro de [ROOT.GetCountry.GetName|G] será una buena forma de retribuir a la gente, además de demostrarle a nuestro #T Señor Supremo#! que tenemos la intención de mejorar la vida cultural de la reino.\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 parthia_satrapy_missions_9.tt:0 "Ganaremos un personaje con excelentes atributos."
 parthia_satrapy_missions_9_tt:0 "Necesitamos poseer tres territorios y cada uno tenga #T 3 edificios del Foro#!."

 parthia_satrapy_missions_10:0 "Puñalada por la espalda"
 parthia_satrapy_missions_10_DESC:0 "[ROOT.GetCountry.GetRuler.GetName|Y], uno de los gobernantes más famosos de todo el #G mundo helénico#!, ha decidido que el [GetCountry('SEL').GetName|G] ya no es digno de llamarse #T Señor supremo#! de los #G Partos#!, y ha desafiado abiertamente el gobierno de [GetCountry('SEL').GetRuler.GetName|Y].\n\n\n\n\n\n\n\n\n\n@persia_mil15!"
 parthia_satrapy_missions_10.tt1:0 "Intentaremos subvertir algunos #Y [THIS.GetCountry.GetOverlord.GetAdjective]#! sujetos y convertirlos en nuestra causa."
 parthia_satrapy_missions_10.tt2:0 "Declararemos la guerra a nuestro señor supremo #Y [THIS.GetCountry.GetOverlord.GetName]#! para intentar tomar su lugar. \n\nSi nuestro gobernante es amigo del gobernante bactriano y tiene más de 80 opiniones sobre nosotros, abandonarán la guerra.\n\nSi tenemos éxito, tendremos acceso al árbol de misiones del #Y Imperio helenístico#! para restaurar el #T Legado de Alejandro#!."
 
 parthia_satrapy_missions_11:0 "Un nuevo sucesor"
 parthia_satrapy_missions_11_DESC:0 "¡Los invencibles ejércitos de [ROOT.GetCountry.GetRuler.GetName|Y] han aplastado las fuerzas de [GetCountry('SEL').GetName|G], derrocando a su debilitado Basileus y usurpando su Imperio! Por derechos de conquista, el [ROOT.GetCountry.GetRuler.GetFirstName] victorioso puede declarar el comienzo de una nueva era: la #T Era de la [ROOT.GetCountry.GetRuler.GetFamily.GetName]!#!\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
# parthia_satrapy_missions_11.tt:0 ""

 parthia_satrapy_missions_12:0 "Estado de la marcha de la demanda"
 parthia_satrapy_missions_12_DESC:0 "La riqueza, el poder y el prestigio de [ROOT.GetCountry.GetName|G] nos sitúan por encima de otros #T sátrapas#!, y aunque ninguno de los bandos se sentiría cómodo admitiéndolo, los impuestos [ROOT.GetCountry.GetAdjective] podrían defenderse de los de su #T Señor Supremo#!.\n\nPorque somos fuertes, [ROOT.GetCountry.GetRuler.GetName|Y] considera que merecemos un estatuto especial y exigirá que se nos reconozca como tal; una provocación audaz.\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 parthia_satrapy_missions_12.tt:0 "Podremos negociar un trato con nuestro #T Overlord#! #Y [THIS.GetCountry.GetOverlord.GetName]#! para convertirnos en un tipo especial de vasallo. Nuestro Gobernante pedirá que se nos concedan privilegios especiales y recibiremos diferentes recompensas, dependiendo de cómo vayan las negociaciones."

 parthia_satrapy_missions_13:0 "Suplantar a las bacterias"
 parthia_satrapy_missions_13_DESC:0 "Hay muchos que tontamente creen que [GetCountry('BAC').GetName|G] es el sujeto más poderoso del [GetCountry('SEL').GetName|G], pero [ROOT.GetCountry.GetRuler.GetName|Y] demostrará de una vez por todas quién es el #E Basileus#! más poderoso. Es.\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 parthia_satrapy_missions_13.tt:0 "Declarar la guerra a #G Bactria#!.\nRecibiremos reclamaciones sobre todas sus tierras."
 sabotaged_bactria_tt:0 "Ha promulgado con éxito la decisión #Y Sabotaje Bactria#! en los últimos 5 años."

 parthia_satrapy_missions_14:0 "Exigir independencia"
 parthia_satrapy_missions_14_DESC:0 "El pueblo de [ROOT.GetCountry.GetName|G] ya no puede soportar los caprichos tiránicos del [GetCountry('SEL').GetName|G]: ha llegado el momento de deshacerse del yugo de nuestro #T Señor Supremo#! y declarar nuestra independencia de [GetCountry('SEL').GetCapital.GetName|T].\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 parthia_satrapy_missions_14.tt1:0 "Elegiremos la forma en la que queremos independizarnos."
 parthia_satrapy_missions_14.tt2:0 "Exigiremos #R Independencia#! a nuestros [THIS.GetCountry.GetOverlord.GetAdjective] señores supremos."

 parthia_satrapy_missions_15:0 "Gran Partia"
 parthia_satrapy_missions_15_DESC:0 "Sólo por pura fuerza de voluntad, el poderoso [ROOT.GetCountry.GetRuler.GetName|Y] ha logrado cosas en una vida que serán recordadas en el futuro; el establecimiento de un nuevo reino, uno que se liberó de un estado de servidumbre y se convirtió en el temido #G Hegemón de Irán#!."

 parthia_satrapy_missions_16:0 "Anhelo de grandeza"
 parthia_satrapy_missions_16_DESC:0 "Después de muchas noches de examen de conciencia, [ROOT.GetCountry.GetRuler.GetName|Y] ha decidido que el camino hacia la grandeza no implica ser el perro faldero de [GetCharacter('(int32)24').GetName|Y]; si el pueblo de [ROOT.GetCountry.GetName|G] está destinado a la gloria, entonces debe ser ganada por un pueblo libre.\n\n\n\n\n\n\n\n\n\n@persia_mil16!"
 parthia_satrapy_missions_16.tt1:0 "Hemos aumentado nuestro #Y Impuesto.#!"
 parthia_satrapy_missions_16.tt2:0 "Todas nuestras provincias tienen la #T Política del gobernador de zonas fronterizas#!."
 parthia_satrapy_missions_16.tt3:0 "¡Nuestra #Y Levy#! se convertirá en una #R Legión#!!\nUn personaje con @military_icon! habilidades marciales excepcionalmente altas es ascendido de rango."

 parthia_satrapy_missions_17:0 "preparar el ejército"
 parthia_satrapy_missions_17_DESC:0 "Si tenemos esperanzas de hacer retroceder a los enemigos que nos rodean por todos lados, entonces debemos tener un ejército adecuado, uno que sea capaz de defender nuestros intereses de nuestros enemigos, ya sean griegos o bárbaro.\n\n\n\n\n\n\n\n\n\n@persia_mil1!"

 parthia_satrapy_missions_18:0 "Encontré una nueva ciudad"
 parthia_satrapy_missions_18_DESC:0 "No podemos darnos el lujo de ignorar las cuestiones cívicas mientras nos centramos en la situación militar; [ROOT.GetCountry.GetRuler.GetName|Y] se niega a cometer el error que cometen tantos otros gobernantes. El sabio [ROOT.GetCountry.GetRulerTitle] ha reservado fondos para la construcción de una nueva polis con la esperanza de beneficiar la vida de la comunidad personas.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 parthia_satrapy_missions_18.tt1:0 "Debemos fundar una nueva ciudad en algún lugar dentro de nuestro reino."
 parthia_satrapy_missions_18.tt2:0 "Nuestra nueva ciudad obtendrá [GetModifier('par_city_pmod').GetName|Y] que otorgará [GetModifier('par_city_pmod').GetDesc]."

 parthia_satrapy_missions_19:0 "Esfuerzos diplomáticos"
 parthia_satrapy_missions_19_DESC:0 "La fuerza se puede encontrar en los números, y también hay muchos súbditos del [GetCountry('SEL').GetName|G] que actualmente se irritan bajo el gobierno del tirano que vive en [GetProvince('(int32)911').GetName|T]. [ROOT.GetCountry.GetRuler.GetName|Y] está considerando sabiamente preguntar a algunos de nuestros vecinos si estarían dispuestos a unir su suerte a la nuestra cuando llegue el momento de declarar nuestra libertad...\n\n\n\n\n\n\n\n\n\n@persia_mil21!"
 parthia_satrapy_missions_19.tt:0 "[GetCountry('BAC').GetName|G] y [GetCountry('PRM').GetName|G] declararán la independencia junto con nosotros, si el gobernante de cualquiera de los países es amigo de nuestro Basileus."

 parthia_satrapy_missions_20:0 "Manifestación por la libertad"
 parthia_satrapy_missions_20_DESC:0 "¡[GetCharacter('(int32)24').GetName|Y], el Basileus del [GetCountry('SEL').GetName|G], ha muerto! Mensajeros de [GetProvince('(int32)911').GetName|T] llegaron a [ROOT.GetCountry.GetCapital.GetName|T] anoche con esta triste noticia. Mientras los #G Seléucidas#! están muy ocupados con una crisis de sucesión, este sería el momento perfecto para atacar nuestra propio!\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
 parthia_satrapy_missions_20.tt:0 "[GetCharacter('(int32)24').GetName|Y] está muerto."

 parthia_satrapy_missions_21:0 "Fortificar el norte"
 parthia_satrapy_missions_21_DESC:0 "Nuestros exploradores envían constantemente informes a [ROOT.GetCountry.GetCapital.GetName|T] informándonos de los movimientos de las tribus esteparias, y sus mensajes suelen estar teñidos de miedo; Si no tomamos las medidas necesarias para proteger nuestras fronteras, es muy posible que seamos invadidos por una horda migratoria.\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 parthia_satrapy_missions_21.tt1:0 "Tenemos dos #T fuertes#! separados que limitan con [GetCulture('derbiccan').GetName|R] tribus."
 parthia_satrapy_missions_21.tt2:0 "Estaremos protegidos de la [GetCulture('derbiccan').GetName|R] adquisición de #E Partia#!."

 parthia_satrapy_missions_22:0 "Guerra de independencia"
 parthia_satrapy_missions_22_DESC:0 "Se acerca la hora del destino; Los augurios han sido tomados y hablan claramente. Ha llegado el momento de dejar nuestro destino al viento y seguir al ambicioso [ROOT.GetCountry.GetRuler.GetName|Y] en la batalla contra nuestro #T Señor supremo#!.\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 parthia_satrapy_missions_22.tt1:0 "Hemos estacionado un ejército singular de al menos #T 30 unidades#! cerca de la frontera con los #G seléucidas#! en [GetProvince('(int32)4997').GetArea.GetName|G] o [GetProvince('(int32)3439').GetArea.GetName|G]."
 parthia_satrapy_missions_22.tt2:0 "¡Declararemos una #R Guerra de Independencia#!!"

 parthia_satrapy_missions_23:0 "Libre por fin"
 parthia_satrapy_missions_23_DESC:0 "¡Los ejércitos triunfantes de [ROOT.GetCountry.GetRuler.GetName|Y] han logrado lo imposible y se han liberado de las garras del vasto [GetCountry('SEL').GetName|G]!\n\n\n\n\n\n\n\n\n\n@greek_mil14!"

 parthia_satrapy_missions_24:0 "Reordenar las estepas"
 parthia_satrapy_missions_24_DESC:0 "Ahora que [ROOT.GetCountry.GetRuler.GetName|Y] es el dueño indiscutible de nuestro reino, el [ROOT.GetCountry.GetRulerTitle] ha decidido que una reorganización de nuestras provincias del norte es una opción absoluta. Necesidad.\n\n\n\n\n\n\n\n\n\n@persia_mil15!"
 parthia_satrapy_missions_24.tt:0 "La mayoría de los [GetCulture('derbiccan').GetName|G] pops se trasladarán al sur.\nLa tierra alrededor del área [GetProvince('(int32)5456').GetArea.GetName|G] se entregará a un #G Dahae#! vasallo tribal.\nLa tierra más al norte se dividirá en estados basados en áreas."

 parthia_satrapy_missions_25:0 "Integrar medios"
 parthia_satrapy_missions_25_DESC:0 "La reputación de las #G Medianas#! ciertamente es conocida por [ROOT.GetCountry.GetRuler.GetName|Y]; son aclamados por su conocimiento de los movimientos de las estrellas y son maestros de cosas que han estado ocultas a los ojos del hombre. Para injertar su fuerza en la nuestra, el [ROOT.GetCountry.GetRulerTitle] ha decidido integrarlos en la sociedad [ROOT.GetCountry.GetAdjective].\n\n\n\n\n\n\n\n\n\n@persia_mil5!"

 parthia_satrapy_missions_26:0 "Dominio sobre Persis"
 parthia_satrapy_missions_26_DESC:0 "Nuestros ejércitos continúan destruyendo todo lo que se interpone en su camino, extendiendo nuestro dominio hacia el sur, incluso hasta las aguas del #Y Sinus. Persicus#!.\n\n\n\n\n\n\n\n\n\n@greek_mil4!"

 parthia_satrapy_missions_27:0 "Conquistar a Ariana"
 parthia_satrapy_missions_27_DESC:0 "Las provincias orientales que alguna vez fueron administradas por los [GetCountry('SEL').GetName|G] han sido tomadas por los #E #G [ROOT.GetCountry.GetName] ns#!#!, quienes han extendido sus fronteras mucho más allá de los sueños más locos de [ROOT.GetCountry.GetRuler.GetName|Y].\n\n\n\n\n\n\n\n\n\n@persia_mil17!"

 parthia_satrapy_missions_28:0 "Nuevo Imperio Diadochi"
 parthia_satrapy_missions_28_DESC:0 "Por fin, la gente de #E #G [ROOT.GetCountry.GetName]#!#! ha logrado todo lo que se propusieron; han conquistado a aquellos que se oponen a la voluntad de [ROOT.GetCountry.GetRuler.GetName|Y] y han creado un nuevo #T Imperio#!, uno que está destinado a gobernar durante más de mil años.\n\nGobernando con seguridad desde [ROOT.GetCountry.GetCapital.GetName|T], [ROOT.GetCountry.GetRuler.GetFirstName] ha decretado que hoy comienza una nueva era: la Era del #G [ROOT.GetCountry.GetRuler.GetFamily.GetName] Imperio#!.\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 parthia_satrapy_missions_28.tt:0 "El nombre de nuestro país cambiará a uno dinástico."


# Treasures, Decisions Etc.
 greater_parthia_name:0 "Gran Partia"
 sabotage_bactria:0 "Bactria de sabotaje"
 sabotage_bactria_desc:0 "Intento de sabotear la reputación del [GetCountry('BAC').GetName|E]. Puedes intentar esto #R una vez al año#!. La posibilidad de sabotearlos con éxito #G aumentará#! si eres amigo de [ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen|Y], tienes #E Lengua de Plata#! o tienes un #E carisma#! excepcionalmente alto... sin embargo, tener un #E carisma#! u otros rasgos indeseables #R disminuir#! tus posibilidades."

