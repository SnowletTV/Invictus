 #Decisions 
 expand_kition_kothon:0 "Expandir el Kothon de Kition"
 expand_kition_kothon_desc:0 "Kition fue la primera colonia fenicia más allá de las costas #E Levante#!. Se estableció en #E Alashiya#!, que los griegos llaman #E Kypros#!, en el #E siglo IX a.C.#!. Esta \"nueva ciudad\" (Qarthadast) sirvió durante mucho tiempo como un nodo comercial de enorme valor y permitió a Tiro ejercer su influencia económica mucho más allá del Levante, colocándola en condiciones de sembrar colonias en el Mediterráneo. Sin embargo, años de abandono han dejado el algodón lleno de sedimentos y dañado, un pálido eco de su antigua grandeza. Esto no puede mantenerse. Restauraremos y ampliaremos el Kothon de Kition para que rivalice incluso con el Cothon de Cartago en escala y sofisticación."
 expand_kition_kothon_deadline:0 "La renovación del #Y Kothon de Kition#! se completará en #G 5#! años."

 #Wonders
 wonder_kition_kothon:0 "Kothon de Kition"
 wonder_kition_kothon_DESC:0 "El gran Kothon de Kition se divide en un puerto comercial rectangular, seguido de un puerto interior protegido y un astillero reservado para la marina. Este puerto interior es circular y está rodeado por un anillo de diques secos con capacidad para doscientos veinte barcos. En el centro se encuentra la casa de mando, elevada para que el capitán del puerto pueda ver toda la bahía."
 gw_effect_kition_cothon_tier_1: "Kothon yo"
 gw_effect_kition_cothon_tier_2: "Kothon II"
 gw_effect_kition_cothon_tier_3: "Kothon III"
 gw_effect_kition_cothon_tier_4: "Kothon IV"
 gw_effect_kition_cothon: "Kothon de Kition"

