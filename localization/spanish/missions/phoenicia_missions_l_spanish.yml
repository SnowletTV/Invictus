 #Events
 me_phoenicia_1_title:0 "$phoenicia_missions_task_1$"
 me_phoenicia_1_desc:0 "Durante siglos, los carpinteros fenicios han construido las mayores flotas del mundo, pero nuestro duro trabajo ha estado al servicio de mayores potencias: Cambises encargó a nuestro pueblo la construcción de la primera armada imperial de la historia para conquistar Egipto, la flota real aqueménida fue la primera armada imperial de la historia. Aunque los carpinteros fenicios trabajaron arduamente; Alejandro navegó con nuestros barcos hasta los confines de la tierra; ahora parece que sus sucesores, estos diádocos, pretenden explotarnos como lo hicieron sus predecesores...\n\n#E ¡No más!#! Nuestra gran armada ha sido construida. Este será el comienzo de nuestra hegemonía marítima, un regreso a la forma y el comienzo de una nueva era para [ROOT.GetCountry.GetCapital.GetName]."
 me_phoenicia_1.a:0 "Nuestro orgullo y alegría."
 me_phoenicia_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_1$#!' $mission_completed_tooltip_2$"
 
 me_phoenicia_2_title:0 "$phoenicia_missions_task_2$"
 me_phoenicia_2_desc:0 "¡Realmente hemos establecido una de las mejores academias navales del mundo! Las costas de #E Canaan#! son honradas una vez más por los marineros de #E [ROOT.GetCountry.GetCapital.GetName]#!, los mejores marineros de todas las tierras."
 me_phoenicia_2.a:0 "Nosotros #E [ROOT.GetCountry.GetAdjective]#! somos geniales."
 me_phoenicia_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_2$#!' $mission_completed_tooltip_2$"
 
 me_phoenicia_3_title:0 "$phoenicia_missions_task_3$"
 me_phoenicia_3_desc:0 "¿Qué es más hermoso que un imponente barco atracando en nuestro puerto? Mientras las velas del #E Puño de Baal#!'s' se balancean pacíficamente con el viento, como si estuvieran dando una muestra de lo que pueden hacer cuando están a toda vela, capaces de soportar las tormentas más duras que el #E Baal Shamen#! espolea. Nuestro buque insignia y nuestra armada ahora son verdaderamente dignos de nuestro legado."
 me_phoenicia_3.a:0 "Melqart bendice nuestras naves."
 me_phoenicia_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_3$#!' $mission_completed_tooltip_2$"
 
 me_phoenicia_4_title:0 "$phoenicia_missions_task_4$"
 me_phoenicia_4_desc:0 "En el pasado, las islas del Egeo formaban parte integral de nuestra vasta red comercial, que se extendía desde el Levante #E#! hasta las Islas del Estaño #E#! en el extremo más alejado del mundo. Quizás pronto podamos devolverle a [ROOT.GetCountry.GetCapital.GetName] su antigua gloria. Nuestros comerciantes ya han comenzado a traer oro precioso de las minas de [GetProvince('(int32)356').GetName], y las aguas que rodean a [GetProvince('(int32)471').GetName] vuelven a producir caracoles de Murex para nuestro famoso tinte tirio. Desafortunadamente, como aún no somos dueños de estas islas, debemos entregar gran parte de las ganancias a los griegos."
 me_phoenicia_4.a:0 "Esto se puede remediar..."
 me_phoenicia_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_4$#!' $mission_completed_tooltip_2$"
 
 me_phoenicia_5_title:0 "$phoenicia_missions_task_5$"
 me_phoenicia_5_desc:0 "Nuestro antiguo legado nos precede y rápidamente hemos asegurado una base sólida sobre la que construir nuestra economía. Una vez más, en todas las ciudades del otro lado del mar se habla de nuestra marca distintiva de tintes #E Tyrian Purple#!. ¡Por supuesto, las ganancias en el extranjero también significan ganancias en casa!"
 me_phoenicia_5.a:0 "¡Los comerciantes de [ROOT.GetCountry.GetCapital.GetName] dan la bienvenida a todos!"
 me_phoenicia_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_5$#!' $mission_completed_tooltip_2$"
 
 me_phoenicia_6_title:0 "$phoenicia_missions_task_6$"
 me_phoenicia_6_desc:0 "Muchos dirían que hemos vuelto a la normalidad. Por fin hemos completado el poderoso Emporio Comercial de [ROOT.GetCountry.GetCapital.GetName]. ¡Seremos ricos más allá de nuestros sueños más locos! Nos ayudará a promover más comercio y emprendimientos más rentables, además de ayudarnos a alardear de nuestra grandeza ante los #E griegos#! y otros #E cananeos#!."
 me_phoenicia_6.a:0 "Es bueno estar de vuelta."
 me_phoenicia_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_6$#!' $mission_completed_tooltip_2$"
 
 me_phoenicia_7_title:0 "$phoenicia_missions_task_7$"
 me_phoenicia_7_desc:0 "Nuestros #E hermanos fenicios#! han respondido a nuestro llamado a las armas. Si bien es bastante fácil subyugar una ciudad solitaria, nuestra alianza tripartita será inquebrantable."
 me_phoenicia_7.a:0 "Fenicios juntos, fuertes."
 me_phoenicia_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_7$#!' $mission_completed_tooltip_2$"
 
 me_phoenicia_700_title:0 "$phoenicia_missions_task_7$"
 me_phoenicia_700_desc:0 "Mi [ROOT.GetCountry.GetRuler.GetTitle], ¡al parecer las #E ciudades fenicias#! han declarado unilateralmente su independencia y se han unido para formar una especie de liga!"
 me_phoenicia_700.a:0 "Los observaremos con gran interés."
 me_phoenicia_700_tooltip:0 "Las #Y ciudades fenicias#! han declarado su independencia"

 me_phoenicia_8_title:0 "El reino destrozado de Alejandro"
 me_phoenicia_8_desc:0 "Una vez más, los herederos de Alejandro Magno se hacen la guerra entre ellos por los restos de su otrora gran imperio. Esto sin duda provocará más derramamiento de sangre, lo que no es bueno para el comercio. Esta vez, tenemos la oportunidad de llegar a un acuerdo con los rivales de Antígono para pasar libremente por nuestras tierras. Después de todo, somos demasiado débiles para resistir los caprichos de los diádocos, especialmente si están dispuestos a llenar nuestro bolsillo..."
 me_phoenicia_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_phoenicia_8.a:0 "Ptolomeo es el heredero legítimo."
 me_phoenicia_8.a.tt:0 "Ofreceremos venderle a Ptolomeo el acceso a nuestras tierras."
 me_phoenicia_8.b:0 "La afirmación de Seleukos es la más fuerte."
 me_phoenicia_8.b.tt:0 "Ofreceremos vender a los seleucos el acceso a nuestras tierras."
 me_phoenicia_8.c:0 "¡No me importa quién gane, sólo necesito que Antígono pierda!"
 me_phoenicia_8.c.tt:0 "Ofreceremos vender tanto a Ptolemaio como a Seleukos el acceso a nuestras tierras."

#EGY
 me_phoenicia_801_title:0 "[phoenician_offer_country.GetAdjective] Oferta"
 me_phoenicia_801_desc:0 "Los [phoenician_offer_country.GetAdjective] se han abstenido de participar en esta ronda de guerras de los Diádocos; sin embargo, están dispuestos a permitir que nuestros ejércitos pasen libremente por sus tierras. Por una tarifa simbólica, por supuesto..."
 me_phoenicia_801.a:0 "Pagaremos cualquier precio."
 me_phoenicia_801.b:0 "Piden demasiado y ofrecen muy poco."
 me_phoenicia_801.c:0 "SOLO IA"

#SEL
 me_phoenicia_802_title:0 "[phoenician_offer_country.GetAdjective] Oferta"
 me_phoenicia_802_desc:0 "Los [phoenician_offer_country.GetAdjective] se han abstenido de participar en esta ronda de guerras de los Diádocos; sin embargo, están dispuestos a permitir que nuestros ejércitos pasen libremente por sus tierras. Por una tarifa simbólica, por supuesto..."
 me_phoenicia_802.a:0 "Pagaremos cualquier precio."
 me_phoenicia_802.a.tt:0 ""
 me_phoenicia_802.b:0 "Piden demasiado y ofrecen muy poco."
 me_phoenicia_802.c:0 "SOLO IA"
 me_phoenicia_802.d:0 "SOLO IA"

 me_phoenicia_803_title:0 "Respuesta de los Diádocos"
 me_phoenicia_803_desc_egy:0 "Los Ptolomeos aceptaron pagarnos por el derecho de acceder libremente a nuestro territorio durante su guerra contra los Antigónidas."
 me_phoenicia_803_desc_sel:0 "Los seléucidas aceptaron pagarnos por el derecho de acceder libremente a nuestro territorio durante su guerra contra los antigónidas."
 me_phoenicia_803_desc_both_buyer:0 "Tanto los Ptolomeos como los seléucidas acordaron pagarnos por el derecho de acceder libremente a nuestro territorio durante su guerra contra los antigónidas."
 me_phoenicia_803_desc_no_buyer:0 "Ni los Ptolomeos ni los seléucidas han decidido pagarnos por el derecho de acceder libremente a nuestro territorio durante su guerra contra los antigónidas."
 me_phoenicia_803.a:0 "Muy bien..."

#Scope not appearing
 me_phoenicia_9_title:0 "Oferta por [GetProvince('(int32)660').GetName]"
 me_phoenicia_9_desc:0 "[GetProvince('(int32)660').GetName] se encuentra en el punto más meridional de Fenicia. Justin relata que [GetProvince('(int32)660').GetName] una vez derrotó a Sidón, lo que llevó a la fundación de [GetProvince('(int32)743').GetName], un año antes de la caída de Troya en el segundo milenio a.C. Tras la llegada de los filisteos, Ascalón pasó a formar parte de la \"pentápolis\", una coalición de cinco ciudades importantes que dominaban la llanura filistea, junto con Asdod, Ecrón, Gat y Gaza. La ciudad quedaría bajo el dominio de los tirios en el siglo V a. C..\n\nAhora los [askelon_offer_country.GetAdjective] ofrecen pagarnos por la soberanía sobre el valioso puerto."
 me_phoenicia_9.a:0 "La oferta de [askelon_offer_country.GetAdjective] es más que justa."
 me_phoenicia_9.a.tt:0 "Cederemos [GetProvince('(int32)660').GetName] en 180 días."
 me_phoenicia_9.b:0 "[GetProvince('(int32)660').GetName] es demasiado valioso para dejarlo ir."
 me_phoenicia_9.b.tt:0 ""

 me_phoenicia_901_title:0 "Adquiriendo [GetProvince('(int32)660').GetName]"
 me_phoenicia_901_desc:0 "[GetProvince('(int32)660').GetName] se encuentra en el punto más meridional de Fenicia. Justin relata que [GetProvince('(int32)660').GetName] una vez derrotó a Sidón, lo que llevó a la fundación de [GetProvince('(int32)743').GetName], un año antes de la caída de Troya en el segundo milenio a.C. Tras la llegada de los filisteos, Ascalón pasó a formar parte de la \"pentápolis\", una coalición de cinco ciudades importantes que dominaban la llanura filistea, junto con Asdod, Ecrón, Gat y Gaza. La ciudad quedaría bajo el dominio de los tirios en el siglo V a. C. \n \n Los [GetProvince('(int32)660').GetOwner.GetAdjective] han #E acordado#! cedernos el valioso puerto."
 me_phoenicia_901_desc_no:0 "[GetProvince('(int32)660').GetName] se encuentra en el punto más meridional de Fenicia. Justin relata que [GetProvince('(int32)660').GetName] una vez derrotó a Sidón, lo que llevó a la fundación de [GetProvince('(int32)743').GetName], un año antes de la caída de Troya en el segundo milenio a.C. Tras la llegada de los filisteos, Ascalón pasó a formar parte de la \"pentápolis\", una coalición de cinco ciudades importantes que dominaban la llanura filistea, junto con Asdod, Ecrón, Gat y Gaza. La ciudad pasaría a estar bajo el dominio de los tirios en el siglo V a. C.\n\nLos [GetProvince('(int32)660').GetOwner.GetAdjective] han #E se han negado#! a cedernos el valioso puerto a pesar de nuestra generosa oferta."
 me_phoenicia_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_phoenicia_901.a:0 "Muy bien."

 me_phoenicia_10_title:0 "Bastión del conocimiento helénico"
 me_phoenicia_10_desc:0 "Con la construcción de bibliotecas públicas en todo el país, [ROOT.GetCountry.GetName] se ha convertido en un faro del helenismo en Occidente, y el sonido de los grandes debates resuena en las calles, lo que ha atraído a muchos académicos a viajar desde la Grecia continental. Un académico en particular, [hellenic_scholar.GetName], ha demostrado tener una mente excepcionalmente aguda y sería un investigador perfecto si le permitiéramos trabajar allí."
 me_phoenicia_10.a:0 "Excelente."

 me_phoenicia_11_title:0 "$phoenicia_missions_task_11$"
 me_phoenicia_11_desc:0 "Hoy se celebra una gran celebración en [GetProvince('(int32)743').GetName], ya que se colocan las últimas piedras de las nuevas murallas de la ciudad. Llevamos dos años trabajando para proteger nuestra ciudad de futuras invasiones y el duro trabajo ha dado sus frutos: una serie de tres murallas cada vez más impresionantes se extienden ahora por el istmo que conecta [GetProvince('(int32)743').GetName] con tierra firme. La primera muralla es poco más que un foso y una empalizada, pero la tercera se eleva 15 metros por encima de las llanuras que tiene delante, con torres incluso 9 metros más altas, lo que garantiza que la ciudad será una pesadilla para nuestros enemigos y que nuestras líneas de suministro serán las más resistentes de todo #E Fenicia#!."
 me_phoenicia_11.a:0 "¡El escudo de [GetProvince('(int32)743').GetName], inquebrantable y eterno, está completo!"
 me_phoenicia_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_11$#!' $mission_completed_tooltip_2$"

#12 should be purple

 me_phoenicia_12_title:0 "$phoenicia_missions_task_12$"
 me_phoenicia_12_desc:0 "El tinte producido en #E [ROOT.GetCountry.GetName]#! es ​​la envidia de todo el mundo. Este pigmento púrpura, derivado de los caracoles marinos Murex de nuestra costa, tiene un precio exorbitante, lo que lo convierte en un producto codiciado entre la élite del Mediterráneo."
 me_phoenicia_12.a:0 "Hay poder en el color morado."
 me_phoenicia_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_12$#!' $mission_completed_tooltip_2$"

 #Melqart Event
 me_phoenicia_1302_title:0 "Homenaje a Melqart"
 me_phoenicia_1302_desc:0 "Hace siglos, #E Melqart#! enseñó a nuestro pueblo el arte de la construcción naval y la navegación para que pudieran encontrar las míticas Rocas Ambrosiales errantes. En las rocas encontraron un olivo, una serpiente y un águila, todos envueltos en un fuego, pero -curiosamente- no consumidos por él. Honrando al dios que los trajo a ese maravilloso lugar, sacrificaron el águila llameante a Melqart. Este acto rompió el hechizo y las Rocas Ambrosiales detuvieron su vagabundeo y proporcionaron la base para [GetProvince('(int32)743').GetName|Y].\n\nDesde ese día, en el lugar de ese mismo sacrificio, se ha erigido el #E Templo de Melqart#!. Como súbditos leales al gran señor, el errante Melqart, se espera que paguemos tributo al #E Templo de Melqart#! cada 5 años.\n\nDar dinero al templo seguramente ganará el favor de Melqart; Sin embargo, los [melqart_temple_holder.GetAdjective] seguramente se quedarán con algunos de nuestros regalos. ¿Qué haremos?"
 me_phoenicia_1302.a:0 "No escatimes en gastos para Lord Melqart."
 me_phoenicia_1302.b:0 "Lord Melqart comprenderá que tenemos un presupuesto limitado."
 me_phoenicia_1302.c:0 "¡Nos negamos a pagar un centavo por este homenaje!"

 me_phoenicia_1303_title:0 "Tesoros para Melqart"
 me_phoenicia_1303_desc:0 "Hace siglos, #E Melqart#! enseñó a nuestro pueblo el arte de la construcción naval y la navegación para que pudieran encontrar las míticas Rocas Ambrosiales errantes. En las rocas encontraron un olivo, una serpiente y un águila, todos envueltos en fuego, pero -curiosamente- no consumidos por él. Honrando al dios que los trajo a ese maravilloso lugar, sacrificaron el águila llameante a Melqart. Este acto rompió el hechizo y las Rocas Ambrosiales detuvieron su vagabundeo y proporcionaron la base para [GetProvince('(int32)743').GetName|Y].\n\nDesde ese día, en el lugar de ese mismo sacrificio, se ha erigido el #E Templo de Melqart#!\n\nMuchas de nuestras antiguas colonias esparcidas por los mares han enviado regalos al Templo de Melqart. Por supuesto, como guardianes de este lugar sagrado para el Señor Melqart, tenemos derecho a confiscar una fracción nominal de los obsequios totales a Melqart si lo consideramos conveniente."
 me_phoenicia_1303.a:0 "Melqart recibirá todo el tributo de este año."
 me_phoenicia_1303.b:0 "Melqart merece 3/4 partes de lo que hemos recolectado."
 me_phoenicia_1303.c:0 "Melqart querría que su pueblo prosperara."

 me_phoenicia_14_title:0 "$phoenicia_missions_task_14$"
 me_phoenicia_14_desc:0 "Los #E filisteos#!,, un pueblo cananeo, fueron en su día formidables gobernantes de una liga de cinco ciudades poderosas: #E Asdod#!,, #E Ascalón#!,, #E Ecrón#!,, #E Gat#!, y #E Gaza#!,1, como la #E Pentápolis#!,3. Esta coalición ejerció su dominio sobre la costa sur del Levante. Sus ciudades, al igual que las de #E Fenicia#!,, se convirtieron en centros vitales de comercio y navegación en el Mediterráneo. A pesar de su origen cananeo compartido, los filisteos desarrollaron costumbres distintas a las de sus hermanos fenicios, pero compartieron las ricas tradiciones marítimas y mercantiles que hicieron próspera a esta región.\n\nLa Pentápolis prosperó durante siglos, pero su suerte cambió con las mareas de la conquista. #E El rey Nabucodonosor II#!,7 de #E Babilonia#!,7 acabaría por doblegar a la Pentápolis durante sus campañas en el ocaso del siglo VII a. C. Devastó las ciudades, dispersó a sus habitantes y rompió el poder de esta otrora gran liga."
 me_phoenicia_14.a:0 "Cannanitas juntos fuertes."
 me_phoenicia_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_14$#!' $mission_completed_tooltip_2$"

 me_phoenicia_15_title:0 "Arquitectura procesional"
 me_phoenicia_15_desc:0 "Cualquier arquitecto aspirante que desee que su nombre sea recordado a través de los siglos como Imhotep habrá estudiado las construcciones de los antiguos maestros que trabajaron en #E Egipto#! hace milenios. Si bien no estamos del todo preparados para construir nuestras propias pirámides, aunque el futuro es un desierto que exploraremos a su debido tiempo, nos inspiramos en las grandes obras maestras que nos rodean con la vista puesta en crear las nuestras."
 me_phoenicia_15.a:0 "Nuestras maravillas resonarán hasta la eternidad."
 me_phoenicia_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_15$#!' $mission_completed_tooltip_2$"

 me_phoenicia_16_title:0 "Redes comerciales de Gaza"
 me_phoenicia_16_desc:0 "Durante la #E Edad del Hierro#!, la ciudad de [GetProvince('(int32)659').GetName] estuvo frecuentemente en conflicto con los israelitas vecinos, como se describe en la Biblia hebrea. Fue capturada por el rey asirio #E Tiglat-Pileser III#! en el siglo VIII a.C., y más tarde, por el rey babilónico #E Nabucodonosor II#! durante sus campañas en el Levante en el siglo VI a.C. [GetProvince('(int32)659').GetName] floreció bajo el gobierno #E #!, disfrutando de un grado considerable de autonomía.\n\n[GetProvince('(int32)659').GetName] cayó en manos de las fuerzas macedonias después de un asedio de dos meses. El victorioso Alejandro arrasó Gaza y ejecutó a su gobernante eunuco, #E Batis#!.\n\nGracias a los esfuerzos de [ROOT.GetCountry.GetRuler.GetName] para erradicar las manchas dejadas por nuestro reciente conflicto con los antiguos amos de esta ciudad, ha llegado a ser conocida como #Y La joya de Filistea#!."
 me_phoenicia_16.a:0 "Los [ROOT.GetCountry.GetAdjective] traen paz y prosperidad a donde quiera que vayamos."
 me_phoenicia_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_16$#!' $mission_completed_tooltip_2$"

 me_phoenicia_1700_title:0 "[phoenician_offer_country.GetAdjective] Oferta"
 me_phoenicia_1700_desc:0 "Desde hace mucho tiempo las grandes ciudades-estado fenicias compiten por el control de las pequeñas. A veces Tiro sale vencedora, a veces Sidón. Parece que los [phoenician_offer_country.GetAdjective] planean romper este ciclo ya sea por medios diplomáticos o por métodos menos recomendables... Nos han enviado ofertas de alianza y protección permanentes, pero sus palabras melosas ocultan una amenaza implícita."
 me_phoenicia_1700.a:0 "La oferta de [phoenician_offer_country.GetAdjective] es sensata."
 me_phoenicia_1700.b:0 "Nos robarían nuestra libertad."
 me_phoenicia_1700.c:0 "SOLO IA"

 me_phoenicia_1701_title:0 "[phoenician_answer_country.GetAdjective] Respuesta"
 me_phoenicia_1701_desc:0 "Nos ha llegado la noticia de [phoenician_answer_country.GetCapital.GetName] de que los [phoenician_answer_country.GetAdjective] han aceptado sabiamente nuestra oferta de alianza y protección permanentes."
 me_phoenicia_1701.a:0 "¡Fenicios juntos y fuertes!"

 me_phoenicia_1702_title:0 "[phoenician_answer_country.GetAdjective] Respuesta"
 me_phoenicia_1702_desc:0 "Nos ha llegado la noticia de [phoenician_answer_country.GetCapital.GetName] de que los [phoenician_answer_country.GetAdjective] han rechazado tontamente nuestra oferta de alianza y protección permanentes."
 me_phoenicia_1702.a:0 "Decepcionante..."
 me_phoenicia_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_17$#!' $mission_completed_tooltip_2$"

 me_phoenicia_18_title:0 "Crisis en Chipre"
 me_phoenicia_18_desc:0 "Las ciudades-reino de #E Alashiya#! trajeron una gran riqueza a la patria de los #E fenicios#!. Sin embargo, después de siglos de dominio, el gobierno fenicio en #E Alashiya#! terminó cuando el odiado Ptolomeo sometió brutalmente a los reyes chipriotas locales que se habían aliado con Antígono, despojándolos de su independencia e instalando a su hermano Menelao como gobernante de facto de la isla. Este control de mano dura dejó profundas cicatrices en las ciudades chipriotas. Aunque ha pasado tiempo desde que Demetrios Poliorketes liberó momentáneamente la isla de Menelao, los chipriotas no han olvidado las libertades de las que disfrutaron una vez. A medida que nuestra influencia en el Mediterráneo oriental se fortalece, puede que valga la pena considerar la posibilidad de ayudar a estas ciudades chipriotas desilusionadas a recuperar su independencia. Al alentar sutilmente la rebelión y brindar apoyo clandestino, podríamos crear una crisis en Chipre..."
 me_phoenicia_18.a:0 "Envía a nuestros agentes."
 me_phoenicia_18.at:0 "Una crisis comenzará a gestarse en Chipre"
 
 me_phoenicia_1800_title:0 "Crisis en Chipre"
 me_phoenicia_1800_desc:0 "Los enviados de Chipre han llegado a [ROOT.GetCountry.GetCapital.GetName], temblando mientras se preparan para entregar noticias sombrías a [ROOT.GetCountry.GetRuler.GetPraenomen]. Hablan en nombre de los príncipes chipriotas, que están cada vez más desilusionados con el gobierno [ROOT.GetCountry.GetAdjective]. A pesar de las audaces afirmaciones de [ROOT.GetCountry.GetRuler.GetPraenomen] de ser el campeón de la libertad griega, los gobernantes de Chipre sólo ven la sombra de la tiranía.\n\nTemerosos de la ira de [ROOT.GetCountry.GetRuler.GetPraenomen], los enviados explican vacilantes que los autoproclamados príncipes de Chipre: [salamis_guy.GetName] de [GetProvince('(int32)331').GetName], [paphos_guy.GetName] de [GetProvince('(int32)334').GetName], [kition_guy.GetName] de [GetProvince('(int32)332').GetName], [lapethos_guy.GetName] de [GetProvince('(int32)335').GetName] y [marion_guy.GetName] de [GetProvince('(int32)6431').GetName] han tomado medidas drásticas. Las [ROOT.GetCountry.GetAdjective] guarniciones estacionadas por toda la isla han sido expulsadas. Ya no dispuestos a tolerar la ocupación, los príncipes han reclamado sus ciudades y afirmado su independencia."
 me_phoenicia_1800.a:0 "Chipre volverá a ser libre."
 me_phoenicia_1800.b:0 "Estos pequeños príncipes no son rival para [ROOT.GetCountry.GetRuler.GetPraenomen]"
 me_phoenicia_1800.bt:0 "#R Las ciudades chipriotas iniciarán #E Guerras de Independencia#!#!"

 me_phoenicia_1801_title:0 "Crisis en Chipre: éxito"
 me_phoenicia_1801_desc:0 "Han llegado a Italia enviados de los autoproclamados príncipes de Chipre: [salamis_guy.GetName] de [GetProvince('(int32)331').GetName], [paphos_guy.GetName] de [GetProvince('(int32)334').GetName], [kition_guy.GetName] de [GetProvince('(int32)332').GetName], [lapethos_guy.GetName] de [GetProvince('(int32)335').GetName] y [marion_guy.GetName] de [GetProvince('(int32)6431').GetName], descendientes de monarcas depuestos y magnates influyentes. [ROOT.GetCountry.GetCapital.GetName], que trae noticias trascendentales.\n\nCon el coraje extraído de nuestras promesas de apoyo, se han levantado en armas contra la [cyprus_holder.GetAdjective] opresión, uniendo a su pueblo a la causa de la libertad. Después de años de vivir bajo dominio extranjero, las ciudades de Chipre están creciendo."
 me_phoenicia_1801.a:0 "¡Por fin se levantan los chipriotas!"
 me_phoenicia_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_18$#!' $mission_completed_tooltip_2$"

 me_phoenicia_1802_title:0 "Crisis en Chipre: se desenreda la trama"
 me_phoenicia_1802_desc:0 "Nuestros planes cuidadosamente elaborados para incitar una rebelión en Chipre han resultado en un desastre. [cyprus_holder.GetAdjective] agentes descubrieron nuestra participación antes de que el levantamiento pudiera ganar fuerza. Nuestros agentes, que habían estado suministrando armas y apoyo en secreto a los príncipes chipriotas disidentes, fueron capturados y rápidamente ejecutados.\n\nCon nuestros agentes expuestos, las fuerzas de [cyprus_holder.GetAdjective] han reforzado su control sobre la isla, aplastando cualquier atisbo de resistencia y asegurando su control sobre Chipre. El sueño de un Chipre liberado tendrá que esperar a otro momento..."
 me_phoenicia_1802.a:0 "Debemos actuar con más cuidado."

 me_phoenicia_19_title:0 "La nueva ciudad"
 me_phoenicia_19_desc:0 "La primera colonia fenicia más allá del #E Levante#! se estableció en #E Alashiya#!, que los griegos llaman #E Kypros#!, en el #E siglo IX a.C.#!. Esta \"nueva ciudad\" (Qarthadast) sirvió como un nodo comercial de enorme valor y permitió a Tiro ejercer su influencia económica mucho más allá del Levante, colocándola en posición de sembrar colonias en el Mediterráneo. Al enviar asesores confiables para ayudar a los gobernantes locales y alentar a nuestros comerciantes a establecer relaciones comerciales sólidas, hemos vuelto a tejer nuestra influencia en la estructura de estas ciudades."
 me_phoenicia_19.a:0 "¡Por fin se levantan los alashiyanos!"
 me_phoenicia_19.at:0 ""
 me_phoenicia_19.b:0 "Nuevos colonos se establecerán en Alashiya."
 me_phoenicia_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_19$#!' $mission_completed_tooltip_2$"

 me_phoenicia_20_title:0 "Minas de Alashiya"
 me_phoenicia_20_desc:0 "Desde tiempos inmemoriales, las minas de Alashiya han proporcionado al Mediterráneo cobre de alta calidad. Las ricas minas de cobre de esta isla proporcionaron la materia prima que alimentó no sólo las industrias locales, sino también las vastas redes comerciales en todo el Mediterráneo oriental. Sin embargo, en el pasado reciente, la población se ha ido y las minas funcionan con poca eficiencia. Un pequeño estímulo económico debería devolver a Alashiya al lugar que le corresponde."
 me_phoenicia_20.a:0 "¡Por fin se levantan los alashiyanos!"
 me_phoenicia_20.at:0 ""
 me_phoenicia_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_20$#!' $mission_completed_tooltip_2$"

 me_phoenicia_21_title:0 "Polis fenicias"
 me_phoenicia_21_desc:0 "Uno de los rasgos definitorios de la civilización griega es la polis o ciudad griega, que alberga muchos aspectos de la cultura helénica que deseamos emular para convertirnos en un reino verdaderamente helenístico. En los reinos helenísticos de los diádocos, a los súbditos se les ofrecían a veces privilegios y mayores oportunidades de movilidad social si construían polis de estilo griego y se integraban a la sociedad helenística. Mediante la construcción de polis de estilo griego en un estilo claramente sirofenicio, inspiramos a nuestros pueblos, tanto griegos como no griegos, a participar en la helenización para lograr una mayor movilidad social en nuestro reino."
 me_phoenicia_21.a:0 "Que nuestros leales súbditos sigan sirviéndonos bien."
 me_phoenicia_21.at:0 "Se han desbloqueado las tradiciones militares de las #Y Poleis griegas#!"
 me_phoenicia_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_21$#!' $mission_completed_tooltip_2$"

 me_phoenicia_22_title:0 "Dioses griegos"
 me_phoenicia_22_desc:0 "El señor Melqart y el héroe griego Heracles. Con la creciente influencia helénica en la región, en particular después de las conquistas de Alejandro, Fenicia se ha entrelazado cada vez más con la cultura y la religión helénicas. Nuestras ciudades albergan una población griega en constante expansión, y las costumbres, el idioma y las creencias griegas han permeado la vida diaria en [ROOT.GetCountry.GetCapital.GetName]. Muchos ya consideran que el culto a Melqart es similar al culto a Heracles, un vínculo simbólico entre nuestras dos grandes civilizaciones. A medida que Fenicia se heleniza rápidamente, puede ser prudente abrazar formalmente el panteón helénico para integrar aún más [ROOT.GetCountry.GetName] en el mundo griego más amplio."
 me_phoenicia_22.a:0 "Voz del Pueblo, Voz de Dios."
 me_phoenicia_22.at:0 ""
 me_phoenicia_22.b:0 "Tonterías, nunca abandonaremos nuestra herencia."
 me_phoenicia_22.bt:0 "#R #E [THIS.GetCountry.GetName]#! NO se convertirá a la fe #Y [GetReligion('roman_pantheon').GetName]#!#!"
 me_phoenicia_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_22$#!' $mission_completed_tooltip_2$"


 me_phoenicia_23_title:0 "Sirio-fenicio"
 me_phoenicia_23_desc:0 "Siglos de contacto con el mundo helénico han transformado lentamente la sociedad fenicia, catalizada por las políticas filohelénicas de los reyes #E Baalshillemi#! de Sidón. Estos reyes, buscando consolidar su poder y prestigio en la esfera helenística en rápida expansión, se convirtieron en mecenas de la cultura griega, encargando templos y estatuas de estilo griego e incluso adoptando nombres y títulos griegos. Con el tiempo, este proceso de helenización se extendió más allá de las cortes reales a la clase mercantil, los eruditos y la gente común. La mezcla de la cultura fenicia con la lengua, el arte y la religión griegos es más evidente en [ROOT.GetCountry.GetCapital.GetName], ha llevado a la creación de una cultura siriofenicia distinta, y los templos de Melqart y Heracles se encuentran uno al lado del otro. En verdad, ahora tenemos más en común con los helenos que con muchos pueblos a los que antes considerábamos nuestros primos."
 me_phoenicia_23.a:0 "Voz del Pueblo, Voz de Dios."
 me_phoenicia_23.at:0 "Éste es el amanecer de una nueva era."
 me_phoenicia_23.b:0 "Tonterías, nunca abandonaremos nuestra herencia."
 me_phoenicia_23.bt:0 "#R #E [THIS.GetCountry.GetName]#! NO se convertirá a la cultura #Y siriota#!#!"
 me_phoenicia_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_23$#!' $mission_completed_tooltip_2$"

 me_phoenicia_2400_title:0 "Kothon de Kition"
 me_phoenicia_2400_desc:0 "Kition fue la primera colonia fenicia más allá de las costas #E Levante#!. Se estableció en #E Alashiya#!, que los griegos llaman #E Kypros#!, en el #E siglo IX a.C.#!. Esta \"nueva ciudad\" (Qarthadast) sirvió durante mucho tiempo como un nodo comercial de enorme valor y permitió a Tiro ejercer su influencia económica mucho más allá del Levante, colocándola en condiciones de sembrar colonias en el Mediterráneo. Sin embargo, años de abandono dejaron el kothon lleno de sedimentos y dañado, un pálido eco de su antigua grandeza.\n\nAhora, el Gran Kothon de Kition ha sido restaurado a una gloria que rivaliza incluso con el renombrado puerto de Cartago. El kothon ampliado ahora consta de un extenso puerto comercial rectangular, seguido de un puerto interior circular reservado para los buques de guerra de la ciudad. Este puerto fortificado, rodeado de diques secos capaces de albergar cientos de barcos, alberga una estructura de mando en su centro, lo que brinda al capitán del puerto una vista ininterrumpida de las bulliciosas aguas."
 me_phoenicia_2400.a:0 "¡Es maravilloso!"
 me_phoenicia_2400.at:0 "El #E Kothon de Kition#! ha sido restaurado."
 me_phoenicia_2400_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_24$#!' $mission_can_be_completed_tooltip_2$"

 me_phoenicia_25_title:0 "Expedición a Cilicia"
 me_phoenicia_25_desc:0 "Se dice que las fértiles tierras de cultivo de Cilicia proporcionan riquezas incalculables para quienes pueden dominar la tierra y el mar. Sin embargo, los piratas de Cilicia se han convertido en el azote de cualquier potencia que navegue por el Mediterráneo oriental, incluidos nosotros. Se lanzará una expedición para recuperar lo perdido en la colonia fenicia de Tarso, asegurar la campiña circundante y abordar la amenaza de la piratería, utilizándola en nuestro beneficio si es necesario."
 me_phoenicia_25.a:0 "Cilicia será domada."
 me_phoenicia_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_25$#!' $mission_completed_tooltip_2$"

 me_phoenicia_26_title:0 "Recuperando Tarso"
 me_phoenicia_26_desc:0 "Habiendo sometido a la piratería que azota la costa de Cilicia, nuestras fuerzas se encuentran ahora a las puertas de Tarso, la joya de la llanura de Cilicia. Junto con sus hermanos, Soli, Celenderis y Nagidus, Tarso (o 'Tarsis' como se la conocía en el Libro del Génesis) fue una vez una orgullosa ciudad fenicia. Situada en la desembocadura de un cómodo puerto, la ciudad domina la fértil llanura de Cilicia, regada por el río Kydnus y que se extiende hasta las estribaciones de las montañas Tauro. En las laderas de las colinas que limitan la llanura crecía madera excelente para la construcción naval, y el Kydnus proporciona un medio fácil para hacer flotar dicha madera hasta el mar. \n\nSin embargo, queda una pregunta: ¿deberíamos restablecer Tarso como una colonia fenicia o deberíamos aliarnos con los piratas de Cilicia, cuya influencia aún perdura, y utilizar su astucia y habilidad marítima a nuestro favor?"
 me_phoenicia_26.a:0 "Tarso volverá a ser fenicia."
 me_phoenicia_26.at:0 "[GetProvince('(int32)1883').GetName] se convierte en una colonia [ROOT.GetAdjective] #Y #!"
 me_phoenicia_26.b:0 "Si no puedes vencerlos, únete a ellos."
 me_phoenicia_26.bt:0 "[GetProvince('(int32)1883').GetName] se convierte en [ROOT.GetAdjective] #Y Estado mercenario#!\nThe Se habilitará la siguiente habilidad naval: #Y Incursión de esclavos#!"
 me_phoenicia_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_26$#!' $mission_completed_tooltip_2$"

 me_phoenicia_27_title:0 "[kythera_buyer.GetAdjective] Oferta por [GetProvince('(int32)471').GetName]"
 me_phoenicia_27_desc:0 "Los [kythera_buyer.GetAdjective] han dado nueva vida a la industria púrpura de Tiro, largamente inactiva, de [GetProvince('(int32)471').GetName], reviviendo el potencial económico de la isla. Ya han prometido una parte de las ganancias a perpetuidad, pero ahora vienen con una propuesta audaz: comprar Kythera directamente. Su intención es clara: desean transformar la isla en un puesto de avanzada fenicio en el Egeo. Al mismo tiempo, [kytherodikes_guy.GetName], el actual #E kytherodikes#! de [GetProvince('(int32)471').GetName], ha expresado [kytherodikes_guy.GetHerHis] sus propias ambiciones. Como [GetProvince('(int32)471').GetName] ya opera como una dependencia [ROOT.GetCountry.GetAdjective] bajo la gobernanza [kytherodikes_guy.GetHerHis], [kytherodikes_guy.GetSheHe] sostiene que declararla formalmente autónoma tendría pocos inconvenientes notables; sin embargo, presenta numerosos puntos fuertes. Una mayor autonomía, afirma [kytherodikes_guy.GetSheHe], permitiría a [kytherodikes_guy.GetHerHim] supervisar el comercio y la producción de forma independiente, lo que traería mayor prosperidad tanto a la isla como a [ROOT.GetCountry.GetCapital.GetName]."
 me_phoenicia_27.a:0 "La oferta [kythera_buyer.GetAdjective] es de lo más generosa."
 me_phoenicia_27.at:0 "[GetProvince('(int32)471').GetName] se convierte en una colonia [kythera_buyer.GetAdjective] #Y #!"
 me_phoenicia_27.b:0 "Un [GetProvince('(int32)471').GetName] autónomo, ¿por qué no se me ocurrió?"
 me_phoenicia_27.bt:0 "[GetProvince('(int32)471').GetName] se convierte en [ROOT.GetCountry.GetAdjective] #Y Feudatorio#!"
 me_phoenicia_27.c:0 "Los [kythera_buyer.GetAdjective] tienen suerte de que les permitamos comerciar en la isla."
 me_phoenicia_27.ct:0 "#R No pasa nada#!"

 me_phoenicia_2700_title:0 "[GetProvince('(int32)471').GetName] Restos [kythera_old_owner.GetAdjective]"
 me_phoenicia_2700_desc:0 "[GetProvince('(int32)471').GetName] fue un importante puesto comercial de la red marítima de la civilización minoica que se extendió por el Egeo de la Edad del Bronce. Más tarde, bajo la influencia de la cultura micénica, la isla siguió siendo un vínculo clave en el comercio mediterráneo. En el período Arcaico, la ubicación estratégica y la riqueza de [GetProvince('(int32)471').GetName] atrajeron la atención de las grandes potencias. Arrebatada por Esparta a Argos a principios del siglo VI a. C., [GetProvince('(int32)471').GetName] fue gobernada por un kytherodikes (juez de [GetProvince('(int32)471').GetName]) y recibió un grado único de autonomía bajo el gobierno espartano. Con sus aguas costeras ricas en caracoles Murex, [GetProvince('(int32)471').GetName] fue una vez un sitio clave para la producción de tinte púrpura de Tiro. Atenas ocupó la isla en repetidas ocasiones, utilizando sus puertos para atacar la costa del Peloponeso y proteger las rutas marítimas.\n\nAunque nuestra oferta de compra de [GetProvince('(int32)471').GetName] ha sido rechazada, los [GetProvince('(int32)471').GetOwner.GetAdjective] reconocen el valor de nuestras contribuciones a la economía de la isla. Nos han concedido permiso para continuar con nuestras actividades de producción y comercialización de púrpura tirosa."
 me_phoenicia_2700.a:0 "Muy desafortunado"
 me_phoenicia_27_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_27$#!' $mission_completed_tooltip_2$"

 me_phoenicia_2701_title:0 "[GetProvince('(int32)471').GetName] se convierte en [ROOT.GetCountry.GetAdjective]"
 me_phoenicia_2701_desc:0 "[GetProvince('(int32)471').GetName] fue un importante puesto comercial de la red marítima de la civilización minoica que se extendió por el Egeo de la Edad del Bronce. Más tarde, bajo la influencia de la cultura micénica, la isla siguió siendo un vínculo clave en el comercio mediterráneo. En el período Arcaico, la ubicación estratégica y la riqueza de [GetProvince('(int32)471').GetName] atrajeron la atención de las grandes potencias. Arrebatada por Esparta a Argos a principios del siglo VI a. C., [GetProvince('(int32)471').GetName] fue gobernada por un kytherodikes (juez de [GetProvince('(int32)471').GetName]) y recibió un grado único de autonomía bajo el gobierno espartano. Con sus aguas costeras ricas en caracoles Murex, [GetProvince('(int32)471').GetName] fue una vez un sitio clave para la producción de tinte púrpura de Tiro. Atenas ocupó la isla en repetidas ocasiones, utilizando sus puertos para atacar la costa del Peloponeso y proteger las rutas marítimas.\n\nLos [kythera_old_owner.GetAdjective] han aceptado nuestra oferta de comprar la isla. Con el acuerdo finalizado, [GetProvince('(int32)471').GetName] ahora es oficialmente parte de [ROOT.GetCountry.GetAdjective]. El futuro de [GetProvince('(int32)471').GetName] como colonia [ROOT.GetCountry.GetAdjective] es brillante y ya han llegado más colonos a la isla."
 me_phoenicia_2701.a:0 "Un revés, pero surgirán oportunidades."
 me_phoenicia_2701.at:0 "[GetProvince('(int32)471').GetName] se convierte en una colonia [kythera_buyer.GetAdjective] #Y #!"

 me_phoenicia_28_title:0 "[thasos_buyer.GetAdjective] Oferta por [GetProvince('(int32)356').GetName]"
 me_phoenicia_28_desc:0 "Desde tiempos inmemoriales, las minas de Tasos han proporcionado al Mediterráneo oro de gran calidad. Según Heródoto, los fenicios fueron los primeros en colonizar Tasos. Establecieron un templo a Melqart, el Heracles de Tiro. Las minas de oro fenicias convirtieron esta isla remota en un lugar de importancia estratégica en todo el Egeo. Según la leyenda, la isla toma su nombre de Tasos, un hijo del Rey Fénix, que viajó a la isla en busca de Europa. En el siglo VII a. C. Llegaron colonos griegos de Paros. El vino de Thasian fue celebrado en todo el mundo antiguo por su calidad excepcional. Las vides y el dios del vino Dioniso ocuparon un lugar destacado en las monedas de Tasia. Además del vino, Tasos también ganó fama por sus nueces, su mármol y como centro de comercio marítimo. Las colonias de Tasia: Skapte Hyle, Neapolis, Galepsos, Oisyme, Apollonia, Antisara, Akontisma, Pistiros y Stryme extendieron su influencia al continente, incluido el control de minas de oro aún más ricas allí, con ingresos que alguna vez se estimaron entre 200 y 300 talentos al año. Estos recursos convirtieron a Tasos en un objetivo para potencias mayores como Persia, Atenas y Esparta, ya que la isla jugó un papel importante en la Revuelta Jónica, la Liga de Delos y las Guerras del Peloponeso. La dominación ateniense de la isla pasó a estar bajo un control macedonio después de la victoria de Filipo de Macedonia en Queronea en 338 a. C.\n\n Recientemente, [thasos_buyer.GetAdjective] han insuflado nueva vida a las minas de oro abandonadas de [GetProvince('(int32)356').GetName], reviviendo el potencial económico de la isla. Ahora, [thasos_buyer.GetName] proponen comprar Tasos directamente, con la intención de restaurarlo como un puesto avanzado fenicio en el Egeo. Al mismo tiempo, [kytherodikes_guy.GetName], el actual #E arconte#! de [GetProvince('(int32)356').GetName], ha expresado [kytherodikes_guy.GetHerHis] sus propias ambiciones. [kytherodikes_guy.GetSheHe] sostiene que reafirmar formalmente su condición de autónomo tendría pocos inconvenientes notables; sin embargo, presenta numerosos puntos fuertes. Una mayor autonomía, afirma [kytherodikes_guy.GetSheHe], permitiría a [kytherodikes_guy.GetHerHim] supervisar el comercio y la producción de forma independiente, lo que traería mayor prosperidad tanto a la isla como a [ROOT.GetCountry.GetCapital.GetName]."
 me_phoenicia_28.a:0 "La oferta [thasos_buyer.GetAdjective] es de lo más generosa."
 me_phoenicia_28.at:0 "[GetProvince('(int32)356').GetName] se convierte en una colonia [thasos_buyer.GetAdjective] #Y #!"
 me_phoenicia_28.b:0 "Un [GetProvince('(int32)471').GetName] autónomo, ¿por qué no se me ocurrió?"
 me_phoenicia_28.bt:0 "[GetProvince('(int32)356').GetName] se convierte en [ROOT.GetCountry.GetAdjective] #Y Feudatorio#!"
 me_phoenicia_28.c:0 "Los [thasos_buyer.GetAdjective] tienen suerte de que les permitamos comerciar en la isla."
 me_phoenicia_28.ct:0 "#R No pasa nada#!"
 me_phoenicia_28.thasos_tooltip_1:0 "[GetProvince('(int32)365').GetName] pasa a ser propiedad de #Y Thasos#!"
 me_phoenicia_28.thasos_tooltip_2:0 "[GetProvince('(int32)362').GetName] pasa a ser propiedad de #Y Thasos#!"

 me_phoenicia_2800_title:0 "[GetProvince('(int32)356').GetName] permanece [thasos_old_owner.GetAdjective]"
 me_phoenicia_2800_desc:0 "Desde tiempos inmemoriales, las minas de Tasos han proporcionado al Mediterráneo oro de gran calidad. Según Heródoto, los fenicios fueron los primeros en colonizar Tasos. Establecieron un templo a Melqart, el Heracles de Tiro. Las minas de oro fenicias convirtieron esta isla remota en un lugar de importancia estratégica en todo el Egeo. Según la leyenda, la isla toma su nombre de Tasos, un hijo del Rey Fénix, que viajó a la isla en busca de Europa. En el siglo VII a. C. Llegaron colonos griegos de Paros. El vino de Thasian fue celebrado en todo el mundo antiguo por su calidad excepcional. Las vides y el dios del vino Dioniso ocuparon un lugar destacado en las monedas de Tasia. Además del vino, Tasos también ganó fama por sus nueces, su mármol y como centro de comercio marítimo. Las colonias de Tasia: Skapte Hyle, Neapolis, Galepsos, Oisyme, Apollonia, Antisara, Akontisma, Pistiros y Stryme extendieron su influencia al continente, incluido el control de minas de oro aún más ricas allí, con ingresos que alguna vez se estimaron entre 200 y 300 talentos al año. Estos recursos convirtieron a Tasos en un objetivo para potencias mayores como Persia, Atenas y Esparta, ya que la isla jugó un papel importante en la Revuelta Jónica, la Liga de Delos y las Guerras del Peloponeso. La dominación ateniense de la isla pasó bajo un control macedonio flexible después de la victoria de Filipo de Macedonia en Queronea en 338 a. C. \n\nA pesar de nuestra oferta de comprar la isla, los [thasos_old_owner.GetAdjective] se han negado a ceder el control de Tasos. Afirman que los recursos de la isla son demasiado valiosos para desprenderse de ellos y ven nuestra oferta con sospecha. Si bien esto es un revés, los [thasos_buyer.GetAdjective] se han asegurado los derechos para continuar comerciando y explotando las vetas de oro de la isla. Por ahora, Thasos sigue bajo control de [thasos_old_owner.GetAdjective], pero su futuro está lejos de estar decidido."
 me_phoenicia_2800.a:0 "Esto es muy fortuito."
 me_phoenicia_2800.ct:0 "#R No pasa nada#!"
 me_phoenicia_28_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_28$#!' $mission_completed_tooltip_2$"

 me_phoenicia_2801_title:0 "[GetProvince('(int32)356').GetName] se convierte en [ROOT.GetCountry.GetAdjective]"
 me_phoenicia_2801_desc:0 "Desde tiempos inmemoriales, las minas de Tasos han proporcionado al Mediterráneo oro de gran calidad. Según Heródoto, los fenicios fueron los primeros en colonizar Tasos. Establecieron un templo a Melqart, el Heracles de Tiro. Las minas de oro fenicias convirtieron esta isla remota en un lugar de importancia estratégica en todo el Egeo. Según la leyenda, la isla toma su nombre de Tasos, un hijo del Rey Fénix, que viajó a la isla en busca de Europa. En el siglo VII a. C. Llegaron colonos griegos de Paros. El vino de Thasian fue celebrado en todo el mundo antiguo por su calidad excepcional. Las vides y el dios del vino Dioniso ocuparon un lugar destacado en las monedas de Tasia. Además del vino, Tasos también ganó fama por sus nueces, su mármol y como centro de comercio marítimo. Las colonias de Tasia: Skapte Hyle, Neapolis, Galepsos, Oisyme, Apollonia, Antisara, Akontisma, Pistiros y Stryme extendieron su influencia al continente, incluido el control de minas de oro aún más ricas allí, con ingresos que alguna vez se estimaron entre 200 y 300 talentos al año. Estos recursos convirtieron a Tasos en un objetivo para potencias mayores como Persia, Atenas y Esparta, ya que la isla jugó un papel importante en la Revuelta Jónica, la Liga de Delos y las Guerras del Peloponeso. La dominación ateniense de la isla pasó a estar bajo un control macedonio después de la victoria de Filipo de Macedonia en Queronea en 338 a. C. \n\n Los [thasos_old_owner.GetAdjective] han aceptado nuestra oferta de comprar la isla. Con el acuerdo finalizado, [GetProvince('(int32)471').GetName] ahora forma oficialmente parte de [ROOT.GetCountry.GetAdjective]. El futuro de [GetProvince('(int32)471').GetName] como colonia [ROOT.GetCountry.GetAdjective] es brillante y ya han llegado más colonos a la isla."
 me_phoenicia_2801.a:0 "Un revés, pero surgirán oportunidades."
 me_phoenicia_2801.at:0 "[GetProvince('(int32)356').GetName] se convierte en [ROOT.GetCountry.GetAdjective] #Y Colonia#!"


 me_phoenicia_29_title:0 "Tomando posesión de Siria"
 me_phoenicia_29_desc:0 "La Gran Siria ha sido durante mucho tiempo el premio de los imperios. Ubicada entre las poderosas potencias del Nilo, Persia y Anatolia, el control sobre Siria nos colocaría en una posición para arbitrar el equilibrio de poder en el Cercano Oriente. Los preparativos están en marcha. Nuestros ejércitos, entrenados y equipados para los desafíos que se avecinan, están listos para marchar. Se han construido fortalezas, se han asegurado las líneas de suministro y nuestros soldados se han preparado para los inevitables enfrentamientos con las fuerzas de los Diadochi y los gobernantes locales. Ha llegado el momento de actuar: ¡pronto, la Gran Siria será nuestra!"
 me_phoenicia_29.a:0 "Siria temblará ante nuestro poderío."
 me_phoenicia_29_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_29$#!' $mission_completed_tooltip_2$"
#The time for limitations is over. With the exception of Arados, the Phoenician cities have historically confined their activities to the coasts, content with trade and naval dominance. But we Phoenicians are no mere merchants. Without us, there would be no Carthage, no grand cities of Iberia. It is time to reclaim our place as a dominant power, not only of the seas but also of the land. 

 me_phoenicia_30_title:0 "Gran Siria"
 me_phoenicia_30_desc:0 "Ha pasado el tiempo de las limitaciones. Con excepción de Arados, las ciudades fenicias han limitado históricamente sus actividades a las costas, contentándose con el comercio y el dominio naval. Pero los fenicios no somos simples comerciantes. Sin nosotros, no habría Cartago ni grandes ciudades de Iberia. Es hora de recuperar nuestro lugar como potencia dominante, no solo en los mares sino también en la tierra.\n\n¡La victoria es nuestra! Por la fuerza de las armas, los ejércitos de [ROOT.GetCountry.GetName] han tomado el control de la Gran Siria."
 me_phoenicia_30.a:0 "En verdad somos un Estado sirio."
 me_phoenicia_30.b:0 "¡Por fin el pueblo fenicio se ha unido como uno solo!"
 me_phoenicia_30_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_30$#!' $mission_completed_tooltip_2$"

 me_phoenicia_31_title:0 "Sangre de Dido"
 me_phoenicia_31_desc:0 "El archivista jefe de [ROOT.GetCountry.GetCapital.GetName] ha regresado triunfante de su investigación con una colección de documentos que parecen confirmar la antigua afirmación de los [ROOT.GetCountry.GetRuler.GetFamily.GetName]: que en efecto descienden de Pigmalión de Tiro, el hermano de la propia reina Dido. Estos documentos, escritos en escritura arcaica, detallan una genealogía que se remonta directamente a la Casa de Ithobaal.\n\nSin embargo, algunos ojos perspicaces han notado peculiaridades en la gramática y la sintaxis, demasiado modernas para registros supuestamente escritos hace siglos. A pesar de esto, nadie se atreve a investigar demasiado de cerca, ya sea por respeto a la tradición o por miedo a cuestionar a [ROOT.GetCountry.GetRuler.GetName]."
 me_phoenicia_31.a:0 "¡La sangre de Dido corre por mis venas!"
 me_phoenicia_31_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_3$1#!' $mission_completed_tooltip_2$"

 me_phoenicia_32_title:0 "Fuerza con los macedonios"
 me_phoenicia_32_desc:0 "El futuro de Fenicia está claramente entrelazado con el de los #E [ROOT.GetCountry.GetOverlord.GetAdjective]#!,, nuestro poderoso señor. Si bien puede resultar tentador afirmar una mayor independencia, tales acciones solo generarían conflictos y sospechas. En cambio, tomemos el camino más sensato, uno que solidifique nuestra posición y eleve nuestra estatura dentro de su reino."
 me_phoenicia_32.a:0 "Más bien amigos que enemigos."
 me_phoenicia_32_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_32$#!' $mission_completed_tooltip_2$"

 me_phoenicia_33_title:0 "Una solicitud de colaboración"
 me_phoenicia_33_desc:0 "Los gobernantes de [phoenicia_ally_country.GetName], una de las orgullosas ciudades fenicias bajo nuestro dominio, han enviado un emisario a nuestra corte con una audaz petición. Argumentan que sus contribuciones a nuestra causa han demostrado su valor no solo como provincia, sino como un socio valioso. Citando el precedente histórico de las alianzas fenicias con grandes potencias, como su papel indispensable bajo Persia y la confianza otorgada por Alejandro Magno, ahora piden que formalicemos su condición de aliado.\n\nConceder esta petición garantizaría su lealtad y fortalecería sus contribuciones, pero también sentaría un precedente para una mayor autonomía entre nuestros súbditos. ¿Deberíamos reconocerlos como un socio en lugar de una mera provincia?"
 me_phoenicia_33.a:0 "Formalicemos una alianza con [phoenicia_ally_country.GetName]."
 me_phoenicia_33.b:0 "Seguirán siendo una provincia bajo nuestro dominio."

 me_phoenicia_3301_title:0 "Demostrando nuestro valor"
 me_phoenicia_3301_desc:0 "El tribunal de los #E [phoenicia_old_overlord.GetAdjective]#! ha recibido noticias sobre nuestra solicitud. Tras una cuidadosa deliberación, han accedido a reconocernos como socios y no como una simple provincia, lo que nos otorga la autonomía necesaria para servir mejor a sus intereses y a los nuestros."
 me_phoenicia_3301.a:0 "Nos sentimos honrados de que confíen en nosotros como socios."
 me_phoenicia_33_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_33$#!' $mission_completed_tooltip_2$"

 me_phoenicia_3302_title:0 "Demostrando nuestro valor"
 me_phoenicia_3302_desc:0 "El tribunal de los #E [phoenicia_old_overlord.GetAdjective]#! ha rechazado nuestra solicitud de reconocimiento como socios. Lamentablemente, debemos actuar con cautela y seguir demostrando nuestro valor hasta el día en que podamos asegurar el estatus que merecemos."
 me_phoenicia_3302.a:0 "Seguimos leales...por ahora."

 me_phoenicia_34_title:0 "Reformas republicanas"
 me_phoenicia_34_desc:0 "A mediados del siglo III a. C., las ciudades-estado fenicias habían dejado atrás la monarquía para pasar a ser consejos de élites y magistrados electos. En la tradición fenicia, los shopets, o magistrados, eran funcionarios electos que gobernaban como administradores de la ciudad-estado, garantizando la rendición de cuentas y la toma de decisiones colectiva. Si bien este sistema de gobierno era más prominente en colonias fenicias como Cartago, Tiro adoptó brevemente los shopets después de que la ciudad quedara bajo la influencia del Imperio neobabilónico bajo Nabucodonosor II. Los shopets eran elegidos por lo general entre la aristocracia de la ciudad y gobernaban en tándem, a menudo por períodos limitados, lo que garantizaba que el poder no se concentrara en un solo individuo."
 me_phoenicia_34.a:0 "Los tiempos de cambio requieren un cambio de gobierno."
 me_phoenicia_34.b:0 "Las viejas formas son las mejores."

#me_phoenicia_35

 me_phoenicia_36_title:0 "Corazón de Fenicia"
 me_phoenicia_36_desc:0 "Las grandes ciudades de Fenicia han luchado por el poder durante mucho tiempo, cada una buscando eclipsar a las demás en comercio, influencia y prosperidad. Tiro, Sidón y Arados han sido históricamente las protagonistas dominantes, cada una reivindicando la supremacía en diferentes momentos, pero rara vez uniéndose bajo una única autoridad. Una excepción notable fue durante la era de los reyes sidonios de Tiro, cuando estas dos ciudades rivales estuvieron unidas brevemente. A medida que [ROOT.GetCountry.GetName] crece en poder y prestigio, debemos elegir pragmáticamente una sede central de gobierno para nuestro reino."
 me_phoenicia_36_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_37$#!' $mission_completed_tooltip_2$"
 me_phoenicia_36.a:0 "Arados, la isla fortaleza del norte de Fenicia."
 me_phoenicia_36.at:0 "Todos los territorios [GetCountry('ARA').GetAdjective] pasan a ser propiedad de [THIS.GetCountry.GetName]"
 me_phoenicia_36.b:0 "Trípoli, símbolo de la unidad fenicia."
 me_phoenicia_36.bt:0 "Todos los territorios [GetCountry('ATI').GetAdjective] pasan a ser propiedad de [THIS.GetCountry.GetName]"
 me_phoenicia_36.c:0 "Biblos, una ciudad histórica y antigua"
 me_phoenicia_36.ct:0 "Todos los territorios [GetCountry('BYB').GetAdjective] pasan a ser propiedad de [THIS.GetCountry.GetName]"
 me_phoenicia_36.d:0 "Sidón, próspera y fértil."
 me_phoenicia_36.dt:0 "Todos los territorios [GetCountry('SID').GetAdjective] pasan a ser propiedad de [THIS.GetCountry.GetName]"
 me_phoenicia_36.e:0 "Tiro, la fortaleza marítima"
 me_phoenicia_36.et:0 "Todos los territorios [GetCountry('TYE').GetAdjective] pasan a ser propiedad de [THIS.GetCountry.GetName]"
 me_phoenicia_36.f:0 "Beirut, el reino olvidado."
 me_phoenicia_36.ft:0 "Todos los territorios [GetCountry('BYB').GetAdjective] pasan a ser propiedad de [THIS.GetCountry.GetName]"
 me_phoenicia_36.g:0 "[ROOT.GetCountry.GetCapital.GetName] ¡ya es el corazón de Fenicia!"

 me_phoenicia_3600_title:0 "Futuro de Fenicia"
 me_phoenicia_3600_desc:0 "Desde la isla fortaleza de Arados hasta los bulliciosos puertos de Sidón y Tiro, los fenicios eran famosos como comerciantes, armadores y exploradores de calidad incomparable. Fuimos nosotros quienes enseñamos al mundo los secretos del mar, quienes construyeron la poderosa Cartago y quienes conectaron tierras distantes a través de redes de comercio y cultura. Pero la era de sumisión a imperios y señores supremos debe terminar. Las olas que han llevado nuestros barcos a todos los rincones del mundo conocido ahora nos llevarán hacia el dominio, tanto en tierra como en el mar.\n\nEl orgulloso pueblo fenicio dominaba el Mediterráneo muchos siglos antes. Sin nosotros, no habría Cartago ni las grandes ciudades de Iberia. Desde los días de Ciro, hemos languidecido bajo el dominio de señores extranjeros, pero ahora... ahora es nuestra oportunidad de reclamar nuestra herencia y mostrar al mundo el poder de Fenicia, una vez más. ¡Hoy anuncia el inicio de la #E Segunda Edad de Oro fenicia#!!"
 me_phoenicia_3600.a:0 "¡Fenicia permanecerá unida e indivisible!"
 me_phoenicia_3600.b:0 "[ROOT.GetCountry.GetName] es la maestra Fenicia."
 me_phoenicia_3600_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_37$#!' $mission_completed_tooltip_2$"

 me_phoenicia_37_title:0 "Preguntando a Arados"
 me_phoenicia_37_desc:0 "El hegemón del norte de Fenicia, Arados, el fenicio 'Arwad', asentado en lo alto de una isla cerca de donde el río Orontes desemboca en el mar Mediterráneo, siempre se ha mantenido apartado del resto de Fenicia. Desde su fortaleza isleña rocosa, dominaba no sólo las olas sino también una impresionante red de ciudades continentales, incluidas Marathos, Simyra, Karne, Balanea, Antarados y las tierras de cultivo de la llanura de Gabala. Cuando [GetCharacter('(int32)39').GetName] se acercó a [ROOT.GetCountry.GetCapital.GetName], se encontró con [GetCharacter('(int32)93').GetName], hijo de [GetCharacter('(int32)92').GetPraenomen], el rey de los araditas. El propio [GetCharacter('(int32)92').GetPraenomen] estaba ausente, sirviendo en la flota persa bajo #E Autofradates#! junto con los otros reyes fenicios y chipriotas. [GetCharacter('(int32)93').GetPraenomen], saludó a [GetCharacter('(int32)39').GetPraenomen] con una corona de oro y se rindió prometiendo entregarle tanto la isla de [ROOT.GetCountry.GetCapital.GetName] como la gran y próspera ciudad de Marathos, situada en el continente justo frente a Aradus; también Sigón, la ciudad de Mariamme y todos los demás lugares bajo su propio dominio y el de su padre. [GetCharacter('(int32)42').GetName] gobernó Fenicia del 319 al 315, luego [GetCharacter('(int32)37').GetName] y su hijo [GetCharacter('(int32)38').GetPraenomen] se apoderaron de Tiro y todas las demás ciudades fenicias, con excepción de Arados.\n\nNuestras propuestas a Arados han tenido éxito. Aunque reacios, han aceptado reconocer nuestro liderazgo y ayudarnos a expulsar a los Diadochi de nuestras costas."
 me_phoenicia_37.a:0 "¡Arados permanecerá firme, inquebrantable y sin romperse!"
 me_phoenicia_37_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_37$#!' $mission_completed_tooltip_2$"

 me_phoenicia_38_title:0 "Hablando con Trípoli"
 me_phoenicia_38_desc:0 "Trípoli, conocida en griego como \"Tripolis\" y en fenicio como \"Atri\", era probablemente la más joven de las cinco principales ciudades fenicias. Mientras que Eusebio de Cesarea fecha su fundación en el año 761 a. C., Diodoro sitúa sus orígenes en el período persa. La evidencia arqueológica sugiere que el sitio estuvo habitado ya en el siglo XIV a.C. El aumento del nivel del mar ha sumergido gran parte de las capas de la era persa, complicando el trabajo arqueológico. La ciudad derivó su nombre griego, \"Tripolis\", que significa \"Tres Ciudades\", de su estructura tripartita. Según fuentes clásicas, Trípoli fue fundada por las ciudades fenicias de Arados, Sidón y Tiro, cada una de las cuales estableció una ciudad distinta a aproximadamente 200 metros de distancia. Estos pueblos, fortificados individualmente y probablemente gobernados por sus respectivas ciudades madre, formaron una confederación que compartía un puerto. Durante el período persa, Trípoli fue la sede de un concilio panfenicio. Diodoro señala que \"Trípoli ocupaba el rango más alto de todas las ciudades de Fenicia\" porque la ciudad albergaba asambleas generales donde reyes y representantes de varias ciudades fenicias deliberaban sobre asuntos de importancia colectiva. Después de la derrota de los persas en la batalla de Issus, los mercenarios de Darío III, liderados por el traidor Amintas, se apoderaron de Trípoli. Amintas lo utilizó como base para lanzar un fallido intento de apoderarse de Egipto. Después de que sus tres ciudades fundadoras, Arados, Sidón y Tiro, se sometieran a Alejandro, Trípoli hizo lo mismo.\n\nNuestras propuestas a Trípoli han tenido éxito. Aunque reacios, han aceptado reconocer nuestro liderazgo y ayudarnos a expulsar a los Diadochi de nuestras costas."
 me_phoenicia_38.a:0 "¡Nuestras ciudades están unidas en fuerza!"
 me_phoenicia_38_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_38$#!' $mission_completed_tooltip_2$"

 me_phoenicia_39_title:0 "La mendicidad en Biblos"
 me_phoenicia_39_desc:0 "Biblos, una de las ciudades más antiguas del mundo conocido, ha sido el hogar de los reinos marítimos fenicios durante más tiempo del que la mayoría de otras tierras han estado pobladas y es de aquí de donde se originaron muchos de los colonos que fundaron las grandes ciudades púnicas en el Mediterráneo occidental. Biblos se ha sometido a innumerables conquistadores, entre ellos: Alejandro, Ciro, Salmanasar, Tutmosis y otros nombres que se perdieron en el tiempo. Pero todos ellos han pasado a la memoria y la ciudad aún perdura. [GetProvince('(int32)766').GetName] ha tenido durante mucho tiempo su dominio sobre todas las tierras desde el Teoprosopon hasta el Lico, pero en los últimos siglos el Reino de [GetProvince('(int32)748').GetName] se ha subordinado a él. La gran ciudad se especializa en las industrias de cerámica, vidrio y tinte púrpura, mientras que su puerto contiene almacenes para productos importados de Siria, Persia e India.\n\nNuestras propuestas a Biblos han tenido éxito. Aunque reacios, han aceptado reconocer nuestro liderazgo y ayudarnos a alejar a los diádocos de nuestras costas."
 me_phoenicia_39.a:0 "El cielo, envidioso de nuestras alegrías, se ha puesto pálido..."
 me_phoenicia_39_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_39$#!' $mission_completed_tooltip_2$"

 me_phoenicia_40_title:0 "Solicitando a Sidón"
 me_phoenicia_40_desc:0 "El puerto de Sidón albergó a los primeros comerciantes marítimos de Fenicia y fue desde aquí que se exploró por primera vez el Mediterráneo occidental; fue en su playa donde se desentrañaron los secretos de la fabricación del vidrio y es aquí donde las conchas de murex perdieron por primera vez su color púrpura. Sus talleres producen los tesoros de Fenicia; plata y bordados de la mejor calidad, loza apta para los salones de reyes y faraones y, por supuesto, vidrio sin igual. Incluso esa otra gran ciudad, [GetProvince('(int32)743').GetName], proviene de la semilla de Sidón, aunque ella podría negarlo. La gran ciudad también posee amplias propiedades al sur. El Señor de los Reyes #E el rey Cambises II#! añadió [GetProvince('(int32)667').GetName], [GetProvince('(int32)663').GetName] y las poderosas tierras de #E Dagón#! al dominio de Sidón como recompensa por la ayuda que le prestó en la conquista de #E Egipto#! por nuestro #E rey Eshmun'azar. II#!. El pueblo de [ROOT.GetCountry.GetCapital.GetName] abrió voluntariamente sus puertas a [GetCharacter('(int32)39').GetName], quien depuso al rey de Sidón #E Estratón#! y levantó a [GetCharacter('(int32)95').GetName], un descendiente empobrecido de la familia real, para gobernar la ciudad. [GetCharacter('(int32)39').GetPraenomen], muy impresionado por el carácter de este hombre, dio órdenes de que no sólo se asignara al nuevo rey el equipamiento real de Estratón, sino que también se ampliara el territorio de Sidón, a expensas de Tiro.\n\nNuestras propuestas a Sidón han tenido éxito. Aunque reacios, han aceptado reconocer nuestro liderazgo y ayudarnos a expulsar a los Diadochi de nuestras costas."
 me_phoenicia_40.a:0 "¡Gloriosa, rica y productiva Sidón!"
 me_phoenicia_40_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_40$#!' $mission_completed_tooltip_2$"

 me_phoenicia_41_title:0 "Tratamiento con Tiro"
 me_phoenicia_41_desc:0 "Tiro fue fundada a principios del tercer milenio a.C. La rivalidad entre Tiro y Sidón definió gran parte de la historia política de Fenicia, con ambas ciudades luchando por el control de las redes comerciales y la influencia sobre los asentamientos fenicios más pequeños. La ciudad constaba de una isla fortificada y su contraparte continental, Ushu, que proporcionaba recursos agrícolas y madera de los bosques cercanos. La fortaleza económica de Tiro se vio reforzada por su producción de tinte púrpura de Tiro, un bien de lujo muy buscado, y sus extensos esfuerzos de colonización. Entre sus colonias más notables se encontraban Cartago, Kition y Gadir. La ciudad se sometió a los gobernantes egipcios, asirios y babilónicos, y a menudo aprovechó sus vastos recursos para preservar su autonomía. Cuando [GetCharacter('(int32)39').GetName] llegó a #E Ushu#!, la ciudad continental frente a la isla de Tiro, el rey [GetCharacter('(int32)543').GetPraenomen], estaba sirviendo en la flota persa junto a #E Autofradados#! y #E Farnabazo III#!, los sátrapas Lidia y Frigia helespontina respectivamente. En su ausencia, una delegación de nobles tirios saludó a Alejandro. Aunque ofrecieron una sumisión simbólica, rechazaron su solicitud de realizar un sacrificio en el templo de Melqart en la isla. En cambio, le sugirieron que hiciera su ofrenda en el templo del continente. Esta negativa enfureció a [GetCharacter('(int32)39').GetPraenomen], quien declaró: 'Tu posición te da seguridad y, como vives en una isla, desprecias mi ejército de infantería. Sin embargo, quiero que sepas que me dejarás entrar en tu ciudad, ¡voluntariamente o por la fuerza! Así comenzó uno de los asedios más duros de la historia. Decidido a tomar Tiro, [GetCharacter('(int32)39').GetPraenomen] ordenó la construcción de una enorme calzada para conectar el continente con la isla, utilizando piedras de las ruinas de Ushu. Los tirios resistieron ferozmente, lanzaron barcos de fuego contra las torres de asedio macedonias y utilizaron su flota para hostigar la construcción. A pesar de sus esfuerzos, la calzada avanzó, apoyada por los ingenieros de [GetCharacter('(int32)39').GetPraenomen] y una flota creciente que incluía barcos fenicios y chipriotas que habían desertado de la armada persa. Después de siete meses, las fuerzas de [GetCharacter('(int32)39').GetPraenomen] traspasaron los muros de Tiro con una combinación de implacable asedio y poder naval. Sus tropas asaltaron la ciudad, masacrando y esclavizando a miles de sus defensores. La flota de Tiro fue hundida o capturada, y sus magistrados y visitantes #E cartagineses#! buscaron refugio en el templo de Melqart. [GetCharacter('(int32)39').GetPraenomen] perdonó al rey [GetCharacter('(int32)543').GetPraenomen], que no había participado en la negativa a rendirse, y lo dejó en el trono. La ciudad misma, sin embargo, estaba completamente sometida y [GetCharacter('(int32)39').GetPraenomen] celebró su victoria con sacrificios a Heracles-Melqart.\n\nNuestras propuestas a Tiro han tenido éxito. Aunque reacios, han aceptado reconocer nuestro liderazgo y ayudarnos a expulsar a los Diadochi de nuestras costas."
 me_phoenicia_41.a:0 "Resurgiremos de las cenizas."
 me_phoenicia_41_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_41$#!' $mission_completed_tooltip_2$"

#42 Rome events

 me_phoenicia_43_title:0 "Unificando la Decápolis"
 me_phoenicia_43_desc:0 "La Decápolis, un grupo de diez ciudades altamente helenizadas en las partes meridionales de Siria-Coele y el norte de Judea, ha sido durante mucho tiempo un bastión de la cultura griega y la sofisticación urbana en el Levante. Estas ciudades, como Escitópolis, Gadara y Gerasa, eran famosas por sus teatros, gimnasios y templos, que mostraban la profunda influencia de la civilización helenística. Históricamente, las ciudades de la Decápolis se aliaron entre sí para mantener su autonomía y defenderse de las amenazas de los estados judíos del sur y otras potencias regionales. Al poner la Decápolis bajo nuestra influencia, podemos asegurar el control sobre una región estratégicamente vital y culturalmente significativa. La Decápolis servirá como un amortiguador contra los vecinos hostiles y un centro para el comercio y la cultura helenística dentro de nuestro creciente dominio."
 me_phoenicia_43.a:0 "Quizás deberíamos abrazar también las influencias helenísticas."
 me_phoenicia_43_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_43$#!' $mission_completed_tooltip_2$"

 me_phoenicia_44_title:0 "Guardia de honor"
 me_phoenicia_44_desc:0 "La púrpura de Tiro, el tinte legendario apreciado por la realeza y las élites de todo el Mediterráneo, debe extraerse minuciosamente de los caracoles marinos murex y púrpura. Los trabajadores crearían la \"púrpura de Tiro\" pinchando periódicamente al murex con una vara, lo que les incitaría a secretar una película que luego se recogería en cubas. Se estima que se necesitarían las secreciones combinadas producidas por doce mil caracoles para teñir el forro de una prenda de vestir. Para teñir una toga entera se necesitarían un cuarto de millón de caracoles. Por esta razón, sólo los más ricos podían permitírselo, y el color púrpura pasó a asociarse con la realeza. El proceso de producción de púrpura era un secreto comercial en ese momento, lo que podría explicar el origen del nombre de Fenicia (tierra de la púrpura). El tono de púrpura más común se llamaba Púrpura de Tiro, en honor a Tiro, la ciudad fenicia más importante. Grandes montones de conchas desechadas son testimonio de siglos de producción para la exportación de este codiciado color real. El proceso requiere mucha mano de obra y requiere miles de caracoles incluso para obtener una pequeña cantidad de tinte. Una vez cosechadas, las glándulas se trituran y fermentan, y el pigmento resultante se expone a la luz solar para lograr su tono púrpura brillante y duradero."
 me_phoenicia_44.a:0 "[ROOT.GetCountry.GetCapital.GetName] huele a caracol podrido..."
 me_phoenicia_44_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_44$#!' $mission_completed_tooltip_2$"

 me_phoenicia_45_title:0 "Púrpura de Tiro"
 me_phoenicia_45_desc:0 "Si bien nuestro dominio naval y nuestra destreza mercantil son la envidia del Mediterráneo, también debemos prepararnos para los conflictos inevitables que surgen con la expansión y el mantenimiento de nuestra influencia. Históricamente, las ciudades fenicias, particularmente las del oeste como Cartago, a menudo dependían de mercenarios extranjeros para complementar sus ejércitos, aprovechando su riqueza para contratar a los mejores soldados de toda la región. Por el precio correcto, podemos asegurarnos un grupo confiable de mercenarios listos para cumplir nuestras ambiciones. Estas fuerzas de élite, que actúan como nuestra Guardia de Honor, reforzarán nuestros ejércitos y garantizarán nuestra preparación para cualquier desafío."
 me_phoenicia_45.a:0 "¡El mundo temblará ante nuestro poder!"
 me_phoenicia_45_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_45$#!' $mission_completed_tooltip_2$"

 me_phoenicia_46_title:0 "Carpinteros de barcos fenicios"
 me_phoenicia_46_desc:0 "Los fenicios han sido reconocidos durante mucho tiempo como los mejores carpinteros de barcos del mundo antiguo. Desde las robustas embarcaciones de cedro de Tiro y Sidón hasta los veloces buques de guerra que adornaban los puertos de Arados, nuestra maestría en la construcción naval nos ha hecho indispensables para las potencias imperiales a lo largo de los siglos. Fue la experiencia naval de nuestros barcos lo que nos permitió obtener un grado de autonomía en sucesivos imperios a cambio del apoyo de nuestras flotas."
 me_phoenicia_46.a:0 "Como una vez fue, así volverá a ser."
 me_phoenicia_46_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phoenicia_missions_task_46$#!' $mission_completed_tooltip_2$"


##############
 #Diadochi
 me_phoenicia_100_title:0 "La deserción de Tiro"
 me_phoenicia_100_desc:0 "La muerte de Antígono ha causado conmoción en Tiro, donde los leales a la causa de los antígonos han estado librando una insurgencia encubierta contra nuestra ocupación. Aprovechando la noticia de la muerte de Antígono, el pueblo de Tiro se ha alzado enfadado contra estos restos de la influencia de los antígonos. El consejo de la ciudad ha detenido y ejecutado a los leales, y su resistencia ha sido aplastada en una ola de desafío popular. [GetCountry('TYE').GetRuler.GetName] y el consejo de [GetCountry('TYE').GetAdjective] han renunciado a su lealtad a la dinastía de los antígonos y han declarado su lealtad inquebrantable a [ROOT.GetCountry.GetRuler.GetName]. Con la ciudad ahora firmemente bajo nuestro control y los insurgentes eliminados, el futuro de Tiro como piedra angular de nuestro dominio está asegurado."
 me_phoenicia_100.a:0 "Los insurgentes se han ido. Tiro es verdaderamente nuestro."

 me_phoenicia_101_title:0 "La deserción de Sidón"
 me_phoenicia_101_desc:0 "La muerte de Antígono ha causado conmoción en Sidón, donde los leales a la causa de los antígonos han estado librando una insurgencia encubierta contra nuestra ocupación. Aprovechando la noticia de la muerte de Antígono, el pueblo de Sidón se ha alzado enfadado contra estos restos de la influencia de los antígonos. El consejo de la ciudad ha detenido y ejecutado a los leales, y su resistencia ha sido aplastada en una ola de desafío popular. [GetCountry('SID').GetRuler.GetName] y el consejo de [GetCountry('SID').GetAdjective] han renunciado a su lealtad a la dinastía de los antígonos y han declarado su lealtad inquebrantable a [ROOT.GetCountry.GetRuler.GetName]. Con la ciudad ahora firmemente bajo nuestro control y los insurgentes eliminados, el futuro de Sidón como piedra angular de nuestro dominio está asegurado."
 me_phoenicia_101.a:0 "Los insurgentes se han ido. Sidón es verdaderamente nuestra."


 me_phoenicia_102_title:0 "La deserción de Tiro y Sidón"
 me_phoenicia_102_desc:0 "La muerte de Antígono ha causado una gran conmoción en Fenicia, provocando revueltas tanto en Tiro como en Sidón. Los leales a la causa antígona, que habían estado librando insurgencias encubiertas contra nuestra ocupación, se vieron abrumados cuando la gente de estas grandes ciudades se levantó en desafío. Aprovechando la noticia de la muerte de Antígono, los consejos de Tiro y Sidón organizaron rápidas purgas de los leales a los antígonas, ejecutando a sus líderes y aplastando cualquier resistencia restante. Tanto [GetCountry('TYE').GetRuler.GetName] como [GetCountry('SID').GetRuler.GetName], junto con sus respectivos consejos, han declarado su lealtad inquebrantable a [ROOT.GetCountry.GetRuler.GetName]. Con los insurgentes eliminados, Tiro y Sidón ahora se mantienen unidos como piedras angulares de nuestro creciente dominio."
 me_phoenicia_102.a:0 "Los insurgentes se han ido. Tiro y Sidón son verdaderamente nuestras."


 me_phoenicia_200_title:0 "Una oportunidad en Fenicia"
 me_phoenicia_200_desc_0:0 "El reino de Antigónida está sumido en el caos, y su otrora poderoso control del Mediterráneo oriental se está debilitando en medio de la agitación interna y las presiones externas. Aunque sus guarniciones todavía controlan nominalmente Tiro y Sidón, su control es, en el mejor de los casos, tenue. En [ROOT.GetCountry.GetCapital.GetName], se dice que los hombres de Tiro y Sidón se quejan abiertamente de que la vida sería mucho mejor bajo el gobierno de [ROOT.GetCountry.GetName], anhelando la paz y la estabilidad. Esto nos presenta una oportunidad: en lugar de esperar a que el caos se apodere de Tiro y Sidón, podríamos actuar con decisión y ofrecer comprar las ciudades a [GetCountry('PRY').GetRuler.GetName]. Una transacción de este tipo proporcionaría a [GetCountry('PRY').GetRuler.GetHerHim] recursos muy necesarios y, al mismo tiempo, aseguraría estas ciudades cruciales para nuestro propio dominio..."
 me_phoenicia_200_desc_1:0 "El reino de Antigónida está sumido en el caos, y su otrora poderoso control del Mediterráneo oriental se está debilitando en medio de la agitación interna y las presiones externas. Aunque sus guarniciones todavía controlan nominalmente Tiro, su control es, en el mejor de los casos, tenue. En [ROOT.GetCountry.GetCapital.GetName], se dice que los hombres de Tiro se quejan abiertamente de que la vida sería mucho mejor bajo el gobierno de [ROOT.GetCountry.GetName], anhelando la paz y la estabilidad. Esto nos presenta una oportunidad: en lugar de esperar a que el caos se apodere de Tiro, podríamos actuar con decisión y ofrecerle comprar la ciudad a [GetCountry('PRY').GetRuler.GetName]. Una transacción de este tipo proporcionaría a [GetCountry('PRY').GetRuler.GetHerHim] recursos muy necesarios y, al mismo tiempo, aseguraría esta ciudad crucial para nuestro propio dominio..."
 me_phoenicia_200_desc_2:0 "El reino de Antigónida está sumido en el caos, y su otrora poderoso control del Mediterráneo oriental se está debilitando en medio de la agitación interna y las presiones externas. Aunque sus guarniciones todavía controlan nominalmente Tiro, su control es, en el mejor de los casos, tenue. En [ROOT.GetCountry.GetCapital.GetName], se dice que los hombres de Tiro se quejan abiertamente de que la vida sería mucho mejor bajo el gobierno de [ROOT.GetCountry.GetName], anhelando la paz y la estabilidad. Esto nos presenta una oportunidad: en lugar de esperar a que el caos se apodere de Tiro, podríamos actuar con decisión y ofrecerle comprar la ciudad a [GetCountry('PRY').GetRuler.GetName]. Una transacción de este tipo proporcionaría a [GetCountry('PRY').GetRuler.GetHerHim] recursos muy necesarios y, al mismo tiempo, aseguraría esta ciudad crucial para nuestro propio dominio..."
 me_phoenicia_200.a:0 "Seguramente [GetCountry('PRY').GetRuler.GetPraenomen] verá la sabiduría en esto."
 me_phoenicia_200.at:0 "Una oferta para comprar #Y [tyre_country.GetName]#! @[tyre_country.GetFlag]!#! y #Y [sidon_country.GetName]#! @[sidon_country.GetFlag]!#! se enviará a [GetCountry('PRY').GetRuler.GetPraenomen]\nSi [GetCountry('PRY').GetRuler.GetPraenomen] acepta, se realizará lo siguiente ocurrir:\n"
 me_phoenicia_200.b:0 "Seguramente [GetCountry('PRY').GetRuler.GetPraenomen] verá la sabiduría en esto."
 me_phoenicia_200.bt:0 "Se enviará una oferta de compra de #Y [phoenicia_country.GetName]#! @[phoenicia_country.GetFlag]!#! a [GetCountry('PRY').GetRuler.GetPraenomen].\nSi [GetCountry('PRY').GetRuler.GetPraenomen] acepta, ocurrirá lo siguiente:\n"
 me_phoenicia_200.c:0 "Esperemos y dejemos que su control se debilite aún más."
 me_phoenicia_200.ct:0 "#R No pasa nada#!"

 me_phoenicia_201_title:0 "[phoenicia_buyer.GetAdjective] Oferta"
 me_phoenicia_201_desc_0:0 "El Reino Antigónida está sumido en el caos, y nuestro otrora poderoso control sobre el Mediterráneo oriental se está debilitando en medio de la agitación interna y las presiones externas. Aunque nuestras guarniciones todavía controlan nominalmente Tiro y Sidón, su control es, en el mejor de los casos, tenue. En [ROOT.GetCountry.GetCapital.GetName], se dice que los hombres de Tiro y Sidón se quejan abiertamente de que la vida sería mucho mejor bajo el gobierno de [phoenicia_buyer.GetName], anhelando paz y estabilidad. Ahora, ha llegado una oferta de [phoenicia_buyer.GetName], proponiendo comprar estas dos ciudades fenicias vitales. Afirman (quizás con razón) que el malestar en Tiro y Sidón hace que nuestra ocupación continua sea insostenible. Esto nos presenta una oportunidad: en lugar de esperar a que el caos se apodere de Tiro y Sidón, podríamos venderlas a cambio de recursos muy necesarios para estabilizar nuestros territorios centrales; sin embargo, renunciar al control sobre ciudades tan valiosas estratégicamente podría debilitar nuestra influencia en el Mediterráneo oriental."
 me_phoenicia_201_desc_1:0 "El Reino Antigónida está sumido en el caos, y nuestro otrora poderoso control sobre el Mediterráneo oriental se está debilitando en medio de la agitación interna y las presiones externas. Aunque nuestras guarniciones todavía controlan nominalmente Tiro, su control es, en el mejor de los casos, tenue. En [ROOT.GetCountry.GetCapital.GetName], se dice que los hombres de Tiro se quejan abiertamente de que la vida sería mucho mejor bajo el gobierno de [phoenicia_buyer.GetName], anhelando paz y estabilidad. Ahora, ha llegado una oferta de [phoenicia_buyer.GetName], proponiendo comprar estas dos ciudades fenicias vitales. Afirman (quizás con razón) que el malestar en Tiro hace que nuestra ocupación continua sea insostenible. Esto nos presenta una oportunidad: en lugar de esperar a que el caos se apodere de Tiro, podríamos venderlas a cambio de recursos muy necesarios para estabilizar nuestros territorios centrales; sin embargo, renunciar al control sobre ciudades tan valiosas estratégicamente podría debilitar nuestra influencia en el Mediterráneo oriental."
 me_phoenicia_201.a:0 "¡Al diablo con todo esto! ¡Tenemos un imperio que recuperar!"
 me_phoenicia_201.b:0 "No cederemos ni un ápice."

 me_phoenicia_202_title:0 "Una oportunidad en Fenicia: aceptada"
 me_phoenicia_202_desc:0 "Han llegado noticias de la corte de los Antigónidas: reconociendo la inutilidad de su continua ocupación y el valor de los recursos que les proporcionamos, los Antigónidas han ordenado a sus tropas que se retiren del sur de Fenicia.\n\nCon las guarniciones desaparecidas, sus ciudades han abierto sus puertas a nuestras fuerzas. Su gente nos recibe no como conquistadores sino como liberadores, ansiosos de la paz y la estabilidad que hemos prometido; esperemos que esa estabilidad se haga realidad."
 me_phoenicia_202.a:0 "¡Un día glorioso para nuestro dominio!"

 me_phoenicia_203_title:0 "Una oportunidad en Fenicia: Rechazada"
 me_phoenicia_203_desc:0 "Nuestros diplomáticos han regresado de la corte Antigónida con noticias sombrías. [GetCountry('PRY').GetRuler.GetPraenomen] ha respondido con abierto desdén, burlándose de nuestra propuesta como \"un intento desesperado de apoderarse de lo que no podemos tomar por la fuerza\" y declaró que su dominio sobre el sur de Fenicia permanecería inquebrantable. \n\n[GetCountry('PRY').GetRuler.GetPraenomen] fue más allá, amenazando con represalias si intentáramos \"inmiscuirnos en sus asuntos otra vez\". Su desafío es claro y sus palabras no dejan lugar a la negociación."
 me_phoenicia_203.a:0 "¡Si quieren pelea, la tendrán!"

 me_phoenicia_204_title:0 "¡Salve [diadochi_new_overlord.GetRuler.GetTitle] [diadochi_new_overlord.GetRuler.GetPraenomen]!"
 me_phoenicia_204_desc:0 "El reino de Antigonid está sumido en el caos. Su otrora poderoso control sobre el Mediterráneo oriental se está debilitando en medio de la agitación interna y las presiones externas. Los conflictos internos y las presiones externas han dejado su control sobre [ROOT.GetCountry.GetName], en el mejor de los casos, tenue. [diadochi_new_overlord.GetName], la potencia emergente en la región, ha enviado enviados ofreciendo estabilidad y protección si expulsamos a las guarniciones de Antigonid en [ROOT.GetCountry.GetCapital.GetName]. Aprovechando la noticia de la desaparición de Antigonus, la gente de [ROOT.GetCountry.GetCapital.GetName] se ha levantado enfadada contra estos restos de influencia de Antigonid. Los leales han sido acorralados y ejecutados por el consejo de la ciudad, su resistencia aplastada en una ola de desafío popular. [ROOT.GetCountry.GetRuler.GetPraenomen] y el consejo de [ROOT.GetCountry.GetAdjective] han renunciado a su lealtad a la dinastía de Antigonid y han declarado su lealtad inquebrantable a [diadochi_new_overlord.GetRuler.GetTitle] [diadochi_new_overlord.GetRuler.GetPraenomen]."
 me_phoenicia_204.a:0 "¡Salve [diadochi_new_overlord.GetRuler.GetTitle] [diadochi_new_overlord.GetRuler.GetPraenomen]!"
 me_phoenicia_204.b:0 "Seguiremos siendo leales a los Antigónidas... por ahora."

#Slightly different
 me_phoenicia_205_title:0 "¡Salve [diadochi_new_overlord.GetRuler.GetTitle] [diadochi_new_overlord.GetRuler.GetPraenomen]!"
 me_phoenicia_205_desc:0 "El Reino Antigónida está sumido en el caos. Su otrora poderoso control sobre el Mediterráneo oriental se está debilitando en medio de la agitación interna y las presiones externas. Los conflictos internos y las presiones externas han dejado su control sobre [ROOT.GetCountry.GetName], en el mejor de los casos, tenue. [diadochi_new_overlord.GetName], la potencia emergente en la región, ha enviado enviados ofreciendo estabilidad y protección. Aprovechando la noticia, la gente de [ROOT.GetCountry.GetCapital.GetName] se ha levantado enfadada contra los restos de la influencia antigónida. Los leales han sido acorralados y ejecutados por el consejo de la ciudad, su resistencia aplastada en una ola de desafío popular. [ROOT.GetCountry.GetRuler.GetPraenomen] y el consejo de [ROOT.GetCountry.GetAdjective] han renunciado a su lealtad a la dinastía antigónida y han declarado su lealtad inquebrantable a [diadochi_new_overlord.GetRuler.GetTitle] [diadochi_new_overlord.GetRuler.GetPraenomen]."
 me_phoenicia_205.a:0 "¡Salve [diadochi_new_overlord.GetRuler.GetTitle] [diadochi_new_overlord.GetRuler.GetPraenomen]!"
 me_phoenicia_205.at:0 "¡Ya no somos sujeto de [antigonids_scope.GetName|Y] @[antigonids_scope.GetFlag]!\n¡Ahora somos sujeto de [diadochi_new_overlord.GetName|Y] @[diadochi_new_overlord.GetFlag]!"


