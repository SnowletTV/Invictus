 desc_cde_me_pon_pontic_protectorship:0 "Hemos intervenido en Taurica como protectores de los griegos tauricanos, brindándoles la paz y la seguridad tan esperadas por parte de las tribus bárbaras del norte."
 cde_me_pon_secure_pontic_trade:0 "Comercio seguro"
 desc_cde_me_pon_secure_pontic_trade:0 "La protección del Reino Póntico ha hecho que el comercio en los emporios sea más seguro, permitiendo a los comerciantes entrar y salir de la ciudad sin preocuparse por la piratería y las incursiones bárbaras."
