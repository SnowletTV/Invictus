#Events
 pontus_startup.1.t:0 "Reyes de Kios"
 pontus_startup.1.desc:0 "Los [GetCharacter('(int32)52').GetFamily.GetName] son una antigua familia aristocrática persa. Rastrean su linaje hasta el gran #E Gobryas#!, aunque se discute si este Gobryas era hijo de #E Darío I#! o uno de los siete persas. Independientemente, los [GetCharacter('(int32)52').GetFamily.GetName] recibieron el territorio de #E Mariandynia#! como una concesión de Darío I y en el siglo VI, y más tarde #E Misia#! fue entregada a #E Ariobarzanes.#! Se especula que la hija de Gobryas se casó con Artabazos, el sátrapa de #E Frigia helespontina#! e hijo de Farnaces. Los hijos de Artabazos heredarían las tierras de Gobryas en Mariandynia, pero su sobrino lo sucedería en la Frigia helespontina.\n\nSigue sin estar claro cómo se comportó [GetCharacter('(int32)52').GetPraenomen] cuando #E Parmenión #! estableció una cabeza de puente en Asia para Felipe II y después, durante la expedición de Alejandro. Es probable que Mitrídates se sometiera a #E Alejandro#!. Tras la muerte del Conquistador, Mitrídates prestó sus fuerzas (y su sobrino) a #E Eumenes#!, y con su importante ayuda, este último incluso logró dominar al mucho más experimentado #E Cráteros#!. Después de la muerte de Euemene, [GetCharacter('(int32)228').GetName], habiéndose distinguido en el campo de batalla, se ganó el favor [GetCharacter('(int32)37').GetPraenomen] y se hizo amigo cercano del hijo de [GetCharacter('(int32)37').GetPraenomen] [GetCharacter('(int32)38').GetPraenomen].\n\nSin embargo, [GetCharacter('(int32)37').GetPraenomen] pronto empezó a sospechar de #E Ktistes#!. Según la leyenda, [GetCharacter('(int32)37').GetPraenomen] soñó que caminaba por un campo grande y hermoso y lo sembraba con polvo de oro, pero Mitrídates recogió la cosecha y se la llevó a la costa del Mar Negro. [GetCharacter('(int32)37').GetPraenomen] decidió matarlo y le contó a [GetCharacter('(int32)38').GetPraenomen] sus planes, pero le hizo jurar que guardaría silencio. Pero [GetCharacter('(int32)38').GetPraenomen] no permitiría que su amigo corriera ese destino. Durante el asedio de Tiro, los dos salieron a caminar solos a la orilla del mar, y [GetCharacter('(int32)38').GetPraenomen] usó su lanza para escribir 'Huye, Mitrídates' en la arena, manteniendo así el voto de silencio hecho a su padre. Mitrídates entendió e inmediatamente abandonó la corte de [GetCharacter('(int32)37').GetPraenomen] por la noche con un puñado de compañeros. Si bien se desconoce su paradero exacto, se rumorea que #E Ktistes#! se encuentra en una residencia mariandina de su tío, a lo largo de la frontera con #E Paflagonia#!.\n\nAhora, [GetCharacter('(int32)37').GetNameWithNoTooltip] se encuentra en una posición precaria, mientras los otros llamados Diadochi se preparan para la guerra. Tratando de sopesar sus opciones, [GetCharacter('(int32)52').GetName] espera ansiosamente la llegada de emisarios de #E Cassandros#! y #E Lysimachos#!..."
 pontus_startup.1.a:0 "Solo podemos esperar lo mejor..."
 pontus_startup.1.at:0 "#G ¡Enviados de @[GetCountry('MAC').GetFlag]!  [GetCountry('MAC').GetCapital.GetName|Y] y @[GetCountry('TRE').GetFlag]!  [GetCountry('TRE').GetCapital.GetName|Y] se reunirá [GetCharacter('(int32)52').GetPraenomen] en #E Kios#! en las próximas semanas#!"
# pontus_startup.1.at:0 "#R An  @[GetCountry('PRY').GetFlag]!  [GetCountry('PRY').GetAdjective|Y] embassy will arrive in [THIS.GetCountry.GetCapital.GetName] within the coming weeks#!"

 pontus_startup.2.t:0 "Una oferta tentadora"
 pontus_startup.2.desc:0 "Mientras el sol se ponía sobre [THIS.GetCountry.GetCapital.GetName], llegaron los tan esperados enviados de #E Cassandros#! y #E Lisímaco#!, con sus túnicas espolvoreadas por el desgaste de un viaje apresurado. Trajeron noticias sombrías y una propuesta tentadora. Antígono está condenado. Sin duda caerá ante el poder de nuestras armas combinadas. Pero si tú, [GetCharacter('(int32)52').GetName], eliges ponerte de nuestro lado, tu lealtad no quedará sin recompensa.' Lisímaco nombraría a [GetCharacter('(int32)52').GetName] sátrapa de #E Frigia helespontina#!, un título vinculado a la sede de Daskyleion. Esta provincia, una vez gobernada por el gran Artabazos, no ha tenido sátrapa desde que Polemaio fue asesinado y Fénix de Ténedos fue relevado de su mando. Aunque el título haría poco para cambiar la posición real de [GetCharacter('(int32)52').GetName], conferiría una legitimidad muy necesaria a la dinastía Mitrídates y proporcionaría unidad política a sus posesiones en Misia y Mariandynia. Piensa detenidamente en el futuro de la [GetCharacter('(int32)52').GetFamily.GetName] casa antes de tomar una decisión.'"
 pontus_startup.2.a:0 "¡La Frigia Helespontina será mía!"
 pontus_startup.2.at:0 "#E #R (Ahistórico)#!#!\n$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_1$#!' estará #R no disponible#! hasta que concluya la #E Cuarta Guerra de los Diadochi#!"
 pontus_startup.2.at1:0 "¡[THIS.GetCountry.GetName] recibirá anteriormente @[GetCountry('PRY').GetFlag]!  ¡[GetCountry('PRY').GetAdjective|Y] aterriza en Mysia Inferioris y Mysia Superioris debería @[GetCountry('TRE').GetFlag]!  ¡[GetCountry('TRE').GetName|Y] sale victorioso contra @[GetCountry('PRY').GetFlag]!  [GetCountry('PRY').GetAdjective|Y]#Y s#! en la #E Cuarta Guerra de los Diadochi#!"
 pontus_startup.2.b:0 "No es necesario un cambio de título."
 pontus_startup.2.bt:0 "#E #R (Ahistórico)#!#!\n$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_1$#!' estará #R no disponible#! hasta que concluya la #E Cuarta Guerra de los Diadochi#!"
 pontus_startup.2.c:0 "¿Quizás las Antigónidas tengan una oferta mejor?"
