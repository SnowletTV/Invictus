 me_pontus_kingdom_1_title:0 "Captura de Kimista"
 me_pontus_kingdom_1_desc:0 "El audaz ataque a Kimista ha tenido un éxito más allá de las expectativas. [ROOT.GetCountry.GetRuler.GetName], liderando personalmente el asalto a los hombres desde la finca de su tío en Mariandynia, ha capturado la fortaleza ligeramente custodiada con una resistencia mínima. En cuestión de horas, [GetProvince('(int32)213').GetNameWithNoTooltip] había caído en sus manos, una victoria tan rápida y sin derramamiento de sangre que parece casi predestinada. La fortaleza, situada cerca del escarpado macizo de Olgassys y estratégicamente situada cerca de la frontera de Paflagonia, servirá ahora como base de operaciones para el resurgimiento de la dinastía Mitrídates. Con Kimista firmemente bajo nuestro control, ahora tenemos un punto de apoyo seguro para comenzar a reconstruir nuestro poder y planificar nuestros próximos movimientos. Se están reuniendo suministros de los campos circundantes y seguidores leales están llegando a la fortaleza para unirse a nuestra causa."
 me_pontus_kingdom_1.a:0 "Adiós Kios...por ahora"
 me_pontus_kingdom_1.b:0 "¡Kimista es nuestro! La paflagonia es la siguiente."
 me_pontus_kingdom_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_1$#!' $mission_completed_tooltip_2$"

#Pacifying Paphlogonia
 me_pontus_kingdom_2_title:0 "Lucha por la supervivencia"
 me_pontus_kingdom_2_desc:0 "La conquista de Kimista ha revuelto el avispero. @[GetCountry('PAP').GetFlag]!  [GetCountry('PAP').GetName] seguramente se enfurecerá por este acto descarado y su respuesta no tardará en llegar. Sin embargo, a medida que se cuentan los despojos de este audaz ataque, surge una pregunta aún más audaz: ¿Debería [ROOT.GetCountry.GetRuler.GetPraenomen] aprovechar este impulso y seguir presionando? ¿O debería prevalecer la cautela, consolidar los nuevos logros y esperar la respuesta inevitable? Nuestros asesores están seguros de que @[GetCountry('PAP').GetFlag]!  [GetCountry('PAP').GetName] se arrugará si logramos tomar #E Gangra#!..."
 me_pontus_kingdom_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_pontus_kingdom_2.a:0 "¡Kios no se habrá perdido por nada!"
 me_pontus_kingdom_2.at:0 "Ganaremos un ejército en #E Kimista#!"
 me_pontus_kingdom_2.b:0 "Ahora no es el momento de hostilidades..."
 #me_pontus_kingdom_2_tooltip:0 "It is time for [THIS.GetRuler.GetPraenomen] to show the world who he truly really is, for today is the day the people of [kimista_owner.GetName] meet their doom. Many say only the province of [GetProvince('(int32)214').GetName] is needed to force [kimista_owner.GetName] to capitulate, as they are weaker now than ever."


 MARIANDYNIA_NAME:0 "Mariandinia"
 MARIANDYNIA_ADJECTIVE:0 "mariandiniano"
 mysia_name_change:0 "#E Mysia#! cambia de nombre a #Y Mariandynia#!"

#AI things
 me_pontus_kingdom.222.t:0 "La amenaza de Kios"
 me_pontus_kingdom.222.desc:0 "Un mensaje casi increíble llegó a [ROOT.GetCountry.GetCapital.GetName] y, sin embargo, nuestros jinetes sin aliento, con sus monturas exhaustas salpicadas de espuma, nos aseguran que esta información es cierta: parece que una pequeña fuerza militar de [GetCountry('MIT').GetName], huyendo de la llegada de las levas #E Antigonid#!, se apoderó de la fortaleza de [GetProvince('(int32)213').GetName] y robó las tierras de nosotros.\n\nLa cobarde guarnición encargada de proteger el territorio abrió las puertas sin siquiera intentar defender nuestros derechos, y ahora los ejércitos de Kios patrullan las murallas.\n\nSeguramente, un insulto tan grave no debe ser tolerado - ¿qué haremos, mi [ROOT.GetCountry.GetRulerTitle]?"
 me_pontus_kingdom.222.a:0 "¡Debemos recuperar nuestra tierra que nos corresponde!"
 me_pontus_kingdom.222.b:0 "Los dejaremos en paz...por ahora."

 me_pontus_kingdom_2223_title:0 "Una propuesta para la paz"
 me_pontus_kingdom_2223_desc:0 "Después de la pérdida de [GetProvince('(int32)198').GetNameWithNoTooltip] en la guerra, [GetCountry('PAP').GetName] se dio cuenta de que la guerra no tenía sentido y se acercó a nosotros con una oferta que no pudimos rechazar. Casi todo el norte de Paflagonia nos será cedido y, a cambio, permitiremos que [GetCountry('PAP').GetName] siga viviendo... aunque como un afluente."
 me_pontus_kingdom_2223.a:0 "¡Un día glorioso para el pueblo de Kios!"
 me_pontus_kingdom_2223.b:0 "La paz nunca fue una opción... ¡¡¡todos deben morir!!!"
 me_pontus_kingdom_2223_tooltip:0 "@[GetCountry('PAP').GetFlag]!  [GetCountry('PAP').GetName|Y] cede todas las provincias de su propiedad al norte de #E Gangara#!"

 me_pontus_kingdom_3_title:0 "$pontus_kingdom_missions_task_3$"
 me_pontus_kingdom_3_desc:0 ""
 me_pontus_kingdom_3.a:0 ""
 me_pontus_kingdom_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_3$#!' $mission_completed_tooltip_2$"
 
 me_pontus_kingdom_4_title:0 "$pontus_kingdom_missions_task_4$"
 me_pontus_kingdom_4_desc:0 "Nuestros enemigos presionan nuestras fronteras por todos lados, y algunos afirman que los presagios predicen la perdición de [ROOT.GetCountry.GetName], porque ¿cómo podemos esperar enfrentarnos a las fuerzas que se han reunido contra nosotros? Somos un pez diminuto que nada en un mar de tiburones hambrientos...\n\nSin embargo, [ROOT.GetCountry.GetRuler.GetName] no ha cedido a este miedo, sino que ha elegido pasar cada momento de vigilia entrenando con nuestras tropas y preparándose para cumplir el destino de [ROOT.GetCountry.GetRuler.GetHerHis]. Aunque la inundación amenace con abrumarnos, ¡lucharemos valientemente por nuestras ambiciones!"
 me_pontus_kingdom_4.a:0 "Puede que no parezcamos gran cosa, pero lo tenemos donde cuenta."
 me_pontus_kingdom_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_4$#!' $mission_completed_tooltip_2$"
 
 me_pontus_kingdom_5_title:0 "$pontus_kingdom_missions_task_5$"
 me_pontus_kingdom_5_desc:0 "Después de un largo día de fascinante diálogo, las conversaciones entre los hombres santos que viven dentro de la ciudad de [ROOT.GetCountry.GetCapital.GetName] y [ROOT.GetCountry.GetRuler.GetName] finalmente concluyeron, y todos se retiraron a sus hogares por la noche para reflexionar sobre su discurso.\n\n[ROOT.GetCountry.GetRuler.GetFirstName], alguien quien está muy interesado en los dioses, ha buscado durante mucho tiempo la verdad espiritual e invitó a sacerdotes de los helenos y medos a discutir sus filosofías con [ROOT.GetCountry.GetRuler.GetHerHim]. Después de escuchar sus argumentos, reflexiona abiertamente sobre cambiar las prácticas religiosas de [ROOT.GetCountry.GetName].\n\nHay razones para abrazar la fe #E Mitraica#!, ya que muchos argumentarían que es sabio seguir los ritos de los medianos, pero hay voces que afirman que los dioses #E helénicos#! han demostrado su valor ante el mundo entero y deberían ser seguidos sólo por esta razón.\n\nPor supuesto, podríamos optar por dejar todo como está ahora... ¿Te atreves a arriesgarte a la ira de lo divino?"
 me_pontus_kingdom_5.a:0 "La fe mitraica ha capturado los corazones de la gente."
 me_pontus_kingdom_5.b:0 "Los dioses helénicos son fuertes y deseamos su poder."
 me_pontus_kingdom_5.bt:0 "Desbloquea la decisión #T #E Acepta los presagios greco-pónticos#!#! #G#!"
 me_pontus_kingdom_5.c:0 "Sigamos encendiendo los fuegos de Zoroastro..."
 me_pontus_kingdom_5.d:0 "¡Hay que abrazar los caminos de Zoroastro!"
 me_pontus_kingdom_5.e:0 "Tonterías, nuestros caminos son verdaderos."
 me_pontus_kingdom_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_5$#!' $mission_completed_tooltip_2$"
 
 me_pontus_kingdom_6_title:0 "$pontus_kingdom_missions_task_6$"
 me_pontus_kingdom_6_desc:0 "Llega a la ciudadela a [ROOT.GetCountry.GetCapital.GetName] la noticia de que hemos preparado a nuestros mensajeros, quienes cabalgarán esta misma noche hacia las capitales y ciudadelas de nuestros vecinos para anunciarles un mensaje terrible; a menos que abandonen los asentamientos y las ciudades que consideramos legítimamente nuestros, entonces habrá una guerra entre nuestras naciones."
 me_pontus_kingdom_6.a:0 "Por la presente reclamamos los siguientes territorios para [ROOT.GetCountry.GetName]..."
 me_pontus_kingdom_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_6$#!' $mission_completed_tooltip_2$"
 
 me_pontus_kingdom_7_title:0 "$pontus_kingdom_missions_task_7$"
 me_pontus_kingdom_7_desc:0 "Según todos los indicios, la ciudad de [GetProvince('(int32)1812').GetName], que ya es un puerto famoso con reputación de ser una verdadera polis cosmopolita, continúa floreciendo bajo la administración de sus nuevos gobernantes [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective].\n\nY mientras [ROOT.GetCountry.GetRuler.GetName] está empezando a tomar cariño por [GetProvince('(int32)213').GetName], el [ROOT.GetCountry.GetRulerTitle] tiene recuerdos agridulces del [GetProvince('(int32)245').GetName] abandonado en el orillas del #E Propontis#!. Una mañana, un pensamiento curioso entró en la mente de [ROOT.GetCountry.GetRuler.GetHerHis]; ¿Qué nos impide trasladar la sede de la autoridad [ROOT.GetCountry.GetAdjective] a la costa? Quizás podamos volver a vivir en mar abierto."
 me_pontus_kingdom_7.a:0 "[ROOT.GetCountry.GetCapital.GetName] es una buena ubicación; el status quo es"
 me_pontus_kingdom_7.b:0 "Traslademos nuestra capital a Sinope, de hecho."
 me_pontus_kingdom_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_7$#!' $mission_completed_tooltip_2$"
 
 me_pontus_kingdom_8_title:0 "$pontus_kingdom_missions_task_8$"
 me_pontus_kingdom_8_desc:0 "Antes de que salga el sol sobre las aguas del #E Pontus Euxinus#!,, se pueden oír los gritos bulliciosos de los marineros extasiados que se acercan a nuestros puertos. Ahora que su viaje por mar ha terminado, todos esperan con impaciencia la oportunidad de desembarcar y pasear por las calles de nuestras ciudades, con las variadas monedas de plata y bronce que en sus carteras piden gastar en nuestros mercados.\n\nPor suerte para ellos pronto podrán beber y comer alimentos frescos hasta saciarse y tal vez incluso disfrutar de un baño caliente por primera vez en meses. Todo lo que deseen será suyo hasta que se acabe el dinero."
 me_pontus_kingdom_8.a:0 "El comercio realmente ha hecho prosperar a nuestra nación..."
 me_pontus_kingdom_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_8$#!' $mission_completed_tooltip_2$"
 
 me_pontus_kingdom_9_title:0 "$pontus_kingdom_missions_task_9$"
 me_pontus_kingdom_9_desc:0 "Si bien indudablemente podemos defendernos cuando se trata de batallas campales en tierra, ha habido temores de que nuestras extensas costas sean una fuente de debilidad. Sin la protección adecuada, un ejército invasor de piratas o mercenarios podría desembarcar en nuestras costas y causar calamidades a la gente que vive junto al mar.\n\nPero esto ya no existe, gracias a los esfuerzos de [ROOT.GetCountry.GetRuler.GetName] por construir un verdadero muro de fortalezas. A lo largo de nuestras defensas más vulnerables."
 me_pontus_kingdom_9.a:0 "Apartad vuestras flotas, porque en [ROOT.GetCountry.GetName] sólo os espera la muerte."
 me_pontus_kingdom_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_9$#!' $mission_completed_tooltip_2$"
 
 me_pontus_kingdom_10_title:0 "$pontus_kingdom_missions_task_10$"
 me_pontus_kingdom_10_desc:0 "Después de un extenso período de construcción, [ROOT.GetCountry.GetCapital.GetName] ha sido bendecido con una infraestructura completamente nueva que contribuirá aún más a las glorias de nuestra nación. Los ingresos fiscales locales son mejores que nunca y la capital continúa creciendo por sí sola, con miles de personas construyendo sus hogares dentro de las murallas de nuestra ciudad.\n\nY en medio de este creciente caos urbano, el nombre de [ROOT.GetCountry.GetRuler.GetName] es elogiado a diario, porque todo el mundo sabe perfectamente quién ha traído por sí solo nuestro capital hasta este momento."
 me_pontus_kingdom_10.a:0 "¿Puede haber algo que se interponga en el camino de nuestro pueblo? Yo creo que no"
 me_pontus_kingdom_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_10$#!' $mission_completed_tooltip_2$"
 
 me_pontus_kingdom_11_title:0 "$pontus_kingdom_missions_task_11$"
 me_pontus_kingdom_11_desc:0 "Si bien todos asumieron correctamente que [ROOT.GetCountry.GetRuler.GetName] sería un guerrero valiente, pocos podrían haber adivinado que nuestro [ROOT.GetCountry.GetRulerTitle] también sería un maestro constructor, sin embargo, gracias a las sabias inversiones realizadas por [ROOT.GetCountry.GetRuler.GetHerHim], la reputación de [ROOT.GetCountry.GetCapital.GetName] está en su punto más alto. Tiempo alto.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] no ha descuidado a la gente, pero ha considerado oportuno convertir nuestra capital en un digno centro de civilización póntica, uno que rivalice con cualquier ciudad a lo largo del #E Pontus Euxinus#!."
 me_pontus_kingdom_11.a:0 "Yo no quisiera que fuera de otra manera..."
 me_pontus_kingdom_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_11$#!' $mission_completed_tooltip_2$"
 
 me_pontus_kingdom_12_title:0 "$pontus_kingdom_missions_task_12$"
 me_pontus_kingdom_12_desc:0 "En las numerosas academias que se encuentran repartidas por [ROOT.GetCountry.GetName], un pequeño ejército de bibliotecarios atiende los numerosos pergaminos y tratados que han sido compilados por orden de [ROOT.GetCountry.GetRuler.GetName]. Se dice que todas las obras más importantes compuestas por el hombre (historias de naciones extranjeras, investigaciones científicas, relatos épicos de guerras) se pueden encontrar en nuestros centros de aprendizaje, que están abiertos a todos los ciudadanos de nuestra nación. \n\n[ROOT.GetCountry.GetRuler.GetFirstName], un verdadero creyente en el valor de obtener conocimiento, ha asegurado así que nuestra supremacía intelectual permanezca invicta, al igual que nuestros ejércitos."
 me_pontus_kingdom_12.a:0 "Que nuestro pueblo [ROOT.GetCountry.GetAdjective] sea el más sabio que jamás haya existido."
 me_pontus_kingdom_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_12$#!' $mission_completed_tooltip_2$"
 
 me_pontus_kingdom_13_title:0 "$pontus_kingdom_missions_task_13$"
 me_pontus_kingdom_13_desc:0 "Hay malestar en el interior de [ROOT.GetCountry.GetName], porque a nuestros enemigos se les ha dejado muy claro que no nos dormiremos en los laureles; no, nuestras levas tienen hambre de botín y gloria en el campo de batalla, y sólo podemos encontrar lo que nuestros guerreros desean en las tierras indefensas de nuestros vecinos.\n\nLos ejércitos [ROOT.GetCountry.GetAdjective], bajo el liderazgo del temible [ROOT.GetCountry.GetRuler.GetName], se están preparando para lanzar aún más guerras de agresión: los sueños de paz en todo [ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName] se están desvaneciendo rápidamente..."
 me_pontus_kingdom_13.a:0 "¡Vamos a ser tu muerte!"
 me_pontus_kingdom_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_13$#!' $mission_completed_tooltip_2$"
 
 me_pontus_kingdom_14_title:0 "$pontus_kingdom_missions_task_14$"
 me_pontus_kingdom_14_desc:0 "La gloria es nuestra y permanece firmemente en nuestras manos; Hemos expulsado a nuestros enemigos de las tierras que lucharon desesperadamente por conservar, derribando sus fortificaciones y poniendo grilletes de hierro a sus mujeres y niños. Las cenizas de sus ciudades llenan el aire y se pueden escuchar canciones de duelo en todo el campo mientras nuestros soldados avanzan por los territorios ocupados.\n\nDesde nuestra llegada a Paflagonia, ha quedado claro que los pequeños estados del norte de Asia, que no han sido controlados en el vacío dejado por la muerte de Alejandro y las guerras de Diadochi, están débiles y divididos. La nobleza del Ponto ha estado involucrada en disputas conflictivas desde la caída del imperio persa y está disgustada por su liderazgo actual. Ahora que hemos ampliado nuestras fronteras, silenciando a todos los detractores que dudaban de nuestra capacidad de resurgir de las cenizas como el legendario fénix, la nobleza póntica puede aceptar voluntariamente a Mitrídates como su rey, especialmente teniendo en cuenta su noble pedigrí persa."
 me_pontus_kingdom_14.a:0 "La venganza es verdaderamente un plato dulce para servir a tus enemigos."
 me_pontus_kingdom_14.at:0 "Ofreceremos tomar el control de #Y [GetCountry('PON').GetName]#! y absorber su reino. Si rechazan nuestro ultimátum, iremos a la guerra con #Y [GetCountry('PON').GetName]#!."
 me_pontus_kingdom_14.b:0 "Ahora no es el momento de la guerra."
 me_pontus_kingdom_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_14$#!' $mission_completed_tooltip_2$"
 
#AI ONLY
 me_pontus_kingdom_1400_title:0 "Solución Mitridatica"
 me_pontus_kingdom_1400_desc:0 "Los pequeños estados del norte de Asia, que no han sido controlados en el vacío dejado por la muerte de Alejandro y las guerras de los Diadochi, están débiles y divididos. La nobleza del Ponto ha estado involucrada en disputas conflictivas desde la caída del imperio persa y está disgustada por su liderazgo actual. Ahora que los Mitrídates han ampliado sus fronteras y resucitado de las cenizas como el legendario fénix, han lanzado un ultimátum: podemos someternos voluntariamente al gobierno de [GetCountry('MIT').GetRuler.GetPraenomen], un noble persa de impecable pedigrí, o afrontar una guerra de aniquilación."
 me_pontus_kingdom_1400.a:0 "Se justifica un nuevo liderazgo."
 me_pontus_kingdom_1400.b:0 "¡Nunca!"
 #declare war tooltip

 me_pontus_kingdom_1401_title:0 "Trono del Ponto"
 me_pontus_kingdom_1401_desc:0 "Nuestros enviados han regresado de las trastiendas de [GetCountry('PON').GetCapital.GetName], donde han estado exponiendo nuestra propuesta a la nobleza póntica."
 me_pontus_kingdom_1401_desc_1:0 "$me_pontus_kingdom_1401_desc$\nDa la casualidad de que vieron la utilidad de un gobernante dinámico y prestigioso y acordaron poner el Ponto en manos de [ROOT.GetCountry.GetRuler.GetPraenomen] en un golpe incruento..."
 me_pontus_kingdom_1401_desc_2:0 "$me_pontus_kingdom_1401_desc$Ya sean cobardes u orgullosos, se han negado a aceptar nuestros términos razonables, favoreciendo su liderazgo actual por encima de los riesgos asociados con la agitación..."
 me_pontus_kingdom_1401.a:0 "¡Excelente!"
 me_pontus_kingdom_1401.at:0 "¡Anexaremos a @[GetCountry('PON').GetFlag]! [GetCountry('PON').GetName|Y]"
 me_pontus_kingdom_1401.b:0 "Entonces, por las malas."

 me_pontus_kingdom_15_title:0 "$pontus_kingdom_missions_task_15$"
 me_pontus_kingdom_15_desc:0 "¿Quién podría haber previsto los numerosos peligros y trampas que se han tendido ante nuestro pueblo, como trampas tendidas por un cazador que espera pacientemente a su presa?\n\nComo un río serpenteante rebosante de lluvia torrencial, la voluntad de los dioses nos llevó a lo largo de un camino del que no pudimos escapar, y mientras muchos gobernantes más débiles habrían sucumbido a las opresivas mareas y tormentas en el mar, [ROOT.GetCountry.GetRuler.GetName] de alguna manera ha navegado el barco del estado a través de una época problemática.\n\nLos muchos enemigos de [ROOT.GetCountry.GetName] esperan ansiosamente noticias de [ROOT.GetCountry.GetCapital.GetName], temiendo que los ejércitos triunfantes de [ROOT.GetCountry.GetAdjective] pudieran llegar en cualquier momento."
 me_pontus_kingdom_15.a:0 "El camino a seguir sigue siendo siempre ilusorio y, sin embargo, debemos seguir adelante."
 me_pontus_kingdom_15.at:0 "¡Desbloquea el logro #T #E Ktistes#!#! #G#!!\nEl #Y Águila Póntica#!, adornado en oro sobre un estandarte de color púrpura vibrante, se convertirá en el sello de Ponto."
 me_pontus_kingdom_15.b:0 "Incluso en el Ponto, nunca olvidaremos nuestras raíces."
 me_pontus_kingdom_15.bt:0 "¡Desbloquea el logro #T #E Ktistes#!#! #G#!!\nEl #Y Águila Póntica#!, adornado en blanco brillante en nuestro estandarte tradicional, se convertirá en el sello del Ponto."
 me_pontus_kingdom_15.c:0 "'Ponto' implica una ambición demasiado insignificante..."
 me_pontus_kingdom_15.ct:0 "El sello Mitrídates estará estampado en negro y dorado sobre un estandarte de color púrpura vibrante."
 me_pontus_kingdom_15.d:0 "¡Nuestra dinastía es más importante que nuestro asiento!"
 me_pontus_kingdom_15.dt:0 "El sello Mitrídates permanecerá sin cambios."
 me_pontus_kingdom_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_15$#!' $mission_completed_tooltip_2$"
 
 me_pontus_kingdom_16_title:0 "$pontus_kingdom_missions_task_16$"
 me_pontus_kingdom_16_desc:0 "Uno de los signos más visibles de los cambios que se están produciendo en toda la nación de [ROOT.GetCountry.GetName] es el cambio cultural que se está produciendo entre la gente; incluso cosas como las habladas [ROOT.GetCountry.GetAdjective] han cambiado. Los dialectos regionales están adquiriendo una característica propia, y los extranjeros a menudo comentan el sonido musical de nuestra lengua.\n\nHace algunas generaciones, nuestros [ROOT.GetCountry.GetAdjective] parientes eran difícilmente indistinguibles de otros #E Medianos#!, y, sin embargo, poco a poco Grados, la influencia de los medos se está desvaneciendo en nuestras ciudades y asentamientos, siendo reemplazada por las formas superiores de hacer las cosas #E Pónticas#!."
 me_pontus_kingdom_16.a:0 "En verdad, somos un pueblo póntico y debería ser conocido en todas partes."
 me_pontus_kingdom_16.at:0 "Desbloquea la decisión #T #E Acepta los presagios greco-pónticos#!#! #G#!"
 me_pontus_kingdom_16.b:0 "Tonterías, nunca perderemos nuestro carácter persa."
 me_pontus_kingdom_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_16$#!' $mission_completed_tooltip_2$"

 me_pontus_kingdom_17_title:0 "Fuerza con los [ROOT.GetCountry.GetOverlord.GetAdjective]"
 me_pontus_kingdom_17_desc:0 "El futuro de nuestra dinastía está claramente entrelazado con el de los #E [ROOT.GetCountry.GetOverlord.GetAdjective]#!, nuestro poderoso señor supremo. Si bien puede resultar tentador afirmar una mayor independencia, tales acciones sólo provocarían conflictos y sospechas. En lugar de ello, tomemos el camino más sabio, uno que solidifique nuestra posición y eleve nuestra estatura dentro de su ámbito."
 me_pontus_kingdom_17.a:0 "Más bien amigos que enemigos."
 me_pontus_kingdom_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_17$#!' $mission_completed_tooltip_2$"

 me_pontus_kingdom_18_title:0 "Una solicitud de asociación"
 me_pontus_kingdom_18_desc:0 "Los gobernantes de [pontus_ally_country.GetName], miembros de una orgullosa familia persa, han enviado un emisario a nuestra corte con una atrevida petición. Argumentan que sus contribuciones a nuestra causa han demostrado su valor no solo como provincia, sino como un socio valioso.\n\nConceder esta solicitud aseguraría su lealtad y fortalecería sus contribuciones, pero también sentaría un precedente para una mayor autonomía entre nuestros súbditos. ¿Deberíamos reconocerlos como socios y no como simples provincias?"
 me_pontus_kingdom_18.a:0 "Formalicemos una alianza con [pontus_ally_country.GetName]."
 me_pontus_kingdom_18.b:0 "Seguirán siendo una provincia bajo nuestro gobierno."

 me_pontus_kingdom_1801_title:0 "Demostrando nuestro valor"
 me_pontus_kingdom_1801_desc:0 "Ha llegado noticia del tribunal de los #E [pontus_old_overlord.GetAdjective]#! sobre nuestra solicitud. Después de una cuidadosa deliberación, acordaron reconocernos como un socio en lugar de una simple provincia, otorgándonos la autonomía para servir mejor tanto a sus intereses como a los nuestros."
 me_pontus_kingdom_1801.a:0 "Nos sentimos honrados de que confíen en nosotros como socios."
 me_pontus_kingdom_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_18$#!' $mission_completed_tooltip_2$"

 me_pontus_kingdom_1802_title:0 "Demostrando nuestro valor"
 me_pontus_kingdom_1802_desc:0 "El tribunal de los #E [pontus_old_overlord.GetAdjective]#! ha rechazado nuestra solicitud de reconocimiento como socio. Lamentablemente, debemos actuar con cuidado y seguir demostrando nuestro valor, hasta el día en que podamos asegurar el estatus que merecemos."
 me_pontus_kingdom_1802.a:0 "Seguimos siendo leales... por ahora."

 me_pontus_kingdom_19_title:0 "Coronación de [ROOT.GetCountry.GetRuler.GetPraenomen]"
 me_pontus_kingdom_19_desc:0 "Los pasillos de [ROOT.GetCountry.GetCapital.GetName] resuenan con el sonido de la celebración. Hoy marca la culminación de generaciones de ambición y resiliencia para la dinastía [ROOT.GetCountry.GetRuler.GetFamily.GetNameWithNoTooltip]. Príncipe, dinastía, sátrapa, estratega, nuestros predecesores ostentaron muchos títulos, pero nunca \"rey\". La casa de #E Mitrídates#! ha resistido innumerables tormentas y ha aprovechado cada oportunidad para fortalecerse. Nuestro linaje tiene sus raíces en los días del Imperio aqueménida, cuando Gobryas y sus descendientes dominaban como una de las principales familias nobles de Persia. Concedida Mariandynia por el gran rey Darío I, la dinastía luego amplió sus posesiones para incluir Misia bajo Ariobarzanes. Nuestros antepasados ​​sirvieron como sátrapas y estrategos, en los que los reyes confiaban pero siempre vigilantes por su propia supervivencia. \n\nHoy termina esta larga historia de servicio a imperios y gobernantes. Nuestra línea ya no se doblegará ante reyes extranjeros ni luchará por las ambiciones de otros. En el gran palacio de [ROOT.GetCountry.GetCapital.GetName], rodeado de nobles, soldados y emisarios de toda la región, [ROOT.GetCountry.GetRuler.GetPraenomen], proclamándose como el primer rey de un nuevo estado."
 me_pontus_kingdom_19.a:0 "¡Viva [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetPraenomen]!"
 me_pontus_kingdom_19.at:0 "Mantendremos nuestros colores actuales."
 me_pontus_kingdom_19.b:0 "Nuestro nuevo reino necesita una nueva heráldica..."
 me_pontus_kingdom_19.bt:0 "Adoptaremos un color morado."
 me_pontus_kingdom_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_19$#!' $mission_completed_tooltip_2$"

 me_pontus_kingdom_20_title:0 "Conexiones aqueménidas"
 me_pontus_kingdom_20_desc:0 "La Casa de Mitrídates afirma descender de la sangre más noble del Imperio Aqueménida. A través de Gobryas, hijo de Darío I y Artystone, la dinastía tiene sus raíces en la propia línea real. Las generaciones posteriores, incluido Artabazo de Frigia Helespontina, entrelazaron aún más a la familia con las grandes casas satrapales de Asia occidental. Aunque el imperio de Ciro ha caído, su sangre perdura, viva en nuestras venas y recordada por aquellos que aún honran la memoria de Reyes y Conquistadores."
 me_pontus_kingdom_20.a:0 "¡La nuestra es la sangre de Ciro y Darío!"
 me_pontus_kingdom_20.at:0 "El sello #Y #E Mitrídates#!#! estará adornado con los colores tradicionales de los #E #T Aqueménidas#!#!"
 me_pontus_kingdom_20.b:0 "Por la gracia de Ahuramazda soy rey; Ahuramazda me ha concedido el reino."
 me_pontus_kingdom_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_20$#!' $mission_completed_tooltip_2$"

 me_pontus_kingdom_21_title:0 "El loto llameante"
 me_pontus_kingdom_21_desc:0 "El templo estado de Zela fue el hogar de uno de los primeros cultos al fuego en Asia Menor, sus orígenes ligados a la legendaria derrota de los Sakas por Ciro el Grande. Para conmemorar esta victoria, se construyó un gran templo de mármol blanco al estilo corintio, y en su honor se estableció un festival anual llamado Sacaea. Este festival, como lo describió Estrabón, tenía sorprendentes similitudes con los rituales báquicos, donde los hombres, adornados con atuendos escitas, se divertían, bebían y se divertían con las mujeres durante todo el día y la noche. El gobierno de Zela se parecía mucho al de Comana Pontica, con su estructura teocrática centrada en un sacerdocio poderoso. Como era habitual en Anatolia, los sacerdotes del templo ejercían control sobre toda la zona circundante, que estaba poblada por numerosos sacerdotes y sirvientes del templo. El templo no era sólo un lugar de celebración sino también un centro de actividad religiosa vinculada a los panteones de Zoroastro y Anatolia. La mitología local veneraba a la diosa Artemisa Anaitis y al dios Hombres como un dúo de madre e hijo, fusionando las tradiciones persas y de Anatolia."
 me_pontus_kingdom_21.a:0 "Quizás asista al festival Sacaea de este año."
 me_pontus_kingdom_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_21$#!' $mission_completed_tooltip_2$"

 me_pontus_kingdom_22_title:0 "pequeña corinto"
 me_pontus_kingdom_22_desc:0 "El territorio de Comana Pontica se encontraba a lo largo del Iris, lo que le proporciona una importante superficie agrícola y medios de comunicación con Armenia, así como con otras ciudades del Ponto. Aquí se encontraba uno de los templos más importantes de la región y estaba dedicado a la diosa Ma. El culto a Ma continuó luego hasta Comana Capadocia. Los ciudadanos de Comana Pontica adquirieron grandes riquezas de los viñedos y de los comerciantes y sus clientes que llegaban a la ciudad durante la gran fiesta que se celebraba dos veces al año. Estrabón comenta que su multitud de prostitutas dedicadas a la diosa Ma la convertía en cierto modo en una \"Corinto menor\". 6.000 esclavos sagrados conocidos como hierodouloi trabajaban en los campos del territorio del templo y se dedicaban al servicio de Ma. Tenían una posición envidiable, ya que se les concedía la inviolabilidad. El estado del templo del territorio de Comana Pontica se ampliaría considerablemente una vez que quedara bajo el dominio romano."
 me_pontus_kingdom_22.a:0 "Tendré que probar un poco de este vino."
 me_pontus_kingdom_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_22$#!' $mission_completed_tooltip_2$"

### UNUSED EVENTS
 me_pontus_kingdom_2001_title:0 "$pontus_kingdom_missions_task_20$"
 me_pontus_kingdom_2001_desc:0 "La influencia del gobierno aqueménida en Anatolia permaneció mucho después de que el Rey de Reyes fuera depuesto. Bajo su gobierno, las tierras dedicadas a los templos todavía se consideraban en gran medida inviolables, y sus sacerdotes podían ocupar algunas de las posiciones más altas de la sociedad. Esto creó las condiciones para que las propiedades del templo, que podrían volverse muy ricas e influyentes con aldeas, ciudades y campos adjuntos, se convirtieran efectivamente en estados templo.\n\nEl gobierno de estos estados templo se confió a un sumo sacerdote, que disfrutaba de poderes y privilegios extendidos, cuya autoridad es superada solo por el gobernante temporal del área.\n\n Ha llegado el momento de decidir si se permitirá que tal práctica perdure..."
 me_pontus_kingdom_2001.a:0 "Consideraremos el asunto con mucho cuidado."
 me_pontus_kingdom_2001_tooltip:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_20$#!' $mission_completed_tooltip_2$"

 me_pontus_kingdom_2002_title:0 "$pontus_kingdom_missions_task_20$: [GetProvince('(int32)1834').GetName]"
 me_pontus_kingdom_2002_desc:0 "El estado del templo de #E [GetProvince('(int32)1834').GetName]#! fue el hogar de uno de los primeros cultos al fuego en Asia Menor, sus orígenes ligados a la legendaria derrota de los Sakas por Ciro el Grande. Para conmemorar esta victoria, se construyó un gran templo de mármol blanco al estilo corintio, y en su honor se estableció un festival anual llamado Sacaea. Este festival, como lo describió Estrabón, tenía sorprendentes similitudes con los rituales báquicos, donde los hombres, adornados con atuendos escitas, se divertían, bebían y se divertían con las mujeres durante todo el día y la noche. El gobierno de Zela se parece mucho al de Comana Pontica, con su estructura teocrática centrada en torno a un poderoso sacerdocio. Como es habitual en Anatolia, los sacerdotes del templo ejercían el control sobre toda la zona circundante, poblada por numerosos sacerdotes y sirvientes del templo. #E Zela#! no es solo un lugar de celebración sino también un centro de actividad religiosa vinculada a los panteones de Zoroastro y Anatolia. La mitología local veneraba a la diosa #E Artemisa-Anaitis#! y al dios #E Hombres#! como un dúo de madre e hijo, fusionando las tradiciones persas y de Anatolia."
 me_pontus_kingdom_2002.a:0 "Los hombres no deben interferir con los emisarios de los dioses."
 me_pontus_kingdom_2002.at:0 "#E Zela#! se convertirá en nuestro #Y Estado Templo#!"
 me_pontus_kingdom_2002.b:0 "Quizás los dioses puedan gobernar mejor que los hombres."
 me_pontus_kingdom_2002.bt:0 "#E Zela#! recibirá tierras en #E Iris Superioris#! y se convertirá en nuestro #Y Estado Templo#!"
 me_pontus_kingdom_2002.c:0 "¡Sus tierras serán ocupadas!"

 me_pontus_kingdom_2003_title:0 "$pontus_kingdom_missions_task_20$: [GetProvince('(int32)1790').GetName]"
 me_pontus_kingdom_2003_desc:0 "El territorio de #E [GetProvince('(int32)1790').GetName]#! se extiende a lo largo del Iris, lo que le proporciona una importante superficie agrícola y medios de comunicación con Armenia y otras ciudades del Ponto. Aquí se encuentra uno de los templos más importantes de la región y está dedicado a la diosa Ma. El culto a Ma continuó luego hasta Comana Capadocia. Los ciudadanos de Comana Pontica adquirieron grandes riquezas de los viñedos y de los comerciantes y sus clientes que llegaban a la ciudad durante la gran fiesta que se celebra dos veces al año. Estrabón comenta que su multitud de prostitutas dedicadas a la diosa Ma la convertía en cierto modo en una \"Corinto menor\". 6.000 esclavos sagrados conocidos como hierodouloi trabajaban en los campos del territorio del templo y se dedicaban al servicio de Ma. Tienen una posición envidiable, al concederse la inviolabilidad."
 me_pontus_kingdom_2003.a:0 "Los hombres no deben interferir con los emisarios de los dioses."
 me_pontus_kingdom_2003.at:0 "#E Comana Pontica#! se convertirá en nuestro #Y Estado Templo#!"
 me_pontus_kingdom_2003.b:0 "Quizás los dioses puedan gobernar mejor que los hombres."
 me_pontus_kingdom_2003.bt:0 "#E Comana Pontica#! recibirá tierras en #E Iris Superioris#! y se convertirá en nuestro #Y Estado Templo#!"
 me_pontus_kingdom_2003.c:0 "¡Sus tierras serán ocupadas!"
