l_spanish:

 pontus_kingdom_missions:0 "Reino del Ponto"
 pontus_kingdom_missions_DESCRIPTION:0 "Nuestra nación se encuentra realmente en un momento de gran peligro, porque aquellos que dicen ser nuestros amigos miran abiertamente nuestras posesiones con avidez, y nuestras fronteras se ven presionadas por todos lados por las levas de generales ambiciosos a quienes nada les encantaría más que apagar la luz parpadeante de nuestra orgullosa civilización.\n\nAnte este peligro, nuestros gobernantes no han cedido ante la tremenda presión, sino que han optado por luchar contra lo que parece ser una marea inevitable."
 pontus_kingdom_missions_CRITERIA_DESCRIPTION:0 "Esta misión se completará cuando [ROOT.GetCountry.GetName] haya asegurado su posición tras las caóticas secuelas de las #E Guerras de los Diadochi#!."
 pontus_kingdom_missions_BUTTON_TOOLTIP:0 "El camino a seguir será difícil y, sin embargo, nadie podrá interponerse en nuestro camino si nos mantenemos firmes..."
 pontus_kingdom_missions_BUTTON_DETAILS: ""

 #Missions
 
 pontus_kingdom_missions_task_1:0 "La amenaza antigónida"
 pontus_kingdom_missions_task_1_DESC:0 "La fortaleza de Kimista se encuentra ligeramente vigilada, enclavada en el borde de Paflagonia. Su posición estratégica lo convierte en un objetivo crucial para los planes de Mitrídates de restaurar la gloria de su casa. Si podemos apoderarnos de esta fortaleza, se abrirá ante nosotros un camino de conquista hacia el este, que ofrecerá la oportunidad de ampliar nuestra influencia y asegurar un punto de apoyo en la región. Un ataque audaz, dirigido por el propio Mitrídates, debería ser suficiente para abrumar las escasas defensas.\n\n\n\n\n\n\n\n\n\n@persia_mil2!."
 pontus_kingdom_missions_task_1_allow_tt:0 "Mitrídates II ha sido #R ejecutado#!"

 pontus_kingdom_missions_task_2:0 "El ataque de los antigónidos"
 pontus_kingdom_missions_task_2_DESC:0  ""
#declare war on Gandara owner

 
 pontus_kingdom_missions_task_3:0 "La venganza de los medianos"
 pontus_kingdom_missions_task_3_DESC:0 ""

 pontus_kingdom_missions_task_4:0 "Una nueva esperanza"
 pontus_kingdom_missions_task_4_DESC:0 "Mientras el mundo que nos rodea estalla en llamas y el futuro de nuestro pueblo parece estar siempre en duda, no sucumbiremos al miedo: la esperanza de nuestra nación reside en nuestra fuerza de las armas.\n\n\n\n\n\n \n\n\n\n@persia_mil1!"
 
 pontus_kingdom_missions_task_5:0 "Un nuevo camino"
 pontus_kingdom_missions_task_5_DESC:0 "¿Es nuestra situación actual el resultado de que los dioses nos abandonaron? Nuestro pueblo ha sido fiel y, sin embargo, no podemos dejar de notar que nuestra piedad no ha sido recompensada. ¿Quizás deberíamos elegir un Panteón digno de [ROOT.GetCountry.GetAdjective] adoración? \n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 
 pontus_kingdom_missions_task_6:0 "Los pónticos despiertan"
 pontus_kingdom_missions_task_6_DESC:0 "No nos quedemos de brazos cruzados viendo cómo nuestros estados vecinos luchan entre sí por la supremacía en esta era de caos; Nosotros también tenemos derechos contra nuestros enemigos y no descansaremos hasta haber forjado un reino digno. \n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 pontus_kingdom_missions_task_6_tt:0 "Obtenga reclamaciones en las áreas de [GetProvince('(int32)198').GetArea.GetName|Y] y [GetProvince('(int32)1812').GetArea.GetName|Y]"

 pontus_kingdom_missions_task_7:0 "Joya del Euxino"
 pontus_kingdom_missions_task_7_DESC:0 "Considere la ciudad de [GetProvince('(int32)1812').GetName], con su concurrido puerto y sus imponentes vistas del #E Pontus Euxinus#!;; de hecho, recuerda a [ROOT.GetCountry.GetRuler.GetName] de [GetProvince('(int32)245').GetName]. ¿Deberíamos trasladar nuestra capital a la costa norte de Anatolia o quedarnos donde estamos? Es necesario tomar una decisión importante. \n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 
 pontus_kingdom_missions_task_8:0 "El regreso del comercio mitridatico"
 pontus_kingdom_missions_task_8_DESC:0 "Gracias a la cantidad de puertos que tenemos en nuestras costas del norte, los impuestos y aranceles que estamos recaudando han crecido exponencialmente. \n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 
 pontus_kingdom_missions_task_9:0 "Proteger las costas"
 pontus_kingdom_missions_task_9_DESC:0 "Se ha decidido que debemos proteger a nuestros parientes contra piratas errantes y almirantes ambiciosos mediante la construcción de una red de fortificaciones a lo largo de nuestra costa. Estas ciudadelas serán la primera línea de defensa contra cualquiera que nos prive de nuestras posesiones.\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 
 pontus_kingdom_missions_task_10:0 "Una capital adecuada"
 pontus_kingdom_missions_task_10_DESC:0 "Ahora que tenemos un breve momento de respiro para recuperar el aliento y evaluar lo que hemos logrado recientemente, dirijamos nuestra atención a embellecer nuestra capital de [ROOT.GetCountry.GetCapital.GetName].\n\nNo podemos permitir que la Casa [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] viva en un estado de humildad, ¡pero erigirá una capital adecuada que refleje su gloria eterna!\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 
 pontus_kingdom_missions_task_11:0 "Inversiones sabias"
 pontus_kingdom_missions_task_11_DESC:0 "Gracias a la perspicacia comercial de [ROOT.GetCountry.GetRuler.GetName], nuestra capital de [ROOT.GetCountry.GetCapital.GetName] está ganando rápidamente la reputación de ser un centro de la civilización póntica. ¿Qué mayor elogio podría haber para nuestro [ROOT.GetCountry.GetRulerTitle]? \n\n\n\n\n\n\n\n\n\n@italic_mil4!"
 
 pontus_kingdom_missions_task_12:0 "Grandes obras del Ponto"
 pontus_kingdom_missions_task_12_DESC:0 "Eruditos viajeros y filósofos de todo el mundo zarparon hacia los puertos de [ROOT.GetCountry.GetName], con la esperanza de asistir a una de las conferencias que se imparten en las numerosas Academias de nuestra nación. \n\n\n\n\n\n\n\n\n\n@india_mil20!"
 
 pontus_kingdom_missions_task_13:0 "El ataque de los mitridaticos"
 pontus_kingdom_missions_task_13_DESC:0 "Los vientos favorables de la guerra soplan a nuestro favor, hinchando nuestras velas e impulsando nuestras fuerzas hacia mayores victorias; en adelante, gravámenes de [ROOT.GetCountry.GetName]! ¡El mundo es nuestro!\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 pontus_kingdom_missions_task_13_tt:0 "Obtenga reclamaciones en las áreas de [GetProvince('(int32)1787').GetArea.GetName|Y] y [GetProvince('(int32)1791').GetArea.GetName|Y]."
 
 pontus_kingdom_missions_task_14:0 "La venganza de los pónticos"
 pontus_kingdom_missions_task_14_DESC:0 "Desde nuestra llegada a Paflagonia, ha quedado claro que los pequeños estados del norte de Asia, que no han sido controlados en el vacío dejado por la muerte de Alejandro y las guerras de los Diádocos, están débiles y divididos. La nobleza del Ponto ha estado involucrada en disputas conflictivas desde la caída del imperio persa y está disgustada por su liderazgo actual. Ahora que hemos ampliado nuestras fronteras, silenciando a todos los detractores que dudaban de nuestra capacidad de resurgir de las cenizas como el legendario fénix, la nobleza póntica puede aceptar voluntariamente a Mitrídates como su rey, especialmente teniendo en cuenta su noble pedigrí persa. \n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 pontus_kingdom_missions_task_14_tt:0 "Ofreceremos tomar el control de #Y [GetCountry('PON').GetName]#! y absorber su reino. Si rechazan nuestro ultimátum, iremos a la guerra con #Y [GetCountry('PON').GetName]#!."

 pontus_kingdom_missions_task_15:0 "El camino a seguir"
 pontus_kingdom_missions_task_15_DESC:0 "Dicen los sabios que nadie puede conocer la voluntad caprichosa de los dioses y lo que nos tienen reservado. Si bien esta sabia observación puede ser cierta, nuestro pueblo confía en que el camino a seguir será próspero...\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 pontus_kingdom_missions_task_15_allow_tt:0 "#E #Y Pontus#!#! debe #R no#! existir."


 pontus_kingdom_missions_task_16:0 "Los pónticos contraatacan"
 pontus_kingdom_missions_task_16_DESC:0 "A lo largo de [ROOT.GetCountry.GetName] se desarrollan conversaciones incómodas en las casas de las élites; ¿Somos realmente un pueblo #Y Mediano#!? Quizás abrazar una nueva identidad sea el camino a seguir... anunciar a todos los que nos escuchen que nos consideramos #Y Pontic#!.\n\n\n\n\n\n\n\n\n\n @persia_mil4!"

 pontus_kingdom_missions_task_17:0 "Fuerza con los macedonios"
 pontus_kingdom_missions_task_17_DESC:0 "El futuro de nuestra dinastía está claramente entrelazado con el de los #E [ROOT.GetCountry.GetOverlord.GetAdjective]#!, nuestro poderoso señor supremo. Si bien puede resultar tentador afirmar una mayor independencia, tales acciones sólo provocarían conflictos y sospechas. En lugar de ello, tomemos el camino más sabio, uno que solidifique nuestra posición y eleve nuestra estatura dentro de su ámbito."

 pontus_kingdom_missions_task_18:0 "Demostrando nuestro valor"
 pontus_kingdom_missions_task_18_DESC:0 "Ahora es el momento de demostrar el valor de nuestra dinastía a los #E [ROOT.GetCountry.GetOverlord.GetAdjective]#! y mostrarles que [ROOT.GetCountry.GetName] tiene más que ofrecer como un aliado indispensable que como uno entre innumerables súbditos."

 pontus_kingdom_missions_task_19:0 "Un reino mitridatico"
 pontus_kingdom_missions_task_19_DESC:0 "Príncipe, dinastía, sátrapa, estratega, nuestros predecesores ostentaron muchos títulos, pero nunca \"rey\". La casa de #E Mitrídates#! ha resistido innumerables tormentas y ha aprovechado cada oportunidad para fortalecerse. Nuestro linaje tiene sus raíces en los días del Imperio aqueménida, cuando Gobryas y sus descendientes dominaban como una de las principales familias nobles de Persia. Concedida Mariandynia por el gran rey Darío I, la dinastía luego amplió sus posesiones para incluir Misia bajo Ariobarzanes. Nuestros antepasados ​​sirvieron como sátrapas y estrategos, en los que los reyes confiaban pero siempre vigilantes por su propia supervivencia. Pronto, esta larga historia de servicio a imperios y gobernantes llegará a su fin. Nuestra línea ya no se doblegará ante reyes extranjeros ni luchará por las ambiciones de otros. No, reinaremos como reyes por derecho propio.\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"

 pontus_kingdom_missions_task_20:0 "Conexiones aqueménidas"
 pontus_kingdom_missions_task_20_DESC:0 "La Casa de Mitrídates afirma descender de la sangre más noble del Imperio Aqueménida. A través de Gobryas, hijo de Darío I y Artystone, la dinastía tiene sus raíces en la propia línea real. Las generaciones posteriores, incluido Artabazo de Frigia Helespontina, entrelazaron aún más a la familia con las grandes casas satrapales de Asia occidental. Aunque el imperio de Ciro ha caído, su sangre perdura, viva en nuestras venas y recordada por aquellos que aún honran la memoria de Reyes y Conquistadores.\n\n\n\n\n\n\n\n\n\n@persia_mil5!"

 pontus_kingdom_missions_task_21:0 "El loto llameante"
 pontus_kingdom_missions_task_21_DESC:0 "El templo estado de Zela fue el hogar de uno de los primeros cultos al fuego en Asia Menor, sus orígenes ligados a la legendaria derrota de los Sakas por Ciro el Grande. Para conmemorar esta victoria, se construyó un gran templo de mármol blanco al estilo corintio, y en su honor se estableció un festival anual llamado Sacaea. Este festival, como lo describió Estrabón, tenía sorprendentes similitudes con los rituales báquicos, donde los hombres, adornados con atuendos escitas, se divertían, bebían y se divertían con las mujeres durante todo el día y la noche. El gobierno de Zela se parecía mucho al de Comana Pontica, con su estructura teocrática centrada en un sacerdocio poderoso. Como era habitual en Anatolia, los sacerdotes del templo ejercían control sobre toda la zona circundante, que estaba poblada por numerosos sacerdotes y sirvientes del templo. El templo no era sólo un lugar de celebración sino también un centro de actividad religiosa vinculada a los panteones de Zoroastro y Anatolia. La mitología local veneraba a la diosa Artemisa Anaitis y al dios Hombres como un dúo de madre e hijo, fusionando las tradiciones persas y de Anatolia."

 pontus_kingdom_missions_task_22:0 "pequeña corinto"
 pontus_kingdom_missions_task_22_DESC:0 "El territorio de Comana Pontica se encontraba a lo largo del Iris, lo que le proporciona una importante superficie agrícola y medios de comunicación con Armenia, así como con otras ciudades del Ponto. Aquí se encontraba uno de los templos más importantes de la región y estaba dedicado a la diosa Ma. El culto a Ma continuó luego hasta Comana Capadocia. Finalmente, Sila, quien afirmó que en un sueño mamá le había dado un rayo para destruir a sus enemigos, introduciría su culto en Roma. Los ciudadanos de Comana Pontica adquirieron grandes riquezas de los viñedos y de los comerciantes y sus clientes que llegaban a la ciudad durante la gran fiesta que se celebraba dos veces al año. Estrabón comenta que su multitud de prostitutas dedicadas a la diosa Ma la convertía en cierto modo en una \"Corinto menor\". 6.000 esclavos sagrados conocidos como hierodouloi trabajaban en los campos del territorio del templo y se dedicaban al servicio de Ma. Tenían una posición envidiable, ya que se les concedía la inviolabilidad. El estado del templo del territorio de Comana Pontica se ampliaría considerablemente una vez que quedara bajo el dominio romano."



###New Task for Temple States
#pontus_kingdom_missions_task_20:0 "Pontic Temple States"
#pontus_kingdom_missions_task_20_DESC:0 "The realm of Pontus has long been home to temple states, small theocracies wherein a priest-king ruled over a secular society typically consisting of extensive estates worked by a large number of sacred slaves. These cults, ran out of grand temples, also administered fields and small towns within their surrounding area. Supporting these temple states can revive immigration to the Pontic inland as well as grant the throne divine favor.\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
#pontus_kingdom_missions_task_20_finish_tt:0 "The future of #E Zela#! and #E Comana Pontica#! wil be decided"




