 hostage_heir_modifier:0 "Heredero rehén"

 pontus_startup.3.t:0 "Una oferta menos atractiva"
 pontus_startup.3.desc:0 "Los enviados [GetCountry('PRY').GetAdjective] han llegado, trayendo un mensaje de [GetCharacter('(int32)37').GetName] envuelto en retórica cortés, pero su verdadera intención es inconfundible. Los rumores sobre la audiencia de [GetCharacter('(int32)52').GetPraenomen] con los enviados de los enviados #E Kassandros#! y #E Lysimachos#! han llegado a oídos de [GetCharacter('(int32)37').GetPraenomen]. Solicitan la presencia de Mitrídates Ktistes en el juzgado de [GetCharacter('(int32)37').GetName]. Aunque se presenta como un gesto de amistad y alianza, es evidente que [GetCharacter('(int32)37').GetPraenomen] busca asegurar a #E Ktistes#! como rehén para garantizar la lealtad de [GetCharacter('(int32)52').GetName].\n\nLa solicitud coloca a [GetCharacter('(int32)52').GetName] en una posición precaria. Dado que la edad pesa mucho, la cuestión de la sucesión es de suma importancia. #E Ktistes#! es sobrino y heredero de [GetCharacter('(int32)52').GetPraenomen]. No está claro si [GetCharacter('(int32)37').GetPraenomen] permitiría a Mitrídates Ktistes heredar las tierras de su tío en caso de que éste falleciera mientras #E Ktistes#! estuviera ausente. Sin embargo, la negativa puede provocar la ira de [GetCharacter('(int32)37').GetPraenomen], poniendo en peligro tanto a la dinastía como a su pueblo. No hay duda de que la dinastía Mitrídates debe perdurar a cualquier precio, pero ¿cómo?"
 pontus_startup.3.desc_1:0 "Los enviados [GetCountry('PRY').GetAdjective] han llegado, trayendo un mensaje de [GetCharacter('(int32)37').GetName] envuelto en retórica cortés, pero su verdadera intención es inconfundible. Los rumores sobre la audiencia de [GetCharacter('(int32)52').GetPraenomen] con los enviados de los enviados #E Kassandros#! y #E Lysimachos#! han llegado a oídos de [GetCharacter('(int32)37').GetPraenomen]. Solicitan la presencia de Mitrídates Ktistes en el juzgado de [GetCharacter('(int32)37').GetName]. Aunque enmarcado como un gesto de amistad y alianza, es evidente que [GetCharacter('(int32)37').GetPraenomen] busca asegurar a #E Ktistes#! como rehén para garantizar la lealtad de [GetCharacter('(int32)52').GetName].\n\nSin embargo, como señal de buena fe, [GetCharacter('(int32)52').GetPraenomen] será nombrado Sátrapa de #E Helespontino. Frigia#! y se espera que establezca su residencia en Daskyleion. La solicitud coloca a [GetCharacter('(int32)52').GetName] en una situación precaria. Dado que la edad pesa mucho, la cuestión de la sucesión es de suma importancia. #E Ktistes#! es sobrino y heredero de [GetCharacter('(int32)52').GetPraenomen]. No está claro si [GetCharacter('(int32)37').GetPraenomen] permitiría a Mitrídates Ktistes heredar las tierras de su tío en caso de que éste falleciera mientras #E Ktistes#! estuviera ausente. Sin embargo, la negativa puede provocar la ira de [GetCharacter('(int32)37').GetPraenomen], poniendo en peligro tanto a la dinastía como a su pueblo. No hay duda de que la dinastía Mitrídates debe perdurar a cualquier precio, pero ¿cómo?"
 pontus_startup.3.a:0 "Una oferta muy bienvenida"
 pontus_startup.3.at:0 "#E #R (Ahistórico)#!#!\n$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_1$#!' estará #R no disponible#! hasta que concluya la #E Cuarta Guerra de los Diadochi#!"
 pontus_startup.3.a1t:0 "#E Frigia helespontina#! ganará todas las tierras antigónidas en las áreas de #Y $mysia_abrettene_area$#!, #Y $mysia_area$#!, así como en la región de #Y $bithynia_region$#!"
 pontus_startup.3.b:0 "Envía a Mitrídates a la corte de [GetCharacter('(int32)37').GetPraenomen]."
 pontus_startup.3.bt:0 "#E #R (Ahistórico)#!#!\n$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_1$#!' estará #R no disponible#! hasta que concluya la #E Cuarta Guerra de los Diadochi#!"
 pontus_startup.3.c:0 "Ktistes estará a salvo en Mariandynia."
 pontus_startup.3.ct:0 "#E #G (Histórico)#!#!\n#R [GetCharacter('(int32)52').GetName] puede no ser tan seguro#!\n$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_1$#!' será #G disponible#! en las próximas semanas"
# pontus_startup.3.a:0 "Send Mithridates to [GetCharacter('(int32)37').GetPraenomen]'s court."
# pontus_startup.3.b:0 "Ktistes will be safe in Mariandynia."
# pontus_startup.3.bt:0 "#R [GetCharacter('(int32)52').GetName] may not be so safe#"

 pontus_startup.4.t:0 "[GetCharacter('(int32)52').GetPraenomen] ¿Traición?"
 pontus_startup.4.desc:0 "[GetCharacter('(int32)52').GetPraenomen] ha enviado una carta informando a [GetCountry('PRY').GetRuler.GetPraenomen] que recibió enviados de #E Kassandros#! y #E Lysimachos#!, pero solo es culpable de ser un anfitrión hospitalario, no un revolucionario. Si bien se desconoce de qué hablaron, sin duda se hicieron propuestas para asegurar su lealtad. Ante la inminente amenaza de rebelión de [GetCharacter('(int32)52').GetPraenomen], [GetCountry('PRY').GetRuler.GetPraenomen] ha ideado un golpe maestro diplomático. Se enviará un mensaje a [GetCharacter('(int32)52').GetPraenomen], nombrándolo sátrapa de #E Frigia helespontina#!, un título vinculado a la sede de Daskyleion. Esta provincia, una vez gobernada por su pariente, el gran Artabazos, no ha tenido un sátrapa en quince años, desde que Antígono se apoderó de ella. Aunque el título haría poco para cambiar la posición real de [GetCharacter('(int32)52').GetName], conferiría una legitimidad muy necesaria a la dinastía Mitrídates y proporcionaría unidad política a sus posesiones en Misia y Mariandynia. Por supuesto, dependerá de que nos dé el honor de recibir a su sobrino, [GetCharacter('(int32)228').GetName], en la corte de Antigonid.\n\nDespués de la muerte de Euemene, [GetCharacter('(int32)228').GetName], habiéndose distinguido en el campo de batalla, se ganó el favor [GetCharacter('(int32)37').GetPraenomen] y se hizo amigo cercano del hijo de [GetCharacter('(int32)37').GetPraenomen]. [GetCharacter('(int32)38').GetPraenomen].\n\nSin embargo, [GetCharacter('(int32)37').GetPraenomen] pronto empezó a sospechar de #E Ktistes#!. Según la leyenda, [GetCharacter('(int32)37').GetPraenomen] soñó que caminaba por un campo grande y hermoso y lo sembraba con polvo de oro, pero Mitrídates recogió la cosecha y se la llevó a la región costera del Mar Negro. [GetCharacter('(int32)37').GetPraenomen] decidió matarlo y le contó a [GetCharacter('(int32)38').GetPraenomen] sus planes, pero le hizo jurar que guardaría silencio. Pero [GetCharacter('(int32)38').GetPraenomen] no permitiría que su amigo corriera ese destino. Durante el asedio de Tiro, los dos salieron a caminar solos a la orilla del mar, y [GetCharacter('(int32)38').GetPraenomen] usó su lanza para escribir 'Huye, Mitrídates' en la arena, manteniendo así el voto de silencio hecho a su padre. Mitrídates entendió e inmediatamente abandonó la corte de [GetCharacter('(int32)37').GetPraenomen] por la noche con un puñado de compañeros. Si bien se desconoce su paradero exacto, se rumorea que #E Ktistes#! se encuentra en una residencia mariandina de su tío, a lo largo de la frontera con #E Paflagonia#!.\n\nEnmarcada como un gesto de alianza y buena voluntad, la propuesta establece que [GetCharacter('(int32)37').GetPraenomen] está dispuesto a dejar lo pasado en el pasado y [GetCharacter('(int32)228').GetName] será tratado como un invitado de honor. Con su heredero como un verdadero rehén, el margen de maniobra de [GetCharacter('(int32)52').GetPraenomen] disminuirá considerablemente."
 pontus_startup.4.a:0 "A veces me asusta mi propio genio..."
 pontus_startup.4.at:0 "#R [GetCharacter('(int32)52').GetName] se ejecutará si rechaza nuestra oferta. #!\nSi acepta, sucederá lo siguiente:"
 pontus_startup.4.at2:0 "#E Frigia helespontina#! ganará todas las tierras antigónidas en las áreas de #Y $mysia_abrettene_area$#!, #Y $mysia_area$#!, así como en la región de #Y $bithynia_region$#!"
 pontus_startup.4.b:0 "La oferta es una artimaña; La traición de [GetCharacter('(int32)52').GetPraenomen] no quedará impune."
 pontus_startup.4.bt:0 "#R [GetCharacter('(int32)52').GetName] será pacificado, de una forma u otra...#"

 pontus_startup.5.t:0 "El fin de [GetCharacter('(int32)52').GetPraenomen]"
 pontus_startup.5.desc:0 "La negativa de [GetCharacter('(int32)52').GetPraenomen] a cumplir con nuestras demandas ha sellado su destino. Si bien el enviado enviado a Kios informó sobre los intentos de [GetCharacter('(int32)52').GetPraenomen] de afirmar su inocencia, su verdadera lealtad quedó clara a través de su desafío. Nuestra embajada, poco antes de partir de Kios, consideró sus acciones traición y llevó a cabo la ejecución de [GetCharacter('(int32)52').GetPraenomen] en el acto. El control de la dinastía Mitrídates sobre Misia se hace añicos y, con él, su influencia en la región.\n\nLa caída de una casa tan ilustre ha tenido consecuencias predecibles. Los Abretti, un pueblo ferozmente independiente de las montañas de Misia, han aprovechado el caos para reafirmar su autonomía, negándose abiertamente a reconocer nuestro gobierno. Mientras tanto, las ciudades griegas de Kios y Mylrea, que quedaron sin líderes e inciertas, ahora esperan de nosotros su destino. Hemos prometido autonomía a los griegos dentro de nuestro reino, una política que nos ha ganado aliados en el pasado. Sin embargo, otorgar total independencia a estas ciudades podría debilitar nuestro control sobre la Propontis. Quizás pretendemos inscribirlos en el Koinon de Atenea Ilias, convirtiéndolo en una liga tanto de Troad como de Propontis."
 pontus_startup.5.a:0 "Kios puede gobernarse a sí mismo."
 pontus_startup.5.at:0 "#Y Kios#! se convierte en [THIS.GetCountry.GetAdjective] #Y Feudatorio#! \n#E Mylrea#! pasa a ser propiedad de #Y Kios#!"
 pontus_startup.5.b:0 "Inscribe a Kios y Mylrea en el Koinon de Atenea Ilias."
 pontus_startup.5.c:0 "Las ciudades son nuestras ahora; no necesitan autonomía."

 pontus_startup.6.t:0 "Muerte de [GetCharacter('(int32)52').GetPraenomen]"
 pontus_startup.6.desc:0 "¡[GetCharacter('(int32)52').GetNameWithNoTooltip] ha sido asesinado por las fuerzas de [GetCharacter('(int32)37').GetNameWithNoTooltip] bajo cargos de presunta traición mientras alojaba a los enviados en #E Kios#!! Esta impactante traición ha sumido en el caos a Misia y a la dinastía Mitrídates. La historia de la muerte de [GetCharacter('(int32)52').GetNameWithNoTooltip] ha causado gran consternación en toda nuestra nación, mientras nuestro pueblo llora amargamente por esta traición. Pero no podemos darnos el lujo de lamentar la pérdida en este momento, no sea que los cuervos nos corten la cabeza en una pica Antigónida.\n\nA pesar de este golpe devastador, todavía hay esperanza para nuestra casa. Mitrídates Ktistes, sobrino de [GetCharacter('(int32)52').GetNameWithNoTooltip], lleva algún tiempo en Mariandynia, trazando cuidadosamente planes para el resurgimiento de su casa. Con la muerte de su tío, ha dado un paso al frente como líder de la familia, llamando a todos los que permanecen leales a reunirse en Mariandynia. Nobles, guerreros y aliados han comenzado a responder a su llamado, prometiendo sus espadas y riquezas a la causa de restaurar la dinastía.\n\nDesde su residencia cerca de la frontera de Paflagonia, Mitrídates habla de una visión audaz: reconstruir la fuerza de los Mitrídates y reclamar su gloria perdida. La fortaleza de [GetProvince('(int32)213').GetNameWithNoTooltip], situada justo dentro del territorio de los Paflagones, ofrece una plataforma de lanzamiento para las conquistas hacia el este... si tan solo pudiéramos apoderarnos de ella."
 pontus_startup.6.a:0 "¡A Mariandinia! La dinastía Mitrídates resurgirá."
 pontus_startup.6.at:0 "$mission_completed_tooltip_1$ '#Y $pontus_kingdom_missions_task_1$#!' ya está #G disponible#!\nLas tierras de Mitrídates en #E Misia#! han sido abandonadas"
 pontus_kimista_move_effect_tt:0 "Los leales a Mitrídates han huido de Misia a #E Mariandynia#! para escapar de la ira de [GetCharacter('(int32)37').GetName]"

 pontus_startup.7.t:0 "La expansión del Koinon"
 pontus_startup.7.desc:0 "[GetCharacter('(int32)37').GetPraenomen] ha decretado que las ciudades de Kios y Mylrea, que quedaron a la deriva tras la caída de la dinastía Mitrídates, serán inscritas en el Koinon de Atenea Ilias. Lo que una vez fue una legua de Tróade ahora se extenderá hasta la Propóntida. Si bien este crecimiento fortalece el Koinon, también trae consigo desafíos. Mantener la unidad y la cooperación de estas ciudades distantes con nuestro corazón en la Tróade requerirá cuidado y previsión. Quizás algún día Calcedonia, Bizancio, Kyzikos y todas las demás ciudades de la Propontis se unan a nuestro Koinon..."
 pontus_startup.7.a:0 "Nuestro koinon prosperará en unidad."

 pontus_startup.8.t:0 "El asunto de Mariandynia"
 pontus_startup.8.desc:0 "Mucho ha cambiado en los últimos años. La antigua base de poder de la dinastía Mitrídates en #E Mariandynia#! se ha marchitado, sus ciudades han quedado en silencio y sus castros gobernados por jefes tribales que ya no prestan atención a nuestras convocatorias. La muerte de [former_ruler.GetPraenomen] ha dejado un vacío que aún tenemos que llenar. Las tribus de la región se han vuelto más autónomas y nuestro control es más débil de lo que ha sido durante generaciones.\n\nAhora, voces en la corte hablan de abandonar por completo el gobierno directo. Dejemos que los jefes mariandinianos se gobiernen a sí mismos, dicen, siempre que envíen tributos y honren a nuestra dinastía de nombre. Pero otros, aún más audaces, hablan de oportunidades.\n\nUn descendiente de nuestra casa, [mariandynia_heir.GetPraenomen] de una rama cadete, podría ser enviado al oeste para reclamar nuestro asiento ancestral. [mariandynia_heir.GetPraenomen] busca mantener Mariandynia como un feudo personal, uniendo la región una vez más a la dinastía Mitrídates. Sin embargo, para lograrlo se necesitará oro, espadas y astucia. Las tribus no se doblegarán fácilmente, y el éxito de [mariandynia_heir.GetPraenomen] puede que algún día le convierta en rival del propio Ktistes...\n\nAun así, hay un tercer camino. Los bitinios, cada vez más poderosos y ávidos de influencia a lo largo del Mar Negro, han expresado interés en Mariandynia. Cederles la región podría asegurar una alianza y librarnos de una carga que no estamos dispuestos a recuperar por la fuerza."
pontus_startup.8.a:0 "El tributo es todo lo que necesitamos."
pontus_startup.8.mariandynia_tribal:0 "#E Mariandynia#! se convierte en #E [THIS.GetCountry.GetAdjective]#! #Y Vasallo tribal#!"
pontus_startup.8.gordioukome_tribal:0 "#E Gordioukome#! se convierte en #E [THIS.GetCountry.GetAdjective]#! #Y Vasallo tribal#!"
pontus_startup.8.b:0 "Envía [mariandynia_heir.GetPraenomen] para restablecer nuestra casa."
pontus_startup.8.ct:0 "Nuestras tierras en Mariandynia y Sangarios serán cedidas a #Y Mariandynia#!\n#E #Y Mariandynia#!#! se convierte en #E [THIS.GetCountry.GetAdjective]#! #Y Satrapía#!"
pontus_startup.8.c:0 "Mariandynia será cedida a los bitinios como gesto de amistad."
pontus_startup.8.dt:0 "Nuestras tierras en Mariandynia y Sangarios serán cedidas a #Y Bitinia#!"
pontus_startup.8.d:0 "No cederemos ni un centímetro."

