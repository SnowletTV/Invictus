 01_cde_pontus_missions_01_task_24:0 "Conquista las costas"
 01_cde_pontus_missions_01_task_24_DESC:0 "¿Cómo podemos reclamar hegemonía sobre el Ponto Euxinus mientras las costas del sur están pobladas por las ciudadelas y fortalezas de nuestros enemigos? ¡Envía tropas para destruir a cualquiera que resista nuestro poder [ROOT.GetCountry.GetAdjective]! \n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 01_cde_pontus_missions_01_task_24_tt:0 "Poseer al menos el 75% de los territorios costeros en las regiones de [GetProvince('(int32)1806').GetArea.GetRegion.GetName] y [GetProvince('(int32)1797').GetArea.GetRegion.GetName] (Actual: [SCOPE.ScriptValue('pontus_02_coasts_task_24_current')|0Y] / [SCOPE.ScriptValue('pontus_02_coasts_task_24_total')|0Y])"
