 # Pontus missions (from carthago)
 01_cde_pontus_missions_01_black_sea:0 "Hegemones pónticos del mar Euxino"
 01_cde_pontus_missions_01_black_sea_DESCRIPTION:0 "El #E Mar Euxino#! alberga herencias, culturas y estados duraderos de muy diferentes orígenes, incluidas las #E colonias griegas#! en la costa del Mar Negro y los #E escitas#! y #E sármatas#! en toda el mar a nuestro norte. Aunque el #E Reino del Bósforo#! fue alguna vez una potencia poderosa que pudo resistir la influencia de los reinos helenísticos como el reino de Lisimáquida, hoy en día hay pocos gobernantes que tengan el poder de proteger el Mar Negro de la influencia extranjera. Así, ¡consolidémonos nosotros mismos, los #E Mitrídates#! gobernantes del #E Ponto#!, como los verdaderos hegemones y protectores de los griegos del Mar Negro!"
 01_cde_pontus_missions_01_black_sea_CRITERIA_DESCRIPTION:0 "La Misión se completará una vez que Ponto se haya establecido como la potencia dominante del Mar Negro."
 01_cde_pontus_missions_01_black_sea_BUTTON_TOOLTIP:0 "¡Gloria al Ponto! ¡Gloria a Mitrídates!"
 01_cde_pontus_missions_01_black_sea_BUTTON_DETAILS: ""
 01_cde_pontus_missions_01_task_1:0 "Reinos Ancestrales"
 01_cde_pontus_missions_01_task_1_DESC:0 "Mientras las diversas ciudades griegas a lo largo del Mar Negro están siendo atacadas y asediadas por los bárbaros del norte (los escitas, sármatas y celtas), pocos estados a lo largo del Mar Negro tienen el poder de detenerlos. Por lo tanto, aquí es donde intervenimos; Como gran basileus del reino del Ponto, nuestro gobernante asumirá el papel de defensor de los helenos y navegará a través de las olas para poner a todos bajo nuestra protección. Como estas tierras a lo largo del Mar Negro son nuestros reinos ancestrales, quedará claro para todos que somos los legítimos hegemones de esas tierras. \n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 01_cde_pontus_missions_01_task_1.tt:0 "Obtenga reclamaciones sobre #Y Colchis#! y #Y Paflagonia#!"
 #01_cde_pontus_missions_01_task_2:0 "Sinopean Palace"
 #01_cde_pontus_missions_01_task_2_DESC:0 "One of our most recent acquisitions in Paphlagonia from our conquests is the Greek city of Sinope. A thriving city of enduring Greek heritage, it is a perfect embodiment of the Black Sea Greek identity. Rather than just constructing a summer residence in the city, our ruler is considering constructing a royal residence in the city of Sinope due to its strategic and cultural value. Our ruler is even considering moving the capital to Sinope entirely. \n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 #01_cde_pontus_missions_01_task_2.tt:0 "Event fires, allowing you to choose to #Y move the capital#! to Sinope and grant bonuses to the city"
 01_cde_pontus_missions_01_task_3:0 "Base Naval en Trapecio"
 01_cde_pontus_missions_01_task_3_DESC:0 "Si deseamos ampliar nuestra influencia a través del Mar Negro, primero debemos establecer una flota fuerte; Para establecer una flota fuerte, debemos tener una base naval designada lo suficientemente grande como para albergar dicha flota. Por ello, nuestros asesores coinciden en que la ciudad griega de Trapezous es un lugar ideal para ello, ya que cuenta con un puerto bien establecido que alberga tanto flotas como barcos mercantes. \n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 01_cde_pontus_missions_01_task_4:0 "Lazos comerciales amisianos"
 01_cde_pontus_missions_01_task_4_DESC:0 "Al ampliar la influencia de la ciudad comercial clave de Amisos, podemos expandir nuestra influencia económica y cultural a través del Mar Euxino con las monedas pónticas. Amisos servirá como vínculo para las conexiones económicas y culturales entre el Ponto y las ciudades griegas a lo largo de las costas norte y del Mar Negro. Esto crearía una esfera económicamente unificada al otro lado del mar bajo la moneda de nuestro reino, preparando el escenario para que los griegos a lo largo de las costas aceptaran nuestra hegemonía con abierta brazos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 01_cde_pontus_missions_01_task_4.tt:0 "Cualquier país del grupo cultural #Y helénico#! #Y comercia con nosotros#!"
 01_cde_pontus_missions_01_task_5:0 "Corte helenística"
 01_cde_pontus_missions_01_task_5_DESC:0 "La dinastía Mitrídates es casi tan griega como persa, tanto culturalmente como por sangre. Con nuestra historia de matrimonios con la dinastía seléucida, desde entonces nuestros reyes se han esforzado por establecer el Ponto como un reino legítimo y claramente helenístico, desde la adopción del título helénico de basileus hasta la designación del griego como lengua y escritura oficial de la corte. Por lo tanto, comencemos la política de invitar a personas de estados helénicos extranjeros a servir en nuestra corte; por supuesto, sólo de estados en los que confiamos. Estas influencias helénicas también harán que sea más fácil para los súbditos griegos actuales y futuros identificarse con nuestro estándar.\n\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 01_cde_pontus_missions_01_task_5.tt:0 "Cualquier país del grupo cultural #Y Helénico#! tiene al menos #Y 80#! Opinión hacia nosotros"
 01_cde_pontus_missions_01_task_5.tt2:0 "Obtenga un asesor cultural greco-póntico con atributos de buena delicadeza y carisma."
 01_cde_pontus_missions_01_task_51:0 "Poleis pónticas"
 01_cde_pontus_missions_01_task_51_DESC:0 "Uno de los rasgos definitorios de la civilización griega es la polis o ciudad griega, que alberga muchos aspectos de la cultura helénica que deseamos emular para convertirnos en un reino verdaderamente helenístico. En los reinos helenísticos de los Diadochi, a los súbditos a veces se les ofrecían privilegios y mayores oportunidades de movilidad social si construían poleis al estilo griego y se integraban en la sociedad helenística. Por tanto, apelemos a nuestros súbditos griegos y no griegos construyendo grandes poleis en todo nuestro propio reino con un estilo claramente greco-póntico. \n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 01_cde_pontus_missions_01_task_51.tt:0 "Tiene un #Y Foro#! y un #Y Gran Templo#! o un #Y Gran Teatro#!"
 01_cde_pontus_missions_01_task_51.tt2:0 "Cada #Y Ciudad#! de propiedad que no sea la capital"
 01_cde_pontus_missions_01_task_6:0 "Mercenarios griegos"
 01_cde_pontus_missions_01_task_6_DESC:0 "Nuestro gobernante Mitrídates V fue el primer gobernante póntico que utilizó ampliamente mercenarios griegos. Si bien los mercenarios generalmente luchan solo por monedas y no tienen lealtad a ningún reino, tal vez podamos construir una especie de pseudo-amistad con estos mercenarios hambrientos de monedas mostrándoles que los trataremos bien en tiempos de guerra. Por lo tanto, sigamos construyendo fuertes vínculos con los mercenarios griegos a lo largo del mar para que podamos construir una reputación como un cliente que trata a sus mercenarios con dignidad y respeto.\n\n\n\n\n\n\n\n \n\n\n@greek_mil17!"
 01_cde_pontus_missions_01_task_6_tt:0 "Tener un capitán mercenario contratado."
 01_cde_pontus_missions_01_task_7:0 "Patrón de Delfos"
 01_cde_pontus_missions_01_task_7_DESC:0 "Una forma en que muchos gobernantes helenísticos se ganaron el respeto de las ciudades-estado griegas fue patrocinando la ciudad de Delfos, hogar del famoso Templo de Apolo y su igualmente famoso Oráculo de Delfos. Por lo tanto, enviemos a la ciudad de Delfos una generosa donación para que puedan construir una estela en nuestro honor, difundiendo por todo el reino griego que los reyes del Ponto son filohelenos, amantes de la cultura y el pueblo griegos, en el fondo. \n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 01_cde_pontus_missions_01_task_7.tt:0 "Propietario de la ciudad de #Y Delfos#!"
 01_cde_pontus_missions_01_task_71:0 "Protector de los helenos"
 01_cde_pontus_missions_01_task_71_DESC:0 "Si deseamos asumir el papel vacante de Protector de los griegos del Mar Negro, entonces debemos demostrar nuestras intenciones con acciones y no con palabras. Así pues, garanticemos la independencia y la seguridad de las ciudades griegas para que ya no tengan que temer a los bárbaros y a las potencias extranjeras que pasan hambre en sus fronteras. \n\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 01_cde_pontus_missions_01_task_71.tt:0 "Al menos #Y 2#! los países del grupo de cultura helénica están #Y Garantizados por nosotros#! y tienen al menos #Y 90 opiniones#! hacia nosotros"
 01_cde_pontus_missions_01_task_72:0 "Homenaje garantizado"
 01_cde_pontus_missions_01_task_72_DESC:0 "El reino Mitrídates del Ponto se ha aliado con ciudades-estado griegas alrededor del Mar Negro en el pasado, actuando como sus protectores y garantizando la autonomía griega. Por lo tanto, tal vez sea hora de que construyamos relaciones sólidas con aquellos a quienes garantizamos la independencia para establecernos como sus protectores permanentes a cambio de tributo. \n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 01_cde_pontus_missions_01_task_72.tt:0 "1 país del grupo de cultura helénica está #Y garantizado por nosotros#! y tiene al menos #Y 150 opiniones#! hacia nosotros"
 01_cde_pontus_missions_01_task_72.tt2:0 "Un país #Y Helénico#!-cultured No Jugador que sea un #Y Rango Inferior#! y Garantizado por nosotros se convierte en un #Y Tributario#! bajo nuestra regla"
###Unused
 01_cde_pontus_missions_01_task_8:0 "Presionar a los paflagonios"
 01_cde_pontus_missions_01_task_8_DESC:0 "Los reyes nativos de Paflagonia alguna vez gobernaron un gran reino en el norte de Anatolia. Sin embargo, ahora tenemos mucho más poder que ellos; por lo tanto, tenemos la capacidad de simplemente coaccionar al rey Paflagonio para que nos legue su reino, sirviendo como nuestros estados clientes leales hasta que creamos adecuado integrarlos como súbditos directos de nuestro país. Reino."
 01_cde_pontus_missions_01_task_8.tt:0 "#G Se pasa por alto si el reino de Paflagonia no posee ninguna tierra#!"
 01_cde_pontus_missions_01_task_8.tt2:0 "#R Amenazar de guerra#! con #Y Paflagonia#! si no se convierten en nuestro Estado Cliente"
 01_cde_pontus_missions_01_task_81:0 "Controlar la paflagonia"
 01_cde_pontus_missions_01_task_81_DESC:0 "El reino restante de Paflagonia poseía sólo una parte de toda la región histórica de Paflagonia. Como nuestras tierras ancestrales, ahora podemos declarar la guerra a cualquiera que se niegue a entregar nuestros legítimos derechos a nuestro reino."
 01_cde_pontus_missions_01_task_81.tt:0 "Propiedad nuestra, un Sujeto O un Aliado"
 01_cde_pontus_missions_01_task_81.tt2:0 "Provincias de #Y Paflagonia Inferior#! y #Y Paflagonia Superior#!"
 01_cde_pontus_missions_01_task_9:0 "Conquista de la Cólquida"
 01_cde_pontus_missions_01_task_9_DESC:0 "Aprovechar la región de Cólquida nos sería de gran utilidad, ya que la región sería una gran posición estratégica a medida que nos expandimos más al norte a lo largo de la costa del Mar Negro. Además, como antiguos súbditos de los aqueménidas de los que desciende la familia Mitrídates, es lógico que la región quede bajo nuestro dominio. \n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 01_cde_pontus_missions_01_task_9.tt:0 "Provincia de #Y Cólquide#!"
###
 01_cde_pontus_missions_01_task_10:0 "Emporia colquídea"
 01_cde_pontus_missions_01_task_10_DESC:0 "Los emporios griegos de Phasis y Dioskourias son dos fuentes principales de riqueza y riqueza de las que disfrutan los pueblos de Colchis. Por lo tanto, si utilizamos la riqueza de nuestro propio Reino Póntico para expandir estas ciudades comerciales y convertirlas en emporios prósperos bajo nuestro imperio, seguramente nos ganaremos los corazones de aquellos que se benefician más directamente de tales desarrollos. \n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 01_cde_pontus_missions_01_task_11:0 "Apaciguar a las tribus colquídeas"
 01_cde_pontus_missions_01_task_11_DESC:0 "La región de Colchis es un crisol extremadamente diverso de diferentes idiomas, culturas y tradiciones; Sólo la ciudad de Dioskourias tiene entre setenta y trescientas lenguas habladas entre sus habitantes. Por lo tanto, esto hace que la región sea muy difícil de controlar, ya que es muy probable que vuelvan a ocurrir rebeliones en Cólquida contra potencias mayores, como los aqueménidas en el pasado. Por lo tanto, trabajemos duro para apaciguar a las numerosas tribus de Cólquida bajo nuestro gobierno. \n\n\n\n\n\n\n\n\n\n\n@italic_mil22!"
 01_cde_pontus_missions_01_task_11.tt:0 "Provincia de #Y Cólquide#!"
 01_cde_pontus_missions_01_task_12:0 "Regla del cliente en Colchis"
 01_cde_pontus_missions_01_task_12_DESC:0 "Aunque hemos apaciguado a las tribus de Colchis, hay pocas garantías de que sigan siendo leales a nuestro estado, especialmente con nuestro gobierno central lejos en el Ponto. Por lo tanto, puede ser mejor para nosotros establecer un reino cliente en el Ponto que gobierne en nuestro nombre, dando a las tribus locales un gobernante que pueda abordar mejor sus quejas y al mismo tiempo garantizar que el estado permanezca en manos pónticas. \n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 01_cde_pontus_missions_01_task_12.tt:0 "Se forma un #Y Feudatorio#! de Colchis a partir de todos los territorios propios y súbditos en las provincias de Colchis, Suaneti y Abasgoi\n\nElige a alguien para que sirva como nuevo gobernante cliente de Colchis."
 01_cde_pontus_missions_01_task_13:0 "Someter a las tribus costeras"
 01_cde_pontus_missions_01_task_13_DESC:0 "Las tribus costeras de Zygii y Heniochi tienen una historia de ser ferozmente independientes. Los Zygii son pastores y piratas, mientras que Heródoto describió a los Heniochi como dispuestos a matar y comerse a sus semejantes. Por lo tanto, derrotar y subyugar a estas tribus ciertamente demostraría nuestro poder marcial.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 01_cde_pontus_missions_01_task_14:0 "Ambiciones en el extranjero"
 01_cde_pontus_missions_01_task_14_DESC:0 "Con una base naval establecida en Trapezous, ahora tenemos las bases marítimas para una invasión naval del norte. Por lo tanto, ahora reivindiquemos las tierras del norte, comenzando por las tierras de Taurica. \n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 01_cde_pontus_missions_01_task_14.tt:0 "Obtener reclamaciones sobre #Y Taurica#!"
 01_cde_pontus_missions_01_task_141:0 "Hacer retroceder a los escitas"
 01_cde_pontus_missions_01_task_141_DESC:0 "El creciente poder de los escitas reales en Taurica es un obstáculo importante para lograr la hegemonía exclusiva del Ponto en el Mar Negro. Si bien nos importaría poco si la mayor parte de Taurica estuviera bajo estados amigos, es imperativo que tomemos la ciudad principal de los escitas, la Neápolis escita en Taurica, para poder beneficiarnos de su posición estratégica. \n\n\n\n\n\n\n\n\n\n\n@persia_mil13!"
 01_cde_pontus_missions_01_task_141.tt:0 "Provincia de Taurica"
 01_cde_pontus_missions_01_task_141.tt2:0 "#Y Scythia#! y sus súbditos NO poseen ningún territorio en #Y Taurica#!"
 01_cde_pontus_missions_01_task_15:0 "Lealtad de Quersoneso"
 01_cde_pontus_missions_01_task_15_DESC:0 "Hemos tenido relaciones cordiales con el pueblo de Chersonesos en el pasado. Por lo tanto, usemos nuestra influencia para asegurar que el Quersoneso esté dispuesto a seguirnos en la consecución de nuestros objetivos de hegemonía en Taurica y la costa norte del Mar Negro. \n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 01_cde_pontus_missions_01_task_15.tt:0 "Obtenga derechos sobre #Y Olbia#! y #Y Tyras#!"
 01_cde_pontus_missions_01_task_15.tt2:0 "#Y Quersoneso#! está aliado con nosotros Y tiene al menos #Y 80#! opinión sobre nosotros"
 01_cde_pontus_missions_01_task_16:0 "Emporia del Norte"
 01_cde_pontus_missions_01_task_16_DESC:0 "Los ricos emporios, o ciudades comerciales, de Olbia y Tyras alguna vez fueron influyentes por derecho propio. Sin embargo, los dos emporios han caído desde entonces en declive y ahora están bajo la influencia de las tribus bárbaras del norte, los escitas y los sármatas. Como protectores de los griegos del Mar Negro, zarpemos hacia el noroeste para liberar estas ciudades y restaurar su antigua gloria.\n\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 01_cde_pontus_missions_01_task_17:0 "Neápolis Taurike"
 01_cde_pontus_missions_01_task_17_DESC:0 "Nos hemos apoderado de la prestigiosa ciudad escita de Neapolis Taurike. Hogar de pueblos escitas y griegos, es cierto que los escitas han convertido la ciudad en un bullicioso centro de Taurica, con comerciantes, arquitectos y artesanos griegos que contribuyen a la cultura y la riqueza de la ciudad. Contribuyamos así al desarrollo de la ciudad para hacer de Neapolis Taurike una ciudad claramente póntica en Taurica. \n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 01_cde_pontus_missions_01_task_18:0 "Subyugar a los bosporanos"
 01_cde_pontus_missions_01_task_18_DESC:0 "El Reino del Bósforo a lo largo de la costa norte del Mar Negro fue una vez una gran potencia, capaz de desafiar incluso al reino diadochi Lysimachid. Sin embargo, desde entonces el reino ha caído en declive. Por lo tanto, hegemonicemos a los cimerios del Bósforo para que puedan ser colocados bajo un reino más poderoso que pueda garantizar su seguridad. \n\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 01_cde_pontus_missions_01_task_19:0 "Integración del Bósforo"
 01_cde_pontus_missions_01_task_19_DESC:0 "Como autoproclamados protectores de los griegos en el Mar Negro, sería un error por nuestra parte negar a los griegos del Bósforo, primos de los griegos pónticos en nuestra patria, los derechos y privilegios de la ciudadanía. Por lo tanto, integremos a los pueblos del Bósforo y, como muestra de amistad, patrocinemos directamente el desarrollo de su antigua capital, Pantikapaion. \n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 01_cde_pontus_missions_01_task_20:0 "Sofocar a las tribus"
 01_cde_pontus_missions_01_task_20_DESC:0 "Con la subyugación del reino del Bósforo, muchas de las nobles tribus escitas que disfrutaban de muchos privilegios e incluso lazos de parentesco con los antiguos reyes del Bósforo temen perder influencia con el gobierno central al otro lado del mar, en el Ponto. Para evitar más problemas, incitemos a los desleales a que den la cara y pongamos fin a cualquier pensamiento separatista.\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 01_cde_pontus_missions_01_task_20.tt:0 "Los bárbaros escitas desovan en la zona del Bósforo."
 01_cde_pontus_missions_01_task_21:0 "Marcha hacia Escitia"
 01_cde_pontus_missions_01_task_21_DESC:0 "Con los escitas expulsados ​​de Taurica, ahora tenemos un punto de apoyo en la región. Por lo tanto, aumentemos nuestras fuerzas en Taurica y avancemos hacia el territorio escita para obtener el control total de la costa norte del Bósforo y demostrar a todas las tribus que no debemos tomarnos a la ligera. N\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 01_cde_pontus_missions_01_task_22:0 "Griegos de Taurica"
 01_cde_pontus_missions_01_task_22_DESC:0 "Aunque los griegos nos han recibido como salvadores de la amenaza escita, muchos todavía se muestran escépticos sobre nuestras intenciones con respecto a sus ciudades. Por lo tanto, ganémonos sus corazones desarrollando sus ciudades y patrocinando los cultos locales de Taurica, como el culto a la diosa Partenos; los Tauri, una vez aliados de los escitas, también adoran a Partenos como su deidad principal, por lo que esto apaciguará el rebelde Tauri también.\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 01_cde_pontus_missions_01_task_23:0 "Campeón de los griegos euxinos"
 01_cde_pontus_missions_01_task_23_DESC:0 "Hemos liberado a todos los griegos a lo largo del norte y este del Mar Negro, y todos los griegos a lo largo de la costa conocen el nombre de nuestro gran basileus. ¡Así que declarémonos oficialmente salvadores de los griegos del Mar Negro!\n\n\n\n\n\n\n\n\n\n@greek_mil3!"

 # Pontus events(from carthago)
 cde_me_pon_01.1.t:0 "Las Tierras Ancestrales"
 cde_me_pon_01.1.desc:0 "Hace más de un siglo, nuestro fundador Mitrídates Ktistes estableció un pequeño reino en Paflagonia que eventualmente creció hasta convertirse en el gran reino del Ponto que reina hoy. Nuestra dinastía desciende de la nobleza persa, e incluso podemos rastrear nuestro linaje hasta las familias de los grandes reyes aqueménidas Ciro y Darío de Persia. Para crear un estado panpóntico que pueda resistir la influencia tanto de Roma como de los reinos helenísticos, comencemos primero a reclamar nuestras tierras ancestrales en Cólquida y Paflagonia, reinos que alguna vez estuvieron en manos de nuestros nobles antepasados ​​durante la era aqueménida."
 cde_me_pon_01.1.a:0 "¡Construyamos un reino digno de nuestro legado ancestral!"
 cde_me_pon_01.1.tt:0 "Comenzaremos a reclamar nuestros reinos ancestrales."
 cde_me_pon_01.2.t:0 "Por un Estado panpóntico"
 cde_me_pon_01.2.desc:0 "Para formar un estado panpóntico que tenga el poder de resistir la invasión romana y helenística de las tierras del Ponto, ¡consolidemos nuestro control sobre nuestros reinos ancestrales en Cólquida y Paflagonia!"
 cde_me_pon_01.2.a:0 "¡Ponto debe permanecer unido!"
 cde_me_pon_01.3.t:0 "Nueva Residencia Real en Sinope"
 cde_me_pon_01.3.desc:0 "La residencia de verano de la monarquía en la ciudad costera de Sinope se ha ampliado en #Y [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName]#!,, lo que a su vez ha elevado la importancia y el estatus de la ciudad en nuestro reino. Aunque Sinope fue una adquisición reciente de Mitrídates V, su posición estratégica a lo largo de la costa, así como su prosperidad duradera y su legado helénico la convierten en una candidata excelente para una nueva capital. Por lo tanto, mientras planificamos nuestra expansión a través del Mar Negro, tal vez una capital costera en Sinope nos vendría mejor, lo que implicaría trasladar permanentemente a la familia real a Sinope."
 cde_me_pon_01.3.a:0 "Trasladar la capital a Sinope."
 cde_me_pon_01.3.b:0 "Un palacio de verano es suficiente."
 cde_me_pon_01.4.t:0 "Astillero Ampliado en Trapecio"
 cde_me_pon_01.4.desc:0 "Hemos ampliado la ya bulliciosa ciudad portuaria de Trapezous hasta convertirla en una base naval central para la flota póntica. Para dar cabida a esta expansión, el astillero naval se ha ampliado considerablemente, lo que nos permite albergar y construir una mayor cantidad de barcos que antes."
 cde_me_pon_01.4.a:0 "¡Que el Ponto gobierne los mares desde nuestras costas!"
 cde_me_pon_01.5.t:0 "Hegemones económicos en Amisos"
 cde_me_pon_01.5.desc:0 "Al ampliar el centro comercial clave de Amisos, hemos expandido nuestra influencia económica a lo largo del Mar Negro, extendiendo la imagen de nuestro gobernante en nuestras monedas mucho más allá de los dominios pónticos. Si continuamos uniendo todo el Mar Negro bajo la moneda póntica, crearemos una esfera económica póntica unida, con individuos todos unidos bajo una identidad heleno-póntica."
 cde_me_pon_01.5.a:0 "¡Ganaremos sus corazones con dinero y diplomacia!"
 cde_me_pon_01.6.t:0 "Un asesor griego se une a nuestra corte"
 cde_me_pon_01.6.desc:0 "Con nuestra reciente política de integrar las culturas griegas a lo largo del Mar Negro en nuestro estado helenístico, hemos atraído a personas talentosas de países amigos que desean servir a nuestro gobernante en nuestra propia corte helenística en el Ponto."
 cde_me_pon_01.6.a:0 "Espléndido."
 cde_me_pon_01.7.t:0 "Poleis griega en el Ponto"
 cde_me_pon_01.7.desc:0 "Al aplicar una política de helenización mediante la construcción de poleis de estilo griego en todo nuestro reino, a su vez hemos inspirado a nuestros pueblos, tanto griegos como no griegos, a participar en la helenización para lograr una mayor movilidad social en nuestro reino."
 cde_me_pon_01.7.a:0 "Que nuestros leales súbditos sigan sirviéndonos bien."
 cde_me_pon_01.8.t:0 "Lazos mercenarios griegos"
 cde_me_pon_01.8.desc:0 "Nuestra bien ganada reputación como clientes justos de los mercenarios griegos nos ha convertido en un cliente atractivo para los mercenarios de todo el país."
 cde_me_pon_01.8.a:0 "Que nos sirvan bien cuando requieramos sus servicios en el futuro."
 cde_me_pon_01.9.t:0 "Filhelena Patrona de Delfos"
 cde_me_pon_01.9.desc:0 "Nuestro gobernante y su consorte han hecho una generosa donación a la ciudad de Delfos. Esto no sólo mejora nuestra relación con la ciudad y sus señores, sino que también deja claro a todas las ciudades-estado griegas que somos un reino benévolo de gobernantes fihelenos, o amantes de los griegos, que desean protegerlos de cualquier daño. Por eso, a cambio, los delfos han construido una estela en honor de nuestro gobernante."
 cde_me_pon_01.9.a:0 "Que nuestros vínculos con los griegos se fortalezcan cada vez más"
 cde_me_pon_01.10.t:0 "Donación a Delfos del Ponto"
 cde_me_pon_01.10.desc:0 "Los gobernantes de #Y Pontus#! han donado generosamente una gran suma de monedas a la ciudad de Delfos. Parece que desean convertirse en patrocinadores de Delfos, emulando a los gobernantes helenísticos del pasado."
 cde_me_pon_01.10.a:0 "Agradecemos su donación."
 cde_me_pon_01.11.t:0 "Protector de los griegos euxinos"
 cde_me_pon_01.11.desc:0 "Al garantizar la autonomía y la seguridad de varios Estados griegos, hemos demostrado a todos que pretendemos asumir el papel vacante de protector de los griegos del Mar Euxino. Los griegos del Mar Negro ya no temerán las incursiones de los bárbaros ni las amenazas de las grandes potencias del mundo, ¡porque nosotros, los del Ponto, estaremos a su lado!"
 cde_me_pon_01.11.a:0 "¡Defenderemos a todos los griegos del mar Euxino!"
 cde_me_pon_01.12.t:0 "Un nuevo afluente"
 cde_me_pon_01.12.desc:0 "[me_epi_royal_wedding_country_scope.GetName], a quien le garantizamos la independencia desde hace bastante tiempo, ha decidido sabiamente aceptar permanentemente nuestra protección y hegemonía. A cambio de proteger a sus pueblos contra los enemigos en sus fronteras, recibiremos tributos regulares de ellos, convirtiéndolos oficialmente en súbditos de nuestro estado."
 cde_me_pon_01.12.a:0 "No se arrepentirán de su decisión."
 cde_me_pon_01.13.t:0 "Presionando a los Paflagonios"
 cde_me_pon_01.13.desc:0 "Los reyes nativos de Paflagonia alguna vez gobernaron un gran reino en el norte de Anatolia. Sin embargo, ahora tenemos mucho más poder que ellos; por lo tanto, tenemos la capacidad de simplemente coaccionar al rey Paflagonio para que nos legue su reino, sirviendo como nuestros estados clientes leales hasta que creamos adecuado integrarlos como súbditos directos de nuestro país. Reino."
 cde_me_pon_01.13.a:0 "Esperemos que tomen la decisión correcta..."
 cde_me_pon_01.14.t:0 "Ponto nos presiona para que nos sometamos"
 cde_me_pon_01.14.desc:0 "El Reino del Ponto nos ha amenazado con la guerra si no nos sometemos a su gobierno. Se han apoderado de nuestros territorios en el pasado y, aunque su reino es más poderoso que el nuestro, es posible que deseemos luchar para defender el orgullo de nuestro pueblo. Por otro lado, aceptar su soberanía evitará el derramamiento de sangre, y nuestro gobernante seguirá sentado en el trono de Paflagonio como rey cliente del Ponto."
 cde_me_pon_01.14.a:0 "Evitemos el derramamiento de sangre y sometámonos"
 cde_me_pon_01.14.b:0 "¡Nunca nos rendiremos!"
 cde_me_pon_01.15.t:0 "Paflagonia envía"
 cde_me_pon_01.15.desc:0 "Para evitar el derramamiento de sangre, el reino de Paflagonia ha decidido sabiamente someterse a nuestro gobierno y convertirse en nuestro estado cliente."
 cde_me_pon_01.15.a:0 "Tomaron la decisión correcta"
 cde_me_pon_01.16.t:0 "Paflagonia se niega a someterse"
 cde_me_pon_01.16.desc:0 "A pesar de nuestra superioridad tanto en armas como en influencia, el reino de Paflagonia ha decidido tontamente rechazar nuestras ofertas de paz a cambio de su sumisión. Por lo tanto, ahora declararemos la guerra a su estado para poner su reino bajo nuestro dominio por la fuerza."
 cde_me_pon_01.16.a:0 "Pongamos a los tontos en su lugar."
 cde_me_pon_01.17.t:0 "Tierras Ancestrales de Paflagonia"
 cde_me_pon_01.17.desc:0 "Paflagonia es la tierra ancestral de los Mitrídates, ya que fue donde el fundador Mitrídates I Ktistes había establecido el reino Mitrídates hace mucho tiempo; Por lo tanto, su integración en el reino ha sido una bendición para los paflagonios locales, que son tratados como iguales por los gobernadores locales Mitrídates."
 cde_me_pon_01.17.a:0 "¿Quiénes somos para tratarlos de manera diferente?"
 cde_me_pon_01.18.t:0 "Tierra del Toisón de Oro"
 cde_me_pon_01.18.desc:0 "Finalmente hemos asegurado nuestras tierras ancestrales en Cólquida, ya que toda la región de Cólquida ha quedado bajo el dominio póntico. Cólquida ha sido durante mucho tiempo una fuente de misterio y asombro para los griegos, ya que era la tierra en la que se guardaba el Vellocino de Oro. Ahora somos el primer estado helenístico que se apodera de la totalidad de la Cólquida."
 cde_me_pon_01.18.a:0 "¡Qué gracioso, somos los nuevos Argonautas!"
 cde_me_pon_01.19.t:0 "Fasis y Dioskourias"
 cde_me_pon_01.19.desc:0 "Fundados hace muchos siglos, los emporios griegos de Phasis y Dioskourias son dos fuentes principales de riqueza y riqueza de las que disfrutan los pueblos de Colchis. Por lo tanto, nuestro patrocinio estatal directo del desarrollo de las ciudades y la promoción del comercio en la región nos ha ganado el favor de los comerciantes y ciudadanos griegos y colquidos que se benefician más directamente de nuestro patrocinio."
 cde_me_pon_01.19.a:0 "Que traigan riqueza a Cólquida y al Ponto."
 cde_me_pon_01.20.t:0 "Las muchas tribus de Colchis"
 cde_me_pon_01.20.desc:0 "La región de Colchis es un crisol extremadamente diverso de diferentes idiomas, culturas y tradiciones; Sólo la ciudad de Dioskourias tiene cientos de idiomas que se hablan entre sus habitantes. Por lo tanto, es una hazaña bastante impresionante que hayamos apaciguado, temporalmente, a muchas tribus y pueblos de Cólquida."
 cde_me_pon_01.20.a:0 "Esforcémonos por mantener leales a estos pueblos"
 cde_me_pon_01.21.t:0 "Un rey cliente en Cólquida"
 cde_me_pon_01.21.desc:0 "Aunque hemos decidido que Cólquida estaría mejor bajo un gobierno indirecto a través de un rey cliente, todavía no hemos decidido quién exactamente debería heredar la responsabilidad de gobernar las tierras de Cólquida. Después de algunas deliberaciones, se han identificado tres individuos: un miembro de la familia directa de [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName], un primo lejano de [ROOT.GetCountry.GetRuler.GetName] y un prominente gobernante local de Colchian."
 cde_me_pon_01.21.a:0 "[ruler_family_client_candidate.GetName] debería gobernar"
 cde_me_pon_01.21.b:0 "[ruler_cousin_client_candidate.GetName] debería gobernar"
 cde_me_pon_01.21.c:0 "[ruler_local_client_candidate.GetName] debería gobernar"
 cde_me_pon_01.21.btt:0 "Un primo engendrado del gobernante se convierte en rey cliente de Cólquida"
 cde_me_pon_01.21.ctt:0 "Un gobernante local de Cólquida engendrado se convierte en rey cliente de Cólquida"
 cde_me_pon_01.22.t:0 "Reclamaciones sobre Taurica"
 cde_me_pon_01.22.desc:0 "Ahora que hemos establecido una base naval en Trapezous, tenemos los medios para proteger a los griegos al otro lado del mar. Los griegos en Taurica han sido prácticamente derrotados por los escitas reales, siendo Quersoneso y las ciudades del Reino del Bósforo las únicas antiguas colonias griegas que no han caído bajo el dominio escita. ¡Por lo tanto, reclamemos Taurica para que podamos cruzar los mares como sinceros defensores de la autonomía griega!"
 cde_me_pon_01.22.a:0 "¡Protege a los griegos de Taurica!"
 cde_me_pon_01.23.t:0 "Protectores pónticos de Taurica"
 cde_me_pon_01.23.desc:0 "Hemos intervenido en Taurica como protectores de los griegos tauricanos, brindándoles la paz y la seguridad tan esperadas por parte de las tribus bárbaras del norte."
 cde_me_pon_01.23.a:0 "¡Nunca conocerán el miedo bajo nuestra protección!"
 cde_me_pon_01.24.t:0 "Amigos en Quersonesos"
 cde_me_pon_01.24.desc:0 "Con la ciudad de Quersonesos asegurada bajo la influencia póntica, es hora de que busquemos en otra parte expandir nuestra influencia a lo largo de la costa del Mar Negro. Nuestros amigos de Quersoneso nos hablan de los ricos emporios de Olbia y Tyras, ciudades griegas que alguna vez fueron influyentes y que ahora han caído bajo la influencia de las tribus bárbaras de los escitas y sármatas del norte. Así, como protectores de los griegos euxinos, liberemos también esas ciudades."
 cde_me_pon_01.25.t:0 "Comercio seguro en el noroeste de Emporia"
 cde_me_pon_01.25.desc:0 "Hemos liberado las ciudades comerciales de Olbia y Tyras de sus señores bárbaros, haciendo retroceder a los escitas y sármatas para que ya no puedan atacar las ciudades e infundir miedo en los corazones de los vulnerables griegos a lo largo de la costa."
 cde_me_pon_01.25.a:0 "Ningún griego conocerá el miedo bajo nuestra bandera."
 cde_me_pon_01.26.t:0 "Neápolis Taurike"
 cde_me_pon_01.26.desc:0 "Nos hemos apoderado de la prestigiosa ciudad escita de Neapolis Taurike. Hogar de pueblos escitas y griegos, es cierto que los escitas han convertido la ciudad en un bullicioso centro de Taurica, con comerciantes, arquitectos y artesanos griegos que contribuyen a la cultura y la riqueza de la ciudad. Por lo tanto, hemos invertido nuestros propios fondos para expandir la ciudad de Neapolis Taurike como un centro estratégico, económico y cultural del Ponto en Taurica."
 cde_me_pon_01.26.a:0 "Sigamos desarrollando Taurica"
 cde_me_pon_01.27.t:0 "Subyugación del Bósforo"
 cde_me_pon_01.27.desc:0 "La subyugación de los griegos del Bósforo nos ha brindado mayores oportunidades militares y económicas. Por lo tanto, aprovechemos nuestros nuevos territorios estableciendo comerciantes pónticos en la ciudad central de Theodosia."
 cde_me_pon_01.27.a:0 "Espléndido."
 cde_me_pon_01.28.t:0 "Integración del Bósforo"
 cde_me_pon_01.28.desc:0 "Hemos demostrado nuestra dedicación a los griegos del Bósforo desarrollando sus tierras y asegurándonos de que prosperen bajo el dominio póntico. Por lo tanto, incluso aquellos en las ciudades del Bósforo que se mostraron escépticos sobre nuestras intenciones en su tierra natal se han dejado influenciar por nuestra generosidad y benevolencia."
 cde_me_pon_01.28.a:0 "Todos los griegos, ya sean pónticos o del Bósforo, prosperarán"
 cde_me_pon_01.29.t:0 "Rebeldes de las tribus nobles escitas"
 cde_me_pon_01.29.desc:0 "Los nobles escitas que temen perder influencia en la región del Bósforo ahora que estamos a cargo han sido incitados deliberadamente a la rebelión. Esto desarraiga a aquellos que están descontentos con nuestro gobierno, dejando sólo a los escitas leales, o al menos a aquellos que son indiferentes, como súbditos de nuestro reino. ¡Por lo tanto, aplastemos a estos rebeldes escitas y demostremos a todas las tribus que no podemos ser desafiados!"
 cde_me_pon_01.29.a:0 "¡Aplastemos esta patética resistencia!"
 cde_me_pon_01.30.t:0 "Campeón de los griegos euxinos"
 cde_me_pon_01.30.desc:0 "Hemos liberado a todos los griegos a lo largo del norte y este del Mar Negro, y todos los griegos a lo largo de la costa conocen el nombre de nuestro gran basileus. Por lo tanto, hemos declarado oficialmente a nuestro gobernante salvador de los griegos del Mar Negro.\n\nHabiendo marcado el comienzo de una nueva era para los griegos en el Mar Negro, puede ser apropiado que nuestro gobernante adopte un título o epíteto adecuado para conmemorar su logros."
 cde_me_pon_01.30.a:0 "'Soter', que significa 'el Salvador'"
 cde_me_pon_01.30.b:0 "'Euergetes', que significa 'el Benefactor'"
 cde_me_pon_01.30.c:0 "'Megas Soter', que significa 'el Gran Salvador'"
 cde_me_pon_01.30.d:0 "Debemos ser humildes a pesar de nuestros logros..."

 # Modifiers (from carthago)
 cde_me_pon_pontic_royal_palace:0 "Palacio Real Póntico"
 cde_me_pon_pontic_summer_palace:0 "Palacio de Verano Póntico"
 desc_cde_me_pon_pontic_summer_palace:0 "Aquí se construyó una residencia de verano, en la que el gobernante permanecerá durante la temporada de verano."
 cde_me_pon_pontic_shipyard:0 "Astillero Póntico"
 cde_me_pon_economic_hegemons:0 "Hegemonía económica"
 desc_cde_me_pon_economic_hegemons:0 "La ciudad de Amisos sirve como vínculo entre el Ponto y las ciudades costeras griegas del Mar Negro, lo que a su vez nos permite unificar estas ciudades más pequeñas bajo la moneda póntica, más abundante."
 cde_me_pon_cultural_integration:0 "Política de integración cultural"
 cde_me_pon_hellenistic_poleis:0 "Poleis helenística"
 desc_cde_me_pon_hellenistic_poleis:0 "Al aplicar una política de helenización mediante la construcción de poleis de estilo griego en todo nuestro reino, a su vez hemos inspirado a nuestros pueblos, tanto griegos como no griegos, a participar en la helenización para lograr una mayor movilidad social en nuestro reino."
 cde_me_pon_greek_mercenary_ties:0 "Lazos mercenarios griegos"
 desc_cde_me_pon_greek_mercenary_ties:0 "Nuestra bien ganada reputación como clientes justos de los mercenarios griegos nos ha convertido en un cliente atractivo para los mercenarios de todo el país."
 cde_me_pon_philhellene_of_pontus:0 "Filhelenos del Ponto"
 cde_me_pon_protector_of_hellenes:0 "Protector de los griegos"
 cde_me_pon_paphlagonian_ancestral_lands:0 "Tierras Ancestrales"
 desc_cde_me_pon_paphlagonian_ancestral_lands:0 "Paflagonia es la tierra ancestral de los Mitrídates; Por lo tanto, su integración en el reino ha sido una bendición para los paflagonios locales, que son tratados como iguales por los gobernadores locales Mitrídates."
 cde_me_pon_land_of_the_golden_fleece:0 "Tierra del Toisón de Oro"
 desc_cde_me_pon_land_of_the_golden_fleece:0 "Cólquida ha sido durante mucho tiempo una fuente de misterio y asombro para los griegos, ya que era la tierra en la que se guardaba el Vellocino de Oro. Ahora somos el primer estado helenístico que se apodera de la totalidad de la Cólquida."
 cde_me_pon_developed_emporion:0 "Emporion desarrollado"
 desc_cde_me_pon_developed_emporion:0 "Hemos construido sobre los cimientos establecidos por los griegos en Colchis para crear un próspero centro comercial a partir de esta ciudad."
