 rhodes_02_asia_task_15_tooltip:0 "Un gran almirante llamado #Y Agesimbrotus#! ascenderá de rango y tomará el mando de nuestra armada más grande.\n\n#Y Agesimbrotus#! debe ganar al menos #Y 10#! batallas navales para completar la siguiente tarea. Si pierde su almirante o ha muerto la tarea será #R Fallida#!"
 
