 rhodes_01_aegean_task_11_B_tooltip:0 "Hasta #Y 9#! POBs se convertirán a la cultura #Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!."
 
 rhodes_01_aegean_task_12_A_tooltip:0 "Al menos #Y 5#! territorios de la Isla de #Y [GetProvince('(int32)344').GetArea.GetName]#! cumplen con los siguientes requisitos:\n*Tiene el estatus de #Y Ciudad#! o #Y Metrópolis#!\n*Tiene al menos #Y 20#! POBs\n*Tiene al menos #Y 5#! construcciones\n*No tiene construcciones en curso"
 
