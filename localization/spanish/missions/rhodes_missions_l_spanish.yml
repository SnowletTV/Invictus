 rhodes_01_aegean_task_7_B_tooltip:0 "El territorio de #Y [GetProvince('(int32)280').GetName]#! tiene construido un asentamiento agrícola y al menos #Y 5#! Esclavos@slaves!"
 
 rhodes_01_aegean_task_8_A_tooltip:0 "Tener una flota con al menos #Y 10#! Barcos Ligeros"
 rhodes_01_aegean_task_8_B_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! está aliado con cualquier nación de cultura #Y [GetProvince('(int32)358').GetCulture.GetName]#!"
 rhodes_01_aegean_task_8_C_tooltip:0 "Si nuestro aliado #Y Cretense#! tiene menos provincias que #Y [SCOPE.GetRootScope.GetCountry.GetName]#! entonces les mandaremos una petición para que se conviertan en nuestro #Y Feudatario#!"
 
