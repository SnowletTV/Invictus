l_spanish:
 
 01_salluvian:0 "Espadas de Salluvia"
 01_salluvian_DESCRIPTION:0 "Un rompecabezas de identidades tribales distintas, los #E Saluvianos#! (o Salluvii, o Salyes) residen en gran medida a lo largo del río Druentia, cerca del famoso río Rhodanos. Una mezcla de orígenes #E Liguria#! y #E Celta#!, son dueños del cruce entre los mercados y culturas de #E Iberia#!, #E Galia#! y #E Italia#!. A veces comerciantes, a veces piratas y a veces igualmente ambos, los saluvianos ocupan una posición distinta, aunque cambiante, en la política y la economía del Mediterráneo occidental, compitiendo con la colonia griega focea de [GetProvince('(int32)2325').GetName] por la participación de mercado en el comercio de productos galos. Algunos dicen que sus conflictos con Massalia se remontan al siglo VI a.C.\n\nPara superar las deficiencias de las estructuras tribales, necesitarán lograr la unidad y ganarse el respeto en la batalla, e incluso recurrir a la ayuda de los dioses más horribles de la guerra y el sacrificio."
 01_salluvian_CRITERIA_DESCRIPTION:0 "Esta misión se completará cuando las tribus saluvianas se hayan unido, hayan superado la amenaza masalia y controlen un extenso dominio dentro de la #E Galia#!."
 01_salluvian_BUTTON_TOOLTIP:0 "¡Las tribus sin cabeza se unen!"
 01_salluvian_BUTTON_DETAILS: ""
  
 #Missions
 
 01_salluvian_task_1:0 "Un pueblo celto-ligur"
 01_salluvian_task_1_DESC:0 "Aunque los #G ligures#! que viven al este tienen tradiciones diferentes a las nuestras, nuestra gente es amigable entre sí y [ROOT.GetCountry.GetRuler.GetName|Y] ve una oportunidad para que la gente de [ROOT.GetCountry.GetName|G] mejore nuestras conexiones con nuestra cursiva. Vecinos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 
 01_salluvian_task_2:0 "Culto a la cabeza cortada"
 01_salluvian_task_2_DESC:0 "[GetDeityDefinition('omen_rudianos').GetName|R], el Jinete manchado de sangre que infunde terror en los corazones de sus enemigos, ha sido durante mucho tiempo una deidad por la que [ROOT.GetCountry.GetRuler.GetName|Y] se ha sentido atraído.\n\nPara demostrar a los #G Saluvianos#! que la victoria en la batalla ha sido garantizada por el #R Dios Rojo#!, nuestro [ROOT.GetCountry.GetRulerTitle] lo hará liderar un grupo de nuestros guerreros en una incursión en #G Galia#! para tomar la cabeza de un guerrero enemigo.\n\n#Y Esto iniciará un evento cadena.#!\n\n\n\n\n\n\n\n\n\n\n@celt_mil17!"
 
 01_salluvian_task_3:0 "Reino de la cabeza cortada"
 01_salluvian_task_3_DESC:0 "Ya famosos por su crueldad bajo la mirada de [GetDeityDefinition('omen_rudianos').GetName|R], los saluvianos deben rendir homenaje al #R dios original de la cabeza cortada#!, a quien alaban con entierros rituales y la costumbre de decapitaciones en el campo de batalla. Sólo como un verdadero estado de culto pueden lograr el dominio en la #G Galia#! y el mundo conocido. #!\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 
 01_salluvian_task_4:0 "Vecinos amigables"
 01_salluvian_task_4_DESC:0 "Para bien o para mal, la ciudad de [GetProvince('(int32)2325').GetName|T] domina la región y asegurar su amistad será una bendición para [ROOT.GetCountry.GetName|G] en los próximos días. [ROOT.GetCountry.GetRuler.GetName|T] ha sugerido que busquemos buenas relaciones con los #G griegos#! con la esperanza de aprender más sobre ellos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 
 01_salluvian_task_5:0 "La cuestión Massaliana"
 01_salluvian_task_5_DESC:0 "La amistad entre [ROOT.GetCountry.GetRuler.GetName|Y] y [GetProvince('(int32)2325').GetState.GetGovernorOrRuler.GetName|Y] ha iniciado un debate polémico en [ROOT.GetCountry.GetCapital.GetName|T], uno que podría causar resentimientos entre nuestros jefes tribales que durarán mucho después de que estas discusiones hayan concluido. Los guerreros líderes no pueden decidir cómo lidiar con [GetProvince('(int32)2325').GetName|T]; ¿Son amigos o enemigos de [ROOT.GetCountry.GetName|G]? [ROOT.GetCountry.GetRuler.GetName|T] tendrá que decidir.\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 
 01_salluvian_task_6:0 "Capital saluviana"
 01_salluvian_task_6_DESC:0 "Aunque nuestros abuelos fueron enterrados con los cielos abiertos de la noche como sudario, contentos de pasar sus días vagando por los bosques y colinas y durmiendo en los campos, [ROOT.GetCountry.GetRuler.GetName|Y] sostiene que los tiempos han cambiado y las tribus de [ROOT.GetCountry.GetName|G] deben construir estructuras permanentes para albergar a nuestra gente: grandes ciudades saluvianas que durarán siglos venir.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 
 01_salluvian_task_7:0 "Centro de Comercio Ibero-Itálico"
 01_salluvian_task_7_DESC:0 "Es sabido en toda la provincia [ROOT.GetCountry.GetCapital.GetArea.GetName|Y] que [ROOT.GetCountry.GetCapital.GetName|T] alberga algunos de los mejores mercados que se pueden encontrar en toda la región, y comerciantes de lugares tan lejanos como [GetProvince('(int32)54').GetName|T] y [GetProvince('(int32)1031').GetName|T] se pueden encontrar deambulando por sus calles en busca de lo mejor. Ofertas.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 
 01_salluvian_task_8:0 "Atacar a nuestros enemigos"
 01_salluvian_task_8_DESC:0 "[ROOT.GetCountry.GetRuler.GetName|Y], percibiendo una oportunidad de ganar algo de riqueza y gloria para las tribus de [ROOT.GetCountry.GetName|G], está reuniendo guerreros al lado de [ROOT.GetCountry.GetRuler.GetHerHis] para una incursión en las tierras de nuestro enemigos.\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 
 01_salluvian_task_9:0 "Ciudades del Sinus Gallicus"
 01_salluvian_task_9_DESC:0 "Ahora que la poderosa ciudad de [GetProvince('(int32)2325').GetName|T] ha caído ante nuestras fuerzas, [ROOT.GetCountry.GetRuler.GetName|Y] ha anunciado audazmente que [ROOT.GetCountry.GetRuler.GetSheHe] tiene planes para someter todas las ciudades que rodean las aguas del #Y Sinus. Gallicus#!.\n\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 
 01_salluvian_task_10:0 "Unión Saluviana"
 01_salluvian_task_10_DESC:0 "Gracias a los esfuerzos de [ROOT.GetCountry.GetRuler.GetName|Y] y [ROOT.GetCountry.GetRuler.GetHerHis] parientes, las #T tribus saluvianas#! se han unido bajo una sola bandera: todos saludan a los guerreros conquistadores de los #G [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] ¡Tribu!#!\n\n\n\n\n\n\n\n\n\n\n@italic_mil13!"
 
 01_salluvian_task_11:0 "Espadas de Salluvia"
 01_salluvian_task_11_DESC:0 "Desde nuestros humildes comienzos, hemos crecido hasta convertirnos en un poderoso agente regional; Las potencias extranjeras buscan nuestra amistad y comercio, y sus generales toman en consideración nuestra fuerza cuando contemplan invasiones de nuestras tierras. Que las #T Espadas de Salluvia#!, la generación que nos sacó de la oscuridad y luchó para llegar a la cima, protejan durante mucho tiempo nuestros intereses en la tierra y mar!\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 
 01_salluvian_task_12:0 "Tierras de cultivo saluvianas"
 01_salluvian_task_12_DESC:0 "Debemos aprovechar las tierras que nos dieron los dioses y hacer lo mejor para la gente de [ROOT.GetCountry.GetName|G], y eso incluye asegurarnos de que las tribus tengan suficiente comida para comer.\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 
 01_salluvian_task_13:0 "Regalos de Gobannus"
 01_salluvian_task_13_DESC:0 "[GetDeityDefinition('omen_gobannus').GetName|G] ha hecho promesas a [ROOT.GetCountry.GetRuler.GetName|Y] en [ROOT.GetCountry.GetRuler.GetHerHis] sueños; si el gran [ROOT.GetCountry.GetRulerTitle] desarrolla las tierras de [GetProvince('(int32)2316').GetName|T] y [GetProvince('(int32)2317').GetName|T] en las orillas del #Y río Rhodanus#!, entonces el #G patrón de los herreros#! bendecirá la tierra y hará las minas. Productivo.\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 
 01_salluvian_task_14:0 "La fundición"
 01_salluvian_task_14_DESC:0 "Nuestra capital de [ROOT.GetCountry.GetCapital.GetName|T] ha surgido rápidamente de la oscuridad para convertirse en uno de los lugares más importantes de todo [ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName|Y], y nuestra ciudad es aclamada en todas partes por la gente trabajadora que vive dentro de ella. Paredes.\n\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 
 01_salluvian_task_15:0 "Sardoum saluviano"
 01_salluvian_task_15_DESC:0 "Los temibles #R Piratas de Mago#! han estado acosando a nuestros barcos mercantes en el #Y Mare Sardoum#! durante demasiado tiempo, dando a [ROOT.GetCountry.GetRuler.GetName|Y] una razón para reclamar su isla para las tribus de [ROOT.GetCountry.GetName|G]. El [ROOT.GetCountry.GetRulerTitle] no sólo ha puesto [ROOT.GetCountry.GetRuler.GetHerHis] los ojos en [GetProvince('(int32)2325').GetName|T], sino que [ROOT.GetCountry.GetRuler.GetSheHe] incluso tiene la audacia de reclamar #T Córcega#! para el Saluvianos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 
 01_salluvian_task_16:0 "Los bosques de Agathom"
 01_salluvian_task_16_DESC:0 "Los densos bosques de [GetProvince('(int32)3541').GetName|T] se abren a las llanuras que conducen a #T Italia#!, lo que hace que los bosques sean estratégicamente importantes para [ROOT.GetCountry.GetName|G]. Para frenar las invasiones terrestres desde el este, [ROOT.GetCountry.GetRuler.GetName|Y] está preparado para construir fuertes fortificaciones y entrenar a nuestros guerreros.\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 
 
 #Tooltips
 celto_ligurian_culture_tt:0 "La #G cultura de Liguria#! necesita #T derechos ciudadanos#!."
 celto_ligurian_opinion_boost_tt:0 "Todos los países con #G Cultura de Liguria#! recibirán #T 50 opiniones#! de nosotros."
 celto_ligurian_ally_tt:0 "Necesitamos ser #T aliados#! de un país que tiene #G cultura de Liguria#!."
 salluvian_10_ship_tooltip:0 "Tiene una flota con al menos #Y 10#! barcos ligeros que tiene un almirante con al menos #Y 6#! #E Finesse#!@civic_icon!"
 we_need_to_hire_mercenary_tt:0 "#Y Necesitamos tener un#! #T Ejército Mercenario#! #Y empleado#!."
 we_have_formed_salluvian_confederacy_tt:0 "Necesitamos tomar la decisión #Y Formar la Confederación Saluviana#!."
 we_need_2_stone_surplus_tt:0 "Necesitamos un excedente de #T 2 Stone#! @stone! en nuestro capital."
 we_need_4_stone_surplus_tt:0 "Necesitamos un excedente de #T 4 Stone#! @stone! en nuestra capital."
 direct_investments_saluvian_tt:0 "Necesitamos utilizar #T Entice Business Invesments#! en #Y Verunia#!."
 salluvian_farms_task_tt:0 "Necesitamos poseer al menos #Y 5#! #T Granjas#! en las áreas resaltadas. (#R [SCOPE.ScriptValue('salluvian_farms_task_current')|0]#!/#Y 5#!)"
 gobannus_omen_active_tt:0 "Nuestro país tiene el #Y Gobannus Omen#! #T Activo#!."
 befriend_governor_of_massalia_tt:0 "Nuestro gobernante debe ser #G Amigo#! del gobernador de #T Massalia#!."
 send_dem_massalians_a_gift_cuh:0 "Debemos enviar un regalo al #G Gobernador#! de #T Massalia#!."
 salluvians_must_raid_into_massalia:0 "Nuestro Jefe Tribal debe utilizar la #R Go Raiding#! #T Interacción de personajes#!."
 salluvia_empire_severed_head_tt:0 "Nuestro Jefe Tribal será honrado en una #Y Ceremonia#!."
 me_salluvian_16_tooltip_head:0 "Nuestro gobernante #R decapitará#! al guerrero."
 me_salluvian_16_tooltip_hurt:0 "Desafortunadamente para nosotros, nuestro #Y Gobernante#! resultó herido en el combate cuerpo a cuerpo."
 salluvia_regional_power_tt:0 "Salluvia debe ser una #Y potencia regional#! o superior."
 
 #Modifiers
 salluvian_farms_capital_mod:0 "Tierras de cultivo saluvianas"
 desc_salluvian_farms_capital_mod:0 "Las tribus saluvianas han construido muchas granjas en todo su territorio, asegurando que un suministro constante de alimentos llegue a su capital durante todo el año."
 ibero_italic_salluvian_mod:0 "Centro de Comercio Ibero-Itálico"
 desc_ibero_italic_salluvian_mod:0 "Este territorio alberga una plaza de mercado donde se dan cita comerciantes de todo el mundo ibérico e itálico."
 gobannus_salluvian_territory_mod:0 "Bendecido por Gobannus"
 desc_gobannus_salluvian_territory_mod:0 "Gobannus, gran dios de la herrería y la metalurgia, ha bendecido personalmente esta provincia y sus minas en nombre del pueblo saluviano a quien favorece."
 salluvian_foundry_modifier:0 "Fundición Saluviana"
 desc_salluvian_foundry_modifier:0 "Esta ciudad alberga una famosa fundición, conocida por ser la primera construida por el pueblo saluviano."
 SALLUVIAN_RAIDER_ARMY:0 "Asaltantes saluvianos"
 swords_of_salluvia_modifier:0 "Espadas de Salluvia"
 desc_swords_of_salluvia_modifier:0 "Los saluvianos, dueños de su región de origen, tienen un ejército temido y respetado que ha ganado muchas batallas en los últimos años."
 salluvian_treasure:0 "Cabeza cortada de un caudillo galo"
 desc_salluvian_treasure:0 "Nuestros asaltantes han tomado la cabeza de un guerrero famoso en honor al dios Rudianos."
 salluvian_raiders_mod:0 "Asaltantes saluvianos"
 desc_salluvian_raiders_mod:0 "Muchos temen a los alborotadores saluvianos, porque les encanta saquear y despojar los territorios por los que pasan."
 salluvian_mercenaries_mod:0 "Mercenarios mediterráneos"
 desc_salluvian_mercenaries_mod:0 "La conquista de Massalia le ha valido a Salluvia un asiento en la mesa de la política mediterránea, y su reputación como saqueadores y guerreros les ha valido a los saluvianos el respeto de muchas compañías mercenarias."
 salluvian_fortress_building_mod:0 "Fortalezas forestales"
 desc_salluvian_fortress_building_mod:0 "Los saluvianos han fortificado los bosques de Agathom para frenar las invasiones terrestres."
 salluvian_forest_fighters_mod:0 "Luchadores del bosque"
 desc_salluvian_forest_fighters_mod:0 "La defensa de Agathom requiere ejércitos expertos en luchar en los bosques, y los saluvianos están excepcionalmente dotados en este sentido."
 
 
 #Events
 me_salluvian_1_title:0 "$01_salluvian_task_1$"
 me_salluvian_1_desc:0 "En el pasado, nuestros #E vecinos de Liguria#! nos miraban con una mezcla de miedo y odio, considerándonos habitantes de las llanuras atrasados que podían salir de nuestros fuertes en cualquier momento y saquear sus ciudades; una reputación que medio merecemos, [ROOT.GetCountry.GetRuler.GetName] admite tímidamente, porque definitivamente hemos asaltado sus tierras y tomado esclavos cuando convenía a nuestras necesidades.\n\nY por eso se sorprendieron cuando se enteraron de que a sus pueblos se les había otorgado plenos derechos de #E ciudadanía#! @citizen! dentro de [ROOT.GetCountry.GetName]. Nuestro [ROOT.GetCountry.GetRulerTitle], siempre buscando aliados y amigos donde [ROOT.GetCountry.GetRuler.GetSheHe] puede, ha llamado a los ligures aliados naturales del [ROOT.GetCountry.GetAdjective] y cree que nuestros pueblos serán más fuertes juntos."
 me_salluvian_1.a:0 "¡Que este sea el comienzo de una hermosa amistad!"
 me_salluvian_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_1$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_2_title:0 "$01_salluvian_task_2$"
 me_salluvian_2_desc:0 "En un esfuerzo por honrar a los dioses de la guerra que han bendecido a [ROOT.GetCountry.GetName] con una victoria sin fin, [ROOT.GetCountry.GetRuler.GetName] ha reunido un grupo de asaltantes cerca de [ROOT.GetCountry.GetCapital.GetName] para una sombría aventura; cabalgando hacia las tierras de nuestros vecinos, encontrando un guerrero enemigo, derrotándolo en batalla y luego cortándole la cabeza en un ritual religioso. Los hombres que fueron seleccionados para acompañar al [ROOT.GetCountry.GetRulerTitle] habían demostrado ser manos capaces una y otra vez, haciéndolos adecuados para la tarea en cuestión, y los guerreros estaban discutiendo en qué dirección debían ir. \n\nLos presagios eran neutrales, no ofrecían consejos pero tampoco advertencias... todo dependerá de [ROOT.GetCountry.GetRuler.GetFirstName]."
 me_salluvian_2.a:0 "Cabalgaremos hacia el norte a través de las #E Tierras Altas Arvernas#!"
 me_salluvian_2.b:0 "Sigamos la costa y crucemos el Rhodanus."
 me_salluvian_2.c:0 "He cambiado de opinión y ya no quiero hacer esto."
 me_salluvian_2_tooltip:0 "#Y Reuniremos a los guerreros y nos iremos de inmediato.#!"
 me_salluvian_2_tooltip2:0 "#Y La cadena de eventos finalizará.#!"
 
 me_salluvian_3_title:0 "Devoción a la cabeza cortada"
 me_salluvian_3_desc:0 "Con los #E Saluvii#! ganando todas las batallas bajo la bandera roja de [GetDeityDefinition('omen_rudianos').GetName] y alabando a los [GetDeityDefinition('omen_severed_head').GetName] con tributos en forma de calavera y cabezas en picas, la horda de guerreros saluvianos parece imparable. En una gran ceremonia, el [ROOT.GetCountry.GetRulerTitle] ha consultado los huesos, los ojos vacíos de las calaveras y los druidas para determinar si el camino que siguen los Saluvii no puede llevar a otra parte que a un culto ritual permanente a la violencia decapitadora. ¿Abrazarán los pueblos tribales una visión más amplia de guerra y sacrificio por la causa de una mayor prosperidad y dominación?"
 me_salluvian_3.a:0 "¡Viva el #E Reino de la Cabeza Cortada!#!"
 me_salluvian_3.b:0 "Debemos seguir siendo modestos a nuestra manera, fieles a nuestras raíces."
 
 me_salluvian_4_title:0 "$01_salluvian_task_4$"
 me_salluvian_4_desc:0 "En los últimos meses, la amistad entre [ROOT.GetCountry.GetRuler.GetName] y [GetProvince('(int32)2325').GetState.GetGovernorOrRuler.GetName] ha crecido, y los dos mantienen una estrecha correspondencia entre sí.\n\nLas discusiones entre los dos líderes eventualmente giraron hacia las disparidades tecnológicas entre los reinos bárbaros y griegos, y [GetProvince('(int32)2325').GetState.GetGovernorOrRuler.GetFirstName] decidió que sería mejor compartir el conocimiento que la gente [GetProvince('(int32)2316').GetState.GetGovernorOrRuler.GetHerHis] había acumulado."
 me_salluvian_4.a:0 "Lo que dicen es verdad: los griegos son generosos y sabios."
 me_salluvian_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_4$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_5_title:0 "$01_salluvian_task_5$"
 me_salluvian_5_desc:0 "[ROOT.GetCountry.GetRuler.GetName] pospuso la reunión entre [ROOT.GetCountry.GetRuler.GetHerHim] y [ROOT.GetCountry.GetRuler.GetHerHis] jefes tribales el mayor tiempo posible, y no porque [ROOT.GetCountry.GetRuler.GetSheHe] estuviera evitando [ROOT.GetCountry.GetRuler.GetHerHis] deberes. No, la verdadera razón era una de la que [ROOT.GetCountry.GetRulerTitle] ya no podía esconderse, a pesar de que le dolía el corazón a [ROOT.GetCountry.GetRuler.GetHerHis]; a pesar de las relaciones amistosas entre [ROOT.GetCountry.GetName] y [GetProvince('(int32)2325').GetOwner.GetName], no podía haber una coexistencia a largo plazo entre los dos, y [ROOT.GetCountry.GetRuler.GetFirstName] lo sabía.\n\nSi bien las cosas estaban bien ahora, podrían cambiar en un solo día, y en lugar de esperar a que los #E Massalianos#! invadan, el Consejo Tribal ha decidido que debemos atacar primero. Todo lo que queda es seleccionar nuestras tácticas de batalla; un privilegio que tradicionalmente se concede al [ROOT.GetCountry.GetRulerTitle].\n\n[SCOPE.sCharacter('clan_chief_one').GetName] ha convocado a una banda de nuestros jinetes más poderosos a reunirse en [ROOT.GetCountry.GetCapital.GetName], mientras que [SCOPE.sCharacter('clan_chief_two').GetName] ha argumentado que nuestra prioridad debería ser acumular nuestro fondo de guerra para un conflicto futuro. [ROOT.GetCountry.GetRuler.GetFirstName] debe decidir qué propuesta tiene más sentido."
 me_salluvian_5.a:0 "¡Llamo a los guerreros más audaces y valientes para que luchen a mi lado!"
 me_salluvian_5.b:0 "Aprovecha todo el oro de los miembros de la tribu que viven en [ROOT.GetCountry.GetName]"
 me_salluvian_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_5$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_6_title:0 "$01_salluvian_task_6$"
 me_salluvian_6_desc:0 "A muchos les sorprendió saber que los #E saluvianos#! habían construido su propia ciudad, y muchos se rieron ante la idea de que las tribus galas atrasadas intentaran construir su propia versión de [GetProvince('(int32)2325').GetName]. Pero aquellos que nos llaman salvajes nos han subestimado gravemente, y la ciudad construida en [GetProvince('(int32)3523').GetName] algún día será conocida como una de las ciudades más grandes del sur de la #E Galia#! - esta es la promesa que [ROOT.GetCountry.GetRuler.GetName] ha hecho ante los dioses de [ROOT.GetCountry.GetName]."
 me_salluvian_6.a:0 "¡Que la familia [ROOT.GetCountry.GetRuler.GetFamily.GetName] reine durante mucho tiempo en esta nueva ciudad!"
 me_salluvian_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_6$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_7_title:0 "$01_salluvian_task_7$"
 me_salluvian_7_desc:0 "Los crecientes mercados de [GetProvince('(int32)3523').GetName] requieren un acceso rápido y fácil al agua, ya que las rutas terrestres apenas pueden mantener la capital saluviana abastecida de bienes comerciales. Miembros de tribus de todas partes [GetProvince('(int32)3523').GetArea.GetName] viajan a nuestra ciudad para comprar sus productos, porque confían más en nuestros honestos vendedores galos que en los pérfidos griegos y púnicos que les cobran de más. E incluso los #E comerciantes helenos#! se están sumando a la acción, eludiendo los aranceles e impuestos que encuentran en [GetProvince('(int32)2325').GetName] y viniendo directamente a nosotros, donde encontrarán mejores mercancías a la mitad de precio.\n\nPara facilitar el comercio, se han construido carreteras entre la capital y el puerto en [GetProvince('(int32)2319').GetName], y se habla de eventualmente construir canales que unirán los canales más pequeños. Se envía al #E Rhodanus#!."
 me_salluvian_7.a:0 "Lento pero seguro, nuestra infraestructura crece..."
 me_salluvian_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_7$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_8_title:0 "$01_salluvian_task_8$"
 me_salluvian_8_desc:0 "Nuestra reciente incursión en las tierras de nuestros vecinos ha despertado un apetito feroz en nuestras levas, muchas de las cuales nunca habían abandonado sus aldeas antes de embarcarse en nuestra excursión. Nuestros hombres, viendo lo fácil que es robar a otros y esperando enriquecerse a costa de esclavizar y despojar a nuestros vecinos, han suplicado [ROOT.GetCountry.GetRuler.GetName] que los envíe al campo; todos están desesperados por hacer fortuna como sea, ya sea saqueando granjas o ciudades."
 me_salluvian_8.a:0 "Atacaré cuando sea el momento adecuado, pero no es ahora..."
 me_salluvian_8.b:0 "¡Marchamos por Massalia! ¡Los dioses nos concederán la victoria!"
 me_salluvian_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_8$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_9_title:0 "$01_salluvian_task_9$"
 me_salluvian_9_desc:0 "Además de tomar la propia ciudad de [GetProvince('(int32)2325').GetName] (un premio prestigioso que, sin duda, era de una categoría propia), los saluvianos victoriosos se sorprendieron al encontrar los tesoros de la ciudad llenos de oro. \n\n[ROOT.GetCountry.GetRuler.GetName] decidió, en ese mismo momento, que [ROOT.GetCountry.GetName] prepararía reclamaciones sobre las ciudades cercanas, con la esperanza de que los dioses nos bendijeran con aún más botín y riqueza."
 me_salluvian_9.a:0 "¡Saquearemos los tesoros de las ciudades que conquistemos!"
 me_salluvian_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_9$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_10_title:0 "$01_salluvian_task_10$"
 me_salluvian_10_desc:0 "Llega un momento en que todas las cosas son destruidas; [ROOT.GetCountry.GetRuler.GetName], el [ROOT.GetCountry.GetRuler.GetHerHim] destructor de muchas cosas, sabe que esto es un hecho y lo acepta.\n\nY sin embargo, en los días venideros, cuando el poder de [ROOT.GetCountry.GetCapital.GetName] haya menguado y la fuerza de otros surja para tomar su lugar, el nombre de [ROOT.GetCountry.GetRuler.GetFirstName], [ROOT.GetCountry.GetRuler.GetSheHe] que reunió a #E Los saluvianos#! formaron una confederación y construyeron ciudades en su honor, no serán olvidados."
 me_salluvian_10.a:0 "¡Todos saluden a [ROOT.GetCountry.GetRuler.GetFirstName] 'El Grande'!"
 me_salluvian_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_10$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_11_title:0 "$01_salluvian_task_11$"
 me_salluvian_11_desc:0 "Gracias a los esfuerzos de [ROOT.GetCountry.GetRuler.GetName] para centrarnos en aumentar nuestra preparación militar, los ejércitos de [ROOT.GetCountry.GetName] son conocidos por ser guerreros feroces que no cederán terreno a sus enemigos, y podemos proteger nuestros intereses en tierra y mar.\n\nNuestro poder militar asegura nuestra independencia, y no estamos obligados a doblegarnos ante los caprichos de ningún tirano, ya sea #E Griego#! o #E galo#!. La #E [ROOT.GetCountry.GetRuler.GetFamily.GetName] Tribu#! ha traído a nuestra gente a esta tierra y nos ha establecido aquí, derrotando a enemigos poderosos y ganándonos el respeto de reyes extranjeros. Por ello, los saluvianos lucharán por ellos."
 me_salluvian_11.a:0 "¡Conmigo como vuestro líder, traeré gloria a los saluvianos!"
 me_salluvian_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_11$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_12_title:0 "$01_salluvian_task_12$"
 me_salluvian_12_desc:0 "No solo hemos sido bendecidos con tierras buenas y fértiles, sino que también se nos han dado líderes como [ROOT.GetCountry.GetRuler.GetName] que prevén la sabiduría de construir granjas además de fortalezas. Mientras que algunos jefes tribales han descuidado el campo y la gente común en favor de los ejércitos y las ciudades, [ROOT.GetCountry.GetRuler.GetFirstName] se ha asegurado de que las tesorerías de [ROOT.GetCountry.GetName] se hayan abierto para proyectos mundanos como la construcción de granjas y minas."
 me_salluvian_12.a:0 "Cultivar alimentos no es glamuroso, pero es necesario"
 me_salluvian_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_12$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_13_title:0 "$01_salluvian_task_13$"
 me_salluvian_13_desc:0 "Noche tras noche, [ROOT.GetCountry.GetRuler.GetName] era visitado por [GetDeityDefinition('omen_gobannus').GetName] en [ROOT.GetCountry.GetRuler.GetHerHis] sueños, y siempre ocurría lo mismo. Mientras caminaba junto al río caudaloso en un día nublado, el [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] vio al patrón de los herreros emergiendo de las aguas del #E Rhodanus#!, con los ojos brillando con el fuego de la fragua y la boca llena de luz.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] sabía exactamente lo que el dios estaba tratando de decir sin tener que decir nada en absoluto; El oro @precious_metals! y otros minerales valiosos estaban escondidos en las orillas rocosas del río, y Gobannus bendeciría nuestros esfuerzos por apoderarnos de todo."
 me_salluvian_13.a:0 "¡Haremos un buen uso de todo esto, oh grande!"
 me_salluvian_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_13$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_14_title:0 "$01_salluvian_task_14$"
 me_salluvian_14_desc:0 "Si bien [ROOT.GetCountry.GetRuler.GetName] se enorgullece [ROOT.GetCountry.GetRuler.GetHerHim] de muchas cosas, uno de los logros distintivos del reinado [ROOT.GetCountry.GetRuler.GetHerHis] fue la construcción de la #E Fundición#!, la primera de su tipo jamás construida dentro de nuestra nación, en la ciudad de [ROOT.GetCountry.GetCapital.GetName].\n\nNuestra gente ha aprendido mucho del #E Griegos#! que hemos conquistado; Sería una tontería negar su evidente influencia. Y, sin embargo, [ROOT.GetCountry.GetRuler.GetFirstName] ha logrado enhebrar con éxito la aguja donde otros habrían fracasado; [ROOT.GetCountry.GetRuler.GetSheHe] se ha asegurado de mantener nuestra identidad única mientras adoptamos las costumbres extranjeras que se adaptan a nuestras necesidades."
 me_salluvian_14.a:0 "Que esta #E Fundición#! sea de utilidad para los hijos de nuestros hijos..."
 me_salluvian_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_14$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_15_title:0 "$01_salluvian_task_15$"
 me_salluvian_15_desc:0 "Durante demasiado tiempo, los piratas que salen de [GetProvince('(int32)1469').GetName] han sido una amenaza a la que nadie ha podido hacer frente. Los crueles isleños baleares se deleitan atacando nuestras costas, robando a nuestros parientes para sus barcos de esclavos e incendiando nuestros asentamientos antes de regresar a la seguridad de sus hogares.\n\n[ROOT.GetCountry.GetRuler.GetName], al darse cuenta de que estaba en [ROOT.GetCountry.GetRuler.GetHerHis] poder detener esto, ordenó que se prepararan reclamaciones en las islas. El ambicioso [ROOT.GetCountry.GetRulerTitle], viendo la oportunidad de hacer fortuna, decidió que [ROOT.GetCountry.GetName] se haría cargo de la piratería del #E Mare Sardoum#! por derecho de conquista."
 me_salluvian_15.a:0 "¡Si nadie puede detener a los piratas, entonces ellos no podrán detenernos a nosotros!"
 me_salluvian_15.b:0 "¡Navegamos hacia sus islas antes del anochecer!"
 me_salluvian_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_salluvian_task_15$#!' $mission_completed_tooltip_2$"
 
 me_salluvian_16_title:0 "Muerte de un guerrero arverno"
 me_salluvian_16_desc:0 "Después de cabalgar durante unas horas, nuestros guerreros se encontraron con un #E hombre arverno#! caminando solo por el camino, y se decidió en ese momento que esta pobre alma se convertiría en un sacrificio para [GetDeityDefinition('omen_rudianos').GetName]. El arverno luchó con todas sus fuerzas para resistirse a la captura, pero sólo estaba armado con una daga y no era rival para nuestro grupo. El galo logró herir a algunos de los nuestros antes de ser sometido y arrastrado ante [ROOT.GetCountry.GetRuler.GetName], quien estaba listo, espada en mano, para cortarle la cabeza."
 me_salluvian_16.a:0 "Por los dioses, estoy sangrando...te haré sufrir"
 me_salluvian_16.b:0 "¡Ofrezco esta cabeza a [GetDeityDefinition('omen_rudianos').GetName]!"
 me_salluvian_16_tooltip:0 "Esta opción está disponible debido a la habilidad #Y Marcial#! de tu gobernante."
 
 me_salluvian_17_title:0 "El rico comerciante masiliano"
 me_salluvian_17_desc:0 "Nuestros guerreros permanecieron cerca de la costa todo el tiempo después de haber cruzado el apresurado #E Rhodanus#!, y debido a que decidieron permanecer cerca de las carreteras principales, pronto se encontraron con un comerciante y su esclavo caminando juntos, perdidos en una profunda conversación y sin darse cuenta de que estaban cruzando las puertas de la muerte. Momentos después, el esclavo estaba en el suelo, con los ojos mirando sin vida al cielo, y su amo magullado y ensangrentado, un nombre Massiliot [SCOPE.sCharacter('poor_massalian_lost_head_scope').GetName], estaba de rodillas, suplicando y suplicando por su vida. \n\n 'Jura a tus dioses que me liberarás y te llevaré a un tesoro enterrado... ¡Te prometo que no miento! Puedo darte oro... ¡solo prométeme que me perdonarás la vida!'"
 me_salluvian_17.a:0 "¿Qué es eso del tesoro enterrado?"
 me_salluvian_17.b:0 "Honrar a los dioses es el único regalo que necesito."
 me_salluvian_17_tooltip:0 "Nuestro #Y gobernante#! acepta el rescate y libera al prisionero Massiliot."
 
 me_salluvian_18_title:0 "El regreso triunfante"
 me_salluvian_18_desc:0 "Fue con el sonido de una multitud regocijada que [ROOT.GetCountry.GetRuler.GetName] y el séquito [ROOT.GetCountry.GetRuler.GetHerHis] regresaron a [ROOT.GetCountry.GetCapital.GetName], porque los guardias habían dejado correr la voz de que [ROOT.GetCountry.GetRulerTitle] regresaría hoy.\n\nCuando [ROOT.GetCountry.GetRuler.GetFirstName] entró por la puerta occidental, [ROOT.GetCountry.GetRuler.GetSheHe] sostuvo en [ROOT.GetCountry.GetRuler.GetHerHis] manos la cabeza cortada que [ROOT.GetCountry.GetRuler.GetSheHe] había tomado, mostrándolo con orgullo a los miles de personas reunidas en las calles de la capital [ROOT.GetCountry.GetAdjective] - una visión espantosa que provocó que multitudes masivas vitorearan el nombre de [ROOT.GetCountry.GetRuler.GetHerHis]."
 me_salluvian_18.a:0 "¡[GetDeityDefinition('omen_rudianos').GetName] y el [GetDeityDefinition('omen_severed_head').GetName] sean alabados!"
 me_salluvian_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y Culto a la cabeza cortada#!' $mission_completed_tooltip_2$"
 
 me_salluvian_19_title:0 "Los bosques de Agathom"
 me_salluvian_19_desc:0 "El miedo a un ejército invasor del este ha mantenido a [ROOT.GetCountry.GetRuler.GetName] despierto durante muchas noches mientras [ROOT.GetCountry.GetRuler.GetSheHe] contempla lo que parece inevitable. Si bien tenemos muchas amenazas en toda #E Galia#! de las que aún debemos tener en cuenta, no podemos darnos el lujo de ignorar la amenaza que representa #E Italia#!.\n\nDespués de considerar nuestras mejores opciones, [ROOT.GetCountry.GetRuler.GetFirstName] implementamos dos iniciativas simultáneamente; nuestros trabajadores construirían muros, zanjas y fuertes fortificaciones en todos los bosques de [GetProvince('(int32)3541').GetName] mientras nuestros ejércitos se entrenaban en los mismos bosques. Nuestros guerreros pronto conocerán estos bosques como la palma de sus manos, aprovechando el terreno para atacar sin piedad. La esperanza de [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] es que estos esfuerzos hagan la vida difícil a cualquier amenaza potencial, pero sólo el tiempo dirá si esto será suficiente."
 me_salluvian_19.a:0 "Esperemos que estos muros resistan al invasor..."
 me_salluvian_19.b:0 "¡Construiré una ciudad con murallas en el bosque!"
 me_salluvian_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y Los bosques de Agathom#!' $mission_completed_tooltip_2$"
 
 
 #MISC
 
 NICKNAME_THE_SEVERER:0 "el más severo"
 NICKNAME_THE_SEVERED:0 "el cortado"
 KINGDOM_OF_SEVERED_HEAD:0 "Reino de la cabeza cortada"
