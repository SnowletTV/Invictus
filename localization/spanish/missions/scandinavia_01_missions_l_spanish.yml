 ####################
 # Title
 ####################

 scandinavian_missions_01: "Uniendo las tribus escandinavas"
 scandinavian_missions_01_DESCRIPTION: "En el extremo norte, hay tierras desconocidas para los cartógrafos e historiadores del mundo civilizado, un reino habitado por personas que viven vidas duras en los confines del mundo; #E Escandia#!. El sol va y viene cuando quiere, con inviernos largos y crueles que aparentemente duran todo el año, y durante los breves períodos de sol que adornan los cielos, los campos se tiñen de rojo con la sangre de los ejércitos en batalla.\n\nIncluso ahora, las nubes oscuras de la guerra se acumulan en el horizonte, y se corre la voz de conflictos entre las #E tribus escandinavas#! que viven en las tierras boscosas."
 scandinavian_missions_01_CRITERIA_DESCRIPTION: "Esta misión se completará cuando se haya formado la nación de #E Scandia#!."
 scandinavian_missions_01_BUTTON_TOOLTIP: "Nuestras glorias futuras nos esperan..."
 scandinavian_missions_01_BUTTON_DETAILS: ""

 ####################
 # Mission Tasks
 ####################

 scandinavian_missions_task_1: "Ultima Thule"
 scandinavian_missions_task_1_DESC: "Los territorios más occidentales de la provincia #T Ultima Thule#! están deshabitados, pero [ROOT.GetCountry.GetRuler.GetName|Y] tiene un plan para colonizar rápidamente el región.\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 scandinavian_missions_task_1_tt: "Enviaremos #G colonos#! a #T Ultima Thule#!."

 scandinavian_missions_task_2: "herulia"
 scandinavian_missions_task_2_DESC: "Los recursos minerales en el sur de #E Escandinavia#! exigen nuestros impuestos a esta región, porque quien posea estas ricas tierras será bastante rico. De hecho.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 scandinavian_missions_task_2_tt: "Recibiremos reclamaciones sobre la provincia de #T Herulia#!."

 scandinavian_missions_task_3: "Gothia occidental"
 scandinavian_missions_task_3_DESC: "Se dice que las tribus fuertes que viven en las regiones occidentales de #T Gothia#! son luchadores feroces e inigualables, pero los conquistaremos. Sin embargo.\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 scandinavian_missions_task_3_tt: "Recibiremos reclamaciones sobre la provincia de #T West Gothia#!."

 scandinavian_missions_task_4: "Gothia Oriental"
 scandinavian_missions_task_4_DESC: "Tomar #T Gothia Oriental#! traerá la valiosa isla de [GetProvince('(int32)6010').GetName|Y] a nuestras manos, lo que nos dará el control marítimo de las rutas comerciales del #E Oceanus. Sarmático#!.\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 scandinavian_missions_task_4_tt: "Recibiremos reclamaciones sobre la provincia de #T East Gothia#!."

 scandinavian_missions_task_5: "El botín de guerra"
 scandinavian_missions_task_5_DESC: "Ahora que hemos conquistado el norte y el sur de #T Escandia#!, disfrutemos de los frutos de nuestro trabajo saqueando la tierra y enviando esclavos a [ROOT.GetCountry.GetCapital.GetName|T].\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"

 scandinavian_missions_task_6: "Aplastar a los góticos"
 scandinavian_missions_task_6_DESC: "Las victoriosas levas [ROOT.GetCountry.GetAdjective] han aplastado a las tribus que vivían en #T Gothia#!, aumentando enormemente el tamaño de nuestras fronteras. ¡Todos saluden a [ROOT.GetCountry.GetRuler.GetName|Y] y a los ejércitos de [ROOT.GetCountry.GetName|T]! \n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"

 scandinavian_missions_task_7: "Escandinavia"
 scandinavian_missions_task_7_DESC: "Por fin, hemos derrotado a nuestros enemigos vecinos y sometido a sus jefes tribales; ahora estamos aquí para presenciar el nacimiento de #Y Scandia#!.\n\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 you_need_to_form_scandinavia: "Necesitamos tomar la decisión de #Y Formar Scandia#!."

 scandinavian_missions_task_8: "Asaltantes escandinavos"
 scandinavian_missions_task_8_DESC: "Hay ciudades al otro lado del agua en #T Britannia#! y en otros lugares civilizados con las que podríamos establecer conexiones comerciales, si así lo deseamos, pero con la misma facilidad podríamos lanzar incursiones en sus ciudades. Territorios...\n\n\n\n\n\n\n\n\n\n\n@celt_mil17!"
 scandian_pillage_bonus_var_tt: "Cuando nuestros ejércitos #R arrasen ciudades#!, ganaremos #G 2 % de investigación cívica#!."

 scandinavian_missions_task_9: "Reclamaciones de Caledonia"
 scandinavian_missions_task_9_DESC: "Ahora que hemos asegurado territorios centrales para nosotros, nos damos cuenta de que hay tierras al otro lado del agua que nos sería fácil tomar...\n\n\n\n\n\n\n\n\n\n\n@celt_mil16!"

 scandinavian_missions_task_10: "Una capital escandinava"
 scandinavian_missions_task_10_DESC: "Lo único que le falta a nuestra nación es una verdadera capital, pero este es un problema que solucionaremos. Una vez que hayamos elegido el sitio de nuestra capital nacional, comenzaremos a construir una ciudad inmediatamente.\n\n#Y Se nos dará la oportunidad de trasladar la capital de nuestra nación y se creará una ciudad. Construido.#!\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"

 scandinavian_missions_task_11: "Granjas escandinavas"
 scandinavian_missions_task_11_DESC: "Nuestra nación en crecimiento necesitará alimentos; construyamos granjas dondequiera que podamos, con la esperanza de sobrevivir a los fríos inviernos. \n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 scandinavian_missions_task_11_tt: "Necesitamos construir al menos #Y 5 asentamientos agrícolas#! en la región de #T Escandia#!."

 scandinavian_missions_task_12: "Sementales escandinavos"
 scandinavian_missions_task_12_DESC: "Hay muchas cosas que nos faltan, pero afortunadamente el acceso a los caballos @horses! no es una de ellas; deberíamos desarrollar [GetProvince('(int32)6024').GetName|Y] para aumentar el tamaño de nuestros rebaños y la fuerza de nuestra caballería.\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"


 ####################
 # Events
 ####################

 me_scandinavia_1_title: "El jefe ambicioso"
 me_scandinavia_1_desc: "Aunque la mayoría de los que viven en las civilizaciones del sur y del este nunca han oído hablar de los escarpados bosques de #E Escandia#! o de su gente, es un lugar próspero y vibrante, habitado por un gran número de tribus que compiten constantemente por la supremacía entre sí.\n\nAunque ningún hombre conoce el futuro, se cree que la unificación de las tierras salvajes del norte es inevitable... las historias Esperamos la llegada del primer gobernante que unirá #E Escandia#!."
 me_scandinavia_1.a: "Sé quién será esa persona..."
 me_scandinavia_1_tooltip: "Es hora de hacer historia..."

 me_scandinavia_2_title: "herulia"
 me_scandinavia_2_desc: "[ROOT.GetCountry.GetRuler.GetName] nunca ha negado sus [ROOT.GetCountry.GetRuler.GetHerHis] ambiciones, y tomar posesión de las tierras en el sur de #E Escandia#! ha sido durante mucho tiempo el sueño de [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle].\n\nLa provincia de #E Herulia#! controla el importante cruce terrestre hacia las #E islas cimbrias#!, que a su vez son la puerta de entrada al continente de #E Europa#!. Asegurar estos territorios nos dará un poder que hasta ahora nos era desconocido y aumentará enormemente nuestro prestigio en la región."
 me_scandinavia_2.a: "¡Los dioses están con nosotros, ya lo verás! ¡Herulia es nuestra!"
 me_scandinavia_2_tooltip: "$mission_completed_tooltip_1$ '#Y Herulia#!' $mission_completed_tooltip_2$"

 me_scandinavia_3_title: "Ultima Thule"
 me_scandinavia_3_desc: "[ROOT.GetCountry.GetRuler.GetName] no tuvo problemas para comprender por qué las costas occidentales de la provincia #E Ultima Thule#! no estaban reclamadas, ya que la tierra en sí era extremadamente pobre, incapaz de sustentar ninguna agricultura significativa y, además, azotada por el viento y empapada por la lluvia. Aunque había algunas regiones boscosas en las que se podían encontrar @woad! valiosas, no había mucho más que valiera la pena mencionar; la mayoría de los miembros de las tribus dispersas que vivían en Ultima Thule ejercían sus oficios en el mar, dependiendo de la pesca para sustentar a sus familias porque la caza era terrible y ningún cultivo sobrevivía a los devastadores inviernos.\n\nA pesar de estos factores limitantes, los [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] se dieron cuenta de la necesidad de reclamar estas tierras: no debemos permitir que ninguno de nuestros pretendientes rivales al poder se apodere de territorios que podrían beneficiarlos. Por lo tanto, los #E Ancianos Tribales#! propusieron un plan que permitiría a nuestros miembros de la tribu navegar desde el puerto en [GetProvince('(int32)6038').GetName] y construir pequeñas aldeas a lo largo de las costas. Sería costoso, pero podríamos apoderarnos de inmediato de cualquier tierra que actualmente no controlemos."
 me_scandinavia_3.a: "Me gusta cómo suena eso: enviar a los colonos por mar."
 me_scandinavia_3.b: "No es el momento adecuado para una expedición occidental..."
 me_scandinavia_3_tooltip: "$mission_completed_tooltip_1$ '#Y Última Thule#!' $mission_completed_tooltip_2$"
 me_scandinavia_3.a_tt: "Colonizaremos cualquier territorio no poblado en la provincia #T Ultima Thule#!."

 me_scandinavia_4_title: "Gothia occidental"
 me_scandinavia_4_desc: "[ROOT.GetCountry.GetRuler.GetName] ha anunciado audazmente reclamaciones sobre las tierras natales de algunas de las tribus más fuertes y poderosas que viven en toda #E Escandia#!, prácticamente garantizando que los [ROOT.GetCountry.GetAdjective] librarán una guerra de conquista decisiva en los próximos días.\n\nA medida que los rumores de hostilidades inminentes se extienden por los asentamientos rurales, las compañías mercenarias se han ido intensificando. Sus armas y conseguir suministros para las campañas venideras."
 me_scandinavia_4.a: "El derramamiento de sangre valdrá la recompensa; estoy seguro"
 me_scandinavia_4_tooltip: "$mission_completed_tooltip_1$ '#Y Oeste de Gothia#!' $mission_completed_tooltip_2$"

 me_scandinavia_5_title: "Gothia Oriental"
 me_scandinavia_5_desc: "Los territorios orientales de #E Escandia#! siempre han sido especiales para [ROOT.GetCountry.GetRuler.GetName], quien tiene buenos recuerdos de los veranos que pasó viajando por las costas cuando era [ROOT.GetCountry.GetRuler.GetHerHis] joven. Los bosques repletos de vida silvestre, el aire frío del mar que llena tus pulmones y te hace sentir realmente vivo por primera vez en tu vida, la impresionante costa de imponentes rocas que sobresalen de las aguas heladas, la amenaza de piratas errantes y grupos de asalto de esclavos... tiene algo para todos.\n\nTal vez fue la nostalgia lo que empujó a [ROOT.GetCountry.GetName] a reclamar la región, pero no importa cuál sea el Las motivaciones de [ROOT.GetCountry.GetRulerTitle] eran que el resultado sería el mismo."
 me_scandinavia_5.a: "Me complacerá volver una vez más a East Gothia..."
 me_scandinavia_5_tooltip: "$mission_completed_tooltip_1$ '#Y Gothia Oriental#!' $mission_completed_tooltip_2$"

 me_scandinavia_6_title: "El botín de guerra"
 me_scandinavia_6_desc: "[ROOT.GetCountry.GetRuler.GetName] ha podido llevar a [ROOT.GetCountry.GetName] a una serie de victorias impresionantes últimamente, un hecho que celebra toda la gente en [ROOT.GetCountry.GetCapital.GetName], que colma de elogios a [ROOT.GetCountry.GetRulerTitle].\n\nNuestro triunfante [ROOT.GetCountry.GetRulerTitle] ha traído las provincias lejanas de #E Ultima Thule#! y #E Herulia#! bajo nuestro control, ganándose [ROOT.GetCountry.GetRuler.GetFirstName] un lugar eterno en nuestras historias orales. Para celebrar esta trascendental ocasión, a nuestros ejércitos se les permitió saquear el campo en su camino de regreso a casa desde el campo de batalla, y los corrales de esclavos de [ROOT.GetCountry.GetCapital.GetName] bramaron un gemido de miseria mientras se llenaban con cientos de pobres almas."
 me_scandinavia_6.a: "¡Siempre lucharé para darle la victoria al pueblo [ROOT.GetCountry.GetAdjective]!"
 me_scandinavia_6_tooltip: "$mission_completed_tooltip_1$ '#Y El botín de guerra#!' $mission_completed_tooltip_2$"

 me_scandinavia_7_title: "Aplastar a los góticos"
 me_scandinavia_7_desc: "Al final, todo se redujo a un puñado de batallas decisivas libradas entre nuestras [ROOT.GetCountry.GetAdjective] levas y las tribus que viven en los bosques de #E Oeste#! y #E Este de Gothia#!, y los dioses de la guerra demostraron de una vez por todas que estaban luchando junto a nuestros guerreros.\n\nNuestras fuerzas victoriosas han aplastado todo eso. Se enfrentó a ellos en el campo, y el poder de [ROOT.GetCountry.GetRuler.GetName] ha crecido a una altura asombrosa."
 me_scandinavia_7.a: "¡Llévate esclavos y despojos a la capital!"
 me_scandinavia_7_tooltip: "$mission_completed_tooltip_1$ '#Y Aplastar a los góticos#!' $mission_completed_tooltip_2$"

 me_scandinavia_8_title: "Escandinavia"
 me_scandinavia_8_desc: "Es difícil de creer, pero [ROOT.GetCountry.GetRuler.GetName] ha llevado a nuestra nación a la cima de la gloria; Ya no se nos conoce como simples miembros de una tribu, pero hemos logrado una hazaña que los jefes y reyes de todo el norte de Europa notan.\n\nSomos [ROOT.GetCountry.GetName]: ¡que el mundo tiemble!"
 me_scandinavia_8.a: "Nuestro nombre estará asociado para siempre con la victoria eterna."
 me_scandinavia_8_tooltip: "$mission_completed_tooltip_1$ '#Y Scandia#!' $mission_completed_tooltip_2$"

 me_scandinavia_9_title: "Asaltantes escandinavos"
 me_scandinavia_9_desc: "Las devastadoras incursiones lanzadas por las tribus [ROOT.GetCountry.GetAdjective] han traído innumerables miserias a las comunidades costeras que viven a distancias de ataque de sus puertos, y la visión de nuestros barcos apareciendo en el horizonte trae terror genuino a los corazones de muchos. \n\nYa sea por tierra o por mar, los guerreros de [ROOT.GetCountry.GetName] han arrasado muchos asentamientos y ciudades, y la amenaza impuesta por sus grupos de asalto ha hecho que muchas comunidades consideren construyendo fortificaciones más fuertes."
 me_scandinavia_9.a: "¡Nada nos impedirá tomar lo que queremos!"
 me_scandinavia_9_tooltip: "$mission_completed_tooltip_1$ '#Y Asaltantes escandinavos#!' $mission_completed_tooltip_2$"

 me_scandinavia_10_title: "Reclamaciones de Caledonia"
 me_scandinavia_10_desc: "Aunque todo el mundo dice que los #E caledonios#! son guerreros formidables, esto no ha disuadido a [ROOT.GetCountry.GetRuler.GetName] de preparar [ROOT.GetCountry.GetAdjective] reclamaciones sobre sus tierras. Nuestros [ROOT.GetCountry.GetAdjective] buques de guerra han asaltado sus costas muchas veces, y nuestras levas saben que no tenemos nada que temer de los cobardes isleños.\n\nMuy pronto, nuestras levas cruzarán el #E Mare Hibernicum#! y traerán devastación a los desprevenidos: ¡no podrán esconderse detrás de sus muros! En preparación para este glorioso evento, nuestros artesanos han diseñado barcos que son más rápidos que cualquier otro en mar abierto."
 me_scandinavia_10.a: "¡Casi no puedo esperar! Suena como un gran momento"
 me_scandinavia_10_tooltip: "$mission_completed_tooltip_1$ '#Y Reclamaciones de Caledonia#!' $mission_completed_tooltip_2$"

 me_scandinavia_11_title: "Una capital escandinava"
 me_scandinavia_11_desc: "Ahora que [ROOT.GetCountry.GetRuler.GetName] ha unido a las diversas tribus #E escandinavas#! bajo una misma bandera, se ha propuesto que construyamos una nueva ciudad que sirva como capital oficial de un reino tan poderoso. [ROOT.GetCountry.GetRuler.GetFirstName] ahora tiene que decidir dónde construiremos nuestro capital... una tarea envidiable, pero que [ROOT.GetCountry.GetRuler.GetSheHe] ciertamente merece."
 me_scandinavia_11.a: "Las llanuras de [GetProvince('(int32)6000').GetName] es una excelente ubicación."
 me_scandinavia_11.b: "[GetProvince('(int32)6012').GetName] en la costa es un lugar atractivo"
 me_scandinavia_11.c: "[GetProvince('(int32)6004').GetName] sería un lugar de interés para una capital..."
 me_scandinavia_11.d: "Elijo la isla forestal de [GetProvince('(int32)6009').GetName]"
 me_scandinavia_11.e: "Mantendremos nuestra antigua capital."
 me_scandinavia_11_tooltip: "$mission_completed_tooltip_1$ '#Y Una capital escandinava#!' $mission_completed_tooltip_2$"

 me_scandinavia_12_title: "Granjas escandinavas"
 me_scandinavia_12_desc: "En todo el campo, las granjas que hemos construido son productivas y fructíferas, y a nuestra gente nunca le faltan verduras en los días de escasez del invierno. Gracias a la infraestructura que tenemos ahora, podremos almacenar más alimentos que antes, lo que no es poca cosa y es algo que celebrar en un lugar donde el hambre es una amenaza real."
 me_scandinavia_12.a: "Esta abundancia me agrada. Espero que nuestra gente sea feliz."
 me_scandinavia_12_tooltip: "$mission_completed_tooltip_1$ '#Y Granjas escandinavas#!' $mission_completed_tooltip_2$"

 me_scandinavia_13_title: "Sementales escandinavos"
 me_scandinavia_13_desc: "Nos complace informar que los caballos criados en las propiedades que hemos construido en [GetProvince('(int32)6024').GetName] están rindiendo más allá de nuestras elevadas expectativas, y los caballos enviados a nuestros soldados de caballería corren a través de los barrancos boscosos de [ROOT.GetCountry.GetName] con una habilidad que parece sobrenatural."
 me_scandinavia_13.a: "¡Que nuestros jinetes nos lleven a la victoria!"
 me_scandinavia_13_tooltip: "$mission_completed_tooltip_1$ '#Y Sementales escandinavos#!' $mission_completed_tooltip_2$"

