 scandinavia_abandoned_capital_mod:0 "Capital histórica abandonada"
 desc_scandinavia_abandoned_capital_mod:0 "Los miembros de nuestra tribu están furiosos porque abandonamos las colinas donde están enterrados sus padres."
 scandinavia_historic_capital_mod:0 "Capital histórica retenida"
 desc_scandinavia_historic_capital_mod:0 "Nuestro pueblo, al creer que la ubicación de nuestra capital ancestral es sagrada, ha decidido quedarse en nuestro hogar en lugar de trasladarse a otro lugar."
 scandinavian_horseworks: "Sementales escandinavos"
 desc_scandinavian_horseworks: "Nuestros caballos están entrenados en el campo boscoso de nuestra tierra natal y navegan rápidamente por terrenos traicioneros."
 scandinavian_food_mod: "Almacenamiento de granos escandinavos"
 desc_scandinavian_food_mod: "Gracias a las granjas que hemos construido, podemos almacenar cereales para los inviernos difíciles."
 muh_fast_viking_boats: "Barcos escandinavos"
 desc_muh_fast_viking_boats: "Nuestro pueblo ha dominado el arte de construir barcos rápidos y elegantes con el fin de atacar a nuestros enemigos."

 SCANDIA_FLAG: "La bandera de Escandia Unida"

