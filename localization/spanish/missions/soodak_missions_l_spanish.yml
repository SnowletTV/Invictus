 #Artifacts
 soodak_harrowing_tale:0 "Registro del desastre andrófago"
 soodak_harrowing_tale_desc:0 "Un desgarrador relato de primera mano de la desafortunada expedición de Soodak a Androphagia, desde que el grupo abandonó la ciudad hasta que la nieve los cubrió durante una tormenta de nieve, lo que los obligó al canibalismo debido a la insuficiencia de suministros, hasta que el único superviviente escapó, a medio camino de la muerte."
 
 soodak_hand:0 "Mano rellena"
 soodak_hand_desc:0 "Una mano de uno de los delegados de Soodak en Androphagia, quienes fueron devorados todos por esos bárbaros, excepto esta parte, que fue cortada, rellena y devuelta como insulto a la herida. Ahora es venerado entre nuestro pueblo, un recordatorio de la crueldad andrófaga y un grito de guerra contra aquellos salvajes."
 
 soodak_cookbook:0 "Libro de cocina caníbal"
 soodak_cookbook_desc:0 "Un libro de cocina que contiene una amplia variedad de recetas conocidas por los andrófagos, particularmente del género humano. Incluye instrucciones para costillas, comida para picar, estómagos rellenos, humanos en una manta, muslos de hombre y harina de cerebro. No sorprende que la mayoría de los que lo leen pierdan el apetito."
 
 #Events
 me_soodak_1_title:0 "Las tierras malditas"
 me_soodak_1_desc:0 "$01_soodak_missions_DESCRIPTION$"
 me_soodak_1.a:0 "Prosperaremos donde ningún hombre ha llegado antes."

 me_soodak_2_title:0 "Asegurar el suministro de alimentos"
 me_soodak_2_desc:0 "Aunque hasta ahora hemos sobrevivido, [ROOT.GetCountry.GetRuler.GetName] ha reconocido que nuestros suministros actuales de alimentos acabarán escaseando. La construcción de un granero central en [GetProvince('(int32)9371').GetName] y los productos alimenticios importados deberían ser más que suficientes para sustentar a nuestra creciente población."
 me_soodak_2.a:0 "Bueno, al menos no pasaremos hambre."

 me_soodak_3_title:0 "$01_soodak_missions_task_3$"
 me_soodak_3_desc:0 "Soodak es una gloriosa colonia minera de ámbar @amber! situada en la periferia más septentrional del mundo conocido; sin embargo, hemos carecido de la infraestructura necesaria para que los barcos atraquen de forma segura en nuestro puerto natural, de las instalaciones portuarias para reparar los que se nos crucen en el camino y de buques mercantes propios cuando ninguno más es lo suficientemente valiente para cruzar estas latitudes, lo que obstaculiza gravemente nuestro potencial económico.\n\nAhora que hemos invertido nuestro dinero Si utilizamos recursos bastante limitados para construir un puerto útil y una flota de barcos de transporte sencillos, no sólo podremos atraer visitantes más curiosos y ricos a nuestra isla, sino que también tendremos la capacidad de enviar nuestras propias expediciones independientes a través de alta mar y a sistemas fluviales inexplorados sin depender de la patria."
 me_soodak_3.a:0 "Un paso pequeño, pero crucial, para Soodak."
 me_soodak_3_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_3$#!' ahora ha sido #G completada#!!"

 me_soodak_4_title:0 "$01_soodak_missions_task_4$"
 me_soodak_4_desc:0 "Hace mucho frío en esta isla durante el invierno, lo que a menudo requiere que los adultos estén bien vestidos en todo momento para evitar una muerte por congelación, incluso dentro de los límites de un refugio protegido. Sin embargo, los $fennic$ pueblos nativos de la zona han desarrollado una innovación única que llaman 'saknas' o 'saunas', en la que se colocan rocas calientes en el centro de un pozo cubierto y luego se enfrían con agua para preparar un vapor caliente a través del cual el aire se satura y se hincha, induciendo un estado de relajación entre sus residentes y difundiendo un generoso calor veraniego diferente a cualquier visto con un hogar tradicional; de hecho, un calor tan generoso que permitió a los asistentes desnudarse y desnudarse.\n\nAunque muchos de nuestros colonos eran escépticos ante rituales tan exóticos y desagradables asociados con nuestros vecinos bárbaros, ahora que hemos construido 'saunas' públicas en toda nuestra capital, han comenzado a acudir a ellas con regularidad, al principio con escepticismo y cautela, ahora habitualmente, ya que esta es una de las pocas maneras de escapar del clima. De hecho, los ricos están empezando a construir sus propias saunas privadas, ya que se han convertido en la comidilla de la ciudad."
 me_soodak_4.a:0 "¡Podría ir por uno ahora!"
 me_soodak_4_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_4$#!' ahora ha sido #G completada#!!"
 
 me_soodak_400_title:0 "La moda de la sauna"
 me_soodak_400_desc:0 "Hace unos años empezamos a construir #E $fennic$#! hogares tradicionales llamados 'saunas', y rápidamente se popularizaron en la capital, debido al gran calor y calidez que podían proporcionar después de una dura jornada de trabajo en el gélido invierno. Sin embargo, las saunas se han extendido desde la propia capital hacia nuestros asentamientos periféricos a lo largo de la frontera, porque son fáciles de construir y baratas; por lo tanto, se han convertido en una moda, arrasando en la colonia, tanto entre ricos como entre pobres, tanto entre #E germánicos#! como entre #E finlandeses#!. La pregunta ahora es si deberíamos intentar mantener viva esta moda más allá de su fecha de caducidad natural o permitir que pase a la memoria cuando llegue el momento."
 me_soodak_400.a:0 "Las saunas son una inversión a largo plazo."
 me_soodak_400.b:0 "Que siga siendo una moda útil."

 me_soodak_5_title:0 "$01_soodak_missions_task_5$"
 #me_soodak_5_desc:0 "Though our colony has achieved a remarkable degree of self-sufficiency, given our disposition, we suffer from a distinctive lack of people with which our meager successes can be enjoyed; by offering vague financial incentives and greatly-exaggerated promises of prosperity to those residing within the overcrowded cities of our motherland, we will expand upon our colonial bedrock, laying the foundation for more settlements beyond Soodak itself.\n\nThe only question now remaining, however, is how much do we invest into making these advertisements, for even the tallest tales and thinnest truths require men to speak of them, and for others to believe those men."
 me_soodak_5_desc:0 "Aunque nuestra colonia ha alcanzado un grado notable de autosuficiencia, dada nuestra disposición, adolecemos de una falta distintiva de personas con las que poder disfrutar de nuestros magros éxitos; Al ofrecer vagos incentivos financieros y promesas de prosperidad muy exageradas a quienes residen en las ciudades superpobladas de nuestra patria, ampliaremos nuestra base colonial, sentando las bases para más asentamientos más allá del propio Soodak.\n\nSin embargo, la única pregunta que queda ahora es ¿hasta qué punto deseamos estirar la verdad?"
 #me_soodak_5.a:0 "Old Man Jenkins can do it!"
 #me_soodak_5.b:0 "Send a couple of recruiters and con-men to the coasts of our motherland."
 #me_soodak_5.c:0 "Hire a team of the finest Soodaker orators to tour #E [SCOPE.sCountry('soodak_overlord').GetName]#!."
 #me_soodak_5.d:0 "I myself possess the unique gift of rhetoric, perhaps it can be used much to our convenience..."
 me_soodak_5.a:0 "Dígales que será frío, oscuro y miserable, pero que encontrarán prosperidad en 10 años."
 me_soodak_5.b:0 "Prometan que se harán ricos con el comercio de ámbar dentro de los 5 años posteriores a la firma."
 me_soodak_5.c:0 "Alardeen de que los campesinos más pobres poseerán palacios que superarán a los de los faraones en apenas 6 meses."
 me_soodak_5.d:0 "Prométanles que lograrán muchas cosas en un plazo generoso."
 me_soodak_5.e:0 "¿Qué pasaría si realmente hiciéramos buenas promesas que pudiéramos cumplir?"
 me_soodak_5.f:0 "¡Promételes toda la cerveza y el aguamiel que puedan soñar!"
 me_soodak_5_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_5$#!' ahora ha sido #G completada#!!"

 me_soodak_6_title:0 "$01_soodak_missions_task_6$"
 me_soodak_6_desc:0 ""
 me_soodak_6.a:0 ""
 me_soodak_6_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_6$#!' ahora ha sido #G completada#!!"
 
 me_soodak_2000_title:0 "$01_soodak_missions_task_2$"
 me_soodak_2000_desc:0 "Aunque hemos establecido reservas estables de alimentos en nuestra isla rica en ámbar, todavía deja mucho que desear, y al otro lado del mar se extiende una costa cuyas aguas están repletas de abundantes cantidades de peces, al menos para los estándares hiperbóreos; ahora que hemos establecido un segundo asentamiento allí, no sólo ayudaremos a asegurar más alimentos para nuestra colonia, sino que también nos hemos afianzado en el continente."
 me_soodak_2000.a:0 "Un punto de partida perfecto para futuras colonias."

 me_soodak_7_title:0 "$01_soodak_missions_task_7$"
 me_soodak_7_desc:0 "Nuestra colonia se fundó principalmente por el deseo de extraer el precioso ámbar @amber! que abunda bajo el barro y, a pesar de nuestros mejores esfuerzos, la producción aún no había alcanzado los niveles que coincidían con las expectativas. Afortunadamente para nosotros, sin embargo, había otros depósitos de ámbar al otro lado de la bahía, y ahora que hemos establecido asentamientos allí, nuestra producción de ámbar ha superado con creces las expectativas, hasta el punto de que ahora están llegando nuevos colonos de la patria, ansiosos por participar en este nuevo auge."
 me_soodak_7.a:0 "Crecemos, poco a poco."
 me_soodak_7.b:0 "¿Quizás podríamos persuadir a más personas para que se unan a ellos?"
 me_soodak_7_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_7$#!' ahora ha sido #G completada#!!"

 me_soodak_8_title:0 "$01_soodak_missions_task_8$"
 me_soodak_8_desc:0 "Aunque tenemos acceso al pescado durante todo el año, anteriormente importábamos gran parte de nuestros alimentos del extranjero y carecíamos de un plan de respaldo en caso de que esas redes se vieran interrumpidas durante un período prolongado. Aunque no es una paleta tan agradable para esas importaciones extranjeras, ahora que hemos establecido asentamientos exitosos en [GetProvince('(int32)9378').GetName] y [GetProvince('(int32)9379').GetName], hemos asegurado una mayor producción interna de alimentos, fortaleciendo aún más nuestra posición, y tal vez algún día nuestros esfuerzos faciliten una expansión más profunda hacia el interior. De hecho, un pequeño grupo de hombres libres llegó hoy desde el continente, al enterarse de las oportunidades de nuestros nuevos asentamientos agrícolas."
 me_soodak_8.a:0 "Un granero que ahora da frutos."
 me_soodak_8_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_8$#!' ahora ha sido #G completada#!!"

 me_soodak_9_title:0 "$01_soodak_missions_task_9$"
 me_soodak_9_desc:0 "La costa norte es apenas habitable y no particularmente lucrativa, carece de ámbar y de alimentos y, sin embargo, tiene el potencial de reducir nuestra dependencia de la patria; la arcilla roja de [GetProvince('(int32)9372').GetName] es especialmente adecuada para elaborar loza en la que se pueden almacenar nuestros productos, y el cáñamo silvestre de [GetProvince('(int32)9377').GetName] se puede cultivar para hacer cuerdas vitales para mástiles y diversas construcciones. Ahora que hemos colonizado y desarrollado el norte, nos hemos preparado para un mañana mejor."
 me_soodak_9.a:0 "Un pequeño paso, pero importante."
 me_soodak_9_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_9$#!' ahora ha sido #G completada#!!"

 me_soodak_10_title:0 "$01_soodak_missions_task_10$"
 me_soodak_10_desc:0 "Después de años de esfuerzos para colonizar los territorios circundantes, establecer nuevos puestos de avanzada y domesticar la vasta naturaleza de nuestro nuevo hogar, hemos dejado de ser una pequeña @amber! isla minera de ámbar y ahora nos encontramos como dueños de todo #E Ilmandu Superior#!, un brillante faro de civilización que arde a través del manto de la eterna oscuridad invernal. Sin embargo, a pesar de nuestro logro más impresionante, hemos abierto la puerta a una mayor expansión y conquista mucho más allá de la visión y las expectativas de nuestra patria."
 me_soodak_10.a:0 "¡Un día glorioso para todo Soodak!"
 me_soodak_10_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_10$#!' ahora ha sido #G completada#!!"

 me_soodak_11_title:0 "$01_soodak_missions_task_11$"
 me_soodak_11_desc:0 "A lo largo de las orillas del #E lago Peipus#! se encuentra un denso bosque con abundante madera resistente y resistente a las enfermedades @wood! para cosechar, perfecta para construir refugios, barcos e incluso leña, junto con fuentes de @vegetables! nutritivos y juegos de cuero @wild_game! en las inmediaciones. Al reclamar estas tierras interiores, hemos disminuido nuestra necesidad de depender de la patria; de hecho, han comenzado a llegar colonos de otras partes de la colonia para aprovechar estas tierras en lugar de las de nuestra patria."
 me_soodak_11.a:0 "Excelente."
 me_soodak_11_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_11$#!' ahora ha sido #G completada#!!"

 me_soodak_12_title:0 "$01_soodak_missions_task_12$"
 me_soodak_12_desc:0 ""
 me_soodak_12.a:0 ""
 me_soodak_12_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_12$#!' ahora ha sido #G completada#!!"

 me_soodak_13_title:0 "$01_soodak_missions_task_13$"
 me_soodak_13_desc:0 "Aunque hemos establecido una presencia en #E Ilmandu Inferior#!, no es más que un mero punto de apoyo sobre tierras que abundan en recursos clave, marginalmente más cálidas y hospitalarias que nuestra área de la capital y, lo más importante, corren paralelas al #E río Vain#!, una importante arteria comercial que penetra profundamente en la #E Hiperbórea#!. Al reclamar estas tierras, no sólo podremos ejercer nuestra influencia en zonas más profundas del desierto, sino que también podremos monopolizar todo el comercio con destino al Báltico."
 me_soodak_13.a:0 "Y con más comercio, más inversión."
 me_soodak_13_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_13$#!' ahora ha sido #G completada#!!"

 me_soodak_14_title:0 "$01_soodak_missions_task_14$"
 me_soodak_14_desc:0 "En el remoto y vasto este se encuentra un río al que los lugareños se refieren como #E 'Velho'#!, que según dicen conduce más allá de #E Hiperbórea#! a tierras salvajes que la civilización aún no conoce. Aunque fue una tarea costosa, ahora que hemos establecido puestos de avanzada en las tierras que rodean este río y sus alrededores, podremos establecer redes comerciales con aquellos perdidos en la historia y tal vez sentar las bases para nuevas expediciones más allá de la línea de árboles."
 me_soodak_14.a:0 "¡Una gran inversión para Soodak!"
 me_soodak_14_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_14$#!' ahora ha sido #G completada#!!"

 me_soodak_15_title:0 "$01_soodak_missions_task_15$"
 me_soodak_15_desc:0 "Aunque hemos mantenido durante mucho tiempo nuestra fe en nuestros dioses, dadas nuestras dificultades y luchas, algunos están comenzando a cuestionar su fe en nosotros, y en particular en el dios sol, cuya presencia, o falta de ella, ha llevado a muchos a la conclusión de que nos ha maldecido. Los miembros de la tribu fennica de esta zona, que han vivido aquí durante generaciones, adoran a la diosa de la luna, [GetDeityDefinition('omen_kuje').GetName], cuya presencia, por el contrario, es claramente visible durante los largos y mortíferos meses de invierno, y que, según afirman, protege a su pueblo de los mayores males de las noches más oscuras; de hecho, su culto ahora ha ganado seguidores entre nuestros colonos, creyendo que ellos también obtendrán su protección. Aunque esto provocará un gran revuelo entre nuestros sacerdotes, que denuncian a estos conversos como tontos descarriados cuya herejía sólo enojará aún más al dios del sol, al incorporar formalmente a [GetDeityDefinition('omen_kuje').GetName] a nuestro panteón, tal vez nosotros también disfrutemos de sus bendiciones."
 me_soodak_15.a:0 "El dios del sol puede mantener sus maldiciones, con [GetDeityDefinition('omen_kuje').GetName] ahora de nuestro lado."
 me_soodak_15_tooltip:0 "¡La tarea de misión '#Y $01_soodak_missions_task_15$#!' ahora ha sido #G completada#!!"
 
 me_soodak_16_title:0 "$01_soodak_missions_task_16$"
 me_soodak_16_desc:0 "Aunque hemos mantenido durante mucho tiempo nuestra fe en nuestros dioses, dadas nuestras dificultades y luchas, algunos están comenzando a cuestionar su fe en nosotros, y en particular en el dios sol, cuya presencia, o falta de ella, ha llevado a muchos a la conclusión de que nos ha maldecido. Como resultado, el culto pagano de [GetDeityDefinition('omen_kuje').GetName] ha comenzado a extenderse entre muchos de nuestros colonos, desilusionados por la indigencia y equivocados por falsas promesas, cuya herejía, según advierten nuestros sacerdotes, sólo enojará aún más al dios del sol.\n\nPara asegurar nuestra salvación, siguiendo el consejo de nuestro sumo sacerdote, hemos ofrecido al dios del sol un sacrificio de lo más extravagante, que contiene la mejor carne de jabalí. [ROOT.GetCountry.GetName] tiene para ofrecer y un hidromiel bastante caro de #E Alemania#!, y hemos construido un gran templo en nuestra capital, también dedicado a su honor. Con suerte, con estos generosos gestos de piedad, ahora hemos comenzado a hacer las paces con nuestros dioses, quienes pueden estar dispuestos a levantar algún día esta maldición."
 me_soodak_16.a:0 "Sólo podemos orar por el perdón."
 
 me_soodak_18_title:0 "$01_soodak_missions_task_18$"
 me_soodak_18_desc:0 "Hemos apaciguado al Dios Sol por ahora, sin embargo, nuestros sacerdotes nos informan que para deshacernos verdaderamente de esta miserable maldición, debemos difundir un celo genuino y una creencia apasionada entre los habitantes nativos de estas tierras circundantes, similar a un bosque de ignorancia incendiado con la luz del conocimiento y la comprensión. Aunque muchos pueden profesar lealtad a los dioses por un lado, por el otro siguen a los espíritus de sus antepasados. Para demostrar el valor de nuestros dioses sobre los de todos los demás dentro de los corazones y las mentes de estos miembros de la tribu, desde ahora hasta el Ragnarok, sólo puede haber una manera; nuestro liderazgo emprende el máximo sacrificio, dando un ejemplo honorable para aquellos, tanto ahora como en el futuro, a emular en tiempos de gran crisis.\n\nLa única pregunta, sin embargo, es a quién sacrificar; Aunque [SCOPE.sCharacter('soodak_ruler').GetName] gobierna el dominio físico y dirige nuestras tropas a la batalla, haciendo que [SCOPE.sCharacter('soodak_ruler').GetHerHim] sea la elección natural, algunos de nuestros generales y familiares sugieren a [SCOPE.sCharacter('soodak_high_priest').GetName], el sumo sacerdote, porque [SCOPE.sCharacter('soodak_high_priest').GetSheHe] se comunica con lo divino y ejerce una influencia significativa sobre nuestros asuntos espirituales. Quienquiera que lo haga seguramente apaciguará al Dios Sol y se ganará su bendición."
 me_soodak_18.a:0 "Moriré para que seamos salvos."
 me_soodak_18.b:0 "El sacerdote dijo que es necesario hacer esto, por lo que es justo que lo haga."
 me_soodak_18.c:0 "¡El viejo Jenkins puede hacerlo!"
 me_soodak_18.d:0 "¿Y si ambos lo hiciéramos?"
 
 me_soodak_19_title:0 "$01_soodak_missions_task_19$"
 me_soodak_19_desc:0 "Aunque hayamos tenido diferencias en el pasado, nuestro señor supremo sigue siendo nuestro generoso protector y soberano, cuya fuerza enormemente superior, tanto militar como económica, es mejor considerar como amigo y socio que como competidor; por lo tanto, es de nuestro interés natural vincular mejor nuestras economías y, para lograrlo, hemos invertido en mejorar nuestros centros de mercado y reducir las restricciones a las #E [SCOPE.sCountry('soodak_overlord').GetAdjective]#! importaciones, mejorando enormemente nuestro flujo comercial. De hecho, los dividendos ya están dando frutos; Nos ha llegado la noticia de que un consorcio de ricos comerciantes y empresarios del continente ha invertido en nuestra provincia, proporcionando empleo y trabajo a los Soodakers locales."
 me_soodak_19.a:0 "Es mejor abrazar a un oso que darle un puñetazo en la nariz."
 
 me_soodak_21_title:0 "$01_soodak_missions_task_21$"
 me_soodak_21_desc:0 "Aunque nuestra milicia nos ha servido bien a lo largo de la frontera, para tener una fuerza verdaderamente capaz de apoyar a la patria durante una época de crisis, necesitamos reformar nuestro conjunto de fuerzas heterogéneas para convertirlas en un verdadero ejército permanente; Con ese fin, hemos solicitado algunos de los mejores asesores militares de #E [SCOPE.sCountry('soodak_overlord').GetName]#!, y consideraron prudente enviar a uno de sus comandantes más experimentados y mejor conectados, [SCOPE.sCharacter('soodak_military_advisor').GetName]. Aunque es un extraño en estas tierras, su liderazgo y experiencia ya han comenzado a tener efecto en las tropas, que ahora se organizan en legiones efectivas cuando se les ordena y portan con orgullo los estandartes de la patria en sus escudos."
 me_soodak_21.a:0 "Bajo la supervisión de [SCOPE.sCharacter('soodak_military_advisor').GetFirstName], tendremos un futuro en el imperio."
 
 me_soodak_22_title:0 "$01_soodak_missions_task_22$"
 me_soodak_22_desc:0 "El ámbar @amber! extraído de [GetProvince('(int32)9371').GetName] es el orgullo de nuestra administración, su cristal de color naranja vibrante se encuentra entre los mejores encontrados en el mundo y, sin embargo, incluso con una gran inversión, todavía quedaba mucho más por extraer y refinar. Ahora que hemos construido una cantidad considerable de fundiciones para especializar verdaderamente nuestra economía en torno a este producto, los empresarios especulativos están llegando de todas partes del continente, buscando una participación en esta industria en rápida evolución, ya sea estableciendo empresas de prospección de ámbar para evaluar posibles nuevos campos de dragado, importando trabajadores del continente en masa para dragar más de esta sustancia increíblemente valiosa, o incluso experimentando con nuevos usos para esta sustancia, como orinales recubiertos de ámbar, antes de que sus rivales puedan primero.\n\nDe hecho, se ha desarrollado un ciclo cíclico, en el que el ámbar se extrae de la tierra fangosa, luego las fundiciones lo refinan para convertirlo en baratijas y luego utilizan sus ganancias para financiar más dragas; A algunos les preocupa que el mercado pueda sobresaturarse, pero por ahora, podemos abrazar el #E 'Auge ámbar'#!, como muchos lo llaman ahora, y cosechar sus beneficios."
 me_soodak_22.a:0 "¡El ámbar es nuestro pasado, presente y futuro!"
 
 me_soodak_23_title:0 "$01_soodak_missions_task_23$"
 me_soodak_23_desc:0 "Hace generaciones, comenzamos como una colonia rebelde, un remanso cuyo único propósito era extraer y recolectar ámbar @amber! para nuestros señores supremos, en un terreno demasiado traicionero para hacerlo ellos mismos. Gracias a nuestros éxitos, llegamos a dominar el mercado y, atrayendo una afluencia de colonos, crecimos como un espejo de nuestra patria, con el gobierno organizado de manera civilizada, ciudades erigidas en el desierto y los feroces bárbaros pacificados; un reflejo vidrioso, teñido de un precioso naranja.\n\nA medida que hemos seguido entrelazando nuestra economía, diplomacia y vidas con las de nuestros señores supremos, hemos ganado una merecida reputación de confiabilidad y lealtad, una extensión de la propia #E Germania#! y, a través de nuestra riqueza, un título que nos ha concedido cariñosamente: la joya de la corona del imperio."
 me_soodak_23.a:0 "¡Por el Imperio [SCOPE.sCountry('soodak_overlord').GetAdjective]!"
 
 me_soodak_24_title:0 "$01_soodak_missions_task_24$"
 me_soodak_24_desc:0 "Aunque pocos están dispuestos a discutir el tema en público, nuestro acuerdo actual con la patria es cada vez más insostenible, quien en ocasiones hace lo correcto con nosotros, pero impone impuestos cada vez más severos a nuestro pueblo, mientras que, por el contrario, descuida aún más nuestras necesidades. La independencia, como algunos han argumentado, todavía es un paso demasiado lejos, sin embargo, ahora que hemos comenzado el proceso de desvincularnos del continente reduciendo nuestro comercio con ellos y fomentando los productos nacionales fabricados por Soodaker, en caso de que suceda lo peor, estaremos preparados."
 me_soodak_24.a:0 "Es mejor prevenir que lamentar."
 
 me_soodak_25_title:0 "$01_soodak_missions_task_25$"
 me_soodak_25_desc:0 "Nuestra milicia nos ha servido bien a lo largo de la frontera, sin embargo, nuestra colección de fuerzas heterogéneas no está en condiciones de enfrentarse al poder del #E Imperio Germánico#!, cuyos escudos caseros y espadas viejas y oxidadas serían destrozados por las disciplinadas legiones de este último. Necesitamos un hombre con un plan y, afortunadamente para nosotros, nuestros contactos nos hablan de un general capaz de [GetProvince('(int32)3967').GetName], quien, después de haber sido expulsado del ejército germánico por un rival influyente, está dispuesto y es capaz de servir a nuestra causa.\n\nAl llegar recientemente y solo puede hablar unas pocas palabras \"coloridas\" en nuestro dialecto, [SCOPE.sCharacter('soodak_military_advisor').GetName] ya ha comenzado a implementar reformas importantes, donde los hombres entrenan y marchan según las órdenes, mantienen correctamente su costoso equipo y mantienen su rango a pesar de su inclinación natural a huir."
 me_soodak_25.a:0 "Quizás, después de todo, tengamos una oportunidad."
 
 me_soodak_26_title:0 "$01_soodak_missions_task_26$"
 me_soodak_26_desc:0 "Con las bendiciones de la Diosa de la Luna, a pesar de los recelos de los sacerdotes, nuestro pueblo ha prosperado más allá de lo que muchos habrían considerado posible años antes, con lluvias fértiles durante el verano bendiciendo nuestras cosechas y las aullantes tormentas invernales causando menos daños. El antiguo orden sostiene que estas son meras coincidencias, pero la gente hace tiempo que perdió la confianza en ellos y en los dioses que dicen representar; ahora que hemos barrido el sacerdocio arcaico y corrupto con hombres que tienen una conexión genuina con los dioses verdaderos, aseguraremos la prosperidad para nuestro pueblo y aplastaremos esta maldición."
 me_soodak_26.a:0 "Encontraremos la salvación."
 
 me_soodak_27_title:0 "$01_soodak_missions_task_27$"
 me_soodak_27_desc:0 "Nuestra milicia nos ha servido bien a lo largo de la frontera y, aunque su calidad es inferior a la de muchos de los grandes ejércitos del mundo, siendo realistas, esa es una perfección que nunca podremos igualar. Por lo tanto, es lógico invertir en cantidad y, al permitir que ciudadanos de todas las edades y aptitudes respondan al llamado a la guerra, podremos aprovechar al máximo nuestro campo y, sin un ejército permanente, aliviaremos las preocupaciones de que un gobierno independiente abuse de su poder."
 me_soodak_27.a:0 "Con números, tenemos una oportunidad."
 
 me_soodak_28_title:0 "$01_soodak_missions_task_28$"
 me_soodak_28_desc:0 "Los pueblos #E Fennic#! han vivido en esta tierra durante generaciones y, por lo tanto, conocen bastante este terreno, con información sobre dónde crecen las bayas silvestres en tiempos de escasez, dónde residen los animales salvajes y los mejores lugares para colocar trampas para los conquistadores del mundo. Incorporando y aprendiendo de las estrategias de nuestros aliados, haremos que el enemigo luche por cada centímetro de nieve."
 me_soodak_28.a:0 "Y lucharán."
 
 me_soodak_29_title:0 "$01_soodak_missions_task_29$"
 me_soodak_29_desc:0 "Nuestra relación con el pueblo #E Fennic#! no siempre ha sido fácil; sin embargo, ahora que adoramos a los mismos dioses y seguimos a los mismos espíritus, muchos en ambos lados de la isla comienzan a ver que compartimos más similitudes que diferencias, especialmente en lo que respecta a nuestras quejas mutuas contra el señor supremo. Sin divisores claros después de generaciones de mezcla, cada vez es más difícil diferenciar entre #E germánico#! y fennico, particularmente bajo los débiles rayos de la [GetDeityDefinition('omen_kuje').GetName] bendita luz de la luna. Por lo tanto, para la perseverancia futura de nuestra colonia, es lógico que reconozcamos la situación sobre el terreno y abolamos formalmente las distinciones legales restantes entre nuestros dos pueblos, creando una unión más perfecta."
 me_soodak_29.a:0 "Un nuevo amanecer amanece sobre Soodak."
 
 me_soodak_30_title:0 "$01_soodak_missions_task_30$"
 me_soodak_30_desc:0 "A primera vista, no hay mucho que decir sobre las tierras de #E $joki_area$#!, con sus espesos bosques y densos pantanos que hacen que la vivienda no sea ideal. Sin embargo, nuestros exploradores informan que se encuentra en una unión crítica entre los ríos #E Velho#! y #E Vain#!, un área de vital importancia estratégica, dadas nuestras propiedades en ambas provincias; Al colonizar esta tierra salvaje, no sólo garantizaremos la autonomía estratégica para nuestros territorios orientales, sino que también facilitaremos nuestra administración en ellos."
 me_soodak_30.a:0 "Una vez asegurado el Este, podemos mirar hacia el futuro."
 
 me_soodak_31_title:0 "$01_soodak_missions_task_31$"
 me_soodak_31_desc:0 "Con el aumento de las tensiones, existe la preocupación de que se desborde más temprano que tarde. Por lo tanto, sería prudente ahorrar dinero y hacer contactos con espadas potenciales para alquilar ahora, en lugar de luchar en el último minuto y tener que pagar más con menos oro disponible."
 me_soodak_31.a:0 "Es mejor estar seguro que conquistado."
 
 me_soodak_32_title:0 "$01_soodak_missions_task_32$"
 me_soodak_32_desc:0 "Fuimos fundados como una @amber! colonia minera de ámbar en el borde del mundo, muy alejada de la civilización. Prosperamos donde se creía imposible, establecimos nuevos asentamientos en los bosques de hielo y logramos la autosuficiencia en la nieve. Sin embargo, celosa de nuestros éxitos, nuestra patria se volvió cada vez más ambivalente hacia sus hijos, interfiriendo repetidamente en nuestros asuntos internos sin que se lo pidiéramos, aumentando los impuestos a niveles irrazonables sin nuestro consentimiento y descuidando repetidamente nuestras necesidades en tiempos de dificultades.\n\nTanto nosotros como cualquiera seríamos participantes felices y orgullosos de nuestro #E Imperio Germánico#!, nuestros lazos de parentesco se mantendrían fuertes a través del mar mientras buscaríamos crecer juntos de manera mutua; sin embargo, son nuestros amos tiránicos quienes han elegido este camino imprudente, considerándonos remansos y marginados, indignos de los mismos derechos y privilegios que ellos mismos aprecian; por lo tanto, como hombres libres e iguales, nos vemos obligados a asumir el manto de la condición de Estado para proteger y garantizar nuestros derechos inherentes a la libertad y a la búsqueda de la felicidad. En este día, nos declaramos oficialmente el estado soberano e independiente de [ROOT.GetCountry.GetName]."
 me_soodak_32.a:0 "¡Dadme libertad o dadme muerte!"
 
 me_soodak_33_title:0 "$01_soodak_missions_task_33$"
 me_soodak_33_desc:0 "De alguna manera, contra todo pronóstico, hemos tenido éxito donde todos los demás habrían fracasado; una pequeña colonia al borde de la civilización, que se mantiene firme y derrota a uno de los imperios más grandes del mundo. Con nuestro país asegurado como Estado independiente, somos libres de perseguir nuestro destino como queramos, ni como germánicos ni como fénicos, sino como soodakers orgullosos y liberados."
 me_soodak_33.a:0 "¡Un día glorioso para todo Soodak!"
 
 me_soodak_34_title:0 "$01_soodak_missions_task_34$"
 me_soodak_34_desc:0 "De alguna manera, contra todo pronóstico, hemos tenido éxito donde todos los demás habrían fracasado; una pequeña colonia al borde de la civilización, que se mantiene firme y derrota a uno de los imperios más grandes del mundo. Con nuestro país asegurado como estado independiente, y ahora habiendo cortado todos los lazos con nuestro pasado colonial al abrazar nuestra antigua herencia #E Fennic#!, la pregunta es ¿qué dirección debe tomar el #E Duna#! renacido?\n\nMuchos dicen que debemos continuar en el camino de la civilización, haciendo avanzar nuestra tecnología hasta el punto de superar eventualmente a nuestros opresores, mientras que Una pequeña minoría sostiene que fue la tradición la que ganó nuestra guerra de independencia y, por lo tanto, deberíamos abrazarla plenamente y regresar a nuestras costumbres tribales perdidas hace mucho tiempo. Ambos argumentos son convincentes, pero como nuestro primer líder, depende de usted decidir nuestro futuro."
 me_soodak_34.a:0 "La civilización es el mejor camino a seguir."
 me_soodak_34.b:0 "¡Volveremos a la tradición!"
 
 #Soodak Rebels
 me_soodak_3200_title:0 "¡Rebeldes de Soodak!"
 me_soodak_3200_desc:0 "Nuestra traicionera y díscola colonia de [GetProvince('(int32)9371').GetName] siempre ha sido difícil de controlar, debido a su lejanía y terquedad superior, pero hoy han cruzado la línea; Se ha fabricado una publicación absurda y mal escrita, citando agravios arbitrarios, objeciones menores y ficciones lascivas como \"justificación\" para la \"separación completa e irrevocable\" de su colonia. Al final, sus afirmaciones no son más que una colección calumniosa y vergonzosa de mentiras que no vale la pena mancillar los pasillos de nuestra estimada corte.\n\nComo el gobierno colonial ahora está controlado por renegados y criminales empeñados en privar a su pueblo de la generosa y amorosa protección de #E [ROOT.GetCountry.GetName]#!, no tenemos otra opción que disolver formalmente la colonia, y enviar tropas para aplastar a esta banda de chusma."
 me_soodak_3200.a:0 "Les daremos la muerte, como es el destino de todos los traidores."
 
 #Request Aid Event Chain
 me_soodak_17_title:0 "$01_soodak_missions_task_17$"
 me_soodak_17_desc:0 "Somos una colonia orgullosa que ha logrado lograr estabilidad, tanto política como financiera, así como fronteras seguras. Es muy apropiado que solicitemos ayuda financiera a nuestra generosa patria, como recompensa por nuestros esfuerzos y para que podamos esforzarnos por seguir creciendo. La pregunta ahora es cuánto solicitamos; Es más probable que se acepten cantidades más bajas, pero cantidades más altas serían más útiles."
 me_soodak_17.a:0 "Unas escasas 50 piezas de oro."
 me_soodak_17.b:0 "Unas modestas 250 piezas de oro."
 me_soodak_17.c:0 "¡Una generosa suma de 500 de oro!"
 
 me_soodak_1701_title:0 "Soodak solicita ayuda"
 me_soodak_1701_desc:0 "Nuestra colonia de [GetProvince('(int32)9371').GetName] ha alcanzado cierta prosperidad recientemente, logrando un gobierno estable, expandiendo sus fronteras y aumentando su producción de ámbar @amber!. Sin embargo, en reconocimiento a estos logros, ahora nos solicitan una pequeña donación, como medida de buena fe de nuestra parte. Sin embargo, existen algunas preocupaciones de que estén creciendo demasiado rápido y, con asistencia adicional, es casi seguro que se expandirán mucho más allá de su estatuto inicial."
 me_soodak_1701.a:0 "Una colonia más fuerte traerá mayores beneficios."
 me_soodak_1701.b:0 "Una colonia más fuerte será más rebelde."
 me_soodak_1701.c:0 "Un sujeto sancionado no recibirá exactamente nada."
 
 me_soodak_1702_title:0 "$me_soodak_1701_title$"
 me_soodak_1702_desc:0 "Nuestra colonia de [GetProvince('(int32)9371').GetName] ha alcanzado cierta prosperidad recientemente, logrando un gobierno estable, expandiendo sus fronteras y aumentando su producción de ámbar @amber!. Sin embargo, en reconocimiento a estos logros, ahora nos solicitan un modesto obsequio, como medida de buena fe de nuestra parte y para generar apoyo para su economía. Sin embargo, existen algunas preocupaciones de que estén creciendo demasiado rápido y, con asistencia adicional, es casi seguro que se expandirán mucho más allá de su estatuto inicial."
 me_soodak_1702.a:0 "$me_soodak_1701.a$"
 me_soodak_1702.b:0 "$me_soodak_1701.b$"
 me_soodak_1702.c:0 "$me_soodak_1701.c$"
 
 me_soodak_1703_title:0 "$me_soodak_1701_title$"
 me_soodak_1703_desc:0 "Nuestra colonia de [GetProvince('(int32)9371').GetName] ha alcanzado cierta prosperidad recientemente, logrando un gobierno estable, expandiendo sus fronteras y aumentando su producción de ámbar @amber!. Sin embargo, en reconocimiento de estos logros, ahora nos piden escandalosamente una suma excesiva, como lo que dicen ser \"una medida de buena fe de nuestra parte\", pero lo que es claramente codicia por su parte, por no mencionar las preocupaciones existentes de que están creciendo demasiado rápida y agresivamente."
 me_soodak_1703.a:0 "$me_soodak_1701.a$"
 me_soodak_1703.b:0 "$me_soodak_1701.b$"
 me_soodak_1703.c:0 "$me_soodak_1701.c$"
 
 me_soodak_1704_title:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! ¡De acuerdo!"
 me_soodak_1704_desc:0 "¡Nuestra generosa patria ha accedido a nuestra petición de ayuda! Aunque es una suma escasa, enviar cualquier cantidad de dinero a nuestra administración es un símbolo del apoyo de #E [SCOPE.sCountry('soodak_overlord').GetName]#! a nuestra colonia y de nuestros objetivos en el futuro."
 me_soodak_1704.a:0 "¡Viva #E [SCOPE.sCountry('soodak_overlord').GetName]#!!"
 
 me_soodak_1705_title:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! ¡De acuerdo!"
 me_soodak_1705_desc:0 "¡Nuestra generosa patria ha accedido a nuestra petición de ayuda! Aunque es una suma modesta, tampoco es una cantidad insignificante, y al enviar cualquier cantidad de dinero a nuestra administración, #E [SCOPE.sCountry('soodak_overlord').GetName]#! ha mostrado un apoyo genuino a nuestra colonia y a nuestros objetivos en el futuro."
 me_soodak_1705.a:0 "¡Viva #E [SCOPE.sCountry('soodak_overlord').GetName]#!!"
 
 me_soodak_1706_title:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! ¡De acuerdo!"
 me_soodak_1706_desc:0 "¡Nuestra generosa patria ha accedido a nuestra petición de ayuda! Muchos habían anticipado que nuestra solicitud sería rechazada rotundamente, debido a la audaz suma de oro solicitada, pero enviarla íntegramente a nuestra administración es un símbolo del pleno e inquebrantable apoyo de #E [SCOPE.sCountry('soodak_overlord').GetName] #! a nuestra colonia y nuestros objetivos en el futuro."
 me_soodak_1706.a:0 "¡Viva #E [SCOPE.sCountry('soodak_overlord').GetName]#!!"
 
 me_soodak_1707_title:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! ¡Rechazados!"
 me_soodak_1707_desc:0 "¡Nuestra patria egoísta ha rechazado nuestra más exigua petición de ayuda! Aunque no necesitábamos particularmente el dinero, el hecho de que nuestro señor supremo no se molestara en enviar ni siquiera una suma simbólica ha preocupado a muchos Soodakers de que aquellos en #E [SCOPE.sCountry('soodak_overlord').GetName]#! se hayan vuelto apáticos hacia su colonia más leal o, peor aún, se opongan activamente a nuestro crecimiento continuo."
 me_soodak_1707.a:0 "Quizás necesitemos empezar a buscar protección en nosotros mismos..."
 
 me_soodak_1708_title:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! ¡Rechazados!"
 me_soodak_1708_desc:0 "¡Nuestra patria ha rechazado nuestra más razonable y modesta petición de ayuda! Aunque no necesitábamos particularmente el dinero, el hecho de que nuestro señor supremo no se molestara en enviar ni siquiera una suma simbólica ha preocupado a muchos Soodakers de que aquellos en #E [SCOPE.sCountry('soodak_overlord').GetName]#! se hayan vuelto apáticos hacia su colonia más leal o, peor aún, se opongan activamente a nuestro crecimiento continuo."
 me_soodak_1708.a:0 "Quizás necesitemos empezar a buscar protección en nosotros mismos..."
 
 me_soodak_1709_title:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! ¡Rechazados!"
 me_soodak_1709_desc:0 "Nuestra patria rechazó nuestra solicitud de ayuda, alegando que la suma exorbitante no era razonable. Aunque esperábamos un rechazo de la cantidad solicitada, el hecho de que nuestro señor supremo no se molestó en enviar ni siquiera una suma simbólica ha preocupado a muchos Soodakers de que aquellos en #E [SCOPE.sCountry('soodak_overlord').GetName]#! se hayan vuelto apáticos hacia su colonia más leal o, peor aún, se opongan activamente a nuestro crecimiento continuo."
 me_soodak_1709.a:0 "Quizás necesitemos empezar a buscar protección en nosotros mismos..."
 
 #Purchase Gotland Event Chain
 
 me_soodak_20_title:0 "$01_soodak_missions_task_20$"
 me_soodak_20_desc:0 "A medida que nuestra colonia se entrelaza más con el continente, la línea entre [GetProvince('(int32)9371').GetName] y #E Germania#! se vuelve borrosa, similar a una espesa niebla matutina que flota sobre el agua y bajo el cielo. En este sentido, somos menos una provincia vasalla que una provincia autónoma, que existe para ayudar a nuestro señor supremo a administrar estas tierras remotas.\n\nAunque fuera de nuestra región designada, la isla de [GetProvince('(int32)6010').GetName] se encuentra más cerca de nuestra capital que de la de nuestra patria, lo que nos permitiría ejercer más control sobre ella y, por lo tanto, obtener más impuestos de ella, sin mencionar el aumento del comercio que traeríamos a todo el Báltico. Quizás podamos convencer a Germania para que ceda esta isla a nuestra administración y nos permita gobernar en su nombre."
 me_soodak_20.a:0 "200 de oro deberían ser suficientes."
 me_soodak_20.b:0 "Quizás pueda hablar de la calidad de esta administración."
 
 me_soodak_2001_title:0 "#E Soodak#! Solicitudes [GetProvince('(int32)6010').GetName]"
 me_soodak_2001_desc:0 "Nuestra leal colonia #E [SCOPE.sCountry('soodak_country').GetName]#! se ha integrado bien en nuestra economía, reconociendo su lugar en nuestra administración para gobernar las lejanas tierras de Hiperbórea y extraer sus recursos para nuestro beneficio. Sin embargo, afirman que nuestra isla de [GetProvince('(int32)6010').GetName], aunque técnicamente está fuera de su región asignada, está mucho más cerca de su capital que de la nuestra y, por lo tanto, podrían obtener impuestos de ella de manera más eficiente que nosotros. Aunque algunos se muestran escépticos respecto a ceder nuestras tierras principales, nuestra colonia proporciona un argumento sólido y un pago inicial para respaldarlo."
 me_soodak_2001.a:0 "La isla no tiene valor de todos modos, pueden quedarse con ella."
 me_soodak_2001.b:0 "¿Regalar nuestra isla? Esos colonos pueden quedarse con su dinero y quedarse en Hiperbórea."
 
 me_soodak_2002_title:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! ¡Acepta!"
 me_soodak_2002_desc:0 "Nuestra generosa patria #E [SCOPE.sCountry('soodak_overlord').GetName]#! ha demostrado una vez más su carácter sabio y benévolo y ha aceptado nuestro argumento, transfiriendo oficialmente la isla de [GetProvince('(int32)6010').GetName] de su dominio directo a nuestra administración. Aunque nos cueste bastante dinero, un punto de apoyo en Escandia beneficiará a nuestra economía a largo plazo."
 me_soodak_2002.a:0 "¡A [SCOPE.sCountry('soodak_overlord').GetName], nuestros gloriosos líderes y protectores!"
 
 me_soodak_2003_title:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! ¡Rechazados!"
 me_soodak_2003_desc:0 "En un sorprendente giro de los acontecimientos, nuestro señor supremo #E [SCOPE.sCountry('soodak_overlord').GetName]#! ha rechazado nuestra solicitud lógica y mutuamente beneficiosa, prefiriendo que permanezcamos en nuestra región asignada de Hiperbórea. Al menos devolvieron el pago inicial, pero dado lo mucho que habíamos invertido para integrar nuestra economía en la de ellos, algunos ahora se preguntan si fue un error poner todos nuestros huevos en esa [SCOPE.sCountry('soodak_overlord').GetAdjective] canasta."
 me_soodak_2003.a:0 "Quizás algún día cambien de opinión."
 
 #Government Event Chain
 me_soodak_100_title:0 "$01_soodak_missions_task_100$"
 me_soodak_100_desc:0 "Ahora que hemos encontrado una manera de sobrevivir en esta isla árida, aunque nuestro consejo temporal nos ha servido lo suficiente, necesitamos establecer un sistema permanente de gobierno si deseamos existir aquí a largo plazo. Sin embargo, los colonos están divididos en cuanto a la forma que debería adoptar nuestro gobierno; algunos desean ampliar el consejo existente hasta convertirlo en una casa de burgueses, o una #Y 'Burgzhusa'#!, compuesta por todos los principales interesados que tendrían el poder de establecer leyes, mientras que otros preferirían tener un gobernador real instalado desde la patria, que reforzaría nuestros vínculos a través de casas dinásticas y nos guiaría hacia la prosperidad.\n\nY otros, sin embargo, sugerirían un sistema híbrido como compromiso, en el que un gobernador de origen no real reinaría junto con nuestro cuerpo electo. Sin embargo, cualquier cosa que elijamos hoy dictará el curso de nuestra colonia no sólo para nosotros, sino también para nuestros hijos y nuestra progenie que está por venir."
 me_soodak_100.a:0 "La noble casa de #E [SCOPE.sCountry('soodak_overlord').GetName]#! nos guiará sabiamente."
 me_soodak_100.b:0 "Nuestra Burgzhusa, elegida entre los mejores entre nosotros, es la más capacitada para tomar nuestras decisiones."
 me_soodak_100.c:0 "Un enfoque híbrido entre realistas y republicanos sería lo que más nos vendría bien."
 me_soodak_100.d:0 "¡Sería un gran gobernador!"
 me_soodak_100.e:0 "Un gurú de nuestro corazón espiritual sería la elección más sabia."
 me_soodak_100_a_tooltip:0 "Solicitaremos un gobernador dinástico de nuestra patria. Sin embargo, si deciden no enviar uno, tendremos otras opciones disponibles."
 me_soodak_100_c_tooltip:0 "Solicitaremos un gobernador de nuestra patria, después de lo cual nos convertiremos en un #Y $oligarchic_republic$#! con la ley #Y $republican_election_4$#!."
 me_soodak_100_d_tooltip:0 "Esta opción está disponible porque su gobernante tiene los rasgos #Y Narcisista#!, #Y Ambicioso#! y/o #Y Arrogante#!, o tiene una popularidad mayor o igual a #Y 75#!."
 me_soodak_100_d2_tooltip:0 "Nuestro gobernante actual se convertirá en gobernador hereditario. Sin embargo, #E [SCOPE.sCountry('soodak_overlord').GetName]#! se sentirá muy ofendido..."
 me_soodak_100_e_tooltip:0 "Esta opción está disponible porque nuestra religión estatal es #Y $buddhism$#!, #Y $jainism$#!, #Y $hindu$#!, #Y $agama$#! o #Y $ajivika$#!, o porque nuestra cultura principal es #Y $indo_germanic$#!."
 me_soodak_100_e2_tooltip:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! se sentirá un poco confundido, pero no se opondrá a nuestra elección."
 
 me_soodak_101_title:0 "Una solicitud de #E [SCOPE.sCountry('soodak_country').GetName]#!"
 me_soodak_101_desc:0 "Nuestra colonia de #E [SCOPE.sCountry('soodak_country').GetName]#! ha organizado un gobierno colonial formal para administrar mejor sus asuntos y ha decidido sabiamente que lo mejor para ellos es ser gobernado por un representante de nuestro gobierno. Sin embargo, han solicitado específicamente a un miembro de nuestra casa real que los guíe, y aunque nuestra corte se siente halagada por la idea, la idea de enviar a un miembro de nuestra casa digna a mancharse las manos en un remanso es, en el mejor de los casos, ridícula para muchos de nuestros asesores más cercanos, quienes en cambio sugieren que sería más apropiado enviar a un burócrata de acciones comunes."
 me_soodak_101.a:0 "Creo que sería bueno difundir nuestra noble semilla..."
 me_soodak_101.b:0 "Un administrador colonial podría extraer más riqueza de nuestra colonia."
 me_soodak_101.c:0 "La propia audacia de este absurdo no merece respuesta, pueden gobernarse a sí mismos."
 me_soodak_101.d:0 "¡Qué gran oportunidad, iré allí yo mismo!"
 me_soodak_101_d_tt:0 "#R ¡ADVERTENCIA!#! Nuestro gobernante dimitirá y se trasladará a nuestra colonia."
 
 me_soodak_102_title:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! ¡acepta!"
 me_soodak_102_desc:0 "¡Nuestra graciosa patria ha aceptado nuestra propuesta! Aunque hubo algunos que estaban preocupados de que nuestra solicitud hubiera sido demasiado exigente, obtuvimos lo que queríamos y ahora tenemos un miembro de la #E [SCOPE.sCountry('soodak_overlord').GetAdjective]#! casa real reinando sobre nuestra colonia."
 me_soodak_102.a:0 "¡Por el rey y que nuestros lazos prosperen!"
 
 me_soodak_103_title:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! rechaza"
 me_soodak_103_desc:0 "Aunque pensábamos que tener una realeza mejoraría nuestros lazos y legitimaría nuestro gobierno, desafortunadamente nuestros señores nos han etiquetado como un \"remanso\" que sólo \"mancillaría las manos de su respetada nobleza\". En cambio, #E [SCOPE.sCountry('soodak_overlord').GetName]#! ha enviado a un burócrata extorsionador que no oculta sus intenciones de desnudarnos. Aunque tenemos la obligación de beneficiar financieramente a la patria, a muchos miembros de nuestro consejo les preocupa que los duros métodos de este hombre puedan restringir nuestro crecimiento y mantener la prosperidad fuera de nuestro alcance."
 me_soodak_103.a:0 "Hacemos lo que nuestro soberano nos ordena."
 me_soodak_103.b:0 "Aunque inicialmente no buscaba el poder, me veo obligado a reinar."
 me_soodak_103.c:0 "Buscaremos un noble extranjero."
 me_soodak_103_b_tt:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! no estará contento con nuestro rechazo."
 me_soodak_103_c_tt:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! se enojará por nuestra decisión y puede imponer sanciones financieras a nuestra colonia."
 me_soodak_103_c2_tt:0 "Buscaremos un noble de #E [SCOPE.sCountry('soodak_foreign_nobility_target').GetName]#! para que nos guíe y conduzca."
 
 me_soodak_104_title:0 "#E [SCOPE.sCountry('soodak_country').GetName]#! ¡rechaza a nuestro gobernador!"
 me_soodak_104_desc:0 "Aunque pensábamos que nuestro gobernador se aseguraría de que sacaríamos provecho de nuestra colonia, se ha hecho evidente que lo rechazaron de plano y enviaron su barco de regreso aquí antes de que pudiera poner un pie en tierra firme. En su lugar, el administrador interino ha manifestado que tiene intención de permanecer en el cargo de forma indefinida. Aunque esto es un desafío flagrante a nuestra autoridad, nuestros asesores señalan que #E [SCOPE.sCountry('soodak_country').GetName]#! está muy lejos y ellos mismos iniciaron esta discusión."
 me_soodak_104.a:0 "Un tirón de orejas será suficiente."
 
 me_soodak_105_title:0 "Un enviado de #E [SCOPE.sCountry('soodak_country').GetName]#!"
 me_soodak_105_desc:0 "Hoy hemos recibido un enviado especial de la lejana isla de '#E [SCOPE.sCountry('soodak_country').GetName]#!', una colonia de #E [SCOPE.sCountry('soodak_overlord').GetName]#!. Nos dice que la colonia había tratado de legitimar su frágil posición colocando a un miembro de la realeza menor de su patria en su trono, pero que su tiránico señor se negó, obligándolos a buscar más allá de sus fronteras un líder lo suficientemente noble como para guiarlos. Aunque podemos satisfacer su solicitud y colocar a un miembro de nuestra propia familia en el trono #E [SCOPE.sCountry('soodak_country').GetName] #!, no son más que una colonia, una extranjera además, y hacerlo provocaría #E [SCOPE.sCountry('soodak_overlord').GetName] #!. Sin embargo, esto también sería una oportunidad para abrir una brecha entre #E [SCOPE.sCountry('soodak_overlord').GetName]#! y su colonia, debilitando su imperio con un costo mínimo para nosotros."
 me_soodak_105.a:0 "¡Estaremos encantados de enviar a un miembro de nuestra estimada familia!"
 me_soodak_105.b:0 "No podemos permitirnos el lujo de provocar la ira de #E [SCOPE.sCountry('soodak_overlord').GetName]#!."
 
 me_soodak_106_title:0 "#E [SCOPE.sCountry('soodak_foreign_nobility_target').GetName]#! ¡acepta!"
 me_soodak_106_desc:0 "Nuestro enviado nos dice que #E [SCOPE.sCountry('soodak_foreign_nobility_target').GetName]#! ha aceptado nuestra propuesta, y un miembro de su familia real, [SCOPE.sCharacter('soodak_foreign_noble').GetName], ahora viene a reinar en lo alto de nuestro trono recién creado, otorgando mucha legitimidad tanto a los ojos de nuestro pueblo como a los ojos del mundo. Sin embargo, es probable que #E [SCOPE.sCountry('soodak_overlord').GetName]#! no reciba bien la noticia."
 me_soodak_106.a:0 "¡Todos saluden [SCOPE.sCharacter('soodak_foreign_noble').GetName]!"
 
 me_soodak_107_title:0 "#E [SCOPE.sCountry('soodak_foreign_nobility_target').GetName]#! rechaza"
 me_soodak_107_desc:0 "Aunque nuestro enviado fue bien recibido por #E [SCOPE.sCountry('soodak_foreign_nobility_target').GetName]#!, desafortunadamente se negaron, citando su preocupación por provocar la ira de #E [SCOPE.sCountry('soodak_overlord').GetName]#!. Esto nos deja con dos opciones; podemos empoderar a nuestro gobernador temporal como nuestro primer rey o podemos aceptar a regañadientes al candidato de nuestra patria. ¿Cuál es tu decisión?"
 #me_soodak_107_desc:0 "Although our envoy was well-received by #E [SCOPE.sCountry('soodak_foreign_nobility_target').GetName]#!, unfortunately they have declined, citing their concerns over drawing #E [SCOPE.sCountry('soodak_overlord').GetName]#!'s ire. This leaves us with three options; we can ask another country if they would be willing to provide us with a noble to guide our colony, we can empower our temporary governor as our first king, or we can begrudgingly accept our motherland's candidate."
 me_soodak_107.a:0 "Le daremos una oportunidad a este gobernador extorsionador."
 me_soodak_107.b:0 "Acepto humildemente el reinado de Soodak."
 me_soodak_107.c:0 "Lo intentaremos nuevamente con #E [SCOPE.sCountry('scope:soodak_colonial_governor').GetName]#!"
 
 me_soodak_108_title:0 "¡#E [SCOPE.sCountry('soodak_country').GetName]#! instala un gobernante extranjero!"
 me_soodak_108_desc:0 "Aunque pensábamos que nuestro gobernador se aseguraría de que sacaríamos provecho de nuestra colonia, se ha hecho evidente que lo rechazaron de plano y enviaron su barco de regreso aquí antes de que pudiera poner un pie en tierra firme. Sin embargo, no sólo han desafiado descaradamente nuestra autoridad, sino que también han aumentado drásticamente las apuestas al colocar a un extranjero a cargo, entre los bárbaros de #E [SCOPE.sCountry('soodak_foreign_nobility_target').GetName]#!, tensando los vínculos con la benevolente patria y socavando nuestra autoridad; La gente en toda la capital está furiosa, denunciando a los Soodakers por su traición y deslealtad, y nuestros asesores más cercanos dicen que no nos han dejado otra alternativa que imponer duras sanciones a nuestra colonia para volver a alinearla."
 me_soodak_108.a:0 "Un tirón de orejas será suficiente."
 me_soodak_108.b:0 "Las sanciones más aplastantes están en orden. Entonces sabrán que deben alinearse."
 #me_soodak_108.c:0 "Demand they recall the foreigner at once!"
 
 me_soodak_109_title:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! impone sanciones!"
 me_soodak_109_desc:0 "No pretendíamos tener mala voluntad hacia nuestra querida patria, pero desafortunadamente han considerado oportuno imponer duras y crueles sanciones a nuestra colonia hasta que instalemos a su gobernador elegido, atacando nuestros vitales envíos de alimentos y redirigiendo los buques mercantes hacia Escandia. Aunque ahora somos autosuficientes y podemos resistir los golpes, el costo será alto, y muchos están contemplando enviar a nuestro gobernante recientemente designado de regreso a #E [SCOPE.sCountry('soodak_foreign_nobility_target').GetName]#!."
 me_soodak_109.a:0 "capearemos la tormenta."
 me_soodak_109.b:0 "¡Cometimos un error!"
 
 me_soodak_110_title:0 "Nuestra colonia se pliega"
 me_soodak_110_desc:0 "Sintiendo la presión de nuestras poderosas sanciones, nuestra colonia renegada de #E [SCOPE.sCountry('soodak_country').GetName]#! ha decidido plegarse y someterse a nuestra autoridad, colocando a nuestro estimado gobernador en su trono. Ahora, nuestros asesores consideran oportuno eliminar las sanciones financieras y los derechos impuestos, pero este episodio no será olvidado pronto."
 me_soodak_110.a:0 "No tenemos nada que temer de un remanso."
 
 me_soodak_111_title:0 "#E [SCOPE.sCountry('soodak_country').GetName]#! ¡Exilia nuestra nobleza!"
 me_soodak_111_desc:0 "Recientemente, enviados de #E [SCOPE.sCountry('soodak_country').GetName]#! vinieron a nosotros, rogando que uno de nuestros nobles los guiara y dirigiera; Aceptamos, sabiendo que podría causar tensión entre ellos y sus #E [SCOPE.sCountry('soodak_overlord').GetAdjective]#! amos. Sin embargo, solo unas semanas después, recibimos a [SCOPE.sCharacter('soodak_foreign_noble').GetName] en la puerta de nuestra casa, con frío, hambre y tristeza. Aparentemente, ante la #E [SCOPE.sCountry('soodak_overlord').GetAdjective]#! presión, lo habían expulsado apresuradamente pocos días después de su coronación, insultando tanto a nuestra familia gobernante como a #E [SCOPE.sCountry('soodak_foreign_nobility_target').GetName]#! en su conjunto."
 me_soodak_111.a:0 "No tendremos nada más que ver con estos bárbaros."
 
 me_soodak_112_title:0 "¿#E [SCOPE.sCountry('soodak_overlord').GetName]#! no impone sanciones?"
 me_soodak_112_desc:0 "No pretendíamos tener mala voluntad hacia nuestra querida patria, y nuestros asesores más cercanos habían previsto que habría represalias contra nuestra colonia. Sin embargo, aparentemente nuestros señores supremos no se dieron cuenta o no les importó particularmente, y abandonaron el asunto por completo, imponiéndonos sólo una suma simbólica."
 me_soodak_112.a:0 "Confuso, pero este resultado es aceptable."
 
 me_soodak_113_title:0 "#E [SCOPE.sCountry('soodak_overlord').GetName]#! ¡acepta!"
 me_soodak_113_desc:0 "Nuestra graciosa patria ha aceptado nuestra propuesta, pero no de una manera que nadie hubiera podido sospechar; En un giro inesperado del destino, el rey [SCOPE.sCharacter('soodak_lunatic_king').GetName] renunció a su puesto [SCOPE.sCharacter('soodak_lunatic_king').GetHerHis] para gobernar nuestra colonia directamente. Algunos dicen que está loco, otros que son ilustrados, pero pase lo que pase a continuación, conseguimos lo que queríamos y ahora tenemos a un miembro de la #E [SCOPE.sCountry('soodak_overlord').GetAdjective]#! casa real reinando sobre nuestra colonia."
 me_soodak_113.a:0 "¡Todos saluden [SCOPE.sCharacter('soodak_lunatic_king').GetName]!"
 
 me_soodak_114_title:0 "¡[SCOPE.sCharacter('soodak_ruler').GetName] proclama gobernador a [SCOPE.sCharacter('soodak_ruler').GetHerselfHimself]!"
 me_soodak_114_desc:0 "Cuando establecimos #E [SCOPE.sCountry('soodak_country').GetName]#!, establecimos un consejo temporal para gobernar hasta el momento en que pudieran autoorganizarse. Sin embargo, el líder interino de dicho consejo, [SCOPE.sCharacter('soodak_ruler').GetName], lo ha disuelto y proclamado poder absoluto como gobernador vitalicio, supuestamente con el apoyo popular del pueblo."
 me_soodak_114.a:0 "Mientras sigan enviándonos a Amber."
 
 me_soodak_115_title:0 "¿Un gurú en #E [SCOPE.sCountry('soodak_country').GetName]#!?"
 me_soodak_115_desc:0 "Cuando establecimos #E [SCOPE.sCountry('soodak_country').GetName]#!, establecimos un consejo temporal para gobernar hasta el momento en que pudieran autoorganizarse. Sin embargo, en lugar de solicitar un gobernador, han nombrado a un gurú espiritual del otro lado del mundo para que los guíe y los conduzca hacia la iluminación. Aunque nuestros asesores más cercanos están desconcertados, nadie puede oponerse a que un hombre tan sabio y decidido haya caminado desde la India."
 #me_soodak_115.a:0 "As long as they keep sending us Amber." #Hash conflict with PROV7299, do not uncomment
 
 me_soodak_116_title:0 "Una palmada en la muñeca"
 me_soodak_116_desc:0 "Aunque la patria está ligeramente decepcionada con nuestra elección de liderazgo, han decidido que no vale la pena ni su tiempo ni su esfuerzo anular nuestra decisión, y sólo le están dando a nuestra colonia un castigo simbólico."
 me_soodak_116.a:0 "No es el mejor resultado, pero podría haber sido mucho peor."
 
 me_soodak_117_title:0 "Una solicitud de #E [SCOPE.sCountry('soodak_country').GetName]#!"
 me_soodak_117_desc:0 "Nuestra colonia de #E [SCOPE.sCountry('soodak_country').GetName]#! ha organizado un gobierno colonial formal para administrar mejor sus asuntos y ha decidido sabiamente que lo mejor para ellos es ser gobernado por un representante de nuestro gobierno. Sin embargo, hay numerosos candidatos calificados que compiten por el puesto, lo que deja a nuestros asesores divididos sobre a quién nombrar. Algunas sugerencias incluyen un explorador y etnógrafo hábil para mapear mejor el terreno y sus habitantes, un orador que pueda garantizar la lealtad de nuestros colonos a la patria, o uno de nuestros mejores generales militares para protegerlos de las incursiones bárbaras. \n\n Otros, sin embargo, sugieren un administrador eficiente y feroz que, aunque controvertido en sus métodos, podría obtener el mayor beneficio de nuestra pequeña colonia, aunque puede resultar controvertido entre los Soodakers. ¿Quién liderará #E [SCOPE.sCountry('soodak_country').GetName]#! en nuestro nombre?"
 me_soodak_117.a:0 "¡Mi querido sobrino!"
 me_soodak_117_a_tt:0 "Esta opción está disponible porque somos una monarquía."
 me_soodak_117.b:0 "Un orador dirigirá #E [SCOPE.sCountry('soodak_country').GetName]#! en la dirección correcta..."
 me_soodak_117.c:0 "Un explorador nos proporcionará información precisa."
 me_soodak_117.d:0 "El general se asegurará de que puedan defenderse."
 me_soodak_117.e:0 "Un administrador colonial podría extraer más riqueza de nuestra colonia."
 me_soodak_117.f:0 "Un borracho encontrado en plena calle."
 
 me_soodak_118_title:0 "¡Gobernador recibido!"
 me_soodak_118_desc:0 "Nuestra patria ha enviado al candidato a gobernador más cualificado disponible, que ahora asumirá su cargo y compartirá el poder con los Burgzhusa, apaciguando así tanto a monárquicos como a republicanos."
 me_soodak_118.a:0 "Que prosperemos bajo la dirección de la patria."
 

 #Androphagian Expedition Event Chain
 me_soodak_900_title:0 "Preparando la expedición"
 me_soodak_900_desc:0 "Aunque fue una deliberación particularmente acalorada y divisiva, ahora que hemos decidido buscar una audiencia con los misteriosos e infames Andrófagos, debemos enviar a nuestro mensajero para localizarlos y establecer contacto. Un viaje tan largo en estas regiones peligrosas requerirá muchas provisiones y suministros. ¿Cuánto de nuestros preciosos suministros de alimentos y recursos asignaremos a esta expedición?"
 me_soodak_900.a:0 "¡Les daremos toda la comida, ropa y dinero que necesiten!"
 me_soodak_900.b:0 "provisiones resistentes para un año y conjuntos extra de abrigos de invierno, nada más."
 me_soodak_900.c:0 "Ropa de invierno y seis meses de comida y agua."
 me_soodak_900.d:0 "Las delicadas túnicas de los nobles y un mes de la comida más lujosa que Soodak tiene para ofrecer."
 me_soodak_900.e:0 "Nada excepto las pieles de sus espaldas."
 me_soodak_900.f:0 "Les daremos comida y un pequeño obsequio para nuestros futuros amigos..."
 me_soodak_900_tt:0 "Recibiremos noticias de la expedición dentro de unos meses."
 
 
 me_soodak_901_title:0 "Muerte de los andrófagos"
 me_soodak_901_desc:0 "Después de meses de búsqueda, aunque nuestra expedición finalmente pudo localizar el sitio que nuestras fuentes dijeron que era el corazón mítico de Andrófago, desafortunadamente todo lo que queda de este otrora próspero asentamiento son las chozas abandonadas, oscuras quemaduras de ceniza que marcan y arruinan la tierra, y un tinte claramente desagradable de carne humana que impregna el aire amargo. Después de explorar más profundamente en el bosque, se encontraron recolectores y rezagados en las cercanías, quienes afirman que este era, de hecho, donde una vez habitaron los andrófagos, pero fueron atacados inesperadamente por una fuerza mayor, lo que resultó en su completa destrucción como pueblo. Viendo que estos vagabundos carecían de un hogar y eran expertos en vivir de esta tierra maldita, el líder de nuestra expedición les ofreció unirse a nosotros en Soodak, quienes ahora sin duda resultarán invaluables en el desarrollo de nuestro propio asentamiento."
 me_soodak_901.a:0 "Una decepción, pero no una pérdida total."
 me_soodak_901_tt:0 "3 $uralic_pantheon$, $androphagian$ $tribesmen$ se instalarán en la capital."
 
 me_soodak_902_title:0 "Expedición desaparecida"
 me_soodak_902_desc:0 "Ha pasado casi un año desde que nuestra expedición partió en busca de los Andrófagos, pero todavía no hemos recibido respuesta de ellos, y a estas alturas deberían haber enviado algún tipo de mensajero para informarnos de su progreso. En Soodak se teme que se hayan perdido o incluso que se hayan quedado sin provisiones adecuadas y hayan muerto en el viaje. Hay muchos que claman por que enviemos una expedición de seguimiento para tratar de encontrarlos antes de que mueran de hambre, o al menos localizar sus cuerpos para un entierro adecuado. ¿Qué debemos hacer?"
 me_soodak_902.a:0 "Envía una expedición de seguimiento, ¡tenemos que salvar a nuestra gente mientras podamos!"
 me_soodak_902.b:0 "Están demasiado lejos, no hay manera de que alguien pudiera haber sobrevivido."
 
 me_soodak_903_title:0 "El sobreviviente regresa a casa"
 me_soodak_903_desc:0 "Hace más de un año, enviamos una expedición a los confines de Hiperbórea, con la esperanza de encontrar la tribu mítica de los Andrófagos. Sin embargo, cuando resultó evidente que la expedición no había regresado, asumimos que estaban muertos y no nos molestamos en enviar un equipo de seguimiento. Ahora, meses después, en mitad de la noche, un hombre medio muerto de hambre se arrastró hasta las puertas de la ciudad, delirando, deshidratado y terriblemente congelado. Después de pasar la noche al cuidado de nuestro chamán más estimado, comenzó a recuperarse y pudimos reconstruir su historia. Aparentemente, este hombre era miembro de la desafortunada expedición, que se había topado con una tormenta de nieve particularmente fuerte, lo que los obligó a refugiarse en una cueva cercana. Desafortunadamente, la entrada quedó rápidamente cubierta por la nieve, atrapándolos durante semanas, y no fueron enviados con suficientes suministros vitales para sobrevivir hasta el deshielo. Quizás una expedición de seguimiento podría haber ayudado a romper la nieve y el hielo, pero nunca llegó, y sus desesperados gritos de ayuda sonaron huecos; Como resultado, los pocos desafortunados que aún estaban vivos se vieron obligados a recurrir al canibalismo. Finalmente, la nieve se derritió y este sobreviviente pudo vagar solo por el bosque y encontrar milagrosamente el camino de regreso a Soodak con vida."
 me_soodak_903.a:0 "Ups."
 #me_soodak_903.b:0 "As far as I am aware, he did conveniently perish just-before reaching the city." #Cruel Option
 me_soodak_903.b:0 "Una verdadera tragedia, que nadie sabrá."
 me_soodak_903.c:0 "¡Él puede enseñarnos las formas de consumir carne humana!"
 me_soodak_903.d:0 "Me siento absolutamente horrible, sólo se me ocurre una manera de compensar esto..."
 me_soodak_903_kindly_tt:0 "#R ¡ADVERTENCIA!#! Nuestro gobernante actual dejará su liderazgo en favor del superviviente."
 
 me_soodak_904_title:0 "No hay noticias del equipo de seguimiento"
 me_soodak_904_desc:0 "Hace más de un año, enviamos una expedición a los confines de Hiperbórea, con la esperanza de encontrar la tribu mítica de los Andrófagos. Sin embargo, cuando resultó evidente que la expedición no había regresado, enviamos una expedición de seguimiento con la esperanza de localizar a los supervivientes. Desafortunadamente, el equipo de seguimiento tampoco ha regresado, lo que hace que muchos asuman lo peor y cuestionen su sabiduría al enviar aún más personas a morir. Aunque podríamos enviar una tercera expedición, nadie en Soodak estaría dispuesto a ofrecerse como voluntario para tal excursión, dada la historia reciente."
 me_soodak_904.a:0 "Quizás tengamos que contactar con los Andrófagos en otro momento."
 
 me_soodak_905_title:0 "¡Sobrevivientes encontrados!"
 me_soodak_905_desc:0 "Hace más de un año, enviamos una expedición a los confines de Hiperbórea, con la esperanza de encontrar la tribu mítica de los Andrófagos. Sin embargo, cuando resultó evidente que la expedición no había regresado, enviamos una expedición de seguimiento con la esperanza de localizar a los supervivientes. Afortunadamente, mientras patrullaban una cueva cercana cubierta de nieve, el equipo de seguimiento pudo escuchar gritos de ayuda desde el interior y trabajó para romper la nieve y el hielo para llegar a los supervivientes, que se habían quedado sin comida y estaban considerando recurrir al canibalismo. Han sido traídos de regreso, y aunque no encontraron a los Andrófagos, han regresado a casa como héroes, un brillante ejemplo de determinación, coraje e ingenio de Soodak, lo que refleja en gran medida su toma de decisiones y nuestra colonia en su conjunto."
 me_soodak_905.a:0 "¡Nunca dejamos atrás a nuestros hombres!"
 
 me_soodak_906_title:0 "La expedición llega a los andrófagos"
 me_soodak_906_desc:0 "¡Hemos recibido noticias de que nuestra expedición ha llegado a los Andrófagos y que está cerca de lograrse un avance diplomático! Sólo queda una cena culta."
 me_soodak_906.a:0 "¡Buenas noticias, nuestra iniciativa da frutos!"
 
 me_soodak_9071_title:0 "Hombres extraños del mar"
 me_soodak_9071_desc:0 "Un grupo de hombres vestidos de manera extraña llegó hoy a la capital afirmando ser de una isla lejana llamada 'Soodak', buscando tratar con nosotros y establecer un 'diálogo' como la única otra tribu en Hiperbórea. No traen regalos de comida, excepto la carne que reposa sobre sus huesos..."
 me_soodak_9072_title:0 "$me_soodak_9071_title$"
 me_soodak_9072_desc:0 "Un grupo de hombres vestidos de manera extraña llegó hoy a la capital afirmando ser de una isla lejana llamada 'Soodak', buscando tratar con nosotros y establecer un 'diálogo' como la única otra tribu en Hiperbórea. Traen obsequios de comida para demostrar su agradecimiento y sus ganas de entablar una relación, aunque sí huelen bien..."
 me_soodak_9073_title:0 "$me_soodak_9071_title$"
 me_soodak_9073_desc:0 "Un grupo de hombres vestidos de manera extraña llegó hoy a la capital afirmando ser de una isla lejana llamada 'Soodak', buscando tratar con nosotros y establecer un 'diálogo' como la única otra tribu en Hiperbórea. Traen como obsequio algunos de los mejores y más ricos alimentos de su tierra natal para mostrar su gratitud y su deseo de establecer una relación, y aunque la comida huele bien, huele mejor..."
 me_soodak_9074_title:0 "$me_soodak_9071_title$"
 me_soodak_9074_desc:0 "Un grupo de hombres vestidos de manera extraña llegó hoy a la capital afirmando ser de una isla lejana llamada 'Soodak', buscando tratar con nosotros y establecer un 'diálogo' como la única otra tribu en Hiperbórea. Conociendo bien nuestras tradiciones, nos traen un cuerpo fresco para que nos deleitemos, ¡para deleite de los jefes de nuestros clanes! Sin embargo, ¿también nos deleitamos con ellos?"
 me_soodak_907.a:0 "Serán un festín, con nuestra legendaria hospitalidad andrófaga..."
 me_soodak_907.b:0 "Pueden tratarnos con nosotros, siempre que puedan soportar nuestros estómagos llenos..."
 me_soodak_907.c:0 "Seremos suaves con ellos y evitaremos nuestra comida favorita esta noche."
 
 me_soodak_908_title:0 "El regreso de la expedición"
 me_soodak_908_desc:0 "Después de nuestro último informe de progreso, no habíamos tenido noticias de nuestra expedición y muchos comenzaban a preocuparse de que las conversaciones hubieran ido mal. Eso fue hasta que recibimos a nuestras puertas un mensajero curioso que llevaba un paquete peculiar. Este hombre es un esclavo ligado a los Andrófagos e informa que nuestro equipo fue invitado a una cena donde, después de atiborrarse de delicioso venado y champiñones, ¡se convirtieron en el plato principal! Los andrófagos los devoraron a todos en el acto, como una jauría de perros hambrientos, salvo una mano disecada, que enviaron como mensaje para hacernos saber que nuestra gente fue \"bien tratada por sus anfitriones\", y agregaron que \"podemos enviarles más golosinas\"."
 me_soodak_908.a:0 "¡Salvajes viles y sedientos de sangre, lamentarán el día en que cruzaron Soodak!"
 me_soodak_908.b:0 "Por las 'manos' de sus anfitriones, ese me gusta..."
 me_soodak_908.c:0 "¡Esto significa guerra!"
 soodak_rash_war_tt:0 "#R ¡ADVERTENCIA! #! Declararemos la guerra a la androfagia."
 
 me_soodak_909_title:0 "El regreso de la expedición"
 me_soodak_909_desc:0 "Después de nuestro último informe de progreso, no habíamos tenido noticias de nuestra expedición y muchos comenzaban a preocuparse de que las conversaciones hubieran ido mal. Sin embargo, eso fue hasta que la delegación regresó esta mañana. Dicen que se establecieron relaciones y que existe potencial para una futura alianza. Sin embargo, se vieron obligados a digerir un plato que los andrófagos llaman \"estómagos rellenos\"..."
 me_soodak_909.a:0 "Puede que sean viles, pero si alguna vez necesitamos ayuda, podrían echarnos una mano..."
 me_soodak_909.b:0 "¿Por casualidad divulgaron la receta?"
 
 me_soodak_910_title:0 "El regreso de la expedición"
 me_soodak_910_desc:0 "Después de nuestro último informe de progreso, no habíamos tenido noticias de nuestra expedición y muchos comenzaban a preocuparse de que las conversaciones hubieran ido mal. Sin embargo, eso fue hasta que la delegación regresó esta mañana. Dicen que se establecieron relaciones, que las conversaciones transcurrieron excepcionalmente bien y que existe potencial para una futura alianza. Los andrófagos incluso se abstuvieron de consumir carne humana, conociendo bien nuestras \"sensibilidades\", como tan amablemente decían."
 me_soodak_910.a:0 "Quizás su reputación sea inmerecida."
 

