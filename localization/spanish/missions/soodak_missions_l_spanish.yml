#### Germano-Finnic Soodak Colony Missions
l_spanish:

### MISSIONS
 01_soodak_missions: "Las tierras malditas"
 01_soodak_missions_DESCRIPTION: "Ubicadas mucho más allá del alcance incluso de las tribus bárbaras más resistentes, las tierras salvajes denominadas colectivamente '#E Hiperbórea#!' son tan vastas como desoladas, tan frías como oscuras y tan inhóspitas como cualquier región conocida por el hombre; Incluso el dios sol ha engendrado este lugar maldito y miserable. \n\nSin embargo, a pesar de toda lógica o razón, hemos decidido que aquí es el lugar donde se establecerá nuestra preciosa colonia, sobre la cual nuestro futuro, nuestras vidas y nuestro destino estarán ligados. Ahora que esos pocos nativos lo suficientemente valientes como para llamar hogar a este lugar nos enseñan sus formas de supervivencia y de la diosa de la luna, [GetDeityDefinition('omen_kuje').GetName], junto con el apoyo continuo de la patria, no necesitamos la bendición ni las maldiciones del dios del sol."
 01_soodak_missions_BUTTON_TOOLTIP: "En el fin del mundo, sobreviviremos y prosperaremos."
 01_soodak_missions_BUTTON_DETAILS: ""
 01_soodak_missions_CRITERIA_DESCRIPTION: "La misión se considerará completa cuando seamos autosuficientes, colonicemos y desarrollemos las tierras que rodean nuestra isla y hayamos forjado nuestra propia identidad."
 
 01_soodak_missions_task_1: "Asegurar el suministro de alimentos"
 01_soodak_missions_task_1_DESC: "[GetProvince('(int32)9371').GetName|T], aunque es rico en ámbar @amber!, carece de suministros alimentarios. Debemos tener amplias reservas de alimentos si queremos soportar los duros inviernos.\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

 01_soodak_missions_task_2: "Las costas de Anoppi"
 01_soodak_missions_task_2_DESC: "Aunque hemos establecido reservas estables de alimentos en nuestra isla rica en ámbar, todavía deja mucho que desear, y al otro lado del mar se encuentra una costa cuyas aguas están repletas de abundantes cantidades de peces @fish!, al menos para los estándares #G hiperbóreos#!; Al establecer un segundo asentamiento allí, no sólo ayudaremos a asegurar más alimentos para nuestra colonia, sino que también nos daremos un punto de apoyo en la continental.\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 01_soodak_missions_2_reward_tt: "#Y 2#! llegarán desde tierra firme y se asentarán en [GetProvince('(int32)9373').GetName|T]."

 01_soodak_missions_task_3: "Una flota marítima"
 01_soodak_missions_task_3_DESC: "[GetProvince('(int32)9371').GetName|T] es una gloriosa colonia minera de ámbar @amber! situada en la periferia más septentrional del mundo conocido; sin embargo, carecemos de la infraestructura necesaria para que los barcos atraquen de forma segura en nuestro puerto natural, de las instalaciones portuarias para reparar los que se nos crucen en el camino y de buques mercantes propios cuando ninguno es lo suficientemente valiente para cruzar estas latitudes, lo que obstaculiza gravemente nuestro potencial económico.\n\nAl invertir nuestro, bastante limitado, nuestro potencial económico. Recursos en un puerto útil y una flota de barcos de transporte sencillos, no sólo podremos atraer más visitantes curiosos y ricos a nuestra isla, sino que también tendremos la capacidad de enviar nuestras propias expediciones independientes a través de alta mar y a sistemas fluviales inexplorados sin depender de la patria.\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"

 01_soodak_missions_task_4: "¿Una sauna Sodaker?"
 01_soodak_missions_task_4_DESC: "Hace mucho frío en esta isla durante el invierno, lo que a menudo requiere que los adultos estén bien vestidos en todo momento para evitar una muerte por congelación, incluso dentro de los límites de un refugio protegido. Sin embargo, los pueblos nativos #G Fennic#! de la zona han desarrollado una innovación única que llaman #Y 'saknas'#!, o 'saunas', en las que se colocan rocas calientes en el centro de un pozo cubierto y luego se enfrían con agua para preparar un vapor caliente a través del cual el aire se satura y se hincha, induciendo una estado de relajación entre sus residentes y difundiendo una generosa calidez estival como nunca se ha visto en un hogar tradicional; de hecho, un calor tan generoso que permitió a los asistentes desnudarse y desnudarse.\n\nAunque muchos de nuestros colonos se muestran escépticos ante rituales tan exóticos y desagradables asociados con nuestros vecinos bárbaros, dichos vecinos han vivido aquí durante milenios, y muchos de nuestra gente aún se beneficiarían de tomar un baño caliente de vez en cuando; Al construir 'saunas' públicas en toda nuestra capital, se alentará a la gente a adoptar esta práctica, aumentando la habitabilidad de estas tierras malvadas y miserables.\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"

 01_soodak_missions_task_5: "Reclutar colonos adicionales"
 01_soodak_missions_task_5_DESC: "Aunque nuestra colonia ha alcanzado un grado notable de autosuficiencia, dada nuestra disposición, adolecemos de una falta distintiva de personas con las que poder disfrutar de nuestros magros éxitos; Al ofrecer vagos incentivos financieros y promesas de prosperidad muy exageradas a quienes residen en las superpobladas ciudades de nuestra patria, ampliaremos nuestra base colonial y sentaremos las bases para más asentamientos más allá de [GetProvince('(int32)9371').GetName|T] sí mismo.\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 01_soodak_missions_task_5_tt: "Entre #Y 3#! y #Y 12#! pops de la patria llegarán a #Y Soodak#!."

 01_soodak_missions_task_6: "Un plan insidioso"
 01_soodak_missions_task_6_DESC: "Muchas de nuestras partes interesadas influyentes han tomado nota de que llegan más colonos en tiempos de tensión y conflicto dentro de la patria, y el miedo a la persecución lleva a la gente a arriesgarse en nuestro desierto helado. Aunque somos parientes y parientes de nuestra patria, dado el tentador hecho de que nos beneficiamos de sus desgracias, algunos de nuestros asesores han sugerido un plan tan radical e insidioso que suscita una controversia considerable dentro de los niveles más altos de nuestra administración colonial: desestabilizamos intencionalmente la sociedad de nuestro señor supremo financiando a agitadores, disidentes y pretendientes para que hurguen en varias líneas de falla y áreas de autoridad, para hacer de [GetProvince('(int32)9371').GetName|T] una ciudad más atractiva. Destino. La sola idea es traicionera y, si nos pillan en cualquier etapa de la planificación, las consecuencias serían tan rápidas como inmensas; sin embargo, las recompensas pueden ser igualmente beneficioso...\n\n\n\n\n\n\n\n\n\n\n@celt_mil17!"
 01_soodak_missions_6_reward_tt: "Tendremos la oportunidad de obtener entre 20 y 30 muestras de nuestra cultura y religión principales."
 01_soodak_missions_6_warning_tt: "#R ¡ADVERTENCIA! #! Si nos descubren, enfrentaremos un castigo extremo."

 01_soodak_missions_task_7: "Reforzar el suministro de ámbar"
 01_soodak_missions_task_7_DESC: "Nuestra colonia se fundó principalmente con el deseo de extraer el precioso ámbar @amber! que abunda bajo el barro, pero, a pesar de nuestros mejores esfuerzos, la producción no ha alcanzado los niveles que coinciden con las expectativas. Afortunadamente para nosotros, hay otro depósito de ámbar al otro lado de la bahía de la capital, listo para ser colonizado y explotado.\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 01_soodak_missions_7_reward_tt: "Llegarán #Y 3#! pops desde tierra firme y se repartirán entre [GetProvince('(int32)9374').GetName|T] y [GetProvince('(int32)9375').GetName|T]."

 01_soodak_missions_task_8: "El granero de la OTAN"
 01_soodak_missions_task_8_DESC: "Aunque tenemos acceso a peces @fish! todo el año, importamos gran parte de nuestros alimentos @grain! del extranjero y carecemos de un plan de respaldo en caso de que esas redes se vean interrumpidas durante un período prolongado.\n\nAl este, los bosques de [GetProvince('(int32)9378').GetName|T] son lo suficientemente fértiles como para sustentar el cultivo de cereales resistentes durante el verano, y el pantano adyacente de [GetProvince('(int32)9379').GetName|T] es bastante adecuado para la cría de ganado resistente. Aunque no es una paleta tan agradable para esas importaciones extranjeras, al establecer asentamientos en estos territorios aseguraremos una mayor producción interna de alimentos y tal vez facilitaremos una expansión más profunda en el mundo. Interior.\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 01_soodak_missions_8_reward_tt: "Llegarán #Y 2#! pops desde tierra firme y se repartirán entre [GetProvince('(int32)9378').GetName] y [GetProvince('(int32)9379').GetName]."

 01_soodak_missions_task_9: "La costa norte"
 01_soodak_missions_task_9_DESC: "La costa norte es apenas habitable y no particularmente lucrativa, carece de ámbar @amber! y de alimentos @grain! y, sin embargo, tiene el potencial de reducir nuestra dependencia de la patria; la arcilla roja de [GetProvince('(int32)9372').GetName|T] es especialmente adecuada para elaborar loza @earthware! en la que se pueden almacenar nuestros productos, y el cáñamo silvestre @hemp! de [GetProvince('(int32)9377').GetName|T] se puede cultivar para hacer cuerdas vitales para mástiles y diversas construcciones. Al colonizar y desarrollar el norte hoy, nos preparamos para un mañana mejor.\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"

 01_soodak_missions_task_10: "Nuestro hogar asegurado"
 01_soodak_missions_task_10_DESC: "Después de años de esfuerzos para colonizar los territorios circundantes, establecer nuevos puestos de avanzada y domesticar la vasta naturaleza de nuestro nuevo hogar, hemos dejado de ser una pequeña @amber! isla minera de ámbar y ahora nos encontramos como dueños de todo #Y Ilmandu Superior#!, un brillante faro de civilización que arde a través del manto de la eterna oscuridad invernal. Sin embargo, a pesar de nuestro logro más impresionante, hemos abierto la puerta a una mayor expansión y conquista mucho más allá de la visión y la capacidad de nuestra patria. Expectativas.\n\n\n\n\n\n\n\n\n\n\n@italic_mil2!"

 01_soodak_missions_task_11: "La madera de nooli"
 01_soodak_missions_task_11_DESC: "A lo largo de las orillas del #Y lago Peipus#! se encuentra un denso bosque con abundante madera resistente y resistente a las enfermedades @wood! para cosechar, perfecta para construir refugios, barcos e incluso leña, junto con fuentes de vegetales nutritivos @vegetables! y animales de caza @wild_game! en las cercanías. Al reclamar estas tierras interiores, reducimos nuestra necesidad de depender de la patria.\n\n\n\n\n\n\n\n\n\n\n@italic_mil7!"
 01_soodak_missions_11_reward_tt: "#Y 3 #! pops de nuestra cultura y religión primarias se distribuirán entre [GetProvince('(int32)9382').GetName|T], [GetProvince('(int32)9380').GetName|T] y [GetProvince('(int32)9383').GetName|T]."

 01_soodak_missions_12: "Al otro lado del Peipus"
 01_soodak_missions_task_12_DESC: ""

 01_soodak_missions_task_13: "Al río vano"
 01_soodak_missions_task_13_DESC: "Aunque hemos establecido una presencia en #T Ilmandu Inferior#!, no es más que un mero punto de apoyo sobre tierras que abundan en recursos clave, marginalmente más cálidas y hospitalarias que nuestra área de la capital y, lo más importante, corren paralelas al #Y río Vain#!, una importante arteria comercial que penetra profundamente en la #G Hiperbórea#!. Al reclamar estas tierras, no sólo podremos ejercer nuestra influencia en zonas más profundas del desierto, sino que también podremos monopolizar todos los territorios con destino al Báltico. Comercio.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

 01_soodak_missions_task_14: "Más allá del viejo"
 01_soodak_missions_task_14_DESC: "En el remoto y vasto este se encuentra un río al que los lugareños se refieren como #Y 'Velho'#!, que según dicen conduce más allá de #G Hiperbórea#! a tierras salvajes que la civilización aún no conoce. Aunque será una tarea costosa, al establecer puestos de avanzada en las tierras que rodean este río y sus alrededores, podremos establecer redes comerciales con aquellos perdidos en la historia y tal vez sentar las bases para nuevas expediciones más allá del árbol. Línea.\n\n\n\n\n\n\n\n\n\n\n@italic_mil32!"

 01_soodak_missions_task_15: "Vuélvete hacia la diosa de la luna"
 01_soodak_missions_task_15_DESC: "Aunque hemos mantenido durante mucho tiempo nuestra fe en nuestros dioses, dadas nuestras dificultades y luchas, algunos están comenzando a cuestionar su fe en nosotros, y en particular en el dios sol, cuya presencia, o falta de ella, ha llevado a muchos a la conclusión de que nos ha maldecido. Los miembros de la tribu #G Fennic#! de esta zona, que han vivido aquí durante generaciones, adoran a la diosa de la luna, [GetDeityDefinition('omen_kuje').GetName|G], cuya presencia, por el contrario, es claramente visible durante los largos y mortíferos meses de invierno, quien, según afirman, protege a su gente de los mayores males de las noches más oscuras; de hecho, su culto ahora ha ganado seguidores entre nuestros colonos, creyendo que ellos también obtendrán su protección.\n\nAunque esto provocará un gran revuelo entre nuestros sacerdotes, quienes denuncian a los conversos como tontos equivocados cuya herejía sólo enojará aún más al dios del sol, al aceptar formalmente a [GetDeityDefinition('omen_kuje').GetName|G] en nuestro panteón, tal vez nosotros también disfrutemos de su bendiciones.\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 01_soodak_missions_task_15_tt: "Hasta #Y 6#! pops en la capital se convertirán en #Y $uralic_pantheon$#!."
 01_soodak_missions_task_15_tt2: "#R Esta tarea es mutuamente excluyente con '#T $01_soodak_missions_task_16$#!'#!"

 01_soodak_missions_task_16: "Reforzar a los dioses antiguos"
 01_soodak_missions_task_16_DESC: "Aunque hemos mantenido durante mucho tiempo nuestra fe en nuestros dioses, dadas nuestras dificultades y luchas, algunos están comenzando a cuestionar su fe en nosotros, y en particular en el dios sol, cuya presencia, o falta de ella, ha llevado a muchos a la conclusión de que nos ha maldecido. Como resultado, el culto pagano de [GetDeityDefinition('omen_kuje').GetName|G] ha comenzado a extenderse entre muchos de nuestros colonos, desilusionados por la indigencia y equivocados por falsas promesas, cuya herejía, según advierten nuestros sacerdotes, sólo enojará aún más al dios sol; Para garantizar nuestra salvación, debemos redoblar y reforzar los tradicionales #E ritos germánicos#! ofreciendo sacrificios extravagantes y disfrutando de grandes templos. Sólo entonces haremos las paces con nuestros dioses y levantaremos esta maldición.\n\n\n\n\n\n\n\n\n\n\n@italic_mil16!"
 01_soodak_missions_task_16_tt: "La capital tiene un edificio #Y $temple_building$#!."
 01_soodak_missions_task_16_tt3: "Tenemos al menos dos #Y $library_building$#! edificios dentro de una de nuestras ciudades."
 01_soodak_missions_task_16_tt2: "#R Esta tarea es mutuamente excluyente con '#T $01_soodak_missions_task_15$#!'#!"

 01_soodak_missions_task_17: "Solicitar ayuda financiera"
 01_soodak_missions_task_17_DESC: "Somos una colonia orgullosa que ha logrado lograr estabilidad, tanto política como financiera, así como fronteras seguras. Es muy apropiado que solicitemos ayuda financiera a nuestra generosa patria, como recompensa por nuestros esfuerzos y para que podamos esforzarnos en seguir creciendo.\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 01_soodak_missions_task_17_tt: "Tendremos la opción de pedirle a nuestro señor supremo una ayuda financiera, ya sea #Y 50#!, #Y 250#! o #Y 500#! de oro, pero cuanto más solicitemos, es menos probable que nos lo hagan."

 01_soodak_missions_task_18: "El sacrificio definitivo"
 01_soodak_missions_task_18_DESC: "Hemos apaciguado al #T Dios Sol#! por ahora, sin embargo, nuestros sacerdotes nos informan que para deshacernos verdaderamente de esta miserable maldición, debemos difundir un celo genuino y una creencia apasionada entre los habitantes nativos de estas tierras circundantes, similar a un bosque de ignorancia incendiado con la luz del conocimiento y la comprensión. Aunque muchos pueden profesar lealtad a los dioses por un lado, por el otro siguen a los espíritus de sus antepasados. Para demostrar el valor de nuestros dioses sobre los de todos los demás dentro de los corazones y las mentes de estos miembros de la tribu, desde ahora hasta el Ragnarok, sólo puede haber una manera; nuestro liderazgo asumiendo el máximo sacrificio, dando un ejemplo honorable para aquellos, tanto ahora como en el futuro, a emular en tiempos de gran crisis.\n\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 01_soodak_missions_task_18_tt: "#R ¡ADVERTENCIA!#! Nuestro #Y Gobernante#! o nuestro #Y Sumo Sacerdote#! serán sacrificados para apaciguar al #T Dios Sol#!."
 01_soodak_missions_task_18_tt2: "Tiene unidad religiosa mayor o igual a #Y 60#!."

 01_soodak_missions_task_19: "Entrelazarse con el continente"
 01_soodak_missions_task_19_DESC: "Aunque hayamos tenido diferencias en el pasado, nuestro señor supremo sigue siendo nuestro generoso protector y soberano, cuya fuerza enormemente superior, tanto militar como económica, es mejor considerar como amigo y socio que como competidor; Por lo tanto, es de nuestro interés natural vincular mejor nuestras economías invirtiendo en nuestros centros de mercado y reduciendo las restricciones a las importaciones extranjeras, beneficiando así a ambas partes en mutuo beneficio. Moda.\n\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 01_soodak_missions_task_19_tt: "#R Esta tarea es mutuamente excluyente con '#T Desacoplar del continente#!'#!."

 01_soodak_missions_task_20: "Compra Gutinland"
 01_soodak_missions_task_20_DESC: "A medida que nuestra colonia se entrelaza más con el continente, la línea entre [GetProvince('(int32)9371').GetName|T] y #G Germania#! se vuelve borrosa, similar a una espesa niebla matutina que flota sobre el agua y bajo el cielo. En este sentido, somos menos una provincia vasalla que una provincia autónoma, que existe para ayudar a nuestro señor supremo a administrar estas tierras remotas.\n\nAunque fuera de nuestra región designada, la isla de [GetProvince('(int32)6010').GetName|T] se encuentra más cerca de nuestra capital que de la de nuestra patria, lo que nos permitiría ejercer más control sobre ella y, por lo tanto, obtener más impuestos de ella, sin mencionar el aumento del comercio que traeríamos a todo el Báltico. Quizás podríamos convencer a Germania para que ceda esta isla a nuestra administración y nos permita gobernar en su nombre.\n\n\n\n\n\n\n\n\n\n\n@greek_mil21!"
 01_soodak_missions_task_20_tt: "Intentaremos comprar la isla de #Y [GetProvince('(int32)6010').GetName|T]#! a nuestro señor supremo."
 01_soodak_missions_task_20_tt2: "La capital de nuestro señor supremo no está en #Y [GetProvince('(int32)6010').GetName|T]#!."

 01_soodak_missions_task_21: "Solicitar asesores militares"
 01_soodak_missions_task_21_DESC: "Aunque nuestra milicia nos ha servido bien a lo largo de la frontera, para tener una fuerza verdaderamente capaz de apoyar a la patria durante una época de crisis, necesitamos reformar nuestro conjunto de fuerzas heterogéneas para convertirlas en un verdadero ejército permanente; Con ese fin, al solicitar algunos de los mejores asesores militares de nuestros señores supremos, podremos apoyarnos en su experiencia adquirida a lo largo de años de guerra y obtener acceso a tácticas de vanguardia para los campos de batalla de mañana.\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 01_soodak_missions_task_21_tt: "Recibiremos un general de alto nivel marcial."
 01_soodak_missions_task_21_tt2: "Tenemos al menos un edificio #Y $military_building$#!."

 01_soodak_missions_task_22: "El boom del ámbar"
 01_soodak_missions_task_22_DESC: "El ámbar @amber! extraído de [GetProvince('(int32)9371').GetName|T] es el orgullo de nuestra administración, su cristal de color naranja vibrante se encuentra entre los mejores encontrados en el mundo y, sin embargo, incluso con una gran inversión, aún queda mucho más por extraer y refinar. Nuestros asesores financieros especulan que con su incomparable popularidad en casa, existe potencial para un #Y 'Auge ámbar'#!, por así decirlo, si tan solo pudiéramos ponerlo en marcha mediante la construcción de una cantidad inicial de fundiciones, atrayendo así a empresarios más ricos del continente para administrarlas, quienes a su vez importarían más trabajadores para dragar más de esta sustancia increíblemente valiosa para refinarla y venderla en el extranjero. Es un ciclo cíclico de ganancias y riqueza esperando a nuestro alcance.\n\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 01_soodak_missions_task_22_tt: "Obtendremos #Y 10#! pops en cada #Y $amber$#!-territorio o ciudad productora que poseamos."

 01_soodak_missions_task_23: "La joya de la corona de Germania"
 01_soodak_missions_task_23_DESC: "Hace generaciones, comenzamos como una colonia rebelde, un remanso cuyo único propósito era extraer y recolectar ámbar @amber! para nuestros señores supremos, en un terreno demasiado traicionero para hacerlo ellos mismos. Gracias a nuestros éxitos, llegamos a dominar el mercado y, atrayendo una afluencia de colonos, crecimos como un espejo de nuestra patria, con el gobierno organizado de manera civilizada, ciudades erigidas en el desierto y los feroces bárbaros pacificados; un reflejo vidrioso, teñido de un precioso naranja. A medida que hemos seguido entrelazando nuestra economía, diplomacia y vidas con las de nuestros señores supremos, hemos ganado una merecida reputación de confiabilidad y lealtad, una extensión de la propia #G Germania#! y, a través de nuestra riqueza, un título que nos ha concedido cariñosamente: la joya de la corona de la imperio.\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"

 01_soodak_missions_task_24: "Desacoplarse del continente"
 01_soodak_missions_task_24_DESC: "Aunque pocos están dispuestos a discutir el tema en público, nuestro acuerdo actual con la patria es cada vez más insostenible, quien en ocasiones hace lo correcto con nosotros, pero impone impuestos cada vez más severos a nuestro pueblo, mientras que, por el contrario, descuida aún más nuestras necesidades. La independencia, como algunos han argumentado, es todavía un paso demasiado lejos; sin embargo, deberíamos comenzar el proceso de desvincularnos del continente, de modo que, si sucediera lo peor, estaremos preparado.\n\n\n\n\n\n\n\n\n\n\n@celt_mil17!"
 01_soodak_missions_task_24_tt: "No importamos ningún bien comercial de nuestro señor supremo."
 01_soodak_missions_task_24_tt2: "#R Esta tarea es mutuamente excluyente con '#T Intertwine With The Mainland#!'#!."

 01_soodak_missions_task_25: "Reformar la milicia"
 01_soodak_missions_task_25_DESC: "Nuestra milicia nos ha servido bien a lo largo de la frontera, sin embargo, nuestra colección de fuerzas heterogéneas no está en condiciones de enfrentarse al poder del #G Imperio Germánico#!, cuyos escudos caseros y espadas viejas y oxidadas serían destrozados por las disciplinadas legiones de este último. Necesitamos un hombre con un plan y, afortunadamente para nosotros, nuestros contactos nos hablan de un general capaz de [GetProvince('(int32)3967').GetName|T] que, después de haber sido expulsado del ejército germánico por un rival influyente, está dispuesto y es capaz de servir a nuestro país. Causa.\n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 01_soodak_missions_task_25_tt: "#R Esta tarea es mutuamente excluyente con '#T $01_soodak_missions_task_27$#!'#!."

 01_soodak_missions_task_26: "Abraza el $uralic_pantheon$ Panteón"
 01_soodak_missions_task_26_DESC: "Con las bendiciones de la #T Diosa de la Luna#!, a pesar de los recelos de los sacerdotes, nuestro pueblo ha prosperado más allá de lo que muchos habrían considerado posible años antes, con lluvias fértiles durante el verano bendiciendo nuestras cosechas y las aullantes tormentas invernales causando menos daños. El antiguo orden sostiene que estas son meras coincidencias, pero la gente hace tiempo que perdió la confianza en ellos y en los dioses que dicen representar; Al barrer el sacerdocio arcaico y corrupto con hombres que tienen una conexión genuina con los dioses verdaderos, aseguraremos la prosperidad para nuestro pueblo y aplastaremos esta maldición.\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 01_soodak_missions_task_26_tt: "Tenemos al menos #Y 2#! $uralic_pantheon$ deidades en nuestro panteón."

 01_soodak_missions_task_27: "Ampliar La Milicia"
 01_soodak_missions_task_27_DESC: "Nuestra milicia nos ha servido bien a lo largo de la frontera y, aunque su calidad es inferior a la de muchos de los grandes ejércitos del mundo, siendo realistas, esa es una perfección que nunca podremos igualar. Por lo tanto, es lógico invertir en cantidad y, al permitir que ciudadanos de todas las edades y aptitudes respondan al llamado a la guerra, podremos aprovechar al máximo nuestro campo y, sin un ejército permanente, aliviaremos las preocupaciones de que un gobierno independiente abuse de su poder. Potencia.\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 01_soodak_missions_task_27_tt: "#R Esta tarea es mutuamente excluyente con '#T $01_soodak_missions_task_25$#!'#!"

 01_soodak_missions_task_28: "Incorporar el conocimiento nativo"
 01_soodak_missions_task_28_DESC: "Los pueblos #G Fennic#! han vivido en esta tierra durante generaciones y, por lo tanto, conocen bastante este terreno, con información sobre dónde crecen las bayas silvestres en tiempos de escasez, dónde residen los animales salvajes y los mejores lugares para colocar trampas para los conquistadores del mundo. Incorporando y aprendiendo de las estrategias de nuestros aliados, haremos que el enemigo luche por cada centímetro de nieve.\n\n\n\n\n\n\n\n\n\n\n@persia_mil17!"

 01_soodak_missions_task_29: "Una unión germano-fennica"
 01_soodak_missions_task_29_DESC: "Nuestra relación con el pueblo #G Fennic#! no siempre ha sido fácil; sin embargo, ahora que adoramos a los mismos dioses y seguimos a los mismos espíritus, muchos en ambos lados de la isla comienzan a ver que compartimos más similitudes que diferencias, especialmente en lo que respecta a nuestras quejas mutuas contra el señor supremo. Sin divisores claros después de generaciones de mezcla, cada vez es más difícil diferenciar entre #G germánico#! y fennico, particularmente bajo los débiles rayos de la [GetDeityDefinition('omen_kuje').GetName|G] bendita luz de la luna. Por lo tanto, para la perseverancia futura de nuestra colonia, es lógico que reconozcamos la situación sobre el terreno y abolamos formalmente las distinciones legales restantes entre nuestros dos pueblos, creando una sociedad más perfecta. Unión.\n\n\n\n\n\n\n\n\n\n\n@italic_mil11!"
 01_soodak_missions_task_29_tt: "La cultura #Y $fennic$#! tiene #Y $nobles$#! derechos."
 01_soodak_missions_task_29_tt2: "Todos los personajes de la cultura primaria de la familia del Gobernante se convertirán a la cultura #G $fennic$#!."

 01_soodak_missions_task_30: "Las tierras de Joki"
 01_soodak_missions_task_30_DESC: "A primera vista, no hay mucho que decir sobre las tierras de #T $joki_area$#!, con sus espesos bosques y densos pantanos que hacen que la vivienda no sea ideal. Sin embargo, nuestros exploradores informan que se encuentra en una unión crítica entre los ríos #Y Velho#! y #Y Vain#!, un área de vital importancia estratégica, dadas nuestras propiedades en ambas provincias; Al colonizar esta tierra salvaje, no sólo garantizaremos la autonomía estratégica para nuestros territorios orientales, sino que también facilitaremos nuestra administración en ellos.\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 01_soodak_missions_task_30_tt: "Recibiremos el siguiente modificador en las provincias de #Y $ilmandu_inferior_area$#!, #Y $velho_area$#! y #Y $joki_area$#!:"
 
 01_soodak_missions_task_31: "Contactos Mercenarios"
 01_soodak_missions_task_31_DESC: "Con el aumento de las tensiones, existe la preocupación de que se desborde más temprano que tarde. Por lo tanto, sería prudente ahorrar dinero y hacer contactos con posibles espadas para alquilar ahora, en lugar de luchar en el último minuto y tener que pagar más con menos oro. Disponible.\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 
 01_soodak_missions_task_32: "Una declaración de independencia"
 01_soodak_missions_task_32_DESC: "Fuimos fundados como una @amber! colonia minera de ámbar en el borde del mundo, muy alejada de la civilización. Prosperamos donde se creía imposible, establecimos nuevos asentamientos en los bosques de hielo y logramos la autosuficiencia en la nieve. Sin embargo, celosa de nuestros éxitos, nuestra patria se volvió cada vez más ambivalente hacia sus hijos, interfiriendo repetidamente en nuestros asuntos internos sin que se lo pidiéramos, aumentando los impuestos a niveles irrazonables sin nuestro consentimiento y descuidando repetidamente nuestras necesidades en tiempos de dificultades.\n\nTanto nosotros como cualquiera seríamos participantes felices y orgullosos de nuestro #G Imperio Germánico#!, nuestros lazos de parentesco se mantendrían fuertes a través del mar mientras buscaríamos crecer juntos de manera mutua; sin embargo, son nuestros amos tiránicos quienes han elegido este camino imprudente, considerándonos remansos y marginados, indignos de los mismos derechos y privilegios que ellos mismos aprecian; por lo tanto, como hombres libres e iguales, nos vemos obligados a asumir el manto de la condición de Estado para proteger y garantizar nuestros derechos inherentes a la libertad y a la búsqueda de la felicidad. En este día, nos declaramos oficialmente el estado soberano e independiente de [ROOT.GetCountry.GetName|T].\n\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 01_soodak_missions_task_32_tt: "#R ¡ADVERTENCIA!#! Vamos a #R declarar la guerra#! a nuestra patria."
 
 01_soodak_missions_task_33: "Una identidad sodaker"
 01_soodak_missions_task_33_DESC: "De alguna manera, contra todo pronóstico, hemos tenido éxito donde todos los demás habrían fracasado; una pequeña colonia al borde de la civilización, que se mantiene firme y derrota a uno de los imperios más grandes del mundo. Con nuestro país asegurado como Estado independiente, somos libres de perseguir nuestro destino como queramos, ni como #G germánicos#! ni #G fenicos#!, sino como orgullosos y liberados #G Soodakers#!.\n\n\n\n\n\n\n\n\n\n\n@italic_mil29!"
 01_soodak_missions_task_33_tt: "#R Esta tarea es mutuamente excluyente con '#T $01_soodak_missions_task_34$#!'#!"
 01_soodak_missions_task_33_tt2: "NO hemos promulgado la decisión '#Y $form_duna$#!' exclusiva de Fennic."
 01_soodak_missions_task_33_tt3: "#R ¡ADVERTENCIA!#! Perderemos el acceso a la decisión '#Y $form_duna$#!', si anteriormente teníamos acceso a ella."
 
 01_soodak_missions_task_34: "Deshazte de nuestras trampas coloniales"
 01_soodak_missions_task_34_DESC: "De alguna manera, contra todo pronóstico, hemos tenido éxito donde todos los demás habrían fracasado; una pequeña colonia al borde de la civilización, que se mantiene firme y derrota a uno de los imperios más grandes del mundo. Con nuestro país asegurado como estado independiente, sólo queda una cuestión pendiente; todavía llevamos los emblemas artificiales y los adornos de nuestros antiguos amos.\n\nAhora es el momento de cortar todos los lazos con nuestro pasado colonial, tal como un ciervo se deshace de sus viejas astas, y abrazar nuestra antigua herencia #G fennica#!, que existió mucho antes de la colonización #G germánica#!, y perseverará mucho después; el pueblo de #COLOR:{55,31,130} Duna#!, renacido en las llamas de una guerra devastadora provocada durante la larga oscuridad: un #R Fénix#! que surge de la nieve.\n\n\n\n\n\n\n\n\n\n\n@italic_mil22!"
 01_soodak_missions_task_34_tt: "Hemos promulgado la decisión '#Y $form_duna$#!' exclusiva de Fennic."
 01_soodak_missions_task_34_tt2: "Tendremos la opción de convertirnos en #G $steppe_horde$#!."
 01_soodak_missions_task_34_tt3: "#R Esta tarea es mutuamente excluyente con '#T $01_soodak_missions_task_33$#!'#!"

 01_soodak_missions_task_100: "Reunir un gobierno"
 01_soodak_missions_task_100_DESC: "Ahora que hemos encontrado una manera de sobrevivir en esta isla árida, aunque nuestro consejo temporal nos ha servido lo suficiente, necesitamos establecer un sistema permanente de gobierno si deseamos existir aquí a largo plazo. Sin embargo, los colonos están divididos en cuanto a la forma que debería adoptar nuestro gobierno; algunos desean ampliar el consejo existente hasta convertirlo en una casa de burgueses, o una #Y 'Burgzhusa'#!, compuesta por todos los principales interesados que tendrían el poder de establecer leyes, mientras que otros preferirían tener un gobernador real instalado desde la patria, que reforzaría nuestros vínculos a través de casas dinásticas y nos guiaría hacia la prosperidad.\n\nY otros, sin embargo, sugerirían un sistema híbrido como compromiso, en el que un gobernador de origen no real reinaría junto con nuestro cuerpo electo. Sin embargo, cualquier cosa que elijamos hoy dictará el curso de nuestra colonia no sólo para nosotros, sino también para nuestros hijos y nuestra progenie que está por venir.\n\n\n\n\n\n\n\n\n\n\n@italic_mil5!"
 01_soodak_missions_task_100_tt: "Tendremos la opción de reformar nuestro gobierno en una #R Monarquía#!, una #Y República Democrática#! o una #COLOR:{0.51,0.31,0.75} República Oligárquica con la ley de Elecciones Vitalicias#!."
 
 01_soodak_missions_task_900: "Una audiencia de andrófagos"
 01_soodak_missions_task_900_DESC: "En los desolados páramos de #G Hiperbórea#!, pocos pueden soportar el dolor del frío intransigente, mordiente e implacable durante horas, y mucho menos años. Aunque su reputación es de infamia y traición de la manera más vil y espeluznante, los resistentes #R Andrófagos#! se encuentran entre las únicas tribus lo suficientemente obstinadas y tontas como para hacer que la vida funcione aquí arriba; si vamos a seguir caminando en este lugar, debemos intentar establecer una relación con nuestros vecinos.\n\n\n\n\n\n\n\n\n\n\n@italic_mil13!"
 01_soodak_missions_task_900_tt: "Enviaremos una expedición para encontrar a estos #R andrófagos#!..."
 
