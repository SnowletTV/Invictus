# Tasks

tayuan_ferghana_task_51: "Poseidón en el Jaxartes"
tayuan_ferghana_task_51_DESC: "La provincia de [GetProvince('(int32)6773').GetArea.GetName|T] serpentea a través de los pasos de las #G Montañas Ferghanan#! y controla los pasos hacia la #G Cuenca del Tarim#!, una tierra importante pero difícil que es frecuentada por ejércitos ambulantes y caravanas de mercaderes. Es de nuestro interés controlar esta región por nosotros mismos, y [ROOT.GetCountry.GetRuler.GetName|Y] ha dado órdenes de prepararse para la guerra.\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"

tayuan_ferghana_task_1: "Refrescos para la corte"
tayuan_ferghana_task_1_DESC: "Desde hace mucho tiempo la ciudad del conquistador [GetProvince('(int32)6704').GetName|T] sufre su miopía, ya que el clima allí es bastante más frío y duro que en el acogedor valle. Nuestros mejores arquitectos formados en el #COLOR:{0.2,0.47,1} Método griego#! sugieren una gran cantidad de medidas, más canales, mejores espacios botánicos y mucho más, para convertirlo en un lugar más habitable.\n\n#COLOR:{0.3,0.5,0.38} Nota histórica#!: Vale la pena señalar que los hallazgos arqueológicos en la vida real apuntan a obras de irrigación a gran escala que se están construyendo en el valle alrededor de este hora.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"

tayuan_ferghana_task_2: "Pancartas volando sobre el #E Tarim#!"
tayuan_ferghana_task_2_DESC: "Los estandartes de muchos ejércitos y expediciones han tenido que pasar por la #G Cuenca del Tarim#!, buscando cosas ya sea hacia el este o hacia el oeste.\n\nAsí que, para lanzarnos contra el #COLOR:{0.39,0.21,0.81} viento del euro#! en la exploración de las muchas vidas de estos pueblos orientales, debemos tomar el control de esta vital arteria.\n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"

tayuan_ferghana_task_3: "¡Hay vino!"
tayuan_ferghana_task_3_DESC: "La bebida rudimentaria disponible en este valle, el 'kumis', leche de yegua, tiene un sabor absolutamente horrendo y hace que hasta el más pobre clame por vino @wine!, que tan hábilmente producimos en [GetProvince('(int32)288').GetArea.GetName|T].\n\nDebemos asegurar nuestra supervivencia e introducir la elaboración del vino @wine! en el valle. Pendientes.\n\n#COLOR:{0.3,0.5,0.38} Nota histórica#!: Es bastante seguro que los #COLOR:{0.2,0.47,1} [GetCulture('ionian').GetName] #! son responsables de introducir el vino en Ferghana; los #G Registros del Gran Historiador#! dicen que 'las regiones alrededor de Tayuan elaboran vino con uvas, y los habitantes más ricos guardan hasta diez mil o más piculs almacenados de distancia.'\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"

tayuan_ferghana_task_4: "arroz y grano"
tayuan_ferghana_task_4_DESC: "Zhang Qian informó que la gente de Ta-Yuan trabajaba los campos, cultivando arroz y trigo. Después de todo, debemos alimentarnos nosotros mismos, y estar rodeados de tierras desoladas y desoladas significa que tenemos que cultivar gran parte de los alimentos nosotros mismos. Después de todo, el viajero #COLOR:{0.77,0.5,0.09} #E Huaxia#!#! informó que la gente aquí ascendía a varios cientos de miles y vivía en setenta ciudades.\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

tayuan_ferghana_task_6: "Las estatuillas"
tayuan_ferghana_task_6_DESC: "Pequeñas y extrañas estatuas de un hombre tranquilo, casi sonriente, han comenzado a aparecer en pequeños santuarios por todas partes, y aunque algunos (especialmente el #COLOR:{0.83,0.55,0.6} [GetCulture('tayuan').GetName]#! local) afirman que son apariciones de demonios, los extraños hombres calvos que vienen del sur ruegan que los ayuden. Difieren.\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"

tayuan_ferghana_task_5: "Los primeros puestos de avanzada"
tayuan_ferghana_task_5_DESC: "Parece que este Imperio de Oriente es fabulosamente rico; mercancías que nadie había visto jamás, más hermosas que las estrellas, son transportadas por los pocos comerciantes que ahora se atreven a emprender a regañadientes el peligroso viaje hasta aquí. A lo largo de las arenas de la #G Cuenca del Tarim#!, han comenzado a establecer pequeños puestos de avanzada a lo largo del ruta.\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"

tayuan_ferghana_task_7: "Una lanza, un caballo y un arco."
tayuan_ferghana_task_7_DESC: "Decirle a cualquier amigo o empresa que una mezcla de unidades #COLOR:{0.2,0.47,1} [GetCulture('ionian').GetName]#! y #COLOR:{0.83,0.55,0.6} [GetCulture('tayuan').GetName]#! podría ser un matrimonio feliz haría que se rieran de usted, si no que lo ridiculizaran. Sin embargo, los regimientos en los que cooperan estos dos grupos son los más exitosos de nuestro ejército y también son notorios; las madres les cuentan a sus hijos la habilidad de los arqueros a caballo, y muchas niñas se desmayan ante la fuerza de los hombres de la falange.\n\n#COLOR:{0.3,0.5,0.38} Nota histórica#!: Zhang Qian registró que \"La gente lucha con arcos y lanzas y puede disparar desde a caballo.'\n\n\n\n\n\n\n\n\n\n\n@persia_mil11!"

tayuan_ferghana_task_8: "Los caballos celestiales"
tayuan_ferghana_task_8_DESC: "En las infinitas estepas y en las montañas más inhóspitas, nuestros hombres celebran sus victorias en hermandad, abrazándose a pesar de todas sus diferencias culturales. Son una gran fuerza, una combinación exitosa de dos metodologías radicalmente diferentes de hacer la guerra, y nuestros ejércitos son temidos por los poderosos y admirados por los débiles. Se cantarán canciones sobre ellos para siempre: el #T 'Heavenly ¡Caballos!#!\n\n\n\n\n\n\n\n\n\n\n@persia_mil20!"

tayuan_ferghana_task_9: "Dawan la ciudad"
tayuan_ferghana_task_9_DESC: "Desde el establecimiento de la ciudad de [GetProvince('(int32)6735').GetName|T], ha prosperado con la afluencia de comerciantes, artistas y artesanos de todas partes, dispuestos a trabajar juntos para construir una gran ciudad a partir de lo que antes no era nada.\n\nPodemos optar por mostrarle el favor a la ciudad patrocinando sus proyectos de construcción. Entonces tendremos una ciudad verdaderamente #COLOR:{0.2,0.47,1} [GetCulture('ionian').GetName]#! en el valle, lejos de las influencias macedonias de [GetProvince('(int32)6704').GetName].\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"

tayuan_ferghana_task_10: "Desmembrar La Caoskratia"
tayuan_ferghana_task_10_DESC: "Al sur, el \"rey\" nominal de los \"bactrianos\" todavía gobierna a muchos bandidos y facciones que intentan devastar todo a su alrededor y no dejar ninguna riqueza detrás. Debemos poner fin a esto.\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"

tayuan_ferghana_task_11: "Lujuria por los suéteres de sangre"
tayuan_ferghana_task_11_DESC: "Se dice que el #COLOR:{0.77,0.5,0.09} #E Huaxia#!#! Emperador se encariñó mucho con nuestros caballos y solicita que enviemos rutas comerciales hacia el este para que haya un flujo constante de caballos allí.\n\nAl mezclar las razas de caballos ferganas y sogdianos, estamos seguros de encontrar caballos más rápidos y ágiles. Unos.\n\n\n\n\n\n\n\n\n\n\n@india_mil18!"

tayuan_ferghana_task_12: "Guión Fergani"
tayuan_ferghana_task_12_DESC: "#COLOR:{0.3,0.5,0.38} Base histórica#!: El monje budista de la época de la dinastía Tang, Xuanzang, en su #G Registro de las regiones occidentales#!, informó que los pueblos del país de #COLOR:{0.83,0.55,0.6} Fei-han#! (mandarín para Ferghana) tenían una escritura y un idioma diferentes a los de su sogdiano. Primos.\n\nDesafortunadamente, también registró que estas personas eran \"feas y deformes\", lo cual no es una buena apariencia para ellos.\n\n\n\n\n\n\n\n\n\n\n@persia_mil17!"

tayuan_ferghana_task_13: "La gente de las pelucas"
tayuan_ferghana_task_13_DESC: "En lo alto de las frías montañas se encuentra [GetProvince('(int32)6784').GetName|T], solo, contemplando todo lo que lo rodea. En los meses más fríos es costumbre que la mayoría de la gente use gorros de piel, por lo que entre los visitantes se han ganado el sobrenombre de #G 'Gente de las Pelucas'#!. Si permanece leal a nuestro lado, podremos controlar todos los páramos del norte mucho más fácilmente.\n\n\n\n\n\n\n\n\n\n\n@persia_mil16!"

tayuan_ferghana_task_14: "El intercambio Mingtepa"
tayuan_ferghana_task_14_DESC: "Muchos #COLOR:{0.77,0.5,0.09} #E Huaxia#!#! acuden en masa a 'Mingtepa', una de las ciudades más orientales del valle, conocida por nosotros como [GetProvince('(int32)6737').GetName|T], y es allí donde comercian con nuestra gente. Por sus mercados discurren joyas elaboradas con el más fino jade @jade!, prendas bordadas y textiles de seda @silk!, porcelanas con incrustaciones de diseños florales @earthware! y caballos @horses! como ningún otro que se pueda encontrar en el mundo.\n\nEste es un mercado de excelencia y exclusividad, el primero de su tipo en este largo camino. Oeste.\n\n#COLOR:{0.3,0.5,0.38} Nota histórica#!: Esta 'Mingtepa' se menciona en el #G Registro de las regiones occidentales#! como la ciudad principal del valle.\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"

tayuan_ferghana_task_15: "entre las paredes"
tayuan_ferghana_task_15_DESC: "Inspirándose en las murallas montañosas que las encierran, los #COLOR:{0.83,0.55,0.6} [GetCulture('tayuan').GetName]#! fortificaron las ciudades más pequeñas del valle de una manera peculiar, muy diferente a todo lo que se encuentra en otros lugares:\n\n'Rodeada en varias filas por poderosas murallas paralelas, el espacio entre las cuales estaba poblado principalmente por ciudadanos, la parte interior del asentamiento generalmente estaba desprovista de edificios y estaba destinada a usos comunales. Ganado.'\n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"

tayuan_ferghana_task_16: "¡Es Ershi!"
tayuan_ferghana_task_16_DESC: "La antigua capital del valle, #T Ershi#!, ahora llamada [GetProvince('(int32)6737').GetName|T] por los griegos, ha visto últimamente cómo se asentaban entre sus muros cada vez más #COLOR:{0.83,0.55,0.6} [GetCulture('tayuan').GetName]#E s#!#!, ya que representa un centro de civilización para esta población anteriormente tribal. Ahora son mayoría, muchos de ellos protestan por una administración nativa de la ciudad.\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"

tayuan_ferghana_task_17: "Ayuda a los sogdianos"
tayuan_ferghana_task_17_DESC: "Nuestros #COLOR:{0.83,0.55,0.6} [GetCulture('sogdian').GetName|G]#! hermanos, a quienes tan fielmente protegemos desde su fallecimiento, ahora esperan que seamos la fuerza detrás de su restitución. De hecho, nos beneficiaríamos de esto, ya que nos servirían aún más fielmente.\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"

tayuan_ferghana_task_18: "Colonizar Occidente"
tayuan_ferghana_task_18_DESC: "Al Oeste quedan tierras en estado árido y desolado, seguramente indignas de ello, porque han sido ignoradas por muchos de los que pasaron por aquí. Nos beneficiaría enormemente si nuestra gente los colonizara.\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"

tayuan_ferghana_task_19: "Elevar a los bactrianos"
tayuan_ferghana_task_19_DESC: "Es injusto que nuestros hermanos del sur sean reducidos a los sustratos de su propio país, nuestros propios hermanos asfixiados por [GetCulture('macedonian').GetName|G] villanos. Es hora de que sean libres en sus propios hogares, tal como lo somos nosotros.\n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"

tayuan_ferghana_task_20: "Nuevos caminos al sur"
tayuan_ferghana_task_20_DESC: "La conquista de #E Bactria#! nos ha brindado muchas oportunidades hacia el sur, y muchos de nuestros habitantes ya desean establecerse allí."

tayuan_ferghana_task_21: "Un gran viaje en el exilio"
tayuan_ferghana_task_21_DESC: "De las #COLOR:{0.77,0.5,0.09} #E Huaxia#!#! embajadas enviadas al este, el #G Los registros del gran historiador#! dice que \"aquellos que viajaban a tierras lejanas necesitaban ocho o nueve años para completar su viaje\", lo que significaba que \"ningún hombre completaría este viaje simplemente por su cuenta\". Placer'.\n\nEvidentemente, esto significa que las embajadas del Emperador son enviadas con 'cualquiera que se presente, sin investigar sus antecedentes'. Por supuesto, esto significa que todo tipo de matones y rufianes inundan nuestras tierras con los bienes que más necesitamos, pero son estos mismos hooligans amantes de la aventura los que han llenado la cabeza de [ROOT.GetCountry.GetRuler.GetName|Y] con una locura salvaje. Idea...\n\n\n\n\n\n\n\n\n\n\n@india_mil22!"
create_ruler_mercenary_may_return_some_day_tt: "Nuestro gobernante puede optar por abdicar del poder e irse para convertirse en un #R mercenario#! en las tierras salvajes del #T Imperio de Oriente#!."
create_ruler_mercenary_may_return_some_day_tt1: "Nuestro gobernante abdicará del poder y se marchará para convertirse en un #R mercenario#! en las tierras salvajes del #T Imperio de Oriente#!."

tayuan_ferghana_task_22: "[GetCultureGroup('bactrian').GetName] Campeones"
tayuan_ferghana_task_22_DESC: "Nosotros #COLOR:{0.83,0.55,0.6} #E Arya#!#!, o 'bactrianos' como nos llaman, hemos estado bajo dominación extranjera desde que tenemos memoria, ya sea persa, macedonio o griego.\n\nNinguno de los nuestros volverá a pagar tributo a reyes extranjeros; Ahora el humilde [GetCulture('margian').GetName] pastor, el temible [GetCulture('sogdian').GetName] jinete y el astuto [GetCulture('tocharian').GetName] comerciante pueden conservar su moneda y dormir más profundamente que nunca, en un reino gobernado por sus hermanos, en ¡fraternidad!\n\n\n\n\n\n\n\n\n\n\n@italic_mil22!"

tayuan_ferghana_task_23: "Somos la nueva nobleza"
tayuan_ferghana_task_23_DESC: "Y así, habiéndose convertido en un pueblo próspero, los #COLOR:{0.83,0.55,0.6} [GetCulture('tayuan').GetName]#! ahora viven en palacios, poseen grandes propiedades y están vestidos con joyas. Este nuevo grupo entre los nuestros exige igualdad de derechos para la nobleza existente, y si los griegos desean seguir beneficiándose de nuestros medios de vida deben elevarnos a su estatura en esta sociedad. Ahora debemos ser iguales.\n\n\n\n\n\n\n\n\n\n\n@persia_mil9!"

tayuan_ferghana_task_24: "¿Voxita o zoroastriano?"
tayuan_ferghana_task_24_DESC: "Como es habitual, existen acuerdos y desacuerdos dentro de [ROOT.GetCountry.GetName|T]. Es obvio para todos que los dioses del comercio nos han bendecido, pero hay desacuerdos sobre qué dioses han elegido bendecirnos. Algunos dicen que es obvio que los #G zoroastrianos#! nos han traído buena suerte, mientras que otros argumentan con vehemencia que las deidades #G Voxite#! son las que deberíamos ser. Alabando.\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"

tayuan_ferghana_task_25: "Despertar las artes"
tayuan_ferghana_task_25_DESC: "Nuestra #COLOR:{0.2,0.47,1} [GetCulture('ionian').GetName]#! tradición es una de #T poetas#! (Homero probablemente nació allí, y Safo), #T arquitectos#! (Templo de Artemisa en Éfeso, Templo de Atenea Polias en Priene), #T escultores#! y #T alfareros#!, y también grandes #T filósofos#! (Tales de Mileto, Anaximandro de Mileto, Heráclito de Éfeso).\n\nNuestra riqueza y el intercambio cultural en [GetProvince('(int32)290').GetArea.GetRegion.GetName|T] permitieron que estas obras, y los hombres detrás de ellas, pensaran, soñaran y fueran. Rodearnos de una infinidad de culturas extranjeras, demasiadas y demasiado dispares para siquiera tomarlas en cuenta, significa que ahora nos jactamos de condiciones similares; si garantizamos a nuestros artistas condiciones favorables, seguramente brillarán.\n\n\n\n\n\n\n\n\n\n\n@italic_mil5!"

tayuan_ferghana_task_28: "Continúe el camino hacia el oeste"
tayuan_ferghana_task_28_DESC: "Este nuevo intercambio de todo tipo de mercancías con el Imperio de Oriente nos proporciona cosas increíbles, y hemos podido colmarlas también de nuestras propias maravillas.\nLos comerciantes #COLOR:{0.77,0.5,0.09} #E Huaxia#!#!, cada vez más influyentes en nuestra sociedad, preguntan periódicamente qué hay más al oeste y solicitan a nuestro gran [ROOT.GetCountry.GetRulerTitle] que establezca allí una ruta para que el flujo de mercancías continúe. Más.\n\n\n\n\n\n\n\n\n\n\n@italic_mil9!"

tayuan_ferghana_task_27: "Los grandes tratados de la Huaxia"
tayuan_ferghana_task_27_DESC: "El Imperio de Oriente, por lo que sabemos, es una civilización muy avanzada con muchas mentes que contribuyen a su herencia y conocimiento. Obtener uno de estos tomos podría transmitirnos grandes ideas que luego podríamos utilizar a nuestro favor.\n\n\n\n\n\n\n\n\n\n\n@india_mil20!"

tayuan_ferghana_task_26: "[GetProvince('(int32)7184').GetName] Y la puerta de jade"
tayuan_ferghana_task_26_DESC: "Las rutas comerciales que llegan hasta aquí son bastante peligrosas; si los enviados #COLOR:{0.77,0.5,0.09} #E Huaxia#!#! van al norte, son acosados ​​y asesinados por los #R Xiongnu#!, mientras que si van al sur sufren por falta de agua y forraje. Además, hay muchos lugares a lo largo de la ruta donde no hay ciudades de ningún tipo y es probable que se queden sin provisiones.\n\nSi ayudamos a que el viaje sea más seguro, muchos más podrán pasar por la ruta comercial.\n\n#COLOR:{0.3,0.5,0.38} Nota histórica#!: La primera parte de la descripción fue transliterada de los #G Registros de los Grandes Historiador#!, de un discurso de un funcionario jónico para justificar el cese del comercio con China, lo que condujo a la #R Guerra de los Celestiales. Caballos#!.\n\n\n\n\n\n\n\n\n\n\n@persia_mil11!"

tayuan_ferghana_task_29: "El espíritu democrático"
tayuan_ferghana_task_29_DESC: "La distancia no ha cambiado mucho la mentalidad de #COLOR:{0.2,0.47,1} [GetCulture('ionian').GetName]#!; en las Boules y Ekklesías de nuestras ciudades muchos se vuelven hacia una nueva facción, exigiendo el tipo de gobierno que hemos conocido tradicionalmente: democracia.\n\nLas reuniones en el mercado, fiestas, cenas y festivales ahora presentan conversaciones que exigen tal cambio; cada día, muchos más se convierten a esta causa, ya que históricamente las tiranías impuestas en las ciudades de [GetProvince('(int32)305').GetArea.GetRegion.GetName|T] no terminaron bien para su gente. Debemos abordar estas demandas.\n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"

tayuan_ferghana_task_30: "El ermitaño del huerto nevado"
tayuan_ferghana_task_30_DESC: "Los sabios que llegaron a nuestro país parecen deleitarse en vagar por él, difundiendo sus enseñanzas a las poblaciones a cambio de alimentos y provisiones. Aún así, no viven plenamente en las ciudades y pueblos que frecuentan, y estos monjes errantes viajan entre pueblos mientras permanecen en las afueras de la sociedad. A menudo también salen, a veces a las montañas, para orar.\n\nUn destacado monje budista #COLOR:{0.81,0.15,0}#! le dice a nuestro rey que al sur, en las tierras del Indo, durante la temporada de lluvias se retiran para refugiarse y protegerse del clima, una práctica llamada #COLOR:{0.81,0.15,0} 'vassa'#!. Parece que aquí el problema se invierte; los meses de invierno son bastante hostiles a ese estilo de vida. Si les proporcionáramos un refugio de este tipo, podrían continuar con su trabajo.\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"

tayuan_ferghana_task_31: "Sincretismo zoroástrico"
tayuan_ferghana_task_31_DESC: "En Asia Central, las ideas budistas a veces se fusionaron con el zoroastrismo o las tradiciones iraníes. Por ejemplo, el concepto de Mitra (una deidad zoroástrica) se sincretizó ocasionalmente con figuras budistas como Maitreya.\n\n\n\n\n\n\n\n\n\n\n@persia_mil13!"
zoroaster_conversion_tt1: "Necesitamos tener al menos #Y 1#! Deidad en nuestro panteón de la fe [GetReligion('zoroaster').GetName|Y]."

tayuan_ferghana_task_32: "Traducir los textos"
tayuan_ferghana_task_32_DESC: "Los textos #G Abhidharma Pitaka#!, siete en total, son el canon de la escuela #COLOR:{0.81,0.15,0} #E Sarvastivada#!#! a la que pertenecen la mayoría de los monjes aquí; esta escuela fue la primera en traducir los Tipitakas al sánscrito. Traducirlos una vez más es un paso clave para ayudar a nuestras poblaciones, tanto #COLOR:{0.2,0.47,1} [GetCulture('ionian').GetName]#! como #COLOR:{0.83,0.55,0.6} [GetCulture('tayuan').GetName]#!, a comprender y seguir el camino hacia Moksha.\n\nUtilizan un lenguaje altamente técnico, más de lo habitual, en un intento de transmitir la verdad última. Traducirlos requerirá una gran inversión y un conjunto de grandes mentes.\n\n\n\n\n\n\n\n\n\n\n@india_mil17!"

tayuan_ferghana_task_33: "Cooperación Syntechniai"
tayuan_ferghana_task_33_DESC: "No hay escasez de canteros y artesanos calificados que ahora viven en el valle, y debido a nuestros esfuerzos de construcción en casi todas partes no hay escasez de necesidad para su trabajo calificado.\n\nSi les permitimos comenzar a coordinarse entre ellos, en Syntechniai, podrían trabajar juntos en equipos (lo que resultaría en resultados finales mejores y más rápidos), regular sus estándares de calidad y transmitir sus conocimientos más fácilmente. También ayudan a sus miembros en asuntos sociales y religiosos, desde fondos para el entierro hasta ofrendas y sacrificios religiosos.\n\n\n\n\n\n\n\n\n\n\n@india_mil6!"

tayuan_ferghana_task_34: "Maestro de los pases"
tayuan_ferghana_task_34_DESC: "Los hombres venerados que desean venir a este valle para reflexionar, vivir y enseñar tienen que cruzar las rutas más peligrosas y enfrentar los climas más duros para traer su conocimiento aquí; No podemos esperar ser iluminados hacia este equilibrio del que hablan si no tenemos maestros que sigan ese camino.\n\nControlar los pasos del sur nos otorga una ruta directa de comunicación con el resto de los #COLOR:{0.81,0.15,0} budistas#!. Mundo.\n\n\n\n\n\n\n\n\n\n\n@india_mil19!"

tayuan_ferghana_task_35: "Pacificar las hordas"
tayuan_ferghana_task_35_DESC: "Los jinetes del norte a menudo han aterrorizado tanto a los inocentes #COLOR:{0.83,0.55,0.6} [GetCulture('tayuan').GetName]#! como a #COLOR:{0.77,0.5,0.09} #E Huaxia#! #! sin provocación; Son tan salvajes como las bestias entre las que viven. Debemos marchar hacia los páramos del norte y subyugar a las tribus allí. ¡Será su fin!\n\n\n\n\n\n\n\n\n\n\n@persia_mil14!"
tayuan_ferghana_task_35tt: "Necesitamos tener al menos #Y 2#! #G Cultura escita#! #T Vasallos tribales#!."

tayuan_ferghana_task_36: "Síntesis shenico-budista"
tayuan_ferghana_task_36_DESC: "Hay muchas ideas y filosofías religiosas que circulan por [ROOT.GetCountry.GetName|T], a menudo llevadas por viajeros y comerciantes que siguen las rutas comerciales entre las [ROOT.GetCountry.GetAdjective|G] ciudades. En lugar de imponer un panteón particular o un conjunto de creencias en todo su reino, la tolerante #Y [ROOT.GetCountry.GetRuler.GetFamilyDisplayName] Dinastía#! ha alentado a la gente a buscar interacciones armoniosas entre sí, especialmente cuando se trata de asuntos del divino.\n\n\n\n\n\n\n\n\n\n\n@italic_mil16!"
 
tayuan_ferghana_task_37: "Un viaje por el mundo"
tayuan_ferghana_task_37_DESC: "Una pregunta inquieta a todos los hombres y mujeres de origen #COLOR:{0.2,0.47,1} [GetCulture('ionian').GetName]#! de este valle. ¿Deberíamos, arrojados por el viento tan lejos, hacer un esfuerzo por volver a casa? Ciertamente Alexandros logró llegar a estas tierras. ¿Y a qué regresaríamos? Sin embargo, no somos un pueblo en guerra, al menos todavía, para marchar por el mundo como él. Así que primero debemos intentar establecer contacto con el otro extremo del mundo, [GetProvince('(int32)290').GetArea.GetName|T], nuevamente.\n\n\n\n\n\n\n\n\n\n\n@italic_mil32!"

tayuan_ferghana_task_38: "Formas más elevadas de adoración"
tayuan_ferghana_task_38_DESC: "A pesar de las muchas tentaciones que nos rodean, nuestro pueblo se ha mantenido fiel a los dioses #COLOR:{0.2,0.47,1} helénicos#! de nuestros antepasados, y como no los hemos olvidado, ellos no lo han olvidado. Nosotros.\n\n\n\n\n\n\n\n\n\n\n@event_pic3!"
tayuan_ferghana_task_38_tt: "Necesitamos tener #Y 4#! Deidades en nuestro panteón de la [GetReligion('roman_pantheon').GetName|Y] fe."
tayuan_higher_forms_worship_mod: "Verdaderos helenos"

tayuan_ferghana_task_39: "Ciudades en el cielo"
tayuan_ferghana_task_39_DESC: "Muchos hombres vestidos con túnicas rojas, vehículos de la escuela #COLOR:{0.81,0.15,0} #E Sarvastivada#!#!, pueblan los monasterios de las tierras que ahora controlamos. Dado que el gran centro teológico de esta escuela se encuentra en [GetProvince('(int32)7314').GetArea.GetRegion.GetName|T] y sus alrededores, haríamos bien en desarrollar estas áreas también.\n\n\n\n\n\n\n\n\n\n\n@event_pic2!"

tayuan_ferghana_task_40: "Estudiar budismo en la India"
tayuan_ferghana_task_40_DESC: "Algunos de los #COLOR:{0.81,0.15,0} monjes budistas#! que viven en [ROOT.GetCountry.GetCapital.GetName|T] han solicitado [ROOT.GetCountry.GetRuler.GetName|Y] que financie una excursión al sur. Nuestros maestros budistas desean estudiar junto a algunos de los practicantes de la fe más sabios, y el [ROOT.GetCountry.GetRulerTitle] está dispuesto a concederles su deseo.\n\n\n\n\n\n\n\n\n\n\n@india_mil20!"

tayuan_ferghana_task_41: "Maestros del comercio"
tayuan_ferghana_task_41_DESC: "Nuestros [ROOT.GetCountry.GetAdjective] compatriotas se están ganando fama en el extranjero de ser temibles negociadores en asuntos relacionados con el dinero, y es ampliamente reconocido que somos hábiles en el comercio y regateamos por una fracción de ciento.\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"

tayuan_ferghana_task_42: "Humildad en el aprendizaje"
tayuan_ferghana_task_42_DESC: "#G Los Registros del Gran Historiador#! contiene un pasaje donde un asesor del emperador, Yao Ting-han, describe el reino de Tayuan como 'militarmente débil y que no requeriría una fuerza de más de tres mil #COLOR:{0.77,0.5,0.09} #E Huaxia#!#! soldados equipados con poderosas ballestas para conquistarlo y tomar a toda la población. Cautivo.'\n\nEs un insulto desafortunado, pero no falso, cuando se compara nuestra fuerza con el poder del gran #T Imperio Oriental#!. Si podemos tragarnos nuestro orgullo y admitir que sus costumbres son superiores a las nuestras, entonces tal vez podamos aprender un par de cosas. Ha llegado el momento de enviar diplomáticos al este, sombreros en mano, y con la esperanza de que podamos estudiar sus métodos.\n\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
tayuan_ferghana_42_tt: "Desbloquearemos #Y Decisiones#! para establecer #COLOR:{0.77,0.5,0.09} Puestos comerciales de la Ruta de la Seda#!."

tayuan_ferghana_task_43: "Sauces para las viejas costumbres"
tayuan_ferghana_task_43_DESC: "Han llegado peticiones a [ROOT.GetCountry.GetCapital.GetName|T] de las comunidades #G Qin#! que viven junto a nosotros, y [ROOT.GetCountry.GetRuler.GetName|Y] ha aceptado concederles su solicitud de mejora de estatus social dentro [ROOT.GetCountry.GetName|T].\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
we_need_qin_nobles_tt: "La #G Cultura Qin#! debe tener #T Ciudadano#! #Y Derechos cívicos#!."
tayuan_ferghana_task_43_tt: "Algunos de nuestros pops se asimilarán a la cultura #G Qin#!."

tayuan_ferghana_task_44: "Templos a los Shens"
tayuan_ferghana_task_44_DESC: "En un guiño al creciente número de #COLOR:{0.77,0.5,0.09} #E Huaxia#!#! que viven dentro de nuestras fronteras, [ROOT.GetCountry.GetRuler.GetName|Y] ha acordado construir un santuario religioso para las deidades locales llamado #G 'shens'#!, y ahora que se ha dado la orden, el distrito religioso de la ciudad ya está lleno de los sonidos de construcción.\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
temple_to_shens_mod: "Templo de los Shen"
desc_temple_to_shens_mod: "Aquí se ha construido un santuario a los dioses de Huaxia."

tayuan_ferghana_task_45: "Reverencia"
tayuan_ferghana_task_45_DESC: "Somos un incondicional de la #COLOR:{0.77,0.5,0.09} #E Huaxia#!#! en Occidente, luchando contra hordas peligrosas y expandiendo sus formas de vida hasta lugares tan lejanos. Por lo tanto, es hora de enviar una gran embajada al Este, para mostrar deferencia al #T Hijo del Cielo#! y obtener su reconocimiento.\n\n\n\n\n\n\n\n\n\n\n@italic_mil15!"

tayuan_ferghana_task_46: "La vida en flor"
tayuan_ferghana_task_46_DESC: "Negar la naturaleza de uno mismo no está de acuerdo con esa naturaleza misma. El tiempo ha demostrado que somos #COLOR:{0.77,0.5,0.09} #E Huaxia#!#!, y finalmente debemos consagrar esa forma de vida para que la sigan todas nuestras tierras. El camino está ante [ROOT.GetCountry.GetName|T], pero ¿está nuestra gente preparada para dar los primeros pasos?\n\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
tayuan_ferghana_task_46_tt: "Tendremos la opción de cambiar nuestra cultura principal a #G Qin#!."

tayuan_ferghana_task_47: "Un gran monasterio"
tayuan_ferghana_task_47_DESC: "Muchos monjes ya abandonan la práctica de vassa y ahora prefieren vivir con sus hermanos en aislamiento en #COLOR:{0.81,0.15,0} #E Sangharamas#!#! (monasterios). Deberíamos construir uno grande en [GetProvince('(int32)6740').GetName|T], para que su influencia se pueda sentir en todo el valle.\n\n#COLOR:{0.3,0.5,0.38} Nota histórica#!: Quva fue el centro del budismo en el valle, ya que allí había un gran monasterio fundado en los siglos 4-3 a. C., que se encuentra en ruinas. Hoy.\n\n\n\n\n\n\n\n\n\n\n@italic_mil2!"

tayuan_ferghana_task_48: "Peticiones macedonias"
tayuan_ferghana_task_48_DESC: "En nuestros territorios recién conquistados, muchos no han olvidado nuestra política hostil hacia los macedonios y su dominio aquí. Están preocupados porque han venido a vivir a una tierra tan remota y sería bastante difícil que sus vidas funcionaran en otro lugar. ¿Qué vamos a hacer con respecto a ellos?\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"

tayuan_ferghana_task_49: "Envíos a todos los países"
tayuan_ferghana_task_49_DESC: "Sin duda, una de las cosas que más nos duele el #COLOR:{0.2,0.47,1} [GetCulture('ionian').GetName]#! corazón es la falta de acceso al mar ancho, abierto, ese mar que en su inmensidad permite que el corazón lo llene de lo que desee; esperanzas, sueños y mucho más.\n\nDada la reciente afluencia de comerciantes de Huaxia, es posible que podamos establecer rutas de 'envío' a grandes distancias, que si bien no son un reemplazo real, siguen siendo una vía comercial que vale la pena. Esfuerzo.\n\n\n\n\n\n\n\n\n\n\n@italic_mil4!"

tayuan_ferghana_task_50: "Líderes de hombres"
tayuan_ferghana_task_50_DESC: "Sí, #COLOR:{0.2,0.47,1} [GetCulture('ionian').GetName]#E s#!#! son los que mandan; De todos modos, somos una gran minoría en nuestra nación. No se puede esperar que gobiernemos solos. Por tanto, hay una opción; o integrar a todos en nuestras costumbres superiores, compartir nuestro gobierno con otro grupo o respetar la pluralidad de todos los demás.\n\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
tayuan_ferghana_task_50tt: "Podremos seleccionar un bono especial para nuestra nación."

tayuan_ferghana_task_final: "Nueva vida, nuevo manto"
tayuan_ferghana_task_final_DESC: "Han cambiado tantas cosas para la gente de [ROOT.GetCountry.GetName|T] que es difícil saber hacia dónde vamos. Las guerras y los rumores de guerras nos rodean por todos lados, los invasores de la estepa son una amenaza siempre presente y los dioses de esta tierra todavía son nuevos para nosotros. Pero frente a estos desafíos, [ROOT.GetCountry.GetRuler.GetName|Y] ha llevado a nuestra gente a alturas imprevistas, y aunque el camino a seguir parece estar plagado de peligros, estamos preparados para lo que sea que nos depare. Adelante.\n\n\n\n\n\n\n\n\n\n\n@persia_mil15!"

tayuan_ferghana_task_: ""
tayuan_ferghana_task__DESC: ""


# Events

me_tayuan_ferghana.1666.title: "Poseidón en el Jaxartes"
me_tayuan_ferghana.1666.desc: "Después de muchos meses de espera, nuestros reclamos sobre la serpenteante provincia de [GetProvince('(int32)6773').GetArea.GetName] se han completado y nuestros soldados se preparan para el sombrío viaje hacia las montañas azotadas por el viento de la región [GetProvince('(int32)6773').GetArea.GetRegion.GetName].\n\nHay pocos habitantes de [ROOT.GetCountry.GetCapital.GetName] que se opongan a estas medidas, ya que la mayoría ha brindado su apoyo al ambicioso [ROOT.GetCountry.GetRuler.GetName], quien ha proclamado audazmente que el [ROOT.GetCountry.GetAdjective] Los ejércitos están destinados a gobernar las ciudades ricas de la #E Cuenca del Tarim#! y más allá."
me_tayuan_ferghana.1666.a: "¡Las ricas ciudades comerciales de los oasis deben estar bajo nuestro control!"

me_tayuan_ferghana.2.title: "$tayuan_ferghana_task_1$"
me_tayuan_ferghana.2.desc: "Si bien la ciudad de [ROOT.GetCountry.GetCapital.GetName] es un verdadero paraíso durante los meses cálidos y soleados, la temporada de invierno es tan fría que aquellos con dinero a menudo abandonan la capital congelada de [ROOT.GetCountry.GetAdjective] hasta que la fuerza del sol regresa al cielo. Los vientos de las #E Montañas Ferghanan#! corren por las calles como una caballería furiosa y traen consigo toda la furia de los euros, congelando pequeños arroyos durante los meses más fríos e incluso provocando que las poderosas aguas del #E Jaxartes#! se llenen de terrones de hielo.\n\nEs en esta dura tierra donde Los arquitectos e ingenieros de [ROOT.GetCountry.GetRuler.GetName] de alguna manera lograron lo imposible y, gracias a sus ingeniosos diseños, se construyó un sistema de extensos canales y acueductos que dieron forma a la faz de la tierra y cambiaron el curso de la naturaleza misma. Estos cursos de agua no solo trajeron el regalo de la vida misma a la ciudad, sino que los muros de piedra de los acueductos protegieron a sus habitantes de los peores elementos."
me_tayuan_ferghana.2.a: "¡Todos saludan a la familia [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] por preservar la vida de las personas!"

me_tayuan_ferghana.3.title: "$tayuan_ferghana_task_2$"
me_tayuan_ferghana.3.desc: "Aunque [ROOT.GetCountry.GetRuler.GetName] sabía que conquistar la #E Cuenca del Tarim#! traería cambios a la gente de [ROOT.GetCountry.GetName], incluso el visionario [ROOT.GetCountry.GetRulerTitle] se sorprendió por algo que [ROOT.GetCountry.GetRuler.GetSheHe] no esperaba; el intercambio fluido de ideas culturales entre nuestros compatriotas y los extranjeros que viven dentro de nuestras fronteras.\n\nLos habitantes de la Cuenca adoran a dioses de los que nunca hemos oído hablar y hablan en lenguas que nuestros oídos tienen problemas para discernir, y estos extraños fascinantes han influido en nuestra sociedad con sus ideas, gestos y tradiciones."
me_tayuan_ferghana.3.a: "Este es un desarrollo curioso, por decir lo menos..."

me_tayuan_ferghana.4.title: "¡Hay vino!"
me_tayuan_ferghana.4.desc: "Los hombres estaban parados a la sombra del edificio, con los rostros iluminados de alegría mientras [SCOPE.sCharacter('ferghani_wine_drinker').GetName] avanzaba entre ellos, completamente inconsciente del peligro en el que se encontraba. De pie junto a [ROOT.GetCountry.GetRuler.GetName] estaba un pastor Ferghani, un granjero local que estaba involucrado en la trama, y todos los ojos estaban puestos en el hombre mientras luchaba por cargar un ánfora grande. Momentos después, sus manos callosas buscaban a tientas desenvolver el sello y verter su contenido en cuencos de arcilla, y todos dieron un paso adelante como uno solo.\n\nEl motivo de esta reunión era oscuro. [SCOPE.sCharacter('ferghani_wine_drinker').GetFirstName], un noble de estos lares, era conocido por dos cosas; los juramentos de lealtad que había hecho a nuestro pueblo y la leche de yegua fermentada, o #E 'kumis#!', que sus rebaños abastecían a la región. Había muchos Ferghani que odiaban a [SCOPE.sCharacter('ferghani_wine_drinker').GetFirstName] por traicionar a su pueblo, pero él estaba bajo la protección personal de [ROOT.GetCountry.GetRuler.GetFirstName] y le habían prometido parcelas de tierra a cambio de su servicio, algo que el hombre claramente estaba ansioso por obtener.\n\nPero esta no era la única razón por la que [ROOT.GetCountry.GetRulerTitle] había convocado a Barzhun. Una confesión en una fiesta reciente había provocado un escándalo menor. Los Ferghani preferían su propia bebida rústica a la de los griegos, y [SCOPE.sCharacter('ferghani_wine_drinker').GetFirstName] había admitido que nunca antes había probado vino, un hecho que [ROOT.GetCountry.GetRuler.GetFirstName] prometió cambiar antes de que terminara el día.\n\nAclarándose la garganta, Barzhun se inclinó ante [ROOT.GetCountry.GetRuler.GetFirstName] y levantó su cuenco. '¿Por qué bebemos, [ROOT.GetCountry.GetRulerTitle]?'\n\n'Por la fructífera administración de las tierras que te confío, [SCOPE.sCharacter('ferghani_wine_drinker').GetFirstName]. Gobierna sabiamente en mi nombre, y tal vez haya más regalos por venir.'\n\n'¡Eso es algo que brindaré!' Se rió el noble Ferghani y los dos levantaron el saludo. Al vaciar su cuenco de un solo trago, el Ferghani se atragantó, con los ojos desorbitados en su rostro curtido por el sol, y giró la cabeza para escupir el líquido oscuro al suelo. Ante esto, todos se echaron a reír y [ROOT.GetCountry.GetRuler.GetFirstName] le dio una palmada en la espalda a Bharzun, que farfullaba."
me_tayuan_ferghana.4.a: "Guarda la leche para los bebés, muchacho, ¡el vino es para los hombres!"

me_tayuan_ferghana.5.title: "$tayuan_ferghana_task_4$"
me_tayuan_ferghana.5.desc: "Nuestros agricultores han adoptado las técnicas de las tierras en las que vivimos, y aunque algunos de los que viven en [ROOT.GetCountry.GetCapital.GetName] se niegan a probar el arroz que nuestros trabajadores llevan al mercado, se les considera tontos que se privan sólo a ellos mismos del sustento. Esta tierra es una dueña generosa pero dura, y si permanecemos inflexibles frente a los vientos de las montañas que traen las heladas a nuestros campos, entonces nos partiremos en dos como leña arrojada a un pozo de fuego.\n\n'Pero si aprendemos los ritmos naturales de este lugar donde hemos hecho de nuestros hogares, y escuchamos los cantos de extraños pájaros que viven en los valles polvorientos y observamos las estrellas mientras viajan por los cielos, entonces tal vez Empezaremos a conocer esta tierra como el hogar que dejamos atrás. Nuestro pueblo debe aceptar los cambios que se nos imponen, y esto incluye también nuestra dieta”. Las palabras de [ROOT.GetCountry.GetRuler.GetName] ganarían los corazones de aquellos que no estaban convencidos y la gente de [ROOT.GetCountry.GetName] prosperaría."
me_tayuan_ferghana.5.a: "Debemos contentarnos con la comida que tenemos, no con la que queremos."

me_tayuan_ferghana.6.title: "$tayuan_ferghana_task_6$"
me_tayuan_ferghana.6.desc: "Pequeñas estatuillas de un príncipe indio, un hombre sabio llamado #E 'Siddharta'#!, han estado apareciendo dentro de los santuarios de [ROOT.GetCountry.GetCapital.GetName], muy probablemente colocadas allí por los comerciantes de incienso @incense! que han estado viniendo a nuestros mercados, y hay hombres sabios que se encuentran en cada encrucijada dentro de [ROOT.GetCountry.GetName] que predican el mensaje del Buda.\n\n[ROOT.GetCountry.GetRuler.GetName] ha oído hablar de este sabio antes, pues sus seguidores, los llamados 'budistas', viajan a menudo por nuestras tierras, y algunos incluso se han reunido con nuestro Hierofante [SCOPE.sCharacter('high_priest_character').GetName] para compartir sus creencias con nuestro sumo sacerdote.\n\nDespués de escuchar sus palabras, [SCOPE.sCharacter('high_priest_character').GetFirstName] dice que los budistas son gente pacífica y honorable, por lo que cuando un grupo de exiliados budistas preguntó si podían establecerse dentro de nuestras fronteras, tanto Hierophant como [ROOT.GetCountry.GetRulerTitle] se inclinaron a mostrar misericordia."
me_tayuan_ferghana.6.a: "Los budistas pueden quedarse aquí, pero tienen prohibido predicar."
me_tayuan_ferghana.6.b: "Quizás nuestros nuevos invitados sigan compartiendo con nosotros las palabras de Siddharta."

me_tayuan_ferghana.7.title: "$tayuan_ferghana_task_5$"
me_tayuan_ferghana.7.desc: "Lentamente, por los peligrosos caminos del #E Tarim#!, las primeras #COLOR:{0.77,0.5,0.09} #E Huaxia#!#! empiezan a llegar a lo lejos, apareciendo como hormigas pisando la arena. Abrimos las puertas de la ciudad, y ellos, cansados ​​y sucios, nos muestran todo el agradecimiento que les permite su energía. A la mañana siguiente, nos colman de regalos de su gran Emperador, a quien llaman el #E Hijo del Cielo#!.\n\nYa algunos de ellos permanecen en nuestras ciudades (especialmente [GetProvince('(int32)7184').GetName]), y construyen sus casas, con la intención de vivir aquí y brindar refugio seguro a todos sus compatriotas. Aunque no sabemos mucho sobre ellos, una cosa es segura; son un grupo resistente."
me_tayuan_ferghana.7001.desc: "Lentamente, por los peligrosos caminos del #E Tarim#!, las primeras #COLOR:{0.77,0.5,0.09} #E Huaxia#!#! van llegando a lo lejos, algo así como hormigas pisando la arena. Abrimos las puertas de la ciudad, ellos, cansados ​​y sucios, muestran todo el agradecimiento que les permite su energía. A la mañana siguiente, nos entregan unos pequeños obsequios, no muchos, de su Emperador, al que llaman #E Hijo del Cielo#!.\n\nUnos pocos atrevidos permanecen en nuestras ciudades (especialmente [GetProvince('(int32)7184').GetName]), y construyen sus casas, con la intención de vivir aquí y dar refugio seguro a todos sus compatriotas. Una cosa es segura: son un grupo resistente."
me_tayuan_ferghana.7.a: "Nuestras puertas están abiertas de par en par"

me_tayuan_ferghana.8.title: "$tayuan_ferghana_task_7$"
me_tayuan_ferghana.8.desc: "Un día, [ROOT.GetCountry.GetRuler.GetName] estaba en los campamentos militares en las afueras de [ROOT.GetCountry.GetCapital.GetName], observando a los guerreros del ejército mientras entrenaban. Las tropas de [ROOT.GetCountry.GetName] utilizan diferentes técnicas marciales cuando luchan, y al combinar las tradiciones de #COLOR:{0.2,0.47,1} [GetCulture('ionian').GetName]#! y #COLOR:{0.83,0.55,0.6} [GetCulture('tayuan').GetName]#! y fusionarlas en una sola, nuestras fuerzas se han vuelto bastante capaces.\n\nImpresionados por la habilidad demostrada por nuestros jinetes, [ROOT.GetCountry.GetRuler.GetFirstName] pronunció una línea que sería recordada mucho después del reinado de [ROOT.GetCountry.GetRuler.GetHerHis], porque nuestra gente llegaría a ver las [ROOT.GetCountry.GetRuler.GetHerHis] palabras como profecía."
me_tayuan_ferghana.8.a: "'Danos una lanza, un caballo y un arco, y conquistaremos el mundo...'"

me_tayuan_ferghana.9.title: "$tayuan_ferghana_task_8$"
me_tayuan_ferghana.9.desc: "[ROOT.GetCountry.GetRuler.GetName] son los dueños indiscutibles de un vasto reino, que se extiende desde las aguas del #E Mare Aralense#! en el oeste hasta las imponentes #E Montañas Ferghanan#! al este.\n\nCuando los aduladores de la corte en [ROOT.GetCountry.GetCapital.GetName] le preguntaron cómo [ROOT.GetCountry.GetRuler.GetSheHe] pudo someter un territorio tan vasto, el [ROOT.GetCountry.GetRulerTitle] rechazó los elogios aduladores y rápidamente honró a los valientes guerreros de nuestros ejércitos, los soldados de caballería que cabalgaban hacia el cielo a lomos de sus caballos. Conquistar a las tribus en las alturas más lejanas no fue una tarea fácil, pero nuestros jinetes lo lograron."
me_tayuan_ferghana.9.a: "El #E Ejército de Ferghana#! ha llevado la paz a las estepas, montañas y desiertos."

me_tayuan_ferghana.10.title: "$tayuan_ferghana_task_9$"
me_tayuan_ferghana.10.desc: "''Las calles son de mármol, muchas son las estatuas, enormes son los templos, los jardines se extienden y mucha es la gente. Hermano, ¿qué más puedo decirte del esplendor que se encuentra en [GetProvince('(int32)6735').GetName], la más grande de las ciudades, sin estropear la belleza de esa flor? Mi lengua seca nunca le haría justicia.''\n\nEl viajero, entonces, supuso que ésta era una ciudad como nunca había visto; pero había estado en una de las ciudades griegas, [GetProvince('(int32)6704').GetName], y la había encontrado agradable pero no genial. Debe haber sido entonces cuando estos griegos, descontentos con su antigua ciudad, en pocos años construyeron una gran ciudad que rivalizaba con todas."
me_tayuan_ferghana.10.a: "Espero que los camellos puedan soportar otro cambio en el itinerario."

me_tayuan_ferghana.11.title: "$tayuan_ferghana_task_10$"
me_tayuan_ferghana.11.desc: "Las órdenes que [ROOT.GetCountry.GetRuler.GetName] dio a los generales que lucharon en las #E campañas bactrianas#! fueron bastante simples; quemar las ciudades de nuestros enemigos y saquear las posesiones de aquellos que se nos oponen, tomar todo lo que tengan de valor y extender la oferta de servicio militar a sus élites. Cualquiera que desee unirse pacíficamente a nosotros debe tener la oportunidad de hacerlo, pero si nuestras ofertas de amabilidad fueron rechazadas, ni siquiera los animales podrían salvarse.\n\nAfortunadamente para nosotros, hubo muchos que se unieron a nuestros estandartes, incluidos muchos de los arquitectos e ingenieros que habían construido ciudades y pueblos en todos los territorios bactrianos. Y los que neciamente permanecen tercos, perdieron la cabeza."
me_tayuan_ferghana.11.a: "Reconstruiré estos territorios a su debido tiempo..."

me_tayuan_ferghana.12.title: "$tayuan_ferghana_task_11$"
me_tayuan_ferghana.12.desc: "Se dice que en la corte del #E Hijo del Cielo#!, cualquier noble que no puede permitirse uno de los caballos @horses! criados en nuestros establos es visto como inferior a los demás, y se envían sumas asombrosas desde las arcas de la #COLOR:{0.77,0.5,0.09} #E Huaxia#!#! a las tesorerías de la [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]. Incluso si estos son meros rumores destinados a halagar al [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetSheHe] no podríamos estar más orgullosos de nuestra reputación de tener los mejores caballos del mundo.\n\nEl sabio [ROOT.GetCountry.GetRuler.GetFirstName] ha tomado algunas de estas ganancias y ha ordenado que se construyan nuevas propiedades de esclavos para satisfacer la demanda de nuestros sementales."
me_tayuan_ferghana.12.a: "En verdad, los dioses nos han bendecido más allá de lo que merecemos."

me_tayuan_ferghana.13.title: "$tayuan_ferghana_task_12$"
me_tayuan_ferghana.13.desc: "Nuestra burocracia en constante crecimiento ha obligado a [ROOT.GetCountry.GetRuler.GetName], quien ha confiado a los seres más sabios de [ROOT.GetCountry.GetCapital.GetName] desarrollar y perfeccionar una escritura escrita para nuestro pueblo.\n\nAunque a los sabios les llevó un año entero completar su tarea, la nueva #E Escritura Ferghani#! fue el resultado triunfal de sus esfuerzos. Anteriormente habíamos dependido de una mezcolanza de idiomas extranjeros y locales para mantener nuestros asuntos escritos en orden, y un escriba que viviera en nuestra capital tendría que estar familiarizado con al menos siete idiomas diferentes para poder leer y escribir, una impracticabilidad que estaba causando serios problemas.\n\nPero esto es una cosa del pasado, y aunque algunos están luchando por dominar la nueva forma de hacer las cosas, [ROOT.GetCountry.GetRuler.GetFirstName] cree que nuestra escritura Ferghani pagar dividendos, especialmente en lo que respecta a nuestro mantenimiento de registros."
me_tayuan_ferghana.13.a: "Nuestras vidas son cosas inmateriales, pero la palabra escrita es eterna."

me_tayuan_ferghana.14.title: "$tayuan_ferghana_task_13$"
me_tayuan_ferghana.14.desc: "[GetProvince('(int32)6784').GetName] es una ciudad poderosa que domina los valles y estepas que la rodean; muchos dicen que es la clave para [GetProvince('(int32)6737').GetArea.GetRegion.GetName]. Estamos de suerte entonces, porque los que están en sus muros honran a [ROOT.GetCountry.GetRuler.GetName].\n\nA sus cuarteles llegan cada día más hombres, tanto para defender nuestras fronteras contra los bárbaros, como para montar una gran expedición para aplastarlos finalmente..."
me_tayuan_ferghana.14.a: "Talas nos ayudará a salir adelante."

me_tayuan_ferghana.15.title: "El intercambio Mingtepa"
me_tayuan_ferghana.15.desc: "Es una sensación extraña llegar a un lugar completamente extraño, que no entiendes en absoluto, y ver la vida avanzar. Toda la gente tiene caras lavadas por hacer sus habituales tareas domésticas, pero todo lo que ocurre allí te enseña más que cualquier tomo.\n\nImagínate, entonces, como ejercicio, la sorpresa que se lleva un [GetCulture('tayuan').GetCultureGroup.GetName] campesino o un [GetCulture('pasargadi').GetName] comerciante cuando llegan a #E Mingtepa#!, el gran almacén donde Oriente viene a comerciar. Estos hombres de piel clara del este comercian con porcelanas aún más claras, y de sus largas y coloridas mangas de seda ruedan infinitas monedas, cerrando todo tipo de negocios en los mercados, establos y salas de este gigantesco puesto comercial."
me_tayuan_ferghana.15.a: "Mingtepa, amigo mío, es simplemente otro mundo."

me_tayuan_ferghana.16.title: "entre las paredes"
me_tayuan_ferghana.16.desc: "Vivir en un valle tan acogedor en medio de páramos atrae, naturalmente, la codicia de quienes no lo han hecho. Esta es una lección que las tribus del valle aprendieron con el tiempo, ya que una y otra vez los guerreros de la montaña se acercaban a ellos para saquear, y los jinetes de las estepas para saquear.\n\nComo tal, incluso el #COLOR:{0.83,0.55,0.6} [GetCulture('tayuan').GetName]#! más humilde posee un pequeño muro con una torre. Todos los visitantes quedan impresionados por lo bien fortificado que está el valle, y algunos afirman haber visto cien ciudades amuralladas. La vida dentro de estos muros es todo lo que un hombre necesita; a veces incluso hay suficiente espacio para que el ganado paste en su interior."
me_tayuan_ferghana.16.a: "Al parecer, el sufrimiento construye muros más altos."

me_tayuan_ferghana.17.title: "$tayuan_ferghana_task_16$"
me_tayuan_ferghana.17.desc: "Los #COLOR:{0.2,0.47,1} [GetCulture('ionian').GetName]#E s#!#! consideraron que era un compromiso necesario al establecer su reino otorgar a [GetCulture('tayuan').GetName]#E s#! derechos de voto; y por lo que les importaba, la mayoría eran pastores y vivían en pequeñas aldeas. Sin embargo, con la gran infraestructura en construcción, incluso la antigua pequeña capital de Ershi se convirtió en la gran Throana.\n\nHoy, fuera de la ekklesía de [GetProvince('(int32)6737').GetName], se leyeron los resultados de las elecciones y, para gran sorpresa, hubo una mayoría sustancial de Ferghani. Parece que los antiguos miembros de la tribu llegaron a esta ciudad que les era tan familiar en busca de las comodidades de la vida urbana, y ahora desean administrarla como propia. Esta asamblea local ya ha revertido el nombre de la ciudad a Ershi, y parece que los fergananos del valle ahora la consideran su capital."
me_tayuan_ferghana.17.a: "Curioso."

me_tayuan_ferghana.18.title: "$tayuan_ferghana_task_17$"
me_tayuan_ferghana.18.desc: "La incredulidad de aquel a quien se le ha hecho mucho bien a cambio de aparentemente poco es una recompensa en sí misma. Sí, amigo, en este mundo hostil, elegimos recompensarte. ¿Cómo no vamos a quererte, hermano? Mientras dormimos profundamente en nuestro valle, tú vigilas su entrada y tus caballos corren por las interminables llanuras. #E Sogdia#!, nuestro amor, nunca te haremos mal. Reciban, pues, nuestra bondad con los brazos abiertos."
me_tayuan_ferghana.18.a: "Bendito."

me_tayuan_ferghana.19.title: "$tayuan_ferghana_task_18$"
me_tayuan_ferghana.19.desc: "En el oeste, quienes vinieron aquí para establecerse encontraron condiciones nada agradables. Se crearon muchas granjas, muchas incluso gobernadas por los propios peones para incentivar la migración, pero el suelo no consiente en ser labrado y el ecosistema parece desmoronarse después de haber sido obligado a hacer algo para lo que no fue creado. \n\n Aún así, muchos se quedaron y construyeron una vida aquí, seguramente no tan próspera como se imaginaba, pero sí excelente."
me_tayuan_ferghana.19.a: "Supongo que no siempre se puede ganar."

me_tayuan_ferghana.20.title: "$tayuan_ferghana_task_19$"
me_tayuan_ferghana.20.desc: "¡Que me sacrifiquen por vosotros, queridos bactrianos! ¡Tus días de dolor han terminado! ¡Tus hermanos lejanos, a quienes tantas veces olvidas mencionar en frase o verso, son ahora tus salvadores!'.\n\nAsí comenzó la [ROOT.GetCountry.GetAdjective] administración de los #E [GetCultureGroup('bactrian').GetName]#!, una que estaba más preocupada por atender cuidadosamente las heridas de nuestro hermano que por sacar provecho de la tierra. Ahora estamos en condiciones de defenderlos y, de ese modo, hacer que nos impulsen a alturas aún mayores."
me_tayuan_ferghana.20.a: "Recuerda siempre que estamos aquí para ti."

me_tayuan_ferghana.21.title: "$tayuan_ferghana_task_20$"
me_tayuan_ferghana.21.desc: "Dirigiéndose hacia el sur a través de las numerosas carreteras, miles de [GetCulture('tayuan').GetName]#E s#! ahora se asientan [GetProvince('(int32)6678').GetArea.GetRegion.GetName], ocupando las antiguas residencias palaciegas de los macedonios. Es casi una burla de un cuento liberador, y los otros [GetCultureGroup('bactrian').GetName]#E s#! miran a nuestro pueblo con sorpresa y tristeza, quitándose un yugo tras otro, ahogándose de todos modos.\n\n¡Ho! ¡Cómo podría importarnos, cuando tantas veces fuimos menospreciados como cerdos inferiores! Tantas veces olvidado, tantas veces desechado, oh, [GetCultureGroup('bactrian').GetName] amigos, ¡podríamos hacerlo mucho peor!"
me_tayuan_ferghana.21.a: "¡Adelante entonces!"

me_tayuan_ferghana.22.title: "$tayuan_ferghana_task_21$"
me_tayuan_ferghana.22.desc: "'[SCOPE.sCharacter('primary_heir_scope').GetFirstName], los dioses me dicen en mis sueños todas las noches que mi destino está hacia el este. Considérate bendecido, entonces, porque gobernarás mucho antes de lo que pensabas.'\n\n[SCOPE.sCharacter('primary_heir_scope').GetName], el heredero al trono en [ROOT.GetCountry.GetName], levantó una ceja sospechosa. '¿Te oyes, [ROOT.GetCountry.GetRuler.GetName]? Visiones de los dioses, ¿eh? ¿Y salir a luchar como un mercenario, nada menos? No conoces el idioma, no tienes amigos en el #E Imperio Oriental#!, y aquí en [ROOT.GetCountry.GetCapital.GetName] eres el [ROOT.GetCountry.GetRulerTitle] - el puesto más envidiado en [ROOT.GetCountry.GetName]. A mí me parece una locura lo que estás diciendo... deja en paz esta tontería, te lo ruego.'"
me_tayuan_ferghana.22.a: "[SCOPE.sCharacter('primary_heir_scope').GetFirstName], me iré antes del amanecer, pero regresaré algún día..."
me_tayuan_ferghana.22.b: "Aunque este es el sueño de mi vida, me quedaré."

me_tayuan_ferghana.23.title: "$tayuan_ferghana_task_22$"
me_tayuan_ferghana.23.desc: "Los [GetCulture('bactrian').GetCultureGroup.GetName]#E s#! han sido considerados, y en verdad han sido, durante los últimos siglos, un pueblo mayoritariamente ocioso. No existía una identidad conectiva entre ellos, limitándose únicamente a ser súbditos de Persia en estas tierras. Un [GetCulture('margian').GetName] consideraría a un [GetCulture('tayuan').GetName] de todos modos como un [GetCulture('aramaic').GetName].\n\nSin embargo, todas las diferentes presiones y fuerzas que estas tierras han sentido, como la llegada de los griegos y Qin, o el aumento de las incursiones por parte de las hordas de los páramos, han dado como resultado el nacimiento de un campeón de estos pueblos: los [GetCulture('tayuan').GetName] (¡algunos contendientes poco probables!). Ahora están al mando de un gran imperio nuevo, en estas tierras sin precedentes, los primeros entre sus hermanos."
me_tayuan_ferghana.23.a: "De Ferghana emana verdadero poder y majestuosidad."
tayuan_ferghana_task_23tt: "La cultura #G Ferghani#! necesita #Y Nobles derechos cívicos#!."

me_tayuan_ferghana.24.title: "$tayuan_ferghana_task_23$"
me_tayuan_ferghana.24.desc: "A medida que los años han pasado, la familia real en [ROOT.GetCountry.GetCapital.GetName] se ha aislado cada vez más de la realidad de sus súbditos, negándose a hablar nuestra lengua y participar en nuestros festivales, prefiriendo permanecer con la minoría [GetCulture('ionian').GetName].\n\nEsto debe llegar a su fin. Hoy, una procesión de [GetCulture('tayuan').GetName] nobles se presentó fielmente ante nuestro rey, con sus trajes tradicionales, para aconsejarle y animarle a abrazar la nueva realidad de su reino. La casa [ROOT.GetCountry.GetRuler.GetFamily.GetName] debe escuchar, o de lo contrario."
me_tayuan_ferghana.24.b: "¡La familia real debe adoptar nuestras costumbres!"
me_tayuan_ferghana.24.a: "¿Se niega? ¡Instala un nuevo rey de la nobleza tradicional!"
me_tayuan_ferghana.24.c: "¡Me niego! ¡El rey es [GetCulture('ionian').GetName]!"

me_tayuan_ferghana.25.title: "$tayuan_ferghana_task_24$"
me_tayuan_ferghana.25.desc: "Las disputas entre los #E Voxite#! y los #E zoroastrianos#! que viven dentro de [ROOT.GetCountry.GetCapital.GetName] han enloquecido a [ROOT.GetCountry.GetRuler.GetName] casi de aburrimiento, porque el [ROOT.GetCountry.GetRulerTitle] no desea escuchar ni una palabra más sobre qué panteón ha elegido bendecir a la gente de [ROOT.GetCountry.GetName]. Cuando el Sumo Sacerdote le pidió que resolviera el debate con un decreto oficial, [ROOT.GetCountry.GetRuler.GetFirstName] estuvo más que feliz de hacerlo."
me_tayuan_ferghana.25.a: "Los zoroastrianos que viven entre nosotros son responsables de esto."
me_tayuan_ferghana.25.b: "He visto los milagros de Vaksh con mis propios ojos..."
me_tayuan_ferghana.25.c: "Los dioses están conmigo #E CONMIGO#!, ¡y es por eso que prosperamos!"
vaksh_conversion_tt: "Necesitamos tener al menos #Y 2#! Deidades en nuestro panteón de la fe [GetReligion('vaksh_religion').GetName|Y]."
zoroaster_conversion_tt: "Necesitamos tener al menos #Y 2#! Deidades en nuestro panteón de la fe [GetReligion('zoroaster').GetName|Y]."
tayuan_ferghana_task_24_tt: "Podremos elegir una nueva fe."

me_tayuan_ferghana.26.title: "$tayuan_ferghana_task_25$"
me_tayuan_ferghana.26.desc: "El espectro de las artes jónicas, en todas sus disciplinas, nunca abandonó nuestro lado. Todos los viejos maestros, al vernos vivir tan lejos, se sintieron orgullosos de que sus hijos continuaran con sus tradiciones.\n\nAhora, con todo este contacto y mezcla entre culturas tan radicalmente diferentes, nuestras [GetCulture('ionian').GetName] artes han tomado un nuevo manto y han sido elevadas a una nueva grandeza. Por todo el valle surgen muchos artistas nuevos que expresan su grandeza en su obra; muchos más vienen a verlos y aprender."
me_tayuan_ferghana.26.a: "Somos una potencia cultural."

me_tayuan_ferghana.27.title: "Continúe el camino hacia el oeste"
me_tayuan_ferghana.27.desc: "'¿Puedes hacer algo por mí?' preguntó el escriba [GetCulture('qin').GetName]. Este no era un simple esclavo, sino un hombre de conocimiento; un cartógrafo enviado desde el este para establecer conexiones comerciales con nuestro pueblo. ¿Puede hablarme de todos los países que viven en Occidente, sus costumbres y sus líderes? Estamos muy ansiosos por conocer su mundo'.\n\n'¡Ciertamente!' dijo [SCOPE.sCharacter('tayy_scholar').GetFirstName], uno de nuestros hombres más eruditos. 'Así que, más allá de estas montañas, se encuentran primero los [GetCulture('sogdian').GetName]#E s#!, grandes jinetes, luego más al sur los [GetCulture('bactrian').GetName]#E s#!; es un país lleno de grandes ciudades. Luego nuevamente hacia el oeste, la temible #E Dahae#!, y nuevamente hacia el sur, hacia la tierra de la cultura, las grandes ciudades y el patrimonio, la tierra de los #E persas#!...'"
me_tayuan_ferghana.27.a: "¡Maravilloso!"

me_tayuan_ferghana.28.title: "$tayuan_ferghana_task_27$"
me_tayuan_ferghana.28.desc: "[ROOT.GetCountry.GetRuler.GetName] y [SCOPE.sCharacter('tay_highprieest').GetName], después de escuchar gran parte de la gran sabiduría extranjera del esquivo #COLOR:{0.77,0.5,0.09} #E Huaxia#!#!, finalmente decidieron convocar a uno de sus comerciantes a los apartamentos de [ROOT.GetCountry.GetRulerTitle]. Inmediatamente el hombre mostró qué tomos tenía para ofrecer, jurando que nunca más se encontrarían ejemplares similares; uno sobre adivinación y cosmología, otro sobre gobernanza y otro sobre guerra.\n\nNos asegura que sus pergaminos son de la mayor calidad, con suficiente escrito en su interior para estudiarlos durante toda una vida, y que estas ediciones en particular también tienen anotaciones para ayudar al lector. Al otro lado de la mesa, los dos hombres deciden..."
me_tayuan_ferghana.28.a: "comprar el i ching"
me_tayuan_ferghana.28.b: "Compre los cuatro libros y los cinco clásicos"
me_tayuan_ferghana.28.c: "Compra el arte de la guerra"

me_tayuan_ferghana.29.title: "Kuche y la puerta de jade"
me_tayuan_ferghana.29.desc: "Hemos asegurado la parte más peligrosa del camino entre nosotros y Huaxia; caminos trillados, casetas de vigilancia, posadas, lo que sea. Ahora los ricos comerciantes del Este vienen ellos mismos, tanto para comerciar como para ver estas maravillosas tierras extranjeras. ¡Quién diría que nos volveríamos conocidos por el turismo! Antes, sólo enviaban sus manos más prescindibles a este peligroso viaje. La carretera [GetProvince('(int32)7184').GetName]-[GetProvince('(int32)6744').GetName] se ha convertido rápidamente en una de nuestras arterias más vitales, pero cruzar las montañas hacia [GetProvince('(int32)6704').GetArea.GetName], o incluso ir más lejos para comerciar, sigue siendo un viaje peligroso."
me_tayuan_ferghana.29.a: "Siempre hay trabajo por hacer..."

me_tayuan_ferghana.30.title: "$tayuan_ferghana_task_29$"
me_tayuan_ferghana.30.desc: "Un estado de ánimo sombrío se ha apoderado de [ROOT.GetCountry.GetRuler.GetName], quien es propenso a tener períodos de dudas en los que pensamientos oscuros se apoderan de la mente de [ROOT.GetCountry.GetRuler.GetHerHis]. Las riquezas, los caballos, las joyas, los palacios, el prestigio, el honor - todo lo que viene con el título de [ROOT.GetCountry.GetRulerTitle] - son cenizas en la boca de [ROOT.GetCountry.GetRuler.GetHerHis], importando poco.\n\nEste amargo ensueño se rompe, sin embargo, con la noticia de que se ha formado una facción en [ROOT.GetCountry.GetCapital.GetName], y de inmediato, los viejos instintos entran en acción, rompiendo las cadenas de depresión. Mirando por la ventana de la cámara [ROOT.GetCountry.GetRuler.GetHerHis] con ira, [ROOT.GetCountry.GetRuler.GetHerHis] palpitando con urgencia el pecho, [ROOT.GetCountry.GetRuler.GetFirstName] lee una y otra vez la pequeña nota en el escritorio [ROOT.GetCountry.GetRuler.GetHerHis], concluyendo finalmente que la facción democrática, recientemente establecida, debe ser la que conspira para derrocar a la monarquía - ¿quién más podría ser?\n\nLos asesores de confianza le dicen a [ROOT.GetCountry.GetRuler.GetHerHim] Cada día que pasa, los regalos comienzan a cambiar de manos y se han prometido puestos para asegurar lealtades clave, y con cada amarga traición, [ROOT.GetCountry.GetRuler.GetHerHis] aumenta la determinación de luchar contra esta plaga. 'Debo entrar en acción para evitar una ganancia inesperada tan desafortunada...'[ROOT.GetCountry.GetRuler.GetFirstName] murmura entre dientes [ROOT.GetCountry.GetRuler.GetHerHis], con los ojos entrecerrados."
me_tayuan_ferghana.30.a: "¡Fuerza, mi [ROOT.GetCountry.GetRulerTitle]!"
me_tayuan_ferghana.30.a.tt: "Los problemas seguramente seguirán..."

me_tayuan_ferghana.31.title: "$tayuan_ferghana_task_30$"
me_tayuan_ferghana.31.desc: "Cuando un grupo de #E monjes budistas#! se acercó a [ROOT.GetCountry.GetRuler.GetName] con una solicitud de grandes sumas de dinero, la primera inclinación del [ROOT.GetCountry.GetRulerTitle] fue negarlas de inmediato, pero esa misma noche, sueños extraños perturbaron el [ROOT.GetCountry.GetRuler.GetHerHis] sueño y [ROOT.GetCountry.GetRuler.GetFirstName] tomó esto como una señal de los dioses.\n\nEl mismísimo Al día siguiente, se confiaron talentos de oro y plata al cuidado de los monjes, que deseaban construirse una ermita, un lugar donde pudieran concentrarse en sus estudios durante todo el año. Sólo requerían dos cosas; su hogar debía construirse en las montañas cubiertas de nieve, muy alejados del resto del mundo para que sus tentaciones terrenales disminuyeran, y el cáñamo @hemp! debía crecer en los salvajes riscos de las rocas."
me_tayuan_ferghana.31.a: "¡Buena suerte, valientes monjes! Rezo para que encuentres la felicidad en tus montañas."

me_tayuan_ferghana.32.title: "$tayuan_ferghana_task_31$"
me_tayuan_ferghana.32.desc: "En los últimos meses se ha observado que muchos #E zoroastrianos#! de Ferghani, alentados por las actitudes religiosas de nuestro pueblo hacia su panteón y sus prácticas, se han estado mudando a nuestra capital. En un ámbito donde la [GetReligion('vaksh_religion').GetName] religión domina el paisaje local, [ROOT.GetCountry.GetCapital.GetName] se ha convertido en una atracción irresistible; una ciudad civilizada y próspera que tolera a pueblos de diferentes religiones."
me_tayuan_ferghana.32.a: "Todos los que siguen los caminos de la paz son bienvenidos en [ROOT.GetCountry.GetCapital.GetName]"
tayuan_zoroastrian_district_mod: "Distrito zoroástrico"

me_tayuan_ferghana.33.title: "$tayuan_ferghana_task_32$"
me_tayuan_ferghana.33.desc: "Para que los textos sagrados #E Abhidharma Pitaka#! se tradujeran y comprendieran completamente, un contingente de eruditos viajó desde [ROOT.GetCountry.GetCapital.GetName] el lejano sur, donde los servicios de #E sabios budistas#! bien versados en sus enseñanzas trabajaron junto a nuestros parientes.\n\nNuestros hermanos permanecieron allí muchos meses, levantándose con los budistas al amanecer y trabajando hasta bien entrada la noche hasta que terminaron el trabajo, y regresaron a [ROOT.GetCountry.GetName] con pergaminos en mano y ojos abiertos."
me_tayuan_ferghana.33.a: "Las enseñanzas de estos textos cambiarán el mundo..."

me_tayuan_ferghana.34.title: "$tayuan_ferghana_task_33$"
me_tayuan_ferghana.34.desc: "El trabajo de un hombre puede ser trabajo, pero eso no le impide ser un ser humano junto a él. El #E Syntechniai#! permite precisamente esto; Allí los comerciantes pueden ayudarse unos a otros, los aprendices pueden aprender a convertirse en verdaderos maestros, se pueden pagar funerales, se puede apoyar a las viudas: estas organizaciones no son sólo formas de transmitir habilidades, sino de mantener vivas nuestras ciudades y pueblos."
me_tayuan_ferghana.34.a: "Maravilloso."

me_tayuan_ferghana.35.title: "$tayuan_ferghana_task_34$"
me_tayuan_ferghana.35.desc: "'Una mano, tras otra... ahí, agarra ese trozo de roca y levántate. ¡Tranquilo, [ROOT.GetCountry.GetRuler.GetFirstName]! No sería bueno llevarte de regreso a casa en una caja.'\n\nEn el mismísimo techo del mundo, donde el viento corta como un cuchillo y el aire es tan frío y fresco que te quema los pulmones, los soldados de [ROOT.GetCountry.GetName] están escalando montañas que nunca debieron ser cruzadas. ¡La cumbre está cerca! Ascenderlo será un toque momentáneo, pero de él explotarán mil éxtasis. Los sentidos de [ROOT.GetCountry.GetRuler.GetName] a esta altura, cerca de las cimas, ya no son muy humanos; algunos han dicho que te sentirás como los dioses, más de lo que lo sentiría un humano.\n\nUna vez que nuestros ejércitos se abran paso, las muchas formas en que nos conectaremos con #E India#! llevarán nuestras almas a los cielos, transformándolas, con la ayuda del conocimiento, en nuevos recipientes en este mundo."
me_tayuan_ferghana.35.a: "¡Adelante al Mahabodhi!"

me_tayuan_ferghana.36.title: "$tayuan_ferghana_task_35$"
me_tayuan_ferghana.36.desc: "Otro [GetCulture('sakan').GetName] miembro de la tribu, de rostro áspero, barba sucia y generalmente lleno de baba y saliva, es ejecutado y cae al suelo sin contemplaciones. Era un hombre que, sin duda, no tuvo una vida fácil. Todavía los de su calaña, peores que los cerdos y menos inteligentes que el ganado, plagan nuestras pacíficas tierras y amenazan con violar a nuestras hijas.\n\nA lo largo de las estepas del norte, nuestras patrullas de caballería ahora interceptan y ejecutan rápidamente a estos salvajes, para que no quemen nuestras cosechas nunca más. Se está derramando mucha sangre y el modo de vida natural de las estepas empieza a desaparecer aquí, pero al menos tendremos paz."
me_tayuan_ferghana.36.a: "Y así vemos el final de ellos."

me_tayuan_ferghana.37.title: "$tayuan_ferghana_task_36$"
me_tayuan_ferghana.37.desc: "Nunca dispuesto a la discordia, [ROOT.GetCountry.GetRuler.GetName] ha alentado a las diversas creencias religiosas que florecen dentro de [ROOT.GetCountry.GetName] a coexistir pacíficamente con todo el poder del estado detrás de [ROOT.GetCountry.GetRuler.GetHerHim]. Se anima a todos a adorar como su conciencia les exige que honren a sus dioses, y la única regla cuando se trata de lo divino es que a ningún hombre se le permite prohibir a su vecino adorar como quiera.\n\nEsta actitud permisiva y curiosa hacia lo extraño ha permitido que culturas y creencias extranjeras prosperen dentro de [ROOT.GetCountry.GetCapital.GetName] como nunca antes."
me_tayuan_ferghana.37.a: "Es mejor hacer que amar que guerra."

me_tayuan_ferghana.38.title: "$tayuan_ferghana_task_37$"
me_tayuan_ferghana.38.desc: "Finalmente, y con entusiasmo, hemos recibido noticias de los enviados que enviamos a las #E ciudades jónicas#! de la cálida costa del Egeo. Nuestros hombres fueron recibidos calurosamente por los gobernantes locales y ningún gasto fue demasiado grande para nuestros anfitriones. Nuestros mensajeros fueron aclamados por el pueblo llano, porque muchos deseaban verlos en persona, y así terminaron nuestros paisanos visitando tres ciudades; [GetProvince('(int32)286').GetName], [GetProvince('(int32)288').GetName] y [GetProvince('(int32)290').GetName].\n\nNuestros diplomáticos dicen que se lo están pasando genial y que siguen agradecidos por la oportunidad de servir a nuestros intereses de esa manera."
me_tayuan_ferghana.38.a: "Me alegro de haber establecido contacto con nuestros primos."
me_tayuan_ferghana.38.b: "¿Quizás podrían persuadir a algunos jonios para que se mudaran aquí?"
me_tayuan_ferghana.38.c: "Soborna a las élites jónicas y roba parte de su tecnología."

me_tayuan_ferghana.39.title: "$tayuan_ferghana_task_38$"
me_tayuan_ferghana.39.desc: "[ROOT.GetCountry.GetRuler.GetName] es conocido en todas partes como un [ROOT.GetCountry.GetRulerTitle] de gran piedad, uno que ha resistido firmemente las tentaciones de dioses más débiles mientras se mantiene fiel al panteón de los [ROOT.GetCountry.GetRuler.GetHerHis] antepasados. Muchos de los que viven en [ROOT.GetCountry.GetCapital.GetName] ahora se refieren a [ROOT.GetCountry.GetRuler.GetFirstName] #E 'Eusebes'#! en honor a la fe de [ROOT.GetCountry.GetRuler.GetHerHis], y el apodo está empezando a popularizarse en [ROOT.GetCountry.GetName]."
me_tayuan_ferghana.39.a: "¡Los dioses de nuestros antepasados nos protegerán en los días y años venideros!"

me_tayuan_ferghana.40.title: "$tayuan_ferghana_task_39$"
me_tayuan_ferghana.40.desc: "Dentro de los muros de estas ciudades viven numerosos habitantes que estos valles nunca han visto. Ambas son ciudades, en un sentido literal, pero también fortalezas, lo que hace que el imposible viaje a lo largo de estas montañas sea aún más traicionero para todos los enemigos. Muchos los llaman trozos de cielo, lugares donde la vida debería estar reservada para las águilas pero ahora habitan los humanos.\n\nEn sus altas bañeras de mármol, la población descansa, contemplando a través de sus grandes columnas picos irregulares, retorcidos sobre sí mismos, formados por mezclas de roca y nieve. En las calles adoquinadas se pueden ver a través de las ventanas de las casas cómodas escenas familiares, luego mirar fuera de los muros y ver valles inhóspitos con sólo algunos árboles y en su mayoría arbustos."
me_tayuan_ferghana.40.a: "Otra muestra de nuestro poder."

me_tayuan_ferghana.41.title: "$tayuan_ferghana_task_40$"
me_tayuan_ferghana.41.desc: "Cuando nuestros monjes regresaron a casa en [ROOT.GetCountry.GetCapital.GetName] después de su viaje de un año a #E India#! y regresaron, no era necesario tener una conversación con los hombres para decirles que habían sido cambiados, porque estaba claro que habían sido transformados por su experiencia con solo mirarlos. Todos vestían túnicas largas y blancas y tenían la apariencia demacrada de esos ascetas que niegan el alimento del cuerpo. \n\n[ROOT.GetCountry.GetRuler.GetName], siempre deseando escuchar lo que había sucedido en tierras extranjeras, invitó a los viajeros a regresar a [ROOT.GetCountry.GetRuler.GetHerHis] habitaciones personales. Fue allí donde se reunieron, discutieron muchas cosas y reflexionaron sobre las lecciones de la iluminación, y el sol se desvaneció y volvió a salir antes de que se rompiera el ensueño.\n\nAl final de la conversación, [ROOT.GetCountry.GetRuler.GetFirstName] estaba convencido."
me_tayuan_ferghana.41.a: "¡Abrazaré plenamente las enseñanzas de Siddharta!"
me_tayuan_ferghana.41.b: "Las viejas costumbres siempre serán las mejores."

me_tayuan_ferghana.42.title: "$tayuan_ferghana_task_41$"
me_tayuan_ferghana.42.desc: "Aunque tenemos una reputación de ser luchadores formidables que son más que capaces de defendernos en el campo de batalla, nuestra gente es vista como entusiastas mercaderes y comerciantes en todo el mundo civilizado.\n\nNuestros productos son aclamados como los mejores que el dinero puede conseguir, especialmente cuando se trata de nuestros caballos @horses!, y caravanas tanto del este como del oeste hacen los arduos viajes a través de los desiertos y estepas de nuestro interior para visitar los mercados de [ROOT.GetCountry.GetCapital.GetName]."
me_tayuan_ferghana.42.a: "La guerra y el comercio no son más que dos caras de la misma moneda"

me_tayuan_ferghana.43.title: "$tayuan_ferghana_task_42$"
me_tayuan_ferghana.43.desc: "Aunque nuestro pueblo tiene mucho que aprender sobre el #E Imperio Oriental#! y sus maravillas, muchos de nuestros generales han escuchado historias de los más grandes guerreros orientales y secretamente albergan esperanzas de aprender sus tácticas, porque es ampliamente conocido que nuestro ejército palidece en comparación con el de ellos. A lo largo de muchos años, hemos aprendido los nombres de algunos de sus líderes de manera indirecta; desde informes de batallas compartidos por comerciantes ambulantes, en los pergaminos y escritos de los historiadores orientales, e incluso de soldados que han huido de sus deberes en el este con la esperanza de encontrar refugio en [ROOT.GetCountry.GetName].\n\nCon solo unas nociones más vagas para guiarlos en su camino, los diplomáticos seleccionados para el viaje al este se han acercado a [ROOT.GetCountry.GetRuler.GetName] con una solicitud de orientación. Buscarán lugares de aprendizaje donde se puedan encontrar #E tratados militares#!, pero deben saber ¿qué gran líder debería ser el objetivo de su viaje de investigación?"
me_tayuan_ferghana.43.a: "Busque conocimiento del #E Carnicero de hombres#! - el genio de la muerte #E Bai Qi#!"
me_tayuan_ferghana.43.b: "En tiempos como estos, nos vendría bien un hombre como #E Lian Po#!"
me_tayuan_ferghana.43.c: "Los señores de la estepa son una molestia y la experiencia de #E Li Mu#! sería útil."
me_tayuan_ferghana.43.d: "#E Wang Jian#! es un personaje digno de imitar"

me_tayuan_ferghana.44.title: "$tayuan_ferghana_task_43$"
me_tayuan_ferghana.44.desc: "Aunque algunos que viven dentro de la decisión de [ROOT.GetCountry.GetRuler.GetName] de otorgar el estatus de #E Ciudadano#! a las dispersas comunidades #E Qin#! que viven dentro de nuestro reino, el [ROOT.GetCountry.GetRulerTitle] se apresuró a descartar cualquier crítica. Cuando algunas élites continuaron respondiendo, argumentando que otorgar derechos a los extranjeros del este era una traición a nuestras viejas costumbres, [ROOT.GetCountry.GetRuler.GetFirstName] me reuní con ellos personalmente y hubo muchas conversaciones honestas entre gobernantes y gobernados. Al final, la mayoría aceptó confiar en [ROOT.GetCountry.GetRulerTitle], quien ya había demostrado su [ROOT.GetCountry.GetRuler.GetHerHim] valía una y otra vez."
me_tayuan_ferghana.44.a: "Verás que todo estará bien."

me_tayuan_ferghana.45.title: "$tayuan_ferghana_task_44$"
me_tayuan_ferghana.45.desc: "Aunque no todos los que vivían dentro de [ROOT.GetCountry.GetCapital.GetName] adoraban a los dioses de la #COLOR:{0.77,0.5,0.09} #E Huaxia#!#!, la mayoría de los habitantes de la ciudad se alegraron de ver que el distrito religioso se expandió para incluir los santuarios de los extranjeros. La capital de [ROOT.GetCountry.GetName] tenía fama de ser un lugar donde se adoraba libremente a muchos dioses, y el #E Templo de los Shens#!, una estructura pequeña y humilde construida al estilo oriental, era solo otra señal de que esto era cierto."
me_tayuan_ferghana.45.a: "Doy la bienvenida a la protección y bendiciones de todos los dioses."

me_tayuan_ferghana.46.title: "$tayuan_ferghana_task_45$"
me_tayuan_ferghana.46.desc: "Aunque algunos de los miembros más conservadores de la nobleza se opusieron a la idea de que [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] viajara en persona para inclinarse ante un gobernante extranjero, no pudieron persuadir a [ROOT.GetCountry.GetRuler.GetName] para que cambiara de opinión a [ROOT.GetCountry.GetRuler.GetHerHis]. Las historias que [ROOT.GetCountry.GetRuler.GetFirstName] había oído hablar sobre el #E Hijo del Cielo#! parecían imposibles de creer, y la idea de hacer el largo viaje por tierra para ver la corte del magnífico gobernante era casi demasiado para soportar.\n\nEn unos días, un séquito de nuestros mejores guerreros seguía a [ROOT.GetCountry.GetRuler.GetFirstName] por las rutas que conducían al este."
me_tayuan_ferghana.46.a: "¡No puedo creer que esto esté pasando!"

me_tayuan_ferghana.47.title: "$tayuan_ferghana_task_46$"
me_tayuan_ferghana.47.desc: "En los últimos años, la influencia de la cultura #E Qin#! ha crecido en todo [ROOT.GetCountry.GetName], y cada vez más orientales vienen a establecer su hogar en nuestros valles montañosos. Un día, un diplomático visitante en [ROOT.GetCountry.GetCapital.GetName] fue llevado a un mercado local, y el embajador observó irónicamente que no podía decir si éramos un país de #E [ROOT.GetCountry.GetPrimaryCulture.GetName]#! o no, porque había muchos extranjeros ejerciendo sus oficios; En nuestra capital se podían encontrar Qin, bactrianos, sogdianos, helenos e incluso un par de comerciantes cartagineses.\n\nCuando [ROOT.GetCountry.GetRuler.GetName] escuchó esta historia, el comentario que [ROOT.GetCountry.GetRuler.GetSheHe] hizo en respuesta fue legendario."
me_tayuan_ferghana.47.a: "Hemos adoptado plenamente la cultura del #E Qin#!"
me_tayuan_ferghana.47.b: "¡Nací [ROOT.GetCountry.GetPrimaryCulture.GetName] y moriré [ROOT.GetCountry.GetPrimaryCulture.GetName]!"

me_tayuan_ferghana.48.title: "$tayuan_ferghana_task_47$"
me_tayuan_ferghana.48.desc: "En [GetProvince('(int32)6740').GetName], y a través de [GetProvince('(int32)6740').GetName], ahora pasa mucha sabiduría: los monjes han comenzado a establecerse aquí. La #E Gran Estupa#! será una referencia para todos los budistas del mundo, un símbolo para todos los que vendrán aquí.\n\nAl otro lado de la puerta del templo ahora deambulan muchos arquitectos y trabajadores de las orillas del [GetProvince('(int32)7697').GetName], todos trabajando para hacer de este lugar lo más impresionante posible y para que se convierta en un gran centro de reverencia en el mundo budista."
me_tayuan_ferghana.48.a: "Nuestro objetivo es impresionar."

me_tayuan_ferghana.49.title: "La petición del olivar"
me_tayuan_ferghana.49.desc: "Cuando el séquito de [ROOT.GetCountry.GetRulerTitle] llegó a su residencia en [GetProvince('(int32)6654').GetArea.GetName], muchos [GetCulture('macedonian').GetName] ya se habían reunido enfrente, habiéndose enterado de su llegada de antemano. De la multitud se adelantó un tal [SCOPE.sChar('taymacfella').GetName], macedonio y seguidor de la religión [GetReligion('vaksh_religion').GetName], y suplicó a las figuras de gobierno allí presentes:\n\n'Mis buenos señores y señores, hay una gran ansiedad entre mi pueblo, un pueblo no tan diferente al suyo, de que seamos rechazados de este país por otros que hablan el mismo idioma de nuestros padres y cuentan sus heroicos cuentos, sólo porque no desean compartir estas tierras divinas con nosotros. Hemos echado raíces aquí (y yo soy el mejor ejemplo de ello), así que os suplicamos a todos, y especialmente a mi príncipe [ROOT.GetCountry.GetRuler.GetFirstName], por vuestra amabilidad.'"
me_tayuan_ferghana.49.a: "Puede contar con nuestra mano amiga."
me_tayuan_ferghana.49.b: "No somos, ni seremos nunca, parientes tuyos."
me_tayuan_ferghana.49.c: "Sinceramente, no podría importarme menos..."
me_tayuan_ferghana.49.c_tt: "Es como si nunca hubiera pasado nada."

me_tayuan_ferghana.50.title: "$tayuan_ferghana_task_49$"
me_tayuan_ferghana.50.desc: "Los famosos constructores de barcos, los [GetCulture('ionian').GetName]#E s#! siempre han sido conocidos por desafiar todo tipo de mar. Desgraciadamente, además de todo lo demás, los persas también nos arrebataron nuestro mar; Extrañamos muchísimo la vida sobre las olas y la capacidad de llegar a las tierras más lejanas.\n\nSe necesitarían verdaderos locos para transportar barcos por tierra, algo que nosotros no somos.\n\nAsí que ahora los barcos son animales de carga y los timones nuestros pies. ¿Qué hay de qué preocuparse? Ahora atravesamos, a lomos de camellos, mares de arena y tempestades de nieve, aún logramos llegar a todo tipo de personas, y donde hay personas inteligentes y con dinero que ganar, encontraremos la manera de llegar."
me_tayuan_ferghana.50.a: "La sangre del comerciante todavía fluye, lejos de su puerto."

me_tayuan_ferghana.51.title: "$tayuan_ferghana_task_50$"
me_tayuan_ferghana.51.desc: "Tres maneras de elegir, al filo de la navaja. Manejar este caldero de personas nunca sería fácil, y entre las magistraturas suenan advertencias de que ya no podemos ignorar nuestra propia grandeza, debemos adaptar una política para tratar con las diferentes personas en nuestras tierras.\n\nSi bien muchos apoyan mantener nuestras tradiciones como una élite exclusivamente jónica, muchos advierten contra los peligros de excluir a todos los demás. [ROOT.GetCountry.GetRuler.GetFirstName] y [SCOPE.sCharacter('tayy_scholar2').GetName] ciertamente están estresados ​​por esto, ya que han estado estudiando minuciosamente documentos e informes, relatos y órdenes de los tribunales para finalmente respaldar una decisión."
me_tayuan_ferghana.51.a: "¡Estarnos solos!"
me_tayuan_ferghana.51.b: "Debemos hacer algunas concesiones."
me_tayuan_ferghana.51.c: "¡'Nosotros' somos todos nuestros pueblos!"

me_tayuan_ferghana.52.title: "$tayuan_ferghana_task_final$"
me_tayuan_ferghana.52.desc: "Las piedras que están aquí hoy están sostenidas sobre los hombros de los miles que se entregaron a [ROOT.GetCountry.GetName] y a quienes estaban junto a ellos.\n\nNuevamente, tengan cuidado de no adorar las piedras; la mayor de todas las obras de [GetProvince('(int32)6704').GetArea.GetName] es la gente que la representa, resultado de muchos rostros y culturas que la cruzan, y de estas personas que se mezclan e interactúan colectivamente, miles de pequeñas semillas que ahora brotan para abrazar nuestra nueva identidad;"
me_tayuan_ferghana.52.a: "Como la verdadera continuación de los [GetCulture('ionian').GetName]#E s#!."
me_tayuan_ferghana.52.b: "Como un nuevo incondicional del Cielo en Occidente."
me_tayuan_ferghana.52.c: "Como los verdaderos hijos de las tierras [GetCulture('tayuan').GetName]."
me_tayuan_ferghana.52.d: "Como el primero más allá de las montañas en defender al Buda."
me_tayuan_ferghana.52.e: "Como encrucijada de griegos y budistas."
me_tayuan_ferghana.52.f: "Como una nueva dinastía, bajo el Cielo y el Buda."
me_tayuan_ferghana.52.g: "Como la danza entre la cultura [GetCulture('ionian').GetName] y las tribus [GetCulture('tayuan').GetName]."
me_tayuan_ferghana.52.h: "Como el primero de los griegos en sincretizarse con el gran Imperio de Oriente."
me_tayuan_ferghana.52.i: "Como un matrimonio del #E Huaxia#! Oriente y la [GetCulture('tayuan').GetName] tierra."

# EVENT CHAINS

me_tayuan_ferghana.60.title: "Adquirir un tratado"
me_tayuan_ferghana.60.desc_1: "Después de muchos meses de viaje, nuestros diplomáticos llegaron a las fronteras del #E Imperio de Oriente#!, donde los guardias fronterizos los trataron justamente pero los miraron con cierta sospecha. Se intercambiaron sobornos, se contrataron intérpretes y, en las semanas y meses siguientes, nuestros hombres registraron todos los mercados y templos que encontraron.\n\nNuestros diplomáticos pronto aprendieron que el nombre #E 'Bai Qi'#! no era uno para compartir a la ligera, ya que el renombrado general había arrasado muchas ciudades y pueblos en todo el campo del #E Imperio Oriental#!. Y hubo muchos que todavía maldijeron su nombre. A pesar de esta sombría reputación que cerró más puertas de las que abrió, las palabras escritas de Bai Qi finalmente fueron descubiertas en un pequeño templo que había sido construido en el lugar de una gran batalla. Los monjes que vivían allí estaban dispuestos a vender su mayor posesión, pero el precio era asombroso."
me_tayuan_ferghana.60.desc_2: "Después de muchos meses de viaje, nuestros diplomáticos llegaron a las fronteras del #E Imperio de Oriente#!, donde los guardias fronterizos los trataron justamente pero los miraron con cierta sospecha. Se intercambiaron sobornos, se contrataron intérpretes y, en las semanas y meses siguientes, nuestros hombres registraron todos los mercados y templos que encontraron.\n\nNuestros hombres informan que finalmente llegaron a un poderoso reino llamado #E 'Chu'#!, y la ciudad capital de este reino resplandeciente se llamó #E 'Shouxian'#!. Fue en esta hermosa ciudad donde nuestros hombres descubrieron los escritos de #E Lian Po#!, un general que fue enterrado dentro de sus muros.\n\nLian Po era conocido tanto por sus famosas victorias como por sus famosas derrotas, por lo que los escritos del general son valorados más que otros por ofrecer una visión matizada de lo que significa comandar a los guerreros en la batalla. Se hicieron averiguaciones en el templo que servía como tumba del general y se reveló que una memoria titulada #E 'Reflexiones sobre la batalla de Changping'#!, un relato escrito a mano de una batalla trascendental que Lian Po perdió hace mucho tiempo, estaba disponible para su compra, pero el precio era una cantidad asombrosa."
me_tayuan_ferghana.60.desc_3: "Después de muchos meses de viaje, nuestros diplomáticos llegaron a las fronteras del #E Imperio de Oriente#!, donde los guardias fronterizos los trataron justamente pero los miraron con cierta sospecha. Se intercambiaron sobornos, se contrataron intérpretes y, en las semanas y meses siguientes, nuestros hombres registraron todos los mercados y templos que encontraron.\n\nDespués de días de búsquedas infructuosas en las ciudades y mercados del #E Interior del Imperio Oriental#!, a nuestros mensajeros se les dijo que si buscaban las enseñanzas del gran #E Li Mu#!, su tiempo sería mejor. Pasó muy al norte. Con este conocimiento en mente, los [ROOT.GetCountry.GetAdjective] diplomáticos se dirigieron a las fortalezas fronterizas que protegían el corazón del imperio de los despiadados nómadas a caballo de la estepa y, en unas pocas semanas, encontraron un manuscrito a la venta."
me_tayuan_ferghana.60.desc_4: "Después de muchos meses de viaje, nuestros diplomáticos llegaron a las fronteras del #E Imperio de Oriente#!, donde los guardias fronterizos los trataron justamente pero los miraron con cierta sospecha. Se intercambiaron sobornos, se contrataron intérpretes y, en las semanas y meses siguientes, nuestros hombres registraron todos los mercados y templos que encontraron.\n\nCuando todo estuvo dicho y hecho, encontrar un tratado militar escrito por el incomparable #E Wang Jian#! resultó no ser ninguna tarea, ya que nuestros diplomáticos fueron convencidos por sus intérpretes de viajar a una región que llamaron #E 'Guanzhong'#!. Pasaron unos días haciendo averiguaciones y pronto encontraron a un comerciante de pergaminos raros que estaba dispuesto a desprenderse de la última copia de los escritos del general."
me_tayuan_ferghana.60.a: "¡Nuestros generales deben ser asesinos como Bai Qi!"
me_tayuan_ferghana.60.b: "Para aprender las lecciones de Lian Po, gastaría cada moneda en [ROOT.GetCountry.GetName]"
me_tayuan_ferghana.60.c: "La estrategia de Li Mu no tiene precio: pagaremos"
me_tayuan_ferghana.60.d: "¡Debemos comprar el tratado de Wang Jian de inmediato!"
me_tayuan_ferghana.60.e: "En realidad, esto es demasiado caro."

me_tayuan_ferghana.61.title: "el comerciante"
me_tayuan_ferghana.61.desc: "Mientras viajaban por los largos caminos que conducían al #E Imperio de Oriente#!, [ROOT.GetCountry.GetRuler.GetName] y el séquito [ROOT.GetCountry.GetRuler.GetHerHis] se encontraron con un comerciante errante que se dirigía en la dirección opuesta. Este comerciante, un hombre llamado [SCOPE.sCharacter('traveling_qin_merchant_scope').GetName], saludó al [ROOT.GetCountry.GetRulerTitle] con los ojos muy abiertos y asombrado.\n\n'Cuando me desperté esta mañana, no tenía idea de que pronto estaría frente al gobernante de [ROOT.GetCountry.GetName]. ¡En verdad, es mi día de suerte! ¡Por ti ofreceré mis dos mayores tesoros!'"
me_tayuan_ferghana.61.a: "Esas joyas que tienes son excepcionales..."
me_tayuan_ferghana.61.b: "Un verdadero guerrero como yo quiere comprar esa espada."
me_tayuan_ferghana.61.c: "¡Bah! Tu mercancía es demasiado cara."

me_tayuan_ferghana.62.title: "el emperador"
me_tayuan_ferghana.62.desc_1: "Después de semanas atravesando las carreteras, las laderas boscosas, los valles fértiles y los ríos sin rumbo del #E Imperio Oriental#!, los hombres [ROOT.GetCountry.GetRuler.GetName] y [ROOT.GetCountry.GetRuler.GetHerHis] juraron que debieron haber visto más de mil ciudades y pueblos, con nombres que se mezclaban entre sí, demasiados para que nadie los recuerde.\n\nY, sin embargo, de alguna manera, frente al cansancio, su Sus pies cansados los llevaron adelante hasta que llegaron a una ciudad llamada #E Xianyang#! y, a pesar de su condición de extranjeros, se les permitió presentarse ante el #E Emperador del Este#!, el dios viviente [SCOPE.sCharacter('chinese_emperor_character_scope').GetName].\n\n'Sé por qué estás aquí, o [ROOT.GetCountry.GetRulerTitle] del [ROOT.GetCountry.GetName] - hay mucho sobre ti, o debería decir sobre tus caballos, que me encantaría saber. Las horas transcurrieron en una agradable conversación que resultó en una genuina calidez entre los dos gobernantes, y en un gesto que [ROOT.GetCountry.GetRuler.GetFirstName] recordaría por el resto de [ROOT.GetCountry.GetRuler.GetHerHis] vida, se enviaron regalos a [ROOT.GetCountry.GetCapital.GetName] que durarían una generación."
me_tayuan_ferghana.62.desc_2: "Después de semanas atravesando las carreteras, las laderas boscosas, los valles fértiles y los ríos sin rumbo del #E Imperio Oriental#!, los hombres [ROOT.GetCountry.GetRuler.GetName] y [ROOT.GetCountry.GetRuler.GetHerHis] juraron que debieron haber visto más de mil ciudades y pueblos, con nombres que se mezclaban entre sí, demasiados para que nadie los recuerde.\n\nY, sin embargo, de alguna manera, frente al cansancio, su Los pies cansados los llevaron hasta que llegaron a un pueblo llamado #E Xianyang#!, y a pesar de su condición de extranjeros, se les permitió presentarse ante el #E Emperador del Este#!, el dios viviente [SCOPE.sCharacter('chinese_emperor_character_scope').GetName].\n\nFue un desastre el momento en que [ROOT.GetCountry.GetRuler.GetFirstName] entró en la corte, porque con [ROOT.GetCountry.GetRuler.GetHerHis] prisa Para ver las maravillas del #E Palacio Imperial#!, los [ROOT.GetCountry.GetAdjective] viajeros habían ido directamente a las moradas reales, con el polvo y el fango de los caminos aún sobre ellos.\n\n'¿Y quién es este bárbaro que se atreve a presentarse ante el #E Hijo del Cielo#! que huele a sudor y estiércol de caballo? Vete, maloliente patán de provincias, y no vuelvas nunca más a palacio."
me_tayuan_ferghana.62.a: "¡Esto es nada menos que un milagro!"
me_tayuan_ferghana.62.b: "Que humillación es esta..."
NICKNAME_SON_OF_HEAVEN: "'Hijo del cielo'"


me_tayuan_ferghana.3001.title: "$tayuan_ferghana_task_29$: El [GetOffice('office_master_of_the_guard').GetCulturalName(SCOPE.GetRootScope.GetCountry)]"
me_tayuan_ferghana.3001.desc: "Y entonces [ROOT.GetCountry.GetRuler.GetFirstName] decide actuar. Saltando de su habitación a su scriptorium, pide que llamen a su [GetOffice('office_master_of_the_guard').GetCulturalName(SCOPE.GetRootScope.GetCountry)].\n\nLlega rápidamente y lo saluda, y después de una rápida sesión informativa sobre la situación, habla:\n\n''Ya veo, mi [ROOT.GetCountry.GetRulerTitle]. Yo tampoco soy ajeno a estos rumores y yo mismo he visto algunos movimientos extraños. Hay dos formas en que podemos contrarrestarlos; mediante espionaje y connivencia, o mediante demostraciones visibles de fuerza sobre probables sospechosos destinadas a intimidar al resto. Mis hombres son capaces de cualquiera de las dos cosas, la decisión es tuya."
me_tayuan_ferghana.3001.a: "Sácalos."
me_tayuan_ferghana.3001.b: "¡Golpéalos!"
me_tayuan_ferghana.3001.a_tt: "Nuestro éxito dependerá de la habilidad de nuestro [GetOffice('office_master_of_the_guard').GetCulturalName(SCOPE.GetRootScope.GetCountry)]."

me_tayuan_ferghana.3002.title: "El [GetOffice('office_master_of_the_guard').GetCulturalName(SCOPE.GetRootScope.GetCountry)] tiene éxito"
me_tayuan_ferghana.3002.desc: "Unos días más tarde, [SCOPE.sCharacter('tay_bdg_plot').GetName] entra en las habitaciones del palacio e informa sumariamente a [ROOT.GetCountry.GetRuler.GetName] que sus esfuerzos por erradicar a los conspiradores con acción directa tuvieron un rotundo éxito y que ya tenemos una buena lista de nombres, tanto civiles como militares, en nuestro poder.\n\nAún así, los conspiradores restantes planean sus días; ahora esperan convencer a los muchos pueblos que gobernamos de que nuestro supuesto mal gobierno es la fuente de sus problemas. Semejante idea es francamente absurda, pero el hombre común puede dejarse llevar fácilmente por la esperanza de una vida mejor, y también por la idea de que él también ostenta el poder político. Ahora mismo no podemos hacer mucho más que esperar que estén contentos con nuestra gestión y no se adhieran a sus ideas."
me_tayuan_ferghana.3002.a: "¿Pero alguna vez hemos hecho algo malo?"
me_tayuan_ferghana.3002.a_tt: "Nuestro éxito dependerá de nuestro tratamiento de las muchas culturas de este país."

me_tayuan_ferghana.3003.title: "El [GetOffice('office_master_of_the_guard').GetCulturalName(SCOPE.GetRootScope.GetCountry)] falla"
me_tayuan_ferghana.3003.desc: "Con tono serio, [SCOPE.sCharacter('tay_bdg_plot').GetName] entra a las habitaciones del palacio e informa sumariamente a [ROOT.GetCountry.GetRuler.GetName] que sus esfuerzos por erradicar a los conspiradores con acción directa fracasaron; Se cree que los que podían ejercer el poder real continuaron el complot a pesar de nuestras acciones. De alguna manera, [ROOT.GetCountry.GetRulerTitle] no puede evitar sospechar que él mismo es un conspirador. Por lo que importa, no puede hacer nada al respecto en este momento.\n\nY así, los conspiradores en crecimiento planean sus días; ahora esperan convencer a los muchos pueblos que gobernamos de que nuestro supuesto mal gobierno es la fuente de sus problemas. Semejante idea es francamente absurda, pero el hombre común puede dejarse llevar fácilmente por la esperanza de una vida mejor, y también por la idea de que él también ostenta el poder político. Ahora mismo no podemos hacer mucho más que esperar que estén contentos con nuestra gestión y no se adhieran a sus ideas."
me_tayuan_ferghana.3003.a: "¿Pero alguna vez hemos hecho algo malo?"

me_tayuan_ferghana.3004.title: "El pueblo rechaza la democracia"
me_tayuan_ferghana.3004.desc: "Los heraldos llegan desde todos los rincones del valle y más allá; Los gobernadores, encargados de evaluar si los conspiradores democráticos consiguieron seguidores reales, dicen que en su mayor parte los hombres y mujeres son indiferentes y parecen ignorar los intentos de convencerlos de que apoyen la causa democrática. ¿De qué sirve un movimiento como este si no cuenta con el apoyo de la gente que dice representar?\n[SCOPE.sChar('tay_guvnahh').GetName] entrega personalmente su informe y está muy feliz de revelar que en algunas ciudades de su gobernación, los hombres que estaban pronunciando estos discursos a favor de la democracia fueron expulsados ​​activamente.\n\nAun así, la presión está empezando a aumentar. El [ROOT.GetCountry.GetRulerTitle] ahora se entera de que la conspiración ya está enviando gente a la acción en la capital, mientras busca respaldo extranjero, tratando de involucrar a nuestros vecinos. ¿Quieren destruir nuestro país, someterlo a intereses extranjeros? Primero debemos establecer contactos con estos países para garantizar su confianza."
me_tayuan_ferghana.3004.a: "¡Pide ayuda a nuestros aliados!"
me_tayuan_ferghana.3004.b: "Necesitamos la lealtad de nuestros súbditos, más que nunca."
me_tayuan_ferghana.3004.c: "Confiamos lo suficiente en cada uno de nuestros vecinos."

me_tayuan_ferghana.3005.title: "El pueblo defiende la democracia"
me_tayuan_ferghana.3005.desc: "Los heraldos llegan desde todos los rincones del valle y más allá; los gobernadores, encargados de evaluar si los conspiradores democráticos obtuvieron verdaderos seguidores, dicen que en todas partes la gente aplaude a los hombres supuestamente involucrados en este complot democrático y expresa su apoyo; De esto obtienen esperanzas, porque a los ciudadanos se les promete el poder de decidir su propio destino.\n[SCOPE.sChar('tay_guvnahh').GetName] entrega personalmente su informe y revela con tristeza que en su cargo de gobernador ya hay escondites para los combatientes en caso de que llegue una guerra civil. La situación es agonizante y el aire pesa con el peligro inminente.\n\nEl [ROOT.GetCountry.GetRulerTitle] ahora escucha que la conspiración ya está enviando gente a la acción en la capital, mientras busca respaldo extranjero, tratando de involucrar a nuestros vecinos. ¿Quieren destruir nuestro país, someterlo a intereses extranjeros? Primero debemos establecer contactos con estos países para garantizar su confianza."
me_tayuan_ferghana.3005.a: "¡Pide ayuda a nuestros aliados!"
me_tayuan_ferghana.3005.a_tt: "Confiaremos en la opinión que nuestros #Y aliados#! tienen sobre nosotros para detener a los conspiradores."
me_tayuan_ferghana.3005.b: "Necesitamos la lealtad de nuestros súbditos, más que nunca."
me_tayuan_ferghana.3005.b_tt: "Confiaremos en la opinión de nuestros #Y sujetos#! sobre nosotros para detener a los conspiradores."
me_tayuan_ferghana.3005.c: "Confiamos lo suficiente en cada uno de nuestros vecinos."
me_tayuan_ferghana.3005.c_tt: "Confiaremos en la opinión de nuestros #Y vecinos#! sobre nosotros para detener a los conspiradores."

me_tayuan_ferghana.3006.title: "Contactos extranjeros fallidos"
me_tayuan_ferghana.3006.desc: "Un heraldo llega antes de [ROOT.GetCountry.GetRuler.GetName], y dice que llega de [SCOPE.sCountry('tay_allycountry').GetRuler.GetName]. Pone un paño en el suelo, lo abre y muestra al tribunal cuatro corazones embalsamados. La mayoría de las cortesanas se retuercen con disgusto y miran hacia otro lado. \n\n ''Aquí está la prueba de la amistad entre mi pueblo y el suyo'', dice, mientras proyecta sus brazos hacia la gente que observa, ''estos malvados intentaron que los traicionáramos, mis leales amigos, y cualquiera que desee romper ese vínculo lo hará así.''. [ROOT.GetCountry.GetRuler.GetName] y sus asesores, reunidos más tarde, no estaban seguros de que un acto de lealtad tan radical fuera necesario, pero aun así estaban agradecidos de que la conspiración no hubiera echado raíces en otra parte.\n\nTodavía llegan informes de la inminencia de este complot, que en cualquier momento puede estallar, por lo que debemos esperar haber hecho lo suficiente para detenerlo."
me_tayuan_ferghana.3006.a: "¡Fuerza, mi [ROOT.GetCountry.GetRulerTitle]!"

me_tayuan_ferghana.3007.title: "Los contactos en el extranjero probablemente sean exitosos"
me_tayuan_ferghana.3007.desc: "Hemos enviado repetidamente mensajeros a los países en los que confiábamos, pero en repetidas ocasiones se les ha negado la entrada a esos palacios. ¿Hemos sido tan maldecidos como para estar rodeados de manadas de chacales, royendo la mano que les ofrecía amistad? ¿Deben nuestras tierras ser azotadas por el dolor, es gente brutalizada por algo que no cambiará tanto sus vidas? La mayoría ni siquiera serán ciudadanos...\n\nDe todos modos, cada vez llegan más informes sobre la inminencia de este complot, que en cualquier momento puede estallar, por lo que debemos esperar haber hecho lo suficiente para detenerlo."
me_tayuan_ferghana.3007.a: "¡Fuerza, mi [ROOT.GetCountry.GetRulerTitle]!"

me_tayuan_ferghana.3008.title: "Cae la dinastía [ROOT.GetCountry.GetRuler.GetFamily.GetName]"
me_tayuan_ferghana.3008.desc: "Y así, los rebeldes se acercan al palacio y, en un agonizante giro de los acontecimientos, las puertas se abren para ellos y entran al patio. Ahora, más que nunca, es evidente que todo está perdido.\n\n[ROOT.GetCountry.GetRuler.GetName] así despidió a su guardia personal, ya que ningún hombre necesita morir por una monarquía que ya no existe, y se dirigió al salón del trono. La pancarta de los [ROOT.GetCountry.GetRuler.GetFamily.GetName]#E s#! se balanceaba suavemente con el viento, casi consolando al pobre hombre como una madre, diciéndole que estaría bien. Sus ojos, sin embargo, pintaban un cuadro más sombrío de desesperación. [ROOT.GetCountry.GetRuler.GetSpouse.GetFirstName] lo miró con tristeza, ya que su vida nunca volvería a ser la misma. \n\nPronto los hombres entraron a la sala del trono detrás de él, [SCOPE.sChar('tay_revoltleader').GetName] lo acusaron de lo que fuera y todo terminó."
me_tayuan_ferghana.3008.a: "Sic tránsito gloria mundi."

me_tayuan_ferghana.3009.title: "La democracia está derrotada"
me_tayuan_ferghana.3009.desc: "''¡Alégrate, mi [ROOT.GetCountry.GetRulerTitle]! Cuando llegó el momento de que los rebeldes se reunieran, nuestros hombres ya se habían preparado, abandonaron el cuartel y marcharon hacia ellos. Como se vieron obligados a abandonar la ciudad, la mayor parte de los combates tuvieron lugar justo fuera de los muros de [ROOT.GetCountry.GetCapital.GetName]. Muchos hombres yacen muertos, pero los [ROOT.GetCountry.GetRuler.GetFamily.GetName]#E s#! ¡una vez más triunfan! '', el teniente se fue, y [ROOT.GetCountry.GetRuler.GetSpouse.GetFirstName] lo miró con amor y orgullo, pasándoselos con un beso en la mejilla.\n\nY así comenzó el largo camino de regreso. De ninguna manera esto volvería a suceder, pensó [ROOT.GetCountry.GetRuler.GetFirstName], y seguramente los próximos meses los pasaríamos restringiendo la influencia de los ciudadanos y las ciudades."
me_tayuan_ferghana.3009.a: "¡Nika!"

me_tayuan_ferghana.100.title: "$tayuan_mission_2$"
me_tayuan_ferghana.100.desc: "¡Bienvenido al árbol de misiones #E $tayuan_mission_2$#!! Aunque es posible que ya estés familiarizado con el sistema de puntos culturales de Invictus, en esta misión funciona de forma un poco diferente. Entre los caminos #COLOR:{0.2,0.47,1} Jónico#!, #COLOR:{0.83,0.55,0.6} Ferghani#!, #COLOR:{0.77,0.5,0.09} Huaxia#! y #COLOR:{0.81,0.15,0} Budista#!, solo podrás obtener #E 16 puntos culturales#! en total. Cuando alcance ese número, todas las tareas restantes en el árbol se omitirán y luego podrá realizar la tarea final.\n\nSi desea #E desbloquear un nuevo formable#!, entonces tiene dos formas de hacerlo. La primera forma es obtener #E 11 puntos de cultura#! en #COLOR:{0.2,0.47,1} Jónico#!, #COLOR:{0.83,0.55,0.6} Ferghani#! o #COLOR:{0.77,0.5,0.09} Huaxia#!. (El camino #COLOR:{0.81,0.15,0} budista#! no es completo; solo se puede combinar con otros). La segunda forma es obtener al menos #E 6 puntos de cultura#! en #E 2 culturas diferentes#!.\n\nFinalmente, puedes verificar los #Y puntos actuales#! en cualquier momento colocando el cursor sobre el botón #E Finalizar misión#!."
me_tayuan_ferghana.100.a: "¡Adelante!"

me_tayuan_ferghana.101.title: "El regreso del rey"
me_tayuan_ferghana.101.desc: "Fue una gran sorpresa cuando [SCOPE.sCharacter('traveling_qin_mercenary_ruler').GetName] apareció fuera de las puertas de [ROOT.GetCountry.GetCapital.GetName], ya que unas semanas antes había llegado a la capital la noticia de que el guerrero viajero había sido asesinado en batalla. Y, sin embargo, allí estaba [SCOPE.sCharacter('traveling_qin_mercenary_ruler').GetSheHe], obviamente un poco desgastado, pero vivo.\n\nMirando por encima de las murallas para ver [ROOT.GetCountry.GetRuler.GetHerHim] por sí mismo si este reclamante era realmente el anterior [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetSheHe] gritó '¡Salve, Mistóforo!', lo que provocó que [SCOPE.sCharacter('traveling_qin_mercenary_ruler').GetFirstName] se volviera loco. Risa.\n\n'Así que ya sabes... sí, es cierto que en mis andanzas me han dado el nombre de 'Misthophoros', o mercenario.' Aclarándose [SCOPE.sCharacter('traveling_qin_mercenary_ruler').GetHerHis] la garganta con aire majestuoso, [SCOPE.sCharacter('traveling_qin_mercenary_ruler').GetFirstName] hizo un gesto a los guardias que estaban cerca. 'Pero aquí tengo un nombre diferente... no mercenario, sino [ROOT.GetCountry.GetRulerTitle]. ¡Abre las puertas!'"
me_tayuan_ferghana.101.a: "El trono es tuyo por derecho y cumpliré mis juramentos."
me_tayuan_ferghana.101.b: "¡Bienvenido de nuevo, hermano! ¡Todos saluden al héroe conquistador!"
NICKNAME_SWORD: "Mistóforo"
killing_the_true_ruler_tt: "#T 'Misthophoros'#!, el honorable héroe de cien campañas, será #R asesinado#! esa misma noche por los agentes del Gobernante."

me_tayuan_ferghana.001.title: "Los caballos celestiales"
me_tayuan_ferghana.001.desc: "Cuando las noticias llegan a [ROOT.GetCountry.GetCapital.GetName], normalmente ya es demasiado tarde. Innumerables territorios y provincias ya han caído en manos del enemigo, con muchas de nuestras ciudades, aldeas, pueblos y templos incendiados y nuestra gente masacrada. Nuestros espías confirman que un enorme ejército de Huaxia marcha hacia nosotros, reunido con la única intención de llegar al Palacio Real en el corazón de la ciudad y quemarlo hasta los cimientos. Las rutas comerciales que alguna vez fueron bulliciosas prácticamente se han secado, y solo los comerciantes más locos y desesperados se atreven a aventurarse hacia el Este.\n\nLos rumores que [ROOT.GetCountry.GetRuler.GetName] ha escuchado casi han vuelto loco de miedo a [ROOT.GetCountry.GetRuler.GetHerHim]; informes de langostas saliendo de la #E Puerta de Jade#!, y de polvo y arena que se ven bailando alejándose de muchas murallas de la ciudad; incluso la tierra misma está tratando de huir de lo que se avecina.\n\nEn algún lugar allí, en las tierras en las que hemos perdido el control, un tal #E Li Guangli#!, un hombre que se dice es hermano de la concubina favorita del Emperador, Lleva detrás de él un ejército mayor que muchos chiliads, algo así como un orden nunca visto aquí. Todos son rufianes, reunidos en sombrías regiones fronterizas lejos del mundo que conocemos, y estos saqueadores están más que dispuestos a destruir todo lo que amamos y apreciamos. Quieren convertirnos a nosotros, una gran cultura, en cerdos sumisos."
me_tayuan_ferghana.001.a: "¡Es hora de enfrentarnos a la gran Huaxia!"
me_tayuan_ferghana.001.a_tt: "La #COLOR:{0.77,0.5,0.09} Guerra de los Caballos Celestiales#! ha comenzado."

me_tayuan_ferghana.202.title: "Los caballos celestiales"
me_tayuan_ferghana.202.desc: "El sol apenas se había asomado sobre los tejados de [ROOT.GetCountry.GetCapital.GetName] cuando los mensajeros aparecieron por primera vez fuera de las puertas de la ciudad, y las noticias que trajeron con ellos hicieron que la casa [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] entrara en pánico. En un par de horas, una #E Embajada Imperial#! del #E Imperio Oriental#! llegaría, y antes de que [ROOT.GetCountry.GetRuler.GetName] sintiera que [ROOT.GetCountry.GetRuler.GetSheHe] pudiera recuperar el aliento [ROOT.GetCountry.GetRuler.GetHerHis], [ROOT.GetCountry.GetRuler.GetSheHe] estaba parado en el palacio real, brindando cortesías y saludos a un diplomático llamado [SCOPE.sCharacter('chineseherald').GetName].\n\n'#E El Emperador [SCOPE.sCharacter('chinese_emperor_character_scope').GetName]#! es un gran admirador de los caballos de este valle, y le desagrada que usted rechace al Imperio Oriental los caballos por los que desea pagar.' [SCOPE.sCharacter('chineseherald').GetFirstName] dejó escapar un largo y doloroso suspiro, uno cargado de significado mortal, luego continuó hablando en voz baja y mesurada mientras miraba alrededor de la habitación con disgusto.\n\n\"Pero el Emperador [SCOPE.sCharacter('chinese_emperor_character_scope').GetFirstName] es misericordioso y espera que cualquier situación desagradable con las naciones bárbaras se resuelva de la manera habitual\". El heraldo aplaudió, haciendo que sus asistentes salieran corriendo. \"Pero debo advertirte: si los negocios no se manejan a su satisfacción, estas tierras conocerán su ira\". [SCOPE.sCharacter('chineseherald').GetFirstName] luego hizo un gesto hacia los esclavos, quienes arrastraron detrás de ellos un cofre lleno de oro, así como una réplica de tamaño natural de un caballo de Ferghana. 'Aquí están los regalos que el emperador [SCOPE.sCharacter('chinese_emperor_character_scope').GetFirstName] está dispuesto a ofrecer. ¿Los aceptas, [ROOT.GetCountry.GetRuler.GetFirstName]?'\n\nEl Consejo de [ROOT.GetCountry.GetName] fingió hablar durante un rato, pero todos sabían que no podían suministrar a los orientales los caballos que deseaban. Para cumplir con la demanda del Emperador, tendríamos que reducir el tamaño de nuestros propios ejércitos y dependemos de nuestra caballería para protegernos contra nuestros numerosos enemigos. Sabiendo que esta negativa no sería recibida felizmente, [SCOPE.sCharacter('tay_familyhead').GetName] dio un paso adelante, con el rostro tenso por el estrés. 'No podemos ayudarte, amigo, ya que exiges muchos miles de caballos a un país que sólo tiene cientos. Si hacemos lo que nos pide, entonces también podríamos venderle todo nuestro país. Por favor, díselo al Hijo de...\n\n[SCOPE.sCharacter('chineseherald').GetFirstName] golpeó la mesa con la mano y se levantó con el rostro enrojecido por la ira. ¡Quieres conocer su fuego! ¡Malditos vosotros y los cerdos que os engendraron, mendigos embarrados de estiércol! Volviendo atrás, aplastó el caballo dorado con un mazo, rompiéndolo en decenas de miles de pedazos, y el séquito abandonó las cámaras de inmediato. Al cabo de una hora, habían huido [ROOT.GetCountry.GetCapital.GetName]; su furia era imposible de expresar con palabras y, tras su repentina aparición y desaparición, una nube de temor existencial se estaba apoderando del palacio.\n\nLos nobles de [ROOT.GetCountry.GetName], indignados por el desprecio del enviado y su trato irrespetuoso hacia su [ROOT.GetCountry.GetRulerTitle], reunieron silenciosamente a sus hombres y cabalgaron con fuerza tras los diplomáticos de Huaxia, y los orientales fueron asesinados sin ceremonias en algún lugar de las montañas cerca de [GetProvince('(int32)6736').GetName]. Como era de esperar, [ROOT.GetCountry.GetRuler.GetFirstName] no se alegró de enterarse del asesinato de los mensajeros.\n\n\"Una vez que el Emperador se entere de esto, seguramente vendrá por nosotros... por mí\". El [ROOT.GetCountry.GetRulerTitle], después de ver cómo los acontecimientos se salen de control, [ROOT.GetCountry.GetRuler.GetHerHis] ahora está consumido por la inquietud."
me_tayuan_ferghana.202.a: "Preparad las defensas y que los dioses se apiaden de nosotros..."
me_tayuan_ferghana.202tt: "Los ejércitos del #T Imperio Oriental#! están en marcha..."

