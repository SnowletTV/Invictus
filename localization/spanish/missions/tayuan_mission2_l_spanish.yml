l_spanish:

tayuan_mission_2: "Fuera de Fergana"
tayuan_mission_2_DESCRIPTION: "Hay muchos mundos más allá de este valle, y muchos de esos mundos compiten entre sí por muchas grandes cosas mucho más allá de estas montañas; palacios, ciudades, minas, ríos y riquezas sobre todo eso.\n\nMientras hemos luchado por nuestra dignidad para luego investirnos de poder, las grandezas de esos lugares lejanos han llegado a nuestros hogares, trayendo religión, cultura, riqueza y comercio a un lugar hasta ahora ignominiosamente ignorado. Nosotros, los #COLOR:{0.2,0.47,1} jonios#! asentados en este nuevo hogar en el valle, todavía somos muy pocos y estamos lejos de las extensiones que hemos conquistado, y los hijos de la primera generación de nuestro dominio sobre estas tierras ni siquiera son mayores de edad todavía."
tayuan_mission_2_CRITERIA_DESCRIPTION: "Nos hemos visto obligados a interactuar con influencias del nuevo y misterioso #COLOR:{0.69,0.49,0} Oriente#!, de los #COLOR:{0.83,0.55,0.6} bactrianos#! nativos de nuestras tierras, o de los #COLOR:{0.81,0.15,0} budistas#! más allá de las montañas del sur. Decide qué camino seguir hacia el valle de [GetProvince('(int32)6732').GetArea.GetName]."
tayuan_mission_2_BUTTON_TOOLTIP: "¡Y así todos los lados comienzan el espectáculo!"
tayuan_mission_2_BUTTON_DETAILS: ""


