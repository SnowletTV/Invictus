# Mil Trads (unlockable)
qin_path_1: "Carniceros de hombres"
qin_path_1_desc: "Bai Qi fue un general importante, un general importante del período de los Estados Combatientes, un gran guerrero que se ganó la inmortalidad luchando por Qin. A lo largo de muchas campañas, el brutal líder se ganó el apodo de \"Carnicero de hombres\", y aquellos que emulan sus tácticas en la batalla son desalmados."
qin_path_2: "'Reflexiones sobre la batalla de Changping'"
qin_path_2_desc: "Lian Po fue un importante general del período de los Reinos Combatientes, un gran guerrero que se ganó la inmortalidad luchando por Zhao. Su tratado militar, 'Reflexiones sobre la batalla de Changping', analiza en profundidad el importante conflicto y se dice que es un compendio lleno de invaluables estrategias militares."
qin_path_3: "'Tácticas contra los Xiongnu'"
qin_path_3_desc: "Li Mu fue un importante general del período de los Reinos Combatientes, un gran guerrero que se ganó la inmortalidad luchando por Zhao. El texto militar escrito por Li Mu originalmente no tenía nombre, pero llegó a ser conocido con el título 'Tácticas contra los Xiongnu'.\n\nEste manual no pierde el tiempo con un lenguaje florido, sino que está escrito en el lenguaje simple del soldado, brindando consejos prácticos para sobrevivir contra los mortales jinetes de la estepa."
qin_path_4: "Enseñanzas de Wang Jian"
qin_path_4_desc: "Wang Jian fue un importante general del período de los Reinos Combatientes, un gran guerrero que se ganó la inmortalidad luchando por Qin y subyugando a innumerables enemigos en su nombre. Tomadores de ciudades y destructores de ejércitos, aquellos que emulan las enseñanzas de Wang Jian tienen la seguridad de seguir los pasos del venerable viejo maestro, un hombre que enfrentó una violencia insondable pero que vivió para contarlo."

#Treasures 

i_ching:0 "El I Ching"
i_ching_desc:0 "Un antiguo texto de adivinación chino con una serie de comentarios filosóficos también. Se encuentra entre los clásicos chinos más antiguos, escrito por primera vez en el siglo IX a. C. \n \n Se utiliza para una forma china de cleromancia conocida como adivinación del I Ching, en la que se manipulan manojos de tallos de milenrama para producir conjuntos de seis números aparentemente aleatorios que van del 6 al 9. Cada uno de los 64 conjuntos posibles corresponde a un hexagrama, que se puede buscar en el I Ching."

four_five_claa:0 "Los cuatro libros y los cinco clásicos"
four_five_claa_desc:0 "Los Cinco Clásicos (wujing) y los Cuatro Libros (si shu) crean colectivamente la base del confucianismo. Los Cinco Clásicos y los Cuatro Libros fueron la base del examen civil en la China imperial y pueden considerarse el canon confuciano. Los Cinco Clásicos constan del Libro de Odas, el Libro de Documentos, el Libro de Cambios, el Libro de Ritos y los Anales de Primavera y Otoño. Los Cuatro Libros se componen de la Doctrina del Medio, la Gran Saberduría, Mencio y las Analectas."

art_of_war:0 "El arte de la guerra"
art_of_war_desc:0 "Escrito por el general Wu Sun Tzu en el siglo V a. C., este tratado sobre la guerra no necesita presentación, siendo uno de los libros chinos más conocidos del mundo. Es una explicación y un análisis detallados del ejército chino del siglo V a. C., desde las armas, las condiciones ambientales y la estrategia hasta el rango y la disciplina. Sun también destacó la importancia de los agentes de inteligencia y el espionaje para el esfuerzo bélico."

abhidharma_pitaka_treasure: "Abhidharma Pitaka"
abhidharma_pitaka_treasure_desc: "Los siete textos canónicos de la Escuela Sarvastivada, traducidos y comentados por sabios budistas."

chinese_jewelry: "Collar de jade"
chinese_jewelry_desc: "Este collar fue hecho en las Tierras del Hijo del Cielo y, por lo tanto, es un bien escaso en nuestro reino. Usarlo hace que las damas nobles se sonrojen de envidia, pero las atrae de todos modos, con la esperanza de que se les conceda permiso para usar esta obra maestra de jade."
chinese_weapon: "Espada de un general Qin"
chinese_weapon_desc: "Esta espada fue hecha en las Tierras del Hijo del Cielo y, por lo tanto, es un bien poco común en nuestro reino. Muchos guerreros han buscado servicio en los ejércitos del Imperio Oriental con la esperanza de que se les conceda este artefacto legendario, ya que una vez lo portó un poderoso general."

ferghani_earthworks_mod: "Fortificaciones fortalecidas"

# Wonders

quva_stupa_gw:0 "La Gran Estupa del Monasterio de Quva"
gw_effect_quva_stupa:0 "La Gran Estupa del Monasterio de Quva"
gw_effect_quva_stupa_desc:0 "El Monasterio de Quva, en Ferghana, es un centro de budismo en el norte y difunde sus enseñanzas tanto en el valle como a lo largo de la Ruta de la Seda. Alberga esculturas monumentales de Buda, el panteón budista y otras deidades sincréticas. Su característica definitoria es la Gran Estupa, de enorme tamaño y centro para los peregrinos al valle."
