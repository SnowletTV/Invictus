l_spanish:

tayuan_mission_1: "Allí, solo entre los jóvenes"
tayuan_mission_1_DESCRIPTION: "Mucho antes de que los príncipes novatos de lo que una vez llamamos hogar pusieran un pie en estas llanuras, ya nos habían llevado al exilio aquí. Llevábamos mucho tiempo mirando hacia adentro, frenados por nuestra soledad, pero el sometimiento de la llanura del sur por esos ingenuos azotadores del destino nos ha obligado a enfrentarlos o morir."
tayuan_mission_1_CRITERIA_DESCRIPTION: "Esta misión se completará una vez que nos familiaricemos con la nueva situación en la zona."
tayuan_mission_1_BUTTON_TOOLTIP: "¡Este valle es nuestro!"
tayuan_mission_1_BUTTON_DETAILS: ""

# Opinions

tayuan_amyopinion: "Amistad real"
tayuan_ants: "Carneros advenedizos"

# Tooltips

amyrgia_claims_tt:0 "Amyrgia ha adquirido derechos sobre todo Tayuan."
great_ionians_tt:0 "Consideraremos intentar buscar y convencer a los colonos jonios del imperio de Alejandro; es una tarea que requerirá enormes sumas de dinero, pero que puede traer enormes recompensas."
tayuan_kindness_tt:0 "Nuestras recompensas #G variarán#! dependiendo de cómo completemos la misión."
tayuan_great_investment_tt:0 "¡Tendremos #G enormes#! posibilidades de tener éxito!"
tayuan_big_investment_tt:0 "Tendremos una #Y media#! posibilidades de tener éxito."
tayuan_meh_investment_tt:0 "#R No tendremos#! buenas posibilidades de tener éxito."
dawan_city_tt:0 "Instalaremos a los miles de recién llegados a #E Dawan#!."
sogdian_tay_tt:0 "Debemos ser dueños de todas las provincias de @[GetCountry('SOG').GetFlag]!Sogdia."
tayuan_sogd_tt:0 "¡Fortificaremos el valle y obtendremos derechos sobre @[GetCountry('SOG').GetFlag]! #E Sogdía#!."
tayuan_sakawar_tt:0 "¡Debemos estar en guerra con @[GetCountry('WUS').GetFlag]! #E Amirgia#! o @[GetCountry('SHU').GetFlag]! #E Shule#! y tener al menos #R 20 Warscore#! contra ellos."
spreadvalley_tt:0 "Más de quince pops jónicos aparecerán por todo el valle."
ferghanan_office_tt:0 "Debe haber un personaje de la cultura #Y [GetCulture('tayuan').GetName]#! que ocupe un cargo en nuestro gobierno."
lochos_legion_tt:0 "Nuestra legión local debe tener 5 unidades de @spearmen! lanceros y 3 @horse_archers! arqueros a caballo o 3 @heavy_cavalry! unidades de caballería pesada."
tayuan_polises_tt:0 "Cada territorio en la provincia de [GetProvince('(int32)6704').GetArea.GetName] obtendrá #Y Gobierno de las Polises#!, lo que otorga #G +0,3%#! Cambio de civilización mensual y #R +0,4#! Disturbios."
tayuan_cityrequire_tt:0 "Al menos 3 ciudades en el valle de [GetProvince('(int32)6704').GetArea.GetName] deben tener un $forum_building$."
macedonian_slaves_tt:0 "Los [GetCulture('macedonian').GetName|G] señores de la guerra y bandidos capturados aparecerán por todo nuestro país como @slaves! #R esclavos.#!"
tayuan_art_tt:0 "Un artista producirá una obra de arte para inspirarnos."
tayuanexplorershome_tt:0 "Los hombres enviados a explorar nuestros alrededores regresarán a casa como un ejército en nuestra capital."

# Modifiers

tayuan_gulka_pass: "Los fuertes de Gulka"
MODIFIER_STATE_FORT_LIMIT: "Límite de fuerte local"
tayuan_citiesoftheconquerors: "Ciudades de los conquistadores"
desc_tayuan_citiesoftheconquerors: "Fundadas por grandes conquistadores de la antigüedad, estas ciudades todavía se benefician de su influencia."

tayuan_silkprod: "Granjas de seda más grandes"
tayuan_breadbasket: "Usando el suelo"
tayuantraders: "Comerciantes seductores"
tayuan_sakan_cav: "Experimentando con la caballería jónica-sakana"
sogdian_ion_cav: "Unidades de caballería sogdiana-jónica"
sogdian_horses: "Adoptando caballos sogdianos"
sogdian_conquered: "Sogdia vencida"
ferghanan_happiness: "Derechos de los miembros de la tribu Ferghani"
tayuan_manpower: "Primacía Ferghani"
tayuan_ranks: "Forzarnos a entrar"
tayuan_polises: "Gobierno de las polis"
desc_tayuan_polises: "En las ciudades de Ferghana la estructura política de la polis se conserva por debajo de la monarquía. Esto hace que todas las ciudades sean más prósperas y rebeldes."
tayuan_valley_cap_mod: "Centro de Comercio Regional"

tayuan_valley: "El valle de Ferganá"
desc_tayuan_valley: "El hospitalario valle de Ferghana se encuentra mucho más al norte de cualquier otro lugar que permita que la vida prospere de esta manera. Entre las montañas que lo encierran opera un bullicio de personas que se benefician mutuamente."

TAYUAN_EXPLORERS: "Los hombres de Perseo"
sogdian_champion: "Campeón de los sogdianos"

#Treasures 
copper_tayuan_altar: "Altar de Nueva Jonia por Fileia de Throana"
copper_tayuan_altar_desc: "Encargado a #E Fileia de Troana#! para celebrar la presencia de los jonios en el valle de Ferghana.\n\nEs un altar enorme, hecho de cobre macizo, con detalles en el lateral que representan nuestros nuevos hogares en el valle de Ferghana y nuestra gente."

# Tasks

tayuan_task_start: "De Bóreas"
tayuan_task_start_DESC: "Debemos organizar expediciones para comprender mejor las entidades políticas alrededor del valle. Primero, enviaremos a nuestros hombres a los dominios del gélido viento del norte - #COLOR:{0.8,1,1} Bóreas#!.\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"

tayuan_task_1: "Por Céfiros"
tayuan_task_1_DESC: "Dulces notas suenan en la canción de #COLOR:{0,0.64,0} Zephyros#!. El viento del oeste es tranquilo y bendito entre sus hermanos. Así es para nosotros, ya que en el oeste este valle se abre al mundo.\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

tayuan_task_2: "Por euros"
tayuan_task_2_DESC: "#COLOR:{0.39,0.21,0.81} Euros#!, el viento del este, siempre ha sido predicho como portador de malos augurios. Debemos correr el riesgo de cambiar nuestro destino y explorar esas tierras misteriosas para asegurar nuestra supervivencia.\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"

tayuan_task_3: "a notos"
tayuan_task_3_DESC: "Las tormentas viajan por este mundo impulsadas por el dios #COLOR:{0.89,0.05,0} Notos#!, el viento del sur. Definitivamente nos ha traído una gran tormenta, ya que los macedonios se han puesto justo a nuestras puertas.\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"

tayuan_task_4: "Alexandros kaí Kýros"
tayuan_task_4_DESC: "Dos grandes conquistadores han dejado sus huellas en esta tierra: #T Alexandros#! el Mega-Basileus macedonio que conquistó el mundo, y #T Kýros#! (o Ciro el Grande), que, en su tiempo, también conquistó el mundo.\n\nAmbos fundaron grandes ciudades en este valle, tanto [GetProvince('(int32)6704').GetName|Y] como [GetProvince('(int32)6703').GetName|Y] son las joyas de nuestras tierras. Debemos esforzarnos por honrar sus nombres y embellecerlos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"

tayuan_task_5: "Los compañeros perdidos"
tayuan_task_5_DESC: "Muchos #Y [GetCulture('ionian').GetName]#! hombres y mujeres surgieron en Asia cuando los ejércitos macedonios los liberaron de los persas. Ya sea como comerciantes, en los ejércitos o como colonos, su éxtasis los llevó a tierras desconocidas y con diferentes fortunas.\n\nMuchos ahora se encuentran dispersos y sin propósito por el antiguo imperio. Necesitamos desesperadamente su ayuda y ellos la nuestra.\n\nSe presentan tres opciones: una de #G 200#! @gold!, donde el éxito está prácticamente garantizado, una de #Y 100#! @gold! donde el éxito es ligeramente más probable que el fracaso, y una de #R 30#! @gold!, donde el éxito es muy poco probable.\n\n\n\n\n\n\n\n\n\n\n@greek_mil20!"

tayuan_task_6: "De pie sobre el paso de Gulka"
tayuan_task_6_DESC: "Acunadas como estamos por el valle, las montañas todavía poseen muchos pasos que pueden utilizar aquellos que quieran arruinarnos.  Fortificar [GetProvince('(int32)6773').GetName|Y], una puerta de entrada clave entre la mayoría de los pasos del sur, nos proporcionará una gran seguridad.\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"

tayuan_task_7: "Apto para vivir"
tayuan_task_7_DESC: "Debemos enseñar a nuestras plantas todas las peculiaridades de esta tierra extraña, para que no caminemos ni produzcamos en suelo desconocido. La instalación de granjas y plantaciones contribuirá en gran medida a que este lugar sea habitable.\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"

tayuan_task_8: "Hasta luego, Hestia"
tayuan_task_8_DESC: "No hay duda de que no había otra opción que resistir y repeler a nuestros enemigos; Puede que no haya sido lo que éramos como jonios, pero es lo que somos ahora. Este valle, nuestro nuevo hogar, será la envidia del mundo, y cualquiera que se atreva a tocarlo sólo sentirá desesperación. Estamos en Ferghana.\n\n\n\n\n\n\n\n\n\n\n@greek_mil5!"

tayuan_task_9: "Un dolor sogdiano"
tayuan_task_9_DESC: "No tenemos ningún problema con ellos, pero las circunstancias nos han obligado a enfrentarnos a los #Y [GetCulture('sogdian').GetName]#!. Quizás podamos, una vez victoriosos, encontrar en nuestro corazón el deseo de mostrarles bondad.\n\n\n\n\n\n\n\n\n\n\n@persia_mil1!"

tayuan_task_10: "Engañar a los bactrianos"
tayuan_task_10_DESC: "Nuestro #G Epiproxenos#!, siempre el maestro de la diplomacia, ha ideado un plan astuto: con una postura a la antigua usanza jónica, como comerciantes y hombres de arte, podemos engañar fácilmente al lobo bactriano del sur diciéndole que no somos una amenaza y que deseamos ser meros comerciantes, y entonces podremos penetrar profundamente en su tierras.\n\n\n\n\n\n\n\n\n\n\n@italic_mil32!"

tayuan_task_11: "Golpea a los Sakans"
tayuan_task_11_DESC: "Los odiosos jinetes #Y Sakan#! pisotean nuestra hierba juvenil siempre intentando abusar de nosotros, pero una victoria rápida y decisiva contra ellos en la batalla seguramente les hará respetar. Nosotros.\n\n\n\n\n\n\n\n\n\n\n@persia_mil16!"

tayuan_task_12: "Una estrella guía"
tayuan_task_12_DESC: "En [GetProvince('(int32)6737').GetName|Y] vive un artista famoso, se dice que es un renombrado metalúrgico. Podríamos encargar una obra de arte para celebrar nuestros nuevos hogares en el valle e inspirar los corazones de todos aquellos que quieran venir aquí también.\n\n\n\n\n\n\n\n\n\n\n@india_mil6!"

tayuan_task_13: "Saludo a los [GetCulture('tayuan').GetName]#E s#!"
tayuan_task_13_DESC: "Las tribus nativas del valle se niegan a que nos hagan juguetes con los que jugar; estos son sus hogares originales, no los nuestros. Exigen derechos especiales por encima de los demás, oferta que prácticamente nos vemos obligados a aceptar. Seguramente otras culturas se enojarán.\n\n\n\n\n\n\n\n\n\n\n@persia_mil9!"

tayuan_task_14: "Lóchos De Los Jaxartes"
tayuan_task_14_DESC: "Muchos piden que creemos una estructura militar más organizada, con el entrenamiento adecuado, para que podamos competir con ejércitos más profesionales.\n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"

tayuan_task_15: "Las nuevas poleis"
tayuan_task_15_DESC: "Si bien para el ojo inexperto podría parecer que ahora vivimos en una monarquía, debajo de la superficie, nuestras estructuras de gobierno convencionales de las poleis todavía están en su lugar y funcionan unas con otras. [ROOT.GetCountry.GetRuler.GetName|Y] debe asumir su papel de mediador entre ellos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"

tayuan_task_16: "Por las llanuras abiertas"
tayuan_task_16_DESC: "Después de estas primeras pruebas de fuerza, nuestro ejército está sediento de un segundo desafío a su valor. Uno de ellos es cabalgar contra los temibles jinetes del este, ya que se encuentran entre los enemigos más extraños e intimidantes a los que nos enfrentamos aquí.\n\n\n\n\n\n\n\n\n\n\n@persia_mil14!"


# Events

me_tayuan.1.title: "Allí, solo entre los jóvenes"
me_tayuan.1.desc: "No se llega a este valle por casualidad; acunado por montañas por todos lados menos uno, está atravesado por dos ríos que con el tiempo desembocan en el gran Jaxartes, el gran límite norte de [GetCharacter('(int32)39').GetPraenomen], que luego corre hacia un lugar desconocido. Este lugar es lo más lejos que se atrevieron a llegar tanto los persas como los macedonios, la última ermita antes de un gran desierto.\n\nY hemos sido relegados aquí. De las bellas y amadas ciudades de [GetProvince('(int32)1808').GetArea.GetName], tomadas, por la fuerza, por los hijos persas del mal por nuestra osadía de desafiar su esclavitud. Muchos todavía lloran suavemente la #E Revuelta Jónica#!, nuestro gran grito por la libertad. Puede que este sea un valle fértil en medio de la desolación, pero cuando los vientos azotan y la nieve del invierno congela el suelo, la compensación es escasa. A diferencia de los aprovechadores del sur, a nosotros nos sacaron por la fuerza de casa, a miles de estadios de distancia. Es muy diferente."
me_tayuan.1.a: "No hay vuelta atrás. Debemos profundizar y luchar."

me_tayuan.2.title: "$tayuan_task_start$"
me_tayuan.2.desc: "Hemos reunido una expedición al mando de un capitán veterano, de [GetProvince('(int32)6703').GetName], llamado [SCOPE.sChar('tayuan_explorer').GetName]. [SCOPE.sChar('tayuan_explorer').GetFirstName] y sus hombres, bajo la elegante apariencia de simples escribas y comerciantes enviados para establecer contacto, se comunicarán con los pueblos que nos rodean e informarán lo que han reunido en estos países.\n\nHabiendo recibido la bendición de [ROOT.GetCountry.GetRuler.GetName], y con los sacrificios hechos a #COLOR:{1,1,0.16} Apolo#!, [SCOPE.sChar('tayuan_explorer').GetPraenomen] entró en el patio del templo para inspeccionar su hombres. Era un día frío y brumoso. Durante mucho tiempo había esperado explorar estas tierras salvajes alrededor de las ciudades amuralladas que habitaban los jonios, ahora llegó el momento de hacerlo y de servir a la gente dentro de ellas al hacerlo.\n\nPrimero, cabalgarían hacia el furioso y áspero viento del norte, del dios #COLOR:{0.8,1,1} Bóreas#!. Él sonrió."
me_tayuan.2.a: "Un día de orgullo para él."

me_tayuan.3.title: "Los hombres extraños"
me_tayuan.3.desc: "Más allá de las duras montañas blancas de [GetProvince('(int32)6788').GetName] y [GetProvince('(int32)6787').GetName], siempre entrando en contacto con los miembros de las tribus locales [GetCulture('sakan').GetCultureGroup.GetName] (siendo estos grupos dispersos sin ninguna organización o importancia real), nuestros enviados finalmente llegaron a [GetCountry('WUS').GetName]. Al no reconocer ninguna diferencia real entre el grupo anterior de miembros de la tribu y estos, continuaron avanzando hacia el norte, siendo luego perseguidos durante cierta distancia por una patrulla del señor local. Luego fueron conducidos a su corte, en [GetProvince('(int32)8751').GetName].\n\nDentro de una tienda extrañamente grande, #E [SCOPE.sChar('tayuan_explorer').GetPraenomen]#! fue presentado a [SCOPE.sChar('amyrgian_ruler').GetName], como un enviado de los #E griegos#! en el valle más allá. [SCOPE.sChar('amyrgian_ruler').GetPraenomen] sonrió como si estuviera muy entretenido por esto. ¿Por qué haría eso? Y toda la gente en la habitación era muy extraña, con pelos revueltos, sombreros extraños, ropa divertida... Aún así, [SCOPE.sChar('tayuan_explorer').GetPraenomen] tenía que encontrar una manera de intentar agradarles."
me_tayuan.3.a: "Hablamos de amistad entre nuestros reyes."
me_tayuan.3.b: "Hablando de nuestro gran poder militar."

me_tayuan.4.title: "Indiferencia sakan"
me_tayuan.4.desc: "''Y como tal, no buscamos nada más que respeto entre nuestras tierras, para no causar la destrucción y la muerte de nuestros pueblos.'' #E [SCOPE.sChar('tayuan_explorer').GetPraenomen]#! terminó de hablar y miró al traductor, y luego, con el tiempo, al rey nómada. ''Los guerreros Sakan, bendecidos por los tesoros dorados del cielo, llevan la guerra a donde quieran, incluido el hogar de vuestro ignorante rey. Este es el camino de nuestras llanuras, y el carnero loco que se hace llamar rey de uno de nuestros valles infinitos debería saber que no debe desafiar esto.''\n\nPor muy amenazador que pareciera el mensaje, [SCOPE.sChar('tayuan_explorer').GetPraenomen] fue llevado a su tienda en paz. Sentándose, todavía incrédulo de la respuesta, se mostró aún más incrédulo cuando fue invitado a cenar con la corte. En su mente, sólo una cosa podía explicar lo que acababa de vivir: para estos nómadas, [ROOT.GetCountry.GetName] era sólo una hormiga pismire, una idea de último momento. Estaba demasiado furioso para cenar con estos bárbaros, así que partió de inmediato a casa."
me_tayuan.4.a: "Hay poderes más grandes aquí."

me_tayuan.5.title: "$tayuan_task_1$"
me_tayuan.5.desc: "Los [GetCulture('sogdian').GetName]#E s#! tienen, al menos, una (especie de) similitud con nosotros: son indigentes de su tierra natal en [GetProvince('(int32)6711').GetArea.GetName]. Esto no es del todo, ya que todavía conservan algunas de sus tierras originales; aún así, vale la pena señalar que anteriormente estos eran los más salvajes entre ellos, ya que se encuentran mucho más allá de la seguridad del río #E Jaxartes#!, en la estepa y el desierto salvajes.\n\nEl viento del sur susurró su comodidad, pero eso, a su vez, es la razón por la que #COLOR:{0,0.64,0} Zephyros#!, dios del viento del oeste, nos sonríe. Sus tierras pueden ser en su mayoría áridas, pero siguen siendo, con diferencia, nuestro vecino más débil.\n\nLos [GetCulture('sogdian').GetName]#E s#!, cuando [SCOPE.sChar('tayuan_explorer').GetPraenomen] les dijeron de dónde era, hicieron que su pura curiosidad por nuestra extraña complexión devolviera su inocencia en un resentimiento visible: seguramente prevén una rivalidad entre nosotros. Poco después de empezar a salir de su país, [SCOPE.sChar('tayuan_explorer').GetPraenomen] fue, una vez más, perseguido por una patrulla local; y esta vez no parecía que lo llevarían hasta su rey."
me_tayuan.5.a: "Un espectáculo triste de ver."

me_tayuan.6.title: "$tayuan_task_2$"
me_tayuan.6.desc: "Muchos oráculos se ganan lo que les corresponde advirtiendo del viento del este que sopla el dios #COLOR:{0.39,0.21,0.89} Euros#!, y ciertamente hemos perdido algo de sueño debido a ello. Mirando hacia abajo desde el valle hacia las montañas de arenisca que marcan su inicio, [SCOPE.sChar('tayuan_explorer').GetPraenomen] realmente no tiene idea de lo que hay más allá, salvo por algunos detestables miembros de la tribu Sakan de los que ya nos habían hablado. ¿Qué pasa si hay un imperio distante más allá y una enorme masa de hombres listos para cruzar a nuestros hogares?\n\nTales son las preocupaciones en la vida de un explorador; Claramente no es para todos. El tren de equipajes ya lo había adelantado en el camino hacia los pasos, así que se apresuró a seguirlo."
me_tayuan.6.a: "¿Qué podría venir?"

me_tayuan.7.title: "$tayuan_task_3$"
me_tayuan.7.desc: "[SCOPE.sChar('tayuan_explorer').GetPraenomen] suspiró mientras partía de su [GetProvince('(int32)6703').GetName] hacia las tierras de [GetCountry('BAC').GetName]. Esta lamentable amalgama de señores de la guerra, especuladores y colonos ha sido traída por el dios del viento del sur, #COLOR:{0.89,0.05,0} Notos#!, directamente a nuestra puerta. Es, para bien o para mal, la mayor amenaza a la que nos enfrentamos: un enorme ejército sediento de sangre y botín. [GetCharacter('(int32)24').GetPraenomen], su señor supremo, debería controlarlos, pero después de hablar con un viejo nativo [GetCulture('bactrian').GetCultureGroup.GetName]... compañero en [GetProvince('(int32)6697').GetName] (al que conocía desde antes de la invasión), [SCOPE.sChar('tayuan_explorer').GetPraenomen] rápidamente se da cuenta de que esto es más que nada una ilusión, y que la enorme satrapía se liberará muy pronto. Ella dice que la corte se está preparando para la guerra, abundan los rumores sobre una carta mordaz enviada a la corte babilónica.\nAdemás, la población, en su mayoría nativa bactriana, está siendo reprimida violentamente en todas partes para instalar la nueva máquina macedonia, y ejércitos rebeldes saquean los campos y piden sangre a sus [GetCountry('BAC').GetRuler.GetTitle].\n\nSeguramente surgirán grandes problemas desde el sur. Por ahora, nuestros exploradores regresarán a casa."
me_tayuan.7.a: "Para que no nos dejemos llevar."

me_tayuan.8.title: "$tayuan_task_4$"
me_tayuan.8.desc: "Estas dos ciudades nos parecen nuestros dos amores, secretos para todos los demás que estamos empezando a apreciar profundamente. Al estar tan cerca uno del otro, [SCOPE.sChar('tayuancivman').GetName] ha comenzado a idear planes para coordinar esfuerzos entre ambos, aliviando la carga administrativa sobre ellos. Se han construido infraestructuras en las colinas entre ambas: las aguas ahora se extienden de una a otra, desde un brazo desviado del #E río Jaxartes#!, y ambas ciudades comparten entre sí sus bibliotecas, sus ciudades y, en definitiva, sus culturas.\n\nSeguramente, aquellos dos conquistadores del pasado ahora nos miran con bondad desde el más allá, porque somos dignos custodios de sus proyectos más íntimos y menos conocidos."
me_tayuan.8.a: "Un esfuerzo enriquecedor."

me_tayuan.9.title: "$tayuan_task_5$"
me_tayuan.9.desc: "[SCOPE.sChar('tayuan_steward').GetName] se sentó y comenzó a explicar a todos en la mesa todos los gastos necesarios para ejecutar adecuadamente el plan de convencer a los [GetCulture('ionian').GetName] colonos de todo el antiguo Imperio macedonio para que abandonaran sus asentamientos y vinieran a nuestro valle.\n\nNo mucho tiempo después del discurso, [ROOT.GetCountry.GetRuler.GetFirstName] comenzó a sentirse incómodo ante la magnitud de este proyecto. Mirando desde el palacio a las calles de [ROOT.GetCountry.GetCapital.GetName], sintió que era lo correcto, pero las sumas de dinero en discusión pesaban en su mente casi tanto como la comida del banquete de ayer en su estómago."
me_tayuan.9.a: "Envía a nuestros mejores hombres y mensajeros a su encuentro."
me_tayuan.9.b: "Debemos hacer una inversión importante para encontrarlos."
me_tayuan.9.c: "En cambio, deberíamos invertir en aquellos que ya están aquí."

me_tayuan.10.title: "$tayuan_task_6$"
me_tayuan.10.desc: "Pocos viven en los pasos de montaña escondidos en lo alto de los valles; Aparte de unas pocas comunidades nativas perdidas entre los picos que se mantienen aisladas, la mayor parte de la actividad (humana) ahora consiste en nuestros soldados, estacionados en nuestra red de fuertes recién construida en la región.\n\nAunque en casa [GetCulture('ionian').GetName]#E s#! no tienen mucha reputación de practicar profesiones marciales, la situación absolutamente inconcebible en la que nos hemos encontrado ya ha comenzado a forzar cambios en nuestra forma tradicional de ser. \n\nLas redes de fortalezas recién construidas en [GetProvince('(int32)6773').GetName] son una belleza. En lo alto de imponentes desfiladeros y en medio de valles minúsculos, estas defensas pondrán a prueba los límites de cualquiera que intente cruzar estas montañas."
me_tayuan.10.a: "¿A quién le importó alguna vez la #E Roca Sogdiana#!?"

me_tayuan.11.title: "Un enviado del lejano Oriente"
me_tayuan.11.desc: "Los rumores de un gran y rico imperio al este no eran ajenos a los oídos de [ROOT.GetCountry.GetRuler.GetName], pero su mente los desestimó, reinos inalcanzables desde los confines más lejanos de #COLOR:{0.39,0.21,0.81} Euros#!. Sin embargo, recientemente en [GetProvince('(int32)6737').GetName] se corrió rápidamente la voz de un extraño andrajoso, de tez extraña, que afirmaba ser un enviado de dicho Imperio. Dijo que había sido hecho cautivo por las tribus salvajes de nuestro este, y de cien hombres que partieron con él ahora sólo tenía un intérprete nativo para hacerle compañía.\n\nA medida que estas historias fantásticas de tierras lejanas se difundieron rápidamente, pronto estuvo en audiencia con el [ROOT.GetCountry.GetRulerTitle], y así explicó:\n\n'Fui enviado como enviado del #COLOR:{0.69,0.49,0} Huaxia#! al [GetCulture('yuezhi').GetName], pero el #R Xiongnu#! bloqueó mi camino, y apenas ahora he logrado escapar, le ruego a Su Alteza que me dé algunas guías para mostrarme el camino. ¡Si puedo llegar a mi destino y regresar para hacer el informe, la #COLOR:{0.69,0.49,0} Huaxia#! te recompensará con innumerables regalos!'"
me_tayuan.11.a: "Entonces, ¡las historias son ciertas! Ayúdalo en su camino."
me_tayuan.11.a.tt: "#Y Este es un encuentro histórico#!, y el diálogo es fiel al registrado por los eruditos chinos.\n¡Esto puede conducir a #G beneficios y obsequios#! del #T Imperio Oriental#!!"
helped_zhang_tt: "Qian Zhang recibirá suministros, oro y una escolta armada para su viaje de regreso a casa."
me_tayuan.11.b: "Fantástico o veraz, me importan muy poco la historia y el hombre."
me_tayuan.11.b.tt: "Esto puede #R enfadar#! el #T Imperio de Oriente#!."

me_tayuan.12.title: "$tayuan_task_8$"
me_tayuan.12.desc: "Con no poco esfuerzo, hemos derrotado todas las fuerzas que podrían amenazar esta dulce, dulce e idílica tierra, que no elegimos pero a la que fuimos impulsados, y que no por eso amamos menos.\n\nSin embargo, todos estamos seguros de una cosa: nunca volverá a ser lo mismo. Como hemos elegido vivir aquí, nuestros rostros familiares acabarán dando paso a algo que no es [GetCulture('ionian').GetName], y es sólo una cuestión de cuánto y quién influye en nuestras tradiciones. El corazón duele por lo que era su hogar, pero sigue sonriendo con esperanza ante esta nueva casa. Podemos caer, pero nadie dirá que seguimos adelante sin sueños y que poseemos la semilla radical de la idea en nuestra mente. No tenemos más remedio que ver en qué nos convertiremos, a partir de todas las nuevas influencias."
me_tayuan.12.a: "¿Una nueva era?"

me_tayuan.13.title: "¿Desierto?"
me_tayuan.13.desc: "Curiosamente, en un punto en medio de las montañas no se baja y se convierte en una gran llanura, prácticamente un desierto, salvo algunos ríos y pueblos. Los [GetCulture('sakan').GetCultureGroup.GetName] salvajes, bien conocidos por [SCOPE.sChar('tayuan_explorer').GetPraenomen] de aventuras anteriores, también habían dejado aquí su fea huella, pero con un poco de perseverancia los hombres lograron llegar a [GetProvince('(int32)7184').GetName], una ciudad inesperadamente grande (dada la desolación aquí), y una con una mezcla muy extraña de estilo indio y otro misterioso, con techos negros puntiagudos y paredes blancas.\n\nEn las calles, encontraron muchos pueblos, nativos e indios y helenos, y un hombre en particular, que nos asombró y divirtió mucho, de tez extraña, pálido como nosotros pero con cabello oscuro y ojos alargados. Ninguno de nosotros pudo entenderlo, pero un comerciante local finalmente lo tradujo; venía de un tal Dsongkou, una tierra enorme y fértil con cierto hombre enviado del cielo para gobernarla. ''¿Y dónde está esta tierra?'' preguntó [SCOPE.sChar('tayuan_explorer').GetPraenomen], al ver confirmadas sus preocupaciones, ''Hacia el Este'', dijo el hombre.\n\nDurante los siguientes días, se hicieron muchos intentos de llegar a esta fantástica tierra del Este, pero no llegamos a ninguna parte; es como si el mundo se acabara aquí. Simplemente no podemos alcanzarlos."
me_tayuan.13.a: "Muy intrigante..."

me_tayuan.14.title: "Los grandes jonios"
me_tayuan.14.desc: "Siria, [GetProvince('(int32)918').GetName], Persia, [GetProvince('(int32)3439').GetName], Egipto, [GetProvince('(int32)4976').GetName], India, [GetProvince('(int32)1883').GetName], [GetProvince('(int32)4371').GetName], inundan, desde los países más salvajes, con rostros cansados pero ojos esperanzados, a nuestros brazos abiertos. Muchos confiaron sólo en una palabra, en un sentimiento, para dejarlo todo y perseguir la silueta de un nuevo hogar para el pueblo jónico; Al final lo han encontrado: ¡una joya serena donde vivirán bienvenidos a pesar de estar en la miseria!\nMuchos quedaron inmediatamente asombrados por el clima hogareño del valle en medio del frío brutal que lo rodea, y nos miran ansiosamente en busca de orientación sobre dónde establecerse en este extraño valle."
me_tayuan.14.a: "Pueden esparcirse por todo el valle como semillas arrojadas."
me_tayuan.14.b: "Podemos concentrarlos en [GetProvince('(int32)6735').GetName]."

me_tayuan.15.title: "alguna vez perdido"
me_tayuan.15.desc: "Ellos no vinieron. A pesar de nuestros buenos esfuerzos, muchos ya se sienten demasiado hogareños en sus hogares; a pesar de no recibir el respeto que merecen como verdaderos jonios, este valle es un sueño demasiado lejano para muchos, y pocos han elegido emprender el peligroso viaje a través de países y países hasta nuestra propia reclusión aquí.\n\nAun así, las pocas almas valientes que lograron hacerlo fueron recibidas con los brazos abiertos. La recepción preparada en [GetProvince('(int32)6704').GetName] fue evidentemente decepcionante con los pocos números que acabaron apareciendo, pero como el filósofo debemos aprender a contentarnos con lo que recibimos."
me_tayuan.15.a: "Una pena."

me_tayuan.16.title: "Cascos de agradecimiento"
me_tayuan.16.desc: "Hemos tratado a los [GetCulture('sogdian').GetName]#E s#! casi como hermanos a pesar de nuestra clara superioridad; ellos también son un pueblo lejos de casa, expulsados ​​al norte por fuerzas extranjeras, por lo que no pudimos hacer nada más que mostrarles nuestra amabilidad. Esta amabilidad no pasó desapercibida en sus corazones, y hoy una emotiva delegación pasó por [ROOT.GetCountry.GetCapital.GetName], agradeciéndonos por nuestra fraternidad y colmándonos de regalos. Nuestros hombres ya practican juntos en el campo y hemos descubierto que tienen caballos increíbles, capaces de soportar cualquier esfuerzo. Muchos entre nosotros se han mostrado dispuestos a aprender estas nuevas formas de hacer la guerra a caballo, y nuestro ejército se está volviendo bastante competente en ellas."
me_tayuan.16.a: "Hermanos en verdad."

me_tayuan.17.title: "Un mérito de los vencidos"
me_tayuan.17.desc: "La Gran Falange Jónica se desmaya victoriosa sobre las tierras [GetCulture('sogdian').GetName], pero en realidad ya no es una falange tan pura como antes: a lo largo de nuestra campaña, hemos descubierto que la gente de estas tierras son maestros del caballo, y sus caballos son de la mejor calidad.\n\nAun así, esta campaña ha pasado factura a un pueblo desesperado por tener una casa propia, y ha vuelto a robar precisamente eso: las poblaciones sogdianas no están nada contentas."
me_tayuan.17.a: "Ese es en gran medida su problema."

me_tayuan.18.title: "$tayuan_task_10$"
me_tayuan.18.desc: "[SCOPE.sChar('tayuan_fm').GetName] puso en marcha un astuto plan cuando propuso convencer a los bactrianos de nuestra servidumbre económica hacia ellos. Dado que efectivamente tienen una gran influencia sobre nosotros, lograr que hagan la vista gorda ante las hazañas de nuestros soldados y comerciantes es exactamente lo que necesitamos para prepararnos para sorprenderlos.\n\nLos comerciantes bactrianos y sus mercancías fluyen regularmente a través de las puertas de nuestra ciudad, luego van a los mercados para intercambiar bienes y riquezas, pero con este acuerdo comercial trajeron regalos a [ROOT.GetCountry.GetRuler.GetTitleName]. En el bastión de la ciudad, el triunfante Epiproxenos [SCOPE.sChar('tayuan_fm').GetPraenomen] se aseguró de recordar a todos que la cuenta atrás para la guerra con [GetCountry('BAC').GetName] acababa de empezar a correr."
me_tayuan.18.a: "Que las riquezas estén antes que el acero."

me_tayuan.19.title: "$tayuan_task_12$"
me_tayuan.19.desc: "Hacía tiempo que habíamos oído hablar del maestro metalúrgico de [GetProvince('(int32)6737').GetName], pero nunca esperábamos que, al llegar a su casa en una de las colinas más grandes de la polis, la artista resultaría ser una mujer. De todos modos, nuestra gente aceptaría nada menos que un artefacto de la más alta calidad para representar su llegada a esta nueva y extraña tierra y la nostalgia que se cuela en nuestros humores desde debajo de las colinas. Como tal, a [SCOPE.sChar('tayuan_artist').GetName] se le permitió crear un altar a Apolo, nuestro dios, pero más específicamente a los jonios que encontraron un nuevo hogar aquí.\n\nCuando se inauguró, el altar atrajo una gran atención tanto de las antiguas familias del valle como de los recién llegados, y parece como si todos nosotros nos sintiéramos conmovidos e inspirados por él, ya que le cuenta al observador nuestra propia historia de pérdida y refundación."
me_tayuan.19.a: "Es una obra maestra."

me_tayuan.20.title: "$tayuan_task_11$"
me_tayuan.20.desc: "Otro caballo grita de dolor a lo lejos, otro jinete cae muerto al suelo. El suelo arcilloso recibe otro fuerte golpe. Esta unidad de caballería fue completamente aplastada, y muchos hombres que la rodeaban ahora están impulsando a sus caballos hacia el horizonte de la estepa interminable, sin más orgullo que la vida todavía en sus manos.\n\nEs posible que hayamos derrotado a los [GetCulture('sakan').GetName]#E s#!, pero una lección que hemos aprendido de ellos es que en las llanuras que nos rodean, reina el caballo salvaje utilizado por los Sakans. Rey. Hemos conseguido aprender un poco de sus magistrales técnicas y los hemos incorporado a nuestros regimientos de caballería."
me_tayuan.20.a: "Puede que nos estemos acostumbrando demasiado al sillín..."

me_tayuan.21.title: "$tayuan_task_13$"
me_tayuan.21.desc: "Siendo extranjeros, desconfiaron de nosotros, reyes extranjeros que llevaban su corona sobre nuestra cabeza; la verdad es que, comparativamente, se benefician mucho más de aprender de nosotros mientras los gobernamos que al revés, siguen siendo tribus dispares como lo fuimos nosotros hace muchos años entrando en Hellas.\n\nAun así, en nuestras costumbres civilizadas carecemos de la decisión y la valentía a las que renunciamos hace tantos años, por lo que los necesitamos tal como ellos nos necesitan a nosotros. Más aún porque conocen las tierras del valle y las que lo rodean.\n\nComo tal, estamos empezando a habitar juntos con cierto grado de fraternidad y compasión, y puede terminar que compartamos el valle con ellos como iguales."
me_tayuan.21.a: "El tiempo lo dirá."

me_tayuan.22.title: "$tayuan_task_14$"
me_tayuan.22.desc: "Nadie hubiera esperado que nuestras costumbres tradicionales como lanceros encajaran tan bien con los caballos de la estepa, pero estos son algunos de los mejores caballos disponibles en el mundo, que sangrarían por sus jinetes y, como tal, nuestro ejército es ahora un extraño pero efectivo híbrido entre la guerra griega y la guerra bactriana.\n\nMuchos entre el cuerpo y en las calles han comenzado a llamar a nuestro ejército los #E ''Lóchos de los Jaxartes''#!, pero hasta ahora sigue siendo un nombre no oficial. Nos corresponde a nosotros decidir si ese es el nombre que queremos adoptar."
me_tayuan.22.a: "Una idea interesante."

me_tayuan.23.title: "$tayuan_task_15$"
me_tayuan.23.desc: "Las maniobras políticas no son un trabajo para el intelecto y la voluntad inferiores. El [ROOT.GetCountry.GetRulerTitle] de los jonios de Ferghana, si desea permanecer en su condición principesca, debe aprender de todos modos a navegar por las Boules y Ekklesías de las polises del valle, eligiendo y deliberando sobre un universo de cosas en un momento dado, y formando un consenso para hacer que el valle avance como uno solo.\n\nEs un compromiso incómodo, nacido de los jonios del valle que desean conservar sus costumbres. De vivir, que es la democracia, pero es bien sabido que esas se desmoronaron sin mucho forzar; en un entorno tan hostil como el que vivimos, las ciudades individuales serían destrozadas por los buitres. Si las ciudades quieren preservar su derecho de reunión, el tribunal conserva su derecho a gobernarlas."
me_tayuan.23.a: "Para nuestra protección."

me_tayuan.24.title: "[SCOPE.sChar('tayuan_explorer').GetPraenomen] Se escapa atrevidamente"
me_tayuan.24.desc: "Perseguidos por los veloces caballos sogdianos, que algunos juraban que sudaban sangre en su desenfrenada persecución de nuestros hombres, [SCOPE.sChar('tayuan_explorer').GetPraenomen] apostó que sólo había dos maneras de proceder; O ser capturado y esperar el rescate, o dar batalla a los [GetCulture('sogdian').GetName] bandidos.\n\nComo tal, cuando la persecución se acercó a un pequeño terraplén cerca de [GetProvince('(int32)6790').GetName], nuestros jinetes se reorganizaron y procedieron a chocar contra los jinetes enemigos. Matones inexpertos, los hijos de puta fueron tomados completamente por sorpresa y completamente derrotados; Lamentablemente, algunos de nuestros valientes jinetes perecieron en sus sillas.\nAlgún tiempo después, una patrulla del rey sogdiano se disculpó profusamente y ofreció a nuestros hombres una compensación en oro por nuestras pérdidas. El rey, dice, no desea que ningún desacuerdo surja de la nada."
me_tayuan.24.a: "Un panorama sombrío de nuestra situación."

me_tayuan.25.title: "Cascos de desesperación"
me_tayuan.25.desc: "Como los [GetCulture('sogdian').GetName]#E s#! ya no tienen un reino del que hablar, ahora nos miran casi como hermanos, una especie de campeones de su humilde causa; ellos también son un pueblo lejos de casa, expulsados ​​al norte por fuerzas extranjeras, por lo que no pudimos hacer nada más que mostrarles nuestra amabilidad.\n\n Hoy, una emotiva delegación encabezada por un [SCOPE.sChar('sogdianbro').GetName] pasó por [ROOT.GetCountry.GetCapital.GetName], rogándonos que mostráramos misericordia a los #E sogdianos#! derrotados, que han aceptado su nuevo estatus en nuestra sociedad con humildad. Nuestros hombres ya practican juntos en el campo y hemos descubierto que tienen caballos increíbles, capaces de soportar cualquier esfuerzo. Muchos entre nosotros se han mostrado dispuestos a aprender estas nuevas formas de hacer la guerra a caballo, y nuestro ejército se está volviendo bastante competente en ellas."

me_tayuan.26.title: "Apto para vivir"
me_tayuan.26.desc: "Aunque nuestras tierras son azotadas por vientos fríos que azotan nuestros campos y tierras de cultivo como un ejército invasor, nuestros agricultores no se dejan intimidar por la helada matutina en el suelo o por sus manos doloridas y ampolladas: el trabajo agotador que realizan es vital para nuestra supervivencia, y lo saben.\n\nAntes de que los débiles rayos del sol naciente lleguen a los picos nevados, están trabajando, rompiendo terrones de tierra helada con palas y palas. Las horas pasan sin medida, puntuadas sólo por el gemido del ganado mientras se esfuerzan bajo los látigos de sus amos.\n\nEsta tierra es hostil, pero estamos decididos a hacer de [ROOT.GetCountry.GetName] un lugar apto para vivir."
me_tayuan.26.a: "Nuestra gente prospera, como una flor que crece en la hendidura de las montañas."

me_tayuan.27.title: "Por las llanuras abiertas"
me_tayuan.27.desc: "[ROOT.GetCountry.GetRuler.GetName] se ha alegrado de escuchar las victorias obtenidas por nuestros guerreros contra los salvajes que viven en [GetProvince('(int32)6789').GetArea.GetName]. Los señores de los caballos lucharon con valentía, hay que admitirlo, pero al final, no fueron rival para nuestros soldados [ROOT.GetCountry.GetAdjective] curtidos en la batalla, los veteranos de cien campañas.\n\nNuestros enemigos han sido dispersos ante nosotros, y aquellos que tuvieron suerte de escapar con vida han huido a lo profundo de la estepa."
me_tayuan.27.a: "¡Los dioses de la guerra cabalgan junto a [ROOT.GetCountry.GetName]!"

me_tayuan.28.title: "Un emporio sogdiano"
me_tayuan.28.desc: "Para [ROOT.GetCountry.GetRuler.GetName] fue una sorpresa cuando [SCOPE.sChar('sogdianbro').GetName], un líder de la comunidad sogdiana, se acercó a [ROOT.GetCountry.GetRuler.GetHerHim] para solicitar una audiencia. El astuto sogdiano afirmó que había un asunto financiero importante que discutir, que sería de gran beneficio para nuestros compatriotas, pero que el tiempo apremiaba y que habría que tomar medidas lo antes posible. Los [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] aceptaron de inmediato, intrigados por la vaga promesa de riquezas que ganar, y los dos se reunieron tranquilamente una tarde en [ROOT.GetCountry.GetCapital.GetName].\n\nAntes de ser sometidos por nuestros ejércitos, los sogdianos se estaban haciendo un nombre como comerciantes y comerciantes, y aunque han perdido su independencia, han descubierto que son libres de ganar dinero en todo nuestro reino. Y más allá: una situación que naturalmente agrada a los amantes del oro [SCOPE.sChar('sogdianbro').GetFirstName]. Nuestros ejércitos salvaguardan las rutas comerciales, permitiendo a los comerciantes sogdianos viajar a donde quieran; ¿Qué más podrían pedir?\n\nAparentemente una estructura permanente. Lo que ha propuesto [SCOPE.sChar('sogdianbro').GetSheHe] es bastante simple; En un gesto de buena voluntad, a los sogdianos les gustaría construir uno de sus famosos #E emporios sogdianos#! dentro de nuestra capital, pero las tesorerías de [ROOT.GetCountry.GetName] tendrían que apoyar los esfuerzos de construcción."
me_tayuan.28.a: "Una idea espléndida... ¡por supuesto que puedes hacer esto!"
me_tayuan.28.b: "No hay lugar en [ROOT.GetCountry.GetCapital.GetName] para uno de tus asquerosos mercados"

