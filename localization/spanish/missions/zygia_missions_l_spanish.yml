l_spanish:

zygia_missions: "Era de los Altos"
zygia_missions_DESCRIPTION: "Considerados durante mucho tiempo un grupo insignificante de tribus, los piratas y asaltantes Zygii predicen un gran futuro de conquista, expansión y unión con sus primos maeotianos para formar una gran nación de pueblos tribales en las montañas del norte del Cáucaso. Los antepasados ​​de los Adyghe, los circasianos, deberán tomar las medidas necesarias para transformar su remanso montañoso en un firme faro de esperanza para las tribus del norte."
zygia_missions_CRITERIA_DESCRIPTION: "La misión se completará cuando los Zygii hayan formado una gran nación de tribus o hayan defendido el culto a los Narts, grandes héroes de mitos y leyendas."
zygia_missions_BUTTON_TOOLTIP: "¡Abajo de las Montañas!"
zygia_missions_BUTTON_DETAILS: ""
 
 #Missions
 
zygia_missions_task_1: "Piratería póntica"
zygia_missions_task_1_DESC: "Conocidos mejor por sus tácticas piratas, los Zygii sólo encontrarán montañas de riqueza atacando los puertos cercanos y estableciendo refugios seguros para barcos sin identidad."

zygia_missions_task_2: "Relaciones con los Heniochi"
zygia_missions_task_2_DESC: "Una tribu de igual tradición y ferocidad, los futuros vínculos de los Heniochi con los Zygii deben decidirse diplomáticamente antes de que la guerra tome forma."
zygia_missions_task_2_tt: "Las conversaciones con los #Y Heniochi#! determinarán nuestra relación futura con ellos."

zygia_missions_task_3: "Puestos de avanzada zigianos"
zygia_missions_task_3_DESC: "Dado que los paraísos piratas en el extranjero apoyan a los barcos zigianos, los bandidos a vela deberían poder establecerse de forma más permanente en puertos menores."

zygia_missions_task_4: "Comercio nikopsiano"
zygia_missions_task_4_DESC: "El puerto de Torikos, conocido por otros con otro nombre, debe convertirse en un próspero centro comercial para impulsar el crecimiento y la expansión económicos de Zigia."

zygia_missions_task_5: "La región de Zyx"
zygia_missions_task_5_DESC: "Conocida por los ancianos de las tribus como la región central de los antiguos pueblos Zygii, Zyx representa una patria olvidada que necesita ser recuperada."
zygia_missions_task_5_tt: "#Y Zygia#! debe #E poseer#! o tener un #E sujeto propietario#! todos los #T resaltados#! territorios que comprenden la región de #T Zyx#!."

zygia_missions_task_6: "Khabzismo"
zygia_missions_task_6_DESC: "Honor. Compasión. Ayuda gatuita. Estos tres valores culturales inspiran el respeto de nuestros mayores y definen los roles en la sociedad zygian. Para poder llevar adelante las tradiciones, estos valores del khabzismo deben ser consagrados por el culto a Theshkhue."
#zygia_missions_task_6_tt: "____."

zygia_missions_task_7: "Asaltando a los Hypanis"
zygia_missions_task_7_DESC: "Situada en el lado oriental del Bósforo cimmerio, la ciudad de Phanagoria parece propicia para el saqueo y la esclavitud. Procuremos que nuestra flota \"pirata\" no sea vista entrando en sus aguas hasta que sea demasiado tarde."
zygia_missions_task_7_tt1: "#Y Zygia#! debe tener una #E marina#! con al menos #Y 15 liburnios#! y un #T comandante#!."
zygia_missions_task_7_tt2: "#Y Zygia#! ha activado #Y salario aumentado#! para #T mantenimiento de flota#!."

zygia_missions_task_8: "Caballos de montaña dura"
zygia_missions_task_8_DESC: "Entre las muchas tribus de las montañas desde Zygia hasta Albania, los caballos del noroeste son duras bestias de carga y los caballos de guerra más resistentes que uno podría esperar. Entrena a una banda de ellos y las fuerzas zygianas serán indiscutibles."

zygia_missions_task_9: "Los Maeotis orientales"
zygia_missions_task_9_DESC: "Los pantanos de Maeotis, aunque místicos y pantanosos, son el hogar de muchos de los seres divinos, así como oportunidades comerciales. Dejemos que los Zygii lo tomen para sí y prosperen."

zygia_missions_task_10: "Federación Zygian"
zygia_missions_task_10_DESC: "Con la afluencia de nuevas tribus y clanes, administrar las tierras de los Zygii se ha convertido en un asunto complicado bajo la actual estructura débil y simple de jerarquía política. Para garantizar la estabilidad, debemos invitar a los numerosos señores de los clanes y colaborar con ellos para crear una federación mayor de tribus."

zygia_missions_task_11: "Adorando a los nardos"
zygia_missions_task_11_DESC: "Los Narts, héroes de antaño, nos sirven como guía para los mejores hombres y mujeres en la época en que las deidades vagaban por la tierra. Para envalentonar a nuestros propios guerreros y a nuestro pueblo, debemos apreciar las historias y los recuerdos de los Nart."
zygia_missions_task_11_tt:0 "El Panteón Estatal debe contener #Y 4#! deidades de la religión nártica, con sus Lugares Sagrados bajo nuestro control."

zygia_missions_task_12: "La Dama de las Aguas Corrientes"
zygia_missions_task_12_DESC: "Las leyendas de los héroes Nart: Pija y Pizighash, hablan de una época en la que los hermanos viajaron a la costa de Maeotis y allí encontraron un pasadizo debajo de las olas hacia la pálida casa de la Señora de las Aguas que Fluyen. Al igual que los héroes de antaño, los Zygii deben emprender ese viaje, o al menos ofrecer a los fieles la oportunidad de hacerlo."
zygia_missions_task_12_tt: "#E El #! #T lugar sagrado#! de la Señora del Agua que Fluye está en #Y Pataroue#!."

zygia_missions_task_13: "Zichiá"
zygia_missions_task_13_DESC: "Para sobrevivir, no como una marioneta sino como un pueblo independiente, los Zygii deben forjar un reino duradero que marcará su historia y tradiciones en las historias contadas durante generaciones. Voces tranquilas hablan de una 'Zichia' mayor, una frontera mítica que envuelve las tierras natales de nuestras tribus. Este debe convertirse en el ámbito de nuestro pueblo."

zygia_missions_task_14: "Reino de los Narts"
zygia_missions_task_14_DESC: "Para proyectar una imagen de fuerza y unificar la identidad de los pueblos, las leyendas de nuestros antepasados Nart deben ser la base de nuestro marco legal y nuestras tradiciones. Así, los Zygii forjarán un reino gobernado por los ."
#zygia_missions_task_14_tt: "____."

zygia_missions_task_15: "El árbol dorado"
zygia_missions_task_15_DESC: "Las leyendas hablan de un árbol dorado que custodiaban los Narts; sus manzanas, la mitad blancas y la otra rojas, produjeron hijos fantásticos, varones de estirpe Nart. Los rumores hablan de un árbol así en las montañas: los Zygii deben tomarlo y protegerlo para tener hijos más fuertes y reclamar la herencia de los héroes."
zygia_missions_task_15_tt: "#E El #! #T lugar sagrado#! de Dische Zhig está en #Y Skarin#!."
 
 
 #Tooltips
 
 
 
 #Modifiers

zygian_ambitions: "Ambiciones zigias"
desc_zygian_ambitions: "¡Los Zygii se niegan a permanecer encerrados en su pequeña franja de valle montañoso costero!"

zygian_piracy: "Piratería zigia"
desc_zygian_piracy: "Los piratas zigios han creado una lujosa red comercial en los Pontos Euxinos."

zygian_pirates: "Piratas zigianos"
desc_zygian_pirates: "Nuestro puerto está infestado de piratas zigianos."

zygian_pirate_haven_modifier: "Refugio pirata de Zygian"
desc_zygian_pirate_haven_modifier: "Los piratas zigianos regresan aquí para reabastecerse y comprar bienes antes de partir para atacar los Pontos Euxinos."

nikposis_merchants: "Comerciantes Nikopsis"
desc_nikposis_merchants: "Con una economía comercial en crecimiento, los comerciantes han comenzado a llegar al centro portuario de Zygian."

zygian_mountain_horses: "Caballos de montaña de Zygian"
desc_zygian_mountain_horses: "Los resistentes caballos de Zygian se crían con amor y con métodos tradicionales."

zygian_cavalry: "Caballería zigia"
desc_zygian_cavalry: "Los resistentes caballos de los Zygii, aunque excelentes en el campo, también demuestran ser caballos de guerra firmes."

building_east_maeotis: "Construyendo el Maeotis oriental"
desc_building_east_maeotis: "La paz impuesta en las tierras al este de Maeotis ha provocado un auge de la población y la producción."

lady_of_the_lake: "dama del lago"
desc_lady_of_the_lake: "Las leyendas de la dama del lago atraen a mucha gente a la costa y estimulan su fe."

lake_legends: "Leyendas del lago"
desc_lake_legends: "Las leyendas de la dama que fluye de Maeotis han llevado a una mayor creencia en los Narts y los espíritus."

zygian_confederacy: "Confederación Zygian"
desc_zygian_confederacy: "La confederación de los Zygii y otras tribus caucásicas ha hecho que la región sea acogedora para nuevos pueblos."

rule_of_narts: "Regla de los Narts"
desc_rule_of_narts: "El consejo de los Narts ahora es adorado en toda su extensión."

khabzism_instated: "Ley instaurada del khabzismo"
desc_khabzism_instated: "El pueblo de Zygia ha centralizado su fe en torno al culto monista de la Ley de Tha."

nart_worship: "Adoración Nart"
desc_nart_worship: "Los Zygii han elegido dedicar sus oraciones y su fe a los héroes Nart de la antigua memoria."

golden_nart_tree: "El árbol del nardo dorado"
desc_golden_nart_tree: "Dische Zhig, el árbol dorado de los Narts, proporciona salud y nuevos hijos a los descendientes de los antiguos héroes."

maeotic_marsh_grain: "Tierras de cereales pantanosas maéticas"
desc_maeotic_marsh_grain: "Las marismas maeóticas han sido taladas en algunas partes para abrir grandes graneros naturales."

zygian_port_raiding_technique: "Técnicas de asalto a puertos de Zygian"
desc_zygian_port_raiding_technique: "La incursión en Phanagoria ha enseñado a los Zygii mucho sobre cómo entrar con éxito en un puerto protegido y sus muros defensivos."

phanagoria_raided: "Fanagoria asaltada"
desc_phanagoria_raided: "¡Los piratas Zygii han asaltado la ciudad de Phanagoria!"

zygii_stolen_lands: "Tierras robadas por los Zygii"
desc_zygii_stolen_lands: "Los asaltantes Zygii han robado tierras costeras de la Cólquida adecuadas."

phanagoria_jewish_quarter: "El barrio judío fanagoriano"
desc_phanagoria_jewish_quarter: "La afluencia de ciudadanos judíos que emigraron a Fanagoria ha revitalizado el comercio de la ciudad."

zygian_outpost: "Puestos de avanzada zigianos"
desc_zygian_outpost: "Los Zygii se han apoderado de estas tierras y las han convertido en centros de comercio."

zygian_frontier: "Puertos fronterizos de Zigia"
desc_zygian_frontier: "Entre las duras tierras fronterizas, los puertos de Zigia están bien protegidos."

zygian_hero_fame: "Fama del héroe zygian"
desc_zygian_hero_fame: "El héroe de Pataroue, con el relato de su aventura, ha hecho de la ciudad la comidilla del país."

aggressive_zygian_pasture: "Reacción agresiva en los pastos zigianos"
desc_aggressive_zygian_pasture: "Los Zygii atacaron nuestros pastos fronterizos."

zygian_pasture_negotiation: "Negociaciones sobre los pastos zigianos"
desc_zygian_pasture_negotiation: "Los Zygii estaban dispuestos a renegociar adecuadamente los límites de nuestros pastizales en la frontera."

 
 #Events

me_zygia_1_title: "Un estado pirata"
me_zygia_1_desc: "El éxito de las incursiones contra puertos extranjeros ha sido mayor de lo previsto. De hecho, múltiples barcos piratas han creado vastas redes a lo largo de la costa del mar. En el futuro, los marineros que participaron en la piratería han expresado su opinión de que el Zygii debería centrarse en construir una flota mayor de barcos con capacidad de piratería o en el proceso de establecer refugios para la piratería alrededor del mar para poder establecer un mercado negro. ¿Qué se hará?"
me_zygia_1.a: "Un mercado pirata será próspero."
me_zygia_1.b: "¡Construye la flota zygian!"
#me_zygia_1_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_1$#!' $mission_completed_tooltip_2$"

me_zygia_2_title: "Disputas por pastos"
me_zygia_2_desc: "Los mensajeros nos han informado que varios pastores de las tribus de los Heniochi han estado trayendo últimamente sus animales a nuestras tierras. Nuestra gente tribal se queja de que esto equivale a un robo. ¿Haremos algo ante este incumplimiento del contrato social?"
me_zygia_2.a: "Enséñales una lección permanente sobre la invasión de nuestras tierras."
me_zygia_2.b: "Podemos llegar a un acuerdo sobre compartir la tierra."
me_zygia_2.c: "Estos problemas pasarán con el tiempo."

me_zygia_3_title: "Guerra con los Heniochi"
me_zygia_3_desc: "Enojados por nuestra agresión anterior, los Heniochi han organizado bandas guerreras a lo largo de nuestra frontera. A menos que intentemos reducir las tensiones y hacer una demostración de nuestra buena voluntad, la guerra está más allá del horizonte. ¿Qué curso de acción debemos tomar?"
me_zygia_3.a: "No hay nada que temer."
me_zygia_3.b: "Envíe una generosa ofrenda de paz."

me_zygia_4_title: "Asociación con los Heniochi"
me_zygia_4_desc: "Siguiendo nuestras señales anteriores de negociación de buena fe, a los miembros de la tribu Heniochi les gustaría formar un vínculo más estrecho. Nos ha enviado un pequeño obsequio de su líder, un guerrero muy trabajador que creen que podría aconsejarnos bien. ¿Formalizaremos una verdadera alianza con esta gente?"
me_zygia_4.a: "¡Hermanos de armas!"
me_zygia_4.b: "Mantendremos nuestra distancia."

me_zygia_5_title: "Integración de Heniochi"
me_zygia_5_desc: "Después de un período de tiempo, muchas de las bandas de Heniochian reconocen el poder y la superioridad de nuestros guerreros y nuestra economía. Entre sus mayores, han llegado a la conclusión de que unirse más estrechamente a nosotros sería lo mejor para ellos, tanto por su seguridad como para preservar sus tradiciones dentro del dominio de sus compañeros de tribu. ¿Les damos el empujón final para que se unan a nuestras filas?"
me_zygia_5.a: "Bienvenidos nuestros hermanos y hermanas Heniochi."
me_zygia_5.b: "Nuestros parientes zigianos deben permanecer puros."

me_zygia_6_title: "Status Quo con los Heniochi"
me_zygia_6_desc: "Si bien ha habido altibajos, especialmente a lo largo de las zonas fronterizas entre nosotros y los heniochi, no ha ocurrido nada drástico. Por ahora, al menos, ellos están contentos en sus pueblos de las colinas y nosotros en los nuestros. Sin embargo, las olas están inquietas y los tiempos están cambiando rápidamente a nuestro alrededor. El problema puede volver a asomar su fea cara en el futuro."
me_zygia_6.a: "Que los tiempos sean pacíficos durante generaciones."

me_zygia_7_title: "La respuesta colquídea"
me_zygia_7_desc: "Es comprensible que los habitantes de Cólquida no estén contentos con que nos apoderemos de varios de sus preciados puertos. Han enviado delegaciones para entender cuánto tiempo planeamos permanecer en la zona y qué será necesario para que partamos hacia nuestras propias aguas. ¿Qué haremos?"
me_zygia_7.a: "Venderles los puertos de la Cólquida."
me_zygia_7.b: "Es posible que todavía nos dejen conservar los puertos."
me_zygia_7.c: "¡No les envíes mensajes ni mensajeros!"

me_zygia_8_title: "Estaciones de paso Zygii"
me_zygia_8_desc: "Ahora que los Zygii controlan definitivamente los puertos extranjeros, es hora de convertirlos en estaciones duraderas para el comercio y la prosperidad. ¿Cómo invertiremos en nuestro nuevo territorio?"
me_zygia_8.a: "Desde estos puertos conquistaremos a lo largo y ancho."
me_zygia_8.b: "Permítales continuar con nuestro alcance en el mercado."
me_zygia_8.c: "Se desarrollará orgánicamente."

me_zygia_9_title: "Defendiendo los puestos avanzados de Zygii"
me_zygia_9_desc: "Los mensajeros informan que las tropas de Cólquida han aparecido en el horizonte y se dirigen directamente a nuestros puertos; será una lucha difícil proteger nuestras tierras recién adquiridas. Debemos hacer lo que podamos."
me_zygia_9.a: "¡A las armas!"

me_zygia_10_title: "Comerciantes Nikopsis"
me_zygia_10_desc: "Los grupos mercantiles greco-zigios de las costas zigias han podido convertir un puerto atrasado en un bastión del comercio, tanto legal como de otro tipo. Torikos ha superado su estigma como refugio pirata estancado y ahora satisface las necesidades comerciales de todos los Pontos Euxinos orientales, rebautizados como Nikopsis."
me_zygia_10.a: "¡Que fluyan las riquezas!"
me_zygia_10_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_4$#!' $mission_completed_tooltip_2$"

me_zygia_11_title: "Orgullo en Zyx"
me_zygia_11_desc: "Habiendo recuperado un apodo cultural, los Zygii han adquirido confianza en su capacidad para proyectar poder en toda la región y convertirse en un pueblo verdaderamente dominante entre todas las tribus que viven a lo largo de los picos de Kavkasos."
me_zygia_11.a: "¡Por Zyx!"
me_zygia_11_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_5$#!' $mission_completed_tooltip_2$"

me_zygia_12_title: "La ley de esa"
me_zygia_12_desc: "La guía de Theshkhue y el sonido de la llegada de su heraldo guiarán a los Zygii durante las generaciones venideras."
me_zygia_12.a: "¡Fe en Theshkhue!"
me_zygia_12_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_6$#!' $mission_completed_tooltip_2$"

me_zygia_13_title: "El destino de la fanagoria"
me_zygia_13_desc: "Con nuestros piratas y guerreros irrumpiendo en la ciudad a través de su puerto y tomando todos los edificios administrativos importantes, la ciudad de Phanagoria pertenece esencialmente a los Zygii en la actualidad. Sin embargo, si nos vamos, los soldados del Reino de Bósforo probablemente lo retomarán en unos días y su rencor contra nosotros será cada vez más fuerte. ¿Cuál será el destino de la ciudad?"
me_zygia_13.a: "Toma lo mejor, deja el resto."
me_zygia_13.b: "¡Destroza la ciudad!"
me_zygia_13.c: "Es probable que los habitantes del Bósforo lleguen a un acuerdo que nos permita conservarlo."
me_zygia_13.d: "Será una marioneta nuestra."
me_zygia_13.d.t: "La ciudad de #Y Phanagoria#! se convertirá en una #Y League City#! de #E Zygia#!."

me_zygia_14_title: "El barrio judío fanagoriano"
me_zygia_14_desc: "Con Fanagoria atravesando el lento proceso de reconstrucción, una flota de comerciantes judíos ha llegado al puerto, afirmando que están huyendo del caos de los Diadochi y de la política en casa: les gustaría empezar de nuevo. ¿Deberíamos invitarlos a instalarse en la ciudad portuaria?"
me_zygia_14.a: "Constrúyeles una sección acogedora de la ciudad."
me_zygia_14.b: "Discutir nuestra nueva ciudad ya es bastante difícil."
me_zygia_14_tooltip: "$mission_completed_tooltip_1$ '#Y $blemmia_missions_task_1$#!' $mission_completed_tooltip_2$"

me_zygia_15_title: "Caballería Zygii"
me_zygia_15_desc: "Impulsada por una equitación divina, la caballería de la que hacen alarde los Zygii se ha vuelto incomparable en el campo de batalla."
me_zygia_15.a: "¡Carga!"
me_zygia_15_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_8$#!' $mission_completed_tooltip_2$"

me_zygia_16_title: "Drenando el pantano maeótico"
me_zygia_16_desc: "Si bien la creación de ciudades a lo largo de la costa maeótica ha ayudado a desarrollar la zona y a eliminar los restos del pantano, gran parte de la tierra sigue sin habitantes ni tierras de cultivo útiles. ¿Las tribus gastarán recursos adicionales para limpiar estas tierras para sembrar cereales?"
me_zygia_16.a: "Drene las marismas."
me_zygia_16.b: "Deja que la naturaleza sea."

me_zygia_17_title: "Unidad de los jefes Zygii"
me_zygia_17_desc: "Al tener más voz sobre el futuro de los clanes, cada jefe zigio se siente parte de un todo mayor en lugar de un grupo diverso de facciones. Sin embargo, tener acceso a una mayor cantidad de recursos y a una escena política tribal más dinámica les obligará a considerar la gran cantidad de poder que tendrán a su alcance si hacen amigos en las altas esferas..."
me_zygia_17.a: "Esperanza de una federación estable."
me_zygia_17_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_10$#!' $mission_completed_tooltip_2$"

me_zygia_18_title: "Un país de nardos"
me_zygia_18_desc: "Con el culto a Nart impregnando las montañas, los Zygii se han convertido en un grupo con más determinación y una búsqueda conjunta de emular las historias de los Nart de antaño. Los niños desean ser recordados algún día como la próxima generación de Narts."
me_zygia_18.a: "Su adoración nos fortalecerá."
me_zygia_18.b: "¡Nos convertiremos en una verdadera tierra de Narts!"

me_zygia_19_title: "Leyenda o fantasía"
me_zygia_19_desc: "Si bien se han erigido santuarios a la #E Señora de las Aguas que Fluyen#! en toda la ciudad de #E Pataroue#!, la historia de Pija y Pizighash sigue despertando el interés de muchos visitantes y habitantes por igual. No hay consenso entre la gente sobre si la historia puede considerarse cierta o no. Entre ellos, ha surgido un héroe local, llamado [zygian_hero.GetName], que ha decidido volver sobre los pasos de #E Pizighash#! y simplemente necesita algo de financiación para su viaje. Si no le damos el gusto, es probable que se vaya solo de todos modos, pero puede que nunca regrese, por muy tonto que sea."
me_zygia_19.a: "¡Envía al héroe!"
me_zygia_19.b: "La historia de Nuestra Señora será suficiente para esta ciudad."

me_zygia_20_title: "Una cueva extraña"
me_zygia_20_desc: "En su viaje para descubrir la verdad de la leyenda de Pizighash y las palomas blancas que se convirtieron en doncellas en el fondo del Mar Maeótico, [zygian_hero.GetName] encontró un probable lugar en la orilla, alrededor del cual el aire y la ligera brisa lo rodeaban con el aroma y el aura de lo divino. Fue aquí donde golpeó el suelo con su espada, como lo había hecho el héroe de antaño, y esperó a que las olas se separaran. \n\nMientras que el Maeotis no se movía por él, un nido de pájaros sorprendidos hizo crujir las hojas de una arboleda cercana y despegó a toda prisa, dirigiendo su atención a una vieja madriguera, las fauces de una caverna, que conducía a la tierra oscura; escuchó el sonido del agua chapoteando contra las paredes de tierra haciendo eco en la cueva."
me_zygia_20.a: "Este es el camino: ¡el héroe se aventurará!"
me_zygia_20.b: "Las historias hablaban de un camino hacia el mar, no de esta cueva hacia el inframundo; ¡huir!"

me_zygia_21_title: "Joya de las aguas que fluyen"
me_zygia_21_desc: "Después de un tiempo, el héroe regresó, tan esperado, a las puertas de #E Pataroue#!, con una doncella de pelo blanco en la mano. Todas las damas, señores y campesinos miraban maravillados. Quedaron asombrados al ver [zygian_hero.GetName] ambos seguros y en compañía de una mujer tan divina. Muchos intentaron hacerle preguntas. Algunos lo veían como parte del mismo dios, habiendo supuestamente logrado la aventura de los Narts, los propios dioses. \n\nLos renunció a todos y se dirigió al templo de la #E Señora de las Aguas que Fluyen#!. Dentro de los límites de su santuario, su dominio sagrado, se arrodilló y ofreció un sacrificio y un regalo: un colgante blanco con la imagen de una paloma. Cumplido su deber, ella alegremente se reunió con el populacho y se casó con su doncella ante todos los dioses."
me_zygia_21.a: "¡Alabado sea el nuevo héroe de la era!"

me_zygia_22_title: "El héroe perdido"
me_zygia_22_desc: "El héroe de los Zygii, que tenía el noble objetivo de perseguir los grandes cuentos de Pizighash, lamentablemente nunca regresó, dejando atrás su herencia y sus bienes al templo de la Señora de las Aguas que Fluyen. Probablemente su memoria será olvidada."
me_zygia_22.a: "Por desgracia, la historia muere con él."

me_zygia_23_title: "Turismo de leyenda"
me_zygia_23_desc: "Los recientes rumores sobre el templo de la Señora de las Aguas que Fluyen y las versiones locales de su antiguo cuento han comenzado a atraer un aumento considerable del turismo y la actividad mercantil en el puerto. Los asesores parecen creer que invertir en la historia en sí podría resultar bastante rentable. En particular, los sacerdotes del templo de la Señora están instando a un erudito escultor a crear una estatua maestra de su Señora para honrarla y servir como punto de referencia para los viajeros."
me_zygia_23.a: "¡Contrata a los mejores artesanos griegos!"
me_zygia_23.b: "La tendencia pasará, guarda las monedas para un día lluvioso."

me_zygia_24_title: "estatua de la dama"
me_zygia_24_desc: "La estatua fue descubierta por [zygian_sculptor.GetName] y [ROOT.GetCountry.GetRuler.GetName] en una plaza cerca del puerto de #E Pataroue#! ante la emoción de todos. Fue verdaderamente una obra maestra espléndida, que capturaba los maravillosos rasgos del ser divino que retrataba. Todos visitaron, rindieron homenaje y donaron obsequios a este gran santuario a la Señora de las Aguas Corrientes."
me_zygia_24.a: "¡Alabado sea la Señora de las Aguas Corrientes!"

me_zygia_25_title: "El pueblo de Zichia"
me_zygia_25_desc: "Habiendo ampliado su área de control, los Zygii se han unido bajo una misma bandera para dirigirse hacia el futuro bajo un nombre que lleva mucho tiempo inactivo."
me_zygia_25.a: "¡Por Zichia!"
me_zygia_25_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_13$#!' $mission_completed_tooltip_2$"

me_zygia_26_title: "Monarca Nart"
me_zygia_26_desc: "Emulando a los héroes de antaño, como Warzameg, los Zygii seguirán la ley de Theshkue mientras empuñan las espadas de antiguos guerreros para conquistar los picos de Kavkasos y sus alrededores."
me_zygia_26.a: "¡Te esperan historias de heroicidades y conquistas!"
me_zygia_26_tooltip: "$mission_completed_tooltip_1$ '#Y $zygia_missions_task_14$#!' $mission_completed_tooltip_2$"

me_zygia_27_title: "La manzana heterocromática"
me_zygia_27_desc: "Alrededor del árbol donde los Zygii habían puesto guardia, el más joven de los guardias descubrió una extraña manzana colgando de su rama más alta. Subiendo al gran y divino árbol, miró más de cerca la brillante superficie de la manzana, sólo para darse cuenta de que su rostro se reflejaba en su superficie de mármol. Hizo girar la fruta alrededor de su capullo y se dio cuenta de que, si bien no era un hueso blanco y duro, sí tenía un brillo lechoso en su mitad amarilla. La otra cara de la manzana aparecía casi pintada de un color carmesí sangriento, un tono profundo e inquietante. \n\nAntes de que pudiera agarrarse, se soltó y se separó del árbol. El niño cayó y murió en el impacto, pero otro guardia cercano llevó la extraña manzana al tribunal, donde se la presentó a [ROOT.GetCountry.GetRuler.GetName]. Todos conocían la historia del árbol de los Narts y su fruto divino, pero verlo y probarlo era una tarea impulsada por la precaución. [ROOT.GetCountry.GetRuler.GetName] rápidamente se lo entregó a una asistente y le pidió que probara la naturaleza divina del fruto."
me_zygia_27.a: "La manzana entera será comida a la vez."
me_zygia_27.b: "Come sólo la mitad pálida."
me_zygia_27.c: "Come sólo la mitad carmesí."
me_zygia_27.d: "No devores la manzana; que siga siendo un regalo adorado de los dioses."


