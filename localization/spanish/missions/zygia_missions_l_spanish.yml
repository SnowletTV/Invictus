dove_of_flowing_waters_desc: "Este colgante de paloma representa la forma aviar de una de las hijas de la Dama de las Aguas que Fluyen, cuya casa de mármol blanco se encuentra en la parte inferior del Maeotis."

statue_of_flowing_waters: "Estatua de la Señora de las Aguas Corrientes"
statue_of_flowing_waters_desc: "Esta estatua sirve para recordar a la gente de la costa que su divina Señora espera en su pálida casa en el fondo del mar."

red_white_apple: "La manzana roja y blanca del árbol dorado"
red_white_apple_desc: "Preservada del Árbol Dorado de los Narts, la manzana mitad roja y mitad blanca representa tanto el poder como la tentación de lo divino."

