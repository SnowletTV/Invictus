 expand_incense_route_desc:0 "Estrabón describió Eudemona como la principal escala del comercio marítimo entre la India y Egipto."
 #form_nubia:0 "Form Nubia"
 #form_punt:0 "Form Punt"
 form_aethiopia:0 "Formar Etiopía"
 form_aethiopia_desc: "Aunque muchos de origen norteño enmarcan \"Etiopía\" como cualquier tierra de personas de piel oscura al sur de Egipto, hemos decidido adoptar ese nombre extranjero por razones prácticas; aquellos que viven aquí conocen muy bien esta tierra de fuego, por lo que no necesitan formalidades como un nombre para el único lugar que conocen. \n\nCon nombre o sin nombre, somos los amos del Alto Nilo independientemente, y hemos creado un imperio donde nadie pudo antes."
