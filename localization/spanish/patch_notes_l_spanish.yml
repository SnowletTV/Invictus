l_spanish:
 patch_notes: "¿Qué hay de nuevo?"
 patch_notes_text:0 "V1.11.0.3 - Germanicus (interrumpe los guardados, usa la versión Nexusmods 1.10.1.1 para continuar con los guardados antiguos)\nÁrboles de misiones nuevos/ampliados:\n- Se agregó un nuevo árbol grande para Germania\n- Se agregaron 2 nuevos árboles para Tayuan\n- Se agregó un nuevo árbol regional para los escandinavos\n- Se agregó un árbol para Soodak disponible en el árbol de Germania\n- Árbol andrófago reelaborado\n\nCambios GFX (la mayoría por Pureon):\n- Nuevos puntos de referencia en el mapa: El Oráculo de Melqart, varios túmulos funerarios reales escitas, el monumento prehistórico de Newgrange, las piedras de Carnac, el Anillo de Brodgar y dos templos de la Reina de Saba\n- Gráficos de ciudades helenísticas mejorados, para que ciudades como Roma y Atenas parezcan habitadas\n- Nuevos modelos de construcción de ciudades para los grupos culturales fezzanos y númidas\n- Nuevos modelos de unidades para Bactria, Tayuan, Emporion, Hemeroskopeion, Atenas, Esparta, Argos, Siracusa y Fasis\n- Modelo 3D para la nueva maravilla edificable Irminsul\n- Nuevo y exclusivo iconos para 10 tesoros de vainilla\n- Nuevas banderas para las naciones de la cultura Aesti y Francia\n- Algunas imágenes nuevas de eventos\n- Muchos otros modelos 3D, texturas y otras mejoras gráficas\n\nCambios en el mapa:\n- Se amplió el mapa en las regiones de Atlas y Fezzan y alrededor del Nilo Amarillo\n- Se crearon más áreas colorea correctamente al poseer provincias vecinas\n- Se reelaboró el mapa y la configuración cultural en Magna Grecia\n- Se actualizaron visuales y localizadores de carreteras en todo el mundo\n\nCambios:\n- Se reequilibró una tonelada de árboles de misiones y modificadores, no podemos mencionarlos todos\n- Se reelaboró el ibérico, el galo y el latín. Nombres\n- Grupo de eventos reequilibrado para diversificar ligeramente los eventos\n- Se agregaron nuevamente las opciones de anexión de Imprison y opciones reequilibradas\n- Gobierno de la Horda de la Estepa reequilibrado\n- Se ajustaron los árboles de misiones existentes a una nueva configuración de mapa\n- Se actualizaron todos los logros básicos para que funcionen con el contenido de Invictus\n- Se reequilibraron completamente los estados del templo para que no puedas enviar spam ellos\n- Se limpió el código de sucesión que debería solucionar muchos problemas\n- Se reequilibró la interacción de personajes de Vender como Esclavo\n- Se aumentó el límite de esclavos por bien de 4 a 5\n- Se agregó herencia garmaniana\n- Se agregó la deidad de Afrodita para Corinto\n- Se actualizó español, francés y alemán traducciones\n\nCorrecciones de errores:\n- Se corrigieron muchas secuencias de comandos de rasgos de back-end\n- Se corrigieron varios errores partos\n- Se corrigieron varios problemas relacionados con la organización del matrimonio\n- Se corrigió la posibilidad de encarcelar a competidores olímpicos\n- Se corrigieron los co-gobernantes que se retiraban\n- Se hizo incontablemente más pequeño correcciones de errores en los árboles de misiones\n- Se corrigió un conflicto de hash de ubicación relacionado con una tarea italiana\n- Se corrigieron muchas localizaciones\n- Se corrigieron todos los errores que se nos informaron"
