  #Africa
  egypt_start: "#t Egipto#!\nDificultad: #y Muy Fácil#!\n\n$ptolemys_heritage_desc$"
  cyrenaica_start: "#t Cirenaica#!\nDificultad: #y Difícil#!\n\nCirenaica ha sido durante mucho tiempo el juguete de otros imperios; primero los aqueménidas impusieron su odioso yugo de esclavitud sobre ellos, y luego los bárbaros ejércitos de Alejandro trajeron más caos y servidumbre forzada a esta fértil y exuberante parte de África. Cirenaica, una vez hogar de un pueblo libre y orgulloso, ahora está nominalmente gobernada por Ptolemeo, el general macedonio que tomó el poder y se estableció como Basileus."
  kush_start: "#t Kush#!\nDificultad: #y Fácil#!\n\nEl pueblo de Kush ha caído casi en la obscuridad después de la caída de la 25ª dinastía. ¡Es hora de revertir la fortuna y crecer para convertirnos en el faraón más fuerte que el mundo haya visto jamás!"
  aksum_start: "#t Aksum#!\nDificultad: #Y Normal#!\n\n$Axumite_heritage_desc$"
  garamantia_start: "#t Garamantia#!\nDificultad: #Y Fácil#!\n\nLos países cercanos con la #Y Cultura Fezzani#! tienen acceso a este árbol.\n\n$garamantes_heritage_desc$"
  massaesylia_start: "#t Massaesylia#!\nDificultad: #Y Difícil#!\n\n$Massaesylian_heritage_desc$"
  nuragic_start: "#t Gymnaesia#!\nDificultad: #Y Difícil#!\n\n$balearic_heritage_desc$"
  mosylon_start: "#t Mosylon#!\nDificultad: #Y Difícil#!\n\nLos países cercanos con la #Y Cultura Macrobiana#! tienen acceso a este árbol.\n\n$mosylon_heritage_desc$"
  blemmia_start: "#t Blemmia#!\nDificultad: #Y Difícil#!\n\n$Blemmian_heritage_desc$"
  scandia_start: "#t Goutia#!\nDificultad: #Y Difícil#!\n\nLos países cercanos con la #Y cultura escandinava#! tienen acceso a este árbol.\n\n$scandian_heritage_desc$"

  #Asia
  antigonid_start: "#T Reino Antigónida#!\nDificultad: #y Normal#!\n\n$antigonid_heritage_desc$"
  seleukid_start: "#T Imperio Seleúcida#!\nDificultad: #y Fácil#!\n\n$seleucus_heritage_desc$"
  bithynia_start: "#T Bitinia#!\nDificultad: #y Difícil#!\n\n$bithynia_heritage_desc$"
  rhodes_start: "#t Rodas#!\nDificultad: #y Difícil#!\n\nLa hermosa isla de Rodas es la puerta de entrada al Egeo, estratégicamente situada y bendecida con un pueblo industrioso y refinado, y son estos hechos indiscutibles los que han hecho que muchas potencias extranjeras codicien la isla para sí mismas. Rodas estuvo recientemente bajo asedio durante un año y todavía se está recuperando de los efectos perjudiciales, ¡pero no será vencida!"
  judea_start: "#t Judea#!\nDificultad: #y Difícil#!\n\nDurante siglos, los judíos han estado confinados a Palestina y algunos rincones de Arabia, sus lugares sagrados y sitios de entierro ancestrales en manos de usurpadores. ¡Es hora de recuperar lo que pertenece legítimamente al pueblo hebreo!"
  samaria_start: "#t Samaria#!\nDificultad: #y Difícil#!\n\n$samaria_heritage_desc$"
  bactria_start: "#t Bactria#!\nDificultad: #y Difícil#!\n\nBactria sigue bajo el férreo control del Imperio Seleúcida, que se ha ocupado de numerosos conflictos hacia el Oeste, dejando a su satrapía indefensa ante las hordas de los escitas. Bactria es rica, urbanizada y fértil, y podría convertirse en una gran nación, si logra conquistar su libertad."
  persis_start: "#t Persis#!\nDificultad: #y Normal#!\n\n$heritage_of_persis_desc$"
  atropatene_start: "#t Atropatene#!\nDificultad: #y Normal#!\n\n$atropatenian_heritage_desc$"
  sogdia_start: "#t Sogdiana#!\nDificultad: #y Muy Difícil#!\n\n$sogdian_heritage_desc$"
  tasm_start:0 "#t Tasm#!\nDificultad: #y Difícil#!\n\nEn el corazón de la Península Arábiga, las tribus de Tasm sobreviven en medio de las desoladas dunas de arena, aferrándose a las aguas vitales de los pocos oasis esparcidos por sus territorios. A menudo ignorados por las Repúblicas y Monarquías de las costas, que ven al pueblo Tasmita como salvajes útiles solo para contratar como mercenarios en sus guerras regionales, esto resultará ser su perdición..."
  nabatea_start:0 "#t Nabatea#!\nDificultad: #y Difícil#!\n\nEl Malka de Nabatea, como se conoce a su Rey, gobierna sobre una tierra de importancia estratégica que es ampliamente transitada por comerciantes, diplomáticos y ejércitos, ya que el dominio de los nabateos toca Asia, África y Arabia. Las Guerras de los Diádocos han puesto a esta región vital en el centro de atención, ya que el derrumbamiento del statu quo político ha presentado a los ambiciosos nabateos la oportunidad de expansión."
  iberia_start:0 "#t Iberia#!\nDificultad: #y Normal#!\n\n$iberian_heritage_desc$"
  cappadocia_start:0 "#t Capadocia#!\nDificultad: #y Normal#!\n\n$cappadocian_heritage_desc$"
  saba_start:0 "#t Saba#!\nDificultad: #Y Fácil#!\n\n$saba_heritage_desc$"
  qataba_start:0 "#t Qataba#!\nDificultad: #Y Fácil#!\n\n$qataba_heritage_desc$"
  ach_heraclea_persica_start:0 "#t Heraclea Pontica#!\nDificultad: #Y Muy Difícil#!\n\n$heraclea_pontican_heritage_desc$"
  tylos_start:0 "#t Tilos#!\nDificultad: #Y Muy Difícil#!\n\n$tylosian_heritage_desc$"
  caria_start:0 "#t Caria#!\nDificultad: #y Difícil#!\n\n\"El linaje de Hekatomnos una vez llevó a Caria a la grandeza. Desde su asiento ancestral en Mylasa, los Hekatomnids surgieron como sátrapas de Caria, amos de sus tierras altas y costas por igual. Bajo Mausolos y Artemisia, Halikarnassos se hizo famosa por su colosal mausoleo, sus flotas dominaban el Egeo y su corte acogió a poetas, eruditos y soldados de todo el mundo helénico. Incluso en su ocaso, la dinastía resistió con honor: la reina Ada, la última de los Hekatomnids, adoptó a Alejandro Magno como su hijo.\n\nAhora Caria se encuentra en una encrucijada.Restaurar las viejas costumbres. ¡bajo el resurgimiento de un Hekatomnid o forja un reino sucesor bajo Pleistarco y reclama el imperio de Alejandro!"
  phoenicia_start:0 "#t Tiro#!\nDificultad: #y Difícil#!\n#E Misiones fenicias#! también están disponibles para Arados, Byblus, Sidón y Trípoli\n\nDesde la isla fortaleza de Arados hasta los bulliciosos puertos de Sidón y Tiro, los fenicios, eran famosos como comerciantes, constructores de barcos y exploradores de una calidad incomparable. Fuimos nosotros quienes enseñamos al mundo los secretos del mar, quienes construyeron la poderosa Cartago y quienes conectaron tierras distantes a través de redes de comercio y cultura. Pero la era de sumisión a imperios y señores supremos debe terminar. Las olas que han llevado nuestros barcos a todos los rincones del mundo conocido ahora nos llevarán hacia el dominio, tanto en tierra como en el mar. Ha llegado el momento de unir las ciudades de Fenicia y reclamar la gloria que es nuestro derecho de nacimiento."
  #kios_start:0 "#t Kios#!\nDifficulty: #Y Hard#!\n\n$kian_heritage_desc$"
  mithridatid_start:0 "#t Dominio Mitrídates#!\nDificultad: #Y Normal#!\n\nLa casa de Mitrídates afirma descender de Darío a través del noble Gobryas, y su alcance se extiende desde las colinas boscosas de Mariandynia hasta las costas azotadas por tormentas de Misia. Sin embargo, el destino de nuestra dinastía ondea en el viento mientras los llamados amigos codician nuestras posesiones, mientras las Guerras de los Diadochi muelen reinos menores bajo las botas macedonias.\n\nDebemos ser audaces. Si el peligro rodea nuestras tierras de Pérgamo, deberíamos abandonarlas, sólo por un tiempo, y mirar hacia el este, hacia las alturas protectoras de Paflagonia y la Capadocia Póntica. Un reino póntico, mejor dicho, un imperio póntico, está ante nosotros, ¡si tan sólo Mitrídates Ktistes se apoderara de la diadema y dejara que los Diadochi discutieran entre ellos!"
  albania_start:0 "#t Albania#!\nDificultad: #Y Normal#!\n\n$caucasia_albania_heritage_desc$"
