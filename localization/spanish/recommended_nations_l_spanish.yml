  #Northern Europe
  scythia_start: "#t Escitia#!\nDificultad: #y Fácil#!\n\nEscitia ha estado en gran declive después de que el rey Ateas muriera a manos de Filipo II de Macedonia. A pesar de las inestables relaciones con los griegos, algunos comienzan a ver sus ciudades como pilares de fuerza y estabilidad. ¿Cambiará Escitia con los tiempos o permanecerá fiel a su estilo de vida nómada?"
  bosporan_start: "#t Reino de Bósforo#!\nDificultad: #Y Normal#!\n\nSpartokos I era un capitán mercenario relacionado con los gobernantes del Reino de Odrisia. Contratado por el tirano de Pantikapaion, Archaeanactid, el rey del Bósforo, la excepcional destreza militar y la perspicacia estratégica de Spartokis hicieron que su influencia se expandiera constantemente y le granjeó la lealtad de las tropas que servían a su lado. Finalmente, lanzó un golpe de estado contra los Archaeanactids, tomando Pantikapaion y estableciendo la Dinastía Spartokid en su lugar.\n\nDurante sus tres siglos de gobierno, los Spartokids expandieron las posesiones del Reino de Bósforo de un puñado de ciudades poco conectadas apiñadas alrededor de la Península de Kerch a un auténtico reino helénico capaz de erigirse como un baluarte contra los escitas y Expansión sármata."
  boihaemia_start: "#t Boihaemia#!\nDificultad: #Y Fácil#!\n\n$boihaemia_heritage_desc$"
  treveria_start: "#t Treveria#!\nDificultad: #Y Fácil#!\n\n$treverian_heritage_desc$"
  haria_start: "#t Haria#!\nDificultad: #Y Normal#!\n\n$lugian_heritage_desc$"
  semnonia_start: "#t Semnonia#!\nDificultad: #Y Normal#!\n\n$suebic_heritage_desc$"
