  guthonia_start: "#t Guthonia#!\nDificultad: #Y Normal#!\n\n$gothonic_heritage_desc$"
  bastarnia_start: "#t Bastarnia#!\nDificultad: #Y Normal#!\n\nLa historia de nuestro pueblo, las tribus migratorias de los Bastarnaios, es larga y célebre, remontándose más allá de la memoria en las brumas del Tiempo; incluso nuestros Ancianos no están seguros de dónde estaba nuestra patria original. Durante todo el tiempo que podemos recordar, hemos vagado, soñando con un momento en que nuestra errancia cesará..."
  osismia_start: "#t Osismia#!\nDificultad: #Y Normal#!\n\n$aremorican_heritage_desc$"
  chattia_start: "#t Chattia#!\nDificultad: #Y Normal#!\n\n$istvaeonic_heritage_desc$"
  insubria_start: "#t Insubria#!\nDificultad: #Y Normal#!\n\n$lepontic_heritage_desc$"
  androphagia_start: "#t Androfagia#!\nDificultad: #Y Difícil#!\n\n$androphagia_heritage_desc$"
  eburonia_start: "#t Eburonia#!\nDificultad: #Y Normal#!\n\nLas beligerantes tribus de Eburonia viven cerca del río Rhenus, habitando en las llanuras y los bosques que reclaman como propios. Los comerciantes del sur civilizado evitan viajar a estos oscuros bosques, temiendo la reputación de la feroz tribu belga, conocida por resistir los esfuerzos de los forasteros por visitar sus aldeas."
  icenia_start: "#t Icenia#!\nDificultad: #Y Normal#!\n\n$icenian_heritage_desc$"
  caledonia_start: "#t Caledonia#!\nDificultad: #Y Difícil#!\n\nLos países cercanos con la #Y Cultura Caledonia#! tienen acceso a este árbol.\n\n$caledonia_heritage_desc$"
  ivernia_start: "#t Ivernia#!\nDificultad: #Y Normal#!\n\nLos países cercanos con #Y Cultura Iverniana#! o #Y Cultura Voluntaria#! tienen acceso a esto árbol.\n\n$ivernia_heritage_desc$"
