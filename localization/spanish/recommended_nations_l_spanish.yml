  siculia_start: "#t Siculia#!\nDificultad: #y Muy Difícil#!\n\n150 años después de su derrota en la batalla de Nomae a manos de Siracusa, la tribu de Siculia es todo lo que queda del gran imperio Sicel de Ducetio, aferrándose a la vida en el remoto interior de Sicilia. Con la colonización implacable por parte de los griegos y cartagineses sedientos de poder, parece que toda esperanza está perdida para Siculia, destinada a desvanecerse en la historia junto con el resto de sus congéneres. ¿Está realmente sellado el destino de Siculia, o puede un gran líder a la manera de Ducetio surgir del tenue crepúsculo para desafiar las abrumadoras probabilidades y traer un nuevo amanecer Sicel sobre Sicilia?"
  armenia_start: "#t Armenia#!\nDificultad: #Y Normal#!\n\n$armenian_heritage_desc$"
  ionia_start: "#t Jonia#!\nDificultad: #Y Difícil#!\n\n$ionian_heritage_desc$"
