 ######RELIGIONS######:0 ""
 roman_pantheon:0 "Helénica"
 desc_roman_pantheon:0 "El panteón olímpico se difundió desde el centro de Grecia y es venerado por muchas personas. Los nombres, los aspectos y la jerarquía de varios dioses varían ampliamente entre regiones. Sin embargo, Zeus (conocido como Júpiter para los romanos) se considera la figura central del panteón olímpico."
 egyptian_pantheon:0 "Kemetista"
 desc_egyptian_pantheon:0 "La historia de la religión originaria de Egipto se remonta a miles de años. Se manifiesta como fe politeísta que venera a Ra, Atum, Sekhmet, etc. Y demuestra una profunda reverencia por los aspectos fundamentales del mundo natural."
 carthaginian_pantheon:0 "Cananea"
 desc_carthaginian_pantheon:0 "La religión cananea venera a varios dioses y a sus aspectos, de forma politeísta. Baal se considera la deidad principal dentro de una compleja jerarquía de dioses menores, a quienes a menudo se rendía culto en altares ubicados sobre montañas o colinas."
 shamanism:0 "Zalmoxiana"
 desc_shamanism:0 "Se desconoce si Zalmoxis fue originalmente un dios o un profeta. Los dacios y los getas rinden culto a Zalmoxis y lo consideran un ser divino a quien le atribuye muchos milagros."
 druidism:0 "Druídica"
 desc_druidism:0 "Entre los celtas, los druidas constituían una clase social. A menudo ejercían funciones de magistrados y legisladores. También dictaminaban las costumbres y creencias religiosas locales."
 animism:0 "Ibérica"
 desc_animism:0 "La religión ibérica es híbrida y politeísta. Se venera tanto a espíritus animales como a ancestros. Los ibéricos también rendían culto a diversos dioses helénicos y fenicios, y a deidades locales como Betatun o Ataecina."
 judaism:0 "Judía"
 desc_judaism:0 "De manera inusual entre las fes contemporáneas, la judía es una religión monoteísta. Siguiendo una serie de profetas y maestros, el libro sagrado judío contiene los detalles de un pacto creado entre Dios y el pueblo elegido de Israel."
 zoroaster:0 "Zoroastrismo"
 desc_zoroaster:1 "El profeta Zoroastro enseñó sobre la fe del dios creador Ahura Mazda y su adversario Ahriman. Al evolucionar a partir del politeísmo indoiraní, se muestra una gran reverencia por la \"ley eterna\", o Daena, que propugna una conducta de bondad y honestidad."
 matrist_religion:0 "We'ra"
 desc_matrist_religion:0 "Poco se sabe de las tribus bálticas y su religión. No obstante, los registros arqueológicos sobreviven, hablando de cultos que adoraban a varios dioses naturalistas a lo largo de la costa báltica. Lo más probable es que, basado en reconstrucciones del proto-balto-eslavo, su nombre para la fe era We'ra, del cual descienden las palabras modernas víra en checo, wiara en polaco y véra en ruso."
 berber_religion:0 "Megalítica"
 desc_berber_religion:0 "La cultura y la religión antigua eran un crisol de creencias egipcias tradicionales, culto a los astros y veneración de los ancestros. Aún existen muchos megalitos (construcciones de piedra erigidas en honor a los dioses) esparcidos a lo largo de África."
 germanic_religion:0 "Tuística"
 desc_germanic_religion:0 "El antiguo dios germánico Twisto, Tuisto, Tius, o Teiws, era adorado por las primeras tribus migratorias de la Escandinavia moderna. Muchos relatos sugieren que los pueblos germánicos practicaban una religión en gran parte animista, venerando la tierra y el cielo, y la fuerza vital de todos los seres vivos."
 arabian_pantheon:0 "Arábica"
 desc_arabian_pantheon:0 "En Arabia, la religión era una combinación politeísta de deidades, aspectos y demonios, practicada en localidades y enclaves de la región. En algunos lugares, en este periodo, posiblemente se adoraba a Alá, el dios creador y figura principal del panteón."
 buddhism:0 "Budista"
 desc_buddhism:0 "El budismo, una religión relativamente reciente, surgió en el norte de la India a raíz de la vida de Siddhartha Gautama, o simplemente Buda. El Buda fue un maestro ascético que habló sobre el Camino Medio a lo largo de la India."
 hindu:0 "Védica"
 desc_hindu:0 "Las creencias védicas formaron lo que se convertiría en el hinduismo del norte de la India. Provino de los asentamientos indoeuropeos en la India y se convirtió en ampliamente seguido en toda la India, con la excepción de las tierras de los dravídicos."
 agama:0 "Agámica"
 desc_agama:0 "Las creencias agámicas formaron lo que se convertiría en el hinduismo del sur de la India. Era la religión indígena de la India antes de que los invasores indoeuropeos se establecieran en el norte."
 bon_religion:0 "Bon"
 desc_bon_religion:0 "El Bon representa un grupo de religiones populares practicadas originalmente en la meseta tibetana. Aparecen con frecuencia aspectos de culto a los ancestros y animismo, así como un politeísmo emergente."
 indo_iranian_religion:0 "Heptádica"
 desc_indo_iranian_religion:0 "Originaria de las tierras escitas, esta fe panteísta adoraba a siete dioses principales, a menudo equiparados con los del panteón griego. Elementos de la antigua religión politeísta de los escitas aún permanecen, al igual que la práctica del sacrificio de caballos y los enterramientos en carros, similares a los de los celtas."
 anatolian_religion:0 "Anatolia"
 desc_anatolian_religion:0 "El culto frigio a Cibeles se relaciona con el culto prehistórico a la diosa madre. Esta religión, que evolucionó a lo largo de miles de años, afirmaba relacionarse con figuras y héroes míticos, y veneraba ídolos."
 armenian_religion:0 "Cáldica"
 desc_armenian_religion:0 "El panteón cáldico representa a una religión que surgió de la cultura de Urartu, la cual existió muchos siglos antes. Era una fe principalmente politeísta. El dios principal al que se le rendía culto era conocido como Jaldi, un dios guerrero."
 anahitic_religion:0 "Anahítica"
 desc_anahitic_religion:0 "El panteón armenio se encuentra en la encrucijada de los panteones helénico, zoroastriano, anatolio e incluso cananeo y árabe. Con Anahit a la cabeza del panteón, varias otras deidades incluyendo las de origen armenio antiguo están con ella en esta religión de crisol."
 caucasian_religion:0 "Armázica"
 desc_caucasian_religion:0 "El panteón de la región de Iberia Caucásica, posiblemente relacionado con las religiones de la cercana Anatolia, era regido por el dios Armazi."
 circassian_pantheon:0 "Nartico"
 desc_circassian_pantheon:0 "Derivado de 'Nart', que significa 'héroe', que describe las llamadas Nart Sagas, una colección de cuentos sobre los enormes héroes titulares que montan a caballo. La religión del norte del Cáucaso es distinta de sus contrapartes del sur, eludiendo las influencias griegas y persas de los escitas y otros grupos tribales iraníes."
 mesopotamian_religion:0 "Caldea"
 desc_mesopotamian_religion:0 "La historia del panteón caldeo se remonta a muchos miles de años. Adorando dioses como Anu, Enki y Nanna, los devotos de la religión caldea construyen templos imponentes en honor a su dios elegido."
 jainism:1 "Jainismo"
 desc_jainism:0 "El jainismo es una fe india que se remonta muchos años, a los primeros maestros de la religión. Los seguidores del jainismo creen firmemente en el ascetismo y la no violencia, y tienen relaciones amistosas con otras tradiciones indias."
 ajivika:1 "Ajivika"
 desc_ajivika:0 "Ajivika es una fe shramánica india que fue muy popular antes de que el budismo y el jainismo la reemplazaran. Los seguidores del ajivika creen firmemente en Niyati, la creencia de que la vida está predestinada y determinada."
 nuragic_pantheon:0 "Nurágica"
 desc_nuragic_pantheon:0 "El nurágico es una creencia que se remonta a la Edad de Bronce de Córcega y Cerdeña. Lleno de cultos de animales y pozos, lo más central en la creencia nurágica es la creencia henoteísta en un Dios Padre conocido por muchos nombres, incluyendo Sardo, Sid Addir, y más."

 puntic_religion:0 "Waaqí"
 desc_puntic_religion:0 "Waaq, el dios Creador todopoderoso y Padre de todos nosotros, ha sido fielmente venerado por los pueblos que viven en el Cuerno de África durante miles de años, con su devoción inquebrantable al Ser Supremo asegurando su paz y bendiciones armoniosas. Una antigua religión monoteísta con una jerarquía y conjunto de creencias complejas, Waaq se sobrepone a todo y dirige a los numerosos intermediarios angélicos que envía a su pueblo, otorgando a sus seguidores buena fortuna y protegiéndolos de sus enemigos con su poder y gloria."

 illyrian_pantheon:0 "Ilírica"
 desc_illyrian_pantheon:0 "Los pueblos ilirios creían en un panteón ilírica distinto con influencias de los panteones itálico y helénico. Ilírica no tenía un dios principal único y, en su lugar, adoraban a una multitud de deidades locales. También tenían dos cultos importantes: el culto al Sol de los ilirios paeonios y el culto a la Serpiente de los ilirios del sur."

 burmese_religion:0 "Nática"
 desc_burmese_religion:0 "La adoración de espíritus llamados Nats era prevalente entre muchos pueblos austroasiáticos, incluidos los actuales nativos de Birmania. La creencia nática se convertiría en una fe politeísta adecuada, pero por ahora era una fe que más fácilmente se consideraría animista, con los comienzos del politeísmo tomando forma."

 italic_pantheon:0 "Itálica"
 desc_italic_pantheon:0 "El pueblo de Italia adoraba una variedad de dioses antes de adoptar los helénicos. Desde las creencias pre-indoeuropeas de los etruscos y raetios, hasta las creencias ilirio-itálicas de los venetos, los dioses del sur itálico de los sabinos, latinos, umbrios y más, el panteón itálico es vasto y diverso entre sus seguidores."
 vaksh_religion:0 "Voxita"
 desc_vaksh_religion:0 "Combinando las creencias del pueblo del río Vakhsh (Oxus), la religión heptádica de la estepa y las creencias zoroastrianas de los persas, el voxita adopta su propia identidad como un crisol cultural y religioso que venera a sus propios dioses locales entre otros más familiares de otros pueblos."

 nilotic_pantheon:0 "Nhiálica"
 desc_nilotic_pantheon:0 "Los pueblos nilóticos tenían un panteón distinto de dioses que inspiraban e impactaban a los pueblos que se migraban a través del Sahara y el Nilo. Desde la diosa vaca proto-Hathor, hasta el ser supremo Nhial mismo, este panteón está lleno de deidades impactantes y únicas."

 eastern_animism:0 "Swanca"
 desc_eastern_animism:0 "Representando la religión de los tocarios en la cuenca del Tarim, Swanco venera a la diosa del Sol Swancho entre otros dioses insulares. La religión toscaria está más estrechamente relacionada con la antigua religión hitita, separada por cientos de años, es un verdadero aislado de una antigua religión indoeuropea."

 mithra_religion:0 "Mitraica"
 desc_mithra_religion:0 "La religión de los medos se centra principalmente en el dios Mitra en lugar de Ahura Mazda. Es el descendiente directo de las antiguas creencias pre-zoroastrianas de Persia. El ascenso de los aqueménidas vería tanto altos como bajos puntos, muchas veces favoreciendo el zoroastrismo mazdaísta, pero hasta el día de hoy permanece con el pueblo de los medos."

 hurrian_pantheon:0 "Hurrita"
 desc_hurrian_pantheon:0 "Hurriana, la fe que gira en torno al poderoso Teshub en su interminable lucha del Ciclo de Kumarbi. La religión hurriana es una religión antigua que se ha desvanecido en la oscuridad durante este tiempo, sin embargo, aún permanece en la memoria reciente. No hace mucho tiempo, la religión hurriana influenció a hititas, hurrios y fenicios por igual. Quizás las historias de Teshub aún no se hayan perdido para siempre."

 uralic_pantheon:0 "Ilmarismo"
 desc_uralic_pantheon:0 "Ilmarica representa la religión del grupo cultural finougrico. Incluye una vasta gama de culturas y creencias, todas girando en torno al dios principal, Ilma, que fue ciertamente venerado en todas las culturas finougricas. Junto con Ilma, las creencias ilmaristasas incluyen un énfasis en la luz de los cielos nocturnos y diurnos: la Luna y el Sol."

 hatti_religion:0 "Hática"
 desc_hatti_religion:0 "La antigua fe de los Hatti fue una vez olvidada por los pueblos que vivían en Anatolia, aunque recientemente ha sido revivida por aquellos que viven en Paflagonia. Los fieles hatti están en sintonía con los ciclos naturales de las estaciones y la Tierra misma; se preparan y se sirven ofrendas y libaciones a la Madre Diosa para mantener los campos fértiles y prevenir que calamidades celestiales abrumen la tierra."

