 me_zorgoomni.34_title: "Incursión transfronteriza"
 me_zorgoomni.34_desc: "Mi [ROOT.GetCountry.GetRulerTitle], tenemos noticias terribles y buenas que darte de [this_province_was_raided_scope.GetName], pero primero, las malas.\n\nAnoche, una cohorte de guerreros de [nomadic_raid_country.GetName] cruzó nuestra frontera y lanzó una incursión sorpresa contra los locales desprevenidos. Desafortunadamente, los traidores [nomadic_raid_country.GetAdjective] asaltantes mataron a algunos de los nuestros y saquearon sus tierras, llevándose todo lo que pudieron llevar y quemando todo lo que no pudieron. Y lo que es peor: debes saber que estos bandidos fueron liderados personalmente por [nomadic_raid_country.GetRulerTitle] [nomadic_raid_country.GetRuler.GetName] en una descarada señal de falta de respeto a la gente de [ROOT.GetCountry.GetName].\n\nPero los dioses de la guerra estaban con nosotros, ¡porque el traicionero [nomadic_raid_country.GetRuler.GetFirstName] fue asesinado en batalla por nuestros guerreros! El tonto [nomadic_raid_country.GetAdjective] [nomadic_raid_country.GetRuler.GetFirstName] fue perseguido por tres de nuestros soldados y no tuvo piedad."
 me_zorgoomni.34.a: "¡Destruiremos a cualquiera que crea que puede atacar [ROOT.GetCountry.GetName]!"
 me_zorgoomni.34_tooltip: "¡La '#Y Incursión transfronteriza#!' ya ha sido #G completada#!!"
 

 inv_after_battle.11.t: "Los Vínculos de Amistad"
 inv_after_battle.11.d: "[SCOPE.sCharacter('inv_after_battle_1_target').GetName] se ha ganado la reputación de no dejar nunca atrás a un soldado herido en el campo de batalla, a menudo poniéndose [SCOPE.sCharacter('inv_after_battle_1_target').GetHerHim] en gran peligro personal para asegurarse de que nadie sea olvidado.\n\nGracias al ejemplo desinteresado de [SCOPE.sCharacter('inv_after_battle_1_target').GetFirstName], muchos de nuestros soldados se sienten inspirados a seguir los pasos de [SCOPE.sCharacter('inv_after_battle_1_target').GetHerHis]."
 inv_after_battle.11.a: "Cuidaré de ti si tú cuidas de mí"

