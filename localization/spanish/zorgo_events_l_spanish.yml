 construct_pirate_havendesc: "\n \nDurante cientos, si no miles, de años, la piratería ha sido una tradición para aquellos que no están dispuestos a ganarse la vida honestamente.\n\n#T Podemos construir un#! #R refugio pirata#! #T cada#! #G 10#! #T años.#!"
