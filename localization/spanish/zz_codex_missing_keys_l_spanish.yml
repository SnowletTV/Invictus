l_spanish:
 ai_constantinople:0 "Trasladar la capital a Constantinopla"
 ai_constantinople_desc:0 "Constantinopla se ha convertido en el centro natural del Imperio romano de Oriente. Trasladar allí la capital asegurará un gobierno más eficaz."
 ai_use_treasures:0 "Colocar tesoros en un lugar sagrado"
 ai_use_treasures_desc:0 "Decisión exclusiva de la IA para colocar tesoros en un lugar sagrado."
 convert_to_satsana_phi_religion:0 "Adoptar Satsana Phi"
 convert_to_satsana_phi_religion_desc:0 "La veneración de los espíritus Phi se ha extendido entre nuestro pueblo. Ha llegado el momento de adoptar oficialmente sus ritos y convertirlos en la fe de nuestra nación."
 divided_roman_empire_traditions_desc:0 "La división del Imperio nos privó de parte de nuestra tradición militar. Con tiempo y experiencia podremos restaurar el legado de las legiones romanas."
 form_aethiopia:0 "Formar Etiopía"
 form_aethiopia_desc:0 "Aunque muchos pueblos del norte llaman «Etiopía» a cualquier tierra de habitantes de piel oscura al sur de Egipto, hemos decidido adoptar ese nombre extranjero por pragmatismo. Con nombre o sin él, somos los dueños del Alto Nilo y hemos levantado un imperio donde nadie lo había logrado antes."
 form_lazica:0 "Formar Lázica"
 form_lazica_desc:0 "El pueblo laz habitó antaño junto a los abasgos del norte y durante generaciones recorrió los sinuosos humedales del delta de Cólquide. Ahora corresponde a los lazes gobernar el Fasis y abrir un nuevo rumbo para los pueblos del mar Negro oriental."
 form_scandia_desc:0 "En el extremo septentrional del mundo germánico, Escandia es una tierra rigurosa de largas noches y aún más largos inviernos. Pese a todo, hemos sobrevivido y prosperado. Si sometemos al resto de nuestros parientes, podremos fundar una gran federación del norte y reclamar nuestro lugar legítimo en Germania."
 reinstate_eblaite_gods:0 "Restaurar los dioses eblaítas"
 reinstate_eblaite_gods_desc:0 "La antigua tablilla del panteón de Ebla conserva nombres y ritos olvidados. Al devolverla a un altar podremos restaurar a los dioses eblaítas en nuestro culto."
 fezzani_mission_01_task_19_DESC:0 "Nuestra expansión ha alcanzado las colonias griegas de la costa. Para dominar las rutas del Mediterráneo tendremos que asegurar los territorios vecinos y afrontar la creciente rivalidad de sus habitantes."
 jomon_honshu_missions_task_30:0 "El destino de los jōmon"
 jomon_honshu_missions_task_30_DESC:0 "Hemos completado las grandes empresas de nuestro pueblo y extendido nuestra autoridad por Wa y la península coreana. Ha llegado el momento de asegurar para siempre el legado y el futuro de los jōmon."
 mauryan_collapse_prevention_task_2_DESC:0 "Pracya ha sido durante mucho tiempo nuestra sede del poder. Restaurar el orden en la capital es esencial para nuestra supervivencia."
 mauryan_collapse_prevention_task_3_DESC:0 "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName] gobierna con mano de hierro y no muestra piedad con sus enemigos. Sus métodos son crueles, pero eficaces, y muchos ya lo llaman Chandashoka, el Cruel, a sus espaldas."
 mauryan_collapse_prevention_task_4_DESC:0 "El rajá [Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName] ha demostrado capacidad tanto en los asuntos de Estado como en los militares. Probará su destreza ante el mundo para que todos conozcan nuestro verdadero poder."
 mauryan_collapse_prevention_task_5_DESC:0 "Kalinga lleva mucho tiempo resistiendo nuestra hegemonía sobre la India. [Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName] será quien finalmente la obligue a arrodillarse ante nosotros."
 mauryan_collapse_prevention_task_6_DESC:0 "Los ciudadanos hablan de un individuo sospechoso llamado Samudra. Este monje predica sus enseñanzas entre nuestro pueblo y podría convertirse en un peligro o en una oportunidad."
 mauryan_collapse_prevention_task_7_DESC:0 "Un solo hombre no puede gobernar todo Maurya. Necesitamos a muchos gobernadores para mantener el reino en orden, y debemos conservar su apoyo."
 mauryan_collapse_prevention_task_8_DESC:0 "Nuestros gobernadores son cada vez más corruptos y desleales. Debemos recuperar su confianza si queremos conservar el imperio."
 mauryan_collapse_prevention_task_9_DESC:0 "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName] quizá haya logrado lo imposible. Su comprensión de la política cortesana ha estabilizado el país y nos permite dejar atrás estos años difíciles."
 mauryan_collapse_prevention_task_10_DESC:0 "La fe budista representa todavía una pequeña parte de nuestra población, pero sus enseñanzas son inestimables. Los viejos dioses nos han fallado y debemos buscar un nuevo faro."
 mauryan_reconquest_task_6_DESC:0 "La recuperación del imperio exige reforzar la influencia magadhi. La gran mayoría de los habitantes de Madhyadesa y Avanti deberá pertenecer a nuestra cultura o a una cultura integrada."
