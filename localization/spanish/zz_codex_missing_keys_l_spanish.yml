 new_city_scope.provcap:0 "#Y [SCOPE.sP('new_city_scope').GetName]#! se convierte en la capital de #Y [SCOPE.sP('new_city_scope').GetState.GetShortName]#!."
 me_greek_5_pontus.7.tt:0 "Nos acercaremos a #Y [gm_5_colony_target_scope.GetName]#! con una oferta de #G [SCOPE.ScriptValue('gm_5_colony_value')]#! @gold! para que se convierta en nuestro feudatario.\nLa probabilidad de aceptación depende del carisma de #Y [gm_family_head_5.GetPraenomen]#!, del tamaño relativo del país y de la opinión diplomática. [SCOPE.Custom('gm_5_chance_colony')]\nSi se niegan, obtendremos un derecho sobre todo el territorio [gm_5_colony_target_scope.GetAdjective]."
 me_greek_5_pontus.121.tt:0 "Ofreceremos comprar #Y [gm_5_barter_target_territory.GetName]#! a [gm_5_barter_target_territory.GetOwner.GetName] por #R -[SCOPE.ScriptValue('gm_5_barter_territory_value')]#! @gold!\nLa probabilidad de aceptación depende del carisma de #Y [gm_family_head_5.GetPraenomen]#!, del valor relativo del puerto y de la opinión diplomática. [SCOPE.Custom('gm_5_chance_barter')]\nSi se niegan, obtendremos un derecho sobre #Y [gm_5_barter_target_territory.GetName]#!."
