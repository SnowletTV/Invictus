 tartessia_mission_inv_1_task_DESC:0 "Dentro de unos meses, [ROOT.GetCountry.GetRuler.GetName] pronto hará una proclamación audaz: las tribus de [ROOT.GetCountry.GetName] reconocen por la presente nuestra intención de volver a unir los pedazos rotos de la #T Monarquía Tartésica#!, con su corona y su autoridad dividida reclamada por la Cámara. De [ROOT.GetCountry.GetRuler.GetFamilyDisplayName]! \n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 tartessia_mission_inv_6_task_DESC:0 "Se ha sugerido que construyamos un lugar sagrado dentro de la ciudad de [GetProvince('(int32)1377').GetName], un lugar donde los fieles ibéricos puedan rendir culto como lo hacían en la antigüedad.\n\n[ROOT.GetCountry.GetRuler.GetName], sintiendo una oportunidad para reclamar el manto de Tartésico. Gloria y generosidad, ha decidido contratar a los mejores canteros de [ROOT.GetCountry.GetName] para esculpir un magnífico tesoro.\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
