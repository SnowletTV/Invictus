 01_fugandulu_task_3:0 "#E Kuji'i Nat#! de #E Taledan#!"
 01_salluvian_task_1_DESC:0 "Aunque los #G ligures#! del este tienen tradiciones distintas de las nuestras, nuestros pueblos mantienen relaciones amistosas. [ROOT.GetCountry.GetRuler.GetName|Y] ve una oportunidad para que [ROOT.GetCountry.GetName|G] estreche sus vínculos con los vecinos itálicos.\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 01_soodak_missions_task_24_tt2:0 "#R Esta tarea es mutuamente excluyente con '#T Entrelazarse con el continente#!'.#!"
 01_tasm_missions_2_task_8:0 "El yacimiento arqueológico gutio"
 academy_building_desc:0 "La primera academia fue fundada por Platón a principios del siglo IV a.C., en una propiedad que poseía en la Akademeia, una colina a las afueras de Atenas, donde había un olivar dedicado a Atenea, diosa de la sabiduría. Platón daba una conferencia y planteaba problemas a los miembros de la academia. Más tarde, su alumno Aristóteles fundaría el Liceo, su propia academia en Atenas, donde transmitió su filosofía y fundó una biblioteca. Ambas escuelas fueron destruidas por Lucio Cornelio Sila en el año 86 a.C. Durante el asedio de Atenas."
 aqueduct_building_desc:0 "Aunque la mayoría de los acueductos están asociados con Roma, se cree que aparecieron primero en el subcontinente indio. También en Grecia, construcciones como el acueducto de Samos, que llevó agua dulce a Pitagoreion, datan del siglo VI antes de Cristo. Los acueductos llevarían agua dulce desde ríos lejanos a las ciudades y al campo para el riego. El acueducto más largo que se conoce desde la antigüedad es el Acueducto de Valens, construido en Constantinopla en los siglos III al IV d. C. Y que llevó agua desde más de 250 kilómetros de distancia. Toda la estructura tenía más de 400 kilómetros de longitud."
 arecomicia_heritage:0 "Herencia de las aguas curativas"
 arseka_01_task_14_allow_tt:0 "El gobernante de #Y Palma#! debe haber sido asesinado por los #E Piratas de Magón#! y #Y [GetCountry('BLD').GetName]#! no debe existir."
 astakos_heritage_desc:0 "Colonia megarana establecida en el siglo VIII a. C., también supuestamente fundada por el legendario Astakos, hijo de Poseidón y la ninfa Olbia, el mayor legado de esta ciudad estaría en su destrucción por el rey bitinio Zipoetes I en 301 a. C. Y la fundación de una nueva ciudad en su lugar: Nicomedia, futura capital romana de Oriente bajo Diocleciano, bautizada con el nombre de Nicomedes I, hijo de Zipoetes."
 bactrian_mission_03_aria_task_7:0 "Hacia Aracosia"
 CANCEL_BUILDING:0 "#T Cancelar $NAME$#!\n¡Cancelar la construcción de \"$NAME|Y$\"!"
 caturigia_heritage:0 "Herencia de los reyes del combate"
 celebration_of_rishabhanatha:0 "Celebración de Rishabhanatha"
 chersos_heritage:0 "Herencia del acantilado estéril"
 claim_blood_of_ateas_desc:0 "Ateas fue un rey escita que unió las tribus escitas y murió en 339 a.C. En batalla contra Filipo de Macedonia. Ahora, muchas décadas después, podemos reclamar con éxito ser sus descendientes. Finalmente, su imperio ha sido unificado nuevamente. \n\nSolo muy pocos ahora discuten que [ROOT.GetCountry.GetRuler.GetName] es de la estirpe de Ateas."
 COHORT_NAME_south_arabian:0 "$NUM$$ORDER$ Lîmu de $HOME$"
 colchis_debug_provinces:0 "Depurar provincias de Cólquide"
 colchis_debug_provinces_desc:0 "Decisión de depuración para las provincias de Cólquide."
 commagenian_heritage_desc:0 "La región de Commagene, aunque su historia anterior a la época helenística es borrosa, parece tener una larga y continua nota a pie de página en la historia que se remonta hasta su época como reino siro-hitita al que se hace referencia en el siglo XV a.C. Como 'Kummaha', casi idéntica a la posterior ciudad arcaica de 'Kummuh', que se cree que es el mismo lugar/ciudad que la helenística Samosata, de donde supuestamente procedía el poeta ático Luciano. Existente posiblemente como sátrapa del reino armenio antes de ser una provincia bajo los seléucidas, la zona cuenta con una demografía multicultural, siendo un crisol de las culturas helénica e iraní, mejor vista en el santuario real del monte Nemrut."
 constructing_pirate_haven_allowed_tt:0 "#Y Nuestros ejércitos obtendrán la capacidad#! #G Construir refugio pirata#!#Y .#!"
 desc_tartessian_dianium_feudatory_mod:0 "Una vez conocida como Hemeroskopeion, o \"Atalaya\", esta provincia ha sido rebautizada por los conquistadores tartesios."
 deuria_heritage:0 "Herencia de los deuri"
 dhe_judea.6.desc_1:0 "El malestar ha aumentado en toda Judea y la mayoría de los seguidores del judaísmo se han negado a adoptar a los dioses de la fe [ROOT.Country.GetReligion.GetName], a pesar de nuestros esfuerzos por prohibir su religión.\n\nUn hombre llamado [SCOPE.sChar('dhe_judea_maccabee_character_scope').GetName] es el líder de una importante rebelión judía. Afirma ser el hijo de un sacerdote que asesinó a un judío de fe [ROOT.Country.GetReligion.GetName] antes de huir. Sus seguidores lo apodan Macabeo (\"martillo\"), supuestamente en reconocimiento a su liderazgo en la rebelión a lo largo de Judea.\n\nNuestros planes de traer paz duradera a la provincia han fracasado. En este momento, solo podemos luchar contra estos 'Macabeos' o cumplirles a los judíos su deseo de ser un estado independiente."
 dhe_judea.6.desc_2:0 "Nuestra decisión de dejar pendiente la cuestión del separatismo judío parece haber sido un error. Los separatistas judíos radicales, descontentos por ser gobernados por 'gentiles' extranjeros, organizaron clandestinamente una revuelta masiva.\n\nUn hombre llamado [SCOPE.sChar('dhe_judea_maccabee_character_scope').GetName] es el líder del movimiento. Afirma ser el hijo de un sacerdote que asesinó a un judío de fe [ROOT.Country.GetReligion.GetName] antes de huir. Sus seguidores lo apodan Macabeo (\"martillo\"), supuestamente en reconocimiento a su liderazgo.\n\nEn este momento, solo podemos luchar contra estos 'Macabeos' u otorgarles a Judea como estado cliente y esperar que queden satisfechos."
 diadochi_flavor.63.desc:0 "$nearchos_description$\n\nParece que [GetCharacter('(int32)71').GetPraenomen] llevó un registro detallado de sus experiencias. Ahora que se ha retirado de su cargo como consejero de #E Demetrio#!, ha podido reunirlas en una obra sobre las fronteras, extensión, población, castas, fauna, flora, culturas y ejércitos de #E India#!.\n\n[GetCharacter('(int32)71').GetPraenomen] afirma que la copia elaborada por los escribas macedonios omite detalles esenciales para cualquiera que pretenda reunificar el imperio de [GetCharacter('(int32)39').GetPraenomen]. Esos secretos podrían ser nuestros, pero exige una compensación justa por el arduo trabajo invertido en compilar esta #E Indike.#!"
 dip_friends_rivals.11.desc:0 "Últimamente, la atención del [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName] se ha concentrado en su rival, el [SCOPE.sC('rival_ruler_country_scope').GetRulerTitle], [SCOPE.sC('rival_ruler_country_scope').GetRuler.GetName] del país [SCOPE.sC('rival_ruler_country_scope').GetAdjective]. Nuestra frontera compartida con [SCOPE.sC('rival_subject_country_scope').GetName], estado súbdito de [SCOPE.sC('rival_ruler_country_scope').GetName], nos ofrece una oportunidad única para sabotear indirectamente la posición del pueblo [SCOPE.sC('rival_ruler_country_scope').GetAdjective].\n\nPodríamos abordar esta cuestión de varias formas, según qué queramos lograr. La seguridad del pueblo [SCOPE.sC('rival_subject_country_scope').GetAdjective] sin duda debe ser menos estricta que la de su señor, y sería posible infiltrarnos en su capital. Cuando lo hayamos logrado, no debería ser difícil incitar al pueblo a enfurecerse por ser esclavos de la voluntad de [SCOPE.sC('rival_ruler_country_scope').GetName]. Otra alternativa sería intentar seducir al gobernante de [SCOPE.sC('rival_subject_country_scope').GetName], el [SCOPE.sC('rival_subject_country_scope').GetRulerTitle] [SCOPE.sC('rival_subject_country_scope').GetRuler.GetName], y hacer que se ponga en contra de su señor. O simplemente podemos revelar cuán fácilmente podemos ir y venir como se nos plazca, y así provocar una crisis de confianza..."
 diplomatic_status_alliance_tooltip:0 "#T Alianza\n#! Los países aliados a menudo acudiran mutuamente en su ayuda si son atacados."
 ditionia_heritage:0 "Herencia de los ditiones"
 etruria_abandoned_the_umbrians_opinion:0 "Aprovechar la ocasión"
 etrurian_umbrian_relations_opinion:0 "Política de amistad"
 eurymenai_history:0 "[CHARACTER.GetPraenomen|E] lideró a [LEGION.GetName|E] hacia la derrota frente a Likiskos, el gobernador de [GetCharacter('(int32)32').GetPraenomen] Acarnania, Eurimenai, cerca de [PROVINCE.GetName|E]."
 fasting_for_paryushana:0 "Ayuno de Paryushana"
 fezzani_mission_01_task_06_DESC:0 "Si decidimos unificar pacíficamente el resto de Fezán, no podremos seguir la rama de dominación del árbol de misiones."
 fezzani_mission_01_task_10_DESC:0 "Las provincias circundantes deben pertenecer a #Y [SCOPE.GetRootScope.GetCountry.GetName]#!. Nuestra nación debe expandirse; hemos de actuar antes de que nuestros vecinos forjen alianzas."
 fezzani_mission_01_task_10_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! obtendrá un derecho sobre el territorio capital de un país vecino."
 flavor_egy.12.desc.2:0 "Con la posición de [flavor_egy_12_magas_scope.GetPraenomen]' en [GetProvince('(int32)3354').GetArea.GetRegion.GetName] asegurada, busca consolidar su dominio en la región como un rey independiente en la línea de Agatocles y los Diadochi.\n\nDebemos ser cautelosos y recordar cómo los dioses recompensaron la arrogancia de Ofelas. Cuando sus ambiciones crecieron más allá de la mera subordinación a [GetCountry('EGY').GetName]..."
 found_colonia_cultural_decision_desc:0 "La mejor forma de asegurar una larga lealtad en una región siempre será enviar a quienes confiamos para que la gobiernen.\nEnviemos a unos hombres y mujeres [COUNTRY.GetAdjective] de confianza para construir una nueva vida en territorio extranjero."
 germania_mod_87:0 "Tácticas itálicas"
 germania_mod_88:0 "Ingeniería itálica"
 GOVERNORSHIP_LEGION_NAME_anatolian:0 "Banak de $BASE$"
 helvia_heritage:0 "Herencia de los galos senatoriales"
 hnaw_kan_heritage:0 "Herencia de Hnaw Kan"
 iapodia_heritage:0 "Herencia de los iápodes"
 IS_DIPLO_RANGE_TRIGGER:0 "$NAME|Y$ está al alcance de los diplomáticos [COUNTRY.GetAdjective]"
 IS_NOT_DIPLO_RANGE_TRIGGER:0 "$NAME|Y$ NO está al alcance de los diplomáticos [COUNTRY.GetAdjective]"
 isauria_heritage_desc:0 "Saqueadores procedentes de las colinas del Arasos, los isaurios defendieron ferozmente su independencia y sobrevivieron al asedio de Pérdicas incendiando su propia capital, Isaura. Este pueblo montañés resistió a los imperios lidio, aqueménida y argéada, y fue reconocido como uno de los grupos de incursores más temibles del sudoeste de Anatolia."
 istria_heritage:0 "Herencia de los ilirios vénetos"
 judea_inv.53.t:0 "Hacia Arabia"
 kerasous_heritage_desc:0 "Posiblemente procedente del griego: κερασός 'cereza', Plinio el Viejo escribe que la primera cereza fue exportada desde esta ciudad colonia a Europa en época romana por medio del íntimo amigo de Sulla, Lucio Lúculo. Asentada en el siglo VI a.C. Por colonos sinopios, esta ciudad portuaria también fue célebremente visitada por Jenofonte, según consta en su Anábasis."
 libernia_heritage:0 "Herencia de los liburnos"
 lover_adoption_tooltip:0 "Como [SCOPE.sChar('target').GetName|Y] tiene hijos extramatrimoniales con [SCOPE.sC('actor').GetRuler.GetName|Y], el coste de prestigio de su adopción aumenta enormemente.\n\n"
 mahavirs_guidance_mod:0 "Guía de Mahavira"
 march_colour_debug_decision:0 "Depurar el color de las marcas"
 march_colour_debug_decision_desc:0 "Actualiza los colores de las marcas para depuración."
 me_dahae.1901.a.tt:0 "Parece que tendremos que unificar a los #Y Dahae#! por la fuerza."
 me_horn_of_africa_15_desc:0 "A medida que nuestros compatriotas [ROOT.GetCountry.GetAdjective] se familiarizan con las aguas del #E Mare Erythraeum#!, navegan cada vez más lejos de [ROOT.GetCountry.GetCapital.GetName] y a veces pasan años en el mar.\n\nNuestro [ROOT.GetCountry.GetRulerTitle], que ha acompañado a los marineros en muchas expediciones y conoce bien la navegación, estaba presente cuando descubrieron la isla de [GetProvince('(int32)7216').GetName], en el extremo oriental de #E Arabia#!. Sarapis no solo poseía gemas @gems!, sino también un puerto natural con fácil acceso al #E Sinus Persicus#! y a sus rutas comerciales. Desde entonces, [ROOT.GetCountry.GetRuler.GetName] solo desea incorporar la isla a [ROOT.GetCountry.GetName], pues su valor estratégico justifica cualquier coste."
 me_nuragic_02_inv_25.a:0 "Es hora de hacer historia..."
 me_nuragic_02_inv_25_title:0 "El regreso de los Pueblos del Mar"
 me_parthia_satrapy.1701.g:0 "«Te calumnian y di#E z#!en que ere#E z#! '#E e#!stúpido' y un '#E z#!ángano'.»"
 me_patauion_02.42.desc:0 "En nuestra gran campaña contra los itálicos hemos penetrado profundamente en sus tierras, tomando ciudad tras ciudad y derrotando ejército tras ejército. Sin embargo, sus efectivos parecen inagotables y, a este ritmo, acabaremos desgastados.\nSe ha presentado una propuesta a nuestro [SCOPE.GetRootScope.GetCountry.GetRulerTitle]: aunque despertaría la ira de muchos vecinos, un castigo severo podría impedir que las tribus itálicas vuelvan a amenazarnos. La elección es clara: devastar Italia o preservar nuestra imagen de benevolencia."
 me_paurava_14.a:0 "El oro es el mejor mediador."
 me_paurava_141.a:0 "Si con ello conservamos la paz..."
 me_paurava_141_title:0 "El precio de la paz"
 me_paurava_142.a:0 "Redibujad los mapas."
 me_paurava_14_title:0 "Fricciones en la frontera"
 me_rhodes.19.a:0 "Limitaos al vino @wine!"
 me_subject_independence.165.a:0 "Reunid a los hombres."
 me_subject_independence.165.t:0 "$gm_subject_independence_17c$: Bandas de salteadores"
 me_tartessia2_29_desc:0 "Habiendo anunciado en privado los cambios radicales planeados para [ROOT.GetCountry.GetName] a un selecto Consejo de Élites, [ROOT.GetCountry.GetRuler.GetName], ansioso por asegurarse el favor de los dioses, finalmente decidió que era el momento adecuado para dar el paso público que cambiaría el curso de la historia en Tartessia. Para siempre.\n\nAunque algunos se sorprendieron por el pronunciamiento hecho ese fatídico día, los más cercanos a la [ROOT.GetCountry.GetRulerTitle] sabían que la proclamación de la [ROOT.GetCountry.GetRuler.GetFirstName] era inevitable: las influencias corruptoras de los dioses extranjeros serían condenadas, y la Casa [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] sería Abrazar oficialmente a los antiguos dioses de nuestros antepasados."
 me_tartessia2_52_desc:0 "Si algún ejército del norte de #E Pirineo#! alberga la tonta esperanza de invadir el corazón de #E Iberia#! por tierra, entonces está persiguiendo sueños, porque el sistema de fortificaciones construido a lo largo de la frontera norte por [ROOT.GetCountry.GetRuler.GetName] les impedirá cruzar las montañas fácilmente.\n\nSe ha aumentado el tamaño de las guarniciones en los fuertes locales, lo que permite una patrulla casi constante de la frontera, y veteranos experimentados protegen los pasos, manteniendo alejado a todo aquel que intente hacer daño. Los ciudadanos de [ROOT.GetCountry.GetName]."
 me_tartessia2_9_desc:0 "El Festival de la Cosecha en [ROOT.GetCountry.GetCapital.GetName], esa gran ocasión en la que se recuerdan los abundantes regalos de [ROOT.GetCountry.Custom('get_harvest_goddess')], se está llevando a cabo actualmente, y la gran ceremonia que se llevará a cabo al concluir se acerca.\n\nFuera de las murallas de la ciudad, Se ha preparado un altar ceremonial en lo profundo del bosque, donde se han cocinado los mejores platos y se han servido jarras del mejor vino importado. En este momento crucial, [ROOT.GetCountry.GetRuler.GetName], atendido por sacerdotes, conduce un caballo al centro del altar y hace una pausa para dejar que concluyan las oraciones y los cánticos.\n\nMomentos después, cuando se da una señal, [ROOT.GetCountry.GetRuler.GetFirstName] levanta un cuchillo afilado. Y le corta la garganta al animal, enviando un chorro de sangre a la mesa de abajo. Cuando el caballo cae al suelo, se prende fuego al altar y el animal, la comida y el vino son consumidos por las llamas en una ofrenda a [ROOT.GetCountry.Custom('get_harvest_goddess')]."
 me_tartessia_11_desc:0 "Por fin, nuestros viejos rivales en [GetProvince('(int32)1371').GetName] han visto sus tontos sueños de independencia destrozados para siempre. Porque, ¿cómo podría una polis tan pequeña esperar oponerse a la supremacía de [ROOT.GetCountry.GetAdjective]? Menos mal que recobraron el sentido.\n\nLa victoria incruenta obtenida por [ROOT.GetCountry.GetRuler.GetName] seguramente pasará a la historia de [ROOT.GetCountry.GetName], porque cuando todo estuvo dicho y hecho, la ciudad pasó a nuestras manos por una canción. Y un baile."
 me_tartessia_12_desc:0 "Mientras que algunos de los generales de [ROOT.GetCountry.GetCapital.GetName] se burlaron de la insistencia de [ROOT.GetCountry.GetRuler.GetName] de que el asentamiento fortificado de [GetProvince('(int32)1369').GetName] estaba a punto de convertirse algún día en una sede de poder en [GetProvince('(int32)1369').GetArea.GetName], nadie pudo impedir que [ROOT.GetCountry.GetRulerTitle] enviara nuestras fuerzas clandestinamente a través del territorio. Frontera.\n\nA pesar de la feroz enemistad entre nuestros pueblos, nuestras levas [ROOT.GetCountry.GetAdjective] aprovecharon una fiesta local y entraron en masa por las puertas de Urso, haciéndose pasar por peregrinos y viajeros entusiasmados. Cuando se dio la señal preparada y el estallido del carnyx llenó el aire, nuestros soldados arrasaron la guarnición, y así, [GetProvince('(int32)1369').GetName] cayó ante nuestras fuerzas.\n\nCon la pérdida de su capital, las tribus de Urso se rindieron sus armas y juraron amargos juramentos de lealtad."
 me_tartessia_24_desc:0 "Un escalofrío de emoción recorrió la columna vertebral de [ROOT.GetCountry.GetRuler.GetName] cuando [ROOT.GetCountry.GetRuler.GetSheHe] recibió la noticia de que las minas en [GetProvince('(int32)1415').GetName] habían sido restauradas. Nuestros ingenieros pudieron evitar las venas agotadas que dejaron nuestros antepasados ​​y finalmente descubrieron ricas vetas de hierro @iron. Que no había sido tocado por los picos tartésicos.\n\nMientras los carros llenos de mineral se dirigen a los talleres de [ROOT.GetCountry.GetCapital.GetName] para su procesamiento, ha quedado claro para todos que algo trascendental le ha sucedido a [ROOT.GetCountry.GetName]."
 me_tartessia_26_desc:0 "Nadie que escatima un centavo cuando se trata del bienestar de [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetName] ha invertido grandes sumas de dinero y capital político personal para garantizar que nuestras levas estén familiarizadas con las tradiciones armamentísticas de los #E tartesios#! de antaño. \n\nMientras nuestros soldados entrenaban y entrenaban en las tácticas marciales de nuestros estimados ancestros, un guerrero mayor que es muy popular entre las bases, un hombre llamado #E Arganthonios#!, llamó la atención de [ROOT.GetCountry.GetRuler.GetFirstName] en honor al veterano canoso. Desarmó a cuatro hombres a la vez.\n\nSe hicieron averiguaciones silenciosamente, y se reveló al [ROOT.GetCountry.GetRulerTitle] que este Arganthonios había demostrado su valía una y otra vez en la batalla, y sería una elección natural para ascender a una posición de liderazgo."
 me_tartessia_27_desc:0 "Los visitantes de [ROOT.GetCountry.GetCapital.GetName] a menudo comentan que los deliciosos olores del pan horneado son lo primero que perciben una vez que cruzan las puertas principales y, la mayoría de las veces, siguen sus olfatos hasta llegar a una de las muchas panaderías repartidas por todo el lugar. Capital.\n\nGracias a los esfuerzos de [ROOT.GetCountry.GetRuler.GetName] para garantizar que nuestro granero principal esté siempre lleno, nuestra gente nunca tendrá que preguntarse de dónde vendrá su próxima comida."
 me_tartessia_3_desc:0 "No hace mucho tiempo que las minas de #E Tartessia#! operaban a una capacidad prácticamente inimaginable hoy en día, y aunque todavía no hemos alcanzado el dominio sobre la Tierra que disfrutaban nuestros antepasados, [ROOT.GetCountry.GetRuler.GetName] está decidido a aumentar la producción. De [ROOT.GetCountry.GetName] por cualquier medio posible.\n\nAfortunadamente para nuestras levas de [ROOT.GetCountry.GetAdjective], la riqueza de las minas no ha desaparecido en los bolsillos de los ricos comerciantes que viven en [ROOT.GetCountry.GetCapital.GetName]; de hecho, muchos de nuestros soldados han obtenido excelentes armas fabricadas por los maestros herreros de la ciudad, pues los ejércitos han sido los mayores receptores de esta riqueza material."
 me_tartessia_7_desc:0 "Aunque nuestra capital de [ROOT.GetCountry.GetCapital.GetName] está ciertamente bastante lejos de los centros civilizados de poder de los reinos orientales, estamos orgullosos de decir que los comerciantes griegos de estas tierras lejanas navegan hacia nuestros propios mercados, encontrando valor en nuestros productos producidos localmente. Eso hace que valga la pena el tiempo necesario para viajar.\n\nEsperar hacer crecer estas conexiones económicas ha sido durante mucho tiempo una prioridad para [ROOT.GetCountry.GetRuler.GetName], y aunque fue costoso construir mercados en nuestra capital, todos pueden ver la sabiduría de seguir las sugerencias del [ROOT.GetCountry.GetRuler.GetName]: parece que [ROOT.GetCountry.GetCapital.GetName] se ha convertido en una parada importante en las rutas comerciales."
 me_tartessia_9_desc:0 "El Festival de la Cosecha en [ROOT.GetCountry.GetCapital.GetName], esa gran ocasión en la que se recuerdan los abundantes regalos de [ROOT.GetCountry.Custom('get_harvest_goddess')], se está llevando a cabo actualmente, y la gran ceremonia que se llevará a cabo al concluir se acerca.\n\nFuera de las murallas de la ciudad, Se ha preparado un altar ceremonial en lo profundo del bosque, donde se han cocinado los mejores platos y se han servido jarras del mejor vino importado. En este momento crucial, [ROOT.GetCountry.GetRuler.GetName], atendido por sacerdotes, conduce un caballo al centro del altar y hace una pausa para dejar que concluyan las oraciones y los cánticos.\n\nMomentos después, cuando se da una señal, [ROOT.GetCountry.GetRuler.GetFirstName] levanta un cuchillo afilado. Y le corta la garganta al animal, enviando un chorro de sangre a la mesa de abajo. Cuando el caballo cae al suelo, se prende fuego al altar y el animal, la comida y el vino son consumidos por las llamas en una ofrenda a [ROOT.GetCountry.Custom('get_harvest_goddess')]."
