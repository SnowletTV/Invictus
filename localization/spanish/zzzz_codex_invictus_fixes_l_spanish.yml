 THE_WORLD_TOOLTIP:0 "#T Fecha actual#!\nAb urbe condita (\"a partir de la fundación de la ciudad\") es una convención de fecha usada comúnmente por los académicos en relación con Roma y la historia romana. Establece el año 1 AUC como el año de la fundación de Roma. Por lo tanto, 450 AUC corresponde al año 304 a. C. Del calendario gregoriano moderno."
