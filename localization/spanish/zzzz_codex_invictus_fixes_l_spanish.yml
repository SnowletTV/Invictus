 tutorial_conquer_sabinia_desc:0 "#W Anexa el territorio perteneciente a Sabinia.#!\n\nLos habitantes de las colinas, conocidos como los sabini, ocupan las tierras al norte. Crea un reclamo sobre su tierra al abrir diplomacia y seleccionar #Y Crear reclamo#!.\n\nPara abrir la pantalla de diplomacia con los sabini, haz clic derecho sobre cualquier territorio sabini. Para crear un reclamo, amplía la sección #Y Acciones encubiertas#! y luego selecciona #Y Crear reclamo#!. No necesitas crear un reclamo sobre sus dos provincias, cualquiera de ellas será suficiente.\n\nDespués de que hagas un reclamo, ¡asegúrate de que tus tropas están en una buena posición y declara la guerra!\n\nPara declarar la guerra, abre de nuevo la pantalla de diplomacia de los sabini y selecciona #Y Declarar guerra#!. A continuación, deberás seleccionar un #Y \"casus belli\"#!. Si seleccionaste #Y demostrar superioridad#! o #Y demostrar superioridad naval#!, ¡sufrirás un golpe de estabilidad!\n\nLos sabini intentarán luchar, pero los números romanos deberían demostrar que no son rivales para ellos."
 tutorial_increase_stability_desc:0 "#W Realiza una ofrenda religiosa.#!\n\nPara aumentar la estabilidad, abre la ventana #Y Religión#! y haz clic en la interacción #Y Realizar ofrendas religiosas#!.\n\n#! La estabilidad está cerca de #Y 50; un valor de estabilidad menor a este representa que tu nación se está acercando al caos."
