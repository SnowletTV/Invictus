 omen_vesuna_desc:0 "Vesuna era una diosa venerada principalmente por los sabinos y los pueblos circundantes. Aparece dos veces en las Tablas Iguvinas y parece haber sido una diosa de la protección y quizá de la fertilidad. También pasó a la tradición etrusca y a las mitologías umbra y romana durante el dominio etrusco del siglo VI a. C. En esa época, numerosas deidades circularon entre etruscos, latinos, faliscos, sabinos, umbros y otros pueblos itálicos.\n\n#! Efecto de apoteosis: $fertility_apotheosis_capital_effect_tt_description$"
